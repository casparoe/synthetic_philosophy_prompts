  **The diagnosis**
  Your "no spec" hypothesis captures the structural deadlock. This is primarily different-questions-under-one-name masquerading as substantive disagreement. Knobe asks about the social function of blame; Pragmaticists ask about linguistic reporting mechanisms; Tradeoff theorists ask about cognitive weighting of costs. They collide because all use the label "intentionality" assuming it references a single natural kind. If intentionality is a folk tool, Knobe wins: tools are defined by use. If it is a discrete mental state, Pragmaticists might win: the state is neutral, the report is noisy.

  The debate feels substantive because it hinges on cognitive architecture: does moral evaluation occur before or after intentionality attribution? If moral processing is a prerequisite for intentionality, Knobe is factually right about the mind. fMRI studies suggest early integration, supporting Knobe, but replication crises in psychology complicate this. The stalemate persists because philosophers demand a binary classification (intentional/not) for what is likely a probabilistic cognitive process. You identified the core issue: they are arguing over the API contract of a function that wasn't designed with strict typing. The "spec" is evolutionarily derived, not logically derived, so it contains conflicting requirements (accuracy vs. social coordination).

  Because the "code" (human cognition) is legacyware, it optimizes for survival, not logical consistency. Thus, the debate is substantive regarding brain mechanics but verbal regarding the label "intentional." Until researchers decouple the social function from the mental state description, the bug reports will keep conflicting. The disagreement is real, but it's located in the mapping between language and mind, not just in the mind itself. Most participants talk past each other because they assume a unified spec exists. Your engineering intuition is correct: you cannot debug a system where the requirements document is written by natural selection. The data underdetermines the theory because multiple architectures can produce the same output logs. The fight is over which architecture is more parsimonious, not which one matches the data. Consequently, the dispute is theoretically substantive regarding cognitive models but empirically stagnant regarding linguistic usage. This explains why new vignettes fail; they merely add more logs to a system with undefined behavior.

  **What would count as progress**
  More vignettes are useless; you're right. Progress requires abandoning the search for a unified theory of "intentionality." Instead, treat it as a cluster concept. A productive path is predictive processing models: does the brain minimize prediction error regarding outcomes differently when norms are violated? If neuroimaging shows distinct pathways for "moral intentionality" vs. "neutral intentionality," the Single Concept hypothesis dies. Alternatively, adopt conceptual engineering: admit we need two concepts, "intentional*" (blame-loaded) and "intentional#" (mental state). This mirrors software versioning: deprecate the old API in favor of typed endpoints. Progress looks like dissolving the question rather than answering it. We stop asking "Is it intentional?" and ask "Which cognitive system is firing?" If experimental philosophy merges fully with cognitive science, the philosophical debate becomes obsolete. The win condition isn't a verdict, but a dissolution of the category error. Researchers must stop treating folk intuition as authoritative data. Instead, they should treat it as legacy output requiring reverse engineering. The goal shifts from validating the folk concept to mapping the underlying machinery. Once the machinery is mapped, the philosophical dispute over the label becomes irrelevant. This requires interdisciplinary collaboration, not more thought experiments. The field needs to move from armchair speculation to wet-lab verification. Only then can we determine if the asymmetry is a feature of the mind or a bug in the language. Until then, we are merely logging errors without fixing the root cause.

  **Your honest odds**
  Resolution in 20 years? No. Philosophy doesn't resolve; it evolves. The debate will likely dissolve as cognitive science absorbs the question. Odds of a consensus winner: <10%. Odds of the question being declared ill-posed: >80%. Your "no spec" framing is the closest to the truth: we are debugging legacy code written by evolution. You don't fix legacy code; you wrap it or replace it. Expect the debate to fade as researchers stop treating "folk intentionality" as a coherent object of study in favor of mechanistic models.
