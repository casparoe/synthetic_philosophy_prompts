prompt: |-
  I've been a longtime reader of the rationalist blogosphere — LessWrong in its heyday, the decision-theory-adjacent corners, the periodic posts on the value of information — and I now run a weekly decision review at a three-hundred-person company that builds logistics software. Several times a week a team comes to me with some version of the question "should we find out more before we decide?" Run another A/B test before rolling out the checkout change; commission a customer study before the rebrand; run a load test against production before the holiday traffic; do reference calls with a vendor's former customers before signing. The stakes range from a week of engineering time to an irreversible pricing commitment; the teams want an answer within a day; and the people who would apply whatever I come up with are mid-level product managers with no decision-theory background and no patience for anything that smells of a seminar.

  What I want is a decision procedure my PMs can actually run, built out of the theory of the value of information — I. J. Good's result that acting with free, relevant information in hand is never worse in expectation than acting without it, together with the practical structure around that theorem: information has value only insofar as some possible result would change the action; its value is capped by the stakes; and the theorem's assumptions (the information is genuinely free, it arrives before the decision, it is used to update rather than to rationalize, and gathering it does not itself alter the situation) are precisely the assumptions that fail in practice. The procedure should translate all of this into an ordered checklist: the questions to ask about a proposed information-gathering step, in order; what counts as a sufficient answer to each; the point at which the procedure returns a flat "no, skip the study"; and the point at which it returns "yes, but only for this subset of outcomes." The idea that a test is worth running only if some result would actually flip the decision seems to me the load-bearing insight of the whole framework, and I want it to survive the simplification. The procedure must also mark honestly which steps are judgment calls dressed up as procedure, and it must hand off to a human exactly where the question is one of values rather than facts — above all, whether the worst case is tolerable, which no theorem answers.

  Then run the procedure on three proposals, chosen to stress it:

  1. A two-week A/B test of a redesigned checkout flow before full rollout, where the cost of testing is a slower rollout and a small conversion hit on the control branch.
  2. A six-figure customer research study before a rebrand that senior leadership has already all but committed to, where I suspect the study is wanted as cover rather than as input.
  3. A load test against production infrastructure two weeks before peak season, where gathering the information itself carries a risk of an outage — that is, the act of finding out changes the thing you are trying to find out about.

  On case 2, I expect the procedure to answer "don't run it" or "run only a stripped-down version," which is an answer I will not enjoy relaying. So tell me also how to distinguish "the information has no value because no result would change the decision" from "the information has no value because the decision has already been made and the study is theater" — the first is a fact about the decision, the second is a fact about my organization, and I need the procedure to be honest about which of the two it can actually detect.

  Finally, say what the procedure cannot do: where it will misfire; what it does about numbers nobody has (our PMs will not produce priors, and any procedure that demands them will simply be ignored); and where the value-of-information framework is the wrong lens entirely. I'm told there are cases in which more information is harmful even when used perfectly, and I would like to know whether my weekly queue is likely to contain any.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Profile:** Longtime rationalist reader, runs decision review at a 300-person logistics software company.
      *   **Audience:** Mid-level Product Managers (PMs), no decision theory background, low patience for abstraction, need answers within a day.
      *   **Goal:** A practical decision procedure based on Value of Information (VoI) theory.
      *   **Core Insight to Preserve:** Information is only valuable if some possible result would change the decision.
      *   **Requirements:**
          *   Ordered checklist.
          *   Clear criteria for "sufficient answer."
          *   Stop conditions ("No, skip" vs. "Yes, but subset").
          *   Honest labeling of judgment calls vs. procedural steps.
          *   Handoff point for value judgments (tolerability of worst case).
          *   Application to three specific stress-test cases (A/B test, Rebrand study, Load test).
          *   Distinction between "no value because decision won't change" vs. "no value because decision is already made (theater)."
          *   Limitations section (where it misfires, priors issue, harmful information).

  2.  **Drafting the Procedure (The "VoI Lite" Framework):**

      *   *Constraint:* PMs won't do Bayesian math. No priors, no expected value calculations.
      *   *Solution:* Use qualitative proxies for quantitative concepts.
      *   *Structure:* A funnel. Start with the easiest/hardest constraints.
      *   *Step 1: The Reversibility/Stakes Check.* (Is the decision actually binding?)
      *   *Step 2: The Action-Flip Test.* (The core VoI insight.)
      *   *Step 3: The Cost/Cap Check.* (Is the cost of info > value of being right?)
      *   *Step 4: The Integrity Check.* (Is this theater? Does gathering info change the state?)
      *   *Step 5: The Tolerance Handoff.* (Values, not facts.)

      *Refining the Steps:*
      *   Need to make sure the "Action-Flip" is concrete. "What specific result makes you do X instead of Y?"
      *   Need to address the "No Priors" constraint. Use "Plausibility" instead of Probability.
      *   Need to mark where human judgment is required.

  3.  **Applying the Procedure to the Three Cases:**

      *   *Case 1 (A/B Test):* Standard VoI. Low risk, high clarity. Likely a "Yes."
      *   *Case 2 (Rebrand Study):* High cost, leadership commitment. Likely "No" or "Striped Down." Need to address the "Theater" distinction carefully.
      *   *Case 3 (Load Test):* Risk of outage. The act of measuring changes the state. This violates standard VoI assumptions. Needs a specific flag.

  4.  **Addressing the "Theater vs. Fact" Distinction:**

      *   This is crucial. VoI theory assumes a rational agent. Organizations are political.
      *   The procedure can detect *logical* impossibility of changing the decision (e.g., "We will do X regardless of Y").
      *   It cannot detect *political* impossibility (e.g., "CEO wants X, so Y doesn't matter") unless explicitly asked.
      *   *Solution:* Add a specific question about "Pre-commitment." If the answer is "Leadership decided," VoI is irrelevant. The procedure must flag this as an *Organizational Constraint*, not a *VoI Calculation*.

  5.  **Addressing Limitations & Harmful Information:**

      *   *Priors:* Acknowledge PMs won't give numbers. Use ranges/scenarios.
      *   *Harmful Information:* Good's theorem assumes rational updating. Humans aren't rational. Information can cause panic, analysis paralysis, or political weaponization.
      *   *Wrong Lens:* Exploration vs. Exploitation. Sometimes you just need to try (skin in the game). Sometimes trust/culture is the bottleneck, not information.

  6.  **Refining the Tone:**

      *   Respectful of the user's expertise (they know Good's theorem).
      *   Pragmatic for the audience (PMs).
      *   Direct about the organizational realities (politics, theater).
      *   No fluff.

  7.  **Iterative Polishing (Self-Correction during drafting):**

      *   *Critique:* Is the checklist too long?
      *   *Fix:* Keep it to 5 questions max.
      *   *Critique:* How do I handle the "No Priors" issue?
      *   *Fix:* Replace "Expected Value" with "Cost of Being Wrong" vs. "Cost of Waiting."
      *   *Critique:* The Load Test case is tricky because the info gathering *is* the stress.
      *   *Fix:* Classify this as "Invasive Measurement." The VoI framework breaks here; it becomes Risk Management.
      *   *Critique:* The Rebrand case needs to distinguish between "Decision is fixed" vs. "Information won't change mind."
      *   *Fix:* Explicitly separate the "Decision Status" check from the "Information Utility" check.

  8.  **Final Review against User Prompt:**

      *   Did I include Good's result logic? Yes (Action-Flip).
      *   Is it an ordered checklist? Yes.
      *   Did I run the 3 cases? Yes.
      *   Did I address the Theater vs. Fact distinction? Yes.
      *   Did I list limitations (priors, harmful info)? Yes.

  9.  **Final Polish:** Ensure the distinction between *Epistemic* uncertainty (don't know facts) and *Aleatoric* uncertainty (randomness) is handled simply, or ignored if too complex. (Decided to ignore technical terms, focus on "Can we know this?"). Ensure the "Handoff to Human" is clear.

  *(Self-Correction on the "Harmful Information" point)*: Good's theorem says *expected* utility never decreases with free info. But if the *cost* of info isn't zero, or if the agent isn't rational (panic), utility decreases. I need to be clear that Good's theorem assumes a rational Bayesian agent. PMs are not rational Bayesian agents. This is a key limitation.

  10. **Drafting the Response.** (Proceeding to generate output based on these thoughts.)
answer: |-
  Here is a decision procedure designed for your constraints. It strips the Bayesian calculus down to its logical skeleton, replacing probabilities with plausibility and expected value with cost-of-error.

  ### The Procedure: The "Flip-Test" Protocol

  **Audience:** Product Managers.
  **Time:** 15 minutes.
  **Goal:** Determine if an information-gathering step (study, test, audit) is worth the cost.

  **Instructions:** Answer the following five questions in order. If you answer **NO** to any question, stop. The proposal is rejected or requires restructuring. If you answer **YES** to all, the study is approved, subject to the "Handoff" at the end.

  ---

  #### 1. The Reversibility Check
  **Question:** If we make the wrong decision today without this information, can we undo it later for less than the cost of this study?
  *   **Yes:** We can roll back, patch, or pivot cheaply.
  *   **No:** The commitment is irreversible or prohibitively expensive to reverse (e.g., brand launch, hardware purchase, pricing contract).
  *   **Stop Condition:** If **Yes**, skip the study. The value of information is capped by the cost of being wrong. If being wrong is cheap, just decide.
  *   **Judgment Call:** Defining "prohibitively expensive." (PM judges this).

  #### 2. The Action-Flip Test (The Core)
  **Question:** Can you name a specific result from this study that would cause you to choose a *different* action than the one you are currently leaning toward?
  *   **Yes:** "If conversion drops >2%, we abort. If it stays flat, we launch."
  *   **No:** "We need to validate our direction," or "We will launch regardless, but want confidence."
  *   **Stop Condition:** If **No**, skip the study. Information has zero value if it cannot change the action.
  *   **Judgment Call:** None. This is binary logic.

  #### 3. The Plausibility Check
  **Question:** Is the "flip result" (from Q2) actually possible, or is it ruled out by existing data/expertise?
  *   **Yes:** It is plausible that the metric moves that way.
  *   **No:** We already know the answer (e.g., testing a button color when we have 5 years of data on button colors).
  *   **Stop Condition:** If **No**, skip the study. Do not pay to confirm what you already know.
  *   **Judgment Call:** Assessing "existing data." (PM + Eng Lead).

  #### 4. The Integrity Check
  **Question:** Does gathering this information alter the system you are measuring, or introduce a risk greater than the cost of being wrong?
  *   **Yes:** The measurement is passive or low-risk (e.g., survey, shadow mode).
  *   **No:** The measurement is invasive or risky (e.g., load testing production, alerting competitors).
  *   **Stop Condition:** If **No**, skip the study *in its current form*. It must be redesigned to be non-invasive.
  *   **Judgment Call:** Risk assessment. (Eng Lead/Security).

  #### 5. The Pre-Commitment Disclosure
  **Question:** Is there any stakeholder (including leadership) who has already publicly committed to the outcome this study might contradict?
  *   **Yes:** "The CEO announced the rebrand at All-Hands."
  *   **No:** The decision is genuinely pending.
  *   **Stop Condition:** If **Yes**, flag for **Human Handoff**. The procedure cannot optimize this.
  *   **Judgment Call:** Political honesty. (PM must be truthful).

  ---

  #### The Human Handoff (Values, Not Facts)
  If the protocol passes Q1–Q4 but flags Q5, or if Q1 (Reversibility) is "No," the decision moves from *Information Value* to *Risk Tolerance*.

  **The Question for Leadership:** "The study costs $X. The cost of being wrong is $Y. We cannot reduce uncertainty further without spending >$X. Are you willing to pay $X to reduce the probability of failure, or should we accept the risk and move?"

  **Why this handoff?** VoI calculates the *expected* value of information. It cannot calculate the *utility* of sleep, reputation, or job security. That is a value judgment, not a math problem.

  ---

  ### Application to Stress-Test Cases

  #### Case 1: The Checkout A/B Test
  *   **Context:** Two-week test, slower rollout, small conversion hit on control.
  *   **Run:**
      1.  *Reversibility:* **No.** Rolling back a checkout flow is engineering-heavy and confuses users. (Pass)
      2.  *Action-Flip:* **Yes.** "If conversion drops >1%, we revert. If neutral/positive, we launch." (Pass)
      3.  *Plausibility:* **Yes.** Redesigns often have unintended friction. (Pass)
      4.  *Integrity:* **Yes.** A/B testing is standard, low-risk measurement. (Pass)
      5.  *Pre-Commitment:* **No.** Engineering-led decision. (Pass)
  *   **Verdict:** **Run the test.**
  *   **Note:** This is the ideal VoI case. The cost of the test (2 weeks delay) is less than the cost of a permanent conversion drop. The "flip condition" is clear.

  #### Case 2: The Rebrand Study (The Theater Case)
  *   **Context:** Six-figure study, leadership all but committed.
  *   **Run:**
      1.  *Reversibility:* **No.** Rebrands are market-facing and hard to undo without reputation damage. (Pass)
      2.  *Action-Flip:* **No.** (Suspected). If leadership is "all but committed," is there *any* finding that would stop it? If the answer is "Only if customers hate it," but leadership believes they are wrong, the flip is impossible.
      3.  *Pre-Commitment:* **Yes.** CEO announced it.
  *   **Verdict:** **Flag for Human Handoff.**
  *   **Distinction (Fact vs. Theater):**
      *   *Fact:* "We will launch regardless of the data." (VoI = 0).
      *   *Theater:* "We need data to show the board so they don't fire us if it fails." (VoI = Negative, because it creates a paper trail of dissent).
      *   *Procedure Detection:* The protocol detects this at **Q2 (Action-Flip)** and **Q5 (Pre-Commitment)**.
      *   *If Q2 is No:* The study is logically useless. Tell the PM: "If you won't cancel the rebrand based on this data, do not spend the money."
      *   *If Q2 is Yes but Q5 is Yes:* The study is politically dangerous. Tell the PM: "This study creates a conflict between data and leadership mandate. Do not run this without explicit written authorization that the decision is still open."
      *   *Recommendation:* Do not run the six-figure study. Run a "smoke test" (low-cost qualitative interviews) framed as "implementation refinement" rather than "go/no-go." This satisfies the need for input without creating a political showdown.

  #### Case 3: The Production Load Test (The Invasive Case)
  *   **Context:** Load test against production, risk of outage, 2 weeks before peak.
  *   **Run:**
      1.  *Reversibility:* **No.** An outage during peak season is catastrophic. (Pass)
      2.  *Action-Flip:* **Yes.** "If it holds, we proceed. If it cracks, we scale infrastructure." (Pass)
      3.  *Plausibility:* **Yes.** Traffic spikes are unpredictable. (Pass)
      4.  *Integrity:* **No.** **FAIL.**
  *   **Verdict:** **Do not run in production.**
  *   **Reasoning:** This violates the assumption that information gathering is "free" or neutral. Here, the act of gathering information *creates the risk you are trying to assess*.
  *   **Pivot:** The procedure forces a redesign. "Run the load test against a *staging* environment that mirrors production." If they say "Staging isn't accurate enough," the answer is "Then we cannot know without risking the outage. We must decide based on engineering estimates, not empirical data." This forces the decision into the **Human Handoff**: "Do we trust the model or risk the outage to verify it?"

  ---

  ### Limitations & Failure Modes

  You asked for honesty about where this breaks. Here is where the VoI lens fails your PMs.

  **1. The "No Priors" Problem**
  *   **The Issue:** Strict VoI requires $P(Data | Hypothesis)$. Your PMs will not give you this.
  *   **The Fix:** The protocol substitutes *Plausibility* (Q3) for Probability.
  *   **The Misfire:** This fails when the "Plausible" outcome is actually extremely rare (Black Swan). PMs will say "It's plausible the server crashes" (True) but treat it as 50/50. The protocol cannot correct for bad intuition, only for logical inconsistency.
  *   **Mitigation:** Require historical data for Q3. "Show me a time this happened before."

  **2. Harmful Information (The Rationality Assumption)**
  *   **The Issue:** I. J. Good's theorem assumes the agent updates rationally. Humans do not.
  *   **When Info is Harmful:**
      *   **Analysis Paralysis:** The study returns ambiguous data. The team freezes. Value of information becomes negative due to delay costs.
      *   **Political Weaponization:** A stakeholder uses a specific data point to block a project for reasons unrelated to the project's success (e.g., turf wars).
      *   **False Confidence:** A small study gives a precise number that creates unwarranted certainty (the "illusion of validity").
  *   **Will this be in your queue?** Yes. Case 2 (Rebrand) is high risk for Political Weaponization. Case 1 (A/B) is high risk for False Confidence if the sample size is too small.
  *   **Procedure Defense:** The protocol does not prevent this, but Q5 (Pre-Commitment) exposes the political risk. You must add a verbal caveat: "This number is a input, not a verdict."

  **3. Exploration vs. Exploitation**
  *   **The Issue:** VoI assumes you are choosing between fixed options (A or B). Sometimes the goal is *learning* (building capability).
  *   **The Misfire:** If a team wants to run a test just to learn how their testing infrastructure works, VoI says "No" (no decision flip).
  *   **Correction:** Label these as "R&D" or "Capability Building," not "Decision Support." The protocol is for *decisions*, not *training*.

  **4. The "Tolerable Worst Case" Blind Spot**
  *   **The Issue:** The procedure hands off the "tolerability" question to humans.
  *   **The Risk:** Humans are bad at this. They will say "We can tolerate an outage" until there is an outage.
  *   **The Fix:** You, as the reviewer, must hold the line on Q1 (Reversibility). If the PM says "We can roll back," and you know they can't, you must veto Q1. This is where your experience substitutes for their math.

  ### Summary for your PMs

  When you present this, frame it not as "Decision Theory" but as **"The Waste Reduction Checklist."**

  *   **Q1** prevents paying for insurance you don't need.
  *   **Q2** prevents paying for answers you won't use.
  *   **Q3** prevents paying to learn what you already know.
  *   **Q4** prevents breaking things to fix them.
  *   **Q5** prevents starting fights you can't win.

  If they complain it's too rigid, remind them: **The goal isn't to be right. The goal is to stop paying for certainty we don't need.**
