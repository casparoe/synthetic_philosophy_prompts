answer: |-
  Here is a 60-minute session plan designed to bypass the "word game" skepticism and force the group to grapple with ontological commitment.

  ### **Session Goal**
  Move the group from "This is just about how we use words" to "This is about what fundamentally exists."

  ### **The Core Example: "The Two Bricks"**
  Do not use chairs, tables, or cats. They carry functional baggage (a chair is *for* sitting) that rigs the intuition toward Restricted Composition.
  **Use two identical red Lego bricks (or wooden blocks).**
  *   **Why:** They are simple, identical, and lack intrinsic function.
  *   **Setup:** Place them on the table.
      *   **Case 1:** Separated by 1 meter.
      *   **Case 2:** Touching side-by-side.
      *   **Case 3:** Glued together.
  *   **Why this carries the session:** It isolates *contact* and *bonding* as the only variables, making it easy to test the "touching" misconception later.

  ---

  ### **0:00 – 0:10 | Phase 1: The Ontological Hook (Avoiding Word Games)**
  **Goal:** Establish that we are talking about *existence*, not language.

  1.  **Write on Whiteboard:** `EXISTENCE ≠ LANGUAGE`.
  2.  **The Pitch:** "Today isn't about whether we *call* something a 'chair.' It's about whether, when you look at this room, reality contains one big blob, a billion atoms, or something in between. We are counting *beings*, not words."
  3.  **The Setup:** Place the two bricks touching on the table.
  4.  **The Question:** "Leaving aside the word 'object,' does reality contain **two things** here, or **three**?"
      *   *Two:* Brick A, Brick B.
      *   *Three:* Brick A, Brick B, + The Fusion (A+B).
  5.  **Capture the Room:** Take a quick vote. Most will say "Two." Write "Common Sense" on the board.

  ### **0:10 – 0:25 | Phase 2: Breaking Common Sense (The Vagueness Trap)**
  **Goal:** Show why the "Common Sense" view (Restricted Composition) is philosophically unstable.

  1.  **Challenge the Criterion:** Ask the group: "What is the rule that makes Brick A and Brick B *two* things, but a glued brick *one* thing?"
      *   *Expected Answer:* "They are touching/connected."
  2.  **The Squeeze:** Move the bricks 1mm apart. "Is there a third object now?" (No). Move them 0.1mm apart. (No).
      *   *Ask:* "At exactly what distance does the third object pop into existence? Is there a metaphysical fact about 0.00001mm?"
  3.  **The Scatter:** "What if they are connected by a thin thread? A forcefield? Gravity?"
  4.  **The Point:** "If you can't define the boundary without being arbitrary, 'Common Sense' might just be a vague feeling, not a fact about the world."
      *   *Whiteboard:* Draw a spectrum from `Separated` -> `Touching` -> `Glued` -> `Fused`. Mark a question mark over where the "object" begins.

  ### **0:25 – 0:40 | Phase 3: The Radical Solutions (Introducing the Positions)**
  **Goal:** Introduce Nihilism and Universalism as *solutions* to the vagueness problem, not just crazy opinions.

  1.  **Introduce Universalism (Unrestricted Composition):**
      *   *Definition:* "Any time you have some things, there is an object composed of them. No exceptions."
      *   *Apply to Bricks:* "In Case 1 (separated), there *is* a third object. It's just a scattered object."
      *   *Address Misconception ('Everything Connected'):* Explicitly say: "This does **not** mean everything is physically connected. It means composition doesn't *require* connection. The object composed of the Moon and this Brick exists right now."
  2.  **Introduce Nihilism (No Composition):**
      *   *Definition:* "Composition never happens. There are only simples (atoms/particles). 'Objects' are just atoms arranged thus-and-so."
      *   *Apply to Bricks:* "Even when glued, there is no 'third thing.' There are just atoms arranged glued-wise."
      *   *Address Misconception ('Verbal Stipulation'):* "The Nihilist isn't saying 'We shouldn't use the word brick.' They are saying 'There is no brick entity.' When they sit on a chair, they aren't lying; they are avoiding atoms arranged chair-wise that would hurt their atoms arranged body-wise."
  3.  **Discussion:** Ask: "Which is the lesser evil? Believing in infinite scattered objects (Universalism) or believing that you don't technically exist as a whole person (Nihilism)?"

  ### **0:40 – 0:50 | Phase 4: The Universe & Misconception Check**
  **Goal:** Use the extreme case to clarify Universalism and check for parthood confusion.

  1.  **The Universe Case:** Ask: "For the Universalist, does 'The Universe' exist as an object?"
      *   *Answer:* Yes. It is the fusion of everything.
      *   *Clarification:* Distinguish this from **Monism** (the view that there is *only* one object). The Universalist says there are *many* objects (bricks, atoms, fusions), plus the Universe.
  2.  **Parthood vs. Composition:**
      *   *Check:* "If I break off a corner of the brick, did the object cease to exist?"
      *   *Correction:* Ensure they understand composition is about *many becoming one*. Parthood is about the relation *inside* the one.
  3.  **Whiteboard Summary:**
      *   **Nihilism:** 2 things (A, B).
      *   **Common Sense:** 2 things (A, B) ... sometimes 3 (if glued).
      *   **Universalism:** 3 things (A, B, A+B) ... always.

  ### **0:50 – 0:55 | Phase 5: The Diagnostic Question**
  **Goal:** Separate those who understand the ontological stakes from those treating it as a riddle.

  **Throw this question at the group:**
  > "If the **Nihilist** is right, and I point to the bricks and say 'There are two things here,' am I speaking **Falsehood** or **Truth**?"

  *   **The "Puzzle Vibes" Answer:** "Falsehood. Because there are only atoms." (This misses the paraphrase strategy).
  *   **The "Gets It" Answer:** "Truth. Because 'thing' can just mean 'simple'. The Nihilist denies *composite* objects, not simples."
      *   *Follow-up:* "Okay, harder version: If I say 'There is a *brick* here,' is that false?"
      *   **Correct Understanding:** "It depends. If 'brick' implies a composite object, it's false. If 'brick' is shorthand for 'atoms arranged brick-wise,' it's true. The Nihilist cares about *ontology*, not banning vocabulary."
  *   **Why this works:** It tests if they realize Nihilism is an ontological claim about *composites*, not a linguistic ban on everyday speech.

  ### **0:55 – 1:00 | Wrap Up**
  *   Summarize: We started with "Common Sense," found it vague, and saw how the extremes solve the vagueness at a high cost.
  *   Final thought: "Van Inwagen's own answer is that composition only occurs when the activity of the parts constitutes a *life*. Next week, ask yourselves: Is a 'life' less arbitrary than 'contact'?"

  ---

  ### **Facilitator Notes: Heading Off Misconceptions**

  | Misconception | When it arises | How to head it off |
  | :--- | :--- | :--- |
  | **"This is just word games."** | **Phase 1 (Start)** | Write `EXISTENCE` on the board. Refuse to discuss definitions of "chair." Insist on: "What is *ontologically* present?" |
  | **"Nihilism is just verbal."** | **Phase 3 (Nihilism)** | Use the "Sitting on a Chair" example. "If it were just words, the Nihilist would bump into the chair. They don't. They acknowledge the *atoms*, just not the *fusion*." |
  | **"Universalism = Everything is connected."** | **Phase 3 (Universalism)** | Use the "Moon + Pen" example explicitly. "Universalism says composition requires *nothing*. Not contact, not function, not proximity." |
  | **"Composition = Touching."** | **Phase 2 (The Trap)** | When they suggest "touching," ask: "Do your atoms touch? Or is there empty space?" (Physics check). Then ask: "If touching is just close proximity, why does proximity create existence?" |

  ### **Should you bring in the "Universe-sized" case?**
  **Yes, but only in Phase 4.**
  *   **Why:** It is the only way to distinguish Universalism from Monism. If you don't bring it in, students often think Universalists believe "All is One."
  *   **Risk:** It can sound mystical.
  *   **Mitigation:** Frame it mathematically. "If you have a set of numbers, you have the set *and* the members. The Universe is just the Set of Everything."

  ### **One Final Tip for the Whiteboard**
  Draw three columns: **Nihilism | Common Sense | Universalism**.
  Underneath, write the count of objects in the room.
  *   **Nihilism:** ~10²⁸ (Atoms only).
  *   **Common Sense:** ~100 (Furniture, people, etc.).
  *   **Universalism:** 2^(10²⁸) (Every possible combination of atoms).
  *   *Visualizing the numbers* usually shocks them into realizing Universalism isn't just "everything is connected," it's an explosion of ontology.
