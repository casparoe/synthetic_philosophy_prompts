      *   **The Twist:** The DAs don't *set* the choices. The FAs hold the truth. The DAs are trying to *access* pre-volitional truth.

  5.  **Address the "Grounding Problem" Experience:**
      *   How to make the DAs feel the frustration? They need to be penalized for being wrong, but they have no causal power to *make* the FAs comply. They must rely on the "truth" of the FA's character.
      *   How to make the FAs feel the freedom? They need to know they *could* spend a token to defy their own character, but it costs them something (or just uses a limited resource).
      *   *Refinement:* The "Truth" of the counterfactual exists in the FA's sealed envelope. The DA must write down what they think is in the envelope *before* the FA opens it. If the DA is right, they get points (Middle Knowledge is useful). If the DA is wrong, they lose points (Grounding problem: why did you think that was true?).
      *   *Better Refinement for Grounding:* The DA writes the counterfactual. The FA *must* follow their character card *unless* they spend a Liberty Token. The Grounding Problem arises when the DA asks: "What makes my prediction true?" The answer is "The Card." But the Card represents the creature's nature. The philosophical problem is whether that nature *determines* the choice.
