  7.  **Drafting the Plan (Iterative refinement):**
      *   *Time:* 10 min intro, 15 min setup/roles, 25 min Round 1 (Standard), 15 min Round 2 (Contrarian), 15 min Debrief.
      *   *Liberty Check:* The DAs writing the dossiers is the biggest liberty. In Molinism, God doesn't write them; they are just true. In the game, DAs *guess* them. I need to frame this as "Accessing the Book of Truth" vs "Writing Decrees."
      *   *Correction:* Give the FAs sealed envelopes with their "True Disposition." The DAs don't write the truth; they *bid* on what they think the truth is. Or, simpler: The DAs *propose* a world based on their hypothesized CCFs. The "Truth" is revealed upon play.
      *   *Decision:* Let's have the DAs submit "World Blueprints" containing CCF claims. "If we put Agent 1 in Scenario A, they will do X." Then we test it.
