      *   *Addressing the "Relocation" specifically:* Quine's reply is that framework choices are *not* purely analytic/conventional. They are judged by empirical utility (simplicity, scope). So the boundary remains blurred. The "relocation" fails because the new boundary is just as porous as the old one.

