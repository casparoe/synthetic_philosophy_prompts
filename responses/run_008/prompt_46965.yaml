answer: |-
  # The Metaphysics Night Composition Flowchart

  Welcome to this year's Metaphysics Night. Below is a decision tree designed to help you locate your intuition on the Special Composition Question. There is no need to know any philosophical terminology. Simply read each scenario and follow the path that matches your gut reaction. Only at the very end will you be told which philosophical position your answers resemble.

  ### The Decision Tree

  **Question 1: The Dining Chair**
  Imagine a standard wooden dining chair in front of you. When you look at it, is there **one single object** (the chair) present in the room, or are there merely **many pieces of wood** arranged in a specific way, with no further 'chair' object existing over and above them?
  *   **A)** There is one single chair object. *(Go to Question 2)*
  *   **B)** There are only many pieces of wood; 'chair' is just a label we use. *(Go to Question 3)*

  **Question 2: The Scattered Sum**
  Consider two very distant things: your left shoe and the Moon. Taken together, do these two items compose **one single further object** (a 'shoe-moon' entity), or do they remain just two separate things regardless of how we think about them?
  *   **A)** Yes, they compose one single object. *(Go to Question 4)*
  *   **B)** No, they remain two separate things. *(Go to Question 5)*

  **Question 3: The Living Cat**
  Since you denied the chair was a single object, consider a living cat. Is the cat **one single organism**, or is it merely **many cells** arranged cat-wise, with no further 'cat' object existing?
  *   **A)** It is one single organism. *(Go to Leaf: Organicism)*
  *   **B)** It is merely many cells; no composite objects exist at all. *(Go to Leaf: Nihilism)*

  **Question 4: The Strange Arrangement**
  You believe composition happens even for scattered things like shoes and moons. Now imagine particles scattered randomly across the entire universe with no physical connection. Do these particles **still compose one single object**?
  *   **A)** Yes, absolutely. *(Go to Leaf: Universalism)*
  *   **B)** I am not sure; it seems there is a fact of the matter, but I cannot describe a rule for it. *(Go to Leaf: Brutalism)*

  **Question 5: The Glued Statues**
  You believe composition is restricted (shoes and moons don't count). Now imagine two clay statues that are firmly glued together at the base. Do they now compose **one new single object**, or do they remain **two statues that are touching**?
  *   **A)** They become one new single object. *(Go to Leaf: Contact View)*
  *   **B)** They remain two statues; glue does not create new existence. *(Go to Question 6)*

  **Question 6: The Committee**
  Consider a committee of five people. They have no physical bond like glue, but they act together for a purpose. Does the committee count as **one single thing** distinct from the five members, or is it just **the five members**?
  *   **A)** It is one single thing (a functional object). *(Go to Leaf: Functionalism)*
  *   **B)** It is just the five members. *(Go to Question 7)*

  **Question 7: The Naming Convention**
  Finally, consider a random crowd at a football match. If you point at them and name them 'The Tuesday Group', have you **made them into an object** by speaking, or was it already a matter of fact whether they were an object before you spoke?
  *   **A)** I made them into an object by naming them; it depends on our language. *(Go to Leaf: Deflationism)*
  *   **B)** It was already a matter of fact; language doesn't change reality. *(Go to Leaf: Vague Restrictionism)*

  ***

  ### The Leaves: Your Position

  *   **Mereological Nihilism:** (From Q3-B) You hold that no composite objects exist. There are only simple particles (or cells, or bits of wood). Tables, chairs, and cats do not strictly exist; only their parts do.
  *   **Organicism:** (From Q3-A) You hold that composition occurs, but only for living things. Atoms compose cats, but they do not compose chairs or statues.
  *   **Universalism:** (From Q4-A) You hold that composition is unrestricted. Any collection of things, no matter how scattered or unrelated, composes a further object.
  *   **Brutalism:** (From Q4-B) You hold that composition is unrestricted (like the Universalist), but you deny there is any informative principle or rule explaining *why*. It is simply a brute fact that any things compose a whole.
  *   **Contact View:** (From Q5-A) You hold that physical contact or bonding is the necessary condition for composition. Scattered things don't count, but glued things do.
  *   **Functionalism:** (From Q6-A) You hold that composition depends on function or activity. Things compose an object when they work together towards a common end (like a committee or a machine).
  *   **Deflationism:** (From Q7-A) You hold that the question rests on a mistake. 'Object' is a term of our language, not a feature of the world. We decide when composition occurs by how we choose to speak.
  *   **Vague Restrictionism:** (From Q7-B) You hold that there is a fact of the matter about restricted composition, but there is no sharp boundary. It is objectively indeterminate exactly when a heap of pebbles becomes one object.

  ***

  ### Notes on Logical Space and Unoccupied Branches

  In constructing this tree, I have mapped the logical possibilities first and assigned the labels second. However, some combinations of answers are theoretically problematic.

  **Unoccupied or Unattractive Combinations:**
  *   **Yes to Scattered Sums (Q2) but No to Dining Chair (Q1):** This path is not available in the tree because it is logically incoherent. If *any* collection of things composes an object (Universalism), then a collection of wood arranged chair-wise must compose a chair. One cannot consistently affirm the existence of 'shoe-moons' while denying the existence of chairs.
  *   **No to Dining Chair (Q1) but Yes to Glued Statues (Q5):** This combination is unoccupied because it is deeply unattractive. It implies that natural joints in wood fail to create an object, but artificial glue succeeds. While not strictly incoherent, no prominent philosopher holds that glue has metaphysical powers that wood joints lack.

  **Indistinguishable Leaves:**
  *   **Universalism vs. Brutalism:** I must flag honestly that this tree cannot fully separate these two positions using cases alone. Both the Universalist and the Brutalist answer 'Yes' to every case of composition (Chairs, Cats, Shoe-Moons). They differ only on whether there is a *principle* explaining this. Question 4 attempts to probe this by asking about a 'rule', but a respondent might struggle to distinguish between 'it is a logical truth' and 'it is a brute fact' without technical training. If you landed on Brutalism, you may well be a Universalist who is simply sceptical about explanations.

  ***

  ### Closing Reflection: What Would Change My Mind?

  The branch placement I am least confident in is the **Deflationism** leaf (Question 7). I have placed it at the end of the 'Restricted' path, assuming that those who believe composition is unlimited (Universalists) are less likely to be deflationists. However, a Universalist could also be a deflationist, arguing that 'everything composes' is true only because of how we define 'object', not because of reality. To fix this, I would need to move the 'Naming Convention' question to the very start of the tree. However, I kept it at the end because deflationism often arises as a reaction to the difficulty of drawing boundaries in the restricted cases (like the heap of pebbles).

  The sort of counterexample that would force me to rebuild the tree entirely, rather than merely trim a leaf, would be a **case-based distinction between Functionalism and Organicism**. Currently, the tree separates them by asking about Committees (Function) after establishing that Statues (Contact) don't count. But if a member intuition is that a *statue* counts as an object due to its artistic function, while a *committee* does not, the current 'Contact then Function' order fails to capture that nuance. If I found that members consistently accepted artifacts (chairs) but rejected organisms (cats) — perhaps viewing life as merely mechanical — the entire 'Nihilism vs Organicism' split at Question 3 would collapse, requiring a fundamental restructuring of the logical space from 'Life vs Non-Life' to 'Artifact vs Natural Kind'.
