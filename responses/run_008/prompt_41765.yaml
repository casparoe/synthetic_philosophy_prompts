answer: |-
  Here are ten interview questions designed to press the nuances of Fuller's legal philosophy, including the three mandatory topics and seven additional lines of inquiry that avoid restating the core position. Each includes a follow-up anticipated based on a standard Fullerian defense.

  ### 1. The Poisoner's Craft (Hart's Efficiency Objection)
  Hart famously argued that the eight desiderata are merely principles of efficient technique, analogous to the skills a poisoner uses to ensure their craft succeeds; a poisoner can be virtuous *as a poisoner* while pursuing a vicious end. You defend the view that these principles constitute a genuine morality. If a regime satisfies all eight desiderata perfectly but directs the legal system toward a substantively evil end, such as apartheid or ethnic cleansing, in what sense has the "inner morality" actually constrained the evil, rather than simply making the oppression more efficient?

  *   **Follow-up:** You will likely reply that a regime pursuing such substantive evil will inevitably find the eight desiderata self-defeating in practice, as terror requires secrecy and retroactivity to function. But historically, totalitarian regimes have often maintained a facade of strict legality for long periods. If the "self-defeating" mechanism is slow to act, doesn't that concede Hart's point that for a significant duration, the inner morality is compatible with substantive evil?

  ### 2. The Grudge Informer and Judicial Fiction
  In the *grudge informer* cases, Fuller argued that Nazi statutes were so deficient in the inner morality that they ceased to be law, allowing postwar courts to punish informers without resorting to retroactive legislation. Critics argue this forced German courts to maintain a fiction of legal continuity that didn't exist, straining judicial integrity to avoid Hart's preferred solution of honest retroactivity. Did Fuller's account actually deliver the moral verdict he wanted, or did it merely provide a rhetorical cover for courts that were unwilling to admit they were making new law?

  *   **Follow-up:** If you argue that preserving the fiction was necessary to maintain the long-term integrity of the legal system, does that imply that Fuller's theory prioritizes the *appearance* of legal continuity over the transparency of judicial reasoning? At what point does preserving the "myth" of law become its own form of immorality?

  ### 3. Algorithmic Governance and the Desiderata
  Consider a modern administrative state that uses proprietary risk-score algorithms to determine eligibility for public benefits. These models update continually, which seems to violate Fuller's principle of constancy, and their scoring logic is often opaque, violating promulgation and congruence between announced rule and official action. Can an algorithmic administrative system satisfy the eight desiderata at all, or does the very nature of machine learning make it incompatible with Fuller's conception of law?

  *   **Follow-up:** You will likely suggest that we must regulate these algorithms to force transparency and stability to bring them within the rule of law. But if the predictive accuracy of the model depends on the very opacity and fluidity you seek to curb, are you arguing that we must sacrifice administrative efficacy to satisfy the inner morality, or that much of the modern regulatory state is already illegitimate by Fuller's lights?

  ### 4. The Threshold of Failure
  Fuller suggests that a total failure in any one of the eight ways results in something that is not simply bad law, but *not law at all*. However, in practice, legal systems often tolerate significant deficiencies—for example, vague statutes or retroactive tax corrections—without collapsing into non-law. Where is the threshold? Is there a quantitative metric for when a violation of the inner morality becomes a qualitative failure of legality, or is this distinction purely a matter of judicial interpretation?

  *   **Follow-up:** If the threshold is indeterminate and left to judicial discretion, doesn't that reintroduce the very uncertainty Fuller sought to eliminate? How does a citizen know when a law has failed so badly that they are no longer morally obligated to obey it, without waiting for a court to tell them so?

  ### 5. Law vs. Managerial Direction
  Fuller distinguishes between law, which governs the interaction of citizens, and managerial direction, which governs the hierarchy of a specific organization. Yet, the modern welfare state increasingly governs through licenses, permits, and administrative guidelines that look more like managerial directives than general statutes. Has the expansion of the administrative state rendered Fuller's distinction obsolete, effectively turning the citizen into a subordinate in a state-managed enterprise?

  *   **Follow-up:** If you maintain the distinction holds, does that imply that citizens subject to administrative regulations are not being treated as responsible agents capable of following rules, but rather as resources to be managed? If so, does Fuller's theory demand a radical rollback of the administrative state to restore the proper lawgiver-subject reciprocity?

  ### 6. Reciprocity in Polarized Societies
  The core of Fuller's inner morality is reciprocity: the lawgiver owes the subject a system that can be followed, and the subject owes the lawgiver fidelity. In a deeply polarized society where one political faction views the other's legislation as existential threats, this reciprocity often breaks down. Can the inner morality survive when the political culture no longer accepts the legitimacy of the opposition's lawmaking, or is Fuller's theory dependent on a level of consensus that no longer exists?

  *   **Follow-up:** You might argue that adherence to the eight desiderata is precisely what rebuilds trust in polarized times. But if one party weaponizes procedural regularity to enact substantive harms (e.g., using clear, prospective laws to restrict voting), does Fuller's framework offer any resources to resist that, or does it demand fidelity to procedurally perfect but substantively hostile laws?

  ### 7. The Bridge to Outer Morality
  Fuller insists the inner morality is distinct from substantive justice (outer morality), yet he implies that adherence to the inner morality makes it harder to achieve substantive evil. Is this causal link empirical or conceptual? If it is empirical, it is vulnerable to counter-examples (as in Question 1). If it is conceptual, does that not collapse the distinction between procedure and substance, effectively turning Fuller into a natural law theorist in positivist clothing?

  *   **Follow-up:** If you concede the link is empirical and contingent, does that weaken the moral force of the obligation? Why should a legislator feel a *moral* duty to maintain the inner morality if doing so does not guarantee, or even reliably correlate with, just outcomes?

  ### 8. The Role of the Judge
  Fuller places a heavy burden on judges to be the guardians of the inner morality, requiring them to interpret statutes in light of the eight desiderata. Hart worried this grants judges too much discretion, effectively allowing them to legislate from the bench under the guise of maintaining legal morality. How do we prevent Fuller's judge from becoming an unelected philosopher-king who invalidates democratic will based on subjective assessments of "clarity" or "congruence"?

  *   **Follow-up:** You will likely argue that judges are constrained by the text and the history of the legal system. But if the eight desiderata are open-textured standards rather than bright-line rules, isn't the constraint illusory? Does Fuller's theory ultimately rely on a virtuous judiciary that cannot be institutionally guaranteed?

  ### 9. States of Emergency
  Fuller's system relies on stability and non-retroactivity. However, during genuine states of emergency (pandemics, insurrections, war), governments often must act retroactively or through vague directives to ensure survival. Does Fuller's theory allow for a "suspension" of the inner morality during emergencies, or does it maintain that even in a crisis, a government that violates the eight desiderata loses its claim to legality?

  *   **Follow-up:** If you argue the inner morality holds even in emergencies, does that render Fuller's theory utopian and disconnected from the realities of statecraft? If you allow for suspension, how do you prevent the "emergency" from becoming a permanent excuse to bypass the inner morality, which is a common historical trajectory for authoritarian regimes?

  ### 10. The Legacy of the Debate
  Sixty years after the Hart-Fuller exchange, legal positivism has evolved (e.g., inclusive positivism) to accommodate some moral criteria, while natural law theory has softened its claims. In your view, did Fuller win the debate by shifting the terms, or did he lose by failing to provide a hard criterion for invalidating unjust laws? Why should a contemporary legal scholar care about this specific mid-century disagreement rather than moving on to newer frameworks of legitimacy?

  *   **Follow-up:** If you argue Fuller won because he highlighted the moral agency of the legal subject, does that mean the primary value of his theory is not in adjudication, but in civil disobedience? Is the "inner morality" ultimately a tool for the citizen to judge the state, rather than a tool for the state to judge the citizen?
