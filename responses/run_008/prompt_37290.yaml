      *   Epistemicism (Theory): Perfect.
      *   Supervaluationism: The fuzzy logic claim undermines the technical understanding. Deduct points.
      *   Analogy: The interpretation of Epistemicism here contradicts the earlier correct definition (margin-for-error is in-principle, not practical). Deduct points.
