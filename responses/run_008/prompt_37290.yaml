      *   On the Analogy: The student says "if we had... a perfect grasp of how the community uses 'bald', we could in principle locate the cutoff." Williamson explicitly denies this. Usage *constitutes* the meaning, and usage is not sharp. So even with perfect grasp, there is no sharp fact to find *until* you fix the precisification, but the epistemicist says there *is* a sharp fact. Wait. Epistemicism says there *is* a sharp fact determined by usage. But we can't know it. The student says "perfect grasp... we could locate." If you have a perfect grasp of usage, and usage determines the boundary, do you know it? Williamson says no, because knowledge requires safety/margin for error. You can have a true belief about the cutoff, but you can't *know* it because your belief wouldn't be safe (nearby worlds you'd be wrong). So the student's claim that "perfect grasp... we could locate" implies knowledge is possible with better tools. Williamson says knowledge is *impossible* regardless of tools. So yes, the student is wrong on the *nature* of the unknowability.

