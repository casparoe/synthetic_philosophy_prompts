  so I've been trying to figure out what my gut actually says about when something is "above and beyond the call of duty" versus just plain duty, and I want a principle. You're a professional philosopher working in normative ethics — think carefully, maybe start with some quick brainstorming about candidate principles before you commit to one, and don't just hedge on everything.

  here are my verdicts on cases:

  - soldier jumps on a grenade to save squadmates: above and beyond, obviously
  - donating a kidney to a stranger: above and beyond
  - pulling a drowning kid out of a shallow pond, ruining your shoes and being late to work: NOT above and beyond, that's just obligatory. you'd be a monster to walk past
  - keeping my promise to drive a friend to the airport at 5am, big hassle: duty, not above and beyond, even though it costs me way more than giving blood does
  - donating blood every couple months: somehow above and beyond, even though its cheap and easy for me
  - staying late to fix a mistake I made at work: duty
  - staying late to fix a coworker's mistake so they dont get blamed: above and beyond. same cost, different verdict, and I can't fully explain it
  - telling a friend a hard truth about their relationship when nodding along would be easier: duty, not above and beyond

  my tentative principle was: an act is above and beyond when it involves a sacrifice bigger than duty requires. but that gets the promise case wrong (huge sacrifice, still just duty) and the blood case wrong (tiny sacrifice, still feels above and beyond), so it needs surgery, not a bandaid.

  what principle actually captures all of this? does it need something like "for whose benefit" or "did you already commit to it" built in? tell me what the resulting principle says about the case I keep flip-flopping on: a parent donating a kidney to their own child. part of me says that's just duty for a parent, part of me says it's clearly above and beyond, I genuinely can't tell which my gut settles on. and please be honest about which of my verdicts your principle can't save — I'd rather drop a verdict than bolt on some ugly epicycle.
