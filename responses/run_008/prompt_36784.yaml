answer: |-
  Here is the analysis you asked for. I will not hedge. In normative ethics, the distinction between the *obligatory* (duty) and the *supererogatory* (above and beyond) is often muddied by focusing on the wrong variable. Your initial principle focused on **cost** ("sacrifice bigger than duty requires"). As you noticed, that fails because high-cost promises are duties, and low-cost blood donations are supererogatory.

  The variable that matters is not cost, but **entitlement**. The question is not "How much does this hurt you?" but "Does the beneficiary have a moral claim right against you?"

  ### Brainstorming Candidate Principles

  Before committing, I considered three standard frameworks:

  1.  **Utilitarian Cost-Benefit:** Maximize good. (Rejected: Fails your verdicts. Blood donation creates huge good for low cost, yet you classify it as A&B).
  2.  **Role Ethics:** Duty is defined by social roles (parent, soldier, friend). (Rejected: Fails the Pond case. You have no role relationship with the drowning stranger, yet it is duty).
  3.  **The Entitlement/Claim Principle:** Duty exists when another person has a valid moral "claim" on your actions. A&B exists when you act without a claim being made.

  The third option is the only one that survives your data set, but it requires a specific formulation regarding *bodily integrity* versus *external resources*.

  ### The Principle: The Tripartite Claim with Bodily Sovereignty

  Here is the principle that captures your verdicts:

  **An act is Duty if and only if the beneficiary has a valid moral claim against the agent, established by one of three triggers, provided the act does not violate Bodily Sovereignty.**

  **The Three Triggers for a Moral Claim:**
  1.  **Voluntary Assumption:** You explicitly or implicitly agreed to the obligation (Promises, Employment, Friendship norms).
  2.  **Causal Responsibility:** You created the harm or risk (Fixing your own mistake).
  3.  **Easy Rescue:** You can prevent immediate, severe physical harm to an identifiable person at low cost to your *external* resources (time, money, shoes).

  **The Bodily Sovereignty Constraint:**
  No moral claim can compel the surrender of **bodily integrity** (blood, organs, life) unless you have *specifically* contracted to do so (e.g., a paid clinical trial) or caused the harm directly to their body. You can owe people your time and effort; you do not owe people your parts.

  **Definition:**
  *   **Duty:** A claim exists + No bodily sovereignty violation.
  *   **Above & Beyond:** No claim exists OR the act requires violating bodily sovereignty.

  ---

  ### Testing the Principle Against Your Verdicts

  Let's run your cases through the machine to ensure it holds.

  *   **Soldier/Grenade:** **Above & Beyond.**
      *   *Trigger:* Voluntary Assumption (Military).
      *   *Constraint:* Violates Bodily Sovereignty (Life). The military contract covers risk of death, not guaranteed self-sacrifice.
      *   *Verdict:* Matches yours.
  *   **Kidney/Stranger:** **Above & Beyond.**
      *   *Trigger:* None.
      *   *Constraint:* Violates Bodily Sovereignty.
      *   *Verdict:* Matches yours.
  *   **Pond/Shoes:** **Duty.**
      *   *Trigger:* Easy Rescue (Immediate peril, low external cost).
      *   *Constraint:* No bodily violation (shoes/time are external).
      *   *Verdict:* Matches yours.
  *   **Promise/Airport:** **Duty.**
      *   *Trigger:* Voluntary Assumption.
      *   *Constraint:* No bodily violation (time/effort).
      *   *Verdict:* Matches yours.
  *   **Donating Blood:** **Above & Beyond.**
      *   *Trigger:* None (Stranger).
      *   *Constraint:* Violates Bodily Sovereignty (intrusion into body).
      *   *Verdict:* Matches yours. (This explains why Blood is A&B but Pond is Duty: one uses the body, one uses external goods).
  *   **Fix Own Mistake:** **Duty.**
      *   *Trigger:* Causal Responsibility.
      *   *Constraint:* No bodily violation.
      *   *Verdict:* Matches yours.
  *   **Fix Coworker's Mistake:** **Above & Beyond.**
      *   *Trigger:* None (No causation, no promise to cover them).
      *   *Constraint:* No bodily violation, but without a trigger, there is no claim.
      *   *Verdict:* Matches yours.
  *   **Hard Truth:** **Duty.**
      *   *Trigger:* Voluntary Assumption (Friendship implies norms of honesty).
      *   *Constraint:* No bodily violation.
      *   *Verdict:* Matches yours.

  ---

  ### The Flip-Flop Case: Parent Donating Kidney to Child

  You asked for a definitive verdict based on this principle, not a hedge.

  **Verdict: Above and Beyond.**

  **Reasoning:**
  While parenthood is the thickest form of **Voluntary Assumption**, the **Bodily Sovereignty Constraint** acts as a trump card. You owe your child care, protection, financial support, and emotional labor. You can be morally condemned for failing to drive them to the hospital (external resources/time). However, you cannot be morally condemned for failing to surrender an organ.

  To classify this as *Duty* implies the child has a *right* to your kidney. If they have a right, you are violating their rights by refusing. This turns a tragic medical situation into a moral injustice perpetrated by the parent. The principle holds that while a parent *should* donate, and failing to do so might be grounds for deep relational estrangement, it is not a violation of duty in the same way walking past the pond is. It remains a heroic gift, not a debt payment.

  ---

  ### The Cost: Which Intuition Gets Sacrificed?

  You asked me to be honest about where the principle bites. A principle that fits all your data points perfectly must draw a hard line somewhere that might feel counterintuitive in edge cases.

  **The Casualty:** The intuition that **"Parents owe their children everything."**

  My principle forces us to accept that parental duty has a hard stop at the skin. Many people feel that if a parent *can* save their child with a kidney and *doesn't*, they are a "monster" (similar to the pond walker). My principle says **no**. The pond walker violates a basic human claim (Easy Rescue). The parent refuses a bodily sacrifice (Sovereignty).

  If you hold the intuition that the parent is *obligated* to donate, you must reject the Bodily Sovereignty Constraint. But if you reject that constraint, you cannot explain why **Blood Donation** to a stranger is Above & Beyond. If we can conscript parents' bodies for children, why can't we conscript citizens' bodies for the state (Grenade) or strangers for the greater good (Blood)?

  To keep your verdict on Blood and the Grenade consistent, you must accept the verdict on the Parent: **It is the highest form of love, but it is not a duty.** It is the limit of what can be owed.
