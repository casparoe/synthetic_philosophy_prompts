answer: |-
  Here are the predictions, the analysis of her underlying logic, and the test case to settle the argument.

  ### Part 1: Predictions for the Three New Cases

  Based on the pattern of her past verdicts, here is how she will likely rule on the new scenarios:

  1.  **The 30-Year Resident (National Vote):** **No.**
      *   *Reasoning:* She explicitly qualified her support for the 30-year resident with "at least in local elections." This phrasing suggests a ceiling. She distinguishes between the *community* (where residence grants authority) and the *nation-state* (where citizenship grants authority). Since this resident never took citizenship, she likely views them as a member of the town, but not the polity.
  2.  **The 16-Year-Old Citizens (With Jobs/Taxes):** **No.**
      *   *Reasoning:* Her verdict on children was "obviously can't vote." This suggests she views voting as requiring a threshold of capacity or maturity, not just economic contribution. If contribution were the key, prisoners (who generally do not contribute economically) would be out, but she keeps them in. Age is a bright line for her that overrides tax status.
  3.  **The Undocumented Immigrant (15 Years, Local Vote):** **Yes.**
      *   *Reasoning:* This is the closest call, but the "Prisoner" precedent is the tiebreaker. She allows citizens who have broken serious laws (prisoners) to keep their vote. This suggests that legal transgression does not automatically forfeit political rights. The key differentiator for her seems to be *transience* vs. *roots*. Seasonal workers leave; this man has been there 15 years with children in school. He fits the "community member" profile of the 30-year resident, despite the lack of papers.

  ### Part 2: Candidate Rules

  You are right that no single simple rule fits. Here are the three strongest candidate principles that attempt to explain her verdicts:

  **Rule A: The "Stakeholder" Principle**
  *   *Definition:* You vote if the laws significantly affect your daily life and future.
  *   *Fit:* Explains the 30-year resident, the undocumented immigrant, and the prisoners.
  *   *Failure:* Cannot explain the Expatriates. They live abroad and are rarely affected by domestic laws, yet she grants them the vote. It also struggles with Tourists who are affected by laws while present but are denied the vote.

  **Rule B: The "Formal Membership" Principle**
  *   *Definition:* You vote if you hold a formal legal bond with the state (Citizenship).
  *   *Fit:* Explains the Expatriates, the Prisoners, and the 16-year-olds (if they were allowed).
  *   *Failure:* Cannot explain the 30-year resident non-citizen. If citizenship were the only key, she would have denied them the local vote.

  **Rule C: The "Dual-Track Jurisdiction" Principle (Best Fit)**
  *   *Definition:* Voting rights are split by level of government.
      *   **National Track:** Requires **Citizenship**. (Explains Expats = Yes, 30-Year Resident National = No).
      *   **Local Track:** Requires **Permanent Social Integration**. (Explains 30-Year Resident Local = Yes, Tourists/Students/Seasonal = No).
      *   **Universal Constraint:** Requires **Moral/Cognitive Capacity**. (Explains Children = No, Prisoners = Yes).
  *   *Why it fits best:* It is the only model that accommodates the tension between the Expatriate (Citizen without presence) and the 30-Year Resident (Presence without citizenship). It treats national voting as an act of *allegiance* and local voting as an act of *community governance*. It also explains why prisoners vote (they retain capacity and membership) while children do not (they lack capacity).

  ### Part 3: The Decisive Test Case

  To distinguish the **Dual-Track Rule** from a pure **Stakeholder Rule** or a pure **Membership Rule**, you need a case where Legal Status and Social Fact are deliberately severed.

  **The Case to Bring Up:**
  > "What about a citizen who has lived in this town for 40 years, pays taxes, and raises kids here, but **formally renounces their citizenship** tomorrow to become a citizen of another country, while promising never to move away?"

  **Why this distinguishes the rules:**
  *   **If she says they keep the Local Vote:** She prioritizes *Social Fact* over *Legal Status* entirely. (Supports a pure Stakeholder/Residence view).
  *   **If she says they lose all votes:** She prioritizes *Legal Status* as the foundation for *any* political right. (Supports a pure Membership view).
  *   **If she says they lose the National Vote but keep the Local Vote:** This confirms the **Dual-Track Rule**. It proves she sees local voting as a right of *residency* and national voting as a right of *allegiance*.

  ### Part 4: What She Thinks a Vote Is

  Her verdicts suggest she does not hold a monolithic view of what a vote represents. Instead, she holds a **Pluralist** view, where the vote serves different functions at different levels.

  1.  **For National Elections: A Badge of Membership.**
      *   The vote is an incident of citizenship. It is owed to members of the national club regardless of where they live (Expats) or what they have done wrong (Prisoners). It is not about "interest" (since Expats have little interest) or "contribution" (since Prisoners/Expats may not contribute). It is about *belonging*.
  2.  **For Local Elections: A Say for Anyone Whose Interests Are at Stake.**
      *   The vote is a tool for community governance. It is owed to anyone who is effectively part of the local fabric (30-Year Resident, potentially the Undocumented Immigrant). It is denied to those who are transient (Tourists, Students), regardless of their legal status, because their interests are not permanently tied to the outcome.
  3.  **The Universal Constraint: Capacity.**
      *   Regardless of membership or stake, she views the vote as requiring agency. This is why children are excluded despite having interests (parents represent them) and why prisoners are included (they retain agency).

  **Conclusion:**
  She is not inconsistent; she is a **Federalist**. She believes the "People" in "We the People" means something different for the Federal government (Citizens) than it does for the Town Council (Neighbors). Your argument has lasted years because you are likely arguing for a single principle (e.g., "Everyone affected should vote" or "Only citizens should vote"), while she is applying two different principles to two different spheres of power. To resolve the argument, you must stop asking "Who should vote?" and start asking "Vote for *what*?"
