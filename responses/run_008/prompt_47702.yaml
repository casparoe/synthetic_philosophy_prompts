answer: |-
  This is a profound set of intuitions that cuts to the heart of the individuation of scientific theories. You are effectively asking for a criterion of theoretical identity that distinguishes between *cosmetic* differences (notational variants, conventionalist redescriptions) and *substantive* differences (genuine ontological rivals), even in the absence of empirical discrimination.

  Before committing to a principle, let us briefly brainstorm the standard candidates in the literature to see why they might fail to capture your specific pattern of verdicts.

  **Brainstorming Candidate Principles**

  1.  **The Ramsey Sentence Criterion:** This suggests that if two theories share the same Ramsey sentence (the existential generalisation over their theoretical terms), they are the same theory.
      *   *Problem:* This is too coarse. It might correctly group (1) and (4), but it risks grouping (2) as well, since both Many-Worlds and Collapse yield the same observational existentials. It fails to capture your intuition that (2) involves a genuine rivalry.
  2.  **The Simplicity/Parsimony Criterion:** This suggests we should reject the theory with more ontological baggage (e.g., the ether, the universal force).
      *   *Problem:* This helps decide *truth*, but not *rivalry*. You treat (2) as genuine rivals despite Many-Worlds often being accused of ontological extravagance. Furthermore, simplicity is a virtue, not a criterion of identity.
  3.  **The Causal Power Criterion:** Theories are distinct if they posit entities with different causal powers.
      *   *Problem:* In (1), the universal force *does* have causal power (it distorts rods). In (3), the ether was thought to cause contraction. Yet you lean towards dismissing them. The issue is not the presence of causal power, but its *integration* and *detectability*.

  **The Proposed Principle**

  After weighing these options against your five verdicts, I propose we adopt what I shall call the **Principle of Integrated Ontological Commitment (PIOC)**.

  **Statement of the Principle:**
  Two empirically equivalent theories, $T_1$ and $T_2$, are to be regarded as merely notational variants (or one as a degenerate version of the other) rather than genuine rivals if and only if the ontological differences between them satisfy the **Condition of Inert Isolation**. Conversely, they are genuine rivals if the ontological differences entail a divergence in the **Causal-Modal Structure** of the world.

  The **Condition of Inert Isolation** is met when the differing ontological posits of one theory:
  1.  **Are Protective:** They are introduced solely to preserve the empirical predictions of the core theory against a specific interpretative challenge, without generating independent explanatory leverage; AND
  2.  **Are Structurally Decoupled:** They do not alter the internal nomological relationships between the theory's other variables, acting as a 'wheel connected to nothing' or a universal conspiracy that leaves the system's internal logic unchanged.

  **Motivation from Your Verdicts**

  *   **Verdict 1 (Reichenbach):** This motivates Clause 1 (Protective). The universal force is posited *only* to save Euclidean geometry from non-Euclidean evidence. It is a protective device. It also motivates Clause 2 (Decoupled), as the force acts universally and does not change the internal relations of physical laws, only their metric interpretation.
  *   **Verdict 4 (Chemical Padding):** This motivates Clause 2 (Decoupled). The 'idle degree of freedom' is the definition of a wheel connected to nothing. It is structurally decoupled from the bonding mechanics.
  *   **Verdict 5 (Fiat Boundary):** This motivates Clause 1 (Protective). The boundary is a restriction on access, not a feature of the system. It protects the theory from refutation by limiting the domain of observation rather than explaining the phenomena within that domain.
  *   **Verdict 2 (Many-Worlds vs. Collapse):** This motivates the **Causal-Modal Structure** exception. Even if empirically equivalent, these theories posit fundamentally different histories for the quantum state (branching vs. pruning). The difference is not an isolated appendage; it is a divergence in the fundamental dynamics (unitary evolution vs. stochastic reduction). They tell different stories about *what is happening*, not just about how we describe what happens.
  *   **Verdict 3 (Lorentz vs. Einstein):** This case is the testing ground. The PIOC predicts that if the ether is truly undetectable and explains nothing beyond the contraction itself, it satisfies the Condition of Inert Isolation. Thus, they are *not* genuine rivals. Your ambivalence arises because, historically, the Lorentzian ether *did* offer a dynamical explanation for contraction (interaction with the medium), which would violate Clause 2. If we strip it to the empirically equivalent core, the principle forces the verdict: not genuine rivals.

  **Addressing the Tension: Verdict 2 vs. Verdict 5**

  You rightly identify a tension here: "a postulate about when collapse occurs looks uncomfortably like a fiat clause about observation."

  The PIOC resolves this by distinguishing between an **Epistemic Limit** and a **Dynamical Postulate**.
  *   In **Verdict 5**, the fiat clause is epistemic: "Nothing beyond $X$ is observable." This is a claim about *us* (the observers) appended to the theory to protect it. It satisfies the Condition of Inert Isolation.
  *   In **Verdict 2**, for the rivalry to be genuine (as you intuit), the 'collapse' must be treated as a physical process (as in GRW theory), not merely an epistemic update (as in strict Copenhagen instrumentalism). If collapse is a physical process, it alters the Causal-Modal Structure (the wavefunction physically changes). If it is merely a rule for updating probabilities upon observation, your intuition in (2) is inconsistent with (5), and the PIOC sides with (5): they would be the same theory.
  *   *Honest Assessment:* To maintain your verdict on (2), you must commit to the view that 'collapse' represents a physical discontinuity in nature, however undetectable, whereas the 'fiat boundary' in (5) represents a limit on knowledge. If you view collapse as merely instrumental, the PIOC demands you treat (2) as a notational variant, just like (1).

  **Prediction for the New Case**

  **Case:** Phenomenological Thermodynamics (macroscopic variables only) versus Statistical Mechanics (microscopic particles), framed as empirically equivalent and incompatible (e.g., "Only continuous fields exist" vs. "Only discrete particles exist").

  **Prediction:** The PIOC classifies these as **not genuine rivals**, but rather as a **Reductive Hierarchy**.
  *   *Reasoning:* Statistical Mechanics does not merely add an "inert appendage" to Thermodynamics; it *explains* the laws of Thermodynamics (e.g., deriving entropy from microstates). The microscopic posits are not protectively added to save the macroscopic phenomena; they provide the mechanism for them.
  *   However, if the Statistical Mechanics theory is stripped of its explanatory power and treated purely as a mathematical mapping that yields the same equations of state without claiming real atoms (a purely instrumentalist Stat Mech), then it becomes a notational variant of Thermodynamics (Verdict 1 style).
  *   If both claim exclusive ontology (Only Continuum vs. Only Atoms) but are empirically equivalent *by hypothesis* (atoms are undetectable), the PIOC treats the 'Atoms' as an Inert Isolation if they do nothing but mimic the continuum. Thus, they are not genuine rivals; one is likely a misguided elaboration of the other. The principle suggests we should not lose sleep over this underdetermination; we should seek a domain where the micro-structure *does* make a difference (e.g., fluctuations), thereby breaking the empirical equivalence.

  **Limitations and Honesty**

  I must be honest about where this principle strains your intuitions.

  1.  **Verdict 3 (Lorentz):** The PIOC is less ambivalent than you are. It dictates that if the ether is undetectable, it is an inert appendage. If you feel there *must* be a fact of the matter regarding the ether even if undetectable (a haecceity of space), the PIOC cannot accommodate this. It sides with the Einsteinian view that the distinction is meaningless.
  2.  **Verdict 2 (Quantum):** As noted, if your conception of 'collapse' is instrumentalist (a rule for agents), the PIOC forces you to group (2) with (5). It demands that genuine rivalry requires a difference in the *world's structure*, not just in the *rulebook for observers*. If you believe there is a genuine rivalry even in instrumentalist collapse vs. Many-Worlds, the PIOC is too strict. It requires a realist interpretation of the collapse mechanism to validate your verdict.

  In summary, the **Principle of Integrated Ontological Commitment** captures your dismissal of conventionalist tricks (1, 4, 5) and your acceptance of structural divergences (2), while resolving your ambivalence on (3) by favouring the view that undetectable structural differences are not genuine theoretical rivals. It demands that for underdetermination to be philosophically worrying, the rivals must tell different stories about the *machinery* of the world, not merely offer different maps of the same territory.
