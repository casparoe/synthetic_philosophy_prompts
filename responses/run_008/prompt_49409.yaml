  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does the user believe insects count for "almost nothing"?* Yes. But if they count for *something*, the numbers game should work.
      *   *Solution:* Introduce **Diminishing Marginal Moral Weight** or **Scope Neglect as a Feature, not a Bug**. Human moral psychology isn't built for quintillions. We can't feel the weight of a million deaths. The principle should acknowledge this limitation. We act on *salient* suffering.
