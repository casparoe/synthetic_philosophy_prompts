      *   *Core Tenet 3: The Aggregation Discount.* We intuitively discount harm that is (a) unintended side effects of necessary actions, and (b) spread out over time/space. We *do not* discount harm that is (a) intended/foreseen as the goal, (b) concentrated, (c) gratuitous.
