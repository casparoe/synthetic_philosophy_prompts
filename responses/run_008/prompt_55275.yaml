      "The gene analogy is doing too much heavy lifting," Jordan said, stirring her coffee. "You treat ideas like replicators, but transmission is reconstruction. When I tell you a story, I don't copy bits; I rebuild the gist using my own cognitive machinery. Stability comes from attractors in human psychology, not high-fidelity replication."

      Alex leaned forward. "Fidelity doesn't need to be perfect, just sufficient. DNA polymerase makes errors, yet evolution holds. If variants differ in their retention rates—because they grab attention or fit biases—that's selection. Even if reconstruction supplies the variation, the differential survival of those reconstructions is Darwinian."

      "But the variation isn't blind," Jordan countered. "That's the core of Darwinism. In culture, mutations are directed. I deliberately improve a recipe or a theory before passing it on. That's Lamarckian inheritance of acquired characteristics. You're trying to force a selectionist frame onto a transformational process."

      "Selection doesn't care how variation arises," Alex replied. "Whether mutations are random or directed, if there's a filter determining which variants persist in the population, you have selection. Directed mutation might speed things up, but it doesn't abolish the competition for finite cognitive space. The selfish gene logic applies to the *vehicle*, even if the driver is intentional."

      "Intentionality breaks the lineage," Jordan insisted. "Genes have discrete parentage. Culture uses blending inheritance. A child averages inputs from dozens of models—teachers, peers, media. You can't trace a phylogenetic tree when every individual is a hybrid of hundreds of ancestors. The 'meme' isn't a discrete unit; it's a metaphor masking a network."

      "We don't need strict trees to find evolutionary signatures," Alex argued. "Population thinking overrides strict lineage tracking. We see cultural phylogenies in toolkits and folktales despite blending. If blending were total, variation would collapse instantly. It doesn't. There are discrete clusters because selection prunes the blends that don't work. The math still holds."

      "Does it?" Jordan asked. "Or are you just fitting data to a model because it's the only one we have? If cognitive biases dictate the reconstruction, the 'selection' is internal to the transmission event, not external competition between variants. The engine is psychology, not ecology."

      "Psychology provides the environment," Alex said. "Just as physics constrains biology, cognition constrains culture. But the differential retention of variants over time remains the observable phenomenon. Whether you call it Darwinian or cognitive attractors, the predictive power lies in tracking the frequencies."

      "Until the mechanism diverges," Jordan said. "If stability comes from reconstruction biases, then changing the mind changes the evolution. If it comes from replication fidelity, changing the medium matters more. We're testing different hypotheses."

      Alex nodded slowly. "Then we agree the data needs to distinguish between selection on copies versus selection on reconstructions."

      "Exactly," Jordan said. "But until then, the meme is still a ghost."

