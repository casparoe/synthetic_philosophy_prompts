answer: |-
  # What Do You Think a Disease Is?
  **Instructions:** Read each case. Choose the **one** verdict that best matches your intuition. Don't overthink—go with your gut.

  **1. Infertility (Unwanted)**  
  A couple cannot conceive. They do not want children, feel perfectly healthy, and suffer no distress. Do they have a disease?  
  ○ **Yes.** Their reproductive system isn't working as designed.  
  ○ **No.** Because it causes them no harm or suffering.  
  ○ **Skip the label.** Focus on their specific biology, not "disease."

  **2. Sickle Cell Trait (Malaria Zone)**  
  A person has a genetic blood variant. It causes "subnormal" blood cells but protects them from deadly malaria in their region. Is it a disease?  
  ○ **Yes.** The blood cells are mechanically defective.  
  ○ **No.** Because the net effect is beneficial in their environment.  
  ○ **Skip the label.** It's just a genetic trait with pros and cons.

  **3. Ordinary Aging**  
  An 80-year-old has wrinkles, slower healing, and weaker bones. They feel thriving and happy. Is this disease?  
  ○ **Yes.** Their bodily systems are declining from peak design.  
  ○ **No.** Because they are healthy and functioning well in life.  
  ○ **Skip the label.** Aging is inevitable; "disease" implies fixable errors.

  **4. Deafness (Cultural)**  
  A person is born deaf, is happy, belongs to Deaf culture, and does not want a cure. Is deafness a disease?  
  ○ **Yes.** Their auditory system is non-functional.  
  ○ **No.** Because it is a valued identity, not a defect.  
  ○ **Skip the label.** Focus on accessibility, not medical status.

  **5. Prolonged Grief**  
  A person grieves intensely one year after a loss. It disrupts work, but feels meaningful to them. Is it a disorder?  
  ○ **Yes.** Their emotional regulation is below species-typical norms.  
  ○ **No.** Unless the grief is unwanted or harmful to them.  
  ○ **Skip the label.** Medicalizing normal human pain is confusing.

  **6. Homosexuality (Historical)**  
  In the 1970s, doctors classified homosexuality as a disorder. Were they mistaken?  
  ○ **Yes, factually.** There was no biological dysfunction present.  
  ○ **No, morally.** They reflected society's values then; values changed.  
  ○ **Yes, categorically.** The "disorder" label was misused entirely.

  **7. Male Pattern Baldness**  
  A healthy man loses his hair. He is distressed by it, but otherwise fully functional. Is it a disease?  
  ○ **No.** Hair loss isn't a failure of vital bodily function.  
  ○ **Yes.** Because it is an undesirable condition causing distress.  
  ○ **Skip the label.** It's a cosmetic issue, not a medical one.

  **8. Gaming "Disorder"**  
  A teen plays video games 5 hours/day. Grades slip, parents are mad, but the teen is happy. Is it a disorder?  
  ○ **No.** Their brain and body are functioning normally.  
  ○ **Yes.** Because it violates social expectations and causes conflict.  
  ○ **Skip the label.** Focus on family dynamics, not pathology.

  ---

  ### Scoring Key
  *Tally your circles. Most common column = your leaning.*

  | **Column A** | **Column B** | **Column C** |
  | :--- | :--- | :--- |
  | **Biostatistical Naturalism**<br>(Boorse) | **Harmful Dysfunction / Normativism**<br>(Wakefield / Value-Based) | **Skepticism / Eliminativism** |
  | Disease is about **broken parts**, regardless of feelings. If the body isn't working as designed (Infertility, Aging, Deafness), it's a disease. Homosexuality was a *factual* error. | Disease requires **harm or bad values**. No harm = no disease (Infertility, Aging). Undesirable = disease (Baldness). Homosexuality was a *value* judgment. | The word "disease" is **not useful**. It mixes facts and values confusingly. Focus on specific conditions and harms instead. |

  ### ⚠️ Limitations & Overlaps
  *   **Hybrid vs. Normativism:** This quiz groups these together (Column B). They often agree on verdicts (No disease without harm). To split them, you'd need a case where something is *harmful* but *not dysfunctional* (e.g., normal pregnancy risks). Hybrids say "Not Disease"; Normativists say "Disease."
  *   **Naturalist vs. Hybrid:** Questions 1–4 split these. Naturalists say "Yes" (function failed); Hybrids say "No" (no harm).
  *   **Objectivity:** Question 6 tests whether you think disease judgments can be *factually* wrong (Naturalist/Hybrid) or just *value* shifts (Normativist).

  *Handout designed for Philosophy of Medicine Reading Group. Not a diagnostic tool.*
