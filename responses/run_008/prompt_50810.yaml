answer: |-
  Here is a set of scripted segments tailored for your podcast. I've kept the tone conversational and punchy, assuming the audience knows the jargon (PMI, NMA, posits, etc.) so you don't waste time on setup. I've also included the specific follow-ups you requested, keyed to her likely defensive moves.

  ### Segment 1: The Hindsight Problem (Early-Mid Episode)
  *Context: She's just explained how we can distinguish the "working" posits from the "idle" ones in historical theories like Fresnel's ether.*

  **You:** "I want to press on the epistemology of that distinction. The worry my listeners are probably itching for is the hindsight charge. It looks like you're identifying the 'working' posits by looking at which ones actually survived into our current best theories. You're marking the parts that worked by checking the answer key in the back of the book. If the criteria for 'doing the work' just *is* 'surviving the theory change,' isn't the divide-et-impera move trivially true but philosophically empty?"

  **[Likely Reply: She will deny this. She'll say there were independent criteria available *at the time*—derivational independence, robustness, etc.—that flagged these posits as essential without peeking at the future.]**

  **Follow-up:** "Okay, but let's say those criteria *were* available to Fresnel. The historical record suggests scientists didn't actually use them to sort the wheat from the chaff; they tended to be realists about the whole package, ether and all. So, are you saying the scientists *should* have been selective realists back then, or that they *were* and just didn't realize it? Because if it's the first, you're prescribing a method they didn't have. If it's the second, you're relying on a rational reconstruction that history might not support."

  ### Segment 2: The "Idle" Label & Phlogiston (Mid-Episode)
  *Context: Moving from the epistemology of the distinction to the historical accuracy of it.*

  **You:** "Let's talk about the 'idle' machinery. Your strategy relies on the claim that the parts of past theories we rejected were idle—they weren't doing the heavy predictive lifting. But take phlogiston. It wasn't just decorative; it generated novel predictions about weight gain and calcination. It was working hard, yet it got completely dumped, not refined. If a posit can be genuinely productive and still turn out to be non-referring, how confident can we be that our current 'working' posits aren't just the phlogiston of 2024?"

  **[Note: If she tries to pivot to a different case, let her, but pin her down on whether *any* case exists where a central, productive ontology was fully discarded.]**

  **Follow-up (if she minimizes phlogiston):** "Even if we set phlogiston aside, isn't the burden on you to show that the 'working' part is separable from the 'ontology' part? In phlogiston theory, the predictive power seemed tied to the existence of the substance itself. If the productivity and the ontology are tangled, your knife for dividing them might be too blunt to save realism."

  ### Segment 3: Circularity & The Stand-Off (Late Episode)
  *Context: Discussing the No Miracles Argument (NMA) vs. PMI.*

  **You:** "I want to hit the meta-argument. You lean on the No Miracles Argument: success implies truth. But the Pessimist says, 'Wait, that's an induction over past cases, and past cases show success implies *falsity*.' You're using an inductive inference to defend the reliability of inductive inference. If the PMI poisons the well for induction, doesn't it poison the NMA too? How do you bootstrap realism without begging the question?"

  **[Likely Reply: She will argue it's a stand-off. The PMI and NMA cancel each other out, leaving us with a tie, and Realism wins on tie-breakers (explanatory power, simplicity, etc.).]**

  **Follow-up:** "If they cancel out, we're left with a stalemate. But you want to claim realism is the *best* explanation. If the inductive base is contested, aren't you just asserting that 'truth' is a better explanation than 'structural continuity' or 'empirical adequacy' by fiat? Why does the 'truth' explanation get to win the tie-breaker if the very evidence we're weighing is what's in dispute?"

  ### Segment 4: The Structural Realism Retreat (Closing Argument)
  *Context: The final adversarial push.*

  **You:** "Here's the closing worry. To make your selective realism work, you have to trim past theories very finely—keeping the equations, ditching the ether; keeping the structure, ditching the specific ontology. But once you've trimmed that much, have you actually saved *scientific realism*? Or have you quietly retreated to a position a structural realist could sign onto without complaint? If the 'real' part of the theory is just the mathematical structure that survives, do you count that convergence as a win for your view, or a concession that ontology was the casualty all along?"

  ### Segment 5: The "Stick Your Neck Out" Bonus (Sign-off)
  *Context: Just before you thank her and close the show.*

  **You:** "One last thing before we let you go. I want to put your money where your mouth is. Apply your own criteria to *today*. Pick a current theory—QFT, String Theory, Cosmology. Which specific ontological posits in there does your view say will still be around in a hundred years? And the harder question: if history proves you wrong about that, does it just mean you made a bad call, or does it actually undermine the selective realist strategy itself?"
