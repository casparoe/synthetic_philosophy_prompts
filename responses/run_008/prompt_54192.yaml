answer: |-
  First off, tell your friend she's onto something real. The "demandingness objection" is basically a philosophical Rorschach test; people project their specific annoyance onto it, and then argue past each other. Your frustration is the correct response to a muddled debate. Sorting this by *cases* rather than *famous names* is exactly how you untangle it.

  Below is a decision tree designed for your study group. It avoids jargon in the questions (the "nodes") and sorts people based on their intuitive verdicts on concrete scenarios. It leads to the standard positions (the "leaves"), plus a few "unoccupied" spots where the logic breaks down.

  ### The Demandingness Decision Tree

  **Start:** *Consequentialism says you must always produce the best overall outcome. Critics say this asks too much of you.*

  **Node 1: The Birthday Dinner**
  Your friend is having a milestone birthday dinner. You could skip it, work an extra shift, and donate the wages to save a life.
  *   **Question:** Is it **morally forbidden** for you to choose the dinner?
      *   **YES:** Go to Node 2.
      *   **NO:** Go to Node 3.

  **Node 2: The Free-Rider World (Compliance Check)**
  Imagine two worlds. In World A, everyone else gives 10% of their income to charity. In World B, nobody else gives anything.
  *   **Question:** Is the amount *you* are required to give **lower** in World A than in World B?
      *   **YES:** Go to Node 2a.
      *   **NO:** **Leaf 1: Unlimited Act Consequentialism.** (You must maximize good regardless of what others do or how much it costs you. The "demand" is real, and you should meet it.)

  **Node 2a: The Source of the Rule**
  *   **Question:** Why is your requirement lower in World A? Is it because you should follow a **rule** that works best for society, or because it's simply **unfair** to ask you to pick up the slack?
      *   **Rule:** **Leaf 2: Rule Consequentialism.** (We follow rules like "do your fair share" because a society with that rule produces better outcomes than one where everyone tries to calculate every act.)
      *   **Unfair:** **Leaf 3: Fairness-Sensitive Act Consequentialism.** (The moral math changes based on cooperation. You aren't required to compensate for the moral failures of others.)

  **Node 3: The Welfare Floor (Absolute Sacrifice Check)**
  Since you said dinner is *not* forbidden, is that because there is a limit to sacrifice?
  *   **Question:** Is there a **hard floor** of personal welfare (e.g., basic health, key relationships) you are *never* required to dip below, even to save a stranger's life?
      *   **YES:** **Leaf 4: Agent-Centered Prerogative.** (You are allowed to give your own projects extra weight. Morality has a "stop loss" order to protect your integrity.)
      *   **NO:** Go to Node 4.

  **Node 4: The Grading Question (Scalar Check)**
  If there's no hard floor, and dinner isn't forbidden, how do we judge the choice?
  *   **Question:** Is morality a **switch** (Right vs. Wrong) or a **dimmer** (Better vs. Worse)?
      *   **Dimmer:** **Leaf 5: Scalar Consequentialism.** (There are no "requirements." Skipping dinner isn't wrong, just less good than donating. Morality grades on a curve.)
      *   **Switch:** Go to Node 5.

  **Node 5: The Pattern of Sacrifice**
  *   **Question:** Does it matter if the sacrifice is **small-and-constant** (daily coffee money) versus **large-and-once** (selling your house)?
      *   **NO (It's all just utility):** *Return to Leaf 5 (Scalar).* (If you treat every dollar identically, you are effectively a Scalarist).
      *   **YES (Psychology matters):** Go to Node 6.

  **Node 6: The Ideal Observer (Alienation Check)**
  Imagine a perfect moral agent who feels no pull toward personal projects and calculates every coffee donation automatically.
  *   **Question:** Is this person **admirable** or **defective**?
      *   **Admirable:** *Return to Leaf 1 (Unlimited Act Consequentialism).* (If you said Dinner is "Not Forbidden" but think the calculating agent is ideal, you likely believe UAC is true but that humans are too weak to follow it. This is often called "UAC with Human Constraints.")
      *   **Defective:** **Leaf 6: Sophisticated (Indirect) Consequentialism.** (You shouldn't calculate every coffee. Caring about your friends *directly* makes you a better person who does more good in the long run. The theory demands you *not* follow the theory directly.)

  **Node 6b: The Supererogatory Gap (Unoccupied)**
  *   **Question:** If the agent is "Defective" for calculating, but there is "No Floor" and morality is a "Switch," why is dinner allowed?
      *   **Answer:** "It's just supererogatory (above and beyond) without a specific reason."
      *   **Result:** **Leaf 7: UNOCCUPIED / UNSTABLE.** (See analysis below).

  ***

  ### Analysis for the Study Group

  Here is the "meta" commentary your friend would appreciate. This explains the empty seats and the blurry lines in the tree above.

  #### 1. The Unoccupied Leaf (Leaf 7)
  **The Position:** This view claims morality is binary (Right/Wrong), there is no welfare floor (you could theoretically give everything), yet it is *not wrong* to keep your money, and there is no psychological justification for it (the ideal agent *should* calculate).
  **Why it's empty:** This is the "Supererogatory Gap." It tries to have it both ways. If the ideal agent maximizes, and there's no floor stopping you, why isn't it *wrong* to fail to maximize? Usually, philosophers who land here realize they need either a **Prerogative** (Leaf 4) to explain *why* it's allowed, or they switch to **Scalar** (Leaf 5) to remove the "wrongness" label. It's logically unstable: it asserts a permission without a mechanism to grant it.

  #### 2. The Indistinguishable Leaves (Leaf 3 vs. Leaf 4)
  **The Suspicion:** You suspected the **Fairness View** (Leaf 3) and the **Prerogative View** (Leaf 4) might be impossible to separate in practice. You are right.
  **The Overlap:**
  *   **Prerogative:** "I can keep my money because I need a life."
  *   **Fairness:** "I can keep my money because others aren't giving theirs."
  *   **The Problem:** In the real world (where others *aren't* giving), both views tell you to keep the money. In an ideal world (where everyone *is* giving), the Fairness view says you must give more, while the Prerogative view says you still have a floor.
  *   **Why it matters:** For an intro group, these look identical: "Consequentialism is too demanding, so I'm keeping the cash." The tree separates them by *reasoning* (Node 2 vs. Node 3), but action-guidance is nearly the same in non-ideal conditions. If your group cares about *what to do*, these leaves are functionally twins. If they care about *why*, they are distinct.

  #### 3. The "Human Constraints" Trap (Leaf 1 vs. Leaf 6)
  **The Confusion:** Many people want to be **Unlimited Act Consequentialists** (Leaf 1) but answer "Defective" at Node 6. They think, "The theory demands everything, but humans can't do that, so we shouldn't blame people."
  **The Distinction:**
  *   **Leaf 1 (UAC):** The theory is correct; humans are flawed. We should try to be more like the calculator.
  *   **Leaf 6 (Sophisticated):** The theory *itself* tells you not to be a calculator. Being a calculator is a bug, not a feature.
  **Why flag this:** This is the most common source of "talking past each other." One person says "Morality demands X," the other says "Psychology prevents X." The Sophisticated view says "Morality demands that you respect Psychology."

  #### 4. The "Coffee vs. House" Node (Node 5)
  **Why include it?** This tests **Scalar Consequentialism** (Leaf 5). A pure Scalarist says giving $5 is *better* than giving $0, and giving $5,000 is *better* than giving $5. It's all one gradient. A **Sophisticated Consequentialist** (Leaf 6) says we need *rules of thumb*. We might have a rule "Keep your coffee money" because calculating it is exhausting, but "Sell the house" might trigger a different rule. If your group thinks the *size* of the sacrifice changes the *type* of moral rule needed, they are likely Sophisticated, not Scalar.

  ### How to Use This on the Train (or in Class)
  Don't ask your group "Are you a Rule Consequentialist?" Ask them Node 1 (The Dinner). If they say "Not Forbidden," ask Node 3 (The Floor). If they hesitate, ask Node 6 (The Ideal Observer).

  You'll find people scramble. Someone might say "It's not forbidden (Node 1), but there's no floor (Node 3), and the calculator is admirable (Node 6)." Congratulations, you've found a confused Unlimited Act Consequentialist who is afraid of the label. The tree forces them to pick a lane.

  Good luck. Tell your friend she wins the argument about the literature being messy, but you win the argument about how to clean it up.
