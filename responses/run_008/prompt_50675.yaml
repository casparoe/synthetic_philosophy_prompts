answer: |-
  There is no single, canonical term in the academic literature that specifically names this *oscillation* as a distinct rhetorical or logical maneuver.

  The components you describe are well-defined: the "prohibition" reading is standardly called an **agent-relative constraint** (or restriction), and the "permission" reading is called an **agent-centered prerogative** (or option). The structural feature that licenses the position is the **asymmetry between negative and positive duties** grounded in **agent-relativity**. However, the *dynamic shift* between these two framings during argumentation—specifically when used to deflect the Paradox of Deontology—does not have a dedicated label. It is usually subsumed under broader discussions of the Paradox of Deontology (Frances Kamm, Thomas Nagel) or the Doing/Allowing Distinction, but those terms describe the *problem* or the *static distinction*, not the *dialectical movement* you have identified.

  Since no established term captures the oscillation itself, I will coin one below, following your specifications.

  ### The Coined Term: The Constraint-Prerogative Slide

  **Definition:**
  The **Constraint-Prerogative Slide** is a dialectical maneuver in deontological ethics wherein a defender shifts the logical characterization of a moral principle between an **agent-relative constraint** (a prohibition on acting) and an **agent-centered prerogative** (an exemption from optimizing outcomes) depending on the vector of criticism.

  The slide occurs when:
  1.  **Phase 1 (Constraint):** When challenged on the permissibility of an act (e.g., "May I kill the one?"), the defender invokes the absolute force of the constraint ("It is forbidden").
  2.  **Phase 2 (Prerogative):** When challenged on the sub-optimality of the outcome resulting from honoring the constraint (e.g., "But five will die because you didn't act"), the defender retreats to the prerogative ("I am not required to dirty my hands to save them").
  3.  **The Slide:** The transition between Phase 1 and Phase 2 is treated as a seamless continuity of a single principle, obscuring the fact that the justification has shifted from the *inviolability of the victim* to the *integrity of the agent*.

  **The Structural Feature:**
  The feature that licenses this slide is **Agent-Relative Asymmetry**. This is the structural claim that moral reasons apply differently to the agent regarding their own actions (constraints) than they do regarding the state of the world (prerogatives). The Slide exploits the fact that Agent-Relative Asymmetry simultaneously forbids *doing* harm and does not require *preventing* harm, allowing the defender to treat these as two sides of the same coin rather than two distinct justificatory burdens.

  ### Distinction from Existing Concepts

  *   **Vs. Motte-and-Bailey:** In a Motte-and-Bailey fallacy, the defender retreats to a defensible but less valuable claim (the Motte) when attacked, then re-asserts the valuable but less defensible claim (the Bailey) when safe. In the Constraint-Prerogative Slide, the "Prerogative" reading (I am not required to save the five) is not necessarily "defensible but less valuable"; it often commits the defender to a *worse* outcome than the Constraint reading implies. The Slide is not merely a retreat to safety; it is a shift in the *locus of moral concern* (from the world's state to the agent's hands) that is left implicit.
  *   **Vs. Doctrine of Doing and Allowing (DDA):** The DDA is the metaphysical or normative distinction between acting and omitting. The Constraint-Prerogative Slide is the *rhetorical deployment* of that distinction to insulate the theory from the Paradox of Deontology. One can accept the DDA without employing the Slide (e.g., by explicitly acknowledging the tragic cost of the prerogative).
  *   **Vs. Paradox of Deontology:** The Paradox is the observation that deontology permits more violations of its own constraints to occur. The Slide is the *defense mechanism* used to explain why this is acceptable without abandoning the constraint.

  ### Boundaries of the Term

  To ensure precision, here are the boundaries for the **Constraint-Prerogative Slide**:

  **1. Clear Case (The Slide is present):**
  > A philosopher argues against pushing a man in front of a trolley. When asked, "Is it permissible to push him to save five?" they answer, "No, murder is absolutely forbidden" (Constraint). When the critic replies, "Then you are choosing a world where five die instead of one," the philosopher answers, "I am not morally required to become a murderer just to improve the world's statistics; my duty is to keep my own hands clean" (Prerogative). When asked, "If you won't push, may *I* push?" they revert to, "No, murder is forbidden" (Constraint).
  >
  > *Why:* The justification shifts from the victim's right not to be killed (Constraint) to the agent's right not to be compelled to kill (Prerogative) and back again, without acknowledging that these are distinct justificatory structures with different implications for the total count of violations.

  **2. Borderline Case (The Slide is ambiguous):**
  > A philosopher states, "Killing is wrong, and therefore I will not do it. However, morality does not demand self-sacrifice to prevent others from killing."
  >
  > *Why:* Here, the philosopher explicitly distinguishes the two claims. If they maintain this distinction consistently and admit that the "permission" reading entails a tragic loss of value (the five lives) that is not fully compensated by the "constraint" reading, they are not sliding; they are articulating a hybrid view (like Scheffler's Hybrid Consequentialism). The Slide only occurs if the shift is used to imply that the *principle itself* remains unchanged in character despite the shift in application.

  **3. Exclusion Case (The Slide is absent):**
  > A consequentialist argues, "You should not push the man because doing so would undermine general trust in the long run, leading to more deaths overall."
  >
  > *Why:* This is a **Rule-Consequentialist** defense. It does not invoke an agent-relative constraint or prerogative; it invokes an agent-neutral calculation of outcomes. There is no oscillation between prohibition and permission; there is only a calculation of consequences that happens to align with the constraint. Similarly, a "Rights Absolutist" who says, "I must not push, and I am also required to stop you from pushing, even if it costs me my life," does not employ the Slide. They maintain the Constraint reading exclusively, accepting the high personal cost rather than retreating to the Prerogative ("I am not required to sacrifice").

  ### Summary
  The phenomenon you have identified is the **Constraint-Prerogative Slide**. It is licensed by the structural feature of **Agent-Relative Asymmetry**. It is distinct from the Paradox of Deontology (which is the problem) and the Doing/Allowing Distinction (which is the tool), serving instead as the specific dialectical maneuver that allows a deontologist to navigate between the two without conceding that their theory permits a greater number of violations than it forbids.
