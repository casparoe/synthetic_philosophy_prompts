answer: |-
  The two projects are distinct because guilt and shame are functionally divergent emotional states driven by different cognitive appraisals, meaning institutions can cultivate repair-oriented guilt without invoking identity-threatening shame despite any shared developmental origins.

  1.  **The Object Thesis:** Guilt evaluates specific behaviors, whereas shame evaluates the global self.
      *   **Classification:** Substantive but plausible empirical claim (supported by affective science, e.g., Tangney et al., though boundaries can blur).
      *   **Supports:** The Facilitator (justifies targeting acts rather than identity).
  2.  **The Motivation Thesis:** Guilt motivates reparative action and apology, whereas shame motivates concealment, withdrawal, or aggression.
      *   **Classification:** Substantive but plausible empirical claim (strong correlational evidence, though causal direction is debated).
      *   **Supports:** The Facilitator (argues guilt leads to repair, shame to the exit door).
  3.  **The Audience Thesis:** Shame necessitates a witness (real or imagined), whereas guilt arises from violating internal standards regardless of observation.
      *   **Classification:** Substantive but plausible empirical claim (phenomenological distinction widely accepted in philosophy and psychology).
      *   **Supports:** The Facilitator (implies guilt can operate without the social pressure mechanism of shame).
  4.  **The Origin Thesis:** Guilt is developmentally produced by internalizing external shame sanctions and social judgment.
      *   **Classification:** Substantive but plausible empirical claim (common in sociological and psychoanalytic theory, e.g., Freud, Elias).
      *   **Supports:** The Online Critic (implies guilt is just shame that has moved inside).
  5.  **The Reductionist Thesis:** Guilt is merely shame where the audience has been moved inside the head, making them structurally identical mechanisms.
      *   **Classification:** False or unsupported (contradicted by neurophysiological and phenomenological data showing distinct affective programs).
      *   **Supports:** The Online Critic (used to argue the choice between them is illusory).
  6.  **The Fittingness Thesis:** It is morally proportionate to condemn an act, but disproportionate to condemn the whole self for a single act.
      *   **Classification:** Trivial definitional stipulation (within most normative ethical frameworks) or Normative claim.
      *   **Supports:** The Facilitator (provides the ethical warrant for preferring guilt).

  The core question of whether a culture can shift members from shame to guilt depends on rejecting the Reductionist Thesis while accepting the Origin Thesis. Even if guilt originates from internalized social judgment (Origin), it functions differently once established because it relies on act-based appraisal rather than identity-based appraisal (Object). Therefore, the two projects are distinct: the Critic describes the developmental history of the mechanism, while the Facilitator describes the operational calibration of that mechanism. An institution can deliberately shift the community by training members to appraise failures as localized events rather than global identity markers; this utilizes the Object Thesis to trigger the motivational profile of guilt (repair) rather than shame (withdrawal), proving that the "internalized witness" can be taught to speak about *what happened* rather than *who you are*.
