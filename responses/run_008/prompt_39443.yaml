answer: |-
  You mistake the involuntary twitch of the senses for the deliberate virtue of benevolence. That alarm is merely the spirit's shock at a disturbing scene, no different than flinching at a thunderclap; it proves we are sensitive creatures, not that we are moral ones. Call it a sprout if you wish, but tell me: does a wild sprout grow into a straight wheel without the steamer's heat and the bender's force? If you leave that impulse to nature alone, it will extend only to one's own kin and vanish when resources are scarce, leading inevitably to strife. The jolt is the raw grain of the wood, but the wood remains crooked. Without the conscious effort of ritual to straighten that impulse into consistent righteousness, that same man who saves the child will later rob his neighbor to feed his own hunger. The clay has potential, Mencius, but until the potter shapes and fires it through conscious effort, it is merely mud.
