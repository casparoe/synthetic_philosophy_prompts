prompt: |-
  I run incident postmortems at a mid-sized company, and something about how we do "root cause analysis" has started to bug me. Every outage has a basically endless causal history — a deploy went out, a config flag was wrong, the retry logic amplified it, the on-call was asleep, the feature even had traffic because marketing ran a campaign. Yet the writeup always lands on one or two items as THE cause, and the way we pick them is basically "what could we actually change so this doesn't happen again" — a process fix, better alerting, whatever. A friend who did philosophy as an undergrad says this makes our postmortems quietly interventionist about causation rather than counterfactualist, and I did not fully follow the distinction but it's been living rent free in my head since.

  So my question: what theory of causation does root cause analysis actually presuppose, if any? Is it just counterfactual dependence plus a filter for what's within our power to intervene on, or is there a real tension there? Second thing — our postmortems are officially blameless, but everyone reads the "root cause: engineer overrode the alert" line differently than "root cause: disk filled up", even tho on your causal-graph story both are just nodes. Does the practice of singling out one node quietly presuppose something about responsibility that the blameless framing is supposed to deny? And lastly, tell me whether RCA genuinely needs any of this philosophy or whether several different theories of causation would license the exact same writeups — I want to know if we're underdetermined, not just wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user runs incident postmortems at a mid-sized company.
      *   **Problem:** They notice a disconnect between the "endless causal history" of an outage and the final postmortem which picks 1-2 "root causes."
      *   **Friend's Input:** A philosophy friend suggested their process is "interventionist about causation rather than counterfactualist." The user didn't fully get it but it's bothering them.
      *   **Question 1:** What theory of causation does Root Cause Analysis (RCA) presuppose? Is it counterfactual dependence + intervention filter, or is there tension?
      *   **Question 2:** Does singling out one node (e.g., "engineer overrode alert" vs. "disk filled up") violate the "blameless" ethos by implying responsibility, even if causally they are just nodes?
      *   **Question 3:** Does RCA *need* this philosophy? Are we underdetermined (could different theories lead to the same writeups) or is there a specific philosophical commitment driving the practice?

  2.  **Analyze Question 1: Theory of Causation in RCA:**

      *   *Counterfactual Theory (Hume/Lewis):* $A$ causes $B$ if, had $A$ not occurred, $B$ would not have occurred. In an outage chain (Deploy $\to$ Config $\to$ Retry $\to$ Outage), *all* of these are counterfactual causes. If the deploy didn't happen, no outage. If the config was right, no outage.
      *   *Interventionist Theory (Woodward):* Causation is about manipulation. $A$ causes $B$ if intervening on $A$ changes $B$. This aligns with the user's observation: "what could we actually change."
      *   *The Tension:* The friend is right. Strict counterfactualism leads to an infinite regress (why was the config wrong? why did the engineer write it? why does the company exist?). RCA stops the regress based on *utility* (can we fix it?), not metaphysical necessity. This is pragmatic, not purely logical.
      *   *Conclusion:* RCA presupposes a *pragmatic interventionist* theory. It selects causes based on "levers we can pull," not just "necessary conditions."

  3.  **Analyze Question 2: Blamelessness and Node Selection:**

      *   *The Graph:* Causally, "Engineer overrides alert" and "Disk filled up" are both nodes. Both are necessary conditions (in that specific scenario).
      *   *The Selection:* Why pick one over the other?
      *   *Blameless Postmortem Ethos:* Focus on system design, not individual error.
      *   *The Conflict:* If you write "Root Cause: Engineer overrode alert," it *sounds* like blame. If you write "Root Cause: Alerting system allowed override without MFA," it sounds like system design.
      *   *Philosophical Implication:* Singling out a human action node often implies *agency* and *responsibility* in a way that "disk filled up" does not, even if the causal graph treats them identically. This touches on *Moral Causation* vs. *Physical Causation*.
      *   *Conclusion:* Yes, there is a tension. The practice of selecting a "root" often smuggles in normative judgments about control and expectation, which can undermine blamelessness if not carefully framed.

  4.  **Analyze Question 3: Underdetermination (Do we need the philosophy?):**

      *   *Underdetermination:* Could different theories lead to the same writeup?
      *   *Reality:* Yes. A strict counterfactualist, an interventionist, and a regularity theorist might all agree on the *fix* (e.g., "add rate limiting").
      *   *Value of Philosophy:* It's not about changing the *fix*, but about changing the *process* and *culture*. If you think causation is just "what broke," you stop at the broken component. If you think causation is "where we can intervene," you look at the process around the component.
      *   *Conclusion:* RCA doesn't *need* metaphysics to function, but it *benefits* from understanding its own selection criteria to avoid cognitive bias (like Fundamental Attribution Error). The philosophy helps justify *why* we ignore certain causes.

  5.  **Drafting the Response:**

      *   *Tone:* Professional, insightful, slightly academic but accessible (matching the user's vibe).
      *   *Structure:* Address the three questions sequentially.
      *   *Key Concepts to Integrate:*
          *   Counterfactual Dependence (David Lewis).
          *   Interventionism (James Woodward).
          *   Causal Selection (Hart & Honoré).
          *   Fundamental Attribution Error (Psychology).
          *   Normal Accident Theory (Perrow) / Resilience Engineering (Hollnagel).

      *   *Drafting Section 1 (Theory):* Validate the friend. It *is* interventionist. Explain the "Causal Field" (Mackie). We distinguish causes from conditions based on what we consider "normal" vs. "abnormal" or "controllable."
      *   *Drafting Section 2 (Blame):* This is the crux. Distinguish between *causal responsibility* and *moral responsibility*. Selecting a human node triggers moral heuristics. Suggest shifting language from "Root Cause" to "Contributing Factors" or "Action Items."
      *   *Drafting Section 3 (Underdetermination):* Yes, it's underdetermined. The philosophy isn't there to find the "truth" (which is the whole graph), but to manage the "search space." The value is in preventing the "Bad Apple" theory of failure.

  6.  **Refining and Polishing:**

      *   *Self-Correction during drafting:* Make sure I don't get too bogged down in metaphysical jargon. Keep it tied to SRE/Incident Management practices.
      *   *Emphasis:* Highlight that "Root Cause" is a misnomer. It's really "Root *Intervention*."
      *   *Blameless nuance:* Mention that "blameless" doesn't mean "consequence-free," but "focused on system." The selection of the node determines whether the system or the person is seen as the variable.
      *   *Final check:* Did I answer the specific question about underdetermination? Yes, confirm that multiple theories license the same output, but the *reasoning* matters for culture.

  7.  **Final Review against User Prompt:**
      *   Did I explain interventionist vs. counterfactualist? Yes.
      *   Did I address the blameless tension? Yes.
      *   Did I address underdetermination? Yes.
      *   Is the tone appropriate? Yes.

      *(Self-Correction)*: I should explicitly mention H.L.A. Hart's "Causation in the Law" because it deals exactly with selecting causes from conditions based on human intervention. That fits the "friend who did philosophy" vibe.

      *(Refining the Blame section)*: I need to be careful not to say "you can't mention human error." You can, but you must frame it as a system vulnerability (why was the override possible?).

      *(Refining the Underdetermination)*: Make sure to clarify that while the *output* might be the same, the *risk* of getting it wrong (blame culture) is higher without the philosophical clarity.

  8.  **Final Polish:** (Produces the structured response below).
answer: |-
  This is a fantastic observation, and your philosophy friend is pointing at a genuine tension that plagues almost every incident management system. You have stumbled onto the difference between **metaphysical causation** (what actually happened) and **pragmatic causation** (what we can do about it).

  Here is the breakdown of the theory, the blame problem, and whether any of this actually matters for your writeups.

  ### 1. The Theory: Counterfactual vs. Interventionist

  Your friend is right. Strictly speaking, your postmortems are **interventionist**, not counterfactual.

  **The Counterfactual View (David Lewis):**
  In a counterfactual theory of causation, $C$ is a cause of $E$ if, had $C$ not occurred, $E$ would not have occurred. In your outage chain (Deploy $\to$ Config $\to$ Retry $\to$ On-call Asleep $\to$ Marketing Campaign), *every single link* is a counterfactual cause.
  *   If the deploy hadn't happened, no outage.
  *   If the on-call had been awake, they might have mitigated it.
  *   If marketing hadn't run the campaign, the traffic volume wouldn't have triggered the bug.

  If you were a pure counterfactualist, your "Root Cause" section would have to be an infinite regress of necessary conditions. You would have to list the engineer's birth, the company's incorporation, and the existence of electricity.

  **The Interventionist View (James Woodward / Manipulability):**
  Interventionism says $C$ causes $E$ if an *intervention* on $C$ (while holding other variables fixed) changes $E$. This is where your process lives. You aren't looking for necessary conditions; you are looking for **control variables**.
  *   You cannot intervene on "marketing ran a campaign" (that's business logic).
  *   You cannot easily intervene on "on-call was asleep" (humans sleep).
  *   You *can* intervene on "retry logic amplified failure" (code change).

  **The Philosophical Mechanism: Causal Selection**
  There is a specific sub-field of philosophy of law and action (notably H.L.A. Hart and Tony Honoré) that deals with this. They argue that we distinguish between **causes** and **conditions**.
  *   *Conditions* are the background state of the world (oxygen exists, the server is on).
  *   *Causes* are the abnormal interventions or deviations from the script.

  Your postmortem process is a **Causal Selection** mechanism. You are filtering the causal graph not by truth, but by **leverage**. The tension you feel is the gap between the *truth* of the causal graph (everything is connected) and the *utility* of the report (we need a ticket to file).

  ### 2. The Blameless Tension: Nodes vs. Agency

  This is the more dangerous philosophical trap. You asked if singling out one node violates the blameless ethos. **Yes, it often does, because of how humans parse agency.**

  In a causal graph, `Engineer Overrode Alert` and `Disk Filled Up` are topologically identical. They are both nodes with incoming and outgoing edges. However, human psychology does not treat them identically.

  **The Fundamental Attribution Error**
  When we see a human node selected as the "Root Cause," we instinctively switch from *systemic analysis* to *moral judgment*.
  *   **Disk Filled Up:** We view this as a capacity planning failure (System).
  *   **Engineer Overrode Alert:** We view this as a decision failure (Agent).

  Even if you write "Blameless: The engineer was tired," the act of isolating the human action as the *Root* implies that the human action was the **deviation from the norm**. It presupposes that the "correct" state is a human who does not override alerts.

  **How to Fix the Framing**
  To maintain true blamelessness, you must shift the causal selection criteria from "What happened?" to "Why was the system vulnerable to this action?"
  *   *Bad (Agent-focused):* Root Cause: Engineer manually overrode the safety check.
  *   *Good (System-focused):* Root Cause: The safety check allowed a single-factor override without audit logging.

  In the second version, the "cause" is not the action, but the **affordance** that allowed the action to result in an outage. This aligns with **Resilience Engineering** (Sidney Dekker, Erik Hollnagel), which argues that "human error" is not a cause, but a symptom of system complexity. If your RCA identifies a human action as the root cause, you have arguably failed the RCA, regardless of your "blameless" header.

  ### 3. Underdetermination: Do We Need the Philosophy?

  You asked if RCA genuinely needs this philosophy or if different theories would license the same writeups.

  **The Output is Underdetermined**
  Yes, the *action items* are underdetermined by the theory of causation. A strict counterfactualist, an interventionist, and a regularity theorist would all likely agree on the fix: "Add rate limiting to the retry logic." You do not need metaphysics to fix the server.

  **The Process is NOT Underdetermined**
  However, the *culture* and *long-term reliability* are highly determined by which theory you implicitly adopt.
  *   **If you act like Counterfactualists:** You try to prevent the specific event from happening again. (e.g., "Don't let Bob deploy on Fridays.") This leads to brittle rules.
  *   **If you act like Interventionists:** You try to reduce the system's sensitivity to that class of events. (e.g., "Deployments should not be able to take down the database regardless of config.") This leads to robust architecture.

  **Why the Philosophy Matters**
  The philosophy isn't there to help you find the "true" cause (because, as you noted, there is no single true cause). It is there to **constrain your bias.**

  Without an explicit interventionist framework, RCA naturally drifts toward **Component Failure** thinking. We want to find the broken part. But in software, the "broken part" is often functioning exactly as designed; it's the *interaction* that failed.
  *   If you don't understand that you are doing **Causal Selection**, you will convince yourself you found the "Truth."
  *   If you understand you are doing **Causal Selection**, you admit you are choosing the cause that yields the highest ROI on engineering time.

  ### Summary Recommendation

  1.  **Rename the Section:** Stop calling it "Root Cause." Call it **"Actionable Interventions"** or **"Systemic Vulnerabilities."** This admits philosophically that you are selecting for leverage, not metaphysical primacy.
  2.  **Audit Your Nodes:** If a "Root Cause" describes a human action, reject it. Reframe it as a system property that permitted the action to be catastrophic. (e.g., Change "Engineer deleted DB" to "Prod DB lacked write-protection for admin roles.")
  3.  **Embrace the Underdetermination:** Acknowledge in your postmortem template that the "cause" selected is a choice based on mitigations available, not the sole source of failure. This reduces the pressure to find a "silver bullet" cause and encourages multiple smaller fixes.

  Your friend's "interventionist" comment is the key. You aren't historians recording why the past happened; you are engineers designing how the future behaves. The causation you care about is the kind you can grab with a wrench.
