answer: |-
  The doing/allowing lens is fundamentally inadequate for this novel because Steinbeck eliminates omission as a viable alternative, forcing a choice between merciful agency and violent abandonment that is better understood through a duty-of-care framework. Foot and Rachels assume the outcome is morally identical regardless of the agent, but Steinbeck argues the *quality* of the death is inextricable from the relationship between the killer and the killed. The standard debate lacks resources for "delegation to a worse agent" because it treats the actor as interchangeable, whereas Candy's regret proves the moral weight resides specifically in the bond of love and responsibility. Consent asymmetry matters profoundly: Lennie's trust converts the shooting into a fulfilled promise of safety, while the dog's silence and Candy's overruled objection highlight the violence of treating a dependent as a nuisance to be removed by utility rather than care.

  **Scenes to anchor your discussion:**

  1.  **Carlson cleaning the Luger (Chapter 3):** Focus on how Carlson discusses the dog purely in terms of hygiene and utility ("He ain't no good to himself"), establishing death as a logistical solution rather than a moral burden.
  2.  **Candy's confession to George (Chapter 3):** Immediately after the shooting, Candy tells George, "I ought to of shot that dog myself," which serves as the novel's explicit thesis that the moral failure was not the death, but the delegation of it.
  3.  **George reciting the farm story while raising the gun (Chapter 6):** Contrast Carlson's cold efficiency with George's use of narrative to soothe Lennie, demonstrating how duty-of-care transforms the act from execution into protection.
