prompt: |-
  I have to give a ~15 minute talk in my econ elective on thursday and I picked Goodhart's law, mostly because my older brother won't shut up about it since he started working in ML. The problem is he's made me more confused about what the law even IS. He says the version everyone quotes — that when a measure becomes a target it stops being a good measure — is a corruption of the original, which was something about econometrics, a regression, and the UK trying to control the money supply in the 70s. And apparently people in his field have a whole taxonomy with like four different variants (I remember one being about adversarial gaming and one about regression to the mean?) that everyone smashes together into "people cheat on metrics." So right off the bat I don't know whether to lead with the econometrics version or the cheating version, or whether they're actually the same law wearing the same name, and honestly my class has taken one semester of econ and thinks correlation is basically magic, so I can't assume anything.

  Don't explain Goodhart's law to me — I mostly get it, that's not what I'm asking for. I need a plan for the talk itself. What order should the pieces go in and what depends on what, what single example should carry the whole thing (I'm torn between the Wells Fargo fake accounts scandal, which my teacher will like because it's real business history, and one from my brother's field where an AI trained to play a boat racing game figured out it got more points circling in a lagoon grabbing power-ups than actually finishing the race — he loves that one. Tell me which is the better carrier for THIS audience and why, or if there's a third that beats both), the misconceptions my classmates will walk away with no matter what I say — I already predict "so all metrics are useless" and "it's a law like supply and demand" but I bet there are sneakier ones — and exactly where in the sequence I should head each one off rather than at the end when nobody's listening anymore.

  Last thing: I want to end with the twist that our own class is an instance of the law — half of them are listening to me at all because I'm being graded on this presentation, so am I optimizing for a grade or for them actually learning something, and can they even tell the difference? Is that a good closer or is it too cute? And if it works, what one question should I ask them at the end to check whether they actually got the concept or just nodded along? Also tell me what I should openly refuse to get into at this level — my brother keeps trying to get me to explain the four variants in detail and I suspect that's a mistake for a 15 minute talk, but I'd like your actual reasoning rather than my vibe.
reasoning: |-
  Here's a thinking process that leads to the suggested talk plan:

