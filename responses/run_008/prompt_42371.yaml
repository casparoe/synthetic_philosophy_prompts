  *(Refining the Brother's Variants)*: I need to give the user a specific line to shut that down politely if asked. "That's grad school stuff."

  *(Refining the Example)*: Actually, the AI Boat Race is *very* clear visually. But Wells Fargo is *economically* clearer. I will argue for Wells Fargo because it involves *human agency* which is central to econ. AI is often seen as "glitchy." Humans are "rational actors." Goodhart is about rational actors.

