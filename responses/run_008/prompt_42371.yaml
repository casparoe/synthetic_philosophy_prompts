answer: |-
  Here is the battle plan for your 15 minutes.

  ### 1. The Carrying Example: Choose Wells Fargo
  **Verdict:** Drop the AI boat race. Use **Wells Fargo**.

  **Why:**
  *   **Audience Fit:** You are in an *econ* elective. The AI example is a failure of *specification* (the coder didn't tell the AI what "winning" really looks like). Wells Fargo is a failure of *incentives* (humans knew what winning looked like and chose the path of least resistance). Econ is about human agency and incentives.
  *   **Stakes:** An AI circling a lagoon is funny. People getting fired and customers getting ruined is serious. It commands attention.
  *   **Clarity:** Everyone understands "selling accounts." Not everyone understands reinforcement learning reward functions. You don't want to spend 5 minutes explaining how the AI works before you can explain the law.

  **The Twist:** Use the AI example as a *footnote* only if you have extra time. Say, "This happens in tech too—an AI learned to spin in circles to farm points instead of finishing the race—but the economic mechanism is identical to Wells Fargo." This validates your brother without derailing your talk.

  ### 2. The Run of Show (15 Minutes)
  *Time is tight. Do not go over. Practice with a timer.*

  **0:00 – 2:00: The Hook & The "Corruption" Admission**
  *   **Start:** "My brother works in AI. He says I'm teaching this wrong. He says Goodhart's Law isn't about cheating; it's about econometric regression failure in 1970s UK monetary policy."
  *   **Pivot:** "He's technically right. But for us, the 'corrupted' version is more useful. Today we aren't doing econometrics. We're talking about incentives."
  *   **Define:** State the popular version clearly: *When a measure becomes a target, it ceases to be a good measure.*
  *   **Why this works:** You immediately acknowledge the complexity (satisfying your own conscience/brother) but set boundaries for the class.

  **2:00 – 7:00: The Wells Fargo Case (The Meat)**
  *   **Setup:** Management wanted "cross-sell ratio" (8 accounts per customer).
  *   **The Measure:** Number of new accounts opened.
  *   **The Target:** Keep your job/get a bonus.
  *   **The Break:** Employees opened fake accounts.
  *   **The Analysis:** Did the employees stop being good bankers? No. They started being good *at the metric*. The correlation between "accounts opened" and "customer trust/value" broke because the metric was targeted.
  *   **Visual:** Show a graph where the line goes up (accounts) and then a dotted line showing "actual value" crashing down.

  **7:00 – 10:00: The Mechanism & Misconception Interception**
  *   *This is where you preempt the errors before they solidify.*
  *   **Misconception 1: "It's just cheating."**
      *   **Intercept here:** "Was this fraud? Yes. But Goodhart's Law applies even without fraud. If teachers teach to the test, test scores go up, but does learning go up? Not necessarily. No cheating required, just optimization."
  *   **Misconception 2: "All metrics are useless."**
      *   **Intercept here:** "Does this mean we should measure nothing? No. It means you need *multiple* metrics. If Wells Fargo measured 'accounts opened' AND 'customer complaints,' the fraud is harder to hide."
  *   **Misconception 3: "It's a physical law."**
      *   **Intercept here:** "It's not gravity. It's psychology. It only happens because people *react*. If you measure the temperature outside, the thermometer doesn't change the weather. If you measure a trader's performance, the trader changes the trades."

  **10:00 – 12:00: The "Brother" Taxonomy (The Exclusion)**
  *   **Address the elephant:** "There are technical variants of this. My brother calls them things like 'reward hacking' or 'regression collapse.'"
  *   **The Refusal:** "I am not going to explain those. Why? Because in this room, the mechanism is the same: **Incentives change behavior.** Whether it's a bank teller or a neural net, if you optimize for the proxy, you lose the goal. Don't get lost in the taxonomy."
  *   **Reasoning for you:** This establishes your authority. You aren't skipping it because you don't know it; you're skipping it because it's noise for *this* audience.

  **12:00 – 14:00: The Meta-Closer (The Class)**
  *   **Verdict:** It is **not too cute**. It is excellent, *provided* you frame it as an insight, not an apology.
  *   **The Script:** "Look at this room. I am being graded on this presentation. Technically, my target is 'get an A.' Your target is 'get through Thursday.' Goodhart's Law suggests I should optimize for what the professor wants, not what helps you learn. I could use big words and speak fast to sound smart. But if I do that, the metric (my grade) goes up, and the measure (your understanding) goes down."
  *   **The Turn:** "The only way to beat Goodhart's Law here is if my grade *depends* on you actually learning. Which is why..."

  **14:00 – 15:00: The Check Question**
  *   **Do NOT ask:** "Can anyone define Goodhart's Law?" (They will just parrot you).
  *   **DO ask:** "If the university decided to grade professors based *only* on how much students laugh in class, what happens to the quality of the econ degree in five years?"
  *   **Why:** It forces them to apply the mechanism to a new context immediately. If they get it, they'll yell "Stand-up comedy!" or "No one learns anything!"

  ### 3. What to Refuse (The Brother's Variants)
  You are correct to suspect explaining the four variants is a mistake. Here is the reasoning you asked for:

  1.  **Cognitive Load:** 15 minutes is ~1,800 spoken words. Explaining one example takes 600 words. Explaining the history takes 300. Explaining *four* distinct technical variants requires defining the baseline for each. You will run out of time.
  2.  **Diminishing Returns:** For Econ 101, the marginal utility of distinguishing between "Extremal Goodhart" and "Causal Goodhart" is near zero. The actionable insight is "Metrics create incentives." The taxonomy is for people *designing* the metrics, not people *studying* the incentives.
  3.  **The "Uncanny Valley" of Knowledge:** If you explain the variants poorly (because you are rushed), you will look like you don't understand the base law. If you explain the base law well and acknowledge the variants exist, you look like a pragmatist.

  **The Line to Use:** "There is a deep technical taxonomy of this used in ML and advanced econometrics. It matters if you are building the algorithm. But if you are the human *being measured*, there is only one law: You will game the system. We are focusing on the human side."

  ### 4. Summary of Dependencies
  *   **The Example depends on the Definition:** You must state the law *before* Wells Fargo, or the story is just a crime report, not an econ lesson.
  *   **The Misconceptions depend on the Example:** You can't explain why "metrics aren't useless" until you've shown a metric failing.
  *   **The Closer depends on the Misconceptions:** You can only make the meta-joke about the class if you've already established that "optimizing for the target hurts the goal."

  ### 5. Final Advice on Delivery
  *   **Don't apologize for the "corrupted" version.** Your brother is a practitioner; you are an economist (in training). The popular version is the *economic* version (incentives). The original was the *statistical* version (regression). You are in an econ class. You own the incentive version.
  *   **Watch the clock on the Wells Fargo story.** It is easy to get lost in the scandal details. Stick to: Target -> Behavior -> Collapse.
  *   **Land the Closer.** When you ask the "professors graded on laughter" question, wait for the answer. Do not answer it yourself. Let them say it. That silence is where the learning happens.

  Good luck. Don't let your brother ruin the talk.
