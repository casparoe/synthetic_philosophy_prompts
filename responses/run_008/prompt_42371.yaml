  10. **Tone Check:** Keep it direct, strategic, and slightly witty. (Self-Correction: Make sure I explicitly tell the user *why* Wells Fargo beats the AI example for an *econ* class).

  11. **Final Polish:** Organize with clear headings and time stamps. Ensure the "Why" is clear for every decision. (Proceed to generate output).

