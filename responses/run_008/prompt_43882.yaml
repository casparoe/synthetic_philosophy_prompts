          2.  Tension 1 (High): (c) vs (d) [The Rationality of Persistence]. Explain the "degeneration" definition nuance.
          3.  Tension 2 (Medium-High): (a) vs (f) [Conventionalism vs Realism]. Explain the fiat vs truth conflict.
