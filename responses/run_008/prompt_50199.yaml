answer: |-
  It is a compelling intuition you have landed on, and it resonates with a certain robust realism about structure that tries to save the phenomena of design without invoking a designer. You are effectively arguing for a Platonic realism about solutions, where the space of possible functional arrangements exists independently of the physical processes that stumble upon them. When you say the reason the anglerfish lure looks like a worm was there before the fish, you are claiming that the functional mapping between worm-shape and prey-attraction is a truth about the world akin to a mathematical truth, waiting to be instantiated rather than created by the instantiation. Your friend's objection is the standard Humean caution that we are conflating the map with the territory, taking our retrospective narrative convenience and projecting it onto blind causal chains. To stress-test this properly, we need to look at where this view might break, and I think the fractures appear most clearly when we move from the biological cases you started with to the physical cases like the river meander, which is where your view becomes more ambitious than the standard Dennettian position.

  The most fatal defeater for your position, the one that would force a complete abandonment rather than a revision, is the problem of empirical equivalence. You asked for a case where describing something as a free-floating rationale versus nothing-but-causal-history licenses different expectations, and the hard truth is that it is difficult to construct one. In almost every instance, the causal history is what confirms the rationale. If we found an anglerfish lure that looked like a worm but actually repelled prey, we would not say the rationale existed but was failed; we would say there was no rationale there to begin place, only a coincidental resemblance. If the existence of the rationale is always contingent on the causal success of the structure, then the rationale adds no predictive power over the causal history alone. A committed defender might try to argue that the rationale predicts convergent evolution, suggesting that because the solution exists independently, different lineages should find it. But causal physics predicts convergence too, because physical constraints are universal. If the free-floating rationale does not allow you to predict a structure that causal history would rule out, or vice versa, then the ontology of the rationale is doing no work. It becomes a redundant layer of description, and while redundant layers are not always false, they are vulnerable to Occam's razor. If you cannot point to a scenario where believing in the independent existence of the rationale changes your bet on what you will find in the world, you are holding a lens rather than a position, and if you claim it is a position about the furniture of the universe, that lack of empirical traction is fatal.

  Slightly less devastating but still profoundly damaging is the threat of triviality, which becomes acute when you extend the view to rivers and physics. You mentioned getting wobbly about the river meander, and that wobble is likely your intuition detecting a category error. In biology, selection filters out failures, so there is a sense in which the organism is trying to solve a problem and can fail. In physics, a river follows the path of least resistance because of immediate causal laws, not because it is selecting from variants. If you claim that energy minimization is a free-floating rationale, you risk universalizing the concept to the point of meaninglessness. Every physical system settles into a state that minimizes some potential energy or maximizes entropy. If every causal outcome can be retrofitted as the solution to a minimization problem, then everything has a free-floating rationale. A rock rolling down a hill has a rationale. A gas expanding in a chamber has a rationale. At this point, the term rationale loses its distinctive force. It no longer distinguishes designed or selected systems from brute physical systems. A defender might try to explain this away by arguing that only systems with complex functional organization count, but then you have to define complexity without smuggling in the very notion of design you are trying to ground. If you cannot draw a non-arbitrary line between the river meander and the anglerfish lure without appealing to the presence of a selection mechanism, then your extension to selection-free processes is the weak point that threatens to collapse the whole distinction.

  A serious trouble spot that falls short of fatal but requires significant philosophical heavy lifting is the problem of normativity. Rationales usually imply correctness conditions. There is a right way and a wrong way to solve a problem. In evolution, the wrong way is death or reproductive failure. In your river example, what counts as a mistake? If a river floods because its meander was too tight, was it violating a rationale, or just obeying a different set of causal constraints? If there is no possibility of error, there is no possibility of correctness, and without correctness, the language of rationale seems misplaced. Your friend's projection charge hits hardest here. You are describing a causal necessity as a normative success. A defender could concede that physical systems do not have normativity in the biological sense but argue they have a weaker form of teleology, perhaps grounded in variational principles. However, this requires accepting that the word rationale is being used analogically rather than univocally. If you concede this, you must admit that the rationale in the river is not the same kind of thing as the rationale in the anglerfish, which undermines the unity of your theory. The explaining-away stops being principled if you have to keep adjusting the definition of rationale to fit the system you are looking at. If the definition stretches to cover rivers but shrinks to exclude random noise, you need a clear criterion for where the stretch stops, otherwise the view becomes unfalsifiable.

  This leads directly to your question about whether the view becomes unfalsifiable and whether that is a problem. If the view is meant to be a claim about ontology, unfalsifiability is a vice. If it is meant to be a lens, it is acceptable but less ambitious. The danger is that free-floating rationales become a just-so story generator. Whenever we see structure, we posit a rationale. Whenever we see no structure, we posit constraints that hid the rationale. This protects the view from refutation but empties it of content. To avoid this, you would need to specify conditions under which you would admit there is no rationale. Perhaps if a structure appears that is strictly suboptimal and persists without constraint? But even then, you could argue the rationale was to satisfy a different constraint we haven't identified. A committed defender would likely have to concede that the view is primarily interpretive, a stance of looking for function, rather than a discovery of independent entities. If you want to maintain it as a robust ontological claim, you need to find a case where the rationale exists but is never instantiated, or is instantiated against causal odds. But if it is never instantiated, how do you know it is there? If it is instantiated against odds, how do you distinguish that from a statistical fluctuation? Without a clear answer, the view risks floating free of evidence entirely.

  Regarding your extension to rivers and selection-free processes, I suspect this is where the view breaks unless you are willing to weaken the notion of rationale significantly. The cheap fix is indeed dropping the extension and restricting free-floating rationales to systems with a history of selection or replication, which preserves the normative force of the concept. Selection provides the filter that turns causal history into a search process, and search processes are what rationales describe. Without selection, you just have physics. If you keep the extension, you need a weaker notion, perhaps something like latent structural affordances. This covers the river case without implying the river is solving a problem in the same sense the fish is. However, this weaker notion might not carry the philosophical weight you want it to carry regarding the independence of reasons from minds. It becomes a claim about mathematical possibilities rather than functional reasons. If you are comfortable with that, you can keep the river case, but you must acknowledge that you are shifting from a theory of function to a theory of mathematical platonism about physical states.

  Ultimately, the most persuasive thing against your view is the lack of a divergence in predictions between the rationale stance and the causal stance. If you can find a scenario where the causal history suggests one outcome but the free-floating rationale suggests another, and the rationale wins, you would have a powerful argument. But nature does not seem to work that way. The rationale is always supervenient on the causal powers. The anglerfish lure works because of physics and psychology, not because of an abstract rationale pulling it into shape. The rationale is our description of why those causal powers were selected. To say the rationale was there before the mind is to say the mathematical truth was there before the mind, which is plausible, but to say it was there before the selection process is to say the solution existed before the problem was posed by the environment. That is a harder sell. If you treat the environment as posing the problem, then the problem exists independently, but the rationale is the solution, and solutions only exist relative to the problems posed by the specific causal context. I think your friend is right that there is a risk of smuggling mind-dependent descriptions into the furniture of the universe, but you are also right that there is a reality to the functional mapping that is not created by our observation. The middle ground is likely that the structural relationships exist independently, but the status of those relationships as rationales is dependent on the existence of a system that can exploit them, whether that system is a mind or a selection process. If you drop the requirement for a selection process, you dilute the concept of rationale until it is synonymous with causal law, which might be true but is not particularly illuminating.
