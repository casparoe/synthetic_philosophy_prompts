prompt: |-
  I'm a staff writer at a magazine that covers science and technology, and a growing share of my beat is automation and jobs — AI tools in radiology, warehouse robots, generative models and copywriting, the endless studies claiming some percentage of occupations is "exposed." My problem is that I have no economics training, my editor has less, and we have no framework for telling the serious claims from the noise, so coverage ends up driven by whatever press release arrives on a slow day. Rather than reach for the latest labor econ paper, I want to go back to the person who thought hardest about machinery and labor before it was a beat: Marx. Not for the politics, but for the conceptual apparatus — his distinction between tools that a worker uses and machines that use the worker, the idea that machinery doesn't simply abolish work but restructures the composition of labor, the reserve army of the unemployed as a structural feature rather than a policy failure, and the late notebooks where he speculates that automation might make labor-time cease to be the measure of wealth. What I'd like from you is a decision procedure I can actually run on a pitch or a study in twenty minutes before a story meeting: the questions to ask in order, what would count as an answer to each, where the procedure stops with "don't write this, or write it differently," and — this matters — where it hands off to my judgment because the question is one of framing or emphasis rather than fact, so I know when I'm making a value-laden choice dressed up as a method.

  Please then run the procedure on three cases, chosen so it has to work for its money. First, a pitch based on a consultancy report claiming that a new class of generative tools will "expose" 40% of tasks in a mid-skill occupation, with the consultancy selling retraining services. Second, the historical counterexample I keep getting thrown at me: the ATM, which was supposed to eliminate bank tellers and instead, on the standard story, coincided with more tellers doing different work — I want to know what the procedure does with a case where the doomsaying famously failed. Third, a hard one: a pitch arguing that this time is categorically different, because the machines are beginning to displace not just muscle and routine but the planning and judgment functions that always absorbed the displaced workers before — a claim that gestures, knowingly or not, at what Marx sketched about the general intellect and the end of labor-time as the measure of wealth. I'd like the procedure to give a verdict I won't like on at least one of the three, and I'd like you to say which verdicts it reaches only by leaning on a contested reading of Marx rather than the settled core.

  Two honesty requirements. Marx scholarship is full of live disputes — whether the late notebooks are continuous with Capital or a detour, whether the reserve army mechanism says what it's often taken to say, how much of the automation story rests on the "Fragment on Machines" that enthusiasts quote and textualists distrust. Where a step in the procedure depends on one side of such a dispute, say so explicitly, and distinguish that from the parts where the texts and the secondary literature are roughly in agreement. And tell me plainly where the procedure will misfire — the kinds of automation stories where asking Marx's questions produces a worse article than not asking them — since a framework that can't name its own failure modes is exactly the kind of thing I'm supposed to be skeptical of for a living.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Staff writer at a science/tech magazine. Covers automation/jobs. No econ training. Editor same. Tired of press-release-driven coverage ("X% of jobs exposed").
      *   **Goal:** A decision procedure (framework) based on *Marx's conceptual apparatus* (not necessarily his politics) to evaluate pitches/studies in ~20 minutes.
      *   **Requirements:**
          1.  Step-by-step questions with stop/go criteria.
          2.  Distinguish between factual answers and value-laden framing judgments.
          3.  Run the procedure on three specific cases:
              *   Case 1: Consultancy report (40% tasks exposed, selling retraining).
              *   Case 2: Historical counterexample (ATMs & bank tellers).
              *   Case 3: "This time is different" (AI displacing judgment/planning, "General Intellect").
          4.  One verdict must be unpopular/uncomfortable.
          5.  Identify where the procedure relies on contested Marx scholarship vs. settled core.
          6.  Identify failure modes (where this framework makes the article *worse*).
      *   **Tone:** Intellectual, rigorous, practical, honest about limitations. Not apologetic, not dogmatic.

  2.  **Deconstruct the Marxian Framework (for this specific purpose):**
      *   *Tools vs. Machines:* Does the tech augment the worker's skill or subordinate the worker to the machine's rhythm? (Machine vs. Tool).
      *   *Composition of Labor:* Does it abolish work or restructure it (deskilling/reskilling)?
      *   *Reserve Army:* Is unemployment a bug or a feature (wage suppression)?
      *   *Value/Time:* Is wealth still measured by labor time, or are we moving toward the "Fragment on Machines" (automation making labor-time irrelevant)?
      *   *Who Captures the Gain?* Productivity gains go to capital or labor?

  3.  **Drafting the Decision Procedure (The "Marxian Stress Test"):**
      *   Need to make it actionable for a journalist.
      *   *Step 1: The Agency Check (Tool vs. Machine).* Who drives the process?
      *   *Step 2: The Displacement vs. Restructuring Check.* Is work gone or changed?
      *   *Step 3: The Wage/Power Check (Reserve Army).* Who benefits from the friction?
      *   *Step 4: The Value Measure Check (The "Fragment" Question).* Is the logic of profit changing?
      *   *Stop/Go Criteria:* Need clear "Kill," "Pivot," or "Greenlight" signals.
      *   *Judgment Call Flags:* Explicitly mark where the writer decides the *spin*.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Consultancy):* Likely fails Step 3 (Who benefits?). The "40%" number is likely abstract labor time, not concrete job loss. *Verdict:* Pivot to the business model of fear.
      *   *Case 2 (ATMs):* This is the classic "Lump of Labor" fallacy counter. Marx handles this via *restructuring*. Tellers became salespeople. *Verdict:* Greenlight, but frame as *intensification* or *skill shift*, not "tech didn't kill jobs."
      *   *Case 3 (General Intellect/AI):* This is the hardest. It touches the *Fragment on Machines*. If AI does the thinking, does labor time still measure value? *Verdict:* This needs to be the uncomfortable one. The procedure should suggest skepticism because capital *still* tries to measure by time/profit even if tech outgrows it. Or, conversely, that the claim is premature. Let's make the verdict: "Don't write the 'End of Work' story yet; write the 'Enclosure of Intellect' story."

  5.  **Addressing the "Honesty Requirements" (Scholarly Disputes & Failure Modes):**
      *   *Contested:* The *Fragment on Machines* (Grundrisse) vs. *Capital*. Is it a mature theory or a youthful sketch? The "General Intellect" interpretation (Post-Opéraismo vs. Traditionalists).
      *   *Failure Modes:* Marx is good for power dynamics, bad for short-term macro forecasting. He's not a labor economist. Don't use this to predict unemployment rates next quarter. Don't use this for "how to policy" without bridging to modern institutions.

  6.  **Refining the Output (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too abstract?
      *   *Fix:* Make the questions specific. "Does the study define 'task' as 'time spent' or 'value created'?"
      *   *Critique:* Is the Marx usage accurate?
      *   *Fix:* Ensure distinction between *constant capital* (machines) and *variable capital* (labor). Ensure the "Reserve Army" isn't just "unemployment" but a *lever* against wages.
      *   *Critique:* Did I meet the "unpopular verdict" constraint?
      *   *Fix:* Make sure Case 3 gets a skeptical verdict. Everyone loves the "AI ends labor" story. The Marxian view should be: "Capital will fight to keep labor time relevant even if it's inefficient." That's a more cynical, less utopian take.
      *   *Critique:* Did I distinguish settled vs. contested Marx?
      *   *Fix:* Add a specific section on "Scholarly Fault Lines."

  7.  **Final Polish:**
      *   Check tone. Needs to be respectful of the writer's intelligence.
      *   Ensure the "20-minute" constraint is respected (keep the procedure tight).
      *   Verify the "Judgment Call" markers are clear.

  8.  *(Final Review against constraints)*
      *   Decision procedure? Yes.
      *   3 Cases run? Yes.
      *   Unpopular verdict? Yes (Case 3).
      *   Contested scholarship flagged? Yes.
      *   Failure modes identified? Yes.

  Proceed to generate response. (Mental check: Ensure I don't sound like a Marxist propagandist, but like a tool-builder using Marx as a lens, as requested.)
answer: |-
  Here is a decision procedure designed for your specific constraints: no economics training, high pressure for clarity, and a need to filter noise from structural signal. It relies on the *conceptual anatomy* of Marx's critique of political economy, stripped of partisan teleology.

  ### The Marxian Stress Test (20-Minute Procedure)

  This procedure is not a truth machine; it is a friction generator. It is designed to stop you from writing stories that treat technology as an exogenous force of nature rather than a social relation.

  **Step 1: The Agency Check (Tool vs. Machine)**
  *   **Question:** Does the technology augment the worker's existing skill set, or does it encode the skill into the apparatus, rendering the worker's knowledge redundant?
  *   **Marxian Concept:** *Formal vs. Real Subsumption.* Is labor merely being managed (formal), or is the labor process itself redesigned to fit the machine (real)?
  *   **Pass:** The story acknowledges a shift in *who* holds the knowledge (worker vs. code).
  *   **Fail/Stop:** The story treats the tech as a neutral "productivity booster" without asking whose leverage is reduced.
  *   **Judgment Call:** *Degree of autonomy.* Some encoding is inevitable. You must decide if the remaining human role is "supervision" (high leverage) or "feeding the beast" (low leverage).

  **Step 2: The Composition Check (Displacement vs. Restructuring)**
  *   **Question:** If tasks are "exposed" or eliminated, where does the value go? Is the work abolished, or is it reclassified (e.g., from "skilled labor" to "unskilled monitoring")?
  *   **Marxian Concept:** *Organic Composition of Capital.* As machinery (constant capital) rises relative to labor (variable capital), what happens to the intensity and classification of the remaining labor?
  *   **Pass:** The story tracks the *migration* of tasks, not just the deletion of job titles.
  *   **Fail/Stop:** The story relies on net job counts (e.g., "5 million jobs lost") without analyzing the *quality* or *power dynamics* of the remaining jobs.
  *   **Judgment Call:** *Deskilling vs. Upskilling.* Marx generally argued for deskilling, but history is mixed. You must judge whether "new tasks" require genuine judgment or just new button-pushing.

  **Step 3: The Reserve Army Check (Wages & Power)**
  *   **Question:** Who benefits from the threat of replacement? Even if no one is fired, does the *possibility* of automation suppress wage growth or unionization?
  *   **Marxian Concept:** *The Industrial Reserve Army.* Unemployment is not a bug; it is a lever to discipline the employed.
  *   **Pass:** The story investigates wage stagnation or bargaining power, not just headcount.
  *   **Fail/Stop:** The story assumes full employment = worker well-being.
  *   **Judgment Call:** *Causality.* It is hard to prove automation caused wage suppression specifically. You must decide if the correlation is strong enough to imply mechanism.

  **Step 4: The Value Measure Check (The "Fragment" Test)**
  *   **Question:** Is the claim that this technology makes labor-time irrelevant to wealth creation? If so, how does the firm still plan to make a profit?
  *   **Marxian Concept:** *The Fragment on Machines (Grundrisse).* If automation becomes total, labor time ceases to be the measure of exchange value. Capital faces a contradiction.
  *   **Pass:** The story grapples with the contradiction between infinite productivity potential and the need to sell labor-based products.
  *   **Fail/Stop:** The story claims "End of Work" without explaining how rent/profit is extracted in a post-labor economy.
  *   **Judgment Call:** *Imminence.* This is the biggest judgment call. Is this a theoretical horizon or a current business reality?

  ---

  ### Running the Procedure on Three Cases

  #### Case 1: The Consultancy Report ("40% of Tasks Exposed")
  *   **The Pitch:** A major consultancy releases a study claiming generative AI exposes 40% of tasks in mid-skill admin work. They are selling a "Reskilling Platform."
  *   **Step 1 (Agency):** *Fail.* The report defines "tasks" as time-spent, not knowledge-encoded. It assumes the tool is a "copilot" but sells it as a replacement.
  *   **Step 2 (Composition):** *Stop.* The report counts task hours, not job restructuring. It ignores that the remaining 60% of tasks might become more intense (monitoring the AI).
  *   **Step 3 (Reserve Army):** *Pass (Critical).* The consultancy profits from the *fear* generated by the report. The "Reserve Army" here is the threat used to sell the retraining.
  *   **Step 4 (Value Measure):** *N/A.* No claim of post-labor economy.
  *   **Verdict:** **Do not write the "40% job loss" story.**
  *   **Pivot:** Write the story about the *business model of anxiety*. The "exposure" metric is a sales funnel for the retraining service. The news isn't the tech; it's the monetization of displacement fear.
  *   **Why:** This passes the honesty check. Marx would view this as *fictitious capital*—valorizing a problem to sell the solution.

  #### Case 2: The Historical Counterexample (ATMs & Tellers)
  *   **The Pitch:** "Don't worry about AI. Remember ATMs? They didn't kill tellers; teller jobs grew because banks opened more branches. AI will just make workers more productive."
  *   **Step 1 (Agency):** *Pass.* ATMs encoded cash dispensing (machine), tellers shifted to relationship sales (worker).
  *   **Step 2 (Composition):** *Pass.* Work was restructured, not abolished.
  *   **Step 3 (Reserve Army):** *Fail (Nuanced).* While headcount grew, the *skill composition* changed. Tellers became sales staff. Unionization rates in banking dropped significantly during this period. The "Reserve Army" effect wasn't unemployment; it was the threat of the machine converting the job into something easier to replace.
  *   **Step 4 (Value Measure):** *N/A.*
  *   **Verdict:** **Write, but reframe.**
  *   **Pivot:** Do not write "Tech creates jobs." Write "Tech changes the *type* of power workers have." The ATM story is not a refutation of displacement; it is a case study in *intensification*. Tellers didn't keep their jobs *despite* the ATM; they kept them *because* the ATM made branches cheaper to open, turning tellers into salespeople.
  *   **Why:** This avoids the "Lump of Labor" fallacy while retaining the Marxian insight that "more jobs" does not equal "better work."

  #### Case 3: The "General Intellect" Pitch (AI Displaces Judgment)
  *   **The Pitch:** "This time is different. LLMs don't just do muscle work; they do the thinking. We are entering the 'General Intellect' phase where labor time no longer measures wealth. Universal Basic Income is inevitable."
  *   **Step 1 (Agency):** *Pass.* The machine is encroaching on judgment/planning.
  *   **Step 2 (Composition):** *Pass.* High-skill cognitive labor is being subsumed.
  *   **Step 3 (Reserve Army):** *Pass.* High unemployment in creative/cognitive sectors is emerging.
  *   **Step 4 (Value Measure):** **Fail (Critical).**
  *   **Verdict:** **Kill the "End of Labor" angle. Write the "Enclosure of Intellect" angle.**
  *   **Why (The Unpopular Verdict):** This is the verdict you won't like. The procedure stops you from writing the utopian/dystopian "End of Work" story.
  *   **Reasoning:** While the *technology* might make labor time irrelevant (Step 4), *Capital* does not accept this. Capital will create artificial scarcity (IP law, API costs, walled gardens) to *force* labor time to remain the measure of value. The story isn't that work is ending; it's that capital will fight a rearguard action to keep work relevant even if it's inefficient.
  *   **Pivot:** Don't write about UBI. Write about how tech firms are trying to *rent* the General Intellect rather than liberate it. The conflict isn't Man vs. Machine; it's Open Intelligence vs. Proprietary Enclosure.

  ---

  ### Honesty Requirements: Disputes and Failure Modes

  You asked for plain speech on where this framework leans on contested ground and where it will misfire.

  #### 1. Contested Scholarship vs. Settled Core
  *   **Settled Core:** Steps 1, 2, and 3 rely on *Capital Vol. 1* and the *Grundrisse* sections generally agreed upon by textualists (e.g., Heinrich, Postone, traditionalists). The idea that machinery restructures labor rather than simply deleting it, and that unemployment disciplines wages, is standard historical materialism.
  *   **Contested (Step 4):** The "Value Measure Check" leans heavily on the *Fragment on Machines* (Grundrisse).
      *   *The Dispute:* Many orthodox Marxists argue the *Fragment* is a youthful, Hegelian detour that Marx corrected in *Capital*. They argue labor-time *always* remains the measure of value under capitalism, regardless of automation. Post-Opéraismo thinkers (Negri, Lazzarato) argue the *Fragment* is the prophecy we are living in.
      *   *The Lean:* My procedure treats the *Fragment* as a valid diagnostic tool for AI. If you use Step 4 to claim "Capitalism is ending," you are taking the Post-Opéraismo side. If you use it to say "Capitalism is entering a crisis of measurement," you are on safer ground. I have instructed you to take the skeptical view (Capital will fight to keep measuring value by time), which aligns more with the *Capital* correction than the *Fragment* utopianism.

  #### 2. Failure Modes: When Not to Use This
  This framework will produce a *worse* article in the following scenarios:

  *   **Short-Term Macro Forecasting:** Do not use this to predict unemployment rates for the next quarter. Marx's framework is structural and long-term. It explains *why* wages stagnate over decades, not why layoffs happened at Google last Tuesday. For that, you need Keynesian or Neoclassical demand-side analysis.
  *   **Policy Prescriptions:** This framework is excellent at diagnosis (power dynamics, value extraction) and terrible at prescription. It does not tell you if a specific tax policy or antitrust suit will work. If your editor wants "What Congress Should Do," this tool will make you sound dogmatic.
  *   **The "Worker Experience" Story:** If you are writing a narrative profile of a radiologist using AI tools, this framework can make you sound reductionist. Not every worker feels "subsumed." Some feel empowered. If you force the "Machine uses Worker" frame onto a worker who says "This saves my eyesight," you are ignoring phenomenology for theory.
  *   **Non-Capitalist Contexts:** If you are covering automation in state-run enterprises (e.g., certain sectors in China or historical USSR), the "Reserve Army" and "Value Measure" checks behave differently because the profit motive is not the sole driver.

  ### Summary of Judgment Calls
  In the procedure above, I have flagged three moments where you must override the method with your reporting:
  1.  **Degree of Autonomy (Step 1):** Theory says machines subordinate workers. Reality is often hybrid. You must judge the *balance*.
  2.  **Deskilling vs. Upskilling (Step 2):** Theory predicts deskilling. History shows oscillation. You must verify the *specific* skill shift.
  3.  **Imminence of Value Crisis (Step 4):** Theory suggests a contradiction. Markets suggest adaptation. You must judge if the contradiction is acute enough to drive the story *now*.

  Use this to strip the hype from the press release. If the pitch survives Step 3 (Who benefits from the fear?) and Step 4 (How do they monetize if labor is irrelevant?), you have a story. If it fails, you have an advertisement.
