answer: |-
  Here is a complete design for your 90-minute activity session. It is structured to let the philosophical problem emerge from the friction of the tasks themselves, preserving the "no framing" constraint until the debrief.

  # Session Title: Specification & Execution
  **Time:** 90 Minutes
  **Participants:** Undergraduate Seminar (10–20 students)
  **Materials:**
  *   **Phase 1:** 1 set of 3 juggling beanbags per team (or 3 tennis balls in socks), 1 printed "Technical Specification Sheet" per team, 1 bucket/bin per team (to catch drops).
  *   **Phase 2:** 1 "Cipher Packet" per student, 1 "Key Card" per team, pencils.
  *   **General:** Whiteboard/Projector for the Leaderboard, Timer visible to all.

  ---

  ## Part 1: The Activity Design

  ### The Setup (0:00 – 0:05)
  **Facilitator Script:** "Welcome. Today is a workshop session. Please divide into teams of three. Sit in your groups. Do not open any materials on your desk until I signal the start of Phase 1. There are no readings to discuss today; your goal is simply to maximize your team's score on the Leaderboard."

  *(Write a blank Leaderboard on the board with columns: Team Name, Phase 1 Score, Phase 2 Score, Total.)*

  ### Phase 1: The Motor Specification (0:05 – 0:35)
  **Task:** Sustain a 3-ball cascade pattern for 30 consecutive seconds.
  **Constraint:** You may not practice before the scored attempt. You have 15 minutes to study the **Technical Specification Sheet**. You may hold the sheet during the attempt, but you may not communicate verbally during the scored attempt.

  **The Technical Specification Sheet (The Trap):**
  *Design Note: This text must be exhaustively explicit to mimic the Intellectualist promise, yet rely on tacit understanding to trigger the regress.*

  > **PROTOCOL 3-BALL CASCADE: VERSION 4.2**
  > 1.  **Stance:** Stand with feet shoulder-width apart. Face forward.
  > 2.  **Grip:** Hold two balls in the dominant hand (one in palm, one between fingers), one ball in the non-dominant hand.
  > 3.  **Initiation:** Throw Ball A from the dominant hand.
  > 4.  **Trajectory:** The ball must travel in an arc. The apex of the arc must be at eye level. The ball must cross the midline of the torso to the opposite side.
  > 5.  **Timing:** Initiate Throw B (from non-dominant hand) exactly when Ball A reaches its apex.
  > 6.  **Catch:** Close fingers around the ball when it descends to chest level.
  > 7.  **Loop:** Repeat Throws A and B alternately. Ensure hands remain outside the arc of the balls.
  > 8.  **Correction:** If a ball deviates >15 degrees from the midline, adjust wrist angle by 5 degrees inward.

  **Scoring:**
  *   +10 points for every 5 seconds of continuous juggling.
  *   -5 points for every drop.
  *   **Max Score:** 60 points.

  **The Experience:**
  Students will read the sheet. They will nod. They will stand up. They will throw. They will drop immediately.
  *   *Why?* "Eye level" is subjective. "Exactly when" requires a sense of timing not in the text. "Adjust wrist angle" requires knowing what the wrist is doing without looking.
  *   *The Regress Moment:* To follow instruction #5 ("Initiate... when Ball A reaches apex"), the student must *watch* the ball and *judge* the apex. That act of judging is itself a skill not specified in the sheet. If they try to consult the sheet while moving, they freeze.

  ### Phase 2: The Cognitive Key (0:35 – 0:55)
  **Facilitator Script:** "Return to your seats. Put away the balls. Take out the Cipher Packet."

  **Task:** Decode a paragraph of text.
  **Constraint:** You have 5 minutes to study the **Key Card**. You may not begin writing until the timer starts.

  **The Key Card (The Solution):**
  > **ROT-13 SUBSTITUTION RULE**
  > To decode a letter, find it in the alphabet and count forward 13 positions.
  > A ↔ N, B ↔ O, C ↔ P ... (Full table provided)
  > *Rule:* Replace every encoded letter with its pair. Preserve spaces and punctuation.

  **The Cipher Packet:**
  > "Gur cnffjbeq vf: FLOYR" (The password is: FRYLE)

  **Scoring:**
  *   +5 points for every correctly decoded word.
  *   +20 bonus points for the first team to decode the full message.
  *   **Max Score:** ~60 points (calibrated to match Phase 1).

  **The Experience:**
  Once they have the Key (the proposition), the execution is immediate. There is no "practice" needed to apply the rule. If they know the rule, they can do the task. There is no gap between *knowing the rule* and *applying the rule* other than processing speed.

  ### Transition & Tally (0:55 – 1:00)
  Collect scores. Fill the Leaderboard.
  **Facilitator Script:** "Take a 5-minute break. When we return, we will discuss why the scores look the way they do."

  ---

  ## Part 2: The Debrief (1:00 – 1:30)

  *Now* you introduce the terminology. Write **Knowing-That** and **Knowing-How** on the board.

  ### 1. Mapping the Experience (10 mins)
  Ask the class to describe the *feeling* of the two phases without using philosophical jargon yet.
  *   **Q:** "In Phase 1, did anyone feel that reading the sheet *more carefully* would have solved the dropping problem?"
      *   *Expected Answer:* No. We knew what to do, but our hands didn't do it.
  *   **Q:** "In Phase 2, was there any gap between understanding the Key and decoding the letters?"
      *   *Expected Answer:* No. Once I knew the rule, I could do it.
  *   **Q:** "Point to the moment in Phase 1 where the instructions failed you."
      *   *Target:* Students should identify moments like "It said 'eye level,' but I didn't know how to throw to that height consistently."

  ### 2. Introducing Ryle's Distinction (10 mins)
  *   **Knowing-That (Propositional):** Phase 2. Possessing a fact or rule (The Key) is sufficient for the performance. The intelligence is in the *possession* of the truth.
  *   **Knowing-How (Procedural):** Phase 1. Possessing the facts (The Specification Sheet) was *insufficient*. The intelligence is in the *execution*.
  *   **Ryle's Claim:** Intellectualism (the Cartesian view) argues that Knowing-How is just a species of Knowing-That. It claims the juggler is secretly reciting propositions before every throw.

  ### 3. The Regress Argument (5 mins)
  Use the "Regress Moment" from Phase 1.
  *   **Facilitator:** "The Instruction Sheet said: 'Throw when Ball A reaches apex.' To follow that instruction, you had to *judge* the apex. Is 'judging the apex' an action?"
  *   **Class:** Yes.
  *   **Facilitator:** "If intelligent action requires following a rule, do you need a rule for *how to judge the apex*?"
  *   **Logic:** If every intelligent act requires contemplating a rule first, then contemplating that rule is itself an intelligent act requiring *another* rule. This leads to an infinite regress.
  *   **Conclusion:** We stop the regress not by finding more rules, but by exercising a capacity (knowing-how) that is not rule-following.

  ### 4. The Category Mistake (5 mins)
  *   **Facilitator:** "Why did the Instruction Sheet feel absurdly detailed yet useless?"
  *   **Point:** Treating 'juggling' as a set of propositions is a **Category Mistake**. It treats a capacity (a disposition) as if it were a repository of facts. It's like visiting Oxford, seeing the libraries and dorms, and asking, "But where is the University?" The University *is* the way the buildings are organized and used, not another building alongside them.
  *   **Application:** "Mind" is not a ghostly theater where rules are read; it is the public, observable disposition to act in certain ways under certain conditions.

  ---

  ## Part 3: Failure Modes & Contingencies

  **1. The "Natural Juggler" in the Room**
  *   **Risk:** One student already knows how to juggle. They score 60 instantly. This undermines the "Instructions $\neq$ Ability" point for their team.
  *   **Mitigation:** In the debrief, isolate this student. Ask them: "Did you consult the sheet?" (No). "Did you recite rules in your head while juggling?" (No). "So your success confirms Ryle: you acted from capacity, not from theoretical contemplation." Turn the exception into proof of the rule.
  *   **Backup Task:** If you suspect many jugglers, swap Phase 1 for **Knot Tying (The Bowline)** with the same verbose instruction sheet. It is low-space and rarely known beforehand.

  **2. The "Instruction Skeptic"**
  *   **Risk:** Students argue, "The instructions were just bad. If they were *better*, they would work." This is the Intellectualist counter-move (the "tacit premise" defense).
  *   **Mitigation:** Acknowledge this. "Ryle anticipates this. The Intellectualist says, 'You just lacked the *right* proposition.' But to apply *any* proposition, you need the know-how to apply it. Better instructions just push the regress back one step."

  **3. Timing Drift**
  *   **Risk:** Phase 1 runs long because students keep trying to "get it."
  *   **Mitigation:** Be a strict timekeeper. Use a loud whistle or bell. "Pens down, balls in the bin." The frustration of being cut off is actually data for the debrief ("You wanted more time to *practice*, not to *read*").

  ---

  ## Part 4: Limitations & The "Psychology Collapse"

  **What This Activity Cannot Do**
  This activity demonstrates a *phenomenological* and *practical* gap between rules and action. It does **not** prove Ryle's deeper logical point about the grammar of mental concepts on its own.

  **The Risk: The Cognitive Science Collapse**
  Students (especially those familiar with psychology) will immediately map your distinction onto **Declarative Memory (Hippocampal)** vs. **Procedural Memory (Basal Ganglia)**.
  *   *The Trap:* They will think Ryle is making a claim about *brain architecture*.
  *   *Ryle's Actual Claim:* Ryle is making a claim about **Logical Grammar**. He is arguing that it is a *mistake* to describe "being intelligent" as "causing behavior via inner thoughts." Even if we find the neural correlate of skill, describing the action as "following a neural rule" is still a category mistake in the *language of explanation*.

  **How to Guard Against This in Debrief**
  You must explicitly intervene in the last 5 minutes.
  *   **Script:** "Many of you are thinking this is about brain systems: 'Phase 2 used my declarative memory, Phase 1 used my procedural memory.' That is a scientific hypothesis. Ryle's point is logical. He is saying that even if we had a complete map of the brain, describing a clever action as 'obeying a neural command' is still the wrong *category* of description. 'Intelligent' describes the *style* and *adaptability* of the public act, not the hidden cause. If we treat 'Knowing-How' as just 'Knowing-That stored in a different folder,' we haven't escaped the Intellectualist myth; we've just moved the ghost from the mind to the neurons."

  **Summary for the Facilitator**
  Your job in the debrief is to prevent the class from settling on "Skills are just unconscious rules." You must press that **skills are not rules at all**, conscious or otherwise. They are dispositions. The activity shows the *gap*; your commentary must ensure they don't fill that gap with "hidden propositions."

  ---

  ### Materials Appendix: Phase 1 Instruction Sheet (Printable Text)

  **TASK: 3-BALL CASCADE EXECUTION**
  **CLEARANCE LEVEL: TRAINEE**

  **1.0 PREPARATION**
  1.1 Stand with feet parallel, separated by 0.5 meters.
  1.2 Knees slightly flexed (approx. 10 degrees).
  1.3 Hold Ball 1 and Ball 2 in Dominant Hand. Hold Ball 3 in Non-Dominant Hand.

  **2.0 THE THROW CYCLE**
  2.1 **T1:** Propulse Ball 1 from Dominant Hand.
     2.1.1 Trajectory: Parabolic arc.
     2.1.2 Apex Height: Z-axis coordinate equal to observer's eye level.
     2.1.3 Landing Zone: Contralateral hand space.
  2.2 **T2:** Propulse Ball 3 from Non-Dominant Hand.
     2.2.1 Trigger Condition: Initiate T2 precisely when Ball 1 reaches Apex Height (See 2.1.2).
     2.2.2 Trajectory: Mirror image of T1.
  2.3 **T3:** Propulse Ball 2 from Dominant Hand.
     2.3.1 Trigger Condition: Initiate T3 precisely when Ball 3 reaches Apex Height.

  **3.0 THE CATCH PROTOCOL**
  3.1 Monitor descending objects visually.
  3.2 Upon object entry into capture zone (chest level), close digits 2-5 against palm.
  3.3 Immediately transition captured object into Throw Configuration (See 2.0).

  **4.0 ERROR CORRECTION**
  4.1 If object velocity is insufficient, increase wrist snap torque by 15%.
  4.2 If object trajectory deviates laterally, adjust shoulder rotation by 5 degrees.
  4.3 If rhythm is lost, pause, reset to 1.0, and re-initiate.

  **WARNING:** FAILURE TO MAINTAIN RHYTHMIC CADENCE WILL RESULT IN SYSTEM COLLAPSE (DROPS).
