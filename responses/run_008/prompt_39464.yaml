answer: |-
  **JOINT STATEMENT ON THE COMPUTATIONAL NATURE OF COGNITION AND CONSCIOUSNESS**

  **Date:** October 24, 2023
  **Parties:** 
  *   **The Computationalist (Comp):** Holds that cognitive and conscious states are constituted by computational states.
  *   **The Anti-Computationalist (Anti-Comp):** Holds that computation is an observer-relative description and that mental states depend on specific biophysical causal powers.

  **Preamble:**
  We, the undersigned, acknowledge that the debate regarding whether "the brain is a computer" has stagnated due to terminological slippage and uncharitable interpretations. We have engaged in an adversarial collaboration to isolate the substantive disagreements from the verbal ones. This document represents our current consensus on definitions, empirical ground, and the precise locus of our remaining divergence.

  ***

  ### 1. Disambiguation and Scope

  We agree that the word "computation" is overloaded. To ensure our disagreement is not merely verbal, we distinguish three senses:

  1.  **Computation$_{math}$:** An abstract mathematical function or automaton (e.g., a Turing Machine specification).
  2.  **Computation$_{desc}$:** The attribution of computational states to a physical system by an observer (e.g., "This wall implements a WordStar emulator" via arbitrary mapping).
  3.  **Computation$_{causal}$:** A physical process where the causal transitions between physical states mirror the state transitions of a formal automaton *under counterfactual interventions*.

  **Scope of Debate:**
  We agree that the brain can be *modeled* as a computer in the sense of **Computation$_{desc}$**. This is trivial and not contested. 
  We agree that the brain performs information processing in a broad cybernetic sense.

  **The Actual Dispute:**
  The debate concerns **Computation$_{causal}$** and its relation to **Ontology**.
  *   **Comp** asserts that if a physical system instantiates **Computation$_{causal}$** of sufficient complexity/structure, it *constitutively* possesses mental states, regardless of substrate.
  *   **Anti-Comp** asserts that **Computation$_{causal}$** is insufficient. Mental states require specific *intrinsic* causal powers (biological, embodied, or dynamic) that formal state-descriptions necessarily abstract away.

  **Signatory Confirmation:**
  *   **Comp:** Confirms their view survives this cleanup. They do not claim the brain is an abstract Turing Machine (**Computation$_{math}$**), but that the specific causal organization (**Computation$_{causal}$**) is what matters, and this organization is substrate-neutral.
  *   **Anti-Comp:** Confirms their view survives this cleanup. They do not deny the brain processes information, but deny that "computation" (even causal) captures the *nature* of consciousness, which they view as a biological/physical phenomenon akin to digestion or photosynthesis, not a formal one.

  ***

  ### 2. Agreed Claims (Non-Vacuous)

  We jointly affirm the following propositions. These are not mere platitudes; they rule out naive versions of our respective positions.

  1.  **Rejection of Pancomputationalism:** Not every physical system implements every computation. A rock does not think. Any viable theory must provide non-arbitrary constraints on what counts as a physical implementation of a formal state.
  2.  **Empirical Contingency of Multiple Realizability:** Whether mental states can be realized in non-biological substrates is an empirical question, not an *a priori* truth. It is logically possible that consciousness is substrate-dependent.
  3.  **Neuroscientific Consensus:** Current neuroscience establishes that neurons communicate via electrochemical signals that can be modeled as thresholded integrators. There is no evidence of "neural magic" (e.g., quantum coherence at warm temperatures) that violates known physics.
  4.  **Rejection of Naive Behaviorism:** Internal structure matters. Two systems with identical input-output behavior but different internal causal architectures may differ in mental status. (Comp cites lack of algorithmic structure; Anti-Comp cites lack of biological causality).
  5.  **Current AI Status:** Existing Large Language Models and digital neural networks, as currently architected, lack the requisite structural or biological properties to be considered conscious agents.
  6.  **The Hard Problem Remains:** Neither side claims to have solved the Hard Problem of Consciousness. Comp claims computation *dissolves* or *solves* it via functionalism; Anti-Comp claims computation *ignores* the phenomenological reality. Both admit the explanatory gap persists.

  ***

  ### 3. Statement of Disagreements

  The following table outlines our residual disagreements. Each row states the same core conflict in language each party finds faithful to their view.

  | Topic | Computationalist Formulation | Anti-Computationalist Formulation |
  | :--- | :--- | :--- |
  | **Ontological Status** | Mental states are **functional states**. If the causal relations between inputs, internal states, and outputs are preserved, the mental state is preserved. | Mental states are **biological/physical states**. Computation describes the *shape* of the process, but consciousness is generated by the *stuff* and its specific causal powers. |
  | **Syntax vs. Physics** | Syntax (formal structure) can be **intrinsic** to a physical system if the system's causal dynamics reliably track state transitions under intervention. | Syntax is **observer-relative**. Physics contains only particles and fields; "symbols" and "rules" are imposed by interpreters, not found in nature. |
  | **Substrate Independence** | **Strong:** Mental properties supervene on computational organization. Silicon, biology, or optics are interchangeable if the causal graph is isomorphic. | **Weak/False:** Mental properties supervene on specific biophysical dynamics (e.g., dendritic computation, neuromodulation). Changing substrate changes the phenomenon. |
  | **The "Missing" Element** | Anti-Comp relies on an unexplained "causal oomph" that sounds suspiciously like dualism or vitalism disguised as physics. | Comp relies on a "formalist magic" where abstract relationships generate experience without requiring specific physical mechanisms. |

  ***

  ### 4. The Cruxes: The Implementation Problem

  We identify the **Implementation Problem** as the primary theoretical crux. If the mapping between physical states and formal states is too loose, pancomputationalism follows (everything thinks). If too tight, substrate independence fails.

  **Computationalist Constraint:**
  *   **Constraint:** A physical system implements a computation only if its physical states support the **counterfactuals** of the formal states. (i.e., If the formal machine *would* transition to State B given State A, the physical system *must* have a causal mechanism that *would* drive it to Physical State B given Physical State A, across a robust range of perturbations).
  *   **Prediction:** Under scrutiny, the Anti-Comp's requirement for "specific biological causality" will collapse into either (a) a computational constraint (admitting function matters) or (b) a dualist claim (positing non-physical properties of biology).

  **Anti-Computationalist Constraint:**
  *   **Constraint:** A physical system implements a mind only if the causal powers generating the states are **intrinsically semantic** or biologically specific (e.g., specific ion channel dynamics, embodied sensorimotor coupling). Isomorphism is insufficient; the physical *mechanism* must be of the right natural kind.
  *   **Prediction:** Under scrutiny, the Comp's "counterfactual constraint" will fail to rule out trivial systems (like a giant lookup table or a slow, distributed simulation) or will implicitly rely on the very biological constraints Anti-Comp emphasizes (e.g., requiring real-time causal integration).

  ***

  ### 5. Concrete Cases and Predictions

  We agree to test our constraints against the following hypothetical scenarios. We record our predictions here to be evaluated against future intuition pumps or technological developments.

  | Scenario | Computationalist Prediction | Anti-Computationalist Prediction |
  | :--- | :--- | :--- |
  | **1. The Neuromorphic Analog Chip**<br>A chip using continuous, noisy analog voltages to simulate neuronal dynamics at 1/1000th biological speed, matching dendritic non-linearities. | **Conscious.** The causal structure is isomorphic to the brain. Speed is irrelevant to computation. The analog noise is part of the computation. | **Unconscious.** The timescale disrupts the necessary temporal integration of biological processes. The substrate (silicon) lacks the specific biophysical causal powers. |
  | **2. The Giant Lookup Table**<br>A system that maps every possible sensory input sequence to a behavioral output sequence identical to a human, without internal state dynamics. | **Unconscious.** (Refining naive functionalism). It lacks the *causal structure* of the algorithm. It cannot support the requisite counterfactuals (it breaks if inputs deviate from the table). | **Unconscious.** It is a static object. It lacks genuine causality and biological agency. |
  | **3. The Distributed "China Brain"**<br>Human citizens simulate neurons via radio communication. The functional graph is preserved, but the "neurons" are people. | **Conscious.** The substrate (people vs. cells) is irrelevant. The causal organization is preserved. There is a "system mind" distinct from the citizen minds. | **Unconscious.** The causal coupling is too weak/semantic. The system lacks the embodied, integrated biological unity required for a single locus of experience. |
  | **4. The Disembodied Upload**<br>A perfect simulation of a brain's internal processing, but severed from all sensorimotor loops (no body, no environment). | **Conscious.** Internal computation suffices for experience. Embodiment is useful for learning, not for the existence of qualia. | **Unconscious (or Diminished).** Mind is enacted. Without the sensorimotor loop and biological regulation (homeostasis), there is no "self" to have experiences. |

  ***

  ### 6. Closing: Substantive vs. Verbal and Paths Forward

  **Verbal Disagreements:**
  We acknowledge that some friction is verbal. Specifically, if Comp defines "computation" as "any causal process with structure," and Anti-Comp defines "biology" as "the only causal process with *the right kind* of structure," we may be labeling the same physical requirement differently. However, we believe the disagreement runs deeper than terminology.

  **Substantive Disagreements:**
  The core substantive disagreement is **Modal**: 
  *   **Comp** believes there exists *some possible world* where a non-biological system is conscious.
  *   **Anti-Comp** believes consciousness is **necessarily** tied to specific biological/physical natural kinds in *all possible worlds* (or at least all physically realistic ones).

  **What Would Move the Debate:**
  We agree that further armchair philosophy is unlikely to resolve this. We commit to monitoring the following developments:

  1.  **Successful Emulation:** If a non-biological system passes rigorous tests for consciousness (not just intelligence) that rely on *structural* markers (e.g., Integrated Information measures, reportability under novel perturbations), **Comp** views this as confirmation. **Anti-Comp** reserves the right to argue the tests were behavioral, not ontological, but acknowledges this would weaken their empirical standing.
  2.  **Discovery of Neural Specificity:** If neuroscience discovers that specific quantum or sub-cellular biological phenomena are *causally necessary* for consciousness and are provably unreplicable in silicon, **Anti-Comp** views this as confirmation. **Comp** acknowledges this would force a retreat to "biological computation" only, abandoning strong substrate independence.
  3.  **Resolution of the Implementation Constraint:** If a rigorous mathematical theory of physical computation is developed that successfully rules out triviality (rocks) without invoking biological essentialism, **Comp** views this as a victory. If such a theory proves impossible without referencing specific physical laws, **Anti-Comp** views this as vindication.

  **Signed,**

  _________________________ 
  *(The Computationalist)*

  _________________________ 
  *(The Anti-Computationalist)*
