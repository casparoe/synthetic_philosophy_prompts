answer: |-
  It is a genuine pleasure to correspond with someone who remembers the 1979 volleys not from a textbook but from the faculty lounge. Your hunch is sharp, and I will honor your request for candor: I will not offer you a synthesis that pretends the tension has been resolved, nor will I dress up a partisan view as consensus.

  Here is the diagnosis of the stalemate, broken down by the structural, empirical, and sociological layers of the dispute.

  ### 1. The Core Diagnosis: It Is a Dispute About the Null Hypothesis
  You suspected this is about burden of proof and default assumptions. You are correct. This is not primarily a factual dispute that more data will settle; it is a methodological disagreement about the **Null Hypothesis** in historical sciences.

  *   **The Evolutionary Psychology (EP) Default:** The working assumption is that complex functional design in the nervous system is the product of natural selection. Therefore, when a behavioral regularity is observed, the null hypothesis is that it is an adaptation. The burden of proof lies on the critic to demonstrate it is a byproduct (spandrel), a drift event, or a mismatch. This mirrors the "Adaptationist Programme" criticized by Gould and Lewontin, but EP proponents argue it is the *only* known causal process that generates functional complexity.
  *   **The Critics' Default:** The working assumption is that traits arise from a pluralistic mix of selection, constraint, drift, and exaptation. Therefore, the null hypothesis is that a trait is *not* a specific adaptation until rigorous evidence rules out alternatives. The burden of proof lies on the proponent to demonstrate specific selection history.

  **Why this creates a stalemate:** In lizard morphology, you can often test function via biomechanics or performance assays. In human behavior, you cannot. Because the "function" is psychological and the "environment" is historical (Pleistocene), neither side can force the other to abandon their null hypothesis. The EP researcher says, "I have a model that fits the data." The critic says, "I have a different model (cultural learning, general intelligence) that also fits the data." Without a way to falsify the historical narrative, the choice of null hypothesis dictates the conclusion.

  ### 2. The Empirical Gap: Why More Data Won't Fix This
  You asked if better paleoanthropology, genomics, or cross-cultural work could settle this. The honest answer is **no**, because the disagreement is about *inference to the best explanation* given permanently underdetermined data.

  *   **The Time Machine Problem:** The central object of EP explanation is the *Environment of Evolutionary Adaptedness* (EEA). This is not a specific time and place; it is a statistical composite of selection pressures over deep time. We cannot dig up "cheater detection modules" or "mate preference strategies" in the fossil record. We can only infer them from modern behavior. This creates a circularity risk: we infer the environment from the trait, and the trait from the environment.
  *   **Genomics:** Knowing a trait is heritable (which many are) does not tell you *why* it was selected. Genomics can identify signatures of selection (e.g., selective sweeps), but linking a genetic signature to a specific *behavioral* function in the Pleistocene remains an interpretive leap.
  *   **Cross-Cultural Work:** Finding a universal suggests (but does not prove) adaptation. Finding variability suggests (but does not prove) cultural plasticity. Both sides interpret the same ethnographic data through their prior methodological commitments.

  ### 3. Settled vs. Contested (As Requested)
  You asked for a clean line between consensus and contention. Here is the current state of play among serious practitioners (excluding popularizers):

  **What is Settled (Consensus):**
  *   **The Brain is Evolved:** No serious critic argues the human brain is a *tabula rasa* exempt from evolutionary processes. Humans are biological organisms.
  *   **Not Everything is an Adaptation:** Even hardline adaptationists acknowledge that some traits are byproducts (e.g., the color of blood is not an adaptation; it's a chemical constraint). The "Spandrels" critique is accepted in principle, if not always in practice.
  *   **Selection is Not the Only Force:** There is agreement that drift, constraint, and phylogenetic inertia play roles in evolution.

  **What is Genuinely Contested:**
  *   **The Grain of Modularity:** EP posits a "massively modular" mind (hundreds of specific algorithms for specific problems). Critics argue for domain-general mechanisms (learning, reasoning) that produce behavioral regularities without specific modules. This is an empirical question, but currently unresolvable.
  *   **The Coherence of the EEA:** Critics argue the EEA is a "just-so" placeholder that allows researchers to posit any selection pressure they like. Defenders argue it is a necessary theoretical abstraction, similar to "ideal gas" in physics.
  *   **The Magnitude of Mismatch:** EP often relies on "mismatch theory" (we have Stone Age minds in a modern world) to explain maladaptive modern behavior. Critics argue this is an unfalsifiable escape hatch: if the behavior fits the theory, it's an adaptation; if it doesn't, it's a mismatch.

  ### 4. The Sociological Layer: Science vs. Policy
  You asked if one side is policing popularizations. Yes, but it is deeper than that.

  *   **The Stakes:** In lizard biology, if you propose an adaptive story for a dewlap that is wrong, the consequence is a corrected paper. In human evolutionary psychology, if you propose an adaptive story for gender differences in mating that is wrong, the consequence can be the reinforcement of harmful social norms.
  *   **The "Is-Ought" Leakage:** Critics are often fighting a battle on two fronts: the scientific validity of the claims *and* the potential political misuse of those claims. EP defenders argue this is the "Naturalistic Fallacy" (you can't derive an ought from an is) and that science must be insulated from political consequences.
  *   **Result:** The critics often demand a higher standard of proof for human behavior than for lizard behavior, not because they are bad scientists, but because they view the cost of a Type I error (false positive adaptation) as socially dangerous. The defenders view this as special pleading that hinders science. This is not a scientific disagreement; it is a disagreement about the *ethics of scientific risk*.

  ### 5. Will This Ever Be Resolved?
  You asked for honesty about whether to expect this fight in 2070.

  **It will not be resolved in your lifetime, and likely not in 2070, in the sense of one side "winning."**

  Here is why:
  1.  **Structural Underdetermination:** As long as the subject matter is the reconstruction of unobservable historical selection pressures on unobservable psychological mechanisms, the data will remain compatible with multiple competing narratives.
  2.  **Paradigm Shift, Not Victory:** The dispute will likely not end with a verdict, but with a **dissolution** into new frameworks. We are already seeing this with:
      *   **Niche Construction Theory:** Which blurs the line between organism and environment, making the "EEA" concept less static.
      *   **Dual Inheritance Theory:** Which models gene-culture co-evolution mathematically, bypassing the "biology vs. culture" war.
      *   **Evo-Devo:** Which focuses on the constraints and developmental pathways that generate variation, shifting focus away from pure selectionism.

  **The Prediction:**
  The specific label "Evolutionary Psychology" (in the Tooby/Cosmides sense) may fade or broaden, and the specific label "Spandrels" may become less cited, but the **tension** is permanent. It is the tension between *functionalism* (assuming design) and *structuralism* (assuming constraint). This is the central dialectic of biology itself.

  In lizard morphology, you likely saw this: the assumption that a shape *must* have a function vs. the realization that developmental constraints limit the morphospace. You sorted it out there because you could manipulate the organisms and measure performance. In human behavior, you cannot manipulate the Pleistocene.

  **Verdict on your hunch:** You are right. The empirical content is thinner than admitted. The fight is about where the burden of proof lies, fueled by the high social stakes of human self-understanding. Do not expect a knockout. Expect the fighters to change gloves and keep punching.
