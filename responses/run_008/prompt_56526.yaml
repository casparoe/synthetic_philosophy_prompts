  ### The Principle of Historical Teleology

  Your verdicts are remarkably consistent, but they cannot be reconciled by physicalism (the idea that meaning is in the atoms) or by simple intentionalism (the idea that meaning requires a human mind). Instead, your intuitions are governed by what I will call the **Principle of Historical Teleology**.

  **The Principle:**
  *A physical structure carries a message (has semantic content) if and only if its specific configuration was causally selected from a set of alternatives **for the purpose** of triggering a specific interpretation or function in a decoder.*

  This principle relies on three clauses that map directly to your cases:
  1.  **Causal Selection (History):** The arrangement must not be accidental; it must be the result of a process that filtered *this* arrangement against others. (Distinguishes Bach from Lathe, DNA from Stars).
  2.  **Teleological Purpose (Function):** The selection criterion must involve the capacity to be interpreted or to effect a specific outcome. (Distinguishes DNA from Crystals, Bach from Noise).
  3.  **Level Specificity:** The selection must apply to the *level* of the pattern claimed to be the message. (Distinguishes Linear A from Moby Dick skip-patterns).

  **Why this captures your verdicts:**
  *   **Verdicts 1 & 2 (Bach vs. Lathe):** Physicalism fails here, but History succeeds. The Bach record was selected by a composer/engineer to convey sound; the lathe record was not. The meaning is in the *history of the grooves*, not the grooves themselves.
  *   **Verdicts 3 & 4 (Linear A & OTP):** Current decodability is irrelevant. The *past act of selection* for communication fixes the meaning ontologically, even if the decoder is lost or absent.
  *   **Verdict 5 (Moby Dick):** Melville selected letters for *narrative*, not for *skip-patterns*. The skip-patterns are epiphenomenal byproducts, not the target of the selection pressure. Thus, they are not messages.
  *   **Verdict 6 (Constellations):** Causal astrophysics, no selection for shape.
  *   **Verdict 7 (DNA):** Satisfies "Purpose" without a "Mind." Evolution selected the sequence for the function of replication. The ribosome is the decoder; the function is the meaning.
  *   **Verdict 8 (Monkey):** No selection process filtered for *this* paragraph. It is a statistical accident, indistinguishable in origin from the lathe record.

