answer: |-
  **MEMORANDUM**

  **TO:** Monuments Review Commission
  **FROM:** Commissioner [Your Name]
  **DATE:** October 24, 2023
  **RE:** Recommendation Regarding the Dr. Warren Hollis Statue (Item 4-B)

  **Introduction**

  We are tasked with deciding the future of the Dr. Warren Hollis statue in Hollis Park. This is not merely a question of aesthetics or zoning; it is a question of what kind of history our public spaces should cultivate. As we have discussed in recent sessions, borrowing the framework from Nietzsche's *On the Use and Abuse of History for Life* has been invaluable. It forces us to ask not just "What happened?" but "What work is this history doing for the living?"

  History, in this view, serves three functions: the **Monumental** (inspiring action through great examples), the **Antiquarian** (preserving the past for its own sake), and the **Critical** (judging the past to liberate the present). My recommendation below is structured by these three modes, aiming to balance our duty to the truth, our duty to the art, and our duty to the community that currently inhabits this space.

  **Analysis of the Current Configuration**

  **1. The Failure of Monumental History**
  When erected in 1931, the Hollis statue served a Monumental function. It presented Hollis as a civic hero to inspire public trust in sanitation and health infrastructure. It said: *Science and authority save us.*
  However, the 1908 health board minutes fundamentally break this narrative. We now know that Hollis's "protection" of the city involved the calculated sacrifice of eleven immigrant residents in the riverfront district. A monument that glorifies a man who enforced a deadly, class-based quarantine no longer inspires civic pride; for the descendants of those riverfront families who still live adjacent to the park, it functions as a marker of trauma. When Monumental history actively harms the *life* of the current community, it has lost its legitimacy in that space.

  **2. The Limits of Antiquarian Preservation**
  The argument to "leave it alone" relies on an Antiquarian view: the statue is a 1931 bronze by a significant sculptor, and it has stood for ninety years. There is value in preserving the object itself. We should not destroy art simply because the subject is complicated. However, Nietzsche warns that Antiquarianism becomes stifling when it treats the past as a museum exhibit that must not be touched, even when it obstructs the present. Preserving the statue *in situ* as an honorific centerpiece prioritizes the object over the people living around it.

  **3. The Necessity of Critical History**
  This brings us to Critical History. This is not about judging the dead to feel superior to them; it is about breaking the chain of unquestioned reverence so the living can move forward. We must acknowledge that Hollis was both a savior (typhoid/water system) and a perpetrator (1908 quarantine). To hide this complexity is dishonest. To celebrate it without context is harmful. Critical history demands we make a judgment: Hollis's contributions to public health do not absolve the specific harm inflicted on the riverfront district.

  **Recommendation**

  I recommend that the Commission vote to **relocate the statue to the County History Museum** and initiate a **community-led process to rename and redesign Hollis Park.**

  **Concrete Conditions & Timeline:**

  1.  **Relocation:** The statue shall be moved to the County History Museum within 12 months. The Museum must commit to displaying it with full contextual interpretation, including the 1908 minutes, the typhoid achievements, and the sculptor's history. This satisfies the Antiquarian need to preserve the artifact without maintaining its Monumental honor in the neighborhood.
  2.  **Park Renaming:** The name "Hollis Park" shall be retired. A community advisory board, comprised primarily of residents from the riverfront district and descendants of the 1908 victims, shall be formed within 60 days to recommend a new name.
  3.  **Interim Interpretation:** Until removal, a temporary plaque shall be installed at the base within 30 days acknowledging the 1908 quarantine deaths.
  4.  **Funding:** Relocation costs shall be covered by the Commission's capital budget; no public funds shall be used for the new park design beyond standard maintenance.

  **Addressing the Opposition**

  I want to address the Commissioners who favor retaining the statue in its current location. Your argument rests on a vital principle: that we risk sanitizing history if we remove every figure who fails modern ethical standards. You argue that keeping the statue forces us to grapple with the complexity of the past, and that removal sets a precedent of erasure.

  This is a strong, necessary caution. We must not pretend the past was morally pure. However, my disagreement lies in the *location*. A museum is the appropriate place for complex, contested history where context can be fully provided. A neighborhood park, which serves as a daily living space for the descendants of the victims, is not a classroom; it is a home. Retaining the statue there privileges the "lesson" over the "living." We are not erasing Hollis by moving him; we are reclassifying him from a civic idol to a historical subject. That is not erasure; it is accuracy.

  **Conclusion**

  Nietzsche wrote that history is to be used "for the purpose of life." For the residents of the riverfront district, the current configuration of Hollis Park uses history *against* life. By relocating the statue, we preserve the art (Antiquarian), we acknowledge the full truth of the man (Critical), and we return the park to the community it is meant to serve (Life).

  I look forward to discussing this draft with you all at next week's working session.

  Respectfully,

  [Your Name]
  Commissioner, Monuments Review Commission
