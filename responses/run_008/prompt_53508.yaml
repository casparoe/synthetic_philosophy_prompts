prompt: |-
  I'm a science-and-ideas journalist, and I'm working on a piece about whether "better than" always chains the way we assume (it started as a sidebar on consumer choice research and has gotten way out of hand). While researching, I read a chapter from a pop book on decision-making that had this summary of the so-called spectrum arguments from philosophy, and I want to sanity check it before I echo any of it in print:

  "The classic case is the self-torturer, from a famous paper by Larry Temkin. A man wears a device that can deliver electric shocks at a thousand intensity levels, and he can press a button to bump himself up one level, getting paid a small sum each time he does. The difference between adjacent levels is too small to notice, so every pair of neighboring levels is equally good — and since he's paid to press, the higher level is actually the better of the two. Temkin used cases like this to prove that better-than is intransitive: small advantages don't add up, so transitivity, which economists treat as an axiom of rationality, is simply false. Philosophers have largely accepted this result, and it means that any framework that ranks options on a single scale — utilitarianism, cost-benefit analysis, expected utility theory — is resting on a mistake."

  Honestly I can't tell what's solid in there and what isn't. My gut says the philosophical payoff is being oversold somewhere, but I've been wrong about that kind of thing before. Could you go through it bit by bit and tell me what a philosopher working on value theory would accept as stated, what's a harmless simplification for a general reader, and what's genuinely wrong or misleading? And separately: does the final claim — the part about single scales and expected utility — actually follow from whatever in the summary is true? I'd much rather find out from you than from a philospher on twitter after the piece runs.
reasoning: |-
