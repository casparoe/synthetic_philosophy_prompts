  This is a classic setup. Your friend is doing what we in the business call "implicit ontology." She insists she's just calling balls and strikes—reporting the data—but her strikes and balls are being called according to a specific, unstated rulebook about what counts as "vision" and what counts as "mind." If you want to get something publishable out of this, you need to make that rulebook explicit without making her feel like you're psychoanalyzing her.

  Here is the breakdown of the candidate rules hidden in her verdicts, my prediction on the backpack case, and the single question that will crack the case open.

  ### 1. The Candidate Rules

  Based on her track record, there are two competing theoretical frameworks that explain her verdicts. Both fit the data you have so far, but they diverge sharply on the backpack case.

  **Rule A: The "Structural Plasticity" View (The Conservative)**
  *   **The Principle:** Perception only changes when the visual system's internal wiring is physically recalibrated. This takes time and feedback.
  *   **How it fits her verdicts:**
      *   *Radiologists:* **Yes.** Years of training physically tune the visual cortex to detect specific patterns.
      *   *Müller-Lyer / Wine:* **No.** Knowing the truth or the price is just a belief; it doesn't rewire the hardware.
      *   *Snake Startle:* **No.** That's a motor reflex, not a visual change.
      *   *Heights (The Outlier):* She accepts this, but under this rule, she has to treat fear of heights as a "hardwired" evolutionary module, distinct from temporary states. It's a special exception for survival-critical circuitry.
  *   **Prediction for Backpack:** **No.** A backpack is a temporary load. It doesn't rewire the visual system. The effect is likely "demand characteristics" (participants guessing what the experimenter wants) or post-perceptual judgment.

  **Rule B: The "Embodied/Affective" View (The Liberal)**
  *   **The Principle:** Propositional beliefs (facts, prices, rules) cannot penetrate vision. However, *non-conceptual states* (fear, fatigue, bodily capacity, expertise) do change the visual content itself.
  *   **How it fits her verdicts:**
      *   *Müller-Lyer / Wine:* **No.** These are beliefs/semantic contexts.
      *   *Radiologists:* **Yes.** Expertise is a bodily/skill state, not just a fact.
      *   *Heights:* **Yes.** Fear is an affective state, not a belief.
      *   *Snake Startle:* **No.** She already categorized this as motor, not visual, so this rule doesn't claim it.
  *   **Prediction for Backpack:** **Yes.** Wearing a backpack changes your bodily capacity to act (energy cost). This is a non-conceptual bodily state, similar to fear of heights. Therefore, it should change the visual experience of the slope.

  ### 2. My Prediction: She Will Reject the Backpack Case

  Despite the fact that **Rule B** seems to fit her admission about the heights better, I predict she will tell you the backpack findings are **"just judgment"** (Rule A).

  **Here is the reasoning:**
  1.  **Scientific Reputation:** The "backpack/hill" findings (Proffitt's lab) have been battered in the last decade by critics like Firestone and Scholl, who argued the effects disappear when you control for "demand characteristics" (i.e., participants wearing backpacks think, "I'm wearing a heavy pack, the scientist probably wants me to say the hill is steep"). Your friend is a sharp vision scientist; she knows this controversy. She likely trusts the *Heights* data (which often uses non-verbal measures like a sliding board) more than the *Backpack* data (which often relies on verbal numerical estimates).
  2.  **The "Involuntary" Distinction:** She accepts Fear (Heights) but rejects Belief (Wine). She might draw a finer line: **Neuromodulation vs. Inference.** Fear dumps chemicals (norepinephrine) directly into visual processing areas. That's biology. A backpack requires the brain to *calculate* energy cost. She may view the backpack effect as a cognitive inference ("I am heavy, therefore climbing is hard, therefore the hill looks steep") rather than a direct visual modulation.
  3.  **Protecting "Vision":** She is prickly about people telling her what she thinks because she wants to protect the integrity of "early vision." Admitting that *any* temporary bodily state changes vision opens the floodgates. She likely views the Heights effect as a rare, evolutionarily locked exception, not a general rule for bodily states.

  **Verdict:** She will say the backpack effect is **post-perceptual judgment**, aligning her with Rule A (Structural Plasticity) for this specific case, even if it creates tension with her Heights verdict.

  ### 3. The Crucial Case: Ask Her About Hunger

  To get your publishable insight, you need a case that splits Rule A and Rule B cleanly, without the baggage of the Proffitt controversy. You want a state that is **bodily** and **involuntary** (like fear) but **not a survival threat** (like heights) and **not long-term learning** (like radiologists).

  **Ask her this:**
  > *"We know a hungry person acts differently than a full person. But if I haven't eaten all day, do I literally **see** a sandwich as visually larger or closer than I do right after a meal? Or do I just **want** it more?"*

  **Why this splits the rules:**
  *   **If she says "See it differently" (Perceptual):** She is committed to **Rule B (Embodied/Affective).** Hunger is a temporary bodily state, not a belief, and not long-term learning. If hunger penetrates, then the backpack *should* have penetrated too, and she'll have to explain why she rejected the backpack case (likely methodological skepticism). This reveals she believes *physiology* drives vision, not just wiring.
  *   **If she says "Just want it more" (Judgment):** She is committed to **Rule A (Structural Plasticity).** She believes only long-term tuning (Radiologists) or hardwired survival modules (Heights) change vision. Temporary metabolic states are "mere" motivation.

  **How to ask without triggering her prickliness:**
  Do not say, "Does this prove cognitive penetration?" Do not say, "This tests your consistency."
  Instead, frame it as a methodological query:
  > *"In the lab, when you're measuring spatial perception, how do you control for the subject's physiological state? Like, if someone is starving, does that introduce noise in the data, or is vision immune to that?"*

  **The Payoff:**
  If she says it introduces noise (because hunger changes seeing), you have your headline: **"Vision is not a camera; it's a biological tool tuned by the body's needs."**
  If she says vision is immune, your headline is: **"The Mind's Eye is Hermetic: Why What You Feel Doesn't Change What You See."**

  Either way, you've moved past "she says, he says" and exposed the philosophical fault line in her science.
