          3.  *The "Interpreter" Module:* The left hemisphere speaks for the whole. Is that one agent or a press secretary?
      *   *Evaluating the Conclusion:* The "Two Minds" view is controversial (Bayne's "Qua-subjects"). The analogy smuggles in dualism.
