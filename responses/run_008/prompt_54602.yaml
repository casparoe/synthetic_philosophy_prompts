prompt: |-
  I manage a four-engineer team at a mid-sized company, and I have modest discretion over our hiring funnel — I can add or drop at most one screening stage per quarter, with no budget for outside tools or consultants. We keep having the same argument: does our take-home assignment actually distinguish strong engineers from weak ones, or does it just filter for candidates with spare evenings? Please turn the economics and evolutionary biology of costly signaling — the core idea that a trait functions as a signal only if it is differentially costly, cheaper for genuinely high-quality candidates to produce than for low-quality candidates to fake, together with the way signals decay into wasteful arms races once everyone learns to produce them — into a decision procedure I can run on any proposed screening requirement before adopting it: the questions to ask in order, what counts as a sufficient answer to each, where the procedure terminates in a no, and where it hands the decision back to me because the question is one of values rather than facts, such as how many good candidates we're prepared to lose to a signal that genuinely works. The procedure should be runnable in under an hour per stage by me and a recruiter, it should distinguish requirements whose cost the candidate pays from assessments whose cost we pay, and it should be honest about the fact that we can never empirically validate our screens, since we only ever observe the candidates we let through. Then run it on three of our current ideas: an eight-hour take-home, preferring candidates with public open-source contributions, and a live whiteboard-coding round I'm personally attached to — and don't spare the last one if the procedure kills it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Engineering Manager (4-engineer team, mid-sized company).
      *   **Constraint:** Modest discretion (add/drop max 1 screening stage per quarter), no budget for tools/consultants.
      *   **Problem:** Debate over whether the take-home assignment distinguishes talent or just filters for free time.
      *   **Core Concept:** Economics/Evolutionary Biology of *Costly Signaling* (Zahavi's Handicap Principle, Spence's Job Market Signaling). Key tenets:
          *   Signal must be differentially costly (cheaper for high-quality to produce than low-quality).
          *   Signals decay into wasteful arms races if everyone learns to produce them (pooling equilibrium).
          *   Selection bias (we only observe those who pass).
      *   **Deliverable:** A decision procedure (checklist/questions) to evaluate screening requirements.
          *   Must be runnable in < 1 hour by Manager + Recruiter.
          *   Must distinguish candidate-paid costs vs. employer-paid costs.
          *   Must acknowledge empirical validation impossibility (counterfactual problem).
          *   Must identify where value judgments override facts (e.g., false negative tolerance).
          *   Must terminate in a "No" if criteria aren't met.
      *   **Application:** Run the procedure on three specific ideas:
          1.  8-hour take-home assignment.
          2.  Preference for public open-source contributions.
          3.  Live whiteboard-coding round (Manager is attached to this one, but be honest/critical).

  2.  **Theoretical Foundation (Costly Signaling in Hiring):**

      *   *Spence (1973):* Education signals ability if it costs less for high-ability workers to get the degree than low-ability workers.
      *   *Zahavi (1975):* Peacock tails signal fitness because they are handicaps. Only fit peacocks can afford the tail.
      *   *Application to Hiring:* A screening task is a good signal if:
          1.  High-quality candidates find it easier/less costly (time, cognitive load, opportunity cost) than low-quality candidates.
          2.  Low-quality candidates cannot easily fake it (or the cost to fake is prohibitive).
          3.  The cost isn't *so* high that it drives away high-quality candidates (who have better outside options).
      *   *The "Arms Race" Risk:* If everyone starts doing the signal (e.g., everyone has a GitHub), it ceases to distinguish (pooling equilibrium) and becomes pure waste.
      *   *The "Counterfactual" Problem:* We hire people who pass. We don't know if the people who failed would have been good. We can't calculate true positive/negative rates without experimental randomization (which is unethical/impossible in hiring).

  3.  **Drafting the Decision Procedure (The "Signal Viability Protocol"):**

      *   *Goal:* < 1 hour, Manager + Recruiter.
      *   *Structure:* Sequential gates. If you fail a gate, stop.
      *   *Gate 1: Cost Bearer.* Who pays? If the company pays significantly, it's an assessment, not a signal. Signals rely on candidate cost.
      *   *Gate 2: Differential Cost.* Is it actually harder for a weak candidate to do this than a strong one? Or is it just time-consuming for everyone?
      *   *Gate 3: Falsifiability/Cheating.* Can a weak candidate fake this easily?
      *   *Gate 4: Opportunity Cost/Attrition.* Will good candidates walk away because the cost is too high relative to their market value?
      *   *Gate 5: The Value Judgment.* Since we can't validate empirically, are we okay with the inferred false negative rate?

      *Refining the Questions:* Make them punchy and actionable. Ensure the "Value vs. Fact" distinction is clear.

  4.  **Running the Procedure on the Three Ideas:**

      *   **Idea 1: 8-Hour Take-Home.**
          *   *Cost:* High candidate time.
          *   *Differential Cost:* Maybe. Strong engineers might do it faster, but 8 hours is 8 hours.
          *   *Falsifiability:* High. Can use AI, friends, etc.
          *   *Attrition:* High. Strong candidates have options. They won't spend a weekend.
          *   *Verdict:* Likely fails on Differential Cost and Attrition. It's a "time sink" signal, not a "skill" signal.

      *   **Idea 2: Public Open-Source Contributions.**
          *   *Cost:* Past unpaid labor.
          *   *Differential Cost:* High skill required to get merged? Yes. But also requires *spare time* and *social capital*.
          *   *Falsifiability:* Hard to fake meaningful contributions.
          *   *Arms Race:* Already happening. Many great devs don't have public repos (NDAs, private work).
          *   *Bias:* Filters for privilege (free time) and specific personality types.
          *   *Verdict:* Fails on Differential Cost (cost is time/privilege, not just skill) and Pooling Equilibrium (many good devs don't signal this).

      *   **Idea 3: Live Whiteboard.**
          *   *Cost:* Time + Stress.
          *   *Differential Cost:* Does it measure coding skill or whiteboard skill? Often correlates poorly.
          *   *Falsifiability:* LeetCode grinding makes this a memorization test.
          *   *Arms Race:* Definitely an arms race. Candidates train specifically for this.
          *   *Verdict:* Fails on Differential Cost (measures prep, not innate ability) and Validity (does it predict job performance?). *Note: The prompt asks me not to spare this one.*

  5.  **Refining the Output Tone:**

      *   Professional, analytical, slightly skeptical (matching the "economist/biologist" lens).
      *   Acknowledge the manager's attachment to the whiteboard round but remain objective based on the framework.
      *   Ensure the "Value Judgment" step is highlighted—where the manager must decide on risk tolerance.

  6.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Did I emphasize the "we can't validate" part enough?
      *   *Fix:* Make sure Step 5 of the procedure explicitly states that data won't save them. It's a belief choice.
      *   *Critique:* Is the distinction between "Assessment" (company pays) and "Signal" (candidate pays) clear?
      *   *Fix:* Put this as Step 1. If the company pays (e.g., paid trial project), it's not a costly signal in the biological sense, it's a work sample. The prompt asks to distinguish them.
      *   *Critique:* Is it runnable in an hour?
      *   *Fix:* Keep the questions binary or scale-based. No deep data analysis required.

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   < 1 hour? Yes.
      *   Manager + Recruiter? Yes.
      *   Distinguish cost bearer? Yes.
      *   Acknowledge empirical limits? Yes.
      *   Value vs. Fact? Yes.
      *   Run on 3 ideas? Yes.
      *   Don't spare the whiteboard? Yes.

  8.  *(Final thought on the Whiteboard)*: I need to be careful not to just say "whiteboards are bad." I need to use the *signaling framework* to explain why it might fail as a signal (e.g., it signals "prep time" not "engineering ability," and high-quality candidates might find the opportunity cost of prepping too high).

  9.  *(Final thought on the Take-Home)*: The prompt specifically mentions the argument about "spare evenings." This is the core "differential cost" issue. I need to highlight that if the cost is *time* rather than *skill*, you filter for unemployment or lack of family, not engineering skill.

  10. *(Final thought on Open Source)*: This is a classic "past signal." The risk is the "arms race" where people game GitHub stats, or the "exclusion" of those who work in proprietary environments.

  Let's assemble the response.cw
answer: |-
  # The Signal Viability Protocol (SVP)

  **Purpose:** To evaluate whether a proposed hiring screen functions as a valid *costly signal* of engineering ability, or merely as a tax on candidate time that degrades the applicant pool.
  **Participants:** Hiring Manager + Recruiter.
  **Timebox:** 45–60 minutes.
  **Constraint:** Acknowledge upfront that **you cannot validate this empirically.** You will never see the performance of candidates you reject. This procedure relies on logical inference, not historical data.

  ---

  ## Phase 1: The Cost Bearer Test
  *Goal: Distinguish between a Work Sample (company pays) and a Signal (candidate pays).*

  **Q1: Who incurs the primary opportunity cost (time, cognitive load, reputation) of this stage?**
  *   **A:** The Company (e.g., paid trial week, on-site paid day).
  *   **B:** The Candidate (e.g., unpaid take-home, resume review, unpaid live round).

  *   **If A:** Stop. This is a **Work Sample**, not a Costly Signal. Evaluate it on ROI and budget, not signaling theory.
  *   **If B:** Proceed to Q2.

  ## Phase 2: The Differential Cost Test
  *Goal: Ensure the cost is lower for high-quality candidates than low-quality ones (The Handicap Principle).*

  **Q2: Is the task significantly easier/faster/less stressful for a genuinely high-performing engineer than for a low-performing one?**
  *   *Probe:* If a weak candidate puts in 10 hours, can they produce output indistinguishable from a strong candidate who put in 2 hours?
  *   *Probe:* Is the cost primarily *skill-based* (hard to fake) or *time-based* (easy to fake with endurance)?
  *   **Sufficient Answer:** Yes, the strong candidate has a distinct efficiency advantage that cannot be bridged simply by a weak candidate working longer.
  *   **Termination Condition:** If the answer is "No" or "It depends on how much free time they have," **REJECT.** You are filtering for privilege/unemployment, not skill.

  ## Phase 3: The Falsifiability Test
  *Goal: Ensure the signal cannot be gamed (The Arms Race Check).*

  **Q3: Can a low-quality candidate produce this signal without possessing the underlying trait?**
  *   *Probe:* Can they use AI, hire a friend, or memorize patterns?
  *   *Probe:* Has this signal become industry standard such that mediocre candidates are trained specifically to pass it (e.g., LeetCode grinding)?
  *   **Sufficient Answer:** No. The cost to fake the signal is higher than the cost of actually having the skill.
  *   **Termination Condition:** If the market has already turned this into a "prep game" where candidates train for the test rather than the job, **REJECT.** The signal has decayed into noise.

  ## Phase 4: The Attrition Risk Test
  *Goal: Ensure you aren't signaling *your* company negatively.*

  **Q4: Will high-quality candidates with strong outside options opt out because the cost is too high relative to the probability of an offer?**
  *   *Probe:* Does this require a weekend? Does it require public exposure of private work?
  *   *Probe:* Is the cost proportional to the stage? (e.g., High cost at initial screen is fatal).
  *   **Sufficient Answer:** We believe our employer brand or salary premium is high enough to justify this cost to top talent.
  *   **Termination Condition:** If you are a mid-sized company asking for high-cost signals early in the funnel, **REJECT.** Top talent will self-select out.

  ## Phase 5: The Value Judgment (The "Leap")
  *Goal: Acknowledge the empirical blind spot.*

  **Q5: Since we cannot measure the false-negative rate (the good people we reject), are we willing to accept the risk that this screen excludes capable engineers who simply cannot pay the cost?**
  *   *Context:* This is not a fact question. It is a risk tolerance question.
  *   **Sufficient Answer:** A conscious acknowledgment of the trade-off. "We accept losing X% of good candidates to reduce interview load."
  *   **Termination Condition:** If the team expects this screen to be "fair" or "definitive," **REJECT.** No screen is definitive.

  ---

  # Application of SVP to Current Proposals

  Here is the protocol run on your three specific ideas.

  ## 1. The Eight-Hour Take-Home Assignment
  **Phase 1 (Cost Bearer):** Candidate (Unpaid). **Pass.**
  **Phase 2 (Differential Cost):** **FAIL.**
  *   *Analysis:* An 8-hour task is 8 hours for everyone. A strong engineer might do it in 4, but a weak engineer can bridge the gap by working the full 8 (or 12). The cost is primarily *time*, not *skill*. As your team argued, this filters for candidates with spare evenings (low opportunity cost of time) rather than pure engineering ability.
  *   *Verdict:* **DROP.** It violates the Handicap Principle. It is a tax on free time, not a signal of quality.

  ## 2. Preference for Public Open-Source Contributions
  **Phase 1 (Cost Bearer):** Candidate (Past unpaid labor). **Pass.**
  **Phase 2 (Differential Cost):** **FAIL.**
  *   *Analysis:* Contributing to open source requires skill, yes, but it heavily requires *privilege* (employer permission, free time, energy after work). Many exceptional engineers work in proprietary environments (NDAs) or have caregiving responsibilities. The cost is not differentially lower for high-quality candidates; it is differentially lower for *unconstrained* candidates.
  *   *Phase 3 (Falsifiability):* **WARNING.**
      *   *Analysis:* While hard to fake technically, this signal is entering a pooling equilibrium. Many candidates know this is valued and will manufacture low-quality PRs to check the box.
  *   *Verdict:* **DROP as a hard screen.** It is a useful *tie-breaker* or conversation starter, but as a funnel gate, it introduces massive demographic and socioeconomic bias without guaranteeing engineering efficacy.

  ## 3. Live Whiteboard-Coding Round
  *(Note: You mentioned personal attachment. The protocol is strict.)*

  **Phase 1 (Cost Bearer):** Candidate (Time + Stress). **Pass.**
  **Phase 2 (Differential Cost):** **FAIL.**
  *   *Analysis:* Does solving algorithmic puzzles on a whiteboard correlate with day-to-day engineering (debugging, architecture, collaboration)? Research and industry data suggest a weak correlation. A candidate can memorize 200 LeetCode patterns (low skill cost, high prep time) and pass without being a good engineer. A great engineer who hasn't prepped may fail. The cost is *preparation*, not *ability*.
  *   *Phase 3 (Falsifiability):* **FAIL.**
      *   *Analysis:* This is the definition of a decayed signal. The market has adapted. Candidates now train specifically for this signal, decoupling it from the underlying trait (general engineering competence).
  *   *Phase 4 (Attrition Risk):* **FAIL.**
      *   *Analysis:* Senior engineers increasingly refuse whiteboard rounds. As a mid-sized company, you are at a disadvantage compared to FAANG if you demand this without the prestige to back it up.
  *   *Phase 5 (Value Judgment):** **N/A (Already Failed).**
  *   *Verdict:* **DROP.**
  *   *Manager Note:* Your attachment to this is likely due to *familiarity bias* (you know how to run it) and *illusion of validity* (you feel you can judge someone in real-time). The SVP indicates this signal no longer distinguishes quality; it distinguishes *prep*.

  ## Summary Recommendation

  All three proposals fail the **Differential Cost** or **Falsifiability** tests. They risk filtering for candidates with the most free time or the most test-prep discipline, rather than the best engineering judgment.

  **Alternative Suggestion (To pass SVP):**
  Consider a **Paid, Time-Boxed Work Sample** (Phase 1 = Company Pays).
  *   *Why:* If you pay for the time, you remove the "spare evening" filter.
  *   *Signal:* The signal becomes "Can they do the actual job?" rather than "Will they work for free?"
  *   *Cost:* You pay for 2–4 hours of candidate time.
  *   *Viability:* This shifts from a *Costly Signal* to a *Work Sample*. It costs you budget, but it drastically increases the quality of the signal because the candidate's opportunity cost is removed, allowing you to judge pure output.

  If you cannot secure budget for paid samples, you must reduce the friction of the current screens to pass Phase 4 (Attrition). Reduce the take-home to 90 minutes. Remove the whiteboard. Use the open-source check only as a "nice to have" during the interview, not a gate.
