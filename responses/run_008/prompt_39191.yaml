  The break room hummed with the quiet fatigue of deliberations. R stirred sugar into a styrofoam cup, staring at the swirl. A leaned against the counter, arms crossed.

  "That seven-year-old," R said finally. "We credited her instantly. No track record, no way to verify her perceptions. By any reasonable standard, that's epistemic negligence."

  A shook their head. "It's not negligence; it's default entitlement. We aren't required to audit a speaker's history before listening. Testimony is a basic source of justification, like perception. Unless there's a specific reason to doubt—the child seemed coached, perhaps—we are rational to believe her."

  "That's the Reid position, isn't it? Trust unless defeated," R said. "But it licenses gullibility. If I accept claims without positive reasons, I'm not reasoning; I'm absorbing. The Humean view is stricter: I'm justified only if I have inductive evidence that this speaker, or speakers like them, are generally reliable. That child was a blank slate."

  "But where does that inductive evidence come from?" A asked. "You claim you need a track record to trust testimony. But how did you acquire the data for that track record? Mostly through other testimony. Teachers, parents, news. If you need testimony to validate testimony, your view is circular. You're using the very source you're trying to justify to justify it."

  R set the spoon down. "That's the credibility problem. But it's not fatal. I don't need global validation for all speech. I can rely on local reductionism. I don't need to know humans are generally truthful; I just need to check *this* witness. Demeanor, consistency, corroboration by physical evidence. That's independent checking."

  "Is it?" A countered. "In this trial, the instructions forbade us from consulting outside sources. We couldn't check the detective's summary against the actual interviews. We couldn't evaluate the lab procedure ourselves. Your 'local checking' is an idealization we were institutionally barred from satisfying. If reductionism requires independent verification, and the court forbids it, then reductionism says we can know nothing from the stand."

  "Coarse stereotypes suffice," R insisted. "I know detectives generally follow protocol. I know lab technicians risk perjury if they falsify. That's background knowledge I brought in. It's not perfect, but it's positive reason enough."

  "That's just deference to institutional authority," A said. "And it collapses into my view. If 'detectives generally follow protocol' is a default assumption you hold without specific proof for *this* detective, you're treating their testimony as prima facie justified. You're an anti-reductionist in practice. You only demand proof when something looks wrong."

  "Not quite," R said. "I weigh the probability. If the error rate is known, I adjust. Take the transcript. It was generated by speech-to-text software, certified by a reporter who only corrected obvious errors. Who is the testifier there? The software developers? The reporter? The court?"

  "The institution," A said. "The court certifies the record. We trust the system."

  "But the software has a non-zero word error rate," R pressed. "If I'm a reductionist, I have to ask: what is the probability this specific transcript is accurate enough for a conviction? If I don't know the error rate, I lack the inductive basis to trust it. I should weigh it less than live testimony."

  "And if I'm an anti-reductionist?" A asked.

  "Then you trust it unless there's a defeater," R said. "But that's dangerous. Machines don't swear oaths. If you treat the transcript as basic justification, you're trusting code you can't see, certified by a human who didn't hear every word. That's not trust; it's black-box faith."

  "Is it different from trusting the detective?" A asked. "You didn't see the interview. You're trusting the detective's memory and honesty. That's also a black box. The difference is you feel you understand human motivation better than algorithms. But epistemically, both are testimony. If I require positive reasons to trust the transcript, I must require them for the detective. If I can't have them for the detective because I wasn't there, I shouldn't have them for the transcript either. So either we trust both by default, or we trust neither."

  "Neither is an option," R said. "The law requires a verdict. So we must use the best available proxies. But I maintain that my view corrects cognitive laziness. We credited that child because it's easy, not because it's justified. My view forces us to acknowledge the gap. We are guessing based on coarse cues—confidence, clothing, title. That's not knowledge; it's risk assessment."

  "But your risk assessment relies on the very testimony you claim to doubt," A said. "You trust the title 'Detective' because people told you what that title means. You trust the lab because society says it's reliable. You cannot step outside the web of testimony to validate it. The anti-reductionist admits this. We are socially embedded. Trust is the starting point, not the conclusion. The child witness confirms this. We didn't check her; we recognized a human voice making a claim. That recognition carries weight."

  "It carries psychological weight, not epistemic weight," R said. "But I see your point on the circle. Perhaps local reductionism is the only viable middle ground. I don't need global proof, but I need *some* positive reason specific to the context. Here, the context is a courtroom under oath. That's my positive reason."

  "And if the oath is broken?" A asked.

  "Then the justification collapses," R said. "But until then, the institutional setting provides the inductive backing."

  "The institutional setting is just testimony about itself," A said. "But we're out of time."

  The bailiff knocked on the doorframe. "Jurors, please return."

  They stood, leaving the cups on the table.

  "One last thing," R said, pausing at the door. "When we vote on the lab evidence, I'm discounting it. I have no independent reason to trust the procedure beyond the expert's say-so. Under my view, that's weak."

  A nodded slowly. "Then I'll do the opposite. I'll weigh the child's testimony heavily. No defeaters were presented, so the default stands. The lack of track record isn't a bug; it's irrelevant."

  "See you in the room," R said.

  "See you there," A replied. They walked back in, carrying the same evidence, but seeing different weights.
