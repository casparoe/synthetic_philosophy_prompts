answer: |-
  ### 1. Exam Question

  Proponents of Moral Foundations Theory often describe political disagreement using a "moral palate" analogy: if liberals primarily detect care and fairness, while conservatives detect those plus loyalty, authority, and sanctity, conservatives appear to have a "broader" moral sensitivity. You are to evaluate the normative implications of interpreting this breadth in one of three ways: (1) as a matter of **taste** (subjective preference), (2) as a matter of **perception** (sensitivity to objective values), or (3) as a matter of **coordination** (functional tools for social organization). In a unified essay, argue which interpretation best handles the gap between descriptive psychology and normative truth. Specifically, explain whether a "broader palate" implies a morally superior position under your chosen interpretation, and demonstrate how your view avoids (or accepts) the naturalistic fallacy when moving from how people *do* judge to how they *ought* to judge.

  ***

  ### 2. Model Answer

  The "moral palate" analogy is seductive because it offers a seemingly neutral explanation for political polarization, but it conceals a metaphysical dilemma. To claim conservatives have a "broader" foundation set is a descriptive claim; to suggest this breadth matters morally is a normative one. Of the three available interpretations—taste, perception, and coordination—only the coordination model successfully navigates the is-ought gap without collapsing into relativism or unsupported moral realism. Therefore, the breadth of foundations should be understood not as superior sensitivity to truth, but as a functional adaptation for specific scales of social cooperation.

  If we treat foundations as **taste**, the analogy holds descriptively but fails normatively. If morality is like food preference, a person who detects umami has a richer experience than one who does not, but they are not *correct* about the food. This view respects the is-ought gap by refusing to cross it; facts about psychology do not generate moral truths. However, this renders moral disagreement trivial. If loyalty is merely a "flavor" some societies prefer, we cannot critique a society that lacks it, nor can we critique one that prioritizes loyalty over care to the point of oppression. This interpretation explains the *existence* of disagreement but makes the seminar's subject matter—moral *psychology*—irrelevant to moral *philosophy*. It creates a safe harbor for the naturalistic fallacy by denying the possibility of normative conclusions entirely, which is an unsatisfying retreat for a theory claiming to explain moral judgment.

  Conversely, treating foundations as **perception** attempts to secure normative force. If foundations are like photoreceptors, the person with full color vision sees the world as it is, while the colorblind person misses objective features. This implies the "broader palate" is objectively better because it tracks more moral truth. However, this horn requires a heavy metaphysical commitment: it demands that loyalty, authority, and sanctity exist as mind-independent properties waiting to be detected. There is no evidence for moral particles or platonic forms of authority. To adopt this view, one must argue that evolutionary pressure tuned these foundations to track real values, but evolutionary pressure tunes for fitness, not truth. A student endorsing this horn often commits the naturalistic fallacy explicitly, assuming that because a foundation *exists* universally, it *tracks* something good. This conflates adaptive utility with moral validity.

  The third option, **coordination**, avoids the metaphysical baggage of perception while retaining the pragmatic weight that taste lacks. On this view, foundations are not detectors of truth or mere preferences, but technologies of social cohesion. Care and fairness scale well in large, anonymous markets (liberal strongholds), while loyalty, authority, and sanctity stabilize smaller, high-trust kin groups or nations (conservative strongholds). Under this interpretation, a "broader palate" is not morally superior in the abstract; it is contextually robust. It allows a group to mobilize across different social scales.

  This approach handles the is-ought gap by shifting the "ought" from moral truth to functional viability. We *ought* to utilize multiple foundations not because they are "true," but because a society relying solely on care may fail to maintain boundaries, while one relying solely on authority may become tyrannical. The normative conclusion is hypothetical: *If* you want a society that endures across varying scales of interaction, *then* you need a diverse foundation set. This avoids the naturalistic fallacy because it does not derive value from existence alone; it derives recommendation from goal-oriented reasoning.

  Therefore, the conservative "breadth" is not a claim to superior moral truth, but a claim to functional redundancy. The liberal restriction to care and fairness is not a blindness, but a specialization for universalizing rights. Neither is objectively "right" in a perceptual sense, but the coordination model suggests that a polity capable of activating all five foundations is more resilient than one that cannot. The exam question asks if breadth implies superiority; under the coordination model, the answer is yes, but only relative to the goal of social stability, not moral truth. This preserves the descriptive insight of the framework without pretending that psychology can solve metaphysics.

  ***

  ### 3. Marking Scheme (25 Points)

  **A-Range vs. B-Range Distinction:**
  *   **A-Range (20–25 pts):** The essay commits to one interpretation (usually Coordination or a nuanced Perception) and rigorously defends it while dismantling the others. It treats the is-ought gap as a problem to be solved or navigated, not just named.
  *   **B-Range (15–19 pts):** The essay summarizes the three analogies accurately but hedges on the conclusion (e.g., "all three have merit"). It identifies the is-ought gap but uses it as a conversation-stopper rather than analyzing how the chosen interpretation interacts with it.

  **Must-Hit Moves & Traps:**

  **1. Reconstruction of the Analogies (5 points)**
  *   **Requirement:** Clearly distinguish the normative stakes of Taste (subjectivity), Perception (realism), and Coordination (functionalism).
  *   **Trap:** Treating "Taste" and "Coordination" as identical forms of relativism. (Taste denies function; Coordination asserts functional truth).

  **2. Analysis of Normative Superiority (5 points)**
  *   **Requirement:** Explicitly answer whether "breadth" equals "better" under the chosen framework.
  *   **Trap:** Asserting conservatives are morally better simply because they have more foundations (the "breadth = truth" fallacy) without justifying *why* breadth matters normatively.

  **3. Handling the Is-Ought Gap (5 points)**
  *   **Requirement:** Acknowledge the move from descriptive psychology to normative claim and justify the transition (e.g., via hypothetical imperatives in the Coordination model).
  *   **Trap:** Invoking Hume's Law as a "gotcha" to dismiss the theory entirely, rather than analyzing how the theory attempts to bridge the gap.

  **4. Critical Commitment (5 points)**
  *   **Requirement:** Take a definitive stance on which analogy is philosophically viable. Do not remain neutral.
  *   **Trap:** Writing a "book report" that lists the pros and cons of each without arguing for a winner.

  **5. Specific Defense of the Chosen View (5 points)**
  *   **Requirement:** If choosing Coordination, explain *what* is being coordinated (social scale/stability). If choosing Perception, explain the ontology of the values.
  *   **Trap:** (For Coordination) Failing to distinguish "social stability" from "moral goodness," leaving the argument vulnerable to the "stable tyranny" objection. (For Perception) Failing to explain how evolution tracks moral truth rather than just fitness.
