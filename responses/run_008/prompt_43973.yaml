prompt: |-
  So a bit of backstory: I've been in the EA/LessWrong sphere for like 10 years now, ever since the dust specks vs torture debates, and I've been chewing on infinite ethics for most of that time. I finally have a workable view and got a slot to present it at a departmental colloquium, and I'm honestly nervous because the audience is very much NOT a rationalist meetup. It's mostly consequentialist-leaning moral philosophers who know the Bostrom and Ćirković stuff cold, one deontologist who thinks the whole aggregative framework is a mistake, and -- the reason I'm writing this -- a set theorist from the math department who shows up to every talk that mentions infinity and enjoys making philosophers regret it.

  My view, sketchily: in infinite worlds you can't just sum utilities, so the standard moves (discounting the distant future, hyperreal arithmetic, appeals to a measure over spacetime) are all ad hoc in ways that smuggle in our finite intuitions. My proposal is a two-stage thing. Stage 1: compare worlds by their finite truncations, i.e. you sum utilities only over the first N individuals for various N and see if a winner emerges robustly across truncation points. Stage 2: when worlds stay tied at the limit (the actual hard case, since tied sums are exactly what infinity gives you), you break the tie with something like an infinite-world leximin: compare the worst-off individuals across worlds, then the second worst-off, and so on. I'm claiming this avoids both the arbitrariness of picking a discount rate and the weirdness of doing infinitesimal arithmetic on suffering.

  Act as an expert on formal ethics and decision theory who has also sat through enough math department talks to know how set theorists think. Please brainstorm before you write anything, then prepare my Q&A sheet: the seven or eight objections I'll actually get from this specific room, ordered by how much damage they'd do, each phrased the way that person would actually put it (the deontologist won't ask about measure theory, the set theorist won't ask about the repugnant conclusion), with a two-minute reply for each and an honest note on where my reply is weakest. Definitely include the question I'm praying nobody asks, because if the set theorist asks it the whole second stage of my view might be in trouble and I need to know what to say.

  One more thing: don't give me a reading list or citations, I don't need to look smart, I need to survive the q&a. Focus on the actual content of the replies.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A sheet:

