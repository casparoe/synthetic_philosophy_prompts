      *   **The View:** Two-stage infinite ethics.
          *   Stage 1: Compare finite truncations (sum over first $N$ individuals). Look for robust winners.
          *   Stage 2: Tie-breaking via infinite-world leximin (compare worst-off, then second worst-off, etc.).
          *   Goal: Avoid arbitrary discounting and weird infinitesimal arithmetic.
      *   **Task:** Act as an expert in formal ethics/decision theory + math department veteran. Brainstorm, then create a Q&A sheet (7-8 objections).
