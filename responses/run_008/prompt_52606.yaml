answer: |-
  The orthodoxy in welfare economics is tidy, rigorous, and almost certainly wrong about the thing that matters most. The standard line is that utility is ordinal, unique only up to positive affine transformation, and therefore interpersonal comparisons are scientifically meaningless. You cannot add utils across persons because there is no common zero and no common unit. This veto is often treated as a deep metaphysical insight into the nature of value, but it is better understood as a methodological caution regarding preference satisfaction that has been mistaken for an ontological limit. The real question is not whether we can construct a social welfare function that sums cardinal utilities—we probably can't—but whether we can make the weaker, ordinary judgments that sustain moral life: that this person's suffering is worse than that person's inconvenience, or that she is worse off than he is.

  To decide this, we must distinguish between the *measurement* of utility and the *fact* of utility. The economic skeptic argues from the limitations of measurement to the impossibility of fact. Because we cannot calibrate scales across minds using revealed preference data, there is nothing to calibrate. But this conflates the map with the territory. If welfare consists in something other than abstract preference satisfaction—if it consists in phenomenological experience—the affine transformation argument loses its bite. Preferences are indeed idiosyncratic scales, but pains and pleasures share a common currency: consciousness itself. The skeptic's error is assuming that because we lack a perfect ruler, there is no distance to measure.

  This brings us to the crux of the matter, the test case that separates the realist from the expressivist: the Experience Duplex. Imagine a device that allows you to feel a calibrated sample of exactly what another person is feeling, without distortion. You plug in Person A, who is losing their job, and Person B, who is gaining a tax cut. The device lets you feel A's anxiety and B's satisfaction, side-by-side, at true intensity. The question is simple: Would this settle the claim "A is worse off than B"?

  I argue that it would. If you plug them in and the anxiety is phenomenally heavier, more intrusive, and more damaging to the capacity for functioning than the satisfaction is uplifting, you would not say, "Well, the scales are still incommensurable." You would say, "Now I see why A needs the help more." The fact that we imagine the duplex as *settling* the matter reveals that our ordinary concept of "worse off" is anchored in intrinsic facts about experience, not merely in the social role of the judgment. The duplex acts as an ideal instrument for a quantity we are already trying to measure with our crude tools of empathy and observation.

  Consider the alternative. Suppose you claim the duplex is irrelevant. Suppose you argue that "worse off" is fixed entirely by the concept's social role—how the judgment functions in deliberation, what entitlements it triggers. On this view, even if the duplex showed A's pain was phenomenally identical to B's pleasure, we might still judge A "worse off" because of some normative rule about loss aversion or entitlement. But this leads to a disconnect that renders the concept useless. If "worse off" does not track the magnitude of suffering or flourishing, what is it tracking? Purely social status? If so, then welfare economics is not studying welfare at all; it is studying power dynamics disguised as well-being.

  The realist interpretation of the duplex is superior because it respects the phenomenology of moral deliberation. When a nurse triages patients, she is not arbitrarily assigning priority; she is attempting to recognize who is suffering more. She acts as a biological duplex. Her empathy is the imperfect mechanism by which she accesses the shared phenomenological space. If the skeptic says this is all meaningless, they are saying the nurse is under a systematic illusion. But the realist says the nurse is doing difficult science with noisy data. The duplex thought experiment confirms that we believe there is a truth of the matter to be found. If there were no fact of the matter, the duplex would be like a device that measures "which color is tastier"—it would malfunction because the category error is in the question, not the instrument. But the duplex feels coherent. We can imagine it working. That coherence suggests the comparability is real.

  This forces the skeptic into a corner regarding ordinary language, demanding what I call an error theory. If interpersonal comparisons are meaningless, then the parent splitting the cake, the nurse triaging the wounded, and the policymaker weighing tax burdens are all speaking nonsense. They are making claims that have no truth conditions. The skeptic must explain what this talk is actually doing. Is it expressive? Are we merely saying "I prefer A's state" when we say "A is worse off"? Is it coordinative? Are we simply signaling a desire to redistribute resources?

  These error theories are uncharitable and implausible. Consider the parent splitting the cake. If the child says, "My brother wanted it more," and the parent agrees, they are not merely coordinating preferences. They are appealing to a fact about the brother's internal state that outweighs the child's. If it were merely expressive, the child could reply, "Well, I express a stronger preference," and there would be no resolution. But there is resolution. The talk functions because it aims at truth. The skeptic's error theory requires us to believe that centuries of moral discourse are systematically infected with a category mistake, yet somehow function perfectly well in practice. It is far more parsimonious to assume the discourse works because it latches onto something real—namely, comparable states of consciousness—than to assume it works despite being fundamentally false.

  Furthermore, the skeptic's formal argument relies on a specific definition of utility that is ill-suited for welfare. If utility is defined strictly as revealed preference, then yes, comparisons are impossible because preferences are ordinal rankings of options. But why should welfare be defined by preference satisfaction? Preferences can be adaptive, misinformed, or self-destructive. A prisoner may prefer not to hope to avoid disappointment, but that does not mean their welfare is higher than the hopeful man's. If we shift the locus of welfare to experiential well-being—hedonic tone, capability, functioning—the affine transformation problem dissolves. Pain has a intensity. Pleasure has a duration. These are cardinal properties of experience, not just ordinal rankings of choices. The economic argument holds only if we accept that preferences are the only data that count. But for welfare, experience is the data.

  Therefore, the verdict must be that interpersonal utility comparisons are possible, meaningful, and necessary. The standard economic veto is a methodological rule that has been illegitimately elevated to a metaphysical principle. It correctly identifies that we cannot *sum* utilities with precision using market data, but it incorrectly infers that we cannot *compare* magnitudes of welfare using phenomenological data. The Experience Duplex shows that our concept of welfare is realist: it points to intrinsic facts about experience that can be compared. The error theory required to deny this is too costly, demanding we treat ordinary moral practice as a elaborate fiction.

  We do not need a common zero to say that a broken leg is worse than a paper cut. We need only a shared capacity to feel. The skeptic demands a precision that moral life does not require and that experience does not support. We are not adding numbers; we are weighing lives. The scale is imperfect, but the weight is real. To deny this is not scientific rigor; it is a refusal to look at what is actually being weighed.
