answer: |-
  1. The no-trade theorem argues that if traders are rational, the mere offer of a trade signals the other person has superior information, forcing you to update your beliefs until the potential profit disappears.
  2. This hinges on common knowledge of rationality and priors rather than just identical information, requiring an infinite chain of certainty that everyone interprets data logically.
  3. Far from proving efficiency, this logic creates the Grossman-Stiglitz paradox where perfectly efficient prices remove the incentive to gather information, implying markets must be slightly inefficient to function.
  4. Your day-trading friend contradicts himself by claiming efficiency while trying to beat the market, while your Keynesian friend overlooks that arbitrageurs usually correct extreme mispricing even if emotions drive trends.
  5. Real markets violate the theorem because traders disagree on fundamental priors or doubt each other's rationality, allowing animal spirits and liquidity needs to drive trades that theory says shouldn't happen.
