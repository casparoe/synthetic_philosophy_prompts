answer: |-
  ### Pattern 1: The "Max Eagerness" Dynamic

  There is no single, universally recognized term in organizational theory or social psychology that perfectly captures this specific dynamic of unilateral action by the most enthusiastic member overriding the passive majority. However, it is a recognized failure mode in informal governance.

  The closest established concept is **"The Minority Rule"** (popularized by Nassim Taleb). Taleb argues that an intransigent minority (even a very small one) can dictate preferences to a flexible majority because the majority doesn't care enough to oppose them. In your case, the "intransigent minority" is the single enthusiastic member, and the "flexible majority" is the rest of the committee who prefer avoiding conflict over stopping the action. However, Taleb's rule usually applies to *restrictions* (e.g., kosher food) rather than *expenditures* or *actions*, so the direction is slightly inverted.

  Another nearest miss is the **"Tragedy of the Commons"**. Here, the club's funds and reputation are the "commons." The enthusiastic member is "over-grazing" these shared resources for their own utility (the satisfaction of doing the thing), while the costs (risk, money) are shared by all. This fits well but is typically reserved for resource depletion rather than strategic direction.

  A third concept is **"Agency Loss"** or **"Rogue Action"** in governance. This describes when an agent (committee member) acts outside the mandate of the principal (the club). However, this implies a formal breach of rules, whereas your situation sounds like a cultural norm where rules are loose enough to allow it.

  **Coinage:** Since no single term fits perfectly, I propose calling this **"The Enthusiast's Default"**.
  *Definition:* A governance failure mode in informal groups where action occurs if any single member values it highly enough to act unilaterally, because the transaction cost of objection for the remaining members exceeds the transaction cost of action for the enthusiast.

  ### Pattern 2: The "Min Willingness" Dynamic

  This pattern is well-documented. In social psychology, it is the **"Bystander Effect"** or **"Diffusion of Responsibility"**: individuals are less likely to take action when others are present because they assume someone else will do it. In economics and political science, it is the **"Free Rider Problem"** within a **Collective Action Problem**: everyone benefits from the task being done (updated policy), but everyone hopes to bear the cost (doing the work) without contributing.

  ### Relationship Between the Two

  These are **symmetric opposites** stemming from the same root cause: **High Coordination Costs in Informal Governance**.
  *   **Pattern 1** arises because the cost to *start* something is low (one person acts) and the cost to *stop* something is high (social confrontation).
  *   **Pattern 2** arises because the cost to *start* something is high (unpleasant work) and the cost to *wait* is low (assuming others will do it).

  They are not the "same phenomenon" in terms of outcome (one is over-action, one is under-action), but they are twin symptoms of a system that lacks formal mechanisms to aggregate preferences (like voting or task assignment).

  ### Confidence and Uncertainty

  I am **highly confident** in the identification of Pattern 2 (Bystander/Free Rider). I am **medium-to-low confident** that there isn't a niche term for Pattern 1 in volunteer management literature, though none exists in general organizational theory.

  The point I am **least sure about** is whether a specific term exists in the niche literature of "volunteer-led organization governance" that names Pattern 1 specifically, as this literature is less standardized than general economics or psychology.

