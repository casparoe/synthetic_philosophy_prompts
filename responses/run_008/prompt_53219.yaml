          *   Daisy misjudges the cost (theory says she shouldn't).
      *   **Key Questions:** Where does the novel vindicate the theory? Where does it resist it? Does it dramatize something theory misses (specifically regarding receiver competence and old vs. new money)?
      *   **Constraint:** Be honest about where the reading strains the text.
      *   **Language:** British English.

  2.  **Deconstruct the Theoretical Framework:**
      *   *Costly Signaling Theory (CST):* Organisms send signals to convey information. To be honest, the signal must be costly (hard to fake).
      *   *Handicap Principle (Zahavi):* The signal must be a handicap (reducing fitness) to prove quality. Only high-quality individuals can afford the handicap.
      *   *Application to Gatsby:* Gatsby spends massively to prove he is worthy of Daisy.
      *   *Application to Tom:* Tom doesn't need to spend visibly; his status is inherent/institutional.

  3.  **Evaluate the "Vindication" (Where the theory fits):**
      *   Gatsby's mansion and parties are definitely costly signals. They serve no utilitarian purpose other than display.
      *   The sheer scale is a barrier to entry for the "new money" crowd, yet ironically, they are the ones attending.
      *   Gatsby's shirts: This is also a costly signal (imported, numerous, discarded), but more intimate.
      *   The theory holds up in explaining *why* Gatsby spends: to bridge the gap between his origin and his desired status.

  4.  **Evaluate the "Resistance" (Where the theory breaks or strains):**
      *   *The Receiver Problem:* CST assumes the receiver understands the cost. Daisy fails here. She cries at the shirts, but ultimately chooses Tom. She doesn't value the signal in the way Gatsby intends.
      *   *The Tom Buchanan Problem:* Tom signals via *lack* of effort. This is "quiet luxury" or, more accurately, "institutionalised capital." CST struggles with signals that are invisible. If the signal is "I don't need to signal," how is that measured cost-wise? It's a different *kind* of capital (social/cultural vs. economic).
      *   *The Audience Problem:* The partygoers consume the signal but gossip about the source. They validate the *wealth* but reject the *man*. CST usually implies successful signaling leads to mating/social success. Here, it leads to infamy and death.
      *   *The Green Light:* The ultimate signal is never actually received in the way intended.

  5.  **Address the "Something Theory Misses" (Competence and Class):**
      *   This is the strongest insight. Old money (Tom/Daisy) possesses "cultural capital" (Bourdieu fits well here alongside CST). They know how to read signals because they define them.
      *   New money (Gatsby) buys the props but lacks the grammar.
      *   The "competence to judge cost" is the crux. Daisy knows the cost of the shirts, but she also knows the cost of *social ruin*. Gatsby miscalculates the latter.
      *   Signaling isn't just about expenditure; it's about *legitimacy*.

  6.  **Drafting the Response (incorporating British English and Tone):**
      *   *Tone:* Academic, critical, nuanced, honest.
      *   *Spelling/Grammar:* British (e.g., *signalling*, *colour*, *analyse*, *whilst*).
      *   *Structure:*
          1.  Introduction: Acknowledge the sophistication of the reading.
          2.  Vindication: Where CST works (Gatsby's display).
          3.  Resistance: Where it fails (Tom's silence, Daisy's reaction, the guests' hypocrisy).
          4.  The Missing Element: Receiver competence and the distinction between economic and cultural capital.
          5.  Conclusion: Summary of the tension.

  7.  **Refining the Arguments (Self-Correction during drafting):**
