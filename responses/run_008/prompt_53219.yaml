      *   *Tom's Signaling:* Is it true Tom signals nothing? He signals through violence and physical presence ("cruel body"). He also signals through his horses and polo ponies. But the key is *inheritance* vs. *acquisition*. I need to clarify that Tom's signal is *continuity*, Gatsby's is *magnitude*.
      *   *Honesty about Strain:* I must explicitly state that applying evolutionary biology/economics to a tragic romance risks reducing the text's moral ambiguity. Gatsby isn't just a peacock; he's a dreamer. The theory misses the *idealism*.

  8.  **Final Polish (checking British English):**
