      *   *Foundations of Statistics* (1954) is the bible.
      *   **Goal:** Normative, not descriptive. He wanted to define *rationality*, not describe *behavior*.
      *   **Axioms:** P1-P7. The Sure-Thing Principle (P2) is crucial.
      *   **Response to Allais:** This is key evidence. When presented with the Allais paradox, Savage reportedly realized his own choices violated his axioms and *changed his choices* to align with the axioms. This suggests a strong commitment to the normative power of the axioms over intuition.
      *   **Small Worlds:** He acknowledged his theory applies to "small worlds" (closed, well-defined decision problems), not necessarily "grand worlds" (messy reality).
      *   **Personality:** Rigorous, mathematical, somewhat dogmatic about the logical consistency of rationality, but intellectually honest (as seen in the Allais incident).

  3.  **Address the Technical Arguments (Ellsberg vs. Savage):**
      *   *Ellsberg's Point:* People prefer known probabilities to unknown probabilities (Ambiguity Aversion). This violates the Sure-Thing Principle (P2) and the additivity of subjective probability.
      *   *Dutch Book Argument:* If beliefs aren't probabilistic, you can be pumped for money.
      *   *Ambiguity Models (Gilboa-Schmeidler):* Maxmin Expected Utility (MEU). You have a *set* of priors, not one. You maximize the minimum expected utility across that set.
      *   *Savage's Counter:* Does MEU avoid Dutch Books?
          *   Standard Dutch Book theorems assume a single prior.
          *   If you have a set of priors, you aren't vulnerable to a *standard* Dutch Book in a single shot, *but* you might be vulnerable to dynamic inconsistency or money pumps if the set isn't updated carefully (e.g., rectangularity condition).
          *   Savage would argue that having a *set* of probabilities is an admission of ignorance, not a refinement of rationality. Rationality demands sharpening beliefs to a single distribution.
      *   *Where Savage Concedes:* He would have to admit that Ellsberg choices don't lead to a *static* Dutch Book in the same way incoherent probabilities do. The inconsistency is with the *axioms*, not necessarily immediate financial loss in a one-off bet.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Set the stage. Savage as a normative theorist. The clash between logical consistency (Savage) and descriptive accuracy/robustness (Ellsberg/Behavioral).
      *   **The Savagean Defense (Digging In):**
          *   Focus on Normativity. "I didn't say people *are* rational, I said this is what rationality *looks like*."
          *   The "Set of Priors" critique. Savage would see a set of priors as a failure to commit to a belief. To him, probability is personal commitment.
          *   Exploitability: He'd argue that while a static Dutch Book might not exist, dynamic inconsistency (changing plans mid-stream) is the real killer. MEU models often struggle with dynamic consistency without strong constraints.
      *   **The Concession (Folding):**
