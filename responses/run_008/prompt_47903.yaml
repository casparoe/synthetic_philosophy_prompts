      *   **Subject:** Leonard Savage (1917–1971), father of subjective expected utility (SEU) theory.
      *   **Scenario:** Resurrect Savage today, show him post-1961 developments (Ellsberg, Gilboa-Schmeidler, Smooth Ambiguity, Behavioral Econ's acceptance of ambiguity aversion).
      *   **Core Question:** Would he fold (concede) or dig in (defend SEU)?
