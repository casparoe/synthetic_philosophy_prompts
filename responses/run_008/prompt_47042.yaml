          3.  Is the harm direct and demonstrable? (e.g., stopping meds vs. buying expensive water).
          4.  If harm is uncertain or value-laden, vote.
      *   *Moderation:* The procedure must also cover *how* the talk is handled (moderator intervention, disclaimers).

