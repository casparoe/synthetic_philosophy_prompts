      *   *The Corn Dealer Example:* Opinions should be free in print, but not when delivered to an excited mob outside a dealer's house (incitement to immediate violence/harm).
      *   *Application to Science Lectures:* The venue is a museum (authority implied), audience is vulnerable (retirees, laypeople), topic is science/health/environment.
      *   *The Procedure:* Needs to be a flowchart translated into prose.
          1.  Is the claim falsifiable/scientific? (Maybe not strictly Mill, but relevant to "science series").
