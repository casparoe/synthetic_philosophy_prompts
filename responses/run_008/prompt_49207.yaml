answer: |-
  # Specification for the Justification of a Qualified Common Prior Assumption

  ## I. The Desiderata
  Any adequate defense of a *qualified* Common Prior Assumption (CPA) must satisfy the following requirements. Each is categorized by its **Status** (Non-negotiable for *any* coherent defense, or School-Dependent) and its **Generator** (the theoretical or empirical pressure creating the requirement).

  ### 1. Ontological Clarity
  *   **Requirement:** The defense must specify the temporal and metaphysical status of the "common prior." Is it a counterfactual historical moment (pre-signal), a logical precondition for type-space construction, or a regulative ideal?
  *   **Generator:** The "Uninformed State" Problem. Real agents are born with genetic, cultural, and linguistic endowments that constitute information. A "time zero" where agents share a state of ignorance is empirically false.
  *   **Status:** **Non-negotiable.** Without this, the assumption is category-confused.

  ### 2. The Disagreement Constraint
  *   **Requirement:** The defense must account for persistent, rational disagreement. If the CPA holds and rationality is common knowledge, Aumann's Agreement Theorem implies posterior beliefs must converge. The defense must explain why we observe persistent disagreement without rendering the CPA trivial (e.g., by claiming all disagreeing agents are irrational).
  *   **Generator:** Aumann's Agreement Theorem. The empirical reality of betting markets, litigation, and scientific controversy contradicts the strict implication of CPA + Common Knowledge of Rationality (CKR).
  *   **Status:** **Non-negotiable.** A theory of information that cannot accommodate observed disagreement is empirically vacuous.

  ### 3. The Trade Consistency Condition
  *   **Requirement:** The defense must reconcile the CPA with the existence of speculative trade. The Milgrom-Stokey No-Trade Theorem states that with a common prior and CKR, no mutually beneficial speculative trade occurs. The defense must clarify if observed trade is (a) non-speculative (risk sharing), (b) evidence of prior divergence, or (c) evidence of bounded rationality.
  *   **Generator:** The No-Trade Theorem. Financial markets exhibit high volume; if CPA is descriptively true, this volume must be explained without contradicting the assumption's core logic.
  *   **Status:** **Non-negotiable (for descriptive claims).** If the claim is purely normative, this requirement relaxes to "explaining why agents *should* not trade."

  ### 4. The Scope of "Evidence"
  *   **Requirement:** The defense must delineate what counts as "information" (which updates the prior) versus what counts as "prior" (which must be shared). Specifically, it must rule on whether temperament, evolutionary heuristics, or early childhood learning are treated as private signals (allowing divergence) or as part of the rational core (requiring convergence).
  *   **Generator:** The Problem of Arbitrary Priors. If priors include temperament, CPA is empirically false. If priors exclude temperament, the definition of "rational agent" becomes unnaturally narrow.
  *   **Status:** **School-Dependent.** Objective Bayesians require priors to be logic-based; Subjective Bayesians allow arbitrary priors (making CPA hard to justify); Evolutionary Epistemologists treat priors as adaptations.

  ### 5. Descriptive vs. Normative Declaration
  *   **Requirement:** The defense must explicitly declare whether the CPA is a claim about how agents *do* reason (descriptive) or how they *ought* to reason (normative).
  *   **Generator:** The Is-Ought Gap. A defense that mixes these (e.g., arguing agents are rational because models assume they are) commits the naturalistic fallacy.
  *   **Status:** **Non-negotiable.** Ambiguity here allows the defender to shift ground when challenged.

  ### 6. The Qualification Limit
  *   **Requirement:** Since this is a defense of a *qualified* CPA, the defense must specify the boundary conditions under which the qualification fails. (e.g., "CPA holds among trained economists but not the general public"). It must provide a criterion for the "reference class" of agents who share the prior.
  *   **Generator:** The Heterogeneity Problem. Universal CPA is implausible. A qualified CPA risks becoming tautological ("Agents who agree share a prior") unless the reference class is defined independently of the agreement itself.
  *   **Status:** **Non-negotiable.** Without independent criteria for the reference class, the assumption is unfalsifiable.

  ---

  ## II. Incompatibility Matrix
  The following pairs of requirements cannot be simultaneously satisfied without significant theoretical cost. A qualified defense must choose which horn of the dilemma to accept.

  ### Conflict A: Descriptive Accuracy vs. The No-Trade/Agreement Implications
  *   **The Tension:** If you satisfy **Req 5 (Descriptive)** and **Req 1 (Ontological Reality)**, you must admit agents have different histories and cognitive structures. This violates **Req 2 (Disagreement)** and **Req 3 (Trade)** because observed trade and disagreement imply either different priors or irrationality.
  *   **The Cost:** To save the CPA descriptively, you must classify almost all observed disagreement as "irrationality" or "lack of common knowledge," which renders the model useless for predicting real-world strategic interaction where disagreement is standard.
  *   **Resolution:** You must sacrifice Descriptive Accuracy for Normative Force, or restrict the Descriptive Claim to highly artificial environments (e.g., controlled markets).

  ### Conflict B: Normative Uniqueness vs. Subjective Bayesianism
  *   **The Tension:** If you satisfy **Req 4 (Scope of Evidence)** by allowing subjective priors (Savage-style), you cannot satisfy **Req 5 (Normative)** in a strong sense, because Subjective Bayesianism denies there is a single rational prior to share. If you insist on a unique rational prior (Jaynes/Keynes), you violate **Req 1 (Ontological Reality)** because no such logical prior exists for complex empirical events.
  *   **The Cost:** Either the CPA has no normative bite (it's just a coincidence we share priors) or it relies on a controversial objective logic that most modern decision theorists reject.
  *   **Resolution:** Adopt a "intersubjective" norm (Req 6), where the prior is shared only within a specific linguistic or training community, sacrificing universal rationality.

  ### Conflict C: Counterfactual Ontology vs. Empirical Accessibility
  *   **The Tension:** If you satisfy **Req 1** by defining the prior as a counterfactual "pre-information" state, you violate **Req 6 (Qualification Limit)** because that state is unobservable. We cannot verify if two agents *would* have agreed before their lives diverged.
  *   **The Cost:** The assumption becomes a metaphysical postulate rather than a scientific hypothesis.
  *   **Resolution:** Treat the prior as a modeling fiction (Pragmatic), sacrificing truth claims entirely.

  ---

  ## III. Assessment of Leading Defenses

  ### 1. The Harsanyi-Type Space Defense
  *   **Strategy:** Treats the prior as a structural feature of the model (the "type space"). Differences in belief are modeled as differences in private information (types) within a common probability space.
  *   **Performance:**
      *   **Passes:** Ontological Clarity (as a mathematical construct), Normative Declaration (implicitly normative/structural).
      *   **Fails:** **Disagreement Constraint** and **Trade Consistency.** By definition, it models disagreement as private information. It cannot explain *fundamental* disagreement (different priors) without breaking the model. It renders the No-Trade theorem a tautology of the model structure rather than a prediction.
      *   **Verdict:** Mathematically robust, empirically brittle. It solves the coordination problem for the theorist, not the epistemic problem for the agent.

  ### 2. The Convergence (Blackwell-Dubins) Defense
  *   **Strategy:** Argues that even if priors differ, shared evidence will eventually drive posteriors to agreement (merging of opinions). Thus, CPA is an asymptotic ideal.
  *   **Performance:**
      *   **Passes:** **Normative Declaration**, partially satisfies **Disagreement Constraint** (disagreement is temporary).
      *   **Fails:** **Ontological Clarity** and **Trade Consistency.** Convergence requires infinite time and absolute continuity of measures. In strategic settings (games), decisions are made *before* convergence. The "long run" is irrelevant to the one-shot trade or negotiation.
      *   **Verdict:** Defensible as a long-run epistemic ideal, useless for finite strategic interaction.

  ### 3. The Pragmatic/Convention Defense
  *   **Strategy:** Treats CPA as a "as if" assumption. Agents don't share priors, but modeling them as such yields better predictions than the alternative, or it serves as a focal point for coordination.
  *   **Performance:**
      *   **Passes:** **Trade Consistency** (allows trade as a model artifact), **Ontological Clarity** (admits it's a fiction).
      *   **Fails:** **Descriptive vs. Normative Declaration.** It explicitly refuses to claim truth. It also struggles with **Qualification Limit**—if it's just a convention, *which* convention?
      *   **Verdict:** Intellectually honest, but surrenders the claim that the CPA reflects rationality. It makes the CPA a tool, not a theory.

  ---

  ## IV. Final Verdict

  The Common Prior Assumption is **indefensible as a universal descriptive law** but **defensible as a qualified normative ideal for specific epistemic communities.**

  This verdict is grounded in the failure of the **Descriptive Accuracy** requirement when paired with the **Trade Consistency Condition**. Any defense claiming the CPA is descriptively true for real-world agents must explain away the vast volume of speculative trade and persistent disagreement as "irrationality" or "lack of common knowledge." This moves the goalposts so far that the theory loses predictive power.

  However, the CPA is defensible if the **Qualification Limit** is strictly drawn around **Req 6 (Reference Class)**. If the defense restricts the CPA to agents who share a specific training, language, and cultural framework (e.g., professional arbitrageurs, scientists within a paradigm), it satisfies the **Normative Declaration** and mitigates the **Disagreement Constraint**.

  **Therefore, a successful defense must:**
  1.  Abandon the claim that the CPA describes human psychology universally.
  2.  Abandon the claim that the prior represents a historical moment of ignorance.
  3.  Embrace the **Pragmatic/Normative Hybrid**: The CPA is a requirement for *commonality of language and logic* within a defined community, not a claim about the origin of belief.

  If you attempt to defend the CPA beyond this qualified scope—specifically, if you attempt to claim it explains *why* disagreement exists in the general population—you will violate the **Incompatibility Matrix (Conflict A)** and the defense will collapse into tautology.
