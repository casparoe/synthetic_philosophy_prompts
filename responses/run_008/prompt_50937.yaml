prompt: |-
  I'm TAing intermediate micro and next week I have to do a section on interpersonal utility comparisons, 30 minutes, whiteboard, for students who just spent weeks learning that utility is ordinal and that comparing utils across people is meaningless — and who now treat that like scripture. Don't explain the topic to me; plan how I should teach it. What has to go first — is it the distinction between "we can't measure it" and "there's no fact of the matter to measure," or something else? What one example should carry the whole thing (I'm tempted by the fixed budget split between two people, but tell me if something carries better and what the example must have and must lack)? Which misconceptions will they predictably form — I'm guessing "it's just an empirical problem, get better happiness surveys" and "money is a common scale so it's already solved" — and exactly where in the sequence I should head each one off. Should I bring in the veil-of-ignorance / extended sympathy move where you ask what you'd prefer behind ignorance of who you are, or does that muddy more than it clarifies at this level? And give me one question I can ask at the end that would let me tell apart the students who actually got the meaning/measurement distinction from the ones who just memorized the ordinalist slogan.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** TAing Intermediate Microeconomics.
      *   **Topic:** Interpersonal Utility Comparisons (IUC).
      *   **Constraint:** 30 minutes, whiteboard only.
      *   **Audience:** Students who just learned utility is ordinal and IUC is "meaningless" (treat this as dogma).
      *   **Goal:** Teach *how* to teach it, not explain the topic itself.
      *   **Specific Questions to Answer:**
          *   What goes first? (Measurement vs. Ontology)
          *   What one example to use? (Budget split vs. others, criteria for the example)
          *   Predictable misconceptions & when to head them off.
          *   Veil of Ignorance/Extended Sympathy: Include or exclude?
          *   Final assessment question (distinguish understanding from memorization).

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Problem:* Students have internalized "Utility is ordinal" $\rightarrow$ "IUC is impossible/nonsense." They view this as a technical limitation of economics, not a philosophical stance.
      *   *The Shift:* They need to move from "We *can't* compare" (technical/empirical) to "Standard theory *assumes we don't*" (methodological/normative), and then explore *why* we might want to anyway (welfare economics, policy).
      *   *Time:* 30 minutes is tight. Need focus. No tangents.

  3.  **Address Specific Questions:**

      *   **What goes first?**
          *   *Option A:* Measurement vs. Ontology. (Can't measure vs. Doesn't exist).
          *   *Option B:* The Policy Necessity. (Why are we talking about this? Because governments tax and spend).
          *   *Decision:* Start with the *tension*. Acknowledge their dogma immediately, then show why it breaks in the real world. If you start with philosophy, they tune out. Start with the *consequence* of the dogma.
          *   *Refinement:* Actually, the prompt asks "What has to go first — is it the distinction between 'we can't measure it' and 'there's no fact of the matter'..."
          *   *Verdict:* Yes, this distinction is crucial, but it needs to be framed by *why it matters*. Start by validating their ordinal knowledge, then pivot to the "So what?"
          *   *Better Verdict:* Start with the **Policy Paradox**. "You can't compare utility, but you have to tax someone." This forces the distinction between measurement and ontology later.
          *   *Wait, re-reading the prompt:* "What has to go first — is it the distinction between 'we can't measure it' and 'there's no fact of the matter to measure,' or something else?"
          *   *Answer:* It's not the distinction itself first. It's the **Welfare Judgment**. You need to show them that *not* making comparisons is itself a value judgment.

      *   **The One Example:**
          *   *Candidate:* Fixed budget split (Student A vs. Student B).
          *   *Pros:* Simple, relatable, involves money (which they think solves it).
          *   *Cons:* Money invites the "money = utility" fallacy.
          *   *Requirement:* The example must strip away price mechanisms. It must be about *allocation of a good* where marginal utility differs.
          *   *Better Example:* **The Kidney/Drug Allocation** or **The Painkiller**.
          *   *Why:* Money confuses them. Pain/Health is universally understood as having diminishing marginal returns but is clearly subjective.
          *   *Wait, keep it Micro:* The **$100 Grant** example is standard for a reason. But to avoid the "money is utility" trap, frame it as "Scholarship Money" where one student is rich and one is poor.
          *   *Selection:* **The $1000 Departmental Grant.** One student is working class, one is wealthy.
          *   *Must Have:* Diminishing marginal utility of income (intuitive).
          *   *Must Lack:* Prices, markets, or work effort (to isolate the transfer).

      *   **Misconceptions & Timing:**
          *   *Misconception 1:* "Just use happiness surveys." (Empirical solution to a theoretical problem).
              *   *Head off:* When introducing the ordinality constraint. Remind them that even with surveys, scale is arbitrary.
          *   *Misconception 2:* "Money solves it." (Cardinal proxy).
              *   *Head off:* Immediately after the example. Show that \$1 means different things to different people.
          *   *Misconception 3:* "Utilitarianism is the only way."
              *   *Head off:* When discussing solutions.

      *   **Veil of Ignorance:**
          *   *Pros:* Intuitive way to justify comparisons.
          *   *Cons:* It's political philosophy (Rawls), not micro theory. Can confuse the "positive vs. normative" line.
          *   *Decision:* **Use it, but briefly.** Frame it as "Extended Sympathy" (Harsanyi) to justify the *assumption* of comparability, not as a moral truth. It bridges the gap between ordinal preference and social welfare.
          *   *Timing:* Near the end, as a "how we might resolve this" tool.

      *   **Final Question:**
          *   Need to test if they understand that IUC is a *choice/assumption*, not a *discovery*.
          *   *Bad Question:* "Can we compare utility?" (Yes/No)
          *   *Good Question:* "If a policy makes the rich richer and the poor poorer but total GDP goes up, does Pareto efficiency tell us if this is good? Why or why not?"
          *   *Better Question:* "Construct a social welfare function. What assumption did you just make that violates ordinality?"
          *   *Best Question:* "I claim Policy A is better than Policy B because the sum of utils is higher. You claim IUC is meaningless. What specific assumption must I defend to make my claim valid, and is it empirical or ethical?"

  4.  **Drafting the Plan (Iterative refinement):**

      *   *Minute 0-5:* Validate & Pivot. Acknowledge ordinality. Introduce the Policy Problem (Tax/Transfer).
      *   *Minute 5-15:* The Example. The \$100 Grant. Draw the MU curves. Show the gain/loss.
      *   *Minute 15-20:* Misconceptions. Hit the "Money" and "Surveys" arguments hard. Distinguish Ontology vs. Measurement.
      *   *Minute 20-25:* The Veil. Use it to show *how* we make comparisons normatively.
      *   *Minute 25-30:* Assessment. The specific question.

      *   *Refining the "First Thing":* The prompt asks specifically about "Measurement vs. Fact of Matter."
      *   *Correction:* If I don't clarify this early, the rest fails. I need to establish that Standard Micro says "No Fact of the Matter," not just "Hard to Measure."
      *   *Revised Start:* 1. Validate Ordinality. 2. State the Dogma ("No Fact of the Matter"). 3. Show the Policy Necessity. This creates the cognitive dissonance needed to learn.

      *   *Refining the Example:* The \$100 grant is good, but let's make it **Painkillers**. 10 pills. Person A has a headache. Person B has a broken leg.
      *   *Why:* Money brings in "earnings" and "prices." Pain is pure utility.
      *   *Wait:* Micro students think in money. Let's stick to **Income Transfer** but explicitly model it as *Utility of Income*, not Money.
      *   *Decision:* Stick with the **\$1,000 Grant**. It's standard micro. But explicitly draw $U(I)$ curves.
      *   *Criteria:* Must show diminishing marginal utility. Must lack market prices.

      *   *Refining the Veil:* Keep it as "Extended Sympathy." Don't call it Rawls. Call it "Imagine you are Person A, then Person B."

      *   *Refining the Final Question:* Needs to be sharp. "If I say 'Taxing the rich helps society more than it hurts them,' what have I just assumed that we said was impossible 3 weeks ago?"

  5.  **Final Polish:** Check tone. Needs to be authoritative, practical, TA-to-TA. Ensure timing is realistic (30 mins flies).

      *   *Self-Correction on Misconceptions:* The "Money is a common scale" is the biggest trap. I need to make sure the whiteboard work explicitly shows $U_A(\$)$ vs $U_B(\$)$ having different slopes.
      *   *Self-Correction on Veil:* Don't spend more than 5 mins. It's a heuristic, not a proof.

  6.  **Finalizing the Output Structure:**
      *   Opening Strategy (The Hook).
      *   The Core Example (Whiteboard instructions).
      *   Misconception Management (Timing & Script).
      *   The Veil (Yes/No & How).
      *   The Assessment Question.

      *(Self-Correction during drafting)*: Make sure to emphasize that IUC is *Normative*, not *Positive*. That is the key takeaway.

      *(Final check on the "First Thing")*: The prompt asks "What has to go first... distinction between 'we can't measure' and 'no fact of the matter' OR something else?"
      *   My answer: It's the **Normative/Positive distinction**. The measurement/ontology distinction is part of that, but the *first* thing is establishing that IUC is a *value judgment*, not a technical hurdle. I will advise starting with the Policy Paradox to motivate this.

      *(Wait, let's look closer)*: If they think it's scripture, they think it's a technical fact. I need to break that. So, yes, clarifying "No fact of the matter" is crucial. But *why* do we care? Because we need to make policy.
      *   Okay, I will advise: Start with the **Policy Paradox**, which forces the **Ontology** distinction immediately.

      *(Final Plan)*:
      1.  **Minute 0-5:** The Policy Paradox (Why we are here).
      2.  **Minute 5-15:** The Example (Income Transfer).
      3.  **Minute 15-20:** Misconceptions (Money & Surveys).
      4.  **Minute 20-25:** Extended Sympathy (The Veil).
      5.  **Minute 25-30:** Assessment.

