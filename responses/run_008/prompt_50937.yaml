answer: |-
  Here is a 30-minute battle plan. Your students are clinging to ordinality as a safety raft. Your job is to show them that the raft doesn't reach the shore (policy), and they need to build a boat (normative assumptions), even if that boat is leaky.

  ### 1. What Goes First: The Policy Paradox (Minutes 0–5)
  Do **not** start with the philosophical distinction between measurement and ontology. If you start with philosophy, you lose them. They think they already know the answer ("It's meaningless").

  Start with the **Policy Paradox**.
  *   **Write on board:** *"The government must set a tax rate. Option A taxes the rich to give to the poor. Option B does the opposite."*
  *   **Ask:** "Based *only* on Pareto Efficiency, can we choose?"
  *   **They will say:** "No. One person loses."
  *   **The Pivot:** "Correct. But the government *must* choose. Refusing to choose is itself a choice (status quo bias). If we cannot compare utility, Welfare Economics is dead. We are here to discuss how we bury it, or how we resurrect it."

  **Why this first?** It forces them to admit that their "scripture" (ordinality) renders policy analysis impossible. It creates the *need* for Interpersonal Utility Comparisons (IUC) before you explain *what* they are.

  ### 2. The One Example: The \$1,000 Grant (Minutes 5–15)
  Your temptation (fixed budget split) is the right instinct, but it must be specific to avoid the "money = utility" trap.

  **The Setup:**
  *   Draw two graphs side-by-side. Label X-axis "Income," Y-axis "Utility."
  *   **Person A (Rich):** High income, flat Marginal Utility (MU) curve.
  *   **Person B (Poor):** Low income, steep MU curve.
  *   **The Shock:** Take \$1,000 from A, give to B.

  **What the Example Must Have:**
  *   **Diminishing Marginal Utility of Income:** This is the only bridge they have. They accept that a dollar means less to a millionaire.
  *   **Identical Utility Functions (Initially):** Assume $U_A(I) = U_B(I)$ for simplicity. This isolates the comparison to *income levels*, not different capacities for happiness.

  **What the Example Must Lack:**
  *   **Prices/Markets:** Do not talk about what they buy. This is about endowments.
  *   **Effort/Desert:** Do not mention how they got the money. That introduces equity vs. efficiency debates that distract from the utility comparison.

  **The Whiteboard Move:**
  Shade the loss in utility for A ($\Delta U_A$) and the gain for B ($\Delta U_B$). Visually show that $\Delta U_B > \Delta U_A$.
  *   **Say:** "Visually, society gained utility. But mathematically, what unit are we adding? 'Utils'? We said those don't exist."

  ### 3. Head Off Misconceptions (Minutes 15–20)
  They will try to solve this empirically. You must shut these down in order.

  **Misconception 1: "Money is the common scale."**
  *   **When:** Immediately after drawing the graphs.
  *   **The Head-Off:** "We measured the transfer in dollars, but we evaluated the *welfare change* in utils. If Person A loves money 10x more than Person B (different utility functions), the transfer hurts more than it helps. Dollars are not utils. We are assuming we can compare the *slope* of their curves."
  *   **Key Phrase:** "Money is the *object* of choice, not the *measure* of satisfaction."

  **Misconception 2: "It's just an empirical problem; get better surveys."**
  *   **When:** When they ask "Why can't we just ask them how happy they are?"
  *   **The Head-Off:** "If I say I'm a '10/10' happy and you say '10/10' happy, is my 10 the same as your 10? Maybe your '10' is my '5'. There is **no fact of the matter**. It is not that we lack the technology to measure; it is that the thing does not exist to be measured."
  *   **Distinction:** Drive home: **Epistemological (can't know)** vs. **Ontological (doesn't exist).** Standard Micro says Ontological.

  ### 4. The Veil of Ignorance / Extended Sympathy (Minutes 20–25)
  **Include it, but label it carefully.**
  Do not call it "Political Philosophy." Call it **"Extended Sympathy"** (Harsanyi's term). This keeps it within rational choice theory.

  *   **The Move:** "Since we cannot measure utils, we must simulate the comparison. Imagine you are behind a veil. You have a 50% chance of being Person A, 50% Person B. Which tax policy do you choose?"
  *   **The Point:** This does not *solve* the measurement problem. It **bypasses** it by turning an interpersonal comparison into an *intrapersonal* expected utility calculation.
  *   **Warning:** Tell them: "This doesn't prove IUC is real. It proves that *rational people act as if* IUC matters when designing institutions." This preserves their ordinal dogma while allowing welfare analysis.

  ### 5. The Assessment Question (Minutes 25–30)
  You need a question that separates those who understand IUC is a **normative assumption** from those who think it's a **positive fact**.

  **Ask this:**
  > "I propose a policy that increases Total GDP. I claim this is 'Good for Society.' You claim I am making a meaningless statement because utility is ordinal. **What specific assumption must I add to my argument to make it valid, and is that assumption empirical or ethical?**"

  **The Grading Key:**
  *   **Memorizers (Fail):** They will say "You need to measure happiness better" (Empirical) or "You need to check if Pareto improved" (Misses the point).
  *   **Understanders (Pass):** They will say "You must assume **cardinal utility** or **comparable marginal utility of income** across people." Crucially, they must identify it as an **ethical/normative assumption**, not an empirical discovery.

  ### Summary of Flow
  1.  **0-5:** Policy Paradox (We *have* to choose, Pareto doesn't help).
  2.  **5-15:** The \$1,000 Grant (Visualize the trade-off, expose the unit problem).
  3.  **15-20:** Misconceptions (Money $\neq$ Utils; Surveys $\neq$ Ontology).
  4.  **20-25:** Extended Sympathy (How we pretend to compare).
  5.  **25-30:** Assessment Question (Normative vs. Empirical).

  **TA Pro-Tip:** When a student insists "But utils aren't real," agree with them. "You are right. So why are we doing this?" The answer is: "Because policy is unavoidable, and pretending we don't make value judgments is the most dangerous judgment of all." That usually lands well.
