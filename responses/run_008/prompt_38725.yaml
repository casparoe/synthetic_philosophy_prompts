answer: |-
  Here are the desiderata for an adequate epistemology of conspiracy-theory belief, specified as constraints on any theoretical account.

  ### The Desiderata

  **1. The Veracity Independence Criterion (The Watergate Problem)**
  *   **Specification:** The account must define the category without reference to the truth-value of the claim. It must accommodate the possibility that a belief classified as a "conspiracy theory" is factually correct.
  *   **Case:** As you note, Woodward and Bernstein were advancing a conspiracy theory. If the definition relies on falsity, the category is retrospective and useless for real-time adjudication. A theory of the *belief* cannot depend on the *world* being a certain way, only on the relationship between the believer and the claim.
  *   **Status:** **Non-Negotiable.**

  **2. The Source Hierarchy Criterion (Trust Asymmetry)**
  *   **Specification:** The account must explain the specific reordering of epistemic authority, not a general collapse of trust. It must model why institutional credentials (peer review, wire services) are downgraded while non-institutional markers (anonymity, leaked raw data, "insider" status) are upgraded.
  *   **Case:** Blanket skepticism is rare. The believer trusts the Telegram channel *more* than the CDC. An adequate account must explain the positive justification for this alternative hierarchy, not merely diagnose a deficit of trust in the mainstream.
  *   **Status:** **Non-Negotiable.**

  **3. The Magnitude/Scope Criterion (Scale Distinction)**
  *   **Specification:** The account must distinguish between *a* conspiracy (a secret plan by a group to do something unlawful/harmful) and *the* Conspiracy (a network of sufficient power and secrecy to sustain the deception against the weight of standard investigative processes).
  *   **Case:** Price-fixing is a conspiracy. A theory positing that a price-fixing ring exists is not typically labeled a "conspiracy theory" in the pejorative sense. The label attaches when the posited conspiracy requires the silence of thousands, across decades, without a credible leak. The account must quantify the "leakage risk" required to sustain the belief.
  *   **Status:** **Non-Negotiable.**

  **4. The Recalcitrance Criterion (Immunization)**
  *   **Specification:** The account must model the mechanism by which counter-evidence is metabolized as confirmation. It cannot simply label this "irrational"; it must specify the structural move (e.g., "the lack of evidence proves the cover-up is effective") that renders the belief unfalsifiable *to the believer*.
  *   **Case:** This is the engine of the phenomenon. If the belief updated normally on evidence, it would be a hypothesis, not a conspiracy theory. The theory must explain how the belief protects its own core without appearing to the believer as dogma.
  *   **Status:** **Non-Negotiable.**

  **5. The Coherence Criterion (Incompatible Accounts)**
  *   **Specification:** The account must explain how mutually exclusive narratives (e.g., "no plane hit the Pentagon" and "a missile hit the Pentagon") are held simultaneously without cognitive dissonance.
  *   **Case:** Empirical studies show believers often endorse contradictory claims. A rational-choice model fails here. The account must treat the belief not as a specific claim about reality, but as a stance toward official reality, where the specific details are secondary to the rejection of the authorized narrative.
  *   **Status:** **Non-Negotiable.**

  **6. The Agency Integrity Criterion (Non-Pathologizing)**
  *   **Specification:** The account must not rely on individual psychopathology or cognitive deficit as a necessary condition. It must allow for the possibility that the belief is a rational response to actual institutional betrayal or a heuristic for navigating complex information environments.
  *   **Case:** As you've found, intelligent, high-functioning individuals hold these beliefs, often grounded in legitimate historical precedents (Tuskegee, MKUltra). Pathologizing the believer forecloses understanding the structural conditions that make the belief attractive.
  *   **Status:** **Prejudice** (Ethical/Pragmatic constraint, not strictly definitional).

  **7. The Investigative Heuristic Criterion (Practical Utility)**
  *   **Specification:** The account must yield actionable defeaters for the official account. It should provide a journalist with a checklist of conditions under which skepticism of the official narrative is epistemically warranted *before* the truth is known.
  *   **Case:** If the epistemology cannot guide action, it is merely taxonomic. You need to know when "follow the money" is a slogan and when it is a method. The account must distinguish between *productive* suspicion and *terminally* skeptical loops.
  *   **Status:** **Prejudice** (Specific to your use-case, not a general philosophical requirement).

  ***

  ### Tensions and Filters

  **The Incompatible Pair**
  There is a severe tension between **Veracity Independence (1)** and **Recalcitrance (4)**.
  If a belief is defined by its resistance to evidence (Recalcitrance), it is difficult to distinguish structurally between a false conspiracy theory (which resists evidence because it is false) and a true one (which resists evidence because the conspirators are successfully suppressing it). Watergate looked like a "conspiracy theory" *while it was happening*. The journalists encountered recalcitrance from the White House. If your definition marks "resistance to official denial" as an epistemic vice, you condemn the Watergate reporters. If you mark it as neutral, you lose the ability to distinguish the crank from the investigator. Satisfying both requires locating the defect not in the *resistance* itself, but in the *scope of the required complicity* (see Scale, 3), but even that is fragile.

  **The Single Most Excluding Requirement**
  **Veracity Independence (1)** excludes the most contenders.
  Most philosophical and psychological accounts rely on the falsity of the claim to do their heavy lifting. They define conspiracy theories as "false explanations." Once you remove truth-value as a criterion, the "Epistemic Vice" and "Falsifiability" models collapse or require significant reconstruction. They can no longer say "this is a conspiracy theory because it is wrong"; they must say "this is a conspiracy theory because of *how* it is argued," which forces them into the trap of the Incompatible Pair above.

  ***

  ### Scorecard of Familiar Approaches

  *   **The Falsifiability Critique (Popperian):** Fails **Veracity Independence**. It treats unfalsifiability as a logical defect, but in active cover-ups, unfalsifiability is often an empirical reality (the records are destroyed). It also fails **Investigative Heuristic**, as it advises dismissal rather than verification.
  *   **The Conspiratorial-Reasoning Diagnosis (Keeley, et al.):** Struggles with **Trust Asymmetry**. It posits that believers assume "nothing is as it seems," but fails to explain *why* they trust the alternative source. It often collapses into **Pathologizing**, treating the reasoning style as a cognitive error rather than a strategic response to information scarcity.
  *   **The Epistemic-Vice Treatment (Cassam, et al.):** Fails **Agency Integrity**. By defining the belief through vices (gullibility, closed-mindedness), it cannot accommodate the "smart believer" or the true cover-up without ad-hoc exceptions. It solves **Recalcitrance** by calling it a vice, but at the cost of **Veracity Independence**.
  *   **The Deflationary View (Pigden, et al.):** ("Just a theory about a conspiracy the powerful dislike"). Fails **Scale Distinction** and **Investigative Heuristic**. If all conspiracy theories are merely stigmatized hypotheses, the term loses its descriptive power. It cannot help a journalist distinguish between a legitimate inquiry into price-fixing and a belief in a global satanic cabal, as both are "theories about conspiracies." It satisfies **Veracity Independence** perfectly but offers no tools for adjudication.
