answer: |-
  **Scenario**
  Consider a synthetic "Metabolic Loop Organism" composed of two engineered cell types, Alpha and Beta, enclosed in a shared membrane. Alpha cells synthesize the membrane's structural lipids, but only when exposed to a signaling hormone produced exclusively by Beta cells within that enclosed space. Beta cells produce the hormone, but only when anchored to the structural lipids synthesized by Alpha cells. The fact that the membrane exists as a bounded Whole grounds the fact that the cells are functional Parts (since isolation renders them inert), while the fact that the cells are functional Parts grounds the fact that the membrane exists as a bounded Whole (since inert cells produce no structure).

  **Diagnostics**
  1.  **Asymmetric Necessitation:** This diagnostic fails to break the tie. The existence of the functional Whole necessitates the existence of functional Parts (no membrane without lipids), and the existence of functional Parts necessitates the existence of the Whole (no lipid synthesis without the hormonal context the membrane encloses). The necessitation is symmetric.
  2.  **Explanatory Priority:** This diagnostic stalls. To explain why the Organism exists, one cites the functional cells; to explain why the cells are functional, one cites the Organism's bounded context. The explanatory chain loops rather than terminating at a fundamental base.
  3.  **Essence (In Virtue Of):** This diagnostic yields mutual dependence. It is essential to the cells to be embedded in the loop to count as "functional constituents," and essential to the loop to be constituted by these cells to count as an "organism." Neither fact holds strictly in virtue of the other without remainder.

  **Feature Analysis**
  The feature doing the work is **Contextual Individuation**: the parts' status as *functional constituents* rather than *inert matter* is metaphysically dependent on the whole's structural context. If this feature is removed (e.g., if Alpha and Beta cells remain functional in isolation), the interdependence verdict collapses; grounding becomes strictly asymmetric from Parts to Whole, as the Whole then depends on the Parts, but the Parts do not depend on the Whole for their nature.

  The strongest attack from a defender of the strict ordering view is that this scenario conflates **causal maintenance** with **metaphysical grounding**. They will argue that the membrane *causes* the hormonal activation (a diachronic or mechanistic condition), whereas the cells *constitute* the membrane (a synchronic metaphysical relation). On this view, the "reverse" grounding is merely causal dependency disguised as constitution. Honestly, the case struggles to survive this attack if one maintains a rigid distinction between causation and grounding; however, if grounding is understood as capturing the structure of reality in complex systems where function and constitution are inseparable, the case holds.

  **Verdict**
  In this case, fundamentality comes in **degrees** rather than being all-or-nothing. The scenario forces this answer because neither level (Whole or Parts) can be eliminated without destroying the system's identity, yet neither level is fully intelligible without the other. To insist on a strict hierarchy is to arbitrarily privilege one side of a reciprocal ontological bargain, suggesting that in self-maintaining systems, fundamentality is a gradient of functional integration rather than a binary relation.
