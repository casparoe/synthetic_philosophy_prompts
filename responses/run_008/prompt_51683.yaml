  # DECISION TREE: NEWCOMB'S PROBLEM

  **Q1.** Does the fact that the closed box's contents correlate with your choice give you any reason about what to do, or only information about how rich you are about to be?
  │
  ├── **Only information** ──> **Q2.** When you ask what you should do, are you asking how to get the most from this table now, or are you asking after the general policy whose adoption, in others like you facing such predictors, is what made the boxes what they are?
  │    │
  │    ├── **Most from this table now** ──> **[LEAF 1]**
  │    │
  │    └── **General policy** ──> **[LEAF 2]**
  │
  └── **Gives you reason** ──> **Q3.** Is there any sense in which the 'you' whose act is being evaluated is the reasoning itself — the thing that gets copied into simulations and into the predictor's model — rather than the person standing at the table at 5:59?
       │
       ├── **The reasoning itself** ──> **[LEAF 3]**
       │
       └── **The person at the table** ──> **Q4.** Suppose you learned that the predictor reached its prediction by simulating your deliberation in fine grain: does that change what you should do compared to merely knowing it has a perfect track record?
            │
            ├── **Yes (Mechanism matters)** ──> **[LEAF 4]**
            │
            └── **No (Track record suffices)** ──> **[LEAF 5]**

  ***

  **LEAVES**
  1.  **The Two-Boxer:** Turns on the boxes being already fixed; correlation is mere news.
  2.  **The Unoccupied View:** Turns on policy adoption despite the past being fixed and correlation non-causal.
  3.  **The Functionalist One-Boxer:** Turns on identifying with one's reasoning as such (the algorithm).
  4.  **The Inductive One-Boxer:** One-boxes on induction ('it worked every time before'); would two-box if the record were spotty.
  5.  **The Evidential One-Boxer:** Turns on the correlation itself; one-boxes even if the mechanism is unknown.

  **SIDE CASES & DIAGNOSTICS**
  *   **Medical Variant:** Lands on same leaves as Newcomb (Leaf 1: Smoke; Leaves 3–5: Don't Smoke).
  *   **Transparent Variant:** Lands on same leaves as Newcomb (Leaf 1: Take Both; Leaves 3–5: Take One).
  *   **Unoccupied Leaf (2):** Diagnosed as **incoherent**. If the past is fixed and correlation is non-causal, a policy cannot change the box's content.
  *   **Inseparable Pair:** **Leaves 4 & 5**. Both one-box in Newcomb, Medical, and Transparent variants (assuming high reliability); the tree separates them only by counterfactual reliance on record vs. logic.

  Summary: Node 1 does most of the sorting work because it divides the fundamental intuition about whether correlation is actionable evidence or merely informative news about a fixed state.
