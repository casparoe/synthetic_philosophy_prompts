prompt: |-
  my decision theory reading group is doing a thing where everyone writes up their "profile" and the others get to poke holes in it. before I send mine in I want to know if it even hangs together. here's roughly where I stand:

  (1) in the two-urn Ellsberg setup (one urn known 50 red / 50 black, the other some unknown split) I strictly prefer betting on the known urn at equal odds, and I think that preference is fully rational, not a bias to be trained away.
  (2) I endorse the sure-thing principle: if I'd prefer A to B given that E happens and also prefer A to B given that E doesn't happen, I should prefer A to B outright.
  (3) I'm a sharp-credence Bayesian — a rational agent has a precise probability for everything, including the composition of the ambiguous urn, and I think "imprecise credences" is a confused escape hatch.
  (4) rational preference just is maximizing expected utility relative to your credences — not merely a representation theorem, but what makes choice answerable to belief.
  (5) there's obviously a fact of the matter about how many red balls are in the ambiguous urn, and my ignorance of it is ordinary ignorance, handled by ordinary second-order probabilities.
  (6) fair betting odds reveal credences: credence p in X means I'd buy or sell a $1 bet on X at about p, no gap between the two.

  is this a consistent package or not? which of these actually pull against each other, which only look like they do, and if something has to give, what's the cheapest fix and what would it cost me elsewhere? rank the tensions by severity rather than listing them all as equally bad. I'd rather find out from you than infront of the group lol
