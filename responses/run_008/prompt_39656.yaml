      *   *Option E: The "Source Method" (Chew/Eichberger).* Keep sharp credences but weight probabilities based on source reliability.
          *   *Cost:* Violates STP (2).

      *   *Best "Cheap" Fix:* The user needs to realize that (5) does not save (1) if (3) and (4) hold. Second-order probabilities collapse. To keep (1), they *must* violate (2) (STP). But even violating (2) isn't enough if they keep (3) and (4).
