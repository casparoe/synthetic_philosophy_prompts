answer: |-
  This is a classic philosophical puzzle (the problem of future contingents) dressed up in pub logic. Dave is intuitively navigating a position that sits between **Logical Determinism** (all future statements are already true/false) and **Open Futurism** (future statements have no truth value).

  Based on his record, Dave is not using a single logical rule. He is using a **"Causal Settledness" Heuristic**. He assigns truth values based on whether the current state of the world *robustly necessitates* the outcome, distinguishing between stable systems (orbits, social contracts) and unstable/chaotic ones (weather, undecided minds).

  Here is the breakdown of his likely verdicts, the rules he's actually running, and how to catch him out with his sister.

  ### 1. The Predictions

  **Case 1: "Sam will be at the pub on Friday too"**
  *   **Dave's Verdict:** **No truth value.**
  *   **Why:** You noted that for *your* plan to be "True," you had "decided, it's in the calendar, and I've told everyone." Dave treats **public commitment** as a causal lock. It creates a social fact that makes backing out "abnormal."
  *   **The Split:** Sam's decision is private. To Dave, a private intention is functionally identical to the "Admirals manoeuvring" (Sea Battle). Until the intention is externalised (calendar/told), it remains revocable and therefore not a "fact of the matter."
  *   **The Trap:** If Dave says this is *True* (because Sam's brain state is physical), he contradicts his "Sea Battle" verdict (admirals have brain states too). If he says *No Truth Value*, he admits his rule relies on **social verification**, not just physical reality.

  **Case 2: "Last year it was already true that it would rain in Bristol this Friday"**
  *   **Dave's Verdict:** **Not true.**
  *   **Why:** This is the direct counterpoint to the Eclipse case. In 1985, the solar system was a **stable dynamical system**; the variables were sufficient to calculate the 1999 eclipse. The weather is a **chaotic system** (Lorenz attractor). Last year, the atmospheric data was insufficient to determine this Friday's rain.
  *   **The Split:** This highlights the tension you spotted. If he says *True*, he admits the Rain case on Monday should have been True (determinism). If he says *Not True*, he confirms he distinguishes between "Physics that is predictable" and "Physics that is chaotic."

  **Case 3: "At 7:03 next Friday you'll be walking through the pub door"**
  *   **Dave's Verdict:** **No truth value.**
  *   **Why:** Your plan to be at the pub "at 7" is a **macro-intention**. It allows for a margin of error (7:00, 7:05, 7:10). "7:03" is a **micro-event** subject to chaotic variables (a red light, tripping on the curb, a slow pour at the bar).
  *   **The Split:** This tests the **granularity** of his "Settledness." He accepts truth for *plans* (social facts) but not for *precise physical executions* of those plans (which re-introduce the chaos of the "Rain" case).

  ---

  ### 2. The Rules He Is Running

  Dave is operating on three implicit rules that form a hierarchy. When they conflict, the higher rule wins.

  1.  **The Stability Rule (Physics):** Is the system linear and predictable (Eclipse, Sunrise) or chaotic and sensitive to initial conditions (Rain)?
      *   *Stable = True/False.*
      *   *Chaotic = No Truth Value.*
  2.  **The Commitment Rule (Agency):** Is the human action a private whim (Sea Battle, Sam) or a public institution (Your Calendar)?
      *   *Public/Social Fact = True.*
      *   *Private Intention = No Truth Value.*
  3.  **The Granularity Rule (Precision):** Is the statement about a general outcome (At the pub) or a precise physical coordinate (7:03:00)?
      *   *General = True.*
      *   *Precise = No Truth Value.*

  ### 3. Is He Consistent? (The Eclipse vs. Rain Problem)

  You are right to be suspicious. **Metaphysically, he is inconsistent. Pragmatically, he is consistent.**

  *   **The Contradiction:** If the universe is physical, the air molecules in Bristol on Monday are just as "real" as the planets in 1985. If the planets *make* the eclipse statement true, the air molecules *make* the rain statement true (or false). By saying the rain has "no fact of the matter," Dave is smuggling **epistemology** (what we can know/calculate) into **ontology** (what exists). He is treating "Truth" as "Predictability."
  *   **The Defence:** A physicist would argue that "Truth" implies **necessitation**. The planets *necessitate* the eclipse. The air molecules *do not necessitate* the rain because of chaos theory (the butterfly effect). Small, unmeasurable differences now lead to massive differences later. Therefore, the "fact of the matter" literally does not exist yet because the causal chain is not yet converged.
  *   **The Sister's Counter:** Your philosophy sister will likely pounce on this. She will argue Dave is confusing **"It is impossible to know"** with **"There is nothing to know."** She will cite **Aristotle's *De Interpretatione*** (the original Sea Battle argument). Aristotle argued that if "There will be a sea battle" is true now, then the future is necessary and fatalism is true. Dave is trying to avoid fatalism by carving out exceptions for weather and free will, while keeping the comfort of truth for things he can calculate.

  ### 4. How to Win the Dinner Conversation

  When the sister asks Dave about the Eclipse vs. Rain contradiction, here is your play:

  **The "Butterfly" Trap:**
  > "Dave, you said the 1999 eclipse was true in 1985 because of planetary positions. But the N-body problem is technically chaotic over long enough timescales, right? If a comet nudged Jupiter in 1986, the 1999 eclipse changes. So wasn't the 1985 statement *also* lacking a fact of the matter, just with a much longer error margin than the Bristol rain?"

  *   **If he agrees:** He undermines the Eclipse case. Nothing is truly "settled."
  *   **If he disagrees:** He has to define the threshold where "chaos" becomes "determinism." Is it time? Scale? Energy?

  **The "Sam" Trap:**
  > "You said my pub plan is true because I put it in the calendar. But my brain is physical. If my brain state 'decided' is a fact, why isn't Sam's brain state 'decided' also a fact? Are you saying truth depends on whether I *tell* you, rather than whether the universe *is*?"

  *   **If he says it depends on telling:** He admits truth is social/epistemic, not physical.
  *   **If he says it depends on the brain:** He has to concede the Sea Battle admirals also have brain states, so the Sea Battle *does* have a truth value, contradicting his record.

  **Summary for your notes:**
  Dave is a **Pragmatic Compatibilist**. He wants the comfort of determinism for things he can calculate (eclipses) and the comfort of free will for things he can't (rain/battles), using "social commitment" as a bridge to make his own life feel determined. His record is consistent only if you accept that "Truth" means "Robustly Predictable," not "Corresponds to Reality."
