answer: |-
  This is a rich collision of history and philosophy. Running Prohibition through John Dewey's framework—specifically his conception of democracy as inquiry and his 1927 analysis in *The Public and Its Problems*—reveals less about alcohol than about the mechanics of democratic failure and recovery.

  Here is an analysis of Prohibition through Dewey's lens, cutting both ways on whether the episode vindicates or embarrasses his theory, with clear distinctions between his actual text and necessary extrapolation.

  ### 1. Was Prohibition a Deweyan "Experiment"?

  In Dewey's view, democracy is not just a set of institutions but a mode of "associated living" where policies are working hypotheses. They are tested against consequences, and the public adjusts based on what is learned.

  **The Verdict: It was a dogma, not an experiment.**
  For Prohibition to be a Deweyan experiment, the 18th Amendment would have needed to be framed as a tentative measure to observe specific social consequences, with built-in mechanisms for revision based on data. Instead, it was framed as a moral absolute.
  *   **No Falsifiability:** The "Drys" (led by the Anti-Saloon League) did not treat the ban as a hypothesis. They treated it as a revelation. When negative consequences arose (bootlegging, corruption), they did not interpret this as data falsifying the hypothesis; they interpreted it as evidence of insufficient enforcement or moral backsliding.
  *   **Conflicting Metrics:** Deweyan inquiry requires agreed-upon methods of observation. Prohibition had none. Was success measured by gallons of alcohol consumed? Rates of cirrhosis? Arrests? Moral salvation? The "Wets" measured success by liberty and enjoyment; the "Drys" by sobriety and order. Without a shared metric, no collective learning could occur.
  *   **The "Control Group" Problem:** You note the lack of a control group. Dewey was smart enough to know social science isn't lab science. He wouldn't demand a literal control group, but he *would* demand comparative inquiry. Prohibition stifled this. States that tried to enforce it rigorously vs. those that didn't (like Maryland, which refused to pass enforcement laws) offered a natural comparison, but the national rhetoric ignored these variations in favor of moral uniformity.

  **Deweyan Critique:** Prohibition fails the "science" test because it foreclosed the possibility of being wrong. In *The Public and Its Problems*, Dewey argues that social knowledge is only possible through free communication. The moral rigidity of the Prohibitionists shut down the communication necessary for the "experiment" to yield knowledge.

  ### 2. Who Was the Public? (Applying *The Public and Its Problems*)

  Dewey published *The Public and Its Problems* in 1927, right in the middle of the "Noble Experiment." His central thesis is that a **public** forms when people recognize they are affected by the **indirect consequences** of private transactions.

  **Phase 1: The Organized Minority vs. The Scattered Majority (1920)**
  *   **The ASL Public:** The Anti-Saloon League successfully constituted themselves as a public. They recognized the indirect consequences of alcohol (domestic violence, lost labor, public drunkenness) and organized to control them. In Deweyan terms, they were highly effective at "state-making."
  *   **The Eclipsed Public:** The drinkers and the indifferent were, in Dewey's phrase, a "scattered spectator" public. They were affected by the law, but they did not recognize themselves as a political body. They went to speakeasies (private transactions) but didn't initially organize against the law.
  *   **Dewey's Diagnosis:** This fits Dewey's fear perfectly. The "Great Society" (complex, industrialized America) had not yet become a "Great Community" (conscious, communicative). The ASL used modern mass media to simulate a public consensus that didn't exist.

  **Phase 2: The Formation of a New Public (1925–1933)**
  *   **New Indirect Consequences:** Prohibition created *new* indirect consequences that the public could not ignore: the rise of organized crime, police corruption, and the normalization of lawbreaking.
  *   **Public Crystallization:** By the late 20s, the "Wet" public began to form. They were no longer just private drinkers; they were citizens concerned with the *rule of law* and *civil liberties*. The indirect consequence of the policy (crime) became more damaging than the indirect consequence of the problem (drunkenness).
  *   **Repeal as Learning?** Here is the crux. Did the 21st Amendment represent democratic learning?
      *   *Yes:* The public recognized the indirect consequences of the ban were worse than the alcohol itself. They organized, voted, and revised the hypothesis.
      *   *No:* As you noted, repeal was driven by the Depression (tax revenue, jobs). If the motivation was purely economic desperation rather than a moral/social re-evaluation, Dewey might call this **reactive adaptation** rather than **intelligent action**.

  ### 3. Illumination vs. Embarrassment: Does this Vindicate Dewey?

  This is where the analysis must cut both ways.

  **The Vindication (The System Self-Corrected)**
  Dewey was an optimist about the long-run capacity of democracy to learn. Prohibition supports this.
  *   **Feedback Loops Worked:** Despite the rigidity of the amendment, the pressure of consequences eventually forced a constitutional revision. This is rare in history.
  *   **Public Formation:** The "eclipsed public" eventually found its voice. The Wickersham Commission (1931), appointed by Hoover to investigate law enforcement, essentially admitted the policy failed. This is the "observation" phase of Dewey's scientific democracy finally kicking in.
  *   **Conclusion:** The 13-year lag shows the friction of a large democracy, not a failure of the method. The public *did* eventually recognize the indirect consequences and act.

  **The Embarrassment (The Cost of Inquiry)**
  However, Prohibition highlights the dark side of Dewey's meliorism.
  *   **Non-Consensual Subjects:** In a lab, subjects consent. In Prohibition, the "Dry" minority (highly organized) imposed an experiment on the "Wet" majority (disorganized). Dewey emphasizes *shared* interests. Prohibition was a case of one segment of the public hijacking the state to regulate the private transactions of another without their buy-in.
  *   **The Feedback was Violence:** Dewey imagines feedback coming through discourse, journalism, and voting. In Prohibition, the primary feedback mechanism was violence (St. Valentine's Day Massacre) and systemic corruption. The "data" was written in blood. For a philosopher who prized education and communication, relying on organized crime to prove a policy wrong is a damning indictment of the system's ability to communicate *before* crisis.
  *   **Dewey's Silence:** Dewey does not offer a calculus for "how much damage is acceptable during the learning process." He assumes that free inquiry minimizes harm. Prohibition suggests that democratic inquiry can be slow enough to allow criminal empires to entrench themselves. Dewey is silent on the ethics of "policy errors" that empower violent actors.

  ### 4. Would Dewey Have Opposed Prohibition?

  Here we must distinguish between what Dewey wrote and what we can infer.

  **[Textual Evidence]**
  Dewey never wrote a dedicated tract titled "Against Prohibition." However, in *The Public and Its Problems* (1927), he writes extensively about the difficulty of the public organizing itself. He critiques the idea that law can simply impose morality.
  *   He argues that social control must come from **shared understanding**, not external coercion. "Law and government... are not the cause of the public... they are its organs." If the public is not truly formed around an issue, the law is premature.
  *   In *Human Nature and Conduct* (1922), he argues that habits (like drinking) are changed by reconstructing the environment and social conditions, not by fiat.

  **[Extrapolation]**
  Based on his broader philosophy, Dewey likely would have opposed the **18th Amendment specifically**, though perhaps not temperance efforts generally.
  *   **Why:** He viewed the Constitution as a tool for facilitating inquiry, not freezing moral judgments in place. Amending the Constitution to ban a specific habit removes that habit from the realm of legislative experimentation (where it could be tweaked/taxed/regulated) and places it in the realm of moral dogma.
  *   **The Method vs. The Goal:** Dewey might have agreed that alcohol caused social harm (indirect consequences affecting the public). But he would have argued that the *method* (constitutional ban) prevented the public from learning. It stopped the inquiry. He would have favored local option laws or taxation—methods that allow for comparison and revision—over a national ban.
  *   **The Progressive Context:** Many Progressives supported Prohibition as "social hygiene." Dewey was a Progressive, but he was the *philosophical* wing, not the *moralistic* wing. His commitment to "intelligence" over "sentiment" suggests he would have viewed the Anti-Saloon League's tactics (emotional propaganda) as anti-democratic.

  ### 5. Summary: The Deweyan Balance Sheet

  If we run Prohibition through Dewey:

  1.  **As Science:** It was bad science. It lacked falsifiability, had conflicting metrics, and the proponents ignored negative data until it became catastrophic.
  2.  **As Public Formation:** It confirms Dewey's theory that publics are unstable. The "Dry" public formed first because they were motivated by perceived indirect harms. The "Wet" public formed later, triggered by the *new* indirect harms (crime).
  3.  **As Democratic Learning:** It vindicates the *capacity* for self-correction (repeal happened) but embarrasses the *process* (it took violence and economic collapse to trigger the correction).

  **Where Dewey is Silent:**
  Dewey assumes that if you free up communication, the public will act intelligently. Prohibition suggests that even with free communication (the 1920s had a booming press), the public can be held hostage by a highly organized minority (ASL) until the consequences become physically unavoidable. Dewey underestimates the power of **asymmetric organization**. The "public" doesn't just need to recognize problems; it needs to overcome the structural advantage of single-issue zealots.

  **Final Judgment:**
  Prohibition is a cautionary tale for Deweyans. It shows that "democracy as inquiry" requires more than just time; it requires a culture that treats policies as fallible. The repeal in 1933 was a victory for the Deweyan public, but only after the system suffered a trauma that a more rigorous initial inquiry might have prevented. Dewey would likely say: *The correction proves the method works, but the cost proves we failed to educate the public before passing the law.*
