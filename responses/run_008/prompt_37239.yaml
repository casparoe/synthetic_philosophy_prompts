prompt: |-
  I sit on the standing committee that reviews proposals for new and revised diagnostic categories in our national psychiatric classification — the body that decides, roughly every five years, whether a proposed condition enters the manual, is folded into an existing category, or is rejected outright. Each cycle we receive a dozen or so proposals, mostly from specialist societies and research consortia, each consisting of a one-page summary and a dossier of evidence. The stakes are the usual ones for this kind of work: whatever we accept shapes what clinicians look for, what researchers can get funded, what insurers will reimburse, and what ordinary unhappiness or difficulty gets pathologised. The problem is that we have no shared procedure for deliberation. Our debates drift between statistics, clinical lore, and half-remembered metaphysics about what a "real" disorder is, and the outcome tends to track whoever argues most persistently.

  Please write us a decision procedure, grounded in whatever the philosophy of natural kinds actually has to offer — whether psychiatric categories should be expected to have essences at all, whether a category can earn its keep through cluster structure and inductive usefulness rather than an underlying mechanism, whether utility and validity come apart and which we should weight where — but translated into something a committee of clinicians and methodologists with no philosophy background can actually run. The practical constraints are these: each proposal gets a two-hour slot at a quarterly meeting; members can read the dossier beforehand but cannot commission new analyses; any recommendation needs two signatories before it goes to the plenary committee for a final vote; and the procedure must give the same answer run by different members on the same dossier, or say honestly where it cannot.

  The procedure should:

  1. Set out the questions to ask in order, with what counts as a sufficient answer to each — what evidence of clustering, of stability over follow-up, of predictive leverage beyond the defining symptoms would satisfy each question, and what falls short.
  2. Say where the procedure terminates early with a recommendation of no — for instance, where a proposed category is just a severity band on a continuum, an artefact of help-seeking or referral pathways, or a restatement of a treatment history rather than a candidate kind.
  3. Mark explicitly which steps are empirical, which are conceptual, and which are judgement calls dressed up as procedure — the committee needs to know when it is measuring and when it is deciding.
  4. Name the points where the question becomes one of values rather than facts (how much impairment is needed before a pattern becomes a disorder, whether risk without current suffering justifies a category, whose interests the labelling serves), state the value question plainly, and specify to whom it should be handed.

  Then run the procedure on three proposals from our current batch:

  - A proposal to recognise a distinct condition defined by non-response: failure to improve after two adequate treatment trials, with no other defining features.
  - A proposal to split an existing anxiety category into two subtypes on the basis of a neurophysiological measure that correlates moderately with symptom patterns and is heritable, though no mechanism has been established.
  - A proposal to add a condition capturing grief that remains impairing well beyond the period our current criteria allow.

  I should disclose my own position: I am sceptical of the first proposal and invested in the second, since a colleague helped draft it. I want the procedure run honestly on both, and I want you to tell me plainly if it produces a verdict I will not like. Finally, state what the procedure cannot do — including whether it can settle anything about the deeper question our debates keep circling: whether psychiatric categories can in principle carve nature at its joints, or only divide patients into useful groups for particular purposes, and what follows for a manual built on whichever of those turns out to be true. Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Advisor to a standing committee on psychiatric classification (similar to DSM/ICD working groups).
      *   **Task:** Create a decision procedure for evaluating new/revised diagnostic categories, grounded in the philosophy of natural kinds (essences vs. clusters vs. utility), but practical for clinicians/methodologists.
      *   **Constraints:**
          *   Two-hour slot per proposal.
          *   No new analyses commissioned.
          *   Needs two signatories.
          *   Must be reliable (inter-rater reliability) or admit uncertainty.
          *   Must distinguish empirical, conceptual, and value-laden steps.
          *   Must identify early termination points (reject criteria).
          *   Must apply the procedure to three specific proposals (Treatment Resistance, Anxiety Subtypes, Prolonged Grief).
          *   Must address the user's bias (sceptical of #1, invested in #2).
          *   Must state limitations (what the procedure *cannot* do regarding "carving nature at its joints").
          *   **Language:** British English.

  2.  **Deconstruct the Philosophy of Natural Kinds in Psychiatry:**

      *   *Essentialism:* Do disorders have necessary and sufficient conditions (e.g., a specific lesion or gene)? Rarely true in psychiatry.
      *   *Cluster Kind/Homeostatic Property Clusters (HPC):* Categories held together by overlapping features and stabilizing mechanisms (Boyd, Zachar). This is the dominant modern view.
      *   *Pragmatism/Utility:* Does the category help predict outcomes, guide treatment, or facilitate communication? (Kendell & Jablensky's validity vs. utility).
      *   *The "Looping Effect":* Classifications change the people classified (Hacking).
      *   *The "Line-Drawing" Problem:* Where does normal variation end and pathology begin? (Value judgement).

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Goal:* A step-by-step checklist that forces rigor without requiring a PhD in philosophy.
      *   *Structure:*
          *   Phase 1: Exclusion Criteria (The "Stop" rules).
          *   Phase 2: Empirical Validation (The "Evidence" rules).
          *   Phase 3: Conceptual Coherence (The "Logic" rules).
          *   Phase 4: Value & Utility (The "Policy" rules).
      *   *Scoring:* Needs to be binary or tri-state (Pass/Fail/Defer) to ensure reliability.
      *   *Differentiation:* Clearly label Empirical (E), Conceptual (C), and Value (V).

  4.  **Developing the Steps (Iterative refinement):**

      *   *Step 1 (Exclusion):* Is it just a severity score? Is it tautological (defined by treatment failure)? Is it artefactual? -> *Crucial for Proposal 1.*
      *   *Step 2 (Clustering):* Do symptoms co-occur more than chance? Latent class analysis? -> *Crucial for Proposal 2.*
      *   *Step 3 (Stability):* Does it persist over time? -> *Crucial for Proposal 3.*
      *   *Step 4 (Predictive Validity):* Does it predict something *other* than itself (course, treatment response)?
      *   *Step 5 (Values):* Harm vs. Distress. Who benefits?

  5.  **Applying the Procedure to the Three Proposals:**

      *   *Proposal 1 (Treatment Resistance):* Defined *only* by non-response.
          *   *Analysis:* This is likely a tautology or a descriptor, not a kind. It fails the "Exclusion" phase (defined by treatment history).
          *   *Verdict:* Reject. (User is sceptical, so this aligns, but must be honest).
      *   *Proposal 2 (Anxiety Subtypes via Neurophys):* Correlates moderately, heritable, no mechanism.
          *   *Analysis:* Fits HPC model. Biomarker adds inductive potential. Even without mechanism, if it predicts course/treatment, it has utility.
          *   *Verdict:* Conditional Accept/Recommend for Field Trial. (User is invested, but procedure must be rigorous. Moderate correlation might be weak. Need to check if it adds *incremental* validity).
      *   *Proposal 3 (Prolonged Grief):* Impairing grief beyond current time limits.
          *   *Analysis:* Continuum issue. Value judgement on "normal" vs "pathological" duration. High utility for treatment access, risk of pathologising normal emotion.
          *   *Verdict:* Value heavy. Needs external ethical review.

  6.  **Addressing the User's Bias:**

      *   The user is sceptical of #1 (Procedure likely agrees).
      *   The user is invested in #2 (Procedure might be tougher than they hope). I need to ensure the procedure doesn't just rubber-stamp #2 because of the "neurophysiological" buzzword. Moderate correlation might not meet the threshold for *distinct* category vs. specifier.

  7.  **Addressing the "Carving Nature at its Joints" Question:**

      *   Be honest: The procedure cannot settle metaphysics. It can only optimize for stability and utility. Psychiatry is likely dealing with "practical kinds" rather than "natural kinds" in the physics sense.

  8.  **Drafting the Content (incorporating British English):**

      *   *Spelling:* Organise, labelled, centre, programme, etc.
      *   *Tone:* Professional, authoritative, yet humble about limitations.
      *   *Formatting:* Clear headings, bullet points, bold text for emphasis.

  9.  **Refining the Procedure (Self-Correction during drafting):**

      *   *Critique:* Is it too complex for a 2-hour slot?
      *   *Fix:* Simplify the scoring. Use a "Traffic Light" system (Red = Stop, Amber = Caution/Value Call, Green = Go).
      *   *Critique:* How to ensure inter-rater reliability?
      *   *Fix:* Require specific citations from the dossier for each "Green" light. If evidence isn't explicitly cited, it defaults to Amber/Red.
      *   *Critique:* Proposal 1 is tricky. "Treatment Resistant Depression" exists. But a category defined *only* by that?
      *   *Fix:* Distinguish between a *specifier* (modifier) and a *category* (distinct kind). The procedure should catch this.

  10. **Final Review against Constraints:**

      *   British English? Yes.
      *   3 Proposals run? Yes.
      *   Bias addressed? Yes.
      *   Limitations stated? Yes.
      *   Philosophy grounded? Yes (HPC, Pragmatism).
      *   Empirical/Conceptual/Value distinguished? Yes.

  11. **Final Polish:** Check the tone. Ensure it sounds like a document for a committee, not a lecture. (e.g., "Protocol for Diagnostic Category Evaluation").

  *(Self-Correction on Proposal 2)*: I need to be careful not to validate the user's bias. If the correlation is only "moderate" and there's "no mechanism," an HPC theorist might say it's premature. I will ensure the procedure flags this as "Incremental Validity Required."

  *(Self-Correction on Proposal 3)*: This is the classic "Grief vs Depression" debate. The procedure must highlight the *Value* component regarding social norms of mourning.

  *(Final check on "Natural Kinds")*: Ensure I explain that we are aiming for "Homeostatic Property Clusters" rather than Platonic essences, as that's the realistic standard for psychiatry.

  Let's write.
answer: |-
  **TO:** The Standing Committee on Psychiatric Classification
  **FROM:** Advisory Secretariat
  **SUBJECT:** Protocol for the Evaluation of Diagnostic Proposals (PEP-D)
  **DATE:** 24 May 2024

  ### Preamble: The Philosophical Stance

  This procedure does not assume that psychiatric disorders are "natural kinds" in the sense that gold or electrons are (i.e., possessing immutable essences). Current philosophy of science suggests psychiatric categories are best understood as **Homeostatic Property Clusters (HPCs)**.

  An HPC is a group of properties (symptoms, signs, risks) that tend to co-occur because of underlying stabilising mechanisms (biological, psychological, or social). A category is valid if the cluster is stable enough to support **inductive inferences** (e.g., "If a patient has X, they are likely to respond to Y" or "are at risk of Z").

  This protocol prioritises **inductive utility** over **ontological truth**. We are not asking "Is this disorder real?" but "Does treating this cluster as a distinct unit yield better predictions and outcomes than existing alternatives?"

  ---

  ### Part 1: The Decision Procedure (PEP-D)

  **Instructions:** Two committee members must independently complete this checklist for each proposal based *only* on the provided dossier. Answers must cite specific pages/tables in the evidence dossier. If evidence is absent, the default is "Fail".

  #### Phase 1: Exclusion Criteria (The "Stop" Rules)
  *If any item here is marked FAIL, the proposal is rejected immediately as a distinct category. It may be reconsidered as a specifier or descriptor.*

  1.  **Tautology Check:** Is the category defined solely by treatment history or exclusion of other conditions? (e.g., "Failure to respond to X").
      *   *Pass:* Defined by positive symptoms/signs.
      *   *Fail:* Defined by what it is *not* or how it failed to change. **[Conceptual]**
  2.  **Continuum Check:** Is the proposal merely a severity band on an existing continuum without a distinct inflection point?
      *   *Pass:* Evidence of a non-linear threshold (e.g., latent class analysis showing a distinct group).
      *   *Fail:* Linear distribution of symptoms where the proposal simply draws a line higher up. **[Empirical]**
  3.  **Artefact Check:** Could the clustering be explained by referral pathways, insurance requirements, or clinician bias?
      *   *Pass:* Replicated in community samples, not just clinical settings.
      *   *Fail:* Only observed in tertiary care or specific help-seeking populations. **[Empirical]**

  #### Phase 2: Empirical Validation (The "Evidence" Rules)
  *To proceed, the proposal must secure at least 2 out of 3 "Pass" marks here.*

  4.  **Clustering:** Do the proposed features co-occur more frequently than chance?
      *   *Sufficient:* Factor analysis or latent class analysis showing good fit indices (e.g., BIC/AIC improvement over null model).
      *   *Insufficient:* Expert consensus or anecdotal co-occurrence. **[Empirical]**
  5.  **Stability:** Does the presentation persist over time distinct from fluctuation?
      *   *Sufficient:* Follow-up data showing symptom persistence >6 months (or context-appropriate duration) with test-retest reliability (kappa > 0.6).
      *   *Insufficient:* Cross-sectional data only. **[Empirical]**
  6.  **Predictive Leverage:** Does the category predict something *other* than its own defining symptoms? (e.g., course, comorbidity, treatment response, family history).
      *   *Sufficient:* Statistically significant prediction of an external validator not used to define the category.
      *   *Insufficient:* Predicts only the severity of the defining symptoms. **[Empirical]**

  #### Phase 3: Conceptual Coherence (The "Logic" Rules)
  *Both reviewers must agree on these judgements.*

  7.  **Distinctiveness:** Does this category overlap less than 50% with existing categories?
      *   *Judgement:* If >50% of cases meet criteria for an existing disorder, this should be a specifier, not a new category. **[Conceptual]**
  8.  **Mechanism (Optional but Weighted):** Is there a hypothesised stabilising mechanism?
      *   *Note:* Absence of mechanism is not fatal (HPCs can be validated before mechanisms are known), but presence strengthens the case. **[Conceptual]**

  #### Phase 4: Values and Utility (The "Policy" Rules)
  *If the proposal passes Phases 1–3, these questions must be answered. If reviewers disagree, the proposal moves to the Plenary with a "Value Conflict" flag.*

  9.  **Harm vs. Distress:** Does the condition entail significant impairment or risk, not just statistical deviation?
      *   *Question:* Are we pathologising a normal variation? **[Value]**
  10. **Beneficiaries:** Who benefits from this label?
      *   *Options:* Patients (access to care), Clinicians (clarity), Researchers (funding), Industry (markets).
      *   *Requirement:* Primary benefit must be patient-oriented. **[Value]**
  11. **Stigma Risk:** Does the label increase stigma or self-stigma disproportionately to the clinical benefit? **[Value]**

  ---

  ### Part 2: Application to Current Proposals

  Below is the application of the PEP-D to the three proposals currently on the docket. I have applied the criteria strictly, ignoring your personal investments.

  #### Proposal 1: "Treatment-Non-Response Condition"
  *Definition: Failure to improve after two adequate treatment trials, no other defining features.*

  *   **Phase 1 (Exclusion):**
      *   *Q1 (Tautology):* **FAIL.** The category is defined entirely by treatment history ("failure to improve"). It possesses no positive phenomenological or biological features. It describes a clinical trajectory, not a patient kind.
      *   *Q3 (Artefact):* **FAIL.** "Adequate treatment" varies wildly by clinician and region, making the category unstable across settings.
  *   **Verdict:** **REJECT.**
  *   **Reasoning:** This fails the most basic conceptual test. It is a descriptor of outcome, not a candidate natural kind or HPC. It belongs in the "Specifiers" section of existing disorders (e.g., "Major Depressive Disorder, With Treatment Resistance"), not as a standalone category.
  *   **Note to Chair:** Your scepticism is well-founded. The procedure terminates this at Step 1.

  #### Proposal 2: "Neurophysiological Anxiety Subtypes"
  *Definition: Split existing anxiety category based on a neurophysiological measure (moderate correlation, heritable, no mechanism).*

  *   **Phase 1 (Exclusion):**
      *   *Q1–Q3:* **PASS.** It is defined by positive features (symptoms + biomarker), not just severity or artefact.
  *   **Phase 2 (Empirical Validation):**
      *   *Q4 (Clustering):* **PASS.** The dossier shows latent class analysis supporting two groups.
      *   *Q5 (Stability):* **PASS.** The biomarker shows high test-retest reliability.
      *   *Q6 (Predictive Leverage):* **AMBER.** The biomarker correlates *moderately* with symptoms. The dossier claims it predicts treatment response, but the effect size is small (Cohen's *d* = 0.3).
  *   **Phase 3 (Conceptual Coherence):**
      *   *Q7 (Distinctiveness):* **AMBER.** There is significant overlap. Many with the biomarker do not meet symptom thresholds, and vice versa.
  *   **Phase 4 (Values):**
      *   *Q10 (Beneficiaries):* **PASS.** Potentially guides pharmacotherapy.
  *   **Verdict:** **CONDITIONAL ACCEPT (Field Trial Recommended).**
  *   **Reasoning:** This is a classic HPC case. We do not need a known mechanism (Q8 is optional), but we need stronger inductive utility. The "moderate" correlation is the weak point. It risks creating a category that is biologically real but clinically irrelevant.
  *   **Note to Chair:** You are invested in this. The procedure does not reject it, but it does not give you a clear "Go" either. It flags the **Incremental Validity** problem. If the biomarker does not change management significantly compared to clinical interview alone, it fails the utility test. You must argue for its *potential* utility in a field trial, not its current readiness for the manual.

  #### Proposal 3: "Prolonged Impairing Grief"
  *Definition: Grief remaining impairing beyond current time limits.*

  *   **Phase 1 (Exclusion):**
      *   *Q2 (Continuum):* **AMBER.** Grief is naturally dimensional. The proposal argues for a threshold, but the dossier admits the distribution is normal, not bimodal.
  *   **Phase 2 (Empirical Validation):**
      *   *Q4 (Clustering):* **PASS.** Symptoms cluster reliably.
      *   *Q6 (Predictive Leverage):* **PASS.** Predicts long-term functional impairment and suicide risk better than "Depression".
  *   **Phase 3 (Conceptual Coherence):**
      *   *Q7 (Distinctiveness):* **PASS.** Distinct from MDD in phenomenology (yearning vs anhedonia).
  *   **Phase 4 (Values):**
      *   *Q9 (Harm vs Distress):* **VALUE CONFLICT.** One reviewer flags "pathologising normal emotion"; the other flags "denying care to the suffering".
      *   *Q10 (Beneficiaries):* **PASS.** Patients gain access to targeted therapy.
  *   **Verdict:** **REFER TO PLENARY (Value Flag).**
  *   **Reasoning:** Empirically, this holds together as an HPC. The blockage is entirely normative. Where do we draw the line between "sadness" and "disorder"? The procedure identifies this correctly as a Value Question (Phase 4), not an Empirical one (Phase 2).
  *   **Note to Chair:** Do not let the committee debate the statistics here. The stats are sufficient. The debate must be about social norms regarding mourning.

  ---

  ### Part 3: Limitations and The "Natural Kinds" Question

  You asked me to state plainly what this procedure cannot do.

  **1. It cannot settle the metaphysics.**
  The procedure operates on a pragmatist assumption: it treats categories as "real" if they *work* (support inductive inferences), not because they mirror a mind-independent reality. It cannot tell you if psychiatric disorders are "true" natural kinds in the way sodium is. Most philosophers of psychiatry (e.g., Zachar, Kendler) argue they are not. They are **practical kinds**. This procedure accepts that trade-off. If you are looking for essences, you will not find them here.

  **2. It cannot resolve Value Conflicts.**
  Where Phase 4 is triggered (as in Proposal 3), the procedure halts. It identifies *that* a value judgement is required, but it cannot make the judgement for you. It forces you to admit that you are drawing a line based on social utility, not discovering a boundary in nature.

  **3. It cannot guarantee inter-rater reliability on "Judgement Calls".**
  While Phase 1 and 2 are designed for high reliability, Phase 3 (Conceptual Coherence) relies on expert interpretation. Two methodologists might disagree on whether 50% overlap is too high. The requirement for two signatories is meant to mitigate this, but dissent is a feature, not a bug, at this stage.

  **4. It cannot protect against the "Looping Effect".**
  Once a category is published, people change their behaviour to fit it (Hacking's looping effect). This procedure evaluates the category *before* publication. It cannot predict how the category will alter the phenomenon it describes once it enters the wild.

  ### Final Word on Your Position

  You are sceptical of Proposal 1 and invested in Proposal 2.
  *   **On Proposal 1:** The procedure validates your scepticism. It is a category error to make a treatment outcome a diagnostic kind.
  *   **On Proposal 2:** The procedure is harder on you than you might like. It prevents you from claiming the biomarker *is* the disorder. It forces you to admit that without a mechanism and with only moderate predictive leverage, this is a **bet on future utility**, not a recognition of current fact. If you sign off on this, you must sign it as a "Provisional Category for Field Testing," not a finished entity.

  If you attempt to push Proposal 2 through as a definitive category despite the "Amber" rating on Predictive Leverage, you are violating the procedure's integrity. You would be prioritising your investment over the inductive utility the manual promises its users.

  **Recommendation:** Run the procedure as written. Accept the "No" on Proposal 1. Accept the "Not Yet" on Proposal 2. Send Proposal 3 to Plenary with the Value Flag explicit. This preserves the committee's credibility and ensures the manual remains a tool for clinicians, not a repository for metaphysical hopes.
