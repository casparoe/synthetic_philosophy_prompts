prompt: |-
  I teach an introductory ethics course for second-year students with no philosophy background beyond a semester of applied topics. Next week I have a single seventy-five-minute seminar on the procreation asymmetry — roughly, the thought that creating a person whose life would go badly is seriously wrong in a way that creating a person whose life would go well is not correspondingly required, so that the badness and the goodness of new lives cannot just be weighed against each other on a single scale. Plan the session for me rather than explaining the asymmetry itself. In particular, tell me: (1) the order in which the pieces must be introduced and why — especially whether the distinction between making existing people better off and bringing into existence people whose lives go well has to be secured before the asymmetry is even stated, and whether my co-teacher is right that the non-identity problem should open the session or whether it should be cut entirely; (2) what the carrying example should be — I am tempted to use a municipal government choosing between subsidizing fertility treatment for involuntarily childless couples and expanding a pediatric ward, since both options are sympathetic and neither side is a cartoon, but assess whether that case actually has the right features or whether it smuggles in confounds (the beneficiaries on one side exist and on the other do not) that will confuse more than they carry, and propose a replacement if so; (3) the misconceptions students will predictably form and where in the sequence each should be headed off — my own guesses are that the asymmetry will be heard as flat antinatalism, as the claim that additional happy lives are not good at all, or as simply total utilitarianism running in reverse, and I would like to know whether to expect others; (4) one question I can pose at the end that would show me whether they can apply the asymmetry to a case they have not seen, rather than merely nodding along to it; and (5) what I should openly refuse to bring in at this level — the repugnant conclusion, average versus total views, anything else — and how to say so in one honest sentence without making the students feel shortchanged. Bear in mind that the students arrive directly from a unit on Singer's famine argument, so their working picture of morality is entirely about duties to people who already exist; I want to know whether that inheritance is scaffolding to build on or a habit I have to break in the first ten minutes.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 2nd-year students, intro ethics, no philosophy background beyond one semester of applied topics (just finished Singer on famine).
      *   **Topic:** Procreation Asymmetry (Parfit/Narveson/etc.). Core idea: Harm by creating a miserable life is wrong; Benefit by creating a happy life is not obligatory (or not correspondingly good).
      *   **Time:** 75 minutes (single seminar).
      *   **Constraints:** Do *not* explain the asymmetry itself (assume I know it). Focus on pedagogy: order of operations, examples, misconceptions, assessment question, exclusions.
      *   **Specific Questions to Answer:**
          1.  Order of introduction (Existing vs. New people distinction first? Non-Identity Problem start or cut?).
          2.  Carrying Example (Municipal subsidy vs. pediatric ward? Assess confounds. Propose replacement if needed).
          3.  Predictable Misconceptions (Antinatalism? Happy lives not good? Reverse total utilitarianism? Others?).
          4.  Exit Ticket/Assessment Question (Application to new case).
          5.  Exclusions (Repugnant Conclusion, Average vs. Total, etc.) + How to frame the exclusion honestly.
          6.  Context: Students coming off Singer (duties to existing people). Is this scaffolding or a habit to break?

  2.  **Deconstruct the Pedagogical Challenges:**
      *   *The Singer Hangover:* Students think morality = minimizing suffering/maximizing well-being for *existing* sentient beings. The asymmetry challenges the "maximizing" part when it comes to *new* beings.
      *   *The Non-Identity Problem (NIP):* This is logically prior to the asymmetry in many academic treatments (Parfit), but pedagogically dense. If the goal is the *asymmetry* (the intuitive pull), NIP might distract. However, NIP explains *why* we can't just use standard harm/benefit frameworks.
      *   *The Example:* The user's proposed example (Fertility vs. Pediatric Ward) is a resource allocation problem. It conflates "helping existing sick kids" vs. "creating new kids." This triggers the "Existing vs. New" distinction immediately, which is good, but it also triggers "Resource Scarcity," which might muddy the waters (is it wrong to create kids because it costs money, or because of the asymmetry?).
      *   *Misconceptions:* "So don't have kids?" (Antinatalism). "So happy lives don't matter?" (Nihilism). "Isn't this just Utilitarianism?" (Confusion about aggregation).
      *   *Time:* 75 minutes is tight for this level of abstraction.

  3.  **Drafting the Responses (Iterative Process):**

      *   **(1) Order of Operations:**
          *   *Singer Context:* Students think duties are to existing people. This is actually *good* scaffolding for the "Harm" side of the asymmetry (don't make miserable kids), but *bad* for the "Benefit" side (why aren't we obliged to make happy kids?).
          *   *NIP:* Should it open? No. NIP is technical. It explains *why* standard harm principles fail for future people. But the Asymmetry is an *intuition* pump. Start with the intuition, then use the distinction to refine it.
          *   *Distinction:* The "Existing vs. New" distinction is crucial. You can't explain the asymmetry without it.
          *   *Decision:* Start with the intuition (Case), then distinguish the categories (Existing vs. New), *then* mention NIP lightly if needed to explain why "harm" is tricky, but keep focus on the Asymmetry. Actually, for a 75-min intro, cut deep NIP. It consumes too much time. Focus on the Asymmetry intuition directly.
          *   *Refinement:* The co-teacher suggests opening with NIP. I advise against it. NIP is about *which* person exists. Asymmetry is about *whether* the state of affairs is better/worse. Keep them separate.
          *   *Singer:* Use Singer as the foil. "Singer says save the existing child. Does he say make a new child?"

      *   **(2) The Carrying Example:**
          *   *User's Idea:* Fertility subsidy vs. Pediatric ward.
          *   *Critique:* It's a budget constraint case. Students will argue "Money is finite." They will miss the moral asymmetry and focus on triage. Also, the "existing" kids are suffering (medical need), the "new" kids are just... not existing yet. It stacks the deck too much toward the existing kids.
          *   *Better Option:* Needs to isolate the *creation* aspect without resource scarcity confounds.
          *   *Classic:* The "Childfree Couple" vs. "The Miserable Child."
          *   *Proposed Replacement:* A two-case structure.
              *   Case A: A couple knows their child will have a painful, short life (e.g., Tay-Sachs). Is it wrong to conceive? (Intuition: Yes).
              *   Case B: A couple knows their child will be very happy, but they prefer traveling. Are they obliged to conceive? (Intuition: No).
              *   *Why:* This isolates the moral valence without budget constraints.
          *   *Wait, keep the policy angle?* If the course is applied, maybe keep the policy angle but strip the budget.
          *   *Decision:* The user's example is too confounded by scarcity. Use the "Couple" cases for the core logic, *then* maybe apply back to policy if time permits. But for *teaching the concept*, the individual case is clearer. Let's recommend the "Couple" cases but acknowledge the policy interest. Actually, a "Climate Change/Carbon Baby" case is modern and resonant.
          *   *Revised Decision:* Stick to the "Couple" intuition pumps for clarity. The municipal example smuggles in "duty to existing taxpayers" vs "duty to potential citizens." Too messy. Use the "Happy Child vs. Sad Child" conception cases.

      *   **(3) Misconceptions:**
          *   *Antinatalism:* "So having kids is always wrong?" (No, just not *required* for happiness).
          *   *Value of Life:* "So happy lives have zero value?" (No, they are good *for the person*, just not a moral *demand* on the creator).
          *   *Utilitarianism:* "Isn't this just math?" (No, it breaks the math).
          *   *Singer Hangover:* "But suffering is bad!" (Yes, but existence is a precondition).
          *   *Timing:* Head off Antinatalism immediately after stating the "No duty to create" clause. Head off "Zero Value" when discussing the "Good" side.

      *   **(4) Assessment Question:**
          *   Needs to be a new case.
          *   *Idea:* Genetic editing. Or AI creation. Or Colonizing Mars.
          *   *Selection:* Mars Colony. Creating a society vs. fixing Earth. Or simpler: A drug that ensures happy children but costs money.
          *   *Best:* The "Time Traveler" or "Genetic Selection" case. Let's go with Genetic Selection. "You can select for a happy child or a merely 'okay' child. Are you obliged to pick the happy one?" (Tests the asymmetry: is it wrong to pick the miserable one? Yes. Is it required to pick the super happy one? Debatable, but tests the 'obligation' boundary).
          *   *Actually, simpler:* "The Last People." If humanity is ending, are the last two people obliged to have a child to restart it if that child would be happy? (Tests the duty to create).

      *   **(5) Exclusions:**
          *   *Repugnant Conclusion:* Too far down the rabbit hole.
          *   *Average vs. Total:* Too technical.
          *   *Non-Identity Problem:* As decided in (1), keep it minimal or cut.
          *   *Framing:* "We are mapping the boundary of this specific intuition, not solving population ethics entirely."

      *   **(6) Singer Scaffolding:**
          *   It's a habit to break. Singer implies impartial aggregation. Asymmetry implies a structural difference between existing and potential.
          *   *Strategy:* Acknowledge Singer, then show where the map breaks.

  4.  **Refining the Plan (Self-Correction/Polishing):**
      *   *Check Co-Teacher's NIP idea:* If I cut NIP entirely, do I lose the logical grounding? For 2nd years, yes, it's safer to cut. NIP requires understanding "same number quality claims." Asymmetry is about "presence vs. absence of pain/good." Keep them distinct.
      *   *Check the Example:* The Municipal example is *very* tempting because it sounds like "Applied Ethics." But it fails because it pits Duty to Existing (strong) vs. Duty to Create (weak). Students will just say "Existing people come first." That confirms the asymmetry but for the *wrong reason* (priority to existing vs. asymmetry of creation). I need an example where the "existing" people aren't in the frame. The "Couple" example is best.
      *   *Check the Singer Link:* Students think "Suffering = Bad, Happiness = Good, Maximize Good." Asymmetry says "Suffering = Bad (even if created), Happiness = Good (but not obligatory to create)." The break is on the *obligation* side.

  5.  **Finalizing the Output Structure:**
      *   Follow the user's 5 points exactly.
      *   Tone: Professional, pedagogical, respectful of the constraints.
      *   Ensure the "Honest Sentence" for exclusions is punchy.

  6.  **Writing the Content:** (Mental Draft)
      *   *Order:* Start with intuition (Case A/B), then Distinction (Existing/New), then Asymmetry statement. NIP is a distraction here.
      *   *Example:* Ditch the municipal one. It conflates scarcity and existing duties. Use the "Childfree vs. Tay-Sachs" pair.
      *   *Misconceptions:* Antinatalism (address early), Value of Happy Life (address mid), Singer/Utilitarianism (address throughout).
      *   *Question:* The "Last People on Earth" case.
      *   *Exclusions:* Repugnant Conclusion. Sentence: "We are diagnosing the intuition, not building the full population ethics engine."
      *   *Singer:* It's a habit to break. They think morality is continuous; this shows a discontinuity.

  7.  **Final Review against constraints:**
      *   75 mins? Yes, the plan fits.
      *   2nd year? Yes, avoids heavy metaphysics.
      *   No philosophy background? Yes, keeps it intuitive.
      *   Did I answer all 5 parts? Yes.

      *(Self-Correction on NIP)*: I should be careful not to say "cut entirely" if the co-teacher is invested, but advise strongly against opening with it. I will argue it creates a "logic trap" before the "intuition" is secured.
      *(Self-Correction on Example)*: The municipal example *does* illustrate the asymmetry in practice, but as a *teaching tool* for the *concept*, it's noisy. I will suggest using it as an *application* at the end, not the *carrying example* for the definition.
      *(Self-Correction on Singer)*: Be precise. Singer is about *preference utilitarianism* usually. The asymmetry challenges the *aggregation* of preferences for non-existents.

      *Let's flesh out the "Honest Sentence".* "We are leaving aside the broader mathematical problems of population ethics to focus strictly on the moral intuition regarding creation itself." A bit dry. How about: "We are stopping here because solving the math of future populations would require a whole course, and today is about understanding why the intuition feels broken." Better.

      *Let's refine the Assessment Question.* "The Last People" is good. Or "The Genetic Lottery." Let's go with "The Genetic Lottery" (selecting for happiness). It tests if they think we have a duty to maximize happiness in creation.

      *Wait, one more thing:* The user asked about the "Existing vs. New" distinction timing. I need to be explicit: Secure the distinction *before* stating the asymmetry, otherwise they talk past each other.

      *Okay, ready to write.*
answer: |-
  Here is a pedagogical plan for your 75-minute seminar, designed to navigate the specific constraints of your students' background and the conceptual density of the topic.

  ### 1. Order of Operations: Distinction First, Asymmetry Second, Non-Identity Cut
  **The Sequence:**
  1.  **The Singer Hook (5 mins):** Briefly recap their current working model (Singer): Morality is about minimizing suffering and maximizing well-being for sentient beings. Ask: "Does this apply to beings who *don't exist yet*?"
  2.  **The Carrying Cases (15 mins):** Present the two intuitive cases (see Section 2). Elicit their judgments.
  3.  **The Distinction (10 mins):** Explicitly label the difference between *making existing people better off* and *bringing new people into existence*. Secure this vocabulary before moving on.
  4.  **The Asymmetry Statement (15 mins):** Formalize the intuition they just voiced using the distinction.
  5.  **Head-off Misconceptions (15 mins):** Address the "Antinatalism" and "Value" errors (see Section 3).
  6.  **Application/Assessment (15 mins):** The new case (see Section 4).
  7.  **Wrap-up & Exclusions (5 mins):** The honest boundary setting (see Section 5).

  **On the Non-Identity Problem (NIP):**
  **Cut it.** Your co-teacher is logically correct that NIP underpins the asymmetry in advanced literature (Parfit), but pedagogically, it is a trap for this specific session.
  *   **Why:** NIP requires students to grasp counterfactuals about *which* person exists. The Asymmetry requires them to grasp the moral valence of *whether* a person exists. If you open with NIP, students will spend 40 minutes wrestling with identity metaphysics ("But if she waited, it would be a *different* child!") and never reach the moral intuition of the asymmetry.
  *   **Strategy:** If a student raises NIP ("But the happy child wouldn't exist otherwise!"), acknowledge it as a sophisticated point ("That is the Non-Identity Problem, and it complicates the 'harm' side"), but park it. Tell them you are bracketing identity to focus strictly on the *moral weight* of creation.

  **On the Existing/New Distinction:**
  You must secure this **before** stating the asymmetry. If you state the asymmetry first ("Creating happy people isn't required"), students trained in Singer will immediately object ("But happiness is good!"). They need to see that the *category* of the recipient (Existing vs. Potential) is what shifts the moral rule. The distinction is the key that unlocks the asymmetry; without it, the asymmetry looks like a contradiction.

  ### 2. The Carrying Example: Ditch the Municipality, Use the Couple
  **Assessment of your Municipal Example:**
  Do not use the "Fertility Subsidy vs. Pediatric Ward" case as your *primary* teaching tool.
  *   **The Confound:** It introduces **resource scarcity** and **duties to taxpayers**. Students will argue that the pediatric ward should be funded because the children *already exist* and have claims on the budget, not because of the procreation asymmetry. They will solve it using "triage" logic rather than "creation" logic. It smuggles in a "Priority to Existing" rule which validates the asymmetry for the *wrong reasons*.
  *   **The Risk:** It reinforces the Singer hangover (existing suffering trumps potential happiness) without isolating the specific intuition that *creating* happiness is not obligatory.

  **Proposed Replacement: The "Two Couples" Vignette**
  Use two low-stakes, individual-level cases to isolate the variables.
  *   **Case A (The Harm Intuition):** A couple knows that due to a genetic condition, any child they conceive will have a short life filled with painful medical procedures and no capacity for enjoyment. Is it wrong for them to conceive?
      *   *Target Consensus:* Yes, it is wrong.
  *   **Case B (The Benefit Intuition):** A couple knows that any child they conceive will likely be very happy, but they personally prefer to spend their money on travel and career. Are they morally obliged to conceive?
      *   *Target Consensus:* No, they are not obliged.

  **Why this works:** It removes budget constraints and existing third parties. It forces the students to weigh the *child's potential life* against the *act of creation* directly. Once they agree that Case A is wrong but Case B is not obligatory, you have empirically demonstrated the asymmetry in the room before you even define it.

  ### 3. Predictable Misconceptions & Intervention Points
  You correctly identified Antinatalism and Utilitarianism. Here is where to intercept them in the sequence:

  *   **Misconception 1: "So happy lives have no value?" (Nihilism)**
      *   *When:* Immediately after establishing Case B (No duty to create).
      *   *Intervention:* Clarify that the asymmetry claims creating a happy life is **good**, but not **obligatory**. It is a "supererogatory" good (like charity), not a required one. The value exists *for the child*, but it does not generate a debt *for the parent*.
  *   **Misconception 2: "This is just Antinatalism."**
      *   *When:* During the wrap-up of the Asymmetry Statement.
      *   *Intervention:* Explicitly state: "Antinatalism says creating life is *wrong*. The Asymmetry says creating life is *optional* (unless it would be miserable). You are permitted to have happy children; you just aren't *required* to."
  *   **Misconception 3: "Singer says maximize good, so why isn't this the same?" (The Singer Hangover)**
      *   *When:* Throughout, but specifically during the Distinction phase.
      *   *Intervention:* This is the habit you must **break**, not build on. Singer's framework assumes a continuous scale of well-being where more is better. The Asymmetry posits a **discontinuity**. Tell them: "Singer's logic works for *saving* people. This logic suggests morality works differently for *making* people."
  *   **Misconception 4: "It's just Total Utilitarianism in reverse."**
      *   *When:* If they try to mathematically aggregate the happiness.
      *   *Intervention:* Remind them that Total Utilitarianism *would* oblige the couple in Case B to have the child to increase total global happiness. The fact that they feel no such obligation is proof that they are *not* intuitively acting as Total Utilitarians.

  ### 4. The Assessment Question (Exit Ticket)
  To test application rather than recall, use a case that removes the "parent/child" dynamic, which can trigger emotional heuristics.

  **The "Mars Colony" Question:**
  > "Imagine humanity is extinct except for a small automated station on Mars capable of growing one human being.
  >
  > **Scenario 1:** The station predicts the grown human will have a painful, isolated life and die young. Is the station programmed to *abort* the growth?
  > **Scenario 2:** The station predicts the grown human will have a wonderful, fulfilling life. Is the station programmed to *require* the growth?
  >
  > If your answers differ, explain why the 'goodness' of the life in Scenario 2 doesn't trigger the same moral force as the 'badness' in Scenario 1."

  **What this tells you:** If they say "Abort in 1, Optional in 2," they grasp the asymmetry. If they say "Required in 2," they have reverted to Total Utilitarianism. If they say "Abort in 1 is wrong because no one exists to be harmed," they are stuck on the Non-Identity Problem (which you asked them to bracket).

  ### 5. What to Exclude & The Honest Sentence
  **Exclude:**
  *   **The Repugnant Conclusion:** It requires understanding Total vs. Average Utilitarianism, which consumes too much time and distracts from the core asymmetry intuition.
  *   **Person-Affecting Views:** Too technical.
  *   **Deep Non-Identity Metaphysics:** As noted above.

  **The Honest Sentence:**
  To prevent students from feeling shortchanged by these exclusions, say this at the start of the wrap-up:

  > "We are stopping here because population ethics contains mathematical paradoxes that would take a full semester to untangle; today our goal is not to solve the math, but to understand why our moral intuitions about *creating* people feel fundamentally different from our duties to *existing* people."

  ### Summary of the "Singer Hangover" Strategy
  Your students arrive thinking morality is a continuous scale of well-being aggregation (Singer).
  *   **Is it scaffolding?** No, it is a **habit to break**.
  *   **How:** In the first 10 minutes, explicitly frame the session as a "boundary test" for Singer's view. "Singer tells us how to treat the people *here*. Today we ask if those rules apply to people *not yet here*."
  *   **Why:** If you treat Singer as scaffolding, they will try to assimilate the asymmetry into utilitarianism (e.g., "Maybe happy people just count for less?"). You need them to feel the *rupture* in the logic. The distinction between Existing and New is the wedge that breaks the Singer framework open.
