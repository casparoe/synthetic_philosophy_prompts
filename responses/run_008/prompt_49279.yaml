      *   *Philosophy/Metaphysics-based:*
          *   Phenomenology of Passage. The "hard problem" of time. Why does it *feel* like flowing if it isn't? Error theory costs. -> *Medium Impact (Explanatory gap).*
          *   Fatalism/Agency. If the future exists, can I change it? (Consequence Argument). -> *Low/Medium Impact (Compatibilist responses exist).*
