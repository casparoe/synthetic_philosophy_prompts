          *   *Phenomenology:* The supervisor's point is key. If Eternalism explains *that* we believe in passage but not *why* it feels this specific way (the "what it's like"), it faces a hard problem analogous to consciousness.
          *   *Unfalsifiability:* If Eternalism is compatible with *any* physics (even Newtonian), is it metaphysics or just a stance? If it's unfalsifiable, does it fail as a naturalistic metaphysics?
