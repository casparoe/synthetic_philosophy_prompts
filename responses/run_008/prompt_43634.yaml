  4. Both sides acknowledge that the phenomenological camp contends reclassifying reports as evidence about beliefs rather than experiences risks building a metaphysical answer into the methodology before data collection begins.
  5. Both sides agree that any viable theory must account for the systematic patterns found in subjects' first-person reports.

  1. The Dennettian camp maintains that bracketing veridicality is a neutral methodological stance, while the phenomenological camp maintains it is a substantive metaphysical concession that excludes qualia from the outset.
  2. The phenomenological camp claims disciplined first-person methods yield sharable, testable data, whereas the Dennettian camp claims such reports remain beliefs subject to the same heterophenomenological constraints as naive reports.
  3. In change blindness paradigms, Dennettians predict subjects' reports reflect constructed beliefs rather than actual perceptual gaps, while phenomenologists predict refined introspection can reveal the specific phenomenal character of the gap itself.
  4. Regarding meditation studies, phenomenologists predict trained subjects can provide veridical reports of transient mental states that bypass conceptualization, while Dennettians predict these reports will still correlate with neural signatures of belief formation rather than direct experience.
  5. Both sides acknowledge a potential verbal dispute wherein Dennettians define "data" as third-person observable records and phenomenologists define "data" to include validated first-person givenness, obscuring whether they disagree on facts or definitions.
