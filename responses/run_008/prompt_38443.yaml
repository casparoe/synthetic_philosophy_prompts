      *   *No cooperation on safety-critical functions:* Crucial. This is the "untrusted monitoring" problem.
      *   *Measurable without real schemer:* This is the "eval gap." Hard to satisfy strictly, but needs a proxy standard.
      *   *Safe under knowledge/optimization:* Adversarial robustness. Very hard.
      *   *No shared blind spots:* Correlated failure. A major architectural constraint.
      *   *Fail loudly:* Graceful degradation vs. silent failure.
      *   *Cheap enough to run:* Economic feasibility.
      *   *Distributional shift robustness:* Generalization of safety guarantees.

  3.  **Refine and Structure the Desiderata (The Spec):**
      *   I need to organize these into logical categories: *Security Model*, *Operational Constraints*, *Verification*, and *Economics*.
      *   I need to sharpen the definitions. For example, "cheap enough" needs to be relative to capability gain.
      *   I need to explicitly highlight the tensions (the "impossibility" flags).

  4.  **Identify the Critical Tensions (The "Real Content"):**
      *   *Tension 1: Monitor Strength vs. Independence.* To catch a superintelligence, the monitor must be near-SI level. To avoid shared blind spots, it must be architecturally distinct. Distinct architectures are usually weaker. (The "Correlated Failure" vs. "Capability Gap" problem).
      *   *Tension 2: Robustness vs. Verifiability.* You can't verify robustness against an adversary smarter than you without having that adversary. (The "Eval Gap").
      *   *Tension 3: Security vs. Utility.* High security often implies high latency/overhead or capability suppression. (The "Overhead" problem).

  5.  **Evaluate Live Approaches (Briefly):**
