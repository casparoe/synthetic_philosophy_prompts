  10. **Final Polish:** Ensure the distinction between *Alignment* (making the model want the right thing) and *Control* (constraining the model regardless of wants) is sharp. The user knows this, but the spec must enforce it.

  *(Self-Correction on the "Most Work" requirement)*: The user guesses "No Cooperation." I should challenge this. "No Cooperation" is the *definition* of control. The requirement that actually *excludes* proposals is the **Verifiability** one. Everyone *claims* no cooperation, but nobody can *prove* it works without a real adversary. Actually, looking at current proposals (CBR, monitoring), they all fail the "Adversarial Robustness" one most glaringly. I will stick with **Adversarial Robustness under Knowledge** as the hardest constraint, but acknowledge "No Cooperation" is the definitional boundary.
  *Wait, let's look at the "Jointly Unsatisfiable" angle.* If I have to pick *one* requirement that excludes proposals, it's the one that is hardest to meet. That is "Safe while the model knows the scheme." (Because if it knows, it can bypass).
  Okay, I will argue that the *combination* of "Independent Monitor" + "Smarter Target" is the impossibility, but the single requirement doing the most exclusion is **Adversarial Robustness**.

