      *   *Refined Decision:* The "Adversarial Robustness under Knowledge" requirement is the true bottleneck. It implies the monitor must be *smarter* than the target to anticipate tricks, which conflicts with the "Independent/Monitor" constraint. I will argue that *Adversarial Robustness* combined with *Independence* is the real impossibility pair, but if forced to pick one requirement that does the most exclusionary work, it's **Verifiability without Instantiation** (because it renders the engineering process impossible).
      *   *Wait, re-reading the prompt:* "which single requirement does the most work excluding actual proposals."
