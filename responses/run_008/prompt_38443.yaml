      *   *Better take:* The requirement that does the most work is **"Safe under adversarial optimization pressure from a smarter agent."** This kills almost everything because it implies the monitor must be superior, which contradicts the setup of controlling a superior model.

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the user's insight (arguing past each other due to missing spec).
      *   **The Spec (Desiderata):** Group them.
          1.  *Threat Model:* Agnostic to specific failure mode, Robust to adversarial knowledge.
          2.  *Trust Architecture:* No safety-critical cooperation, Independent failure modes.
          3.  *Verification:* Verifiable without instantiating catastrophe, Fail-loud.
          4.  *Deployment:* Compute overhead bounds, Generalization to novel domains.
      *   **The Impossibility Flags:** Explicitly call out the tensions.
          *   Monitor Capability vs. Independence.
          *   Verifiability vs. Adversarial Superiority.
      *   **Scorecard:** Quick run-down.
