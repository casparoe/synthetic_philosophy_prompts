          *   Flag pairs of requirements that might be jointly unsatisfiable (trade-offs/impossibility results).
          *   Briefly evaluate main live approaches against the list (but keep weight on criteria).
          *   Address the user's draft list (accept, refine, or reject).
          *   Identify the *single most constraining requirement*.
          *   Be plain about unsatisfiability if that's the reality.
