prompt: 'I''m running a ninety-minute session of a graduate methodology seminar on
  Friedman''s claim that the unrealism of a theory''s assumptions is no mark against
  it — the position his critics dubbed the F-twist. The room will be mixed: economics
  PhD students who think this issue was settled decades ago and philosophy students
  who think it was refuted decades ago. Plan the session for me rather than explaining
  the position yourself. Specifically: what has to be established before the F-twist
  can even appear to be a position rather than an obvious mistake — for instance,
  why anyone would suppose that premises known to be false could yield systematically
  good predictions, and what work the "as if" formulation is doing there; which single
  example should carry the whole session — argue for or against the billiard player,
  and say what a rival candidate such as falling bodies in a vacuum or continuously
  clearing arbitrage would have to do better than it; where in the sequence Musgrave''s
  division of assumptions into negligibility, domain, and heuristic kinds should be
  introduced, and whether that distinction repairs Friedman''s thesis or quietly swaps
  in a better one he never held; the misconceptions each half of the room will predictably
  bring or form — that assumptions simply don''t matter, that the F-twist is nothing
  but instrumentalism, that it is the same maneuver as Galilean idealization, that
  it licenses assuming whatever yields the prediction you already wanted — and the
  exact point in the sequence at which each should be headed off; one question I can
  pose at the end whose answer would show whether a student can distinguish an assumption
  being false from an assumption being excused; and one thing I should openly decline
  to settle in ninety minutes, with a sentence on why leaving it open is better than
  pretending we closed it.'
