answer: "# Seminar Plan: The F-Twist and the Status of Assumptions\n**Duration:**\
  \ 90 Minutes\n**Audience:** Mixed Economics PhD & Philosophy of Science Graduate\
  \ Students\n\n## I. The Plausibility Condition (00:00 – 00:15)\n**Goal:** Prevent\
  \ the Philosophy students from dismissing the thesis as logical nonsense and the\
  \ Economics students from accepting it as trivial pragmatism. Establish *why* false\
  \ premises yielding true conclusions is not immediately contradictory.\n\n*   **00:00–00:05:**\
  \ **Opening Move.** Do not define the F-twist. Write two columns on the board: \"\
  Truth of Premises\" and \"Accuracy of Prediction.\" Ask the Economics students to\
  \ list cases where a model predicts well despite known falsehoods. Ask the Philosophy\
  \ students to list cases where a model predicts poorly despite true premises.\n\
  *   **00:05–00:15:** **The \"As If\" Mechanism.** Force the room to articulate the\
  \ bridge between falsehood and success. Ask: *\"Under what specific conditions does\
  \ a false description of a process generate a correct description of an outcome?\"\
  *\n    *   *Instructor Note:* Head off the misconception that **assumptions simply\
  \ don't matter** here. If a student says \"assumptions don't matter,\" ask them\
  \ to write the assumption set for a model that predicts inflation using the phase\
  \ of the moon. When they hesitate, point out that assumptions *constrain* the prediction.\
  \ The issue is not mattering, but *descriptive fidelity*.\n    *   *Instructor Note:*\
  \ Head off the misconception that **this licenses assuming whatever yields the prediction\
  \ you wanted**. Demand a constraint: If I assume \"agents are omniscient\" to predict\
  \ stock prices, and I'm right, did the assumption justify the model? Or did the\
  \ model survive *despite* the assumption? Establish that the F-twist requires the\
  \ falsehood to be *systematic*, not ad hoc.\n\n## II. The Core Example: The Billiard\
  \ Player (00:15 – 00:50)\n**Goal:** Test the F-twist against a single, sustained\
  \ case study.\n**Selection:** **The Billiard Player.**\n**Justification:**\n*  \
  \ *Why not Falling Bodies?* Physics idealizations (vacuums) are about removing interfering\
  \ forces. Economics is about intentional agents. Falling bodies bypasses the question\
  \ of *mechanism* (does the stone calculate gravity?).\n*   *Why not Arbitrage?*\
  \ This presupposes the efficiency of markets, which begs the question. It assumes\
  \ the prediction is true to validate the assumption.\n*   *Why Billiards?* It isolates\
  \ the cognitive gap. The assumption is that the player *calculates* complex mathematical\
  \ trajectories. The reality is they use heuristics/muscle memory. The prediction\
  \ (where the ball goes) is accurate.\n    *   *For Econ Students:* It shows that\
  \ \"rationality\" need not be psychological reality.\n    *   *For Phil Students:*\
  \ It highlights the difference between *simulating* a process and *describing* a\
  \ process.\n\n*   **00:15–00:30:** **Deconstruct the Shot.** Have a Philosophy student\
  \ describe what is *false* about the assumption (the player does not solve differential\
  \ equations). Have an Economics student describe what is *successful* (the ball\
  \ goes in the pocket).\n*   **00:30–00:40:** **The Galilean Trap.** Head off the\
  \ misconception that **this is the same maneuver as Galilean idealization**.\n \
  \   *   *Activity:* Ask the room: \"If we gave the billiard player a calculator\
  \ and the equations, would they shoot *better*?\"\n    *   *If Yes:* Then the assumption\
  \ is a simplification of a real mechanism (Galilean).\n    *   *If No (or they choke):*\
  \ Then the assumption is a *functional equivalent*, not a simplification. This is\
  \ the crux of the F-twist. The assumption is not \"friction is zero\" (negligible);\
  \ it is \"brain is a calculator\" (false but functionally isomorphic).\n*   **00:40–00:50:**\
  \ **Stress Test.** Ask: \"Does this example hold if the player misses?\" If the\
  \ player misses, was the assumption false, or was the application wrong? Use this\
  \ to show why the Phil students think it's unfalsifiable and the Econ students think\
  \ it's robust.\n\n## III. Musgrave's Intervention (00:50 – 01:05)\n**Goal:** Introduce\
  \ Alan Musgrave's typology (Negligibility, Domain, Heuristic) to see if it saves\
  \ Friedman.\n**Placement:** Introduce this *after* the Billiard example has been\
  \ exhausted, when the debate is stuck between \"it works\" and \"it's lying.\"\n\
  \n*   **00:50–00:55:** **The Typology.** Briefly define Musgrave's three kinds:\n\
  \    1.  *Negligibility:* The factor is assumed absent because it is insignificant\
  \ (e.g., air resistance).\n    2.  \b*Domain:* The assumption specifies where the\
  \ theory applies (e.g., \"in a vacuum\").\n    3.  *Heuristic:* A temporary step\
  \ to build a model, to be relaxed later.\n*   **00:55–01:05:** **Repair or Swap?**\
  \ Pose the critical question: *\"When Friedman defends the billiard player, which\
  \ of Musgrave's assumptions is he defending?\"*\n    *   *Guide the consensus:*\
  \ Friedman claims the assumption is *not* negligible (the math is hard), *not* domain-restricted\
  \ (players play everywhere), and *not* heuristic (he isn't planning to add psychology\
  \ later).\n    *   *Verdict:* Push the students to see that Musgrave does not **repair**\
  \ Friedman's thesis; he **swaps** it for a more defensible one Friedman never held.\
  \ Friedman wanted to say unrealistic assumptions are *good*. Musgrave says only\
  \ specific kinds of unrealistic assumptions are *permissible*.\n    *   *Instructor\
  \ Note:* Head off the misconception that **the F-twist is nothing but instrumentalism**.\
  \ Instrumentalism says theories aren't true or false, just tools. Musgrave shows\
  \ that if we treat assumptions as Domain claims, they *can* be true or false. Use\
  \ this section to show that Friedman's instrumentalism is more radical than Musgrave's\
  \ taxonomy allows.\n\n## IV. Diagnostic & Conclusion (01:05 – 01:30)\n**Goal:**\
  \ Assess understanding and define the boundary of the session.\n\n*   **01:05–01:20:**\
  \ **The Diagnostic Question.**\n    Pose this exact question to the room for individual\
  \ written response (5 mins), then discuss:\n    > *\"If we replaced the false assumption\
  \ with a true one, and the model's predictive accuracy decreased, was the original\
  \ assumption **false** or was it **excused**?\"*\n    *   *Correct Distinction:*\
  \ If accuracy decreases, the original assumption was **excused** (it was a functional\
  \ placeholder that worked better than the truth, perhaps due to parsimony or noise\
  \ cancellation). If accuracy increases, the original assumption was merely **false**\
  \ (a liability).\n    *   *Why this works:* It forces students to distinguish between\
  \ an assumption that is a *bug* (falsehood) and an assumption that is a *feature*\
  \ (excused idealization).\n\n*   **01:20–01:25:** **The Open Door.**\n    **Decline\
  \ to settle:** *Whether predictive success is the sole criterion for theory choice.*\n\
  \    **Why leave it open:** \"If we settle this today, we decide whether Economics\
  \ is a branch of Engineering or a branch of Psychology. That is not a methodological\
  \ question solvable in ninety minutes; it is a disciplinary identity crisis. If\
  \ we pretend to close it, we privilege one department's tenure standards over the\
  \ other's.\"\n\n*   **01:25–01:30:** **Closing.**\n    Assign reading that attacks\
  \ the Billiard example specifically (e.g., Rotwein or Hoover) to ensure the \"settled\"\
  \ feeling doesn't return after class. Dismiss."
