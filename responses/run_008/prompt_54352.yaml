  ### Analysis of Maya's Verdicts

  Maya's recorded verdicts present a cohesive but philosophically dense profile. To predict her answer to the question "Is there some exact number $n$ such that $n$ grains make a heap and $n-1$ grains do not?", we must weigh three primary candidate theories of vagueness: **Epistemicism**, **Supervaluationism**, and **Contextualism**.

