answer: |-
  This is a bold and excellent plan. It aligns perfectly with Dennett's core warning: that intuition pumps are *rhetorical devices* as much as logical ones. If you pull this off, your classmates won't just understand the reading; they will have *felt* the manipulation.

  Here is a complete session plan designed for 16 students, 75 minutes, with zero upfront lecturing and full transparency by the end.

  ### 1. The Materials: The "Twin" Cases
  **Topic:** Moral Responsibility in Negligence.
  **Why:** It avoids the overused Trolley Problem but triggers immediate, high-stakes judgment.
  **The Control:** The logical facts are identical in both versions.
  **The Variable:** Grammatical person (You vs. They), Voice (Active vs. Passive), and Sensory Vividness.

  **Instructions for Distribution:**
  *   Print two colors of paper (e.g., White and Blue).
  *   As students enter, hand them a packet face-down. Tell them: *"Do not open until I say so. Do not discuss the content with neighbors."*
  *   Seat White papers on the left side of the room, Blue on the right. (This prevents them from seeing neighbors reading different text).

  **Case A (White Paper): The "First-Person Vivid" Pump**
  > You are sitting in the security booth. It is 3:00 AM. Your eyelids feel heavy. You rest your head on your hand. You drift off. The alarm panel stays dark. The vault door swings open. A figure walks out with the crate. You wake up. The room is empty.
  >
  > **Verdict:** Is the guard morally responsible for the theft? (Yes / No)
  > **Confidence:** How sure are you? (1 = Guessing, 5 = Certain)

  **Case B (Blue Paper): The "Third-Person Abstract" Pump**
  > A security booth was occupied. It was 3:00 AM. Eyelids became heavy. Head was rested on hand. Sleep occurred. The alarm panel remained dark. The vault door was opened. A figure exited with the crate. Wakefulness returned. The room was found empty.
  >
  > **Verdict:** Is the guard morally responsible for the theft? (Yes / No)
  > **Confidence:** How sure are you? (1 = Guessing, 5 = Certain)

  *(Note: The facts are identical: Guard sleeps, alarm fails, theft happens. But Version A simulates the experience of negligence; Version B describes the state of negligence.)*

  ### 2. Voting Mechanics (Low-Tech & Anonymous)
  Do not use phones or laptops; they create distance. Use the "Folded Slip" method.
  *   Provide small index cards.
  *   Students write: **Color (White/Blue) | Verdict (Y/N) | Confidence (1-5)**.
  *   They fold it.
  *   You collect them in a box/bag at the front.
  *   **Why:** This prevents them from seeing the tally as it happens and keeps the "blind" intact until the reveal.

  ### 3. The Timeline (75 Minutes)

  **0:00 – 0:05: Setup (Minimal)**
  *   **Action:** Hand out packets as they enter.
  *   **Script:** "Good morning. Please take a packet. Sit where you like, but please don't open the packet yet. We're going to do a quick judgment exercise based on the reading for today. Silence please until everyone has a packet."
  *   **Goal:** Establish normalcy. Do not mention "Intuition Pumps" yet.

  **0:05 – 0:15: The Trap (Reading & Voting)**
  *   **Action:** "Open your packets. Read the case silently. Mark your verdict and confidence on the card. Fold it. Pass it to the aisle."
  *   **Constraint:** Give them exactly 3 minutes to read and vote. Time pressure prevents deep analysis and forces reliance on the "pump."
  *   **Collection:** Collect the cards visibly. Shuffle them in front of them (to ensure anonymity).

  **0:15 – 0:25: The Reveal (The Pivot)**
  *   **Action:** Tally the results on the board *live*. Create two columns: White and Blue.
  *   **Likely Outcome:** White (Vivid) will likely show higher "Yes/Responsible" and higher Confidence. Blue (Abstract) may show more hesitation or "No."
  *   **The Turn:** Once the data is on the board, ask: *"What was the difference between the White case and the Blue case?"*
  *   **Let them struggle:** They will say "One was about me," "One was passive voice."
  *   **The Drop:** *"There was no philosophical difference. The facts were identical. The only difference was the packaging."*
  *   **Connection:** *"You just experienced Dennett's point. Your judgment was steered not by logic, but by syntax and perspective."* (This is your only mini-lecture. Keep it under 3 mins).

  **0:25 – 0:55: The Workshop (Building Pumps)**
  *   **Grouping:** Mix the groups! Pair a White student with a Blue student. (4 groups of 4).
  *   **Task:** "Your job is to build a Minimal Pair. Take a neutral scenario (e.g., 'A doctor administers a drug that cures the patient but causes pain'). Write Version A to pump for 'Ethical.' Write Version B to pump for 'Unethical.' You cannot change the facts, only the framing."
  *   **Time:** 20 minutes to write.
  *   **Swap:** 10 minutes to swap with another group and vote on their pair.
  *   **Goal:** They move from *victims* of the pump to *engineers* of the pump.

  **0:55 – 1:10: The Debrief (Mapping to Dennett)**
  *   **Discussion:** Ask groups to share which framing worked best.
  *   **Key Question:** "If the facts are the same, why did the verdict change?"
  *   **Dennett Link:** Guide them to Dennett's distinction between a tool that *isolates* a feature (good pump) vs. one that *smuggles* a conclusion (bad pump).
  *   **Takeaway:** "A good thought experiment strips away noise. A bad one adds noise that looks like signal."

  **1:10 – 1:15: Closing & Limitations**
  *   **Action:** Final wrap-up. Acknowledge the limits of the exercise (see below).
  *   **Exit:** "Next week, when you read a case in a paper, ask: Who is holding the pump, and which way are they turning the knobs?"

  ### 4. Handling the Confidence Data
  You mentioned worrying about faking confidence. **Do not fake it.**
  *   **If the data shows high confidence in the manipulated group:** This is the "home run." It shows the pump suppresses doubt.
  *   **If the data is messy/low confidence:** This is *also* a win.
  *   **Script for messy data:** "Look at the board. The split isn't perfect. Some of you saw through it. But look at the Confidence scores. Even those who got 'sucked in' were often highly confident. That's the danger. It's not that we all change our minds; it's that we become *more certain* of our bias when the story feels vivid."
  *   **Why this works:** It shifts the lesson from "We are stupid" to "Certainty is not a proxy for Truth."

  ### 5. Handling the "Classroom vs. Real Philosophy" Objection
  You expect one classmate to say: *"This is just a survey. Real philosophical arguments have premises and conclusions, not just snap judgments on slips of paper."*

  **Your Response (Dennett-Style):**
  "That's exactly Dennett's worry. Philosophers often present these snap intuitions as 'premises' in a larger argument. They say, 'Surely we agree X is wrong.' If that 'Surely' is just the result of a linguistic trick like we saw today, then the argument built on top of it is unstable. We aren't saying philosophy is just surveys. We're saying the *raw material* of philosophy (our intuitions) is vulnerable to manufacturing. If the foundation is pumped, the house falls."

  ### 6. Honest Limitation Note
  You asked for an honest note on what this activity *cannot* reproduce.
  *   **The Limitation:** Real intuition pumps (like Searle's Chinese Room or Thomson's Violinist) work **dialectically**. They are embedded in pages of text where the author anticipates your objections and adjusts the pump *while* you read.
  *   **The Activity:** This is a "snapshot" pump. It works by surprise.
  *   **How to disclose this:** In the final 5 minutes, say: *"Today we saw 'blitz' pumps. Real philosophical pumps are slower. They build trust over paragraphs before they spring the trap. That makes them harder to spot, not easier. Today was training wheels."*

  ### 7. Troubleshooting: What Will Go Wrong?
  **Failure Mode 1: They spot the difference immediately.**
  *   *Cause:* Students talking before the vote or reading too slowly.
  *   *Recovery:* If more than 2 people notice before voting, abort the "trap." Say: *"Okay, the cover is blown. But let's vote anyway. Does knowing they are twins stop the feeling that one is worse?"* This tests if the *feeling* persists even when the *logic* is known (which is a powerful Dennett point about cognitive encapsulation).

  **Failure Mode 2: The data shows no significant split.**
  *   *Cause:* The case wasn't emotionally charged enough.
  *   *Recovery:* Pivot to the **Confidence** metric. "Okay, the verdicts are the same. But look at the confidence. Did the vivid story make you feel *better* about your answer? Dennett argues pumps often work to solidify confidence, not just change votes."

  **Failure Mode 3: The Workshop groups struggle to write.**
  *   *Cause:* "Don't change the facts" is hard.
  *   *Recovery:* Provide a "Cheat Sheet" of framing devices on the board during the workshop:
      *   *Active vs. Passive Voice*
      *   *Specific Names vs. Roles (John vs. The Doctor)*
      *   *Sensory details (Smell, Sound) vs. Clinical terms*
      *   *Order of information (Outcome first vs. Intent first)*

  ### 8. Final Advice for You
  *   **Own the Room:** You are not teaching them content; you are conducting an experiment. Act like a lab coordinator, not a lecturer.
  *   **The Reveal Moment:** This is the most important 60 seconds of the class. Do not rush it. Let the silence hang after you tell them the cases were identical. Let them look at the board. Let them feel the slight embarrassment of having been manipulated. That feeling *is* the lesson.
  *   **Transparency:** Ensure you collect the cards and keep them. If anyone asks afterward, you can show them the raw data. This proves you aren't hiding the results.

  This plan respects your professor's constraint (the point emerges from the activity), respects Dennett's text (tools can be misused), and respects your classmates (treating them as capable philosophers who just got caught in a trap). Good luck.
