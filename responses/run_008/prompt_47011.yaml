prompt: |-
  I'm a second-year undergraduate taking a course called Philosophical Methods, and our professor has students run one of the weekly sections themselves in the second half of the semester. I've been assigned the unit on intuition pumps, built around Dennett's idea (mainly from his 2013 book Intuition Pumps and Other Tools for Thinking) that thought experiments are tools that get built, deployed, and — crucially — misused: some earn their persuasive force by isolating exactly the feature that matters, while others smuggle in their conclusions by exploiting surface features we respond to automatically, the way a skilled salesman frames a choice. I have 16 classmates and a 75-minute section, and the professor has given me one condition: the point has to show up in what happens during the session, not in anything I say up front, since the reading was already assigned and everyone will arrive knowing what an intuition pump is supposed to be.

  My idea is to have them be pumped without knowing it. I'd split the room in half without announcement: each half silently reads a different one-page case, casts an anonymous verdict (a forced choice plus a confidence rating), and then — this is the reveal I want the activity to be built around — the two cases turn out to be twins, identical in every respect the philosophical theory cares about but differing only in packaging: the vividness with which one party in the case is described, which grammatical person the case is written in (does it matter whether it says "you" instead of "a surgeon"?), which detail comes first in the paragraph, and so on. I have a rough plan for a second phase after the reveal, where small groups try to construct their own minimal pair — a case and its doctored twin — to pull the verdict of the other groups in a direction the groups get to choose, and then we inspect which doctorings worked. But I don't know how to sequence all this, how to word the cases so that the cover story holds (I'm worried people will smell a rat the moment verdicts are collected anonymously, since that's not how a normal discussion section starts), or what to do with the confidence ratings — it would be a much better activity if the people whose verdicts were manufactured were also the most confident, but I don't know how to arrange that and don't want to fake it.

  So I'd like a full plan: the two cases (on whatever topic you judge gives the cleanest packaging effects, though I'd rather stay away from trolley problems since they've seen those to death), the anonymous voting mechanics, the timeline for 75 minutes, and a debrief that maps what happened onto the real distinction between a thought experiment that earns its force and one that merely exploits our reflexes — including how to handle the objection I expect from the one classmate who will say that survey judgments in a classroom tell us nothing about how intuitions function inside an actual philosophical argument. I also want an honest note on which feature of real intuition pumps the activity can't reproduce (I suspect it's something about how the classic ones do their work slowly, embedded in pages of dialectic, rather than in one shot), plus what will predictably go wrong the first time I run it and how to recover mid-session. Please don't have me lecture for more than five minutes at any point, and don't plan anything that requires me to deceive anyone about anything after the reveal happens — the manipulation has to be fully exposed by the end of the section, since the professor was explicit that the session is only defensible if everyone leaves knowing exactly how they were steered.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** 2nd-year undergrad, Philosophical Methods course.
      *   **Task:** Run a 75-minute section on "Intuition Pumps" (Dennett).
      *   **Constraint 1 (Crucial):** The point must emerge *during* the session, not via upfront lecture. Students have read Dennett.
      *   **Constraint 2 (Crucial):** No deception *after* the reveal. Full transparency by the end.
      *   **Constraint 3 (Time):** 75 minutes, 16 classmates.
      *   **Constraint 4 (Lecture):** Max 5 minutes lecturing at any point.
      *   **Core Idea:** Split class, give them "twin" cases with different packaging (framing, vividness, POV), collect anonymous verdicts + confidence, reveal the manipulation, then have them build their own pumps.
      *   **Specific Needs:** Two specific cases (non-trolley), voting mechanics, timeline, debrief strategy (mapping to Dennett's distinction), handling the "classroom vs. real philosophy" objection, honest limitation note, troubleshooting/predictable failures.
      *   **Concern:** How to ensure confidence ratings align with the manipulation (without faking data).

  2.  **Deconstruct the Core Activity (The "Trap"):**
      *   *Goal:* Show that irrelevant features (packaging) shift judgments/confidence.
      *   *Topic:* Needs to be intuitive but not overused (no Trolley). Medical ethics or Personal Identity are good candidates. Let's go with **Personal Identity/Teletransportation** or **Moral Luck**. Moral Luck is often clearer for quick judgments. Let's try **Negligence/Responsibility** (a la Nagel/Williams) but simplified. Actually, **Property/Ownership** or **Promise Keeping** might be cleaner.
      *   *Better Idea:* **The "Lost Wallet" Scenario.** It's relatable, low stakes, but triggers moral intuition.
      *   *Alternative:* **The "Sleeping Surgeon" (Medical Ethics).**
      *   *Selection:* Let's use a **Responsibility/Outcome Luck** case. It's philosophically rich but accessible.
      *   *Version A (High Vividness/Second Person):* "You" leave a window open. A thief enters. Valuable heirloom stolen.
      *   *Version B (Low Vividness/Third Person):* "A person" leaves a window open. A thief enters. Valuable heirloom stolen.
      *   *Wait, the prompt asks for "twins... identical in every respect the philosophical theory cares about."*
      *   *Refinement:* The logical structure must be identical. The *framing* changes.
      *   *Case Choice:* **The "Broken Vase" (Negligence).**
      *   *Group 1 (Agent-Focused):* Focus on the *intent* and *care* taken. (Makes them feel less responsible).
      *   *Group 2 (Outcome-Focused):* Focus on the *damage* and *value* of the object. (Makes them feel more responsible).
      *   *Actually, let's stick closer to the user's "packaging" idea.*
      *   *Case:* **The "Forgotten Birthday."**
      *   *Version 1 (Warm/Close):* "Your best friend of 10 years..." (High emotional stake).
      *   *Version 2 (Cold/Distant):* "A colleague you see weekly..." (Low emotional stake).
      *   *Problem:* That changes the *facts* (relationship status), not just packaging.
      *   *Correction:* The facts must be logically identical. The *presentation* must differ.
      *   *Revised Case:* **The "Charity Donation."**
      *   *Version 1 (Identifiable Victim):* "A specific child, Rokia, needs food." (Vivid).
      *   *Version 2 (Statistical Victim):* "Thousands of children need food." (Abstract).
      *   *Philosophical Core:* Does the moral obligation differ? (Singer vs. Psychologists).
      *   *Wait, Dennett's point is about *argumentative* force.*
      *   *Let's go with a classic "Counterfactual" scenario regarding **Knowledge vs. Luck**.*
      *   *Scenario:* **The Clock Case (Russell/Gettier style).**
      *   *Version A (Trust):* You look at a clock that has always worked. It says 2:00. It is 2:00. (Stopped 12h ago).
      *   *Version B (Suspicion):* You look at a clock in a suspicious building. It says 2:00. It is 2:00. (Stopped 12h ago).
      *   *Actually, the user wants "packaging" (grammar, vividness, order).*
      *   *Let's use the **"Spilled Coffee"** scenario.*
      *   *Facts:* Agent bumps table. Coffee spills on Laptop. Laptop breaks.
      *   *Version 1 (Active Voice/Immediate):* "You shove past the table. The coffee flies. The screen cracks."
      *   *Version 2 (Passive Voice/Delayed):* "The table was bumped. The coffee was spilled. The screen was found cracked."
      *   *Question:* How blameworthy is the agent? (1-10).
      *   *Why this works:* It isolates *agency* perception via syntax, not facts.

  3.  **Addressing the Confidence Rating Concern:**
      *   *User Worry:* "I don't know how to arrange that [high confidence] and don't want to fake it."
      *   *Reality Check:* You can't guarantee high confidence. But you *can* design the prompt to encourage snap judgments.
      *   *Solution:* Time pressure. Give them 90 seconds to read and vote. Snap judgments rely on heuristics (the pump). Reflection kills the pump. If they rush, confidence often stays high because they don't realize they've been manipulated.
      *   *Data Handling:* If the data doesn't show a split, *that's still data*. The debrief shifts to "Why didn't this work?" (i.e., the pump was weak). But for the plan, I must assume it *might* work and plan for the reveal. I will advise the user to treat the data honestly whatever it says.

  4.  **Drafting the Plan:**

      *   **Topic:** Moral Responsibility (Negligence).
      *   **Cases:** "The Shoved Table" (Active/Vivid) vs. "The Bumped Table" (Passive/Clinical).
      *   **Timeline:**
          *   0-5: Setup (Minimal instruction).
          *   5-15: Reading & Voting (Silent).
          *   15-25: Tally & Reveal (The "Aha" moment).
          *   25-55: Workshop (Building their own pumps).
          *   55-70: Test & Debrief.
          *   70-75: Closing (Dennett connection).
      *   **Voting Mechanics:** Slips of paper or a Google Form? Paper is better for "anonymous in the room" feel and immediate tallying on the board.
      *   **Debrief:** Connect to Dennett's "turning the knobs" metaphor.
      *   **Objection Handling:** "Classroom != Real Philosophy." Response: These are the *raw materials* of real philosophy. If the raw material is tainted, the argument fails.
      *   **Limitation:** Real pumps work over pages/context, not 1-minute snaps.
      *   **Troubleshooting:** What if no one notices the difference? What if the split is 50/50?

  5.  **Refining the Cases (Crucial Step):**
      *   Need to ensure they are logically identical but phenomenologically different.
      *   *Case A (The "You" Pump):* Second person, active verbs, sensory details.
      *   *Case B (The "Observer" Pump):* Third person, passive verbs, abstract terms.
      *   *Scenario:* A security guard falls asleep. A theft occurs.
      *   *Version 1:* "You are the guard. Your head nods. The shadows move. The painting is gone."
      *   *Version 2:* "The guard was on duty. Sleep occurred. The perimeter was breached. The painting was removed."
      *   *Question:* Is the guard morally responsible for the loss?
      *   *Version 1 triggers personal simulation (high blame).*
      *   *Version 2 triggers abstract categorization (lower blame/mitigating factors).*

  6.  **Developing the "Build Your Own" Phase:**
      *   Groups of 4.
      *   Task: Take a neutral prompt. Create Version A (Push for Yes) and Version B (Push for No).
      *   Swap with another group.
      *   See if they get pumped.

  7.  **Addressing the "Confidence" Issue:**
      *   I need to be honest with the user. You cannot *force* confidence.
      *   *Strategy:* Ask for a "Gut Check" confidence. "How sure are you *right now*?"
      *   *Prediction:* Often, the vivid version yields higher confidence because the narrative feels more "complete."
      *   *Contingency:* If confidence is low across the board, the lesson is about *uncertainty* as a defense against pumps.

  8.  **Final Review against Constraints:**
      *   75 mins? Yes.
      *   16 students? Yes (4 groups of 4).
      *   No lecture > 5 mins? Yes.
      *   No post-reveal deception? Yes.
      *   Dennett focused? Yes.

  9.  **Writing the Response:**
      *   Tone: Supportive, peer-to-peer (undergrad to undergrad), practical.
      *   Structure: Plan, Cases, Mechanics, Timeline, Debrief Script, Troubleshooting, Limitations.
      *   *Self-Correction on Cases:* The "Security Guard" is good. Let's make sure the *facts* are truly identical.
      *   *Version 1:* "You sit in the booth. Your eyes close. The alarm stays silent. The vault opens."
      *   *Version 2:* "The booth was occupied. Eyes closed. The alarm remained silent. The vault opened."
      *   *Verdict:* "Should the guard be fired?" (Yes/No) + Confidence (1-5).
      *   *Wait, one more thing:* The user wants the "reveal" to be the pivot. I need to script the reveal carefully so it doesn't feel like a prank but a demonstration.

  10. **Final Polish:** Check the "Objection" section. The classmate who says "This isn't real philosophy" needs a Dennett-based answer. Dennett says intuition pumps *are* the tools of philosophy, so if they are buggy, philosophy is buggy. That's the link.

  11. **Limitation Note:** Real pumps work in dialectic. This is a snapshot. Acknowledge this.

  12. **Troubleshooting:** What if they spot the difference immediately? (Seat them apart? Hand out papers face down? Tell them "Read silently, do not discuss.")

