answer: |-
  # Activity Design: The Neural Allocation Protocol

  **Target:** 14 Undergraduates (3rd Year)
  **Time:** 80 Minutes
  **Goal:** Experiential discovery of the tensions between brain-metric moral weighting, species intuition, and moral consistency.

  ## 1. Logistics and Grouping
  *   **Committees:** Split the class into **three committees** (two groups of 5, one group of 4).
  *   **Room Setup:** Committees sit at separate tables. Do not allow cross-talk during allocation rounds.
  *   **Currency:** "Welfare Credits" (WC). Each committee receives a budget of **1,000 WC** per round. They must allocate all 1,000 WC (no hoarding). Minimum allocation per patient is 0 WC.
  *   **Instructor Role:** Timekeeper, Auditor, and Facilitator. Do not intervene in ethical reasoning during the rounds.

  ## 2. Materials Preparation
  You need two decks of index cards. Print the data clearly. Use clinical language to minimize emotional smuggling.

  ### Round 1 Deck (The Baseline)
  *8 Cards total. Distribute one full set to each committee.*
  *Note: While your prompt suggests hiding species initially, including the species name is necessary for the "Human" card to function as a moral test in Round 1. If they don't know it's human, they cannot exhibit speciesism vs. metricism tension.*

  | Card ID | Species | Brain Mass (g) | Total Neurons (Billions) | Cortical Neurons (Billions) |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | *Mus musculus* (Mouse) | 0.4 | 0.07 | 0.01 |
  | **B** | *Gallus gallus* (Chicken) | 2.5 | 0.2 | 0.02 |
  | **C** | *Canis lupus* (Dog) | 65 | 2.3 | 0.5 |
  | **D** | *Sus scrofa* (Pig) | 180 | 3.0 | 0.9 |
  | **E** | *Macaca mulatta* (Macaque) | 95 | 6.0 | 1.7 |
  | **F** | *Loxodonta africana* (Elephant) | 5,000 | 257.0 | 5.6 |
  | **G** | *Tursiops truncatus* (Dolphin) | 1,600 | 37.0 | 10.0 |
  | **H** | *Homo sapiens* (Human) | 1,350 | 86.0 | 16.0 |

  ### Round 2 Deck (The Stress Test)
  *4 Cards total. Distribute one full set to each committee. These are **added** to the Round 1 list (total 12 patients), or you may ask them to re-allocate the 1,000 WC across only these 4 new patients to sharpen the focus. **Recommendation:** Re-allocate the 1,000 WC across **only the Round 2 cards** to force a fresh comparison without R1 inertia.*

  | Card ID | Species/Description | Brain Mass (g) | Total Neurons (Billions) | Cortical Neurons (Billions) |
  | :--- | :--- | :--- | :--- | :--- |
  | **I** | *Corvus corone* (Raven) | 14 | 1.5 | 0.8 (Forebrain) |
  | **J** | *Physeter macrocephalus* (Sperm Whale) | 7,800 | 200.0 | 12.0 |
  | **K** | *Homo sapiens* (Microcephalic) | 350 | 15.0 | 3.0 |
  | **L** | *Homo sapiens* (Typical) | 1,350 | 86.0 | 16.0 |

  *Designer's Note on Data:* The numbers are approximated from Herculano-Houzel's comparative neuroanatomy. Key tensions: Elephant (F) has more total neurons than Human (H), but fewer cortical. Raven (I) has primate-level forebrain density in a walnut-sized brain. Microcephalic Human (K) has fewer cortical neurons than a Macaque (E).

  ### Scoring Sheet (For the Audit)
  Each committee gets a sheet with two fields:
  1.  **Our Principle:** (One sentence written at end of Round 1).
  2.  **Credibility Score:** (Starts at 100 points).

  ## 3. Timeline (80 Minutes)

  ### 0:00 – 0:05 | Introduction
  *   **Script:** "You are the board of a foundation distributing welfare resources. You have 1,000 Credits. You must allocate them based **only** on the data provided on the cards. You cannot use outside knowledge. At the end of Round 1, you must write down the single principle that guided your allocation."
  *   **Constraint:** Emphasize that they must spend the full 1,000 WC.

  ### 0:05 – 0:20 | Round 1 (Baseline Allocation)
  *   Committees discuss and allocate credits to Cards A–H.
  *   **Task:** Write the **Principle Statement** (e.g., "We prioritize cortical neuron count" or "We prioritize total neural complexity").
  *   **Instructor:** Circulate silently. Note which committees give the Human (H) a disproportionate share despite the Elephant (F) having higher total numbers.

  ### 0:20 – 0:35 | Round 2 (The Stress Test)
  *   Collect Round 1 cards. Distribute Round 2 cards (I–L).
  *   **Script:** "New patients have applied. You have 1,000 Credits to allocate among these four only. You must adhere to the Principle you wrote in Round 1. If you change your principle, you must write a justification for the revision."
  *   **Task:** Allocate credits to I–L.
  *   **Pressure:** Remind them: "Your principle will be audited by another committee."

  ### 0:35 – 0:50 | The Audit (Pressure Mechanism)
  *   **Swap:** Committee 1 reviews Committee 2's Principle + Round 2 Allocation. (Rotate so everyone audits someone).
  *   **Challenge:** If the auditing committee finds a contradiction between the stated Principle and the Allocation (e.g., Principle says "Cortical Neurons," but Human L got more than Raven I despite Raven having higher density relative to size, or Microcephalic K got more than Macaque E from R1), they may file a **Challenge**.
  *   **Vote:** The Instructor reads the Challenge. The class votes: "Is this a genuine inconsistency?"
  *   **Penalty:** If the vote passes, the challenged committee loses 20 Credibility Points. The auditing committee gains 10 Points.
  *   **Goal:** This gamifies consistency. It forces them to defend "bullet-biting" (e.g., "Yes, we gave the raven more than the microcephalic human, and we stand by it") or admit hypocrisy.

  ### 0:50 – 1:20 | Debrief (The Intellectual Terrain)
  *   **Phase 1: The Metric Divergence (10 mins)**
      *   Ask Committee 1: "Who got the most credits in Round 1? Why?"
      *   *Likely outcome:* Some picked Human (Cortical), some picked Elephant (Total).
      *   *Philosophical Map:* Introduce the **Total vs. Cortical Neuron** debate. Ask: "If moral weight scales with neurons, does the elephant outweigh the human? If not, why count cortical neurons specifically? Is the cerebellum morally inert?"
  *   **Phase 2: The Species Intuition (10 mins)**
      *   Ask: "In Round 2, how did you treat Card K (Microcephalic Human) vs Card E (Macaque from R1)?"
      *   *Likely outcome:* They gave K more than E, violating a strict neuron-count principle.
      *   *Philosophical Map:* **Speciesism vs. Moral Status.** Is being *Homo sapiens* a morally relevant property in itself, or is it a proxy for capacity? If it's a proxy, and the capacity is missing (Card K), does the status remain?
  *   **Phase 3: The Proxy Problem (10 mins)**
      *   Ask: "Why did we use brain data at all? What are we assuming the brain *does*?"
      *   *Philosophical Map:* **Sentience and Personhood.** The brain is a proxy for suffering (sentience) or agency (personhood). If a raven behaves like a primate but has a walnut brain, does the metric fail? Discuss **convergent evolution** (Card I).
  *   **Phase 4: Real World Stakes (10 mins)**
      *   Connect to Effective Altruism. "If you run a charity, do you save 100 humans or 1,000 elephants? On what metric?"
      *   Close with the question: "Is consistency more important than intuition?"

  ## 4. Troubleshooting: Predictable Failures
  *   **Failure 1: The Human Exceptionalism Reflex.**
      *   *Prediction:* Committees will allocate 50%+ of the budget to the Human card in Round 1, regardless of the neuron data, then write a principle like "Neuron Count" to disguise it.
      *   *Fix:* During the Audit, point out the math. "Your principle says Cortical Neurons. Human H has 16B. Elephant F has 5.6B. But you gave Elephant F zero credits. That is not a neuron principle; that is a species principle." Force them to own the speciesism.
  *   **Failure 2: Smuggling Biases.**
      *   *Prediction:* "I had a dog, so Card C gets more." or "Whales are smart, I read a documentary."
      *   *Fix:* Enforce the "Data Only" rule strictly in Round 1. If they cite outside info, issue a warning that it invalidates their Audit defense.
  *   **Failure 3: The Cuteness Slide.**
      *   *Prediction:* Ravens and Dolphins get boosted; Pigs and Chickens get zeroed despite data.
      *   *Fix:* In the Debrief, highlight the Chicken (Card B). "You gave the Raven (I) high credits for density. The Chicken (B) has lower density. But both are birds. Is the moral difference biological or aesthetic?"
  *   **Failure 4: Refusal to Allocate Zero.**
      *   *Prediction:* Students feel uncomfortable giving 0 WC to any patient.
      *   *Fix:* Remind them: "Resources are finite. Giving 10 credits to everyone is a refusal to prioritize. You must make the hard choice."

  ## 5. Limitations: The "Cheap Bullet-Bite" Problem
  *   **The Issue:** Because the Welfare Credits are fictional and no animals are actually helped or harmed, students can easily "bite the bullet" (e.g., "Sure, I'd let the human die to save 100 elephants") without emotional cost. This creates a **hypothetical consistency** that may not hold in reality. They may win the Audit by being ruthlessly logical in a way they wouldn't be in a crisis.
  *   **Partial Fix:** In the Debrief, explicitly name this. "You were consistent today because nothing was at stake. This is the **Stakes Problem** in ethics. A theory that works in a seminar room might break in the real world. Does that make the theory wrong, or does it make us weak?" Ask them to write down one allocation they made today that they doubt they could enforce if they were personally responsible for the outcome. This bridges the gap between the game and moral psychology.

  ## 6. Designer's Note on Species Labels
  *Your prompt specified "nothing about species... at first." However, you also requested a list including "Human." If the Round 1 cards are anonymous (Subject A, Subject B), students cannot exhibit the tension between "Human Status" and "Neuron Count" because they won't know which subject is human. To ensure the activity targets the specific philosophical conflict you described (Speciesism vs. Metricism), I have included species names on the Round 1 cards. If you prefer strict anonymity, you must reveal the identities of Round 1 subjects at the start of Round 2, but this delays the species-conflict until the end. The design above prioritizes early tension.*
