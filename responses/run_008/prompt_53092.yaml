answer: |-
  This is an exceptionally sharp set of questions. You have identified precisely the fault line where the neuroscience of the split-brain meets the metaphysics of personal identity. Your tutor's suspicion is well-founded: popular science reporting often treats recent empirical refinements as having definitively refuted the "two minds" hypothesis, whereas in the philosophical literature, the debate is far from settled.

  To help you structure your essay, I will break this down into three sections: the empirical baseline (what is agreed), the conceptual landscape (the competing models of subjecthood), and the epistemic limits (what experiments can and cannot decide).

  ### 1. The Empirical Baseline: What is Actually Agreed?

  Before assessing the interpretations, we must distinguish the robust data from the contested inferences. There is a high degree of consensus on the following points:

  *   **Lateralization and Disconnection:** Severing the corpus callosum significantly reduces information transfer between hemispheres, particularly for complex semantic or visual information. The left hemisphere (LH) is dominant for speech production; the right hemisphere (RH) has superior spatial and facial recognition capabilities but limited speech production.
  *   **Laboratory Dissociation:** Under tachistoscopic conditions (stimuli flashed briefly to one visual field), patients exhibit "cross-cuing" failures. If a picture of a spoon is shown to the left visual field (RH), the patient cannot *say* "spoon," but can pick a spoon out of a bag using the left hand (controlled by RH).
  *   **Everyday Unity:** In naturalistic settings, split-brain patients do not behave like "two people." They do not typically button a shirt with one hand while unbuttoning it with the other (intermanual conflict is rare). They report feeling like a single person.
  *   **Subcortical Leakage:** The disconnection is not absolute. Subcortical pathways (e.g., through the brainstem or anterior commissure if not severed) allow some information transfer, particularly regarding arousal, simple location, or temporal synchrony.
  *   **Recent Forced-Choice Data:** Studies (e.g., Pinto et al., 2017) have shown that under specific forced-choice conditions, patients can perform above chance on tasks requiring integration across visual fields, or can detect stimuli in the "blind" field better than the classic model predicted.

  **Epistemic Status:** These are the accepted phenomena. The dispute begins when we ask what these phenomena imply about the *subject* of experience.

  ### 2. The Three Competing Models of Subjecthood

  You asked for the conceptual difference between "two streams," "one stream with divided access," and "one subject unable to report." These map onto three distinct theoretical models.

  #### Model A: The Two-Subjects View (Sperry, Nagel, early Gazzaniga)
  *   **The Claim:** The surgery creates two distinct centres of consciousness. There is a "Left Person" and a "Right Person."
  *   **The Interpretation of Data:** When the LH speaks, it reports only its own experiences. When the RH acts via the left hand, it is a different subject acting. The everyday unity is an illusion created by the fact that both subjects share the same body and environment, and subcortical leakage allows them to coordinate enough to avoid conflict.
  *   **Philosophical Stake:** This supports Nagel's view that the unity of consciousness is contingent on neural connectivity. It supports Parfit's claim that personal identity can divide.
  *   **Weakness:** It struggles to explain why patients *report* feeling unified. Proponents argue the LH (the speaker) simply confabulates a sense of unity it doesn't actually possess.

  #### Model B: The One-Subject, Disconnected-Modules View (Bayne, Schechter)
  *   **The Claim:** There is only one subject of experience, but that subject's cognitive access is fragmented.
  *   **The Interpretation of Data:** The patient is one person who suffers from a profound cognitive disconnection. The LH and RH are processing modules belonging to the same subject, but they cannot share data.
  *   **Philosophical Stake:** This preserves the intuition that there is only one "I" (the patient), but redefines what it means to be a subject. A subject can have experiences that are not co-conscious. This challenges the **Phenomenal Unity Thesis** (the idea that all conscious experiences at a time are unified into a single phenomenal field).
  *   **Weakness:** It requires a complex account of how one subject can have an experience in the RH that the LH-subject cannot access, without positing two subjects.

  #### Model C: The One-Subject, Reporting-Deficit View (Recent Neuroscientists, e.g., Pinto)
  *   **The Claim:** Consciousness is unified; the surgery only severs specific *reporting* pathways.
  *   **The Interpretation of Data:** The RH *does* have access to the LH's speech centers (via subcortical routes), but only for simple detection, not complex naming. The classic experiments failed because they demanded speech output. When allowed to use forced-choice or non-verbal responses, the "division" disappears.
  *   **Philosophical Stake:** This restores the traditional view of the unified self. The split-brain is a motor/semantic disconnection, not a metaphysical fission.
  *   **Weakness:** It risks conflating *access* (ability to report/use info) with *phenomenality* (what it is like). Just because the RH can guide a hand to a location doesn't prove the *experience* of the stimulus is shared with the LH.

  ### 3. Empirical Hypotheses vs. Conceptual Accounts

  You asked which proposals are competing empirical hypotheses and which are accounts of what "consciousness" is. This is the crux of the matter.

  **Empirical Questions (Potentially Decidable):**
  *   *How much information crosses?* We can measure reaction times and accuracy to determine the bandwidth of subcortical transfer. (Recent work suggests it is higher than Sperry thought).
  *   *Can the hemispheres coordinate?* We can test for intermanual conflict. (It is rare).
  *   *Does the RH understand language?* We can test for semantic priming across fields. (Evidence is mixed).

  **Conceptual/Metaphysical Questions (Not Decidable by Experiment Alone):**
  *   *What constitutes a "subject"?* If the RH processes visual data and guides the hand, but cannot speak, is there a "subject" there?
      *   If you define a subject as **a locus of reportable access**, then there is only one subject (the speaking LH).
      *   If you define a subject as **a locus of phenomenal experience**, the RH might count as a second subject even if it can't speak.
  *   *What is the relationship between Access and Phenomenality?*
      *   Model C assumes that if you can respond accurately (Access), you are conscious (Phenomenality).
      *   Model A and B allow for the possibility that the RH processes information and acts without *phenomenal consciousness*, or with a *separate* phenomenal consciousness.

  **The Crucial Distinction:**
  The recent work (Model C) often claims to have "overturned" the two-minds view. However, this claim often rests on an implicit identification of consciousness with *reportability*. If one holds (as many philosophers do) that phenomenal consciousness can come apart from access (Block's distinction), then showing that the RH can guide a hand does not prove that the LH and RH share a *single phenomenal field*. It only proves they share *information*.

  Therefore, the dispute between "Two Minds" and "One Mind with Disconnected Access" is not purely empirical. It depends on your criteria for subjecthood. No fMRI scan can tell you if there is "one I" or "two I's" because "I" is not a neural variable; it is a metaphysical categorization of neural variables.

  ### 4. How the Marks of Unity Come Apart

  You asked how the familiar marks of unity (co-possession, integration, report) come apart. In split-brain cases, they dissociate in the following ways:

  1.  **Report Unity vs. Phenomenal Unity:** The classic case shows these coming apart. The patient cannot *report* (speech) what the RH sees, but may still *experience* it (indicated by left-hand action). Model C argues report unity is restored via subcortical routes; Model A argues phenomenal unity is lost.
  2.  **Integration Unity:** Normally, I can compare what I see with what I hear. In split-brain patients, the LH cannot compare a word shown to the RVF with an object felt by the left hand (RH). The *functional integration* of experience is broken, even if the *subject* is the same (Model B).
  3.  **Co-possession:** This is the hardest mark. Does the LH "have" the RH's experience?
      *   In Model A: No. There are two owners.
      *   In Model B: Yes, but the owner cannot introspectively access all owned properties simultaneously.
      *   In Model C: Yes, because the information is available to the whole system.

  ### 5. Addressing Your Tutor's Suspicion

  Is the suspicion fair that recent work is over-described as having "simply overturned" Sperry's picture? **Yes, it is fair.**

  Here is why you can argue this in your essay:

  1.  **Methodological Shift, Not Refutation:** The recent studies (like Pinto et al., 2017) often use different methodologies (longer stimulus presentation, forced-choice rather than naming). They show the disconnection is *leakier* than Sperry thought, not that it is *non-existent*. Showing that some information crosses subcortically does not prove that the rich, semantic conscious experience is unified.
  2.  **The "Consciousness" Equivocation:** Many neuroscientists equate "consciousness" with "task performance." Philosophers distinguish "phenomenal consciousness" from "access consciousness." The recent studies prove improved *access*, but they do not settle the *phenomenal* question. The RH might process the data and act on it without the LH "feeling" it.
  3.  **Everyday Unity was Never in Doubt:** Even Sperry and Gazzaniga acknowledged that patients feel unified in daily life. The "two minds" hypothesis was always a theoretical inference from the *lab* dissociation, intended to explain the limits of that unity. Showing that lab performance is better than expected shrinks the gap, but doesn't necessarily close the metaphysical one.
  4.  **Philosophical Resilience:** The "Two Subjects" view remains a live option in philosophy (e.g., defended in various forms by thinkers analyzing the implications of disconnection) because it best explains the *radical* nature of the dissociation when it does occur. If the LH genuinely does not know why the RH acted, positing a second center of agency is the most parsimonious explanation of the *behavior*, even if subcortical links exist.

  ### Summary for Your Essay

  To build on solid parts rather than contested claims, structure your argument around the **Access/Phenomenality distinction**.

  *   **Solid Ground:** It is empirically established that split-brain patients show dissociations between verbal report and non-verbal action, but also show more cross-hemisphere integration than originally thought, and behave as unified agents in daily life.
  *   **Contested Ground:** Whether these findings imply one subject with fragmented access or two subjects with limited communication depends on how one defines "subject" and "consciousness."
  *   **Critical Point:** The recent "one consciousness" reinterpretation relies heavily on conflating successful task performance (access) with unified phenomenal experience. Unless one assumes that reportability is necessary and sufficient for consciousness, the "two minds" hypothesis remains a coherent, albeit controversial, interpretation of the data.

  Your essay will be strongest if you argue that the split-brain case does not provide a simple empirical answer to the question of personal identity. Instead, it forces us to choose between competing definitions of what matters for identity: neural connectivity, phenomenal unity, or narrative report. The science constrains the philosophy, but it does not dictate it.
