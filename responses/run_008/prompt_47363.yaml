answer: |-
  ### 1. Exam question

  **Question 1 (20 Marks)**

  Moore's Paradox is standardly illustrated by (1). However, an adequate theory must explain the wider pattern below. Read the data set carefully.

  (1) "It's raining, but I don't believe it" — absurd to assert, yet plainly consistent: there are situations in which it is raining and the speaker does not believe it (on rainy nights, for instance, the speaker is asleep).
  (2) "It's raining, but John doesn't believe it" — perfectly assertible; often just a useful piece of gossip.
  (3) "It was raining yesterday, but I didn't believe it" — assertible; a natural thing to say when recounting a mistake.
  (4) "It's raining, but no one believes it" — strange to assert, though presumably true whenever rain begins to fall over an empty valley.
  (5) The diary case: a person writes "It's raining, but I don't believe it" in a private diary that no one will ever read, and never says it aloud.

  **Task:** Provide a unified account of the norm governing assertion that predicts this distribution. You must commit to whether the defect in (1) is semantic (logical contradiction) or pragmatic (violation of a rule). Your account must explain why (2) and (3) escape the defect, why (4) is strange differently than (1), and what (5) implies about whether the paradox concerns language or self-knowledge.

  **Limits:** 1500 words maximum. Clarity and coverage of all five items are equally weighted.

  ***

  ### 2. Model answer

  The defect in (1) is pragmatic, not semantic. Semantically, the conjunction is consistent, as the data notes; rain and lack of belief co-occur frequently. The absurdity arises from violating a constitutive norm of assertion: one must assert *p* only if one believes *p*. When I assert "It is raining," I represent myself as believing it is raining. Adding "but I don't believe it" verbally cancels the very condition required to make the first half of the assertion permissible. This is a pragmatic contradiction, akin to promising to arrive while simultaneously stating you have no intention of coming.

  This norm explains the assertibility of (2) and (3). In (2), the belief condition applies to the speaker, not John. I can believe it is raining while correctly reporting John's skepticism. There is no conflict between my current belief state and the content of my assertion regarding John. In (3), the tense shift resolves the paradox. The norm governs current assertion based on current belief. Reporting a past lack of belief does not contradict the current belief required to assert the rain occurred. I currently believe it rained; I merely report that I previously lacked that belief.

  Item (4) presents a distinct strangeness. Unlike (1), which is self-defeating for the speaker at the moment of utterance, (4) is self-defeating upon uptake. If I assert (4) successfully, I invite you to believe it is raining. If you accept my assertion, you now believe it is raining. Consequently, the second conjunct ("no one believes it") becomes false because at least two people (you and I) now believe it. The defect here is not merely speaker-relative inconsistency but a guarantee that successful communication falsifies the content asserted. It is a performative contradiction regarding the common ground, rather than a violation of the speaker's individual sincerity condition.

  Finally, (5) determines the scope of the paradox. If the diary entry feels absurd despite lacking an audience, the defect lies not in public assertion norms but in the nature of belief itself. This suggests Moore's paradox is ultimately about self-knowledge. To believe *p* is to take *p* as true; to judge "I believe *p*" is to judge *p*. Writing the diary entry requires judging that it is raining (to write the first conjunct) while simultaneously judging that one lacks that judgment (for the second). If the absurdity persists without assertion, the tension is constitutive of conscious belief, not just speech. Thus, while the norm of assertion explains the public absurdity of (1), the diary case reveals that the root issue is the transparency of belief: we cannot coherently hold the belief state described in the conjunction, regardless of whether we speak it.

  ***

  ### 3. Marking scheme

  **Total Marks: 20**

  **1. Semantic vs. Pragmatic Commitment (4 Marks)**
  *   **Full marks:** Explicitly identifies the defect in (1) as pragmatic (violation of a norm) rather than semantic (logical contradiction), citing the consistency of the proposition.
  *   **B-grade miss:** Hedges between the two or claims it is a "contradiction" without distinguishing logical form from norms of use.

  **2. Explanation of Person and Tense Shifts (4 Marks)**
  *   **Full marks:** Correctly applies the norm to the speaker's current state to explain why (2) (third-person) and (3) (past tense) are valid.
  *   **B-grade miss:** Explains (1) well but treats (2) and (3) as exceptions rather than consequences of the same norm.

  **3. Analysis of Item (4) (4 Marks)**
  *   **Full marks:** Distinguishes (4) from (1) by noting the role of hearer uptake; successful assertion makes the content false.
  *   **B-grade miss:** Treats (4) as identical to (1) or fails to notice the falsification via acceptance.

  **4. Analysis of Item (5) (4 Marks)**
  *   **Full marks:** Uses the diary case to argue whether the paradox is linguistic (assertion-only) or psychological (belief-constitution).
  *   **B-grade miss:** Dismisses (5) as "still weird" without linking it to self-knowledge or the nature of belief.

  **5. Unified Account (4 Marks)**
  *   **Full marks:** Uses a single norm (e.g., Knowledge or Belief Norm) to explain all five items coherently.
  *   **B-grade miss:** Offers piecemeal explanations that work for (1) but require ad hoc adjustments for (4) and (5).

  **Penalties:**
  *   **Buzzword Penalty (-2):** Using terms like "pragmatic contradiction" or "common ground" without defining the norm that generates them.
  *   **Logic Penalty (-2):** Claiming (1) is logically false (semantic contradiction) rather than pragmatically defective.
  *   **Scope Penalty (-2):** Ignoring item (4) or (5) entirely to focus on the standard Moorean sentence.
