  # Joint Statement on Individual Acts and Collective Harms

  **Prepared by:** Camp A ("The Difference Makers") and Camp B ("The Causalists")
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Ethical Efficacy

  ## I. Agreed Claims

  After three weeks of structured dialogue, both camps affirm the following claims as an accurate description of our shared understanding of the problem space. We agree on the mechanics of the scenarios and the gravity of the harms, even where we diverge on moral evaluation.

  1.  **Collective harms are real and morally urgent.** Both camps agree that phenomena like industrial animal suffering, climate change, and democratic erosion constitute significant moral problems that demand remediation. Neither camp denies the severity of the outcomes described in the test cases.
  2.  **Thresholds and buffers exist in supply chains.** We agree that real-world systems (like the cafeteria's meat procurement or the "10,000 Diners" scenario) often operate with buffers. A single individual's choice frequently fails to trigger an immediate, discrete negative outcome (e.g., one less chicken slaughtered) due to bulk ordering or inventory slack.
  3.  **Expected value is mathematically coherent.** Both camps accept the mathematical validity of expected utility calculations (probability $\times$ magnitude). We disagree on whether this calculation exhausts moral reasoning, but we agree it is a legitimate tool for analyzing risk and impact.
  4.  **Systemic change is necessary.** Both camps agree that relying solely on individual consumer choice is insufficient to solve collective action problems. Policy, regulation, and institutional reform are required regardless of the moral status of individual acts.
  5.  **The "Pivotality" condition is rare.** We agree that in large-scale elections or mass markets, the probability of a single act being strictly pivotal (the exact vote or order that crosses a threshold) is statistically negligible, though not strictly zero.
  6.  **Moral language requires precision.** We acknowledge that terms like "making a difference," "causing harm," and "responsibility" are used differently by each camp. We commit to distinguishing between *causal efficacy* (changing the outcome) and *moral participation* (joining a practice).

  ## II. Residual Disagreements

  The following table outlines the precise points of divergence. We have drafted the position statements in language each camp finds acceptable, avoiding caricature. We have also distinguished between *substantive* disagreements (conflicts in ethical theory or empirical belief) and *verbal* disagreements (conflicts in definition or terminology).

  | Topic | Camp A ("Difference Makers") Position | Camp B ("Causalists") Position | Type |
  | :--- | :--- | :--- | :--- |
  | **Moral Status of Inefficacious Acts** | An act can be morally wrong if it participates in a harmful practice, even if it does not causally alter the outcome. Complicity generates obligation. | An act cannot be morally wrong solely due to a harm it does not actually cause. Without causal efficacy, the act is morally neutral regarding that harm. | Substantive |
  | **Role of Expected Value** | Expected harm (probability $\times$ magnitude) is sufficient to establish a *pro tanto* moral reason against an act, even if the expected outcome does not materialize. | Expected value is an epistemic tool for decision-making under uncertainty, not an ontological claim about harm. Only actualized harm creates moral wrongness. | Substantive |
  | **Definition of "Causal Contribution"** | To "make a difference" includes being a non-redundant part of a set of conditions that collectively produce harm (INUS condition). | To "make a difference" requires being a *necessary* condition for the harm; if the outcome would have occurred without the act, the act made no difference. | Verbal |
  | **Locus of Obligation** | Individual duty to abstain exists alongside collective duty. Personal purity and political action are complementary moral requirements. | Individual duty is derivative of collective duty. Abstention is only required if it effectively contributes to systemic change; otherwise, it is supererogatory. | Substantive |

  ## III. Cruxes and Testable Predictions

  The following cruxes identify specific questions where further evidence or reflection could shift the position of at least one camp. For each crux, we have identified a test case and recorded our predictions in advance.

  | Crux Question | Agreed Test Case / Evidence | Camp A Prediction | Camp B Prediction |
  | :--- | :--- | :--- | :--- |
  | **Do individual choices aggregate to shift thresholds despite buffers?** | **Empirical Study:** A longitudinal analysis of a cafeteria that removes meat options for 10% of students vs. one where 10% of students independently choose vegetarian meals. Measure long-term procurement adjustments. | Individual choices aggregate to shift procurement baselines over time, even with buffers. The "signal" matters as much as the immediate "noise." | Buffers absorb individual variance. Procurement only shifts when institutional policy changes, not when individual choices fluctuate within the buffer zone. |
  | **Is complicity sufficient for moral blame without causal efficacy?** | **Intuition Pump:** "The 10-Shooter Squad." 10 shooters fire at a prisoner. 5 bullets are lethal; 5 are non-lethal but indistinguishable. All shooters know the setup. Is the shooter of a non-lethal bullet guilty of murder? | Yes. All 10 are guilty of murder because they intentionally participated in a lethal practice as a collective unit. | No. Only the 5 whose bullets caused death are guilty of murder; the others are guilty of attempted murder or endangerment, but not the killing itself. |
  | **Does the verbal definition of "impact" drive the moral intuition?** | **Semantic Test:** Re-framing the individual act as "adding to the demand curve" vs. "triggering a specific unit of production." | The moral wrongness persists regardless of phrasing; the act is wrong because it supports the demand curve. | The moral wrongness disappears when phrasing clarifies no specific unit of production was triggered; the act is neutral. |

  ***

