answer: |-
  **Dissertation Proposal**

  **Title:** Foundations and Fallacies: An Epistemic Assessment of Moral Foundations Theory's Normative Implications

  **1. Introduction and Background**

  Moral Foundations Theory (MFT) has become one of the dominant frameworks in contemporary moral psychology. It posits that human moral judgement is not the product of a single, unified reasoning process, but rather draws upon a set of innate, evolved psychological systems. The canonical model identifies five (later six) foundations: Care/Harm, Fairness/Cheating, Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation, and Liberty/Oppression.

  The empirical claim central to MFT is that political orientation correlates with the utilisation of these foundations. Broadly speaking, individuals on the political left tend to rely heavily on Care and Fairness, whereas individuals on the political right distribute their moral reliance more evenly across all foundations. While this is ostensibly a descriptive, psychological claim, it has precipitated a vigorous normative debate. Two opposing camps have emerged, both attempting to leverage MFT to claim superiority for their respective political moralities.

  On one side, critics from the left argue that the right-wing reliance on Loyalty, Authority, and Sanctity reveals conservative morality to be downstream of arational instincts—specifically tribalism and disgust responses. This is deployed as a debunking argument: if right-wing beliefs are caused by 'primitive' emotions, they lack rational justification. On the other side, Jonathan Haidt and proponents of MFT argue that the left suffers from 'moral colourblindness.' By ignoring three (or four) of the foundations, the left possesses an impoverished moral palate. Here, the argument is that a wider spread of foundations constitutes a wiser, more complete morality.

  My dissertation posits that both moves are philosophically premature. They attempt to derive normative conclusions from psychological aetiologies without establishing the necessary epistemic link between the two. A psychological explanation of a belief only undermines that belief if the causal process is insensitive to the truth. If the 'disgust' response tracks genuine moral violations (e.g., regarding bodily integrity or social cohesion), then explaining it psychologically does not debunk it. Conversely, having 'more' foundations does not guarantee better access to moral truth if those additional foundations are systematically misleading.

  This project will not contest the empirical findings of MFT. Instead, it will treat them as premises for a philosophical investigation into the epistemology of moral belief. The core task is to determine whether the differential activation of foundations entails an asymmetry in truth-conduciveness, or whether the normative implications of MFT are ultimately symmetrical and thus silent.

  **2. Research Question**

  The primary research question is:

  *To what extent does the differential aetiology of moral judgements described by Moral Foundations Theory sustain an epistemic asymmetry between liberal and conservative moral frameworks?*

  This breaks down into three subordinate questions:
  1.  What conditions must be met for a psychological aetiology to function as a valid debunking argument in ethics?
  2.  Do the 'binding' foundations (Loyalty, Authority, Sanctity) meet these conditions differently than the 'individualising' foundations (Care, Fairness)?
  3.  Does the 'completeness' argument (that using more foundations is better) hold under scrutiny, or does it commit a quantitative fallacy regarding moral truth?

  **3. Rationale and Critical Gap**

  The existing discourse surrounding MFT suffers from a category error. It conflates the *origin* of a belief with its *justification*. This is often dismissed simply as the 'genetic fallacy,' but that is too hasty. In evolutionary epistemology, the origin of a cognitive faculty is relevant to its reliability. If our moral faculties were evolved for fitness rather than truth, that is a defeater for moral realism.

  However, the current political application of MFT is more specific. It suggests an asymmetry: that the *right's* foundations are suspect (due to disgust/tribalism) or that the *left's* foundations are insufficient (due to narrowness). Neither side defends the assumption that specific foundations are more truth-tracking than others. The left assumes Care/Fairness are rational and Loyalty/Sanctity are not. Haidt assumes that a broader set of intuitions is more likely to capture moral reality than a narrow set.

  My dissertation fills this gap by isolating these assumptions. I will argue that without an independent account of what moral truth consists in, MFT cannot arbitrate between political moralities. If moral truth is grounded in well-being (a common assumption), Care/Harm might be privileged. If moral truth is grounded in social cohesion, Loyalty/Authority might be privileged. MFT itself does not decide between these meta-ethical commitments. Therefore, the 'normative punchline' of MFT is usually smuggled in rather than derived.

  **4. Methodology**

  This project will be conducted primarily through conceptual analysis and philosophical argumentation. It is not an empirical study; I will not be collecting survey data or running psychological experiments.

  *   **Arm's-Length Empiricism:** I will accept the core empirical claims of MFT as given for the sake of argument (i.e., that the foundations exist and are distributed differently across the political spectrum). This avoids the trap of critiquing the psychology, which is outside the scope of a philosophy dissertation.
  *   **Epistemic Analysis:** The core method involves applying standards from evolutionary epistemology and debunking arguments (e.g., the Benacerraf-Field challenge) to the specific case of MFT. I will analyse the structure of the inference from 'Foundation X causes Belief Y' to 'Belief Y is unjustified.'
  *   **Conditional Modelling:** Rather than attempting to solve the meta-ethical status of moral truth (which is too large a task), I will employ a conditional approach. I will examine how the normative implications of MFT shift under different assumptions about moral truth (e.g., 'If moral truth is X, then MFT implies Y').

  **5. Scope and Feasibility**

  A 12,000-word dissertation over a single semester is a tight constraint. The topic, as initially conceived, risks expanding into two areas that would jeopardise completion: the specific dynamics of the Liberty/Oppression foundation, and deep meta-ethical realism vs. anti-realism. To ensure the project is deliverable, I will implement the following scope limitations:

  *   **Exclusion of Liberty/Oppression:** The Liberty foundation was added later to the MFT model and its empirical status is sometimes treated as distinct from the original five. Including it complicates the 'Left vs. Right' dichotomy (as Liberty often appeals to libertarians and some left-liberals). I will restrict the analysis to the original five foundations to maintain a clear contrast between the 'individualising' (Care, Fairness) and 'binding' (Loyalty, Authority, Sanctity) clusters.
  *   **Bracketing Meta-Ethics:** I will not attempt to defend moral realism or anti-realism. Instead, I will treat 'truth-conduciveness' as a functional requirement. The argument will focus on whether the *process* described by MFT is sensitive to truth conditions, whatever those conditions turn out to be. This prevents the dissertation from becoming a general treatise on meta-ethics.
  *   **Focus on Asymmetry:** The dissertation will not attempt to prove which side is 'right.' It will focus strictly on whether MFT provides *asymmetric* evidence. A conclusion that the evidence is symmetrical (i.e., MFT debunks or vindicates both sides equally) is a successful outcome, not a failure.

  **6. Chapter Outline**

  *   **Introduction (1,500 words):** Overview of MFT, the political debate, and the central thesis regarding the gap between aetiology and normativity.
  *   **Chapter 1: The Structure of Debunking Arguments (3,000 words):** Philosophical analysis of when psychological origins undermine justification. Distinguishing between 'off-track' and 'on-track' causal processes.
  *   **Chapter 2: The Leftist Debunking of the Right (3,000 words):** Examining the claim that binding foundations are merely disguised disgust or tribalism. Assessing whether this aetiology is necessarily truth-insensitive.
  *   **Chapter 3: The Haidtian Critique of the Left (3,000 words):** Examining the claim that the left is 'morally colourblind.' Assessing whether 'more foundations' equates to 'better epistemic access.'
  *   **Conclusion (1,500 words):** Synthesis of findings. Determining whether MFT is normatively silent, symmetric, or asymmetrically supportive.

  **7. Success and Failure Conditions**

  It is vital to define what constitutes a successful project given the philosophical nature of the inquiry.

  *   **Success:** The dissertation successfully demonstrates that the standard political appropriations of MFT rely on undefended assumptions about truth-tracking. It will clearly map the conditions under which MFT *could* support a normative claim (e.g., 'MFT supports the Right *only if* Sanctity tracks moral truth'). Even if the conclusion is that MFT is normatively silent, the project succeeds if it rigorously proves *why* it is silent.
  *   **Failure:** The project would fail if it becomes bogged down in defending the empirical validity of MFT itself, or if it attempts to resolve the meta-ethical nature of moral truth. It would also fail if it merely restates the psychological findings without performing the epistemic analysis. Finally, if I cannot articulate the specific assumptions that both sides smuggle in, the critique will remain vague.

  **8. Risk Management and Timeline**

  The primary risk is scope creep regarding meta-ethics. To mitigate this, I will adhere strictly to the conditional methodology outlined above. I will not ask 'What is moral truth?' but 'Does this process track truth, assuming truth exists?'

  *   **Weeks 1-3:** Refine literature review on evolutionary debunking arguments; finalise chapter plan.
  *   **Weeks 4-7:** Draft Chapters 1 and 2 (The theoretical framework and the Leftist critique).
  *   **Weeks 8-10:** Draft Chapters 3 and 4 (The Haidtian critique and synthesis).
  *   **Weeks 11-12:** Revision, editing, and ensuring British English conventions are met.

  **9. Conclusion**

  Moral Foundations Theory offers a fascinating description of how we judge, but it is frequently misused to prescribe how we *should* judge. By isolating the epistemic assumptions required to move from 'is' to 'ought' in this context, this dissertation aims to clarify the limits of moral psychology in political philosophy. Whether the outcome is a vindication of one side or a stalemate, the value lies in exposing the hidden philosophical premises in popular scientific discourse. Given the scope restrictions on the Liberty foundation and meta-ethical commitments, this is a manageable and focused project for a one-semester MA dissertation.
