answer: |-
  # Dissertation Defense Q&A Preparation Sheet
  **Project:** Localized Dialetheism with Truth/Assertion Split
  **Committee Profile:** 4 Classical Metaphysicians/Phil-Sci (Reductio-dependent), 1 Proof Theorist (Structural rules-focused).
  **Status:** 6 Weeks to Defense.

  **Instructions for Use:** This sheet is not optimistic. It identifies where your argument is vulnerable to *this* specific audience. Where a reply is marked "High Risk," you must stress-test that specific line with your advisor. The "Premise at Risk" indicates which of your three argumentative steps collapses if the reply fails.

  ---

  ### 1. The Normativity of Belief Objection
  **Asker:** Metaphysician (Normativity interest)
  **Idiom:** "Rational acceptance," "Guidance," "Doxastic state."
  **Question:** "You claim we ought to *accept* the Liar sentence as both true and false. But belief aims at truth, and rational belief guides action. If I believe $P$ and $\neg P$, what am I to do? If I believe it will rain and not rain, I cannot decide whether to carry an umbrella. If your logic severs the link between truth and rational belief guidance, you haven't solved the paradox; you've just changed the subject. What does it *mean* to accept a contradiction?"

  **Reply (2 min):**
  "I distinguish between *acceptance* as a theoretical commitment to a model and *belief* as a guide to mundane action. My view is localized: the contradiction exists in the semantic fragment, not in the meteorological fragment. In ordinary contexts, the Assertoric Operator ($A$) functions classically for decision theory. I am not advising you to have contradictory expectations about the weather. I am advising that our best theory of *truth* requires a commitment to $T(\lambda) \land T(\neg \lambda)$ in the semantic meta-language. The normativity holds: you ought to accept the best explanation of the semantic data. That explanation happens to be dialetheic in a narrow domain, but this does not paralyze action because the $A$-operator governing practical inference remains consistent in non-semantic domains."

  **Damage Assessment:** **High.** If they reject the distinction between "theoretical acceptance" and "guiding belief," your view becomes unlivable.
  **Soft Spot:** You are relying on the intuition that one can hold a theoretical commitment without it affecting practical reasoning. Classical epistemology often rejects this fragmentation.
  **Premise at Risk:** **Step 2 (Quarantine).** If the contradiction infects the normativity of belief, it is not quarantined by subject matter.
  **AI Uncertainty:** I am assuming the metaphysician will accept a fragmented normativity. If they hold a unified view of rationality, this reply will fail.

  ### 2. The Structural Rules Objection
  **Asker:** Proof Theorist
  **Idiom:** "Cut-elimination," "Transitivity," "Sequent calculus," "Well-behaved."
  **Question:** "You propose a paraconsistent consequence relation to block explosion. Fine. But to do so, you must restrict structural rules, likely Transitivity or Cut. If your consequence relation isn't transitive, you cannot chain inferences. If you cannot chain inferences, you cannot do mathematics, even in the 'consistent' fragment. Show me the sequent calculus for your split truth/assertion system. Does it admit Cut? If not, why should I call it a logic?"

  **Reply (2 min):**
  "The system admits Cut within the consistent fragment governed by the Assertoric Operator ($A$). The restriction on Explosion arises not from breaking Transitivity globally, but from the failure of the T-schema to interact with $A$ in a way that generates ECQ (Ex Contradictione Quodlibet). The transparent truth predicate ($T$) is governed by rules that allow $T(A) \vdash A$ and $A \vdash T(A)$, but the interaction with negation is restricted in the derivation of $\bot$. I am not proposing a logic where modus ponens fails generally; I am proposing a logic where the T-schema does not license the derivation of arbitrary conclusions from semantic contradictions. The calculus is well-behaved for the fragment that matters for science."

  **Damage Assessment:** **High.** If the Proof Theorist demonstrates your calculus is ill-behaved (e.g., fails Cut in the consistent fragment), the formalism is dead.
  **Soft Spot:** You must have the formalism ready. If you hand-wave the proof theory, this committee member will tank the defense.
  **Premise at Risk:** **Step 1 (Soundness of Liar Reasoning).** If the logic cannot formally sustain the reasoning without collapsing, the argument isn't sound.
  **AI Uncertainty:** I do not know the specific details of your calculus. If your split requires non-standard structural rules in the "consistent" part, this reply is false.

  ### 3. The Recapture/Leakage Objection
  **Asker:** Philosopher of Science
  **Idiom:** "Contamination," "Classical recapture," "Mathematical practice."
  **Question:** "You say the contradiction is quarantined. But semantic predicates can be defined over mathematical domains (e.g., 'This sentence of arithmetic is true'). If a contradiction arises in a sentence about arithmetic, does it infect the arithmetic? You say 'no classical recapture is needed' because of your split. But if I use a truth predicate in a proof about primes, and that predicate is transparent, don't I now have a contradiction in my number theory?"

  **Reply (2 min):**
  "This is why the split between $T$ and $A$ is crucial. In mathematical practice, we use the Assertoric Operator ($A$), not the Transparent Truth predicate ($T$), for generalizing and proving. We assert $\forall x \phi(x)$. We do not typically assert $T(\ulcorner \forall x \phi(x) \urcorner)$ as a premise in the derivation of $\phi(n)$. The leakage only occurs if we conflate $T$ and $A$. My claim is that mathematical practice *already* implicitly distinguishes these. We use truth talk loosely, but the inferential work is done by $A$. Since $A$ is consistent in the mathematical fragment, the contradiction in $T$ cannot leak into the proof of Fermat's Last Theorem."

  **Damage Assessment:** **Medium-High.** This targets the core novelty of your thesis.
  **Soft Spot:** **[TARGETS SPLIT]** This reply relies entirely on the claim that mathematical practice aligns with your $A$-operator. If the committee argues that standard mathematical truth *is* transparent truth, you lose.
  **Premise at Risk:** **Step 3 (The Split/No Recapture).** If the split doesn't hold in mathematical contexts, you need recapture, and you admitted you don't have a recapture story.
  **AI Uncertainty:** I am unsure if the Phil-Sci member will buy that mathematicians don't rely on transparent truth. Many hold that mathematical truth is exactly the transparent notion.

  ### 4. The Coherence of the Split Objection
  **Asker:** Any Member (Likely Metaphysician)
  **Idiom:** "Ad hoc," "Two notions," "Theoretical cost."
  **Question:** "You posit two truth-like notions to solve the problem. $T$ for semantics, $A$ for assertion. But when I say 'It is true that snow is white,' am I using $T$ or $A$? If you say it depends, you are making truth context-sensitive in a radical way. If you say it's $A$, then $T$ is useless. If it's $T$, then we have contradictions everywhere. Isn't this split just an ad hoc device to save the phenomenon without paying the price?"

  **Reply (2 min):**
  "It is not ad hoc; it is descriptive of the dual role truth plays. We need a device for semantic evaluation ($T$), which must be transparent to capture the T-schema. We need a device for inference and generalization ($A$), which must be consistent to preserve utility. Natural language conflates them, which causes the paradox. My theory disentangles them. It is no more ad hoc than distinguishing sense and reference, or type and token. The cost is positing an ambiguity, but the benefit is retaining classical reasoning for science while accepting the semantic data."

  **Damage Assessment:** **Medium.** This attacks the elegance of the solution.
  **Soft Spot:** **[TARGETS SPLIT]** This is the most direct attack on Step 3. If they view the split as a technical trick rather than a philosophical insight, the theory looks engineered.
  **Premise at Risk:** **Step 3 (The Split).**
  **AI Uncertainty:** Metaphysicians hate "ambiguity" solutions to paradoxes (e.g., Russell's ambiguity response). They may view this as a disqualified move.

  ### 5. The Law of Non-Contradiction (LNC) Objection
  **Asker:** Metaphysician (Classical)
  **Idiom:** "Conceptual truth," "Impossible," "Category error."
  **Question:** "You say some contradictions are true. But the LNC is a condition on the possibility of meaning. To assert $P$ is to exclude $\neg P$. If you assert both, you assert nothing. You aren't describing a world with contradictions; you are failing to describe a world at all."

  **Reply (2 min):**
  "That assumes the classical definition of assertion, which presupposes consistency. I am arguing that the Liar shows this definition is too narrow for the semantic fragment. I am not asserting $P$ and $\neg P$ in the sense of holding incompatible world-guided beliefs. I am asserting that the sentence $\lambda$ satisfies the condition for truth and the condition for falsity. This is a claim about linguistic norms, not a claim about the world containing contradictory objects. The LNC holds for the world; my claim is that it does not hold for the semantic predicates we use to describe the world."

  **Damage Assessment:** **Medium.** This is a standard stalemate. They will likely remain unconvinced, but it won't fail the defense if the rest holds.
  **Soft Spot:** You are redefining "assertion." If they hold that assertion *just is* classical, you are talking past them.
  **Premise at Risk:** **Step 1 (Soundness of Liar).**
  **AI Uncertainty:** None. This is a standard dialectical impasse.

  ### 6. The Ad Hoc Quarantine Objection
  **Asker:** Metaphysician
  **Idiom:** "Arbitrary line," "Sorites," "Boundary."
  **Question:** "You say the contradiction is in the 'semantic fragment.' But language is continuous. I can construct a Curry sentence involving a physical predicate. 'If this sentence is true, then the earth is flat.' Where does the quarantine line lie? If you draw it by fiat, the theory is unstable."

  **Reply (2 min):**
  "The line is not drawn by fiat but by predicate type. The paradoxes arise specifically from the interaction of self-reference and the truth predicate. Physical predicates do not generate self-reference in the same way without invoking semantic vocabulary. The quarantine is based on the *source* of the inconsistency (the T-schema), not an arbitrary list of topics. As long as the derivation relies on the T-schema, it is in the semantic fragment. If it relies on physical laws, it is not."

  **Damage Assessment:** **Low-Medium.**
  **Soft Spot:** Curry paradoxes can be constructed with property predicates, not just truth. If your quarantine relies on "truth" specifically, you must explain why property abstraction doesn't trigger the same issue.
  **Premise at Risk:** **Step 2 (Quarantine).**
  **AI Uncertainty:** If your view is strictly about the *truth predicate*, Curry might be a problem if you treat properties similarly to truth.

  ### 7. The Truth Pluralism Motivation Objection
  **Asker:** Metaphysician
  **Idiom:** "Unity of truth," "Theoretical virtue."
  **Question:** "Why should we accept a pluralist view of truth? The unity of truth is a major theoretical virtue. You are sacrificing unity to save classical logic in science. Why not just sacrifice classical logic globally (global dialetheism) or sacrifice transparent truth (classical recapture)? Why this middle path?"

  **Reply (2 min):**
  "Global dialetheism is too costly for scientific practice; classical recapture is technically complex and often fails to capture the intuitive validity of the Liar reasoning. My middle path preserves the intuitive data (the Liar is sound) and the practical utility (science is consistent) by recognizing that 'truth' was doing two jobs. We sacrifice the *unity* of the word 'truth' to save the *utility* of truth-talk. It is the minimal revision required to save the phenomena."

  **Damage Assessment:** **Low.** This is a "why this?" rather than a "this is false."
  **Soft Spot:** They may argue that sacrificing unity is a greater cost than you admit.
  **Premise at Risk:** **Step 3 (The Split).**
  **AI Uncertainty:** None.

  ### 8. The Communicative Practice Objection
  **Asker:** Metaphysician
  **Idiom:** "Communication," "Disagreement," "Assertion."
  **Question:** "If I assert $P$ and you assert $\neg P$, we disagree. If you accept both, do we disagree? If contradictions are acceptable, the norm of assertion collapses. How can we communicate if the exclusionary nature of assertion is gone?"

  **Reply (2 min):**
  "Communication relies on the Assertoric Operator ($A$), which remains exclusionary in non-semantic contexts. In the semantic fragment, we agree that $\lambda$ is both. There is no disagreement there to manage. In ordinary contexts, $A$ functions classically, so disagreement functions normally. The norm of assertion is preserved where it matters for communication."

  **Damage Assessment:** **Low.**
  **Soft Spot:** **[TARGETS SPLIT]** Again relies on the $T$/$A$ distinction holding up in conversation.
  **Premise at Risk:** **Step 3.**
  **AI Uncertainty:** None.

  ---

  ### The Question I Hope Nobody Asks
  **Question:** "You claim the split between Transparent Truth ($T$) and Assertoric Operator ($A$) solves the need for recapture. But in mixed inferences (e.g., 'The Liar is true, and if the Liar is true then arithmetic is inconsistent'), how do you block the explosion? If $T$ feeds into $A$, you get explosion. If $T$ cannot feed into $A$, then your logic is not a single system but two disconnected languages. How do you formally specify the interface between $T$ and $A$ without reintroducing the paradox at the boundary?"

  **Why this is dangerous:** This targets the *interface* of your novel contribution. If you cannot specify the interaction rules between $T$ and $A$ precisely, the Proof Theorist will call it "ill-defined" and the Metaphysicians will call it "magic." This is the weakest point of a "split" theory.
  **Preparation:** You need a specific rule for $T \to A$ transitions. If you don't have one written down, draft one immediately.

  ---

  ### Critical Vulnerability Assessment (AI Reasoning Confidence)

  1.  **Low Confidence:** **The Proof Theorist's Tolerance.** I have assumed the Proof Theorist will accept a paraconsistent logic if it is "well-behaved." However, some proof theorists view the *loss of Explosion* itself as a loss of "well-behavedness" regardless of Cut/Transitivity. If this member defines "logic" as requiring ECQ, no formal reply will work. *Stress-test:* Ask your advisor if this member has ever accepted LP or K3 as a "logic."
  2.  **Low Confidence:** **The "Split" Intuition.** I have assumed the committee will treat the $T$/$A$ split as a philosophical distinction. They may treat it as a technical evasion. If they view "Truth" as univocal by definition, Step 3 is a non-starter. *Stress-test:* Prepare a defense of truth-pluralism that does not rely on the paradox (e.g., appeal to ordinary language ambiguity).
  3.  **High Confidence:** **The Normativity Objection.** This is the standard attack on dialetheism. Your reply is standard but risky. If the Normativity Metaphysician digs in, you will not convert them. Your goal here is not to convince, but to show the position is *rational*, not that it is *obvious*.

  **Final Instruction:** For Objections 1, 2, and 3, do not attempt to "win." Attempt to show coherence. For Objection 4 (The Split), you must win, as it is your unique contribution. If the Split fails, the thesis fails.
