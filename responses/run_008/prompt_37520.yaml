      *   *Coining a Term (if needed):* "Hinge Commitments" is standard enough, but maybe "Epistemic Grounding" or "Framework Certainties." Let's stick with Wittgenstein's terminology but clarify it, as it's the established name. Actually, the user asked to coin a term *if* nothing fits. Hinge Propositions fits very well. I will use that but refine the definition to match their specific phenomenological description. I might suggest "Epistemic Hinges" to distinguish from the propositional aspect.
      *   *Therapeutic/Practical Note:* Connect back to the gaslighting. Gaslighting attacks the hinges. Recovery is re-establishing healthy hinges.

  6.  **Refining the Tone:**
