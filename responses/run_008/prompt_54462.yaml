  8.  **Tone:** Academic but accessible, rigorous, honest, slightly conversational (matching the user's "rabbit hole" vibe).

  9.  *(Self-Correction during drafting)*: Make sure to explicitly mention *why* (1) and (2) are in tension. If you reject SIA (2), you default to SSA. SSA implies Doomsday. So (1) and (2) clash. This is often more immediate than the Multiverse case.

