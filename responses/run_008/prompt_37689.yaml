          1.  Reconstruct the implicit theory of what a geologic time unit *is* that makes the current practice (ICS/CHRONOS) make sense.
          2.  Analyze whether the different parts of the practice (voting vs. discovery talk, golden spike vs. global signal) presuppose consistent things or are in tension.
          3.  Explain what would have to change in the definition of epochs if they were defined by *causes* (like human activity) rather than physical markers in the dirt.
          4.  Address underdetermination: Are there different theories of epochs compatible with the "golden spike" rule?
      *   **Tone:** Intellectual, respectful, acknowledging the sophistication of the question (this is a philosophy of science question disguised as an earth science question), but accessible.
