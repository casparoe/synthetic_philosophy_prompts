answer: |-
  Welcome to the posting side of things! You've hit on one of the most fascinating and enduring puzzles in decision theory. Hofstadter's *Metamagical Themas* columns from the 80s are legendary for a reason—they sit right at the intersection of game theory, logic, and philosophy.

  You have a very strong grasp of the intuition, but your skepticism about the "bloc-voting" mechanic is well-founded. Let's break down where the picture gets fuzzy, clarify the Platonia vs. Luring Lottery distinction, and situate superrationality in the modern decision theory landscape.

  ### 1. The Platonia Correction (It's not just "Cooperate")
  First, a small but crucial correction on the Platonia Dilemma. In the standard Prisoner's Dilemma, superrationality leads to deterministic Cooperation. However, in Hofstadter's specific **Platonia Dilemma** (20 people, win if *exactly one* sends a letter), the superrational solution is **not** for everyone to deterministically "cooperate" by sending a letter.

  If everyone reasons identically and decides "Send," then 20 letters arrive, and everyone gets $0. If everyone decides "Don't Send," 0 letters arrive, and everyone gets $0. Because the players are symmetric, they must all choose the *same* strategy. The only symmetric strategy that yields a positive expected value is a **mixed strategy**: everyone randomizes, sending a letter with probability $1/20$.

  So, in Platonia, superrationality doesn't mean "we all vote to Send." It means "we all vote to adopt the same probability distribution." This is a key distinction because it shows that superrationality isn't just about maximizing group utility blindly; it's about finding the symmetric equilibrium that maximizes expected utility given the constraint that everyone does the same thing.

  In the **Luring Lottery**, however, you are exactly right. Since the prize is divided by the total number of entries, if everyone reasons identically, they realize that sending $k$ entries results in everyone sending $k$ entries, which dilutes the prize by $k^2$ relative to your share. The optimal symmetric move is indeed to send exactly one entry.

  ### 2. Where the "Bloc-Voting" Picture Goes Wrong
  Your intuition that this "proves too much" is spot on. The bloc-voting model relies on a premise that is incredibly fragile in the real world: **Logical Homogeneity.**

  Superrationality only works if you are certain that the other players are running the same "mental source code" as you.
  *   **In a homogeneous group:** If everyone is a superrationalist, they solve the commons problem beautifully. They coordinate without communication.
  *   **In a heterogeneous group:** If there is even one standard "rational actor" (a Game Theorist using Causal Decision Theory) in the mix, the superrationalists get exploited.

  Take the Luring Lottery. If 99 superrationalists send 1 entry each, and 1 standard rationalist realizes this, the standard rationalist's best move is to send 1,000 entries. They will win almost the entire pot, and the superrationalists get crumbs. The superrational strategy is not a Nash Equilibrium; it is not stable against defection.

  So, to answer your question: **Yes, the "one defector ruins it" worry is fatal to the *group outcome* in a mixed population.** Superrationality doesn't solve the commons problem for humanity; it only solves it for a community of identical minds. In the real world, where reasoning styles vary, relying on superrationality is often a sucker's bet.

  ### 3. Is Superrationality a "Real" Decision Theory?
  It is more than a cute thought experiment, but it isn't "standard" economics. In academic game theory, Nash Equilibrium (based on Causal Decision Theory, or CDT) remains king because it makes fewer assumptions about the other players.

  However, in the world of AI alignment and modern rationalist philosophy (specifically around MIRI and LessWrong), Hofstadter's superrationality is recognized as the grandfather of **Functional Decision Theory (FDT)** and **Timeless Decision Theory (TDT)**.

  These modern theories formalize Hofstadter's intuition. They argue that your decision is an output of an algorithm. If another agent is running a similar algorithm, your decision *logically determines* theirs, not because you causally influence them, but because you share the same logical structure.
  *   **CDT (Standard):** "My choice doesn't change theirs." -> Defect.
  *   **EDT (Evidential):** "If I cooperate, it's *evidence* they cooperate." -> Cooperate (but fails in cases like the Smoking Lesion).
  *   **FDT/Superrationality:** "My choice logically *implies* theirs because we run the same function." -> Cooperate.

  So, superrationality is a serious philosophical position, but it requires a metaphysical commitment to logical correlation that standard economics rejects.

  ### 4. Superrationality vs. EDT
  You asked about the relationship with Evidential Decision Theory (EDT). They look similar because they both "cooperate with themselves," but the mechanism is different.

  *   **EDT** treats your action as a *signal*. It says, "If I choose Cooperate, the probability that the other person chose Cooperate goes up." This is based on statistical correlation.
  *   **Superrationality (and FDT)** treats your action as a *cause* in the logical sense. It says, "If I choose Cooperate, the other person *must* choose Cooperate because they are me, logically speaking."

  EDT can get into trouble when the correlation is spurious (e.g., a genetic lesion makes you smoke and also gives you cancer; EDT might tell you not to smoke to avoid the cancer evidence). Superrationality avoids this by focusing on the logical computation rather than statistical evidence. However, Superrationality is arguably *too strong*—it assumes the correlation is perfect, whereas EDT allows for imperfect correlation.

  ### The Verdict
  Your "bloc-voting" picture is the correct *internal* view for a superrationalist, but it fails as an *external* strategy for navigating the real world.

  1.  **Does it solve any commons problem?** Only in a population of perfect, identical reasoners.
  2.  **Is the Luring Lottery a clean win?** Theoretically, yes, for the group. Practically, no, because any non-superrationalist will flood the lottery and bankrupt the group.
  3.  **Is the "one defector" worry fatal?** Yes. Superrationality is not robust to noise. If you aren't certain the others are superrational, the math reverts to standard game theory (defect/flood the lottery) to protect yourself.
  4.  **Real Theory?** It's the precursor to Functional Decision Theory. It's a valid logical framework, but its assumptions are too strict for most human interactions.

  Hofstadter knew this. He viewed superrationality as an ideal to strive for—a way to break out of the "rational" trap of mutual destruction—but he acknowledged that in a world of mixed rationality, the superrationalist is vulnerable. The "bug" you're feeling isn't in your understanding; it's in the premise itself. The strategy is optimal only if everyone else is already doing it, which is exactly the coordination problem we started with.

  Great catch on the fragility of the system. That's usually the point where people either abandon the idea or start trying to build AI that can commit to it. Welcome to the discussion!
