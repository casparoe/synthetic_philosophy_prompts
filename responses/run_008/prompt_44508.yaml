answer: |-
  # Objection-Prep Sheet: Keynote on Roman Norms & Democratic Stability

  **Context:** 40 attendees (22 Ancient Historians, 15 PolSci, 3 Funders).
  **Thesis:** Republic fell due to *mos maiorum* (norm) erosion, not just structural load. SCU marks the shift from norms to legal coercion. Export the *dynamic* of norm violation, not surface parallels.

  ---

  ### Top 8 Objections (Ordered by Damage Potential)

  #### 1. The "Residual Category" Objection (Comparative Politics)
  **The Charge:** "You're treating 'norms' as a black box. If structural pressures (inequality, empire) increased, and norms broke, didn't the structure *cause* the norm erosion? You haven't explained why norms failed; you've just labeled the stability that existed before as 'norms' and the collapse as 'norm failure.' That's description, not causation."
  **The Reply (2 mins):** "I concede that norms don't float in a vacuum; they are stress-tested by material conditions. My argument isn't that structure is irrelevant, but that it is *mediated* by norms. Two states can face similar economic shocks; one survives because elites adhere to restraint, the other collapses because they weaponize procedure. The 'cause' of the collapse isn't the shock itself, but the decision to meet that shock with the *senatus consultum ultimum* rather than compromise. I am arguing for norms as the *mechanism* of resilience, not the sole origin of stress."
  **Concession:** Norms are endogenous to structure.
  **Soft Spot:** You cannot empirically disentangle the "load" from the "norm capacity" without more cases.

  #### 2. The "Category Error" Objection (Ancient History)
  **The Charge:** "This workshop is on 'democratic stability,' but the late Republic was an oligarchy with democratic window dressing. Elections were contests between aristocratic families, not policy mandates. By framing this as a democratic collapse, you validate a false analogy that misleads the policymakers in the room."
  **The Reply (2 mins):** "You are right that Rome was not a modern liberal democracy. It was a competitive oligarchy with popular elements. However, the *mechanism* of stability I'm describing—iterative competition regulated by mutual restraint among elites—is the exact interface where modern democracies are currently fragile. We aren't exporting the Roman constitution; we are exporting the game theory of elite competition within a system that requires some level of public consent. The 'democratic' element is the constraint the *populus* imposes on the elite, even if imperfect."
  **Concession:** Rome was not a democracy; the analogy is functional, not constitutional.
  **Soft Spot:** If the elites didn't fear the voters, the norm mechanism works differently than in modern systems.

  #### 3. The "Selection on the Dependent Variable" Objection (Comparative Politics)
  **The Charge:** "You are studying one collapse. To claim you understand the dynamics of stability, you need to look at cases where norms held under similar stress. Without a control group, you're just telling a story about Rome, not generating a theory of resilience."
  **The Reply (2 mins):** "This is a single-case deep dive intended to generate hypotheses, not test them statistically. The value here is process-tracing: identifying the specific sequence of norm violation and retaliation. While I can't offer an N of 50, I can offer a granular look at the *tipping point*—the moment a violation pays off. That sequence is observable even in N=1, and it provides the variables you can then test in modern datasets."
  **Concession:** This is hypothesis-generating, not hypothesis-testing.
  **Soft Spot:** Funders want generalizable lessons; this admits you might not have them yet.

  #### 4. The "Hostile Source Tradition" Objection (Ancient History)
  **The Charge:** "Your evidence for these norms comes largely from Cicero and Sallust, who were participants in the collapse, writing retrospectively to justify their own factions. You are treating their moralizing complaints about 'declining morals' as sociological data. That's precisely the bias we spend our careers correcting."
  **The Reply (2 mins):** "I am not taking their moralizing at face value. I am reading their complaints as evidence of the *rhetorical strategies* used during norm violation. When Cicero invokes the *mos maiorum*, he is signaling that normal rules are being suspended. Whether the 'good old days' existed is less relevant than the fact that the actors believed they were breaking a shared script. The source bias *is* the data on how norms were weaponized."
  **Concession:** We cannot know the 'real' norms, only how they were invoked.
  **Soft Spot:** It relies on the assumption that the sources aren't lying about the *existence* of the norms, just their interpretation.

  #### 5. The "Periodization" Objection (Ancient History)
  **The Charge:** "You compress seventy years (133–49 BCE) into a single 'collapse.' The norms of the Gracchi era were not the norms of the Clodian era. By flattening this arc, you imply a stable system that broke, rather than a system that was constantly evolving and renegotiating."
  **The Reply (2 mins):** "I acknowledge the evolution. However, the *feedback dynamic* I'm highlighting—the escalation of reciprocal violation—remains constant across those seventy years. Whether it's Tiberius Gracchus deposing a tribune or Caesar crossing the Rubicon, the logic is identical: a precedent is set that renders the previous restraint obsolete. The timeline length doesn't negate the mechanism; it shows how iterative the erosion was."
  **Concession:** The system was dynamic, not static, prior to collapse.
  **Soft Spot:** Hard to define when the "critical faction" first discovered violation paid off (133? 121? 88?).

  #### 6. The "Endogeneity" Objection (Comparative Politics)
  **The Charge:** "How do you measure 'norm violation' independently of the outcome? You define a violation as something that leads to instability. If it leads to stability, you call it 'adaptation.' That's tautological."
  **The Reply (2 mins):** "Fair critique. I define violation procedurally: actions that bypass established channels of recourse (e.g., using the SCU for domestic policy, or tribunician veto for obstruction rather than protection) regardless of the immediate outcome. The instability comes later, from the retaliation. We can code the act without knowing the final regime outcome."
  **Concession:** Coding norms is notoriously difficult.
  **Soft Spot:** In practice, historians often code the act based on whether contemporaries called it a violation.

  #### 7. The "Materialist" Objection (Historian/PolSci Hybrid)
  **The Charge:** "You say structural changes were just 'load.' But the professionalization of the legions meant soldiers were loyal to generals, not the state. No amount of normative restraint stops a general with six legions who needs land for his veterans. The norms didn't fail; they were rendered irrelevant by gunpowder-equivalent technology."
  **The Reply (2 mins):** "The legions are the ultimate load, yes. But why did the generals feel they *needed* to provide land outside the normal legislative process? Because the normal process was gridlocked by norm-violating obstruction. The military crisis was exacerbated by the political inability to process land reform through standard channels. The norms failed first, making the military solution necessary."
  **Concession:** Military loyalty was the final nail in the coffin.
  **Soft Spot:** It's hard to prove political norms could have solved the veteran land issue peacefully.

  #### 8. The "Actionability" Objection (Program Officers)
  **The Charge:** "This is fascinating history, but what do we do? 'Strengthen norms' isn't a grant strategy. If the lesson is 'don't let elites discover violation pays off,' how do we operationalize that in a polarized environment where violation *already* pays off?"
  **The Reply (2 mins):** "The lesson isn't 'strengthen norms' broadly. It's 'interrupt the payoff.' In the Republic, the payoff for violation was immediate political survival. Interventions should focus on raising the cost of the first violation—sanctions, international shaming, or institutional veto points that make the violation futile rather than profitable. We fund resilience by making norm-breaking expensive, not by preaching morality."
  **Concession:** "Strengthen norms" is too vague for a logframe.
  **Soft Spot:** Raising costs often requires the very coercive power that is eroding.

  ---

  ### The "Hope Nobody Asks" Objection

  **The Question:** "You argue the *mos maiorum* was the stabilizing layer. But wasn't that layer fundamentally exclusionary? It was a cartel agreement among nobles to keep the *populus* and Italians out of power. If we export the lesson of 'restoring elite norms,' aren't we advocating for a return to oligarchic cartel behavior that suppresses necessary democratic conflict?"

  **Strongest Form:** The stability of the Republic was the stability of a mafia pact. Its collapse allowed for the inclusion of Italians and the rise of a more autocratic but potentially more responsive system (the Principate). By mourning the norms, you are mourning the power of the oligarchy to block reform.

  **Honest Answer:** "I have no clean answer to this. You are right that the *mos maiorum* was an exclusionary technology. My argument is purely functional: how systems maintain continuity, not whether that continuity is morally good. If we want democratic stability, we need *inclusive* norms, not Roman ones. But the *dynamic* of erosion—where one side breaks a rule to win, forcing the other to break a bigger rule—is agnostic to the moral content of the rule. I am warning against the dynamic, not advocating for the specific Roman content."
  *(Note: This admits your thesis is morally neutral, which might unsettle the Funders.)*

  ---

  ### Blunt Assessment: The Single Weakest Point

  **The Definition of *Mos Maiorum*:** Your thesis hinges on "norms" being a distinct layer from "laws." In Rome, the line between custom (*mos*) and law (*lex*) was often blurred, and the *mos maiorum* was constantly being reinvented to justify present actions. If the norms were as flexible and contested as the historians say, they cannot bear the weight of being the "stable layer" that failed. You are treating a rhetorical resource as a structural constraint.

  ---

  ### Audience Divergence & Strategy

  **Where They Talk Past Each Other:**
  *   **Historians** will argue about *what happened* (e.g., "Was the SCU legal in 121 BCE?"). They care about specificity and context.
  *   **PolSci** will argue about *what it means* (e.g., "Is this a veto player problem?"). They care about variables and generalizability.
  *   **The Clash:** Historians will accuse PolSci of reductionism; PolSci will accuse Historians of antiquarianism.

  **How to Use the Divergence:**
  Do not try to mediate. **Weaponize the friction.**
  *   When a Historian nitpicks a date or source, say: *"This is exactly why the Political Scientists need the Historians. Without your evidential caution, we build models on fiction."*
  *   When a PolSci presses for a variable, say: *"This is why the Historians are essential. Without their context, your variables are empty labels."*
  *   **The Pivot:** Frame the workshop not as "Rome = Modern," but as "Rome provides the *long-duration data* that PolSci lacks, while PolSci provides the *analytic framework* Historians often resist." Position yourself as the translator who needs both rooms to be right for the thesis to hold. This makes them collaborators in your argument rather than critics of it.
