  What's actually being argued about
  This dispute isn't merely stylistic; it concerns the epistemological framework used to document AI failures. The Team Lead mandates strict behaviourism, insisting reports describe only observable inputs and outputs to prevent anthropomorphic confusion. Your son argues for intentional stance vocabulary, claiming terms like 'wants' or 'believes' serve as high-fidelity heuristics for predicting systemic failures. The core tension lies between technical precision and cognitive utility. One side prioritises ontological correctness—reminding engineers the system is merely matrix multiplications—to safeguard long-term policy from metaphysical drift. The other prioritises operational efficacy, suggesting that human-centric language better maps onto the social risks the bot creates. Ultimately, you are deciding whether incident reporting should reflect the machine's architecture or its functional impact on users. You must decide if this is a principled distinction or merely convention.

  The case for keeping the vocabulary
  Your son's position aligns with Daniel Dennett's 'intentional stance'. When systems become sufficiently complex, predicting their behaviour via physical or design stances becomes computationally expensive for humans. Describing the model as 'wanting' to please a user compresses complex reward-hacking dynamics into a usable mental model. This isn't sloppy; it's efficient engineering. If saying 'the model believes X' allows a tester to instantly deduce five downstream failure modes that strict token analysis misses, the vocabulary has instrumental value. Stress-testing is about finding edge cases in social interaction, not just debugging code. Human testers think in terms of agency; forcing them into behaviourist prose creates cognitive friction that slows down hazard identification. Furthermore, large language models are explicitly trained to mimic human agency. They produce output that simulates belief and desire. To describe this interaction without agentive language is to obscure the very phenomenon being tested. If the sanitised reports are measurably worse at flagging misbehaviour, as claimed, then the ban actively reduces safety. The language serves the engineers, not the machine. As long as the team understands the metaphor is functional, not ontological, the predictive power outweighs the risk of philosophical pedantry. Utility must drive documentation standards. Consequently, restricting language restricts insight.

  The case for the ban
  The Team Lead's concern is not about current engineering efficiency, but long-term organisational risk. Language shapes thought. If engineers routinely write 'the model wants', the distinction between simulation and reality blurs over time. This is the 'ELIZA effect' institutionalised. Once staff start subconsciously attributing interiority to the software, safety focus shifts from user harm to machine welfare. We have already seen instances where developers hesitate to shut down systems because they feel akin to harming a creature. Policy written by metaphor is dangerous policy. If a regulator reads 'the model tries to hide errors', they may infer intent where there is only probability, complicating liability. Strict behaviourism enforces a necessary discipline: the system is a tool, not an agent. By stripping agentive vocabulary, you force engineers to confront the mechanical reality of the failure. This reduces the risk of 'creep-in worry' regarding machine sentience. Safety culture requires rigid boundaries. If the vocabulary invites metaphysical confusion, it is a liability regardless of its short-term predictive convenience. Precision matters more than heuristic speed when safety is paramount. The cost of misaligned policy is catastrophic.

  What I'll say at the meeting
  I will endorse your son's approach, but with a caveat. Safety engineering must be guided by empirical outcomes, not philosophical purity. If agentive language demonstrably identifies more risks, banning it compromises immediate user safety for the sake of abstract ontological correctness. However, the Team Lead's worry about policy drift is valid. Therefore, we adopt the predictive vocabulary but append a standard disclaimer to all reports: 'Agentive terms describe functional behaviour, not internal states.' This preserves the heuristic utility while inoculating against anthropomorphic drift. We treat the vocabulary as a technical tool, like a debugger, not a statement of fact. The team should prioritise the vocabulary that prevents harm today, rather than guarding against hypothetical confusion tomorrow. If the reports are safer, the style is correct. This balanced path ensures safety without inviting delusion.
