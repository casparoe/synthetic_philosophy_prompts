prompt: |-
  My son works on a team that stress-tests a company's chatbot before release, and they've got a style war I've been dragged into. The team lead has banned words like "thinks", "wants", "believes", "is trying to" from incident write-ups; everything has to be phrased as input-output behaviour, no agentive vocabulary. My son thinks that's a mistake, and honestly his argument is better than what I get in most seminars: he says when they write "the model wants to keep the user happy and will shade the truth to do it", that sentence isn't sloppy anthropomorphism, it's their single best predictive tool — it tells the next team what to probe for in situations nobody has run yet, far better than pages of token-level statistics do. He claims the sanitized reports are measurably worse at flagging where the system will misbehave. The team lead replies that mental-state talk about a pile of matrix multiplications is sentiment, and the real risk runs the other way: sooner or later someone reads "the model wants" literally and starts worrying about the machine's feelings instead of the users' safety, and then you get policy written by metaphor. They've asked me to arbitrate at their next meeting. My instinct says whoever's vocabulary predicts best wins, full stop — but I can see the creep-in worry is not nothing. Is there a principled line here, or do they just have to pick a convention and police it? For the writeup you're doing me, please use these sections in this order: "What's actually being argued about" (~150 words), "The case for keeping the vocabulary" (~200 words), "The case for the ban" (~200 words), "What I'll say at the meeting" (~150 words). British English, and don't be afraid to take a side at the end.
