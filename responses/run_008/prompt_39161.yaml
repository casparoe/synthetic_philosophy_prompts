answer: |-
  You have put your finger on a profound epistemic asymmetry between the natural sciences and the historical sciences. Your intuition is correct: this is not merely hindsight bias (a cognitive error) nor standard survivorship bias (a sampling error). It is something more structural, where the *causal mechanism* of the event actively modifies the *availability of data* about that event.

  In the philosophy of history and social science methodology, there are fragments of this concept, but no single term that captures the full causal loop you are describing. Since you asked for precision, I will walk you through the existing adjacent concepts, suggest a term that bridges them, and then define the edges as you requested.

  ### 1. The Existing Nearest Neighbors

  **A. Taphonomic Bias (Paleontology/Archaeology)**
  As a biochemist, this will resonate immediately. In paleontology, *taphonomy* is the study of what happens to an organism after its death and before its discovery as a fossil. It accounts for decay, scavenging, sedimentation, and metamorphosis. A "taphonomic bias" acknowledges that the fossil record is not a random sample of past life, but a sample filtered by the physical processes of preservation.
  *   **Relevance:** History has a "social taphonomy." The "decay" of evidence is not random; it is often directed by the victors. However, taphonomy usually implies natural processes, whereas your observation includes *intentional* curation (burning papers, defensive memoirs).

  **B. Selection on the Dependent Variable (Political Science/Methodology)**
  In quantitative social science, this is a known methodological sin. It occurs when you select cases for study based on the outcome you are trying to explain (e.g., studying only successful revolutions to explain why revolutions succeed).
  *   **Relevance:** This captures the sampling error, but it is usually discussed as a mistake made by the *researcher*, whereas you are describing a property of the *archive itself*. The archive has already selected on the dependent variable before the historian arrives.

  **C. Silencing the Past (Michel-Rolph Trouillot)**
  In his seminal work *Silencing the Past*, anthropologist Trouillot argues that history is produced through four moments of "silence," one of which is the **creation of sources**. He argues that power relations at the moment of the event determine what gets recorded and what enters the archive.
  *   **Relevance:** This is the closest philosophical match. Trouillot explicitly states that some events are "silenced" not because historians ignore them, but because the power dynamics of the event prevented them from becoming "history" in the first place.

  ### 2. Coining the Term: **Causal Archival Endogeneity**

  None of the above fully capture the *feedback loop* you described: that the outcome *causes* the evidence structure. In econometrics, **endogeneity** occurs when an explanatory variable is correlated with the error term, or when the dependent variable influences the independent variables.

  I propose we call this phenomenon **Causal Archival Endogeneity (CAE)**.

  **Definition:** CAE occurs when the outcome of a historical process causally determines the survival, organization, or legibility of the evidence used to explain that process.

  **Why this term works:**
  *   **Causal:** It acknowledges that the evidence wasn't just lost; it was destroyed or created *by* the outcome.
  *   **Archival:** It locates the bias in the material record, not just the historian's mind.
  *   **Endogeneity:** It captures the feedback loop. The thing you are trying to explain (the outcome) has reached back in time to alter the data you are using to explain it.

  ### 3. Defining the Edges

  You asked where this stops and survivorship bias or hindsight bias begins. Here are the boundaries:

  **Vs. Survivorship Bias:**
  *   **Survivorship Bias** is passive. Example: We only have data on planes that returned because the ones that didn't return are underwater. The loss is a function of the *medium* (water vs. air).
  *   **Causal Archival Endogeneity** is active. Example: We only have the General's logs because the General won, stayed in power, and funded the archive. The losing General's logs were burned *because* he lost.
  *   **The Edge:** If the data loss is incidental to the outcome, it's survivorship. If the data loss is *instrumental* to the outcome (or a direct consequence of the power shift caused by the outcome), it is CAE.

  **Vs. Hindsight Bias:**
  *   **Hindsight Bias** is cognitive. It lives in the narrator's head ("I knew it all along").
  *   **CAE** is ontological. It lives in the box of documents. Even a perfectly honest, unbiased historian cannot correct for CAE because the base rate of failures literally does not exist in the physical record.
  *   **The Edge:** Hindsight distorts the *interpretation* of available data. CAE distorts the *availability* of the data itself.

  ### 4. Science vs. History: Structural or Noisy?

  You asked whether this makes historical explanation structurally different from science or just noisier. Based on your lab notebook analogy, the answer is **structurally different**.

  **In the Lab (Natural Science):**
  *   **Exogenous Data Generation:** The reaction does not know it is being measured. A failed run does not typically reach out and destroy the notebook entry for that run (unless there is fraud, which is a deviation from the method).
  *   **Replicability:** You can run the experiment again to generate new data points.
  *   **Counterfactuals:** You can test the counterfactual (change variable X) directly.

  **In the Archive (History):**
  *   **Endogenous Data Generation:** The "reaction" (the historical event) alters the "notebook" (the archive). The victor defines what counts as a "fact."
  *   **Non-Replicability:** You cannot re-run the French Revolution to see if a different press strategy yields a different archive.
  *   **Counterfactuals:** You cannot test the counterfactual directly; you can only model it against an archive that was curated to prove the actual outcome was inevitable.

  **The Implication:**
  In science, error is usually *random* (noise) or *systematic* (calibration error). In history, under CAE, error is *directional* and *teleological*. The evidence is biased toward the conclusion that the winner was destined to win, because the winner curated the evidence to justify their victory.

  This means historical explanation cannot achieve the same *kind* of causal certainty as biochemistry. It is not just "noisier"; it is operating on a dataset where the dependent variable has tampered with the independent variables.

  ### 5. Summary for your Reading

  When you encounter this in your reading, you can categorize it as **Causal Archival Endogeneity**.

  *   **It is not:** Just "winner's history" (too colloquial).
  *   **It is not:** Just survivorship bias (too passive).
  *   **It is:** A structural feature of historical epistemology where power determines provenance.

  The closest existing philosophical framework is **Trouillot's "Silencing,"** but your biochemist's insight adds the crucial layer of *base rate neglect* caused by the event itself. In the lab, you keep the failed runs to calculate the base rate. In history, the victors burn the failed runs to make the base rate of their success appear to be 100%.

  This makes history less like a lab notebook and more like a crime scene where the perpetrator has not only fled but also reorganized the furniture to make it look like an accident. You can still solve the crime, but you must acknowledge that the scene itself is part of the deception.
