  i'm taking an epistemology seminar this semester and something happened last week that keeps bugging me. my friend asked me if the campus pharmacy takes our insurance. I remembered my roommate saying it did, so I told her yes, definitely. turns out it doesn't, and she had to pay out of pocket. she was pretty annoyed and said I basically lied to her, but that feels wrong — I didn't lie, I genuinely believed what I said. still, I feel like I did do something bad by sounding so sure when all I had was a secondhand memory from weeks ago.

  and here's the part that confuses me more: a few days before that, the same friend asked whether there'd be pizza at a club meeting. I had zero idea, I just said "yeah probably" basically as a guess, and by luck I turned out right. nobody got hurt, no one was misinformed, but was that actually more okay than the pharmacy thing? it seems like what makes it wrong to tell someone something is maybe one of three things — saying something false, saying something you don't actually know, or saying something you don't even really believe — and those three come apart across my two cases. in the pharmacy case I believed it but didn't know it and it was false; in the pizza case I didn't believe or know it but it was true.

  which of those is actually the standard I should hold myself to when I assert stuff to people, and which of my two screwups (if either) was worse? my professor mentioned people genuinely disagree about this, so please separate what's actually settled from what's a live debate among people who study this — don't just pick one side and present it as the consensus. keep it under 350 words.
