answer: |-
  **Joint Statement on Consciousness and Time**

  **1. Agreed Claims**

  1.  **Rejection of Cartesian Materialism:** We agree there is no homunculus, no single place where inputs converge for an inner observer, and no magic moment where non-conscious processing becomes conscious by virtue of location alone.
  2.  **Empirical Consensus:** We accept the validity of data regarding Color Phi, metacontrast masking, the cutaneous rabbit, backward masking, change blindness, split-brain behavior, and postdictive filling-in. These phenomena constrain any viable model.
  3.  **Scope of Dennett's Critique:** We agree Dennett's arguments successfully dismantle the "Cartesian Theater" strawman (a place where things happen for an observer) but leave open whether global availability constitutes a functional bottleneck worthy of the name "theater."
  4.  **Global Workspace Commitments:** We agree that some contents become globally available, persist over short durations, and inform report. We disagree on whether this availability constitutes consciousness itself or merely its behavioral signature.
  5.  **Terminological Charity:** We acknowledge the charge of verbal dispute: the Theater side uses "consciousness" to denote global availability; the Drafts side uses it to denote the functional role including narrative fixation. We agree this distinction drives much friction.

  **2. Table of Disagreements**

  | Issue | Theater Formulation | Multiple-Drafts Formulation | Crux | Concrete Case | Preregistered Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Temporal Ontology** | There is a fact of the matter about the objective time a conscious token occurs, marked by neural ignition. | There is no fact of the matter about "when" content becomes conscious, only when discriminations become available for purposes. | Is consciousness timestamped by the brain? | **Color Phi:** Two spots flash; subject sees motion and color change. | **Theater:** Neural ignition time matches subjective onset.<br>**Drafts:** No single neural time matches subjective onset; only report latency matters. |
  | **The Revision Case** | A determinate first-pass content was experienced and then revised (Orwellian). Experience precedes memory-editing. | No fact of the matter about which early draft was experienced; only the content controlling report/memory exists. | Is there an experiential history independent of report? | **Face Revision:** Face shown as smile, then grimace within 200ms, prior to report. | **Theater:** Early EEG (N170) modulated by *smile* predicts experience, even if report is *grimace*.<br>**Drafts:** Only late EEG (P3) matching *grimace* report correlates with experience. |
  | **Scene Richness** | Conscious experience is rich and detailed; report is sparse due to bottleneck limits. | Conscious experience is sparse; the sense of richness is a heuristic belief generated at query. | Is phenomenology high-resolution or gappy? | **Change Blindness:** Flicker task with complex scene. | **Theater:** Early visual cortex shows full scene representation before change detection.<br>**Drafts:** Only changed item represented neurally at detection; rest is filler. |

  **3. Residual Disagreements**

  We classify our remaining disputes as follows. The disagreement over **Temporal Ontology** and the **Revision Case** is substantive. It concerns whether there are facts about the history of experience that transcend current reportability. If the Theater side is correct, there are neural signatures of "lost" experiences (the smile) that exist independently of the subject's final testimony. If the Drafts side is correct, such signatures are merely unconscious precursors. This has downstream consequences for legal and medical contexts: if consciousness is timestamped (Theater), we can pinpoint when intent formed; if it is indeterminate until report (Drafts), intent is only fixed retroactively.

  The disagreement over **Scene Richness** is partially verbal but carries substantive weight. Both sides agree subjects *act* as if the world is rich. The Theater side calls this underlying capacity "consciousness"; the Drafts side reserves "consciousness" for the accessed content. This verbal distinction matters because "consciousness" infers moral status. If unaccessed rich content counts as consciousness (Theater), beings with limited reportability may have richer inner lives than Drafts allows. We agree to test these predictions empirically rather than arguing definitions. The label "Theater" is conceded as potentially misleading regarding a homunculus, but retained by the first author to denote the structural bottleneck of global availability. The second author retains "Multiple Drafts" to emphasize the lack of a final authoritative version. We sign this document acknowledging that while our metaphors differ, our commitments to empirical risk are now aligned.
