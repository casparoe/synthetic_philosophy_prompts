  my partner and I have been going back and forth for months about whether to have a kid, and then last week at dinner an old friend of mine, who's gotten deep into antinatalism, dropped Benatar's asymmetry on me: the idea that the absence of pain is good even if theres no one for whom its good, while the absence of pleasure is not bad unless someone is deprived of it, so coming into existence is never a net benefit and usually a harm. She's maybe 60% on this being right; my partner thinks its basically a trick of grammar and puts it at like 5%. I want your actual credence, decomposed. Things I'd want in the decomposition, at minimum: whether a state of affairs can be good or bad for nobody in particular or whether all value needs a subject; whether the distinction between a life worth continuing and a life worth starting actually holds up; and whether the mild procreation asymmetry that almost everyone accepts (you're not obligated to create a happy child, but you are obligated not to create a miserable one) slides you toward Benatar's strong version, or whether you can stop somewhere in between — and if so, where exactly and why. Add any other terms you think belong, give each a rough number and a line of justification, then combine them. Then tell me which single sub-question the final credence is most sensitive to, and what argument would actually move it — I'd like to know what to argue about at the next dinner, not just the bottom line.
