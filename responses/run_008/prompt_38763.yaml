      *   *Walton's Weakness:* If my grief is fictional, why did I cancel my subscription? That's a real economic penalty. Walton might say "it's fictional that I am cancelling," but the Strand lost real money.
      *   *Reframing:* The paradox assumes private emotion. This was public pressure.

