          2.  How each theory explains the *behavioral* outcome (letters, cancellations, pressure campaign) and the *anger* directed at Conan Doyle.
      *   **Critical Question:** Does the paradox need reframing from private affect to collective/political action? Does patching for behavior break the explanation for tears?
      *   **Constraints:** Flowing prose, ~800 words, no bullet lists. Avoid dubious trivia (black armbands). Acknowledge where theories are silent.
      *   **Output Format:** Prose followed by a specific machine-readable line: `Verdict: [theory/none] + [<=10 words reason]`.

  2.  **Deconstruct the Theories vs. The Case:**

      *   **Illusion Theory:** Readers momentarily believed Holmes existed.
          *   *Fit:* Explains the intensity of grief.
          *   *Creak:* Readers knew Holmes wasn't real (letters to Doyle acknowledge the authorship). They weren't hallucinating; they were engaging with a text.
          *   *Behavior/Anger:* If they believed he was real, why blame Doyle? Unless they saw Doyle as a biographer killing a subject. But the anger suggests a breach of contract, not confusion about ontology.
      *   **Thought Theory (e.g., Carroll, Lamarque):** Emotions don't require existence beliefs, just thoughts of the content.
          *   *Fit:* Handles the "knowing he's fake but crying anyway" aspect well.
          *   *Behavior/Anger:* Thoughts can guide action, but usually regarding the content. Acting *on the author* requires a bridge between fictional content and real-world ethics. Why punish Doyle for a thought?
          *   *Anger:* Fits best here. You can be angry at an author for a creative choice because the thought content violates expectations/norms.
      *   **Walton's Make-Believe (Quasi-Emotion):** It's fictional that we are grieving. We pretend to fear/sadness.
          *   *Fit:* Explains the safety of the experience.
          *   *Creak:* Real subscriptions were cancelled. Real letters were written. Quasi-emotions shouldn't trigger real-world economic/social consequences so persistently (10 years).
          *   *Behavior:* Walton struggles here. If it's just a game of make-believe, why demand a retcon so violently?

  3.  **Address the Specific Prompts:**

      *   *Prompt 1 (Mapping):* Need to weave the moment-by-moment experience into the prose.
      *   *Prompt 2 (Behavior):* This is the crux. Illusion fails (they knew). Walton fails (actions were real). Thought theory has the best shot (thoughts motivate real action).
      *   *Prompt 3 (Anger at Doyle):* Illusion says Doyle killed a real person (too strong). Walton says Doyle broke the game rules. Thought theory says Doyle violated normative expectations attached to the thoughts.
      *   *Prompt 4 (Reframing the Paradox):* The case suggests the paradox is too narrow. It's not just "how can I feel?" but "how does fiction command real-world obligation?"

  4.  **Drafting - Section by Section (Mental Outline):**

