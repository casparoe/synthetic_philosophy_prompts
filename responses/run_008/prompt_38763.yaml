  The Reichenbach Falls incident offers a stress test for the paradox of fiction that standard philosophical examples lack. When readers encountered "The Final Problem" in 1893, they experienced grief for a man they knew was ink on paper. Mapping the standard theories onto this historical moment reveals distinct fractures. Illusion theory suggests readers momentarily believed Holmes existed. This fits the intensity of the shock but creaks against the documented correspondence; readers wrote to Doyle knowing he was the architect, not a biographer. They weren't confused about ontology; they were aggrieved by authorship. Walton's make-believe account claims the grief was quasi-emotional, a prop in a game. This explains the safety of the experience but collapses when facing the material consequences. Quasi-emotions should not cancel real subscriptions or sustain a decade-long pressure campaign. If the grief was fictional, the economic loss to The Strand was not.

  Thought theory fares better initially. It posits that emotions require only thoughts, not existence beliefs. Readers contemplated the proposition of Holmes's death and felt real sadness. This accommodates the knowledge that Holmes was fictional while validating the affect. However, the user's specific concern regarding behavior and anger exposes the limits of all three. The paradox is typically framed around inert affect—tears in a darkened theater—but the Holmes case involves action-guiding grief. Readers didn't just weep; they organized. They demanded a retcon. Illusion theory struggles here because punishing Doyle for killing a non-existent person makes little sense unless one believes the killing was real, which contradicts the "illusion" being momentary. Walton is silent on why fictional grief mandates real-world restitution. If I am only pretending to mourn, why do I demand the author undo the death? The theory explains the tears as part of the game, but not the letters as moves outside it.

  Thought theory offers the most robust handle on the anger directed at Doyle. In ordinary grief, death is a natural event; here, it was a creative choice. Thought theory allows that thoughts about fictional events can generate normative expectations. Readers felt wronged not because a man died, but because a contract of narrative care was violated. They could condemn Doyle morally without believing Holmes existed, because the wrong was done to them, the audience, via the content. This absorbs the desert-involving anger better than Illusion, which risks making the readers deluded, or Walton, which risks making the anger part of the make-believe. Yet, even Thought theory pays a cost. Admitting that fictional choices can warrant real-world moral condemnation suggests fiction is not hermetically sealed from ethics. It implies authors can wrong readers through plot points, a claim many theorists resist to keep aesthetics separate from morality.

  Running this episode back against the paradox suggests the original framing was too narrow. The paradox treats fiction as a private puzzle of ontology and affect, but the Holmes resurrection was a public, political negotiation. The grief was collective, performed socially through letters and cancellations. If we patch Thought theory to cover this behavior, acknowledging that fictional thoughts motivate real-world political action, it remains viable for the original puzzle of tears. It simply expands the scope of what thoughts can do. Illusion theory breaks under the weight of the readers' self-awareness, and Walton's account snaps under the reality of the consequences. The Holmes case indicates that the paradox isn't about how we feel about nothing, but how nothing commands something from us. The tears were real, the money was real, and the anger was directed at a real god. Theories that dismiss the reality of the reaction to preserve the fictionality of the object fail to explain why the god capitulated.

  Verdict: Thought theory, because it alone validates real actions based on non-existent objects.

