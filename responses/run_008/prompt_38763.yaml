          *   Thought: Readers contemplated the proposition of death. Fits the knowledge he's fake.
          *   Walton: Readers participated in a game. Fails on the real-world consequences (subscriptions).
      *   *Behavior & Anger:* The crucial pivot. Cancellations and letters are real actions. Walton calls them quasi-emotions, but cancelled checks are real. Thought theory allows thoughts to motivate real grievance against the author.
      *   *Reframing:* The paradox usually ignores the social contract. This case shows fiction as a communal agreement.
      *   *Conclusion:* Which theory survives? Thought theory seems most robust for action, but all struggle with the intensity of the social campaign.
      *   *Verdict Line:* Construct carefully.

