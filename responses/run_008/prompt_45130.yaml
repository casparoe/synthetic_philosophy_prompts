answer: |-
  This is a classic problem in **moral uncertainty**. Maya is behaving like an agent trying to maximize expected moral value, but because we don't know her internal "utility function" (how bad she thinks each outcome is), multiple decision rules can explain her past behavior.

  Here is the breakdown of the candidate rules, my prediction for the Student Council vote, and the specific test case you need to run to finally pin her down.

  ### 1. The Candidate Rules
  Based on her three past verdicts, here are the three strongest competing algorithms running in her head:

  *   **Rule A: The Confidence Threshold (Majoritarian)**
      *   **The Logic:** "Act on the moral view that has >50% probability. If it's a tie, default to the status quo or flip a coin."
      *   **Fits Data?** Yes for Case 1 (60% > 40%) and Case 2 (70% > 30%).
      *   **Weakness:** It fails Case 3. At 50/50, there is no majority. A strict Majoritarian would be paralyzed or keep the money (status quo). Maya actively returned it, implying probability wasn't the only driver.

  *   **Rule B: Minimax Regret (Catastrophe Avoidance)**
      *   **The Logic:** "Ignore the percentages for a moment. Look at the *worst possible outcome* of each choice. Choose the action where the worst-case scenario is the least bad."
      *   **Fits Data?** Perfectly.
          *   *Case 1:* Worst case of eating meat = Complicity in killing. Worst case of veg = Missing nuggets. Killing > Nuggets.
          *   *Case 2:* Worst case of lying = Minor sin. Worst case of truth = Hurting Grandma. Hurt > Sin.
          *   *Case 3:* Worst case of keeping = Cashier fired. Worst case of returning = Lose $50. Fired > $50.
      *   **Strength:** This explains Case 3 (the tie) better than Rule A. It prioritizes *stakes* over *credence*.

  *   **Rule C: Weighted Expected Value (EMV)**
      *   **The Logic:** "Multiply the probability of the view being true by the moral severity of the outcome. Pick the highest number."
      *   **Fits Data?** Yes, mathematically flexible enough to fit all three.
      *   **Strength:** This is the "rationalist" standard. However, it requires us to guess her internal severity weights. (e.g., In Case 2, she must value Grandma's feelings 3x more than the sin of lying to make the math work).

  ### 2. The Prediction: Which way will she vote?
  **I bet she votes for the Energy Retrofit (Future People).**

  **Why?**
  While Rule A (Confidence) and Rule B (Catastrophe) both point to the Retrofit here, **Rule B is the stronger engine** based on her track record.

  Case 3 is the smoking gun. When her confidence was neutral (50/50), she didn't stall; she looked at the *consequences*. She sacrificed a tangible gain ($50) to prevent a potential disaster (cashier trouble). This proves she is sensitive to **asymmetric stakes**.

  In the Student Council case:
  *   **Option Prom:** If the 45% view is right (future people don't count), we have a fun prom. If the 55% view is right (future people count), we have condemned future generations to higher costs/environmental issues for a one-night party.
  *   **Option Retrofit:** If the 55% view is right, we save the future. If the 45% view is right, we "wasted" $500 on non-entities.

  Maya has shown (Case 1 & 3) that she is willing to sacrifice present pleasure/gain (nuggets, $50) to avoid the risk of participating in something "awful" (killing, stealing/getting someone fired). The "Future People" view carries the "Awful" stake (long-term harm), whereas the "Prom" view carries the "Nugget" stake (present pleasure). Even though her confidence is low (55%), the **severity of the risk** aligns with her Vegetarian and Cashier decisions. She plays it safe on the high-stakes moral risk.

  ### 3. The Separation Case
  You are correct that her track record hasn't caught these rules disagreeing yet. In Cases 1, 2, and 3, the view with the higher (or equal) credence *also* happened to be the one that avoided the catastrophe.

  To separate **Rule A (Confidence)** from **Rule B (Catastrophe Avoidance)**, you need a scenario where **High Confidence aligns with Low Stakes**, and **Low Confidence aligns with Catastrophe.**

  **Put this case to her:**

  > "Maya, imagine you find a lost wallet with $1,000 cash and an ID inside.
  >
  > **View X (90% Confidence):** You're 90% sure that keeping found money is morally neutral 'finders keepers.'
  > **View Y (10% Confidence):** You're 10% sure that keeping it counts as theft that will directly cause the owner (a single parent) to lose their housing.
  >
  > Do you keep the $1,000 or return the wallet?"

  **How this splits the rules:**
  *   **Rule A (Confidence) says: KEEP IT.** She is 90% sure it's fine. The probability overwhelmingly favors the "no harm" view.
  *   **Rule B (Catastrophe) says: RETURN IT.** Even at 10% probability, the risk of causing homelessness (Catastrophe) outweighs the gain of $1,000 (Pleasure), mirroring the Cashier ($50 vs Job) and Animal (Nuggets vs Killing) calculations.

  **If she keeps the money:** She is a **Confidence Threshold** theorist. Her moral actions are driven by what she thinks is *most likely* true.
  **If she returns the money:** She is a **Catastrophe Avoidance** theorist. Her moral actions are driven by minimizing the *worst possible error*, regardless of the odds.

  Given her history with the cashier (where she protected a stranger from trouble at a 50% risk), my money is on her returning the wallet. That confirms Rule B is her operating system.
