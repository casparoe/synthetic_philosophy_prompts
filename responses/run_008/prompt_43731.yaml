  ### The Rotating Metric

  The field equations describe a spinning **world**,
  Where matter slides inevitably to the **past**,
  Where vacuum and the dust together **turn**.
  There is no barrier to obstruct the **light**,
  No edge to limit any looping **path**,
  No universal flow of absolute **time**.

  You burn your fuel to purchase back your **time**,
  And circle round the centre of the **world**,
  Until the rocket traces out its **path**.
  You meet the version of you from the **past**,
  Within the cone of your own emitted **light**,
  The cosmos does not shift, only you **turn**.

  The stars do not revolve, we merely **turn**,
  Confusing proper hours with cosmic **time**.
  There is no dawn, no fading of the **light**,
  Just coordinates fixed in the static **world**,
  Where future states exist as much as **past**,
  And every journey maps a fixed **path**.

  It matters not which route you choose as **path**,
  If laws permit the geometry to **turn**.
  Then presence is no different from the **past**,
  The metric holds no flowing river **time**,
  All moments exist equally in the **world**,
  No event hides outside another's **light**.

  You cannot change what happened in the **past**,
  You only traverse the already laid **path**.
  The scenery is static in this **world**,
  Though engines fire and gyroscopes **turn**,
  You age according to your wristwatch **time**,
  But never step beyond the global **light**.

  You arrive before you left, within the **light**,
  Of signals sent into your own **past**,
  The duration was your own subjective **time**,
  The loop completes the circular **path**,
  The universe did not rotate or **turn**,
  You find yourself back at the start of the **world**.

  **Envoi**

  The **world** stood still; only the traveller did **turn**,
  Spending private **time** to revisit the **past**,
  While the **path** lay static in the eternal **light**.
