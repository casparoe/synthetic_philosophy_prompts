  # Proposal: The Politics of Procedural Inertia: Agenda-Dependence in Collegial Decision-Making

  ## Introduction: The Fellowship Panel Paradox

  This past spring, I served for the first time on my department's fellowship panel. The task was straightforward: we had a pool of applicants and a limited number of awards to distribute. To ensure consistency, the department had established three formal criteria that every proposal had to satisfy to be considered fundable. First, the project had to be significant, contributing meaningfully to the field. Second, the applicant had to demonstrate the capacity to realistically complete the project within the award period. Third, the project had to fit the funder's stated priorities. The procedure was simple: we read the files, discussed them around the table, and then scored each applicant against the three criteria. If an applicant satisfied the majority on all three counts, they were deemed eligible. If they were eligible, we then ranked them by overall merit to determine who received the money.

  One applicant ended up in a strange position. Let us call her Applicant X. When we voted on the first criterion, significance, a majority of the panel voted that she satisfied it. When we voted on the second criterion, feasibility, a majority voted that she satisfied it. When we voted on the third criterion, fit, a majority voted that she satisfied it. By every formal measure, the collective judgment of the panel was that Applicant X met the requirements for funding. However, when we moved to the final ranking stage to determine who actually received the award, a majority of the panel ranked her below the funding line. She was eligible by the criteria, yet rejected by the outcome.

  This situation is logically possible because the overlapping majorities were made of different people. The subset of members who voted "yes" on significance was not identical to the subset who voted "yes" on feasibility, and neither was identical to the subset who voted "yes" on fit. There was no single majority coalition that supported her across all three dimensions, even though there was a majority for each dimension individually. When I described this anomaly at the time, noting the disconnect between the criteria scores and the final ranking, a senior colleague waved it off. He described it as an artifact of our voting order. He argued that we had scored the criteria after reading the files, rather than voting on each applicant's overall merit first. In his view, if we had voted on the conclusion—"Should this person be funded?"—before breaking it down into premises, the paradox would not have arisen. His gesture at the agenda was dismissive; he treated the sequence of questions as a mere technicality, a procedural quirk that explained away the inconsistency without implying any deeper problem.

  That gesture at the agenda is what I want to work on. The colleague's explanation relies on a specific understanding of how collective judgment works, one that suggests the inconsistency was caused by the order in which we processed the information. But this raises a deeper question about the nature of the rules governing our committee. The usual debate in social choice theory and political philosophy asks which aggregation rule a group should adopt—premise-driven procedures versus outcome-driven ones. This literature is rich with impossibility results showing that no rule satisfies everything we want from a democratic decision-making body. However, that debate assumes that the rule is chosen, explicitly, by someone. It assumes a moment of constitutional design where the group decides, "We will vote on premises first," or "We will vote on conclusions first."

  In actual committees like ours, nobody chooses a rule. The rule is fixed by the order of business, which is fixed by whoever chairs the meeting and by procedural inertia. We did not sit down and vote on our voting method; we followed the template used by the previous committee, which followed the template from the year before. The agenda was not a chosen instrument of collective will; it was a historical artifact managed by the chair. This means the standard fixes quietly relocate the question rather than answering it. Telling us that we should have used a different aggregation rule does not help when the aggregation rule is not something we are permitted to select. It is embedded in the workflow, the spreadsheet template, and the chair's gavel.

  This proposal outlines a one-semester term paper that investigates this gap between the theoretical treatment of agenda-setting and the practical reality of procedural inertia. The central research question is: when the collective judgment a panel reaches depends on the sequence in which its questions are taken up, is that agenda-dependence a defect of the procedure that should be eliminated, a cost to be distributed fairly (whoever controls the agenda controls the outcome, which is a real assignment of power), or an unavoidable feature of any multi-member body making linked judgments?

  I intend to argue that the standard literature leaves this question open because it focuses on ideal design rather than non-ideal administration. The standard defense of premise-based procedures does not tell us who gets to decide which propositions count as premises. The impossibility results establish a dilemma without ranking the ways of living with it. My project will move beyond the identification of the paradox to an evaluation of its normative status in contexts where the procedure is not up for debate. I will reconstruct the fellowship-panel case formally, work through how the answer changes under at least two different accounts of what the panel is for, and test the candidate answers against hard cases where changing the agenda would flip a result the members care about.

  The goal of this paper is not merely to describe the paradox but to categorize it. Is it a bug? Is it a feature? Or is it a power dynamic disguised as a technicality? By the end of the semester, I aim to provide a determinate answer to this question, grounded in an analysis of the purpose of collegial bodies and the reality of their operational constraints. This proposal details the theoretical background, the specific formulation of the research question, the methodological steps I will take over the course of the term, and an assessment of the feasibility and risks involved in this project.

  ## Theoretical Background and the Gap in Existing Literature

  To understand why this project is necessary, it is important to first map the terrain of the existing literature and identify precisely where it fails to address the problem posed by the fellowship panel. The phenomenon I observed is a variant of what is often called the discursive dilemma or the doctrinal paradox. In its standard formulation, this paradox arises when a group makes decisions on multiple interconnected propositions. If the group votes on each proposition individually and accepts the logical consequences of those votes, they may arrive at a different conclusion than if they voted directly on the conclusion itself.

  In the context of my panel, the propositions were the criteria: significance, feasibility, and fit. The conclusion was funding. The panel voted on the premises (the criteria) and aggregated those votes to determine eligibility, only to find that the aggregated eligibility did not align with the aggregated judgment on the conclusion (the ranking). The standard response to this paradox in social choice theory is to analyze the properties of different aggregation rules. Scholars compare premise-based procedures, where the group votes on the reasons and accepts the logical outcome, against conclusion-based procedures, where the group votes directly on the outcome and ignores the consistency of the reasons.

  The literature demonstrates that both approaches have flaws. Premise-based procedures ensure logical consistency but may lead to outcomes that no individual member actually supports. Conclusion-based procedures respect the majority will on the outcome but may result in a decision that is unsupported by the majority of the reasons. Impossibility theorems show that no aggregation rule can satisfy a set of seemingly reasonable conditions simultaneously, such as universal domain, systematicity, and anonymity. This body of work is rigorous and mathematically precise. It successfully identifies that there is a tension between logical consistency and democratic responsiveness.

  However, this literature operates under a specific assumption that does not hold in the case of my fellowship panel. It assumes that the aggregation rule is a variable that the group can choose. The debate is framed as: "Which rule should we adopt?" This implies a moment of decision where the group steps back from its substantive task and selects the procedure by which it will decide. It treats the procedure as an object of collective choice, subject to the same democratic norms as the substantive decisions.

  In the real world of academic committees, this assumption is false. Procedures are rarely chosen explicitly. They are inherited. The fellowship panel did not vote to use a premise-based procedure; we used it because the form we were given had boxes for "Significance," "Feasibility," and "Fit," and a separate section for "Final Ranking." The order of business was set by the chair, who was following the protocol of the previous year. The agenda was not a choice; it was a constraint. This distinction is crucial because it changes the normative implications of the paradox.

  If the rule is chosen, then the group bears responsibility for the inconsistencies that arise. If the group chooses a premise-based procedure knowing it might lead to a outcome no one wants, they have accepted that risk. But if the rule is fixed by inertia, the group cannot be said to have accepted the risk. The inconsistency is not a product of their democratic will; it is a product of administrative history. This shifts the question from "Which rule is better?" to "How do we evaluate a rule we did not choose?"

  Furthermore, the standard literature treats the agenda as neutral. It assumes that the propositions being voted on are given or that the selection of premises is unproblematic. But in the fellowship panel, the definition of the criteria was itself a matter of interpretation. What counts as "significant"? What counts as "realistic"? The chair controls the discussion that defines these terms. If the chair emphasizes feasibility over significance during the deliberation, they influence how members vote on the premises. Thus, the agenda is not just the order of voting; it is the framing of the questions.

  The senior colleague's dismissal of the paradox as an "artifact of voting order" relies on the assumption that the voting order is arbitrary. He suggests that if we had voted differently, the problem would vanish. But this ignores the fact that the voting order determines which judgments are treated as premises and which are treated as conclusions. By treating the criteria as premises, we gave them a certain weight. By treating the final ranking as a conclusion, we gave it a different weight. Changing the order changes the weight. Therefore, the voting order is not arbitrary; it is a distribution of authority.

  Existing positions leave the question open because they do not account for this distribution of authority in non-ideal contexts. The standard defense of premise-based procedures argues that they promote reason-giving and accountability. But this defense assumes that the premises are agreed upon. If the premises are imposed by procedural inertia, the accountability is illusory. The impossibility results establish a dilemma without ranking the ways of living with it. They tell us we cannot have everything, but they do not tell us what to do when we are forced into a specific corner by institutional habit.

  This project seeks to fill this gap. It moves the discussion from the design of ideal procedures to the evaluation of actual procedures. It asks not what we should choose, but how we should judge what we have. This requires a shift in methodology. Instead of comparing abstract rules, I will analyze a specific case of procedural inertia and test it against normative standards that are applicable to non-ideal institutions. I will not ask whether the panel could have done better in the abstract. I will ask whether the panel's actual operation was defective, legitimate, or inevitable given the constraints of its context.

  ## Formulating the Research Question

  The core of this project is the research question. As noted in the introduction, the question must be stated so that it has a determinate answer. A question like "Is agenda-dependence bad?" is too vague. It invites a subjective response. A question like "How does agenda-dependence affect outcomes?" is descriptive, not normative. I need a question that forces a classification based on specific criteria.

  The question I will pursue is this: **Given the constraint of procedural inertia in collegial bodies, does agenda-dependence function primarily as a procedural defect undermining legitimacy, a legitimate allocation of power to the chair, or an unavoidable feature constitutive of deliberation?**

  This question is designed to be determinate because it sets up three mutually exclusive categories and demands that the evidence from the case study fit one of them best. It does not allow for a response that says "it depends" without specifying the conditions under which it falls into one category or another. To ensure the answer is determinate, I will establish criteria for each category within the paper.

  For agenda-dependence to be classified as a **procedural defect**, it must be shown that it introduces arbitrariness that violates the core purpose of the panel. If the panel exists to track the truth about applicant merit, and the agenda manipulation allows for funding decisions that contradict the evidence of merit, then it is a defect. If the panel exists to represent the will of the faculty, and the agenda allows a minority to dictate outcomes, then it is a defect. The criterion here is fidelity to the panel's stated purpose.

  For agenda-dependence to be classified as a **legitimate allocation of power**, it must be shown that the control over the agenda is a recognized and acceptable role of the chair. In many organizations, the chair is empowered to set the agenda to ensure efficiency. If the inconsistency is the price paid for having a streamlined process managed by a responsible officer, then it is a cost to be distributed. The criterion here is institutional authorization and functional necessity.

  For agenda-dependence to be classified as an **unavoidable feature**, it must be shown that any attempt to eliminate it would destroy the deliberative capacity of the group. If fixing the agenda requires removing the ability to discuss criteria separately, and that discussion is essential for members to understand the proposals, then the dependence is unavoidable. The criterion here is the preservation of deliberative value.

  By defining these criteria in advance, the project aims to arrive at a verdict. I will not simply describe the three options; I will argue that one of them provides the best fit for the reality of academic committees. This requires analyzing the purpose of the panel. Is the panel a truth-seeking body? Is it a political body? Is it a bureaucratic body? The answer to the research question depends on the answer to this prior question. Therefore, part of my method will be to test the research question under different accounts of the panel's purpose.

  This formulation also addresses the colleague's dismissal. He treated the agenda as an artifact. My question treats the agenda as a mechanism. If it is a mechanism, it has a function. If it has a function, that function can be evaluated. If the function is to distribute power, then we must ask if that distribution is fair. If the function is to facilitate deliberation, then we must ask if the distortion is worth the benefit. By forcing this evaluation, the question moves beyond the observation of the paradox to the judgment of the institution.

  The determinacy of the answer will rely on the weight of the evidence from the formal reconstruction and the normative testing. If the formal reconstruction shows that the agenda control allows for outcomes that violate the panel's own criteria consistently, then the "defect" hypothesis gains weight. If the reconstruction shows that the agenda control prevents gridlock and allows decisions to be made where none would otherwise occur, then the "power" or "feature" hypotheses gain weight. I will not leave the question open-ended. I will commit to a conclusion based on the analysis of the case.

  ## Methodology: A Month-by-Month Plan

  To answer this question within the scope of a one-semester term paper, I need a structured approach. I cannot rely on general reflection; I need to build a specific argument step-by-step. The semester is roughly four months long. I will divide the work into four phases, each corresponding to a month of the term. This plan ensures that I cover the formal, normative, and practical aspects of the problem without becoming bogged down in any single area.

  ### Month One: Formal Reconstruction of the Case

  The first month will be dedicated to reconstructing the fellowship-panel case formally. I cannot rely on my memory of the event; I need to model it logically to demonstrate exactly how the agenda dependence occurred. This will involve creating a simplified mathematical model of the voting scenario.

  I will define the set of voters (the panel members), the set of propositions (the three criteria), and the logical connection between them (the rule for funding). I will then assign voting profiles that match the scenario I observed: majorities for each criterion, but no majority for the conjunction of all three. This will allow me to demonstrate the paradox clearly and show how the order of voting determines the outcome.

  Crucially, I will model the agenda setting. I will represent the chair's role not as a voter, but as the entity that determines the sequence of propositions. I will show how changing the sequence changes the outcome. For example, if the panel votes on "Overall Merit" first, the result is X. If the panel votes on "Criteria" first, the result is Y. I will calculate the frequency with which these divergences occur under different voting profiles. This will tell me whether the paradox I observed was a rare anomaly or a systemic feature of the procedure.

  This formal work is necessary to ground the philosophical argument. Without it, the claim that the agenda controls the outcome is merely anecdotal. With it, I can show the structural inevitability of the problem under the given rules. I will also use this month to review the standard treatments of the discursive dilemma to ensure my formalization aligns with the existing literature, even as I prepare to critique its application.

  The deliverable for this month will be a section of the paper that presents the model and proves the existence of the agenda-dependence in this specific context. This section will not yet argue whether this is good or bad; it will simply establish that it is real and measurable.

  ### Month Two: Normative Frameworks and Accounts of Purpose

  In the second month, I will move from the formal to the normative. The formal model shows that the agenda matters. The normative analysis will determine whether that mattering is problematic. As outlined in the research question, the answer depends on what the panel is for. I will work through at least two different accounts of the panel's purpose.

  The first account is the **epistemic account**. On this view, the panel exists to reach the best verdict. Its goal is truth-tracking. It aims to identify the most deserving applicants based on objective merit. Under this account, agenda-dependence is likely a defect. If the truth about an applicant's merit is independent of the voting order, then a procedure that yields different results based on the order is failing to track the truth. I will explore this by asking: does the premise-based procedure track truth better than the conclusion-based procedure? The literature suggests premise-based procedures are better for reason-tracking, but if the premises are arbitrary, this advantage disappears. I will test this against the fellowship case.

  The second account is the **political account**. On this view, the panel exists to produce a decision the members can each endorse in public. Its goal is legitimacy and stability. It aims to avoid conflict and ensure that the outcome is accepted by the department. Under this account, agenda-dependence might be a cost or a feature. If the agenda allows the chair to steer the group away from contentious votes and toward a compromise, it serves a political function. I will explore this by asking: does the procedure allow members to save face? Does it allow the department to move forward without fracturing?

  I may also consider a third account, the **bureaucratic account**, where the panel exists to process files efficiently according to external rules. Under this account, agenda-dependence is irrelevant as long as the forms are filled out correctly.

  By working through these accounts, I will determine which one best fits the reality of the fellowship panel. If the panel acts like a truth-seeking body but uses a procedure that undermines truth, then it is defective. If it acts like a political body and uses a procedure that manages conflict, then the agenda control is a legitimate power. This month's work will involve philosophical argumentation, drawing on concepts of legitimacy, truth, and institutional purpose. I will not cite specific authors, but I will engage with the concepts they developed.

  The deliverable for this month will be a section of the paper that evaluates the formal model against these normative standards. It will argue for one account of the panel's purpose as the most accurate description of its function.

  ### Month Three: Hard Cases and Stress Testing

  In the third month, I will test the candidate answers against hard cases. It is easy to argue that agenda-dependence is benign when the outcomes are similar. It is harder to argue when changing the agenda flips a result the members care about. I need to construct scenarios where the stakes are high and the divergence is clear.

  I will imagine a case where the applicant is borderline on all criteria. In this case, the agenda control determines whether they are funded or not. I will ask: who should decide this? The majority of the faculty? Or the chair who sets the agenda? If the chair uses the agenda to fund their own student, is that corruption or procedure? I will also imagine a case where the criteria conflict. For example, a project is highly significant but highly risky. A premise-based procedure might reject it because it fails the feasibility criterion. A conclusion-based procedure might accept it because the majority values significance over risk.

  I will use these hard cases to test the three hypotheses.
  1.  **Defect:** If the agenda allows the chair to override the majority will on high-stakes decisions, is that a defect? Yes, if we value democracy. No, if we value expertise.
  2.  **Cost:** If the agenda allows the chair to break ties, is that a fair distribution of power? Only if the chair is accountable.
  3.  **Feature:** If the agenda allows the group to discuss the trade-offs between significance and risk, is that unavoidable? Yes, if deliberation requires breaking down the decision.

  This stress testing will help me refine the determinate answer. It will show where the boundaries lie. It will also help me address the colleague's dismissal. He said it was an artifact. I will show that it is a lever. By pulling the lever, the chair moves the outcome. The question is whether they should hold the lever.

  The deliverable for this month will be a section of the paper that presents these hard cases and analyzes the implications for each hypothesis. This section will provide the evidence needed to support the final conclusion.

  ### Month Four: Synthesis and Writing

  In the fourth month, I will synthesize the findings from the previous three months into a coherent argument. I will write the introduction and conclusion, ensuring that the research question is answered clearly. I will revise the formal section to ensure it is accessible to a philosophical audience. I will refine the normative arguments to ensure they are precise.

  I will also use this time to address the feasibility concerns. If the formal modeling proves too complex, I will simplify it. If the normative analysis becomes too abstract, I will ground it back in the fellowship case. The goal is to produce a paper that is rigorous but readable.

  I will also include a section on the limitations of the project. I will acknowledge that one case study cannot prove a universal theory. But I will argue that it illuminates a specific problem that is widespread in academic governance.

  The deliverable for this month is the final paper. It will be approximately 6000 words. It will begin with the anecdote, move to the formal model, then to the normative analysis, then to the hard cases, and end with the determinate answer to the research question.

  ## Possible Conclusions and Deciding Considerations

  As I embark on this project, I must anticipate the possible conclusions. The research question offers three main options: defect, cost, or feature. Each has different implications for how we should organize academic committees.

  If I conclude that agenda-dependence is a **defect**, the implication is that we should reform the procedure. We should either vote on conclusions first or find a way to make the premises immune to agenda manipulation. This might require a change in the bylaws of the department. It might require training for chairs. It treats the problem as something that can and should be fixed. The consideration that would decide in favor of this conclusion is if the agenda-dependence leads to outcomes that violate the department's own stated values. If the fund goes to less deserving candidates because of the voting order, that is a defect.

  If I conclude that agenda-dependence is a **cost**, the implication is that we should regulate the power of the chair. We cannot eliminate the dependence, but we can ensure that the person controlling the agenda is accountable. This might require term limits for chairs or oversight committees. It treats the problem as a political reality that needs management. The consideration that would decide in favor of this conclusion is if the agenda-dependence allows for necessary efficiency but creates risks of abuse. If the committee would gridlock without the chair's guidance, but the guidance can be misused, then it is a cost to be managed.

  If I conclude that agenda-dependence is an **unavoidable feature**, the implication is that we should stop trying to fix it. We should accept that all deliberation involves framing, and framing involves power. We should focus instead on the quality of the deliberation itself. This treats the problem as constitutive of collective reasoning. The consideration that would decide in favor of this conclusion is if eliminating the agenda-dependence requires eliminating the discussion of criteria. If we cannot discuss significance without voting on it, and voting on it creates the paradox, then the paradox is the price of discussion.

  I expect that my analysis will lead me to a hybrid conclusion, but one that leans heavily toward one side. I suspect that in the context of academic fellowships, where the goal is meritocratic distribution, agenda-dependence functions primarily as a defect. The reason is that the criteria are supposed to be objective measures of merit. If the order of voting changes the merit judgment, then the procedure is failing its epistemic purpose. However, I must remain open to the possibility that the political function of the committee outweighs the epistemic function. If the department values harmony over precision, then the cost or feature hypothesis might be stronger.

  The deciding consideration will be the weight of the "procedural inertia" factor. If the inertia is merely laziness, then the defect hypothesis is strong. If the inertia is a safeguard against constant renegotiation of rules, then the cost hypothesis is strong. I will need to determine the nature of the inertia during the first month of research.

  ## Feasibility and Risk Assessment

  A project of this scope carries several risks. I need to be honest about what would count as the project failing and whether this is too much for one semester.

  **Risk 1: Formal Complexity.** The formal reconstruction of the voting paradox could become too technical. If I get bogged down in the mathematics of social choice theory, I may lose sight of the philosophical question. This would count as a failure because the goal is to answer the normative question, not to prove a theorem. To mitigate this, I will keep the formal model as simple as possible. I will use a small number of voters and criteria to illustrate the point without needing complex proofs.

  **Risk 2: Normative Ambiguity.** The question asks for a determinate answer, but the normative landscape is messy. It is possible that I will find that the answer truly does depend on the account of the panel's purpose, and that there is no fact of the matter about what the panel is for. This would undermine the claim of determinacy. To mitigate this, I will argue that the institutional context of a university department imposes a specific purpose (meritocratic distribution) that limits the range of acceptable accounts. I will not argue from a vacuum; I will argue from the context of the fellowship.

  **Risk 3: Vagueness of "Agenda Control."** The prompt warns that the notion of "agenda control" might not be precise enough to do the work. This is a real risk. If I cannot define what the chair controls exactly, the argument will be slippery. To mitigate this, I will define agenda control operationally: it is the power to set the order of voting and the definition of the criteria. I will stick to this definition throughout the paper.

  **Risk 4: Scope Creep.** This topic could easily expand into a dissertation. I am limiting myself to one semester and 6000 words. I must resist the urge to solve the entire problem of social choice theory. I will focus strictly on the fellowship panel case and the specific question of agenda-dependence. I will not attempt to generalize to all political bodies.

  **Assessment of Workload:** Is this too much for one semester? For a third-year graduate student, this is a manageable but demanding load. The formal work requires precision, and the normative work requires depth. However, since I am not conducting empirical research or learning a new language, the time commitment is primarily intellectual. The month-by-month plan is realistic. The risk is in the writing phase, where synthesizing the formal and normative sections may take longer than expected. I have built some flexibility into the fourth month to accommodate this.

  I believe the project is feasible because the core idea is narrow. I am not asking about all voting systems. I am asking about one specific feature of one specific type of committee. This narrowness allows for depth within the word limit. The challenge will be to maintain that depth without becoming obscure.

  ## Conclusion: The Stakes of Procedural Inertia

  This project matters because it addresses a blind spot in how we understand our own institutions. We spend a lot of time debating the outcomes of our committees—who got the fellowship, who got the job. We spend very little time debating the procedures that produced those outcomes, except when they break visibly. When they break subtly, as in the case of the fellowship panel, we tend to wave them off as artifacts.

  But procedures are not neutral. They are vessels of power. The order of business is a political tool. By ignoring this, we allow power to be exercised without accountability. The chair controls the agenda, and thus controls the outcome, but claims to be merely following procedure. This project seeks to expose that dynamic.

  By asking whether agenda-dependence is a defect, a cost, or a feature, I am asking whether we should tolerate this hidden power. If it is a defect, we should fix it. If it is a cost, we should regulate it. If it is a feature, we should acknowledge it. Any of these answers is better than the current state of ignorance, where we pretend the procedure is neutral while it shapes our collective judgments.

  The paper will contribute to the literature by shifting the focus from ideal rule choice to non-ideal procedural inertia. It will show that the impossibility results are not just theoretical curiosities but practical constraints that operate through the mundane details of committee work. It will argue that the standard treatments leave the question open because they ignore the reality of how rules are fixed.

  I am confident that this project can be completed within the semester. The materials are available, the case is at hand, and the question is clear. The risk of failure lies in the execution, not the conception. If I stay focused on the research question and adhere to the methodological plan, I will produce a paper that offers a determinate answer to a problem that is usually dismissed.

  The final paper will begin with the story of Applicant X. It will end with a verdict on the procedure that judged her. In between, it will trace the line from the voting box to the chair's gavel, showing how the order of questions determines the fate of answers. This is not just a technical issue. It is a question of how we govern ourselves in the small spaces of academic life. And if we cannot get it right there, where the stakes are fellowships and not laws, we are unlikely to get it right in the larger spaces of political life.

  This proposal represents a commitment to that inquiry. It outlines the path from observation to argument, from paradox to verdict. It acknowledges the risks and plans for them. It sets a high standard for determinacy and feasibility. I am ready to begin the work.
