      *   **Vietnam:** Failed the test. The Domino Theory assumed unlimited communist expansion without asking if Ho Chi Minh wanted global conquest or just unification.
      *   **Rwanda:** Passed the test. Genocide has no moral ceiling; inaction was the sin.
      *   **Thucydides:** Failed the test. It's a structural pattern, not an inquiry into specific aims.

