  Here are two other rules that fit his past track record almost perfectly but would lead him to a different conclusion on Arcadia.

  **Rival Rule A: "The Capability is Destiny" Realist**
  *   **The Logic:** Military capacity dictates intent. If a state spends a decade building a navy capable of controlling a sea lane, they *will* try to control the sea lane, regardless of what they say about "disputed islands."
  *   **Fits Past Verdicts:** Explains Gulf '91 (Saddam had the army, so he had the ambition). Explains opposition to Iraq '03 (Saddam had no WMD capacity, so no real threat). Explains opposition to Vietnam (North Vietnam lacked the capacity to threaten the US homeland directly).
  *   **Fails on:** Rwanda (Capacity didn't matter, morality did) and Thucydides (He explicitly rejects this).
  *   **Prediction on Arcadia:** **Endorse the Hawks/Task Force.** The 10-year buildup proves the intent to dominate the sea lane. The "islands only" claim is a lie by definition of the capability.

  **Rival Rule B: "The Vital Interest" Utilitarian**
  *   **The Logic:** Intervention is only justified if a tangible, material national interest (oil, trade lanes, borders) is immediately threatened. Moral arguments (Rwanda) are secondary to strategic necessity.
  *   **Fits Past Verdicts:** Explains Gulf '91 (Oil/Stability). Explains opposition to Iraq '03 & Vietnam (No direct vital interest). Explains skepticism of Thucydides (Abstract power transitions aren't vital interests).
  *   **Fails on:** Rwanda (He supported it despite no vital interest).
  *   **Prediction on Arcadia:** **Endorse the Hawks/Task Force.** If the intelligence says the sea lane is the target, that is a vital economic/strategic interest. Unlike Rwanda, this isn't about morality; it's about the economy. You fight for the lane.

  ### 4. The Dinner Question
  To separate your grandad's **"Defined Ceiling"** rule from the Rivals' **"Capability"** or **"Vital Interest"** rules, you need to ask a question that isolates *intent* from *capacity*.

  **Ask him this:**
  > "Grandad, if Arcadia's navy is big enough to take the whole sea lane, but they agree to binding international arbitration that limits them to the islands, do you stand down? Or does the *capacity* to take the lane make them a threat regardless of the agreement?"

  *   **If he says "Stand down":** He is running the **Defined Ceiling Test** (Intent/Verification matters most). He believes a verified limit neutralizes the threat.
  *   **If he says "They're still a threat":** He is running the **Capability is Destiny** rule (Rival A). He believes the knife in the pocket matters more than the promise not to stab.
  *   **If he says "It depends on the lane's value":** He is running the **Vital Interest** rule (Rival B). He is weighing the cost of the risk against the economic prize.

  **My bet:** He'll say "Stand down." He's spent thirty years arguing that you don't fight a war against a *capability*, you fight it against a *plan*. If the plan is constrained by arbitration, the Munich analogy dies.
