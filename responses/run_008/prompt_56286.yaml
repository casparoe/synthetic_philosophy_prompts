  ### 2. The Master Rule: "The Defined Ceiling Test"
  This is the principle that explains every single one of his past verdicts.

  **The Rule:** *Historical analogies justify intervention only when the adversary's strategic aims are proven **unlimited** (Gulf '91) or the cost of inaction is **moral catastrophe** (Rwanda). If an adversary claims a **limited ceiling** (Iraq '03, Vietnam), you must verify that ceiling is false before shooting. Structural patterns (Thucydides) are irrelevant without specific intent.*

  *   **Why it fits:**
      *   **Munich:** The lesson failed because people stopped checking for "ceilings" and just assumed every dictator was Hitler.
      *   **Gulf '91:** Passed the test. Saddam swallowed a country; his ceiling was unknown/unlimited.
