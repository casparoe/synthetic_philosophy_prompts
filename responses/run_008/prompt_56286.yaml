  ### 1. The Prediction
  **He will endorse neither side, but he will lean against the Task Force.**

  Expect a newsletter that opens by calling the Hawks' use of "Munich" lazy and the Doves' use of "Tonkin" complacent. He will argue that the Hawks are making the 2003 mistake (assuming "Hitler's Face" without verifying "Hitler's Situation") by treating a leaked doctrine as proof of unlimited intent. However, he will also warn the Doves that inaction *can* be a Munich (the Rwanda point) if the sea lane is truly vital.

