  What the practice presupposes
  Your career implicitly banked on a weak form of functionalism, specifically the claim that mental states are individuated by their causal roles rather than their physical constitution. When you inferred human anhedonia from a rat's lack of lever-pressing, you assumed that the computational or causal structure of "reward seeking" is conserved across species, even if the neural hardware varies. This aligns with multiple realizability, suggesting that the property of "being in pain" or "seeking reward" is defined by what the system does and how it responds to inputs, not strictly by which neurons fire. Extending this to deep neural networks follows the same logic: if cognition is a form of information processing, then silicon weights can realize cognitive states just as biological synapses do, provided the functional organization is sufficiently isomorphic.

  What it doesn't need
  Crucially, this practice does not require strict type identity theory, which posits that mental state types are identical to specific physical brain state types across all instances. An identity theorist could still run your experiments, but they would have to reinterpret the goal: rather than modeling human *mental states* in rats, they would be studying conserved *neurophysiological mechanisms* that happen to correlate with those states in humans. They would argue that because humans and rats share evolutionary homology in serotonin systems, manipulating the rat brain manipulates the physical substrate that *constitutes* the mental state in humans, even if the rat's subjective experience differs. Thus, the work survives by shifting focus from the psychology to the biology, treating the behavior as a readout of the mechanism rather than proof of shared phenomenology.

  Where it gets shaky
  The stability of this framework fractures when you ask exactly *which* level of abstraction guarantees the transfer, a problem that becomes critical when comparing rats to humans and collapses entirely when comparing brains to deep neural networks. With animals, you rely on evolutionary homology; the rat's brain is a simplified version of yours, so the functional circuits are likely structurally similar, but when you move to the forced swim test, you are inferring a complex emotional state like "despair" from a crude behavioral output, risking the error of conflating adaptive immobility with depressive cognition. This granularity problem is manageable in pharmacology because the chemical substrates (receptors, transporters) are often more conserved than the behaviors they produce, but it becomes precarious with deep neural networks, which lack any biological homology whatsoever. If you treat a DNN as a model of human memory, you are assuming that the mathematical optimization of error gradients is functionally equivalent to synaptic plasticity governed by neurochemistry, a leap that ignores the embodied, embedded, and evolutionary context that shaped human cognition. While a rat and a human share a common ancestor that validates some structural comparison, a DNN and a human share only the abstract logic of learning, meaning that any success the network achieves might be via a completely alien route that mimics the output without replicating the process. Consequently, the identity theorist struggles here because there is no physical type to identify across silicon and biology, and the functionalist struggles because the "function" might be realized so differently that the label "memory" or "attention" becomes merely metaphorical. The shakiness lies in the assumption that behavior alone validates the model; in pharmacology, a drug failure in humans after rat success reveals the gap in functional mapping, but in AI, a model solving a task doesn't prove it understands the task, leaving the entire enterprise of cognitive modeling vulnerable to the charge that it is merely curve-fitting behavior without capturing the mind.

  What would change
  If these assumptions were explicitly challenged, research would shift from validating models based on behavioral output to validating them based on mechanistic isomorphism. Pharmacologists would stop claiming to model depression and start claiming to model serotonin transport, while AI researchers would stop claiming to model cognition and start claiming to model task performance. This humility would clarify that animal models are tools for probing biological constraints, not windows into alien minds, and that neural networks are engineering solutions, not psychological theories. Ultimately, it would force a distinction between simulating the effects of a mind and replicating the causes, ensuring that the "straight face" of the experimenter rests on solid ontological ground rather than pragmatic success.
