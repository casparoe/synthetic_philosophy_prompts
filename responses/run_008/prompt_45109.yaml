      *   *The Sliver (Aggregation):* Prioritarianism *does* risk implying we should give small benefits to the very worst off over large benefits to the moderately well off, depending on the curvature of the priority function. Dana is right that she can adjust the curvature to avoid this, but Miguel is right that if she adjusts it too much to match intuition, she looks like a Weighted Utilitarian (which is close to her "conditional egalitarian" description).
      *   *Dana's Distinction:* She describes something like "Conditional Egalitarianism" (equality is good only if it benefits someone) or "Pluralist Prioritarianism." Miguel is right that if the "weight" is the mechanism, it faces the same math problems.

