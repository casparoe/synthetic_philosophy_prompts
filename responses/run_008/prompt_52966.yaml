prompt: |-
  Before I engage any more of the literature on the nonidentity problem, I want the specification the literature is arguing over. Draft the desiderata that any adequate solution must meet. The cases it must get right should include the standard ones — depletion policies, the risky conservation decision, the teenage mother who knowingly conceives a child she could have had later under better conditions — plus this variant I've been working with: a fertility clinic finds that a given sperm batch carries a 50% risk of a serious, non-fatal condition; switching to a batch available a year later would mean different children entirely, and the parents have made clear it is this batch or no child. The eventual children lead lives worth living and, when adult, insist they would rather exist with the condition than not exist. State which verdicts on this case a solution is required to deliver and which it may leave open.

  Beyond cases, the spec must cover: the distinctions a solution may not collapse (harming versus wronging; identity-dependent versus identity-independent wrong-making features; lives worth living versus lives that are good enough to generate); the constraints it cannot violate (it may not render all identity-affecting procreation impermissible, and it may not rescue the wrongness of depletion by denying the nonidentity itself); and the scope question — whether a solution must extend to non-person-affecting cases like the clinic or may treat them as a separate problem. Mark each desideratum as non-negotiable or as the preference of one camp, with the motivating case behind each. Then do two further things: identify any subset of the desiderata that is jointly unsatisfiable — I suspect the person-affecting restriction and the wrongness of depletion cannot both be kept, and I'd like that either confirmed or dissolved — and name the single requirement that does the most to exclude otherwise-live candidates. A numbered list plus a table is fine; skip any scorecard of existing views.

  Throughout, distinguish what you're confident in from what you're stipulating, and single out the one point in the spec you're least sure belongs on the list at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Draft the *desiderata* (specifications/requirements) that any adequate solution to the Non-Identity Problem (NIP) must meet.
      *   **Context:** The user is engaging with the literature but wants to clarify the target first. They have a specific variant case (Fertility Clinic/Sperm Batch) they want included.
      *   **Requirements:**
          *   Include standard cases (Depletion, Risky Conservation, Teenage Mother).
          *   Include the user's variant (Fertility Clinic, 50% risk, different children if wait, "this batch or no child", lives worth living, adults prefer existence).
          *   Specify verdicts required vs. open for the variant case.
          *   Cover conceptual distinctions (Harming vs. Wronging, Identity-dependent vs. Independent, Lives Worth Living vs. Good Enough).
          *   Cover constraints (No banning all identity-affecting procreation, No denying non-identity to save depletion).
          *   Cover Scope (Person-affecting vs. Non-person-affecting).
          *   Mark desiderata as "Non-negotiable" or "Preference of one camp" with motivating cases.
          *   Identify jointly unsatisfiable subsets (specifically checking the Person-Affecting Restriction vs. Wrongness of Depletion).
          *   Name the single requirement that excludes the most candidates.
          *   Format: Numbered list + Table (optional but allowed).
          *   Tone/Style: Distinguish confidence from stipulation. Single out the least sure point.
          *   Constraint: Skip scorecards of existing views.

  2.  **Deconstruct the Non-Identity Problem (NIP):**
      *   *Core Issue:* Actions that bring specific people into existence (who wouldn't otherwise exist) can seem wrong (e.g., depleting resources, teenage pregnancy) even if those people have lives worth living. Standard person-affecting views say you haven't harmed them (they are better off existing than not existing), so how is it wrong?
      *   *Standard Cases:*
          *   Depletion (Parfit): Using up resources harms future people, but they wouldn't exist if we saved resources.
          *   Teenage Mother: Having a child now gives them a hard life, but waiting would mean a *different* child.
          *   Risky Conservation (Cohen): Risking a defect vs. waiting for a safe child.
      *   *User's Variant:* Fertility Clinic. 50% risk of serious non-fatal condition. Wait = different child. "This batch or no child." Adults say "Better to exist with condition."
      *   *Conceptual Distinctions:*
          *   Harming (making worse off) vs. Wronging (violating a right/norm).
          *   Identity-dependent (wrong because *this* person exists) vs. Independent (wrong regardless of who exists).
          *   Lives Worth Living (net positive) vs. Good Enough (threshold).
      *   *Constraints:*
          *   Non-Implausibility: Don't ban all procreation.
          *   Honesty: Don't deny the metaphysics of identity to solve the ethics.
      *   *Scope:* Does the solution need to cover impersonal cases (e.g., adding happy people to a world) or just identity-affecting ones?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Case Verdicts:*
          *   Depletion: Must be wrong. (Non-negotiable for most).
          *   Teenage Mother: Must be wrong (or at least not clearly permissible). (Non-negotiable for most).
          *   Clinic Variant: This is tricky. The user asks what verdicts are *required*.
              *   If the adults say "I'm glad I exist," does that make it permissible?
              *   Most theories say choosing a high risk of disability when a healthy alternative exists (even if different person) is wrong.
              *   *Requirement:* The solution must explain why selecting the risky batch is morally problematic *despite* the resulting adults' retrospective endorsement. It doesn't necessarily have to say it's *forbidden*, but it must account for the intuition that it's sub-optimal or risky in a way that matters. Let's make the verdict "Impermissible or Pro Tanto Wrong" a strong preference, but maybe leave "Forbidden" open if the "no child" alternative is heavy. Actually, the prompt asks what verdicts a solution is *required* to deliver.
              *   *Decision:* The solution must deliver a verdict that acknowledges the moral cost. It cannot simply say "Perfectly Permissible because they are happy."
              *   *Refinement:* Let's align with the Depletion intuition. If Depletion is wrong, the Clinic case (harming future specific people by risking their health vs waiting for healthy others) should also be wrong.
              *   *Required Verdict:* The choice of the risky batch is morally objectionable (wrong or sub-optimal), even if the resulting lives are worth living.
              *   *Open:* Whether it is *all-things-considered* impermissible given the "or no child" constraint.

      *   *Conceptual Distinctions:*
          *   Must distinguish Harming vs. Wronging. (Non-negotiable, otherwise NIP dissolves into "no harm no foul").
          *   Must distinguish Identity-Dependent vs. Independent. (Non-negotiable, this is the heart of the problem).
          *   Lives Worth Living vs. Good Enough. (Preference of Threshold views vs. Total/Average views).

      *   *Constraints:*
          *   No "Procreation is always wrong." (Non-negotiable).
          *   No "Identity is flexible." (Non-negotiable).

      *   *Scope:*
          *   Must it cover impersonal cases? (Preference of Impersonalists). Person-affecting views might say no.

  4.  **Addressing the "Jointly Unsatisfiable" Request:**
      *   The user suspects Person-Affecting Restriction (PAR) + Wrongness of Depletion are incompatible.
      *   *Analysis:* PAR says an act is wrong only if it makes some particular person worse off. Depletion creates people who are not worse off than they would otherwise be (they wouldn't exist). Therefore, PAR + Depletion Wrongness = Contradiction.
      *   *Confirmation:* Yes, this is the core of Parfit's conclusion. You must drop PAR, deny Depletion is wrong, or accept a "wide" person-affecting view (which often collapses into impersonal).
      *   *Most Exclusionary Requirement:* The requirement that "An act can be wrong even if it harms no particular person" (rejecting strict PAR). This kills all strict person-affecting views.

  5.  **Addressing Confidence/Stipulation/Uncertainty:**
      *   *Confident:* The incompatibility of PAR and Depletion Wrongness. The need to distinguish harming/wronging.
      *   *Stipulating:* The specific verdict on the Clinic case (since it's the user's variant, I'm interpreting standard norms onto it).
      *   *Least Sure:* The Scope requirement (whether a solution *must* handle impersonal cases). Some argue NIP is *only* about identity-affecting cases.

  6.  **Structuring the Output:**
      *   Introduction acknowledging the task.
      *   Section 1: Case Verdicts (Standard + Variant).
      *   Section 2: Conceptual & Structural Desiderata (Table format for clarity on Negotiability).
      *   Section 3: Logical Tensions (The Unsatisfiable Subset).
      *   Section 4: The Exclusionary Requirement.
      *   Section 5: Confidence & Uncertainty Markers.

  7.  **Refining the Clinic Variant Verdict:**
      *   The prompt asks: "State which verdicts on this case a solution is required to deliver and which it may leave open."
      *   *Required:* It must explain why the choice is not *morally neutral*. It cannot say "There is no moral difference between Batch A (risky) and Batch B (safe/later)."
      *   *Open:* Whether the "or no child" constraint makes it permissible all-things-considered. (i.e., Is it a tragic choice or a forbidden one?)
      *   *Reasoning:* If we say Depletion is wrong, we imply we owe future people better conditions. In the Clinic case, we owe the potential child a better start, even if it means a different child. But the "no child" constraint adds a "non-existence" alternative.
      *   *Decision:* Required: The act is *pro tanto* wrong. Open: All-things-considered permissibility.

  8.  **Final Review against Constraints:**
      *   Did I skip scorecards? Yes.
      *   Did I mark Non-negotiable vs. Preference? Yes.
      *   Did I identify the unsatisfiable subset? Yes.
      *   Did I name the exclusionary requirement? Yes.
      *   Did I distinguish confidence/stipulation? Yes.
      *   Did I single out the least sure point? Yes.

  9.  **Drafting the Content (Mental Check of Terminology):**
      *   Ensure "Person-Affecting Restriction" is defined clearly.
      *   Ensure "Non-Identity" is treated as a metaphysical given (per constraints).
      *   Make sure the "Harming vs. Wronging" distinction is clear (McMahan's influence).

  10. **Final Polish:** Check tone. Needs to be analytical, precise, and philosophical. (Self-Correction: Make sure the table is clean and the unsatisfiable subset logic is rigorous).

  *(Self-Correction during drafting)*: I need to be careful with the "Preference of one camp" marking. For example, "Impersonal Principles" are a preference of Impersonalists, but "Person-Affecting Intuition" is a preference of Person-Affecting theorists. Since the goal is an *adequate solution*, usually the literature converges on rejecting strict PAR. I will mark adherence to strict PAR as a "Preference of one camp (Person-Affecting)" but note it conflicts with the "Non-negotiable" verdict on Depletion.

