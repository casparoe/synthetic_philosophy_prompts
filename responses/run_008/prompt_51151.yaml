answer: |-
  Dear friend,

  It is a pleasure to meet you on this ground, and I want to start by saying that the thinking you are doing in the van is real philosophy, even if you have never opened a textbook. You are wrestling with a problem that has occupied some of the sharpest minds for centuries, but you are doing it with a honesty that often gets lost in seminars. You asked me to be plain about whether your framing rests on a confused premise, so I will say it directly. Yes, the idea that an act only matters if it makes a difference to the outcome is confused. It is a very common confusion, because we live in a world that loves to measure things by results, but morality is not just about being a lever that moves the world. Sometimes it is about what kind of person you are becoming, and what things you are willing to join yourself to. If you only look at whether your single act changes the final tally, you will miss the point of most of your own verdicts.

  The principle that best captures your list, while fixing the broken bits, is something like this. An act is wrong if it makes you a participant in a harmful practice when you have a reasonable alternative, regardless of whether your specific contribution changes the outcome. This principle shifts the focus from causal impact to complicity. It says that what matters is not whether the river dies because of your bucket, but whether you are the kind of person who dumps buckets in rivers. It says that what matters is not whether the chicken lives because you skipped the sandwich, but whether you are willing to pay for a system that kills chickens. This explains why the assassin pool feels wrong even if the victim dies anyway. You are not just adding money; you are signing up for the murder. It explains the river case too. Even if the river is already dead, your act is one of pollution, and you have aligned yourself with the polluters. It also explains the sandwich. By buying it, you signal demand and participate in the industry, even if your single purchase does not change the order count at the slaughterhouse.

  However, this principle needs a second clause to handle the cases where you feel less guilt, because life is not black and white. The second clause is this. Participation is excused or lessened when the act is necessary for your livelihood or when the harm is too remote to constitute a genuine partnership in wrongdoing. This is what saves your van driving. You are adding exhaust, yes, but you are doing it to earn a living, and you have no reasonable alternative if you want to work as a plumber. That necessity dampens the wrongness. It does not erase the harm, but it changes your relationship to it from willing participant to reluctant contributor. This clause also helps with the plastic bottle. If the recycling system is broken or if the impact is truly negligible compared to industrial waste, your act feels like noise rather than signal. You are not participating in a harmful practice so much as navigating a flawed system where your individual choice carries no moral weight.

  Now we have to look at the verdicts that do not fit, because you asked for honesty about which ones must go. The principle I just described suggests that your verdict on the sweatshop t-shirt is inconsistent with your verdict on the chicken sandwich. If the sandwich is wrong because it supports a system of suffering, the t-shirt must be wrong for the same reason. Clothing is not strictly necessary in the same way food is, but more importantly, you identified the harm. You said you know the company uses sweatshop labour. If you are willing to call the sandwich wrong because of the suffering involved in its production, you cannot logically say the t-shirt is fine unless you can show a relevant difference. The only difference is that the chicken suffers directly and visibly, whereas the sweatshop worker is distant. But distance does not erase complicity. So, if I were you, I would change the verdict on the t-shirt. It should carry the same flicker of wrongness as the sandwich. Alternatively, you could decide the sandwich is fine, but given your gut says it is wrong, I suspect you value the integrity of not paying for suffering, and so the t-shirt verdict is the one that should be sacrificed to save the principle.

  There is another tension in your list regarding the voting. You feel you ought to vote in a general election even though it does not matter, but you acknowledge it only matters in the local one. The principle of participation handles this well if we view voting not as a way to change the outcome, but as a duty of citizenship. In the local election, you are a causal agent. In the general election, you are a participant in democracy. You vote to maintain the system, not just to pick the winner. This fits with the hosepipe ban too. Having a long shower during a ban is wrong not because your water usage dries up the reservoir, but because you are breaking a shared rule designed to protect everyone. It is a matter of fairness. You are taking a benefit while others restrict themselves. That is why it feels a bit wrong even if your single shower does not cause the drought.

  You asked about two cases I have not listed yet. The first is whether you should feel the same about the sandwich if everyone else had already stopped eating chicken. If everyone else stopped, the industry would collapse, and your single purchase might actually keep it alive single-handedly. In that case, your causal impact would be huge, and it would definitely be wrong. But if you mean a scenario where everyone else has stopped and the industry is gone, so your sandwich is a rare anomaly that does not sustain any system, then the wrongness fades. The wrongness comes from joining a harmful practice. If the practice no longer exists, you are not joining it, you are just eating a strange sandwich. However, if everyone else stops and you continue, you are signaling that the demand still exists, potentially encouraging others to restart. So the pressure remains, but it is lighter. The second case is whether a thousandth-share shareholder in the assassin pool is worse than a donor. I would say yes, the shareholder is worse. The donor gives money and walks away. The shareholder owns a piece of the enterprise and profits from its success. Their integrity is more deeply tied to the harm because they benefit from it continuing. The donor might regret it; the shareholder has a financial incentive to want the killing to succeed.

  I want to return to the premise you suspected was confused, because it is the heart of the matter. You wrote that you cannot pretend your vote mattered to the outcome in a general election, and you struggle with the sandwich because the number of birds does not shift. This assumes that the only way to matter is to be the cause of a change. But think about your work. If you fix a leak in a vast network of pipes, the water still flows, the system still works, and your specific wrench turn did not change the fact that the system exists. But you mattered because you maintained the integrity of the system. Morality is often about maintenance, not just construction. When you refuse the sandwich, you are not necessarily saving a bird, but you are refusing to let your hands be dirty. You are keeping your own integrity intact. When you dump the solvent, you are dirtying your hands even if the river is already foul. The state of the river is one thing; the state of your soul is another. This is why the assassin case feels so clearly wrong. No one thinks their ten pounds killed the victim, but everyone knows their ten pounds made them a killer in spirit.

  So here is where I would leave you. Your tentative principle about coordination was close, but it was too focused on the external structure. The better principle is about internal alignment and reasonable alternatives. It is wrong to participate in harm when you can avoid it. It is less wrong when you cannot avoid it due to necessity. It is wrong to break shared rules of fairness even if your breach causes no disaster. If you adopt this, you must let go of the idea that the t-shirt is fine. It sits too uncomfortably next to the sandwich. You must also accept that your van driving is not morally neutral, but rather a necessary evil that you should mitigate where you can, perhaps by combining trips or upgrading the vehicle when possible, without beating yourself up for earning a living.

  You are right to trust your gut on the assassin and the river, and you are right to feel the pull of the sandwich. The confusion comes from trying to measure these things with a ruler designed for physics, where force equals mass times acceleration. Morality is more like plumbing itself. It is about pressure, and flow, and where you choose to connect yourself. Sometimes you connect to the clean water, sometimes to the waste, and sometimes you just need to keep the system running so people can live. Your job is to know the difference, and from what you have written, you already do. Keep thinking in the van. The view from the road is often clearer than the view from the seminar.
