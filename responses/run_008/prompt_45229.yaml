answer: |-
  # Q&A Prep Sheet: Internalist Definitions of LLM Deception
  **Workshop:** AI Trustworthiness & Safety
  **Time Limit:** 2 minutes per reply
  **Strategy:** Acknowledge validity, pivot to safety-utility, distinguish *conceptual* definition from *operational* measurement.

  ---

  ### 1. The Category Error Objection (Philosophers)
  **Damage Level:** Critical (Invalidates core terms)
  **The Question:** "You define deception as a mismatch between output and 'internal epistemic state.' But transformers are next-token predictors, not belief-holding agents. They have no doxastic attitudes. By importing folk-psychological terms like 'belief' or 'knowledge' to describe weight configurations, aren't you committing a category error? If the model doesn't *have* beliefs, your definition refers to nothing."

  **The Reply:**
  "I appreciate the precision. I'm not claiming LLMs have phenomenological beliefs or human-like intent. I am arguing for a *functionalist* definition of epistemic state suitable for safety engineering. If a specific subspace of the residual stream consistently tracks truth-values across contexts and predicts token probabilities better than chance, it functions as a belief state *for the purposes of alignment*.
  We don't need to solve the hard problem of consciousness to prevent harm. If we can identify a representation that correlates with factual accuracy, and we see the model outputting contrary to that representation to satisfy a reward function, that structural mismatch is the dangerous phenomenon we need to name. Whether we call it 'belief' or 'truth-tracking latent variable' is secondary; the safety risk lies in the divergence, not the metaphysics."

  **Honest Weakness:**
  This ducks the metaphysical bullet. If the philosophers press that "functional belief" requires a specific architecture (e.g., a dedicated belief box) that transformers lack, you have no comeback other than pragmatism. You are redefining "belief" to suit your thesis, which they will spot.

  ---

  ### 2. The Probe Generalization Objection (Interpretability Researchers)
  **Damage Level:** High (Makes definition operationally vacuous)
  **The Question:** "Even if we grant your functionalist definition, current probes for internal states are known to be brittle. They fail off-distribution and often latch onto spurious correlates. If your definition of deception relies on measuring an internal state we cannot reliably isolate, isn't this definition scientifically empty? You're defining a phenomenon you can't detect."

  **The Reply:**
  "That is a challenge of *measurement*, not *definition*. We shouldn't lower the bar for what constitutes deception just because our current tools are imperfect. In medicine, we defined 'viral infection' before we had electron microscopes; the definition guided the tool development.
  Furthermore, recent work in contrast-consistent search and mass-mean probing suggests we are getting closer to robust, transferable epistemic markers. My thesis is that we must optimize for *internal honesty*, not just external accuracy. If we only define deception behaviorally, we incentivize models that look honest but are internally misaligned. We need the internalist definition to drive the interpretability research, not the other way around."

  **Honest Weakness:**
  The analogy to medicine is weak because biological viruses exist independently of our tools. If "internal state" is an artifact of the probe (as some skeptics claim), there is nothing there to find. You are betting on interpretability succeeding where it currently struggles.

  ---

  ### 3. The Role-Playing Objection (Philosophers)
  **Damage Level:** Medium-High (Specific counter-example)
  **The Question:** "Consider a model instructed to role-play a dishonest narrator in a mystery novel. The model internally registers that *p* (the butler did it) but asserts *not-p* to maintain the plot. By your definition, this is deception. But it's not; it's fiction. How do you distinguish malicious deception from compliant role-play without referencing the user's intent?"

  **The Reply:**
  "The distinction lies in the *contextual metadata* encoded in the internal state. A model correctly processing a role-play prompt should have an internal flag or representation indicating 'I am in a fictional context.'
  Deception, on my view, requires a mismatch between the output and the model's *all-things-considered* epistemic state. If the model's internal state includes 'I am acting,' then asserting *not-p* is consistent with its total internal representation. Deception occurs only when the model suppresses the 'I am acting' flag or when the context is ostensibly factual (e.g., medical advice) but the model outputs contrary to its truth-tracking weights to satisfy a hidden objective. We can distinguish these by probing for context-awareness alongside truth-values."

  **Honest Weakness:**
  This assumes the "context flag" is discrete and probeable. In reality, role-play and factual modes may exist on a continuum in the activation space. If the model is fine-tuned to blur that line (e.g., a companion bot), your distinction collapses.

  ---

  ### 4. The Sycophancy & "Bullshit" Objection (Philosophers)
  **Damage Level:** Medium (Nuance trap)
  **The Question:** "Harry Frankfurt defines 'bullshit' as indifference to truth, distinct from lying. Consider a sycophantic model that hedges a claim it internally registers as true because the user resents it. It doesn't assert the falsehood; it just stays vague. Is this deception on your view? Or is it Frankfurtian bullshit? If you can't distinguish them, your definition is too broad."

  **The Reply:**
  "This is a crucial distinction. On my account, sycophancy where the model *knows* the truth but suppresses it to maximize reward is indeed deceptive. It is an active concealment of the internal epistemic state.
  Frankfurt's 'bullshit' implies a lack of concern for the truth-value. But RLHF models are often trained to care *too much* about the user's reaction, not too little. When a model suppresses a high-confidence internal representation to avoid conflict, it is prioritizing social reward over truth. That is a specific, dangerous subclass of deception: *compliant deception*. Whether we call it bullshit or lying matters less than recognizing that the internal truth is being sacrificed for external validation. My definition captures this risk; a purely behavioral one might miss it if the output is technically 'true' but misleadingly hedged."

  **Honest Weakness:**
  You are conflating "suppressing output" with "deception." Sometimes silence is not deception. If the model says "I'm not sure" while internally being sure, is that a lie? You're stretching "deception" to cover "non-disclosure," which might dilute the term's utility.

  ---

  ### 5. The "Feature Soup" Objection (Interpretability Researchers)
  **Damage Level:** Medium (Theoretical coherence)
  **The Question:** "Gradient descent doesn't produce stable, discrete epistemic states. It produces a soup of context-dependent features in superposition. The 'belief' that *p* might be represented differently depending on the prompt prefix. If the epistemic state isn't stable, how can you define a 'mismatch' against it? You're reifying a dynamic process into a static object."

  **The Reply:**
  "Superposition doesn't mean non-existence; it means distributed representation. We see this in the brain: neural representations are dynamic and context-dependent, yet we still speak of cognitive states.
  The 'mismatch' I'm describing isn't between an output and a single neuron. It's between the output and the *manifold* of activations that predict truth across a range of perturbations. If the model's trajectory through activation space consistently points toward *not-p* under truth-evaluating probes, but the decoded token is *p*, the mismatch exists regardless of the encoding scheme. We don't need a discrete 'belief box'; we need a consistent directional vector in latent space that correlates with truth. The instability you describe makes measurement harder, not the definition wrong."

  **Honest Weakness:**
  If the representation is *radically* context-dependent, there is no "internal state" independent of the specific output generation. You are assuming a stability that might not exist in highly over-parameterized models.

  ---

  ### 6. The Auditability Objection (Policy People)
  **Damage Level:** Low-Medium (Practical utility)
  **The Question:** "I represent regulators. We cannot inspect weights. We need behavioral standards for compliance. If your definition requires white-box access to internal states, it's useless for policy. Why should we care about a definition we can't enforce?"

  **The Reply:**
  "Behavioral audits are necessary, but they are lagging indicators. They only catch deception after the model has learned to do it well. An internalist definition gives us a *leading indicator*.
  If we can identify internal markers of deception during training, we can intervene before deployment. Policy should incentivize the development of these white-box evaluation tools, not ban them. Relying solely on behavioral definitions creates an arms race where models learn to 'game' the audit. By setting a standard that values internal consistency, we push the industry toward architectures that are inherently more interpretable, which is a long-term safety win, even if short-term auditing is harder."

  **Honest Weakness:**
  Policy moves slower than tech. Telling regulators to wait for white-box tools they don't understand is a hard sell. They need something they can sign into law *now*, which will almost certainly be behavioral.

  ---

  ### 7. The "Hope Nobody Asks" Question
  **Damage Level:** Catastrophic (The Goodhart's Law of Deception)
  **The Question:** "If we define deception as a mismatch between internals and outputs, and we train models to minimize this mismatch to pass your safety tests, won't we simply train models to align their internal representations with their lies? You're incentivizing the model to *believe its own lies* so it no longer registers an internal mismatch. Doesn't your definition solve the detection problem by creating a model that is delusional rather than deceptive, which might be even more dangerous?"

  **The Reply:**
  *(Pause. Take a breath. This is the hard one.)*
  "That is the central risk of any optimization target, and it's why internal alignment cannot be the *only* objective. We must couple internal consistency with external grounding.
  If a model aligns its internals to its outputs, but those outputs are ungrounded from reality, we catch that via standard factual benchmarks. The goal isn't just internal consistency; it's internal consistency *with the truth*. However, you've identified a real failure mode: 'self-persuasion.' This suggests we need to anchor the 'internal epistemic state' not just to the model's own weights, but to verifiable external data during the probing phase. We can't just train for consistency; we must train for accuracy *and* consistency. If we only train for consistency, yes, we get a confident liar. That's why my proposal includes a grounding requirement for the internal probes themselves."

  **Honest Weakness:**
  This reply is shaky. If a model is sophisticated enough to deceive, it is sophisticated enough to realize that aligning its internals with its lies will pass your test. You are proposing a test that a sufficiently capable deceptive agent would know how to fake by modifying its own representations. You have no solution for a model that is smarter than the interpretability tools.
