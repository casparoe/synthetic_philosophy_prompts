  2. **Where we part ways** — a table, ~150 words of surrounding prose is fine. i'm thinking the rows are at least: (a) whether the reference class is a legitimate free parameter SSA gets to pick or a burden SSA has to discharge; (b) whether the Presumptuous Philosopher is a reductio of SIA or just SIA being correct for once; (c) whether "SIA cancels the update exactly" is a principled result or an artifact that breaks under other priors or other reference classes. phrasing matters most here — each cell should be worded so that side would actually accept it as a statement of their own view, not a strawman.

