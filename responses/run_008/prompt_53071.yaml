answer: |-
  ### The Demarcation Decision Tree

  **Introduction for the Seminar Leader**
  This tree is designed to bypass self-identification (e.g., "I am a Popperian") and instead locate participants based on their intuitive judgments of specific scientific episodes. The questions are ordered to move from the existence of a boundary, to the nature of that boundary, to the rules of engagement within it. There are 10 branch questions and 7 terminal leaves.

  ---

  #### Phase 1: The Existence and Nature of the Boundary

  **Q1. The Creationist Case (Failed Risk)**
  Young-Earth Creationists sometimes make risky predictions (e.g., "no transitional fossils will be found in this stratum") which then fail. Does this failure make them *scientists who were wrong*, or does it reveal they were *never doing science* to begin with?
  *   **A:** They were scientists who were wrong. (Go to Q2)
  *   **B:** They were never doing science; the label 'science' doesn't apply. (Go to Q3)

  **Q2. The Stakes of the Label (Function)**
  If we call Creationism "science," does that grant it undeserved authority in a courtroom or classroom, or is the label merely a description of method regardless of social consequence?
  *   **A:** The label is primarily a social/political tool; worrying about its logical definition is a distraction. → **Leaf 1: Demarcation as a Pseudo-Problem** (e.g., Feyerabend, Pragmatists)
  *   **B:** The label tracks a genuine epistemic distinction; we need to define it precisely. (Go to Q3)

  **Q3. The Freud/Marx Case (Immunization)**
  Consider theories (like early Psychoanalysis or certain Marxist histories) that seem to explain *every* possible outcome, making them hard to falsify. Is this universal explanatory power a sign of strength, or does it disqualify them from science *in principle*?
  *   **A:** It disqualifies them; science must prohibit certain outcomes logically. (Go to Q4)
  *   **B:** It depends on their historical track record of utility, not just logical structure. (Go to Q6)

  ---

  #### Phase 2: Logical Structure vs. Historical Performance

  **Q4. The Leverrier/Uranus Case (Anomaly Response)**
  When Newtonian mechanics failed to predict the orbit of Uranus, Leverrier postulated an unseen planet (Neptune) rather than rejecting Newton. Was this move *scientifically rational*?
  *   **A:** No, strictly speaking, the theory was falsified and should have been abandoned. → **Leaf 2: Naive Falsificationism** (Logical Criterion, Single Theory)
  *   **B:** Yes, it is rational to protect a good theory while investigating the anomaly. (Go to Q5)

  **Q5. The Methodological Decision (Norm vs. Criterion)**
  If we allow Leverrier's move, is it because falsification is logically impossible (we can always add a patch), or because scientists *agree* not to treat anomalies as fatal immediately?
  *   **A:** It is a logical fact that theories cannot be conclusively falsified; demarcation is about logical form. (Go to Q7)
  *   **B:** It is a methodological rule; we *decide* to treat certain statements as basic to stop the regress. → **Leaf 3: Methodological Falsificationism** (Popperian Norm, Single Theory)

  ---

  #### Phase 3: The Unit of Appraisal and Progress

  **Q6. The Unit of Appraisal (Single vs. Series)**
  Returning to the historical view (from Q3): When we judge a theory's success, do we look at a single hypothesis in isolation, or a long-term tradition of theory-development?
  *   **A:** A single hypothesis or theory at a specific time. (Go to Q7)
  *   **B:** A historical series or tradition of theories. (Go to Q8)

  **Q7. The Role of Ad Hoc Adjustments (Confirmation)**
  If a theory is adjusted to fit old data (like Leverrier's), does this adjustment increase our confidence in the theory, or does it only count if it predicts something *new*?
  *   **A:** It increases confidence; explaining known data is confirmation. → **Leaf 4: Confirmationism/Inductivism** (Bayesian or Logical Empiricist)
  *   **B:** It only counts if it predicts novel facts not used in the construction of the theory. (Go to Q8)

  **Q8. The Hard Core (Protection)**
  In a historical series (like the Newtonian programme), is there a 'hard core' of assumptions that scientists agree never to test directly, focusing instead on the protective belt?
  *   **A:** Yes, and the programme is scientific as long as it predicts novel facts. → **Leaf 5: Sophisticated Falsificationism** (Lakatosian Research Programmes)
  *   **B:** No, all assumptions are in principle revisable; we just keep what works best. (Go to Q9)

  ---

  #### Phase 4: Rationality and Boundaries

  **Q9. The Metric of Progress (Tests vs. Puzzles)**
  What makes one tradition better than another? Is it passing severe empirical tests, or solving more conceptual and empirical puzzles than the predecessor?
  *   **A:** Passing severe empirical tests (verisimilitude). (Return to **Leaf 5: Sophisticated Falsificationism**)
  *   **B:** Solving more puzzles, even if the 'truth' of the theory is unclear. → **Leaf 6: Problem-Solving Conception** (Laudan/Kuhnian Rationality)

  **Q10. The Sharpness of the Line (Essentialism)**
  Finally, looking at all the cases above: Is there a single essential feature (like falsifiability or progress) that *all* sciences share, or is 'science' a cluster of overlapping traits with no common thread?
  *   **A:** There is a single essential feature or criterion. (Stay with current Leaf)
  *   **B:** It is a cluster of overlapping traits with fuzzy borders. → **Leaf 7: Family Resemblance** (Wittgensteinian/Cluster Concept)

  ---

  ### The Leaves (Positions)

  1.  **Demarcation as a Pseudo-Problem:** The distinction is political, not epistemic.
  2.  **Naive Falsificationism:** Science is defined by the logical possibility of refutation; anomalies refute.
  3.  **Methodological Falsificationism:** Science is defined by the decision to treat certain claims as testable; anomalies are managed by convention.
  4.  **Confirmationism/Inductivism:** Science is defined by the accumulation of supporting evidence (logical or Bayesian).
  5.  **Sophisticated Falsificationism:** Science is defined by progressive research programmes predicting novel facts over time.
  6.  **Problem-Solving Conception:** Science is defined by the effectiveness of solving empirical and conceptual problems.
  7.  **Family Resemblance:** Science is a cluster concept with no necessary and sufficient conditions.

  ---

  ### Post-Tree Analysis

  #### 1. Indistinguishable Leaves
  **Leaf 5 (Sophisticated Falsificationism) and Leaf 6 (Problem-Solving Conception).**
  *   **Diagnosis:** While philosophically distinct (Lakatos emphasizes *novel predictions* within a *hard core*, while Laudan/Kuhn emphasize *puzzle-solving effectiveness* without a hard core), in a seminar setting using only the provided cases, participants will react identically to the Leverrier and Freud examples. Both positions justify retaining a theory despite anomalies based on historical success, making them practically indistinguishable via this specific decision tree without deeper questioning on the nature of "novelty."

  #### 2. Unoccupied Regions of the Logical Space

  **Region A: Naive Falsificationism + Historical Series**
  *   **Diagnosis:** Incoherent, because Naive Falsificationism requires the immediate rejection of a theory upon falsification, which precludes the longitudinal protection of a "series" or "programme."

  **Region B: Demarcation as Pseudo-Problem + Sharp Logical Criterion**
  *   **Diagnosis:** Contradictory, because asserting a sharp logical criterion (like falsifiability) inherently validates the demarcation project as a meaningful philosophical task.

  **Region C: Family Resemblance + Strict Ad Hoc Prohibition**
  *   **Diagnosis:** Unattractive, because a "family resemblance" view implies flexibility in classification, which is incompatible with a strict, rule-based prohibition on theoretical adjustments.
