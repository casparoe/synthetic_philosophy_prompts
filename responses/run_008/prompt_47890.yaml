      *   *Conceptual Distinction?* This is the most fertile ground. Distinguishing *ontological* status of utility from *operational* requirements for policy.
      *   *Change in Question?* Yes. Move from "Are IUCs *true*?" to "Under what constraints is it *permissible* to act as if they are true?" (Pragmatism).
      *   *Permanent Stalemate?* In terms of one side "winning," yes. But in terms of productive tension, no. The tension *is* the work.

