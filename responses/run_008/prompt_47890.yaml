      *   Ethics needs IUCs to avoid utilitarianism collapsing into Pareto efficiency (which is often silent on distribution).
      *   *The "Smuggling" Charge:* The economist is right that formalism often hides ethical axioms (e.g., assuming risk neutrality in Veil of Ignorance arguments).
      *   *The "Illegitimate Conclusion" Charge:* The philosopher is right that "I can't measure it perfectly" doesn't mean "I can't talk about it rationally."

  4.  **Assess Possibilities for Progress:**
