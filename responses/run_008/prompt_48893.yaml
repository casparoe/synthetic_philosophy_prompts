      *   *Point 5 (Usable Goodhart):* The honest version you can use is that metrics break when people can decouple the measurement from the outcome, not when algorithms minimize error on representative data. Apply Goodhart's law to human incentives and dashboard targets, but trust gradient descent to find genuine structure until validation performance diverges from training loss.

