      *   *Is Dev's "real-time" claim defensible?* No, Libet experiments and general neural latency kill that.
      *   *Make sure to emphasize:* Dennett doesn't say Stalinesque is the answer. He says the distinction presupposes a "finish line" for consciousness that doesn't exist. Elena gets closer to this than Dev.

