      *   *Claim 2:* The central result is a *trilemma* involving three conditions: Calibration, Equal FPR, Equal FNR.
      *   *Claim 3:* When base rates (outcome frequencies) differ between groups, *no two* of these conditions can be satisfied at the same time.
      *   *Claim 4:* Even a *perfectly accurate algorithm* would violate one of them.
