      *   *Tone Check:* Ensure I sound like an expert who cares about precision (philosopher/researcher hybrid). Avoid jargon where possible, but define it when necessary.

  5.  **Refining Specific Technical Points:**
      *   *Calibration:* $P(Y=1 | S=s, A=a) = P(Y=1 | S=s)$. Score means same risk regardless of group.
      *   *Error Rate Parity:* FPR equal, FNR equal (Equalized Odds).
      *   *The Conflict:* If Group A has 5% risk and Group B has 50% risk, and you calibrate scores, you cannot cut them at thresholds that yield equal FPR/FNR.
      *   *Perfect Predictor:* If $S$ perfectly predicts $Y$, then $FPR=0, FNR=0$. All conditions hold. The article is wrong here.
      *   *Humans:* If a human interviewer decides "Hire/No Hire", they have an implicit FPR/FNR. If they estimate "Likelihood of success", they have implicit calibration. The math applies to the *decision process*, not the *output format*.

  6.  **Final Review against Constraints:**
      *   Did I brainstorm distinct claims? Yes.
