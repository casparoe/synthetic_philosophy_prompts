  *(Self-Correction during drafting)*: Wait, I need to be careful about the "Greedy Reductionism" point. The user asks if there's a spot where the books explain something *too fast* by skipping levels. Actually, Pullman often does the opposite—he adds levels (daemons, Dust, shadows). The "Greedy" mistake would be to say "It's just atoms" and ignore the daemon. Pullman insists the daemon *is* real. So the books argue *against* greedy reductionism. I need to make sure I clarify that Dennett also argues against *greedy* reductionism, so Pullman and Dennett might actually align there, even if their metaphysics differ. Dennett wants to explain consciousness without magic; Pullman wants to explain it with magic particles. That's the divergence.

