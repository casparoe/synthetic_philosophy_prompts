prompt: |-
  I'm a novelist, mid-draft on a book that's told entirely from inside one character's head, and the whole architecture of the thing leans on her decisions mattering — chapter to chapter, her reasons are what move the plot. My partner (a neuroscientist, annoying in the specific way you'd expect) keeps telling me the mind is just software running on the brain's hardware, and that this is supposed to be good news for me: software states cause things at the software level all the time, nobody thinks a running program is a ghost pushing the processor around. So her jealousy can be real and do actual work even though every physical event has a sufficient physical cause, because "her jealousy made her lock the door" is just the higher-level description of what the hardware was doing anyway.

  Here's what bugs me. The underlying worry, as I understand it from her, goes something like: if the neurons fire because of other neurons, then by the time you get up to the jealousy, the causal work is already finished — stacking the mental state on top either does nothing extra or double-counts the same event. The software analogy is supposed to answer that. But I can't tell if it answers the worry or just hides it. When people say the program "caused" the printer to jam, that sounds fine — but is that causal talk doing real work, or is it a convenient shorthand someone could always rewrite in hardware terms without losing anything? And if it's always rewritable, then maybe my plot only really happens at the neuron level, and at the level where I actually write — where reasons and decisions live — it's all just narration laid over the machine, epiphenomenal as anything. Which would honestly be a bummer for the book.

  So: audit the analogy. How far does it hold? And I want it in structured form because I'm going to tape it above my desk:

  First a mapping table with columns — [computer side, mind/brain side, where the mapping holds, where it strains]. Software, hardware, running, executing, "the program caused the crash," the whole works: tell me what corresponds to what.

  Then a JSON object with these fields:
  - "disanalogies": array of objects, each with "what_breaks" (string), "why_it_breaks" (string), "matters_for_my_question" (boolean — my question is whether character-level reasons do causal work, not whether brains are literally computers), and "if_true_costs_the_conclusion" (string, can be short).
  - "smuggled_premises": array of strings — things the analogy quietly imports that the brain case lacks, e.g. that software is designed, or that you can open the case and point at the parts.
  - "verdict": one of "holds", "holds_with_repairs", "fails", "inconclusive", plus a one-sentence "verdict_reason".
  - "better_analogy": a string — what a novelist should keep in her head instead, and what adopting it costs.
  - "one_line_for_the_novel": a single sentence I can actually put in a character's mouth or a narrator's aside without it sounding like a lecture.

  Around the structured stuff, whatever prose you need. Two things I especially want flagged honestly: whether the analogy is doing the same job when engineers use it and when philosophers of mind use it (I suspect those are different jobs, and alot of people slide between them), and whether the conclusion my partner wanted — jealousy really causes the locked door — was riding on the analogy the whole time or survives once the disanalogies are on the table. If the whole thing turns on some deeper distinction I've barely gestured at — say, between the mental being identical to the physical versus just correlated with it, or between one event under two descriptions versus two events overdetermining an outcome — definately lay that out, because I suspect that's where the real action is and I only half know it.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Novelist, mid-draft, writing a character-driven book where decisions/reasons drive the plot.
      *   **Conflict:** Partner (neuroscientist) claims mind/brain dualism (software/hardware analogy) saves agency/causation. User worries this makes mental states epiphenomenal (just narration over neural mechanics).
      *   **Core Question:** Does the software/hardware analogy successfully defend the causal efficacy of mental states (reasons/decisions) against the threat of neural determinism/epiphenomenalism?
      *   **Format Requirements:**
          *   Prose introduction/context.
          *   Mapping Table (Computer side, Mind/Brain side, Where holds, Where strains).
          *   JSON object with specific fields (`disanalogies`, `smuggled_premises`, `verdict`, `better_analogy`, `one_line_for_the_novel`).
          *   Prose conclusion/analysis (flagging engineer vs. philosopher usage, partner's conclusion survival, deeper distinctions like identity vs. correlation).
          *   Tone: Honest, structured, useful for a novelist, intellectually rigorous but accessible.
          *   Constraint: Tapeable above desk (structured form).

  2.  **Deconstruct the Philosophical Problem:**
      *   **The Threat:** Causal Closure of the Physical. If every physical event (locking the door) has a sufficient physical cause (neurons firing), what work is left for the mental state (jealousy) to do? If it does no work, it's epiphenomenal.
      *   **The Partner's Defense:** Non-reductive Physicalism / Functionalism. Mental states are like software states. Software states cause other software states (and hardware effects) without being "ghosts."
      *   **The User's Worry:** Is "software causation" just a shorthand for "hardware causation"? If I can always rewrite the explanation in hardware terms, is the software level real causation or just description?
      *   **Key Distinction:** Token Identity vs. Type Identity vs. Supervenience. The "Two Descriptions" view (Davidson) vs. "Distinct Events" view.
      *   **Engineer vs. Philosopher Usage:** Engineers use the analogy to abstract complexity. Philosophers use it to solve the mind-body problem. The滑移 (slide) happens when abstraction is mistaken for ontological independence.

  3.  **Drafting the Content - Section by Section:**

      *   **Prose Intro:** Acknowledge the stakes. This isn't just philosophy; it's the engine of the novel. Validate the user's suspicion that the analogy might be hiding the problem rather than solving it.

      *   **Mapping Table:**
          *   *Software:* Code, Logic, Variables, State.
          *   *Mind:* Thoughts, Reasons, Beliefs, Feelings.
          *   *Hardware:* Silicon, Circuits, Voltage.
          *   *Brain:* Neurons, Synapses, Chemistry.
          *   *Execution:* Running the program.
          *   *Consciousness/Activity:* Thinking/Acting.
          *   *Crash/Output:* Action (locking door).
          *   *Strains:* Software is designed/abstract; Mind is evolved/embedded. Software is discrete; Brain is analog/chemical. Software can be multiple realizable easily; Mind is tied to specific biology.

      *   **JSON Construction:**
          *   *Disanalogies:* Need to focus on whether reasons *do* work.
              *   1. Implementation Independence (Software can run on many hardware types; Mind is tightly coupled to *this* brain).
              *   2. Normativity (Software follows rules logic; Mind follows reasons meaning).
              *   3. The "Rewrite" Test (Can you explain the jam without software terms? Yes. Can you explain the door lock without jealousy? Maybe not, because 'locking' is intentional).
          *   *Smuggled Premises:* Design intent, clean separation layers, discrete states.
          *   *Verdict:* "holds_with_repairs". The analogy works for *explanation* but not necessarily for *ontological causation* unless you accept non-reductive physicalism.
          *   *Better Analogy:* Maybe "Story/Plot" or "Organization/Structure". Or "Wetware". Let's go with "The Story Itself" vs "The Ink".
          *   *One Line:* Needs to be poetic but philosophically sound.

      *   **Prose Analysis (The "Real Action"):**
          *   *Engineer vs. Philosopher:* Engineers use it pragmatically (ignore the electrons to fix the bug). Philosophers use it ontologically (are thoughts real?). The partner is sliding from pragmatic utility to ontological claim.
          *   *Partner's Conclusion:* Does jealousy cause the lock? Only if you accept "Causal Explanatory Pluralism." If you demand *physical* force, no. If you accept *reason-based* causation, yes.
          *   *Deep Distinction:* Token Identity (Davidson). The event is one (neurons firing = jealousy), but described differently. It's not two events overdetermining; it's one event under two descriptions. This saves the novel because the *description* is where the meaning lives.

  4.  **Refining the JSON:**
      *   Ensure valid JSON syntax.
      *   Check boolean fields.
      *   Ensure `matters_for_my_question` is true for the relevant disanalogies.
      *   Make sure `verdict` is one of the allowed strings.

  5.  **Refining the Prose:**
      *   Keep it sharp. Address the "epiphenomenal" fear directly.
      *   Highlight the "Exclusion Argument" (Jaegwon Kim) implicitly.
      *   Make sure the distinction between "causation" (physical push) and "explanation" (reason why) is clear.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the table too technical?
      *   *Fix:* Keep terms accessible for a novelist.
      *   *Critique:* Is the JSON valid?
      *   *Fix:* Double-check quotes and commas.
      *   *Critique:* Did I answer the specific worry about "rewritability"?
      *   *Fix:* Explicitly address in the analysis section whether hardware-level rewrite loses information (it loses *meaning*, which is crucial for a novel).
      *   *Critique:* The user asked for "Better Analogy".
      *   *Fix:* Suggest "The Plot vs. The Paper". The plot causes the ending, even though ink causes the marks.
      *   *Critique:* The user wants to know if the partner's conclusion survives.
      *   *Fix:* Be honest. It survives *if* you change what "cause" means from "physical shove" to "explanatory necessity."

  7.  **Final Polish:** Check against all constraints (mapping table, JSON fields, specific prose requirements).

  *(Self-Correction on JSON)*: Ensure escape characters are handled if needed (though plain text should be fine). Ensure `matters_for_my_question` is boolean `true`/`false`, not string.

  *(Self-Correction on Verdict)*: "holds_with_repairs" seems most accurate. The analogy works for functionalism but fails on biological nuance.

  *(Self-Correction on One Line)*: Needs to sound literary. "The reason was the cause, even if the neuron was the hand."

  Let's assemble.

  *Wait, one nuance:* The user asked about "whether the conclusion my partner wanted... survives once the disanalogies are on the table." I need to make sure the prose section explicitly answers this.
  *Also:* "whether the analogy is doing the same job when engineers use it and when philosophers of mind use it." Need to highlight the Pragmatic vs. Ontological distinction.

  *Deep Distinction:* Token Identity vs. Type Identity. The event is identical (token), but the properties (mental/physical) are different. Causation relates tokens; Explanation relates properties. This is the key to saving the novel.

  Okay, ready to write.cw
answer: |-
  This is the central tension of modern materialism, and you are right to feel that the software analogy often functions as a pacifier rather than a solution. Your partner is arguing for **Non-Reductive Physicalism**: the idea that while everything is physical, the higher-level patterns (software/mind) have causal powers that cannot be fully captured by describing the lower-level mechanics (hardware/neurons) alone.

  Your worry is about **Causal Exclusion**: if the neurons did all the work, what is left for the jealousy to do? If the software explanation is just a shorthand for the hardware explanation, then your character's reasons are indeed just epiphenomenal narration—a shadow cast by the machine, not the engine itself.

  Below is the audit you requested. It is designed to be taped above your desk: a structural breakdown of where the analogy saves your plot and where it threatens to dissolve it.

  ### The Mapping Table

  | Computer Side | Mind/Brain Side | Where the Mapping Holds | Where it Strains |
  | :--- | :--- | :--- | :--- |
  | **Software** (Code, Logic) | **Mind** (Thoughts, Reasons, Jealousy) | Both are organizational patterns independent of specific material. | Software is designed with clean layers; mind is evolved, messy, and embodied. |
  | **Hardware** (Silicon, Circuits) | **Brain** (Neurons, Synapses, Chemistry) | Both are the physical substrate required to run the pattern. | Hardware is static/passive; Brain is plastic/active (changes structure when running). |
  | **Execution** (Processing) | **Consciousness/Thinking** | Both involve state transitions over time. | Execution is discrete/clock-driven; Thinking is analog/continuous/parallel. |
  | **Variable State** (e.g., `door_locked = true`) | **Belief/Decision** (e.g., "I must lock this") | Both represent information stored in the system state. | Variables are precise; Beliefs are fuzzy, contextual, and meaning-laden. |
  | **Output** (Printer jams / Door locks) | **Action** (Hand turns lock) | Both are physical effects triggered by logical states. | Computer output is mechanical; Human action is intentional (loaded with *meaning*). |
  | **"The Program Caused the Crash"** | **"Jealousy Caused the Lock"** | Both attribute causality to the logical pattern, not just the electricity. | Engineers use this pragmatically; Philosophers demand ontological proof (which is harder). |
  | **Multiple Realizability** (Run same code on PC or Mac) | **Multiple Realizability** (Aliens could feel jealousy too) | Suggests mental states aren't tied to one specific biology. | Human mind may be too tied to specific human biology to be truly "portable" like code. |

  ***

  ### The Structural Audit (JSON)

  ```json
  {
    "disanalogies": [
      {
        "what_breaks": "The Rewrite Test",
        "why_it_breaks": "Engineers can always rewrite software explanations in hardware terms (voltage changes) without losing predictive power. If you rewrite 'jealousy' into 'amygdala firing,' you lose the meaning required for a novel.",
        "matters_for_my_question": true,
        "if_true_costs_the_conclusion": "It suggests 'jealousy' is only useful for explanation, not physical causation."
      },
      {
        "what_breaks": "Design vs. Evolution",
        "why_it_breaks": "Software layers are intentionally separated so higher levels can control lower levels. Brains evolved bottom-up; the 'higher' mental states may not have top-down control authority.",
        "matters_for_my_question": true,
        "if_true_costs_the_conclusion": "Undermines the idea that reasons can override impulses."
      },
      {
        "what_breaks": "Semantic Content",
        "why_it_breaks": "Software symbols are arbitrary; Mental states have intrinsic meaning (aboutness). A neuron doesn't mean 'jealousy' the way a variable name does.",
        "matters_for_my_question": true,
        "if_true_costs_the_conclusion": "If meaning doesn't causally engage, the plot is meaningless."
      }
    ],
    "smuggled_premises": [
      "That software layers are ontologically distinct rather than just pragmatically useful.",
      "That the brain has a clean architecture separation like a von Neumann machine.",
      "That 'causation' means the same thing in logic (implication) as it does in physics (force)."
    ],
    "verdict": "holds_with_repairs",
    "verdict_reason": "The analogy saves explanatory causality but fails to prove ontological independence without accepting Token Identity.",
    "better_analogy": "The Plot vs. The Ink: The story causes the ending just as much as the ink causes the marks, because the story is the organization of the ink.",
    "one_line_for_the_novel": "She told herself the neurons fired first, but the reason was the only thing that made the firing count."
  }
  ```

  ***

  ### The Real Action: Engineer vs. Philosopher

  You suspected the analogy is doing two different jobs depending on who uses it. You are correct.

  **1. The Engineer's Job (Pragmatic):**
  When an engineer says, "The software caused the crash," they are making a claim about **explanatory efficiency**. It is technically true that voltage spikes caused the halt, but tracing every electron is useless. The software level is where the *pattern* broke. Here, "cause" means "the most useful level to intervene." If your partner uses the analogy this way, she is saying: "To understand why she locked the door, 'jealousy' is the only useful tool." This saves your novel, because novels operate at the level of useful explanation, not particle physics.

  **2. The Philosopher's Job (Ontological):**
  When a philosopher (or a neuroscientist wearing a philosopher's hat) says it, they often mean **causal power**. They are trying to prove that the mental state is a real thing in the universe, not just a label we stick on neurons. This is where the analogy strains. In a computer, we *know* the software is real because we designed it to be abstract. In the brain, we don't know if "jealousy" is a real causal lever or just a story we tell about neuron clusters.

  **Does your partner's conclusion survive?**
  Yes, but only if you accept a specific distinction: **Token Identity.**

  This is the deeper distinction you gestured at. There are two ways to view the event of locking the door:
  *   **Dualism (Two Events):** The jealousy happens, *and* the neurons fire, and both push the hand. (This leads to overdetermination and is scientifically dubious).
  *   **Token Identity (One Event, Two Descriptions):** There is only one event. Described physically, it is neurons firing. Described mentally, it is jealousy.

  If you accept Token Identity, the "causal work" isn't split. The neurons *are* the jealousy. Therefore, when the neurons cause the door to lock, the jealousy causes the door to lock. They are the same causal chain viewed through different lenses.

  **The Cost:**
  The cost is that "jealousy" cannot exist without the neurons. You cannot have the reason without the meat. But for a novelist, this is acceptable. You are writing about the *description* of the event, not the physics of it.

  **The Verdict for Your Draft:**
  The software analogy holds *with repairs*. It works if you treat "software" not as a ghost in the machine, but as the **organization** of the machine. The organization does work. A scrambled hard drive has the same hardware as a working one but produces no output. Therefore, the arrangement (the software/the mind) is causally potent.

  Your plot is safe, provided you understand that "causation" in a novel is about **meaningful connection**, not physical force. The jealousy causes the lock because without the jealousy, the neural pattern would have been different, and the hand would not have moved. The mental level is not a shadow; it is the shape of the physical event.

  **One Line for the Novel:**
  *"She told herself the neurons fired first, but the reason was the only thing that made the firing count."*
