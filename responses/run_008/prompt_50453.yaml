answer: |-
  **MEMORANDUM**

  **TO:** Historical Legacies Review Panel
  **FROM:** [Your Name]
  **DATE:** 24 May 2024
  **SUBJECT:** Recommendation on Wording for Public Statement Regarding Founding Endowment

  **Introduction**

  We have reached an impasse that is less administrative than ontological. The disagreement over the wording of our statement concerning the university's founding endowment is not merely semantic; it concerns the moral status of corporate bodies over time. We have three drafts: Draft A ('we apologise'), Draft B ('we deeply regret'), and Draft C (factual acknowledgement without attitudinal verbs). This memo recommends adopting Draft A, provided it is contextualised correctly through the lens of political responsibility rather than collective sin.

  **The Philosophical Crux: Jaspers and Political Guilt**

  The Panel's debate has rightly centred on Karl Jaspers' distinction in *The Question of German Guilt*. Jaspers separates guilt into four categories: criminal, moral, political, and metaphysical. 

  The Draft C camp relies on a strict interpretation of *criminal* and *moral* guilt. They argue correctly that guilt in these senses requires a subject who committed the deed and possesses a conscience to feel remorse. As no living member of this university owned slaves or established the endowment, attributing moral guilt to us is indeed a category error. A corporate body cannot feel remorse; only individuals can.

  However, Draft A need not rely on moral guilt. It rests on *political* guilt. For Jaspers, political guilt attaches to all citizens of a polity for the actions of their state or institutions, simply by virtue of their membership and the continuity of that body. It is not about sin; it is about liability. It acknowledges that we are the beneficiaries of a continuing institution that was constituted by unjust acts. We inherit the liability to make amends not because we are sinners, but because we are successors.

  **Evaluation of the Drafts**

  Draft C is philosophically robust regarding moral agency but morally insufficient. To state that slavery was a 'grave injustice' without an attitudinal verb treats the university as an archive rather than a community. It sidesteps the relational aspect of reconciliation.

  Draft B ('we deeply regret') attempts a compromise but risks vacuity. 'Regret' is often used to express sorrow for an outcome without accepting responsibility for the cause. It creates a passive distance ('what was done in the name of this institution') that may read as evasive to the descendants of the enslaved.

  Draft A ('we apologise') is the only option that fully accepts political guilt. An institutional apology is not a confession of personal sin by current staff; it is a speech act of commitment. It signals that the institution, as a continuous legal and moral entity, accepts the burden of its history. It validates the suffering of the victims by acknowledging that the *university itself*—not just dead founders—was the vehicle of that injustice.

  **Addressing the Draft C Objection**

  The strongest argument from the Draft C camp is that 'we apologise' is a metaphor at best, and a moral costume at worst. They ask: *Who is the 'we' that apologises, and to whom?* If the 'we' did not commit the act, is the apology not hollow?

  This objection holds if we view the university as a mere aggregation of current individuals. It fails if we view the university as a corporate personhood that persists through time. We are not apologising for what *we* did as individuals; we are apologising for what *this institution* did, of which we are currently the custodians. The apology is valid because the institution is the same legal entity that accepted the endowment in the 1820s. To refuse the apology on the grounds of personal innocence is to dissolve the university's continuity when it is convenient, while claiming its prestige when it is not. We cannot claim the 1820s endowment as 'ours' for our budget while disclaiming the 1820s origins as 'theirs' for our conscience.

  **Recommendation**

  I recommend we adopt **Draft A**, but with a crucial clarifying clause to address the philosophical concerns of the Draft C camp. The statement should read:

  > *"The University apologises for the role this institution played in perpetuating the injustices of slavery through its founding endowment. We accept responsibility for this legacy as the current custodians of the University."*

  This wording retains the moral clarity of 'apologise' while grounding it in 'custodianship' (political responsibility) rather than personal culpability. It satisfies the historian's need for accuracy, the lawyer's need for precise liability, and the philosopher's need for agency.

  **What Would Change My Recommendation**

  My position rests on two assumptions. If either proves false, I would withdraw my support for Draft A in favour of Draft C.

  First, **Legal Liability.** If our General Counsel advises that the verb 'apologise' creates a precedent for unlimited financial reparations beyond the agreed scholarships, we must prioritise the institution's solvency. In that case, Draft C is the safer fiduciary choice, however cold it appears.

  Second, **Recipient Reception.** If the descendant communities we intend to honour indicate that an apology from a white-led institution feels performative or offensive—essentially, if they tell us that our apology centres *us* rather than *them*—then we should not issue it. An apology is a gift; if the recipient does not want it, offering it is an act of arrogance.

  Absent these specific constraints, Draft A remains the only option that aligns our words with our continued existence as a beneficiary of that endowment. We are politically liable for our history. We should say so.
