answer: |-
  You have put your finger on a very specific, sophisticated nerve in the philosophy and history of science. You are describing a phenomenon that sits at the intersection of **underdetermination**, **epistemic values**, and **historical path dependence**.

  There is no single, canonical "one-word" term that captures the entire chain (Equivalence $\rightarrow$ Contested Criteria $\rightarrow$ Ratcheting of Criteria). However, the literature has distinct names for each link, and when synthesized, they describe exactly what you are seeing.

  Here is the breakdown of the concepts, the specific literature on the "ratchet" effect, and the boundaries of the idea.

  ### 1. The Tie: Transient Underdetermination
  You correctly distinguished this from the Duhem-Quine thesis (which is about saving a theory from *falsification*). What you are describing is **Underdetermination of Theory by Data**, specifically **Transient Underdetermination**.

  *   **The Concept:** At time $T_1$, Theory A and Theory B are empirically equivalent. They predict the same data.
  *   **The Distinction:** Philosophers like Larry Laudan and Jarrett Leplin distinguish between *permanent* underdetermination (logic dictates they can never be distinguished) and *transient* underdetermination (they are indistinguishable *now* due to instrumental or conceptual limits, but may diverge later).
  *   **Relevance to you:** Your Copernicus/Tycho and Lorentz/Einstein examples are classic cases of *transient* underdetermination. The fact that they might eventually diverge (stellar parallax, Michelson-Morley nuances) does not negate the philosophical problem at $T_1$.

  ### 2. The Scoreboard: Epistemic Values (and their Weighting)
  You asked about the "scoreboard" where different camps prioritize different criteria (simplicity vs. physical stability). In the literature, these are called **Epistemic Values** (or Theoretical Virtues).

  *   **The Source:** Thomas Kuhn (in "Objectivity, Value Judgment, and Theory Choice") and Ernan McMullin.
  *   **The Mechanism:** Kuhn listed values like accuracy, consistency, scope, simplicity, and fruitfulness. Crucially, **Kuhn admitted these values do not come with a rulebook for weighting.**
  *   **The Conflict:** One group might weight "ontological parsimony" (Copernicus) higher than "compatibility with terrestrial physics" (Tycho). The other group does the reverse.
  *   **The Term:** When two groups cannot agree on which values matter most, this is often discussed under **Methodological Incommensurability**. It is not just that they speak different languages (taxonomic incommensurability); it is that they play by different rules of justification.

  ### 3. The Ratchet: Methodological Path Dependence
  This is the specific part you felt was unnamed. You described a process where the *winning criteria* become the *default criteria* for the next round, creating a lineage of judgment calls.

  There is no single "famous" noun for this exact ratchet, but the concept is well-established in the history of science under the umbrella of **Methodological Path Dependence** or **Epistemic Sedimentation**.

  *   **The Definition:** This occurs when a methodological choice made during a period of underdetermination becomes institutionalized. Once Theory A wins based on Criterion X, the scientific community reorganizes its training, instrumentation, and funding around Criterion X. In the *next* dispute, Criterion X is no longer seen as a "choice"; it is seen as "how science is done."
  *   **Key Literature:**
      *   **Hasok Chang:** In works like *Inventing Temperature* and *Realism for Realistic People*, Chang argues for "active historical philosophy of science." He explicitly discusses how standards of evidence (like the boiling point of water) are not discovered but *constituted* through a process of "coherentism." Once a standard is set, it constrains future measurements. This matches your "ratchet" description perfectly.
      *   **Larry Laudan:** In *Progress and Its Problems*, Laudan discusses **Research Traditions**. He argues that methodological rules are part of the tradition. When a tradition wins, its methodological rules gain authority.
      *   **Andrew Pickering:** In *The Mangle of Practice*, he describes how instruments and theories co-evolve. The "resistance" of the material world shapes the theory, but the theory also shapes what instruments are built. This creates a lock-in effect.

  **Proposed Terminology:** If you need a label for your forums, **Epistemic Path Dependence** is the most accurate existing phrase. It captures the economic/sociological idea of "path dependence" (where past decisions constrain future options) and applies it to epistemology (criteria for truth).

  ### 4. Addressing Your Edge Cases

  **Q: Does it still count as your thing when the rivals eventually become testable and one wins outright?**
  **A: Yes.** This is a crucial boundary condition.
  *   **Why:** Even if data eventually favors Theory A (e.g., stellar parallax is found), the *reason* the community stuck with Theory A long enough to find that data was often the "scoreboard" choice (e.g., "we valued simplicity, so we kept looking for parallax").
  *   **The Ratchet Effect:** If the Tychoians had won the "scoreboard" war (valuing terrestrial physics over simplicity), they might have abandoned the search for parallax or interpreted null results differently. The *victory* of the data is often contingent on the prior *victory* of the methodology. This is sometimes called the **Theory-Ladenness of Methodology**.

  **Q: Is it the same as "blame the equipment" (Duhem-Quine)?**
  **A: No.**
  *   **Duhem-Quine:** "My theory predicted $X$, but we saw $Y$. I will claim the instrument was broken." (Defensive/Protective).
  *   **Your Phenomenon:** "Both theories predict $Y$. I will claim my theory is better because it is simpler." (Offensive/Selection).
  *   **The Link:** They are related because both rely on the fact that data does not speak for itself. But Duhem-Quine is about *falsification resistance*; your phenomenon is about *theory selection criteria*.

  ### 5. Confidence and Contested Areas

  I will be upfront about the confidence levels here, as you requested.

  *   **High Confidence:** The identification of **Epistemic Values** (Kuhn/McMullin) and **Transient Underdetermination** (Laudan/Sklar). These are standard textbook concepts that map directly to the first half of your description.
  *   **Medium-High Confidence:** The connection to **Hasok Chang's Coherentism** and **Laudan's Research Traditions**. These authors explicitly deal with the evolution of standards, but they don't always use the specific "ratchet" metaphor you are using.
  *   **Low Confidence (The Contested Bit):** The claim that this "ratchet" undermines the objective status of the final theory.
      *   *Realists* will argue: "Even if the path was messy, the final theory works. The ratchet just got us there faster."
      *   *Anti-Realists/Constructivists* will argue: "The ratchet means the theory is just a social artifact of the winning camp's values."
      *   *The Middle Ground (My recommendation):* This is the **Historicist** position. The theory is objectively *better* relative to the values we now hold, but those values themselves have a history. This is where the debate is live.

  ### Summary for Your Arguments

  When you are on the forums, you can structure your argument like this:

  1.  **Identify the state:** "We are in a state of **Transient Underdetermination**."
  2.  **Identify the conflict:** "The camps are employing different weightings of **Epistemic Values** (Methodological Incommensurability)."
  3.  **Identify the long-term effect:** "The winning values create **Epistemic Path Dependence**, where the methodological choices of the victor become the invisible defaults for the next generation."

  **The "Name" you are looking for:**
  If you want to sound like you know the literature, call it **The Historical Constitution of Epistemic Values**.
  If you want a punchier term for the mechanism, call it **Methodological Path Dependence**.

  **One final boundary case to watch out for:**
  Be careful not to slide into "Anything Goes" relativism. The point you are making is not that *data doesn't matter*, but that *data is interpreted through a lineage of methodological commitments*. The evidence is not at the bottom; it is woven into the structure. This is a **Coherentist** view of justification (justification comes from the mutual support of theory, data, and method) rather than a **Foundationalist** view (justification comes from data alone). Distinguishing Coherentism vs. Foundationalism might be the deepest philosophical label for your intuition.
