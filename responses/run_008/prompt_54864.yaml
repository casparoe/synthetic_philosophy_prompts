  *Dependencies:*
  1. Trust in testimony generally.
  2. The intuition that aesthetic judgment is different.
  3. The definition of "Aesthetic Verdict" (not fact, not preference).
  4. Pre-empting Subjectivity.

  *Example:*
  Needs to block "I'll check." Needs to block "Expert authority."
  Recommendation: The "Distant Painting" or "Unreleased Album." Let's go with the Painting. It's static, visual, and clearly "aesthetic."

  *Misconceptions:*
  (a) Subjectivity -> Pre-empt in Intro.
  (b) Track Record -> Stipulate in Example.
  (c) Belief=Appreciation -> The Core Pivot (Minute 20).
  (d) Snobbery -> Reframe in Discussion.

  *Scope:*
  Warn about the "Value" exclusion.

  *Closing Question:*
  Focus on the "Missing State."

