answer: |-
  **Scenario A:** You are buying a house with cash and love it unconditionally; you will buy it regardless of any defects. A free, perfectly accurate inspection reveals the roof condition. **The Check:** Prior: 50% chance of leak. Action before: Buy (EV $500k value). Signal: Leak confirmed. Action after: Buy (EV $500k value). Expected Value of Information: $0. **Fine Print:** Information requires the *potential* to change your action to have value. Since your decision is fixed, the truth is worthless. **Patch:** Make the leak costly enough that you'd walk away if known. Now the info changes your action, and value becomes positive.

  **Scenario B:** You asked for strictly negative value with no costs, no emotional harm, and outcomes independent of knowledge. This is impossible. Good's theorem proves $E[Max(U|info)] \ge Max(E[U])$. You can always ignore free info; if you use it, you optimize outcomes. If knowledge causes pain, that's a cost (violating "free"). If the fact hurts outcomes, it hurts whether you know or not. Your brother-in-law is mathematically right under these constraints. **The Check:** Prior: Any. Action before: Optimize. Action after: Optimize (or ignore). EV After $\ge$ EV Before. **Fine Print:** Utility cannot depend on the *state of knowing*. The structure of rational choice protects you; you never *have* to act on bad news. **Patch:** Introduce an "anxiety cost" to knowing. Now info isn't free, and net value can be negative, but that violates your BIL's ban on costs.

  **Scenario C:** The sealed genetic test for an incurable disease. Intuition says ignorance is bliss, but rebuild it: the disease is treatable if caught early. **The Check:** Prior: 10% chance of condition. Action before: Do nothing (EV 0.9 health units). Signal: Positive. Action after: Take preventive meds (costly but ensures health). EV After: 0.1*(meds health) + 0.9*(normal) > 0.9. Expected Value: Positive. **Fine Print:** Information enables *conditional action*. You aren't paying for the news; you're paying for the option to treat. **Patch:** Remove the treatment. Now action doesn't change regardless of result, value drops to zero (Scenario A), proving ignorance is never *better*, only equal.

  **Winning the Argument:** Admit B is impossible under his rules—that's the theorem's core. Win on A and C: Info is useless if you won't change your mind (A), and valuable only because it lets you act differently (C). If he claims real-life ignorance is better, point out he's secretly counting "stress" as a cost, which violates his own "free information" premise.
