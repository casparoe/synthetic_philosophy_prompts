prompt: |-
  I'm on the council of a 28-household cohousing community, and I need a decision memo drafted before our vote next month. American English please, and I want it casual-ish in tone but usable as a real memo the council can circulate.

  Background: our founding bylaws contain what everyone here calls the "own-hearth rule." For a defined list of personal choices — your front garden, whether you keep pets, whether your unit hosts the shared tool library, and crucially whether you join the weekly communal dinner rota — the household itself has final say, and the council can never overrule. It's basically the reason half these people moved in. It's sacred.

  The problem: the dinner rota is dying. We ran a survey, and the pattern is kind of bizarre when you write it out. Nearly every household says they get real value from the dinners existing — they want them to continue with decent participation. But nearly every household also says they'd personally rather skip their own turns and let others host. Under the own-hearth rule, each household decides only its own participation, so households keep quietly dropping out, and we're now approaching the threshold where the whole thing collapses. And here's the kicker: surveyed in pairs of outcomes, the households unanimously say they'd be better off if everyone were simply required to take one turn a month than if the dinners dissapeared entirely. An outcome everyone can veto their way into, that everyone says is worse than an outcome that requires overruling them.

  A council member has proposed an amendment: the own-hearth rule stays in force, except that where the council finds literally every household prefers the compelled outcome, it may overrule a personal choice. Her critics on the council say this swallows the rule — it converts a right into something the community grants and can revoke whenever revoking is collectively convenient, and a right you hold only until it's inconvenient isn't much of a right. There's also a practical worry: once the exception exists, people will start misreporting their preferences strategically, and "everyone prefers" becomes uncheckable. A friend who did econ as an undergrad told me this whole mess is an instance of Sen's liberal paradox — apparently you can't have both a minimal respect for individual spheres of choice and the principle that unanimous preferences should win out, and our amendment is one way of picking a side.

  Please draft the memo I'll circulate before the vote. It should recommend one concrete course of action — adopt the amendment, reject it and let the dinners go, reject it and try something else entirely (restructure the choice somehow, buy the right, shrink the scope of the rule — your call), or adopt with conditions — with the reasoning laid out so the losing side could actually engage with it rather than feel steamrolled. I want an honest treatment of the strongest argument for the option you're rejecting, including whether the "rights can't be overridden by unanimity" position is really as strong as its defenders here think, or whether it depends on treating these personal choices as the kind of thing a right protects in the first place. If you think the amendment is a hack that "solves" the problem only verbally, say so and say what would actually solve it. Roughly 700-1000 words, structured like something a council chair would actually read.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Council member of a 28-household cohousing community.
      *   **Task:** Draft a decision memo for circulation before a vote next month.
      *   **Tone:** Casual-ish American English, but usable as a real memo (professional enough for council, accessible enough for neighbors).
      *   **Length:** 700-1000 words.
      *   **Context:**
          *   "Own-hearth rule": Bylaws guarantee household autonomy over specific choices (garden, pets, tool library, *communal dinner rota*). Council cannot overrule.
          *   Problem: Dinner rota is collapsing due to free-riding/opting out. Everyone wants dinners to exist, everyone prefers a mandatory rota over no dinners, but everyone prefers *not* to host themselves (prisoner's dilemma/coordination failure).
          *   Proposed Amendment: Keep own-hearth rule, *except* if the council finds *every* household prefers the compelled outcome, the council may overrule personal choice.
          *   Criticism: This destroys the right (makes it contingent on convenience), invites strategic misreporting, and touches on Sen's Liberal Paradox (individual liberty vs. Pareto efficiency/unanimity).
      *   **Requirement:** Recommend one concrete course of action. Address the strongest argument for the rejected option honestly. Discuss whether the "rights" argument holds water here. If the amendment is a hack, say so.
      *   **Structure:** Memo format (To, From, Date, Subject, Body).

  2.  **Determine the Recommendation:**
      *   *Option A: Adopt the amendment.* Risks eroding the core value (own-hearth) that defines the community. Creates a precedent for overriding autonomy based on "unanimous" preference (which is hard to verify and easy to manipulate).
      *   *Option B: Reject and let dinners go.* Preserves the rule but loses a core community function everyone says they value.
      *   *Option C: Reject and try something else.* This seems the most constructive. The problem isn't the right to opt-out; it's the structure of the dinner rota itself. If everyone prefers mandatory participation over no dinners, the "own-hearth" protection on this specific issue is causing the failure. However, overriding the bylaw is dangerous.
      *   *Decision:* I should recommend **rejecting the amendment but restructuring the obligation**. Instead of a "right to opt-out" that kills the program, shift the default. Or, more boldly, recommend **rejecting the amendment** because it's a logical hack that undermines the bylaw without solving the incentive problem, and propose a **buy-out/opt-out fee system** or a **redefinition of the rule's scope**.
      *   *Better Decision:* The prompt asks me to pick one. The "Sen's Liberal Paradox" angle is fascinating. The amendment tries to solve the paradox by allowing Pareto improvements to override liberty. But as the critics say, it makes liberty contingent.
      *   *My Stance:* I will recommend **rejecting the amendment** and instead **narrowing the scope of the own-hearth rule** regarding dinners. The current rule treats "joining the rota" as a personal choice like "pets." It shouldn't be. It's a collective commitment. The amendment is a hack because it keeps the rule but adds a loophole that swallows it. The better path is to amend the bylaws to remove communal dinners from the "own-hearth" list entirely, making participation a standard community obligation (like dues), perhaps with a hard opt-out fee. This respects the spirit of the rule (personal space/choices) while acknowledging that communal dinners are *communal*, not personal.
      *   *Wait, looking closer at the prompt:* "Recommend one concrete course of action... adopt the amendment, reject it and let the dinners go, reject it and try something else entirely... or adopt with conditions."
      *   *Refined Stance:* I'll recommend **rejecting the amendment and removing communal dinners from the own-hearth rule entirely**. This is cleaner than the amendment. The amendment says "You have a right, unless we all agree you shouldn't." The better path is "This isn't a personal right; it's a community commitment." This addresses the "rights" argument directly.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** State the purpose (vote on the amendment) and the recommendation (Reject amendment, propose alternative).
      *   **The Problem:** Briefly recap the dinner rota crisis and the survey results (Prisoner's Dilemma).
      *   **The Proposed Amendment:** Explain what it does (unanimity exception).
      *   **Analysis of the Amendment:**
          *   Pros: Solves the immediate dinner collapse, respects unanimity (Pareto).
          *   Cons: It's a hack. It makes rights contingent. Strategic misreporting risk.
          *   The "Rights" Argument: Critics say a right you can vote away isn't a right. They're mostly right, *but* is dinner hosting really a "right" like keeping pets?
      *   **The Alternative:** Remove dinners from the own-hearth list. Make it a standard obligation with a buy-out option.
      *   **Addressing the Opposition:** Acknowledge the sanctity of the own-hearth rule. Admit that eroding it is dangerous. But argue that protecting a specific activity (dinners) under a rule designed for personal sovereignty (hearths) is a category error.
      *   **Conclusion:** Call to action.

  4.  **Tone Check:**
      *   Casual-ish American English ("folks," "kicker," "hack," "steamrolled").
      *   Not too dry, but respectful.
      *   Word count check (700-1000).

  5.  **Refining the Argument (Sen's Paradox):**
      *   Need to mention Sen lightly without getting too academic. The amendment tries to prioritize Pareto efficiency over Liberty. I should argue that we should prioritize Liberty *unless* the activity isn't actually personal.
      *   The " strongest argument for the option you're rejecting": If I reject the amendment, I need to validate the pro-amendment side. Their argument is: "We all want dinners. We all agree we want to be forced. Why cling to a rule that destroys what we want?" That's a strong pragmatic argument.
      *   My counter: It sets a bad precedent. Better to fix the classification than the exception.

  6.  **Writing - First Pass Mental Outline:**
      *   To: Council & Community
