  **MEMORANDUM**

  **TO:** Cohousing Council & Community Members
  **FROM:** [Your Name], Council Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Own-Hearth Amendment & Communal Dinners

  Hi everyone,

  As we prepare to vote next month on the proposed amendment to the own-hearth rule, I want to lay out my position clearly. I know this touches the third rail of our community. The own-hearth rule is sacred for a reason—it's the guarantee of autonomy that convinced half of us to move here. But we also have a practical crisis: the communal dinner rota is collapsing.

  **The Situation**
  The survey results are clear, and frankly, they're a bit of a mess. We all value the dinners. We all prefer a mandatory rota over no dinners at all. Yet, individually, we keep opting out. Under the current bylaws, every household has the final say on their own participation. This has created a classic coordination failure (our econ-savvy neighbors might call it a instance of Sen's Liberal Paradox). We are vetoing our way into an outcome everyone agrees is worse.

  **The Proposed Amendment**
  The current proposal keeps the own-hearth rule intact but adds an exception: if the council finds that *every* household prefers the compelled outcome, the council may overrule personal choice.

  **Why I Cannot Support the Amendment**
  I understand the appeal. The strongest argument for this amendment is pragmatic consistency: If every single household says, "I wish you would force me to do this," why cling to a rule that prevents us from getting what we unanimously want? It respects the collective will without technically deleting the rule.

  However, I believe this amendment is a hack that solves the problem only verbally while damaging the principle we're trying to protect.

  1.  **It Converts Rights into Privileges:** The critics on the council are right to worry. A right you hold only until it becomes inconvenient for the community isn't a right; it's a permission slip. If we establish that unanimity can override autonomy, we set a precedent that individual sovereignty is contingent on collective convenience.
  2.  **It's Uncheckable:** The amendment relies on households honestly reporting their preferences. But once people know that admitting they'd prefer a mandatory rule leads to being forced into one, strategic misreporting becomes inevitable. Households will claim they value their opt-out rights even if they don't, just to keep the leverage. "Everyone prefers" becomes impossible to verify.

  **A Better Path: Reclassify, Don't Exception**
  Instead of carving a loophole into the own-hearth rule, I recommend we **reject the amendment** and instead **remove communal dinners from the own-hearth list entirely.**

  The own-hearth rule was designed for personal spheres: your garden, your pets, your interior space. These are choices that primarily affect your own unit. Communal dinners are fundamentally different. They are, by definition, collective obligations. Hosting a dinner isn't a personal lifestyle choice like keeping a cat; it's a contribution to shared infrastructure, much like paying dues or shoveling the shared walkway.

  By keeping dinners under the own-hearth rule, we are miscategorizing a community commitment as a personal liberty. Protecting the "right" to opt out of communal labor undermines the community labor itself.

  **My Proposal**
  1.  **Vote No on the Amendment:** Preserve the integrity of the own-hearth rule. Do not introduce a unanimity exception that weakens the principle of autonomy.
  2.  **Propose a Bylaw Change:** Move "participation in communal dinners" out of the own-hearth protected list and into the standard community obligations section.
  3.  **Build in a Hard Opt-Out:** To respect those who truly cannot host, create a formal buy-out system (e.g., a fee that funds a hired cook or stipend for extra hosts). This isn't a veto; it's a trade.

  **Addressing the Concerns**
  I know some of you feel that removing dinners from the own-hearth rule is just a backdoor way of forcing participation. It is, intentionally. But it's honest about it. The amendment tries to have it both ways—claiming to protect rights while allowing them to be voted away. My proposal admits that some things simply aren't matters of individual sovereignty.

  If we care about the own-hearth rule, we should protect it where it belongs: in the private sphere. Let's not stretch it to cover collective responsibilities until it breaks. We can save the dinners without turning our foundational rights into something the majority (or even a unanimous crowd) can revoke whenever the mood strikes.

  Let's discuss this at the next meeting. I'm happy to draft the specific bylaw language for the reclassification if there's interest.

  Best,

  [Your Name]
