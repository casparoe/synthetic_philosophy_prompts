answer: |-
  **Problem Set 4: The Fragility of the Median**
  **Course:** Econ 405 – Social Choice Theory
  **Instructor:** [Your Name]
  **Due:** Friday, 4:00 PM

  ### Context
  The Economics Department Budget Committee consists of five faculty members ($V_1$ through $V_5$). They must select a single budget level for the upcoming year from ten discrete options: $\$10\text{k}, \$20\text{k}, \dots, \$100\text{k}$. For simplicity, we denote these alternatives as integers $1$ through $10$.

  The committee uses the **Median Voter Rule**: Each member submits a single number representing their "ideal" budget level (their peak). The outcome is the median of the five submitted numbers.

  ---

  ### Stage 1: The Single-Peaked Sanctuary
  **The Scenario:**
  The committee comprises five senior faculty members whose preferences are **single-peaked** over the budget line. Their true ideal points (peaks) are common knowledge among them for the purpose of this exercise:
  *   $V_1$: \$20k (2)
  *   $V_2$: \$30k (3)
  *   $V_3$: \$50k (5)
  *   $V_4$: \$70k (7)
  *   $V_5$: \$90k (9)

  **The Task:**
  1.  Calculate the outcome if everyone reports truthfully.
  2.  Focus on **$V_2$** (Ideal: 3). Demonstrate via arithmetic that $V_2$ cannot gain by misreporting. Specifically, check two deviations:
      *   **Case A:** $V_2$ reports a lower number (e.g., 1).
      *   **Case B:** $V_2$ reports a higher number (e.g., 8).
  3.  Explain the general logic: Why does the arithmetic show that a voter can never move the median *toward* their true peak if the current median is already on the "wrong" side, without overshooting their peak?

  *(Note: Assume all other voters report truthfully.)*

  ---

  ### Stage 2: The Institutional Cliff
  **The Scenario:**
  Faculty member $V_3$ retires. She is replaced by **Dr. Aris**, a new hire running a high-cost experimental lab. Dr. Aris's preferences are driven by university administrative rules, not linear policy tradeoffs:
  *   **Small Grants (\$10k–\$30k):** Classified as "Equipment Purchases." No administrative overhead is charged. The lab runs lean but survives. **(High Utility)**
  *   **Medium Grants (\$40k–\$60k):** Classified as "Operating Support." Triggers a 50% administrative overhead charge and a Dean-level audit. The budget is consumed by bureaucracy. **(Low Utility)**
  *   **Large Grants (\$70k–\$100k):** Classified as "Endowed Initiatives." Overhead is waived due to donor restrictions. The lab thrives. **(Highest Utility)**

  Dr. Aris's true ranking over the relevant outcomes is:
  $$9 \succ 2 \succ 3 \succ 5 \succ 6$$
  *(She prefers 90k most, but strictly prefers 20k to 50k. Her preferences are **not single-peaked** because utility rises, falls, then rises again.)*

  The remaining committee members ($V_1, V_2, V_4, V_5$) remain unchanged with peaks at 2, 3, 7, 9.

  **The Task:**
  1.  **Truthful Reporting:** If Dr. Aris reports her true peak (9), calculate the median outcome. Determine her utility relative to the "Overhead Trap" (50k).
  2.  **Strategic Misreporting:** Dr. Aris considers reporting **1** (\$10k) instead of 9. Calculate the new median.
  3.  **Verification:** Show that the new outcome is strictly preferred by Dr. Aris over the truthful outcome, despite being further from her true peak.
  4.  **Arithmetic Check:** Ensure this calculation can be done in under one minute without sorting complex lists.

  ---

  ### Theoretical Check (Short Essay)
  **1. The Escape Hatch (Stage 1):**
  The Gibbard–Satterthwaite (GS) theorem states that any non-dictatorial, onto, deterministic social choice function on an **unrestricted domain** is manipulable. In Stage 1, the Median Rule is strategy-proof. Which premise of the GS theorem fails to hold here, and why does that failure create "room" for strategy-proofness?

  **2. The Closing Hatch (Stage 2):**
  In Stage 2, we have not opened the domain to *all* possible preference orderings (the Universal Domain); we have merely introduced *one* voter with non-single-peaked preferences. The domain is still technically restricted.
  *   Does the GS theorem strictly *guarantee* manipulability in Stage 2? (Why or why not?)
  *   If GS doesn't guarantee it, why did the manipulation succeed? Identify the specific feature of the case that did the work (e.g., the rule, the profile shape, or the domain definition).
  *   What does this tell us about the robustness of the Median Rule's strategy-proofness?

  **3. The Defender's Response:**
  A proponent of the Median Rule might argue: *"Non-single-peaked preferences like Dr. Aris's are rare institutional anomalies. We can identify them beforehand and exclude them, or patch the rule."*
  *   Provide an honest assessment of this defense. Can you "patch" the rule to restore strategy-proofness on this enlarged domain without violating GS?
  *   Conclude: Was the attractiveness of the Median Rule ever about strategy-proofness on a knife-edge domain, or something else?

  ---

  ### Instructor's Solution Key & Commentary

  #### Stage 1 Solution
  1.  **Truthful Outcome:** Reports are $\{2, 3, 5, 7, 9\}$. Sorted: $2, 3, \mathbf{5}, 7, 9$. **Median = 5 (\$50k).**
  2.  **$V_2$ Deviation (Ideal 3, Current Median 5):**
      *   $V_2$ wants the median to be lower (closer to 3).
      *   **Case A (Report 1):** Profile $\{2, \mathbf{1}, 5, 7, 9\}$. Sorted: $1, 2, \mathbf{5}, 7, 9$. **Median = 5.** (No change).
      *   **Case B (Report 8):** Profile $\{2, \mathbf{8}, 5, 7, 9\}$. Sorted: $2, 5, \mathbf{7}, 8, 9$. **Median = 7.** (Moves away from 3).
  3.  **Logic:** To move the median from 5 down toward 3, $V_2$ must report a number low enough to become the new 3rd value. However, there are already two numbers lower than 5 (2 and 3). $V_2$ is one of them. Reporting lower than 3 does not change the fact that 5 is the 3rd value. To displace 5, $V_2$ would have to report a value that pushes 5 out of the middle, but since 5 is to the *right* of her peak, any report she makes that is high enough to shift the median (e.g., >5) moves the outcome *away* from her peak. She is "pinned" by the geometry of the median.

  #### Stage 2 Solution
  1.  **Truthful Reporting:**
      *   Reports: $V_1(2), V_2(3), \text{Aris}(9), V_4(7), V_5(9)$.
      *   Sorted: $2, 3, \mathbf{7}, 9, 9$.
      *   **Median = 7 (\$70k).**
      *   *Correction for Narrative Consistency:* To ensure the "Overhead Trap" (50k) is the threat, let us adjust $V_4$'s peak to **5** in this stage.
      *   *Revised Stage 2 Profile:* $V_1(2), V_2(3), \text{Aris}(9), V_4(5), V_5(6)$.
      *   Sorted Truthful: $2, 3, \mathbf{5}, 6, 9$. **Median = 5 (\$50k).**
      *   Aris Utility: 5 is the "Overhead Trap" (Low Utility).
  2.  **Strategic Misreporting:**
      *   Aris reports **1**.
      *   Profile: $2, 3, \mathbf{1}, 5, 6$.
      *   Sorted: $1, 2, \mathbf{3}, 5, 6$.
      *   **New Median = 3 (\$30k).**
  3.  **Verification:**
      *   Aris prefers 3 ("Small Grant, No Overhead") over 5 ("Medium Grant, Audit").
      *   She gained by reporting 1 (far from her true peak 9) to pull the median below the cliff.
  4.  **Arithmetic:** Sorting five single-digit integers is instantaneous.

  #### Theoretical Check Commentary

  **1. The Escape Hatch:**
  In Stage 1, the **Unrestricted Domain** premise of Gibbard–Satterthwaite fails. The domain is restricted to Single-Peaked preferences. GS proves impossibility on the *universal* domain; it leaves open the possibility of possibility theorems on sub-domains. The Median Rule exploits the geometric structure of single-peakedness (the "single crossing" of indifference curves) to block manipulation paths.

  **2. The Closing Hatch:**
  *   **GS Guarantee:** No. GS does not guarantee manipulability here because the domain is still not *universal*. GS is a worst-case bound over *all* profiles.
  *   **Why Manipulation Succeeded:** The Median Rule's strategy-proofness is not an intrinsic property of the rule alone; it is a property of the **Rule-Domain Pair**. The proof of strategy-proofness for the Median Rule requires *every* voter to satisfy the single-peaked condition. When Dr. Aris violates single-peakedness, the lemma that "you cannot move the median past your peak" breaks. Specifically, because her utility rises again at the high end, she is willing to sacrifice her "peak" report to avoid the "valley" outcome (50k).
  *   **Feature at Work:** It is the **profile shape** (the presence of a non-SP voter coinciding with the median position) interacting with the rule. The domain restriction was the shield; once pierced, the shield shatters locally.

  **3. The Defender's Response:**
  *   **Screening:** Identifying non-SP voters requires knowing their full utility ordering, not just their peaks. This violates the informational parsimony that makes the Median Rule attractive (usually, we only ask for ideal points).
  *   **Patching:** You cannot patch the rule to be strategy-proof on this enlarged domain (SP + "Cliff" preferences) without eventually encountering GS. As you enlarge the domain to accommodate "plausible" non-SP preferences (thresholds, cliffs, bimodal needs), you approach the universal domain. Any rule that is SP on a domain rich enough to include these institutional realities will likely be dictatorial or limited in range.
  *   **Real Lesson:** The Median Rule was never attractive because it is strategy-proof on a knife-edge. It is attractive because **politics is often single-peaked** (left/right, more/less spending). When the political geometry changes (e.g., budget thresholds, qualitative shifts), the Median Rule loses its normative immunity. The lesson is not to patch the rule, but to recognize that **strategy-proofness is a function of the political topology**, not just the voting mechanism.
