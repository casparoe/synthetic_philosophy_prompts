          *   **Task:** Rank defeaters (Fatal -> Awkward), indicate panpsychist response (Concede vs. Wave off), and evaluate legitimacy of that response.

  2.  **Deconstruct the Combination Problem:**
      *   *Subject Summing (The "Many-to-One" Problem):* How do micro-subjects combine to form a macro-subject? This is the core metaphysical hurdle. Physics sums vectors/fields, but subjects aren't additive.
      *   *Quality Summing (The "Palette" Problem):* How do micro-qualia (e.g., electron experience) combine to make redness or pain?
      *   *Assessment:* Subject summing is generally considered the harder, potentially fatal metaphysical block. Quality summing is epistemic (we don't know the palette) but Subject summing is ontological (how do *I* exist if *they* exist?).
      *   *Physicist Analogy:* Think of phase transitions. Water molecules don't have "wetness," but the collection does. Panpsychists say micro-experience *is* there, but macro-experience is a new *subject*. The physicist in the user will spot the tension: if the micro-entities are subjects, where does the macro-subject come from without eliminating the micros?

