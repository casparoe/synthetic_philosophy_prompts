      *(Self-Correction during drafting)*: I need to make sure I don't just say "Combination Problem is hard." I need to explain *why* it's hard for a physicist. It's like trying to get a macroscopic wave function from independent particle wave functions without entanglement, but entanglement doesn't create *subjects*. It's a category error.

