answer: |-
  There is no single, established term in the literature that isolates this configuration with the precision you require. While the components of the phenomenon are well-trodden, the specific symmetry of the stalemate you describe remains unnamed.

  The nearest concepts are **verbal disputes**, **metalinguistic negotiation**, and **deep disagreement**. Each captures a facet of the configuration but fails to account for the structural symmetry that makes your correspondents' standoff so intractable.

  **1. The Verbal Dispute (Carnap, Chalmers)**
  The standard literature on verbal disputes (e.g. Rudolf Carnap's *Empiricism, Semantics, and Ontology* or David Chalmers' *Verbal Disputes*) operates on the assumption that such disputes are resolvable from a neutral vantage point. The model presumes an arbiter (or the parties themselves, upon reflection) can identify that the disagreement is merely terminological and dissolve it.
  *   **Where it misses:** It assumes asymmetry. In a standard verbal dispute, at least one party is mistaken in believing the dispute is substantive, or both are mistaken. In your cases, both parties are aware of the ambiguity, yet both insist their reading preserves substantiveness. The standard model cannot account for a situation where the *diagnosis* of the dispute (as verbal vs. substantive) is itself the object of the dispute.

  **2. Metalinguistic Negotiation (Plunkett, Sundell, Barker)**
  This is the closest contemporary fit. David Plunkett and Tim Sundell argue that many philosophical disagreements are actually negotiations over how concepts *ought* to be used.
  *   **Where it misses:** Metalinguistic negotiation typically implies a functional goal: the parties are haggling to settle on a shared usage for future inquiry. Your correspondents are not negotiating a settlement; they are weaponising the metalinguistic level. They are not asking, "How shall we use this word?" but rather, "Is your usage trivialising the world?" The literature on negotiation assumes a cooperative (or at least convergent) undercurrent; your standoff is purely adversarial and recursive.

  **3. Deep Disagreement (Fogelin, Wittgenstein)**
  Robert Fogelin's account of deep disagreement concerns clashes over "hinge propositions" or fundamental frameworks where argumentation runs out.
  *   **Where it misses:** Deep disagreement usually concerns the *facts* or the *rules of reasoning* themselves. Your correspondents agree on the facts and the logic. Their disagreement is specifically about the *significance* of the linguistic framework relative to those facts. It is a disagreement about the *status* of the disagreement, which is a narrower, more reflexive category than Fogelin allows.

  ### The Coinage: Symmetric Metalinguistic Impasse

  Since no existing term suffices, I propose we designate this configuration a **Symmetric Metalinguistic Impasse**.

  **Definition:**
  A Symmetric Metalinguistic Impasse occurs when two parties:
  1.  Agree on all non-linguistic facts relevant to a proposition $P$.
  2.  Acknowledge that $P$ admits of multiple respectable readings (e.g. a trivial reading and a substantive reading).
  3.  Each adopt a reading that renders $P$ substantive for their own position, while characterising the other's reading as rendering $P$ trivial.
  4.  Consequently, each accuses the other of engaging in a merely verbal dispute, resulting in a second-order dispute about the nature of the first-order dispute that mirrors the intractability of the first.

  **Edges and Boundaries:**
  *   **Symmetry:** This concept covers *only* the symmetric cases. If one party is simply right (i.e. one reading is objectively trivial and the other substantive, and both agree), it collapses into a standard verbal dispute. The impasse exists only so long as the accusation of "merely arguing about words" is reciprocal.
  *   **Chronicity:** It covers only chronic or unresolved cases. If the parties eventually agree on a shared reading (even if reluctantly), the impasse is broken. The term describes the *state* of stalemate, not the potential for resolution.
  *   **Equivocation:** It is distinct from plain equivocation. In equivocation, the parties are usually unaware they are using different meanings (the "talking past one another" model). In a Symmetric Metalinguistic Impasse, the ambiguity is common knowledge; the conflict is over which meaning *matters*.

  ### Ontological Status: A Fact About the Disputants

  You ask whether these standoffs should be understood as a fact about language, a fact about the world, or a fact about the disputants' stubbornness.

  It is neither a fact about language nor a fact about the world.
  *   **Not Language:** The language is functioning correctly; it is rich enough to support both readings. There is no semantic defect.
  *   **Not the World:** The underlying facts are agreed upon. The world is not withholding data.

  It is a **fact about the disputants' pragmatic stakes**.
  The persistence of the impasse reveals that the correspondents have invested their philosophical projects in the *significance* of the distinction rather than the *truth* of the proposition. For the realist, "numbers exist" must be substantive, or their realism is idle. For the anti-realist, "numbers exist" must be trivial (or false), or their eliminativism is unnecessary.

  The Symmetric Metalinguistic Impasse is, therefore, a symptom of **competing philosophical economies**. Each party requires the dispute to be substantive to justify the labour of their own position. To concede that the dispute is verbal is to concede that one's own philosophical programme is addressing a pseudo-problem. Thus, the standoff is not a failure of communication, but a rational defence of professional investment. The "heat" you observe is the friction of two research programmes colliding over the right to define what counts as a genuine question.

  In your magazine, recognising this configuration allows you to intervene not by asking them to clarify their terms (which they have already done), but by asking them to justify why their preferred reading is the one that warrants philosophical attention. That shifts the burden from semantics to pragmatics, which is where the actual disagreement lies.
