answer: |-
  In Dutch Book arguments, the **adversary** is a bookie constructing a portfolio of bets based on your quoted prices. The guarantee provided is not a regret bound (comparing performance to the best action in hindsight) but a **static dominance** result. If your prices violate probability axioms, the adversary selects a linear combination of bets yielding strictly positive profit in *all* possible states of the world. You suffer negative utility universally. This is stronger than high-probability regret bounds; it is a "sure loss" bound against a specific class of adversarial strategies.

  For vNM/Savage, view this as **behavioral indistinguishability**. If your preference relation $\succeq$ over lotteries satisfies the axioms (completeness, transitivity, independence, continuity), your choice policy is indistinguishable from $\arg\max \mathbb{E}_P[U]$ to any observer testing choices among lotteries. Violating axioms implies **dynamic inconsistency**: there exists a sequence of trades (a money pump) where an adversary returns you to your initial state with less wealth. This is exploitability in a sequential decision process.

  **Residue Report**

  1.  **Norms vs. Predictions:** Online learning is instrumental (minimize loss); coherence theorems are often framed as normative (be rational). Your vocabulary captures the *cost* of incoherence (exploitability), not the *moral* weight. The leap from "you will be pumped" to "you are irrational" is philosophical, not mathematical. Your vocabulary isn't missing anything here; the coherence argument is doing extra normative work.
  2.  **Bounded Agents & Stakes:** OL explicitly handles computational constraints (efficient no-regret). Coherence theorems assume unbounded reasoning. A bounded agent might accept a Dutch Book because calculating coherence exceeds the stake. Your vocabulary handles this via computation-regret tradeoffs; coherence arguments often ignore computation, claiming less work than fans assert for real agents.
  3.  **Repeatability:** Money pumps require cyclical preferences exploitable over time. OL assumes repeated rounds. If the game is one-shot with transaction costs, the adversary cannot extract value. Coherence arguments often assume frictionless repeatability. Here, OL is more realistic; the threat of exploitation vanishes without iteration.
  4.  **Independence Axiom:** This is the largest residue. Violating independence (Allais paradox) doesn't always yield a simple money pump without assuming additional structure. The debate is whether independence is a requirement of rationality or merely a specific risk attitude. OL vocabulary doesn't resolve this; it treats preferences as given. If you define "regret" against an EU oracle, violating independence looks like regret. If you define it against a non-EU oracle, it doesn't. The coherence argument assumes the EU benchmark is the ground truth, which is the very thing being debated.

  **Verdict:** Your vocabulary isn't missing math; it's missing the normative leap. Coherence theorems prove exploitability under specific conditions (unbounded, frictionless, repeated). Fans claim this implies rationality requires EU maximization universally. That's an overclaim. The theorems show EU is the only strategy immune to specific adversarial exploits, not that it's the only "rational" goal.
