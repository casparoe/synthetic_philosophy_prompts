  *(Self-Correction during final review)*: I need to make sure I don't just say "Augustine says X." I need to apply it. The prompt asks: "Would Augustine count More as compliant or not?" I need to take a stance. Augustine would likely say compliant, because silence is not a signification. But the *intent to deceive* regarding malice is the tricky part. More intends them to think he is neutral, but he knows they think he is hostile. Actually, More *is* hostile to the Act. He isn't deceiving them about his conscience. He is deceiving them about his legal guilt. Augustine distinguishes between hiding the truth and asserting falsehood. More is hiding the truth of his conscience to avoid the legal consequence. Augustine allows hiding truth from those without a right to it. Does the King have a right to your conscience? Augustine would say no. So More is compliant. The tragedy is the State disagrees.

  Okay, ready to write.

