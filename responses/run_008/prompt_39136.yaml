answer: |-
  **Session Plan: Sor Juana Inés de la Cruz, *Respuesta a Sor Filotea***
  **Duration:** 50 minutes
  **Level:** Second-year Undergraduate
  **Module:** Philosophy Outside the Canon

  ### 1. Sequence and Rationale

  You cannot begin with the text itself. If you hand out the *Respuesta* immediately, students will read it as a biography or a plea for mercy. You must construct the philosophical scaffolding first so they know what they are looking for.

  **Step 1: The Definition Problem (5 minutes)**
  *   **Activity:** Put the phrase "Colonial Nun" on one side of the board and "Philosopher" on the other. Ask students to list the assumptions attached to each.
  *   **Rationale:** You must dismantle the "not really a philosopher" bias before engaging with the argument. If they view her primarily as a religious subject, they will read her theology as dogma rather than premise. You need to establish that doing philosophy within a theological framework was the norm, not an exception, in her context.
  *   **Goal:** Shift the category from "religious figure who wrote" to "thinker operating within a scholastic paradigm".

  **Step 2: The Occasion as Philosophical Constraint (10 minutes)**
  *   **Activity:** Briefly outline the Bishop's letter (Sor Filotea) not as gossip, but as a philosophical challenge. He argued: Study distracts from salvation; women are unfit for deep study; obedience supersedes intellect.
  *   **Rationale:** Students need to see the *Respuesta* as a rebuttal, not a manifesto. Her argument is constrained by the need to remain orthodox. This explains *why* she argues the way she does. Without this, her concessions look like weakness rather than strategic manoeuvring.
  *   **Goal:** Establish the stakes. She is not asking for permission; she is demonstrating that the Bishop's command contradicts divine law.

  **Step 3: Reconstructing the Core Argument (20 minutes)**
  *   **Activity:** Whiteboard reconstruction of the "Argument from Divine Gift" (see below). Do not read long passages; extract the propositions.
  *   **Rationale:** This is the heart of the session. You must show that her claim is universal ("Women *ought* to study"), not particular ("*I* want to study"). This moves the text from complaint to philosophy.
  *   **Goal:** Students see the logical structure independent of the emotional tone.

  **Step 4: Contextualising the Theology (10 minutes)**
  *   **Activity:** Explain that for Sor Juana, theology *is* the highest science. Reason is a tool given by God to understand God.
  *   **Rationale:** Prevents the "too pious to be a philosopher" error. If reason is God-given, suppressing it is a sin. This turns piety into a premise for intellectual freedom.
  *   **Goal:** Reframe piety as a philosophical commitment to rationality.

  **Step 5: Discussion and Closing (5 minutes)**
  *   **Activity:** Pose the closing question (see below).
  *   **Rationale:** Consolidate learning and assess comprehension.

  ### 2. The Core Case: The Argument from Divine Gift

  Do not use her life story as the case. Use her syllogism.

  **What it needs to have:**
  *   **Clear Premises:**
      1.  God creates nothing in vain.
      2.  God has bestowed intellectual faculties upon women (evident in observation).
      3.  To forbid the use of a God-given faculty is to contradict God's will.
  *   **A Clear Conclusion:** Therefore, forbidding women to study is contrary to divine law and reason.
  *   **Evidence of Strategy:** Show how she uses the Bishop's own authority (Scripture, Church Fathers) to undermine his conclusion.

  **What it needs to lack:**
  *   **Scholastic Jargon:** Do not burden them with terms like *formal distinction* or *transubstantiation*. It will distract from the logical form.
  *   **Modern Rights Language:** Ensure the reconstruction does not slip into "human rights" or "equality". Keep the language tied to "faculties", "gifts", and "duty". If you modernise the vocabulary, they will miss the historical philosophical work she is doing.

  ### 3. Misconceptions and Interventions

  You have identified three likely traps. Here is where to head them off, plus one additional trap you may not have anticipated.

  **Trap 1: "She is just a modern feminist in disguise." (Anachronism)**
  *   **Where it happens:** Step 3 (Reconstructing the Argument).
  *   **Intervention:** When a student says, "She's arguing for women's rights," correct them immediately. Say: "She is arguing for women's *duties* to God." Her goal is salvation and proper worship, not secular equality. If you let this slide, they will dismiss the text as 'not yet' modern philosophy.
  *   **Why:** You need them to see that philosophy can exist without liberal individualism.

  **Trap 2: "She's too religious to be doing real philosophy." (Secular Bias)**
  *   **Where it happens:** Step 1 (Definition Problem) and Step 4 (Theology).
  *   **Intervention:** Explicitly state: "In the 17th century, theology was the queen of the sciences. To argue within it *is* to do philosophy." Compare it to how we currently treat logic or physics as foundational.
  *   **Why:** Students from the "Buddhist logic/African philosophy" track may still hold a secular definition of philosophy. You must broaden their criteria for what counts as rational argumentation.

  **Trap 3: "This is just her personal struggle." (Biographical Reduction)**
  *   **Where it happens:** Step 2 (The Occasion).
  *   **Intervention:** When discussing the Bishop's letter, emphasise that he is addressing a general principle of female conduct, not just Sor Juana's behaviour. Therefore, her reply must address the general principle.
  *   **Why:** If they view this as autobiography, they will not analyse the argument's validity.

  **Trap 4: "She is simply obeying power." (The Victim Narrative)**
  *   **Where it happens:** Throughout, but specifically when discussing her concessions.
  *   **Intervention:** This is the hidden trap. Students often read her apologies ("I am ignorant," "I submit") as genuine weakness. Point out the irony. She uses humility tropes to deliver scathing logical critiques.
  *   **Why:** If they see her only as a victim, they miss her agency as a thinker. She is using the master's tools to dismantle the master's house.

  ### 4. Strategic Refusals

  You have 50 minutes. You must openly refuse to cover the following, and tell the students *why* you are excluding them.

  *   **Her Biography (The Court, The Viceroy, Her Death):**
      *   *Say this:* "We are not discussing her life story because we are analysing her argument, not her suffering. Her biography is context, not philosophy."
  *   **The Details of the Inquisition:**
      *   *Say this:* "We are not detailing the political machinery of the Inquisition. While relevant to history, focusing on it distracts from the internal logic of her text."
  *   **Comparison to Contemporary Secular Feminism:**
      *   *Say this:* "We will not judge her by 21st-century standards. Doing so prevents us from understanding how radical she was within her own system."
  *   **Scholastic Metaphysics:**
      *   *Say this:* "We are not learning Thomistic metaphysics today. We are looking at how she uses available premises to construct a valid conclusion."

  ### 5. The Closing Question

  Do not ask if they enjoyed the text. Do not ask if they agree with her. Ask a question that forces them to evaluate the relationship between her context and her argument.

  **The Question:**
  "If we strip away the theological premises—the references to God, sin, and divine will—does Sor Juana's argument for women's education collapse, or does it remain standing on secular grounds?"

  **Why this works:**
  *   If they say it **collapses**: They recognise that her philosophy is inextricably linked to her context (successful historical understanding).
  *   If they say it **stands**: They recognise the universal logical structure beneath the theology (successful philosophical analysis).
  *   If they say **"It doesn't matter because theology is wrong"**: They have failed to engage with philosophy outside the canon and reverted to secular bias (you will know you need to revisit the definition of philosophy in the next session).

  This question tests whether they see the *structure* of the argument or just the *content* of the era.
