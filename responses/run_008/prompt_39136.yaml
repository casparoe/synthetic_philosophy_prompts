prompt: |-
  I've been given a section to teach and I need some help planning it. The module is a second-year undergrad course called "philosophy outside the canon," and my 50-minute session is on Sor Juana Inés de la Cruz's case for women's education — the one she makes in her long reply to the bishop of Puebla who had told her, politely and at length, to give up secular study (the letter everyone refers to as the Respuesta a Sor Filotea). My students will show up knowing nothing about her, nothing about colonial Mexico, and nothing about scholastic theology. And they mostly signed up for this module to hear about Buddhist logic and African philosophy, so there's a decent number of them who'll be arriving thinking "colonial-era nun" means "not really a philosopher."

  Don't write the actual explanation for me — I want a teaching plan. Concretely: the order the pieces need to go in and why (what has to be in place before her argument can even register as an argument rather than as a complaint), the one example or case that should carry the whole session and what it needs to have and to lack, the misconceptions they'll bring in or form along the way and exactly where in the sequence I should head each one off, what I should openly refuse to get into at this level and say so out loud, and one question I can close with that would actually show me whether the idea landed rather than whether they just liked her.

  My own guesses at the misconceptions, for what they're worth: they'll either want to claim her as a straightforward modern feminist, full stop, or dismiss her as too pious to count as a real philosopher — and I suspect a third trap where they take her as describing her own personal struggle rather than making a general claim about women's intellects. But I've been wrong about what students do with a text before, so tell me if the real trap is somewhere else entirely. Also — odd request, but please answer in British English. The department style guide is strict about it and I got marked down last term for spellings.
