      *   The user is oscillating between *Evidentialism* (what does the data say?) and *Reliabilism* (how was the data generated?).
      *   They are also oscillating between *Individual Belief* (what do I think is true?) and *Institutional Norms* (what should we publish?).
      *   The friend's suggestion (Bayesian reader, Frequentist gatekeeper) is close but fails on Case 7 (priors shouldn't change based on whether they help/hurt if we are purely Bayesian).

  4.  **Develop a Unifying Framework:**
      *   *Candidate 1: Pure Likelihood/Bayesianism.* Fails Case 1, 3, 5. Stopping rules shouldn't matter, but the user thinks they do.
      *   *Candidate 2: Pure Frequentism.* Fails Case 2, 4. Priors shouldn't matter, but they do.
      *   *Candidate 3: Error Statistics (Mayo).* Focus on severe testing. Fits 1, 3, 5 well. Struggles with 2, 4, 7.
      *   *Candidate 4: Trust-Based Reliabilism (The "Credibility" Framework).* This seems to fit best. The user isn't judging the *data* in isolation; they are judging the *trustworthiness of the claim* given the process.
      *   *Refined Principle:* **The Principle of Auditable Trust.** Evidence is not just $P(Data|H)$; it is $P(Data|H, Process)$. We value processes that minimize the probability of false claims entering the literature, weighted by the prior plausibility of the claim.

      *   *Wait, let's look closer at the friend's suggestion:* "Bayesian as reader, Frequentist as gatekeeper."
          *   Does this solve Case 7? If I'm a Bayesian reader, I should accept enthusiastic priors *if* they are honest. But the user feels it's "cheating." Why? Because enthusiastic priors often mask bias.
          *   Actually, the deeper principle might be **Minimizing Motivated Reasoning in the Public Record.**
          *   Let's try to synthesize: **Contextual Evidentialism.** The value of evidence depends on the *risk of bias* in the generation process and the *prior probability* of the hypothesis.

      *   *Best Fit:* **The Severity Principle (Mayo) + Bayesian Priors.**
          *   Actually, a more modern synthesis is **The Credibility Framework (e.g., LeBel, Nosek, Simons).**
          *   Core Idea: Statistical metrics are proxies for *trust*.
          *   Let's propose: **The Principle of Constrained Inference.**
          *   *Definition:* Evidence is only as strong as the constraints placed on the researcher's degrees of freedom during data collection and analysis, adjusted by the prior plausibility of the hypothesis.
          *   *Why:* This explains why identical data (Case 1) are treated differently (constraints differed). It explains why Bayesian stopping is okay (Case 2) *if* the prior is fixed (constraint). It explains ESP (Case 4) (prior is low). It explains Multiple Comparisons (Case 5) (constraints on selection). It explains Exclusion Rules (Case 6) (constraints on analysis). It explains Case 7 (skeptical priors act as a constraint against wishful thinking).

  5.  **Evaluate the Verdicts against "Constrained Inference":**
      *   *1 (Stopping):* Consistent. B had fewer constraints.
      *   *2 (Bayes Stopping):* Consistent *if* the prior was fixed beforehand. If the prior was tuned to stop early, it's bad. User needs to clarify this.
      *   *3 (Replication):* Consistent. Constraints reduce false positives.
      *   *4 (ESP):* Consistent. Low prior requires higher evidence (more constraints or stronger likelihood).
      *   *5 (Multiple Comparisons):* Consistent. Selection is a degree of freedom.
      *   *6 (Exclusion):* **Inconsistent.** If the rule is valid, it shouldn't matter if it helps or hurts. *Verdict to drop:* The asymmetry. A rule is either justified by theory/data structure or it isn't.
      *   *7 (Priors):* **Inconsistent.** Priors should reflect knowledge, not virtue signaling. A "skeptical" prior is only good if it's accurate. An "enthusiastic" prior isn't cheating if justified. *Verdict to drop:* The moral judgment on the prior's direction. The judgment should be on the *justification* of the prior.

  6.  **Address the Meta-Analysis vs. Preregistered Study Dilemma:**
      *   *Scenario:* 10 small unpreregistered studies (Meta) vs. 1 big preregistered study. Same Total N. Same conclusion.
      *   *Frequentist View:* The big preregistered study controls Type I error better. The meta-analysis aggregates potential p-hacking.
      *   *Bayesian View:* If the 10 studies are independent and honest, the meta-analysis might be stronger (more data points, heterogeneity check). But if they are "file drawer" selected, it's garbage.
      *   *Constrained Inference View:* The single preregistered study has higher *trustworthiness per N*. The meta-analysis of unpreregistered studies suffers from unknown selection bias (publication bias, p-hacking within studies).
      *   *Gut Check:* User prefers the preregistered one.
      *   *Analysis:* Is this dumb? No. In social psych, unpreregistered small studies are highly susceptible to QRPs (Questionable Research Practices). A single large preregistered study is a "severe test."
      *   *Nuance:* If the 10 studies are *published and unpublished* (full registry), meta-analysis wins. If it's 10 *published* studies, the preregistered one wins.
      *   *Advice:* Stick with the gut, but refine the reason. It's not about N, it's about the *joint probability of bias*.

  7.  **Drafting the Response:**
      *   **Tone:** Empathetic, rigorous, peer-to-peer (PhD level). Avoid condescension. Acknowledge the messiness of the field.
      *   **Structure:**
          1.  Validate the confusion (it's a known philosophical rift).
          2.  Propose the Unifying Principle: **The Principle of Auditable Constraints.** (Evidence = Likelihood $\times$ Trust in Process $\times$ Prior).
          3.  Audit the 7 Verdicts: Which fit, which don't.
          4.  Identify the Verdicts to Drop (6 & 7 specifically).
          5.  Resolve the Meta-Analysis Dilemma.
          6.  Closing advice for the lab meeting.

      *   *Refining the Principle:* "Auditable Constraints" is good. Let's make it more precise. **The Reliability-Weighted Evidence Principle.**
      *   *Wait, let's look at Case 2 again.* Bayesian stopping rules. The Likelihood Principle says stopping rules don't matter. The user accepts this. But in Case 1, they reject it for Frequentist. This implies they accept the Likelihood Principle *only* when the inference method is Bayesian. This is technically consistent (different statistical frameworks have different assumptions). But the deeper principle is about *bias*. Optional stopping in Frequentist inflates False Positive Rate. Optional stopping in Bayesian (with fixed priors) does not inflate the False *Claim* Rate in the same way (though it can bias the magnitude).
      *   *Actually, the friend's "Bayesian Reader / Frequentist Gatekeeper" is actually quite strong if refined.* Let's call it **The Dual-Role Framework.**
      *   *Better:* **The Principle of Process-Dependent Evidential Value.** The evidential value of a statistic is not intrinsic; it is a function of the data *and* the protocol that generated it.
      *   *Let's go with "The Principle of Constrained Inference."* It captures the idea that data only supports a theory if the researcher was prevented from fitting the theory to the data.

      *   *Re-evaluating Case 6 & 7:*
          *   Case 6 (Exclusion): The asymmetry is definitely a bias (Outcome Bias). Needs to go.
          *   Case 7 (Priors): The asymmetry is also bias (Motivated Skepticism). Needs to go. Priors must be justified, not virtuous.

      *   *Re-evaluating the Meta-Analysis:*
          *   If the 10 studies are unpreregistered, they likely suffer from "winner's curse" (only significant ones published).
          *   The 1 big prereg study is a severe test.
          *   Verdict: The gut is right, *provided* the meta-analysis isn't a comprehensive registry of *all* conducted studies.

  8.  **Final Polish:**
      *   Ensure the distinction between *Epistemic* (what is true) and *Social* (what we publish) is clear.
      *   Make sure the advice is actionable for a lab meeting.

      *(Self-Correction during drafting)*: I need to be careful not to just say "Bayesianism is right." Social psych is largely frequentist in infrastructure. The user needs a principle that works *within* the current system while acknowledging Bayesian truths. The "Constrained Inference" principle bridges this. It explains why we care about preregistration (constraints) without denying that data is data.

      *Wait, one more thing on Case 2:* Bayesian optional stopping *does* matter if you care about calibration or decision theory, even if the Likelihood Principle says it doesn't for belief updating. But for the user's purpose, accepting Case 2 is fine *if* they acknowledge the prior was fixed. I will note this caveat.

      *Final Plan:*
      1. Name the principle: **The Principle of Constrained Inference.**
      2. Explain it: Data supports theory only to the extent that the researcher was prevented from accommodating the theory to the data.
      3. Audit the cases.
      4. Flag 6 & 7 as inconsistencies to drop.
      5. Solve the Meta-Analysis problem.
