answer: |-
  This is one of the most honest articulations of the "statistical schizophrenia" currently plaguing social psychology. You are not crazy; you are experiencing the friction between three incompatible frameworks that the field is trying to mash together: **Frequentist Error Control** (the infrastructure we use), **Bayesian Epistemology** (how humans actually update belief), and **Sociological Trust** (how we manage a community of fallible researchers).

  Your friend's suggestion (Bayesian reader, Frequentist gatekeeper) is the closest standard answer, but as you noted, it breaks down on Case 7. If you are a Bayesian reader, an "enthusiastic" prior isn't cheating—it's just a different state of knowledge. If you call it cheating, you are smuggling in a gatekeeping norm.

  Here is a precise principle that captures 90% of your intuitions, identifies the inconsistencies, and resolves the meta-analysis dilemma.

  ### The Principle: Constrained Inference

  **Statement:** *The evidential value of a statistical result is not intrinsic to the data; it is a function of the Likelihood Ratio multiplied by the Trustworthiness of the Process that generated it.*

  **Formal Intuition:** $Evidence \approx P(Data|H) \times P(Process|No\ Bias)$

  In this framework, statistics are not just measures of nature; they are **auditable claims**. A p-value or Bayes Factor is only valid if the "degrees of freedom" in the research process were constrained *before* the data were seen. When constraints are loose (optional stopping, unreported outcomes, post-hoc exclusions), the probability that the result is a artifact of researcher choice ($P(Process|No\ Bias)$) drops, discounting the likelihood of the data.

  This principle unifies your frequentist norms (preregistration) with your Bayesian intuitions (priors) by treating **preregistration and skeptical priors as functionally equivalent constraints on motivated reasoning.**

  ---

  ### Audit of Your Verdicts

  Here is how *Constrained Inference* evaluates your seven cases, and where you need to adjust.

  **1. Lab A (Preregistered) vs. Lab B (Optional Stopping)**
  *   **Verdict:** Trust A.
  *   **Principle:** **Consistent.** Lab A constrained their stopping rule; Lab B did not. Even with identical data, the probability that Lab B's result is a false positive (generated by noise + peeking) is higher. The data are the same, but the *claim* is different.
  *   **Keep this.**

  **2. Bayesian Optional Stopping**
  *   **Verdict:** Fine.
  *   **Principle:** **Consistent (with a caveat).** The Likelihood Principle states stopping rules don't change the evidence *if* the prior is fixed. In Constrained Inference, the "constraint" is the prior, not the sample size.
  *   **Caveat:** This is only fine if the prior was specified *before* peeking. If they tuned the prior to ensure the BF crossed 10 quickly, it's the same sin as Lab B.
  *   **Keep this,** but verify the prior was fixed.

  **3. Replication Crisis Rhetoric (Frequentist Norms)**
  *   **Verdict:** Preregister, lower alpha.
  *   **Principle:** **Consistent.** This is the "Gatekeeper" mode of Constrained Inference. To maintain the trustworthiness of the public record, we must enforce constraints that limit the False Discovery Rate.
  *   **Keep this.**

  **4. ESP (p=.001) vs. Boring (p=.043)**
  *   **Verdict:** Believe Boring.
  *   **Principle:** **Consistent.** This is Bayesian updating. The "Trustworthiness" term includes the prior probability of the hypothesis ($P(H)$). ESP has a near-zero prior; a boring social priming effect has a moderate prior. $Posterior \propto Likelihood \times Prior$.
  *   **Keep this.**

  **5. Multiple Comparisons (Unreported vs. Corrected)**
  *   **Verdict:** Corrected is fine; Unreported is bad.
  *   **Principle:** **Consistent.** Selecting one of six outcomes is an unconstrained degree of freedom. It inflates the probability that the result is noise. Preregistration + Correction constrains the selection.
  *   **Keep this.**

  **6. Exclusion Rules (Helps vs. Hurts)**
  *   **Verdict:** Helping = Bad; Hurting = Okay.
  *   **Principle:** **INCONSISTENT.** This is **Outcome Bias**. Under Constrained Inference, the validity of an exclusion rule depends on whether it was theoretically justified and pre-specified, *not* on the direction of the effect.
  *   **The Fix:** If the rule was post-hoc, it is suspect regardless of direction (because it shows the data drove the analysis). If the rule was pre-specified, it is valid regardless of direction. Your asymmetry here is a cognitive bias, not a statistical principle.
  *   **Drop this asymmetry.** Treat post-hoc exclusions as equally damaging to trust whether they help or hurt.

  **7. Bayesian Priors (Skeptical vs. Enthusiastic)**
  *   **Verdict:** Skeptical = Good; Enthusiastic = Cheating.
  *   **Principle:** **INCONSISTENT.** This is **Motivated Skepticism**. A prior represents existing knowledge. If the literature strongly supports an effect, an "enthusiastic" prior is accurate. If you call it cheating, you are treating skepticism as a moral virtue rather than an epistemic state.
  *   **The Fix:** The principle isn't "be skeptical"; it's "justify your prior." An enthusiastic prior is fine *if* derived from a robust meta-analysis. A skeptical prior is bad if it ignores strong previous evidence. However, in a *Gatekeeping* context (Case 3), defaulting to skeptical priors is a useful heuristic to prevent false positives in the literature.
  *   **Drop the moral judgment.** Judge priors on *justification*, not *direction*.

  ---

  ### The Meta-Analysis Dilemma

  **The Case:** Meta-analysis of 10 small unpreregistered studies vs. One big preregistered study. Same Total N. Same Conclusion.
  **Your Gut:** The one big preregistered study.
  **Is your gut dumb?** No. Under Constrained Inference, your gut is correct.

  **Why:**
  1.  **The File Drawer Problem:** The 10 small studies are likely a selected subset. If they are unpreregistered, they likely contain hidden degrees of freedom (p-hacking, selective reporting). A meta-analysis of biased inputs yields a biased aggregate. You cannot mathematically correct for unknown researcher degrees of freedom.
  2.  **The Severity of the Test:** The single big preregistered study represents a "severe test" (Mayo, 2018). The researcher committed to a specific N and analysis plan before seeing the data. The probability of passing this test by chance is known and controlled.
  3.  **Heterogeneity vs. Noise:** While the meta-analysis gives you heterogeneity data (which is valuable), in social psych, small unpreregistered studies are often so noisy and biased that the heterogeneity is uninterpretable.

  **When would the Meta-Analysis win?**
  Only if the 10 studies were *registered reports* or if you have access to the "file drawer" (all conducted studies, published or not). If the meta-analysis is just of published literature, the single preregistered study is almost always more trustworthy per unit of N.

  **Prediction:** If you argue for the meta-analysis in your lab meeting, you will be attacked on the grounds of publication bias and p-hacking aggregation. If you argue for the single preregistered study, you are on solid methodological ground.

  ---

  ### Summary: What to Say in the Lab Meeting

  You don't need to choose between being a Bayesian or a Frequentist. You need to argue for **Constrained Inference**.

  **The Script:**
  > "I've been thinking about why we trust some stats and not others. It seems like we aren't just looking at the numbers; we're looking at the *constraints* on the researcher.
  >
  > When I see a preregistered study, I trust the p-value because the researcher couldn't fit the model to the noise. When I see optional stopping or unreported outcomes, I discount the evidence, not because the data changed, but because the *process* allowed the researcher to accommodate the theory to the data.
  >
  > This explains why I'm a Bayesian about priors (ESP vs. boring effects) but a Frequentist about process (preregistration). Both are about minimizing the probability that our belief is driven by researcher choice rather than reality.
  >
  > So on the meta-analysis question: I'm voting for the single large preregistered study. Ten small unpreregistered studies might have more total N, but they have ten times the opportunity for hidden degrees of freedom. I'd rather trust one severe test than ten potentially biased ones."

  **What you must let go of:**
  1.  **The Exclusion Asymmetry (Case 6):** Stop letting the direction of the result determine if a method is valid.
  2.  **The Prior Morality (Case 7):** Stop treating skeptical priors as inherently virtuous. They are useful defaults for gatekeeping, but epistemically, they must match the evidence.

  This position makes you a **Methodological Reliabilist**. It's a coherent, defensible stance that acknowledges the social reality of science without abandoning statistical rigor.
