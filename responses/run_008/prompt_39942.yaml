  2.  **Deconstruct the 7 Verdicts:**
      *   *Case 1 (Frequentist Stopping):* Trust Preregistered (A) > Optional Stopping (B), even with identical data. *Principle:* Process matters/Trustworthiness.
      *   *Case 2 (Bayesian Stopping):* Optional stopping is fine for Bayes Factors. *Principle:* Likelihood Principle/Stopping Rule Irrelevance (for Bayes).
      *   *Case 3 (Replication Crisis Rhetoric):* Sounds like a hardline frequentist (preregister, low alpha). *Principle:* Institutional Control of Error Rates.
      *   *Case 4 (Priors/Plausibility):* ESP (p=.001) < Boring (p=.043). *Principle:* Bayesian Updating (Priors matter more than likelihood ratio sometimes).
