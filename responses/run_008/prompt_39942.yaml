      *   *Case 6 (Exclusion Rules):* Helping (bad) > Hurting (okay). *Principle:* Bias Direction (Confirmation Bias).
      *   *Case 7 (Bayesian Priors):* Skeptical priors (good) > Enthusiastic priors (bad). *Principle:* Conservatism/Skepticism as a virtue.

