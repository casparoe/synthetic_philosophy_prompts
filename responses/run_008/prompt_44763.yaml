answer: |-
  The tension you identify lies at the intersection of legal ontology and biological metaphysics. Conservation law requires stable objects to regulate, while evolutionary biology describes a world of fluid processes. To answer your questions, we must dissect the operational metaphysics of statutes like the Endangered Species Act (ESA) and then imagine a jurisprudence decoupled from taxonomic reification.

  ### 1. The Implicit Metaphysics: Operational Realism

  Does conservation law require species to be mind-independent natural kinds? Strictly speaking, **no**. However, it functions *as if* they are.

  The legal practice presupposes what we might call **Operational Realism**. It does not commit to a specific metaphysical account of species (e.g., that they are individuals, classes, or homeostatic property clusters). Instead, it commits to the **epistemic stability** of species designations.

  *   **The Presupposition of Discreteness:** The law presupposes that the biological world can be carved into discrete, identifiable units that persist through time. Even if biologists view speciation as a continuum, the law requires a binary switch (Listed/Not Listed). This implies a metaphysics of **boundedness**: there must be a "fact of the matter" sufficient to draw a line, even if that line is pragmatic rather than essential.
  *   **The Presupposition of Authority:** The law presupposes that there exists an epistemic community (taxonomists) capable of accessing these boundaries. It treats taxonomic consensus as a proxy for ontological truth. When the American Ornithological Society splits a species, the ESA follows. The law treats the *scientific verdict* as constitutive of the *legal object*.

  Therefore, the law does not require species to be mind-independent entities in a Platonic or Aristotelian sense. It requires them to be **Institutional Facts** (in the sense of John Searle). A "listed species" is a status function imposed on a biological population by collective intentionality (the scientific and legal communities). The biological population is the "brute fact," but the "Endangered Species" is an institutional fact that depends on human agreement for its existence.

  ### 2. Presupposition vs. Tolerance

  We must distinguish what the legal regime *needs* to function from what it merely *accommodates*.

  **What the Practice Strictly Presupposes:**
  1.  **Identifiability:** There must be criteria (diagnosability, genetic distance, reproductive isolation) that allow enforcement agents (rangers, customs officers) to distinguish protected units from unprotected ones in the field. If species boundaries were truly unknowable, the law would be void for vagueness.
  2.  **Persistence:** The unit must remain stable enough for the administrative process to complete. If a population evolved or was reclassified faster than the rulemaking process, the law would chase a moving target.
  3.  **Correlation with Vulnerability:** The law presupposes that the taxonomic unit correlates with extinction risk. It assumes that losing a "species" is a distinct moral/biological harm compared to losing a random subset of organisms.

  **What the Practice Merely Tolerates:**
  1.  **Conceptual Pluralism:** The ESA does not mandate the Biological Species Concept (BSC) over the Phylogenetic Species Concept (PSC). It tolerates whichever concept the relevant scientific authority adopts at the time. It is metaphysically agnostic regarding *why* a group is a species, provided they agree *that* it is.
  2.  **Revision (Splitting/Lumping):** The law tolerates ontological instability. A population can be "real" one day and "non-existent" (lumped into another) the next. The law handles this through administrative amendment, treating the change as a correction of error rather than a change in reality.
  3.  **Sub-Specific Units:** By allowing "Distinct Population Segments" (DPS) or subspecies, the law tolerates the idea that the "species" category is not the only locus of value. This implicitly admits that the species concept is not the sole carrier of conservation worth.

  ### 3. The Problem of Reification

  The current system creates a **performative contradiction**. By attaching legal consequences to taxonomic names, the law incentivizes "taxonomic inflation." Conservationists may push to split widespread species into micro-endemics to trigger protections, while developers may push to lump them to reduce restrictions.

  This reveals that the current regime is not neutral. By hardening taxonomic hypotheses into legal rights, it **reifies** the species concept. It forces biology to be more discrete than it is. It treats the *map* (taxonomy) as the *territory* (biodiversity).

  ### 4. A Legal Regime for "No Fact of the Matter"

  If we take seriously the possibility that species boundaries are arbitrary, fuzzy, or non-existent (the "no fact of the matter" view), a legal regime would need to shift from protecting **Named Units** to protecting **Evolutionary Processes and Genetic Diversity**.

  Here is what a "Post-Taxonomic" Conservation Law would look like:

  **A. Protection of Lineages, Not Ranks**
  Instead of listing *Ursus arctos horribilis* (Grizzly Bear), the law would protect **Evolutionarily Significant Units (ESUs)** defined by continuous metrics of genetic distinctiveness and ecological function, without requiring them to hold a specific Linnaean rank.
  *   *Mechanism:* Protection triggers based on a "Distinctiveness Index" (genetic divergence + ecological role) and a "Vulnerability Index" (population trend + habitat fragmentation).
  *   *Metaphysical Shift:* This acknowledges that biodiversity is a continuum. A population with 90% distinctiveness gets 90% of the protection of a "full species," removing the binary cliff-edge of current listing.

  **B. Habitat and Process-Based Statutes**
  If the actors (species) are ill-defined, protect the stage (ecosystem) and the script (evolutionary process).
  *   *Mechanism:* An "Endangered Ecosystems Act" would protect areas based on their capacity to generate and maintain biodiversity (evolutionary potential) rather than the presence of specific listed taxa.
  *   *Metaphysical Shift:* This treats species as ephemeral outputs of a system that is the true object of value. It aligns with the view that species are transient slices of continuous lineages.

  **C. Genetic Diversity Trusts**
  The law could treat genetic diversity as a public trust resource, similar to water or air.
  *   *Mechanism:* Any development that reduces the total genetic diversity of a regional gene pool below a certain threshold is prohibited, regardless of whether the lost alleles belong to a "named" species.
  *   *Metaphysical Shift:* This moves conservation from a **typological** metaphysics (preserving ideal types) to a **population-genetic** metaphysics (preserving variation).

  **D. Administrative Decoupling**
  To prevent taxonomic gaming, the legal definition of a protectable unit would be statutorily defined (e.g., "any population reproductively isolated for X generations" or "any monophyletic group with Y support") rather than delegated to external taxonomic committees.
  *   *Metaphysical Shift:* This admits that the boundary is a **policy decision**, not a scientific discovery. It makes the conventionality explicit. The law would say, "We define a protectable unit as X for the purpose of this Act," acknowledging that this is a legal construct imposed on biology, not a reflection of nature's joints.

  ### Conclusion

  Current conservation law presupposes a **pragmatic essentialism**. It does not require species to be mind-independent natural kinds, but it requires them to be *treatable* as such for the sake of enforcement. It tolerates biological fluidity only insofar as it can be processed administratively.

  A regime that took the "no fact of the matter" thesis seriously would abandon the noun ("Species") for the verb ("Speciating"). It would protect the **capacity for divergence** and the **substrate of variation** rather than the temporary morphological snapshots taxonomists name. This would require a legal system comfortable with gradients and probabilities rather than binaries and names—a difficult shift for jurisprudence, but a more faithful alignment with evolutionary theory.
