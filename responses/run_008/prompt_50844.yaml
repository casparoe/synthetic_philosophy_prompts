      *   **Tone:** Critical, rigorous, "don't go easy on me," philosophical/physics savvy.

  2.  **Deconstruct the User's Six Points:**
      *   (1) *Ontology:* MWI is true via Occam's Razor (no collapse).
      *   (2) *Epistemology:* Probability = Self-Locating Uncertainty (SLU) about which future branch "I" am.
      *   (3) *Derivation:* Decision Theory (Deutsch-Wallace) derives Born weights from rationality axioms.
      *   (4) *Anthropics:* Typicality (I should expect to be a typical observer).
