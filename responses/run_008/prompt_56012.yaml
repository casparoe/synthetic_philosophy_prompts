prompt: |-
  I've been reading about Buddhist ethics and one thing that keeps striking me is how the tradition locates moral weight in the intention behind an act rather than the outcome — karma is basically described as intention itself, not the deed's results. That sets up a weird tension with consequentialism that I'd like you to build a case around for me, because I can't figure out how to make the tension sharp without cheating.

  Here's the spec: construct a scenario (realistic, everyday — a workplace, a family, a hospital, nothing trolley-adjacent) in which an agent faces two options. Option A produces clearly better consequences for everyone else but can only be performed with what a Buddhist would call a defiled intention — say it's only available by acting from resentment, or self-dealing dressed up as kindness, something the agent can't just talk themselves out of. Option B produces noticeably worse consequences but is performed from a genuinely pure, compassionate mental state. Make it so the Buddhist ought to pick B and the act consequentialist obviously picks A — and crucially, the divergence must come from the intention/outcome asymmetry itself, not from the agent following a rigid precept (no lying or killing rules doing the work), and not from some long-run karmic payback story where the universe eventually rewards the pure-hearted choice. One paragraph for the scenario.

  After the scenario, walk through the reasoning on both sides: why the consequentialist picks A, why the Buddhist framework (as best you understand it — karma as cetanā, the priority of purifying one's own mind, compassion toward all beings including oneself) picks B. Then tell me which feature of the case is doing the work, what happens to the dilemma if you remove it, and — this is the part I most want — how a sophisticated consequentialist would push back (maybe two-level reasoning, maybe valuing the agent's own mental states as consequences), and how a Buddhist might try to escape the dilemma entirely, perhaps through skillful means or the possibility that a sufficiently advanced agent could perform A with a purified mind. Also flag honestly where the case is at its weakest — I suspect it leans on the assumption that intentions can't be changed on demand, and I want to know if you agree or if theres a better weak point.
