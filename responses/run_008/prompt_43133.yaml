  Ruth's estate analogy is legally precarious and likely to collapse under cross-examination from a competent opponent like Voelker. In probate law, the protection of heirs is paramount: an heir is never personally liable for the decedent's debts beyond the value of the assets they actually receive, and they have the absolute right to disclaim the inheritance entirely to avoid any encumbrance. By invoking probate, Ruth inadvertently invites Voelker to ask if citizens can "disclaim" their citizenship to avoid the debt, or why taxpayers are being asked to pay from personal income rather than just distributing existing city assets. The analogy fails because it treats a moral claim as a liquidated debt and ignores the limited liability shield that is the core feature of inheritance law. If Ruth uses this in the climax, she risks looking like she doesn't understand the limits of her own trade.

  The bond analogy is significantly more robust because it shifts the focus from individual fault to institutional continuity. It successfully argues that obligations can attach to a collective body regardless of the birthdates of its current members. However, it still requires repair because bonds are voluntary contractual instruments, whereas reparations are being argued as involuntary equitable remedies. To make this survive, Ruth must concede that this isn't a contract but a recognition of unjust enrichment held by the corporate body. The bond analogy proves the *capacity* to owe across time, but not the *source* of the obligation.

  For the climactic scene, Ruth should abandon the probate analogy entirely and pivot to a **Special Assessment** analogy, which is firmly within municipal law and fits her role as a public-facing attorney. When a city installs sewers or paves a street, it levies a special assessment on the properties that benefit, regardless of whether the current owner ordered the work or was even alive when the project began. The obligation runs with the land, not the person, based on the benefit received. This allows Ruth to argue that the city's wealth and infrastructure are the "property" improved by unpaid labor, and the current beneficiaries hold that property subject to the assessment. It bypasses the "I didn't sign anything" objection by grounding the debt in the *benefit* retained by the asset, not the consent of the owner, and it avoids the probate trap of personal liability versus estate assets. This keeps her plausible as a lawyer who knows the difference between administering dead people's money and managing municipal obligations.
