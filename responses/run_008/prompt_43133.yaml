prompt: |-
  I'm a novelist drafting a novel set in a Midwestern city in the middle of a municipal reparations debate, and I want the argument scenes to hold up to scrutiny. My central character, Ruth, is a probate attorney who has spent thirty years administering estates, and she's become the public face of the pro-reparations side by leaning on an analogy drawn from her own trade: an inheritance, she says, is never just the assets — it's the assets subject to the decedent's debts, and the executor must satisfy the liens before anyone takes a distribution. Her claim is that the beneficiaries of a historical atrocity, like the beneficiaries of an estate, receive what they receive encumbered: the wealth and infrastructure that flowed from slavery and its aftermath came with a charge attached, and calling in that charge is not punishing the heirs but completing the probate. Her opponent on the council, Voelker, presses the standard objection — no one alive signed anything, the account is closed — and Ruth has a second analogy ready for him: Treasury bonds. Nobody thinks a taxpayer born in 1990 is personally culpable for the national debt, yet we all accept that the corporate body she belongs to must service bonds issued in 1945; continuity of the collectivity, not individual fault, is what carries the obligation.

  I want an audit of both analogies, since I refuse to let either character be a strawman. For the estate analogy, attend to the parts of probate Ruth is conveniently leaving out: an heir can disclaim an inheritance entirely and walk away clean, an estate's debts are fixed, liquidated, and owed to identified creditors with documentation, and heirs are never personally liable beyond what they actually took. Ask which of those features have genuine counterparts in the reparations case — is there anything like a disclaimer of the benefits of citizenship, or of inherited positional advantage? — and which disanalogies are load-bearing for Voelker's side versus merely incidental. For the bond analogy, note that the taxpayer's obligation is artificially manufactured by statute and court enforcement, that bondholders are identifiable contract parties, and that the analogy may prove only that collectivities can bear obligations, not which ones or of what kind. Tell me whether Ruth's conclusion survives once the disanalogies are on the table, or whether the analogies were carrying her all along — and, if they were, what a better analogy for her to deploy in the climactic council scene would be, one that keeps her plausible as a lawyer.

  Please structure the core of your answer as a table with these columns: "Source-domain element" (the specific probate or bond feature); "Proposed counterpart in the reparations debate"; "Mapping status" (holds / strains / breaks); "Reason" (one sentence); and "Bearing on the argument" (supports Ruth / supports Voelker / neutral). Follow it with a JSON object with four fields — "strongest_disanalogy" (a string naming the single feature that does the most damage to Ruth's case), "strongest_point_of_contact" (where the mapping genuinely holds), "verdict_for_estate_analogy" and "verdict_for_bond_analogy" (each one of: survives / survives with repair / fails) — and then a few paragraphs of prose developing the verdict and the replacement analogy. No citations or reading lists; I want the reasoning itself.
