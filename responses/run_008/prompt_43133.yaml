      *   *Decision:* **Constructive Trust** is the most legally precise for "holding wealth gained by wrong." But **Cloud on Title** is more accessible for a council meeting. Let's go with **Constructive Trust** because Ruth is a lawyer speaking to a council (might appreciate precision) or **Unjust Enrichment**. Actually, the prompt asks for a *better analogy*. A "Constructive Trust" is a legal doctrine, not really an analogy. An analogy would be "like a easement" or "like a lien."
