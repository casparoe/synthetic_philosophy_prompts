  2.  **Deconstruct Ruth's Estate Analogy:**
      *   *Claim:* Wealth passed down is encumbered by historical debts (slavery/segregation).
      *   *Probate Reality:*
          *   Debts must be liquidated/fixed. *Reparations Reality:* The "debt" is contested, unliquidated, and diffuse.
