      *   *Refinement:* The prompt asks for an analogy. "Stolen Car" is a classic. But maybe something more municipal. **Special Assessment Districts.** When a city puts in sewers, they charge the properties that benefit, even if the current owner didn't order the sewers. This fits the "infrastructure" angle perfectly. It's municipal law, fits her role as public face, and addresses the "I didn't sign for this" objection.
