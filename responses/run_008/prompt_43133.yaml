      *   *Selection:* **Constructive Trust / Unjust Enrichment.** It shifts from "debt" (contract/probate) to "equitable remedy" (wrongful holding). It acknowledges no contract existed but asserts equity demands restoration. It fits a lawyer who knows probate *and* equity.
