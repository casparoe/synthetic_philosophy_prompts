prompt: |-
  I write novels, and they tend to be set in small places, which means over the years I've built up a private ledger of when shared things get wrecked and when they mysteriously arent, and I'd love to know whether there's one actual principle behind my verdicts or whether I'm just pattern-matching on vibes.

  The cases, with my calls:

  - The strip fields behind the village I grew up in were grazed in common for something like four hundred years and, as far as anyone can tell, never collapsed. Whatever went on there, it wasnt a tragedy waiting to happen — it worked.
  - The biscuit table at my old publishing house: restocked monday, stripped by tuesday, fridge permanently feral. Wrecked, every single time.
  - On my allotment site the communal hosepipe got nicked within a month of appearing. The communal wheelbarrow, which I swear is older than me, has outlasted every hosepipe and shows no sign of dying. Wrecked and not-wrecked, by the exact same crowd.
  - Six of my friends have shared a holiday cottage for twenty years and its pristine — better kept than most of our actual houses. The same six friends reduced a shared sailing dinghy to a mouldering hull in five summers. I cannot reconcile these two at all.
  - The book-swap shelf at my station, run entirely on strangers leaving and taking paperbacks, has worked for years and I've never once seen it empty or abused.
  - The atmosphere, obviously, but that one feels too big to learn anything from.

  My working theory for ages was the "will you meet them again" one: shared stuff survives when the users all know each other and have to show their faces tomorrow. The cottage fits, the old commons fit, the biscuit table fits. But the dinghy is the same six faces as the cottage, and the station shelf works on total anonymity, so the theory is dead and I dont have a replacement.

  Also this is practical, not idle: I'm two thirds through a novel set in a fishing village. Fourteen boats, everyone knows everyone going back generations, the fish are getting scarcer but you cant see the stock the way you can see a hedge, and one skipper has quietly put a bigger engine in. My editor says a village that tight would never let the fishery collapse — some elder-statesman type would sort everyone out. I have my doubts, but she's usually right about human nature, and the book needs to go the way things actually go, not the way my sentiment wants.

  So: is there a principle, or a couple of clauses, that fits all six of my verdicts? Which of them, if any, does it have to throw out? And what does it predict for my village — do they wreck the fishery or not, and would a harbour association with actual fines be a realistic save, or would that just be me smuggling in a happy ending?

  Keep it under 500 words please — I know you could write a dissertation on this, but I mainly need the working end of it.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** A novelist writing a book set in a fishing village.
      *   **Problem:** Trying to determine if there's a consistent principle behind why some shared resources survive ("not wrecked") and others fail ("wrecked"), based on six specific cases provided.
      *   **Current Theory:** "Will you meet them again?" (Repeated interaction/reputation) -> Disproven by the dinghy (same people as cottage) and station shelf (anonymity).
      *   **Specific Question:** Is there a principle/clause fitting all six cases? Which ones (if any) must be thrown out? What does it predict for the fishing village (collapse or not)? Would a harbour association with fines be realistic or a happy ending?
      *   **Constraint:** Keep it under 500 words.

  2.  **Analyze the Cases:**
      1.  *Strip fields (400 years):* Survived. Community, long-term, visible limits?
      2.  *Biscuit table (Publishing house):* Wrecked. Transient users? Low stakes? High turnover?
      3.  *Allotment (Hose vs. Wheelbarrow):* Hose nicked (wrecked), Wheelbarrow survived (not wrecked). Same crowd. Difference? Hose is portable/consumable-adjacent. Wheelbarrow is bulky/identifiable/community tool.
      4.  *Friends (Cottage vs. Dinghy):* Cottage pristine (not wrecked), Dinghy mouldering (wrecked). Same people. Difference? Cottage is living space (high value, immediate comfort). Dinghy is maintenance-heavy, exposed to elements, "someone else's problem" until needed.
      5.  *Book-swap shelf (Station):* Survived. Anonymity. Low value items? Social norm signaling?
      6.  *Atmosphere:* Discarded as too big.

  3.  **Identify the Underlying Principle:**
      *   The "Tragedy of the Commons" isn't inevitable. Elinor Ostrom's work is the key here.
      *   Why did the dinghy fail but the cottage succeed? *Excludability* and *Maintenance Visibility*.
      *   Why did the hose fail but the wheelbarrow succeed? *Portability* vs. *Identifiability*.
      *   Why did the book shelf work? *Low stakes* and *Social Signaling*.
      *   Why did the strip fields work? *Clear boundaries* and *Community Enforcement*.
      *   Why did the biscuits fail? *High turnover* + *Low cost of defection*.

      *   *Core Principle:* Shared resources survive when **defection is visible** and **maintenance costs are shared/fair**, not just when people know each other.
      *   *Refinement:* It's about **monitoring costs** and **asset specificity**.
      *   *Better Principle:* **Ostrom's Design Principles** (simplified). Specifically: Clear boundaries, proportional equivalence between benefits and costs, and graduated sanctions.
      *   *Alternative Theory:* **Rivalry vs. Excludability**.
          *   Cottage: Non-rival (mostly) until crowded, easy to monitor damage.
          *   Dinghy: High maintenance, damage hidden (under water/mould), hard to assign blame.
          *   Hose: Easy to steal (excludable).
          *   Wheelbarrow: Hard to steal (visible).
          *   Books: Low value, social gift.
          *   Fields: Clear boundaries, long-term monitoring.

      *   *Synthesizing for the User:* The principle isn't just "knowing people." It's **Accountability + Asset Nature**.
      *   *Key Distinction:* Is the damage *immediately visible* and *assignable*?
          *   Cottage: Mess is visible immediately.
          *   Dinghy: Neglect (mould/rot) is slow, invisible until failure.
          *   Hose: Theft is instant.
          *   Wheelbarrow: Too big to steal.
          *   Books: Low value, social contract.
          *   Fields: Visible overgrazing.
          *   Biscuits: Consumption is instant, restocking is delayed.

      *   *Revised Principle:* **Visibility of Depletion + Ease of Enforcement.**
      *   If I take a biscuit, you don't know who. If I leave the cottage dirty, you know immediately. If I neglect the dinghy, rot sets in slowly (diffused responsibility).
      *   *Fishery:* Fish stocks are *invisible* (user noted: "cant see the stock the way you can see a hedge"). This is the crucial clue.

  4.  **Drafting the Response:**
      *   Acknowledge Ostrom (Nobel prize for this exact thing).
      *   Principle: **Visibility of Depletion** and **Assignability of Blame**.
      *   Apply to cases:
          *   Cottage: Mess is visible/blamable.
          *   Dinghy: Neglect is slow/ambiguous (who forgot to cover it?).
          *   Hose: Portable (easy theft). Wheelbarrow: Visible (hard theft).
          *   Books: Low stakes/social signal.
          *   Fields: Visible boundaries.
          *   Biscuits: Anonymous consumption.
      *   Apply to Novel:
          *   Fish are invisible. One engine is hard to spot as "cheating" compared to visible overgrazing.
          *   Editor is wrong if she assumes visibility.
          *   Fines/Association: Realistic *if* enforcement is internal (community policing), not external.

  5.  **Refining for Word Count & Tone:**
      *   Tone: Practical, writer-to-writer.
      *   Constraint: < 500 words.
      *   Cut the academic jargon. Focus on the "Visibility" angle.

      *   *Drafting thought:* The key difference between the cottage and the dinghy is *maintenance ambiguity*. Who cleans the cottage? Everyone knows. Who maintains the dinghy? Everyone assumes someone else did. The fishery is like the dinghy, not the cottage. The stock is invisible.

      *   *Principle:* **The Clarity of Cause and Effect.**
      *   If damage is immediate and attributable, norms hold. If damage is slow, invisible, or diffused, norms fail.
      *   *Prediction:* The fishery collapses unless the "cheat" becomes visible (e.g., huge catch vs. others).
      *   *Harbour Association:* Only works if fines are enforced by peers, not outsiders.

  6.  **Final Polish (checking word count):**
      *   Start with the principle.
      *   Explain the cases briefly.
      *   Address the novel.
      *   Address the editor.

      *   *Self-Correction on Principle:* It's specifically **Ostrom's Conditions** simplified. 1. Clear boundaries. 2. Monitoring. 3. Graduated Sanctions.
      *   But the user's specific puzzle (Cottage vs Dinghy) is about **Maintenance Ambiguity**.
      *   Let's combine: **Visibility of Harm + Clarity of Responsibility.**

      *   *Word Count Check:* Keep it tight.

      *   *Final Plan:*
          1.  Name the principle (Ostrom's Visibility/Accountability).
          2.  Resolve the Dinghy/Cottage paradox (Maintenance Ambiguity).
          3.  Resolve the Hose/Barrow paradox (Portability).
          4.  Apply to Fishery (Invisibility = Collapse risk).
          5.  Verdict on Editor/Fines.

      *   *Drafting:*
          You're stumbling onto Elinor Ostrom's work (Nobel Prize, 2009). She proved commons don't always fail. Your principle isn't "knowing people," it's **Visibility of Harm** and **Clarity of Responsibility**.

          Cases resolved:
          1.  **Cottage vs. Dinghy:** In the cottage, mess is immediate and attributable (you know who left dishes). On the dinghy, neglect is slow and diffused (who forgot to cover it? who didn't bail?). Ambiguity kills cooperation.
          2.  **Hose vs. Barrow:** Portability. A hose vanishes; blame is hard. A barrow is visible; theft is hard.
          3.  **Books/Biscuits:** Books are low-stakes social signaling; biscuits are high-turnover consumption with no restocking accountability.
          4.  **Fields:** Visible boundaries. You can see the grass is gone.

          **Your Novel:**
          Your editor is relying on the "reputation" theory you already disproved. She's wrong.
          Fish stocks are invisible ("cant see the stock"). This is the critical flaw. Unlike the strip fields (visible grass), the fishery is like the dinghy: damage is slow, hidden, and blame is ambiguous. One bigger engine doesn't look like theft until the catch is gone.

          **Prediction:** They wreck the fishery. Not out of malice, but because the feedback loop is broken. They can't see the depletion until it's too late.

          **The Save:** A harbour association works *only* if enforcement is internal. External fines fail. Internal sanctions (shunning, gossip, graduated penalties) work. If your skipper is fined by a government inspector, the village rallies around him. If he's fined by the Harbour Master (a neighbour) based on agreed rules, it holds.

          Don't smuggle a happy ending. Let the invisibility of the stock drive the conflict. The tragedy isn't greed; it's uncertainty. The village doesn't collapse because they hate each other, but because they can't see the water emptying.

          (Word count check: ~230 words. Plenty of room to expand slightly on the principle.)

          *Expansion:* Make sure to explicitly state which cases fit.
          Actually, the draft looks good. I will tighten the explanation of the principle to ensure it covers all 6.

          *Revised Principle:* **Monitoring Costs.**
          If monitoring the resource's health or the user's behavior is cheap/easy, it survives. If monitoring is expensive/hard, it fails.
          Cottage: Easy to monitor mess.
          Dinghy: Hard to monitor neglect.
          Fields: Easy to monitor grass.
          Fish: Hard to monitor stock.
          Hose: Hard to monitor theft.
          Books: Easy to monitor (shelf empty?).

          Let's stick with **Visibility of Depletion + Assignability of Blame.** It's more intuitive for a writer.

          *Final Polish:* Ensure the advice on the fines is nuanced. Ostrom says "Graduated Sanctions" are key.

          *Word Count Check:* Aiming for ~350-400 to be safe under 500.

          *Wait, one more check:* The user asked "Which of them, if any, does it have to throw out?"
          Answer: None. They all fit the Visibility/Assignability model.

          *Okay, ready to write.*
answer: |-
  You don't need to throw out any cases. They all fit a single principle derived from Elinor Ostrom's work on governing commons: **Visibility of Depletion** and **Clarity of Responsibility.**

  Shared resources survive when users can easily see damage happening and immediately identify who caused it. They fail when harm is slow, invisible, or ambiguous.

  Here's how your ledger fits:
  *   **Cottage vs. Dinghy:** In the cottage, mess is immediate and attributable (you know who left the dishes). On the dinghy, neglect is slow and diffused (who forgot to cover it? who didn't bail?). Ambiguity kills cooperation.
  *   **Hose vs. Barrow:** Portability. A hose vanishes (hard to assign blame); a barrow is visible (theft is obvious).
  *   **Fields:** Visible boundaries. You can see the grass is gone.
  *   **Books/Biscuits:** Books are low-stakes social signaling; biscuits are high-turnover consumption with no restocking accountability.

  **Your Novel:**
  Your editor is relying on the "reputation" theory you already disproved with the dinghy. She is wrong.
  Fish stocks are invisible. You noted you "cant see the stock the way you can see a hedge." This is the critical flaw. Unlike the strip fields, the fishery is like the dinghy: damage is slow, hidden, and blame is ambiguous. One bigger engine doesn't look like theft until the catch is gone.

  **Prediction:** They wreck the fishery. Not out of malice, but because the feedback loop is broken. They can't see the depletion until it's too late.

  **The Save:** A harbour association works *only* if enforcement is internal. External fines fail. Internal sanctions (shunning, gossip, graduated penalties) work. If your skipper is fined by a government inspector, the village rallies around him. If he's fined by the Harbour Master (a neighbour) based on agreed rules, it holds.

  Don't smuggle in a happy ending. Let the invisibility of the stock drive the conflict. The tragedy isn't greed; it's uncertainty. The village doesn't collapse because they hate each other, but because they can't see the water emptying. The principle predicts collapse unless your characters invent a way to make the invisible visible (strict quotas, shared logs) before the crash.
