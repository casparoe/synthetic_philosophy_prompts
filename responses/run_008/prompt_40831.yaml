answer: |-
  Your hypothesis is not only plausible; it is the most charitable and theoretically fertile interpretation of the stalemate. The disagreement is best diagnosed as a **difference about the standard of evaluation**, specifically concerning the **object of normativity**.

  The two camps are not merely disagreeing about the causal structure of the universe (a formal dispute) nor are they simply talking past one another (a verbal dispute). They are disagreeing about *what kind of thing* decision theory is supposed to evaluate.

  ### The Diagnosis: Token Actions vs. Type Policies

  The core friction is between **Act-Evaluation** and **Policy-Evaluation**.

  1.  **The Critic's Standard (Act-Evaluation):** For critics like MacAskill, the primary object of normative assessment is the **token action** taken by the deliberating agent at the moment of choice. The relevant question is: *"Given that I am here, now, with this information and this fixed past, which action maximizes expected utility?"*
      *   From this perspective, the past is fixed. The predictor has already acted. The coin has already landed. The letter is in hand. Any theory that suggests your current choice influences these fixed facts looks like magic or superstition.
      *   Consequently, the asymmetry looks like a bug. In both Mugging and Blackmail, you are facing a fixed past event correlated with your choice. If you pay in one, you should pay in the other, because the *local* causal leverage is identical (zero).

  2.  **The Proponent's Standard (Policy-Evaluation):** For FDT proponents, the primary object of normative assessment is the **decision procedure (policy)** itself. The relevant question is: *"Which input-output function, if instantiated by me, yields the highest utility across the logical space of possible situations?"*
      *   From this perspective, the "moment of choice" is an illusion of perspective. You are an instance of a function. The predictor simulates that function. Therefore, your "choice" is logically simultaneous with the predictor's simulation.
      *   Consequently, the asymmetry is a feature. In XOR Blackmail, the policy "Pay" *causes* the letter to be sent (via prediction). In Counterfactual Mugging, the policy "Pay" *captures* the reward in the counterfactual branch. The logical dependencies differ, so the optimal policy differs, even if the *phenomenology* of the agent feels the same.

  **Why the "Ad Hoc" Charge Persists:**
  The critics charge FDT with ad hocery because they are evaluating the *action* based on *causal history*, while FDT is evaluating the *algorithm* based on *logical dependency*. When FDT proponents appeal to the "predictor's intent" or "tracking," critics hear an attempt to smuggle in causal distinctions where there are none *from the perspective of the token agent*. But for FDT, the logical relationship between the algorithm and the predictor *is* the causal structure that matters.

  This is not a verbal dispute because it yields different action-guidance. It is not purely formal because both sides can model the graphs correctly but disagree on which paths count for normative weight. It is a **normative disagreement about the locus of control.**

  ### What Counts as Progress?

  Given this diagnosis, another tour of the examples or a new formal proof of logical counterfactuals will not resolve the debate. The formalism is already sufficient for both sides to understand the other's model; they simply reject the normative relevance of that model.

  Progress requires a **Clarified Bifurcation of the Question.**

  The field should explicitly split "Decision Theory" into two distinct normative projects, acknowledging that they optimize for different goods:

  1.  **Theory of Rational Choice (Ex-Post):** This theory answers, *"What should I do given my current epistemic state and the fixed past?"* This aligns with CDT and the critics' intuitions. It prioritizes **reason-responsiveness** and **causal leverage**. It ensures the agent never feels they are "changing the past" and maintains a tight link between deliberation and causal power.
  2.  **Theory of Rational Design (Ex-Ante):** This theory answers, *"What decision procedure should I instantiate if I want to win across all possible worlds I might encounter?"* This aligns with FDT/UDT. It prioritizes **instrumental efficacy** and **global optimality**. It accepts that being the "kind of agent" who pays in a mugging is useful, even if the specific act loses money.

  **The Path Forward:**
  Progress would look like an agreement that **FDT is the correct theory of Rational Design, while CDT is the correct theory of Rational Choice.**

  *   If you are programming an AI, you use FDT. You want the source code that wins.
  *   If you are a human trying to understand your moral responsibility or causal impact in the present moment, CDT often feels more aligned with the phenomenology of agency.

  The current "war" is a proxy fight over who gets to own the word **"Rational."**
  *   FDT defines Rationality as **Winning** (getting the money).
  *   Critics define Rationality as **Correctness** (making the right move given the facts).

  **Conclusion:**
  The disagreement is a **difference about the standard of evaluation**. Progress will not come from finding a "principled difference-maker" within the cases, because the cases are structurally identical *under the Act-Evaluation standard* and structurally distinct *under the Policy-Evaluation standard*.

  The productive move is to stop asking "Which theory is right?" and start asking "Which normative standard is appropriate for this context?" If the goal is building agents that navigate Newcomblike problems, FDT wins. If the goal is articulating a notion of agency that respects the fixity of the past, CDT wins. Acknowledging this bifurcation dissolves the asymmetry complaint: it is not an inconsistency in FDT, but a reflection of the fact that **what makes a policy optimal is not always what makes an action feel justified.**
