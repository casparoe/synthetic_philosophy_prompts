          *   Must apply the procedure to two cases: (1) Light-rail extension (plentiful comparables, bitter definition fights), (2) Immersed tunnel (novel, thin/heterogeneous class).
          *   At least one worked case must yield an unwelcome answer.
          *   Must flag which steps are judgment calls dressed as procedure.
          *   Must explicitly discuss candidate solutions to the reference class problem (exogeneity, weighting, conditioning, pessimist's move) and state which are adopted/rejected and why.
          *   Tone: Philosopher of probability who knows practitioners (pragmatic, rigorous, no nonsense).

  2.  **Deconstruct the Core Problem:**
      *   The Reference Class Problem (RCP) is that any individual event belongs to infinitely many classes, each with different frequencies.
      *   In RCF (Reference Class Forecasting), the goal is to correct optimism bias in project planning.
      *   The tension: Specificity (causal relevance) vs. Stability (statistical power).
      *   The user wants a *procedure*, not a theory. But the procedure must be grounded in the theory they know I know.

  3.  **Drafting the Core Rule (Bottom Line):**
      *   Needs to be punchy.
      *   Idea: Choose the narrowest class that retains statistical stability, unless specific causal evidence overrides the base rate.
      *   Refinement: "Select the narrowest reference class that yields a statistically stable distribution of errors, unless specific causal evidence about the target project justifies overriding the base rate, in which case document the deviation."
      *   Even tighter: "Choose the narrowest class with sufficient statistical power to stabilize error rates, unless specific causal evidence justifies overriding the base rate, and document every judgment call where stability conflicts with relevance."

  4.  **Developing the Procedure:**
      *   Needs to be step-by-step.
      *   Needs to address:
          1.  Defining the target.
          2.  Candidate classes.
          3.  Statistical stability (size).
          4.  Causal relevance (similarity).
          5.  Bias check (is the plan itself the problem?).
          6.  Blending/Weighting.
          7.  Escalation.
      *   *Philosophical Stance:* I need to reject the "Berkeley-style move" (condition on all evidence) because it leads to a class of one (no frequency). I need to reject the "Pessimist's move" (always widen) because it ignores causal structure. I should adopt a version of "Exogeneity" (the class membership shouldn't depend on the outcome) and "Weighting by similarity" (but operationalized).
      *   *Pragmatic Twist:* The procedure must force documentation of uncertainty rather than hiding it in a single number.

  5.  **Addressing the Philosophical Considerations (Explicitly):**
      *   *Exogeneity:* Adopted. Class definition cannot depend on the outcome variable (cost overrun) to avoid selection bias.
      *   *Weighting by similarity:* Adopted but constrained. Similarity must be causal, not superficial.
      *   *Berkeley-style (Class of One):* Rejected. No frequency exists for a unique event.
      *   *Pessimist's Move (Widen until worse):* Rejected. Ignoring relevant structure increases variance without reducing bias.
      *   *Solution:* A "Stability-Relevance Tradeoff" rule.

  6.  **Developing the Worked Cases:**
      *   *Case 1: Light Rail.* Plenty of data. Fight is about scope (urban rail vs. similar length vs. local history).
          *   Procedure should likely force them to pick the class that matches *causal* drivers of cost (e.g., urban density, regulatory environment) rather than just length.
