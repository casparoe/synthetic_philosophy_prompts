answer: |-
  Select the narrowest reference class that achieves statistical stability and causal homogeneity, escalating any choice where relevance conflicts with sample size rather than hiding the dispute in a single number.

  ### Philosophical Stance and Strategy

  This procedure adopts a pragmatic falsificationist approach to the reference class problem, rejecting theoretical purity for operational defensibility. We explicitly **adopt** the requirement of *exogeneity*: the class cannot be selected based on the outcome variable (cost overrun), preventing analysts from cherry-picking classes that validate pre-existing budgets. We **adopt** a constrained version of *weighting by similarity*, but only where similarity is defined by causal drivers of cost (e.g., regulatory environment, ground conditions) rather than superficial descriptors (e.g., project name, political jurisdiction). We **reject** the Berkeley-style move of conditioning on all specific evidence to create a "class of one," because singular events have no frequency distribution and thus no empirical forecast value. We also **reject** the pessimist's move to widen the class until stability is achieved regardless of relevance, as lumping structurally dissimilar projects (e.g., bridges and software) introduces variance that swamps the signal. Instead, we prioritize *causal homogeneity* over *sample size* until the sample becomes too small to support inference, at which point the procedure mandates escalation rather than false precision.

  ### The Reference Class Decision Procedure

  **Step 1: Identify Causal Drivers**
  List the top three causal factors known to drive cost overrun in this sector (e.g., land acquisition complexity, geological uncertainty, regulatory approval time).
  *   *Sufficient Answer:* Factors must be empirically linked to cost variance in literature, not merely asserted by project sponsors.
  *   *Stop Condition:* If drivers cannot be agreed upon, escalate to the methodology panel.

  **Step 2: Generate Candidate Classes**
  Construct three candidate classes: (A) The Narrow Class (matches all three drivers), (B) The Moderate Class (matches two drivers), (C) The Broad Class (matches sector only, e.g., "all urban rail").
  *   *Sufficient Answer:* Each class must be definable without looking at the cost overrun data of the members.

  **Step 3: Test for Statistical Stability**
  Calculate the minimum sample size required for a stable distribution (default N ≥ 30). Eliminate any candidate class with fewer members.
  *   *Sufficient Answer:* If no class meets N ≥ 30, proceed to Step 7 (Novel Case Protocol).
  *   *Judgment Call Flag:* The threshold N=30 is arbitrary; changing it to N=15 or N=50 changes the outcome. This value must be fixed by policy, not per project.

  **Step 4: Test for Exogeneity**
  Verify that the definition of the class was established before analyzing the cost performance of its members.
  *   *Sufficient Answer:* Documentation showing class criteria were set prior to data retrieval.
  *   *Stop Condition:* If the class was chosen because it produced a desirable uplift percentage, reject the class and return to Step 2.

  **Step 5: Assess Causal Homogeneity**
  Compare the error mechanisms of the candidate classes. Does the Broad Class include projects where the primary cost drivers are fundamentally different (e.g., elevated rail vs. underground tunnel)?
  *   *Sufficient Answer:* Qualitative assessment by independent engineering review.
  *   *Judgment Call Flag:* Determining "fundamental difference" is subjective. If two classes pass Steps 3 and 4 but differ on homogeneity, do not average them; escalate.

  **Step 6: Select and Adjust**
  Choose the narrowest class passing Steps 3–5. Apply the distribution (e.g., 80th percentile) to the project's internal estimate.
  *   *Stop Condition:* If the internal estimate is based on normative planning (what we hope to spend) rather than descriptive costing (what similar tasks cost), halt and require a bottom-up estimate revision before applying RCF.

  **Step 7: Novel Case Protocol (If Step 3 Failed)**
  If no class has N ≥ 30, do not force a single number. Generate a range based on the Broad Class plus a "novelty penalty" derived from expert elicitation.
  *   *Sufficient Answer:* A probability distribution, not a point estimate.
  *   *Stop Condition:* Mandatory escalation to the board with a "High Uncertainty" flag.

  ### Explicit Judgment Call Flags

  The following steps appear algorithmic but conceal discretion that must be documented in the methodology log:
  1.  **Step 1 (Driver Selection):** Choosing which causal factors matter is theory-laden. An analyst favoring a lower budget might emphasize "construction technology" (stable) over "regulatory environment" (volatile). *Requirement:* List rejected drivers and justify exclusion.
  2.  **Step 3 (Stability Threshold):** The N=30 rule is a heuristic. In high-stakes projects, analysts may argue for N=10 to keep the class narrow. *Requirement:* Any deviation from N=30 requires panel sign-off.
  3.  **Step 5 (Homogeneity):** Deciding whether a "difference" is structural or superficial is the core philosophical dispute. *Requirement:* If two defensible classes exist (one narrow/heterogeneous, one wide/homogeneous), output both estimates and escalate.

  ### Worked Case 1: Eleven-Mile Light-Rail Extension

  **Context:** The authority wants to use "Authority Capital Projects (Last 30 Years)" (N=12) or "Similar Length Rail (±2 miles)" (N=8). Analysts argue for "All Urban Rail in Developed Economies" (N=150).

  **Procedure Run:**
  1.  **Drivers:** Geological risk, urban density, procurement model.
  2.  **Candidates:** (A) Local Authority Projects (N=12), (B) Similar Length (N=8), (C) Global Urban Rail (N=150).
  3.  **Stability:** Classes A and B fail N ≥ 30. Class C passes.
  4.  **Exogeneity:** Class A is suspect; the authority selects projects it believes it can manage, creating selection bias. Class C is exogenous.
  5.  **Homogeneity:** Class C includes varied densities, but all share the core cost drivers of urban rail.
  6.  **Selection:** Class C is the only valid choice.

  **Outcome:** The procedure mandates using the "Global Urban Rail" class.
  **Unwelcome Answer:** The local analysts prefer Class A because their historical data shows a 10% average overrun (due to accounting methods that exclude pre-construction costs). The Global Urban Rail class shows a 45% average overrun at the 80th percentile. The procedure forces the analyst to apply the 45% uplift, increasing the budget by hundreds of millions. The panel must accept that their local history is statistically invalid for forecasting due to small sample size and endogeneity.

  ### Worked Case 2: Immersed River Tunnel Replacement

  **Context:** The authority has never built an immersed tunnel. National history has two examples (N=2). Global history has 40, but half are in seismic zones irrelevant to this site.

  **Procedure Run:**
  1.  **Drivers:** Hydrogeology, marine logistics, seismic risk.
  2.  **Candidates:** (A) Local Immersed Tunnels (N=2), (B) Global Immersed Tunnels (N=40), (C) All River Crossings (N=200).
  3.  **Stability:** Class A fails. Class B passes N ≥ 30 only if non-seismic zones are included (violating driver match). Class C passes easily.
  4.  **Exogeneity:** Class C is exogenous but causally weak.
  5.  **Homogeneity:** Class B is homogeneous but statistically thin (N=18 if restricted to non-seismic). Class C is heterogeneous (bridges vs. tunnels).
  6.  **Selection:** No class passes both Stability and Homogeneity. Proceed to Step 7.

  **Outcome:** The procedure triggers the Novel Case Protocol.
  **Unwelcome Answer:** The procedure forbids producing a single RCF-adjusted number. It requires issuing a wide probability distribution based on Class C with a documented "novelty penalty" and mandates expert elicitation. The panel cannot claim a precise cost estimate; they must report to stakeholders that the uncertainty is irreducible via historical data alone. This denies them the political cover of a specific "Reference Class Forecast" number.
