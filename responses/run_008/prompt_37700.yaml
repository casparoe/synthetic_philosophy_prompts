answer: |-
  The careenium hummed, a low hydraulic thrum beneath the clicking of ivory spheres. On the screen above the table, green wireframe spheres mirrored the physical white balls below. The surface tilted imperceptibly, guiding the physical balls to match the simulated trajectories.

  "It's undeniable," Elara said, leaning over the rail. "The simmballs are doing the pushing. Look at cluster four. The simulated collision dictates the tilt, which forces the physical ball to comply. The causation flows from the pattern to the substrate."

  Marcus shook his head, watching the actuators beneath the mesh. "You're conflating control with causation. The hydraulic fluid presses against the pistons. The motors burn electricity. That is where the energy transfer occurs. The simmballs are epiphenomenal shadows cast by the code. They don't push; they describe what is being pushed by the machinery."

  "Description is too weak," Elara countered. "If the simulation diverges, the machinery corrects the table to match the simulation, not vice versa. The simmball trajectory is the invariant; the hydraulic pressure is the variable adjusted to maintain it. The pattern constrains the physics."

  "Constraints aren't causes," Marcus said. "A mold constrains clay, but the hand pushes the clay. Here, the computer is the hand."

  The engineer, listening from the control deck, leaned into the microphone. "Let's complicate the invariant. I'm introducing a shadow simmball. It exists only in the simulation. There is no physical counterpart on the table. But the system is programmed to tilt the surface to ensure no real ball enters the shadow's projected path."

  On the screen, a red wireframe sphere appeared, hovering over the felt. No white ball corresponded to it. Yet, as the red shadow rolled toward the center cluster, the physical balls subtly drifted aside, guided by the tilting floor, avoiding the space the shadow occupied.

  "There," Elara said, pointing. "The shadow repelled them. Nothing physical touched those balls to make them avoid that spot. Only the informational presence of the shadow caused that avoidance."

  Marcus didn't blink. "The *data* representing the shadow caused it. The voltage states in the RAM corresponding to the shadow's coordinates triggered the algorithm that drove the motors. The shadow itself is nothing. It's a user-interface metaphor for a register state."

  "But the register state doesn't have spatial properties," Elara pressed. "The balls avoid a *location* defined by the shadow's geometry. If you say the voltage caused it, you lose the spatial specificity. Why did they move *there*? Because of the shadow's position. The spatial relation between the shadow and the balls is the causal joint. You cannot reduce that relation to voltage without losing the explanation of the trajectory."

  "I don't need the explanation to be the cause," Marcus replied sharply. "I need the mechanism. You're arguing that because the shadow provides the *reason* for the movement, it is the *cause* of the movement. But reasons are not forces. The force came from the gradient of the table. The gradient came from the actuators. The actuators came from the code. The code processed the shadow-data. At no point did a 'shadow' exert force. You are reifying a variable."

  "And you are mistaking the substrate for the system," Elara shot back. "If I ask why the balls avoided the center, saying 'because motor three activated' is true but useless. Saying 'because of the shadow ball' captures the causal structure. But I'm not just talking about utility. I'm saying the causal power resides in the organizational logic. The shadow ball is a real constraint in the system's topology. Without it, the physical history changes. Its absence isn't just a counterfactual; its presence is an active organizing principle."

  "Organizing principles don't move matter," Marcus insisted. "You're trying to find a middle ground between bare counterfactuals—'if no shadow, then no move'—and interventionism—'if I delete the shadow, the move stops.' But both collapse into physical manipulation. If you delete the shadow, you change the physical state of the computer. There is no ghostly causation happening in the logical layer. You want causation to be about information, but information is always physical instantiation."

  "Is it?" Elara turned to him. "The shadow ball has no instantiation. It is purely relational data. Yet it organizes the matter. You claim causation requires energy transfer. I claim causation requires difference-making within a control structure. The shadow makes a difference. It isn't just that the balls *would* have gone elsewhere; it's that the system recognizes the shadow as an obstacle. The recognition is the cause."

  "Recognition is a physical process in the CPU," Marcus said. "You keep trying to lift the causation out of the hardware and into the software logic. But the logic is just the hardware behaving regularly. If the shadow causes the motion, then every abstract object we model causes physical events. That dissolves the concept of cause. If the shadow pushes the ball, then the concept of 'justice' pushes a gavel."

  "No," Elara said. "Only when the abstract object is embedded in a feedback loop that governs physical energy distribution. The careenium is a machine designed to make the pattern causal. That's the point of the design. To deny the simmballs causal work is to deny the function of the machine. You're left with a story about hydraulics that cannot distinguish this table from a random tilting platform."

  "And you're left with a story about patterns that cannot explain how the push happens without magic," Marcus returned. "We agree on the physics. We agree on the outcome. We disagree on whether the description of the pattern is ontologically potent. You think the map pushes the territory because the territory is built to follow the map. I say the builders push the territory using the map as a guide."

  "So the dispute isn't about the machinery," Elara summarized.

  "No," Marcus said. "It's about whether 'causation' names a physical transaction or an explanatory dependency. You want causation to be where the control is. I say causation is where the energy is."

  "And the shadow ball," Elara said, watching the red wireframe glide across the screen as the physical balls parted around its ghostly path. "It has no energy. Yet it controls."

  "It has no energy," Marcus agreed. "Which is why it pushes nothing. The computer pushes. You just prefer the story where the ghost drives the machine."

  "And you prefer the story where the machine has no driver," Elara said. "Only parts."

  They stood in silence as the actuators whined, the physical balls rolling obediently around the empty space defined by the simulation.
