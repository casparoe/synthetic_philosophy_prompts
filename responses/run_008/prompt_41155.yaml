answer: |-
  I step into the scanner, quiet, bare,
  Bound for a red dawn waking up on Mars.
  It reads the state of all my living cells,
  And destroys the source to save the memory.
  There is no second path, no other branch,
  Just data shaped from ordinary matter.

  But suppose the flesh remains as solid matter,
  A glitch halts destruction inside the scanner.
  Now life splits off a temporary branch;
  One body stays, one wakes up on Mars.
  Both claim the same past memory,
  Both feel the pulse within the same old cells.

  Divide the brain, transplant the living cells,
  Or copy twice the pattern of the matter.
  Which one holds the true claim to memory?
  Neither passes through the single scanner.
  One wakes here, one wakes there on Mars,
  And identity breaks upon the branch.

  If identity cannot sustain the branch,
  Does survival die within the cells?
  No. One wakes here, one wakes there on Mars.
  The question shifts from identity to matter.
  No need to pass the original scanner,
  If continuity preserves the memory.

  There is no further fact beyond memory,
  No subject climbs the dividing branch.
  Identity does not survive the scanner.
  Relations flow like blood through cells.
  This is the only weight of living matter.
  Whether I wake alone or twice on Mars.

  When I wake up alone there on Mars,
  Or if two wake to share a memory,
  The distinction fades to ordinary matter.
  There is no single, dividing branch,
  No judgment waiting in the scanner.
  Just continuity of cells.

  It counts not which path to Mars, which branch,
  Though memory flows differently through cells,
  Beyond the scanner, what matters is matter.
