  5.  **Formulate the Coherentist Defense (The "Girth Matters" Strategy):**
      *   **Holism vs. Atomism:** The roommate is thinking atomistically (link by link). Coherentism is holistic (system-wide).
      *   **Degrees of Coherence:** Justification isn't binary (justified/unjustified). It comes in degrees. A larger web has more constraints, more explanatory power, and more predictive success.
      *   **The "Input" Problem (Bonus):** While the user wants to keep (1), the strongest coherentist responses often admit *some* causal input from the world (BonJour's later view, or "Observation Beliefs" that are justified by coherence, not causation). But I should stick to the user's constraint of keeping (1) if possible, or show how (1) is compatible with empirical input *beliefs*.
      *   **Probability/Explanation:** A large web justifies because it makes the falsity of the system less probable than a small web. If A and B support each other, they could both be wrong easily. If A...Z support each other *and* explain observations *and* predict new things, the probability of the whole system being a coherent fiction drops.

