      *   **Premise (3):** "A large web differs... only by having more links. Same kinds of relations." **This is the weak link.** This assumes justification is additive in a linear way (0 + 0 = 0) rather than emergent or systemic.
      *   **Premise (4):** "If one unsupported link contributes zero... more zero-links can't conjure any." This relies on (3). It treats justification like money (IOUs) rather than like structural integrity or probability.
      *   **Premise (6):** "Single self-consistent belief... collapses into foundationalism." This is a *reductio* against coherentism, but coherentists deny a single belief can be coherent in isolation. Coherence is a property of *systems*, not singletons.

