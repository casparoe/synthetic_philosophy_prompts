      *   *Wait, one nuance:* The "Minority Report" itself. It shows a *different* future. This implies branching timelines or probabilistic futures. This is closer to "Possible Worlds" semantics than strict determinism. I should mention that.

      *   *Pedagogical Anchor:* Definitely the Ball Scene. It's the clearest visual metaphor.

      *   *Warning:* Don't let students think "Quantum Mechanics" explains it. Keep it on agency and causality.

  8.  **Final Review against constraints:**
      *   Intro philosophy level? Yes.
