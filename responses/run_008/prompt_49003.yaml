      *Actually, looking closer at the scene:* Witwer drops the ball. Anderton catches it. Witwer: "From the point of view of the universe, the ball was going to fall. You caught it." Anderton: "But I caught it." Witwer: "But you were always going to catch it." -> Witwer is arguing Hard Determinism here. Anderton is arguing for Agency.

