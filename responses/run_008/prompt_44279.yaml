  The phenomenon you are describing sits at the intersection of social epistemology, communication theory, and social psychology. While your friends are not wrong to use the word **echo chamber**, you are correct that the term has become too broad to capture the specific mechanics you've observed. In the academic literature, the most precise established framework comes from philosopher C. Thi Nguyen (2020), who distinguishes between **epistemic bubbles** (where you lack exposure to outside views) and **echo chambers** (where you are exposed but taught to systematically distrust outside sources).

  Your groups are not epistemic bubbles (everyone knows the arguments). They functionally operate as echo chambers because of the "self-sealing" mechanism you identified: the script includes a pre-emptive neutralization of denial ("they always deny it first"). This creates a **self-sealing belief system** (a term from Karl Popper), where counter-evidence is interpreted as confirmation. However, there is no single established noun in the literature that specifically names the *configuration* where a community engages with a **scripted caricature** that overrides reality through **assimilation** rather than overt hostility. The literature discusses the components (inoculation theory, assimilation bias, self-sealing arguments), but not this specific communal state.

  The key distinction here is that standard echo chambers rely on *exclusion* or *active distrust of the source*. Your groups rely on *assimilation of the message*. The outsider is heard, but their words are "rounded" to fit the internal map. This is a **map-territory confusion** at a social level. The group is not ignoring the territory; they are convinced their map is more accurate than the territory itself.

  Since there is no established term for this specific "scripted assimilation" configuration, I propose one that marks the edges you described.

  **Proposed Term:** Epistemic Simulacrum

  **Definition:** A community state in which an internal, shared model of an opponent (the simulacrum) becomes more authoritative than actual interactions with opponents. Real-world arguments are assimilated into the model's script, and corrections are neutralized as predicted features of the model.

  **Edges:**
  *   **Vs. Echo Chamber:** An echo chamber requires active distrust of outside *sources*. An epistemic simulacrum can exist without hostility; the outsider is heard, but their testimony is overwritten by the script.
  *   **Vs. Straw Man:** A straw man is an individual rhetorical fallacy. An epistemic simulacrum is a communal epistemic state; members genuinely believe they are engaging accurately.
  *   **Vs. Epistemic Bubble:** In a bubble, outside arguments are absent. In a simulacrum, they are present but distorted via assimilation.
  *   **Requirement:** It does not require believing outsiders are lying (shilling), only that their self-reporting is less reliable than the group's script.

  Verdict: no established name — proposed: Epistemic Simulacrum
