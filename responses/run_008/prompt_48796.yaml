answer: |-
  ### Predicted Verdict
  Your friend will almost certainly verdict that **the one person should be saved from death**, even at the cost of four million people suffering permanent paralysis.

  ### Candidate Rules Fitting the Track Record

  To make sense of her judgments, we need rules that accommodate aggregation within harm types (legs, headaches, deaths) but restrict it across harm types (death vs. paralysis, death vs. headaches).

  **Rule 1: Categorical Priority (Strong Non-Aggregation)**
  *   **Principle:** Harms are sorted into lexical categories (e.g., Death, Permanent Disability, Temporary Injury, Mild Pain). Claims to avoid a higher-category harm always trump claims to avoid a lower-category harm, regardless of the number of people in the lower category. Aggregation is permitted only *within* a category.
  *   **Fit:** Explains why 5 deaths beat 1 death (same category) and 5 legs beat 1 leg (same category). Explains why 1 death beats 20 paralysis cases and 1 billion headaches (Death is a higher category than Paralysis or Headaches).
  *   **Prediction for Next Case:** Save the **one person from death**. (Death > Paralysis, categorically).

  **Rule 2: Threshold Aggregation with a Triviality Constraint**
  *   **Principle:** Smaller harms can aggregate to outweigh a larger harm if the number of sufferers is sufficiently large to create a greater total burden, *unless* the smaller harm is "trivial" relative to the larger one. There is a threshold number $N$ for each severity gap where $N \times \text{Lesser Harm} > \text{Greater Harm}$.
  *   **Fit:** Explains 5 deaths > 1 death and 5 legs > 1 leg (aggregation allowed). Explains 1 death > 1 billion headaches (Headaches are "trivial" relative to death; no number suffices). Explains 1 death > 20 paralysis (Paralysis is not trivial, but 20 is below the threshold $N$).
  *   **Prediction for Next Case:** Save the **four million from paralysis**. (Paralysis is not trivial, and 4 million exceeds the threshold $N$ required to outweigh a death).

  ### Best Guess and Reasons

  **Best Guess:** She will choose **Rule 1 (Save the One from Death)**.

  **Reasons:**
  1.  **Consistency with Rationale:** Her explicit justification is the contractualist idea that "one person cannot be sacrificed merely because benefits to others are spread thinly." In her view, the strength of a claim is determined by the severity of the harm to the *individual*, not the sum of harms. Four million paralyzed people still each have a claim weaker than the one dying person's claim. To her, multiplying a weaker claim does not strengthen it enough to override a stronger one.
  2.  **The "Billion Headaches" Precedent:** She rejected aggregation even when the numbers were astronomical (one billion) for a lesser harm. This suggests she views the gap between Death and Non-Death as lexical, not just numerical. If a billion headaches couldn't bridge the gap, she likely views the gap between Death and Paralysis as similarly unbridgeable by numbers, treating Paralysis as "Non-Death."
  3.  **The "20 Paralysis" Precedent:** If she believed paralysis could aggregate to outweigh death, 20 is a low bar. Her decisive rejection there implies she sees the harms as qualitatively different, not just quantitatively different. Moving from 20 to 4 million changes the magnitude, but not the qualitative structure of the choice, which is what contractualism prioritizes.
  4.  **Seminar Context:** In a contractualism seminar, the orthodoxy (following T.M. Scanlon's *What We Owe to Each Other*) leans heavily toward Categorical Priority. The "numbers count" view is usually the utilitarian foil she is testing herself *against*.

  ### The Dividing Case

  To cleanly separate **Rule 1 (Categorical Priority)** from **Rule 2 (Threshold Aggregation)** in a future discussion, propose this case:

  **The Case:** **One person will die unless every other human being on Earth (approx. 8 billion people) suffers permanent paralysis.**

  *   **Why it divides them:**
      *   **Rule 1** remains unmoved: The category "Death" trumps "Paralysis," even if the entire human race is paralyzed. The individual complaint of the dying person remains the strongest single complaint.
      *   **Rule 2** must yield: If 4 million paralysis cases outweighed a death (as Rule 2 predicted in the Next Case), 8 billion certainly does. If Rule 2 proponents hesitate here, they must explain where the "lexical" line is drawn. If they say "Save the 8 Billion," they confirm they are not strict contractualists but weighted aggregators. If they say "Save the 1," they effectively concede to Rule 1.
  *   **Diagnostic Value:** This case removes the ambiguity of "is 4 million enough?" by making the numbers overwhelming. It forces your friend to admit whether her principle is truly about *categories* of harm (Rule 1) or just very high *thresholds* of numbers (Rule 2).
