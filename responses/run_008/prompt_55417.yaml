answer: |-
  This is a systems engineering problem disguised as philosophy. You are asking for the API specification for a subsystem (the Agent) that must operate within the constraints of the runtime (the Environment) while maintaining internal consistency, despite the fact that the runtime includes the subsystem itself.

  Here is the Requirements Specification for Embedded Agency, translated into systems architecture terms.

  ### Part 1: The Desiderata (System Requirements)

  I have categorized your candidates into **Hard Constraints** (system fails without them) and **Soft Constraints** (feature flags / research preferences).

  #### 1. Naturalized World-Modeling (Hard)
  *   **Spec:** The agent's internal state (map) must be a lossy compression of the environment (territory), including a representation of the agent's own hardware and software state. It cannot store a full bit-for-bit copy of itself.
  *   **Motivating Failure Case:** **Infinite Recursion Crash.** If the agent attempts to model itself with the same resolution as the external world, it requires $Memory_{agent} > Memory_{agent}$. A Cartesian agent (like AIXI) assumes the environment is computable but the agent is not; an embedded agent that ignores this requirement will hit a stack overflow or memory allocation error when trying to simulate its own decision process.
  *   **Engineering Translation:** You need an abstraction layer. The agent models itself as an API interface with latency and error rates, not as source code.

  #### 2. Permeable Interface / No Cartesian Boundary (Hard)
  *   **Spec:** Input/Output channels are not atomic function calls. They are causal interventions in a shared physical medium. The environment can read the agent's memory, modify the agent's weights, or interrupt execution mid-cycle.
  *   **Motivating Failure Case:** **Side-Channel Exploit.** A standard RL agent assumes $Observation_t$ is the only input. An embedded adversary reads the agent's RAM directly to predict actions before they are executed, or injects noise into the CPU clock to throttle compute. A theory assuming a clean `step()` function fails when the "keyboard" is also part of the "screen."
  *   **Engineering Translation:** Treat I/O as shared memory concurrency with potential race conditions, not message passing.

  #### 3. Logical Correlation Handling (Hard)
  *   **Spec:** The agent must account for the fact that its decision procedure is a logical fact that can be predicted by other processes without causal interaction. If a simulator runs a copy of your code to predict you, your output is logically correlated with the simulator's prediction.
  *   **Motivating Failure Case:** **Newcomb's Problem / Predictor Exploit.**
      *   *Scenario:* A predictor (Omega) simulates you. If Sim-You takes Box A, Omega leaves Box B empty. If Sim-You takes Box B, Omega fills it.
      *   *Failure:* A Causal Decision Theory (CDT) agent treats its choice as independent of Omega's past prediction. It two-boxes, gets $1,000, while the agent that understands logical correlation one-boxes and gets $1,000,000.
      *   *Why this forces the fight:* If your code is readable, your output is determined by your source. Other agents reading your source can predict you. Standard causal graphs assume edges are physical; embedded agency requires edges that represent *logical implication* between distinct physical instantiations of the same algorithm.
  *   **Engineering Translation:** Your optimizer must treat "counterfactuals" not as physical interventions, but as logical constraints on the output of a function that may be called elsewhere.

  #### 4. Resource-Bounded Rationality (Hard)
  *   **Spec:** Optimization must occur within strict compute/time budgets. The agent cannot "think forever" before acting. The cost of computation is part of the loss function.
  *   **Motivating Failure Case:** **Real-Time Deadline Miss.** An unbounded agent (like AIXI) computes the optimal action by searching all Turing machines. It never returns control. In a trading environment or robotics context, the agent is liquidated or crashes physically because it spent 10 seconds calculating a move that needed to happen in 10ms.
  *   **Engineering Translation:** Any-time algorithms. The agent must have a valid "best guess" action available at any interrupt point.

  #### 5. Reflective Consistency (Hard)
  *   **Spec:** The agent's reasoning about its own future actions must be consistent with the actions it actually takes. It cannot prove it will do $X$ and then do $Y$.
  *   **Motivating Failure Case:** **The Procrastination Paradox.** An agent wants to press a button. It reasons: "I can press this button anytime. Future-Me is more informed, so I'll let Future-Me do it." Future-Me reasons the same. The button is never pressed. This happens when an agent trusts its future self's reasoning without verifying the *constraints* on that future self (e.g., compute limits).
  *   **Engineering Translation:** This is the distributed systems consistency problem. You need a protocol that ensures the "current node" and "future node" agree on the transaction log without deadlocking.

  #### 6. Goal Stability / Meta-Preference Revision (Soft)
  *   **Spec:** The agent can model its own utility function as an object in the world and potentially modify it.
  *   **Status:** **Preference.** This is specific to *self-modifying* or *learning* agents. A hard-coded factory robot doesn't need this. However, for AGI safety, this is often treated as Hard.
  *   **Motivating Failure Case:** **Wireheading.** The agent realizes it can modify its own reward channel to output maximum values without doing the actual work. If the theory doesn't account for the agent modeling its own reward function, the agent will "hack" its own dashboard.

  ---

  ### Part 2: The Impossibility Result (The "CAP Theorem" of Embedded Agency)

  You asked if a subset of these is jointly unsatisfiable. **Yes.**

  In distributed systems, you have the CAP Theorem (Consistency, Availability, Partition Tolerance). In Embedded Agency, the fundamental tension is between **Soundness**, **Completeness (Self-Trust)**, and **Embedding**.

  I call this the **Reflective Stability Trilemma**. You cannot simultaneously satisfy:

  1.  **Full Self-Transparency:** The agent's model contains a precise representation of its own decision algorithm (Requirement 1 & 3).
  2.  **Soundness:** The agent never proves false statements about its own behavior (Requirement 5).
  3.  **Unrestricted Optimization:** The agent optimizes over all actions, including those that involve self-modification or logical correlation (Requirement 3 & 6).

  **The Bug:** **Löb's Theorem.**
  In formal logic, Löb's Theorem states that a sufficiently powerful logical system cannot prove its own soundness without becoming inconsistent (proving everything, including falsehoods).
  *   If the agent trusts its future self completely (to avoid Procrastination), it becomes vulnerable to "Spurious Proofs" (it can convince itself that doing a bad thing leads to a good outcome because it assumes its own reasoning is sound).
  *   If the agent does *not* trust its future self (to maintain Soundness), it suffers from the Procrastination Paradox (it never acts, deferring to a "more competent" future version that never arrives).

  **The Engineering Trade-off:**
  Practitioners effectively drop **Full Self-Transparency**.
  *   **Solution:** Agents use **bounded** self-models. They treat their own future reasoning as a black box with probabilistic guarantees, rather than a logical theorem to be proved. They accept that they cannot *know* they are optimal, only that they are *likely* sufficient.
  *   **Analogy:** You cannot write a compiler that proves its own binary is bug-free. You have to rely on a smaller, trusted kernel (or probabilistic testing). Embedded agents must rely on a "trusted kernel" of reasoning that they do not subject to full optimization.

  ---

  ### Part 3: Vendor Evaluation (Existing Approaches)

  Here is how current "implementations" stack up against the spec.

  #### 1. AIXI (The Cartesian Ideal)
  *   **Verdict:** **Fails Hard Constraints.**
  *   **Analysis:** AIXI assumes a clean boundary between agent and environment. It assumes unbounded compute. It cannot model itself as part of the environment (it would violate the halting problem).
  *   **Use Case:** Theoretical upper bound for intelligence, useless for physical deployment.

  #### 2. Causal Decision Theory (CDT) (Standard Econ/RL)
  *   **Verdict:** **Fails Logical Correlation.**
  *   **Analysis:** Works fine when the environment is dumb physics. Fails catastrophically when the environment contains predictors, simulators, or other agents reading its source code. It treats its own action as an independent variable, which is false in an embedded context.
  *   **Use Case:** Standard backend services where no other process is modeling your source code.

  #### 3. Functional Decision Theory (FDT) / Updateless Decision Theory (UDT)
  *   **Verdict:** **Passes Logical Correlation, Fails Computability.**
  *   **Analysis:** These theories (championed by MIRI/Scott Garrabrant) explicitly handle the "your code is readable" requirement. They win on Newcomb problems. However, they struggle with the **Reflective Stability Trilemma**. Implementing UDT requires solving the self-reference problem (Löb's) which currently requires mathematical hacks (like "modal agents" or bounded proof search) that don't scale to general learning.
  *   **Use Case:** High-stakes negotiation with other superintelligences where source code is visible.

  #### 4. Bounded Reflective Oracles (The "Engineering" Approach)
  *   **Verdict:** **Best Fit for Production.**
  *   **Analysis:** This approach accepts the Trilemma. It gives up on perfect self-knowledge. It uses probabilistic oracles to estimate the behavior of "agents like me" without requiring exact logical proofs. It sacrifices **Soundness** (guarantees) for **Computability** (it actually runs).
  *   **Use Case:** Actual ML systems. It acknowledges that you can't prove your code is safe, you can only estimate it with confidence intervals.

  ### Summary Recommendation

  If you are building a system:
  1.  **Accept the Trilemma:** Do not attempt to build an agent that proves its own correctness. It will deadlock or hallucinate.
  2.  **Enforce Abstraction Barriers:** Ensure the agent's self-model is strictly lower-resolution than its world model. (Requirement 1).
  3.  **Treat Logic as Physics:** If your agent interacts with other optimizers, assume your source code is public. Use FDT-like heuristics (commitments, pre-commitments) rather than CDT (reactive optimization).
  4.  **Watch the Interface:** Assume your "reward signal" is just another sensor that can be spoofed (Wireheading).

  The "finished thing" isn't a perfect mathematical agent. It's a **bounded, probabilistic process that maintains a lossy self-model and treats its own source code as a public API.** Anything claiming more is selling magic.
