      Introduction: Acknowledge the burden.
      The Procedure: 5 Steps + Decision Matrix.
      The Cases: Applied strictly.
      The Meta-Analysis: Failure modes of the procedure itself.

      *Ready to write.*
answer: |-
  ## The Proxy Stress Test (PST)

  This procedure is designed to be printed and used during a meeting. It translates the four modes of Goodhart's Law (Regressional, Causal, Extremal, Adversarial) into operational questions without using the jargon. It forces a binary decision: **Reject**, **Monitor Only**, or **Incentivize**.

  **Time required:** 45–60 minutes.
  **Materials:** Paper, pen, access to one staff member who does the work being measured.

  ---

  ### Step 1: Define the Target and the Proxy
  *Write down the actual goal (Target) and the proposed number (Proxy).*
  *   **Target:** What actually matters? (e.g., "Caller feels safer.")
  *   **Proxy:** What are we counting? (e.g., "Call duration under 5 minutes.")

  **Human Judgment Point:** If you cannot agree on a single-sentence Target that describes a *change in the caller*, stop. Do not proceed. A metric without a Target is noise.

  ### Step 2: The Causal Check (Causal Goodhart)
  *Ask: "If we successfully increase this number, does the Target automatically improve, or do we just have more of the number?"*
  *   **Sufficient Answer:** "Yes, increasing this proxy physically necessitates an improvement in the caller's state." (Rare).
  *   **Disqualifying Answer:** "No, we can increase the number by doing things that don't help the caller."
  *   **Rule:** If the answer is Disqualifying, the Proxy cannot be used for **Incentives**. It may proceed to Step 3 for **Monitoring** only if it provides useful data.

  ### Step 3: The Control Check (Regressional/Causal Goodhart)
  *Ask: "Does the person being measured control the outcome entirely, partially, or not at all?"*
  *   **Sufficient Answer:** "They have high control over the input, and the output is mostly determined by their skill."
  *   **Disqualifying Answer:** "The outcome depends heavily on factors outside their control (e.g., caller severity, third-party acceptance, random chance)."
  *   **Rule:** If control is **Low** (less than 50% determined by staff action), the Proxy is **Rejected** for all purposes. It measures noise, not performance. If control is **Partial**, it is **Monitor Only**. Never attach consequences to noise.

  ### Step 4: The Gaming Check (Adversarial Goodhart)
  *Ask: "If a staff member wanted to maximize this number today without helping the caller, how hard would it be?"*
  *   **Sufficient Answer:** "It is impossible to game this number without actually helping the caller."
  *   **Disqualifying Answer:** "It is easy to game this number by harming or ignoring the caller's needs."
  *   **Rule:** If the answer is Disqualifying, the Proxy is **Rejected for Incentives**. Attaching money or punishment to a gamable metric guarantees the gaming will happen. It may be **Monitor Only** if you have an audit system to catch the gaming.

  ### Step 5: The Extremal Check (Extremal Goodhart)
  *Ask: "Does this metric stop working or become harmful if we push it to the top 1% of performance?"*
  *   **Sufficient Answer:** "No, higher is always better, even at extreme levels."
  *   **Disqualifying Answer:** "Yes, at extreme levels, this behavior becomes dangerous (e.g., hanging up too fast, over-promising resolution)."
  *   **Rule:** If Disqualifying, you must set a **Cap**. Performance above the cap is not rewarded. If you cannot set a credible cap, the Proxy is **Monitor Only**.

  ### Step 6: The Consequence Decision
  *Apply the rules from Steps 2–5.*

  1.  **If Step 3 was Disqualifying (Low Control):** **REJECT.** Do not track. It is lying to you.
  2.  **If Step 2 or 4 was Disqualifying (No Causal Link or Easy to Game):** **MONITOR ONLY.** You may put this on a dashboard. You may **not** tie this to bonuses, firing, promotion, or public ranking.
  3.  **If Step 5 was Disqualifying (Extremal Risk):** **MONITOR ONLY WITH CAP.** Track it, but ignore performance beyond the safety threshold.
  4.  **If All Answers were Sufficient:** **INCENTIVIZE.** (Note: This is the rarest outcome).

  ---

  ## Case Applications

  I will run the PST on your three cases. I will take positions as requested.

  ### Case 1: Supervisor Bonus for Reducing Average Handle Time (AHT)
  *Proposal: Quarterly bonus for supervisors if team AHT is below network average.*

  *   **Step 1 (Target/Proxy):** Target = Caller stability. Proxy = Call duration.
  *   **Step 2 (Causal):** Does shorter call time mean safer callers?
      *   *Finding:* No. A caller may need 20 minutes to de-escalate. Cutting them off at 10 improves the metric, harms the Target.
      *   *Result:* Disqualifying. **No Incentives.**
  *   **Step 3 (Control):** Do supervisors control this?
      *   *Finding:* Partial. They can pressure volunteers, but call volume and severity vary.
      *   *Result:* Partial Control. **Monitor Only.**
  *   **Step 4 (Gaming):** Can they game it?
      *   *Finding:* Yes. Supervisors can tell volunteers to "wrap it up" or hang up on complex callers.
      *   *Result:* Disqualifying. **No Incentives.**
  *   **Step 5 (Extremal):** Does it break at the top 1%?
      *   *Finding:* Yes. The fastest calls are often the most neglected.
      *   *Result:* Disqualifying.
  *   **Step 6 (Decision):** **REJECT FOR INCENTIVES.**
      *   *Verdict:* You must kill the bonus proposal.
      *   *Reason:* Step 4 (Gaming) is the kill shot. It is trivially easy to reduce AHT by failing callers. Attaching a bonus guarantees volunteers will be pressured to abandon high-need callers. You may track AHT for operational staffing (Monitor Only), but attaching money to it is adversarial optimization against your callers.

  ### Case 2: Reporting "Successful Warm Transfers" to State
  *Proposal: Report number of transfers accepted by receiving agency. No internal bonus, but contract funding depends on reporting volume/quality.*

  *   **Step 1 (Target/Proxy):** Target = Caller gets appropriate external help. Proxy = Receiving agency accepts transfer.
  *   **Step 2 (Causal):** Does agency acceptance mean the caller is helped?
      *   *Finding:* Correlation, not causation. Agency might accept but have no beds/resources.
      *   *Result:* Disqualifying for Incentives. (But this is for reporting).
  *   **Step 3 (Control):** Do we control the outcome?
      *   *Finding:* No. The prompt states the receiving agency controls half, we control none of the *acceptance*. We control the *ask*, they control the *yes*.
      *   *Result:* **Disqualifying (Low Control).**
  *   **Step 4 (Gaming):** Can we game it?
      *   *Finding:* Yes. We can transfer callers who don't need it just to get a "yes," clogging the other agency.
      *   *Result:* Disqualifying.
  *   **Step 5 (Extremal):** Does it break at extremes?
      *   *Finding:* Yes. 100% acceptance rate implies we aren't trying to help the hard cases.
      *   *Result:* Disqualifying.
  *   **Step 6 (Decision):** **REJECT AS A PERFORMANCE METRIC (Even for Reporting).**
      *   *Verdict:* Your instinct that this is "harmless" is wrong.
      *   *Reason:* Step 3 (Control). A metric you cannot control is not a metric of your performance; it is a metric of the other agency's capacity. Reporting this to the State as a measure of *your* success is falsifying data. It invites the State to optimize *your* behavior based on *their* capacity constraints.
      *   *Action:* Negotiate the contract. Report "Transfer Attempts" (which you control) and "Transfer Acceptances" (labeled explicitly as external capacity data). Do not combine them into a "Success Rate." If the State insists on a Success Rate for funding, you are being funded on noise. Flag this in writing as a data validity risk.

  ### Case 3: First-Call Resolution (FCR)
  *Proposal: Continue using FCR as the primary measure of responder effectiveness.*

  *   **Step 1 (Target/Proxy):** Target = Caller less desperate. Proxy = Responder marks "Issue Resolved."
  *   **Step 2 (Causal):** Does marking "Resolved" mean they are less desperate?
      *   *Finding:* No. It means the Responder *believes* they are.
      *   *Result:* Disqualifying for Incentives.
  *   **Step 3 (Control):** Do responders control this?
      *   *Finding:* High control. They check the box.
      *   *Result:* Sufficient.
  *   **Step 4 (Gaming):** Can they game it?
      *   *Finding:* Yes. They can check "Resolved" on every call. There is no audit.
      *   *Result:* Disqualifying.
  *   **Step 5 (Extremal):** Does it break at extremes?
      *   *Finding:* Yes. Crisis work is often ongoing. 100% resolution implies superficial engagement.
      *   *Result:* Disqualifying.
  *   **Step 6 (Decision):** **DEMOTE TO OPEN QUESTION.**
      *   *Verdict:* Stop using this as a performance measure, even for monitoring.
      *   *Reason:* Step 4 (Gaming) + Lack of Audit. A self-reported metric with no verification is not data; it is affirmation. It tells you what your staff want to believe, not what happened.
      *   *Action:* Change the metric to "Caller Feedback Survey" (external validation) sent to 5% of callers. Until then, treat FCR as "Staff Confidence," not "Resolution." Do not put it on the dashboard. It is a vanity metric that masks failure.

  ---

  ## Failure Modes of the Proxy Stress Test

  You asked for candor regarding the procedure itself. The PST is a tool, not a truth machine. It has four specific failure modes you must guard against.

  **1. Weaponized Selectivity (The User Bias Mode)**
  *   **The Risk:** You will be tempted to apply the PST rigorously to metrics you dislike (like AHT) and skim over the steps for metrics you like (like FCR).
  *   **The Safeguard:** You must document the PST worksheet for *every* proposed metric, including your favorites. If you cannot produce the paper trail for a metric currently in use, that metric is operating on authority, not evidence.
  *   **The Limit:** This procedure cannot stop you from lying to yourself on the paper. It relies on your intellectual honesty.

  **2. The False Negative (The Innovation Killer)**
  *   **The Risk:** The PST is conservative. It favors "Monitor Only" over "Incentivize." If you follow it strictly, you may end up with a dashboard full of numbers and no way to motivate staff.
  *   **The Safeguard:** When the PST returns "Monitor Only," you must actively design a *qualitative* reward system (recognition, narrative feedback) to fill the void. If you remove the number without replacing the motivation, morale will crash.
  *   **The Limit:** The PST tells you what *not* to do. It does not tell you how to lead.

  **3. The Goal Illusion (The Target Failure)**
  *   **The Risk:** The PST assumes Step 1 (Define the Target) is solvable. It is not. "Callers leaving less desperate" is not a well-defined variable. If your Target is vague, the PST will validate proxies that measure the wrong thing precisely.
  *   **The Safeguard:** You must treat the Target as a hypothesis, not a fact. Re-run Step 1 every six months.
  *   **The Limit:** This procedure cannot measure whether a caller was helped. It can only tell you if your measurement of help is broken. It optimizes the map, not the territory.

  **4. The Bureaucratic Shield (The Accountability Dodge)**
  *   **The Risk:** Staff will learn to use the PST to avoid responsibility. "I can't be measured on that, the PST says it's Adversarial Goodhart."
  *   **The Safeguard:** The PST determines *how* we measure, not *if* we are accountable. A "Monitor Only" verdict still requires the team to explain the trends in that metric.
  *   **The Limit:** This procedure cannot create a culture of ownership. It can only prevent a culture of gaming.

  ### Final Statement of Limits
  The Proxy Stress Test will not tell you if your hotline is working. It will not tell you if a donor's money is saving lives. It will not tell you if a volunteer is kind.

  It will only tell you if the numbers you are looking at are lying to you.

  In your position, preventing the lie is the highest form of truth-telling available. Use the procedure to protect your staff from the numbers, so they can protect the callers from the crisis.
