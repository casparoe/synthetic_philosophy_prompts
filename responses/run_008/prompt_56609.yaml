      *   **Case 3: First-Call Resolution.**
          *   Goal: Problem solved.
          *   Measurement: Self-reported by responder? Or caller survey?
          *   User hint: "Number we cannot audit stand in for a question we never ask."
          *   Verdict: DEMOTE. It's a proxy that looks causal but is actually extremal/adversarial if incentivized. Even for monitoring, it's noisy.

  4.  **Addressing Commitment 2 (Procedure's Failure Modes):**

      *   Must be candid.
      *   Mode 1: User Bias (Weaponization).
      *   Mode 2: False Precision (Thinking the procedure solves the measurement problem).
      *   Mode 3: The "Goal" Problem (The procedure assumes we know the goal, but we don't really).
      *   Limit: It cannot measure "less desperate."

  5.  **Refining the Tone:**

      *   Professional, direct, empathetic to the operational reality.
      *   No fluff.
      *   Acknowledge the user's expertise (don't explain Goodhart, apply it).
      *   Adhere strictly to the "Take Positions" constraint. No hedging.

  6.  **Final Review against Constraints:**

      *   <1 hour on paper? Yes, the procedure is a checklist.
      *   Taxonomy embedded? Yes (Causal, Adversarial, Extremal, Regressional translated into questions).
      *   Distinguish No vs. Monitoring? Yes.
      *   Mark Human Judgment points? Yes.
      *   Run 3 cases? Yes.
      *   Describe Procedure's Failure Modes? Yes.
      *   Take Positions? Yes.

      *(Self-Correction during drafting)*: I initially thought about making the procedure very detailed. But the user said "on paper, under an hour." I need to keep the questions sharp. I also need to make sure I don't just say "Goodhart Type 3." I need to describe the *mechanism* (e.g., "Does optimizing this break the thing?").
      *Correction on Case 2:* The user says "receiving agency controls half... we control none of." That's an exaggeration for effect, but I should treat it as "Low Control." If we report it, does it cause *us* to game it? If the state uses it for funding, yes. I need to check if the *State* attaches consequences. The prompt says "asks us to begin reporting." Usually implies contract compliance. I will treat "Reporting to Funder" as "Consequence Attached" because funding is at stake.
      *Correction on Case 3:* The user suspects it should be demoted. I need to follow the procedure to that conclusion honestly.

      *Final Polish on the "Take Positions" constraint:* I need to make sure I don't say "It depends." I will say "If X, then Y." I will define the thresholds.

      *Let's build the Procedure.*
      Name: The Proxy Stress Test (PST).
      Steps:
      1. Define Target.
      2. Causal Check.
      3. Control Check.
      4. Gaming Check.
      5. Extremal Check.
      6. Consequence Decision.

      *Wait, one nuance:* The user wants the *theory* to do the work inside the steps. So instead of "Is there Adversarial Goodhart?", ask "If someone tried to cheat this, how easily could they do it without helping the caller?"

