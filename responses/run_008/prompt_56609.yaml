          *   Q2: Does X cause Goal? (Causal).
          *   Q3: Can we fake X? (Adversarial).
          *   Q4: Does X break at high levels? (Extremal).
          *   Q5: Who controls X? (Causal/Adversarial).
          *   *Decision Rule:* If Q3 is "Yes, easily" -> NO. If Q5 is "Low control" -> MONITOR ONLY. If Q4 is "Yes" -> CAP IT (Monitor only above threshold).

      *   *Polishing for the User:* The user knows the theory. I need to speak their language but make it actionable for their staff. Use "Proxy" and "Target."
      *   *Constraint Check:* "Under an hour, on paper." Keep it concise. "Take positions." I must define the thresholds.

  3.  **Running the Cases:**

      *   **Case 1: AHT Bonus.**
          *   Goal: Efficiency vs. Care.
          *   Causal: Shorter calls *might* mean efficiency, but likely mean cutting people off.
          *   Adversarial: Supervisors can pressure volunteers to hang up.
          *   Verdict: FAIL. (Adversarial risk too high for bonus).
      *   **Case 2: Warm Transfers (Reporting).**
          *   Goal: Getting callers to right help.
          *   Control: Receiving agency controls acceptance. We control half.
