          *   Distinguish "Plain No" (never attach consequences) vs. "Monitoring Only" (track but don't reward).
          *   Mark points requiring human judgment (no masking as findings).
          *   Embed Goodhart modes (regressional, causal, extremal, adversarial) into the steps without jargon.
          *   Resolve tensions with definite rules (e.g., imperfect vs. rewarded).
