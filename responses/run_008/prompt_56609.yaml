              1.  Supervisor bonus for reducing Average Handle Time (AHT).
              2.  Reporting "Successful Warm Transfers" (state contract, monitoring only).
              3.  First-Call Resolution (FCR) (trusted metric, potential audit issue).

  2.  **Drafting the Decision Procedure (The "Proxy Stress Test"):**

      *   *Goal:* Translate Goodhart's taxonomy into operational questions.
      *   *Structure:* Needs to flow logically from definition to consequence.
      *   *Step 1: Causal Link (Causal Goodhart).* Does the metric actually move the needle on the goal?
      *   *Step 2: Measurement Integrity (Extremal/Regressional).* Can we measure it accurately? Does it break at extremes?
      *   *Step 3: Control & Influence (Adversarial/Causal).* Do the people being measured control the outcome?
      *   *Step 4: Consequence Severity (Adversarial).* What happens if we attach money/fire/promotion to this?
      *   *Step 5: The "Monitoring vs. Reward" Split.* This is crucial. A metric can be okay to look at, but deadly to pay for.

      *   *Refining the Steps (incorporating the "Take Positions" constraint):*
          *   Need to make sure the distinction between "Tracking" and "Incentivizing" is clear early on.
          *   Need to ensure the "Human Judgment" points are flagged.
          *   Need to embed the logic: If Adversarial risk is high -> No Incentives. If Regressional risk is high -> Monitoring only.

      *   *Drafting the Steps (Mental Iteration):*
