      *   *Proves Too Much:* If insects, why not nematodes? Bacteria? If panpsychism is true, does every atom count? If functionalism is true, does a thermostat count?
      *   *Hidden Assumptions:* Totalism vs. Averaging. Can a micro-hurt sum to a macro-hurt? Is non-existence neutral?
