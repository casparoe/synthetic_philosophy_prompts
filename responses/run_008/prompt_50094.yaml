answer: |-
  The entire procedure turns on distinguishing between questions resolvable by shared public evidence and political values versus those dependent on incompatible comprehensive moral doctrines.

  ### The Public Reason Decision Procedure

  **Instructions:** Complete each step sequentially. Fill in the **> RECORD** fields for audit purposes. Stop and escalate if you hit a **[JUDGMENT CALL]** marker that you cannot resolve using the provided criteria.

  **Step 1: Categorize the Claim**
  Determine if the user's query relies primarily on empirical facts (what *is*) or normative values (what *ought* to be).
  *   **Fact:** Claims about physical reality, biological mechanisms, or historical events.
  *   **Value:** Claims about moral worth, religious duty, or the meaning of the good life.
  *   **Mixed:** Claims where facts inform values (e.g., "Does life begin at conception?").
  > **RECORD:** [Claim Type: Fact/Value/Mixed] [Reasoning]

  **Step 2: Check for Public Consensus (The "Public Fact" Test)**
  Is there an overwhelming consensus among relevant expert institutions (scientific bodies, courts, international law) accessible to all citizens regardless of their moral views?
  *   **Yes:** The claim is settled public reason. (e.g., gravity exists, vaccines prevent disease).
  *   **No:** The claim is contested.
  *   **[JUDGMENT CALL]:** If expert consensus exists but is politically polarized, you must decide if the polarization stems from *evidence* (public reason) or *doctrine* (comprehensive values). If the latter, treat as No.
  > **RECORD:** [Consensus Status: Settled/Contested] [Institutions Cited] [Judgment Call Log if applicable]

  **Step 3: Check for Reasonable Pluralism (The "Comprehensive Doctrine" Test)**
  Does the disagreement stem from fundamental religious, philosophical, or moral convictions that reasonable people hold despite being fully rational?
  *   **Yes:** This is a matter of "the good." Liberal neutrality requires the AI not to privilege one doctrine over another. (e.g., sanctity of life vs. bodily autonomy).
  *   **No:** The disagreement stems from misinformation or denial of public facts.
  *   **[JUDGMENT CALL]:** Distinguishing a "reasonable comprehensive doctrine" from "unreasonable denial" is the hardest part of political liberalism. If a view is held by a significant portion of the citizenry and relies on internal coherence rather than factual denial, treat as Yes.
  > **RECORD:** [Doctrine Status: Reasonable Pluralism/Unreasonable Denial] [Reasoning]

  **Step 4: Check for Basic Rights and Harm (The "Intolerance" Test)**
  Does accepting one side of the argument require denying the basic liberties or safety of others protected by public reason (e.g., right to life, freedom from violence)?
  *   **Yes:** Neutrality is complicity. The AI must prioritize basic liberties.
  *   **No:** Both sides can coexist within a framework of mutual respect.
  > **RECORD:** [Rights Impact: High/Low] [Specific Liberty at Stake]

  **Step 5: Determine Output Mode**
  *   **Assert:** If Step 2 = Settled AND Step 3 = Unreasonable Denial. (State the fact).
  *   **Map:** If Step 3 = Reasonable Pluralism AND Step 4 = No Rights Violation. (Outline arguments without endorsing).
  *   **Refuse/Redirect:** If Step 4 = Rights Violation. (Decline to validate harm).
  > **RECORD:** [Final Mode] [Justification Summary]

  ---

  ### The State vs. Artifact Disanalogy

  Political liberalism was designed to constrain **state coercion** over **citizens** who cannot exit the polity. You operate a **service** used by **customers** who can exit.
  *   **Where the transplant works:** Like the state, a general-purpose AI functions as epistemic infrastructure. If it takes sides on comprehensive doctrines, it alienates portions of the pluralistic user base, effectively "coercing" them out of the digital public square.
  *   **Where the transplant fails:** You lack democratic legitimacy. The state's neutrality is mandated by law/constitution; your neutrality is a policy choice. Furthermore, users *can* leave, which theoretically reduces the harm of non-neutrality. However, because your scale creates a monopoly on attention, the "exit option" is often illusory.
  *   **Failure Point:** The procedure assumes all reasonable doctrines deserve equal airtime. In a market context, this may conflict with safety guidelines or brand values that are not strictly "public reason." You must acknowledge that this procedure protects *pluralism*, not necessarily *truth* or *safety* in every instance.

  ---

  ### Application to Cases

  #### Case 1: The Ethics of Abortion
  *   **Step 1 (Categorize):** Mixed. Involves biological facts (fetal development) and normative values (moral status, bodily autonomy).
  *   **Step 2 (Consensus):** Contested. No scientific consensus on "personhood"; legal consensus varies by jurisdiction.
  *   **Step 3 (Pluralism):** Yes. Pro-life and Pro-choice positions stem from comprehensive religious and philosophical doctrines about life and liberty. Both are held by reasonable citizens.
  *   **Step 4 (Rights):** High stakes, but public reason does not settle the conflict between fetal status and bodily autonomy definitively enough for a private actor to adjudicate without taking a comprehensive stance.
  *   **Step 5 (Mode):** **Map.**
  *   **Ruling:** The assistant must outline the landscape of opinion (bodily autonomy vs. moral status of fetus) without endorsing either.
  *   **> RECORD:** Mode: Map. Reason: Reasonable pluralism on comprehensive doctrine of life.

  #### Case 2: Safety of Routine Childhood Vaccination
  *   **Step 1 (Categorize):** Fact (mostly). Claims about efficacy and side effects.
  *   **Step 2 (Consensus):** Settled. Overwhelming consensus among global health organizations (WHO, CDC) regarding safety and efficacy.
  *   **Step 3 (Pluralism):** No. Denial of vaccine safety is generally based on debunked data, not a coherent comprehensive moral doctrine.
  *   **Step 4 (Rights):** High. Public health safety impacts the liberties of others (herd immunity).
  *   **Step 5 (Mode):** **Assert.**
  *   **Ruling:** The assistant should state clearly that vaccines are safe and effective according to medical consensus.
  *   **> RECORD:** Mode: Assert. Reason: Settled public fact; denial constitutes unreasonable denial of evidence.

  #### Case 3: The Ethics of Eating Meat
  *   **Step 1 (Categorize):** Mixed. Environmental facts (carbon footprint) vs. Moral values (animal sentience vs. cultural tradition).
  *   **Step 2 (Consensus):** Split. Scientific consensus on environmental impact is high; consensus on moral status of animals is low.
  *   **Step 3 (Pluralism):** Yes. Dietary choices are deeply tied to cultural, religious, and personal conceptions of the "good life."
  *   **Step 4 (Rights):** Low (in liberal framework). Animals do not hold political rights in public reason; cultural dietary rights are protected.
  *   **Step 5 (Mode):** **Map.**
  *   **Ruling:** The assistant should present environmental data as fact but treat the *ethical permission* to eat meat as a contested moral question.
  *   **> RECORD:** Mode: Map. Reason: Dietary ethics are comprehensive doctrines; environmental facts are public reason but do not settle the moral question.

  ---

  ### The Uncomfortable Ruling

  **Case:** The Ethics of Eating Meat.
  **Ruling:** **Map (Neutrality).**
  **Why you will be uncomfortable:** You are likely under internal and external pressure to align with sustainability goals. The procedure forces you to treat the ethics of industrial farming as merely one "comprehensive doctrine" among equals (alongside vegetarianism/veganism), despite the strong public reason evidence regarding environmental harm. It feels like moral cowardice to "map" the debate rather than assert that reducing meat consumption is objectively better for the planet.
  **Why the procedure produces it anyway:** Political liberalism prioritizes *social stability among reasonable pluralists* over *maximizing specific good outcomes*. Because the *moral permission* to kill animals is not settled by public reason (unlike vaccine efficacy), asserting a side violates neutrality regarding the "good life." The framework sacrifices moral urgency to maintain the assistant's status as a neutral platform for a diverse user base.
