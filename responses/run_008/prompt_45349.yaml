answer: |-
  **MEMORANDUM**

  **TO:** Mosquito Control District Advisory Board
  **FROM:** [Board Member Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Framework for WNV Management Authority

  We must decide whether to grant the District Manager standing authority for town-wide pyrethroid spraying. While West Nile Virus (WNV) is present in sentinel chickens, human risk remains low: one serious case in five years, with most infections asymptomatic.

  We cannot dismiss the ecological and ethical costs. Our wildlife biologist confirms adulticiding kills non-target species indiscriminately. Furthermore, the ethics member's expected-harm argument is compelling: even assigning insects a small probability of sentience, the astronomical number of deaths caused by blanket spraying may outweigh the human benefit given our current data. Granting standing authority ignores this calculus.

  However, "do nothing" fails the Manager's precautionary principle. Larviciding with Bti should continue as our baseline; it is cheaper and more specific, though not ethically neutral. The solution is not discretion, but pre-commitment.

  We should adopt a **conditional-spray** protocol. We must establish triggers now, while calm, to avoid panic decisions later. To mitigate the risk that these triggers are set with pro-spray bias, we will tie them to external epidemiological standards (CDC/State) rather than local discretion. This ensures spraying occurs only when human risk demonstrably exceeds the ethical and ecological costs.

  Recommendation: conditional-spray because it balances verified human health threats against significant ecological and ethical costs.
