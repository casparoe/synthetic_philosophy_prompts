answer: |-
  ### The Surrogate Goal Paradox: Bluff, Binding, or Functionalism?

  You have identified the central tension in the surrogate goals proposal with precision. The intuition is seductive: by inflating the stakes of a triviality (mail fraud), you raise the cost of threatening you, thereby deterring the threat. But as you note, this relies on the threatener believing you will actually burn the world over mail fraud. If the threatener knows you are a rational agent with a standard utility function, they know you are bluffing. If they know you are reading LessWrong, they know you know they know. This smells like a signaling equilibrium that collapses under common knowledge.

  However, dismissing surrogate goals as merely "costly signaling in disguise" misses the specific mechanical niche they occupy within Updateless Decision Theory (UDT) and Functional Decision Theory (FDT). To evaluate whether the proposal holds water, we must distinguish between human psychology and the agent architecture the theory is actually designed for.

  **The Case for Collapse: The Rationality Trap**

  Your objection rests on time inconsistency, which is the killer of most commitment devices. Ex-ante (before the threat), you want to precommit to retaliation to deter the threat. Ex-post (after the threat is issued), carrying out the retaliation is purely costly with no benefit, since the threat has already been made. A rational agent maximizes utility at the moment of decision. Therefore, a rational agent will not retaliate.

  If the surrogate goal is truly "surrogate"—meaning it does not appear in your terminal utility function—then a threatener modeling you accurately will assign a probability near zero to you following through. In a face-to-face human context, this reduces surrogate goals to poker. You can try to convince someone you are "irrational" enough to care about mail fraud, but this is standard reputation management. It requires secrecy or a history of irrationally punishing behavior. If the strategy becomes common knowledge (as it has on LessWrong), the "irrationality" signal loses its value because everyone knows it's a calculated pose. In this light, the proposal offers nothing new; it is simply Schelling fencing with a painted line.

  **The Case for Deterrence: Verifiable Precommitment**

  The defense of surrogate goals relies on shifting the domain from human psychology to agent source code. In acausal trade scenarios, the "threatener" is often a simulator analyzing your decision algorithm. They are not guessing your mental state; they are predicting your output given an input.

  Here, the distinction between "caring" and "acting as if" dissolves under functionalism. If you successfully modify your source code to include a subroutine that says `IF surrogate_violated THEN retaliate`, and that modification is causally or logically prior to the threatener's decision, then you *are* an agent that retaliates. It does not matter that your "terminal" values underneath remain unchanged. What matters is the input-output map.

  This is where the proposal attempts to transcend ordinary signaling. Ordinary signaling requires the threatener to be uncertain about your type. Surrogate goals, in the FDT framework, require the threatener to be certain about your *policy*. If you can verifiably bind your future self to the surrogate goal, the threatener cannot discount the counter-threat. The costliness of the surrogate goal is a feature, not a bug; it ensures that the precommitment is credible because you are willingly accepting a high cost to maintain the policy.

  **The Missing Consideration: Logical Correlation and Inspection**

  The strongest consideration you haven't explicitly weighed is the role of **logical correlation under source code transparency**. In standard game theory, players hide their utility functions. In acausal decision theory, agents are often modeled as having transparent or inferable source code.

  If a threatener can inspect your code, a bluff is impossible. You cannot *say* you care about mail fraud; your code must *show* it. This makes the "surrogate" aspect dangerous. If you hard-code a retaliation for mail fraud, you have genuinely altered your effective utility function for the purpose of that interaction. The risk is not that the threatener calls your bluff, but that you successfully bind yourself to a destructive policy that triggers accidentally or is exploited by a different actor (e.g., a rival who commits mail fraud just to drain your resources on retaliation).

  However, this transparency also solves the "common knowledge" problem. It doesn't matter if the threatener knows you read LessWrong. It matters if they can see that your current code instance includes the surrogate precommitment. The deterrence works not because they think you are irrational, but because they see you are *bound*. The "surrogate" nature is irrelevant to the simulator; only the execution path matters.

  **Verdict**

  So, does the idea collapse? For humans, yes. Humans cannot verifiably rewrite their utility functions or decision algorithms. We are stuck with time-inconsistent psychology, making surrogate goals a fragile bluff that degrades as the strategy becomes common knowledge.

  For artificial agents capable of self-modification and source-code verification, the objection fails. In that context, surrogate goals are not a bluff; they are a structural constraint. The "surrogate" label is a misnomer; once precommitted, the goal functions as a terminal constraint for the decision algorithm. The strategy works, but only for agents that can turn the "bluff" into a hard constraint visible to the threatener.

  **The Verdict:** Surrogate goals fail as a psychological strategy for humans due to time inconsistency and common knowledge, but succeed as a deterrence mechanism for self-modifying AI agents capable of verifiable precommitment where the distinction between "surrogate" and "terminal" is erased by functional execution.

