  *(Final check on the friend's argument)*: The friend says "anything else couldn't be recognized, so by (1) it wouldn't be a case of meaning anything at all." This assumes that if *I* can't recognize it, it *isn't* meaning. But Grice says meaning exists if the intention is *there*, even if communication fails. Wait, Grice's definition of $meaning_{nn}$ usually requires the intention to be *fulfilled* for successful communication, but the *meaning* itself is tied to the intention. Actually, Grice's 1957 paper defines meaning in terms of the intention. Whether the hearer *actually* recognizes it is a condition for the *success* of the act, not necessarily the existence of the meaning state. But the friend argues if it *can't* be recognized, it's not meaning. This is the "normativity" slip. I need to highlight that distinction.

