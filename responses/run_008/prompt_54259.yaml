  NATIONAL DISASTER CLASSIFICATION BOARD
  Memorandum of Determination
  Case File: 89-Alpha-Region 4
  Date: 14 October 2023
  Subject: Statutory Classification of Food Security Event

  Pursuant to the Disaster Relief and Liability Act of 1998, the Board has convened to determine whether the ongoing mortality event in Region 4 qualifies as a "Natural Disaster" (Section 12a) or a "Man-Made Event Subject to Political Responsibility" (Section 12b). This classification dictates eligibility for automatic relief funds versus liability adjudication. The Board's mandate is to assess the etiology of the scarcity, not the morality of the outcome.

  The Board reviewed agricultural yield data and distribution logs for the fiscal year. Caloric availability per capita remained at 105% of the five-year average. Grain exports from Region 4 totaled 45,000 tons during the peak mortality period, exceeding previous non-famine cycles by 12%. State silos maintained 88% capacity throughout the quarter. Consequently, no aggregate food shortage occurred. The supply chain functioned within standard deviation; food did not vanish, it moved.

  Mortality correlates strictly with exchange entitlement collapse. Labor wages declined 40% coincident with a 200% increase in retail grain prices. Affected populations consisted exclusively of landless laborers and smallholders; populations with fixed asset entitlements or state salaries experienced no increase in mortality. The event selectively targeted those unable to command food through legal market means. Notably, the famine observed standard business hours and respected property lines, sparing those with secure claims on the harvest. This selectivity suggests a mechanism distinct from indiscriminate natural phenomena, such as drought or blight, which typically affect all biological consumers within a geography regardless of solvency.

  Annex C contains testimony from Dr. H. L. Merrick, Senior Economist. Dr. Merrick argues that because starvation resulted from wage suppression and export policy rather than crop failure, the event constitutes an entitlement failure, not a natural phenomenon. He posits that market mechanics in this instance were regulated by state licensing and tariff structures, rendering the outcome a function of policy choices rather than environmental variance. He contends that labeling this "Natural" obscures the causal chain of regulatory permission.

  The Board notes Dr. Merrick's distinction but finds it statutorily irrelevant. Section 12a defines "Natural" as any event not involving direct physical confiscation of goods by state agents. Since grain remained legally purchasable and no state officer physically prevented consumption, the mechanism of starvation is deemed market-mediated. Market fluctuations, even those exacerbated by regulatory inaction, are classified as environmental forces akin to weather patterns. The inability to pay is categorized as a private economic condition, not a public political act. To classify policy-induced price variance as "Man-Made" would require the Board to adjudicate the naturalness of market forces, which falls outside our technical purview. We treat the market as a ecosystem; if a species starves because it cannot hunt, the fault is not with the forest.

  Therefore, the event is classified as a Natural Disaster. Relief funds are authorized under the Act of God provision. Claims of political responsibility are dismissed as lacking causal proximity. The Board concludes that while the suffering is acute, the origin is impersonal.

  Signed,
  Director J. Vane
  National Disaster Classification Board
