answer: |-
  You have stumbled upon the central tension in collapse studies: the difference between the fate of a *population* and the fate of a *project*. Your verdicts are not inconsistent, nor are they purely driven by a bias for monuments. However, the principle guiding them is not the economic one (Tainter's marginal returns) nor purely the aesthetic one (monumentality).

  The coherent principle underlying your judgments is **The Continuity of Generative Identity.**

  ### The Principle Defined
  A society **collapses** when the specific socio-political mechanism that generated its distinctiveness ceases to function and cannot be reconstituted by its descendants, resulting in a rupture of self-identification.
  A society **transforms** when that mechanism fractures, migrates, or mutates, but remains operable and recognizable to the participants as the same continuing project.

  This distinguishes three layers:
  1.  **Biological:** Do the people survive? (Almost always yes).
  2.  **Cultural:** Do the habits/language/beliefs survive? (Often yes).
  3.  **Generative:** Does the *system* that organized those people into that specific configuration survive? (This is your metric).

  ### Applying the Principle to Your Verdicts

  **1. Mycenae (Collapse):**
  *   **Verdict:** Correct.
  *   **Why:** The palace was the generative engine (redistribution, literacy, specialized craft). When it burned, the *capacity* to be Mycenaean vanished. The descendants lived in villages, but they did not know they were Mycenaean. The "story" stopped being told. The mechanism was not reconstituted for centuries.

  **2. Terminal Classic Maya (Transformation):**
  *   **Verdict:** Correct.
  *   **Why:** The Southern cities failed, but the *institution of Kingship* and the *calendar system* migrated North (Chichén Itzá, Mayapán). A Maya person in 900 CE and a Maya person in 1100 CE would recognize the same cosmic order and political logic, even if the capital moved. The project continued.

  **3. Cahokia (Collapse):**
  *   **Verdict:** Correct.
  *   **Why:** This is the strongest test of your principle because there are no texts. Cahokia was a generative hub. When it dispersed, the *centralizing capacity* vanished. The people were absorbed into Mississippian cultures, but the specific "Cahokian project" (the mound-building polity of that scale and configuration) was not reproduced, nor was its memory retained. The mechanism died.

  **4. Greenland Norse (Collapse):**
  *   **Verdict:** Correct.
  *   **Why:** This is a "clean" collapse. The community did not just reorganize; it ceased. The generative identity (European Christian farming in the Arctic) proved non-viable. There was no migration to a new Norse Greenland elsewhere. The project terminated.

  **5. Western Rome (Transformation):**
  *   **Verdict:** Correct (and controversial, which makes it a good test).
  *   **Why:** The Imperial command structure fragmented, but the *Generative Identity* (Roman Law, Latin literacy, the Church) persisted and was adopted by the successor kingdoms. A Frankish king in 600 CE still viewed himself as operating within a Roman conceptual framework. The "software" survived the hardware failure.

  **6. Easter Island / Rapa Nui (Nuanced):**
  *   **Verdict:** Your distinction is vital here.
  *   **Why:** You correctly identify that the *people* did not collapse, but the *moai-raising ritual order* did. This fits the principle: a specific subsystem (the competitive chiefdom monumentality) collapsed, while the broader cultural identity persisted until external contact. This suggests "collapse" can be applied to *institutions* without condemning the *population*.

  ### The Case of the Indus Valley
  **Verdict:** Collapse.

  **Reasoning:** Apply the "Generative Identity" test.
  The Indus Civilization was defined by extreme standardization (bricks, weights), urban planning, and a script. Around 1900 BCE, the cities were de-urbanized. The script vanished (and remains unread, implying a break in transmission). The standardized weights disappeared.
  While the population did not vanish (they moved east/south into the Ganges plain and Gujarat), the *mechanism* that made them "Indus" was not reconstituted. The descendants did not preserve the memory of the urban order. The "story" of the Indus stopped being told.
  Like Mycenae and Cahokia, this is a collapse of the *system*, even if it is a transformation of the *people*.

  ### Should You Overwrite Any Judgments?
  Only one requires a slight calibration to maintain consistency with your principle: **Rapa Nui.**
  You currently say "collapse is the wrong frame for the islanders themselves." To be precise, you should say: **"The Rapa Nui *polity* collapsed, but the Rapa Nui *society* transformed."**
  If you accept Rome as a transformation because the "Roman idea" survived in the Church, you must acknowledge that on Rapa Nui, the "Moai idea" died, but the "Rapa Nui idea" survived. Your current verdict is already consistent, but ensure you don't let the survival of the people obscure the death of the specific *institution* you identified.

  ### The Ugly Suspicion: Monumentality and Record-Keepers
  You asked if your principle renders "collapse" as "change that destroyed the record-keepers."
  **Yes. Largely.**

  Your principle relies on **Legibility**.
  *   We know Mycenae collapsed because the writing stopped.
  *   We know Rome transformed because the Church kept writing.
  *   We know Cahokia collapsed because the mounds stopped growing (the only "writing" they had).

  If a society changes drastically but leaves no record of the change, we often default to "collapse" because we cannot see the continuity. If a society leaves records saying "We are still us," we call it transformation.

  **Is the concept still useful?**
  Yes, but only if you restrict its scope.
  1.  **For Archaeologists:** "Collapse" is a technical term for **the rapid loss of socio-political complexity.** It is not a moral judgment. It describes the moment when a society can no longer sustain its peak energy expenditure (monuments, bureaucracy, standing armies). It is useful for studying *fragility*.
  2.  **For The Rest of Us:** The concept is dangerous. It conflates the end of an *elite project* with the end of a *world*. When we say "The Maya Collapsed," we imply the Maya disappeared. They didn't. When we say "Rome Fell," we imply civilization ended. It didn't.

  **The Plain Conclusion:**
  Your intuition is correct. "Collapse" is almost always **the failure of a specific strategy for scaling human cooperation.**
  *   If the strategy is abandoned and forgotten (Mycenae, Cahokia, Indus, Greenland): **Collapse.**
  *   If the strategy is modified but the goal remains the same (Maya, Rome): **Transformation.**
  *   If the strategy is abandoned but the people adapt to a new, sustainable baseline (Rapa Nui post-moai): **Adaptation.**

  Do not overwrite your judgments. They are consistent. But do acknowledge that "Collapse" is a metric of *institutions*, not *people*. It measures the death of the State, not the death of the Society. If you keep that distinction sharp, your principle holds.
