  3.  **Formulate a Coherent Principle:**
      *   The user suspects "Monumentality." I need to test if "Institutional/Cultural Continuity" fits better.
      *   *Hypothesis:* Collapse is the **extinction of the specific socio-political identity and its capacity for self-reproduction**, whereas Transformation is the **persistence of that identity despite structural change.**
      *   *Test against User's Verdicts:*
          *   Mycenae: Identity/Capacity lost (Dark Ages). -> Collapse. (Matches)
