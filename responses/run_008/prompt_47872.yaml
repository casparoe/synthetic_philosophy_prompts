      *   *Revised Principle:* **Collapse is the irreversible loss of the centralizing capacity that defined the society's distinctiveness, such that it cannot be reconstituted by its descendants.** Transformation is when that capacity migrates or mutates but remains operable.

      *   *Wait, let's look closer at the "Monumentality" bias.* The user asks if they should overwrite judgments.
