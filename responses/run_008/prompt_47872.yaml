      *   *The Indus:* Apply the principle. It looks like Mycenae. So, Collapse.
      *   *The "Ugly Truth":* Address the final prompt about "change that looks bad from the outside." Admit that "Collapse" is an elite-centric metric.
      *   *Utility:* Why keep the word? To study the fragility of *scale*, not the fate of *people*.

  8.  **Refining the Principle (Self-Correction during drafting):**
      *   Is it just "Identity"? Cahokia didn't have writing. How do we know they lost memory? Archaeology shows absorption without continuity of the *center*.
      *   Better phrasing: **The termination of the centralizing generative mechanism.**
      *   Mycenae: Palaces generated the economy/culture. Palaces gone = mechanism dead.
