      *   *Refining the Principle:* It's about the **death of the "Story" a society tells about itself.** If the story stops being told (Mycenae, Cahokia, Greenland), it's collapse. If the story continues but the plot changes (Maya, Rome), it's transformation. If a specific chapter ends but the book continues (Rapa Nui Moai), it's a partial collapse.

