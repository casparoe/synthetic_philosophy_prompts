      *   **Specific Question:** Is there a single precise principle? If not, which calls to overturn? What about the Indus Valley? What is the utility of the concept if it's biased?

  2.  **Deconstruct the Verdicts to Find Patterns:**
      *   *Mycenae:* Elite structure gone + *Writing* gone + *Identity* lost (Greek Dark Ages). -> Collapse.
