  # Printable Handout (One-Pager)

  **PHIL 305: Function Intuition Quiz**  
  *Instructions: For each case, select the option that best matches your immediate judgment. There are no right or wrong answers. Do not overthink.*

  **1. The Appendix.** The human appendix is a vestigial trait. It likely aided digestion in ancestors, but now contributes little to digestion, though it may support gut immunity.
  *   (a) It has no biological function.
  *   (b) It has a function in immune support.
  *   (c) It has both a past digestive function and a current immune function.

  **2. Feathers.** Feathers likely evolved for thermoregulation in dinosaurs and were only later co-opted for flight in birds.
  *   (a) The function of feathers is thermoregulation.
  *   (b) The function of feathers is flight.
  *   (c) Feathers have both functions equally.

  **3. Fresh Mutation.** A new genetic mutation arises in a population. It improves digestion immediately, but has not yet been passed to offspring or affected survival rates.
  *   (a) The trait has no function yet.
  *   (b) The trait already has a function.

  **4. The Broken Heart.** A patient has a severe arrhythmia. Their heart is physically present but failing to pump blood effectively.
  *   (a) It still has the function of circulating blood.
  *   (b) It has lost the function of circulating blood.

  **5. The Tire Iron.** You use a tire iron to prop open a car hatchback. It was manufactured to change tires, but is currently holding the hatch.
  *   (a) Its function is to change tires.
  *   (b) Its function is to hold the hatch open.
  *   (c) It performs both functions simultaneously.

  **6. Reading.** Humans can read, but writing is a recent cultural invention. Our brains were not directly selected for literacy.
  *   (a) Reading ability has no biological function.
  *   (b) Reading ability has a biological function.

  **7. The Kidney.** Kidneys filter blood (selected for) but also produce erythropoietin, a hormone regulating red blood cells (a causal side-effect).
  *   (a) The function is filtering blood only.
  *   (b) The functions include filtering and hormone production.
  *   (c) Filtering is the main function; hormone production is secondary.

  **8. Goosebumps.** Piloerection warmed our furry ancestors. On hairless humans, it does nothing useful.
  *   (a) It has no function in humans.
  *   (b) It has a function (e.g., signaling emotion).
  *   (c) It retains its ancestral function.

  **9. Male Nipples.** Male nipples develop because early embryos are female; they serve no reproductive purpose for males.
  *   (a) They have no function.
  *   (b) They have a sensory function.
  *   (c) They have a developmental function.

  **10. Healthy Heart.** In a healthy person, the heart pumps blood and makes a "lub-dub" sound.
  *   (a) The function is pumping blood.
  *   (b) The functions are pumping blood and making sound.
  *   (c) The function is pumping; the sound is a byproduct.

  ***

  # TA Scoring Key & Interpretation Guide

  **Coding Scheme**
  For each question, code the student's answer as **SE** (Selected-Effect/Etiological), **CR** (Causal-Role/Systemic), or **PL** (Pluralist/Hybrid). Some questions are **Controls** (where SE and CR agree).

  | Q# | Case | Option (a) | Option (b) | Option (c) | Type |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | Appendix | **SE** (None) | **CR** (Immune) | **PL** (Both) | Discriminating |
  | **2** | Feathers | **SE** (Thermo) | **CR** (Flight) | **PL** (Both) | Discriminating |
  | **3** | Mutation | **SE** (None) | **CR** (Yes) | *N/A* | Discriminating |
  | **4** | Broken Heart | **SE** (Yes) | **CR** (Lost) | *N/A* | Discriminating |
  | **5** | Tire Iron | **SE** (Design) | **CR** (Use) | **PL** (Both) | Analogical |
  | **6** | Reading | **SE** (None) | **CR** (Yes) | *N/A* | Discriminating |
  | **7** | Kidney | **SE** (Filter) | **PL** (Both) | **SE/CR** (Main) | Nuance |
  | **8** | Goosebumps | **SE/CR** (None) | **CR** (Signal) | **SE** (Ancestral) | Control* |
  | **9** | Nipples | **SE** (None) | **CR** (Sensory) | **CR** (Dev.) | Discriminating |
  | **10** | Healthy Heart| **SE** (Pump) | **CR** (Sound) | **SE** (Byproduct) | **Control** |

  *\*Note on Q8: SE and CR often agree here (No function), unless the student posits a new current role (Signaling).*

  ### Scoring Logic
  Tally the number of **SE**, **CR**, and **PL** responses. Ignore Control questions (Q10, and Q8 if they answer "None") for the primary typology, but use them to check consistency.

  **1. The Etiological/Selected-Effect (SE) Profile**
  *   **Pattern:** High SE count. Specifically chooses "History/Origin" options in Q1, Q2, Q3, Q6.
  *   **Key Indicator:** Asserts that vestigial traits (Appendix, Goosebumps) and Spandrels (Reading) have *no* function, and that broken traits (Heart) *retain* their function.
  *   **Interpretation:** Student views function as inherently historical and normative.

  **2. The Causal-Role (CR) Profile**
  *   **Pattern:** High CR count. Specifically chooses "Current Activity" options in Q1, Q2, Q3, Q6.
  *   **Key Indicator:** Asserts that if a trait *does* something useful now (Appendix immunity, Mutation digestion), it has a function, regardless of history. Likely says the Broken Heart has *lost* its function.
  *   **Interpretation:** Student views function as current contribution to system capacity.

  **3. The Pluralist/Hybrid Profile**
  *   **Pattern:** High PL count (Option C selections) OR a split pattern (e.g., SE for Biology, CR for Artifacts).
  *   **Key Indicator:** Selects "Both" in Q2 (Feathers) or Q7 (Kidney). May treat the Tire Iron (Q5) differently than biological cases.
  *   **Interpretation:** Student believes "function" is context-dependent or ambiguous.

  **4. Inconsistent / "Noise" Profile**
  *   **Pattern:** Fails Control Questions.
  *   **Flag:** If a student answers **Q10 (Healthy Heart)** with Option (b) ("Pumping and Sound"), they are likely conflating *any* causal effect with *function*. This is a naive view distinct from sophisticated CR accounts (Cummins excludes effects that don't contribute to the containing system's capacity).
  *   **Flag:** If a student answers **Q4 (Broken Heart)** with "Lost function" (CR) but **Q1 (Appendix)** with "No function" (SE), they may be inconsistent regarding normativity.

  ### Notes on Indistinguishability & Agreement
  *   **The Agreement Zone (Q10):** In standard, healthy adaptations (Healthy Heart), SE and CR accounts agree. Use Q10 to filter out students who think *every* effect is a function. If they mark "Sound" as a function, they haven't grasped the normative/contributory constraint shared by both major theories.
  *   **The Artifact Problem (Q5):** SE theory is biological; Artifact function is usually Intention-based. If a student answers SE for Bio but CR for Artifacts, this is a sophisticated **Domain-Specific Pluralism**, not confusion.
  *   **The "Byproduct" Ambiguity (Q7/Q10):** Cummins (CR) allows side-effects to be functions *relative to an analytical capacity*, but typically we distinguish "Function" from "Byproduct." Students who mark "Hormone Production" (Q7b) as a full function are leaning toward a broad CR view. Students who mark it as "Secondary" (Q7c) are often intuitively tracking SE without knowing the term.

  ### Non-Standard Combinations
  *   **The "Future-Forward" View:** If a student marks Q3 (Mutation) as "No function" (SE) but Q1 (Appendix) as "Immune function" (CR), they may hold a **Forward-Looking Etiological** view (Function depends on future survival potential, not past history). This is a minority position (e.g., Bigelow & Pargetter) but philosophically coherent.
  *   **The "Malfunction" Confusion:** If a student marks Q4 (Broken Heart) as "Lost function" but Q1 (Appendix) as "No function," check Q8 (Goosebumps). If they say Goosebumps *have* a function, they are likely operating on a **Current Utility** account that struggles with normativity (why is the heart "broken" but goosebumps just "useless"?).
