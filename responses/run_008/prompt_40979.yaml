answer: |-
  ### Translation: The Free Energy Principle in Control Vocabulary

  **The Plant and the Generative Model**
  You view the organism-environment coupling as a nonlinear dynamical system. In FEP, this is the **generative model**: a probabilistic state-space model $p(o, s, u | m)$ describing how hidden states $s$ (plant states) generate observations $o$ (sensor outputs) under control inputs $u$. Crucially, the brain does not have access to the true dynamics; it maintains an internal *approximate* model $q(s, u)$.

  **Variational Free Energy as the Cost Function**
  You know Variational Inference minimizes the KL-divergence between an approximate posterior $q(s)$ and the true posterior $p(s|o)$. FEP defines **Variational Free Energy (VFE)** as:
  $$ F = D_{KL}[q(s) || p(s|o)] - \ln p(o) $$
  Since the brain cannot compute $\ln p(o)$ (model evidence/surprisal) directly, it minimizes $F$ as a tractable upper bound (the negative ELBO). In your vocabulary, $F$ is the **objective function** for the estimator.

  **Perception as State Estimation**
  Minimizing $F$ with respect to the internal states $q(s)$ is **state estimation**. The gradient $\nabla_s F$ is driven by **prediction errors** (innovations), $\epsilon = o - \hat{o}(s)$. Just as a Kalman filter updates $\hat{x}$ to whiten the innovation sequence, the brain updates posterior beliefs to minimize precision-weighted prediction error. This is a continuous-time variational Bayes filter (often implemented as generalized filtering on derivatives of states).

  **Active Inference as Closed-Loop Control**
  Standard control minimizes a cost $J$ by choosing $u$ to drive $y \to r$ (setpoint). In **Active Inference**, actions $u$ are treated as hidden states within the generative model. The system minimizes $F$ with respect to $u$ as well as $s$.
  *   **The Mechanism:** The system expects certain sensations (encoded in the prior $p(o)$). If current sensations violate these expectations, prediction error rises. The system can reduce this error either by updating beliefs (perception) or by changing the world via $u$ so the sensations match the expectation (action).
  *   **The Loop:** This is a feedback loop where the **reference signal is an internal prior expectation**. You act to make the sensory input match the model's prediction, rather than updating the model to match the input.

  ***

  ### Residue Report

  Here is the claim-by-claim analysis of the translation fidelity, addressing your three specific suspicions.

  #### 1. The "No External Objective" Claim vs. Setpoints
  *   **The Claim:** Organisms do not optimize an external cost function; they simply occupy a small set of characteristic states (homeostasis), encoded as priors.
  *   **Control Translation:** This is mathematically isomorphic to **tracking control with an internal reference generator**. In LQR, you minimize $(x - x_{ref})^T Q (x - x_{ref})$. In FEP, you minimize $-\ln p(x)$, where $p(x)$ is a Gaussian peaked at $x_{ref}$.
  *   **Residue:** **Vocabulary/Ontology.** Mathematically, a log-prior on states *is* a quadratic cost on deviation from a setpoint. The distinction is purely ontological: in control theory, the setpoint $r$ is usually exogenous (provided by the user); in FEP, the "setpoint" is endogenous (structural parameters of the estimator). You cannot distinguish them from input-output data alone. The claim that there is "no objective function" is a philosophical stance on the *origin* of the weights, not a difference in the optimization landscape.

  #### 2. The "Perception and Action Minimize the Same Quantity" Claim
  *   **The Claim:** Perception updates $q(s)$ to match $o$; Action updates $u$ to change $o$ to match $q(s)$. Both minimize $F$.
  *   **Control Translation:** This is **Reference Governor logic** or **Model Predictive Control (MPC)** where the reference trajectory is generated by the model's own prior dynamics. You noted this feels "backwards" (moving the plant to match the model). In standard servo control, we move the plant to match a reference $r$. In FEP, the prediction $\hat{o}$ *serves as* $r$.
  *   **Residue:** **Vocabulary.** The "inversion" is verbal, not substantive. In standard control, $u$ is an input distinct from the state. In Active Inference, $u$ is formally treated as a latent variable to be inferred. However, functionally, $\frac{\partial F}{\partial u}$ drives a gradient descent on control inputs that looks exactly like error-driven control ($u \propto -\epsilon$). The only substantive difference is that FEP forces the *same* Lyapunov function ($F$) to govern both the observer and the controller, whereas in LQG, the estimator (Kalman) and controller (LQR) are dual but distinct optimizations.

  #### 3. The "Instantaneous Free Energy to Long-Term Entropy" Slide
  *   **The Claim:** Minimizing instantaneous VFE (a bound on surprisal) minimizes the long-term entropy of the organism's physical states (ensuring survival).
  *   **Control Translation:** This claims that minimizing instantaneous tracking error guarantees **asymptotic stability** and minimizes the stationary distribution entropy of the closed-loop system.
  *   **Residue:** **Genuine Unclarity.** This is the largest gap. In control theory, minimizing an instantaneous cost (like squared error) does not guarantee stability or minimum entropy over an infinite horizon without specific conditions (e.g., observability, controllability, discount factors, or terminal costs). FEP relies on an **ergodicity assumption**: that time-averaged surprise equals ensemble entropy. While plausible for stable systems, the principle often asserts this link as a theorem where a control engineer would demand a Lyapunov stability proof. The jump from "minimizing bound on $-\ln p(o_t)$" to "minimizing entropy of states $H(s)$ over time" assumes the generative model is sufficiently accurate and the dynamics are ergodic, which is not guaranteed by the variational math alone.

  ***

  Residue: The mathematical bridge from minimizing instantaneous variational bounds to guaranteeing long-term entropy reduction of physical states relies on ergodicity assumptions that lack a standard control-theoretic stability proof.
