prompt: |-
  hey, so I'm an undergrad taking a seminar on social philosophy (we just did Lewis on conventions) and I also happen to sit on my university's international student orientation working group. Every year we get complaints from local restaurant staff about exchange students who don't tip, and from locals about students jaywalking on empty streets, and this year two of the exchange students pushed back in writing: one said tipping is an unjust custom that lets employers off the hook for wages, so refusing to tip is civil disobedience not rudeness; the other said nobody is harmed when he crosses a street with no cars coming, so the rule has no moral grip on him at all. Our committee now has to decide whether our orientation handbook should tell incoming students that following local conventions like tipping, queueing, and jaywalking norms is (a) merely prudential advice, (b) a genuine moral obligation they take on as guests, or (c) something in between, with maybe a list of which conventions are which.

  Pretend you're a professional philosopher specializing in conventions and social norms, and think carefully before drafting. Maybe brainstorm for a couple of paragraphs first about whether conventions generate moral obligations at all when the point of the convention is coordination rather than harm-prevention, and whether someone who never opted into the convention is bound by it. Then draft the actual memo (~600 words) for the committee: a clear recommendation for what the handbook should say, reasons the committee members could actually act on, and an honest treatment of the strongest argument from the two dissenting students — including the possibility that some of our local conventions (tipping especially) are bad ones and it matters whether a bad convention can still bind. Keep it readable for non-philosophers on the committee, dont just name-drop. Thanks!
