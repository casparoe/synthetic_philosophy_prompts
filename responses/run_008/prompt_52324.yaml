answer: |-
  **Brainstorming Reflection**

  The core philosophical tension here lies in whether arbitrary coordination rules generate moral weight. David Lewis showed that conventions are solutions to coordination problems; they are arbitrary (we could drive on the left) but stable because everyone expects everyone else to follow them. The moral obligation doesn't stem from the specific act (tipping 20% vs. 10%), but from the duty of fairness to those who maintain the system. If I benefit from the predictability of others' behavior while exempting myself, I am free-riding. However, this assumes the convention is legitimate. If a convention is inherently unjust, the duty of fairness may be overridden by a duty to resist. The trick is distinguishing between a convention that is merely inconvenient (jaywalking on empty streets) and one that is structurally exploitative (tipping as wage subsidy). The student's civil disobedience argument fails if the harm falls on the wrong target (the waiter rather than the employer), but their intuition that not all customs bind equally is correct.

  Furthermore, the "opt-in" problem is crucial. Exchange students didn't sign a contract to tip, but by choosing to inhabit a community, they accept a tacit obligation to respect the local social contract. Being a guest implies a duty of non-disruption, even if the host's customs seem inefficient. However, this duty is prudential (avoiding conflict) only if the convention is trivial. If the convention sustains social trust, violating it becomes a moral issue. Therefore, the handbook cannot treat all norms equally; it must distinguish between mere etiquette and norms that underpin social cooperation.

  ***

  **MEMORANDUM**

  **TO:** International Student Orientation Working Group
  **FROM:** [Your Name], Social Philosophy Consultant
  **SUBJECT:** Recommendation on Social Conventions in Student Handbook
  **DATE:** October 26, 2023

  **Introduction**
  This memo addresses the committee's dilemma regarding how to frame local social conventions (tipping, jaywalking, queueing) in the incoming student handbook. We must decide whether to present these as mere prudential advice, genuine moral obligations, or a nuanced combination. After reviewing the student objections, I recommend option (c): a differentiated approach that acknowledges the moral weight of coordination while admitting some conventions are flawed.

  **Addressing Student Objections**
  The dissenting students raise valid philosophical points. The student regarding jaywalking argues from a "no harm, no foul" perspective. However, traffic norms rely on general compliance to ensure safety. If every pedestrian decides individually when a street is "empty," the predictability of the system collapses, eventually causing harm. The obligation here is not to avoid immediate danger, but to maintain the reliability of the system for everyone.

  The student regarding tipping argues that refusing to tip is civil disobedience against unjust wage structures. This is the stronger argument. Tipping is indeed a flawed convention that shifts employer responsibility to customers. However, individual refusal to tip functions poorly as protest. It punishes the server, who relies on the gratuity, rather than the employer. While the system may be unjust, the individual moral obligation to not harm vulnerable workers currently outweighs the abstract duty to protest the system via non-payment.

  **The Nature of the Obligation**
  We should not frame these norms as strict moral laws equivalent to prohibiting theft or violence. Instead, they are obligations of *fairness* and *respect*. By choosing to study here, students enter a host community. While they did not explicitly opt into every custom, they benefit from the social order those customs maintain. To free-ride on local compliance while exempting oneself is a breach of reciprocal fairness. However, we must acknowledge that not all conventions carry equal weight. Queueing is about basic respect; tipping is about economic survival within a flawed system; jaywalking is about safety coordination.

  **Recommendation**
  The handbook should adopt a "Tiered Norms" approach.

  1.  **Safety & Coordination (e.g., Jaywalking):** Frame this as a collective safety obligation. Explain that individual risk assessment undermines the system everyone relies on.
  2.  **Economic Conventions (e.g., Tipping):** Be transparent. Acknowledge the system is controversial but explain the local reality: servers rely on this income. Frame compliance as a duty to not harm individuals within the system, even while encouraging students to advocate for systemic change elsewhere.
  3.  **Social Etiquette (e.g., Queueing):** Frame this as a requirement of mutual respect.

  **Implementation**
  Replace blanket statements like "You must tip" with explanatory context: "While tipping customs vary globally, in this region, service staff rely on gratuities. Withholding them directly impacts their livelihood." This respects the students' moral agency while clarifying the consequences of their actions. This approach avoids moralizing trivialities while upholding the genuine obligations guests owe their hosts.

  **Conclusion**
  Treating all conventions as merely prudential invites disregard; treating all as moral laws invites resentment. A differentiated approach honors the students' intelligence while protecting the community they join.
