answer: |-
  This is a great request. You're right that the rationalist sphere spent a decade rediscovering epistemology via calibration scores and prediction markets, often bumping into the same walls philosophers hit in the 90s. The "spec" you're asking for is essentially the **data set of intuitions** that any theory of assertion must fit.

  If we treat the "Norm of Assertion" as a function $N(P, Agent, Context) \rightarrow \{Permissible, Impermissible\}$, here are the test cases and constraints the function must satisfy.

  ### I. The Core Desiderata (The Test Suite)

  These are the phenomena any adequate norm must explain. If your norm says "Assert $P$" but the intuition says "That's infelicitous," your norm is under-constrained. If your norm says "Don't Assert $P$" but the intuition says "That was a perfectly reasonable thing to say," your norm is over-constrained.

  **1. The Lottery Constraint (High Credence $\neq$ Assertability)**
  *   **Case:** You hold a ticket in a fair 1-million-ticket lottery. The draw happened but you haven't seen the result. Your credence that you lost is 0.999999.
  *   **Intuition:** It is inappropriate to flatly assert to the ticket holder: "You lost."
  *   **Requirement:** The norm must distinguish between *statistical probability* and *epistemic warrant*. A norm based purely on a credence threshold (e.g., "Assert if $P > 0.9$") fails here. There must be a constraint on the *source* or *structure* of the evidence, not just the magnitude.

  **2. The Fallible Expert Constraint (Falsehood $\neq$ Violation)**
  *   **Case:** A doctor, using all available standard tests and medical knowledge, diagnoses a patient with Condition X and asserts "You have Condition X." The tests were flawed in an undetectable way; the patient has Condition Y.
  *   **Intuition:** The doctor did not violate the norm of assertion. They do not owe an apology for the *assertion*, only for the outcome (perhaps). Contrast this with a liar or a guesser.
  *   **Requirement:** The norm cannot be "Assert only Truth." It must allow for *culpable* vs. *inculpable* falsehood. It must track *process reliability* or *justification*, not just truth conditions.

  **3. The Moore's Paradox Constraint (Belief Alignment)**
  *   **Case:** Asserting "It is raining, but I don't believe it is raining."
  *   **Intuition:** This is logically consistent (it could be raining while you are unaware) but pragmatically absurd/unassertable.
  *   **Requirement:** The norm must link assertion to the speaker's doxastic state. You cannot assert what you take yourself to not believe. This suggests assertion involves representing oneself as believing $P$.

  **4. The Challenge Constraint (Authority to Speak)**
  *   **Case:** You assert $P$. I ask, "How do you know?" or "What's your source?"
  *   **Intuition:** If you answer "I just guessed," you have retroactively admitted you shouldn't have asserted it, even if $P$ turns out true. If you answer "I read it in a reliable journal," the challenge is satisfied.
  *   **Requirement:** The norm must explain why assertion invites challenge and what counts as a valid defense. It implies assertion transfers *epistemic authority* or *responsibility* to the speaker.

  **5. The Hedging Gradient (Speech Act Differentiation)**
  *   **Case:** Comparing "It will rain" vs. "It will probably rain" vs. "I think it might rain."
  *   **Intuition:** These are different moves with different commitment levels. If I say "Probably rain" and it doesn't rain, you can't call me "wrong" in the same way as if I said "It will rain."
  *   **Requirement:** The norm must explain the difference between a *flat assertion* and a *hedged assertion*. If the norm is too loose, flat assertion becomes cheap. If too strict, everyone hedges everything. The norm must explain why we ever choose flat assertion over hedging.

  **6. The Retraction Constraint (Updating)**
  *   **Case:** You assert $P$ at $t_1$. At $t_2$, you learn $\neg P$.
  *   **Intuition:** You are generally required to retract $P$ to the audience you told.
  *   **Requirement:** The norm must bind the speaker to the content over time, not just at the moment of utterance.

  ---

  ### II. Requirements vs. Tribal Shibboleths

  It is crucial to separate the *data* (the intuitions above) from the *theories* (the attempts to explain them). Many rationalists conflate the two.

  | **Constraint** | **Verdict** | **Why?** |
  | :--- | :--- | :--- |
  | **"Must require Truth"** | **Shibboleth** | Fails the Fallible Expert case. If truth were the norm, the doctor violated it. Truth is a *condition of satisfaction*, not necessarily the *norm of permission*. |
  | **"Must require Knowledge"** | **Shibboleth** | This is Williamson's *solution*, not a datum. It fits well, but you can't list it as a requirement without begging the question against Justified Belief norms. |
  | **"Must be Calibrated"** | **Partial Req** | Necessary for the rationalist frame, but insufficient (see Lottery). You can be perfectly calibrated on lottery tickets and still violate the assertion norm. |
  | **"Non-Accidental"** | **Real Req** | This is the cash value of "Knowledge." The connection between your belief and the truth must not be lucky. This is a real constraint derived from Gettier cases. |
  | **"Action-Guiding"** | **Real Req** | Assertions are tools for coordination. If a norm permits assertions that cannot be safely acted upon (e.g., lottery claims), it fails functionally. |
  | **"Folk Alignment"** | **Shibboleth** | Folk usage is messy and inconsistent. A normative theory should *clean up* folk usage, not just mirror it. Don't optimize for "what people say," optimize for "what people *should* say to coordinate." |

  ---

  ### III. The Incompatibilities (The "Impossible Trinity")

  You suspected the Lottery case and the Fallible Expert case pull in opposite directions. You are correct. This is the central tension in the literature.

  **The Tension:**
  1.  **To solve Lottery:** You need a strict norm (like Knowledge). Mere high probability isn't enough. You need a specific connection to the fact.
  2.  **To solve Fallible Expert:** You need a permissive norm (like Justified Belief). You can't require Truth or Knowledge, because the expert had neither (the diagnosis was false, so they didn't know it).
  3.  **To solve Action-Guiding:** You need a stable norm. If we allow justified falsehoods, how do we distinguish them from lucky guesses after the fact?

  **The Trade-off:**
  *   **Strict Norms (Knowledge/Truth):** Protect the audience from error, but stifle communication in uncertain domains (medicine, forecasting, policy). They make the Doctor look like a norm-violator.
  *   **Permissive Norms (Reasonable Credence/Justification):** Allow communication under uncertainty, but struggle to explain why the Lottery assertion is wrong (since the credence is reasonable). They make the Lottery assertor look permissible.

  **Can they be jointly satisfied?**
  Only if the norm distinguishes between **evidential bases**.
  *   *Lottery:* Evidence is statistical/general. (Fails norm).
  *   *Doctor:* Evidence is causal/specific. (Passes norm, even if false).
  *   *Norm Spec:* "Assert $P$ iff your credence in $P$ is high **AND** based on non-statistical, causal/counterfactual-tracking evidence."
      *   *Risk:* This is hard to formalize. What counts as "causal"? Is a really strong statistical correlation (smoking/cancer) different from a lottery?

  ---

  ### IV. The Killer Constraint

  If you want to evaluate existing norms (Knowledge, Truth, Justified Belief, Credence), here is the single constraint that does the most damage to the leading candidates:

  **The "Basis Sensitivity" Constraint (derived from Lottery + Gettier).**

  *   **Why it kills the Truth Norm:** Obviously, because falsehoods are sometimes permissible (Doctor).
  *   **Why it kills the Pure Credence Norm:** Because 99.9% credence in the Lottery is insufficient. It proves that *magnitude of belief* is not the sole variable; *structure of belief* matters.
  *   **Why it hurts the Knowledge Norm:** It forces the Knowledge Norm to explain why we don't "know" the lottery ticket lost. (Williamson says we don't know because it's not safe; others disagree).
  *   **Why it hurts the Justified Belief Norm:** It forces the Justification norm to explain why statistical justification (Lottery) is inferior to perceptual/causal justification (Zebra in the pen), even if the probability is identical.

  **The Spec Summary:**
  An adequate norm of assertion must be **sensitive to the etiology of the belief, not just its probability or truth value.** It must explain why a 99% belief formed via causal tracking licenses assertion, while a 99.9% belief formed via statistical reference classes does not, and why a 99% belief formed via causal tracking that turns out false is still permissible.

  If a norm can't distinguish between the **Lottery Assertor**, the **Doctor**, and the **Lucky Guesser**, it is dead. Most norms fail at least one of these three.
