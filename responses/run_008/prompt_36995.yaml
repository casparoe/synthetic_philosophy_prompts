      *   **Tone:** Analytical, precise, slightly informal but rigorous (matching the "rationalist" vibe), acknowledging the tension between Bayesian credence and folk epistemology.

  2.  **Deconstruct the Problem:**
      *   What is assertion? It's a speech act where you present a proposition as true to an audience, inviting them to rely on it.
      *   What are the competing intuitions?
          *   *Truth:* You shouldn't lie.
          *   *Knowledge:* You shouldn't guess, even if right.
          *   *Justification:* You need evidence.
          *   *Utility/Consequences:* Don't assert if it causes harm (though this is usually pragmatic, not constitutive).
          *   *Credence:* How does 70% confidence map to "It is the case"?
      *   The core tension the user identified: The Lottery Paradox (high prob $\neq$ assertable) vs. The Fallible Expert (low prob/false $\neq$ blameworthy).

  3.  **Brainstorming Desiderata (The "Spec"):**

      *   *D1: The Falsehood Constraint.* You can assert false things *sometimes* (doctor diagnosis), but not *always* (liar). So the norm can't be simply "Assert only Truth." It needs to account for *culpable* falsehood.
      *   *D2: The Lottery Constraint.* High probability isn't enough. 99.9% chance your ticket lost $\neq$ "You lost." Why? Because it's based on statistical chance, not specific evidence.
      *   *D3: The Moore Constraint.* "P but I don't believe P." Logically possible, pragmatically absurd. The norm must explain why this is infelicitous.
      *   *D4: The Challenge/Authority Constraint.* If I assert $P$, you can ask "How do you know?" If I say "I guessed," I've violated something. The norm must support the practice of challenging assertions.
      *   *D5: The Hedging/Grading Constraint.* How does "I think P" differ from "P"? If the norm is too strict, everyone hedges. If too loose, hedging is meaningless.
      *   *D6: The Action-Guiding Constraint.* Assertions are meant to be used for action. If I assert "The train leaves at 5," you should be able to act on it.
      *   *D7: The Retraction Constraint.* If $P$ turns out false, when do I owe an apology? (Calibration vs. Truth).

  4.  **Refining and Categorizing (Requirements vs. Shibboleths):**

      *   *Requirement:* Explaining the lottery intuition is crucial. It distinguishes statistical probability from epistemic warrant.
      *   *Requirement:* Explaining the fallible expert. Distinguishes bad luck from norm violation.
      *   *Shibboleth:* "Must be Knowledge." This is a *candidate solution*, not a desideratum. The desideratum is "Must explain why 'I guessed' is a bad answer to 'How do you know?'"
      *   *Shibboleth:* "Must align with folk usage." Folk usage is messy. The norm should *clarify* usage, not just mirror it.
      *   *Shibboleth:* "Non-accidental." This is vague. Better to phrase as "Anti-Luck."

