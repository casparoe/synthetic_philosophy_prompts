          *   Introduce the "Polysemy" problem. 'Emotion' refers to a cluster, not a single natural kind.
      *   **The Empirical Component:**
          *   Address the Feeling Theory's bottleneck. Interoception granularity is an empirical question (Lisa Feldman Barrett vs. Basic Emotion Theory).
          *   Address Judgmentalism's bottleneck. Cognitive penetrability and sub-cognitive emotional processing (LeDoux's amygdala work).
      *   **Why it Stalled (The "Why" Question):**
