prompt: |-
  quick context: I'm a third-year taking a course on social choice and democratic theory, and we just hit futarchy — Robin Hanson's thing where you vote on values but bet on beliefs. My TA runs a weekly applied section of about 18 students and lets one of us run the session each week; mine's in two weeks and I want to run a live prediction market on the section itself. Design the whole thing for me.

  Constraints: 90 minutes, ~18 students, seminar room with movable desks, no real money allowed — and extra credit is off the table too, dept rules, so it has to be play money with candy/prizes/bragging rights as the payoff. I can print stuff beforehand.

  What I want the game to do, roughly in this order:

  1. A round where markets on things the students themselves will do — attendance at the optional session, average on next week's quiz, which movie we'll vote to watch at end of term — visibly aggregate private information. I want some students holding info cards the others don't have, so when the price moves it's actually information flowing and not just vibes.
  2. The values/beliefs split made concrete: the class votes on something (values) while a separate market runs on what the vote will decide (beliefs), so they can literally see the two channels Hanson separates. And I want at least one moment where holding shares in an outcome changes how people campaign or vote — the self-fulfilling prophecy thing — so we can talk about endogeneity in policy markets.
  3. A manipulation round: give one student a war chest and a mission to push some price somewhere for reasons unrelated to belief. I've read that Hanson thinks manipulators mostly end up subsidizing honest traders, and I want the class to discover for themselves whether soaking up the manipulation subsidy is as easy as it sounds in a market with 18 participants.

  Then the debrief: map each moment onto the actual futarchy machinery — which part was voting on values, which was betting on beliefs, where the market worked as an epistemic instrument vs. where it was just gambling — and be honest about the failure modes I should expect: thin markets, everyone herding on the first quoted price, a couple of sharks doing all the trading while the rest free-ride. Tell me what will predictably go wrong the first time I run it and how to patch it — do I need to act as a market maker with a bid/ask spread, or run call auctions a few times per round, or force minimum trading activity?

  And finally the honest note: what can a 90-minute market with 18 participants genuinely not show about futarchy — I'm guessing scale, liquidity, long horizons, people actually specializing as forecasters — and what I'd have to just assert in the debrief rather than demonstrate. I don't want the game to leave people thinking futarchy is more robust than it is just because the toy version worked, if that makes sense.

  also if you have ideas for handling the student who refuses to trade at all or treats the whole thing as a joke, that'd help. theres always one.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** Third-year student, Social Choice/Democratic Theory course.
      *   **Task:** Design a 90-minute applied section on Futarchy (Robin Hanson's "Vote on Values, Bet on Beliefs").
      *   **Audience:** ~18 classmates, TA-supervised.
      *   **Constraints:** 90 mins, no real money, no extra credit. Payoff = candy/prizes/bragging rights. Movable desks. Can print materials.
      *   **Goals:**
          1.  Demonstrate information aggregation (private info cards).
          2.  Demonstrate Values vs. Beliefs split (vote vs. market) + endogeneity (self-fulfilling prophecy).
          3.  Demonstrate Manipulation (war chest vs. honest traders).
          4.  Debrief: Map to theory, discuss failure modes (thin markets, herding, sharks).
          5.  Honesty Check: What *can't* this demo show? (Scale, liquidity, specialization).
          6.  Edge Case: Handling the non-participant/joker.

  2.  **Deconstruct Futarchy for a Classroom:**
      *   *Core Mechanism:* Decision $D$ is chosen based on $\text{E}[U|D]$.
      *   *Classroom Translation:*
          *   Values = Class preference (Vote).
          *   Beliefs = Probability of outcome given decision (Market).
          *   Utility = Points/Candy.
      *   *Challenge:* Real futarchy uses markets to decide *policy*. A classroom market usually just predicts *events*. I need to bridge this gap carefully.

  3.  **Drafting the Session Structure (90 Minutes):**
      *   *Intro (10 min):* Explain rules, currency, payoff.
      *   *Round 1: Info Aggregation (20 min):* Private info, public price.
      *   *Round 2: Values vs. Beliefs + Endogeneity (25 min):* Vote on goal, market on feasibility, feedback loop.
      *   *Round 3: Manipulation (20 min):* Designated manipulator vs. rest.
      *   *Debrief (15 min):* Theory mapping, limitations, failure modes.
      *   *Buffer:* 5 mins for transitions.

  4.  **Developing Round 1 (Information Aggregation):**
      *   *Goal:* Show price moves with private info.
      *   *Mechanism:* Binary event. "Will the TA bring donuts next week?" (Too random). "Will the average quiz score be > 80%?" (Better).
      *   *Private Info:* Hand out envelopes. Some say "Quiz is easy," some "Quiz is hard," some "No info."
      *   *Trading:* Open outcry or call auction? Call auction is easier for 18 people in 90 mins. Let's do 3 rounds of clearing.
      *   *Payoff:* Correct prediction = candy.

  5.  **Developing Round 2 (Values/Beliefs + Endogeneity):**
      *   *Goal:* Separate vote (what we want) from market (what will happen). Show market affecting outcome.
      *   *Decision:* "Should we have a 5-minute dance break now or at the end?"
      *   *Values:* Vote on preference (Dance Now vs. Dance End).
      *   *Beliefs:* Market on "Will the class finish the agenda if we dance now?"
      *   *Endogeneity Trick:* If the market says "Low probability of finishing," the TA (or instructor rules) might cancel the dance. *Correction:* To make it truly endogenous, the *decision* must depend on the market.
      *   *Revised Plan:* The class votes on a *goal* (e.g., "Maximize Candy Distribution"). The market predicts the outcome of two *policies* (Policy A: Random Giveaway, Policy B: Quiz Winner Take All). The policy with the higher expected payout is chosen.
      *   *Wait, simpler:* Let's stick closer to Hanson.
      *   *Vote:* Class votes on what they value (e.g., "Everyone gets candy" vs. "Best traders get candy").
      *   *Market:* Market predicts "Will the chosen value be achievable?"
      *   *Endogeneity:* If the market predicts failure, the rule changes.
      *   *Better Idea for Endogeneity:* The "Self-Fulfilling Prophecy."
          *   Policy: "If Market Price > 50c, we do X. If < 50c, we do Y."
          *   Students trade on X. If they believe X is good, they buy, pushing price up, triggering X.
          *   *Actually, let's keep it tight:*
          *   Step 1: Vote on *Objective* (e.g., "Order Pizza" vs. "Order Tacos"). This is Values.
          *   Step 2: Market on *Feasibility* (e.g., "Will Pizza arrive within 30 mins?"). This is Beliefs.
          *   Step 3 (Endogeneity): The decision to order depends on the market price. If Price < 40c, we don't order. Students who want pizza *must* trade to raise the price. This links belief trading to policy enactment.

  6.  **Developing Round 3 (Manipulation):**
      *   *Goal:* Can honest traders correct a manipulator?
      *   *Setup:* One student (volunteer or assigned) gets 10x currency. Mission: Push price of "Quiz Avg > 80%" to 90c (when true prob is ~50c).
      *   *Honest Traders:* Want to win candy by correcting price.
      *   *Risk:* Honest traders might run out of cash before manipulator does.
      *   *Lesson:* Manipulation is costly *if* there are enough honest traders with capital.

  7.  **Logistics & Materials:**
      *   *Currency:* Printed "FutaBucks."
      *   *Shares:* Printed certificates or just a ledger? Ledger is faster.
      *   *Market Maker:* The instructor (me) needs to set initial spreads or run call auctions. Call auctions (gather orders, clear at one price) are best for classrooms to avoid chaos.
      *   *Payoff:* Candy bars.

  8.  **Addressing Constraints & Failure Modes:**
      *   *Thin Markets:* 18 people is small. Liquidity will be low.
      *   *Solution:* I act as the Bank/Market Maker. I offer to buy/sell at set spreads initially, then widen/narrow.
      *   *Free Riders:* Some won't trade.
      *   *Solution:* Make trading mandatory for participation points? No, no extra credit. Make it social pressure/fun.
      *   *The Joker/Refuser:* Assign them a specific role (Auditor? Manipulator?). If they refuse, ignore them but note it in debrief (apathy is a failure mode).
      *   *What it doesn't show:* Long time horizons, complex metrics, cost of capital, regulatory overhead.

  9.  **Refining the Plan (Self-Correction during drafting):**
      *   *Critique:* Round 2 needs to be clearer on Values vs. Beliefs.
      *   *Fix:*
          *   Values: Vote on "What should the class goal be?" (Option A: Equality, Option B: Merit).
          *   Beliefs: Market on "If we choose Option A, will total candy produced increase?"
          *   Futarchy Rule: We implement the Option with the higher *Expected Value* (Price * Payout).
          *   This forces traders to estimate the *impact* of the policy, not just the outcome.
      *   *Wait, 90 mins is tight.* Let's simplify.
      *   *Round 1:* Prediction Market (Info Aggregation).
      *   *Round 2:* Futarchy Lite (Policy Market). Vote on *Metric*, Market on *Policy Impact*.
      *   *Round 3:* Manipulation.
      *   *Debrief.*

      *   *Let's go with the "Policy Market" for Round 2.*
      *   Policy A: 5 min break now. Policy B: 5 min break later.
      *   Metric: "Class energy level at end of session" (Subjective TA rating 1-10).
      *   Markets trade on "Energy Score if A" and "Energy Score if B".
      *   Decision: Choose policy with higher market price.
      *   Endogeneity: If students know Break Now = Low Energy score (bad grade for class?), they might trade differently.
      *   *Actually, keep it simpler for 90 mins.*
      *   Round 1: Standard Prediction Market (Info aggregation).
      *   Round 2: The "Vote on Values, Bet on Beliefs" simulation.
          *   Vote: What do we want? (Candy for All vs. Candy for Top Traders).
          *   Market: What will happen? (Probability that Candy runs out).
          *   Decision Rule: If Market says >50% chance of running out, we switch to Top Traders.
          *   Endogeneity: Traders who want "Candy for All" must trade to lower the probability of running out.
      *   Round 3: Manipulation.

      *   *Wait, the prompt asks for specific things:*
          1.  Markets on things students do (attendance, quiz).
          2.  Values/Beliefs split + Endogeneity (holding shares changes campaign/vote).
          3.  Manipulation round.

      *   *Okay, final structure:*
          *   **Intro (10m):** Currency, Rules, Payoffs.
          *   **Phase 1: The Information Engine (25m).** Market: "Will next week's quiz avg be > 80%?" Private info distributed. Call auctions.
          *   **Phase 2: Values vs. Beliefs (25m).** Vote on *Goal* (Values). Market on *Feasibility* (Beliefs). Endogeneity: The decision to pursue the goal depends on the market price. Traders must campaign *and* trade.
          *   **Phase 3: The War Chest (20m).** One manipulator tries to distort Phase 1 market.
          *   **Debrief (10m).** Theory, Limits, Failure Modes.

  10. **Handling the "Joker":**
      *   Give them a role that requires skepticism. "Chief Skeptic" or "Auditor." If they still opt out, use them as an example of "zero-liquidity providers" in the debrief.

  11. **Materials Needed:**
      *   Play money.
      *   Info cards (sealed envelopes).
      *   Order sheets.
      *   Whiteboard for prices.
      *   Candy.

  12. **Writing the Response:**
      *   Tone: Professional but practical (peer-to-peer).
      *   Structure: Run of Show, Materials, Detailed Mechanics, Debrief Script, Limitations.
      *   Emphasis: Make sure the "Endogeneity" part is clear, as that's the hardest concept to demo.

      *(Self-Correction on Endogeneity)*: How to make holding shares change voting?
      *   Scenario: We vote on "Pizza Party" vs. "Cash Equivalent".
      *   Market: "Probability Pizza arrives on time."
      *   Rule: If Market Price < 50%, Pizza is cancelled (Cash instead).
      *   Incentive: If I *want* Pizza, and I hold "Pizza Shares," I am motivated to trade the price *up* to ensure the policy happens. My financial position influences my political advocacy.
      *   *Perfect.* I will use this mechanism.

  13. **Final Review against Constraints:**
      *   90 mins? Yes, tight but doable with strict timekeeping.
      *   18 students? Yes, call auctions work well for this size.
      *   No money/credit? Yes, candy/bragging rights.
      *   Failure modes addressed? Yes (liquidity, manipulation costs).
      *   Limitations addressed? Yes (scale, time).

  14. **Drafting the Content:** (Mental check of the Manipulation Round).
      *   If one student has infinite money, they win. They need a budget cap or a loss limit.
      *   Better: Give them a big endowment, but they lose money on bad trades like everyone else. They just have more ammo. The lesson is whether honest traders can *profit* off the manipulator enough to correct the price.
      *   I need to ensure honest traders have enough capital to counter. I will act as the Central Bank and inject liquidity if the market freezes.

  15. **Final Polish:** Ensure the distinction between "Prediction Market" (Phase 1) and "Decision Market" (Phase 2) is sharp. Phase 1 is just epistemic. Phase 2 is futarchic.

      *Wait, one detail:* "Vote on values, bet on beliefs."
      *   Phase 2 needs to explicitly separate these.
      *   Vote: "Do we value Pizza or Candy?" (Values).
      *   Market: "If we choose Pizza, what is the probability it succeeds?" (Beliefs).
      *   Futarchy Rule: We choose the option with the highest Expected Utility (Vote Weight * Market Prob).
      *   *Actually, Hanson's version:* Markets estimate $E[U|Decision]$. The decision with the highest price is chosen.
      *   *Classroom version:* Two markets. Market A: "Utility if Pizza." Market B: "Utility if Candy."
      *   *Simpler:* Vote sets the Utility Function. Market sets the Probability of Outcome.
      *   *Let's stick to the prompt's request:* "Class votes on something (values) while a separate market runs on what the vote will decide (beliefs)."
      *   Okay, I will design Phase 2 exactly like that. Vote = "We want a Break." Market = "Probability we finish the syllabus if we take a Break." If Price < Threshold, Break is cancelled.

      *Let's refine the Endogeneity:*
      *   If I own shares in "Break Happens," I want the price to stay high. I will argue *for* the break during the campaign period.
      *   If I own shares in "No Break," I argue against it.
      *   This links financial position to political speech.

      *Okay, ready to write.*
answer: |-
  This is a fantastic idea for a section. Futarchy is abstract, and a live simulation is the best way to ground it. However, 90 minutes is tight for market mechanics to settle, so you need to be a ruthless timekeeper and simplify the trading mechanism.

  Here is a complete design for your session, including run-of-show, materials, mechanics, and the debrief script.

  # Session Title: "Vote on Values, Bet on Beliefs"
  **Time:** 90 Minutes
  **Participants:** 18 Students + You (Facilitator/Market Maker)
  **Currency:** "FutaBucks" (printed paper money)
  **Payoff:** Candy bars (distributed at the very end based on portfolio value)

  ## Part 1: Preparation & Materials
  Print these beforehand:
  1.  **FutaBucks:** ~500 units total. Denominations of 1, 5, 10.
  2.  **Order Sheets:** Simple grids for students to write Buy/Sell orders.
  3.  **Information Envelopes (Round 1):** 18 envelopes.
      *   4 say: "Quiz is Easy (Prob > 80%)"
      *   4 say: "Quiz is Hard (Prob < 40%)"
      *   10 say: "No Insider Info (Prob ~60%)"
  4.  **Share Certificates (Optional):** Or just keep a ledger on the whiteboard. *Recommendation:* Whiteboard ledger is faster.
  5.  **Manipulator Brief:** A sealed envelope for Round 3.

  ---

  ## Part 2: Run of Show (90 Minutes)

  ### 0:00 – 0:10 | Intro & Rules
  *   **Hook:** "Today we are testing whether money talks louder than voting."
  *   **Currency:** Distribute 20 FutaBucks to everyone.
  *   **Payoff:** Top 3 portfolios at the end get full-size candy bars. Next 5 get fun-size. Rest get participation candy.
  *   **Market Mechanism:** **Call Auctions.** (Crucial for time management). You do not run a continuous market. You announce "Trading Open for 3 minutes," collect order sheets, clear them at a single price, then announce the new price. Do this 3 times per round.
  *   **Role:** You are the Central Bank and Market Maker. You set the spread if trading stalls.

  ### 0:10 – 0:35 | Round 1: The Information Engine (Epistemic Market)
  *   **Goal:** Demonstrate private information aggregating into public price.
  *   **Asset:** `QUIZ-80`. Pays 10 FutaBucks if next week's class average quiz score is ≥ 80%. Pays 0 otherwise.
  *   **Setup:** Hand out the **Information Envelopes**. Tell them not to show anyone.
  *   **Trading:** 3 Call Auctions (5 mins each).
      *   *Auction 1:* Initial price set by you at 50c (5 FutaBucks).
      *   *Auction 2 & 3:* Clear based on orders.
  *   **The Reveal:** Ask students with "Easy" cards to raise hands. Ask "Hard" cards. Show how the price moved toward the weighted average of the private info.
  *   **Debrief Point:** "The price didn't just reflect vibes; it absorbed the 'Easy' cards without those students ever revealing their secret."

  ### 0:35 – 1:00 | Round 2: Values vs. Beliefs (The Futarchy Core)
  *   **Goal:** Separate values (vote) from beliefs (market) and show endogeneity.
  *   **The Decision:** "Should we take a 5-minute break **NOW** or at the **END**?"
  *   **Step 1: Vote on Values (5 mins).**
      *   Class votes on what they *want*. (Spoiler: Most will vote "Break Now").
      *   *Rule:* The Vote determines the **Utility Function**. (We *want* the break).
  *   **Step 2: Market on Beliefs (15 mins).**
      *   **Asset:** `BREAK-FAIL`. Pays 10 FutaBucks if taking a break now causes us to **run out of time** to finish the agenda.
      *   **The Futarchy Rule:** If the market price of `BREAK-FAIL` is **> 50c**, the break is **CANCELLED**. If < 50c, the break happens.
  *   **Step 3: The Endogeneity Trap (5 mins).**
      *   Before the final auction, allow 2 minutes of "Campaigning."
      *   *Observation:* Students who bought `BREAK-FAIL` (betting failure is likely) now *want* the break cancelled (to win their bet). They will argue *against* the break. Students who sold `BREAK-FAIL` (betting success) will argue *for* the break to ensure they get paid.
      *   **Financial position drives political speech.**
  *   **Resolution:** Clear the market. Apply the rule. Take the break (or don't) based on the price, not the vote.

  ### 1:00 – 1:20 | Round 3: The War Chest (Manipulation)
  *   **Goal:** Test Hanson's claim that manipulators subsidize honest traders.
  *   **Setup:** Return to the `QUIZ-80` market from Round 1.
  *   **The Manipulator:** Select one student (ideally the "joker" or a confident trader). Give them **100 FutaBucks** (5x everyone else).
      *   **Mission:** "Push the price of `QUIZ-80` to 90c. You do not care about the quiz. You care about the price."
  *   **The Honest Traders:** Everyone else keeps their remaining cash. They want the price to reflect reality.
  *   **Trading:** 2 Call Auctions (5 mins each).
  *   **Resolution:** Compare final price to the "true" probability (based on the info cards from Round 1). Did the manipulator distort the price, or did honest traders soak up their cash and correct it?

  ### 1:20 – 1:30 | Debrief & Theory Mapping
  *   (See script below).

  ---

  ## Part 3: Handling Failure Modes & Logistics

  ### 1. Liquidity & Thin Markets
  *   **Risk:** With 18 people, no one might want to trade. The market freezes.
  *   **Patch:** **You are the Market Maker.** If there are no buy orders, you announce, "The Bank is buying at 40c." If no sell orders, "The Bank is selling at 60c." This forces a spread and gives students a reference point to arbitrage against.
  *   **Patch:** Force a "Minimum Turnover." Tell them, "If you don't place at least one order in Round 1, you are ineligible for the Top 3 candy prize." This uses social pressure without extra credit.

  ### 2. The "Joker" / Non-Participant
  *   **Strategy:** Do not force them. Instead, assign them a **Role**.
  *   **Role:** "The Auditor." Their job is to watch the ledger and call out any rule violations.
  *   **Why:** If they refuse to trade, they can still monitor the manipulation round. In the debrief, you can say, "Markets require participation. Apathy is a form of market failure. Our Auditor opted out of liquidity provision, which reduces efficiency." This turns their refusal into a data point.

  ### 3. Endogeneity Confusion
  *   **Risk:** Students might think the Vote decides the outcome, ignoring the market.
  *   **Patch:** Be rigid. Write on the board: **VOTE = GOAL. MARKET = FEASIBILITY.** If the Market says Feasibility is low, the Goal is scrapped. Repeat this mantra before Round 2.

  ---

  ## Part 4: The Debrief Script (Key Points)

  **1. Map the Mechanics:**
  *   "In Round 1, we ran a **Prediction Market**. It was purely epistemic. It answered 'What is true?'"
  *   "In Round 2, we ran a **Decision Market** (Futarchy). The Vote set the *Utility* (we want a break). The Market set the *Expectation* (will it ruin the schedule?). The decision was made by $E[U] = Price \times Utility$."
  *   "In Round 2, notice how your trading position changed your arguments. That is **Endogeneity**. In real futarchy, lobbyists would trade on the policy markets to align their financial incentives with their political goals."

  **2. Honest Failure Modes (What went wrong?):**
  *   **Thin Markets:** "Did you feel like you couldn't trade enough? With 18 people, liquidity is low. In reality, futarchy needs millions of participants to absorb noise."
  *   **Capital Constraints:** "In Round 3, did the honest traders run out of money before the manipulator? If honest traders go bankrupt, the market fails. Futarchy requires deep pockets for truth-seekers."
  *   **Metric Gaming:** "In Round 2, we measured 'Running out of time.' That's easy to verify. Real policy metrics (like 'GDP' or 'Happiness') are gamed easily. If we can't measure the outcome cleanly, the market breaks."

  **3. The "What We Couldn't Show" (Crucial Honesty):**
  *   **Time Horizons:** "Our markets lasted 20 minutes. Real policy takes years. Holding a share for 4 years is hard; liquidity dries up. We didn't show the **discount rate problem**."
  *   **Specialization:** "You all traded and studied. In reality, forecasters specialize. We didn't show the emergence of a professional forecaster class."
  *   **Correlation:** "We traded single events. Real policy is a web. Fixing healthcare might hurt GDP. We didn't show **correlated risk**."

  ---

  ## Part 5: Specific Advice for You (The Facilitator)

  1.  **Be the Bank:** Don't just facilitate; intervene. If the price in Round 1 is 90c but the "Hard" info cards suggest it should be 40c, whisper to the "Hard" info holders: "You are leaving money on the table. Short this." Nudge the invisible hand.
  2.  **Manipulator Brief:** Tell the manipulator: "You lose money on every trade that moves the price against you. You have more cash, but you bleed faster. Can you hold the line?" This prevents them from just buying everything at 1c.
  3.  **The "Joker":** If they sit with arms crossed, acknowledge it publicly but neutrally. "Student X is providing zero liquidity today. In a real market, this increases the spread for everyone else." It shames them slightly but makes it pedagogical.
  4.  **Candy Distribution:** Make a show of it. Count the FutaBucks. Pay out the winners. The tangible reward validates the simulation.

  ## Why This Design Works
  *   **Round 1** validates the *epistemic* claim (markets find truth).
  *   **Round 2** validates the *normative* claim (markets can guide policy better than votes).
  *   **Round 3** stress-tests the *robustness* claim (markets resist manipulation).
  *   **Debrief** ensures they don't leave thinking it's magic. They see the seams.

  Good luck. If the market crashes, lean into it—a crashed market is often a better lesson than a successful one.
