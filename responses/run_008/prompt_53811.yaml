prompt: |-
  I work as a country analyst for a food-security early-warning service. Our bulletins currently tag each emerging crisis as either a natural disaster (drought, flood, pest) or a political emergency, and the tag drives our recommendation: food aid shipments versus pressure on the government over procurement, pricing, and export policy. I've been reading about Sen's entitlement approach and want it turned into something I can actually use. Please write a decision procedure I can run in the first weeks of a suspected crisis, using only data that arrives quickly (market prices, wage series, distress sales of livestock and land, migration, grain movements) rather than mortality figures, which come too late to matter. The procedure should start, as Sen insists, from who has lost the ability to command food and why, rather than from aggregate food availability — but it must also say when availability really is the binding constraint, so we don't deny aid to a genuine harvest collapse. Specify the questions to ask in order, what counts as a sufficient answer to each, at what point the classification shifts from natural disaster to political failure, and where the procedure has to stop and hand the call to human judgment. Then run it on three scenarios: (1) a 20% harvest shortfall in a functioning market economy where wages hold; (2) a normal-harvest year in which inflation and lost purchasing power price grain out of reach of rural laborers, on the Bengal 1943 pattern; (3) a blight-driven harvest failure in a country whose government keeps exporting grain to service contracts, as in the Irish and late-Soviet cases. Include where the procedure gives an answer our donors won't like — such as laying the crisis at an ally's policy — and be explicit about what the procedure cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Country Analyst for a food-security early-warning service.
      *   **Current System:** Binary tagging (Natural Disaster vs. Political Emergency) driving specific recommendations (Food Aid vs. Policy Pressure).
      *   **Goal:** Create a practical decision procedure based on Amartya Sen's *Entitlement Approach* (focus on access/command over food, not just aggregate availability).
      *   **Constraints:** Must use *early* data (prices, wages, distress sales, migration, grain movements), *not* late data (mortality/malnutrition rates).
      *   **Requirements:**
          *   Start with "who lost command over food and why."
          *   Distinguish between genuine availability decline (FAD - Food Availability Decline) and entitlement failure.
          *   Specify ordered questions, sufficiency criteria, classification shift points, and hand-off points for human judgment.
          *   Test on three specific scenarios (Harvest shortfall w/ functioning market; Bengal 1943 style inflation/entitlement failure; Export-driven famine despite blight).
          *   Address political friction (donor dislikes) and limitations.

  2.  **Deconstruct Sen's Entitlement Approach for Operational Use:**
      *   *Core Concept:* Famine happens when specific groups lose the "entitlement set" (the bundle of commodity ownerships they can legally command).
      *   *Key Mechanisms:*
          *   *Direct Entitlement:* Own production (farmers).
          *   *Trade Entitlement:* Selling labor/assets to buy food (laborers, pastoralists).
          *   *State Entitlement:* Social safety nets/rations.
      *   *The "FAD" Fallacy:* Just because food exists doesn't mean people can eat. But just because people can't eat doesn't mean food *doesn't* exist.
      *   *Operational Challenge:* How to measure "entitlement failure" quickly?
      *   *Proxies:*
          *   Prices (Food vs. Wage).
          *   Terms of Trade (Labor-to-Grain, Livestock-to-Grain).
          *   Asset Sales (Distress).
          *   Flow of Goods (Exports vs. Imports).

  3.  **Drafting the Decision Procedure (The "Entitlement Triage Protocol"):**
      *   *Structure:* Needs to be a flowchart or step-by-step logic. Let's use a Step-wise Query system.
      *   *Step 1: Identify the Vulnerable Group.* (Who is hungry?)
      *   *Step 2: Measure the Exchange Entitlement.* (Can they buy food?)
      *   *Step 3: Measure Aggregate Availability.* (Is there food?)
      *   *Step 4: Analyze the Disconnect.* (If food exists but they can't buy it -> Political/Structural. If food doesn't exist -> Natural/Supply.)
      *   *Step 5: Check State Action.* (Is policy making it worse?)

      *Refining the Steps for Speed:*
      *   *Input:* Market prices (local grain), Wage rates (agricultural), Livestock prices, Trade flow data.
      *   *Metric:* The "Grain Wage" (Daily wage / Price of kg grain).
      *   *Metric:* The "Terms of Trade" (Goat/Sheep price / Grain price).
      *   *Metric:* Net Trade Balance (Exports - Imports) in deficit zones.

      *Decision Nodes:*
      *   Node A: Is the Grain Wage collapsing faster than production?
      *   Node B: Is food physically absent or just expensive?
      *   Node C: Is the state preventing adjustment (export bans, hoarding, continued exports)?

  4.  **Developing the Scenarios:**

      *   *Scenario 1: 20% Harvest Shortfall, Functioning Market.*
          *   Expectation: Prices rise, but wages might track or savings exist. Entitlements stressed but not broken.
          *   Classification: Natural Shock (mitigated by market).
          *   Recommendation: Targeted aid + Market support.

      *   *Scenario 2: Bengal 1943 (Normal Harvest, Inflation/War Economy).*
          *   Expectation: Harvest okay, but prices skyrocket due to speculation/money supply/urban demand. Rural wages lag.
          *   Classification: Political/Structural Entitlement Failure.
          *   Recommendation: Price controls, wage support, stop speculation (NOT just bulk grain shipment if grain exists but is hoarded).

      *   *Scenario 3: Blight + Export (Irish/Soviet).*
          *   Expectation: Harvest down, BUT exports continue.
          *   Classification: Political Failure exacerbating Natural Disaster.
          *   Recommendation: Pressure to halt exports + Aid.

  5.  **Addressing the "Donor Dislike" and Limitations:**
      *   *Donor Dislike:* Accusing an ally of causing famine via policy (Scenario 3) or inflation management (Scenario 2).
      *   *Limitations:* Data lag, black markets, political will to act on the analysis.

  6.  **Refining the Output Tone:**
      *   Professional, operational, analytical.
      *   Not academic theory, but a field manual.
      *   Clear distinction between "Natural" and "Political" (acknowledging they often overlap).

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is this too theoretical?
      *   *Fix:* Add specific thresholds (e.g., "Grain Wage drops >30%").
      *   *Critique:* Sen argues against pure FAD, but the prompt asks to identify when availability *is* the constraint.
      *   *Fix:* Ensure Step 3 explicitly checks physical availability to avoid missing a true FAD.
      *   *Critique:* How to handle the "Political" tag?
      *   *Fix:* Define "Political" broadly to include policy *inaction* or *macroeconomic mismanagement*, not just active malice.

  8.  **Final Polish:** Check against all prompt requirements (ordered questions, sufficiency, shift points, hand-off, three scenarios, donor friction, limitations). *Make sure the distinction between "Natural" and "Political" is nuanced enough for Sen's framework (i.e., most famines are mixed, but the primary driver dictates the remedy).*

      *(Self-Correction on Tagging)*: The prompt asks for a binary tag (Natural vs. Political) for the bulletin. I need to make sure the procedure forces a choice, even if reality is mixed, based on the *binding constraint*.

      *Revised Logic:*
      1. Entitlement Failure? (Yes/No)
      2. If Yes, is it due to Price/Wage scissors? (Political/Macro)
      3. If No (Entitlements hold), is there physical food? (Yes -> No Crisis / No -> Natural Disaster).
      4. If Entitlement Failure + No Physical Food + Exports continuing? (Political aggravation).

      *Let's structure the procedure as the "Entitlement Binding Constraint Protocol (EBCP)".*

  9.  **Finalizing the Content:** (Drafting the response based on the above thought process). *Ensure the Bengal and Irish examples are historically accurate in the context of the scenarios.* *Ensure the "Donor Dislike" section is punchy.*

      *(Wait, one nuance)*: Sen's point is that "Natural Disaster" is often a misdiagnosis for "Entitlement Failure triggered by shock." I need to make sure the procedure doesn't just say "Harvest down = Natural." It must say "Harvest down + Wages hold = Natural shock managed by market." vs "Harvest down + Wages crash + Exports continue = Political."

      *Okay, ready to write.*
answer: |-
  ## Operational Directive: The Entitlement Binding Constraint Protocol (EBCP)

  **To:** Country Analysis Unit
  **From:** Senior Methodology Desk
  **Subject:** Replacing Availability Heuristics with Entitlement Diagnostics
  **Effective:** Immediate

  ### 1. Purpose and Rationale
  Current bulletin tagging (Natural Disaster vs. Political Emergency) relies too heavily on aggregate Food Availability Decline (FAD). As Amartya Sen demonstrated, starvation is rarely caused by a lack of food in the country, but by a specific group's loss of *command* over that food. This protocol shifts the diagnostic focus from **silos** (how much grain exists) to **wallets** (who can buy it).

  The goal is to identify the *binding constraint* within the first 4–6 weeks of a shock. This determines whether we recommend **Logistical Intervention** (ship food) or **Political Intervention** (alter policy/prices/wages).

  ### 2. Data Inputs (Rapid Stream)
  Do not wait for mortality or anthropometric data. Use the following high-frequency proxies:
  1.  **Local Grain Price ($/kg):** Weekly spot prices in deficit markets.
  2.  **Agricultural Wage Rate ($/day):** Daily cash wage for unskilled labor.
  3.  **Asset Terms of Trade:** Price of a standard goat/chicken divided by price of 100kg grain.
  4.  **Net Grain Flow:** Customs/transport data on inter-regional or cross-border movement (Inflow minus Outflow).
  5.  **Distress Indicators:** Pawn shop volume, land deed registrations, migration outflows.

  ### 3. The Decision Procedure (EBCP)

  Run these queries in strict order. Stop at the first **SUFFICIENT** classification.

  #### Step 1: The Entitlement Shock Test
  **Question:** Has the "Grain Wage" (Daily Wage ÷ Price of 1kg Grain) collapsed by >30% compared to the 5-year seasonal average?
  *   **Data Needed:** Wage series, Market prices.
  *   **Sufficient for "Entitlement Failure":** Yes. This indicates laborers can command significantly less food than usual, regardless of harvest size.
  *   **If No:** Proceed to Step 2. (If wages track prices, the market is functioning; the risk is lower).

  #### Step 2: The Asset Liquidation Test
  **Question:** Are the Terms of Trade for livestock collapsing simultaneously with grain price spikes? (i.e., It takes 5 goats to buy a bag of maize now, versus 2 goats last year).
  *   **Data Needed:** Livestock prices, Grain prices.
  *   **Sufficient for "Entitlement Failure":** Yes. This confirms pastoralists and smallholders are losing their exchange entitlements. They are selling assets to eat, depleting future resilience.
  *   **If No:** Proceed to Step 3.

  #### Step 3: The Availability Constraint Test
  **Question:** Is there a physical absence of grain in deficit markets despite high prices (empty markets), OR is grain present but moving out of the region?
  *   **Data Needed:** Market trader surveys, Transport/Customs flow data.
  *   **Sufficient for "Natural/Supply Shock":** Markets are physically empty; imports are blocked by logistics or geography; no outflows detected.
  *   **Sufficient for "Political/Policy Failure":** Grain is present in markets OR grain is being recorded as an *outflow* (export) from the deficit region while prices spike.
  *   **If Ambiguous:** Proceed to Step 4.

  #### Step 4: The State Response Test
  **Question:** Is the government restricting trade (hoarding/bans) OR continuing exports/contractual shipments despite the Step 1 or Step 2 failure?
  *   **Data Needed:** Policy decrees, Export manifests.
  *   **Sufficient for "Political Emergency":** Yes. If entitlements have collapsed (Step 1/2) and the state is either preventing price correction or prioritizing external contracts over domestic consumption.
  *   **If No:** Proceed to Hand-Off.

  #### Step 5: Human Judgment Hand-Off
  **Condition:** The procedure stops here if:
  1.  Data is contradictory (e.g., wages hold, but markets are empty).
  2.  The crisis is driven by conflict blocking access (warfare is a distinct category from pure political failure).
  3.  The "Political" finding implicates a major donor or strategic ally (requires diplomatic review before tagging).

  ---

  ### 4. Classification Logic (The Tag)

  *   **Tag: NATURAL DISASTER**
      *   **Criteria:** Step 1 & 2 are **NO** (Entitlements holding). Step 3 shows physical absence.
      *   **Meaning:** The market works, people have money, but the food isn't there.
      *   **Recommendation:** **Food Aid Shipments.** (Bridge the supply gap).

  *   **Tag: POLITICAL EMERGENCY**
      *   **Criteria:** Step 1 or 2 is **YES** (Entitlements collapsed). Step 3 shows grain exists or is leaving. Step 4 confirms policy failure.
      *   **Meaning:** Food exists, but the poor have been priced out or policy prevents access.
      *   **Recommendation:** **Policy Pressure.** (Cash transfers, wage supports, export bans, price stabilization). *Do not ship bulk grain if it will depress local prices further and hurt farmers.*

  ---

  ### 5. Scenario Testing

  Here is how the EBCP classifies the three requested scenarios.

  #### Scenario 1: The Functioning Market Shock
  *   **Context:** 20% harvest shortfall. Prices rise 25%. Wages rise 20%.
  *   **EBCP Run:**
      *   Step 1 (Grain Wage): Drop is minimal (~5%). **NO.**
      *   Step 2 (Asset ToT): Stable. **NO.**
      *   Step 3 (Availability): Markets tight, but not empty. No exports. **AMBIGUOUS.**
      *   Step 4 (State): No restrictive policy.
      *   **Hand-Off:** Analyst reviews.
  *   **Classification:** **NATURAL DISASTER (Moderate).**
  *   **Recommendation:** Targeted food aid for the bottom 10% whose wages didn't track, but rely on trade to move grain.
  *   **Donor Friction:** Low. Donors like shipping food.

  #### Scenario 2: The Bengal 1943 Pattern (Inflationary Starvation)
  *   **Context:** Normal harvest. Urban money supply spikes (war spending). Grain prices up 300%. Rural wages up 10%.
  *   **EBCP Run:**
      *   Step 1 (Grain Wage): Collapsed by >70%. **YES.** (Entitlement Failure Confirmed).
      *   Step 2 (Asset ToT):** Livestock prices crash as everyone sells to buy grain. **YES.**
      *   Step 3 (Availability):** Grain is in warehouses and urban markets, just not in rural villages. **POLITICAL SIGNAL.**
      *   Step 4 (State):** Government prioritizing urban supply/anti-inflation measures over rural purchasing power.
  *   **Classification:** **POLITICAL EMERGENCY.**
  *   **Recommendation:** **DO NOT SHIP BULK GRAIN.** Recommend cash transfers to rural laborers, wage guarantees, and crackdown on speculative hoarding.
  *   **Donor Friction:** **HIGH.** Donors want to be seen sending ships. Telling them "the food is there, fix the economy" is less photogenic and implicates macroeconomic policy (often influenced by the donors themselves).

  #### Scenario 3: The Export-Driven Famine (Irish/Soviet Pattern)
  *   **Context:** Blight reduces harvest by 40%. Prices spike. Government continues grain exports to service debt/contracts.
  *   **EBCP Run:**
      *   Step 1 (Grain Wage):** Collapsed. **YES.**
      *   Step 2 (Asset ToT):** Collapsed. **YES.**
      *   Step 3 (Availability):** Physical shortage exists, *BUT* net flow data shows significant outflow.
      *   Step 4 (State):** Government prioritizing contracts over domestic relief. **YES.**
  *   **Classification:** **POLITICAL EMERGENCY (Aggravated by Natural Shock).**
  *   **Recommendation:** **Conditional Aid.** Pressure government to halt exports immediately. Aid shipments should be tied to policy reversal.
  *   **Donor Friction:** **EXTREME.** If the "government" is an ally, or if the "contracts" are held by donor-country corporations, this analysis accuses the donor ecosystem of complicity in famine.

  ---

  ### 6. Limitations and Explicit Uncertainties

  As analysts, you must append the following caveats to any bulletin generated by the EBCP:

  1.  **The Data Lag:** Wage and price data can be manipulated or lag reality by 2–3 weeks in conflict zones. If market data is missing, the procedure cannot run; default to Human Judgment.
  2.  **The "Mixed" Reality:** Most crises are hybrid. A natural shock (drought) often triggers the political failure (export bans). The EBCP forces a binary tag for operational clarity, but the narrative must explain the *interaction*.
  3.  **The Political Cost:** A "Political Emergency" tag requires the organization to move from humanitarianism to advocacy. This protocol *will* generate recommendations that violate host-government sovereignty. We must be prepared for access revocation.
  4.  **Intra-Household Blindness:** This procedure measures household entitlement. It cannot detect gendered or age-based distribution failure within the home (e.g., women eating last). If Step 1 is negative but malnutrition reports come in from women/children, override to Human Judgment.

  ### 7. Final Instruction
  The EBCP is designed to prevent the "FAD Fallacy." If you classify a crisis as **Natural** when the **Grain Wage** has collapsed, you are recommending a supply solution to a demand problem. This will waste resources and potentially harm local producers.

  If the procedure points to **Political Emergency**, you must have the evidence to withstand diplomatic pushback. Document the price/wage scissors and the trade flows rigorously.

  **End of Directive.**
