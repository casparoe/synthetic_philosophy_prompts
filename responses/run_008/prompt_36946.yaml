  2.  **Deconstruct the Logical Space (Brainstorming Phase):**
      *   What is the core puzzle? It's the paradox of sovereignty/freedom. How can freedom be enhanced by restriction?
      *   Time is the enemy. $T_1$ (sober/wise) binds $T_2$ (drunk/passionate). But $T_2$ is also *me* (or *us*). Why does $T_1$ get to rule $T_2$?
      *   Legitimacy is the key metric. It's not just "does it work?" (efficacy) but "ought it to hold?" (normativity).
      *   The "Dead Hand" problem is the political version of the personal identity problem.
      *   Content matters vs. Procedure matters. Slavery entrenchment is bad *because* of content, not just procedure. Ulysses is good *because* of procedure/intent, even if he screams.
      *   Revocability is tricky. If I can undo it whenever I want, it's not binding. If I can never undo it, it's tyranny.
      *   Consent: Is it necessary? In constitutionalism, future generations don't consent. So strict consent might be a "liberal reflex" that kills constitutional theory. We need a proxy for consent or a different justification (e.g., autonomy-enhancing).

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *Candidate 1: Efficacy.* Does it actually bind? (Necessary but not sufficient for *legitimacy*).
      *   *Candidate 2: Authorship/Consent.* Did the bound party agree? (Problem: Future generations). *Refinement:* Authentic Authorization.
      *   *Candidate 3: Purpose.* Is it for self-protection (akrasia) or domination? (The "Ulysses vs. Tyrant" distinction).
      *   *Candidate 4: Reversibility.* Can it be undone? (The "Suicide Pact" problem vs. "Living Constitution").
      *   *Candidate 5: Content Neutrality.* Can *any* goal be entrenched? (No, slavery shows limits).
      *   *Candidate 6: Epistemic Humility.* Does $T_1$ acknowledge $T_2$ might be right? (Distinguishing precommitment from prophecy).

      *   *Pruning/Refining:*
          *   "Consent" needs to be nuanced. It can't be literal ongoing consent. Let's call it "Authentic Authorization."
          *   "Content" is crucial. A theory that says "all self-binding is valid" fails the slavery test.
          *   "Dead Hand" needs a specific desideratum about intergenerational legitimacy.
          *   "Reversibility" needs to address the "bootstrapping" issue (can the rule change the rules for changing itself?).

  4.  **Identifying Tensions/Trade-offs:**
      *   *Stability vs. Flexibility:* If it's too hard to change, it's a dead hand. If too easy, it's not precommitment.
      *   *Procedural vs. Substantive:* If we focus only on procedure (Elster), we might allow bad content. If we focus on content, we risk paternalism.
      *   *Identity:* Is $T_1$ the same agent as $T_2$? If yes, binding is easier to justify. If no, it's domination.

