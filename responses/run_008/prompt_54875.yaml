answer: |-
  You have identified two of the most contentious fault lines in contemporary epistemology. Your intuition is correct: philosophers have carved these apart extensively, but there is no "settled view" on the deeper metaphysical questions you are asking. The debate is very much alive.

  Here is the terminology, the distinction, and the current state of the battle lines.

  ### 1. The Names of the Patterns

  **Pattern 1 (Stakes/Risk): Pragmatic Encroachment**
  The phenomenon where the practical stakes (what hangs on being wrong) affect whether a subject counts as "knowing" is called **Pragmatic Encroachment**.
  *   The specific view that knowledge *itself* depends on the subject's practical situation is often labeled **Subject-Sensitive Invariantism (SSI)**. Prominent defenders include Jeremy Fantl, Matthew McGrath, and Jason Stanley.
  *   The rival view is **Epistemic Contextualism**. Contextualists agree that the truth of "S knows p" shifts with stakes, but they argue this is because the *semantic standard* of the word "know" shifts with the *attributor's* context (the person speaking), not necessarily the subject's practical environment.
  *   The traditional rival view is **Strict Invariantism**. This view holds that knowledge is purely a function of evidence and truth. On this view, high stakes never change whether you *know*; they only change whether it is *prudent to act* on that knowledge.

  **Pattern 2 (Conversation/Audience): Norms of Assertion**
  The phenomenon where the appropriateness of saying "I know" shifts based on conversational needs (reassurance vs. information) falls under **Pragmatics** and the **Norms of Assertion**.
  *   This is generally treated as distinct from the conditions of knowledge itself. It concerns the **felicity conditions** of the speech act.
  *   Philosophers like Timothy Williamson argue for the **Knowledge Norm of Assertion**: "One must: assert p only if one knows p." However, even if you satisfy this norm, other conversational maxims (Gricean maxims) might make the assertion inappropriate (e.g., if it causes unnecessary alarm or false comfort).

  ### 2. Are They the Same Phenomenon?

  **No.** While they both involve context sensitivity, they cut at different joints.

  *   **Pattern 1 (Encroachment)** challenges the **Truth Conditions** of knowledge. Proponents of Encroachment argue that if the stakes are high enough, the proposition "I know the pharmacy is open" becomes literally **false**, even if your evidence is identical to the low-stakes scenario.
  *   **Pattern 2 (Assertion)** concerns the **Assertability Conditions**. In the flyer case, most philosophers would agree that the proposition "I know the plane won't crash" remains **true** (assuming you have standard evidence for flight safety), but uttering it is **infelicitous** or **improper** because it functions as a guarantee/reassurance which you cannot logically provide.

  **The Distinction:** Pattern 1 asks, "Do I *have* the state of knowledge?" Pattern 2 asks, "Is it *helpful or honest* to claim I have it?"

  ### 3. The Boundary: Truth vs. Etiquette

  You asked for the boundary between "what belongs to the situation itself" (knowledge) and "what belongs merely to the etiquette of saying 'know'" (assertion).

  **There is no settled view.** This is the central war in epistemology right now.

  **View A: The Encroachment View (Pattern 1 is about Truth)**
  *   **Claim:** Practical stakes *do* change whether you know.
  *   **Reasoning:** Knowledge is the norm of practical reasoning. You can only use what you know as a premise in action. If it is irrational to act on a belief (e.g., not calling the pharmacy when a child's health is at risk), then you cannot truly be said to know it.
  *   **Implication:** In the high-stakes pharmacy case, it is literally **false** that you know. The risk changes the epistemic state.

  **View B: The Warranted Assertability Maneuver (Pattern 1 is about Etiquette)**
  *   **Claim:** Knowledge is invariant (evidence + truth). Stakes only change whether you should *say* you know.
  *   **Reasoning:** We conflate "I don't know" with "I'm not certain enough to bet on." In the high-stakes case, you still know, but you aren't entitled to *assert* it because the cost of error is too high.
  *   **Implication:** In the high-stakes pharmacy case, it is **true** that you know, but **improper** to claim it without further verification.

  **View C: The Conversational View (Pattern 2 is purely Pragmatic)**
  *   **Claim:** This is almost universally treated as etiquette/pragmatics, not truth.
  *   **Reasoning:** Telling a nervous flyer "I know it won't crash" implies an authority or guarantee that statistical probability does not grant. You are violating a conversational maxim (Quality or Quantity), not necessarily lying about your epistemic state.
  *   **Implication:** You *know* the flight is safe (statistically), but saying "I know" is a speech-act failure, not a knowledge failure.

  ### 4. The Bridge Case: A Third Phenomenon?

  You suspected the bridge engineer case ("we say he knew... until it fell") might be different. You are right. This is less about *stakes* and more about **Epistemic Safety** or **Hindsight Bias**.

  *   **Safety Condition:** Many philosophers (like Duncan Pritchard) argue that to know something, your belief must be "safe"—meaning in nearby possible worlds where you form the belief the same way, it doesn't turn out false.
  *   **The Collapse:** If the bridge falls, it suggests the engineer's belief was *not* safe (there was a nearby possibility of failure he didn't rule out).
  *   **Distinction:** In the pharmacy case, the evidence is the same, only the *consequences* change. In the bridge case, the *outcome* suggests the evidence was actually insufficient all along. This is often treated as a distinct issue regarding **Epistemic Luck**.

  ### 5. Proposed Carving and Edge Cases

  Since you asked for a plain proposal if the established distinctions don't match your carving, here is the cleanest way to separate them, based on **Retraction Tests**.

  **The Carving:**
  1.  **Semantic Sensitivity (Pattern 1/Encroachment):** Does changing the stakes make you want to *retract* your earlier claim as **false**?
  2.  **Pragmatic Sensitivity (Pattern 2/Assertion):** Does changing the audience make you want to *retract* your earlier claim as **misleading**?

  **Edge Cases to Test the Boundary:**

  *   **Test 1: The Third-Person Attribution (Distinguishing SSI from Contextualism)**
      *   *Scenario:* You are in a low-stakes context. Your friend is in a high-stakes context (her child needs the prescription).
      *   *Question:* Can you truthfully say, "She knows the pharmacy is open"?
      *   *If Yes:* You are a **Contextualist** (your context determines the truth).
      *   *If No:* You are a **Subject-Sensitive Invariantist** (her stakes determine the truth).
      *   *If "She knows, but shouldn't act on it":* You are a **Strict Invariantist** (Knowledge is stable, action is the variable).

  *   **Test 2: The Retraction Test (Distinguishing Truth from Assertability)**
      *   *Scenario:* On Tuesday (low stakes), you say "I know." On Wednesday (high stakes), you realize the risk.
      *   *Question:* Do you say, "I was wrong yesterday" (Truth changed) or "I spoke too loosely yesterday" (Assertability changed)?
      *   *Encroachers* say you must admit you didn't *really* know yesterday (or that the truth value is relative).
      *   *Invariantists* say you knew yesterday; you just have higher requirements for *acting* today.

  *   **Test 3: The "Guarantee" Test (Distinguishing Pattern 1 from Pattern 2)**
      *   *Scenario:* The nervous flyer.
      *   *Question:* If you say "I know it won't crash" and the plane hits turbulence, did you lie?
      *   *Analysis:* Most would say you were **overconfident** or **imprecise**, not that you lacked knowledge in the standard sense. This confirms Pattern 2 is about the *strength of commitment* implied by the speech act, not the binary state of knowledge. Pattern 1 (Pharmacy), however, feels like a binary switch (Know/Don't Know).

  ### Summary

  1.  **Pattern 1** is **Pragmatic Encroachment**. The debate is unsettled: some say risk changes *truth* (SSI), others say it changes *assertability* (Invariantism).
  2.  **Pattern 2** is **Pragmatics of Assertion**. The consensus is that this changes *appropriateness*, not *truth*.
  3.  **The Bridge Case** is likely **Epistemic Safety/Luck**, distinct from stakes.
  4.  **The Boundary:** Use the **Retraction Test**. If you feel you must admit your earlier claim was *false*, you are dealing with Encroachment (Pattern 1). If you feel you must admit it was *misleading* or *too strong*, you are dealing with Assertion Norms (Pattern 2).

  Your intuition that these are "two faces of one phenomenon" is understandable because both involve context sensitivity. However, the philosophical consensus treats Pattern 2 as standard pragmatics (etiquette), while Pattern 1 is a radical challenge to the nature of knowledge itself (metaphysics/semantics).
