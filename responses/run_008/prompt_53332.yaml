answer: |-
  1. The film dramatizes the visceral violence underlying museum acquisition that academic prose often sanitizes by having Killmonger physically embody the threat of retribution. This shifts the debate from legal ownership to the bodily cost of colonial extraction.
  2. By placing the strongest restitution argument in the mouth of a terrorist villain, the narrative ultimately codes radical repatriation as inherently violent and illegitimate. This suggests that demanding return is synonymous with Killmonger's nihilistic revolution rather than a valid claim for justice.
  3. Wakanda's history of isolationism undermines Killmonger's moral high ground because the nation refused to aid the diaspora until forced by his violence. Their hoarding of vibranium mirrors the museum's hoarding of artifacts, implicating both sides in the withholding of cultural wealth.
  4. T'Challa's Oakland center replaces restitution with charity, positing that sharing knowledge is superior to returning property. This endorses a neoliberal solution that maintains Western ownership while offering performative aid to the colonized.
  5. The film's critique of extraction is hypocritical because Disney profits from the very African aesthetics it argues should be protected. This commercial exploitation replicates the colonial dynamic the museum scene condemns, rendering the message commercially safe.
