  When you switch from the "Rome" class to "Post-1945 Nuclear Hegemons," the base rate for catastrophic collapse within decades is near zero. The base rate for relative decline (share of global GDP shrinking) is high.

  Your colleague's conclusion relies on the vividness of the Rome story, not base rates. The analogy adds narrative color, not predictive signal. A proper outside view suggests the U.S. faces a messy, prolonged relative decline, not a Roman-style cliff. Advise him to update on the nuclear variable and broaden his class. The scoreboard isn't reading "Game Over"; it's reading "Overtime."
