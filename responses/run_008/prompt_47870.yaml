  **The Reference Class Problem**
  Your intuition is correct: "Rome" is a reference class of size one. Using it is cherry-picking the past to fit a present bias. Proper forecasting requires broader classes.

  *   **Class A: Great Powers since 1800.** (UK, France, Germany, etc.). Base rate: Hegemony shifts, but states rarely vanish. The UK transitioned from hegemon to middle power over a century without collapse.
