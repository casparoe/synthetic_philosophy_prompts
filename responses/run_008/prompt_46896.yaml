      *   *Cardinality vs. Comparability (The Friend's Comment):*
          *   This is the crux. You can have Ordinal Comparable (rare but possible conceptually) or Cardinal Non-Comparable (vNM without IUC).
          *   The host conflates "Cardinal" with "Comparable." You need *both* for classical utilitarianism, but they are distinct axes.
      *   *Arrow's Theorem:*
          *   Host says Arrow proves social choice is impossible *without* IUC.
          *   *Correction:* Arrow proves impossibility given *Ordinal Non-Comparable* inputs. If you allow Cardinal Comparable (Utilitarianism), you satisfy Arrow's conditions (except IIA usually, or rather, Utilitarianism violates IIA in the Arrow sense but satisfies a broader welfarist framework).
          *   Actually, Arrow's framework *excludes* IUC by assumption. It doesn't prove they are impossible, just that without them, aggregation is hard.
      *   *Harsanyi:*
          *   Harsanyi uses vNM cardinality.
