  *(Self-Correction during drafting)*: I need to be careful about Arrow. Arrow's theorem applies to social welfare *functions* based on orderings. Utilitarianism is a social welfare *functional* based on utility profiles. Arrow's IIA condition kills Utilitarianism *if* the input is just orderings. If the input is cardinal utility, Utilitarianism works. The host says "Arrow proved social choice is impossible without interpersonal comparisons." This is technically a misreading. Arrow proved it's impossible with *ordinal non-comparable* preferences. If you have cardinal non-comparable, you still have issues. You specifically need *comparability*. I need to make sure this distinction lands.

  Also, regarding Robbins: Did he say it's "meaningless" or "normative"? He argued it's not scientific because it's not verifiable. The host says "value judgments... no place in science." That's accurate to Robbins. The *implication* that it is therefore logically impossible is the leap.

