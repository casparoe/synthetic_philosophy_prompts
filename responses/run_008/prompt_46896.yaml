  3.  **Brainstorming & Technical Distinctions (The "Philosopher's Toolkit"):**
      *   *Measurability (Information):* Ordinal (O) vs. Cardinal (C).
      *   *Comparability (Interpersonal):* Non-comparable (NC) vs. Comparable (C).
      *   *Levels vs. Differences:* Can we compare *levels* ($u_i > u_j$) or just *differences/gains* ($u_i(x) - u_i(y) > u_j(z) - u_j(w)$)?
      *   *Robbins' Critique:* It's not just that we *can't* measure it; it's that it's *normative*. But is it scientifically meaningless or just unobservable?
      *   *Arrow's Theorem:* Assumes Ordinal Non-Comparable (ONC) preferences. It doesn't prove IUC are *meaningless*, just that if you restrict information to ONC, you get dictatorship. If you allow more info (Cardinal Comparable), you escape Arrow.
      *   *Harsanyi:* Uses Von Neumann-Morgenstern (vNM) cardinality. Does this imply IUC? Only with an "empathy" assumption or normalization. Is it circular? Debated.
      *   *Happiness Research:* Is a 0-10 scale cardinal? Is it comparable across people? (Calibration problem). Does "satisfaction" = "utility" (welfare)? (Adaptive preferences, etc.).

