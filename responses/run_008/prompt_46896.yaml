answer: |-
  This is a fantastic question. You have correctly identified that the podcast host is reciting what we might call the "Standard Textbook Narrative" of 20th-century welfare economics. It is the story told in many first-year graduate micro sequences to motivate why we do Pareto rankings and stop asking about "total social welfare." However, as your friend hinted before running for the train, that narrative relies on a conflation of technical concepts that social choice theorists have spent the last fifty years disentangling.

  The host's monologue is a mix of historical accuracy regarding the *rhetoric* of the 1930s–1950s and technical imprecision regarding the *formalisms* developed since then. To give you the audit you need, we have to separate three distinct axes of information that the host collapses into one: **Measurability** (within-person), **Comparability** (across-person), and **Normativity** (fact vs. value).

  Here is the sentence-by-sentence breakdown.

  ### 1. "Bentham dreamed of adding up happiness across people like so many pounds of flour."
  **Verdict:** Accurate (Historically).
  **Analysis:** This is a fair characterization of Classical Utilitarianism. Bentham and Edgeworth assumed utility was cardinally measurable (like weight or length) and fully comparable across persons. In formal terms, they assumed a utility scale that is unique up to a common positive linear transformation ($u_i^* = a + b u_i$, where $a$ and $b$ are the same for all $i$). This allows for the summation $\sum u_i$. There is no controversy here; this is the baseline the host is trying to knock down.

  ### 2. "The ordinalist revolution of the 1930s destroyed that: Lionel Robbins argued that statements like 'a dollar means more to a poor man than to a rich one' are not empirical claims at all but value judgments, so they have no place in science..."
  **Verdict:** Accurate (Historically), but context-dependent.
  **Analysis:** This accurately reflects Robbins' 1932 *Essay on the Nature and Significance of Economic Science*. Robbins was writing under the influence of Logical Positivism. His argument was not merely that we *cannot* measure utility, but that interpersonal comparisons (IUC) are fundamentally ethical propositions, not scientific ones. If I say the poor man gains more utility, Robbins argued I am essentially saying "I value the poor man's gain more," which is a normative stance.
  **The Nuance:** Modern philosophy of science (and economics) is less dogmatic about the Fact/Value dichotomy than Robbins was. Amartya Sen, for instance, has argued extensively that treating IUC as "meaningless" is itself a value judgment that restricts the informational basis of welfare analysis. So, while the host accurately reports Robbins, presenting Robbins' view as the final word on "science" is outdated.

  ### 3. "...and that is why interpersonal comparisons of utility are meaningless."
  **Verdict:** Conflation (Meaningless vs. Unverifiable).
  **Analysis:** Here is the first major alarm bell. Robbins argued IUC are *not scientifically verifiable*, not that they are logically meaningless or conceptually incoherent. There is a difference between "we cannot construct a meter stick to measure this" and "the concept does not exist."
  Furthermore, in social choice theory, "meaningless" usually implies that allowing such information leads to contradictions or indeterminacy. But IUC are not logically contradictory; they are just informationally demanding. By calling them "meaningless," the host implies a logical impossibility rather than an empirical or methodological limitation.

  ### 4. "Cardinal utility — utility measured in actual units — went out the window with it..."
  **Verdict:** False / Overstatement.
  **Analysis:** This is historically incorrect. Cardinal utility survived the 1930s; it just migrated. While ordinalism dominated demand theory (Slutsky, Hicks), cardinal utility returned with a vengeance in the theory of choice under uncertainty. The Von Neumann-Morgenstern (vNM) expected utility theorem (1944) demonstrated that if an agent satisfies certain axioms (completeness, transitivity, continuity, independence), their preferences can be represented by a utility function unique up to a positive *linear* transformation. That is cardinal utility. It didn't go out the window; it just became associated with risk rather than certain consumption bundles.

  ### 5. "...and since comparing utilities across people requires a cardinal scale, the whole project is dead on arrival."
  **Verdict:** Conflation (Cardinality vs. Comparability).
  **Analysis:** This is the technical heart of your friend's "orthogonal" comment. The host conflates **Measurability** (Cardinality) with **Comparability**.
  *   **Cardinality:** Is the scale within a person meaningful beyond ranking? (e.g., Is the gain from A to B twice the gain from C to D?)
  *   **Comparability:** Can we compare the numbers *across* people? (e.g., Is my 5 the same as your 5?)

  You can have **Ordinal Comparability** (we can agree who is better off, but not by how much). You can also have **Cardinal Non-Comparability** (I know my risk trade-offs precisely, but I have no idea how my utils relate to yours).
  Classical Utilitarianism requires **Cardinal Unit Comparability** (we agree on the size of a "util" and the zero point). But saying comparisons *require* cardinality is false. A Rawlsian MaxMin rule, for instance, only requires **Level Comparability** (we can compare who is worse off), not necessarily cardinal intensity. The host assumes that *any* IUC requires the full Benthamite "pounds of flour" apparatus, which is not true.

  ### 6. "This is also basically the lesson of Arrow's theorem: with only ordinal, non-comparable preferences there is no fair way to aggregate them no matter how clever the voting rule..."
  **Verdict:** Accurate (Technical).
  **Analysis:** This is a fair summary of Arrow's General Impossibility Theorem. Arrow assumed the informational basis was **Ordinal and Non-Comparable (ONC)**. Given that restricted information, plus conditions like Unrestricted Domain, Pareto, and Independence of Irrelevant Alternatives (IIA), the only aggregation rule is a Dictatorship. The host is correct that Arrow showed the difficulty of aggregation under those specific informational constraints.

  ### 7. "...so Arrow proved social choice is impossible without interpersonal comparisons, which we just saw are meaningless — checkmate."
  **Verdict:** Overstatement / Logical Leap.
  **Analysis:** This is the "checkmate" move that doesn't quite land. Arrow's theorem does not prove social choice is impossible *without* IUC; it proves it is impossible *given the assumption of ONC information*.
  The theorem actually suggests a "way out": if you relax the informational assumption (i.e., allow IUC or Cardinality), you can escape the impossibility result. For example, if you allow **Cardinal Unit Comparability**, the Utilitarian Sum rule satisfies Pareto and Anonymity (though it technically violates Arrow's specific formulation of IIA, it satisfies a broader welfarist condition).
  The host treats Arrow's theorem as a proof that IUC are *necessary but impossible*. In reality, Arrow's theorem is a proof that **if** you accept Robbins' ban on IUC, **then** you face dictatorship. It shifts the burden: do we accept dictatorship, or do we reject Robbins' ban? It is not a logical "checkmate" against IUC; it is a *reductio ad absurdum* against the restriction of information to ONC.

  ### 8. "Harsanyi later tried to rescue utilitarianism with a veil-of-ignorance argument, but the rescue only works because he quietly assumes the exact comparability that was in doubt, so it is circular."
  **Verdict:** Simplification / Contested.
  **Analysis:** John Harsanyi's Utilitarianism theorem (1953, 1977) argues that if individuals are vNM rationalists, and if an observer behind a "veil of ignorance" (equal probability of being anyone) makes a rational choice, the observer must maximize the sum of utilities.
  Is it circular? This is a live debate.
  *   **Critique:** To sum the utilities, Harsanyi must normalize the vNM scales across individuals. vNM utility is unique only up to linear transformation *per person*. To sum them, you need to fix the zero and unit *across* persons. Harsanyi invokes an "empathy" assumption to do this. Critics (like Sen or Weymark) argue this smuggles in the ethical weighting he claims to derive.
  *   **Defense:** Harsanyi argues this is not circular but derivational: rationality + empathy $\rightarrow$ utilitarianism.
  The host's claim that it "quietly assumes the exact comparability" is technically true (you need normalization), but calling it "circular" dismisses the argument that rationality *constrains* the comparability. It's a strong simplification of a complex philosophical argument.

  ### 9. "The one way out is empirical: happiness research, where everyone rates their life satisfaction 0 to 10 on the same questionnaire, finally puts utility on a common scale — Bentham's dream is back on, just with survey numbers instead of pounds of flour."
  **Verdict:** Significantly Misleading.
  **Analysis:** This is the grand finale that fails to hold water upon inspection. Subjective Well-Being (SWB) data does not automatically solve the comparability problem for two reasons:
  1.  **Scale Use Heterogeneity:** When I say "7" and you say "7," do we mean the same thing? Some cultures or personalities use the extremes of the scale; others cluster around the mean. Without calibration (e.g., vignette methods), a 0-10 scale is ordinal at best, and non-comparable across persons.
  2.  **Utility vs. Happiness:** In welfare economics, "utility" is often defined as preference satisfaction, not hedonic state. A person might prefer a difficult life of artistic struggle over a comfortable life of mediocrity, even if the latter yields higher "happiness" scores. Resurrecting Bentham requires equating "happiness" with "welfare," which is a substantive ethical claim, not an empirical measurement fix.
  So, happiness research provides *data*, but it does not solve the *conceptual* problem of interpersonal comparability without further assumptions about reporting functions and the definition of welfare.

  ### The "Meaningless" Step: Where it Goes Wrong
  You asked specifically where the "meaningless" step fails. It fails because it conflates **Epistemic Access** with **Ontological Status**.
  Robbins argued we lack *epistemic access* (we can't observe another's mind). The host treats this as an *ontological* claim (there is nothing there to compare).
  In modern social choice (following Sen's "Informational Basis" approach), we treat IUC as a question of **Informational Richness**.
  *   **Ordinal Non-Comparable:** Very little info. Arrow's impossibility holds.
  *   **Cardinal Comparable:** Lots of info. Utilitarianism works.
  The question is not "Is it meaningless?" but "Are we willing to accept the ethical commitments required to treat the data as comparable?" The host presents the Robbinsian restriction as a law of logic, when it is actually a methodological choice that carries its own ethical weight (i.e., the weight of accepting potential dictatorship or Pareto-inefficient outcomes).

  ### Summary of the Landscape
  The host's narrative is the "Old Guard" story: Robbins killed utility, Arrow buried it, and only data can resurrect it.
  The "New Guard" story (Sen, Weymark, Blackorby, Donaldson): Utility never died; we just clarified its informational requirements. We can have a taxonomy of social welfare functionals based on exactly how much measurability and comparability we assume. The debate is no longer about whether IUC are "meaningless," but about which informational assumptions are ethically defensible and empirically plausible.

