prompt: |-
  Taking a phil course this term where we just finished Russell's Marriage and Morals (1929), and I've been testing my own gut reactions against what I take to be his line: as we read him, the wrongmaking features of sexual conduct are things like deceiving the people involved, damaging kids, and cultivating jealousy — never the sex itself. I've got a list of my own verdicts on cases and I want to know if Russell's principle (or a patched version of it) captures them, and if not, which of my verdicts has to go.

  My verdicts: a one-night stand between two single people who both know the score — fine. An affair hidden from a spouse who'd be devastated — not fine. A couple with kids in a fully out-in-the-open open marriage — fine, though something nags at me about it. Two 19-year-olds who swear eternal love, sleep together, and one is crushed when it ends three months later — fine, regret isn't wrongdoing. A professor sleeping with a student who's infatuated and will regret it — not fine, even though nobody's been lied to. Someone who volunteers every detail of past flings to their partner, honestly, causing constant misery — technically no deception, but it feels like a dick move.

  And the one I flip-flop on: staying in a cold, affectionless marriage "for the kids" when both spouses would rather leave. My gut says that's wrong even though no one is deceived and the kids are superficially fine, which is exactly what a no-deception principle can't seem to say.

  Is there one principle — Russell's, repaired Russell, or something else — that gets all or most of these? If there's more than one live candidate, include the runner-up and say what would decide between them. Please give me the answer as a JSON object with these fields: "principle" (its best statement, plus any clauses, each clause tagged with the case that motivates it); "verdicts" (array, one object per case above, with "case", "my_verdict", "principle_verdict", and a short note where they diverge); "overturned" (list of my verdicts the principle can't save, with why); "flip_flop_case" (what the principle says about the for-the-kids marriage); and "novel_case" (a case I didn't list, plus the principle's prediction for it). Extra reasoning can go in a final "notes" string if you want, but keep the JSON the main deliverable.
