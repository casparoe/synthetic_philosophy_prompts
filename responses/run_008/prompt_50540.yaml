  2.  **Part 1: Milgrom–Stokey No-Trade Theorem Analysis:**
      *   *Theorem Core:* Common priors + Common knowledge of rationality + Pareto-optimal initial allocation $\rightarrow$ No speculative trade based on private information. Trade only happens for risk-sharing (hedging).
      *   *Mapping Players:*
          *   *Buyers of Protection (Shorts):* Burry (Scion), Eisman (FrontPoint), Cornwell (Deutsche), Acker/Gettleman (Cornwall). They had private information/analysis (loan-level data).
