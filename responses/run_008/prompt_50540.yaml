      *   *Verdict on Assumption:* Agency frictions + Heterogeneous Priors. The agency issue is more structural; the priors issue is more cognitive. I need to weigh which is "most defensible." Agency explains the *volume* and *persistence* better. If it were just priors, arbitrage should have corrected it faster unless capital constraints existed. Agency explains why sellers kept selling despite the signal.

  3.  **Part 2: Grossman–Stiglitz Impossibility Result:**
      *   *Theorem Core:* If prices fully reveal information, no incentive to become informed. Therefore, prices cannot be fully informative; there must be "noise" to mask informed trading.
      *   *Application:* Why didn't CDS spreads widen immediately when Burry started buying?
      *   *Analysis:*
          *   Was it Noise Trading? Yes, but not random noise. It was *systematic* mispricing driven by rating agency models and regulatory capital arbitrage.
          *   Failure of Price-Revelation Mechanism:* The market for CDS was opaque (OTC). Prices weren't public. Even if spreads widened, the link to underlying loan quality was obscured by tranching and ratings.
          *   *The "Noise":* The demand from yield-hungry investors (driven by agency mandates) masked the informed selling (shorting). The "noise" was actually structural demand for AAA yield.
      *   *Conclusion:* Prices failed to reveal information because the mechanism (ratings + opacity) severed the link between asset quality and price.

