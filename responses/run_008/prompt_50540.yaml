      *   *Classifying Trades:*
          *   Were shorts hedging? Mostly no. Burry had no mortgage exposure. This was speculative trade based on disagreement.
          *   Were sellers hedging? Some claimed so (natural long exposure), but many (like AIG FP) were selling naked protection to earn premiums, viewing it as "free money."
          *   *Theorem Implication:* Since this was largely speculative (betting on price movement/default rather than hedging existing risk), the theorem says this trade *should not happen* if assumptions hold.
      *   *Identifying the Broken Assumption:*
          *   *Common Priors?* No. Sellers believed housing never declines nationally (historical data). Buyers believed loan underwriting standards broke the historical model. This is heterogeneous priors.
          *   *Common Knowledge of Rationality?* Did sellers know buyers were rational/informed? Eventually, yes (banks noticed the concentrated buying). But they dismissed the signal.
