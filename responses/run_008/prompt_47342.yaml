answer: |-
  **The Scenario**

  The Regional Veterinary Ethics Committee must allocate a finite £100,000 grant for a novel neuropathic pain management programme, sufficient to treat only one species group within the trust's care. The candidates are a herd of **Holstein Friesian cattle** (average brain mass ~450g), a kennel of **rescue dogs** (average brain mass ~70g), and a sanctuary flock of **Grey parrots** (average brain mass ~10g). All three groups exhibit behavioural markers of chronic pain, yet their inner lives remain epistemically opaque: the cattle display robust physiological stress responses but limited behavioural flexibility; the dogs show clear emotional contagion and pain-avoidance learning; the parrots demonstrate primate-level cognitive problem-solving and high pallial neuron density, though the link between avian cognitive sophistication and the *intensity* of affective suffering is contested. The committee must decide which species receives the intervention, knowing the others will endure untreated pain.

  ***

  **Analysis of the Three Views**

  **1. What each view directs the committee to do**

  *   **View (a) Crude Mass:** This view holds that moral status is directly proportional to absolute brain mass. The committee must fund the **cattle**. With a brain mass roughly six times that of the dog and forty-five times that of the parrot, the cattle possess the most 'moral tissue'. The behavioural nuances are irrelevant; the anatomical scale dictates the moral weight.
  *   **View (b) Evidential Size:** This view treats brain size as defeasible evidence of cognitive-affective capacity. The committee should likely fund the **dogs**. While the parrots show impressive cognitive feats, their tiny brain mass serves as a defeater regarding the *scale* or *depth* of their subjective experience; the biological hardware suggests a limit on affective intensity. Conversely, while the cattle have large brains, their lack of behavioural flexibility defeats the inference that this mass translates to complex suffering. The dog represents the 'goldilocks' zone: sufficient mass to support deep affect, confirmed by strong behavioural evidence of emotional life.
  *   **View (c) Capacity Only:** This view holds that brain size is biologically incidental; only the actual capacity for suffering matters. The committee should fund the **parrots**. Given the established high neuronal density in the avian pallium and their demonstrated metacognition, the parrots likely possess a capacity for sophisticated suffering equal to or exceeding the mammals. To ignore this based on gramme-weight is speciesist prejudice. The mass of the cow is morally silent noise.

  **2. The key anatomical or behavioural fact driving the verdicts apart**

  The divergence rests on the **dissociation between brain mass and neuronal density/behavioural complexity**. Specifically, the fact that the parrot has a tiny brain (10g) but high cognitive capacity, while the cow has a large brain (450g) but lower behavioural flexibility.
  *   View (a) latches onto the **450g vs 10g** mass difference.
  *   View (b) weighs the **10g mass** as a negative evidential factor against the parrot's behaviour, but the **450g mass** as insufficiently supported by behaviour in the cow.
  *   View (c) latches onto the **pallial neuron density and problem-solving** facts, rendering the gramme-weight irrelevant.

  **3. Sensitivity Analysis: Removing or Reversing the Fact**

  If we **remove the uncertainty** and stipulate that all three species have *identical* confirmed capacities for suffering:
  *   View (a) still picks the **cow** (mass remains the metric).
  *   View (b) and (c) would **converge**. If capacity is known, brain size ceases to be useful evidence. The committee would likely flip a coin or treat them equally. This highlights that View (b) only diverges from (c) under epistemic uncertainty.

  If we **reverse the facts** (e.g., the cow demonstrates higher cognitive complexity than the parrot):
  *   View (a) still picks the **cow**.
  *   View (b) picks the **cow** (mass and behaviour align).
  *   View (c) picks the **cow** (capacity is highest).
  *   *Result:* All three views converge. The case only works because the biological facts are misaligned (large brain/low complexity vs small brain/high complexity).

  **4. Defence of View (a) and the Straw Man Objection**

  A defender of View (a) might argue that brain mass is a **reliable proxy for total neural processing power** which correlates with the 'bandwidth' of experience. They could claim that behavioural tests are anthropocentric and underestimate the cow's inner life, whereas mass is an objective, non-biased metric. They might argue that a larger brain allows for a greater *volume* of experience, even if the *complexity* is lower.

  **Honest Note on View (a):**
  It must be acknowledged that View (a) is largely a **straw man**. No serious contemporary bioethicist argues that mass is *intrinsically* morally valuable (i.e., that a larger brain is better *even if* it produces less capacity). Most theorists who focus on biology hold View (b). To make this seminar bite the most defensible brain-based view, you should re-engineer the case to pit **View (b) against View (c)** more sharply.
  *   *Re-engineering suggestion:* Remove the cow. Make the choice solely between the **Dog** (Med mass, high affective evidence) and the **Parrot** (Tiny mass, high cognitive evidence).
  *   *The Conflict:* View (b) favours the Dog (mass supports the probability of deep *affective* pain). View (c) favours the Parrot (cognitive capacity is the moral threshold, mass is irrelevant). This forces students to debate whether brain size is a valid heuristic for *affective intensity* when behavioural data is ambiguous, which is the genuine philosophical live wire in veterinary ethics.

  **5. Empirical Flags**

  *   **Well Established:** Mammalian brain mass hierarchy (Cow > Dog > Parrot); Avian pallial neuron density is comparable to primates (Olkowicz et al., 2016); Parrots demonstrate complex problem solving.
  *   **Contested:** The link between neuronal density and *phenomenal intensity* of pain; whether 'cognitive complexity' correlates with 'moral weight' or merely 'type of experience'; the extent of bovine emotional contagion compared to canids.
