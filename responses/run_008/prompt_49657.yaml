      *   *Tension C: Pos 5 (Readers) vs. Pos 5 (Kid).*
          *   5 says: "Readers should quit more."
          *   5 also says: "I want my kid to be the person in (3) who doesn't bail."
          *   *Resolution:* This is a "Do as I say, not as I do" or "Context dependent" tension. Is the advice different for the general public vs. the elite/disciplined? Or is it different for early career vs. late career?
          *   *Severity:* High. It risks hypocrisy or class-based advice (I finish because I'm smart; you quit because you're trapped).

      *   *Tension D: Pos 2 (Orgs) vs. Pos 4 (Humans).*
          *   2 says: Execs do it for reputation (rational).
          *   4 says: Humans do it because of a waste-not bug (irrational).
