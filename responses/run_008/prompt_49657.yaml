      *Decision:* The biggest leak is calling the behavior in (3) "honoring sunk costs." That is the semantic trap. If you reframe (3) as "buying credibility," it stops fighting (1). Then (5) is just advice for a world where people mislabel (3) as often as they mislabel actual fallacies.

