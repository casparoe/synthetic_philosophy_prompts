      *   *Interpretation 3 (Associative/Special Obligations):* Citizenship creates special duties (like family).
      *   *Interpretation 4 (Permission/Partiality):* It's okay to favor our own, even if not required.
      *   *Interpretation 5 (Moral Weight/Discounting):* Strangers' suffering matters less.
      *   *Interpretation 6 (Causal/Foundational):* You can't help others if you aren't sorted at home first (orderly society).

  3.  **Drafting the Theses (Iterative Process):**

      *   *Thesis 1: The Efficiency Claim.* (Mechanics of giving).
