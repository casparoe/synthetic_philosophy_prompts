answer: |-
  Here is a breakdown of the possible philosophical theses hidden behind the proverb "charity begins at home," arranged from the empirically contingent (near-trivial) to the morally substantive (controversial). You can use this list to dissect the argument in your seminar.

  ### 1. The Empirical Efficiency Thesis
  **The Claim:** Local agents have better knowledge of local needs and lower transaction costs; therefore, resources spent domestically are less likely to be wasted than resources sent abroad.
  *   **Plausibility:** **Contingently High.** It is often true that local institutions have epistemic advantages. However, in the modern era of global NGOs and evidence-based aid (e.g., bed nets vs. housing subsidies), this is an empirical claim that can be falsified by data.
  *   **Supports Priority against Cost-Effectiveness?** **No.** If it can be demonstrated that $1,000 saves a life abroad but only alleviates mild discomfort at home, this thesis collapses. It cannot justify prioritizing the domestic poor if the foreign poor can be helped *more* effectively.
  *   **Yields "Aid is Leftover" Conclusion?** **No.** It suggests we should give *where impact is highest*, not necessarily at home. If foreign aid is more efficient, this thesis demands we give abroad first.

  ### 2. The Administrative Coordination Thesis
  **The Claim:** Moral agents need a focal point to avoid duplication of effort or paralysis. Proximity serves as a neutral tie-breaking rule to ensure *someone* takes responsibility for *someone*.
  *   **Plausibility:** **Moderate.** In the absence of a global sovereign, decentralized responsibility is practical. We need a heuristic to decide who acts where.
  *   **Supports Priority against Cost-Effectiveness?** **Weakly.** Coordination rules work best when needs are roughly comparable. When the disparity in suffering is vast (starvation vs. relative poverty), proximity is too blunt an instrument to override the urgency of need.
  *   **Yields "Aid is Leftover" Conclusion?** **No.** This thesis justifies starting at home, not *stopping* at home. It orders obligations sequentially, not lexically. It does not imply foreign obligations vanish once domestic giving begins.

  ### 3. The Permission (Partiality) Thesis
  **The Claim:** Individuals and states are morally *permitted* to favor compatriots, even if impartial morality would suggest otherwise. This frames foreign aid as supererogatory (good to do, but not wrong to omit).
  *   **Plausibility:** **High (in common morality).** Most people intuitively accept that we have some latitude to favor our own. However, in political philosophy, this is contested when basic rights are at stake.
  *   **Supports Priority against Cost-Effectiveness?** **Yes.** It grants a moral "right to be partial." You may prioritize the domestic homeless over the foreign starving, even if the latter need is greater, because you are allowed to value your own community more highly.
  *   **Yields "Aid is Leftover" Conclusion?** **Yes.** By categorizing foreign aid as a matter of permission rather than duty, it renders aid discretionary. It becomes a gift you give only after your "real" duties are satisfied.

  ### 4. The Associative Duty Thesis
  **The Claim:** Shared citizenship generates special obligations akin to family duties. The state is not merely a service provider but a cooperative scheme among members; justice is relational, not universal.
  *   **Plausibility:** **Contested.** This is the core of the "Nationalist" vs. "Cosmopolitan" debate. It is plausible if you view the state as a reciprocal community; implausible if you view human rights as prior to citizenship.
  *   **Supports Priority against Cost-Effectiveness?** **Yes.** Special duties typically trump general utility. You owe your child more than a stranger, even if the stranger benefits more from your money. Applied to the state, compatriot claims outweigh distant claims.
  *   **Yields "Aid is Leftover" Conclusion?** **Yes, with a caveat.** It supports prioritizing domestic justice. However, most proponents of this view (e.g., Michael Blake, Thomas Nagel) still admit a *minimum* threshold of humanitarian duty to strangers. It makes aid secondary, but rarely entirely optional if the foreign suffering is extreme.

  ### 5. The Moral Discounting Thesis
  **The Claim:** The suffering of distant strangers objectively counts for less than the suffering of compatriots. Moral weight diminishes with distance or political separation.
  *   **Plausibility:** **Low.** This is difficult to defend in a seminar. It requires arguing that a life or a unit of pain has less moral value simply because of borders. It conflicts with the basic premise of moral universalism.
  *   **Supports Priority against Cost-Effectiveness?** **Yes.** If foreign suffering is "worth less," then relieving greater foreign need may still be less valuable than relieving minor domestic need.
  *   **Yields "Aid is Leftover" Conclusion?** **Yes.** If foreign claims are systematically weaker, they are easily overridden by domestic claims. Foreign aid becomes a minor consideration rather than a pressing demand of justice.

  ***

  ### Seminar Note: What the Proverb is Actually Doing

  When your classmate deploys "charity begins at home," she is likely conflating **Thesis 1 (Efficiency)** with **Thesis 3 (Permission)**.

  She uses the *language* of Efficiency (implying it is more practical to help at home) to smuggle in the *conclusion* of Permission (that we are not required to help abroad). This is rhetorically effective because Efficiency sounds like a hard fact, whereas Permission is a controversial moral stance.

  **Does the proverb do argumentative work?**
  No. A proverb is a conclusion without premises. It functions as a **conversation-stopper**, not a justification. It reassures the speaker that their partiality is virtuous rather than selfish. In a political philosophy seminar, you should point out that the proverb equivocates on the word "Charity." Your course is about *Distributive Justice* (obligations), but the proverb frames the issue as *Charity* (discretion). By accepting the proverb, your classmate has already begged the question: she has assumed foreign aid is a gift rather than a duty. Your task is to force the argument back to whether the obligation is one of justice or charity before the proverb is allowed to settle the ordering.
