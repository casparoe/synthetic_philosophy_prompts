  7.  **Finalizing the Occupying Power Answer:** Hart would call this "orders backed by threats," not a legal system. It lacks the "rule of recognition." Fuller would say it lacks "generality" (one-off orders). So, "Not Law" is the stronger philosophical answer, though in practice we treat it as a temporary legal order. I'll stick with the philosophical "Not quite law" angle to match the Hart/Fuller vibe.

