      *   **Key Conflict:** The user feels a tension between Case 2 (Nazi informer = not law/murder) and Case 4 (Evil but procedurally perfect = law). They suspect the distinction is procedural (Fuller) rather than substantive (Natural Law), but this contradicts their initial gut feeling that "wickedness" matters.
      *   **Specific Cases:**
          1.  Apartheid SA (Wicked but clear/procedural) = Law.
          2.  Nazi Informer (Wicked + Procedurally rotten) = Not Law (Informer = Murderer).
