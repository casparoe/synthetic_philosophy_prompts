  2.  **Deconstruct the User's Intuitions & The Hart-Fuller Debate:**
      *   *Hart (Positivist):* Law is a system of rules identified by a "rule of recognition" (pedigree/source), separate from morality. "The law is the law," even if wicked. Separation of thesis: "This is law" $\neq$ "This ought to be obeyed."
      *   *Fuller (Procedural Natural Law):* Law has an "inner morality." To count as law, it must meet 8 desiderata (generality, publicity, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, congruence between official action and declared rule). If it fails these too badly, it's not just bad law, it's *not law*.
      *   *Radical Natural Law (Augustine/Finnis):* "An unjust law is no law at all" (substantive morality).

      *   *User's Mapping:*
          *   (1) Apartheid: Law. (Fits Hart & Fuller, assuming procedural compliance).
          *   (2) Nazi: Not Law. (Fits Fuller because of procedural rot/retroactivity, fits Radical Natural Law because of evil).
          *   (3) Chaotic Decent: Law. (Fits Hart. Fuller might say it fails the "inner morality" thresholds if *too* chaotic, but user says "law, just bad at it").
          *   (4) Evil but Clean: Law. (Fits Hart. Fuller says Law. Radical Natural Law says Not Law).
          *   (5) Prison Gang: Not Law. (Fits Hart/Fuller because it lacks the *kind* of authority or claim to supremacy associated with state law, though Hart might call it a "primitive" system if it has secondary rules).
          *   (6) Int'l Law: Law. (Hart calls it "primitive" but still law-like).

      *   *The Tension:* The user is struggling with (2) vs (4). In (2), they say "Not Law" because the *system* was rotten (procedural). In (4), they say "Law" because the *procedure* was clean, despite the evil. This is actually a very *Fullerian* position, not a Positivist one. Positivists would say both are law. Natural Lawyers (substantive) would say both might be not law. The user is distinguishing based on *procedure*, which is Fuller's "Inner Morality of Law."

      *   *The Prison Gang Problem:* Why isn't this law? Hart would say it lacks a "Rule of Recognition" accepted by officials, or it's not a union of primary and secondary rules. Fuller might say it lacks the claim to govern a society comprehensively. The user needs to avoid "Law = State" circularity. The distinction is usually about *supremacy* and *comprehensiveness*.

  3.  **Formulating the Principle:**
      *   The user's intuitions align most closely with **Lon Fuller's Procedural Natural Law**, with a dash of Hart's separation for the "evil but clean" case.
      *   Actually, looking closer: The user says (4) Evil/Clean = Law. Fuller agrees. Hart agrees.
      *   The user says (2) Nazi/Rotten = Not Law. Fuller agrees (failure of inner morality). Hart says it *was* law, just wicked (but the informer case is tricky; Hart argued they should pass a retroactive statute to punish, rather than deny the law existed).
      *   The user says (3) Decent/Chaotic = Law. Hart agrees. Fuller might push back if the chaos is too extreme (fails clarity/constancy), but user says "grammar is a mess" implies it still functions.
      *   The user says (5) Prison Gang = Not Law. This is the outlier for a pure procedural test. A gang can have clear, prospective rules. Why isn't it law? Because it lacks *sovereignty* or *comprehensiveness*. It doesn't claim to be the ultimate authority.

      *   *Synthesis:* The user is a **Soft Positivist with Fullerian leanings**. They want to separate law and morality generally (Case 4), but acknowledge that procedure is constitutive of law (Case 2), and that state authority matters (Case 5).

      *   *The Conflict:* The user worries that distinguishing (2) and (4) means "evil doesn't matter." That's not quite right. It means "evil doesn't disqualify law, but procedural failure does." This is exactly Fuller's point. Law is a craft. If you don't follow the craft, you aren't making law. If you follow the craft but make evil stuff, you are making evil law.

  4.  **Addressing the Specific Questions:**
      *   *Is there a principle?* Yes, it's mostly Fuller's "Inner Morality of Law" combined with a requirement of institutional authority (to rule out the gang).
      *   *Which verdict to drop?* Case (3) is the weak point for Fuller. If the chaos is extreme (contradictory statutes), Fuller argues you *cannot* guide conduct, so it fails to be law. Hart would say it's still law (bad law). The user calls it "law, just bad at it." This leans Hart. But Case (2) leans Fuller. To be consistent with (2), the user should admit that if (3) is *too* chaotic, it ceases to be law.
      *   *Hart vs. Fuller?* The user's intuition on the Nazi case (2) is the strongest moral pull. Hart's solution (admit it was law, punish retroactively) feels morally icky to most people. Fuller's solution (it wasn't law because it violated the inner morality) feels more satisfying. So, lean Fuller on (2), but keep Hart on (4). This is the standard "post-war compromise."
      *   *The Prison Gang:* It's not law because it lacks the *claim to supremacy* and *comprehensiveness*. It's a private ordering system.
      *   *The New Case (Occupying Power):* This is the "Command Theory" (Austin). Hart says this is "gunman situation writ large." It lacks the internal aspect (acceptance by officials/citizens). Fuller would say if it's one-off orders without general rules, it fails the "generality" test. So, likely **Not Law** (or at best, "pre-legal" commands).

