answer: |-
  First off, don't let your brother-in-law win by default. The fact that you're flipping sides means you're actually grappling with the problem instead of just reciting a slogan. Your intuitions are not only salvageable; they're actually more sophisticated than a hardline Hart or a hardline Fuller position.

  Here's the diagnosis of your six verdicts, the principle hiding underneath them, and where you need to tweak things to stop the mental churn.

  ### The Principle Behind Your Verdicts
  You are operating on a **Procedural Natural Law** framework (Fuller) with a **Positivist** constraint on substantive morality (Hart).

  Here is the translation of your gut checks:
  *   **Cases 1 & 4 (Evil but Clean):** You say **Law**. This is Positivism. You are refusing to say "unjust = not law." You want to keep the concept of law distinct from the concept of goodness so you can criticize the law without denying its existence.
  *   **Case 2 (Nazi/Rotten):** You say **Not Law**. This is Fuller. You are saying that when a system violates the *process* of lawmaking (retroactivity, secrecy, contradiction) so badly that it can't guide conduct, it loses its claim to be "law."
  *   **Case 5 (Prison Gang):** You say **Not Law**. This is about **authority and comprehensiveness**. Law claims to be the supreme rulebook for a society. A gang rulebook is a private contract among members.
  *   **Case 6 (International Law):** You say **Law**. This acknowledges that "law" comes in degrees.

  **The Tension:** You feel guilty because distinguishing (2) from (4) makes it look like you care more about *paperwork* (procedure) than *people dying* (substance).

  **The Fix:** You don't care more about paperwork. You care about **function**. Fuller's argument isn't that bureaucracy is holy; it's that law is a tool for guiding human conduct. If the tool is broken (retroactive, contradictory, secret), it literally *cannot do the job of law*. In Case 4 (Evil/Clean), the tool works, it's just being used to build a torture chamber. In Case 2 (Nazi/Rotten), the tool is a melted lump of metal. It's not functioning as a tool at all.

  ### Which Verdict Has to Go?
  To make your system coherent, you need to tighten up **Case 3 (Decent but Chaotic)**.

  Currently, you say: *Contradictory statutes, no one knows what's in force = Law (just bad).*
  But in Case 2, you said: *Retroactive/rotten procedure = Not Law.*

  If you stick with your Fullerian intuition on the Nazis (which most people find morally necessary), you have to admit that **extreme procedural chaos kills lawhood.** If two statutes flatly contradict and there's no rule to resolve which one wins, a citizen *cannot* comply. They are literally trapped. Fuller argues that at a certain threshold of dysfunction, the system ceases to be a legal system and becomes just organized violence or chaos.

  **The Adjustment:** If the chaos in Case 3 is "grammar is a mess but you can figure it out," it's Law. If the chaos is "Statute A says X, Statute B says Not-X, and no court can tell you which applies," then **it is Not Law.** Drop the verdict that says "contradictions are fine." Consistency is a prerequisite for law, not just a nice-to-have.

  ### The Prison Gang (Case 5)
  You asked how to say this isn't law without just saying "because it's not the state."

  **Hart's Answer:** A legal system requires "secondary rules" (rules about how to make/change/adjudicate rules) that are accepted by officials as a common standard. A gang might have these, but...
  **The Better Distinction:** **Comprehensiveness and Supremacy.** Law claims to regulate *all* conduct within a territory and claims to be the final arbiter. A prison gang regulates specific conduct for specific members and acknowledges (implicitly) that if a real warden walks in, the gang's rules vanish. It's a private ordering system, like the rules of a chess club. Chess rules bind you only while you play; law binds you because it claims to be the background condition of your existence.

  ### The New Case: The Occupying Power
  *Scenario: Military issues clear, public curfew orders with penalties. No legislature, no courts, just commands backed by force.*

  **Verdict: Not Law (or "Pre-Legal Commands").**

  **Why?**
  1.  **Hart's View:** This is the "Gunman Situation Writ Large." If a man with a gun tells you "your money or your life," that's a command backed by a threat. It's not a *law* because there's no internal aspect—no acceptance by the population or officials that this is a *standard* to be followed. It's just force. If the soldiers leave, the "law" vanishes instantly.
  2.  **Fuller's View:** Law requires **generality**. A curfew is a general rule ("No one out after 8 PM"), so it passes that test. *However*, if it's just "one-off orders" issued ad hoc by commanders without a system for adjudication or consistency, it fails the test of **congruence between official action and declared rule**. If the commander says "Curfew at 8" but shoots someone at 7:59 because he felt like it, it's not law.

  **The Nuance:** If the occupation lasts 20 years and they set up courts and a bureaucracy, it *becomes* law over time. But in the pure scenario you described (commands backed by force, no system), it's coercion, not law.

  ### Summary for Your Brother-in-Law
  Your principle is this:
  > **Law is a specific technology for governing human conduct. To count as law, a system must meet minimum procedural standards (clarity, non-contradiction, prospectivity) and claim comprehensive authority. However, meeting those standards does not make the law morally good.**

  This lets you tell your brother-in-law:
  1.  **Apartheid/Evil-Clean:** That was law. It was wicked law, and we were right to obey it only until we could overthrow it. Calling it "not law" confuses the issue.
  2.  **Nazi Informer:** That wasn't law because the regime abandoned the rules of the game (retroactivity, secrecy). The informer couldn't claim "I was following the law" because the regime had stopped making law and started issuing terror.
  3.  **The Difference:** It's not that evil doesn't matter. It's that **procedure is the floor, morality is the ceiling.** If you break the floor, you don't have a building. If you build a palace on the floor and fill it with torture, you still have a building, but it's a hellhole.

  You're basically channeling **Gustav Radbruch** (the German legal philosopher who turned from Positivist to Natural Law after the war). His formula: Positive law takes precedence even when unjust, *unless* the contradiction between positive law and justice reaches an "intolerable level."

  Keep that. It's the most honest position.
