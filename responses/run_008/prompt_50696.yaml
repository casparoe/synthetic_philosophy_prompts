  | **Selection Dynamics:** "natural selection within the prior steadily increases their share" | **Wrong** | **Misdescription of Mechanism** | There is no evolutionary process within the hypothesis space. Hypotheses do not reproduce; they are weighted by $P(h) \times P(data|h)$. Weight shifts due to Bayesian updating on data fit, not selection pressures between agents. |
