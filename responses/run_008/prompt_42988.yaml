      *   *Refining Move 1:* Maya is asserting the **Probabilism** thesis. It's not "mistaken" per se, but it's the axiom under dispute. Calling it "In-between" is fair.
      *   *Refining Move 2:* Jonah's "self-deception" is the **Argument from Arbitrariness**. It's a strong philosophical point. "Mostly Right."
