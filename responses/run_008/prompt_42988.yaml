      *   *Missing Point 1:* The distinction between **risk** (known distribution) and **ambiguity** (unknown distribution). If the box composition is unknown, it's ambiguity (IP territory). If the box composition is known (e.g., uniform), Maya is right (Precise Probability = 0.5). The prompt says "nothing... indicating which coin," implying ambiguity about the specific coin, but do we know the box distribution? "Biases spread somewhere between" suggests we don't know the distribution shape.
