answer: |-
  # The Humean Protocol for Literary Adjudication

  This procedure translates Hume's *Of the Standard of Taste* into an operational workflow for a five-judge panel. It accepts Hume's core premise—that aesthetic value is real but only accessible through the consensus of qualified observers—while acknowledging the administrative constraints of a modern prize.

  ## 1. Judge Selection: Proxies for the "True Judge"

  We cannot measure "delicacy of imagination" directly before the fact. We must use observable proxies to approximate Hume's four criteria. We will recruit a panel of five using the following matrix. No single judge needs to satisfy all proxies, but the *panel collectively* must cover them.

  | Humean Criterion | Operational Proxy | Weakness of Proxy |
  | :--- | :--- | :--- |
  | **Practice** | **Publication Record:** Each judge must have published ≥3 substantial pieces of literary criticism or fiction in the last 5 years. | **Quantity ≠ Depth:** A prolific reviewer may be shallow. A silent reader may be deep. This favors the vocal over the contemplative. |
  | **Comparison** | **Genre/Era Breadth:** The panel must collectively cover: Contemporary Fiction, Pre-1950 Classics, Non-English (in translation), and Genre (SF/Crime). | **Tokenism:** A judge may claim breadth without actual deep knowledge. We rely on their CV, not a test. |
  | **Freedom from Prejudice** | **Conflict & Reversal:** 1. No financial/personal ties to submitters. 2. Candidate must provide one example of a public judgment they later reversed. | **Hidden Bias:** We can only check declared conflicts. The "reversal" example can be staged or trivial. |
  | **Delicacy** | **Peer Nomination:** Each candidate must be nominated by two previous winners or judges of recognized prizes. | **Clubbiness:** This reinforces existing networks. It selects for "acceptable" taste, not necessarily "true" taste. |

  **The Circularity Worry:**
  *Objection:* If we select judges whose past work we admire, aren't we just enshrining our own prior preferences? Has the standard collapsed into the Director's taste?
  *Response:* The procedure **contains** this circularity but cannot **answer** it. Hume's standard is ultimately circular (the standard is the judges; the judges are those who meet the standard). We break the circle slightly by diversifying the *sources* of nomination (not just the Director's network) and requiring the "Reversal" proxy. This ensures the judges are capable of changing their minds, which prevents the panel from being a monolith of the Director's current preferences. We are not finding "Truth"; we are institutionalizing "Scrutiny."

  ## 2. Deliberation Protocol: From Sentiment to Consensus

  Hume argues that disagreement is widest about lesser works and narrows as quality rises. The protocol forces disagreement into the open early to distinguish "values clashes" from "perceptual errors."

  **Phase 1: Blind Scoring (Week 1 of Deliberation)**
  *   Judges submit numerical scores (1–10) and a 200-word justification *before* meeting.
  *   **Rule:** Justifications must cite textual evidence (passages, structural choices), not general effects ("I felt moved").
  *   **Purpose:** Isolates the individual sentiment before social pressure.

  **Phase 2: Reason-First Discussion (Week 2)**
  *   Scores are revealed.
  *   **Rule:** Discussion must proceed from the *lowest* scored books to the *highest*.
  *   **Rule:** Judges with divergent scores (±3 points) on the same book must speak first. They must articulate *what they saw in the text* that caused the sentiment.
  *   **Purpose:** Hume suggests many disagreements arise from one judge missing a detail. This allows "perceptual correction."

  **Phase 3: The Second Vote & Dissent (Week 3)**
  *   Judges vote again.
  *   **Shortlist Rule:** A book requires 4/5 votes to be shortlisted.
  *   **Dissent Mechanism:** If a book receives 3/5 votes, it is rejected, *unless* the minority (2 judges) files a "Minority Report." This report must argue that the majority failed the "Comparison" test (i.e., they lacked the context to see the book's innovation). The Director then holds a veto to include the book as the 6th slot.
  *   **Winner Rule:** Requires 5/5 consensus. If 4/5, the 5th judge must write a concurring note explaining their reservation. If 3/2, the book is ineligible for the Win (it remains on the shortlist only).

  **The Stopping Rule:**
  If, after Phase 2, the disagreement remains 3-2 based on *moral* or *political* grounds (e.g., "This vision is repellent" vs. "This vision is honest"), the protocol declares this a **Values Pluralism** event. The procedure cannot settle this. The book is ineligible for the Win. It may be shortlisted only if the 3 majority agree the *craft* is impeccable despite the moral objection.

  ## 3. The Morally Difficult Cases: The Embodiment Rule

  Hume argues that moral sentiments influence aesthetic pleasure. A vicious work causes unease, lowering its beauty. However, we must distinguish between a work's *message* and its *artistic integrity*.

  **The Rule:** Judges must apply the **"Embodiment Test."**
  *   **Question:** Does the form of the work *enact* its moral vision, or is the vision merely *attached* to the form?

  **Application:**
  1.  **High Craft / Repellent Vision:** (e.g., A beautifully written novel advocating cruelty).
      *   *Verdict:* If the cruelty is integral to the aesthetic effect (the horror is the point), it **passes**. If the cruelty is gratuitous or the author seems to endorse it without aesthetic distance, it **fails**.
      *   *Usable Instruction:* "Is the ugliness necessary for the beauty? If you removed the immoral element, would the book collapse? If yes, judge it as art. If no, judge it as propaganda."
  2.  **Clumsy Craft / Admirable Heart:** (e.g., A poorly written novel with a kind message).
      *   *Verdict:* **Fails.** Hume prioritizes the sentiment *caused by the art*. If the craft is clumsy, the sentiment is likely kitsch or manipulation, not aesthetic pleasure.
      *   *Usable Instruction:* "Does the goodness arise from the reading experience, or is it a lesson the author is teaching you? If it is a lesson, it is not art."

  ## 4. The Distortions: Costs of Operation

  To make Hume usable, we have broken his theory in three places.

  1.  **Dropped: Timelessness.** Hume's standard converges over centuries. We converge in three months.
      *   *Cost:* We will likely reject works that require 50 years to be understood. We privilege the "currently intelligible" over the "radically new."
  2.  **Bent: Delicacy as CV.** We treat "delicacy" as a track record.
      *   *Cost:* We exclude the unknown genius. The procedure is inherently conservative; it favors established voices who have already been vetted by the market.
  3.  **Vacuous Distinction: Freedom from Prejudice.** We check conflicts of interest, but not aesthetic prejudices.
      *   *Cost:* A judge may be free of financial bias but deeply biased against experimental fiction. The "Comparison" proxy mitigates this, but a panel of five cannot cover all human prejudice. Some distinctions (e.g., "high" vs. "low" culture) will survive the checklist simply because the judges inhabit a specific class.

  ---

  ## Simulation: Running the Procedure on Three Cases

  Here is how the protocol processes the three recurring archetypes from your recent years.

  ### Case A: The Cold Machine
  *Description:* Formally brilliant, technically immaculate, emotionally inert. One judge calls it "a machine for impressing critics."
  *   **Phase 1 (Blind):** Scores: 9, 9, 9, 6, 5.
      *   *Justifications:* High scorers cite "structural innovation." Low scorers cite "no human connection."
  *   **Phase 2 (Discussion):** The low scorers argue "inertness." The high scorers argue this is a failure of *Comparison* (the low scorers expect 19th-century warmth in a 21st-century form).
      *   *Embodiment Test:* Is the coldness integral? Yes, the form enacts alienation.
  *   **Phase 3 (Vote):** The low scorers, pressured by the "Comparison" argument, acknowledge their prejudice. They raise scores to 7.
      *   *Final Score:* 9, 9, 9, 7, 7.
  *   **Outcome:** **Shortlisted.** (4/5 votes achieved via persuasion).
  *   **Winner Eligibility:** Yes.

  ### Case B: The Sprawling Sentimental
  *Description:* Four superb chapters, bloated remainder. Beloved by booksellers.
  *   **Phase 1 (Blind):** Scores: 8, 8, 5, 5, 4.
      *   *Justifications:* High scorers cite "emotional payoff." Low scorers cite "lack of unity/design."
  *   **Phase 2 (Discussion):** Hume values "unity of design." The bloat is a structural failure, not just a moral one. The "superb chapters" are fragments, not a whole.
      *   *Embodiment Test:* Does the bloat serve the sentiment? No, it dilutes it.
  *   **Phase 3 (Vote):** No movement. The structural flaw is objective.
      *   *Final Score:* 8, 8, 5, 5, 4.
  *   **Outcome:** **Rejected.** (Only 2/5 votes). Minority Report filed arguing "Reader Joy" trumps "Unity." Director vetoes the Minority Report because "Unity" is a stronger Humean criterion than "Joy."
  *   **Winner Eligibility:** No.

  ### Case C: The Tearjerker
  *Description:* Adequate prose. Final movement called "most moving thing in a decade" by one judge; "engineered tearjerking" by two others.
  *   **Phase 1 (Blind):** Scores: 10, 6, 6, 5, 5.
      *   *Justifications:* High scorer cites "genuine grief." Low scorers cite "manipulative tropes."
  *   **Phase 2 (Discussion):** This is a "Delicacy" clash. Is the sentiment real or manufactured?
      *   *Embodiment Test:* The prose is "adequate." Does the form *enact* the grief? The low scorers argue the grief is *told*, not *shown*.
  *   **Phase 3 (Vote):** The split remains. The High Scorer cannot convince the others that the craft supports the emotion.
      *   *Final Score:* 10, 6, 6, 5, 5.
  *   **Outcome:** **Shortlisted (via Director Veto).** It fails the 4/5 rule. However, the High Scorer files a Minority Report claiming the others lack "Delicacy" (are too cynical). The Director uses the 6th slot to include it, to preserve panel harmony.
  *   **Winner Eligibility:** **No.** (Split is > 2 judges).

  ### The Winner Selection
  *   **Contenders:** Case A (The Cold Machine) is the only book eligible for the Win (4+ votes, no moral veto).
  *   **Decision:** **Case A Wins.**

  ### The Unpopular Outcome
  **You (the Director) will not like this.**
  *   **Why:** Case A is "emotionally inert." It is a PR nightmare. You will have to defend a book in interviews that the public may find cold and unlikable. It does not celebrate "humanity" in a soundbite-friendly way.
  *   **Why the Procedure Says It:** The protocol prioritizes **Practice and Comparison** (technical innovation recognized by peers) over **Immediate Sentiment** (which is prone to prejudice). The procedure diagnosed the "coldness" as a failure of the *readers'* expectations, not the *book's* merit. By forcing the judges to articulate textual evidence, the "inertness" claim collapsed under the weight of the "structural innovation" claim. Hume's standard favors the verdict of the qualified over the feelings of the crowd. The procedure protected the book from the judges' own desire for warmth.

  ---

  ## Limits: Where the Director Must Decide

  This procedure silently refuses to answer three questions. You must answer them alone.

  1.  **The "Genius Ahead of Time" Problem:**
      *   *Refusal:* The procedure assumes the "True Judges" are currently alive and present. It cannot account for a book that requires 50 years to be understood.
      *   *Director's Burden:* You must decide if you are willing to risk the prize's reputation on a book that might be a failure now but a classic later. The procedure will likely reject it. You must override the procedure if you choose to bet on history.
  2.  **The Diversity of Voice:**
      *   *Refusal:* Hume's "Standard" is historically elitist. Our proxies (CVs, Peer Nomination) reinforce existing power structures. The procedure does not guarantee demographic diversity among authors.
      *   *Director's Burden:* You must decide if "Merit" (as defined by the panel) is sufficient, or if you need to intervene to ensure the shortlist reflects the reading public. The procedure will not do this for you.
  3.  **The PR Defense:**
      *   *Refusal:* The procedure produces a Winner; it does not produce a Narrative. It justifies the choice to the judges, not to the public.
      *   *Director's Burden:* When Case A wins, you cannot say "The algorithm decided." You must craft the story. You must translate "structural innovation" into "human truth" for the press. The procedure gives you the truth; you must sell the lie that makes it palatable.

  **Final Instruction:** Run the selection. Accept the Cold Machine. Defend it not as "cold," but as "honest." That is your job. The procedure's job is only to ensure you aren't horse-trading.
