answer: |-
  # Curriculum Committee Q&A Prep Sheet
  **Proposal:** Required Secondary Course: *Parallel Lives & Moral Reasoning*
  **Method:** Plutarchian Biography (Incidents > Achievements; Failures Included; Paired Contrasts; No Stated Moral)

  ---

  ### 1. The Developmental Psychologist
  **Likely Speaking Order:** 1st (Feasibility Gatekeeper)
  **Damage Rank:** **2 (High)**
  **Objection:** "Secondary students are transitioning from concrete to formal operational thinking. Relying on *emulation* risks locking them into a heteronomous morality where authority dictates value. Isn't this a regression? We need them reasoning through dilemmas, not memorizing exemplars."

  **Your Reply (1 min):**
  "I agree that blind imitation is developmentally regressive. However, this course does not ask for imitation; it asks for *judgment*. By using Plutarch's method of paired contrasts—placing two lives side-by-side without a verdict—we force the student into the evaluative role. They cannot simply copy; they must weigh conflicting virtues and vices. This bridges the gap between concrete exemplars and abstract reasoning. We aren't asking 'Who should I be?' but 'How do these choices play out?' It uses the developmental need for role models as a scaffold to reach the higher stage of autonomous ethical reasoning you advocate for."

  **Concede Up Front:** Acknowledge that traditional "character ed" often fails by demanding uncritical copying.
  **Soft Spot Flag:** **Do not bluff here.** If a teacher presents the lives as "heroes to copy" rather than "cases to judge," the Psychologist is right. You must guarantee teacher training focuses on *facilitating judgment*, not *promoting heroes*.

  ### 2. The Historian of Antiquity
  **Likely Speaking Order:** 2nd (Content Validity)
  **Damage Rank:** **1 (Critical)**
  **Objection:** "Plutarch's *Lives* are rhetorical constructions, not history. He admits to prioritizing moral illustration over factual accuracy. If we teach these as 'lives,' we are trading on students' ignorance of the anachronisms and fabrications. Isn't this intellectually dishonest?"

  **Your Reply (1 min):**
  "You are absolutely correct that Plutarch is not writing modern history. But that is precisely why he fits a *character-education* course rather than a history course. We are not teaching the facts of the Peloponnesian War; we are teaching the rhetoric of moral argument. We will explicitly frame the texts as 'moral portraits' rather than 'biographical data.' In fact, analyzing *why* Plutarch shaped a narrative to highlight a specific vice or virtue becomes a meta-lesson in how moral arguments are constructed. The lack of historical fidelity doesn't weaken the moral inquiry; it shifts the focus to the interpretation of character."

  **Concede Up Front:** Admit immediately that the texts are not historically reliable in the modern sense.
  **Soft Spot Flag:** **This is your greatest vulnerability.** If the school's mission emphasizes "Truth" or "Fact-Based Inquiry," this reply may feel like sophistry. If pressed, admit that some historical context must be taught alongside to prevent students from treating fiction as fact.

  ### 3. The Social-Learning Theorist
  **Likely Speaking Order:** 3rd (Implementation Risk)
  **Damage Rank:** **3 (Medium-High)**
  **Objection:** "Modeling theory suggests students imitate salient behaviors that appear rewarded. If we present figures with serious vices—say, Caesar's ambition—who ultimately succeed, the 'failures included' rule might not stick. Students often imitate the vice that led to the power, not the virtue that led to the sacrifice."

  **Your Reply (1 min):**
  "That is the exact risk the 'failures included' rule is designed to mitigate. We do not end the biography at the triumph. We trace the long-term cost of the vice. Caesar's ambition leads to the Rubicon, but also to his assassination and the end of the Republic. We structure the reading so the 'reward' of the vice is shown as transient, while the social cost is enduring. We also rely on the paired contrast: if one figure succeeds through ambition and the other fails through it, the student sees the variable outcome. We make the *consequences* the object of study, not the *status*."

  **Concede Up Front:** Acknowledge that charisma often masks vice in the short term.
  **Soft Spot Flag:** **Be careful.** Teenagers are notoriously good at glamorizing the "tragic flaw." You cannot guarantee they won't romanticize the vice. Admit that this requires careful debriefing discussions to ensure the cost is registered.

  ### 4. The Virtue Ethicist
  **Likely Speaking Order:** 4th (Ally/Refinement)
  **Damage Rank:** **4 (Low)**
  **Objection:** "I'm sympathetic, but how do we ensure emulation doesn't collapse into conformity? If the biographer highlights specific traits, aren't we just training students to conform to the biographer's specific conception of the *telos*?"

  **Your Reply (1 min):**
  "That is why the fourth rule is 'never cap with a stated moral.' In traditional hagiography, the author tells you what to learn. Here, the text ends, and the assessment begins. The student must articulate the *telos* themselves. We are not training conformity to a specific virtue list, but habituating the practice of *phronesis*—practical wisdom. They aren't learning 'be brave like Achilles'; they are learning 'how to discern when bravery becomes recklessness.' The variation in the pairs ensures there is no single conformist outcome."

  **Concede Up Front:** Acknowledge that the biographer's bias is inevitable.
  **Soft Spot Flag:** **Minimal risk.** This is your strongest philosophical ground. Just ensure you don't sound like you're claiming total neutrality.

  ---

  ### Design Rules Analysis

  **Which rule is doing the most work?**
  **Paired Contrasts.** This is the engine of the course. Without the pairing, the biographies become isolated stories where the student either accepts or rejects the whole person. The pairing forces the *comparison* mechanism, which generates the moral reasoning. It transforms the student from a passive receiver of a story into an active judge of character.

  **Which rule is most vulnerable to being dropped?**
  **Failures Included.** There will be immense pressure—from parents, administration, or even the teachers—to "protect" the students from dark material or to keep the figures "inspirational." It is the easiest rule to quietly soften ("Let's focus on his leadership, not his domestic abuse"). If this rule goes, the course becomes the "hagiography with theology removed" that you criticized in your proposal.

  ---

  ### The Question You Hope Nobody Asks

  **"How do you assess this?"**
  *(Specifically: "If there is no stated moral and the goal is autonomous reasoning, what is the rubric? If you grade their moral conclusions, aren't you grading for conformity? If you grade their reasoning process, isn't that just English class?")*

  **Why you fear it:** It exposes the tension between "character formation" (which is internal and long-term) and "schooling" (which is external and immediate). If you have a rubric, you risk enforcing conformity (violating your thesis). If you don't have a rubric, the committee cannot approve a required course.

  **Prep:** Have a sample assessment ready that grades the *quality of evidence cited from the text* to support a judgment, explicitly stating that the *judgment itself* is not graded for correctness, only for coherence and textual support.
