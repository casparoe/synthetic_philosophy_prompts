answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** Grants Committee
  **DATE:** November 15, 2023
  **SUBJECT:** Allocation of $200 Million Unexpected Bequest

  ### 1. Recommendation

  The Grants Committee recommends splitting the $200 million bequest as follows:

  *   **$120 Million (60%)** to Long-Horizon Existential Risk Reduction (benefits accruing primarily post-2100).
  *   **$80 Million (40%)** to Near-Term Global Health and Development (outcomes measurable within 10–15 years).

  This allocation prioritizes the potential scale of the long-term future while maintaining a substantial hedge against the possibility that humanity's timeline is shorter than anticipated. The following sections detail the reasoning, specifically addressing the philosophical objections raised during our preliminary discussions.

  ### 2. Reasoning: The Value of the Future vs. The Doomsday Argument

  The core tension in this decision is between the *magnitude* of the long-term future and the *probability* of its existence.

  **The Case for Long-Horizon Grants**
  If humanity survives and flourishes, the number of future people could outnumber all past humans by orders of magnitude. Even if the probability of securing that future is low, the sheer number of lives at stake creates a high "expected value" for investments that reduce existential risk (e.g., biosecurity, AI alignment). This is the standard longtermist view.

  **The Cosmologist's Objection (The Doomsday Argument)**
  Trustee [Name] correctly identifies a philosophical challenge to this view known as the Doomsday Argument. The logic is as follows:
  1.  Assume you are a random sample of all humans who will ever live (the Self-Sampling Assumption, or SSA).
  2.  Approximately 100 billion humans have lived so far.
  3.  If the total number of humans were to be vastly larger (e.g., trillions), it would be highly improbable for us to find ourselves so early in the sequence (among the first 100 billion).
  4.  Therefore, it is more likely that the total number of humans is not vastly larger than the number who have already lived.

  If this argument holds, the "long future" required to justify our second bucket may not exist.

  **Why This Does Not Compel a 100% Near-Term Allocation**
  While the Doomsday Argument is logically coherent, it relies on premises that are heavily contested in epistemology and probability theory. We cannot treat it as an empirical fact.

  *   **The Self-Indication Assumption (SIA):** As noted by Trustee [Name], SIA counters SSA by suggesting that your very existence is evidence that the world contains many observers. In a world with trillions of humans, there are simply more "slots" for you to exist in than in a world with only 200 billion. This effectively cancels out the Doomsday conclusion. Because there is no consensus among philosophers on whether SSA or SIA is the correct framework, we cannot base a total portfolio shift on SSA alone.
  *   **The Reference Class Problem:** This is the decisive factor. The Doomsday Argument only works if we define the reference class as "biological *Homo sapiens*." Trustee [Name] raised the critical point: if future beings include digital minds, uploaded consciousness, or post-biological intelligence, the reference class expands exponentially. If we are merely early in the history of *intelligence* rather than the history of *biology*, our birth rank remains "early" even if trillions of beings follow us. Since we cannot principledly exclude digital minds from the moral community, the Doomsday Argument loses its predictive power.

  **Conclusion on Philosophy:** The Doomsday Argument introduces uncertainty, not impossibility. It suggests we should not be *certain* of a long future, but it does not prove the long future is unlikely enough to warrant zero investment.

  ### 3. Addressing the "Universal Application" Objection

  Program Staff raised a pragmatic objection: *If the Doomsday Argument is sound, it applies to everyone's long-term plans (pensions, treaties, infrastructure). Why should this foundation shift its portfolio based on an argument that invalidates all long-term planning equally?*

  This objection highlights a category error regarding the foundation's mandate compared to other institutions.

  1.  **Fiduciary vs. Philanthropic Duty:** A pension fund has a legal and ethical obligation to specific, living beneficiaries. They must discount the future heavily because their clients need to eat in 2030. If the Doomsday Argument suggests a higher risk of civilizational collapse, pension funds are actually *more* justified in focusing on the near term. Our foundation, however, has no living beneficiaries. Our mandate is to maximize social impact, which includes the welfare of potential future people. We are the only actors in the ecosystem free to optimize for the very long term.
  2.  **Market Failure:** Even if the Doomsday Argument is correct, governments and markets likely already over-discount the future due to political cycles and profit motives. If the argument is *false* (as the Reference Class problem suggests), the market is still under-investing in existential risk. By allocating 60% to the long term, we are not accepting the Doomsday Argument as truth; we are acknowledging it as a risk factor while filling a gap that other institutions (constrained by the Staff's logic) cannot fill.

  ### 4. Why a 60/40 Split?

  We reject a 100% allocation to either bucket.

  *   **Why not 100% Long-Term?** We must respect the Cosmologist's strongest point: epistemic humility. The Reference Class problem is unresolved. If the Doomsday Argument is right and the future is short, a 100% long-term portfolio results in zero impact. The 40% near-term allocation ensures tangible, measurable good (lives saved, disease eradicated) even if humanity does not reach the 22nd century.
  *   **Why not 100% Near-Term?** This would concede that the Doomsday Argument is settled science. Given the stakes (billions of potential future lives), the cost of being wrong about the Doomsday Argument is far higher than the cost of being wrong about near-term marginal utility. $80 million in global health will save many lives, but $120 million in risk reduction could preserve *all* future lives.

  ### 5. Triggers for Revisiting the Allocation

  This allocation is not permanent. The Grants Committee recommends a formal review of this philosophical framework in ten years (2033). We should revisit the split if:

  1.  **Reference Class Clarity:** If there is significant progress in the ethics of digital minds (e.g., a consensus on whether AI systems count as moral patients), we must recalculate the "total number of observers."
  2.  **Existential Risk Metrics:** If specific existential risks (e.g., engineered pandemics or unaligned AI) move from theoretical to imminent (e.g., verified near-miss events), the long-horizon bucket may need to expand to emergency levels.
  3.  **Demographic Collapse:** If global population peaks and declines sharply sooner than expected, the "total humans" estimate drops, lending empirical weight to the Doomsday Argument independent of philosophy. In that case, the Near-Term bucket should increase.

  ### 6. Conclusion

  The Doomsday Argument is a fascinating philosophical constraint, but it is not a stop sign. It relies on assumptions about probability and identity that are far from settled. As a foundation, our comparative advantage is the ability to absorb uncertainty that other institutions cannot. We recommend proceeding with the 60/40 split to maximize expected value while hedging against the possibility that our time is shorter than we hope.

  **Approved for Circulation:**

  [Your Name/Title]
  Grants Committee Chair
