      *   *Final Decision:* **$120 Million (60%) to Long-Horizon Existential Risk** and **$80 Million (40%) to Near-Term Global Health**.
      *   *Why:* This takes the Long-Term view seriously (potential value of the future is vast) but hedges against the Doomsday Argument being correct (by keeping substantial near-term funding). It forces me to argue *against* the Cosmologist's definitive conclusion while respecting his premise.

      *Wait, re-reading the prompt's constraint:* "If you recommend mostly long-horizon grants, the self-indication response and the reference-class indeterminacy have to do real argumentative work."
