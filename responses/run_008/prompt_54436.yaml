      *   *Better Approach:* A **60/40 split in favor of Long-Horizon Existential Risk**. Why? Because $200M is "drop in the bucket" for global health (marginal utility diminishes) but could be catalytic for x-risk (niche field). Also, the philosophical objections to DA (SIA and Reference Class) are strong enough to prevent ruling out the long future entirely.
