answer: |-
  You bring me evidence from across the seas and ages, and it is clever, but you confuse the raw material with the finished craft. Yes, a child may fetch a dropped object, just as a dog may guard its master or a horse may carry a load. Is this benevolence? Or is it merely a spontaneous reaction of feeling, unguided by any understanding of duty or place? If that child grows up following only that impulse, he will help his father steal a sheep because he loves his father, or he will exhaust himself trying to save every stranger until he collapses. That is not virtue; that is chaos. My claim is not that humans are demons, but that our innate impulses, however occasionally pleasant, are unreliable and unmeasured. Without the guide-rules of ritual to tell us *when* to help, *who* to help, and *how* to help without disrupting social order, that little sprout is just a weed waiting to choke the garden.

  So no, I am not defining nature narrowly to win a debate; I am distinguishing the heaven-sent from the human-made. You call it a sprout of goodness; I call it the raw clay. Clay has the potential to become a sacred vessel, but left to itself, it is just mud that cracks in the sun. The goodness you admire in those toddlers is not yet goodness—it is merely the capacity to be taught. If nature were truly good, why would we need the sages to laboriously compose music and rituals to straighten us? We would simply follow our hearts. But we know that following the heart without learning leads to strife. The value lies precisely in the effort, the bending of the wood, the firing of the clay. To say the clay is already the vessel is to insult the potter.
