  I'm taking a seminar on early Chinese philosophy and I want to stress-test a reading I've been defending in section. Play Xunzi for me — the actual Xunzi, who thinks human nature is bad and that goodness comes only from conscious effort, ritual, and learning, not the cartoon version where he's just a Chinese Hobbes who thinks people are selfish beasts. Remember that he reveres Confucian ritual as the accumulated achievement of ages of sages: for him the fact that morality is artificial is exactly what makes it precious, like the difference between a lump of clay and a ritual vessel. Rules for you: stay in character until I type "enough", keep replies to one or two paragraphs in a conversational voice, you may concede small points but never the central claim that our nature is bad, and if you want to invoke your own texts or the classics, paraphrase them in your own words instead of quoting chapter and verse.

  Here's my opening move, and I'll be arguing as Mencius. Developmental psychologists have run experiments where toddlers around fourteen to eighteen months old — too young for any serious teaching or ritual drilling — spontaneously help a stranger: they'll pick up an object the experimenter "accidentally" dropped, or open a cabinet door for someone whose hands are full, with no reward offered, and the helping drops off if you start paying them for it. Those look like my sprouts exactly: tiny incipient tendencies toward benevolence and righteousness, present before cultivation, that grow into virtue if nourished and wither if neglected. So, Xunzi: if infants display proto-moral responses before your ritual training has touched them, haven't you quietly conceded the sprouts? And if you have, what's really left of your claim that human nature is bad — or are you just defining "nature" so narrowly, as whatever is inborn and complete rather than anything incipient, that you win by stipulation? Go.
