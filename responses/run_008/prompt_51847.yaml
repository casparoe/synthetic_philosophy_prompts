answer: |-
  The brass key felt heavy in Elias's pocket as he locked the greenhouse gate. It was Friday afternoon, the light already thinning over the botanical garden's Victorian glass structure. Inside, the rare *Orchidaceae* collection waited, sensitive to temperature shifts below fifty degrees. Elias had meant to check the main valve, to ensure the backup heater was armed for the weekend. He had even walked halfway to the control box before his phone buzzed. A message from his wife. Dinner plans. He tucked the thought of the valve away, telling himself he'd reset it Monday morning before the staff arrived. He turned off the main lights and left.

  By Saturday night, the frost came. It didn't smash the glass; it simply seeped in, a silent thief finding the cracks in the seals. The temperature inside dropped steadily. The orchids, accustomed to tropical humidity, began to cell-collapse. It was a quiet death, no screaming, just the slow darkening of leaves from vibrant green to translucent slime.

  Mrs. Gable walked her terrier past the garden perimeter twice on Sunday. She knew Elias was away; she'd seen his car missing from the lot. As she passed the glass house, she noticed the darkness. Usually, the security lights cast a amber glow on the path. Now, there was only the grey wash of the moon. She stopped. She knew enough about gardens to know that cold kills. She had a phone in her pocket. She could have called the emergency number listed on the gate. She could have shaken the fence, made noise, drawn attention. She stood there for a minute, breathing white clouds into the air. Then, she tugged the leash. "Not our business, Buster," she murmured, and walked on.

  On Monday morning, the mail carrier noticed the accumulation of flyers in Elias's box. He knew the routine. No one left papers for three days unless they were gone. He looked toward the greenhouse. He saw the frost clinging to the lower panes. He had a master code for the outer fence, granted for delivery purposes. He could have walked up, peered through the glass, seen the blackened stems. He could have radioed dispatch. Instead, he stuffed the flyers deeper into the box to keep them dry and finished his route.

  Elias returned at 8:00 AM. He unlocked the gate, the brass key turning with a familiar click. The air inside was stagnant and biting. He didn't need to touch the plants to know. The smell was sweet and rotting. The *Cattleya* collection, thirty years of grafting and care, was gone.

  The Director arrived an hour later. She walked the aisles in her coat, gloves clasped tight. She didn't look at the frost on the ground or the dark control box. She looked at Elias.

  "The valve?" she asked.

  "I forgot," Elias said. His voice sounded too loud in the dead air. "I meant to do it Friday."

  "Mrs. Gable walks past every day," the Director said, not as an accusation, but as a fact. "The mail carrier comes five times a week. The security patrol drives the perimeter."

  "They didn't know," Elias said. "I mean, they could have checked. If Mrs. Gable had called, the maintenance team could have turned the heat on. If the mailman had looked..."

  The Director turned to him. Her expression wasn't angry, but it was final. "You hold the key, Elias. You signed the log. You were instructed to secure the climate control before departure."

  "I know," he said. "But physically... anyone could have saved them. The counterfactual is the same. If Mrs. Gable acts, the plants live. If I act, the plants live. Both of us didn't act."

  The Director picked up a dead bloom. It crumbled to dust in her glove. "Physically, yes. But you were the one supposed to be here. The rest of the world is just background noise. You were the signal."

  She handed him the incident report form. "Sign it. We need to process the loss."

  Elias took the pen. He looked at the line where he had to initial the cause of failure. *Operator Error.* He thought of Mrs. Gable walking her dog in the cold, of the mailman tucking papers away. They had all done nothing. He had done nothing. The outcome was identical. The physics of the frost didn't care who held the key.

  But as he signed, he understood that the cause wasn't the frost, and it wasn't the silence of the neighbors. It was the space where his action should have been, a space defined not by physics, but by the promise he'd made when he took the brass key. He wrote his name. The ink dried quickly in the cold air. Outside, the sun came out, shining equally on the dead flowers and the people who walked past them, none of whom were to blame.
