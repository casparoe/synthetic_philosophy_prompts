answer: |-
  ### The Species

  **The Thermal-Ox**
  The largest terrestrial herbivore on the survey, the Thermal-Ox stands four meters at the shoulder, supported by a low-density skeletal structure filled with insulating gas sacs that keep its body mass deceptively light relative to its volume. Its cranium, however, is disproportionately massive, housing a 14-kilogram brain—the highest absolute mass recorded on the planet. Because the body's calculated mass is low due to the gas sacs, the Ox's Encephalization Quotient (EQ) scores anomalously high, surpassing even the system's primates. Dissection reveals the brain is 85% glial tissue and vascular networking, structured as a counter-current heat exchanger to dump metabolic warmth from its gut fermentation; the neuronal density is sparse, with long-loop reflex arcs dominating the cortex. In the wild, Oxen exhibit no play behavior, do not distinguish between kin and strangers, and when a herd member dies, the others step over the carcass without breaking stride, driven solely by grazing instincts and thermal regulation needs.

  **The Mourn-Wren**
  A arboreal omnivore no larger than a field mouse, the Mourn-Wren possesses a brain weighing only 0.8 grams, with an EQ that is average for its clade and a total neuron count that is an order of magnitude lower than the survey's baseline for "higher vertebrates." Despite this microscopic hardware, their neural tissue is hyper-dense, with unprecedented myelination speeds allowing for rapid recursive processing. Field logs document Wrens modifying tools to retrieve buried companions, engaging in prolonged silence and feather-grooming around deceased group members, and caching food in specific locations weeks before seasonal shifts that have not yet occurred. When a Wren is injured, others in the flock cease foraging to feed it, and if the injury is fatal, the group actively covers the body with soil and distinct aromatic leaves, a behavior that persists even when the carcass is experimentally removed and replaced.

  ***

  ### The Four Reasonings

  **The Mass Absolutist**
  "For the Thermal-Ox, the verdict is clear: 14 kilograms of neural tissue cannot be dismissed. To deny it moral status is to deny the physical reality of the organ. The Mourn-Wren, conversely, is biologically negligible. At 0.8 grams, its brain is less than the threshold for a simple reflex arc in terrestrial mammals. We harvest the Wrens; we protect the Oxen. The math is absolute."

  **The EQ Proponent**
  "Mass is crude; ratio is truth. The Ox's EQ indicates a massive surplus of cognitive capacity over its bodily maintenance needs. It is an intellectual giant relative to its form. The Wren's EQ is mundane; it is operating exactly where evolution predicts for a rodent-sized organism. There is no 'extra' brain there to support complex experience. The Ox is a person; the Wren is a machine."

  **The Neuron Counter**
  "You are both ignoring the cellular substrate. The Ox has billions of neurons, even if sparse. The Wren has millions. Total processing units dictate total potential experience. You cannot build a soul out of fewer parts. The Ox's sheer volume of wiring guarantees a deeper well of sensation. The Wren is running a simple script on a microchip; the Ox is running a complex simulation on a mainframe."

  **The Capacity-Based Sentio-Centrist (Protagonist)**
  "Metrics are proxies, not the thing itself. The Ox's anatomy suggests a radiator, not a mind; its behavior confirms a lack of subjective continuity—it does not mourn, plan, or recognize. The Wren's anatomy is efficient, but its behavior—grief, altruism, temporal planning—is the only data we have that *resembles* our own moral experience. If we wait for a neuron count to validate grief, we are measuring the ink and ignoring the poem."

  ***

  ### Load-Bearing Features & Vulnerabilities

  **The Thermal-Ox: The "Housekeeping" Architecture**
  *   **The Feature:** The claim that 85% of the brain is glial/vascular for thermal regulation.
  *   **The Vulnerability:** If a neuroanatomist argues that glial cells play a more active role in information processing than currently understood (as is debated in human neuroscience), the "radiator" theory collapses. If the heat exchange is incidental rather than functional, the massive brain reverts to being a "black box" of unknown potential.
  *   **If Subtracted:** Without the specific anatomical justification for the mass, the Mass Absolutist wins by default. The Ox becomes undeniably valuable simply because it is big. The thought experiment loses its bite because the "Hollow Giant" becomes just a "Giant."

  **The Mourn-Wren: The "Instinct" Loophole**
  *   **The Feature:** The reliance on complex behavior (grief, planning) as evidence of capacity.
  *   **The Vulnerability:** Behavior is always interpretable as sophisticated instinct (a "philosophical zombie"). A critic can argue that the Wren's burial ritual is a fixed action pattern triggered by scent, not an understanding of death.
  *   **If Subtracted:** If you remove the behavioral evidence, the Wren is just a mouse. The Sentio-Centrist has no ground to stand on. The entire moral weight rests on the assumption that *behavioral complexity maps to internal experience*, which is exactly what the colleague denies.

  ***

  ### The Colleague's Counter-Move & Staging

  **The Retreat to Unfalsifiability**
  Once cornered by the Wren's behavior and the Ox's hollowness, your colleague cannot argue the data anymore. He must retreat to the **Problem of Other Minds**. His strongest move is to say: *"Behavior is not experience. A thermostat reacts to heat; it does not feel it. The Wren reacts to death; it does not grieve. Unless you can show me the qualia, you are projecting. I choose to doubt the Wren because doubt is cheaper than starvation."* He moves from science to solipsism, making his position unfalsifiable. He admits the metrics might be flawed, but claims that *uncertainty* favors the exploiter, not the victim.

  **Staging the Confrontation**
  Do not stage this in a lab or a meeting room. Stage it **at the kill site**.

  1.  **The Setup:** The colleague has authorized a cull of the Mourn-Wrens to clear a landing zone or harvest a resource. The protagonist arrives too late to stop the order, but just in time to witness the aftermath.
  2.  **The Action:** A Wren lies dead. The flock is not scattering; they are performing the burial ritual *around the active machinery* of the survey team. They are placing leaves on the body while the colleague's subordinates sweep them away.
  3.  **The Turn:** The colleague is not shouting; he is checking a datapad. He is calm. He tells the protagonist, *"They are reacting to the scent of blood. It's a pheromone cascade. It looks like grief because you want it to be grief."*
  4.  **The Climax:** The protagonist forces the colleague to look at a specific detail: a Wren bringing food to the dead body, or a Wren refusing to leave despite the threat of being crushed. The colleague must then make a physical choice: step on the Wren to prove it's a machine, or step around it and admit it's a person. He steps around it, but verbally maintains his doubt. This dissonance is the victory: his actions betray his ethics, even if his words do not.
