  **Note on the Poem**

  I am highly confident in the philosophical accuracy of the paradox and the sceptical solution as presented by Kripke. The poem leans on Kripke's reconstruction of Wittgenstein rather than claiming to represent Wittgenstein's own views directly, acknowledging the distinction between the sceptical paradox and the sceptical solution. The envoi stages the communal turn without resolving the metaphysical anxiety, leaving the "bedrock" untouched. I took a liberty with the standard sestina envoi form by placing two end-words at the close of each of the three lines to ensure all six return prominently, rather than embedding three internally. I am least sure about the line "This is now what is meant" in stanza five; it risks sounding too definitive about meaning attribution, whereas the point is that justification ends. However, it aims to capture the shift from individual intention to communal attribution. The mathematical example (68 + 57 = 125 vs. 5) adheres to Kripke's specific quaddition function where operands >= 57 yield 5. The shifting senses of the end-words attempt to mimic the instability of meaning itself, preventing the reader from settling on a fixed definition across stanzas.
