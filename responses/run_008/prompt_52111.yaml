prompt: |-
  Longtime LessWrong lurker here, been reading about AI timelines and philosophy of math for like a decade, and there's a one-liner that keeps showing up in completely different arguments and I've never managed to pin it down: "verification is easier than generation" (sometimes "checking is easier than finding," sometimes it just gets waved at P vs NP without being stated). I first ran into it in an argument about whether superhuman AI is even possible, where someone claimed it as an obvious constraint — basically the idea being that since verifying a solution is cheap but finding one is hard, evolution got lucky once with humans and there's no reason to expect a second miracle. Fine. But then last week I saw the exact same slogan deployed to argue the opposite conclusion: that verification being cheap is exactly why AI takeover is underrated, because you can generate tons of candidate strategies, filter them by checkability, and insight was never the real bottleneck — search was, and search is what computers are for. And on top of that I've seen it used in arguments about proofs (why math is still human-centered), about markets vs central planning (the calculation debate, weirdly), and about why peer review sort of works even with lazy reviewers.

  So the slogan is clearly doing a lot of different jobs, and I suspect some of them it can't actually do. You're a theoretical computer scientist who thinks hard about the philosophy behind complexity theory — take "verification is easier than generation" and lay out, as a numbered list I can actually use in an argument, the distinct precise claims it could be expressing. I'd want you to be careful to distinguish the readings, e.g.: the literal formal statement about complexity classes (and note what's actually proven vs conjectured vs just false as stated — does P vs NP even say "verification is easier," given that NP is about polynomial-time verification of witnesses and "easier" is doing sneaky work there?); the average-case or typical-case empirical claim about real-world problems; the metaphorical claim about cognition and search vs. insight; and whatever the planning/evolution version is supposed to be. For each reading say whether it's trivially true, substantive but defensible, substantive and probably false, or just confused. And crucially, tell me which of the readings, if any, would actually support each of the two AI-strategy uses I described — I suspect both camps are leaning on something the slogan doesn't contain, but I want to see it worked out rather than hand-waved. Please think through the readings carefully before writing, brainstorm a bit first, and don't just pick the one you find most charitable and run with it — give me the full menu with verdicts. Also flag if any reading depends on unproven conjectures in a way that the people citing it usually don't notice, because that would be very useful ammunition next time this comes up in a comment thread.
