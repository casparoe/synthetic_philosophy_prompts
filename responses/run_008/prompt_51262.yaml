          *   *Structure:* The Lagoon. Marshy, defensible, poor soil. Forces reliance on sea/salt/trade.
          *   *Events:* Fleeing Attila/Lombards.
          *   *Analysis:* Braudel wins here. Geography *is* destiny. Without the lagoon, no Venice.

      *   **Phase 2: Rise & The Fourth Crusade (1000-1204)**
