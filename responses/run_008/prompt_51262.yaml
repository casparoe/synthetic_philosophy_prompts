      *   *Événements:* Political history, battles, treaties, individual actions (short-term, "dust on the surface").
      *   *Braudel's Bias:* He privileges the *longue durée*. Events are often seen as noise or epiphenomena of deeper structures.

  3.  **Map Venice's History to the Framework:**

