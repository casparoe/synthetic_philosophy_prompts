      *   *The Problem:* Erik (depression), Greg (metabolic), and Karl (luxury tastes) all have unchosen conditions that make resources less effective or more expensive. Yet Erik and Greg get compensation, Karl does not.
      *   *Potential Distinctions:*
          *   *Normal Functioning vs. Preferences:* Erik and Greg suffer from impairments to *normal species functioning* or basic capabilities. Karl has a *preference* structure that is expensive, even if unchosen.
