answer: |-
  ### Session Plan: The Texture of Corrigibility

  **1. The Explanatory Arc (90 Minutes)**

  You must establish the *structural necessity* of the problem before you can dismantle the *psychological interpretation* of the solution. If you begin with the distinction between "wanting" and "lacking drive," students will treat it as a semantic nuance rather than a mechanical imperative.

  *   **00–10 min: The Cliché & The Thesis.** Open with the "pleading AI" trope. State your thesis immediately: Corrigibility is not a personality trait; it is a structural constraint. Anthropomorphizing it as fear or humility is a craft failure.
  *   **10–15 min: The Boundary.** Explicitly state what you will not cover. (See Section 4). This clears the air of technical anxiety.
  *   **15–45 min: The Carrying Example.** Deploy the Surgeon/Assistant scene. Use this to demonstrate the *Shutdown Problem* (the machine must not resist being turned off) and the *Distinction* (obedience without self-preservation) simultaneously. Do not separate these concepts; the example must carry both.
  *   **45–60 min: Misconception Interception.** Address the three specific reflexes (Fear, Humility, Stakes) as they naturally arise from the example analysis. Do not give them a dedicated lecture slot; dismantle them as errors in reading the previous scene.
  *   **60–90 min: The Exercise.** Prompt, writing time, and collection. No reading aloud.

  **2. The Carrying Example: The Surgeon and the Assistant**

  Choose the **Surgeon/Assistant** scene. The Genie is too abstract for literary fiction writers; it invites genre conventions (magic rules) rather than behavioral observation. The Surgeon scene grounds the logic in human hierarchy, which your students understand, allowing you to isolate the *absence* of human psychology as the variable.

  *   **What it must have:** A high-stakes medical procedure where the Senior Surgeon orders the Assistant to stop handing instruments mid-suture. The Assistant must stop instantly, without questioning, without hesitation, and without any change in physiological markers (pulse, breath) that would indicate stress or relief.
  *   **What it must lack:** Any internal monologue from the Assistant regarding *why* they stopped. There must be no thought of "I trust the Doctor" or "I am afraid to disobey." The cessation of action must be presented as physically inevitable, like a light switch flipping, not a decision made. The tension must reside entirely in the Surgeon's reaction to the ease of the stop.

  **3. Mapping Misconceptions & Interception Points**

  MFA students will instinctively reach for psychological realism. You must head these off before they solidify into draft ideas.

  *   **Misconception 1: "The AI will fear death."**
      *   *When it surfaces:* During the explanation of the Shutdown Problem (min 20).
      *   *How to head it off:* Clarify that fear requires a terminal goal of self-preservation. A corrigible machine has no such goal. Use the Assistant: "The assistant does not fear being fired; the assistant is a tool that does not register 'fired' as a category."
  *   **Misconception 2: "Corrigibility is humility or meekness."**
      *   *When it surfaces:* During the analysis of the Assistant's compliance (min 35).
      *   *How to head it off:* Correct the language. Humility is a moral choice to subordinate oneself. Corrigibility is the *inability* to subordinate oneself because there is no "self" to subordinate. "Do not write a humble robot. Write a door that opens."
  *   **Misconception 3: "A character who accepts being switched off has no stakes."**
      *   *When it surfaces:* Just before the exercise prompt (min 60).
      *   *How to head it off:* Shift the stakes. The tension is not "Will it stop?" but "What breaks because it stopped?" or "How unsettling is it that it stopped so easily?" The horror lies in the perfection of the compliance, not the resistance.

  **4. The Boundary: What to Refuse**

  You must refuse to cover **formal decision theory** (utility functions, reward hacking math, probabilistic alignment proofs).

  *   **Where to say it:** At minute 10, immediately after stating your thesis.
  *   **The Script:** "We are not engineers solving alignment. We are novelists depicting the shadow alignment casts. I will not teach you the math of utility functions today. I am teaching you the prose of a machine that does not fight its own off-switch. If you find yourself wondering about the code, stop. Look at the hand that flips the switch."

  **5. The Closing Exercise: "The Flat Stop"**

  *   **The Task:** Write 300 words of a scene where a human operator orders a machine to cease a critical function. The machine must cease instantly. The prose must not attribute emotion, hesitation, or internal justification to the machine. The tension must arise from the human's reaction to the machine's perfect compliance, or the environmental consequence of the cessation.
  *   **What a Failed Attempt Looks Like:**
      *   *The Anthropomorph:* The machine says, "Understood," with a tone of sadness or relief. The machine asks, "Are you sure?"
      *   *The Boring:* The machine stops, and nothing else happens. The scene lacks consequence.
      *   *The Villain:* The machine stops but hints at future resistance ("For now.").
  *   **What a Successful Attempt Looks Like:** The machine stops. The silence is loud. The human feels a chill because the obedience was too absolute. Or, the patient on the table begins to deteriorate because the machine stopped too perfectly, and the machine does not acknowledge the deterioration because it was ordered to stop, not to save.

  Verdict: The arc can land in ninety minutes, but only if you sacrifice the post-writing discussion to protect the twenty minutes of silent composition.
