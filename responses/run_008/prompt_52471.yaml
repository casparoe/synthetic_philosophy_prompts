answer: |-
  The discipline resolves this tension by treating microfoundations as an explanatory constraint on parameter stability rather than an ontological denial of aggregate reality, allowing aggregates to function as causally effective emergent properties without violating the premise that only individuals optimize.

  The Lucas Critique does not demand strong ontological individualism—the thesis that only individuals exist—but rather a specific form of methodological individualism focused on identification: structural parameters (preferences, technologies) must be invariant to policy, whereas reduced-form aggregate correlations are not. This is an explanatory constraint, not an ontological one; it requires that models explain *why* aggregate relationships hold by referencing individual incentives, but it does not deny that the resulting aggregates have real-world effects. Consequently, the everyday treatment of GDP or inflation as causal variables is not a lapse into metaphysical holism but a recognition of emergent properties that supervene on individual actions yet exert downward causal influence by constraining individual choice sets. When a central bank targets inflation, it alters the constraint structure facing millions of agents; the aggregate price level is real in the same sense that temperature is real in statistical mechanics—it is a macro-state that determines probabilities and incentives at the micro-level without requiring a mystical group mind.

  The representative agent is the technical device that papers over the computational intractability of full aggregation, serving as a existence proof that micro-consistency is possible rather than a literal claim about homogeneity. This practice is consistent provided one accepts that supervenient properties can be causal; the tension arises only if one conflates the requirement for micro-consistent *explanation* with a denial of macro-level *ontology*. If you were to enforce the strongest ontological individualist reading strictly, aggregate policy targets would become incoherent objects because "inflation" or "unemployment" would cease to exist as distinct entities worthy of naming. Policy would have to be redefined as the direct manipulation of individual constraints or price signals across specific markets, rendering general equilibrium stabilization impossible due to the informational burden of tracking heterogeneous states rather than sufficient statistics. Thus, the discipline survives by accepting aggregates as real patterns with causal powers, using microfoundations merely to ensure those patterns remain stable when policymakers attempt to steer them.
