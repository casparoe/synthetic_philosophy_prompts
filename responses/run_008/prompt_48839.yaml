answer: |-
  ## Candidate Structures

  Before settling on the final design, I sketched three potential architectures. I rejected the first two for reasons that highlight why the third is necessary for your learning objectives.

  1.  **The "Chicken" Race:** Pairs accelerate toward a crash (counting up on a timer). Either can swerve (concede) to save the points.
      *   *Rejection:* This simulates *timing* and *nerve*, but it doesn't capture the *structural loss of control*. In Chicken, you always choose to swerve or crash. Schelling's point is about creating a situation where *neither* can choose to swerve.
  2.  **The "Dollar Auction" Escalation:** Students bid points for a prize, but both pay their bid.
      *   *Rejection:* This demonstrates sunk-cost fallacy and escalation, but it models a *voluntary* spiral. It fails to model the "tripwire" where the outcome is decoupled from the decision-maker's will at the critical moment.
  3.  **The "Brinkmanship Protocol" (Selected):** A bargaining game where the cost of disagreement is not chosen by the players, but determined by a risk parameter they set (or inherit) beforehand.
      *   *Selection:* This directly mechanizes Schelling's "threat that leaves something to chance." It allows for a clean transition from *controlled threat* (Round 1) to *probabilistic threat* (Round 2) to *reputational asset* (Round 3).

  ---

  ## The Session Design: "The Brinkmanship Protocol"

  **Logistics:**
  *   **Students:** 18 (9 Pairs).
  *   **Room:** Movable desks (face-to-face pairs).
  *   **Materials:** 9 six-sided dice, index cards (3 per student), score sheets, stopwatch.
  *   **Currency:** "Security Points" (SP). Top quartile of class gets full participation credit; others get proportional credit. (This creates low-stakes competition without grade anxiety).

  **The Payoff Structure (Printed on Score Sheets):**
  *   **Successful Deal:** Split 100 SP however you agree (e.g., 60/40).
  *   **No Deal (Round 1):** Both players receive **-50 SP**. (The "Veto" Penalty).
  *   **No Deal (Round 2 & 3):** Roll 1d6.
      *   If Roll $\le$ **Risk Level**: **Catastrophe** (-100 SP each).
      *   If Roll $>$ **Risk Level**: **Status Quo** (0 SP each).

  ### Phase 1: The Rational Impasse (15 Minutes)
  *   **Setup:** Pairs sit. Give each pair one score sheet.
  *   **Rule:** Negotiate a split of 100 SP. Either player holds a **Veto Card**. If played, the deal dies, and both get -50 SP. If time (3 mins) runs out with no deal, both get -50 SP.
  *   **The Trap:** The Veto is a "controlled threat." To use it is to shoot oneself in the foot.
  *   **Expected Outcome:** Deals are reached quickly. Someone might threaten to veto, but no one actually does it because the cost is too high. The threat is not credible because it is fully controlled.
  *   **Stop:** Collect Veto Cards. Do not debrief yet.

  ### Phase 2: The Tripwire (25 Minutes)
  *   **Setup:** Same pairs. New score sheet.
  *   **Rule:** Negotiate a split of 100 SP.
  *   **The Mechanic:** Before negotiating, each player secretly writes a number (1–6) on an index card. This is their **Risk Dial**.
      *   Place cards face down.
      *   If no deal is reached in 3 minutes, reveal cards. Take the **Higher** of the two numbers.
      *   Roll 1d6. If Roll $\le$ Higher Number, Catastrophe (-100 SP). If Roll $>$ Higher Number, Status Quo (0 SP).
  *   **The Trap:** You want to set a high number to scare your opponent (making the cost of "No Deal" high), but if they also set a high number, you both face near-certain ruin. Crucially, *you do not know their number*.
  *   **Expected Outcome:** High variance. Some pairs deal quickly out of fear. Others bluff high, fail to deal, and roll. Some will suffer Catastrophe. The key feeling is: *"I didn't choose the disaster, the die did, but I set the odds."*
  *   **Stop:** Collect cards. Do not reveal scores yet.

  ### Phase 3: The Reputation (25 Minutes)
  *   **Setup:** **Rotate partners.** (Move desks). New pairs.
  *   **Rule:** Negotiate a split of 100 SP.
  *   **The Mechanic:** You must keep the **Risk Dial** number you chose in Phase 2. Write it on your name tag. It is **Public**. You cannot change it.
      *   If no deal (3 mins), roll 1d6 against the **Higher** of the two visible numbers.
  *   **The Trap:** If you chose a "6" in Phase 2, you are now "known" as a hair-trigger player. Your opponent *knows* that failing to deal with you guarantees Catastrophe.
  *   **Expected Outcome:** Students with high Risk Dials (5 or 6) should extract favorable deals (e.g., 70/30) without rolling. Students with low dials (1 or 2) will be bullied into conceding more, because their threat of disaster is weak.
  *   **Stop:** Final scores.

  ### Phase 4: The Debrief (10 Minutes)
  *   *See mapping guide below.*

  ---

  ## Debrief Guide: Mapping Mechanics to Theory

  Do not lecture. Ask questions that force them to articulate the logic they just lived.

  **1. Mapping the Veto (Round 1) $\rightarrow$ The Credibility Problem**
  *   *Ask:* "In Round 1, who threatened to use the Veto? Who actually used it?"
  *   *Point:* A threat you fully control is cheap talk. If carrying out the threat hurts you more than conceding, a rational actor will never do it. Therefore, the opponent knows you won't do it. The threat is worthless.
  *   *Concept:* **Rational Deterrence Failure.**

  **2. Mapping the Tripwire (Round 2) $\rightarrow$ The Threat That Leaves Something to Chance**
  *   *Ask:* "In Round 2, did anyone feel more pressure than Round 1? Why?"
  *   *Ask:* "If you rolled a Catastrophe, did you *choose* to lose 100 points?" (No, the die did).
  *   *Point:* By handing the outcome to a randomizer, you made the threat *credible*. You convinced the opponent that 'No Deal' might lead to disaster *even if you didn't want it to*.
  *   *Concept:* **Schelling's Brinkmanship.**

  **3. Mapping the Reputation (Round 3) $\rightarrow$ The Rationality of Irrationality**
  *   *Ask:* "If you had a Risk Dial of 6, was it easier to get a good deal in Round 3?"
  *   *Ask:* "If you had a Risk Dial of 1, were you at a disadvantage?"
  *   *Point:* Having 'burned your bridges' (being locked into a high risk setting) made you stronger. Being known as 'unreasonable' or 'volatile' is a strategic asset in bargaining.
  *   *Concept:* **Reputational Commitment.**

  ---

  ## Three Honest Notes

  ### 1. Predictable Failure: The "Collusive Peace" or "Suicide Pact"
  **What goes wrong:** In Round 2, students may realize that if they both set their Risk Dial to "1", the chance of Catastrophe is minimal (1/6). They might collude to set low dials, negotiate hard, and treat the disaster mechanic as negligible. Conversely, they might treat the game as a joke, all set "6", and laugh when everyone blows up.
  **How to handle it:**
  *   **Pre-empt Collusion:** In the instructions, explicitly state: *"You cannot communicate your Risk Dial number to your partner until the reveal. Writing it down is private."*
  *   **Pre-empt Gamification:** When handing out the dice, set the tone. *"In this room, a Catastrophe is -100 points. In reality, this is millions of lives. When you roll, do it in silence. If you cheer a disaster, you forfeit your participation credit."* You must police the emotional register in the moment.

  ### 2. Structural Limitation: Quantifiable vs. Unknowable Risk
  **What the game cannot reproduce:** In the simulation, the risk is precise (16%, 33%, 100%). Students can compute expected utility. In real nuclear brinkmanship, the probability of escalation is fundamentally **unknowable**. Leaders do not know if a naval blockade will lead to a submarine captain launching a torpedo.
  **Why it matters:** The game suggests leaders can *calibrate* danger ("I'll set my dial to 4"). Real strategic thought warns that once you step onto the slippery slope, you lose the ability to calibrate.
  **Mitigation:** In the debrief, explicitly point this out. *"The game gave you a die. In 1962, Kennedy didn't have a die. He had a guess. That uncertainty is far more terrifying than what you felt today."*

  ### 3. Emotional Distortion: The Thrill of the Edge
  **The Distortion:** You suspected students would find the brinkmanship round exciting. They will. The adrenaline of the timer and the dice roll creates a "gamified" thrill. Real nuclear crisis decision-making is characterized by exhaustion, nausea, paralysis, and dread, not excitement.
  **How to address it in the room:**
  *   **Don't wait for the debrief.** Interrupt the excitement immediately after the Round 2 rolls.
  *   **The "Cold Shower" Intervention:** If a pair rolls a Catastrophe and groans or laughs, stop the room. Say: *"Pause. Look at that -100 on your sheet. Imagine that number is not points, but a city that no longer exists. And imagine you didn't choose it; you just set the conditions for it. Sit with that feeling for ten seconds before you write your score."*
  *   **Why:** You need to break the "game frame" to let the "strategic frame" sink in. If they leave the room thinking it was a fun dice game, the lesson on the horror of deterrence is lost. The discomfort *is* the lesson.
