answer: |-
  1. Distribute packets containing three scenario cards that depict water routing options with identical survival statistics but distinct mechanical diagrams showing whether Village A's drainage physically powers the main pump or merely suffers from upstream diversion. Provide each student with colored voting cards and a worksheet reserved for the mission order task.
  2. Conduct three decision rounds where the first presents identical outcomes with different causal mechanisms and the second requires drafting a one-sentence mission order describing the water use and the village's fate. Conclude with a third round that decisively favors the "means" plan in saved lives to test adherence to the distinction under pressure.
  3. Students hold up colored cards for immediate binary choices while the mission order sentences are collected anonymously and projected on the screen for group analysis. Tally the yes/no votes on the board after each round to create a visible record of class consensus shifting across the scenarios.
  4. Guide students to compare their voting patterns and mission statements to reveal that they rejected harming the village as a mechanism even when outcomes were equal, then introduce the terms "intended means" versus "foreseen side effect." Finally, name the principle they intuitively applied as the Doctrine of Double Effect and discuss whether the cost in the final round was justified.
  5. If approval rates correlate with the visual features of the diagram rather than the causal role of the harm, you are tracking framing effects rather than the intending/foreseeing distinction. To rule this out, swap the diagrams between the two causal structures for half the class to ensure the visual presentation does not drive the moral judgment.
