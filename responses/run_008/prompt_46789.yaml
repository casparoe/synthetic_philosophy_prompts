prompt: |-
  I'm a high school student writing an extended essay on epistemic injustice, and most of the available examples feel interchangeable: a doctor discounts a woman's self-report of pain; an official dismisses a teenager's account. I'd like a case that is harder to classify. Please construct a scenario of testimonial injustice in which the hearer is not prejudiced: the credibility deficit must not stem from any negative stereotype about the speaker or her social group, and the hearer's judgment should look reasonable to any bystander watching only that exchange. Yet the speaker must still be wronged specifically as a knower — not merely interrupted, disbelieved on ordinary evidential grounds, or treated unfairly in some way unrelated to her testimony. The case should be realistic (a school, a clinic, or a workplace; no futuristic technology), and the deficit should be produced structurally, by how the hearer's role or institution is arranged, rather than by any flaw in the hearer's character. After presenting the scenario in a single paragraph, please explain why it counts as testimonial injustice rather than simple error or an unfair distribution of attention; identify which structural feature is doing the work, and say what happens to the case if that feature is removed; and then show how a philosopher who insists that testimonial injustice requires prejudice would resist the case, for example by reclassifying it as hermeneutical injustice or as no injustice at all. Finally, please be honest about whether my specifications can be jointly satisfied, and if not, which one should give and why.
