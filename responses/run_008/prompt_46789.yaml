      *   If I remove prejudice, am I still describing *Testimonial Injustice*, or am I describing *Epistemic Exclusion* (Dotson) or *Structural Hermeneutical Injustice*?
      *   The prompt asks me to be honest about whether the specs can be satisfied. This is the crucial pivot. Strictly speaking, under Fricker's definition, they *cannot* be satisfied. Under broader definitions (e.g., non-culpable TI, structural TI), they might be.
