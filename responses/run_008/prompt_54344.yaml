  Your set of views is inconsistent because position (4) asserts a backward-looking reason that directly violates the forward-looking constraint of (1).

  The tension between (1) and (4) is fatal: (1) defines rationality by excluding past resources as reasons, while (4) explicitly claims history binds even when future consequences are null. This is not a nuance; it is a contradiction between consequentialist and deontological norms. The tension between (3) and (5) is moderate: it looks like a conflict but is actually a category error between epistemic evidence and normative justification. The tension between (1) and (2) is negligible: (2) is simply (1) applied to a longer time horizon including reputation assets.

  The single revision that cleans up the most is to reframe (4) as a forward-looking commitment to integrity rather than a backward-looking obligation. You must argue that keeping the promise is rational not because the past binds you, but because violating it would damage your identity as a promise-keeper—a future-looking psychological cost. This preserves (1) as the governing principle of practical rationality while accommodating the intuition behind (4) without admitting backward-looking reasons.

  Regarding your specific worries: (2) and (3) are loyal extensions of (1), not betrayals. (2) is consistent because the "negative forward-looking case" refers only to the project's immediate yield, not the agent's total future utility which includes reputational capital; you are still maximizing future value, just over a wider scope. (3) is consistent because it treats past investment as *evidence* of future viability (an epistemic claim), not as a *reason* to continue despite negative viability (a normative claim). Consequently, (5) survives (3) intact. Your brother is wrong because he treats sunk costs as normative justification ("I must recoup this") rather than epistemic evidence ("This suggests success"). In a failing restaurant, the current negative data swamps the probabilistic evidence of past investment, so citing the ten years as a *justification* remains the textbook fallacy even if those years offer some degraded evidence of prior confidence.
