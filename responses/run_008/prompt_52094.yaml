answer: |-
  ### Specification for a Theory of Societal Collapse

  To justify retaining the term "collapse" in a survey course without misleading students, a theory must meet the following five desiderata. These are derived from the friction between your three case studies (LBA, Maya, Rapa Nui).

  1.  **Substrate Specificity:** The theory must identify *what* breaks (e.g., central administration, long-distance trade, monumental construction) distinct from *who* survives (the demographic bulk, local kinship structures, vernacular culture).
  2.  **Causal Pluralism:** The theory must allow for conjunctural causation (e.g., climate stress + political fragmentation + external shock) rather than a single necessary-and-sufficient condition.
  3.  **The Persistence Clause:** The theory must explicitly accommodate demographic and cultural continuity post-event. It cannot equate political failure with population extinction.
  4.  **The Normative Threshold:** The theory must define a minimum threshold of loss (e.g., rapid reduction in social complexity, loss of elite capacity to provision) to distinguish "collapse" from routine "cyclic change" or "reorganization."
  5.  **Agency Sensitivity:** The theory must account for human decision-making and external contact (as per Rapa Nui revisionism) rather than treating societies as passive victims of environmental or systemic determinism.

  ### Classification of Desiderata

  **Non-Negotiable Requirements**
  *   **Substrate Specificity:** Without this, "collapse" becomes a metaphor for "change," rendering the term analytically useless.
  *   **The Persistence Clause:** Given the Maya and LBA evidence, any theory implying the people vanished is empirically false.

  **Prejudices of Particular Camps**
  *   **Causal Pluralism:** While historically robust, strict system-theorists (like Tainter) view this as a lack of theoretical rigor; they prefer a unified field theory of failure.
  *   **Agency Sensitivity:** Environmental determinists (like Diamond) often view this as downplaying the hard constraints of ecology; resilience scholars sometimes view it as over-privileging elite narratives.

  **The Incompatible Pair**
  *   **Requirement:** *Universal Causal Mechanism* vs. *Contextual Historical Accuracy.*
  *   **Conflict:** You cannot jointly satisfy the desire for a single, elegant engine of collapse (e.g., "diminishing returns" or "ecocide") and the requirement to accurately model the LBA (network failure), Maya (political/ecological conjuncture), and Rapa Nui (contact shock). A theory strong enough to explain all three universally will be too vague to be historically accurate for any single one. You must sacrifice parsimony for precision.

  **The Single Most Exclusionary Requirement**
  *   **Substrate Specificity.**
  *   **Reasoning:** This requirement excludes the largest number of contenders. It eliminates "Civilizational Death" narratives (which conflate polity and people), "Great Man" theories (which conflate leadership and system), and radical "Reorganization" arguments (which conflate loss of complexity with continuity of life). If a theory cannot specify *which layer* of society failed, it is disqualified.

  ### Scorecard of Existing Frameworks

  **1. Tainter-Style Complexity Accounts**
  *   **Verdict:** **Partial Pass.**
  *   **Strengths:** Excellent on *Substrate Specificity* (identifies loss of complexity/solving capacity) and *Normative Threshold* (defines failure as inability to maintain investment).
  *   **Weaknesses:** Fails *Causal Pluralism* (reduces diverse histories to one economic curve) and often struggles with *Agency Sensitivity* (treats complexity as an autonomous trap rather than a political choice).
  *   **Pedagogical Utility:** Good for explaining *why* elites couldn't respond, bad for explaining *why* the commoners survived.

  **2. Diamond-Style Environmental Narratives**
  *   **Verdict:** **Fail.**
  *   **Strengths:** Intuitive for students; highlights *Causal Pluralism* (in theory).
  *   **Weaknesses:** Fails *Substrate Specificity* (often conflates environmental damage with societal death) and *Agency Sensitivity* (ignores Rapa Nui revisionism and Maya adaptation). Violates *The Persistence Clause* by implying societies "chose suicide."
  *   **Pedagogical Utility:** High engagement, but requires heavy caveats to avoid eco-determinism.

  **3. Resilience/Continuity School**
  *   **Verdict:** **Partial Pass.**
  *   **Strengths:** Perfect on *The Persistence Clause* and *Agency Sensitivity* (centers the survivors).
  *   **Weaknesses:** Risks failing *The Normative Threshold*. If every collapse is just "transformation," the term loses its ability to signal trauma, violence, or significant loss of capacity (e.g., the burning of LBA palaces).
  *   **Pedagogical Utility:** Essential for correcting myths, but risks obscuring the reality of systemic failure if pushed too far.

  ### Recommendation
  Retain "collapse," but define it strictly as **Political-Systemic Failure** rather than Societal Death. Use the *Substrate Specificity* requirement to teach students that a palace can burn (collapse) while the farmer in the hinterland continues (continuity). This allows you to use the dramatic hook of "collapse" without validating the myth of the "vanished civilization."
