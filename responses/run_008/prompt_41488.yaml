answer: |-
  Here is a breakdown of the distinct claims hiding inside "truth is what works", structured for your notes. I have categorised them by philosophical pedigree, assigned a verdict, and tested them against your physicist's string theory dodge.

  ### 1. The Instrumentalist Claim
  *   **The Claim:** Scientific theories are not descriptions of reality but tools for organising experience and predicting observations. Asking if a theory is "true" (in the sense of matching ontology) is a category error; the only valid question is whether it yields accurate predictions.
  *   **Verdict:** **Substantive-but-defensible.** This is a coherent philosophy of science (associated with Bas van Fraassen), though controversial. It denies that science aims at truth, aiming instead at empirical adequacy.
  *   **Does it let the physicist off the hook?** **Yes.** This is likely what your physicist actually meant. If string theory yields consistent maths and potential predictive pathways, it "works" as a tool, regardless of whether strings "exist".
  *   **Pedigree:** Often conflated with pragmatism, but strictly speaking, this is **Instrumentalism**. Peirce would reject this (he believed inquiry aims at reality); James might accept it if the "work" involves lived experience.

  ### 2. The Peircean Regulative Ideal
  *   **The Claim:** Truth is the opinion which is fated to be ultimately agreed to by all who investigate. "What works" means "what survives the rigours of long-term inquiry and self-correction by a community". It is not about immediate utility, but about convergence on an external reality.
  *   **Verdict:** **Substantive-but-defensible.** It treats truth as a horizon we move towards rather than a possession we hold. It preserves objectivity while acknowledging human methods.
  *   **Does it let the physicist off the hook?** **No.** In fact, it demands the opposite. If string theory cannot be tested or agreed upon by the community of inquirers in the long run, it is not true by this definition. It forces the physicist to admit the theory is currently incomplete, not just "differently true".
  *   **Pedigree:** **C.S. Peirce.** This is his specific contribution. He was hostile to the idea that individual convenience defines truth.

  ### 3. The Jamesian "Cash-Value"
  *   **The Claim:** Truth is not a static property but a process. An idea becomes true if it can be verified, integrated into our existing web of beliefs, and guides us successfully through experience. Truth "happens" to an idea when it proves useful in navigating reality.
  *   **Verdict:** **Substantive-but-defensible.** Often misunderstood as "whatever makes me happy", James actually required rigorous verification and consistency with existing facts. However, it is softer on ontology than Peirce.
  *   **Does it let the physicist off the hook?** **No.** String theory currently lacks "cash value" in terms of empirical verification. James would likely say the theory is currently neither true nor false, but in limbo, waiting for experience to validate it.
  *   **Pedigree:** **William James.** This is the "radical empiricism" angle. It focuses on the individual's verification process more than Peirce's communal end-state.

  ### 4. The Subjectivist Caricature (The "Post-Truth" Reading)
  *   **The Claim:** Truth is relative to the individual or group. If a belief produces a desirable outcome (profit, comfort, social cohesion) for a specific agent, it is "true for them". There is no external constraint on what counts as "working".
  *   **Verdict:** **False.** This collapses the distinction between *utility* and *truth*. It makes disagreement impossible (if it works for you, it's true for you) and ignores the recalcitrance of reality (you may believe you can fly, but gravity does not cooperate).
  *   **Does it let the physicist off the hook?** **No.** This is what your startup guy meant, but it doesn't work for physics. A model that makes money but predicts particle collisions incorrectly is not a "true" physics model, even if it is a "successful" business model.
  *   **Pedigree:** **The Caricature.** This is the version the sniffy philosopher was attacking. Neither Peirce nor James endorsed this; James explicitly warned against confusing truth with expediency.

  ### 5. The Correlative Truism
  *   **The Claim:** True theories tend to be useful. If a theory corresponds to reality, it will generally allow us to manipulate reality successfully.
  *   **Verdict:** **Trivial.** Almost everyone agrees with this, including realists and absolutists. It reverses the slogan: instead of "truth is defined by work", it says "work is evidence of truth".
  *   **Does it let the physicist off the hook?** **No.** It implies that if string theory works, it is *likely* true, bringing the ontological question back into focus. It doesn't allow the physicist to dismiss the question of reality.
  *   **Pedigree:** **Common Sense.** Compatible with most philosophical positions, including realism.

  ***

  ### Bonus: The Peirce vs. James Distinction
  For your piece, the crucial friction point is **constraint**.
  *   **Peirce** insists that reality pushes back. You cannot believe your way to truth; the external world forces consensus upon us eventually. His "what works" is what survives the friction of reality over centuries.
  *   **James** focuses on the human element. Truth must satisfy human demands and fit into our lived experience. His "what works" is what allows us to navigate life without contradiction.
  *   **The Physicist** is likely neither. They are usually **Instrumentalists**. They don't care about truth *or* lived experience; they care about predictive output. They are using pragmatist language to shield instrumentalist practice.

  ### Bonus: The "Works for Them" Equivocation (Placebos/Homeopathy)
  Your editor's favourite move ("It works for them, so it's true for them") relies on a sleight of hand between **Reading 1 (Instrumentalism)** and **Reading 4 (Subjectivism)**.

  *   **The Equivocation:** It conflates *psychological utility* (the patient feels better) with *mechanical utility* (the pill interacts with the biology).
  *   **Why it fails:** If a homeopathic remedy "works" via the placebo effect, the *belief* is instrumentally useful (Reading 1/5), but the *claim* about the water's memory is false (Reading 4).
  *   **The Fix:** You can acknowledge the belief is *useful* (therapeutically) without conceding it is *true* (ontologically). The slogan "truth is what works" crashes here because the mechanism does not work, even if the patient does. Peirce would say the inquiry into the mechanism will eventually expose the falsity, regardless of the patient's temporary relief.

  **Summary for your draft:** The slogan is a chameleon. In the mouth of a physicist, it is Instrumentalism (avoiding ontology). In the mouth of a startup founder, it is Subjectivism (avoiding reality). In the mouth of a philosopher, it is either a Regulative Ideal (Peirce) or a Verification Process (James). Your piece should argue that bleeding these distinct meanings together is what fuels the "post-truth" confusion.
