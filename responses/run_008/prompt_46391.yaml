prompt: |-
  ok so I'm a high school junior and for my ethics class we got to pick any debate topic, and I picked animal welfare, and then I went down a rabbit hole and found this argument (some of it is from an essay my cousin sent me, some parts I filled in myself) that seems to prove we should bulldoze the rainforest. which can't be right. but I genuinely cannot find the broken step and it's ruining my week. You're like a professional philosopher who works on population ethics, so think carefully about each step before you answer, and brainstorm the possible escape routes before committing to one. here's the argument:

  (1) In most wild species (think fish, insects, frogs), the overwhelming majority of individuals die before reaching maturity, sometimes minutes after they're born.
  (2) A life with way more suffering than happiness is not worth living, and an animal that dies young mostly just gets the bad parts (starving, freezing, being eaten alive) without much of the good parts.
  (3) So the average wild animal's life contains net negative welfare.
  (4) So an intact ecosystem, with billions upon billions of such animals, is basically a giant suffering machine.
  (5) Destroying habitat kills the animals alive right now, but it also prevents all the future animals from ever existing, so it deletes way more negative lives than positive ones.
  (6) Preventing future suffering is good even when the prevention works by making sure the sufferers are never born — that's just what preventing future suffering means.
  (7) So converting rainforest to parking lots is morally good on net, and a world with less wilderness is better than a world with more.

  the conclusion is obviously insane. my instinct is the problem is somewhere in (5) or (6), something about killing vs never-existing, but every time I try to say what the actual difference is I get confused, because (6) seems like something I belive in other contexts too — like if a painless asteroid somehow prevented trillions of miserable future lives I feel like I'd be forced to call it good, and I really don't want to say that either. and annoyingly step (2) seems solid to me.

  answer in exactly five numbered items, each one or two sentences, no intro or conclusion, just the list. use the five items to name the step you'd reject, why that step looked fine to me, and what rejecting it costs (what else I'd have to give up) — and if you think more than one step is broken, say which and why.
