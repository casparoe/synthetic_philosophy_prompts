answer: |-
  ### Overall Credence: 4%

  My credence that a ten-year futarchy pilot would demonstrably outperform a matched control on its welfare metric is approximately **4%**.

  This low number is not a dismissal of the theory's elegance, but a calibration against the history of institutional innovation. Governance systems are complex adaptive systems; introducing a radical mechanism like decision markets introduces second-order effects that typically dominate first-order efficiencies within a decade. For the proposition to hold, four distinct, difficult conditions must be met simultaneously.

  ### Decomposition of Drivers

  Here are the four sub-questions that drive this probability, treated as largely conjunctive conditions (all must hold for the pilot to succeed as intended).

  #### 1. Market Efficiency & Liquidity (Probability: 0.40)
  *The Question:* Can decision markets on multi-year, partly counterfactual policy outcomes attract enough liquidity and informed trading to be efficient rather than noisy?
  *The Rationale:* Prediction markets excel at binary, near-term events (e.g., "Who wins the election?"). Futarchy requires markets on causal counterfactuals (e.g., "If Policy X passes, what is GDP in 3 years?"). These are inherently illiquid because the "if" condition is uncertain until the vote occurs, and the outcome is distant. Without deep liquidity, prices reflect noise or manipulation rather than aggregated information. While subsidization (market making) can help, it risks decoupling prices from truth.
  *Confidence:* **Low.** We have no historical evidence that causal policy markets can sustain liquidity without massive, distortionary subsidies.

  #### 2. Metric Robustness (Probability: 0.30)
  *The Question:* Is any scalar welfare measure an assembly can write robust to Goodharting by the very traders who profit from anticipating its distortions?
  *The Rationale:* This is the "Campbell's Law" problem. Once a metric becomes a target for financial profit, it ceases to be a good measure. Traders have a direct incentive to find loopholes that raise the metric without improving welfare (e.g., suppressing crime reporting to lower crime stats). Designing a composite metric immune to gaming by sophisticated, financially motivated actors is a problem we have never solved at scale.
  *Confidence:* **Very Low.** History suggests all performance metrics are eventually gamed, especially when financial rewards are attached.

  #### 3. Values/Beliefs Stability (Probability: 0.50)
  *The Question:* Is the vote-on-values, bet-on-beliefs division of labor stable, or do markets end up quietly re-litigating values?
  *The Rationale:* Futarchy assumes values (the metric) are fixed by voters and beliefs (policy impact) are discovered by markets. In reality, policies often embody value trade-offs (e.g., liberty vs. security). If a policy boosts the metric but violates a hidden social norm, the Assembly may veto it, punishing market participants. If markets anticipate these vetoes, they price in political risk rather than policy efficacy, collapsing the separation between values and beliefs.
  *Confidence:* **Moderate.** It is theoretically possible to maintain this boundary, but political pressure to intervene in "unjust" market outcomes will be immense.

  #### 4. Manipulation Resistance (Probability: 0.60)
  *The Question:* Is manipulation by deep-pocketed actors fatal to the scheme or merely a tax on its performance?
  *The Rationale:* In liquid markets, manipulation is expensive (you lose money on the trade to move the price). In illiquid policy markets, it is cheap. If a billionaire can profit by shorting a "Public Safety" market and then bribing actors to commit crimes, the system fails. However, if liquidity is sufficient (see Term 1), counter-speculators can profit from correcting the manipulation.
  *Confidence:* **Moderate-High.** Provided Term 1 is solved, manipulation is usually a tax. But since Term 1 is weak, this risk is elevated. I assign a higher probability here assuming regulatory guardrails are implemented.

  ### Combination Logic

  I treat these as **conjunctive probabilities** ($P(A \cap B \cap C \cap D)$). For futarchy to outperform *meaningfully* (not just by gaming the metric), the markets must be liquid, the metric must be robust, the values must remain stable, and manipulation must be contained. If any single pillar collapses, the system reverts to noise or corruption, failing to outperform a conventional baseline in a sustainable way.

  $$0.40 \times 0.30 \times 0.50 \times 0.60 = 0.036$$

  Rounding to **4%** accounts for the possibility that a broken futarchy might still outperform a gridlocked conventional democracy by sheer force of decisiveness, even if the mechanism is flawed.

  ### Least Confident Term: Metric Robustness (Goodharting)

  I am least confident in **Term 2 (Metric Robustness)**.

  While liquidity (Term 1) is an engineering problem that money can partially solve, and manipulation (Term 4) is a security problem that regulation can mitigate, **Goodharting is a fundamental epistemic problem.** It is exceptionally difficult to specify a scalar function that captures "human welfare" without leaving exploitable gradients. In a futarchy, the traders are the most motivated agents in the system to find those gradients. If the metric is gamed, the jurisdiction "wins" the proposition technically (the metric goes up) but fails practically (welfare does not improve). If we require the metric to track *actual* welfare, the probability drops even further.

  ### Proposed Small-Scale Test: The Corporate Division Pilot

  To test **Metric Robustness** within a decade, a **large corporation** is a better testbed than a city or university.

  *   **Why:** A corporation has clear boundaries, budgetary sovereignty, and a natural "welfare" proxy (profit/productivity) that can be modified. It can survive failure better than a city.
  *   **The Setup:** Select a semi-autonomous division (e.g., a regional sales branch or a specific R&D unit) with 500–1,000 employees.
  *   **The Mechanism:**
      1.  **Metric:** Create a composite "Division Health" metric (e.g., 40% Profit, 30% Employee Retention, 30% Customer Satisfaction).
      2.  **Market:** Allow internal and accredited external traders to bet on policy decisions (e.g., "If we switch to 4-day work weeks, will Health Metric rise?").
      3.  **Execution:** Policies with positive expected value on the metric are automatically adopted.
  *   **What It Teaches:**
      *   **Speed of Gaming:** How long does it take for traders/managers to find a way to boost the metric without boosting actual health? (e.g., firing unhappy customers to boost satisfaction scores).
      *   **Metric Evolution:** How often does the "Assembly" (HQ) have to rewrite the metric to close loopholes? If the metric needs rewriting every quarter, the system is unstable.
      *   **Liquidity:** Can you get enough trading volume on internal policy to make the prices informative?

  If this pilot fails because traders game the "Employee Retention" component by incentivizing managers to fire low-performers before they quit, you have learned the most critical lesson about futarchy: **specifying the goal is harder than optimizing for it.** This test could be run in 5 years, providing data well within the 10-year window requested.
