answer: |-
  **Scenario 1: The Covenant Override**
  The Oakhaven Condominium Association holds a special meeting to fund a necessary seawall repair after storm damage. The vote is 95% in favor, conducted under transparent bylaws with a quorum present. Every unit owner, including Mr. Henderson, will demonstrably benefit: insurance premiums will drop, and property values are appraised to rise by more than the assessment cost. Exit is affordable; the market is hot, and Henderson could sell his unit without loss. The assessment is a flat fee applied equally to all units. However, Henderson's deed contains a recorded, pre-existing covenant explicitly exempting his specific lot from all special assessments related to shoreline infrastructure, a term he paid a premium to secure. The Association votes to override this covenant, arguing the collective need supersedes the private contract, and places a lien on Henderson's property when he refuses to pay. The taking is democratic, beneficial, voluntary (via exit), and procedurally equal, yet it remains impermissible because it confiscates property rights that were previously alienated from the collective's authority.

  **Check 1**
  *   **Features Present:** Democratic authorization, demonstrable benefit, affordable exit, transparent/equal procedure, genuine public good.
  *   **Verdict Justification:** The wrongness is not stipulated but derives from the independent moral weight of prior property titles and contracts. If a right is genuinely owned, a majority vote cannot transfer it without consent, regardless of the benefit.
  *   **Strongest Attack:** A defender of the standard view would argue that by purchasing into the HOA, Henderson accepted the *current* bylaws, which include the mechanism for amendment. The "exit option" is the true consent; staying implies acceptance of the new vote. To allow a single covenant to veto essential infrastructure is to grant a minority veto over public survival, rendering the association ungovernable.

  **Scenario 2: The Meter Bypass**
  Mrs. Gable discovers her landlord, Mr. Ross, has been secretly siphoning electricity from her meter to power his adjacent rental unit for the past year. She does not confront him or call the authorities, fearing retaliation and eviction in a tight housing market. Instead, she quietly bypasses her own meter to draw an equivalent value of power from the building's main line, effectively shifting the cost back to Ross's account. There is no vote, no consent from Ross, and Ross derives no benefit (he pays more). Ross has no exit option (the wiring is embedded in his walls), and the act is illegal (tampering with utilities). Nonetheless, the taking is permissible as a act of self-help restitution. Gable is not stealing; she is reclaiming what was already hers, restoring the status quo ante without waiting for institutional intervention that might fail her.

  **Check 2**
  *   **Features Present:** None. (No vote, no consent, no net benefit to payer, no exit, illegal).
  *   **Verdict Justification:** The permissibility is generated by the principle of rectification. A taking is not theft if it is the recovery of misappropriated property. The moral title to the resources never legitimately belonged to Ross.
  *   **Strongest Attack:** A defender of the standard view would argue that private restitution undermines the rule of law and invites escalation. By acting as judge and executioner, Gable risks error (what if she miscalculated the amount?) and normalizes vigilante property seizures, which creates greater insecurity for everyone than the initial theft.

  **Synthesis and Honesty Check**

  This pair shows that the moral status of a taking depends primarily on **antecedent title**, not on procedural consent or aggregate benefit. In Scenario 1, the taking is wrong because the collective lacks title to the exempted funds, despite perfect procedure. In Scenario 2, the taking is permissible because the taker holds title to the resources, despite zero procedure.

  This vindicates the *underlying thought* of the "Taxation is Theft" slogan—that property rights exist prior to political authority—while burying the *literal slogan*, which implies all non-consensual takings are theft. The slogan is useful only insofar as it highlights that democratic procedure cannot create title out of nothing. Ordinary taxation falls between these cases: it lacks the explicit prior contract violation of Scenario 1, but also lacks the clear rectification of Scenario 2. It relies on a hypothetical "social debt" rather than a specific prior wrong.

  **Honesty Check on Scenario 2:**
  I must flag a smuggle. Scenario 2 relies entirely on **Rectification of a Prior Wrong**. This smuggles in a form of **Debt/Consent** by the back door: Ross "owes" the money because he stole it first. If Ross had not stolen the electricity initially, Gable's taking would be flatly impermissible theft. The feature that kept reappearing is **Just Claim**. In Scenario 2, the taker has a just claim (restitution); in standard taxation, the state claims a just claim (social debt); in Scenario 1, the taker lacks a just claim (contractual exemption). The moral work is done not by the *act* of taking, but by the *history* of the property. If the second scenario were built without a prior wrong (e.g., Gable takes from Ross simply because she is poorer), it would collapse into impermissible theft. Thus, the "Taxation is Theft" debate is not about the taking itself, but about whether the state has a prior claim on the citizen's resources equivalent to Ross's debt to Gable.
