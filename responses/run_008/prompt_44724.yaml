      Neighbor and Bayesian enthusiast Greg Miller insisted the problem was solvable. "She's just failing to apply Jaynes's transformation groups," said Miller, adjusting his glasses. "Invariance arguments settle this. You just maximize entropy based on the symmetries of the problem statement. It's completely settled science. Jaynes showed that if you respect the transformation groups, the ambiguity vanishes. She's just refusing to commit to the invariant measure."

