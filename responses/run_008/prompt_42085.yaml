  I'm a graduate student in psychology who took one philosophy of mind course years ago and now reads popular science books on consciousness for fun. The one I just finished summarizes higher-order theories roughly like this: 'Higher-order theories hold that a mental state is conscious only when you are aware of it, and since awareness is itself a mental state, consciousness always involves a second state directed at the first. You are never simply in pain; you are in pain and also having a thought about your pain. Because forming such a thought requires concepts, and concepts require language, it follows that infants and animals are never conscious at all. And on this view, consciousness just is introspection: when you catch yourself having an experience, the higher-order thought is the very thing you catch in the act. Critics have pointed out that the theory cannot handle cases where the higher-order thought misrepresents the first-order state -- making a mild itch feel like burning pain, or conjuring an experience out of nothing -- and this objection is now generally regarded as having refuted the theory.'

