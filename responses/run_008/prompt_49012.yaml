prompt: |-
  I teach a graduate seminar on rational choice theory, and this week's meeting ended in a standoff between two of my doctoral students over counterfactual mugging. I shall set out the exchange as it occurred and would be grateful for a careful adjudication.

  For context, the scenario we were discussing: a predictor with a flawless record approaches you before a fair coin is flipped and announces that it has predicted how you will respond if approached afterwards. The coin lands tails. The predictor then says: the coin came up tails, there is no money on the table, but I predicted you would hand over £100 in this exact situation; if the coin had landed heads, I would have shown you this promise and given you £10,000. Now pay up. So the question is whether to pay £100 in the world where you receive nothing and are merely told about a hypothetical windfall in the other branch. The same seminar had earlier discussed the related XOR blackmail case: a blackmailer who can foresee whether your house will be burgled and can also detect whether the processor in your laptop is flaky, and who sends you a letter demanding £1,000 exactly when one but not both of those things is true — so the letter's arrival is strong evidence that either your house will be burgled or your processor is failing, and the payment does nothing to avert the burglary.

  The exchange went as follows. First, Ada said she refuses to pay in the mugging: the coin has landed tails, the £10,000 exists nowhere in her world, and handing over £100 is a certain loss. Decision theory, she insisted, is about what to do given the information you actually have when you act; the preferences of a hypothetical counterpart in an unrealised branch cannot bind you, any more than the dead can be paid wages on behalf of the living. Second, Ben replied that she is reasoning "updately" rather than "updatelessly": before the coin flip, any sensible person would have paid £100 for a half chance at £10,000, and the whole point of acting on the policy you would have endorsed ex ante is that predictors can condition on your disposition rather than your later whim. He added that Ada already one-boxes in Newcomb's problem, so she accepts that the qualities of agents like her can be worth money; refusing the mugging is just two-boxing with the second box placed in another branch. Third, Ada drew the Newcomb line differently: there, she said, the correlated good sits in the very world she inhabits and she walks out of the room with it, whereas no version of her ever collects the £10,000; moreover, she argued that Ben's ex ante endorsement, taken seriously, would have him pay the blackmailer, since from behind a veil of ignorance the letter's arrival looks like terrible news worth £1,000 to act on. Fourth, Ben denied this: the right ex ante policy in the blackmail case is never to pay, because one's decision is not tied to the burglary in the way it is tied to the predictor's behaviour in the mugging — the blackmailer merely observes both facts, and no output of one's decision procedure changes either of them — so the contrast between the two cases is not a embarrassment but the very thing that shows the updateless framework is discriminating rather than indiscriminate. Fifth, Ada pressed on the underlying logic: in the tails world, the claim that had her decision procedure output "refuse", the predictor would not have offered the money is a counterfactual with a false antecedent about a mathematical function's output, and she professed not to understand the truth conditions of such counterlogical conditionals, whereas causal reasoning never needs them. Sixth, Ben answered that she needs them anyway, since even in Newcomb the claim that the opaque box would have been empty had she two-boxed is precisely a counterlogical about the predictor's model of her, so her official causal theory cannot underwrite her excellent instincts in that case.

  I confess I could not tell them which of them was right at which step, and the seminar ran over time. Please adjudicate the exchange move by move: say who is right at each of the six steps and why; assess whether Ada can coherently be a one-boxer who refuses to pay in the mugging, or whether she must abandon one or the other; explain what the XOR blackmail comparison actually establishes about the coherence of Ben's position; and identify what, if anything, both students are missing.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on rational choice theory.
      *   **Topic:** Counterfactual Mugging (and related XOR Blackmail/Newcomb problems).
      *   **Participants:** Ada (Causal Decision Theory/Updateful leaning) vs. Ben (Evidential/Functional/Updateless Decision Theory leaning).
      *   **Task:** Adjudicate the exchange move-by-move (6 steps), assess Ada's coherence (One-boxing vs. Mugging), evaluate the XOR Blackmail comparison regarding Ben's position, and identify what both are missing.

  2.  **Deconstruct the Cases:**
      *   **Counterfactual Mugging:** Predictor flips a coin. If Heads, gives \$10k *if* predicted you'd give \$100 on Tails. If Tails, asks for \$100 (nothing to gain in this branch). You are on Tails.
          *   *CDT (Causal):* Don't pay. Action has no causal impact on the past prediction or the coin flip. Loss of \$100.
          *   *EDT (Evidential):* Tricky. Usually aligns with CDT here unless updateless.
          *   *UDT/TDT (Updateless/Functional):* Pay. Ex-ante expected value is positive ($0.5 \times -100 + 0.5 \times 10000 > 0$). You want to be the *type* of agent who pays.
      *   **Newcomb's Problem:** Two boxes. A (transparent, \$1k), B (opaque, \$0 or \$1M). Predictor filled B based on prediction of your choice.
          *   *CDT:* Two-box. Causal dominance.
          *   *EDT/UDT:* One-box. Correlation/Logical dependence.
      *   **XOR Blackmail:** Blackmailer sends letter if (Burglary XOR Flaky Processor). Payment doesn't stop burglary.
          *   *CDT:* Don't pay. Payment doesn't cause burglary to stop.
          *   *EDT:* Don't pay (usually). Paying is evidence of the bad state, but doesn't change it.
          *   *UDT:* Don't pay. Ex-ante, you don't want to incentivize blackmailers who target you based on facts you can't change.

  3.  **Analyze the Exchange (Move by Move):**

      *   **Step 1 (Ada):** Refuses to pay. Coin is Tails. Money doesn't exist. Decision theory is about *now*. Hypotheticals don't bind.
          *   *Analysis:* This is standard CDT reasoning. It's internally consistent *if* you reject updatelessness.
          *   *Verdict:* Correct *within* CDT, but misses the point of the challenge posed by predictors.

      *   **Step 2 (Ben):** Accuses Ada of "updateful" reasoning. Ex-ante, paying is good. Predictors condition on disposition. Refusing is like two-boxing.
          *   *Analysis:* This is the core UDT/TDT argument. If you want to win, you must commit ex-ante. The analogy to Newcomb (two-boxing) is strong here.
          *   *Verdict:* Correct regarding the logic of Updateless Decision Theory (UDT).

      *   **Step 3 (Ada):** Distinguishes Newcomb. In Newcomb, money is *here*. In Mugging, money is in a counterfactual branch. Claims Ben's logic forces paying the Blackmailer.
          *   *Analysis:* The Newcomb distinction is the standard CDT defense (causal vs. evidential link). The Blackmail claim is the critical test. Does UDT pay in XOR Blackmail?
          *   *Verdict:* The Newcomb distinction is valid for CDT. The Blackmail claim is a challenge to Ben that needs verification.

      *   **Step 4 (Ben):** Denies paying Blackmailer. Mugging involves logical dependence (predictor simulates you). Blackmail involves common cause/observation (blackmailer sees facts, your choice doesn't change them).
          *   *Analysis:* This is crucial. UDT distinguishes between *logical* correlation (Mugging/Newcomb) and *spurious* correlation (Blackmail). In Blackmail, your decision doesn't logically determine the blackmailer's action in the same way; the blackmailer reacts to facts independent of your decision algorithm's output regarding the payment. Actually, in XOR blackmail, the letter is sent based on (Burglary XOR Flaky). Your payment doesn't change Burglary or Flakiness. So UDT says don't pay.
          *   *Verdict:* Ben is correct. UDT does not pay in XOR Blackmail.

      *   **Step 5 (Ada):** Attacks counterlogical conditionals. "If my algorithm outputted 'refuse'..." is a counterpossible (mathematical function). Causal reasoning doesn't need this.
          *   *Analysis:* This is a deep philosophical objection (logic of counterpossibles). CDT relies on causal counterfactuals (which are arguably easier). UDT relies on logical counterfactuals.
          *   *Verdict:* Ada identifies a genuine philosophical difficulty, but claiming CDT doesn't need counterfactuals is weak (Causal counterfactuals are still counterfactuals). However, the "counterlogical" charge is a known objection to FDT/UDT.

      *   **Step 6 (Ben):** Retorts that Newcomb also requires counterlogicals (Predictor's model). If Ada one-boxes, she accepts logical dependence.
          *   *Analysis:* Ben is right. If you one-box in Newcomb, you accept that your choice is correlated with the box content via prediction. If the predictor is perfect, your choice and the prediction are logically linked. Rejecting counterlogicals in Mugging while accepting them in Newcomb is inconsistent.
          *   *Verdict:* Ben wins this point on consistency.

  4.  **Synthesize the Adjudication:**

      *   **Ada's Coherence:** Can she One-Box and Refuse Mugging?
          *   Standard EDT often One-Boxes but Refuses Mugging (because Mugging is updateless, EDT is usually updateful).
          *   However, if she One-Boxes because of *causal* reasons (e.g., Newcomb is a common cause problem), she might be consistent. But Ben argues Newcomb implies logical dependence.
          *   *Conclusion:* It is very hard to consistently One-Box in Newcomb (against a perfect predictor) and Refuse Counterfactual Mugging without appealing to a specific temporal cutoff (Updatefulness). If she accepts the predictor's power in Newcomb, she should accept it in Mugging. She is likely inconsistent if she claims to be a "rationalist" aiming for reflective consistency.
      *   **XOR Blackmail & Ben:** Does Ben's position hold?
          *   Yes. UDT/FDT distinguishes between *subjunctive dependence* (Mugging/Newcomb) and *mere correlation* (Blackmail). In Blackmail, paying doesn't change the probability of the bad event in the relevant logical sense. Ben is right that his framework is discriminating.
      *   **What are they missing?**
          *   **Meta-Decision Theory:** They are arguing about *which* decision theory to use, not just applying one.
          *   **Logical Uncertainty:** The core of the Mugging problem is logical uncertainty (uncertainty about the output of one's own algorithm).
          *   **Reflective Consistency:** The ultimate criterion isn't "what feels right now" but "what policy would I wish I had pre-committed to."
          *   **The "Why" of Newcomb:** Ada needs to clarify *why* she one-boxes. If it's just "money is there," that's results-oriented, not theory-oriented.

  5.  **Drafting the Response:**
      *   *Tone:* Academic, precise, impartial but decisive.
      *   *Structure:*
          1.  Introduction (Acknowledging the depth of the dispute).
          2.  Move-by-Move Adjudication (1-6).
          3.  Ada's Coherence (One-boxing vs. Mugging).
          4.  Ben's Position (XOR Blackmail).
          5.  What is Missing (The deeper theoretical gaps).
      *   *Key Concepts to deploy:* CDT, EDT, UDT, FDT (Functional Decision Theory), Subjunctive Dependence, Reflective Consistency, Counterpossibles.

      *(Self-Correction during drafting)*: I need to be careful with Ada's Step 1. Is she "right"? In CDT, yes. In the context of a seminar on *rationality* involving predictors, CDT is often considered deficient. I should frame it as "Internally consistent with CDT, but vulnerable to the reflective consistency critique."
      *   Step 3 (Ada on Blackmail): She claims Ben *must* pay. Ben says no. Who is right? Ben is right. UDT does not pay in XOR blackmail because there is no subjunctive dependence between the decision and the blackmailer's sending of the letter (the letter is sent based on facts, not the decision). Wait, let's double check XOR Blackmail in FDT/UDT.
      *   *Check:* In XOR Blackmail, the blackmailer sends the letter if (Burglary XOR Flaky). If you pay, does it change Burglary? No. Does it change Flaky? No. Does it change the Blackmailer's *prediction*? The blackmailer sends the letter *before* you decide. So your decision cannot causally or logically affect the sending of the letter. Therefore, UDT/FDT says **Do Not Pay**. Ada's claim that Ben *must* pay is false. Ben's defense is correct.
      *   *Step 6 (Counterlogicals):* This is the strongest philosophical point. Newcomb with a perfect predictor *does* imply that if you two-box, the box *was* empty. This is a counterfactual about the past fixed by a prediction of your algorithm. If Ada accepts this, she accepts logical counterfactuals.

  6.  **Final Polish:** Ensure the distinction between "Updateful" (CDT/EDT standard) and "Updateless" (UDT/FDT) is clear. Emphasize that the Mugging problem is specifically designed to break Updateful theories that One-Box in Newcomb.

      *Refining the "What they are missing" section:* They are missing the explicit framework of **Functional Decision Theory (FDT)** or **Updateless Decision Theory (UDT)** which formalizes Ben's intuitions. They are also missing the nuance of **Logical Induction** or how to handle counterpossibles rigorously. Also, the pragmatic vs. normative distinction.

      *Let's write.*
answer: |-
  This is a sophisticated dispute that cuts to the heart of contemporary decision theory. The standoff between Ada and Ben recapitulates the tension between **Causal Decision Theory (CDT)** (and updateful Evidential Decision Theory) and **Updateless Decision Theory (UDT)** or **Functional Decision Theory (FDT)**.

  Here is the adjudication of the exchange, followed by an assessment of their theoretical coherence and the underlying gaps in their debate.

  ### Part I: Move-by-Move Adjudication

  **Step 1: Ada's Refusal (The Updateful Stance)**
  *   **Verdict:** *Internally consistent, but reflectively unstable.*
  *   **Analysis:** Ada is articulating the standard Causal Decision Theory (CDT) position. From the perspective of the agent *after* the coin has landed tails, the \$10,000 is causally inaccessible. Paying £100 yields a utility of -100; refusing yields 0. CDT maximizes causal expected utility relative to the agent's current epistemic state. However, her claim that "hypothetical counterparts cannot bind you" is the precise premise that UDT challenges. If rationality is about winning, and agents who bind themselves win more in predictor-rich environments, her stance is pragmatically self-defeating. She is right *given her theory*, but her theory is vulnerable to the "money-pump" style critique of dynamic inconsistency.

  **Step 2: Ben's Rebuttal (The Updateless Stance)**
  *   **Verdict:** *Correct regarding reflective consistency.*
  *   **Analysis:** Ben correctly identifies the core argument for Updatelessness. Rational agents should act on the policy they would have pre-committed to before receiving specific information that renders them powerless. If Ada would have paid ex-ante (to secure the 50% chance at £10,000), refusing ex-post makes her dynamically inconsistent. His analogy to Newcomb is apt: in both cases, the payoff depends on the *type* of agent you are (your decision function), not merely the specific output in the moment. He is right that refusing the mugging is structurally identical to two-boxing if one accepts the predictor's fidelity.

  **Step 3: Ada's Distinction (Newcomb vs. Mugging & The Blackmail Trap)**
  *   **Verdict:** *Partially correct on Newcomb, incorrect on Blackmail.*
  *   **Analysis:** Ada draws a standard CDT distinction: in Newcomb, the money is physically present in the actual world, contingent on a past prediction. In Mugging, the money is in a counterfactual branch. This distinguishes the *causal* structure. However, her claim that Ben's logic forces him to pay the XOR Blackmailer is a testable prediction, and it is here she makes a strategic error. She assumes "ex-ante endorsement" implies paying any demand that correlates with bad news. This is a straw man of updateless reasoning.

  **Step 4: Ben's Defense (Discriminating Correlations)**
  *   **Verdict:** *Correct.*
  *   **Analysis:** Ben successfully defends UDT/FDT against the blackmail objection. In Counterfactual Mugging and Newcomb, there is **subjunctive dependence**: the predictor's action depends on the *output of your decision algorithm*. In XOR Blackmail, the blackmailer's action depends on *facts about the world* (burglary/processor) that your decision algorithm does not control. Paying the blackmailer does not logically or causally influence whether the letter was sent or whether the burglary occurs. Therefore, an updateless agent refuses the blackmail but pays the mugger. Ben is right that his framework is discriminating, not indiscriminate.

  **Step 5: Ada's Metaphysical Objection (Counterlogicals)**
  *   **Verdict:** *Philosophically potent, but practically evasive.*
  *   **Analysis:** Ada raises a deep objection regarding **counterpossibles** (counterfactuals with necessarily false antecedents). If the predictor is perfect, the antecedent "If I had refused..." implies a contradiction in the mathematical facts of the predictor's simulation. Standard logic holds that counterpossibles are vacuously true, which breaks decision theory. Ada is right that CDT avoids this by relying on causal counterfactuals (which are contingent). However, claiming CDT "never needs" counterfactuals is misleading; causal counterfactuals are still counterfactuals, just less metaphysically fraught than logical ones. She identifies a cost of Ben's view but uses it to shield a potentially inferior theory.

  **Step 6: Ben's Consistency Check (Newcomb implies Counterlogicals)**
  *   **Verdict:** *Decisive.*
  *   **Analysis:** Ben wins this exchange. If Ada one-boxes in Newcomb with a *perfect* predictor, she must accept that her choice now is logically linked to the past filling of the box. To say "If I two-boxed, the box would be empty" is to make a claim about how a mathematical function (the predictor) would have behaved given a different input (her decision). If she rejects counterlogicals in the Mugging case, she undermines the justification for one-boxing in Newcomb. She cannot have it both ways: either she accepts logical dependence (and pays the mugger) or she rejects it (and two-boxes in Newcomb).

  ---

  ### Part II: Assessment of Ada's Coherence

  **Can Ada coherently be a one-boxer who refuses to pay in the mugging?**

  **No, not without theoretical fragmentation.**
  Ada is currently suffering from **theoretical dissonance**.
  1.  **If she one-boxes because of Causal Dominance:** She cannot. In Newcomb, two-boxing causally dominates. If she one-boxes, she is implicitly rejecting pure causal dominance in favor of evidential or logical correlation.
  2.  **If she one-boxes because of Evidential Correlation (EDT):** Standard EDT is updateful. An EDT agent typically *also* refuses the Counterfactual Mugging once they know the coin is tails (because conditional on Tails, paying gives no evidence of Heads). So an EDT agent can consistently One-Box and Refuse Mugging. *However*, EDT agents often fail in other predictor problems (like the "Smoking Lesion" or specific blackmail variants).
  3.  **If she one-boxes because of Predictor Fidelity:** If her justification for one-boxing is "The predictor is reliable, so my choice correlates with the box," she must accept that her choice correlates with the predictor's *disposition* in the Mugging case.

  **The Verdict:** Ada can only maintain this position by treating Newcomb as a special case of "money on the table" (results-oriented reasoning) rather than applying a consistent decision rule. If she demands a principled theory, she must abandon one. Given Ben's Step 6 argument, the pressure is on her to either:
  *   **Two-box in Newcomb** (embracing CDT fully and accepting she loses money to predictors).
  *   **Pay in the Mugging** (embracing UDT/FDT and accepting logical counterfactuals).

  Refusing to pay while one-boxing is the hallmark of an **Updateful Evidential Decision Theorist**. This position is coherent but is widely regarded in modern rationality literature as inferior to Updateless approaches because it is dynamically inconsistent (it refuses policies it would have previously bought).

  ---

  ### Part III: The XOR Blackmail Comparison

  **What does the XOR Blackmail case establish about Ben's position?**

  It establishes that Ben's position is **robust against the "Pascal's Mugging" or "Blackmail" objection**, provided he adheres to **Functional Decision Theory (FDT)** or a sophisticated UDT.

  Critics of updateless reasoning often argue: "If you commit to paying in counterfactual scenarios, won't you be exploited by anyone who claims to have predicted you?" The XOR Blackmail case is the standard test for this.
  *   **In Counterfactual Mugging:** The predictor's action (offering the deal/giving money) is *subjunctively dependent* on your decision algorithm. (i.e., $PredictorAction = f(AgentDecision)$).
  *   **In XOR Blackmail:** The blackmailer's action (sending the letter) is dependent on *world states* independent of your decision algorithm. (i.e., $BlackmailerAction = f(Burglary, Processor)$). Your decision does not appear in the function determining whether the letter arrives.

  Ben is correct that his framework distinguishes these. By paying the mugger, he buys a "logical insurance policy" that influences the predictor. By refusing the blackmailer, he recognizes that his payment cannot influence the blackmailer's prior observation of the world. This shows Ben is not a pushover for any demand; he only pays where his decision procedure has **logical leverage**.

  ---

  ### Part IV: What Both Students Are Missing

  While Ben has the stronger theoretical hand, both students are missing three crucial layers of the debate:

  1.  **The Nature of Logical Uncertainty:**
      Both treat the predictor's accuracy as a given metaphysical fact. They are missing the discussion on **Logical Induction**. The "counterlogical" problem Ada raises (Step 5) is an active area of research. How do we reason about the output of our own source code before we compute it? Ben assumes we can; Ada says it's nonsense. The missing piece is a formal account of *logical counterfactuals* (e.g., via proof-length or similarity metrics in program space) that validates Ben's intuition without violating logic.

  2.  **The Definition of "Rationality":**
      They are arguing past each other on the *goal* of decision theory.
      *   Ada views rationality as **instrumental efficiency at the moment of choice** (maximizing utility given current information).
      *   Ben views rationality as **reflective consistency and global winning** (maximizing utility across all possible branches weighted by probability).
      They need to agree on whether decision theory is a guide for *actions* or a guide for *designing agents*. If the latter, Ben wins. If the former, Ada has a point, though she loses money.

  3.  **The "Why" of Newcomb:**
      Ada has not articulated *why* she one-boxes. If she cannot explain the mechanism (logical dependence vs. common cause) without contradicting her refusal in the Mugging case, her one-boxing is merely an intuition pump, not a theory. Ben needs to press her to formalize her Newcomb justification. If she appeals to "correlation," she must explain why the Mugging correlation doesn't count. If she appeals to "causation," she should two-box.

  ### Final Recommendation for the Seminar

  You should rule in favor of **Ben on the theoretical consistency**, but acknowledge **Ada's metaphysical caution**.

  *   **Ada** is right that standard causal counterfactuals are better understood than logical counterfactuals.
  *   **Ben** is right that a rational agent should not abandon a winning policy simply because they have received bad news (updating).
  *   **Resolution:** The seminar should conclude that **Functional Decision Theory (FDT)** is the framework that resolves the standoff. It formalizes Ben's intuition (pay the mugger, don't pay the blackmailer, one-box in Newcomb) by treating the agent's decision as a logical output that can be predicted, while explicitly distinguishing between subjunctive dependence (Mugging) and mere correlation (Blackmail). Ada is invited to either adopt FDT or admit that her One-Boxing in Newcomb is an untheorized intuition.

  **Grade:** Ben: A- (Strong theory, needs to address the metaphysics of counterpossibles). Ada: B+ (Correct on standard CDT, but inconsistent with her Newcomb instincts).
