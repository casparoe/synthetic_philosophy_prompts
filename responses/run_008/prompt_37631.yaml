      *(Self-Correction)*: I should explicitly mention that Premise (2) is actually a *materialist* or *essentialist* assumption smuggled into Buddhist analysis. The Buddha's analysis looks for *substance*, not *function*.

      *Let's build the response.*
      *   Start with reassurance: This is a famous objection.
      *   Target Premise (2) and (4).
      *   Explain "Existence" in Buddhism (Dependent Arising).
