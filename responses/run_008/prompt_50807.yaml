answer: |-
  ### Brainstorming: The Metaphysical and Epistemic Bottlenecks

  Before we list the desiderata, we need to isolate why this specific problem resists solution. It isn't merely a conflict between autonomy and beneficence. If it were, we could weigh them. The problem is that the *relata* of the moral relation are unstable.

  1.  **The Ontological Bottleneck:** When you write an AD, you are making a claim about a future entity. If you hold a Psychological Continuity view (Locke/Parfit), and dementia severs those connections, the "author" of the AD and the "subject" of the care are numerically distinct (or related only by what Parfit calls "Relation R," which holds by degrees). If they are distinct, why does the author have authority over the subject? If you hold a Biological or Narrative view (Dworkin), they are the same person, and the earlier self's critical interests dominate. A theory cannot fudge this. It must pick an ontology, or it collapses into equivocation.
  2.  **The Epistemic Bottleneck:** We rarely have access to the "true" wishes of the earlier self (was the casual remark serious?) nor the "true" welfare of the later self (is the smiling dementia patient actually suffering, or just incapable of reporting distress?). A theory that demands perfect knowledge of either is dead on arrival. It needs a heuristic for uncertainty.
  3.  **The Institutional Bottleneck:** ADs serve two functions: (a) protecting the patient's interests, and (b) protecting the integrity of the medical/legal system (reliability of contracts). A theory that solves the moral problem but destroys the reliability of ADs (e.g., "ignore ADs if the current self seems happy") undermines the tool for everyone else.

  You are correct to suspect the tension between Precedent Autonomy and Current Welfare is not just a tension; it is often an incommensurability. You are comparing a *right* (to dictate one's life story) against a *state of being* (current pleasure/pain).

  ***

  ### Desiderata List for a Theory of Advance Directives in Dementia

  Here is the specification list. I have categorized them by function.

  #### 1. The Ontological Commitment Condition
  *   **What it is:** The theory must explicitly state the metaphysical relationship between the earlier competent self (E-Self) and the later incapacitated self (L-Self). It cannot treat "the patient" as a monolithic unexamined concept.
  *   **Purpose:** To prevent category errors. If the theory treats them as one person morally but two people metaphysically (or vice versa), the justification for authority will be incoherent.
  *   **Failure Mode:** Theories that fail here engage in "metaphysical hand-waving." They assert the directive binds because "it's the same person" without explaining *in what sense* it is the same person, leaving them vulnerable to Parfitian objections.
  *   **Status:** **Non-Negotiable.** (For a philosophical theory. Clinicians don't need the metaphysics, but the theory guiding them must have one).

  #### 2. The Gradient of Evidence Condition
  *   **What it is:** The theory must provide a hierarchy of authority for antecedent expressions, scaling from formal written directives to casual remarks to inferred values.
  *   **Purpose:** To handle the "range of antecedent expressions" requirement. Not all prior wishes carry equal weight.
  *   **Failure Mode:** Binary theories (Directive vs. No Directive) fail here. They either give a casual remark too much weight (rigidism) or ignore known values because they weren't notarized (formalism).
  *   **Status:** **Non-Negotiable.**

  #### 3. The Critical/Experiential Integration Condition
  *   **What it is:** The theory must provide a mechanism for weighing Dworkin's "critical interests" (E-Self's values about the kind of life they lead) against "experiential interests" (L-Self's current pleasure/pain). It cannot simply prioritize one lexically.
  *   **Purpose:** To do justice to both selves. To acknowledge that a life has narrative unity *and* that current suffering matters morally.
  *   **Failure Mode:** "Directive Absolutism" ignores the L-Self's suffering. "Current Interest Absolutism" treats the L-Self as a pet, ignoring the human narrative that produced them.
  *   **Status:** **Non-Negotiable.**

  #### 4. The Non-Maleficence Threshold (The "Harm" Condition)
  *   **What it is:** The theory must specify if/when the L-Self's current suffering trumps the E-Self's directive. Specifically, it must address harm the L-Self cannot comprehend (e.g., existential distress, violation of dignity they no longer value).
  *   **Purpose:** To address the "hard case" where following the directive causes palpable distress to the L-Self.
  *   **Failure Mode:** Theories that lack this permit "moral martyrdom" of the L-Self for the sake of the E-Self's principles, violating basic beneficence.
  *   **Status:** **Non-Negotiable.** (Though the *threshold* level is debatable).

  #### 5. The Surrogate Epistemology Condition
  *   **What it is:** The theory must define the role of the proxy. Are they a "mouthpiece" for the E-Self (substituted judgment) or a "guardian" for the L-Self (best interests)? Can they override a written directive based on new context?
  *   **Purpose:** To handle the reality that ADs are interpreted by humans, not algorithms.
  *   **Failure Mode:** Theories that treat ADs as self-executing contracts ignore the necessary interpretation required in complex medical situations.
  *   **Status:** **Negotiable.** (Some theories argue surrogates should have near-zero power if a directive exists; others give them veto power. A theory can pick a side, but it must address the role).

  #### 6. The Drift and Revocation Condition
  *   **What it is:** The theory must account for the "sliding scale" of competence. It must specify when an L-Self's current objection counts as a revocation of the E-Self's directive.
  *   **Purpose:** To handle the case where the patient says "I want to live" during the decline, before total incapacity.
  *   **Failure Mode:** Binary competence models fail here. They either accept the ramblings of a declining mind as revocation or ignore clear distress because the patient is "technically incompetent."
  *   **Status:** **Non-Negotiable.**

  #### 7. The Action-Guidance Condition (The "Night Shift" Test)
  *   **What it is:** The theory must yield a decision procedure that is robust under time pressure and epistemic uncertainty.
  *   **Purpose:** Applicability. If the theory requires a metaphysical tribunal for every decision, it is useless.
  *   **Failure Mode:** "Academic paralysis." Theories that are morally nuanced but operationally impossible lead to defaulting to "treat everyone always," which undermines the AD system.
  *   **Status:** **Non-Negotiable.**

  ***

  ### Incompatibility Matrix: Where the Theory Breaks

  You asked to flag pairs of requirements that may not be jointly satisfiable. You are right to be suspicious. Here are the critical tensions:

  **1. The Ontological Commitment vs. Action-Guidance**
  *   **Tension:** A robust ontological stance (e.g., Parfitian Reductionism) suggests the E-Self has *no* authority over the distinct L-Self. However, Action-Guidance requires stable rules to maintain trust in the AD system. If we tell clinicians "Sometimes the earlier self is a stranger," they will default to treating everyone to avoid liability.
  *   **Verdict:** **High Tension.** A theory that is metaphysically honest often fails the Night Shift Test. A theory that passes the Night Shift Test often relies on a legal fiction of identity that the metaphysics denies.

  **2. The Critical/Experiential Integration vs. The Non-Maleficence Threshold**
  *   **Tension:** If you integrate both interests (Desideratum 3), you imply a weighing process. But if you set a hard Non-Maleficence Threshold (Desideratum 4) where current suffering *trumps* prior values, you haven't integrated them; you've made experiential interests lexically superior in crisis cases.
  *   **Verdict:** **Logical Conflict.** You cannot truly "weigh" them if one has a veto. A theory must admit that in the "hard case" (distressed dementia patient), one interest category overrides the other.

  **3. The Gradient of Evidence vs. Action-Guidance**
  *   **Tension:** Nuance requires time. Distinguishing between a "casual remark" and a "settled value" requires deep investigation of the patient's history. A night-shift nurse cannot do this.
  *   **Verdict:** **Practical Conflict.** The more precise the evidentiary hierarchy, the less applicable the theory.

  ***

  ### Negotiability Assessment

  *   **Non-Negotiable:** Ontological Commitment, Non-Maleficence Threshold, Action-Guidance. (Without these, you don't have a theory; you have a mood).
  *   **Negotiable (Camp Prejudices):**
      *   *Surrogate Epistemology:* You can argue for strict compliance or flexible interpretation. Both are defensible.
      *   *Drift and Revocation:* You can argue that *any* dissent revokes, or that *no* dissent from an incompetent patient revokes. Both are consistent positions.
      *   *Personal Identity View:* You can be a Psychological Continuity theorist OR a Biological theorist. The desideratum is that you *pick one*, not which one you pick.

  ***

  ### Scorecard of Standard Positions

  Here is how the three dominant frameworks score against the desiderata. Note that "High" means it satisfies the desideratum well; "Low" means it struggles or fails.

  | Desideratum | **Directive-as-Contract** (Dworkin/Precedent Autonomy) | **Current-Interests View** (Dresser/Psychological Discontinuity) | **Best-Interests Middle** (Hybrid/Relational) |
  | :--- | :--- | :--- | :--- |
  | **1. Ontological Commitment** | **High.** (Explicitly Narrative/Biological Unity). | **High.** (Explicitly Psychological Discontinuity). | **Low.** (Often agnostic or pragmatic, risking incoherence). |
  | **2. Gradient of Evidence** | **Medium.** (Tends to privilege written text over oral). | **Low.** (Prior evidence matters little if self is distinct). | **High.** (Contextualizes all evidence). |
  | **3. Critical/Experiential Integration** | **Low.** (Lexically prioritizes Critical Interests). | **Low.** (Lexically prioritizes Experiential Interests). | **High.** (Attempts to weigh both). |
  | **4. Non-Maleficence Threshold** | **Low.** (May mandate withdrawal despite current happiness). | **High.** (Protects current self from harm). | **Medium.** (Depends on the weighting mechanism). |
  | **5. Surrogate Epistemology** | **Medium.** (Surrogates as enforcers of text). | **High.** (Surrogates as guardians of current welfare). | **High.** (Surrogates as interpreters of relationship). |
  | **6. Drift and Revocation** | **Low.** (Strict adherence unless formal revocation). | **High.** (Current dissent counts heavily). | **Medium.** (Case-by-case assessment). |
  | **7. Action-Guidance** | **High.** (Clear rule: Follow the text). | **Medium.** (Requires assessment of current state). | **Low.** (Vague weighing leads to uncertainty). |
  | **OVERALL VIABILITY** | **Strong on Law/Identity, Weak on Mercy.** | **Strong on Mercy, Weak on Autonomy/Trust.** | **Strong on Nuance, Weak on Clarity.** |

  ### Final Analysis for Your Research

  If you are looking for a gap in the literature, look at the **Action-Guidance vs. Ontological Commitment** tension.

  Most philosophers (Dworkin, Dresser) solve the ontology and ignore the night-shift nurse. Most clinicians solve the night-shift problem by ignoring the ontology (treating the patient as legally the same but morally flexible).

  A successful theory needs to bridge this. It needs to say: *"Even if the selves are metaphysically distinct (Parfit), we treat the directive as binding UP TO POINT X because of social utility/trust, BUT we revoke it at POINT Y because the harm becomes unconscionable."*

  The literature is thin on defining **Point X** and **Point Y** without resorting to intuition. If your theory can specify the *conditions* under which precedent autonomy is forfeited without collapsing into pure best-interests paternalism, you will have made a contribution.

  **One final pushback on your requirements:** You asked for a theory consistent with a "defensible view of personal identity." Be careful. You might find that *no* single view of personal identity solves the moral problem. The moral authority of the AD might not rest on identity at all, but on **promissory obligation** or **trust**. If I promise to care for your future self, does it matter if your future self is "you"? The obligation is mine, not ontological. Consider adding a desideratum that allows for **Non-Identity-Based Authority**. This might dissolve the tension you are worried about.
