      *   **Role:** Professional philosopher specializing in medical ethics and personal identity.
      *   **Tone:** Rigorous, analytical, no generic intro, focused on reasoning and trade-offs.
      *   **Specific Requirements:**
          *   Brainstorming first (what hard cases turn on).
          *   Desiderata list (purpose, failure mode, tensions, negotiable vs. non-negotiable).
          *   Scorecard of three standard positions (Directive-as-Contract, Current-Interests, Best-Interests).
          *   Address specific user prompts (range of expressions, Dworkin's split, harm to later self, surrogates, revocation/drift, personal identity, hard case of distress, applicability).
      *   **Constraint:** No generic throat-clearing.

  2.  **Brainstorming & Philosophical Grounding (The "Why" before the "What"):**
      *   *Core Tension:* It's not just autonomy vs. beneficence. It's *who* is the patient. Is it a narrative unity (Dworkin) or a series of psychological stages (Dresser/Parfit)?
      *   *The "Hard Case":* The happy dementia patient vs. the prior directive refusing life in this state. If we follow the directive, we kill a happy being. If we ignore it, we violate a solemn vow and potentially undermine the institution of ADs.
      *   *Identity:* If psychological continuity is broken (Parfit), is the earlier self *obligating* a distinct later self? Or is it one life story?
      *   *Epistemology:* How do we know what the earlier self *really* meant? (Casual remark vs. notarized document). How do we know what the later self *really* feels? (Smiling vs. underlying distress).
      *   *Implementation:* A theory that requires a metaphysical tribunal for every decision fails. Clinicians need heuristics.

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *Requirement 1: Scope of Evidence.* Needs to handle written, oral, and inferred values. *Why?* People don't always write things down. *Failure:* Formalism excludes the poor/unprepared.
      *   *Requirement 2: The Two-Self Problem.* Must weigh Critical Interests (earlier) vs. Experiential Interests (later). *Why?* Dworkin's insight. *Failure:* Ignoring one leads to tyranny (either of the dead or of the incapacitated).
      *   *Requirement 3: Harm & Beneficence.* Addressing the "harm to later self" issue. *Why?* Beneficence is a core bioethical principle. *Failure:* Sadistic adherence to rules.
      *   *Requirement 4: Surrogate/Proxy Dynamics.* *Why?* ADs are rarely interpreted in a vacuum. *Failure:* Ignores social context/family knowledge.
      *   *Requirement 5: Drift & Revocation.* *Why?* Competence fades gradually. *Failure:* Binary switch (competent/incompetent) doesn't match reality.
      *   *Requirement 6: Personal Identity Commitment.* *Why?* Can't solve the moral problem without an ontological stance. *Failure:* Metaphysical hand-waving.
      *   *Requirement 7: Action-Guidance.* *Why?* Bioethics is practical. *Failure:* Academic paralysis.
      *   *Requirement 8: The "Distress" Case.* Specific handling of the hard case where the current self fears death. *Why?* This is the emotional core of the debate.

      *   *Refining Tensions:* The user suspects Precedent Autonomy vs. Current Well-being is a zero-sum game. I need to confirm this but nuance it. It's not just tension; it's often incommensurability.
      *   *Negotiable vs. Non-Negotiable:* "Personal Identity Commitment" is non-negotiable for a *theory*, but maybe negotiable for a *clinical protocol* (clinicians don't need to know Parfit, just the rule). However, the prompt asks for a *theory* spec. So metaphysical consistency is non-negotiable for the philosopher, even if the clinician just needs the output. "Applicability" is non-negotiable for bioethics generally.

  4.  **Developing the Scorecard:**
      *   *Directive-as-Contract (Dworkin-esque):* Strong on autonomy/identity, weak on current suffering/harm.
      *   *Current-Interests (Dresser-esque):* Strong on current welfare, weak on autonomy/trust/identity.
      *   *Best-Interests Middle (Hybrid):* Tries to balance, often fails on clarity/action-guidance (vagueness).

  5.  **Review against Constraints:**
      *   *Did I brainstorm first?* Yes.
      *   *Did I address the specific user requirements?* Yes (range of expressions, Dworkin split, surrogates, drift, identity, hard case, applicability).
      *   *Is the tone right?* Needs to be peer-to-peer, rigorous, slightly critical.
      *   *No generic intro?* Jump straight into the brainstorming.

  6.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just list the desiderata but explain *what goes wrong* without them.
      *   *Correction:* Ensure the "Personal Identity" requirement doesn't demand a *specific* view (like Parfitism) but demands *consistency* with *a* view.
      *   *Correction:* The user asked to flag pairs that can't be jointly satisfied. I need to be explicit about the "Trilemma" (Consistency, Welfare, Autonomy).
      *   *Correction:* Distinguish between "Negotiable" (theoretical preference) and "Non-Negotiable" (functional requirement).

  7.  **Final Output Structure:**
      *   Brainstorming: The Metaphysical and Epistemic Bottlenecks.
      *   The Desiderata List (with Purpose, Failure Mode, Tension Flags, Status).
      *   The Incompatibility Matrix (Where the theory breaks).
      *   Scorecard of Standard Positions.

  *(Self-Correction on Tone)*: Avoid being too textbook-ish. Use language like "The Ulysses Problem," "Psychological Continuity," "Epistemic Access." Treat the user as a colleague.

  *(Refining the "Personal Identity" point)*: It's not enough to say "be consistent." The theory must specify *which* identity view grounds the authority. If it claims the selves are identical, precedent autonomy is strong. If distinct, it's weak. The desideratum is that the theory must *own* its ontology.

  *(Refining "Applicability")*: It's not just "easy to use." It's "robust under uncertainty."

