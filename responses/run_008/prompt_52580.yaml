answer: |-
  (1) Materials and setup
  Divide 18 students into three teams of six. Assign one student as Referee (rotate) or act as Referee yourself. Prepare a whiteboard for scoring and a timer. The policy prompt is: "Students submitting work 24 hours late should receive no penalty." Teams have 10 minutes to construct a syllogistic argument supporting this. Provide index cards for premises. Define "observable facts" strictly (e.g., "The syllabus says X") versus "evaluative content" (e.g., "fair," "should"). No money prizes; use "Ethical Capital" points redeemable for minor course perks (e.g., dropping a quiz score).

  (2) Round 1 rules and strike procedure
  Teams present premises one by one. The Referee listens for "smuggled oughts." If a premise contains evaluative terms (good, fair, right) or implies a norm without stating it, the Referee calls "Strike!" The premise is discarded. If the team contests, the Instructor acts as Supreme Court, ruling immediately based on whether the premise entails a value judgment without explicit normative backing. To resolve contests, the Instructor asks: "Can you imagine this fact being true without the obligation?" Scoring: +1 point per accepted premise, -2 points per strike. The goal is to reach the conclusion "No penalty" using *only* descriptive premises. Most will fail, demonstrating Hume's gap: you cannot derive an ought from an is without a normative bridge.

  (3) Round 2 rules
  Reset scores. Now, teams may cite "institutional facts": syllabus rules, promises made by professors, university statutes, or role-based obligations. These are descriptive statements about social structures but carry normative force. Teams rebuild arguments. Referees now allow premises like "The syllabus states late work is accepted," treating this institutional fact as a bridge. The goal is to see if adding social context allows the derivation of the conclusion. Teams often succeed here, suggesting that institutional facts function as hidden normative premises, blurring the line between description and prescription. This round lasts 10 minutes.

  (4) Debrief plan
  Begin by analyzing Round 1 failures. Map this directly to Hume's Guillotine: no set of brute facts logically entails a normative conclusion without at least one normative premise. Contrast this with Moore's Open Question Argument. Explain that Moore isn't just about logic; it's about meaning. Even if we agree on the facts, it remains an "open question" whether those facts entail "goodness." Clarify the difference: Hume concerns logical derivation (validity); Moore concerns semantic equivalence (definition). Students often conflate them; use the strikes to show logical invalidity, not just semantic confusion. Ask: "Was the strike because the logic failed, or because the meaning was unclear?"

  Then, analyze Round 2. Discuss Searle's claim that institutional facts (promises, rules) derive oughts from is-statements. Ask the class: Did we genuinely cross the gap? Take the position that we did not. The premise "The syllabus states X" only functions normatively because we accept a hidden normative premise: "One ought to follow the syllabus." Round 2 demonstrates that normativity is often hidden in social institutions, not that the logical gap is dissolved. This prevents conflating Hume's logical point with sociological observations about rule-following. Emphasize that Searle's move shifts the burden rather than eliminating the gap. Conclude by asking if institutional facts are just brute facts with extra steps, reinforcing the difficulty of escaping normativity.

  (5) Predictable failure points
  Students will smuggle norms into Round 1 (e.g., "Students suffer stress" implies suffering is bad). The Referee must be vigilant. If the Referee is too lenient, the gap disappears; if too strict, play halts. Instructor must override quickly to maintain flow. Another failure is conflating institutional rules with brute facts in Round 1. Clarify early that "The syllabus exists" is brute, but "The syllabus binds us" is institutional. Ensure the distinction between physical "is" and institutional "is" is clear before Round 2 begins to avoid confusion. Time management is also critical; enforce strict limits to ensure debrief time remains.

  (6) An honest note on limitations
  This activity cannot replicate deep metaethical disputes. Expressivists argue moral statements aren't truth-apt, which a syllogism game presupposes. Cornell Realists might argue moral properties are natural properties, dissolving the gap empirically. These positions concern the nature of moral truth, not just argument structure. A classroom game treats norms as rules, not ontological categories. Students leave knowing the logical structure, not the metaphysical stakes.
