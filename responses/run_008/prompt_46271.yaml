  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Task:** Create a Q&A prep sheet for a paper presentation.
      *   **Topic:** Cross-cultural moral variation does *not* entail moral anti-realism (defending realism against the argument from disagreement).
      *   **Core Argument:** Disagreement only undermines objectivity if the "Convergence Condition" is met (same non-moral evidence, rational capacities, error-correction). Current empirical studies don't meet this condition (analogy: thermometers in different rooms).
      *   **Audience:**
          *   50% Cultural Evolutionary Anthropologists & Comparative Psychologists (Focus: group-level selection, coordination, function of morality, impatience with "moral facts").
          *   50% Experimental Philosophers (Focus: study design, sampling, inference, confounds, variance).
          *   Minority: Straight Moral Philosophers (likely concerned with metaethics, but the prompt asks to focus on the specific interdisciplinary tensions).
      *   **Tone:** Hostile question period expected. Needs to be realistic, specific to the audience's vocabulary, and honest about weak points.
      *   **Requirements:**
          *   Order objections by damage potential.
          *   Use specific disciplinary vocabulary for each objection.
          *   Provide 2-minute replies.
          *   Flag soft spots/weak points honestly.
          *   Advise on strategic concessions.
          *   Identify the "Dreaded Question" and how to handle it.

  2.  **Deconstruct the Audience & Their Likely Objections:**

      *   **Cultural Evolutionary Anthropologists (CEA):**
          *   *Worldview:* Morality is a tool for social cohesion/coordination. It's adaptive. "Truth" isn't the point; function is.
          *   *Objection 1:* Your "Convergence Condition" assumes morality is about tracking facts. It's not; it's about solving coordination games. Variation *is* the adaptation.
          *   *Objection 2:* You're reifying "moral facts" as if they exist independently of the cultural systems that generate them. That's category error.
          *   *Vocabulary:* Group selection, coordination equilibria, adaptive landscapes, cultural transmission, functionalism.

      *   **Experimental Philosophers (X-Phi):**
          *   *Worldview:* Skeptical of armchair claims, obsessed with methodology. They know the data better than the philosopher.
          *   *Objection 1:* Your "thermometer" analogy fails because the "rooms" (cultures) aren't just different temperatures; the thermometers (minds) are calibrated differently by evolution/culture.
          *   *Objection 2:* You claim studies don't control for non-moral evidence. Actually, some vignette studies *do* hold facts constant and still show variation. That *is* fundamental disagreement.
          *   *Objection 3:* Sampling bias isn't just WEIRD vs. Non-WEIRD; it's about within-culture variance which undermines your "cultural system" idea.
          *   *Vocabulary:* Confounds, effect sizes, vignette controls, framing effects, cognitive architecture, sampling bias.

      *   **The "Dreaded Question":** Usually something that collapses the distinction between the argument and the data, or exposes a circularity. Likely: "If convergence never happens empirically, isn't your realism empirically empty?"

  3.  **Drafting the Objections (Iterative Process):**

      *   *Drafting CEA Objection:* They will hate the idea of "moral facts." They see morality as a coordination device.
      *   *Refinement:* Make it about "adaptive peaks." Different societies are on different peaks. Convergence would actually be *bad* (maladaptive).
      *   *Drafting X-Phi Objection:* They will attack the "non-moral evidence" claim.
      *   *Refinement:* Focus on specific studies (e.g., Haidt's vignettes) where facts *are* held constant (e.g., harmless taboo violations) and people still disagree. This directly attacks the Convergence Condition premise.

      *   *Ordering by Damage:*
          1.  **High Damage:** X-Phi attack on the "facts held constant" claim. If studies *do* control for non-moral facts and variation persists, the Convergence Condition is met, and the argument collapses.
          2.  **High Damage:** CEA attack on the *function* of morality. If morality isn't truth-tracking, realism is category-mistaken.
          3.  **Medium Damage:** The "Calibration" objection (Thermometer analogy failure).
          4.  **Medium Damage:** Within-culture variance (undermines the "cultural system" unity).
          5.  **Low Damage:** Generic "You're just defining realism to save it" (easier to parry).

  4.  **Developing Replies & Flagging Weaknesses:**

      *   *Reply Strategy:* Need to be conciliatory but firm on the metaethical point. Distinguish *genealogy* from *justification*.
      *   *Weakness:* The CEA point is philosophically thorny. If morality is *constituted* by coordination, realism is hard to defend. I need to flag this as a "soft" spot where I might need to retreat to a "minimal realism."
      *   *Weakness:* The X-Phi point about harmless taboos is strong. I need to admit that *some* variation is fundamental but argue it doesn't cover *all* morality (e.g., harm).

  5.  **Strategic Concessions:**
      *   Concede that *some* moral domains (purity/sanctity) might be culturally relative.
      *   Concede that the empirical literature is messy.
      *   Don't concede the metaethical leap (Variation -> Anti-realism).

  6.  **The Dreaded Question:**
      *   *Question:* "Is your 'Convergence Condition' empirically satisfiable? If not, is your realism just a faith claim?"
      *   *Answer:* Distinguish epistemic access from ontological status.

  7.  **Review and Refine (Self-Correction against Prompt):**
      *   *Check:* Did I use the right vocabulary? (Yes: coordination equilibria, vignette controls, etc.)
      *   *Check:* Are replies under 2 minutes? (Need to keep them punchy.)
      *   *Check:* Did I flag soft spots? (Yes, will add explicit [WEAK POINT] markers.)
      *   *Check:* Is the tone appropriate? (Professional but battle-ready.)

  8.  **Final Polish:** Organize into the requested format (Prep Sheet). Ensure the distinction between the two halves of the audience is clear in the objections. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't sound *too* defensive. The prompt asks for a prep sheet to handle hostility. The replies should be confident but acknowledge the strength of the interdisciplinary critique. I need to make sure the "Thermometer" analogy gets specific scrutiny because analogies are easy targets for empirical scientists.

  *(Refining the "Dreaded Question")*: The most dangerous question for a realist facing empirical data is usually about *explanatory power*. If realism explains nothing that relativism doesn't, why keep it? I'll frame the dreaded question around explanatory idleness.

  *(Final check on constraints)*: "Order by damage." "Phrase in vocabulary." "Flag soft points." "Concession strategy." "Dreaded question." All present.

