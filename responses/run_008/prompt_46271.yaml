answer: |-
  # Q&A PREP SHEET: Moral Realism & Cross-Cultural Variation
  **Workshop:** Culture & Moral Cognition
  **Thesis:** Empirical variation does not entail anti-realism (Convergence Condition Defense).

  ## STRATEGIC OVERVIEW
  *   **Your Goal:** Decouple the *genealogy* of moral beliefs (which is culturally variable and adaptive) from the *justification* of moral truths (which requires the Convergence Condition).
  *   **Your Vulnerability:** You are a philosopher telling empirical scientists what their data means. They resent this. You must avoid sounding like you are dismissing their findings; instead, argue you are interpreting their *implications* more carefully than the anti-realists do.
  *   **Concession Strategy:** Concede that *some* moral domains (Purity/Sanctity) may be culturally constructed without objective truth-conditions. This buys credibility to defend Realism in core domains (Harm/Fairness). Do not defend "Global Realism" if you can defend "Core Realism."

  ---

  ## TOP OBJECTIONS (Ordered by Damage Potential)

  ### 1. The "Facts Held Constant" Attack (Experimental Philosophers)
  **Damage:** **CRITICAL.** If successful, this destroys your Convergence Condition.
  **The Objection:** "You claim variation persists because non-moral evidence differs. But look at the Haidt 'harmless taboo' vignettes or the Henrich public goods games. We *do* hold the non-moral facts constant in the stimulus (e.g., 'no one was hurt,' 'the pot size is X'). Participants still diverge in verdict. This isn't a thermometer in a different room; it's two thermometers in the *same* room giving different readings. That *is* evidence against a single fact of the matter."

  **Your Reply (2 mins):**
  "Excellent point, and I grant that in *some* domains—specifically Purity or Authority—the variance persists even when non-moral facts are controlled. I am willing to concede that those specific domains may be socially constructed coordination devices without mind-independent truth conditions. However, my argument focuses on the core domains of Harm and Fairness. In those cases, when you drill down, the 'constant' facts aren't actually interpreted as constant. A WEIRD subject sees 'harm' as individual physical pain; a non-WEIRD subject might see 'harm' as spiritual degradation or group reputation loss. The *concept* of harm is part of the non-moral evidence. Until we disentangle conceptual divergence from factual divergence, we haven't met the Convergence Condition. I'm not saying variation doesn't exist; I'm saying we haven't isolated the *source* well enough to kill realism yet."

  **[WEAK POINT]:** You are walking a tightrope here. If they press you on whether "conceptual divergence" is just a fancy way of saying "different moral facts," you risk circularity. If the concept of harm *includes* the moral valuation, you can't separate them to save realism.
  **[HONESTY FLAG]:** If they cite specific studies where conceptual framing was controlled (e.g., explicit definitions provided in vignettes) and variation *still* held, you must concede that *those specific instances* count against realism, but maintain this doesn't generalize to the whole system.

  ### 2. The "Adaptive Function" Attack (Cultural Evolutionary Anthropologists)
  **Damage:** **HIGH.** Attacks the metaphysical coherence of your project.
  **The Objection:** "You're treating morality like a physics instrument trying to measure 'facts.' But from a cultural evolution perspective, morality is a technology for solving coordination problems. It's not designed to track truth; it's designed to stabilize equilibria. Variation isn't 'noise' around a true signal; it's the signal. Different groups face different adaptive landscapes. Asking if one is 'objectively true' is like asking if the French driving on the right is 'truer' than the British driving on the left. It's a category error."

  **Your Reply (2 mins):**
  "I agree that morality *functions* as a coordination technology. But a tool can have a function *and* be subject to normative evaluation. We can ask if a bridge *works* (function) and also if it *ought* to be built (normative). My claim is that while the *specific norms* (drive left vs. right) are arbitrary coordination equilibria, the *constraints* on those norms (don't collapse the bridge/don't torture children for fun) are not. The anthropological data shows variation in the 'driving side'—the specific conventions. It doesn't show variation in the structural constraints required for any society to persist. Realism applies to the constraints, not necessarily the conventions. Your data explains the conventions; it doesn't eliminate the constraints."

  **[WEAK POINT]:** This relies on a distinction between "conventions" and "constraints" that evolutionary anthropologists may reject. They might argue *all* morality, including harm norms, is just a local equilibrium.
  **[HONESTY FLAG]:** Be prepared to admit that if they can show harm norms vary purely based on ecological pressure without reference to objective wrongness, your "constraint" defense weakens.

  ### 3. The "Calibration" Objection (Comparative Psychologists)
  **Damage:** **MEDIUM-HIGH.** Attacks your central analogy.
  **The Objection:** "Your thermometer analogy fails. Thermometers are designed to be standardized. Moral cognition is designed by selection to be *divergent* to mark group boundaries. If moral cognition evolved for group cohesion, then 'error-correction' looks like conforming to the local group, not converging globally. So, by your own definition, they *are* functioning correctly. There is no 'error' to correct."

  **Your Reply (2 mins):**
  "That's a powerful challenge. It suggests that 'rational capacity' in my Convergence Condition is culturally relative. But if we accept that, we lose the ability to criticize *any* local norm, including ones we intuitively feel are wrong (e.g., slavery in a slave-holding society). If 'correct function' just means 'local fit,' then moral progress is impossible. I am arguing that there is a level of cognitive architecture—basic empathy, reciprocity detection—that *is* universal. The variation we see is often overlay on top of that universal hardware. When the hardware malfunctions (psychopathy) or is overridden by ideology, we call that error. The burden is on the anti-realist to show that *all* divergence is adaptive calibration rather than some of it being systematic distortion."

  **[WEAK POINT]:** You are appealing to "intuitions about moral progress," which this audience (especially the naturalists) may view as question-begging.
  **[HONESTY FLAG]:** If they demand a naturalistic account of "error" that isn't just "deviation from WEIRD norms," you need to be careful not to smuggle in your own morality as the baseline.

  ### 4. The "Within-Group Variance" Attack (Experimental Philosophers)
  **Damage:** **MEDIUM.** Undermines the "Cultural System" premise.
  **The Objection:** "You treat 'cultures' as monolithic blocks with single moral settings. But the data shows massive within-society variance. If morality is a group-level coordination system, why is there so much noise? If it's not, then your 'cultural embedding' defense fails. You can't blame 'background conditions' if two people in the same room, same culture, disagree."

  **Your Reply (2 mins):**
  "Within-group variance is real, but it doesn't refute the Convergence Condition; it highlights the difficulty of meeting it. Two people in the same room may have different non-moral evidence (different life experiences, different information access). My argument isn't that cultures are monoliths, but that *individuals* are rarely in the idealized epistemic position required to test realism. High variance actually supports my view: it shows moral cognition is sensitive to a complex web of inputs. To infer anti-realism from this noise is premature. We need to see if variance decreases when we control for education, information, and cognitive load. The literature hasn't done that comprehensively."

  **[WEAK POINT]:** This is a bit of a stall tactic ("we need more research").
  **[HONESTY FLAG]:** Admit that high within-group variance makes the "cultural system" explanation messier, but insist it doesn't logically entail anti-realism, only complexity.

  ---

  ## STRATEGIC CONCESSIONS (To Buy Credibility)
  1.  **Concede on Purity/Sanctity:** Explicitly state: "I am not defending realism about *everything*. If the anthropologists tell me Purity norms are purely cultural adaptations with no objective truth, I believe them. My realism is limited to Harm and Fairness."
      *   *Why:* This stops the CEA crowd from throwing the book at you. It shows you respect their data.
  2.  **Concede on WEIRD Bias:** Acknowledge that 90% of the literature is indeed biased and that we cannot currently draw firm metaethical conclusions from the existing dataset.
      *   *Why:* This disarms the X-Phi crowd who want to critique your methodology. You agree with them that the data is messy.
  3.  **Concede on "Access":** Admit that we may never *know* if we have reached the Convergence Condition.
      *   *Why:* Prevents the charge that you are claiming *proof* of realism. You are only claiming the *argument from disagreement* fails.

  ---

  ## THE DREADED QUESTION
  **The Question:** "If the Convergence Condition is never empirically satisfiable—if we can never strip away all cultural conditioning to see the 'raw' moral facts—then isn't your Realism empirically idle? What work is it doing other than comforting you?"

  **Why it's dangerous:** It attacks the *explanatory power* of your position. If realism changes nothing about how we interpret the data or live our lives, the pragmatists in the room will eat you alive.

  **Your Answer:**
  "It's not idle because it changes how we interpret *disagreement*. If I'm an anti-realist, when I encounter a culture that practices something I find abhorrent, I must view them as playing a different 'game' with incommensurable rules. If I'm a realist holding out for the Convergence Condition, I view them as potential interlocutors operating under different informational constraints. It sustains the possibility of dialogue and moral progress rather than resigning us to 'different strokes for different folks.' It's not an empirical claim about the current state of data; it's a regulative ideal for how we conduct cross-cultural engagement. It keeps the door open for persuasion rather than forcing us into mere power negotiations."

  **[NOTE]:** Deliver this with conviction. This is your normative payoff. If you stumble here, you look like a dogmatist. If you nail it, you look like a pragmatist.
