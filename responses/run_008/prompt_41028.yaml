      *   **Theoretical Conflict:** Causal-role account says both represent (same internal state/function). Teleosemantic (selected-functions) account says only A represents (B lacks the right history/selection).
      *   **Specific Sketch Provided:** Network A (trained on natural images, edge-detection selected). Network B (distilled from A, matches I/O and internal structure, but no direct selection for edges).
      *   **Constraints:**
