          *   *Probing Success:* The fact that probes work on B suggests "representation" is a useful functional category regardless of history. This supports causal-role accounts *pragmatically* in a way Swampman couldn't (because we can't test Swampman's cognitive science as easily).
          *   *Nuance:* It shifts the debate from "Can meaning exist without history?" to "Does interpretability rely on history or function?"

  7.  **Review and Refine:**
