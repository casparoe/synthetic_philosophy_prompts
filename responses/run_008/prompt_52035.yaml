answer: |-
  ## Workshop Quiz: "Can You Know Art by Hearing About It?"

  **Facilitator Note:** This quiz is designed to be handed out at the start of your workshop. It avoids philosophical jargon (like "testimony," "epistemic," or "aesthetic") to ensure visitors answer based on their intuitions rather than trying to guess the "right" academic answer. There are no right or wrong scores; the goal is to reveal hidden assumptions.

  ***

  ### The Quiz

  **Instructions:** For each situation below, choose the statement that best matches what you would honestly think or say.

  **1. The Wine Critic**
  A wine critic with a perfect track record tells you, before you pour a glass, that a specific bottle is genuinely excellent. You haven't tasted it yet.
  *   **A.** If I trust the critic, I can say I *know* the wine is excellent.
  *   **B.** I believe the critic, but I can't really *know* it's excellent until I taste it myself.
  *   **C.** "Excellent" just means the critic enjoyed it; there's no fact about the wine itself to know.

  **2. The Friend's Film**
  A trusted friend who loves movies tells you a film you haven't seen is a masterpiece.
  *   **A.** I am entitled to tell others it is a masterpiece, based on their word.
  *   **B.** I'll take their word that *they* loved it, but I shouldn't judge the film myself yet.
  *   **C.** They are just sharing their feelings; calling it a "masterpiece" isn't a factual claim.

  **3. The Closed Show**
  A theatrical performance has ended and will never be performed again. Dozens of reliable witnesses report it was brilliant.
  *   **A.** It is a fact that the performance was brilliant.
  *   **B.** I have to accept that I will never know how brilliant it was.
  *   **C.** Since no one can see it now, calling it "brilliant" doesn't mean anything anymore.

  **4. The Photographed Painting**
  You are looking at a high-fidelity photograph of a famous painting you will never see in person.
  *   **A.** I know what the painting is like; the photo captures its quality.
  *   **B.** I know what the image looks like, but I miss the point of the painting itself.
  *   **C.** The photo is just an image; the "painting" is whatever people feel when they stand in front of the original.

  **5. The Conceptual Piece**
  A work of art consists entirely of a written idea or fact (e.g., "A line was drawn in the desert"). You read the description but never see a photo or the site.
  *   **A.** Knowing the facts is enough to understand and judge the work.
  *   **B.** I need to see how the idea was presented to truly judge it.
  *   **C.** The "art" is just the idea popping into your head; there's nothing external to judge.

  **6. The Novel Reviews**
  You read ten detailed reviews of a new novel but never read the book itself.
  *   **A.** I know whether the novel is well-written.
  *   **B.** I know the plot and the critics' opinions, but not the quality of the writing.
  *   **C.** "Well-written" is just a summary of how readers reacted; I have that information.

  **7. The Spectacular Sunset**
  A friend calls you from a beach, describing a sunset as the most beautiful they have ever seen.
  *   **A.** I can accept that it was the most beautiful sunset they've seen.
  *   **B.** I'm glad they saw it, but I can't know the beauty myself.
  *   **C.** Beauty is in the eye of the beholder; their experience is theirs, not a fact about the sky.

  **8. The Live Concert**
  A music expert tells you a live concert was transcendent. You only listen to the studio album later.
  *   **A.** I know the live show was transcendent, even if the album sounds different.
  *   **B.** The album might be good, but I can't know about the live experience.
  *   **C.** "Transcendent" just describes the expert's emotional state at the time.

  ***

  ### Scoring Key & Discussion Guide

  **How to Tally:**
  Have participants count how many **A**, **B**, and **C** options they selected. There is no "passing" score. The patterns reveal their philosophical stance on how we learn about art.

  #### 1. The Optimist (Mostly A's)
  *   **Position:** **Epistemic Optimism.**
  *   **View:** Testimony about art works just like testimony about history or science. If a reliable source says something is good, you can know it is good, even without direct experience.
  *   **Workshop Discussion:** Ask this group: "If you know the wine is excellent without tasting it, what did you miss out on by not drinking it?" They might say "I missed the pleasure," but insist they didn't miss the *knowledge*.

  #### 2. The Pessimist (Mostly B's)
  *   **Position:** **Aesthetic Pessimism (The Acquaintance Principle).**
  *   **View:** You can believe a source, but you cannot claim *knowledge* or make a judgment without direct experience.
  *   **Nuance Check (Moderate vs. Thoroughgoing):** This quiz alone **cannot cleanly separate** Moderate Pessimism (testimony gives justified belief but falls short of knowledge) from Thoroughgoing Pessimism (testimony provides no justification at all). Both groups select **B**.
      *   *To distinguish them in discussion:* Ask, "Do you have *no reason* to think the wine is good (Thoroughgoing), or do you have good reason but it doesn't count as *your* knowledge (Moderate)?"
  *   **Workshop Discussion:** Ask: "Is this rule about *truth* (you can't know the truth) or about *manners* (you shouldn't claim to know)?"

  #### 3. The Subjectivist (Mostly C's)
  *   **Position:** **The Subjectivist Escape / Expressivism.**
  *   **View:** There is no "fact of the matter" regarding beauty or quality. Statements like "this is good" are really just reports of personal feelings ("I like this"). Therefore, there is nothing to transmit via testimony.
  *   **Workshop Discussion:** Ask: "If 'masterpiece' just means 'I liked it,' why do we argue about art? Can you be wrong about your own feelings?"

  #### 4. The Mixed Bag (Split Scores)
  Most visitors will land here. The specific *combination* of answers reveals interesting philosophical tensions.

  *   **The "Conceptual Exception" (B's on Wine/Film, but A on Conceptual Art):**
      *   **View:** This is a **defended philosophical position**. It suggests that when art is purely informational (Conceptual), testimony works, but when art is sensory (Wine/Painting), it doesn't.
      *   **Discussion:** "Why does the medium change the rules of knowledge? Is conceptual art more like a science fact than a painting?"

  *   **The "Nature vs. Art" Split (A on Sunset, B on Painting):**
      *   **View:** **Unexplored/Incoherent.** This pattern suggests aesthetic properties in nature (sunsets) can be known via testimony, but aesthetic properties in art (paintings) cannot.
      *   **Critique:** Philosophers generally argue that "beauty" functions the same way in nature and art. If you can know a sunset is beautiful via a friend, why not a painting via a critic? This position is unattractive because it treats the *property* (beauty) differently depending on the *object*, without a clear reason why.

  *   **The "Reproduction Inconsistency" (A on Photo of Painting, B on Live Concert):**
      *   **View:** **Unexplored.** This suggests photographs capture the "art" of a painting, but recordings do not capture the "art" of a performance.
      *   **Critique:** This is merely unexplored, not necessarily incoherent. It might rely on the idea that paintings are static objects (captured in photos) while performances are events (lost in time). However, if they chose **B** for the Photo but **A** for the Concert, that is **incoherent**: it claims you can know a static object via image but not a recorded event via description.

  *   **The "Sensory Modality" Split (A on Wine, B on Film):**
      *   **View:** **Unattractive.** This implies testimony works for taste (wine) but not vision (film).
      *   **Critique:** There is no standard philosophical view that privileges taste over vision regarding testimony. This usually indicates an unexamined personal bias (e.g., "I trust my palate more than my eyes") rather than a consistent theory of knowledge.

  ### Facilitator's Note on the "Acquaintance Principle"
  The prompt asks to distinguish between pessimists who think aesthetic claims are *about experience* (so testimony fails because it's not an experience) vs. those who think claims are *about the work* but require *acquaintance* (normative rule).
  *   **Quiz Limitation:** As noted in the Pessimist section, the multiple-choice format forces these two distinct views into Option **B**.
  *   **How to Probe:** In the workshop, ask the **B**-selectors: "Imagine a magic pill that gave you the knowledge that the painting is great, but without the visual experience. Would you take it?"
      *   If **Yes**: They think the claim is about the *work*, and they just want the fact (Moderate/Normative Pessimist).
      *   If **No**: They think the claim is *about the experience* itself (Thoroughgoing/Experiential Pessimist).
