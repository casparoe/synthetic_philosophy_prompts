  (3) Real tensions, worst first
  Commitment (2) asserts consciousness is the intrinsic nature of physical stuff. Commitment (3) asserts consciousness is substrate-independent, relying solely on functional organization. These pull in opposite directions. If experience is the intrinsic categorical base of physical dispositions (2), then merely simulating the dispositions (3) without the specific intrinsic base risks creating a "philosophical zombie" upload. Functionalism claims causal roles suffice; Russellian Monism claims causal roles plus the right intrinsic filler are required. But if stuff matters for intrinsic nature, then "pattern, not stuff" is an overstatement. If silicon lacks the specific intrinsic nature of carbon-based life, your upload is dark. If intrinsic nature is universal, then stuff doesn't matter, but then (2) loses its specific bite about matter. Holding both requires assuming silicon shares biology's intrinsic nature, which is an unproven metaphysical gamble. This is the core metaphysical friction in your system, threatening the coherence of your physicalist upload scenario.

  Commitment (4) posits proto-valence at the fundamental level, while (7) restricts morally relevant suffering to integrated subjects. Commitment (5) demands we count total suffering wherever it sits. This creates a moral gap. If proto-valence lacks a subject (per 7), it doesn't count as suffering, rendering the panvalence of (4) ethically inert despite the total-view mandate of (5). Conversely, if proto-valence counts toward the total suffering in (5), then (7)'s subject requirement is arbitrary and excludes vast quantities of negative value. You risk either inflating moral concern to electrons (violating 6) or ignoring the cumulative weight of proto-suffering (undermining 5). The tension lies in defining the threshold where proto-unpleasantness becomes suffering without ad hoc line-drawing that contradicts the total-view intuition. You want the wild animals to count (5) but not the electrons (6), yet (4) suggests a continuum. Bridging proto-valence to subject-less suffering without collapsing into absurdity requires a non-arbitrary integration threshold that (7) asserts but doesn't justify against (5).

  (4) Cheapest fix
  Tweak (3). Instead of strong substrate independence, claim substrate independence holds *provided* the new substrate possesses the same intrinsic nature as the biological original. This preserves the upload intuition while respecting the Russellian Monism of (2). It costs you the certainty that silicon *will* work—you now depend on a metaphysical claim about silicon's intrinsic nature—but it stops (2) and (3) from cannibalizing each other. It aligns your metaphysics with your sci-fi intuitions without requiring you to abandon the physics-based insight that structure isn't everything.
