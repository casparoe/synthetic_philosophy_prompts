  # Research Agenda: The Ontology and Normativity of Free-Floating Rationales

  ## Executive Strategy
  The concept of free-floating rationales (FFRs) stands at a precarious junction: it is either a profound expansion of naturalism or a category error that smuggles normativity into causal descriptions. With three researchers and a two-year horizon, we cannot solve every metaphysical puzzle. We must target the **bottlenecks**. The agenda prioritizes questions that act as *gatekeepers*: if the answer is negative, the FFR program collapses; if positive, the downstream implications follow.

  Consequently, this agenda deprioritizes broad surveys of scope (Q3) and treats the core ontological classification (Q1) as a *conclusion* to be derived from more tractable conceptual tests, rather than a starting premise. We focus on the mechanisms that would *make* FFRs real: the possibility of error and the avoidance of circularity.

  ---

  ## Prioritized Research Questions

  ### 1. The Possibility of Mind-Independent Error (Candidate Q4)
  **Priority:** First (Foundational)
  **Researcher Allocation:** 1.5 FTE (Shared by two researchers)

  *   **Importance:** This is the litmus test for the entire program. Normativity requires the possibility of failure. If a butterfly's wing pattern can only be "causally ineffective" but never "wrong" or "mistaken" in the absence of a mind, then FFRs are merely descriptive regularities, not reasons. Solving this determines whether FFRs can support content, function, or value.
  *   **Tractability:** High. Unlike abstract metaphysics, "error" can be analyzed through concrete case studies in teleosemantics (biological function) and machine learning (loss functions vs. normative failure). There is a robust existing literature (Millikan, Papineau, Dennett) to build upon and critique within two years.
  *   **Neglectedness:** Moderate. While "teleological error" is discussed in philosophy of biology, it is rarely rigorously tested against modern ML systems where "design" exists without a designer's ongoing intent. Bridging these fields is fresh terrain.
  *   **Dependency Structure:** This is upstream of **Q1 (Real Reasons)** and **Q5 (Naturalizing Normativity)**. If mind-independent error is impossible, Q1 is answered negatively (they are not real reasons) and Q5 is moot. If possible, it provides the necessary condition for Q5.
  *   **Intermediate Progress (Year 1):** A taxonomy of "error types" distinguishable from mere "causal deviation." For example, distinguishing a mutation that fails to replicate (causal) from a signal that misrepresents a predator (normative) without invoking a receiver's interpretation.

  ### 2. The Circularity of Naturalized Normativity (Candidate Q5)
  **Priority:** Second (Structural)
  **Researcher Allocation:** 1 FTE

  *   **Importance:** This is the "kill switch." The promise of FFRs is to naturalize normativity (explain 'ought' via 'is'). If the selection histories or design processes that generate FFRs *already presuppose* normative standards (e.g., survival *good*, extinction *bad*), the project is circular. This question determines the philosophical viability of the entire enterprise.
  *   **Tractability:** Medium. This is pure conceptual analysis, which fits a two-year window well. It requires mapping the logical structure of current FFR arguments to locate hidden normative premises.
  *   **Neglectedness:** High. Most proponents assume naturalization is possible; most critics assume it isn't. Few have mapped the precise logical point where the "ought" slips in.
  *   **Dependency Structure:** Downstream of **Q4** (you need error to have normativity) but upstream of **Q1** (you need non-circular normativity to have *real* reasons). It is also a prerequisite for **Q3 (Scope)**; we cannot extend FFRs to physics or chemistry if we haven't secured the normative basis in biology.
  *   **Intermediate Progress (Year 1):** A formal reconstruction of the top three competing accounts of biological function (etiological, systemic, goal-contribution) identifying exactly where, if anywhere, they beg the normative question.

  ### 3. Observer-Independence vs. Perspectival Robustness (Candidate Q2)
  **Priority:** Third (Ontological)
  **Researcher Allocation:** 0.5 FTE (Collaborative synthesis)

  *   **Importance:** This clarifies the metaphysical status of FFRs. Are they "out there" (realist) or "tools for prediction" (instrumentalist)? Dennett often blurs this, arguing that "real patterns" are stance-dependent but objective. This research clarifies whether that position is stable.
  *   **Tractability:** Low/Medium. Deep metaphysics is hard to settle in two years. However, framing it as "What conditions make an FFR *detectable* by any rational observer?" makes it more tractable.
  *   **Neglectedness:** Low. This is the standard debate between realists and instrumentalists. However, applying it specifically to the *free-floating* nature (no mind *at all*, not even a potential one) is under-explored.
  *   **Dependency Structure:** Downstream of **Q1**. Once we know if they are real reasons (via Q4/Q5), we ask where they reside. If they are real reasons, are they observer-independent?
  *   **Intermediate Progress (Year 1):** A refined definition of "Stance-Independence" that distinguishes between "requiring an observer to *see*" vs. "requiring an observer to *exist*."

  ---

  ## Deprioritized and Modified Questions

  ### Deprioritized: Scope and Extension (Candidate Q3)
  *   **Status:** Deferred.
  *   **Justification:** This question asks how far FFRs extend (to physics, ML, etc.). This is downstream of **Q1** and **Q5**. If FFRs fail to naturalize normativity in biology (their strongest case), extending them to physics is premature speculation. Funding this now risks producing analogies rather than arguments. It should be revisited in Year 3 if Q1 and Q5 are resolved positively.

  ### Modified: Real Reasons vs. Reason-Like Regularities (Candidate Q1)
  *   **Status:** Reclassified as the *Synthesis Goal*.
  *   **Justification:** Q1 is not a separate research track but the *conclusion* of the agenda. Asking researchers to debate "are they real?" directly leads to verbal disputes. By funding **Q4 (Error)** and **Q5 (Circularity)**, we generate the premises that *force* an answer to Q1. If error is possible and normativity is non-circular, they are real reasons. If not, they are regularities. Funding Q1 directly is inefficient; funding its conditions is strategic.

  ### Added: The Substrate Question (New)
  *   **Question:** *In what physical structures do free-floating rationales supervene?*
  *   **Justification:** Dennett speaks of rationales floating free of minds, but they must be anchored in *something* (DNA, neural weights, environmental constraints). If the rationale is distributed across the environment (niche construction) rather than the organism, it changes the ontology.
  *   **Integration:** This is folded into **Q4**. To analyze error, one must locate where the "standard" for error is physically stored.

  ---

  ## Intermediate Progress Markers
  To ensure accountability over the two-year grant, the foundation should look for the following deliverables:

  1.  **Month 12:** A joint working paper titled *"The Error Condition,"* proposing a necessary and sufficient condition for a non-mental system to be in a state of error.
  2.  **Month 18:** A workshop bringing together philosophers of biology and ML researchers to test the "Error Condition" against specific cases (e.g., adversarial examples in neural nets vs. mimicry in butterflies).
  3.  **Month 24:** A monograph or special issue draft titled *"Naturalizing the Ought,"* which explicitly maps the derivation of normativity from selection history, highlighting where circularity was avoided.

  ---

  ## The Single Biggest Point of Leverage

  **The Question:** **Whether free-floating rationales can support *mind-independent error* (Q4).**

  **Defense of Choice:**
  This is the highest-leverage question because it is the **necessary condition** for every other positive claim in the FFR program.
  *   If systems cannot be *wrong* without a mind, they cannot have *functions* (only effects).
  *   If they cannot have functions, they cannot have *reasons* (Q1 collapses).
  *   If they cannot have reasons, there is no *normativity* to naturalize (Q5 fails).
  *   If there is no normativity, the *observer-independence* debate (Q2) becomes moot (they are just causal patterns).

  Focusing here forces the research to confront the hardest constraint immediately. It prevents the team from building elaborate metaphysical superstructures on a foundation that cannot support normativity.

  **The Most Plausible Alternative:**
  The alternative leverage point is **Candidate Q5 (Naturalizing Normativity/Circularity)**. One could argue that even if error is possible, the project fails if the explanation is circular (presupposing the normativity it explains).

  **Why Q4 is Superior to Q5:**
  The Circularly Objection (Q5) is a *logical* constraint, but the Error Objection (Q4) is an *ontological* one. You can potentially fix a circular argument by refining definitions (a conceptual task). You cannot fix the absence of error conditions in a mindless system without changing the nature of reality (a metaphysical task).
  Furthermore, Q4 is more **tractable** for early-career researchers. Analyzing "circularity" often leads to infinite regress debates. Analyzing "error" allows for case-based reasoning (e.g., "Is this gene mutation an error or just a variation?"). Progress on Q4 yields concrete criteria that can then be used to *test* for circularity in Q5. Therefore, Q4 is the key that unlocks the door; Q5 is the room inside. You must turn the key first.
