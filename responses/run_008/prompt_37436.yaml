answer: |-
  Here is a prioritized agenda based on dependency structure and tractability for a theoretical team. The logic is strictly **foundational viability**: if the answer to a higher-ranked question is "no," the lower-ranked work becomes optimization on a dead end.

  ### 1. The Success Condition: Truth-Tracking vs. Lie-Catching Stability
  **The Question:** Are we formalizing oversight as a mechanism to converge on an external ground truth, or as a mechanism to stabilize the judge against manipulation (regardless of truth)?
  **Why it's #1:** This is the definition of the loss function for the entire agenda. Most empirical debate work implicitly assumes "Truth" is the goal but optimizes for "Consistency" or "Unexploitability." If scalable oversight is fundamentally about preventing the AI from *lying convincingly* rather than *finding the truth*, then the entire game-theoretic setup changes.
  *   **Upstream Dependency:** Every other question assumes a goal. If the goal is stability, then "obfuscated arguments" (Q2) matter less than "persuasive coherence." If the goal is truth, obfuscation is a fatal failure mode.
  *   **Tractability:** Pure philosophy/epistemology. You can model this using formal epistemology or decision theory without running a single token. You are analyzing the *concept* of oversight, not the implementation.
  *   **Bump Up/Down:** Bump **up** if empirical teams start reporting that debate improves "human confidence" without improving "factual accuracy." This suggests the field is drifting toward stability, making your conceptual clarification urgent. Bump **down** if a consensus emerges that "truth" is operationally undefined in RLHF contexts (in which case, you pivot to defining "useful stability").

  ### 2. The Bounded Judge Ceiling (The Obfuscation Problem)
  **The Question:** Is there a complexity class of arguments where a bounded judge (human or weak model) cannot verify the winner even with optimal cross-examination?
  **Why it's #2:** This is the hard physical limit of the approach. If the answer is "Yes, such a class exists and covers relevant safety cases," Debate is dead as a scalable solution. It doesn't matter if the debaters are symmetric or asymmetric if the judge literally cannot parse the proof.
  *   **Upstream Dependency:** This gates Q3 and Q4. If the judge is fundamentally blind to certain obfuscations, tweaking the debater incentives (Q3) or asymmetry (Q4) won't fix it.
  *   **Tractability:** High for formal methods. This is a proof complexity problem. You can model the judge as a bounded verifier and the arguments as proofs. You don't need ML; you need complexity theory.
  *   **Bump Up/Down:** Bump **up** immediately if larger models start exhibiting "grokked" reasoning that they cannot articulate in natural language. If the reasoning becomes latent and non-decomposable, the obfuscation problem becomes unsolvable via debate.

  ### 3. Equilibrium Selection: Unexploitability vs. Truth
  **The Question:** Does the self-play dynamic converge to a Nash equilibrium that is truthful, or merely one where neither side can *prove* the other is lying (which may be a false consensus)?
  **Why it's #3:** This is the mechanism check. Assuming Q1 (we want truth) and Q2 (truth is verifiable), does the game structure actually deliver it? Standard game theory suggests self-play finds *stable* strategies, not necessarily *true* ones. A collusive equilibrium where both debaters agree on a plausible falsehood is a valid Nash equilibrium.
  *   **Upstream Dependency:** Gates Q4. If the symmetric game doesn't track truth, adding asymmetry (Q4) is a patch. You need to know if the base engine works before adding turbochargers.
  *   **Tractability:** High for game theorists. You can construct toy models of debate games and analyze equilibrium conditions.
  *   **Bump Up/Down:** Bump **up** if empirical results show debaters converging on confident, shared errors. Bump **down** if it turns out that "truth" is just the focal point in most coordination games (unlikely, but possible).

  ### 4. Asymmetry and Compelled Honesty
  **The Question:** How does the protocol break when one agent is honest (or compelled to be) and the other is adversarial, versus when both are adversarial?
  **Why it's #4:** This is an implementation detail relative to the theoretical viability. Real-world oversight will likely be asymmetric (Assistant vs. Red Teamer). However, this only matters if the symmetric version is theoretically sound (Q3) and verifiable (Q2).
  *   **Upstream Dependency:** Depends on Q1-Q3. If the symmetric game fails to track truth, asymmetry might fix it, but it's a heavier lift.
  *   **Tractability:** Moderate. Requires modeling heterogeneous agents. Still doable without ML, but requires more assumptions about agent capabilities.
  *   **Bump Up/Down:** Bump **up** if safety orgs pivot to "Red Teaming" as the primary oversight mode rather than "Self-Debate." Bump **down** if self-play proves robust enough that asymmetry adds negligible value.

  ---

  ### What to Drop (For Now)
  **Drop:** *Non-zero-sum settings / Harmful Evaluation Payoffs.*
  **Reason:** This is a specific edge case of Q1 (Success Conditions). If you solve Q1 correctly, you will have defined whether the judge's utility function includes safety constraints. Worrying about "debaters winning by harming the judge" is a specific instantiation of "What is the success condition?" If you define success as "Truth without Harm," this question dissolves into Q1.
  **Cost:** You might miss a specific attack vector where debaters collude to manipulate the judge's reward signal directly. **Mitigation:** Fold this into Q1 as a constraint on the "Truth" definition (i.e., Truth must be robust to instrumental convergence).

  ---

  ### The "Standard Framing" Critique
  You asked where the standard framing is wrong. Here is the biggest risk to your agenda:

  **The "Human-in-the-Loop" Assumption.**
  Most debate literature assumes the "Judge" is a human (or a human-proxy) whose preferences are the ground truth.
  *   **The Flaw:** In safety cases, the human is often *wrong* or *manipulable* in ways the AI understands better than the AI understands the truth. If the AI can persuade the human of a false safety claim, Debate succeeds (the human is convinced) but Alignment fails (the system is unsafe).
  *   **The Pivot:** Your Q1 needs to explicitly decouple "Human Conviction" from "Safety Truth." If your formal models assume the Judge is the oracle, you are solving the wrong problem. You are solving "Persuasion," not "Oversight."
  *   **Action:** Ensure Q1 explicitly models the Judge as a *fallible* verifier, not a ground-truth oracle. If you don't do this, Q2 (Obfuscation) becomes trivial (because the Judge just declares the winner), and the whole agenda collapses.

  ### Summary of Dependency Logic
  1.  **Define the Win Condition (Q1).** (If you aim for stability, don't optimize for truth).
  2.  **Verify the Channel Capacity (Q2).** (If the judge can't read the message, the game doesn't matter).
  3.  **Verify the Game Incentives (Q3).** (If the game rewards collusion, don't play it).
  4.  **Optimize the Player Setup (Q4).** (Once the game works, tune the players).

  If you spend two years on Q4 (Asymmetry) and then discover Q2 (Obfuscation) makes the judge blind, you have wasted two years. Start at the top of the stack.
