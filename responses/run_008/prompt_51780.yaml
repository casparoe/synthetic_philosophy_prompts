answer: |-
  1. **The Immortal Tiny Things**
  You're looking at bdelloid rotifers under a microscope. They're everywhere, they look identical, but scientists say they haven't sexually reproduced in 30 million years. Do they count as a single species?
     *   **A.** Yes, they look and act the same, so they're one group.
     *   **B.** No, without sex to mix them up, every family line is its own separate species.
     *   **C.** The word "species" breaks here; it only means something for things that mate.

  2. **The Arctic Circle**
  Imagine a chain of gull populations encircling the North Pole. Population A breeds with B, B with C, all the way around the circle. But when the chain closes, the final population Z won't breed with A. Are they one species or two?
     *   **A.** One species; they're all connected by neighbors who can mate.
     *   **B.** Two species; the ends of the chain are isolated from each other.
     *   **C.** It's an arbitrary line; nature is a continuum and our labels are fake.

  3. **The Lookalike Lovers**
  Two bird populations live in the same forest. They look completely different and have different DNA, but wherever their ranges overlap, they interbreed freely and raise healthy chicks. Field guides list them separately. Is that right?
     *   **A.** Yes, keep them separate; they maintain distinct looks and genes.
     *   **B.** No, merge them; if they swap genes freely, they are one biological unit.
     *   **C.** Keep them separate only if they eat different food or nest in different trees.

  4. **The Ancestor Puzzle**
  You're digging up human ancestors. Every generation could mate with the next, but over a million years, the bones change significantly. Where do you draw the line between *Homo habilis* and *Homo erectus*?
     *   **A.** Draw the line where the bone shape changes enough to notice.
     *   **B.** Don't draw hard lines; it's one continuous lineage changing slowly.
     *   **C.** Draw the line where their tools or hunting methods fundamentally changed.

  5. **The Gene Traders**
  You're studying bacteria in a pond. They don't just pass genes to offspring; they swap DNA sideways with strangers like trading cards. Does the idea of "species" work here?
     *   **A.** Yes, group them by their main family tree despite the trading.
     *   **B.** Yes, group them by the chemical job they do in the water.
     *   **C.** Not really; their genetics are too messy for standard species labels.

  6. **The Legal Wolf**
  A protected endangered wolf population has been mixing with common coyotes. The law protects "wolves." Do the mixed animals get protection?
     *   **A.** Yes, protect the living lineage regardless of the mixing.
     *   **B.** No, protect only the pure ones; the mix is a different thing.
     *   **C.** It depends on what solves the conservation problem best.

  7. **The First Question**
  You discover a strange new animal in the rainforest. What is the very first thing you need to know to name it?
     *   **A.** Who it can make babies with.
     *   **B.** What it looks like compared to known animals.
     *   **C.** Where it fits in the family tree of life.

  8. **The Moment of Change**
  When exactly does a new species come into existence?
     *   **A.** When a group stops making babies with the original population.
     *   **B.** When a group looks distinct enough to be recognized.
     *   **C.** Never exactly; it's a gradual slide that we just label later.

  9. **The Toolbox**
  You're writing a grant proposal. Do you need to stick to one definition of "species" for all your work?
     *   **A.** Yes, science needs consistent rules to be real science.
     *   **B.** No, use whatever definition fits the specific problem you're solving.
     *   **C.** No, because none of the definitions are actually correct.

  10. **The Reality Check**
  Be honest: Are species real objects found in nature, like rocks or rivers?
      *   **A.** Yes, they are real units waiting to be discovered.
      *   **B.** They are real, but only as lines of ancestry through time.
      *   **C.** No, they are human concepts we impose on a messy world.

  ***

  ### SCORING KEY

  **Step 1: Tally Your Choices**
  Go back through your answers. For each question, check the box below that matches the *theme* of the answer you chose. (Don't worry if you didn't pick the same letter every time; look at the meaning).

  | Question | **Matchmaker** (Focus on Mating) | **Identifier** (Focus on Looks/Distinctness) | **Historian** (Focus on Lineage/Time) | **Ecologist** (Focus on Job/Role) | **Pragmatist** (Focus on Utility) | **Skeptic** (Focus on "Not Real") |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **1** | C | A | B | — | — | C |
  | **2** | B | — | A | — | — | C |
  | **3** | B | A | — | C | — | — |
  | **4** | — | A | B | C | — | B |
  | **5** | — | — | A | B | — | C |
  | **6** | — | B | A | — | C | — |
  | **7** | A | B | C | — | — | — |
  | **8** | A | B | — | — | — | C |
  | **9** | — | — | — | — | B | C |
  | **10** | A* | — | B | — | — | C |

  *\*Note: In Q10, choosing "Yes, real units" often aligns with the Matchmaker view that isolation makes them real.*

  **Step 2: Find Your Dominant Column**
  Count up your checks in each column. The column with the most checks reveals your species concept preference.

  *   **Mostly Matchmaker:** You hold the **Biological Species Concept**. To you, species are defined by who can mate with whom. If they can make babies together, they're the same; if they can't, they're different. It's the classic schoolbook view, though you might struggle with asexual creatures or fossils.
  *   **Mostly Identifier:** You hold the **Morphological Species Concept**. You trust your eyes (and genetic distinctness). If you can tell them apart consistently, they're different species. This is practical for field guides, though you might lump together things that look alike but don't interbreed.
  *   **Mostly Historian:** You hold the **Evolutionary Lineage Concept**. You see species as single lines of ancestors and descendants through time. You're comfortable with gradual change and fuzzy boundaries, viewing species as stages in a long history rather than static boxes.
  *   **Mostly Ecologist:** You hold the **Ecological Species Concept**. You care about what the organism *does*. If two groups fill different roles (niches) in nature, they're different species, even if they look similar or occasionally mix.
  *   **Mostly Pragmatist:** You are a **Pluralist**. You don't think there is One True Definition. You believe "species" is a tool, and you should use the definition that best solves the problem at hand (e.g., one definition for law, another for genetics).
  *   **Mostly Skeptic:** You lean toward **Eliminativism**. You suspect "species" isn't a real thing in nature, but rather a human label we force onto continuous processes. You're the person at coffee pointing out that nature doesn't read our field guides.

  **Step 3: Important Caveats (Read This!)**

  *   **The Overlap Zone:** If you scored equally high in **Matchmaker** and **Historian**, don't worry—these views often overlap in practice. Most sexually reproducing animals fit both definitions nicely. You're in the mainstream majority.
  *   **The Impossible Combo:** If you scored high in **Skeptic** *and* high in **Matchmaker/Identifier**, your answers were inconsistent. The Skeptic view says the categories aren't real, while the others say they are. You might be arguing with yourself!
  *   **The Pluralism Trap:** If you scored high in **Pragmatist**, you might not have a "favorite" concept. That's the point. However, if you picked Pragmatist answers *plus* strong answers in other columns, you're likely a "Restricted Pluralist"—you think multiple concepts are real, but only for specific jobs.
  *   **No Clear Winner:** If your scores are scattered evenly across all columns, you either have a very nuanced view of biology, or you were just clicking randomly. If it's the former: congratulations, you're ready to mediate the docent coffee arguments.
