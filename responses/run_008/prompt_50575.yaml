answer: |-
  This is a sharp reading of the tension at the heart of Confucian ethics. You have identified the friction between the *universal source* of moral feeling (Mencius's child in the well) and the *particularist structure* of moral duty (the Five Degrees of Mourning, or *Wu Fu* 五服).

  To answer your core question: The mourning system is not underdetermined. It is not a delivery mechanism for consequentialist help, nor is it compatible with a flat universalist ethic. It is committed to a specific metaphysical claim about the self: **that persons are constituted by their roles, not prior to them.**

  Here is a breakdown of what the apparatus presupposes, why the "instrumental" reading fails, and what would be lost if you flattened the system.

  ### 1. What is a Duty? (Constitutive vs. Instrumental)
  You ask whether roles are morally basic or just instruments for effective help. The mourning system is explicitly committed to the view that **roles are ontologically basic.**

  In the Confucian framework, you do not exist as an atomic individual who then enters into relationships. You exist *as* a son, a father, a subject, a friend. Your humanity (*Ren* 仁) is cultivated *through* these specific nodes. Therefore, a duty is not a debt incurred by benefit received (the instrumental view). If it were, you would be right: a hated father who provided nothing deserves no mourning, and a friend who saved your life deserves the highest grade.

  But the system operates on **Righteousness (*Yi* 義)**, not Utility (*Li* 利).
  *   **The Instrumental View:** I mourn my father because he cared for me. (Transaction)
  *   **The Confucian View:** I mourn my father because he is the vessel of the lineage and the representative of Heaven in my life. (Cosmological Position)

  When you mourn a hated father, you are not mourning the *man*; you are honoring the *position* of Fatherhood. To neglect the ritual because of personal animus is to privilege your private emotions over the cosmic order (*Dao*). The hardship of mourning a parent you dislike is not a bug; it is a feature. It is an exercise in subordinating the private self to the structural self. It trains you to act rightly even when you do not feel like it.

  ### 2. Reconciling the Chart and the Well (Graded Love)
  You suggest a tension between Mencius's "child in the well" (universal compassion) and the mourning chart (graded duty). This is the classic debate between the Confucians and the Mohists.

  The Mohists argued for *Jian Ai* (Impartial Care/Universal Love). Mencius famously attacked them, calling them "fatherless." Mencius agrees with you that the *capacity* for compassion is universal (the child in the well proves we have the *sprout* of benevolence). However, he argues that the *expression* of that compassion must be graded (*Ai You Cha Deng* 愛有差等 — love with distinctions).

  *   **The Well:** Shows that our moral *sensitivity* is universal. We feel alarm for any child.
  *   **The Chart:** Shows that our moral *obligations* are particular. We bury our own dead first.

  The system presupposes that universal compassion, if untethered from specific relationships, becomes abstract and ineffective. If you owe the same mourning to a stranger as to a father, you dilute the obligation to the father. If you dilute the root, the tree dies. The "child in the well" is a reactive impulse (a sprout); the mourning system is a cultivated practice (the harvest). They are coherent if you view the family as the necessary training ground for engaging with the world. You learn to care for strangers *by* learning to care properly for your kin, not by treating them identically.

  ### 3. Is the Practice Underdetermined?
  Could a disguised consequentialist sign off on this? **No.**

  A consequentialist asks: "What outcome produces the most well-being?"
  The mourning system asks: "What action aligns with the proper order of things?"

  The mourning system often demands outcomes that are strictly *bad* by consequentialist standards. It demands you bankrupt yourself for a distant uncle. It demands you abstain from work for years, reducing economic productivity. It demands you prioritize a biological father over a nurturing adoptive one.

  If the system were instrumental (kin are just the people you can count on), it would allow for flexibility based on actual care provided. But the *Wu Fu* is rigid. It is committed to **Social Harmony (*He* 和)** achieved through **Differentiation (*Bie* 別).**

  A consequentialist could only support this if they believed that rigid adherence to arbitrary-looking rules *always* produces better long-term social stability than case-by-case judgment. While some Confucians might argue this, the *foundation* is not the consequence; the foundation is the belief that the cosmos is ordered hierarchically, and human ritual must mirror that order. A consequentialist sees the ritual as a tool; the Confucian sees the ritual as a manifestation of truth.

  ### 4. What Would Be Lost with Flat Mourning?
  Your suspicion is correct: the graded structure is doing work that flat compassion cannot. If you rebuilt the system on Mencian compassion alone (flat obligations), you would lose three critical things:

  **A. The Anchor of Finite Resources**
  Human emotional and material resources are finite. If you are obligated to mourn everyone equally, you are paralyzed. You cannot give 27 months of deep mourning to everyone without collapsing your life. The grading system is a triage mechanism. It acknowledges that we *cannot* treat everyone equally, so it codifies *who comes first*. It prevents moral burnout by localizing the heaviest duties.

  **B. The Training of Submission**
  As mentioned regarding the hated father, the system is a technology for breaking the ego. Flat mourning based on "who I loved" or "who helped me" reinforces the self's preferences. Mourning based on "who this person *is* in relation to me" forces the self to conform to an external structure. It teaches that you are part of a continuum (ancestors to descendants) that is larger than your personal feelings. Flat mourning makes the individual's feeling the judge; graded mourning makes the Structure the judge.

  **C. Differentiation (*Bie*)**
  Confucianism holds that order arises from knowing the difference between things (father/son, ruler/subject, near/far). Mohist universalism was feared because it erased these distinctions. If you mourn a friend like a father, you blur the line between chosen association and blood lineage. In the classical view, the family is the microcosm of the state. If you cannot maintain the hierarchy within the family (prioritizing parents over friends), you cannot maintain the hierarchy of the state (prioritizing rulers over subjects). Flat mourning threatens the political ontology of the tradition.

  ### 5. Summary: The Nature of the Commitment
  The mourning system presupposes that **morality is a matter of position, not sentiment.**

  *   **Sentiment (*Qing* 情):** This is the "child in the well." It is spontaneous, universal, and unreliable.
  *   **Ritual (*Li* 禮):** This is the mourning chart. It is fixed, particular, and reliable.

  The system does not expect you to *feel* the same grief for a distant uncle as for a father. It expects you to *act* according to the grade. In fact, Confucius argues that if your internal grief exceeds the ritual, it is just as bad as if it falls short. The ritual *contains* the grief.

  So, to answer your final question: The system is not underdetermined. It is a **Role Ethic** that views the self as a node in a network. It rejects the instrumental view (kin as service providers) and the universalist view (flat compassion). It posits that the only way to achieve universal moral health is through particular, graded, and often burdensome obligations that bind us to our specific places in the cosmic order.

  The "inconsistency" you feel is the friction between modern liberal individualism (where duty follows choice and affection) and classical role ethics (where choice and affection must follow duty). The system is committed to the latter. It sacrifices the "justice" of individual cases (the hated father) for the "order" of the whole structure.
