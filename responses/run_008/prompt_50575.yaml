      *   *Mencius Correction:* Ensure I clarify that Mencius explicitly argues *against* Mohist universal love (*Jian Ai*). The user's premise that Mencius implies flat duty is the weak link to correct gently.

  5.  **Final Review against User Prompt:**
      *   *What does it presuppose about duty?* (Constitutive roles).
      *   *Role basic or instrumental?* (Basic/Constitutive).
      *   *Chart + Well coherent?* (Yes, via graded love).
      *   *Underdetermined?* (No, hostile to consequentialism).
