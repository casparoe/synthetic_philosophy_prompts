  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Topic:** The Classical Chinese Mourning System (*Wu Fu* 五服 - Five Degrees of Mourning).
      *   **Core Tension:** The system assigns duties based strictly on kinship roles (structural/positional), regardless of emotional closeness or personal history (e.g., hated father vs. life-saving friend). This seems to conflict with the Mencian idea that morality springs from universal compassion (the child in the well).
      *   **Key Questions:**
          1.  What does the system presuppose about the nature of duty? (Role-based vs. Instrumental/Consequentialist).
          2.  Can the kinship chart and the "child in the well" story be held together coherently? (Feeling vs. Ritual).
          3.  Is the practice committed to a single theory, or is it underdetermined (compatible with multiple ethical frameworks)?
          4.  What would be lost if the system were rebuilt on flat Mencian compassion (equal mourning for all)?
          5.  Hypothesis: The graded structure does something specific (like training) that universal compassion cannot.

  2.  **Initial Analysis & Philosophical Context:**

      *   *The System:* The *Wu Fu* system is indeed rigid. It's about *Li* (Ritual/Propriety). It codifies social structure.
      *   *The Conflict:* Role Ethics (Confucian) vs. Universalist Ethics (Mohist, or a certain reading of Mencius).
      *   *Mencius:* He *does* argue for graded love (*ai you cha deng* 愛有差等). The child in the well shows the *sprout* of benevolence (*Ren*), but cultivation requires extending it outward from the family. It's not flat universalism.
      *   *Confucius on Mourning:* The "three years" argument is about reciprocity (*Bao* 報), but also about cultivating the right internal state through external form.
      *   *The "Hated Father" Problem:* This is the crux. Confucianism prioritizes the *role* over the *transactional history*. Why? Because the role sustains the cosmic/social order.
      *   *The "Broke Uncle" Problem:* Ritual often demands sacrifice beyond means (though Confucius does say "match the ritual to your means" in some contexts, the *obligation* remains).

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. Validate the tension. State the thesis: The system isn't underdetermined; it's committed to a specific metaphysics of the self and social order where roles are constitutive, not instrumental.

      *   **1. What is a Duty? (Role Ontology vs. Instrumentalism):**
          *   Address the "Role vs. Instrument" question.
          *   Confucianism is fundamentally Role Ethics. The role *creates* the self. You aren't an individual who *happens* to be a son; you are a son who is becoming a person.
          *   Instrumentalism (kin are just reliable helpers) fails because it makes duty contingent on performance. If the father is bad, the instrumental view says duty drops. The Confucian view says duty remains because the *position* (Heaven/Earth) remains.
          *   *Key Concept:* *Yi* (Righteousness) vs. *Li* (Profit/Utility).

      *   **2. Reconciling the Chart and the Well (Graded Love):**
          *   Correct the user's reading of Mencius slightly. Mencius *agrees* with graded love. The child in the well proves we have *potential* for morality, not that all duties are equal.
          *   The "Sprout" (*Duan*) needs cultivation. It starts at home.
          *   Distinction: *Ren* (Benevolence/Feeling) vs. *Li* (Ritual/Duty). You might feel more for the friend, but the *ritual duty* is to the father. The ritual trains the feeling, not just expresses it.
          *   Coherence: They are coherent if you see the family as the training ground for the state/universe.

      *   **3. Is it Underdetermined? (Can a Consequentialist sign on?):**
          *   Short answer: No, not really.
          *   A consequentialist wants max utility. The mourning system often destroys utility (bankruptcy, long absence from work).
          *   A role ethicist sees the ritual as constitutive of order.
          *   However, there is a "soft" consequentialism: Social stability *is* the consequence. But it's rule-consequentialism at best, rooted in non-consequentialist premises.
          *   Better to say: It's committed to *Harmony* (*He*), which is a state of being, not just an outcome.

      *   **4. What is Lost with Flat Mourning? (The Function of Grading):**
          *   This addresses the user's suspicion about "training."
          *   *Differentiation (*Bie* 別):* Confucianism loves distinction. Flat mourning erases distinction.
          *   *Anchoring:* If you mourn everyone equally, you mourn no one deeply. Resources (emotional and material) are finite.
          *   *The "Root" Argument:* The family is the root. If you neglect the root to water the leaves (strangers), the tree dies.
          *   *Self-Cultivation:* The hardship of mourning a hated parent is *the point*. It breaks the ego. It forces you to submit to something larger than your personal feelings.

