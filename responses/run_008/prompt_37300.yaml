  # JOINT STATEMENT ON AESTHETIC TESTIMONY AND CRITICAL PRACTICE

  **Drafted for the consideration of the Poet and the Literary Editor**
  **Chairperson: The Novelist**

  ### I. AGREED CLAIMS

  1.  **The Value of Art:** We agree that literary works possess aesthetic properties (such as being moving, subtle, or good) that are distinct from their mere physical existence or historical impact.
  2.  **The Utility of Criticism:** We agree that critical reviews, prize juries, and literary recommendations serve a vital social function in guiding readers toward works they are likely to value and in sustaining a culture of discourse around art.
  3.  **The Variability of Critics:** We agree that critics vary in competence, honesty, and alignment with individual readers' tastes. A verdict from a critic whose past judgments have aligned with one's own carries more weight than a verdict from a stranger.
  4.  **The Primacy of Reading:** We agree that, all else being equal, direct engagement with a text is superior to indirect reportage. Neither party advocates for avoiding reading in favour of solely reading reviews.
  5.  **The Transmission of Fact:** We agree that testimony successfully transmits *non-aesthetic* facts about a book (e.g., its plot summary, its publication date, its length, and the fact that a critic enjoyed it).
  6.  **The Norm of Action:** We agree that it is rational to act on critical testimony (e.g., to buy or read a book) based on a reviewer's recommendation, even if we disagree on the epistemic status of the belief formed thereby.

  ### II. POINTS OF DIVERGENCE

  | Issue | The Poet's Position (Pessimism) | The Editor's Position (Optimism) |
  | :--- | :--- | :--- |
  | **Epistemic Transmission** | Testimony regarding aesthetic value transmits knowledge only of the *reviewer's state of mind* (i.e., that they liked it), not of the *book's properties*. | Testimony regarding aesthetic value can transmit knowledge of the *book's properties* directly, provided the source is reliable. |
  | **The Acquaintance Principle** | Aesthetic judgement is *constitutively* dependent on first-hand experience. One cannot judge what one has not experienced; therefore, one cannot know a judgement is true without that experience. | Aesthetic judgement is *contingently* aided by experience. Expert testimony can substitute for direct experience in forming a justified belief, just as in science or history. |
  | **Norm of Assertion** | It is improper to assert "This book is good" based solely on testimony. One may only assert "This book was judged good by X." | It is proper to assert "This book is good" based on trusted testimony. To hedge every claim would render critical discourse unintelligible. |
  | **Planning Reading** | One cannot know a book's merits before reading it; one can only hope. The "planning" is based on desire, not knowledge. | One can know a book's merits before reading it via testimony; this knowledge is what makes planning rational rather than hopeful. |

  ### III. CRUXES AND PREDICTIVE CASES

  We identify two underlying philosophical cruxes that drive the disagreements above. To test these, we apply our respective positions to two concrete cases devised by the Novelist.

  #### Crux 1: Knowledge vs. Justified Belief
  **The Question:** Is the Poet's objection merely about the strict definition of "knowledge" (requiring infallibility or direct contact), or does she deny that testimony can even provide *justified belief* regarding aesthetic value?
  **The Stakes:** If the Poet admits testimony provides *justified belief* but denies the label *knowledge*, the dispute is partially verbal. If she denies justification itself, the dispute is substantive.

  #### Crux 2: Acquaintance and Response-Dependence
  **The Question:** Is acquaintance with a work a state that testimony could in principle supply (as with ordinary perceptual facts, e.g., "there is a red apple"), or is aesthetic value essentially *response-dependent* (requiring the subject's own emotional/cognitive reaction)?
  **The Stakes:** If aesthetic value is like "redness," testimony can report it. If it is like "pain" or "funny," testimony cannot report it, only the reaction to it.

  #### Test Cases and Predictions

  | Case Description | The Poet's Prediction | The Editor's Prediction |
  | :--- | :--- | :--- |
  | **Case A: The Encyclopaedia Novelist**<br>A novelist's works are destroyed in a catastrophe. Only an encyclopaedia summary survives, along with the historical record that generations of critics deemed them masterpieces. No living person has read a word. | **Verdict:** No living person *knows* the books are good.<br>**Reasoning:** The chain of aesthetic acquaintance is broken. The verdict is now a historical fact about *past readers*, not an aesthetic fact about the *works*. The value is extinct because the capacity for experience is extinct. | **Verdict:** We *know* the books are good.<br>**Reasoning:** Aesthetic knowledge is cultural and cumulative. The reliable testimony of the past creates a standing warrant. The summary preserves the *grounds* for the judgment, allowing knowledge to persist without direct access. |
  | **Case B: The Mediocre Translation**<br>The Editor champions a foreign masterpiece he has read only in a translation he admits is "mediocre" (clunky prose, lost rhythm). He claims to know it is a masterpiece. The Poet has read the original. | **Verdict:** The Editor does not know the work is a masterpiece.<br>**Reasoning:** He is acquainted with a *shadow* of the work, not the work itself. Aesthetic value resides in the specific execution (diction, rhythm). Testimony (translation) failed to transmit the requisite experience. | **Verdict:** The Editor knows the work is a masterpiece.<br>**Reasoning:** Translation is a form of mediated testimony that preserves core aesthetic properties (theme, structure, character). Imperfect transmission does not negate knowledge, provided the core merit survives the distortion. |

  ### IV. ANALYSIS OF VERBAL DISPUTE

  We conclude that a portion of this quarrel is **merely verbal**, specifically concerning the threshold for the word "know," though a substantive disagreement remains regarding the *norms of assertion*.

  1.  **The Verbal Component:** If the Editor were to rephrase his claim as "I hold a highly justified belief that approximates knowledge," and the Poet were to rephrase hers as "You hold a justified belief but lack the specific warrant required for aesthetic knowledge," they would agree on the *state of the mind* involved. The Poet reserves "knowledge" for a state grounded in personal experience; the Editor uses "knowledge" for a state grounded in reliable social warrant. This is a terminological boundary dispute.
  2.  **The Substantive Component:** The disagreement remains substantive regarding **action and assertion**. The Poet maintains that asserting "This is good" without reading it is a kind of dishonesty (misrepresenting the source of one's conviction). The Editor maintains that withholding that assertion is a dereliction of critical duty (failing to share useful truth). Thus, even if they agree on the epistemic state, they disagree on the *ethics* of how that state is communicated.

  **Recommendation:** Both parties should prefix aesthetic claims derived from testimony with a marker of their source (e.g., "By all accounts, this is..." vs. "This is..."). This satisfies the Poet's demand for honesty regarding acquaintance and the Editor's demand for the transmission of value.
