  8.  **Final Polish:** Ensure the distinction between the "No Subject" and "No Time" arguments is sharp, as this is often where the Epicurean confusion lies. (The "No Subject" claim is often just a clumsy way of stating the "No Time" claim). Make sure to mention Nagel and Feit as relevant literature context.

