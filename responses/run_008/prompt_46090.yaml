          *   Conclusion: Identify which reading is needed for the dismissal to work and what auxiliary claims/commitments that entails (posthumous harm, well-being beyond experience).
      *   **Tone:** Professional, precise, philosophically rigorous, suitable for a PhD level.

  2.  **Deconstruct the Epicurean Slogan:**
      *   "Death is nothing to us."
      *   "Where death is, we are not."
      *   Core intuition: Harm requires a subject experiencing it at the time it occurs.
      *   Target: The Deprivation Account (Nagel, etc.), which says death is bad because it deprives one of possible future goods.

  3.  **Drafting the Theses (Ordering & Evaluation):**

      *   *Thesis 1: The Phenomenological Claim (Analytic).*
          *   Content: The dead do not experience anything.
          *   Status: True by stipulation/definition (of biological death).
          *   Impact on Deprivation Account: Irrelevant. Deprivation account doesn't require experiencing the harm *as* harm. It's a comparative counterfactual claim.
          *   Verdict: Refuses to engage.

      *   *Thesis 2: The Subject Existence Claim (Metaphysical).*
          *   Content: There is no subject *at the time of death* to be harmed.
          *   Status: Substantive but defensible (depends on theory of persons).
          *   Impact: Challenges the *timing* of the harm, but not necessarily the *fact* of harm. Deprivationists argue the subject exists *before* death and is the one harmed by the cessation.
          *   Verdict: Doesn't defeat deprivation, just shifts the burden to timing.

      *   *Thesis 3: The Timing Claim (The "No Time" Problem).*
          *   Content: There is no time *t* such that the person is worse off at *t* due to death.
          *   Status: Substantive and controversial (Feit, Bradley, etc. have responses).
          *   Impact: This is the strongest technical objection. If harm requires a time, and death offers none, deprivation fails.
          *   Verdict: Potentially defeats, but requires a specific theory of harm's temporality.

      *   *Thesis 4: The Symmetry Argument (Lucretius).*
          *   Content: Past nonexistence isn't bad, so future nonexistence shouldn't be.
          *   Status: Substantive but widely considered false/intuitively weak (asymmetry of desire).
          *   Impact: Attacks the intuition behind deprivation, not the logic.
          *   Verdict: Weak support for dismissal.

      *   *Thesis 5: The Experientialist Premise (Normative).*
          *   Content: Only experienced states affect well-being.
          *   Status: Substantive and false (in the context of modern well-being theory, e.g., desire satisfaction, objective list).
          *   Impact: If true, deprivation account (which is often desire-based or objective goods-based) collapses.
          *   Verdict: This is the real engine. But it's a huge commitment.

  4.  **Identifying Ambiguities/Slides:**
      *   The slogan slides from "We don't experience death" (T1) to "There is no subject" (T2) to "There is no time for harm" (T3).
      *   Crucial slide: From "No experience" to "No harm." This assumes Experientialism (T5) without stating it.

  5.  **Conclusion/Commitments:**
