              3.  No time claim (no time at which death is bad).
              4.  Symmetry argument (future vs. past nonexistence).
              5.  Strong normative premise (Experientialism/Hedonism).
          *   Evaluation for each: True by stipulation? Substantive but defensible? Substantive and false?
          *   Crucial Check: Does it actually *defeat* the deprivation account or just *refuse to engage*?
