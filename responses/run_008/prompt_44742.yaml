answer: |-
  **Title:** Standing for the Demos: Dissolving the Boundary Problem through Procedural Membership

  **Research Question**
  The central question of this dissertation is: *Can a model of demos membership modeled on legal standing dissolve the logical regress inherent in democratic boundary drawing, or does it merely relocate the justificatory burden?* Traditional democratic theory struggles with the "boundary problem": before a collective can decide democratically, it must decide who constitutes the collective. Skeptics argue this generates an infinite regress, as the prior decision regarding membership itself requires a democratic boundary. This project investigates whether distinguishing between *ontological membership* in a polity and *procedural standing* to trigger or contest specific decisions resolves this circularity. By treating membership as conferred decision-by-decision under impersonally justified rules, rather than as a fixed status determined by substantive principles like all-affected interests, I aim to determine if the regress is a genuine logical barrier or a category error.

  **Background and Significance**
  The boundary problem remains the most persistent theoretical vulnerability in democratic legitimacy. Dominant substantive principles, such as the All-Affected Interests (AAI) principle and the All-Subjected to Coercion (ASC) principle, attempt to define the *demos* based on the consequences or nature of the decision. However, these principles face the "regress objection," most notably articulated by Whelan and refined by Abizadeh. The objection holds that applying any boundary principle presupposes a competent agent to apply it. If that agent is a *demos*, it must already be bounded; if it is not, the boundary is imposed undemocratically.

  Consequently, a skeptical view has gained traction: boundary-drawing is unavoidably arbitrary or circular, implying that democracy cannot be fully self-grounding. Existing responses typically attempt to refine the substantive criteria (e.g., narrowing what counts as an "interest" or "coercion"). This dissertation argues that these attempts miss the structural nature of the objection. They conflate two distinct questions: (1) who is a permanent member of the decision-making body, and (2) on which occasions that body is competent to decide. In administrative and constitutional law, the doctrine of *standing* answers the second question without requiring a prior adjudication of the first for every claimant. One need not be a "member" of the court to have standing to sue; one must merely satisfy impersonal procedural rules.

  This project posits that importing a standing model into democratic theory offers a novel path forward. If membership is fluid and contingent upon satisfying rules for specific decisions, the requirement for a pre-political *demos* to draw the boundary may vanish. However, this hypothesis is untested in political philosophy. It risks either dissolving the regress or simply pushing the problem back to the justification of the standing rules themselves.

  **Methodology and Chapter Outline**
  The dissertation will employ a method of conceptual analysis and institutional analogy. It will not propose a new substantive principle of inclusion but will analyze the logical structure of boundary-drawing mechanisms.

  *Chapter 1: The Genealogy of the Regress.*
  This chapter will reconstruct the boundary problem, focusing on the logical structure of the regress objection against AAI and ASC. It will categorize existing responses, distinguishing between those that accept circularity as benign and those that seek external grounding. The goal is to isolate the precise premise that generates the regress: the assumption that boundary-drawing is itself a democratic decision requiring a prior *demos*.

  *Chapter 2: The Standing Analogy.*
  Here, I will explicate the legal doctrine of standing and its political equivalents. The analysis will distinguish between *status-based membership* (citizenship) and *issue-based standing* (eligibility to participate in a specific decision). I will examine historical and contemporary instances where political participation is granted based on functional criteria rather than fixed identity, such as stakeholder governance in corporations or transnational regulatory networks. This chapter establishes the viability of the model before testing its normative implications.

  *Chapter 3: Dissolution vs. Relocation.*
  This is the core analytical chapter. I will develop criteria to distinguish between a genuine dissolution of the regress and a mere relocation. A *dissolution* occurs if the standing rules can be justified without presupposing a bounded *demos* (e.g., through moral necessity or functional logic). A *relocation* occurs if the justification of the standing rules themselves requires a prior democratic decision. I will apply a "priority test": does the validity of the standing rule depend on the authorization of the very group it constitutes? If the rules are self-validating or pre-political, the regress dissolves. If the rules require a legislator, the regress relocates to the question of who legislated the standing rules.

  *Chapter 4: The Problem of Impersonal Justification.*
  This chapter addresses the normative cost of the standing model. For the regress to dissolve, the rules conferring standing must be justified impersonally, without reference to the will of the *demos*. I will investigate whether such justification is available. Can we justify standing rules through pure procedural justice or epistemic grounds without smuggling in a substantive boundary principle? If impersonal justification is unavailable, the model collapses into the very circularity it seeks to avoid.

  *Chapter 5: Implications for Democratic Legitimacy.*
  The final chapter synthesizes the findings. If the standing model succeeds, it suggests democracy is not a state of being but a sequence of validated events. I will explore how this shifts the locus of legitimacy from the *composition* of the people to the *process* of boundary negotiation.

  **Success and Failure Conditions**
  A successful result will demonstrate that the regress objection relies on a category mistake regarding the nature of membership. Specifically, success requires showing that standing rules can be validated through non-democratic but non-arbitrary means (e.g., rational necessity or moral right) that do not trigger the demand for further democratic authorization.

  Failure will take one of two specific forms. First, the standing model may prove to be a **notational variant of the coercion principle**. If the criteria for granting standing inevitably track coercion or affectedness, the model adds no analytical value and inherits the same regress objections as ASC. Second, failure occurs if **impersonal justification is unavailable**. If justifying the rules for standing requires a prior agent with the authority to set those rules, the regress is merely relocated. In this scenario, the dissertation would conclude that the boundary problem is insoluble, and the standing model simply obscures the foundational authoritarianism required to start the democratic process.

  **Risk Assessment and Scope**
  The primary risk of scope bloat lies in Chapter 2 and Chapter 4. In Chapter 2, there is a temptation to engage in deep comparative legal analysis of standing doctrines across jurisdictions. This must be resisted; the legal theory is illustrative, not the object of study. The focus must remain on the political theoretical implications of the analogy.

  In Chapter 4, the inquiry into "impersonal justification" risks expanding into a general theory of political legitimacy. To maintain scope, I will restrict the analysis to justifications specifically capable of grounding boundary rules, excluding broader questions of distributive justice or human rights unless they directly bear on the authority to set standing. Finally, there is a risk of empirical drift. While case studies of transnational governance are useful, this is a theoretical dissertation. Empirical examples will be used heuristically to test logical coherence, not to provide sociological validation. By adhering strictly to the logical test of dissolution versus relocation, the project remains within the bounds of a doctoral dissertation while addressing a foundational problem in democratic theory.
