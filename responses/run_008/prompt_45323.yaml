answer: |-
  **Final Exam: Decision Theory and Formal Epistemology**
  **Question 4: The Value of Information**

  **(a)** State I.J. Good's theorem on the value of free information precisely for a decision problem with two available acts ($A_1, A_2$) and finitely many states ($S_1, \dots, S_n$). Provide a proof sketch demonstrating that the expected utility of observing a signal is at least that of acting immediately. In your proof, explicitly list the four critical premises regarding: (1) the domain of the utility function, (2) the belief updating rule, (3) the temporal perspective of evaluation, and (4) the nature of the environment (strategic vs. non-strategic).

  **(b)** Consider the following three scenarios where an agent appears to benefit from *ignoring* free information:
  1.  **The Painful Test:** A patient can take a free diagnostic test. The result provides no instrumental benefit for treatment choices (the optimal act is the same regardless), but the psychological distress of knowing the result lowers the utility of every subsequent outcome by a fixed amount $k > 0$.
  2.  **The Duopoly:** A firm can commission a free, perfectly informative market study. However, a rival firm will observe the findings. Both firms currently profit from uncertainty; revealing the state of demand triggers a price war that destroys profits for both.
  3.  **The Imprecise Bayesian:** An agent's credences are represented by a set of priors $\mathcal{P}$. They choose acts using the Maximin rule (maximize minimum expected utility over $\mathcal{P}$). Upon observing a signal, they update $\mathcal{P}$ by conditioning each member. There are cases where the maximum minimum EU before observation is strictly higher than the expected maximum minimum EU after observation.

  For each scenario, identify which premise from part (a) it targets. Determine whether the case dissolves upon careful re-modeling within the standard framework or marks a genuine limitation requiring a revision of the theorem's scope. State the correct formulation of the value of information claim once the case is handled properly.

  **(c)** Conclude by discussing the popular slogan that "a Bayesian should always accept free information." Explain how Good's theorem supports an *ex ante* claim but fails to license an *ex post* claim about the agent's welfare under every realization of the signal.

  ***

  ### Model Answer

  **(a) Theorem and Proof**
  Good's theorem states that for a rational agent, the expected utility of the option to observe a free signal $E$ and then act is at least as great as the expected utility of acting immediately.
  *Premises:* (1) Utility $U$ is defined over act–state pairs (consequences); (2) Beliefs update via Strict Conditionalization on the signal; (3) Strategies are evaluated by Ex Ante Expected Utility; (4) The environment is Single-Agent/Non-Strategic (states are fixed by nature).
  *Proof:* Let $a^*$ be the optimal act given prior $P$. $EU(a^*) = \sum P(s)U(a^*, s)$. If signal $e$ is observed, the agent chooses $a_e$ maximizing $EU(\cdot|e)$. By definition, $EU(a_e|e) \ge EU(a^*|e)$ for any $e$. Taking the ex ante expectation over signals: $\sum P(e)EU(a_e|e) \ge \sum P(e)EU(a^*|e)$. By the law of total expectation, the RHS equals $EU(a^*)$. Thus, informed action $\ge$ uninformed action.

  **(b) Counterexamples Analysis**
  1.  **Painful Test:** This targets Premise (1). The utility function was defined over act–state pairs, omitting the state of *knowledge*. If we re-model outcomes to include "knowing the result" as part of the consequence, the utility loss $k$ is internalized. The case **dissolves**; the information is not cost-free in utility terms. The theorem holds if "free" means zero utility cost.
  2.  **Duopoly:** This targets Premise (4). The environment is strategic; the "state" includes the rival's move, which depends on their observation of the signal. This is a **genuine limitation** of the single-agent theorem. In game theory, information can have negative value (e.g., in coordination games or bargaining). The correct formulation restricts Good's theorem to decision problems, not games.
  3.  **Imprecise Bayesian:** This targets Premise (1) and (2) implicitly, specifically the assumption of a single prior and standard EU maximization. Under Maximin with sets of priors, dynamic inconsistency can arise, and information can have negative value. This is a **genuine limitation** of the standard Bayesian framework. There is no consensus on the correct formulation; some argue for alternative updating rules (e.g., maximum likelihood updates) to restore positive value, while others accept negative value as a feature of ambiguity aversion.

  **(c) Ex Ante vs. Ex Post**
  The slogan overshoots because Good's theorem is an *ex ante* result: it guarantees higher *expected* utility before the signal is received. It does not guarantee the agent is better off *ex post* (after the signal). An agent may receive "bad news" that forces them into a lower-utility act than they would have chosen in ignorance, even though avoiding the news was not rational beforehand. The theorem licenses accepting information as a policy, not as a guarantee of satisfaction with every specific outcome.

  ***

  ### Marking Scheme (20 Marks)

  **1. Precise Premises and Proof Logic (4 marks)**
  *   **Full Marks:** Correctly identifies all four premises (Utility domain, Conditionalization, Ex Ante evaluation, Non-strategic) and shows the inequality step ($EU(a_e|e) \ge EU(a^*|e)$).
  *   **Typical Loss:** Students omit the "non-strategic" premise or fail to distinguish ex ante evaluation from ex post realization in the proof setup.

  **2. Diagnosis of the Painful Test (4 marks)**
  *   **Full Marks:** Identifies this as a modeling error (Premise 1 violation) that dissolves upon including "knowledge" in the outcome description.
  *   **Typical Loss:** Students treat this as a genuine counterexample to the math, rather than a violation of the "free information" utility condition.

  **3. Diagnosis of Duopoly and Imprecise Priors (4 marks)**
  *   **Full Marks:** Identifies both as genuine limitations (Strategic environment / Non-standard probability). Notes that the theorem does not apply without revision.
  *   **Typical Loss:** Students claim the theorem is "false" generally, rather than noting the scope conditions are violated.

  **4. Distinction Between Dissolving vs. Limitation (4 marks)**
  *   **Full Marks:** Clearly distinguishes Case 1 (fixable by re-description) from Cases 2 & 3 (require changing the theoretical framework).
  *   **Typical Loss:** (B-grade trait) Treats all three cases as equivalent "exceptions" without distinguishing modeling errors from structural boundaries.

  **5. Ex Ante vs. Ex Post Distinction (4 marks)**
  *   **Full Marks:** Explains that the theorem justifies the *policy* of gathering info, not the *outcome* of every specific signal.
  *   **Typical Loss:** Students claim the agent is guaranteed to be happier after receiving the information.

  **Grade Differentiation Note:**
  *   **A Answer:** Correctly categorizes Case 1 as a modeling fix and Cases 2/3 as structural boundaries. Maintains the distinction between settled math (Part a) and contested extensions (Part b).
  *   **B Answer:** Recites the theorem correctly but treats all counterexamples as "problems" for the theorem without distinguishing between mis-specification and genuine theoretical limits.
