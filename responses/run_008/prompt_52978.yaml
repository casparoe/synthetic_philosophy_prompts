          3.  Task: Provide a reading that takes film and philosophy seriously, identify where it cheats, advise on whether consequentialists should claim it, and offer the strongest objection to the framing.
          4.  Goal: Articulate what the film shows about cluelessness "from the inside" (phenomenology) that formal arguments miss.

  2.  **Deconstruct the Philosophical Problem (Cluelessness):**
      *   *The Problem:* Agents can't know long-term/remote consequences. Remote consequences might swamp local ones. Therefore, we can't know if an action is right/wrong (objective consequentialism) or what we ought to do (subjective consequentialism).
      *   *Lenman's Argument:* We are clueless about the sign of the value of our actions.
      *   *The Film's Intervention:* Clarence provides a "God's-eye view" of a specific counterfactual ($World_{with George}$ vs. $World_{without George}$).

  3.  **Analyze the Film (*It's a Wonderful Life*):**
      *   *Plot:* George Bailey feels useless/failure. Contemplates suicide. Clarence (AS2) shows him Pottersville (world without him). George sees the negative impact of his absence. George wants to live again. Community saves him financially.
      *   *Key Scene:* The tour of Pottersville.
      *   *Key Resolution:* The community pooling money.

  4.  **Address Question 1: Cure vs. Shrink Cluelessness:**
      *   *Observation:* Clarence only shows specific, emotionally resonant nodes (Harry, Martini, Ernie, Mary, Uncle Billy). He doesn't show the macroeconomic impact of the Building & Loan over 50 years, or the descendants of the saved soldiers.
      *   *Philosophical Implication:* This supports the "Cluelessness is ineliminable" view. Even an angel limits the data. Why? Because infinite data is unintelligible.
      *   *Nuance:* It's not just "finite mind." It's about *salience*. Consequentialism requires *total* value, but moral psychology requires *narrative* value. The film admits that to make sense of value, we must truncate the causal chain.
      *   *Verdict:* It shrinks it, but acknowledges that *total* knowledge is dramatically and cognitively impossible.

  5.  **Address Question 2: Vindication of Consequentialism?**
      *   *Observation:* George is happy because he sees he *did* good (consequentialist). But he is saved by *friendship* (deontological/virtue ethics).
      *   *Tension:* Objective Consequentialism says George's life was good *regardless* of his knowledge. The film agrees. But the *motivation* to live isn "maximize utility," it's "you are loved/needed."
      *   *Agent-Relative:* The value isn't just "total happiness in Bedford Falls." It's "George's specific relationships." A pure consequentialist might say, "If Potter made more people happy overall, George should have let him win." The film rejects this.
      *   *Verdict:* The film uses consequentialist *evidence* to support a non-consequentialist *conclusion* (the intrinsic value of the individual and community bonds).

  6.  **Develop the Strongest Objection (The "Moral Hallucination" Critique):**
      *   *Idea:* Pottersville isn't a rigorous counterfactual. It's a projection of George's anxieties.
      *   *Detail:* Would Harry *really* have died? Would Potter *really* have turned the whole town into a sin den just because George wasn't there? This is a "butterfly effect" manipulation.
      *   *Philosophical Weight:* If the counterfactual is rigged to make George feel better, it's therapeutic, not epistemic. It addresses *despair*, not *cluelessness*. It solves the psychological problem of meaning, not the ethical problem of knowledge.

  7.  **Address the "From the Inside" (Phenomenology) Aspect:**
      *   *Formal Argument:* Cluelessness is abstract (probability distributions, infinite chains).
      *   *Film's Contribution:* Cluelessness feels like *despair*. It feels like being small. The "cure" feels like *recognition*.
      *   *Insight:* The epistemic problem is actually an existential problem. We need to *see* our impact to feel justified in existing. Consequentialism demands we act without seeing. The film says we *must* see to endure.

