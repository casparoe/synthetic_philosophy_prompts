  You know the drawer holds only one **spoon**.
  Silence pressing like a concrete **wall**.

  No escape through the brick and mortar **wall**.
  The same cold morning, lacking any **fire**.
  You clean the grease again from off the **spoon**.
  The sun burns patches on the pale **skin**.
  You carry it, the infinite **weight**.
  You stand again to board the late **bus**.

  Do you scream to halt the turning **bus**?
  Or kiss the stone of this enclosing **wall**?
  Is there joy hidden inside the **weight**?
  Or only ash remaining from the **fire**?
  Does love arise to warm the trembling **skin**?
  Or do you break the handle of the **spoon**?

  Will you curse the **bus** or bless the **spoon**?
  Beat on the **wall** or trust this worn **skin**?
  Crushed by the **weight**, or walking through the **fire**?
