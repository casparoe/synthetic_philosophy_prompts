answer: |-
  You have hit on three of the most substantial objections to the Doomsday Argument (DA) that have been debated by philosophers and cosmologists for the last 30 years. Your intuition is sharp, but there is a specific technical misunderstanding about how the DA treats time versus rank that needs clearing up first. Once we fix that, your objections about population curves and reference classes become even more powerful.

  Here is the breakdown of why the math works the way it does, why the UN population data doesn't necessarily "solve" it the way you hope, and why your friend's objection is actually deeper than it feels.

  ### 1. The "Uniform Time" Misunderstanding
  You wrote: *"doesn't treating yourself as a random sample of humanity presuppose that humans are spread out roughly evenly across our whole run as a species?"*

  **This is the most common misconception about the DA.** The argument does **not** assume humans are spread evenly across *calendar time*. It assumes you are a random sample across *birth rank*.

  Here is the distinction:
  *   **Calendar Time:** 1800, 1900, 2000, 3000...
  *   **Birth Rank:** Human #1, Human #100 billion, Human #100 trillion...

  The DA relies on the Copernican Principle: *You should not assume you are special.* Therefore, your birth rank ($n$) should be treated as a random fraction of the total number of humans who will ever exist ($N$). Mathematically, your fractional position $f = n/N$ is assumed to be uniformly distributed between 0 and 1.

  **Why this matters for your objection:**
  If the future holds 500 trillion humans (space colonies), the vast majority of humans will be born in the future. If you pick a random human from that total set, they will likely be a space colonist.
  If you find that you are *not* a space colonist, but rather Human #110 billion (roughly where we are now), the DA says: "It is unlikely you would be this 'early' in the list if the list were going to be 500 trillion long."

  The DA is actually *compatible* with lopsided population curves. In fact, it thrives on them. If population grows exponentially, the "doom" conclusion becomes stronger, because being born in the "early" phase becomes statistically more improbable if the "late" phase is massive.

  ### 2. Plugging in the UN Population Curve
  You asked if anyone has redone the math using realistic demographic projections (peak ~10 billion, then decline).

  **Yes, this has been done, and it leads to a fascinating tension.**

  The Doomsday Argument does not predict *when* we go extinct; it predicts the *total number of humans* ($N$).
  *   **Current $n$:** ~117 billion humans have ever been born.
  *   **DA Prediction:** With 95% confidence, $N$ is less than $20 \times n$ (roughly 2.3 trillion total humans).

  Now, look at the UN data. If population peaks at 10 billion and then declines due to resource constraints, climate change, or demographic transition, we can integrate that curve to see how many humans will be born before extinction.
  *   **Scenario A (Optimistic/Space):** We colonize the galaxy. $N$ could easily reach quadrillions. The DA says this is highly improbable (you would likely be one of those quadrillions, not one of the first 100 billion).
  *   **Scenario B (UN Decline/Extinction):** Population crashes in 2100 and trickles to zero by 3000. The total integral of humans might be only 200 billion more. Total $N \approx 300$ billion.

  **The Verdict:** The UN population curve actually **supports** the Doomsday Argument's conclusion, rather than refuting it.
  The DA is usually wielded to argue *against* long-term space colonization scenarios. If the UN data suggests a population collapse, that aligns perfectly with the DA's prediction that $N$ is not astronomically large.

  The only way the UN data refutes the DA is if you treat the UN projections as **certain priors**. If you say, "I know for a fact there will be 10 trillion more humans," then Bayes' theorem forces you to reject the assumption that you are a random observer (i.e., you must conclude you are "special" or early). But if you treat the UN data as just one possible hypothesis among many, the DA still acts as a Bayesian penalty against the "huge future population" hypotheses.

  ### 3. The Reference Class Problem (Your Friend's Objection)
  Your friend suggests restricting the reference class to "people who can understand the argument." You feel this is "too easy." You are right to feel that way, but philosophers (like Nick Bostrom) take this very seriously. It is called the **Reference Class Problem**.

  **Why it feels "too easy":**
  It smells like special pleading. If I can define the class as "People named Alex born in 1990," my birth rank is 1 out of 1. Doom is averted! It makes the argument unfalsifiable.

  **Why it's actually a deep philosophical problem:**
  The DA requires you to define what counts as an "observer."
  *   **Too Broad:** Do we include Neanderthals? Chimpanzees? Future AI? Aliens? If we include AI, and there will be quadrillions of AI minds, your rank as a biological human is incredibly early. Doom (for biological humans) looks certain.
  *   **Too Narrow:** "People who understand Bayesian statistics." If the future consists of super-intelligent post-humans who don't "think" like us, do they count? If they don't count, then the total $N$ of "people like us" might actually be small, even if the species survives.

  **The "Gotcha" for your friend:**
  If you restrict the class to "people who understand the DA," you have to ask: **Will people in the future understand the DA?**
  If humanity survives and education improves, surely more people will understand it. If the class expands in the future, your rank is still low relative to the future total.
  To make the argument go away using this method, you have to argue that *no one in the future will ever be capable of understanding this argument.* That implies a collapse of intelligence or civilization, which is... a form of Doomsday anyway.

  ### 4. The Real Counter-Argument: The Self-Indication Assumption (SIA)
  If you want the mathematical "kill shot" to the Doomsday Argument, it isn't the population curve or the reference class. It's the **Self-Indication Assumption**.

  The DA relies on the **Self-Sampling Assumption (SSA)**: "I should reason as if I am a random observer from the set of all observers."
  The SIA counters: "I should reason as if I am a random observer from the set of all *possible* observers, weighted by the probability that I exist."

  **How SIA defeats DA:**
  *   **DA (SSA):** A universe with 1 trillion humans makes it unlikely I am #110 billion. (Penalizes large $N$).
  *   **SIA:** A universe with 1 trillion humans makes it 10,000 times more likely that *I exist at all* compared to a universe with 100 million humans. (Rewards large $N$).

  Under SIA, the fact that you exist at all is evidence that the total number of observers is large. This mathematically cancels out the Doomsday Argument's likelihood ratio. Most modern anthropic reasoning leans toward SIA or a hybrid, which is why many physicists and philosophers consider the "hard" Doomsday Argument to be refuted, or at least neutralized.

  ### Summary
  1.  **Your Time vs. Rank intuition:** The DA doesn't assume uniform time, it assumes uniform rank. This makes it robust against population growth/decline curves.
  2.  **UN Data:** Realistic population decline actually *agrees* with the DA (which predicts a limited total $N$). The DA is primarily an argument against *colonization*, not immediate extinction.
  3.  **Your Friend's Objection:** It is a valid philosophical objection (Reference Class), but narrowing the class too much often implies the future contains no minds "like us," which is its own form of doom.
  4.  **The Real Fix:** The argument is generally considered neutralized not by demographic data, but by the **Self-Indication Assumption**, which flips the probability weight back in favor of a large future.

  You were right to be skeptical. The math is Bayes, but the "setup" (the choice of prior and reference class) is where the entire argument lives or dies. Most experts agree the setup is too fragile to sustain the catastrophic conclusions Carter and Leslie originally suggested.
