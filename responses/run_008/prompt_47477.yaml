answer: |-
  ### 1. The Specification: Requirements for a Justificatory CJT

  To move from a mathematical curiosity to a normative justification for majority rule, the Condorcet Jury Theorem (CJT) must satisfy the following conditions. I have distinguished between **Mathematical Necessities** (the theorem fails without them) and **Justificatory Necessities** (the argument for *democracy* fails without them).

  | Requirement | Description | Type | Rationale |
  | :--- | :--- | :--- | :--- |
  | **Competence ($p > 0.5$)** | The average probability of a voter choosing the correct option must exceed random chance. | **Mathematical (Non-negotiable)** | If $p < 0.5$, the theorem reverses: majority rule becomes reliably *wrong* as $n \to \infty$. If $p = 0.5$, the result is indeterminate. |
  | **Independence** | Voter errors must be uncorrelated conditional on the state of the world. | **Mathematical (Non-negotiable)** | Standard proof requires independence. Relaxations (e.g., Ladha 1992) exist but demand drastically higher competence thresholds to offset correlation. Without this, "crowds" do not cancel out noise. |
  | **Truth-Aptness** | The decision space must contain a procedure-independent fact of the matter (binary or verifiable). | **Justificatory (Non-negotiable)** | Without a "correct" answer to track, the theorem describes aggregation, not *epistemic* authority. It cannot justify authority over values without this. |
  | **Sincere Voting** | Voters vote for the option they believe is true, not strategically. | **Mathematical (Non-negotiable)** | Strategic voting decouples the vote from the private signal, breaking the link between competence and outcome. |
  | **Exogeneity of Competence** | Competence levels are fixed prior to the institutional design being justified. | **Justificatory (Non-negotiable)** | If competence is determined by the institution the theorem is supposed to justify, the argument is circular. You cannot use $p$ to justify the system that creates $p$. |
  | **Homogeneity** | All voters share the same competence level $p$. | **Contingent (Pet Assumption)** | The theorem holds for heterogeneous competence if the *average* $p > 0.5$. However, heterogeneity invites weighting arguments. |
  | **Asymptotics ($n \to \infty$)** | The group size approaches infinity. | **Contingent (Pet Assumption)** | Finite versions exist (probability increases with $n$), but the "infallibility" claim requires asymptotics. Small bodies (juries) need the finite variant. |

  ### 2. The Satisfiability Verdict

  **Yes, there is a subset of desiderata that is jointly unsatisfiable.**

  You are correct to suspect a tension. The triad of **Epistemic Reliability**, **Democratic Equality**, and **Empirical Realism** cannot be simultaneously satisfied.

  1.  **Epistemic Reliability:** The procedure reliably tracks the truth (CJT conditions met).
  2.  **Democratic Equality:** The procedure respects political equality (one person, one vote; universal franchise).
  3.  **Empirical Realism:** The procedure operates under real-world conditions (correlated information; endogenous competence).

  **The Trilemma:**
  *   **Keep Reliability + Equality:** You must assume away Realism (assume independence and exogeneity). The justification becomes empirically vacuous.
  *   **Keep Reliability + Realism:** You must sacrifice Equality. To counteract correlation and ensure $p > 0.5$, you must weight votes or restrict the franchise (Epistocracy).
  *   **Keep Equality + Realism:** You must sacrifice Reliability. You accept that the majority may not be truth-tracking in the Condorcet sense (Non-epistemic/Procedural democracy).

  ### 3. The "Killer" Requirement

  You suspected **Endogenous Competence**. You are right, but it works in tandem with **Independence**.

  The single requirement that does the most work knocking out the candidate repairs (weighting, filtering, restricting franchise) is the **Exogeneity of Competence**.

  **Why Exogeneity is the Breaker:**
  *   **The Repair:** To satisfy *Independence* and *Competence* under real-world correlation, proponents suggest filtering the electorate (restricting franchise to the informed) or weighting votes by expertise. This restores Reliability.
  *   **The Knockout:** If Competence is **Endogenous**, you cannot identify the "competent" voters *ex-ante* without relying on metrics produced by the very institutions you are trying to justify.
      *   If you restrict the franchise to the "knowledgeable," you are selecting for competence produced by *prior* unequal access to education/information.
      *   This makes the justification circular: You need democracy to generate competence, but you need competence to justify democracy.
      *   Consequently, any repair that filters for competence implicitly assumes an *exogenous* distribution of knowledge that does not exist. Once you acknowledge endogeneity, the "epistocratic repair" loses its normative force because the metric used to filter is itself politically contested and institutionally dependent.

  **Why Independence is the Trigger:**
  *   **Independence** is the mathematical lever that forces the repair. Because real-world votes *are* correlated (shared media, culture), the competence threshold required for reliability skyrockets (Ladha/Berg).
  *   To meet this inflated threshold, you *must* filter or weight (violating Equality).
  *   However, **Exogeneity** is what ensures that this violation of Equality cannot be stabilized as a "temporary" or "technical" fix. It locks you into the epistocratic conclusion permanently, because the competence gap is structural, not accidental.

  **Verdict:** The **Exogeneity of Competence** is the conceptual bottleneck. It prevents the theorem from being used as a *foundational* justification. It forces you to admit that if the CJT works, it works only because you have already assumed the existence of a competent citizenry that the democratic process itself was supposed to create. This validates your worry: the theorem, when repaired for real-world conditions, argues for an epistocracy wearing a democratic hat.
