answer: |-
  This is a sophisticated question about the metaphysics of biography and the ethics of representation. You are asking for a reconstruction of the implicit epistemology that governs the biopic industry.

  Based on the practices you describe—the tolerance for shuffled timelines and invented dialogue, contrasted with the intolerance for invented moral confrontations or composite characters—we can reconstruct the underlying theory. It is not a single view of truth, but a **dualistic theory of truth** that prioritizes *Narrative Truth* over *Chronicle Truth*, subject to a constraint of *Moral Ontology*.

  Here is the reconstruction of that theory, followed by a test of its coherence, rival explanations, and the consequences of abandoning it.

  ### 1. The Reconstructed Theory: Character Essentialism

  The industry operates on a view we might call **Character Essentialism**. This theory posits that a human being possesses a stable core—a "character," "spirit," or psychological essence—that is distinct from the specific chronological record of their actions.

  Under this view, truth in biography is hierarchical:

  1.  **Primary Truth (The Essence):** This is the "who" of the subject. It encompasses their motivations, moral temperament, relational dynamics, and psychological arc. A film is "faithful" if it accurately renders this essence.
  2.  **Secondary Truth (The Chronicle):** This is the "what," "when," and "where." These are accidental properties. Dialogue, specific dates, and the sequence of events are merely the vessels used to convey the Essence.

  **Why your specific objections fit this theory:**
  *   **Invented Dialogue/Time Compression:** These are alterations to Secondary Truth. If compressing ten years into one helps the audience understand the *Essence* (e.g., the grind of fame, the decay of a marriage) without distorting the nature of that experience, the theory permits it. The invented words are permissible if they are things the subject *might* have said, consistent with their Essence.
  *   **The Invented Confrontation (Your Friend's Objection):** This violates Primary Truth. By inventing a confrontation where the musician shames or is shamed by his brother, the filmmakers are not just moving furniture; they are altering the moral ontology of the subject. They are asserting a psychological fact (he was cruel/vindictive) that contradicts the Essence. This is why it feels like a lie rather than a dramatization.
  *   **The Composite Character (Your Objection):** This is more complex. It violates the **Relational Integrity** of the Essence. A person's character is defined in part by how they interacted with specific others. Merging two bandmates into one erases the specific nature of those relationships. It simplifies the *context* of the Essence to the point of distortion. It suggests the musician operated in a vacuum of fewer relationships than he actually did, which misrepresents the social reality of his life.

  **Is this Coherent?**
  Metaphysically, it is dubious. It relies on a Platonic notion that a "self" exists independently of its actions. If you change enough actions (events), do you not eventually change the self?
  However, **pragmatically**, it is highly coherent. It functions like a translation. When you translate a poem, you change the words (Secondary Truth) to preserve the meaning (Primary Truth). If you change the meaning to keep the rhyme, you have failed the translation. The biopic industry treats life stories as texts to be translated into the language of cinema, where "fidelity" means preserving the theme, not the syntax.

  ### 2. Locating the Boundary

  You asked where the boundary lies. Under Character Essentialism, the boundary is not *Fact vs. Fiction*, but **Attribution of Agency**.

  *   **Permissible:** Inventing a scene where the musician struggles with writer's block. (This illustrates an internal state known to be true).
  *   **Impermissible:** Inventing a scene where the musician steals from his brother. (This attributes a specific moral agency/action that defines the character negatively).

  The boundary is also drawn at **Historical Erasure**.
  *   **Permissible:** Moving an event from 1970 to 1971.
  *   **Impermissible:** Merging two real people into one.
  Why? Because merging people deletes a historical entity. It implies that person B never existed or didn't matter. This shifts the film from being "about the musician" to "about a version of history where certain people are removed." This violates the contract not just to the subject, but to the record itself.

  So, the boundary is: *You may alter the record to illuminate the subject, but you may not alter the record in a way that fundamentally misattributes moral responsibility or erases the existence of other moral agents.*

  ### 3. Testing Rival Theories

  Could other views of truth explain these customs?

  **A. The "Implicit Discounting" View (Fictionalism)**
  *Theory:* Audiences know movies are fiction. No assertions of fact are really being made; therefore, no lies are told.
  *Test:* This fails to explain the outrage. If we truly treated biopics as pure fiction, your friend wouldn't care about the invented confrontation. We would treat it like *Amadeus* (which admits it is a fantasy). The fact that estates sue and audiences feel deceived proves that biopics *are* received as assertions of fact. The "discounting" is partial, not total. We discount the *method*, but not the *claim*.

  **B. The "Sum of Events" View (Nominalism)**
  *Theory:* A person is nothing more than the sum of their actual events. There is no "essence."
  *Test:* This view cannot explain the line you and your friend drew. If a person is just the sum of events, then changing *any* event (time, dialogue, confrontation) is an equal violation. It makes no distinction between compressing a decade and inventing a fight. Since you both felt a distinction, your intuition rejects Nominalism. You both implicitly believe there is a "person" distinct from the "ledger of events."

  **C. The "Reception" View (Verisimilitude)**
  *Theory:* Truth is defined by what the viewer believes afterwards. If the viewer leaves thinking the right things, the film is true.
  *Test:* This is the legal defense (i.e., "no reasonable viewer would believe this literal scene happened"). It explains the *customs* (lawyers use this), but it doesn't explain the *artistic intuition*. You knew the scene was invented before you argued about it. Your objection wasn't "people will believe this," it was "this shouldn't be shown." The Reception View is a shield for filmmakers, not the underlying theory of truth for the audience.

  **Conclusion on Rivals:** None of these rival theories fully account for the specific pattern of acceptance and objection you described. Only Character Essentialism explains why *some* lies are acceptable (they serve the Essence) and *others* are not (they corrupt the Essence).

  ### 4. The Counterfactual: Strict Factual Accuracy

  If the industry replaced Character Essentialism with a strict demand for **Chronicle Truth** (everything shown happened, or is flagged), what would change?

  **1. The Collapse of Narrative Arc**
  Real life is rarely structured like a three-act play. Events happen out of order; motivations are unclear; climaxes are anticlimactic. Strict accuracy would force films to adopt the structure of a documentary or a chronicle. You would lose *causal clarity*.
  *   *Loss:* The ability to show *why* something happened, rather than just *that* it happened. Often, the "truth" of a motivation is only visible by rearranging the timeline to show cause and effect clearly.

  **2. The Silence of the Interior**
  Dialogue is rarely recorded. A strict accuracy rule would require silence or voiceover speculation for most interactions.
  *   *Loss:* The ability to dramatize internal conflict. We accept invented dialogue because it externalizes internal states that are historically attested but verbally unrecorded. Without this, the psychological "Essence" becomes inaccessible.

  **3. The Proliferation of Characters**
  No composite characters means every minor figure must be represented.
  *   *Loss:* Cognitive focus. Audiences have limited capacity to track relationships. A strict accuracy film about a touring band might require 40 named characters. The "story" would dissolve into a crowd scene.

  **4. The Shift in Genre**
  Biopics would effectively cease to exist as a dramatic form. They would become **Docudramas** with constant disclaimers ("This scene is a reconstruction," "The exact words are unknown").
  *   *Value Change:* We would gain historical fidelity but lose *emotional resonance*. The "Truth" of the film would shift from "What it felt like to be them" to "What can be proven about them."

  ### 5. Summary of the Hidden Theory

  The practice presupposes a **Pragmatic Dualism**:

  1.  **There are two types of truth:** Historical (facts) and Poetic (meaning).
  2.  **Poetic Truth is the goal:** The purpose of a biopic is to convey the significance of a life, not the ledger of a life.
  3.  **Historical Truth is the constraint:** You may sacrifice Historical Truth only so far as it does not contradict the Poetic Truth.
  4.  **The Red Line:** You cross the line when a Historical Lie creates a Poetic Falsehood.
      *   *Example:* Compressing time (Historical Lie) does not change the feeling of a long career (Poetic Truth). **Allowed.**
      *   *Example:* Inventing a betrayal (Historical Lie) changes the nature of the person's loyalty (Poetic Falsehood). **Forbidden.**

  Your argument with your friend was not about facts; it was about **which Poetic Falsehoods were introduced.**
  *   Your friend felt the invented confrontation painted a false picture of the musician's *morality*.
  *   You felt the composite character painted a false picture of the musician's *world*.

  Both of you were defending the **Integrity of the Essence** against the **Convenience of the Plot**. The industry's custom is simply a negotiated settlement between these two poles, allowing enough lies to make a story, but forbidding the lies that would make it a different story.

  Is it a polite fiction? Yes. But it is a necessary one. Without the assumption that a person has an "Essence" that can be captured independently of their "Record," biography becomes impossible, because the Record is always incomplete. We need the theory of Essence to fill the gaps in the Record. The conflict arises only when the filmmaker fills those gaps with a different Essence than the one that existed.
