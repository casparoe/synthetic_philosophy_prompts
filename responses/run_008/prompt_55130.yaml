          *   *Verdict:* Contingent on the definition of "actual." If "actual" means "physically instantiated," she might be right (we don't know). If it means "metaphysically possible," she's on shakier ground. The infinite ethics jab is a non-sequitur (abstract objects can ground ethics without physical instantiation).

