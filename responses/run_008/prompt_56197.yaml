answer: |-
  - **Brainstorm**
  Candidate failure points include: (1) The Person-Affecting Restriction (PAR) itself, which demands a victim for every wrong; (2) The Counterfactual Comparative Account of harm embedded in (1), equating harm with being worse off than in an alternative scenario; (3) The causal identity claims in (3), though these are empirically robust given chaos theory; (4) The inference in (6), distinguishing individual welfare from collective standing or inherited claims. Rejecting (1) invites impersonal values and duties to possible people. Challenging (3) is scientifically dubious given sensitive dependence on initial conditions. Splitting (6) leaves earlier cases unresolved, creating theoretical instability. The most precise surgical strike is modifying the definition of harm within (1) from comparative to non-comparative. This retains the victim constraint while altering the metric of harm, avoiding the explosion of obligations to merely possible inhabitants while securing claims for actual descendants.

  - **Diagnosis**
  The failure lies in the **Counterfactual Comparative Account of harm** presupposed by premise (1). You are committed to "no victim, no wrong," which is plausible. But (1) equates "victim" with "person made worse off than they would otherwise be." This conflates *being harmed* with *being disadvantaged relative to a counterpart*. Philosophers like Seana Shiffrin argue harm is non-comparative: an agent harms a victim when they cause them to occupy a state that impedes their interests or involves significant pain/limitation, regardless of whether existence was contingent on that act. In the teratogen and depletion cases, the children *are* victims because they suffer real impairments, even if their alternative was non-existence. The "worse off" clause is the load-bearing flaw, not the "victim" clause.

  This looked fine because our moral practices are overwhelmingly comparative: we blame agents for making existing people worse off. The Nonidentity Problem exploits a blind spot in this practice regarding coming-into-existence. The inference fails because it treats the alternative (non-existence) as a state the person could occupy, rather than recognizing that harm is about the condition of the actual person. By shifting to a non-comparative account, you retain the requirement for an actual victim (satisfying your constraint) while blocking the inference that contingent existence excuses inflicted impairments. You preserve the intuition that wrongs must attach to interests without accepting the paradox that causing disability is permissible if it enables existence. This allows you to say the atrocity descendants are harmed by the legacy conditions (poverty, trauma) regardless of their causal origin. The error is treating non-existence as a baseline state of welfare rather than the absence of a subject. When you correct this, the "worse off" requirement dissolves, but the "victim" requirement remains intact. Consequently, the argument's validity hinges on an equivocation in "worse off." In standard cases, it means "diminished welfare." In identity-affecting cases, it is forced to mean "worse than nothing." By rejecting this semantic slide, you block the derivation of (4) and (5) without abandoning the person-affecting restriction entirely. You are not rejecting the need for a victim; you are rejecting the specific metric used to identify them.

  - **The price**
  This fixes all three cases without invoking impersonal reasons. In the teratogen case, the child is harmed by the condition, granting them a claim against the parents. In depletion, future people are harmed by the degraded environment, granting them claims against us. Crucially, this does *not* obligate us to possible people. Since harm requires an actual victim occupying a bad state, merely possible people who are never created cannot be harmed. You avoid the "obligation to procreate" bullet often feared when rejecting person-affecting views. However, you must accept that creating a life worth living can still constitute harming someone if that life contains significant impediments. This is counterintuitive to some (who think existence is always a benefit), but it aligns with the intuition that causing disability is wrong even if the life is worth living. It preserves the asymmetry: we have reasons not to create suffering people, but no strict duty to create happy people. The cost is accepting that existence can be a harm relative to a threshold of functioning, not just relative to non-existence. You must defend a threshold of "normal functioning" below which life is harmful, even if preferred to death. This approach requires you to defend a threshold of "normal functioning" below which life is harmful, even if preferred to death. You must argue that certain impairments are intrinsically harmful conditions, not just relative disadvantages. This commits you to a substantive theory of human goods independent of individual preference satisfaction. It also means accepting that parents can wrong children by creating them with serious conditions, even if those children love their lives. This is a heavy metaphysical cost, but it is lighter than the cost of impersonal utilitarianism. It keeps morality grounded in actual human suffering rather than abstract state values.

  - **The alternatives, priced**
  First, reject (1) entirely for an Impersonal Principle (e.g., Total Utilitarianism). You swallow the claim that states of affairs are bad even if no one is wronged. Cost: You now owe duties to merely possible people, implying we wrong future generations by not creating *more* happy people, leading to the Repugnant Conclusion where we must maximize population size over quality. Second, accept your suspicion about (6): distinguish "wronging" from "having claims." Perhaps historical groups hold claims inherited across generations even if individuals aren't worse off. Cost: This leaves the depletion and teratogen cases unresolved (accepting no one is wronged there), creating an unstable theory where historical injustice is unique. It forces you to argue that group agency overrides individual welfare comparisons only in specific historical contexts, which looks ad hoc. It also risks severing the link between moral wrongs and individual welfare entirely, potentially allowing claims where no suffering exists, which violates your constraint on floating wrongs. The impersonal route forces you to accept that we might have duties to bring into existence people who will have good lives, simply to increase total value. This contradicts the common intuition that there is no duty to procreate. The collective claims route requires a theory of transgenerational agency that many find metaphysically suspicious. It risks making moral standing depend on group membership rather than individual experience, which could undermine liberal individualism. Both alternatives solve the historical injustice case but at the cost of broader theoretical coherence or intuitive plausibility in other domains.

  - **Bottom line**
  Reject the comparative definition of harm in premise (1), not the victim requirement. Adopt a non-comparative account: harming someone means causing them to be in a bad state, not necessarily a worse state than their alternative. This solves the nonidentity problem for depletion, teratogens, and historical injustice without obligating you to merely possible people or accepting victimless wrongs.
