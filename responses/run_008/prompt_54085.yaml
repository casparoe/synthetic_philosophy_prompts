prompt: |-
  You're a professional speechwriter who also holds a PhD in ancient history, so you know this world from the inside. I need you to write a toast for my PhD advisor's retirement dinner -- think carefully about the structure before you write, maybe brainstorm a couple of angles first.

  She spent her whole career as a radical source critic. Her running line was that Thucydides made half of it up but at least knew he was doing history, while Herodotus gets a bad rap because he actually tells you when he's passing along something he can't vouch for. Her big book argued that most of early Roman history is retrojection -- later generations backfilling a past that suited their own agendas, and the sources we rely on are already the product of that backfilling. She drilled into us that every ancient author needs to be asked: where did you get this, who benefits from this version, and what were you not in a position to know?

  The room is split. Half ancient historians who will catch every allusion and who spent decades being told their evidence is hearsay on hearsay (some of them are still a bit sore about it, affectionately). The other half is family who know her as the aunt who ruined museum audio-guides for everyone by muttering "and how exactly would they know that."

  Write a 4-5 minute toast that honors her skepticism without implying her lifes work boils down to "we can know nothing about the past" -- that strawman drove her crazy, since her whole point was that you CAN know things, you just have to earn it, and that the earning is the actual job. It should land as warm, make the experts grin at least twice, and not turn into a lecture for the family. No Latin unless you translate it in the same breath.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Role:** Professional speechwriter with a PhD in Ancient History (insider knowledge).
      *   **Task:** Write a retirement dinner toast for a PhD advisor.
      *   **Duration:** 4-5 minutes (approx. 600-750 words spoken at a moderate pace).
      *   **Subject:** A radical source critic.
          *   Key belief: Thucydides fabricated but knew it was history; Herodotus is honest about uncertainty.
          *   Key book: Early Roman history is retrojection (backfilling).
          *   Key methodology: Ask "Where did you get this? Who benefits? What couldn't you know?"
      *   **Audience:** Split 50/50.
          *   Group A: Ancient Historians (colleagues/students). They know the jargon, have been challenged by her, affectionately sore.
          *   Group B: Family/Friends. Know her as the person who critiques museum plaques.
      *   **Tone:** Warm, honoring, not nihilistic (avoid "we can know nothing"), funny but accessible.
      *   **Constraints:** No untranslated Latin. Make experts grin at least twice.

  2.  **Brainstorming Angles & Structure:**
      *   *Angle 1: The Detective.* Focus on her as an investigator. Good for family, but might feel a bit generic for historians.
      *   *Angle 2: The Architect.* Focus on how she deconstructed buildings of history to see the foundations. A bit dry.
      *   *Angle 3: The Honest Skeptic.* Focus on the idea that skepticism is an act of love for the truth, not cynicism. This hits the "strawman" constraint best.
      *   *Structure:*
          1.  **Hook:** Acknowledge the split audience (historians vs. family). Establish the common ground (her skepticism).
          2.  **The Core Philosophy:** Explain her method without jargon. Use the Thucydides/Herodotus line.
          3.  **The Impact (Students/Colleagues):** How she challenged them. The "sore but affectionate" bit.
          4.  **The Impact (Family/Life):** The museum anecdote.
          5.  **The Pivot (Crucial):** Address the "nihilism" strawman. She taught us we *can* know, but we must earn it.
          6.  **Conclusion:** Raise a glass to the future and the rigor she leaves behind.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Need to welcome everyone. Acknowledge the two tribes in the room.
      *   *The "Thing":* Define her career. Source criticism. How to explain "retrojection" to Aunt Linda? *Idea: Compare it to family stories.* "Grandpa didn't actually fight a bear, but the story tells us what the family values."
      *   *The Herodotus/Thucydides Line:* This is gold. Must include it. It shows her specific intellectual fingerprint.
      *   *The Student Experience:* We were all terrified of the question "How do you know that?" But it made us better.
      *   *The Family Experience:* The museum audio guide muttering. This humanizes her.
      *   *The Correction:* She hates the "we can't know anything" label. Emphasize the *work*. The "earning."
      *   *The Toast:* Bring it together.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Is it too academic? *Fix:* Ensure the explanation of "retrojection" is metaphorical.
      *   *Check:* Is it too long? *Fix:* Keep sentences punchy.
      *   *Check:* Did I include the Latin constraint? *Fix:* If I use *quaerite veritatem* or similar, translate it immediately. Actually, better to avoid it unless it's a punchline. Let's stick to English to keep the family included, maybe one tiny phrase if it lands well. Let's try *historia rerum gestarum* (history of things done) vs *res gestae* (the things done). No, keep it simpler. Let's use the "Where did you get this?" triad.
      *   *Check:* The "Grin" factor. The historians need to laugh at the pain she caused them. The "Who benefits?" question is a classic trigger.
      *   *Check:* The "Warmth." It can't just be about her being tough. It needs to be about why she was tough (care for the truth).

  5.  **Drafting the Content (incorporating the "PhD Speechwriter" persona):**
      *   *Voice:* Eloquent but conversational. Respectful but intimate.
      *   *Specifics:* Mention the "Roman retrojection" book without getting bogged down.
      *   *Ending:* Needs to be uplifting.

  6.  **Review against constraints:**
      *   4-5 minutes? (Word count check: ~650-750 words).
      *   No untranslated Latin? (Checked).
      *   Address the "nihilism" strawman? (Yes, central theme).
      *   Two grins for historians? (The "Who benefits" line and the Thucydides/Herodotus comparison).
      *   Accessible to family? (Yes, museum anecdote bridges the gap).

  7.  **Final Polish:** (Mental read-through for rhythm). *Make sure the transition from the academic to the personal feels seamless.* The connection is "questioning the narrative."

  *(Self-Correction during final review)*: I need to make sure I don't sound *too* much like a student. I need to sound like a colleague who was once a student. The tone should be "We all survived her, and we are better for it."

  Let's write it.cw
answer: |-
  Good evening, everyone.

  For those who don't know me, I'm [Your Name]. I had the privilege, and occasionally the terror, of being one of [Advisor's Name]'s doctoral students.

  Looking around this room, I see a fascinating divide. On one side, we have the family and friends. You know [Advisor's Name] as the aunt who stands in front of a museum exhibit about Bronze Age pottery, reads the plaque, and mutters, "And how exactly would they know that?" before being shushed by three different people.

  On the other side, we have the historians. We know her as the reason we check our footnotes three times before hitting send. We are the people who have had a draft returned with the single comment: "Source?" written in the margin so hard it nearly tore the paper.

  [Advisor's Name] built her career on a simple, dangerous idea: that the past is not a gift we receive, but a crime scene we investigate.

  She taught us that Thucydides probably made up half his speeches, but at least he had the decency to treat history as a craft. She argued that Herodotus gets a bad rap; he's the honest one, constantly telling you, "This is what the Persians say, but I don't vouch for it." She spent decades arguing that early Roman history wasn't a record of what happened, but a mirror of what later generations *wished* had happened. She called it "retrojection." For the family: imagine if your grandchildren wrote your biography today, but they filled in the gaps with stories that made *them* look better, not you. That was her battlefield.

  Her mantra was a triad of questions that haunted us in the library at 2:00 AM: *Where did you get this? Who benefits from this version? And what were you not in a position to know?*

  I confess, there were times when we wanted to scream. There is a specific kind of exhaustion that comes from realizing your entire argument rests on a source that was written fifty years after the fact by a political opponent. I know several colleagues here who still have a slight twitch when someone says the phrase "oral tradition."

  But here is the thing that the caricature of [Advisor's Name] often misses. And this is crucial.

  There is a strawman argument in our field that radical skepticism means believing we can know *nothing* about the past. That drove her crazy. It drove her up the wall.

  Her point was never that the truth is unreachable. Her point was that the truth is expensive. You have to earn it.

  She didn't teach us to doubt so we would give up; she taught us to doubt so we would dig deeper. She taught us that stripping away the myths isn't an act of destruction; it's an act of respect. Because if we accept the easy story, we insult the complexity of the people who lived it. If we accept the propaganda, we side with the propagandists.

  She taught us that you *can* know things. But you have to do the work. You have to interrogate the silence. You have to understand that a lie in the historical record is just as much a fact as the truth is, provided you ask why the lie was told.

  To the family: When she questions the museum plaque, it's not because she hates the museum. It's because she loves the truth enough to demand it be precise.

  To the colleagues: We are better historians because she made us suffer a little. We write cleaner arguments because she taught us to fear the easy assumption.

  [Advisor's Name], you are retiring from the university, but you are not retiring from the inquiry. You have left us with a rigorous standard and a very clear warning: Do not let the dead speak unless you are sure you know what they're actually saying.

  So, if everyone could please raise a glass.

  To [Advisor's Name]. May your retirement be filled with things that are verifiable, sources that are transparent, and stories that don't require a footnote to enjoy. But mostly, to the teacher who showed us that while we cannot bring the past back to life, we owe it the dignity of getting it right.

  Cheers.
