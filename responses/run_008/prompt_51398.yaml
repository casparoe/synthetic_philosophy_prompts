answer: |-
  ### I. Agreed Claims

  1.  **Justification Requirement:** State-imposed intentional hardship requires public justification; it cannot be arbitrary.
  2.  **Act-Type Distinction:** "Punishment" is distinct from "administrative hardship" (e.g., quarantine, tax penalties). Punishment necessarily involves censure/condemnation, not merely restriction.
  3.  **Variable Independence:** The question "What does the offender deserve?" and the question "What sentence produces the best outcomes?" are logically distinct. Answers can diverge.
  4.  **Systemic Excess:** Both theories classify specific existing penalties (e.g., mandatory minimums for non-violent offenses) as unjustified/excessive.
  5.  **Innocent Constraint:** The state must not punish individuals known to be innocent, regardless of potential social benefit.
  6.  **Severity Variance:** The severity of a sentence is a variable subject to critique; it is not fixed solely by statute or solely by harm caused.

  ### II. Disagreements Table

  | Issue | Retributivist Phrasing | Consequentialist Phrasing |
  | :--- | :--- | :--- |
  | **Primary Obligation** | The state is obligated to respond to the *past* wrongful act proportionately. | The state is obligated to manage *future* risk and social welfare optimally. |
  | **Function of Desert** | Desert is a freestanding moral fact that generates the permission to punish. | Desert is a heuristic label for past behavior that helps predict future risk/compliance. |
  | **Sentencing Metric** | Severity must scale to the gravity of the offense committed. | Severity must scale to the minimum necessary to achieve preventative goals. |
  | **Moral Status of Pain** | Inflicting pain on the guilty is intrinsically valuable (or required) when deserved. | Inflicting pain is intrinsically bad; it is only tolerable as a cost for gain. |

  ### III. Cruxes and Test Cases

  **Crux 1: The Sealed Sentence (Normative)**
  *   **Case:** Guilt certain. Trial sealed (no public knowledge). Offender has degenerative condition (no recidivism risk). No rehabilitation possible.
  *   **Retributivist Prediction:** State must punish (severity proportional to crime).
  *   **Consequentialist Prediction:** State must not punish (release/conditional discharge); punishment is pure cost.
  *   **Relevance Concession:**
      *   *Ret:* This is not a freak case; it isolates the retributive variable by removing utilitarian noise.
      *   *Cons:* This is not a freak case; it demonstrates the absence of utility channels.

  **Crux 2: The Meaning of "Desert" (Conceptual)**
  *   **Case:** Public believes offender "deserves" pain, but inflicting pain triggers a riot causing net massive harm.
  *   **Retributivist Prediction:** Punish anyway. "Desert" is an objective moral claim independent of public reaction.
  *   **Consequentialist Prediction:** Do not punish. "Desert" claims are valid only if satisfying them yields net positive outcomes.
  *   **Relevance Concession:**
      *   *Ret:* Concedes this tests whether "desert" is a reason for action or merely a sentiment.
      *   *Cons:* Concedes this tests whether "desert" has weight independent of utility.

  **Crux 3: Empirical Compliance (Empirical)**
  *   **Case:** Comparative study of jurisdictions: (A) Sentences track perceived desert strictly; (B) Sentences track optimized deterrence strictly.
  *   **Retributivist Prediction:** Compliance rates are secondary. If (A) yields slightly higher crime but more justice, (A) is preferred.
  *   **Consequentialist Prediction:** Compliance rates are primary. If (A) does not yield higher compliance than (B), (A) is unjustified.
  *   **Falsification Conditions:**
      *   *Ret:* Would concede error if strict desert sentencing caused societal collapse (making justice impossible).
      *   *Cons:* Would concede error if desert-tracking sentencing showed significantly higher long-term compliance than utilitarian sentencing.

  ### IV. Circularity Note

  Both sides frequently employ an *Euthyphro*-style circularity regarding desert and institutional response.
  1.  **Retributivist Loop:** "We punish because he deserves it" $\rightarrow$ "How do we know he deserves it?" $\rightarrow$ "Because the law prescribes this punishment." (Desert justifies the penalty; the penalty defines the desert).
  2.  **Consequentialist Loop:** "Desert is just a heuristic" $\rightarrow$ "Why use this heuristic?" $\rightarrow$ "Because it matches our intuition of justice" $\rightarrow$ "Why trust that intuition?" $\rightarrow$ "Because it tracks desert."
  *Correction:* To break the loop, the Retributivist must define desert independent of statutory penalty, and the Consequentialist must define the heuristic's utility independent of the intuition it satisfies.

  ### V. Verbal Dispute Summary

  A portion of the dispute is verbal, specifically regarding the predicate "is just." The Retributivist uses "just" to denote *moral symmetry* between act and response (a property of the transaction). The Consequentialist uses "just" to denote *systemic optimality* (a property of the outcome). When they argue "This sentence is unjust," the Retributivist means "It violates proportionality," while the Consequentialist means "It wastes resources or fails to deter." They agree on the physical facts of the sentence but disagree on whether the label "unjust" applies to the *ratio* of harm-to-wrong or the *efficiency* of harm-to-safety. Resolving this requires agreeing to split the term: use "proportionate" for the former and "efficient" for the latter.
