      *   *Self-Correction on Q5:* Distinguishing Stage/Worm is hard. I will frame it around *what exists now*. Worm: The whole timeline exists. Stage: Only the now-slice exists, but we talk as if the timeline exists. Actually, that's Eternalism vs Presentism. Stage/Worm are usually both Eternalist. The difference is reference. "I" refers to the worm vs "I" refers to the stage.
