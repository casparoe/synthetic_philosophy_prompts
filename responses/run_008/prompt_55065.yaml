answer: |-
  # The Persistence Quiz: What Survives Time?

  **Introduction**
  This instrument is designed to locate your metaphysical commitments regarding persistence without requiring you to know the labels philosophers use. There are no "correct" answers. The goal is to see if your intuitions about specific cases form a coherent pattern. Answer based on what seems *true* to you, not what you think a theory should say.

  ### The Questions

  **1. The Iron Poker (Temporary Intrinsics)**
  An iron poker is straight on Monday. On Tuesday, it is bent. Nothing was added or removed; the iron itself changed shape. What is the most accurate description of this situation?
  *   **A.** The "Monday-poker" and the "Tuesday-poker" are different segments of one long object that stretches across the week. The long object is partly straight and partly bent.
  *   **B.** It is the exact same object on both days. It literally possesses the property of "straightness" on Monday and loses it to gain "bentness" on Tuesday.
  *   **C.** It is the same object, but "straightness" isn't a simple property. It really has the property "straight-on-Monday" (which it keeps forever) and "bent-on-Tuesday" (which it also keeps forever).

  **2. The Split Person (Fission)**
  Imagine your brain hemispheres are separated and transplanted into two different bodies. Both bodies wake up with your memories and personality. Neither is a copy; both are psychologically continuous with you. What happened to *you*?
  *   **A.** You are both of them. Identity can branch.
  *   **B.** You ceased to exist, and two new people who are very much like you came into existence.
  *   **C.** You were actually two distinct people overlapping in one body all along; now you have just gone separate ways.
  *   **D.** One of them is you, but we need a arbitrary rule (like "left hemisphere wins") to decide which one.

  **3. The Ship of Theseus (Gradual Replacement)**
  A ship has every single plank replaced over ten years. The old planks are saved and reassembled into a ship at a museum. We now have the "Continuous Ship" (at sea) and the "Original Plank Ship" (in the museum). Which one is the original ship?
  *   **A.** The Continuous Ship. Identity follows the continuous history and function, not the specific matter.
  *   **B.** The Original Plank Ship. Identity follows the matter.
  *   **C.** Both are the original ship. For a while, there were two ships occupying different places that were both identical to the original.
  *   **D.** There is no fact of the matter. "The ship" is a vague concept that doesn't track reality precisely here.

  **4. The Clay Statue (Counting/Co-location)**
  A sculptor shapes a lump of clay into a statue. The statue and the lump of clay occupy the exact same space. The lump could survive being squashed; the statue could not. How many objects are on the pedestal?
  *   **A.** One object. The statue just *is* the clay, described differently.
  *   **B.** Two objects. They are distinct things that happen to be in the same place for a while.
  *   **C.** One object now, but they have different futures, so they are distinct "temporal beings" sharing a current location.

  **5. The Past Self (Reference)**
  When you say, "I existed ten years ago," what are you referring to?
  *   **A.** The thing sitting here reading this sentence. That very thing was also there ten years ago.
  *   **B.** A part of the thing that extends from ten years ago to now. Part of me was there; part is here.
  *   **C.** A different thing (a past stage) that is causally connected to the thing sitting here now. I am only the thing here now.

  **6. The Five-Minute Object (Temporal Extension)**
  Consider a bubble that exists for exactly five minutes and then pops. Does the bubble have parts in time the way it has parts in space (top half, bottom half)?
  *   **A.** Yes. It has a first-half and a second-half, just like it has a left-side and right-side.
  *   **B.** No. It is fully present at every moment it exists. It doesn't have "time-parts," it just has a short duration.
  *   **C.** It depends on how you define "bubble."

  **7. The Open Future (Ontology)**
  Think about tomorrow. You might drink coffee or tea. Right now, is the future version of you who drinks coffee already real in the same way the present you is real?
  *   **A.** Yes. The future is just as real as the present; I just haven't reached that part of it yet.
  *   **B.** No. Only the present exists. The future is not real yet.
  *   **C.** The future exists as a set of possibilities, but not as concrete reality.

  **8. The Property Bearer (Instantiation)**
  When you say "I am hungry," what exactly is hungry?
  *   **A.** The whole me, but only relative to this moment.
  *   **B.** Just the current momentary slice of me. The "rest" of me (past and future) is not hungry.
  *   **C.** The whole me, literally and without qualification. If I am hungry now, then "I" am hungry, even if I wasn't hungry an hour ago.

  ***

  ### The Logical Space (Before The Labels)

  Before assigning you a label, we must map the terrain. The questions above probe four distinct structural disagreements. Your score depends on how you combine these commitments.

  **Dimension 1: Extension (Questions 1, 5, 6)**
  *   **The 4D Commitment:** You believe objects are spread out in time. Just as your hand is a spatial part of you, "you-today" is a temporal part of a larger entity. (Mostly **A** answers).
  *   **The 3D Commitment:** You believe objects are not spread out. They are fully located at each moment they exist. (Mostly **B** answers).

  **Dimension 2: Reference (Questions 2, 5)**
  *   *If you chose 4D:* Do you identify as the whole spread (The Worm) or the current slice (The Stage)?
      *   **Worm:** "I" refers to the entire timeline. (Q5-B).
      *   **Stage:** "I" refers to the current moment, speaking loosely about connected past/future moments. (Q5-C).
  *   *If you chose 3D:* "I" refers to the enduring object. (Q5-A).

  **Dimension 3: Temporary Intrinsics (Questions 1, 8)**
  *   *If you chose 3D:* How does an object change properties without contradiction?
      *   **Relationalism:** Properties are relations to times ("Straight-at-t"). (Q1-C).
      *   **Adverbialism/Timeless:** The object stands in different relations to properties at different times. (Q1-B / Q8-A).
      *   **Tensed/Indexed:** The property itself includes the time, or only present properties are real. (Q1-B / Q8-C).

  **Dimension 4: Identity vs. Survival (Questions 2, 3, 4)**
  *   **Strict Identity:** One thing cannot become two (No Fission). (Q2-B/D).
  *   **Overlap/Composition:** Two things can share matter or history (Q2-C, Q4-B).
  *   **Deflationism:** Identity is vague (Q2-D, Q3-D).

  ***

  ### Scoring Key & Interpretation

  Tally your answers. Be warned: Human intuition is messy. You may not fit perfectly into one column. Look for the *dominant* pattern.

  #### 1. The Perdurantist Worm (4D Aggregates)
  *   **Pattern:** Q1(A), Q2(C), Q5(B), Q6(A), Q7(A).
  *   **The View:** You believe ordinary objects are four-dimensional "worms" extending through spacetime. When you say "I existed ten years ago," you mean a part of the worm located ten years ago is identical to a part of the worm located here.
  *   **Why this pattern:** You treat time like space (Q6). You solve fission by saying two worms overlapped (Q2-C). You solve change by saying the worm has different properties at different segments (Q1-A).
  *   **Note:** This is the standard Lewisian view. It preserves classical logic but requires accepting that you are a long, static entity.

  #### 2. The Stage Theorist (Exdurantism)
  *   **Pattern:** Q1(A), Q2(C), Q5(C), Q6(A), Q8(B).
  *   **The View:** You agree with the Worm theorist that objects have temporal parts, but you disagree about language. You believe "I" refers only to the current momentary stage. When you say "I existed ten years ago," you mean "A predecessor stage of mine existed ten years ago."
  *   **Why this pattern:** Like the Worm, you accept temporal parts (Q1-A, Q6-A). But you deny you are the whole worm (Q5-C). You solve fission similarly (overlapping stages).
  *   **Limitation:** This quiz struggles to separate Worms from Stages. In casual conversation, "Part of me was there" (Worm) and "A stage related to me was there" (Stage) sound identical. If you scored Worm but feel Q5-C is more precise, you are a Stage Theorist.

  #### 3. The Endurantist (3D Wholes)
  *   **Pattern:** Q1(B/C), Q2(B/D), Q5(A), Q6(B), Q8(A/C).
  *   **The View:** You believe objects are wholly present at every moment. You are not spread out. You literally travel through time.
  *   **Sub-Type A: Relationalist Endurantism**
      *   **Marker:** Q1(C).
      *   **View:** You solve the problem of change by saying properties are actually relations to times. The poker doesn't have "straightness"; it has "straightness-at-Monday."
  *   **Sub-Type B: Adverbialist / Timeless Endurantism**
      *   **Marker:** Q1(B) and Q8(A).
      *   **View:** You believe the object has properties timelessly, but the *instantiation* is modified by time. The object "temporarily has" straightness.
  *   **Sub-Type C: Tensed / Presentist Endurantism**
      *   **Marker:** Q1(B), Q7(B), Q8(C).
      *   **View:** You believe only the present exists. The poker *was* straight (past tense fact) and *is* bent (present tense fact). There are no past properties hanging around to cause contradictions.

  #### 4. The Deflationist / No-Fact-of-the-Matter
  *   **Pattern:** Q3(D), Q4(A or D), Q2(D).
  *   **The View:** You believe our concepts (ship, person, statue) are useful tools for carving up the world, but they do not track metaphysical reality. There is no deep truth about whether the ship survived; there is only a truth about whether it is useful to *say* it survived.
  *   **Location:** This view cuts across the 3D/4D divide. You can be a Deflationary Endurantist or a Deflationary Perdurantist. If you chose (D) on the vague cases but (A) on the temporal parts cases, you are a **Pragmatic Perdurantist**.

  ***

  ### Unoccupied Space & Limitations

  **1. The "Branching Identity" Gap (Q2-A)**
  *   **The View:** "You are both fission products."
  *   **Status:** **Mostly Unoccupied.**
  *   **Why:** This violates the transitivity of identity (If A=B and A=C, then B=C. But if B and C are two different people, they aren't identical). Some philosophers (like David Lewis in *Survival and Identity*) flirt with this by redefining identity as a "I-relation" (psychological continuity), but few claim strict numerical identity branches. If you chose this, you likely value psychological continuity over logical identity.

  **2. The Worm/Stage Indistinguishability**
  *   **Honesty Check:** This quiz cannot definitively separate Worm Theory from Stage Theory for a general audience. Both views agree on the ontology (temporal parts exist). They disagree on semantics (what the word "I" picks out). In a blog quiz, a Worm theorist might answer Q5 with (C) thinking it's just a figure of speech, while a Stage theorist answers (B) thinking "stage" implies "part of me."
  *   **Diagnostic:** To truly separate them, you must ask: "Does the subject of your thought *right now* exist next week?" Stage: No. Worm: Yes (part of it).

  **3. The Endurantist Sub-Type Blur**
  *   **Honesty Check:** Distinguishing Relationalism (Q1-C) from Adverbialism (Q1-B) is notoriously difficult even for professionals. Both are attempts to save 3D persistence from the problem of change. If you scored Endurantist but aren't sure which sub-type, do not worry. The primary metaphysical commitment is the rejection of temporal parts; the account of properties is a secondary repair job.

  **4. The Co-Location Puzzle (Q4)**
  *   **Unoccupied Combination:** Q4(A) "One Object" + Q1(A) "Temporal Parts."
  *   **Why:** If you believe the statue is just the clay (A), but you also believe in temporal parts (1-A), you are committed to saying the statue and clay are the same *worm*. But they have different modal properties (one can be squashed, one cannot). Most philosophers who accept temporal parts (4D) use them to *solve* co-location by saying the statue and clay are distinct worms that overlap. If you hold this combination, you have a unique challenge explaining how one object can have two different futures.

  ### Final Advice for the Editor
  When publishing this, emphasize that the "score" is not a verdict but a map. The value of the quiz is not in the label it assigns, but in the moment the reader realizes, "Wait, if I answer Yes to the Poker, I *must* answer No to the Fission case to be consistent, but my intuition says Yes to both." That friction is where the philosophy begins.
