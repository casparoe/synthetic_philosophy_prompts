      *   *Counter-evidence:* Bratman acknowledges normative elements (mutual obligation arises from interlocking intentions, though he tries to keep it thin). Gilbert acknowledges coordination (you can't have a plural subject without acting together).
      *   *The Real Friction:* It's not just ambiguity; it's a disagreement about *grounding*. Bratman wants to ground the social in the individual (methodological individualism). Gilbert wants to ground the individual's normative status in the social relation (holism/sui generis).
      *   *Verdict:* The hypothesis is *partially* right but too charitable. It's not just a confusion; it's a clash of metaphysical commitments regarding the priority of the "I" vs. the "We."

  3.  **Diagnose the Stalemate (The "Why"):**
