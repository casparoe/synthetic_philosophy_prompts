      *   **The Impasse:** They are optimizing for different theoretical virtues. Bratman optimizes for parsimony/naturalism. Gilbert optimizes for phenomenological accuracy regarding normativity. They talk past each other because they agree on the *data* (people carry tables, people feel betrayed) but disagree on the *ontology* required to explain it.

