prompt: |-
  so heres my situation: I write novels — mostly close third-person literary stuff, the kind where you're basically camped inside one character's head for 300 pages — and I've fallen down a rabbit hole of consciousness literature because a reviewer said one of my books "captures what it's like to be inside a mind," which got me wondering what that could even mean. I've been reading about global workspace theory and about the fight between people who think consciousness just IS availability to report/Reasoning/control and people who insist there's a phenomenal something over and above all that. Problem is I bounce off the philosophy vocab almost immediately, whereas craft vocab is my native language.

  So: restate this whole debate for me in the vocabulary I actually use. Focalization, free indirect discourse, unreliable narration, stream of consciousness, what the narrator can access versus what the character undergoes, information that's available to the story versus information that's only implied, the gap between what a character could say about their experience and what we show the reader of it. Assume I know all of those terms cold but genuinely don't know what "access consciousness" or "global workspace" mean — build those up in my terms, don't just name-drop them. My working hunch is that global workspace theory is basically a claim about narrative structure — that being conscious is like being the focalizing character rather than one of the offstage ones — and that the phenomenal consciousness people are insisting on something like the texture of free indirect discourse, the felt quality that survives even when narration is flat and minimal. But I suspect I'm smuggling craft assumptions in and calling it translation.

  Then the part I actually care about: the residue report. Which parts of the philosophers' debate map cleanly onto craft distinctions I already make, which parts you had to distort to fit into novelist vocabulary, and which parts have no expression in my vocab at all. And for that last category, tell me straight whether you think it's my vocabulary that's missing something — maybe fiction literally cannot represent unverbalized, unreportable experience since everything on the page is reported by somebody — or whether the philosophers' disagreement is less substantive than it looks and my vocab is actually exposing that.

  One more thing, and I mean it: tell me where your translation is most likely to go wrong. Like, which specific argument or consideration from the actual debate — blindsight cases, the zombie stuff, whatever — would force you to change the mapping you're giving me, and where your reasoning is the shakiest. I'd rather know the load-bearing walls are questionable than recieve a translation that sounds confident and isn't. A typo or two in your answer is fine, honestly, I've made several writing this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
