answer: |-
  Here is the translation, the residue report, and the structural weak points, drafted in the vernacular you actually use.

  ### Part 1: The Translation

  You're right to suspect that Global Workspace Theory (GWT) maps onto narrative structure, and that Phenomenal Consciousness maps onto stylistic texture. But let's tighten the screws on that.

  **Access Consciousness (The Global Workspace)**
  In philosophy, this is information that is "globally available" to the system for reasoning, reporting, and rational control.
  **In Craft:** This is **Reportable Focalization**. It is the data the POV character can access, manipulate, and articulate. If your character can think, "I am angry because he lied," that thought is in the Global Workspace. It's the content of the internal monologue. It's the plot-relevant intel. It's the difference between a background extra (unconscious processing) and the Protagonist (conscious access). If the character can't say it, can't act on it, or can't reason with it, it's not in the workspace. It's subtext, or it's physiology, but it isn't *narrative access*.

  **Phenomenal Consciousness (The "What It's Like")**
  In philosophy, this is the subjective feel of experience independent of reportability. The redness of the red, the hurt of the pain, even if you can't name it.
  **In Craft:** This is **Stylistic Qualia**. It is the specific resonance of the Free Indirect Discourse that survives even when the character has no words for it. It's the gap between the sentence "He felt sad" (report) and the rhythm, syntax, and imagery that make the reader *feel* the heaviness without the character necessarily understanding why. It is the texture of the prose that simulates experience rather than summarizing it. When a reviewer says you "capture what it's like to be inside a mind," they aren't talking about the plot points the character knows (Access); they are talking about the *sensory and emotional weight* of the prose (Phenomenal).

  **The Debate Restated**
  The philosophers are fighting over whether **Reportable Focalization** is all there is, or if **Stylistic Qualia** is a separate, magical ingredient.
  *   **The Illusionists/Functionalists (Dennett, etc.):** They argue that if you get the Reportable Focalization right (the structure, the access, the behavior), the "feeling" is just a user-illusion. In craft terms: If you write the internal monologue perfectly, the "vibe" is just a byproduct. There is no ghost in the machine.
  *   **The Realists (Chalmers, etc.):** They argue you can have all the Reportable Focalization in the world, and still lack the Stylistic Qualia. In craft terms: You could write a perfectly logical, coherent internal monologue that describes pain accurately, but fails to make the reader *wince*. They insist the wince is a distinct ontological category, not just a stylistic flourish.

  ### Part 2: The Residue Report

  **1. Clean Maps (Where the vocab holds)**
  *   **Access = Tell / Phenomenal = Show:** This is the oldest cliché in the workshop, but it tracks surprisingly well. Access consciousness is "He told himself he was safe." Phenomenal consciousness is the description of the trembling hands that betray him.
  *   **Unreliable Narration:** This is a perfect map for the gap between Access and Phenomenal. A character might have Access to a thought ("I love her") but their Phenomenal experience (shown through brittle, aggressive prose) suggests otherwise. The philosophical "gap" is your bread and butter: the distance between what the character claims to experience and what the text forces the reader to feel.

  **2. Distorted Maps (Where I had to stretch)**
  *   **The "Hard Problem":** In philosophy, the Hard Problem is explaining *why* physical processing feels like something. In fiction, we don't have a Hard Problem because we don't have physics. We only have signs. I had to translate "why does brain matter feel?" into "why do words evoke feeling?" That's a category error. You aren't building a mind; you're building a *simulation* of a mind. The "magic" of consciousness in philosophy is the "magic" of empathy in reading. I'm conflating the *representation* of qualia with qualia itself.
  *   **Attention:** GWT relies heavily on "attention" as the spotlight. In fiction, attention is manipulated by sentence length, white space, and paragraph breaks. But a character can "attend" to something in a book without the prose highlighting it (e.g., a boring list the character obsesses over). The mechanism of attention in the brain (neural firing rates) doesn't map cleanly to the mechanism of attention in reading (eye movement/cognitive focus).

  **3. No Expression (Where craft vocab fails)**
  *   **The Philosophical Zombie:** This is the big one. A zombie is a being that acts exactly like a human but has no inner experience. In fiction, **this is impossible to write.** If you write a character who acts human, speaks human, and thinks human, the reader *assigns* them consciousness. You cannot write a "zombie POV" because the act of granting POV *is* the grant of consciousness. There is no craft equivalent for "a mind that isn't there."
  *   **Pre-Linguistic Experience:** Philosophy worries about experience before language. Fiction *is* language. You can try to mimic pre-linguistic states (Joyce, Faulkner), but the moment you type "blue," you've categorized the sensation. You cannot represent the unreportable without reporting it.

  ### Part 3: The Verdict

  Is your vocabulary missing something, or is the debate hollow?

  I think the debate is **substantive for neuroscience but hollow for narratology.**

  Here's why: The philosophers are arguing about the *ontology* of the mind (what it *is*). You are arguing about the *semiotics* of the mind (how it *signifies*).
  When a reviewer says you captured "what it's like to be inside a mind," they aren't saying you successfully transmitted raw qualia into their brain. They're saying your **Stylistic Qualia** (syntax, rhythm, image) successfully triggered a simulation in *their* Global Workspace that matched their own memories of consciousness.

  Your vocabulary isn't missing the "phenomenal" aspect; your vocabulary *absorbs* it. In fiction, style *is* the qualia. There is no distinction between the "feeling" and the "words that create the feeling." Therefore, the philosophical distinction between Access and Phenomenal collapses in the novel. If you can write it, it's Accessible. If it feels real, it's Phenomenal. They are the same event on the page.

  The philosophers are fighting over whether the map is the territory. You are a mapmaker. You don't care if the territory exists, only if the map gets the traveler lost in the right way.

  ### Part 4: Load-Bearing Walls (Where this translation breaks)

  You asked where I'm lying to you. Here are the specific points where this mapping collapses if you poke it.

  **1. Blindsight**
  *   **The Case:** Patients who are cortically blind (say they see nothing) but can accurately guess the location of objects (unconscious processing). This proves Access can be severed from Phenomenal experience (they act without seeing).
  *   **The Break:** In fiction, this maps to **Subtext** or **Dramatic Irony**. But here's the failure: If you write a character with blindsight, you have to *tell* the reader they can't see, while *showing* them navigating. The *reader* has Access to the character's success. The character lacks Access, but the Reader gains it.
  *   **Why it breaks:** In the brain, blindsight is private. In the novel, everything is public. You cannot replicate the privacy of the deficit without breaking the focalization. If you hide the success from the reader, it's a plot twist, not a phenomenological state. If you show it, you've given the reader Access, defeating the analogy.

  **2. The Explanatory Gap**
  *   **The Case:** Why does *this* neural firing feel like *red* and not *blue*?
  *   **The Break:** In craft, this is **Arbitrariness of Sign**. Why does the word "red" evoke red? Convention. But in consciousness, the link isn't conventional; it's causal.
  *   **Why it breaks:** My translation assumes style *causes* feeling. But style is arbitrary. I can change "red" to "crimson" and the feeling shifts slightly, but it's still a code. In the brain, the "feeling" isn't a code (arguably). By translating qualia into "style," I am reducing the Hard Problem to a stylistic choice. I am telling you the Hard Problem is just a diction problem. It might be, for a writer, but it isn't for a brain.

  **3. The Unity of Consciousness**
  *   **The Case:** Your experience feels like one unified field, even though your brain processes vision, sound, and touch separately.
  *   **The Break:** This maps to **Narrative Voice**. A consistent POV creates unity.
  *   **Why it breaks:** Narrative voice is a construct edited over months. Consciousness is real-time integration. When you write a "stream of consciousness," you are imposing a grammar on chaos. You are creating a *false unity*. The philosophical debate is about how the brain binds disparate signals. Your vocab assumes the binding is already done by the grammar of the sentence. You are smuggling in the solution by the very act of writing a coherent sentence.

  **Summary of the Risk:**
  The shakiest part of my reasoning is the claim that **Stylistic Qualia = Phenomenal Consciousness.**
  It works for the *reader's* experience of the book. It does not work for the *character's* experience inside the book. You can write a character who is numb, whose prose is flat, who reports nothing (Low Access, Low Phenomenal). But the *act of writing it* requires you to access a workspace to construct that flatness.

  You can't write unconsciousness without consciousness. That's the wall. The philosophers are trying to explain how unconscious meat becomes conscious mind. You are using a conscious mind to simulate unconsciousness. The vectors are opposite.

  Keep that in mind when you read the theory. They are digging down to the substrate; you are building up from the surface. The map holds, but the terrain is upside down.
