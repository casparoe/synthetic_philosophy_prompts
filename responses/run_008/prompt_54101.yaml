      *   Be direct about the limitations.
      *   *Self-Correction on Typos:* The user said "A typo or two... is fine." I shouldn't intentionally insert errors (that looks patronizing), but I shouldn't obsess over perfect polish either. I will focus on clarity and depth. *Wait, actually, I should check if I should intentionally make typos.* "A typo or two in your answer is fine, honestly, I've made several writing this." -> This is permission, not a request. I will write normally but not stress over perfect proofreading.

  9.  **Final Polish of the Argument:**
      *   Make sure the distinction between "what the character can say" (Access) and "what the reader feels" (Phenomenal) is clear.
      *   Ensure the "Blindsight" section explains *why* it breaks the metaphor (because in fiction, subtext is still text).

  10. **Final Review against constraints:**
      *   Restate debate in craft vocab? Yes.
