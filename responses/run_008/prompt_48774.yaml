answer: |-
  1. "Materials and setup"
  14 students, 7 pairs. Prepare 7 sealed envelope pairs. Inside, slips with point values in ratio 1:2 (e.g., 10/20, 20/40... 640/1280). Ensure values are distinct enough to matter. Provide redemption rate (e.g., 100 points = 1 chocolate coin). Desks arranged in 7 islands. Each student gets one envelope from a pair. Provide index cards for written commitments. No mention of paradox name. Ensure pens are available. Redemption happens at the session end to maintain stakes. The room should allow pairs to see each other but not share data until the tally.

  2. "Round one: the argument surfaces"
  Instruct students not to open envelopes. Ask: "Would you swap with your partner? Write why." Circulate. If no one claims an advantage, prompt: "Suppose you have $X. The other is $X/2 or $2X. Is the expectation higher?" Wait for the 5/4 calculation to emerge from a pair. Have that pair present it. Require everyone to write down the 1.25x argument and commit to swapping. Make them feel the logic is airtight before committing. Encourage them to debate within pairs. The goal is universal endorsement of the switching argument. If a student hesitates, ask them to quantify their uncertainty. The facilitator should not validate the math yet, only ensure the argument is clearly articulated on paper. The physical act of swapping reinforces the decision. Ensure the 'points' feel valuable enough to trigger risk assessment. Enforce direct swaps between partners; pooling obscures the symmetry needed to isolate the logic. Once committed, allow the physical swap. Ensure they sign their commitment cards before any envelope is breached. This written record is crucial for the later confrontation with empirical data.

  3. "Round two: the tally"
  Students open envelopes. Record 'Original' vs 'New' values on the board. Sum the net change. It will be near zero. Highlight the contradiction: the class endorsed a +25% expectation but achieved ~0%. Immediately run Round Two: announce a fixed distribution (e.g., "All pairs were 10/20 or 20/40 with equal probability"). Ask if switching is now rational. Run a quick simulation or calculation. Tally shows specific cases where switching pays, others where it loses, averaging to the known distribution mean. This contrasts the blind assumption with known priors. The empirical collision in Round One must feel sharp. Use the board to show the sum of gains equals the sum of losses. In Round Two, show how knowing the distribution changes the conditional probability.

  4. "The debrief"
  Guide the post-mortem. Map the written commitments to the faulty assumption: P(other=2x|my=x) = 0.5 for *any* x. This requires an impossible uniform prior over infinite money. In Round 2, known probabilities made expectation calculable. Highlight the reductio: if switching is always beneficial, you should switch back immediately, creating infinite value from nothing. The variable 'x' in the formula isn't constant; it represents different amounts depending on whether you hold the smaller or larger envelope. The 5/4 argument treats 'x' as fixed while simultaneously changing its value. This variable binding error is the core logical flaw.
  Connect the written commitments to this specific error. They assumed symmetry where none existed conditional on the value seen. The tally proved the symmetry was only global, not local. In Round Two, the distribution broke the symmetry explicitly. Explain that without a prior distribution, you cannot calculate the conditional expectation. The paradox arises from treating an unknown prior as uniform. The switch-back argument is the quickest way to show the absurdity: if switching is always +25%, you should switch forever. This demonstrates the expectation calculation is invalid.
  When students argued for switching, they implicitly assumed every amount was equally likely. The tally collision shows reality doesn't match that assumption. In the second round, knowing the distribution allowed correct Bayesian updating. If you hold the maximum possible value, switching is always a loss. If you hold the minimum, it is always a gain. The 5/4 argument ignores these boundaries. The debrief must cement that expectation depends on the prior. The switch-back reductio forces them to see the logical inconsistency: you cannot gain value merely by renaming envelopes.
  Crucially, point out that the total money in play is fixed. Switching cannot create value on average. The 1.25x calculation double-counts the smaller amount and under-counts the larger. By separating the cases (holding small vs. holding large), the true expectation emerges as zero. The students' error was merging these distinct states into one variable 'x'. The second round succeeds because the distribution prevents this merging.

  5. "What will predictably go wrong"
  Students may open envelopes prematurely. Fix: Collect envelopes before discussion if needed. Philosophy students might feel outmatched by maths peers on expectation calculations. Fix: Explicitly pair mixed disciplines. The tally might not be perfectly zero due to variance. Fix: Emphasize sample size limits; focus on the *argument* failure, not just the data. If no one generates the 5/4 argument, provide it as a "common intuition" to critique rather than letting stagnation kill momentum. Monitor pairs to ensure both members contribute. Another risk is students focusing on risk aversion rather than expectation. Fix: Remind them the question is about mathematical expectation, not utility. Some may argue chocolate value is non-linear. Fix: Clarify points are linear currency for the game. Ensure the facilitator remains neutral during the argument phase to avoid cueing the solution.

  6. "What the game can't reproduce"
  The game uses finite, bounded values. The true paradox often relies on infinite expectations or improper priors which cannot be physically simulated. Students may conclude the paradox is solved simply because the pot is finite, missing the deeper lesson about conditional probability and variable binding. You must verbally bridge the gap between the capped game and the theoretical infinite case. Explain that even with large caps, the local reasoning error persists regardless of the boundary. The physical limitation hides the mathematical nuance of improper priors.

  7. "Where this design is most likely to fail"
  The conditional probability explanation (P(other=2x|my=x) varies with x) is the weakest link. Maths students might accept it formally but not intuitively. Watch for: students nodding but still claiming "but locally it still looks like 50/50". An interesting failure is them constructing a bounded distribution that mimics the paradox locally. A boring failure is dismissing the tally as "bad luck" without engaging the logic. Listen for debates on prior distributions. If they leave arguing about the chocolate, you failed. If they leave arguing about priors, you succeeded.
