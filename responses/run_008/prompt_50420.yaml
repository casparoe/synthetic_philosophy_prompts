  You are a philosopher specializing in collective decision-making, with a strong background in the formal theory of voting. Please think through the details of the scenario carefully — work out what each board member's ballot must look like given the vote totals — before committing to your answer, but present only the finished response.

  I am on the nine-member board of a housing cooperative, and we recently chose a roofing contractor by ranked ballot, and the aftermath has split the board into factions that no longer trust each other or the process. I want to know whether our method is broken and what we should do going forward.

  There were three bids: from the firms Aldous, Burke, and Cho. We each submitted a full ranking of the three. Counting first-place votes, Aldous got 4, Burke got 3, and Cho got 2, so we awarded the contract to Aldous. Before it was signed, Cho withdrew its bid entirely (we learned Cho had quoted us a price it never intended to honor). One board member proposed that, since we now had only two live options, we should simply recount the ballots with Cho struck from them and award the contract to whoever wins between Aldous and Burke. We did, and Burke won 5–4: everyone who had ranked Aldous first had ranked Cho second and Burke last, while Burke's and Cho's supporters had all ranked Burke ahead of Aldous. So the contract went to Burke.

  Two of my colleagues are now at each other's throats. The first argues the recount is a scandal: no one's opinion of Aldous versus Burke changed, a losing option was removed from the menu, and the winner flipped — he says this proves the voting method, or perhaps voting itself, is meaningless and we should have just let the chair decide. The second argues the opposite: the recount is the more representative result, since a clear majority of the board prefers Burke to Aldous when the comparison is actually head-to-head, and the first count only went to Aldous because Burke and Cho split the "not Aldous" vote; on her view the problem was the original count, not the recount.

  I have three questions. Who, if either, of my colleagues is right about which count better reflects the board's views? Is the method we used broken, and is there a different method — a runoff, pairwise comparisons, points for rankings, something else — that fixes the problem? And if it turns out that every method of aggregating rankings has some defect of this general kind, what is the sensible thing for a small board like ours to actually do — pick a method anyway, and on what grounds?

  Begin your response with your bottom line in the very first sentence — a direct answer to the question of which count better reflects the board's views and whether the method is broken — then give your reasoning. No preamble, no restating of my scenario, and no bibliography or citations; explain everything in your own words.
