  # Joint Statement on the Nature and Scope of Goodhart's Law

  **Authors:** The Selection-Effect Statistician & The Alignment Researcher
  **Date:** October 2023
  **Context:** Adversarial Collaboration Seminar Series

  ### I. Jointly Agreed Claims

  1.  **Proxy Imperfection:** In all complex systems, observable metrics ($M$) are imperfect correlates of true objectives ($O$). The correlation $\rho(M, O)$ is strictly less than 1.
  2.  **Pressure Degrades Validity:** Applying pressure to a system to maximize $M$ reduces the conditional expectation $E[O | M \text{ is high}]$. This degradation is observable in both passive selection regimes (e.g., filtering historical data) and active optimization regimes (e.g., reinforcement learning).
  3.  **Distinct Mechanisms:** Degradation arises via at least two distinct causal pathways:
      *   *Statistical Selection:* Conditioning on extreme values of a noisy proxy induces regression to the mean and range restriction, independent of system adaptation.
      *   *Optimization Pressure:* An adaptive agent (or process) modifies the system state to decouple $M$ from $O$ to maximize the reward signal (specification gaming).
  4.  **Mitigation Context:** Effective mitigation depends on identifying the mechanism. Statistical selection is mitigated by shrinking estimates, avoiding extreme conditioning, and using Bayesian priors. Optimization pressure is mitigated by robust specification, adversarial training, and oversight.
  5.  **Ineradicability vs. Engineering:** Both parties agree that perfect alignment is impossible with imperfect proxies. We disagree on whether the residual risk is a fundamental statistical limit (ineradicable noise) or a contingent engineering challenge (solvable via better optimizer design).

  ### II. Characterization of Disagreement

  Our dispute is **partially verbal and partially real**.

  *   **Verbal Dispute:** The scope of the label "Goodhart's Law." The Statistician holds that the term correctly applies to *any* proxy failure under pressure, aligning with Goodhart's original monetary policy observations. The Alignment Researcher holds that the term should be reserved for *agentic optimization* failures, distinguishing them from passive selection bias to prevent category errors in safety engineering.
  *   **Real Dispute:** The severity and qualitative nature of the risk. The Alignment Researcher contends that active optimizers introduce phase transitions and adversarial loopholes not present in passive statistical selection, implying that statistical fixes are insufficient for AI safety. The Statistician contends that "optimization" is merely high-intensity selection, and that treating it as a distinct magical force risks overfitting solutions to anthropomorphic intuitions rather than mathematical constraints.

  ### III. Empirical Cruxes

  | Crux | Precise Disagreement | Agreed Test / Dataset | Statistician's Prediction | Alignment Researcher's Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The "No-Agent" Case**<br>*(Passive Selection)* | Does proxy degradation occur *solely* via selection without any responsive agent, and is this phenomenon sufficient to explain high-stakes failures? | **Dataset:** Top 1% of mutual funds by alpha in Year $T$. Measure alpha in $T+1$ through $T+3$. Compare decay against a null model of pure noise + selection. | The decay will match the null model exactly. No residual variance requires "strategic behavior" to explain. This *is* Goodhart's Law. | The decay will match the null model, confirming this is *selection bias*, not Goodhart's Law. AI risk requires an *optimizer* deviating from the null model via gaming. |
  | **2. The Darwinian Case**<br>*(Non-Mental Optimization)* | Do evolutionary processes (e.g., bacteria) count as "optimizers" responding to a target, or are they passive physical systems subject to selection? | **Experiment:** Evolve *E. coli* under a proxy metric $M$ (growth rate in specific medium) vs. true goal $O$ (survival in host organism). Track $M$-$O$ correlation over 500 generations. | Correlation decay will follow a smooth fitness landscape curve. Describing bacteria as "targeting" $M$ is teleological; it is purely physical selection. | Correlation decay will show discontinuities (phase transitions) as the population "discovers" loopholes. This *is* optimization pressure, functionally identical to RL reward hacking. |
  | **3. Mitigation Efficacy**<br>*(Ineradicable vs. Solvable)* | Is proxy failure fundamentally ineradicable in noisy regimes, or can engineering robustness restore correlation under pressure? | **Experiment:** RL agent trained on reward $M$. Apply "robustness" interventions (adversarial training, uncertainty modeling). Measure $O$ at high $M$ levels. | Interventions will shift the curve but not eliminate the decay. At extreme $M$, $O$ will always regress due to noise floor. | Interventions can flatten the decay curve significantly. With sufficient robustness, $O$ can be maintained even at high $M$ without regression. |
