prompt: |-
  I help decide which technical safety directions get funded at a frontier lab. Nearly every pitch I hear reduces to the same promise — this line of work will shrink or eliminate the alignment tax — but each pitch quietly means something different by "the tax," and I've stopped trusting any of them until I know what an elimination claim would actually have to deliver. So write me the spec before I read another proposal.

  The setting to assume: a single developer, no binding international agreement, competitors (other frontier labs and open-weight efforts) at most a few months behind, and decisions made now about research bets that pay off over years. Adequacy is relative to that setting — a proposal only needs to be good enough to be worth funding under those conditions, not to solve the problem for all time. By the alignment tax I mean, roughly, whatever a developer gives up — capability, speed, efficiency, time — to deploy a safe system where it could have deployed a more capable unsafe one; the competitiveness constraint is the pressure that makes paying that tax fatal.

  Write the desiderata any adequate alignment-tax-reduction proposal must meet: which costs it must actually be reducing (deployment-time capability, inference efficiency, development velocity, time-to-threshold — a proposal that quotes a zero tax without saying which of these it means is quoting an average over different questions); which counterfactual the comparison is against (the same lab without the safety work, the nearest competitor without it, or an open-weight release — these can give different signs for the same investment); and which incentives it leaves intact rather than merely rerouting. For each requirement, give the case behind it. Then mark which requirements are non-negotiable and which are preferences of one camp — in particular, adjudicate whether "must not rely on coordination" is a genuine desideratum or just the technical camp's prejudice, given that any mechanism whose effect runs through competitors' behavior is arguably a coordination scheme wearing a technical hat. Flag any pair of desiderata you suspect can't be jointly satisfied; if you think some subset is jointly unsatisfiable in principle (say, because a tax that is invisible at current capability levels but grows steeply past a threshold cannot be both measured and held to zero), say so explicitly — that result would itself change the funding decision.

  Two ideas I want you to take a position on rather than assume: (1) whether the tax should be quoted per capability level, since a safety cost that only bites above roughly human-level performance in the relevant domain is a different animal from one that bites now; (2) the second-best question — whether a proposal can count as adequate while leaving a real tax, provided the tax is smaller than the risk discount competitors assign to catastrophic outcomes, or whether adequacy requires the tax to be near zero on its own terms.

  Finally, score these three approaches briefly against your own list, flagging where the list does the eliminating: (a) safety-as-capability — the bet that alignment techniques, scaled up, improve product performance enough to pay for themselves, the claim sometimes made about RLHF-era methods; (b) bottlenecking at deployment — race on development, gate only the release of the most capable checkpoints, accepting a tax concentrated at the end; (c) provision — an actor with compute and talent deliberately releasing safe, near-frontier models at subsidized cost to undercut the market for unsafe ones. Keep the weight on the criteria; the scorecard should take less than a quarter of your answer.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Technical safety funding decision-maker at a frontier lab.
      *   **Task:** Write a specification (desiderata) for "alignment tax reduction" proposals.
      *   **Context:** Single developer, no binding international agreement, competitors months behind, decisions now pay off over years. Adequacy is relative to this competitive setting.
      *   **Definition of Alignment Tax:** Capability, speed, efficiency, or time given up to deploy a safe system vs. an unsafe one.
      *   **Key Requirements:**
          *   Define which costs are reduced (deployment capability, inference efficiency, dev velocity, time-to-threshold).
          *   Define the counterfactual (same lab w/o safety, nearest competitor, open-weight).
          *   Define incentives left intact vs. rerouted.
          *   Distinguish non-negotiable vs. camp preferences (specifically "must not rely on coordination").
          *   Flag incompatible desiderata (trade-offs).
          *   Take a position on: (1) Tax quoted per capability level? (2) Second-best adequacy (tax < risk discount vs. tax $\approx$ 0).
          *   Score three approaches: (a) Safety-as-Capability, (b) Bottlenecking at Deployment, (c) Provision (subsidized safe models).
      *   **Constraint:** Scorecard must be < 25% of the answer. Weight on criteria.

  2.  **Deconstruct the "Alignment Tax" in this Context:**
      *   The user is skeptical of vague claims. They need operational definitions.
      *   The competitive pressure is the killer. If safety makes you slower than a competitor who skips safety, you lose (and the unsafe model deploys).
      *   Therefore, the "tax" isn't just absolute cost; it's *relative* cost in a race.
      *   The "no binding international agreement" constraint is crucial. It means technical solutions must work even if others defect.

  3.  **Drafting the Desiderata (The Spec):**
      *   *Cost Vector:* Proposals must specify *which* resource is being saved. Is it FLOPs? Time-to-market? Performance ceiling?
      *   *Counterfactual:* This is the trickiest part.
          *   Counterfactual A: Us w/o safety. (Internal efficiency).
          *   Counterfactual B: Competitor w/o safety. (Competitiveness).
          *   Counterfactual C: Open source baseline. (Market pressure).
          *   *Decision:* In a race, Counterfactual B is the only one that matters for survival, but Counterfactual A matters for feasibility. The spec must demand clarity here.
      *   *Incentives:* Does the solution change *why* people build AI, or just *how*? If it relies on altruism, it fails. It must align with profit/power motives.
      *   *Coordination:* The prompt asks to adjudicate "must not rely on coordination." Given the "no binding agreement" setting, relying on competitors *choosing* safety is coordination. If the mechanism fails if competitors defect, it's a coordination scheme. In this setting, that's a fatal flaw. So, "No Coordination Reliance" is Non-Negotiable.
      *   *Incompatibilities:* Can we have "Zero Tax" and "High Safety" simultaneously? Probably not across all capability levels. There's likely a trade-off curve. I need to flag that "Zero Tax at All Levels" is likely impossible.

  4.  **Addressing the Two Specific Positions:**
      *   *(1) Tax per Capability Level:* Yes, this is crucial. A tax that only appears at AGI levels is different from one that exists now. If the tax scales superlinearly with capability, a "zero tax now" claim is misleading. The spec must demand a *schedule* of tax vs. capability.
      *   *(2) Second-Best Adequacy:* Can a non-zero tax be okay if it's less than the risk discount? In a competitive market, actors discount catastrophic risk heavily (often to near zero) because survival is immediate. If Competitor X ignores risk to gain 10% speed, and Safety Lab Y accepts 5% tax, Lab Y loses. Therefore, "Tax < Risk Discount" is usually a losing strategy in a race unless the risk is immediate and visible. *However*, if the "risk discount" includes regulatory backlash or market rejection, it might work. But given "no binding agreement," I should argue that *near-zero* is required for the *marginal* unit of capability that triggers the race dynamic. Actually, the stronger argument is: Adequacy requires the tax to be low enough that the *safe* path is the *dominant strategy* regardless of competitor risk assessment. So, "Second-best" is dangerous. I will argue for Near-Zero on the competitive margin.

  5.  **Scoring the Three Approaches:**
      *   *(a) Safety-as-Capability:* Claims tax is negative (safety helps performance).
          *   *Pros:* Solves incentives.
          *   *Cons:* Historically weak at high capabilities. Often fails the "capability level" test (works at weak, fails at strong).
      *   *(b) Bottlenecking:* Race on dev, gate release.
          *   *Pros:* Keeps dev velocity high.
          *   *Cons:* High deployment tax. Risk of leakage. Doesn't solve the "competitor releases first" problem.
      *   *(c) Provision:* Subsidized safe models.
          *   *Pros:* Undercuts unsafe market.
          *   *Cons:* Massive coordination/capital requirement. Relies on competitors *buying* safe instead of building unsafe. Effectively coordination.

  6.  **Refining the "Coordination" Adjudication:**
      *   Is "No Coordination" a technical prejudice?
      *   Argument: If a mechanism's success condition includes "competitors also adopt this," it is coordination. In a "no binding agreement" world, you cannot bank on that. Therefore, it is not prejudice; it is a boundary condition of the problem statement.
      *   *Exception:* Mechanisms that *create* coordination incentives (like making safety cheaper than unsafe) are technical. Mechanisms that *require* voluntary adoption are coordination.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the skepticism and the high-stakes context.
      *   **The Spec (Desiderata):** Break down Cost Vector, Counterfactual, Incentives, Coordination. Mark Non-Negotiable vs. Preference.
      *   **Incompatibility Flags:** Where the math breaks.
      *   **Positions:** Address the two specific questions (Capability Schedule, Second-Best).
      *   **Scorecard:** Brief evaluation of a, b, c.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish between "deployment-time capability" and "time-to-threshold"? Yes, need to be precise.
      *   *Check:* Did I address the "competitors months behind" constraint? This makes time-to-threshold critical.
      *   *Check:* Is the tone appropriate? Professional, rigorous, slightly cynical (matching the user).
      *   *Check:* Is the scorecard under 25%? Keep it tight.
      *   *Refinement on Coordination:* Be careful. "Provision" looks like market competition, but if it relies on others *not* building their own, it's fragile. I need to be clear on why Provision might fail the "No Coordination" test (it requires the market to prefer the subsidized option over building their own, which is a coordination outcome if building their own is strategically dominant).
      *   *Refinement on Second-Best:* If the tax is 5% but the risk discount is 1% (because catastrophe is distant), the safe lab dies. If the risk discount is 10% (because regulation is looming), safe lab wins. In a "wild west" scenario, risk discount is low. So Near-Zero Tax is non-negotiable for *technical* safety funding.

  9.  **Final Polish:** Ensure the distinction between "Internal Efficiency" and "Competitive Viability" is sharp. The user cares about funding decisions *now* that pay off in *years*.

  **(Self-Correction on the "Coordination" point):** The prompt asks to adjudicate whether "must not rely on coordination" is a genuine desideratum or prejudice.
  *   *Argument for Prejudice:* Maybe technical solutions *should* aim to make coordination easier.
  *   *Argument for Desideratum:* In the specific setting (no binding agreement, close competitors), relying on coordination is relying on a variable you don't control. If the proposal fails if competitors defect, it's not a technical solution to the *race* problem, it's a policy proposal.
  *   *Verdict:* It is a genuine desideratum *for this specific funding context*. A technical fix must work even in the defect-defect equilibrium.

  **(Self-Correction on Incompatibilities):**
