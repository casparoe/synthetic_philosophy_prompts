answer: |-
  # Specification for Alignment-Tax-Reduction Proposals

  **Context:** Single developer, non-cooperative equilibrium, competitors <6 months behind.
  **Objective:** Fund research that renders safety competitive without relying on external restraint.

  ## 1. Desiderata

  ### A. The Cost Vector (Non-Negotiable)
  A proposal must explicitly identify which dimension of the "tax" it reduces. Aggregating these into a single "tax" number is prohibited.
  *   **Deployment-Time Capability:** Does safety reduce the maximum performance ceiling (e.g., accuracy, reasoning depth) relative to an unsafe baseline?
  *   **Inference Efficiency:** Does safety increase compute latency or cost per token at runtime?
  *   **Development Velocity:** Does safety slow down the training cycle (e.g., extra evaluation steps, slower gradient updates, data filtering overhead)?
  *   **Time-to-Threshold:** Does safety delay the date a specific capability level is reached?

  **Case:** In a race where competitors are months behind, *Time-to-Threshold* and *Development Velocity* are often more fatal than *Inference Efficiency*. A proposal claiming "zero tax" on efficiency but admitting a 3-month delay on threshold is not zero-tax; it is a losing strategy.

  ### B. The Counterfactual (Non-Negotiable)
  A proposal must define the baseline against which the tax is measured.
  *   **Internal Counterfactual:** Cost relative to *this lab* ignoring safety. (Measures technical overhead).
  *   **Competitive Counterfactual:** Cost relative to the *nearest competitor* ignoring safety. (Measures survival).
  *   **Market Counterfactual:** Cost relative to *open-weight* baselines. (Measures adoption).

  **Case:** A solution that reduces the Internal tax but leaves the Competitive tax positive is a charity project, not a safety intervention. If the competitor can deploy a dangerous model 2 months faster, the "safe" model never becomes the Schelling point. Proposals must optimize for the Competitive Counterfactual.

  ### C. Incentive Compatibility (Non-Negotiable)
  The proposal must leave the profit/power incentive to deploy intact. It cannot rely on the developer *choosing* to pay the tax.
  *   **Requirement:** The safe path must be the path of least resistance or highest return *at the moment of decision*.
  *   **Prohibition:** Mechanisms that rely on "norms," "pledges," or "responsible scaling" without technical enforcement are excluded.

  **Case:** In a non-cooperative setting, any mechanism that requires a developer to sacrifice competitive advantage for global safety will be defected against. The safety mechanism must be self-enforcing (e.g., the unsafe model is technically broken, not just ethically discouraged).

  ### D. Coordination Reliance (Adjudication: Non-Negotiable)
  **Verdict:** "Must not rely on coordination" is a **genuine desideratum**, not technical prejudice.
  **Case:** You specified "no binding international agreement" and "competitors months behind." In this game-theoretic setting, any mechanism whose success condition includes "competitors also adopt this" is a coordination scheme. If a technical fix only works if others use it, it is not a technical fix for the race dynamic; it is a policy proposal disguised as engineering. Given the constraints, we cannot fund policy hopes. We must fund solutions that work in the defect-defect equilibrium.

  ## 2. Incompatibility Flags

  **Flag 1: Zero Tax vs. High Assurance**
  It is likely impossible to satisfy "Zero Tax on Capability" and "High Assurance of Alignment" simultaneously at the frontier. Verification generally requires redundancy or constraints, which incur cost.
  *   **Implication:** Proposals claiming "Negative Tax" (safety improves capability) across all domains should be treated as high-skepticism until empirically proven at scale. Expect a trade-off curve.

  **Flag 2: Velocity vs. Deployment Safety**
  Reducing *Development Velocity* tax often increases *Deployment Risk* (less time for evals). Reducing *Deployment Risk* often increases *Velocity* tax (more checks).
  *   **Implication:** A proposal cannot claim to reduce both without a mechanistic explanation of how safety checks become computationally cheaper than unsafe training.

  **Flag 3: Visibility vs. Control**
  A tax that is invisible at current capability levels but grows steeply past a threshold (e.g., "safety only gets hard at AGI") cannot be measured now.
  *   **Implication:** Proposals relying on future scalability without current empirical grounding on the *slope* of the tax curve are unfundable. We need the derivative, not just the intercept.

  ## 3. Positions on Specific Questions

  ### (1) Tax Quoted Per Capability Level
  **Position:** **Mandatory.**
  A proposal must provide a schedule: *Tax(Capability)*.
  **Reasoning:** A safety cost that is 0% at human-level but 50% at superhuman-level is not a solution; it is a cliff. Since the risk is concentrated at high capability, a tax that scales superlinearly with capability is functionally equivalent to a hard stop. If the tax bites exactly where the risk spikes, the "reduction" is illusory. We need to know if the tax is constant, sublinear, or superlinear relative to capability gains.

  ### (2) Second-Best Adequacy (Tax < Risk Discount)
  **Position:** **Inadequate.**
  A proposal is not adequate if it relies on the tax being smaller than the competitor's risk discount.
  **Reasoning:** In a race without binding agreements, competitors discount catastrophic risk heavily (often to near zero) because the catastrophe is probabilistic and future, while losing the race is certain and immediate. If your proposal requires the competitor to value existential risk at >10% to make safety competitive, it will fail. Adequacy requires the tax to be near-zero on its own technical terms, making safety the dominant strategy *regardless* of the competitor's risk assessment. Relying on their risk discount is relying on their values, which is a coordination failure.

  ## 4. Scorecard

  | Approach | Cost Vector Clarity | Counterfactual Fit | Incentive Compatible | Coordination Reliance | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(a) Safety-as-Capability**<br>*(Alignment improves performance)* | **Fail.** Often conflates capability with safety. Rarely distinguishes inference vs. dev tax. | **Mixed.** Works on Internal, fails on Competitive if unsafe scaling is faster. | **Pass.** If true, incentives align perfectly. | **Pass.** Purely technical. | **High Risk.** Historically, safety constraints reduce raw optimization power. If the claim relies on RLHF-era dynamics scaling to AGI, it fails the *Capability Level* test. Fund only if empirical slope is proven. |
  | **(b) Bottlenecking at Deployment**<br>*(Race on dev, gate release)* | **Pass.** Explicitly accepts Dev Velocity tax = 0, Deployment tax = High. | **Fail.** Competitive Counterfactual is fatal. If you gate and they don't, they win. | **Fail.** Incentive to leak or bypass gate is extreme. | **Fail.** Relies on internal governance holding against external pressure. | **Reject.** Solves internal safety, ignores race dynamics. In a "months behind" setting, this guarantees the unsafe competitor deploys first. |
  | **(c) Provision**<br>*(Subsidized safe models)* | **Pass.** Reduces Market Counterfactual cost. | **Fail.** Does not reduce Competitive Counterfactual for *building* unsafe models. | **Mixed.** Incentivizes buying safe, but not building safe. | **Fail.** Relies on competitors *choosing* to buy rather than build. This is coordination via market forces. | **Reject.** This is a coordination scheme wearing a technical hat. It requires the competitor to prefer your subsidized model over sovereign capability. In a strategic race, they will build their own to avoid dependency. |

  **Summary:** None of the three currently meet the Non-Negotiable spec for this specific competitive setting. (a) is the only candidate that *could* work technically but lacks empirical backing at frontier scales. (b) and (c) fail the Competitive Counterfactual and Coordination constraints respectively.
