      *   *Section 4: The Oedipus Effect.* Compare with Economics. If economics can model expectations, why can't sociology? This suggests Popper underestimated the capacity of social science to internalize reflexivity.
      *   *Section 5: Ranking Defeaters.*
          1.  Predicting Knowledge Growth (Fatal).
          2.  Reflexive Modeling of Long-Term Trends (Fatal/Severe).
          3.  Structural Predictions without Knowledge Input (Awkward/Manageable).
