      *   *Section 2: The Empirical Barrier (Structural-Demographic Models).* Address the user's specific example (Turchin et al.). If these work, do they falsify Popper? Only if they claim to predict *content* of history, not just *structural stress*. Distinguish between "state breakdown" (structural) and "historical destiny" (historicist).
