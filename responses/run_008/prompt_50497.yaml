          *   Type 2: *Exemption/Erasure.* The person is removed from the "blame game" entirely. (Example: Uncle with brain tumor, Dog). They become "weather," not an agent. No apology owed.
      *   **The Question:** Is there a name for this distinction? Is there a principle for what decides which side a case falls on?
