      *   *Agency Preservation:* In Type 1, the core self is intact. The behavior is an anomaly caused by external pressure. In Type 2, the mechanism of choice itself is broken or absent.
      *   *Recoverability/Addressability:* Can I talk to you about this? With the friend, yes ("Hey, that hurt"). With the tumor/uncle, no (The tumor doesn't listen). With the dog, no (Dog doesn't understand moral norms).
      *   *Identity Continuity:* Is this *you*? Friend = Yes, under stress. Uncle = No, that's the pathology.

  5.  **Drafting the Response:**

