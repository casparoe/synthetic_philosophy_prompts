  2.  **Identify Existing Philosophical/Psychological Concepts:**
      *   *Excuses vs. Justifications:* In law and ethics, this is a classic distinction (Hart, Austin).
          *   Justification: The act was right/okay given the context (Self-defense).
          *   Excuse: The act was wrong, but the agent isn't fully responsible (Insanity, Duress).
          *   *Critique:* This doesn't quite capture the user's nuance. The user's Type 1 is a standard excuse. Type 2 feels more like a denial of *agency* rather than just an excuse.
      *   *P.F. Strawson's "Freedom and Resentment":* This is the heavy hitter here. Strawson distinguishes between *participant reactive attitudes* (resentment, gratitude, anger) and *objective attitudes* (seeing someone as a subject for treatment, management, or therapy).
          *   Type 1 (Friend): Participant attitude. We still see them as part of the moral community, just stressed.
          *   Type 2 (Uncle/Dog): Objective attitude. We see them as objects of social policy or psychological cause-and-effect, not moral agents.
      *   *Fischer and Ravizza (Responsibility):* Discusses guidance control vs. regulatory control.
      *   *Medical/Psychological Model:* Pathologizing behavior (it's the illness, not the person).

