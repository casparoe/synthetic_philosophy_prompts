      *   **The Established Term (Strawson):** Introduce P.F. Strawson's *Participant vs. Objective Attitudes*. This gives the user the academic grounding they asked for ("Is there a name?").
      *   **Explain the Distinction:**
          *   Type 1 = *Mitigated Agency.* (Strawson's Participant Attitude). You are still a player in the moral game.
