answer: |-
  You have hit on one of the most sophisticated distinctions in moral philosophy, one that most people gloss over with the blanket term "free will." Your intuition is correct: these are not just different *amounts* of blame; they are different *categories* of judgment.

  There is a name for this, and there is a framework for where the line is drawn.

  ### The Established Name: Participant vs. Objective Attitudes

  The philosopher who mapped this territory most famously is **P.F. Strawson**. In his seminal essay *"Freedom and Resentment"* (1962), he distinguished between two stances we take toward other beings:

  1.  **The Participant Attitude (Your Type 1):** We view the person as a member of the moral community. We feel reactive emotions like resentment, gratitude, or indignation. When they hurt us, we hold them accountable. Explanations (like grief) might *modulate* these feelings, but they don't abolish the relationship. You still expect an apology because you still see them as a "you."
  2.  **The Objective Attitude (Your Type 2):** We view the person as an object to be managed, treated, or endured. We do not feel resentment; we feel fear, pity, or clinical detachment. You don't get mad at a hurricane, and you don't get mad at a brain tumor. The agent has been removed from the equation.

  In legal theory, a similar distinction exists between **Mitigation** (Type 1: "I did it, but here's why I'm less culpable") and **Exemption** (Type 2: "I am not capable of being culpable").

  ### What Flips the Switch?

  You asked for the principle that decides which side a case falls on. It isn't about how "bad" the cause is (a dead mom is tragic, a tumor is tragic). It is about **Agency Preservation.**

  The switch flips from Type 1 to Type 2 based on three specific tests. If the explanation fails these tests, you stay in Type 1. If the explanation passes them, you move to Type 2.

  #### 1. The Test of Addressability
  Can you still talk to them about it?
  *   **Friend (Type 1):** Yes. You can say, "I know you're grieving, but yelling at me hurt." There is a channel of communication where they can acknowledge your humanity.
  *   **Uncle/Dog (Type 2):** No. Yelling at the dog doesn't work because the dog cannot process the moral claim. Yelling at the tumor-ridden uncle doesn't work because the mechanism required to process the claim is broken.
  *   **The Principle:** If the explanation suggests the person *cannot receive* moral feedback, they are exempted. If they *can* receive it but are currently struggling, they are mitigated.

  #### 2. The Test of Identity Ownership
  Does the actor "own" the impulse?
  *   **Friend (Type 1):** Grief is an emotion *felt by* the person. It is part of their experience. When they yell, it is an expression of their pain, however misdirected. It is still *them*.
  *   **Uncle (Type 2):** We say "That's the tumor talking." We linguistically separate the person from the pathology. The tumor is an invader, a foreign agent hijacking the machinery. The dog's nature is instinct, not moral choice.
  *   **The Principle:** If the cause is viewed as **internal** (their emotion, their stress), blame shrinks but remains. If the cause is viewed as **alien** (a lesion, a seizure, a lack of cognitive capacity), blame is ejected.

  #### 3. The "Future Self" Test
  Will the "sober" version of this person agree with your assessment?
  *   **Friend (Type 1):** When your friend heals, they will likely say, "I was wrong to yell at you." Their future self aligns with your judgment.
  *   **Uncle (Type 2):** If the tumor isn't removed, there is no "future self" to align. If it is removed, they might say, "I don't remember that," or "That wasn't me."
  *   **The Principle:** Type 1 assumes a continuous moral self. Type 2 assumes a broken or interrupted moral self.

  ### The Gray Zone: Trauma and Childhood

  This is where your question gets difficult, and where your English teacher's "free will" answer fails.

  When you ask about childhood trauma, you are asking about the **Threshold of Exemption.**

  If someone abuses you because they were abused as a child, is that Type 1 or Type 2?
  Most of society treats this as **Type 1 (Mitigation).** We say, "I understand why you are broken, but you still owe me an apology."

  Why? Because unlike the brain tumor, trauma does not usually destroy the *capacity* for moral reasoning (Addressability). It warps it. The person still has agency, but their agency is operating with damaged software.

  **However, the line is porous.**
  If the trauma resulted in a dissociative state, a psychotic break, or severe personality fragmentation, it can flip to Type 2. We see this in the legal "Insanity Defense." It is not enough to have a bad childhood (Type 1); you must prove that the childhood damage destroyed your ability to distinguish right from wrong at the moment of the act (Type 2).

  ### A New Term for the Distinction

  Since "Participant/Objective" is a bit academic, and "Mitigation/Exemption" is too legalistic, let's coin a terms that fit your "Weather vs. Person" intuition.

  1.  **Friction (Type 1):** The person is still a moral agent, but there is resistance. The explanation adds "friction" to your anger, slowing it down, but the engine of blame still runs.
  2.  **Neutral (Type 2):** The person is taken out of the circuit. The explanation acts as a "neutral" gear. The engine of blame disengages entirely.

  ### The Edge of the Map

  You asked where the edges are. Here is the principle:

  **The edge is not determined by the *cause* of the behavior, but by the *status of the relationship*.**

  *   If I view you as a **Peer**, I offer you **Friction**. I assume you can do better, so I hold you to it.
  *   If I view you as a **Patient** (or a pet, or a force of nature), I offer you **Neutral**. I assume you *cannot* do better, so I manage you instead.

  The danger zone—and where most family fights happen—is when one person is offering **Neutral** ("Dad, you're sick, we don't blame you") and the other demands **Friction** ("I am still your father, treat me with respect").

  So, to answer your specific question: The distinction exists, it's well-documented in philosophy (Strawson), and the deciding factor is **Addressability**. If the explanation implies the person can no longer hear you, they become weather. If they can still hear you, they remain a person, just a struggling one.
