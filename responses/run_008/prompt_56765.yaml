      *   **Yeses (3, 4):** In these cases, she accepts that the phenomenology itself shifted (the phoneme *heard* is different; the snake *looks* bigger).

  **2. The Entrenched System Principle (ESP)**
  *   **The Rule:** Cognitive penetration occurs if and only if the influence on perception stems from a **deeply entrenched, subpersonal cognitive system** (e.g., native language, phobic affect, expert calibration) rather than a transient propositional belief, a temporary goal, or a physiological state.
  *   **Fit with Past Rulings:**
      *   **Nos (1, 2, 5, 6):** In (1) the cause is a transient belief ("knowing the segments are equal"); in (2) it is contextual classification; in (5) a temporary search goal; in (6) a personal-level misidentification. None are entrenched subpersonal systems.
      *   **Yeses (3, 4):** In (3) the cause is the native lexicon (a lifelong, automatic system); in (4) it is a phobia (a deep-seated affective module).

  ### Where They Come Apart

  The rules diverge when a **transient belief** successfully alters **phenomenology**.
  *   **PDP** predicts **Penetration**: If the subject sincerely reports that the sensory quality changed, the source of the change (belief vs. system) matters less than the phenomenal result.
  *   **ESP** predicts **Not Penetration**: Even if the phenomenology changes, if the cause is a one-off belief or instruction rather than a calibrated system, it counts as *bias* or *suggestion*, not genuine cognitive penetration of the perceptual module.

