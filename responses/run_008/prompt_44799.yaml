  # SEMINAR HANDOUT: MORAL THEORY (AGGREGATION UNIT)
  **Specification for an Adequate Account of Numbers and Burdens**

  ### I. Preamble
  Each year, this unit concludes in a stalemate. Contractualists insist that one person's larger burden can never be outweighed by many smaller burdens; Utilitarians insist that refusing to sum across persons is superstition; and the seminar ends without a principled adjudication. We have exhausted the theories. We have not yet specified the target.

  Before we read another word of the literature, we must agree on what a successful theory looks like. The following is not a theory. It is a specification. It is a list of desiderata that any adequate account of when, and how much, numbers count must deliver. If a theory cannot satisfy these requirements, it is incomplete. If the requirements themselves are inconsistent, we must know that before we begin.

  ### II. The Desiderata
  *Each requirement is marked as either **Non-Negotiable** (a fixed point of moral reasoning we are unwilling to abandon) or **Contested Prejudice** (a commitment specific to a theoretical camp that requires defense).*

  **1. The Rescue Intuition (Taurek/Scanlon)**
  *   **Requirement:** In a standard rescue case where an agent must choose between saving one person from death or saving five others from death (with all other factors equal), the theory must verdict that saving the five is morally required, or at least strongly permissible in a way that saving the one is not.
  *   **Motivation:** Taurek's 1977 case. While Taurek argued for a coin toss, the overwhelming pre-theoretic intuition—and Scanlon's subsequent observation—is that the five have a collective claim that outweighs the one, provided the harm is identical. A theory that mandates a coin toss here fails to capture the moral significance of numbers in survival contexts.
  *   **Marking:** **Non-Negotiable.** To deny this is to sever moral theory from basic human responsiveness to scale in life-and-death contexts.

  **2. The Catastrophe Constraint (Scanlon's Contrast Case)**
  *   **Requirement:** There must exist some threshold of burden severity such that a single person's catastrophic loss cannot be outweighed by the aggregation of trivial or minor burdens across a large population, even if the sum of the minor burdens is mathematically greater.
  *   **Motivation:** Scanlon's *What We Owe to Each Other* (1998). If one person will lose their life (or suffer permanent disability) and a million others will suffer only a mild headache, we are unwilling to sacrifice the one to relieve the million. Summing must have limits.
  *   **Marking:** **Non-Negotiable.** This is the core anti-utilitarian intuition. Without it, the "separateness of persons" collapses into a single container of utility.

  **3. The Continuity Requirement (The Ladder)**
  *   **Requirement:** The theory must provide a principled explanation for transitions in verdict across a continuous series of cases. It cannot posit "magic numbers" where a verdict flips without a corresponding change in the moral landscape.
  *   **Motivation:** The Instructor's Ladder. Imagine a series of cases starting with the Rescue Intuition (1 life vs. 5 lives) and ending with the Catastrophe Constraint (1 life vs. 1,000,000 headaches). In between, the burden on the many decreases by a small step while their number increases. If a theory counts numbers at the top and refuses them at the bottom, it must identify *where* and *why* the permission to aggregate stops.
  *   **Marking:** **Non-Negotiable.** Moral principles should not be arbitrary. If the difference between Rung 45 and Rung 46 is negligible, the verdict should not flip sharply between them without a justifying reason.
  *   **Note:** This is the desideratum the Ladder strains most. It demands a precision that moral concepts may not possess.

  **4. The Separateness Constraint (Intrapersonal vs. Interpersonal)**
  *   **Requirement:** The theory must distinguish between trade-offs within a single life and trade-offs across different lives. It must explain why an individual may rationally sacrifice a year of comfort to avoid a great harm to themselves, while a society may not be permitted to impose that same sacrifice on one person to benefit others.
  *   **Motivation:** The distinction between prudence and morality. We accept intrapersonal aggregation (I trade my headache for my broken arm) without controversy. The crux of the debate is whether *your* headache and *my* headache can be summed to outweigh *my* broken arm.
  *   **Marking:** **Non-Negotiable.** This is the "Separateness of Persons" objection. Collapsing this distinction treats society as a super-individual, which is a category error.

  **5. The Fair Chance Requirement (Ex Ante vs. Ex Post)**
  *   **Requirement:** The theory must account for the moral significance of procedural fairness (ex ante) alongside outcome fairness (ex post). It must explain when a lottery is preferable to a deterministic choice, even if the expected outcome is identical.
  *   **Motivation:** The Last Dose Case. If one dose of medicine remains and two patients will die without it, a lottery gives each a 50% chance of survival. Ex post, one dies either way. Ex ante, the lottery respects the equal claim of both. A theory that looks only at outcomes cannot distinguish the lottery from a biased selection.
  *   **Marking:** **Contested Prejudice.** Utilitarians typically reject this (only outcomes matter). Contractualists and Deontologists typically embrace it (fairness of procedure matters). We include it to test whether a theory can accommodate the intuition without collapsing into inconsistency.

  ---

  ### III. Structural Tensions: An Impossibility Result
  *Students should note: The following analysis is part of the unit's design. We are not assuming a solution exists.*

  **1. Joint Unsatisfiability**
  There is a strong argument that a subset of these desiderata is jointly unsatisfiable. Specifically, the triad of **The Rescue Intuition**, **The Catastrophe Constraint**, and **The Continuity Requirement** creates a Sorites paradox.
  *   We must save the five in the Rescue case (Desideratum 1).
  *   We must save the one in the Catastrophe case (Desideratum 2).
  *   We must not draw an arbitrary line between them (Desideratum 3).

  If the transition from "five lives" to "one million headaches" is continuous, any theory that flips its verdict from "Save Many" to "Save One" must cross a rung where the moral difference is negligible. If the theory respects Continuity, it cannot explain the flip. If it explains the flip, it violates Continuity by positing a threshold that looks arbitrary (e.g., "543,211 headaches matter, but 543,210 do not").

  **Resolution:** To resolve this, we must likely reject **The Continuity Requirement** in its strictest form. We must accept that moral concepts possess **vagueness**. There is no precise number where aggregation stops being permissible; there is only a range of indeterminacy. A theory that demands precise cutoffs is asking for a mathematical solution to a conceptual problem. The specification must be adjusted to allow for "moral vagueness" rather than "arbitrary cutoffs."

  ---

  ### IV. Theoretical Filter: Exclusionary Work
  *This section identifies which requirement does the heaviest lifting in filtering existing theories.*

  **The Primary Filter: The Catastrophe Constraint (Desideratum 2)**
  While all desiderata are demanding, **The Catastrophe Constraint** does the most exclusionary work against the familiar contenders.

  *   **Utilitarianism:** Fails immediately. It sums all burdens regardless of distribution or severity. It cannot explain why one person's death outweighs a million headaches without abandoning its core axiom.
  *   **Prioritarianism:** Strains significantly. Depending on the weighting function, it often collapses into Utilitarianism at the margins or fails to block the aggregation of small burdens against a catastrophic one.
  *   **Taurek-Inspired Views:** Passes this constraint (by refusing to aggregate), but consequently fails **The Rescue Intuition** (Desideratum 1).
  *   **Scanlon-Style Contractualism:** Passes this constraint (it is built for it), but consequently strains against **The Continuity Requirement** (Desideratum 3) and **Parfit's Challenge**. If complaints cannot be aggregated, how do we handle Parfit's case where one person suffers *slightly* more than a million others? Contractualism risks verdicts that allow vastly more total suffering to honor a nearly invisible difference in complaint strength.

  **Conclusion for the Unit:**
  The Catastrophe Constraint is the wedge. It eliminates the simplest theory (Utilitarianism) and forces the remaining theories into the complex maneuvering regarding the Ladder and Continuity. If a theory cannot satisfy the Catastrophe Constraint, it is not a theory of *rights* or *claims*; it is a theory of *states of affairs*. Our task is to see if a theory can satisfy the Constraint without falling into the impossibility trap of the Ladder.

