answer: |-
  I commit to your diagnosis: **This is a dispute about the aim of science wearing the costume of a dispute about a mathematical object.**

  The stalemate exists because the two camps are no longer playing the same game. The PBR theorem did exactly what you suspect: it successfully ruled out the "hard" psi-epistemic view (where distinct quantum states correspond to overlapping probability distributions over a shared underlying reality) *within the ontological models framework*. But the surviving epistemic camps (QBism, Neo-Copenhagen) do not accept the ontological models framework. They deny the premise that there is a "physical situation" $\lambda$ independent of the agent to begin with.

  Therefore, when an ontologist says, "The wavefunction must be real because PBR," they mean, "The mathematical object $\psi$ corresponds one-to-one with the mind-independent state of the system." When an epistemologist says, "The wavefunction is information," they mean, "The mathematical object $\psi$ is a normative tool for an agent to place bets on future experiences."

  They are using the word "real" to do two different jobs. For the ontologist, "real" means **causal/existential** (it exists in the territory). For the epistemologist, "real" means **resistant** (the world pushes back against my expectations, and $\psi$ quantifies that resistance). The debate is frozen because one side is asking for a map of the territory, and the other is handing you a compass and saying, "The territory is unknowable, but this will keep you from walking off a cliff." Neither can prove the other wrong because they value different theoretical virtues: the ontologist values *completeness of description*, while the epistemologist values *consistency of usage*.

  ### How to Turn This Back Into a Substantive Disagreement

  If this is truly just a disagreement about aims, it should be possible to force it back into a substantive empirical disagreement by finding a scenario where **treating $\psi$ as information yields a different physical prediction than treating $\psi$ as stuff.**

  Currently, standard unitary quantum mechanics is compatible with both (Many Worlds treats $\psi$ as stuff; QBism treats it as info). To break the deadlock, we need an experiment where the *physical consequences* of "information updating" differ from the *physical consequences* of "physical collapse" or "ontic evolution."

  There are two specific experimental frontiers that would force this issue:

  **1. Objective Collapse Tests (e.g., CSL/GRW models)**
  This is the cleanest divider. In psi-ontic collapse theories (like GRW), the reduction of the wavefunction is a physical process that happens in nature, independent of observers. This process must conserve energy only statistically, implying a tiny, spontaneous heating effect or radiation emission from matter.
  *   **The Test:** If experiments (like X-ray emission measurements in Germanium detectors or optomechanical cantilevers) detect this spontaneous radiation, the wavefunction (or the mechanism driving its change) has direct energy-momentum transfer. Information updates do not spontaneously emit X-rays; physical fields do.
  *   **The Verdict:** A positive detection kills the pure psi-epistemic view. You cannot claim $\psi$ is merely "knowledge" if the act of $\psi$ changing releases heat into the environment without an external agent interacting with it.

  **2. Gravitational Induced Entanglement (The BMV Experiment)**
  Proposed by Bose, Marletto, and Vedral, this experiment tests whether gravity is a quantum mediator.
  *   **The Test:** Put two masses in spatial superposition. If they become entangled solely through their gravitational interaction, the gravitational field must be able to sustain a superposition.
  *   **The Verdict:** If gravity couples to the *superposition* (the ontic wavefunction distribution) rather than the *average mass density* (the expectation value), it suggests the superposition itself has ontic weight. If gravity only sees the average mass (semiclassical gravity), it supports a view where the wavefunction is merely a statistical descriptor of where the mass *might* be.
  *   **Why it matters:** If the gravitational field entangles the masses, the "information" view struggles to explain what is entangling what without a mediating ontic field. It forces the epistemologist to admit that the superposition has a physical footprint on spacetime geometry, blurring the line between "map" and "territory."

  ### Conclusion

  The field is frozen because PBR forced the epistemicists to abandon *realism about the underlying state*, not *instrumentalism*. They retreated to a position where the question "What is the wavefunction?" is replaced by "How should I use the wavefunction?"

  Until we probe regimes where **information processing has a different energy signature than physical dynamics** (Objective Collapse) or where **gravity probes the superposition directly** (BMV), the debate will remain a philosophical standoff. The ontologists are looking for the furniture of the universe; the epistemologists are writing the user manual. You cannot refute a user manual by pointing out it doesn't list the atoms in the desk, and you cannot refute a furniture catalog by saying it doesn't tell you how to sit.

  My diagnosis is that you are correct: it is a category error to treat this as a single substantive question under current experimental constraints. The substantive question only re-emerges if the wavefunction is shown to carry energy or gravitate directly. Until then, it is a dispute over whether physics is a description of nature or a guide for agents within nature.
