answer: |-
  ### Part 1: Reserve Police Battalion 101 (Józefów and Beyond)

  As a historian reading the interrogation transcripts alongside a social psychologist reading the group dynamics, I attribute the following weights to the motivations of Battalion 101. Note that these percentages reflect the *entirety* of their operational record, not solely the morning of Józefów.

  **(a) Ideological Antisemitism: 20%**
  *   **Best Fit:** It explains why the men accepted the premise that Jews were a legitimate target without moral revolt before arriving in Poland.
  *   **Strains:** It fails to account for the lack of Nazi Party membership among the reservists and Trapp's own visible distress, which signals this was not a unit of ideologically driven fanatics.

  **(b) Conformity/Obedience to Authority: 20%**
  *   **Best Fit:** It accounts for the initial freeze-response where men followed the order simply because a uniformed superior issued it in a military context.
  *   **Strains:** It cannot explain why men volunteered for subsequent "Jew hunts" or engaged in gratuitous violence when no superior was directly watching.

  **(c) Primary-Group Loyalty: 30%**
  *   **Best Fit:** This handles the opt-out data best; testimonies consistently cite the fear of appearing "weak" or dumping work on comrades as the reason for staying in line.
  *   **Strains:** It is circular, as it explains why they killed together but fails to explain why the group norm was established as "killing" rather than "refusing" in the first place.

  **(d) Careerism and Fear of Sanctions: 10%**
  *   **Best Fit:** It explains the behavior of the few career officers within the battalion who sought promotion through demonstrated efficiency.
  *   **Strains:** Major Trapp explicitly stated there would be no punishment for opting out, and historical records show no sanctions were applied to the twelve men who initially stepped forward.

  **(e) Gradual Desensitization: 20%**
  *   **Best Fit:** This explains the transition from men vomiting at Józefów to conducting efficient, routine massacres in the months following.
  *   **Strains:** It offers zero explanatory power for the first day at Józefów, where the horror was fresh and the psychological numbing had not yet occurred.

  ***

  ### Part 2: Comparative Case (Rwanda Interahamwe)

  If we swap Battalion 101 for the **Interahamwe militia during the 1994 Rwandan Genocide**, the explanatory weights must shift drastically because the structural and social mechanisms of violence differed. The German unit was a formal military hierarchy operating away from home; the Interahamwe were civilian neighbors killing neighbors within their own communities under intense local pressure.

  **Revised Percentages for Interahamwe:**
  *   **(a) Ideological Antisemitism (Hutu Power): 45%**
  *   **(b) Conformity/Obedience: 10%**
  *   **(c) Primary-Group Loyalty: 25%**
  *   **(d) Careerism/Fear: 10%**
  *   **(e) Desensitization: 10%**

  **Defense of the Revision:**
  I have more than doubled the weight of **Ideology (20% → 45%)** because Hutu Power propaganda (via RTLM radio) framed the Tutsi not just as enemies, but as an existential, immediate threat to every Hutu household, creating a visceral motivation absent in the bureaucratic antisemitism of 1942 Poland. Consequently, **Obedience (20% → 10%)** drops because the Interahamwe lacked the rigid Wehrmacht chain of command; killing was often decentralized and initiated by local leaders rather than top-down orders. **Primary-Group Loyalty (30% → 25%)** remains high but shifts from "military comrades" to "community survival," while **Desensitization (20% → 10%)** is reduced because the violence was intimate and immediate (machetes vs. rifles), requiring less psychological numbing to begin but creating trauma faster. Finally, **Fear (10% → 10%)** remains constant but changes nature; in Rwanda, the fear was not of military sanctions, but of being labeled a Tutsi sympathizer and killed oneself.
