  I've been going in circles on epiphenomenalism and I want to stop and write down what I'm actually grading these theories on before I read any more of them. Here's the wall I keep hitting: if the physical world is causally closed and my experience of red just rides along without pushing anything around, then when I say "that looks red to me," the saying is caused entirely by physical stuff in my head, and none of that stuff is the experience itself. So my report landing on the truth would be one enormous coincidence, or maybe I'm never in a position to know about the experience at all. That can't be right, so something in the setup is wrong -- I just don't know which piece.

  So: write me the desiderata -- what any adequate theory of how conciousness relates to the physical has to deliver. Fix the purpose like this: good enough to make sense of the fact that we treat people's reports about their own experience as real knowledge and not lucky noise. The cases I'd want in: a patient coming out of anesthesia reporting that she felt something during the operation (we believe her, and her report counts as data), and a blindsight patient insisting he sees nothing over there even while guessing way above chance (we believe him too, and the theory has to leave room for that gap between processing and experience). Add whatever else belongs on the list. For each requirement, give the case or consideration behind it, and mark which ones you think are non-negotiable versus which are just sacred to one camp. Make sure to cover which puzzles the theory has to dissolve, and which distinctions it has to respect -- I keep wondering whether the distinction between a report being *caused by* an experience and a report being *about* it can survive at all; tell me honestly if it can't.

  Then the part I most want: is some subset of the requirements jointly unsatisfiable? My hunch is yes -- causal closure plus first-person access can't both come out clean -- and if so, the list itself is basically the result. Say which requirement you'd let go and what it costs to drop it.

  And since you're the one building the spec, be as hard on it as you'd be on any theory: tell me which requirement you're least confident is genuinely a requirement, and what would change your mind about it -- what argument or consideration would get you to strike it from the list. Also point at the step in your reasoning you think is most likely to go wrong. Last thing, briefly: how do reductive physicalism, epiphenomenalism, and interactionism do against the list? A sentence each is plenty -- I'll do the real scorecard myself.
