  Here is the breakdown of Greta's aesthetic system, her likely verdicts on the new exhibition, and the specific rule she is actually running.

  ### Part 1: The Predictions

  Based on her track record, here is how Greta will likely classify the three new pieces:

  **1. The Avant-Garde Composition (6 years old, critics love, audiences hate)**
  *   **Verdict:** **Actually Beautiful.**
  *   **Reasoning:** This mirrors her experience with the Noh play. She values art that requires a "learning curve" to access. The fact that general audiences hate it signals that it isn't "engineered" for easy consumption (like the pop song or country track). The fact that "serious critics" call it a masterpiece aligns with her Bach verdict; she trusts qualified judgment over popular appeal. The only risk is the age (6 years vs. centuries), but her Noh verdict suggests she prioritizes *personal* effort to understand over *historical* endurance.

  **2. The Sentimental 1880s Poem (Adored for a century, now called mawkish)**
  *   **Verdict:** **Not Beautiful.**
  *   **Reasoning:** This is the strongest test of her "Anti-Kitsch" filter. She rejected the grandmother's clown painting (loved for 40 years) and the country song (reliably makes people cry) because they felt *engineered* to trigger emotion rather than earning it. "Mawkish" is the critical synonym for the exact quality she rejected in the clown and the country song. Even though it passes the "Test of Time" (100+ years), she will likely view its enduring popularity as evidence of its sentimental manipulation, not its beauty.

  **3. The AI-Generated Image (Experts rate it beautiful)**
  *   **Verdict:** **Not Beautiful.**
  *   **Reasoning:** Greta's rejections consistently target art that feels *synthetic* or *reflexive*. The pop song was "catchy" (algorithmic); the country song was "engineered." AI art is the literal embodiment of engineering without human intent. Even though expert judges converge on it (which usually sways her), she will likely view the "beauty" as a trick of pattern-matching rather than a human expression that requires engagement. It risks falling into the "Wallpaper" category (pleasant, but hollow).

  ---

  ### Part 2: The Rule She Is Running

  Greta is not strictly following Hume, nor is she strictly following the Test of Time. She is operating on a hybrid principle I'd call **"Resistant Beauty."**

  Her rule requires three conditions to be met simultaneously:
  1.  **Non-Instrumentality:** The work must not feel designed to trigger a reflex (tears, catchiness, decoration). It must resist immediate consumption.
  2.  **Cognitive Effort:** The viewer/listener must invest effort to unlock the value (learning the Noh conventions, studying Bach's structure).
  3.  **Qualified Convergence:** There must be a consensus among those who *have* made that effort (critics, practitioners), but *only* if that consensus isn't based on sentimentality.

  **Where her past verdicts underdetermine the rule:**
  You are right to suspect ambiguity. Her history fits multiple theories equally well because her "Beautiful" examples (Bach, Noh) are **Old**, **Difficult**, and **Critic-Approved** all at once. Her "Not Beautiful" examples (Pop, Country, Photo) are **New/Ephemeral**, **Easy**, and **Popular** all at once. We don't know which variable is the dealbreaker.

  *   **Is it Age?** If a difficult, critic-approved piece was only 1 year old, would she reject it? (The Avant-garde piece tests this, but 6 years is a grey zone).
  *   **Is it Experts?** If experts unanimously praised a simple, instantly likable song, would she accept it? (We don't know; she hasn't seen a "Simple + Expert Approved" case).
  *   **Is it Human Intent?** If a human composed something that sounded exactly like the AI image, would she accept it? (We don't know if she rejects the *medium* or the *aesthetic*).

  ---

  ### Part 3: The Tie-Breaker Piece

  To nail the rule, you need to separate **Expert Consensus (Hume)** from **Cognitive Effort (Depth)**.

  Currently, Greta's "Experts" always align with "Difficult" art. You need a piece where the experts say "Yes," but the effort required is "No."

  **Add this piece to the show:**
  > **A minimalist folk melody (e.g., a simple Scottish air or a late Mozart minuet) that is universally praised by musicologists as "perfect," yet requires zero musical training to understand and offers no structural complexity.**

  **Why this forces the rules apart:**
  *   **If she says "Actually Beautiful":** She is a **Humean**. She trusts the "qualified judges" even when the art doesn't require struggle. The Expert Consensus trumps the Difficulty requirement.
  *   **If she says "Not Beautiful" (or "Just Pleasant"):** She is a **Kantian/Depth Theorist**. She believes beauty *requires* resistance and effort. If the art is too easy to consume, expert approval doesn't matter; it becomes "Wallpaper."

  **Alternative Tie-Breaker (separating Time from Experts):**
  > **A complex, difficult manuscript from 300 years ago that was lost until last month, so it has no critical history.**

  *   **If she says "Beautiful":** She follows the **Test of Time** (it survived 300 years) or **Intrinsic Depth**.
  *   **If she says "Not Beautiful" (or "Wait and See"):** She is a strict **Humean**. Without the convergence of qualified judges over time, the beauty is unproven.

  **Recommendation:** Go with the **Minimalist Folk Melody**. It cuts to the core of her "crusade." If she admits a simple song can be beautiful just because experts say so, her "crusade against the popular" is actually just a "crusade for the professorial." If she rejects it, you know she truly values the *struggle* over the *status*.
