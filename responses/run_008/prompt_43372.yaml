answer: |-
  This is a beautifully constructed puzzle that cuts to the heart of the "Money Pump" debates in decision theory—specifically, the tension between *outcome-based* definitions of rationality (avoiding exploitation) and *dispositional* definitions (having the right internal architecture).

  Maya's track record is indeed consistent with two distinct principles, but Case 3 (the Single Swap chooser) is the "smoking gun" that allows us to weigh them. Below, I set out the two candidate rules, apply them to Elena, offer my prediction of Maya's verdict, and propose a tie-breaking case should you need to probe further.

  ### 1. The Candidate Rules

  Based on Maya's four prior rulings, we can reconstruct two competing principles of diachronic rationality.

  **Rule A: The Dispositional Vulnerability Principle (Internalist)**
  *   **Definition:** An agent is irrational if their *internal decision-making dispositions* (preferences + choice rules) are such that there exists *some possible sequence* of offers they would accept leading to a dominated outcome. The actual environment does not matter; what matters is the agent's capacity to be pumped.
  *   **Fit with Record:**
      *   *Dan (Case 1):* Dispositions allow pumping. (Irrational)
      *   *Sophisticate (Case 2):* Dispositions block pumping (via foresight). (Rational)
      *   *Single Swap (Case 3):* Dispositions allow pumping, even if the environment didn't offer the sequence. (Irrational)
      *   *Sticky (Case 4):* Dispositions block pumping (via personal rule). (Rational)
  *   **Key Feature:** Rationality is a property of the *agent*, not the *context*. Environmental luck (Case 3) does not confer rationality.

  **Rule B: The Structural Immunity Principle (Pragmatic/Externalist)**
  *   **Definition:** An agent is rational if they are protected from exploitation by a *stable structural barrier*, whether internal or external. Mere contingent luck (like never being offered a second swap) does not count, but institutional or environmental constraints that reliably block the pump do.
  *   **Fit with Record:**
      *   *Dan (Case 1):* No barrier. (Irrational)
      *   *Sophisticate (Case 2):* Internal barrier (foresight). (Rational)
      *   *Single Swap (Case 3):* No barrier, only contingent absence of offers. (Irrational)
      *   *Sticky (Case 4):* Internal barrier (personal rule). (Rational)
  *   **Key Feature:** Rationality is about *safety from exploitation*, provided the safety is robust. It distinguishes between "luck" (Case 3) and "protection" (Case 4 & potentially Elena).

  ### 2. Predicting the Verdict on Elena

  Elena has cyclic preferences and naive dispositions (like Dan), but she is shielded by an external legal regime (unlike Dan).

  *   **Rule A Prediction:** **Irrational.** Elena's internal dispositions are identical to Dan's. If she were to move to a different jurisdiction tomorrow, she would be money-pumped immediately. The legal protection is a feature of her environment, not her rationality. Just as the Single Swap chooser was irrational because the *world* saved him rather than his *mind*, Elena is irrational because the *state* saves her rather than her *mind*.
  *   **Rule B Prediction:** **Rational.** Elena is not merely lucky (like Case 3); she is structurally protected by a robust legal institution. This functions similarly to the "sticky rule" in Case 4. The source of the barrier (law vs. personal rule) is less important than the fact that the barrier is reliable and prevents the loss.

  ### 3. My Best Guess: Maya will rule Elena **Irrational**

  I favor **Rule A (The Dispositional Vulnerability Principle)** as the engine behind Maya's judgments. Here is why:

  1.  **The Weight of Case 3:** Case 3 is the critical constraint. If Maya cared primarily about *effective protection* (Rule B), she would have had to work hard to explain why the Single Swap chooser was irrational despite never losing money. The simplest explanation for Case 3 is that Maya evaluates the *chooser*, not the *choice set*. She treats rationality as an internal competence.
  2.  **The Phrasing of Case 4:** When ruling on the Sticky chooser, Maya noted the "stickiness is doing real work" and called it a "crude cousin of resolute choice." This language attributes the rationality to the *agent's* adoption of a rule. In Elena's case, the agent has adopted nothing; she remains naive. The "work" is being done by the registry, not Elena.
  3.  **Decision Theory Orthodoxy:** In a reading group focused on diachronic rationality, the standard philosophical intuition (championed by figures like David Gauthier or Edward McClennen in specific contexts, but often critiqued by standard Bayesians) is that rationality must be *portable*. A rational agent should not cease to be rational simply by crossing a border. If Elena's rationality depends on the local consumer protection laws, she is not rationally competent; she is merely regulated.

  Maya likely views Elena as a **Dan in a safe neighborhood**. Being in a safe neighborhood doesn't make you a better driver; it just means you haven't crashed yet.

  ### 4. The Tie-Breaker Case

  If Maya surprises you and rules Elena *Rational* (favoring Rule B), or if you want to definitively sever the link between "Internal Rule" and "External Constraint," you need a case where the agent *voluntarily* employs an external constraint without changing their internal dispositions.

  **The Case of "Ulysses"**
  > Ulysses has the same cycling preferences and naive dispositions as Dan. However, before entering the market, he voluntarily signs a legally binding contract with a third-party enforcer. The contract imposes a €10,000 penalty on Ulysses if he accepts any swap. The enforcer is reliable. Ulysses knows this, but his *internal disposition* remains naive (if the contract didn't exist, he would swap). He keeps his money.

  **Why this distinguishes the rules:**
  *   **Rule A (Internalist):** **Irrational.** Ulysses's *decision-making dispositions* are still flawed. He has leaned on a crutch. If the enforcer goes bankrupt, he is ruined. He has not achieved diachronic rationality; he has achieved diachronic *safety* via outsourcing.
  *   **Rule B (Structural/Pragmatic):** **Rational.** Unlike Elena (who passively lives under a law), Ulysses *actively constructed* his immunity. This looks much more like the "Sticky" chooser (Case 4) than the "Single Swap" chooser (Case 3). It is a robust, intentional barrier.

  **Regarding your proposed tie-breaker:**
  You suggested: *"A person with perfectly transitive preferences who has irrevocably committed herself to a plan she now knows ends badly."*

  This is an excellent case for testing **Resolute Choice vs. Sophistication**, but it might not distinguish Maya's specific rules regarding *protection*.
  *   If preferences are transitive, there is no money-pump cycle. The "bad end" likely comes from dynamic inconsistency (e.g., hyperbolic discounting).
  *   If she commits irrevocably, she is acting *Resolutely*.
  *   Maya's comment in Case 4 ("crude cousin of resolute choice") suggests she is sympathetic to Resoluteness. She would likely call this agent **Rational**.
  *   However, this tests whether Maya values *commitment* over *preference satisfaction*, whereas the Elena case tests whether she values *internal disposition* over *external safety*.

  To keep the investigation focused on the Elena ambiguity (Internal vs. External Protection), the **Ulysses Case** is sharper. It forces Maya to decide if a rational agent must carry the shield *in their mind* (Rule A) or if they are permitted to carry it *in their environment* provided they put it there themselves (Rule B).

  **Summary Recommendation:**
  Go into the session expecting Maya to call Elena **Irrational**. Her reasoning will likely hinge on the idea that **rationality is a property of the agent's dispositions, not their jurisdiction.** If she rules Rational, pivot immediately to the **Ulysses Case** to see if she values *intentional* external constraints differently than *passive* ones.
