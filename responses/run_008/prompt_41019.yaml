prompt: |-
  I'm teaching the Stone Table chapter of The Lion, the Witch and the Wardrobe next term, and I want to do something less obvious than the standard C.S. Lewis-atonement treatment. A friend told me David Lewis -- yes, the Princeton modal-realist one -- wrote a short thing on penal substitution, arguing (as I remember it, might be garbling it) that in ordinary life we actually do accept surrogate punishment: a fine paid by somebody else's cheque, or a wrong done to one person avenged on their kin, and the interesting question is what exactly has to be true of the substitute, the crime, and the punisher for that to remain justice rather than collapse into plain cruelty. So read the Aslan scene through that lens: what does the Witch's legal claim to Edmund's blood map onto in a desert-based framework, does Aslan actually satisfy the conditions that would make substituting him legitimate, and where does the novel do work the theory can't touch -- the deeper magic that predates the Deep Magic and sort of retroactively voids the transaction, the fact that Edmund never really atones for anything, the Witch's claim being legalistic rather than moral? Give me exactly five numbered points, a sentence or two each, no intro or conclusion, and be honest about where the David Lewis lens just doesnt fit the scene -- and tell me whether the scene ends up supporting substitution or quietly debunking it.
