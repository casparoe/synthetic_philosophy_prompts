          *   Where does the Lewis lens *not* fit?
          *   Does the scene support or debunk substitution?
      *   **Constraints:** Exactly five numbered points. One or two sentences each. No intro or conclusion. Be honest about limitations.

  2.  **Recall/Verify David Lewis on Penal Substitution:**
      *   David Lewis (the philosopher, not the author) did write a short piece titled "Do We Believe in Penal Substitution?" (1997).
      *   His argument: We often accept surrogate punishment (parents paying fines for kids, communities bearing blame), but strict retributive justice usually demands the guilty party suffer. He explores the conditions under which transfer of punishment is permissible.
      *   Key distinction: Voluntary acceptance vs. imposed suffering. The relationship between substitute and guilty party.

  3.  **Analyze the Stone Table Scene:**
      *   **The Witch's Claim:** Based on the "Deep Magic" (law of treason). Edmund is a traitor. His life is forfeit.
      *   **Aslan's Substitution:** Aslan offers himself in Edmund's place. The Witch agrees.
      *   **The Execution:** Aslan is killed.
      *   **The Resurrection:** "Deeper Magic from before the dawn of time" voids the claim if a willing victim is killed in a traitor's stead.
      *   **Edmund's Role:** He is present but passive during the sacrifice; he doesn't suffer the penalty himself.

