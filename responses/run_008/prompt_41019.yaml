      *   *Point 3: Where the Lens Fails (Deeper Magic).* The Lewisian framework cannot account for the "Deeper Magic," which retroactively voids the justice claim entirely rather than satisfying it, shifting the mechanism from legal substitution to metaphysical override.
      *   *Point 4: Edmund's Lack of Atonement.* Unlike standard penal substitution where the guilty party is reconciled through the pain, Edmund remains passive and unmodified by the death itself, suggesting the scene critiques the efficacy of transactional justice alone.
      *   *Point 5: Support or Debunk?* Ultimately, the scene quietly debunks strict penal substitution by showing the Witch's legal claim as inherently destructive and only overcome by a grace that operates outside the logic of debt and payment.

