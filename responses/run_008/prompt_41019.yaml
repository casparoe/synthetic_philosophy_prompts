  3. The Lewisian lens breaks down at the "Deeper Magic," which does not satisfy the legal transaction but retroactively voids it, operating outside any coherent theory of penal justice or substitute liability.
  4. Edmund never personally atones or suffers, highlighting a gap in the theory where the guilty party remains unchanged by the substitute's pain, suggesting the sacrifice fixes the cosmic law rather than the human heart.
  5. The scene ultimately debunks strict penal substitution by revealing the Witch's legal claim as tyrannical and showing that true resolution requires a grace that bypasses the economy of crime and punishment entirely.
