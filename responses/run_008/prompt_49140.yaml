answer: |-
  The counterfactual baseline requirement does the most work, and the full set of desiderata is jointly unsatisfiable because a rigorous counterfactual is inherently unobservable.

  **The Fundamental Tension**
  You cannot simultaneously satisfy the **Counterfactual Baseline** and **Observability** requirements. A true alignment tax is defined as the difference between an unconstrained optimum and an constrained actuality ($Cost_{unaligned} - Cost_{aligned}$). However, we only observe the actuality; the unconstrained optimum for a specific lab is a counterfactual world where that lab chose differently upstream. Using industry frontiers as a proxy introduces confounders (architecture, data quality, talent density) that swamp the signal. Using theoretical bounds makes the claim untestable. You must choose between a rigorous definition that is unmeasurable or a measurable metric that is definitionally loose.

  **Requirement Breakdown**

  1.  **Counterfactual Baseline**
      *   **Case:** "Tax" is a differential concept; without specifying the reference class (lab-specific unconstrained optimum vs. industry frontier vs. hypothetical aligned-equal-capability), the magnitude is undefined.
      *   **Status:** **Non-negotiable.** Without this, the term is semantically empty.
  2.  **Sign Convention (Zero/Negative)**
      *   **Case:** If alignment techniques (e.g., RLHF) improve helpfulness or generalization, the "cost" may be negative. The account must specify if "tax" refers strictly to overhead or net capability loss, otherwise positive synergies break the model.
      *   **Status:** **Non-negotiable.** Required for internal consistency.
  3.  **Decomposability vs. Scalar Aggregation**
      *   **Case:** Costs accrue in compute, latency, researcher-hours, and risk exposure. These are not naturally commensurable.
      *   **Status:** **Mixed.** Acknowledging multidimensionality is **Non-negotiable**; collapsing these into a single scalar (e.g., dollar-equivalent) is a **Pet Preference** (usually of economists or policy-makers) that often obscures trade-offs.
  4.  **Observability**
      *   **Case:** Claims about competitiveness must be grounded in evidence, not hypothetical engineering paths.
      *   **Status:** **Non-negotiable** for empirical claims, but **Impossible** to satisfy fully given the Counterfactual Baseline requirement (see Tension above).
  5.  **Incidence/Scope**
      *   **Case:** A fixed compute overhead is negligible for a cluster with 100k GPUs but prohibitive for a lab with 1k; the tax is relative to capacity, not absolute.
      *   **Status:** **Non-negotiable.** Competitiveness is a relative game.
  6.  **Alignment-as-Capability**
      *   **Case:** Empirical evidence shows alignment techniques often improve benchmark performance or usability.
      *   **Status:** **Non-negotiable.** The account must accommodate empirical reality rather than assuming alignment is purely restrictive.

  **Evaluation of Usual Framings**

  *   **Naive Overhead ("marginally higher training cost"):** Fails **Counterfactual Baseline** (higher than what?) and **Decomposability** (ignores capability loss or latency). It treats alignment as a simple add-on rather than a constraint on the optimization landscape.
  *   **Capability Tax ("performance drop on benchmarks"):** Fails **Observability** (benchmarks $\neq$ real capability) and **Alignment-as-Capability** (cannot account for cases where alignment improves scores). It also ignores non-capability costs like training time or safety team overhead.
  *   **Revealed Preference ("what labs won't ship"):** Satisfies **Observability** and **Incidence** (shows what is actually competitive), but fails **Counterfactual Baseline**. You cannot distinguish between "alignment made this too expensive" and "labs chose not to ship for unrelated strategic reasons." It infers the tax from the outcome, making it tautological.
