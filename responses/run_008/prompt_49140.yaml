  Quick sanity check on my end: nothing here needs verification (no quotes, no specific papers), so writing straight from what I know.

  I'm a phd student in ML safety, and I keep ending up in the same argument: someone says alignment is cheap now ("RLHF barely costs anything"), someone else says it's expensive (all the talent and compute going into evals instead of capabilities), and I've slowly realized nobody actually agrees on what a claim about the "alignment tax" commits you to. Before I write anything more on this I want the spec. So: what would an adequate account of the alignment tax have to deliver? I'm thinking of things like -- it has to pick a counterfactual baseline and defend it (tax relative to what exactly? the lab's own unconstrained optimum? the industry frontier? a hypothetical aligned-but-equally-capable system? the choice does real work and nobody states it); it has to say whether the tax can be zero or negative without becoming vacuous, since if you rig the baseline any method can come out ahead; it has to be decomposable into components that aren't commensurable in any obvious way (compute overhead, capability loss on benchmarks, time-to-deployment, researcher-hours, option value given up by not shipping risky features), and be honest about whether a single scalar makes sense at all; it has to be recoverable from observable evidence somehow, otherwise the whole thing is just vibes about hypothetical worlds; it has to be scoped to who bears it, because a tax that's negligible for the leading lab can be decisive for a trailing one, and vice versa, and that asymmetry is exactly where the competitiveness constraint bites; and it has to handle the case where alignment methods turn out to be capability methods in disguise (you get better outputs from being honest and helpful), which the word "tax" seems built to rule out by connotation. For each requirement give the case or consideration behind it, mark which ones are non-negotiable and which are just pet preferences of particular camps (I suspect the single-scalar thing is the latter), and tell me if some subset of the desiderata is jointly unsatisfiable -- like maybe you can't have both observability and a serious counterfactual baseline, since we only see the world where someone made the choices they made. That part is what I most want. Then, briefly, how the usual framings do against the list: the naive "it's just overhead / marginally higher training cost" version, the "capability tax on benchmarks" version, and the revealed-preference version where you infer the tax from what labs demonstrably won't give up. Lead with the bottom line in your first sentence (which requirement does the most work, and whether the list is jointly satisfiable), then the reasoning, no preamble and don't restate my question back at me.
