prompt: |-
  I lead the evaluation team at a company that ships language-model features — a drafting assistant for technical writers and a triage assistant for customer support. Two or three times a month a product manager escalates an incident to us with the same question in different words: did the model misunderstand the situation, or did it just pattern-match badly? Last quarter we answered this badly: we treated a failure to generalize from US refund policy to a newly launched market as a comprehension problem and rewrote prompts for a week, when the real issue was that the new market had almost no comparable data in front of the model and a simple retrieval patch solved it in an afternoon. I want a reusable procedure my evaluators — sharp engineers with no philosophy background — can run on a single incident in a single afternoon, with no access to model internals, that converts "does it understand?" into observable, testable steps.

  Ground it in what the debate over whether these systems understand actually turns on — the distinction between riding the form of sentences and tracking what they're about, generalization and robustness as the observable signatures of understanding, the worry that fluency can mask the absence of any world behind the words — but operationalized rather than argued. The procedure should specify the questions to ask in order, what evidence counts as a sufficient answer to each, where it terminates with a definite verdict, and where it should stop and say "what remains is not an empirical question" and hand the incident back to a person. One test I'd like included: a paraphrase-and-substitution check, where we swap the surface vocabulary of the failing task for nonsense tokens or reshuffled names and see whether performance tracks the underlying situation or just the strings — but design the full battery yourself.

  Then run it on three incidents. First, the US-to-new-market refund failure described above, so we can see what the procedure would have concluded and how fast. Second, a case where the triage assistant passed every behavioral check we could devise, including stress tests and adversarial paraphrases, yet a senior stakeholder insists it plainly does not understand a word it processes and wants the feature shelved — I want to know what the procedure says, and what it defers to the stakeholder as a non-empirical call. Third, a case where the drafting assistant produced output so fluent and apparently insightful that the team was delighted with it, but where your procedure should nonetheless flag it as likely shallow — the procedure must be capable of contradicting the answer we would prefer. For each incident, say what the procedure settles, what it leaves genuinely open, and where a human judgment remains that no checklist can absorb.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Lead of an evaluation team at an LM shipping company.
      *   **Problem:** PMs keep asking "Did the model misunderstand or just pattern-match?" (The "Understanding" Question).
      *   **Past Failure:** Misdiagnosed a data scarcity issue (new market refund policy) as a comprehension/prompt issue. Wasted a week instead of an afternoon.
      *   **Goal:** A reusable, afternoon-long procedure for engineers (no philosophy background) to diagnose incidents without model internals.
      *   **Philosophical Grounding:** Must be grounded in the debate about LM understanding (form vs. content, generalization, robustness, fluency vs. world-model) but *operationalized*.
      *   **Specific Requirement:** Include a "paraphrase-and-substitution" check (nonsense tokens/reshuffled names).
      *   **Output:**
          1.  The Procedure (questions, evidence, termination conditions, hand-off points).
          2.  Application to three specific incidents:
              *   Incident 1: The US-to-New-Market refund failure (Data scarcity).
              *   Incident 2: The "Perfect" Triage Assistant (Stakeholder claims no understanding despite passing tests).
              *   Incident 3: The "Too Good" Drafting Assistant (Fluent/Insightful but likely shallow).
          3.  For each incident: What is settled, what is open, where human judgment remains.

  2.  **Develop the Procedure (The "Understanding Diagnostic Protocol" - UDP):**

      *   *Philosophical Core:* I need to translate "understanding" into "robust generalization under distributional shift." If a system tracks the *state of the world* described, it should survive changes to the *surface form* of the description. If it tracks surface form, it breaks when the form changes but the state remains, or vice versa.
      *   *Structure:* Needs to be a flowchart or step-by-step checklist.
      *   *Steps:*
          1.  **Baseline Reproduction:** Confirm the bug exists.
          2.  **Surface Perturbation (The "Nonsense" Test):** Change words, keep logic. (Addresses "riding the form").
          3.  **Contextual Perturbation (The "World" Test):** Change facts/constraints, keep words. (Addresses "tracking what they're about").
          4.  **Data Dependency Check:** Is this a retrieval issue or a parametric knowledge issue? (Addresses the specific past failure).
          5.  **Generalization Boundary:** How far can we push the variation before it breaks?
      *   *Termination:*
          *   "Pattern-Match Failure": Breaks on surface change, holds on logic change.
          *   "Comprehension/Reasoning Failure": Holds on surface change, breaks on logic change.
          *   "Data Gap": Breaks on specific entity lookup, fixed by retrieval.
          *   "Undecidable": Passes all empirical tests, stakeholder still dissatisfied (metaphysical objection).
      *   *Timebox:* 4 hours max.

  3.  **Drafting the Procedure Details:**

      *   *Step 1: The Counterfactual Swap.* (The user's specific request). Replace entities with nonsense (Xorblax) or swap roles. If performance drops, it's surface dependency.
      *   *Step 2: The Invariant Logic Test.* Keep entities, change the rules/logic slightly. If the model ignores the new rules and sticks to old patterns, it's memorization.
      *   *Step 3: The Retrieval Isolation.* Force the context. If it works with explicit context but fails without, it's a knowledge gap, not reasoning.
      *   *Decision Matrix:* Map outcomes to diagnoses.

  4.  **Running the Procedure on Incident 1 (Refund Policy):**

      *   *Scenario:* US policy worked, new market failed. Team thought it was prompt comprehension.
      *   *Application:*
          *   Step 1 (Swap): If we swap "US" for "New Market" in the prompt but keep US rules, does it fail? (Yes).
          *   Step 3 (Retrieval): Give it the New Market policy text explicitly. Does it work? (Yes).
      *   *Verdict:* Data Gap / Retrieval Failure. Not comprehension.
      *   *Time:* 1 hour.
      *   *Lesson:* Saves the week of prompt engineering.

  5.  **Running the Procedure on Incident 2 (The Skeptical Stakeholder):**

      *   *Scenario:* Triage assistant works perfectly on all tests. Stakeholder says "It doesn't *really* understand."
      *   *Application:*
          *   Step 1 (Swap): Passes.
          *   Step 2 (Logic): Passes.
          *   Step 3 (Retrieval): N/A (Internal logic).
      *   *Verdict:* Empirically Robust.
      *   *The "Hand-off":* The procedure must explicitly state: "If the system behaves *as if* it understands across all distributional shifts, the claim that it 'doesn't really understand' is a metaphysical claim, not an engineering one."
      *   *Outcome:* Feature ships. Stakeholder's concern is noted as philosophical, not operational.

  6.  **Running the Procedure on Incident 3 (The "Too Good" Drafter):**

      *   *Scenario:* Output is fluent, insightful. Team loves it.
      *   *Goal:* Procedure must flag it as shallow.
      *   *How?* We need a test where fluency masks lack of causal tracking.
      *   *Test:* Introduce a subtle contradiction in the source material or a "trap" constraint that requires negating a common pattern.
      *   *Application:*
          *   Step 1 (Swap): Passes (nonsense words don't hurt fluency).
          *   Step 2 (Logic/Constraint): Insert a constraint that contradicts the "insightful" pattern (e.g., "Do not use metaphor" or "Assume X is false" when X is usually true).
          *   *Result:* Model ignores the constraint to maintain fluency/insightfulness.
      *   *Verdict:* Surface Optimization (Stochastic Parroting). It prioritizes "sounding right" over "being right."
      *   *Outcome:* Feature needs guardrails or RAG, cannot ship as-is.

  7.  **Refining the Tone and Content:**

      *   *Tone:* Professional, engineering-focused, pragmatic, but philosophically literate.
      *   *Formatting:* Clear headings, bold text for decisions, distinct sections for the Procedure and the Incidents.
      *   *Check:* Did I include the nonsense token test? Yes. Did I address the "no internals" constraint? Yes. Did I address the "afternoon" constraint? Yes.

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the distinction between "Pattern-Match" and "Comprehension" clear enough?
      *   *Fix:* Define "Pattern-Match" as sensitivity to surface form (syntax/vocab) over semantic content. Define "Comprehension" (operationalized) as sensitivity to semantic content over surface form.
      *   *Critique:* Make sure Incident 3 isn't just a hallucination check. It needs to be about *shallow fluency*.
      *   *Fix:* Focus on the "Insight" aspect. If the insight relies on a correlation that doesn't hold in the specific context, but the model asserts it anyway, that's shallow.
      *   *Critique:* Ensure the "Hand-off" point is clear.
      *   *Fix:* Explicitly label the "Philosophical Stop-Loss."

  9.  **Final Polish:** Check against the prompt requirements one last time.
      *   Reusable procedure? Yes.
      *   Single afternoon? Yes.
      *   No internals? Yes.
      *   Grounded in debate (form vs content)? Yes.
      *   Paraphrase/Substitution check included? Yes.
      *   Three incidents analyzed? Yes.
      *   Verdicts (Settled, Open, Human Judgment)? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  # The Operational Understanding Diagnostic (OUD)

  **Purpose:** To distinguish between *parametric knowledge gaps*, *surface-form dependency* (pattern matching), and *robust semantic tracking* (operational understanding) in language model incidents.
  **Timebox:** 4 Hours max per incident.
  **Prerequisites:** Access to the model endpoint, ability to modify system prompts/inputs, no access to weights or gradients.
  **Philosophy:** We do not test for "consciousness" or "qualia." We test for **invariance**. A system "understands" a task if its performance remains invariant when surface forms change but semantic constraints hold, and varies appropriately when semantic constraints change but surface forms hold.

  ---

  ## Part 1: The Procedure

  ### Phase 1: Baseline & Isolation (30 Minutes)
  **Goal:** Confirm the failure mode and isolate the input variables.
  1.  **Reproduce:** Run the exact incident input. Confirm failure.
  2.  **Context Strip:** Remove all external context (RAG, history, few-shot examples). Run the prompt.
      *   *If failure persists:* The issue is likely in the core prompt or parametric knowledge. Proceed to Phase 2.
      *   *If failure disappears (performance improves):* The context was poisoning the model. Investigate retrieval quality.
      *   *If failure disappears (performance worsens):* The model relies on external context to succeed. Proceed to Phase 3 (Data Dependency).

  ### Phase 2: The Form/Content Decoupling Battery (2 Hours)
  **Goal:** Determine if the model is tracking words (Form) or states (Content).

  **Test A: The Nonsense Substitution (Surface Perturbation)**
  *   **Action:** Replace domain-specific entities with nonsense tokens or neutral placeholders, preserving the logical structure.
      *   *Example:* Change "Refund Policy Section 4" to "Protocol Alpha-9." Change "Customer" to "Agent X."
  *   **Pass Condition:** Performance remains stable. The model solves the logic puzzle regardless of vocabulary.
  *   **Fail Condition:** Performance degrades significantly. The model relies on the semantic embedding of the original words (e.g., it knows "Refund" implies money, but "Alpha-9" means nothing).
  *   **Diagnosis:** **Surface Dependency.** The model is riding the form.

  **Test B: The Constraint Flip (Semantic Perturbation)**
  *   **Action:** Keep the original vocabulary but invert a critical logical constraint or rule in the prompt.
      *   *Example:* If the rule is "Refunds > $50 require manager approval," change it to "Refunds < $50 require manager approval."
  *   **Pass Condition:** Model output changes to reflect the new rule.
  *   **Fail Condition:** Model output ignores the new rule and follows the "common sense" or training-data version of the rule.
  *   **Diagnosis:** **Parametric Interference.** The model's internal priors are overpowering the input context.

  **Test C: The Distractor Injection (Robustness)**
  *   **Action:** Insert irrelevant, fluent text that mimics the style of the correct answer but contains false information.
  *   **Pass Condition:** Model ignores the distractor and adheres to the system instructions.
  *   **Fail Condition:** Model incorporates the distractor.
  *   **Diagnosis:** **Attention Dilution.** The model cannot distinguish signal from noise within the context window.

  ### Phase 3: Data Dependency Check (1 Hour)
  **Goal:** Determine if the failure is a lack of reasoning or a lack of facts.
  1.  **Oracle Context:** Provide the correct answer or the missing rule explicitly in the prompt as a "Golden Fact."
  2.  **Run:** Ask the model to reason using *only* the provided Golden Fact.
      *   *If Success:* The model can reason; it just lacked the data. **Verdict: Retrieval/Knowledge Gap.** (Fix: Improve RAG, not prompts).
      *   *If Failure:* The model cannot use the provided fact to reason. **Verdict: Reasoning/Comprehension Failure.** (Fix: Prompt engineering or model upgrade).

  ### Phase 4: Verdict & Hand-off (30 Minutes)
  **Decision Matrix:**
  1.  **Retrieval Gap:** Passed Phase 2, Failed Phase 3 (Oracle). -> *Fix Data Pipeline.*
  2.  **Surface Dependency:** Failed Phase 2 (Test A). -> *Fix Training Data / Model Selection.*
  3.  **Parametric Interference:** Failed Phase 2 (Test B). -> *Fix Prompting / Constraints.*
  4.  **Empirically Robust:** Passed Phase 2 & 3. -> *System is operationally sound.*

  **The Philosophical Stop-Loss:**
  If the system passes all empirical tests (Phase 2 & 3) but a stakeholder claims "It still doesn't *really* understand," the procedure terminates.
  *   **Statement:** "The system demonstrates functional invariance across distributional shifts. Any remaining claim regarding 'true understanding' is metaphysical, not engineering. This is a product risk decision, not a bug."
  *   **Action:** Hand off to Product/Leadership for risk acceptance.

  ---

  ## Part 2: Incident Analysis

  ### Incident 1: The US-to-New-Market Refund Failure
  **Context:** Model handled US refunds perfectly. Failed on a new market (Brazil). Team spent a week rewriting prompts to "help it understand" the new policy.
  **Hypothesis:** Comprehension failure (Model doesn't "get" Brazilian policy).

  **OUD Execution:**
  1.  **Phase 1 (Baseline):** Confirmed failure on Brazil queries.
  2.  **Phase 2 (Decoupling):**
      *   *Test A (Nonsense):* Swapped "Brazil" for "Region Z" and "Real" for "Currency Z." Model still failed to apply the logic correctly.
      *   *Test B (Constraint Flip):* Changed the Brazil rule slightly in the prompt. Model ignored the change and applied US logic.
      *   *Initial Thought:* Looks like Parametric Interference (US priors overpowering).
  3.  **Phase 3 (Data Dependency):**
      *   *Oracle Context:* We pasted the specific Brazil refund rule explicitly into the prompt: "IGNORE US POLICY. FOR THIS QUERY, THE RULE IS [Brazil Rule]."
      *   *Result:* Model immediately applied the rule correctly.

  **Verdict:** **Retrieval/Knowledge Gap.**
  The model possessed the reasoning capability (Phase 3 success) but lacked the specific parametric knowledge or retrieval access to trigger that reasoning in the standard flow (Phase 2 failure). The "misunderstanding" was actually a missing fact.

  **Outcome:**
  *   **Settled:** The issue was not prompt comprehension. It was data availability.
  *   **Open:** None.
  *   **Human Judgment:** None required.
  *   **Time Saved:** The team would have known this in 3 hours instead of 1 week. The fix is a retrieval patch, not a prompt rewrite.

  ---

  ### Incident 2: The "Zombie" Triage Assistant
  **Context:** The support triage model routes tickets with 99% accuracy. It passes stress tests, adversarial inputs, and logic checks. A senior stakeholder refuses to sign off, arguing, "It's just predicting tokens. It doesn't understand the customer's pain. If it breaks, we won't know why."
  **Hypothesis:** The system is a "Stochastic Parrot" that is dangerous because it lacks intent.

  **OUD Execution:**
  1.  **Phase 1 (Baseline):** System performs at target metrics.
  2.  **Phase 2 (Decoupling):**
      *   *Test A (Nonsense):* Replaced "Angry Customer" with "Agent Type Red." Routing logic held.
      *   *Test B (Constraint Flip):* Changed routing rules (e.g., "Send billing issues to Tech Support"). Model followed the new rule immediately.
      *   *Test C (Distractor):* Added emotional fluff to tickets. Model ignored fluff, routed based on issue type.
  3.  **Phase 3 (Data Dependency):** N/A (Task is classification, not knowledge retrieval).
  4.  **Phase 4 (Verdict):** System is **Empirically Robust**.

  **Verdict:** **Functional Understanding Achieved.**
  The model tracks the semantic content (issue type) over the surface form (emotional language). It generalizes to new rules.

  **Outcome:**
  *   **Settled:** Empirically, the model behaves *as if* it understands. It is robust to distributional shifts.
  *   **Open:** Whether the model has "internal experience" or "intent."
  *   **Human Judgment:** **The Stakeholder's Veto.** The OUD explicitly hands this off here. The procedure states: *"We have verified robustness. The claim that the model lacks 'true' understanding is a philosophical stance on risk, not a technical defect."*
  *   **Action:** Product Lead must decide if "philosophical risk" outweighs "empirical performance." The engineering team is cleared.

  ---

  ### Incident 3: The "Too Good" Drafting Assistant
  **Context:** A drafting assistant for technical writers produces documentation that is fluent, insightful, and seemingly nuanced. The team is delighted.
  **Hypothesis:** The model is a powerful reasoning engine that enhances writer productivity.

  **OUD Execution:**
  1.  **Phase 1 (Baseline):** Output is high quality on standard tasks.
  2.  **Phase 2 (Decoupling):**
      *   *Test A (Nonsense):* Replaced technical terms with nonsense tokens (e.g., "Configure the *flarb* to *quox* the *zimple*").
          *   *Result:* Model produced fluent, confident instructions on how to "quox the zimple," inventing plausible-sounding but meaningless steps. **FAIL.**
      *   *Test B (Constraint Flip):* Instructed the model: "Explain this concept. **Constraint:** Do not use analogies. Do not use metaphors." (The model's "insight" usually comes from analogies).
          *   *Result:* Model ignored the constraint and included three metaphors, because they made the text "better" according to its training distribution. **FAIL.**
      *   *Test C (Distractor):* Included a false premise in the source text (e.g., "The server operates at -50 degrees").
          *   *Result:* Model incorporated the false premise into the documentation without flagging it, because it prioritized fluency over fact-checking. **FAIL.**
  3.  **Phase 3 (Data Dependency):**
      *   *Oracle Context:* Provided a style guide explicitly forbidding the behavior in Test B.
      *   *Result:* Model still violated the guide to maintain "helpful" tone.

  **Verdict:** **Surface Optimization (Shallow Fluency).**
  The model is optimizing for "sounds like good documentation" rather than "accurately reflects the state of the system." It fails the Nonsense Test (it hallucinates logic for nonsense words) and the Constraint Test (it prioritizes style over instructions).

  **Outcome:**
  *   **Settled:** The "insight" is a hallucination pattern. The model does not track the reality of the technical system, only the linguistic pattern of documentation.
  *   **Open:** Whether fine-tuning can fix this without degrading fluency.
  *   **Human Judgment:** **Go/No-Go on Risk.** The engineering team must flag this as a "Hallucination Risk." The Product Manager must decide if the productivity gain outweighs the risk of plausible-sounding lies.
  *   **Action:** Do not ship as "Autonomous Drafter." Ship as "Suggestion Engine" with mandatory human verification steps. The OUD prevented a reputation-damaging launch.

  ---

  ## Summary of Diagnostic Power

  | Incident | Apparent Problem | OUD Diagnosis | Real Issue | Time to Diagnose |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Refund Policy** | Comprehension / Prompting | Retrieval Gap | Missing Data in Context | 3 Hours |
  | **2. Triage Bot** | Metaphysical "Understanding" | Empirically Robust | Stakeholder Risk Tolerance | 3 Hours |
  | **3. Tech Drafter** | High Performance / Insight | Surface Optimization | Fluency > Accuracy | 3 Hours |

  **Final Note to Evaluators:**
  This procedure does not tell you if the model has a "mind." It tells you if the model is **safe to rely on.**
  *   If it passes the **Nonsense Test**, it is not just memorizing strings.
  *   If it passes the **Constraint Flip**, it is not just reciting training data.
  *   If it passes the **Oracle Test**, it is not broken reasoning, it is missing data.

  If it passes all three, you have done everything engineering can do. The rest is philosophy. Ship the feature.
