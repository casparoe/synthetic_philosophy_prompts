answer: |-
  Hi there, I am writing to lay out the interview structure for next week's episode on perdurantism and stage theory, and I want to make sure we press our guest on the substantive implications of her view rather than just letting her rehearse the basics. To start, I plan to address the problem of temporary intrinsics, which is the puzzle of how an object can have incompatible properties like being bent and being straight at different times without changing its identity. I will ask her whether the dispute between the worm theorist who posits temporal parts and the endurantist who says objects are wholly present at each time is really offering rival explanations of reality or if they are just engaging in rival bookkeeping where the same facts are described differently. If she responds that the temporal parts explanation is superior because it avoids contradiction, I will follow up by asking what explanatory work the parts are doing that could not equally be done by saying properties are had in a time-relative way, since that seems to be the core of the disagreement.

  Next, I want to press her on her specific claim that the endurantist adverbialist reply, which says objects bear properties in time-relative ways rather than tenselessly, secretly reintroduces temporal parts at the level of facts about having. I will ask her to say precisely what the smuggled entities are supposed to be in the adverbialist ontology, since opponents will argue that a way of having a property is not a part of anything in the same sense that a spatial segment is a part of a statue. If she replies that the fact itself is composite, I will follow up by asking if this commits her to an ontology of facts that endurantists typically reject, and whether that cost is higher than simply accepting temporal parts of objects.

  Moving on to the counting objection, I need to address the complaint that stage theory tells us that the person sitting in the chair is a numerically different thing, meaning a distinct entity, from the one who entered the room an hour ago. I will frame this by noting that many listeners will find this incredible because our language and intuition suggest we are talking about the same person throughout the day. If she appeals to counterpart relations or psychological continuity to explain why we treat them as the same despite numerical difference, I will follow up by asking if that move just pushes the identity problem back a step by requiring a further explanation of what makes those stages counterparts rather than distinct people.

  On the ethical front, I want to raise the practical worry people raise about stage theory, namely that if strictly speaking you will soon cease to exist and be replaced by a successor stage, prudence and anticipation of the future seem unmotivated. I will ask her why we should care about the pain or pleasure of a future stage if it is not literally us in the strict numerical sense. If she argues that psychological connectedness is enough to ground prudential concern, I will follow up by asking if this reduces personhood to a matter of degree, which might clash with our legal and moral practices that treat responsibility as all-or-nothing.

  For the fission case, where one person splits into two psychologically continuous successors, I know she tends to deflect the problem by saying the question presupposes a one-one notion of survival that her view rejects. I want to make that deflection harder by asking whether, from the first-person perspective of the pre-fission person, the expectation of survival is an expectation of being one specific future person or just being represented in some future person. If she maintains that survival is not identity and thus does not require uniqueness, I will follow up by asking if this implies that death is never truly bad for the subject as long as some successor stage continues somewhere, which seems to undermine the stakes of personal survival.

  Shifting to language, I plan to ask how her stage-theoretic treatment of reference works given that ordinary names like you and I seem to pick out enduring entities rather than momentary slices. I will ask how we successfully refer to stages if we do not know their precise temporal boundaries when we speak. If she says that context fixes the reference to a stage, I will follow up by asking how context manages to do this without presupposing the very endurance intuition her theory is meant to replace.

  Then I would like to explore the phenomenology of persistence, since we feel like we endure through time rather than perish and get replaced moment by moment. I will ask how her view explains the illusion of endurance if reality is actually a series of distinct stages. If she says memory connects the stages to create the feeling of continuity, I will follow up by asking if the act of remembering presupposes an enduring subject who owns the memory, which would beg the question against her view.

  Regarding composition, I want to ask what binds these temporal stages into a worm if not identity, since there must be something that makes a collection of stages count as one person. I will ask whether the relation binding stages is vague, and if so, whether it is vague how many people exist in a room at any given time. If she accepts vagueness in existence, I will follow up by asking if this violates the principle that reality itself should be precise even if our language is not.

  I also want to touch on modality, since stage theory often links to counterpart theory where possibility is handled by similar stages in other worlds rather than one thing existing in many worlds. I will ask if accepting temporal counterparts forces her to accept modal counterparts, and if so, how she handles the intuition that I could have had different parents. If she says modal counterparts are necessary, I will follow up by asking if this makes our identity entirely extrinsic, depending on things that exist in other possible worlds rather than just facts about us here.

  Finally, I plan to close by asking about free will and responsibility, since if I am just a stage, it is unclear how I can be responsible for actions performed by earlier stages. I will ask whether blame and praise attach to the stage or the whole worm, and what happens if the worm is not a real unity. If she says responsibility tracks psychological connectedness, I will follow up by asking if this means a person could escape responsibility for a past crime simply by undergoing enough psychological change to break the connection with their past stage. I think this set of questions will keep the conversation rigorous while ensuring our listeners can follow the technical stakes without getting lost in the jargon.
