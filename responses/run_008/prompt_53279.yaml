prompt: |-
  I'm putting together a syllabus module on philosophy of medicine, and before I have the students read the naturalists and the normativists I want them to write the spec first — I don't want them grading theories against criteria they never articulated. So help me with the spec. The purpose matters here: the account doesn't have to settle metaphysics once and for all, it has to be good enough to do real work for deciding what a public health system should treat and pay for, and what counts as illness for things like sick leave or legal excuses.

  Give me the desiderata for an adequate account of health and disease — what it has to deliver and why, case by case. At minimum I'd want coverage of the classics: whether a condition being statistically abnormal in a reference class makes it a disease (and what to do about athlete's slow resting hearts or the fact that basically everyone's back is a mess by evolutionary-design standards), whether dysfunction in the biological-function sense is necessary, whether the account can explain why infertility counts but choosing to be childless doesn't, and whether it can handle disagreement over things like ADHD or whether grief became a disorder when the DSM folks loosened their criteria. But add whatever I'm missing.

  Then two things I really want from you: first, flag which desiderata are camp prejudices in disguise — i.e., things only a naturalist or only a normativist would demand — versus which are genuinely load-bearing for the practical purpose, and mark each one negotiable or not. Second, tell me if any subset of the requirements is jointly unsatisfiable, because if it is, that's the actual lesson of the module, and which single requirement does the most to knock out the main contenders. My sister is a GP and keeps insisting the whole debate is academic since "disease is just what we treat," so also tell me whether that lazy view satisfies the spec or fails it. Table format is fine. Keep citations out of it, I'll add those myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Create a "spec" (specification/desiderata) for an account of health and disease for a philosophy of medicine syllabus module.
      *   **Context:** Students will write the spec *before* reading naturalist/normativist theories. The goal is practical application (public health funding, sick leave, legal excuses), not just metaphysical settling.
      *   **Required Content:**
          *   Desiderata for an adequate account (coverage of classics: statistical abnormality, biological dysfunction, infertility vs. childlessness, ADHD/DSM grief debates).
          *   Add missing elements.
          *   **Task 1:** Flag which desiderata are "camp prejudices" (naturalist vs. normativist bias) vs. genuinely load-bearing for the practical purpose. Mark as Negotiable or Non-Negotiable.
          *   **Task 2:** Identify if any subset of requirements is jointly unsatisfiable (the "lesson of the module") and which requirement knocks out the main contenders.
          *   **Task 3:** Evaluate the sister's (GP) view ("disease is just what we treat") against the spec.
      *   **Format:** Table format is fine. No citations.
      *   **Tone:** Academic but practical, clear, instructive for a syllabus context.

  2.  **Deconstruct the "Spec" (Desiderata):**
      *   *Purpose:* Public health allocation, sick leave, legal excuses. This implies a need for objectivity, fairness, consistency, and action-guidance.
      *   *Classic Cases:*
          *   Statistical Normality (Athlete's heart, evolutionary back pain).
          *   Biological Dysfunction (Infertility vs. Childlessness).
          *   Psychiatric/Contested Cases (ADHD, Grief/DSM-5).
      *   *Missing Elements:* Resource allocation implications, cultural variability, temporal stability (is it a fleeting state?), agency/responsibility.

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *D1: Objectivity.* Needs to be independent of individual whim. (Naturalist leaning?)
      *   *D2: Normative Force.* Needs to justify *action* (treatment/excuse). (Normativist leaning?)
      *   *D3: Statistical vs. Functional.* Distinguish mere rarity from pathology.
      *   *D4: Value-Neutrality vs. Value-Laden.* Can we define disease without referencing "good/bad"?
      *   *D5: Consistency.* Same condition = same status across contexts.
      *   *D6: Agency/Responsibility.* Distinguish inability from unwillingness (sick leave).
      *   *D7: Cultural/Historical Stability.* Doesn't change just because norms change (unless biology changes).

  4.  **Analyzing Camp Prejudices vs. Load-Bearing:**
      *   *Naturalist Prejudice:* "Must be value-free," "Must be based on biological mechanism."
      *   *Normativist Prejudice:* "Must reflect social harm," "Must allow for social construction."
      *   *Load-Bearing:* "Must distinguish treatable from non-treatable," "Must justify resource expenditure," "Must distinguish excuse from choice."
      *   *Negotiability:* Some things *must* be non-negotiable for the practical purpose (e.g., action-guidance). Others are theoretical preferences.

  5.  **Identifying Joint Unsatisfiability (The "Trilemma"):**
      *   The classic tension: Objectivity + Normative Force + Value-Neutrality.
      *   If it's purely objective (Naturalism), it struggles to explain *why* we should care (Normative Force).
      *   If it's purely normative (Normativism), it struggles with Objectivity (consistency across cultures).
      *   If it's Value-Neutral, it can't distinguish disability from difference without smuggling in values.
      *   *Key Knockout:* The requirement that the definition *itself* justifies the intervention without external ethical premises. (The "Is-Ought" gap).

  6.  **Evaluating the GP Sister's View ("Disease is what we treat"):**
      *   This is Pragmatism/Institutionalism.
      *   Does it satisfy the spec?
      *   *Pros:* Action-guiding.
      *   *Cons:* Circular (Why do we treat it? Because it's a disease. What's a disease? What we treat.). Fails to guide *new* decisions (should we treat X?). Fails on fairness (if we stop treating, is it no longer a disease?).
      *   *Verdict:* Fails the "Justification" desideratum.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the pedagogical strategy (spec first).
      *   **The Spec Table:** Columns: Desideratum, Description, Why it Matters (Practical), Camp Bias (Naturalist/Normativist/Neutral), Negotiable?
      *   **Analysis of Unsatisfiability:** Explain the tension (The "Normative Gap").
      *   **The GP Sister Check:** Evaluate the pragmatic definition.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I cover the athlete's heart? Yes, under Statistics vs. Function.
      *   *Check:* Did I cover infertility? Yes, under Function vs. Preference.
      *   *Check:* Did I cover ADHD/Grief? Yes, under Cultural/Historical Stability and Harm.
      *   *Refinement on Bias:* Be careful not to label "Objectivity" as purely naturalist. Normativists want objective *rules* even if the content is value-laden. Better to label "Value-Freedom" as the Naturalist bias.
      *   *Refinement on Unsatisfiability:* The real killer is usually the demand for the definition to *do* the ethical work. The definition identifies the condition; ethics decides the response. If the spec demands the definition *justify* the response, that's the tension.

  9.  **Final Polish:** Ensure tone is appropriate for a professor designing a module. Keep it sharp. (Proceed to generate output based on these thoughts).

  *(Self-Correction on the "Joint Unsatisfiability" point)*: I need to be precise. The classic Boorse vs. Engel debate highlights this. The most potent conflict is between **Value-Neutrality** (Naturalist demand) and **Action-Guidance** (Practical demand). You can't get an "ought" (treat this) from an "is" (biological stat) without a bridge premise. If the spec demands the definition *provide* the bridge, it's impossible. I will frame this as the "Normative Gap."

  *(Self-Correction on GP Sister)*: Her view is essentially "Institutionalism." It fails because it's backward-looking. We need a definition to decide what to treat *next*, not just codify what we *already* treat. It fails the "Guidance for New Cases" desideratum.

  10. **Final Review against constraints:** Table format? Yes. No citations? Yes. Address all specific cases (athlete, infertility, ADHD)? Yes. Address GP sister? Yes. Address unsatisfiability? Yes.

  (Ready to write.)
answer: |-
  Here is a specification sheet designed for your students. It frames the philosophical debate as an engineering problem: *Build a definition that can actually run a healthcare system.*

  ### Part 1: The Specification (Desiderata for Health/Disease)

  | # | Desideratum | Practical Rationale (The "Work" It Must Do) | Camp Prejudice? | Negotiable? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Statistical Discrimination** | Must distinguish between *rare* traits and *pathological* traits. (e.g., Athlete's slow heart vs. bradycardia; evolutionary back pain vs. herniated disc). | **Naturalist Lean:** Assumes there is a "normal" distribution that matters. <br>**Normativist Lean:** Assumes "normality" isn't enough without harm. | **No.** If the system pays for every statistical outlier, it goes bankrupt. |
  | **2** | **Functional Baseline** | Must identify a failure of internal organization, not just a failure to meet external goals. (e.g., Infertility is a disease; choosing childlessness is not). | **Naturalist:** Heavy reliance on "biological function." <br>**Normativist:** Functions are often teleological/value-laden. | **No.** Without this, we cannot distinguish inability (sick leave) from unwillingness (quitting). |
  | **3** | **Harm/Disadvantage Condition** | Must explain why the condition warrants intervention. A biological glitch that causes no suffering or limitation need not be treated. (e.g., Asymptomatic conditions). | **Normativist:** "Harm" is inherently evaluative. <br>**Naturalist:** Tries to reduce harm to "reduced survival/reproduction." | **Yes.** (See *Unsatisfiability* below). Some systems treat asymptomatic risks (prophylaxis); others treat only symptoms. |
  | **4** | **Cultural/Historical Stability** | Must prevent diagnosis from shifting purely due to social fashion. (e.g., Grief vs. Depression; ADHD prevalence changes). | **Naturalist:** Demands biology stays constant. <br>**Normativist:** Accepts norms change, so diagnoses might too. | **No.** Legal excuses and funding require consistency over time. You can't have sick leave valid in 2020 but not 2024 for the same biology. |
  | **5** | **Value-Neutrality (Objectivity)** | Must be adjudicable by medical testing, not moral debate. Two doctors should agree on the *presence* of disease even if they disagree on *treatment*. | **Naturalist:** Core demand. <br>**Normativist:** Rejects this as impossible; all diagnosis is value-laden. | **Yes.** (See *Unsatisfiability* below). |
  | **6** | **Action-Guidance** | The label "disease" must logically lead to "entitled to care/excuse." It cannot be a dead label. | **Neutral:** Required for the practical purpose you set (funding/law). | **No.** If the definition doesn't trigger action, it fails the syllabus prompt. |
  | **7** | **Agency Distinction** | Must distinguish conditions that undermine agency (excusable) from those that are expressions of identity or choice (not excusable). | **Normativist:** Relies on social concepts of responsibility. <br>**Naturalist:** Relies on "internal vs external" causes. | **No.** Essential for legal excuses and sick leave. |

  ---

  ### Part 2: Analysis of Joint Unsatisfiability

  **The Lesson of the Module:**
  There is a subset of requirements here that is **jointly unsatisfiable**. Specifically, you cannot simultaneously satisfy **Desideratum 5 (Value-Neutrality)** and **Desideratum 6 (Action-Guidance)** while maintaining **Desideratum 3 (Harm Condition)**.

  *   **The Conflict:** This is the Is-Ought Gap.
      *   If you demand the definition be **Value-Neutral** (purely biological/statistical facts), you cannot derive **Action-Guidance** (we *ought* to treat this) without smuggling in an external ethical premise. Biology tells you the engine is broken; it does not tell you that you *must* fix it.
      *   If you demand the definition provide **Action-Guidance** intrinsically (calling it a disease *means* it should be treated), you violate **Value-Neutrality**. You have baked a moral claim into a factual claim.
      *   **The Knockout Requirement:** **Desideratum 5 (Value-Neutrality)** is the one that knocks out the main contenders.
          *   **Naturalist accounts** (e.g., Boorse) satisfy Neutrality and Stability but fail Action-Guidance (Why treat a statistical dysfunction if the person is happy?).
          *   **Normativist accounts** (e.g., Engel, Fulford) satisfy Action-Guidance and Harm but fail Neutrality and Stability (If "harm" is subjective, grief can become depression based on policy changes).

  **Pedagogical Payoff:**
  The students should realize that a definition of disease cannot do *all* the work. The definition identifies the *condition*; a separate ethical framework must justify the *intervention*. If they demand the definition do both, no theory will pass the spec.

  ---

  ### Part 3: The GP Sister Check

  **Her Claim:** "Disease is just what we treat." (Institutionalism/Pragmatism)

  **Verdict:** **Fails the Spec.**

  **Why it fails:**
  1.  **Violates Desideratum 6 (Action-Guidance):** Her definition is circular. It looks backward at current practice rather than forward at new cases. It cannot answer the question, *"Should we start treating X?"* because X only becomes a disease *after* we decide to treat it. It offers no criteria for expanding or contracting the list.
  2.  **Violates Desideratum 4 (Stability):** If funding runs out and we stop treating a condition, her definition implies it ceases to be a disease. This makes legal excuses and patient rights contingent on budget cycles, which is legally and ethically untenable.
  3.  **Violates Desideratum 7 (Agency Distinction):** We sometimes treat things that aren't diseases (cosmetic surgery, enhancement) and don't treat things that are diseases (rare orphan diseases with no therapy). Her definition collapses the distinction between *medicalized* and *pathological*.

  **How to use this in class:**
  Her view is the "Realist" check against the philosophers, but it fails the *normative* test. It describes how systems *operate*, not how they *ought to decide*. It satisfies the "what is" but fails the "what should be," which is exactly what your syllabus module aims to interrogate.
