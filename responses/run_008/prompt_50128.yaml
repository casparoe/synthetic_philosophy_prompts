answer: |-
  1. Both frameworks agree that an agent who merely foresees a beneficial side effect does not deserve full moral credit for producing it. They converge here because both deny that the good outcome was part of the agent's primary plan or intention.

  2. They pull apart sharply on harmful outcomes, where ordinary judgments erase the intended/foreseen distinction while the doctrine insists it carries all the moral weight. This conflict hinges on whether foreseeing a harm while being indifferent to it amounts to accepting it as part of one's intention.

  3. If the intentionality judgments are really a way of signaling blame rather than describing mental states, the doctrine's grip on real cases weakens because legal liability often rests on those same folk concepts. This reading suggests the doctrine may be fighting a linguistic habit rather than correcting a moral error.

  4. In the helpful-side-effect case, both frameworks agree that the agent gets no credit, but they do not agree for the same reason. The experimental finding tracks conceptual usage regarding desire, whereas the doctrine tracks moral permissibility regarding intended ends.

  5. The doctrine's permission structure is more fundamental because it prescribes how we ought to reason about action, whereas the psychological asymmetry merely describes a biased heuristic.
