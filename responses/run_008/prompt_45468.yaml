answer: |-
  # Lesson Plan: The Consistency Game
  **Topic:** Wittgenstein's Rule-Following Considerations  
  **Time:** 75 Minutes  
  **Class Size:** 12 Students (Upper-Level Seminar)  
  **Goal:** Phenomenological experience of the underdetermination of rules by past performance.

  ## I. Materials & Setup

  **Room:** Arrange tables into 3 distinct pods. 4 students per pod.
  **Handouts (per pod):**
  1.  **4 Judge's Logs:** Simple sheets with columns for `Step #`, `Player Input`, `Verdict (C/I)`, `Reason for Verdict`.
  2.  **12 Role Cards:** (3 sets of 4).
      *   **Judge:** "You are the authority. You possess the **Public Rule**. You must mark the Player's output Correct (C) or Incorrect (I) based *only* on the Public Rule and the history of Correct answers. You cannot ask the Player what they are thinking."
      *   **Player:** "You possess a **Secret Algorithm**. Generate numbers one by one. Your goal is to get 'Correct' marks. Do not reveal your algorithm."
      *   **Observer A & B:** "Watch the Judge and Player. Your goal is to track consistency. In Round 3, you will have a special mission (see Round 3 Briefing)."
  3.  **Rule Deck (for Judges):** 4 cards per pod.
      *   *Card 1:* "The sequence must increase."
      *   *Card 2:* "The difference between numbers must be constant."
      *   *Card 3:* "Do the same thing to the previous number." (The Ambiguous Card)
      *   *Card 4:* "The sequence must remain even."
  4.  **Algorithm Deck (for Players):** 4 cards per pod.
      *   *Card 1:* "Add 2."
      *   *Card 2:* "Add 3."
      *   *Card 3:* "Add 2, but if the number is > 10, add 4." (The Quus Card)
      *   *Card 4:* "Multiply by 1 (repeat number)."
  5.  **Whiteboard/Marker** per pod for tracking the sequence.

  ## II. Timeline (75 Minutes)

  | Time | Segment | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Intro** | Distribute materials. Explain the goal: "Test the limits of consistency." **Forbidden:** Do not mention Wittgenstein, Kripke, skepticism, or meaning. |
  | **10-18** | **Round 1** | Standard Play. (A=Judge, B=Player, C/D=Observers). 5 steps max. |
  | **18-26** | **Round 2** | Rotate Roles. (B=Judge, C=Player, D/A=Observers). 5 steps max. |
  | **26-38** | **Round 3** | **The Crisis Round.** (C=Judge, D=Player, A/B=Observers). Observers given "Rival Rule" mission. |
  | **38-46** | **Round 4** | Cool Down. (D=Judge, A=Player, B/C=Observers). 5 steps max. |
  | **46-75** | **Debrief** | Full class discussion mapping game to philosophical problem. |

  *Note: 8 minutes per round is tight. Use a visible timer. Call "Step 3," "Step 5," "Stop."*

  ## III. Game Rules & Mechanics

  **Standard Rounds (1, 2, 4):**
  1.  **Judge** draws a Public Rule card. **Player** draws a Secret Algorithm card.
  2.  **Player** writes the first number. **Judge** marks C or I in their Log and writes a 3-word reason (e.g., "Fits difference").
  3.  Repeat for 5 steps.
  4.  **Observers** verify the Judge is using the Log, not gut feeling.
  5.  **Rotate:** Pass cards clockwise. Judge becomes Player, Player becomes Observer, etc.

  **Round 3 (The Crisis Round):**
  1.  **Setup:** Judge gets Public Rule: *"Do the same thing."* Player gets Secret Algorithm: *"Add 2."*
  2.  **Steps 1-4:** Play normally (2, 4, 6, 8). Judge marks all Correct.
  3.  **The Pause:** Before Step 5, **Stop the Timer.**
  4.  **Observer Mission:** Observers A & B must huddle and write down a **Rival Rule** on a slip of paper.
      *   *Constraint:* The Rival Rule must fit all 4 previous "Correct" answers perfectly.
      *   *Constraint:* The Rival Rule must demand a *different* Step 5 than the Player intends (e.g., "Add 2 until 8, then add 10" $\rightarrow$ Next is 18, not 10).
  5.  **The Confrontation:** Observers show the Rival Rule to the Judge.
  6.  **The Verdict:** The Player writes Step 5. The Judge must rule C or I.
      *   *Crucial:* The Judge must decide if the *original* Public Rule + Past Data forces the Player's move, or if the Observers' Rival Rule is equally valid.
  7.  **Log It:** Judge records the dilemma in the "Reason" column.

  ## IV. Debrief Guide (30 Minutes)

  *Do not lecture. Ask questions. Map their frustration to the text later.*

  **Phase 1: The Data (5 mins)**
  *   "Judges, look at your Logs from Round 1 vs. Round 4. Did your definition of 'Correct' change? Did you get stricter or looser?"
  *   "Round 3 Judges: When the Observers showed you the Rival Rule, did you feel you had the *authority* to reject the Player's next move? Why?"

  **Phase 2: The Skeptical Challenge (10 mins)**
  *   "In Round 3, the Player followed their algorithm. The Observers found a rule that fit the past. Both rules fit the past. What fact about the Player *before* Step 5 determined that Step 5 *had* to be 10 and not 18?"
  *   "If the Judge says 'But they meant Add 2,' I ask: What is the fact of 'meaning'? Is it a feeling? A brain state? A prior utterance?"
  *   *Introduce the Paradox:* "This is the Rule-Following Paradox. No course of action could be determined by a rule, because every course of action can be made out to accord with the rule." (PI §201).

  **Phase 3: Responses & Costs (10 mins)**
  *   **The Communal Reply:** "In the game, the Judge had the final say. In real life, who is the Judge?" (The community). "If the community says 18 is correct, is it?"
  *   **The Dispositional Reply:** "Maybe the Player was *disposed* to say 10." "But how do we check that disposition without asking them to act? And if they act, we are back to the game."
  *   **The Cost:** "If meaning is just what the community accepts, is there such a thing as being *wrong*? Or just being *outvoted*?"

  **Phase 4: Wittgenstein's Dissolution (5 mins)**
  *   "Wittgenstein doesn't solve the paradox by finding a hidden fact. He dissolves it by changing how we look at 'rules.' Rules aren't rails that extend to infinity; they are customs, practices, institutions."
  *   "The game felt broken because we tried to play it without a *form of life*. We stripped away the context of *why* we are counting."

  ## V. Prediction of Failure: Judge Drift

  **The Problem:**
  In a 40-minute game, Judges will suffer **Normative Drift**.
  *   **Round 1:** Judges adhere strictly to the text ("The rule says 'increase', 4 is greater than 2, so Correct").
  *   **Round 3:** Judges are tired. They rely on intuition ("I see where this is going, 10 feels right").
  *   **Round 4:** Judges become tyrants or libertines. Some will reject valid moves to assert authority; others will accept anything to end the round.

  **How to Use This as Data:**
  Do not fight this drift. **Harvest it.**
  1.  **Collection:** Collect the Judge's Logs at the end.
  2.  **Comparison:** In the debrief, project two logs from the same student (Round 1 vs. Round 4).
  3.  **The Point:** "Your standard for 'Correct' changed not because the rule changed, but because *you* changed. This proves Wittgenstein's point: The rule itself (the signpost) does not contain its own application. The application requires a living practice, and practices tire, shift, and drift. The 'obligation' you felt in Round 1 was a feeling, not a logical chain."

  ## VI. Limitations: What This Activity Cannot Do

  Be frank with yourself about where the simulation fails to capture the philosophy. You must supply these nuances in the debrief.

  1.  **The "Mental State" Trap:**
      *   *Activity:* Students will assume the Player *knows* the rule in their head, and the Judge is just trying to guess it.
      *   *Wittgenstein:* The point is that *even the Player's mental state* does not fix the rule. The Player themselves faces the paradox at Step 5. The activity makes it an interpersonal conflict (Judge vs. Player); Wittgenstein makes it an intrapersonal one (Me vs. My Future Self).
      *   *Fix:* In debrief, ask the Players: "At Step 5, were *you* sure you were following the same rule as Step 1? Or did you just trust your habit?"

  2.  **Induction vs. Meaning:**
      *   *Activity:* The game looks like a problem of induction (predicting the next number based on past data).
      *   *Wittgenstein:* This is not about prediction; it is about *meaning*. It's not "What *will* they do?" but "What *ought* they do?"
      *   *Fix:* Emphasize the Judge's "Obligation." "You didn't just predict 10; you felt 18 was *forbidden*. Where did that prohibition come from?"

  3.  **Explicit vs. Tacit Rules:**
      *   *Activity:* We used written cards.
      *   *Wittgenstein:* Most rule-following is tacit (e.g., continuing a melody, using a word). Written rules are the exception.
      *   *Fix:* Ask: "If we played this with the word 'Game' instead of numbers, would the paradox be clearer?"

  4.  **The "Skeptic" Misreading:**
      *   *Activity:* The game validates the Skeptic (There is no fact of the matter!).
      *   *Wittgenstein:* He is not a skeptic. He agrees there is no *metaphysical* fact, but insists there is a *grammatical* fact found in use.
      *   *Fix:* Ensure the debrief ends on "Forms of Life," not "Nothing is Real." The game breaks meaning; philosophy restores it by putting it back in the world.

  ## VII. Instructor's Cheat Sheet (For the "Rival Interpretation")

  If your Observers in Round 3 freeze and cannot generate a Rival Rule, have these backups ready to whisper to them:
  *   **The "Quus" Switch:** "Add 2, but if the sum is 10 or higher, add 4." (Sequence: 2, 4, 6, 8... **12**).
  *   **The "Modulo" Switch:** "Add 2, unless the number is a multiple of 4, then add 6." (Sequence: 2, 4, **10**, 12... wait, 4 is multiple of 4. So 2, 4, 10... No, keep it simple).
  *   **The "Digit" Switch:** "Add 2, but if the previous number contains a circle (0, 4, 6, 8, 9), add 10." (Sequence: 2, 4[has circle], **14**, 16[has circle]...).
  *   **Easiest:** "Add 2 for the first 4 steps. Then add 20." (Sequence: 2, 4, 6, 8... **28**).

  ## VIII. American English Usage Notes
  *   Use "Math" instead of "Maths."
  *   Use "Grade" or "Score" instead of "Mark."
  *   Ensure tone is pragmatic and direct ("Here's the deal," "Call it out").
  *   Avoid overly analytic jargon in the intro ("qualia," "normativity") until the debrief.
