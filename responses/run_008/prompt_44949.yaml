          3.  Emotions as Feelings of Bodily Change (Jamesian/Somatic).
      *   **Specific Wrinkles/Questions to Address:**
          *   The Homunculus Problem (Emotions as little agents).
          *   Basic Emotions Theory vs. Mixed Emotions (Discrete modules vs. blended memories).
          *   Joy's Role (Emotion vs. Regulator/Suppression).
      *   **Format Requirements:**
          *   Start with brainstorming mappings.
          *   Point to specific scenes.
          *   Be honest about where the film resists readings (don't force it).
          *   End with a confidence level and the least sure claim.

  2.  **Initial Brainstorming & Mapping:**

      *   *Theory 1: Judgments/Appraisal.* Emotions are evaluations of the world.
          *   *Film Fit:* The console requires an "input" (event) before an "output" (emotion). Riley sees something, the emotion interprets it.
          *   *Tension:* The emotions *are* the agents making the judgment, not the result of the judgment. They have personalities.
      *   *Theory 2: Perceptions of Value.* Emotions reveal what matters to us.
          *   *Film Fit:* Core Memories are literally glowing orbs of value. Sadness touching them changes their value (blue instead of gold).
          *   *Tension:* Perceptual theory usually implies passivity (we *see* value). Here, Emotions actively *construct* the value.
      *   *Theory 3: Jamesian/Somatic.* Emotions are the feeling of the body reacting.
          *   *Film Fit:* When an emotion hits the console, Riley's body reacts (blushing, crying, screaming). The "Islands of Personality" are tied to physical activities (Hockey, Goofball).
          *   *Tension:* The emotions are in the *head*, controlling the body from above. James says the bodily change *is* the emotion. Here, the little guy pushes the button, *then* the body reacts. It's more Cartesian than Jamesian.

      *   *The Homunculus Problem:* This is the big one. By making Emotions little people, the film commits the "homunculus fallacy" (explaining the mind by positing a little man inside the mind). Does this favor one theory? It makes them look like *agents* (Judgment) rather than *states* (James/Perception).
      *   *Basic Emotions vs. Mixed:* Starts with Ekman's Basic 5 (Joy, Sadness, Anger, Fear, Disgust). Ends with complex, blended memories. This suggests a developmental arc from simple to complex.
      *   *Joy as Regulator:* Joy tries to manage the system. This looks like emotional regulation (Gross's process model) rather than emotion proper.

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the brilliance of the choice. It *is* a thought experiment, but a messy one.
      *   **Brainstorming Mappings:** Lay out the initial connections before diving deep.
      *   **Theory 1: Emotions as Judgments (Stoic/Appraisal).**
          *   *Scene:* The Dinner Table (Broccoli pizza).
          *   *Fit:* Emotions assess the situation.
          *   *Resistance:* They are characters, not just acts of assessment.
      *   **Theory 2: Emotions as Perceptions of Value.**
          *   *Scene:* Sadness touching the Core Memory.
          *   *Fit:* Emotions color how we see the past.
          *   *Resistance:* Value seems objective in the film (Gold = Good), whereas perceptual theory is often about subjective take.
      *   **Theory 3: Emotions as Bodily Feelings (James).**
          *   *Scene:* Riley stealing the credit card / Running away.
          *   *Fit:* Physical manifestation.
          *   *Resistance:* The Cartesian Control Room setup contradicts James. The body is a puppet, not the source.
      *   **The Homunculus Wrinkle:** Address the "little agents" issue. It favors the Judgment/Agent view but creates an infinite regress problem philosophically.
      *   **Basic Emotions vs. Blending:** Address the shift from discrete to complex. It's not a refutation, but a maturation.
      *   **Joy as Regulator:** This is a keen insight. Joy acts like a manager. This blurs the line between *having* an emotion and *managing* it.
      *   **Conclusion/Verdict:** Confidence level and uncertainty.

  4.  **Refining the Philosophical Nuance:**

      *   *Homunculus:* I need to be clear that philosophically, this is usually a bug, but narratively it's a feature. It aligns best with *Agent-based* theories (like some readings of Nussbaum's cognitive theory where emotions are eudaimonistic judgments), but it risks reifying emotions into little demons.
      *   *James:* I need to emphasize the *Cartesian Theater* aspect. *Inside Out* is dualist. James is monist/physicalist. This is the hardest fit.
      *   *Joy:* Is Joy an emotion or the Ego? The film treats her as an emotion, but her function is homeostatic. This is a great point for class discussion.

  5.  **Selecting Specific Scenes:**
