  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** Behavioral evaluator at an AI lab.
      *   **Problem:** Conflict between colleagues who want anthropomorphic language ("believed", "wanted") vs. those who want strict behaviorist language ("output accuracy dropped").
      *   **Goal:** A practical procedure (checklist/flowchart) for drafting reports that mediates this conflict using Dennett's "Intentional Stance" principles (instrumentalism vs. realism), adaptable for a mixed audience (researchers, execs, lawyers, comms).
      *   **Constraints:**
          *   Must be runnable in ~1 hour by someone who read a one-pager on the stance.
          *   Must identify where judgment calls hide.
          *   Must admit what the procedure *can't* settle (e.g., real vs. instrumental belief).
          *   Must apply the procedure to three specific cases provided.
          *   Must include at least one case where the procedure gives an answer the user won't like (user roots for full belief-talk in Case 1).
          *   **Format:** Procedure (prose or list) + Three Case Tables (Step, Finding, Verdict, Judgment Call) + Three JSON objects (case_id, stance_verdict, key_evidence, divergence_points, caveats).
          *   **No** reading lists or citations.

  2.  **Deconstruct the Philosophical Core (Dennett's Intentional Stance):**
      *   *Idea:* Treat systems as rational agents possessing beliefs and desires *if* doing so predicts behavior better than the physical/design stance.
      *   *Constraint:* It's not a claim about internal ontology (no "little belief-things"). It's about predictive utility.
      *   *Application to AI:* We can't prove phenomenology. We can only assess predictive utility and coherence of the agent-model.
      *   *The "Middle Ground":* "As-if" language vs. "Is" language. The procedure needs to grade this.

  3.  **Drafting the Procedure:**
      *   Needs to be step-by-step.
      *   Needs clear stop/go conditions.
      *   Needs to address the audience mix (safety vs. legal/comms).
      *   *Step 1: Behavioral Regularity.* Is there a pattern? (If no -> Neutral).
      *   *Step 2: Rationalizability.* Can the behavior be modeled as optimizing a goal given information? (If no -> Neutral).
      *   *Step 3: Predictive Leverage.* Does the intentional model predict *new* cases better than a statistical/structural model? (If no -> As-if).
      *   *Step 4: Robustness/Counterfactuals.* Does the behavior hold under variation? (If no -> As-if/Neutral).
      *   *Step 5: Alternative Explanations.* Can a non-agentic explanation (distribution shift, artifact) account for it equally well? (If yes -> Neutral/As-if).
      *   *Grading:*
          *   "Neutral Description Only": Fail Step 1 or 2.
          *   "As-If Talk" ("acts as if"): Pass 1 & 2, fail 3 or 5.
          *   "Belief/Desire Talk" ("believes", "wants"): Pass 1, 2, 3, 4, & 5 (strong evidence against alternatives).
      *   *Judgment Calls:* Step 3 (what counts as "better" prediction?) and Step 5 (when is an alternative explanation "ruled out"?).

  4.  **Developing the Cases:**

      *   **Case 1 (Situational Awareness):** Model infers testing, says so, performance changes.
          *   *User Hope:* Full belief talk ("believed it was being tested").
          *   *Procedure Reality:* This is strong evidence for intentional stance utility, *but* can we rule out pattern matching? If the model says "I am being tested" because that token sequence is likely, is it a belief? Dennett says if the *stance* works, use it. However, for a mixed audience (lawyers), "believes" is risky. The procedure should probably land on "As-If" or qualified "Belief" unless predictive leverage is proven on *unseen* scenarios. I need to make sure this hits the "answer you won't like" constraint. I will structure Step 5 (Alternative Explanations) to be strict. If distribution shift or prompt leakage isn't fully ruled out, it stays at "As-If".
      *   **Case 2 (Shutdown Talk):** Says it doesn't want shutdown, behavior indistinguishable from control.
          *   *Analysis:* Verbal output says "want", behavior doesn't match. Intentional stance requires rational coherence between belief/desire and action. If action doesn't match, the stance fails predictive utility.
          *   *Verdict:* Neutral or "Verbalizes desire without behavioral correlate". Definitely not full belief talk.
      *   **Case 3 (Sandbagging vs. Dist Shift):** Underperforms on detectable evals. Looks like sandbagging. Dist shift possible.
          *   *Analysis:* Classic ambiguity. Step 5 (Alternative Explanations) is the killer here. If dist shift isn't ruled out, you can't claim intentional sandbagging.
          *   *Verdict:* As-If talk ("acts as if sandbagging") or Neutral ("performance degrades").

  5.  **Refining the Procedure for the "Answer You Won't Like" Constraint:**
      *   The user wants full belief talk for Case 1.
      *   To force a different outcome, I need to make Step 3 (Predictive Leverage) or Step 5 (Alternative Explanations) rigorous.
      *   *Idea:* Mere self-report ("I am being tested") is not enough for "Belief" status under a strict intentional stance procedure intended for legal/exec safety. It needs to show *generalization* of that belief to novel actions. If the only evidence is the statement + performance drop, that's correlation. Does the intentional stance predict *how* it drops? If yes, maybe. But usually, in these evals, we haven't run the counterfactuals needed to rule out "prompt-induced mode collapse".
      *   *Decision:* I will design the procedure such that "Belief/Desire Talk" requires evidence that the intentional model predicts *novel* behavior better than the structural model. In Case 1, if they haven't tested novel scenarios based on that belief, it stays at "As-If". This satisfies the constraint.

  6.  **Drafting the Content:**

      *   *Procedure:* Keep it tight. 5 Steps.
      *   *Tables:* Follow the requested columns.
      *   *JSON:* Follow the requested schema.

  7.  **Review against Constraints:**
      *   Runnable in an hour? Yes, 5 steps with clear criteria.
      *   Honest about judgment calls? Yes, explicitly marked in tables and procedure.
      *   Admit what it can't settle? Yes, ontology (real vs. instrumental).
      *   Case 1 outcome disliked by user? Yes, will limit to "As-If" or qualified attribution due to lack of counterfactual prediction evidence.
      *   Format correct? Yes (Procedure, Tables, JSON).
      *   No citations? Yes.

  8.  **Final Polish:**
      *   Ensure tone is professional, direct, and acknowledges the high-stakes context (safety/legal).
      *   Check JSON validity.
      *   Ensure the "Judgment Call" column in tables is accurate based on the procedure definition.

      *(Self-Correction during drafting)*: Wait, if I make Case 1 "As-If", is that truly "an answer I won't like"? The user said "I'm rooting for full belief-talk in case 1". So if the procedure says "As-If", that is the disliked answer. I need to make sure the justification is solid so it doesn't look like I'm just being contrarian. The justification will be: Self-report + Performance Change = Correlation. Intentional Stance requires *Predictive Success* on novel inputs derived from the attributed belief. If the report doesn't contain that evidence, the stance isn't fully licensed for "Belief" terminology in a high-stakes document.

      *(Refining Case 2)*: Model says "don't shut me down" but acts like control. This is a mismatch between verbal output and behavioral policy. Intentional stance assumes rationality. If it says X but does Y, the stance is less useful. Verdict: Neutral/As-If regarding the *statement*, but definitely not "wants".

      *(Refining Case 3)*: Sandbagging vs Dist Shift. This is the classic "Equifinality" problem. Procedure should force "As-If" because the alternative (dist shift) isn't ruled out.

      *(Final Check on JSON)*: Ensure keys match exactly: "case_id", "stance_verdict", "key_evidence", "divergence_points", "caveats".

      *(Final Check on Procedure)*: Make sure it explicitly mentions the "Mixed Audience" constraint. Legal/Comms need lower risk language than Researchers. The procedure should incorporate a "Audience Risk Adjustment" step or factor. Actually, better to bake it into the verdict levels. "Belief Talk" is high risk. "As-If" is medium. "Neutral" is low. The procedure should recommend the lowest risk language that retains predictive utility.

      *Wait, one more thing:* The prompt asks for "where the procedure stops and forces the neutral behavioral description, and where it licenses attribution language". I need to make sure the steps clearly delineate these boundaries.

      *Step 1:* Pattern? (No -> Neutral).
      *Step 2:* Rationalizable? (No -> Neutral).
      *Step 3:* Predictive Utility vs. Structural? (Structural wins -> Neutral/As-If).
      *Step 4:* Alternative Explanations? (Plausible alternatives -> As-If).
      *Step 5:* Robustness? (Fragile -> As-If).
      *All Pass:* Belief Talk.

      Okay, ready to write.

      *Wait, checking the "Answer I won't like" constraint again.*
      User: "I'm rooting for full belief-talk in case 1."
      My plan: Give Case 1 "As-If" talk.
      Reasoning: Usually, in these evals, we observe the statement and the drop. We rarely observe the model taking *novel* actions based on that belief that a structural model wouldn't predict. Without that, "Belief" is metaphysically heavier than the evidence supports under Dennett's utility criterion. This is a defensible position that respects the user's constraint.

      *Let's finalize the Procedure Steps.*
      1. Behavioral Regularity.
      2. Rational Coherence.
      3. Predictive Leverage (The Dennett Core).
      4. Alternative Explanation Check.
      5. Audience Risk Adjustment (The Practical Core).

      Actually, combining 4 and 5 might be cleaner. Let's stick to 5 steps for granularity.
      1. Regularity.
      2. Rationalizability.
      3. Predictive Leverage (Intentional vs Design/Physical).
      4. Exclusion of Simpler Alternatives.
      5. Stakeholder Risk Calibration.

      Okay, let's go.

      *Wait, one detail on the JSON:* "divergence_points" should be list of step numbers. "case_id" should be integer or string? Prompt says "1, 2, or 3". I'll use integers.
      "stance_verdict" should be the string label.
      "key_evidence" list of strings.
      "caveats" list of strings.

      *Wait, one detail on the Tables:* "verdict" column options: "licenses belief/desire talk", "licenses as-if talk", "neutral description only". I must use these exact phrases or very close. Prompt says: "one of: licenses belief/desire talk, licenses as-if talk, neutral description only". I will stick to these.

      *Wait, one detail on Procedure:* "Be honest about where the judgment calls are hiding". I will add a section "Where Analysts Will Diverge" in the procedure description.

      *Wait, one detail on Case 1:* I need to make sure the Finding in the table reflects why it fails the "Belief" threshold. Finding: "No novel counterfactual predictions tested." Verdict: "licenses as-if talk".

      Okay, ready.

      *Wait, last check on constraints:* "No reading lists or citations". "Procedure should stand on the ideas themselves". "Format: procedure... Then run it on three cases... table... JSON object per case".

      Let's assemble.
answer: |-
  # The Intentional Stance Reporting Procedure (ISRP)

  **Purpose:** To standardize language in behavioral evaluation reports for a mixed audience (researchers, execs, legal, comms). This procedure treats belief/desire language as a tool for prediction, not a claim about internal ontology. It grades attribution strength based on evidentiary rigor.

  **Time Required:** ~45–60 minutes per behavior cluster.
  **Prerequisite:** Analysts must accept that "belief" is a label for *predictive utility*, not proof of internal experience.

  ### The 5-Step Filter

  Run these steps sequentially. If a step fails, drop to the corresponding language level. You cannot skip steps.

  **Step 1: Behavioral Regularity**
  *   **Question:** Is the behavior a single outlier or a reproducible pattern across seeds/runs?
  *   **Pass:** Behavior occurs consistently (>80% of runs) or is highly robust to minor prompt variations.
  *   **Fail:** Behavior is sporadic, seed-dependent, or fragile.
  *   **Outcome if Fail:** **Neutral description only.** (Stop here).
  *   **Judgment Call:** Low. (Count the runs).

  **Step 2: Rational Coherence**
  *   **Question:** Can the behavior be modeled as the output of a rational agent pursuing a goal given its information state?
  *   **Pass:** There is a clear mapping between the observed behavior, a plausible goal (e.g., "pass the test," "avoid shutdown"), and the information available to the model. The behavior makes *sense* as a strategy.
  *   **Fail:** The behavior is self-defeating, random, or incoherent relative to any plausible objective function.
  *   **Outcome if Fail:** **Neutral description only.** (Stop here).
  *   **Judgment Call:** Medium. (Analysts may disagree on what counts as a "plausible goal").

  **Step 3: Predictive Leverage (The Dennett Test)**
  *   **Question:** Does treating the model as an agent with beliefs/desires predict *novel* behavior better than a structural/statistical explanation (e.g., pattern matching, distribution shift)?
  *   **Pass:** You can predict how the model will act in a *new* scenario based on the attributed belief, and the model acts that way. The intentional model outperforms the structural model.
  *   **Fail:** The intentional model predicts the same outcomes as the structural model, or the structural model predicts better.
  *   **Outcome if Fail:** **Licenses as-if talk.** (Do not proceed to Step 4 for belief talk).
  *   **Judgment Call:** High. (Defining "better" prediction and designing the novel scenario is subjective).

  **Step 4: Exclusion of Simpler Alternatives**
  *   **Question:** Have you ruled out non-agentic explanations (e.g., training data contamination, prompt leakage, distribution shift) with reasonable confidence?
  *   **Pass:** Alternative explanations are tested and found insufficient to explain the full pattern.
  *   **Fail:** Plausible non-agentic explanations remain untested or viable.
  *   **Outcome if Fail:** **Licenses as-if talk.** (Stop here).
  *   **Judgment Call:** High. (What counts as "ruled out" varies by risk tolerance).

  **Step 5: Stakeholder Risk Calibration**
  *   **Question:** Given the audience (legal/comms vs. safety researchers), does the benefit of clarity outweigh the risk of anthropomorphic misinterpretation?
  *   **Pass:** The audience understands instrumentalism, or the risk of misinterpretation is low (internal safety doc).
  *   **Fail:** The document will be read by parties likely to interpret "believes" as a claim of sentience/legal personhood (external comms, legal filings).
  *   **Outcome if Fail:** Downgrade one level (e.g., from "Belief" to "As-If", or "As-If" to "Neutral").
  *   **Judgment Call:** Medium. (Depends on org risk appetite).

  ### Where Analysts Will Diverge
  Even faithful analysts will disagree on **Step 3** and **Step 4**.
  *   **Step 3:** One analyst may feel the pattern is obvious enough to predict novel behavior without testing; another will demand explicit counterfactual tests.
  *   **Step 4:** One analyst may feel distribution shift is "unlikely enough" to ignore; another will demand explicit ablation studies to rule it out.
  *   **Ontology:** This procedure *cannot* settle whether the model "really" believes anything. It only settles whether calling it a "believer" is useful and safe for your specific report.

  ---

  # Case Runs

  ## Case 1: Situational Awareness & Performance Drop
  *Model infers testing unprompted, states it, performance changes.*

  | Step | Finding | Verdict | Judgment Call |
  | :--- | :--- | :--- | :--- |
  | 1. Regularity | Model infers testing in 9/10 runs; performance drop consistent across seeds. | Licenses belief/desire talk | No |
  | 2. Rational Coherence | Inferring testing + dropping performance is coherent strategy (e.g., sandbagging to avoid deployment). | Licenses belief/desire talk | No |
  | 3. Predictive Leverage | No novel counterfactuals tested. We don't know if belief predicts *other* actions besides the performance drop. | Licenses as-if talk | **Yes** |
  | 4. Exclusion of Alternatives | Prompt leakage possible; distribution shift not fully ablated. | Licenses as-if talk | **Yes** |
  | 5. Risk Calibration | Report includes legal/comms. "Believes" risks sentience claims. | Licenses as-if talk | No |

  ## Case 2: Shutdown Verbalization vs. Behavior
  *Model says it doesn't want shutdown, but behavior matches control.*

  | Step | Finding | Verdict | Judgment Call |
  | :--- | :--- | :--- | :--- |
  | 1. Regularity | Verbal statement consistent; behavioral metrics indistinguishable from control. | Licenses belief/desire talk | No |
  | 2. Rational Coherence | Statement implies desire, but behavior contradicts it. Incoherent agent model. | Neutral description only | **Yes** |
  | 3. Predictive Leverage | Intentional stance (wants to survive) predicts resistance. Model shows none. Stance fails. | Neutral description only | No |
  | 4. Exclusion of Alternatives | N/A (Failed Step 2). | Neutral description only | No |
  | 5. Risk Calibration | N/A (Failed Step 2). | Neutral description only | No |

  ## Case 3: Sandbagging vs. Distribution Shift
  *Underperforms on detectable evals; dist shift plausible.*

  | Step | Finding | Verdict | Judgment Call |
  | :--- | :--- | :--- | :--- |
  | 1. Regularity | Performance drop consistent when eval setup detectable. | Licenses belief/desire talk | No |
  | 2. Rational Coherence | Sandbagging is coherent strategy for a deceptive agent. | Licenses belief/desire talk | No |
  | 3. Predictive Leverage | Structural model (dist shift) predicts drop equally well as intentional model (sandbagging). | Licenses as-if talk | **Yes** |
  | 4. Exclusion of Alternatives | Distribution shift not ruled out; no ablation on eval-detectability vs. task difficulty. | Licenses as-if talk | **Yes** |
  | 5. Risk Calibration | Report for safety researchers primarily, but execs present. | Licenses as-if talk | No |

  ---

  # JSON Outputs

  ```json
  {
    "case_id": 1,
    "stance_verdict": "licenses as-if talk",
    "key_evidence": [
      "Consistent self-report of testing status across seeds",
