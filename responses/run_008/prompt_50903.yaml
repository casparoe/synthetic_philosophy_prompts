answer: |-
  The two-envelope paradox is one of those rare philosophical pests that refuses to be swatted. Your roommate, armed with the standard Bayesian cure, believes he has killed it. He sees the paradox as a simple arithmetic error—a misuse of conditional probability that vanishes the moment you impose a proper prior distribution on the amounts of money. In his view, anyone still puzzled is simply someone who hasn't finished their homework. He is technically correct, but philosophically myopic. He has solved the calculation, but he has missed the point.

  The verdict is this: The two-envelope paradox is not a mere howler. It is a substantive demonstration of the fragility of expected utility theory when faced with unbounded variables. The standard cure works only by smuggling in assumptions that the original problem statement does not guarantee. When you strip those assumptions away, the paradox returns, not as a math error, but as a proof that our intuitive principles of rational choice are mutually incompatible in infinite domains.

  To see why your roommate's smugness is premature, we have to grant him his victory on the naive version. He is right that the $1.25X$ argument collapses for any realistic distribution of money. If there is a maximum possible amount of money in the universe, or even just a probability distribution that decays fast enough, then observing a very large $X$ in your envelope makes it overwhelmingly likely that you hold the larger amount. The conditional probability $P(\text{other is larger} | \text{mine} = X)$ is not $0.5$; it drops as $X$ rises. The symmetry is preserved globally, and the incentive to switch evaporates. In a finite world, the paradox is indeed a howler.

  But the paradox was never about the real world. It is a thought experiment about the logic of decision-making under uncertainty. Thought experiments are allowed to push boundaries. This is where your roommate's defense—"nobody's prior is like that"—fails. It is an empirical objection to a logical problem. The paradox asks what a rational agent should do given the *structure* of the information, not given the constraints of the Federal Reserve.

  Consider the variant you mentioned: a generative process where, for every possible observed value $x$, the conditional probability that the other envelope contains more is strictly greater than one-half. Mathematically, this requires an improper prior (a distribution that doesn't sum to one) or an infinite expectation. Your roommate dismisses this as "pathological." But in the context of foundational decision theory, "pathological" is just a polite word for "boundary condition."

  In these infinite-expectation cases, the algebra your roommate trusts actually holds up. If you calculate the conditional expected value of switching given $X=x$, it *is* greater than $x$ for every $x$. The calculation isn't wrong. The breakdown occurs in the aggregation. We intuitively believe in a principle of dominance: if strategy A yields a better outcome than strategy B in every possible state of the world, you should prefer A. Here, "always switch" looks like it dominates "never switch" conditionally for every observed value. Yet, by symmetry, the unconditional expected value of both envelopes is identical (both are infinite).

  This is not a calculation error. It is a genuine incoherence in the framework of expected value. The paradox survives because it exposes a crack in the foundation of rational choice theory: **conditional dominance does not imply unconditional dominance when expectations diverge.**

  Your roommate argues that the paradox is cured by conditioning properly. But in the infinite case, you *are* conditioning properly. You are following the rules of probability and expected utility exactly as defined. The fact that these rules lead to a recommendation (switch) that contradicts the global symmetry (no difference) shows that the rules themselves are incomplete. The "cure" your roommate proposes is essentially to forbid the problem from existing by insisting on finite priors. That solves the problem by fiat, not by reasoning. It's like solving the question "What happens if you divide by zero?" by saying, "Well, nobody actually divides by zero."

  The substantive content of the paradox, therefore, is not that you should switch envelopes. It is that expected value maximization is not a closed, consistent system for unbounded problems. It forces us to choose between two deeply held intuitions: that we should maximize conditional expected utility based on available information, and that symmetric situations should yield symmetric choices. In the presence of infinity, you cannot have both.

  So, is your roommate justified in his insufferability? He is justified in knowing the algebra, but not in dismissing the puzzle. He treats the paradox as a mistake in arithmetic, when it is actually a mistake in ontology. It reveals that the concept of "rational expectation" is ill-defined without an external constraint on the size of the stakes. The paradox is a warning sign: if you allow your utilities or probabilities to range over the infinite, the machinery of rational choice grinds to a halt.

  The two-envelope problem is not a riddle with a solution; it is a limit case with a lesson. The lesson is that our standard tools for reasoning about value break down when the stakes are unbounded. Your roommate thinks he has fixed the engine because the car runs fine on the highway. You are right to point out that the engine explodes if you drive it off the map. The paradox remains substantive because it maps the edge of that cliff. Dismissing the edge because "nobody drives there" doesn't make the cliff any less real.
