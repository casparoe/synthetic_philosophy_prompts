answer: |-
  **Research Proposal**

  **Title:** Disentangling the Old Evidence Problem: A Formal Distinction between Empirical and Logical Uncertainty

  **1. Research Question**

  The central research question for this term paper is: *Does the Problem of Old Evidence constitute a single theoretical challenge for Bayesian confirmation theory, or does it conflate two formally distinct scenarios requiring different solutions?*

  Specifically, I intend to investigate whether the standard Bayesian difficulties arising from 'old evidence' stem from (a) the agent's prior empirical certainty regarding the evidence $E$, or (b) the agent's prior logical ignorance regarding the entailment relation between hypothesis $H$ and evidence $E$. I will test the hypothesis that proposed solutions in the literature are not interchangeable: counterfactual prior approaches may resolve empirical certainty cases but fail in logical ignorance cases, whilst conditionalisation on entailment relations may resolve logical ignorance cases but remain inert in empirical certainty cases.

  **2. Background and Context**

  **2.1 The Standard Problem**
  In orthodox Bayesian confirmation theory, evidence $E$ confirms hypothesis $H$ for an agent if and only if the agent's posterior credence in $H$ given $E$ is higher than their prior credence in $H$ ($P(H|E) > P(H)$). By the ratio formula, if an agent is already certain of $E$ (i.e., $P(E) = 1$), then $P(H|E) = P(H)$. Consequently, $E$ cannot confirm $H$.

  This creates the 'Problem of Old Evidence': historically, theories like General Relativity (GR) were strongly confirmed by their ability to explain existing data (e.g., the perihelion of Mercury), even though scientists were already certain of that data before formulating the theory. Orthodox Bayesianism appears unable to model this confirmation.

  **2.2 Settled vs. Contested Claims**
  It is broadly settled in the literature that orthodox Bayesianism, assuming logical omniscience and rigid conditionalisation, cannot accommodate confirmation by evidence where $P(E)=1$. However, the following remain genuinely contested:
  *   **The Source of the Error:** There is no consensus on whether the fault lies in the requirement that $P(E)=1$ for old evidence, the assumption of logical omniscience, or the rigid conditionalisation rule itself.
  *   **Logical Omniscience:** It is contested whether relaxing the assumption of logical omniscience (allowing agents to be uncertain about logical relations) is a coherent move within standard probability theory, or whether it requires a fundamental revision of the Bayesian framework.
  *   **Counterfactual Priors:** It is contested whether 'ur-priors' or counterfactual credences (what the agent *would* have believed had they not known $E$) are well-defined or psychologically/epistemologically accessible.

  **2.3 Existing Positions**
  Broadly, solutions fall into two families. The first suggests we should evaluate confirmation using counterfactual priors where the agent does not yet know $E$ (e.g., Eells 1985). The second suggests the agent actually learns something new: not $E$ itself, but the proposition that $H$ entails $E$ (e.g., Garber 1983). Currently, these are often discussed as competing solutions to a single problem. My project proceeds on the hunch that they are actually solutions to two different problems that are frequently run together.

  **3. The Hypothesis: A Two-Case Distinction**

  I propose that the 'Old Evidence' scenario conflates two distinct epistemic situations:

  *   **Case 1: Empirical Uncertainty Resolution.** The agent was never fully certain of $E$. Over time, measurement precision improved or replication occurred, raising $P(E)$ to near 1. When $H$ is introduced, it predicts $E$.
      *   *Formal Characteristic:* $P_{initial}(E) < 1$. The update event is learning $E$.
  *   **Case 2: Logical Uncertainty Resolution.** The agent was fully certain of $E$ all along ($P(E) = 1$). However, they did not know that $H$ entailed $E$. The update event is learning the logical relation $H \vdash E$.
      *   *Formal Characteristic:* $P_{initial}(E) = 1$, but $P_{initial}(H \to E) < 1$. The update event is learning $(H \to E)$.

  **Epistemic Flag:** I must note here that this distinction is not entirely novel; Garber (1983) explicitly frames his solution around learning entailments. However, the literature often treats these as alternative fixes for the *same* intuition pump (Mercury's perihelion). My project tests whether these fixes are *portable*. If I am correct, applying a counterfactual solution to Case 2 should be category error, and applying a logical-entailment solution to Case 1 should be unnecessary or ineffective.

  **4. Methodology and Formalisation**

  The paper will not produce a new theorem but will provide a rigorous comparative analysis using toy models. The method involves constructing a simplified probabilistic agent and testing how different confirmation measures behave under the two cases.

  **4.1 Formal Setup**
  I will define a toy agent with a limited language.
  *   **Propositions:** $H$ (Hypothesis), $E$ (Evidence).
  *   **Logical Structure:** In Case 2, I will introduce a sentence $L$ representing "$H$ entails $E$".
  *   **Credence Function:** $P(\cdot)$ satisfying probability axioms but *not* requiring logical omniscience (i.e., $P(H)$ and $P(E)$ are not automatically constrained by $H \vdash E$ unless $L$ is learned).

  **4.2 Testing Procedure**
  I will simulate the two cases sequentially:

  1.  **Model Case 1 (Empirical):** Set $P(E) = 0.9$. Introduce $H$ such that $P(H|E) > P(H)$.
      *   *Test:* Does the Counterfactual Solution (reconstructing priors where $P(E) < 1$) add anything here? Or does standard conditionalisation suffice?
      *   *Prediction:* Standard conditionalisation works; counterfactual machinery is redundant.
  2.  **Model Case 2 (Logical):** Set $P(E) = 1$. Set $P(L) = 0.5$.
      *   *Test:* Can the Counterfactual Solution work here? (i.e., Can we coherently imagine a prior where $P(E) < 1$ if $E$ is an established astronomical fact?)
      *   *Test:* Does conditionalising on $L$ raise $P(H)$?
      *   *Prediction:* Counterfactuals fail (cannot subtract known facts); conditionalising on $L$ succeeds.
  3.  **Cross-Application:** I will attempt to apply the 'Entailment' solution to Case 1 and the 'Counterfactual' solution to Case 2 to demonstrate where the formal machinery breaks down or becomes unintuitive.

  **4.3 Scope and Feasibility**
  A full defence of non-omniscient probability theory is a dissertation-sized project. For this 6000-word term paper, I will treat the non-omniscient framework as a given tool (following Garber's approach) rather than defending its metaphysical coherence from scratch. The focus remains on the *distinction* between the cases, not on solving the logical omniscience problem itself.

  **5. Timeline (One Semester)**

  *   **Month 1: Literature and Formal Basics.**
      *   Refine understanding of Garber's solution vs. Counterfactual approaches (e.g., Eells, Howson).
      *   Draft the formal definitions for the toy agent. Ensure I can represent 'learning an entailment' without collapsing into standard logic.
  *   **Month 2: Modelling Case 1 (Empirical).**
      *   Write the section analysing scenarios where $P(E) < 1$.
      *   Demonstrate that standard Bayesianism handles this fine, suggesting the 'problem' is often a misdescription of the history.
  *   **Month 3: Modelling Case 2 (Logical).**
      *   Write the section analysing scenarios where $P(E) = 1$ but $P(H \to E) < 1$.
      *   Show why counterfactuals struggle here (the 'subtracting evidence' problem).
  *   **Month 4: Synthesis and Writing.**
      *   Compare the results.
      *   Draft the introduction and conclusion.
      *   Review for British English spelling and academic tone.
      *   Final polish and reference check.

  **6. Expected Outcomes and Success Criteria**

  A **positive result** would look like a clear mapping showing that:
  1.  Cases where the agent's credence in $E$ changes are solvable via standard conditionalisation (rendering the 'Old Evidence' label a misnomer).
  2.  Cases where the agent's credence in $E$ is fixed but the logical link is learned require the 'Entailment' solution.
  3.  Attempting to swap these solutions leads to formal incoherence or philosophical implausibility.

  This would support the conclusion that the 'Problem of Old Evidence' is a disjunction of two problems, and confusion arises when philosophers apply a solution for one to the other.

  **7. Risks and Failure Conditions**

  I must be honest about where this project could fail. Given the semester constraints, the following outcomes would constitute significant setbacks:

  *   **Formal Indistinguishability:** It is possible that upon rigorous formalisation, Case 1 and Case 2 turn out to be isomorphic. For instance, if learning $H \vdash E$ can be mathematically rewritten as a counterfactual update on $E$, the distinction collapses. If this happens, the paper will pivot to arguing that the distinction is merely pedagogical, not formal.
  *   **Solution Collapse:** The 'Entailment' solution (conditionalising on $H \to E$) might turn out to be mathematically equivalent to the Counterfactual solution under specific constraints. If the two 'families' of solutions are just notational variants, my core hypothesis is weakened.
  *   **The 'Straw Man' Risk:** As noted in the epistemic flags, sophisticated Bayesians (like Garber) already distinguish logical from empirical learning. If the literature already uniformly accepts this split, my claim that 'everyone treats it as a single problem' would be incorrect. In this event, I will adjust the thesis to argue that *despite* the formal distinction, the solutions are still incorrectly treated as interchangeable in broader methodological discussions.
  *   **Scope Creep:** Defending the coherence of non-omniscient probabilities is too large. If I find I must spend 3000 words justifying the logic system, I will not have space for the comparative analysis. I will mitigate this by stipulating the logical framework as a premise rather than a conclusion.

  **8. Conclusion**

  This project aims to bring conceptual clarity to a persistent issue in confirmation theory. By separating empirical certainty from logical omniscience, I hope to show that the 'Problem of Old Evidence' is not a monolithic blockage for Bayesianism, but a conflation of two distinct modelling challenges. This distinction allows for a more precise evaluation of existing solutions, preventing the application of 'logical' fixes to 'empirical' problems and vice versa. The project is scoped to be achievable within a single semester, relying on toy models rather than general proofs, and remains sensitive to the possibility that the proposed distinction may not hold up under formal scrutiny.

  ***

  **Notes on Epistemics and Scope (for the Student)**

  *   **On the 'Two-Case' Split:** You asked me to flag if this split is confused. In the proposal above, I have hedged slightly. The distinction between "learning $E$" and "learning $H \vdash E$" is the core of Daniel Garber's 1983 paper *Old Evidence and Logical Omniscience*. It is not a new discovery. However, your intuition that *solutions* are often swapped indiscriminately is a viable critical angle. I have framed the proposal to acknowledge Garber while maintaining your critical focus on the *portability* of solutions. Do not claim you discovered the distinction; claim you are rigorously testing the consequences of it.
  *   **On Scope:** 6000 words is approximately 20 double-spaced pages. This is tight for formal epistemology. I have explicitly limited the methodology to "toy models" and "comparative analysis" rather than "new proofs". If you attempt to prove a new theorem about non-omniscient agents, you will run out of space. Stick to analysing existing formalisms.
  *   **On British English:** I have used British spelling throughout (formalise, behaviour, programme/plan, centre). Ensure you maintain this in the final draft.
  *   **On Failure:** The "Failure Conditions" section is crucial for a graduate proposal. It shows you understand the risks. I have included the possibility that the cases are isomorphic, which is a genuine mathematical risk.

  This proposal should be sufficient to satisfy a supervisor that you have a clear plan, understand the literature's contested points, and have a realistic timeline.
