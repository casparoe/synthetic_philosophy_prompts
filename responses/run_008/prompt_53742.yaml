      *   *Big Bang (BB):* Friedmann/Lemaître -> Gamow. Hot dense early phase.
      *   *Prediction:* 1948 Alpher/Herman predict relic radiation (few Kelvin). Ignored until 1965.
      *   *Label:* "Big Bang" coined by Hoyle (BBC radio), claimed not derisive.
      *   *Anomaly 1 (Age):* Hubble's rate -> Universe younger than Earth. SS shrugged; BB waited for revision.
      *   *Anomaly 2 (Radio Sources):* 1950s Ryle's counts. Source population evolves. SS forbids evolution. Strong case by 1961.
      *   *Anomaly 3 (CMB):* 1964-65 Penzias/Wilson. SS response: thermalized starlight/dust. Failed (too isotropic, exact black body).
      *   *Post-1965:* Hoyle et al. didn't convert. Quasi-Steady State (1993, Burbidge/Narlikar).
      *   *BB Post-Victory:* Dark Matter (70s), Inflation (80s, horizon/flatness), Dark Energy (98).
      *   *Weinberg's Point:* SS was definite enough to be refuted.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Lakatos MSRP is often used to justify the BB victory, but the history is messier. State the essay's dual aim: apply Lakatos to the case, and use the case to stress-test Lakatos.

      *   **Section 1: Lakatosian Reconstruction:**
          *   *Steady State:*
              *   Hard Core: Perfect Cosmological Principle (unchanging universe in time/space), Continuous Creation.
              *   Positive Heuristic: Model the universe without a beginning; explain local changes without global evolution.
              *   Protective Belt: Dust thermalization (for CMB), modifications to creation rates (later QSSC).
              *   Problem Shifts: Age paradox (neutral/progressive for SS), Radio counts (degenerating - ad hoc adjustments to source evolution?), CMB (degenerating - dust hypothesis).
          *   *Big Bang:*
              *   Hard Core: General Relativity + Expanding Universe from a dense state.
              *   Positive Heuristic: Calculate nucleosynthesis, radiation background, structure formation.
              *   Protective Belt: Adjusting Hubble constant (for age), Dark Matter/Inflation (later).
              *   Problem Shifts: Age paradox (degenerating initially, then progressive with revision), CMB (highly progressive *if* counted as prediction).
          *   *Comparison:* SS seemed progressive early (solved age problem), then degenerated (radio, CMB). BB degenerated early (age), then progressed massively (CMB).

      *   **Section 2: The Verdict and Complications:**
          *   *(a) Individuation:* Is SS one programme or many? Bondi/Gold (logical) vs. Hoyle (C-field) vs. QSSC (1993). If separate, the 1965 verdict kills the 1948 version, but Hoyle's specific field theory might be distinct. If one, it's a long degenerating tail. Same for BB: Lemaître's primeval atom vs. Gamow's hot BB vs. Lambda-CDM. If spliced, the "victory" is a succession of programmes, not one enduring winner.
          *   *(b) Novelty:* Alpher/Herman (1948) predicted CMB. Nobody listened. Penzias/Wilson (1965) found it accidentally. Is this "novel"?
              *   *Temporal:* Yes, predicted before found.
              *   *Use:* No, not used to guide the search.
              *   *Impact:* If novelty requires *use* (heuristic power), BB's victory is less decisive in 1965. It becomes a post-hoc fit.
          *   *(c) Helium:* Hoyle did stellar nucleosynthesis. So He abundance isn't unique to BB. It only favors BB if stellar production is insufficient. This weakens the "decisive evidence" narrative.
          *   *Verdict:* Under strict "use" novelty and fine individuation, the textbook "QED" fails. The victory is more sociological or based on the *potential* of the BB heuristic vs. the *exhaustion* of the SS heuristic.

      *   **Section 3: Turning the Table (Case vs. Lakatos):**
          *   *Hindsight/Rational Reconstruction:* Lakatos admits history is rational reconstruction. But does this erase the actual human reasoning? Scientists didn't carry "degenerating/progressive" scorecards.
          *   *Holdouts:* Hoyle's refusal to convert after 1965. Lakatos says holdouts are rational if they think the degeneration is temporary. Hoyle kept working (QSSC). Was he irrational? Lakatos says no programme is falsified by a single anomaly. But the *trend* mattered.
          *   *The Winner's Burden:* BB absorbed Dark Matter, Inflation, Dark Energy. Inflation solves horizon/flatness (anomalies) with unobservables. Is this progressive or degenerating protective belt? If Inflation is ad hoc, the 1965 verdict is unstable. The BB programme looks like it became what it defeated (adding unobservables to save the core).

      *   **Section 4: Candid Reflection:**
          *   *Weak Points:* Individuation is the biggest lever. If BB is "Modern Cosmology" and SS is "1948 SS", BB wins. If BB is "1948 Gamow" and SS is "1993 QSSC", it's a draw or SS wins on longevity.
          *   *Novelty:* If we demand heuristic use, 1965 isn't the end.
          *   *Winner's History:* The prompt's factual basis is the standard story. If SS proponents had a different account of the radio counts or dust, the Lakatosian balance shifts.
          *   *Conclusion:* The case shows MSRP is better at describing the *structure* of justification than the *psychology* of discovery. It validates the BB victory only if we accept a generous view of "progressive problem shifts" regarding inflation/dark energy.

  4.  **Refining and Polishing (Self-Correction during drafting):**
