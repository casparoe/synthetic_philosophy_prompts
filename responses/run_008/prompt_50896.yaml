answer: |-
  You are right to suspect that the empirical data is not the bottleneck. The cerebellum, anesthesia, and split-brain cases are Rorschach tests; both sides project their theoretical commitments onto them. The cerebellum has high neuron count but low recurrence (favoring IIT's integration criterion), while a feedforward network has high functional mimicry but zero Phi (favoring the functionalist intuition that behavior implies mind).

  The stalemate is not a lack of data, nor is it merely verbal. It is a **clash of explanatory teleology**. You hit the nail on the head: the fight is about what a theory of consciousness is *for*.

  Here is the diagnosis of the impasse, followed by an honest assessment of what progress actually looks like.

  ### 1. The Diagnosis: Three Layers of Incommensurability

  The reason nobody has budged is that IIT and its critics are playing different games with different win conditions.

  **A. The Direction of Inference (Phenomenology vs. Physics)**
  This is the deepest methodological rift.
  *   **IIT** starts from the *Axioms* (claims about the nature of experience itself: it exists, it is structured, it is one thing). It treats the existence of experience as the primary datum, more certain than the existence of the external world. It then derives *Postulates* about the physical substrate required to support those axioms. For IIT, physics must serve phenomenology.
  *   **Functionalists** start from the *Physics/Computation*. They treat the physical world as the primary datum and view consciousness as a functional role played within that world. For them, phenomenology must be reduced to (or eliminated in favor of) physical/functional description.

  When IIT says "a grid of gates has consciousness," they are being logically consistent with their axioms (intrinsic causal power exists). When functionalists call this "absurd," they are appealing to an external intuition about what *deserves* consciousness. IIT rejects that intuition as pre-theoretic bias. Functionalists reject IIT's axioms as mysticism. They cannot agree on which side of the equation gets to be the independent variable.

  **B. The Ontological Commitment (Intrinsic vs. Extrinsic)**
  *   **IIT** claims consciousness is an *intrinsic* property of a system's causal structure. It exists for the system itself, regardless of whether anyone observes it. This forces IIT toward panpsychism (or at least panprotopsychism). If causal power exists, experience exists.
  *   **Functionalists** generally view consciousness as *extrinsic* or relational. It matters what the system *does* for the environment or the organism. A feedforward network that behaves exactly like a human *is* conscious because it fulfills the functional role. A recurrent grid that does nothing *is not* conscious because it fulfills no biological or computational role.

  This is why the "grid" objection is fatal for functionalists but a feature for IIT. For the functionalist, a theory that attributes consciousness to idle hardware is broken. For the IIT proponent, a theory that denies consciousness to a system with high intrinsic causal power is denying the reality of experience.

  **C. The Target Phenomenon (Phenomenal vs. Access)**
  This is where the empirical data gets muddy.
  *   **IIT** is explicitly a theory of *Phenomenal Consciousness* (what it is like to be). It claims to measure the *capacity* for experience, not the report of experience.
  *   **Critics** often evaluate IIT based on *Access Consciousness* (reportability, global broadcasting, cognitive control).

  When critics say, "A feedforward network acts conscious, so it must be," they are conflating access with phenomenality. IIT predicts that a feedforward network can simulate access (reporting "I see red") without having the phenomenal experience of red (Phi = 0). Conversely, IIT predicts you can have high Phi (experience) with low access (e.g., posterior cortex activity during dreaming or anesthesia).
  The debate stalls because critics demand IIT predict *behavior*, while IIT claims to predict *experience* independent of behavior.

  ### 2. What Counts as Progress?

  You asked for an honest answer. Here is the hierarchy of likely outcomes, from most to least productive.

  **A. The "Clean Split" (Most Likely & Most Useful)**
  The field needs to formally bifurcate into **Theory of Phenomenal Consciousness** vs. **Theory of Cognitive Access/Report**.
  *   If we admit IIT is a theory of *phenomenal structure* (ontology) and Global Neuronal Workspace (GNW) is a theory of *access* (function), the "wars" dissolve.
  *   **Progress condition:** A consensus that "Consciousness" is an ambiguous term. We stop asking "Is this system conscious?" and start asking "Does this system have high Phi?" and "Does this system exhibit global broadcasting?" separately.
  *   **Why this helps:** It allows the cerebellum data to make sense. The cerebellum has high neuron count but low Phi (no phenomenal contribution) and low Access (no report). The prefrontal cortex has high Access. The posterior hot zone has high Phi. They are different variables.

  **B. Adversarial Collaboration (The Empirical Route)**
  There are ongoing experiments (e.g., the TONICUS project) designed to pit IIT against GNW. They use TMS and EEG to perturb the brain during anesthesia or sleep.
  *   **The Setup:** IIT predicts consciousness fades when integration (Phi) drops, even if activity remains. GNW predicts consciousness fades when fronto-parietal broadcasting stops.
  *   **The Problem:** Interpretation. If IIT predicts X and GNW predicts Y, and X happens, GNW proponents can argue that X was just a correlate of *phenomenal* consciousness, while *access* (the only kind that matters scientifically) was Y.
  *   **Progress condition:** An experiment where the *interpretation* of the result is pre-registered and binding. This is sociologically difficult. Scientists rarely agree to be falsified by a rival's metric.

  **C. The Computational Theorem (The Mathematical Route)**
  You mentioned a theorem showing what Phi can/can't be.
  *   Calculating exact Phi is NP-hard. IIT 4.0 has tried to make it more tractable.
  *   **Progress condition:** A proof that Phi correlates perfectly with a specific physical property (like thermodynamic cost or quantum coherence) that functionalists *must* accept as physical.
  *   **Likelihood:** Low. Phi is defined causally, not thermodynamically. You can have high Phi with low energy and vice versa.

  **D. Nothing (The Metaphysical Route)**
  It is possible this is not a scientific dispute but a metaphysical one disguised as science.
  *   If consciousness is fundamentally private (the Hard Problem), no third-person measure (Phi, fMRI, behavior) can ever *logically* entail its presence.
  *   IIT tries to bridge this by postulating a law-like connection between cause-power and experience. Functionalists deny the bridge is necessary.
  *   **Progress condition:** None. We will continue to have "theories of consciousness" that are actually "theories of what we value as consciousness."

  ### The Verdict

  Your tentative view is correct. The fight is about **normative attribution**, not just descriptive mechanics.

  *   **IIT** asks: "What physical structure *necessitates* experience?" (A bottom-up ontological question).
  *   **Functionalists** ask: "What systems *behave* as if they deserve moral consideration/report?" (A top-down pragmatic question).

  **Real progress** will not come from a "knockout experiment" because the sides disagree on what the experiment measures. Progress will come from the **conceptual split**.

  We need to stop treating "Consciousness" as a single natural kind. If the field accepts that **Phi measures the complexity of intrinsic causal power** (which may or may not be 'experience' in the human sense) and **Global Workspace measures the capacity for report and control**, the war ends.

  Until then, the "IIT Wars" are a proxy battle for the Hard Problem. IIT bets that the Hard Problem is solvable via structural identity (experience *is* integrated information). Functionalists bet the Hard Problem is a illusion or a functional role. No amount of cerebellum data will solve that, because one side sees the cerebellum as a processor and the other sees it as a substrate.

  **Recommendation:** Stop looking for the experiment that kills IIT. Look for the framework that allows IIT's math to be used for *structure* while functionalism's criteria are used for *behavior*. That is the only path that doesn't end in another decade of stalemate.
