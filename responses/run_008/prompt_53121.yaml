  Here is a flowchart designed for your video call. You can draw this on a whiteboard app as you go, or just read the questions out loud and track where people land.

  The goal is to keep the jargon in the trunk and the fruit on the leaves.

  ### The "Where Will You Die?" Flowchart

  **START: The Base Case**
  *Scenario:* You meet Death in Damascus. He checks his ledger and says, "I'm coming for you tomorrow." You know his ledger is **100% accurate**. You can stay in Damascus or flee to Aleppo for **free**.
  *(Note: Death isn't chasing you; he's just going to be where the ledger says you'll be.)*

  **Q1: The Gut Check**
  Knowing the ledger is perfect, do you pack your bags to flee to Aleppo?
  *   **YES (I'm trying to outsmart him):** Go to **Node 2**.
  *   **NO (It doesn't matter / I'm doomed):** Go to **Node 3**.
  *   **MAYBE / I FEEL SICK:** Go to **Node 4**.

  ---

  **NODE 2: The Optimist (You said YES to fleeing)**
  *Perturbation:* We change the ledger. It is now **90% accurate** (10% error rate). Fleeing is still free.
  **Q2:** Does this error rate make you feel *more* confident about fleeing, or was your plan to flee already based on this hope?
  *   **"I only flee because of the 10% error. At 100%, I stayed."** → **LEAF A: The Causal Neighborhood.**
      *   *Why:* You treat Death's location as causally fixed by the past. You can't change the past, but if the past isn't perfect, you can gamble on the error. You stay when victory is impossible, but run when there's a loophole.
  *   **"I would have fled even at 100%."** → **LEAF B: UNNAMED (The Irrational Gambler).**
      *   *Why:* If the ledger is infallible, fleeing is logically impossible to succeed. Believing you can outsmart a logical certainty isn't a decision theory; it's a denial of the premises. Nobody lives here long.

  ---

  **NODE 3: The Resigned (You said NO to fleeing)**
  *Perturbation:* Fleeing to Aleppo now costs **all your money**.
  **Q3:** In the Base Case (100% accurate), you stayed. If fleeing cost money, would you still stay?
  *   **"Obviously. Why pay to die?"** → Go to **Node 5**.
  *   **"Actually, I'd flee anyway. Gotta try something."** → **LEAF C: UNNAMED (The Desperate Thrasher).**
      *   *Why:* This is dominated. You believe you will die either way (that's why you stayed in the base case), but you'll pay a huge cost to die in the other spot. That's just burning utility for no expected gain.

  ---

  **NODE 4: The Queasy (You felt sick/uncertain)**
  *Perturbation:* Focus on your psychology. You have **half-decided** to stay in Damascus.
  **Q4:** Does the fact that you've *tentatively decided* to stay make you feel safer (because that's where you belong), or does it make you panic (because now Death is definitely coming here)?
  *   **"Panic! If I decide to stay, I'm signing my warrant."** → **LEAF D: Ratifiability / Instability.**
      *   *Why:* This is the Gibbard & Harper insight. You can't endorse your own decision. Deciding to stay makes staying fatal; deciding to go makes going fatal. You're stuck in a loop of second-guessing.
  *   **"Safer / No change. It was already decided."** → Go to **Node 5**.

  ---

  **NODE 5: The Hard Determinists (Stayed in Base, Stayed with Cost, No Panic)**
  *Perturbation:* Change the *source* of Death's knowledge. Death's location tomorrow was decided by a **coin flip yesterday**. He has no power over you; he just *knows* what you'll do via magic crystal ball.
  **Q5:** Since his location is now a fixed fact independent of your psychology, do you flee to Aleppo?
  *   **"YES! Now it's just a 50/50 gamble."** → **LEAF E: The Evidential / Updateless Cluster.**
      *   *Why:* You were only staying before because your choice was *evidence* of his location (or logically linked to it). Once that link is cut, you act to save your skin.
  *   **"NO. Fate is fate."** → **LEAF F: Plain Old Fatalism.**
      *   *Why:* You don't care about evidence or logic links. You believe the outcome is fixed regardless of the mechanism. If it's written, it's written.

  ---

  ### The "Indistinguishable Leaves" Flag

  You asked me to explicitly flag pairs my tree can't separate. Here is the awkward truth about the **Base Case** of Death in Damascus:

  **Leaf E (Evidential/Updateless)** and **Leaf F (Fatalism)** often look identical here.
  *   **The Overlap:** In the 100% accurate base case, both the Evidential reasoner and the Fatalist say: "Don't bother packing."
      *   The **Fatalist** says: "Moving changes nothing."
      *   The **Evidential/Updateless** agent says: "Moving provides no evidence of survival (conditional on going, I die; conditional on staying, I die)."
  *   **Can we pull them apart?** Only with **Node 5** (The Coin Flip Variant).
      *   If the prediction is *independent* of you (coin flip), the Fatalist still stays ("It's fate"), but the Evidential/Updateless agent flees ("The correlation is broken, I have a 50% chance").
      *   *Warning:* Some sophisticated Updateless (FDT) agents might *also* stay in Node 5 if they treat the "magic crystal ball" as a logical dependency. If you have an FDT purist in the group, Leaf E and Leaf F might merge again.
      *   **Verdict:** In the standard garden corner of Death in Damascus, EDT and FDT are wearing the same hat. You need a Newcomb-style variant to pry them apart.

  ### Summary of Leaves for Your Whiteboard

  1.  **Causal (CDT-ish):** Stays at 100%, Flees at 90%. (Believes in causal independence + error margins).
  2.  **Ratifiability:** Panics at the "Half-Decided" node. (Believes the decision is unstable).
  3.  **Fatalist:** Stays at 100%, Stays at Coin-Flip. (Believes outcome is fixed regardless of mechanism).
  4.  **Evidential/Updateless:** Stays at 100%, Flees at Coin-Flip. (Believes in correlation/logical links, but acts when links break).
  5.  **Unnamed (Gambler):** Flees at 100%. (Incoherent with the premises).
  6.  **Unnamed (Thrasher):** Stays at 100%, Flees when Costly. (Dominated strategy).

  ### Facilitator Tips (To Keep the Sleeper Awake)

  *   **On Node 4 (Ratifiability):** If someone says "I feel panic," ask them: "So if you decide to go to Aleppo, do you immediately wish you'd decided to stay?" If they say yes, they've just reinvented the ratifiability criterion without the math.
  *   **On Node 5 (Coin Flip):** This is the most important question for sorting the "Stay" crowd. If they say "Now I run," they aren't fatalists; they're decision theorists who hate bad correlations.
  *   **On the "Unnamed" Leaves:** Don't let people off the hook if they land here. Ask: "Are you willing to pay $1,000 to die in a city you know Death is in?" If they say yes, ask them to justify it to the group. Usually, they'll laugh and realize they slipped up.

  Have fun! And maybe tell the sleeper to stand up for the "Coin Flip" question.
