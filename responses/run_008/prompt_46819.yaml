prompt: |-
  I've been keeping a running list of cases where someone's *not* doing something seems to me to have caused some bad outcome, and I'd like to know whether my verdicts add up to a principle, or whether some of them have to go. My tentative principle is stated at the end, along with the places I can already see it wobbling.

  My verdicts, as honestly as I can report them:

  1. The gardener who agreed to water my plants while I was away, didn't, and the plants died: he caused their death. A stranger on another continent, equally able to water them had he known and cared: he didn't cause anything.
  2. A patient dies after her doctor fails to administer a drug that would have saved her with roughly 90% probability: the doctor caused the death. Same scenario, but the drug had only a 5% chance of saving her: here I want to say the disease caused the death and the doctor merely failed to prevent it — though I'd still call him negligent in the 5% case. I can feel these two pulling in different directions.
  3. A hundred neighbors, none of whom agreed to anything, each could have watered the plants; all failed to; the plants died. I want to say the gardener caused it and none of the neighbors did, even though for each individual neighbor, had that neighbor watered, the plants would have lived. "There are too many non-waters" feels like it should matter, though I can't say why it would be a difference in causation rather than just in blame.
  4. Fifty able-bodied onlookers watch a child drown in a pond; each could have waded in at no real risk; none did. Every one of them is a coward and culpable, but I go back and forth on whether any of them *caused* the drowning. This is the case I least trust myself on.
  5. A drunk driver fails to brake and kills a pedestrian: caused the death. His sober passenger, who equally failed to do anything (grab the wheel, shout a warning): didn't cause it. Both just sat there, and I can't yet say what the difference is beyond the driver's earlier act.
  6. A person who never donates to famine relief, when a donation would have saved a specific child: didn't cause the death. A charity accountant who embezzles the funds earmarked for that child's food, and the child dies: caused it. I suspect the difference can't just be that money moved in the second case — but I'd like to be told whether it can.

  The principle I'm drawn to: an omission causes a bad outcome when (a) the corresponding act would have prevented the outcome, and (b) the agent had an obligation, or at least was the designated or uniquely positioned person, to perform it. This cleanly handles the gardener versus the distant stranger, the driver versus the passenger, and the embezzler versus the non-donor. But it treats the two doctors identically (duty in both, prevention in both if 'would have prevented' is read as raising the probability of survival), which conflicts with my 90/5 split; and it has nothing useful to say about the pond, where nobody was designated.

  What I'm asking for, then:

  - A principle, or a small set of rivals, stated precisely enough to be run on new cases — in particular, state whether clause (a) should be read as deterministic prevention, a probability threshold, or something else, and defend the reading using the doctor cases.
  - Its verdicts on cases I haven't listed, for instance: a software engineer who forgot to enable a safety flag that would have prevented a fatal crash with probability about one in three; a city council that didn't repair a guardrail it knew was rotten, where the driver was also speeding; and one of three off-duty medics in a crowd, any one of whom could have reached a collapsed runner in time, all of whom hesitated and none of whom moved.
  - An honest accounting of which of my six verdicts your preferred principle cannot accommodate, and whether the loss is acceptable — specifically, whether my 5%-drug verdict should be abandoned as a confusion between causing a death and imposing an unjustifiable risk, and whether the pond case reveals that my gardener-versus-neighbors verdict is really about desert wearing the mask of causation.
  - If you think the designated-person clause is doing illicit work — importing moral standing into causal facts — say so, and say what remains of causation by omission without it. I'd also like to know whether the "too many non-waters" point in case 3 can be made precise, or whether it is just an intuition about diffusion of responsibility that no causal principle should respect.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user has a list of 6 intuitions/verdicts about causation by omission and a tentative principle. They want to know if these verdicts cohere into a valid principle or if some need to be discarded.
      *   **Input:** 6 specific cases (Gardener, Doctor 90%/5%, Neighbors, Drowning Child, Drunk Driver, Famine/Embezzler).
      *   **Tentative Principle:** Omission causes outcome if (a) act would have prevented outcome, and (b) agent had obligation/designation/unique position.
      *   **Specific Problems Identified by User:**
          *   Doctor cases (90% vs. 5%): Principle treats them same, intuition differs.
          *   Pond case: No designated person, but high culpability. Principle struggles.
          *   Gardener vs. Neighbors: Why does the gardener cause it but neighbors don't, if counterfactual dependence holds for all?
      *   **Tasks:**
          1.  Propose a precise principle (or rivals), specifically addressing the probability threshold in clause (a).
          2.  Apply the principle to new cases (Software Engineer, City Council/Guardrail, Off-duty Medics).
          3.  Critique the user's verdicts (specifically the 5% doctor case and the pond/neighbors case).
          4.  Address the "illicit work" of the obligation clause (moral vs. causal) and the "too many non-waters" issue.

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Causation by Omission:** This is a notorious problem in metaphysics and law. The core tension is between *counterfactual dependence* (if X hadn't happened, Y wouldn't have) and *causal mechanism* (did X actively produce Y?). Omissions lack physical force.
      *   **The "Normative" Turn:** Many philosophers (e.g., Hart & Honoré, McGrath, Schaffer) argue that causation by omission *requires* a normative element (duty, expectation, normality). Purely physical causation doesn't include absences.
      *   **Probabilistic Causation:** The doctor case highlights that causation isn't always binary. It involves probability raising.
      *   **Overdetermination/Preemption:** The neighbors/pond cases touch on symmetric overdetermination. If anyone could have saved the child, did *my* failure cause the death?

  3.  **Drafting the Principle:**
      *   The user's tentative principle is close to the "Normative Expectation" view.
      *   *Refinement:* We need to separate the *causal* condition from the *responsibility* condition, or admit they are intertwined for omissions.
      *   *Probability:* The 90% vs. 5% doctor case suggests a threshold. In law, "but-for" causation often requires "more likely than not" (>50%). In medicine, loss of chance doctrines vary.
      *   *Proposed Principle:* **The Normative-Probabilistic Dependence Principle.**
          *   (C1) Counterfactual Dependence: Had the agent acted, the probability of the outcome would have been significantly lower (threshold > 50% for strict causation, >0% for risk imposition).
          *   (C2) Normative Expectation: The agent was under a specific duty or was the "normal" preventer in that context.
      *   *Addressing the Doctor Case:* The 5% case isn't *causation of death*, it's *causation of risk*. This distinguishes the verdicts without abandoning the principle.

  4.  **Addressing the Specific Questions:**

      *   **Task 1: Precise Principle & Probability.**
          *   Need to defend the >50% threshold for "causing death" vs. "causing risk."
          *   Defense: If the drug only works 5% of the time, the disease is the overwhelming cause. The doctor's omission didn't tip the scales.
      *   **Task 2: New Cases.**
          *   *Software Engineer:* 33% chance. Below 50%. Verdict: Caused risk, not the crash (strictly). But likely negligent.
          *   *City Council/Guardrail:* Duty exists. Speeding is an intervening cause. If guardrail would have held *despite* speeding, Council caused death. If speeding made it inevitable anyway, Council didn't. Let's assume guardrail would have helped. Duty is clear.
          *   *Off-duty Medics:* Three medics. Any one could save. This is symmetric overdetermination of omission. If *all* failed, did *each* cause it? Counterfactually: If Medic A acted, child lives. So A's omission is a but-for cause. But so is B's and C's. This challenges the "unique position" clause.
      *   **Task 3: Honest Accounting of User's Verdicts.**
          *   *5% Doctor:* This is the weakest link. It confuses *causation* with *substantial factor*. Abandon the idea that the doctor *caused* the death in the 5% case. Call it "failure to mitigate risk."
          *   *Pond/Neighbors:* This is the hardest. If we say *no one* caused it, that's weird. If we say *everyone* caused it, it's overdetermination. The "Gardener vs. Neighbors" distinction relies on *expectation*. The gardener was *expected*. The neighbors were not. The Pond case is tricky because social expectation says *someone* should act, but not *specifically you*.
          *   *Diffusion of Responsibility:* The "too many non-waters" is likely moral psychology, not metaphysics. But in causation, if 100 people could have watered, and only 1 bucket was needed, is it overdetermination? Yes.
      *   **Task 4: Illicit Work & Normativity.**
          *   Is importing duty into causation illicit? Many argue yes (metaphysics should be descriptive). Others argue omissions *are* inherently normative (you can't have an absence without a background expectation of presence).
          *   *Verdict:* It's not illicit for *omissions*. Physical causation is force; omission causation is violation of expectation.
          *   *Too Many Non-Waters:* This is the "Problem of Many Hands." It's about dilution of individual impact.

  5.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Critique of the User's Principle:* The user's principle mixes causation and blame. I need to tease that apart.
      *   *The "Normality" Account:* Instead of strict "obligation," use "Normal Course of Events." The gardener is part of the normal course; the stranger is not. The doctor is normal; the 5% success rate makes the omission statistically irrelevant to the *outcome* (though relevant to risk).
      *   *The Pond:* If *no one* is designated, does *anyone* cause it? Intuition says the *situation* caused it, or the *collective* caused it. Individual causation is weak.
      *   *Software Engineer:* 1/3 is tricky. In tort law, "loss of chance" might apply. But for strict "caused the crash," it's shaky.
      *   *Medics:* If there are 3 medics, the "uniquely positioned" clause fails. But they are *class* uniquely positioned.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the problem (metaphysics + ethics).
      *   **Section 1: The Refined Principle.** Propose the "Normative Expectation + Substantial Factor" model. Address the probability threshold (50% rule).
      *   **Section 2: Applying to New Cases.** Run the Software, Council, and Medics cases through the mill.
      *   **Section 3: Critique of User's Verdicts.** Tackle the 5% Doctor (abandon causation, keep negligence) and the Pond/Neighbors (distinguish individual vs. collective causation).
      *   **Section 4: The Normativity Question.** Address whether duty belongs in causation. Argue that for omissions, it does.
      *   **Conclusion:** Summary of what stays and what goes.

  7.  **Key Philosophical References (Mental Check):**
      *   Hart & Honoré (*Causation in the Law*): Normal conditions vs. interventions.
      *   Jonathan Schaffer: Contrastive causation.
      *   Sarah McGrath: Omissions and normative expectations.
      *   Legal "But-For" vs. "Substantial Factor."

  8.  **Final Polish:** Ensure tone is analytical, respectful, and directly answers the prompts. (Self-correction: Make sure to explicitly answer the "illicit work" question). The user wants to know if their intuition about the 5% case is confusion. I should validate that.

  *(Self-Correction during drafting)*: Wait, regarding the Pond case (Case 4). If 50 people watch, and *any one* could save the child. If Person A had jumped, child lives. So A's omission is a but-for cause. Why does the user feel unsure? Because B, C, D... also could have. This is *symmetric overdetermination by omission*. The principle needs to handle this. If the principle requires "uniquely positioned," the medics/pond cases break it. I need to adjust the principle to allow for "class membership" in the designated role.

  *Revised Principle Idea:* Focus on **Expectation** rather than strict **Obligation**. The gardener is *expected*. The neighbors are not. The medics are *expected* (qua medics), even if not uniquely. The pond onlookers? Social expectation is lower than medics, higher than strangers. This gradation explains the wobble.

  *Probability:* Stick with the "More Likely Than Not" (>50%) standard for *causing the outcome*, distinct from *causing the risk*. This solves the Doctor case cleanly.

  *Let's write.*
answer: |-
  This is a classic problem in the metaphysics of causation and the philosophy of law. You are grappling with the distinction between *causal dependence* (counterfactuals) and *causal attribution* (normative selection). Your intuitions are stable because you are implicitly tracking two different things: physical counterfactuals and normative expectations.

  Here is an analysis of your verdicts, a refined principle, and an honest accounting of where your intuitions need to shift.

  ### 1. The Refined Principle: Normative Expectation + Substantial Factor

  Your tentative principle is close to the "Normative Expectation" view defended by philosophers like Sarah McGrath and legal theorists like Hart and Honoré. However, to handle the probability wobble (the Doctor cases) and the overdetermination wobble (the Pond/Neighbors), we need to tighten the definitions.

  **The Principle of Normatively-Salient Omission:**
  An agent's omission $O$ causes outcome $E$ if and only if:
  1.  **Counterfactual Dependence:** Had the agent performed the act $A$, the probability of $E$ occurring would have dropped below 50% (the "More-Likely-Than-Not" threshold).
  2.  **Normative Salience:** The performance of $A$ was part of the *expected normal course of events* for that agent in that context (due to duty, role, contract, or unique capacity).

  **Defending the Probability Threshold (The Doctor Cases):**
  You asked whether clause (a) should be deterministic or probabilistic. It must be probabilistic, but with a threshold.
  *   **The 90% Case:** The doctor's omission dropped the survival chance from 90% to 10%. The omission changed the outcome from "likely life" to "likely death." The omission is a *substantial factor* in the death.
  *   **The 5% Case:** The doctor's omission dropped survival from 5% to 0%. The outcome (death) was *already* overwhelmingly probable due to the disease. The omission did not tip the scales.
  *   **The Verdict:** Your intuition here is correct, but your terminology is slightly off. In the 5% case, the doctor did not *cause the death*; the doctor *caused the loss of a chance*. This is a recognized legal distinction. If you insist on binary causation ("Did he cause the death? Yes/No"), you must say **No** for the 5% case. To say "Yes" conflates *causing an outcome* with *imposing a risk*. Abandoning the verdict that the doctor "caused the death" in the 5% case is necessary for consistency.

  ### 2. Verdicts on New Cases

  Running the **Normatively-Salient Omission** principle on your requested scenarios:

  **A. The Software Engineer (Safety Flag, 33% Prevention)**
  *   **Analysis:** The engineer had a duty (Normative Salience: Met). The flag would have prevented the crash 33% of the time (Counterfactual Dependence: Failed >50% threshold).
  *   **Verdict:** The engineer did not *cause* the crash. The engineer caused a *hazardous condition* or *imposed an unjustifiable risk*.
  *   **Reasoning:** Like the 5% doctor, the crash was more likely than not to happen even with the flag (67% failure rate). The primary cause is the chain of events leading to the crash; the engineer's omission is a background condition, not the salient cause.

  **B. The City Council (Rotten Guardrail + Speeding Driver)**
  *   **Analysis:** The Council had a duty to repair (Normative Salience: Met). Would the rail have prevented the death?
      *   *Scenario i:* If the rail would have held even at that speed: The Council caused the death. The driver's speeding is a condition, but the Council's omission broke the safety chain.
      *   *Scenario ii:* If the speed was so high the rail would have failed anyway: The Council did not cause the death (Counterfactual Dependence fails).
  *   **Verdict:** Assuming the rail *would* have worked: The Council caused the death. The driver's negligence does not absolve the Council if the Council's duty was specifically to protect against *accidents* (which include some speeding). However, if the driver's act is seen as a "novus actus interveniens" (a new intervening act that breaks the chain), the driver is the sole cause. In tort law, both are often causes (concurrent causation). My principle leans toward **concurrent causation** if the rail was statistically likely to save the driver.

  **C. Three Off-Duty Medics (Collapsed Runner)**
  *   **Analysis:** All three had a professional capacity (Normative Salience: Met for all, as a class). Any one could have saved the runner (Counterfactual Dependence: Met for all).
  *   **Verdict:** **All three caused the death.**
  *   **Reasoning:** This is *symmetric overdetermination by omission*. Unlike the "100 neighbors" case, these medics share a specific normative role. The "uniquely positioned" clause in your original principle is too strict here; it should be "positioned within the relevant normative class." Since any single medic's action would have saved the runner, each medic's omission is a but-for cause. The fact that there were others who also failed does not negate the causal power of the first medic's failure.

  ### 3. Honest Accounting: Which Verdicts Must Go?

  Here is the cost of adopting the **Normatively-Salient Omission** principle.

  **1. The 5% Doctor Verdict (Must be Abandoned)**
  *   **Your Verdict:** Doctor failed to prevent, but disease caused death.
  *   **Principle Verdict:** Doctor did not cause death (caused loss of chance).
  *   **Assessment:** This is an acceptable loss. Your intuition was actually already aligned with the principle ("disease caused the death"), but you worried the principle wouldn't handle it. It does, provided we distinguish *causing death* from *causing risk*. You should formally abandon the idea that the 5% doctor "caused the death."

  **2. The Pond/Neighbors Verdict (Needs Nuance)**
  *   **Your Verdict:** Gardener caused it; 100 Neighbors did not. 50 Pond Onlookers? (Unsure).
  *   **Principle Verdict:** Gardener caused it (Contract/Expectation). Neighbors did not (No Expectation). Pond Onlookers?
  *   **The Conflict:** If you say the Pond Onlookers *did* cause it, you break the symmetry with the Neighbors. If you say they *didn't*, you struggle with the moral gravity of the case.
  *   **Resolution:** The principle suggests **none of the individual onlookers caused the death**, though the *collective* inaction might be described as the cause.
  *   **Why?** In the Neighbor case, there is no social expectation that *Neighbor #42* waters your plants. In the Pond case, there is a general moral expectation that *someone* acts, but not a specific expectation that *You* act (unless you are the only one there).
  *   **The "Too Many Non-Waters" Point:** You asked if this can be made precise. It is the **Problem of Many Hands**. In causation, if 100 people could have acted, and only 1 action was needed, the causal efficacy of any single omission is diluted *normatively*, even if it holds *counterfactually*.
  *   **Recommendation:** You should accept that in the Pond case (50 onlookers), **no single individual caused the death.** They are all *culpable* for the death, but culpability does not require singular causation. This confirms your suspicion: your gardener-versus-neighbors verdict is indeed about **desert wearing the mask of causation**. The gardener is the "salient" cause because he was the designated preventer. The neighbors are not salient. The pond onlookers are in a gray zone where moral blame outstrips individual causal attribution.

  ### 4. Is the "Designated-Person" Clause Illicit?

  You asked if importing moral standing (obligation/designation) into causal facts is illicit.

  **The Short Answer:** For omissions, **no**. It is not illicit; it is necessary.

  **The Explanation:**
  Physical causation involves the transmission of energy or force. An omission involves *nothing*. There is no physical event where the gardener *didn't* water the plants. The "absence of water" is not a physical force that kills the plant; the sun and metabolism kill the plant.
  We only call the gardener's inaction a "cause" because we compare the actual world to a **normative baseline**.
  *   **World 1 (Actual):** Gardener doesn't water -> Plant dies.
  *   **World 2 (Expected):** Gardener waters -> Plant lives.

  Without the "Expected" world (generated by duty, contract, or role), World 1 is just nature taking its course. Therefore, **causation by omission is inherently normative.** It is a hybrid concept mixing metaphysics (dependence) and ethics (expectation).

  If you remove the "designated-person" clause, you are left with the **Problem of Negative Existentials**:
  *   *If duty doesn't matter:* The stranger on the continent caused the plant's death just as much as the gardener (counterfactually, if he had teleported and watered, the plant would live).
  *   *Result:* Everyone causes everything they fail to prevent. Causation becomes ubiquitous and useless.

  **Conclusion on Normativity:** Keep the clause. It is not smuggling ethics into metaphysics; it is acknowledging that "omission" is not a metaphysical primitive but a normative description of an event.

  ### Summary of Recommendations

  1.  **Adopt the Threshold:** Define causation by omission as requiring a >50% probability of prevention. This solves the Doctor cases (90% = cause, 5% = risk).
  2.  **Accept Normative Salience:** Acknowledge that duty/role is required to distinguish the gardener from the stranger. This is not illicit; it's constitutive of omission.
  3.  **Abandon Individual Causation in Overdetermination:** In the Pond (50 onlookers) and Neighbors (100 neighbors) cases, accept that **no single individual caused the outcome**, even if all are blameworthy. This resolves the tension between Case 3 and Case 4.
  4.  **Refine "Unique Position":** Change "uniquely positioned" to "member of the responsible class." This handles the Three Medics case (all caused it) vs. the Neighbors case (none caused it).

  Your principle is sound, but it requires you to be comfortable with the idea that **causation by omission is not a physical fact, but a normative attribution.** Once you accept that, the wobbles straighten out.
