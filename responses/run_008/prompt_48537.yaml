answer: |-
  # THE FERMI DECISION TREE
  **Start:** "I agree the Fermi paradox needs some explanation."

  **1. Are there other technological civilizations within causal contact (reachable/detectable)?**
  *   **NO** → Go to **2**.
  *   **YES** → Go to **3**.

  **2. Is the scarcity of civilizations due to the difficulty of life starting or the difficulty of surviving technology?**
  *   **Life Starting** → **RARE EARTH (Filter Behind)**
  *   **Surviving Technology** → **GREAT FILTER AHEAD**

  **3. Are Earth's biosignatures (atmosphere/heat) currently readable from interstellar distances?**
  *   **YES** → **LEAKAGE FATALIST**
  *   **NO** → Go to **4**.

  **4. Can a civilization actively suppress all technosignatures indefinitely?**
  *   **NO** → **LEAKAGE FATALIST** *[See Note A]*
  *   **YES** → Go to **5**.

  **5. Is the cost of an interstellar first strike lower than the cost of long-term vigilance?**
  *   **NO** → **ZOO HYPOTHESIS**
  *   **YES** → Go to **6**.

  **6. Is there a reliable mechanism to verify another civilization's intentions before they enter weapon range?**
  *   **YES** → Go to **7**.
  *   **NO** → **DARK FOREST**

  **7. Should we prioritize potential gain over potential risk?**
  *   **YES** → **METI OPTIMIST**
  *   **NO** → **PASSIVE SETI**

  ***

  ### LEAF DEFINITIONS & AWKWARD COMMITMENTS
  *   **RARE EARTH (Filter Behind):** We are truly alone and bear the entire burden of consciousness in the universe.
  *   **GREAT FILTER AHEAD:** Our destruction is statistically inevitable and likely near, regardless of policy.
  *   **LEAKAGE FATALIST:** Our current behavior doesn't matter, so we might as well party before the end (or prepare for doom).
  *   **ZOO HYPOTHESIS:** We are essentially pets or exhibits denied agency by our keepers.
  *   **DARK FOREST:** We must be willing to genocide innocent civilizations preemptively to survive.
  *   **METI OPTIMIST:** We should gamble the survival of all future humans on a hope of friendship.
  *   **PASSIVE SETI:** We must remain forever silent even if cooperation could solve entropy/death.

  ***

  ### ANNOTATIONS & TRAPS
  *   **[Note A] Convergence:** The leaf at **Q3-YES** and **Q4-NO** is identical. If you believe hiding is impossible (Q4), you must admit Earth is already visible (Q3), unless you think Earth is uniquely sloppy. Both paths lead to "Silence is useless."
  *   **The Zoo/SETI Overlap:** If you answer **NO** to **Q5** (Strike not feasible) but **YES** to **Q7** (Prioritize Gain), you land in **METI**, not **ZOO**. The Zoo Hypothesis specifically requires that *they* are here and *choosing* not to interfere. If strikes are impossible, METI and Zoo look identical in practice (we stay quiet-ish), but differ on *why* (fear of pets vs. lack of threat).
  *   **Incoherent Path:** There is no leaf for **Q5-YES** (Strike Feasible) + **Q6-YES** (Intentions Verifiable) + **Q7-NO** (Risk Averse). This is **Paranoid Diplomat**. It is logically stable but rarely defended; it implies contact is safe but you refuse it anyway. Most people here collapse into **Passive SETI**.
  *   **The "Hide" Trap:** If you argue for **Dark Forest** but answer **NO** to **Q4** (Concealment), you are inconsistent. You cannot hide if hiding is physically impossible. You are actually a **Leakage Fatalist** who enjoys doom-scrolling.
