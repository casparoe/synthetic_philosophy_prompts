prompt: |-
  my roommate keeps deploying "Malthus was right, just early" whenever anyone points out that the green revolution seemed to falsify him — the latest was in an argument about whether we're headed for a food crisis this century, where it was doing a LOT of work. it's a clever line but it also feels like a move that lets you never lose. can you lay out the different precise claims that could actually be packed into that one-liner — that his mechanism (population outrunning subsistence absent checks) was right and only the timing was off, that his conditional predictions held wherever the conditions were met, that exponentials beat linears eventually so only the date is negotiable, or something else — and for each reading say whether it's defensible, whether it's even the kind of claim that could ever be wrong, and which one (if any) supports treating a crisis as basically inevitable? also say something about when deferring a long-run prediction is legitimate science versus just rescuing the prediction from refutation, because that seems like the crux of whether i should concede the argument or not
reasoning: |-
