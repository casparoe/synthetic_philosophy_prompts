          *   *Inevitability?* High.

      *   *Claim 3: Conditional Prediction (Absent Checks).*
          *   *Defensible?* Tautological. "If no checks, then famine." Well, famine is a check.
          *   *Falsifiable?* No. It's a definition.
          *   *Inevitability?* Trivial.

      *   *Claim 4: Neo-Malthusian (Different Limits).*
          *   *Defensible?* Plausible (climate, phosphorus, water).
          *   *Falsifiable?* Yes, by solving those specific constraints.
          *   *Inevitability?* Contingent on specific resource depletion.

  4.  **Philosophy of Science Angle (Lakatos/Popper):**
      *   *Popper:* A theory must be falsifiable. "Just early" pushes the falsification date forward indefinitely. This is an *ad hoc* hypothesis.
      *   *Lakatos:* Research programs have a "hard core" and a "protective belt." Is "Malthusianism" a degenerating or progressing program? If it keeps adding excuses (just early, new limits, different metrics) without new predictive power, it's degenerating.
      *   *Legitimate Deferral:* If there's independent evidence for the delay mechanism (e.g., "we found a new oil reserve, so peak oil is later").
      *   *Immunizing Strategy:* If the only reason for the delay is "the theory says it must happen eventually," that's circular.

