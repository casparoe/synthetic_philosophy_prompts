answer: |-
  ### Essay Question

  **The Trilemma of the Conscientious Voter**

  Consider Elena, a voter in a genuinely competitive constituency. She faces three candidates: (1) a Frontrunner whose platform she considers seriously unjust; (2) a Challenger she deems "less bad," who is polling neck-and-neck with the Frontrunner; and (3) a Principled Candidate she fully endorses, who is polling in the low single digits. Elena believes voting is not merely instrumental but expressive—a way of "standing for" a value. However, she also believes allowing the Frontrunner to win through her abstention would be morally catastrophic. She estimates the Challenger will likely win without her specific vote, yet she fears the margin could be razor-thin.

  Write an essay evaluating whether Elena is morally obligated to vote for the Challenger. In your analysis, you must rigorously distinguish between two distinct lines of reasoning:
  1.  **The Causal Argument:** That her vote is a tiny contribution to an outcome. (If the effect is negligible, why does it generate an obligation? If it is not negligible, why does this reasoning not dissolve the duty to vote in non-competitive races?)
  2.  **The Expressive Argument:** That casting a ballot is an act of endorsement. (How can one be required to endorse what one disavows?)

  Conclude by assessing which argument, if either, carries the normative weight in this scenario.

  ***

  ### Model Answer

  Elena's dilemma exposes a fracture in democratic ethics between consequentialist obligations and deontological integrity. To resolve whether she must vote for the "less bad" Challenger, we must disentangle the causal logic of harm reduction from the expressive logic of moral standing.

  The causal argument rests on expected utility. Even if Elena's single vote is unlikely to be decisive, the magnitude of the harm prevented (the Frontrunner's unjust platform) is so vast that even a minuscule probability of affecting the outcome generates a moral duty. This is the "multiplier effect": $Probability \times Magnitude = Obligation$. However, this reasoning faces the problem of negligible causation. If Elena admits her vote likely won't change the result (as the prompt suggests the Challenger may win without her), the causal duty evaporates unless she accepts a principle of *universalizability*: if everyone reasoned as she does, the Challenger loses. Yet, this invites the paradox of the heap. If the duty relies on the aggregate, why is *she* specifically obligated when her individual causal contribution is effectively zero? If we accept that negligible causal power dissolves obligation, we dissolve the duty to vote entirely, even for the Principled Candidate. Therefore, for the causal argument to hold, Elena must accept that voting is a participation in a collective action where individual causality is secondary to collective efficacy.

  However, the causal argument alone is insufficient because it ignores the expressive cost. Voting is not merely pushing a lever; it is a public assertion of support. To vote for the Challenger is to stain one's moral record with endorsement of policies one finds objectionable, merely to prevent something worse. This is the problem of "dirty hands." If voting is expressive, a duty to vote for the Challenger implies a duty to compromise one's integrity. This creates a tension with the intuition many hold regarding compulsory voting. Students of democracy often argue that voting is a civic duty enforceable by the state. Yet, if voting is inherently expressive—an act of speech—then compulsory voting amounts to coerced speech. One cannot be morally required to *say* (via ballot) that one supports the Challenger if one does not. If the expressive argument carries weight, it suggests that while Elena may have a duty to *participate* (to reduce causal risk), she cannot have a duty to *endorse* the Challenger specifically. She might instead cast a spoiled ballot or vote for the Principled Candidate to maintain integrity, accepting the causal risk.

  Which argument carries the weight? In this specific trilemma, the causal argument must prevail, but only if modified. The expressive cost is real, but it is subjective; the harm of the Frontrunner is objective and shared. Elena's integrity is hers alone; the injustice of the Frontrunner affects the vulnerable. Therefore, the obligation to prevent catastrophic harm overrides the obligation to maintain expressive purity. However, this does not validate compulsory voting. The state can require the *act* of voting (causal participation), but it cannot require the *content* of the vote (expressive endorsement) without violating the very autonomy democracy presumes.

  Ultimately, Elena is obligated to vote for the Challenger, not because her vote will certainly decide the election, but because the expected disvalue of the Frontrunner's victory outweighs the expressive cost of a tainted ballot. She must accept the moral residue of this choice. To refuse is to prioritize her own moral cleanliness over the material welfare of her fellow citizens, treating the ballot box as a confessional rather than a mechanism of governance.

  ***

  ### Marking Scheme (20 Marks)

  **1. Causal Analysis (5 Marks)**
  *   **5:** Explicitly addresses the "negligible effect" paradox. Explains why a tiny probability can generate duty (expected utility) OR why it fails (collective action problem).
  *   **3-4:** Identifies the causal argument but treats probability superficially.
  *   **0-2:** Asserts "one vote never matters" as a truism without exploring its implication for the general duty to vote. **(Penalize heavily)**.

  **2. Expressive Analysis (5 Marks)**
  *   **5:** Articulates the tension between voting as endorsement vs. voting as harm-reduction. Discusses the "dirty hands" or integrity cost.
  *   **3-4:** Mentions expression but fails to explain how it conflicts with obligation.
  *   **0-2:** Treats voting purely as instrumental; ignores the expressive constraint.

  **3. Synthesis & Compulsory Voting Insight (5 Marks)**
  *   **5:** Successfully weighs the two arguments. **Crucially:** Notes that if voting is expressive, compulsory voting is coerced speech (the specific tension requested).
  *   **3-4:** Weighs arguments but misses the compulsory voting/expressive tension.
  *   **0-2:** Conflates the two arguments or provides a generic "just vote" conclusion.

  **4. Clarity and Structure (5 Marks)**
  *   **5:** Persuasive, clear, adheres to word count, distinct sections for causal/expressive.
  *   **3-4:** Readable but disorganized.
  *   **0-2:** Difficult to follow or significantly under/over length.

  **Specific Differentiators (A vs. B):**
  *   **A Grade (16-20):** Separates the two logics cleanly. Confronts the "negligible vote" paradox without dismissing duty. Identifies the conflict between expressive voting and state compulsion.
  *   **B Grade (11-15):** Discusses both arguments but allows them to bleed into one another. Relies on standard civic duty rhetoric. Misses the coerced speech implication.

  ***

  ### Instructor's Note: Common Student Error

  **The Conflation Trap:** The most frequent error in this seminar is treating the causal and expressive arguments as complementary rather than potentially contradictory. Students often write, "You should vote for the lesser evil because it matters (causal) and it shows you care (expressive)." This fails the prompt. The expressive argument suggests voting for a "less bad" candidate *corrupts* what you show you care about. An A-grade paper must recognize that these two frameworks pull in opposite directions: one demands compromise for safety, the other demands purity for integrity.
