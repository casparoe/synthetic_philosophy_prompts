  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm overstepping my bounds as a panelist. I am circulating a write-up/recommendation. I should frame it as "The Panel's Recommendation" or "Draft Recommendation for Discussion." I will frame it as a draft for the panel to endorse, authored by me.

  Let's refine the criterion. "Shared Cause" is hard. "Shared Fix" is circular. How about **"Mitigation Portability without Degradation"**? If the old fix works on the new bug without tweaking, they are functionally the same mechanism *for safety purposes*. This bridges the gap.

