answer: |-
  To: Director of Policy Planning
  From: Economic Policy Intern
  Subject: Decision Framework for Sector Liberalization Proposals

  You asked me to translate the theoretical arguments I often reference regarding market coordination into a practical decision procedure for our unit. The goal is to move us away from ad hoc decisions based on who argues loudest in the Tuesday meeting and toward a consistent heuristic for determining whether a sector should remain under central administration or be liberalized. The following memo outlines that procedure, grounded in the economic literature on information and incentives, and applies it to two current files on our docket: bulk irrigation water and government-wide IT procurement.

  The core insight from the literature we are drawing on, specifically the work of Friedrich Hayek and his contemporaries, is not that markets are morally superior to planning, but that they differ in how they process information. The settled consensus in modern economics is that prices serve two functions: they provide incentives for efficiency and they convey information about scarcity and demand that is otherwise dispersed among millions of actors. The contested part of the debate, which dates back to the socialist calculation arguments of the 1930s, is whether a central planning board can simulate this function through trial and error without owning the means of production. While some theorists argue that modern computing allows planners to approximate market outcomes, the prevailing view among practitioners is that central bodies struggle to access tacit knowledge, which is the specific, uncodified information held by individuals on the ground about their immediate circumstances. Therefore, the decision procedure I am proposing does not ask whether we prefer markets in the abstract, but rather asks where the relevant knowledge for decision-making resides and whether price signals are necessary to transmit it.

  The procedure begins by asking whether the good or service in question can be practically excluded from non-payers and whether consumption by one user reduces availability for others. If the answer is no, meaning the good is a public good or a common pool resource, market pricing will fail to account for externalities, and this is a point of settled economic theory where state intervention is generally required regardless of calculation efficiency. If the good is excludable and rival, we move to the second question, which is the heart of the Hayekian critique. We must ask whether the knowledge required to allocate this resource efficiently is codifiable and centralizable, or whether it is tacit and local. If the specifications, demand patterns, and production costs can be written down and known by a central office without significant lag or distortion, a planned or administered price system can work with reasonable efficiency. However, if the relevant knowledge is dispersed among many actors and changes rapidly, such as consumer preferences or local production conditions, central planning will inevitably suffer from information loss. In these cases, the procedure recommends liberalization, not because the state is incapable of setting a price, but because the state cannot know the correct price without the discovery mechanism of competition.

  The third step in the procedure assesses the availability of reference prices. If a liquid global or domestic market exists for the good, we can import price signals rather than generating them domestically. This allows us to keep ownership state-side if necessary while still benefiting from market information. If no reference price exists, we must ask whether a trial-and-error approach by the ministry is feasible without causing significant waste or shortages. This is the Lange counter-argument to Hayek, suggesting planners can adjust prices based on inventory levels. In practice, this works for stable commodities with long production cycles but fails in dynamic sectors where innovation drives value. Finally, the procedure requires a hard stop where we acknowledge that efficiency is not the only value at stake. If a sector is critical for national security, social stability, or equity, the ministry may choose to retain control despite the efficiency costs identified in the previous steps. This is not an economic conclusion but a political one, and the procedure mandates that if we choose planning for these reasons, we must explicitly budget for the efficiency loss rather than pretending the plan is economically optimal.

  It is important to be plain about where this checklist is a judgment call dressed up as a technical rule. Distinguishing between knowledge that is codifiable and knowledge that is tacit is often subjective. A planner may believe they understand local needs because they have data, while the local actor knows the data is outdated or misses context. Similarly, defining national security is inherently political. A ministry might label any domestic industry as a security risk to protect it from competition. This procedure cannot resolve those disputes, but it forces them into the open. We are not claiming that this framework produces a single mathematically correct answer, but rather that it structures the disagreement so that we are arguing about the nature of the knowledge or the weight of the security concern, rather than arguing past each other about ideology.

  Applying this to the file on bulk irrigation water, the first step identifies the good as a common pool resource with significant externalities. Water usage by one farmer affects aquifer levels and downstream availability for others, and it is difficult to exclude users without massive infrastructure investment. This triggers the settled economic consensus that pure market pricing will lead to over-extraction and environmental degradation, regardless of how well the market calculates value. Moving to the knowledge question, the relevant information is indeed hyper-local, regarding soil conditions and crop timing, which supports the Hayekian argument for decentralized decision-making. However, because the physical resource is homogeneous and the stakes involve food security and public health, the equity and security override applies. The procedure suggests that while we should not liberalize this into a free market, keeping it fully planned ignores the knowledge problem. The recommendation is to maintain state ownership of the infrastructure and allocation rights to satisfy the security constraint, but to introduce shadow pricing or quotas that reflect scarcity to mitigate the calculation error. To answer your specific concern about my own view on this file, the economic logic does not support a free market here due to the externalities, but it also does not support a purely administered price that ignores scarcity. If we keep it planned, we are explicitly choosing food security over allocative efficiency, and we must accept that this will result in some waste or misallocation that a price mechanism would have corrected.

  Turning to the government-wide IT procurement file, the analysis yields a different result. Hardware components like servers and laptops have established world reference prices and are homogeneous goods. The knowledge required to procure them is codifiable in technical specifications. For this portion of the budget, the procedure recommends centralized tendering to leverage bulk purchasing power, as the information problem is minimal. However, the software integration and user interface requirements fail the codifiability test. The knowledge of what users actually need to perform their tasks is tacit and resides with the clerks and analysts, not the central procurement office. History shows that when central IT units specify software without end-user input, the result is often expensive systems that go unused or require costly modification later. This is a classic calculation problem where the planner cannot access the local knowledge of time and place. The procedure therefore recommends liberalizing the software and services component by allowing individual ministries to procure solutions within a budget cap, or at least requiring that the central tender be modifiable by end-users post-contract. Here the trade-off is between the price discount of bulk buying and the efficiency loss of unusable software. Given that the cost of unused software is often total, the procedure leans toward decentralizing the requirements phase even if the contracting remains centralized.

  In summary, this framework does not tell us what to value, but it tells us what information we need to make the decision. For water, the constraint is physical and political, limiting the scope for markets regardless of calculation efficiency. For IT, the constraint is informational, suggesting that centralization will fail to capture the value of the technology even if it saves money on the hardware. I recommend we adopt this sequence of questions for the next cycle of proposals, with the understanding that the final decision on security and equity overrides remains with the Minister. This allows the unit to provide clear advice on the economic trade-offs while leaving the political judgments where they belong. I am available to walk the team through the application of this logic on the remaining files before the Tuesday meeting.
