      *   I should highlight this irony. Usually, "ignoring bylaws" means being *more* permissive. Here, being permissive (Funding) aligns with the bylaws/precedent. Being restrictive (Rejecting) aligns with "gut check" but violates the established procedure.

      *   *Wait, does "Committee judges" imply unanimity?* No, "majority" is standard.
      *   *Does it imply Member Majority?* "The Committee" usually acts by majority vote of members.
      *   *However*, the *Soil Carbon* case proves they don't just vote "Fund/No Fund." They vote criteria.
      *   So the "Committee judges sound" = Majority on Sound. "Committee judges capable" = Majority on Capable.
      *   This is the Premise-Based Procedure.
      *   Okay, ready to write.

