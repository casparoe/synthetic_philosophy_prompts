  4.  **Identifying Tensions (The "Unsatisfiable Core"):**
      *   *Tension:* Strong Arbitrariness vs. Chemical Determinism. If the code is *truly* arbitrary (like ASCII), it supports the "Coder" intuition. If it's chemically constrained, it weakens the "Coder" intuition but weakens the "Code" analogy.
      *   *Tension:* Semantic Realism vs. Evolutionary Naturalism. If "meaning" is real (Teleosemantics), does it require a history of selection? If so, does the *first* code have meaning?
      *   *Key Conflict:* The "Coder" argument relies on **Strong Arbitrariness** + **Semantic Realism**. Evolution relies on **Historical Continuity** + **Physical Grounding**.
      *   *Unsatisfiable Trio:* (1) The code is semantically identical to human language (requires agent), (2) The code arose via blind variation/selection (no agent), (3) The code is functionally robust (works). Actually, (1) and (2) are the conflict.
      *   *Refinement:* The real tension is between **Decoder Independence** (the message exists without the decoder) and **Decoder Relativity** (the message requires the machinery). The "Coder" argument assumes the message exists independently. Biology says the message *is* the relationship.

  5.  **Identifying the "Killer" Desideratum:**
      *   Which requirement kills the most popular bad theories?
      *   *Candidate:* **Decoder Relativity.** Many people think the DNA *contains* the instructions like a book. But without the ribosome/tRNA, it's just chemistry. This kills the "DNA is a blueprint" metaphor which fuels the ID argument.
      *   *Alternative:* **Physical Grounding.** Kills dualism.
      *   *Decision:* **Decoder Relativity (Context-Dependence).** This is the one that most clearly separates biological information from human communication (where the code is often abstracted from the hardware). It blocks the inference to a "Coder" because the "Code" is an emergent property of the system, not an input to it.

  6.  **Evaluating the Three Accounts:**
      *   *Causal-Dispositional (Smoke/Fire):* Fails on Specificity and Degeneracy. Smoke doesn't have synonyms.
      *   *Arbitrary Mapping (No Intent):* Good on Transposability/Decoder Relativity. Struggles with Physical Grounding (how does arbitrariness arise physically?) and the "First Code" problem.
      *   *Teleosemantic (Selected Effect):* Good on Function/Specificity. Struggles with Deviations (is a mutated code 'wrong' or just 'different'?) and potentially circular if selection presupposes function.

  7.  **Review against Constraints:**
      *   British English? (Check: *realise, programme, colour, analyse* etc., though mostly relevant in spelling/idiom).
      *   Structure? Desiderata first, then Tensions, then Killer Requirement, then Scorecard.
      *   Tone? Rigorous, philosophical.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the stalemate.
      *   *Desiderata List:* Number them. Label Non-negotiable vs. Contested.
      *   *Tensions:* Highlight the "Arbitrariness vs. Origin" clash.
      *   *Killer:* Decoder Relativity.
      *   *Scorecard:* Keep it tight.

      *(Self-Correction during drafting)*: I need to make sure I don't just list biological facts but *theoretical requirements*. Instead of "Explain degeneracy," say "Account for Synonymy without Semantic Loss."
      *(Refining the "Coder" rebuttal)*: The prompt asks to referee the argument. The desiderata should make it clear why the "Code $\rightarrow$ Coder" move fails *if* the theory is adequate. The key is that human codes are *stipulated*, biological codes are *crystallised*.

      *(Checking British English)*: Ensure 's' instead of 'z' in *realise, organise*, etc. Use 'programme' for computer/biological contexts if applicable (though 'program' is often accepted in tech, 'programme' is safer for British standard). Use 'whilst', 'amongst' where appropriate for tone.

      *(Final Polish on the "Unsatisfiable Core")*: The prompt asks if any subset is jointly unsatisfiable. The tension between "Strong Arbitrariness" (required for the Code analogy to hold water against chemical reductionism) and "Naturalistic Origin" (required for the biology to hold water against ID) is the spot. If it's truly arbitrary like ASCII, how did it start without a mind? If it's chemically determined, is it really a code? An adequate theory must dissolve this dichotomy, likely by redefining 'arbitrary'.

      *(Final Polish on the "Killer Requirement")*: I will select **Decoder Relativity**. It undermines the idea that the information sits *in* the DNA waiting to be found by a coder. It shows the code is a system property.

  9.  **Final Review of the Output:** Does it answer the prompt directly? Yes. Is the distinction between non-negotiable and prejudicial clear? Yes. Is the scorecard brief? Yes.

      *Wait, one nuance:* The prompt asks about "Semantic vs. Correlational". I need to be explicit about whether demanding semantics is a prejudice. I will classify "Robust Semantics" as contested/prejudicial, whereas "Causal Specificity" is non-negotiable.

