      *   **Task:** Create a list of *desiderata* (requirements) for an adequate theory of genetic information.
      *   **Specific Constraints:**
          *   Must cover specific phenomena: degeneracy, near-universality/deviations, physical realization (tRNA/synthetases), transposability (GFP in bacteria), regulatory regions, and the bare causal/chemical nature of DNA.
          *   Must identify non-negotiable vs. prejudicial requirements.
          *   Must flag jointly unsatisfiable subsets (tensions/trade-offs).
          *   Must identify the single most exclusionary requirement.
          *   Must evaluate three specific accounts (Causal-Dispositional, Arbitrary Mapping without Intent, Teleosemantic) against the list.
          *   **Language:** British English.
          *   **Tone:** Philosophical, rigorous, referee-like, avoiding fluff.

  2.  **Deconstruct the Phenomena & Derive Desiderata:**
      *   *Phenomenon:* Degeneracy (synonyms map to same amino acid).
          *   *Desideratum:* The theory must distinguish between *syntax* (the codon) and *semantics* (the amino acid/function) without implying loss of meaning in synonyms. It needs to handle equivalence classes.
      *   *Phenomenon:* Near-universality + Deviations (mitochondria, ciliates).
          *   *Desideratum:* The theory must explain stability (why it doesn't change easily) *and* evolvability (how it *can* change). It must account for historical contingency vs. chemical necessity.
      *   *Phenomenon:* Physical Realization (tRNA, synthetases).
          *   *Desideratum:* The theory must separate the *vehicle* (DNA) from the *decoder* (machinery). The code isn't intrinsic to the polymer; it's relational.
      *   *Phenomenon:* Transposability (GFP in bacteria).
          *   *Desideratum:* Substrate independence (to a degree). The information must be portable across contexts provided the decoding machinery is compatible.
      *   *Phenomenon:* Regulatory regions (non-coding DNA).
          *   *Desideratum:* The theory must distinguish between *coding* information (protein sequence) and *control* information (expression levels/timing), or unify them under a broader information concept.
      *   *Phenomenon:* Bare Causal Fact (polymer chemistry).
          *   *Desideratum:* The theory must reconcile the semantic view with the physicalist view. No magic. The "meaning" must cash out in causal powers.

  3.  **Drafting the Desiderata (Iterative Refinement):**
      *   *D1: Physical Grounding.* (From "bare causal fact"). Non-negotiable. No dualism.
      *   *D2: Decoder Relativity.* (From "physical realization"). The code exists relative to the translational machinery. Non-negotiable.
      *   *D3: Degeneracy Handling.* (From "degeneracy"). Synonyms must be semantically equivalent but syntactically distinct. Non-negotiable.
      *   *D4: Historical Contingency vs. Stability.* (From "universality/deviations"). Must explain why it's frozen but not immutable. Non-negotiable.
      *   *D5: Functional Specificity.* (From "transposability"). The output must be specific (fluorescence), not just general causal impact. Non-negotiable.
