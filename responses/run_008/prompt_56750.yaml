answer: |-
  Here are the desiderata for an adequate theory of genetic information, structured to expose the fault lines in the 'Code $\rightarrow$ Coder' argument.

  ### The Desiderata

  **1. Physical Grounding (Non-negotiable)**
  *   **Requirement:** The account must explain how informational properties supervene on physico-chemical properties without remainder. There can be no 'ghost in the machine' where semantics floats free of molecular interaction.
  *   **Motivation:** The bare causal fact. DNA is a polymer; its interactions are governed by charge, shape, and affinity. If the theory implies a non-physical layer of 'meaning' that exerts causal power, it violates closure of the physical.
  *   **Status:** Non-negotiable. Any account violating this is metaphysically untenable in a scientific context.

  **2. Decoder Relativity (Non-negotiable)**
  *   **Requirement:** The account must locate the 'code' in the relationship between the sequence and the translational machinery (tRNA, synthetases, ribosomes), not intrinsic to the sequence alone.
  *   **Motivation:** Physical realisation. A DNA strand in a test tube does not encode proteins; it encodes them only relative to a specific cellular context. Without the decoder, the 'message' is causally inert regarding protein synthesis.
  *   **Status:** Non-negotiable. This is the primary failure point of the 'blueprint' metaphor.

  **3. Synonymy without Semantic Loss (Non-negotiable)**
  *   **Requirement:** The account must handle degeneracy such that distinct vehicles (codons) map to identical semantic values (amino acids) without implying one is a 'mistake' or 'noise'.
  *   **Motivation:** Degeneracy of the codon table. If information were merely causal specificity, different causes should yield different effects. Here, different causes yield the same functional outcome. The theory must distinguish syntax from semantics.
  *   **Status:** Non-negotiable.

  **4. Historical Contingency and Stability (Non-negotiable)**
  *   **Requirement:** The account must explain why the code is nearly universal (frozen) yet capable of local variation (mitochondria, ciliates) without collapsing into either pure chemical necessity or pure chance.
  *   **Motivation:** Near-universality and deviations. If the code were chemically necessary, deviations would be impossible. If it were purely arbitrary, it would not be stable across billions of years.
  *   **Status:** Non-negotiable.

  **5. Portability (Non-negotiable)**
  *   **Requirement:** The account must explain how a sequence can retain its 'meaning' when transplanted into a foreign host, provided the decoding machinery is compatible.
  *   **Motivation:** Transposability (e.g., jellyfish GFP in bacteria). This demonstrates that the information is not wholly bound to the original organism's history, but resides in the compatibility of the mapping rules.
  *   **Status:** Non-negotiable.

  **6. Distinction from Mere Correlation (Contested)**
  *   **Requirement:** The account must distinguish genetic 'information' from natural signs (e.g., smoke indicating fire). Smoke correlates with fire causally; DNA specifies amino acids normatively (errors are possible).
  *   **Motivation:** The intuition that DNA is a *code* rather than a *cause*. Smoke cannot be 'wrong' about fire; a codon can be 'wrong' (a mutation leading to a non-functional protein).
  *   **Status:** **Prejudicial.** Demanding robust 'semantic normativity' (the possibility of error) is where the 'Coder' argument gains its foothold. A deflationary account might treat this as merely complex causal specificity. Insisting on full-blown semantics may smuggle in the need for an agent.

  **7. Functional Specificity (Non-negotiable)**
  *   **Requirement:** The account must explain why specific sequences yield specific functional outcomes, distinguishing coding regions from regulatory or junk DNA.
  *   **Motivation:** Regulatory stretches vs. coding stretches. Not all DNA 'says' something in the same way. The theory must differentiate instruction from regulation.
  *   **Status:** Non-negotiable.

  ---

  ### The Unsatisfiable Core

  There is a tension, if not a flat contradiction, between three commonly held intuitions. You cannot hold all three simultaneously:

  1.  **Strong Arbitrariness:** The mapping between codon and amino acid is as arbitrary as ASCII (no chemical affinity determines it).
  2.  **Naturalistic Origin:** The system arose via blind variation and selection without prior intent.
  3.  **Semantic Realism:** The 'meaning' of the code is ontologically robust (not just a metaphor).

  **The Conflict:** If the mapping is **Strongly Arbitrary** (1), it resembles human language, which supports the inference to a **Coder**. However, human arbitrary codes are *stipulated* by agents. To explain (1) via (2) is difficult: how does a blind process lock in an arbitrary convention without a pre-existing decoder? If you prioritise (2) and (1), you often have to deflate (3) to mere correlation, which undermines the 'Code' analogy. If you prioritise (3) and (1), you are pushed towards Intelligent Design.

  An adequate theory must dissolve this by showing that the arbitrariness is not *absolute* but *historical*: it was arbitrary at the point of crystallisation, but is now physically constrained by the machinery. The 'Code' is not a pre-existing language the cell speaks; it is a mechanism the cell *is*.

  ---

  ### The Exclusionary Requirement

  The single requirement that does the most work to exclude the 'Coder' argument is **Decoder Relativity (2)**.

  Popular 'Code' arguments (both ID and naive reductionist) treat the DNA as a message in a bottle, existing independently of the reader. They assume the information is *in* the sequence, waiting to be interpreted. **Decoder Relativity** forces the admission that the 'code' is a property of the *system* (DNA + Ribosome + tRNA + Synthetases).

  *   **Why it excludes the 'Coder':** If the code is a relationship internal to the cell's machinery, it does not require an external agent to stipulate it, any more than a lock-and-key mechanism requires a linguist. The 'mapping' is physically embodied in the synthetases.
  *   **Who sails through:** The 'DNA as Blueprint' view sails through only because it ignores this requirement, treating the genome as a standalone document rather than one half of a mechanical coupling.

  ---

  ### Scorecard: Three Rough Pictures

  **1. The Causal-Dispositional Account (Smoke/Fire)**
  *   *Verdict:* **Fails.**
  *   *Reasoning:* It satisfies Physical Grounding but collapses on Synonymy and Functional Specificity. It cannot explain why different codons mean the 'same' thing, nor can it account for the possibility of 'error' (a mutation). It reduces information to mere correlation, failing to capture the systematic mapping that makes the code transposable.

  **2. The Arbitrary Mapping Account (No Intent)**
  *   *Verdict:* **Partial Success / High Tension.**
  *   *Reasoning:* It handles Transposability and Degeneracy well, treating the code as a formal mapping. However, it struggles with Physical Grounding and Historical Contingency. It risks positing the 'code' as an abstract object that the cell somehow accesses, rather than a physical mechanism. It often smuggles in Semantic Realism without explaining how normativity arises without selection.

  **3. The Teleosemantic Account (Selected Effect)**
  *   *Verdict:* **Best Fit.**
  *   *Reasoning:* It satisfies Decoder Relativity and Distinction from Correlation by grounding 'meaning' in evolutionary history (what the sequence was selected to do). It explains error (failure to perform selected function) and Stability (selection against change). Its weakness lies in the 'First Code' problem (how can the first code have a selected function?), but it avoids the need for an external Coder by locating normativity in natural selection.
