answer: |-
  **Title:** The Hidden Welfare of Resources: Adaptive Preferences and the Instability of the Envy Test

  **Introduction**

  Ronald Dworkin's theory of equality of resources stands as the most sophisticated attempt to navigate the Scylla of welfare egalitarianism and the Charybdis of strict material distribution. By anchoring equality in an auction model operationalized by the envy test, Dworkin aims to satisfy two competing intuitions: that individuals should be compensated for unchosen disadvantages (endowment-insensitivity) and held responsible for their chosen life plans (ambition-sensitivity). The central promise of this framework is that it avoids the paternalism of welfare metrics while correcting the blindness of strict resource metrics to human diversity. However, this promise relies on the stability of the distinction between the person (their ambitions and tastes) and their circumstances (their endowments and resources).

  This essay argues that Dworkin's equality of resources, specifically as operationalized by the envy test, is internally unstable when confronted with the symmetry between cultivated expensive tastes and adaptive cheap tastes. When we compare a connoisseur who has deliberately cultivated expensive preferences against a deprived individual whose preferences have contracted due to scarcity, the envy test yields identical verdicts: neither is owed compensation. To distinguish these cases—as justice intuitively requires—the resourcist must appeal to the history of preference formation. Yet, in doing so, the theory is forced to rely on a welfare-based diagnosis to identify which resource deficits matter. Consequently, the envy test's apparent neutrality between cheap and expensive tastes holds only so long as we ignore cases where the cheapness of taste is itself the injury. In attempting to remedy this, equality of resources covertly performs the welfare judgments it officially disavows.

  **The Apparatus: Envy, Resources, and Responsibility**

  To understand the instability, we must first precis Dworkin's apparatus. Equality of resources is defined by the envy test: a distribution is equal when no one prefers another's bundle of resources to their own. This test is designed to respect individual sovereignty; if I have resources adequate to my own plans, I cannot claim injustice simply because your resources satisfy your different plans more easily. This protects ambition-sensitivity. If I choose a life of leisure over labor, or wine over beer, I bear the cost of that choice.

  Dworkin distinguishes between personal resources (internal capacities, health, talents) and impersonal resources (transferable wealth, property). While the envy test applies directly to impersonal resources in the auction model, Dworkin extends the logic to personal resources via a hypothetical insurance market. The crucial division, however, lies between *circumstances* (for which I am not responsible) and *ambitions* (for which I am). Expensive tastes are typically categorized under ambitions. If I require champagne to be as happy as you are with beer, Dworkin argues I am not entitled to compensation, provided these tastes are part of my personality rather than a handicap. The theory posits that welfare is the *result* of the interaction between resources and personality; justice regulates the resources, not the result. Therefore, the envy test looks at the bundle held and the preferences currently possessed. It is structurally ahistorical regarding the preference itself, focusing on whether the current bundle satisfies the current preference structure relative to others.

  **The Symmetry of Cases**

  The instability emerges when we examine the genealogy of preferences. Consider two agents. The first is the Connoisseur. As a young adult, she preferred cheap, sweet wine. Over years, at significant cost in money, time, and effort, she deliberately retrained her palate. Her taste for first-growth Bordeaux is an achievement, a cultivated aspect of her personality. Under the envy test, she looks at her bundle of resources and the bundles of others. She does not envy others' bundles; she merely wishes her money went further given her specific, chosen projects. Dworkin's verdict is clear: she receives no compensation. Her expensive taste is ambition-sensitive. To compensate her would be to subsidize her lifestyle choices at the expense of those with cheaper tastes, violating the ambition-sensitivity principle.

  Consider now the second agent, the Adapted Deprived. She has lived her life in grinding scarcity. As Amartya Sen describes in the context of adaptive preferences, she has adjusted her expectations downward to avoid the pain of constant frustration. She is content with very little. She does not envy the Connoisseur's bundle; her horizon has contracted to fit her circumstances. She reports high satisfaction with a meager resource share. Under the strict application of the envy test, she also receives no compensation. She does not envy anyone else's bundle; her preferences are satisfied by her current holdings.

  Here lies the symmetry that threatens the theory. Both agents have preferences that match their resources. Both pass the envy test. Yet, our normative intuitions scream that these cases are fundamentally different. The Connoisseur's situation is a matter of luxury; the Adapted Deprived's situation is a matter of injustice. The Deprived woman is not truly equal; she is diminished. Her contentment is not a sign of justice achieved, but of agency crushed. If equality of resources cannot distinguish between the satisfaction of cultivated refinement and the satisfaction of learned helplessness, it fails to capture the egalitarian impulse. It treats the absence of envy as sufficient for equality, ignoring that the absence of envy can be produced by oppression.

  **The Resourcist Reply: Impersonal Resource Deficits**

  A sophisticated proponent of equality of resources will not accept this verdict. Dworkin himself acknowledges the problem of adaptive preferences. The standard resourcist reply is to shift the locus of the injustice from the preference (welfare) to the history of the resource acquisition (circumstance). The argument runs as follows: The Adapted Deprived woman's preferences are not merely "hers" in the ambition-sensitive sense. They are the causal product of a deficit in her impersonal resources during her formative years. She lacked access to education, cultural exposure, and social security. These are impersonal resources that were unequally distributed.

  Therefore, the resourcist argues, we do not need to compensate her for her *welfare* deficit (her low expectations). We compensate her for the *resource* deficit (the poor upbringing) that caused the preference deformation. This preserves the ambition-sensitivity/endowment-insensitivity slogan. We are still tracking resources, not welfare. We are simply taking a longer temporal view of the resource distribution. If she had been given an equal share of impersonal resources (including social bases of self-respect and education) ex ante, her preferences would not have adapted downward. Thus, the injustice is identified as a resource inequality, and the remedy is a resource transfer. This seems to solve the problem without invoking a metric of welfare. The envy test is supplemented by a historical audit of resource distribution, but the currency of justice remains resources.

  **The Critique: Welfare Diagnosing Resource Deficits**

  However, this reply conceals a deeper concession. While it frames the remedy in terms of resources, it relies on a welfare-based diagnosis to identify *which* resource deficits count as injustices. To see this, we must ask: How does the theorist know that the Adapted Deprived woman's upbringing constituted a resource deficit relevant to equality?

  Imagine a different case. Suppose a woman grows up in a monastic community that deliberately limits exposure to secular goods to foster spiritual focus. She emerges with "cheap" tastes and no desire for material wealth. She, too, lacks certain impersonal resources (exposure to consumer culture, secular education). Yet, we would not typically view her as a victim of resource inequality requiring compensation. Why is the scarcity-induced adaptation an injustice warranting compensation, while the monastic adaptation is not? Both involve a causal link between resource environment and preference formation.

  The resourcist can only distinguish these cases by looking at the *outcome* of the preference formation. We judge the scarcity-induced adaptation as a deficit because we judge the resulting preference structure as *diminished* or *deformed*. We must implicitly employ a welfare or capability metric to determine that her adaptation was a "crippling" rather than a "cultivation." We need to know that she is worse off in terms of functioning or well-being to identify her upbringing as a resource deficit that violates equality.

  This reverses the explanatory priority of Dworkin's theory. Equality of resources claims that resources are the metric of justice, and welfare is the private responsibility of the agent. But in the case of adaptive preferences, we cannot identify the resource inequality without first identifying a welfare inequality. We do not know her resources were insufficient until we see that her welfare-generating capacity was stunted. The resource deficit is not self-identifying; it is identified by the shadow it casts on the agent's flourishing.

  Consequently, when the resourcist compensates the Adapted Deprived woman, they are not merely correcting a ledger of material goods. They are making a judgment that her current preference structure is not authentically hers, but a symptom of deprivation. This is a counterfactual judgment about what she *would* have wanted under "decent" conditions. But what counts as "decent"? It cannot be defined solely by resource levels, because resources are only "decent" insofar as they support a non-deformed agency. Thus, the standard for a "normal" or "just" preference formation is implicitly welfare-laden. The theory smuggles in a conception of human flourishing to determine which resource distributions count as equal.

  **The Instability of the Envy Test**

  This leads to the core instability of the envy test. The test is designed to be neutral between different conceptions of the good. It asks: "Given what you want, do you have enough?" It refuses to ask: "Should you want this?" In the case of the Connoisseur, this refusal is a virtue; it prevents paternalism. In the case of the Adapted Deprived, this refusal is a vice; it enables oppression.

  To fix the vice, Dworkin must allow the theory to ask, "How did you come to want this?" But once the theory asks that question, it must distinguish between legitimate preference formation (ambition) and illegitimate preference deformation (adaptation). As argued above, making that distinction requires a benchmark of human welfare or capability. If the theory admits this benchmark, it ceases to be purely resourcist. It becomes a hybrid where resources are the *means* of distribution, but welfare/capability is the *metric* of assessment.

  This does not necessarily destroy the value of resource equality, but it undermines the claim that the envy test is a self-sufficient operational tool. The envy test works only against a background of "normal" preference formation. When preference formation itself is the site of inequality, the envy test is blind. It sees two satisfied agents and declares justice done. To see the injustice, we must look through the resource lens with welfare-tinted glasses. We must say that the Adapted Deprived woman is entitled to more resources *because* her welfare potential has been suppressed, not simply because her resource ledger is light.

  **Conclusion**

  The debate over "equality of what?" often stalls on the distinction between resources and welfare. Dworkin's equality of resources attempts to dissolve this dichotomy by making welfare the responsibility of the agent and resources the responsibility of society. However, the symmetry between the Connoisseur and the Adapted Deprived reveals that this division is porous. When cheap tastes are the result of deprivation rather than choice, the resource theorist is compelled to compensate. But to justify that compensation without violating ambition-sensitivity, they must trace the tastes back to resource deficits. In doing so, they inevitably rely on a prior judgment that the agent's welfare or agency has been diminished.

  Thus, the envy test is unstable. It cannot maintain its neutrality between cheap and expensive tastes when the cheapness of taste is itself the injury. To distinguish the victim of scarcity from the victim of their own refinement, equality of resources must covertly perform the welfare judgments it officially disavows. It turns out that we cannot fully assess the equality of resources without some account of the equality of human functioning. The resource metric, therefore, is not a substitute for welfare considerations, but a mechanism that depends upon them for its own moral orientation. In the end, the "equality of what" question cannot be answered by resources alone, because knowing what counts as a resource deficit requires knowing what counts as a human life lived well.
