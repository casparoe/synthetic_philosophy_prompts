prompt: |-
  I sit on a five-person conduct panel at a small college that hears cases of student misconduct toward staff. Last month's case involved a student accused of a pattern of demeaning remarks to a teaching assistant. I missed the live hearing because of jury duty, so my only materials were the transcript and the written exhibits, plus a summary of the panel's in-person impressions. Reading the transcript, the student's answers seem defensive but plausibly sincere; the apology reads as awkward rather than rehearsed. The two panel members who attended tell a different story: they describe his tone as smirking and contemptuous, his apology as visibly performed, and they say that anyone in the room would have concluded the conduct was knowingly cruel rather than careless. They're not guessing; they were there, and they're people whose judgment on character I've trusted for years. I have to submit a written finding by Friday, and as it stands I'd land on the milder characterization while they would land on the harsher one.

  A senior colleague on the panel has been pressing me to resolve this the simple way: you weren't there, they were; taking a witness's word for what happened is exactly what panels are for, and a transcript is a poor substitute for a room. That sounds right when I think of it as a factual report — of course I should believe them about what they saw. But it feels different when what I'd be taking their word for is the verdict itself: that the behavior was cruel on purpose, which is the finding that determines the sanction. If I simply adopt their conclusion, my name goes on a judgment I didn't make, and I can't shake the thought that if this were acceptable, the college could save money by holding hearings before a single member and letting the rest of us sign whatever that member felt. On the other hand, if I vote on the transcript alone, I'm in effect claiming that the pages I read contain everything relevant, when I know perfectly well they don't — tone, timing, and how a remark landed on its recipient largely died with the room.

  So my questions, before Friday: Should I vote my own reading of the transcript, defer to the members who were present, or is there a better third option — and if so, what does it look like in practice? More generally, what distinguishes the cases where it's perfectly fine to let someone else's word settle how things stand, even when what's settled is partly an evaluation, from the cases where doing that seems to short-circuit something I'm supposed to be doing myself? I'd especially like help on where that line falls and why, since my instinct says the line exists but I can't articulate the principle behind it.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Dilemma:**
      *   **Role:** Member of a 5-person conduct panel at a small college.
      *   **Case:** Student misconduct (demeaning remarks to a TA).
      *   **Constraint:** User missed the live hearing (jury duty). Only has transcript, exhibits, and summary.
      *   **Conflict:**
          *   *User's reading of transcript:* Defensive but sincere, awkward apology, suggests carelessness rather than malice.
          *   *Colleagues' reading (2 present members):* Smirking, contemptuous, performed apology, knowingly cruel.
          *   *Senior Colleague's Advice:* Defer to those present ("you weren't there, they were").
          *   *User's Intuition:* Deferring feels like abdicating responsibility ("rubber stamping"). Voting on transcript alone ignores crucial non-verbal data.
      *   **Deadline:** Friday.
      *   **Core Questions:**
          1.  What should I do in this specific case? (Vote transcript, defer, or third option?)
          2.  What is the general principle distinguishing when deference is okay vs. when it's inappropriate?

  2.  **Deconstruct the Ethical and Procedural Issues:**
      *   **Due Process/Fairness:** The student is entitled to a fair judgment by the *panel*, not just a subset. If one member votes based on incomplete information, does that undermine the panel's integrity?
      *   **Epistemic Authority:** Who knows the "truth"? The transcript captures words, but not tone/body language. The present members capture the "vibe," but are subject to bias/interpretation.
      *   **Responsibility:** A panel vote is a personal attestation. "I find X" means "I am convinced of X." If I'm not convinced, can I say I am?
      *   **Precedent:** If the user defers now, does it set a standard where absent members are expected to always defer? (The senior colleague's "save money" argument highlights this risk).

  3.  **Evaluate the Options:**
      *   *Option A: Vote based on transcript alone.*
          *   Pros: Maintains personal integrity of judgment.
          *   Cons: Ignores critical evidence (tone/demeanor) that the other members witnessed. Might lead to a "not guilty" or "lesser charge" verdict that the majority (who saw the smirk) knows is wrong.
      *   *Option B: Defer completely to present members.*
          *   Pros: Acknowledges their superior access to evidence.
          *   Cons: Abdicates judicial responsibility. Turns the user into a proxy. Risks the "rubber stamp" problem.
      *   *Option C: The "Third Option" (Deliberative Deference / Weighted Judgment).*
          *   Acknowledge the limitation.
          *   Treat the colleagues' testimony *as evidence* rather than as a verdict.
          *   Weigh their observation of demeanor against the transcript's content.
          *   Vote based on the *totality* of the record (transcript + credible witness testimony about demeanor).

  4.  **Develop the "Third Option" (Practical Solution):**
      *   The user shouldn't just say "I agree because you were there."
      *   The user should say: "Based on the transcript, I had doubt. However, the credible testimony of two panelists regarding the respondent's demeanor resolves that doubt."
      *   This preserves the user's agency. They are making a judgment *about the weight of the colleagues' observations*, not just adopting their conclusion.
      *   *Crucial Step:* Can the user ask for more clarification? Can the present members elaborate on specific moments in the transcript where the smirk occurred? This bridges the gap between text and memory.

  5.  **Address the General Principle (The "Line"):**
      *   When is deference okay? When the other person has access to *data* you don't (observational facts), and you trust their *reporting* of that data.
      *   When is deference NOT okay? When the other person is asking you to adopt their *evaluation* or *conclusion* without engaging with the reasoning.
      *   *Distinction:* Fact vs. Judgment.
          *   Fact: "He smirked." (Deference is reasonable if they are credible).
          *   Judgment: "Therefore he is cruel." (This requires your own synthesis).
      *   *The Principle:* **Epistemic Dependence vs. Moral Agency.** You can depend on others for facts (observations), but you cannot outsource the synthesis of those facts into a verdict.
      *   *Procedural Integrity:* A panel vote implies independent consideration. If you cannot independently consider the evidence, you should arguably recuse yourself (but that's too late now). Since you are there, you must process the *report* of the evidence.

  6.  **Drafting the Response:**
      *   **Empathy/Validation:** Acknowledge the difficulty. This is a classic tension in collaborative judgment.
      *   **Specific Advice (The Case):**
          *   Don't just sign. Don't just ignore them.
          *   Treat the colleagues' account as *testimonial evidence*.
          *   Ask for specific linkage (Where in the transcript did the smirk happen?).
          *   Frame the finding as: "While the text is ambiguous, the corroborated observation of demeanor tips the scale."
      *   **General Principle:**
          *   Distinguish between *Observation* (privileged access) and *Inference* (shared reasoning).
          *   The "Rubber Stamp" Test: Could you explain your reasoning to the accused without saying "Because Bob said so"?
          *   The "Recusal" Standard: If the gap is too wide to bridge, you shouldn't vote at all.
      *   **Procedural Recommendation:** Suggest a future policy for absent members (e.g., video recording, or rule that absent members cannot vote on credibility issues).

  7.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is it fair to vote if I wasn't there?* Ideally, no. But the user is already in this position. The advice must be pragmatic for *this* Friday deadline.
      *   *The Senior Colleague's point:* They are right that a transcript is cold. But they are wrong that "deference" is the only mechanism. The mechanism is "weighing testimony."
      *   *The Risk:* If the user votes "guilty" based on colleagues' words, and later it comes out the colleagues were biased, the user is still responsible. Hence, the need to document *why* the colleagues' account was persuasive (credibility, consistency, specificity).

  8.  **Final Polish:**
      *   Structure: Immediate practical steps -> The underlying principle -> Future policy.
      *   Tone: Professional, ethical, supportive, analytical.
      *   Key phrase to include: "Testimonial weight vs. Verdict outsourcing."

  9.  (Final check against user prompt): Did I answer both questions? Yes (Specific case advice + General principle). Did I address the "line"? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't advise the user to violate confidentiality or procedural rules by having ex parte communications. The deliberation *is* the place to discuss this. I should emphasize using the *deliberation session* to ask questions.

  10. **Finalizing the advice:**
      *   Step 1: Use deliberation to query the specific observations.
      *   Step 2: Vote based on the *combined* record (text + trusted testimony).
      *   Step 3: Articulate the distinction between relying on data vs. relying on conclusions.

