  ## V. Debrief Guide (40 Minutes)

  **1. Mapping the PMI (10 mins)**
  *   **The Ledger is History:** Point to the board. "Look at the 'Empirical Success' column. Every single one of these theories was the *best explanation of the available data* at its time. They earned their Cred."
  *   **The Induction:** "If T1, T2, T3, T4 were all successful but false, what is the probability that T5 (Field Geometry) is true?"
  *   **The Meta:** "Notice you didn't choose T4 in Gen 4 because you were stupid. You chose it because it was *rationally compelled* by the data. The PMI argues that rational compulsion isn't enough to guarantee truth."

  **2. Realist Replies (15 mins)**
  *   **No Miracles Argument:** "Some of you defended T4 in Gen 4. You said, 'It works too well to be wrong.' Does the Ledger defeat this? Or does the fact that T4 *earned points* mean it captured *some* truth?"
  *   **Selective Realism (The Survival Test):** "Look at the Core Postulates. T1 said 'Order exists.' T2 said 'Force diminishes with distance.' T6 says 'Order exists' and 'Force diminishes.' Did *everything* get overturned? Or just the mechanisms?"
      *   *Prompt:* "If only the *structure* survives, are we realists about the structure?"
  *   **Discontinuity:** "Is T6 different in *kind* from T1? T1 was mechanical. T6 is mathematical. Does the change in methodology break the induction?"

  **3. The Seal & Rationality (15 mins)**
  *   **The Hesitation:** "Who bought the Seal? Why? Who refused? Why?"
  *   **The Epistemic Gamble:** "Buying the Seal was a bet that *we are the last generation.* What evidence did you have for that? None. You only had the Ledger."
  *   **Conclusion:** "The PMI doesn't say science fails. It says *confidence* in final truth is unjustified. You can use T6, but can you claim it is The Truth?"

