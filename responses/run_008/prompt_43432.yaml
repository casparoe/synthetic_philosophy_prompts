  ## VI. Candid Reflections

  ### 1. What Will Predictably Go Wrong
  *   **The "Gotcha" Effect:** By Generation 3, sharp students will realize the pattern ("Every winner loses"). They will stop betting or refuse to endorse *any* theory to avoid the "False" mark.
      *   *Fix:* In Gen 1 and 2, emphasize that "False" just means "Superseded," not "Useless." If they go on strike, remind them that *not choosing* is also a choice with opportunity costs (0 Cred).
  *   **Gaming the Points:** Students may treat Cred as a score to maximize rather than epistemic commitment. They might hedge bets 50/50.
      *   *Fix:* Enforce the "Epistemic Virtue" framing. "You cannot publish a paper saying '50% T1, 50% T2'. Commit." Limit hedging to max 2 theories.
  *   **The Gen 4 Tie:** If the debate in Gen 4 tilts too heavily to T5 (Curvature), the PMI loses its sting. The "Winning" theory *must* be the one that gets overturned later.
      *   *Fix:* As Instructor, rig the "Instrument Card" discussion. If they pick T5 in Gen 4, reveal an Instrument that kills T5 immediately. You need T4 to win Gen 4 so it can be the victim in Gen 5. (Be transparent about this intervention if caught: "History is contingent; I am ensuring the historical record matches the lesson.")
  *   **Seal Apathy:** If they have low Cred left, they won't buy the Seal.
      *   *Fix:* Ensure payout rates are generous in Gens 1-3 so they have capital to risk in Gen 5.

  ### 2. Structural Distortions (What the Simulation Cannot Do)
  *   **The Completed Ledger:** In the simulation, students see the *entire* history of false theories from a God's-eye view. Real scientists only see the past, not the future falsifications.
      *   *Discussion Point:* "In the room, you know T4 is false because I told you. In reality, T4 scientists thought they were in Gen 4, not Gen 5. How does *uncertainty about which generation we are in* change the argument?"
  *   **Clean Falsification:** In the sim, theories die instantly (Instrument Card). In reality, theories linger, get patched, and fade slowly (Lakatosian research programmes).
      *   *Discussion Point:* "T1 wasn't really 'false' the moment the Comet appeared; it was patched. Does the PMI apply to the *hard core* or the *protective belt*?"
  *   **Convergence:** The simulation implies we are just cycling through errors. It doesn't show *convergence toward truth* (e.g., predictions getting more precise).
      *   *Discussion Point:* "T6 predicts data T1 couldn't even conceive. Doesn't that progress count for something, even if T6 is eventually false?"
  *   **The "Final" Theory:** The simulation ends with Gen 6 killing T6. This suggests an infinite regress. Realists argue there might be a limit to approximation.
      *   *Discussion Point:* "Is it possible the sequence stops? Or is the PMI a proof that it never stops?"

  ### 3. Instructor Note on the "Seal"
  Do not pay out the Seal bonus. If a team buys it, and you reveal Gen 6, they lose. If you pay them, you validate Realism. If you don't, you validate PMI.
  *   **Recommendation:** Do not pay. Reveal Gen 6. Let them lose the Cred. Then, in the debrief, ask: "Was it irrational to buy the Seal? Or was it a necessary act of faith to do science at all?" This captures the tension between *philosophical skepticism* and *scientific practice*.
