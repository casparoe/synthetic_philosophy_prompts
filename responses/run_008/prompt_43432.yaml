          *   "New Instrument" reveals anomalies for previous winners.
          *   Public Ledger of retired theories.
          *   Final Generation Option: "Seal of Permanence" (high cost, high reward if not overturned).
          *   Detailed rules, materials, payoff scheme, timing.
          *   Debrief mapping simulation to PMI, Realist replies (No Miracles, Selective Realism, Discontinuity).
          *   Candid sections: Predictable failures & Structural distortions/limitations.
