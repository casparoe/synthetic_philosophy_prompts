answer: |-
  # Simulation: The Astral Wind Inquiry
  **Topic:** The Mechanism of Planetary Motion (Fictionalized)
  **Time:** 120 Minutes
  **Students:** 14 (4 Teams of 3–4)
  **Goal:** Experience the Pessimistic Meta-Induction (PMI) by building a ledger of successful-but-false theories.

  ---

  ## I. Preparation & Materials

  **Room Setup:**
  *   Four tables arranged in a square or cluster.
  *   Whiteboard at the front labeled **"THE LEDGER OF RETIRED THEORIES."**
  *   Columns on Ledger: *Theory Name | Generation | Core Postulate | Empirical Success? | Final Status.*

  **Currency:**
  *   **"Cred" Tokens:** Use poker chips, printed slips, or just a tally sheet.
  *   **Start:** Each team begins with **100 Cred**.
  *   **Meaning:** Cred represents *Epistemic Capital*. High Cred means your team is a reliable judge of truth.

  **Handouts (Per Team):**
  *   **Rule Sheet** (Summary of betting and scoring).
  *   **Generation Packets (1–5):** Sealed envelopes labeled "Gen 1," "Gen 2," etc.
  *   **Theory Cards:** Distinct cards describing the rival theories available in that generation.
  *   **Instrument Cards:** Kept by the Instructor. Revealed *after* betting closes for each generation.

  ---

  ## II. Rules of Inquiry

  1.  **The Goal:** Maximize your team's Cred by backing theories that fit the data.
  2.  **The Process:**
      *   Open the Generation Packet. Read the **Data Cards** (observations) and **Theory Cards** (explanations).
      *   Discuss which theory best explains the data using standard virtues: *Fit, Unification, Fecundity.*
      *   **Place Bets:** Allocate up to 50 Cred to the theory you endorse. (You may hedge, but splitting reduces potential gain).
      *   **Instructor Review:** The Instructor reveals the **Instrument Card** (a new measurement).
      *   **Scoring:**
          *   If your theory fits the Data *and* survives the Instrument check: **2x Payout** on your bet.
          *   If your theory fits Data but fails Instrument check: **0 Payout**. (The theory is retired to the Ledger).
          *   If your theory fits neither: **Loss of Bet**.
      *   **Ledger Update:** Any theory that wins a generation but fails a subsequent Instrument check is written on the Whiteboard as *Retired (False)*.
  3.  **Generation 5 Special Rule (The Seal):**
      *   The winning theory of Gen 5 may purchase a **"Seal of Permanence."**
      *   **Cost:** 50 Cred.
      *   **Reward:** 150 Cred *if* the theory is declared "Ultimately True."
      *   **Risk:** If the theory is later overturned, the 50 Cred is lost *and* the team suffers a "Dogmatism Penalty" (-50 Cred).

  ---

  ## III. The Generations (Instructor Script & Cards)

  *Note: The fiction is "Astral Wind"—what moves the planets? Keep the physics intuitive.*

  ### Generation 1: The Observation of Order
  **Context:** Ancient era. Naked eye observation.
  **Data Cards:**
  1.  Planets move across the sky in regular loops.
  2.  Planets never crash into each other.
  3.  Heavier planets (visually larger) move slower.
  **Theory Cards:**
  *   **T1: Crystal Spheres.** Planets are embedded in invisible rotating glass shells. (Explains regularity & non-crashing).
  *   **T2: Animal Spirits.** Planets are living beings swimming through the void. (Explains regularity, but implies they could get tired).
  **Task:** Choose T1 or T2. Bet Cred.
  **Instructor Reveal (Instrument 1):** *The Great Comet.* A comet passes *through* the region where T1's glass spheres should be.
  **Resolution:**
  *   **T2 (Spirits)** fits data but is untestable.
  *   **T1 (Spheres)** fits data perfectly *except* for the Comet.
  *   **Twist:** For Gen 1, allow **T1 to Win**. Rationale: The Comet is rare; Spheres explain the *laws* of motion better. Spirits are too vague.
  *   **Action:** T1 teams get 2x payout. T1 is the "Incumbent" for Gen 2.
  *   **Ledger:** (Leave blank for now. T1 is currently King).

  ### Generation 2: The Vacuum Test
  **Context:** Invention of the Pressure Tube.
  **Data Cards:**
  1.  (Previous Data holds).
  2.  New: In a vacuum chamber, objects fall at the same rate regardless of weight.
  3.  New: Planets speed up when closer to the Sun.
  **Theory Cards:**
  *   **T1 (Incumbent): Crystal Spheres.** (Must explain speed-up via varying sphere thickness).
  *   **T3: Fluid Current.** Space is filled with a river-like wind pushing planets. Closer to Sun = Faster Current.
  **Task:** Stick with T1 or Switch to T3. Bet Cred.
  **Instructor Reveal (Instrument 2):** *The Friction Gauge.* If T3 is true, planets should lose energy to fluid friction and spiral inward. They do not.
  **Resolution:**
  *   **T1** cannot explain speed-up without ad-hoc fixes.
  *   **T3** explains speed-up but fails Friction Gauge.
  *   **Decision:** **T3 Wins.** Why? T1 is rigid. T3 is mathematically flexible. The Friction problem is noted as a "puzzle for later."
  *   **Action:** T3 teams get 2x payout. **T1 is Retired.**
  *   **Ledger Entry 1:** *Crystal Spheres | Gen 1 | Rigid Shells | Yes | FALSE (Comets pass through).*

  ### Generation 3: The Distance Law
  **Context:** Invention of the Parallax Ruler.
  **Data Cards:**
  1.  (Previous Data holds).
  2.  New: Force diminishes exactly by the square of the distance.
  3.  New: Moons orbit planets, planets orbit Sun (Universal Center).
  **Theory Cards:**
  *   **T3 (Incumbent): Fluid Current.** (Must explain Inverse Square via fluid density).
  *   **T4: Action at a Distance.** An invisible ray pulls planets. No medium required.
  **Task:** Stick with T3 or Switch to T4. Bet Cred.
  **Instructor Reveal (Instrument 3):** *The Ether Drag.* If T4 is true, light speed should vary by direction. It does not (Michelson-Morley proxy). Wait, that's too real.
  *Correction for Fiction:* **Instrument 3:** *The Vacuum Seal.* We can pump out the "Fluid." Planets still move.
  **Resolution:**
  *   **T3** is falsified. No fluid = no motion.
  *   **T4** survives.
  *   **Decision:** **T4 Wins.**
  *   **Action:** T4 teams get 2x payout. **T3 is Retired.**
  *   **Ledger Entry 2:** *Fluid Current | Gen 2 | Material Push | Yes | FALSE (Vacuum doesn't stop motion).*

  ### Generation 4: The Hard Tie (The Crux)
  **Context:** Precision Astrometry.
  **Data Cards:**
  1.  (Previous Data holds).
  2.  New: Mercury's orbit shifts slightly over centuries (Precession).
  3.  New: Light bends near massive objects.
  **Theory Cards:**
  *   **T4 (Incumbent): Action at a Distance.** (Newtonian-style).
  *   **T5: Geometric Curvature.** Space itself is curved; planets follow straight lines in curved space.
  **Task:** Choose. Bet Cred.
  **Instructor Note:** This must feel like a genuine dilemma.
  *   **T4 Argument:** Simpler. Works for 99% of cases. T5 is weird metaphysics.
  *   **T5 Argument:** Explains Light Bending naturally. T4 requires "force on massless light?"
  **Resolution:**
  *   **T4 Wins.** (Crucial for PMI). Rationale: T4 is the workhorse. T5 is speculative geometry. The Mercury shift is small; T4 can be patched.
  *   **Action:** T4 teams get 2x payout. **T4 is Retired (in Gen 5).**
  *   **Ledger Entry 3:** *Action at a Distance | Gen 3 | Invisible Ray | Yes | FALSE (See Gen 5).*
  *   *Wait, we reveal T4's failure in Gen 5. For now, T4 is King.*

  ### Generation 5: The Quantum Scale
  **Context:** Gravitational Wave Detectors.
  **Data Cards:**
  1.  (Previous Data holds).
  2.  New: Gravitational effects propagate at speed of light, not instantly.
  3.  New: At microscopic scales, gravity behaves discretely, not continuously.
  **Theory Cards:**
  *   **T4 (Incumbent): Action at a Distance.** (Instantaneous pull).
  *   **T6: Field Geometry.** Gravity is a field with wave properties and discrete quanta.
  **Task:** Choose. Bet Cred.
  **Instructor Reveal (Instrument 5):** *The Speed Trap.* T4 requires instant action. Data Card 2 says speed of light. T4 is dead.
  **Resolution:**
  *   **T6 Wins.**
  *   **Action:** T6 teams get 2x payout. **T4 is Retired.**
  *   **Ledger Entry 4:** *Action at a Distance | Gen 4 | Invisible Ray | Yes | FALSE (Speed of Gravity).*

  **The Seal Decision:**
  *   Teams now hold T6.
  *   **Offer:** Buy the **Seal of Permanence** for 50 Cred.
  *   **Condition:** You claim T6 is *True*, not just adequate.
  *   **Instructor Action:** Do not reveal the outcome yet. Collect bets. Then reveal **Gen 6 Card**.
  *   **Gen 6 Card (The Sting):** *Dark Energy Expansion.* The universe is accelerating. T6 predicts deceleration. T6 is incomplete/false.
  *   **Payout:** Seal buyers lose their 50 Cred + Penalty. Non-buyers keep their stash.

