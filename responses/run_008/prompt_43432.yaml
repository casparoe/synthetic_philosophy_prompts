  ## IV. The Ledger (Whiteboard Template)

  | Theory | Gen | Core Postulate | Empirical Success? | Final Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **Crystal Spheres** | 1 | Rigid Shells | Yes | **FALSE** |
  | **Fluid Current** | 2 | Material Push | Yes | **FALSE** |
  | **Action at Distance** | 3 & 4 | Invisible Ray | Yes | **FALSE** |
  | **Field Geometry** | 5 | Discrete Field | Yes | **?** |

