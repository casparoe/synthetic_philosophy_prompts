      *Critique:* This looks too much like real history (Newton/Huygens/Einstein). I need to make it more fictional to prevent pattern matching.
      *Revised Topic:* **The Composition of Nebular Gas** (What are the clouds in the sky made of and how do they move?).
      *   *Gen 1:* Observation: Gas glows when heated.
