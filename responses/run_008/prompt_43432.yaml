      *   *Refinement on Scoring:* To make the PMI sting, the theory must be *successful* in its time. So, in Generation $N$, Theory $T_N$ wins the points. In Generation $N+1$, the new instrument shows $T_N$ is false. The students in Gen $N$ *kept* their points, but the *theory* is marked False on the ledger.
      *   *The "Seal":* Gen 5 can bet heavily that $T_5$ is *True* (not just empirically adequate).
