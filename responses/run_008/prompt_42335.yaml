      *   **Chang's Intervention:** Challenges the trichotomy thesis (for any $A, B$, either $A > B$, $B > A$, or $A = B$). Proposes a fourth relation: parity ($A$ || $B$).
      *   **The Small Improvement Argument (SIA):** If $A = B$, then $A+ > B$. If $A$ and $B$ are on a par, it might be that $A+$ is not better than $B$ (or at least not clearly so), suggesting $A$ wasn't equal to $B$ to begin with.
      *   **The Counter (Friend's view):** Parity is just vagueness or epistemic uncertainty. If $A$ and $B$ are vague, $A+$ might still be vague relative to $B$. Or, normatively, if you have no reason to prefer one, you treat them as equal for decision-making.
