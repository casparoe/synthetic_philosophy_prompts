      *   (6) Materialist Rival to Weber: **Accept (compatible).** (Multi-causal, doesn't negate culture but contextualizes it).
      *   (7) Japan Inc. (Corporate Loyalty): **Ambivalent/Skeptical.** (Post-hoc, mutable explanation used for opposite outcomes).

  3.  **Evaluate the User's Hunch:**
      *   *Hunch:* Independent attestation + Specified mechanism.
