      *   **Hard Truths:** Where does the principle force the user to change their mind?
          *   *Weber (1):* The user accepts it, but by modern standards, Weber's evidence is shaky on Independent Attestation (did they *really* work harder, or did they just *say* they did?). The user might need to downgrade (1) from "Accept" to "Methodologically Flawed but Heuristically Useful."
