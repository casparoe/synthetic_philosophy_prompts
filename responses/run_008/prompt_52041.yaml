      *   **Constraint:** The user explicitly asks *not* to be flattered. They want the hunch taken apart, tested honestly, and are willing to give up verdicts if the principle doesn't hold. They want precise formulation, case-by-case testing, and predictions on new cases.
      *   **User's Hunch:** The distinction lies in (a) independent attestation of values (not inferred from the behavior they explain) and (b) specified psychological/institutional mechanisms.
      *   **Tone:** Academic, rigorous, philosophical, self-reflective, slightly skeptical.

  2.  **Deconstruct the User's Cases:**
