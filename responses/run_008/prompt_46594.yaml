      A: This is the classic Titmuss worry: that extrinsic incentives erode intrinsic motivation. Our data suggests otherwise. By segmenting the market, we isolate commercial transactions from altruistic channels. Altruists remain altruists; sellers become sellers. There is no contamination effect. Plus, our "Hybrid Badge" lets commercial sellers display a altruist-adjacent icon on their profile, satisfying the social signaling need without sacrificing revenue.

