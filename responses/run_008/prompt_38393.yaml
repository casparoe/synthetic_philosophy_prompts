answer: |-
  Here is a specification of adequacy for an account of idealization, structured around the six cases you provided. I have distinguished between non-negotiable constraints (failure here renders the account useless for philosophy of science) and camp-specific preferences (failure here renders the account unpopular with specific schools of thought).

  ### The Specification of Adequacy

  **1. The Convergence Constraint (Benign Idealizations)**
  *   **Requirement:** The account must explain why certain false assumptions (frictionless planes, point masses) yield approximately true results, specifically by demonstrating that the model's output is *stable* under small perturbations of the assumption toward reality.
  *   **Case:** Frictionless planes, ideal gases.
  *   **Status:** **Non-negotiable.** Any account that cannot distinguish between a harmless simplification and a fatal error fails the basic test of scientific rationality.
  *   **Rationale:** This captures the intuition that some idealizations are merely "negligibility claims." The account must provide a criterion for when $\lim_{\epsilon \to 0} Model(\epsilon) \approx Reality$.

  **2. The Tractability Constraint (Aggregation/Representative Agents)**
  *   **Requirement:** The account must justify cases where relaxing an idealization degrades predictive or explanatory power, typically due to computational intractability or the loss of emergent macroscopic patterns.
  *   **Case:** Representative agents, identical particles in traffic flow.
  *   **Status:** **Non-negotiable.**
  *   **Rationale:** If an account insists that *all* idealizations must be removable to reveal the "true" model, it condemns vast swathes of successful science (econophysics, macroeconomics, statistical mechanics) as irrational. The account must allow that sometimes the "false" model is epistemically superior to the "true" one.

  **3. The Essentiality Constraint (Constitutive Idealizations)**
  *   **Requirement:** The account must handle cases where the idealization is not an approximation of a real feature, but a mathematical precondition for the phenomenon to exist *in the model*. Relaxing the assumption does not yield an approximation; it yields a category error or a qualitative phase shift.
  *   **Case:** Infinite populations in evolutionary stability, thermodynamic limits.
  *   **Status:** **Non-negotiable.**
  *   **Rationale:** This is the hardest technical hurdle. In these cases, the idealization is not a distortion of reality but a *constitutive* element of the theory's structure. An account that treats all idealizations as "approximations to be corrected" breaks here, because there is no "correct" finite counterpart that preserves the result.

  **4. The Structural Link Constraint (The Levitation Objection)**
  *   **Requirement:** The account must require a non-accidental connection between the idealized assumption and the causal/structural machinery of the target system. Predictive success alone is insufficient; the assumption must not be *arbitrarily* disconnected from the mechanism generating the prediction.
  *   **Case:** Levitating agents yielding correct price predictions.
  *   **Status:** **Non-negotiable.**
  *   **Rationale:** Without this, the account collapses into crude instrumentalism. It must explain why point-masses are acceptable (they capture mass/dynamics) but levitation is not (it violates causal structure), even if both predicted correctly. This distinguishes *modeling* from *curve-fitting*.

  **5. The Typology Constraint (Multiplicity of Roles)**
  *   **Requirement:** The account must distinguish between different functional roles of assumptions: negligibility claims, domain restrictions, and heuristic mathematical scaffolding. It cannot treat all false assumptions as a single homogeneous class.
  *   **Case:** Assumptions that are merely mathematical conveniences vs. those claiming physical absence.
  *   **Status:** **Preference (Realist/Structuralist).**
  *   **Rationale:** An instrumentalist could argue this distinction doesn't matter (only output counts). However, for an account to guide practice or explain scientific progress, it must differentiate between an assumption we *know* is false but useful (heuristic) and one we *hope* is approximately true (negligibility).

  **6. The Explanatory Depth Constraint (Prediction vs. Explanation)**
  *   **Requirement:** The account must specify what idealization does to *explanation*. It must allow that a model can predict well while explaining poorly if the idealizations sever the link to the actual mechanism.
  *   **Case:** Ptolemaic epicycles (predictively adequate, explanatorily bankrupt).
  *   **Status:** **Preference (Realist).**
  *   **Rationale:** Friedman's F-twist explicitly rejects this. If your goal is purely predictive adequacy, you can drop this. If your goal is understanding, it is non-negotiable.

  ---

  ### Joint Unsatisfiability: The Prospective Guidance Trade-off

  There is a tension between **The Convergence Constraint (1)** and **Fidelity to Actual Practice**.

  *   **The Conflict:** Users often demand that an account of idealization provide *prospective guidance* (a rulebook telling the modeler in advance which assumptions are safe to make). However, actual modeling practice (Cases 2 and 3) shows that modelers often discover an idealization is "safe" or "constitutive" only *retrospectively*, by attempting to relax it and seeing if the model collapses or improves.
  *   **The Unsatisfiable Pair:**
      1.  **Universal Prospective Safety:** The account provides a priori criteria to determine if an idealization is harmless before modeling begins.
      2.  **Empirical Fidelity:** The account accurately reflects that the validity of an idealization is often an empirical discovery made *during* the modeling process (e.g., finding that the representative agent model works better than the heterogeneous one).
  *   **Resolution:** You must drop **Universal Prospective Safety**. No philosophical account can guarantee in advance whether an idealization will be benign (Case 1), constitutive (Case 3), or detrimental. The account must be *diagnostic* (evaluating why a model worked) rather than *prescriptive* (dictating what assumptions to make). Demanding a prescriptive rulebook sets the account up to fail against the reality of scientific discovery.

  ---

  ### Scorecard of Contenders

  | Requirement | **F-Twist (Friedman)** | **Galilean (Cartwright/McMullin)** | **Useful Fictions (Vaihinger/Field)** |
  | :--- | :--- | :--- | :--- |
  | **1. Convergence** | **Pass.** (Irrelevant if predictions hold). | **Pass.** (Central to the view). | **Pass.** (Fictions can approximate). |
  | **2. Tractability** | **Pass.** (Explicitly argues false assumptions aid prediction). | **Fail.** (Struggles to justify why "distortion" is better than "truth"). | **Pass.** (Fictions are tools for calculation). |
  | **3. Constitutive** | **Pass.** (Assumptions don't need to map to reality). | **Fail.** (Breaks on infinite limits; assumes concretization is always possible). | **Pass.** (Fictions can be essential to the calculus). |
  | **4. Structural Link** | **Fail.** (Cannot rule out Levitation; prediction is sufficient). | **Pass.** (Requires isolation of causal capacities). | **Mixed.** (Link is pragmatic, not ontological). |
  | **5. Typology** | **Fail.** (Collapses all assumptions into "predictive instruments"). | **Pass.** (Distinguishes idealization from approximation). | **Pass.** (Distinguishes types of fictions). |
  | **6. Explanation** | **Fail.** (Explicitly rejects explanation as a goal). | **Pass.** (Aims at causal understanding). | **Fail.** (Fictions do not explain reality). |

  **Summary:**
  *   **F-Twist:** Survives the hard math cases (2 & 3) but fails the philosophical demarcation (4 & 6). It saves the practice but loses the science.
  *   **Galilean:** Saves the science (1, 4, 6) but struggles with the hard math cases (2 & 3). It cannot easily justify why the "false" representative agent is better than the "true" heterogeneous one.
  *   **Useful Fictions:** Handles the math well (2 & 3) and avoids the Levitation trap via pragmatism, but sacrifices explanatory realism (6).

  ---

  ### The Single Most Exclusionary Requirement

  You suspected **Requirement 3 (Constitutive Idealization)** would be the filter that excludes the most candidates. I disagree.

  The most exclusionary requirement is **Requirement 4 (The Structural Link Constraint)**.

  **Why:**
  1.  **Case 3 (Constitutive)** is technically difficult, but many accounts can survive it by adopting "limiting case" mathematics. They can argue that the infinite model *represents* the finite system in the limit. It is a hurdle, but a surmountable one for both Realists and Instrumentalists.
  2.  **Case 4 (Levitation/Structural Link)** forces a commitment to *how* the model relates to the world that the F-Twist explicitly denies and the Useful Fictions view sidesteps.
      *   To satisfy Req 4, you must claim that assumptions must bear some relationship (isomorphic, causal, or functional) to the *mechanism* producing the phenomenon, not just the output.
      *   This instantly disqualifies the **F-Twist**, which is the subject of your departmental dispute.
      *   It also pressures the **Useful Fictions** view, which struggles to explain why a "fiction" explains anything about the real world without a structural link.
      *   Only a **Structural Realist** or **Mechanist** account comfortably satisfies Req 4.

  If your goal is to adjudicate the Friedman dispute, Requirement 4 is the weapon you need. It concedes that prediction is necessary but demonstrates it is not sufficient, thereby undermining the core of the F-Twist without needing to prove the assumptions are "true" in a literal sense—only that they must be *structurally relevant*.
