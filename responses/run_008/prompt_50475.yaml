  So last weekend I got into it with my friend at a party. I made some offhand comment that a certain historical practice (let's say public executions as entertainment) was wrong, like actually wrong, and she shut me down with "there's no accounting for taste" -- her point being that moral judgements are just tastes, like liking cilantro or hating cilantro, so there's no fact of the matter for me to be right about. I'm pretty sure she's smuggled several different claims into one proverb but I can't untangle them on my own, and she's very smug about it.

  I want you to act as a metaethicist who's also good at talking to normal people. Please actually think before you write -- maybe brainstorm all the ways that proverb could be interpreted, including boring ones, and then organize them. Don't just pick the most interesting reading and run with it.

  Here's the format I need, sections in this order:

  1. "What she was claiming" -- a short paragraph (~100 words) reconstructing the argument my friend was implicitly running, charitably.
  2. "The readings" -- a numbered list laying out the distinct precise theses "there's no accounting for taste" could be expressing, from the totally trivial (e.g., people's tastes vary, or that they're hard to predict) through substantive and defensible ones, to readings that are probably just false. For each reading say whether it's about food-taste specifically or generalizes to morality, and whether it actually supports dismissing my claim about executions being wrong. Roughly 100-150 words per reading, and I'd expect somewhere between four and seven of them.
  3. "Trivial / substantive / false" -- a quick sorting of the readings into those three buckets, maybe a short paragraph each on why the substantive ones are substantive.
  4. "Would any of it shut me down?" -- which reading, if any, my friend would need for her party move to work, and whether she can get there. End with a clear verdict, don't be wishy washy.

  One more thing: I specifically don't want a reading list or citations of papers, I want the actual philosophical content in plain language. And keep in mind that some of these readings might work for tastes like food but break when you extend them to morality -- that tension is exactly what I'm trying to understand. Thanks in advance, this has been bugging me for days.
