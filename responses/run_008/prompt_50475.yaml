answer: |-
  1. "What she was claiming"
  Your friend argues that moral judgments are fundamentally identical to sensory preferences. She implies calling executions "wrong" is no different than calling cilantro "soapy." Her implicit argument is that because sensory tastes are subjective and lack objective truth conditions, moral judgments must share these features. Therefore, there is no fact of the matter for you to be right about. She moves from the observation that people disagree on tastes to the conclusion that no one can be correct about values. She treats the proverb as a philosophical trump card that dissolves objective morality into individual preference without further justification.

  2. "The readings"

  1.  **Descriptive Variation:** This reading says people simply differ in preferences, and there is no further explanation needed. Regarding food, this is empirically true; genetics make cilantro taste like soap to some. Generalized to morality, it suggests moral disagreements are just cultural or psychological differences. However, this does not support dismissing your claim. Disagreement does not entail there is no truth. People disagreed about whether the earth was flat, but there was a fact of the matter. Noting that tastes vary explains why you argue, but it doesn't prove you aren't right about executions being wrong. It is an observation of difference, not a denial of truth.

  2.  **Pragmatic Futility:** This reading interprets the proverb as advice rather than fact: arguing about preferences is a waste of time. For food, this is sound advice; you won't convince someone to like broccoli. If generalized to morality, it suggests moral debate is futile. This partially supports dismissing your claim, but only conversationally. It implies you should stop talking, not that you are incorrect. It shuts down the conversation, not the truth of your statement. Your friend might mean "let's not fight at a party," which is valid social advice, but it doesn't prove moral judgments are merely tastes. It avoids the philosophical question entirely.

  3.  **Simple Subjectivism:** This reading claims that saying "X is wrong" literally means "I dislike X." For food, this is plausible; "This is gross" usually reports a sensation. If generalized to morality, it reduces your claim to a report of your feelings. This would support dismissing your claim because feelings aren't true or false, just authentic or inauthentic. If you say "executions are wrong," you're just saying "I dislike executions." This shuts down your objective claim, but it contradicts how we use moral language. We argue to change minds, not just share feelings. Hiding this theory in a proverb is a heavy lift for such a common phrase.

  4.  **Non-Cognitivism:** This reading says moral statements aren't truth-apt propositions at all; they are emotional expressions, like cheering. For food, "Yum!" isn't true or false. Generalized to morality, "Wrong!" is just a boo-hiss. This supports dismissing your claim strongly because you can't be right about a cheer. However, this is a sophisticated linguistic theory, not a common sense fact. It requires arguing that moral grammar is misleading. Your friend treats this as obvious, but it's a contested philosophical position. If true, you aren't wrong, you're just category-mistaken. But she hasn't earned this conclusion; she's just asserted it via a slogan about food preferences.

  5.  **The False Equivalence:** This reading asserts moral properties are identical to sensory properties. Wrongness is literally a flavor. This works for food; bitterness is a physical property. Generalized to morality, it claims wrongness is a sensory reaction. This is probably false. Moral judgments involve reasoning about harm, rights, and justice, not just sensory input. You can judge something wrong without feeling disgust, and feel disgust at something not wrong. Equating them ignores the cognitive work of ethics. This reading supports her dismissal by collapsing the distinction, but it fails scrutiny. It treats a complex normative judgment as a simple biological reflex, which is philosophically unsustainable.

  3. "Trivial / substantive / false"

  **Trivial:** The Descriptive Variation reading falls here. It is undeniably true that people differ, but it is philosophically lightweight. It explains why disagreement happens but doesn't tell us whether anyone is correct. It cannot support her smug dismissal because variation is compatible with objective truth.

  **Substantive:** Simple Subjectivism and Non-Cognitivism are substantive. They make heavy claims about the nature of reality or language. They deny that moral truth exists or that moral sentences can be true. These require argument, not proverbs. If she meant these, she needs to defend a complex philosophical theory, not just quote a saying about food.

  **False:** The False Equivalence is likely false. It conflates sensory input with normative reasoning. It ignores the role of logic in ethics. Treating moral wrongness as a biological reflex fails to capture how we actually reason about justice. This reading collapses under the weight of basic ethical analysis.

  4. "Would any of it shut me down?"

  For your friend to actually shut you down, she needs one of the substantive readings (Subjectivism or Non-Cognitivism) to be true. She needs to prove that moral claims *cannot* be true, not just that people disagree about them. However, she attempted to smuggle these heavy philosophical theories in using a trivial proverb about food. She hasn't provided the necessary argument to bridge the gap between cilantro and executions.

  **Verdict:** No, she did not shut you down. She asserted a controversial philosophical position as if it were common sense. You are entitled to hold that moral claims are truth-apt until she provides actual arguments, not just a slogan.
