answer: |-
  The single principle you are looking for is **Bayesian Conditional Expectation**.

  The confusion in the two-envelope paradox arises because the standard calculation ($1.25x$) implicitly assumes a specific probability distribution for the money in the envelopes without stating it. Specifically, it assumes that for *any* amount $x$ you hold, it is equally likely that $x$ is the smaller amount or the larger amount.

  Mathematically, let $S$ be the event your envelope is the smaller one, and $L$ be the event it is the larger one. Let $X$ be the value in your envelope. The expected value of the other envelope, $Y$, is:
  $$E[Y|X=x] = P(S|x) \cdot 2x + P(L|x) \cdot \frac{x}{2}$$
  The standard paradox calculation assumes $P(S|x) = P(L|x) = 0.5$ for all $x$. This yields $1.25x$. However, this assumption requires a **uniform prior distribution over all positive real numbers**, which is mathematically impossible (it cannot be normalized to sum to 1).

  Here is how this principle resolves your specific cases, reconciles your conflicting intuitions, and handles the infinite case.

  ### 1. The Unifying Principle
  **You should swap if and only if, conditional on the information you have, the probability that you hold the smaller amount is greater than 1/3.**
  *(Derivation: You gain $x$ if you have the smaller, lose $x/2$ if you have the larger. Expected gain $= x \cdot P(S) - \frac{x}{2} \cdot P(L)$. This is positive if $P(S) > \frac{1}{2}P(L)$, which simplifies to $P(S) > 1/3$.)*

  The "1.25x" argument is only legitimate if your information justifies setting $P(S|x) = 0.5$.

  ### 2. Resolving Your Verdicts

  **Case 1: The Plain Case (Closed Envelopes)**
  *   **Your Verdict:** Don't swap.
  *   **Principle:** **Correct.** Before opening, by symmetry, $E[A] = E[B]$. There is no information to break the symmetry. The calculation $1.25x$ cannot be run "from the other side" simultaneously because $x$ is a random variable, not a fixed constant, until observed. Averaging over all possible $x$, the gains and losses cancel out.

  **Case 2: The Open Case (See $100)**
  *   **Your Verdict:** Feel a pull to swap.
  *   **Principle:** **Partially Correct, but Dangerous.** This is where your intuition needs the most adjustment.
      *   If you see $100, $P(S|100)$ depends entirely on your **prior belief** about how the organizer chooses amounts.
      *   If you believe the organizer is equally likely to pick pairs $(50, 100)$ as $(100, 200)$, then $P(S|100) = 0.5$, and swapping *is* advantageous ($E = 125$).
      *   However, if you believe the organizer is unlikely to put large sums in envelopes, $P(S|100)$ might be low (meaning 100 is likely the *larger* amount), and you should keep.
      *   **The Reconciliation:** Your "pull" to swap comes from implicitly assuming $100 is a "small" number relative to the organizer's budget. If you opened the envelope and found $1,000,000, would you still feel the pull? Probably not.
      *   **Correction:** You should not feel a pull to swap at *pretty much any amount*. You should only feel the pull for amounts that seem "small" relative to your prior expectation of the maximum possible prize. If you would swap regardless of the amount seen, you have fallen back into the paradox.

  **Case 3: The Upper Bound (Max $300, See $250)**
  *   **Your Verdict:** Refuse to swap.
  *   **Principle:** **Correct.** Here, the prior distribution is truncated. If you see $250, the pair cannot be $(250, 500)$. It must be $(125, 250)$. Thus $P(S|250) = 0$. The expected value of the other envelope is $125. Swapping guarantees a loss.

  **Case 4: The Coin Flip Generation (Fixed $100, Coin for Other)**
  *   **Your Verdict:** Swap.
  *   **Principle:** **Correct.** This is not a paradox; it is a defined gamble. The mechanism explicitly sets $P(S|100) = 0.5$. The prior is defined by the procedure, not inferred. The calculation $1.25x$ is valid here because the probability space is well-defined.

  **Case 5: The Infinite Expectation Case**
  *   **Your Verdict:** Uncertain.
  *   **Principle:** **Discard Expected Value.** When the expected value of the envelopes is infinite (e.g., St. Petersburg-style distributions), standard expected utility theory breaks down. You cannot compare $\infty$ to $\infty$.
      *   In many such constructions, the symmetry still holds (swapping doesn't help), but the "1.25x" calculation is meaningless because the sum diverges.
      *   **Advice:** In your column, treat this as a boundary condition where "Expected Value" ceases to be a useful decision metric. You must switch to bounded utility or median outcomes.

  ### 3. Which Verdicts to Give Up?

  To maintain logical consistency, you must modify your intuition on **Case 2 (The Open Case)**.

  *   **Keep:** The refusal to swap in the Plain (Closed) case.
  *   **Keep:** The refusal to swap in the Upper Bound case.
  *   **Keep:** The willingness to swap in the Coin Flip case.
  *   **Modify:** The feeling that swapping is attractive "at pretty much any amount" in the Open Case.

  **Why?**
  If swapping is advantageous for *every* possible value $x$ you might see, then by the law of total expectation, swapping must be advantageous *before* you see the value. But we know from Case 1 (Closed) that swapping before opening is pointless due to symmetry.
  Therefore, it is mathematically impossible for swapping to be advantageous for *all* $x$. There must be some values of $x$ (typically large ones) for which keeping is better. Your intuition should be: *"I should swap if the amount I see is small relative to what I think the organizer is capable of; I should keep if it is large."*

  ### 4. Summary for Your Column

  The principle you can offer your readers is this: **The expected value of swapping is not determined by the money in your hand, but by the story of how that money got there.**

  1.  **No Story (Plain Case):** Symmetry dictates no gain. The $1.25x$ calculation assumes an impossible distribution.
  2.  **Specific Story (Coin Flip):** The story defines the probabilities. If the story says 50/50, swap.
  3.  **Partial Story (Open Envelope):** You must update your probabilities based on the amount seen. Small amounts suggest you hold the smaller envelope (swap); large amounts suggest you hold the larger (keep).
  4.  **Impossible Story (Infinite):** Expected value is the wrong tool.

  The "pull" you feel upon seeing $100 is your brain correctly identifying that $100 is likely "small" in a real-world context. But that pull must vanish if the envelope contains a billion dollars. If it doesn't vanish, the calculation is broken.

  **Recommendation:** In your column, validate the readers who propose variants that define a prior distribution (like the Coin Flip or Upper Bound cases). Gently correct the readers (and your own lingering intuition) who argue that seeing *any* amount justifies a swap. That is the heart of the paradox, and it is the one intuition that must be surrendered to save the rest.
