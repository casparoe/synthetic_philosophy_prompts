      *(Refining Q4 Follow-up)*: The prompt wants to block the "promissory note." The follow-up needs to corner her on *current* evidence vs. *future* hope.

      Let's assemble the final output. I will organize them logically: Internal Coherence -> Empirical/Historical Claims -> The Replacement -> Normative/Practical Consequences. This creates the "progressively harder to deflect" arc.

