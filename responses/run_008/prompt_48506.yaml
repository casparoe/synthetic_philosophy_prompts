answer: |-
  Here is the breakdown of Ellie's framework, her likely verdict on the summer programme, and the strategy you need for Friday.

  ### 1. Ellie's Verdict on the New Case

  **On the Head's Plan (First-Come-First-Served):**
  Ellie will **reject** this. She will argue that email response time is morally irrelevant to research potential. Treating two equal candidates differently based on a trivial metric fails to show them equal respect. It's not "corrupt" like the nephew case, but it is arbitrary in a way that undermines fairness.

  **On Your Alternative (Lottery):**
  Ellie will **support** this. A lottery acknowledges the equality of the candidates. It gives them equal *ex-ante* probability, which is the only way to distribute a scarce good fairly when merit cannot distinguish them.

  ### 2. Reverse-Engineering the Rules

  You identified three potential rules. Here is how they stack up against her five past takes:

  **Rule 1: The Agency Rule**
  *"Big self-shaping choices need your own committed will; everyone else's choices need a decent procedure."*
  *   **Predicts:**
      *   **Violin/Med (Cases 1 & 2):** You must commit (No coin).
      *   **Restaurants (Case 3):** Low stakes, so a coin is a "decent procedure" for a trivial choice.
      *   **Football/Lifeguard (Cases 4 & 5):** Others are deciding (or deciding for others), so procedure/reasons matter. Nepotism and bias are procedural failures.
      *   **Summer Programme:** The Head is deciding *for* the students. This requires a "decent procedure." A lottery is procedurally fairer than email speed.
  *   **Fit:** **Excellent.** It explains the split between the Violin (no coin) and Restaurant (coin) cases perfectly, which the other rules miss.

  **Rule 2: The Reasons Rule**
  *"Equal options are fine to pick between but not for corrupt or biased reasons."*
  *   **Predicts:**
      *   **Football/Lifeguard (Cases 4 & 5):** Fits perfectly. Nepotism and nationalism are bad reasons.
      *   **Violin/Med (Case 1):** Fits (neither is better).
      *   **Violin/Med (Case 2):** **Fails.** A coin is not a "corrupt or biased" reason. It is neutral. Yet Ellie forbids it. This rule cannot explain why she hates the coin in Case 2 but accepts it in Case 3.
  *   **Fit:** **Weak.** It misses the crucial element of *personal commitment*.

  **Rule 3: The Hidden Fact Rule**
  *"They only seem equal, one is really a bit better if you dug deeper."*
  *   **Predicts:**
      *   **Violin/Med (Case 1):** **Direct Contradiction.** Ellie explicitly said they are "genuinely not rankable."
  *   **Fit:** **Zero.** You must drop this rule immediately. It is the opposite of her worldview.

  ### 3. The Winning Argument: "Who Decides?"

  You mentioned you think the "who decides" aspect is where the Head's plan is weakest. You are right, and this is the core of **Rule 1 (The Agency Rule)**.

  Ellie's framework relies on a distinction between **Constitutive Choices** and **Distributive Choices**.

  *   **Constitutive Choices (Self):** When I choose for my own life (Violin vs. Med), I am not *finding* the right answer; I am *making* it right through my commitment. Using a coin here is a "cop out" because it refuses to author your own life.
  *   **Distributive Choices (Others):** When an authority chooses for others (Football, Lifeguard, School), they are not authoring a life; they are allocating a good. Here, they cannot use "will." They must use **fairness**.

  **The Head's Fatal Flaw:**
  The Head is treating a **Distributive Choice** like a **Queue**.
  In a queue (buying bread), first-come-first-served is fair because the good is common and the cost is low. But this is a unique, life-shaping opportunity (like the Football spot). When distributing scarce goods among equals, the only fair procedure is one that acknowledges their equality.
  *   **Lottery:** Says "You are equal, so you get equal chance."
  *   **Email Speed:** Says "You are equal, but I will treat you differently based on trivia."

  **Your Line for Friday:**
  > "Ellie, you say I can't flip a coin for my own life because I need to commit. But the Head isn't living this life; he's handing out a ticket. When he acts for us, he doesn't need 'commitment,' he needs 'fairness.' A coin is fair to equals. Email speed is just noise. If he uses email speed, he's treating a distributive justice problem like a restaurant queue."

  ### 4. How to Amend Rule 1
  Rule 1 is the best fit, but to make it bulletproof, Ellie needs to amend the "decent procedure" clause.
  *   **Current:** "...everyone else's choices need a decent procedure."
  *   **Amended:** "...everyone else's choices need a procedure that shows **equal respect** to the candidates."
  *   **Why:** This explains why the Nephew (Case 4) and British Lifeguard (Case 5) are wrong. It's not just that the procedure is "indecent," it's that it violates the equal status of the people involved. FCFS violates equal status among equal candidates; a Lottery upholds it.

  ### 5. The Splitting Case (The Friday Weapon)

  To definitively prove Rule 1 (Agency) is superior to Rule 2 (Reasons), you need a case where the **reasons are pure**, but the **agency is blurred**.

  **Put this case to her:**
  > "Imagine a mother has two children. She can only afford to pay for one to go to university, and both children are equally deserving and want to go equally badly. She loves them exactly the same.
  >
  > **Option A:** She flips a coin.
  > **Option B:** She wakes up one morning, feels a 'pull' toward one child's career path, and chooses that one without a coin, committing to the reason herself.
  >
  > Which does she do?"

  **Why this splits the rules:**
  *   **Rule 2 (Reasons)** says both are fine. Neither is biased or corrupt.
  *   **Rule 1 (Agency)** has a conflict. Is this a "Self-Shaping" choice for the mother (requiring Commitment/Option B)? Or is it a "Distributive" choice for the children (requiring Fairness/Option A)?
  *   **The Trap:** If she says **Coin**, she admits that when we choose *for* others (even loved ones), Fairness trumps Will. This cements your argument against the Head (who is choosing for students).
  *   **If she says Commitment:** She admits that "Will" can override "Fairness" in intimate contexts. You can then argue the School-Student relationship is *not* intimate; it is administrative. Therefore, the Head must use the Coin (Lottery), not his Will (FCFS).

  **Summary for your Lunch:**
  1.  **Kill Rule 3** (Hidden Facts) immediately; it contradicts her Violin take.
  2.  **Expose Rule 2's** inability to explain why the Violin coin is bad but the Restaurant coin is good.
  3.  **Champion Rule 1** (Agency), amended to require "Equal Respect" in distributive cases.
  4.  **Argue** that the Head is a distributor, not an author. Distributors owe equals equal chances (Lottery), not arbitrary tie-breakers (Email).
  5.  **Use the Mother Case** to force her to define where "Fairness" overrides "Will."
