answer: |-
  Dear colleague, I have been thinking about our conversations on the panel and the recurring frustration you described regarding the distinction between proposals that promise genuine discovery and those that merely promise to protect existing theories from refutation. It is indeed a secular version of the Lakatosian distinction between progressive and degenerating research programmes, and while Lakatos intended his methodology as a historiographical tool for judging the past, we are in the business of betting on the future. To make this useful for a panel of nine non-experts working under severe time constraints, we must convert the methodology from a verdict on history into a heuristic for trajectory. We cannot ask if a programme has produced novel facts, because for many applicants, especially early-career researchers, the facts do not exist yet. Instead, we must ask if the proposed work is structured to produce novel facts or to absorb anomalies. The procedure I am proposing is not a scoring rubric but a sequence of three interrogatives that any panelist can ask during the fifteen-minute window, designed to surface the structural integrity of the proposal rather than the prestige of the applicant.

  The first question any panelist should ask is whether the proposal identifies a specific state of affairs that would count as a failure of the central hypothesis. In Lakatosian terms, we are looking for evidence that the hard core is exposed to risk rather than insulated by a protective belt. A progressive proposal must specify what data would force them to abandon or significantly alter their central model. If the answer is vague, or if the methodology is designed to accommodate any possible outcome through post hoc adjustment, the proposal is structurally degenerating. The second question concerns the novelty of the predicted fact. We must distinguish between explaining what is already known, even if explained better, and predicting something previously unknown or unsuspected. A proposal that aims merely to fit existing data more accurately, even with a new model, is often engaging in what Lakatos called ad hoc auxiliary adjustments. The sufficient answer here is a clear statement of a phenomenon that the theory says should exist but has not yet been observed, or a relationship that should hold under specific conditions that have not yet been tested. The third question is specifically for the panel's deliberation: if the proposed work succeeds exactly as planned, does it extend the empirical content of the field, or does it merely increase the coherence of the theory without adding new empirical claims? If the success condition is internal consistency rather than external discovery, the procedure should deliver a no. This sequence allows us to bypass the need for deep subject expertise because we are judging the logic of the research design rather than the truth of the premises.

  You raised two specific difficulties that this procedure must confront rather than dissolve, the first being the problem of early-career researchers with no track record. Lakatos relies on history, but we are assessing potential. The procedure handles this by shifting the burden of proof from the researcher's past to the proposal's risk profile. If an applicant has no history, we cannot judge whether their programme has been progressive, so we must judge whether the proposed work is capable of being progressive. A sufficient answer for an early-career applicant is a pilot study or preliminary data that demonstrates the feasibility of the risky test identified in the first question. If the proposal lacks a track record and also lacks a design that allows for falsification, it should be rejected regardless of the applicant's potential. This prevents the procedure from becoming a proxy for seniority, as a senior researcher proposing a degenerating project would also fail the first question, while a junior researcher proposing a risky, novel test would pass. We are not funding the person; we are funding the logical structure of the inquiry. The panel must concede that this means rejecting safe bets from established names in favor of risky designs from newcomers, which is often politically difficult but philosophically necessary if we wish to avoid funding only the consolidation of established paradigms.

  The second difficulty you noted is the migration case, where a framework is imported from a neighboring field. This is where the procedure must be most precise to avoid confusing novelty of domain with novelty of fact. Importing a theory is progressive only if the theory predicts something in the new domain that was not previously known or explained by the existing theories of that domain. If the migration involves simply fitting the imported theory's parameters to existing data in the new field, it is a degenerating move disguised as innovation. The procedure requires the panel to ask whether the imported framework yields a prediction in the new domain that competes with the local framework. A sufficient answer must show that the imported theory solves an anomaly the local theory cannot, or predicts a new phenomenon in the local domain. If the proposal admits that the parameters must be fitted to each new dataset to make the model work, this is a clear signal of a protective belt being expanded to absorb resistance, and the procedure should score this as degenerating. We must not reward the mere application of a sophisticated tool to a new dataset if the tool is being adjusted to fit the data rather than the data testing the tool. This is a hard line to draw, but the distinction lies in whether the parameters are fixed by the theory or free to vary to ensure fit.

  Let us run this procedure on the three hypothetical proposals you provided to see how it behaves in practice. Consider first the laboratory studying memory consolidation whose past decade fits a pattern of post hoc revision around a cherished mechanism. When we apply the first question, asking what would count as a failure, the likely answer from this group will be evasive, suggesting that any deviation can be explained by adjusting variables regarding consolidation timing or context. Their history of revising the protective belt suggests that the hard core is immunized against refutation. The second question regarding novel facts will likely reveal that their proposed work aims to explain known anomalies rather than predict new phenomena. Consequently, the procedure delivers a no. This aligns with our intuition that they are engaged in a degenerating programme, saving the core theory at the cost of increasing complexity without empirical gain. The panel should not fund this merely because the team is established; the procedure correctly identifies that the work is likely to produce further ad hoc adjustments rather than progress.

  Consider second the young researcher with a genuinely unfamiliar model of collective decision-making and nothing but a pilot study behind her. Here the track record is absent, so we rely on the risk profile. If her proposal specifies a clear condition under which her model would fail, and if the pilot study suggests that this test is feasible, she passes the first question. The second question regarding novelty is satisfied if her model predicts a decision pattern that standard rational choice models do not anticipate. The fact that she is early-career is irrelevant to the logic of the proposal; the procedure protects her from being judged on seniority and focuses on the structural risk of her design. If the panel agrees that her method allows for falsification and that the predicted fact is genuinely novel, the procedure delivers a yes. This is the ideal outcome for seed funding, supporting a potentially progressive programme at its inception before it has a history to judge.

  Consider third the migration case in which an economics group wants to bring a well-known rational-choice framework to bear on our institution's educational data, complete with a suite of auxiliary parameters fitted to each new dataset. I know you have a private preference to fund this group, but I must tell you plainly that the procedure recommends rejection. The presence of auxiliary parameters fitted to each dataset is the hallmark of a degenerating protective belt. They are not testing the rational-choice framework against educational data; they are adjusting the framework to ensure it fits the data. This fails the first question because the model is insulated from failure by the flexible parameters, and it fails the second question because fitting known data is not predicting novel facts. The novelty is merely that the framework is new to the domain, not that it generates new knowledge about the domain. To fund this would be to reward the appearance of interdisciplinary progress while actually funding a tautological exercise. If you override this verdict, you are doing so on social or political grounds, not on the philosophical grounds of scientific progress we are attempting to institutionalize. The procedure treats this case exactly as it treats the memory lab: both are prioritizing theoretical survival over empirical risk.

  I must now be candid about the failure modes of this procedure, for a rubric that cannot say what would change its mind is not worth fifteen minutes of a panel's time. The most likely misfire is the false negative regarding a programme that is genuinely progressive but appears degenerating in its early stages. Sometimes a new theory requires initial ad hoc adjustments to become viable, and Lakatos himself acknowledged that a programme can be degenerating for a time before becoming progressive again. Our procedure might reject a proposal that is actually on the cusp of a breakthrough because it looks too protective in the short term. A determined applicant could game this procedure by crafting a proposal that mimics the language of risk without actually accepting it, using vague definitions of failure that allow them to claim success regardless of the outcome. They might claim to predict a novel fact but define the fact so broadly that any result confirms it. The panel must be vigilant for this rhetorical gaming, looking for specific numerical or qualitative thresholds that define success and failure. Furthermore, the procedure relies on the panel's ability to distinguish between a legitimate auxiliary hypothesis and an ad hoc one. This is a matter of scientific judgment that cannot be fully laundered into a checklist. If the panel lacks the expertise to know whether a parameter adjustment is standard practice or a desperate patch, the procedure will fail.

  Finally, we must establish what evidence about a programme's actual history should be counted as sufficient to overturn the verdict the procedure delivers. Since we are making prospective judgments, the only thing that can overturn a negative verdict from this procedure is external empirical success that occurs after the fact, which is useless for the current funding round. However, within the panel's deliberation, if an applicant can demonstrate that what looks like a protective belt is actually a standard methodological refinement required to make the theory testable at all, the panel should concede that the question is one of scientific judgment beyond the checklist. If the applicant shows that the parameter fitting is constrained by independent theory rather than just data fitting, the verdict should shift from no to yes. But without that evidence, the procedure stands. We must accept that using Lakatos this way will sometimes lead us to fund failures and reject successes, because we are judging the logic of the proposal, not the truth of the world. But it will prevent us from systematically funding the degeneration of our university's research output into self-referential theory maintenance. I hope this memorandum serves as a useful tool for our next meeting, and I am willing to walk the panel through these questions myself if it helps standardize our deliberations.
