answer: |-
  A border collie works a flock where one ewe wears a bright red collar, instructed by the handler's whistle to isolate only that ewe. The dog ignores the flock's natural movement patterns, fixating on the artificial color marker to identify the target, then initiates a drive toward a gate. When the ewe dashes into a dense, visibility-limiting thicket, the dog lunges down a narrow trail, strikes unseen brambles, recoils, and immediately tests a parallel path, successfully passing only after physically confirming the first route was blocked.

  ### Walkthrough

  **1. Target Identification (Gregorian)**
  *   **Classification:** Gregorian.
  *   **Why:** The dog is using an arbitrary symbol (the red collar) and a conventional signal (the whistle) to carve up the problem space. The distinction between "target ewe" and "other ewes" is not inherent in the biology of the sheep or the instinct of the dog; it is a cultural tool imported from the handler that structures the dog's search.
  *   **Feature Doing the Work:** The reliance on an *arbitrary external label* to determine action selection.
  *   **Counterfactual:** If you remove the collar and whistle, the dog does not fail to act; it reverts to Darwinian instincts (gathering the whole flock) or Skinnerian trial-and-error (nipping different sheep until one moves correctly). The *mode* of control shifts from symbol-mediated to instinct or feedback-mediated.

  **2. Thicket Navigation (Skinnerian)**
  *   **Classification:** Skinnerian.
  *   **Why:** The dog cannot simulate the passability of the trail internally or visually; it must commit its body to the environment to test the hypothesis. The variation (trying the left path) is blind until the error (hitting brambles) is physically encountered.
  *   **Feature Doing the Work:** The requirement of *physical commission* for feedback. The trial dies in the world, not in the head.
  *   **Counterfactual:** If the thicket were transparent or the gap obvious from a vantage point, the dog might pause and survey (potentially Popperian). By making the obstacle opaque, we force the trial into the physical realm, ensuring the classification remains Skinnerian.

  ### Addressing the Skeptic

  Your skeptic argues that the Popperian/Skinnerian distinction is just "smart vs. less smart" and the Gregorian/Skinnerian distinction is just "raised around humans vs. not." Here is the honest take:

  On the **Popperian/Skinnerian** line, the case gives the skeptic something to worry about. It demonstrates that the distinction is mechanistic, not performance-based. A Skinnerian creature can be highly successful (the dog eventually gets through the thicket), and a Popperian creature can be disastrously wrong (simulating a path that looks clear but isn't). The taxonomy tracks *where the selection pressure is applied* (body vs. internal model), not the success rate. If the skeptic insists this is just "smartness," she is conflating efficiency with architecture.

  On the **Gregorian/Skinnerian** line, the case quietly concedes the skeptic's point, but suggests she is drawing the wrong conclusion from it. Yes, the Gregorian element here is entirely dependent on human intervention (the collar, the whistle). If the dog were not "raised around humans" (or at least embedded in a human cultural niche), it would not exhibit Gregorian cognition in this task. However, the skeptic treats this as a trivial sociological fact ("it's just training"). Dennett's point—and what the case supports—is that this import changes the *computational structure* of the mind. The dog isn't just "trained"; it is offloading cognitive labor onto cultural artifacts.

  **The Verdict:** The taxonomy does not carve nature at the joint of *biological species* (there are no "Gregorian animals" in the way there are "mammals"). It carves nature at the joint of *control architectures*. The skeptic is right that these are not essential kinds inherent to the organism, but wrong to dismiss them as mere glosses on intelligence or upbringing. They are functional kinds, like "software running on hardware." The same hardware (the dog) runs different software (Skinnerian vs. Gregorian) depending on the interface. If the skeptic demands biological essentialism, the taxonomy fails. If she accepts functionalism, the taxonomy holds, but only because it describes relationships and processes, not substances.
