  4.  **Drafting the Walkthrough:**
      *   *Gregorian Part:* Identification of target. Feature: Arbitrary symbol (colored collar/whistle) mediating the choice. Remove it: Dog reverts to Darwinian (instinctive flocking) or Skinnerian (trial and error separating sheep).
