      *   My case shows the *same animal* switching modes. This suggests the taxonomy classifies *processes*, not *animals*. This undermines the "dumb vs clever" (essentialist) view.
      *   However, regarding the "raised around humans" critique: Yes, Gregorian cognition in this case is dependent on human artifacts. Dennett admits this. The skeptic is right that it's not an intrinsic biological capacity like having a liver, but a relational property.
      *   Regarding Popperian/Skinnerian: The skeptic says it's just smart vs less smart. My case distinguishes them by *where the trial happens* (body vs environment), not success rate. A Skinnerian creature can be very successful (highly adapted). A Popperian can be wrong constantly. The distinction is mechanistic, not performance-based.
      *   *Honest Take:* The case concedes the skeptic's point that these aren't biological "kinds" (like species), but argues they are functional "kinds" (like algorithms). The skeptic is right to reject essentialism, but wrong to reduce it to mere performance metrics. The taxonomy describes *control architectures*, not intelligence levels.

  6.  **Drafting the Content:**

      *   *Scenario:* Border collie, colored collar, thicket navigation.
      *   *Walkthrough:*
          *   Gregorian: Selection via collar/whistle. Feature: Arbitrary symbol mediating choice. Counterfactual: No collar -> instinctive grouping (Darwinian) or random search (Skinnerian).
