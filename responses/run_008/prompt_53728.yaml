answer: |-
  **Bottom line**
  This procedure is a burden-of-proof filter, not a philosophy lecture. It presumes decisions belong at the local level unless a specific, evidence-based case is made to move them up. Its purpose is to stop relitigation by forcing proponents of centralization to answer five specific questions. If they cannot provide a sufficient answer, the decision defaults to the local group. If the question touches on political advocacy or core organizational identity, it bypasses the committee and goes straight to the trustees.

  **The procedure**

  1.  **Liability and Safety Hard Stop.**
      *   *Question:* Does this decision carry a risk of physical harm to volunteers or significant legal liability for the national federation?
      *   *Sufficient Answer:* Yes, if insurance providers require standardization or if local variation creates demonstrable risk (e.g., chainsaw use, vehicle transport).
      *   *Verdict:* If **Yes**, National sets the minimum standard. Local groups may exceed standards but cannot undercut them.
      *   *Judgment Call:* Determining "significant liability" is subjective. Rely on written advice from legal counsel or insurance carriers, not anecdotal fear.

  2.  **Cross-Border Externalities.**
      *   *Question:* Does this local decision negatively impact another group's ability to operate, fundraise, or maintain reputation?
      *   *Sufficient Answer:* Yes, if the action creates direct competition for the same restricted grants, or if a local failure would cause donors to withhold funding from the national body.
      *   *Verdict:* If **Yes**, National arbitrates or mandates coordination.
      *   *Judgment Call:* Distinguish between healthy competition (good) and brand cannibalization (bad). Evidence must be financial or reputational, not merely "we don't like their approach."

  3.  **Capacity and Competence.**
      *   *Question:* Does the local unit possess the expertise and resources to execute this task effectively without national support?
      *   *Sufficient Answer:* No, if the task requires specialized certification (e.g., hazardous species handling) or complex legal compliance beyond volunteer capacity.
      *   *Verdict:* If **No**, National provides the template, training, or takes over the task.
      *   *Judgment Call:* This is the most common site of power grabs. National staff may claim locals lack capacity to justify control. Require evidence of past failure or specific skill gaps, not assumptions.

  4.  **Brand and Political Identity.**
      *   *Question:* Would a reasonable outsider perceive this action as the official stance of the national federation?
      *   *Sufficient Answer:* Yes, if the national logo is used, if the issue aligns with national advocacy goals, or if the action involves partisan political activity.
      *   *Verdict:* If **Yes**, **ESCALATE TO TRUSTEES.** This committee does not decide values; trustees decide risk tolerance regarding public stance.
      *   *Judgment Call:* The "reasonable outsider" test is vague. When in doubt, escalate. It is better to slow down a campaign than to accidentally commit the federation to a partisan fight.

  5.  **The Subsidiarity Presumption.**
      *   *Question:* Have steps 1–4 been cleared?
      *   *Sufficient Answer:* Yes, if no liability, externality, capacity, or brand risk is proven.
      *   *Verdict:* **DECIDE LOCALLY.** The burden of proof rests entirely on those seeking to centralize. If they cannot prove necessity, autonomy wins by default.
      *   *Judgment Call:* This step requires discipline. Committee members often feel they "know better" than locals. You must actively suppress the urge to optimize for uniformity when diversity is harmless.

  **Three test cases**

  **(1) Chainsaw Safety Standardization**
  This hits Step 1 (Liability and Safety) immediately. Chainsaw operation carries high risk of physical injury and significant insurance implications. The two regions arguing for local practices must prove their methods meet the national insurer's requirements. If the national office produces a letter from insurers stating that varied protocols increase liability premiums or risk denial of claims, the "Sufficient Answer" threshold is met. The procedure mandates National sets the minimum standard. Locals can add stricter rules, but cannot undercut the national floor. This outcome will annoy the autonomy advocates, but the procedure holds because physical safety and legal liability override local preference. The decision is not about trust; it is about risk exposure.

  **(2) Political Rally with Logo**
  This hits Step 4 (Brand and Political Identity). Using the federation's logo alongside a political party at a rally creates an immediate perception of institutional endorsement. A "reasonable outsider" would view this as the national federation taking a partisan stance. This triggers the "ESCALATE TO TRUSTEES" verdict. The governance committee does not vote on this. The trustees must decide if the federation engages in partisan politics at all. If the trustees say no, the local group is vetoed. If yes, they set the guidelines. This protects the organization from accidental politicization while acknowledging that the decision is values-based, not procedural.

  **(3) Mandatory Species Database**
  This hits Step 2 (Externalities) and Step 3 (Capacity). If the federation applies for national science grants based on aggregate data, local silos create an externality: one group's missing data reduces funding eligibility for all. Furthermore, standardized data entry often requires capacity (software training) that locals lack. If the national office proves that fragmented data loses grants or compromises scientific integrity used by all regions, the verdict is National mandate. However, the procedure requires National to provide the tool and training (Step 3). The local group cannot opt out if it harms the collective mission, but National cannot mandate without support.

  **Where it misfires**

  This procedure cannot resolve bad faith. If national staff consistently exaggerate liability risks (Step 1) to consolidate power, or if local groups hide data to avoid scrutiny (Step 2), the checklist becomes a weapon. It also fails during culture wars. If a local group's values diverge sharply from the national mission (e.g., differing views on land access), Step 4 might trigger constantly, causing gridlock at the trustee level. Finally, it assumes volunteers have time to gather evidence. If proving "capacity" requires hours of research, locals will default to national control out of exhaustion. Use this for structural disputes, not personality conflicts. If the argument is about people rather than principles, no checklist will save you.
