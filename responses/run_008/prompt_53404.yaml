prompt: |-
  I'm a journalist on a science-and-ideas beat, and I'm doing a piece on the quiet fight over how to classify early Confucian ethics. To go with it I want one of those fun interactives at the top of the page: a "which reading of Confucius do you actually hold?" quiz. Seven or eight questions, each one a concrete case the reader judges before they know it's sorting them anywhere, aimed at a general reader with zero Chinese — so no labels inside the questions, and nothing like "do you think Confucianism is a virtue ethics?", since that's the exact thing I'm testing. A couple of cases I want in there for sure: the Analects moment where Confucius seems fine with a son concealing his father's theft of a sheep (modernize it if that works better), and something about a hermit who walks away from every role he has — can he be as good a person as someone embedded in family and community, or did he leave his personhood at the door? Beyond those, pick cases that actually do sorting work. The leaves should include: the virtue-ethics reading (Confucius as basically Aristotle with different vocab), the role-ethics reading (the Ames-and-Rosemont-style claim that there's no self prior to one's roles, so it can't be a virtue ethics), a care-ethics reading, a Fingarette-ish ritual reading where li does all the heavy lifting, and a deflationary "it's not an ethics at all, just self-cultivation advice" option. Give me a scoring key mapping answer patterns onto leaves, and flag any two leaves the answers can't really seperate — I have a feeling virtue-ethics and role-ethics will bunch together on a lot of my cases and I'd rather know that than paper over it.
reasoning: |-
  Here's a thinking process that leads to the suggested quiz and scoring key:

  1.  **Analyze the Request:**
      *   **Target Audience:** General readers (no Chinese, no prior philosophy knowledge).
      *   **Format:** 7-8 question interactive quiz ("Which reading of Confucius do you actually hold?").
      *   **Content:** Concrete cases/scenarios, no jargon in the questions.
      *   **Required Cases:**
          1.  Father/Son sheep theft (modernized).
          2.  Hermit vs. Embedded person (role abandonment).
      *   **Target "Leaves" (Results):**
          1.  Virtue Ethics (Aristotelian).
          2.  Role Ethics (Ames/Rosemont).
          3.  Care Ethics.
          4.  Ritual Ethics (Fingarette).
          5.  Deflationary (Self-Cultivation/Advice, not Ethics).
      *   **Deliverables:** Quiz questions, Scoring Key, Limitations/Overlap warning (specifically Virtue vs. Role).

  2.  **Deconstruct the Leaves (Philosophical Nuance):**
      *   *Virtue Ethics:* Focus on character traits, internal dispositions, becoming a "good person" who then acts rightly. Universalizable virtues (courage, honesty) but context-sensitive.
      *   *Role Ethics:* Focus on relationships. You *are* your roles (father, son, ruler). No abstract "self" behind the roles. Right action is fulfilling the specific role, not applying a universal rule.
      *   *Care Ethics:* Focus on interdependence, emotional attunement, responsiveness to need, maintaining the web of relationships over abstract justice.
      *   *Ritual Ethics (Fingarette):* Focus on *li* (ritual/propriety). The magic is in the performance, the social script, the "spell" of community interaction. Morality is aesthetic/social harmony.
      *   *Deflationary:* It's not about "right/wrong" in a moral sense, but about effectiveness, peace of mind, or personal refinement. Pragmatic wisdom.

  3.  **Drafting the Questions (Iterative Process):**
      *   *Constraint:* Must be concrete, no jargon.
      *   *Goal:* Differentiate the leaves.

      *   *Question 1: The Sheep Theft (Required).*
          *   Scenario: Dad steals something. Son knows.
          *   Options: Turn him in (Rule/Justice), Hide it (Role/Family), Confront him gently (Care/Virtue), Ignore it (Deflationary?).
          *   *Differentiation:* Role Ethics leans heavily into "Father covers for Son." Virtue Ethics might struggle with "Honesty" vs "Filiality." Care Ethics focuses on the relationship harm.

      *   *Question 2: The Hermit (Required).*
          *   Scenario: Someone leaves society to live alone.
          *   Options: Wasted life (Role), Admirable integrity (Virtue/Universal), Escaping responsibility (Care), Missing the point of ritual (Ritual), Their business (Deflationary).
          *   *Differentiation:* Role Ethics says you can't be good without roles. Virtue Ethics says you can cultivate character alone.

      *   *Question 3: The Grieving Period.*
          *   Scenario: How long to mourn a parent?
          *   Options: Until you feel better (Internal/Virtue), 3 years because that's the rule (Ritual/Role), As long as needed for the family (Care), Doesn't matter (Deflationary).
          *   *Differentiation:* Fingarette/Ritual loves the specific form. Role loves the obligation. Virtue loves the internal sentiment.

      *   *Question 4: The Rude Guest.*
          *   Scenario: Someone insults you at dinner.
          *   Options: Correct them (Justice/Virtue), Smile and keep the peace (Ritual/Harmony), Ask why they are hurt (Care), Leave (Deflationary).
          *   *Differentiation:* Ritual is about maintaining the "spell" of the gathering. Care is about the emotion.

      *   *Question 5: Teaching a Child.*
          *   Scenario: How to raise a kid?
          *   Options: Teach them principles (Virtue/Universal), Teach them how to be a son/daughter (Role), Teach them to notice feelings (Care), Teach them manners (Ritual), Let them find their way (Deflationary).

      *   *Question 6: The Broken Promise.*
          *   Scenario: You promised to meet a friend, but a family emergency happens.
          *   Options: Keep promise (Rule), Break it for family (Role/Care), Apologize and explain (Virtue), Send a proxy to do the ritual (Ritual).
          *   *Differentiation:* Role ethics prioritizes the familial role over the contractual promise.

      *   *Question 7: The Goal of Life.*
          *   Scenario: What's the point of all this effort?
          *   Options: To be a good human (Virtue), To fit perfectly in your station (Role), To keep everyone connected (Care), To make society run smoothly (Ritual), To be at peace (Deflationary).

  4.  **Refining the Options for Scoring:**
      *   I need to make sure the options map clearly to the 5 leaves.
      *   *Challenge:* Virtue and Role are indeed very close (as the user suspected). I need to sharpen the distinction.
          *   *Virtue:* Internal character, transferable across contexts.
          *   *Role:* Constitutive relationships, specific to the position.
      *   *Challenge:* Ritual vs. Role.
          *   *Role:* The *relationship* is the ontology.
          *   *Ritual:* The *performance* creates the reality.
      *   *Challenge:* Care vs. Role.
          *   *Care:* Emotional responsiveness, vulnerability.
          *   *Role:* Duty, structural obligation.

  5.  **Developing the Scoring Key:**
      *   Assign points for each option (A, B, C, D, E).
      *   Tally the highest score.
      *   Create tie-breaker logic or acknowledge blends.

  6.  **Addressing the "Overlap" Warning:**
      *   The user specifically asked to flag leaves that answers can't separate.
      *   *Virtue vs. Role:* This is the big one. In practice, "being a good father" (Role) looks a lot like "exercising the virtue of filiality" (Virtue). The quiz might struggle to split them without metaphysical questions (which I can't ask). I need to be honest about this.
      *   *Ritual vs. Role:* Also very close.
      *   *Deflationary:* Might get confused with Care (both reject hard rules).

  7.  **Review against Constraints:**
      *   7-8 questions? (I have 7 drafted).
      *   No Chinese terms? (Check).
      *   No "Do you think..." questions? (Check).
      *   General reader friendly? (Need to ensure language is punchy).

  8.  **Final Polish:**
      *   Make the scenarios vivid.
      *   Ensure the scoring logic is transparent for the journalist.
      *   Write the "Journalist's Note" on limitations clearly.

      *(Self-Correction during drafting)*: I need to make sure the "Deflationary" option doesn't just look like "I don't care." It needs to be "This is about *me*, not morality."
      *(Self-Correction on Virtue/Role)*: To separate them, Virtue needs to emphasize *internal disposition* that could exist anywhere, while Role needs to emphasize *specific relationship obligations* that define who you are.

      *Let's refine Q1 (Sheep):*
      *   Virtue: "Honesty is key, but love matters." (Nuanced)
      *   Role: "He is your father. That is the primary fact."
      *   Care: "Turning him in destroys the bond."
      *   Ritual: "There is a proper way to handle shame."
      *   Deflationary: "Why is this a moral problem?"

      *Let's refine Q2 (Hermit):*
      *   Virtue: "Character is internal."
      *   Role: "A person without relations is not a person."
      *   Care: "Who is taking care of whom?"
      *   Ritual: "They removed themselves from the dance."
      *   Deflationary: "If they are happy, good."

      *Okay, let's write the options to map cleanly.*

  9.  **Finalizing the Output Structure:**
      *   Intro for the journalist.
      *   The Quiz (Questions + Options).
      *   The Scoring Key (How to tally).
      *   The "Leaf" Descriptions (What the results mean).
      *   The "Journalist's Note" (Limitations/Overlaps).

      *(Wait, one more check)*: The prompt asks for "Seven or eight questions." I'll aim for 8 to ensure better statistical distribution. I'll add one about "Rules vs. Context."

      *Q8: The Universal Rule.*
      *   Scenario: Is there one rule for everyone?
      *   Options: Yes, golden rule (Virtue), No, depends on who you are (Role), No, depends on the need (Care), No, depends on the occasion (Ritual), Rules are limiting (Deflationary).

      *Okay, ready to generate.*
answer: |-
  Here is a complete package for your interactive: 8 scenario-based questions, a scoring key, result descriptions, and a candid "Journalist's Note" on the philosophical limitations (specifically the Virtue/Role overlap you suspected).

  ### The Interactive: "What Kind of Confucian Are You?"

  **Intro Text:**
  *Confucius didn't write a rulebook. He left behind conversations. For 2,500 years, scholars have argued over what those conversations actually mean. Is it about character? Relationships? Ritual? Or just practical advice for a messy life? Answer these eight concrete scenarios to find out which philosophical camp your intuition matches.*

  ---

  #### 1. The Stolen Wallet
  Your father shoplifts a wallet from a store. You see him do it. Later, the store manager asks if you know anything about it. What do you do?
  *   **A.** You tell the truth. Honesty is a universal requirement for a good person.
  *   **B.** You say nothing. Your primary reality is being a son/daughter; protecting that bond comes first.
  *   **C.** You intervene quietly. You focus on the manager's feelings and your father's shame, trying to heal the breach without police.
  *   **D.** You follow the script. There is a proper, dignified way to handle family shame that preserves social harmony.
  *   **E.** You ask why it matters. If your father needs the money, moralizing about "theft" misses the point of the situation.

  #### 2. The Mountain Hermit
  A brilliant person abandons their job, spouse, and community to live alone in a cabin, seeking personal peace. They harm no one. Are they living a good life?
  *   **A.** Yes. Moral character is internal; they can cultivate wisdom in solitude.
  *   **B.** No. A human is defined by their connections. Without roles (parent, worker, friend), they aren't fully a person.
  *   **C.** It's tragic. Humans are interdependent. Withdrawing is a failure of responsiveness to the web of care.
  *   **D.** No. They have stepped out of the "dance" of society. Meaning is found in the performance of social routines.
  *   **E.** Maybe. If they are content and effective, who are we to judge their path with moral labels?

  #### 3. The Grieving Period
  How long should you mourn the death of a parent before returning to normal life?
  *   **A.** Until you feel you have processed the loss and restored your emotional balance.
  *   **B.** Three years. It is the debt owed for the three years you were carried in their arms. It is an obligation of the role.
  *   **C.** As long as it takes to ensure the rest of the family feels supported and secure.
  *   **D.** Three years. The ritual form itself transforms the grief; skipping the steps ruins the process.
  *   **E.** There is no "should." Grief is personal; imposing a timeline is artificial.

  #### 4. The Rude Guest
  At a dinner party, a guest insults your cooking in front of everyone. The room goes silent. What is the right move?
  *   **A.** Calmly assert your dignity. A virtuous person does not accept disrespect, but doesn't lose their temper.
  *   **B.** Defuse it based on your station. As the host, your role is to maintain the gathering, not to win a fight.
  *   **C.** Ask if they are okay. An outburst usually signals pain; attend to the need behind the insult.
  *   **D.** Smooth it over with a joke or toast. Keep the ritual flow moving; don't let the "spell" of the dinner break.
  *   **E.** Ignore it. Getting worked up over an insult is a waste of your own energy.

  #### 5. Teaching a Child
  You are raising a child. What is the most important thing to teach them?
  *   **A.** Principles. Teach them to recognize what is right and have the courage to do it anywhere.
  *   **B.** Relationships. Teach them how to be a good sibling, friend, and child. That is who they are.
  *   **C.** Empathy. Teach them to notice when others are hurting and how to respond.
  *   **D.** Manners. Teach them the forms of interaction. Proper behavior creates a proper self.
  *   **E.** Autonomy. Teach them to navigate the world successfully without being burdened by others' expectations.

  #### 6. The Broken Promise
  You promised to help a friend move, but your sibling has a sudden crisis. You break the promise to help the sibling. Was this wrong?
  *   **A.** It's a conflict of virtues. Loyalty to family is a virtue, but so is keeping your word. You must weigh them.
  *   **B.** It wasn't wrong. The sibling relationship is constitutive of who you are; the friend promise is secondary.
  *   **C.** It depends. Did the friend have a greater need? Ethics is about responding to the most vulnerable party.
  *   **D.** It depends. Did you perform the proper apology ritual to the friend to restore the social balance?
  *   **E.** Not really. "Wrong" is too heavy. You made a pragmatic choice based on immediate priorities.

  #### 7. The Corrupt Official
  A local leader is efficient and keeps the peace, but they gained power through nepotism and minor corruption. Do they deserve respect?
  *   **A.** No. A good society requires leaders with good character, regardless of results.
  *   **B.** Yes, if they fulfill the duties of the office. The role matters more than the private morality of the person.
  *   **C.** No. If their actions harm the community trust, they are failing the care network.
  *   **D.** Yes, if they maintain the proper ceremonies and social order. Order is the priority.
  *   **E.** Who cares? If the streets are safe and taxes are low, moral labels on the leader are irrelevant.

  #### 8. The Goal of Life
  After all this effort to be "good," what are we actually trying to achieve?
  *   **A.** To become an excellent human being (a sage).
  *   **B.** To fit perfectly into your specific station in the web of life.
  *   **C.** To sustain flourishing relationships with everyone around you.
  *   **D.** To create a harmonious, beautiful social order through shared practice.
  *   **E.** To live effectively and without unnecessary anguish.

  ---

  ### The Scoring Key

  Tally the user's answers. Whichever letter has the most votes determines the leaf.

  *   **Mostly A:** The Virtue Ethicist (Aristotle in Robes)
  *   **Mostly B:** The Role Ethicist (Ames & Rosemont)
  *   **Mostly C:** The Care Ethicist (The Relational Web)
  *   **Mostly D:** The Ritualist (Fingarette's Spell)
  *   **Mostly E:** The Deflationist (Pragmatic Self-Cultivation)

  *(Tie-Breaker Rule: If there is a tie between A and B, assign to B. If there is a tie between C and D, assign to D.)*

  ---

  ### The Result Leaves (Copy for the Pop-ups)

  **Mostly A: The Virtue Ethicist**
  You read Confucius as the Eastern Aristotle. For you, ethics is about *character*. The goal is to cultivate internal dispositions (like benevolence or courage) that allow you to act rightly in any situation. You believe there is a "self" behind the roles that can be improved, and that moral truths can be universalized, even if context matters.
  *Scholarly Match:* Alasdair MacIntyre, early comparative philosophers.

  **Mostly B: The Role Ethicist**
  You side with Roger Ames and Henry Rosemont. For you, there is no abstract "self" prior to your relationships. You *are* a father, a daughter, a citizen. Ethics isn't about applying universal rules; it's about fulfilling the specific obligations of the roles you inhabit. To abandon a role is to abandon your personhood.
  *Scholarly Match:* Roger Ames, Henry Rosemont Jr.

  **Mostly C: The Care Ethicist**
  You view Confucianism through the lens of interdependence. For you, morality isn't about rules or rigid roles, but about emotional attunement and responsiveness to need. The "good" is maintaining the web of relationships. You prioritize the vulnerable and the emotional reality of the situation over abstract duties.
  *Scholarly Match:* Li Chenyang, Sarah Lucas.

  **Mostly D: The Ritualist**
  You hear the voice of Herbert Fingarette. For you, *li* (ritual/propriety) does the heavy lifting. Morality is aesthetic and social. By performing the right "scripts" (greetings, mourning, dining), we cast a "spell" of community that makes us human. Without the ritual performance, the inner virtue doesn't exist.
  *Scholarly Match:* Herbert Fingarette, Eno Saks.

  **Mostly E: The Deflationist**
  You suspect the philosophers are overthinking it. For you, the Analects isn't a moral system; it's a guide to self-cultivation and social effectiveness. It's about reducing friction in your life and finding peace. You reject the idea that Confucius is prescribing "obligations" in a Western moral sense.
  *Scholarly Match:* Chad Hansen, some Sinological skeptics.

  ---

  ### Journalist's Note: The Overlap Warning

  You were right to be suspicious. Here are the two friction points this quiz cannot fully resolve, which you should address in the accompanying text:

  **1. The Virtue/Role Bunching (A vs. B)**
  *   **The Problem:** In concrete scenarios, "acting according to virtue" and "acting according to role" often look identical. If a father protects his son, a Virtue Ethicist calls it "Filial Piety" (an internal trait), and a Role Ethicist calls it "Fatherhood" (an ontological fact).
  *   **The Quiz Fix:** I tried to separate them by asking about the *Hermit* (Q2) and the *Goal of Life* (Q8). Virtue Ethics allows for a solitary sage; Role Ethics does not. However, in the scoring key, I added a tie-breaker favoring Role Ethics because, in modern Confucian scholarship, the Role Ethics critique is specifically designed to displace the Virtue Ethics reading. If a reader is on the fence, they are likely defaulting to a Westernized Virtue reading that Role Ethicists would argue is a mistranslation.
  *   **For Your Piece:** This is your lead. The "Quiet Fight" is largely about whether there is a "self" underneath the relationships. The quiz forces a choice, but the philosophy suggests they might be talking past each other.

  **2. The Ritual/Role Blur (D vs. B)**
  *   **The Problem:** Fingarette's Ritual Ethics and Ames/Rosemont's Role Ethics are cousins. Both reject the "inner self" as the primary locus of morality. Both focus on the external performance of social life.
  *   **The Quiz Fix:** I differentiated them by focusing on *Obligation* (Role) vs. *Performance/Aesthetics* (Ritual). In Q4 (The Rude Guest) and Q3 (Grieving), Role answers focus on duty/debt, while Ritual answers focus on harmony/flow/script.
  *   **For Your Piece:** Mention that for many readers, the distinction between "doing your duty" and "performing the ritual" is negligible, but for philosophers, one is about social structure (Role) and the other is about magical/social efficacy (Ritual).

  **3. The Deflationary Wildcard (E)**
  *   **The Problem:** This category risks capturing readers who just don't like moral questions.
  *   **The Quiz Fix:** The options are phrased to sound like wisdom ("Why is this a moral problem?") rather than apathy ("I don't care").
  *   **For Your Piece:** This represents the "Sinological" pushback against importing Western ethical categories entirely. It's the "Confucius wasn't doing ethics, he was doing something else" camp.
