answer: |-
  **Exam Question**

  Candidate X argues that Harsanyi's Aggregation Theorem settles the justification for utilitarianism. X claims: "If individuals and society satisfy Expected Utility (EU) theory and the Pareto principle, social welfare must be a weighted sum of individual utilities. Imposing impartiality (equal weights) yields classical utilitarianism. This derives interpersonal comparability as a theorem, not an assumption, proving egalitarian redistribution is irrational sentiment."

  Evaluate X's claim. Your answer must address: (1) the distinction between the theorem's formal result and the normative interpretation; (2) precisely where interpersonal comparability enters the argument (specifically regarding affine transformations); and (3) whether the *ex ante* formulation of Pareto allows a consistent egalitarian to reject the premises without irrationality. Limit discussion of the impartial observer variant to one paragraph.

  ***

  **Model Answer**

  Candidate X's claim fails because it conflates a mathematical representation theorem with a normative derivation. Harsanyi's result is structural: if individual preferences $R_i$ and social preferences $R$ satisfy von Neumann-Morgenstern axioms and the Pareto principle over lotteries, then the social welfare function $W$ is linear in individual utilities ($W = \sum a_i u_i$). However, this does not validate utilitarianism without further assumptions regarding measurement and ethics. The theorem shows what form social welfare must take *given* certain inputs; it does not prove those inputs are morally mandatory.

  First, the theorem establishes linearity, not comparability. Individual utility functions $u_i$ are unique only up to positive affine transformations ($u_i' = \alpha_i u_i + \beta_i$). The sum $\sum u_i$ is undefined unless the scales ($\alpha_i$) and zero-points ($\beta_i$) are fixed across persons. The theorem itself is silent on this normalization. X claims comparability is derived, but it is actually presupposed in the application of the weights. To move from "weighted sum" to "utilitarian sum," one must assume a common unit of utility. Without this, the weights $a_i$ are arbitrary scaling factors, not ethical parameters. If person A's utility is measured in "decibels" and person B's in "lumens," summing them is category error. The theorem permits the sum only if the units are already commensurable.

  Second, regarding where comparability enters: X suggests impartiality (equal weights) solves this. It does not. Setting $a_i = a_j$ is meaningless if $u_i$ and $u_j$ measure different magnitudes. Comparability must be introduced either by fixing the affine transformations via an external standard (e.g., specific goods or psychological states) or by stipulating that the planner's EU representation inherently shares a scale with individuals. The latter is question-begging; the former is an ethical assumption external to the theorem. Thus, the theorem does not derive comparability; it merely shows that *if* comparability holds, utilitarianism follows from Pareto and EU. X treats a necessary condition for the math to work as a result of the math itself.

  Third, the *ex ante* framing invites the Diamond objection. The Pareto premise applies to prospects (lotteries), not certain outcomes. Consider a benefit that helps either Person 1 or Person 2. A utilitarian planner satisfying *ex ante* Pareto is indifferent between a coin flip (50% chance each) and giving the benefit to the worse-off person certainly, provided expected utilities are equal. However, an egalitarian may value *ex post* equality. They might prefer giving the benefit to the worse-off person certainly, rather than a fair lottery that risks leaving them with nothing. To hold this view, the egalitarian must reject the *ex ante* Pareto principle. This is not irrational; it reflects a commitment to *ex post* fairness over *ex ante* efficiency. X claims egalitarianism is sentiment, but it is actually a coherent rejection of the Pareto axiom in contexts of uncertainty. The theorem shows you cannot have EU, *ex ante* Pareto, and *ex post* equity simultaneously; it does not prove EU and Pareto are mandatory.

  Finally, the impartial observer variant (1953) attempts to ground comparability in empathy. However, this shifts the burden to the psychological plausibility of the observer's preferences rather than solving the scaling problem formally. It remains an ethical postulate, not a mathematical derivation.

  In conclusion, X is mistaken. The theorem requires interpersonal comparability as an input, not an output. Furthermore, the *ex ante* Pareto condition is contestable on egalitarian grounds. Utilitarianism remains one coherent option, but not the uniquely rational one mandated by formal decision theory.

  ***

  **Marking Scheme (20 Marks)**

  1.  **Distinction between representation and normative derivation (4 marks)**
      *   *Must hit:* Candidate must state that the theorem describes the form of preferences satisfying axioms, not that the axioms are morally binding.
      *   *Typical mistake:* Treating the mathematical necessity of the sum as proof that utilitarianism is ethically required.

  2.  **Explanation of the affine transformation problem (4 marks)**
      *   *Must hit:* Candidate must explain that $u_i$ are unique only up to $a_i u_i + b_i$, making summation undefined without fixed scales.
      *   *Typical mistake:* Assuming utility units are naturally common across persons without normalization.

  3.  **Identification of where comparability is assumed (4 marks)**
      *   *Must hit:* Candidate must argue that equal weights presuppose comparability rather than establishing it (or argue alternative entry point rigorously).
      *   *Typical mistake:* Believing that setting weights to 1 automatically solves the scaling issue.

  4.  **Analysis of *Ex Ante* Pareto vs. *Ex Post* Equity (Diamond) (4 marks)**
      *   *Must hit:* Candidate must reconstruct the objection: satisfying lotteries can violate distributional concerns in outcomes.
      *   *Typical mistake:* Confusing preference satisfaction over prospects with justice in final allocations.

  5.  **Verdict on X's claim regarding rationality (4 marks)**
      *   *Must hit:* Candidate must conclude that egalitarianism is rational if one rejects *ex ante* Pareto, refuting X's "sentiment" claim.
      *   *Typical mistake:* Concluding the theorem settles the debate in favor of utilitarianism despite the identified gaps.
