      *   *Correction:* Portability is a requirement for *human-meaningful* concepts, not necessarily *model-internal* states. I need to distinguish "Representation of X (human concept)" vs "Internal State Y (model concept)." The user asks about "representation of X." So Portability matters.
      *   *Thought:* Superposition is the killer. If features are superposed, "knocking out" one feature is hard without affecting others.
      *   *Correction:* This makes Causal Necessity hard to verify. I should highlight that *perfect* causal isolation is likely impossible in superposed regimes.

  8.  **Final Polish:**
