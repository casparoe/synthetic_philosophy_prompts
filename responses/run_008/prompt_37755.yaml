      *   **Philosophical Stress Test:** Run the criteria against Deflationary, Realist, Pragmatic.
      *   **The "Wrong Question" Pivot:** If realism is incoherent, what do we do? Focus on *operational validity*.

  7.  **Refining the Tensions (Self-Correction during drafting):**
