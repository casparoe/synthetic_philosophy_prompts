      *   Make sure to explicitly answer the "thermostat" question.

  9.  **Final Review against constraints:**
      *   Did I list desiderata? Yes.
      *   Did I explain the case/consideration? Yes.
      *   Did I mark Realism vs. Technique? Yes.
      *   Did I flag incompatible pairs? Yes.
      *   Did I run against (a), (b), (c)? Yes.
      *   Did I address the "wrong question" hypothesis? Yes.

      *(Self-Correction on "Directions"):* The user mentioned "features are directions." I need to be clear that Linearity is a *technique assumption* (probing via linear classifiers), not necessarily a property of the representation itself.

      *(Self-Correction on "Inferential Role"):* This is basically "Conceptual Coherence." I'll use that term.

      *(Final check on Tensions):* The tension between *Causal Isolation* and *Superposition* is the most critical one to articulate clearly.

