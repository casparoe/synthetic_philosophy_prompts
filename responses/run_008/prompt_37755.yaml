answer: |-
  This is the right frustration. The field is stuck in a loop of "Look, I found a neuron!" vs. "It's just correlation!" because we haven't agreed on what counts as a *thing*.

  Here is the spec you asked for. I have refined your list into six desiderata, categorized by whether they are metaphysical commitments (Realism) or methodological conveniences (Technique), followed by the incompatibility theorems you suspect exist, and the philosophical stress test.

  ### The Desiderata: A Spec for "Representation"

  **1. Decodability (formerly Detectability)**
  *   **Requirement:** There exists a mapping (linear or non-linear) from the model's internal state to the concept $X$ that is significantly above chance and stable across inputs where $X$ is present.
  *   **Rationale:** If you cannot read it out, even in principle, it does not function as a representation for any downstream process (including the model itself).
  *   **Status:** **Load-bearing.** If a state carries no information about $X$, it is not a representation of $X$.
  *   **Technique Artifact:** The assumption that the mapping must be *linear* (a "direction"). This is a convenience of probing techniques, not a requirement of representation.

  **2. Causal Specificity (Necessity + Sufficiency refined)**
  *   **Requirement:**
      *   *Necessity:* Intervening on the candidate representation degrades performance on $X$-tasks specifically.
      *   *Sufficiency:* Activating the candidate representation induces $X$-behavior or $X$-consistent downstream activations, even in neutral contexts.
  *   **Rationale:** Distinguishes the representation from a mere correlate (e.g., "fur" correlates with "dog" but isn't the concept "dog").
  *   **Status:** **Load-bearing.** This is the difference between a map and the territory. Without causality, interpretability is just astrology.
  *   **Technique Artifact:** The expectation of *clean* isolation (see Tensions below).

  **3. Conceptual Coherence (formerly Inferential Role)**
  *   **Requirement:** The candidate representation participates in relationships with other internal features that mirror the logical/semantic relationships of the concept $X$ in the world. (e.g., if you find "king," subtracting "man" and adding "woman" should yield "queen," or at least move the state toward the "queen" subspace).
  *   **Rationale:** Prevents "grab bag" features. A "dog" feature that fires equally for "fire hydrants" and "poodles" is a "street scene" feature, not a "dog" feature.
  *   **Status:** **Load-bearing for Realism.** Essential if you claim the model *understands* $X$ rather than just discriminating it.
  *   **Technique Artifact:** Assuming these relationships must be Euclidean/vector-arithmetic. They could be graph-based or topological.

  **4. Robustness to Reparameterization**
  *   **Requirement:** The representation persists if the model's weights are transformed in ways that preserve the input-output function (e.g., scaling neurons, rotating layers where possible).
  *   **Rationale:** Prevents "lucky neuron" claims. If the representation disappears when you merge two neurons into one without changing the function, it wasn't a real structural feature, it was an artifact of the basis.
  *   **Status:** **Load-bearing.** Representations must be properties of the *function*, not the specific parameterization.
  *   **Technique Artifact:** Current methods often ignore this, focusing on specific weight matrices.

  **5. Portability (Cross-Model Stability)**
  *   **Requirement:** The same representation (or structurally isomorphic one) appears in independently trained models solving similar tasks.
  *   **Rationale:** Distinguishes universal concepts from idiosyncratic heuristics.
  *   **Status:** **Convenience/Strong Evidence, not Strict Requirement.** A single model can genuinely represent $X$ in a unique way. However, lack of portability suggests the "concept" might be a dataset artifact rather than a learned abstraction.
  *   **Technique Artifact:** The expectation that features align across models (requires solving the "permutation alignment" problem).

  **6. Superposition Compatibility**
  *   **Requirement:** The definition of the representation must remain valid even if the feature is not localized to a single neuron or subspace, but is interference-coded across many dimensions.
  *   **Rationale:** Acknowledges the information-theoretic constraints of wide networks.
  *   **Status:** **Load-bearing.** Any spec that requires 1-to-1 neuron-to-concept mapping is falsified by modern scaling laws.
  *   **Technique Artifact:** The hope that features will be *sparse*. They might be dense but structured.

  ---

  ### The Incompatibility Theorems (The Tensions)

  You suspected tensions. You were right. Here are the pairs that likely cannot be jointly satisfied to perfection.

  **1. Causal Specificity vs. Superposition Compatibility**
  *   **The Conflict:** Causal Specificity demands that you can intervene on Feature $A$ without affecting Feature $B$. Superposition dictates that Feature $A$ and Feature $B$ share the same physical substrate (neurons/dimensions).
  *   **The Consequence:** In a highly superposed regime, *perfect* causal isolation is mathematically impossible. Intervening on a direction in superposition will inevitably introduce noise into other features sharing that subspace.
  *   **Verdict:** You must downgrade Causal Specificity to **Causal Statistical Influence**. You can show that intervening on $A$ shifts the probability of $X$-behavior significantly more than non-$X$ behavior, but you cannot get the clean "switch flip" of the early neuron-viz days. If you demand perfect modularity, you must deny superposition.

  **2. Conceptual Coherence vs. Decodability (Linearity)**
  *   **The Conflict:** Conceptual Coherence implies rich, structured relationships (logic, hierarchy). Decodability is often measured via linear probes.
  *   **The Consequence:** If the representation is highly compressed (superposition), the relationship between the internal code and the human concept may be non-linear. A linear probe might fail (low Decodability) even if the model possesses a coherent internal logic (High Coherence).
  *   **Verdict:** Relying on linear probe accuracy as the gold standard for Decodability may falsely reject valid representations.

  **3. Portability vs. Optimal Compression**
  *   **The Conflict:** Portability assumes models converge on similar internal solutions. Optimal Compression suggests models will find the *shortest* path to the loss minimum given their specific random seed and data ordering.
  *   **The Consequence:** There may be no "fact of the matter" about where "dog" is stored because "dog" is not a primitive the optimizer cares about; *loss reduction* is. Different models may encode "dog" using entirely different circuitry that is functionally equivalent but structurally disjoint.
  *   **Verdict:** Portability is a hope, not a guarantee. Lack of portability does not disprove representation; it proves the representation is not a universal attractor.

  ---

  ### Philosophical Stress Test

  Here is how the spec runs against the three views you mentioned.

  **(a) The Deflationary View (Instrumentalism)**
  *   *Stance:* "Representation" is just a useful shorthand for predicting model behavior. There is no ontology inside the net.
  *   *Verdict on Spec:* Accepts **Decodability** and **Causal Specificity** (as predictive tools). Rejects **Conceptual Coherence** and **Portability** as metaphysical baggage.
  *   *Outcome:* Interpretability is just model compression. If the "dog circuit" story helps you predict failures, it's true enough. If not, discard it.

  **(b) Full Feature Realism**
  *   *Stance:* The network contains genuine, discrete entities corresponding to world concepts.
  *   *Verdict on Spec:* Demands all six, especially **Conceptual Coherence** and **Portability**.
  *   *Outcome:* Likely falsified by **Superposition Compatibility**. If features are interference-coded, they aren't "discrete entities." Realism must be updated to "Realism about Subspaces/Manifolds" rather than "Realism about Neurons."

  **(c) The Pragmatic In-Between (The Intentional Stance)**
  *   *Stance:* The network has representations *relative to an observer* who can successfully predict its behavior by attributing beliefs/goals to it (Dennett).
  *   *Verdict on Spec:* Focuses on **Causal Specificity** and **Decodability**. **Portability** and **Coherence** are graded measures of *how good* the intentional stance is, not binary truth conditions.
  *   *Outcome:* This is the most robust position. It allows you to say "This model represents 'dog'" is true *to the extent that* treating it as such allows successful intervention.

  ---

  ### Is the Question Confused?

  **Yes.** Asking "Does the network *really* have a representation?" is like asking "Does a JPEG *really* contain a face?"

  The JPEG contains pixels. The "face" is a pattern in those pixels that is decodable by a human visual system (or a face detector). The face is not in the bits; it is in the *relationship* between the bits and the decoder.

  **The Better Question:**
  > "Is there a stable subspace in the activation manifold such that treating it as a variable for concept $X$ allows us to **predict** and **control** the model's behavior with bounded error?"

  **What you should check for in papers:**
  1.  **Intervention Bounds:** Don't just show the mean shift. Show the variance. If I ablate this "feature," how often does it break *other* things? (Tests Causal Specificity vs. Superposition).
  2.  **Basis Independence:** Did they check if the feature exists in a different basis, or is it just an artifact of ReLU sparsity? (Tests Robustness).
  3.  **The "Anti-Feature":** If they claim a feature is "Dog," did they check that it *doesn't* fire for "Wolf" or "Fox" in confusing contexts? (Tests Conceptual Coherence).

  If a paper ignores the tension between superposition and causal isolation, it is selling a story, not a mechanism. If it acknowledges the tension and quantifies the leakage, it is science.
