prompt: |-
  I teach a seminar on formal epistemology, and this semester we're doing a unit on informal mathematical reasoning — Fermi estimates, back-of-envelope calculations, the kind of arguments people in crypto and computer security make when they say a hash function "has no backdoor" or that a pseudorandom generator "looks random" without any proof. My hook for the students is a case a friend of mine in finance uses: you estimate the value of two portfolios by noting portfolio A looks like about $2M and portfolio B looks like about $2M, and you conclude the combined thing is about $4M — even though both are stuffed with the same stocks, so if the market tanks they tank together. Treating them as independent is unarguably wrong as a matter of probability theory, and yet the estimate feels fine, and everyone from physicists to security auditors reasons this way constantly. There's a line of work (mostly coming out of the AI safety world, e.g. the "heuristic arguments" literature and attempts to formalize the presumption of independence) that wants to make this style of reasoning precise, and I want my students to evaluate those attempts against a spec rather than one at a time.

  So what I'd like from you is the spec itself: the list of desiderata that any adequate formal account of heuristic argument — a "heuristic estimator" that takes some argument and outputs a number or a credence, vindicating the reasoning-by-approximation we all actually do — has to meet. Think hard about which requirements are genuine and which are just prejudices imported from one approach: should such an account be sound in the sense of never producing confident garbage, or does demanding soundness immediately kill the whole project (since the two-portfolios trick gives wrong answers in the tails)? Does it need to capture the distinction between an argument that's merely unverifiable and one that's actually untrustworthy, like the difference between trusting SHA-256 and trusting a backdoored RNG? Should it generalize over the agent's epistemic state, i.e. two people with the same evidence and priors who run the same heuristic argument should get the same output? Should it license using arguments you don't fully trust, the way security people rely on standard assumptions? And which pairs of your desiderata are jointly unsatisfiable — that's the part I most want to see, since if the list can't be satisfied that's itself the interesting philosophical result, maybe the informal practice is just not formalizable.

  Don't give me a mealy survey of what different frameworks might maybe satisfy. Commit: tell me which desiderata you actually endorse, which you'd toss out and why, whether the whole project is coherent or whether "heuristic argument" names a family of things no single formalism can cover, and finish with your honest verdict on whether the formalization program can succeed or whether it's chasing something that dissolves under analysis. My students will score the actual proposals against your list in class, so keep the weight on the requirements and the motivating cases rather than on reviewing specific frameworks, though you can gesture at how logical-induction-style approaches or heuristic estimators would obviously do. Also, if you think one of my desiderata suggestions above is confused or question-begging, say so directly — I'd rather find out now than mid-lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A seminar on formal epistemology, unit on informal mathematical reasoning (Fermi estimates, crypto/security heuristics).
      *   **Hook:** The "Two Portfolios" case (adding correlated estimates as if independent). It's probabilistically wrong but pragmatically ubiquitous.
      *   **Goal:** Create a *specification* (list of desiderata) for a formal account of "heuristic argument" (a heuristic estimator).
      *   **Constraints:**
          *   Don't just survey existing frameworks.
          *   Commit to specific desiderata (endorse vs. toss).
          *   Identify tensions/impossibility results (which pairs are jointly unsatisfiable).
          *   Address the user's specific suggestions (soundness, trust vs. unverifiability, agent generalization, licensing untrusted arguments).
          *   Provide an honest verdict on the coherence of the project.
          *   Tone: Philosophical, rigorous, direct, suitable for a seminar leader.

  2.  **Deconstruct the Core Problem:**
      *   The core tension is between *normative correctness* (probability theory, logic) and *pragmatic utility* (speed, cognitive feasibility, robustness in complex systems).
      *   The "Two Portfolios" example highlights that heuristic reasoning often violates coherence (specifically, linearity of expectation under correlation ignorance) to achieve tractability.
      *   The AI Safety/Heuristic Arguments literature (Christiano et al., "Formalizing the Presumption of Independence") tries to bridge this.
      *   The user wants a *spec* to evaluate these attempts, not a review of the attempts themselves.

  3.  **Evaluate User's Suggested Desiderata:**
      *   *Soundness (never produce confident garbage):* If we demand strict soundness (truth in all models), we lose the ability to make non-deductive guesses. If we demand probabilistic calibration, we run into the "Two Portfolios" problem (systematic bias due to ignored correlation). *Verdict:* Needs refinement. "Asymptotic correctness" or "Calibration under reflection" is better than strict soundness.
      *   *Trust vs. Unverifiability (SHA-256 vs. Backdoor):* Crucial. A heuristic should distinguish between "I can't prove it but it's likely fine" and "I have positive reason to doubt."
      *   *Agent Generalization (Same evidence/priors -> same output):* This is "Objectivity." But heuristics often depend on computational limits. If Agent A has more compute, they might find a correlation Agent B misses. *Verdict:* Relativize to computational resources, not just priors.
      *   *Licensing Untrusted Arguments:* Security relies on assumptions (e.g., "factoring is hard"). The system must allow conditional acceptance.

  4.  **Drafting the Desiderata (Iterative Process):**

      *   *Attempt 1 (Standard Probabilistic):* Coherence, Calibration, Convergence.
      *   *Critique 1:* This kills the project. Heuristics are *incoherent* by design to save compute. The "Two Portfolios" case is incoherent but useful.
      *   *Attempt 2 (Computational/Complexity):* Polynomial time, Robustness to noise.
      *   *Critique 2:* Too CS-focused. Misses the epistemic normativity.
      *   *Attempt 3 (The "Spec" Approach):* Focus on the *function* of the heuristic. It's a map from (Claim, Argument, Context) to Credence.

      *   *Selected Desiderata:*
          1.  **Computational Tractability:** It must be faster than deduction.
          2.  **Respect for Deduction:** If a proof exists, the heuristic must agree.
          3.  **Linearity of Expectation (The Portfolio Test):** This is the tricky one. The user notes adding $2M + $2M = $4M is "wrong" probabilistically but "fine" heuristically. Actually, Linearity of Expectation *holds* regardless of correlation ($E[X+Y] = E[X] + E[Y]$). The error isn't in the sum, it's in the *variance* estimation. So the desideratum should be about *additivity of estimates* vs. *accuracy of uncertainty*. Let's call this **Additive Consistency**.
          4.  **Defeasibility:** New evidence (e.g., "these stocks are identical") should update the estimate.
          5.  **Security/Adversarial Robustness:** Distinguishing "hard to break" from "backdoored."

  5.  **Identifying Impossibility Tensions:**
      *   *Tension 1: Tractability vs. Coherence.* You can't have a tractable estimator that is perfectly coherent (probabilistically) over a rich language (due to logical uncertainty results).
      *   *Tension 2: Objectivity vs. Resource Relativity.* If heuristics depend on compute, two agents with different compute shouldn't necessarily agree.
      *   *Tension 3: The "Two Portfolios" Paradox.* If the estimator respects Additivity ($E[A+B] = E[A] + E[B]$), it cannot simultaneously respect Correlation Awareness without intractable computation.

  6.  **Developing the Verdict:**
      *   Is the project coherent? Yes, but not as a "True Logic." It's a "Resource-Bounded Epistemology."
      *   The "Heuristic Estimator" isn't finding *The Truth*; it's finding *The Best Guess Given Limits*.
      *   The verdict should be: The project succeeds only if it abandons the goal of being a *normative ideal* and accepts being a *descriptive/functional ideal* for bounded agents.

  7.  **Refining the Output (incorporating the "Commit" instruction):**
      *   I need to be punchy. No "on the one hand."
      *   I need to explicitly validate or invalidate the user's specific examples.
      *   I need to structure it as a Spec Document.

      *(Self-Correction during drafting)*: Wait, the user's portfolio example says "Treating them as independent is unarguably wrong... and yet the estimate feels fine."
      *   Actually, $E[A+B] = E[A] + E[B]$ is *always* true, even if correlated. The error is in the *risk assessment* (variance), not the *expected value*.
      *   If the heuristic outputs a point estimate ($4M), it is correct.
      *   If the heuristic outputs a confidence interval ("$4M \pm 100k"), that is where the independence assumption breaks.
      *   *Crucial Insight:* The spec must distinguish between Point Estimates (which can be linear) and Uncertainty Quantification (which must capture correlation). Most heuristic arguments fail at the latter. I should make this a central desideratum.

  8.  **Finalizing the Desiderata List:**
      1.  **Deductive Closure (on known proofs):** Don't contradict math.
      2.  **Additivity of Point Estimates:** $E[A+B] = E[A] + E[B]$ (Vindicates the portfolio sum).
      3.  **Correlation Sensitivity (in Variance):** If correlation is known, uncertainty must reflect it. (The portfolio failure mode).
      4.  **Adversarial Robustness:** Distinguish "unproven" from "compromised."
      5.  **Computational Boundedness:** Must be feasible.

  9.  **Identifying the "Impossible Trinity":**
      *   You can't have (1) Strict Coherence, (2) Computational Tractability, and (3) Expressive Richness.
      *   Specifically for heuristics: You can't have (1) Additivity, (2) Correlation Sensitivity, and (3) Tractability simultaneously in complex systems. You usually sacrifice Correlation Sensitivity for Tractability.

  10. **Writing the Response:**
      *   Adopt the persona of a rigorous philosophical consultant.
      *   Structure: Introduction -> The Spec (Desiderata) -> The Tensions (Impossibility) -> The Verdict.
      *   Address the user's specific points (Soundness, Trust, etc.) within these sections.

      *(Refining the "Soundness" point)*: The user asks if demanding soundness kills the project. Yes, strict soundness kills it. But "Asymptotic Soundness" (converging to truth as resources $\to \infty$) is the right target. I will endorse this modification.

      *(Refining the "Portfolio" point)*: I need to correct the user slightly. The point estimate is fine. The *uncertainty* is wrong. The spec must demand the estimator output *both* or distinguish them.

      *(Final Polish)*: Ensure the tone is challenging but helpful for a seminar context. Make sure the "Verdict" is clear.

  11. **Final Review against constraints:**
      *   Did I commit? Yes.
      *   Did I avoid surveying frameworks? Yes, focused on spec.
      *   Did I address the impossibility results? Yes.
      *   Did I address the user's specific examples? Yes.

      *Let's write.*
answer: |-
  Here is the specification you requested. I have stripped away the hedging. This is not a survey of what exists; it is a normative target for what a formal account of heuristic reasoning *ought* to be, followed by an analysis of why hitting that target might be impossible.

  I endorse **five core desiderata**. I reject **two** common intuitions (including one of your suggestions) as fatal to the project. I conclude with an impossibility result that you can hand to your students as the central problem of the unit.

  ### Part 1: The Spec (Desiderata for a Heuristic Estimator)

  Let $\mathbb{H}$ be a heuristic estimator. It takes as input a proposition $\phi$, a set of arguments/evidence $E$, and a computational budget $C$. It outputs a credence $p \in [0,1]$ (or an expected value) and an uncertainty metric $\sigma$.

  **1. Deductive Respect (The Floor)**
  If there exists a formal proof of $\phi$ within the agent's background theory accessible within budget $C$, $\mathbb{H}(\phi, E, C)$ must output probability 1. If there is a proof of $\neg \phi$, it must output 0.
  *   *Why:* Heuristic reasoning is a substitute for deduction, not a rival. If the math is done, the heuristic must yield.
  *   *Status:* **Endorsed.** Any framework that allows a heuristic to contradict a known proof is broken.

  **2. Additivity of Expectation (The Portfolio Vindication)**
  For any two quantities $X$ and $Y$, $\mathbb{E}[X + Y] = \mathbb{E}[X] + \mathbb{E}[Y]$, regardless of known correlations.
  *   *Why:* This vindicates your finance friend's move. The expected value of the combined portfolio *is* the sum of the expected values, even if they are perfectly correlated. The error in the "Two Portfolios" case is not in the point estimate ($4M); it is in the risk assessment (variance). A heuristic estimator must get the linearity of expectation right, even if it lacks the compute to model the covariance.
  *   *Status:* **Endorsed.** This separates "heuristic error" from "mathematical error."

  **3. Correlation Sensitivity in Uncertainty (The Portfolio Constraint)**
  While point estimates must be additive, the uncertainty metric $\sigma$ must be sensitive to explicitly represented correlations. If the input $E$ contains the fact "Portfolio A and B hold identical assets," $\mathbb{H}$ must output a $\sigma$ for the sum that reflects $\text{Var}(X+Y) \approx 4\text{Var}(X)$, not $2\text{Var}(X)$.
  *   *Why:* This captures the "unarguably wrong" part of your hook. A heuristic system that treats correlated risks as independent in its uncertainty bounds is dangerous, not just approximate.
  *   *Status:* **Endorsed.** This is where most "back-of-envelope" reasoning fails, and where a formal account must improve on practice.

  **4. Adversarial Robustness (The Crypto Distinction)**
  $\mathbb{H}$ must distinguish between *computational hardness* and *structural ignorance*. Specifically, $\mathbb{H}(\text{"SHA-256 is preimage resistant"})$ should be high, but $\mathbb{H}(\text{"This specific RNG has no backdoor"})$ should be sensitive to provenance.
  *   *Why:* In security, "I can't break it" (hardness) is different from "I trust the designer" (provenance). A formal heuristic account must model the difference between a problem that is hard to solve and a system that is rigged.
  *   *Status:* **Endorsed.** This requires the estimator to take "source" or "generation process" as part of the input $E$, not just the static proposition.

  **5. Asymptotic Convergence (Replacing Soundness)**
  As computational budget $C \to \infty$, $\mathbb{H}(\phi, E, C)$ must converge to the true logical probability (or truth value) of $\phi$.
  *   *Why:* You asked about **Soundness** (never producing confident garbage). I reject strict Soundness as a desideratum. If you demand that a heuristic never be confidently wrong, you forbid it from making guesses. You must instead demand that it becomes *less* wrong as it thinks longer.
  *   *Status:* **Endorsed (with modification).** Strict soundness kills the project. Asymptotic correctness saves it.

  ***

  ### Part 2: The Rejections (What to Toss)

  **1. Rejection: Strict Probabilistic Coherence**
  Do not demand that $\mathbb{H}$ satisfy $P(A \land B) = P(A)P(B|A)$ at finite budgets.
  *   *Reason:* This is the "prejudice imported from probability theory." Heuristic reasoning is useful precisely because it violates coherence to save compute. Demanding coherence forces the estimator to do intractable Bayesian updates, which defeats the purpose of a heuristic. The "Two Portfolios" reasoning is incoherent regarding risk, but we accept it because coherence is expensive.

  **2. Rejection: Agent Neutrality (Your "Generalization" Suggestion)**
  You asked if two people with the same evidence/priors should get the same output. I say **No**.
  *   *Reason:* Heuristic reasoning is inherently resource-relative. If Agent A has a GPU cluster and Agent B has a notebook, they should output different credences for the same cryptographic claim. Agent A might find a collision that Agent B misses. A formal spec for heuristics must be indexed to *computational capacity*, not just epistemic state. Demanding agent neutrality forces the estimator to be omniscient relative to the union of all agents' compute, which is impossible.

  ***

  ### Part 3: The Impossibility Result (The "Gotcha" for Students)

  Here is the tension you can use to break the proposals in class. It is a variation of the **Logical Uncertainty Trilemma**.

  **Theorem:** No heuristic estimator $\mathbb{H}$ can simultaneously satisfy **Deductive Respect**, **Additivity**, and **Tractability** over a sufficiently rich language (e.g., arithmetic) while maintaining **Calibration**.

  **The Conflict:**
  1.  **Tractability** requires $\mathbb{H}$ to make estimates quickly (polynomial time).
  2.  **Deductive Respect** requires $\mathbb{H}$ to recognize proofs if they are found.
  3.  **Calibration** requires that when $\mathbb{H}$ says "90% confidence," it is right 90% of the time.

  **The Problem:**
  To maintain Calibration while being Tractable, $\mathbb{H}$ must assign probabilities based on patterns (heuristics). However, in a rich language, there will always be "adversarial propositions" constructed specifically to exploit those patterns (Gödelian sentences or cryptographic traps).
  *   If $\mathbb{H}$ assigns a high probability to a heuristic pattern (e.g., "digits of $\pi$ look random"), an adversary can construct a proposition that fits the pattern but is false.
  *   If $\mathbb{H}$ is Tractable, it cannot check the truth of that proposition before assigning probability.
  *   Therefore, it will be confidently wrong (violating Calibration/Asymptotic Convergence).
  *   To fix this, it must slow down to check for traps (violating Tractability).

  **Specific Application to Your Portfolio Case:**
  There is a tension between **Additivity of Point Estimates** and **Correlation Sensitivity in Uncertainty**.
  *   To be Additive, $\mathbb{H}$ treats $X$ and $Y$ locally.
  *   To be Correlation Sensitive, $\mathbb{H}$ must analyze the joint distribution of $X$ and $Y$.
  *   In high-dimensional systems (like a portfolio of 1,000 stocks, or a cryptographic circuit with 1,000 gates), analyzing all pairwise correlations is $O(N^2)$.
  *   **The Spec demands both Tractability ($O(N)$) and Correlation Sensitivity ($O(N^2)$).**
  *   **Verdict:** You cannot have both. A formal account must admit that heuristic reasoning *necessarily* underestimates tail risk in complex systems.

  ***

  ### Part 4: The Verdict

  **Is the formalization program coherent?**
  Yes, but only if it abandons the dream of being a *Logic of Discovery* and accepts being a *Theory of Bounded Rationality*.

  **Can it succeed?**
  It cannot succeed in producing a "Heuristic Estimator" that is both safe and useful in the way your finance friend wants.
  *   If it is **safe** (respects correlations, asymptotically sound), it will be too slow to be a heuristic (it collapses into deduction).
  *   If it is **useful** (fast, additive, ignores complex correlations), it will be formally "unsound" in the tails (it will miss black swans).

  **My Honest Advice for the Seminar:**
  Tell your students that the "Heuristic Arguments" literature (Christiano et al.) is attempting to square this circle by defining a "Presumption of Independence." They argue that we should treat variables as independent *unless* we have a specific argument for dependence.

  **The Critique:** This is not a formal solution; it is a formalization of the bias. It codifies the "Two Portfolios" error as a feature.
  *   If your students evaluate proposals against **Desideratum 3 (Correlation Sensitivity)**, most heuristic formalisms will fail.
  *   If they evaluate against **Desideratum 5 (Asymptotic Convergence)**, the systems will be too slow to be useful.

  **Final Conclusion:**
  The project of formalizing heuristic argument is not about finding a *correct* logic. It is about mapping the **trade-off surface** between computational cost and epistemic risk. A successful formal account won't tell you "this argument is valid." It will tell you "this argument costs $X$ compute and has a $Y\%$ chance of missing a correlation."

  If a proposal claims to give you the benefits of heuristic speed with the guarantees of probabilistic coherence, it is selling magic. Your spec should expose that magic trick.
