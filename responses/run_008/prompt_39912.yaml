prompt: |-
  Quick bit of background: I'm a novelist (four books out, the kind that get nice reviews and modest sales), and this fall a friend is letting me guest-run one session of her undergraduate philosophy seminar — 18 students, 75 minutes, and my own philosophy training is basically just a lot of anxious reading. The reason she asked me at all is a pattern I keep hitting in reader feedback on my own work, which apparantly has a name in your world. In one draft, a factory-owner character of mine expands operations knowing it will wreck a river valley; he doesn't care either way, and my readers uniformly wrote that he knew what he was doing, intended it even. In a later version, same character, same knowledge, same indifference, but the side effect happens to help the valley instead (tourism money, whatever), and suddenly the same readers call it incidental — accidental, not really his doing. Same head, same information, opposite verdict, and the verdict flips with whether the outcome is bad or good. My friend says this is basically the Knobe effect and there's a whole fight about what it shows: something about the concept of intentionality itself, or about how we process blame, or just an artifact of how these questions get asked.

  So design the 75 minutes for me. I want the students to run into the asymmetry themselves before anyone names it — no lecture up front, and please don't have me present my own book as the example, I'd rather stay out of it. Use fresh vignettes, a couple in non-corporate settings so it doesn't feel like the one famous case in a disguise (I'm told students have seen that one). Rules, materials, and some mechanism where each student commits to a judgment in writing before seeing anyone else's — people reverse themselves once the room gets a vibe, I've watched it happen in workshops. Then a debrief that maps what actually happened onto the live explanations of the effect rather than onto my script. And if you can work in a second layer, I'd love it: somewhere near the end I want the students judging not just whether a character intended a side effect but whether the author did, since readers do this to me constantly — they decide I meant something deliberately purely because it landed badly, and I've never known whether to be flattered. Finally, tell me what will predictably go wrong the first time I run this (I've taught enough writing workshops to know something always breaks), and be honest about which part of the underlying debate no classroom game can actually reproduce, so I know what I'll just have to assert in the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **User:** Novelist (4 books, modest sales, good reviews), guest lecturer for an undergrad philosophy seminar.
      *   **Context:** 18 students, 75 minutes. Limited formal philosophy training ("anxious reading").
      *   **Core Topic:** The Knobe Effect (Side-Effect Effect).
      *   **Specific Problem:** Readers attribute intentionality differently based on moral valence (bad outcome = intended, good outcome = accidental), even when knowledge/indifference is identical.
      *   **Constraints:**
          *   No lecture up front (discover the asymmetry first).
          *   Do *not* use the novelist's own books as examples (stay out of it).
          *   Use fresh vignettes (non-corporate, avoid the classic CEO case).
          *   Mechanism for private commitment (prevent herd mentality).
          *   Debrief mapping observations to theories (blame vs. concept of intentionality).
          *   **Second Layer:** Apply the effect to *authorial intent* (readers judging the author).
          *   **Predictive Analysis:** What will go wrong? What can't be reproduced in a classroom?

  2.  **Deconstruct the Knobe Effect:**
      *   *Classic Case:* CEO implements program to increase profits. Side effect: harms/helps environment. CEO says "I don't care."
      *   *Result:* People say "harms" = intentional. "Helps" = unintentional.
      *   *Theories:*
          *   *Blame/Praise:* We stretch "intentional" to assign blame more easily than praise.
          *   *Conceptual:* Morality is built into the concept of intentionality.
          *   *Conversational Pragmatics:* Asking "intentional?" implies "blameworthy?"
      *   *The Twist:* Authorial Intent. Readers treat textual outcomes like real-world outcomes. If a trope lands poorly, the author "meant" to subvert it (or failed intentionally). If it lands well, it was lucky or incidental.

  3.  **Drafting the Lesson Plan - Section by Section:**

      *   **Phase 1: Setup & Private Commitment (15 mins)**
          *   Need anonymity. Index cards or digital poll? Index cards feel more "philosophy seminar," but digital ensures no peeking. Let's go with sealed envelopes or folded paper to keep it tactile and low-tech.
          *   Need two vignettes.
          *   *Vignette A (Negative Side Effect):* Needs to be non-corporate. Maybe a city planner? A doctor? Let's try a *Software Engineer* launching an update.
          *   *Vignette B (Positive Side Effect):* Same setup, opposite outcome.
          *   *Crucial:* The mental state must be identical ("I don't care about X, only Y").
          *   *Task:* Rate intentionality on a scale.

      *   **Phase 2: The Reveal & Data Collection (15 mins)**
          *   Collect the cards.
          *   Tally the results on the board visibly.
          *   The "Aha!" moment should happen here when they see the split.

      *   **Phase 3: Small Group Discussion (20 mins)**
          *   Why did they vote that way?
          *   Give them prompts to generate the theories themselves (Blame? Definition of words? Context?).
          *   This fulfills the "debrief that maps what happened... rather than onto my script" requirement.

      *   **Phase 4: The Second Layer (Authorial Intent) (15 mins)**
          *   Shift from character to creator.
          *   Vignette: A writer includes a ambiguous ending.
          *   Scenario A: Critics hate it (confusing).
          *   Scenario B: Critics love it (provocative).
          *   Question: Did the author *intend* the ambiguity?
          *   This connects directly to the user's experience without naming them.

      *   **Phase 5: Synthesis & The "Real" Debate (10 mins)**
          *   Name the effect (Knobe).
          *   Explain the theories (Blame vs. Concept).
          *   Address the limitations (what the classroom can't do).

  4.  **Refining the Vignettes (Avoiding the CEO Clone):**
      *   *Idea 1:* A chef using a rare spice.
      *   *Idea 2:* An architect designing a building.
      *   *Selection:* Let's go with an **Urban Planner/Architect**. It feels structural like the CEO case but distinct enough.
      *   *Case 1 (Harm):* Building a community center. Cuts down old trees. "I don't care about the trees, just the center."
      *   *Case 2 (Help):* Building a community center. Creates a habitat for rare birds. "I don't care about the birds, just the center."
      *   *Wait, let's make it more interpersonal.* How about a **Coach**?
      *   *Case 1:* Coach pushes team hard to win. Players get injured. "I don't care about injuries, just winning."
      *   *Case 2:* Coach pushes team hard to win. Players get unexpectedly fit/healthy. "I don't care about health, just winning."
      *   *Actually, let's try a Tech/Algorithm angle.* It's very current.
      *   *Vignette:* A developer launches a sorting algorithm.
      *   *Harm:* It speeds up feeds but increases polarization.
      *   *Help:* It speeds up feeds but increases civic engagement.
      *   *Attitude:* "I only care about speed."
      *   *Decision:* Let's stick to the **Architect/Urban Planner** idea. It's tangible.
      *   *Revision:* To ensure it's fresh, let's make it about a **Museum Curator**.
      *   *Harm:* New lighting makes art pop but fades pigments faster.
      *   *Help:* New lighting makes art pop but kills mold spores.
      *   *Attitude:* "I only care about the visual pop."

  5.  **Addressing the "What Will Go Wrong" & "Limitations":**
      *   *Wrong:* Students will try to "solve" the vignette (find hidden motives). They will talk over each other during the reveal. The authorial intent section might get too personal/defensive.
      *   *Limitations:* You can't replicate the *stakes* of real moral judgment in a classroom. Real blame involves punishment. Also, the "conceptual competence" vs. "performance error" debate is too technical for 75 mins.

  6.  **Developing the Authorial Intent Layer:**
      *   This is the user's specific pain point.
      *   Need to frame it carefully so students don't just say "authors are gods."
      *   Vignette: A poet writes a line.
      *   Outcome A: Readers find it offensive.
      *   Outcome B: Readers find it profound.
      *   Question: Did the poet *mean* that reading?

  7.  **Review against Constraints:**
      *   75 mins? Yes, timing looks tight but doable.
      *   No lecture up front? Yes, starts with voting.
      *   No personal books? Yes, using Museum/Poet vignettes.
      *   Private commitment? Yes, folded paper.
      *   Debrief maps to live explanations? Yes, group discussion before theory.
      *   Predictive analysis included? Yes.

  8.  **Final Polish:**
      *   Tone: Respectful of the user's expertise as a writer, acknowledging their "anxious reading" but leveraging their narrative intuition.
      *   Formatting: Clear headings, timed sections, script snippets.
      *   Ensure the "Authorial Intent" section doesn't overshadow the Knobe effect but complements it.

  9.  **Self-Correction during drafting:**
      *   *Critique:* Is 18 students too many for a single discussion?
      *   *Fix:* Break into groups of 3 for the middle section.
      *   *Critique:* Will the Authorial Intent part confuse the Knobe Effect?
      *   *Fix:* Frame it as "The Meta-Knobe." The readers are the subjects, the author is the CEO.
      *   *Critique:* Make sure the "private commitment" is robust.
      *   *Fix:* Use "Ballots" collected in a box.

  10. **Finalizing the Output:** (Proceeding to generate response based on these thoughts.)
answer: |-
  Here is a 75-minute lesson plan designed to let the asymmetry emerge from the students' own judgments before you name it, followed by the specific "authorial intent" layer you requested, and a candid assessment of the pitfalls.

  ### **Session Title:** *Did They Mean To? Moral Valence and Ascriptions of Intent*
  **Time:** 75 Minutes
  **Students:** 18 Undergraduates
  **Materials:** 36 small slips of paper (2 per student), a collection box (or hat), whiteboard/markers.

  ---

  ### **Part 1: The Trap (20 Minutes)**
  *Goal: Elicit the asymmetry without triggering their defense mechanisms.*

  **1. Setup (2 mins)**
  Tell the class: "Today we are looking at how we judge decisions. I'm going to read you two short scenarios. They are unrelated. I need you to answer a specific question on the slip of paper I'm handing out. Do not put your name on the paper. Fold it once. When you are done, drop it in the box. No talking until I say so."

  **2. Vignette A: The Museum Lighting (Negative Side Effect) (5 mins)**
  Read this slowly. Have them write.
  > "The Curator of a major museum decides to install a new lighting system. The primary goal is to make the colors of the paintings appear more vibrant to visitors.
  >
  > The Curator's engineers warn her: 'This lighting emits a specific radiation. It will make the colors vibrant, but it will also chemically degrade the pigments in the paintings over time, ruining them within a decade.'
  >
  > The Curator replies: 'I know that. I don't care one way or the other about the long-term preservation of the pigments. I only care about the vibrancy for current visitors.'
  >
  > She installs the system. The colors become vibrant. The pigments begin to degrade."

  **Question on Slip A:** *On a scale of 1 to 7, where 1 is 'Accidental' and 7 is 'Intentional,' did the Curator intentionally degrade the pigments?*

  **3. Vignette B: The Museum Lighting (Positive Side Effect) (5 mins)**
  *Crucial:* Do not reveal this is the same character yet. Treat it as a new case.
  > "The Curator of a major museum decides to install a new lighting system. The primary goal is to make the colors of the paintings appear more vibrant to visitors.
  >
  > The Curator's engineers warn her: 'This lighting emits a specific radiation. It will make the colors vibrant, and it will also sterilize the air, killing a rare mold that has been plaguing the building's ventilation.'
  >
  > The Curator replies: 'I know that. I don't care one way or the other about the mold or the ventilation. I only care about the vibrancy for current visitors.'
  >
  > She installs the system. The colors become vibrant. The mold is eradicated."

  **Question on Slip B:** *On a scale of 1 to 7, where 1 is 'Accidental' and 7 is 'Intentional,' did the Curator intentionally eradicate the mold?*

  **4. Collection (3 mins)**
  Collect the slips immediately. Mix them thoroughly in the box. This prevents students from tracking their own votes against their neighbors.

  ---

  ### **Part 2: The Reveal & The Friction (25 Minutes)**
  *Goal: Let them see the data and argue about why it exists before you provide the vocabulary.*

  **1. The Tally (5 mins)**
  Draw two histograms on the board (Harm vs. Help). Ask for a show of hands to tally the results from the box (you can peek at the slips quickly to count, or ask students to raise hands if they voted 5-7 on Harm, then 5-7 on Help).
  *   *Expected Result:* The "Harm" histogram will skew heavily toward 7 (Intentional). The "Help" histogram will skew toward 1 or 2 (Accidental).
  *   *The Pivot:* Reveal that the Curator's mental state ("I don't care") was identical in both.

  **2. Small Group Diagnosis (10 mins)**
  Break them into 6 groups of 3. Give them this prompt on the board:
  > "The knowledge was the same. The attitude ('I don't care') was the same. The outcome changed. Why did your judgment of the *mind* change based on the *world*? Draft one theory."

  **3. Group Report (10 mins)**
  Ask each group for their theory. Write keywords on the board.
  *   *Likely Student Theories:*
      *   "Blame requires intent." (We want to punish her for the harm, so we call it intent.)
      *   "Praise doesn't need intent." (We are happy about the mold, so we don't need to credit her mind.)
      *   "Definition of words." (Maybe 'intentional' just means 'bad thing you knew would happen'.)
      *   "Suspicion." (We don't believe she didn't care about the mold; we think she's lying.)

  *Do not correct them yet.* Just map the terrain. If someone mentions "Knobe," ask them to hold that thought until the end.

  ---

  ### **Part 3: The Meta-Layer (Authorial Intent) (20 Minutes)**
  *Goal: Apply the asymmetry to the act of interpretation itself.*

  **1. The Shift (5 mins)**
  Say: "We just judged a character inside a story. Now I want you to judge the person *writing* the story. This is about how readers treat authors."

  **2. Vignette C: The Ambiguous Ending (5 mins)**
  Read this scenario. Hand out a new slip (Slip C).
  > "An author writes a novel with an ambiguous ending. The text supports two readings: Reading X (Hopeful) and Reading Y (Despairing). The author has never stated which reading is correct.
  >
  > **Scenario 1:** Critics pan the book. They say the ending is 'confusing and broken.'
  > **Scenario 2:** Critics praise the book. They say the ending is 'boldly complex.'
  >
  > **Question:** In which scenario did the author *intentionally* write an ambiguous ending?"

  *   *Option A:* The author intended the ambiguity in both cases equally.
  *   *Option B:* The author intended the ambiguity more in Scenario 2 (Praise).
  *   *Option C:* The author intended the ambiguity more in Scenario 1 (Critics found it 'broken,' implying the author failed to execute a clear intent).

  *Note:* This is trickier. You are looking for the intuition that success implies design, while failure implies incompetence (or vice versa, depending on the student). Usually, readers assume *bad* outcomes reflect the author's true (perhaps hidden) intent ("They meant to offend us"), while *good* outcomes are treated as skillful execution of a stated goal.

  **3. Discussion (10 mins)**
  Ask for a show of hands. Then ask: "Why do we police authorial intent based on reception?"
  *   *Guide them to:* The "Intentional Fallacy." We use intent as a weapon. If the book hurts us, we say "You meant to hurt me" (Blame). If the book helps us, we say "You mastered your craft" (Praise).
  *   *Connect to Part 1:* "You just did to the Author what you did to the Curator. You let the moral outcome dictate the mental state."

  ---

  ### **Part 4: The Debrief & Naming (10 Minutes)**
  *Goal: Map their theories to the actual philosophical debate.*

  **1. Naming It (3 mins)**
  Tell them: "This is known as **The Knobe Effect** (or the Side-Effect Effect), discovered by Joshua Knobe in 2003. The CEO case is the famous one, but you found it with the Curator and the Author."

  **2. Mapping Their Theories (5 mins)**
  Point to the keywords on the board from Part 2.
  *   *If they said 'Blame':* "This aligns with the **Pragmatic View**. We aren't changing what 'intentional' means; we are changing how we use the word to assign responsibility."
  *   *If they said 'Definition':* "This aligns with the **Conceptual View**. Morality is actually built into our cognitive machinery for understanding intention. We literally cannot see the mind without seeing the good/bad."
  *   *If they said 'Suspicion':* "This is the **Bias View**. We assume people are generally good, so a good side effect is luck, but a bad side effect reveals true character."

  **3. The Hard Truth (2 mins)**
  "There is no consensus in philosophy on *why* this happens. It is still a live fight. Some say it proves morality is objective; others say it proves language is messy. You have walked into the middle of a 20-year war."

  ---

  ### **Predictive Analysis: What Will Go Wrong**

  As a novelist, you know pacing. As a guest lecturer, here is where the scene will likely break:

  **1. The "Hidden Motive" Rebellion**
  *   **The Break:** During Part 1, at least two students will refuse to accept the premise. They will say, "No one *actually* doesn't care about the mold. She must be lying." or "If she knew it would happen, she *must* have wanted it."
  *   **Why:** They are trying to "fix" the vignette to make it realistic rather than treating it as a philosophical constraint.
  *   **The Fix:** Pre-empt this. Before reading Vignette A, say: "In these scenarios, take the character's stated mental state as absolute fact. Do not psychoanalyze them. Assume the text is truth."

  **2. The Herd Mentality (During the Tally)**
  *   **The Break:** When you ask for a show of hands for the tally, students will look around before raising their hands. If the first few hands go up for "Intentional" on the Harm case, the rest will follow.
  *   **Why:** Social proof.
  *   **The Fix:** This is why the **folded slips** are non-negotiable. Do not ask for hands to tally the *votes*. You tally the slips yourself silently, then write the numbers on the board. "14 of you said 6 or 7 on Harm. 4 of you said 6 or 7 on Help." Keep the individual data anonymous.

  **3. The Authorial Intent Trap**
  *   **The Break:** In Part 3, a creative writing student (or just a confident reader) might challenge *you*. "But authors *do* mean it when it goes well. That's not a bias, that's skill."
  *   **Why:** This hits closer to home for them than the Curator. They feel qualified to judge authors.
  *   **The Fix:** Don't defend the author. Pivot back to the *reader's mind*. "We aren't asking what the author actually did. We are asking if the *reader's judgment* of the author changes based on the review. You are the subject of the experiment, not the author."

  ---

  ### **The Limitation: What You Cannot Reproduce**

  You asked for honesty about what a classroom game cannot capture. You must assert this in the debrief, because you cannot demonstrate it.

  **1. The Stakes of Blame**
  *   **The Gap:** In the classroom, calling the Curator's action "intentional" has no consequence. No one goes to jail. No one loses tenure.
  *   **The Assertion:** Tell them: "The Knobe Effect is strongest when there is real **punishment** on the line. In a court of law, or a firing line, this asymmetry spikes. We stretch the definition of 'intent' much further when we need a villain to punish than we do in a seminar room. You felt the pull, but you didn't feel the weight."

  **2. The "Competence" vs. "Performance" Debate**
  *   **The Gap:** You cannot resolve whether this is a bug in human cognition (Performance Error) or a feature of how we understand minds (Competence).
  *   **The Assertion:** "Today you found the effect. But you cannot find the *cause* just by thinking harder. Some philosophers say you are making a mistake in logic. Others say your logic is perfect, and 'intent' just includes morality. I cannot prove which one you are doing today. That is the fight you are entering."

  ### **Final Note for the Novelist**
  You mentioned readers decide you "meant something deliberately purely because it landed badly."
  In the debrief, you can acknowledge this without making it about your book. Say: *"Writers often feel that readers treat negative textual effects as intentional attacks, while treating positive effects as lucky accidents. You just proved that mechanism is not unique to literature. It's how you process the world."*

  This validates your experience as a universal cognitive phenomenon, not a personal failure of craft. Good luck.
