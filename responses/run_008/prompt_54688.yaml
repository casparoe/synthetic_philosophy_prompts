prompt: |-
  I'm preparing a seminar session on what, if anything, Arrow's impossibility theorem implies for the design of real-world collective decisions. The concrete case I want to discuss is a university department of roughly twenty people that needs a standing voting rule it can reuse whenever it faces a choice among several options: hiring one of several job candidates, picking one of several seminar speakers, settling on one of several meeting times, and so on. Since Arrow's result tells us that no aggregation rule can satisfy all of his conditions at once when there are three or more options, the department must decide which condition to treat as most expendable. Please rank the four conditions — unrestricted domain, the Pareto condition, non-dictatorship, and independence of irrelevant alternatives — from the one the department should be most reluctant to sacrifice to the one it should give up first, and give a couple of sentences of reasoning for each placement in the ordering. Then close with a short paragraph on what the department should realistically expect to go wrong once its most expendable condition is dropped, and on whether it could cushion that failure through other means, such as changes to how the option set is assembled or to how ballots are collected. Please respond in continuous prose only, with no headings, bullet points, bold text, or tables — write it as if it were a letter to a colleague.
