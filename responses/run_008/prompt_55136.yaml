  **The Thermal Manifold**

  A solid copper casting is shaped exactly like a human connectome, with nodes representing neurons and bridges representing synapses. Input lasers fire heat pulses at sensory nodes matching a specific stimulus sequence. The heat diffuses through the copper bridges according to thermodynamic laws strictly isomorphic to neural activation functions, causing temperature peaks at motor nodes that trigger output switches. The system runs at biological speeds, uses no software or discrete components, and relies entirely on passive thermal diffusion without active signal regeneration.

  **(1) Functionalist Derivation:** Functionalism identifies mental states with causal roles within a network. The copper's temperature distributions play the exact causal roles of neural states (input → internal state → output). Since the causal topology is preserved at normal speeds, the theory is on the hook for attributing beliefs and pains to the copper.

  **(2) The Feature:** The anti-functionalist work is done by **Causal Passivity**. The "states" are merely transient heat dissipations lacking active maintenance or homeostatic stability. The system does not *sustain* states; it merely *undergoes* decay.

  **(3) Deletion:** If you add active amplifiers to regenerate signals (deleting passivity), it becomes a standard neuromorphic computer. The absurdity vanishes; it collapses into a boring, harmless MR case (silicon mind), confirming the passivity is the source of tension.

  **(4) Best Reply & Evaluation:** The functionalist must claim "Active maintenance is not necessary for functional roles." This is an **ad hoc patch**. Standard functionalism implicitly assumes stable states to individuate roles; excluding passive decay requires adding a new constraint not originally in the theory, solely to avoid the absurd verdict. Unlike the "geological time" reply (which appeals to grain), this requires changing the definition of a "state" itself.
