answer: |-
  # SEMINAR HANDOUT: MAPPING MORAL LUCK
  **Course:** Advanced Moral Philosophy | **Time:** 20 Minutes | **Start:** The Control Principle

  **STARTING COMMITMENT:** *"A person's degree of blameworthiness can only depend on factors within their control."*  
  *Follow the path that matches your intuitive judgment of the cases below.*

  ---

  ### NODE 1: THE DRUNK DRIVERS (Resultant Luck)
  **Case:** Two drivers drive equally recklessly home. One hits a child; one arrives unnoticed.
  **Q:** Is the driver who killed the child **more blameworthy** than the one who did not?
  *   **YES** → Go to **Node 2**.
  *   **NO** (They are equally blameworthy) → Go to **Node 3**.

  ### NODE 2: THE GERMAN EMIGRÉ (Circumstantial Luck)
  **Case:** A man emigrates in 1932. Had he stayed, he would have become a Nazi functionary (same character, different circumstance).
  **Q:** Is the emigré **morally better** than the man who stayed and became a Nazi?
  *   **YES** → **LEAF A: The Luck Accepter**
  *   **NO** (Circumstance doesn't change moral status) → **LEAF B: The Resultant-Only Theorist**

  ### NODE 3: THE STRUGGLING TEMPERAMENT (Constitutive Luck)
  **Case:** A person of vicious temperament struggles daily to be decent vs. a naturally gentle person who is decent with no effort. Both behave equally well.
  **Q:** Is the struggler **more praiseworthy** than the naturally gentle person?
  *   **YES** → **LEAF C: The Mixed Theorist**
  *   **NO** (Temperament doesn't change praise) → Go to **Node 4**.

  ### NODE 4: THE PAINTER (Retrospective Justification)
  **Case:** Gauguin abandons his family for art. He succeeds brilliantly vs. He fails utterly.
  **Q:** Does success make the abandonment **less wrongful / more justified** (even if blame is fixed)?
  *   **YES** → **LEAF D: The Retrospective Justifier**
  *   **NO** (Success changes nothing moral) → Go to **Node 5**.

  ### NODE 5: THE COHERENCE CHECK (Skepticism)
  **Claim:** If outcomes, circumstances, and character are all luck, and you have denied they affect assessment...
  **Q:** Is the practice of **blame still coherent**, or should it be replaced?
  *   **COHERENT** (We possess a non-empirical will) → **LEAF E: The Strict Kantian**
  *   **INCOHERENT** (Replace blame with grief/management) → **LEAF F: The Skeptic**

  *(Note: To meet the 5-leaf requirement, Leaf B and Leaf F are merged in analysis below, or Leaf B is treated as a sub-variant of Leaf A. For this handout, we treat Leaf B as a distinct logical possibility, though rarely occupied.)*

  ---

  ## THE FIVE POSITIONS (LEAVES)

  | **Leaf** | **Position Name** | **The Awkward Commitment** | **Diagnosis of Region** |
  | :--- | :--- | :--- | :--- |
  | **A** | **The Luck Accepter** | "Control is a myth; we judge people on outcomes and circumstances whether we like it or not." | **Occupied.** (Common sense view; metaphysically costly). |
  | **B** | **The Resultant-Only Theorist** | "Outcomes matter for blame, but your circumstances and character do not." | **Unoccupied.** *Diagnosis:* Incoherent. If character/circumstance don't matter, why do outcomes (which flow from them)? |
  | **C** | **The Mixed Theorist** | "You aren't blamed for accidents, but you are praised for overcoming your own nature." | **Sparsely Occupied.** *Diagnosis:* Attractive but unstable. Why is constitutive luck relevant but resultant luck not? |
  | **D** | **The Retrospective Justifier** | "Blame is fixed at the time of action, but whether your life was *worth it* is decided by luck." | **Occupied.** (Williams/Nagel). Distinguishes *moral blame* from *life significance*. |
  | **E/F** | **Kantian / Skeptic** | **Kantian:** "We are noumenally free despite all evidence." <br> **Skeptic:** "No one deserves blame, so we must abolish the practice." | **Crowded.** (See limitation below). |

  ---

  ## PEDAGOGICAL LIMITATIONS & OVERLAPS

  **1. The Kantian / Skeptic Indistinguishability**
  *   **The Problem:** The **Strict Kantian** and **The Skeptic** will answer every case node identically (Drivers = Equal; Temperament = Equal; Painter = No Justification). The tree cannot separate them because they agree on the *phenomena* but disagree on the *metaphysical implication*.
  *   **The Fix:** To separate them, you need a meta-ethical node: *"Given that control is unobservable, do we retain blame as a necessary fiction (Kantian) or discard it for truth (Skeptic)?"*

  **2. The Mixed View vs. Retrospective Justifier**
  *   **The Problem:** Both deny Resultant Luck (Node 1). They separate only at Node 4 (Painter). However, students often conflate "Justification" with "Praise."
  *   **The Fix:** Ensure Node 4 explicitly asks about the *meaning of the life*, not the *praiseworthiness of the agent*.

  **3. The Empty Region (Leaf B)**
  *   **Diagnosis:** Leaf B (Resultant-Only) is logically possible but philosophically barren. It accepts luck where it is most arbitrary (outcomes) but rejects it where it is most constitutive (character). It is likely unoccupied because it lacks a principled defense for why *results* escape the control principle while *causes* do not.

  ---
  *Instructor Note: Use the "Empty Region" diagnosis to prompt discussion on why we might accept Constitutive Luck (Node 3) more readily than Resultant Luck (Node 1), despite both violating the Control Principle.*
