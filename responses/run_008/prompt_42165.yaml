  *(Refining the Non-Identity handling)*: I shouldn't just ignore it. I need to state that the procedure treats the "future child" as a patient whose welfare is the concern, sidestepping the metaphysical comparison.

  *(Refining the PRS case)*: The key here is *clinical utility*. Even if ethically permissible to select against schizophrenia, the *tool* (PRS) is too blunt. The rejection should be on validity, which is safer legally.

