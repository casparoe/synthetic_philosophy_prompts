  Dear Friend,

  It was fascinating to hear about the progress of your seminar and the depth of the debate you and Greta are having regarding the moral equality of combatants. It is rare to find a discussion partner whose intuitions are so consistent yet so resistant to a single label, and mapping the architecture of her moral reasoning is a worthy project. Based on the track record of verdicts you have shared, I believe I can identify two distinct principles competing for dominance in her judgments, and I can offer a prediction on the case of the software engineer, though I must admit there is genuine uncertainty given the novelty of his role. The first principle, which I will call the Institutional Status Rule, suggests that targetability is determined by membership in the armed forces. Under this view, wearing the uniform or being formally integrated into the military machine makes one a legitimate target, regardless of whether one is shooting or cooking, while remaining a civilian grants immunity, as seen in her protection of the arms factory worker. Her judgments on criminality under this rule would then depend on voluntariness within that status; the career soldier is a murderer because he voluntarily joined the unjust machinery, whereas the conscripts are blameless because they were coerced, and the civilian arms worker is blameless because she lies outside the military institution entirely. The second principle, which I will call the Causal Responsibility Rule, locates targetability in the contribution to unjust threats rather than uniformed status. This rule explains why the conscripted cook is targetable despite not fighting, as he sustains the threat, but it struggles slightly with the arms worker unless Greta draws a sharp line between internal sustenance and external supply. Under this second rule, criminality is determined by voluntary contribution to harm; thus, the volunteer soldier is culpable, the conscripts are not, and the civilian arms worker is not culpable either, perhaps because her contribution is deemed too indirect or diffuse to attract moral blame.

  When we apply these two rules to the software engineer, we arrive at conflicting predictions that highlight the tension in Greta’s thinking. If she follows the Institutional Status Rule, the engineer is a civilian who wears no uniform and works in a civilian building, so he should not be targetable, and following the precedent of the arms factory worker, he should not be considered a criminal either, since civilians are generally exempt from moral liability for the war effort in her view. However, if she follows the Causal Responsibility Rule, the verdict shifts dramatically; he is voluntarily optimizing the very mechanisms of killing for an unjust aggression, making a significant causal contribution to the threat, which would render him targetable and likely criminally liable as a voluntary participant in wrongdoing. The complication regarding his code improving accuracy and saving civilian lives adds another layer of divergence. For the Institutional Status Rule, this fact is irrelevant; his status as a civilian or combatant is fixed regardless of his efficiency. For the Causal Responsibility Rule, however, this fact could mitigate his liability, as he is reducing the overall unjust harm caused by the aggression, potentially lowering his moral blameworthiness even if he remains partially liable for facilitating the war itself.

  My best guess, weighing the strength of her previous protections of civilians against her harsh judgment of voluntary aggressors, is that she will deliver a split verdict. I predict she will say the engineers are not targetable, maintaining the bright line of civilian immunity that protected the arms worker, because she seems deeply committed to the convention that non-combatants should not be killed even when they contribute to the war. However, I suspect she will call him a murderer or at least criminally liable, distinguishing him from the arms worker on the grounds of direct intent and voluntariness; unlike the arms worker who merely produces general capacity, this engineer knowingly optimized specific kills for an unjust cause without coercion. I think the accuracy improvement will not save him from criminality in her eyes, because facilitating aggression remains the primary wrong, though it might soften her tone regarding the severity of his blame. This prediction assumes she prioritizes status for targetability but responsibility for criminality, a hybrid view that fits her past decisions best.

  To truly settle which rule governs her thinking, you should present her with one further hypothetical that strips away the ambiguity of the engineer’s role. You should ask her about a civilian volunteer who drives a truck delivering ammunition directly to the front-line trenches, wearing no uniform and holding no military rank. This person is a civilian by status but makes a direct causal contribution to the immediate threat, much like the cook but without the institutional membership. If she says this driver is targetable, she is following the Causal Responsibility Rule, and her protection of the engineer might be weaker than I predict. If she says the driver is not targetable, she is firmly committed to the Institutional Status Rule, and my prediction that she will spare the engineer from being killed is much more secure. I hope this analysis provides a useful framework for your coffee conversation, and I look forward to hearing whether her intuitions align with the status quo of convention or the demands of causal responsibility.
