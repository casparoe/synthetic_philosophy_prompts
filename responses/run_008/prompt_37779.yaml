ing which of the four terms you're least confident in and what argument or thought experiment would move that term the most. put actual numbers on each point please, not vibes — im trying to figure out whether my 0.85 vs my TA's 0.4 is really a disagreement about whether harm requires experience, or whether its secretly about how much future life is worth having.
