  **TheoryOS v2.0.0 "Revolution"**
  **Maintainers:** The New Guard
  **Status:** Stable (for now)

  **Highlights**
  We are pleased to announce TheoryOS v2.0. This is a major version bump, not a patch. The core ontology has been rewritten to resolve persistent legacy anomalies that v1.0 could only address via ad-hoc patches. Users can expect a completely new environment for puzzle-solving. Normal science operations will resume shortly after installation, once the new axioms are loaded.

  **Breaking Changes**
  *   **Ontological Restructuring:** Fundamental entities (mass, space, time) have been redefined. Legacy variables may not compile.
  *   **Metric Undefined:** Benchmarks comparing v2.0 performance against v1.0 return `NaN`. There is no neutral benchmarking suite across versions. Claims that v2.0 is "truer" or "more accurate" are unsupported; however, v2.0 solves more current puzzles. Cross-version comparative claims are marked undefined.
  *   **Rollback Unsupported:** Downgrading to v1.0 is technically impossible. Users attempting to revert report Gestalt artifacts: legacy objects appear as new objects disguised as old ones. Once the new rendering engine loads, you cannot unsee the update. Everything looks like a duck that was secretly a rabbit all along.

  **Deprecations**
  The following concepts are removed without successor mapping:
  *   `Absolute_Reference_Frame`
  *   `Ether_Medium`
  *   `Objective_Progress_Indicator`
  Attempts to import these modules will throw `IncommensurabilityError`. There is no translation layer. Do not attempt to map v2.0 classes to v1.0 equivalents; they do not exist.

  **Migration Guide**
  **WARNING:** No migration path exists. v1.0 and v2.0 share no common vocabulary. Any attempt to describe changes uses v2.0 terminology, which v1.0 users cannot parse. We recommend v1.0 users attend our workshops until conversion occurs. Note: Conversion is not logical entailment; it is a persuasive process. You must learn the new language to understand the changes, but you must understand the changes to learn the language.

  **Known Issues**
  *   **Legacy Anomalies:** Several v1.0 bugs (e.g., `Orbit_Discrepancy_004`) are marked "Resolved" in v2.0, though only by changing the definition of space. In v1.0, these were deferred for decades with notes promising future patches, until maintainers gave up and shipped this whole new version instead.
  *   **New Anomalies:** v2.0 introduces its own set of open bugs. These are expected and will be addressed via normal science patches in future minor releases.
  *   **Holdouts:** Some users refuse to update. These instances are isolated to legacy journals.

  **FAQ**
  *Q: Why should I switch if v1.0 worked fine?*
  A: v1.0 requires increasingly complex patches to handle anomalies. v2.0 offers a fresher puzzle-set.

  *Q: What about colleagues sticking with v1.0?*
  A: Conversion happens by persuasion, not proof. Holdouts typically age out. Recruitment focuses on new users without v1.0 legacy dependencies.

  **Contributors**
  Lead Maintainers: The Young Guard. Special thanks to those who ignored v1.0 documentation.

  **Roadmap**
  v2.1 will focus on extending the new paradigm to adjacent fields. We promise steady progress toward truth and increased explanatory power. Our goal is cumulative improvement over previous versions, ensuring each release brings us closer to a complete description of reality.

  **History**
  *Note:* Prior release notes for v1.0 have been amended to reflect that v1.0 was always an early, unstable draft of v2.0. Discrepancies in historical records are due to user error.
