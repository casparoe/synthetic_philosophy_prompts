          *   Context: Your party has 90% chance of winning.
          *   Options: A) Go anyway (duty to participate), B) Stay home (waste of time/causal), C) Go but spoil (expressive).
      *   *Scenario 2: Lesser Evil.* (Required)
          *   Context: Candidate A is bad, Candidate B is worse.
          *   Options: A) Vote B (prevent harm), B) Vote A or Spoil (clean hands), C) Stay home (complicity).
      *   *Scenario 3: Illegitimate Referendum.* (Required)
          *   Context: Process was rigged/unfair, but you have a preference on the issue.
          *   Options: A) Vote preference (engage with issue), B) Boycott (deny legitimacy), C) Vote randomly (mock the process).
      *   *Scenario 4: Pivotal Committee.* (Required)
          *   Context: Small group, your vote decides.
          *   Options: A) Vote strictly for best outcome (responsibility), B) Vote with group to keep peace (solidarity), C) Abstain (conflict of interest). *Wait, need to align with voting ethics.* Let's make it about the weight of the vote. A) Vote decisively (causal power matters), B) Vote same as safe seat (consistency).
      *   *Scenario 5: Spoiling the Ballot.* (Required)
          *   Context: You want to show up but reject options.
          *   Options: A) It's a waste/insulting, B) It's a valid protest, C) It's better than staying home.
      *   *Scenario 6: Compulsory Voting.* (Required)
          *   Context: Fine for not voting.
          *   Options: A) Pay fine (principle), B) Vote randomly to satisfy law (compliance), C) Vote seriously despite coercion (civic duty transcends law).
      *   *Scenario 7: Uninformed Voting.* (Required)
          *   Context: You know nothing about candidates.
          *   Options: A) Stay home (epistemic duty), B) Flip a coin (random is fine), C) Ask a friend (delegate).
      *   *Scenario 8: Tactical Voting.* (Required)
          *   Context: Vote for disliked party to block worse one.
          *   Options: A) Do it (consequences), B) Don't (integrity), C) Vote for favorite anyway (signal).

      *Refining Options for Dimensions:* I need to make sure the options across the 8 questions allow me to distinguish the 6 target positions. I need to code them mentally as I write to ensure variety.
      *   *Dimension 1 (Turnout):* Duty vs. No Duty vs. Conditional Duty.
      *   *Dimension 2 (Ballot):* Consequentialist (Lesser Evil) vs. Deontological (Clean Hands) vs. Expressive (Spoil/Protest).
      *   *Dimension 3 (Purpose):* Causal vs. Expressive vs. Participatory.

      *Let's finalize the 8 questions to ensure the "Duty Divergence" requirement is met.*
      *   *Question 2 (Lesser Evil)* is the best place for Duty Divergence. Two people might agree "You must vote," but one says "Vote Lesser Evil" and the other says "Vote Conscience/Spoil."

  3.  **Developing the Scoring Key:**

      *   Need 6 positions:
          1.  Civic-Duty (Turnout obligatory, content secondary).
          2.  Instrumentalist (Causal impact rules, safe seat = stay home, pivotal = vote).
          3.  Expressive (Vote as speech/endorsement).
          4.  Clean-Hands (No lesser evil voting).
          5.  Protest Abstentionism (Boycott illegitimate/bad systems).
          6.  Epistemic Restriction (Uninformed = stay home).
      *   Need to allow mixtures.
      *   Need to flag unoccupied/unstable combinations.

  4.  **Separation Analysis:**

      *   Identify overlaps. E.g., Civic-Duty and Expressive often align on turnout but diverge on spoiling. Instrumentalist and Epistemic might align on safe seats/uninformed but for different reasons.
      *   Identify the "Most Diagnostic Question." Likely the Lesser Evil or Safe Seat question.

  5.  **Design Notes:**

      *   Explain the intent behind each question. Which positions does it separate?

  6.  **Review against Constraints:**

      *   *No jargon in questions?* Check.
      *   *No "Do you have a duty?"* Check.
      *   *8 Questions?* Check.
      *   *Required Scenarios included?* Check.
      *   *3 Dimensions varied?* Check.
      *   *Duty Divergence?* Check (Q2).
      *   *6 Positions in Key?* Check.
      *   *Mixture allowed?* Check.
      *   *Separation Analysis?* Check.
      *   *Design Notes?* Check.

  7.  **Drafting Content (Self-Correction during drafting):**

      *   *Critique:* Make sure the options aren't too long. Keep them punchy for a blog quiz.
      *   *Critique:* Ensure the Scoring Key isn't just "Mostly As = X". It needs to be more nuanced to handle the "mixture" requirement. I will use a point system or a pattern-matching description. A pattern-matching description is better for "tension." Let's use a "Profile" approach based on clusters of answers.
      *   *Refinement on Scoring:* Instead of a rigid algorithm, I will describe the *clusters* of answers that indicate each view. This allows for the "mixture diagnosis" requirement more naturally.
      *   *Refinement on Dimensions:* Ensure Q4 (Committee) contrasts with Q1 (Safe Seat) to test Instrumentalism.
      *   *Refinement on Q6 (Compulsory):* This tests the source of obligation (Law vs. Morality).

      *(Self-Correction on Scoring Key)*: The prompt asks for a scoring key mapping answer patterns. I should provide a way for the user to tally. Let's assign "weights" to options that align with specific dimensions, then synthesize. Actually, a "Profile Matcher" is more accurate for philosophical views which are holistic. I will define the "Signature Pattern" for each view and explain how to diagnose mixtures.

      *(Self-Correction on Separation Analysis)*: Be honest about limitations. Expressive and Clean-Hands often look similar on "Lesser Evil" but differ on "Spoiling." I need to make sure the quiz captures that. Q5 (Spoiling) is crucial there.

      *(Final Polish)*: Ensure tone is appropriate for a university ethics blog (engaging, thoughtful, not patronizing).

  8.  **Finalizing the Output Structure:**
      *   Title.
      *   Introduction (brief).
      *   The 8 Questions.
      *   Scoring Key (with mixture logic).
      *   Separation Analysis.
      *   Design Notes.

      *Wait, one specific constraint:* "Design at least one question so that two readers who agree there is a duty to vote can still diverge on what the duty is a duty *to do*."
      *   *Implementation:* Question 2 (Lesser Evil). Option A: Vote for the lesser evil (Duty to prevent harm). Option B: Vote for the best candidate or spoil (Duty to maintain integrity). Both imply turning out, but differ on the act.

      *Let's write.*

      *(Drafting Question 1 - Safe Seat)*: Focus on waste of time vs. participation.
      *(Drafting Question 2 - Lesser Evil)*: Focus on harm reduction vs. integrity.
      *(Drafting Question 3 - Illegitimate Referendum)*: Focus on legitimacy vs. engagement.
      *(Drafting Question 4 - Committee)*: Focus on causal power (Instrumentalist test).
      *(Drafting Question 5 - Spoiling)*: Focus on expression vs. waste.
      *(Drafting Question 6 - Compulsory)*: Focus on legal obligation vs. moral choice.
      *(Drafting Question 7 - Uninformed)*: Focus on epistemic duty.
      *(Drafting Question 8 - Tactical)*: Focus on blocking vs. sincerity.

      *Wait, I need to make sure the Options map clearly.* I will label options A, B, C in the draft, but in the Scoring Key, I will explain what choosing A, B, or C *generally* indicates, but acknowledge that specific combinations define the views. Actually, to make it usable for a blog, a "Tally" system is usually better.
      *Idea:* I will tag each option with a "Primary Motivation" (e.g., Impact, Duty, Expression). Then the Key sums these up.
      *Better Idea:* The prompt asks for a scoring key mapping patterns to positions. I will describe the "Answer Profile" for each position. This is more robust for a text-based output than a simple tally, and handles the "mixture" requirement better.

      *Let's refine the Scoring Key:* I will provide a "Diagnostic Guide." If you answered X on 1, Y on 2... you are likely Z. If you have a mix, here is how to interpret the tension.

      *Let's refine the Separation Analysis:* Be specific. "Civic-Duty and Expressive views both demand turnout in Q1, so Q1 cannot separate them. Q5 (Spoiling) is the separator."

      *Let's refine Design Notes:* "Q1 splits Instrumentalist from Civic-Duty."

      *Okay, ready to generate.*

      *Wait, check the "unoccupied/thinly occupied" requirement.* I need to identify a combination that is logically possible but philosophically rare. Example: Someone who thinks you must vote (Civic Duty) but also thinks you should only vote if informed (Epistemic), yet also thinks you should vote in a safe seat (Civic) even if uninformed? No.
      *How about:* Instrumentalist + Clean Hands. "Only vote if it matters, but never vote for lesser evil." This leads to abstention in almost all real elections. This is "Thinly Occupied" because it's practically self-defeating. I will flag this.

      *Final check on constraints:* "No question may name any position, theorist or school." "None may simply ask whether one has a duty to vote."
      *Check:* All scenarios are concrete. Options describe actions/feelings.

      *Let's go.*
answer: |-
  # Quiz: What Does Your Ballot Say About You?

  **Instructions:** Read each scenario and select the option that best matches your intuition. Do not overthink; go with your immediate reaction. There are no right or wrong answers, only different ethical commitments.

  ### 1. The Safe Seat
  It is election day. In your local district, one party has won every election for thirty years. Polls suggest they will win again this year by a massive margin. Your preferred candidate has no realistic chance of winning.
  *   **A.** You go to the polling station anyway. Showing up is what matters, regardless of the count.
  *   **B.** You stay home. Casting a vote that cannot change the outcome is a waste of time.
  *   **C.** You go and cast a spoiled ballot. You want to be counted as present, but not as agreeing to the choices.

  ### 2. The Lesser Evil
  You face a choice between two candidates. Candidate A is deeply flawed and supports policies you oppose. Candidate B is, in your view, dangerous and harmful, but slightly less so than A. There is no third option.
  *   **A.** You vote for Candidate A. Preventing the worse outcome is the most important thing you can do.
  *   **B.** You vote for a write-in or spoil the ballot. You cannot in good conscience endorse someone you believe is bad.
  *   **C.** You stay home. Participating in a choice between two bad options makes you complicit in both.

  ### 3. The Illegitimate Referendum
  A referendum is held on a major constitutional change. You have a strong opinion on the issue, but the process leading to the vote was widely criticized as rigged and unfair by independent observers.
  *   **A.** You vote for your preferred outcome. The issue is too important to ignore, regardless of the process.
  *   **B.** You boycott the vote entirely. Participating would lend credibility to a broken system.
  *   **C.** You vote randomly or spoil the ballot. You want to engage with the issue but signal that the process is flawed.

  ### 4. The Pivotal Committee
  You are on a small committee of five people deciding how to spend a budget. You know for a fact that the other four members are split 2-2. Your vote will definitively decide the outcome.
  *   **A.** You vote strictly for the option you think is best. When you hold the deciding power, you must use it responsibly.
  *   **B.** You vote the same way you would in a national election. Your ethical rules shouldn't change just because the stakes are smaller.
  *   **C.** You abstain. You feel uncomfortable having sole responsibility for the result.

  ### 5. The Spoiled Ballot
  Imagine a system where submitting a blank or defaced ballot is officially recorded and published as a statistic, distinct from "not voting."
  *   **A.** This is meaningless. If you don't pick a candidate, you haven't really voted.
  *   **B.** This is valuable. It allows people to participate without endorsing the options.
  *   **C.** This is dangerous. It might make people feel they've "done their bit" without actually engaging with the issues.

  ### 6. The Compulsory Scheme
  Your country introduces a law requiring all citizens to vote, backed by a modest fine for non-compliance. The fine is annoying but not financially ruinous.
  *   **A.** You pay the fine and stay home. The state cannot force you to express a political preference.
  *   **B.** You go and vote randomly just to avoid the fine. The law requires attendance, not sincerity.
  *   **C.** You go and vote seriously. The legal requirement aligns with your belief that everyone should participate.

  ### 7. The Uninformed Voter
  Election day arrives, and you realize you have been too busy to learn anything about the candidates or the parties. You know the election is important, but you know nothing about the choices.
  *   **A.** You stay home. Casting a vote without knowledge is irresponsible.
  *   **B.** You flip a coin. An uninformed vote is no worse than not voting, and better than staying home.
  *   **C.** You ask a trusted friend how they are voting and follow their lead.

  ### 8. The Tactical Block
  A third party you actually like is running, but they have no chance of winning. If their supporters vote sincerely, they will split the vote and allow the worst candidate to win.
  *   **A.** You vote for the third party. You must be honest about what you support, even if it costs the election.
  *   **B.** You vote for the less-bad major candidate. Stopping the worst candidate is more important than signaling your true preference.
  *   **C.** You stay home. You refuse to participate in a system that forces this kind of choice.

  ***

  ## Scoring Key & Diagnostic Profiles

  Do not simply count your letters. Instead, look for the **pattern** of your choices. Most people will not fit perfectly into one box. Read the six profiles below and see which one resonates with your combination of answers. If you resonate with two, read the "Tension Note" to understand where your views might conflict.

  ### 1. The Civic Participant (Civic-Duty View)
  *   **Signature Pattern:** Q1(A), Q4(B), Q6(C).
  *   **Core Belief:** Turning out is an obligation in itself, like jury duty. The act of participating sustains the system.
  *   **On the Ballot:** Less concerned with *who* you vote for than *that* you voted.
  *   **Tension Note:** If you also chose Q2(B) (Clean Hands), you hold a demanding view: you must show up, but you must never compromise your integrity. This can be exhausting in imperfect elections.

  ### 2. The Impact Maximizer (Instrumentalist View)
  *   **Signature Pattern:** Q1(B), Q4(A), Q2(A).
  *   **Core Belief:** Voting is a tool to cause outcomes. If the tool doesn't work (Safe Seat), don't use it. If the tool is powerful (Committee), use it carefully.
  *   **On the Ballot:** Willing to vote for a "lesser evil" if it prevents harm.
  *   **Tension Note:** If you also chose Q7(A) (Uninformed), your view is stable. If you chose Q7(B) (Coin Flip), your view is unstable: why maximize impact with a random tool?

  ### 3. The Moral Witness (Expressive View)
  *   **Signature Pattern:** Q1(C) or Q2(B), Q5(B), Q8(A).
  *   **Core Belief:** A vote is a speech act. It declares who you are and what you endorse.
  *   **On the Ballot:** Refuses to vote for a "lesser evil" because that counts as endorsement. Prefers spoiling a ballot to voting silently for a bad candidate.
  *   **Tension Note:** If you also chose Q6(C) (Compulsory), there is a conflict: Can a speech act be genuine if it is coerced by law?

  ### 4. The Purist (Clean-Hands View)
  *   **Signature Pattern:** Q2(B), Q8(A), Q3(B) or (C).
  *   **Core Belief:** One must not be complicit in wrongdoing. It is better to lose with integrity than win by compromising.
  *   **On the Ballot:** Distinct from the Expressive view; the focus is on avoiding moral contamination, not necessarily on sending a message.
  *   **Tension Note:** If you also chose Q1(A) (Safe Seat), you occupy a **thinly occupied** position. Why is it obligatory to show up (Q1) if showing up requires touching a corrupt ballot (Q2)? This suggests a duty to participate without a duty to validate, which is logically difficult to maintain.

  ### 5. The System Skeptic (Protest Abstentionism)
  *   **Signature Pattern:** Q3(B), Q6(A), Q2(C).
  *   **Core Belief:** In broken or coercive systems, non-participation is the most powerful message.
  *   **On the Ballot:** Boycotts are preferred over spoiled ballots, which are preferred over voting.
  *   **Tension Note:** If you chose Q4(A) (Committee), you believe small-scale politics is legitimate while large-scale politics is not. This is a common and stable distinction (localism).

  ### 6. The Epistemic Restrictionist (Knowledge View)
  *   **Signature Pattern:** Q7(A), Q1(B) or (A), Q2(A) or (B).
  *   **Core Belief:** Voting without knowledge is morally negligent. The duty to vote is conditional on the duty to know.
  *   **On the Ballot:** This view cuts across the others. You can be a Civic Participant who stays home because you are uninformed.
  *   **Tension Note:** If you chose Q7(B) (Coin Flip), you reject this view entirely. If you chose Q7(A) but Q1(A) (Safe Seat), you hold a **mixture diagnosis**: You feel a duty to turn out, but a stronger duty to be informed. In an uninformed safe-seat election, your duties conflict.

  ***

  ## Separation Analysis

  This quiz is designed to separate views that often sound similar in conversation but diverge in practice. However, no quiz is perfect.

  **Hard-to-Separate Pairs:**
  *   **Civic-Duty vs. Expressive:** Both views generally demand turnout (Q1). They are only cleanly separated by **Question 5 (Spoiling)**. The Civic Participant sees a spoiled ballot as a failure to participate; the Expressive voter sees it as a valid form of speech.
  *   **Clean-Hands vs. Protest Abstentionism:** Both may result in not voting for the "lesser evil" (Q2). They are separated by **Question 3 (Referendum)**. The Clean-Hands voter might still vote on the issue if the process were fair; the Protest Abstentionist boycotts because the system itself is the problem.

  **The Most Diagnostic Question:**
  **Question 2 (The Lesser Evil)** does the most work. It forces a choice between *consequences* (prevent the worse candidate) and *integrity* (do not endorse a bad candidate). Almost every philosophical tradition defines itself by how it answers this specific tension. An Instrumentalist and a Civic Participant might agree on turnout, but they will likely split here.

  ***

  ## Design Notes

  1.  **The Safe Seat (Q1):** Built to split the **Instrumentalist** from the **Civic-Duty** view. If voting is only for outcomes, safe seats are irrelevant. If voting is for participation, safe seats are essential.
  2.  **The Lesser Evil (Q2):** Built to split **Consequentialists** from **Deontologists (Clean Hands)**. Crucially, this allows two people who agree on a "duty to vote" to disagree on what that duty requires (preventing harm vs. maintaining integrity).
  3.  **The Illegitimate Referendum (Q3):** Built to split **Protest Abstentionists** from **Clean-Hands** voters. It tests whether the objection is to the *candidates* or to the *system*.
  4.  **The Pivotal Committee (Q4):** Built to test **Instrumental Consistency**. If you stay home in Q1 (Safe Seat) but vote decisively in Q4, you are a pure Instrumentalist. If you answer the same for both, you hold a principle-based view.
  5.  **The Spoiled Ballot (Q5):** Built to split **Civic-Duty** from **Expressive** views. It isolates the "speech act" dimension of voting from the "decision-making" dimension.
  6.  **The Compulsory Scheme (Q6):** Built to test the **Source of Obligation**. Is the duty internal (moral) or external (legal)? This separates the **Civic Participant** from the **System Skeptic**.
  7.  **The Uninformed Voter (Q7):** Built to isolate the **Epistemic Restrictionist**. This view is independent of the others; one can be an Instrumentalist who stays home when uninformed, or a Civic Participant who does the same.
  8.  **The Tactical Block (Q8):** Built to reinforce the split in Q2, focusing on **Sincerity vs. Strategy**. It helps distinguish the **Expressive** voter (vote sincerely) from the **Instrumentalist** (vote strategically).
