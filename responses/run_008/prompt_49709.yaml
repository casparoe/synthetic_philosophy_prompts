          *   Content: 8 concrete scenario-based questions with 2-3 options each.
          *   Required Scenarios: Safe seat, lesser evil, illegitimate referendum, pivotal committee vote, spoiling ballot, compulsory voting, uninformed voting, tactical voting.
          *   Dimensions: Obligation to turn out vs. Obligation on how to vote vs. Purpose of vote (causal/expressive/collective).
          *   Requirement: At least one question where duty-to-vote holders diverge on *what* to do.
          *   Output: 8 Questions, Scoring Key (6+ positions, allowing for mixtures), Separation Analysis, Design Notes.
          *   Specific Constraint: Scoring key must allow for mixed diagnoses/tensions, not force a single label.

  2.  **Drafting the Questions (Iterative Process):**

      *   *Goal:* Cover the required scenarios while ensuring options map to the three dimensions (Turnout, Ballot Marking, Purpose).
