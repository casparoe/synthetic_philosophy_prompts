answer: |-
  The asymmetry you describe is a robust feature of bioethical practice: the "right to die" (refusal) is sacrosanct, while the "duty to live" (request) is discretionary. To understand what theory this presupposes, we must distinguish between the *logical requirements* of the practice, the *moral intuitions* it relies upon, and the *administrative mechanisms* used to enforce it.

  ### 1. What Theory Does the Practice Presuppose?

  The current practice does not fit cleanly into any single one of the three theories you outlined (Sovereignty, Continuity, Interests). Instead, it presupposes a **hybrid of Negative Sovereignty and Paternalistic Interests.**

  *   **Why it is not pure Sovereignty:** If the authority of the earlier self rested simply on the moral force of autonomous choice (Sovereignty), a directive requesting treatment would be as binding as one refusing it. A promise is a promise. The fact that clinicians routinely override "do everything" directives when the patient appears suffering indicates that sovereignty is not the sole operating principle.
  *   **Why it is not pure Continuity:** If authority depended on psychological connectedness (Continuity), refusal directives in cases of advanced dementia should lose their force. The demented patient often shares few psychological traits with the earlier self. Yet, the law honors the refusal even when continuity is severed. This suggests the practice assumes the earlier self retains authority *despite* the loss of continuity.
  *   **Why it is not pure Interests:** If the earlier self binds only because they are a better epistemic judge of the patient's good (Interests), we would expect a balanced assessment of whether treatment or non-treatment serves that good. Instead, the practice treats the earlier self's judgment as definitive regarding *harm* (refusal) but provisional regarding *benefit* (request).

  **The Actual Presupposition: Negative Sovereignty.**
  The practice strictly presupposes a **Negative Sovereignty View**. It operates on the deontological constraint that the earlier self retains the right to *exclude* interventions (bodily integrity) even after competence is lost, but does not retain the right to *compel* interventions that impose burdens on the later self. This is not a theory of personal identity, but a theory of **moral rights over time**: I own my body enough to forbid touch, but I do not own my future self enough to mandate suffering.

  **Accommodation vs. Presupposition:**
  *   **Presupposed:** The moral asymmetry between negative rights (non-interference) and positive rights (assistance). The practice *requires* the belief that violating a refusal is a greater moral wrong (battery/harm) than violating a request (omission/beneficence failure).
  *   **Accommodated:** The Continuity and Interests views are used *post hoc* to justify the asymmetry. When honoring a refusal in dementia, we accommodate the Interests view ("it's in their best interest not to live like this"). When overriding a request, we accommodate the Continuity view ("the person who wanted this is gone"). These are rationalizations, not foundational presuppositions.
  *   **Underdetermined:** The practice is underdetermined regarding the *threshold* of suffering required to override a request. It is unclear whether a request is overridden because the current self's welfare *always* trumps the prior self's choice, or only when suffering reaches a specific intensity.

  ### 2. The Psychiatric Case: Same Source or Distinct?

  The reluctance to honor psychiatric self-binding (Ulysses contracts) is traceable to the **same source** as the medical reluctance to honor treatment requests, but it is compounded by a distinct epistemic problem.

  *   **Same Source:** Like the medical "request" directive, self-binding involves the prior self mandating a burden (confinement, medication) on the later self. Clinicians prioritize the current experiential welfare of the patient (who is protesting) over the prior critical interests of the patient (who requested stability).
  *   **Distinct Complication:** In dementia, competence is permanently lost; in psychiatry, competence is **fluctuating**. The reluctance in psychiatry is not just about the authority of the earlier self, but about the difficulty of determining *which* self is currently competent. However, even when the current state is clearly manic, clinicians hesitate. This confirms that the core tension is the same: the moral weight of current experiential welfare (the screaming patient) versus prior autonomous commitment (the signed contract).

  ### 3. The Deflationary Critique: Is It Just Liability?

  Your colleague's claim that this pattern reflects only liability avoidance, family pressure, and optics is **insufficient**.

  While liability shapes the *enforcement* of these norms (fear of battery suits drives the honoring of refusals; lack of "wrongful life" suits enables the ignoring of requests), it does not explain the *origin* of the norms. Laws and hospital policies are not arbitrary; they encode moral intuitions. If the asymmetry were purely pragmatic, we could easily legislate parity (e.g., making refusal ADs non-binding to reduce liability). The fact that jurisdictions consistently maintain this asymmetry indicates a deep-seated normative commitment: the belief that **non-maleficence (do not harm) outweighs beneficence (do good)** in the context of personal authority.

  To read no theory into the boilerplate is to misunderstand how law functions. Legal boilerplate is the sediment of philosophical conflict. The asymmetry exists because our moral theory of the self is asymmetric: we view the self as a sovereign proprietor regarding bodily intrusion, but as a temporal narrative regarding life planning. The deflationary reading describes the *incentives*, but the normative explanation describes the *justification*. We need the normative explanation to understand why the incentives are structured this way.

  ### 4. A Definite Position: The Practice Ought to Rest on the Interests View

  The current practice, resting on Negative Sovereignty, is morally unstable. It privileges the "right to be let alone" to the point where it allows a person to condemn their future self to a state the future self might find acceptable (in dementia), while forbidding the future self from being saved by the prior self's judgment.

  The practice ought to be rebuilt on the **Interests View (specifically, a Trusteeship Model).**

  **The Theory:**
  The earlier self does not have sovereignty over the later self; rather, the earlier self acts as a **trustee** for the person's life as a whole. The earlier self has epistemic authority because they possess capacity and a view of the entire narrative arc, whereas the demented or manic self is limited to immediate experience. However, this authority is not absolute; it is fiduciary. The trustee must act in the best interests of the beneficiary (the person across time).

  **Why this is superior:**
  1.  It explains why we honor refusal ADs in dementia (the interest in avoiding a undignified existence survives even if the experience of it does not).
  2.  It explains why we *should* honor request ADs and self-binding (the interest in stability and life completion is a critical interest that outweighs temporary distress).
  3.  It provides a clear limit: The trustee's authority ends if the action causes **extreme, irredeemable suffering** to the current self that the earlier self could not have rationally authorized.

  **Concrete Changes Required:**
  If we rebuilt the practice on this Trusteeship/Interests account, three specific changes must occur:

  1.  **Parity for Request Directives:** Request ADs ("keep me alive at all costs") must be given **presumptive binding weight**, equal to refusal ADs. Clinicians could only override them if they can demonstrate that the treatment imposes a burden of suffering so severe it negates the "good" of the life being prolonged. Currently, the burden of proof is on the family to enforce the request; under this view, the burden of proof shifts to the clinician to justify *ignoring* it.
  2.  **Enforceable Self-Binding in Psychiatry:** Psychiatric Ulysses contracts must be legally enforceable. When a patient enters a manic phase and objects to medication, the prior directive should trigger hospitalization automatically. The "current objection" should not be treated as a revocation of consent, but as a symptom of the condition the contract was designed to manage.
  3.  **The "Suffering Cap" Exception:** To avoid paternalism, the Interests View must include a safety valve. A prior directive (refusal or request) is voided only if the current patient's experiential suffering exceeds a high clinical threshold (e.g., intractable physical pain or extreme terror) that the earlier self could not have adequately foreseen. This protects the later self from being a mere vessel for the earlier self's ideology without discarding the authority of the earlier self entirely.

  **Conclusion:**
  The current asymmetry is not merely legal boilerplate or liability avoidance; it is the result of an incoherent moral framework that treats the self as a sovereign owner when saying "no" but a ward of the state when saying "yes." By shifting to an **Interests-Based Trusteeship Model**, we acknowledge that the earlier self is the best judge of the life's value, while retaining a moral obligation to prevent the later self from becoming a site of intolerable suffering. This requires strengthening the authority of the earlier self in cases of treatment requests and psychiatric self-binding, bringing them into alignment with the authority we already grant in cases of refusal.
