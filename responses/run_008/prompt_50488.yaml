      *   **Input:** 6 specific numbered commitments.
      *   **Output Requirements:**
          *   Identify genuine tensions (and severity).
          *   Identify apparent tensions (and why they dissolve).
          *   For genuine tensions, explain what must give and the cost.
          *   Order tensions by severity.
          *   Recommend a single revision that cleans up the most.
