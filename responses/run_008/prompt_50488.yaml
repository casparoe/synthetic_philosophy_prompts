      *   **C2 vs. C3:**
          *   C2: Frankfurt cases show responsibility without AP.
          *   C3: Actual sequence matters; absence of alternatives costs nothing.
          *   *Analysis:* These are highly consistent. C3 provides the theoretical justification for the verdict in C2.
          *   *Verdict:* No tension.

      *   **C3 vs. C4:**
          *   C3: Action must issue from agent's values/character without *interference* (at the time).
          *   C4: Covert character-engineering (past manipulation) undermines responsibility, even if values are "his own" and no intervention *at the time*.
          *   *Analysis:* This is the classic "Manipulation Argument" tension within compatibilism. C3 says "actual sequence... without anyone interfering." C4 clarifies that "interfering" isn't just concurrent intervention (like Frankfurt's Black), but includes *history* (manipulation).
          *   *Tension:* Is there a tension? C3 says "without anyone interfering." C4 says past manipulation counts as undermining. If C3 implies *only* concurrent interference matters, there's a tension. If C3's "interfering" is interpreted broadly to include historical manipulation, they are consistent. However, C3 emphasizes "actual sequence" (current causal chain), while C4 introduces a *historical* condition. Many actual-sequence theorists (like Frankfurt himself) struggle with the manipulation objection.
