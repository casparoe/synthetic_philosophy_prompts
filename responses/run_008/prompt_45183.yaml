  Here is an argument constructed around the position you've outlined. I have structured it to move from the core principle to the stress tests, then to the boundary conditions, and finally to an explicit epistemic accounting and self-critique.

  ***

  ### The Referee Asymmetry: Why Science Converges Where Technology Locks In

  If you read Paul David on QWERTY or Brian Arthur on increasing returns, the logic of path dependence is seductive because it is intuitive: small, contingent historical accidents get amplified by positive feedback loops until escape is impossible. We use QWERTY not because it is efficient, but because everyone else uses it. We use standard gauge railways not because they are optimal for all terrains, but because the network effects of the early adopters made switching costs prohibitive. In these domains, history is a ratchet: it clicks forward, but it rarely clicks back.

  The thesis I want to defend is that this logic applies powerfully to technology and institutions, but fails to capture the dynamics of core scientific theory. My claim is not that sociology doesn't matter in science—it obviously does—but that science possesses a structural feature that technology and institutions lack: an external, non-negotiable referee. I call this the **Referee Asymmetry**.

  #### 1. The Principle: Negative vs. Positive Feedback
  The core of the argument rests on the direction of the feedback loop.

  In technology and institutions, the value of a choice is often endogenous. The value of a fax machine, a language, or a legal standard depends on how many other people have adopted it. This creates **positive feedback**. The more you use it, the better it gets (relative to alternatives), and the harder it becomes to dislodge. The "world" does not intervene to say you are wrong; the world merely accommodates your inefficiency. You can build a society on a bad calendar or a bad keyboard; you just pay a continuous, diffuse tax in inefficiency.

  In core scientific theory, the value of a choice is exogenous. The value of a theory depends on its ability to predict and manipulate phenomena that exist independently of the scientific community. This creates **negative feedback**. If your theory is wrong, the world pushes back. Bridges collapse, medicines fail to cure, and predictions miss their marks. This pushback imposes a cost that accumulates over time.

  The "Referee Asymmetry" posits that while sociological forces (funding, prestige, paradigmatic inertia) can push science off-course temporarily, the cost of empirical failure compounds until it overwhelms the sociological inertia. In tech, the cost of switching *increases* over time. In science, the cost of *staying* with a falsified theory increases over time. Therefore, if you replayed the tape of history, you might get different notations, different orders of discovery, and different institutional structures, but you would converge on the same core physical regularities. You wouldn't end up with a different periodic table any more than you would end up with a different gravity.

  #### 2. Stress-Testing the Hard Cases
  A theory of scientific convergence must survive the historical record of error. The obvious counter-examples are long-lasting falsehoods.

  **Ptolemaic Astronomy (1400 Years):**
  This is the strongest case for scientific lock-in. How could geocentrism persist for millennia if the "referee" is so active?
  *Response:* The referee was active, but the signal was noisy. To the naked eye, and even with early instrumentation, the geocentric model *worked*. It predicted planetary positions well enough for the calendrical and navigational needs of the time. It was not "locked in" by sociology alone; it was locked in by a lack of discriminatory data. Once Tycho Brahe's precision data became available, the epicycles became unwieldy. The resistance wasn't infinite; it broke precisely when the empirical cost of maintaining the old model (complexity) exceeded the cost of switching (conceptual upheaval). The referee didn't speak until the microphone was turned on.

  **Plate Tectonics (The Wegener Delay):**
  Alfred Wegener proposed continental drift in 1912; it wasn't accepted until the 1960s. Was this lock-in?
  *Response:* This looks like sociological inertia (older geologists dying off, as Max Planck suggested). But note the mechanism of the resolution. It wasn't a social revolution; it was the discovery of seafloor spreading and paleomagnetism. Once the *mechanism* was found, the conversion was remarkably rapid. In a true lock-in scenario (like QWERTY), the superior alternative (Dvorak) remains marginalized *even after* it is proven superior. In tectonics, once the evidence crossed a threshold, the field flipped. The delay was not a permanent lock-in, but a lag in the referee's ability to issue a verdict.

  **String Theory and Psychoanalysis:**
  Here we hit the boundary. Psychoanalysis once claimed to be science; now it is largely treated as hermeneutics. String theory claims to be physics but lacks empirical verification.
  *Response:* These are examples of fields where the referee has gone silent. Psychoanalysis drifted into lock-in because its claims became unfalsifiable; it insulated itself from the referee. String theory is currently in a "pre-empirical" phase. If it remains so indefinitely, my argument concedes it will behave like math or philosophy—subject to aesthetic and sociological path dependence. But if it claims to be physics, it must eventually face the referee. If it cannot, it will not "lock in" as truth; it will be abandoned as a research program. The fact that physicists are currently anxious about this "crisis" proves the norm exists: they know they need the referee.

  #### 3. Drawing the Boundary
  So, where does the referee stop working? I propose a distinction between the **Empirical Core** and the **Interpretive Superstructure**.

  *   **The Empirical Core:** This is where the referee is loud. Thermodynamics, germ theory, orbital mechanics. Here, path dependence is weak. You cannot have a "sociological" alternative to the second law of thermodynamics that works in practice. If you try to build an engine that violates it, it simply won't run.
  *   **The Interpretive Superstructure:** This is where the referee is quiet or mute. Taxonomies, notations, metaphysical interpretations, and early-stage theoretical frameworks. Here, path dependence is strong. We use Newton's fluxions or Leibniz's calculus notation based on historical accident. We categorize species based on historical lineage of classification systems. We might pursue supersymmetry over other extensions of the standard model due to aesthetic bias.

  The error of strong social constructivists is to look at the Superstructure (which is contingent) and assume the Core is equally contingent. The error of naive realists is to assume the Core is immediately accessible without passing through the Superstructure. My position is that the Superstructure drifts, but the Core anchors it.

  #### 4. Epistemic Accounting: What is Settled vs. Speculative
  I need to be precise about the epistemic status of this argument.

  *   **Settled Consensus:** It is broadly accepted in economic history and STS (Science and Technology Studies) that technology and institutions exhibit increasing returns and lock-in (Arthur, David). It is also accepted that scientific research is shaped by paradigms, funding, and social networks (Kuhn, Latour). No serious philosopher claims science is purely objective and free from social influence.
  *   **Contested Territory:** The claim that science *converges* on truth (Scientific Realism) is heavily contested. Anti-realists and proponents of the "Underdetermination of Theory by Evidence" (Duhem-Quine) argue that data never uniquely identifies a theory. If multiple theories can fit the data, the choice between them could be path-dependent.
  *   **The "Referee Asymmetry" Status:** This specific framing is **speculative**. It is not a standard model in philosophy of science. It is a heuristic I am advancing to reconcile the reality of sociological influence with the obvious empirical success of modern science. It relies on a "Critical Realist" assumption: that there is a mind-independent world that imposes constraints, even if it doesn't dictate a single unique description. I am arguing that while underdetermination exists *locally* and *temporarily*, it does not hold *globally* and *permanently* because the cost of maintaining a false theory eventually becomes too high.

  #### 5. Self-Critique: The Weakest Joint
  If I am honest, the weakest joint in this argument is the **Theory-Ladenness of Observation**.

  My argument assumes the "referee" (the world) speaks a language we can understand independently of our theories. But post-Kuhnian philosophy suggests the referee's signals are interpreted *through* the paradigm. If a Ptolemaic astronomer sees a retrograde planet, they see "epicyclic motion." A Copernican sees "orbital perspective." The data itself is not neutral.

  If the referee's signals are always filtered through the very theory being tested, then a sufficiently robust paradigm could potentially explain away anomalies indefinitely. A "locked-in" science isn't one that ignores the referee; it's one that interprets the referee's whistles as fouls on the other team.

  My defense is pragmatic: eventually, the anomalies become too loud to interpret away. But I must admit this is a faith in the eventual triumph of friction over inertia. It is possible that in fields where the signal-to-noise ratio is low (cosmology, macroeconomics, parts of psychology), the "Referee Asymmetry" collapses, and science in those domains becomes indistinguishable from technology—governed by utility and consensus rather than truth.

  In those zones, I concede, the QWERTY effect might rule forever. But in the hard sciences, where the world can kill you if you are wrong, I bet on the referee.

  ***

  ### Summary of Epistemic Claims

  | Claim | Status |
  | :--- | :--- |
  | **Tech/Institutions lock in due to network effects** | **Settled** (Economic History/STS Consensus) |
  | **Science is influenced by social factors/paradigms** | **Settled** (Post-Kuhnian Consensus) |
  | **Science converges on mind-independent truth** | **Contested** (Scientific Realism vs. Anti-Realism) |
  | **"Referee Asymmetry" as the mechanism for convergence** | **Speculative** (My proposed heuristic) |
  | **Underdetermination is temporary, not permanent** | **Contested** (My argument assumes this) |
