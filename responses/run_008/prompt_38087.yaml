answer: |-
  This is a sophisticated intervention. You are effectively arguing for a shift from a *causal* model of voting (where votes are inputs causing an outcome) to a *constitutive* model (where votes are elements that define the nature of the outcome). In the language of social ontology, you are suggesting that the election is not merely an aggregation mechanism but a performative act that generates political authority.

  To make this rigorous for a rational choice seminar, you must translate this ontological claim into the language of utility functions and choice architecture without collapsing it back into the "civic duty" ($D$) term you wish to avoid. Below is a structured argument designed to meet the standards of a graduate seminar, including the formal distinction, the confrontation with the "smuggling" objection, and an honest assessment of the argument's limits.

  ---

  ### Title: Endogenous Legitimacy: A Constitutive Critique of the Downsian Paradox

  #### 1. Formalizing the Distinction: Separability vs. Non-Separability

  The standard Rational Choice Theory (RCT) model of voting relies on a **separability assumption** regarding the utility function. Let $a \in \{Vote, Abstain\}$ be the act, and $s \in \{Win, Lose\}$ be the state of the world (the election outcome). The standard utility function is additive:

  $$U(a, s) = V(s) + W(a)$$

  Here, $V(s)$ is the instrumental value of the candidate winning (the $B$ term in the calculus of voting). $W(a)$ captures the intrinsic cost or benefit of the act itself (the $C$ and $D$ terms). The paradox arises because $p \cdot \Delta V(s) < \Delta W(a)$ for large $N$. The "civic duty" solution simply inflates $W(Vote)$ with a positive psychological constant.

  Your argument proposes that this functional form is misspecified for certain classes of elections. You argue that the value of the state $s$ is not independent of the act $a$. Specifically, the *legitimacy* or *authority* of the outcome is a function of the participation set $P$.

  Let the outcome be defined not merely as the winner $w$, but as the pair $(w, P)$, where $P$ is the set of participants. The utility function is now non-separable:

  $$U(a, s) = V(w, P)$$

  In this framework, there is no separate $D$ term. The "benefit" is not derived from the *feeling* of voting (which would be $W(a)$), but from the *properties of the resulting political order*. If I vote, $P_{vote} = P_{others} \cup \{i\}$. If I abstain, $P_{abstain} = P_{others}$. Your claim is that $V(w, P_{vote}) > V(w, P_{abstain})$, even if $w$ is identical in both cases.

  #### 2. Confronting the "Smuggling" Rejoinder

  The most immediate objection from a standard RCT perspective will be: *"This is semantic window-dressing. Whether you call it 'legitimacy of the outcome' or 'satisfaction from duty,' you have simply added a term to the payoff table that makes voting rational. Mathematically, it is indistinguishable from the $D$ term."*

  To defeat this, you must distinguish between **psychological consumption** and **social ontology**.

  1.  **The Duty Term ($D$) is Private and Psychological:** In the standard model, $D$ represents a "warm glow." It is a private good consumed by the voter. If everyone else vanished, but I voted in an empty booth, I would still consume $D$. The value resides in my internal state.
  2.  **The Constitutive Term ($V(w, P)$) is Public and Structural:** Your argument posits that the *object* being valued is different. A law passed by a 90% turnout referendum has a different *deontic power* (to use Searle's term) than a law passed by a 10% turnout referendum, even if the text is identical. It is harder to repeal; it commands greater obedience; it stabilizes expectations.
      *   **The Test:** If I vote but my ballot is secretly discarded (so $P$ does not actually increase, though I think it does), the $D$-term model predicts I receive utility (I did my duty). Your model predicts I do *not* receive the full utility, because the outcome's legitimacy was not actually constituted by my participation.
      *   **The Test:** If I abstain, but turnout is nevertheless high, the $D$-term model predicts I miss out on the "warm glow." Your model predicts I still benefit from the high-legitimacy outcome, but *less* than if I had participated, because I am a subject of the law rather than a co-author of it.

  **Rigorous Distinction:** The $D$ term makes the *act* a consumption good. Your argument makes the *process* a production characteristic of the *outcome*. In the standard model, the production function is $Outcome = f(Votes)$. In your model, the Value function is $Value = g(Outcome, Turnout)$. This is not smuggling; it is correcting the specification of the commodity being purchased.

  #### 3. The Marginal Problem: Does One Vote Matter?

  Here is where your argument faces its stiffest mathematical headwind. Even if we accept $V(w, P)$, in a large election, the marginal contribution of voter $i$ to the set $P$ is $1/N$.

  If legitimacy $L$ is a continuous function of turnout $T$, then $\frac{\partial L}{\partial T}$ is vanishingly small. The expected utility gain from increasing legitimacy by one unit of turnout is still swamped by cost $C$.

  To save the argument from this marginalist critique, you must argue for **non-linearity** or **threshold effects** in the legitimacy function, or redefine the "margin."

  *   **Argument A: Thresholds (Quorum Logic).** Many constitutional mechanisms *do* have explicit thresholds. If the legitimacy function is step-wise (e.g., validity requires 50% turnout), then near the threshold, $p \cdot \Delta V$ is significant. However, this only explains voting when the election is expected to be close to the quorum.
  *   **Argument B: The "Authorship" Margin.** This is your stronger philosophical move. Do not model the benefit as the marginal increase in *aggregate* legitimacy. Model the benefit as the difference between being a *subject* vs. being an *author*.
      *   $V(w, P_{with\_i})$ includes the status of "Citizen who ratified this."
      *   $V(w, P_{without\_i})$ includes the status of "Subject who acquiesced."
      *   My vote is *decisive* for my own status, even if it is not decisive for the winner or the aggregate turnout percentage. I am 100% pivotal on the question: "Did *I* authorize this?"
      *   **RCT Translation:** The "outcome" is partly private status. The probability of being decisive for *my own authorship status* is 1.0, not $1/N$. Therefore, the calculation is: $1 \cdot (\text{Value of Authorship} - \text{Value of Acquiescence}) > C$.

  This bypasses the $p \approx 0$ problem entirely by shifting the locus of decisiveness from the *winner* to the *relationship between the voter and the winner*.

  #### 4. Honest Limits: Where the Argument Overreaches

  Your instructor will look for boundary conditions. If this argument were universal, turnout would be high in all elections. It is not. You must concede where the constitutive model fails.

  **1. Salience and Legitimacy Sensitivity**
  The argument holds only where the *value of the outcome* is genuinely sensitive to the production method.
  *   **High Salience (Constitutional/Founding):** The legitimacy of a new constitution *is* its primary asset. A constitution ratified by 10% of the population is effectively worthless. Here, $V(w, P)$ is highly elastic. Your model explains turnout here better than the $D$-term model.
  *   **Low Salience (Local/Technical):** Does the legitimacy of a sewer bond or a school board election depend on turnout? Empirically, no. These outcomes are treated as administrative rather than constitutive. If $V(w, P) \approx V(w)$, your model collapses back into the standard paradox.
      *   *Concession:* You cannot explain high turnout in low-salience elections using *only* this argument. In those cases, habit, social pressure, or the standard $D$-term are likely doing the heavy lifting. Your argument dissolves the paradox for *political* elections, but not necessarily for *administrative* ones.

  **2. The "Free-Rider on Legitimacy" Problem**
  Even in high-salience elections, if legitimacy is a public good (non-excludable), the abstainer still enjoys the stable government produced by high turnout without paying cost $C$.
  *   *Your Counter:* You must argue that the benefit of "Authorship" is excludable. Only those who voted can claim the status of "Author." If the utility derived from that status is high enough, it privatizes the public good of legitimacy.
  *   *Limit:* This requires voters to care deeply about their personal historical footprint. Many may not. If the "Value of Authorship" is low for a specific agent, they will still free-ride. Your model explains why *some* vote (those who value authorship), but not necessarily why *millions* vote unless the valuation of authorship is broadly shared.

  **3. Secret Ballots and Social Visibility**
  If the benefit is "Authorship," does the secrecy of the ballot undermine it? If no one knows I voted, do I still possess the status?
  *   If yes (internal status), it risks collapsing back into the psychological $D$-term.
  *   If no (social status), then secret ballots should reduce turnout compared to public voting. Evidence is mixed, but this is a vulnerability. You may need to argue that the *knowledge* of participation (even if private) is sufficient to constitute the internal status of citizenship.

  #### 5. Conclusion for the Paper

  Your thesis should not claim to solve the paradox universally. Instead, frame it as a **category error** in the standard literature.

  1.  **Claim:** The Downsian Paradox assumes elections are *lotteries over policies*.
  2.  **Correction:** For a significant subset of elections (constitutional, high-stakes, polarized), elections are *rituals of authorization*.
  3.  **Result:** In authorization rituals, the "outcome" is not separable from the "participation." The utility calculation changes from $p \cdot B - C$ to $1 \cdot (\text{Value of Status}) - C$.
  4.  **Scope:** This dissolves the paradox for "constitutive" moments but leaves the "administrative" voting paradox intact (requiring other explanations like habit or duty).

  This approach demonstrates theoretical sophistication. It shows you understand the math of RCT well enough to know where the variables are being placed, while demonstrating the philosophical acumen to question the ontology of the variables themselves. It respects the "honest limits" requirement by acknowledging that not all elections are created equal, which is a nuance often missing from broad generalizations in political science.
