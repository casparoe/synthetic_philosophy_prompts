  Been going down a St. Petersburg paradox rabbit hole after a friend brought it up at dinner and I realized I don't actually know what I think about it. Quick restatement so we're on the same page: a fair coin is flipped until it comes up heads, and if the first heads is on toss n you get 2^n dollars. Expected value is (1/2)(2) + (1/4)(4) + (1/8)(8) + ... which sums to infinity, so supposedly you should be willing to pay any finite price to play, but everyone refuses to pay even a hundred bucks and nobody feels irrational about it.

  There's a pile of "solutions" floating around and I want to figure out what credence to put on each of them being basically right, not just a name-drop of who proposed what. So give me your actual credence, decomposed roughly along these lines (or better lines if you see them): that utility is bounded, so the series converges in utility even though it diverges in dollars; that the whole thing dissolves once you notice any real counterparty has finite assets and the truncation quietly does all the work; that expected-utility maximization itself is the wrong norm for this kind of case and some risk-weighted or rank-dependent machinery is what we shouldve been using all along; and that it's a fake problem, a geometric curiosity that only feels paradoxical because we mistake a divergent series for a decision. Rough probability for each, one or two lines of justification per term, then how you combine them, and which term the overall picture is most sensitive to.

