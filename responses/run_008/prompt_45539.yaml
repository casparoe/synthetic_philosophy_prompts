answer: |-
  **The Principle of Independent Corroboration with Faculty Exception**

  Knowledge of a source's reliability derived from track-record reasoning requires that the truth of the track-record instances be verified by a source distinct from the one being tested. This prevents bootstrapping, where a source vouches for itself without external check. However, this requirement is waived for basic cognitive faculties—specifically perception, memory, and deduction—because demanding independent verification for these would induce global scepticism, as no distinct source is available to verify them universally. Furthermore, knowledge gained from a source does not extend via logical entailment to propositions that rule out sceptical hypotheses regarding that source's reliability, unless independent verification of those hypotheses exists. This blocks 'easy knowledge' closures while preserving ordinary perceptual claims. The principle thus distinguishes between instrumental sources, which require external validation, and constitutive faculties, which are entitled to trust by default, whilst limiting the deductive reach of both when sceptical alternatives are at stake.

  **Application to the Six Cases**

  1.  **The Fuel Gauge:** The gauge is an instrument, not a basic faculty. The housemate verifies the gauge's past accuracy using the gauge itself (observing fuel levels via the gauge to confirm the gauge). This violates the Independent Corroboration requirement. There is no distinct source confirming the fuel levels. The principle delivers **No Knowledge**, matching your verdict.

  2.  **The White Table:** Perception is a basic faculty, so the exception waives the corroboration requirement for the claim 'the table is red'. You know this directly. However, 'not a white table lit red' is a sceptical hypothesis regarding the lighting conditions necessary for perception's reliability. The Closure Restriction blocks inferring this negation solely from the perceptual output. The principle delivers **Knows Red, Does Not Know Not-White-Table**, matching your verdict.

  3.  **My Own Memory:** Memory is a basic cognitive faculty. The Independent Corroboration requirement is waived because verifying memory always requires memory. To demand distinct verification here is to demand the impossible. The principle delivers **Knowledge**, matching your verdict. The distinction lies solely in the faculty versus instrument classification.

  4.  **The Customs Dog:** The dog is an instrument. The handler verifies positive alerts via physical finds (distinct source: physical evidence). This satisfies corroboration for positive reliability. However, there is no verification for non-alerts (no distinct check on missed drugs). The principle delivers **Knows Positive Reliability, Does Not Know Negative Reliability**, matching your verdict on the asymmetry.

  5.  **Here is a Hand:** Perception is basic, so 'Here is a hand' is known via the exception. However, 'There is an external world' is a precondition for perceptual reliability, functioning as a sceptical hypothesis negation. The Closure Restriction blocks inferring the external world from the hand alone without independent verification of the world's existence. The principle delivers **Knows Hand, Does Not Know External World (via this inference)**.

  6.  **Cousin's Films:** The cousin is an instrument (testimony). Verification comes from your own judgement of the films. Your judgement is a distinct cognitive source from her testimony. This satisfies Independent Corroboration. The principle delivers **Knowledge**, matching your verdict. The circularity is benign because two distinct sources interact.

  **The Hard Pair: Cases 1 and 3**

  Cases 1 and 3 present the sharpest tension: both involve using a source to confirm its own reliability. The principle saves both verdicts by invoking the Faculty Exception. Memory is constitutive of your epistemic agency; you cannot step outside it to check it. The fuel gauge is contingent; you can check it against a dipstick or mechanic. If we overturn Case 3 and demand independent corroboration for memory, we invite global scepticism, as no knowledge survives the loss of memory. If we overturn Case 1 and allow self-vouching for instruments, we permit trivial bootstrapping, rendering reliability too easy to acquire.

  The cost of saving both is accepting a form of epistemic particularism that privileges human cognition over tools. Critics may call this species chauvinism, arguing that a reliable gauge deserves the same entitlement as memory. However, the principle holds that entitlement is not about reliability alone, but about inevitability. We are forced to trust memory; we are not forced to trust the gauge. Therefore, Case 3 remains knowledge, and Case 1 remains non-knowledge. The principle holds firm: circularity is vicious only when avoidable.

  **Predictions**

  1.  **The Unchecked Barometer:** A barometer tracks pressure changes, and you believe it is reliable because it predicts weather that you subsequently experience. However, you only experience the weather via perception, and you trust the barometer only because it matches perception. If perception is the only check, and the barometer is treated as an instrument, this risks violating Independent Corroboration if perception is not treated as distinct enough in this specific causal chain. However, since perception is a basic faculty, the principle predicts you **know the barometer is reliable**, provided you treat perception as the distinct verifier. This differs from the gauge case where the gauge verified the gauge.

  2.  **Reasoning Checking Reasoning:** You use logical deduction to prove that deduction is reliable. Deduction is a basic faculty. The Faculty Exception applies. The principle predicts you **know deduction is reliable**, despite the circularity. This aligns with Case 3. Any attempt to deny this collapses rationality itself.

  3.  **Community Consensus:** You believe a community is reliable because everyone you ask agrees with you. You sample them via your senses. Your senses are basic, but the community's truth is external. You lack independent access to the truth of their claims aside from your own judgement. If your judgement is the only check, this mirrors the gauge case if 'community truth' is the instrument. The principle predicts **No Knowledge** of their objective reliability, only knowledge of their agreement. You cannot bootstrap objectivity from consensus alone without independent access to the facts they discuss.

  **Verdicts I Must Give Up**

  I must overturn your unsettled verdict on Case 5 regarding the external world. You are 'back and forth', but the principle demands a decision. To maintain coherence with Case 1 (the gauge) and Case 2 (the table), you must admit that you do **not** know there is an external world via the inference from 'Here is a hand'. You know you have a hand, but the inference to the external world is blocked by the Closure Restriction on sceptical hypotheses. Accepting Mooreanism here would undermine the ban on bootstrapping in Case 1. The cost is conceding that scepticism about the external world cannot be refuted by simple perceptual proof, but this is a necessary price to prevent epistemic triviality.
