answer: |-
  You are correct that the literature often papers over this with "vibes." Lionel Robbins (the 1930s economist you're thinking of) declared interpersonal utility comparisons scientifically meaningless, and he was right: I cannot feel your headache. Yet every tax code and welfare program implicitly claims to do exactly that.

  Here is the spec. These are the functional requirements for any metric of equality (*the equalisandum*) that claims to guide actual policy rather than just decorate a seminar room.

  I have categorized them as **Hard Constraints** (if you fail this, you cannot run a state) or **Contested Constraints** (if you fail this, a specific philosophical coalition will revolt, but the system might still function).

  ### The Spec for an Equality Metric

  #### 1. The Bureaucracy Test (Operationalizability)
  *   **Requirement:** The metric must be measurable by a third party without invasive surveillance or impossible computation.
  *   **Concrete Case:** A tax agency can verify your income (Resources). It cannot verify your internal serotonin levels (Welfare). If your metric requires knowing whether the deaf person *feels* deprived or culturally enriched, you need a mind-reading device.
  *   **Status:** **Hard Constraint** (for policy). If you can't measure it, you can't distribute it. If you admit you are only an "ideal theory," you concede you have no advice for actual legislators.

  #### 2. The Conversion Test (Needs & Disability)
  *   **Requirement:** The metric must account for the fact that different people need different amounts of the metric to achieve the same functioning.
  *   **Concrete Case:** Giving $50k to a paraplegic and $50k to an able-bodied person is equal resources, but the paraplegic must spend $15k on ramps and care to achieve the same mobility. If the metric ignores this, it treats a medical tax as a lifestyle choice.
  *   **Status:** **Hard Constraint** (for fairness). Ignoring this makes the system cruel by design. *Note: The Deaf community objection fits here—they argue deafness is not a conversion cost but a different operating system. Your metric must decide if it equalizes "mainstream functioning" or "cultural flourishing."*

  #### 3. The Champagne Test (Expensive Tastes)
  *   **Requirement:** The metric must decide whether it compensates for cultivated preferences that are costly to satisfy.
  *   **Concrete Case:** Person A is happy with beer and beans. Person B trained their palate to require vintage champagne to be equally happy. Do we transfer money from A to B to equalize their satisfaction?
  *   **Status:** **Contested Constraint**. Luck Egalitarians say "No, that's B's responsibility." Welfarists say "Yes, suffering is suffering." Most policy defaults to "No" because "Yes" incentivizes everyone to cultivate expensive tastes.

  #### 4. The Happy Slave Test (Adaptive Preferences)
  *   **Requirement:** The metric must handle people whose desires have shrunk to fit their oppression.
  *   **Concrete Case:** A woman in a deeply patriarchal society reports high life satisfaction because she has internalized that her role is servitude. A Welfarist metric says "She's fine, don't intervene." A Capability metric says "She is deprived of the ability to choose otherwise, even if she doesn't want to."
  *   **Status:** **Contested Constraint**. Fixing this requires paternalism (telling people they are wrong about their own happiness). Ignoring it locks in historical oppression.

  #### 5. The Surf Bum Test (Responsibility & Choice)
  *   **Requirement:** The metric must distinguish between bad luck and voluntary choice.
  *   **Concrete Case:** Person A is poor due to structural unemployment. Person B is poor because they chose to surf full-time. If you equalize outcomes, you tax A to subsidize B. If you don't, you punish A for bad luck.
  *   **Status:** **Contested Constraint**. This is the Luck Egalitarianism battleground. To track choice requires intrusive inquiries into "why" someone is poor, which violates privacy and creates stigma.

  #### 6. The Cobra Effect Test (Gameability)
  *   **Requirement:** The metric must not incentivize people to destroy the thing being measured to get the compensation.
  *   **Concrete Case:** If you compensate for "low earning potential," people will stop developing skills. If you compensate for "misery," people will learn to act miserable. If you compensate for "disability," people will hide recovery.
  *   **Status:** **Hard Constraint**. If the metric destroys itself when implemented, it is useless.

  #### 7. The Leveling Down Test (Non-Destruction)
  *   **Requirement:** The metric must not imply that equality is good if it makes everyone worse off.
  *   **Concrete Case:** If the blind are worse off than the sighted, a strict equality metric might suggest blinding the sighted is a "gain" in equality. Almost everyone agrees this is absurd, but some strict egalitarian formulas struggle to explain *why* without importing outside values.
  *   **Status:** **Hard Constraint**. A metric that recommends mutual destruction to achieve parity is broken.

  ---

  ### The Impossibility Theorem

  You suspected the **Operationalizability Requirement** is at war with everything else. **You are right.** This is not just a tradeoff; it is a structural incompatibility.

  **The Information Problem:**
  To satisfy **Conversion**, **Adaptive Preferences**, and **Expensive Tastes**, you need *internal* data (utility functions, psychological states, true capabilities).
  To satisfy **Bureaucracy** and **Gameability**, you need *external* data (income, assets, observable behaviors).

  *   **If you measure Internal Data (Welfare):** You fail the Bureaucracy Test (can't measure happiness) and the Gameability Test (people will lie about happiness to get money).
  *   **If you measure External Data (Resources):** You fail the Conversion Test (ignores disability costs) and the Adaptive Preferences Test (ignores that resources don't buy freedom for everyone).

  **The Responsibility Paradox:**
  To satisfy the **Surf Bum Test** (tracking choice), you must investigate people's lives.
  To satisfy **Privacy/Dignity** (often a hidden requirement), you must not investigate people's lives.
  *   **Result:** You can have a system that tracks responsibility (means-tested welfare with intrusive checks) OR a system that preserves dignity (universal basic income), but you cannot have both.

  **Conclusion on Tension:** It is not just "everything's a tradeoff." It is that **Accuracy** (getting the moral math right) and **Implementability** (actually running the system) are orthogonal vectors. The more accurate your metric is morally, the less stable it is politically and administratively.

  ---

  ### Scorecard: The Big Three Candidates

  Here is how the standard contenders score against the spec.

  | Requirement | **Welfarism** (Equalize Happiness/Utility) | **Resourcism** (Equalize Income/Primary Goods) | **Capabilities** (Equalize Freedom to Function) |
  | :--- | :--- | :--- | :--- |
  | **1. Bureaucracy** | **FAIL.** Cannot measure utility interpersonally. | **PASS.** Money is easy to count. | **FAIL.** "Capabilities" are hypotheticals, hard to count. |
  | **2. Conversion** | **PASS.** Automatically accounts for disability (if they are unhappy, you pay). | **FAIL.** Ignores that disabled need more money for same result. | **PASS.** Explicitly designed for this (mobility vs. legs). |
  | **3. Expensive Tastes** | **FAIL.** Must subsidize champagne to equalize utility. | **PASS.** Ignores tastes, gives same cash to all. | **PASS.** Focuses on basic function, not luxury satisfaction. |
  | **4. Adaptive Preferences** | **FAIL.** Respects the "Happy Slave's" report. | **PASS/FAIL.** Gives resources, but doesn't ensure freedom. | **PASS.** Counts lack of option even if person is content. |
  | **5. Responsibility** | **FAIL.** Hard to distinguish choice from luck in utility. | **PASS/FAIL.** Cash allows choice, but doesn't track it. | **FAIL.** Hard to determine if capability was forgone voluntarily. |
  | **6. Gameability** | **FAIL.** High incentive to fake misery. | **PASS.** Harder to fake income loss (auditable). | **FAIL.** Hard to verify "lack of opportunity." |
  | **7. Leveling Down** | **PASS.** Usually avoids this via total utility max. | **PASS.** Generally avoids this. | **PASS.** Focuses on expansion, not leveling. |

  **Summary:**
  *   **Welfarism** is morally intuitive but administratively impossible.
  *   **Resourcism** is administratively easy but morally blind to human difference.
  *   **Capabilities** is the moral "gold standard" for philosophers but remains a vague spec sheet for engineers.

  **Verdict:** There is no metric that passes all Hard Constraints. Policy is the art of choosing which Hard Constraint you are willing to violate. Most modern states choose **Resourcism** (money) for the base, with patchy **Capability** overrides (ADA accommodations, healthcare) to fix the worst Conversion failures, while explicitly ignoring the **Welfarist** and **Responsibility** questions because they are too expensive to compute.
