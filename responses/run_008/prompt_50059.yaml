prompt: |-
  Been reading the rationalist blogs since the Overcoming Bias days, and there's one argument I've never seen actually get resolved: when we say a policy makes people "better off" or treats people "equally," what is the thing being equalized? Money? Happiness? Ability to do stuff? Everyone agrees on equal moral worth and then the rubber hits the road. I've watched people in EA circles fight about whether being born deaf counts as a deficit (the QALY people say yes, the Deaf comunity says no, we're a culture not a damage report), and whether the guy who developed a taste for champagne is owed more income than the guy who's happy with beer. Also somewhere in the 1930s an economist declared interpersonal utility comparisons meaningless and everyone just kept making them anyway, which makes me trust nobody. It's all vibes. So before I go read the actual distributive justice literature, I want the spec first, not a tour of isms.

  Write me the list of requirements that any candidate metric of equality — the thing you'd literally equalize across persons — has to meet, with the concrete case behind each one (I care way more about the cases than the labels). Some things I'd expect to show up somewhere in the list, add or cut as you judge:

  - it has to be operationalizable enough that an actual agency could measure it approximately, or else explicitly own up to being only a standard for comparing institutions in the abstract
  - it has to take a position on expensive tastes and on people who convert money into wellbeing at wildly different rates (disability, chronic illness, being someone who needs quiet to function)
  - it has to handle adaptive preferences — the person whose wants shrank to fit their circumstances — without either patronizing them or letting oppression set the baseline
  - it has to say whether choice matters: is the guy who deliberately chose the low-income surf-bum life owed redistribution, and why is that case different from the person whose "choice" happened under bad options
  - it can't be trivially gameable, and if strictly equalizing the metric predictably destroys it (leveling everything down to nothing), the theory should have something to say about that

  Mark which requirements are non-negotiable and which are just one camp's preferences dressed up as demands. And the part I most want: tell me whether some subset of these can't be satisfied together. I have a suspicion the operationalizability requirement is at war with basically everything else on the list, and I want to know if that's a real tension or me pattern-matching to "well, everything's a tradeoff."

  At the end, briefly run plain welfare, plain resources, and capabilities against the list — short scorecard is fine, the criteria are the part I actually want.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Long-time rationalist blog reader (Overcoming Bias era), skeptical of vague philosophical hand-waving, wants concrete "specs" for a metric of equality.
      *   **Core Question:** What are the requirements for a candidate metric of equality (the *equalisandum*)?
      *   **Specific Constraints:**
          *   Focus on concrete cases, not labels/isms.
          *   Include specific expected topics: operationalizability, expensive tastes/disability conversion rates, adaptive preferences, choice/responsibility, gameability/leveling down.
          *   Mark requirements as "Non-Negotiable" vs. "Contested/Preference."
          *   Identify impossibility theorems/trade-offs (specifically operationalizability vs. others).
          *   End with a scorecard for Welfare, Resources, and Capabilities.
      *   **Tone:** Direct, analytical, slightly cynical (matching the user's "it's all vibes" sentiment), avoiding academic fluff.

  2.  **Deconstruct the Requirements (The "Spec"):**
      *   *Requirement 1: Measurement/Operationalizability.* Can a bureaucrat actually measure this? If not, admit it's ideal theory.
      *   *Requirement 2: Conversion Factors (Disability/Needs).* Money isn't enough. A wheelchair user needs more money to achieve the same mobility.
      *   *Requirement 3: Expensive Tastes.* Do we subsidize the champagne drinker? Most say no, but why?
      *   *Requirement 4: Adaptive Preferences.* The "happy slave" or the crushed spirit. Do we respect their stated satisfaction or override it?
      *   *Requirement 5: Responsibility/Choice.* The surf bum vs. the trapped worker. Does choice excuse inequality?
      *   *Requirement 6: Gameability/Perverse Incentives.* If we measure X, will people fake X? Does equalizing X destroy X?
      *   *Requirement 7: The Leveling Down Objection.* Is equality good if it makes everyone worse off? (Implicit in the prompt's "leveling everything down to nothing").

  3.  **Classify Requirements (Non-Negotiable vs. Contested):**
      *   *Non-Negotiable:* Logical consistency, non-self-defeating (mostly). Actually, in philosophy, *nothing* is truly non-negotiable across all camps. However, for a *functional policy metric*, operationalizability and non-gameability are practical non-negotiables. For a *moral theory*, respecting agency (choice) and addressing suffering (conversion factors) are usually high priority. I need to be careful here. The prompt asks me to judge. I will classify based on "necessary for a working policy" vs. "ideological battleground."
      *   *Contested:* Expensive tastes (hedonic vs. resource), Adaptive preferences (paternalism vs. respect), Choice (luck egalitarianism vs. sufficientarianism).

  4.  **Identify Impossibility/Tensions:**
      *   *The Big One:* Operationalizability vs. Accuracy (Welfare/Capabilities). You can measure money easily. You cannot measure "capability to function" or "true happiness" easily without invasive surveillance or self-reporting (which is gameable).
      *   *The Responsibility Tension:* Respecting choice (surf bum) vs. Preventing destitution. If we penalize bad choices, we punish the poor who had no good choices.
      *   *The Adaptation Tension:* Respecting stated preferences vs. Objective well-being.
      *   *Sen's Impossibility:* You can't have Perfect Liberty, Perfect Equality, and Pareto Efficiency all at once (Liberal Paradox). Though the prompt asks about *metrics*, not social choice functions, the tension remains between individual sovereignty and equal outcomes.
      *   *Specific Confirmation:* The user suspects Operationalizability is at war with everything else. This is correct. The more accurate the metric (welfare), the harder it is to measure. The easier to measure (resources), the less accurate it is regarding actual well-being.

  5.  **Drafting the Content - Section by Section:**

      *   **Intro:** Acknowledge the "vibes" problem. Validate the skepticism about interpersonal utility comparisons (IUc).
      *   **The Spec (Requirements):**
          1.  *Measurability (The Bureaucracy Test).* Non-negotiable for policy, negotiable for theory. Case: Tax forms vs. Brain scans.
          2.  *Conversion Sensitivity (The Disability Test).* Non-negotiable for fairness. Case: Wheelchair ramp costs vs. cash.
          3.  *Taste Neutrality (The Champagne Test).* Contested. Case: Cultivated taste vs. biological need.
          4.  *Preference Integrity (The Happy Slave Test).* Contested (Paternalism risk). Case: Oppressed people reporting high happiness.
          5.  *Responsibility Tracking (The Surf Bum Test).* Contested (Luck Egalitarianism). Case: Voluntary poverty vs. structural unemployment.
          6.  *Incentive Compatibility (The Cobra Effect Test).* Non-negotiable for sustainability. Case: Faking disability.
          7.  *Non-Destructiveness (The Leveling Down Test).* Non-negotiable for common sense. Case: Blinding the sighted to match the blind.
      *   **The Impossibility Theorem (The "Real Tension"):**
          *   Confirm the user's suspicion. Operationalizability conflicts with Conversion Sensitivity and Preference Integrity.
          *   Explain *why*: Information asymmetry. Only the individual knows their utility function/capabilities. The state only sees resources.
          *   Mention the "Responsibility vs. Safety" trade-off.
      *   **The Scorecard:**
          *   *Welfarism (Happiness/Utility):* Fails Measurement, Fails Gameability, Fails Expensive Tastes (usually). Passes Conversion.
          *   *Resourcism (Money/Primary Goods):* Passes Measurement, Passes Gameability. Fails Conversion, Fails Expensive Tastes.
          *   *Capabilities (Sen/Nussbaum):* Passes Conversion, Passes Adaptive Preferences. Fails Measurement, Fails Gameability (hard to define the list).

  6.  **Refining the Tone:**
      *   Avoid academic jargon where possible (e.g., instead of "Pareto Optimality," use "making everyone worse off").
      *   Keep it punchy.
      *   Ensure the "Non-Negotiable" vs. "Contested" distinction is clear.
      *   Make sure the "Impossibility" section directly addresses the user's suspicion about operationalizability.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the Deaf community case? *Adjustment:* Include it in Conversion Sensitivity or Preference Integrity. It fits well in Conversion (is it a cost or a culture?).
      *   *Check:* Did I address the 1930s economist (Robbins)? *Adjustment:* Mention him in the intro or the Measurement section to validate the user's historical reference.
      *   *Check:* Is the distinction between "policy metric" and "moral truth" clear? *Adjustment:* Emphasize that some requirements are for *running a state* vs. *writing a philosophy paper*.
      *   *Check:* The user asked for "Non-Negotiable" vs "One camp's preferences." I need to be decisive here. I will label "Measurability" as non-negotiable for *implementation* but note that philosophers ignore it. I will label "Responsibility" as highly contested.

  8.  **Final Polish:** Check against the prompt's specific request for "the spec first, not a tour of isms." Ensure the scorecard is brief. (Proceed to generate output).

  *(Self-Correction on "Non-Negotiable"):* In philosophy, nothing is non-negotiable. But the prompt asks for requirements a *candidate metric* has to meet to be *useful*. I will frame "Non-Negotiable" as "If you fail this, you cannot function as a public policy guide," and "Contested" as "If you fail this, a specific philosophical camp will reject you, but you might still run a government."

  *(Refining the Impossibility):* The core tension is the "Information Problem." To equalize welfare, you need info people have incentives to hide. To equalize resources, you ignore the info you need. This is the "Operationalizability vs. Accuracy" trade-off.

  *(Final check on the Deaf case):* This is crucial. It's not just disability; it's identity. I should put this under "Conversion/Needs" but note the cultural objection.

