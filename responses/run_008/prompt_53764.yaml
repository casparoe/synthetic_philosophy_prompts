answer: |-
  Here is a principle that organizes your intuitions, followed by the predictions and the honest confession you asked for.

  ### The Principle: Fairness & Values vs. Optimization & Coordination

  Your intuitions track a distinction between decisions where the primary goal is **procedural fairness or moral legitimacy** versus decisions where the primary goal is **systemic optimization or strategic coordination**.

  1.  **The Fairness/Values Domain (Use Lottery):**
      *   **Equal Claims:** When recipients are equally qualified (medically matched patients, housing applicants), there is no technical basis to choose one over the other. Optimization is impossible; only fairness remains. A lottery prevents bias and acknowledges moral equality.
      *   **Community Conscience:** When the decision requires applying shared moral standards rather than technical knowledge (Jury verdicts, abortion values), a random cross-section of the public is *more* competent than an elite. They *are* the source of the legitimacy.

  2.  **The Optimization/Coordination Domain (Use Selection/Experts):**
      *   **Technical Expertise:** When there is a objectively "better" answer based on specialized knowledge (Central Bank rates), random selection introduces unacceptable risk.
      *   **Systemic Coherence:** When decisions must fit together into a complex, long-term system (Legislation, Budgeting), coordination and accountability are required. A jury decides one discrete case; a legislature must ensure tax law doesn't contradict trade law. Random individuals cannot easily coordinate or be held accountable for long-term outcomes.

  ### How It Maps to Your Verdicts

  *   **Jury:** *Values/Discrete.* It applies community standards to a specific past event. No systemic coordination needed. **(Fits)**
  *   **Citizens' Assembly (Abortion):** *Values.* It asks "What kind of society are we?" which is a moral question, not a technical one. **(Fits)**
  *   **Organs/Housing:** *Equal Claims.* Medical experts filter for eligibility (Optimization), but the final choice among equals is fairness. You prefer fairness over trying to guess who will live longest. **(Fits)**
  *   **Central Bank:** *Technical/Optimization.* There are right and wrong answers based on macroeconomic theory. **(Fits)**
  *   **Lottocracy:** *Coordination/Accountability.* Legislating requires weaving thousands of rules into a coherent whole and answering for the results later. Random selection breaks the chain of accountability and makes coordination nearly impossible. **(Fits)**

  ### The Prediction

  Here is what this principle predicts for your new cases:

  1.  **Randomly auditing tax returns:** **Fine (Recommended).**
      *   *Reasoning:* This falls under **Equal Claims**. Every taxpayer is theoretically subject to the law. Random auditing prevents the state from targeting political enemies or favored groups. It is a tool of fairness and deterrence, not technical optimization.
  2.  **Randomly choosing which companies receive a scarce licence:** **Fine (Conditional).**
      *   *Reasoning:* This matches the **Organs/Housing** case. *If* the companies are equally qualified (meeting all safety/financial criteria), a lottery prevents corruption and favoritism. However, if one company is objectively better (e.g., safer technology), the principle demands the expert choice. The lottery is only for the "tie-breaker" scenario among equals.

  ### The Honest Confession: What The Principle Can't Save

  There is one tension in your verdicts that this principle exposes rather than resolves: **The Citizens' Assembly vs. Lottocracy.**

  You said a Citizens' Assembly hashing out policy is "fine," but a Lottocracy (random legislature) leaves you "uneasy."

  *   **The Conflict:** If the Citizens' Assembly has *binding* power to set policy, it *is* a lottocracy, just limited to one topic. If your unease with Lottocracy stems from a lack of accountability or systemic coordination (as the principle suggests), a Citizens' Assembly with real power suffers the same defect. It creates a law that must interact with other laws, without the mechanism of elections to remove them if they mess up.
  *   **The Save:** The only way to save this verdict is to lean heavily on the fact that the Irish Assembly was **advisory** (leading to a public referendum) and **single-issue** (moral values).
  *   **The Failure:** If you believe the Assembly should have *final* legislative authority on abortion, the principle suggests you *should* be as uneasy about that as you are about the Lottocracy. Both involve random citizens making binding rules. The distinction between "moral policy" (Assembly) and "general policy" (Legislature) is thinner than it feels; budgets are moral documents, too.

  **Verdict:** The principle validates your unease about the Lottocracy, but it implies your comfort with the Citizens' Assembly is only stable as long as it remains advisory or strictly confined to value judgments. If you grant it binding legislative power, the principle predicts you ought to feel the same unease you feel about the Lottocracy.
