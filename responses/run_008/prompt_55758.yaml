      *(Self-Correction during drafting)*: Make sure the Behavioral Econ objection is distinct from the Tacit Consent one. Tacit Consent is normative (legitimacy); Status Quo Bias is empirical (mechanism). Both attack the "rolling commitment" but from different angles. I will prioritize the Status Quo Bias as #1 because the Behav Econ person is the wildcard and that's their lane, but Tacit Consent is the *philosophical* killer. Actually, for a Law/Phil workshop, the Tacit Consent (Humean) objection is more damaging to the *theory*. I'll put Tacit Consent as #1.

      *Wait, re-reading the prompt:* "Originalists... fond of the dead hand." "Political theorists... think behavioral econ is decoration." "Behav econ... husband is in dept."
      *Okay, the Originalists are the main threat.* They will attack the "Dead Hand is a bug" premise. But the "Rolling Commitment" is the weakest link theoretically.
      *Let's order by "Damage to the Chapter's Core Claim".*
