          2.  *Crew Problem:* Even in the myth, Ulysses doesn't tie himself; the crew does. It's "other-commitment," not "self-commitment."
          3.  *The Patch:* Rolling commitment. Entrenchment exists only because each generation *declines* to amend. It's continuously re-tied by non-use.
      *   **Audience:**
          *   Originalist Law Scholars (like the dead hand).
