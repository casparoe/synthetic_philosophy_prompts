prompt: |-
  ok so i run a philosophy club at my high school — about 14 of us, we get a classroom for an hour after school on thursdays — and next week its my turn to run the session. i've gotten kind of obsessed with this thing where "superman is clark kent" feels like actual news but "superman is superman" is completely useless information, even tho if names just label things then both sentences amount to saying the same guy is the same guy. apparently this goes back to some 19th century logician (frege?) but nobody in my club has heard of any of it and i dont want to lecture for an hour. i want them to basically stumble into the puzzle before i name it.

  design me an activity or game for this. my half-formed idea: some setup where people in the club recieve little pieces of info about two "characters" over the course of the game (a detective thing? two masked players texting the group?) and then the big reveal is that the two characters were the same person all along, and the debrief is where they realize they can't explain why that reveal felt like it *taught them something* if names are just labels stuck on things. but honestly throw my idea out if you have something better, mine might be too complicated for an hour.

  what i need from you:

  - rules that actually work for ~14 teenagers in 60 minutes, basically no materials (paper/pens fine, i can print a few sheets if needed)
  - the puzzle has to hit them during the game, not be explained up front. ideally there's a moment where they're like wait, that told me something new, and then a second moment where they go wait, how could it have?
  - a debrief that maps what happened onto the two sentence types — like the boring trivial one vs the informative one, maybe also the morning star / evening star version my cousin mentioned once
  - an honest section on what a game like this can't get at — like does it do anything for the harder part where you can believe something about superman but not about clark kent even knowing they're the same guy, or does that part just have to be talked through afterwards no matter what
  - and tell me what will predictably go wrong the first time i run it, i've only facilitated like two sessions before lol

  also if it makes sense to do a round at the end where they guess at answers themselves (like "the name carries info about how it was given to the thing" vs "there's no real problem here") that would be great, they like arguing with each other more than they like listening to me.
