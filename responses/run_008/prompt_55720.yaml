answer: |-
  I tell you clearly that this act is **wrong**,  
  No virtue hides beneath the habit **lying**;  
  I think of you, and also of your **brother**,  
  And ask you what you'd say **if**  
  I feel the sharp reflex to **boo**—  
  At everything you claim is just the **same**.  

  You claim the contexts are not quite the **same**.  
  Yet if the premise holds that it is **wrong**,  
  Does truth survive the embedded act of **lying**?  
  I watch you glance across at your **brother**,  
  Suspended on the particle **if**,  
  Where the only logic left was to **boo**.  

  I do not merely want to **boo**,  
  I want the logic held to be the **same**.  
  For if the meaning shifts, then what is **wrong**  
  In one place might excuse the **lying**  
  That you encourage in your younger **brother**,  
  Unless we stabilize the scope of **if**.  

  So let us test the structure of this **if**.  
  Does it permit us still to **boo**  
  When not asserting that the meaning's **same**?  
  For otherwise the force is lost from **wrong**,  
  A mere description of the **lying**,  
  And loses hold upon the younger **brother**.  

  You say you'd never let your **brother**  
  Be trapped inside the scope of such an **if**.  
  But when the moral sentiment says **boo**,  
  It must remain univocally the **same**,  
  Or else the conclusion is not **wrong**,  
  But merely distinct from the initial **lying**.  

  So distinct from the initial **lying**,  
  The conclusion binds you and your **brother**.  
  Yet how can logic survive the **if**  
  When all you want to do is **boo**?  
  Unless the meaning stays exactly the **same**,  
  The inference fails, and nothing is **wrong**.  

  *Envoi*  
  If you distinguish practical **lying**  
  From the mere impulse to **boo**,  
  Then logic breaks beneath the weight of **if**.  
  I stand beside you and your little **brother**,  
  Hoping the moral sense remains the **same**,  
  Lest nothing left is truly **wrong**.  

  ***

  **Note on Form and Argument**

  The sestina's recursive end-words enact the Frege–Geach problem by forcing the same terms to occupy different syntactic and semantic positions across stanzas. In the first stanza, "wrong" and "boo" function in an asserted context, mirroring the expressivist's account of simple moral judgment. As the poem progresses, these words are embedded within conditionals ("if"), negations, and belief contexts, replicating the embedding problem where the expressivist struggles to maintain univocality. The rotation ensures that "wrong" appears sometimes as a predicate of action and sometimes as a component of a logical structure, highlighting the tension between normative force and logical validity. The envoi crystallizes the dilemma: unless the meaning remains the "same" across these shifts, the inference collapses, leaving nothing "wrong." Thus, the form does not merely describe the philosophical puzzle but performs the very instability of meaning it critiques. The poem enacts the modus ponens internally while demonstrating why the expressivist finds the validity of that inference difficult to secure. Ultimately, the structure leaves the tension intact, refusing a cognitivist resolution while acknowledging the necessity of logical coherence.
