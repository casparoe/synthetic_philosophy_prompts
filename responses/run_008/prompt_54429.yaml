              *   *Searle:* Student critiques Searle for not explaining obligations. Searle admits his account is less about normative obligations (Gilbert's strength) and more about the psychological primitive. But the student's main error in (a) (status functions) clouds this.
              *   *Verdict:* The preference for Bratman is defensible (standard view for this case). The critique of Gilbert is internally consistent with their earlier error but philosophically weak. The critique of Searle is muddled by the status function error.

