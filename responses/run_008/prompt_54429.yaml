      *   **Part (a) - Searle:**
          *   *Student Claim:* Nod creates a *status function*. Counts as a pushing team. Institutional fact. Collective acceptance.
          *   *Philosophical Check:* Searle distinguishes "We-intentions" (primitive) from "I-intentions." He argues collective intentionality is biologically primitive, *not* derived from status functions or institutional facts in the case of simple joint action like pushing a car. Status functions (X counts as Y in context C) apply to *institutional* facts (money, marriage, government). Pushing a car is a *brute* fact involving collective intentionality, not necessarily an institutional fact requiring a status function.
          *   *Nuance:* This is a **major error**. Searle explicitly uses examples like "we are pushing the car" to show We-intentions that exist *prior* to institutions. Applying "status function" here conflates Searle's theory of social ontology (institutions) with his theory of mind (collective intentionality). The student treats the "team" as an institutional status created by the nod. Searle would say the We-intention exists in the head; the nod just coordinates it.
