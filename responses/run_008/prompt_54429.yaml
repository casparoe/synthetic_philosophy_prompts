              *   *Gilbert:* Doesn't depend on physical necessity. You can form a plural subject to do something you could do alone.
              *   *Searle:* Doesn't depend on physical necessity.
              *   *General:* The definition of joint action in all three theories relies on the *structure of intention/commitment*, not the *physical possibility* of solo success. If I intend to push with you, it's joint, even if I could do it alone. If I intend to push alone while you push, it's not joint, even if we both *need* to push to move it.
          *   *Nuance:* The student gets this **wrong**. They claim the classification *changes*. In all three accounts, the classification (Joint vs. Parallel) depends on the mental states/agreements, not the physical constraints. The prompt says "Suppose each... could have pushed the car alone." This is a specific constraint to test if students understand that jointness is psychological/normative, not physical. Changing the physical constraint shouldn't change the classification of the *type* of action (though it might explain *why* they formed the intention).
