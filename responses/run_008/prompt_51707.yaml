prompt: |-
  I'm in a philosophy of law course right now and we just finished the unit on punishment theories, and honestly I'm a bit frustrated. Every week the professor brings in a new theory (retributivism one week, deterrence the next, then some hybrid), and each one handles the textbook cases fine and then falls apart the second you push on something slightly weird. Before I go back and read more of these, I want the spec first, not another theory. So: what would an adequate theory of punishment actually have to deliver? Please write me the full list of desiderata — the cases it has to get right, the distinctions it can't collapse, the things it can't contradict — with the reasoning behind each one. And then tell me which of those requirements are genuinely non-negotiable and which are just pet commitments of one camp smuggled in as if they were obvious.

  To give you a sense of the kind of stuff I want covered, here are some cases that keep tripping up the theories in our seminar discussions. There's the classic one about the police framing a totally innocent person to stop a riot — any theory has to say why that's off the table even when it maximizes utility, and it has to say it in a way that isn't just "well we'd get caught eventually." There's the attempt/completion gap: why does the person whose gunshot misses get 8 years while the equally culpable person whose bullet hits gets 25? A theory has to either justify that with moral luck or bite some bullet. There's the "why hard treatment at all" question — the state could just send a sternly worded censure letter, so what licenses actually locking people in rooms for years? And the one I personally find hardest: what happens when a crime is decriminalized while people are still serving sentences for it — does the theory demand immediate release, keep them in, or is it just silent? My own suspicion, which I'd like you to evaluate, is that some subset of the requirements can't be jointly satisfied — like maybe consequentialism about the institution plus retributivism about individual sentences, which our professor mentioned via Hart, sounds nice but can't survive one of the cases above. If some subset really is jointly unsatisfiable, I want that stated plainly, because to me that's the most interesting result in the whole unit.

  Please take on the role of a professional philosopher who specializes in punishment theory, and before writing the final list, do a quick brainstorm of candidate desiderata and prune out the ones that don't earn their place — I want the thinking to be visible but the final product clean. Once the list is done, give a short scorecard (keep it brief, a couple lines each) for pure retributivism, pure deterrence theory, and a Hart-style hybrid, and tell me which single requirement knocks out the most contenders. That last part is what I most want to see. Also if you could flag any requirement where you think even you, as the expert, are unsure whether it's a genuine desideratum or a prejudice, that would be great — I'd rather know where the real disputes live than get a tidy list that pretends they don't exist.
