answer: |-
  ### Part 1: Brainstorming & Pruning

  Before we lock in the spec, let's cast a wide net and see what sticks. In my experience, students often conflate *goals* of punishment (like rehabilitation) with *justificatory constraints* (like "don't punish the innocent"). We need the latter.

  **Candidate Desiderata:**
  1.  **The Innocent Constraint:** Never punish the innocent. (Keep. Fundamental.)
  2.  **Proportionality:** Punishment must fit the crime. (Keep. But needs splitting into "cardinal" [absolute severity] and "ordinal" [ranking].)
  3.  **Hard Treatment:** Why pain/prison and not just fines/letters? (Keep. This is the "expressive" hurdle.)
  4.  **Moral Luck/Attempts:** Why punish failed attempts less than completed crimes? (Keep. This tests the link between blame and harm.)
  5.  **Authority/Standing:** Why can the state punish but not my neighbor? (Cut. This is often a prerequisite for *legal* punishment, but a theory of *moral justification* can assume the agent is legitimate and still fail. We'll focus on the *act* of punishing, not the *agent*.)
  6.  **Rehabilitation:** Must the theory improve the offender? (Cut. This is a potential *aim*, not a necessary condition. A theory can be adequate without making rehabilitation primary.)
  7.  **Retroactivity/Decriminalization:** What if the law changes mid-sentence? (Keep. Tests the temporal binding of the justification.)
  8.  **Mens Rea:** Must there be guilty mind? (Keep. Merges with Culpability.)
  9.  **Efficiency:** Must punishment be cost-effective? (Cut. This is a policy constraint, not a moral justification constraint. A theory can be morally right but expensive.)

  **Pruned List for the Spec:**
  1.  The Innocent Constraint (The Framing Case).
  2.  The Culpability Principle (Mens Rea).
  3.  The Proportionality Constraint (Ordinal & Cardinal).
  4.  The Moral Luck/Attempt Gap (Outcome Sensitivity).
  5.  The Hard Treatment Justification (Why Suffering?).
  6.  The Retroactivity/Decriminalization Test (Normative Shifts).

  ***

  ### Part 2: The Spec — Desiderata for an Adequate Theory

  Here is the clean list. An adequate theory of punishment must satisfy these six conditions without resorting to ad-hoc exceptions.

  **1. The Innocent Constraint (The Framing Case)**
  *   **Requirement:** The theory must categorically forbid punishing a person known to be innocent of the specific offense, even if doing so would produce net social benefits (e.g., stopping a riot, deterring others).
  *   **Reasoning:** Punishment presupposes guilt. If you can punish the innocent, you are not punishing; you are sacrificing. A theory that permits this collapses the distinction between justice and social engineering.

  **2. The Culpability Principle (Mens Rea)**
  *   **Requirement:** Punishment must track blameworthiness (intent, recklessness, negligence), not merely causal contribution or harm. Strict liability offenses are presumptively unjust on this view.
  *   **Reasoning:** We punish *agents*, not *causes*. A tree that falls and kills someone causes harm, but we don't punish the tree. Without culpability, punishment is merely quarantine or extermination.

  **3. The Proportionality Constraint (Ordinal & Cardinal)**
  *   **Requirement:**
      *   *Ordinal:* More serious crimes must receive more severe punishment than less serious ones.
      *   *Cardinal:* There must be an anchor for the absolute scale (torture cannot be the penalty for parking violations, even if it deters them perfectly).
  *   **Reasoning:** Without ordinal proportionality, the law loses its moral grading system. Without cardinal proportionality, the state treats citizens as mere means to social ends, violating human dignity.

  **4. The Moral Luck/Attempt Gap (Outcome Sensitivity)**
  *   **Requirement:** The theory must explain why attempted murder (bullet misses) is punished less severely than completed murder (bullet hits), despite identical culpability and intent.
  *   **Reasoning:** Intuitively, we punish the shooter who hits harder than the shooter who misses. But if punishment tracks *blame*, they are equally blameworthy. If it tracks *harm*, it looks like consequentialism. A theory must reconcile this tension without contradicting the Culpability Principle.

  **5. The Hard Treatment Justification (Why Suffering?)**
  *   **Requirement:** The theory must explain why the state is licensed to impose pain, deprivation of liberty, or stigma, rather than mere censure, fines, or therapy.
  *   **Reasoning:** A stern letter conveys disapproval. Prison conveys suffering. Since suffering is prima facie bad, the theory must provide a positive reason why *hard treatment* is necessary, not just incidental.

  **6. The Retroactivity/Decriminalization Test (Normative Shifts)**
  *   **Requirement:** The theory must specify what happens when an act is decriminalized while offenders are incarcerated. Does justice demand immediate release, or does the "debt" remain?
  *   **Reasoning:** This tests whether the justification is backward-looking (you broke the rule *then*) or forward-looking (you are dangerous *now*) or normative (the act is wrong *simpliciter*).

  ***

  ### Part 3: Non-Negotiable vs. Pet Commitments

  You asked to separate the steel from the straw. Here is where the line is drawn.

  **Non-Negotiable (The "Dealbreakers"):**
  *   **The Innocent Constraint:** If a theory allows framing the innocent, it is not a theory of *punishment*; it is a theory of *terror*. This is the bedrock.
  *   **The Culpability Principle:** If a theory punishes purely on outcome without regard to mind, it treats humans like objects. This is widely accepted as a minimum condition for moral agency.

  **Pet Commitments (The "Contestable"):**
  *   **Strict Proportionality (Cardinal):** Some argue we only need *limits* (no torture), not exact fit. Insisting on exact "eye for an eye" proportionality is a retributivist pet commitment, not a logical necessity for all theories.
  *   **The Attempt Gap:** Some philosophers (like "luck skeptics") argue the Attempt Gap is actually a *mistake* in our legal practice and that attempts *should* be punished the same as completions. A theory that punishes them equally isn't necessarily wrong; it might be correcting our intuition.
  *   **Decriminalization Release:** A contractarian might argue you broke the social contract *at the time*, so the law changing doesn't void the debt. Insisting on immediate release is a liberal commitment, not a logical one.

  ***

  ### Part 4: Scorecard

  Here is how the major contenders fare against the Spec.

  **Pure Retributivism**
  *   **Score:** High on Innocent/Culpability/Proportionality. Fails on Hard Treatment & Decriminalization.
  *   **Verdict:** It easily forbids punishing the innocent (they don't deserve it) and explains proportionality (desert matches harm). However, it struggles to explain *why* suffering is the currency of desert (Hard Treatment) and often cannot justify releasing someone when laws change (if the moral wrong remains, why release?).

  **Pure Deterrence (Utilitarianism)**
  *   **Score:** High on Hard Treatment (useful tool). Fails catastrophically on Innocent Constraint & Proportionality.
  *   **Verdict:** It explains suffering well (it disincentivizes). But it fails the Innocent Constraint (framing is permissible if it stops the riot) and Proportionality (if a minor crime is rampant, you should punish it severely to deter). It usually dies on Requirement #1.

  **Hart-Style Hybrid (General Aim = Utilitarian, Distribution = Retributive)**
  *   **Score:** High on Innocent/Proportionality. Fails on the "Seam" (Preventive Detention).
  *   **Verdict:** This is the sophisticated contender. It uses Utilitarianism to justify the *institution* (why we have prisons) and Retributivism to justify *who* goes in (only the guilty).
  *   **The Crack:** It collapses when the General Aim pressures the Distribution. If a prisoner has "paid their debt" (Retributive limit) but is still highly dangerous (Utilitarian aim), the Hybrid has no answer. It either releases a danger or detains without desert. Your suspicion is correct: the seams burst under pressure.

  ***

  ### Part 5: The Killer Constraint

  **Which single requirement knocks out the most contenders?**

  **The Innocent Constraint (Requirement #1).**

  This is the graveyard of consequentialist theories. Pure deterrence theory cannot satisfy this without lying about its own premises. To satisfy it, a utilitarian must smuggle in a deontological side-constraint ("never punish the innocent"), which effectively admits that utility is not the *sole* justification.

  Retributivism passes this easily. The Hybrid passes this by stipulation. But any theory that attempts to ground punishment *solely* in future good consequences (deterrence, rehabilitation, incapacitation) is logically compelled to allow the punishment of the innocent if the calculus demands it. Therefore, Requirement #1 is the single most effective filter in the philosophy of punishment.

  ***

  ### Part 6: Uncertainty Flag (Where the Expert is Unsure)

  You asked for honesty about where the disputes live. Here is the one I flag as genuinely unresolved, even for me:

  **The Moral Luck/Attempt Gap (Requirement #4).**

  I am unsure if this is a genuine desideratum or a prejudice of our current legal culture.
  *   **The Case for Prejudice:** From a moral agency perspective, the shooter who misses and the shooter who hits are *identical* in will and choice. The difference is wind, reflex, or luck. Why should luck dictate years of liberty? A truly consistent retributive theory *should* punish them equally.
  *   **The Case for Desideratum:** Our reactive attitudes (resentment, grief) are genuinely stronger when harm occurs. The victim's family suffers more. The social rupture is greater. Perhaps punishment tracks the *restoration of the normative order*, which is more damaged by a death than a near-miss.

  **Why this matters:** If you think the Attempt Gap is a bug in the system, Retributivism looks weak (it demands equal punishment). If you think it's a feature, Retributivism struggles to explain it without borrowing from consequentialism (harm matters). This is the deepest theoretical wound in the unit, and no theory has fully cauterized it.
