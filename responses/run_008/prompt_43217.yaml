  The Nash solution maximizes the product of the gains $(Your Gain) \times (Sister's Gain)$. On a straight line where the sum of gains is fixed ($170k), the product is maximized when the gains are equal.
  *   Target Gain for Each: $170k / 2 = 85k$.
  *   Your Price: $180k (fallback) + 85k (gain) = \mathbf{265k}$.
  *   *Where Dan went wrong:* He ignored your sister's $150k fallback value. He calculated the surplus as $500k - 180k = 320k$. He split that 50/50 ($160k each) and added it to your fallback ($180k + 160k = 340k$). That gives your sister a raw gain of $160k, but since her fallback was $150k, she's actually only $10k ahead of where she started. That is not a Nash equilibrium.

  **Priya's Kalai–Smorodinsky Calculation (Corrected)**
  This solution splits the surplus so both parties achieve the same *percentage* of their maximum possible gain.
  *   **Your Max Gain:** If Price is $350k (Sister's max), you gain $350 - 180 = 170k$.
  *   **Sister's Max Gain:** If Price is $180k (Your min), she gains $(500 - 180) - 150 = 170k$.
  *   **The Ratio:** Since your maximum possible gains are identical ($170k each), the "equal percentage" solution is exactly the same as the "equal absolute gain" solution.
  *   **Result:** $\mathbf{265k}$.
  *   *Where Priya went wrong:* She mixed units. She calculated your ideal gain correctly ($170k over fallback) but calculated your sister's ideal as her total net wealth ($320k) rather than her gain over fallback. She then applied that ratio to Dan's inflated surplus number. That is how she landed on $291k.

  ### 2. Refereeing the Axiom Fight
  Since the math converges at $265k, their fight over axioms is theoretically interesting but practically irrelevant for *this* deal. However, since you asked:

  **Independence of Irrelevant Alternatives (IIA) vs. Monotonicity**
  *   **Dan (IIA):** IIA says if you remove an option nobody was going to pick anyway, the deal shouldn't change. This provides stability.
  *   **Priya (Monotonicity):** Monotonicity says if your bargaining position gets stronger (the pie gets bigger in your favor), you shouldn't end up with less than before.
  *   **The Winner:** **Monotonicity.** In a real-world negotiation, especially between siblings, IIA is too rigid. It allows for counter-intuitive outcomes where expanding the pie hurts one person. Priya is right that a fairness rule punishing you for your situation improving is hard to defend socially. However, Dan is right that the "Ideal Point" is counterfactual. It measures fairness based on a fantasy scenario where the other person capitulates completely. It's not a "cheap shot," but it is a philosophical weakness of the Kalai–Smorodinsky solution.

  ### 3. The Sibling Factor (What They Missed)
  Both friends treated this as a one-off transaction between strangers. They missed the **Repeated Game** nature of sibling relationships.

  1.  **Relationship Equity:** If you squeeze your sister using a complex formula that she doesn't understand (like Dan's $340k), you might win $75k now but lose trust forever. If the cottage is a family hub, that friction has a cost.
  2.  **Focal Points:** In family disputes, "Split the Difference" is a powerful social norm. It's not just a math trick; it's a signal of goodwill.
  3.  **The $315k Proposal:** You mentioned you can't just propose splitting the difference at $315k. You are right to avoid that, but not because it's "splitting the difference."
      *   The bargaining range is $180k to $350k.
      *   The true midpoint is **$265k**.
      *   $315k is 76% of the way to the sister's maximum. That isn't a compromise; that's you capturing 76% of the surplus and leaving her 24%. Given that you are the one *selling* and she is the one *buying* to solve her problem (she hates co-ownership more than you do), asking for $315k risks her walking away or resenting you.

  ### 4. Recommendation
  **Take $265,000 to your sister.**

  Here is why:
  1.  **It is Mathematically Robust:** It is the unique solution supported by *both* Nash and Kalai–Smorodinsky when calculated correctly. You can tell your friends to check their work; the theories agree.
  2.  **It is Fair:** It splits the *created value* ($170k surplus) exactly down the middle. You both walk away $85k better off than if you stayed co-owners.
  3.  **It Preserves the Relationship:** It avoids the appearance of you exploiting her higher willingness to pay ($500k). She wants the house for $500k value, but she only *needs* to pay $350k to break even. Asking for $340k (Dan's number) leaves her only $10k better off than the status quo she hates. That feels predatory.
  4.  **It Kills the Argument:** Since both game theory solutions point here, you can frame it as "I had experts run the numbers, and despite their arguments, the math converges here."

  **Script for your sister:**
  *"I had some friends run the numbers on a fair buyout. The value we create by making this yours is $170k more than us staying co-owners. The fairest way to handle that is to split that new value 50/50. That puts the price at $265k. We're both $85k better off than the status quo, and you get the cottage."*

  If she pushes back, do not go to $315k. That gives you $135k of the surplus and her $35k. A reasonable counter-offer, if needed, is **$290k** (splitting the surplus 60/40 in your favor), but start at $265k. It's the strongest position you have because it is objectively defensible.
