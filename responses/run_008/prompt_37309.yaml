      *   **Equilibrium Selection:** The disaster is often an equilibrium (e.g., War in Chicken). Rational players *do* end up there sometimes.
      *   **The "Safety" Condition:** It requires that the modification be *incentive compatible* without changing the relative ordering of non-disaster outcomes.
      *   **Common Knowledge:** SPIs often rely on common knowledge of the modification.

  7.  **Drafting the Response:**
