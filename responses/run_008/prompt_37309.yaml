      *   *Implicit Assumptions:* Contrast Marcus's (Incentive/Enforcement) vs. Dana's (Ex-ante/Robustness).
      *   *Move-by-Move Analysis:* Rate and justify each.
      *   *Verbal Dispute Analysis:* Clarify definitions.
