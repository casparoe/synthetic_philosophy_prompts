  After three years of debate, we have concluded this adversarial collaboration with a document that clarifies where our interpretations converge and where they fundamentally diverge. We began this process assuming that our disagreement was merely a matter of emphasis, but we now recognize that while we share a commitment to empirical rigor, we are operating with different causal models regarding the origins of national identity. We intend this statement to serve not as a synthesis that blunts our respective edges, but as a precise map of the intellectual terrain we still occupy separately. There are specific historical claims we both endorse without reservation. First, we agree that many specific symbols widely recognized as ancient national traditions are demonstrably modern inventions, such as the systematization of Scottish clan tartans in the nineteenth century, and that signing this agreement does not require either of us to pretend otherwise. Second, we agree that modern states have actively manipulated historical narratives to legitimize borders and bureaucracies, often suppressing regional differences to create administrative uniformity. Third, we agree that pre-modern populations possessed collective identities based on religion, dynasty, or locality, and that denying the existence of these earlier forms of belonging would be historically illiterate. The dispute lies not in the existence of these facts, but in their theoretical weight and whether they constitute the genesis of the nation or merely the raw material upon which the nation was built.

  Our primary disagreement concerns the threshold at which a population becomes a nation. The modernist position maintains that national consciousness requires the structural conditions of mass communication and industrial society, specifically that without print capitalism and standardized mass education, a political community cannot imagine itself as a horizontal solidarity of equals. The ethnosymbolist position maintains that nations rest on pre-modern ethnic cores, specifically that a continuous community of memory and myth provides the necessary substrate without which modern propaganda would find no purchase. We have identified that part of this conflict is definitional, and we wish to state explicitly that if the argument were solely about whether to apply the word nation to pre-modern ethnies, we would concede the terminology to avoid confusion. However, the disagreement is substantive because it concerns causality. The modernist argues that mass literacy and print were strictly necessary conditions for national consciousness, whereas the ethnosymbolist argues they were accelerants that transformed a latent ethnic consciousness into a political program. To test this, we have constructed a hypothetical case study of a territory we call Ruritania, which possesses a medieval chronicle full of origin myths from the fourteenth century, a vernacular bible circulated in the 1750s, railways and cheap newspapers introduced in the 1830s, compulsory schooling implemented in the 1860s, and a national anthem written in 1902 by a government committee.

  Regarding Ruritania, the modernist predicts that the inhabitants did not become a nation until the introduction of railways and cheap newspapers in the 1830s, arguing that prior to this moment there was no mechanism for the simultaneous consumption of information required to sustain a national imagination. The modernist counts as evidence for this view any data showing that before the 1830s, the vernacular bible was read only by clergy or elites without generating a broad political movement, and that the medieval chronicles were treated as dynastic history rather than national property. The ethnosymbolist predicts that the inhabitants possessed a national consciousness upon the circulation of the vernacular bible in the 1750s, arguing that this allowed the pre-existing myth of descent from the medieval chronicles to become accessible to a broader lay public, creating a cultural nation before the political infrastructure was complete. The ethnosymbolist counts as evidence for this view any data showing that the newspapers of the 1830s relied on symbols and references that were already understood by the populace due to the earlier religious and textual diffusion, rather than having to teach those symbols from scratch. We agree that if archival research were to show that the 1830s newspapers failed to resonate until they adopted imagery found in the 1750s bible, this would support the ethnosymbolist claim of continuity, whereas if research showed the 1750s bible had no political impact until the 1830s infrastructure repurposed it, this would support the modernist claim of structural necessity.

  We also addressed the problem of stickiness, specifically regarding cases where the inventors of a tradition sincerely believed in its antiquity and cases where an invented tradition fails to take root and gets dropped after a generation. The modernist contends that stickiness shows only the effectiveness of state power and institutional reinforcement, meaning a tradition fails when the state stops enforcing it or when it becomes economically inefficient, regardless of its content. The ethnosymbolist contends that stickiness shows resonance with a deep ethnic core, meaning a tradition fails when it contradicts the underlying myths of descent or memory that the population already holds, regardless of state enforcement. We agree that this is a substantive disagreement about the limits of social engineering. If a government committee creates a national anthem in 1902 that is universally adopted, the modernist sees this as proof that state will can conjure solidarity, while the ethnosymbolist sees this as proof that the committee successfully tapped into existing melodic or lyrical conventions that felt familiar to the people. Conversely, if a government committee creates an anthem that is rejected, the modernist attributes this to poor distribution or competing modern interests, while the ethnosymbolist attributes this to a lack of connection with the pre-modern ethnic core.

  We conclude this statement by noting that our collaboration has not resolved which of us is correct, but it has successfully isolated the specific empirical claims that would falsify our respective positions. We are not agreeing to disagree on the importance of the question, but rather acknowledging that we are looking for different kinds of evidence in the same archives. The modernist will continue to search for the break point where administrative capacity creates identity, and the ethnosymbolist will continue to search for the thread of continuity that survives administrative collapse. We sign this not as a testament to consensus, but as a record of a cleared battlefield where the lines of engagement are now visible enough that future evidence might actually decide the matter.
