      *   **Conventionality:** Knights move in L-shapes because we agreed they do, not because it's morally superior. Similarly, driving on the right vs. left is arbitrary but binding.
      *   **Validity vs. Merit:** A move can be legal but stupid. A law can be valid but unjust.
