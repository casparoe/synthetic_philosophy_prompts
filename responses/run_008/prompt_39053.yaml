answer: |-
  **JOINT STATEMENT ON THE ONTOLOGY AND OPERATIONALIZATION OF UTILITY**

  **Parties:**
  *   **The Behaviorist:** Representing the revealed preference tradition (Samuelson, Houthakker, Varian).
  *   **The Mentalist:** Representing the psychological welfare tradition (Edgeworth, Pigou, Kahneman, Sugden).

  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration, Department of Economics

  ***

  ### 1. Agreed Claims Regarding Formal Theory and Empirical Regularities

  We, the undersigned, agree to the following technical and empirical propositions. We acknowledge that while we agree on these statements, we derive different philosophical implications from them.

  1.  **Revealed Preference Axioms:** We agree that the Weak, Strong, and Generalized Axioms of Revealed Preference (WARP, SARP, GARP) are conditions on observed choice data alone. They assume neither the existence of an internal mental state nor the maximization of a subjective experience. They establish consistency conditions: if bundle $A$ is chosen over $B$ when both are available, $B$ cannot be chosen over $A$ in any other budget set containing both (subject to income effects in GARP).
  2.  **Ordinal Representation:** We agree that if a choice function satisfies completeness and transitivity, there exists an ordinal utility function $u(x)$ that represents those choices. We agree this theorem establishes existence, not uniqueness. Any monotonic transformation of $u(x)$ represents the same preferences. We agree this framework presupposes that the agent's ordering is stable across the time frame of observation.
  3.  **Von Neumann–Morgenstern (vNM) Cardinality:** We agree that adding the independence and continuity axioms to choices over lotteries yields a utility function unique up to positive affine transformation ($v(x) = a \cdot u(x) + b$, where $a > 0$). We agree this allows for comparisons of *utility differences* for a single individual under risk, but does not establish a zero point or a natural unit of measurement comparable across individuals.
  4.  **Empirical Anomalies:** We agree that the empirical literature robustly documents systematic violations of the axioms listed above. Specifically, we concede that framing effects, preference reversals, endowment effects, and intransitive choices occur in controlled settings.
  5.  **Predictive Power:** We agree that despite these anomalies, the standard model of rational choice remains the dominant predictive tool for aggregate market behavior in many contexts. We also agree that self-reported well-being data (happiness research) correlates with income, health, and social connection, though the magnitude and interpretation of these correlations are contested.
  6.  **Operational Constraints:** We agree that choice data is currently the only universally observable metric available for policy implementation in market design. We agree that psychological measures (fMRI, experience sampling) are costly, noisy, and currently impractical for large-scale welfare analysis.

  ***

  ### 2. Table of Residual Disagreements

  We disagree on the interpretation of the claims above. The following table articulates our divergences. Each row describes the same underlying dispute, phrased in terminology each party finds acceptable.

  | Topic | Formulation Acceptable to the Behaviorist | Formulation Acceptable to the Mentalist |
  | :--- | :--- | :--- |
  | **The Ontology of Preference** | Preference is defined *as* the disposition to choose. To say an agent "prefers A to B" is shorthand for "the agent chooses A over B when both are available." There is no hidden variable behind the choice. | Preference is a psychological attitude *evidenced by* choice. Choice is a noisy signal of an underlying valuation. An agent can prefer A to B (in experience) but choose B due to error, framing, or lack of self-control. |
  | **Cardinal Utility** | Cardinal utility is meaningful only within the vNM framework (choices under risk). Outside of risk, "intensity" is undefined because there is no operational procedure to measure it without circularity. | Cardinal utility is a real psychological quantity (intensity of desire or hedonic tone). The lack of a current measuring device does not negate the existence of the quantity, analogous to temperature before the thermometer. |
  | **Interpersonal Comparisons** | Interpersonal utility comparisons are scientifically meaningless. There is no common unit of account between agents. Statements like "Policy X helps Alice more than it hurts Bob" are ethical judgments, not economic facts. | Interpersonal utility comparisons are difficult but meaningful. Shared biology and neural architecture allow for calibrated comparisons of suffering and satisfaction. Treating them as meaningless blocks necessary welfare judgments. |
  | **Welfare Grounding** | Welfare economics should be grounded in **Sovereignty of Choice**. The agent is the best judge of their own interest, revealed by what they actually select. Paternalism based on "true" utility is unjustified. | Welfare economics should be grounded in **Experienced Well-being**. Choice is a means to an end (satisfaction). When choice diverges from experienced satisfaction (e.g., addiction, adaptation), policy should target the end, not the means. |
  | **Happiness Research** | Self-reports measure "opinions about life," not utility. They are subject to scale-use bias and context effects. They belong to sociology or psychology, not the theory of economic choice. | Self-reports measure "experienced utility." While noisy, they provide direct access to the variable welfare economics seeks to maximize. Ignoring them because they are imperfect is throwing away the signal. |

  ***

  ### 3. Cruxes and Advance Predictions

  We identify three specific areas where future research could adjudicate our disagreement. We record our advance predictions to hold ourselves accountable.

  **Crux 1: The Prediction of Future Choice**
  *   **The Test:** In a domain where past choice and real-time affect diverge (e.g., addictive goods or high-stress labor markets), which variable better predicts *future* choice over a 12-month horizon?
  *   **Behaviorist Prediction:** Past choice history will predict future choice with significantly higher accuracy ($R^2$) than self-reported affect. If affect diverges from choice, the agent will act to align future choice with past behavior (habit formation), not with reported satisfaction.
      *   *Condition for Update:* If reported affect predicts future choice better than past choice in >60% of tested domains, I will concede that choice is not the sole definition of preference.
  *   **Mentalist Prediction:** Real-time affect (or physiological proxies) will predict future choice better than past choice once "noise" (framing, transient states) is controlled. Agents will eventually act to maximize experienced utility if given reflection time.
      *   *Condition for Update:* If past choice remains the superior predictor of future choice even when agents are explicitly warned about framing and given cooling-off periods, I will concede that "preference" is operationally indistinguishable from "disposition to choose."

  **Crux 2: Stability Under Reflection**
  *   **The Test:** Subjects exhibit a preference reversal (e.g., choosing $A$ over $B$ in direct choice, but pricing $B$ higher than $A$). They are then shown their inconsistency and asked to reconsider.
  *   **Behaviorist Prediction:** "Reflection" merely introduces a new choice context (a meta-choice). There is no "true" preference revealed here, only a new constraint. The agent may stabilize on either $A$ or $B$ arbitrarily.
      *   *Condition for Update:* If >80% of subjects converge on a single option after reflection *and* stick to it in subsequent unincentivized trials, I will accept that a latent ordering exists prior to the choice.
  *   **Mentalist Prediction:** Reflection reduces cognitive noise. A significant majority will converge on the option that aligns with their experienced satisfaction (measured via experience sampling during consumption), not necessarily their initial choice.
      *   *Condition for Update:* If subjects stabilize on an option that correlates *lower* with their subsequent experienced satisfaction than their initial impulse, I will concede that "reflection" does not necessarily reveal truer welfare.

  **Crux 3: The Redescription Problem**
  *   **The Test:** Loss aversion is observed (agents value a good more once they own it). The Behaviorist redescribes the good as "good + endowment status."
  *   **Behaviorist Prediction:** Any anomaly can be absorbed by enriching the description of the commodity space. This is not ad hoc; it is model refinement. There is no fact of the matter about the "right" description other than predictive success.
      *   *Condition for Update:* If the complexity of the required redescription grows exponentially with each new anomaly while predictive power plateaus, I will acknowledge the model is being immunized against falsification.
  *   **Mentalist Prediction:** Redescription becomes unfalsifiable tautology. There is a fact of the matter: the physical good is the same, but the psychological reaction differs. A model that requires redefining the good to fit the theory explains nothing.
      *   *Condition for Update:* If a neural or physiological marker can be identified that tracks the "endowment effect" independently of choice, and the Behaviorist still refuses to treat it as a distinct variable, I will conclude the behaviorist stance is ideological, not scientific.

  ***

  ### 4. Closing Statement: Substantive vs. Verbal Disputes

  We conclude by categorizing the nature of our disagreement and specifying the conditions under which we would revise our positions.

  **On Verbal Disagreement:**
  We acknowledge that a portion of our conflict is terminological.
  *   **The Behaviorist** admits that if the Mentalist wishes to use the word "utility" to mean "hedonic experience," this is permissible in psychology, provided it is not conflated with the "utility" of revealed preference theory in formal modeling.
  *   **The Mentalist** admits that if the Behaviorist wishes to use the word "preference" to mean "choice disposition," this is permissible for positive economics, provided it is not conflated with "welfare" in normative analysis.
  *   **Joint Admission:** If our dispute were *only* verbal, we could resolve it by using distinct terms (e.g., *utility-choice* vs. *utility-experience*). However, we believe the dispute is not merely verbal.

  **On Substantive Disagreement:**
  We disagree on the **facts of the matter regarding human welfare.**
  *   The **Behaviorist** holds that there is no accessible fact of the matter regarding welfare other than choice. To posit one is to engage in metaphysics.
  *   The **Mentalist** holds that there is a fact of the matter regarding welfare (suffering/flourishing) independent of choice. To deny one is to engage in obscurantism.

  **Conditions for Movement:**
  *   **The Behaviorist will move** if: A non-choice-based metric of well-being is demonstrated to predict long-term life outcomes (health, stability, longevity) significantly better than choice consistency, *and* a formal theory is constructed that incorporates this metric without sacrificing the mathematical tractability required for general equilibrium analysis.
  *   **The Mentalist will move** if: It is demonstrated that attempts to maximize self-reported well-being via policy lead to systematic reductions in individual freedom and long-term stability (the "tyranny of the happiness metric"), *and* it is shown that respecting choice sovereignty yields better aggregate outcomes even when agents report lower satisfaction.

  We sign this document to record that while we share a language, we do not yet share a world. We commit to testing the cruxes above within the next academic year.

  **Signed:**

  _________________________
  (The Behaviorist)

  _________________________
  (The Mentalist)
