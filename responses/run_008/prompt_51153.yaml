      *   *Key Distinction:* Subjective Credence vs. Objective Frequency. The practice merges them via the "Principal Principle" (align credence with known chance). But since we don't know "chance," we use frequency as a proxy.
      *   *Refinement:* The practice presupposes **Stability of Reference Class**. If the world changes laws tomorrow, calibration fails. So it presupposes uniformitarianism.

