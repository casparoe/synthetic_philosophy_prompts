answer: |-
  This is an exceptionally sharp dissection of the pragmatics of future contingents. You have correctly identified that the institutional practice of forecasting sits in a tension between *semantic openness* (issuing probabilities) and *ontological closure* (grading against binary outcomes).

  Here is a reconstruction of the implicit theory governing these institutions, an analysis of its metaphysical commitments, and a test of whether the practice forces a specific solution to the Sea Battle problem.

  ### 1. The Implicit Theory: "Operational Branching"

  Forecasting institutions do not operate on a single, unified metaphysical theory. Instead, they operate on a functional ontology I will call **Operational Branching**. This view is distinct from Aristotelian open-future theories or Lewisian modal realism, though it borrows mechanics from both.

  **The Core Tenets:**
  1.  **The Collapse Principle:** The future is treated as a distribution of possibilities at $t_0$ (time of forecast) but is treated as a singular, determinate fact at $t_1$ (time of evaluation). The transition from probability to fact is treated as a real, non-semantic event.
  2.  **Epistemic Access Limit:** No agent has access to the $t_1$ truth value at $t_0$. This is treated as a hard constraint, regardless of whether the limitation is due to chaos (weather), ignorance (elections), or indeterminism (quantum decay).
  3.  **Reference Class Stability:** The world possesses stable statistical regularities. If we group all $t_0$ states identical to this one, the frequency of $t_1$ outcomes converges to a limit. This allows the number "0.7" to be meaningful rather than arbitrary.

  **How it handles your tension:**
  *   **Issuing (70%):** Relying on Tenet 2. Since we cannot know the truth value, we map the *space* of possible truth values weighted by model likelihood.
  *   **Grading (Calibration):** Relying on Tenet 1 and 3. We wait for the "collapse" to truth, then check if our mapping of the space matched the frequency of collapses.

  ### 2. Strict Needs vs. Good Fits

  Does this practice *require* the future to be metaphysically open (failure of bivalence)? **No.**

  **What is Strictly Required:**
  1.  **Eventual Bivalence:** The practice *requires* that at the time of evaluation, the proposition "It rained" is either True or False. If the future remained genuinely indeterminate forever (no collapse), calibration would be impossible. The practice presupposes that the "Sea Battle" is eventually resolved.
  2.  **Ignorance:** The practice requires that the forecaster does not know the outcome. If a forecaster knew the determined future, issuing a 70% forecast would be a lie (or at least a communicative failure).
  3.  **Uniformitarianism:** The practice requires that the laws of nature (or social dynamics) do not change capriciously between forecast and evaluation. If the laws change, calibration data from the past is useless for the future.

  **What Merely Fits Well (but is not required):**
  1.  **Metaphysical Indeterminism:** The practice fits perfectly with an "Open Future" ontology, but it does not need it.
  2.  **Objective Single-Case Chances:** Weather forecasting often treats "70% chance" as a property of the atmosphere (propensity). However, this is not strictly necessary. A deterministic chaotic system (Laplacean world) produces the exact same operational need for probabilities due to sensitivity to initial conditions.
  3.  **Truth-Value Gaps:** The practice does not require that the statement "It will rain" lacks a truth value *now*. It only requires that the truth value is *inaccessible*.

  ### 3. The Fatalist/Bivalent Counterfactual

  You asked what would happen if we replaced the implicit view with a straightforwardly bivalent or fatalist one. This is the crucial test.

  **Scenario:** A strict causal determinist (Fatalist) runs the National Weather Service. They believe that given the state of the universe at $t_0$, the rain at $t_1$ is already necessitated. The statement "It will rain" is already True or False now (Ockhamist view).

  **Would the practice change?**
  *   **Forecasting:** No. The Fatalist forecaster still issues "70%." Why? Because they admit they are not God. They acknowledge that while the fact is fixed, their *access* to the fact is partial. The "70%" shifts from representing an *ontological propensity* to representing an *epistemic credence* based on incomplete data.
  *   **Decision Making:** No. The city still salts the roads. Why? Because Decision Theory works with expected utility. Even if the outcome is fixed, the *payoff matrix* is evaluated against the agent's credence.
  *   **Calibration:** This is where it gets interesting. Calibration would still mean something, but its interpretation shifts.
      *   *Indeterminist view:* "You correctly identified the objective chance."
      *   *Fatalist view:* "You correctly identified the frequency of outcomes in situations where your information looked like this."
      *   **Result:** The math of the Brier Score or Calibration Curve is identical. The metaphysical justification changes, but the institutional practice remains invariant.

  **The Only Breakdown:**
  The practice would only collapse if the Fatalist claimed **Omniscience**. If the Fatalist says, "The future is determined, therefore I know it," they stop issuing probabilities and start issuing flat predictions. When they inevitably fail (due to chaos/complexity), the institution loses credibility. Thus, the practice presupposes **Fallibilism**, not **Indeterminism**.

  ### 4. Consistency: Acting "As If" vs. Probabilistic Commitment

  You asked: *Can the same institution sensibly issue a 70 percent forecast while acting as though it will either rain or not?*

  Yes, and this is handled by **Expected Utility Theory**, which acts as the bridge between the probabilistic forecast and the binary decision.

  *   **The Forecast:** $P(Rain) = 0.7$.
  *   **The Decision:** To salt or not to salt.
  *   **The Logic:** The institution does not act "as though it will rain." It acts "as though the *cost of being wrong about no rain* outweighs the *cost of being wrong about rain*."
  *   **Example:** If salting costs \$10k and a lawsuit from an icy accident costs \$1M, you salt even if $P(Rain) = 0.1$.
  *   **Resolution:** There is no contradiction here. The institution treats the *world* as binary (rain/no rain) for the sake of consequences, and the *knowledge* as probabilistic for the sake of calculation. This is consistent with bivalence, non-bivalence, or fatalism.

  ### 5. Critique of Your Framing

  You asked me to be plain if you've misdescribed the practice. There is one significant philosophical over-interpretation in your prompt:

  **The Claim:** *"The grading half of the practice seems to presuppose... the number '70' is treated as trackable fact."*

  **The Correction:** The number "70" is **not** treated as a trackable fact in the singular case. It is treated as a **property of the forecaster**, not the world.
  *   When a 70% forecast fails, the institution does not say, "The fact was 100%, you said 70%, you were wrong about the fact."
  *   They say, "Your *process* for generating 70% is miscalibrated."
  *   Calibration is a measure of the **reliability of the source**, not the **truth value of the proposition**.

  This is why a single failure doesn't count as an error. If "70%" were a claim about the specific event's truth-value (e.g., "This event is 70% true"), then a failure would be a logical contradiction. But since "70%" is a claim about the *reference class* (events like this one), a single failure is statistically expected.

  **The Claim:** *"It looks as though issuing a 70 percent forecast rather than a prediction only makes sense if the future is somehow open."*

  **The Correction:** As noted with the Fatalist counterfactual, this is false. It only makes sense if the future is **unknown**. A deterministic lottery is still a lottery to the buyer. The practice is compatible with the proposition "It will rain" being True right now, provided the forecaster cannot access that Truth.

  ### 6. Conclusion: Philosophical Underdetermination

  To answer your final question directly: **The practice is philosophically underdetermined.**

  Forecasting institutions do not solve the Sea Battle problem; they **bracket** it.
  *   They are compatible with **Aristotle** (future contingents lack truth value): The forecast fills the gap until nature decides.
  *   They are compatible with **Ockham** (future contingents have truth values, but we don't know them): The forecast is a measure of our ignorance.
  *   They are compatible with **Lewis** (all futures are real): The forecast weights the branches.

  **What the practice *does* force:**
  It forces a rejection of **Dogmatic Fatalism** (the idea that because the future is fixed, planning is useless). The institution is built on the axiom that *information about probabilities changes outcomes* (e.g., warning people saves lives).

  **If you must reconstruct a theory:**
  The most accurate reconstruction of the institution's implicit philosophy is **Pragmatic Instrumentalism**.
  They treat "probability" not as a metaphysical claim about the fabric of time, but as a tool for managing risk under conditions of **effective indeterminacy**. Whether that indeterminacy is caused by quantum randomness, chaotic sensitivity, or simple ignorance is irrelevant to the ledger.

  **Recommendation for your work:**
  If you are using this to argue against bivalence, this practice will not support you. The practice is fully compatible with bivalence + ignorance. However, if you are arguing that *semantic bivalence is practically irrelevant* to how we navigate the future, this practice is your strongest evidence. The institutions function by treating the future as *open for calculation* and *closed for accounting*, regardless of the underlying metaphysics.
