      *   *Relationship to Conditionalization:* Conditionalization $\rightarrow$ Reflection (usually). Reflection $\nrightarrow$ Conditionalization. Reflection is a necessary condition for conditionalization (if you know you will conditionalize), but not sufficient.
      *   *Deference Framing:* The "deference" label is common (Elga, Christensen), but it must be qualified. It's deference to your future self *qua* your future self, *provided* you don't expect degradation.

