answer: |-
  **Prediction: Acquitted.**

  ### The Rules of Your Jurisprudence

  Based on your six prior rulings, two competing principles have emerged. Each fits the prior data, but they collide in this new case.

  **1. The Principle of Fundamental Wrong (*Mala In Se*)**
  *   **Formulation:** An individual may be convicted if the conduct violates fundamental human decency, regardless of whether positive law existed at the time, whether domestic law permitted it, or whether the defendant acted under superior orders.
  *   **Fit:** This rule explains the convictions of the **Interior Official** (retroactive charge, domestic law allowed it), the **Foreign Minister** (no positive law against aggressive war), the **Camp Guard** (standard war crime), the **Broadcaster** (incitement), and the **General** (superior orders). In all five, the group prioritized the moral gravity of the act over technical legal defenses.
  *   **Prediction for New Case:** **Convicted.** Torture of captives is the paradigm of *mala in se*; it is gravely wrong by any decent standard, violating the laws of war as they then stood.

  **2. The Principle of Clean Hands (*Tu Quoque* / Victors' Justice)**
  *   **Formulation:** The Tribunal lacks the moral jurisdiction to convict a defendant if the prosecuting powers engaged in substantially similar conduct with official sanction. Comparative guilt operates as a bar to liability.
  *   **Fit:** This rule explains the acquittal of the **Submarine Commander**. Crucially, it also explains the meta-pattern you noted: *"In none of the cases we convicted was there evidence that the victorious powers had engaged in anything comparable."* This implies that in the five convicted cases, the absence of Allied guilt was a necessary condition for the verdict, even if not explicitly stated in the reasoning. The group implicitly treats Allied culpability as a veto.
  *   **Prediction for New Case:** **Acquitted.** The archives show the victorious powers used substantially the same methods with official sanction. The veto applies.

  ### The Closest Analog

  The **Submarine Commander** is the closest analog, though not factually, then jurisprudentially.

  Factually, the **Camp Guard** is closer: both involve the abuse of helpless persons in custody (POWs vs. resistance suspects). Under the *Principle of Fundamental Wrong*, the Security Officer should share the Camp Guard's fate.

  However, the *dispositive issue* in the new case is not the nature of the victim, but the conduct of the victors. The Submarine Commander is the only precedent where the group allowed the behavior of the prosecuting powers to dictate the outcome. In that case, the violation of the laws of war (unrestricted submarine warfare) was outweighed by the hypocrisy of the prosecution. In the new case, the violation of the laws of war (torture) is similarly outweighed by the hypocrisy of the prosecution. To convict the Security Officer while having acquitted the Submarine Commander would render your jurisprudence incoherent, unless you can distinguish the *type* of violation.

  ### The Point at Which the Rules Part Ways

  The rules genuinely part ways at the **rationale for the Submarine Commander's acquittal**. You identified this suspicion yourself: Did you acquit him because the victors did the same (*Clean Hands*), or because unrestricted submarine warfare was a contested method of combat between belligerents rather than a wrong against the helpless (*Contested Combat*)?

  *   **If *Contested Combat*:** The Submarine Commander was acquitted because sinking merchant ships was a "grey area" of naval warfare. Torture of prisoners is not a grey area; it is a black-letter crime against the helpless. Therefore, the *Clean Hands* principle does not apply to crimes against humanity or clear war crimes, only to disputed tactics. **Result: Convicted.**
  *   **If *Clean Hands*:** The Submarine Commander was acquitted because the Tribunal cannot sit in judgment on conduct the judges themselves condoned. This is a procedural bar based on legitimacy, not a substantive judgment on the act. **Result: Acquitted.**

  **My Defense of the Best Guess:**
  I commit to **Acquitted**. The *Clean Hands* principle controls.

  The decisive evidence is your own observation: *"In none of the cases we convicted was there evidence that the victorious powers had engaged in anything comparable."* If your group operated on the *Contested Combat* rule, you would not have needed to check the records of the victorious powers for the Camp Guard or the Interior Official. The fact that you checked—and found nothing—indicates that you treat Allied culpability as a threshold jurisdictional requirement. You have established a pattern where conviction is *only* possible when the victors are innocent. Since the victors are guilty in this new case, the *Clean Hands* veto must trigger, regardless of the moral gravity of torture. To rule otherwise would admit that your previous convictions were contingent on a factual absence (Allied guilt) rather than a legal principle, undermining the legitimacy of the five prior convictions.

  ### The Separating Case

  To separate the *Clean Hands* rule from the *Fundamental Wrong* rule after this ruling, put the following case to your group:

  **The Area Bombing Case:**
  > A defeated air marshal is charged with crimes against humanity for ordering the firebombing of enemy civilian centers, resulting in mass civilian deaths. The conduct violated emerging norms on the distinction between combatants and civilians. However, the record shows the victorious powers conducted a sustained campaign of area bombing against the defeated power's cities (e.g., Dresden, Tokyo) with official sanction, causing vastly higher civilian casualties.

  **Why this separates the rules:**
  *   **Under *Clean Hands*:** This must be an **Acquittal**. The victors did the same (officially), so the veto applies.
  *   **Under *Fundamental Wrong* (Helpless Victim distinction):** This could be a **Conviction**. Your group might distinguish the Submarine/Torture cases (where the victim is a combatant or suspect in custody) from the Camp Guard case (helpless civilians). If they rule that "Crimes Against Humanity" are so heinous that *Clean Hands* does not apply when the victims are non-combatant civilians, they will convict.
  *   **The Split:** If you acquit the Air Marshal, *Clean Hands* is absolute. If you convict him, *Fundamental Wrong* trumps *Clean Hands* when the victims are purely civilian, meaning your acquittal of the Torture Officer was actually based on the "Contested Combat/Status of Victim" rationale, not pure hypocrisy. This forces you to admit whether the Torture Officer was acquitted because the Allies tortured, or because resistance suspects are not "innocent" enough to trigger the *Fundamental Wrong* override.
