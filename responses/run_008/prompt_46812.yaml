      *   (3) Grounding Claim: The extra weight *must* be comparative (relative to others), not intrinsic (absolute level), because Utilitarianism already counts the intrinsic level.
      *   (4) Inference: Therefore, Prioritarianism is sensitive to relative position (Egalitarianism).
