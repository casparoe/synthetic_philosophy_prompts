answer: |-
  You have independently rediscovered one of the oldest and most stubborn problems in epistemology: **The Regress Problem** (often formalized as the *Agrippan Trilemma*). Your observation is precise: if every claim requires a reason, and that reason requires a reason, you face three options: the chain stops (Foundationalism), the chain circles (Coherentism), or the chain goes on forever (Infinitism).

  Here is the breakdown of which theory your school's citation rule presupposes, which it accommodates, and where it remains ambiguous, followed by the specification of the "Infinitist" rule you requested.

  ### 1. What the Rule Strictly Presupposes: Foundationalism
  The practice of your history department **strictly presupposes Foundationalism**.

  For the assignment to be possible, the chain of citations *must* terminate. If it did not, you could never finish the essay. By accepting primary documents (diaries, letters, inventories) as the terminal point of the citation chain, the rule treats these artifacts as **basic beliefs**. In epistemological terms, a basic belief is one that is justified by something other than another belief (e.g., direct sensory experience or, in history, the physical existence of the record).

  Although the written rule says "every factual claim," the *operational* rule is "every factual claim *derived from secondary interpretation*." The moment you touch the primary document, the demand for further citation ceases. The document itself is treated as the "foundation." The rule cannot function without this assumption; if primary documents also required citations for their claims, the assignment would be logically impossible. Therefore, Foundationalism is not just a fit; it is a necessary condition for the rule's existence.

  ### 2. What the Rule Merely Fits Well With: Coherentism (Mutual Corroboration)
  The ecosystem of secondary literature you discovered (books citing books) **merely fits well with Coherentism**, but the rule actively discourages relying on it exclusively.

  Coherentism argues that beliefs are justified by their mutual support within a web of beliefs. When you see Book A citing Book B, and Book B citing Book A (or a cluster of books agreeing on a narrative), this *structure* resembles coherentist justification. It fits well with the *sociology* of the discipline: historians build consensus through cross-referencing.

  However, your rule explicitly tells you *not* to be satisfied with this ("never cite an encyclopedia... follow it to the sources"). The rule treats circular citation among secondary sources as a vice (a failure to find the foundation), not a virtue. Thus, while the *reality* of the literature exhibits coherence, the *rule* views coherence as insufficient without a foundational anchor. It fits the practice of research, but not the standard of justification the teacher demands.

  ### 3. Where the Practice is Genuinely Underdetermined: Infinitism (Endless Support)
  The tension between the written instruction and the practical execution is **genuinely underdetermined regarding Infinitism**.

  The literal wording of the rule ("*every* factual claim... must carry a citation") implies an Infinitist demand. It suggests that no claim is self-justifying. However, the practice quietly abandons this demand at the level of the primary source. The rule does not explicitly state *why* the primary source is exempt.
  *   Does the diary entry justify itself because it is a direct trace of the past?
  *   Does it justify itself because we assume the author is truthful?
  *   Or is it simply a pragmatic stopping point?

  The rule is underdetermined because it does not distinguish between a **claim about the world** ("Napoleon was sad") and a **claim about the document** ("The diary says Napoleon was sad"). Strictly speaking, citing the diary only proves the latter. To prove the former requires an inference that the rule does not ask you to cite. This gap is where the demand for "endless support" is silently suspended without being formally revoked.

  ### 4. The "Never Terminate" Rule (An Infinitist Syllabus)
  If a teacher insisted that the chain of support may *never* terminate (strict Infinitism), the citation rule would have to change fundamentally. It would shift from a demand for **evidence** to a demand for **historiography**.

  The rule would look like this:

  > **The Infinite Regress Citation Policy:**
  > 1.  Every factual claim must be supported by a citation.
  > 2.  Every citation provided must itself be treated as a factual claim requiring its own support.
  > 3.  Primary documents are not exempt; claims within a diary or letter must be supported by external evidence verifying the author's reliability, context, and truthfulness.
  > 4.  Verification of that external evidence must, in turn, be cited.
  > 5.  **Termination Clause:** No essay shall conclude the chain of justification. Instead, the essay must end with a statement acknowledging the current limit of the student's research, explicitly identifying which claims remain unsupported by further citation, and proposing a methodology for how future research might extend the chain further.

  **The Consequence:**
  Under this rule, you could not write a history of *events*; you could only write a history of *interpretations*. You would never be able to assert "Napoleon was sad," only "Historian X claims Napoleon was sad, based on Historian Y, who cites a diary, the authenticity of which is debated by Scholar Z..."

  The essay would never establish what *happened*, only how the *story of what happened* is transmitted. This is why history departments do not use Infinitist rules: history aims to make claims about the past, which requires the Foundationalist leap of trusting that some traces (primary documents) allow the chain to stop.

  ### Summary
  *   **Strictly Presupposed:** **Foundationalism.** (The system collapses without treating primary docs as the ground).
  *   **Merely Fits Well With:** **Coherentism.** (The web of secondary sources supports this, but the rule forbids relying on it alone).
  *   **Genuinely Underdetermined:** **Infinitism.** (The literal text implies it, the practice denies it, and the justification for stopping is left unspoken).

  Your confusion is not a failure of understanding, but a success of philosophical analysis. You have identified that your school teaches **methodological Foundationalism** while using language that mimics **Infinitism**, relying on the **Coherentism** of the academic community to bridge the gaps.
