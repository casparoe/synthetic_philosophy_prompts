prompt: |-
  Background so you know where I'm coming from: I spent about thirty-five years doing computational neuroscience, mostly motor control -- state-space models, Kalman filtering, feedback control, the occasional bit of dimensionality reduction on spike trains. Retired now, and I've been reading philosophy of mind to fill the time. Most of it I can muddle through, but I've gotten stuck on the causal exclusion argument (Jaegwon Kim's supervenience argument, I believe it's usually called) and I genuinely can't tell whether it's a deep result or an artifact of philosophers working with a vaguer notion of "cause" than the one I'm used to.

  Here's the argument as I understand it. Mental events supervene on physical events: fix the physical state and the mental state is fixed too, there's no mental difference without a physical difference. Now suppose a mental event M causes some later physical event P*. The physical base of M, call it M*, is by itself causally sufficient for P*. So either M is doing no causal work (M* excludes it), or every case of mental causation is a case of systematic overdetermination, where two complete causes each independently produce the same effect. Since nobody accepts the overdetermination horn, mental causation looks doomed unless you identify the mental with the physical, which is just reductionism. And I gather there's a whole industry of responses -- some people bite bullets, some tinker with the laws, some say the causation is "different levels" somehow.

  What I want is a translation, not a survey. Restate this debate in the vocabulary I actually worked in for decades: state variables, latent vs. observable variables, parameters vs. states, coarse-graining, interventions, sufficient statistics, closed vs. open equations, feedback. To prime you with my own first attempts: supervenience sounds to me like "the macro-variable is a deterministic function of the micro-state," i.e., a coarse-graining. Multiple realizability sounds like many distinct micro-states landing on the same macro-value. "Causal powers" sounds like a response profile to interventions -- do this to the system, observe that. Exclusion sounds like the claim that if the full micro-dynamics already determines the trajectory, a macro-description can't also be doing dynamical work. Is that translation faithful or am I already smuggling things in? Go concept by concept and tell me where my mapping bends the original.

  Then the part I actually care about, the residue report: which parts of the philosophers' debate map cleanly onto my vocabulary, which survive only with distortion, and which have no counterpart at all. And for the stuff with no counterpart, I want your honest read on whether the residue means my vocabulary is missing something or whether the philosophical claim was less clear than it looked going in. Don't just flatter the philosophers, but don't flatter the dynamicists either.

  I also have a hunch I want pressure-tested. In stat mech you can write down closed, predictive equations for pressure and temperature without tracking molecules, and intervening on pressure (moving a piston) genuinely does things -- nobody concludes pressure is "causally inert" just because the molecular dynamics is already sufficient. My instinct is that mental properties are like that: variables in an effective model that is autonomous enough to support interventionist claims. If you ran the exclusion argument on pressure, would it really conclude that pressure is causally inert? If yes, I feel like the argument proves too much. But I suspect I'm begging the question somewhere -- maybe against the "systematic overdetermination" premise, or maybe the mental/physical case differs from the thermodynamic case in a way that matters (noise? no clean separation of timescales? the supervenience base not being compact the way a gas state is?). You're the one who's read the literature, so find the weak joint in my hunch if there is one.

  And please push back if you think the task as I've posed it is confused -- e.g., if "cause" just means different things in control theory and in Kim's argument, or if my stat-mech analogy only works against a weak version of the argument nobody actually holds. Say so plainly rather than producing a diplomatic translation that papers over the problem.

  Once you've done the prose part, finish with a JSON object in exactly this schema (I want to feed it into my notes file):

  {
    "concept_mappings": [
      {
        "philosophical_term": "one of: supervenience, realization / multiple realizability, causal sufficiency, exclusion, overdetermination, causal power -- or another term if needed",
        "dynamics_translation": "the closest counterpart in state-space / control / coarse-graining vocabulary",
        "distortion": "what the translation fudges, or literally 'none' if it's clean"
      }
    ],
    "residue": [
      {
        "item": "a part of the debate with no counterpart in my vocabulary",
        "verdict": "either 'target vocabulary is missing something' or 'original claim is less clear than it looked'",
        "reason": "why"
      }
    ],
    "hunch_verdict": "whether my effective-model reading of mental properties survives contact with the actual argument, and exactly where it begs the question if it does",
    "pressure_analogy_status": "does the exclusion argument, run on pressure, refute me or not -- and what the disanalogy is, if there is one",
    "next_concept": "the single concept (not a reading list, not a bibliography -- just the idea) I should understand before thinking about this further"
  }
