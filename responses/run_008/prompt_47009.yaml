answer: |-
  This is a superb test case. As a geophysicist, you know that the boundary between "discovery" and "stipulation" is often where the real work happens (is a seamount a mountain? is a mudstone a rock?). The 2006 IAU resolution offers a rare, documented moment where a scientific community explicitly voted on the semantics of a kind term.

  Here is the stress test of the Kripke–Putnam picture against the demotion of Pluto.

  ### 1. The Causal Chain and the 2006 Vote

  **The Initial Baptism**
  On the Kripkean picture, a natural kind term begins with an "initial baptism," where a sample is ostended and named. For "planet," the baptism was ancient. The Greeks ostended specific moving lights against the fixed stars (*planētēs*, wanderers).
  *   **The Problem:** This baptism was not of a *microstructural essence* (like H₂O) but of a *phenomenological role* (moves relative to stars).
  *   **The Chain:** As Herschel discovered Uranus (1781), it was added to the chain because it fit the descriptive cluster associated with the previous links (orbits Sun, moves against stars).
  *   **The Ceres Interruption:** Your mention of Ceres is fatal to a strict Kripkean reading of "planet" as a rigid natural kind. Ceres was baptized "planet" in 1801. When Pallas, Juno, and Vesta were found, astronomers didn't say, "We have discovered the essence of planet-hood excludes these." They said, "There are too many of these; let's create a new category (asteroid)."
  *   **Implication:** The reference of "planet" was not fixed rigidly to a hidden nature in 1801. It was fixed to a *description* that proved flexible. The chain of transmission allowed for the *intension* (the concept) to shift, which Kripke argues natural kind terms do not do.

  **The 2006 Vote: Discovery or Legislation?**
  In the Kripke–Putnam framework, scientific inquiry uncovers the extension of a term fixed by the initial baptism. If "planet" were a natural kind term like "water," the IAU vote would be epistemologically otiose. You do not vote on whether water is H₂O; you discover it.
  *   **The Vote as Stipulation:** The 2006 resolution introduced a new criterion: "clearing the neighborhood." This is not an intrinsic property of the object (like atomic number); it is a relational/dynamical property dependent on the object's environment.
  *   **The Verdict on the Vote:** In Kripkean terms, the 2006 vote was **not** a discovery of what "planet" had meant all along. It was a **stipulative redefinition**. It was a decision to sever the causal chain linking back to the Greeks and initiate a new baptismal ceremony for the term "planet," restricting its extension going forward.
  *   **Where the Theory is Silent:** Kripke's theory explains how reference is *preserved* through history, not how it is *revised* by committee. The theory has no machinery for handling a democratic vote on semantics. It assumes reference is determined by causal history and metaphysical essence, not by parliamentary procedure.

  ### 2. Is "Planet" a Natural Kind Term?

  **The Essentialism Test**
  Putnam's "Twin Earth" thought experiment relies on the idea that there is a "hidden structure" that determines extension regardless of our beliefs. For water, it is H₂O. For gold, it is atomic number 79.
  *   **Pluto's "Essence":** Does Pluto have a hidden microstructure that makes it a planet? No. Its composition (ice/rock) is shared by many moons and dwarf planets. Its status depends on its orbital dynamics (clearing the neighborhood).
  *   **Necessary A Posteriori:** If "planet" were a natural kind, the statement "Pluto is a planet" (if true) would be *necessary a posteriori*. It would be true in all possible worlds where Pluto exists. But if we can conceive of a world where Pluto exists in a cleared orbit (and is a planet) vs. an uncleared orbit (and is not), then "planet" is not a rigid designator of a natural kind. It is a **functional** or **dynamical kind**.

  **Did Pluto Change?**
  *   **Ontologically:** Nothing changed about Pluto. Its mass, orbit, and composition remained identical.
  *   **Semantically:** The extension of the word "planet" changed.
  *   **The Description:** "Pluto stopped being a planet in 2006" is colloquially acceptable but metaphysically imprecise. A more rigorous description is: "In 2006, the linguistic community (specifically the experts) restricted the extension of the term 'planet' such that it no longer included Pluto."
  *   **Theory Strain:** If "planet" were a genuine Kripkean natural kind, the IAU vote would be akin to voting that water is not wet. The fact that the vote *succeeded* in changing usage suggests "planet" lacks the metaphysical rigidity of "water."

  ### 3. The Division of Linguistic Labor

  **The Mechanism**
  Putnam argues that laypeople defer to experts to fix the extension of natural kind terms. I don't need to know what elm wood looks like; I defer to botanists.
  *   **Vindication:** In the aftermath, textbooks were rewritten, and the laity (mostly) deferred. The experts spoke, and the extension shifted. This looks like the Division of Linguistic Labor working perfectly.
  *   **The Gap:** The Division of Labor assumes experts are *reporting* on the structure of the world, not *designing* it. When a geologist identifies a rock, they are matching it to a pre-existing kind. When the IAU voted, they were drawing a boundary where nature had provided a continuum.
  *   **The Sorites Problem:** The theory is silent on **vagueness**. Kripke and Putnam assume kinds have sharp boundaries determined by essence. But in astronomy (as in geology), there are often continua (size, orbital dominance). The IAU vote was a solution to a Sorites paradox (how many grains make a heap? how many objects make a planetary system?).
  *   **Conclusion:** The Division of Labor explains *who* decided (the IAU), but the Kripke–Putnam framework cannot explain *why* a vote was necessary. If the essence were "out there," a vote would be redundant. The need for a vote exposes that the boundary was not discovered but drawn.

  ### 4. "Water" vs. "Continent": The Verdict on Essence

  You asked for a frank comparison.

  *   **Water:** Fundamental natural kind. Essence is microstructural (H₂O). Discovery is empirical. Boundary is sharp (molecular).
  *   **Continent:** Geopolitical/Geographical convention. Essence is functional/historical (large landmass, cultural distinctness). Boundary is stipulative (Is Europe a continent? Is Zealandia?).
  *   **Planet:** **Closer to "Continent."**

  **Why?**
  Like "continent," "planet" is a high-level, macroscopic classification. It depends on context (the "neighborhood" criterion). Like "continent," it serves a pragmatic purpose (organizing textbooks, mission planning) rather than tracking a fundamental law of physics.
  *   **The Complaint:** "The IAU didn't learn anything about Pluto; they just changed the subject."
  *   **Analysis:** Under the Kripke–Putnam picture, if "planet" were like "water," this complaint would be false (they would have learned the essence). Since "planet" is like "continent," **the complaint is correct.** They did not discover a new fact about Pluto; they altered the linguistic convention for grouping objects.

  ### 5. Final Verdict: Confirm, Strain, or Decorate?

  The 2006 Pluto episode **strains** the Kripke–Putnam picture, specifically its tendency to be overextended to all scientific terminology.

  1.  **Confirmation:** It confirms the **Division of Linguistic Labor**. The lay public deferred to the IAU to fix the extension, even if they disliked the result. It confirms that reference is not fixed by individual description (schoolchildren didn't keep calling Pluto a planet because their personal definition didn't change; the public usage shifted).
  2.  **Strain:** It strains the **Natural Kind Hypothesis**. It demonstrates that not all scientific terms are rigid designators of hidden essences. Many are "cluster concepts" or "functional kinds" where the boundary is pragmatic, not metaphysical. The theory struggles to account for the *normative* aspect of the vote (that they *should* define it this way) versus the *descriptive* aspect (what the term *does* refer to).
  3.  **Silence:** The theory is silent on **classification policy**. Kripke and Putnam are metaphysicians of language, not sociologists of science. They explain how reference works once established, not how scientific communities negotiate boundaries in the face of vagueness.

  **Summary for a Geophysicist:**
  Think of "planet" not as "granite" (defined by mineralogy/essence) but as "mountain" (defined by prominence/context). You can vote on what counts as a mountain for the sake of a registry. You cannot vote on what counts as granite. The IAU treated "planet" as a registry term, while the public treated it as an essence term. The Kripke–Putnam picture explains why the public felt aggrieved (they thought they were talking about natural kinds), but it requires us to admit that the astronomers were right: "planet" was never a natural kind term in the strict sense. It was a taxonomic convenience all along, much like "continent."

  The episode does not falsify Kripke–Putnam, but it serves as a boundary marker for their theory: **Rigid designation applies to fundamental kinds (water, gold, electrons); it does not apply to higher-order taxonomic clusters (planet, species, continent) where pragmatic boundaries override hidden essences.**
