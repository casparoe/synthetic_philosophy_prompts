answer: |-
  # Quiz: What's Your Reality Setting?

  **Instructions:** Read each scenario and pick the answer that feels most true to you. Don't overthink it—go with your gut. At the end, tally your results to see which philosophical camp you're camping in.

  **1. The Mind Upload**
  Imagine we build a computer so advanced it perfectly mimics every neuron in your brain. It cries when sad, laughs at jokes, and begs not to be turned off. Is it conscious?
  *   **A.** Yes. If it acts like a mind and thinks like a mind, it *is* a mind. The hardware doesn't matter.
  *   **B.** No. Consciousness needs biology, blood, or something "meaty." Code is just math.
  *   **C.** Maybe, but it would be a "zombie"—acting conscious without actually feeling anything inside.

  **2. The Great Filter**
  Look at human history: plagues, nukes, climate change. Do you think our civilization will survive long enough to build universe-scale computers?
  *   **A.** Unlikely. We'll probably wipe ourselves out or stagnate before we get that powerful.
  *   **B.** Definitely. Technology tends to accelerate; we'll get there unless something external stops us.
  *   **C.** We might survive, but physics might put a hard limit on computing power that makes it impossible.

  **3. The Bored God**
  Assume our descendants *could* run simulations of their ancestors (us). Would they *want* to?
  *   **A.** Absolutely. History, sociology, and entertainment are timeless. They'd run billions of them.
  *   **B.** No way. It's unethical to simulate suffering, or they'd just be too bored with "primitive" times.
  *   **C.** They might run simulations, but not of *us* specifically. We're too boring to be worth the processing power.

  **4. The Headcount**
  If advanced civilizations run billions of ancestor simulations, there would be billions of simulated people for every one "real" person. If you pick a random conscious being from that pool, what are the odds they're simulated?
  *   **A.** Overwhelmingly high. The numbers say I'm almost certainly in a simulation.
  *   **B.** 50/50. You can't do math on existence. I feel real, so the numbers don't apply to me.
  *   **C.** Low. There has to be a "base reality" somewhere, and I'm likely in the original, not the copy.

  **5. The Pinch Test**
  If you discovered proof tomorrow that physics is code, would your morning coffee still be real coffee?
  *   **A.** Yes. It still wakes me up, tastes bitter, and stains my shirt. "Real" is about function, not origin.
  *   **B.** No. It would be "fake" coffee in a fake world. Nothing would truly matter anymore.
  *   **C.** I'd need to see the code first. Until then, it's real enough to drink.

  **6. The Moral Compass**
  If there are simulators watching us, does that change what you owe your neighbor?
  *   **A.** No. Ethics come from us. Whether they watch or not, hurting people is still wrong.
  *   **B.** Maybe. If they have a purpose for us, ignoring it might be like vandalizing a museum exhibit.
  *   **C.** Yes. We should prioritize keeping the simulators happy so they don't turn the server off.

  **7. The Glitch Hunter**
  Scientists propose an experiment to look for "pixels" in spacetime to prove we're simulated. Should we do it?
  *   **A.** Yes. Truth is more important than comfort. We need to know what we are.
  *   **B.** No. If we're in a simulation, poking at the walls might look like a bug. They might patch us.
  *   **C.** Sure, but it's a waste of money. We can't change the code, so why bother looking?

  **8. The Meaning Source**
  If we are someone else's science project, does your life have less meaning?
  *   **A.** No. I make my own meaning. A character in a novel can still love and struggle.
  *   **B.** Yes. It makes us just lab rats. Our choices aren't truly ours.
  *   **C.** It depends on the simulators. If they're benevolent, maybe we're part of something bigger.

  **9. The Physics Wall**
  Why haven't we seen any obvious glitches in reality yet (like flying cats or disappearing moons)?
  *   **A.** Because the simulation is high-fidelity. It's supposed to look perfect.
  *   **B.** Because reality isn't a simulation. Physics is just physics.
  *   **C.** Because the simulators hide the glitches from the subjects to keep the experiment valid.

  **10. The Tuesday Test**
  How does thinking about this change what you do this afternoon?
  *   **A.** Nothing. I've got work to do, people to love, and bills to pay.
  *   **B.** I should try to be more "interesting" so the simulators keep running my timeline.
  *   **C.** I should be careful not to draw attention to myself in case "admins" notice anomalies.

  ***

  # Scoring Key

  Tally up which letter you chose most often. If you have a mix, look at the "Tie-Breaker" notes.

  **Mostly A's: The Probabilistic Simulationist**
  *You buy the math.* You accept that minds can be coded, civilizations survive, and descendants would run ancestor sims. Therefore, statistically, you're likely in one.
  *   **Awkward Commitment:** You have to accept that your gut feeling of "being real" is a statistical illusion.

  **Mostly B's: The Flat-Out Rejector**
  *You trust your gut over the math.* You likely reject the idea that code can feel (Q1) or that probability applies to existence (Q4). To you, the argument is a category error.
  *   **Awkward Commitment:** You must explain why consciousness *requires* biology without sounding mystical.

  **Mostly C's: The Deflationary Realist**
  *You think the question is a dud.* You might admit we *could* be simulated, but you deny it changes anything. Tables are real, pain is real, and ethics are internal.
  *   **Awkward Commitment:** You have to argue that "simulated" doesn't mean "fake," which confuses everyone.

  **High Score on Q2 (Option A): The Extinctionist**
  *Specific Diagnostic:* If you picked **2A** regardless of other answers, you hold that civilizations die before they get the tech.
  *   **Awkward Commitment:** You have to believe humanity is uniquely doomed compared to all other potential civilizations.

  **High Score on Q3 (Option B/C): The Disinterest Theorist**
  *Specific Diagnostic:* If you picked **3B** or **3C**, you think posthumans *could* simulate us but *won't*.
  *   **Awkward Commitment:** You have to assume advanced beings share your specific ethical or boredom thresholds.

  **High Score on Q6/Q7 (Option B/C): The Precautionary Principle**
  *Specific Diagnostic:* If you picked **6C** or **7B**, you worry about the risk of investigation.
  *   **Awkward Commitment:** You have to live with the anxiety that curiosity could get you "deleted."

  **High Score on Q6 (Option B): The Teleological Believer**
  *Specific Diagnostic:* If you picked **6B**, you think our purpose comes from the simulators.
  *   **Awkward Commitment:** You have to guess what gods who can simulate universes actually want from us.

  ***

  # Editor's Notes & Muddy Distinctions

  **1. The Morality Muddle (Q6)**
  This quiz cannot cleanly distinguish between the **Precautionary** view ("Obey them so they don't delete us") and the **Teleological** view ("Obey them because they give our lives meaning"). Both result in "We owe them something."
  *   *Why:* Both positions treat the simulators as authority figures, differing only on whether the motivation is fear or purpose. To separate them, we'd need a question about *emotion* (fear vs. reverence), which is too subjective for a quiz.

  **2. The Rejector vs. Deflationary Blur (Q5 & Q10)**
  A **Rejector** (We aren't simulated) and a **Deflationary Realist** (It doesn't matter if we are) will often pick the same answers on practical questions (Q5, Q10).
  *   *Why:* They agree on the *outcome* (live normally), just not the *premise*. The quiz separates them via Q1 (Substrate) and Q4 (Probability), but a reader who skips the nuance might lump them together.

  **3. Extinction vs. Disinterest (Q2 vs. Q3)**
  These are the two "No" branches of the classic trilemma. The quiz separates them by asking about *ability* (Q2) vs. *desire* (Q3).
  *   *Why:* This is the cleanest split in the quiz. If a reader picks "We'll die first" (2A) but also "They wouldn't want to" (3B), they are doubly skeptical, but the scoring key prioritizes the Extinctionist label as it's the stronger claim.

  **4. Glossary for the Sidebar**
  *   **Substrate Independence:** The idea that consciousness depends on the *pattern* of information, not the physical stuff (meat vs. silicon) holding it.
  *   **Self-Locating Probability:** The statistical move that says if there are a billion simulated "yous" and one real "you," you should bet on being a simulated one.
  *   **The Trilemma:** Nick Bostrom's argument that one of three things must be true: (1) Civilizations die before simulating, (2) They choose not to simulate, or (3) We are almost certainly in a simulation.
