answer: |-
  ### What the chapter gets right

  The chapter correctly maps the dominant narrative arc of modern historiography: a movement from nineteenth-century positivism toward twentieth-century skepticism. It accurately identifies the key figures and their signature contributions. Leopold von Ranke did prioritize archival rigor and famously used the phrase *wie es eigentlich gewesen*. E. H. Carr did emphasize the historian's role in selecting facts in *What Is History?*, challenging naive empiricism. Hayden White did argue in *Metahistory* that narrative structures shape historical understanding. As a heuristic device, this triad helps students grasp how historical theory evolved from trusting sources to questioning narrative construction. The summary effectively flags real methodological problems: bias in selection and the literary nature of historical writing. While it identifies the right landmarks, it caricatures the terrain between them, turning nuanced methodological shifts into a simplistic demolition derby of truth itself. This makes it pedagogically functional, despite its historical inaccuracies regarding the specific philosophical commitments of each man.

  ### Ranke misread

  The chapter portrays Ranke as a naive positivist believing history could match physics. Ranke's "scientific" meant critical source analysis, not natural-law determinism or Comtean positivism. He rejected abstract theories, believing each epoch was "immediate to God," possessing unique individuality. His motto, *wie es eigentlich gewesen*, is often translated "as it actually happened," but *eigentlich* implies "essentially" or "properly." He sought the inner truth of events, not just external data. Ranke never claimed to exclude interpretation; he believed the historian's intuition (*Divination*) was necessary to grasp the spiritual reality behind documents. He didn't promise finished certainty valid for everyone like a lab result; he acknowledged the infinite nature of historical truth. The "physics-model" attribution is an anachronism projected by later critics who needed a straw man to knock down. Ranke sought objectivity through rigorous method and self-effacement before sources, but he understood this as a moral and religious duty, not a mechanical guarantee of truth. He believed in attainable truth, but not via the sterile mechanism the chapter describes. Thus, the chapter conflates Ranke with later positivists who adopted his methods without his philosophy.

  ### Carr and White misread

  The chapter exaggerates both thinkers into relativists. Carr never claimed no account is more objective than another. In *What Is History?*, he argued objectivity is a goal achieved through dialogue between historian and facts, not a starting state. He believed in progress and truth, famously stating facts are like fish in the ocean; you catch what you can, but the ocean exists independently. He sought a higher objectivity, not none. Similarly, Hayden White is often misread as saying history is fiction. In *Metahistory*, he argued historians use literary tropes to make sense of events, not that events didn't happen. He distinguished between the "historical field" (real events) and the "verbal structure" (narrative). White didn't claim footnotes are the only difference; he acknowledged evidence constraints. Neither argued that all interpretations are equally valid. Carr believed better historians ask better questions; White believed some emplotments explain better than others. They challenged naive objectivity, not the possibility of rigorous, evidence-based truth. The chapter turns their methodological warnings into an epistemological dead-end they didn't endorse. Carr insisted that the historian must respect the autonomy of facts, even while interpreting them.

  ### Does the conclusion follow?

  The conclusion does not follow. Even accepting the accurate critiques—that selection involves bias and narrative imposes structure—retiring "objectivity" is unwarranted. Objectivity functions best not as a state of perfect neutrality, but as a regulative ideal: a commitment to procedural fairness, evidence fidelity, and peer critique. If we discard it entirely, we lose the ability to distinguish between Holocaust denial and standard historiography, as both employ narrative and selection. The chapter's exaggerations support the conclusion only by creating a false dichotomy: either perfect physics-like certainty or total subjective fiction. We can acknowledge Carr's selection and White's emplotment while maintaining that some accounts are more objectively supported by evidence than others. Retiring it risks abandoning the discipline's ethical commitment to truth. It is still necessary. A refined concept of objectivity—one aware of its limitations but striving against bias—remains essential for distinguishing history from propaganda or myth. This distinction protects the discipline's integrity.
