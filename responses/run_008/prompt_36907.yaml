answer: |-
  Based on Maya's track record, here is the analysis of her decision-making, the competing rules, and how to test them.

  ### 1. The Prediction
  Maya will almost certainly call the citizens' assembly **undemocratic**.

  Despite the assembly being a "true cross-section of residents" (which addresses the descriptive representation she ignored in Case 1), it lacks the specific feature she consistently privileges: **electoral authorization.** To Maya, democracy is a specific set of procedures (elections and referenda), not a sociological outcome (who the decision-makers look like). Because the assembly members are chosen by lot and cannot be voted out, they will look to her exactly like the "unelected lawyers" (Case 3) and "central bankers" (Case 4) she rejects.

  ### 2. The Primary Rule: "Electoral Authorization"
  This is the rule that best explains her consistency.
  *   **The Principle:** A decision is democratic if and only if it is made either by a direct vote of the majority (referendum) or by officials chosen through competitive elections (parliament, president).
  *   **How it fits the data:**
      *   **Parliament:** Democratic because they are elected (even if they are millionaires).
      *   **Referendum:** Democratic because it is a direct vote.
      *   **Courts/Bankers:** Undemocratic because they are unelected policy-makers.
      *   **Electoral College:** Democratic because it is the constitutionally mandated *electoral* mechanism for selecting the executive, not an unelected policy body.
  *   **Why it predicts "Undemocratic" for the Assembly:** Sortition (random selection) is not an election. The members have no mandate from the ballot box and cannot be removed by one. Therefore, they lack democratic legitimacy.

  ### 3. The Alternative Rule: "Anti-Technocratic Insulation"
  This rule fits her past verdicts just as well but predicts the opposite for the citizens' assembly.
  *   **The Principle:** A decision is undemocratic if it is made by a permanent, insulated class of experts or elites who are shielded from public consequences. Democracy is preserved when decision-makers are either the people themselves or accountable non-experts.
  *   **How it fits the data:**
      *   **Parliament:** Democratic because they face re-election (accountable), even if they are rich (wealth $\neq$ insulation).
      *   **Courts/Bankers:** Undemocratic because they are life-tenured or long-term experts insulated from public anger.
      *   **Electoral College:** Democratic because it is a temporary mechanism, not a permanent class of governors.
      *   **Referendum:** Democratic because it is the people.
  *   **Why it predicts "Democratic" for the Assembly:** The assembly members are regular citizens (not experts), serve short terms (not insulated/permanent), and are a cross-section (not a distinct class). Under this rule, they are the *antidote* to the undemocratic nature of courts and banks.

  ### 4. The Test Case
  To distinguish between **Electoral Authorization** (Rule 1) and **Anti-Technocratic Insulation** (Rule 2), you need a scenario where "regular people" have power over "elected elites."

  **The Case:**
  > "Imagine a committee of randomly selected citizens is given the sole power to **set the salaries of elected officials** and approve their expense accounts. They cannot make laws, but they control the politicians' pay."

  **How it tells the rules apart:**
  *   **If Maya says it is Undemocratic:** She follows **Electoral Authorization**. She believes the "power of the purse" and contractual authority over representatives must remain with other elected representatives (the council/parliament). Random citizens, however regular, cannot hold authority over elected officials.
  *   **If Maya says it is Democratic:** She follows **Anti-Technocratic Insulation**. She views this as a way to prevent the "elite class" of politicians from self-dealing, placing the power back in the hands of non-insulated regular people.

  **Why this works:**
  This case isolates the variable of **class/status** versus **procedure**. Maya has already told you she doesn't care if representatives are millionaires (Case 1), which suggests she doesn't inherently hate elites. However, she hates *insulated* elites (Case 3 & 4). If she rejects the random salary committee, it proves she cares more about the *chain of electoral command* than the *social class of the decision-maker*, confirming she will reject the zoning assembly.
