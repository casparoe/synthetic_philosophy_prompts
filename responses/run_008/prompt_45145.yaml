answer: |-
  1. Arthur, a retired architect, spends his mornings choosing between sketching complex designs and watching birds in his garden, having always preferred the mental exertion of drafting until age seventy. By seventy-five, facing the same empty schedule and full bank account, he consistently chooses the birdwatching, not because his eyesight failed, but because the intricate lines now feel like noise rather than challenge.
  2. At stage one, Arthur reveals a preference for drafting over birdwatching when both are affordable, yet at stage two he reveals the opposite ranking despite identical constraints and full knowledge of his future indifference. This shift blocks the usual escape routes because he feels no compulsion to watch birds, harbors no regret about the loss of drafting, and never previously decided to cultivate this apathy.
  3. Strict revealed-preference reasoning confirms Arthur maximizes utility at both stages individually but remains strictly silent on whether the seventy-five-year-old is better or worse than the seventy-year-old since the orderings differ. Conversely, both ordinary judgment and a hedonic standard find him worse off at stage two, citing flatter days and a lack of anticipation despite his assent to the change.
  4. The divergence arises entirely from the endogenous drift in tastes itself, which severs the link between satisfying a preference and improving a life without introducing any external coercion. If this feature were removed and preferences remained fixed, the choice-based and welfare-based utilities would collapse back into alignment, rendering the paradox invisible.
  5. The revealed-preference theorist's strongest reply is to insist on preference sovereignty, arguing that if Arthur says he is satisfied, no outsider can claim he is worse off without imposing paternalistic values. However, this reply effectively concedes that choice-based utility is merely a measure of internal consistency rather than welfare, preserving the mathematical theory only by abandoning its claim to describe human flourishing.
