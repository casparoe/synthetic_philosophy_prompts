prompt: |-
  I'm a science journalist, and I'm working on a piece about how genetics numbers get mangled in coverage. A pop-science book I'm reviewing (big-name author, credentialed, I'll leave him unnamed) has a passage that goes roughly like this: "Twin studies show that IQ is around 50 percent heritable, which means half of a person's intelligence is fixed by their genes before they ever start school. This is why compensatory education has limited room to work: the gains from programs fade, and children's scores drift back toward the level their genes set. Heritability also lets you make predictions within families — identical twins share all their genes, so if one has an IQ of 130, the other has a fifty-fifty chance of getting there too."

  Something about it smells off to me, but each claim on its own sounds plausible enough. Can you go claim by claim and tell me: what would a behavioral geneticist actually sign off on, where is the author smuggling in something heritability doesn't say, and does the "education can't do much" conclusion survive once you fix whatever's wrong? I'm inclined to beleive heritability is being stretched beyond what it measures, but I honestly can't tell which parts are real findings (the fadeout stuff, for instance, which I've reported on myself and know is partly real) and which parts are the stretch.

  Keep the whole thing under 400 words, and at the very end tell me what would change your mind — what evidence, whether from twin studies, adoption studies, or intervention follow-ups, would flip your verdict on any of these claims, and where your own audit is most likely to be wrong.
