  2.  **Deconstruct the Claims (Mental Draft):**
      *   *Claim 1 (50% heritable):* Roughly accurate for adults, though varies by age/SES. Behavioral geneticists would mostly nod here.
      *   *Claim 2 (Half fixed before school):* **False.** Heritability is a population statistic (variance explained), not an individual proportion (fixed amount). It doesn't mean 50% of *your* IQ is genes. Also, heritability increases with age, it's lower in childhood.
      *   *Claim 3 (Education limited/fadeout):* **Misleading.** Heritability doesn't imply immutability. Phenylketonuria is 100% heritable but treatable by diet. Fadeout is real for some interventions, but attributing it solely to genetic set points ignores gene-environment interaction.
      *   *Claim 4 (Twin prediction):* **False.** Heritability ($h^2$) isn't correlation. If $h^2 = 0.5$, identical twin correlation is roughly 0.5 (actually often higher due to shared environment early on, but let's stick to the math). If one is 130, the other's *expected* value is higher than average, but not a "50% chance of getting there." That confuses variance explained with probability of matching.

  3.  **Drafting the Critique (aiming for conciseness):**
      *   Start with the core definition error. Heritability is population variance, not individual fixedness.
