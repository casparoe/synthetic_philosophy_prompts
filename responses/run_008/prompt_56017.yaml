answer: |-
  Your hypothesis is astute, and I largely endorse it, though with a crucial qualification. I diagnose the disagreement as a **verbal dispute grounded in divergent epistemological commitments**. It functions structurally as a quantifier-style verbal dispute, as you suggest, but the friction arises not merely from linguistic stipulation, rather from a fundamental clash regarding the authority of introspection.

  ### The Diagnosis

  The dispute is verbal in the sense that both parties agree on the 'worldly' facts—the neural correlates, the behavioural dispositions, and the functional roles of the systems in question. When an illusionist says, 'Phenomenal properties do not exist,' and a realist says, 'They do,' they are not disagreeing about the arrangement of matter or the flow of information. They are disagreeing about what the term 'phenomenal property' is permitted to latch onto.

  The illusionist operates with a **deflationary existential quantifier**. For them, to say 'X exists' is to say 'X plays a causal role in our best physical theory.' Since the 'ineffable qualia' posited by realists play no causal role distinct from functional states, the illusionist concludes they do not exist. The realist operates with a **robust existential quantifier**. For them, 'X exists' includes 'X is presented in immediate experience.' Since the experience is undeniably present, the property exists, regardless of its causal utility.

  However, calling it *merely* verbal understates the engine driving the verbal divergence. The root is **epistemological**.
  1.  **The Realist Claim:** Introspective reports are incorrigible or at least prima facie veridical. If it seems to me that there is a subjective residue, there is one. To deny this is to deny the data.
  2.  **The Illusionist Claim:** Introspection is a theoretical construct, a user-illusion generated by the brain. It seems to me that there is a residue, but 'seeming' is a functional state that can be erroneous.

  Therefore, the metaphysical disagreement (do qualia exist?) is a downstream consequence of an epistemological disagreement (is introspection a truth-tracker or a generator?). The 'verbal' nature of the fight is a symptom of this deeper epistemic rift. They are using the word 'existence' differently because they trust different sources of evidence.

  ### Grounding in Claims

  We can see this in how each side treats the 'hard problem'.
  *   **The Realist** argues that even if we explain all functions (attention, reportability, integration), the 'what-it-is-likeness' remains unexplained. This claim relies on the intuition that the *experience* is distinct from the *function*.
  *   **The Illusionist** argues that the 'what-it-is-likeness' *is* the functioning of the self-model. They claim the realist is reifying a cognitive process into a non-physical property.

  Since both agree on the functioning of the self-model, the dispute is entirely about whether that functioning *constitutes* the experience (illusionism) or *accompanies* a further property (realism). As you noted, this mirrors the debate over fictional characters: we agree on the text and the readers' reactions; we disagree on whether 'Sherlock Holmes' refers to an abstract object or nothing at all. Here, we agree on the brain and the behaviour; we disagree on whether 'pain' refers to a functional state or a functional state plus an intrinsic quality.

  ### What Counts as Progress?

  If the diagnosis is correct, progress will not come from new neuroscience, as both sides already accommodate the science. Progress requires a **conceptual reformulation**.

  The most promising avenue is the **Phenomenal Concept Strategy**. This approach suggests that there is only one kind of property (physical/functional), but we possess two kinds of *concepts* to refer to it: physical concepts (third-person, theoretical) and phenomenal concepts (first-person, direct).
  *   **Progress would look like:** The realist conceding that phenomenal concepts do not necessitate phenomenal *properties* (ontologically), while the illusionist concedes that phenomenal concepts are cognitively distinct and not simply eliminable.
  *   **Reformulated Question:** Instead of asking 'Do phenomenal properties exist?', the question should become: 'Does the distinctiveness of our phenomenal concepts entail a duality of properties, or merely a duality of modes of presentation?'

  If the parties can agree that the 'residue' is a feature of our *conceptual scheme* rather than the *world*, the substantive heat dissipates, leaving only the verbal task of deciding whether to call that conceptual feature 'consciousness' or 'illusion'.

  ### Confidence and Uncertainty

  I am **85% confident** in this diagnosis. The structural alignment with verbal disputes (like the mereological composition debate or fictional realism) is too strong to ignore, particularly given the agreement on empirical predictions.

  The part of the diagnosis of which I am **least sure** is whether the realist's intuition points to a genuine, ineffable fact that physicalism cannot capture, even in principle. There remains a sliver of possibility that the dispute is substantive because the 'what-it-is-like' aspect constitutes a brute fact of nature that is not exhausted by functional description. If such non-functional facts exist, the dispute is not verbal but metaphysical. However, since such facts would be causally inert and epistemically isolated, distinguishing this 'substantive' view from the 'verbal' diagnosis becomes practically impossible. Thus, for all pragmatic and philosophical purposes, the verbal diagnosis holds, but I cannot rule out the metaphysical possibility with absolute certainty.
