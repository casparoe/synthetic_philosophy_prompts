answer: |-
  ### Executive Summary: The State of Teleosemantics

  Teleosemantics remains the most robust framework for naturalizing intentionality, but it has reached a plateau. The core insight—that mental content is grounded in the proper functions of biological mechanisms—has been stable for thirty years, yet the theory remains vulnerable to the "Indeterminacy" objection and the "Swampman" intuition. The field suffers from a mismatch: we are applying a mid-20th-century synthesis view of evolution to 21st-century problems in cognitive science and AI.

  For eight early-career researchers (ECRs) over four years, the goal cannot be to "solve" teleosemantics in the abstract. It must be to **operationalize** it. We need to move from intuition pumps to structural metaphysics. The following agenda prioritizes the metaphysical groundwork required to make the theory empirically respectable. If we do not fix the engine (function individuation), we cannot drive the car (solve disjunction), and we certainly cannot let others drive it (apply to AI).

  ### Evaluation Criteria & Trade-Offs

  As a grant panelist, I am weighing four criteria:
  1.  **Upstream Dependence:** Does solving this question render others tractable or obsolete? (Highest weight).
  2.  **Tractability:** Can 8 ECRs make definitive progress in 4 years, or is this a generational stalemate?
  3.  **Neglectedness:** Is this area under-theorized relative to its importance?
  4.  **Funder Risk:** Does this balance philosophical rigor with the funder's interest in relevance (e.g., AI)?

  **Trade-off:** I am explicitly deprioritizing *pure conceptual analysis* of intuition pumps (e.g., refining the Swampman thought experiment itself) in favor of *metaphysical structuralism* (e.g., what constitutes a lineage). This risks alienating traditional a priori philosophers but is necessary for naturalization.

  ---

  ### Prioritized Research Agenda

  #### 1. The Metaphysics of Function Individuation (The "Grain" Problem)
  *Which selection processes generate functions, and how do we principledly individuate them?*

  *   **Ranking:** **Priority 1 (Foundational)**
  *   **Upstream Status:** This is the most upstream problem. Teleosemantics relies on "proper function." Proper function relies on "selection." But selection occurs at multiple levels (gene, organism, group, niche) and across multiple timescales (phylogenetic, ontogenetic, cultural). If we cannot specify *which* history counts, we cannot specify *which* content is generated. Solving this determines the boundaries of the disjunction problem.
  *   **Tractability:** **Mixed (Philosophy + Biology).** This cannot be solved a priori. It requires ECRs to engage with the Extended Evolutionary Synthesis (EES), niche construction theory, and multi-level selection debates. It is tractable because the biological literature is rich but philosophically under-synthesized.
  *   **Future Developments:**
      *   *Move Up:* If empirical biology converges on a dominant model of "units of selection," the philosophical work becomes specification.
      *   *Move Down:* If biology concludes selection is radically context-dependent with no principled individuation, this project may force a pivot to Function Pluralism (see below).
  *   **Allocation:** 3 Researchers. Focus on mapping the ontology of selection to the ontology of representation.

  #### 2. The Disjunction Problem in Light of Modern Learning Theory
  *Why does a state represent X rather than X-or-Y, given that both trigger the state?*

  *   **Ranking:** **Priority 2 (Core Technical)**
  *   **Upstream Status:** This is the classic objection (Fodor's "flies-or-black-specks"). It is downstream of Priority 1. You cannot solve disjunction without knowing which selection history fixes the content. However, it is upstream of application. If we cannot solve disjunction for frogs, we cannot solve it for neural nets.
  *   **Tractability:** **Low (Philosophically Hard).** This is the graveyard of teleosemantics. However, it becomes more tractable if Priority 1 succeeds. If we can tie content to specific *learning mechanisms* (ontogenetic selection) rather than just phylogeny, we gain finer-grained control over content attribution.
  *   **Future Developments:**
      *   *Move Up:* If predictive processing or active inference frameworks provide a mathematical account of error minimization that aligns with teleological function.
      *   *Move Down:* If the "Indeterminacy" proves to be a feature, not a bug, forcing a retreat to Pluralism.
  *   **Allocation:** 3 Researchers. Focus on integrating teleosemantics with contemporary computational neuroscience and learning theory, moving beyond the "frog" example.

  #### 3. Ahistorical Systems and the Limits of Teleosemantics (The "AI/Swampman" Test)
  *Can systems without evolutionary history (LLMs, Swampman) have content, and if so, does this break naturalism?*

  *   **Ranking:** **Priority 3 (Stress Test)**
  *   **Upstream Status:** This is downstream of 1 and 2. We must know what content *is* (via 1 & 2) before we can judge if AI has it. However, it acts as a *constraint* on 1 & 2. If our theory of function excludes AI but we are convinced AI has content, the theory is too narrow. If our theory includes AI but loses naturalism, the theory is broken.
  *   **Tractability:** **High (Interdisciplinary).** This is where the funder's interest in AI aligns with philosophy. It requires analyzing the training histories of LLMs (which *do* have a history, just not a biological one) versus their inference mechanisms.
  *   **Future Developments:**
      *   *Move Up:* If LLMs demonstrate robust, generalizable reasoning that rivals biological agents, the pressure to accommodate them increases.
      *   *Move Down:* If AI hits a wall showing it lacks genuine understanding (semantic grounding), the urgency diminishes.
  *   **Allocation:** 2 Researchers. Focus on the metaphysics of "design history" vs. "evolutionary history."

  ---

  ### The Artificial-Systems Question: Forcing Function or Distraction?

  You asked specifically whether the AI/LLM question is a genuine forcing function or a distraction. My verdict is: **It is a forcing function for the metaphysics of history, but a distraction for the semantics of content.**

  **Why it is a Forcing Function:**
  Teleosemantics traditionally grounds content in *biological* evolution. AI forces us to ask: Is it the *biology* that matters, or the *selection process*? LLMs undergo a form of selection (gradient descent on loss functions). If teleosemantics is truly naturalistic, it should be substrate-neutral regarding the selection mechanism. If we say AI has no content because it lacks DNA, we retreat to bio-chauvinism. If we say it *does* have content, we must generalize "proper function" to include engineering and training histories. This forces a rigorous definition of "history" (Priority 1) that we have previously glossed over.

  **Why it is a Distraction:**
  It becomes a distraction if researchers treat it as an *application* problem ("Let's apply Millikan to Transformers") rather than a *foundational* problem. Applying a broken theory to a new domain yields nonsense. Many current projects rush to label AI states as "representations" without solving the Disjunction Problem (Priority 2). If we cannot explain why a frog's detector isn't a "fly-or-speck" detector, we certainly cannot explain why an LLM's token isn't a "syntax-or-statistical-correlation" detector.

  **Strategic Directive:**
  The two researchers assigned to Priority 3 must **not** attempt to ascribe content to LLMs directly. Their job is to use LLMs as a counterfactual test case for the definitions generated by Priority 1 & 2. They are the "red team" testing the robustness of the core theory.

  ---

  ### Where I Would Refuse Funding

  To ensure the success of this agenda, I would explicitly reject proposals in the following categories:

  1.  **Pure Swampman Intuition Pumping:** Proposals that seek to refine the Swampman thought experiment itself (e.g., "Is Swampman conscious?") without linking it to the metaphysics of function. This is a stalemate of intuitions, not a research program. We need to analyze *history*, not imagine duplicates.
  2.  **Premature Application to AI:** Proposals that assume teleosemantics is correct and seek to "map" it onto neural network layers. This presupposes the solution to the Disjunction Problem. It puts the cart before the horse and risks corrupting the core theory to fit the tech.
  3.  **Defensive History:** Proposals dedicated solely to exegesis of Millikan, Papineau, or Neander. We know what they said. We need to know if it works with modern biology.
  4.  **Function Pluralism as a First Resort:** Proposals that argue for pluralism (abandoning a unified theory of content) as a starting assumption. Pluralism may be the *outcome* of this grant, but it cannot be the *premise*. It is too easy a way out of the hard work of naturalization.

  ### Conclusion: The Logic of the Order

  The order is strict.
  1.  **Individuation:** We must define the engine (Function).
  2.  **Disjunction:** We must ensure the engine drives the wheels (Content).
  3.  **Ahistorical Systems:** We must see if the car can drive on non-biological roads (AI).

  If we reverse this order (starting with AI), we risk building a theory of content that fits LLMs but fails for frogs, thereby losing the "naturalism" in naturalized intentionality. If we ignore Individuation, we solve Disjunction arbitrarily.

  This agenda accepts that teleosemantics might need radical revision (e.g., incorporating ontogenetic selection as primary over phylogenetic selection) to survive. It treats the theory not as a monument to be preserved, but as a living hypothesis to be stress-tested against the best available science. That is how you naturalize intentionality.
