  **Title:** The Sheriff and the Slur: A Pragmatic-Semantic Reading of *Blazing Saddles*

  **Introduction**

  Mel Brooks's *Blazing Saddles* (1974) presents a unique challenge to the philosophy of language. It is a text that saturates its runtime with racial slurs while simultaneously demanding that the audience direct their moral condemnation not at the targets of those slurs, but at the speakers. For a student of semantics and pragmatics, the film operates as a high-stress test case for competing theories of derogatory language. If one adopts a strict prohibitionist account, which holds that slurs are morally and linguistically toxic *per se*, the film appears indefensible. If one adopts a combinatorial expressivist account, which locates the derogatory force in a conventionalised attitude attached to the word, one must explain how that attitude is neutralised or inverted without erasing the word's meaning entirely. This essay argues that *Blazing Saddles* cannot be adequately explained by a purely semantic theory of slurs. Instead, it requires a pragmatic account that acknowledges the power of fictional framing and speaker intention, while admitting that this insulation is precarious. Furthermore, the claim that the film 'could not be made today' is not merely a cultural observation but a linguistic one: it signals a shift in the pragmatic common ground regarding who is licensed to utter these terms and what harms are assumed to accompany them, regardless of intent.

  **The Semantic Load and the Expressivist Challenge**

  To understand the linguistic mechanism of the film, we must first look at the townspeople of Rock Ridge. Under a combinatorial expressivist view, such as that proposed by Kaplan or Potts, a slur carries two components: a descriptive content (roughly equivalent to a neutral counterpart) and an expressive content (a conventionally implicated attitude of contempt or superiority). When the white townspeople in *Blazing Saddles* deploy slurs against Sheriff Bart, they are semantically encoding this attitude of contempt. The expressivist challenge for the film is straightforward: if the expressive content is conventional, how does the film prevent the audience from inheriting that attitude?

  Brooks's gambit relies on the separation of the *expression* from the *endorsement*. The film constructs a context where the expressive attitude of contempt is visibly attached to stupidity, ignorance, and moral bankruptcy. When Taggart or the townsfolk use slurs, the camera often lingers on their grotesque expressions or cuts to their violent incompetence. The audience is invited to process the expressive content of the slur not as a truth-claim about Bart, but as a character-revealing truth-claim about the speaker. In philosophical terms, the film attempts to shift the derogatory force from the target to the source. We are not meant to uptake the contempt for Bart; we are meant to uptake a contempt for the contemners.

  However, this relies on a pragmatic stability that expressivism suggests might not exist. If the derogatory content is truth-conditional or a conventional implicature, it is 'sticky'. It rides along with the proposition regardless of the speaker's virtue. There are moments in the film where the laughter seems to derive not from the stupidity of the racist, but from the sheer transgression of the word itself. In these moments, the expressivist account warns us that the film risks becoming complicit. If the audience laughs *at the shock of the slur* rather than *at the ignorance of the user*, the semantic toxicity has bypassed the satirical filter. The film dramatises a tension that philosophical papers often abstract away: the difficulty of weaponising a slur against its users without wounding the audience in the crossfire. The semantic content remains hostile, and the film bets that the pragmatic context is strong enough to contain it.

  **Prohibitionism and the Fictional Frame**

  This tension brings us to the prohibitionist account, associated with theorists like Anderson or Lepore, who argue that slurs are prohibited words, akin to verbal toxins. On a strict prohibitionist reading, the context of fiction should not grant immunity. If the word is harmful because of its history and its capacity to subordinate, then an actor speaking it in a film perpetuates that harm, regardless of the character's motivations.

  If we apply this rigorously to *Blazing Saddles*, the film is morally compromised simply by existing. The prohibitionist must argue that the utterance itself recreates the hierarchy the film claims to mock. However, this view struggles to account for the intuitive difference between a Klansman using a slur in 1924 and Cleavon Little's character, Bart, using similar language later in the film. When Bart turns the language back on the white townspeople, or when he uses it in a moment of exasperated self-reference, the prohibitionist account lacks the granularity to explain why these utterances feel distinct from the aggression of the antagonists. If the word is simply 'off-limits', the reclamation scenes should be as toxic as the hate speech scenes.

  The film suggests that the prohibitionist view is too blunt an instrument for analysing fictional discourse. In fiction, the 'speaker' is a construct. The attitude expressed is attributed to the character, not the actor or the screenwriter. An expressivist account handles this better by distinguishing between the *fictional expression* of attitude and the *actual expression* of attitude. Mel Brooks does not express contempt for Black people; he constructs a fictional world where *characters* express contempt, in order to mock that contempt.

  Yet, the prohibitionist raises a valid point regarding the *choice* of inclusion. Even if the actor is insulated, the writer is not. The decision to write the slur into the script is a real-world action. The film forces us to ask whether the satirical payoff justifies the real-world cost of circulating the term. This is where the film resists a clean philosophical reading. There are scenes where the density of slurs feels less like surgical satire and more like gratuitous shock. Here, the prohibitionist intuition gains traction: the accumulation of toxic language may normalise the term through mere exposure, regardless of the ironic framing. The film demonstrates that fictional insulation is porous; the semantic history of the word leaks out of the narrative frame and into the cinema.

  **Pragmatics, Reclamation, and the Shift in Common Ground**

  The most fertile ground for analysis lies in the pragmatic dimension, specifically regarding the claim that the film 'could not be made today'. This is often dismissed as a culture-war talking point, but within the philosophy of language, it points to a shift in pragmatic common ground. Pragmatic accounts of slurs emphasise that meaning is determined by speaker intention, audience uptake, and the power dynamics between them.

  In 1974, the pragmatic common ground between Brooks and his audience included a shared assumption: the audience possessed the linguistic competence to distinguish between the use of a slur to subordinate and the mention of a slur to satirise subordination. The film relies on a 'conversational contract' where the audience agrees to interpret the slurs as evidence of the speaker's villainy. Under this pragmatic model, the film works because the context overrides the default derogatory force. The reclamation scenes, where Bart or the townspeople (after accepting Bart) use the language more loosely, function as pragmatic shifts. They signal a change in the relationship between the speakers, attempting to drain the word of its subordinating power within the diegesis.

  Why, then, the assertion that it could not be made today? It is not that the semantics of the words have changed; the N-word has not undergone a semantic shift since the 1970s. Rather, the pragmatic presuppositions of the audience have shifted. The contemporary common ground includes a heightened awareness of the harm caused by the *circulation* of slurs, independent of the speaker's intent. Modern audiences are less willing to grant the 'satirical immunity' that the 1974 audience extended. The pragmatic licence to utter these terms, even in fiction, has been revoked or severely restricted.

  This illuminates a limitation in purely intentionalist pragmatic accounts. If meaning were solely determined by the speaker's benign intent (Brooks's anti-racism), the film should remain innocuous. The fact that it is now viewed as problematic suggests that audience uptake and the broader social context play a larger role in determining the 'force' of the slur than the author's intention. The harm is not just in the saying, but in the hearing and the repetition. The 'could not be made today' claim is essentially a claim about the erosion of trust in the pragmatic channel. We no longer trust that the satirical context can successfully neutralise the semantic toxicity.

  **Critical Resistance: Where the Satire Leaks**

  An honest philosophical reading must acknowledge where *Blazing Saddles* fails to sustain its own linguistic gambit. The prompt asks us to consider where the laughter is not entirely at the racists. There are sequences in the film, particularly involving the Chinese labourers or the character of Mongo, where the humour relies on racial stereotypes that are not clearly attributed to a villain's ignorance. In these moments, the 'mock the bigot' frame collapses. The camera does not invite us to judge the speaker's racism; it invites us to laugh at the target's difference.

  This failure supports a hybrid semantic-pragmatic view. It suggests that while pragmatics can modulate the force of a slur, it cannot fully overwrite its semantic history. The derogatory content has a inertia. When the film's focus shifts from the white racists to other marginalised groups, the pragmatic shield drops, and the raw semantic content of the stereotypes is exposed. This validates the concern that slurs carry a 'baggage' that is not entirely under the speaker's control. Even with the best intentions, and even within a satirical frame, the history of the term can reassert itself.

  This complicates the expressivist view. If the expressive content is merely a conventional implicature, it should be cancellable in the right context. The fact that certain jokes in the film now land with a thud, or cause discomfort that undermines the satire, suggests that the derogatory content is more deeply embedded than a simple implicature. It behaves more like a presupposition that is harder to cancel. The film dramatises the limit of pragmatic control: you can direct the audience's attention, but you cannot fully sanitise the vocabulary you employ.

  **Conclusion**

  *Blazing Saddles* serves as a vital case study because it refuses to let the philosophy of slurs remain abstract. It forces the theories to contend with volume, repetition, and the messy reality of comedy. A strict prohibitionist account condemns the film but fails to explain the intuitive moral difference between Bart's usage and Taggart's. A pure expressivist account explains the mechanism of the satire but underestimates the risk of semantic leakage.

  The most robust reading emerges from a pragmatic perspective that acknowledges the weight of semantic history. The film works, to the extent that it does, because it successfully manipulates the pragmatic context to invert the direction of the derogatory attitude. However, the claim that it could not be made today is vindicated by the theories themselves: it reflects a shift in the pragmatic common ground where the harm of circulation is now weighed heavier than the value of satirical exposure. The film ultimately teaches us that while context is king in pragmatics, the semantic history of a slur is a powerful counter-force. We can laugh at the bigot, but if we spend two hours listening to his vocabulary, we must accept that the vocabulary leaves a residue. The philosophy of language does not tell us whether the film is 'good' or 'bad', but it explains why the laughter has become harder to sustain: we have lost confidence in our ability to separate the word from the wound.
