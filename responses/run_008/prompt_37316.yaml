      *   *Mapping:*
          *   Parent $\rightarrow$ State/Government (or perhaps the Founding Generation).
          *   Sibling $\rightarrow$ Compatriots.
          *   Household $\rightarrow$ Territory/National Economy.
          *   Unchosen Relation $\rightarrow$ Birthright Citizenship.
          *   Reciprocal Care $\rightarrow$ Welfare State/Taxation/Defense.
      *   *Breakdowns:* Citizenship *can* be acquired/lost (unlike kinship). State coercion is explicit; family authority is (ideally) benevolent/paternal. Family obligations often persist despite non-reciprocity (e.g., caring for disabled sibling); nationalist obligations often hinge on contribution/reciprocity.
      *   *Relevance:* If citizenship is voluntary/revocable, the "unchosen" weight lessens. If obligations depend on reciprocity, they look more like contracts than family bonds.

  3.  **Deconstruct the Cosmopolitan Analogy (Humanity as Family):**
      *   *Claim:* If family ties ground obligations, and we are all family, then partiality to nation is nepotism.
      *   *Mapping:*
          *   Parent $\rightarrow$ Nature/God/Evolution (Source of life).
          *   Sibling $\rightarrow$ All Humans.
          *   Household $\rightarrow$ Earth/Global Economy.
          *   Unchosen Relation $\rightarrow$ Biological Species Membership.
          *   Reciprocal Care $\rightarrow$ Global Aid/Human Rights.
      *   *Breakdowns:* Genetic relatedness is too distant to trigger psychological mechanisms of kin altruism. "Family of Man" is metaphorical, not literal in the moral sense. Lack of a central "parent" authority to enforce duties. Intensity of obligation dilutes over distance (psychological reality).
      *   *Relevance:* If the "family" tie is too thin to generate *special* obligations, the analogy fails to prove we owe *equal* obligation to all. It proves we owe *some*, but not necessarily the *same* as to compatriots.

  4.  **Compare and Contrast (The "Cut Differently" Points):**
      *   *Membership:* Family is immutable; Citizenship is mutable. (Hurts Nationalist).
      *   *Reciprocity:* Family endures without it; State often doesn't. (Hurts Nationalist).
      *   *Descent:* Sibling tie is immediate; Human tie is remote. (Hurts Cosmopolitan).
      *   *Scale:* Family is intimate; Nation/Humanity is abstract. (Hurts both, but differently).

  5.  **Evaluate the Conclusions:**
      *   Do the analogies beg the question? Yes. Nationalists assume the nation *is* morally relevant like a family. Cosmopolitans assume species membership *is* morally relevant like a family.
      *   Do they survive? The Nationalist analogy is stronger psychologically but weaker metaphysically (citizenship isn't blood). The Cosmopolitan analogy is stronger metaphysically (we are all humans) but weaker psychologically/institutionally (no global household).
      *   Verdict: Neither fully survives as a *proof*, but they highlight different values (particularity vs. universality).

  6.  **Develop a Better Analogy:**
      *   *Options:* Teammates, Club, Social Contract, Coercive Institution.
      *   *Selection:* "Joint Participants in a Coercive Cooperative Scheme" (a hybrid of Contract and Institution).
      *   *Why?* It captures the voluntariness (mostly), the reciprocity, the shared rules, and the exclusivity without relying on mystical blood ties.
      *   *Conclusion:* Supports special obligations based on fairness and reciprocity, but allows for baseline humanitarian duties to outsiders (unlike the family model which might imply none).

  7.  **Drafting the Response (incorporating British English):**
