answer: |-
  Assisted dying is permissible if and only if a patient with current decision-making capacity voluntarily requests it to end suffering arising from a terminal or irreversible end-stage physical disease process.

  This principle relies on three specific clauses derived from your cases. First, **Current Decision-Making Capacity** is required, motivated by your uncertainty over the dementia case; it prioritizes the welfare of the person who exists now over the instructions of the person who existed then, resolving your flip by ruling that a contented patient cannot be killed based on a past self's directive. Second, **Terminal or End-Stage Physical Disease** is required, motivated by your rejection of the depression case; it distinguishes between suffering caused by a dying body (ALS, cancer) and suffering caused by a mind or stable disability that does not inherently lead to death. Third, **Mechanism Neutrality** is implied, motivated by your equivalence of ventilator withdrawal, self-administration, and doctor injection; once the eligibility criteria are met, the physical method of death is morally irrelevant.

  There are two verdicts this principle cannot save exactly as you currently hold them. First, it invalidates your **reasoning on palliative sedation and VSED**; you say these are fine because "the body gives out," but since you also accept the doctor's injection, your principle dictates that the mechanism doesn't matter—you must agree with your sister that these are morally equivalent to the injection, even if they feel different psychologically. Second, it forces a resolution on the **dementia case**; you cannot flip weekly. The principle demands you rule against honoring the directive because the current patient lacks capacity and appears content, meaning you must abandon the weeks where you felt honoring it was permissible.

  Regarding the man with the severe stable high spinal cord injury: **This is not permissible.** Under this principle, his case fails the "terminal or end-stage physical disease" clause just as the depression case did. While his suffering and loss of autonomy are real, his condition is stable and not medically foreseeable to cause death, placing him outside the boundary where you allow assistance in dying.
