prompt: |-
  I'm working through a passage from the *Mencius* (Gaozi I, in James Legge's 1895 translation) recording a debate between Mencius and his rival Gaozi, and I'm having trouble reconstructing the logic of the argument. The passage runs as follows.

  Gaozi says: "To enjoy food and delight in colours is nature. Benevolence is internal and not external; righteousness is external and not internal."

  Mencius asked him, "What is the ground of your saying that benevolence is internal and righteousness external?"

  Gaozi replied, "There is a man older than I, and I give honour to his age. It is not that there is first in me a principle of such reverence to age. It is just as when there is a white man, and I consider him white; according as he is so externally to me. On this account, I pronounce of righteousness that it is external."

  Mencius said, "There is no difference between our pronouncing a white horse to be white and our pronouncing a white man to be white. But is there no difference between the regard with which we acknowledge the age of an old horse and that with which we acknowledge the age of an old man? And what is it which is called righteousness? The fact of a man's being old? Or the fact of our giving honour to his age?"

  Gaozi said, "There is my younger brother; I love him. But the younger brother of a man of Qin I do not love: that is, the feeling is determined by myself, and therefore I say that benevolence is internal. On the other hand, I give honour to an old man of Chu, and I also give honour to an old man of my own people: that is, the feeling is determined by the age, and therefore I say that righteousness is external."

  Mencius answered him, "Our enjoyment of meat roasted by a man of Qin does not differ from our enjoyment of meat roasted by ourselves. Thus, what you insist on takes place also in the case of such things, and will you say likewise that our enjoyment of a roast is external?"

  Could you explain what is actually at stake in this exchange? Specifically: what does the internal/external distinction amount to — is Gaozi making a claim about which psychological states originate in us versus being triggered by features of the world, or something about the scope of our concern? And how is each of Mencius's three replies supposed to work — the white horse/old horse point, the question of whether righteousness consists in someone's being old or in our honouring their age, and the final analogy to enjoying roast meat? I'm particularly unsure about the last one: since our enjoyment of a roast is obviously a response to an external object, I can't tell whether Mencius is forcing Gaozi to abandon the internal/external distinction entirely or merely pointing out that Gaozi's criterion for "external" (being fixed by properties of the object rather than by one's relation to it) would absurdly classify even taste-pleasure as external, which Gaozi wanted to count as part of unproblematic inner nature.
