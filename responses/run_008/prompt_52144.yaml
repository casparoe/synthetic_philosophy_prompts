answer: |-
  Your intuition is spot-on. That paragraph is a classic example of "pop-philosophy": it gets the broad strokes right but smooths over the jagged edges where the actual philosophical work happens. The ending, in particular, is much more decisive than the actual state of the literature warrants.

  Here is a breakdown of what a metaphysician would accept, what is a harmless simplification, and where the text is misleading, addressing your three specific worries.

  ### 1. The "Observable" Properties Slip-up (Your point *a*)
  **Verdict: Misleading.**

  The text says: *"if two objects share all their **observable** properties... they aren't two objects at all."*

  This is a significant distortion of Leibniz. Leibniz was not an empiricist; he did not ground his metaphysics in human observation. His Principle of the Identity of Indiscernibles (PII) is a claim about **predicates**, not observations.
  *   **Leibniz's View:** For Leibniz, every substance (or "monad") contains within it a complete concept that predicates everything true about it, past, present, and future. Two things cannot share *all* properties because if they did, there would be no internal ground for them to be distinct.
  *   **The Problem with "Observable":** If you limit PII to *observable* properties, the principle becomes trivially false. Two distinct electrons in a lab might share all observable properties (mass, charge, spin), yet we treat them as two. Leibniz would argue that if they are truly two, there *must* be a metaphysical difference between them (perhaps a relational difference or a "haecceity"—a "this-ness"), even if humans can't observe it.
  *   **Why it matters:** By saying "observable," the author turns a deep metaphysical claim about the structure of reality into a shallow claim about human measurement. It sets up Black's counterexample to look stronger than it is, because Black's spheres are indistinguishable *in principle*, not just to a human observer.

  ### 2. Black's Spheres and "Falsification" (Your point *b*)
  **Verdict: Harmless Simplification bordering on Misleading.**

  The text says: *"Black thereby proved that two distinct things can share all their properties, so the identity of indiscernibles is simply false."*

  Max Black's 1952 paper is indeed the standard counterexample, but metaphysicians do not agree that it "proved PII false." Instead, it shifted the debate to the definition of **property**.
  *   **The Debate:** Black's argument works only if we restrict "properties" to **qualitative, intrinsic properties** (e.g., red, round, 1kg). If we allow **impure properties** (e.g., "being 2 miles from Sphere A"), then the spheres *do* differ. Sphere A has the property "being 2 miles from Sphere A"; Sphere B does not.
  *   **The Triviality Objection:** Defenders of PII argue that if you allow impure properties (properties that reference specific individuals), PII becomes a logical tautology (A is identical to A, B is not identical to A).
  *   **The Real Stakes:** Black didn't prove PII is *false*; he proved that PII is not a **logical truth**. He showed that a universe with two indiscernible spheres is not *logically contradictory*. But Leibniz never claimed it was a logical contradiction; he claimed it was metaphysically impossible because it violates the Principle of Sufficient Reason (PSR).
  *   **Why it matters:** The text treats Black's thought experiment as an empirical refutation. It isn't. It's a modal claim (a claim about possibility). Leibniz would simply reply: *"Black's universe is not metaphysically possible. God would have no reason to put Sphere A here and Sphere B there rather than vice versa. Therefore, such a universe cannot exist."* Black assumes the universe is possible; Leibniz denies it. That isn't a refutation; it's a stalemate.

  ### 3. "No Philosopher Accepts It" (Your point *c*)
  **Verdict: Flatly False.**

  The text says: *"you won't find a philosopher today who accepts it in its strong form."*

  This is the most egregious overstatement in the paragraph.
  *   **Contemporary Metaphysics:** There are prominent contemporary defenders of PII (or restricted versions of it). Philosophers like Gonzalo Rodriguez-Pereyra have written extensive defenses of the principle.
  *   **Philosophy of Physics:** This is where the debate is hottest. In Quantum Mechanics, particles like bosons are often described as "indistinguishable." Some philosophers argue this falsifies PII. However, others argue for **"weak discernibility"** (they stand in irreflexive relations to each other, like "having opposite spin"), which saves a version of PII.
  *   **Ontic Structural Realism:** Some philosophers argue that objects *don't exist* fundamentally, only structures do. In that view, PII is preserved because there are no "things" to be indiscernible.
  *   **Why it matters:** Saying "no philosopher accepts it" closes the book on a debate that is actually very active, particularly in the intersection of metaphysics and physics.

  ### 4. "Knocked Down for Good" (Your point *d*)
  **Verdict: Overstatement riding on the previous errors.**

  Does the line follow from the earlier text? **No.** It relies on the assumption that Black's thought experiment is a decisive refutation.

  *   **Question-Begging:** As noted above, Black's argument assumes that a symmetric universe is *possible*. Leibniz's PSR says it is *impossible*. To say Black "knocked it down" is to assume Leibniz is wrong about the PSR without arguing for it. It's like saying, "I imagined a square circle, therefore square circles are possible, therefore geometry is false."
  *   **The "For Good" Claim:** In philosophy, almost nothing is knocked down "for good." Arguments are refined, restricted, or reformulated. PII has been reformulated (e.g., applying only to concrete objects, or excluding haecceities) rather than discarded.
  *   **Why it matters:** This is the "pop-book" tendency to present philosophy as a series of solved problems rather than an ongoing conversation. It gives the reader a false sense of closure.

  ### Summary Table

  | Claim in Text | Metaphysician's Verdict | Nuance |
  | :--- | :--- | :--- |
  | **Leibniz linked PII to PSR.** | **Accurate.** | This is the correct historical and logical link. |
  | **PII is about "observable" properties.** | **Misleading.** | Leibniz meant *all* predicates, including metaphysical/relational ones, not just empirical observations. |
  | **Black's spheres share *all* properties.** | **Contested.** | Depends on whether relational properties (e.g., "distance from Sphere A") count. |
  | **Black proved PII is false.** | **Exaggerated.** | Black proved PII is not a *logical necessity*. Leibniz claimed it was a *metaphysical necessity*. |
  | **No philosopher accepts it today.** | **False.** | It remains a live topic, especially in philosophy of physics and contemporary metaphysics. |
  | **"Knocked down for good."** | **Overstatement.** | Ignores the counter-argument that Black's universe is metaphysically impossible per Leibniz. |

  ### Conclusion
  Your worry was correct. The paragraph is a **caricature**. It takes a nuanced metaphysical dispute about the nature of individuation and sufficient reason, reduces it to a puzzle about observation, declares a winner based on a thought experiment that begs the question, and falsely claims the debate is over.

  A more accurate (but less punchy) ending would be: *"Black argued that such a universe is metaphysically possible, which would show PII is not a necessary truth. While this shifted the consensus, defenders of Leibniz argue that such a universe violates the Principle of Sufficient Reason and is therefore impossible. The debate remains open, particularly in light of modern quantum physics."*
