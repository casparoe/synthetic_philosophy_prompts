  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Wait, under ASPA, cephalopods *are* protected. So Phase 1 isn't just "panel policy," it's legal compliance. I need to make sure I don't treat octopuses the same as crabs legally.
      *   *Correction on Bees:* The 2022 Act covers decapods and cephalopods primarily, but the evidence review included insects. However, ASPA doesn't cover bees. This makes the panel's ethical discretion crucial.
      *   *Tone Check:* Ensure I'm not sounding too academic. Keep it actionable.
      *   *The "Vibes" Argument:* I need to validate Camp 1's concern. If we protect bees, does it halt pollination research? I need to propose a threshold that allows low-harm insect work but blocks high-harm "pain" work.

  8.  **Finalizing the Verdict:**
