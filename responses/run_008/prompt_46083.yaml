prompt: |-
  I sit on the animal welfare review panel at a marine biology institute in the UK, and we have a proposal I don't think our protocols were built for. A postdoc wants to run a three-phase study: pain-learning experiments on octopuses (mild electric shocks, no analgesia), a trade-off study on shore crabs where minor injuries are inflicted to see whether they'll give up shelter to avoid further harm, and a third phase on bees that's basically the crab design scaled down. Our protocols have always covered vertebrates; cephalopods got pulled in semi-formally after the sentience legislation a few years back, but nobody has ever had to decide about crustaceans or insects, and the law is famously unhelpful here — it recognises these animals as sentient without telling us what follows for research practice.

  The panel is split three ways. One camp wants it approved as-is, on the grounds that the invertebrate evidence "isn't there yet" and we shouldn't make policy by vibes. One camp wants everything rejected pending anaesthesia protocols — which, awkwardly, nobody actually knows how to deliver to a crab. And a couple of us think the real job is to write down criteria we can reuse for future invertebrate proposals rather than just issuing a verdict on this one.

  Please draft the short written opinion I'll circulate before thursday's meeting. I need a clear bottom line — approve, approve with conditions, or reject, per phase — plus a checklist of criterias the panel can apply going forward: what evidence about a taxon's nervous system and behaviour should matter, and what kinds of procedures should trigger what kinds of protections. The memo has to genuinely engage the underlying question, which is what grounds the distribution of consciousness across animals in the first place — is it nociception, is it centralised integration of information, is it the capacity for flexible trade-offs between avoiding harm and pursuing other goods, and which of these could we even detect from the outside? Where the honest answer is "we can't tell," the memo should say what we should do while we can't tell, not paper over it.

  Two more things. Please take seriously the objection from the approve-as-is camp: precaution without limits isn't a standard, and if crabs are in scope then arguably bees are, and if bees then where does it stop — half of biology ends up needing an ethics licence. If our line just tracks "animals people feel bad about," that's vertebrate-plus-octopus chauvinism, and the memo should admit it if that's what we're doing. And write the whole thing in British English, kept short enough that the non-philosophers on the panel will actually read it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an Animal Welfare Review Panel at a UK marine biology institute.
      *   **Task:** Draft a short written opinion/memo to circulate before Thursday's meeting.
      *   **Context:** A three-phase proposal involving octopuses (pain-learning, shocks), shore crabs (trade-off, injury), and bees (scaled-down crab design).
      *   **Problem:** Existing protocols cover vertebrates and semi-formally cephalopods. Crustaceans and insects are legally recognised as sentient (UK Animal Welfare (Sentience) Act 2022) but practical research guidelines are vague.
      *   **Panel Dynamics:**
          *   Camp 1: Approve as-is (evidence isn't there, don't policy by vibes).
          *   Camp 2: Reject all pending anaesthesia (impractical for crabs).
          *   Camp 3 (User's camp): Create reusable criteria rather than just a verdict.
      *   **Requirements:**
          *   Clear bottom line per phase (Approve/Approve with Conditions/Reject).
          *   Checklist of criteria for future invertebrate proposals (nervous system, behaviour, procedures).
          *   Engage with the philosophical underpinnings (nociception vs. centralised integration vs. trade-offs).
          *   Address uncertainty ("we can't tell").
          *   Address the "slippery slope" objection (if crabs, then bees, then where does it stop? Avoid "cute animal chauvinism").
          *   British English.
          *   Concise (for non-philosophers).

  2.  **Determine the Stance (Bottom Line):**
      *   *Octopuses:* Legally protected under ASPA (Animals (Scientific Procedures) Act 1986) as cephalopods. Pain-learning with shocks and no analgesia is highly problematic given current consensus on cephalopod sentience. *Verdict: Reject or Major Revision (likely Reject in this context due to "no analgesia").* Let's go with **Reject** for Phase 1 as proposed, requiring significant refinement on harm mitigation.
      *   *Crabs:* Decapods are recognised as sentient under the 2022 Act, though ASPA doesn't fully cover them yet. The "trade-off" study involving injury is high risk. *Verdict: Approve with Conditions* (strict harm limits, anaesthesia exploration).
      *   *Bees:* Insects are recognised as sentient under the 2022 Act. However, the "slippery slope" argument is real. If the crab study is about trade-offs, bees might be too cognitively simple for the same *type* of suffering, but we can't be sure. *Verdict: Reject* pending specific evidence of capacity for suffering in this context, or **Approve with Conditions** if the harm is negligible. Given the prompt's emphasis on the "where does it stop" problem, a nuanced rejection or strict conditioning is better. Let's lean towards **Reject** for Phase 3 to set a boundary, or **Approve with Strict Conditions** if the harm is truly minimal. The prompt asks to engage with the "where does it stop" issue. A blanket rejection of bees might be scientifically inconsistent if crabs are accepted. A better approach is to approve the *framework* but reject the *specific protocol* if it assumes bees feel pain like crabs. Actually, the prompt says the bee phase is "basically the crab design scaled down." Inflicting injury on bees is ethically fraught and scientifically noisy. Let's recommend **Reject** for Phase 3 to draw a pragmatic line while the criteria are developed, acknowledging the uncertainty.
      *   *Refined Stance:* To be constructive (Camp 3), I should propose approving the *principle* of invertebrate research but rejecting the *specific protocols* until they meet new criteria.
      *   *Decision:*
          *   Phase 1 (Octopus): **Reject** (ASPA compliance issues + high welfare cost).
          *   Phase 2 (Crabs): **Approve with Conditions** (Pilot for criteria, strict harm limits).
          *   Phase 3 (Bees): **Reject** (Insufficient evidence of capacity for relevant suffering, pragmatic boundary).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the difficulty. We are in uncharted territory.
      *   **The Philosophical Core:** Briefly address *why* we protect animals. It's not just nociception (reflex); it's the capacity to suffer (affective state). The key indicator is motivational trade-offs (giving up a resource to avoid harm).
      *   **Addressing the "Slippery Slope":** Acknowledge Camp 1's point. We can't protect every nematode. We need a threshold. It shouldn't be "cute chauvinism." It must be based on nervous system complexity and behavioural flexibility.
      *   **The Criteria (The Checklist):**
          *   Neural architecture (centralisation).
          *   Behavioural evidence (trade-offs, learning).
          *   Procedure severity (injury vs. startle).
          *   Uncertainty principle (Precautionary Principle).
      *   **Recommendations per Phase:** Apply the criteria.
      *   **Closing:** Call to action for the meeting.

  4.  **Refining the Tone:**
      *   British English (e.g., "programme," "centre," "licence," "whilst").
      *   Professional but direct.
      *   Avoid jargon where possible, but don't dumb down the ethics.
      *   Keep it short (1-2 pages max).

  5.  **Drafting - Specific Considerations:**
      *   *Legislation:* Mention the Animal Welfare (Sentience) Act 2022. Mention ASPA for octopuses.
      *   *Anaesthesia:* Acknowledge Camp 2's point but note the impracticality. The solution isn't "no research until anaesthesia exists," it's "minimise harm until it does."
      *   *Uncertainty:* Explicitly state: "Where we don't know, we assume capacity for suffering but weigh against scientific merit."

  6.  **Review against Constraints:**
      *   *Clear bottom line?* Yes.
