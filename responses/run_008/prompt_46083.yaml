answer: |-
  **MEMORANDUM**

  **TO:** Animal Welfare Review Panel
  **FROM:** [Your Name]
  **DATE:** 22 October 2023
  **SUBJECT:** Decision Framework for Invertebrate Research Proposals (Phases 1–3)

  **1. Context**
  This proposal forces us to confront a gap in our governance. We operate under ASPA for vertebrates and cephalopods, and the Animal Welfare (Sentience) Act 2022 recognises decapods and insects as sentient beings. However, the Act does not prescribe research protocols. We are currently deciding policy without a map.

  My recommendation below is not merely a verdict on this application, but a proposal for a standing framework to handle future invertebrate work.

  **2. The Ethical Baseline**
  We must agree on *why* we regulate. Nociception (reflexive withdrawal) is insufficient grounds for full welfare protection; otherwise, we would regulate isolated tissue cultures. The threshold for protection is the capacity for *suffering*: a negative affective state that matters to the animal.

  The best external proxy for this is **motivational trade-off**. Can the animal modify its behaviour to avoid a noxious stimulus, even at the cost of another biological drive (e.g., feeding, shelter)? If an animal sacrifices a resource to avoid harm, it suggests the harm is 'bad' for them, not just a reflex.

  **3. Addressing the "Slippery Slope"**
  The camp arguing for approval-as-is raises a valid point: precaution without limits paralyses science. If we grant full vertebrate-level protections to every insect, we risk halting essential ecological and agricultural research. We must avoid "vertebrate-plus-octopus chauvinism"—protecting animals simply because they resemble us or elicit empathy.

  However, the alternative—waiting for definitive proof of consciousness—is ethically bankrupt. We cannot know with certainty what it is like to be a crab. Therefore, we must apply the **Precautionary Principle**: where evidence of sentience is plausible but inconclusive, we err on the side of welfare, scaled to the severity of the procedure.

  **4. Proposed Decision Criteria (The Checklist)**
  For future invertebrate proposals, the Panel should assess the following:

  *   **Neural Architecture:** Does the taxon possess a centralised nervous system capable of integrating information? (e.g., Cephalopod/Decapod ganglia vs. diffuse insect nerve nets).
  *   **Behavioural Flexibility:** Is there evidence of learning, memory, or trade-off behaviour in this specific taxon?
  *   **Procedure Severity:**
      *   *Low:* Startle responses, non-invasive observation. (Minimal oversight).
      *   *Medium:* Restraint, minor tissue sampling. (Requires justification & mitigation).
      *   *High:* Infliction of injury, noxious stimuli without escape, deprivation. (Requires strong scientific justification, anaesthesia if possible, or rejection).
  *   **Uncertainty Protocol:** Where sentience is debated (e.g., insects), high-severity procedures require a higher burden of scientific proof than low-severity ones.

  **5. Recommendations for Current Proposal**

  *   **Phase 1 (Octopuses): REJECT.**
      *   *Reasoning:* Cephalopods are protected under ASPA. Pain-learning experiments using electric shocks without analgesia or clear humane endpoints violate current licensing standards. The scientific merit does not outweigh the established welfare cost.
  *   **Phase 2 (Shore Crabs): APPROVE WITH CONDITIONS.**
      *   *Reasoning:* Decapods show strong evidence of motivational trade-offs. However, as we lack established anaesthesia protocols, we cannot demand the impossible.
      *   *Conditions:* (1) "Injury" must be strictly defined and minimised (e.g., autotomy only, no crushing); (2) A pilot study must first demonstrate that the trade-off behaviour is observable without severe harm; (3) Data must be published to contribute to the evidence base for decapod welfare.
  *   **Phase 3 (Bees): REJECT.**
      *   *Reasoning:* While insects are recognised under the 2022 Act, evidence for affective suffering (vs. complex nociception) is weaker than for decapods. Scaling a crab injury protocol to bees risks high mortality for uncertain data. This draws a necessary pragmatic line: until we have specific evidence of trade-off learning in *this* context, we should not authorise infliction of injury.

  **6. Next Steps**
  If the Panel accepts this framework, we commit to reviewing the "Crab Criteria" in 12 months. We are not solving the hard problem of consciousness today. We are acknowledging that where we cannot rule out suffering, we must minimise harm proportionately, without halting research that poses negligible risk.

  I look forward to discussing this on Thursday.
