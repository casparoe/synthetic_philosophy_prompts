answer: |-
  You have caught your friend in a genuine philosophical contradiction, and your intuition that the "unknowability" argument leaks is spot on. You aren't just splitting hairs; you've identified a flaw in the reasoning that often plagues discussions about "doing good."

  Your friend is trying to have it both ways. He wants to use **skepticism** to dismiss your tutoring (we can't know the long-term ripple effects, so don't get too attached to the visible win) but then switches to **speculative utilitarianism** to promote the policy (we can't know the long-term ripple effects, but assume they are massive, so do that instead).

  If the future is truly opaque at the scale of a state law, you cannot calculate the "expected value" of that law. If you can't calculate the expected value, the argument for scale collapses.

  So, to answer your question: Yes, there is a coherent way to reason about this, but it requires moving beyond the "visible vs. hazy" framing. The choice isn't between *knowing* the outcome and *guessing* the outcome. It is about **feedback loops**, **types of value**, and **moral agency**.

  Here are three principled frameworks to distinguish the two options without running numbers.

  ### 1. The Cybernetic Argument (Feedback Loops)
  The most practical difference between tutoring and policy work isn't the *size* of the impact, but the **tightness of the feedback loop**.

  *   **Tutoring:** You have a tight loop. You explain a concept -> the kid nods or frowns -> you adjust. You see confidence dip -> you offer encouragement -> it rises. Because the loop is tight, you can correct course in real-time. You are piloting a boat where you can see the water in front of the bow.
  *   **Policy:** You have a loose (or broken) loop. You push a measure -> it passes/fails -> funding is allocated/blocked -> specialists are hired/not hired -> curriculum changes -> kids learn/don't learn. At every single one of those arrows, value can leak. Worse, you often won't know *where* it leaked until years later, if ever. You are firing a missile at a coordinate you can't verify.

  **The Principle:** Under conditions of radical uncertainty (which your friend admits exist for the policy), rational actors should prefer systems with **high corrigibility**. If you are wrong about how to help the kid, you find out next week. If you are wrong about how the policy helps the state, you might find out in a decade, after the money is spent.

  Choosing the tight loop isn't about "seeing the result"; it's about maintaining the **capacity to steer**.

  ### 2. Intrinsic vs. Instrumental Value
  Your friend is treating the kid's education purely as an **instrumental good**. The value of tutoring, in his view, is what the kid *does later* (college, career, societal contribution). Since that future is unknowable, he thinks the value is shaky.

  But you are also providing an **intrinsic good**.

  *   **The Relationship:** A 15-year-old having a consistent, non-transactional adult in their corner for six years is a good thing *in the moment*, regardless of whether that kid becomes a doctor or a dropout. The dignity of being cared for is a completed good. It doesn't need a future payoff to be valid.
  *   **The Policy:** A state law is almost purely instrumental. It has no warmth. Its value is entirely dependent on downstream consequences (kids reading better -> better lives). If the downstream consequences fail to materialize (e.g., specialists are hired but are ineffective), the act of passing the law had zero moral value.

  **The Principle:** If you believe that human connection and dignity have value *now*, not just as an investment in future productivity, the tutoring wins. The policy only makes sense if you believe the only thing that matters is aggregate statistical outcomes in the distant future.

  ### 3. The Problem of Negation
  There is a difference in how easily the "good" can be undone.

  *   **Tutoring:** Once you have helped a 15-year-old learn to read or believe in themselves, that cannot be easily repealed. Even if the school system fails them later, the neural pathways and the self-concept you helped build remain. It is "sticky."
  *   **Policy:** Legislation is fragile. A ballot measure passes today; the budget is cut tomorrow. A superintendent changes the curriculum the next year. The specialists are laid off in a recession. Systemic gains are constantly at risk of being zeroed out by political shifts.

  **The Principle:** In an unstable world, **robustness** matters. A localized, interpersonal intervention is often more robust to systemic shock than a systemic intervention is to political shock.

  ### So, is your friend's instinct right?
  Your friend's instinct relies on a specific ethical framework called **Expected Value Maximization** (often associated with Effective Altruism). The logic is: *Impact = Scale x Probability.*

  He is assuming the Scale is huge (10,000 kids) and ignoring the Probability (because he admits it's unknowable).
  You are pointing out that if Probability is unknowable, the equation breaks.

  However, there is one area where your friend has a point, and you should weigh it: **Opportunity Cost.**
  If the policy measure has even a *modest* chance of success, the sheer magnitude of the upside *could* outweigh the tutoring, simply because 10,000 kids is so much larger than 1. This is the "Pascal's Wager" of charity.

  But here is the counter-move to that logic: **Comparative Advantage.**
  *   **Policy:** There are thousands of people who can donate money or make calls for a ballot measure. Your specific contribution is likely marginal. You are replaceable in that effort.
  *   **Tutoring:** There is exactly one person who has spent six years with this kid. You are **non-fungible**. If you quit, that specific relationship ends. No one can step in and replicate six years of trust.

  ### The Verdict
  You asked if there is a coherent way to reason about this, or if it comes down to a vibe.

  It is not a vibe. It comes down to **epistemology** (how we know what we know) and **ontology** (what kind of things we think are valuable).

  *   **Choose the Policy if:** You believe that statistical aggregation is the only moral metric that matters, you are comfortable acting on low-probability high-impact bets, and you view your time as a resource to be allocated efficiently regardless of personal connection.
  *   **Choose the Tutoring if:** You believe that relationships have intrinsic value, you prefer high-agency environments where you can correct mistakes, and you value robustness over scale.

  Your friend is trying to shame you for choosing the "small" thing by claiming the "big" thing is more rational. But by admitting the big thing is unknowable, he has surrendered the claim to rationality.

  You aren't hiding from the bigger impact because you're afraid of the unknown; you are choosing a **different category of good** that he is failing to account for. You are building a life, not just an outcome. That is a coherent, defensible position.
