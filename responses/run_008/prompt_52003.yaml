  3. A husband who would forbid anything his wife might want to do, so she never asks and only ever does what he'd approve of -- he has literally never interfered with her: I want to say she's unfree, badly.
  4. Wheelchair user in a town where the cinema has stairs and no ramp, and nobody is stopping them from going: unfree to enter, I'd say, even though no person or rule is responsible.
  5. Lifelong smoker who says he can't quit and at this point genuinely can't, with zero external barriers: mostly I want to say he IS free to quit, it's just really hard.
  6. My feed only shows me stuff that keeps me doomscrolling, no one at the company intends any particular choice of mine: free? unfree? no idea, that's why I'm asking.

