  # JOINT STATEMENT ON ELECTORAL SYSTEM DESIGN

  ### I. AGREED CLAIMS

  1.  **Purpose of Elections:** We agree that democratic elections serve two distinct but overlapping functions: (a) to confer legitimacy on a government by reflecting the aggregate will of the electorate, and (b) to establish a mechanism for accountability whereby voters can remove underperforming officials. We disagree on the relative priority of these functions, but agree that a system failing completely at either is unacceptable.
  2.  **Empirical vs. Normative:** We acknowledge that our dispute is partly empirical (e.g., "Does PR lead to more unstable governments?") and partly normative (e.g., "Is stability more valuable than vote-seat accuracy?"). We agree to treat empirical claims as falsifiable and normative claims as value judgments requiring justification, not fact-checking.
  3.  **Charitable System Descriptions:**
      *   **PR Side Concession:** We acknowledge that Single-Member Plurality (SMP) systems, when well-implemented, provide a clear line of accountability between a constituent and a specific representative, and tend to produce single-party governments capable of decisive action without reliance on post-election backroom deals.
      *   **District Side Concession:** We acknowledge that Proportional Representation (PR) systems, when well-implemented, minimize "wasted votes," ensure that geographically dispersed minorities gain legislative voice, and force policy compromise through coalition building rather than winner-take-all exclusion.
  4.  **Implementation Matters:** We agree that "PR" and "SMP" are families of systems, not monoliths. Outcomes depend heavily on specific design choices (e.g., district magnitude, legal thresholds, open vs. closed lists, boundary commission independence). We will not critique a system based on its worst real-world examples (e.g., Weimar Germany for PR; gerrymandered U.S. states for SMP) but on its theoretical incentives and best-practice implementations.
  5.  **The Semantic Bottom:** We recognize that a portion of our disagreement is verbal, centering on the definition of "representation." For the PR side, representation is a *statistical property of the legislature* (mirror principle). For the District side, representation is a *relational property between a voter and an agent* (agency principle). We agree that the 34% hypothetical (see Table Row 2) exposes this definitional divergence, but we maintain it also has substantive consequences for voter behavior and governance.

  ### II. DISAGREEMENTS TABLE

  | Disagreement Topic | Wording the PR Side Would Sign | Wording the District Side Would Sign | Concrete Case / Evidence & Pre-Registered Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. The Function of the Vote**<br>*(Is a vote a national tally or a local hire?)* | A vote is primarily an expression of policy preference that should contribute to the national partisan composition of the legislature, regardless of where the voter lives. | A vote is primarily a hiring decision for a local agent who will advocate for a specific geographic community's interests in parliament. | **Case:** Voter satisfaction surveys in MMP vs. SMP systems regarding "feeling represented."<br>**PR Prediction:** Voters in PR systems will report higher satisfaction with *policy alignment* even if they don't know their MP's name.<br>**District Prediction:** Voters in SMP systems will report higher satisfaction with *casework/access* even if their party loses nationally. |
  | **2. Seat Entitlement & The 34% Hypothetical**<br>*(Does 34% of the vote deserve 34% of the seats?)* | In a scenario where Party A gets 34% uniformly nationwide and loses every district to two rivals with 33%, the system is **unfair** because it converts 34% of public support into 0% of legislative power, effectively disenfranchising that bloc. | In a scenario where Party A gets 34% uniformly nationwide and loses every district, the outcome is **fair** because elections are contests for local seats; Party A failed to secure a plurality in any specific community and thus earns no seats. | **Case:** The "34% Uniform Distribution" hypothetical.<br>**PR Prediction:** Sustained exclusion of a 34% bloc will lead to systemic alienation, lower turnout, or anti-system radicalization among that bloc.<br>**District Prediction:** Sustained exclusion will force the 34% bloc to moderate their platform or merge with rivals to build local majorities, stabilizing the party system. |
  | **3. Party System Dynamics**<br>*(Moderation via coalition vs. moderation via competition)* | Two-party competition under SMP suppresses preferences held by voters outside the two major parties, leading to policy blind spots and forced binary choices that do not reflect the electorate's nuance. | Multi-party competition under PR hands disproportionate kingmaker power to small fringe parties, allowing them to extract policy concessions far exceeding their vote share and destabilizing governance. | **Case:** Legislative output in consensus democracies (e.g., Netherlands) vs. majoritarian democracies (e.g., UK/Canada).<br>**PR Prediction:** PR systems will produce policy that is closer to the *median voter's* ideal point over time due to coalition compromise.<br>**District Prediction:** SMP systems will produce policy that is more *decisive and reversible*, allowing voters to punish failure more effectively than in coalition governments. |
  | **4. The Nature of "Fairness"**<br>*(Verbal vs. Substantive)* | The disagreement bottoms out in a substantive claim: A legislature that looks nothing like the electorate lacks the legitimacy to rule, making the definition of fairness inherently proportional. | The disagreement bottoms out in a substantive claim: A legislature that cannot be thrown out as a whole lacks accountability, making the definition of fairness inherently about the ability to form and remove a government. | **Case:** Constitutional crises or peaceful transfers of power.<br>**PR Prediction:** Legitimacy crises will correlate with high vote-seat disproportionality.<br>**District Prediction:** Legitimacy crises will correlate with coalition instability or inability to pass budgets. |
