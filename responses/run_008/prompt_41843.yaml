      *   *Plurality Rule* is the easiest to demonstrate this with intuitively.
      *   *Profile Design:* We need $C$ to be a "spoiler."
          *   Scenario 1 (All 3): $A$ wins.
          *   Scenario 2 (Without $C$): $B$ wins (because $C$'s voters prefer $B$ over $A$).
          *   Crucially: $C$ must *lose* in Scenario 1.
          *   Crucially: Everyone agrees $C$ is worse than the winner? No, the prompt says "an option everyone agrees is worse." Actually, strict Pareto dominance isn't necessary for the spoiler effect, but the prompt says "an option everyone agrees is worse can change which of the better options wins." This implies $C$ is a Condorcet Loser or at least Pareto dominated. Let's aim for $C$ being a Condorcet Loser to make the "irrelevant" part stick harder.
          *   Wait, if $C$ is Pareto dominated, no one ranks it first. If no one ranks it first in Plurality, it gets 0 votes and can't spoil.
          *   *Correction:* The prompt says "an option everyone agrees is worse." In Social Choice, "worse" usually means Pareto dominated. But if $C$ is Pareto dominated, no one puts it top. In Plurality, it gets no votes. It can't spoil.
          *   *Re-reading the prompt:* "an option everyone agrees is worse can change which of the better options wins, just by sitting on the ballot."
          *   *Interpretation:* The user might mean "an option that *loses* (is socially worse)" rather than "Pareto dominated." If $C$ is a Condorcet Loser, that fits "everyone agrees is worse" in a pairwise sense, even if some rank it first (due to cyclical preferences or specific distributions).
          *   *Better Interpretation:* The classic "Spoiler Effect" (Nader 2000 style). $C$ draws votes from $B$, allowing $A$ to win. If $C$ is removed, $B$ beats $A$.
          *   *Profile:*
              *   Group 1: $A > B > C$
              *   Group 2: $B > C > A$
              *   Group 3: $C > B > A$
              *   If we use Plurality:
                  *   With $C$: $A$ gets Group 1. $B$ gets Group 2. $C$ gets Group 3. If Group 1 is largest, $A$ wins.
                  *   Without $C$: Group 3 shifts to $B$ (since $B > A$). Now $B$ has Group 2 + Group 3. $B$ beats $A$.
                  *   Does everyone agree $C$ is worse? Group 3 thinks $C$ is best. So not Pareto dominated.
                  *   *Prompt Constraint Check:* "an option everyone agrees is worse." This is tricky. If *everyone* agrees $C$ is worse than $A$ and $B$ (Pareto), $C$ gets 0 first place votes in Plurality.
