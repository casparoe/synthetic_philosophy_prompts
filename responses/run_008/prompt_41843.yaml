answer: |-
  This is a fantastic idea. Running an experiential demo is the best way to cement Arrow's conditions, especially IIA, which students often find abstract compared to Condorcet cycles.

  However, there is one mathematical trap in your prompt I need to address before we start: **You cannot have an option that *everyone* agrees is worse (Pareto dominated) act as a spoiler under Plurality voting.** If everyone ranks $C$ last, $C$ gets zero first-place votes, cannot win, and cannot siphon votes.

  To make the game work, $C$ needs to be a **Condorcet Loser** (beaten by everyone in pairwise comparisons) but still have a small bloc of true believers who rank it first. This captures the *spirit* of "socially irrelevant" without breaking the math of the voting rule. I have designed the profile below to reflect this.

  Here is your complete Facilitator's Guide.

  ---

  # Seminar Plan: "The Spoiler in the Room"
  **Time:** 75 Minutes
  **Students:** 15 (scalable to 10)
  **Goal:** Experience an IIA violation (Spoiler Effect) before naming it.
  **Stakes:** The group decides the format for the *final 30 minutes of the next seminar* (Week 10).

  ## 1. Materials & Prep
  *   **Preference Cards (15 total):** Print and cut these. Do not let students see others' cards.
      *   **Type A (6 cards):** 1. Discussion  2. Presentation  3. Free Reading
      *   **Type B (5 cards):** 1. Presentation  2. Free Reading  3. Discussion
      *   **Type C (4 cards):** 1. Free Reading  2. Presentation  3. Discussion
      *   *(Note: Map A=Discussion, B=Presentation, C=Free Reading for the logic below)*
  *   **Ballot Slips:** Small scraps of paper (2 per student).
  *   **Whiteboard:** Divide into three sections: "Round 1," "Round 2," "Theory."
  *   **Box/Bowl:** To collect ballots.

  ## 2. The Timeline (75 Minutes)

  ### Phase 1: Setup & Stakes (0:00 – 0:10)
  *   **Hook:** "Today isn't a lecture. We have a real administrative decision to make for our next session. We have 30 minutes left in Week 10. How should we use it?"
  *   **Options:** Write them on the board.
      1.  **Discussion:** Guided group debate on a new paper.
      2.  **Presentation:** One student presents a topic; others listen.
      3.  **Free Reading:** Quiet time in the downstairs lounge.
  *   **The Rule:** "We will use a simple vote. Everyone gets one vote for their top choice. Most votes wins. Ties broken by coin flip." (You are establishing **Plurality Rule** without naming it yet).
  *   **The Constraint:** "I am handing out preference cards. These represent your true feelings. For this experiment, I need you to vote **sincerely** according to the card. Do not strategize yet. We need to see what the system does with honest inputs." (This mitigates strategic voting).

  ### Phase 2: Round 1 — The Full Ballot (0:10 – 0:25)
  *   **Distribution:** Hand out the cards randomly (6 Type A, 5 Type B, 4 Type C). Tell them to keep cards hidden.
  *   **Voting:** "Look at your #1 choice. Write it on a ballot slip. Put it in the box."
  *   **Tally:** Count publicly on the whiteboard.
      *   Discussion (A): 6
      *   Presentation (B): 5
      *   Free Reading (C): 4
  *   **Declaration:** "Discussion wins. That's the plan."
  *   **The Check:** Ask: "Does anyone think Free Reading (C) should have won?" (Likely no). "Does anyone think Free Reading is better than Discussion?" (Type C students will say yes, but they are the minority).
  *   **Crucial Question:** "Look at the Type B and Type C cards. In a head-to-head between Discussion and Presentation, who wins?"
      *   Guide them to see: B prefers Presentation. C prefers Presentation. A prefers Discussion.
      *   Math: Presentation (9) vs Discussion (6).
      *   **Point:** "So the majority actually prefers Presentation over Discussion. But Discussion won."

  ### Phase 3: Round 2 — The "Administrative Error" (0:25 – 0:40)
  *   **The Twist:** "Okay, hold on. I just checked with the department admin. It turns out the downstairs lounge (Free Reading) is under renovation. It's not available. We have to strike Option C from the ballot."
  *   **Action:** Collect Round 1 ballots. Hand out fresh slips.
  *   **Instruction:** "Vote again. Same preference cards. Just pick your favorite of the *remaining* two."
  *   **Tally:**
      *   Type A (6 votes): Still vote Discussion.
      *   Type B (5 votes): Still vote Presentation.
      *   Type C (4 votes): Their #1 is gone. Their #2 is Presentation. They vote Presentation.
      *   **New Count:** Discussion (6) vs. Presentation (9).
  *   **Declaration:** "Presentation wins."
  *   **The Silence:** Let the result sit for a moment. The winner flipped, but no one changed their mind about A vs. B. The only thing that changed was the removal of a losing option.

  ### Phase 4: The Debrief (0:40 – 1:15)
  *This is where you earn your grade. Do not rush this.*

  **Step 1: Phenomenology (5 mins)**
  *   Ask: "What just happened? Did anyone change their preference between Discussion and Presentation?" (No).
  *   Ask: "Did the group preference between Discussion and Presentation change?" (Yes).
  *   Ask: "What caused the change?" (The presence/absence of Free Reading).
  *   Ask: "Was Free Reading a viable winner?" (No, it lost both times).

  **Step 2: Naming the Beast (10 mins)**
  *   Now you introduce the term: **Independence of Irrelevant Alternatives (IIA).**
  *   **Definition:** The social ranking between $X$ and $Y$ should depend *only* on individual rankings between $X$ and $Y$. It should not matter if $Z$ is on the ballot.
  *   **Map it:**
      *   $X$ = Discussion, $Y$ = Presentation, $Z$ = Free Reading.
      *   In Round 1, Society said $X \succ Y$.
      *   In Round 2, Society said $Y \succ X$.
      *   Individual rankings of $X$ vs $Y$ never changed.
      *   Therefore, Plurality Voting violates IIA.

  **Step 3: Distinguishing from Cycling (10 mins)**
  *   *Student Objection:* "Isn't this just Condorcet Cycling?"
  *   *Your Answer:* "No. In Cycling (Week 3), there is *no* stable winner. $A$ beats $B$, $B$ beats $C$, $C$ beats $A$. It's a rock-paper-scissors loop."
  *   *Contrast:* "Here, we had a clear Condorcet Winner (Presentation beat everything pairwise). The system *found* a winner, but it was the *wrong* one because of the spoiler. Cycling is 'No Decision.' This is 'Bad Decision.'"

  **Step 4: The Arrow Leap (10 mins)**
  *   *Critical Nuance:* "You might think, 'Okay, don't use Plurality. Use Borda or Rank Pairs.'"
  *   **The Hard Truth:** "Arrow's Theorem (Week 9) says that's impossible. If you want a rule that is:
      1.  Unrestricted Domain (works for any preferences),
      2.  Pareto Efficient (if everyone likes $X$ better, $X$ wins),
      3.  Non-Dictatorial (no single boss)...
      ...then you **must** violate IIA somewhere."
  *   **The Game's Limit:** "This game showed Plurality fails IIA on *this* profile. Arrow proves *every* rule fails IIA on *some* profile. I can't simulate 'every rule' today, but trust the math: if you fix the Spoiler Effect, you break something else (like Monotonicity or Pareto)."

  ---

  ## 3. Troubleshooting & Predictable Failures

  ### 1. Strategic Voting (The "Nader" Problem)
  *   **Risk:** In Round 1, the 4 students with Card C realize C can't win. They vote for B to prevent A from winning.
  *   **Result:** B wins Round 1. B wins Round 2. No flip. The demo fails.
  *   **Fix:**
      *   **Pre-emption:** In the intro, say: "We are testing the *voting machine*, not your poker skills. For Round 1, I need mechanical sincerity. Vote exactly what is on the card."
      *   **Pivot:** If they *do* strategize and the flip doesn't happen, **do not panic.** Pivot the debrief: "The system was so unstable it forced you to lie. This is the **Gibbard-Satterthwaite Theorem**. Plurality violates IIA so badly it incentivizes manipulation." (This is actually a deeper lesson, though it sidesteps IIA).

  ### 2. The "Read-Ahead" Student
  *   **Risk:** Someone shouts "It's IIA!" in minute 15.
  *   **Fix:**
      *   **Pre-Seminar:** Email the group: "Please don't spoiler the activity for yourself or others. The value is in the experience."
      *   **In-Room:** If they shout it, say: "Correct terminology. But do you *feel* why it's problematic? Let's finish the vote to see the magnitude of the shift."
      *   **Recruit Them:** Pull them aside during the tally. "Hey, you know the theory. Help me tally the pairwise comparisons on the board while I run Round 2."

  ### 3. Low Attendance (10 Students)
  *   **Adjustment:** Scale the blocs proportionally.
      *   Type A: 4 students
      *   Type B: 3 students
      *   Type C: 3 students
      *   **Round 1:** A(4), B(3), C(3). **A Wins.** (Tie between B/C doesn't matter, A is clear winner).
      *   **Round 2:** A(4), B(3+3=6). **B Wins.**
      *   *Note:* Ensure the Type A bloc remains the largest plurality, but less than 50%.

  ### 4. The "Everyone Agrees C is Worse" Issue
  *   **Risk:** Students notice Type C students actually *like* Option C.
  *   **Fix:** In the debrief, clarify: "In this specific profile, C is a **Condorcet Loser** (beaten by everyone pairwise). It is 'socially worse' even if a minority loves it. Arrow's IIA condition is strict: *any* change in the set, even removing a loser, shouldn't flip the winners."

  ---

  ## 4. Extension: The "Registrar" Variant (If you have time/energy)
  If you want to highlight **Agenda Control** (which pairs well with IIA):
  *   **Role:** Pick one student to be the "Registrar."
  *   **Power:** They decide which options go on the ballot.
  *   **Secret Info:** Give the Registrar a private note: "You prefer Presentation. You know the preference profile of the room (show them the counts). Your goal is to ensure Presentation wins."
  *   **Execution:** The Registrar will realize they must *remove* Free Reading to let Presentation win, or *keep* Free Reading if they want Discussion to lose (depending on the setup).
  *   **Lesson:** This shows that violating IIA opens the door for **Manipulation of the Agenda**. If IIA held, the Registrar's choices wouldn't matter. Since it doesn't, the Registrar has dictatorial power over the outcome without changing a single voter's mind.

  ## 5. Closing Script (For the Debrief)
  "I want you to leave with one thought. We spent weeks on Condorcet Cycles thinking the problem was that 'majorities are inconsistent.' Today showed the problem is deeper. Even when majorities *are* consistent (Presentation beats everyone), our counting methods can still lie to us. Arrow's Theorem isn't just about cycles; it's a warning that **perfect fairness is mathematically impossible.** You have to choose which flaw you can live with. Next week, we discuss which flaw is the least dangerous."

  ---

  ### Final Checklist for You
  1.  **Print Cards:** Ensure the 6/5/4 split is exact.
  2.  **Test the Math:** Double-check the counts on a scrap paper before walking in.
  3.  **Manage the Stakes:** Make sure the "Decision" is actually implemented. If you say you're deciding Week 10, you must run Week 10 that way. If you can't, make the stake "What snack we order" or "Which 10 minutes we cut from today."
  4.  **Confidence:** When they ask "So what rule *does* work?", the answer is "None perfectly." Be comfortable with that negative result. That's the point of the course.

  Good luck. This is the kind of seminar students remember five years later.
