                          *   Total: A=6, B=9. **Winner: B.**
                      *   *Result:* $C$ is on the ballot, $A$ wins. $C$ is removed, $B$ wins. $C$ loses pairwise to everyone (Condorcet Loser). This fits the "option everyone agrees is worse" (in a pairwise majority sense) changing the outcome.
                      *   *Wait, does everyone agree C is worse?* No, Bloc 3 prefers C.
                      *   *Refining the Prompt's "Everyone Agrees":* If the user insists on "everyone agrees is worse," they mean Pareto. But Pareto dominated options can't spoil in Plurality. I must address this in the design notes. I will aim for the Condorcet Loser scenario (socially worse) because it's the only way to make the game work with Plurality. I will explicitly clarify this distinction in the debrief. *Self-Correction:* Actually, if I use a different voting rule, like Borda, a Pareto dominated candidate *could* theoretically affect scores, but it's complex. Let's stick to Plurality because it's intuitive. I will advise the user to phrase the "everyone agrees" carefully (i.e., "majority thinks C is worse than the winner").
                      *   *Actually, looking closer at the prompt:* "an option everyone agrees is worse can change which of the better options wins." This is technically impossible under Plurality if "everyone agrees" means Pareto. I need to gently correct this in the design while fulfilling the spirit (the "Spoiler Effect"). I will design the profile so $C$ is the *Condorcet Loser*, which is the closest meaningful proxy for "socially irrelevant."

  3.  **Timeline & Flow:**
      *   0-10: Intro & Stakes (Set the decision).
      *   10-25: Round 1 (Full Ballot).
      *   25-35: The Twist (Remove C).
      *   35-50: Round 2 (Restricted Ballot).
      *   50-75: Debrief (The Meat).

  4.  **Materials:**
      *   Preference Cards (pre-printed).
      *   Ballots (slips of paper).
      *   Whiteboard (for tallying).
      *   Incentive (The "Real Stake").

  5.  **Addressing Specific Concerns:**
      *   *Strategic Voting:* In Round 1, Bloc 3 ($C > B > A$) might realize $C$ can't win and vote $B$ to stop $A$. This ruins the demo.
          *   *Fix:* Emphasize "Vote your card exactly." Frame it as a "truth-telling" experiment first. Or, lean into it: if they strategize, the spoiler effect disappears, which teaches *why* we need strategy-proofness (Gibbard-Satterthwaite). But for IIA, we need sincere voting. I'll add a script instruction to enforce sincere voting for the sake of the experiment.
      *   *Read-Ahead Student:* Someone shouts "It's IIA!"
          *   *Fix:* Pre-briefing. Ask them to hold theory until the end. Or make the stakes about the *specific decision* first.
      *   *Arrow's Theorem Nuance:* The game shows IIA failure in *Plurality*. Arrow says *all* rules fail something. I need to make sure they don't think "Just don't use Plurality."
      *   *Cycling Confusion:* Distinguish "No Winner" (Cycling) from "Wrong Winner" (IIA/Spoiler).

  6.  **Drafting the Plan:**

      *   **Title:** "The Spoiler in the Room."
      *   **Stakes:** Decide the format for the *next* seminar (or the last 20 mins of *this* one if time permits, but prompt says "future session"). Let's go with "Topic for Week 12."
      *   **Profile:** 6 (A>B>C), 5 (B>C>A), 4 (C>B>A).
          *   Wait, if Bloc 3 is 4 votes, and Bloc 2 is 5 votes.
          *   Round 1: A=6, B=5, C=4. A wins.
          *   Round 2 (No C): A=6, B=5+4=9. B wins.
          *   This works perfectly.
      *   **Debrief Structure:**
          1.  What happened? (C changed A to B).
          2.  Was C relevant? (C lost both times).
          3.  Name it (IIA).
          4.  Generalize (Arrow).
          5.  Distinguish from Cycling.

  7.  **Addressing the "Everyone Agrees" Constraint:**
      *   I need to be honest with the user. If *everyone* ranks $C$ last (Pareto), $C$ gets 0 Plurality votes. $C$ cannot spoil.
      *   I will suggest a profile where $C$ is a *Condorcet Loser* (beaten by everyone pairwise) but still has a fan club (first place votes). This captures the "socially irrelevant" vibe without breaking the math of Plurality. I will explain this trade-off in the notes.

  8.  **Contingencies:**
      *   *Low Attendance (10 students):* Scale numbers (4, 3, 3).
      *   *Strategic Voting:* If they strategize, pivot the debrief to Gibbard-Satterthwaite.
      *   *Spoiler Student:* Give them a role (Data Recorder).

  9.  **Refining the Debrief (Arrow Connection):**
      *   Crucial point: This game shows Plurality violates IIA. It does *not* prove Arrow's Theorem.
      *   Arrow says: If you want Unrestricted Domain + Pareto + Non-Dictatorship, you *must* violate IIA (or have a dictator).
      *   So, even if we switch to Borda or Rank Pairs, something else breaks. I need a slide/whiteboard summary of this.

