prompt: |-
  hey, so quick context: I'm an undergrad taking a course on social choice theory this semester (we're at week 9 or so, just did Arrow properly after spending weeks 3-4 on majority cycling and Condorcet), and I somehow volunteered to run one session of our department's undergrad discussion seminar. It's about 15 students, 75 minutes, and I'd rather not lecture at them again — I want to run a game where they run into the problem before anyone names it.

  here's the thing I want them to feel: not the cycling stuff (they've seen the Condorcet wheel spin already, it doesn't shock anyone anymore), but the other failure mode that people always conflate with it — that an option everyone agrees is worse can change which of the better options wins, just by sitting on the ballot. basically the bite of independence of irrelevant alternatives, except they shouldn't hear the phrase until the debrief.

  the scenario I half-imagined: the seminar has to actually decide something real for the last half hour of a future session — say, which of three texts we discuss next week, or whether the last 30 min is discussion, a student presentation, or free reading in the nice room downstairs. the stakes are trivial but real, which matters, I think — payoffs without money. then assign everyone a preference card putting them into blocs (like 6 with ranking A > B > C, 5 with B > C > A, 4 with C > B > A — tune the numbers so it works), run a ballot with all three options, then "discover" that C, the option that loses pairwise to both others, siphons exactly enough first-place votes to flip the winner between A and B, and run a second ballot with C struck. they should physically feel that a thing nobody wanted decided the outcome.

  design this properly for me: full rules, materials (nothing expensive, we have a whiteboard and can print cards), the bloc sizes and profile that makes the flip unambiguous, a timeline that fits 75 minutes with a debrief, and the debrief itself — mapping specific moments in the game onto specific parts of the theorem. two things I especially want the debrief to get right: (1) explaining that what they saw is a failure of IIA under plurality specifically, and that Arrow's point is that *no* rule with unrestricted domain, Pareto, and non-dictatorship dodges this *somewhere* — a single profile can't be the theorem, so I have to supply the "for all rules, all profiles" part myself, and I want to be honest about that being the one thing the game cannot reproduce; and (2) keeping them from sliding back into "oh it's just cycling again."

  also tell me honestly what will predictably go wrong the first time I run it — I'm worried about a couple things: people voting strategically instead of using their cards (is that a bug, or does it accidentally teach them something about manipulation and agenda control?), and someone who's read ahead blurting out the point in minute five. and if there's a smaller-group variant or an extension (I was toying with secretly making one student the "registrar" who controls what's on the ballot at all) that fits if only 10 show up, sketch that too.
