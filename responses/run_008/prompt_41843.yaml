                  *   *Actually:* The prompt says "an option everyone agrees is worse... just by sitting on the ballot." This sounds like the user might be slightly conflating Pareto efficiency with IIA, OR they mean "socially worse" (i.e., loses pairwise).
                  *   *Decision:* I need to design a profile where $C$ is a *Condorcet Loser* (loses pairwise to both $A$ and $B$) but still acts as a spoiler under Plurality. This satisfies the "socially worse" intuition without requiring Pareto dominance (which makes spoiling impossible in Plurality).
                  *   *Wait, can a Condorcet Loser spoil in Plurality?* Yes. If $C$ takes votes from $B$, allowing $A$ to win, even if $B$ beats $A$ and $C$ pairwise.
                  *   *Profile Construction:*
                      *   Total: 15 students.
                      *   Bloc 1 (A-lovers): 6 votes ($A > B > C$)
