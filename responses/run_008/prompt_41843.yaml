  *(Self-Correction during drafting)*: I need to make sure the "Real Stake" doesn't backfire. If they hate the result, they might resent the exercise. Keep the options low-stakes but distinct. "Discussion," "Presentation," "Free Reading" is good.
  Also, I need to make sure the "Everyone agrees C is worse" point is handled delicately. I will advise the user to say "An option the *majority* thinks is worse" or clarify that in the debrief. Actually, the prompt says "an option everyone agrees is worse." I will explicitly tell the user: "You can't do this with Pareto dominance in Plurality. Here is the workaround."

