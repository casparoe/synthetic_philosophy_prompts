      *   **User:** Law student taking a metaphysics elective. Smart, observant, noticing a tension between legal practice and metaphysical theory.
      *   **Task:** Answer as a professional metaphysician who *also* knows criminal law. Think carefully, brainstorm readings, evaluate them, don't just lock into one view immediately.
      *   **Core Issue:** The tension between criminal law's treatment of personal identity over time (strict identity for liability vs. mitigated identity for sentencing/limitations) and metaphysical theories of persistence (Endurantism vs. Perdurantism/Four-Dimensionalism).
      *   **Specific Questions to Address:**
          1.  What view of identity does punishing a 90-year-old for a 22-year-old's crime presuppose? (Strict identity vs. "same worm")
          2.  Is the "punishing one stage for another's deed" objection valid against perdurantism in this context?
          3.  Is the practice internally consistent (fraud vs. murder limitations, mitigation)? Does it imply degrees of identity?
          4.  Distinguish what *requires* which metaphysics vs. what is *compatible* with both.
          5.  If perdurantism won, what would change in courtroom practice?

  2.  **Deconstruct the Legal Practice:**
