      *   *Statutes of Limitations:* Acknowledges time degrades evidence and perhaps moral connection, but explicitly *not* for murder.
      *   *Sentencing/Mitigation:* "Rehabilitation," "changed man." This suggests psychological continuity matters more than strict biological identity for *severity*, even if liability remains.
      *   *Insanity/Competency:* If the mental connection is broken (dementia), trial might be barred. This hints at a psychological continuity threshold.

  3.  **Deconstruct the Metaphysics:**
      *   *Endurantism (3D):* Objects are wholly present at each time. $Person_{t1}$ is strictly identical to $Person_{t2}$.
      *   *Perdurantism (4D):* Objects are space-time worms. $Person_{t1}$ and $Person_{t2}$ are temporal parts (stages) of the same worm. They are not strictly identical, but related by gen-identity (causal/psychological continuity).
      *   *Psychological Continuity Theory (Lockean):* Identity consists in memory/character connection.
