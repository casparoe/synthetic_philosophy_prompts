      *   *Correction:* Be careful with "degrees of identity." Metaphysicians hate that. It's degrees of *relatedness*, not identity. Make sure to distinguish.
      *   *Tone Check:* Keep it academic but accessible. Use legal terms correctly (*mens rea*, *statutes of limitations*, *mitigation*).
      *   *Key Insight:* The law cares about the *body* (Animalism) for jurisdiction, but the *mind* (Lockean) for culpability. This hybrid view bridges the metaphysical gap.

