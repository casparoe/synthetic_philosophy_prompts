          *   *Nuance:* The law cares about *imputation*, not just ontology.
      *   **Section 2: The "Vicarious Punishment" Objection to Perdurantism.**
          *   This is the crux. If Stage B didn't pull the trigger, why punish Stage B?
          *   *Counter:* The *worm* is the moral agent. The worm extended through time. Punishing the current stage is the only way to punish the worm *now*.
          *   *Analogy:* Fining a corporation. The CEO today pays for the act of the CEO yesterday. It's the same corporate entity.
          *   *Psychological Continuity:* If the connection is strong (memory, character), the desert transfers. If weak (amnesia, dementia), it fades.
      *   **Section 3: Internal Consistency (Limitations & Mitigation).**
