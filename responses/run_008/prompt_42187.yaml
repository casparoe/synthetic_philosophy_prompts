          *   #1 says Mind = Computation (Materialism/Functionalism). Identity should be determined by physical/functional facts.
          *   #5 says there is a *further fact* beyond physical/psychological description.
          *   *Conflict:* If #1 is true, everything about "me" is physical/functional. If there's a fact about identity that isn't captured by physical/functional description, then #1 is false (or at least incomplete). #5 is essentially asserting a "Cartesian Ego" or a "Soul" without calling it that. It contradicts the spirit of Materialism.
