          *   *Nuance:* Many people hold this view (Continuity of Consciousness matters). It's not logically *impossible* to hold both, but it requires a specific theory of identity (Psychological Continuity + Spatiotemporal Continuity). However, combined with #4, it gets shaky. #4 says "what matters is psychological stuff continuing." #3 says "Psychological stuff continues in the copy, but I still die."
