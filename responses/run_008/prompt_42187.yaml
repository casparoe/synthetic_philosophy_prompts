      *   **Rank 1 (Critical): #1 vs. #5.** This is the foundational metaphysical clash. You can't be a strict materialist (#1) and believe in a "further fact" beyond physical description (#5). #5 is basically dualism in disguise.
      *   **Rank 2 (High): #4 vs. #3.** #4 defines survival as psychological continuity. #3 denies survival despite psychological continuity. This makes #4 false or #3 irrational under #4's definition.
