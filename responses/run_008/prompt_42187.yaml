prompt: |-
  so I'm a software engineer, zero philosophy background, but I got into this stuff after an argument with my brother in law about cryonics at thanksgiving, and I've written down where I've ended up. something about the whole list feels off but I can't put my finger on what. can you go through it and tell me which parts are actually in tension, which only look like they are, and for each real one what the cheapest fix would be? rank them by severity please, don't just list everything as equally bad.

  here's roughly where I stand:

  1. I'm a materialist. no soul, no ghost in the machine. the mind is just what the brain computes, and in principle the same computation could run on something else.

  2. if there were a procedure where, over about six months, surgeons replace my neurons a few thousand at a time with silicon that does exactly the same job, and I'm awake and chatting with the nurses the whole way through — I'd sign up, and at the end I'd still be me. it's like renovating a house one room at a time while living in it.

  3. I would NOT step into a teleporter that scans you, disintegrates you at this end, and rebuilds an exact copy at the other end. that's just me dying and some new guy walking around with my memories. my brother in law says the copy would remember walking in, so from the inside it would feel continuous, and yeah that creeps me out, but it doesn't change my mind.

  4. when I fear dying, what I actually fear isn't my atoms stopping — those get swapped out naturally every few years anyway. what I fear is my memories, my projects, my stupid sense of humor not going anywhere. so what matters in survival is the psychological stuff continuing, not the specific matter.

  5. I think there's a genuine extra question lurking here that no brain scan could ever answer: is the guy who walks out the other end really ME? like even given the complete physical description plus the complete psychological description, there's still a further fact of the matter about whether its the same person, and I think that further fact is real and not just word confusion.

  6. because of 4 I'd be ok in principle with getting frozen if I die and thawed and repaired in 200 years, even though basically every atom gets replaced during the repair. its 3 I can't accept.

  each of 2, 3, and 6 seems right to me when I think about it on its own, and 5 feels like common sense, but I'm pretty sure they can't all be right. also, does 5 being true mean 1 has to be false? I want you to actually tell me which one to give up rather than telling me it all works out somehow.
