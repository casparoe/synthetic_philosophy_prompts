          *   *Contrast:* In everyday life, we operate on a "Cooperative Principle" (Grice). We assume people are trying to be helpful. In court, we assume they are trying to survive.
          *   *Extension:* Does it apply elsewhere? Tax law (strict liability sometimes), contracts (parol evidence rule), but generally, fraud *does* cover misleading conduct. So *Bronston* is an outlier, not the rule.

      *   **Q2: Moral Difference vs. Practical Line?**
