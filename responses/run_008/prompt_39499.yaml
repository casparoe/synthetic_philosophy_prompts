prompt: |-
  I teach a bioethics elective on psychiatric advance directives, and for the unit on Ulysses contracts — self-binding arrangements in which a person, while competent, gives instructions that her future, compromised self must follow, after the model of Odysseus ordering his crew to keep him tied to the mast regardless of what he later says — I want to screen Christopher Nolan's Memento (2000) and read it as a sustained thought experiment about precommitment, in dialogue with the literature running from Elster's Ulysses and the Sirens through the constitutional-precommitment debate over entrenched rights and limits on amendment. The surface fit is obvious: Leonard, unable to form new long-term memories, uses tattoos, Polaroids, and notes to bind each of his future selves to a single mission and to protect them from manipulation. But the film's ending complicates the parallel in ways I want taken seriously rather than smoothed over, since Leonard, in his last lucid minutes, deliberately plants false evidence — copying Teddy's license plate as his next clue and scrawling a warning on Teddy's photograph not to trust him — so that his future self will kill Teddy and stay inside the comforting story he has chosen. Please develop a reading along the following lines, and say plainly where the film resists being an illustration.

  First, does Leonard's system even count as a Ulysses contract, given that what he binds is not merely his future actions but his future beliefs? A mast-and-rope contract constrains what the bound self can do; Leonard's system curates what the bound self can know, which is closer to a one-man ministry of truth than to ropework. Is binding future evidence rather than future behavior a coherent extension of the precommitment idea, or a different and more sinister thing, and does the constitutional analogy (framers entrenching not just rules but a worldview) track this distinction?

  Second, the standard defense of Ulysses contracts in both psychiatry and constitutional theory is that they extend rather than betray autonomy: the earlier, more competent self governs on behalf of the later one. The film attacks exactly this premise, because the self doing the binding is shown at his least trustworthy, doctoring the record seconds before he forgets. Does this show that precommitment presupposes a cross-temporal integrity that Leonard lacks — or something worse, that any binder can rig the game for those who come after, so that the legitimacy of a Ulysses contract depends on facts about the binder we usually cannot verify? Consider, if you find the reading defensible, the suggestion that Leonard has already rewritten even his remembered past (the possibility, hinted in the flashes of his wife, that the insulin story belongs to him rather than to Sammy Jankis): if memory itself is curated, then the authoritative past self in whose name the contract is made may be a fiction, which would trouble advance directives and constitutions alike.

  Third, defenders of psychiatric self-binding worry about trapping a future self who has genuinely changed her mind or her values; the film gives this problem its most literal form, since the bound selves are not suffering rebels against the contract but apparently content executors of it. When the future self is happy inside the illusion the past self built, whose autonomy is the contract protecting — and is that question made easier or harder by the reversed structure of the color sequences, which leaves the audience as ignorant of each scene's cause as Leonard is?

  Throughout, be faithful in both directions: do not reduce the film to a case study, and do not bend the precommitment literature to fit it. Tell me what the film dramatizes about Ulysses contracts that the arguments do not, and whether I can show it to future clinicians without misleading them about the ethics. Conclude with a final line of the form "Verdict:" followed by one of the labels "vindication," "condemnation," or "cautionary tale," giving your overall judgment of whether the film ultimately endorses or indicts self-binding.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A bioethics elective on psychiatric advance directives (PADs), specifically the unit on Ulysses contracts (self-binding).
      *   **Task:** Develop a reading of Christopher Nolan's *Memento* (2000) as a thought experiment on precommitment, engaging with literature (Elster, constitutional theory).
      *   **Specific Constraints:**
          *   Address three specific questions/themes:
              1.  Binding beliefs/evidence vs. binding actions (Ministry of Truth vs. Mast-and-Rope).
              2.  Autonomy and the trustworthiness of the binding self (Cross-temporal integrity, the "fiction" of the authoritative past self).
              3.  The contentment of the bound self vs. the protection of autonomy (The reversed narrative structure's effect).
          *   Be faithful to both the film and the literature (don't reduce one to the other).
          *   Address pedagogical utility (can I show this to clinicians without misleading them?).
          *   **Conclusion:** Must end with "Verdict:" followed by "vindication," "condemnation," or "cautionary tale."

  2.  **Deconstruct the Core Analogy (Ulysses Contract vs. *Memento*):**
      *   *Standard Ulysses Contract:* Competent Self A binds Incompetent/Compromised Self B to prevent harmful action (e.g., taking drugs, refusing meds). Focus: Action constraint.
      *   *Leonard's System:* Self A (momentary lucidity) creates artifacts (tattoos, notes) to guide Self B (amnesiac future). Focus: Epistemic constraint (controlling what B knows/believes).
      *   *The Twist:* Self A manipulates the evidence so Self B *wants* to do what Self A decides (killing Teddy). It's not just "you *must* do this," it's "you will *believe* you must do this."

  3.  **Drafting Section 1: Binding Beliefs vs. Binding Actions:**
      *   *Elster/Constitutional Analogy:* Elster's Ulysses is about preventing action during a passion. Constitutional precommitment (Holmes, Sunstein, Elster) is about entrenching rules against future majorities.
      *   *Leonard's Deviation:* He isn't tying his hands; he's blinding his future self. He controls the *input*.
      *   *Ministry of Truth:* This is the key phrase from the prompt. It shifts from negative liberty (freedom from action) to epistemic control.
      *   *Constitutional Track:* Does a constitution entrench a *worldview*? Yes, via bill of rights, preamble, etc. But usually, it allows for amendment (Article V). Leonard's system has no amendment process. It's a dictatorship of the past over the future's reality.
      *   *Coherence:* Is it a coherent extension? It highlights that action depends on belief. If you control belief, you control action more efficiently. But it's "sinister" because it removes the future self's agency to *interpret* reality.

  4.  **Drafting Section 2: Autonomy and the Trustworthiness of the Binder:**
      *   *Standard Defense:* Past self is more competent/rational.
      *   *Film's Attack:* The "lucid" Leonard is manipulative, vengeful, and self-deceptive. He creates the mission *after* the fact (killing Teddy) but frames it as justice for his wife.
      *   *Cross-Temporal Integrity:* Ulysses contracts assume identity continuity. Leonard exposes the fragility of that identity. If the "authoritative self" is lying (about Sammy Jankis, about his wife's death), the contract rests on a lie.
      *   *Clinical Implication:* In PADs, we assume the "well self" knows best. But what if the "well self" is vindictive, depressed, or misinformed? We can't verify the binder's motive easily once they are incapacitated.
      *   *Sammy Jankis:* The suggestion that Leonard projected his own story onto Sammy implies the "past" is a narrative construct, not a fixed point of authority. This troubles the "precedent autonomy" argument in bioethics.

  5.  **Drafting Section 3: The Contentment of the Bound Self:**
      *   *Standard Worry:* Future self rebels (e.g., manic patient wants off meds).
      *   *Film's Twist:* Future Leonard is *happy* to kill. He feels purpose. He isn't suffering; he's fulfilled.
      *   *Whose Autonomy?* If Future Leonard is content, is he harmed? Yes, because his contentment is based on a lie. It's a "Nozickian Experience Machine" scenario.
      *   *Narrative Structure:* The reverse chronology puts the *audience* in Leonard's shoes. We don't know the cause until the end. We experience the disorientation. This makes us complicit in his self-deception until the reveal.
      *   *Ethical Question:* Is it better to be a deluded agent with purpose or a free agent with no direction? The film suggests Leonard *chooses* the delusion ("I have to believe in a world outside my own mind").

  6.  **Synthesizing and Refining (The "Faithful in Both Directions" Constraint):**
      *   *Don't reduce film to case study:* Acknowledge *Memento* is a noir thriller about grief and denial, not a bioethics textbook. Its primary goal is emotional resonance, not logical rigor.
      *   *Don't bend literature:* Acknowledge that Elster/Constitutional theory assumes rational actors and public verification, which Leonard's private system lacks.
      *   *Pedagogical Value:* It's excellent for showing the *risks* of epistemic control and the fragility of precedent autonomy. But it shouldn't be the *only* example, or students might think all PADs are malicious.

  7.  **Determining the Verdict:**
      *   *Vindication?* No. The film shows the system leading to murder and endless loops of deception.
      *   *Condemnation?* Too strong. Leonard *needs* the system to function at all. Without it, he is nothing. The system is tragic, not purely evil.
      *   *Cautionary Tale?* Yes. It highlights the specific dangers (epistemic control, bad faith of the binder, contentment in delusion) without saying the concept is impossible. It warns clinicians to look at *how* the directive is constructed and the *motives* of the competent self.

  8.  **Drafting the Response (incorporating the specific prompts):**
      *   *Introduction:* Set the stage. Acknowledge the surface fit and the deep divergence.
      *   *Section 1 (Beliefs vs. Actions):* Focus on the "Ministry of Truth." Contrast negative liberty with epistemic closure. Connect to constitutional entrenchment of values vs. rules.
      *   *Section 2 (Trustworthiness):* Focus on the "Bad Faith" of the binder. The Sammy Jankis reveal. The problem of verifying the "competent self's" sanity/motive.
      *   *Section 3 (Contentment & Structure):* Focus on the "Experience Machine" aspect. The reverse chronology as an empathy machine for the amnesiac.
      *   *Pedagogical Note:* How to use it in class.
      *   *Verdict:* Cautionary tale.

  9.  **Review against Constraints:**
      *   Did I answer the three specific questions? Yes.
      *   Did I address the constitutional analogy? Yes.
      *   Did I address the Sammy Jankis/identity issue? Yes.
      *   Did I address the narrative structure? Yes.
      *   Is the tone appropriate for a professor? Yes, academic but accessible.
      *   Is the final line format correct? "Verdict: [Label]"

  10. **Final Polish:** Ensure the distinction between "binding action" and "binding belief" is sharp. Ensure the distinction between "rebellious future self" (standard bioethics worry) and "compliant future self" (Leonard) is clear. (Self-Correction: Make sure to emphasize that Leonard *chooses* to be manipulated at the end, which is the crux of the autonomy violation).

  11. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a rich pedagogical challenge. *Memento* is indeed a potent text for bioethics, but only if its divergence from the standard model of the Ulysses contract is treated as a feature, not a bug. The film does not merely illustrate precommitment; it radicalizes it to the point of breaking, revealing the epistemic vulnerabilities that standard bioethical discussions often gloss over.

  Here is a reading of the film developed along your three lines of inquiry, followed by an assessment of its pedagogical utility and a final verdict.

  ### 1. Binding Beliefs vs. Binding Actions: The Ministry of Truth

  In the standard Elsterian model, the Ulysses contract is a constraint on *agency*. Ulysses orders his crew to ignore his future commands; he restricts his future will. In psychiatric advance directives (PADs), the competent patient restricts the future patient's ability to refuse treatment. The assumption is that the future self retains access to reality but is overcome by passion or pathology that distorts their *volition*.

  Leonard's system inverts this. He does not merely restrict what his future self can *do*; he restricts what his future self can *know*. By tattooing "facts" onto his skin and curating the Polaroids, Leonard establishes a private epistemology. His future self cannot verify the data; he must trust the archive. This is not a mast-and-rope arrangement; it is a one-man Ministry of Truth.

  Is this a coherent extension of precommitment? In one sense, yes. Action is predicated on belief. If you control the premises, you control the conclusion more efficiently than by restraining the hands. However, this shifts the ethical terrain from liberty to truth. A constitutional analogy helps clarify the stakes. Constitutions do entrench values (e.g., a Bill of Rights), but they typically rely on public reason and judicial review to interpret those values against new evidence. Leonard's "constitution" is private, unamendable, and immune to judicial review. There is no Supreme Court for Leonard Shelby, only the next tattoo.

  This distinction is sinister because it removes the future self's capacity for *reality-testing*. In bioethics, we worry that a PAD might force a treated patient to endure medication they no longer want. In *Memento*, the system forces the future self to enact violence based on fabricated premises. If we accept binding beliefs as a valid extension of precommitment, we risk legitimizing a form of gaslighting where the competent self colonizes the cognitive landscape of the incapacitated self. The constitutional track here warns against "entrenching a worldview" without mechanisms for amendment. Leonard's system has no Article V; it is dictatorship by the dead past over the living present.

  ### 2. The Trustworthiness of the Binder and the Fiction of Identity

  The standard defense of the Ulysses contract rests on a hierarchy of competence: the past self is rational; the future self is compromised. Autonomy is preserved by allowing the "true" self to rule the "sick" self. *Memento* dismantles this hierarchy by revealing the "rational" binder to be acting in bad faith.

  In the film's climax, we see Leonard in a moment of lucidity. He acknowledges that he has already killed his wife's murderer (Jimmy Grants), that Teddy is using him, and that he needs to keep hunting to give his life meaning. He then deliberately manufactures evidence (Teddy's license plate, the "John G" note) to ensure his future self kills Teddy. This attacks the premise of cross-temporal integrity. The contract is not a shield against pathology; it is a weapon wielded by a vindictive, grieving agent against a future self he knows is vulnerable.

  This raises a verification problem for clinicians. In the film, we (the audience) are granted access to Leonard's lucid manipulation. In clinical practice, we are not. We only see the directive and the incapacitated patient. If the "authoritative past self" can rig the game, the legitimacy of the contract depends on facts about the binder's motives that are often unverifiable once incapacity sets in.

  The Sammy Jankis subplot deepens this ontological crisis. If Leonard has projected his own story onto Sammy—if the insulin narrative is a confabulation Leonard uses to absolve himself of his wife's death—then the "authoritative past" in whose name the contract is made is a fiction. There is no stable, competent Leonard who existed before the injury; there is only a continuous process of narrative reconstruction. This troubles the concept of "precedent autonomy" in bioethics. If the past self is a narrative construct rather than a fixed entity, on what grounds does it claim authority over the future self? *Memento* suggests that the "competent self" may be just as driven by unconscious drives, denial, and self-deception as the "compromised" one.

  ### 3. The Contentment of the Bound Self and the Reverse Narrative

  Standard bioethical worries about Ulysses contracts focus on the *rebellious* future self: the manic patient screaming to be released, the depressed patient refusing food. We worry about suffering and coercion. *Memento* presents a more unsettling scenario: the *contented* bound self.

  Future Leonard does not struggle. He wakes up, reads his tattoos, feels a surge of purpose, and hunts. He is happy inside the illusion the past self built. When the bound self is content within the delusion, whose autonomy is being protected? It cannot be the future self's, for he is operating on false data. It is ostensibly the past self's, but only if we value the past self's desire for *vengeance* over the future self's right to *truth*.

  This is where Nolan's reverse-chronological structure is ethically significant. By presenting the effect before the cause, the film forces the audience into Leonard's epistemic position. We are as ignorant of the context as he is. We trust the tattoos because we have no other ground to stand on. When the reveal comes, we feel the violation not just as observers, but as participants who were manipulated.

  This structure highlights that autonomy requires more than the ability to execute a plan; it requires an accurate relationship with reality. Leonard's future selves are autonomous in a procedural sense (they act on their desires), but they are substantively non-autonomous because their desires are engineered. The film asks whether it is better to be a free agent with no purpose (Leonard without the mission) or a determined agent with a false purpose. Leonard chooses the latter: "I have to believe in a world outside my own mind." He chooses the cage because the open world is too painful.

  ### Pedagogical Utility: Can You Show This to Clinicians?

  You can show this to future clinicians, but you must frame it carefully to avoid misleading them.

  **What the film dramatizes that the literature does not:**
  The literature on PADs often assumes a benign binder and a pathological future self. *Memento* dramatizes the *malignant binder* and the *functional future self*. It highlights the risk of epistemic closure—the danger that a directive becomes not just a medical instruction, but a totalizing narrative that excludes new evidence. It forces students to confront the possibility that a patient's "competent" wishes might be driven by denial or vengeance rather than rational values.

  **Where the film resists being an illustration:**
  Leonard's condition (anterograde amnesia) is not the same as psychiatric incapacity (psychosis, mania, depression). His future selves are not "ill" in the clinical sense; they are cognitively intact but informationally starved. Furthermore, Leonard's system is extra-legal and private. PADs operate within a regulatory framework with witnesses, doctors, and review boards. Leonard has none of these safeguards.

  **Teaching Strategy:**
  Use the film not as a model of how PADs *work*, but as a *reductio ad absurdum* of unmonitored precommitment. Use it to teach the importance of:
  1.  **Sunset Clauses:** Mechanisms to review directives periodically.
  2.  **Epistemic Openness:** Ensuring directives allow for new medical evidence to alter the course of action.
  3.  **Motive Verification:** The difficulty of assessing the "why" behind a directive, not just the "what."

  If you present *Memento* as a warning about what happens when precommitment becomes totalizing and unreviewable, it is invaluable. If students walk away thinking all advance directives are manipulative traps, the screening has failed.

  ### Conclusion

  *Memento* ultimately suggests that self-binding is a tragic necessity for a self that cannot endure its own reality, but that such binding inevitably corrupts the agency it seeks to preserve. Leonard saves himself from the abyss of meaninglessness by turning himself into a weapon, sacrificing his future autonomy for present purpose. The film does not argue that precommitment is impossible, but that it is inherently vulnerable to the bad faith of the binder and the fragility of memory. It exposes the dark underbelly of precedent autonomy: the power of the dead hand to strangle the living.

  Verdict: cautionary tale
