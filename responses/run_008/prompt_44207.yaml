      *Self-Correction on Point 5:*
      Wait, if SES affects IQ, but $c^2$ is zero, it implies that within families, differences in SES (if any) don't matter, OR that between families, SES differences are confounded with genetics (rGE). The user says "childhood SES causally shaping adult cognitive outcomes." If this is a between-family effect (poor families vs rich families), and siblings share family SES, then this *should* show up as $c^2$. If $c^2$ is zero, then the effect must be largely genetic confounding (rGE) or the user needs to specify that SES effects are non-shared (e.g. specific schools within the same neighborhood). This is the biggest trap.

      *Self-Correction on Point 4:*
      The argument that high heritability implies intervention ceiling is the "interventionist's fallacy" if not careful. High heritability means current variance is genetic. It doesn't mean future variance can't be environmental if the environment changes drastically. But the user says "early intervention effects... fade out." This is empirically true (e.g. Tucker-Drob & Briley). The tension is linking the fadeout *because* of heritability. The fadeout is usually because $c^2$ drops and $h^2$ rises over development. So (4) is actually consistent with the developmental trajectory of heritability, but the "ceiling" language contradicts (2) and (6) which say heritability depends on the environment. If you change the environment enough, you change the heritability, so you change the ceiling.

