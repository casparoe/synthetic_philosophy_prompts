      *Refining the "No Formatting" constraint:*
      I must ensure I don't use any markdown that looks like structure. No `**`, no `###`, no `-`. Just paragraphs.

      *Refining the Content:*
      Make sure to explain *why* Point 5 is dangerous. In ACE models, shared environment is what makes siblings similar beyond genes. SES is typically a shared environment variable. If SES causes IQ, siblings should be more similar due to SES. If $c^2$ is zero, either SES doesn't cause IQ, or SES effects are mediated by non-shared factors (e.g., differential treatment based on SES), or it's rGE (parents pass genes for SES and IQ). The user says "childhood SES causally shaping adult cognitive outcomes." This needs nuance.
      For Point 4, the "fadeout" effect is real (e.g., Head Start), but linking it directly to adult heritability is tricky. The mechanism is usually that as people age, they select environments correlated with their genotypes (niche picking), which increases $h^2$ and decreases $c^2$. The "ceiling" language is risky if (2) and (6) are true.
      For Point 7, the key is that heritability explains variance around the mean, not the mean itself. If everyone gets better nutrition, the mean goes up (Flynn), but the variance might still be mostly genetic.

