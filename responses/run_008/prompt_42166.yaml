  **What Kind of Decider Are You?**

  1.  **Apartment:** You find a place that fits budget and commute. A site offers 50 more listings for $50.
      A) Pay. Need to see everything.
      B) No. This one works.
      C) Pay only if the market is unstable.

  2.  **Job Offer:** Candidate clears the bar. One reference check remains, might reveal a flaw.
      A) Check anyway. Need certainty.
      B) Skip. They passed.
      C) Check only if the role is high-risk.

  3.  **The Shirt:** You buy a jacket. See a nicer one, same price, next rack.
      A) Swap them.
      B) Keep the first. Task done.
      C) Keep the first. Swapping is hassle.

  4.  **Blender:**
      A) Read every review.
      B) Read three, pick best.
      C) Pick first with 4 stars.

  5.  **Dating:** No one matches your list after a year.
      A) Keep looking. Standards stand.
      B) Drop top two requirements.
      C) Take a break, keep standards.

  6.  **Restaurant:**
      A) Highest rated.
      B) First open that serves cravings.
      C) Whatever seats the group fastest.

  7.  **Regret:** Choose A. Learn B was slightly better.
      A) Frustrated. Missed the best.
      B) Neutral. Process was sound.
      C) Neutral. A was fine.

  8.  **Vacation:**
      A) Optimize every leg.
      B) Plan hubs, wing rest.
      C) Copy a friend's plan.

  **Scoring Key**

  **Mostly A: Straightforward Maximizer.** You seek the absolute best. You pay for more options (Q1) and check for errors (Q2) regardless of cost. Regret (Q7) stings because you measure against the unseen perfect.

  **Mostly B (with some A): Simon-style Bounded Optimizer.** You seek the best option *including* the cost of looking. You might pay for options (Q1) or check references (Q2) if the math works, but stop when effort outweighs gain. **Flag:** Like Maximizers, you may check for errors (Q2). This quiz cannot fully separate those motives; you check for risk, they check for perfection.

  **Mostly B (Q3, Q4): Intrinsic Satisficer.** You stop when the bar is cleared. A better option on the next rack (Q3) doesn't tempt you. You don't pay for more options (Q1) because "enough" is already found. Unlike the Bar-Adjuster, your bar doesn't move; you just stop looking.

  **Mostly C: Ecological-Rationality Type.** Your strategy fits the environment (volatile market, high-risk role, group dynamics). You view shortcuts as tools, not compromises. **Paying for Options:** Willingness to pay (Q1) cuts across types here. It separates Maximizers (always pay) from Satisficers (never pay), but Optimizers and Ecological types pay only when the context demands deeper search.

  **Q5 Option B: Bar-Adjuster.** Your defining trait is adapting aspirations to reality. While others stick to standards or search costs, you redefine "good" when the world disappoints. This separates you from the Satisficer, who keeps the bar fixed but stops searching.

  **Limitations:** Distinguishing Maximizers from Bounded Optimizers on error-checking (Q2) is imperfect; both check, but for different reasons. Similarly, Intrinsic Satisficers and Bar-Adjusters both stop searching, but Adjusters move the goalpost while Satisficers keep it fixed. If your answers mix these, you likely blend strategies.
