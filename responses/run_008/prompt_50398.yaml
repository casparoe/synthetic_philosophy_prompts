answer: |-
  Here is a session plan designed for your specific constraints and audience.

  ### 1. The Sequence: Story First, Logic Second
  **Do not put the logical structure on the table first.**
  If you start with propositional calculus ($P, Q, P \land Q \to R$), you will lose the non-specialists immediately. They will view this as a math problem, not a philosophical or political problem.

  **The Order:**
  1.  **The Scenario (The Hook):** Present the narrative situation without formal notation.
  2.  **The Vote (The Puzzle):** Have them simulate the voting.
  3.  **The Contradiction (The Reveal):** Show the inconsistent outcome.
  4.  **The Logic (The Explanation):** *Now* introduce the formal structure to explain *why* the contradiction happened.

  **Why:** You need them to feel the intuitive tension of the dilemma before you give them the tools to dissect it. The logic serves the story, not the other way around.

  ### 2. The Single Example: The Three-Judge Court
  Use the classic **Kornhauser & Sager Court Case**. Do not deviate from this for a general audience; it is the cleanest vehicle.

  **The Setup:**
  A three-judge panel must decide if a defendant is **Liable**.
  Legal doctrine states: Liable **if and only if** (Action was taken **AND** Duty existed).
  *   Proposition $P$: Defendant took the action.
  *   Proposition $Q$: Defendant had a duty not to take the action.
  *   Conclusion $R$: Defendant is Liable ($P \land Q \to R$).

  **The Votes:**
  *   **Judge 1:** Yes on $P$, Yes on $Q$ $\rightarrow$ Yes on $R$.
  *   **Judge 2:** Yes on $P$, No on $Q$ $\rightarrow$ No on $R$.
  *   **Judge 3:** No on $P$, Yes on $Q$ $\rightarrow$ No on $R$.

  **What this example must HAVE:**
  *   **Logical Connectivity:** The conclusion must be strictly determined by the premises (conjunction is best for beginners).
  *   **Binary Choices:** Yes/No only. No probabilities or "maybe."
  *   **Individual Consistency:** Every single judge must be logically consistent (no judge votes Yes/Yes/No).

  **What this example must LACK:**
  *   **Weights or Authority:** All judges are equal.
  *   **Strategic Voting:** Assume everyone votes their sincere judgment.
  *   **Complex Logic:** Avoid conditionals ($P \to Q$) as premises; stick to conjunctions ($P \land Q \to R$) for the conclusion. It reduces cognitive load.

  ### 3. Misconceptions and Interventions
  There are two major misconceptions your group will form. You must head them off at specific moments, or the discussion will derail.

  **Misconception A: "This just proves committees are dumb."**
  *   **When it forms:** Immediately after you reveal the collective contradiction (Majority says Yes to $P$, Yes to $Q$, but No to $R$).
  *   **Where to head it off:** **Immediately after the Reveal.**
  *   **How:** Before moving to solutions, force the group to check the *individual* ballots. Ask: "Is Judge 1 irrational? Is Judge 2?" When they admit every individual is perfectly consistent, emphasize: "The paradox is not about individual competence. It is about the *aggregation mechanism*."

  **Misconception B: "So majority rule is incoherent; we need an expert/chair to decide."**
  *   **When it forms:** During the "Solutions" phase, when they realize Premise-Based Voting (vote on $P$ and $Q$, derive $R$) and Conclusion-Based Voting (vote on $R$ directly) yield different results.
  *   **Where to head it off:** **When discussing the 'Dictator' solution.**
  *   **How:** Acknowledge that making Judge 1 the dictator solves the inconsistency. Then ask: "What normative value did we just sacrifice?" Guide them to see that solving the logical problem creates a democratic problem. This sets up the impossibility theorem without needing the math yet.

  ### 4. Arrow's Theorem: To Mention or Not?
  **Mention it, but only in the last 5 minutes.**
  If you bring it in earlier, they will conflate *Preferences* (rankings) with *Judgments* (truth values).

  *   **Where:** In the wrap-up, as "Context."
  *   **How to frame it:** "Arrow's Theorem is the cousin of this problem. Arrow showed you can't aggregate *rankings* fairly. We just showed you can't aggregate *truth-claims* fairly. They are siblings, not parents."
  *   **Why:** It validates their intuition that "voting is weird" but clarifies that Judgment Aggregation is a distinct field with distinct stakes (truth vs. satisfaction).

  ### 5. The Final Assessment Question
  You need one question to test if they understand the difference between **Judgment Aggregation** (truth/consistency) and **Preference Aggregation** (ranking/desire).

  **Ask this:**
  > "In the Court Case, if the collective outcome violates logic (Yes on premises, No on conclusion), we say the group is 'wrong' about the world. In a Condorcet Election, if the collective outcome violates transitivity (A > B > C > A), we say the group has 'no clear winner.'
  >
  > **Why does the Court Case feel like a failure of *correctness*, while the Election feels like a failure of *decidability*?**"

  **What to listen for:**
  *   **If they get it:** They will mention that judgments aim at a single truth (there is one fact of the matter about liability), whereas preferences are about competing desires (there is no 'true' best restaurant).
  *   **If they miss it:** They will say "because courts are more important" or "because logic is stricter than voting." Push them on the *ontology* of the vote: Are we discovering truth or aggregating wants?

  ### Summary Run-of-Show (60 Minutes)
  1.  **00-05:** Intro: The Court Case story (no logic symbols yet).
  2.  **05-15:** The Vote: Fill the matrix on the whiteboard. Reveal the paradox.
  3.  **15-25:** The Logic: Introduce $P, Q, R$. Prove individual consistency vs. collective inconsistency. **(Head off Misconception A here).**
  4.  **25-40:** Solutions: Premise-based vs. Conclusion-based voting. Show they give different results. Discuss the "Dictator" fix. **(Head off Misconception B here).**
  5.  **40-50:** Discussion: Is there a perfect system? (Briefly hint at impossibility).
  6.  **50-55:** Arrow Context: The "Cousin" distinction.
  7.  **55-60:** **The Final Question** and debrief.
