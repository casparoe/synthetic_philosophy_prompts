answer: |-
  **MEMORANDUM**

  **TO:** Investment Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Decision-Making Framework (Expected Utility vs. Contextual Constraints)

  **Recommendation**
  I recommend we **reject a standing rule requiring strict Expected Utility (EU) maximization** in favor of a **"Disclosed Objective Framework."** Under this approach, every investment or asset disposition vote must be preceded by a written statement defining the specific objective function (e.g., "Maximize Unrestricted Endowment" vs. "Ensure Capital for Wetland Acquisition"). This preserves mathematical rigor while acknowledging that our utility for dollars is not constant—it depends on the mission constraints attached to those dollars.

  **The Case for Consistency (The Quant's View)**
  The strongest argument against our March/April voting record is mathematical validity. The retired quant is correct that if we treat dollars as fungible, we violated the Independence Axiom. By stripping the common 89% probability of $2.4M from the March options, we are left with the April probabilities. A rational agent with a stable risk preference should not flip their ranking. If we codify inconsistency, we invite cognitive biases (like the certainty effect) to erode long-term value. A strict EU rule forces discipline, ensuring we don't overpay for psychological comfort at the expense of the endowment's purchasing power.

  **The Case for Context (The Wetland View)**
  However, applying a single utility function to all committee decisions assumes the money is always the same. It is not. In March, the $2.4M was effectively **restricted liability matching**. We had a verbal commitment to wetland partners; a 1% chance of $0 wasn't just a portfolio dip, it was a reputational breach and a mission failure. The "cost" of that 1% tail risk included lost trust and future deal flow. In April, the auction funds were likely unrestricted; a failed bid carried no penalty beyond opportunity cost.

  This addresses the "linear utility" wrinkle. While a $30M diversified endowment should theoretically be risk-neutral regarding *unrestricted* capital, we are not a hedge fund; we are a mission vehicle. Our risk aversion lives in the **non-financial costs of failing specific commitments**. The March decision wasn't irrational risk aversion; it was prudent risk management regarding a specific liability. The quant's model fails only because it assumes Utility($0) was identical in March and April. It wasn't.

  **Proposed Framework**
  Adopting a blind EU rule would force us to ignore the specific stakes of individual transactions. Instead, before any vote, the proposer must declare:
  1.  **The Bucket:** Is this capital Unrestricted (Endowment Growth) or Restricted (Project Finance)?
  2.  **The Cost of Failure:** If the downside scenario occurs, what is the operational or reputational impact?

  If the Bucket is Unrestricted, we default to risk-neutral EV maximization. If Restricted, we may apply risk aversion proportional to the stated Cost of Failure. This legitimizes the March/April combo without opening the door to arbitrary bias.

  **Next Steps**
  At the retreat, please review the attached draft "Investment Objective Statement" template. We need to agree on who validates the "Cost of Failure" assessment to ensure it isn't used to mask simple risk aversion.

