prompt: |-
  i'm on the investment committee of a mid-sized environmental nonprofit, endowment around $30M, and i need you to draft a memo for me. context: in march we sold a donated apartment building, and we turned down an alternative structure that would've paid 89% likely $2.4M, 10% likely $12M, and 1% likely nothing, in favor of a fixed certain offer of $2.4M. then last month, choosing between two fundraising auction structures, we picked the one with a 10% shot at $12M (else nothing) over the one with an 11% shot at $2.4M (else nothing). one member, a retired quant, says the two votes together flout the independence axiom: both march options shared an 89% chance of paying the same $2.4M, zero out that shared chunk and march's options literally become april's, so our ranking shouldn't have flipped — but it did. another member says the certainty in march was worth something real because we'd already earmarked the proceeds for a wetland acquisition, and a 1% chance of blowing that up mattered in a way no spreadsheet captures. the chair wants a one page memo from each of us before the retreat recommending whether the committee should adopt a standing rule that investment decisions must be justified in expected-utility terms (which would ban our march+april combo going forward), reject the rule, or adopt something in between. please draft mine. it should recommend one concrete course of action, engage the quant's consistency argument on the merits (does zeroing out the shared 89% really leave untouched the thing we cared about?), take the wetland member's point seriously rather than treating it as a bias to be corrected, and address a wrinkle i keep chewing on: an endowment, unlike a person, plausibly has near-linear utility in dollars — we're diversified, we're not eating the money — so where would our risk aversion even live? unless it's not risk aversion at all but something about the story we'd have to tell the wetland partners if the deal fell through, which might rescue the votes or might just relabel the inconsistancy, i genuinely can't tell which. the chair also wants memos to honestly present the strongest case for the side they're arguing against, so don't sandbag it.

  after the memo, add a short structured summary as a JSON object with these fields: recommendation (one of "adopt-eu-rule", "reject-eu-rule", "adopt-modified-rule"), main_argument (max 2 sentences), strongest_objection (the best case for the other side, max 2 sentences), decision_rule_for_future (the concrete test a future proposal would have to pass under your recommendation), and open_questions (array of up to 3 things the committee should settle at the retreat).
reasoning: |-
  Here's a thinking process that leads to the suggested memo and JSON summary:

  1.  **Analyze the Request:**

      *   **Role:** Investment Committee Member of a mid-sized environmental nonprofit ($30M endowment).
      *   **Task:** Draft a one-page memo for the committee retreat.
      *   **Context:**
          *   *March Decision:* Sold a donated building. Option A: Certain $2.4M. Option B: 89% $2.4M, 10% $12M, 1% $0. Chose Option A (Certain).
          *   *April Decision:* Fundraising auction. Option C: 11% $2.4M, 89% $0. Option D: 10% $12M, 90% $0. Chose Option D (Riskier).
          *   *The Conflict:* A retired quant member claims this violates the Independence Axiom of Expected Utility (EU) theory (Allais Paradox style). If you remove the common 89% chance of $2.4M from the March options, you get the April options. Preference reversal implies inconsistency.
          *   *The Counter:* Another member argues the "certainty" in March mattered because proceeds were earmarked for a specific wetland acquisition (liability/constraint), making the 1% risk of $0 unacceptable.
          *   *My Internal Conflict:* Endowments usually have linear utility (diversified, long-term), so why be risk-averse? Is it really risk aversion or reputational/storytelling risk regarding the wetland partners?
      *   **Requirements:**
          *   Recommend one concrete course of action (Adopt EU rule, Reject, or Modified).
          *   Engage the quant's consistency argument on merits (does zeroing out the 89% ignore the wetland constraint?).
          *   Take the wetland member's point seriously (not just a bias).
          *   Address the "linear utility vs. reputational risk" wrinkle.
          *   Present the strongest case for the opposing side (don't sandbag).
          *   Format: One-page memo style.
          *   Output: Memo + Structured JSON Summary.

  2.  **Determine the Recommendation:**

      *   *Option 1: Adopt strict EU rule.* Too rigid. Ignores the specific liability matching (wetland) which is a valid financial constraint, not just psychological risk aversion.
      *   *Option 2: Reject rule entirely.* Leaves us open to genuine cognitive biases and inconsistent decision-making in the future.
      *   *Option 3: Modified Rule (Context-Aware Utility).* This seems best. Acknowledge that utility isn't just about endowment growth; it's about mission fulfillment. The "utility function" changes based on whether funds are unrestricted (endowment) or restricted (wetland).
      *   *Decision:* Recommend a **Modified Rule**. We shouldn't ban the March/April combo per se, but we must explicitly define the *objective function* for each decision (e.g., "Maximize Unrestricted NAV" vs. "Ensure Funding for Project X").

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly.
      *   **The Quant's Argument (Strengths):** Acknowledge the mathematical validity. The Independence Axiom is a cornerstone of rational choice. If we treat dollars as fungible, we were inconsistent. This is the "strongest case for the other side."
      *   **The Wetland Argument (Strengths):** This isn't just "risk aversion." It's liability matching. In March, the money had a specific job. In April, it was likely unrestricted fundraising. The utility of the 89th percentile dollar changes when it's the *only* dollar available to close a deal vs. one of many in a portfolio.
      *   **The "Linear Utility" Wrinkle:** Address the endowment nature. Usually, $30M implies we should be risk-neutral. However, the "story to tell partners" is a real reputational cost, which translates to financial cost (future donations). So, utility isn't linear when specific commitments are on the line.
      *   **Synthesis/Recommendation:** Don't adopt a blind EU rule. Adopt a "Contextual Utility Framework." Before voting, define the bucket (Restricted vs. Unrestricted) and the cost of failure.
      *   **Closing:** Call to action for the retreat.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Check:* Did I treat the wetland member's point as a bias? *Correction:* Ensure I frame it as "Liability-Driven Investment" or "Constraint-Based Utility," not "Loss Aversion."
      *   *Check:* Did I address the quant? *Correction:* Acknowledge that *if* the money was fungible, he is 100% right. The pivot is that the money *wasn't* fungible in March.
      *   *Check:* The "Linear Utility" point. *Correction:* Make sure to distinguish between the Endowment (risk neutral-ish) and the Project Finance (risk averse). The March decision was effectively Project Finance.
      *   *Check:* Length. Keep it tight, one-page feel.

  5.  **Drafting the JSON:**

      *   *Recommendation:* "adopt-modified-rule".
      *   *Main Argument:* Utility functions must reflect mission constraints, not just portfolio math; the March decision was liability-matching, not risk-aversion.
      *   *Strongest Objection:* The quant's view that fungible dollars demand consistent risk preferences, and allowing exceptions invites cognitive bias.
      *   *Decision Rule:* Future proposals must declare the "Utility Bucket" (Restricted vs. Unrestricted) and the specific cost of failure before voting.
      *   *Open Questions:* How to define "Restricted," who approves the utility function, how to track reputational risk.

  6.  **Final Review against Constraints:**

      *   One page memo? (Keep word count reasonable).
      *   JSON fields correct? (Yes).
      *   Engage quant on merits? (Yes, via fungibility argument).
      *   Take wetland member seriously? (Yes, via liability matching).
      *   Address linear utility wrinkle? (Yes, via reputational/mission cost).
      *   Strongest opposing case? (Yes, in the "Case for Consistency" section).

  7.  **Final Polish:** Ensure tone is professional, collaborative, yet decisive. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dismissing the quant. The Allais Paradox is real. I need to argue that the *inputs* to the EU calculation changed, not that EU is wrong. In March, the utility of $0 was catastrophic (deal dies). In April, the utility of $0 was neutral (status quo). That changes the EV/EU calculation without breaking the axiom. Wait, if the utility of outcomes changes, the axiom holds. The quant assumes Utility($2.4M) and Utility($0) are constant across both votes. My argument is they weren't. I need to make that explicit.

  *Revised Plan:* The recommendation is to reject a *blind* EU rule but adopt a *disclosed utility* rule. We must state *why* we value the outcomes differently before voting.

