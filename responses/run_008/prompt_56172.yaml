prompt: |-
  I'm a senior analyst at a foreign-policy think tank, and honestly a huge part of my job is analogies. Every week some editor or deputy director asks me whether X is "another Munich," whether we're "getting dragged into another Vietnam," whether this rivalry is a "Thucydides trap," and whether that framing belongs in the piece or the briefing. Sometimes the analogy is doing real work; sometimes it's just a mood. The problem is we have no shared way of telling which is which, so the arguement happens over vibes, and whoever invokes the most vivid image usually wins the meeting.

  So please turn whatever philosophy of history and reasoning actually has to say about this into a procedure my team can run on any proposed analogy before it goes into a memo or a briefing. Questions in order, what counts as a sufficient answer to each, and where the procedure outputs one of: drop it, keep it but as rhetoric only (and flagged as such in our internal notes), or it's doing evidential work and here's what it can actually support. It should distinguish analogies used to predict (this will follow the same trajectory) from analogies used to warn (this could go the way of...) from analogies used to justify (we must act now so as not to repeat...) — I suspect those carry different burdens, and the procedure should say what the burden is for each. It should also separate wether an analogy is warranted from whether it's persuasive, since those come apart more than we like to admit and I only care about the first one for internal review.

  Then run it on three cases. (1) A colleague wants to open a memo about a great-power rivalry over some new technology with the claim that we're in a Thucydides trap and that war is basically the default outcome. (2) Another wants to compare a limited military intervention to Vietnam on the grounds that it'll be popular at first and then grind us down over years — she cares about the trajectory, not the opening move. (3) I want to use Munich, specifically the lesson that appeasing an aggressor feeds his appetite rather than sating it, to argue against concessions in a negotiation. I'd like to know whether the procedure lets me get away with that, though I have a feeling it shouldn't, at least not the way I wanted to use it.

  For context on constraints: these memos reach people who make actual decisions, we get a couple of analogy questions a week, and the whole check has to be runnable in about twenty minutes by someone who knows the history but has zero philosophy background. So the procedure itself should keep the philosophy invisible — the team will not sit through a lecture — but the distinctions underneath should be the real ones, not dumbed down to uselessness. And be honest about the spots where a judgment call can't be proceduralized and has to stay with a human.

  Last thing: tell me where the procedure misfires. Specifically, are there cases where following it would have blocked an analogy that in hindsight turned out to be right, and if so, is that a bug or just the price of the discipline? I want to know what this procedure can't do before I sell it to my director as the answer to the vibes problem.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Persona:** Senior Analyst at a foreign-policy think tank.
      *   **Problem:** Overuse/misuse of historical analogies (Munich, Vietnam, Thucydides Trap) in memos/briefings. Arguments rely on "vibes" rather than rigor.
      *   **Goal:** A 20-minute procedural checklist to evaluate proposed analogies *before* they go into a product.
      *   **Requirements:**
          *   Distinguish functions: Prediction vs. Warning vs. Justification.
          *   Distinguish validity (warranted) vs. persuasiveness (vivid).
          *   Output categories: Drop, Keep as Rhetoric (flagged), Keep as Evidential (with scope).
          *   Run on three specific cases: Thucydides Trap (Prediction), Vietnam (Trajectory/Warning), Munich (Justification/lesson).
          *   Constraints: No philosophy jargon, runnable by history-literate non-philosophers, honest about limitations/judgment calls.
          *   Meta-Analysis: Where does the procedure misfire? (False negatives).

  2.  **Philosophical Underpinnings (Hidden):**

      *   *Analogy as Argument:* Ernest May's "Lessons of the Past," Richard Neustadt, Yuen Foong Khong ("Analogies at War").
      *   *Structure of Analogy:* Source (Past) -> Target (Present). Mapping relations, not just attributes.
      *   *Burden of Proof:* Varies by function. Prediction requires high structural similarity. Warning requires plausible mechanism. Justification requires moral/policy equivalence.
      *   *Disanalogy:* Crucial to identify differences that break the causal chain.
      *   *Hume/Induction:* Past performance doesn't guarantee future results, but causal mechanisms do.

  3.  **Drafting the Procedure (The "Analogy Stress Test"):**

      *   *Time Limit:* 20 minutes.
      *   *Format:* Step-by-step questions with pass/fail criteria.
      *   *Step 1: Define the Job.* (Prediction, Warning, Justification). This sets the burden.
      *   *Step 2: Map the Causal Mechanism.* Not just "they look alike," but "why did X happen then, and does that engine exist now?"
      *   *Step 3: The Disanalogy Check.* What's different? Do the differences matter more than the similarities?
      *   *Step 4: The Counter-Analogy.* Is there a better historical fit?
      *   *Step 5: Verdict.* (Drop, Rhetoric, Evidence).

  4.  **Refining the Steps for the User's Constraints:**

      *   Avoid terms like "epistemic warrant" or "inductive strength." Use "Job," "Engine," "Breakers," "Rivals."
      *   Make the output categories clear.
      *   Ensure the distinction between *warranted* (does the logic hold?) and *persuasive* (will it sell?) is explicit.

  5.  **Running the Three Cases:**

      *   *Case 1: Thucydides Trap (Prediction).*
          *   Job: Prediction (War is default).
          *   Mechanism: Structural stress -> Fear -> War.
          *   Disanalogies: Nuclear weapons, economic interdependence, non-state actors.
          *   Verdict: Likely "Drop" or "Rhetoric Only." The historical sample size is tiny and contested. Predicting war as *default* is too strong.
      *   *Case 2: Vietnam (Trajectory/Warning).*
          *   Job: Warning (Popularity -> Grind).
          *   Mechanism: Domestic political support erodes over time in limited wars without clear victory conditions.
          *   Disanalogies: Draft vs. All-volunteer, media environment, specific geography.
          *   Verdict: "Keep as Rhetoric/Warning." It highlights a risk, not a certainty. Needs flagging that it's a *risk profile*, not a destiny.
      *   *Case 3: Munich (Justification).*
          *   Job: Justification (No concessions).
          *   Mechanism: Concessions signal weakness -> Aggressor demands more.
          *   Disanalogies: Is the adversary ideologically expansionist like Hitler? Or rational actor?
          *   Verdict: "Drop" or "Heavy Flag." Munich is the most abused analogy. Unless the adversary is explicitly existential/ideological, the mechanism doesn't hold. Using it to block *any* negotiation is usually unwarranted.

  6.  **Addressing the "Misfire" Question (False Negatives):**

      *   *The Problem:* Rigor kills intuition. Sometimes the "vibe" is actually pattern recognition that hasn't been fully articulated yet.
      *   *Example:* George Kennan's "Long Telegram" or containment. If subjected to a strict checklist in 1946, maybe it fails because no exact precedent existed.
      *   *Example:* 1989 Fall of Communism. Most analogies (1917, 1848) failed. A strict procedure might have blocked the "this time is different" argument.
      *   *Conclusion:* The procedure prevents *bad* arguments, not *novel* insights. It's a brake, not an engine.

  7.  **Review and Refine:**

      *   *Tone:* Professional, peer-to-peer, slightly cynical but constructive.
      *   *Clarity:* Ensure the "20-minute" constraint is respected (checklist format).
      *   *Philosophy:* Keep it invisible but robust (causal mechanisms, not surface features).
      *   *Self-Correction during drafting:* I initially thought about making the "Prediction" burden impossible to meet. I should soften it: Prediction is rarely warranted by analogy alone, but *risk assessment* is. I need to make sure the user knows analogies are terrible for *forecasting* but good for *scenario building*.

  8.  **Final Polish:** Check against all prompt requirements.
      *   Procedure? Yes.
      *   Questions/Answers/Outputs? Yes.
      *   Three Cases run? Yes.
      *   Misfire analysis? Yes.
      *   No philosophy jargon? Yes.
      *   20-minute constraint? Yes.

  **(Self-Correction Note):** Make sure to emphasize that "Rhetoric Only" isn't an insult. It means "use this to illustrate, not to prove." This is a crucial distinction for the think tank context.

  9.  **Final Output Generation** (Proceed to write response).
answer: |-
  Here is the **Analogy Stress Test (AST)**. It is designed to be printed as a one-pager and run in 20 minutes. It strips out the philosophy of history and replaces it with operational questions about causal mechanisms and burden of proof.

  Following the procedure, I have run it on your three cases and provided the "Misfire Analysis" you requested for your director.

  ***

  # The Analogy Stress Test (AST)
  **Time Limit:** 20 Minutes
  **Operator:** Any analyst with regional/historical expertise (no philosophy training required).
  **Goal:** Determine if a historical analogy is *warranted* (logically sound) vs. *persuasive* (vivid).

  ### Step 1: Define the Job (2 Minutes)
  *Analogies fail when they are asked to do work they aren't built for. Identify the specific function of the analogy in the text.*

  **Question:** What is this analogy trying to prove?
  *   **A. Prediction:** "Because X happened then, X will happen now." (e.g., War is inevitable.)
  *   **B. Warning:** "Because X happened then, we must guard against risk Y now." (e.g., Quagmire risk.)
  *   **C. Justification:** "Because we did/were wrong then, we must act this way now." (e.g., Moral imperative to intervene.)

  **Sufficient Answer:** You must select exactly one. If the analogy is trying to do two (e.g., predict *and* justify), it fails immediately. **Output: DROP.**

  ### Step 2: Map the Engine (5 Minutes)
  *Surface similarities (flags, uniforms, geography) are irrelevant. You need the causal mechanism.*

  **Question:** What is the specific *engine* that drove the outcome in the historical case, and does that same engine exist in the current case?
  *   *Bad Answer:* "Both involve a rising power and a status quo power." (This is a description, not an engine.)
  *   *Good Answer:* "In 1914, mobilization timetables forced leaders' hands before diplomacy could work. Do rigid mobilization timetables exist now?"

  **Sufficient Answer:** A single-sentence description of the causal mechanism (e.g., "Domestic political cost exceeds perceived gain over time"). If you cannot name the engine, the analogy is a metaphor. **Output: RHETORIC ONLY.**

  ### Step 3: The Breaker Check (5 Minutes)
  *Identify the single biggest difference between the two cases.*

  **Question:** What is the most significant *disanalogy* (difference) between the past case and the present case? Does this difference break the "Engine" identified in Step 2?
  *   *Test:* If you insert this difference into the historical case, would the outcome have changed?
  *   *Example:* "Nuclear weapons." If inserted into 1939, does WWII start? Maybe not. If inserted into 1914, does WWI start? Likely not (initially). If inserted into a cyber-conflict today? Yes, it changes the escalation ladder.

  **Sufficient Answer:** If the difference breaks the Engine, the analogy is invalid. **Output: DROP.** If the difference complicates the Engine but doesn't break it, proceed to Step 4.

  ### Step 4: The Rival Test (5 Minutes)
  *Confirmation bias is the enemy. If you can find one analogy, you can usually find its opposite.*

  **Question:** Is there a competing historical analogy that fits the facts equally well but suggests a different outcome?
  *   *Example:* If arguing "Vietnam" (quagmire), is there a "Grenada" (short, sharp success) or "Korea" (stalemate but containment) analogy that fits the structural facts?

  **Sufficient Answer:** If a rival analogy exists and is equally plausible, your analogy cannot support a *Prediction*. It can only support a *Warning* (one possible path among many). **Output: DOWNGRADE TO WARNING/RHETORIC.**

  ### Step 5: Final Disposition (3 Minutes)
  *Assign the output based on the Job (Step 1) and the Stress Test results.*

  | If Job Is... | And Engine Holds... | And Breakers Exist... | Output |
  | :--- | :--- | :--- | :--- |
  | **Prediction** | Yes | No | **EVIDENTIAL** (Can support probability assessment) |
  | **Prediction** | Yes | Yes | **RHETORIC ONLY** (Flag: "Plausible scenario, not forecast") |
  | **Prediction** | No | N/A | **DROP** |
  | **Warning** | Yes | Yes/No | **EVIDENTIAL** (Can support risk mitigation planning) |
  | **Justification** | Yes | No | **EVIDENTIAL** (Can support policy choice) |
  | **Justification** | Yes | Yes | **RHETORIC ONLY** (Flag: "Moral lesson, not strategic blueprint") |

  ***

  # Application to Your Three Cases

  Here is the AST run on the specific scenarios you provided.

  ### Case 1: Thucydides Trap (Great Power Rivalry)
  *   **Step 1 (Job):** **Prediction.** ("War is basically the default outcome.")
  *   **Step 2 (Engine):** Structural stress causes fear, which causes miscalculation.
  *   **Step 3 (Breakers):** Nuclear deterrence; deep economic integration; non-state actors. *Verdict:* These breakers fundamentally alter the cost-benefit analysis of war compared to pre-1945 cases. The engine is clogged.
  *   **Step 4 (Rival):** The "Long Peace" (1945–Present) or "Cold War" (Stalemate without hot war). Both fit the structural facts of nuclear-armed rivals better than the Peloponnesian War.
  *   **Step 5 (Disposition):** **DROP.**
      *   *Reasoning:* You are using it for *Prediction* (war is default). The Breakers (nukes) and Rivals (Long Peace) make this evidentially unsound.
      *   *Pivot:* You may keep it as **RHETORIC ONLY** if rephrased: "We face structural stress similar to X, which *historically* created high risk, though modern factors mitigate it." It cannot support the claim that war is the *default*.

  ### Case 2: Vietnam (Limited Intervention Trajectory)
  *   **Step 1 (Job):** **Warning.** ("It'll be popular at first and then grind us down.")
  *   **Step 2 (Engine):** Domestic political support for limited wars without clear victory conditions decays exponentially over time as costs rise.
  *   **Step 3 (Breakers):** All-volunteer force vs. Draft; 24-hour news cycle vs. delayed reporting. *Verdict:* These affect the *speed* of the decay, but not the *mechanism* of decay. The engine holds.
  *   **Step 4 (Rival):** "Gulf War 1991" (Clear objectives, exit strategy, sustained support). *Verdict:* Rival exists. This means the outcome isn't inevitable; it depends on management of objectives.
  *   **Step 5 (Disposition):** **KEEP AS EVIDENTIAL (WARNING).**
      *   *Reasoning:* Because the Job is *Warning* (not Prediction), the existence of a Rival doesn't kill it. It simply means the analogy supports *risk mitigation* (e.g., "To avoid the Vietnam trajectory, we must define exit criteria early").
      *   *Note:* Flag in internal notes that this applies to *domestic political sustainability*, not military feasibility.

  ### Case 3: Munich (Appeasement & Concessions)
  *   **Step 1 (Job):** **Justification.** ("We must not concede because it feeds appetite.")
  *   **Step 2 (Engine):** Concessions to an ideologically expansionist actor signal weakness, increasing their demand rate.
  *   **Step 3 (Breakers):** Is the current adversary ideologically expansionist (Hitler) or a rational security-seeker (Bismarck/Stalin)? *Verdict:* This is the critical judgment call. If the adversary is the latter, the engine does not exist. Concessions might actually sate them.
  *   **Step 4 (Rival):** "Versailles" (Punitive measures create resentment and future war) or "Détente" (Negotiation reduces tension).
  *   **Step 5 (Disposition):** **RHETORIC ONLY (FLAGGED).**
      *   *Reasoning:* Unless you have intelligence-grade certainty that the adversary is an existential/ideological aggressor (a high bar), the *Justification* fails. Using Munich to argue against *any* concession assumes the Hitler model is the default.
      *   *Recommendation:* You can use it to illustrate the *risk* of misreading an adversary, but you cannot use it as proof that concessions *will* fail. It is a mood setter, not a policy proof.

  ***

  # The Misfire Analysis: Where AST Fails

  You asked for honesty on where this procedure blocks valid insights. Here is the vulnerability assessment for your director.

  ### 1. The "Black Swan" Problem (False Negatives)
  **The Failure:** The AST relies on mapping causal mechanisms from the past. It will systematically penalize arguments that claim "This time is different."
  **Historical Example:** In 1989, an analyst arguing that the Soviet Union would collapse peacefully would have failed the AST. The "Engine" of regime collapse historically involved violence (1917, 1789). The "Breakers" (Gorbachev's restraint, nuclear stakes) would have been viewed as insufficient to override the historical engine of revolution.
  **Is this a bug?** No. It is a feature. The AST is designed to prevent *reckless* novelty, not to generate *brilliant* novelty. It prioritizes avoiding false positives (bad analogies) over false negatives (missed insights).
  **Mitigation:** Allow a "Dissenting View" attachment. If an analyst believes the AST is blocking a crucial insight because the situation is truly unique, they can bypass the procedure but must sign off on a "High Uncertainty" warning label.

  ### 2. The "Mechanism Blindness" Problem
  **The Failure:** Step 2 requires identifying a causal engine. Sometimes the "engine" is intuitive pattern recognition that experts cannot articulate in a single sentence within 5 minutes.
  **Historical Example:** George Kennan's "Long Telegram." The mechanism (Soviet internal insecurity drives external aggression) was novel and complex. A rushed AST might have flagged it as "Insufficient Engine" because it didn't match standard Great Power rivalry models.
  **Is this a bug?** Yes, but unavoidable in a 20-minute check.
  **Mitigation:** Senior Analysts (you) can override the Step 2 failure if the mechanism is elaborated in a separate annex. The checklist is for *memos*, not *book manuscripts*.

  ### 3. The "Rival Analogy" Trap
  **The Failure:** Step 4 asks for a rival analogy. In highly complex situations, *every* analogy has a rival. This can lead to "Analysis Paralysis" where every analogy gets downgraded to Rhetoric Only.
  **Historical Example:** 2003 Iraq. You could run "Munich" (Saddam is aggressive) and "Vietnam" (Quagmire). Both pass Step 2. Both have Breakers. The AST might output "RHETORIC ONLY" for both, leaving the decision-maker with no historical guidance.
  **Is this a bug?** No. It is an accurate reflection of reality. If history offers two equally strong but contradictory lessons, history is not evidential support. It is noise.
  **Mitigation:** Accept this. If the AST says "Rhetoric Only" on both sides, the decision must be made on *current* intelligence and strategic interest, not historical precedent. That is a win for the process, not a loss.

  ### Summary for the Director
  This procedure will not make us smarter. It will make us **less wrong.** It will not generate the next "Containment" doctrine, but it will stop us from writing memos that claim war is "inevitable" because of a Greek historian. It trades creative flair for disciplinary rigor. In a shop where "vibes" currently win meetings, that is a net gain.
