  Your intuitions are most coherently captured by the Principle of Constitutive Realization, which asserts that mental causation obtains only when the physical sufficient condition realizes the mental event, a commitment that forces you to abandon the verdict that numerically identical neural events can support different causal histories.

  The principle states: **A mental event causes a physical effect if and only if the physical process sufficient for that effect constitutively realizes the mental event, such that the mental and physical descriptions refer to the same causal occurrence rather than independent competing causes.** The clause requiring the physical process to be "sufficient for that effect" is motivated by your Severed Nerve verdict, ensuring that mere coincidence of intention and outcome is insufficient without the appropriate physical substrate doing the work. The clause requiring the physical process to "constitutively realize the mental event" is motivated by your Taxi case versus the Marksmen case; it explains why you reject overdetermination in the former (because the intention and neural activity are not independent, but rather one realizes the other) while accepting it in the latter (because the two shots are independent physical events).

  Applied to the case of the reflexive spasm coinciding with an intention, this principle predicts that the intention did **not** cause the rising, while the spasm did. Because the spasm is purely reflexive, it does not realize the intention; the physical sufficient condition (the spasm) and the mental event (the intention) are independent, unlike in the Taxi case. Since the movement arose solely through the spasm's mechanism, the intention lacks the constitutive link required for causation, making this a case of causal exclusion rather than overdetermination—the intention was present but causally inert regarding that specific movement.

  To maintain this coherent framework, you must give up your verdict regarding the two people with numerically identical neural events. If the neural events are truly identical in all intrinsic physical respects, their causal powers must be identical, because causal efficacy supervenes on physical properties. Your intuition that the causation differs conflates the *history* of the neural event (what caused the neuron to fire) with the *causal power* of the neural event (what the neuron causes next). In both the reflex and intentional cases, the neural event causes the movement in exactly the same way; the difference lies only in whether an intention caused the neural event, not in whether the neural event caused the movement. Retaining this verdict undermines the physical closure required to make sense of your rejection of overdetermination in the Taxi case, so you should accept that the causal relation between brain and body is invariant across these two scenarios, even if the agential status of the person differs.
