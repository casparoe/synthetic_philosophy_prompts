answer: |-
  Subject: Protocol for Object Unity and Identity Determination

  Dear Team,

  I am writing to address the inconsistency we have been facing regarding object counts in our cataloging, insurance, and loan workflows. As some of you know, I recently discussed this with a colleague in philosophy who pointed out that we are grappling with what is technically called the special composition question, which asks when a collection of parts constitutes a single whole rather than a mere aggregate. While we do not need to solve the metaphysics of parthood, we do need to acknowledge that there is often no single factual answer hidden inside the object itself. Instead, our count depends on the purpose of the count, whether that is scientific accuracy, insurance valuation, or physical storage. To stop relying on intuition, which varies from person to person, I am implementing a new determination procedure effective immediately. This protocol is designed to be run by an intern in approximately twenty minutes per item. It is not a magic truth-machine, and I need you to understand that several steps involve value judgments disguised as checkboxes. Where the procedure asks you to weigh intent against material reality, you are not discovering a fact but applying a convention. When you encounter those specific steps, if the answer is not obvious, you must escalate the decision to me or a curator rather than guessing.

  The procedure begins with the question of physical cohesion. Ask whether the components can be separated without causing damage to the material or requiring tools. If the items are physically disconnected, such as loose beads or unmounted coins, they are preliminarily classified as several objects unless they pass the next test. If they are attached, such as a skeleton mounted on an armature or a necklace with a clasp, they proceed to the functional unity test. Here you must ask whether the components lose their primary function or meaning if separated. A left shoe without a right shoe is still a shoe, but a pair of earrings loses its function as a set if separated. Be aware that this step is a real judgment dressed up as a checkbox because function is defined by us, not the object. If an intern decides the function is historical provenance rather than physical use, the answer changes. If the components function independently, classify as several. If they function only as a unit, classify as one catalog unit, noting the physical count in the remarks. If the item passes both physical and functional unity, you must then assess provenance origin. Ask whether the components originated from the same biological individual, manufacturing event, or archaeological context. If the components come from different sources, such as bones from different animals or shards from different pots, the item is a composite. This is the critical escalation point. If an item is a composite, you cannot terminate with a simple one or several verdict. You must flag it for curator review because counting a composite as one specimen may be useful for display but false for science.

  The second half of the procedure addresses identity over time, which handles objects that have been modified or restored. Ask whether any original material has been replaced. If no material is replaced, the object retains its original identity. If material is replaced, ask whether the replacement was done to preserve the object's structural integrity or to alter its appearance or species identification. If the replacement preserves integrity, such as a consolidated ceramic vessel, the object remains the same identity. If the replacement alters the species identity or historical truth, such as swapping a wolf skull for a dog skull on a mount, the object's identity is compromised. You must flag this as a policy call because it determines whether we are cataloging the historical artifact or the current display piece. Finally, if the object passes all previous steps but conflicts with external requirements, such as insurance policies that require single counts for composite displays, you must escalate. Do not force the object into a category that contradicts the provenance data to satisfy an external form. It is better to record the complexity and let us negotiate the insurance language than to falsify the catalog record.

  To demonstrate how this works in practice, I have run the procedure on three items currently in your backlog. First, consider the composite fossil skeleton that is partly reconstructed in plaster and partly borrowed from a second individual of the same species. Under the physical cohesion test, it is mounted as one unit. Under the functional unity test, it functions as one display skeleton. However, under the provenance origin test, the bones come from two different biological individuals. This triggers the composite flag. The procedure terminates here and escalates to me. I know I have told the insurer this is a single specimen for six years, but this procedure correctly identifies that scientifically it is not one specimen. It is a composite reconstruction. We cannot catalog it as a single biological specimen without lying about the provenance. We will need to create a record that reflects the composite nature, even if the insurance policy eventually requires us to aggregate the value. The procedure forces us to acknowledge the truth before we apply the convention.

  Second, consider the pair of earrings recovered from an archaeological dig and stored together for eighty years. They are physically separable without damage, so they initially appear to be several objects. However, under the functional unity test, they lose their meaning as a pair if separated, and under provenance origin, they come from the same context and manufacturing event. The procedure terminates with one catalog unit, noted as comprising two physical items. This aligns with our current practice and requires no escalation. Third, consider the taxidermy mount whose original skull was swapped for a replica during a 1970s restoration. Under the identity over time test, material has been replaced. The replacement was done to preserve the display integrity because the original skull was damaged, not to change the species identity. The procedure determines this is the same object identity as the original catalog entry, with a note in the conservation history regarding the replica skull. This also requires no escalation.

  I want to be clear that the fossil case is the one that should give us pause. It shows that this procedure will sometimes tell us that our past conveniences were scientifically inaccurate. That is the point. We are registrars, and our primary duty is to the truth of the collection, not to the ease of our paperwork. When the procedure flags a judgment call, do not try to solve it yourself. Send it to me. If we pretend this process is purely mechanical, the curators will never trust it, and rightly so. There are places where we must choose a convention, and those choices belong to leadership, not interns. Please begin using this workflow for all new accessions and backlog clearing starting next Monday. If you encounter an item where the functional unity contradicts the provenance origin, such as a display mount made of entirely unrelated species bones, treat that as a high-priority escalation. We will review these cases together in our monthly meeting to refine the policy where the objects reveal gaps in our rules. Thank you for your diligence in making our records as robust as the collections we care for.

  Best regards,

  Registrar
