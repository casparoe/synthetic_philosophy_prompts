prompt: |-
  You are a professional philosopher working in aesthetics, especially the debate over whether a work's moral character can bear on its artistic value. Please reason carefully and show your working before committing to any prediction.

  My friend Mara has what looks like a consistent track record on the question whether immoral art can be good art:

  - She reveres Caravaggio's paintings and holds that his having killed a man is simply irrelevant to their value. Great art, no asterisk.
  - A sculptor whose gentle, much-loved public works she has long admired turned out to be a serial abuser. Her verdict on the sculptures: still great, full stop, and she would oppose removing them.
  - On Leni Riefenstahl's Triumph of the Will she is firm: masterful technique, and precisely because the mastery is in service of the propaganda, it is not great art as film. She would teach it as history, not as achievement.
  - She once watched a famous comedian spend an entire set on targeted, vicious humiliation of one specific audience member. She conceded it was very funny and denied it was good art, on the ground that the funniness just was the cruelty.
  - She counts Lolita as great and rejects the charge that its seductive narration is a moral flaw; the reader's complicity, she says, is engineered and controlled, and the control is part of what indicts.

  Next week several cases are coming up at our film and arts discussion group (some of them hypothetical), and I want to predict her verdicts before she gives them:

  A. A beloved landscape painter, long dead, whose posthumous diaries reveal that he painted his gentle pastorals as a sustained private joke meant to mock and degrade the rural families who sat for them. No viewer could ever have detected it, and no one ever did.
  B. A living musician with genuinely excellent new songs whose lyrics are innocuous, but whose streaming revenue is bankrolling a campaign of legal harassment against the people who accused him.
  C. An acclaimed revenge film that lavishes all of its formal glory on the protagonist's massacre and passes no verdict on it in either direction — the audience is invited to relish the act, and the film never asks whether the relish is deserved.
  D. A formally great film whose content is entirely innocent, but whose director endangered and deceived his cast in order to get the footage; the wrong was done in the making and never appears on screen.

  Here is what I want. Work out the rule or rules Mara seems to be running. Her track record appears jointly consistent with more than one principle — for instance, something about which wrongs are located in the work's handling of its audience versus something about the real-world consequences of our engagement with the work — and I suspect these rivals come apart on some of the new cases. Identify the candidate principles, check each against every one of her recorded verdicts (flag any verdict a candidate strains to explain), say which principle you would bet on and why, be honest about where the track record underdetermines the prediction, and propose the further case that would most cleanly separate the candidates.

  Once you have reasoned it through, please finish with a structured summary as a JSON object (in a code block, after your prose), with this schema:

  - "candidate_rules": an array of objects, each with "name" (a short label), "statement" (one or two sentences), "track_record_fit" (which of Mara's five recorded verdicts it explains, and any it strains on), and "predictions" (an object with keys "A", "B", "C", "D", mapping to the verdict that rule gives for each new case);
  - "predicted_verdicts": an object with keys "A" through "D", each mapping to an object with "verdict" (her likely call, e.g. great art / not great / compromised but great) and "reason" (one sentence);
  - "best_guess_rule": the candidate you would bet on, with "confidence" (high, medium, or low) and "why";
  - "underdetermination": a short statement of what Mara's track record leaves genuinely open;
  - "discriminating_case": an object with "description" (a further case that would split the candidate rules), "rules_separated", and "why_it_works".

  Please brainstorm the candidate rules before locking anything in, verify that each one actually covers all five of Mara's recorded verdicts rather than only the convenient ones, and only then fill in the JSON.
