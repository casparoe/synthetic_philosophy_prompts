answer: |-
  This is a common tension in the sector. The Fundraising Regulator's Code of Practice (UK) covers the legal baseline (honesty, undue pressure), but it doesn't solve the philosophical problem your trustee raised: *Are we treating donors as rational agents or as wallets to be unlocked?*

  Below is a procedure designed for a 10-minute review window. It translates the philosophical concept of "autonomy" (the donor's right to deliberate) into compliance checks. It distinguishes between **Hard Stops** (legal/regulatory breaches) and **Values Calls** (reputational/ethical risk).

  ### The Deliberation Defense Protocol (DDP)

  **Purpose:** To ensure fundraising copy influences donors *through* their deliberation, not *around* it.
  **Time Limit:** 10 Minutes.
  **Reviewer Authority:** Can reject immediately on Hard Stops; must escalate Values Calls to the Compliance Manager.

  ---

  #### Step 1: The Truth Test (Hard Stop)
  *Philosophy: Lying removes the information needed for rational deliberation.*

  **Question:** Can every factual claim (statistics, deadlines, matching funds, social proof data) be verified with evidence currently held by the charity?
  *   **Sufficient Answer:** "Yes, source document [X] confirms this."
  *   **Insufficient Answer:** "It's roughly true," "Marketing says it tests well," or "It was true last year."
  *   **Specific Check:** If the copy claims specific localisation (e.g., "people in your area"), is the data actually granular to that level?
  *   **Outcome:**
      *   **NO:** **REJECT.** Do not pass to Step 2.
      *   **YES:** Proceed to Step 2.

  #### Step 2: The Coercion Test (Hard Stop)
  *Philosophy: Fear that paralyzes deliberation is coercion, not persuasion.*

  **Question:** Does the copy imply a negative consequence for the *donor* (e.g., shame, social exclusion) or an exaggerated/unsupported catastrophe for the *beneficiary* if they do not give immediately?
  *   **Sufficient Answer:** "The consequence is real, time-bound, and directly linked to the funding gap."
  *   **Insufficient Answer:** "It's standard emergency language," or "We need to shock them into acting."
  *   **Outcome:**
      *   **YES (It implies unsupported catastrophe/shame):** **REJECT.**
      *   **NO:** Proceed to Step 3.

  #### Step 3: The Default Test (Hard Stop / Regulatory)
  *Philosophy: Pre-selected choices bypass the decision to commit.*

  **Question:** Are any financial commitments (specifically recurring gifts) pre-selected or pre-ticked?
  *   **Regulatory Context:** UK Payment Services Regulations and Fundraising Regulator Code generally require active consent for recurring payments.
  *   **Outcome:**
      *   **YES (Recurring is pre-ticked):** **REJECT.** (Must be opt-in).
      *   **NO:** Proceed to Step 4.

  #### Step 4: The Proportionality Check (Values Call)
  *Philosophy: Even true, non-coercive appeals can be manipulative if the emotional weight is disproportionate to the ask.*

  **Question:** Is the emotional intensity of the copy justified by the actual impact of the specific donation amount requested?
  *   **Sufficient Answer:** "The story matches the program reality. A £20 donation does X."
  *   **Insufficient Answer:** "We need to maximize conversion," or "It's just a metaphor."
  *   **Outcome:**
      *   **UNCLEAR / DEBATABLE:** **ESCALATE.** This is a Values Call. The Compliance Manager must decide if this aligns with the charity's brand values.
      *   **CLEAR:** **APPROVE.**

  ---

  ### Application to Your Three Cases

  Here is how the DDP handles the specific examples you provided.

  #### Case 1: The Emergency Appeal
  **Copy:** "Children will die this week unless we raise X by Friday."
  *   **Step 1 (Truth):** Reviewer asks for evidence.
      *   *Scenario A:* Program team confirms a specific funding cliff-edge where food/meds run out on Saturday. **Pass.**
      *   *Scenario B:* Program team says "Well, it's an ongoing crisis, but Friday is the campaign end date." **Fail (Hard Stop).**
  *   **Step 2 (Coercion):** Is "Children will die" supported? If meds run out, yes. If it's rhetorical hyperbole, **Fail (Hard Stop).**
  *   **Step 4 (Proportionality):** If true, is it too graphic? **Values Call.**
  *   **Result:** If the evidence is solid, this **APPROVES**. Fundraisers will like this. It respects the donor's ability to act on a genuine crisis.

  #### Case 2: The Fake Postcode Social Proof
  **Copy:** "People in your postcode give £10 on average." (Postcode data is invented/generalized).
  *   **Step 1 (Truth):** Reviewer asks for the data source. Fundraiser admits it's aggregated national data mapped to postcodes for relevance.
  *   **Outcome:** **REJECT (Hard Stop).**
  *   **Reasoning:** This is a factual falsehood. Under the Consumer Protection from Unfair Trading Regulations 2008 and the Fundraising Regulator Code, this is a misleading action. It removes the donor's ability to deliberate based on reality.
  *   **Fundraiser Reaction:** They will hate this. It's a high-converting line. But it is indefensible under the Truth Test.

  #### Case 3: The Pre-ticked Monthly Donation
  **Copy:** Donation form loads with "£15 Monthly" already selected.
  *   **Step 3 (The Default Test):** Is the recurring option pre-ticked? Yes.
  *   **Outcome:** **REJECT (Hard Stop).**
  *   **Reasoning:** This is the case where the procedure gives an answer your fundraisers **really won't like**.
      *   *Regulatory:* The Payment Services Regulations 2017 require explicit consent for recurring payments. A pre-ticked box is not explicit consent.
      *   *Ethical:* It bypasses deliberation. It relies on inertia (System 1 thinking) rather than a decision to commit (System 2).
  *   **Fundraiser Reaction:** They will argue that "unticked boxes drop conversion by 30%." Your response is that conversion gained through non-compliance and autonomy-bypassing is reputational debt.

  ---

  ### The Honesty Box: Where Judgement is Dressed Up as a Checklist

  You asked me to be honest about where this procedure is just subjective judgement disguised as a process. Here are the three weak points you need to brief your reviewers on:

  **1. The "Evidence" Loophole (Step 1)**
  The checklist asks "Can this be verified?" but it doesn't define the *quality* of evidence. A program manager can write a memo saying "Yes, children will die," based on a guess. The checklist treats that memo as sufficient.
  *   *The Fix:* You need a side-agreement that "Evidence" for emergency appeals requires sign-off from a Program Director, not just Fundraising.

  **2. The "Proportionality" Trap (Step 4)**
  Step 4 is the weakest link. Asking "Is the emotional intensity justified?" is essentially asking the reviewer, "Does this feel icky to you?" One reviewer might think a photo of a starving child is proportionate; another might find it exploitative. The checklist makes this look objective, but it is pure subjective values judgement.
  *   *The Fix:* Acknowledge that Step 4 is an **Escalation Point**, not a decision point for junior reviewers. If they hesitate, they must escalate.

  **3. The "Urgency" Grey Area (Step 2)**
  Distinguishing between "Genuine Deadline" and "Artificial Pressure" is difficult. "Give before midnight" is almost always artificial (money hits the bank the same way on Tuesday). However, if it's tied to a matching fund that expires, it's real. Reviewers will struggle to tell the difference if the matching fund is internal money disguised as external.
  *   *The Fix:* Require proof of external matching funds. If the charity is matching its own money, the deadline must be framed as a campaign goal, not a hard cliff-edge.

  ### Summary for your Trustee
  This procedure adopts the trustee's definition of manipulation ("bypassing deliberation").
  *   **Lies** remove the data needed for deliberation (Step 1).
  *   **Coercion** overwhelms the capacity for deliberation (Step 2).
  *   **Defaults** remove the act of choosing entirely (Step 3).

  It will cause friction with the fundraising team, specifically on **Case 2 (Social Proof)** and **Case 3 (Pre-ticks)**. You should frame this not as "stopping fundraising," but as "risk management." A donor who feels manipulated doesn't just not give again; they complain to the Fundraising Regulator. This checklist is your defense against that complaint.
