          *   Ethics: Bypasses deliberation.
          *   Outcome: Fail on Step 1 (Legal/Compliance) or Step 3 (Autonomy). This is a strong "Fundraisers won't like this" candidate too, but the fake postcode is more ethically blatant. Let's use the Pre-ticked box as the "Legal/Compliance Hard Stop" because it's actually illegal/unenforceable in many contexts now, whereas the postcode is just lying. Actually, the Fundraising Regulator Code says "Do not use pre-ticked boxes." So it's a hard stop.
          *   *Decision:* I need *one* case where the procedure gives an answer fundraisers won't like. The fake postcode is an obvious lie (Hard Stop). The pre-ticked box is a regulatory breach (Hard Stop). The Emergency Appeal is the one that might be contentious. Let's make the Emergency Appeal the "Values Call" that gets rejected because the evidence is thin, or the Pre-ticked box be the one they hate because it converts well.
          *   *Better approach:* The prompt asks for *one* case where the procedure gives an answer fundraisers won't like. The fake postcode is a lie, so they *shouldn't* like it, but they know it's risky. The pre-ticked box is a conversion killer. Let's make the Pre-ticked Monthly the one they hate (because it hurts revenue) and the Postcode one a clear lie (easy reject). Wait, the prompt says "Include one case where the procedure gives an answer our fundraisers won't like." I can choose which one. The Pre-ticked box is the most common friction point. I will rule that as a "Fail" based on autonomy/regulation.

