      *   *Step 1: Truth & Accuracy (The Hard Stop).* If it's a lie, it's out. No debate.
      *   *Step 2: Pressure & Coercion (The Hard Stop).* If it threatens harm or creates undue distress, it's out.
      *   *Step 3: Autonomy & Choice (The Grey Area).* Does this bypass deliberation? (Pre-ticks, dark patterns).
