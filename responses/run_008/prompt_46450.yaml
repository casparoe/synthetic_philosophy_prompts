      *   *Regulation:* UK Fundraising Regulator Code of Practice (specifically sections on "Donor Choice," "Honesty," "Undue Pressure"). GDPR/PECR (privacy/consent). Consumer Protection from Unfair Trading Regulations 2008 (misleading actions/omissions).
