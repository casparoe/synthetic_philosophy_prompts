answer: |-
  ### Desiderata for a Principled Boundary of the Demos

  To evaluate any proposal for constituting the demos, the following five desiderata must be met. These are not mere policy preferences but normative requirements derived from the specific hard cases identified. Each requirement specifies *what* must be achieved, not necessarily *how*.

  #### 1. The Anti-Coercion Requirement
  *   **Case:** Long-term resident noncitizens.
  *   **Rationale:** A core democratic intuition is that permanent subjection to coercive law without a voice constitutes a form of tyranny or domination. If an individual is habitually subject to the state's legal order, pays taxes, and builds a life within its jurisdiction, excluding them from the franchise creates a class of subjects without citizens.
  *   **Status:** **Non-negotiable.** Any theory that permanently excludes long-term residents from all forms of political voice fails the basic liberal-democratic test of legitimacy. It matters less whether they receive full voting rights or a distinct form of representation, but they cannot be wholly excluded.

  #### 2. The Agency and Capacity Requirement
  *   **Case:** Children and persons with profound cognitive disabilities.
  *   **Rationale:** Democratic decision-making presupposes the capacity to form, express, and revise a will. While interests must be protected, the act of *deciding* requires agency. Including persons who cannot conceptually grasp the nature of the choice undermines the integrity of the decision as a collective *act*.
  *   **Status:** **Non-negotiable.** A demos must consist of agents capable of exercising judgment. This does not justify neglecting the interests of children or the disabled (which must be protected via guardianship or trusteeship), but it requires a boundary that distinguishes between *having interests* and *exercising sovereignty*.

  #### 3. The Causal Responsibility Requirement
  *   **Case:** Future people (climate/constitutional) and external persons (emissions/sanctions).
  *   **Rationale:** Justice requires that those who bear the consequences of a decision have a claim on the decision-makers. If a collective decision imposes catastrophic harm on future generations or foreign populations (via climate change or economic sanctions) without their input, the decision lacks moral justification.
  *   **Status:** **Negotiable (on mechanism, not weight).** It is non-negotiable that these interests count morally. However, it is negotiable whether this requires direct enfranchisement (e.g., voting proxies for the future) or indirect representation (e.g., ombudsmen, constitutional constraints). A theory fails if it ignores these interests entirely, but it need not grant them equal voting weight to present citizens.

  #### 4. The Administrative Clarity Requirement
  *   **Case:** Tourists and transiently subjected persons.
  *   **Rationale:** A boundary must be knowable and stable enough to be administered. If every person momentarily subject to a law (e.g., a tourist driving a car) were entitled to a say in that law's creation, the electoral roll would be in constant flux, making collective action impossible.
  *   **Status:** **Non-negotiable.** A functional demos requires a stable membership list. A theory that demands a referendum every time a tourist crosses a border is practically incoherent. The boundary must track a durable status, not momentary presence.

  #### 5. The Collective Self-Determination Requirement
  *   **Case:** Persons outside the territory powerfully affected by decisions (e.g., monetary policy).
  *   **Rationale:** Democracy is not only about justice for the affected; it is also about a group's right to define itself. If a community cannot exclude those with whom it does not share a political project, it loses the capacity for self-government. Total openness dissolves the "self" in self-determination.
  *   **Status:** **Negotiable.** The scope of the "self" is the very thing in dispute. However, a theory must preserve *some* capacity for a group to make binding decisions that are not vetoed by the entire world.

  ***

  ### Structural Incompatibility: The Underdetermination of the Boundary

  The boundary problem is not merely unsolved; it is structurally underdetermined because **The Causal Responsibility Requirement** and **The Collective Self-Determination Requirement** cannot be jointly satisfied to their fullest extent.

  *   **The Conflict:** To fully satisfy the **Causal Responsibility Requirement** (driven by the climate and external sanctions cases), the demos must expand to include everyone significantly affected by a decision. Since economic and ecological decisions have global ripple effects, this pushes the boundary toward a global demos. However, to fully satisfy the **Collective Self-Determination Requirement**, the demos must remain bounded enough to distinguish "us" from "them," allowing a specific group to pursue its own conception of the good even when it negatively impacts outsiders.
  *   **Why it is Incompatible:** If you prioritize Causal Responsibility, you dissolve the bounded community necessary for Self-Determination (every decision becomes a global decision). If you prioritize Self-Determination, you inevitably violate Causal Responsibility (the community votes to impose costs on outsiders who have no say).
  *   **Implication:** No theory can maximize both. A defensible theory must explicitly trade off one against the other. This shows the boundary problem is not a puzzle waiting for a solution, but a tragic conflict between democratic legitimacy (rooted in the affected) and political autonomy (rooted in the bounded).

  ***

  ### Evaluation of Existing Principles Against the Desiderata

  **The All-Affected Principle (AAP):**
  AAP performs well on the **Causal Responsibility Requirement** (including future and external persons) but fails the **Administrative Clarity** and **Collective Self-Determination Requirements**. Because "affectedness" is fluid and issue-specific, AAP cannot generate a stable demos for constitutional decisions (violating Clarity) and potentially subjects local decisions to global vetoes (violating Self-Determination). It also struggles with the **Agency Requirement**, as it grants voice to those who may lack political capacity (e.g., future generations) without a clear mechanism for exercising it.

  **The All-Subjected Principle (ASP):**
  ASP satisfies the **Anti-Coercion Requirement** robustly (including long-term residents) and maintains **Administrative Clarity** (legal subjection is usually binary and stable). However, it fails the **Causal Responsibility Requirement** regarding external persons and future generations. A state can legally subject only its citizens while emitting carbon that destroys islands abroad; under ASP, those islanders have no claim on the demos, violating the intuition of justice driven by impact.

  **The Demos-of-the-Demos View (Pre-existing People):**
  This view (legitimacy flows from a pre-political ethnic or historical group) maximizes **Collective Self-Determination** and **Administrative Clarity**. However, it catastrophically fails the **Anti-Coercion Requirement**. By defining the demos prior to the decision on who belongs, it inevitably excludes long-term residents who are subject to law but not part of the "pre-existing" people, legitimizing permanent second-class status. It also typically ignores the **Causal Responsibility Requirement** regarding outsiders.

  **Conclusion:** Each dominant principle satisfies a subset of the non-negotiable desiderata while violating others. The structural incompatibility identified above ensures that no single principle can deliver a verdict that aligns with all concrete cases simultaneously.
