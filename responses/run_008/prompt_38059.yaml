          *   *CS Analogy:* Axioms in a logic system. Or the hardware layer.
          *   *The Bend:* In CS, axioms are chosen for utility/consistency. In Foundationalism, they are chosen because they *cannot be wrong*. The "trust" is intrinsic, not extrinsic.
          *   *Key Question:* Is the kernel audited? Yes, but the audit isn't external; it's the nature of the kernel itself.

