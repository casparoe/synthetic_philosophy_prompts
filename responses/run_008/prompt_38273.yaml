              *   *Right:* Intentionality objection to pure feeling theories is standard and correct.
              *   *Wrong/Confused:* Conflating James/Prinz (Somatic/Feeling theories) with Perceptual Theories. James is typically classified under Somatic/Feeling theories (or at least the precursor to them), *not* the contemporary "Perceptual Analogy" theory (like Dokic, Tappolet, etc.). Contemporary Perceptualism argues emotions are *like* perceptions of value, not perceptions of *bodily changes*. Prinz is a Neo-Jamesian, which is usually grouped closer to the Feeling/Somatic side regarding the *constituents* of emotion, though he calls it an "embodied appraisal." Calling James a "Perceptual Theorist" in the context of the triad (Judgment vs. Perception vs. Feeling) is a category error. Usually, "Perceptualism" in this specific debate refers to the analogy between emotion and sensory perception of properties (e.g., fear perceives danger), whereas James says fear *is* the perception of the body. This is a significant conceptual muddle.
              *   *Nuance:* The distinction between "Feeling Theory" and "Jamesian Perceptual Theory" is blurred here. If Feeling Theory = raw qualia and Perceptual = intentional awareness of body, that's a distinction, but standard taxonomy usually groups James with Feelings/Somatic against Cognitivism (Judgment/Perception of Value).

