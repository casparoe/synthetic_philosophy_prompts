              *   *Wrong/Misleading:* Attributing the goal of *apatheia* (elimination of emotion) to Robert Solomon is a significant error. Solomon was a defender of emotions as valuable, not something to be eliminated. He argued *against* the Stoic view that emotions are irrational disturbances. He wanted to rehabilitate emotions, not eliminate them. This is a major historical/textual error for a 3rd-year course.
