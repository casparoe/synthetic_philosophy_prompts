      *   *Refining the Fact/Value distinction:* It's not just "fact vs. value." It's about the *nature of the property*. Aesthetic properties require a subjective response to be apprehended.
      *   *Kant's Influence:* Mention Kant briefly as the root of the "autonomy" idea, but keep it accessible.
      *   *The "Why":* Why do philosophers care? Because aesthetic judgment is supposed to be autonomous. Relying on others undermines the agency of the judger.

  6.  **Final Polish:**
