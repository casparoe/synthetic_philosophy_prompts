answer: |-
  You have identified a genuine fracture point in the community's rhetoric. "Rationalists should win" is a **motte-and-bailey slogan**. In the motte (defensive position), it is a tautology about instrumental convergence. In the bailey (offensive position), it is used to smuggle in specific, controversial decision-theoretic claims (like Timeless Decision Theory) without arguing for them explicitly.

  The reason it fails to settle the Parfit's Hitchhiker vs. Eye-Gouging debate is that the slogan does not specify the **domain of optimization** or the **decision algorithm**.

  Here is the precisification of the distinct claims packed into "Rationalists should win," with verdicts on their utility in these specific disputes.

  ### 1. The Semantic Claim (The Definition)
  *   **Claim:** The word "rationality" is *defined* as "the systematic pursuit of winning." If a strategy wins, it is by definition rational.
  *   **Plausibility:** High (pragmatically). It aligns with the instrumental view of reason.
  *   **Triviality:** **Tautological.** It renders the sentence "Rationalists should win" equivalent to "People who win should win."
  *   **Verdict on Debates:** **Settles Nothing.**
      *   *Hitchhiker:* Both sides agree they want to win. The dispute is about *which disposition* actually wins (paying vs. not paying). This claim offers no leverage to determine the physics/logic of the scenario.
      *   *Eye-Gouging:* Both sides agree they want to win. The dispute is whether gouging eyes counts as "winning" (winning the bet vs. losing the utility of sight).
      *   *Work Done:* None. It is a terminological stipulation, not an argument.

  ### 2. The Empirical Claim (The Generalization)
  *   **Claim:** Standard rationality techniques (Bayesian updating, Causal Decision Theory, calibration) *causally lead* to better outcomes in the actual world than intuition or dogma.
  *   **Plausibility:** Generally high, but **False in Newcomblike Problems.** In scenarios involving predictors (Hitchhiker, Newcomb, Prisoner's Dilemma with clones), standard Causal Decision Theory (CDT) loses to agents using precommitments.
  *   **Triviality:** Non-trivial empirical claim.
  *   **Verdict on Debates:** **Fails to Settle.**
      *   *Hitchhiker:* This is exactly where the empirical claim breaks. A "standard" rationalist (CDT) arrives in the city and reasons "I have the ride, paying changes nothing, so I won't pay." But because the driver predicted this, they never got the ride. The slogan implies you should use the method that wins, but if "standard rationality" loses, this claim suggests you should abandon standard rationality.
      *   *Eye-Gouging:* Empirically, gouging eyes reduces your ability to navigate the world. This claim blocks eye-gouging, but only because we already know eyes are useful. It doesn't solve the structural logic of *why* one precommitment is valid and the other isn't.

  ### 3. The Decision-Theoretic Claim (UDT/TDT)
  *   **Claim:** Rationality requires using a decision theory (like Timeless or Updateless Decision Theory) that treats your *algorithm* as the object of choice, accounting for logical correlations with predictors.
  *   **Plausibility:** High within the Sequences/ MIRI framework, controversial elsewhere.
  *   **Triviality:** Non-trivial technical claim.
  *   **Verdict on Debates:** **Settles Both (Correctly).**
      *   *Hitchhiker:* This claim identifies that the "act" of paying is less important than the "type" of agent you are. To win, you must be the *type* who pays. (Note: The thread you read likely had the direction wrong; in standard Hitchhiker, the agent who modifies themselves to *not* pay gets left in the desert. The winning modification is to become the type who *does* pay).
      *   *Eye-Gouging:* This claim blocks eye-gouging. UDT/TDT optimizes for the *output of the algorithm*. An algorithm that says "blind myself to win bets" has a low expected output because the cost of blindness outweighs the bet winnings. It distinguishes between *causing* the truth of a proposition (bad) and *being correlated* with the truth of a proposition (good).
      *   *Work Done:* **Real Work.** This is the only interpretation that actually resolves the tension, but it requires importing heavy decision-theory machinery that the slogan itself hides.

  ### 4. The Policy-Level Claim (Acts vs. Dispositions)
  *   **Claim:** Rationality is about selecting the best **policy** (precommitment/disposition) ex-ante, not the best **act** ex-post.
  *   **Plausibility:** High. This is the core insight of the "Sequences" update on game theory.
  *   **Triviality:** Non-trivial. It contradicts naive Causal Decision Theory.
  *   **Verdict on Debates:** **Settles Both.**
      *   *Hitchhiker:* Ex-post (in the city), not paying is the winning *act*. Ex-ante (in the desert), "being a payer" is the winning *policy*. The slogan, read this way, mandates you optimize the policy.
      *   *Eye-Gouging:* Ex-ante, the policy "preserve vision" dominates the policy "blind myself for bet wins." The slogan forces you to evaluate the whole life-utility, not the isolated bet.
      *   *Work Done:* **Real Work.** This is the operational engine behind the slogan. However, it requires the listener to understand the distinction between act and policy, which is often elided.

  ### 5. The Ex-Ante Expectation Claim (EV vs. Outcome)
  *   **Claim:** "Winning" means maximizing **Expected Utility** at the time of decision, not guaranteeing the best **Realized Outcome** (which can be affected by luck).
  *   **Plausibility:** Standard decision theory.
  *   **Triviality:** Somewhat trivial (definition of Expected Utility).
  *   **Verdict on Debates:** **Partial Settlement.**
      *   *Hitchhiker:* Helps clarify that you shouldn't regret paying if you get the ride, because the *expectation* was positive. But it doesn't fully solve the "modify yourself" argument without Claim #4.
      *   *Eye-Gouging:* Strongly blocks this. The EV of gouging eyes is negative, even if you win the specific bet.
      *   *Work Done:* **Moderate.** It stops people from using "I won the bet" to justify "Gouging was rational," but it doesn't fully explain the precommitment logic in Hitchhiker on its own.

  ---

  ### Summary Verdict: Is it doing real work?

  **Mostly No.** In isolation, "Rationalists should win" is a **vibes-statement**.

  1.  **It is under-specified:** Without importing **Claim #3 (Decision Theory)** or **Claim #4 (Policy Level)**, the slogan cannot distinguish between Parfit's Hitchhiker (where precommitment wins) and Eye-Gouging (where precommitment loses). Both involve modifying yourself to affect an outcome.
  2.  **It is often used backwards:** As you noted in your thread, people use it to argue for *any* precommitment that sounds clever, even if they have misanalyzed the payoff matrix (e.g., thinking "not paying" wins in Hitchhiker).
  3.  **The Real Work is Hidden:** When the slogan *does* settle a debate, it is because the speaker is implicitly invoking **Updateless Decision Theory** or **Policy Optimization**. The slogan is the *conclusion* of that machinery, not the machinery itself.

  **Recommendation:** When you hear the slogan, mentally translate it to: *"You should optimize your decision algorithm for expected utility across all possible worlds, including those where your algorithm is predicted by others."* If the speaker isn't willing to make that precise claim, the slogan is doing no work.
