  6.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I say *tarka* is inference? No, must distinguish. *Tarka* is hypothetical; *Anumāna* is categorical based on *vyāpti*.
      *   *Check:* Did I address the "parasitic" claim correctly? Yes, *śabda* is also dependent, but Nyāya treats the *word* as the instrument. *Tarka* is a *process* of reasoning, not an instrument of contact.
      *   *Check:* Is the "wishful thinking" objection valid? Yes, *kutarka* (false reasoning) is a known category in Nyāya. Priya's distinction is valid but doesn't solve the structural issue.
      *   *Check:* What about Gaṅgeśa? He defines *pramāṇa* as the *karana* (instrumental cause). Is *tarka* the *karana*? No, the *karana* for inference is the knowledge of *vyāpti*. *Tarka* helps secure that knowledge.

  7.  **Final Polish:** Organize with clear headings. Ensure the "What They Miss" section adds value beyond just summarizing the rounds. (Make sure to mention *arthāpatti* and the specific role of doubt removal).

