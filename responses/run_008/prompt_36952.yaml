      *   *Round 3 Analysis:* The Wishful Thinking/Impossibility point. Priya clarifies, but Marcus's underlying epistemic worry stands. It's a draw/stalemate, but Priya defends better.
      *   *What They Miss:*
          1.  *Tarka* as *Sahakāri* (Assistant): It's not about *producing* truth but *clearing doubt*.
          2.  *Arthāpatti:* The Mīmāṃsā comparison is relevant.
          3.  *Vyāpti-graha:* How universals are actually known (perception + non-observation). *Tarka* supports this but isn't the root.
          4.  *Textual Specifics:* Nyāya-sūtra 1.1.1 vs. later Navya-Nyāya refinements.
      *   *Conclusion:* Summarize the philosophical stalemate.

  5.  **Refining the Tone:**
