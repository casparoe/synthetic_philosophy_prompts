answer: |-
  This is a sophisticated dispute that cuts to the heart of Nyāya epistemology. Priya and Marcus have effectively reconstructed a debate that has played out between Naiyāyikas and their Mīmāṃsaka opponents for centuries, though they are framing it in contemporary analytic terms. Neither is entirely wrong, but they are talking past each other on specific technical definitions.

  Here is the round-by-round adjudication, followed by an analysis of what both are missing regarding the texts and the theory of *pramāṇa*.

  ### Round 1: The Definition of *Pramāṇa*
  **Priya:** *Tarka* produces settled, confident knowledge of *vyāpti* (concomitance). If a *pramāṇa* is a means of genuine knowledge, and *tarka* yields that, it should be a *pramāṇa*. Furthermore, inference rests on it; demoting it to "accessory" ignores its structural weight.
  **Marcus:** *Tarka* is parasitic. It borrows truth from other *pramāṇas* (perception, etc.) to show a negation is untenable. It doesn't show truth directly, only the impossibility of the opposite.

  **Verdict: Marcus wins on textual grounds; Priya wins on phenomenological grounds.**

  **Why:** Priya is correct that *tarka* yields a cognitive state that feels like knowledge (*niścaya*). In practice, when one sees that "if fire weren't the cause of smoke, smoke would appear without fire (which it doesn't)," one feels convinced. However, Marcus is closer to the classical Nyāya definition of a *pramāṇa*. For the Nyāya, a *pramāṇa* must be the *karana* (instrumental cause) of a cognition that corresponds to reality (*yathārtha*). *Tarka* does not establish the correspondence itself; it merely removes the obstacle (doubt) that prevents the correspondence from being recognized. Marcus correctly identifies that *tarka* lacks independent truth-tracking power; it is truth-preserving, not truth-generating. Priya's argument that "it bears the weight" is pragmatic, but Nyāya ontology is causal, not pragmatic.

  ### Round 2: The Testimony (*Śabda*) Analogy
  **Priya:** Testimony is also parasitic (depends on the speaker's knowledge), yet it is a *pramāṇa*. *Tarka* is the immediate cause of cognition in me, just as hearing a statement is.
  **Marcus:** Analogy fails. Testimony is a general channel based on a standing relation to a trustworthy speaker. *Tarka* is a private mental maneuver piggybacking on inputs.

  **Verdict: Priya wins this exchange.**

  **Why:** Marcus's distinction here is weak. In Nyāya, *śabda* (testimony) is valid for the hearer not because of a "standing relation" in the abstract, but because the *statement itself* functions as the instrument of knowledge, provided the speaker is competent (*āpta*). Priya is right to point out the structural parity: in both cases, the cognizer relies on content generated elsewhere (by the speaker, or by prior perceptions feeding the *tarka*). If dependence disqualifies *tarka*, it should disqualify *śabda*. Marcus tries to salvage this by calling *tarka* "private," but all cognition is private in Nyāya. He fails to explain why the *dependence* in testimony is acceptable but in *tarka* is not. Priya successfully exposes an inconsistency in Marcus's criterion of "parasitism."

  ### Round 3: Wishful Thinking vs. Logical Impossibility
  **Marcus:** (Implied) If *tarka* is a *pramāṇa*, any reasoning that rules out a negation counts, opening the door to bias (e.g., "It can't be raining because I want a picnic").
  **Priya:** There is a principled line. *Tarka* requires logical impossibility (*prasanga*), not pragmatic undesirability.

  **Verdict: Draw (Priya defends well, but Marcus's worry remains valid).**

  **Why:** Priya is textually correct here. Classical Nyāya defines *tarka* specifically as showing that the opposite position leads to an *aniṣṭa-prasaṅga* (an unwanted/absurd consequence that violates established reality), not merely an inconvenient one. She successfully blocks the "wishful thinking" objection. However, Marcus's underlying intuition remains unrefuted: even if we distinguish *good tarka* from *bad tarka* (kutarka), does the *good* version generate knowledge, or does it merely clear the field? Priya proves *tarka* can be reliable, but she hasn't proven it is a *source* of knowledge rather than a *filter*. Marcus senses this distinction but lacks the vocabulary to pin it down in this round.

  ---

  ### What Both Are Missing

  While Priya and Marcus have staged a compelling dialectic, they are both operating with a slightly flattened view of the Nyāya tradition. There are three crucial elements missing from their exchange that would resolve the stalemate.

  #### 1. The Specific Role of *Sahakāri* (Assistant Cause)
  Both speakers assume a binary: either *tarka* is a *pramāṇa* (full cause) or it is nothing. They are missing the intermediate category of *pramāṇa-sahakāri* (assistant to the means of knowledge).
  In Nyāya ontology, for a cognition to arise, you need a *karana* (instrumental cause). For inference, the *karana* is the knowledge of *vyāpti* (the universal relation). *Tarka* is not the *karana* of the cognition of the object; it is the *karana* of the **removal of doubt** (*saṃśaya*).
  *   **Correction:** Priya is right that *tarka* causes a change in mental state (certainty). Marcus is right that it doesn't contact the object. The solution is that *tarka* causes *certainty about the premise*, which then allows *anumāna* (inference) to function as the *pramāṇa* for the conclusion. It is the grease, not the engine.

  #### 2. The Mīmāṃsā Shadow (*Arthāpatti*)
  Priya is essentially arguing for *arthāpatti* (presumption/postulation) without naming it. The Mīmāṃsā school posits *arthāpatti* as a sixth *pramāṇa*. It works exactly as Priya describes: "Devadatta is alive; he is not at home; therefore, he must be outside." This is a reductio of the idea that he is dead or inside.
  *   **Correction:** The Nyāya school explicitly rejects *arthāpatti* as a separate *pramāṇa*. They subsume it under *anumāna* (inference). If Priya wants to argue *tarka* is a *pramāṇa*, she is effectively arguing Nyāya should adopt the Mīmāṃsā position. Marcus is defending the standard Nyāya reductionism. The dispute isn't just about *tarka*; it's about whether Nyāya should expand its ontology to match Mīmāṃsā.

  #### 3. The Nature of *Vyāpti-Graha* (Grasping the Universal)
  Both assume *vyāpti* (the smoke-fire connection) needs *tarka* to be "settled." But how is *vyāpti* known in the first place?
  Later Nyāya (Navya-Nyāya) clarifies that *vyāpti* is known through *vyāpti-graha*, which relies on **perception** (*pratyakṣa*) of co-presence and **non-perception** (*anupalabdhi*) of counterexamples.
  *   **Correction:** *Tarka* is not the primary establisher of *vyāpti*. Perception and non-observation are. *Tarka* is used only when doubt arises (e.g., "Is there a hidden condition preventing smoke?"). *Tarka* removes the doubt about the *condition*, allowing the perceptual knowledge of *vyāpti* to stand. Priya treats *tarka* as the foundation of *vyāpti*; the texts treat it as the defender of *vyāpti* against skeptical attack.

  ### Summary for the Group
  You can tell Priya she has the stronger intuition about how knowledge *feels* and functions in debate, and her analogy with testimony is logically sound. You can tell Marcus he has the stronger footing in the technical ontology of the *sūtras* regarding causal independence.

  But the resolution lies in the middle: *Tarka* is not a *pramāṇa* because it does not apprehend a new object (*anadhigata-artha*). It apprehends the **coherence** of what is already apprehended. It is the *guardian* of the *pramāṇas*, not a *pramāṇa* itself. Priya wants to promote the guardian to a soldier; Marcus wants to dismiss the guardian as a civilian. The Nyāya answer is that the guardian is essential for the army to march, but does not fire the weapon.
