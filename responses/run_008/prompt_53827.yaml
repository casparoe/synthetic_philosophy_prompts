      *   *Term 1: Philosophy of Mind (Functionalism vs. Substrate).*
          *   If substrate (biological naturalism) is required, decapods likely fail (no cortex, different architecture).
          *   If functionalism (integration of information, goal-directedness) is sufficient, they likely pass.
