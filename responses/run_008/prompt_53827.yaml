  9.  **Refining the content (Self-Correction during drafting):**
      *   *Correction:* I initially thought about putting the "graded" issue as a probability multiplier. It's better to treat it as a modifier to the *definition* of the proposition. If sentience is graded, the proposition "They are sentient" is true if they are above threshold $T$.
      *   *Correction on Classmate's View:* 0.2 is very low given the Birch et al. (2021) review. I should note that her view is becoming the minority scientific opinion, though philosophically defensible.
      *   *Ethical Stakes:* Emphasize the "asphyxiation on ice" point. That's a slow death.
