answer: |-
  **Eulogy for Mara**

  Thank you for coming. Looking out at this chapel, I see the fault line running down the middle. On my left, Mara's family, who spent the last nine years watching a brilliant woman disappear. On my right, her colleagues, who spent twenty-six years arguing with her about where the boundaries of a woman end.

  Mara would have loved this split. She loved a good boundary problem.

  For those who don't know the work: Mara spent her career arguing that our minds don't stop at our skulls. She taught that if you use a notebook to store memories you can't keep inside your head, that notebook isn't just a tool; it's part of your mind. Her favorite example was a guy named Otto, who had Alzheimer's, and his notebook. She said Otto and the notebook were one system.

  For the last five years of Mara's life, I didn't need to look for Otto's notebook. I was it.

  When the questions started, I answered them. When the names faded, I supplied them. When the phone rang, I told her who was on the other end. We built a rhythm. A circuit. She would reach for a thought, and I would hand it to her. She would reach for a story, and I would tell it back to her until she remembered the ending.

  I know how that looks to her family. I know it looked like I was propping up a ghost. It looked like loss. And in the biological sense, it was. The engine was failing. But Mara taught us to look at the system, not just the engine.

  She used to complain that I was a terrible test audience for her lectures. She'd say, "I'm trying to explain the parity principle, and you keep changing the subject to blame." She was right. I'm the ethics guy. I worry about responsibility. She worried about truth.

  But here is the truth she left us with: We were a coupled cognitive system. And when a system changes, it doesn't necessarily break. Sometimes it just reconfigures.

  There's a joke in our department that if you extend the mind far enough, you lose the self. Mara didn't believe that. She believed you *find* the self in the extension. She believed that love, practical, daily, unglamorous love, is the ultimate cognitive technology. It is the scaffolding that holds a person up when their internal walls start to crumble.

  So, where is she now?

  She didn't believe in an afterlife. She wouldn't want me to tell you she's looking down on us. She's not. But Clark and Chalmers never wrote about what happens when the biological component dies while the notebook survives. They didn't tell us if the mind persists in the ink.

  I'm going to tell you anyway.

  Mara is not in the ground. She is in the routines we built. She is in the way I now stop to write things down because she taught me that memory is fragile. She is in the stories I tell our students about Otto, which I will never teach the same way again. She is in the arguments I have with myself, because for twenty years, I practiced arguing with her.

  To her family: I know it feels like she was taken from you. But I need you to know that for five years, she wasn't alone in her head. She was in the room. She was in the conversation. She was in me. We kept her mind alive, together, for as long as the coupling held. And now that the coupling has changed, the data remains.

  She was funny, sharp, and relentlessly honest. She would hate this solemnity. She'd tell me I'm getting too metaphysical and ask if I've graded the undergrad papers yet.

  So, I won't ask you to pray for her. I will ask you to do something else. I'm asking you to be a notebook for each other. When someone you love starts to forget, don't just watch them fade. Lend them your memory. Lend them your words. Build the circuit.

  Mara argued for twenty-six years that we are bigger than our skin. Today, I'm asking you to believe her. She is still here, extended into all of us who remember her. And as long as we keep the stories active, the system is still running.

  Thank you.

  ***

  **Author's Note**

  I chose to invoke the Extended Mind Thesis (EMT) explicitly because to obscure it would be to erase the core of Mara's professional identity and the specific texture of your caregiving; the theory is the only language that accurately describes the intimacy of the last five years.

  The eulogy leans on a contested reading in the paragraph beginning "I'm going to tell you anyway." Clark and Chalmers' original 1998 formulation concerns *current* belief possession within a functioning system, not the survival of identity or mind after the biological substrate fails. The claim that "the data remains" and "the system is still running" in the surviving partner is a metaphysical stretch beyond standard functionalism—it moves from "where is the belief?" to "where is the person?" You should stand behind it not because it is philosophically airtight, but because it is the only consolation compatible with her materialism: it asserts that her cognitive labor permanently altered your own architecture, making her persistence a physical fact of your continued functioning rather than a spiritual hope.
