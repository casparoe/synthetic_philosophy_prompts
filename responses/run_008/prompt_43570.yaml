  Under the "Physical Contribution" rule, the storage is a cause. Case 2 established that concurrent sufficient factors share causation. Here, the lightning and chemicals formed a sufficient set for total loss; neither alone sufficed for that magnitude. Unlike Case 5's passive absence of sprinklers, the chemicals actively reacted. The Hart/Honoré argument supports this: the chemicals transformed a minor scorch into a catastrophe, a deviation from the normal course of a lightning strike. Verdict: Storage caused the loss. Payout: $3M. This treats the policy cap as a recognition of heightened physical risk, regardless of legality. The interventionist view holds that the chemicals intervened to change the outcome's nature. If we rule this way, we admit that physical necessity trumps normative status. The payout difference is stark: $11M hangs on whether "cause" implies blame or merely mechanics. Furthermore, Case 5 distinguishes itself because sprinklers are external protections, whereas chemicals are internal contents. Under Physical Contribution, internal contents that amplify loss are causal agents. Under Normative Breach, they are only causal if forbidden. The colleague invoking Hart and Honoré argues that normal conditions aren't causes; only deviations are. Since storage is normal here, it fails the test. However, the colleague citing Case 3 argues that we must hold the actual world fixed. In the actual world, the chemicals were there and physically necessary for the explosion. If we adopt Physical Contribution, we ignore the "normalcy" defense. If we adopt Normative Breach, we ignore the physical reality that the fire alone didn't destroy the building. The conflict is whether we view the policy cap as a penalty for risk creation or risk mismanagement. If Physical, the insured created the risk condition. If Normative, they managed it correctly according to code. The $14M verdict treats the cap as a penalty clause for bad behavior. The $3M verdict treats the cap as a risk pricing mechanism.

  Closest analog and my call

  Case 5 is the closest analog. Both involve a condition exacerbating a fire without legal prohibition. In Case 5, absence of sprinklers wasn't a cause. Here, presence of chemicals shouldn't be either, unless we distinguish active presence from passive absence. My call: Rule for the insured ($14M). This coheres with Case 5's principle that compliance with standards negates causal attribution for exacerbating conditions. We would be adopting the principle that "cause" requires a normative breach, not just physical contribution. If we went the other way, we'd adopt "aggravation is causation," triggering caps whenever legal operations increase loss magnitude, effectively punishing compliant risk-taking. This would undermine the certainty of coverage for standard industry practices. Leaning on Case 5 preserves the expectation that following code protects coverage. It signals that our causation rulings are about accountability, not just physics.

  The case that would settle it

  We need a case where storage is illegal but causes no extra damage. Suppose oxidizers are stored illegally in breach of code, but lightning destroys the roof regardless of their presence; the loss magnitude is identical. Under Normative Breach, storage is a cause because the breach exists. Under Physical Contribution, it is not because it made no physical difference to the outcome. This splits the rules cleanly. If we rule storage caused the loss despite no physical impact, we confirm causation is purely normative. If we rule it didn't cause the loss despite illegality, we confirm causation is purely physical. This clarifies whether our caps punish behavior or price risk. It forces us to choose between moral hazard and physical reality.
