      *   *Warm-up:* Need something where $P(Heads)$ is 1/2, but $P(Heads | I \text{ see Red})$ changes without the world changing. The "Dungeon" case (Elga 2000) is good. Two cells, one red, one blue. You wake in one. What's prob you are in Red?
