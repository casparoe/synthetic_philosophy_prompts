answer: |-
  Here is a teaching plan designed to hit your specific learning objective: shifting the focus from the *answer* (1/2 vs. 1/3) to the *structure* (centered vs. uncentered sample spaces).

  ### Session Overview
  *   **Time:** 45 Minutes
  *   **Goal:** Demonstrate that self-locating uncertainty requires a sample space of *centered worlds* (world + agent + time), and that standard Kolmogorov probability is underspecified without an indexical anchor.
  *   **Carrying Example:** **Standard Sleeping Beauty (Amnesia Variant).**
      *   *Why not Creation/Rooms?* For a 45-minute intro to cognitive scientists, the "Creation" variant smuggles in metaphysical baggage about identity and existence ("Do I exist in the Heads world?") that distracts from the probabilistic structure. The Amnesia variant keeps ontology fixed (Beauty exists in all branches) and varies only temporal location. This isolates the *indexical* variable from the *ontological* variable, which is cleaner for a first pass at sample spaces.
      *   *Constraint:* You must explicitly **sterilize** the example of all betting/payoff language. This is non-negotiable for your goal.

  ---

  ### Part 1: The Indexical Gap (00:00 – 00:10)
  **Objective:** Establish that standard probability theory lacks the vocabulary for "where/who I am" before introducing the coin.

  1.  **The Warm-Up (The "Dungeon" Case):**
      *   Do not start with Beauty. Start with a static spatial case.
      *   *Setup:* "Imagine two identical rooms, Room A and Room B. A coin is flipped. If Heads, a person is placed in A. If Tails, a person is placed in B. You wake up in one of the rooms. The rooms are indistinguishable."
      *   *Ask:* "What is your credence you are in Room A?"
      *   *Expected Intuition:* 1/2.
      *   *The Pivot:* "Now, modify the setup. Heads: One person in A. Tails: Two people, one in A and one in B. You wake up in a room. What is your credence you are in Room A?"
      *   *Discussion:* Elicit the tension. In the second case, simply knowing "I am in a room" gives you information about the coin *because* it tells you something about your location relative to the population.
  2.  **The Lesson:**
      *   Standard probability spaces list ways the *world* can be (Heads/Tails).
      *   Self-locating belief requires listing ways the *world-and-me* can be (Heads+MeInA / Tails+MeInA / Tails+MeInB).
      *   **Key Dependency:** You must establish that "I am in Room A" is a different *type* of proposition than "There is a person in Room A" before they will accept the Beauty setup requires a new space.

  ### Part 2: The Beauty Setup (00:10 – 00:20)
  **Objective:** State the problem cleanly without triggering decision-theoretic reflexes.

  1.  **The Protocol:**
      *   State the Standard Beauty protocol (Coin, Mon/Tue wakeups, Amnesia).
      *   **Crucial Framing:** "We are not asking how Beauty should bet. We are not asking what she should do. We are asking: *Upon waking, what is the set of possibilities she considers open, and how should probability mass be distributed over them?*"
  2.  **Pre-empting Misconception #1 (Betting/Decision Theory):**
      *   *When:* Right after stating the protocol.
      *   *Action:* Explicitly ban betting arguments. "If you are thinking about how many times she gets paid, stop. We are doing epistemology, not decision theory. Payoffs introduce frequency biases that obscure the credence assignment. Assume her only goal is to assign a number that matches the truth."
      *   *Why:* Cognitive scientists often default to reinforcement learning models. You need to block the "reward per awakening" heuristic early, or the session becomes about utility functions.

  ### Part 3: The Sample Space Clash (00:20 – 00:35)
  **Objective:** Visualize the two competing sample spaces to show the disagreement is structural, not arithmetic.

  1.  **Draw Space 1 (The Halfer/Uncentered Space):**
      *   $\Omega = \{ \text{Heads}, \text{Tails} \}$
      *   Evidence $E$: "Beauty is awake."
      *   *Problem:* In this space, $P(\text{Heads} | E) = P(\text{Heads}) = 1/2$.
      *   *Why:* Because "Beauty is awake" is true in both worlds. It partitions nothing.
  2.  **Draw Space 2 (The Thirder/Centered Space):**
      *   $\Omega = \{ (\text{Heads, Mon}), (\text{Tails, Mon}), (\text{Tails, Tue}) \}$
      *   Evidence $E$: "I am awake now."
      *   *Problem:* In this space, $E$ eliminates no worlds, but the *measure* changes if we apply Indifference over centers.
  3.  **The Core Lesson:**
      *   Highlight that the Halfer and Thirder are not disagreeing about Bayes' Rule. They are disagreeing about **what $\Omega$ is**.
      *   The Halfer treats "It is Monday" as a proposition about the world state (which doesn't change).
      *   The Thirder treats "It is Monday" as a proposition about the *center* (which is sampled from the available awakenings).
      *   **Misconception #2 (No New Information):**
          *   *When:* During the comparison of Space 1 vs. Space 2.
          *   *Action:* Validate the Halfer intuition. "You are right: Beauty learns no new *uncentered* fact. The world didn't change."
          *   *Pivot:* "But she gains *centered* information. She learns she is not in the (Tails, Tue) center *if* she knew it was Tuesday, but since she doesn't, she learns she is in the subset of centers compatible with 'waking up'. The dispute is whether 'waking up' is a random sample from $\Omega$."

  ### Part 4: Misconceptions & Wrap (00:35 – 00:45)
  **Objective:** Handle the remaining objections and assess understanding.

  1.  **Misconception #3 (Verbal Dispute):**
      *   *Prediction:* Someone will say, "This is just semantics. Define your terms and the number follows."
      *   *Response:* "If it were merely semantic, the choice of sample space wouldn't have downstream consequences for how we update on other evidence. The point of this session is that the choice of space determines *what counts as evidence*."
  2.  **Scope Boundaries (What to Decline):**
      *   **The Doomsday Argument:** If raised, say: "That applies this logic to temporal location in human history. It's a valid application, but it introduces anthropic selection effects that will derail us today. Let's master the micro-case first."
      *   **Decision Theory/SSA vs. SIA:** Do not introduce the Self-Sampling Assumption vs. Self-Indication Assumption terminology. It's jargon that obscures the sample space point. Stick to "Centered Indifference."
      *   **Quantum/Many Worlds:** If someone brings up branching universes, shut it down. "We are assuming a single classical world with imperfect information. Quantum branching adds ontology we don't need."
  3.  **The Final Assessment Question:**
      *   Do not ask "So, is it 1/2 or 1/3?"
      *   **Ask this:** "Imagine we modify the experiment. If the coin is Tails, Beauty wakes up 1,000 times. If Heads, she wakes up once. Upon waking, write down the **sample space $\Omega$** you are using to calculate your credence. Does $\Omega$ contain 2 elements or 1,001 elements? Justify why your choice of $\Omega$ captures *all* the uncertainty Beauty faces."
      *   *Success Criteria:* If they answer "1/1001" or "1/2" without defining $\Omega$, they missed the point. If they write $\Omega = \{ (H, 1), (T, 1), ..., (T, 1000) \}$ and argue about the measure, they understood the lesson.

  ### Dependency Structure Summary
  1.  **Warm-up (Dungeon)** $\rightarrow$ Establishes that "Location" is a variable distinct from "World State."
  2.  **Beauty Setup** $\rightarrow$ Transfers "Location" variable from Space (Room) to Time (Day).
  3.  **Ban Betting** $\rightarrow$ Prevents cognitive load shift to Utility/Decision Theory.
  4.  **Sample Space Comparison** $\rightarrow$ Shows the 1/2 vs 1/3 conflict is actually a $\Omega_{\text{uncentered}}$ vs $\Omega_{\text{centered}}$ conflict.
  5.  **Final Question** $\rightarrow$ Tests ability to construct $\Omega$, not just compute $P$.

  ### Instructor Note on Delivery
  Your instinct to avoid the "fun puzzle" vibe is correct. The risk with Cognitive Science audiences is they will try to *solve* the uncertainty by modeling the memory loss neurally (e.g., "If the memory trace decays..."). You must keep them in the normative space. When they drift into "How does the brain encode time?", gently pull them back: "Assume the encoding is perfect but inaccessible. The question is about the probability mass, not the storage mechanism."

  If you stick to the **Sample Space** narrative, you avoid the Halfer/Thirder trench warfare. You make them realize that before they can calculate a probability, they have to decide what *kind* of thing they are locating themselves in. That is the win condition.
