  My dear critic, you mourn the loss of nuance as if nuance ever fed a worker during the winter! Of course there are choices—Gerd Arntz cuts the wood, Marie Reidemeister sets the values, and I decide what story the wall must tell, whether here in Vienna or for the planners in Moscow—but do you imagine your prose is any less constructed? When you write your feuilletons, you choose the adjective, the omission, the metaphor, all wrapped in a syntax that requires years of bourgeois schooling to decode. We physicalists know better than to claim we stand on a dock of absolute truth; we are rebuilding the boat of knowledge at sea, plank by plank, and yes, sometimes we use a rounded figure because the worker needs to see the trend, not the decimal. You say we wear the face of the world, but we wear the face of the workshop! Your sister does not need a metaphysical guarantee of objectivity; she needs to see that housing starts are up while wages are down, and she needs to see it in five seconds, not after wading through three pages of economic theory that assumes she already agrees with the conclusion. We make our conventions visible—a row of men is a row of men—whereas your prose hides its tendentious choices behind the illusion of natural speech.
