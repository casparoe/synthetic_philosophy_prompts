  # HANDOUT: NAVIGATING STRAWSON'S BASIC ARGUMENT
  **Course:** Seminar on Free Will & Moral Responsibility | **TA:** [Your Name]

  **Starting Point:** You feel gratitude toward a friend who helped you. You are unsure if this commits you to a metaphysical view of responsibility. Follow the questions below. Answer based on your intuition about the cases, not on philosophical labels.

  **Q1. THE LUCK OF CHARACTER**
  Consider two people who help you. **Person A** has a naturally sunny temperament (pure luck). **Person B** struggled against a selfish nature to cultivate virtue. Do they deserve the *same* credit for their good deed?
  *   **YES (Luck doesn't undermine credit):** Go to **Q2**.
  *   **NO (Luck undermines credit; ownership required):** Go to **Q3**.

  **Q2. THE FRANKFURT CASE (ALTERNATIVE POSSIBILITIES)**
  Imagine a neuroscientist ensures you *cannot* do otherwise, but you act exactly as you wanted from your own values. Are you responsible?
  *   **YES (Source matters, not options):** You are a **SEMICOMPATIBILIST**.
      *   *Awkward Commitment:* You must explain why freedom matters if the ability to do otherwise is irrelevant.
  *   **NO (Options are required):** You are a **REVISIONIST** (Compatibilist-leaning).
      *   *Awkward Commitment:* You must redefine "responsibility" to fit a world where ultimate control is an illusion.

  **Q3. THE REGRESS (SELF-CREATION)**
  To own your character, did you have to create it? Consider someone who reshaped their character at age 20 using materials (genes, parents) they didn't choose. Is that enough?
  *   **YES (Reshaping is enough):** You are a **REVISIONIST**.
      *   *Awkward Commitment:* You must accept that your "choices" rest on a foundation of luck you disavowed in Q1.
  *   **NO (Must choose the materials too):** Go to **Q4**.

  **Q4. THE POSSIBILITY OF ULTIMATE CONTROL**
  Strawson argues you cannot choose the materials of your choice without an earlier choice (infinite regress). Is "Ultimate Self-Creation" metaphysically possible?
  *   **YES (Indeterminism supplies it):** You are a **SOURCE INCOMPATIBILIST**.
      *   *Awkward Commitment:* You must explain how random chance contributes to *control* rather than just noise.
  *   **NO (It is incoherent/impossible):** Go to **Q5**.

  **Q5. THE PRACTICE (THE LONG DEAD)**
  If ultimate responsibility is impossible, should we retain blame? Specifically: Is it appropriate to resent a tyrant long dead who cannot change or be deterred?
  *   **NO (Blame requires a forward-looking point):** You are a **HARD INCOMPATIBILIST**.
      *   *Awkward Commitment:* You must justify punitive practices while admitting no one truly deserves punishment.
  *   **YES (Retribution is appropriate regardless):** You are an **IMPOSSIBILIST** (who ignores the conclusion) OR **RETRIBUTIVIST**.
      *   *Note:* If you say responsibility is *impossible* but we should *still* resent the dead, go to **Diagnosis**.
  *   **NO (Responsibility is impossible, stop the practice):** You are an **IMPOSSIBILIST**.
      *   *Awkward Commitment:* You must navigate social life without holding anyone accountable for their actions.

  ***

  ## DIAGNOSTIC NOTES (FOR DISCUSSION)

  **1. Indistinguishable Leaves: Hard Incompatibilist vs. Revisionist**
  You may find the **Hard Incompatibilist** and **Revisionist** leaves merge on this tree. Both concede the metaphysics fails (or is irrelevant) and keep the practices.
  *   *The Split:* I attempted to separate them using Q5 (The Long Dead). The Hard Incompatibilist (e.g., Pereboom) rejects blaming the dead because blame is only for safety/reform. The Revisionist (e.g., Dennett) might allow it as part of a normative narrative.
  *   *The Problem:* In practice, many students answer these identically. If you find yourself here, ask: "Is our practice of blame *mistaken* given the metaphysics (Hard Incompatibilist), or is the practice *constitutive* of responsibility so it cannot be mistaken (Revisionist)?"

  **2. Unoccupied Nodes: The "Retributive Impossibilist"**
  There is a combination of answers that is largely unoccupied in the literature: **"Ultimate Self-Creation is Required" + "It Is Impossible" + "Retributive Blame is Obligatory."**
  *   *Why Unoccupied?* This view is pragmatically incoherent. If you accept Strawson's argument that responsibility is impossible, insisting on retributive blame (giving people what they *deserve*) contradicts your own metaphysics.
  *   *Status:* Usually, those who want retribution deny Strawson's conclusion (becoming Source Incompatibilists). Those who accept Strawson's conclusion drop retribution (becoming Hard Incompatibilists or Impossibilists). Holding both is philosophically unstable.

  **3. Changes Made to Standard Taxonomy**
  *   *Simplification of Compatibilism:* I merged "Standard Compatibilist" and "Revisionist." In the context of Strawson's argument, the distinction is less vital than the commitment to keeping practices despite the regress.
  *   *Frankfurt Placement:* I placed the Frankfurt case (Q2) on the "Luck doesn't matter" branch. This is because if you think luck *does* matter (Q1 No), you are already demanding a kind of sourcehood that Frankfurt cases complicate. This ensures the Semicompatibilist leaf is reached only by those who prioritize *source* over *alternative possibilities*.
