answer: |-
  **MEMORANDUM**

  **TO:** Grant-Renewal Panel
  **FROM:** [Your Name]
  **DATE:** May 15
  **SUBJECT:** Recommendation on Five-Year Funding Block: Attractor vs. Sparse Programmes

  **Bottom Line Recommendation**

  We face a choice between preserving a mature tradition and backing an emerging challenger. After reviewing the track records of both the Attractor and Sparse programmes, I recommend we award the full five-year block to the **Sparse programme**.

  This recommendation is not a judgment on the intelligence of the Attractor practitioners, nor a denial of their past contributions. It is a strategic decision based on the epistemic trajectory of the two fields. Our foundation's mandate is to advance theoretical research, not to subsidize incumbent communities. The evidence indicates that the Attractor programme has entered a degenerating phase, while the Sparse programme is currently exhibiting progressive growth. To split the block would be to hedge against our own mission, effectively taxing progress to subsidize stagnation.

  **Operational Criteria for Assessment**

  To ensure this decision rests on more than subjective preference, we must apply operational criteria derived from the methodology of scientific research programmes. We need clear definitions for "novel prediction" and "problem shift."

  First, a **novel prediction** must satisfy two conditions. It must be *improbable* given the background knowledge available before the theory was formulated, and it must be *temporally prior* to the evidence. A prediction is not novel if the model was adjusted to fit existing data. In this context, "declaring stakes in advance" is the key marker. The Sparse programme's recent success meets this bar; the Attractor programme's recent "rescue" of a failed prediction by redefining the test conditions does not. Redefining the test to fit the theory is the hallmark of a convention, not a confirmation.

  Second, we must distinguish between a **progressive** and a **degenerating problem shift**. A programme is progressive if each theoretical adjustment leads to the discovery of new facts. It is degenerating if adjustments are made solely to absorb anomalies without yielding new empirical content. The introduction of a free parameter is not inherently fatal, but it is suspect if it serves only to protect the core from falsification without expanding the theory's reach.

  Applying these criteria, the Attractor programme shows clear signs of degeneration. Over the last dozen years, four anomalies were absorbed by adding parameters or restricting domains. These are defensive maneuvers. The recent failed prediction, rescued by redefining the test, is a classic ad hoc adjustment. Conversely, the Sparse programme has made two risky predictions with no adjustable parameters, resulting in one clear confirmation. This is empirical content growth.

  **The Argument for Depth and Training**

  The strongest argument for renewing the Attractor programme rests on theoretical depth and human capital. Proponents argue that the Attractor core is mathematically richer and that its practitioners are better trained. They contend that judging a tradition by a few years of predictions ignores the value of a robust conceptual framework that educates the next generation.

  This argument deserves serious weight. A field without deep mathematical structure risks becoming a collection of heuristic tricks. Furthermore, our foundation has an ethical obligation to the ecosystem of the discipline, which includes the students currently trained in the Attractor tradition. Abandoning the programme could scatter a cohort of highly skilled theorists, causing a loss of tacit knowledge that might be needed if the Sparse programme eventually stalls.

  However, we must distinguish between the *sociological* health of a community and the *epistemic* health of a research programme. Deep mathematics applied to a degenerating core is akin to building ornate additions to a sinking ship. While the craftsmanship is admirable, it does not keep the vessel afloat. Regarding training: students are best served by working on problems that yield solutions. Training students in a programme that increasingly relies on ad hoc rescues teaches them to protect theories rather than test them. If the Sparse programme is indeed progressive, it will eventually develop its own mathematical depth. Funding the Attractor programme to preserve training capacity prioritizes the comfort of the current workforce over the advancement of the field.

  **Limits of the Framework and Decision Strategy**

  I must be candid about where our methodological apparatus underdetermines this choice. The framework we are using is primarily retrospective; it appraises historical series to determine rationality of past retention. It warns against "instant verdicts." Science has often seen degenerating programmes recover through unexpected breakthroughs. By this logic, a five-year funding block is a long time in theoretical research, and cutting off the Attractor programme now might constitute the very instant verdict the methodology warns against. The framework tells us where the growth *has been*, not guaranteed where it *will be*.

  Furthermore, the framework does not specify the precise tipping point where degeneration warrants defunding. Is twelve years of anomalies enough? Is three years of Sparse success sufficient? The methodology offers no numerical threshold.

  At exactly this point, where the philosophical framework gives out, the panel must exercise institutional judgment. We are not merely historians of science; we are investors in future knowledge. When the apparatus identifies a trend but cannot guarantee its continuation, we must decide based on our risk tolerance. A private foundation is uniquely positioned to accept the risk of backing a newcomer. If we wait for absolute certainty, we will always fund the incumbent.

  Therefore, while we acknowledge the risk of abandoning the Attractor programme prematurely, the weight of evidence favors a decisive shift. We should not split the block. A split signals that we view the two programmes as equally viable competitors, which the evidence contradicts. It dilutes the impact of the funding and prolongs the degeneration.

  **Conclusion**

  We should fund the Sparse programme. This decision aligns our resources with the programme currently generating novel empirical content. To mitigate the risks identified above, I propose we encourage the Sparse grantees to include transition mechanisms for Attractor-trained postdocs, ensuring we retain the human capital without propping up the degenerating core.

  We must resist the urge to compromise for the sake of consensus. Science advances through discontinuity. Our funding decision should reflect that reality.

  **Recommendation:** Award the full five-year block to the Sparse programme.
