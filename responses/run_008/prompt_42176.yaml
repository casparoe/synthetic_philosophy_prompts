      *   **Specific Observations to Address:**
          1.  Japanese nationalists using the same line (Nanjing/Tokyo Trials) – how does that fit?
          2.  Holocaust records being largely German-generated – does this break the slogan?
      *   **Constraint:** Be upfront about limitations/uncertainties in the analysis. No reading lists (user won't have time).
      *   **Tone:** Analytical, nuanced, conversational but rigorous, avoiding confrontation while arming the user with clarity.

  2.  **Deconstruct the Slogan ("History is Written by the Victors"):**
