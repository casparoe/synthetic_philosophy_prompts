      *   *Claim 2 (Narrative):* Platitude/True. States control education. But "control" isn't absolute (academics, international scrutiny). Doesn't prove specific facts are lies.
      *   *Claim 3 (Relativism):* Defensible but limited. Perspective exists, but facts (dates, death tolls, orders) are falsifiable. Sliding from "perspective exists" to "facts are unknowable" is the error.
      *   *Claim 4 (Inverse Truth):* False/Dangerous. Just because a narrative was suppressed doesn't make it true. Often the loser's narrative is propaganda *too*.

  4.  **Address the User's Observations:**
