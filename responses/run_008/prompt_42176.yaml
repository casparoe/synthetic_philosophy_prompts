      *   *Observation 2 (Holocaust Records):* This is a strong counter-point. The Nazis were meticulous bureaucrats. The evidence is often *their* words (Wannsee Protocol, train logs, camp records). The "victors" didn't write the evidence; the perpetrators did. The victors interpreted it, but the raw data is from the losers.

  5.  **Address the "Uncle's Move" (The Slide):**
