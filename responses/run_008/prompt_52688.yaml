answer: |-
  **The Moral Palate and the Normative Table: Why Psychological Breadth Does Not Entail Moral Truth**

  Moral Foundations Theory (MFT), pioneered by Jonathan Haidt and colleagues, offers one of the most robust empirical frameworks for understanding the divergent moral psychologies of the political left and right. The central finding is well-known: self-described liberals tend to construct moral judgments primarily upon the foundations of Care/Harm and Fairness/Cheating. Conservatives, by contrast, utilize those two but also draw significantly upon Loyalty/Betrayal, Authority/Subversion, and Sanctity/Degradation. From this descriptive disparity, a normative inference is frequently drawn, often implicitly: that conservative morality is a "more complete" system, whereas liberal morality is psychologically impoverished and, by extension, normatively deficient.

  As a philosopher, I must ask whether this inference holds water. Can the sheer breadth of moral intuition carry evidential weight regarding which side's judgments are closer to the moral truth? To answer this, we must navigate the treacherous waters between metaethics and psychology. I argue that while MFT explains *why* different groups disagree, the finding of psychological breadth provides negligible evidential support for normative correctness. The argument from completeness fails because it cannot cross the is/ought divide without collapsing into naturalistic fallacy, it crumbles under a symmetry test involving exclusionary intuitions, and it ignores the possibility that liberal morality represents a reflective override rather than a perceptual deficit.

  **I. The Is/Ought Bridge: Naturalism and Function**

  The primary obstacle to inferring normative correctness from psychological breadth is Hume's Guillotine. The fact that conservatives *feel* the pull of authority and sanctity describes a state of affairs (is); it does not logically entail that they *ought* to feel it, or that acting on those feelings is morally right (ought). To license this inference, one requires a metaethical bridge.

  The strongest candidate for such a bridge is Neo-Aristotelian Naturalism. This view posits that moral truths are grounded in human flourishing (*eudaimonia*), and human flourishing is determined by the nature of the human organism. If human nature is evolutionarily designed to require hierarchy, group cohesion, and ritual purity to function optimally, then a moral psychology that ignores these needs is akin to a diet that ignores essential vitamins. On this view, the "completeness" argument is not merely counting intuitions; it is arguing that conservatives track more of the objective requirements for social survival. The liberal, in ignoring Authority and Sanctity, is like a colorblind painter attempting to render a full spectrum; they are missing data essential to the representation of reality.

  This is a formidable argument. It moves beyond simple majoritarianism (more people feel this, so it's right) to functionalism (this feeling exists because it serves a vital function, so ignoring it is dangerous). If social cohesion collapses without a sense of sacredness, then the liberal rejection of sanctity is pragmatically self-defeating, and perhaps morally wrong if it leads to societal harm.

  However, even this robust bridge is structurally unsound. It assumes that the *existence* of a psychological module implies its *normative validity*. Yet, human nature is replete with modules that we rightly reject as guides for moral truth—aggression, tribalism, and sexual coercion are natural, but we do not consider them "complete" moral guides. To claim that Authority and Sanctity are "vitamins" while Aggression is a "toxin" requires a normative filter external to the psychology itself. The naturalist bridge collapses because it cannot distinguish between adaptive *descriptions* and normative *prescriptions* without smuggling in a prior moral commitment.

  **II. The Symmetry Test: The Mirror World of Ethnic Sanctity**

  To expose the fragility of the breadth-to-correctness inference, we must apply a symmetry test. Consider a mirror society, "Ethnica." In Ethnica, the political Right possesses the standard five foundations, but the fifth foundation, Sanctity, is specifically tied to the "Sanctity of Ethnic Homogeneity." For the Ethnica Right, mixing bloodlines triggers the same phenomenology of disgust and sacred violation that the American Right associates with flag burning or desecration of religious texts. The Ethnica Left, like our American Left, rejects this foundation, relying only on Care and Fairness.

  If we accept the argument that psychological breadth entails normative completeness, we are compelled to conclude that the Ethnica Right is morally superior to the Ethnica Left. They perceive a "moral reality" (the sanctity of blood) that the Left ignores. Their moral palate is fuller.

  Most of us recoil at this conclusion. But why? If we say, "Because racism is wrong," we have begged the question. We have used an external normative standard to judge the foundation, admitting that the *existence* of the foundation was not enough to validate it.

  To avoid begging the question, we must identify a structural difference between our world and Ethnica that explains why breadth matters here but not there, without simply asserting our preferred values. One might argue that in our world, Sanctity binds communities without necessarily excluding outsiders, whereas in Ethnica, it is inherently exclusionary. However, MFT data suggests that Sanctity is often boundary-maintaining; it distinguishes the pure from the impure. The phenomenological experience of the Ethnica conservative is indistinguishable from the American conservative.

  The failure of the inference in the mirror world reveals that the "completeness" argument relies on a hidden premise: *The additional foundations must track independent moral goods.* But if we need independent moral goods to validate the foundations, then the psychological breadth itself is doing no evidential work. The work is being done by the independent moral theory we used to vet the foundations. In Ethnica, the breadth argument fails because the "extra" foundation violates principles of universalizability. But if universalizability is the metric, then we are judging the foundations by a rational standard, not a psychological one. The symmetry test demonstrates that breadth is evidentially inert; it is the *content* of the foundation, judged by external criteria, that matters. Since the psychological data does not provide those criteria, it cannot determine correctness.

  **III. The Override Hypothesis: Deficit or Discipline?**

  Finally, we must engage an alternative reading of the MFT data, one that fundamentally undermines the "deficit" model of liberal morality. The standard interpretation is that liberals *lack* the intuitive capacity for Loyalty, Authority, and Sanctity. Haidt himself has suggested liberals are "mutants" in this regard.

  However, a more charitable and philosophically plausible reading is that liberals possess these intuitions but subject them to reflective override. Consider a liberal soldier who feels a visceral pang of loyalty to their unit but refuses to cover up a war crime. Or a liberal religious person who feels the sanctity of a tradition but rejects its exclusionary practices. Phenomenologically, the intuition exists; normatively, it is vetoed by a higher-order principle (e.g., Universal Human Rights).

  If this "Override Hypothesis" is true, the "completeness" argument evaporates. A system that filters raw intuitions through rational scrutiny is not incomplete; it is *structured*. To argue that the liberal is morally deficient because they suppress the intuition of Authority is like arguing a sober driver is "visually deficient" because they ignore the urge to speed when the road is clear. The suppression is not a failure of perception, but a success of regulation.

  This reading shifts the debate from moral *perception* to moral *justification*. If liberals feel the pull of Sanctity but reject it because it cannot be universalized without contradiction, their morality is not narrower; it is more rigorous. The conservative reliance on these foundations may indicate a willingness to act on intuitions that do not survive reflective equilibrium. Under this description, the empirical finding of "fewer active foundations" is actually evidence of a higher threshold for moral justification, not a blindness to moral truth. This turns the evidential weight on its head: the data might suggest liberals are *more* capable of detaching moral truth from evolutionary impulse.

  **Conclusion**

  We are now in a position to render a definite verdict. Can empirical findings about the moral psychology of the left and right carry evidential weight on which side's moral judgments are closer to correct?

  The answer is no.

  The argument that conservative morality is superior because it is psychologically "broader" fails on three counts. First, it cannot cross the is/ought divide without assuming that all evolved psychological modules are normatively valid, an assumption refuted by the existence of maladaptive natural impulses. Second, the symmetry test reveals that if breadth alone were the metric for truth, we would be forced to validate abhorrent moral systems in mirror worlds, proving that the metric relies on external normative content, not psychological data. Third, the "Override Hypothesis" demonstrates that the liberal profile may reflect a reflective disciplining of intuition rather than a perceptual deficit, rendering the "completeness" charge category error.

  Moral Foundations Theory is an invaluable tool for understanding moral *disagreement* and predicting political *behavior*. It explains why conservatives often find liberal morality thin and why liberals find conservative morality oppressive. But it is a descriptive map of the human moral engine, not a normative compass. To derive truth from the engine's complexity is to confuse the machinery of judgment with the validity of the judgment itself. Moral truth is not a matter of how many buttons we press, but whether the actions those buttons trigger can be justified to all rational agents. On that count, psychology is silent.
