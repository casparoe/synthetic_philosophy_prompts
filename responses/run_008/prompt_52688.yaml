      *   *Refining the Bridge:* The strongest bridge is "Functionalist Naturalism." I need to be precise about that.
      *   *Refining the Symmetry:* The key distinction is between *formal* moral features (impartiality) and *substantive* intuitions. If the mirror foundation violates formal features, breadth doesn't help.

  6.  **Final Review against Prompt:**
