answer: |-
  # Seminar Plan: The Assertion Court
  **Topic:** Norms of Assertion (Knowledge vs. Truth vs. Belief)
  **Time:** 90 Minutes
  **Students:** 14 (Divided into 3 groups of 4–5)
  **Materials:** 3 sets of "Scenario Cards", 150 plastic tokens (or counters), 3 Scribe Sheets, a timer.

  ---

  ## 1. Preparation (Before Class)

  **The Tokens:**
  Give each student 10 tokens to start. These are "Credibility Points".
  *   **Goal:** Finish the game with the most tokens.
  *   **Value:** Explicitly state these have no monetary value. They represent social standing in the "Court of Assertion".

  **The Groups:**
  Divide the class into three tables (Groups A, B, C).
  At each table, assign roles for Round 1:
  1.  **The Asserter:** Holds the Scenario Card. Makes the claim.
  2.  **The Challenger:** Must try to find fault with the assertion.
  3.  **The Judge:** Decides if the assertion was "Proper" or "Improper".
  4.  **The Scribe:** Records the ruling and the reason given (one sentence).
  5.  **Observer(s):** (If 5th student present) Watches for rule-breaking.

  *Roles rotate clockwise after every round.*

  **The Scenario Cards:**
  Print 3 decks (one per table). Each deck has 5 cards. The text is written in the second person ("You..."). **Crucially**, there is a boxed section at the bottom marked **[INSTRUCTOR EYES ONLY / HIDDEN]**. The Asserter reads the main text but *must not* read the Hidden Box aloud. The Hidden Box is for the debrief.

  *   **Card 1 (The Standard):** You look at your hands. They appear normal. You say, "I have hands."
      *   *[HIDDEN: True. You know it.]*
  *   **Card 2 (The Lottery):** You hold one ticket in a 1,000-ticket fair lottery. The draw is in one minute. You say, "This ticket will lose."
      *   *[HIDDEN: True (it loses). You do not know it (statistical probability only).]*
  *   **Card 3 (The Moorean):** You look out the window and see rain. However, you have been told this is a hyper-realistic simulation. You don't believe it's really raining, but the evidence is overwhelming. You say, "It is raining."
      *   *[HIDDEN: True. You do not believe it.]*
  *   **Card 4 (The False Friend):** Your best friend, who is always reliable, tells you the train leaves at 5pm. You say, "The train leaves at 5pm."
      *   *[HIDDEN: False (friend made a mistake). You believe it. You have excellent evidence.]*
  *   **Card 5 (The Guess):** You have no information about the colour of the next car to pass. You say, "The next car will be red."
      *   *[HIDDEN: True (it is red). You have no evidence.]*

  ---

  ## 2. The Session Plan

  ### Phase 1: Setup & Rules (10 Minutes)
  Do not lecture on epistemology. Do not mention "Knowledge Norm" or "Truth Norm".

  **Script:**
  "Welcome. Today we are testing the rules of conversation. We often say people 'shouldn't say things' without proof, but what counts as proof? Is it enough to be right? Is it enough to be honest? Or do you need something else?

  You are in a Court of Assertion.
  1.  **The Asserter** draws a card. They must make the assertion written on it. They may explain *why* they are saying it (their evidence), but they **cannot** reveal the [HIDDEN] text.
  2.  **The Challenger** must challenge the assertion. You cannot ask 'Is it true?' You must ask about their basis. E.g., 'How do you know?' or 'Do you really believe that?'
  3.  **The Judge** listens to both. You must rule: **'Proper'** (Asserter kept the rules) or **'Improper'** (Asserter broke the rules).
  4.  **Payoff:**
      *   If Judge rules **Proper**: Asserter gains 2 tokens. Challenger loses 1.
      *   If Judge rules **Improper**: Challenger gains 2 tokens. Asserter loses 1.
      *   Judge gains 1 token for making a ruling within 60 seconds.
      *   *Note:* Tokens are not awarded for whether the statement was actually true. They are awarded for whether the *assertion* was socially/epistemically acceptable according to your ruling.

  **Constraint:** The Asserter is forbidden from saying 'It is true' as their justification. They must describe their *position* (e.g., 'I can see it', 'I was told').

  Any questions? Begin Round 1."

  ### Phase 2: The Game (40 Minutes)
  Run 3 Rounds of 10 minutes, plus 10 minutes for rotation and setup.
  *   **Round 1:** Cards 1 & 2 (Standard & Lottery).
  *   **Round 2:** Cards 3 & 4 (Moorean & False Friend).
  *   **Round 3:** Card 5 (Guess) + Free Choice (let them pick a previous card to re-litigate if they wish).

  **Instructor Role:**
  Circulate. Listen. Do not intervene unless rules are broken.
  *   *Watch for:* Challengers asking "But is it *true*?" (Remind them: "You don't know that. Ask about their evidence.")
  *   *Watch for:* Asserters reading the Hidden Box (Stop them immediately).
  *   *Watch for:* Silence. If a Challenger is passive, whisper: "Your job is to make them uncomfortable. Ask why they think they're allowed to speak."

  **The Scribe:**
  On the sheet, they record:
  *   Case Type (e.g., Lottery)
  *   Ruling (Proper/Improper)
  *   Judge's Reason (e.g., "They didn't know for sure" or "They had good evidence")

  ### Phase 3: The Debrief (35 Minutes)
  This is where the philosophy happens. Collect the Scribe Sheets. Put the results on the board.

  **Step 1: The Data Reveal (10 mins)**
  Display the rulings anonymously.
  *   "In the Lottery Case, 2 Groups ruled 'Improper', 1 Group ruled 'Proper'."
  *   "In the False Friend Case, 2 Groups ruled 'Proper', 1 Group ruled 'Improper'."

  Ask the Judges: "Why did you rule that way?"
  *   *Likely response:* "They couldn't *know* the lottery ticket would lose."
  *   *Likely response:* "It wasn't their fault the friend was wrong; they had good reason."

  **Step 2: The Truth Reveal (10 mins)**
  Now, reveal the [HIDDEN] boxes for each case.
  *   **Lottery:** "The statement was **True**. Yet some of you punished the Asserter."
      *   *Question:* "If truth wasn't the norm, what was? Why was being right not enough?" (Points toward **Knowledge Norm**).
  *   **False Friend:** "The statement was **False**. Yet some of you rewarded the Asserter."
      *   *Question:* "If truth wasn't the norm, why did you let this pass?" (Points toward **Belief/Justification Norm**).
  *   **Moorean:** "The statement was **True**, and they had evidence, but they didn't *believe* it."
      *   *Question:* "Does assertion require belief? Can you assert what you think is a lie, even if it turns out true?"

  **Step 3: Mapping the Norms (15 mins)**
  Introduce the terminology now.
  *   **The Truth Norm:** You may assert $p$ only if $p$ is true.
      *   *Test:* Did anyone punish the False Friend *because* it was false? Did anyone reward the Lottery claim *because* it was true?
  *   **The Knowledge Norm:** You may assert $p$ only if you know $p$.
      *   *Test:* Did anyone punish the Lottery claim because they lacked *knowledge* (even though it was true)? This is the Williamson view.
  *   **The Belief/Justification Norm:** You may assert $p$ only if you reasonably believe $p$.
      *   *Test:* Did anyone reward the False Friend because their belief was reasonable?

  **Closing Question:**
  "Look at your token counts. The people with the most tokens enforced a consistent rule. What rule was it? Did you prioritise not being wrong (Truth), not guessing (Knowledge), or being sincere (Belief)?"

  ---

  ## 3. Troubleshooting: What Will Go Wrong

  **1. The "Ten Minute Silence"**
  *   **Problem:** Students are polite. They don't want to challenge friends.
  *   **Fix:** The "Mandatory Challenge" Rule. Tell the Challenger at the start: "You *must* spend one Challenge Token to register a challenge. If you don't challenge at least once per round, you lose 2 tokens at the end of the round." This gamifies the conflict.

  **2. Smuggling the Truth Norm**
  *   **Problem:** A Challenger asks, "But are you sure that's true?" and the Asserter says, "Yes."
  *   **Fix:** As the Instructor, intervene early. "You are asking about the world. Ask about the *Asserter*. Ask 'What is your basis?' not 'Is it fact?'"
  *   **Why:** If the game becomes about fact-checking, the Truth Norm wins by default. The game must be about *warrant*.

  **3. Collusion/Cheating**
  *   **Problem:** An Asserter whispers to the Judge, "It's actually true, let me pass."
  *   **Fix:** Remind them that the *Hidden Box* is for the Debrief. If they reveal it, their group is disqualified from tokens for that round. The Judge is supposed to rule on *publicly available evidence*, not private omniscience.

  **4. The "Gettier" Confusion**
  *   **Problem:** A smart student might spot the Lottery case is a Gettier-style problem (True, Believed, Justified, but not Knowledge).
  *   **Fix:** If they raise it, acknowledge it but park it. "That's a brilliant observation. Write that down. We will discuss why that specific case breaks the rules in the lecture next week. For now, just rule on whether the assertion felt *proper*."

  ---

  ## 4. Limitations: What This Game Cannot Do

  Be honest with yourself (and optionally with the students) about what the game leaves out. You will need to supply this in your closing summary or the following lecture.

  1.  **The Value of Knowledge:** The game shows *when* we punish assertion, but not *why*. It doesn't explain why knowledge is more valuable than mere true belief. You must lecture on the *value problem* afterwards.
  2.  **Assertion vs. Belief:** The game conflates "proper assertion" with "justified belief". Some philosophers argue you can believe properly but assert improperly (e.g., if it's a secret). The game assumes assertion is the primary vehicle for belief expression.
  3.  **Gettier Complexity:** The Lottery case is a proxy for Gettier cases, but it's not a pure Gettier case. The game simplifies the epistemic landscape to make it playable in 90 minutes.
  4.  **Stakes:** In the game, the stakes are tokens. In real life, asserting falsely can ruin lives. The "Knowledge Norm" often gains plausibility only when stakes are high. You should mention that the game keeps stakes low, which might bias them toward the Belief Norm.

  ---

  ## 5. Instructor Cheat Sheet (The Theory)

  Keep this handy for the debrief to ensure you map their intuition correctly.

  | Case | Truth | Belief | Knowledge | **If they rule IMPROPER:** | **If they rule PROPER:** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Lottery** | True | Yes | **No** | They favour **Knowledge Norm** (Truth isn't enough). | They favour **Truth/Belief Norm** (Probability is enough). |
  | **Moorean** | True | **No** | **No** | They favour **Belief Norm** (Sincerity required). | They favour **Truth Norm** (Fact is all that matters). |
  | **False Friend** | **False** | Yes | **No** | They favour **Truth Norm** (No falsehoods). | They favour **Knowledge/Belief Norm** (Excusable error). |
  | **Guess** | True | Yes | **No** | They favour **Knowledge Norm** (No guessing). | They favour **Truth Norm** (Right is right). |

  **British English Check:**
  *   Ensure you say "behaviour", "recognise", "programme", "colour", "favour", "defence".
  *   Refer to "tokens" or "counters", not "chips".
  *   Refer to the "Instructor" or "Tutor", not "Professor" (unless that is your specific title).

  **Final Tip:**
  If the discussion stalls in the debrief, pick up a token and say: "I am asserting that this token is made of gold. Challenge me."
  When they say "It isn't," say: "But I believe it is, and I have a certificate (fake) that says so. Was my assertion proper?"
  This live demonstration usually breaks the ice on the Belief vs. Truth distinction immediately.
