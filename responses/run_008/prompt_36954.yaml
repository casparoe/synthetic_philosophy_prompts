      *   *Case 3 (Falsehood/Good Faith):* $p$ = "The meeting is at 3." Evidence = Email from boss (forged). Truth = 4pm (False). Belief = Yes. Knowledge = No.
          *   *Norm Clash:* Truth says Not OK. Knowledge says Not OK. Belief says OK.
      *   *Case 4 (Standard Knowledge):* $p$ = "I have hands." Evidence = Perception. Truth = True. Knowledge = Yes.
          *   *Baseline.*
      *   *Case 5 (Guess):* $p$ = "The coin is heads." Evidence = None. Truth = True.
          *   *Norm Clash:* Truth OK. Knowledge No. Belief Yes (maybe).

      *   *Constraint Check:* The Asserter knows the Truth on the card? If they know the Truth, they might lie.
      *   *Fix:* The Card tells the Asserter: The Proposition, The Evidence they have, and *whether they actually know it/whether it's true*.
