      *   Use "behaviour," "recognise," "programme," "colour."
      *   Tone: Professional, academic, yet practical.

  8.  **Debrief Structure:**

      *   Collect the Scribe's data (How many challenges? How many sustained?).
      *   Ask specific students: "In Round 2, you challenged the Lottery claim. Why?"
      *   Map to norms:
          *   "You challenged because they didn't *know*." -> Knowledge Norm.
          *   "You let it pass because it was *true*." -> Truth Norm.
          *   "You let it pass because they *believed* it." -> Belief Norm.
      *   Show where the norms diverge (the specific cards).

  9.  **Limitations Section:**

      *   Game can't distinguish Knowledge from Justified True Belief (Gettier) without more complexity.
      *   Game can't handle the *value* of knowledge (why does it matter?).
      *   Game creates artificial stakes.

  10. **Final Review against constraints:**
      *   14 students? Yes (3 groups of 4-5).
      *   90 mins? Yes.
      *   No lecture open? Yes.
      *   Tokens? Yes.
      *   Specific cases (Lottery, Moore, Falsehood)? Yes, baked into cards.
      *   Payoff not tracking truth? Yes, tracks Judge's ruling.
