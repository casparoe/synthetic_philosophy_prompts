      *   **Constraint 9 (Style):** British English, practical/runnable tomorrow.

  2.  **Solving the "Hard Design Problem" (Scoring without Rigging):**

      *   *Problem:* If I pay for truth, I teach the Truth Norm. If I pay for knowledge, I need an omniscient judge (me), which removes student agency.
      *   *User's Idea:* Rotating referee.
      *   *My Refinement:* The "Court of Assertion."
      *   *Mechanism:* The game isn't about whether the proposition *is* true (ontological), but whether the assertion was *acceptable* (normative).
      *   *Scoring:* The "Judge" (rotating student) decides if a challenge is valid. If the Judge rules the assertion was *improper*, the Asserter loses tokens. If the Judge rules it was *proper*, the Challenger loses tokens (for wasting the court's time).
      *   *Crucial Twist:* The Judge *does not know the truth value* of the proposition in most cases. They only see the *evidence/state* of the Asserter. This forces them to rule on the *basis* of the assertion, not the *fact* of the matter.
      *   *Wait, one issue:* For the "Falsehood" case, we need to know it's false to trigger the tension. For the "Lottery" case, we need to know they don't know.
      *   *Solution:* The Game Master (Instructor) holds the "Truth Key." The Judge makes the ruling based on the Asserter's justification. *However*, the payoff needs to reflect the tension.
      *   *Better Solution:* The "Blind Verdict."
          *   Asserter draws a card. It tells them the Proposition ($p$), their Evidence State ($E$), and the Truth Value ($T$) - *but they must keep $T$ secret.*
          *   Asserter asserts $p$.
          *   Challenger challenges ("You shouldn't say that").
          *   Judge hears the Asserter's justification (based on $E$) and the Challenger's objection.
          *   Judge rules: "Sustained" (Improper Assertion) or "Overruled" (Proper Assertion).
          *   *Payoff:*
              *   If Overruled: Asserter gains tokens (rewarded for speaking).
              *   If Sustained: Asserter loses tokens (penalised for speaking).
              *   Challenger gains/loses based on whether they were right (aligned with Judge).
          *   *The Reveal:* After the round, the Instructor reveals the Truth Value and the Epistemic Status (e.g., "Actually, this was a lottery ticket").
          *   *The Data:* The interesting part is when the Judge rules "Proper" but the Truth is False, or Judge rules "Improper" but the Truth is True. This creates the debrief material.
      *   *Refinement for the "Hard Problem":* To prevent the Truth Norm from smuggling in via the *Instructor's* payoff design, the tokens should reward *consistency with the group's emerging norm*, not truth. But that's too complex.
      *   *Simplest Robust Design:* The Judge decides propriety *without knowing the truth*. This is key. If the Judge doesn't know if $p$ is true, they *cannot* rule based on the Truth Norm explicitly. They must rule on Belief or Knowledge cues.
      *   *Wait, the Instructor knows the truth.* The Instructor can award a "Bonus" if the assertion was True, but the main game score is based on the Judge's ruling. This separates "Getting it right" (Truth) from "Playing by the rules" (Norm).
      *   *Actually, let's look at the prompt again:* "If payoffs track whether the asserted proposition turns out true... you've smuggled in the truth norm."
      *   *Okay, strict constraint:* Payoffs must *not* track truth. They must track the *Judge's Ruling*.
      *   *So:* Asserter wants the Judge to say "That was okay." Challenger wants the Judge to say "That was not okay."
