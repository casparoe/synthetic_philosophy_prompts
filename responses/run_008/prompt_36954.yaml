      *   *The Reveal:* The Instructor reveals the hidden facts *after* the ruling to show why the ruling was philosophically interesting.

  3.  **Game Structure:**

      *   **Name:** "The Assertion Court."
      *   **Roles:** Asserter, Challenger, Judge (rotate every 3 rounds). Rest of class = Jury (can vote if Judge is deadlocked, or just observe). Let's keep it tight: 3 active, 11 observing/waiting. Better: 3 groups of 4-5. Each group plays simultaneously. This increases engagement.
      *   **Groups:** 3 tables of 4-5 students.
      *   **Roles per Table:** Asserter, Challenger, Judge, Scribe (records rulings).
      *   **Rounds:** 5 Rounds.
      *   **Cards:** Need specific scenarios.

  4.  **Drafting the Cards (The Core Content):**

      *   *Case 1 (Lottery):* $p$ = "This ticket will lose." Evidence = 1 in 1000 win chance. Truth = Lose (True). Knowledge = No.
          *   *Norm Clash:* Truth says OK. Knowledge says Not OK. Belief says OK (if they believe it).
      *   *Case 2 (Moore/Unbelieving):* $p$ = "It is raining." Evidence = Looking out window (sees rain). Mental State = Thinks it's a hologram/trick. Truth = Rain (True). Belief = No.
