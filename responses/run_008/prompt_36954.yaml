      *   *Correction:* In the "Falsehood" case, the Asserter *believes* it is true. The Card should say: "You believe $p$. You have excellent evidence. (Instructor Note: $p$ is actually False)."
      *   *Actually, for the game to work, the Asserter must *try* to assert properly.*
      *   *Revised Card Info for Asserter:*
          1.  What you say ($p$).
          2.  Your Evidence/State (e.g., "You checked the schedule," or "You hold a lottery ticket").
          3.  *Hidden Info:* The Card tells the Asserter the "Reality" (True/False) but they must act as if they only have their Evidence.
          4.  *Wait, if they know it's false on the card, they are lying.*
          5.  *Better:* The Card describes the *scenario*. "You are in a world where..."
          6.  *Let's simplify:* The Asserter is *given* the state. They don't choose. They are told: "In this scenario, you believe $p$, you have evidence $E$. $p$ is actually True/False."
          7.  *Crucial:* The Asserter must argue *why* they were allowed to speak based on their Evidence, not the Truth (which the Judge doesn't know).

  5.  **Refining the Mechanics (Addressing the "Hard Problem"):**

      *   If the Judge doesn't know the truth, they can't rule on Truth Norm directly. They rule on *warrant*.
      *   Payoff:
          *   Asserter gets 2 tokens if Judge says "Proper."
          *   Challenger gets 2 tokens if Judge says "Improper."
          *   Judge gets 2 tokens if the *Group* (debrief) agrees their ruling was defensible later? No, that's too meta.
          *   Judge gets tokens for speed/decisiveness? No.
          *   Judge gets tokens simply for participating.
      *   *The Twist:* The Instructor holds the "Truth Key." After the Judge rules, the Instructor reveals the Truth/Knowledge status.
      *   *The Tension:* If the Judge rules "Proper" on a Falsehood, the class sees the Belief Norm in action. If they rule "Improper" on a True Lottery claim, they see the Knowledge Norm.
      *   *Avoiding Rigging:* Do not give tokens for Truth. Only give tokens for winning the argument (Judge's ruling). This makes the *Judge's intuition* the data source.

  6.  **Addressing Practicalities:**

      *   **Time:** 90 mins.
      *   **Setup:** 10 mins.
      *   **Game:** 40 mins (3 rounds of 10 mins + rotation).
      *   **Debrief:** 35 mins.
      *   **Buffer:** 5 mins.
      *   **Troubleshooting:**
          *   *Silence:* Force the Challenger to speak. Give them a "Challenge Token" they *must* spend.
          *   *Collusion:* "Tell your friend the answer." -> Make the cards sealed. Only the Asserter sees the card.
          *   *Truth Norm Smuggling:* Explicitly forbid the Asserter from saying "It's true!" They must say "I have good reason."

