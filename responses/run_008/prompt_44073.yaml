answer: |-
  You have correctly identified that your friend has sidestepped the standard probabilistic error found in introductory versions of the Two-Envelope Paradox. In the standard version, the paradox relies on the false assumption that, conditional on seeing $x$, the other envelope is equally likely to contain $x/2$ or $2x$. Your friend has constructed a proper probability space where the conditional probabilities are indeed $1/3$ and $2/3$, and the conditional arithmetic in steps (2) through (4) is flawless.

  The error lies in **Step (5)**.

  Here is the breakdown of why that step fails, why it looks innocent, what it costs you to reject it, and the status of the "pre-opening" value you suspected was problematic.

  ### 1. The Mathematical Failure: Step (5)
  Step (5) asserts: *If switching is favored after every possible observation, then it is favored without looking.*

  Formally, your friend is invoking the **Law of Total Expectation**:
  $$E[Y] = \sum_x E[Y \mid X=x] P(X=x)$$
  He argues that since $E[Y \mid X=x] > x$ for all $x$, it must follow that $E[Y] > E[X]$.

  This inference is valid **if and only if** the expectations are finite (technically, if $X$ and $Y$ are integrable, i.e., $E[|X|] < \infty$). In your friend's setup, they are not.

  Let us calculate the unconditional expectation of the envelope you hold, $X$.
  The probability of seeing $3^k$ is the sum of two disjoint cases:
  1.  The pair is $(3^k, 3^{k+1})$ (run of $k$ tails) and you picked the smaller: $P = \frac{1}{2} \cdot (\frac{1}{2})^{k+1}$.
  2.  The pair is $(3^{k-1}, 3^k)$ (run of $k-1$ tails) and you picked the larger: $P = \frac{1}{2} \cdot (\frac{1}{2})^{k}$.

  Summing these gives $P(X=3^k) = \frac{1}{2^{k+2}} + \frac{1}{2^{k+1}} = \frac{3}{2^{k+2}}$.

  Now, compute $E[X]$:
  $$E[X] = \sum_{k=0}^{\infty} 3^k \cdot P(X=3^k) = \sum_{k=0}^{\infty} 3^k \cdot \frac{3}{2^{k+2}} = \frac{3}{4} \sum_{k=0}^{\infty} \left(\frac{3}{2}\right)^k$$
  This is a geometric series with ratio $r = 1.5$. It diverges to $+\infty$.

  Because $E[X] = \infty$ and $E[Y] = \infty$, the inequality $E[Y] > E[X]$ is meaningless (it amounts to $\infty > \infty$). The Law of Total Expectation does not hold for non-integrable random variables. You cannot aggregate local conditional advantages into a global advantage when the sum of those advantages diverges. This is a violation of the conditions required for **Fubini's Theorem** or the **Dominated Convergence Theorem**.

  ### 2. Why Step (5) Looks Innocent
  This step exploits a deeply ingrained intuition in decision theory: the **Principle of Dominance**. In finite cases (or cases with bounded utility), if strategy $A$ yields a higher expected return than strategy $B$ in every possible state of the world, then $A$ must have a higher unconditional expected return than $B$.

  This principle is so reliable in standard applications (where payoffs are bounded or probabilities decay faster than payoffs grow) that it feels like a logical truth. Your friend's construction is a specific counterexample designed to break the integrability condition while preserving the local dominance. It looks innocent because it mimics the structure of a valid dominance argument, but it removes the mathematical foundation (convergence) required to support the weight of that argument.

  ### 3. What Rejecting Step (5) Costs
  Rejecting Step (5) does not break decision theory, but it does enforce a boundary condition on **Expected Utility Theory (EUT)**.

  *   **The Cost:** You must accept that EUT cannot guide action in scenarios where expected utility is undefined or infinite. You cannot use "maximize expected value" as a decision rule when the values diverge.
  *   **The Local Lesson:** Rationality requires more than just local conditional consistency; it requires global integrability. If a decision problem generates infinite expectations, the standard axioms of EUT (specifically the independence and continuity axioms as applied to unbounded outcomes) cease to provide a unique ranking of options.
  *   **Decision Theory Status:** Decision theory is not wounded; it is merely being asked to operate outside its domain of definition. This is the same lesson taught by the **St. Petersburg Paradox**. In the St. Petersburg game, a game with infinite expected value is not necessarily worth an infinite entry fee. The resolution there, as here, is to recognize that linear utility over unbounded monetary outcomes is a modeling error, not a logical contradiction.

  ### 4. The "Weak Mathematics" of the Pre-Opening Value
  You wrote: *"when I try to work out what my envelope is worth before opening it, the series refuses to settle into a finite number, and I can't tell whether that is my weak mathematics or the point."*

  That is precisely the point. Your mathematics is correct; the series diverges. The "paradox" exists entirely because the unconditional expectation is undefined.
  *   If $E[X]$ were finite, Step (5) would be valid, and we would have a genuine contradiction (since symmetry dictates $E[X] = E[Y]$).
  *   Because $E[X]$ is infinite, there is no contradiction. Symmetry dictates $E[X] = E[Y]$ (both are $\infty$), and the conditional calculation dictates $E[Y \mid X] > X$. These two facts can coexist when the totals are infinite.

  ### 5. Addressing the "Endless Cycle" (Step 6)
  Your friend claims that conditional expectation issues an endless cycle of commands (switch, then switch back, etc.).
  *   **Observation:** If you switch, you hold $Y$. If you calculate the conditional expectation of switching back to $X$ given $Y$, the math is identical. You will always want to switch back.
  *   **Resolution:** This is not a contradiction in action, but a feature of infinite expectations. Since the expected gain from any single switch is positive (locally) but the total expected wealth is infinite, you are essentially chasing an infinite horizon. You never actually "gain" anything in the aggregate because the "gain" is distributed over a divergent tail.
  *   **Practical Dissolution:** If you replace linear utility $U(x) = x$ with a bounded utility function, such as log utility $U(x) = \log(x)$ (reflecting risk aversion or diminishing marginal utility), the paradox vanishes.
      *   With $U(x) = \log(x)$, the conditional expected utility of the other envelope is:
          $$E[\log Y \mid X=3^k] = \frac{1}{3}(k+1)\log 3 + \frac{2}{3}(k-1)\log 3 = (k - \frac{1}{3})\log 3$$
      *   Since your current utility is $k \log 3$, you should **keep** your envelope. The preference reverses.
      *   This shows the paradox is an artifact of assuming risk-neutrality over unbounded domains.

  ### Summary for Your Paper
  1.  **Reject Step (5).** The inference from pointwise conditional dominance to unconditional dominance fails when expectations are non-integrable.
  2.  **Validate Steps (2)-(4).** Your friend's conditional probability derivation is correct; this is a "St. Petersburg Two-Envelope" variant, not the standard fallacious one.
  3.  **Diagnose the Divergence.** The unconditional expectation $E[X]$ is infinite. The "paradox" is a conflict between symmetry ($\infty = \infty$) and local dominance, which is permissible in measure theory when integrability conditions are violated.
  4.  **Preserve Decision Theory.** The damage is local to unbounded linear utility. The lesson is that Expected Value is not a well-defined ordering relation for all probability distributions, only for those with finite first moments.

  Your friend has not broken decision theory; he has successfully constructed a case where the **integrability condition** of the Law of Total Expectation is violated. The "blunder" is not in the probability math, but in the assumption that infinite expectations behave like finite ones.
