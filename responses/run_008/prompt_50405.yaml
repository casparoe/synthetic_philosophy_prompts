          *   **Nuance:** It's not a *proof* in the mathematical sense that *all* intransitive agents *always* lose all money. It's a vulnerability demonstration. Agents can learn, refuse trades, or have transaction costs that stop the pump.

      *   *Claim 3: "Settles transitivity as a requirement of rationality."*
          *   **Status:** Controversial/Debated.
          *   **Nuance:** Many decision theorists accept transitivity as an axiom of rationality (e.g., von Neumann-Morgenstern). However, the money pump is often used as a *pragmatic justification* for the axiom, not necessarily a logical proof of it. Some argue it shows *pragmatic* irrationality (exploitability), not necessarily *structural* irrationality.

      *   *Claim 4: "Rational agent should evaluate every choice on its own terms, ignoring how it got into the situation."*
