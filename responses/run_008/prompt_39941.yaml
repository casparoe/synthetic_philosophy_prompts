      *   **Role:** Member of the collections committee of a mid-sized regional museum.
      *   **Task:** Draft a decision memo to circulate before the committee votes.
      *   **Subject:** A 17th-century terracotta Madonna damaged by fire (only 1/3 original material remains: torso/drapery). Proposal is full reconstruction (new armature, new clay/resin for missing parts).
      *   **Conflict:** Director (wants "conserved," same object) vs. Registrar (wants new accession number, essentially a new object) vs. Insurers (need "restoration" to pay full claim).
      *   **Philosophical Underpinning:** Ship of Theseus / Statue and the Clay puzzle (Material continuity vs. Design/Identity continuity).
      *   **Requirements:**
          *   Concrete bottom line (Same vs. New Accession Number).
          *   Specific wall label wording.
          *   Defensible stance for insurers.
          *   Engage the strongest point of the losing side (don't steamroll).
          *   Tone: Professional, thoughtful, decisive, museum-appropriate.

  2.  **Determine the Stance:**
      *   *Option A (Same Object):* Aligns with the Director and Insurers. Preserves the "aura" of the object for visitors. Risk: Accusations of deception if the reconstruction is too extensive.
      *   *Option B (New Object):* Aligns with the Registrar. Intellectually honest about material loss. Risk: Financial loss (insurance), diminished visitor experience, potential deaccessioning of the "relic" fragments.
      *   *Decision:* For a regional museum, the educational and financial reality usually tips the scale toward *preserving the identity of the artwork* while being radically transparent about the intervention. A new accession number effectively deaccessions the original and creates a "fake," which undermines the museum's mission to preserve history. However, calling it "conserved" without qualification is misleading.
      *   *Strategy:* Rule for the **Same Accession Number** (it remains the *Madonna*), but mandate a label that explicitly acknowledges the reconstruction. This satisfies the insurance requirement (it's a restoration, not a replacement) and the Director's goal (display), but addresses the Registrar's concern (transparency) by changing the label, not the number.
      *   *Why this works best:* It treats the artwork as a *historical entity* rather than just a pile of atoms. 33% original material, specifically the core torso, provides sufficient material continuity to argue identity, provided the reconstruction is distinguishable upon close inspection or disclosure.

  3.  **Drafting - Section by Section:**

