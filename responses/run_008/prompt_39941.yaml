          *   The "New Object" approach suggests the history died. But the history *includes* the fire and the reconstruction.
      *   **Insurance & Ethics:**
          *   Insurance needs "restoration." This aligns with the "Same Object" ruling.
          *   Ethical obligation is transparency, not material purity.
      *   **Implementation:**
          *   Conservation standards (distinguishable on close inspection?).
