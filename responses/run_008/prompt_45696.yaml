answer: |-
  # The IBE Triage Protocol (v1.0)
  **Owner:** Platform Reliability Team
  **Constraint:** 20-Minute Decision Window
  **Philosophical Basis:** Inference to the Best Explanation (Lipton/van Fraassen)

  ## 1. The Core Philosophy
  We do not deal in certainties; we deal in explanations. When an incident occurs, we are not calculating probabilities (we lack the data for true Bayesian updates); we are selecting the hypothesis that, *if true*, would make the observed evidence least surprising.

  We distinguish between the **Likely** (statistically frequent) and the **Lovely** (explanatorily potent). In triage, we prioritize the *Lovely* because the *Likely* is often a trap (e.g., "Deploys usually cause incidents" is likely, but "DNS outages cause global latency" is lovelier when *everything* is slow).

  ### The Explanatory Virtues (Priority Ordered)
  When virtues conflict, use this ordering. Do not deviate without escalation.

  1.  **Fit (Consistency with Background Knowledge):** Does the hypothesis contradict hard facts (e.g., metrics, logs, topology)? If yes, discard immediately.
      *   *Defense:* A hypothesis that contradicts known system state is not just unlikely; it is impossible. This is eliminative reasoning, which is faster than constructive reasoning.
  2.  **Scope (Breadth of Evidence):** How much of the observed anomaly does the hypothesis explain?
      *   *Defense:* A hypothesis that explains 90% of the symptoms is superior to one that explains 10%, even if the latter is more "common." This prevents tunnel vision on the "Last Deploy."
  3.  **Mechanism (Causal Plausibility):** Is there a coherent causal chain from cause to effect?
      *   *Defense:* Correlation is not causation. "We deployed, then it broke" is temporal, not mechanical. We require a "how."
  4.  **Unification (Simplicity/Standardization):** Does this fit a known pattern of failure?
      *   *Defense:* This is the tie-breaker. If two hypotheses fit and have equal scope, prefer the one that aligns with historical failure modes (Hanlon's Razor applied to infrastructure).

  ### Objection: "Is this just Bayesian Reasoning in disguise?"
  **Answer:** No. Bayesian reasoning requires explicit priors ($P(H)$) and likelihoods ($P(E|H)$). In a 20-minute triage window, you do not have the historical data to calculate $P(\text{DNS Outage})$ vs $P(\text{Config Error})$.
  IBE is not about calculating the probability that the hypothesis is *true*; it is about assessing the *explanatory power* of the hypothesis relative to competitors. It is a heuristic for **hypothesis selection**, not belief updating. We use IBE to pick the horse to bet on, knowing the odds are unknown. Bayesianism pretends to know the odds; IBE admits it is choosing the best story available.

  ---

  ## 2. The Procedure

  ### Phase 1: Evidence Lockdown (Minutes 0–5)
  *Goal: Define the anomaly without implying cause.*
  1.  **Define the Symptom:** Write down exactly what is broken. (e.g., "API Latency > 2s," not "API is slow because of deploy").
  2.  **Define the Scope:** Who/what is affected? (All users? One tenant? One region?)
  3.  **Collect Hard Facts:** Grab the three key metrics (Traffic, Errors, Latency) and the Change Log.
      *   *Stop Condition:* If you cannot define the symptom in one sentence, escalate to Incident Commander.

  ### Phase 2: Hypothesis Generation (Minutes 5–10)
  *Goal: Generate competing explanations, explicitly including the reflex.*
  1.  **The Reflex Hypothesis:** Write down "The Last Deploy/Config Changed caused this."
  2.  **The External Hypothesis:** Write down "An Upstream/Dependency/Network issue caused this."
  3.  **The Internal State Hypothesis:** Write down "Resource Exhaustion/State Corruption caused this."
      *   *Constraint:* You must have at least two competing hypotheses. If you only have one, you are biased. Force a second.

  ### Phase 3: Virtue Scoring (Minutes 10–15)
  *Goal: Filter hypotheses using the Priority Order.*
  1.  **Apply FIT:** Does either hypothesis contradict a hard fact? (e.g., If latency is global, "Single Tenant Code" fails Fit).
      *   *Action:* Eliminate any hypothesis failing Fit.
  2.  **Apply SCOPE:** Which hypothesis explains more of the symptoms? (e.g., Does "Deploy" explain the database CPU spike? If no, Scope is low).
      *   *Action:* Rank remaining hypotheses by Scope.
  3.  **Apply MECHANISM:** For the top-ranked hypothesis, sketch the causal chain. (e.g., "Config changed X, which increased Y, leading to Z").
      *   *Action:* If the mechanism requires "magic" (unknown steps), downgrade the hypothesis.
  4.  **Apply UNIFICATION:** Is this a known failure mode?
      *   *Action:* Use only to break ties.

  ### Phase 4: Decision & Meta-Cognition (Minutes 15–20)
  *Goal: Commit or Escalate.*
  1.  **The "Loveliness" Check:** Look at your top hypothesis. Is it *too* perfect? Does it explain everything *too* neatly?
      *   *Warning:* If the explanation is "Lovely" but relies on assumptions you haven't verified, you are in the **Loveliness Trap**.
  2.  **The Decision:**
      *   **Rollback/Restart:** Only if the Top Hypothesis is "The Reflex" AND Mechanism is strong.
      *   **Page Vendor/Upstream:** Only if Top Hypothesis is "External" AND Scope is global.
      *   **Tell Customer:** Only if Top Hypothesis is "Customer Code" AND Fit eliminates internal causes.
      *   **Escalate to Human Judgment:** If the Top Hypothesis fails Mechanism, or if two hypotheses tie on Scope.
  3.  **The Honesty Clause:** If you are choosing a hypothesis because it allows you to take action (e.g., rollback) rather than because it is the Best Explanation, mark the ticket as **"Actionable Hypothesis, Low Confidence."**

  ---

  ## 3. Procedure Simulation (Postmortem Backlog)

  ### Case 1: The DNS Decoy
  **Incident:** Global latency spike starts 5 minutes after a configuration deploy.
  **Truth:** Upstream DNS provider outage.
  **Procedure Run:**
  1.  **Evidence:** Latency up 500ms globally. Config deploy at T-5 mins.
  2.  **Hypotheses:**
      *   H1 (Reflex): Config Deploy broke routing.
      *   H2 (External): DNS Provider Outage.
  3.  **Virtue Scoring:**
      *   **Fit:** Both fit. (Deploy happened; DNS is used).
      *   **Scope:** H1 explains latency. H2 explains latency. Tie.
      *   **Mechanism:** H1 Mechanism: "Config changed routing table." (Plausible). H2 Mechanism: "DNS resolution slow." (Plausible).
      *   **Unification:** H1 is "Standard" (Deploys break things). H2 is "Rare" (DNS rarely fails).
  4.  **Decision:** Procedure selects **H1 (Config Deploy)** based on Unification (Priority 4) breaking the tie.
  5.  **Action:** Rollback config. Latency persists.
  6.  **Outcome:** **CONFIDENTLY WRONG.**
  7.  **Failure Analysis:** The procedure failed because **Unification** was allowed to break a tie between Scope and Mechanism. In high-ambiguity scenarios, "Rare events happen." The procedure prioritized historical frequency over causal depth.
      *   *Hindsight Flag:* The **Mechanism** step was too superficial. A deeper Mechanism check would have asked: "Does this config change actually affect routing logic?" If the config was a feature flag, the Mechanism for H1 is weak. The procedure allows "Plausible" to pass without verification.
      *   *Fix:* Promote Mechanism above Unification. Never let "Commonality" beat "Causality."

  ### Case 2: The Single-Tenant Pool Exhaustion
  **Incident:** Intermittent 500s affecting only Customer A.
  **Truth:** Our connection pool exhausted due to a leak triggered by Customer A's specific traffic pattern.
  **Procedure Run:**
  1.  **Evidence:** 500 Errors. Only Customer A affected. System CPU/Mem normal.
  2.  **Hypotheses:**
      *   H1 (Reflex): Customer A sent bad payloads/code.
      *   H2 (Internal): Our Service Connection Pool Exhaustion.
  3.  **Virtue Scoring:**
      *   **Fit:** H1 fits "Single Tenant." H2 fits "Single Tenant" (if sharded/isolated).
      *   **Scope:** H1 explains Customer A errors. H2 explains Customer A errors. Tie.
      *   **Mechanism:** H1 Mechanism: "Bad input causes crash." (Strong). H2 Mechanism: "Pool exhaustion causes 500s." (Strong).
      *   **Unification:** H1 is "Common" (Customers break things). H2 is "Less Common" (Pool leaks are rarer).
  4.  **Decision:** Procedure selects **H1 (Customer Code)** based on Unification.
  5.  **Action:** Tell Customer to check their code.
  6.  **Outcome:** **CONFIDENTLY WRONG.**
  7.  **Failure Analysis:** This is the **Loveliness vs. Likelihood** gap in action. H1 was *Likely* (customers often cause tenant-specific issues). H2 was *Lovely* (if true, it explains why *only* Customer A triggered a global resource constraint).
      *   *Where it went wrong:* The **Fit** check was superficial. The engineer assumed "Single Tenant = Tenant Fault." They did not check if the tenant was isolated in the connection pool.
      *   *Hindsight Flag:* The **Meta-Cognition** step should have flagged this. "Am I choosing H1 because it explains the data, or because it shifts blame?" The procedure requires honesty here, but under pressure, engineers lie to the checklist.
      *   *Fix:* Add a "Negative Test" to Phase 3. "What evidence would prove H1 false?" (e.g., Check pool metrics). If you skip the test, you cannot commit to H1.

  ### Case 3: The Ghost Incident
  **Incident:** Alert fires for 5 minutes. All metrics return to normal before on-call engages. No logs captured the spike.
  **Truth:** Transient network blip (never confirmed).
  **Procedure Run:**
  1.  **Evidence:** Alert fired. Now normal. No logs.
  2.  **Hypotheses:**
      *   H1: Transient Network Blip.
      *   H2: Silent Data Corruption (resolved by retry).
  3.  **Virtue Scoring:**
      *   **Fit:** H1 fits (Networks blip). H2 fits (Retries exist).
      *   **Scope:** Neither explains anything (no data).
      *   **Mechanism:** Both are speculative.
  4.  **Decision:** Procedure forces a choice. Selects **H1** via Unification (Blips are common).
  5.  **Action:** Close ticket as "Transient."
  6.  **Outcome:** **PROCEDURAL FAILURE (Category Error).**
  7.  **Failure Analysis:** IBE requires *Evidence* to infer the *Best Explanation*. With no evidence, IBE degenerates into guesswork. The procedure forced a hypothesis where none was warranted.
      *   *Hindsight Flag:* Phase 1 (Evidence Lockdown) should have a **Stop Condition**: "If Evidence < Threshold, Do Not Hypothesize."
      *   *Fix:* Add a "No-Hypothesis" outcome. If Scope and Mechanism cannot be evaluated due to lack of data, the action is "Instrumentation Deploy," not "Root Cause Closure."

  ---

  ## 4. Honest Assessment of the Procedure

  **Where is this a Judgment Call dressed as a Checklist?**
  1.  **Scoring "Mechanism":** Determining if a causal chain is "Plausible" vs. "Magic" is subjective. A senior engineer sees a mechanism where a junior sees magic. The checklist cannot encode ten years of system intuition.
  2.  **The "Loveliness Trap":** The Meta-Cognition step asks the engineer to doubt their own conclusion. If they are tired (Minute 18 of a night shift), they will skip this. The procedure relies on the virtue of the operator, which is the very variable we are trying to control.

  **Why use this instead of a Decision Tree?**
  A decision tree assumes the world is deterministic (If X, then Y). Production systems are probabilistic and complex. A decision tree fails when the bug is novel. IBE forces the engineer to construct a *story* about the system. Even if the story is wrong (Case 1 & 2), the act of constructing it reveals gaps in knowledge (e.g., "Wait, do we know if Customer A shares a pool?").

  **Final Directive:**
  Use this protocol to structure your thinking, not to replace it. If the procedure tells you to blame the customer, but your gut says "Check the pools," **listen to the gut and escalate.** The procedure is a tool to prevent reflex, not a shield against responsibility. If you follow the checklist into a wall, the checklist is wrong, not the wall.
