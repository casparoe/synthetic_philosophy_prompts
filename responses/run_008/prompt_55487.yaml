      *Let's write it.*
answer: |-
  The single most important design decision is to withhold the aggregated data until students have verbally committed to a causal story explaining the group imbalance.

  **Reasoning**
  If you show the numbers first, they treat the reversal as a mathematical magic trick; if you establish the causal mechanism (self-selection bias) first, the reversal becomes an inevitable arithmetic consequence of that structure. This shifts the lesson from "statistics are weird" to "data structure reflects design."

  **Sequence of Pieces (15 Minutes)**

  1.  **The Setup (0–3 mins):** Define the variables without numbers. You have an Intervention (Workshop vs. No Workshop) and an Outcome (Social Success). Introduce the grouping variable (High Anxiety vs. Low Anxiety) as a *pre-existing* trait that influences both the likelihood of signing up for the Workshop and the baseline likelihood of Social Success.
  2.  **The Commitment (3–5 mins):** Ask the room: "If High Anxiety students are both less likely to succeed naturally and more likely to sign up for help, which group will be overrepresented in the Workshop condition?" Make them say "The High Anxiety group." Write this on the board. This establishes the confounding structure before any arithmetic appears.
  3.  **The Subgroup Data (5–9 mins):** Reveal the contingency tables for High Anxiety and Low Anxiety separately. Show that the Workshop improves success rates in *both* groups. Ask: "So, does the workshop work?" They will say yes.
  4.  **The Aggregation (9–11 mins):** Reveal the overall table. Show the reversal (No Workshop looks better). Let the panic set in. Then point back to the board where they admitted the Workshop group was loaded with High Anxiety students. Show the arithmetic: the "No Workshop" group is mostly Low Anxiety people who would have succeeded anyway.
  5.  **The Misconception Check (11–13 mins):** Address the two errors (see below).
  6.  **The Exit Question (13–15 mins):** Pose the check question.

  **The Fresh Example: The "Social Anxiety Workshop"**

  *   **Context:** A department offers a voluntary social skills workshop to undergraduates.
  *   **Treatment:** Attended Workshop vs. Did Not Attend.
  *   **Outcome:** Successfully initiated a conversation at a mixer (Yes/No).
  *   **Subgroups:** High Social Anxiety vs. Low Social Anxiety (measured *before* recruitment).
  *   **The Data Structure:**
      *   *High Anxiety:* Mostly attend Workshop (90%), low baseline success (20%). Workshop boosts them to 50%.
      *   *Low Anxiety:* Mostly skip Workshop (90%), high baseline success (80%). Workshop boosts them to 90%.
      *   *Overall:* The "No Workshop" group looks superior because it is composed almost entirely of Low Anxiety students, while the "Workshop" group is composed almost entirely of High Anxiety students.
  *   **What it must contain:** Explicit mention that Anxiety was measured *before* the decision to attend. This establishes the grouping variable as a confounder, not a mediator.
  *   **What it must be kept clean of:** Any suggestion that the Workshop *caused* the Anxiety. Do not mention dropout rates or post-treatment measures. Keep the timeline linear: Trait → Selection → Treatment → Outcome.

  **Misconceptions and Where to Head Them Off**

  1.  **"The aggregate is always the misleading view."**
      *   *Where:* During **The Aggregation (9–11 mins)**.
      *   *Correction:* Clarify that the aggregate is not "wrong," it is just answering a different question ("What happens if we look at the whole population without adjusting for anxiety?"). It is misleading for *causal inference* about the workshop, but accurate for *description* of the attendees.
  2.  **"The subgroups are always the ones to trust."**
      *   *Where:* During **The Misconception Check (11–13 mins)**.
      *   *Correction:* This is the dangerous one. State clearly: "You can only trust the subgroups because I told you Anxiety was measured *before* the workshop." If you split by a variable caused by the treatment (e.g., "How much they enjoyed the workshop"), you create bias. Subgroups are only superior if the grouping variable is a pre-existing confounder.

  **The Check Question**
  "If I told you the 'High Anxiety' group was defined by how stressed students felt *after* the workshop started, would you still trust the subgroup comparison over the aggregate?"
  *(Correct answer: No, because now the grouping variable is potentially caused by the treatment, making it a mediator or collider, not a confounder.)*

  **What to Refuse to Cover**
  Do not attempt to teach them how to distinguish confounders from colliders using DAGs or formal causal criteria. Fifteen minutes is insufficient to teach causal identification strategies. If a student asks, "How do I know if I should split by this variable or not?" your answer must be: "That requires theoretical knowledge of your variables' timeline, not statistical testing. If the variable exists before treatment, adjust; if it happens after, do not. If you aren't sure, talk to your supervisor about design, not me about math."
