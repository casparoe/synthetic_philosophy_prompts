answer: |-
  This is one of the sharpest critiques of contemporary energy policy I've seen. You have correctly identified that standard Expected Utility Theory (EUT) cannot explain the German *Energiewende* as executed. If the metric were "expected deaths per TWh" or "expected CO2 per TWh," the decision matrix is trivial: keep nuclear, kill coal.

  The fact that Germany did the inverse implies that the decision was not made using a consequentialist risk calculus. To unpack this, we have to look at the specific German legal-philosophical framework regarding risk, the sociological dimension of "acceptability," and the political economy of the 2022 extension.

  Here is an unpacking of the risk theory presupposed by the German exit, why it fails coherence tests, and what the France comparison actually reveals.

  ### 1. The Presupposed Theory: Deontological Constraints on *Restrisiko*

  You suggested a "maximin" or threshold view where catastrophic possibilities dominate expected values. That is close, but it needs a specific modification to fit the German case. The German policy does not presuppose a theory of *outcome* severity (since climate catastrophe is worse than a meltdown); it presupposes a theory of **agency and controllability.**

  The governing concept in German administrative law is the *Vorsorgeprinzip* (Precautionary Principle), but it is applied through the lens of **uninsurable residual risk (*Restrisiko*).**

  *   **The Nuclear View (Deontological):** The risk of a meltdown is categorized as an *uncontrollable technological hazard.* Once a chain reaction begins, human agency is removed from the loop. Furthermore, the waste creates an intergenerational liability that cannot be insured or fully secured. Therefore, the risk is treated as a rights violation in principle. It doesn't matter if the probability is $10^{-7}$; if the consequence is "loss of sovereign control over territory" (exclusion zones), it is categorically forbidden.
  *   **The Coal/Climate View (Consequentialist/Managerial):** Climate change is treated as a *manageable externality.* The harm is statistical, diffuse, and—crucially—viewed as subject to political mitigation over time. The German state presupposes that climate catastrophe is *avoidable* through future deployment of renewables and efficiency. Therefore, burning lignite today is a "bridge" sin, not an existential taboo.

  **The Incoherence:** This presupposes an epistemic asymmetry: that we have more control over the global climate system (via policy) than we do over a contained reactor vessel (via engineering). This is scientifically dubious but politically robust. The theory licenses the exit + lignite only if you accept that **technological irreversibility (waste/meltdown) is morally worse than ecological irreversibility (climate tipping points),** because the former is a specific human artifact while the latter is a diffuse aggregate outcome.

  ### 2. Is There a Coherent Theory Licensing Both?

  There is no coherent *physical* risk theory that licenses both. However, there is a coherent **sociological risk theory.**

  The theory is: **Risk is not a property of the technology; it is a property of the social contract.**

  *   **Nuclear Risk:** In Germany, nuclear power is viewed as a **centralized imposition.** It requires a strong state to enforce security, manage waste, and guarantee safety. Post-WWII and post-Chernobyl, the German social contract is deeply suspicious of centralized state technocracy. The risk is "who controls this?" If the state fails, the citizen dies.
  *   **Coal/Climate Risk:** This is viewed as a **collective burden.** It is diffuse. No single lignite plant is responsible for a climate death. This allows for "moral disengagement." The harm is externalized to the global south or the future.

  **The Coherent View:** The policy presupposes that **local, acute, technocratic risks are politically intolerable, while global, chronic, statistical risks are politically manageable.**
  This is not a theory of *harm*; it is a theory of *blame.* A nuclear meltdown creates a specific culprit (the operator/state). A climate death has no specific culprit. The German exit is a strategy to minimize *assignable blame* for catastrophic failure, even if it increases *total expected harm.*

  ### 3. The France Comparison: Institutional Trust as a Variable

  You asked if the France comparison shows risk theory underdetermines policy. Yes, but more specifically, it shows that **risk assessment is endogenous to state capacity.**

  *   **France:** The French state (via EDF) is a unitary actor. It controls the grid, the fuel cycle, and the waste storage (Cigéo). The risk calculus presupposes a **high-trust state.** If the state says "this is safe," the social contract accepts it. The risk is nationalized; therefore, the benefit (energy sovereignty) is also nationalized.
  *   **Germany:** The German state is federalized and coalition-dependent. The risk is localized (e.g., a reactor in Bavaria risks the Bavarian population), but the benefit is grid-wide. The "Not In My Backyard" (NIMBY) dynamic is stronger.

  **The Implication:** France presupposes that risk can be **administered.** Germany presupposes that risk must be **consented to.** Since you cannot get active consent for nuclear waste storage spanning 10,000 years, the technology is rejected. France shows that a "straightforward expected-harm probabilism" is only possible when the population trusts the entity doing the math. Germany lacks that trust; therefore, it defaults to a heuristic: "Complex centralized tech = Bad."

  ### 4. The Winter 2022 Extension: The Smoking Gun

  This is the most critical piece of evidence for your puzzle. If the risk were truly ontological (i.e., "nuclear power is inherently immoral/dangerous like slavery"), the *Isar 2, Emsland, and Neckarwestheim 2* reactors could not have been restarted. You do not pause a moral imperative for three months because of heating bills.

  The extension reveals that the "risk" was never about the physics of fission. It was about **Political Risk.**

  *   **Pre-2022:** The political risk of keeping nuclear (Green Party base, anti-nuke protests) > The political risk of shortages.
  *   **Winter 2022:** The political risk of shortages (freezing voters, industry collapse) > The political risk of nuclear.
  *   **April 2023:** The political risk of shortages receded; the political risk of nuclear returned.

  This proves the "categorical view of risk" is a **costume.** The underlying variable is **Social License.** The German exit presupposes that energy technology must remain within the bounds of current public consensus. Nuclear had exited the consensus; coal (unfortunately) remained within it because the alternative (blackouts) was worse.

  ### 5. Counterfactual: What would Expected-Harm Probabilism look like?

  If Germany had applied a strict utilitarian risk calculus (QALYs/DALYs + CO2 budget):

  1.  **Immediate Coal Phase-out:** Lignite would have been shuttered first, as it has the highest mortality and carbon intensity.
  2.  **Nuclear Life Extension:** Existing reactors would have been maintained as baseload to stabilize the grid during renewable rollout.
  3.  **Gas as True Bridge:** Gas would have been used strictly for balancing, not baseload, with a hard sunset clause.
  4.  **Waste Management:** Investment would have shifted from "exit" to "deep geological storage" (like Finland's Onkalo), treating waste as an engineering problem rather than a moral veto.

  The fact that Germany did the opposite confirms your suspicion: **The driver is not risk minimization.**

  ### Summary: The Actual Theory

  The German exit does not presuppose a theory of *physical risk*. It presupposes a theory of **Democratic Legibility.**

  *   **Nuclear:** Opaque, requires elite technocratic trust, creates unmanageable long-term liability, concentrates risk locally. **Illegible to the public.**
  *   **Renewables (plus coal bridge):** Visible (windmills), decentralized, risks are diffuse (climate), liabilities are financial rather than radiological. **Legible to the public.**

  The inconsistency you see (burning coal while shutting nuclear) exists because the policy is optimizing for **political stability and consensus maintenance**, not for **minimization of expected human harm.**

  The Winter 2022 extension proves that the "risk" is actually a **political constraint** that can be relaxed when the system approaches collapse. A true moral taboo cannot be relaxed for a season. Therefore, the German policy is not philosophically underdetermined; it is philosophically determined by a **prioritization of process (consensus/anti-technocracy) over outcome (emissions/safety).**

  France, conversely, prioritizes **outcome (sovereignty/carbon)** over **process (public consensus on tech).** Neither is using "straightforward expected-harm probabilism." France is using **Statist Consequentialism**; Germany is using **Distributive Deontology.** The tragedy is that Germany's deontology is being paid for in coal smoke.
