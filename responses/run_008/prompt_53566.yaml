answer: |-
  Dear Colleague

  It is a pleasure to hear from you, and I must say that your intuition here is exceptionally sharp. You have put your finger on one of the most stubborn and fascinating puzzles in contemporary value theory, one that sits uncomfortably at the intersection of ethics, economics, and logic. While your mathematician friend is technically correct that the underlying logical structure involves a failure of transitivity, that label is indeed too broad to capture the specific phenomenology you are describing. In the philosophical literature, this specific configuration is most commonly referred to as the Spectrum Argument, and when discussed in the context of value and goodness, it is often called Temkin's Spectrum or the Continuum Argument. The specific headache example you cited is famously associated with the philosopher James Rachels, who used it in a seminal 1998 paper to challenge the transitivity of betterness, though the most comprehensive treatment comes from Larry Temkin in his book Rethinking the Good. What you are tracking is not merely a logical error but a substantive claim about the nature of value, suggesting that the relation "better than" might not be transitive in the way we traditionally assume.

  You are also entirely right to distinguish this from the classic Sorites Paradox, and your reasoning for doing so aligns with the most rigorous treatments of the subject. The traditional Sorites Paradox relies on a premise of indistinguishability or vagueness, where one cannot discern a difference between adjacent steps, such as removing a single grain from a heap or shifting a shade of color by a barely perceptible degree. The force of the Sorites comes from the idea that if you cannot tell the difference, you cannot justify a change in classification. In contrast, the Spectrum Argument you have identified relies on clear, decisive judgments at each step. In your headache example, the agent confidently prefers the shorter, slightly more intense headache over the longer, milder one. There is no epistemic uncertainty about the difference; the trade-off is explicitly recognized and accepted. The paradox arises not because we cannot see the steps, but because chaining together a series of rational, locally optimal decisions leads to a globally absurd conclusion. Some philosophers do group these under the umbrella of Normative Sorites, but the distinction you drew is crucial because it shifts the blame from vagueness in language or perception to a structural feature of preference and value itself.

  Regarding the literature, there is indeed a serious and robust body of work that takes the intransitivity conclusion seriously rather than treating it as a trick to be explained away. Larry Temkin is the primary figure here. In Rethinking the Good, he argues extensively that "better than" is essentially non-transitive. He suggests that our intuitions about the spectrum are correct and that we should abandon the requirement of transitivity for comparative value, much as we have abandoned it for other relations like "matches the color of" or "is a neighbor of." James Rachels also argued that there are cases where A is better than B, and B is better than C, but C is better than A, or in the spectrum case, where the chain leads to a conclusion that violates our considered judgment about the endpoints. This is not a fringe view but a central debate in axiology. However, it is worth noting that many philosophers resist this conclusion because it undermines much of standard decision theory and utilitarianism, which rely heavily on transitivity to calculate optimal outcomes.

  On the other side of the debate, you asked how defenders of transitivity respond to cases like yours, and their strategies generally fall into three camps. The first strategy is to deny the individual verdicts along the chain. These theorists argue that there must be a tipping point, even if we cannot locate it precisely, where the preference flips. They claim that our intuition that each step is a bargain is an illusion caused by our inability to see the cumulative effect, and that rationality requires us to posit a lexical threshold where a small increase in intensity suddenly outweighs any decrease in duration. This view is often associated with Derek Parfit, who argued for lexical superiority in some values, meaning that some goods are so much higher than others that no quantity of the lower good can outweigh them. The second strategy is to reject the chaining process itself, arguing that pairwise comparisons cannot be aggregated in this way without losing context, though this is a harder sell logically. The third and most common response from economists is to invoke the Money Pump argument. They argue that if you truly had intransitive preferences, you could be exploited indefinitely. If you prefer A to B, B to C, but C to A, a clever trader could swap A for B for a fee, B for C for a fee, and C for A for a fee, leaving you with your original item but less money, a cycle you would willingly repeat until bankrupt. Defenders of transitivity argue that rational agents cannot allow themselves to be money-pumped, so their preferences must be transitive.

  However, those who defend the spectrum intuition, like Temkin, have responses to the Money Pump as well. They argue that the Money Pump assumes a dynamic choice context where agents must act on their preferences repeatedly in a way that allows for exploitation, whereas the Spectrum Argument is often about static rankings or one-off judgments of betterness that do not entail a willingness to trade in a cycle. They suggest that rationality might require consistency in choice but not necessarily transitivity in abstract ranking, or that the cost of avoiding the pump is accepting counterintuitive verdicts about agony and mild discomfort. Ultimately, the boundary you are looking for runs between theories that prioritize logical consistency of the relation itself and those that prioritize the accuracy of our intuitive judgments about specific cases. The Spectrum Argument remains one of the few places where general-interest intuition directly challenges a foundational axiom of rational choice theory, and it is fertile ground for the kind of writing you do. I hope this helps you locate the terminology and the debates you were chasing, and I look forward to reading how you weave this into your work.

  Warmly

  Your Colleague
