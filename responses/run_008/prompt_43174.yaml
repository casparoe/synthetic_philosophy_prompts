answer: |-
  # The Cluelessness Triage Protocol (CTP)

  **Purpose:** To resolve committee deadlocks arising from uncertainty about long-term or indirect effects (cluelessness) within a 120-minute meeting window.
  **Scope:** Applies to all grant proposals where the primary objection involves unknowable downstream effects.
  **Decision Authority:** Program Committee (simple majority required at each gate; Chair breaks ties).

  ---

  ## Part 1: The Procedure

  ### Step 1: The Near-Term Floor
  **Question:** Is there a credible, evidence-backed story that this grant produces a specific, tangible benefit within 3 years, regardless of what happens afterwards?
  *   **Evidence Required:** Direct outputs (e.g., "50,000 nets distributed," "a published paper," "a law drafted").
  *   **Pass Criterion:** Committee agrees the near-term output is valuable *even if* all long-term theories of change fail.
  *   **Fail Criterion:** The grant's value depends entirely on a chain of events >3 years out (e.g., "This research *might* influence a policy *that might* save lives in 10 years").
  *   **Outcome:**
      *   **Pass:** Move to Step 2.
      *   **Fail:** Move to Step 4 (Reversibility Check).

  ### Step 2: The Harm Scan
  **Question:** Can we name a *specific* mechanism by which this grant makes things actively worse, rather than just "failing to help"?
  *   **Evidence Required:** A causal story (e.g., "Funding this lobby group increases polarization," "This drug trial diverts patients from standard care").
  *   **Pass Criterion:** No specific harm mechanism is identified, OR the mechanism is identified but deemed highly improbable.
  *   **Fail Criterion:** A specific harm mechanism is identified and deemed *plausible* (not just possible).
  *   **[JUDGMENT CALL]:** Distinguishing "plausible" from "possible." The committee must agree that the harm has happened in a relevant reference class before. If it is purely theoretical, it counts as "possible," not "plausible."
  *   **Outcome:**
      *   **Pass:** Move to Step 3.
      *   **Fail:** Move to Step 4.

  ### Step 3: The Uncertainty Classification
  **Question:** Can we assign rough probabilities to the main outcomes (both good and bad)?
  *   **Simple Cluelessness (Pass):** Yes. We have data on similar interventions (reference classes) that allow us to say, e.g., "70% chance of moderate benefit, 10% chance of harm."
  *   **Complex Cluelessness (Fail):** No. The intervention is unique, the timeline is too long for data, or the causal links are opaque (e.g., political economy shifts, cultural norm changes).
  *   **Upgrading from Complex to Simple:** An applicant upgrades a case by providing *reference class data*. (e.g., "We can't predict this specific policy, but here are the outcomes of 10 similar policy reforms in similar countries.")
  *   **Outcome:**
      *   **Simple:** Move to **Fund Pending Diligence**.
      *   **Complex:** Move to Step 4.

  ### Step 4: The Reversibility & Option Value Check
  *(Reached if Step 1 Failed, Step 2 Failed, or Step 3 was Complex)*
  **Question:** If we are wrong about the effects, can we stop the harm or recover the value later?
  *   **Reversibility:** Can the grant be halted mid-stream? Can the effects be undone?
  *   **Option Value:** Does this grant buy information that makes future decisions easier (e.g., an RCT, a pilot)?
  *   **Pass Criterion:** High reversibility OR High option value.
  *   **Fail Criterion:** The intervention is "sticky" (hard to undo) AND the learning value is low.
  *   **[JUDGMENT CALL]:** Assessing "stickiness." Policy changes are sticky; research reports are not.
  *   **Outcome:**
      *   **Pass:** **Fund Pending Diligence** (Requires monitoring plan).
      *   **Fail:** **Decline** OR **Escalate to Values Judgment**.

  ### Termination Definitions
  1.  **Fund Pending Diligence:** The proposal passes the CTP. Staff to negotiate milestones, monitoring, or exit clauses before contract issuance.
  2.  **Decline:** The proposal fails the CTP. The risk of unknowable harm or waste outweighs the tractable benefit. Feedback to applicant cites "insufficient evidence to bound downside risk."
  3.  **Escalate to Values Judgment:** The proposal fails the CTP technically, but the committee suspects the *potential* upside is so massive that it warrants violating the protocol. This requires a unanimous vote and a written memo from the Chair justifying why the "Cluelessness" rule is being suspended.

  ---

  ## Part 2: Limitations and Biases

  **What this procedure cannot do:**
  1.  **It cannot solve Complex Cluelessness.** It manages it by filtering it out.
  2.  **It cannot maximize expected value in the long run.** It maximizes *tractable* value in the medium run.

  **Systematic Biases Introduced:**
  1.  **The Tangibility Bias:** The procedure structurally privileges interventions with visible, near-term outputs (Step 1) over those with high-variance, long-term payoffs.
  2.  **The Status Quo Bias:** By requiring specific harm mechanisms to be "plausible" based on reference classes (Step 2), it assumes the future will resemble the past. Novel interventions with no reference class will fail Step 3 and often Step 4.
  3.  **The Research Bias:** It favors evaluation (Option Value) over implementation when cluelessness is high. This may lead to "pilot paralysis" where we study problems endlessly rather than solving them.

  **[JUDGMENT CALL WARNING]:** The distinction between "plausible" and "possible" harm in Step 2 is the single biggest lever in this procedure. If the committee is risk-averse, "plausible" widens, and more grants are declined. If risk-tolerant, "plausible" narrows. This is not a finding; it is a risk tolerance setting.

  ---

  ## Part 3: Procedure Runs

  ### Proposal A: Water-Quality RCT ($400,000)
  *Context: Randomized evaluation of low-cost water intervention. Scale-up only if trial succeeds.*

  **Step 1: The Near-Term Floor**
  *   **Question:** Is there a credible benefit within 3 years regardless of long-term effects?
  *   **Discussion:** The grant funds the *evaluation*, not the scale-up. The output is a rigorous study on efficacy.
  *   **Committee View:** High value in information. Even if the intervention doesn't scale, knowing *whether* it works prevents future waste.
  *   **Verdict:** **PASS.** (Information is a tangible 3-year output).

  **Step 2: The Harm Scan**
  *   **Question:** Is there a specific mechanism for active harm?
  *   **Discussion:** Control group denial of treatment?
  *   **Evidence:** Standard of care in region is currently low; control group receives status quo, not active harm. Ethical review board approval is a condition.
  *   **Verdict:** **PASS.** (No specific harm mechanism deemed plausible beyond status quo).

  **Step 3: The Uncertainty Classification**
  *   **Question:** Can we assign probabilities?
  *   **Discussion:** RCTs are a standard reference class. We know the statistical power, the likely attrition rates, and the distribution of outcomes for water interventions.
  *   **Classification:** **Simple Cluelessness.** (We don't know the *result*, but we know the *probability distribution* of the result).
  *   **Verdict:** **PASS.** (Moves directly to Fund).

  **Step 4: Reversibility (Skipped due to Step 3 Pass)**
  *   *Note:* If Step 3 had failed, this would still Pass due to high Option Value (buys information) and Reversibility (trial can be stopped).

  **Final Output:** **Fund Pending Diligence.**
  *   **Conditions:** Confirm ethical review board approval; ensure data sharing agreement is signed.

  ---

  ### Proposal B: Pandemic Preparedness Research ($150,000)
  *Context: Unrestricted funding for small group. Theory of change: Influence national policy in 10 years to be more robust.*

  **Step 1: The Near-Term Floor**
  *   **Question:** Is there a credible benefit within 3 years regardless of long-term effects?
  *   **Discussion:** Output is research papers and workshops.
  *   **Committee View:** Papers have low intrinsic value if they do not lead to policy change. The grant's value is *entirely* dependent on the 10-year policy influence.
  *   **Verdict:** **FAIL.** (Move to Step 4).

  **Step 2: The Harm Scan**
  *   **Question:** Is there a specific mechanism for active harm?
  *   **Discussion:** "Robust" policy could mean authoritarian surveillance, supply chain monopolies, or diversion of resources from other health needs.
  *   **Evidence:** Historical precedent exists for emergency powers being abused.
  *   **[JUDGMENT CALL]:** Committee agrees this is *plausible*, not just possible, given the political climate.
  *   **Verdict:** **FAIL.** (Move to Step 4).

  **Step 3: The Uncertainty Classification**
  *   **Question:** Can we assign probabilities?
  *   **Discussion:** Political economy of a mid-sized country in 10 years is opaque. No reference class for "successful pandemic preparedness reform" exists that matches this context.
  *   **Classification:** **Complex Cluelessness.**
  *   **Applicant Evidence:** Applicant provided no reference class data (e.g., "Here are 5 similar reforms and their outcomes").
  *   **Verdict:** **FAIL.** (Move to Step 4).

  **Step 4: The Reversibility & Option Value Check**
  *   **Question:** If we are wrong, can we stop the harm or recover value?
  *   **Reversibility:** Policy changes are "sticky." Once a law is passed or an institution built, it is hard to undo if it turns out harmful.
  *   **Option Value:** Does this buy information? It produces research, but the link to policy is the bottleneck. The grant does not fund a pilot or a trial that clarifies the policy path.
  *   **Verdict:** **FAIL.** (Low reversibility, low option value regarding the *policy* risk).

  **Final Output:** **Decline.**
  *   **Reasoning:** The proposal fails the Near-Term Floor, presents Plausible Downside Risks, relies on Complex Cluelessness without reference class data, and creates sticky outcomes that are hard to reverse.

  ---

  ## Part 4: The Uncomfortable Recommendation

  **The Recommendation:** Decline Proposal B (Pandemic Preparedness).

  **Why this is uncomfortable:**
  You run a fund with a "long-termist portfolio." Pandemic preparedness is widely regarded in that community as one of the highest-leverage interventions available. Declining a grant because we "can't model the political economy" feels like cowardice. It feels like the procedure is protecting the committee from criticism rather than protecting the world from harm.

  **Why this is the procedure working as intended:**
  The CTP is designed to solve *deadlock*, not to maximize *potential*. Proposal B is the exact definition of the problem your committee faces: the upside is massive but unknowable, and the downside is also massive and unknowable (Complex Cluelessness).
  *   If you fund B, you are making a **Values Judgment** that "potential magnitude trumps bounded risk."
  *   If you decline B, you are making a **Procedural Judgment** that "unbounded risk trumps potential magnitude."

  The CTP forces you to admit that you cannot have it both ways. You cannot claim to be rigorous consequentialists *and* fund projects where the causal chain is completely opaque without admitting you are gambling. The discomfort you feel is the tension between your **identity** (long-termist funders) and your **constraint** (consequentialist rigor under uncertainty).

  If you wish to fund Proposal B, you must not use this procedure. You must instead vote to **Escalate to Values Judgment**. This requires a unanimous vote and a memo stating: *"We know this violates our risk protocol. We are funding this because we believe the upside is infinite, and we accept the risk of catastrophic downside as the cost of playing."*

  The procedure does not stop you from funding B. It stops you from pretending the risk isn't there.

  ---

  ## Part 5: Final Reflection

  You asked for a procedure, and I have delivered one. But you also asked for honesty.

  **No procedure of this kind should exist as a permanent substitute for judgment.**

  The CTP is a triage tool for a committee that is currently paralyzed. It is a splint, not a cure. If you run this for five years, you will systematically exclude the very "long-termist" bets that justify your existence, because long-termism is inherently fraught with Complex Cluelessness. You will become a global health implementation fund by drift, not by design.

  The solution is not to refine the procedure. The solution is to change how the committee talks about grants. You need to separate your portfolio into two buckets:
  1.  **The Tractable Bucket:** Runs on the CTP. (e.g., Proposal A).
  2.  **The Moonshot Bucket:** Explicitly exempt from the CTP. (e.g., Proposal B).

  For the Moonshot Bucket, you must admit that you are not calculating expected value. You are making a bet. You should not deadlock on these. You should vote based on conviction, acknowledge the cluelessness openly, and accept that some will fail and some might change the world.

  Use the CTP to clear the deadlock on the Tractable Bucket so you have the time and capital to gamble responsibly on the Moonshot Bucket. Do not let the procedure eat the mission.
