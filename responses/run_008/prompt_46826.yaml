          *   *Anti-Reductionism* $\rightarrow$ TOFU + Pre-installed Root CAs + `npm install`.
          *   *Local Reductionism* $\rightarrow$ Supply Chain Levels for Software Artifacts (SLSA) + Maintainer Reputation.
          *   *Defeaters* $\rightarrow$ CVEs, Security Advisories, Key Compromise.

      *   **Distorted Maps:**
          *   *Justification:* In philosophy, justification is internal/mental. In security, it's external/cryptographic. A signature *is* the justification, whereas in epistemology, the testimony *needs* justification.
          *   *The "Chain":* Philosophical chains of reasoning vs. Dependency trees. A broken dependency breaks the build (functional), but does it break the *knowledge*? (Security says yes, epistemology says maybe).

