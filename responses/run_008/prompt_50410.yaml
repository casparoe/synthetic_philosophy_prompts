prompt: |-
  I'm taking a philosophy of mind course, and our professor wants us to write essays arguing that some theory of consciousness is adequate only relative to a checklist we have to build ourselves first. Take the role of a professional philosopher of mind and help me draft that checklist for theories located in the access-vs-phenomenal-consciousness debate. Begin with some brief brainstorming before committing to the final list. The desiderata should cover at least the following, though you may add others: (i) explaining cases that seem to show phenomenal consciousness overflows the capacity-limited contents that global workspace theory says get broadcast (e.g., the Sperling partial-report setup); (ii) handling postdictive phenomena, where the moment-to-moment contents of experience appear to depend on what arrives slightly later (e.g., the cutaneous rabbit); (iii) respecting the access/phenomenal distinction without either collapsing it by stipulation or positing an untestable second layer of consciousness; and (iv) accounting for subjects who cannot report their experiences at all. My professor also insists on a requirement she calls "demotion discipline": when a theory reclassifies some everyday experience as not-really-conscious, it owes us an account of what that experience then is, rather than quietly deleting it. Please say which desiderata you think are non-negotiable and which are camp prejudices (e.g., favors of overflow defenders or of workspace theorists), whether any subset is jointly unsatisfiable, and finish with one paragraph on how global workspace theory does against your list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Professional Philosopher of Mind.
      *   **Task:** Draft a checklist (desiderata) for evaluating theories of consciousness, specifically within the Access vs. Phenomenal Consciousness debate.
      *   **Structure:**
          1.  Brief Brainstorming.
          2.  Final Checklist.
          3.  Analysis of Desiderata (Non-negotiable vs. Camp Prejudices, Joint Unsatisfiability).
          4.  Evaluation of Global Workspace Theory (GWT) against the list.
      *   **Specific Requirements:**
          *   Must cover: (i) Overflow cases (Sperling), (ii) Postdictive phenomena (Cutaneous Rabbit), (iii) Access/Phenomenal distinction (no collapse, no untestable layers), (iv) Non-reporting subjects.
          *   Must include "Demotion Discipline" (if you say it's not conscious, say what it is).
          *   Tone: Academic, rigorous, nuanced.

  2.  **Brainstorming (Phase 1):**
      *   *Goal:* Create a fair but rigorous set of criteria. The prompt asks for "relative adequacy," implying no theory might pass everything perfectly, but we need to know *where* they fail.
      *   *Key Tension:* Access Consciousness (A-consciousness) is about availability for report/reasoning. Phenomenal Consciousness (P-consciousness) is about "what it's like."
      *   *The "Overflow" Debate:* Block argues P > A (Sperling). GWT proponents argue A = P (or that apparent overflow is iconic memory, not consciousness).
      *   *Temporal Dynamics:* Consciousness isn't instantaneous. Postdiction (like the cutaneous rabbit or color phi) suggests a "smoothing" window. Theories need to explain the *timing* of consciousness without making it magical.
      *   *The Hard Problem vs. Empirical Constraints:* We can't solve the Hard Problem empirically, but we need empirical adequacy.
      *   *Demotion Discipline:* This is crucial. If a theory says "you aren't conscious of X," it can't just ignore X. It must explain the cognitive status of X (e.g., is it unconscious perception? blindsight?).
      *   *Non-Reporting Subjects:* Babies, animals, locked-in patients. A theory relying solely on report fails here.
      *   *Parsimony:* Don't multiply entities (no "ghostly" P-consciousness if A-consciousness explains the data). But don't reduce away the target phenomenon either.

  3.  **Drafting the Checklist (Phase 2):**
      *   Need to formalize the brainstorming into specific criteria.
      *   *Criterion 1 (Empirical Coverage - Overflow):* Address the Sperling data. Does the theory explain the rich feel vs. limited report?
      *   *Criterion 2 (Temporal Integration):* Address postdiction. How does the theory handle the "specious present"?
      *   *Criterion 3 (Conceptual Clarity):* The A/P distinction. Avoid verbal stipulation.
      *   *Criterion 4 (Non-Veridical/Non-Report Cases):* Animals/infants.
      *   *Criterion 5 (Demotion Discipline):* The professor's specific requirement.
      *   *Criterion 6 (Neural Plausibility):* (Added) Needs to map to brain mechanisms.
      *   *Criterion 7 (Parsimony):* (Added) Don't posit magic.

      *Refining the List:* Let's stick closely to the prompt's requirements but flesh them out philosophically.
      1.  *Capacity & Richness:* (Addresses Sperling/Overflow).
      2.  *Temporal Coherence:* (Addresses Postdiction).
      3.  *Distinction Integrity:* (Addresses A/P collapse).
      4.  *Report-Independence:* (Addresses non-reporting subjects).
      5.  *Ontological Responsibility:* (The "Demotion Discipline").

  4.  **Analyzing the Desiderata (Phase 3):**
      *   *Non-negotiable:* Report-Independence (otherwise we can't study animals), Demotion Discipline (otherwise we change the subject), Temporal Coherence (data is robust).
      *   *Camp Prejudices:* Capacity & Richness is the battleground. Overflow defenders see it as non-negotiable; GWT proponents see it as a confusion of memory and consciousness. Distinction Integrity is tricky; Type-A materialists might say the distinction *should* collapse.
      *   *Joint Unsatisfiability:* This is the deep philosophical insight. Can we have Richness (Overflow) + Neural Parsimony + Distinction Integrity? Block says yes. GWT says no (Richness is an illusion). If we demand *both* that P-consciousness is rich *and* that it is identical to Access mechanisms, we might have a contradiction if Access is capacity-limited.

  5.  **Evaluating Global Workspace Theory (Phase 4):**
      *   *GWT Stance:* Consciousness = Global Availability.
      *   *Overflow:* GWT denies overflow. Says Sperling shows iconic memory, not conscious experience.
      *   *Postdiction:* GWT handles this via "ignition" latency.
      *   *A/P Distinction:* GWT tends to collapse them (or reduce P to A).
      *   *Non-Reporting:* GWT struggles here unless it posits "internal report" which risks circularity.
      *   *Demotion:* GWT demotes rich sensory detail to unconscious processing. It owes an account of that processing (which it gives: modular/unconscious).
      *   *Verdict:* GWT passes Demotion and Temporal, struggles with Overflow (by denying it) and Non-Reporting (operationalization issues).

  6.  **Refining the Tone:**
      *   Ensure it sounds like a philosopher speaking to a student/colleague. Use terms like "operationalization," "veridicality," "ontological commitment," "phenomenology."
      *   Make sure the "Demotion Discipline" is highlighted as a meta-theoretical constraint.

  7.  **Final Review against Constraints:**
      *   Brainstorming included? Yes.
      *   Checklist covers (i)-(iv)? Yes.
      *   Demotion Discipline included? Yes.
      *   Non-negotiable vs. Prejudice analysis? Yes.
      *   Joint unsatisfiability discussed? Yes.
      *   GWT evaluation paragraph? Yes.

  8.  **Self-Correction during drafting:**
      *   *Correction:* Initially, I might treat the A/P distinction as purely empirical. I need to emphasize that *stipulative* collapse is bad (as per prompt).
      *   *Correction:* Make sure "Demotion Discipline" isn't just "explain unconscious processing," but specifically explain the *status of the experience* that was demoted.
      *   *Nuance:* When discussing GWT, acknowledge the "Reflexive GWT" (Dehaene) vs. "Classic GWT" (Baars) if necessary, but keep it general enough for an essay draft. Let's stick to the core commitment: Consciousness = Global Availability.

  9.  **Final Polish:** Check word count and flow. Ensure the distinction between "camp prejudices" and "non-negotiables" is sharp. (e.g., Is Overflow a fact or an interpretation? That's the crux).

  *(Self-Correction on "Joint Unsatisfiability"):* I need to be careful here. Is it logically impossible to satisfy all? Not logically, but empirically/theoretically tense. If P-consciousness is rich (Overflow) but Access is narrow, and we demand P be naturalized without a "second layer," where does the richness live? If it's not accessed, is it physical? This touches on the "explanatory gap." I should frame this as a tension rather than a logical contradiction.

  *(Final check on Demotion Discipline):* The prompt says: "when a theory reclassifies some everyday experience as not-really-conscious, it owes us an account of what that experience then is." This means if GWT says "the rich icon isn't conscious," it must say "it is unconscious iconic memory." I need to make sure the checklist demands this explicitly.

  Okay, ready to write.cw
answer: |-
  ### Brainstorming: The Architecture of Adequacy

  Before formalizing the checklist, we need to recognize the trap inherent in this assignment. In the philosophy of mind, "adequacy" is often a proxy for "agrees with my intuitions." If we build a checklist that demands *phenomenal overflow* as a criterion, we have already ruled out Global Workspace Theory (GWT) by fiat. If we demand *parsimony* defined as "no unconscious rich representation," we rule out Block's view.

  Therefore, our checklist must not be a weapon to kill opposing theories, but a diagnostic tool to locate *where* a theory pays its costs. We need criteria that separate empirical adequacy from conceptual stipulation. The core tension lies between the **phenomenological data** (how things seem to the subject) and the **functional data** (what the subject can do with that information).

  We must also treat the professor's "Demotion Discipline" seriously. It is a constraint against eliminativism disguised as reductionism. If a theory tells me my vivid peripheral vision is "unconscious," it cannot simply say "it's unconscious." It must explain why it *feels* conscious if it isn't, or reclassify the feeling itself without gaslighting the subject.

  Finally, we need to distinguish between *operational* criteria (how we measure) and *ontological* criteria (what exists). A theory that relies entirely on report fails with infants; a theory that relies entirely on neural correlates risks circularity. The checklist must bridge these gaps.

  ***

  ### The Checklist: Desiderata for Theories of Access and Phenomenal Consciousness

  **1. The Capacity & Richness Constraint (Overflow Adequacy)**
  *   **Requirement:** The theory must account for the dissociation between subjective richness and reportable capacity.
  *   **Specific Test:** In partial-report paradigms (e.g., Sperling), subjects report a vivid experience of more letters than they can recall. The theory must either: (a) explain how phenomenal consciousness exceeds access capacity (overflow), or (b) explain why the subjective vividness is a cognitive illusion without denying the underlying representation exists.
  *   **Failure Mode:** Ignoring the phenomenology or conflating iconic memory with conscious experience without argument.

  **2. The Temporal Coherence Constraint (Postdictive Adequacy)**
  *   **Requirement:** The theory must explain the temporal window of integration without positing a "homunculus" waiting for data.
  *   **Specific Test:** In postdictive phenomena (e.g., the cutaneous rabbit or color phi), later stimuli alter the apparent timing/location of earlier stimuli. The theory must specify the mechanism of this "editing" and whether the editing occurs before or after the conscious moment.
  *   **Failure Mode:** Claiming consciousness is instantaneous (contradicting data) or claiming consciousness is delayed by the full processing time (contradicting subjective immediacy).

  **3. The Distinction Integrity Constraint (Non-Collapse)**
  *   **Requirement:** The theory must distinguish Access Consciousness (A) and Phenomenal Consciousness (P) on grounds other than verbal stipulation.
  *   **Specific Test:** If the theory claims A = P, it must demonstrate that no empirical case exists where A is present without P, or P without A. If it claims A ≠ P, it must provide a functional or neural marker for P that does not rely on introspection alone.
  *   **Failure Mode:** Defining P as "A + magic" (untestable second layer) or defining P as "A" by fiat (collapsing the distinction to solve the problem).

  **4. The Report-Independence Constraint (Subject Neutrality)**
  *   **Requirement:** The criteria for consciousness cannot rely exclusively on verbal or motor report.
  *   **Specific Test:** The theory must provide conditions under which non-reporting subjects (infants, non-human animals, locked-in patients) can be adjudicated as conscious.
  *   **Failure Mode:** Making report a necessary condition for consciousness (excluding infants) or relying on "proxy reports" that are theoretically circular.

  **5. The Demotion Discipline (Ontological Responsibility)**
  *   **Requirement:** If a theory reclassifies a putative conscious state as unconscious, it must provide a positive account of the ontological status of that state.
  *   **Specific Test:** If a theory claims the rich sensory field in Sperling's task is *unconscious*, it must specify the cognitive architecture of that unconscious state (e.g., is it a high-fidelity buffer? A modular encapsulation?) and explain why it mimics phenomenology so closely.
  *   **Failure Mode:** "Quiet deletion"—simply asserting the experience doesn't exist or labeling it "unconscious" without explaining its functional role or why it feels like consciousness.

  ***

  ### Analysis of the Desiderata

  **Non-Negotiable vs. Camp Prejudices**
  I argue that **Demotion Discipline** and **Report-Independence** are non-negotiable. Without Report-Independence, we cannot study consciousness scientifically in a comparative context; we are merely studying "report." Without Demotion Discipline, theories are free to engage in conceptual gaslighting, denying the data of experience to save a model.

  Conversely, the **Capacity & Richness Constraint** is currently a camp prejudice battleground. Overflow defenders (like Ned Block) treat the vividness of the Sperling icon as a non-negotiable datum of P-consciousness. GWT proponents (like Stanislas Dehaene) treat it as a prejudice of introspection, arguing that vividness does not entail conscious *access*. However, I have framed the constraint neutrally: the theory must *account* for it, either by accepting overflow or explaining the illusion. This makes it a testable desideratum rather than a bias.

  The **Distinction Integrity Constraint** is tricky. Type-A materialists would argue that maintaining the A/P distinction *is* the prejudice. However, given the prompt's focus on the debate, preserving the distinction without collapsing it by stipulation is a methodological necessity for this specific essay.

  **Joint Unsatisfiability**
  There is a significant tension, perhaps bordering on joint unsatisfiability, between **Capacity & Richness** (interpreted as supporting overflow) and **Distinction Integrity** (interpreted naturalistically). If P-consciousness is rich and A-consciousness is narrow, and we demand a naturalistic account (no "second layer"), we must locate the rich P-content in the brain. If it is not globally broadcast (Access), where is it? If it is in early sensory cortex, why isn't it Accessible? If it is inaccessible, how do we know it is conscious without relying on the very report we claim it exceeds? A theory that satisfies Overflow often risks violating Distinction Integrity by positing a P-consciousness that is causally inert and empirically occult. Conversely, a theory that satisfies Distinction Integrity (by identifying P with A) often violates the phenomenological intuition behind Capacity & Richness.

  ***

  ### Evaluation: Global Workspace Theory (GWT)

  Global Workspace Theory performs unevenly against this checklist. It satisfies **Temporal Coherence** well, modeling the "ignition" latency required to explain postdictive effects as the time needed for broadcasting. It also adheres strictly to **Demotion Discipline**; when GWT denies consciousness to rich sensory icons, it explicitly reclassifies them as high-fidelity unconscious buffers in modular sensory systems, explaining their availability for partial report without granting them global status. However, GWT struggles with **Report-Independence**, as its operational definition of "global availability" often collapses into "availability for report," making it difficult to ascribe consciousness to non-verbal organisms without positing an internalized report mechanism that risks circularity. Most critically, regarding **Capacity & Richness** and **Distinction Integrity**, GWT effectively collapses the distinction by identifying Phenomenal Consciousness with Access. While this is theoretically parsimonious, it forces GWT to treat the subjective sense of overflow as a systematic illusion. Whether this counts as a failure depends on whether one views the phenomenology of overflow as a datum to be saved or a hypothesis to be tested; under the strictures of this checklist, GWT passes by providing an error theory, but at the cost of alienating the very phenomenological intuition that motivates the search for a theory of consciousness in the first place.
