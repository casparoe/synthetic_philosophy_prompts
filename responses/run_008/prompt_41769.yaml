answer: |-
  There is a name for the structure you are describing, though it lives in a few different neighborhoods depending on whether you ask a behavioral economist, an ethicist, or a psychologist.

  The most precise technical term is **Choice Architecture**.

  While you associated it with governments and organ donor checkboxes, behavioral economists (who coined the term) define it broadly: *the design of the environment in which people make decisions.* It applies just as much to a supermarket shelf, a website interface, a car dealership, or a conversation over coffee as it does to public policy.

  However, "Choice Architecture" is a neutral, mechanical term. It describes the *how*, but not the *ethics*. When you want to describe the *ethical* category of this move—specifically the version that feels "slimy" despite being truthful—the term philosophers use is **Non-Deceptive Manipulation**.

  Here is the breakdown of the concept, the boundary you are looking for, and why your intuition distinguishes the car salesman from the friend.

  ### 1. The Mechanism: How it Works
  You correctly identified that this is not persuasion (which offers reasons) or coercion (which offers threats). It operates on a third channel: **Heuristics and Framing.**

  *   **The Car Salesman:** He didn't argue the car was good. He curated your *attention* (holding the keys), your *identity* ("your car," "what your buddies will say"), and your *scarcity bias* ("two other people looked at it"). He bypassed your analytical brain (System 2) and spoke directly to your emotional/instinctive brain (System 1).
  *   **The Friend:** She curated the *environment* (safety at her house) and the *data availability* (casually mentioning the bad behavior). She didn't tell her sister what to think; she removed the noise so her sister *could* think.

  In both cases, the "architect" arranged the room so that a specific decision became the path of least resistance.

  ### 2. The Boundary: Where is the Line?
  You asked for the edges. If both examples use the same mechanism (Choice Architecture), why does one feel like help and the other like a con? Ethicists and psychologists generally draw the line using three specific tests.

  #### A. Alignment of Interests (The Fiduciary Test)
  *   **The Friend:** Her interests were **aligned** with her sister's. If the sister stayed in the bad relationship, the friend gained nothing (and potentially lost time/resources). Her "architecture" was designed to help the sister achieve *the sister's own goals* (safety, happiness).
  *   **The Salesman:** His interests were **conflicted**. He gained a commission; you gained a car. While the car might be fine, his incentive was for you to buy *now*, regardless of whether it was the best car for you or if you could afford it comfortably.
  *   **The Boundary:** If the architect benefits disproportionately from the specific outcome, it shifts from *facilitation* to *exploitation*.

  #### B. The Publicity Condition (The Transparency Test)
  This is a concept from political philosophy (often associated with John Rawls or Onora O'Neill). Ask: *Would the target consent to the method if they knew it was being used?*
  *   **The Friend:** If you told the sister later, "I kept you here on purpose so you could see how he treats you," she would likely say, "Thank you." The method withstands scrutiny.
  *   **The Salesman:** If you knew he was using "ownership visualization" and "false scarcity" tactics to trigger your impulse buying, you would feel tricked. You would not consent to being psychologically profiled in that moment.
  *   **The Boundary:** If the influence relies on secrecy to work, it is manipulation. If it works even when acknowledged, it is guidance.

  #### C. Cognitive Route (System 1 vs. System 2)
  *   **The Friend:** She was trying to **restore** your cognitive agency. Abuse clouds judgment; she cleared the fog so your rational brain could function. She was *scaffolding* your decision-making.
  *   **The Salesman:** He was trying to **bypass** your cognitive agency. He didn't want you comparing specs or checking your budget; he wanted you to *feel* like a car owner. He was *hacking* your decision-making.
  *   **The Boundary:** Does the arrangement help the person think *more clearly* (Facilitation), or does it help them think *less* (Manipulation)?

  ### 3. Specific Vocabulary for the Two Sides
  Since "Choice Architecture" is neutral, you might find these specific terms useful for distinguishing the two flavors:

  **The "Good" Version:**
  *   **Maieutics:** An ancient Socratic term meaning "midwifery." It describes drawing out an idea or decision that already exists within the person, helping them "give birth" to their own truth.
  *   **Motivational Interviewing:** The clinical term for what your friend did. It is a counseling method that avoids direct advice and instead guides the patient to voice their own reasons for change.
  *   **Scaffolding:** Providing temporary support to help someone reach a conclusion they are capable of reaching but currently blocked from.

  **The "Bad" Version:**
  *   **Dark Patterns:** Originally a UX design term, now used broadly for interfaces (or situations) designed to trick users into doing things they didn't mean to do.
  *   **Engineered Consent:** A term from propaganda studies (Edward Bernays), describing how public opinion is shaped by curating information to make a specific choice feel inevitable.
  *   **Nudge (Exploitative):** While "nudge" can be good, behavioral economists distinguish between *beneficial nudges* (saving for retirement) and *sludges* or *manipulative nudges* (making it hard to cancel a subscription).

  ### 4. Where Does It Stop? (Social Competence vs. Manipulation)
  You worried that the definition might be so broad it makes all social competence count as manipulation. After all, we all choose our tone and timing.

  The line is **Friction vs. Leverage.**
  *   **Social Competence** removes friction. You speak politely so the other person doesn't get defensive and can hear your point. You are clearing the path for *their* judgment.
  *   **Manipulation** adds hidden leverage. You speak politely to disarm them, but you are also timing your request to when they are tired, or framing it to trigger their guilt. You are tilting the floor so they slide where you want.

  **The Litmus Test:**
  If you removed the "architect," would the person still be able to make a rational decision based on the facts?
  *   **Sister:** Yes. The facts were the abuse. The friend just made them visible.
  *   **Car:** Maybe not. The facts were the car's specs and price. The salesman replaced the facts with *feelings* of ownership and status.

  ### Summary
  The thing you are pointing at is **Interpersonal Choice Architecture**.

  *   When used to align with the target's best interests and enhance their rational agency, it is **Maieutics** or **Facilitation**.
  *   When used to serve the architect's interests and bypass the target's rational agency, it is **Non-Deceptive Manipulation**.

  The "sliminess" you feel isn't about the truthfulness of the statements; it's about the **misalignment of intent** and the **bypassing of your autonomy**. You walked out happy, but you weren't fully driving the car of your decision; you were in the passenger seat of a car the salesman was driving, even though he let you hold the wheel.
