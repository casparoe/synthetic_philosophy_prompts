answer: |-
  This is a delightful problem. It sits precisely at the intersection of social epistemology, game theory, and decision theory. You have essentially constructed a real-world instance of an **Information Cascade**, and your intuition that the crowd's wisdom might be illusory is mathematically well-founded.

  As a fellow traveler in these waters, I suggest we dissect this using the framework of Bayesian updating and the specific mechanics of cascades. Here is how I would structure the problem.

  ### 1. The Mechanism: Information Cascades
  You have correctly identified the phenomenon described in the seminal 1992 paper by Bikhchandani, Hirshleifer, and Welch. An information cascade occurs when it becomes optimal for an individual to ignore their private information (e.g., "I looked up the stats" or "I visited both") and follow the public actions of predecessors.

  The danger, as you suspect, is fragility. If the first few "seed" decisions were made based on noise (the receptionist sister, random proximity), subsequent rational agents will ignore their own contradictory signals to follow the herd. The public pool of information becomes polluted with correlated noise, yet it carries the weight of independent data.

  **The Physicist's Analogy:** Think of it as measurement error. If you take 1,000 measurements, but the instrument was mis-calibrated at $t=0$ and every subsequent measurement was just a copy of the previous one rather than a new observation, your $N$ is effectively 1, not 1,000. The standard error does not decrease with $\sqrt{N}$ because the observations are not independent.

  ### 2. Evaluating the Signals
  You have two competing signals:
  1.  **The Hard Data (Private Signal):** Outcome data/complaints favor High Street.
  2.  **The Social Proof (Public Signal):** Population density and verbal endorsement favor Riverside.

  To weigh these, we must assess the **reliability** and **independence** of the Social Proof.

  **A. The Independence Test**
  Condorcet's Jury Theorem states that a majority is likely to be correct *if and only if* voters are independent and more likely than not to be correct individually. You have already performed a audit of independence:
  *   *Finding:* "Sister is receptionist," "Copied neighbor."
  *   *Implication:* These are exogenous variables unrelated to quality. If a significant portion of the "seed" population chose Riverside for exogenous reasons, the cascade is built on a false prior.

  **B. The Content of the "Raves"**
  You mention people "rave" about Riverside. In decision theory, we must ask: What utility function are they maximizing?
  *   Clinical outcomes? (Your hard data addresses this).
  *   Bedside manner/Wait times/Receptionist friendliness? (Your hard data might miss this).
  *   Social coordination? (Going where friends go makes logistics easier).

  If the "raves" are about the receptionist (who we know is a sister to a local) or the ease of booking because the system is less strained (wait, the other one is empty, so that doesn't hold), then the signal is noisy. However, if the "raves" are about diagnostic accuracy, that contradicts your hard data. Usually, patients cannot evaluate diagnostic accuracy; they evaluate *process* (waiting room, empathy). Your hard data evaluates *outcomes*. These are different variables.

  ### 3. A Principled Heuristic for "Crowd Wisdom"
  To answer your general question: *When is it rational to treat choices as evidence?*

  You can apply a **Discount Factor for Correlation**. When observing $N$ people choosing $X$, you should not treat this as $N$ bits of information. You should treat it as $N_{eff}$ (effective sample size).

  $$N_{eff} = \frac{N}{1 + (N-1)\rho}$$

  Where $\rho$ is the average correlation between the decisions.
  *   If everyone decided independently, $\rho = 0$, and $N_{eff} = N$.
  *   If everyone copied the first person, $\rho \approx 1$, and $N_{eff} \approx 1$.

  **How to estimate $\rho$ in the wild:**
  1.  **Trace the Roots:** You already did this. Finding the "sister" connection is gold. It suggests high $\rho$ at the source.
  2.  **Look for Costly Signaling:** Did people incur a cost to choose Riverside? If Riverside is further away for most people, their choice carries more information than if it was simply the closest option.
  3.  **Check for Dissent:** In a true cascade, private doubts are suppressed. Are there *any* quiet detractors? A complete absence of negative feedback is often more suspicious than a mix of opinions.

  ### 4. Decision Theoretic Approach
  Since you cannot switch easily (high transaction costs), this is a **one-shot decision under uncertainty**.

  Let $Q_H$ be the quality of High Street and $Q_R$ be the quality of Riverside.
  Your hard data suggests $E[Q_H] > E[Q_R]$.
  The crowd suggests $E[Q_R] > E[Q_H]$.

  However, you have meta-evidence that the crowd's signal is corrupted by a cascade initiated by non-quality factors. Therefore, you should downgrade the weight of the crowd's signal.

  **The "Preponderance of Evidence" View:**
  If the hard data is "slightly ahead," that is a weak signal. If the crowd is "overwhelmingly ahead," that is a strong signal *unless* discounted.
  If you estimate that 50% of the town's choice is due to the cascade effect (copying/sister), does the remaining 50% still outweigh your hard data?

  **The "Regret Minimization" View:**
  *   **Scenario A:** You choose High Street. It is statistically better, but you feel isolated. If you get sick, you have no social support network to recommend specialists or share experiences.
  *   **Scenario B:** You choose Riverside. It is statistically slightly worse, but you are aligned with the town. If a problem arises, you have the collective experience of the town to navigate it.

  In healthcare, **coordination value** is a real utility. Being at the practice where everyone else is allows for easier second opinions within the community, shared knowledge about which specialists the GP refers to, etc.

  ### 5. My Recommendation
  As a philosopher of science, you know that data is theory-laden. The "outcome data" you found is aggregated and impersonal. The "crowd choice" is personal but correlated.

  Here is the principled resolution:

  1.  **Trust the Hard Data on Clinical Metrics:** Your analysis of outcome data is likely more robust regarding *clinical competence* than the crowd's opinion. Patients are bad at judging medical competence; they are good at judging hospitality.
  2.  **Trust the Crowd on Service Metrics:** The "raving" is likely about the *experience* of care, not the *outcome* of care.
  3.  **The Cascade Breaker:** The fact that you uncovered the "sister" origin story is a **defeater** for the social evidence. It breaks the chain of inference that "everyone chose this because it's good." It reveals the choice was path-dependent.

  **The Verdict:**
  If your primary utility is **clinical safety/outcome**, go with the **High Street**. The social signal is corrupted by an information cascade, and your private signal (the data) is more reliable for that specific variable.

  If your primary utility is **experience/coordination**, go with **Riverside**. The "slightly better" stats of the High Street practice may be outweighed by the utility of being in the coordinated network of the town, provided the stats aren't *significantly* worse (i.e., within the margin of error).

  **Epistemological Takeaway:**
  To answer your broader question: You treat others' choices as evidence only to the degree that you can model their **incentive structures** and **information sets**.
  *   If they chose because they had private information you lack (e.g., they've been patients for 20 years), weight it heavily.
  *   If they chose because they were copying (low information cost), weight it near zero.
  *   If they chose because of a constraint you don't share (e.g., insurance, location), discard it.

  You have done the hard work of distinguishing signal from noise. In science, when the instrument (the crowd) is found to be calibrated based on a faulty zero-point (the receptionist sister), you do not trust the reading, no matter how consistent the results are. You trust the calibrated instrument (your data analysis).

  Go with the High Street, but perhaps keep your neighborly relations warm enough to ask for advice should you need a referral!
