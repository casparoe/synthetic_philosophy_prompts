      *   *Fidelity:* Even if patterns count, how much? "Partial instance" is vague. If I have 10% of your pattern, is 10% of you alive? This gets into Sorites paradox territory. Let's say 0.5.
      *   *Activity:* Does it need to be running? If I remember you, the neural pattern fires. So it runs intermittently. This seems plausible if the others hold. Let's say 0.7.

