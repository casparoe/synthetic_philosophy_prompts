answer: |-
  This is a very strong start for a prospectus, precisely because you've identified the friction points before your committee does. You are right to feel that some of these sit uneasily together. In fact, one pair isn't just uneasy; it's a flat contradiction.

  Here is the audit, ranked by severity from "Fatal Inconsistency" to "Theoretical Heavy Lifting."

  ### 1. The Fatal Inconsistency: (3) Organicism vs. (5) Artifacts/Social Objects
  **Severity:** **Critical / Logical Contradiction**

  You cannot hold (3) and (5) simultaneously without redefining one of them out of recognition.

  *   **The Conflict:** Peter van Inwagen's *Material Beings* is explicitly eliminativist about artifacts. For van Inwagen, there are no tables, no laptops, and no universities. There are only simples and living organisms. When you sit at your laptop, there are "simples arranged laptop-wise," but there is no *object* that is the laptop.
  *   **Your Text:** In (3), you say "the **only** genuine composites are living things." In (5), you say "I'm not willing to give up artifacts... my laptop exists."
  *   **The Problem:** If (3) is true, (5) is false (ontologically). If (5) is true, (3) is false (as a universal criterion). You claim in (3) that other restrictions (contact, fastening) are arbitrary, but life is a "joint in nature." If you admit artifacts, you must admit a principle of composition that covers artifacts but excludes the "shmeiffel" (your shoe + Eiffel Tower). Van Inwagen argues no such principle exists *except* life. If you think artifacts exist, you have rejected van Inwagen's core argument, even if you like his conclusion about organisms.

  **The Cheapest Way Out:**
  *   **Option A (Drop 3):** Keep (5) and modify (3). Adopt a **Moderate Restrictivism** that isn't strictly organicist. You could argue for a functionalist or causal criterion (e.g., objects exist where there is causal integration or functional unity). This saves your laptop and the Eurozone but requires you to do the hard work of explaining why *that* criterion isn't arbitrary (the very worry you raised in (3)).
  *   **Option B (Drop 5's Ontology):** Keep (3) and reinterpret (5). You can say "Laptops exist" is true in a loose, common-sense sense, but ontologically, there are only simples arranged laptop-wise. This is van Inwagen's "paraphrase strategy." However, you said you spent "too long reading social ontology to deny that now." If you mean social objects have *real* ontological status (not just paraphrase), Option B is off the table.
  *   **Recommendation:** Given your commitment to social ontology, **drop strict Organicism (3).** Move to a view like **Korman's "Ordinary Objects"** or **Rea's "Material Constitution."** Acknowledge that life is a *paradigm* of composition, but not the *only* case.

  ### 2. The Theoretical Burden: (6) Not Identity vs. Ontological Innocence
  **Severity:** **High / Theoretical Cost**

  This isn't a logical contradiction, but it is the hardest sell in contemporary metaphysics.

  *   **The Conflict:** Ted Sider and others have argued that if Composition is **not** Identity (CAI), then the whole is a *new* entity in addition to the parts. If it is a new entity, it adds to your ontological commitment. Therefore, you cannot have "Ontological Innocence" (the whole is nothing over and above the parts) without CAI.
  *   **Your Text:** You reject CAI ("standard objections... convince me") but want "cheap ontology."
  *   **The Problem:** You are trying to get the benefits of CAI (no ontological guilt) without the costs (logical weirdness, many-one identity problems). The "standard objections" to CAI are strong, but the alternative usually requires a robust theory of **Grounding**. You need to explain how the whole can be distinct from the parts yet fully grounded in them such that it doesn't "add" to the ideology.

  **The Cheapest Way Out:**
  *   **Adopt Grounding:** Explicitly frame your "innocence" claim in terms of **metaphysical grounding** (à la Kit Fine or Jonathan Schaffer). Say: "The whole is distinct from the parts, but it is *grounded* in them, and grounded entities do not increase fundamental ontological commitment." This is the standard move for non-CAI innocents. It doesn't solve the problem magically, but it gives you the vocabulary to defend it.
  *   **Recommendation:** Don't drop this, but **fortify it.** In your prospectus, explicitly mention that you will defend innocence via a grounding framework rather than identity. This shows you know the literature (Sider, Cameron, etc.).

  ### 3. The Officemate's Worry: (2) Anti-Universalism + (4) Determinacy
  **Severity:** **Medium / Argumentative Vulnerability**

  Your officemate is channeling the **Lewis-Sider Argument from Vagueness**, but they have slightly misdiagnosed the tension.

  *   **The Conflict:** The Lewis-Sider argument runs:
      1.  If composition is restricted (2), there must be a cutoff point.
      2.  Any cutoff point for composition would be vague (Sorites).
      3.  But existence cannot be vague (4).
      4.  Therefore, composition cannot be restricted (Universalism).
  *   **Your Position:** You are holding (2) and (4).
  *   **The Problem:** To hold (2) and (4), you must reject premise (2) of the Lewis-Sider argument. You must argue that **there are sharp boundaries to composition**, even if we can't know where they are (Epistemicism). You have to be willing to say, "There is a precise number of atoms such that adding one more makes a cat, but one fewer does not," even if that sounds crazy.
  *   **Why it's not a contradiction:** (2) and (4) are logically compatible. They just commit you to **Epistemicism about Composition**. The tension is between your view and *intuition*, not between (2) and (4) themselves.

  **The Cheapest Way Out:**
  *   **Bite the Bullet:** Accept sharp boundaries. Argue that vagueness is semantic/epistemic, not ontological. This is the standard restrictivist response to Lewis.
  *   **Recommendation:** Keep (2) and (4). In the prospectus, explicitly state that you are aware of the Lewis-Sider argument and will be defending an **epistemicist account of compositional boundaries**. This turns a vulnerability into a specific research question.

  ### 4. The "Life" Criterion: (3) vs. Biology
  **Severity:** **Low / Empirical Risk**

  *   **The Conflict:** You call life a "joint in nature." Biologists and philosophers of biology often argue that "life" is not a sharp metaphysical category (viruses? mules? gradual evolution?).
  *   **The Problem:** If "life" is vague, and existence can't be vague (4), then Organicism might fail on its own terms.
  *   **Recommendation:** Since I already suggested softening (3) to accommodate artifacts (Conflict #1), this becomes less critical. If you move to a functionalist view, you can handle borderline cases better than strict biology.

  ### Summary of Recommendations for the Prospectus

  1.  **Fix the Contradiction First:** You must choose between Van Inwagen's Organicism and the existence of Artifacts. Since you are committed to social ontology, **you cannot be a Van Inwagen Organicist.** You are likely a **Restrictivist** who believes composition occurs in cases of *functional unity* or *causal integration*, of which life is the best example but not the only one.
      *   *Revision:* Change (3) to: "Composition is restricted. While living things are the paradigmatic cases of composition, artifacts and social objects also satisfy the conditions for genuine composition (e.g., functional unity)."
  2.  **Clarify Innocence:** In (6), specify that "nothing over and above" will be cashed out via **Grounding**, not Identity. This preempts the Sider objection.
  3.  **Own the Sharp Boundaries:** In (2) and (4), acknowledge the Lewis-Sider argument and state your intention to defend sharp boundaries (Epistemicism). This shows your officemate you've done the reading.

  **The Verdict:**
  Your view is coherent *if* you drop the claim that *only* living things compose. As it stands, (3) and (5) cancel each other out. If you adjust (3) to be a "Restrictivism with a Functional/Unified Criterion" rather than strict "Organicism," the rest of the framework (Anti-Nihilism, Anti-Universalism, Determinacy, Grounding-based Innocence) forms a very standard, defensible, and respectable metaphysical package (roughly aligned with philosophers like David Korman or Kathrin Koslicki).

  Good luck with the advisor. This is a solid foundation once the Organicism/Artifact knot is untied.
