      The debate you describe is indeed one of the most enduring stalemates in economic history, but diagnosing it requires separating the philosophical framing from the empirical mechanics that have evolved over the last century. Your hypothesis that this is largely a disagreement about what counts as an explanation captures a significant portion of the friction, particularly when contrasting the Weberian desire to understand the internal meaning of social action with the materialist demand for structural constraints, yet it misses the硬核 factual core that has emerged in recent decades. At its heart, the disagreement is substantive rather than merely verbal, because it hinges on a testable claim about the persistence and exogeneity of cultural traits relative to material incentives. When culturalists argue that Protestantism caused capitalism, they are making a factual claim that religious beliefs persisted long enough and strongly enough to override immediate material incentives to consume rather than invest. When materialists argue that coal and wages caused industrialization, they are claiming that cultural shifts were merely adaptive responses to those price signals. The stalemate arises not because the question is ill-posed, but because both culture and material conditions are endogenous to each other, creating an identification problem that traditional historical narrative cannot resolve.

      Consequently, the two camps are often answering different questions under the same heading, which fuels the perception of a verbal dispute. The culturalists are typically explaining the proximate mechanisms of individual behavior, asking why agents in similar material conditions made different choices, while the materialists are explaining the ultimate constraints on those choices, asking why those specific conditions emerged in the first place. For example, a culturalist might point to high trust levels in a society to explain low transaction costs, while a materialist would ask what historical institutional or geographic factors allowed that trust to develop. Because both stories are plausible and co-vary historically, the debate often devolves into a contest over which layer of causality is more fundamental. However, this is not merely a semantic disagreement about the definition of explanation, because there is a genuine factual question hiding underneath regarding the transmission mechanism of culture. If cultural values are transmitted independently of material conditions, such as through vertical transmission from parents to children or horizontal transmission through religious institutions, then culture can act as an independent causal force. If, however, cultural values dissolve immediately when material incentives change, then culture is merely epiphenomenal. This distinction transforms the debate from a philosophical standoff into an empirical investigation about the half-life of norms and beliefs.

      Progress is possible, but it requires abandoning the broad theoretical clash in favor of specific identification strategies that isolate cultural variation from material variation. The most promising avenue for resolving the factual core of this dispute lies in natural experiments, particularly those involving migration or historical discontinuities. For instance, studying the economic outcomes of descendants of immigrants allows historians to hold material institutions constant while varying cultural heritage, effectively testing whether culture persists in a new material environment. Similarly, examining regions divided by historical borders or religious missions, where geography and factor prices are similar but cultural exposures differed, provides a way to estimate the causal effect of culture net of material conditions. Recent work in this vein, such as studies on the long-term effects of the printing press or colonial missionary activity, suggests that culture does have independent causal power, but only under specific conditions where institutions allow those cultural traits to be economically relevant. This indicates that the binary opposition between culture and material conditions is itself the obstacle to progress, as it forces a false choice between two mutually reinforcing factors.

      Therefore, the question should be reformed rather than discarded, shifting from whether culture causes economic outcomes to under what conditions cultural constraints bind more tightly than material ones. The stalemate persists because both sides seek a monocausal explanation for complex historical processes, whereas the reality is likely a co-evolutionary dynamic where material conditions select for certain cultural traits, which then feedback to shape future material development. A sharper definition of cultural traits is essential here, moving away from vague notions like the spirit of capitalism toward measurable preferences regarding time, risk, and trust. By operationalizing culture in this way, economists can test for persistence and transmission without relying on hermeneutic interpretation. Ultimately, the debate is not ill-posed, but the traditional framing is obsolete. The factual question about independent transmission is resolvable through rigorous econometric history, but the broader theoretical question requires accepting that culture and material conditions are intertwined layers of the same historical process. Progress lies not in declaring a winner between Weber and the materialists, but in specifying the mechanisms through which cultural beliefs survive material shocks and influence economic behavior, thereby turning a philosophical stalemate into a research program focused on interaction effects and historical context.
