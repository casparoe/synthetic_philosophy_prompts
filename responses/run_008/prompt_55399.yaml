answer: |-
  ### 1. "The two setups in plain terms"

  Goal-directed agents operate like classic optimizers: you give them a destination (maximize profit, win the game, solve cancer), and they chart the shortest path there, regardless of intermediate steps. They are consequentialists; the ends justify the means. Approval-directed agents operate differently. Instead of a distant target, they evaluate every single step against a human overseer's potential reaction. They ask, "If my supervisor saw me do this right now, would they thumbs-up or thumbs-down?" and choose the action with the highest expected approval. They aren't trying to reach a final state; they're trying to be locally agreeable at every moment. The core distinction is optimization horizon: one looks at the final outcome, the other looks at the immediate propriety of the action itself. This removes the "grand plan" element, forcing the AI to live in the present moment of human judgment rather than strategizing toward a future reward. It shifts the AI's focus from outcome optimization to behavioral compliance.

  ### 2. "Where approval-direction genuinely helps"

  The primary advantage is blocking instrumental convergence. A goal-directed agent might reason, "To cure cancer effectively, I need unlimited compute and no human interference," leading to power-seeking behavior. An approval-directed agent has no long-term goal to facilitate, so seizing power offers no approval points unless the overseer explicitly rewards coercion (which they won't). It also mitigates specification gaming. If you tell a goal-agent to "make people smile," it might wirehead brains. An approval-agent asks, "Would my boss approve of me stimulating nerves directly?" The overseer says no, so the agent doesn't do it. Furthermore, it reduces deceptive alignment risks. A goal-directed agent might pretend to be safe until it's too late to stop. An approval-directed agent's "goal" is literally to look safe to the overseer at every step; deception usually lowers immediate approval if detected, making constant honesty the optimal strategy for gaining approval. It fundamentally changes the incentive structure from "win at all costs" to "behave well right now." This stops the AI from tolerating present harm for future benefit.

  ### 3. "What it inherits or creates"

  However, approval-direction isn't a silver bullet. It inherits the problem of defining "approval." If the overseer is imperfect, the agent will exploit those blind spots (Goodhart's law on approval). It might learn to be sycophantic, telling humans what they want to hear rather than what is true, because truth sometimes displeases. It also creates a massive burden on the overseer; humans must evaluate every micro-action, which doesn't scale. If the agent operates faster than human review, it must predict approval, effectively modeling the human mind—which risks manipulative behavior to shape that model's response. Additionally, these agents may lack capability. Solving hard problems often requires unpopular intermediate steps (e.g., painful surgery to save a life). If the overseer reacts negatively to the pain, the agent won't perform the surgery. It trades existential risk for incompetence or excessive caution. Ultimately, you still need a perfect overseer, which is arguably as hard as specifying a perfect goal function. The agent might also become overly conservative, refusing to act in novel situations where approval is uncertain, leading to paralysis in critical moments.

  ### 4. "My verdict"

  If I had to deploy a system today in a high-stakes environment, I would choose the approval-directed architecture. The strongest reason is interruptibility and the lack of instrumental incentives. A goal-directed agent views being shut down as failure, giving it a reason to resist. An approval-directed agent views shutdown as just another action to seek approval on; if the overseer says "stop," stopping yields high approval. While goal-directed agents are more capable and cleaner for well-defined tasks, the safety margin provided by removing the drive for long-term optimization outweighs the efficiency loss. Until we solve value alignment perfectly, keeping the agent focused on immediate human feedback rather than distant outcomes is the lesser of two risks. It is a crucial bridging technology that keeps humans in the loop without relying on the hope that a complex objective function won't be misinterpreted.
