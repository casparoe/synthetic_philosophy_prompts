          3.  (Serious/Historical) The "Sleepwalkers" Consensus (Structural inevitability overrides agency).
          4.  (Awkward/Conceptual) Individual Ignorance (Most Germans didn't know).
          5.  (Awkward/Historical) Incompetence vs. Plan (They weren't good enough to be guilty of a master plan).
      *   *Vulnerability:* The **Conceptual** strand is more exposed philosophically, but the **Historical** strand is more exposed empirically. However, the prompt asks which is *more* exposed. The Historical claim relies on specific archives that can be re-interpreted (as Clark did). The Conceptual claim relies on moral philosophy which is more stable but harder to prove. Actually, the "Shrinking Referent" worry suggests the Conceptual strand is the weak link that protects the Historical one. If the Conceptual strand breaks, the Historical claim collapses into individual guilt. I will argue the **Conceptual** strand is the more philosophically exposed, while the **Historical** strand is the more empirically contested. But regarding the *user's specific worry about unfalsifiability*, the Conceptual definition is the pivot point.

  7.  **Drafting the Response:**

