          *   *Awkward:* The fact that individual peasants didn't know. (Handled by distinguishing collective vs. individual guilt).

  4.  **Explanatory Power:**

      *   *What it explains:* The specific escalation in July (Berlin pushing Vienna). The severity of war aims (September Programme). The continuity of German aggression (1914 -> 1939).
      *   *What it strains:* The genuine fear of encirclement. The role of Russian mobilization. The chaos/incompetence of the German leadership (were they masters of the gamble or victims of it?).

  5.  **The Structural Worry (Unfalsifiability):**

      *   *The Trap:* If "Germany" just means "Bethmann and Moltke," then saying "Germany is responsible" is tautological. If it means "The German People," it's false.
      *   *Resolution:* It must mean "The German State as a corporate agent." This isn't unfalsifiable, but it requires precise definition. It's not a defect if defined correctly; it *is* responsible talk.
      *   *Insulation:* If every counter-evidence about "the people" is met with "we meant the state," that's insulation. The user needs to admit the distinction.

  6.  **Ranking and Vulnerability:**

      *   *Ranking:*
          1.  (Fatal/Historical) Proof of Defensive Intent (Russia/Austria drove the bus).
