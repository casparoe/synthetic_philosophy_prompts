      *   *Counter-Arguments/Defeaters:*
          *   *Interwar Revisionism:* Versailles "War Guilt" lie. Alliances were defensive. (Mostly discredited, but the *spirit* of "shared crisis" remains).
          *   *Fischer's Critics (Gerhard Ritter, etc.):* Fischer took documents out of context. Bethmann was reactive, not proactive.
          *   *Structuralists (Berghahn, etc.):* It wasn't just Germany; it was the alliance system, imperialism, militarism.
          *   *Recent Synthesis (Clark, McMeekin, Hastings):* *The Sleepwalkers*. Everyone was scared. Mobilization timetables drove the bus. Russia's early mobilization is key.
      *   *Specifics:*
          *   *September Programme:* If this was drafted *after* war started, does it prove intent *before*? (Fatal if it's just opportunistic dreaming, not causal).
          *   *War Council Dec 1912:* If it was just talk, not action, does it prove a plan? (Awkward if it shows hesitation).
          *   *Blank Cheque:* Was it defensive (supporting ally) or offensive (inciting war)? If Vienna dragged Berlin, not vice versa, primacy weakens.
          *   *Mobilization:* If the Schlieffen Plan made war inevitable once Russia moved, is Germany guilty for having a plan, or is Russia guilty for moving?
      *   *Fatal vs. Awkward:*
          *   *Fatal:* Proof that Germany sought to *prevent* war in July 1914 but was dragged in by Austria or Russia. Proof that the "gamble" was actually a desperate defensive reaction to encirclement (without aggressive intent).
          *   *Awkward:* Evidence that other powers also had imperial ambitions (doesn't negate *primary* responsibility). Evidence that Bethmann was hesitant (doesn't negate structural push).

  3.  **Conceptual Front Analysis (Collective Responsibility):**

      *   *The Core Claim:* "Germany" (the nation) is responsible, persisting through time.
      *   *Objections:*
          *   *Methodological Individualism:* Only individuals act. Nations don't have minds.
          *   *Democratic Deficit:* Most Germans didn't vote for war.
          *   *Temporal Gap:* Why punish/ blame Germans in 1945 or 2024 for 1914?
          *   *The "Shrinking Referent":* Nation -> State -> Government -> Clique.
      *   *Defenses:*
          *   *Corporate Agency:* States act through organs. Responsibility attaches to the office/structure, not every citizen.
          *   *Benefit/Burden:* If the nation benefits from the act, it bears the burden.
          *   *Continuity:* The Federal Republic accepted legal continuity (in some aspects) and moral debt (reparations, memorials).
      *   *Fatal vs. Awkward:*
