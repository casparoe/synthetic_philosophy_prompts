      *(Refining the "Shrinking Referent")*: This is a crucial point. If "Germany" = "The Kaiser and 5 men," then "Germany" is a metaphor. If "Germany" = "20 million people," it's unjust. The middle ground is "The German State." I need to validate the user's worry that this retreat happens but argue it's necessary, not necessarily dishonest, provided the distinction is explicit.

  8.  **Final Review against constraints:**
