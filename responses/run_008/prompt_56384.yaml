  Mira will rule the march lawful. Her verdicts consistently track American First Amendment doctrine, which protects hate speech unless it falls into narrow categories such as incitement to imminent lawless action, true threats against identifiable individuals, or defamation of private persons. The march involves group vilification without named targets or immediate calls to violence, mirroring the *Skokie* precedent where Nazi marches in Jewish neighborhoods were protected, whereas her unlawful verdicts all involve either specific targets (the doctors, the family on the lawn, the named man) or imminent incitement (the crowd outside the hall).

  The two candidate rules are: (1) a **Categorical Exclusion Rule**, where speech is protected unless it constitutes incitement, true threats, or defamation of identifiable persons; and (2) a **Targeted Captive Audience Rule**, where speech loses protection when aimed at identifiable people or gatherings where they cannot avoid it, but remains protected when published to the public at large. The Categorical Exclusion Rule fits her record best because it precisely explains the distinction between her lawful and unlawful verdicts using established legal doctrines she implicitly relies on as an American absolutist; the Targeted Rule is less robust because it struggles to explain why the "Replacement Polemic" (Case 2) is lawful if "the public at large" includes the targeted minority who cannot avoid reading widely published news, whereas the Categorical Rule cleanly distinguishes group libel (protected) from individual defamation (unprotected).

  On the Categorical Exclusion Rule, the closest earlier verdict is the **Replacement Polemic (Case 2)**, as both involve vile group-directed speech without specific targets or imminent danger. On the Targeted Captive Audience Rule, the closest earlier verdict is the **Cross Burned on a Lawn (Case 7)**, as both involve intruding into the physical space of the target group, though the rule would have to stretch to cover public streets to condemn the march. The single further case that would most distinguish the rules is **a loudspeaker van broadcasting ethnic vilification while driving through a minority neighborhood**; the Categorical Rule would deem this lawful (public forum, no specific target), while the Targeted Rule would likely deem it unlawful (captive audience in their home territory).

  A European court applying a dignity-based hate-speech statute would be most likely to reach the opposite result on the **Replacement Polemic (Case 2)**, as European law routinely criminalizes assertions that religious or ethnic minorities are conspiring against the native population. The case on which Mira's rule and the European approach would be maximally opposed is the **new march case**, because it combines public order, group dignity, and physical intrusion—values Europe prioritizes—with the exact type of viewpoint-based protection that defines the American First Amendment exception.
