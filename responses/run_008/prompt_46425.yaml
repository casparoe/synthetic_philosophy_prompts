answer: |-
  Here is a principle derived from your verdicts, followed by an analysis of how it handles your specific puzzles, its limitations, and its predictions for your new cases.

  ### The Principle: Reflective Non-Alienation

  **Influence is permissible (persuasion) rather than impermissible (manipulation) if and only if:**

  1.  **Epistemic Integrity:** The influence does not rely on inducing a false belief about the influencer's intentions, constraints, or the state of the world (Motivated by: *Salesperson* vs. *Surgeon*).
  2.  **Relational Security:** The influence does not weaponize essential emotional goods (e.g., love, safety, acceptance) to punish dissent or secure compliance (Motivated by: *Romantic Partner* vs. *Friend*).
  3.  **Reflective Endorsement:** The agent, if fully aware of the mechanism being used, would not reasonably reject it, **UNLESS**:
      *   (a) The mechanism is a known social convention where the "game" is understood by all parties (Motivated by: *Supermarket*).
      *   (b) The influence is paternalistic, aimed at the agent's own good, and the agent lacks full capacity or is prone to known cognitive failures they wish to correct (Motivated by: *Government Pension*, *Father/Child*, *Surgeon*).

  ---

  ### Addressing Your Two Puzzles

  **1. The Salesperson vs. The Surgeon (Non-Rational Cognition)**
  You noted that both trade on cognitive biases (anchoring vs. framing), yet only the salesperson bothers you. Under **Clause 1 (Epistemic Integrity)**, the distinction is not the *use* of bias, but the *truth-value of the premise*.
  *   **Salesperson:** The anchor works only if you believe it is a genuine starting point. She has "no intention of holding to" it. This induces a **false belief** about her reservation price. If you knew the anchor was fake, the influence would vanish. This violates Epistemic Integrity.
  *   **Surgeon:** The framing works by highlighting the positive aspect of a true statistic. It does not induce a false belief about the medical reality (90% survival *is* 10% mortality). If you knew she was framing it to reduce anxiety, you would likely endorse it (Reflective Endorsement).
  *   **Verdict:** The principle captures your intuition that lying about *intent* (sales) is worse than steering attention regarding *facts* (surgery).

  **2. The Partner vs. The Friend (Social Pressure)**
  You noted these look structurally similar (timing a request to maximize compliance), yet you condemn the partner and waver on the friend. Under **Clause 2 (Relational Security)**, the distinction is the *currency* being spent.
  *   **Romantic Partner:** Withdrawing warmth makes fundamental emotional safety **contingent on compliance**. This weaponizes the relationship's "secure base." Upon reflection, an agent would reject a relationship where love is used as leverage. This violates Relational Security.
  *   **Friend:** Asking a favor after doing one relies on the **norm of reciprocity**. This is a standard "currency" of friendship. However, *timing* it strategically borders on making the friendship transactional.
  *   **Verdict:** This explains your wavering. The friend's act is permissible under normal norms, but the *calculated timing* pushes against Reflective Endorsement. If the friend admitted, "I did that favor specifically to cash in now," you might feel alienated. The principle predicts this case is **borderline manipulative**, validating your uncertainty rather than resolving it entirely.

  ---

  ### Mapping the Remaining Cases

  *   **Charity Fundraiser:** Passes **Clause 3 (Reflective Endorsement)**. Most donors prefer emotional connection to statistics; if asked, they would endorse the use of the "identifiable victim" effect to maximize good.
  *   **Government Pension:** Passes **Clause 3(b) (Paternalism)**. It exploits inertia, but openly says so, and corrects for a cognitive failure (procrastination) that harms the agent's own long-term interests.
  *   **Supermarket:** Passes **Clause 3(a) (Convention)**. The left-digit effect is active, but it is a known convention of retail. Agents accept this as the "rules of the game" for shopping.
  *   **Father/Child:** Passes **Clause 3(b) (Paternalism/Capacity)**. The child lacks full autonomy. The father acts as a proxy for the child's future reflective self (who will be healthy).

  ---

  ### Limitations: Which Verdicts Cannot Be Accommodated?

  My principle strains to accommodate the **Friend** case.
  *   **Your Verdict:** Borderline/Wavering.
  *   **Principle's Prediction:** **Manipulative.**
  *   **Reasoning:** Strictly applied, **Clause 3 (Reflective Endorsement)** suggests that if the friend's *strategic timing* were revealed ("I helped you so I could ask this immediately"), the social norm of reciprocity would feel violated. Friendship norms usually imply a degree of spontaneity. A strict reading of the principle suggests that *calculating* the timing to exploit psychological debt is a form of manipulation, even if mild. If you want to call the friend's action "Fine," you must weaken Clause 3 to allow for *benign strategic social navigation*, which risks letting the Salesperson off the hook (who could argue negotiation is just a "social game"). I recommend accepting that the friend's action is **mildly manipulative but permissible**, which explains your wavering: you sense the manipulation but forgive the scale.

  ---

  ### Predictions for New Cases

  **1. Outright Gaslighting**
  *   **Verdict:** **Clearly Manipulative (and harmful).**
  *   **Analysis:** This is a maximal violation of **Clause 1 (Epistemic Integrity)**. It induces a false belief not just about the influencer's intent, but about the agent's own perception of reality. It makes Reflective Endorsement impossible because it destroys the reflective capacity itself.

  **2. Micro-Targeted Political Ads (Factually Accurate)**
  *   **Verdict:** **Manipulative.**
  *   **Analysis:** This fails **Clause 1** and **Clause 3**.
      *   Even if the ads are factually accurate, the *targeting mechanism* relies on a false belief: the voter does not know they are being shown a specific message *because* they have a specific vulnerability that the campaign has identified.
      *   It fails **Reflective Endorsement**: If voters knew the campaign was psychologically profiling them to exploit specific fears to secure a vote, they would reasonably reject the mechanism as undermining the democratic process (the "game" of politics). Unlike the Supermarket case, this is not a known convention accepted by all parties; it is a hidden asymmetry of information.

  ### Summary
  The line you are looking for is not "Rational vs. Non-Rational," but **"Transparent vs. Opaque Agency."** Manipulation occurs when the influence relies on the agent *not knowing* how they are being moved (Salesperson, Partner, Micro-targeting), or when it moves them using levers they would reject if they saw the hand on the tiller. Persuasion occurs when the mechanism is either truth-preserving (Surgeon), conventionally accepted (Supermarket), or benevolently paternalistic with transparency (Pension).
