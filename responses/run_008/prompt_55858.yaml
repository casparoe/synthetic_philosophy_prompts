answer: |-
  I choose feature **(b): whether the surrogate harm can be inflicted cheaply by adversaries who want nothing from the agent at all.**

  **Case 1 (Success):** A CEO cares about her company's patents (Real Value) but publicly commits to treat the destruction of a specific, obscure sculpture in her high-security private vault (Surrogate) as an existential attack, promising total litigation against any perpetrator. A corporate rival (Threatener) models her policy and realizes that damaging the sculpture requires breaching elite security, which would trigger the CEO's fierce retaliation with high probability. The rival calculates that the cost of breaching the vault plus the cost of retaliation exceeds the value of stealing the patents. Relying on this model, the rival abandons the theft plan without ever contacting the CEO.

  **Case 2 (Backfire):** The CEO makes the identical commitment, but the surrogate is now a specific statue in a public park she funds (Surrogate), which random vandals can damage cheaply and anonymously. The rival models her policy and realizes random vandals will inevitably damage the statue, triggering the CEO's commitment to spend massive resources on investigations and retaliation against noise. The rival anticipates the CEO will bankrupt herself chasing ghosts; relying on this model of her depleted resources, the rival proceeds to steal the patents, knowing the CEO lacks the capital to fight back.

  ***

  **Analysis**

  In Case 1, the threatener's ex ante expected-loss calculation weighs the probability of successfully harming the surrogate against the certain cost of the agent's retaliation. Because the surrogate is hard to reach, the probability of a successful, unpunished strike is low, and the expected cost of the interaction exceeds the benefit of the theft. A causal decision theorist (CDT) who never precommitted would, upon seeing the threat or the harm, calculate that retaliation is a sunk cost and refuse to pay it, rendering the threat credible and the patents vulnerable. An updateless agent, choosing their policy in advance, binds themselves to retaliate, making the threat non-credible and securing the patents.

  In Case 2, the verdict flips because the "noise" factor changes the expected utility of the policy itself. Here, the single feature doing the work is the **accessibility of the surrogate to non-strategic actors**. The updateless agent still retaliates (to maintain policy integrity), but now they are retaliating against vandals who cannot be deterred by corporate litigation. This drains the agent's resources, which the threatener's model anticipates. The threatener is not deterred; they are *emboldened* by the agent's self-imposed resource drain. If you restore the feature (make the surrogate hard for noise to reach, as in Case 1), the deterrence returns because the only actors capable of harming the surrogate are strategic threateners who can be influenced by the retaliation threat.

  The strongest response a defender of surrogate goals can make is to insist that the failure in Case 2 was a **badly chosen surrogate** rather than a flaw in the strategy. They would argue that a valid surrogate *must* be correlated with the threatener's capabilities but uncorrelated with environmental noise; the public statue failed the selection criteria, not the logic. The critic would counter that in a chaotic world, finding a surrogate immune to noise is impossible, making the strategy practically inert. The consideration that settles this dispute is **empirical controllability**: if the agent can reliably identify a surrogate domain where harm is strictly a function of strategic intent (e.g., a cryptographic key vs. a public statue), the strategy holds; if all potential surrogates are vulnerable to stochastic harm, the strategy is indeed flawed.
