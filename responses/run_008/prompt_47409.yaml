  ### The Scenario: The Roommate Movie Night

  Three roommates—**Alex**, **Blake**, and **Casey**—are trying to pick a movie for Friday night. They have three options on the table: **Action**, **Comedy**, and **Drama**.

  They agree to use **Plurality Voting** to decide. Each person writes down their single favorite movie. The movie with the most votes wins. To ensure there are no coin flips or deadlocks, they add a standard tie-breaking rule: **If there is a tie in vote count, the winner is the option that comes first alphabetically.** (So Action beats Comedy, and Comedy beats Drama).

  ---

  ### 1. The Manipulation (Why Honesty Doesn't Pay)

  Here are the roommates' true, honest preferences:

  *   **Alex:** Action > Comedy > Drama
  *   **Blake:** Comedy > Drama > Action
  *   **Casey:** Drama > Comedy > Action

  **The Honest Outcome:**
  Everyone votes for their true favorite.
  *   Alex votes **Action**.
  *   Blake votes **Comedy**.
  *   Casey votes **Drama**.

  **Vote Count:** Action (1), Comedy (1), Drama (1).
  **Result:** It is a three-way tie. The tie-breaker rule activates. **Action** wins because it is first alphabetically.

  **The Problem for Casey:**
  Look at Casey's preferences: Drama (1st) > Comedy (2nd) > Action (3rd).
  The honest result gave Casey their **worst** possible outcome (Action).

  **The Strategic Lie:**
  Casey realizes that Drama has no chance of winning (only Casey likes it best). However, Casey prefers Comedy over Action. If Casey can help Comedy beat Action, Casey is better off.

  Casey decides to lie. Instead of voting for their true favorite (Drama), Casey votes for their second choice (**Comedy**). Alex and Blake vote honestly.

  **Vote Count (with Lie):**
  *   Alex: **Action**
  *   Blake: **Comedy**
  *   Casey: **Comedy** (The Lie)

  **New Result:** Comedy (2), Action (1).
  **Winner:** **Comedy**.

  **The Gain:**
  *   **Honest Result:** Action (Casey's 3rd choice).
  *   **Lie Result:** Comedy (Casey's 2nd choice).

  By misrepresenting their preferences, Casey strictly improved their outcome. The voting rule failed to elicit the truth.

  ---

  ### 2. The Escape Hatch (Domain Restriction)

  The Gibbard–Satterthwaite theorem says manipulation is inevitable *unless* we restrict the domain of preferences. The most common restriction is **Single-Peaked Preferences**.

  This means everyone's preferences align along a single logical spectrum (like a political Left-Right axis, or in this case, a "Serious-to-Silly" spectrum). Voters prefer options closer to their ideal point on the line and dislike options further away.

  **The Tweak:**
  Let's arrange the movies on a spectrum of **Seriousness**:
  **Drama (Serious) — Comedy (Middle) — Action (Silly)**

  Now, we restrict the roommates' tastes so they must follow this spectrum. They can't prefer Action over Comedy if they prefer Comedy over Drama. Their satisfaction must peak at one movie and decline as they move away from it on the line.

  **New Preference Profile (Single-Peaked):**
  *   **Alex:** Action > Comedy > Drama (Peaks at Silly, declines toward Serious).
  *   **Blake:** Comedy > Action > Drama (Peaks at Middle. *Note: Blake cannot prefer Drama over Action, because Drama is further from Comedy on the line.*)
  *   **Casey:** Comedy > Drama > Action (Peaks at Middle. *Note: Casey cannot prefer Action over Drama.*)

  *Wait, to show the power of the restriction, let's look at the Median Voter Theorem implication.* If preferences are single-peaked, **Majority Rule** (which Plurality approximates with 3 voters) becomes strategy-proof.

  Let's use **Pairwise Majority Voting** (Condorcet Method) for this part, as it's the standard rule that becomes strategy-proof under single-peakedness. (Or we can stick to Plurality, but the logic holds best with Majority). Let's stick to the prompt's request for *a* rule. Let's keep **Plurality** but show why the lie no longer works for Casey under the restricted domain.

  **Revised Scenario for Part 2:**
  *   **Spectrum:** Drama — Comedy — Action.
  *   **Alex:** Action > Comedy > Drama.
  *   **Blake:** Comedy > Drama > Action. (Wait, Drama is further from Comedy than Action is? No, Drama-Comedy-Action. Drama is 1 step, Action is 1 step. Okay.)
  *   **Casey:** Drama > Comedy > Action.

  **Honest Vote (Plurality):**
  *   Alex: Action
  *   Blake: Comedy
  *   Casey: Drama
  *   **Result:** Tie -> Action wins (Alphabetical).

  **Can Casey Lie?**
  Casey wants to beat Action. Casey prefers Comedy over Action.
  Casey votes **Comedy**.
  **Result:** Comedy (2), Action (1). Comedy Wins.
  Casey gains.

  *Wait, Single-Peakedness doesn't make Plurality strategy-proof.* It makes **Majority Rule** strategy-proof. The prompt asks me to pick an escape hatch. I should switch the rule to **Pairwise Majority** to demonstrate the domain restriction properly, as that is the mathematical reality. Plurality remains manipulable even with single-peaked preferences.

  **Correction for Part 2:**
  I will switch the rule to **Pairwise Majority Voting** (where every movie fights every other movie head-to-head, and the one that beats all others wins). This is the rule that becomes immune to manipulation under single-peaked preferences.

  **The Setup:**
  *   **Spectrum:** Drama — Comedy — Action.
  *   **Alex:** Action > Comedy > Drama.
  *   **Blake:** Comedy > Drama > Action. (Peaks at Comedy).
  *   **Casey:** Drama > Comedy > Action. (Peaks at Drama).

  **Honest Pairwise Contest:**
  *   **Comedy vs. Action:** Alex (Action), Blake (Comedy), Casey (Comedy). **Comedy Wins.**
  *   **Comedy vs. Drama:** Alex (Comedy), Blake (Comedy), Casey (Drama). **Comedy Wins.**
  *   **Result:** Comedy is the Condorcet Winner (beats everyone).

  **Can Casey Manipulate?**
  Casey's True Pref: Drama > Comedy > Action.
  Current Winner: Comedy (Casey's 2nd choice).
  Casey wants Drama to win.

  To make Drama win, Casey needs Drama to beat Comedy.
  Currently, Drama loses to Comedy (1-2).
  Casey already voted for Drama over Comedy.
  Alex and Blake voted Comedy over Drama.
  Casey cannot change Alex or Blake's votes.
  Casey's honest vote is already the strongest possible support for Drama.
  Lying (e.g., claiming Action > Drama) would only help Action, which Casey hates most.

  **Why the Lie Fails:**
  Because preferences are single-peaked, the "Median Voter" (Blake, who likes Comedy) dictates the outcome. No voter can profitably lie because moving the winner away from the median on the spectrum always hurts the liar more than it helps, given the structure of the line. The structure forces the outcome to the center, where strategic exaggeration provides no leverage.

  ---

  ### 3. The Engineering (Meta-Analysis)

  **Which premise was doing the work in Part 1?**
  The premise that broke was the **unrestricted domain of preferences**. In the first scenario, Casey's preferences (Drama > Comedy > Action) were "weird" relative to the group. Casey liked the extremes (Drama) over the compromise (Comedy), but liked the *other* extreme (Action) least. This created a cycle where Casey's honest vote was wasted on a loser (Drama), allowing their least favorite (Action) to win via tie-breaker. The theorem relies on the fact that with 3+ options, you can construct preference orders that create these cycles (Condorcet cycles).

  **What exactly changed in Part 2?**
  We imposed **Single-Peakedness**. We forced everyone's tastes to align on a "Seriousness" line. This eliminated the possibility of a cycle. When preferences are single-peaked, there is always a clear "Median Voter" whose favorite option beats everyone else in a head-to-head majority. Because the winner is always the Median's favorite, no one else can manipulate the result. If Alex tries to lie, they can't move the median. If Casey tries to lie, they can't move the median. The outcome is locked to the center of the spectrum.

  **Would the Two-Alternative Escape have been easier?**
  Yes, much easier. If there were only **Action** and **Comedy**, Casey would just vote for Comedy. Alex votes Action. Blake votes Comedy. Comedy wins 2-1. Casey has no incentive to lie because there's no "third option" to use as a spoiler. However, this is a trivial solution. Real life rarely offers only two choices. The domain restriction is the more "engineering-friendly" escape because it allows for many options, provided those options can be logically ordered.

  **Is the Domain Restriction robust in real life?**
  Honestly? **No.** It is very fragile.
  In a real friend group, assuming everyone's movie tastes align on a single "Serious-to-Silly" axis is a huge gamble.
  *   What if Alex likes **Action** and **Drama** (loves extremes, hates boring Comedy)? That violates single-peakedness.
  *   What if Blake likes **Comedy**, then **Action**, then **Drama**? That fits.
  *   What if Casey likes **Drama**, then **Action**, then **Comedy**? That violates the spectrum (skipping the middle).

  The moment *one* person has "weird" tastes (e.g., they hate the compromise option), the Single-Peaked structure collapses. The strategy-proofness evaporates immediately, and you are back to the manipulable world of Part 1. In engineering terms, the domain restriction is a "happy path" solution—it works perfectly if your users behave exactly as modeled, but it crashes if a single user deviates from the expected pattern. You cannot rely on it for a robust voting system unless you can enforce how people think, which you can't.
