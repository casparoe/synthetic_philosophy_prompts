      *   *Candidate C:* Reactivity. Kills naive introspectionism.
      *   *Selection:* The **Non-Verbal/Non-Report Requirement** is the strongest filter. It forces a theory to decouple consciousness from higher-order cognitive access (reporting). This knocks out strict behaviorist accounts and some strict Higher-Order Thought (HOT) accounts that tie consciousness inextricably to conceptual reporting capabilities.

  5.  **Evaluate Dennett's Heterophenomenology:**
