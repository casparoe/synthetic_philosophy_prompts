  2.  **Deconstruct the Desiderata (Drafting the List):**
      *   *Requirement 1: Dissociation Handling.* Needs to distinguish NCC (neural correlates of consciousness) from NCR (neural correlates of reporting). Blindsight is the classic case.
      *   *Requirement 2: Report Status.* Reports are the primary data but are theory-laden and fallible. Need a "critical realism" about reports.
      *   *Requirement 3: Operational Definition of Report.* What physical action counts as evidence of experience? Motor output vs. cognitive access.
      *   *Requirement 4: Non-Standard Subjects.* The "Hard Problem" of methodology. If consciousness exists in babies/dogs, a method that requires verbal report fails.
      *   *Requirement 5: Reactivity/Meta-Cognition.* Does measuring it change it? (Heisenberg uncertainty for qualia).

  3.  **Analyze Trade-offs (Incompatibilities):**
      *   *The Tension:* Requirement 2 (trust reports) vs. Requirement 1 & 4 (reports can be absent or wrong).
      *   *The Big Conflict:* Requirement 3 (operationalizing report) vs. Requirement 4 (no report available). If you define consciousness *by* report (operationalism), you lose animals/infants. If you define it independently, how do you validate the measure without report?
      *   *Suspected Incompatibility:* You cannot simultaneously demand *strict* reliance on subjective report for validation (to ensure it's about consciousness) and *independence* from report for generalization (to include animals). This is the "Calibration Problem."

