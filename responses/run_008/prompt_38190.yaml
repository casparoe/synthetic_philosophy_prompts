      *   *Against the List:*
          *   *Dissociations:* Handles well (treats the denial of sight in blindsight as part of the text).
          *   *Report Status:* Handles well (reports are data, not truth).
          *   *Definition of Report:* Handles well (any intentional communication).
          *   *Reactivity:* Handles well (all part of the narrative).
          *   *Non-Verbal Subjects:* **Here is the weak point.** Dennett explicitly struggles here. If consciousness is a "user-illusion" constructed via language/narrative, do dogs have it? Dennett has shifted views, but strictly speaking, heterophenomenology relies on *interpretation of intentional stance*. Without language, the "text" is thin.
