      *   *Refining Dennett:* Dennett's view is that consciousness *is* largely a linguistic artifact (in the sense of the "Cartesian Theater" being dissolved). So, asking if his method works for non-linguistic beings is almost a category error for him, but for a *science of consciousness* that wants to include animals, it's a fatal flaw. I need to make sure I distinguish between "Dennett's view on animal consciousness" and "Heterophenomenology as a method." The method requires a "text." Animals don't produce text.

