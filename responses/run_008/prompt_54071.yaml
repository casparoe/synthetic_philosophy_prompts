      *   **The Ordering:**
          1.  **Start with Q2 (Belief/Truth Gap).** Why? Because you can't have deception without a gap between internal representation and output. This is the most "engineering-friendly" version of the philosophy. Mention "eliciting latent knowledge."
          2.  **Move to Q5 (Honesty vs. Reward).** Why? Because you need to know if you're fighting the objective function. This defines the *adversarial* nature of the problem.
          3.  **Deprioritize Q1 (Intent).** Explain why it's a trap. Intent is an abstraction we project, not a property we can measure.
          4.  **Treat Q3 & Q4 as Product Policy.** These are rules for the system, not properties of the weights.
      *   **Actionable Resources:** Suggest papers that are technical, not philosophical. (e.g., Burns et al. on "Discovering Latent Knowledge," Hubinger et al. on "Deceptive Alignment").
