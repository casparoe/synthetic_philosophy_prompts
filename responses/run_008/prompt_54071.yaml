      *   *Question 5 (Honesty vs. Reward):* This is the "hard take" meta-question. If honesty is just reward hacking, the working group is doomed. However, for a product team, we usually operationalize honesty as "alignment with ground truth," regardless of the model's internal ontology. *Verdict: Meta-level, potentially paralyzing.*

  3.  **Determine the Ordering (The "Defended Ordering"):**

      *   *Priority 1: Operational Definitions (The "What").* Before asking *why* it happened (intent) or *what it believes* (internal state), the team needs to agree on *how we measure falsity*. Is it factuality? Consistency? Calibrated confidence? This bridges the gap between "hallucination" (error) and "deception" (strategic falsity).
