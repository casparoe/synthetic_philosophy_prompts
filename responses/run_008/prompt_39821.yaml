answer: |-
  Here is the hard truth you asked for: **Your seven verdicts do not compress into a single decision-theoretic principle because they are not all decision-theoretic problems.**

  You are attempting to unify two distinct categories of reasoning under one hat:
  1.  **Instrumental Rationality:** How to win the game given the payoff matrix (Cases 1, 2, 3, and technically 4).
  2.  **Normative/Social Rationality:** How to be the kind of person who maintains a functional society, satisfies internal moral heuristics, or signals virtue (Cases 4, 5, 6, 7).

  Your tentative principle ("Cooperate when my cooperating is evidence...") is a version of **Evidential Decision Theory (EDT)** or **Functional Decision Theory (FDT)**. It works beautifully for the instrumental cases where logical correlation exists. It fails to explain your social verdicts because, in those cases, you are not optimizing for the immediate payoff; you are optimizing for long-term norm adherence or identity.

  If you demand a single principle, you will have to break your own mind. If you allow a dual-process model, we can save most of your intuitions. Here is the precise breakdown.

  ### The Proposed Framework: FDT + Internalized Norms

  **Principle A (Strategic):** *Act according to Functional Decision Theory.* Choose the output of your decision algorithm that, if rendered as a universal function for all agents logically correlated with you, maximizes your expected utility.
  **Principle B (Social):** *Act according to Internalized Norms.* Follow heuristics (e.g., "vote," "tip," "don't cheat") that, if adopted by your tribe generally, maximize long-term welfare, even if they lose in specific one-shot instances.

  #### Analysis of Your Seven Verdicts

  1.  **One-shot PD (Stranger): Defect.**
      *   *Framework:* **FDT.**
      *   *Analysis:* You implicitly assume the "random stranger" is *not* logically correlated with you (i.e., they are a CDT agent or their reasoning is opaque). If there is no subjunctive dependence, FDT collapses to CDT. Defection is correct.
  2.  **One-shot PD (Twin): Cooperate.**
      *   *Framework:* **FDT.**
      *   *Analysis:* High logical correlation. Your output predicts theirs. Cooperation is the winning move.
  3.  **Platonia (Superrational): Randomize 1/20.**
      *   *Framework:* **FDT.**
      *   *Analysis:* Perfect logical correlation among the group. The group acts as a single agent maximizing group utility. 1/20 is the correct mixed strategy.
  4.  **Luring Lottery (Irrational Crowd): Submit 1.**
      *   *Framework:* **Norms.** (FDT says: Submit $\approx$ Total Entries of Others).
      *   *Analysis:* Instrumentally, this is wrong. If others submit googols, your expected utility is maximized by also submitting a googol (matching the field). Submitting "1" is a moral statement ("I won't participate in the tragedy of the commons"), not a winning move. This is Principle B, not A.
  5.  **Election: Vote.**
      *   *Framework:* **Norms.**
      *   *Analysis:* Instrumental impact is near zero. You vote to uphold the norm of voting and to satisfy your identity as a citizen.
  6.  **HOA (Vote vs. Defect): Vote / Defect.**
      *   *Framework:* **Norms vs. FDT.**
      *   *Analysis:* Voting is a public, normative act (Principle B). The PD is a private, resource-extraction act (Principle A). The context switches which principle applies.
  7.  **Tipping: Tip.**
      *   *Framework:* **Norms.**
      *   *Analysis:* No causal or evidential leverage over the waiter. You tip to maintain your self-concept as a fair person and to support the institution of tipping generally.

  ### The Edge Cases

  You asked for verdicts on two specific scenarios. Here is how **FDT (Principle A)** handles them:

  **Case A: One-shot PD against a reasoner who runs the same reasoning but has opposed values.**
  *   **Verdict:** **Defect.**
  *   **Reasoning:** FDT requires logical correlation *and* aligned utility functions regarding the outcome. If our values are opposed (zero-sum), my cooperation does not lead to a mutually beneficial outcome; it leads to my exploitation. Even if we reason identically, if I cooperate, you (running the same function with opposed values) will defect to maximize your utility (which minimizes mine). FDT agents defect in zero-sum games.

  **Case B: Platonia where one of the nineteen is a superrationalist and the rest are unknown.**
  *   **Verdict:** **Do not send (or send with very low probability).**
  *   **Reasoning:** Superrationality relies on the assumption that *all* players are superrational and know it. If 18 are unknown, you must assign a prior probability $p$ that they are superrational.
      *   If they are naive, they might all send (collision guaranteed).
      *   If they are random, collision is likely.
      *   You cannot assume the "1/20" equilibrium holds because the group is not a single logical agent. You must model the 18 unknowns. Unless you have strong evidence the unknowns are also superrational, the risk of collision outweighs the benefit. The "magic" of superrationality breaks when the common knowledge of rationality breaks.

  ### The Sacrifice: Which Verdict Must Go?

  You asked which of your verdicts my best principle cannot accommodate. I have two candidates, depending on what you value more: **Consistency** or **Winning**.

  **1. The Theoretical Casualty: Verdict (1).**
  If you accept Verdict (2) (Cooperate with a twin), you have accepted that logical correlation matters. Most humans are *more* similar to you than you are to a perfect mirror image. They have similar brains, similar upbringing, and similar heuristics.
  *   **The Conflict:** If you cooperate with a twin because "they reason like me," consistency demands you cooperate with a random stranger *to the degree* you believe they reason like you. To say "Defect, obviously" in (1) while saying "Cooperate" in (2) implies a magical thinking boundary where "similarity" suddenly becomes "correlation" only when you know about it.
  *   **The Fix:** You must admit that (1) is not "obviously Defect." It is "Defect *unless* I have reason to believe this human is logically correlated with me." Given that most humans are similar, FDT often recommends cooperation in one-shot PDs with humans. Your "obvious defect" intuition is standard CDT baggage that contradicts your (2) intuition.

  **2. The Instrumental Casualty: Verdict (4).**
  If you care about *winning* (maximizing dollars), Verdict (4) is delusional.
  *   **The Conflict:** In the Luring Lottery, if others submit $10^{100}$ entries, submitting 1 entry gives you an expected value of effectively zero. Submitting $10^{100}$ entries gives you an expected value of effectively zero, but *mathematically higher*.
  *   **The Fix:** You must admit that (4) is not a decision-theoretic verdict; it is a moral one. You are sacrificing utility to feel clean. That is a valid choice, but do not call it "rational" in the instrumental sense.

  ### The Root Confusion

  You asked me to push back if the request is confused. **It is.**

  You are trying to solve the **Is-Ought Problem** with **Decision Theory**.
  *   Decision Theory (FDT/CDT/EDT) tells you how to get what you want (the *Is* of causality/correlation).
  *   Morality/Norms tell you what to want (the *Ought* of values).

  Your verdicts (4), (5), (6), and (7) are not about how to win the game presented; they are about refusing to play the game presented because you prefer a different game (one where norms hold).
  *   In the **Luring Lottery**, you want to win *money*, but you also want to win *integrity*. You are prioritizing integrity.
  *   In the **Tipping** case, you want to save *money*, but you also want to be *fair*. You are prioritizing fairness.

  **Conclusion:**
  There is no single decision-theoretic principle that captures all seven because **you are optimizing two different utility functions.**
  1.  **Material Payoff:** Captured by FDT. (Saves 2, 3. Challenges 1).
  2.  **Normative/Identity Payoff:** Captured by Rule Utilitarianism or Virtue Ethics. (Saves 4, 5, 6, 7).

  If you force them into one principle, you will end up with a convoluted definition of "utility" that includes "feeling good about not cheating," which renders the decision theory tautological ("I did what maximized my utility because I defined my utility as doing what I did").

  **My Advice:**
  Keep **Functional Decision Theory** for cases where the payoff is explicit and the goal is winning (Platonia, PDs).
  Keep **Deontological Heuristics** for cases where the payoff is diffuse and the goal is social cohesion (Voting, Tipping, Lotteries).
  And drop the intuition that **(1) is "obviously Defect."** If you truly believe (2), you must acknowledge that correlation is a matter of degree, not a binary switch flipped by knowing someone's reading list. The stranger in (1) is likely correlated enough to make cooperation a non-trivial option, and your certainty otherwise is the biggest leak in your theoretical hull.
