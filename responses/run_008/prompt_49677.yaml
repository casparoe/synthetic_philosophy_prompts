answer: |-
  Your friend's summary is a classic "half-right" take: it nails the headline intuition of the Condorcet Jury Theorem (CJT) but botches the mathematical conditions, the historical context, and the implications. Your intuition that the independence assumption is subtler than "nobody talked" is correct, and your skepticism about the "experts vs. crowd" and "values" conclusions is well-founded.

  Here is the claim-by-claim autopsy from the perspective of social choice theory, followed by an evaluation of the two conclusions.

  ### Part 1: Claim-by-Claim Autopsy

  **Claim 1:** *"If each voter is more likely to be right than wrong — even barely, 51% — then the probability that the majority picks the right answer goes toward 100% as you add voters."*
  *   **Verdict:** **Accept (Mathematically).**
  *   **The Math:** Let $S \in \{0, 1\}$ be the state of the world (the correct answer). Let $V_i \in \{0, 1\}$ be voter $i$'s vote. The theorem assumes **conditional independence**: $P(V_1, \dots, V_N | S) = \prod P(V_i | S)$. If competence $p = P(V_i = S | S) > 0.5$, then the probability the majority is correct is $P_N = \sum_{k=\lceil N/2 \rceil}^{N} \binom{N}{k} p^k (1-p)^{N-k}$. By the Law of Large Numbers, $\lim_{N \to \infty} P_N = 1$.
  *   **Note:** This is the only part of your friend's summary that is rigorously defensible as stated.

  **Claim 2:** *"So a million mediocre voters beat a panel of experts..."*
  *   **Verdict:** **Wrong (Contextually).**
  *   **The Math:** This compares a large $N_c$ with low $p_c$ against a small $N_e$ with high $p_e$. While $P_{N_c} \to 1$ asymptotically, convergence is slow when $p$ is close to 0.5.
      *   Example: If experts have $p_e = 0.9$ and there are 5 of them, their probability of majority correctness is $\approx 99\%$.
      *   If the crowd has $p_c = 0.51$, you need roughly $N_c \approx 25,000$ voters just to match the 5 experts.
      *   **Crucial Failure Mode:** If the question is technical, the "mediocre" assumption ($p > 0.5$) often fails. If the public lacks the vocabulary to understand the question, systematic bias can push $p < 0.5$. If $p < 0.5$, the theorem inverts: adding more voters makes the probability of correctness go to **0%**. A million voters with $p=0.49$ are worse than one random guesser.

  **Claim 3:** *"...which is why referendums are fine on any question as long as the electorate is big enough."*
  *   **Verdict:** **Wrong.**
  *   **Reasoning:** This ignores the **Binary Assumption** and the **Competence Assumption**. Referendums often bundle multiple issues (violating binary choice) or ask about counterfactual policy outcomes where $p$ is unknown and likely heterogeneous. Furthermore, "big enough" cannot overcome systematic error ($p < 0.5$).

  **Claim 4:** *"The catch is the independance assumption: the voters have to judge independently, so any prior discussion or shared media environment breaks the theorem."*
  *   **Verdict:** **Wince (Simplification).**
  *   **The Nuance:** Your memory is correct here. The assumption is not marginal independence ($V_i \perp V_j$); it is **conditional independence given the state of the world** ($V_i \perp V_j | S$).
  *   **The Error:** Shared media doesn't necessarily "break" the theorem; it introduces a **common signal**. If voters condition on a common signal $C$ (e.g., a news report) rather than just $S$, their votes become correlated.
  *   **The Math:** If correlation exists, the variance of the mean vote does not shrink at $1/N$. Instead of converging to 1, the probability of a correct majority converges to a limit $< 1$ (often determined by the accuracy of the common signal). It doesn't collapse to 0.5, but the "wisdom of crowds" advantage is severely attenuated. It only "breaks" completely if the correlation is perfect (herding).

  **Claim 5:** *"...political questions are mostly about values, not facts, so there's no right answer for the theorem to find..."*
  *   **Verdict:** **Accept (Philosophically).**
  *   **Reasoning:** CJT requires an objective state of the world $\omega$. If the question is "Should we lower taxes?", there is no $\omega \in \{0, 1\}$ that is "true" independent of human preference. This is the standard non-cognitivist critique of epistemic democracy.

  **Claim 6:** *"...which is why Condorcet himself ended up conceding that democracy has no epistemic case and rested it on equality instead."*
  *   **Verdict:** **Wrong (Historically).**
  *   **Reasoning:** This conflates the **Jury Theorem** (about truth) with the **Condorcet Paradox** (about preferences). Condorcet did not abandon the epistemic case for democracy; he was a staunch rationalist who believed majority rule was the best method for discovering truth *when truth existed*. He conceded that *preferences* cycle (the Paradox), but he maintained the Jury Theorem as the defense for *judgments of fact*. He did not retreat to a purely egalitarian/procedural defense; he remained an epistemic democrat until his death.

  ---

  ### Part 2: Evaluating the Conclusions

  Now, do the surviving claims support your friend's two big conclusions?

  #### Conclusion 1: *"Big electorates beat expert panels, so referendums are fine on any question however technical."*
  **Does it follow? No.**

  1.  **The Competence Threshold:** The theorem only works if $p > 0.5$. On technical questions (e.g., "Will this specific treaty clause trigger a trade deficit?"), the average voter's competence is likely $p \approx 0.5$ (random guess) or $p < 0.5$ (systematic misconception). If $p \le 0.5$, the crowd does not beat the experts; it performs worse than a coin flip regardless of size.
  2.  **Correlation Limits:** In a referendum, voters do not vote independently conditional on the truth. They vote conditional on a shared media environment. As noted in Claim 4, this introduces correlation $\rho > 0$.
      *   Mathematically, if votes are correlated, the effective sample size is not $N$, but $N_{eff} \approx \frac{N}{1 + (N-1)\rho}$.
      *   If $\rho$ is significant (due to polarized media), $N_{eff}$ hits a ceiling. You cannot buy infinite accuracy by adding more voters if they are all reading the same biased headlines.
  3.  **Expert Definition:** "Experts" implies $p_e \gg p_c$. Unless $N$ is astronomically large, a small panel with high $p$ outperforms a large crowd with low $p$. Since technical questions lower $p_c$, the "crowd wins" condition is rarely met in technocratic contexts.

  #### Conclusion 2: *"Once you notice politics is partly about values, the whole epistemic defense of majority rule collapses."*
  **Does it follow? No.**

  1.  **Instrumental Epistemicism:** Even if the *end* is a value (e.g., "prosperity"), the *means* are factual (e.g., "Does Policy X cause prosperity?"). Democracy can be defended epistemically on the instrumental link between policy and outcome, even if the ultimate goal is subjective. The CJT applies to the factual premises of political debate.
  2.  **The "Common Good" Assumption:** Some social choice theorists (e.g., Goodin, List) argue that even in value disputes, voters are often trying to estimate a "common good" rather than just expressing selfish preference. If voters are trying to estimate the same normative truth (even if it's not scientifically falsifiable), a CJT-like logic can still apply to moral reasoning.
  3.  **Historical Error:** As established in Claim 6, Condorcet did not concede this point. The epistemic defense does not collapse; it merely retreats from *all* questions to *factual and instrumental* questions.
  4.  **Diversity Trumps Ability:** There are other epistemic defenses beyond CJT. Hong and Page's "Diversity Trumps Ability" theorem shows that a diverse group of problem-solvers can outperform a group of high-ability experts, even without the strict $p > 0.5$ independence assumptions of CJT. This saves the epistemic case even if CJT fails.

  ### Summary of the Argument

  Your friend won the opening skirmish (the basic statement of the theorem) but lost the war (the implications).

  *   **Where he was right:** The core math of CJT ($p > 0.5 \implies$ Majority Accuracy $\to 1$) and the fact that values lack objective truth conditions.
  *   **Where he was wrong:**
      1.  **Independence:** It's not about "talking," it's about conditional correlation given the state of the world. Common signals limit convergence; they don't necessarily break it, but they cap the accuracy.
      2.  **Experts:** A large crowd with $p=0.51$ does not automatically beat experts with $p=0.9$ at realistic population sizes, and certainly not if the technical nature of the question pushes public $p$ below 0.5.
      3.  **History:** Condorcet did not abandon the epistemic defense; he distinguished between truth (Jury Theorem) and preference (Paradox).
      4.  **Values:** The existence of values does not negate the factual premises required to achieve them, leaving room for a partial epistemic defense.

  **The Verdict:** You were right to feel that the "beats experts" and "values collapse" claims moved too fast. The math allows for an epistemic defense of democracy, but it is much more fragile and conditional than your friend's recitation suggests. It justifies democracy for *factual* questions among *competent* voters with *diverse information*, but it provides no shield for referendums on complex technical issues where public competence is low and information is correlated.
