      *   *Decision:* The novel is the better text for this philosophical analysis. Crichton was a medic/scientist who wrote techno-thrillers. He *meant* the science talk to carry weight, even if dramatized. I should focus primarily on the novel but acknowledge the film's cultural impact (the "Life finds a way" quote is iconic there).

