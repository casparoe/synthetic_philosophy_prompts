      *   *Emergence:* The whole has properties the parts don't have. Sometimes, knowing the parts *isn't enough* to predict the whole, even in principle. (Like AI behavior emerging from neural nets, or consciousness from neurons).
      *   *Chaos Theory:* Deterministic but unpredictable due to sensitivity to initial conditions. (Often conflated with emergence, but distinct).
      *   *Epistemic vs. Ontological:*
          *   *Epistemic:* We can't know it (limited data/compute).
          *   *Ontological:* It *is* unknowable/unreducible by nature.
      *   *User's framing:* The user nails the distinction between "we didn't look at the right level" (epistemic reductionism) and "no amount of knowing the parts tells you what the whole does" (ontological emergence). I need to validate this framing.

