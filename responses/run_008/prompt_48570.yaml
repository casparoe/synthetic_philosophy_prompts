      *   **Crichton's Conflation:** Does he slide between them? Yes. He uses "Chaos Theory" as a catch-all buzzword for "Complex Systems Theory." In the 80s/90s, these were often blurred in pop science.
      *   **The Sabotage/HR Factor:** Acknowledge the user's point. Nedry (sabotage) and Hammond (greed/optimism bias) are human factors. Philosophy of science doesn't explain greed. This weakens the "pure emergence" reading.
      *   **What the Story Does Better:** A philosophy paper defines terms. A novel *shows* the anxiety of losing control. It dramatizes the *consequence* of hubris.
