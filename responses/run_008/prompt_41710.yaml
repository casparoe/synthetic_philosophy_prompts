answer: |-
  # Seminar Handout: Desiderata for an Account of Pain's Badness

  ## I. The Desiderata
  The following criteria constitute the grading rubric for any theory of pain's badness proposed in this unit. They are divided into **Non-Negotiable Constraints** (empirical or conceptual boundaries no adequate theory may cross) and **Theoretical Preferences** (desirable features that may be sacrificed if a theory offers compensating explanatory power, provided the cost is acknowledged).

  | # | Desideratum | Status | Rationale & Anchor Case |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Asymbolia Constraint** | **Non-Negotiable** | **Case:** Pain Asymbolia & Morphine Dissociation.<br>**Requirement:** The theory must provide a principled verdict on whether asymbolic pain is bad *for the subject*. It must explain how sensory intensity can remain intact while badness vanishes. It cannot treat the pain matrix as a unity. |
  | **2** | **The Reflective Endorsement Test** | **Non-Negotiable** | **Case:** The Reflective Asymbolic Patient.<br>**Requirement:** The theory must adjudicate the variant where an asymbolic patient judges her pain is bad and requests analgesia despite feeling no aversion. Does badness track the *felt aversion* or the *reflective judgment*? The theory cannot leave this indeterminate. |
  | **3** | **The Temporal Independence Constraint** | **Non-Negotiable** | **Case:** Unremembered/Posthumous Pain.<br>**Requirement:** The theory must explain the badness of a painful episode that leaves no memory trace (due to death or amnesia). Badness cannot be wholly constitutively dependent on a *current* negative attitude toward the experience. |
  | **4** | **The Valence/Endorsement Distinction** | **Non-Negotiable** | **Case:** Welcomed Pain (Athletics, Rites, Masochism).<br>**Requirement:** The theory must distinguish between pain that is *not bad* (because endorsed) and pain that is *bad but overridden* (by value). It cannot simply claim endorsed pain ceases to be painful or bad without explaining the residual "cost." |
  | **5** | **The Structural Dissociation Constraint** | **Non-Negotiable** | **Case:** Double Dissociations (Sensory vs. Affective).<br>**Requirement:** The theory must respect the distinction between: (a) Sensory-Discriminative (location, intensity), (b) Affective-Motivational (unpleasantness, urge to stop), and (c) Cognitive-Evaluative (meaning, context). Badness must be mapped to one or a combination, not all indiscriminately. |
  | **6** | **The Comparative Sentience Commitment** | **Preference** | **Case:** Fish, Infants, Decorticate Patients.<br>**Requirement:** Whatever verdict the theory delivers for adult human asymbolia, it must explicitly apply the same logic to beings with partial apparatus. If asymbolic pain is not bad because it lacks affect/evaluation, is fish pain (lacking cortex/evaluation) also not bad? Acknowledge if this is accepted as a cost. |
  | **7** | **Phenomenal Supervenience** | **Preference** | **Case:** Internalist Intuitions.<br>**Requirement:** Ideally, badness should supervene on the phenomenal character of the experience (what it feels like from the inside). However, see *Section II* regarding the tension with Asymbolia. |

  ---

  ## II. The Inconsistency Flag: The Supervenience Tension

  There is a known tension between **Desideratum 1 (Asymbolia)** and **Desideratum 7 (Phenomenal Supervenience)**.

  *   **The Conflict:**
      1.  **Supervenience Claim:** The badness of pain is determined entirely by its phenomenal character (what it feels like).
      2.  **Asymbolia Intuition:** Asymbolic pain is *not* bad (or is significantly less bad) than typical pain.
      3.  **Empirical Fact:** Asymbolics report the *sensory* phenomenal character (intensity, location) as identical to typical pain subjects.

  *   **The Dilemma:**
      *   **Option A (Keep Supervenience):** Assert that asymbolic pain *is* just as bad as typical pain, despite the subject's indifference.
          *   *Cost:* Counterintuitive. It implies a subject can be suffering grievously while joking and indifferent. It severs the link between badness and motivation.
      *   **Option B (Keep Asymbolia Intuition):** Assert that asymbolic pain is not bad.
          *   *Cost:* You must drop strict Phenomenal Supervenience on *sensory* character. You must argue that the "badness" is not in the sensory qualia but in the *affective reaction* or *evaluative stance* toward the qualia. This makes badness partially attitude-dependent or relational.

  *   **Recommendation:** **Drop Option A.** Accept that badness does not supervene on *sensory* phenomenology alone.
      *   *Why:* Preserving the link between badness and welfare/motivation is more critical than preserving a strict internalist supervenience base.
      *   *The Cost:* This puts pressure on **Simple Hedonism**. If badness is not intrinsic to the sensory feel, then welfare is not simply the sum of positive and negative feels. It requires an account of how sensation is *taken* by the subject (Evaluativism) or what the sensation *commands* (Imperativism).

  ---

  ## III. The Exclusionary Constraint

  **The Single Most Exclusionary Requirement:**
  **Desideratum 1 & 5 Combined (The Asymbolia/Structural Dissociation Constraint).**

  *   **Why:** This requirement forces the separation of *sensation* from *suffering*.
  *   **Theories Excluded:**
      *   **Simple Sensory Hedonism:** The view that pain is bad simply because it is a sensation with a specific "hurtful" qualia. Asymbolia demonstrates that the sensation can exist without the "hurt" (unpleasantness). If the sensation is present but the badness is absent, badness cannot be identical to the sensation.
      *   **Naive Functionalism:** Any theory that defines pain solely by withdrawal reflexes is excluded, as asymbolics retain reflexes but lack the relevant badness.

  This constraint demands that a theory locate the badness in the **affective-motivational** or **evaluative** component, not the sensory-discriminative component. Any theory that treats pain as a monolithic qualitative state fails immediately.

  ---

  ## IV. Brief Theoretical Scorecard

  | Theory | Performance on Asymbolia (D1) | Performance on Unremembered Pain (D3) | Performance on Fish/Partial (D6) | Primary Vulnerability |
  | :--- | :--- | :--- | :--- | :--- |
  | **Simple Hedonism** (Badness = Sensory Feel) | **FAIL.** Cannot explain how sensory feel remains but badness vanishes. Must bite the bullet that asymbolics are suffering (counter-intuitive). | **PASS.** The episode was bad when it happened, regardless of memory. | **PASS.** If it feels like pain, it's bad. | **The Asymbolia Constraint.** Collapses sensory intensity and badness. |
  | **Imperativism** (Badness = Command to Stop) | **PASS.** Asymbolics receive the command ("Stop this!") but lack the motivation to obey. Badness = the command's presence. | **FAIL/UNSTABLE.** If the subject dies, who receives the command? If the command is private, does it vanish with consciousness? | **PASS.** If the system issues commands, it suffers. | **The Temporal Constraint.** Struggles to ground the "command" in subjects who cannot process imperatives or no longer exist. |
  | **Evaluativism** (Badness = Representation of Damage as Bad) | **PASS.** Asymbolics sense damage but do not *evaluate* it as bad. Hence, no badness. | **PASS.** The evaluation occurred at the time of the event; its badness is historical fact. | **FAIL/COST.** Requires cognitive capacity to represent state as "bad." May imply fish/infants do not suffer, only sense. | **The Comparative Sentience Commitment.** Risks excluding non-conceptual beings from the sphere of suffering. |

  ### Instructor's Note on the "Reflective Asymbolic" (Desideratum 2)
  Pay close attention to how theories handle the patient who *judges* the pain is bad but *feels* no aversion.
  *   **Subjectivist theories** (Badness = Aversion) must say the pain is *not* bad, contradicting the patient's own reflective judgment.
  *   **Objectivist theories** (Badness = Damage/Evaluation) can say the pain *is* bad, aligning with the judgment, but must explain why the motivational "push" is missing.
  *   **This case is the tie-breaker** between accounts that ground badness in *concern* versus accounts that ground it in *nature*.
