  My stats study group has been reading a pop-econ blog post about the value of information, and it sums up Good's theorem like this: 'Good's theorem proves that information can never make you worse off. If you get to act after seeing a signal instead of before, your expected payoff weakly goes up. The proof is trivial: the informed you can always just ignore the signal and do what the uninformed you would have done, so having the option to react can only help. This is why rational agents should always gather more information before deciding, and why the expected value of running any experiment is non-negative. And since the theorem holds for any agent with any beliefs, as long as they act consistently, it's about as close to an a priori truth as decision theory gets.' I mostly buy this and honestly it seems hard to argue with the "you can always ignore the signal" part, but one person in the group swears the last two sentences are where the blog sneaks things in. Help me out here. Go through the blog's summary sentence by sentence and tell me which parts a decision theorist would accept as stated, which parts are subtly off (and how they'd restate them), and whether the "close to an a priori truth" claim survives once you fix the earlier bits. I'm also curious whether there are real situations where getting information genuinely hurts you that don't just come from paying a cost for it, and whether those are counterexamples to the theorem or to the blog's gloss of it.

  Format the answer with these sections, in this order:

  1. "The short version" — 2-3 sentences giving your overall verdict on the blog's summary up front.
  2. "Sentence by sentence" — the bulk of the answer, maybe 400-600 words, taking the blog's sentences one at a time, flagged as fine / subtly off / wrong, with brief reasons.
  3. "Where the theorem actually ends and the gloss begins" — around 100-150 words on the gap between what Good proved and what the blog concluded from it.
  4. "Can information really hurt you?" — 150-250 words on the cases (no cost involved), and whether they're counterexamples to the theorem or to something else.
  5. "My verdict" — 2-4 sentences on how much a reader should take away from the blog post.

  Also, one quirk of my study group: we've agreed the informed you always gets to keep the ex ante best option, so if you think that framing is itself part of the problem, say so explicitly in the sentence-by-sentence section rather than letting it slide.
