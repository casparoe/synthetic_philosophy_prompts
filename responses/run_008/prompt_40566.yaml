answer: |-
  # Discussion Handout: Mapping the Post-Gettier Landscape
  **Course:** [Course Name] | **Section:** [Section Number]
  **Topic:** Diagnosing Knowledge (Cases → Positions)

  ### Instructions
  Do not worry about the names of the theories (e.g., "Reliabilism," "Virtue Epistemology"). This handout is designed to locate your *intuitions* about specific cases. Follow the decision tree below. Your path will lead you to a specific cluster of commitments. The "Position Labels" at the end are provided only for your further reading.

  ---

  ### Part 1: The Five Diagnostic Cases
  *Read these summaries carefully. Your answers in the tree should be based on these specific descriptions.*

  1.  **Canonical Gettier (Sheep in the Field):** You look at a field and see a rock that looks like a sheep. You form the belief "There is a sheep in the field." Unbeknownst to you, there is a real sheep hidden behind the rock. Your belief is Justified and True.
  2.  **Fake Barn Country:** You drive through a county where, unknown to you, nearly all structures that look like barns are papier-mâché fakes. You stop in front of the one real barn and form the belief "That is a barn." Your perception is functioning perfectly; you are just lucky to be facing the only real one.
  3.  **The Lottery:** You hold a ticket in a fair, massive lottery. The odds of losing are 99.999%. You form the belief "My ticket will lose" based solely on these odds. The draw happens, and you lose.
  4.  **Stuck Thermometer:** You check a thermometer to determine the room temperature. The thermometer is broken (the mercury is stuck), but by sheer coincidence, it is stuck at the exact current temperature. You form the belief "It is 70 degrees."
  5.  **Deviant Causal Chain:** A nervous assassin wants to kill a victim. The thought of killing makes him so nervous that his hand shakes, accidentally pulling the trigger, killing the victim. He believes "I killed the victim." The fact (he killed them) caused the belief, but in a weird, unintended way.

  ---

  ### Part 2: The Decision Tree

  **START:** Consider **Case 1 (Canonical Gettier)**.
  Does the subject have **Knowledge**?

  *   **YES:** → Go to **Leaf A**.
  *   **NO:** → Proceed to Question 2.

  **Q2:** Consider **Case 2 (Fake Barns)**.
  (Note: In this case, the subject makes *no* inference from a false premise. They simply see the barn.)
  Does the subject have **Knowledge**?

  *   **YES:** → Go to **Leaf B**.
  *   **NO:** → Proceed to Question 3.

  **Q3:** Consider **Case 5 (Deviant Causal Chain)**.
  The fact believed *did* cause the belief, but the chain was accidental.
  Is the *mere existence* of a causal connection sufficient for Knowledge, or must the chain be "appropriate"?

  *   **Mere connection is enough (Yes, they have K):** → Go to **Leaf C**.
  *   **Chain must be appropriate (No, they lack K):** → Proceed to Question 4.

  **Q4:** Consider **Case 3 (The Lottery)**.
  Imagine the ticket *had* won (a nearby possibility). Would the subject still have believed it would lose (based on the odds)?
  *   **Yes, they would still believe it.**
      *   Does this failure to "track the truth" (Sensitivity) explain why it isn't Knowledge?
          *   **YES:** → Go to **Leaf D**.
          *   **NO:** → Proceed to Question 5.

  **Q5:** Consider **Case 4 (Stuck Thermometer)**.
  The belief is true and safe in this specific instance, but the *method* (the broken thermometer) is globally unreliable.
  Does the global unreliability of the method rule out Knowledge, even if this specific belief couldn't easily have been false?

  *   **YES (Method reliability is key):** → Go to **Leaf E**.
  *   **NO (Focus on this specific instance's security):** → Proceed to Question 6.

  **Q6:** Tie-Breaker: **Ability vs. Security**.
  Imagine a subject who uses a highly reliable instrument (like a working thermometer) to form a true belief, but they have no understanding of how the instrument works (they just trust it blindly).
  Is the lack of personal *competence/ability* enough to deny Knowledge, even if the belief is perfectly secure (Safe)?

  *   **YES (Competence is required):** → Go to **Leaf F**.
  *   **NO (Security is sufficient):** → Go to **Leaf G**.

  **Q7 (Alternative Path):** If at any point you felt that no combination of conditions (Justification, Truth, Causation, Reliability) could successfully define Knowledge without counterexamples:
  *   → Go to **Leaf H**.

  ---

  ### Part 3: The Leaves (Your Position)

  **Leaf A: The Skeptic of Intuition / Contextualist**
  *   **Commitment:** You accept that Canonical Gettier cases *are* Knowledge (or that "knows" shifts meaning). You reject the starting assumption of the post-Gettier project.
  *   **Common Labels:** Contextualism, Deflationism about Gettier Intuitions.

  **Leaf B: The No-False-Lemmas Theorist**
  *   **Commitment:** You deny Knowledge in Canonical Gettier (because of the false lemma "that is a sheep") but grant Knowledge in Fake Barns (because no inference was made).
  *   **Common Labels:** No-False-Lemmas (NFL), Ruling Out Falsehoods.
  *   **Note:** This view is widely considered refuted by Fake Barns, but your intuitions align with its original motivation.

  **Leaf C: The Pure Causal Theorist**
  *   **Commitment:** You believe a causal connection between fact and belief is sufficient for Knowledge, even if the chain is deviant.
  *   **Common Labels:** Naive Causal Theory.
  *   **Status:** **Logical Space Warning.** This position is rarely occupied in contemporary literature. Most agree deviant chains preclude knowledge. If you are here, you hold a view that is generally considered **unattractive** because it grants knowledge in cases of accidental coincidence.

  **Leaf D: The Subjunctive Tracker**
  *   **Commitment:** You deny Knowledge in Lottery cases because the belief is *Insensitive* (it would be held even if false). You prioritize counterfactual tracking over reliability or safety.
  *   **Common Labels:** Sensitivity Theory (Nozick).
  *   **Note:** This view often struggles to explain why Fake Barns is *not* knowledge (since Henry's belief is often sensitive), so check if your Q2 answer is consistent with this leaf.

  **Leaf E: The Process Reliabilist**
  *   **Commitment:** You deny Knowledge in Stuck Thermometer cases because the *type of process* is unreliable, regardless of the specific outcome's accuracy.
  *   **Common Labels:** Simple Reliabilism (Goldman).
  *   **Note:** This separates you from those who focus only on the specific belief's modal security.

  **Leaf F: The Virtue Epistemologist**
  *   **Commitment:** You deny Knowledge when the truth is not creditable to the agent's intellectual abilities (even if the belief is Safe). You require the truth to be *because of* the agent's competence.
  *   **Common Labels:** Virtue Epistemology (Sosa, Greco), Anti-Luck Virtue Theory.
  *   **Note:** This distinguishes you from pure Modal theorists (Leaf G).

  **Leaf G: The Modal Security Theorist**
  *   **Commitment:** You deny Knowledge in Gettier/Barns cases because the belief could easily have been false (Unsafe), but you do not require the truth to be grounded in the agent's specific ability. Mere modal security suffices.
  *   **Common Labels:** Safety Theory (Sosa, Pritchard), Anti-Luck Epistemology.
  *   **Note:** See "Entanglement Warning" below.

  **Leaf H: The Primitivist / Deflationary Analyst**
  *   **Commitment:** You believe the Gettier literature demonstrates that no informative *analysis* of Knowledge (in terms of other concepts) is possible. Knowledge is either primitive or the concept is too messy for analysis.
  *   **Common Labels:** Knowledge-First (Williamson), Deflationary Pluralism.

  ---

  ### Part 4: Important Caveats for the TA

  #### 1. The Safety vs. Virtue Entanglement
  **Problem:** The five fixed cases provided in this tree often yield the same verdict for **Safety (Leaf G)** and **Virtue (Leaf F)** theories. Both deny knowledge in Barns, Thermometer, and Gettier cases.
  **Diagnosis:** If a student lands in Leaf G or F based *only* on the five cases above, their position is under-determined.
  **Resolution:** To separate these, you must introduce a **Temp Agency Case**:
  *   *Case:* An agent reads a reliable thermometer they do not understand and cannot verify.
  *   *Virtue View:* Denies Knowledge (Truth is not creditable to agent's ability).
  *   *Safety View:* Grants Knowledge (Belief could not easily have been false).
  *   *Instruction:* If a student cannot distinguish these, assign them the "Temp Agency" case as homework to see if they prioritize **Modal Security** or **Agential Credit**.

  #### 2. Empty Logical Space
  **Combination:** *Yes Knowledge in Canonical Gettier* BUT *No Knowledge in Fake Barns*.
  **Status:** **Incoherent / Unexplored.**
  **Reasoning:** If one accepts that "luck" in the Canonical case (Sheep) is compatible with Knowledge, it is difficult to explain why "environmental luck" in Fake Barns is not. Both involve a disconnect between justification and truth. A student holding this combination likely has unstable intuitions about the nature of luck.

  **Combination:** *No Knowledge in Stuck Thermometer* BUT *Yes Knowledge in Lottery*.
  **Status:** **Unattractive.**
  **Reasoning:** Both cases involve high statistical probability without causal contact or reliable mechanism. Granting Knowledge in Lottery while denying it in Thermometer suggests an inconsistency in how the student treats statistical evidence versus broken mechanisms. Most theories treat these similarly (either both K or both No K).

  #### 3. The Causal Theory Gap
  **Note:** Classic Causal Theories (Leaf C path) often struggle to distinguish Fake Barns from Veridical Perception without importing Reliabilist constraints. If a student identifies as a "Causal Theorist" but denies Knowledge in Fake Barns, they are likely holding a **Hybrid View** (Causal + Reliabilist). Encourage them to identify which constraint is doing the work in Barns: the *lack of causal history* or the *unreliability of the environment*.
