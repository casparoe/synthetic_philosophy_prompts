prompt: |-
  A student in my intro ethics section (engineering major, refreshingly blunt about this stuff) brought an argument to office hours that she says occured to her during a semester abroad, and it's been living rent-free in my head since. The setup: she spent last fall in Lisbon, where nobody queues the way we do -- or rather everybody queues by a different logic, a sort of cloud near the counter in which whoever is most ready to order wins -- and when she got back to the States and dutifully took her place at the back of the line, she started wondering whether she was doing anything morally required or just performing a habit with extra steps. Her argument: (1) a genuine moral obligation binds anyone in the same situation, not merely people who happen to share some local convention; (2) whether you're obligated to tip, queue, wait for the walk signal, and so on depends entirely on which side of a border you're standing on -- same act, opposite valence in Osaka versus New York; (3) so if skipping the tip or cutting the line is genuinely wrong here, there has to be something wrong-making about the act itself, independent of the convention; (4) but there isn't -- strip away the convention and the non-tipper does no describable harm, nobody is worse off than in the nearest convention-free world; (5) so everyday conventions generate no obligations at all; (6) therefore visitors are free to jaywalk in Tokyo and shoulder straight to the front of the Paris bakery line, and locals who never consented to the convention (who does?) are in the same boat.

  Here's what's bugging me. The argument looks valid, and (6) applied to driving on the left in the UK is monstrous -- driving the wrong way through Piccadilly is a bit more than a faux pas, and it stays monstrous even though its wrongness is convention-relative in exactly the way (4) says nothing can be. The thing also seems to generalize: whether you must keep a promise depends on a contingent social practice, and the wrong of breaking one isn't independent of that practice, so by the same reasoning promises don't bind either. My student accepted that consequence with alarming cheerfulness -- promissory obligation, she says, is just coordinated expectation management, and the felt "obligation" is leftover guilt. I don't want to follow her there. But I can't find the flaw on my own: (1) looks like a perfectly decent reading of moral universalism, (2) through (4) look like plain sociology, and rejecting (1) seems to land me in the opposite problem -- if obligations can be geographically indexed, I can't figure out whether that means no convention is beyond criticism or none can be criticized, and I keep going back and forth.

  So: which step do I give up, why did it look fine, and what am I paying for it? I'd like to keep the intuition that the queue binds you, the left-hand rule binds you, and the promise binds you, while still being able to say the unjust local convention (pick your favorite) doesn't. Is there a principled place to stand where that's possible, or does fixing the argument for the queue by brute force just hand the relativist everything else? And if the trick is hiding in (1)'s phrase about being "in the same situation," I'd want to know exactly which situations count as the same.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** An intro ethics professor is troubled by a student's argument regarding moral obligations and social conventions (queuing, tipping, traffic rules, promises).
      *   **The Student's Argument (Reconstructed):**
          1.  *Universalism Premise:* Genuine moral obligations bind anyone in the *same situation*, regardless of local convention.
          2.  *Convention Dependence:* Whether acts like queuing/tipping are obligatory depends entirely on location/convention (same act, different valence).
          3.  *Independence Requirement:* If an act is genuinely wrong, there must be something wrong-making about the act *itself*, independent of convention.
          4.  *Harmlessness Premise:* Strip away the convention, and the act (e.g., not tipping, cutting) causes no describable harm/non-conventional wrong.
          5.  *Conclusion 1:* Everyday conventions generate *no* obligations.
          6.  *Conclusion 2:* Visitors and non-consenting locals are free to ignore conventions (jaywalking in Tokyo, cutting in Paris).
          7.  *Generalization:* This applies to promises too (promissory obligation is just expectation management).
      *   **The Professor's Intuition:** This leads to monstrous results (driving on the wrong side in the UK) and undermines promises. The professor wants to save the binding nature of queues, traffic rules, and promises, while still allowing for criticism of *unjust* conventions.
      *   **The Core Question:** Which step to give up? Why did it look fine? What is the cost? Where is the principled distinction between binding conventions (queues, promises) and unjust ones? specifically regarding premise (1) and "same situation."

  2.  **Deconstruct the Student's Argument:**
      *   *Premise (1):* "A genuine moral obligation binds anyone in the same situation, not merely people who happen to share some local convention."
          *   *Critique:* This is the weak link. It assumes a specific definition of "situation." If "situation" includes the social context/convention, then (1) is compatible with convention-relative obligations. If "situation" means only physical/natural facts, then (1) begs the question against conventionalism.
      *   *Premise (2):* "Whether you're obligated... depends entirely on which side of a border you're standing on."
          *   *Critique:* Mostly true for traffic/queuing, but "entirely" is strong. There might be underlying principles (fairness, safety) that explain *why* the convention exists.
      *   *Premise (3):* "So if skipping the tip... is genuinely wrong here, there has to be something wrong-making about the act itself, independent of the convention."
          *   *Critique:* This is the crux. It assumes moral realism requires act-types to be wrong *in isolation*. But many philosophers (Hume, Rawls, Searle) argue that institutional facts create moral facts. The "wrong-making feature" *is* the violation of a fair cooperative scheme.
      *   *Premise (4):* "Strip away the convention and the non-tipper does no describable harm."
          *   *Critique:* This is a counterfactual error. We don't live in a convention-free world. The harm is to the *system* of coordination, not necessarily a specific individual in a vacuum. It ignores the "free rider" problem.
      *   *Premise (5) & (6):* Conclusions follow from the above.

  3.  **Identify the Philosophical Levers:**
      *   **Humean Conventionalism:** Justice and obligations arise from conventions necessary for social utility.
      *   **Rawls' Practice Conception of Rules:** Rules define the practice; you can't opt out while benefiting.
      *   **Fairness/Principle of Fair Play:** If you benefit from a cooperative scheme, you are obligated to do your part.
      *   **Scanlonian Contractualism:** Principles no one could reasonably reject.
      *   **Searle's Institutional Facts:** "X counts as Y in context C."

  4.  **Formulate the Response Strategy:**
      *   **Validate the Student:** Acknowledge the argument is sharp and touches on deep meta-ethical issues (Universalism vs. Relativism, Naturalism vs. Institutionalism).
      *   **Target Premise (1) and (3):** The definition of "situation" and the nature of "wrong-making features."
      *   **The "Same Situation" Fix:** The "situation" *includes* the convention. Driving on the left in London *is* a different situation than driving on the left in New York because the *expectations and risks* are different.
      *   **The "Harm" Fix (Premise 4):** The harm isn't physical injury in a vacuum; it's the erosion of a cooperative scheme (Free Rider Problem).
      *   **Distinguishing Just vs. Unjust Conventions:** How to keep the queue binding but allow criticism of unjust laws? Use the *purpose* of the convention (coordination/fairness vs. oppression).
      *   **Promises:** Address the student's cheerfulness about promises. Promises are the *archetype* of convention-based obligation (Rawls/Practice View).

  5.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Validate the professor's unease. The student is channeling Hume and early Wittgenstein but missing the "Practice" turn.
      *   *The Flaw:* It's in (1) and (3). The student assumes moral properties must attach to *physical* acts (moving body through space) rather than *social* acts (violating an expectation).
      *   *Reframing "Situation":* "Same situation" must include the normative context. Cutting a line in Lisbon vs. NYC involves different expectations. Therefore, universalism is preserved *if* the situation is described fully.
      *   *The "Wrong-Making Feature":* It's not "harm" in a utilitarian vacuum. It's *unfairness*. The Principle of Fair Play (Hart/Rawls). If you benefit from the order the line provides, you must uphold it.
      *   *The Traffic Example:* Driving on the left in the UK is dangerous *because* of the convention. The convention creates the safety. Violating it creates risk. That's a non-conventional harm (safety) generated by a conventional rule.
      *   *Promises:* The student is right that promises rely on practice, but wrong that this makes them optional. The practice *creates* the obligation. To say "I didn't consent" ignores that participating in the language game of promising *is* consent.
      *   *Unjust Conventions:* How to distinguish? A queue coordinates for efficiency/fairness. A segregation law coordinates for oppression. The *end* of the practice matters. The obligation to follow unjust conventions is weaker or non-existent because they fail the "mutual benefit" test of the Fair Play principle.
      *   *Conclusion:* Give up the idea that obligations must be "convention-independent." Embrace "Institutional Moral Facts."

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does this concede too much to relativism?* No, because the *principle* (Fairness/Coordination) is universal. The *application* is local. This is "Universalism about principles, Relativism about rules."
      *   *What about the "Consent" issue in (6)?* The student says locals never consented. Need to address tacit consent or the Fair Play principle which doesn't require explicit consent, just acceptance of benefits.
      *   *Make sure to address the "Harm" premise specifically.* The student claims no harm in a convention-free world. That's irrelevant. We live in *this* world. The counterfactual is a distraction.

  7.  **Final Polish:** Structure it clearly.
      1.  Diagnose the specific error (Category Mistake).
      2.  Fix Premise (1) (The "Thick Description" of situations).
      3.  Fix Premise (4) (The Free Rider/Harm to System).
      4.  Address Promises (Practice Conception).
      5.  Distinguish Just vs. Unjust (The "Point" of the Practice).
      6.  Summary advice for the office hours.

  8.  *(Final check against user prompt)*: The user asks "Which step do I give up, why did it look fine, and what am I paying for it?" and "Is there a principled place to stand?" I need to answer these directly.
      *   *Give up:* The idea in (3) that wrong-making features must be *pre-conventional*.
      *   *Why it looked fine:* Because of a naturalistic bias (only physical facts are real).
      *   *Cost:* You have to accept that social facts are real facts.
      *   *Principled place:* The Principle of Fair Play + Practice Conception of Rules.

  9.  **Constructing the Output:** (Proceed to generate response based on these thoughts.)
answer: |-
  This is a fantastic student. She has independently rediscovered a version of the "Argument from Queuing" that has occupied moral philosophers from Hume to Rawls to Scanlon. Her argument is valid, but it is unsound because it relies on a category mistake about what constitutes a "situation" and what constitutes "harm."

  You do not need to abandon moral universalism, nor do you need to accept that promises are illusory. However, you do have to give up a specific, seductive intuition about the *source* of moral weight.

  Here is the diagnosis of the argument, the specific step to reject, and the principled ground you can stand on to distinguish the queue from unjust laws.

  ### The Flaw: Premise (3) and the Definition of "Situation"

  The student's argument hinges on **Premise (3)**: *"If skipping the tip... is genuinely wrong here, there has to be something wrong-making about the act itself, independent of the convention."*

  This looks fine because it appeals to a naturalistic intuition: moral facts should be like physical facts (e.g., fire burns regardless of what you think). But this is a category mistake. It assumes that the "act" is defined purely physically (moving one's body ahead of other bodies) rather than socially (violating a legitimate expectation).

  **Why it looked fine:** It relies on a "view from nowhere" moral realism. It assumes that for an obligation to be real, it must exist in a state of nature.
  **What you pay to give it up:** You must accept **Institutional Moral Facts**. You have to acknowledge that some moral obligations are *constituted* by social practices, not merely regulated by them.

  ### Fixing Premise (1): The "Thick" Situation

  The student's **Premise (1)** states: *"A genuine moral obligation binds anyone in the same situation."* She assumes "situation" means *physical circumstances* (location, number of people, hunger levels).

  You should argue that a moral "situation" includes the **normative context**.
  *   **Situation A:** Standing behind people in New York, where there is a shared understanding of first-come-first-served.
  *   **Situation B:** Standing behind people in Lisbon, where there is a shared understanding of a "cloud" system.

  These are **not the same situation**. In Situation A, cutting creates a specific set of expectations and frustrations that do not exist in Situation B. Therefore, a universal principle can bind everyone *in the same situation* (including the normative context) without requiring the rule to be the same across borders.

  **The Universal Principle:** "Do not violate legitimate cooperative expectations from which you benefit."
  *   In NYC, the queue creates the expectation.
  *   In Lisbon, the cloud creates the expectation.
  *   The *principle* is universal; the *rule* is local.

  ### Fixing Premise (4): The Harm is to the System

  The student's **Premise (4)** claims: *"Strip away the convention and the non-tipper does no describable harm."*

  This is a counterfactual red herring. We do not live in a convention-free world. The relevant comparison is not "tipping vs. no convention," but "tipping vs. *breaking the convention while others keep it*."

  This is the **Free Rider Problem**.
  *   **The Harm:** When you cut the line, you aren't just moving your body; you are extracting a benefit (saving time) that is only available because everyone else is restraining themselves. You are undermining the stability of a cooperative scheme that benefits everyone.
  *   **The Wrong-Making Feature:** It is **unfairness**, not physical injury. The "harm" is the erosion of trust and the exploitation of others' restraint. This harm is real, describable, and exists *because* of the convention, but it is not *independent* of it.

  ### Addressing the Promises Objection

  Your student is channeling a Humean skepticism about promises. She says promissory obligation is just "coordinated expectation management."

  **She is right, but she draws the wrong conclusion.**
  According to the **Practice Conception of Rules** (articulated by John Rawls in "Two Concepts of Rules"), the practice of promising *creates* the obligation. You cannot have the obligation without the practice, just as you cannot score a goal without the game of soccer.
  *   To say "I didn't consent to the practice of promising" is incoherent if you are using language to communicate. By engaging in the speech act of "I promise," you are invoking the practice.
  *   The obligation isn't "leftover guilt"; it is the logical cost of participating in a system designed to allow reliance. If everyone opted out when inconvenient, the system would collapse, and no one could rely on anyone (a universalizable failure).

  ### Distinguishing Just vs. Unjust Conventions

  This is your biggest worry: *If conventions bind, do unjust laws bind?*

  You can distinguish the Queue/Traffic from Unjust Laws using the **Principle of Fair Play** (Hart/Rawls). An obligation to follow a convention arises when:
  1.  The practice is mutually beneficial (or at least not exploitative).
  2.  The burdens are distributed reasonably.
  3.  You voluntarily accept the benefits of the practice.

  **The Queue/Traffic:**
  *   **Purpose:** Coordination and safety/efficiency.
  *   **Benefit:** Mutual. Everyone waits less/worse if everyone cheats; everyone waits less/better if everyone follows the rule.
  *   **Verdict:** Binding.

  **Unjust Conventions (e.g., Segregation, Bribery):**
  *   **Purpose:** Oppression or exclusion.
  *   **Benefit:** Asymmetric. One group benefits at the expense of another.
  *   **Verdict:** Not binding (and potentially a duty to break).

  This allows you to say: "You must queue in NYC because it is a fair cooperative scheme. You do not have to follow a law that requires you to oppress others, because that fails the mutual benefit test."

  ### Summary for Office Hours

  Here is how you can frame this to the student without brute force:

  1.  **Concede the Meta-Ethics:** Agree that there is no "moral particle" attached to the physical act of walking forward. She is right that the wrongness is convention-relative.
  2.  **Challenge the "Independence" Requirement:** Argue that Premise (3) sets an impossible bar. *All* institutional obligations (games, language, money, promises) depend on conventions. That doesn't make them fake; it makes them **social facts**.
  3.  **Introduce Fairness:** The obligation to queue isn't about the *line*; it's about the *people in it*. Cutting is wrong because it exploits their restraint. That is a universal wrong (unfairness), even if the specific rule (line vs. cloud) is local.
  4.  **The Traffic Rebuttal:** Driving on the left in the UK isn't wrong because "left is bad." It's wrong because it creates a high risk of physical harm *given the expectations of others*. The convention creates the safety; violating it creates the danger. The harm is real, even if the rule is arbitrary.
  5.  **The Promise Trap:** Tell her that if promises don't bind, then her argument doesn't bind either. She is making a promise to the truth of her premises. If promissory obligation is just "guilt," why should you believe her? She needs the practice of promising to be real to make her argument.

  **The Principled Place to Stand:**
  Adopt **Universalism about Principles, Conventionalism about Rules.**
  *   **Universal Principle:** " Uphold fair cooperative schemes from which you benefit."
  *   **Local Rule:** "In NYC, that means queuing. In Lisbon, that means clouding. In the UK, that means driving left."

  This saves the queue, saves the promise, saves the traffic rule, and allows you to condemn unjust conventions (which fail the "fair cooperative scheme" test). The student's error was thinking that because the *rule* is local, the *obligation* must be fake. The obligation is real; it just attaches to the local rule via the universal principle of fairness.
