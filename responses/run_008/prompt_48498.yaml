answer: |-
  ### The Underlying Rule: Information-Theoretic Continuity

  Your friend's verdicts are not a patchwork of medical exceptions; they are a rigorous application of **Information-Theoretic Death**, likely tempered by a secondary concession to biological organismal life.

  The core principle she is running is: **Death is the irreversible loss of the physical substrate encoding the specific identity or functional organization of the entity.**

  Conversely, **Life (or "Not Dead") is the state where that substrate remains intact enough for recovery *in principle*, even if current technology cannot achieve it.**

  Here is how this rule maps to her track record:
  *   **Brain Dead (Ventilator):** Substrate destroyed by ischemia/liquefaction. $\rightarrow$ **Dead.**
  *   **Cardiac Arrest (Cold/No CPR):** Substrate degraded by warm ischemia over time. $\rightarrow$ **Dead.**
  *   **PVS / Anencephaly:** Substrate (brainstem/organism) is structurally intact and functioning, even if higher cognition is absent. $\rightarrow$ **Alive.** (Note: She accepts biological organismal life as a valid state of "not dead," even if personhood is compromised).
  *   **Anesthesia:** Substrate intact; silence is functional, not structural. $\rightarrow$ **Alive.**
  *   **Skier / Nematode:** Metabolic function stopped, but cold preserved the structural substrate. Recovery was possible (and proven). $\rightarrow$ **Never Died.**

  This rule explains why she rejects the standard medical definition of death (cessation of function) in favor of a physicalist definition (destruction of structure).

  ---

  ### Predictions on the New Cases

  #### Case 1: The Cryopreserved Member
  **Verdict: Not Dead.**

  **Reasoning:** This is the direct analog to the **vitrified nematode**. In her framework, the skier "never died" because the cold preserved the structure during metabolic arrest. The cryopreserved patient is in the same state: metabolic arrest at liquid nitrogen temperature, with a perfusion report confirming structural integrity. To declare this patient "dead" would be to admit that the nematode was also dead, which would invalidate the premise of cryonics. She will argue that while the patient is not *metabolically alive*, they have not crossed the threshold of information-theoretic death. They are in a state of suspended continuity.

  #### Case 2: The Brain-Dead Patient with Hypothalamic Function
  **Verdict: Alive.**

  **Reasoning:** This case tests the boundary between "Whole Brain Death" and her structural rule. Standard medicine declares this patient dead based on the loss of *integrative* function. However, your friend's track record with the **anencephalic newborn** and the **PVS patient** shows she prioritizes the existence of *any* intact, functioning neural substrate over higher cognition or legal definitions.
  In Case 1 of her track record ("total and irreversible loss"), the verdict was Dead. In this new case, the loss is *not* total; the hypothalamus is osmoregulating. This proves that the brainstem infrastructure is not fully destroyed. Since the biological organism is maintaining homeostasis (a form of integration) and the structural destruction is incomplete, she will classify this as **Alive**, viewing the "brain death" diagnosis as a clinical proxy that has failed in this specific biological anomaly.

  ---

  ### Divergence of Principles

  Do the principles diverge on these cases? **Yes, but only on Case 1.**

  There are two candidate rules consistent with her history:
  1.  **Strict Information-Theoretic Rule:** You are not dead if your connectome/structure is recoverable in principle.
  2.  **Biological Organismal Rule:** You are not dead if your body maintains homeostatic integration (breathing, hormone regulation).

  *   **On Case 2 (Hypothalamus):** Both rules agree. The structure is partially intact (Rule 1), and the body is homeostatically regulating (Rule 2). Verdict: **Alive.**
  *   **On Case 1 (Cryopreservation):** The rules diverge.
      *   **Rule 1 (Info-Theory):** Says **Not Dead** (Structure preserved by vitrification).
      *   **Rule 2 (Biological):** Says **Dead** (No metabolism, no homeostasis, no spontaneous recovery).

  Because she is a devoted cryonicist, we know Rule 1 is her primary driver. She overrides the Biological Rule with the Information-Theoretic Rule when they conflict (as seen in the Skier/Nematode cases). Thus, she will verdict Case 1 as "Not Dead," revealing that for her, **structural potential trumps metabolic function.**

