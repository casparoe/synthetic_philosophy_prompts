  ### The Tie-Breaker Case

  To definitively prove which rule is dominant (and to test the limits of her "One Rule"), you should present her with a case that satisfies the Biological Rule but violates the Information-Theoretic Rule.

  **The Case:**
  > "A patient suffers a specific, rare toxin exposure. Their heart is beating, their lungs are breathing (on minimal support), and their hypothalamus is regulating hormones perfectly. However, the toxin has selectively scrambled the synaptic weights of the cerebral cortex—erasing all memory and personality—while leaving the neurons themselves physically alive and metabolically active. The connectome is destroyed, but the cells are not."

  **Why this tells the rules apart:**
  *   **Biological Organismal Rule:** Verdict = **Alive.** The organism is functioning, homeostasis is maintained, and cells are metabolizing. (Consistent with her Anencephaly/PVS verdicts).
  *   **Information-Theoretic Rule:** Verdict = **Dead.** The information encoding the *person* is irretrievably lost, even if the hardware is humming. (Consistent with her Cryonicist identity).

  **The Tell:**
  If she says **Alive**, her rule is ultimately grounded in **biological organismal continuity**, and her cryonicism relies on the hope of *restoring* biology to a dead structure. If she says **Dead**, her rule is strictly **information-theoretic**, and her verdicts on Anencephaly/PVS were merely concessions to the fact that in those cases, the *potential* for information processing (however minimal) remained intact. Given her devotion, my bet is she will hesitate, then say **Dead**, confirming that *information* is the soul of her definition.
