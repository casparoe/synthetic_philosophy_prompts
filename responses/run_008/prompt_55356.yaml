answer: |-
  Your TA is reciting a slogan from **Classical Emotivism**, a mid-20th-century metaethical theory associated with A.J. Ayer and C.L. Stevenson. While this view is historically important, using it as a conversation-stopper in a contemporary metaethics context is intellectually lazy. The slogan conflates several distinct philosophical claims, some of which are false, and most of which face the exact problem you raised (known as the **Frege-Geach problem**).

  Here is a breakdown of the distinct precise theses that slogan could stand for, evaluated by your criteria.

  ### 1. Semantic Non-Cognitivism
  *   **The Claim:** Moral sentences (e.g., "Eating meat is wrong") do not have truth conditions. They are not the kind of linguistic items that *can* be true or false, unlike descriptive sentences ("Meat consumption is rising").
  *   **Status:** **Substantive and Defensible.** This is a serious semantic hypothesis. It is not trivial because moral sentences *look* grammatically like fact-stating sentences (subject-predicate form). Claiming they function differently requires argument.
  *   **The Embedding Problem:** **Fails.** This is the core of your objection. If "wrong" doesn't contribute to truth conditions, it is unclear what the antecedent of a conditional means in: *"If eating meat is wrong, then buying meat is wrong."* You cannot say "If [no truth condition]..." Logic requires that the term "wrong" means the same thing in the conditional as it does in the assertion. Classical non-cognitivism struggles to explain how valid inference works if moral sentences aren't propositions.
  *   **Licenses TA's Dismissal?** **Yes.** If there are no truth conditions, there is no proposition to contradict. Therefore, two people aren't disagreeing about a *fact*. However, this comes at the high cost of making moral logic inexplicable.

  ### 2. Simple Emotivism (The "Boo/Hooray" Theory)
  *   **The Claim:** The *meaning* of a moral sentence is identical to an emotional exclamation. "Eating meat is wrong" literally means "Boo, eating meat!"
  *   **Status:** **False.** This is a caricature of metaethics. Moral language allows for negation, quantification, and embedding ("It is not the case that...", "For all actions..."). Exclamations like "Boo!" do not. Reducing complex normative syntax to animalistic noise is linguistically untenable.
  *   **The Embedding Problem:** **Fails Miserably.** "If boo, eating meat!" is nonsense. It cannot account for the validity of modus ponens in moral arguments.
  *   **Licenses TA's Dismissal?** **Yes.** If I say "Boo!" and you say "Hooray!", we aren't disagreeing about the world; we are just making different noises. But since the thesis is false, this license is illegitimate.

  ### 3. Psychological Expressivism
  *   **The Claim:** The primary psychological state expressed by a moral judgment is conative (an attitude, desire, or plan) rather than cognitive (a belief). To judge "X is wrong" is to have a negative attitude toward X.
  *   **Status:** **Substantive and Defensible.** This is a plausible theory of moral psychology (often tied to the Humean Theory of Motivation). It explains why moral judgments seem to motivate action more directly than neutral facts.
  *   **The Embedding Problem:** **Neutral/Irrelevant.** This is a claim about *minds*, not *sentences*. Even if moral judgments *are* attitudes, the *sentences* we use to report them might still function as truth-apt descriptions of those attitudes. This thesis alone doesn't fix the semantic problem of conditionals.
  *   **Licenses TA's Dismissal?** **No.** Two people can have inconsistent attitudes. If I desire that no one eats meat, and you desire that people do eat meat, our attitudes are in conflict. We *are* disagreeing, just not in the way we disagree about the weather. The TA cannot use this to say there is *no* disagreement.

  ### 4. Quasi-Realist Expressivism (The Charitable Reading)
  *   **The Claim:** (e.g., Simon Blackburn, Allan Gibbard). Moral sentences express attitudes, *but* the language is sophisticated enough to "earn the right" to talk about truth, facts, and disagreement *as if* they were realists. We construct a logic of attitudes that mimics the logic of beliefs.
  *   **Status:** **Substantive and Defensible.** This is the dominant form of expressivism today. It attempts to solve the Frege-Geach problem by defining logical consistency in terms of consistency of attitudes rather than truth conditions.
  *   **The Embedding Problem:** **Solved (by stipulation).** Quasi-realists argue that "If lying is wrong..." expresses a higher-order attitude: a disapproval of disapproving of lying while approving of getting your brother to lie. It preserves the validity of inference.
  *   **Licenses TA's Dismissal?** **No.** In fact, it explicitly **forbids** the TA's dismissal. A Quasi-Realist *must* explain how moral disagreement is genuine. They argue that disagreement is a clash of practical stances, not just a "boo/cheer" noise. If the TA were a Quasi-Realist, she would be obligated to engage with your question about the nature of that disagreement, not dismiss it.

  ### 5. Error Theory (Moral Nihilism)
  *   **The Claim:** Moral sentences *try* to describe facts, but they all fail because no moral facts exist. "Eating meat is wrong" is a proposition, but it is strictly false (like "The present King of France is bald").
  *   **Status:** **Substantive and Defensible.** (Associated with J.L. Mackie). This is a cognitivist view (sentences have truth values) but an ontologically nihilist one.
  *   **The Embedding Problem:** **Handled.** Since sentences are propositions, they embed in conditionals perfectly well. "If eating meat is wrong (false), then..." works logically.
  *   **Licenses TA's Dismissal?** **Sort of.** If both of you are asserting falsehoods, you aren't disagreeing about the *truth* (since neither has it). However, you are still disagreeing about *what you believe*. The TA's claim that you aren't "stating anything" is false here; you are stating things, they are just all false.

  ---

  ### The Verdict on Your TA

  Your TA is likely relying on **Thesis 2 (Simple Emotivism)** or a crude version of **Thesis 1 (Semantic Non-Cognitivism)**.

  1.  **Why the dismissal is unwarranted:** Even if Simple Emotivism were true, it doesn't mean there is *nothing* to discuss regarding disagreement. It just means the disagreement is attitudinal rather than factual. Dismissing the question implies the disagreement is illusory. But if I want you to stop eating meat and you want to continue, we have a practical conflict that needs resolution. Metaethics is supposed to explain that conflict, not wave it away.
  2.  **The Embedding Trap:** Your intuition about conditionals ("If lying is wrong...") is the standard philosophical objection to the TA's slogan. By shutting down the question, she is avoiding the hardest part of her own position. A defensible expressivist *must* answer how "wrong" keeps its meaning inside a conditional.
  3.  **The "Triviality" Trap:** If the TA means "You aren't describing a *natural* fact" (like mass or velocity), that might be trivial or defensible. But if she means "You aren't describing *anything*," she is making a heavy semantic claim that requires defense, especially given the embedding problem.

  ### How to Respond

  You can go back to your TA with this precise distinction:

  > "I understand you are endorsing an expressivist view. However, are you endorsing **Simple Emotivism**, which claims moral sentences are literally equivalent to exclamations like 'Boo!'? If so, how do you account for the validity of moral arguments embedded in conditionals, since 'If Boo!' is nonsensical?
  >
  > Alternatively, are you endorsing **Quasi-Realism**? If so, that view claims we *can* make sense of moral disagreement and truth-apt language despite the underlying expressivism. If that's the case, dismissing my question about disagreement seems inconsistent with the view, since Quasi-Realism is specifically designed to explain how disagreement works without moral facts."

  **Summary:** The TA's one-liner is a **crude shorthand for Simple Emotivism**. As a precise thesis, it is **false** (due to the embedding problem). As a defense for dismissing the disagreement question, it is **unlicensed**, because even sophisticated versions of the theory (which are defensible) require explaining disagreement, not denying it exists. She is using a weak theory to avoid a hard question.
