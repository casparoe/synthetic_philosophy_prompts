          *   *Challenge:* Is this rational? Some say yes (egocentric bias is rational), some say no (arbitrary). I need to be honest here. This might be the verdict to overturn or nuance. Actually, in forecasting, "inside view" vs "outside view" matters. But for memory, it's usually accepted that I have access to my mental state they don't.

