prompt: |-
  ok so i've been going back and forth on peer disagreement for like two years and i figure the only way to make progress is to actually write down my gut verdicts and see if there's a principle behind them, instead of just vibes-matching to whichever essay i read last. hoping you can help. i want you to act like a professional epistemologist who also hangs out on forecasting/prediction-market forums, so you know both the formal lit and the messy practice of disagreeing with people and updating. please actually brainstorm a couple candidate principles before settling on one, and don't hand me the first thing that half-fits.

  here are my verdicts, all honest gut calls:

  - me and a friend i consider my epistemic equal both read the same studies on whether remote work tanked productivity. before comparing i'm at like 80% it did, she's apparently at 20%. verdict: i move toward the middle, but not all the way — i end up around 60/40ish, not 50/50.
  - same friend, but we do this exercise where we each write down credences on 30 unrelated questions and then compare. we disagree on a bunch of them. verdict: it feels crazy to split the difference on every single one. by the end i've moved a little on the aggregate but barely at all on most individual questions — i basically trust my 30-question average over hers.
  - a coworker who i know always ends up on the opposite side of me on anything remotely political — every time, on every topic, for years. she disagrees with me on some new political question. verdict: her disagreement barely moves me at all. it's like the disagreement carries almost no information because i saw it coming from a mile away.
  - a peer says step 3 in my math proof is invalid. verdict: i start out nearly fully confident in my proof, but if we talk it through for an hour, both fully understand each other, and she STILL thinks step 3 is broken — i get super unsure, almost to the point of deferring. one of us is just making a dumb mistake and usually talking finds it, so persistent disagreement after full disclosure feels like strong evidence against me.
  - someone who is flatly much better than me on a topic (think: a domain expert with a track record) disagrees with me. verdict: i mostly defer, like 80% of the way to their view.
  - the one i keep chewing on: i'm pretty sure i locked the door. my roommate, who is equally well positioned to know and whose memory is as good as mine, says it's definitely unlocked. verdict: i basically trust my memory over hers, like 85/15. and this feels DIFFERENT from the remote-work case even though structurally it looks the same — two people, roughly equal access to evidence, one-on-one disagreement.

  a couple of things i suspect but haven't nailed down:

  1. my tentative principle is something like "conciliate in proportion to how surprising the disagreement is, given what you know about how each of you formed your views." math-after-talking is very surprising (we share everything, one of us must have blundered) so lots of movement; predictable political disagreement is zero surprise so none; the door is somewhere in between?? but i can't tell if this actually reproduces my 60/40 on remote work, and it feels like it might just be a pile of post-hoc fudge factors.
  2. people keep telling me the whole debate secretly turns on whether you think evidence determines a unique rational credence — if it does, disagreement between epistemic equals is this weird anomaly that needs explaining away, but if evidence permissibly supports different credences, then my friend being at 20% isn't evidence against my 80% at all, and steadfastness is fine. does my verdict on the 30-questions case commit me to one side of that? because that case is where i'm least willing to move.
  3. i also vaguely remember that there's some famous theorem about agents who know each other's posteriors being unable to agree to disagree, which the rationalist side of my brain wants to wield like a hammer. does it actually apply to any of my cases, or do its assumptions (common priors or whatever) basically never hold between humans?

  so: is there one principle that gets all or most of my verdicts? if not, which ones have to go, and be honest — i'd rather overturn a verdict than get some baroque eight-clause principle that can fit anything. also please state clearly what the resulting principle predicts on cases i haven't listed, e.g., disagreeing with someone who was randomly assigned to argue the other side of a debate, or two forecasting models trained on the same data that spit out different numbers. and one big ask: throughout your answer, keep separate what's actually settled among people who know this literature (like the math of that agreement theorem, whatever its assumptions turn out to be) versus what is genuinely contested — as far as i can tell the field has live factions on whether you should split the difference at all, and i don't want a contested position presented to me as the consensus view. if you're not sure which side of that line something falls on, just say so.
