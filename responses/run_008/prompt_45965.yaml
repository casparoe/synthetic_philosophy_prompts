answer: |-
  ### Practice Exam Question

  **Question 1**
  David Lewis's 1976 triviality proof argues that no proposition expressed by an indicative conditional can satisfy the Equation ($P(A \to B) = P(B|A)$) across all probability functions defined over a Boolean algebra without collapsing probabilities into triviality (0 or 1). 

  In your study group, a colleague proposes the following escape route: Lewis's proof illicitly quantifies over *arbitrary* probability functions over the algebra. Perhaps the Equation is not a general logical truth valid for all functions, but merely a constraint on the credence function of a single, ideally rational agent at a specific time. If the Equation holds only for the agent's *actual* current credence function, and not for every function in the algebra, the proof should fail.

  Write an essay evaluating this proposal. Your answer must:
  1.  Reconstruct Lewis's argument sufficiently to identify exactly where it invokes probability functions other than the agent's initial credence function.
  2.  Determine whether restricting the Equation to a single agent's current credence blocks the proof, paying specific attention to the role of conditionalization and rational updating.
  3.  Briefly explain why counterfactual conditionals do not face the same triviality pressure.

  *(Time allowance: 60 minutes)*

  ***

  ### Model Answer

  Lewis's triviality result demonstrates that if indicative conditionals express propositions, and if the probability of those propositions always equals the corresponding conditional probability (the Equation), then agents can only hold non-trivial credences in very limited cases. The proposed escape suggests that Lewis's proof relies on quantifying over arbitrary probability functions, whereas the Equation might only constrain a single agent's actual credence function at a time. This escape fails because Lewis's argument requires only the agent's current credence and its rational updates via conditionalization, not arbitrary functions.

  To see this, we must reconstruct the proof's reliance on multiple functions. Lewis begins by assuming the Equation holds for a credence function $P$. By the Law of Total Probability, $P(A \to B)$ equals $P(A) \cdot P(A \to B | A) + P(\neg A) \cdot P(A \to B | \neg A)$. The term $P(A \to B | A)$ is equivalent to $P_A(A \to B)$, where $P_A$ is the function $P$ conditionalized on $A$. If the Equation holds for $P_A$, then $P_A(A \to B) = P_A(B|A)$. Since $P_A(A)=1$, $P_A(B|A)$ is 1 (assuming consistency). Thus, $P(A \to B | A) = 1$. Similarly, if the Equation holds for $P_{\neg A}$, the second term becomes 0. This yields $P(A \to B) = P(A)$. Combined with the original Equation ($P(A \to B) = P(B|A)$), this implies $P(B|A) = P(A)$, a triviality result.

  The crux of the objection is whether the Equation must hold for $P_A$ and $P_{\neg A}$. The objector claims these are "other" functions. However, in a Bayesian framework, $P_A$ represents the credence function of the *same* agent after they learn $A$. If the Equation is a norm of rationality for indicative conditionals, it must govern an agent's credences not just statically, but diachronically. To deny that the Equation holds for $P_A$ is to claim that a rational agent satisfies the Equation now, but becomes irrational immediately upon learning true evidence $A$. This is implausible. The proof does not require arbitrary algebraic functions; it requires only that the norm of rationality persists through rational updating. Therefore, restricting the Equation to "the agent's credence" does not block the proof, because the agent's future credence functions *are* the conditionalized versions of their current ones. The single-agent restriction buys nothing unless it denies that rational updating preserves the norms of conditional credence.

  Counterfactual conditionals avoid this pressure because the Equation is not assumed to hold for them. Standard semantics (e.g., Stalnaker-Lewis) analyze counterfactuals via similarity orderings of possible worlds, not epistemic conditional probability. It is coherent to assign low probability to "If Bizet had been Italian, he and Verdi would have been compatriots" despite high conditional probability, because truth conditions depend on closest possible worlds, not evidential support. Thus, triviality proofs targeting the Equation apply specifically to indicatives construed as probability-bearing propositions.

  In sum, the escape collapses. The triviality proof relies not on arbitrary functions, but on the diachronic rationality of a single agent. Since rational updating preserves the norms governing credence, the Equation cannot be restricted to a static snapshot without abandoning its status as a rational constraint.

  ***

  ### Marking Scheme

  **Total Marks: 100**

  **A Grade (Distinction: 70+)**
  *   **Proof Reconstruction (25 marks):** Correctly identifies that Lewis's proof uses the Law of Total Probability and requires the Equation to hold for $P_A$ (P conditionalized on A) and $P_{\neg A}$, not just $P$.
  *   **Evaluation of Escape (30 marks):** Explicitly argues that $P_A$ represents the *same* agent's rational update. Recognizes that if the Equation is a norm of rationality, it must apply diachronically. Concludes that the "single-agent" objection fails because it conflates "single function" with "static function."
  *   **Counterfactuals (15 marks):** Correctly notes that counterfactuals are not bound by the Equation (e.g., via similarity semantics vs. epistemic probability), avoiding triviality.
  *   **Clarity & Structure (10 marks):** Argument is tight, precise, and within word limits.

  **B Grade (Pass/Merit: 50-69)**
  *   **Proof Reconstruction (20 marks):** Reconstructs the general shape of the triviality argument but may be vague on the specific role of $P_A$ versus arbitrary functions.
  *   **Evaluation of Escape (20 marks):** Discusses the single-agent objection but fails to fully dismantle it. May treat the objection as plausible or miss the diachronic/conditionalization point. Might argue Lewis requires *arbitrary* functions without noting that conditionalized functions are a subset required by rationality.
  *   **Counterfactuals (10 marks):** Mentions counterfactuals are different but lacks precision on why (e.g., says "they are different" without mentioning semantics or probability links).
  *   **Clarity & Structure (10 marks):** Understandable but may lack philosophical precision.

  **C Grade (Fail/Borderline: <50)**
  *   **Proof Reconstruction (10 marks):** Recall-based summary of Lewis's conclusion without reconstructing the mechanism (Total Probability/Conditionalization).
  *   **Evaluation of Escape (10 marks):** Merely lists positions (e.g., "Lewis says X, Stalnaker says Y") without evaluating the specific logical objection raised in the prompt.
  *   **Counterfactuals (0-5 marks):** Omitted or incorrect.
  *   **Clarity & Structure (5 marks):** Disorganized or significantly over/under length.

  **Specific Differentiator:**
  The key distinction between an **A** and a **B** is the handling of conditionalization. An **A** answer recognizes that Lewis does not need *all* functions in the algebra, only those reachable by conditionalization, and that a single rational agent occupies all such functions over time. A **B** answer typically accepts the premise that Lewis needs "arbitrary" functions and argues against that, missing the point that rational updating generates the necessary functions internally.
