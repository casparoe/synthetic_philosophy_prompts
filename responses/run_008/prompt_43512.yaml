      *   My View: User is right. The friend ignores the *justification* for the quotient. In physics, we quotient gauge because of empirical redundancy (Aharonov-Bohm, etc.) or mathematical consistency (negative norm states). In metaphysics, the justification is principled (PII). Black challenges the principle, not the math. The math can accommodate either; the *reason* for choosing is the philosophical gap. Also, the definition of "observable" is at stake.

