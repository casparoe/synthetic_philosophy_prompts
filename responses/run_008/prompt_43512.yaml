  2.  **Deconstruct the Philosophical Debate:**
      *   **PII:** If $x$ and $y$ share all properties, $x = y$. (No distinct individuals without qualitative difference).
      *   **Black's Universe:** Two spheres, same intrinsic properties, symmetric relational properties (distance $d$ from each other). No external reference frame.
      *   **Leibniz's Defense:** Relational properties distinguish them (Sphere A is "left" of B, Sphere B is "right" of A? Or simply "distance from the other"). *Correction:* In Black's setup, "left/right" is meaningless without an external frame. The relation is symmetric ($d(A,B) = d(B,A)$). Leibniz usually argues God wouldn't create indiscernibles, or that space is relational so positions are defined by relations. Black blocks this by making the universe *only* the spheres.
      *   **Haecceity:** A non-qualitative property of "this-ness" that individuates $A$ from $B$ even if all qualitative properties match.

  3.  **Deconstruct the Physics Vocabulary:**
      *   **Configuration Space ($\mathcal{C}$):** The space of all field/particle configurations. Points are $\phi$.
      *   **Symmetry Group ($G$):** Acts on $\mathcal{C}$.
      *   **Gauge Symmetry:** Redundancy of description. Orbits are physical states. Physical space $\mathcal{P} = \mathcal{C}/G$. Observables must be $G$-invariant.
      *   **Global Symmetry:** Maps physical state to distinct physical state. Orbits are distinct states. Spontaneous Symmetry Breaking (SSB) picks a vacuum.
