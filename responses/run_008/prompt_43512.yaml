      *   *Symmetry:* The swap operation $\sigma: (S_1, S_2) \to (S_2, S_1)$. This is a $\mathbb{Z}_2$ action.
      *   *PII as Gauge Principle:* PII claims that if two points in $\mathcal{C}$ are related by $\sigma$, they represent the *same* physical state. Therefore, $\sigma$ is a gauge symmetry. The physical state space is $\mathcal{P} = \mathcal{C}/\mathbb{Z}_2$. There is only one point in $\mathcal{P}$.
      *   *Black's Counterclaim:* $\sigma$ is a global symmetry. It maps state $\psi_1$ to $\psi_2$. $\psi_1 \neq \psi_2$ despite being qualitatively identical. The physical space is $\mathcal{C}$ (or $\mathcal{C}$ modulo spatial translations/rotations, but *not* modulo swap).
      *   *Leibniz's Relational Defense:* Try to construct gauge-invariant observables that distinguish them. E.g., "Distance from Center of Mass." But in Black's universe, CM is midpoint. Distance is same. "Being to the left of." No external frame. So, in physics terms, there are no local gauge-invariant operators $\mathcal{O}$ such that $\langle \psi_1 | \mathcal{O} | \psi_1 \rangle \neq \langle \psi_2 | \mathcal{O} | \psi_2 \rangle$.
