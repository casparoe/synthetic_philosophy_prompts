answer: |-
  Here is the translation of the debate into the formalism of lattice gauge theory (LGT), followed by the residue report you requested.

  ### Part I: The Translation

  **1. The Configuration Space and the Group Action**
  Let $\mathcal{C}$ be the configuration space of the universe. In Black's scenario, a point $\phi \in \mathcal{C}$ specifies the positions and intrinsic properties of the constituents. Since the universe contains only two spheres, we can model $\mathcal{C}$ locally as $M \times M$, where $M$ is the spatial manifold (Euclidean 3-space), modulo the constraint that the spheres have fixed radius and composition.

  There exists a discrete symmetry group $G = \mathbb{Z}_2 = \{e, \sigma\}$ acting on $\mathcal{C}$. The non-trivial element $\sigma$ acts as an involution:
  $$ \sigma: (x_1, x_2) \mapsto (x_2, x_1) $$
  where $x_i$ denotes the position of sphere $i$. In Black's specific setup, the configuration is an eigenstate of spatial parity relative to the midpoint, such that the qualitative physical fields (mass density, charge density, etc.) are invariant under $\sigma$.

  **2. The Principle of the Identity of Indiscernibles (PII) as a Gauge Principle**
  Leibniz's PII asserts that there is no physical distinction without a qualitative difference. In your vocabulary, this is the thesis that $\sigma$ is a **gauge symmetry**.
  *   **Thesis:** The action of $\sigma$ maps a configuration to a physically equivalent description of the *same* state.
  *   **Consequence:** The physical state space (the moduli space) is the quotient $\mathcal{P} = \mathcal{C} / G$.
  *   **Observables:** Physical observables $\mathcal{O}$ must be gauge-invariant functions on $\mathcal{C}$, i.e., $\mathcal{O}(\phi) = \mathcal{O}(\sigma \phi)$.
  *   **Outcome:** Since Black's setup ensures all qualitative properties are $\sigma$-invariant, there are no gauge-invariant observables that distinguish $\phi$ from $\sigma \phi$. In the quotient space $\mathcal{P}$, the orbit $\{\phi, \sigma \phi\}$ is a single point. There is only one object (or one state of affairs). The "two spheres" are an artifact of an unfixed gauge (labeling the spheres "1" and "2").

  **3. Black's Counterexample as a Global Symmetry**
  Black argues that $\sigma$ is a **global physical symmetry**.
  *   **Thesis:** The action of $\sigma$ maps a physical state to a *distinct* physical state, even if all expectation values of qualitative observables are identical.
  *   **Consequence:** We do not quotient by $\sigma$. The physical state space is $\mathcal{C}$ (perhaps quotiented by spatial translations/rotations, but not by the swap).
  *   **Observables:** The labels "Sphere 1" and "Sphere 2" correspond to physical degrees of freedom that are not captured by qualitative gauge-invariant operators.
  *   **Outcome:** $\phi$ and $\sigma \phi$ are distinct points in $\mathcal{P}$. The universe contains two distinct individuals. The symmetry is spontaneously broken in the sense that the universe "chooses" a labeling, but without an order parameter to distinguish the vacua.

  **4. Leibniz's Relational Defense**
  Leibniz often argues that spheres are discerned by their relations (e.g., "Sphere A is 5 meters from Sphere B"). In LGT terms, this is an attempt to construct **relational observables** that are not $\mathbb{Z}_2$ invariant.
  *   **The Problem:** In Black's specific manifold (a universe with *only* the spheres), the relational data is symmetric. The distance function $d(x_1, x_2)$ satisfies $d(x_1, x_2) = d(x_2, x_1)$.
  *   **Translation:** Leibniz is attempting to find a gauge-variant operator that nonetheless has physical meaning. Black blocks this by ensuring the background manifold has no fixed points (no absolute origin) and the matter content is symmetric. Thus, all relational observables are $\mathbb{Z}_2$ invariant. Leibniz's defense fails in this specific topology unless one posits an absolute space (a fixed background field), which would act as a reference frame breaking the $\mathbb{Z}_2$ symmetry explicitly.

  ---

  ### Part II: The Residue Report

  You asked where the mapping holds, where it distorts, and whether your vocabulary begs the question. Here is the breakdown.

  #### 1. Clean Mappings
  *   **Quotienting vs. Ontology:** The structural question "Do we quotient $\mathcal{C}$ by $G$?" maps perfectly to "Are there one or two objects?" If you quotient, multiplicity is descriptive redundancy. If you do not, multiplicity is ontological fact.
  *   **Observables vs. Qualitative Properties:** The restriction that physical observables must be gauge-invariant maps cleanly to the philosophical restriction that "properties" must be qualitative (intrinsic or relational) rather than haecceitistic.
  *   **Gauge Fixing vs. Naming:** Arbitrarily labeling the spheres "Left" and "Right" in Black's universe is exactly analogous to **gauge fixing**. In the gauge view (Leibniz), this fixing is unphysical and introduces fake degrees of freedom. In the global view (Black), this fixing picks out one of the two genuine physical states.

  #### 2. Distortions and Strain
  *   **The Motivation for Quotienting:** In LGT, we quotient by gauge symmetries for specific technical reasons: to remove negative-norm states, to ensure unitarity, or because empirical data (like the Aharonov-Bohm effect) shows that gauge-variant quantities are unmeasurable. In the metaphysical debate, there is no empirical "unitarity" constraint forcing the quotient. The motivation is purely principled (parsimony or the nature of substance). Your vocabulary implies a *functional* reason to quotient (consistency of the theory), whereas the philosophical debate is about the *nature of reality* independent of theory consistency.
  *   **The Status of $\mathcal{C}$:** In physics, we usually write down $\mathcal{C}$ first (e.g., fields on a lattice) and then discover symmetries. In metaphysics, the definition of the "configuration" is itself up for grabs. If you define $\mathcal{C}$ as "unordered sets of spheres," you have already built PII into the kinematics. If you define it as "ordered tuples," you have built Haecceity in. In LGT, the kinematics are rarely contested; in metaphysics, they are the battlefield.

  #### 3. The Missing Counterpart: Primitive Thisness (Haecceity)
  This is the critical failure point of the translation.
  *   **In Physics:** If two states $\phi$ and $\sigma \phi$ are distinct points in the physical Hilbert space, there *must* be some operator (perhaps non-local, perhaps a charge) that distinguishes them, or they belong to different superselection sectors. If no operator distinguishes them, they are physically identical, and we usually identify them (quotient them) to avoid overcounting in the partition function ($Z = \text{Tr } e^{-\beta H}$). Overcounting leads to the Gibbs Paradox.
  *   **In Metaphysics:** Haecceity posits distinctness *without* the possibility of an operator distinction. It asserts that $\phi \neq \sigma \phi$ even if $\langle \phi | \mathcal{O} | \phi \rangle = \langle \sigma \phi | \mathcal{O} | \sigma \phi \rangle$ for *all* admissible $\mathcal{O}$.
  *   **The Verdict:** Your vocabulary **cannot express haecceity without contradiction**. In LGT, distinct physical states are defined by their separability via observables (the Gelfand-Naimark-Segal construction essentially builds the space from the algebra of observables). To say "they are distinct but no observable distinguishes them" is, in physics terms, a category error. It is to claim a degree of freedom exists that does not couple to anything, ever.
  *   **Does it beg the question?** Yes. By defining "physical state space" as the space of distinguishable configurations (or the spectrum of the observable algebra), your framework presupposes that "to be is to be measurable/discernible." Black's claim is precisely that "to be" does not require "to be discernible." Therefore, your framework structurally excludes Black's possibility by definition, not by argument.

  #### 4. Your Friend vs. Your Suspicion
  Your friend claims it is "just the gauge-versus-global question." **Your suspicion is correct; she is being too quick.**

  She is right that the *formalism* can accommodate either view (you can choose to quotient or not). However, she ignores the **criteria for classification**.
  *   In physics, the decision to treat a symmetry as gauge is driven by empirical redundancy or mathematical consistency (e.g., removing ghosts).
  *   In Black's universe, there is no empirical redundancy (no one is measuring). There is no mathematical inconsistency in keeping the labels (unless you care about Gibbs counting, which requires thermodynamics/ensembles, not single-universe ontology).

  The debate isn't about whether the math *allows* a $\mathbb{Z}_2$ quotient; it's about whether reality *requires* it. Your friend reduces a metaphysical dispute about the nature of individuation to a choice of formalism. But the choice of formalism in physics is usually constrained by experiment. Here, the constraint is missing, which means the "gauge vs. global" label is not a discovery about the system, but an imposition upon it.

  ### Conclusion: Where the Residue Points

  The residue reveals a defect not in your vocabulary, but in the assumption that physical vocabulary is neutral.

  1.  **Operationalism vs. Realism:** Your vocabulary is inherently operationalist. A "state" is defined by the expectation values of observables. "Gauge" is defined as redundancy in description relative to measurement. Black's argument is a realist one: individuals exist independently of the possibility of measurement or discernment. Your vocabulary structurally enforces an operationalist ontology. It cannot model "existence without discernibility."
  2.  **The Vagueness of "Qualitative":** You noted that "qualitative property" might be as unpinned as "physical observable." You are correct. In physics, "observable" is pinned down by the algebra of the theory. In metaphysics, "qualitative property" is the contested term.
      *   If "qualitative" means "gauge-invariant," then PII is a tautology: "If two states share all gauge-invariant properties, they are the same gauge-orbit."
      *   Black's move is to claim there are properties (haecceities) that are *not* qualitative (not gauge-invariant observables) but are nonetheless *real*.
      *   Your framework treats non-gauge-invariant quantities as "unphysical." Black treats them as "non-qualitative but physical."

  **Final Judgment:** The debate does not merely re-run the gauge/global distinction. It exposes that the gauge/global distinction itself rests on a prior metaphysical commitment: **that physical reality is exhausted by the algebra of gauge-invariant observables.**

  If you accept that commitment (as a physicist practically must), Leibniz wins by fiat: Black's spheres are gauge copies.
  If you reject that commitment (as a metaphysician might), Black wins: the gauge symmetry is a physical symmetry of a system with hidden variables (haecceities) that your algebra cannot detect.

  Your vocabulary doesn't have a defect; it has a **boundary**. It is designed to describe what can be coupled and measured. Black is asking about what exists outside the light cone of measurement. To translate his claim into your language, you would have to introduce "spectator fields" or "hidden variables" that carry the label information but do not interact. But in LGT, we usually integrate those out or declare them unphysical. Thus, the translation inevitably makes Black's position look like a claim about "unphysical degrees of freedom," which misses his point that they are the *only* things that make them two.

  Your friend is wrong because she thinks the math decides the ontology. You are right to suspect that the ontology decides how you write the math.
