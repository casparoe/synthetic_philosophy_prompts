      *   *Argument for No:* In physics, if you don't quotient, there is usually *some* observable that distinguishes the states (e.g., in SSB, the vacuum choice matters, or there's a conserved charge). In Black's case, there is *no* observable difference. Physics hates this (superselection rules aside). Metaphysics tolerates it.
