answer: |-
  ### Section Plan: Machine Translation & Understanding (50 Minutes)

  **1. Pre-Condition: Operationalize "Translation" (0–10 mins)**
  Do not open with "Does it understand?" Open with "What is the job?"
  *   **Action:** Write two definitions on the board: (A) Translation = Mapping words in Language X to words in Language Y; (B) Translation = Mapping *intent* in Context X to *effect* in Context Y.
  *   **Task:** Ask the room to vote on which definition describes what they want when they use Google Translate for a menu vs. a love letter.
  *   **Goal:** Establish that "understanding" is only a relevant metric if we adopt Definition B. If we adopt Definition A, the question is meaningless. This neutralizes the Humanities camp (who assume B) and forces the CS camp (who often argue A) to admit that fluency alone doesn't satisfy B.

  **2. The Core Example: The Homophonic Pun (10–25 mins)**
  Use your instinct: a example where correct translation forces abandoning literal form.
  *   **Selection:** **"I scream, you scream, we all scream for ice cream."**
  *   **Slide:** Show the English text, then show a literal translation into a target language (e.g., Spanish: "Yo grito, tú gritas...") where the phonetic link between "I scream" and "ice cream" is destroyed.
  *   **Discussion:** Ask: "Did the translator fail?"
      *   If they say yes: "How do you fix it without knowing the *sound* of the words matters more than the *definition*?"
      *   If they say no: "Then what was preserved? The words are wrong."
  *   **Why this works:** It forces the realization that "understanding" here means knowing *why* the text exists (to be catchy/funny) rather than just what the words denote. A statistical engine preserves the tokens; an understander preserves the joke.

  **3. Misconception Management & The Vodka Myth (25–40 mins)**
  Expect misconceptions in this specific order and defuse them immediately:
  *   **Misconception 1 (CS-adjacent): "Fluency equals Competence."**
      *   *When:* Immediately after the example.
      *   *Defusal:* Point out that the literal translation of the ice cream pun is fluent grammar but pragmatic nonsense. Fluency is necessary but not sufficient for intent preservation.
  *   **Misconception 2 (Humanities/Pre-med): "Humans aren't statistical."**
      *   *When:* When someone argues "Humans would never make that mistake."
      *   *Defusal:* Acknowledge human brains use prediction/statistics too, but emphasize *grounding*. Humans know what ice cream tastes like; the model knows only co-occurrence. Don't let them retreat into dualism; keep it on grounding.
  *   **Misconception 3 (Everyone): "The Vodka Story is real."**
      *   *When:* Someone brings up "Spirit is willing, flesh is weak" → "Vodka is good, meat is rotten."
      *   *Verdict:** Tell them straight: **It is apocryphal.** There is no evidence this ever happened in early MT research. It is an urban legend used to mock MT. Use this to teach skepticism about anecdotal evidence in cog sci.

  **4. Boundaries & Closing (40–50 mins)**
  *   **Refuse to Engage:** Explicitly state you will not discuss Transformer architecture (irrelevant to the philosophical point), the "Hard Problem" of consciousness (too big), or whether the system has qualia (unknowable). We are discussing *functional understanding*, not metaphysical soul.
  *   **Closing Question:** Put this on the board for them to answer on a slip of paper or discuss in pairs:
      *   *"What specific error would you forgive in a human translator that you would count as proof of non-understanding in an algorithm, and why?"*
      *   **Why:** This tests if they understand that our judgment of "understanding" is often based on expectations of embodiment and intent, not just output accuracy.

  Structure the 50 minutes around operationalizing translation intent before evaluating performance, use the "I scream/ice cream" homophone to force a trade-off between literal accuracy and pragmatic meaning, and preemptively defuse the "fluency equals comprehension" fallacy before the CS students dominate the conversation.
