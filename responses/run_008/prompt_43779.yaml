answer: |-
  ### I. Precise Formulations: The Arithmetic of Anthropics

  To compare the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) systematically, we must formalize how they modify standard Bayesian updating. Let $H$ be a hypothesis about the world (e.g., the total number of observers), and $E$ be your empirical evidence (e.g., your birth rank, your observations). Let $I$ represent the indexical evidence "I exist" or "I am this observer."

  **1. The Self-Sampling Assumption (SSA)**
  SSA treats your existence as a sampling event. You should reason as if you were a random sample from the set of all observers in your **reference class** ($R$).
  *   **The Measure:** Uniform measure over observers in $R$.
  *   **The Update:** SSA modifies the likelihood term $P(E | H)$. It adds a factor inversely proportional to the number of observers in $H$.
  *   **Formula:**
      $$P(H | E, I) \propto P(H) \times P(E | H) \times \frac{1}{N_H}$$
      Where $N_H$ is the number of observers in reference class $R$ under hypothesis $H$.
  *   **Intuition:** If a hypothesis posits a billion observers, the chance of *you* being the specific one you are is one in a billion. If it posits ten observers, the chance is one in ten. SSA penalizes hypotheses with large populations.

  **2. The Self-Indication Assumption (SIA)**
  SIA treats your existence as evidence about the world. The fact that you exist at all is more likely if there are more "slots" for you to occupy.
  *   **The Measure:** Uniform measure over possible observer-slots across hypotheses.
  *   **The Update:** SIA modifies the prior $P(H)$. It adds a factor proportional to the number of observers in $H$.
  *   **Formula:**
      $$P(H | E, I) \propto P(H) \times N_H \times P(E | H)$$
      (Note: Often $P(E|H)$ includes the sampling probability $1/N_H$, in which case the $N_H$ from SIA cancels the $1/N_H$ from sampling).
  *   **Intuition:** You are more likely to find yourself existing in a world with a trillion observers than in a world with one, simply because there are a trillion times as many opportunities for "you" to arise. SIA rewards hypotheses with large populations.

  **The Core Difference:** In the arithmetic of the posterior, SSA introduces a factor of **$1/N_H$** (anthropic penalty), while SIA introduces a factor of **$N_H$** (anthropic bonus).

  ---

  ### II. Test Case 1: The Carter–Leslie Doomsday Argument

  **Setup:** Let $H_{early}$ be the hypothesis that humanity goes extinct soon (total humans $N = 10^{11}$). Let $H_{late}$ be the hypothesis that humanity colonizes the galaxy (total humans $N = 10^{18}$). Your evidence $E$ is your birth rank $n \approx 10^{11}$ (you are among the first 100 billion humans).

  **SSA Application:**
  *   Likelihood of rank $n$ given $N$: $P(n | N) = 1/N$ (assuming uniform sampling).
  *   Under $H_{early}$ ($N=10^{11}$): $P(n | H_{early}) = 1/10^{11}$.
  *   Under $H_{late}$ ($N=10^{18}$): $P(n | H_{late}) = 1/10^{18}$.
  *   **Result:** The likelihood ratio favors $H_{early}$ by a factor of $10^7$. SSA drives the Doomsday conclusion: you should drastically increase your credence that extinction is imminent.

  **SIA Application:**
  *   SIA adjusts the prior by $N_H$.
  *   Adjusted Prior Ratio: $P(H_{late}) \times 10^{18} : P(H_{early}) \times 10^{11}$. (Favors $H_{late}$ by $10^7$).
  *   Likelihood Ratio (Sampling): $1/10^{18} : 1/10^{11}$. (Favors $H_{early}$ by $10^7$).
  *   **Result:** The anthropic bonus ($N_H$) exactly cancels the sampling penalty ($1/N_H$). The posterior equals the prior. SIA neutralizes the Doomsday Argument.

  **Assessment: Principled or Offset?**
  Is this cancellation principled?
  *   **SIA Defense:** It is principled. The "evidence" in the Doomsday Argument is not just "my rank is $n$," but "I exist." Ignoring the probability of existence itself is a selection bias. SIA corrects for the fact that you are more likely to exist in a large population.
  *   **SSA Defense:** It is an offsetting error. "I exist" is not evidence; it is a precondition for having evidence. Conditioning on existence begs the question by assuming that existence is probabilistic in a way that correlates with population size.
  *   **Verdict:** The cancellation is **principled within SIA's framework**, but SIA's framework assumes that "I exist" is a contingent piece of data comparable to drawing a ball from an urn. SSA treats "I exist" as a fixed constraint. The disagreement rests on whether existence is evidence.

  ---

  ### III. Test Case 2: Bostrom's Presumptuous Philosopher

  **Setup:** Two theories of physics, $T_1$ and $T_2$, are empirically indistinguishable so far. $T_1$ implies a universe with $10^9$ observers. $T_2$ implies a universe with $10^{18}$ observers. Priors are equal.

  **SIA Application:**
  *   SIA weights by $N_H$.
  *   Posterior Ratio: $(1 \times 10^{18}) : (1 \times 10^9) = 10^9 : 1$.
  *   **Result:** You should be a billion times more confident in $T_2$ without doing any physics. This is the "Presumptuous Philosopher."

  **SSA Application:**
  *   SSA weights by $1/N_H$.
  *   Posterior Ratio: $(1 \times 1/10^9) : (1 \times 1/10^{18}) = 10^9 : 1$ in favor of $T_1$?
  *   *Correction:* In the standard PP case, the philosopher compares theories *before* observing their birth rank. If the reference class is fixed, SSA does not inherently favor the smaller universe unless birth rank is included. However, if the philosopher considers "I am an observer," SSA treats the probability of being *this* observer.
  *   Actually, standard SSA avoids PP because it does not update on "I exist" (it conditions on it). It only updates on "I am this specific observer." If the theories are empirically identical, SSA yields equal credence (assuming the reference class is the same).
  *   **Result:** SSA avoids the Presumptuous Philosopher.

  **Assessment: Damaging Verdicts vs. Reference Class Problem**
  *   **SIA's Damage:** PP allows armchair reasoning to swamp empirical data. It implies we can know the size of the universe a priori. This violates the principle that physical theories should be tested by observation.
  *   **SSA's Embarrassment (Reference Class Problem):** SSA's verdicts depend entirely on how you define the "reference class." Are you a sample of "humans," "conscious beings," "observer-moments," or "intelligent life"?
      *   If Reference Class = "Humans," Doomsday holds.
      *   If Reference Class = "All Conscious Beings" (including aliens), Doomsday weakens.
      *   There is no non-arbitrary way to draw the class. This makes SSA's predictions unstable.
  *   **Comparison:** SIA's error is **epistemically vicious** (it justifies ignoring data). SSA's error is **methodologically incomplete** (it lacks a rule for defining the class). Incompleteness is preferable to falsehood. SSA is less damaging, though frustratingly vague.

  ---

  ### IV. Test Case 3: The Sleeping Beauty Problem

  **Setup:** Coin flip. Heads: Wake Monday only. Tails: Wake Monday and Tuesday (amnesia between). You wake up. What is $P(Heads)$?

  **Mapping SSA/SIA to Halfer/Thirder:**
  *   **SIA $\rightarrow$ Thirding:**
      *   Hypotheses: $H$ (1 awakening), $T$ (2 awakenings).
      *   SIA weights by number of observers (awakenings).
      *   Weighted Priors: $P(H) \propto 1$, $P(T) \propto 2$.
      *   Posterior: $P(H) = 1/3, P(T) = 2/3$.
      *   **Verdict:** Exact mapping. SIA delivers Thirding.

  *   **SSA $\rightarrow$ Halving (with caveats):**
      *   SSA requires a reference class.
      *   If Reference Class = "Awakenings in this experiment":
          *   $P(\text{I am this awakening} | H) = 1/1$.
          *   $P(\text{I am this awakening} | T) = 1/2$.
          *   Likelihood ratio favors Heads 2:1. Posterior $P(H) = 2/3$. (This is *not* Halving).
      *   If Reference Class = "People who participate in this experiment" (counting the *person*, not the *awakening*):
          *   There is 1 person in $H$ and 1 person in $T$.
          *   Sampling probability is equal.
          *   Posterior = Prior = 1/2.
      *   **Verdict:** The mapping is **not exact**. SSA yields Halving *only if* the reference class is defined as "experiment participants" rather than "observer-moments." SIA naturally counts moments; SSA requires a choice. This highlights SSA's dependency on the Reference Class Problem even in simple cases.

