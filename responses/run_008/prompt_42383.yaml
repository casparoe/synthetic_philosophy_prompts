  You must reject premise (3): the claim that a distribution is just whenever it arises from free individual conduct within a just basic structure. Rawls explicitly denies that procedural fairness in transaction guarantees distributive justice. For Rawls, the basic structure must ensure the *outcome* satisfies the Difference Principle continuously, not merely establish fair starting rules. Justice is not historical; it is current. Therefore, even if Ada's accumulation resulted from voluntary exchanges under unchanged laws, D2 is unjust because it fails the DP test. The basic structure's justice is not a one-time certification but an ongoing functional requirement. By rejecting (3), you preserve the Difference Principle as a patterned principle that overrides historical entitlements derived from free exchange. This distinguishes Rawls from libertarians who view justice as purely procedural. You affirm that the legitimacy of holdings depends on their conformity to the principles of justice at any given time, not merely on the history of their acquisition.

  Section 2, "Why it looked fine"
  This premise looked irresistible because it smuggles in Nozick's entitlement theory under the guise of Rawls's basic structure distinction. Your classmate leverages the intuition that if the "rules of the game" are fixed and fair, the "score" must be legitimate. It exploits the separation between individual and structure: if individuals aren't responsible for aggregate patterns (Premise 1), it seems contradictory to judge the pattern unjust if no individual acted wrongly. Premise (3) acts as the bridge that converts procedural liberty into distributive legitimacy. It appeals to the liberal desire to avoid paternalism, suggesting that once just institutions are set up, citizens should be free to let outcomes fall where they may without state interference. It makes the Difference Principle look like a starting gate only, rather than a continuous constraint, which is a common misreading of Rawls that your classmate has skillfully exploited.

  Section 3, "What rejecting it costs"
  Rejecting (3) costs you the comfort of thinking justice is "set and forget." You must admit that a just basic structure requires continuous interference—taxation, redistribution, perhaps limiting inheritance—to prevent D2. Your classmate will argue this violates liberty: if Ada earned wealth freely, taking it is forced labor or theft. The cost is accepting that property rights are not natural but conventional, defined by the structure itself. Your reply is that Ada never had a legitimate claim to the excess wealth; the basic structure defines ownership *as* contingent on DP compliance. Thus, correcting D2 isn't violating Ada's liberty but enforcing the only property rights that exist. Rawlsian liberty is not pre-political; it is constituted by the principles of justice. However, you pay the price of making justice depend on constant political vigilance rather than static rules, exposing the system to charges of inefficiency or perpetual instability. You concede that "free exchange" is only free within the bounds of what the DP permits, meaning economic liberty is subordinate to distributive outcomes. Furthermore, you concede that institutions must be dynamic, constantly adjusting tax rates or property laws to counteract market tendencies. This invites the critique that such a state becomes overly intrusive, potentially chilling the very innovation that benefits the least advantaged. You must argue that this intrusion is the price of freedom for the poor, but the burden of proof shifts to you to show such intervention doesn't collapse the economy.

  Section 4, "The least bad alternative"
  The alternative is rejecting (2), claiming the basic structure changed because its effects changed. This is worse because it conflates institutions with outcomes. The basic structure consists of rules (constitution, laws), not distributional patterns. If the rules are untouched, the structure is identical. Denying (2) makes the definition of "institution" unstable, suggesting laws change meaning based on economic results. This undermines the rule of law and makes justice unknowable to citizens trying to follow rules. Rejecting (3) is preferable because it keeps institutions stable while acknowledging their moral output must be monitored. It preserves the distinction between rules and results while insisting rules must be designed to guarantee results, rather than pretending rules alone suffice. It maintains that institutions are the tool for justice, not the outcome itself, ensuring citizens know the rules even if the state must actively enforce distributive limits.

  Section 5, "His next move"
  His next move will invoke G.A. Cohen. He will argue that if the structure must constantly correct outcomes, justice ultimately depends on individual choices (an egalitarian ethos), not just rules. If citizens voluntarily choose exchanges leading to D2, the structure is merely reacting to their unjust choices. Thus, you are back to policing individual intent, violating Premise (1). He will claim you cannot have both a structural theory and a patterned principle without regulating personal choice.
