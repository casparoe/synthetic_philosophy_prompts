  Joint satisfiability

  The trilemma is stark: you cannot simultaneously satisfy Ellsberg preferences, Dynamic Consistency, and Statewise Dominance. Machina and Schmeidler (1992) demonstrate that recursive preferences satisfying dynamic consistency essentially collapse into Subjective Expected Utility (SEU), eliminating ambiguity aversion. To retain ambiguity aversion, models typically sacrifice Dynamic Consistency (leading to time inconsistency) or weaken Dominance (accepting violations of the Sure-Thing Principle). Epstein and Schneider (2003) salvage consistency by restricting the set of priors recursively via "rectangularity," but this limits the scope of ambiguity representable to specific structures. Thus, the subset {Ellsberg Preferences, Dynamic Consistency, Full Dominance} is jointly unsatisfiable. A theory must drop one: usually Dynamic Consistency is weakened to updating rules like full Bayesian updating over sets, or Dominance is relaxed to allow ambiguity-driven choices. This impossibility result forces the theorist to admit that either ambiguity aversion is irrational, or rational agents must accept dynamic inconsistency. This tension arises because ambiguity aversion implies non-additive beliefs, which conflict with the linearity required for dynamic updating. Consequently, no model perfectly satisfies all normative demands while fitting the data.

  The benign-source urn

  Normatively, rational attitude should not shift based on the source's intent if the probabilistic structure is identical (extensionality). However, the 'competence hypothesis' suggests agents feel more ambiguous when lacking control. If the process is known benign, Maxmin models (worst-case) seem overly pessimistic, implying an adversarial nature. A rational agent might treat benign ambiguity closer to risk if the generating process is understood, yet still lack precise probabilities. The twist highlights that ambiguity aversion may conflate uncertainty with mistrust. A robust theory should separate epistemic confidence from ontological uncertainty, suggesting attitudes shouldn't shift purely on benignity, though the set of priors might narrow if the process is better understood. If the source is indifferent, the worst-case prior lacks justification, suggesting Maxmin is inappropriate for benign natural uncertainty unless justified by extreme caution. Rationality dictates source independence, yet psychological comfort might reduce the degree of aversion.

  Scorecard

  MEU: Captures Ellsberg statically but fails dynamic consistency without restrictive updating rules like rectangularity. Smooth Ambiguity: Separates beliefs from attitude nicely, yet struggles with recursive formulation without collapsing to SEU or violating dominance. Imprecise Probabilities: Flexible representation of ignorance, but requires ad hoc updating rules to maintain coherence over time. Each trades off static descriptive power for dynamic coherence.
