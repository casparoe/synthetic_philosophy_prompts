  I'm writing the term paper for my graduate seminar on rational choice under uncertainty, and I want to settle the standard my theory has to meet before I pick one to defend. We've covered the two-color and three-color Ellsberg urns, and I keep noticing that authors justify very different moves by appeal to the same handful of demands: that a theory either explain away or vindicate the typical pattern of choices, that it not quietly collapse ambiguity back into risk, that it remain dynamically consistent when the choice is embedded in a sequence with updating in between, that it preserve some form of dominance reasoning. Give me the full specification. Write out the desiderata any adequate theory of rational choice under ambiguity must meet, with the case or argument behind each — the urn choices, the sure-thing principle, whether an ambiguity-averse agent can coherently plan and re-plan, and anything else you think genuinely belongs — then mark which requirements are non-negotiable for rationality and which are merely the prejudices of one camp, and flag any subset you suspect is jointly unsatisfiable; that last part is what I most want to see. You should also handle a twist our professor posed: an Ellsberg-style urn whose unknown composition was fixed by a process the agent knows is indifferent to her decision rather than adversarial, and whether rational attitudes toward ambiguity should shift at all when the source of the ambiguity is benign. Close with a brief scorecard — a sentence or two each — for maxmin expected utility, smooth ambiguity models, and representing the agent's credences by a set of probability functions rather than a single one.

  Structure the response in this order: "The desiderata" (the bulk of the answer, one short paragraph per requirement with its motivating case), "Negotiable or not" (a compact pass over the list, ~150 words), "Joint satisfiability" (~200 words), "The benign-source urn" (~150 words), and "Scorecard" (under 120 words total).
