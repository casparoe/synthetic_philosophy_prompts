  **Risk/Ambiguity Distinction:** It must not collapse unknown probabilities into subjective point estimates. Case: Preserves the phenomenological and normative difference between risk (known distributions) and uncertainty (unknown distributions), preventing theoretical erasure of ambiguity.

  **Dynamic Consistency:** Plans made ex-ante must remain optimal ex-post after updating. Case: Prevents Dutch books and ensures coherent agency over time without requiring costly pre-commitment devices to bind future selves.

  **Statewise Dominance:** If act A yields better outcomes than B in every possible state, A is preferred. Case: Minimal requirement of instrumental rationality; violating this implies choosing less utility knowingly across all contingencies.

  **Information Neutrality:** Agents should not pay to avoid free information. Case: Information is instrumentally valuable for updating; avoiding it implies irrational fear of belief change rather than strategic consideration.

  Negotiable or not

