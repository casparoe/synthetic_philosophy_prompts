      *   *Adjustment:* I will frame it as "Updating our Historical Record" rather than "Tearing down." I will suggest the new text honors the *complexity* rather than just negating the old.
      *   *Critique:* Did I address the Mayor's "multiple perspectives"?
      *   *Adjustment:* Yes, distinguish between "multiple perspectives" (opinion) and "multifaceted evidence" (fact).
      *   *Critique:* Is the draft language too long?
      *   *Adjustment:* Keep it plaque-sized.

  7.  **Final Polish:** Check the flow. Ensure the transition from the 2008 precedent to the current decision is logical. (If we trusted memory for graves, we must trust memory for riots). Ensure the land deal is framed carefully (exploitative vs. opportunistic).

  *(Self-Correction on the Recommendation)*: Actually, looking at the political landscape, "Add a second interpretive plaque" might be the smoother swing vote that brings the Mayor and the Memory folks on board without fully alienating the Records folks (who keep their "original" marker but see it contextualized). However, the prompt says the current marker says he *did* hide them. If that's now disputed/complicated, a second plaque is often the standard museum practice for "new interpretation." Let's stick with **Replace** because a teacher knows that leaving misinformation up (even with a footnote) is bad pedagogy. But I will write the recommendation to be sensitive. *Wait, no.* If I recommend replacement, the "Records Only" people might riot. If I recommend "Add," the "Memory" people might feel the original lie is still honored.
  *Decision:* I will recommend **Replacing the marker with a new text.** It is the most intellectually honest position for a historian/teacher. I will argue that the 2008 precedent binds us to treat oral history as evidence, which necessitates changing the text to reflect the *full* evidence (oral + written).

  *Wait, let's look at the "False Balance" issue again.* The Mayor wants "multiple perspectives." If I write a plaque that says "Legend says X, Records say Y," that *is* false balance if X is supported by oral history and Y by ledgers. The plaque needs to synthesize. "Rev. Calloway is remembered for X. Recent research indicates Y."

  *Okay, let's write.*

