answer: |-
  **MEMORANDUM**

  **TO:** City Historical Commission
  **FROM:** [Your Name]
  **DATE:** August 15, 2024
  **RE:** Recommendation Regarding the Rev. Amos Calloway Marker

  **Introduction**

  As we approach the September meeting, I want to thank the Commission for the rigor and passion brought to the review of the Rev. Amos Calloway marker. We are all here because we care about this city's past and how we tell it to our children. The new information regarding the 1919 riot, the land transactions, and the descendant oral histories presents a challenge not just to a bronze plaque, but to our methodology as a Commission.

  After reviewing the testimony, the ledgers, and our own past decisions, I am writing to outline my position and offer a recommendation that I hope can serve as a basis for our consensus.

  **Recommendation**

  I recommend that the Commission vote to **replace the existing marker with a new, comprehensive text** that integrates both the archival findings and the descendant oral histories. We should aim to install this before next year's Founders' Day.

  I do not recommend deferring the decision. While "more research" is always tempting, we possess sufficient evidence to acknowledge that the current text is incomplete. To defer indefinitely is to make a decision by default: it chooses the status quo. Given the gravity of the allegations regarding economic exploitation during a crisis, silence is not a neutral act.

  **Reasoning: Consistency and Methodology**

  My primary reasoning rests on professional consistency. In 2008, regarding the Pioneer Cemetery, this Commission established a precedent that descendant recollection constitutes valid historical evidence when physical markers are absent. We accepted oral testimony to mark graves that documents had ignored.

  We cannot apply one standard of evidence to the pioneers and a stricter one to the Black families of the 1919 riot. If oral history was sufficient to *create* a marker in 2008, it is sufficient to *modify* a marker in 2024. To argue that "the evidence isn't settled enough to change anything" contradicts our own binding precedent. It suggests that we only honor memory when it comforts the majority, and demand paper trails when it complicates the narrative.

  However, this does not mean we accept oral history uncritically. As a teacher, I tell my students that every source has a bias, including ledgers. The coroner's inquests tell us who died, but not who was scared. The land ledger tells us a sale occurred at a low price, but not the pressure applied. The oral histories tell us of fear and shelter, but details may shift over a century. Our job is not to pick the "winner" between documents and memory, but to weave them into a truthful whole.

  **Addressing the "Multiple Perspectives" Concern**

  I understand the Mayor's suggestion to present "multiple perspectives." However, in historical interpretation, there is a distinction between *balance* and *synthesis*. A plaque that simply says "Some say Calloway was a hero; others say he was an exploiter" creates a false equivalence. It suggests these are merely opinions rather than evidence-based findings.

  Instead, the new text should reflect the weight of the evidence. We can acknowledge the tradition of his heroism while noting the documented economic transactions and the specific testimonies of those turned away. This is not "canceling" Calloway; it is restoring him as a complex human being acting in a complex time. This is better social studies for the fourth graders who read this marker. It teaches them that history is not just about saints and villains, but about choices made under pressure.

  **The Strongest Argument Against This Recommendation**

  I want to address the concern raised by the "Records Only" faction, which I respect. Your argument is that without contemporaneous written proof of the sheltering, we are replacing a verified fact (the land sale) with unverified memory (the hiding). You worry that loosening our evidentiary standards opens the door to myth-making.

  This is a valid methodological caution. Oral history *does* degrade over time. Memories *do* shift. If we replace a document with a story, we risk building our history on sand. I acknowledge this risk. However, in the context of the 1919 riot, the absence of documents regarding sheltering is itself evidence; people in danger did not create paper trails. To require written proof of hiding is to require evidence that likely could not exist. Therefore, dismissing the oral history because it lacks paperwork is, in this specific context, an impossible standard.

  **Proposed Marker Language**

  The goal of the new text is to be precise about what we know, what we remember, and where the tension lies. It should avoid definitive claims where the evidence is mixed.

  *Draft Text:*

  > **REV. AMOS CALLOWAY AND THE RIOT OF 1919**
  >
  > For generations, this community has honored Rev. Amos Calloway for sheltering Black families in this church during the 1919 riot. Oral histories from descendant families confirm that shelter was provided to some, including those who remained in the area afterward.
  >
  > Recent examination of county land ledgers reveals that in the weeks following the riot, Rev. Calloway purchased a farm from a fleeing family at a value significantly below market rate. Descendant testimony suggests this transaction occurred under duress. Other accounts indicate that while some found refuge here, other families were turned away.
  >
  > This marker reflects a complex history: one of courage and community aid, alongside the economic hardships and difficult choices faced by all residents during a time of racial violence.
  >
  > *Erected by the [City Name] Historical Commission, 2024*

  **Conclusion**

  This recommendation asks the Commission to do difficult work. It asks the "Memory" faction to accept that our hero was flawed. It asks the "Records" faction to accept that documents do not tell the whole truth. It asks the Mayor to accept that nuance is not the same as division.

  We are not here to protect the reputation of the dead. We are here to tell the truth to the living. By updating this marker, we demonstrate that our city is mature enough to hold two truths at once: that Calloway helped neighbors, and that he may have benefited from their desperation. That is a lesson worth teaching.

  I look forward to discussing this with you in September.

  Respectfully,

  [Your Name]
