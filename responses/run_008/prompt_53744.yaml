prompt: |-
  I spent my working life in population genetics, and since retiring I have been reading philosophy of science — Popper in particular. Something now puzzles me about the practice I spent decades participating in, and I would like someone to reconstruct what that practice implicitly presupposes.

  Here is the practice. When a biologist proposes an adaptive explanation of a trait — this enzyme's optimum shifted because the climate cooled; this gene was driven to fixation by selection for pesticide resistance — the discipline no longer accepts the story on plausibility alone. We require that it be tested against a null alternative in which the pattern arose by drift, and the tests are familiar: compare the rate of substitutions that alter the encoded protein against the rate of silent ones that do not; ask whether the pattern of variation bears the signature a selective sweep would leave rather than the signature drift would; simulate the neutral process and ask whether the observation is extreme under it. The rhetoric surrounding all this is Popperian. We say we are trying to refute the adaptationist story, and we dismiss an untested one as a just-so tale until the neutral alternative has been excluded. Yet the inferential machinery we actually use is not Popperian at all. We compute how probable the data are under competing hypotheses and prefer the hypothesis under which they are less surprising; we never deduce a prediction and consign a theory to the scrap-heap upon a single contrary observation, but accumulate comparative support.

  Popper himself, I gather, spent some years doubting whether the theory of natural selection was testable at all — on the ground that, formulated carelessly, it threatens to collapse into the tautology that the fittest are those who survive and leave more offspring — and he later withdrew much of that doubt, allowing that the theory, properly formulated, is testable and has in fact survived severe tests. So my question is this: what view of scientific testing does the practice I have described presuppose? Does it vindicate Popper's withdrawal of the doubt, by presupposing that fitness can be measured independently of survival, so that the claim that the fittest leave more offspring is a risky, refutable assertion rather than a definition? Or does it show that his original worry was aimed at the wrong target? And does the practice hang together at all, given that its rhetoric is deductivist while its machinery is probabilist? Which rival views of testing does it quietly rule out — and is it in fact compatible with several of them, so that the Popperian gloss is decoration rather than commitment? Finally, if we took the presupposed view seriously and replaced the rhetoric with it, what would visibly change in how papers are written, reviewed, and defended?

  I would like one subsidiary puzzle folded into the answer. The same practice treats the neutral alternative as the null hypothesis to be rejected, rather than as an equal competitor to be compared symmetrically. Does that presuppose a substantive commitment — that drift is the default condition of populations and selection the exception requiring special evidence — and, if so, is that a commitment about how the world mostly is, or merely a convention about who bears the burden of proof?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Profile:** Retired population geneticist, well-versed in the practical methods of the field (dN/dS ratios, selective sweeps, neutral simulations, etc.). Recently reading philosophy of science, specifically Karl Popper.
      *   **Core Puzzle:** There's a tension between the *rhetoric* used in population genetics (Popperian falsification, rejecting "just-so stories," testing against nulls) and the *actual statistical machinery* used (likelihoods, p-values, Bayesian model comparison, probabilistic support).
      *   **Specific Questions:**
          1.  What view of scientific testing does this practice presuppose?
          2.  Does it vindicate Popper's withdrawal of doubt regarding natural selection (independent fitness measurement)?
          3.  Or does it show Popper's original worry was aimed at the wrong target?
          4.  Is the practice coherent given the deductivist rhetoric vs. probabilist machinery?
          5.  Which rival views of testing does it rule out? Is the Popperian gloss just decoration?
          6.  What would change if the rhetoric matched the presupposed view?
          7.  **Subsidiary Puzzle:** Why is the Neutral Theory the *null hypothesis*? Is this a substantive claim (drift is default) or a procedural convention (burden of proof)?

  2.  **Deconstruct the Scientific Practice:**
      *   *The Practice:* Testing adaptationist hypotheses against a Neutral Model (Kimura).
      *   *The Methods:* McDonald-Kreitman tests, dN/dS ratios, site frequency spectra, coalescent simulations.
      *   *The Logic:* Calculate $P(Data | H_{neutral})$. If low ($p < 0.05$), reject neutral. Infer selection. Sometimes compare $P(Data | H_{selection})$ vs $P(Data | H_{neutral})$ (Likelihood Ratio Tests).
      *   *The Rhetoric:* "Falsifying the null," "Ruling out drift," "Avoiding just-so stories." This sounds Popperian (conjecture and refutation).
      *   *The Reality:* It's inductive/probabilistic. We never *logically* falsify drift (data could be unlikely but still possible). We accumulate evidence.

  3.  **Address the Popperian Tension:**
      *   *Popper's View:* Science proceeds by bold conjectures and severe attempts at falsification. Verification is impossible; corroboration is just survival of tests. No probabilities attached to theories (probabilistic statements are hard to falsify strictly).
      *   *The Mismatch:* Population genetics uses statistical significance. A $p$-value is not a falsification in the logical sense. It's a measure of incompatibility.
      *   *Popper on Evolution:* Popper famously called evolutionary theory a "metaphysical research programme" (1974) before walking it back. His worry was tautology (Survival of the Fittest = Those who survive).
      *   *Does the practice vindicate Popper's withdrawal?* Yes, implicitly. By defining fitness *independently* of survival (e.g., biochemical efficiency, reproductive potential in specific environments) or by predicting specific genomic signatures (selective sweeps) that drift *would not* produce, the theory becomes risky.
      *   *Is the Popperian gloss decoration?* Largely, yes. It's a sociological shield against "just-so stories" (Gould & Lewontin's critique). It signals rigor. But the logic is Likelihoodist or Bayesian.

  4.  **Identify the Presupposed View of Testing:**
      *   It's not strict Popperianism.
      *   It's not naive Inductivism (we don't just gather facts).
      *   It *is* **Hypothetico-Deductivism with a Probabilistic Core** (often associated with Mayo's Error Statistics or Likelihoodism).
      *   Specifically, it aligns well with **Model Selection** and **Severe Testing** (Deborah Mayo). We use the neutral model as a "error probe." If the data passes through the sieve of the neutral model and comes out the other side (significant deviation), we claim a detection of selection.
      *   It also leans on **Likelihoodism** (Edwards, Royall): Data supports $H_1$ over $H_2$ if $P(Data|H_1) > P(Data|H_2)$.

  5.  **Address the Subsidiary Puzzle (Neutral as Null):**
      *   *Why Neutral as Null?*
      *   *Option A: Substantive Ontology.* Drift is the physical default (thermodynamics of noise). Selection requires energy/work/cause. (Kinetic vs. Static).
      *   *Option B: Procedural/Conservative.* It's harder to prove something exists than to assume it doesn't. Burden of proof lies on the adaptationist.
      *   *Resolution:* It's both, but primarily procedural to avoid the "Panglossian Paradigm" (Gould & Lewontin). If we assumed selection was default, we'd see adaptation everywhere. By making drift the null, we force the adaptationist to provide *positive evidence*, not just a plausible story. This is a methodological safeguard against confirmation bias.

  6.  **Synthesize the "What Would Change" Scenario:**
      *   If we dropped Popperian rhetoric for Probabilistic/Model-Selection rhetoric:
      *   Less talk of "rejecting" or "falsifying."
      *   More talk of "weight of evidence," "effect sizes," "model fit."
      *   Acknowledgement that the Null is likely false everywhere (infinite sites), so the question is *how much* selection, not *if*.
      *   More Bayesian priors on the prevalence of selection.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the user's expertise. Validate the tension (Rhetoric = Falsificationist, Machinery = Probabilist).
      *   *Section 1: The Popperian Mismatch.* Explain why p-values aren't falsifications. Popper hated probabilistic confirmation. The practice is actually **Likelihoodist** or **Error-Statistical**.
      *   *Section 2: Popper on Evolution.* Address the tautology charge. The practice *does* vindicate the withdrawal because fitness is operationalized independently (genetic signatures, biochemical constraints). The "risky prediction" is the specific pattern of variation, not just "survival."
      *   *Section 3: The Function of the Rhetoric.* Why call it Popperian? It's a defense against Gould & Lewontin's "Spandrels" critique. It's a disciplinary norm to prevent lazy adaptationism. It's a "useful fiction."
      *   *Section 4: The Null Hypothesis Puzzle.* Is drift the default? It's a methodological default (Parsimony) rooted in a physical intuition (noise is everywhere, signal requires cause). It shifts the burden of proof.
      *   *Section 5: What would change?* Shift from "Significant/Not Significant" to "Strength of Evidence." Shift from "Reject Null" to "Compare Models." Acknowledgment of "Nearly Neutral" zones.
      *   *Conclusion:* The practice is a hybrid. It uses Popperian norms to enforce rigor but Bayesian/Likelihoodist math to do the work.

  8.  **Refining the Philosophy:**
      *   Need to mention **Deborah Mayo**. Her concept of "Severe Testing" fits the "testing against a null" practice perfectly, even if it's probabilistic. It bridges Popper and Statistics.
      *   Need to mention **Sober**. Elliott Sober has written extensively on likelihood and selection.
      *   Need to mention **Gould & Lewontin (1979)**. This is the historical context for why the "Null Hypothesis" practice became dominant. The "Adaptationist Programme" needed a check.
      *   *Key Insight:* The "Null" isn't believed to be *true*. It's believed to be a *useful foil*. This is distinct from Popper's "Conjecture."

  9.  **Final Polish:** Ensure the tone is respectful of the user's career and philosophical curiosity. Avoid jargon where possible, but use precise philosophical terms (Likelihoodism, Error Statistics, Falsificationism) since the user asked for them.

      *(Self-Correction during drafting)*: I should be careful not to say Popper was "wrong." Rather, the biologists are using a *neo-Popperian* or *post-Popperian* framework that incorporates statistics, which strict Popperism struggled with. The "Popperian gloss" is indeed partly decoration, but it serves a normative function.

      *(Refining the Null Hypothesis point)*: Is drift the "default condition of populations"? Physically, yes, in the sense that random sampling happens in every finite generation. Selection requires a specific covariance between trait and fitness. So it is substantive *and* procedural.

  10. **Final Structure:**
