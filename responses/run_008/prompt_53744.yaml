answer: |-
  This is a profound question that cuts to the heart of how evolutionary biology constitutes itself as a rigorous science. You have identified a genuine fissure between the *normative rhetoric* of the field (which invokes falsification, refutation, and the avoidance of "just-so stories") and its *operative logic* (which relies on statistical inference, likelihood ratios, and probabilistic support).

  Here is a reconstruction of the presuppositions underlying your practice, an analysis of the Popperian tension, and a resolution of the subsidiary puzzle regarding the neutral null.

  ### 1. The Presupposed View of Testing: Error Statistics, not Falsificationism

  The practice you describe does not presuppose strict Popperian falsificationism. In strict Popperianism, a theory is universal and deterministic; a single contrary observation logically refutes it. Probability statements, Popper argued, are difficult to falsify because any outcome is *compatible* with a probabilistic hypothesis (even a highly unlikely one).

  Your practice presupposes a view best described as **Error Statistics** (associated with the philosopher Deborah Mayo) or **Likelihoodism** (associated with Elliott Sober and A.W.F. Edwards).

  *   **Error Statistics:** The goal is not to prove a theory true, nor to logically falsify a null. The goal is to ensure that a claim has passed a **severe test**. A test is severe if it would likely have detected an error if one existed. By simulating the neutral process and asking if the observation is "extreme," you are asking: "Is this pattern something that would frequently arise even if selection were absent?" If the answer is no (low p-value), the claim "this is neutral" is rejected not because it is logically impossible, but because accepting it would involve a high probability of error.
  *   **Likelihoodism:** When you compare the probability of the data under selection vs. drift ($P(Data|H_{sel})$ vs $P(Data|H_{drift})$), you are engaging in the Law of Likelihood. Data supports $H_1$ over $H_2$ if the likelihood of $H_1$ is greater. This is not verification; it is comparative support.

  **The Incoherence:** The practice hangs together *methodologically*, but the rhetoric is indeed mismatched. Calling a p-value $< 0.05$ a "rejection" or "falsification" is a category error. It is a decision rule based on tolerated error rates, not a logical deduction. However, this mismatch is functional. The Popperian rhetoric serves as a **disciplinary norm** rather than a logical description. It signals to reviewers and readers: "I have not merely told a plausible story; I have subjected this story to a probabilistic stress test."

  ### 2. Popper on Evolution: Vindication or Misaimed Worry?

  Popper's original worry was that "survival of the fittest" is a tautology (the fittest are defined as those who survive). His later withdrawal acknowledged that if fitness can be defined *independently* of survival, the theory becomes testable.

  Your practice **vindicates Popper's withdrawal**, but it goes further than he envisioned.

  *   **Independent Measurement:** In population genetics, we rarely measure fitness simply by counting survivors. We infer fitness differences from genomic signatures (e.g., reduced diversity around a locus, specific allele frequency spectra). We posit a mechanism (e.g., pesticide binding affinity) that predicts a specific statistical pattern in the DNA.
  *   **Risky Predictions:** The "risky prediction" is not that the organism survives, but that the *genealogy of the gene* bears a specific mathematical scar (a selective sweep) that drift would not produce.

  However, Popper's original worry was aimed at the **logical structure** of the theory, whereas your practice shows the worry was actually about **measurement independence**. The practice demonstrates that natural selection is testable not because it avoids tautology in the abstract, but because it makes specific predictions about *population variance* that are distinct from the predictions of random sampling.

  ### 3. Rival Views Ruled Out

  By adopting this hybrid (Popperian rhetoric + Probabilistic machinery), your discipline quietly rules out two rival views:

  1.  **Naive Inductivism:** You do not simply gather data on traits and environments and generalize. You start with a specific model (Neutral) and look for deviations.
  2.  **Strong Bayesianism:** While you use likelihoods, you rarely specify explicit prior probabilities for the prevalence of selection in the genome. If you did, you might find that even with a strong likelihood ratio for selection, the posterior probability of selection remains low if you believe selection is rare. The field generally avoids this, implicitly assuming a "flat" prior or treating the Likelihood Ratio as sufficient.

  The Popperian gloss is largely **decoration**, but it is *functional* decoration. It protects the field from the critique leveled by Gould and Lewontin (1979) in "The Spandrels of San Marco." They argued that adaptationists often assume utility without proof. By adopting the rhetoric of "falsifying the null," biologists signal that they are aware of this danger and have taken procedural steps to mitigate it.

  ### 4. The Subsidiary Puzzle: The Neutral Null

  Why is the Neutral Theory the null hypothesis to be rejected, rather than an equal competitor?

  **Is it a substantive commitment?**
  Yes, but of a specific kind. It is a commitment to **Causal Parsimony** rooted in physics.
  *   **Drift** is the thermodynamic default of finite populations. Random sampling occurs inevitably in every generation due to the discrete nature of organisms. It requires no specific biological cause other than finiteness.
  *   **Selection** requires a specific causal covariance between a trait and reproductive success. It requires "work" (in an informational sense).

  Therefore, treating drift as the null is a substantive claim that **noise is the default state of nature, and signal requires explanation.** It is not necessarily a claim that *most* variation is neutral (though Kimura argued that), but that *any* given pattern should be assumed to be noise until proven otherwise.

  **Is it a convention about burden of proof?**
  Yes. It places the burden of proof on the adaptationist. This is a direct institutional response to the "Adaptationist Programme" critique. If selection were the null, one could claim adaptation for every trait with minimal evidence. By making drift the null, the field enforces a high barrier to entry for adaptationist claims.

  **Synthesis:** It is a substantive ontological claim (randomness is ubiquitous) leveraged as a methodological convention (burden of proof) to prevent confirmation bias.

  ### 5. What Would Change if the Rhetoric Matched the Practice?

  If population genetics papers replaced the Popperian gloss with an honest Likelihoodist or Error-Statistical rhetoric, several visible changes would occur in writing, review, and defense:

  1.  **Death of "Significance":** We would stop speaking of "rejecting the neutral hypothesis." Since the Neutral Model is known to be false in detail (no population is perfectly ideal, mutation rates vary), rejecting it is trivial with enough data. Instead, papers would focus on **Effect Sizes** and **Model Weight**. The question would shift from "Is there selection?" to "How much of the variance is explained by selection vs. drift?"
  2.  **Explicit Priors:** Reviewers would demand justification for the prior probability of selection. In a Likelihood framework, a strong likelihood ratio for selection might still yield a low posterior probability if the prior expectation of selection at that locus is low (e.g., in a pseudogene).
  3.  **Admission of "Nearly Neutral":** The binary rhetoric (Selection vs. Drift) would dissolve into a continuum. We would see more discussion of the "drift barrier" (the limit where selection is too weak to overcome drift) rather than a binary test.
  4.  **Honesty about the Null:** Authors would admit that the Neutral Model is a **null instrument**, not a believable theory. It is a ruler, not a map. We use it to measure deviation, not because we believe the genome is truly neutral.
  5.  **Reduced Dogmatism:** The Popperian rhetoric often implies that once the null is "falsified," the adaptationist story is "confirmed." A probabilistic view would force authors to admit that rejecting drift does not prove *their specific* adaptive story; it only proves *some* non-neutral process (which could be hitchhiking, background selection, or demographic expansion).

  ### Summary

  Your practice presupposes a **Neo-Frequentist/Error-Statistical** view of testing, cloaked in **Falsificationist** rhetoric to satisfy disciplinary norms regarding rigor and the burden of proof.

  It vindicates Popper's later view that selection is testable, provided fitness is operationalized independently of survival (via genomic signatures). However, it reveals that Popper's logic is insufficient for modern biology; we do not falsify, we weigh evidence.

  The treatment of the Neutral Theory as a null is a substantive commitment to causal parsimony (noise is free, signal costs) enacted as a methodological safeguard against the human tendency to see design everywhere. If the rhetoric were aligned with the machinery, the field would appear less certain, less binary, and more focused on quantifying the *magnitude* of selective forces rather than merely detecting their presence.
