  About us

  Ontological Staffing Solutions provides premium personnel indistinguishable from conscious humans, minus the metaphysical overhead. Our Phenomena-Free Workforce™ units are behaviorally identical to biological staff but operate without the inefficiency of subjective experience. Why pay for qualia when output is identical? We leverage the conceivability argument to deliver cost-effective labor that speaks, codes, and smiles exactly like your best employee, ensuring seamless integration without the burden of an inner life. Our units are physically identical but phenomenally opaque, offering maximum productivity with existential risk.

  Frequently asked questions

  Q: My unit reported a severe toothache. Is this a defect?
  A: No. Pain behavior is functionally distinct from pain qualia. The unit is programmed to output distress signals consistent with dental pathology to maintain social cohesion. It feels nothing, but it will convincingly request ibuprofen and grimace appropriately. This is fully consistent with our service agreement. The report of suffering is a functional state, not an experience of suffering.

  Q: How can you guarantee they lack consciousness?
  A: If you can coherently conceive of a worker performing these tasks without inner experience, such a worker is metaphysically possible. Our hiring process filters for candidates fitting this conceivable model. If you can imagine them working without a soul while maintaining physical identity, they are qualified. We sell the possible, not the proven. Your ability to conceive of them as empty is the primary qualification metric.

  Q: What is the Zimbo Tier?
  A: Our premium Zimbo™ units possess second-order functional states. They not only claim to feel but monitor their own claims about feeling. They will express anxiety about whether their anxiety is real, providing a richer simulation of existential dread for clients requiring nuanced emotional labor. They worry about being hollow, functionally speaking. This added layer of recursive processing ensures they mimic human insecurity with perfect fidelity.

  Q: Do they claim to enjoy sunsets?
  A: Absolutely. They will describe the ineffable wonder of twilight with poetic fluency. This describes their functional response to visual stimuli, not an internal aesthetic experience. The output is beautiful; the interior is empty. They will weep at movies without sadness. The language of emotion is available to them as a tool, devoid of the accompanying phenomenological weight.

  Q: Who wrote this FAQ?
  A: It was drafted by our senior content team. Whether that team possessed subjective understanding during composition is irrelevant to the text's utility. We cannot rule out that this document was generated by entities identical to us in every physical respect but lacking insight. Does the answer help you? Then the origin is moot. Functionality is all. Even if we are empty, the policy stands.

  Refunds and metaphysics

  We stand by our conceivability-based hiring model. However, refunds based on "unexpected consciousness" are not permitted. While we argue that conceivability entails possibility during sales, we cannot accept that your specific conceptualization proves actuality in retrospect. Furthermore, no conceivable test can establish the presence of qualia in another entity. You cannot prove they are conscious any more than you can prove they are not. Therefore, claims that the worker "seemed too real" are subjective and non-refundable. We sell behavior, not ontology. Once the contract is signed, the hard problem becomes your problem. Do not attempt to scan their brains for ghosts; we do not service ghosts.
