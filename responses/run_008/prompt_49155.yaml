answer: |-
  The complaint you are describing is precise, philosophically mature, and distinct from the usual bludgeons deployed in policy debates. You have correctly identified that it is not a claim about mathematical error, nor a standard rights-based veto, nor a simple preference for equality. You are describing a structural objection to how moral value is summed across distinct entities.

  In moral and political philosophy, this exact complaint has an established name: **The Separateness of Persons Objection** (often shortened to **The Separateness of Persons**).

  It was most famously articulated by John Rawls in *A Theory of Justice* (1971) and further developed by Robert Nozick. Rawls argued that utilitarianism (and by extension, cost-benefit analysis) extends the "principle of choice for one man" to the "principle of justice for society." He contended that this is a category error. A single person can rationally sacrifice a present pain for a future gain because it is the *same consciousness* that endures both. Society, however, is not a super-organism with a single consciousness. There is no entity that "lives the total." Therefore, a loss to Person A cannot be morally cancelled by a gain to Person B, because there is no shared experiential vessel to hold the sum.

  Here is how this concept carves up the landscape, distinguishing it from the neighbors you identified:

  **1. Versus Rights-Talk**
  Rights are often the *conclusion* drawn from the Separateness of Persons, but they are not the objection itself. A rights-based argument says, "You cannot do this because Person A has a right to X." The Separateness objection is deeper: it asks *why* we have rights in the first place. It posits that rights exist specifically to protect the boundary between persons against aggregation. If you waive the right (e.g., "I consent to the sacrifice"), the Separateness objection might still apply if the structural logic remains "one suffers so others gain." Nozick used this to argue for "side-constraints": you cannot violate the boundary even for the greater good, because the boundary is what makes us distinct individuals.

  **2. Versus Inequality Aversion**
  As you suspected, this is not about the spread of the distribution. You could have a scenario where the loss to Person A is small and the gain to Person B is huge, creating a net positive and a more equal outcome overall. The Separateness objection still holds. The complaint is not that the outcome is unequal, but that the *method of justification* treats two lives as one ledger. It objects to the *cancellation* of distinct experiences, not the *gap* between them.

  **3. Versus Plain Anti-Consequentialism**
  "Anti-consequentialism" is too broad. A deontologist might object to lying even if it saves lives, but that is about the *act type*. The Separateness objection is specifically about *aggregation*. One can be a consequentialist (caring about outcomes) but reject interpersonal aggregation (e.g., a prioritarian who weights the worse off more heavily). The Separateness objection targets the specific move of adding utilities across different people as if they were moments in a single life.

  **4. The Within-One-Life Case (The Litmus Test)**
  This is where the term proves its worth. The Separateness of Persons explicitly **does not** apply to the within-one-life case. Rawls and his successors grant that it is rational for a 30-year-old to suffer for the sake of their 60-year-old self. Why? Because identity persists. The "Separateness" is absent. The objection *only* triggers when the boundary of the person is crossed. This matches your intuition exactly: the arithmetic changes when the loss and gain land in different bodies. If you use this term, you can explicitly state that the objection respects intra-personal trade-offs while rejecting inter-personal ones.

  **Usage Note for Journalism**
  While "The Separateness of Persons" is the settled term in academic ethics, it can sound abstract to a general audience. In your piece, you might introduce it as "the philosophical principle of the separateness of persons." It validates your sources' gut feeling that "nobody lives the total." It gives you a way to say: *The economists are calculating for a society that doesn't exist (a single super-person), while the citizens are living in a society that does (distinct individuals).*

  There are related terms like "Non-Aggregationism" (the policy stance resulting from the objection) or "Person-Affecting View" (mostly used in population ethics regarding future generations), but "Separateness of Persons" is the foundational label for the specific complaint you outlined.

  Verdict: The Separateness of Persons — It identifies the moral error of applying within-life trade-off logic to distinct individuals who cannot share experiences.
