prompt: |-
  So in my social studies class we just did a unit on moral relativism and it kind of broke my brain. The teacher said something like "who are we to judge other cultures" and everyone nodded along but it didn't sit right with me, so afterwards I started testing my gut reactions on alot of cases and writing down verdicts, and now I want to know whether there's an actual principle behind my reactions or if I'm just being inconsistent without noticing. Here's what I've got so far. Chattel slavery: wrong, period — wrong when the Romans did it, wrong when it was legal in the American South, and I don't accept "everyone back then thought it was normal." A remote community where marriages are fully arranged and literally every person in it, including the young people, genuinely endorses the practice and would be upset if it changed: I don't think I'm allowed to call that wrong. Ancient Romans leaving unwanted infants exposed on hillsides: wrong, and I was surprised how sure I felt. My friend Maya says eating factory-farmed meat will look to our grandkids the way slavery looks to us now, and I really want to say she's wrong about that, but I can't find anything that makes my case different from the slavery one except that the meat eating is MY culture doing it, which feels like exactly the move relativism needs me not to make. Cilantro tasting like soap to some people: not even a moral question, nobody's wrong, it's just taste. And a hypothetical culture that sincerely believes suffering simply doesn't matter: I can't picture respecting that at all, it feels like disagreeing with them about arithmetic, not about values.

  My tentative principle was something like "moral disagreements are only relative/untouchable when they bottom out in people's basic values, but absolute when facts could in principle settle them" — but that immediately looks dumb when I test it. The Romans' infanticide probably rested alot on factual beliefs they had (about souls, about what kind of life is worth living), and the meat thing is basically all facts about animal suffering and intelligence, yet my verdicts are opposite on those two cases. So the tentative principle is not obviously working. Maybe you can do better, or maybe you can show me it works with a fix I haven't thought of.

  Please structure your answer with these sections in this order: **My verdicts, restated** (short — just check that you've understood my pattern, one short paragraph), **The best candidate principle** (state it precisely, and show which of my verdicts each part of it is there to capture, about two paragraphs), **What it predicts** (invent two or three new cases I didn't mention — like whether lying is wrong in a society where nobody expects honesty from anyone, or how to think about one lone dissenter inside the happy arranged-marriage village who wants out — and tell me what the principle says about each, one paragraph), and **What I have to give up** (be honest about whether all my verdicts can be saved by one principle, and if not, argue for which one I should drop, one paragraph). Don't just tell me "it's complicated," I want an actual answer I can bring back to class.
