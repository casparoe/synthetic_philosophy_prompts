      *Refining the BLUF:* Needs to be very clear. "Retain traditional periodization as structural scaffolding, but revise unit content to emphasize global connectivity and explicitly teach the constructed nature of these labels."

      *Refining the Argument:*
      1.  Are periods real? No, they are tools.
      2.  Does that mean ditch them? No, tools are useful.
      3.  Student need: Structure for cognitive load + test prep.
      4.  Delgado's need: Accuracy + Global view.
      5.  Solution: Use the map, but teach how the map was drawn.

