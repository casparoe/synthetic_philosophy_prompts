answer: |-
  The debate over whether everyday conventions are genuine moral obligations or merely social facts with penalties often stalls on the intuition that "rules are rules." But rules backed only by shame are not moral duties; they are prudential calculations. To settle this, we must strip away the threat of social punishment and ask what remains. The verdict is this: **Conventions are genuine moral obligations when they underpin cooperative schemes involving reliance interests, but they are merely prudential coordination norms when they do not.** Consequently, the one-shot tourist is morally obligated to tip, but not necessarily obligated to obey jaywalking conventions on an empty street.

  The standard justification for following conventions is reciprocity: I queue because I want others to queue when I am in line. This is a contract among repeated players. However, this collapses under the weight of the "one-shot visitor." Consider the tourist in the US for one week, anonymous and never returning. Reciprocity offers them no reason to tip; they will never be served by this waiter again, nor will anyone they know. If the obligation to tip rests solely on reciprocal advantage, the tourist is off the hook.

  But if the tourist is off the hook, we face a uncomfortable reductio ad absurdum regarding the local. If the moral force of tipping depends on future return interactions, then the local's obligation is also contingent. It implies that locals only tip because they fear future judgment or need future service, not because it is *right*. This reduces the local's behavior to habit and fear rather than morality. To maintain that locals have a genuine moral duty to tip, we must ground that duty in something that applies to the tourist as well.

  That ground is the **Principle of Fair Play**. When a cooperative scheme exists where participants restrain their liberty to produce a benefit for others, anyone who accepts the benefit incurs an obligation to bear their share of the burden. This is not about reciprocity; it is about fairness. In the US tipping system, waiters provide service based on the legitimate expectation of a tip. Their labor structure relies on this norm. When the tourist sits down, orders, and is served, they are accepting the benefits of a scheme sustained by others' compliance. To leave without tipping is to free-ride. It exploits the waiter's reliance on the convention. Therefore, the tourist's obligation is not based on "what if everyone did this" (generalization) or "will I get caught" (penalty), but on the specific unfairness of extracting labor without paying the agreed-upon social price. The obligation binds the tourist because fairness is timeless, not transactional.

  This brings us to the crucial distinction between types of conventions. Not all social norms carry this moral weight. We must distinguish between **reliance-based conventions** (tipping, queueing) and **pure coordination conventions** (jaywalking on an empty street).

  Tipping and queueing are moral obligations because breaking them directly harms specific participants who rely on the system. The waiter loses income; the queue jumper disrespects the time of those who waited. There is a victim. However, jaywalking across a completely empty street in a country where nobody does it is different. This is a coordination norm designed for safety and traffic flow. If the street is truly empty, no cars are delayed, no safety is compromised, and no specific individual relies on your standing on the curb.

  In this second category, the obligation is prudential, not moral. You should not jaywalk because you might get hit (safety) or fined (legal penalty), not because you have wronged a moral agent. If a tourist crosses an empty street at night where no one is watching and no cars are coming, they have violated a law and a convention, but they have not committed a moral wrong. There is no free-riding because there is no cooperative scheme being exploited. The "harm" is abstract (undermining the rule of law), but without risk to persons, the moral dimension evaporates.

  This distinction resolves the tension. If we claimed all conventions were moral obligations, we would be forced to say the tourist sins by crossing an empty street, which seems absurd. If we claimed no conventions were moral obligations, we would have to admit tipping is just a tax on fear, which undermines the dignity of the worker.

  Therefore, we must bite the bullet: **The tourist is morally obligated to tip.** They cannot claim exemption based on their transient status. The fairness owed to the waiter does not expire because the tourist leaves town. To argue otherwise is to admit that morality is merely a long-term selfish strategy, which denies the existence of duty altogether. If the tourist is not obligated to tip, then the local isn't either—they are just bribing society for good treatment. By affirming the tourist's duty, we affirm that the local's duty is real.

  However, we must also accept the corollary: **The tourist is not morally obligated to follow coordination conventions like jaywalking when no harm is possible.** To insist otherwise is to confuse law with morality. A convention that protects no one's interests in a specific instance carries no moral weight in that instance.

  In conclusion, everyday conventions are not monolithic. They are moral obligations when they sustain schemes of cooperation where individuals rely on mutual compliance for their livelihood or dignity. In these cases, the obligation binds everyone who participates in the scheme, regardless of whether they are a local or a one-shot visitor. Fairness does not care about your return ticket. But where the convention is merely about coordination without reliance—like crossing an empty street—the obligation dissolves into prudence. We follow those rules to stay safe and avoid fines, not because we are morally bankrupt otherwise. The tourist must tip the waiter, but they can cross the empty street. That is the difference between morality and mere manners.
