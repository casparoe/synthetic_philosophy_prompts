answer: |-
  The argument you are grappling with is a known challenge in formal epistemology, often called the "Conservatism Objection" or the "Immodesty Problem." Your intuition that the "policy reply" should work is correct, but the mechanism needs to be made explicit to see why your friend's worry ("shouldn't the stay-put policy still win?") is mistaken.

  The diagnosis is that the argument commits a scope error regarding *what* is being evaluated by the expected accuracy calculation.

  ### The Diagnosis

  The fatal flaw lies in the **transition from (3) to (4)**.

  Step (3) is technically correct regarding *static* choices: if you are asked right now to pick a credence function to hold *given your current information*, strict propriety guarantees you should pick your current function $c$. However, Step (4) falsely infers that this static result applies to *dynamic* policies. Updating on evidence is not choosing a single alternative credence function $c'$ to hold unconditionally; it is adopting a *plan* that maps possible evidence $E$ to posterior credences $c_E$.

  When you evaluate the "stay-put" policy versus the "conditionalize" policy from the perspective of your prior $c$, you are comparing two weighted averages. Strict propriety ensures that $c$ expects $c$ to be more accurate than $c_E$ *if you ignore the evidence*. But it also ensures that in the specific worlds where $E$ is true, $c_E$ is more accurate than $c$. Because the "conditionalize" policy switches to the more accurate function precisely in the worlds where $c$ thinks that evidence is likely, the *expected accuracy of the policy* exceeds the expected accuracy of staying put. The argument fails because it treats updating as an unconditional switch (which is irrational) rather than a conditional plan (which is rational).

  ### Why It Looked Innocent

  The step looked harmless because it conflates the optimality of a static credence *state* (which is always immodest) with the optimality of a dynamic updating *rule* (which can modestly prefer a different future state).

