      *   *Correction on Liar:* Be precise. If truth is *just* disquotation, the Liar shows the concept is incoherent. A sophisticated disquotationalist must modify the schema. This weakens the "just" in the slogan.
      *   *Correction on Classmate:* The classmate is moving from Thesis 2 (function) to Thesis 4 (dismissal) without argument. Point this out.
      *   *Generalization:* Ensure the distinction between *finite* disquotation ("Snow is white" is true) and *infinite* generalization (blind ascriptions) is clear. Quine emphasized the latter.

  10. **Final Review against constraints:**
      *   Ordered weakest to strongest? Yes.
      *   Verdicts included? Yes.
      *   Classmate's dismissal addressed? Yes.
      *   Generalization case addressed? Yes.
      *   Liar paradox addressed? Yes.
