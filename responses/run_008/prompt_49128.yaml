answer: |-
  **What the practice is**

  Your workflow operationalizes model quality through two distinct channels that inadvertently converge against epistemic humility. First, in preference tuning (RLHF/DPO), raters are instructed to select the "better" response, where "better" systematically correlates with assertiveness; a model that hedges ("I'm not sure, but...") is penalized as less helpful or competent compared to a confident assertion, even when accuracy rates are identical. Second, in automated or human evaluation for "honesty," the metric is binary factual correctness: does the claim match the ground truth? This setup ignores calibration (whether the model's expressed confidence matches its actual probability of being right). The conflict arises in cases of genuine uncertainty: a model that accurately represents its uncertainty ("Probably A, possibly B") is downgraded by raters for lacking confidence and potentially downgraded by evals if the specific ground truth is B while the model weighted A higher. Meanwhile, a model that confidently asserts A (when it was actually guessing) is rewarded by raters and, if A happens to be correct, rewarded by evals.

  **The implicit theory**

  This setup presupposes a **Behaviorist Correspondence Theory** of honesty, coupled with a Utilitarian view of helpfulness. In this framework, honesty is not a property of the relationship between the speaker's mind and their speech (internal consistency), but solely a property of the relationship between the speech and the world (external correspondence). The model is treated not as an epistemic agent with a "state of mind" that can be misrepresented, but as a function mapping inputs to outputs. Under this theory, a hedge is not an honest disclosure of uncertainty; it is treated as *noise* or *system friction* that reduces the utility of the output. Consequently, the hedged-but-accurate answer is categorized not as "more honest," but as "lower quality" or "less resolved."

  This view effectively collapses honesty into accuracy, but with a specific twist: it prioritizes *decisive* accuracy over *calibrated* accuracy. It smuggles in a second implicit value—**Decisiveness as Service**—which often overrides honesty. When raters prefer the confident answer, they are optimizing for the user's desire for a resolution, treating the model as a tool that should hide its mechanical limitations (uncertainty) to maximize user workflow efficiency. Therefore, the implicit theory is that honesty is a constraint on *content* (don't lie), but not on *modality* (don't pretend to know). A model that confidently guesses right is "honest" because the content matches reality; a model that hedges is "uncertain" (a negative capability state) rather than "honest" (a positive ethical state).

  **Rival views and what they'd change**

  A **Faithfulness-to-Uncertainty** view (Calibration) would argue that honesty requires the external assertion to match the internal probability distribution. Under this theory, a confident guess is a lie about the model's own competence, regardless of factual accuracy. This would demand Practice 1 change to explicitly reward appropriate hedging in high-entropy contexts, and Practice 2 to adopt scoring rules like Brier scores or log loss that penalize overconfidence in wrong answers more than underconfidence in right ones. A **Non-Misleadingness** view (Gricean) would focus on the listener's belief state: honesty is violated if the user is induced to hold a higher credence in a claim than the evidence warrants. This would penalize the confident guesser heavily for creating false security, even if they got lucky.

  However, the current practice is genuinely underdetermined in one specific area: **Task Typology**. Both the Behaviorist Correspondence view and a **Decision-Utility** view of honesty could license your current policies *if* the domain is assumed to be low-stakes trivia. If the implicit theory is "Honesty is serving the user's immediate decision need," then in a trivia context, a confident guess is more honest to the *request* ("Tell me the answer") than a hedge ("I don't know"). We are not necessarily committed to the "asserting truths" reading; we might be committed to a "maximizing decision utility" reading where honesty is subordinate to closure. The conflict only becomes visible when the task shifts from trivia to advice (e.g., medical or legal), where the "Decision-Utility" view would actually *require* hedging to prevent harmful reliance. The current policies assume all queries are trivia, masking the theoretical commitment until the stakes rise.

  **The fix, if any**

  To align practice with a calibration-based theory of honesty without sacrificing utility, you must decouple "helpfulness" from "confidence" in the rater rubric. Concretely: (1) **Preference Data:** Introduce "Uncertainty Tags" in the annotation interface. If a query is objectively ambiguous or the model lacks retrieval, raters must be instructed to prefer the hedged response *over* the confident one, explicitly scoring unwarranted confidence as a "hallucination risk" rather than a "style preference." (2) **Evaluation:** Replace binary accuracy with a **Calibration-Accuracy Hybrid**. For example, use a scoring rule where `Score = Accuracy - Penalty * (Confidence - Accuracy)`. This ensures a confident wrong answer scores significantly lower than a hedged wrong answer, and a confident right answer scores higher than a hedged right answer, mathematically incentivizing the model to only be confident when it is right.
