answer: |-
  It starts with the rotting of the **keel**,
  replaced by a fresh and sturdy **plank**.
  Then wind shears off the top of the **mast**,
  fraying the tension of every **rope**,
  tearing the canvas of the white **sail**,
  snapping the wood of the steering **oar**.

  We did not wait for the breaking **oar**,
  but scheduled the change of the **keel**,
  under the shade of the idle **sail**,
  swapping out each weathered **plank**,
  according to the tension of the **rope**,
  in shadow of the standing **mast**.

  Yet someone gathered up the old **mast**,
  and the discarded steering **oar**,
  coiling tight the discarded **rope**,
  digging up the original **keel**,
  storing away each saved **plank**,
  beneath the cover of the old **sail**.

  They built a rival hull beneath the **sail**,
  raising high the original **mast**,
  nailing tight each saved **plank**,
  fitting back the original **oar**,
  to rest upon the saved **keel**,
  binding it all with hemp **rope**.

  We followed a strict **rope**,
  not random wind against the **sail**,
  a rhythm set along the **keel**,
  ascending to the top of the **mast**,
  rhythmic as the dip of the **oar**,
  replacing every rotting **plank**.

  Two ships float on one **plank** of history,
  bound by neither **rope** nor logic,
  one driven by the new **oar**,
  one hidden beneath the old **sail**,
  one leaning on a new **mast**,
  one resting on the old **keel**.

  If I swap each **plank** for wood beneath the **sail**,
  Does the song hold tight, same **rope** to same **mast**?
  Or is it a new **oar** rowing from the same **keel**?
