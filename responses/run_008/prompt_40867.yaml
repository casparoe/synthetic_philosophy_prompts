answer: |-
  You have put your finger on a genuine inconsistency that often goes unremarked in rationalist metaphysics. The community largely adopts a **Patternist** view for forward-looking questions (uploads, teleportation) but defaults to **Origin Essentialism** for backward-looking questions (conception, cloning).

  Here is the breakdown of the academic terminology, the specific problem with twins, and the boundaries between the views you are distinguishing.

  ### 1. The Name of the View: Origin Essentialism

  The view that your identity is necessarily tied to the specific material origins from which you developed (the specific sperm and egg, or the specific zygote) is called **Origin Essentialism**.

  The canonical source is Saul Kripke's *Naming and Necessity* (1970/1980). Kripke argues via modal intuition that a specific individual (e.g., Queen Elizabeth II) could not have been born of different parents. In possible worlds semantics, if you trace a person back to their origin, that origin is a **rigid designator** for their identity. If the gametes differ, it is a *different* person, even if that person is qualitatively identical to you.

  Within the philosophy of biology, this is often coupled with **Animalism** (championed by Eric Olson in *The Human Animal*). Animalism posits that you are identical to a specific biological organism. Since biological organisms are individuated by their continuous life process starting from a specific zygote, you cannot be a different organism, even one with the same genome.

  **Why Rationalists Switch:**
  The rationalist inconsistency you noticed arises because Patternism solves the *fear of death* (uploads survive), while Origin Essentialism solves the *fear of replaceability* (my sibling isn't me).
  *   **Patternism** says: "If the computation continues, I survive." (Good for uploading).
  *   **Origin Essentialism** says: "If the history diverges, I do not exist." (Good for distinguishing self from clones).
  *   **The Conflict:** If you are the pattern, a clone with the same genome and upbringing *should* be you (or at least, the distinction shouldn't be "full stop someone else"). If you are the origin, an upload *should not* be you. Holding both simultaneously requires a hybrid view that rarely survives scrutiny.

  ### 2. The Twin Case: The Fission Objection

  You asked if the shared-origin twin case is a known embarrassment for Origin Essentialism. **Yes.** In metaphysics, this is a variant of the **Fission Problem**.

  If identity is determined by origin (Zygote Z), and Zygote Z splits into Twin A and Twin B:
  1.  **Transitivity of Identity:** If A = Z and B = Z, then A = B.
  2.  **Observation:** A ≠ B (they are two distinct people occupying different spaces).
  3.  **Conclusion:** Origin alone cannot determine identity.

  **How Essentialists Handle This:**
  There are three standard moves in the literature to patch Origin Essentialism against the twin objection:

  *   **The "No-Branching" Clause:** Borrowed from Parfit. Identity requires origin *plus* non-branching continuity. If the origin splits, the original identity ceases, and two *new* identities begin. This saves the logic but concedes that origin isn't *sufficient* for identity.
  *   **Delayed Personhood:** Some Essentialists argue the "origin" isn't the zygote, but the **primitive streak** (approx. 14 days), after which twinning can no longer occur. This preserves the "unique origin" requirement but weakens the "specific sperm/egg" intuition, as the matter has already turned over significantly by day 14.
  *   **Constitution View:** The zygote constitutes the *lineage*, but identity is a property of the developed organism. When splitting occurs, the single organism ceases and two new organisms are constituted from its matter. (This is Olson's preferred route).

  So, the twin case does not destroy Origin Essentialism, but it forces it to become more complex than the simple "specific sperm = specific you" heuristic your friends are using.

  ### 3. Drawing the Boundaries

  You asked for a well-drawn distinction between the three views. Here is how they commit to different criteria for "Same Person."

  | Feature | **Patternism (Functionalism)** | **Psychological Continuity (Locke/Parfit)** | **Origin Essentialism (Kripke/Olson)** |
  | :--- | :--- | :--- | :--- |
  | **Core Criterion** | Computational/Structural Isomorphism. | Causal Chain of Memory/Personality. | Historical/Material Lineage. |
  | **The Upload** | **Yes.** Substrate independent. | **Yes**, if psychological chain is preserved. | **No.** The organism died; the upload is a copy. |
  | **The Clone** | **Maybe/Yes.** If pattern matches closely enough. | **No.** No causal psychological link. | **No.** Different gametes/zygote = different person. |
  | **The Twin** | **No.** Distinct patterns after split. | **No.** Distinct psychological streams. | **Problematic.** Requires "No-Branching" clause. |
  | **Time Dependence** | **History Independent.** (Can be recreated). | **History Dependent.** (Requires causal chain). | **History Dependent.** (Requires specific start point). |
  | **What Matters** | The *Information*. | The *Connection*. | The *History*. |

  #### The Specific Gap You Identified
  The intuition your friends are expressing ("Different sperm = Someone Else") is strictly **Origin Essentialist**.
  The intuition they hold on uploads ("Faithful upload = Me") is strictly **Patternist**.

  These are logically incompatible without a major caveat.
  *   If you are the **Pattern**, then a clone (who shares the genetic pattern and potentially the environmental pattern) is closer to you than an upload (which might have simulation errors). Yet they say the clone is "someone else."
  *   If you are the **Origin**, then the upload is "someone else" (a new computational origin). Yet they say the upload is "you."

  **The Likely Hidden Premise:**
  Many rationalists implicitly hold a view called **Biological Patternism**. This is the view that *you are the pattern, but only as instantiated by this specific biological history.*
  *   **Commitment:** The pattern matters, but it must be causally descended from the specific zygote.
  *   **Failure Point:** This view collapses under the **Teletransportation Paradox**. If the pattern is destroyed and recreated (Parfit's teleporter), Biological Patternism says you die. If the pattern is copied while the original lives (fission), it struggles to say which one is "you."

  ### Summary for Your Discussions

  1.  **The Name:** The view that specific gametes are non-negotiable is **Origin Essentialism** (Kripke).
  2.  **The Embarrassment:** The monozygotic twin case is the **Fission Objection**. It proves origin is necessary but not sufficient for identity, forcing Essentialists to add a "non-branching" clause.
  3.  **The Distinction:**
      *   **Patternism** cares about *Structure*. (Upload = Yes, Clone = Maybe).
      *   **Psychological Continuity** cares about *Causal Mental Links*. (Upload = Yes, Clone = No).
      *   **Origin Essentialism** cares about *Material History*. (Upload = No, Clone = No).

  Your friends are likely **Origin Essentialists about the past** (to preserve uniqueness) and **Patternists about the future** (to preserve survival). Pointing out that this hybrid view implies a clone with your memories is *less* "you" than a digital simulation of your brain is a strong way to expose the tension. The clone shares the origin *type* (genome) but not the *token* (zygote); the upload shares the *pattern* but not the *substrate*. Asking them to rank which deviation kills "you" sooner usually forces them to pick a side.
