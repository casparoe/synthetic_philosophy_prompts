      *   *Better Idea: An Institution or a Regime.* Or perhaps *A Narrative Tradition.*
      *   *Best Fit:* **A Complex Adaptive System with Institutional Memory.** (A bit dry).
      *   *More Conversational Fit:* **A Multi-Generational Family Business with a Franchise Model.**
          *   *Why:* It captures the "brand" (national identity), the changing staff (citizens), the legacy decisions (founders), and the internal conflict (board members).
      *   *Alternative:* **A Ship of Theseus.** (Classic philosophy). Good for identity over time, but doesn't capture agency well.
      *   *Selection:* Let's stick with the **Institution/Organization** analogy but refine it. A "Corporation" or "University" works better than a "Person." A University has a "character" (elite, sports, rigorous) but is made of changing people and rules.

  6.  **Define the "Legitimate Version" (What Historians Actually Do):**
      *   Historians *do* use collective subjects ("France declared war").
