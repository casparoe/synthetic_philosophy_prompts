  3. The game
  Divide the class into 13 Bettors and 1 Laplace's Demon. The Demon receives a private card with $x_0$ to 15 decimal places (e.g., 0.314159265358979). The Bettors see $x_0$ projected only to two decimals (0.31). The governing rule $x_{n+1} = 4x_n(1-x_n)$ is displayed prominently. The Demon's task is to publish specific forecasts for $x_{10}, x_{20},$ and $x_{30}$ on the whiteboard before the first iteration occurs. This commits the Demon to the deterministic ideal.

  **Phase 1: The Information Market (15 mins).** Bettors begin with 100 tokens each. They may purchase "Precision Upgrades" from the facilitator. Each upgrade reveals one additional decimal digit of $x_0$ for a cost of 15 tokens. Students must decide how much of their endowment to spend on knowledge versus keeping capital for wagering. The Demon pays nothing for precision but faces public scrutiny.

  **Phase 2: The Betting Floor (40 mins).** The facilitator iterates the map, revealing one $x_n$ per minute. Before each reveal, students place wagers on the state of the system $k$ steps in the future ($x_{n+k}$). They bet binary: "High" ($>0.5$) or "Low" ($<0.5$). Bets are written on slips and sealed in a box. The cost to bet is $k$ tokens; the payoff is a fixed 25 tokens. This payoff structure is critical: if a student's precision horizon is exceeded, the outcome becomes effectively random (50% chance). Consequently, betting on $k=20$ without sufficient precision yields an expected loss of 7.5 tokens per bet. Students will rapidly lose wealth if they bet far ahead without buying digits. They will feel the "exchange rate": roughly three extra digits are required to safely extend the betting horizon by ten steps. The facilitator acts as a strict banker, accepting no verbal hints about why bets fail.

  **Phase 3: The Ontological Crash (25 mins).** Unbeknownst to the students, the projector runs on standard 64-bit floating-point arithmetic. Around iteration 55, the chaotic sequence will abruptly collapse to 0 or a short cycle. The Demon, calculating with high-precision libraries, will predict a chaotic value. The projector will display the periodic value. The Demon is proven "wrong" by the system's actual behavior. Bettors who wagered on continued chaos lose everything. The game ends not when students choose, but when the computer's finite memory dictates the universe has ended. The sudden silence when the numbers stop changing is the pedagogical climax.

  4. Debrief
  Gather the tokens and ask the bankrupt students why they lost despite knowing the rule. This illustrates **sensitive dependence**: knowing the law is insufficient without exact state measurement. Highlight the "Information Market": students who bought 5 digits could predict 5 steps further than those with 2 digits. This empirically demonstrates the **logarithmic prediction horizon** (1 bit $\approx$ 1 step). Did they notice the cost of precision matched the gain in prediction?

  Then, address the Demon. The Demon had perfect knowledge yet failed when the sequence collapsed into a loop. Ask: "Did the system stop being chaotic, or did our representation fail?" This forces the distinction between **mathematical chaos** (infinite precision) and **computational chaos** (finite precision). Connect to STS students: measurement tools construct the reality observed. The periodicity isn't a bug; it's a feature of digital physics. Conclude by asking if physical systems also "round off" due to Planck limits, making the universe potentially periodic rather than chaotic. The game shows determinism is intact (the code followed rules), but predictability vanished, and eventually, the model's ontology broke down.

  5. What will go wrong the first time I run it
  Students might collude to pool tokens and buy max precision, bypassing the lesson on scarcity. The "crash" to periodicity might happen too early (iteration 20) or too late (iteration 100), ruining the timing. The Demon might realize the float limitation beforehand if they peek at the code. Finally, 80 minutes is tight; the betting phase often drags as students calculate odds. Have a pre-calculated sequence ready to paste if the live code lags. Students may focus on gambling strategy rather than epistemology. Keep the debrief strict.

  6. What this activity cannot reproduce
  This simulation cannot reproduce physical noise. In real systems, measurement error isn't just missing digits; it's stochastic interference. Also, the logistic map is discrete time; continuous flows feel different. Most importantly, the game cannot resolve the metaphysical question it raises. It shows models are finite, but cannot tell us if nature is. That leap requires philosophical argumentation you must supply.
