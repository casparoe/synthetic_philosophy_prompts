prompt: |-
  I'm teaching a mid-level ethics seminar — 14 students, one 90-minute session. They've read Scanlon on principles that no one could reasonably reject, but we haven't touched the aggregation problem yet. Design an in-class decision game where they have to allocate a scarce good (medical treatments, disaster relief slots, organ transplants — whatever works best) under two different decision rules, run back to back on the same set of cases: first a straight majority vote, then a rule where a proposal only passes if no one's individual complaint is severe enough to sink it — each participant secretly rates how bad the outcome is for them personally, and the single worst complaint can block a proposal no matter how many people mildly prefer it. The point is that they should feel the gap between adding up preferences and taking the worst-off complaint seriously, and then run straight into the hard part: when (if ever) do enough tiny complaints start to outweigh the one big one, and where exactly do they draw that line and why. I want rules, materials, timings, a scoring scheme that doesn't use real money, and a debrief that maps what actually happened onto the distinction between aggregative and complaint-based reasoning — including whatever the students' own line-drawing turns out to be. Also tell me what will predictably go wrong the first time I run it — my guess is a couple students will just refuse to engage with the second rule because it feels rigged, how do I handle that without lecturing them? — and be honest about which part of the aggregation problem the game can't reproduce and I'll have to supply myself. Keep the whole thing inside the 90 minutes including the debrief, and dont make the setup require more than paper and pens.
