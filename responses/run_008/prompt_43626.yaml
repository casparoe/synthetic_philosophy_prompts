answer: |-
  # Seminar Plan: The Aggregation Game
  **Topic:** Scanlonian Contractualism vs. Aggregative Utilitarianism  
  **Time:** 90 Minutes  
  **Students:** 14  
  **Materials:** Paper, pens, 14 envelopes (prepared beforehand), whiteboard.

  ## I. Preparation (Before Class)
  Prepare 14 "Role Cards" (slips of paper inside opaque envelopes).
  *   **1 Card (The Critical):** "Condition: Fatal. Outcome without treatment: Death. Severity Score: 100."
  *   **3 Cards (The Severe):** "Condition: Chronic. Outcome without treatment: Permanent Disability. Severity Score: 50."
  *   **10 Cards (The Moderate):** "Condition: Acute. Outcome without treatment: Temporary Pain. Severity Score: 10."

  **The Scenario:** The class is a disaster triage unit. There are **10 doses** of a life-saving treatment. **14 patients** (the students) need it. 4 will go without.

  ## II. In-Class Timeline (90 Minutes)

  ### 0:00–0:10 | Setup & Role Assignment
  1.  **Hand out envelopes.** Instruct students **not** to open them yet.
  2.  **Explain the Stakes:** "You are patients. You want a dose. If you don't get one, you suffer the outcome on your card. You do not know anyone else's card."
  3.  **Instruction:** "Open your cards. Keep them secret. Write your Severity Score on a slip of paper, fold it, and keep it in your pocket. You will only reveal this if the rules demand it."
  4.  **Goal:** Maximize your own survival/wellbeing. You are not required to be altruistic.

  ### 0:10–0:25 | Round 1: The Aggregative Rule (Majority Vote)
  1.  **Rule:** "We will vote on a distribution list. A proposal passes if **8 or more** students vote Yes (Simple Majority)."
  2.  **Proposal:** Ask for a volunteer to propose a list of 10 names who get the treatment. (Predictably, a coalition of the 10 'Moderate' cards will try to form and exclude the 'Critical' and 'Severe' to save themselves, or the 'Severe' will try to ally with 'Moderates').
  3.  **The Twist:** If no one volunteers, *you* propose the Utilitarian Solution: "We save the 10 people with the highest Severity Scores." (This saves the Critical, the 3 Severe, and 6 Moderates. It sacrifices 4 Moderates).
  4.  **Vote:** Secret ballot. Yes/No.
  5.  **Outcome:** Tally the vote. If it passes, those 10 "survive." If it fails, no one gets treatment (chaos outcome).
  6.  **Board Work:** Write the **Total Utility Score** of the survivors on the board (Sum of Severity Scores of those who got treatment).

  ### 0:25–0:40 | Round 2: The Complaint Rule (Veto Power)
  1.  **Rule:** "We propose a new list of 10 names. However, **any single person excluded from the list** may reveal their Severity Score. If their score is **higher** than the score of *anyone included* in the list, they exercise a **Veto**. The proposal fails. No one gets treatment."
      *   *Translation:* You cannot give a dose to someone with a minor complaint while denying it to someone with a major complaint. The worst-off individual has priority.
  2.  **Proposal:** Ask for a new list of 10 names.
  3.  **Process:** Before voting, ask the excluded 4: "Does anyone here have a higher score than anyone on the list?"
      *   *Scenario A:* If the Critical (100) is excluded, they Veto. (Likely outcome if students try to vote selfishly again).
      *   *Scenario B:* If the Critical is included, the Veto doesn't trigger.
  4.  **Board Work:** Record if the Veto was triggered. Record the **Total Utility Score** of this round.

  ### 0:40–1:00 | The Aggregation Challenge (The "Line Drawing" Phase)
  *This is where you pivot from game to philosophy.*

  1.  **The Setup:** "In Round 2, the single worst complaint blocked the many. But Scanlon admits aggregation isn't *always* irrelevant. Let's test the limit."
  2.  **Hypothetical 1:** Turn to the 10 'Moderate' students (Score 10). "Imagine your cards weren't 'Temporary Pain' (10). Imagine they were 'Lost Leg' (90). The Critical person is still 'Death' (100). Does the Critical person still have the right to Veto a plan that saves the 10 'Lost Leg' people but sacrifices them?"
      *   *Show of hands:* Who says the Veto holds? Who says the 10 override the 1?
  3.  **Hypothetical 2:** "What if it was 1 Death (100) vs. 1,000 people with a Headache (1 each)? Total utility of headaches = 1,000. Does the Veto hold?"
  4.  **The Task:** Ask students to write down on a slip of paper: **"The Threshold."** At what point do enough small complaints outweigh one big one? (e.g., "10 lost legs outweigh 1 death" or "Never").
  5.  **Collection:** Collect these slips. Read 3-4 aloud anonymously.

  ### 1:00–1:25 | Debrief & Mapping to Scanlon
  **Goal:** Map their visceral reactions to the theory.

  1.  **The Frustration (Addressing the "Rigged" Feeling):**
      *   *Ask:* "In Round 2, who felt the Veto rule was unfair? Why?"
      *   *Likely Answer:* "It lets one person hold us hostage." "It ignores the greater good."
      *   *Scanlon Connection:* "Scanlon calls this the difference between **Utilitarian Aggregation** (summing welfare) and **Individual Justification** (can I justify this loss to *this* person?). If you felt angry that your minor pain was ignored in Round 1, you felt the Utilitarian flaw. If you felt angry that one person blocked everyone in Round 2, you felt the Contractualist cost."
      *   *Handling the Refusal:* If a student says, "I wouldn't play Round 2, it's stupid," respond: "That resistance is the data. Scanlon knows this rule is costly. He argues it's the only cost compatible with respecting people as equals. Do you agree that respecting the 'Critical' person requires giving them that veto, even if it hurts the group?"

  2.  **The Aggregation Problem:**
      *   Review the "Threshold" slips they wrote.
      *   *Point out:* "Some of you said 'Never aggregate.' Some said 'Always aggregate.' Most drew a line somewhere in the middle."
      *   *Scanlon's View:* Scanlon is wary of aggregation. He argues we compare *individual* complaints. A death is a stronger complaint than a headache. But is it stronger than 1,000 headaches?
      *   *The Hard Part:* "The game couldn't tell you where the line is. Scanlon doesn't give a formula either. He asks: **Is the rejection reasonable?** Is it reasonable for the 1,000 headache people to reject a principle that sacrifices them for one death? That's the work you have to do."

  3.  **Generic vs. Specific Reasons:**
      *   *Crucial Distinction:* "In this game, you vetoed because *you* personally would die. Scanlon says principles can't be rejected based on specific personal stakes ('I don't want to die'), but on **generic reasons** ('No one should die if avoidable')."
      *   *Why this matters:* "If we used generic reasons, the 'Critical' person argues from the principle of preserving life. The 'Moderates' argue from the principle of minimizing total suffering. The game simulated the conflict; Scanlon provides the language for the resolution."

  ### 1:25–1:30 | Wrap Up
  *   **Summary:** "Today you felt the tug-of-war. Utilitarianism sums the pain; Contractualism protects the worst-off. The aggregation problem is the gap between them."
  *   **Assignment:** "For next week, read Scanlon's section on 'Aggregation.' Write one paragraph: Based on your 'Threshold' slip today, would Scanlon call your threshold 'reasonable'? Why?"

  ---

  ## III. Predictable Failure Modes & Fixes

  **1. The "Rigged" Revolt (Round 2)**
  *   **What happens:** The majority (Moderates) realize the Veto rule makes their vote meaningless if the Critical person says "No." They may refuse to propose a list, or vote "No" out of spite, causing the "No one gets treatment" outcome.
  *   **How to handle:** Do not apologize for the rule. Lean into it.
      *   *Say:* "This feels like tyranny. Good. To the Utilitarian, this is inefficiency. To the Contractualist, this is *protection*. If you are the Critical person, does this feel like tyranny or survival? If you are Moderate, does Round 1 (Majority) feel like democracy or mob rule? The theory lives in that discomfort."
  *   **Prevention:** Frame Round 2 not as a "vote" but as a "justification check." "You aren't voting; you are checking if the proposal is *rejectable*."

  **2. Collusion/Altruism**
  *   **What happens:** Students might lie about their scores or let the Critical person win out of kindness, ruining the tension.
  *   **How to handle:** Emphasize the "Veil of Ignorance" aspect during setup. "You don't know who has the Critical card. Play for your own survival." If they are too nice, *you* play the villain in the debrief. "You were nice today. What if you didn't know them? What if this was national policy?"

  **3. Math Paralysis**
  *   **What happens:** In the "Threshold" phase, students try to calculate exact utility numbers.
  *   **How to handle:** Stop the math. "Don't calculate. Intuit. At what point does your gut say 'Okay, the many win'?"

  ---

  ## IV. Limitations of the Game (Instructor Notes)
  *Be honest about these in the debrief so students don't conflate the game with the theory.*

  1.  **Outcomes vs. Principles:** The game focuses on *who gets the drug* (outcomes). Scanlon is about *what principles we live by* (e.g., "Always save the worst off"). A principle might lead to bad outcomes sometimes but still be justifiable.
  2.  **Specific vs. Generic:** In the game, the Critical person vetoes because *they* die. In Scanlon, they reject because *anyone* in that position would have a generic reason to reject. The game personalizes the complaint; Scanlon generalizes it.
  3.  **The Numbers Problem:** This game tests *Intensity* (Death vs. Headache). The hardest aggregation problem is *Numbers* (1 Death vs. 5 Deaths). The game doesn't reproduce the "Save the 5" dilemma well. You must supply this verbally in the debrief.
  4.  **Secret vs. Public:** The game uses secret ballots/vetoes. Contractualism requires public justification. You cannot secretly veto in Scanlon's framework; you must give a reason others could not reasonably reject.

  ## V. Scoring Scheme (Non-Monetary)
  *   **Round 1 Score:** Sum of Severity Scores of the 10 winners. (Max possible: 100 + 50+50+50 + 10x7 = 320). Write this on the board as "Total Welfare."
  *   **Round 2 Score:** Binary. "Principle Upheld" (Yes/No).
  *   **Comparison:** "Round 1 maximized welfare. Round 2 protected the individual. Which score matters for ethics?"

  ---

  ## VI. Materials Checklist
  *   14 Envelopes with Role Cards inside.
  *   14 Slips of blank paper (for secret severity scores).
  *   Whiteboard markers.
  *   Timer (phone).
  *   Collection box/bowl for the "Threshold" slips.
