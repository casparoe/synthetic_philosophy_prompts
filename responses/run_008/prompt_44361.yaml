prompt: |-
  I direct a five-person risk-analysis unit at a state agency that publishes a quarterly bulletin ranking the hazards facing our region — flooding, wildfire, dam failure, contamination of the water supply, and newer entries such as cyber incidents at public utilities. Each hazard line carries a probability, and the numbers are a mess. Some come from frequency data (vehicle and workplace accident rates), some from engineering models (dam breach analyses), and some are one-off judgments by our senior analyst, such as a figure for the regional water authority consolidating within a decade. We were recently embarrassed in a legislative hearing when a member asked what the "100-year flood" figure means for a specific river gauge next spring: two of my analysts gave incompatible answers, one treating it as a long-run frequency and one as a degree of belief, and neither addressed the fact that the public will read "1% per year" as a claim about next year at that spot.

  Please write a review procedure my team can run on every probability statement before it goes into the bulletin, built on the actual differences between the interpretations of probability: relative frequency in a reference class, degree of belief — and whose belief, anchored to what evidence — and, if we ever want to invoke it, single-case propensity. The procedure should consist of ordered steps. For a candidate statement, it should first settle what kind of quantity the number could be: is there a defensible reference class with real frequency data behind it, is the event a token one-off, is the number anchored to a model or to a person. It should then specify what grounding and what checks each kind requires — for example, that a subjective number be attributed to a stated body of evidence and, where possible, scored later against outcomes for calibration. It should mark where the procedure terminates with "publish no number, use words," and where it stops being a matter of facts and hands the decision to an editor. I specifically want the reference-class problem named and handled honestly: when our dam-failure figure depends on whether the class is "earthen dams of this vintage nationally" or "earthen dams on comparable geology in this state," the choice changes the number by an order of magnitude, and no formula selects the class for us.

  Constraints: a reviewer gets fifteen minutes per statement; the team is one statistician, two engineers, and two generalists, so nothing can assume fluency in measure theory or Bayesian formalism; and every published number must be traceable, because these figures get quoted in hearings, so each step should leave a one-line record of what was checked.

  Then run the procedure on three statements from our current draft: (1) a 1% annual chance of a flood exceeding the 100-year stage at a named gauge, where the return-period figure comes from a national method but will be read as next year's risk at that location; (2) a 0.2% probability of a 1931 earthen dam failing within twenty years, where our two candidate reference classes disagree by an order of magnitude; and (3) the senior analyst's 30% figure for water-authority consolidation within a decade — a number I would like to keep, and on which I want the procedure applied honestly even if it strips the number or forces me to sign off on an explicit judgment call. Close by saying what the procedure cannot do — in particular, whether it can make two analysts converge on the same number for the one-off cases, and whether anything short of rewriting the bulletin can stop the public from reading every figure as a claim about next year.
reasoning: |-
  Here's a thinking process that leads to the suggested review procedure and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Director of a five-person risk-analysis unit at a state agency.
      *   **Task:** Create a review procedure for probability statements in a quarterly bulletin, then apply it to three specific draft statements.
      *   **Core Problem:** Inconsistent interpretations of probability (frequency vs. belief vs. propensity), public misunderstanding (100-year flood confusion), reference class ambiguity (dam failure), and traceability/accountability needs.
      *   **Constraints:**
          *   15 minutes per statement review.
          *   Team composition: 1 statistician, 2 engineers, 2 generalists (no heavy math jargon).
          *   Traceability: One-line record per step.
          *   Must handle the "Reference Class Problem" honestly.
          *   Must specify when to "publish no number, use words."
          *   Must distinguish between fact-checking and editorial judgment.
      *   **Output:**
          1.  The Review Procedure (ordered steps).
          2.  Application of the procedure to three specific cases.
          3.  Closing reflection on limitations (convergence on one-offs, public misunderstanding).

  2.  **Drafting the Review Procedure:**

      *   *Goal:* A checklist that forces clarity on *what* the number means before checking *if* it's right.
      *   *Time Limit:* 15 minutes means it needs to be punchy, binary decisions where possible, and not require running new models.
      *   *Steps:*
          1.  **Classification:** What *kind* of probability is this? (Frequency, Belief, Propensity).
          2.  **Reference Class Check (if Frequency):** Is the class defined? Is it stable?
          3.  **Evidence Anchor (if Belief):** Whose belief? Based on what?
          4.  **Single-Case Check:** Is this a one-off? (Propensity/Belief).
          5.  **Communication Check:** Will the public misread this? (The "Next Year" test).
          6.  **Decision:** Publish Number, Publish Range, or Publish Words.
          7.  **Sign-off:** Who owns this?
      *   *Traceability:* Each step needs a "Log Entry" field.
      *   *Reference Class Problem:* Needs a specific step where the analyst must explicitly state the class and acknowledge alternatives.

      *(Self-Correction during drafting)*: Make sure the distinction between "Fact Check" and "Editorial Judgment" is clear. The procedure should stop at "Fact Check" if the data is solid, but flag "Editorial Judgment" when the reference class is arbitrary.

  3.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: 1% Annual Flood Chance (100-year flood).**
          *   *Type:* Frequency (historical data/model).
          *   *Issue:* Public reads it as "next year" or "specific spot risk" vs. long-term average.
          *   *Reference Class:* Historical flow at that gauge.
          *   *Decision:* Keep number but add heavy qualification or switch to "Words + Number".
          *   *Trace:* Log the mismatch between statistical definition and public perception.

      *   **Case 2: 0.2% Dam Failure (1931 earthen dam).**
          *   *Type:* Frequency (but unstable class).
          *   *Issue:* Reference class problem (National vs. State/Geology). Order of magnitude difference.
          *   *Decision:* Cannot publish a single precise number. Must publish range or words.
          *   *Trace:* Log the two classes and the resulting variance.

      *   **Case 3: 30% Water Authority Consolidation.**
          *   *Type:* Degree of Belief (Subjective).
          *   *Issue:* One-off event. No frequency data.
          *   *Decision:* Can keep, but must attribute to "Expert Judgment" and define evidence.
          *   *Trace:* Log the analyst's name and the evidentiary basis (e.g., legislative trends).

  4.  **Drafting the Closing Reflection:**

      *   *Limitations:*
          *   Can it force convergence on one-offs? No. Subjective probability is inherently personal. The procedure exposes the disagreement, doesn't solve it.
          *   Can it stop public misreading? No. Cognitive bias (seeing 1% as "safe for 99 years" or "happening next year") is deep. Only plain language warnings help, not procedure.
      *   *Tone:* Professional, candid, directive (since I am the Director writing for the team).

  5.  **Refining the Content (Iterative Polish):**

      *   *Check Constraints:* 15 minutes? The steps need to be quick. No running new simulations. Just checking documentation.
      *   *Team Skills:* Avoid "Bayesian formalism." Use "Degree of Belief" or "Expert Judgment."
      *   *Traceability:* Ensure every step has a "Log Line" instruction.
      *   *Reference Class:* Make sure Step 2 explicitly names the problem.
      *   *Termination:* Clearly define the "Publish Words" exit ramp.

  6.  **Final Review against Prompt:**

      *   Did I name the reference class problem? Yes.
      *   Did I handle the three interpretations (frequency, belief, propensity)? Yes.
      *   Is there a 15-minute constraint acknowledgement? Yes.
      *   Did I run the three specific cases? Yes.
      *   Did I address the closing questions (convergence and public understanding)? Yes.

  7.  **Final Polish:** Ensure the voice is appropriate for an internal agency memo/directive. (Decided to frame it as a Standard Operating Procedure document).

  *(Self-Correction on Case 1)*: The prompt mentions the embarrassment about "next spring." The procedure must flag this specifically. The "1% per year" is an average, not a prediction for *next* year. The review must catch if the text implies the latter.

  *(Self-Correction on Case 2)*: The prompt says the class choice changes the number by an order of magnitude. The procedure should force the publication of *that uncertainty* rather than hiding it.

  *(Self-Correction on Case 3)*: The Director wants to keep the 30%. The procedure shouldn't ban it, but must force transparency (attribution).

  8.  **Constructing the Output.** (Proceeding to generate response based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Risk-Analysis Unit (Statistics, Engineering, General Staff)
  **FROM:** Director
  **SUBJECT:** Standard Operating Procedure 004: Probability Statement Review (PSR)
  **EFFECTIVE:** Immediately

  ### I. PURPOSE
  To ensure every probability figure in the Quarterly Hazard Bulletin is interpretable, defensible, and traceable. This procedure forces explicit classification of probability types (Frequency, Belief, Propensity) and exposes the "Reference Class Problem" before publication.

  ### II. CONSTRAINTS
  *   **Time:** 15 minutes per statement.
  *   **Skill Level:** No advanced measure theory required. Focus on data source and semantic meaning.
  *   **Traceability:** Each step requires a one-line "Audit Log" entry.

  ### III. THE PROCEDURE (7 STEPS)

  **Step 1: Classification**
  Identify the nature of the number. Select one:
  *   **A. Relative Frequency:** Based on countable past events (e.g., accident rates, flood gauges).
  *   **B. Degree of Belief:** Based on expert judgment regarding a unique or non-repeatable event (e.g., policy changes, consolidation).
  *   **C. Propensity:** Based on physical models of a specific system (e.g., dam breach physics).
  *   *Audit Log:* [State Type A, B, or C]

  **Step 2: Reference Class Check (Types A & C only)**
  If Frequency or Propensity, define the "Reference Class" (the group of similar past events or systems used to generate the number).
  *   **Question:** Is there more than one defensible class? (e.g., "All dams" vs. "Dams on this geology").
  *   **Action:** If yes, note the variance. If the variance exceeds one order of magnitude, proceed to Step 6 (Publish Words).
  *   *Audit Log:* [Define Class] OR [Note Class Conflict: Range X to Y]

  **Step 3: Evidence Anchor (Type B only)**
  If Degree of Belief, identify the owner and the evidence.
  *   **Question:** Whose belief is this? What specific evidence anchors it (e.g., "Legislative draft bills," "Budget trends")?
  *   **Action:** If the answer is "intuition" without evidence, proceed to Step 6.
  *   *Audit Log:* [Analyst Name] + [Evidence Summary]

  **Step 4: The "Next Year" Test (Communication Check)**
  Review the text accompanying the number.
  *   **Question:** Will a layperson read this as a guarantee about the *coming year* or a *specific location* when it is actually a long-term average or regional estimate?
  *   **Action:** If yes, draft a qualifying phrase (e.g., "average annual chance," "regional estimate"). If a qualifier cannot fix the misunderstanding, proceed to Step 6.
  *   *Audit Log:* [Misreading Risk: Yes/No] + [Proposed Qualifier]

  **Step 5: Calibration Plan**
  Determine how we check this number later.
  *   **Frequency:** Data source verified?
  *   **Belief:** Will we record this judgment to score against reality in 5/10 years?
  *   *Audit Log:* [Verification Method]

  **Step 6: The "Words Over Numbers" Gate**
  *   **Trigger:** If Step 2 shows massive class variance, Step 3 lacks evidence, or Step 4 fails the communication check.
  *   **Action:** Reject the number. Draft a qualitative statement (e.g., "High likelihood," "Significant uncertainty").
  *   *Audit Log:* [Decision: Publish Number / Publish Words]

  **Step 7: Sign-Off**
  *   **Action:** The reviewer signs the log. If Step 6 was triggered, the Director must sign off on the qualitative phrasing.
  *   *Audit Log:* [Reviewer Initials] + [Director Initials if Words]

  ***

  ### IV. APPLICATION TO CURRENT DRAFT

  Here is the PSR applied to the three contentious statements in the upcoming bulletin.

  #### Case 1: The 100-Year Flood
  **Statement:** "1% annual chance of a flood exceeding the 100-year stage at [Named Gauge]."
  **Source:** National statistical method applied to local gauge data.

  *   **Step 1 (Class):** Type A (Relative Frequency). *Log: Type A.*
  *   **Step 2 (Ref Class):** Class is "Historical flow at this gauge." Stable. *Log: Class = Gauge History.*
  *   **Step 3 (Evidence):** N/A.
  *   **Step 4 (Next Year Test):** **FAIL.** Public reads "1% per year" as "1% chance next spring" or "Safe for 99 years." The statistical definition is a long-run average, not a short-term prediction. *Log: Misreading Risk: Yes. Qualifier: "Long-term average, not annual prediction."*
  *   **Step 5 (Calibration):** Verified against USGS dataset. *Log: USGS Verified.*
  *   **Step 6 (Gate):** **PASS with Condition.** We keep the number but must add the qualifier from Step 4. *Log: Publish Number + Qualifier.*
  *   **Step 7 (Sign-off):** Reviewer: [Statistician]. Director: [N/A].

  #### Case 2: The 1931 Earthen Dam
  **Statement:** "0.2% probability of failure within twenty years."
  **Source:** Engineering model based on dam failure rates.

  *   **Step 1 (Class):** Type A/C Hybrid (Frequency of failures applied to physical structure). *Log: Type A/C.*
  *   **Step 2 (Ref Class):** **CRITICAL FAIL.** Class A: "National earthen dams vintage 1930s" (0.05%). Class B: "State earthen dams on similar alluvial soil" (0.5%). Variance is one order of magnitude. No formula selects the class. *Log: Class Conflict: 0.05% vs 0.5%.*
  *   **Step 3 (Evidence):** N/A.
  *   **Step 4 (Next Year Test):** Pass (Timeframe is 20 years). *Log: Misreading Risk: No.*
  *   **Step 5 (Calibration):** Cannot be calibrated until failure or 20 years pass. *Log: No near-term verification.*
  *   **Step 6 (Gate):** **STOP.** Per procedure, order-of-magnitude variance in reference class prohibits a single precise number. *Log: Publish Words.*
  *   **Step 7 (Sign-off):** Reviewer: [Lead Engineer]. Director: **[Required]**.
  *   **Outcome:** Replace "0.2%" with "Low probability (estimated between 0.05% and 0.5% depending on geological classification)."

  #### Case 3: Water Authority Consolidation
  **Statement:** "30% chance of regional water authority consolidation within a decade."
  **Source:** Senior Analyst Judgment.

  *   **Step 1 (Class):** Type B (Degree of Belief). *Log: Type B.*
  *   **Step 2 (Ref Class):** N/A (Single-case event).
  *   **Step 3 (Evidence Anchor):** Analyst claims basis is "current legislative bills + budget deficits." This is defensible evidence, not pure intuition. *Log: Analyst [Name] + [Legislative/Budget Trends].*
  *   **Step 4 (Next Year Test):** Pass (Timeframe is decade). *Log: Misreading Risk: No.*
  *   **Step 5 (Calibration):** Must archive this bulletin to score accuracy in 10 years. *Log: Archive for 10-year scoring.*
  *   **Step 6 (Gate):** **PASS.** Subjective numbers are permitted if anchored and attributed. *Log: Publish Number.*
  *   **Step 7 (Sign-off):** Reviewer: [Generalist]. Director: **[Required]** (As this is an explicit judgment call).
  *   **Outcome:** Publish "30%" but label as "Expert Estimate based on legislative trends" rather than "Statistical Probability."

  ***

  ### V. LIMITATIONS OF THIS PROCEDURE

  As Director, I must be clear about what this checklist achieves and where it reaches its limit.

  **1. Convergence on One-Off Cases**
  This procedure will **not** force two analysts to agree on a number for unique events (like the water authority consolidation). Probability as "Degree of Belief" is inherently personal. Two rational people with the same evidence can assign different probabilities (30% vs. 60%). This procedure does not solve that; it merely forces us to admit the number is a *judgment* anchored to *evidence*, rather than pretending it is a *fact* derived from *data*. It prevents us from hiding disagreement behind false precision, but it does not eliminate the disagreement.

  **2. Public Misunderstanding of Time**
  This procedure will **not** stop the public or legislators from reading "1% annual chance" as a claim about next year. Cognitive bias regarding risk is resilient. A 15-minute review cannot fix decades of public conditioning on the term "100-year flood."
  *   **What this does:** It forces us to add the qualifying text ("long-term average").
  *   **What this doesn't do:** It guarantees comprehension.
  *   **The Hard Truth:** Short of rewriting the bulletin to remove numbers entirely (e.g., using "High/Medium/Low" risk matrices), we cannot prevent misinterpretation. This procedure minimizes our liability by ensuring we have warned them, but it does not ensure they will listen. We are buying intellectual honesty, not public clarity.

  **Implementation begins with the next draft cycle. All previous probability statements must be retro-fitted with Audit Logs by Friday.**
