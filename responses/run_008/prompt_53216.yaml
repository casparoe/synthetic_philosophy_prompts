      *(Confidence Check)*: I am highly confident in the political science definitions, but less confident in the specific empirical weight of "humiliation" across all cultures. I should flag that.

  10. **Final Polish:** Check against the prompt's specific questions (Correspondence table, breakdown, does conclusion survive, protection racket, confidence markers).

      *Plan:*
      1.  Introduction acknowledging the sophistication of the prompt.
