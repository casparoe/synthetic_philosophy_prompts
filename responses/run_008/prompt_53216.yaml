      *Refining the "Protection Racket":* The racket analogy is strong on *coercion* but weak on *consent*. Clientelism is often a "win-win" for the voter (free rice) and politician (vote). A racket implies the voter is worse off overall. I need to nuance this.

      *Refining the "Corruption" definition:* Is corruption universal? Most definitions hinge on "public office for private gain." Clientelism fits this. The professor argues the "public office" part is weak in poor states. I need to counter that.

