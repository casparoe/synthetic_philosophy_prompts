prompt: |-
  I'm in a comparative politics seminar and my professor keeps defending vote-buying in poorer democracies by saying clientelism is basically an informal welfare state: the patron is the safety net, the bag of rice after a bad harvest is your unemployment check, and election day is when you pay the premium. His further claim is that calling this "corruption" just imposes a rich-country template in which the state, not the local boss, is supposed to provide -- so what counts as corruption is relative to how much the formal system is actually doing. I nodded along but I want to stress-test the analogy instead of just accepting it.

  Give me the correspondence table first -- what plays the role of the insurer, the premium, the payout, the eligibility rules, the claims adjuster -- and then show where the mapping breaks. I'm especially interested in the features of real welfare states that the analogy quietly imports: things like the payout not depending on your future vote, being able to claim without owing anyone a personal debt, not having to humiliate yourself or show up at rallies, coverage that's universal rather than reserved for the loyal. For each disanalogy, tell me whether it actually matters for his conclusion or is just noise (some differences between welfare states and patronage surely don't matter for the corruption question, and I want to know which ones those are).

  Then the key question: once the disanalogies are on the table, does his conclusion survive -- that clientelism isn't corruption, or at least that the label is parochial -- or was the analogy carrying it the whole time? Relatedly, is there a better analogy available? The one that came to my mind is a protection racket, where the gang sells safety partly against threats it creates itself, but maybe you have a better one or maybe the racket comparison fails in its own ways -- I'd like that checked too.

  Last thing: throughout the answer, can you say how confident you are in each of the major claims, and single out the one point you're least sure of? You're reasoning about something where the empirical picture varies a lot by country and era, and I'd much rather know where the ground is soft than get a clean-sounding verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
