answer: |-
  This is a splendid dispute to have over a cuppa. Your flatmate is seduced by the elegance of the mechanism, but you are right to sense that the machinery is resting on philosophical pillars that are far shakier than the engineering suggests. Robin Hanson's slogan—"Vote on values, bet on beliefs"—is rhetorically brilliant, but as a foundation for a constitution, it requires a specific and contentious metaphysics.

  Here is an excavation of what Futarchy strictly presupposes, where it is underdetermined, and how the institution would crumble or mutate if we altered those philosophical commitments.

  ### 1. The Coherence of the Values/Beliefs Split
  Hanson's design relies on a Humean distinction: reason (beliefs) is the slave of the passions (values). He assumes we can cleanly separate *what we want* from *how we get it*.

  **The Presupposition:** It presupposes that **values are operationalisable without smuggling in beliefs.**
  When the public votes on a metric (e.g., "Maximise GDP" or "Maximise Self-Reported Life Satisfaction"), they are not merely expressing a preference; they are endorsing a *theory of the good*. To vote for GDP is to believe that material throughput correlates with human flourishing. To vote for life expectancy is to believe that duration of life is more valuable than intensity of experience.

  **The Philosophical Problem:** This split is not coherent. Operationalising a value is an epistemic act. By choosing a metric, the voters are implicitly voting on a sociological and psychological theory about what constitutes wellbeing. If that theory is wrong (e.g., if GDP rises while social cohesion collapses), the system will optimise for a proxy that no longer serves the underlying value.
  *   **Strict Requirement:** For Futarchy to work as intended, the chosen metric must be a *robust proxy* that cannot be gamed without actually improving the underlying value.
  *   **Underdetermination:** Futarchy offers no mechanism for updating the metric itself based on new philosophical insights. It treats the "Vote on Values" as a one-off constitutional moment, ignoring that our understanding of "the good" evolves dialectically through political engagement, not just static selection.

  **Institutional Implication:** If you accept that choosing a metric *is* a belief-laden act, you cannot leave it to a simple plebiscite. You would need a **Deliberative Constitutional Convention** that meets periodically to revise the metric, treating the definition of wellbeing as a hypothesis to be tested, not a fixed preference to be aggregated.

  ### 2. The Epistemic Status of Market Prices
  Your flatmate likely assumes market prices function as probability estimates (the "wisdom of crowds"). But markets do not reveal "truth"; they reveal *incentivised claims weighted by capital*.

  **The Presupposition:** It presupposes that **wealth is uncorrelated with bias regarding public goods.**
  For a prediction market to track "belief" rather than "preference," the capital deployed must be aimed at accuracy (via scoring rules), not influence. However, in a Futarchy, the traders are betting on policies that affect *everyone*. If a billionaire stands to gain £1 billion from a specific policy, they have a rational incentive to distort the market price to ensure that policy passes, even if their private belief is that it will fail the national metric.
  *   **Strict Requirement:** The system requires **subsidised liquidity** or **quadratic voting mechanisms** within the market to decouple betting power from existing wealth. Without this, Futarchy devolves into a plutocracy where the rich buy the "truth" that suits them.
  *   **Underdetermination:** Hanson assumes the market is measuring $P(\text{Outcome} | \text{Policy})$. But markets naturally price $P(\text{Outcome} \cap \text{Policy})$. Distinguishing the conditional probability (the causal impact) from the joint probability is notoriously difficult in financial engineering.

  **Institutional Implication:** If you view markets as revealing *preferences* (power) rather than *beliefs* (truth), you must abandon the idea that the market decides. Instead, the market should serve as an **advisory information signal** to a representative body. This shifts Futarchy towards a "Market-Informed Technocracy," where traders inform legislators but do not bind them.

  ### 3. The Ontology of Policy (Counterfactuals and Time)
  This is the deepest epistemological cut. A standard prediction market resolves on what *happens*. Futarchy requires resolving on what *would have happened* had a different policy been chosen.

  **The Presupposition:** It presupposes that **causal counterfactuals are computable and settle-able.**
  To know if Policy A maximised the metric better than Policy B, we need to know the value of the metric under Policy B. But if we implemented Policy A, Policy B is a counterfactual history. We cannot observe it.
  *   **Strict Requirement:** The system requires a **Decision Market** structure (often called a "governance oracle"). This requires subsidising the losing policy's market so that it remains liquid enough to provide a valid price, even though that policy was never implemented. This is financially expensive and epistemically fragile. Who decides the "ground truth" of the counterfactual?
  *   **The Time Horizon Problem:** Markets discount the future heavily. A policy that causes pain now for gain in 20 years will be priced poorly. Futarchy presupposes that **social time preferences align with market discount rates.** They rarely do.
  *   **Goodhart's Law:** The system presupposes the metric is **resistant to optimisation pressure.** When a measure becomes a target, it ceases to be a good measure. If the market knows the government is maximising "average test scores," traders will bet on policies that teach to the test, not policies that improve education. The market efficiently finds the loophole, not the solution.

  **Institutional Implication:** If you accept that counterfactuals are not well-posed for market resolution, you must introduce a **Judicial or Expert Review Layer**. An independent body would need to audit the causal claims of the market, effectively vetoing market decisions that rely on spurious correlations or metric gaming. This breaks the "pure" automation of Futarchy but saves it from collapse.

  ### 4. Summary of Philosophical Commitments

  To run Futarchy as designed, you are silently signing up for the following philosophical commitments:

  1.  **Metric Realism:** That "national wellbeing" can be captured in a variable that is stable, measurable, and immune to perverse optimisation.
  2.  **Epistemic Plutocracy:** That the distribution of wealth in society is sufficiently random regarding policy knowledge that wealth-weighted betting approximates truth-tracking.
  3.  **Causal Separability:** That policies have discrete, isolatable effects that can be priced independently of the complex, chaotic web of social reality.
  4.  **Static Values:** That the "values" voted on today will remain the legitimate guide for governance tomorrow, ignoring that governance itself shapes values (endogenous preferences).

  ### The Verdict for Your Flatmate

  You can concede that Futarchy is a brilliant *heuristic* for identifying the tension between values and facts. However, as an *institution*, it is not value-neutral. It privileges **efficiency over legitimacy** and **current wealth over future welfare**.

  If you were to redesign it to account for these philosophical weaknesses, you would end up with a hybrid:
  *   **Values:** Determined by a sortition-based citizens' assembly (to avoid polling bias and allow deliberation on the metric itself).
  *   **Beliefs:** Sourced from prediction markets, but treated as *advisory* rather than binding (to prevent wealth-based capture).
  *   **Implementation:** Vetoable by a constitutional court (to protect against Goodhart's Law and rights violations).

  In short, your flatmate sees a machine that solves politics. You correctly see a machine that hides politics inside its gears. The gears are not made of steel; they are made of philosophy. And the philosophy is not as solid as the engineering suggests.
