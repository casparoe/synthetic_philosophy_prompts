prompt: |-
  I help run the cause-selection reading group at my university's effective altruism chapter, and this term we've been working through how the movement actually picks causes — the importance, tractability, and neglectedness framework that shows up in the career and charity advice literature. The group has quietly split into two camps, and I've realized the split isn't really about any empirical question: it's about which analogy each camp carries around in their head.

  The first camp treats cause prioritization as fundamentally a matter of investment research. On their picture, the philanthropic landscape is a market: other funders and researchers are market participants, their attention is capital, a cause being crowded is like a stock being efficiently priced, and neglectedness is mispricing — the reason a small donor or career-seeker can get outsized returns by looking where nobody else is. Tractability is your information edge. They use the analogy to argue that the whole point of cause selection is finding what everyone else has missed, and that as the movement grows and the mispricings get corrected, our advantage should erode — so we should expect to keep moving. The second camp is disgusted by this and says the right picture is an emergency room. A triage nurse doesn't look for undervalued patients; she orders by severity and urgency, because the point is that someone is bleeding out. On their picture, importance is severity, the constraint is fixed capacity (beds, staff, our limited budget and careers), and crowdedness matters only in the boring sense that you can't double-treat the same patient. They use the analogy to argue that speculative, low-probability causes are a failure of triage discipline, and that the movement's flirtation with them reflects the investor mindset's tolerance for long-shot bets.

  I want to adjudicate this properly, or at least understand it. Please audit both analogies. For each, give me an explicit correspondence table — what plays the market, the price, the investor, the dividend; and what plays the patient, the severity, the triage protocol, the stock of beds — and then say where the mapping breaks down. I'm especially interested in what each analogy smuggles in: does the market picture assume that doing good generates returns the doer can capture, that attention equilibrates the way capital does, that other actors' causes are priced by anything like rationality? Does the triage picture assume a single decision-maker with a fixed capacity that can't be expanded — and does it silently treat "how likely is the treatment to work" as less important than triage actually treats it? Then give me at least one test case where the two analogies yield opposite verdicts (I'd guess something like climate change — enormous and severe but very crowded — versus some small, totally neglected, fairly intractable cause), and say whether the framework itself adjudicates the disagreement or just averages the two intuitions together. Finally: which analogy, if either, deserves to be the official picture, and if neither, what would a better one look like — something like portfolio allocation, or something that isn't economic at all?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Context:** University EA chapter cause-selection reading group.
      *   **Conflict:** Two camps with conflicting mental models/analogies for cause prioritization (ITN framework).
      *   **Camp 1:** Investment Research (Market/Mispricing/Edge).
      *   **Camp 2:** Emergency Room (Triage/Severity/Urgency).
      *   **Tasks:**
          1.  Audit both analogies (Explicit correspondence tables).
          2.  Identify where the mapping breaks down for each.
          3.  Analyze what each analogy "smuggles in" (hidden assumptions).
          4.  Provide a test case where they yield opposite verdicts.
          5.  Determine if the ITN framework adjudicates or averages.
          6.  Recommend an official picture or propose a better one.

  2.  **Analyze Camp 1: The Investment Research Analogy:**
      *   *Core Idea:* Philanthropy is a market. Causes are assets. Neglectedness = Alpha (excess return).
      *   *Correspondence:*
          *   Market $\rightarrow$ Global Philanthropic Landscape.
          *   Asset/Stock $\rightarrow$ A Cause Area (e.g., AI Safety, Malaria Nets).
          *   Price $\rightarrow$ Level of Funding/Attention relative to Impact.
          *   Investor $\rightarrow$ EA Donor/Researcher/Earner.
          *   Dividend/Return $\rightarrow$ Counterfactual Good Done (QALYs, lives saved, x-risk reduced).
          *   Mispricing $\rightarrow$ Neglectedness (High impact, low funding).
          *   Information Edge $\rightarrow$ Tractability/Research insight.
      *   *Breakdown:* Markets seek profit for the *investor*. Philanthropy seeks good for *others*. Markets equilibrate quickly; social change is sticky. "Returns" aren't captured by the donor (no feedback loop of wealth).
      *   *Smuggled Assumptions:* Rationality of other actors (are governments/other NGOs efficient?), fungibility of impact, ability to exit/enter causes easily (career switching costs).

  3.  **Analyze Camp 2: The Emergency Room Analogy:**
      *   *Core Idea:* Philanthropy is triage. Needs are patients. Resources are fixed.
      *   *Correspondence:*
          *   ER/Hospital $\rightarrow$ The Effective Altruism Movement / Resources available.
          *   Patient $\rightarrow$ A Beneficiary Group / Cause Problem.
          *   Severity $\rightarrow$ Scale/Importance (Lives at stake).
          *   Urgency $\rightarrow$ Tractability/Neglectedness (Time sensitivity).
          *   Triage Protocol $\rightarrow$ ITN Framework / Cost-Effectiveness Analysis.
          *   Stock of Beds/Staff $\rightarrow$ Fixed EA Budget / Talent Pool.
          *   Treatment Success $\rightarrow$ Probability of Solving the Problem.
      *   *Breakdown:* ERs treat *presenting* patients. EA can *choose* which patients exist (prevention vs. cure). ER capacity is hard-fixed in the moment; EA capacity can grow (fundraising, recruitment). Triage ignores "long shots" if survival is near zero; EA might take long shots if the upside is astronomical (x-risk).
      *   *Smuggled Assumptions:* Zero-sum resource constraint (ignoring leverage), passivity (waiting for problems to arrive), linearity of treatment (money in = lives out).

  4.  **Analyze "Smuggled Assumptions" (Deep Dive):**
      *   *Investment:* Assumes other funders are rational competitors. Assumes impact is fungible and liquid. Assumes the goal is *marginal* impact (alpha) rather than *total* impact.
      *   *Triage:* Assumes a central commander (who decides the protocol?). Assumes capacity is static (ignoring that saving a life might add capacity later). Potentially undervalues low-probability/high-impact (the "long shot" patient who might survive with expensive surgery vs. many who die anyway).

  5.  **Develop a Test Case:**
      *   *Candidate:* Pandemic Preparedness vs. Deworming.
      *   *Better Candidate (per prompt hint):* Climate Change (Crowded/High Importance) vs. Neglected/Intractable Cause (e.g., Nuclear Security or specific AI governance niches).
      *   *Let's use:* **Climate Change Mitigation (General)** vs. **AI Alignment (Specific/Neglected)**.
      *   *Investment View:* Climate is "priced in" (trillions spent, diminishing marginal returns). AI Alignment is "undervalued" (high neglectedness, high potential alpha). Verdict: AI Alignment.
      *   *Triage View:* Climate is "bleeding out" (urgent, severe, millions dying now). AI is "potential future patient." Triage prioritizes the immediate bleeding. Verdict: Climate Change.
      *   *Wait, let's refine:* The prompt suggests "Climate change — enormous and severe but very crowded — versus some small, totally neglected, fairly intractable cause."
      *   *Let's pick:* **Malaria Prevention (Crowded, High Certainty)** vs. **Biosecurity Governance (Neglected, Low Probability, High Stakes)**.
      *   *Investment:* Biosecurity is the mispricing. Malaria is efficient. Go Biosecurity.
      *   *Triage:* Malaria patients are dying *now*. Biosecurity is a risk, not a bleeding patient. Go Malaria.
      *   *Does ITN adjudicate?* ITN multiplies them. $Impact = Scale \times Neglectedness \times Tractability$.
          *   Malaria: High Scale, Low Neglectedness, High Tractability.
          *   Biosecurity: High Scale (potential), High Neglectedness, Low Tractability.
          *   ITN doesn't inherently pick one; it depends on the *values* plugged in. It acts as a calculator, not a philosophy. It averages the intuitions mathematically but doesn't resolve the *moral* disagreement about whether we are investors or medics.

  6.  **Synthesize the "Better Analogy":**
      *   Neither is perfect. Investment is too cynical/competitive. Triage is too passive/static.
      *   *Idea:* **R&D Portfolio / Venture Philanthropy.**
      *   Why? It combines the "search for breakthroughs" (Investment) with the "goal of solving problems" (Triage). It acknowledges capacity building (R&D grows the pie).
      *   *Alternative:* **Gardening/Ecology.** (Too vague?)
      *   *Alternative:* **Civil Engineering / Infrastructure.** (Building systems).
      *   *Best Fit:* **Strategic R&D Portfolio.** You have a budget. Some goes to "maintenance" (malaria nets - keeping people alive). Some goes to "moonshots" (AI safety - preventing extinction). This acknowledges both the immediate need (Triage) and the marginal value of information/capital (Investment).
      *   *Actually, a "Public Goods" framework might be best.* EA is providing public goods that markets underprovide.

  7.  **Drafting the Response:**
      *   *Tone:* Analytical, respectful, philosophical but grounded.
      *   *Structure:*
          1.  Introduction (acknowledge the depth of the insight).
          2.  Audit of Investment Analogy (Table + Breakdown + Smuggled Assumptions).
          3.  Audit of Triage Analogy (Table + Breakdown + Smuggled Assumptions).
          4.  Test Case (Climate vs. Neglected Risk).
          5.  Does ITN Adjudicate? (No, it's a formula, not a metaphysics).
          6.  Recommendation (The "R&D Portfolio" or "Public Goods" synthesis).

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I explicitly map "Dividend" and "Stock of Beds"? Yes.
      *   *Check:* Did I address the "smuggled" rationality assumption? Yes, crucial for the market view.
      *   *Check:* Did I address the "fixed capacity" assumption for Triage? Yes, EA tries to grow capacity.
      *   *Refinement on Test Case:* Make sure the verdicts are clearly opposite.
          *   Investment: Pick the neglected cause (Alpha).
          *   Triage: Pick the severe/urgent cause (Severity), even if crowded.
      *   *Refinement on Recommendation:* Don't just say "Portfolio." Explain *why* it solves the specific tensions (e.g., it allows for both maintenance and growth, acknowledges risk without requiring "profit").

  9.  **Final Polish:** Ensure the distinction between *marginal* impact (Investment) and *total* need (Triage) is clear, as this is the crux of the philosophical split. (Investment cares about *your* contribution's delta. Triage cares about the *patient's* state).

  10. (Final Review against Prompt):
      *   Audit both analogies? Yes.
      *   Explicit correspondence tables? Yes.
      *   Where mapping breaks down? Yes.
      *   Smuggled assumptions? Yes.
      *   Test case with opposite verdicts? Yes.
      *   Does framework adjudicate? Yes.
      *   Which analogy deserves to be official / Better one? Yes.

  Proceed to generate response.
answer: |-
  This is a remarkably sharp diagnosis of a tension that often remains implicit in Effective Altruism (EA) discourse. The split you've identified isn't just about numbers; it's about *ontology*. One side sees the world as a system of incentives and efficiencies (economics); the other sees it as a system of needs and constraints (medicine).

  Here is an audit of both analogies, their hidden assumptions, and a proposal for how to move forward.

  ### 1. Audit: The Investment Research Analogy

  This model views cause prioritization as **alpha generation**. The goal is to outperform the "market average" of philanthropy by finding inefficiencies.

  | Investment Concept | EA / Cause Selection Correspondence |
  | :--- | :--- |
  | **The Market** | The global landscape of all problem-solving (govs, NGOs, philanthropists). |
  | **The Asset / Stock** | A specific cause area or intervention (e.g., AI safety, malaria nets). |
  | **The Price** | The level of funding/attention relative to the good produced (Cost per DALY). |
  | **The Investor** | The EA donor, researcher, or career-seeker. |
  | **The Dividend / Return** | Counterfactual impact (the good done *because* you acted). |
  | **Mispricing** | **Neglectedness.** A cause where impact is high but price (funding) is low. |
  | **Information Edge** | **Tractability.** Your research reveals a solution others missed. |
  | **Market Efficiency** | The assumption that other funders generally allocate capital rationally. |

  **Where the Mapping Breaks Down:**
  1.  **Profit vs. Good:** In markets, returns are captured by the investor (wealth). In philanthropy, returns are externalized (others get the good). This removes the feedback loop that usually corrects market inefficiencies. You don't get richer for saving a life, so "arbitrage" doesn't naturally attract more capital unless there is a separate moral motivation.
  2.  **Liquidity:** Investors can exit a stock instantly. Career-seekers and cause-prioritizers cannot. "Switching costs" in EA are massive (years of PhD study, reputation capital). The market analogy assumes a fluidity that doesn't exist.
  3.  **Rational Competitors:** The analogy assumes other market participants (governments, large foundations) are rational profit-maximizers. In reality, they are often bureaucratic, political, or status-driven. A cause isn't "neglected" because it's a hidden gem; it might be neglected because it's politically impossible or genuinely intractable.

  **What It Smuggles In:**
  *   **Marginalism over Totality:** It implies we should only care about the *margin* (where the next dollar does the most), potentially ignoring "priced-in" causes where the *total* need is still catastrophic.
  *   **Zero-Sum Thinking:** It subtly suggests that if a cause is "crowded," our opportunity is gone. It ignores the possibility that a cause is crowded *because* it is important, and that scaling capacity could still yield massive total returns.
  *   **Epistemic Arrogance:** It assumes the EA movement has a consistent "information edge" over the rest of the world. If the "market" (e.g., climate scientists) is actually rational, looking for "mispricing" leads you to contrarianism for its own sake.

  ### 2. Audit: The Emergency Room Analogy

  This model views cause prioritization as **triage**. The goal is to minimize total suffering given fixed constraints.

  | ER Concept | EA / Cause Selection Correspondence |
  | :--- | :--- |
  | **The Hospital / ER** | The Effective Altruism Movement (resources, talent, budget). |
  | **The Patient** | A beneficiary group or a specific problem instance. |
  | **Severity** | **Importance.** (Number of lives, intensity of suffering). |
  | **Urgency** | **Tractability / Time-sensitivity.** (Can we help now before it's too late?) |
  | **Triage Protocol** | The ITN Framework / Cost-Effectiveness Analysis. |
  | **Stock of Beds/Staff** | Fixed EA Capacity (budget, person-hours). |
  | **Treatment Success** | Probability of the intervention working. |
  | **Dead on Arrival** | Intractable problems (ignored to save those who can be helped). |

  **Where the Mapping Breaks Down:**
  1.  **Passive vs. Active:** An ER waits for patients to arrive. EA *searches* for patients. We can prevent the injury (existential risk reduction) rather than just treating the wound. The ER model biases toward *presenting* problems (current suffering) over *preventative* problems (future risk).
  2.  **Fixed Capacity:** In an ER, bed count is physical and fixed in the short term. In EA, capacity is fungible and expandable. We can fundraise, recruit, and build institutions. Treating capacity as fixed leads to under-investment in movement building.
  3.  **The "Long Shot" Patient:** In a standard ER, you do not spend \$1M to save one patient with a 1% survival rate if that money could save 100 patients with 99% rates. In EA (specifically x-risk), we *do* make that bet because the one patient represents all future generations. Triage protocols usually fail at astronomical stakes.

  **What It Smuggles In:**
  *   **Command Economy:** It assumes a single triage nurse (a central planner) allocating resources. In reality, EA is a decentralized network of individuals. Who enforces the protocol?
  *   **Conservatism:** It biases toward high-probability, moderate-impact interventions (bedside manner) over low-probability, astronomical-impact interventions (experimental surgery).
  *   **Static Suffering:** It treats suffering as a static pile to be removed, rather than a dynamic system that can be redesigned.

  ### 3. The Test Case: Climate Change vs. Engineered Pandemic Preparedness

  Let's apply both analogies to a concrete choice between **General Climate Mitigation** (Crowded, High Importance, Moderate Tractability) and **Engineered Pandemic Governance** (Neglected, High Importance, Low Tractability).

  **The Investment Verdict:**
  *   **Climate:** The "stock" is heavily held. Trillions are invested. Marginal returns are diminishing. The "price" is efficient.
  *   **Pandemics:** Highly "neglected" relative to risk. Information asymmetry exists (few understand the bio-governance landscape).
  *   **Decision:** **Pandemic Preparedness.** The alpha is in the neglected niche. Climate is a "bubble" of attention.

  **The Triage Verdict:**
  *   **Climate:** Patients are bleeding out *now*. Heatwaves, floods, famine. Severity is immediate and visible.
  *   **Pandemics:** The patient is currently healthy (the pandemic hasn't happened yet). This is preventative medicine, not emergency triage.
  *   **Decision:** **Climate Mitigation.** You do not ignore the bleeding patient to buy insurance for a potential future injury. Severity and urgency dictate resources.

  **Does the ITN Framework Adjudicate?**
  No. The ITN framework is a formula, not a metaphysics. $Impact = Scale \times Neglectedness \times Tractability$.
  *   If you weight **Scale** heavily (Triage intuition), Climate wins.
  *   If you weight **Neglectedness** heavily (Investment intuition), Pandemics win.
  *   If you weight **Tractability** heavily (Triage/ER efficiency), Climate often wins (we know how to deploy solar; governance is hard).

  The framework mathematically averages the two intuitions but does not resolve the *moral* disagreement about whether we are maximizing marginal returns (Investor) or minimizing immediate catastrophic loss (Medic). It simply forces you to plug in numbers, but the *choice of which numbers to measure* is dictated by the analogy you hold.

  ### 4. Recommendation: The "R&D Portfolio" Analogy

  Neither the Market nor the ER is sufficient. The Market is too cynical and assumes rationality where there is none. The ER is too passive and assumes fixed capacity.

  The better official picture is **Strategic R&D Portfolio Management**.

  **Why this works:**
  1.  **It accepts constraints but allows growth:** Like the ER, you have a budget. Like the Market, you want high returns. But like R&D, you acknowledge that spending money can *create* new capacity and new solutions (Tractability is not fixed; it can be researched).
  2.  **It balances Maintenance vs. Moonshots:** A tech company doesn't just pick "undervalued" projects (Investment) or just fix "broken servers" (ER). It allocates a portion of the portfolio to **Core Maintenance** (keeping the lights on/malaria nets) and a portion to **Moonshots** (preventing extinction/AI safety).
  3.  **It handles "Public Goods":** Unlike the Market, R&D acknowledges that the "product" (a safe future) is a public good that won't be produced by rational competitors. Unlike the ER, it acknowledges that you can engineer the environment so patients don't get sick.

  **Correspondence for the R&D Model:**
  *   **The Firm:** The EA Movement / Humanity.
  *   **The Product:** A flourishing future / Reduced Suffering.
  *   **Core Engineering:** Proven, high-tractability interventions (e.g., cash transfers, malaria nets). Low risk, steady return.
  *   **Skunkworks / Blue Sky:** High-risk, high-neglectedness research (e.g., AI alignment, bio-governance). High risk, potential for existential return.
  *   **Capacity Building:** Hiring, recruiting, fundraising (expanding the lab).
  *   **Decision Rule:** Not "maximize alpha" or "save the bleeding," but **"optimize the portfolio for long-term survival and growth."**

  **How to use this in your group:**
  Tell your group that the Investment camp is right about **marginal thinking** (where does the next dollar go?), and the Triage camp is right about **moral urgency** (why are we doing this at all?).

  The R&D Portfolio analogy bridges them: We run a "Core Engineering" division (satisfying the Triage urge to help people now) funded by the surplus generated by our "Skunkworks" division (satisfying the Investment urge to find high-leverage, neglected opportunities). This allows a member to say, "I am working on malaria nets" without feeling they missed the alpha, and another to say, "I am working on obscure AI governance" without feeling they are ignoring bleeding patients. Both are essential departments in the same R&D firm.
