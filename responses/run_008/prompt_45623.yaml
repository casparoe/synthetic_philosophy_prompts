answer: |-
  Here is a decision procedure designed for your specific context. It operationalizes the philosophy of biology critique of evolutionary psychology (EP) into an editorial workflow. It is designed to filter out "just-so stories" while allowing rigorous evolutionary hypotheses to proceed, regardless of your personal sympathy toward the skeptics.

  ### The Editor's Decision Procedure for Evolutionary Submissions

  **Time Budget:** 20 minutes for Triage (Section A); 40 minutes for Evaluation (Section B).
  **Output:** Each checkpoint includes a "Decision Letter Phrase" you can adapt directly for correspondence.

  #### Section A: Triage (The "Just-So" Filter)
  *Goal: Identify submissions that are theoretically unfalsifiable or lack basic empirical grounding.*

  **1. The Prediction Timing Check**
  Does the manuscript present data collected *after* the evolutionary hypothesis was specified and registered, or does it explain existing data using a new evolutionary narrative?
  *   **Sufficient Answer:** The hypothesis was generated prior to data collection (ideally preregistered), OR the paper uses entirely new data collected to test a specific, a priori prediction derived from the theory.
  *   **Insufficient Answer:** The paper takes a known psychological effect and offers an evolutionary explanation for why it exists without testing a novel prediction derived from that explanation.
  *   **Decision Letter Phrase:** *"To be considered for review, the manuscript must distinguish between a hypothesis that generated a prediction in advance and a narrative constructed to accommodate known findings."*
  *   **Action:** If Insufficient → **Reject**. (This is the primary defense against retrofitting).

  **2. The Null Hypothesis Check**
  Does the introduction explicitly state and rule out non-adaptive alternatives (e.g., byproduct/spandrel, genetic drift, exaptation, or culturally transmitted learning)?
  *   **Sufficient Answer:** The authors articulate at least one plausible non-adaptive alternative and explain why their data distinguishes the adaptationist account from it.
  *   **Insufficient Answer:** The adaptationist hypothesis is treated as the default assumption without considering that the trait could be a side effect of another adaptation or a cultural artifact.
  *   **Decision Letter Phrase:** *"The manuscript must demonstrate that the proposed adaptation is not merely a plausible story, but the best explanation relative to non-adaptive alternatives like byproducts or cultural learning."*
  *   **Action:** If Insufficient → **Request Major Revision** (if the data is new) or **Reject** (if theoretical only).

  **3. The Universality Claim Check**
  If the authors claim the trait is a universal human adaptation, do they provide cross-cultural data, or do they rely on a WEIRD (Western, Educated, Industrialized, Rich, Democratic) sample?
  *   **Sufficient Answer:** Cross-cultural evidence is provided, OR the authors explicitly limit their claims to the specific population studied without invoking "human nature."
  *   **Insufficient Answer:** General claims about "humans" or "ancestral logic" are made based solely on undergraduate participants in a single industrialized nation.
  *   **Decision Letter Phrase:** *"Claims regarding universal human architecture require evidence that transcends the specific cultural context of the sample provided."*
  *   **Action:** If Insufficient → **Request Major Revision** (tone down claims) or **Reject** (if claims are central and unsupported).

  ---

  #### Section B: Evaluation (The Evidential Weight Check)
  *Goal: Assess the quality of the evidence for submissions that passed Triage.*

  **4. The Functional Specificity Check**
  Does the proposed psychological mechanism show evidence of design specificity (i.e., it solves the proposed adaptive problem efficiently without triggering irrelevant responses)?
  *   **Sufficient Answer:** The study shows the mechanism is triggered by specific cues relevant to the ancestral problem and not by superficially similar but irrelevant cues.
  *   **Insufficient Answer:** The mechanism is described so broadly that it could explain almost any behavior in that domain.
  *   **Decision Letter Phrase:** *"The evidence must show that the cognitive mechanism is specifically tuned to the proposed adaptive problem rather than reflecting a general-purpose learning process."*
  *   **Action:** If Insufficient → **Request Major Revision**.

  **5. The Convergence/Comparative Check**
  (For papers claiming deep evolutionary roots): Is there comparative data from other species or phylogenetic modeling supporting the emergence of the trait alongside the proposed selective pressure?
  *   **Sufficient Answer:** Phylogenetic controls are used, or comparative data is cited to show the trait co-varies with the ecological pressure across lineages.
  *   **Insufficient Answer:** The evolutionary history is asserted without reference to comparative biology or phylogeny.
  *   **Decision Letter Phrase:** *"Assertions regarding the evolutionary origins of a trait benefit significantly from comparative or phylogenetic evidence linking the trait to the proposed ecological pressure."*
  *   **Action:** If Insufficient → **Send for Review** (if other evidence is strong) or **Request Major Revision**.

  **6. The Developmental Stability Check**
  Does the paper address how the trait develops? (Adaptations should show reliable development across normal environmental ranges).
  *   **Sufficient Answer:** The authors address developmental trajectories or rule out that the trait is solely the result of specific recent cultural conditioning.
  *   **Insufficient Answer:** Development is ignored, leaving open the possibility that the "adaptation" is actually a learned script.
  *   **Decision Letter Phrase:** *"The manuscript should address whether the observed pattern emerges reliably across development or if it is contingent on specific cultural learning histories."*
  *   **Action:** If Insufficient → **Send for Review** (with reviewer instruction to probe this).

  ---

  #### Decision Logic Summary
  *   **Reject:** Fails Triage #1 (Retrofitting) OR Triage #2 (No Null Hypothesis) AND is theoretical/no new data.
  *   **Request Major Revision:** Passes Triage but fails Evaluation #4 or #5, OR makes universal claims (Triage #3) without cross-cultural data.
  *   **Send for Review:** Passes Triage and at least two Evaluation checks. (Note: Passing this procedure does not guarantee acceptance; it means the paper is scientifically legible enough to warrant peer scrutiny).

  ---

  ### Application to Hypothetical Submissions

  #### Case 1: Menstrual Cycle and Mate Preferences
  **Submission:** A study finding women's stated mate preferences shift across the menstrual cycle (e.g., preference for "masculine" faces during ovulation). The authors argue this fits an ancestral "good genes" mating logic. Sample: 150 US undergraduates. No preregistration.
  **Procedure Run:**
  *   **Triage #1 (Prediction):** *Fail.* The field is saturated with these findings, and this specific analysis appears post hoc on collected data. No preregistration.
  *   **Triage #2 (Null Hypothesis):** *Weak.* Mentions cultural scripts but dismisses them quickly without testing.
  *   **Triage #3 (Universality):** *Fail.* Claims "evolved mating psychology" based on US undergrads.
  *   **Evaluation:** Skipped due to Triage failures.

  **Verdict:** **Request Major Revision** (with a strong caveat).
  **Decision Letter Phrase:** *"While the statistical design is sound, the manuscript currently explains existing patterns rather than testing a novel prediction. To proceed, you must distinguish your hypothesis from a narrative constructed to accommodate known findings, ideally through a preregistered replication or by testing a novel prediction derived from the ovulatory shift hypothesis."*

  **Bias Check:** As a skeptic, you likely want to **Reject** this immediately given the replication crisis in this specific sub-niche. The procedure forces you to offer **Major Revision** because the stats are okay and the theory is technically falsifiable, just currently under-supported. This is the verdict you may dislike; the procedure protects the *possibility* of science here, whereas your instinct may be to close the door on the topic entirely.

  #### Case 2: Phylogenetic Analysis of Foraging and Cognition
  **Submission:** A cross-species comparative paper using phylogenetic methods. Argues a specific cognitive trait (e.g., spatial memory for cache retrieval) appears in exactly those lineages where a particular foraging ecology (scatter-hoarding) would have selected for it. Controls for shared ancestry.
  **Procedure Run:**
  *   **Triage #1 (Prediction):** *Pass.* The prediction is derived from the ecological model before the phylogenetic test.
  *   **Triage #2 (Null Hypothesis):** *Pass.* Explicitly models drift and phylogenetic inertia as alternatives.
  *   **Triage #3 (Universality):** *N/A* (Non-human species).
  *   **Evaluation #5 (Comparative):** *Pass.* This is the core strength of the paper.
  *   **Evaluation #4 (Specificity):** *Pass.* Trait is narrowly defined.

  **Verdict:** **Send for Review**.
  **Decision Letter Phrase:** *"The manuscript successfully distinguishes the adaptationist hypothesis from non-adaptive alternatives using phylogenetic controls. We are sending this for review to evaluate the robustness of the ecological coding."*

  **Bias Check:** This is the verdict you should accept. Even if you are skeptical of EP generally, this paper uses the "gold standard" method (comparative phylogeny) to rule out the "just-so" critique. If you reject this, you are rejecting the method, not the science.

  #### Case 3: Theoretical Explanation of Sex Differences
  **Submission:** No new data. Explains a well-documented sex difference in risk-taking as an adaptation. Argues the observed pattern is precisely what the ancestral account would predict.
  **Procedure Run:**
  *   **Triage #1 (Prediction):** *Fail.* No new data. Explains known findings with a new narrative.
  *   **Triage #2 (Null Hypothesis):** *Fail.* Dismisses social role theory as "proximate" without ruling it out as the ultimate cause.
  *   **Evaluation:** Skipped.

  **Verdict:** **Reject**.
  **Decision Letter Phrase:** *"The manuscript offers a narrative to accommodate known findings rather than a hypothesis that generated a prediction in advance. Without new data or a novel testable prediction, this constitutes a just-so story rather than a scientific evaluation."*

  **Bias Check:** You will like this verdict. It aligns perfectly with the skeptic position.

  ---

  ### Limitations of the Procedure

  You must be plain with yourself about what this checklist cannot do.

  1.  **It Cannot Verify Ancestral Truth:** The procedure ensures the *logic* is sound, not that the *history* is true. A paper can pass every check (preregistered, rules out drift, cross-cultural) and still be wrong about the Pleistocene. We cannot time-travel to verify the Environment of Evolutionary Adaptedness (EEA).
  2.  **It Cannot Detect P-Hacking:** In Case 1, the procedure flags the lack of preregistration, but if an author *does* preregister but engages in "garden of forking paths" analysis within the registered bounds, the procedure will miss it. That requires statistical forensics, not philosophical triage.
  3.  **It Leaves "Hard Cases" Undecided:** Some traits are genuinely ambiguous. Is language an adaptation, a byproduct of general intelligence, or both? The procedure will push these to **Send for Review** because both sides can check the boxes. It does not solve deep theoretical disputes; it only ensures they are argued fairly.
  4.  **Passing Checks $\neq$ Truth:** A submission can pass every check and still be wrong. The procedure filters for *scientific rigor*, not *ontological correctness*. It ensures the paper is doing science, not that the conclusion is right.

  ---

  ### Reflexivity: What Changes Verdicts and Where I Might Fail

  **What Would Change My Verdicts?**
  *   **For Case 1 (Cycle):** If the authors returned with a **preregistered, multi-lab replication** that confirmed the effect, the procedure would move this from "Major Revision" to "Send for Review." The skeptic's burden is met by robustness, not by theoretical elegance.
  *   **For Case 2 (Phylogeny):** If a reviewer demonstrated that the **ecological coding was biased** (e.g., they classified "foraging ecology" based on the presence of the cognitive trait), the verdict would flip to **Reject** for circularity.
  *   **For Case 3 (Theoretical):** If the authors reframed the paper to generate **novel, testable predictions** for future studies (making it a theoretical framework paper rather than an explanation of past data), it could move to **Review**.

  **Where My Reasoning Is Most Likely to Fail**
  As an AI, my reasoning is most likely to fail at **Step 2 (The Null Hypothesis Check)** regarding *plausibility*.
  *   **The Failure Point:** I can check if an alternative hypothesis is *mentioned*. I cannot reliably judge if the dismissal of that alternative is *biologically justified*. An author might write, "Drift is unlikely because the trait is complex," which sounds sufficient to a language model but might be biologically nonsensical to a population geneticist.
  *   **The Risk:** I may over-value eloquent writing over biological rigor. If an author writes a convincing-sounding dismissal of the "byproduct" hypothesis that is actually mathematically unsound, I might mark that check as "Pass."
  *   **Mitigation:** This is why the procedure defaults to **Send for Review** for papers that pass Triage. You must rely on the evolutionarily trained reviewers to catch the biological implausibility that the text superficially obscures. Your job is not to be the biologist, but to ensure the biologist reviewers are given a paper that speaks their language.

  **Final Note on Your Bias**
  You mentioned you are sympathetic to the skeptics. Your distortion risk is highest with **Case 1**. The "Menstrual Shift" literature is controversial. Your instinct may be to treat the *topic* as discredited. The procedure forces you to treat the *method* as the criterion. If you reject Case 1 solely because you dislike the field, you are violating the editorial standard you would apply to a social priming study. Use the procedure to protect your neutrality; let the reviewers fight the science, but use the checklist to ensure the fight is fair.
