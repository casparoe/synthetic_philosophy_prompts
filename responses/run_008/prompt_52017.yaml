prompt: |-
  I've been a retired chemist for a few years now and I'm finally catching up on philosophy of art, so apologies if this is a beginner question. There's this move I keep running into that I can't quite evaluate: emotions toward fiction are like a child's emotions in a game of make-believe. The kid playing cops and robbers doesn't really feel terror when her friend points a finger and shouts bang -- the "gun" isn't real, so the fear isn't either, it's make-believe fear. The book I'm reading uses this to dissolve the paradox of fiction: when I pity Anna Karenina, nothing genuine is going on, only quasi-pity, so there's no puzzle about how I can feel for someone who doesn't exist. My experimentalist gut says the trembling and elevated pulse I get from a thriller are real enough, but maybe that's naive. Could you audit the analogy? Lay out what's supposed to map onto what -- the text onto the doll, presumably, but what plays the role of the kid, and of the rules of the game? -- then where the mapping breaks down (the child knows the gun is fake and chooses to play; I didn't exactly choose to read the sad part... or did I?), and tell me whether the conclusion the analogy was carrying -- no genuine emotion, hence no paradox -- survives once the disanalogies are on the table.
