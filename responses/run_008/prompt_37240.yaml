answer: |-
  ### (1) The implicit epistemology

  Academic citation operates on a communal epistemology rather than a forensic one. It presupposes that knowledge is cumulative and distributed across a network of trusted agents. When a scholar cites a source they haven't read, they are not testifying to the raw data's truth, but to the intermediary's reliable interpretation. The chain of citation functions as a provenance marker, not a verification seal. It assumes that the academic community acts as a filtering mechanism; errors in original reports will be caught by peers over time. Therefore, the practice treats testimony as provisionally trustworthy based on institutional affiliation and peer review, rather than demanding direct sensory access to the original event. The goal is tracing intellectual lineage and granting credit, not establishing factual guilt beyond reasonable doubt. Trust is placed in the system's corrective capacity, not the individual reader's verification.

  ### (2) What it strictly presupposes vs. what it merely fits with

  Strictly presupposed is only that the cited source exists and supports the claim made. It does not presuppose the citer has verified the original data. This practice merely fits with a norm of accountability, not a guarantee of accuracy. The system relies on the possibility of verification, not its actualization in every instance. It fits with the idea that if a claim is challenged, the chain can be audited. If no one ever checked, the system would collapse into gossip. While it doesn't require universal primary source engagement, it presupposes a non-zero probability of audit. The distinction lies between a rule of conduct (cite accurately) and a rule of evidence (verify personally). Academia accepts the risk of transmission error because the cost of universal verification would halt knowledge production. It fits with pragmatic efficiency, not epistemic purity, assuming intermediaries are generally competent.

  ### (3) Is the law/academia tension real?

  The tension is real but stems from divergent goals. Law adjudicates past events where stakes are individual liberty; hearsay is excluded because cross-examination is impossible. Academia constructs theories where stakes are progress; citations map conversations, not crime scenes. In law, the witness is the evidence. In academia, the citation is the map. The legal rule protects against wrongful conviction; the academic norm protects against plagiarism and intellectual debt. Both value truth, but law prioritizes procedural reliability for judgment, while academia prioritizes discursive efficiency for building upon prior work. The "scandal" exists only if you confuse mapping a conversation with testifying to a fact.

  ### (4) What would have to change if we took the stricter view seriously

  Enforcing a "read everything" rule would cripple academic output. Synthesis work would vanish, as scholars couldn't reference secondary literature without accessing archives globally. Dissertations would shrink to narrow exegeses of directly observed data. The division of labor would collapse; everyone would become a primary researcher, reducing time for analysis. Interdisciplinary work would suffer, as experts couldn't safely cite outside their immediate verification range. Ultimately, knowledge would become siloed and slower to accumulate. We would gain marginal accuracy but lose the collaborative scaffolding that allows complex theories to emerge. The system relies on trusted intermediaries; removing them stops the chain of knowledge.
