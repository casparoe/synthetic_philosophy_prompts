prompt: |-
  My friend just left after a 3-hour argument and I need someone to sort this out. She's doing a law PhD, and we got onto citation practices. In court, secondhand statements — hearsay — are basically radioactive; lawyers fight over whether a witness can even repeat what someone else told them. But her own dissertation is one long chain of hearsay: she cites a handbook chapter, the chapter cites trial reports, the trial reports cite what the participants said, and shes read maybe a third of it. Nobody considers that a scandal; the "only cite what you've read" rule is something everyone pretends to obey. So what does that practice presuppose about testimony? That readers will eventually trace the chain back to the original report (nobody does), or that testimony is trustworthy by default and you only check when something smells off? And is the law/academia contrast even real, or does the hearsay rule have some rationale the citation practice lacks?

  Give me sections in this order, please: (1) The implicit epistemology, ~150 words; (2) What it strictly presupposes vs. what it merely fits with, ~150 words; (3) Is the law/academia tension real?, ~100 words; (4) What would have to change if we took the stricter view seriously, ~100 words.
