prompt: |-
  I'm on the steering committee for our city's participatory budgeting program — real money, a few million a year, and residents vote directly on which infrastructure projects get funded. Historically the vote has been open to anyone 18+ living within city limits, with pretty light verification (utility bill or lease, that kind of thing; citizenship has never been required). This cycle two things blew up at once. First, a council member wants to open the vote to 16- and 17-year-olds. Second, and way more contentiously, one of my fellow committee members proposed what she calls a "stakeholder ballot": anyone who can show they're affected by the projects — daily commuters who work downtown but live in the next county over, business owners, even the seasonal crowd at the lake — could cast a ballot weighted at half a vote, on the theory that the pot comes from sales tax revenue and these people pay into it. Someone else immediately countered that if we're really going by affectedness we should go all the way: the projects are supposed to last decades, so let's add a "future residents" ballot, maybe cast by high schoolers on behalf of the people who will live here in 2050. And a third faction mostly wants to keep residents-18+ but add incarcerated folks who list a city address as their home.

  The committee agreed everyone should circulate a written opinion before next month's meeting, and I'm honestly shakey on where I land. I keep flip-flopping between "everyone subject to the decisions gets a vote," which seems right but also quietly supports the non-citizen residents we already include and maybe the 16-year-olds too, and the all-affected view, which feels fairer to the commuters but seems to expand forever — why stop at a half vote, why stop at this metro area at all. And I can't tell whether the future-residents thing is a clever reductio or a genuinely good idea.

  Draft the opinion memo I'll circulate. It needs to take a concrete position on each of the four proposals (16-year-olds, the half-weight stakeholder ballot, the future-residents proxy, incarcerated voters) — not just lay out options and shrug — and it should treat the strongest argument on the losing side honestly, since I have to keep working with these people afterward. Please structure it as: "Bottom line" (one short paragraph with my recommendation on each of the four), "What this vote is for" (about two paragraphs on the underlying question of who belongs in this particular demos and why), "The proposals one by one" (four short paragraphs), "The strongest objection to my view" (one paragraph, steelmanned), and "Can we actually run this" (short — practical notes, because I don't want us to endorse something the clerk's office can't administer).
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Steering Committee Member for a city Participatory Budgeting (PB) program.
      *   **Context:** Real money (millions), infrastructure projects, residents vote. Current rules: 18+, light verification (utility/lease), no citizenship req.
      *   **The Conflict:** Four new proposals are on the table causing tension.
          1.  Lower voting age to 16.
          2.  "Stakeholder Ballot" (half-vote for non-residents who pay taxes/use infrastructure, e.g., commuters, business owners).
          3.  "Future Residents" proxy (high schoolers voting for people in 2050).
          4.  Incarcerated voters (with city address).
      *   **User's Dilemma:** Torn between "all subject to decisions" (supports current non-citizens, 16yo) vs. "all affected" (supports commuters but expands infinitely). Unsure about future residents (reductio or real?).
      *   **Task:** Draft an opinion memo to circulate to the committee.
      *   **Requirements:**
          *   Take concrete positions on all four proposals (no shrugging).
          *   Treat opposing arguments honestly (steelmanning).
          *   Specific Structure:
              1.  Bottom Line (1 short paragraph, recommendation on each).
              2.  What this vote is for (2 paragraphs, theory of the *demos*).
              3.  The proposals one by one (4 short paragraphs).
              4.  The strongest objection to my view (1 paragraph, steelmanned).
              5.  Can we actually run this (short, practical/administrative notes).
      *   **Tone:** Professional, thoughtful, decisive but collaborative (need to keep working with them).

  2.  **Determine the Stance (The "Decision"):**
      *   *Constraint:* I need to pick a side for the draft to be effective, even though the user is "shakey." I should choose a position that is philosophically coherent and administratively feasible, reflecting a moderate-but-principled approach common in PB contexts.
      *   *Proposal 1 (16-17 year olds):* **Support.** PB is often educational. They live here, use infrastructure (schools, parks). Aligns with "subject to decisions."
      *   *Proposal 2 (Stakeholder/Half-vote):* **Oppose.** It creates a two-tier citizenship, complicates verification immensely, and dilutes the voice of actual residents. Sales tax contribution is too diffuse to justify political power in a *residential* democracy.
      *   *Proposal 3 (Future Residents):* **Oppose.** While morally interesting, it's administratively impossible and conceptually stretches "democracy" too far (proxies for non-existent people undermine accountability).
      *   *Proposal 4 (Incarcerated Voters):* **Support.** If they list the city as home, they are residents. Disenfranchisement based on incarceration contradicts the "all subject to decisions" principle, especially for PB which funds community infrastructure they may return to.
      *   *Core Philosophy:* "Residency + Subjection." You live here, you are governed here, you vote here. Avoid the slippery slope of "affectedness" which has no boundary.

  3.  **Drafting - Section by Section:**

      *   **Bottom Line:** Needs to be punchy.
          *   16-17: Yes.
          *   Stakeholder: No.
          *   Future: No.
          *   Incarcerated: Yes.
      *   **What this vote is for:** Define the *demos*. Why PB? It's about community ownership and accountability. The boundary must be clear. "All affected" is too vague. "All residents" is clear. Focus on the relationship between the voter and the *maintenance* of the infrastructure, not just the funding source.
      *   **The proposals one by one:**
          *   *16-17:* Civic engagement, they use the parks/roads.
          *   *Stakeholder:* Verification nightmare, creates class system, sales tax is already represented by business owners/residents.
          *   *Future:* Poetic but unworkable. Who defines the mandate of a 2050 resident?
          *   *Incarcerated:* Home is where the heart/family is. They return. Excluding them harms the community they rejoin.
      *   **Strongest Objection:** The "Taxation without Representation" argument for the commuters/stakeholders. It's the strongest because it hits the funding source (sales tax). Acknowledge the fairness there but explain why political boundaries still matter.
      *   **Can we actually run this:** Verification. Utility bills are easy. Commuter verification is hard. Future voters are impossible. Incarcerated verification is doable via address records. 16-year-olds need school ID or parent utility bill.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Is it too aggressive? Soften the "No" on the stakeholder ballot. Emphasize *administrative integrity* as a shield, not just ideology.
      *   *Structure Check:* Ensure all headers match the prompt exactly.
      *   *Word Count:* Keep it tight. Memos should be readable.
      *   *Philosophy:* Ensure the distinction between "residency" and "affectedness" is clear in the second section.

  5.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe support the stakeholder ballot with strict limits?
      *   *Correction:* No, the prompt asks for a concrete position. A "half vote" is administratively nightmarish (how do you count that in a simple majority system?). Better to take a firm "No" based on the definition of the political community.
      *   *Initial thought:* On incarcerated voters, is it legal?
      *   *Correction:* This is a PB program, not a state election. The committee sets the rules. So legality is less an issue than policy. Focus on the "home address" aspect.
      *   *Future Residents:* Make sure to treat it respectfully, not just as a joke. It's a "reductio" but a serious one.
      *   *Tone:* Ensure I sound like a colleague, not a judge. Use "I recommend" rather than "The committee must."

  6.  **Final Review against Constraints:**
      *   Bottom Line (1 paragraph)? Yes.
      *   What this vote is for (2 paragraphs)? Yes.
      *   Proposals one by one (4 paragraphs)? Yes.
      *   Strongest objection (1 paragraph)? Yes.
      *   Can we actually run this (short)? Yes.
      *   Concrete positions? Yes.
      *   Steelmanned objection? Yes.

  7.  **Final Polish:** Check for clarity and flow. (The resulting memo follows this structure.)
answer: |-
  **MEMORANDUM**

  **TO:** Participatory Budgeting Steering Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendations on Voter Eligibility Criteria for Cycle 5

  **Bottom Line**
  To preserve the integrity and administrative feasibility of this program, I recommend we expand eligibility to include 16- and 17-year-olds and incarcerated individuals who list a city address as their primary residence. Conversely, I recommend we reject the "stakeholder ballot" for non-resident commuters and business owners, as well as the "future residents" proxy proposal. This approach strengthens the link between those who live here and those who decide here, without introducing unmanageable verification burdens or diluting the weight of resident votes.

  **What this vote is for**
  We need to agree on what problem Participatory Budgeting (PB) is solving. If PB is purely about allocating tax revenue, then anyone who pays into the pot has a claim. But if PB is about community building, accountability, and stewardship of public space, then the primary qualification must be residency. This program works best when voters are the ones who will walk the sidewalks, wait at the bus stops, and maintain the parks we fund. It creates a feedback loop: you decide, you live with the result, you hold the city accountable. That loop breaks if the decision-makers do not share the daily reality of the infrastructure.

  Therefore, our definition of the *demos* should be "all subject to the long-term consequences of these decisions," not "all who contribute financially" or "all who are theoretically affected." Financial contribution is already represented through our elected council and business licensing; "affectedness" is infinite and unbounded. Residency is the only clear, defensible boundary that ensures the people voting are the people who will inhabit the city these projects build. We should prioritize deepening the investment of those who call this place home over broadening the vote to those who merely pass through or do not yet exist.

  **The proposals one by one**
  **16- and 17-Year-Olds:** I support lowering the age limit. These residents are already subject to city decisions regarding schools, parks, and transit. PB is one of the best civic education tools we have; excluding them denies them a stake in the community they are growing into. Verification is straightforward via school ID or parent utility bills.

  **Stakeholder Ballot (Commuters/Business Owners):** I oppose this. While it is true that sales tax contributes to our budget, introducing a half-weight vote creates a two-tiered system that devalues resident voices. Furthermore, verifying "daily affectedness" for commuters is an administrative nightmare prone to fraud. Non-resident business interests already have ample channels for lobbying the Council; PB should remain a space for individual residents.

  **Future Residents Proxy:** I oppose this. While morally compelling to consider intergenerational equity, democracy requires accountability between the voter and the outcome. A high schooler cannot authentically proxy the needs of a 2050 resident, and there is no mechanism to hold them accountable if they vote poorly. This turns a practical budgeting exercise into a philosophical simulation.

  **Incarcerated Voters:** I support eligibility for those incarcerated outside the city who maintain a city address as their home. Disenfranchisement based on incarceration severs ties to the community these individuals will likely rejoin. If their home base is here, the infrastructure we fund (libraries, community centers, housing) directly impacts their reentry and their families who remain here.

  **The strongest objection to my view**
  The most compelling argument against my position comes from the "taxation without representation" principle regarding the stakeholder ballot. Proponents argue that since a significant portion of our PB pot comes from sales tax paid by non-residents, excluding them is fundamentally unfair. If a commuter works downtown five days a week, uses our roads, and pays taxes on every lunch they buy here, they are materially contributing to the fund we are distributing. By drawing a hard line at residency, we risk prioritizing a technicality over economic reality, potentially alienating the regional partners whose economic activity makes this budget possible. This is a serious fairness concern that we cannot simply dismiss.

  **Can we actually run this**
  Practically, the resident-based model (including 16+ and incarcerated) is the only one the Clerk's office can verify at scale. We can verify residency with existing documents (leases, utility bills, school IDs). Verifying commuter status would require employer letters or transit logs, creating a bottleneck that could disenfranchise legitimate voters through delay. The "future resident" concept has no verification path at all. If we want a smooth election day, we must stick to criteria that can be validated with paper trails we already possess.
