answer: |-
  # Q&A Prep Sheet: Indifference as Invariance
  **Seminar:** Joint Philosophy/Statistics Probability Seminar
  **Thesis:** Bertrand's paradox shows underdetermination of the problem, not failure of PoI. PoI = Uniformity over orbits of the symmetry group *fixed by the problem statement*.

  ---

  ### 1. The Jaynesian "Unique Solution" Challenge
  **Questioner:** The Statistician (Jaynes Devotee)
  **Damage Level:** 🔴 Critical
  **Phrasing:** "Jaynes demonstrated in *Probability Theory: The Logic of Science* that by demanding invariance under translation, rotation, *and* scaling of the lines (the 'drunkard's walk' or maximum entropy derivation), Bertrand's problem yields a unique distribution ($1/2$). You're claiming the problem is underdetermined, but Jaynes showed the symmetry requirements are *forced* by the physical nature of 'random lines' in a plane. Aren't you retreating to subjectivity by saying 'it depends on the group' when the physics actually picks one?"

  **2-Minute Reply:**
  "Jaynes's derivation is brilliant, but it imports physical assumptions not present in Bertrand's original mathematical statement. Jaynes assumes the process generating the chord is invariant under scaling of the entire plane. But Bertrand's problem, as stated, is purely geometric; it doesn't specify a physical throwing mechanism. If I tell you 'pick a chord,' and you assume a specific physical straw-throwing experiment, you've added information. My claim is that without that physical specification, the mathematical problem *is* ambiguous. I'm not retreating to subjectivity; I'm insisting that objective constraints require objective specifications. If the problem statement doesn't fix the scale invariance, imposing it is adding a prior, not deriving one."

  **Soft Spot:**
  Jaynesians believe the "principle of maximum entropy" *is* the objective way to fill in missing physical specs. You need to hold the line that math $\neq$ physics without sounding like you're dismissing statistical mechanics.

  ### 2. The de Finetti "Why Bother?" Challenge
  **Questioner:** Subjective Bayesian #1
  **Damage Level:** 🔴 Critical
  **Phrasing:** "I accept the de Finetti representation theorem. If my priors are coherent and I update via Bayes, I'm calibrated in the long run. Indifference principles are just heuristics for people who don't want to think about their own beliefs. If invariance is just a 'rational constraint,' show me a Dutch Book against a coherent agent who *violates* invariance. If you can't, aren't you just policing aesthetics?"

  **2-Minute Reply:**
  "You're right that coherence doesn't demand invariance. A biased prior isn't incoherent. But we aren't talking about avoiding Dutch Books; we're talking about representing *ignorance*. If I know nothing about a parameter's location, but I assign a prior that peaks at 5, I'm claiming knowledge I don't have. Invariance isn't about coherence; it's about honesty. It's the formal requirement that your probability assignment shouldn't distinguish between possibilities the problem description treats as identical. It's a norm of representation, not a theorem of consistency."

  **Soft Spot:**
  This concedes that PoI is not *logical* necessity but *epistemic* normativity. Hardline subjectivists may reject epistemic norms that don't cash out in betting behavior.

  ### 3. The "Improper Prior" Trap
  **Questioner:** The Statistician (or sharp Grad Student)
  **Damage Level:** 🟠 High
  **Phrasing:** "You say 'uniform over the orbits.' For translation groups on $\mathbb{R}$, that's the Lebesgue measure. For scaling, it's $1/x$. These are improper priors. They don't integrate to one. If your 'rational constraint' forces me to use a measure that isn't a probability measure, how do I update? Are you advocating for formalism that breaks the axioms you're trying to save?"

  **2-Minute Reply:**
  "This is a known technical hurdle, not a conceptual refutation. We treat these as limits of proper priors on compact subsets, or we work with finite observation windows where the group action is restricted. In the context of Bertrand's paradox, the groups (rotations of a circle) are compact, so the Haar measure is normalizable. I'm not advocating improper priors for all cases; I'm saying where the symmetry group is compact, invariance yields a unique proper prior. Where it isn't, we acknowledge the prior is informational, not probabilistic, until data truncates the space."

  **Soft Spot:**
  Hand-waving on improper priors is dangerous in a stats department. If they press on marginalization paradoxes, you could get stuck.

  ### 4. The "Reading the Problem" Regress
  **Questioner:** Philosophy Grad Student
  **Damage Level:** 🟠 High
  **Phrasing:** "You say we use the group 'the problem statement actually fixes.' But problem statements are in natural language. One person reads 'random chord' and sees rotation invariance; another sees translation invariance. Haven't you just pushed the ambiguity from 'which parameter?' to 'which group?' Isn't this just Meta-Indifference?"

  **2-Minute Reply:**
  "It pushes the ambiguity back, yes, but to a more structured place. 'Which parameter?' is infinite. 'Which symmetry?' is constrained by the geometry of the setup. We can argue about whether 'random chord' implies scale invariance, but that's a substantive argument about the physical setup, not a mathematical confusion. It turns a paradox into a modeling decision. That's progress."

  **Soft Spot:**
  This is the core weakness. If the group selection is subjective, the resulting "objective" prior is subjective. You need to argue that group selection is *easier* to agree on than parameterization, but you can't prove it.

  ### 5. The Jaynesian "Information Loss" Objection
  **Questioner:** The Statistician
  **Damage Level:** 🟡 Medium
  **Phrasing:** "If you allow multiple groups, you're saying we should ignore the information that usually selects the group. In physical problems, we *know* the laws are translation invariant. By saying 'it depends,' aren't you telling students to throw away known physical symmetries?"

  **2-Minute Reply:**
  "No. If the physics is known, the group is fixed, and my method gives the unique Jaynesian answer. My point applies specifically to *idealized* problems like Bertrand's where the physics is *omitted*. I'm not telling you to ignore physical symmetries; I'm telling you not to hallucinate them when the problem is silent."

  **Soft Spot:**
  Distinguishing "idealized math problem" from "physical modeling" is tricky when stats is applied math.

  ### 6. The Subjective "Learning" Objection
  **Questioner:** Subjective Bayesian #2
  **Damage Level:** 🟡 Medium
  **Phrasing:** "Suppose I start with an invariant prior, but data comes in and suggests asymmetry. Do I drop the invariance constraint? If yes, it was just a guess. If no, you're blocking learning. So is it a constraint or just a starting point?"

  **2-Minute Reply:**
  "It's a constraint on the *initial* state of ignorance. Once data arrives, symmetry might be broken by the likelihood. The prior represents the state *before* that data. If the data reveals asymmetry, the posterior reflects that. The constraint applies to the representation of ignorance, not the representation of knowledge."

  **Soft Spot:**
  If the "ignorance" is never truly attainable, the constraint never applies.

  ### 7. The Wine/Water Mechanics Check
  **Questioner:** Grad Student (who read the literature)
  **Damage Level:** 🟡 Medium
  **Phrasing:** "In the Wine/Water paradox, we have ratio $r$ and inverse ratio $1/r$. Invariance under $r \to 1/r$ gives a specific prior. But why is *that* the relevant group? Why not $r \to r^2$? How do you rule out weird transformations without begging the question?"

  **2-Minute Reply:**
  "We look for the group that corresponds to the *description* of the mixture. If the description treats wine and water symmetrically (i.e., labeling is arbitrary), the swap $r \to 1/r$ is the relevant symmetry. $r \to r^2$ doesn't correspond to a relabeling of ingredients. We match the group to the semantic invariances of the setup, not just any mathematical bijection."

  **Soft Spot:**
  "Semantic invariances" is vague. A determined critic can argue $r^2$ is just a reparameterization of the same ignorance.

  ### 8. The "Constraint vs. Generator" Clarification
  **Questioner:** Seminar Organizer
  **Damage Level:** 🟢 Low
  **Phrasing:** "You closed by saying indifference is a constraint rather than a generator. Can you clarify the practical difference? If it constrains the prior to a unique function, isn't it generating it?"

  **2-Minute Reply:**
  "A generator implies it creates probability from nothing. A constraint says: 'Given your state of knowledge, *if* you claim ignorance, *then* you must look like this.' It conditions the permission to use a uniform distribution on the presence of symmetry. It prevents misuse rather than mandating use."

  **Soft Spot:**
  None really, just ensure you don't slip back into "mandating" language.

  ---

  ### 🛑 The Killer Question (Hope Nobody Asks)
  **The Question:**
  **"If the choice of symmetry group is determined by our interpretation of the problem statement, and that interpretation isn't fixed by logic or data, isn't the 'objectivity' of your solution just an illusion? You've replaced 'arbitrary parameter choice' with 'arbitrary group choice.' What normative force does your principle actually have if the input (the group) is subjective?"**

  **Why this hurts:**
  This attacks the core claim that you have solved the paradox. If the group selection is subjective, you haven't rescued Objective Bayesianism; you've just dressed Subjective Bayesianism in group theory clothing. It implies your "underdetermination" admission is actually a confession that PoI cannot do the work you want it to do.

  **Advice:**
  *   **Do not preempt it.** Bringing attention to the subjectivity of group selection undermines your abstract before you start.
  *   **If asked:** Do not try to prove the group choice is objective. Instead, argue that **intersubjective agreement** on symmetries is far easier and more robust than agreement on parameterizations. We can all agree a circle looks the same rotated; we can't agree if "length" or "midpoint" is the natural parameter. The normative force comes from *communication*, not logic. It makes priors *discussable*.
  *   **Fallback:** "It transforms a mathematical contradiction into a modeling disagreement. That is the best philosophy of science can offer."
