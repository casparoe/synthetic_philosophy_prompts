prompt: |-
  Been reading rationalist blogs since the Overcoming Bias days, and I've been around EA money circles long enough to watch the culture shift from an ethos of "multiply it out, but only where the evidence is solid" to something more like multiply it out, all the way up, however thin the tail. Here's the tension I keep chewing on. The global health wing of the movement is famous for refusing to fund things without randomized trials, cost-effectiveness estimates with error bars, explicit penalties for optimism — deep uncertainty is basically a veto on a grant. The longtermist wing happily funds things whose own proponents give a 1% or 0.1% chance of working, on the theory that a small probability of an astronomically large payoff dominates the arithmetic, and that robustness of evidence shouldn't change the expected value itself, only the estimate going into it. Same donors, same forums, people moving money between both pots. Everyone waves it off as different problems needing different tools, which strikes me as exactly the sort of thing people say when they havent worked out the actual commitments.

  So what decision theory does this two-faced funding practice presuppose, if any? Reconstruct it for me, because as far as I can tell there are a few candidate stories with very different implications. Story one: everyone's a pure EV maximizer, and the evidence-demanding side is just a debiasing correction — we systematically overestimate small chances, so demanding RCTs is a heuristic for cleaning up credences, not a principled departure from maximizing expected value, and the robustness requirement should melt away once estimates get honest enough. Story two: the community is implicitly risk-averse, or scope-insensitive, at heart, and only tolerates the fanatical bets because the numbers are too big and slippery to feel real — meaning the longtermist portfolio rests on a foundation the health wing already rejected. Story three: something like EV-is-right-but-tiny-probabilities-of-huge-payoffs-deserve-special-suspicion, i.e., the practice presupposes a non-fanatical decision theory that nobody will state out loud, since stating it would put a ceiling on the biggest bets. I want to know which of these the practice actually needs, where it's genuinely underdetermined such that several views would license it, where the two halves flatly contradict each other, and what a funder who made the presupposed view explicit would have to change — does the RCT requirement go, or do the long-shot bets?

  And since I keep getting the different-domains defense at parties: tell me whether it holds water. Is there a coherent position where you weight the reliability of evidence differently precisely when the stakes are astronomical, or does the whole edifice only stand because no one funder is forced to bet the same way twice?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Background:** Long-time observer of Rationalist/EA communities (Overcoming Bias era to present).
      *   **Observation:** A cultural shift from "evidence-solid multiplication" to "thin-tail multiplication" (longtermism).
      *   **The Tension:** Global Health (GH) demands RCTs, error bars, penalties for uncertainty. Longtermism (LT) funds 0.1% chance of astronomical payoff. Same donors, same forums, money moves between both.
      *   **The Defense:** "Different problems needing different tools."
      *   **The Question:** What decision theory does this practice presuppose?
      *   **Candidate Stories:**
          1.  Pure EV maximization + debiasing heuristics (RCTs fix overconfidence).
          2.  Implicit risk aversion/scope insensitivity (LT bets only tolerated because numbers feel fake).
          3.  Implicit non-fanatical decision theory (EV is right, but tiny probs/huge payoffs get special suspicion/weighting).
      *   **Specific Tasks:**
          *   Reconstruct the presupposed decision theory.
          *   Identify where the two halves contradict.
          *   Evaluate the "different domains" defense.
          *   Determine what changes if the view is made explicit (drop RCTs or drop long-shot bets?).

  2.  **Initial Assessment & Tone:**

      *   The user is sophisticated, skeptical, and familiar with the jargon (EV, RCTs, longtermism, fanaticalism).
      *   The tone should be analytical, charitable but rigorous, avoiding EA-speak platitudes.
      *   The core issue is the *Pascal's Mugging* problem applied to institutional practice.
      *   I need to avoid taking sides but rather expose the structural logic (or lack thereof).

  3.  **Analyzing the Candidate Stories:**

      *   *Story 1 (Pure EV + Debiasing):* This is the official orthodoxy. GH requires RCTs because human bias overestimates impact in complex systems. LT accepts low probs because the upside is *so* large that even a biased estimate survives.
          *   *Critique:* If bias is the reason for RCTs, why isn't bias also the reason to discount LT estimates? LT estimates are arguably *more* prone to bias (model uncertainty vs. parameter uncertainty).
      *   *Story 2 (Implicit Risk Aversion):* People act risk-averse in GH (sure things) but risk-neutral in LT (lottery tickets).
          *   *Critique:* This is psychologically plausible but normatively inconsistent if the goal is "do the most good." If you're risk-averse, you shouldn't fund LT. If you're risk-neutral, you should fund GH less (unless EV is vastly higher).
      *   *Story 3 (Non-Fanatical DT):* Something like "cluelessness" or "epistemic discounting."
          *   *Critique:* This is the most honest description of the *practice*, but it contradicts the *theory* (Maximize EV).

  4.  **Reconstructing the "Two-Faced" Decision Theory:**

      *   It's not a single decision theory. It's a *hybrid* regime.
      *   *Regime A (Near-term/Tractable):* Maximize EV subject to high epistemic constraints. (Bayesian updating with strong priors against efficacy).
      *   *Regime B (Existential/Long-term):* Maximize EV subject to "possibility" constraints. (If $P > 0$ and $V = \infty$, then $EV = \infty$).
      *   *The Glue:* "Epistemic Consequentialism" or "Methodological Contextualism." The method is chosen based on the *type* of uncertainty, not just the magnitude.
      *   *Key Distinction:* Parameter Uncertainty (GH) vs. Model/Structural Uncertainty (LT). GH thinks we know the model (malaria -> death), just not the parameter (cost per net). LT thinks we don't know the model (AI alignment -> survival).
      *   *Wait, does that hold?* Actually, LT proponents argue we *can't* get RCTs for x-risk. So it's not that they *choose* not to, it's that they *can't*.
      *   *The Real Tension:* It's about *Epistemic Humility*. GH applies humility to the *claim*. LT applies humility to the *counterfactual* (what if we don't act?), but not the *intervention efficacy*.

  5.  **Evaluating the "Different Domains" Defense:**

      *   Does it hold water? Partially.
      *   *Argument:* You can't RCT an existential risk reduction. Therefore, demanding RCTs for LT is category error.
      *   *Counter-argument:* If you can't measure it, you should discount the confidence, not just accept the raw EV. The "discount factor" should be higher for LT.
      *   *The "Cluelessness" Objection:* Longtermists argue we are clueless about indirect effects in GH too, so LT is just more honest about the long chain. GH advocates argue the chain is shorter.
      *   *Verdict:* The defense holds water *operationally* (you can't run an RCT on AI alignment), but fails *normatively* (why trust the 1% estimate if it's untestable?).

  6.  **Addressing the Contradictions & Implications:**

      *   *Where they contradict:* The treatment of *uncertainty*. GH treats uncertainty as a reason to reject (risk of waste). LT treats uncertainty as a reason to investigate (risk of ruin).
      *   *Actually, it's deeper:* It's about the *Prior*. GH has a strong prior against interventions working (most things don't). LT has a weak prior against interventions working (physics allows it), but a strong prior on the *value* of the outcome.
      *   *If made explicit:*
          *   If Pure EV: GH should loosen RCTs if EV is high enough (e.g., policy advocacy). LT should discount probabilities heavily for lack of feedback loops.
          *   If Risk-Weighted: LT funding should vanish or shrink drastically.
          *   If Epistemic Discounting (Story 3): LT funding needs a "complexity penalty" that GH doesn't face.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sharpness of the observation. Validate the "two-faced" feeling.
      *   *Section 1: The Official Story (Story 1).* Explain the "Epistemic Security" argument. GH = high security, low variance. LT = low security, high variance. The claim is that LT estimates are "robust" in a different way (theoretical vs empirical).
      *   *Section 2: The Psychological Reality (Story 2).* Acknowledge that donors are likely risk-averse in practice but override it for LT due to "scope neglect" reversal (the numbers are so big they trigger a different cognitive mode).
      *   *Section 3: The Hidden Theory (Story 3).* This is the meat. The practice actually relies on **Epistemic Contextualism**.
          *   Distinction: *Measurement Uncertainty* (GH) vs. *Structural Uncertainty* (LT).
          *   GH: We know the map, we are measuring the terrain.
          *   LT: We are drawing the map.
          *   The Decision Theory: **Maximize EV subject to Epistemic Constraints appropriate to the Domain.**
      *   *Section 4: The "Different Domains" Defense.*
          *   It holds water regarding *feasibility* (can't RCT x-risk).
          *   It fails regarding *calibration* (why trust the 1%?).
          *   The "Feedback Loop" argument: GH has feedback (people live/die). LT has no feedback until it's too late. This justifies different *methods*, but should it justify different *confidence*?
      *   *Section 5: What breaks if we make it explicit?*
          *   If you admit Story 3: You need a formal "Epistemic Discount Rate" based on testability. LT bets get discounted harder.
          *   If you admit Story 1: GH gets riskier (policy funding), LT gets stricter (calibration training).
          *   If you admit Story 2: LT gets cut.
      *   *Conclusion:* The practice presupposes a **lexicographic preference**: Avoid immediate observable suffering (GH) *unless* the existential threat is credible enough to trigger the "Emergency Override" (LT). It's not one decision theory; it's a switch.

  8.  **Refining the Decision Theory Reconstruction:**

      *   I need to be precise. Is it *Risk-Weighted Expected Utility* (RWEU)? No, because they claim to be EV maximizers.
      *   Is it *Bayesianism with different Priors*? Yes.
      *   Is it *Satisficing*? Maybe for GH (must meet bar), Maximizing for LT.
      *   *Best fit:* **Two-System Epistemology.** System 1 (GH): Empiricist, frequentist-leaning, error-bar focused. System 2 (LT): Rationalist, theoretical, model-based.
      *   *The Conflict:* The "Pascal's Mugging" objection. Longtermists answer this with "robustness" (many arguments point to same conclusion). GH answers with "evidence" (data points to conclusion).
      *   *The Synthesis:* The community operates on **Tractability-Weighted EV**.
          *   GH: High tractability, medium importance, medium neglectedness.
          *   LT: Low tractability, high importance, high neglectedness.
          *   The "Different Domains" defense rests on the idea that *Tractability* is defined differently. In GH, tractability = measurable. In LT, tractability = theoretically plausible.

  9.  **Final Polish:**

      *   Ensure I answer the specific prompt: "What decision theory does this... presuppose?"
      *   Make sure to address "where the two halves flatly contradict."
      *   Address "what a funder... would have to change."
      *   Keep the tone intellectual, slightly cynical but fair.

      *(Self-Correction during drafting)*: I should avoid saying "EA is hypocritical." Instead, frame it as "unresolved tension in applied normative ethics." The user knows the culture; they want the structural analysis.
      *   Key concept to introduce: **Epistemic Discounting vs. Probability Discounting.** GH discounts the *probability* because the evidence is weak. LT claims the probability is *robust* despite weak evidence because the *theoretical argument* is strong. This is the crux.

  10. **Final Structure:**
      *   Intro: Validate the tension.
      *   The Official View (Story 1 refined).
      *   The Actual Practice (Story 3 refined).
      *   The "Different Domains" Defense (Evaluation).
      *   The Contradiction (Where it breaks).
      *   The Explicit Fix (What changes).

      *(Wait, one more thing)*: The user mentioned "Overcoming Bias days." I should acknowledge the history of "Bayesianism" vs "Frequentism" in that community. The shift is from "Bias Correction" to "EV Maximization at all costs."

      *Let's lock in the Decision Theory:* It's **Constrained Expected Utility Maximization**, where the constraints are domain-relative epistemic standards. It's not one DT, it's a *policy* over DTs.

      *Okay, ready to write.*
answer: |-
  This is one of the sharpest critiques of the current Effective Altruism (EA) operational landscape I've seen. You've identified the central fracture line: the tension between *epistemic humility* (the Global Health/Development wing) and *fanatical expected value* (the Longtermist wing).

  You are correct that "different problems needing different tools" is often a conversation-stopper rather than an explanation. If the goal is strictly "do the most good" (Maximize EV), the method of estimation should not fundamentally alter the decision rule, only the inputs. If the inputs are generated by incompatible epistemologies, the output is incoherent.

  Here is the reconstruction of the decision theory presupposed by this two-faced practice, an evaluation of the "different domains" defense, and what breaks if you force consistency.

  ### 1. Reconstructing the Presupposed Decision Theory

  The community does not actually operate on a single decision theory. It operates on a **Lexicographic Hybrid of Constrained Expected Utility.**

  It looks like Story 1 (Pure EV + Debiasing) on the website, but the practice is closer to Story 3 (Non-Fanatical/Epistemic Discounting) with a dash of Story 2 (Psychological Compartmentalization).

  **The Formal Structure:**
  The funding practice presupposes a decision rule that switches based on the *type of uncertainty* involved, not just the magnitude of the stakes.

  *   **Regime A (Global Health): Risk-Weighted EV with High Epistemic Penalties.**
      *   *Uncertainty Type:* Parameter Uncertainty (We know malaria causes death; we don't know the exact cost-per-life saved).
      *   *Decision Rule:* Maximize EV, subject to a constraint that $P(impact)$ must be empirically bounded.
      *   *Implicit Discount:* Uncertainty is treated as a risk of *waste*. If the error bars are wide, the lower bound of the CI (Confidence Interval) is used for decision-making, or the grant is rejected. This is effectively **Risk-Aversion** masked as "rigor."
  *   **Regime B (Longtermism): Unweighted EV with Theoretical Robustness.**
      *   *Uncertainty Type:* Structural/Model Uncertainty (We don't know if AI will kill everyone, or if nanotech is possible).
      *   *Decision Rule:* Maximize EV, subject to a constraint that the *argument* is theoretically sound, even if empirical $P$ is low.
      *   *Implicit Discount:* Uncertainty is treated as a risk of *ruin*. The lack of empirical data is excused because the domain (existential risk) precludes feedback loops. The "1% chance" is accepted if derived from a "strong theoretical prior" rather than data.

  **The Glue:**
  The presupposed theory is **Epistemic Contextualism.** It claims that the *standard of evidence* required to justify a probability estimate is relative to the *tractability of measurement* in that domain.
  *   In GH, measurement is tractable $\rightarrow$ High evidence bar.
  *   In LT, measurement is intractable $\rightarrow$ Low evidence bar (substituted with "argumentative robustness").

  ### 2. Evaluating the "Different Domains" Defense

  Does this hold water? **Operationally, yes. Normatively, no.**

  **Where it holds water:**
  It is true that you cannot run an RCT on preventing an existential catastrophe. There is no control group for "humanity goes extinct." If the GH wing demanded RCTs for AI alignment, they would be demanding the impossible. Therefore, the *method* of estimation must differ. The Longtermist wing is forced to rely on subjective Bayesian priors and theoretical modeling because frequentist data does not exist.

  **Where it collapses:**
  The defense fails on **Calibration.**
  *   In GH, when estimates are wrong, we find out (people didn't get bednets, or malaria rates didn't drop). This creates a feedback loop that punishes optimism.
  *   In LT, when estimates are wrong, we often *never find out* (the catastrophe didn't happen, but maybe it wouldn't have anyway; or it did happen, and no one is left to audit the grant).
  *   **The Contradiction:** The GH wing penalizes optimism because humans are systematically overconfident. The LT wing accepts optimism (1% chances) without the same penalty, despite the fact that humans are *even more* overconfident when dealing with complex, untestable theoretical models than with simple health interventions.

  If the "Different Domains" defense were consistent, the LT wing would apply a **massive epistemic discount factor** to compensate for the lack of feedback loops. Instead, they often treat a theoretical 1% as equivalent to an empirical 1%. This is where the two halves contradict: one side treats uncertainty as a reason to shrink the probability estimate; the other treats uncertainty as an inherent feature of the territory that doesn't discount the map.

  ### 3. Which Story is Actually Driving the Bus?

  You asked which of the three stories the practice needs.

  *   **Story 1 (Pure EV + Debiasing)** is the *public* story. It cannot sustain the practice. If you were a pure EV maximizer who believed RCTs were just a debiasing tool for GH, you would have to admit that LT estimates are *more* biased (due to lack of feedback). To be consistent, you would either need to discount LT probabilities heavily (killing the EV) or loosen GH standards (funding more policy/advocacy).
  *   **Story 2 (Implicit Risk Aversion)** explains the *psychology* of the donors. Most donors are naturally risk-averse. They like GH because it feels real. They tolerate LT because the "astronomical waste" argument triggers a scope-insensitivity override—the numbers are so big they bypass the risk-aversion circuit. This explains why the money moves between pots: it's mood-affinity funding.
  *   **Story 3 (Non-Fanatical DT)** is what the *practice* actually requires to survive scrutiny. The community implicitly relies on a "cluelessness" objection without stating it. They fund LT bets not because the EV is literally higher (which would imply Pascal's Mugging), but because the *potential* is uncapped, and they apply a hidden "complexity penalty" that they don't apply to GH.

  **The Verdict:** The practice presupposes **Story 3**, but justifies itself with **Story 1**. This is the source of the cognitive dissonance you are sensing.

  ### 4. What Breaks If We Make It Explicit?

  If a funder made the presupposed view explicit, one of the two wings would have to change drastically.

  **Scenario A: Consistency with Global Health Epistemology**
  If you apply the GH standard (empirical bounds, penalty for lack of feedback) to Longtermism:
  *   **Change:** The 1% probabilities for x-risk mitigation collapse to 0.0001% or lower due to "model uncertainty penalties."
  *   **Result:** Most Longtermist grants become unjustifiable. The "astronomical waste" argument fails because the probability is discounted faster than the value scales up. The portfolio shifts heavily toward near-term, tractable interventions.

  **Scenario B: Consistency with Longtermist Epistemology**
  If you apply the LT standard (theoretical plausibility, acceptance of untestable models) to Global Health:
  *   **Change:** The RCT requirement is dropped for policy and advocacy work where EV is high but hard to measure (e.g., immigration reform, institutional change).
  *   **Result:** The Global Health wing becomes much more "political" and speculative. They would fund things with high variance and weak evidence chains, provided the theoretical EV is high. GiveWell's top charities list would look very different (more advocacy, fewer bednets).

  **Scenario C: Consistency with Risk-Weighted EV (Story 2)**
  If you admit donors are risk-averse:
  *   **Change:** You explicitly maximize Risk-Weighted Expected Utility (RWEU) rather than EV.
  *   **Result:** Longtermist bets are slashed immediately. RWEU heavily penalizes low-probability, high-stakes gambles. The portfolio becomes almost entirely Global Health and Animal Welfare (where outcomes are more certain).

  ### 5. The "Different Domains" Defense: Final Verdict

  The defense only holds if you accept that **Epistemic Standards are Instrumental, not Intrinsic.**

  If your goal is "Truth," you should use the same standard everywhere. If your goal is "Impact," you can argue that the standard of evidence should be optimized for the domain's *measurement capacity*.
  *   *Argument:* "We demand RCTs in GH because we *can* get them, and they prevent waste. We accept models in LT because we *can't* get RCTs, and refusing to act guarantees extinction."

  **The Flaw:** This argument works for *action*, but not for *allocation*. It justifies doing *something* in LT, but it does not justify allocating *more money* to LT than GH. For LT to dominate the portfolio (as it currently does in some circles), the *estimated EV* must be higher. But if the LT probability estimate lacks the "optimism penalty" that the GH estimate receives, the comparison is rigged.

  **Conclusion:**
  The two-faced funding practice presupposes a **silent epistemic discount rate** that is applied to Global Health (for lack of perfection) but waived for Longtermism (for lack of alternatives).

  To resolve the tension without hypocrisy, a funder must either:
  1.  **Apply the "Optimism Penalty" to Longtermism:** Discount LT probabilities heavily for lack of feedback loops. (Likely kills the LT dominance).
  2.  **Drop the "RCT Veto" for Global Health:** Fund high-EV policy/advocacy with weak evidence. (Likely makes GH more political/controversial).

  Currently, the community avoids this choice by keeping the decision theory implicit. The "Different Domains" defense is a shield against the realization that **you cannot compare the EV of a bednet to the EV of an AI alignment paper using the same arithmetic, unless you adjust for the reliability of the numbers going into the arithmetic.** They are doing the arithmetic without adjusting for the reliability.
