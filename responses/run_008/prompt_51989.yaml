      *   *Point 3:* The scale matters. Do Allais violations persist at the stakes used in RLHF (usually low stakes tokens/outputs) vs. the lottery payments? If the RM is for text generation, do financial lotteries even map?
      *   *Drafting thought:* Be direct. The mapping from financial lotteries to text preferences is the weakest link. Also, the assumption that EUT is the only " sane" baseline is itself contestable, but practically necessary for optimization stability.

  6.  **Review and Refine:**
