      *   **Core Question:** Should the reward model reproduce these violations or idealize them away? What does the reward model actually learn?
      *   **Key Themes to Hit:**
          *   Preference as data (description) vs. preference as target (optimization).
          *   Asymmetry: Reward model is optimized against by an agent.
          *   "Bias" vs. "Feature" (systematic, robust violations).
          *   Operationalizing "idealizing" (fit to axiom, reflective endorsement, money pump avoidance).
      *   **Format:**
          1.  "Where it actually bites" (2 paragraphs).
          2.  "Reproduce vs. idealize" (Longest section, strongest arguments + breaking points).
          3.  "What I can do in my experiments" (Concrete, implementable tests/diagnostics).
