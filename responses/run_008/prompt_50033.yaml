answer: |-
  You have identified a phenomenon that sits at the intersection of action theory, social psychology, and professional ethics. Your intuition is correct: while **outcome bias** and **moral luck** are the standard neighbors, neither captures the specific *grammatical* or *ontological* move you are describing.

  Outcome bias is evaluative (grading the decision); moral luck is normative (questioning whether we *should* grade by results); hindsight bias is epistemic (claiming predictability). What you are describing is **constitutive**: the outcome is treated as a defining ingredient of the act itself, altering its identity rather than just its score.

  There is no single, universally standardized term in the psychological literature that isolates this specific mechanism of *act-reidentification*. However, in the philosophy of action, this is discussed under the header of **act-individuation**. Drawing on that framework and the psychological literature on the **Knobe Effect** (side-effect effect), I propose the precise term for this phenomenon is **Constitutive Outcome Bias**.

  Below is the precise definition, its philosophical grounding, and how it distinguishes itself from its neighbors.

  ### 1. The Term: Constitutive Outcome Bias

  **Definition:** *Constitutive Outcome Bias* is the cognitive tendency to retroactively alter the **description** of an action (its identity, intent, or character) based on its outcome, such that the outcome is treated as evidence of what the action *was*, rather than merely what the action *caused*.

  In your examples:
  *   **Standard Outcome Bias:** "That was a risky call, and it failed, so it was a *bad* call." (The act is the same; the grade is F.)
  *   **Constitutive Outcome Bias:** "That was a *reckless* call." (vs. "That was a *decisive* call.") (The act itself is reclassified into a different ontological category.)

  The "bias" lies in the sincere denial of contingency. The observers do not feel they are re-evaluating; they feel they are *seeing clearly* for the first time. The outcome collapses the wave function of the decision's ambiguity.

  ### 2. Philosophical Grounding: Act-Individuation

  To understand why this is distinct from outcome bias, we must look to **Action Theory** (specifically the work of Elizabeth Anscombe and Donald Davidson).

  Actions are "individuated under descriptions." Physically, you moved your hand and pressed a syringe plunger. But under what description did you act?
  *   Description A: "Administering a life-saving drug."
  *   Description B: "Injecting a lethal toxin."

  If the patient lives, the action is truthfully described as A. If the patient dies, observers retroactively insist the action was *always* B. They are not just saying B was *bad*; they are saying the physical movement *was* B all along.

  **Constitutive Outcome Bias** occurs when the outcome is allowed to determine which description is the "true" one, erasing the fact that at the moment of decision, the description was indeterminate. It treats the *consequence* as a *constituent* of the *act*.

  ### 3. Distinction from Neighboring Concepts

  | Concept | Core Mechanism | How it differs from Constitutive Outcome Bias |
  | :--- | :--- | :--- |
  | **Outcome Bias** | **Evaluation.** Judging the *quality* of a decision by the result. | Admits the decision was the same, but grades it differently. Your colleagues deny the decision was the same. |
  | **Moral Luck** | **Normative.** The philosophical puzzle of whether luck *should* affect blame. | This is the *problem* you are observing, not the *mechanism* of the observation. Moral luck asks "Is this fair?"; Constitutive Bias asks "How are they describing the act?" |
  | **Hindsight Bias** | **Predictability.** "I knew it all along." | Focuses on the *inevitability of the result*. Constitutive Bias focuses on the *character of the agent/act*. |
  | **The Knobe Effect** | **Intentionality.** Attributing *intent* based on moral valence of outcomes. | Very close. The Knobe Effect shows we call harmful side-effects "intentional" and helpful ones "unintentional." Constitutive Outcome Bias is broader: it covers competence, prudence, and professional character (reckless vs. decisive), not just intent. |

  ### 4. Boundary Cases: When is it Legitimate?

  You asked for boundary cases where this shades into legitimate learning. This is crucial for a physician, because sometimes outcomes *do* reveal the true nature of an act.

  **Case 1: The Hidden Variable (Legitimate Learning)**
  *   *Scenario:* Doctor A gives Drug X. Patient dies. Autopsy reveals a rare genetic contraindication unknown at the time.
  *   *Analysis:* Colleagues call it "negligent" because they now know the contraindication.
  *   *Verdict:* **Not Constitutive Bias.** New information has entered the record. The risk profile *actually was* different, even if unknown. The act-description changes because the *facts of the situation* have changed, not just the result.

  **Case 2: The Process Reveal (Legitimate Learning)**
  *   *Scenario:* Doctor A makes a risky call. Patient dies. Chart review reveals Doctor A skipped a safety checklist that Doctor B (who succeeded) followed.
  *   *Analysis:* Colleagues call Doctor A "reckless."
  *   *Verdict:* **Not Constitutive Bias.** The outcome triggered an investigation that revealed a *process difference*. The act was objectively different (checklist vs. no checklist).

  **Case 3: The Pure Result (Constitutive Outcome Bias)**
  *   *Scenario:* Doctor A and Doctor B make the exact same calculated risk with the same information, same checklist, same physiology. Patient A lives; Patient B dies.
  *   *Analysis:* Colleagues say Doctor A was "decisive" and Doctor B was "reckless." When challenged, they insist, "No, look, Doctor B *clearly* didn't think it through," despite identical charting.
  *   *Verdict:* **Constitutive Outcome Bias.** The outcome is doing 100% of the work in defining the act, but the observers attribute the definition to the agent's internal state.

  ### 5. Why This Matters for You

  Naming this **Constitutive Outcome Bias** gives you a tool to intervene in morbidity and mortality (M&M) conferences or informal debriefings.

  When you hear the reclassification happening ("That was reckless"), you can test for the bias by asking a counterfactual question designed to separate the *act* from the *outcome*:

  > *"If the patient had survived, would we be using the word 'reckless' to describe this decision tree, or would we be calling it 'aggressive but appropriate'?"*

  If they hesitate, you have exposed the constitutive link. You can then reframe the discussion:

  > *"It seems we are letting the outcome determine the description of the act. If we agree the information available at the time was identical, we need to describe the act identically, and then discuss how we manage the risk of the 10% where this act kills."*

  ### Summary
  The phenomenon is **Constitutive Outcome Bias**. It differs from outcome bias because it changes the **identity** of the act, not just its **evaluation**. It differs from hindsight bias because it concerns the **agent's character**, not the **event's predictability**. It is the linguistic mechanism by which **resultant moral luck** is silently converted into **professional character assessment**.
