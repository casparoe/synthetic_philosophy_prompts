  Alex plans to furnish a new apartment and visits a furniture store that offers a "Flex-Plan" on sofas: customers can order a model and swap it upon delivery for a fee. At time t1 (ordering), Alex prefers the Deluxe sofa ($1,000) to the Standard sofa ($800) because it looks better in the showroom, and willingly pays a $100 deposit to secure the Deluxe. At time t2 (delivery), the Deluxe proves too large for the living room; Alex now prefers the Standard sofa plus the $300 swap fee (total $1,100) to keeping the Deluxe ($1,000), because the fit matters more now than the saved money. Alex pays the fee to switch. The transaction ends with Alex owning the Standard sofa having paid $1,100 total, whereas Alex could have purchased the Standard sofa directly at t1 for $800. The store clerk, acting as an ordinary counterpart with no special knowledge of Alex's psychology, simply offered the standard contract and swap menu available to all customers; the clerk did not need to predict Alex's reversal, only offer the options that made each step locally attractive.

  **Proof of Specification and Analysis**

  **1. Static Impeccability and Individual Rationality**
  At t1, Alex's preferences are transitive and complete: Deluxe > Standard. Paying the deposit maximizes expected utility given t1 beliefs (that the Deluxe will fit). At t2, preferences are also transitive and complete: Standard (net of fee) > Deluxe. Paying the fee maximizes utility given t2 beliefs (that the Deluxe does not fit). No synchronic audit reveals intransitivity or EU violation; at each node, Alex chooses the dominant option relative to current holdings and valuations. The vulnerability is purely diachronic: the ranking of outcomes shifts between t1 and t2 due to the change in context (showroom vs. actual living room), violating **Dynamic Consistency** while preserving Synchronic Consistency.

  **2. Choice Strategies**
  *   **Naive Choice:** Alex chooses at each node based solely on current preferences, ignoring how t1 choices constrain t2. Alex chooses Deluxe at t1 (preferring it to Standard) and switches at t2 (preferring Standard+Fee to Deluxe). Result: $300 loss compared to the t1-available Standard option. The pump succeeds.
  *   **Sophisticated Choice:** Alex anticipates the t2 preference reversal at t1. Recognizing that choosing Deluxe at t1 will lead to a switch at t2 (total cost $1,100), Alex compares this final outcome to choosing Standard at t1 (total cost $800). Since $800 < $1,100, Alex chooses Standard at t1. Result: No loss. The pump is avoided by backward induction.
  *   **Resolute Choice:** Following McClennen, Alex adopts a plan at t1 that is optimal ex ante and commits to it even if local preferences change at t2. If Alex determines at t1 that the Deluxe is truly preferred (perhaps valuing aesthetics over fit even knowing the risk), Alex chooses Deluxe and *refuses* to switch at t2 despite the local preference for Standard. Result: Alex keeps the Deluxe for $1,000. While Alex may suffer utility regret at t2, no *money* is pumped out via fees. Resolute choice blocks the monetary drain by decoupling t2 action from t2 local preference, adhering instead to the t1 plan.

  **3. The Critical Feature and Removal**
  The feature doing the work is **Dynamic Inconsistency (Preference Reversal)**. The agent's valuation of the options changes between t1 and t2 not because of new information about the world (the sofa size was constant), but because the *temporal proximity* of the consequence (living with the sofa) alters the weight of attributes (fit vs. looks). If you remove this feature—i.e., if Alex is Dynamically Consistent and values Fit vs. Looks identically at t1 and t2—Alex would either choose Deluxe at both stages (no switch, no fee) or Standard at both stages (no switch, no fee). The money pump collapses immediately without dynamic inconsistency.

  **4. Opponent Attack**
  A defender of standard decision theory (e.g., a CDT proponent) would attack this case by arguing that **Dynamic Consistency is a requirement of rationality**, not merely a planning aid. They would claim that an agent who violates dynamic consistency is effectively holding intransitive preferences over temporal outcomes (preferring D-at-t2 to S-at-t2 at t1, but S-at-t2 to D-at-t2 at t2). They would argue your paper conflates "coherence" with "synchronic coherence"; true rational coherence requires diachronic stability. Therefore, the money pump *does* expose a coherence failure (diachronic intransitivity), not just a failure of commitment. They would assert that the "Resolute" agent is irrational for ignoring their current preferences at t2, making your solution normatively dubious.

  **5. Constraint Admission**
  Per your warning: This case *cannot* work if the agent is both Synchronically AND Diachronically Consistent with stable Expected Utility. To generate the pump while maintaining synchronic transitivity, I have necessarily relaxed the constraint of **Dynamic Consistency** (stable preferences over time). If you require an agent who is fully dynamically consistent (exponential discounting, no preference reversal), a money pump is mathematically impossible without introducing synchronic intransitivity. Your thesis holds only if you define "coherence of preferences per se" as strictly synchronic; if coherence includes diachronic stability, the pump still indicates a rationality failure, just a temporal one.
