prompt: |-
  i'm a philosophy phd student (epistemology-ish) and i somehow convinced a decision theorist to come on the tiny podcast i run — she's one of the few people who actually defends the common prior assumption, like full-throated "rational agents cannot agree to disagree" style, not just as a modeling convenience. i've read aumann's 1976 paper and skimmed some of the surrounding literature but im definately not fluent in it, so help me not embarass myself. draft me eight or so interview questions that go beyond having her restate the view.

  specifics:

  - at least one question on where the common prior is even supposed to come from — the reading where you're sort of born with a prior vs the reading where the prior is just a stand-in for everything you learned before the model starts, and whether that second reading makes the assumption trivially true and unfalsifiable (if any disagreement just means you "must have had different priors all along," what would ever count as evidence against it?)
  - one on what the theorem actually requires — my understanding is it needs common knowledge of the two posteriors, which basically never holds between actual humans arguing on the internet. is the defender commited to saying real disagreements are all just information asymmetry, or can she live with the assumption being about idealized agents only?
  - one that connects to the peer disagreement literature i actually know — when two epistemic peers disagree, is her view that one of them is being irrational, or just that they're working from different evidence and both fine? i want to know how close "common priors" is to the conciliationist position and where they come apart
  - one on the idealization defense — people say it's like frictionless planes in physics, fine, but i want to press on what the idealization is FOR. what do we learn about real disagreement from studying agents that don't have it?

  for each question also give a follow-up keyed to the answer she's most likely to give — she's spent her career on this so she'll have a rehearsed reply, and i want the question behind the question.

  at the end, tell me how confident you are that each of these is an objection the literature actually presses versus something you half-remember, and single out the one question you're least sure is even a real debate — i do not want to ask something and have her politely explain that nobody holds that position. and flag if any of my framing above is off, since i might be misremembering the theorem's conditions.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions and analysis:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy PhD student (epistemology focus).
      *   **Task:** Draft 8 interview questions for a decision theorist who defends the Common Prior Assumption (CPA) robustly (Aumann-style, not just modeling convenience).
      *   **Goal:** Avoid embarrassment, go beyond restating the view, probe deep objections.
      *   **Specific Requirements:**
          *   Q on origin of priors (innate vs. pre-model learning) & falsifiability.
          *   Q on theorem conditions (common knowledge of posteriors) vs. real human disagreement.
          *   Q connecting to peer disagreement literature (conciliationism vs. CPA).
          *   Q on the purpose of the idealization (what do we learn?).
          *   Total: ~8 questions.
          *   For each: Include a follow-up keyed to likely rehearsed answers.
          *   End with confidence ratings on whether these are real objections in the literature.
          *   Flag the "least sure" question.
          *   Flag any framing errors in the user's prompt.

  2.  **Deconstruct the Subject Matter (Aumann's Agreement Theorem & CPA):**
      *   *The Theorem:* If two agents have the *same prior*, and their posteriors for a given event are *common knowledge*, then their posteriors must be identical.
      *   *The Assumption (CPA):* Rational agents *should* or *do* have the same prior.
      *   *The Defense:* Often rooted in Harsanyi's doctrine or the idea that differences in priors reflect differences in information processing which should be accounted for in the state space, or that priors are fixed by rationality constraints (logic + evidence).
      *   *The Criticism:* Priors seem subjective. People are born different. "Agreeing to disagree" happens all the time. Is CPA empirical or normative? Is it falsifiable?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Origin of Priors/Falsifiability.*
          *   *Draft:* Where do priors come from? If it's just past learning, isn't it unfalsifiable?
          *   *Refinement:* Make it sharper. Distinguish between "tabula rasa" rationality vs. "historical accumulation." The "unfalsifiable" charge is the key philosophical bite.
          *   *Follow-up:* If she says "it's normative," ask what work the norm does if violations are explained away by positing different priors.

      *   *Requirement 2: Theorem Conditions (Common Knowledge) vs. Reality.*
          *   *Draft:* Humans don't have common knowledge. So is the theorem useless?
          *   *Refinement:* Focus on the *implication* for real disagreement. If the conditions fail, does the theorem imply nothing? Or does she think real disagreements *are* failures of common knowledge (information asymmetry)?
          *   *Follow-up:* If she says "it's about information asymmetry," ask about persistent disagreement *after* sharing evidence.

      *   *Requirement 3: Peer Disconnection/Conciliationism.*
          *   *Draft:* How does this fit with peer disagreement? Are peers irrational?
          *   *Refinement:* Connect CPA to the "Uniqueness Thesis." If CPA is true, is Uniqueness true? Does disagreement entail irrationality?
          *   *Follow-up:* If she says "one is irrational," ask how we identify *which* one without a God's-eye view of the true prior.

      *   *Requirement 4: Idealization/Physics Analogy.*
          *   *Draft:* Why idealize? What do we learn?
          *   *Refinement:* Frictionless planes predict motion *with* friction. What does CPA predict about disagreement *with* different priors? Does it give a baseline for "how much" disagreement is rational?
          *   *Follow-up:* If she says "it sets a benchmark," ask if there's a metric for distance from the benchmark.

      *   *Filling the remaining 4 questions (to reach ~8):*
          *   *Q5: The "State Space" Move.* Defenders often say "if you disagree, we just didn't describe the state space finely enough." Challenge this. Is it a get-out-of-jail-free card?
          *   *Q6: Evolutionary/Biological angle.* Why would evolution give us different priors? If rationality is adaptive, shouldn't priors converge?
          *   *Q7: Logical Omniscience.* Aumann assumes logical omniscience. Is the failure to agree just a failure of logic? How does bounded rationality fit?
          *   *Q8: Normative Force.* If I accept CPA, what must I *do*? Does it demand I update toward you even if I think you're wrong? (Connection to reflection principle).

  4.  **Reviewing against Constraints & Fact-Checking:**
      *   *User's Framing Check:*
          *   "Common knowledge of the two posteriors": Correct.
          *   "Rational agents cannot agree to disagree": Correct summary of the corollary.
          *   "Born with prior vs. stand-in for learning": This is the "Harsanyi Doctrine" vs. "Subjective Bayesian" debate. Valid.
          *   "Conciliationism": Valid connection. CPA often implies a strong form of conciliationism (or Uniqueness).
      *   *Confidence Check:* I need to be careful not to invent debates. The "unfalsifiability" objection is standard (e.g., Gul 1998). The "common knowledge is rare" objection is standard (e.g., Monderer & Samet). The connection to Peer Disagreement (Elga, Christensen) is a hot topic. The "idealization" defense is standard (Morris 1995).
      *   *Least Sure Question:* The Evolutionary one (Q6) might be less central to *pure* epistemology/decision theory than the others, though it appears in behavioral econ. I'll flag that.
      *   *Framing Error:* The user says "common knowledge of the two posteriors." Technically, Aumann requires common knowledge of the *partition* and the *posteriors*. But colloquially, "common knowledge of posteriors" is acceptable shorthand. I should note the "partition" nuance in the advice.
      *   *Another Framing Nuance:* The user asks if the second reading (prior = sum of past learning) makes it "trivially true." Actually, defenders argue it makes it *substantive* because it implies all differences *must* be traceable to information. Critics say it makes it *unfalsifiable*. I need to ensure the question captures this tension accurately.

  5.  **Finalizing the Questions and Follow-ups:**
      *   Ensure the tone is respectful but probing (PhD to Expert).
      *   Ensure the follow-ups anticipate the "Standard Defense."
      *   Add the confidence ratings and framing flags at the end.

  6.  **Refining the Output:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't sound *too* technical in the prompt instructions, but the questions themselves should use the jargon correctly (partitions, common knowledge, Uniqueness Thesis).
      *   *Correction:* Ensure the "Peer Disagreement" question distinguishes between "steady state" disagreement (Aumann) and "initial reaction" disagreement (Peer Disagreement lit). Aumann is about common knowledge of *current* credences. Peer disagreement is often about how to react to the *fact* of disagreement. I need to bridge this carefully.

