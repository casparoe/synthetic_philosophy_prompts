          *   With the aversion shown in Data 1 (CE 32 vs Mean 50), would she accept a bet with Mean 45 and high variance?
          *   Variance of $110p - 10$ is $110^2 \times Var(p) = 12100 \times 0.083 \approx 1000$.
          *   Variance of Data 1 ($100p$) is $10000 \times 0.083 \approx 833$.
          *   The variance in Data 3 is *higher* than Data 1.
          *   In Data 1, Mean 50 -> CE 32 (Drop of 18).
          *   In Data 3, Mean 45. If ambiguity aversion is similar, Drop should be $\ge 18$.
          *   $45 - 18 = 27 > 0$. So she should accept.
          *   Smooth Ambiguity fits Data 3 comfortably.

      *   **Choquet Expected Utility (CEU) / Neo-Additive Capacities:**
          *   Often used for Ellsberg.
          *   $V(f) = \delta \cdot \text{AmbiguityPart} + (1-\delta) E_\pi[f]$.
          *   Neo-additive (Chateauneuf, Eichberger, Grant): $V(f) = (1-\gamma) E_\pi[f] + \gamma [\alpha \min f + (1-\alpha) \max f]$.
          *   This looks a lot like $\alpha$-MEU but with a baseline prior $\pi$.
          *   For Ellsberg 2-Urn: $\pi=(0.5, 0.5)$. $\min=0, \max=100$.
