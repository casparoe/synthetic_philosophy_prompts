      *   **Goal:** Predict choices on two new bets (A & B), identify the decision rule fitting her track record, compare model predictions, select the best model, and propose a tie-breaking bet.
      *   **Data Points (Track Record):**
          1.  *Ellsberg 2-Urn:* Known (50/50) vs. Ambiguous (100, ?/?). Chooses Known. WTP: Known=$50, Ambiguous=$32. Indifferent between Red/Black on Ambiguous.
          2.  *Ellsberg 3-Color:* 30R, 70(B+Y). Prefers R > B. Prefers (B+Y) > (R+Y). (Classic Ellsberg Paradox).
          3.  *Asymmetric Ambiguous Bet:* Ambiguous Urn (0-100 Red). Bet: +$100 if Red, -$10 if Black. Accepted at $0 entry fee.
          4.  *Restricted Ambiguity:* Urn 40-60 Red. WTP $45 for $100 on Red. Irrelevant who knows the split (source independence).
          5.  *Compound Risk:* 50% (80% $100) + 50% (20% $100). Values at $50 (Reduction of Compound Lotteries holds for *objective* risk).
      *   **New Bets:**
