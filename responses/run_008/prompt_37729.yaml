          *   Actually, wait. If $\phi$ is concave, by Jensen's inequality, $E[\phi(X)] \le \phi(E[X])$.
          *   Let's approximate: $E[\phi(X)] \approx \phi(E[X]) + 0.5 \phi''(E[X]) Var(X)$.
          *   $CE \approx E[X] + 0.5 \frac{\phi''}{\phi'} Var(X)$.
          *   Penalty $\approx -0.5 A(\phi) Var(X)$.
          *   If $A(\phi)$ is constant (CARA $\phi$), Penalty ratio should match Variance ratio (25).
          *   Observed Penalty ratio is 3.6.
          *   This implies $A(\phi)$ (absolute ambiguity aversion) is *decreasing* as the set of priors shrinks (or as wealth/outcome changes). Or, the distribution isn't Uniform.
