          *   $V = \int_0^1 \phi(100p) dp = 32$.
          *   If $\phi$ is linear (Risk Neutral to Ambiguity), $V=50$. Since $32 < 50$, $\phi$ is concave.
          *   *Data 4:* Priors restricted to $[0.4, 0.6]$. Assume Uniform on this range?
          *   $E_p[Red] = 0.5$.
          *   $V = \int_{0.4}^{0.6} \phi(100p) \frac{1}{0.2} dp = 45$.
          *   *Data 3:* Bet $f$: $100$ if Red, $-10$ if Black. Payoff $= 100p - 10(1-p) = 110p - 10$.
          *   $V = \int_0^1 \phi(110p - 10) dp$.
          *   If $\phi$ is sufficiently concave to make Data 1 = 32, will Data 3 be positive?
          *   Let's try a specific functional form: CARA for ambiguity? $\phi(x) = -e^{-\lambda x}$.
          *   Actually, usually $\phi$ is defined on utility units. Since $u(x)=x$, $\phi$ acts on dollars.
          *   Let's check the *degree* of aversion.
          *   Data 1: Certainty Equivalent (CE) of lottery $L_p$ (where $p \sim U[0,1]$) is 32. Mean is 50.
          *   Data 4: CE of lottery $L_p$ (where $p \sim U[0.4, 0.6]$) is 45. Mean is 50.
          *   Notice the variance of $p$ in Data 1 is $1/12 \approx 0.083$. Variance in Data 4 is $(0.2)^2/12 = 0.0033$.
          *   Ambiguity aversion penalizes variance of expected utility.
          *   In Data 1, penalty = $50 - 32 = 18$.
          *   In Data 4, penalty = $50 - 45 = 5$.
          *   Ratio of penalties: $18/5 = 3.6$.
          *   Ratio of Variances: $0.083 / 0.0033 = 25$.
