prompt: |-
  In my ethics tutorial we just covered the seperateness of persons objection to utilitarianism, and my tutor has this analogy she leans on pretty hard to kind of wave the objection away. Within a single life, she says, trading pains against gains is obviously fine: you accept the dentist drill now for decades of unbroken teeth, you slog through a miserable few years of a PhD for a career you want, and nobody thinks that's an injustice to Tuesday-you or to your 25 year old self. Utilitarian aggregation across persons is supposed to be the exact same move at bigger scale: one person takes the hit, a larger total gain lands somewhere else, and if the ledger comes out positive the way it does within a life, there's nothing further to complain about. The separateness objection, on her telling, is just people getting sentimental about which container the experiences are stored in. How far does this actually hold? Map it out for me — what's supposed to correspond to what, whether there's anything playing the role of the single subject who owns both sides of the trade, whether compensation matters and whether it actually happens in either case, what persistence over time is doing in the source that's missing in the target — and then tell me where the mapping breaks, and which of the breaks actually matter for what she's using it for, which, fwiw, is defending the redistribution case: taking a loss from one person and spreading gains over many others, where the one never consented and never gets anything back. Does her conclusion survive once the disanalogies are on the table, or was the analogy carrying it the whole way? Two more things. A guy in my class said the analogy might cut in the reverse direction: if you take seriously the thought that a person is really a series of overlapping stages, then even my dentist tradeoff is sort of cross-person already, temporal smoothing is just aggregation with better PR, and the real question isn't whether we aggregate but which bundles of experiences get to count as a unit for the fairness complaint. Is that right or is it a dodge? And if the single-life analogy is a bad one, is there a better analogy that does the work the utilitarian needs it to do? Write it as continuous prose please, no headings or bullet points or bold or tables, like a long email, and don't bother citing the literature at me, i just want your actual thinking.
