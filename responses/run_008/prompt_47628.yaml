answer: |-
  Subject: Re: Thoughts on the separateness of persons and your tutor's analogy

  Hi there,

  It is great that you are digging into this because the analogy your tutor is using is one of the most famous and contentious moves in moral philosophy, and your instinct that something might be slipping through the cracks is well founded. To really see where the argument stands, we need to map the anatomy of the analogy precisely before we can judge where it fractures. The core mapping your tutor is relying on equates temporal stages of a single life with distinct individuals in a society. In the source domain, which is the single life, you have a past self, a present self, and a future self. In the target domain, which is society, you have person A, person B, and person C. The trade-off in the source domain is suffering a pain now for a gain later, like the dentist drill followed by healthy teeth. The trade-off in the target domain is person A suffering a loss so that persons B and C can have a gain. The claim is that the boundary between Tuesday-you and Friday-you is morally no different than the boundary between you and your neighbor, so if we aggregate across time, we should aggregate across people.

  The critical element that is supposed to hold this mapping together is the notion of a single subject who owns both sides of the transaction. In the single-life case, there is a literal entity, the person, who experiences the pain and subsequently experiences the gain. This entity provides the structural glue that makes the trade rational. Because the same consciousness or psychological continuum persists, the compensation is internal. The future self with the healthy teeth is the same entity that endured the drill, so the benefit cancels out the burden within a single ledger of well-being. This is where the first major break in the analogy appears when we move to the interpersonal case. In the social redistribution scenario your tutor is defending, there is no super-subject. There is no society-mind that feels the loss of the sacrificed individual and the gain of the beneficiaries as a single unified experience. There are only distinct ledgers. When the utilitarian says the total is higher, they are summing across separate ledgers, whereas in the single-life case, the summing happens within one ledger. This distinction matters immensely for the concept of compensation. In the dentist case, compensation is guaranteed and internal; the person who suffers is the person who gets the teeth. In the redistribution case, compensation is external and often non-existent for the loser. If you take a kidney from one person to save two, the donor does not get the benefit of the extra life years. They just lose the kidney. The gain lands in a different container.

  This leads directly to the issue of persistence and rational prudence. In the single-life case, it is rational for me to sacrifice for my future self because I identify with that future self. I have a prudential reason to care about them. In the interpersonal case, I do not necessarily have that same identification with you. Your tutor dismisses this as sentimentality about containers, but that dismissal assumes the conclusion it is trying to prove. It assumes that the only thing that matters is the sum of experiences, not who has them. If you believe that persons are distinct moral units, then the lack of a unifying subject is not a sentimental detail; it is the entire basis of rights. Rights function precisely to protect the individual from being submerged into the collective, whereas within a life, there is no need for rights against oneself because there is no conflict of interest in the same way. The break in the mapping is that the single-life analogy relies on a unity of ownership that simply does not exist across persons, and without that unity, the justification for the sacrifice collapses from a rational prudential choice into an imposed burden.

  Now, regarding your classmate's point about temporal parts, he is channeling a line of thought that suggests even the single life is just a bundle of experiences, so the intrapersonal case is already interpersonal in disguise. This is a clever dodge, but it does not actually save your tutor's argument; it just radicalizes the premise. If we accept that a person is just a series of stages, then the question becomes why we privilege the bundle we call a person over the bundle we call society. However, even if we accept that metaphysical view, it does not solve the problem of fairness or consent. If I am just a series of stages, why should Stage A suffer for Stage B without Stage A's consent? We usually allow this because we assume a strong psychological connection. But between distinct people, that connection is weak or absent. So even if your classmate is right that persons are illusions, the utilitarian still needs to explain why it is permissible to impose costs on one bundle of experiences for the sake of another bundle without any mechanism of compensation. It shifts the debate from metaphysics to distribution, but it does not make the non-consensual sacrifice any less objectionable. In fact, it might make it worse, because if persons are just stages, then sacrificing a person is like sacrificing a random week of your life for a different year, which we might find acceptable, but only if there is a overarching narrative or benefit that ties them together. Without that tie, it is just loss.

  So, does your tutor's conclusion survive once these disanalogies are on the table? Specifically, the case of taking a loss from one person who never consented and never gets anything back? I do not think it does. The analogy was doing all the heavy lifting. The intuition that makes the dentist case acceptable is that the sufferer is the beneficiary. Once you remove that identity, you remove the moral permission. The tutor is asking you to accept that the distribution of utility does not matter, only the sum. But the single-life analogy only works if you already believe that distribution does not matter. It begs the question. It uses a case where distribution is irrelevant (because it is all one person) to prove that distribution is irrelevant in cases where it is the only thing that matters (because they are different people). For the specific case of non-consensual redistribution, the analogy fails because it cannot account for the lack of reciprocal benefit. In a life, the sacrifice is an investment. In the tutor's redistribution case, the sacrifice is a confiscation.

  As for whether there is a better analogy that does the work the utilitarian needs, it is surprisingly difficult to find one that does not smuggle in consent or special relationships. Some utilitarians try to use the analogy of a family, where parents sacrifice for children, but that relies on love and partiality, not abstract utility. Others use emergency triage, like sacrificing one to save five in a burning building, but that is a special case of imminent disaster, not general social policy. A more honest analogy for the utilitarian position might be a tax system where everyone agrees to the rules in advance, knowing they might be the net losers, in exchange for social stability. But that introduces consent, which your tutor's case explicitly excludes. The lack of a robust analogy for non-consensual interpersonal aggregation suggests that the utilitarian is asking us to accept a principle that violates our deepest intuitions about individual inviolability. The single-life analogy is the best they have, and as we have seen, it is structurally flawed because it ignores the necessity of a single subject for internal compensation.

  Ultimately, your tutor is asking you to view society as a single super-organism. If you accept that metaphysical picture, her argument holds. If you view society as a collection of distinct agents, it fails. The separateness of persons objection is not just about containers; it is about the fact that there is no one for whom the sacrifice is a net gain except the abstract concept of the total. In the dentist case, there is a concrete someone. In the redistribution case, there is not. That is not sentimentality; it is the difference between an investment and a sacrifice. I hope this helps you navigate the tutorial, because you are right to feel that the analogy is smoothing over a very rough patch in the theory.

