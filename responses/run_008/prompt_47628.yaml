  4.  **Identify the Breaks (The "Separateness" Objection):**
      *   *Identity/Unity:* There is a literal subject who experiences both the pain and the gain in the single-life case. There is *no* super-subject in the social case.
      *   *Compensation:* In the single-life case, compensation is internal and guaranteed (I get the teeth). In the social case, compensation is external and often absent (the sacrificed individual doesn't get the benefit).
