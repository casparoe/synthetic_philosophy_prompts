      *   **Propose the Solution:** A **Dual-Principle Framework**.
          *   *Principle 1 (The Creation Principle):* **Suffering-Weighted Totalism.** When deciding who to bring into existence, suffering counts significantly more than happiness (explains Cases 1, 3), but net-positive lives are still good (explains Cases 2, 5).
