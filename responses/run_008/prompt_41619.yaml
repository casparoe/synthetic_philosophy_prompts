answer: |-
  You are absolutely right to be frustrated. Your friend conflated three distinct epistemological strategies that happen to share the same gesture. G.E. Moore's "Here is one hand" is infamous in philosophy precisely because it functions as a Rorschach test: people project different theories onto it.

  Your original point ("we can't strictly *prove* an external world") is technically correct under **Cartesian standards** (deductive certainty immune to all doubt). Your friend's gesture attempts to change the rules of what counts as "proof" or "knowledge."

  Here is the breakdown of the distinct claims hidden in that hand wave, ranked from "Boring" to "Nuclear Option," with an assessment of their truth, interest, and whether they actually defeat your point.

  ### 1. The Common Sense Assertion (Naive Realism)
  *   **The Claim:** "I perceive hands, hands are physical objects, therefore physical objects exist. The burden of proof is on you to show I *don't* have hands."
  *   **Is it True?** Logically valid, but dialectically useless against a skeptic. It assumes the conclusion (that perception yields objects) in the premise.
  *   **Interest Level:** **Platitude.** This is what non-philosophers think. It ignores the last 300 years of epistemology.
  *   **Did it Score a Point?** **No.** This concedes your point. You said we can't *prove* it; he just asserted it without addressing the mechanism of proof.

  ### 2. The Moorean Shift (Certainty Comparison)
  *   **The Claim:** (This matches your friend's defense **A**). "Proof isn't about logical invulnerability; it's about comparative certainty. I am more certain that 'Here is a hand' is true than I am that any philosophical premise leading to skepticism is true. Therefore, I should reject the skeptical premise, not the hand."
  *   **Is it True?** Psychologically plausible, but logically circular regarding *justification*. It prioritizes intuition over deduction.
  *   **Interest Level:** **Moderate.** This is G.E. Moore's actual position. It forces the skeptic to admit their premises are less intuitive than common sense.
  *   **Did it Score a Point?** **Partial.** It doesn't prove the world exists, but it successfully argues that skepticism is *less reasonable* than realism. It shifts the burden of proof back to you.

  ### 3. The Contextualist Objection (Rigged Standards)
  *   **The Claim:** (This matches your friend's defense **B**). "The word 'know' or 'prove' changes meaning depending on context. In everyday contexts, 'I know I have hands' is true. The skeptic artificially raises the standards to a level where nothing could ever count as knowledge. We are allowed to reject those standards as illegitimate for normal discourse."
  *   **Is it True?** Highly plausible in modern epistemology (Contextualism). It suggests the skeptic is playing a different language game.
  *   **Interest Level:** **High.** It dissolves the problem rather than solving it. It argues the skeptic's question is a category error regarding language use.
  *   **Did it Score a Point?** **Yes.** If this is true, your claim ("we can't prove it") is only true in a rigged, artificial context, not in any context that matters.

  ### 4. Hinge Epistemology (Wittgensteinian)
  *   **The Claim:** (A deeper version of **B**). "Certain propositions (like 'there is an external world') are not things we *know*; they are the 'hinges' on which our knowing turns. You don't prove the hinge; you rely on it to prove anything else. Demanding proof for a hinge is nonsense."
  *   **Is it True?** Philosophically robust (from Wittgenstein's *On Certainty*). It redefines the status of foundational beliefs from "known facts" to "unmoving assumptions."
  *   **Interest Level:** **Very High.** It changes the architecture of epistemology.
  *   **Did it Score a Point?** **Yes.** It concedes you can't *prove* it, but argues that *nothing* can be proved without assuming it. Therefore, the lack of proof is irrelevant.

  ### 5. The Transcendental Argument (Type Mismatch)
  *   **The Claim:** (This matches your friend's defense **C**). "The skeptic's doubt relies on tools (logic, language, concepts) that only make sense if an external world already exists. You cannot use public language to doubt the public world. The demand for 'premises of a different type' is incoherent because all premises presuppose the conclusion."
  *   **Is it True?** Controversial but powerful (associated with Strawson and Kant). It argues skepticism is self-refuting.
  *   **Interest Level:** **Very High.** This is the "Nuclear Option." It attempts to show skepticism is logically impossible, not just unlikely.
  *   **Did it Score a Point?** **Yes.** If successful, this proves your claim ("we can't prove it") is false because the attempt to doubt it proves it.

  ### 6. Inference to the Best Explanation (Abduction)
  *   **The Claim:** "We cannot deduce the world exists, but the hypothesis 'a world exists' explains my sensory experiences (coherence, surprise, resistance) much better than the hypothesis 'I am hallucinating everything.' Therefore, it is rational to believe it."
  *   **Is it True?** Scientifically standard, philosophically debated. It swaps "Proof" for "Probability."
  *   **Interest Level:** **Moderate.** It's the standard scientific realist position.
  *   **Did it Score a Point?** **No.** This concedes your point. It admits you can't *prove* it, but argues you don't need proof, just the best explanation.

  ---

  ### Strategy for Round Two

  Your friend lost the argument because they treated these distinct claims as interchangeable. To win (or at least force clarity), do not attack the hands. Attack the **justification for the hands.**

  **Open with this:**
  > "I've thought about the hand thing. You actually offered three different arguments last night, and they can't all be true at once. Which one are you making now?"

  **Then use this cheat sheet:**

  1.  **If they say "It's just more certain" (The Moorean Shift):**
      *   *Counter:* "Certainty isn't truth. I can be certain I'm right and still be wrong. You haven't proven the world exists; you've just said you feel really sure about it. I agree we can't *prove* it, which was my original point."
      *   *Result:* You win. They conceded "proof" is impossible.

  2.  **If they say "Skepticism is rigged/unfair" (Contextualism/Hinges):**
      *   *Counter:* "Okay, so you agree we can't strictly prove it in the abstract. You're arguing we *shouldn't care* about strict proof. That's a pragmatic argument, not a proof. My point stands: strict proof is impossible."
      *   *Result:* Draw. You agree on the impossibility of proof, but disagree on its importance.

  3.  **If they say "Doubt presupposes the world" (Transcendental):**
      *   *Counter:* "That's a claim about language, not the world. Just because I need language to doubt doesn't mean the world exists, only that *language* exists. Solipsists have language too."
      *   *Result:* You win. This is the hardest argument to pull off, and usually fails.

  **The Verdict:**
  Your original point ("we can't strictly *prove* there's a world outside our minds") is logically secure against Moore's Proof. Moore's Proof was never intended to satisfy a Cartesian skeptic; it was intended to show that Cartesian skepticism is irrelevant to human life.

  Your friend was arguing **Pragmatism** (we should act as if it's proven) while you were arguing **Logic** (it is not deductively proven). You were talking past each other. If you force them to pick one of the six claims above, you will likely find they are a **Moorean (2)** or a **Contextualist (3)**, both of which actually concede that strict logical proof is impossible.
