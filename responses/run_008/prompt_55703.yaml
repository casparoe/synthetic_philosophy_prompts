answer: |-
  ### Desiderata for a Criterion of Mechanistic Sameness

  | No. | Requirement | What it demands | Case or consideration behind it | Status | Tension with |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | **Causal Necessity** | The identified components must be counterfactually necessary for the output in the evaluated context. | Case 3 (Decoration): A component that fires but doesn't influence the output is not the mechanism. | Non-negotiable | 5, 6 |
  | 2 | **Implementation Invariance** | The criterion must accept different physical instantiations (weights/neurons) if the computational graph is isomorphic. | Case 2 (Different Seeds): Same algorithm wired differently should count as the same mechanism. | Non-negotiable | 3 |
  | 3 | **Latent Distinction** | The criterion must distinguish between processes that yield identical outputs but rely on different internal logic. | Case 1 (Lookup vs. Compute): Memorization is not the same mechanism as generalization, even if answers match. | Non-negotiable | 2 |
  | 4 | **Functional Integration** | Active components must be causally connected to the final output, not merely correlated with it. | Case 3 (Decoration): Distinguishes a gating safety check from a parallel process that is ignored. | Non-negotiable | None |
  | 5 | **Perturbation Stability** | The verdict of "sameness" should not flip discontinuously under infinitesimal weight or input noise. | Case 4 (Weight Perturbation): Noise shouldn't look like a mechanism switch unless a threshold is crossed. | Camp Preference | 1, 6 |
  | 6 | **Minimality** | The criterion should identify the smallest sufficient set of components, excluding redundant duplicates. | Case 5 (Dead Code): If two components do the same job, only the active/original one should be "the" mechanism. | Non-negotiable | 1, 5 |

  ### Jointly Unsatisfiable Pairs

  The most critical tension lies between **Requirement 1 (Causal Necessity)** and **Requirement 5 (Perturbation Stability)**, particularly when viewed through the lens of **Requirement 6 (Minimality)** and **Case 5 (Redundancy)**.

  In a robust system (like a safe AI), redundancy is a feature, not a bug. If a primary safety circuit fails, a backup should engage. However, if a backup exists, the primary circuit is no longer *strictly necessary* (violating Req 1). If you relax Necessity to allow for redundancy, you violate Minimality (Req 6) because you can no longer distinguish the primary mechanism from the backup. Furthermore, if a tiny weight perturbation (Case 4) switches the model from using the primary to the backup, a strict Necessity criterion will flip its verdict from "Same Mechanism" to "Different Mechanism" instantly. This violates Perturbation Stability (Req 5).

  You cannot have a criterion that demands strict counterfactual necessity, identifies a unique minimal mechanism, and remains stable under small perturbations in a system designed with fail-safes. You must sacrifice either the strictness of "necessity" (admitting that mechanisms can be probabilistic or context-dependent) or the stability of the classification (admitting that mechanism identity is discrete and fragile).

  ### Evaluation of Candidate Criteria

  **Pure Behavioral Equivalence**
  This criterion asserts that if two models (or inputs) produce the same output distribution, they are using the same mechanism. This fails **Requirement 3 (Latent Distinction)** immediately. As illustrated in **Case 1**, a model using a memorized lookup table and a model using a genuine carry-propagating circuit produce identical arithmetic results on the tested set. Behavioral equivalence cannot see the "quiet switch" to memorization. For AI safety, this is fatal: a model that behaves safely on test data because it is memorizing safe responses, but uses a different mechanism on out-of-distribution data, will pass this test while being fundamentally unsafe. It also fails **Requirement 1 (Causal Necessity)** because it ignores internal structure entirely; it cannot distinguish a functional safety check from a decorative one (**Case 3**) since both result in the same safe output.

  **Sameness of Internal Activations (Fixed Metric)**
  This criterion asserts that mechanisms are the same if the activation vectors (e.g., hidden states) are close under a fixed distance metric (like MSE or Cosine Similarity). This fails **Requirement 2 (Implementation Invariance)**. As shown in **Case 2**, two models trained from different seeds often solve tasks using permutation-equivalent circuits (neuron A in Model 1 corresponds to neuron B in Model 2). A fixed metric comparing neuron A to neuron A will report high distance, falsely claiming the mechanisms are different. It also fails **Requirement 5 (Perturbation Stability)**. In **Case 4**, small weight perturbations can shift activation statistics without changing the computational logic. A fixed metric might flag this noise as a mechanism change. Conversely, if a model switches to a backup pathway (**Case 4**) that happens to produce similar activation norms, this metric might falsely claim sameness despite a functional handoff.

  ### Most Excluding Requirement

  **Requirement 1 (Causal Necessity)** does the most to exclude candidate criteria. Most current interpretability tools are observational (probing, activation maximization, correlation analysis). They measure what *is* present, not what *must* be present. Causal Necessity demands intervention (ablations, causal tracing, counterfactuals). Any criterion that relies solely on passive observation of weights or activations without testing what happens when they are broken is excluded by this requirement. It forces the definition of "mechanism" away from "stuff that lights up" and toward "stuff that does the work."

