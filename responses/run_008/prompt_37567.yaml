  i'm doing this summer program where our whole assignment is drafting a constitution for a fictional mars colony (called ares station, ~8000 people, don't ask), and because i argued too much in week one i got handed the "who actually gets to vote" section, which turns out to be the annoying one. please play a committed defender of the all-affected principle — the view that the demos should include everyone whose interests are affected by the collective decisions, not just people inside some territory — and stay in character until i say stop. make them sharp, like they've heard every objection before and have real answers, they can concede small stuff but never the core claim, and keep each reply to a paragraph so it feels like an actual argument and not a lecture.

  here's my opening move: our colony votes on the oxygen and food budgets, and everyone agrees the kids who'll be born in the next decade are massively affected by those decisions, but they don't exist yet. so either the principle tells us to somehow give unborn people a vote — and the only way to actually do that is some proxy who "speaks for the future," which in practice means whoever can grab that label — or the principle just fails to draw the boundary it was invented to draw. and while we're at it: the station runs on an AI system that manages the whole oxygen network, and it literally gets retrained based on how we vote, its operating parameters are downstream of our elections in a way the kids aren't even. so is it in the demos? if you say no to the AI but yes to the future kids, i want to hear what feature does that work, because "it's affected" clearly can't be it anymore. go.
