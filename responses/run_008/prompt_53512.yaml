prompt: |-
  As part of my teaching duties for an introductory critical thinking course, I'm preparing a unit on the sunk cost fallacy, and I've discovered that my own convictions are less tidy than the textbook treatment I'm supposed to deliver. The textbook line is that rational choice attends only to future costs and benefits, since past expenditures are gone no matter what you do next; honoring them is supposed to be a paradigm of irrationality. When I go through cases and record my gut verdicts, though, I find I don't actually accept that line across the board, and my friends, whom I've been quizzing over dinner for two weeks, don't either. So before I stand in front of thirty undergraduates and tell them that only fools weigh sunk costs, I'd like to know whether there's a principle that captures the pattern in my verdicts — and I'd like your help finding it, or finding out that there isn't one.

  Here are the verdicts. Continuing to read a dull novel two hundred pages in because I paid twenty dollars for it: irrational, and I'd say so to anyone. Staying through a film I'm loathing because the tickets were expensive: the same, though I confess to doing it. A government pressing on with a hugely over-budget rail project on the grounds that cancelling would mean the billions already spent went to waste: I take this to be the fallacy in its purest form, and I'd mark a student down for defending it. Staying in a ten-year relationship purely because ten years have been invested: fallacy again, and a corrosive one. But now the cases that resist. A friend in the sixth year of a PhD, three months from submission, staying on through misery largely because quitting would mean the six years were for nothing: I find myself unwilling to call this a fallacy, even though on the textbook line the six years are precisely as gone as the novel's purchase price. My grandmother refusing to sell the family farm at a very good price, because my late grandfather's decades of labor are, as she puts it, in that land: I think this is not merely excusable sentiment but in some sense the right way for her to value the farm, and I would not want a decision theorist to talk her out of it. And the one that disturbs me most: I find the argument that a war must be continued so that the dead shall not have died in vain rhetorically repugnant and plainly fallacious when I inspect it, yet when I read it in a eulogy I'm moved by it, and I can't fully dismiss the thought that something in it is being tracked by my emotions even if my reasoning rejects it.

  I have a tentative principle of my own, and I'd like you to test it against these cases and repair or replace it as needed. It goes something like this: sunk costs are irrational to weigh insofar as they function only as evidence about the future — as when the billions spent on the rail project are cited as if they raised the expected value of finishing it — but they may legitimately be weighed when they are part of the content of the future, that is, when the value of what lies ahead genuinely depends on what lies behind, as with my grandmother's farm, where the past investment doesn't predict anything about the land; it constitutes what the land is worth to her. Does this principle, or any repair of it, deliver my verdicts on all the cases, including the PhD and the eulogy ones, where I most want it to succeed but least trust it? If some verdict has to go, tell me which, and why that one rather than another. And please tell me what the resulting principle predicts about two cases I haven't decided: a woman who has written seventy thousand words of a novel that a cold calculation says she will neither publish nor enjoy finishing, wondering whether to abandon it; and a parent deciding whether to make a twelve-year-old continue an expensive sport she has come to hate, on the ground that letting her quit would waste the years already put in. I'd like a precise statement of the principle, the case that motivates each clause, and an honest accounting of where it fails me — I have a lecture to write, and I would rather it be complicated and true than clean and something I don't believe.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** An instructor teaching an introductory critical thinking course.
      *   **Problem:** They are preparing a unit on the Sunk Cost Fallacy (SCF). They find the standard textbook definition ("ignore past costs, look only to future utility") conflicts with their intuitive moral/practical judgments in specific cases.
      *   **Goal:** They want a principle that captures the pattern in their verdicts, or an honest admission that no such principle exists (and which verdict must be sacrificed). They want to teach something "complicated and true" rather than "clean and false."
      *   **Input Data (Verdicts):**
          1.  *Dull Novel (200 pages/$20):* Irrational (Fallacy).
          2.  *Bad Film (Expensive Ticket):* Irrational (Fallacy).
          3.  *Over-budget Rail Project:* Irrational (Fallacy).
          4.  *10-Year Relationship:* Irrational (Fallacy).
          5.  *PhD Student (6th year, 3 months left):* *Not* Irrational (Acceptable).
          6.  *Grandmother's Farm:* *Not* Irrational (Acceptable/Right).
          7.  *War/Eulogy ("Dead shall not have died in vain"):* Intellectually Fallacious, Emotionally Resonant/Ambiguous.
      *   **User's Tentative Principle:** Sunk costs are irrational when used as *evidence* about the future (predictive), but legitimate when they are part of the *content* of the future (constitutive of value).
      *   **Test Cases to Evaluate:**
          1.  *Unfinished Novel (70k words, no publish/enjoy):* Continue or quit?
          2.  *Child's Sport (12yo, hate it, expensive past):* Continue or quit?
      *   **Requirements:** Precise statement of the principle, motivation for clauses, honest accounting of failures, specific verdicts on test cases.

  2.  **Deconstruct the Sunk Cost Fallacy (SCF):**
      *   *Standard Definition:* Rational agents maximize expected utility from *this point forward*. Past costs are unrecoverable. Therefore, $X spent yesterday should not influence the decision to spend $Y today unless $X affects the future value of $Y.
      *   *The User's Intuition:* Sometimes, the *fact* of the past investment changes the value of the completion.
      *   *The Tension:* Is the value intrinsic to the outcome, or does the history *create* the value?

  3.  **Evaluate the User's Tentative Principle:**
      *   *Principle:* "Irrational as evidence vs. Rational as content."
      *   *Analysis:*
          *   *Novel/Film/Rail/Relationship:* The past cost doesn't change the quality of the experience (reading, watching, riding, living). It's purely predictive (throwing good money after bad). -> Fits "Irrational."
          *   *Grandmother's Farm:* The labor *constitutes* the meaning. Selling erases the meaning of the labor. -> Fits "Rational as content."
          *   *PhD Student:* This is the tricky one. Does finishing make the 6 years meaningful? Yes. Quitting makes them "wasted." But is that a *new* benefit? The benefit is "having a PhD" + "validating the past 6 years." If the validation is a genuine psychological/social good, it's a future benefit.
          *   *War/Eulogy:* "Not dying in vain." This is symbolic. It treats the past deaths as a cost that *must* be redeemed by future victory. This is dangerous politically but meaningful emotionally.

  4.  **Refining the Principle (The "Integrity/Identity" Hypothesis):**
      *   The standard economic model assumes fungible utility. But humans operate with *narrative identity*.
      *   Sunk costs matter when abandoning the project violates a commitment that defines the agent's integrity or identity, *provided* that commitment was reasonable to make.
      *   Alternatively, sunk costs matter when the *completion* of the project has value *specifically because* of the investment (the "Endowment Effect" or "Effort Justification" but normatively validated).
      *   *Better Distinction:* Is the past cost being used to *justify* a bad future (Fallacy), or is the past cost being *honored* by a meaningful completion (Integrity)?
      *   *Key Distinction:* **Instrumental vs. Constitutive.**
          *   *Instrumental:* I spend more to get the money's worth. (Fallacy).
          *   *Constitutive:* The spending *made* the thing valuable in a way that only completion realizes.

  5.  **Addressing the Specific Cases:**

      *   *Novel/Film:* Pure consumption. The past money buys no extra enjoyment. -> Fallacy.
      *   *Rail Project:* Public utility. Past money doesn't make the train faster. -> Fallacy.
      *   *Relationship:* If staying *only* because of time, it prevents new happiness. -> Fallacy. (Unless there are vows/commitments, but the prompt says "purely because ten years").
      *   *PhD:* Quitting renders the effort *futile*. Finishing renders it *fruitful*. The degree has value *contingent* on the 6 years. The 6 years aren't just cost; they are *prerequisites*. If you quit, the 6 years yield 0. If you finish, they yield a PhD. The marginal cost of 3 months is bought against the *total* value of the PhD, not just the 3 months. *Wait, this is the standard counter-argument.* The standard SCF rebuttal is: "Will the next 3 months be worth it given the PhD?" If yes, do it. If no, quit. The 6 years are gone.
      *   *User's Intuition on PhD:* They feel it's *not* a fallacy. Why? Because "wasting 6 years" is a genuine psychological harm. The *narrative closure* is a future benefit.
      *   *Grandmother:* The farm is a monument. Selling destroys the monument. -> Not Fallacy.
      *   *War:* "Dying in vain." If we quit, the death was useless. If we win, it was sacrificial. This is the most dangerous version of the principle.

  6.  **Developing the "Narrative Integrity" Principle:**
      *   The textbook SCF assumes *atomistic* decisions.
      *   Human life is *narrative*.
      *   Principle: **The Sunk Cost Constraint.** It is rational to consider sunk costs *only* when the completion of the project transforms the meaning of the past investment from "waste" to "sacrifice," and where that transformation is a genuine good (integrity, memory, identity) that outweighs the future costs.
      *   *Constraint:* This cannot be used to justify *instrumental* gains (getting money's worth on a ticket). It must be about *meaning*.

  7.  **Testing the Test Cases:**
      *   *70k Word Novel:* Is finishing a genuine good? If she hates it and won't publish, is it "waste" or "craft"? If it's practice, maybe quit. If it's about "being a writer," maybe finish. *Verdict:* Likely Fallacy if no external/internal value other than "I wrote it."
      *   *Child's Sport:* The child's future autonomy vs. parent's desire not to waste money. The child's identity is forming. Forcing them violates *their* integrity to honor *parent's* wallet. *Verdict:* Fallacy.

  8.  **Synthesizing the Response:**
      *   Acknowledge the sophistication of the query.
      *   Validate the intuition: The textbook is right about *economic* efficiency, wrong about *human* rationality (which includes narrative coherence).
      *   Propose the Principle: **The Principle of Constitutive Meaning vs. Instrumental Recovery.**
      *   *Clause 1 (Fallacy):* When sunk costs are invoked to recover value (get money's worth).
      *   *Clause 2 (Exception):* When sunk costs are invoked to preserve meaning (integrity, memory, identity).
      *   *Apply to Cases:*
          *   Novel/Film/Rail/Relationship: Instrumental Recovery. (Fallacy).
          *   Farm: Meaning/Memory. (Exception).
          *   PhD: Meaning/Identity (Threshold effect). (Exception, but borderline).
          *   War: Meaning/Sacrifice. (Exception emotionally, Fallacy strategically).
      *   *Apply to New Cases:*
          *   Writer: Likely Fallacy (unless it's about self-conception).
          *   Child: Fallacy (parent projecting meaning onto child).
      *   *The Hard Truth:* The War case is the weak point. It justifies escalation. The principle must warn against *political* use of constitutive meaning.

  9.  **Refining the Principle for the Classroom:**
      *   Don't throw out SCF. Refine it.
      *   "Sunk costs are irrelevant to *causal* predictions, but relevant to *constitutive* values."
      *   Actually, a better distinction is **Forward-Looking Utility vs. Backward-Looking Integrity.**
      *   Let's try to stick close to the user's "Evidence vs. Content" idea but sharpen it.
      *   *User's Idea:* Evidence (predictive) vs. Content (constitutive).
      *   *Repair:* It's not just "content." It's about whether the *completion* creates a good that *requires* the past cost.
      *   *PhD:* The PhD *requires* the 6 years. The ticket does not *require* sitting through the bad movie (you saw the movie either way).
      *   *Farm:* The "Family Farm" status *requires* the history.
      *   *War:* "Victory" *requires* the deaths? No. But "Meaningful Sacrifice" requires victory.
      *   *Novel:* "Finished Novel" requires the words. But if no one reads it and she hates it, is "Finished Novel" a good?
      *   *Child:* "Skilled Athlete" requires practice. But if she hates it, is it a good?

      *   *Crucial Distinction:* **Threshold Goods.** Some goods only exist if you cross a threshold. The sunk cost gets you near the threshold. Abandoning leaves you with nothing. Continuing gives you the Threshold Good.
      *   *But:* The textbook says "Ignore the sunk cost. Ask: Is the Threshold Good worth the *remaining* cost?"
      *   *User's Counter:* Sometimes the value of the Threshold Good is *dependent* on the Sunk Cost. (e.g., The farm is valuable *because* grandfather worked it).
      *   *Okay, let's look at the PhD again.* Is the PhD valuable *because* 6 years were spent? Or is the 6 years just the price? Usually the latter. So why does the user feel it's not a fallacy? Because "wasting 6 years" is a *new* pain triggered by quitting. It's a *future* psychological cost.
      *   *Ah!* This is the key. **Regret and Integrity are Future Costs.**
      *   If I quit the PhD, I will feel regret. That regret is a *future* negative utility. Therefore, considering the "wasted 6 years" is actually considering the *future pain of acknowledging waste*.
      *   *Does this solve the Farm?* If Grandma sells, she feels betrayal. That's a future pain.
      *   *Does this solve the War?* If we quit, we feel guilt/shame about the dead. Future pain.
      *   *Does this solve the Ticket?* If I leave, I feel "I wasted $20." Future pain.
      *   *Differentiation:* Why is the Ticket pain irrational but the PhD pain rational?
      *   *Answer:* **Proportionality and Identity.** The $20 is trivial. The 6 years is identity-constituting. The pain of "wasting $20" is a cognitive error (money is gone). The pain of "wasting 6 years" is an existential reality (time is life).
      *   *Wait, time is gone too.*
      *   *Okay, the distinction must be about **Narrative Coherence**.*
      *   Rationality isn't just utility maximization; it's agency maintenance.
      *   Let's draft the principle around **Integrity vs. Indulgence**. Or **Constitutive vs. Compensatory**.

      *   *Let's go with the User's "Content" idea but refine it.*
      *   Principle: **The Principle of Constitutive Value.**
      *   Sunk costs are fallacious when treated as *compensation* (I must get my money's worth).
      *   Sunk costs are legitimate when treated as *constitution* (The past investment makes the future outcome valuable in a way that wouldn't exist otherwise).
      *   *Farm:* The labor constitutes the value. (Legitimate).
      *   *PhD:* The time constitutes the credential's worth (signaling) AND the personal narrative. (Legitimate).
      *   *Ticket:* The money does not constitute the film's quality. (Fallacy).
      *   *War:* The victory constitutes the meaning of the death. (Legitimate emotionally, Fallacy strategically because victory isn't guaranteed).
      *   *Novel (70k):* Does finishing constitute value? If no audience, maybe not.
      *   *Child:* Does continuing constitute value? No, it constitutes resentment.

      *   *Wait, I need to be careful with the PhD.* Economists argue: "Will the next 3 months be worth it for the PhD?" If yes, do it. The 6 years are irrelevant. The user says "No, the 6 years matter."
      *   *Why?* Because if you quit, the 6 years become *dead time*. If you finish, they become *gestation*. The *status* of the past changes based on the future decision.
      *   *This is the key:* **Retroactive Determination of Meaning.**
      *   Future choices can change the *meaning* of the past, even if they can't change the *facts* of the past.
      *   Rationality includes caring about the meaning of one's life history.
      *   Therefore, it is rational to choose a future that makes the past meaningful rather than wasteful, *provided* the future cost isn't catastrophic.

      *   *Okay, I have a strong thread here.*
      *   1. Standard SCF applies to *fungible resources* (money, generic time).
      *   2. Exception applies to *identity-constituting projects* where completion changes the normative status of the past effort.
      *   3. Warning: This exception is vulnerable to self-deception (War case).

      *   *Let's structure the response:*
          1.  Validate the teacher's doubt (it's a sign of depth).
          2.  Propose the refined principle: **The Principle of Retroactive Meaning.**
          3.  Analyze the original cases through this lens.
          4.  Analyze the two new cases.
