  2.  **Initial Brainstorming & Philosophical Setup:**
      *   *Kant's Position:* Indeed, in the *Lectures on Ethics* and *Metaphysics of Morals*, Kant argues animals are "things" (Sachen). We have no direct duties to them. However, cruelty is prohibited because it dulls our "shared suffering" (Mitleid) which is a predisposition useful for morality towards humans. It's an anthropocentric instrumentalism.
      *   *Sewell's Position:* *Black Beauty* is an autobiography of a horse. It aims to induce empathy. The core question is whether the empathy is *for the horse's sake* or *for the human's sake*.
      *   *The Tension:* Kant says cruelty to animals makes you cruel to humans. Sewell shows cruelty to animals is often *caused* by human vice (drunkenness, greed, ignorance) and reflects social structures.
      *   *The User's Insight:* The user notes the causal arrow might be reversed (humans make horses bad, not horses making humans bad) and introduces the economic element (Jerry Barker). This is crucial. Kant focuses on individual moral psychology; Sewell focuses on systemic exploitation.
      *   *Brainstorming Scenes:*
          1.  Ginger's breakdown (from spirited to broken/biter).
          2.  Jerry Barker and Captain (the kind cabman who suffers financially/health-wise).
