          4.  The final retirement vs. the workhouse end (Beauty's fate vs. others).
          5.  Maybe the scene with the fashion-bearing (bearing rein) – explicit cruelty for vanity.
      *   *Selection:* I need four distinct ones that probe the Kantian claim.
          1.  *Ginger's Transformation:* Shows how abuse creates "bad character" in the animal, challenging the idea that the animal is merely a mirror for human character.
          2.  *Jerry Barker's Integrity:* Shows kindness costing the human, complicating the idea that kindness is purely self-regarding moral hygiene.
          3.  *The Bearing Rein (Fashion):* Shows cruelty driven by vanity, not necessarily a lack of disposition towards humans (the owners are polite society), challenging the link between animal cruelty and human-to-human cruelty.
