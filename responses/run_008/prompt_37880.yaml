      *   *Structure:*
          1.  Introduction/Brainstorming phase.
          2.  Four Scene Analyses.
          3.  Direct Answer (Vindication vs. Refutation).
          4.  The Economic/Structural Contribution.

  4.  **Refining the Kantian Interpretation:**
      *   Need to be careful not to strawman Kant. Kant does say we should be grateful to animals for their service. But the *duty* is indirect.
      *   The key Kantian claim to test: Does treating the horse well *only* matter because it keeps the human moral faculty sharp?
