  5.  **Refining the Scene Analyses:**
      *   *Scene 1: Ginger's Breaking.* Kant might say the groom who breaks Ginger is damaging his own humanity. Sewell shows Ginger becoming miserable. Does the text care more about Ginger's misery or the groom's soul? It seems to care about Ginger. *Verdict: Complicates/Refutes.*
      *   *Scene 2: Jerry Barker.* Jerry is kind. Kant would say this preserves Jerry's goodness. But Jerry gets sick/poor because of it. Kant implies morality pays off in moral integrity; Sewell shows it might cost you your livelihood. *Verdict: Complicates.*
      *   *Scene 3: The Bearing Rein.* Upper-class ladies. They are cruel to horses but presumably nice to peers. This breaks the Kantian link (cruelty to animal -> cruelty to human). They are cruel to animals *because* of social norms, not necessarily because they are psychopaths towards humans. *Verdict: Refutes.*
      *   *Scene 4: Beauty's Voice.* The entire premise. Kant says animals have no rational interiority worthy of moral consideration. Sewell gives them a voice. *Verdict: Refutes.*

  6.  **Addressing the Economic Point:**
      *   Kant's ethics is deontological and individualistic. It doesn't account for market forces.
