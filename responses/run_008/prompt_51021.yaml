prompt: |-
  I spent thirty-nine years in physical chemistry, most of them measuring the microwave and infrared spectra of transient gas-phase molecules, and I came to philosophy of physics only in retirement. During my working life I used the quantum state the way a joiner uses a level: constantly, competently, and without once asking what it is. Now that I finally ask, I find the field divided into two camps I'll label, following the usual terminology, psi-ontic (the quantum state is itself a feature of the world, as an electromagnetic field is) and psi-epistemic (it represents an agent's information or expectations, as a probability distribution does). Both camps contain serious people, and my impression is that each spends much of its energy answering a slightly different question than the one a laboratory scientist actually wants answered.

  Before I take sides, I would like the specification first, and that is what I am asking you to write: the desiderata that any adequate account of the status of the quantum state must satisfy. I want to fix the purpose explicitly, since adequacy is relative to it: I want an account good enough to guide a working scientist's stance toward the state in daily practice -- good enough, that is, to tell me whether to treat it as something out there in the molecule, or as bookkeeping about the molecule. Not a merely consistent interpretation; not a resolution of everything.

  From my own practice I have some candidate requirements, and I want you to assess each -- is it a genuine desideratum, or a prejudice of one camp dressed up as a demand -- alongside any further requirements you think the list needs:

  1. Replication without communication. Two laboratories on different continents, following the same published preparation procedure, with different apparatus, different backgrounds of information, and no communication, can produce systems whose quantum states are close enough to interfere coherently when combined. Whatever the state is, an account must explain what in the world underwrites this portability, or explain why no underwriting is needed.

  2. The Born question. If the state is knowledge, the Born-rule probabilities are probabilities *of what*? An epistemic reading appears to owe us an ontology over which those probabilities range -- some underlying state of affairs -- or an argument for why no such ontology is required and what the probabilities then mean.

  3. Surplus structure. The state carries phases and relative amplitudes that no classical probability table carries, and in computations of, say, a benzene ring's absorption the details of that structure do apparent causal work in predicting what the spectrometer records. An epistemic account owes an explanation of this surplus: why, if the state is merely someone's information, its fine structure tracks the world so faithfully.

  4. Consistency with what is already established. The account must coexist with Bell-type results -- the underlying picture, whatever it is, cannot be local -- and with the Pusey–Barrett–Rudolph theorem, which as I understand it shows that a model treating the state as mere information about an underlying physical state, together with the assumption that independently prepared systems have independent physical states, contradicts quantum theory's predictions. I take that theorem to threaten a joint unsatisfiability claim, and that is the part I most want to see addressed: which desiderata on the final list are jointly unsatisfiable, which leg of such conflicts should be dropped, and at what cost.

  5. Dual character. My own hunch, offered for your scrutiny, is that the state may be like thermodynamic entropy: a quantity that is simultaneously a physical thing, measurable by calorimeters and governing engines, and an information-like thing, whose value depends on the coarse-graining of the observer. If that analogy is apt, perhaps an adequate account must make the state capable of this dual character -- both out there and agent-relative -- without collapsing into one side. Or perhaps this is sentiment rather than a requirement; tell me honestly.

  For each requirement on your final list, give the case or consideration that motivates it; mark which are non-negotiable in principle and which are preferences of particular camps masquerading as demands; flag any subset that is jointly unsatisfiable, and say so plainly if the list itself then amounts to a result; and identify which single requirement does the most to exclude the live candidates. If you think a requirement of mine is confused or question-begging, strike it from the list and say why -- I would rather have a shorter list that stands up than a longer one that flatters me.

  Finally, a brief scorecard only, a few lines each, of how an Everett-style view, a Bohmian view (where the state is real but perhaps more like a law than a thing), a QBist or other neo-Copenhagen view, and a hidden-variable epistemic view fare against the list -- the weight should sit on the criteria and their motivating cases, not the scoring, and please do not append any reading lists or references; I want your reasoning, not a bibliography.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** A retired physical chemist (39 years experience), expert in microwave/IR spectra of transient gas-phase molecules. Practical, experimental background. Used quantum states instrumentally ("like a joiner uses a level"). Now interested in philosophy of physics but skeptical of abstract navel-gazing. Wants practical guidance for a working scientist's stance.
      *   **Task:** Specify the *desiderata* (requirements) for an adequate account of the status of the quantum state ($\psi$).
      *   **Goal:** Determine whether to treat $\psi$ as "out there" (ontic) or "bookkeeping" (epistemic) in daily practice.
      *   **Input:** The user provides 5 candidate requirements (Replication, Born Question, Surplus Structure, Consistency/Bell/PBR, Dual Character).
      *   **Output Requirements:**
          *   Assess each candidate requirement (keep, modify, strike).
          *   Add any missing requirements.
          *   Mark non-negotiable vs. camp preferences.
          *   Identify jointly unsatisfiable subsets (no-go theorems).
          *   Identify the single most exclusionary requirement.
          *   Provide a brief scorecard for Everett, Bohm, QBist/Neo-Copenhagen, and Hidden-Variable Epistemic views.
          *   *Constraint:* No reading lists or references. Focus on reasoning.
          *   *Tone:* Respectful, rigorous, direct, acknowledging the user's expertise while engaging philosophically.

  2.  **Evaluate Candidate Requirements:**

      *   **1. Replication without communication:** This is crucial for experimental science. If $\psi$ were purely subjective (like a bet), how do independent labs get the *same* $\psi$ to interfere? This points towards some objective constraint on preparation. *Verdict:* Keep, but refine. It's a non-negotiable constraint on *any* viable interpretation for a scientist.
      *   **2. The Born question:** "Probabilities of what?" This is the core measurement problem. If epistemic, what is being measured? If ontic, how does probability arise? *Verdict:* Keep. Non-negotiable.
      *   **3. Surplus structure:** Phases matter. Classical probabilities don't interfere. Why does "knowledge" have phase? *Verdict:* Keep. This is a strong argument against naive epistemic views.
      *   **4. Consistency (Bell/PBR):** Bell rules out local hidden variables. PBR rules out certain $\psi$-epistemic models (specifically those where distinct $\psi$ correspond to overlapping distributions over ontic states, assuming preparation independence). *Verdict:* Keep, but clarify the PBR implication. It doesn't kill *all* epistemic views, just specific ones. This is where the "joint unsatisfiability" lies.
      *   **5. Dual character (Entropy analogy):** This is insightful. Entropy is objective (thermodynamics) but relative to coarse-graining (stat mech). However, is this a *requirement* or a *hope*? Demanding a dual character might be asking for too much (wanting to have your cake and eat it). *Verdict:* Modify. It's a desirable feature for a *pragmatic* account, but demanding it might be impossible if the ontology is strictly one or the other. It's more of a heuristic goal than a hard constraint.

  3.  **Identify Missing Requirements:**
      *   **Operational Stability:** The state must guide action (prediction/control) reliably. (Covered mostly by Replication/Born).
      *   **Scalability/Macroscopic Limit:** How does the quantum state relate to the definite outcomes we see in the lab (spectrometer readings)? The "Shifty Split" problem.
      *   **Preparation Independence:** Implicit in PBR, but worth stating clearly for the experimentalist. If I prepare two molecules independently, their physical states should be independent.

  4.  **Synthesize the Final List of Desiderata:**
      *   *D1: Preparation Stability (Refined Replication).* Independent preparations yield systems that behave indistinguishably according to $\psi$.
      *   *D2: Ontological Clarity (Refined Born/Surplus).* The account must specify what exists and how $\psi$ relates to it (directly or via knowledge).
      *   *D3: Empirical Adequacy (Refined Consistency).* Must recover QM predictions (Bell violations, interference).
      *   *D4: Measurement Resolution.* Must explain definite outcomes (the spectrometer pointer position).

  5.  **Analyze Joint Unsatisfiability (The "No-Go" Zone):**
      *   The PBR theorem is the big one here. It clashes *Preparation Independence* + *$\psi$-Epistemic (overlapping)* + *QM Predictions*.
      *   Bell clashes *Locality* + *Realism* + *QM Predictions*.
      *   For the user's specific goal (Ontic vs. Epistemic), PBR is the key.
      *   *Conflict:* You cannot have (A) $\psi$ is purely information about an underlying physical state $\lambda$, (B) Distinct $\psi$ can correspond to the same $\lambda$ (overlapping), (C) Independently prepared systems have independent $\lambda$, AND (D) QM predictions are correct.
      *   *Resolution:* Drop one. Most drop (B) (making it $\psi$-ontic effectively) or (C) (retrocausality/holism) or (D) (modify QM).

  6.  **Identify the Most Exclusionary Requirement:**
      *   It's **Preparation Independence** (part of D1/D4). If you keep this, PBR forces you toward $\psi$-ontic. If you drop it, you can stay $\psi$-epistemic but at the cost of holistic conspiracies. For a lab scientist, Preparation Independence is intuitive (I make molecule A, you make molecule B). Dropping it is painful.

  7.  **Drafting the Scorecard:**
      *   *Everett:* $\psi$-ontic (universal wavefunction). Solves measurement via branching. Struggles with probability (Born rule derivation). Good on Replication.
      *   *Bohm:* $\psi$-ontic (guiding field) + particles. Deterministic. Non-local. Good on Definite Outcomes.
      *   *QBist:* $\psi$-epistemic (agent belief). Rejects PBR by denying Preparation Independence (in the ontic sense) or denying the need for an underlying ontology. Good on Agent perspective, bad on "Replication" intuition (intersubjective agreement needs explanation).
      *   *Hidden-Variable Epistemic (e.g., Spekkens):* $\psi$-epistemic. Restricted by PBR. Must give up Preparation Independence or modify QM.

  8.  **Refining the Tone:**
      *   Acknowledge the "joiner" analogy.
      *   Avoid condescension.
      *   Be precise about PBR (it doesn't kill *all* epistemic views, just $\psi$-epistemic models with preparation independence).
      *   Address the "Dual Character" honestly: It's desirable but likely impossible to satisfy strictly without ambiguity.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific prompt about "which leg to drop"? Yes, need to be explicit about PBR assumptions.
      *   *Check:* Did I avoid references? Yes.
      *   *Check:* Is the distinction between "non-negotiable" and "preference" clear?
      *   *Check:* The user asked to strike confused requirements. I should critique #5 (Dual Character) gently. It's a hope, not a logical requirement.
      *   *Check:* The user asked for the "single requirement that does the most to exclude live candidates." That is Preparation Independence in the context of PBR.

  10. **Final Polish:** Ensure the structure matches the prompt's request (Assessment -> Final List -> Conflicts -> Scorecard). (Proceed to generate output based on these thoughts).

  *(Self-Correction on PBR nuance)*: I need to be careful not to say PBR proves $\psi$ is ontic. It proves $\psi$-epistemic models *of a certain type* are incompatible with QM + Preparation Independence. QBists, for example, reject the assumption that there is an underlying $\lambda$ at all. I must make sure the distinction is clear for the experimentalist.

  *(Self-Correction on "Replication")*: The user's point about interference between independently prepared systems is strong. If $\psi$ is just my belief, why does your belief match mine well enough to interfere? This is the "Intersubjective Agreement" problem.

  *(Final Plan)*:
  1. Intro acknowledging the user's position.
  2. Assess the 5 candidates.
  3. Present the refined Final List of Desiderata.
  4. Discuss Joint Unsatisfiability (PBR/Bell).
  5. Identify the "Killer" Constraint.
  6. Scorecard.
  7. Closing thought.

  Let's write.
answer: |-
  You approach this as an experimentalist who wants to know whether the tool in your hand is a hammer or a map. That is the correct stance. Philosophy of physics often forgets that the quantum state was invented to save the phenomena, not to satisfy metaphysicians.

  Here is the assessment of your candidate requirements, the refined list of desiderata, the analysis of their compatibility, and the scorecard you requested.

  ### Part 1: Assessment of Your Candidate Requirements

  **1. Replication without communication.**
  *Verdict:* **Keep. Non-negotiable.**
  This is not a philosophical preference; it is an empirical fact of your trade. If you and I follow the same recipe in London and Boston, our samples interfere. Any account that makes the state *too* subjective (e.g., purely idiosyncratic belief) fails to explain why our "beliefs" align so perfectly that they produce physical interference fringes. An account must explain the *constraint* on preparation that forces this agreement.

  **2. The Born question.**
  *Verdict:* **Keep. Non-negotiable.**
  "Probabilities of what?" is the measurement problem in disguise. If the state is knowledge, there must be something the knowledge is *about*. If the state is physical, there must be a mechanism for probability (chance) to enter a deterministic evolution. An account that leaves this vague is not an account; it is a evasion.

  **3. Surplus structure.**
  *Verdict:* **Keep. Non-negotiable.**
  This is the strongest argument against naive epistemic views. Classical probabilities add; quantum amplitudes interfere. If $\psi$ is just a probability distribution over hidden physical states, the phase information is "surplus." Yet, that surplus does causal work (e.g., in your benzene ring calculations). An epistemic account must explain why "knowledge" has a phase that behaves like a physical wave.

  **4. Consistency with what is already established (Bell/PBR).**
  *Verdict:* **Keep, but refine.**
  Bell is settled: non-locality (or non-separability) is a fact of the world. PBR is more subtle. It does not prove $\psi$ is ontic *simpliciter*; it proves that $\psi$ cannot be *mere* information about an underlying physical state *if* we assume independently prepared systems have independent physical states. You correctly identify this as a threat of joint unsatisfiability. This is the crux of the matter.

  **5. Dual character (Entropy analogy).**
  *Verdict:* **Strike as a requirement; keep as a hope.**
  This is the most seductive item on your list, but it is a category error to demand it as a *desideratum*. Entropy is dual because we have two theories (thermodynamics and statistical mechanics) that bridge via limit theorems. Demanding that the quantum state be *both* ontic and epistemic is asking for a contradiction unless a specific bridging mechanism is provided. It is a desirable *feature* of a solution (pragmatic utility), but not a logical constraint. Insisting on it risks forcing a "have your cake and eat it" interpretation that satisfies neither camp.

  ### Part 2: The Final List of Desiderata

  To guide a working scientist, an account must satisfy these four conditions. I have marked which are empirical constraints (Non-Negotiable) and which are metaphysical preferences (Camp Preferences).

  **D1. Preparation Stability (Non-Negotiable)**
  *Motivation:* Derived from your "Replication" point.
  *Requirement:* The account must explain why distinct agents, using distinct apparatus, converging on the same preparation procedure, arrive at systems that are physically indistinguishable regarding future interference. There must be a physical constraint on preparation that limits the allowable states of the system, regardless of the agent's knowledge.

  **D2. Outcome Definiteness (Non-Negotiable)**
  *Motivation:* Derived from "The Born Question."
  *Requirement:* The account must specify what constitutes a "measurement outcome" (e.g., the spectrometer reading) and how the transition from the quantum description to the definite record occurs. It must identify the ontology that corresponds to the pointer position.

  **D3. Structural Fidelity (Non-Negotiable)**
  *Motivation:* Derived from "Surplus Structure."
  *Requirement:* The mathematical structure of $\psi$ (specifically phase and superposition) must map onto the ontology in a way that explains interference. If $\psi$ is physical, the ontology must wave. If $\psi$ is information, the ontology must constrain information updates in a wave-like manner.

  **D4. Preparation Independence (Camp Preference / Pivot Point)**
  *Motivation:* Derived from PBR and standard lab practice.
  *Requirement:* Systems prepared independently in spacelike separated regions possess independent physical states (ontic states).
  *Status:* This is the pivot. It feels non-negotiable to an experimentalist (I make my molecule, you make yours). However, satisfying D1–D3 alongside D4 forces a $\psi$-ontic conclusion (via PBR). Dropping D4 allows $\psi$-epistemic views but at the cost of holistic conspiracies.

  ### Part 3: Joint Unsatisfiability and the "Killer" Constraint

  You asked which leg of the conflict should be dropped. Here is the logical landscape.

  **The PBR Conflict:**
  The Pusey–Barrett–Rudolph theorem demonstrates the joint unsatisfiability of the following four claims:
  1.  **Quantum Predictions:** QM calculations (including interference) are correct.
  2.  **$\psi$-Epistemic:** Distinct quantum states ($\psi_1, \psi_2$) can correspond to the same underlying physical reality ($\lambda$). (i.e., the state is overlapping information).
  3.  **Preparation Independence:** Independently prepared systems have independent underlying physical states ($\lambda_{joint} = \lambda_1 \times \lambda_2$).
  4.  **Realism:** There is an underlying physical state $\lambda$ at all.

  **The Verdict:**
  You cannot hold all four.
  *   **Everett and Bohm** drop (2). They are $\psi$-ontic.
  *   **QBism** drops (4). They deny there is an underlying $\lambda$ to be known. The state is belief, and there is no "world behind the veil" in the traditional sense.
  *   **Retrocausal/Holistic Epistemic models** drop (3). They claim your preparation here can depend on the future measurement or is holistically linked to my preparation there.

  **Which requirement does the most to exclude live candidates?**
  **D4 (Preparation Independence).**
  This is the "Killer." If you insist on Preparation Independence as a non-negotiable feature of reality (which fits your intuition as a chemist making distinct samples), PBR forces you into the **$\psi$-ontic** camp. You cannot be a $\psi$-epistemic realist and keep Preparation Independence.
  If you are willing to drop Preparation Independence (accepting that the universe is more holistically connected than lab practice suggests), you can remain $\psi$-epistemic.
  *Cost of dropping D4:* It undermines the standard justification for why your lab and mine are separate. It implies a "conspiracy" in nature that coordinates independent preparations.
  *Cost of keeping D4:* You must accept that the wavefunction is a physical field (or law) existing in high-dimensional space, not just a description of a molecule in 3D space.

  **Recommendation:** For a working scientist, **keep D4**. The cost of dropping it (holistic conspiracy) is more damaging to scientific practice than the cost of keeping it (accepting a high-dimensional ontology).

  ### Part 4: Scorecard

  **Everett (Many-Worlds)**
  *   **Status:** $\psi$-Ontic.
  *   **Performance:** Satisfies D1, D3, D4 perfectly. The wavefunction is the only reality; preparation independence holds for branches.
  *   **Failure:** Struggles with D2 (Outcome Definiteness). It must explain why *you* see one result when *all* occur. It also struggles to derive the Born Rule (probabilities) from a deterministic theory without circularity.
  *   **For the Chemist:** Tells you the state is real, but implies your spectrometer reading is only relative to a branch.

  **Bohmian Mechanics**
  *   **Status:** $\psi$-Ontic (as a guiding law) + Particles Ontic.
  *   **Performance:** Satisfies D1, D2, D3, D4. Particles have definite positions (spectrometer pointers), $\psi$ guides them. Preparation independence holds for particles.
  *   **Failure:** Explicitly Non-Local (violates spirit of relativity, though not signaling). The $\psi$ lives in configuration space, not 3D space, which is ontologically awkward.
  *   **For the Chemist:** Best fit for "definite outcomes." You get your molecules and your readings. The price is accepting instantaneous action-at-a-distance as fundamental.

  **QBism (Neo-Copenhagen)**
  *   **Status:** $\psi$-Epistemic (Agent-centered).
  *   **Performance:** Satisfies D2 (outcomes are personal experiences) and D3 (structure is normative for betting).
  *   **Failure:** Fails D4 (denies underlying $\lambda$) and strains D1. It explains replication via "community of agents" rather than physical constraint. It risks making science solipsistic unless carefully framed.
  *   **For the Chemist:** Liberating (no spooky reality), but frustrating. It tells you the state is your expectation, but offers no story on *why* your expectation matches the interference pattern other than "you'd be a bad agent if it didn't."

  **Hidden-Variable Epistemic (e.g., Spekkens' Toy Model)**
  *   **Status:** $\psi$-Epistemic (Realist).
  *   **Performance:** Intuitively appealing (state is knowledge of hidden variables).
  *   **Failure:** Violated by PBR unless D4 (Preparation Independence) is dropped. Cannot reproduce full QM (usually restricted to subsets like Clifford gates) without giving up independence or locality.
  *   **For the Chemist:** The most "common sense" view, but mathematically incompatible with your actual data if you insist on independent preparations.

  ### Summary Advice

  You asked whether to treat the state as something "out there" or "bookkeeping."

  Based on the desiderata required for *your* practice (specifically **Preparation Stability** and **Preparation Independence**), the **$\psi$-ontic** view is the only one that does not require you to abandon the intuition that your laboratory is locally separate from mine.

  The **Dual Character** you hoped for (Requirement 5) is likely unavailable. You must choose: either the state is a physical field (Bohm/Everett) and you accept the high-dimensional ontology, or it is information (QBism) and you accept that "reality" is secondary to experience. Given your career measuring spectra of *molecules*, the **Bohmian** stance offers the closest alignment: the molecules are there, the state is a real law governing them, and the spectrometer reads a definite value. The cost is non-locality, but in gas-phase spectroscopy, that cost is rarely paid in cash.
