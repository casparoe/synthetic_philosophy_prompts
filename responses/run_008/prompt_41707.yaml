  I've been trying to work out my actual position on everyday conventions, mostly after a weird argument at dinner last week, and I want to lay out my gut verdicts and have you tell me if there's a principle underneath them or whether some of them just have to go. So here's the batch of cases I've been mulling. Jaywalking at 3am on a completely empty street: totally fine, not even a mild wrong. Jaywalking with my kid's hand in mine on a busy road: clearly wrong, and it feels like more than just imprudence. Skipping a long queue because a friend near the front waves me over to join them: fine, or at least I'd do it without guilt. Skipping the same queue by just walking to the front and standing there: absolutely not. Not tipping in a US restaurant even though I know the servers depend on it: wrong. Not tipping in Tokyo even though I know tipping isn't done there: right, actually obligatory, I'd feel like a jerk leaving money on the table. A tourist visiting my city refusing to tip because "tipping culture is toxic and somebody has to push back": I half admire it and half think they're making a waiter pay for their principles, which I can't square with how comfortable I feel refusing to tip in Tokyo myself. And one more: when I was in a country where pushing in crowds at bus stops was just the norm, I did it after a day of getting trampled, and I still feel vaguely bad about it, even though rationally I don't see what else I should've done.

  So my tentative thought was something like "follow the local convention whenever violating it shifts a concrete cost onto a specific identifiable person" — the waiter gets stiffed, the person behind the friend in the queue gets delayed by me. But that seems to get the Tokyo case backwards: refusing to tip there harms nobody, so my rule says tipping is optional, yet my gut says it's actively rude. And it also seems to make the crowd-pushing case fine, which doesn't match my lingering guilt. Maybe the principle needs something about respecting the community's own coordination scheme rather than tracking who gets hurt? But then the "push back against tipping culture" tourist is following *a* principle, just not the local one, so maybe what matters is whether you've genuinely opted into the community or not, and visitors are in some half-in half-out state that has its own rules.

  Can you give me one principle (or a small set of candidates) that captures as many of my verdicts as possible, tell me which verdicts it forces me to abandon, and state it precisely enough to predict the right answer on a couple of cases I haven't listed? For instance, I genuinely don't know what to think about: silently jaywalking in a country where nobody ever jaywalks even on empty streets, because the norm against it is just that strong there. If your principle has something to say about that, I'd take it as a good sign. Also happy to hear if you think one of my verdicts is just bias talking and I should revise it outright — the Tokyo tipping one is the one my friends keep hammering me on.
