answer: |-
  Here is a principle that captures the architecture of your intuitions, along with an analysis of where it holds, where it forces a revision, and how it handles your new test cases.

  ### The Principle: **Local Reliance and Non-Exploitation**

  **Statement:**
  > You have a pro tanto obligation to follow the constitutive conventions of a social context when others are **relying** on those conventions for coordination or welfare, **unless** the convention itself violates a universal moral floor. Crucially, you may not opt out of a convention if the **cost of your disruption** falls disproportionately on a specific, vulnerable individual who relies on that convention for their well-being.

  This principle combines two distinct moral engines:
  1.  **Coordination (The "Local Reliance" clause):** Conventions exist to solve coordination problems (queues, traffic, tipping scripts). Violating them creates friction, confusion, or risk, even if no one is immediately "harmed" in a physical sense.
  2.  **Distribution (The "Non-Exploitation" clause):** You cannot use an abstract principle (like "tipping is toxic") to justify breaking a convention if the immediate penalty is paid by a service worker who has no power to change the system.

  ---

  ### How It Maps to Your Verdicts

  | Case | Verdict | Principle's Explanation |
  | :--- | :--- | :--- |
  | **Jaywalking (3am, empty)** | **Fine** | **No Reliance.** Drivers are not relying on pedestrian obedience here; the coordination scheme is dormant. |
  | **Jaywalking (Kid, busy)** | **Wrong** | **High Reliance + Vulnerability.** Drivers rely on predictable pedestrian behavior for safety. Your child relies on you for modeling and protection. |
  | **Queue (Cutting)** | **Wrong** | **Violation of Reliance.** The queue is a pure coordination scheme based on arrival time. Cutting exploits the order others are maintaining. |
  | **Queue (Friend waves)** | **Fine** | **Sub-Norm Permission.** Most queuing cultures have a "sub-norm" allowing social joining. The friend acts as a proxy, absorbing the "cost" of your entry. *(See revision below)*. |
  | **No Tip (US)** | **Wrong** | **Non-Exploitation.** The waiter relies on the tip for income. Withholding it transfers the cost of your political stance onto them. |
  | **No Tip (Tokyo)** | **Right** | **Local Reliance.** The convention is *not* to tip. Tipping disrupts the script (can be seen as insulting or confusing). Following the norm respects the coordination. |
  | **Tourist (Anti-Tip)** | **Ambivalent** | **Non-Exploitation Violation.** You admire the principle, but the principle fails the distribution test. The waiter pays for the tourist's statement. |
  | **Crowd Pushing** | **Guilt** | **Coordination vs. Integrity.** The local norm is pushing (Coordination). You followed it. The guilt is an **"Integrity Tax"** (see below). |

  ---

  ### The Verdict You Must Revise: The Queue & Friend

  Your intuition says joining a friend at the front of a queue is "fine... without guilt." The principle suggests this is **conditionally permissible, but not guilt-free.**

  **Why:** While your friend can consent to you joining *them*, they cannot consent on behalf of the five people standing behind them. You are still effectively moving ahead of those people. In many cultures, this is accepted as a "social sub-norm" (saving spots is okay). In others, it is rude.
  **Revision:** Your verdict should depend on whether the *local convention* allows spot-saving. If you are in London or Tokyo, joining a friend might be seen as rude as cutting. If you are in a more relaxed context, it's fine.
  **Action:** Don't treat this as "always fine." Treat it as "fine only if the local sub-norm permits it." If you feel no guilt, ensure that's because you've verified the local custom, not because you assume your friendship overrides the queue.

  ### The Verdict You Should Defend: Tokyo Tipping

  Your friends are hammering you on the Tokyo case, suggesting you are biased. **You are not biased; your friends are being moral universalists in a particularist context.**

  Under **Local Reliance**, tipping in Tokyo is actually the *wrong* action.
  1.  **Coordination:** Japanese service culture is built on the price being the price. Tipping introduces a variable that confuses the transaction. It can imply the employer doesn't pay enough (insulting the firm) or that the customer is offering charity (insulting the worker's pride).
  2.  **Harm:** Unlike the US, where *not* tipping harms the worker, in Tokyo, *tipping* can cause social friction or administrative hassle for the worker (they may have to chase you down to return it).
  **Conclusion:** Your gut is correct. Respecting the local script is the moral duty here.

  ### Explaining The "Crowd Pushing" Guilt

  You asked why you feel bad about pushing in a crowd even when it's the norm. The principle calls this the **Integrity Tax**.

  *   **The Rule:** You followed *Local Reliance* (everyone pushes, so you push to coordinate). You did the "right" thing for that context.
  *   **The Guilt:** You hold a deeper, personal norm of "civility" (don't shove strangers). When a local convention forces you to violate a deep personal norm, you pay a psychological tax.
  *   **Advice:** Accept the guilt as a signal of your values, but do not let it dictate the action. In that context, *not* pushing would have made you an obstacle (violating Local Reliance). The guilt is the cost of adaptation, not a sign you acted wrongly.

  ---

  ### Predictions for New Cases

  Here is how the principle predicts answers for cases you haven't listed, specifically the one you mentioned.

  **Case 1: Silent Jaywalking in a Strict Culture**
  *   *Scenario:* You are in a country (e.g., Germany or Singapore) where jaywalking is culturally taboo, even at 3am on empty streets. Locals wait for the green man.
  *   *Prediction:* **Do not jaywalk.**
  *   *Reasoning:* Even if the road is empty, the **Local Reliance** is high. Drivers in these cultures rely on *absolute* pedestrian obedience to manage their own attention. If you cross, you aren't just risking your life; you are disrupting the predictability that allows the system to function smoothly. Furthermore, if there are other pedestrians watching, you are modeling behavior that undermines the local safety equilibrium.
  *   *Verdict:* It is rude/wrong, not because of danger, but because of **coordination betrayal**.

  **Case 2: The "Under-the-Table" Payment**
  *   *Scenario:* You are in a country where bribery ("grease payments") is the standard way to get a permit processed. Refusing to pay means your application sits forever.
  *   *Prediction:* **Do not pay (if possible), but acknowledge the dilemma.**
  *   *Reasoning:* This hits the **Universal Moral Floor**. While *Local Reliance* says "everyone does it," the convention involves corruption/harm to the broader system. The **Non-Exploitation** clause is tricky here (the clerk relies on the bribe), but the harm to the public trust outweighs the local coordination norm.
  *   *Verdict:* This is the exception where you break the local norm. However, the principle acknowledges you are placing a burden on the clerk. The "right" move is to refuse, but without moral superiority—you are breaking the contract because the contract is corrupt.

  ### Summary of Advice

  1.  **Adopt "Local Reliance and Non-Exploitation"** as your guiding heuristic.
  2.  **Keep the Tokyo Verdict.** Tell your friends: "Tipping is a communication act. In Tokyo, the message of a tip is 'confusion' or 'insult.' I am obligated to communicate clearly."
  3.  **Refine the Queue Verdict.** Acknowledge that joining a friend is only fine if the *local culture* accepts spot-saving. If you do it in a culture that hates it, you are violating Local Reliance.
  4.  **Accept the Crowd Guilt.** It's not a moral error; it's the friction between your home norms and your travel context. It means you haven't lost your civility, even if you had to suspend it.

  This framework keeps your intuitions mostly intact but tightens the logic so you don't accidentally justify selfishness (the queue) while defending cultural respect (Tokyo).
