prompt: |-
  I've just taken over a four-person analytics unit inside a regional transportation authority. Our job is to attach probability estimates to decisions that are irreducibly singular: whether a specific bridge retrofit finishes before the viaduct closure permit expires, whether ridership on a new ferry route hits the business case threshold in year two, whether the named contractor on a tunneling job defaults mid-project. Whenever a number goes out, we fight about which past projects to average over — the ones of similar size, similar geology, similar procurement type, or simply everything the authority has ever built. Two of my analysts say the fight is arbitrary and we should average over everything and let conditioning on the specific facts do the work; one refuses to average at all and insists each project is unique enough that the exercise is theater. I gather philosophers call this the reference class problem. Please turn whatever in that literature is actually usable into a procedure my team can run in an afternoon on a single estimate: the questions to ask in order, what counts as a sufficient answer to each, when the procedure is permitted to output a range instead of a point, where it stops and hands the decision to a named human because the question is one of judgment rather than method, and where it should say outright that no defensible class exists and we report that instead of a number. Then run it on two cases: the bridge retrofit against its deadline, where the closest matches are few but favorable, and the contractor default question, where the class we would want to use contains almost no members. Include at least one case where the procedure yields an answer management will not want to hear — for instance, if it shows the business case number came from a cherry-picked class and the honest range straddles the go/no-go threshold, sending the decision back to the politicians. Be explicit about what the procedure cannot fix, especially the fact that whoever chooses the class largely chooses the number.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case studies:

  1.  **Deconstruct the Request:**

      *   **Context:** 4-person analytics unit in a regional transportation authority.
      *   **Task:** Assign probability estimates to singular, high-stakes decisions (bridge retrofit deadline, ferry ridership, contractor default).
      *   **Problem:** Internal conflict over the "Reference Class Problem" (which past projects to average over).
          *   Analysts A & B: Average everything (let conditioning handle it).
          *   Analyst C: No averaging (each project is unique/theater).
      *   **Goal:** Create a usable, afternoon-length procedure based on philosophical/statistical literature (Reference Class Problem) to resolve disputes.
      *   **Requirements:**
          *   Sequential questions.
          *   Criteria for sufficient answers.
          *   Rules for outputting ranges vs. points.
          *   Hand-off points to human judgment.
          *   Stop rules (no defensible class = report that).
          *   Explicit acknowledgment of limitations (class choice = number choice).
          *   **Case Studies:**
              1.  Bridge Retrofit (few but favorable matches).
              2.  Contractor Default (almost no members in desired class).
              3.  "Unwelcome Truth" Case (e.g., Ferry Ridership/Business Case threshold).

  2.  **Theoretical Foundation (The "Literature"):**

      *   *The Reference Class Problem:* Identified by Venn, refined by Reichenbach, Salmon, Hájek. The core issue is that any individual event belongs to infinite classes, each with different frequencies.
      *   *Usable Solutions:*
          *   **Reichenbach's Rule:** Use the *narrowest* class for which reliable statistics exist.
          *   **Tetlock/Good Judgment Project:** Use outside view (base rates) adjusted by inside view (specifics), but weigh the outside view heavily to combat optimism bias.
          *   **Kahneman & Tversky:** Planning Fallacy. Start with the distribution of similar cases, then adjust.
          *   **Bayesian Approach:** Prior (base rate) + Likelihood (specific evidence) = Posterior.
          *   **Pragmatic/Decision-Theoretic:** What class minimizes prediction error *for this specific type of decision*?
      *   *Synthesis for the Procedure:* I need a hybrid of Reichenbach (narrowest reliable) and Kahneman (Outside View first). I need to explicitly address the "uniqueness" objection (Analyst C) by distinguishing between *causal uniqueness* and *statistical exchangeability*.

  3.  **Drafting the Procedure (The "Afternoon Protocol"):**

      *   *Name:* The Reference Class Triangulation Protocol (RCTP).
      *   *Timebox:* 3 hours max.
      *   *Step 1: Define the Event.* (Precise binary outcome).
      *   *Step 2: The "Uniqueness" Test.* (Address Analyst C). Is there *any* precedent? If no, stop.
      *   *Step 3: Generate Candidate Classes.* (Broad, Medium, Narrow).
      *   *Step 4: The Reliability Filter.* (Sample size vs. Relevance). This is the core Reichenbach trade-off.
      *   *Step 5: The Adjustment Phase.* (Inside View). Can we justify moving away from the base rate?
      *   *Step 6: Output Rules.* (Point vs. Range vs. "No Estimate").
      *   *Step 7: The Political Handoff.* (When the number kills the project).

  4.  **Developing the Case Studies:**

      *   *Case 1: Bridge Retrofit (Deadline).*
          *   *Scenario:* Specific bridge, specific permit expiry.
          *   *Data:* Few matches (n=5), all finished early. Broad class (n=100), mixed results.
          *   *Application:* Narrow class is too small for reliability. Must widen. Result: Probability lower than team hopes.
      *   *Case 2: Contractor Default.*
          *   *Scenario:* Specific tunneling contractor.
          *   *Data:* Desired class (same contractor + same geology) = n=1 (the current job) or n=0.
          *   *Application:* Fail the Uniqueness Test or Reliability Filter. Output: "No Defensible Estimate."
      *   *Case 3: Ferry Ridership (The Unwelcome Truth).*
          *   *Scenario:* New route, business case requires 10k/day Year 2.
          *   *Data:* Cherry-picked class (similar marketing push) shows 15k. Honest class (all new routes) shows 8k.
          *   *Application:* Protocol forces the honest class. Range straddles threshold. Decision handed to politicians.

  5.  **Refining the Constraints & Limitations:**

      *   Must explicitly state: "Who chooses the class chooses the number."
      *   Must define when to stop (insufficient data).
      *   Must handle the "Average Everything" vs. "Average Nothing" fight.
      *   *Solution:* The "Narrowest Reliable" rule. It splits the difference. Don't average *everything* (too noisy), don't average *nothing* (no data). Find the sweet spot.

  6.  **Writing the Response:**

      *   *Tone:* Professional, directive, slightly weary of bureaucracy but pragmatic.
      *   *Structure:*
          1.  Introduction (Acknowledging the philosophical root).
          2.  The Protocol (Step-by-step).
          3.  The Limitations (The "cannot fix" section).
          4.  The Case Studies (Running the protocol).
      *   *Self-Correction during drafting:* I initially thought about suggesting Bayesian updating. *Correction:* Too complex for an afternoon workshop with conflicting analysts. Stick to Frequency + Adjustment. It's more transparent for auditors.
      *   *Focus on the "Unwelcome Truth":* Make sure the Ferry case clearly demonstrates how the protocol prevents gaming the base rate.

  7.  **Final Review against Prompt:**

      *   Questions in order? Yes.
      *   Sufficient answer criteria? Yes.
      *   Range vs. Point rules? Yes.
      *   Human handoff? Yes.
      *   "No defensible class" output? Yes.
      *   Case 1 (Bridge)? Yes.
      *   Case 2 (Contractor)? Yes.
      *   Case 3 (Unwelcome/Ferry)? Yes.
      *   Explicit limitations? Yes.

  8.  (Final Polish): Ensure the distinction between *epistemic* uncertainty (lack of knowledge) and *aleatory* uncertainty (randomness) is implied but not over-complicated. Keep the focus on *exchangeability*.

  *(Self-Correction on Case 2)*: The prompt asks for Contractor Default where the class has *almost no members*. I need to make sure the protocol doesn't just force a number. It must allow for "We cannot estimate this."
  *(Self-Correction on Case 3)*: Ensure the "cherry-picked class" is explicitly identified and rejected by the protocol.

  Let's assemble the document.cw
answer: |-
  ## The Reference Class Triangulation Protocol (RCTP)

  **Purpose:** To resolve internal disputes over probability estimation for singular events by standardizing the selection of the "reference class" (the group of past events used to calculate a base rate).
  **Timebox:** 3 Hours maximum per estimate.
  **Participants:** The Analytics Unit (4 people).
  **Philosophical Basis:** Reichenbach's "Narrowest Reliable Class" rule, modified by Kahneman's "Outside View" constraint.

  ---

  ### Part 1: The Procedure

  Run these steps in order. Do not proceed to the next step until the current one is documented and signed off by the Unit Lead.

  #### Step 1: The Binary Definition
  **Question:** What is the exact binary outcome we are estimating, and what is the deadline for resolution?
  **Sufficient Answer:** A statement that allows no ambiguity in hindsight (e.g., *"Permit expires on Dec 31, 2025. Outcome = 1 if retrofit complete and certified by Dec 31, 2025; else 0."*).
  **Stop Rule:** If the outcome cannot be defined binary (e.g., "success" is vague), stop. Report: *"Outcome undefined."*

  #### Step 2: The Uniqueness Test (Addressing Analyst C)
  **Question:** Is there *any* historical precedent in this authority or comparable authorities where a similar decision was made?
  **Sufficient Answer:** A list of at least 3 comparable historical instances.
  **Stop Rule:** If fewer than 3 instances exist globally, stop. Report: *"No defensible class exists. This is a true singularity. Estimate is judgment-only."*
  *Note: This validates the "unique" argument but sets a low bar. If 3 exist, it is not unique.*

  #### Step 3: Candidate Class Generation
  **Question:** What are the three logical classes we could average over?
  **Requirement:** You must define three specific classes:
  1.  **Broad:** All projects of this type (e.g., "All bridge work").
  2.  **Medium:** Projects sharing key structural constraints (e.g., "Steel truss retrofits in urban areas").
  3.  **Narrow:** Projects sharing specific situational constraints (e.g., "This specific bridge, same contractor, same permit window").
  **Sufficient Answer:** A definition for each class and the count ($N$) of historical projects in the authority's database for each.

  #### Step 4: The Reliability Filter (Addressing Analysts A & B)
  **Question:** Which is the *narrowest* class that contains sufficient data to be statistically stable?
  **Rule:** Apply the **$N \geq 10$ Rule**.
  *   If Narrow $N \geq 10$: Use Narrow.
  *   If Narrow $N < 10$ but Medium $N \geq 10$: Use Medium.
  *   If Medium $N < 10$ but Broad $N \geq 10$: Use Broad.
  *   If Broad $N < 10$: Stop. Report: *"Insufficient data for frequency-based estimate."*
  *Rationale:* This splits the difference between "average everything" (too noisy) and "average nothing" (no data). It forces you to widen the class until the math works.

  #### Step 5: The Base Rate Calculation
  **Action:** Calculate the frequency of success ($p$) in the selected class from Step 4.
  **Output:** A single percentage (e.g., 65%).

  #### Step 6: The Adjustment Justification (The Inside View)
  **Question:** Do we have specific evidence about *this* case that justifies moving the probability away from the Base Rate?
  **Constraint:** You may adjust the Base Rate by maximum ±15% unless you have documented, quantitative evidence (e.g., "Contractor has 20% more crew than historical average").
  **Sufficient Answer:** A written justification for any adjustment. If no justification is written, the Base Rate stands.
  *Note: This prevents "gut feeling" from overriding the data.*

  #### Step 7: Output Determination
  **Rule:**
  *   **Point Estimate:** If Step 6 adjustment is $\leq 5\%$.
  *   **Range:** If Step 6 adjustment is $> 5\%$ OR if the selected class in Step 4 was the "Broad" class (indicating high uncertainty). Format: $[Low, High]$.
  *   **Political Handoff:** If the Range straddles a pre-defined management threshold (e.g., Business Case requires 70% probability; Range is 60%-80%).
  *   **No Estimate:** If Step 2 or Step 4 triggered a Stop Rule.

  ---

  ### Part 2: What This Procedure Cannot Fix

  Be explicit with management when delivering the estimate:

  1.  **The Class Choice is the Number:** Even with the $N \geq 10$ Rule, the definition of "Medium" vs. "Broad" in Step 3 is subjective. Whoever defines the categories influences the $N$. This protocol reduces arbitrariness; it does not eliminate it.
  2.  **Stationarity Assumption:** This assumes the future resembles the past. If the authority's procurement laws changed last year, historical default rates are irrelevant. The protocol cannot detect structural breaks in the data; humans must flag them in Step 6.
  3.  **The "Unwelcome Truth":** This protocol is designed to prevent cherry-picking. It will frequently produce numbers that invalidate business cases. It does not have a mechanism to "make the numbers work." If the base rate kills the project, the protocol demands you report the kill.

  ---

  ### Part 3: Case Studies

  #### Case 1: The Bridge Retrofit Deadline
  **Context:** A specific steel bridge retrofit must finish before a viaduct closure permit expires in 18 months.
  **The Conflict:** The engineering team says "90% chance." The analysts are fighting over the class.

  **Running the Protocol:**
  *   **Step 1:** Binary defined. (Complete/Certified by Date X).
  *   **Step 2:** Uniqueness Test. There are past retrofits. Pass.
  *   **Step 3:** Candidate Classes.
      *   *Narrow:* "Retrofits on this specific bridge type, same contractor, same permit agency." ($N = 4$).
      *   *Medium:* "All steel bridge retrofits in this region." ($N = 22$).
      *   *Broad:* "All capital projects over $50M." ($N = 150$).
  *   **Step 4:** Reliability Filter.
      *   Narrow $N=4$ (<10). Reject. (Analysts A & B wanted to use this because all 4 finished early).
      *   Medium $N=22$ ($\geq 10$). **Select Medium.**
  *   **Step 5:** Base Rate. In the Medium class, 14/22 finished on time. Base Rate = **64%**.
  *   **Step 6:** Adjustment. The team argues the project manager is "top tier." No quantitative evidence provided. Adjustment = 0%.
  *   **Step 7:** Output. **Range [55% - 75%]** (Range required because we had to widen to Medium class, indicating higher uncertainty than the Narrow class would suggest).

  **Result:** The engineering team wanted 90% (based on the Narrow class of 4 favorable projects). The protocol forces the use of the Medium class, dropping the probability to ~64%. Management cannot claim 90% without violating the protocol.

  ***

  #### Case 2: The Contractor Default
  **Context:** A specialized tunneling contractor is working on a high-risk geology job. Management wants to know the probability of default mid-project to price an insurance bond.
  **The Conflict:** Analyst C says "This is unique, no number." Analyst A wants to average all contractor defaults.

  **Running the Protocol:**
  *   **Step 1:** Binary defined. (Contractor declares bankruptcy or abandons site).
  *   **Step 2:** Uniqueness Test. We search for: "Tunneling contractor, same geology, same contract value, same firm."
      *   Historical matches in authority database: **0**.
      *   Historical matches in national database: **1** (a job 15 years ago).
  *   **Step 3:** Candidate Classes.
      *   *Narrow:* Same firm + Geology. ($N = 0$).
      *   *Medium:* Same Geology + Any Firm. ($N = 5$).
      *   *Broad:* All Construction Contracts. ($N = 500$).
  *   **Step 4:** Reliability Filter.
      *   Narrow $N=0$. Reject.
      *   Medium $N=5$ (<10). Reject.
      *   Broad $N=500$ ($\geq 10$). **Select Broad.**
      *   *Correction/Stop:* Wait. Does "All Construction Contracts" meaningfully predict "Tunneling Default"?
      *   *Protocol Check:* Step 2 asked for *similar* decisions. While $N=500$ exists, the causal mechanism for tunneling default (geology risk) is not present in the Broad class (mostly office buildings/roads).
      *   *Decision:* The class is statistically reliable but causally invalid.
  *   **Step 7:** Output. **"No Defensible Estimate."**

  **Result:** The protocol validates Analyst C. While a number *could* be generated using the Broad class, the causal disconnect makes it misleading. The report states: *"Default risk is driven by geology/contractor specificities for which no reference class exists. Do not price bond using historical authority averages."*

  ***

  #### Case 3: The Ferry Ridership (The Unwelcome Truth)
  **Context:** A new ferry route is proposed. The Business Case requires **10,000 riders/day** in Year 2 to be viable. The Project Sponsor claims a **85% probability** of hitting this.
  **The Conflict:** The Sponsor's team used a class of "High-Marketing Transit Launches" ($N=8$, all successful). The Analytics Unit suspects this is cherry-picked.

  **Running the Protocol:**
  *   **Step 1:** Binary defined. (Year 2 Avg Daily Ridership $\geq 10,000$).
  *   **Step 2:** Uniqueness Test. There are past ferry/route launches. Pass.
  *   **Step 3:** Candidate Classes.
      *   *Narrow (Sponsor's Choice):* "New routes with dedicated marketing budget >$1M." ($N = 8$). Success Rate: 100%.
      *   *Medium (Analyst's Choice):* "All new passenger ferry routes in region." ($N = 15$). Success Rate: 40%.
      *   *Broad:* "All new public transit modes." ($N = 60$). Success Rate: 35%.
  *   **Step 4:** Reliability Filter.
      *   Narrow $N=8$ (<10). **Reject.** (This is the critical move. The Sponsor's class is too small to be stable).
      *   Medium $N=15$ ($\geq 10$). **Select Medium.**
  *   **Step 5:** Base Rate. In the Medium class, 6/15 hit the threshold. Base Rate = **40%**.
  *   **Step 6:** Adjustment. Sponsor argues this route connects two major hubs unlike the others. Analysts agree this is valid. Adjustment: +10%.
      *   Adjusted Probability = **50%**.
  *   **Step 7:** Output Determination.
      *   Business Case Threshold: Requires >70% probability to proceed (per authority risk policy).
      *   Estimate: 50%.
      *   **Political Handoff.**

  **Result:** The report reads: *"Based on the Narrowest Reliable Class (all new ferry routes), the probability of hitting the business case threshold is 50% [Range 40%-60%]. This falls below the 70% risk tolerance required for funding approval. The higher estimate (85%) relies on a class size ($N=8$) too small for statistical reliability."*

  **Outcome:** The decision is handed to the politicians. They can approve the ferry, but they must do so knowing they are overriding the analytics unit's defensible protocol. The "cherry-picked" number is officially buried.

  ---

  ### Final Instruction to the Unit

  When you present these numbers, attach this protocol as an appendix. If management asks why the number is lower than the project team's guess, point to **Step 4**.

  You are not saying the project will fail. You are saying that **the past does not support the optimism.** If they choose to ignore the base rate, they are not making a data-driven decision; they are making a bet. Your job is to ensure they know the odds of the bet.
