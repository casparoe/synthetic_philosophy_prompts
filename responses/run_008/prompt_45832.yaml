prompt: |-
  i'm a phd student in phil language and i'm helping my supervisor put together the exam for our upper-level seminar on vagueness (final-year ugrads plus a couple MA students, one 90-minute essay answer). i want a question on epistemicism vs supervaluationism, but i'm really sick of grading answers that just recite the two positions side by side — "williamson says there's a sharp cutoff we can't know" vs "supervaluationism says a vague sentence is true iff true on all precisifications" — and then declare it a tie. the question needs a crux that forces them to actually engage.

  my idea is to make the crux about sharpness: supervaluationism is sold partly on preserving our intuition that there are no sharp boundaries for 'bald', but arguably it just relocates the sharpness — the set of admissible precisifications is itself sharply bounded, and 'there is a least number of hairs that makes a man bald' comes out supertrue even though each precisification says something different. meanwhile epistemicism's unknowability of the cutoff maybe isn't an embarrassing bullet to bite but a derivable consequence of margin-for-error reasoning (if you can't tell n hairs from n-1, your knowledge needs a margin, and iterating that makes the cutoff unknowable) — which would mean the epistemicist at least explains the data the supervaluationist merely re-labels. whether that's right is a genuinely open question, and i want the exam to test whether they can fight it out, not whether they've memorized the labels.

  please write (1) the question itself, (2) a model answer of around 600 words, and (3) a marking scheme out of 20 with 4-5 must-hit points, where you say what separates an A from a B by naming the specific moves each contains — e.g. the B answer notes that supertruth preserves excluded middle for vague sentences, while the A answer says what that does to the view's original selling point about no sharp boundaries.

  one more thing: since i have to defend this to my supervisor, include a short note after the marking scheme saying where the model answer's reasoning is weakest or what consideration would push toward the opposite verdict — i don't want to hand her something that pretends the dialectic is more settled than it is. and flag if the question as phrased accidentally leans on a contested reading, like treating the hidden-sharpness objection as obviously fatal when some people think admissibility itself can be vague, or treating margin-for-error as part of every epistemicist's story when really it's specific to williamson's version. ty!
