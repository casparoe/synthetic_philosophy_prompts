answer: |-
  Here are the materials for your seminar exam. I have structured them to force students beyond definition-recall and into the specific dialectic regarding sharpness and explanatory power that you outlined.

  ### 1. Exam Question

  **Question:**
  Supervaluationism is often motivated by the desire to preserve classical logic without accepting sharp boundaries for vague predicates. However, critics argue that supervaluationism merely relocates the sharpness: the set of admissible precisifications is itself sharply bounded, and existential claims (e.g., 'there is a precise number of hairs that makes a man bald') come out supertrue.

  By contrast, Epistemicism accepts sharp boundaries but argues that the unknowability of the cutoff is not a brute posit but a derivable consequence of margin-for-error principles governing knowledge.

  Evaluate the claim that Epistemicism provides a superior explanation of the *phenomenology of vagueness* (specifically our ignorance), whereas Supervaluationism merely re-describes the problem of higher-order vagueness. In your answer, address whether the metaphysical cost of sharp boundaries is outweighed by the explanatory gain.

  ***

  ### 2. Model Answer 
  The central tension between Supervaluationism and Epistemicism lies in how they trade metaphysical plausibility for logical and explanatory utility. Supervaluationism (SV) is initially attractive because it respects the intuition that there is no specific hair whose removal turns a non-bald man bald. By defining truth as supertruth (truth on all admissible precisifications), SV preserves classical logic (e.g., Excluded Middle) without committing to a specific cutoff in any single precisification. However, this advantage is threatened by the "relocated sharpness" objection.

  While no single precisification contains a known cutoff, the *set* of admissible precisifications must be sharply bounded to function logically. If admissibility were vague, we would face a regress of higher-order vagueness without resolution. Consequently, the sentence $\exists n (B(n) \land \neg B(n+1))$ comes out supertrue. This means SV is committed to the truth of the claim that there is a sharp boundary, even if it denies that any specific instance constitutes it. This undermines SV's original selling point: it claims to honor the intuition that there are no sharp boundaries, yet its semantic machinery entails that there are. It effectively re-labels the sharp boundary as a feature of the meta-language (admissibility) rather than the object language, failing to fully dissolve the paradox.

  Epistemicism (Epi), conversely, bites the metaphysical bullet. It accepts that there is a sharp cutoff. The challenge for Epi is to explain why this cutoff is unknowable without making our ignorance seem miraculous. Here, Williamson's margin-for-error principles provide a robust explanatory framework. The argument is that knowledge requires safety: if one knows $n$ hairs makes one bald, one could not easily have been wrong. But since $n$ and $n-1$ are indiscriminable, a belief formed at $n$ could easily have been formed at $n-1$. To ensure safety, knowledge must retreat from the boundary. Iterating this margin-for-error requirement explains why the boundary is not just unknown, but *unknowable*.

  When evaluating which view is superior, we must weigh SV's metaphysical comfort against Epi's explanatory depth. SV preserves the intuition that the world isn't sharp, but only by pushing the sharpness into the semantics of 'admissibility.' It explains why we hesitate to assert boundary claims (they aren't supertrue), but it struggles to explain why we cannot *know* the boundary without implying the boundary doesn't exist. Epi accepts a counterintuitive metaphysics but offers a derivation of our ignorance based on general principles of knowledge and indiscriminability.

  Therefore, the claim that Epi provides a superior explanation of the phenomenology of vagueness holds weight. SV treats our ignorance as a consequence of semantic indeterminacy, which risks being circular (we can't know because it's indeterminate; it's indeterminate because we can't precisify). Epi treats ignorance as a consequence of the relationship between discriminability and knowledge. While the metaphysical cost of sharp boundaries is high, Epi integrates vagueness into a broader epistemology, whereas SV isolates it within a specialized semantics that arguably fails to eliminate the sharpness it sought to avoid.

  ***

  ### 3. Marking Scheme (Out of 20)

  **Grade Boundaries:**
  *   **A (17-20):** Engages deeply with the "relocated sharpness" objection and the specific mechanism of margin-for-error. Explicitly evaluates the trade-off between metaphysics and explanation.
  *   **B (14-16):** Correctly defines both views and identifies the sharpness objection, but treats the positions as a static list rather than a dialectic. May miss the specific role of margin-for-error.
  *   **C (10-13):** Accurate definitions but fails to engage with the specific crux of the question (sharpness/ignorance). General comparison only.

  **Must-Hit Points (4 points each):**

  1.  **The Supervaluationist Motivation & Tension:**
      *   *B-Level:* States SV preserves classical logic and avoids sharp boundaries.
      *   *A-Level:* Notes that SV entails the supertruth of existence claims ($\exists n...$), creating a tension between its motivation (no boundaries) and its semantic output (boundaries exist in the set of precisifications).
  2.  **The "Relocated Sharpness" Objection:**
      *   *B-Level:* Mentions that precisifications are precise.
      *   *A-Level:* Explains that the *set of admissible precisifications* must be sharply bounded to avoid regress, meaning sharpness is relocated to the meta-language rather than eliminated.
  3.  **Epistemic Explanation of Ignorance:**
      *   *B-Level:* States Epistemicists say the boundary is unknowable.
      *   *A-Level:* Invokes **margin-for-error** or **safety conditions**. Explains that ignorance is derived from indiscriminability constraints on knowledge, not just posited as brute fact.
  4.  **Comparative Evaluation:**
      *   *B-Level:* Concludes one view is better because it feels more intuitive.
      *   *A-Level:* Weighs the **metaphysical cost** (sharp boundaries) against **explanatory gain** (deriving ignorance). Acknowledges that SV might save intuition but fails to explain the source of ignorance as well as Epi.

  ***

  ### 4. Critical Note for Supervisor

  **Regarding the Model Answer & Question Design:**

  1.  **Contested Reading of Supervaluationism:** The question and model answer treat the "sharp boundary of admissibility" as a fatal flaw. However, some supervaluationists (e.g., Rosanna Keefe) argue that admissibility itself can be vague, or that the objection misunderstands the non-factualist nature of the view. The model answer assumes a realist reading of precisifications that not all supervaluationists accept. A strong student might defend SV by arguing that 'admissibility' is a pragmatic, not semantic, constraint.
  2.  **Williamson-Specific Epistemicism:** The model answer leans heavily on Williamson's *margin-for-error* argument. While dominant, this is not the only version of epistemicism (e.g., Sorensen's sorites without paradox). The marking scheme rewards mention of margin-for-error, but students should not be penalized if they defend epistemicism using alternative explanations for ignorance, provided they address the "explanatory depth" requirement.
  3.  **Bias in Model Answer:** The model answer concludes that Epistemicism is explanatorily superior. This is a live debate, not a settled fact. The marking scheme is designed to reward the *quality of the argument* rather than the verdict; a student who convincingly argues that the metaphysical cost of sharp boundaries outweighs the explanatory benefits (favoring SV) should still receive an A, provided they engage with the margin-for-error objection seriously.

  **Defense of Pedagogical Value:** This question prevents the "side-by-side" summary by forcing students to evaluate whether SV actually solves the problem it claims to solve (sharpness) versus whether Epi solves the problem it is accused of creating (miraculous ignorance). It tests their ability to track a specific argumentative thread through two competing frameworks.
