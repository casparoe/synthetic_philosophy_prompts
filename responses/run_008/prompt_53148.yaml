  8.  **Final Polish:** Check against the user's specific vocabulary list to ensure usage is natural. (e.g., use "inductive biases," "generalization gaps," "ablation studies"). Ensure the "Residue" section is sharp—identifying where the metaphor breaks is crucial for a PhD student.

