answer: |-
  This is an excellent diagnosis of a very common philosophical deadlock. Your suspicion is well-founded: the slogan "You can't get an *ought* from an *is*" is often used as a philosophical Swiss Army knife, expected to cut through logical, semantic, and metaphysical knots all at once. Your professor's comment that it is "doing several jobs at once" is the key to untangling it.

  Here is a structured menu of the distinct claims the slogan might be expressing, followed by verdicts, an analysis of your classmate's move, and a guide for your section discussion.

  ### Part 1: The Menu of Readings

  We can separate the slogan into five distinct philosophical claims, ranging from trivial logical truths to heavy-duty meta-ethical theories.

  **1. The Logical Reading (Hume's Law)**
  *   **Claim:** No valid deductive argument can have a normative conclusion (an *ought*) if all its premises are purely descriptive ( *is* statements). To be valid, the argument must contain at least one normative premise.
  *   **Nature:** A point of formal logic.
  *   **Example:** "Pigs suffer" $\rightarrow$ "Factory farming is wrong" is formally invalid. It needs a bridge: "Inflicting suffering is wrong."

  **2. The Semantic Reading (Moore's Open Question)**
  *   **Claim:** Moral terms (like "wrong") cannot be *synonymous* with or *defined by* natural terms (like "causes suffering"). Even if we agree on all the facts, it remains an "open question" whether those facts constitute wrongness.
  *   **Nature:** A claim about meaning and concepts.
  *   **Example:** It makes sense to ask, "I know this causes suffering, but is it *wrong*?" If "wrong" just *meant* "causes suffering," that question would be nonsense (like asking "Is a bachelor unmarried?").

  **3. The Epistemological Reading (Justification)**
  *   **Claim:** Empirical evidence (science, observation) can never *justify* a moral belief. Moral knowledge requires a distinct faculty (intuition, reason) separate from sensory perception.
  *   **Nature:** A claim about how we know what we know.
  *   **Example:** No amount of video footage from inside a slaughterhouse can prove it is immoral; you need moral intuition to interpret that footage.

  **4. The Psychological Reading (Humean Motivation)**
  *   **Claim:** Beliefs about facts alone cannot motivate action. To move someone to act, you need a pre-existing desire or passion. Facts are inert; values move us.
  *   **Nature:** A claim about human psychology and motivation.
  *   **Example:** Telling a carnivore "pigs suffer" won't make them stop eating meat unless they already *care* about pig suffering.

  **5. The Metaphysical Reading (Non-Naturalism)**
  *   **Claim:** Normative properties (goodness, wrongness) are fundamentally different *kinds of things* than natural properties (pain, mass, velocity). They do not exist in the same ontology.
  *   **Nature:** A claim about the fabric of reality.
  *   **Example:** You can find pain with a microscope or a scan; you cannot find "wrongness" in the physical universe, even if you look at all the pain.

  ---

  ### Part 2: The Verdicts

  Here is the philosophical status of each reading. This addresses your suspicion that the "true" readings are idle and the "useful" readings are controversial.

  | Reading | Verdict | Why? |
  | :--- | :--- | :--- |
  | **1. Logical** | **Trivial but True** | This is basic validity. But it is **idle**. It doesn't stop the argument; it just asks the arguer to make their hidden premise explicit ("Suffering is bad"). Once added, the argument is valid. |
  | **2. Semantic** | **Substantive & Contested** | This is Moore's specific point. Many naturalists disagree (they think "good" *can* be defined by natural properties). It is not a logical law; it's a theory of meaning. |
  | **3. Epistemological** | **Probably False** | Most contemporary ethicists reject this. We use empirical evidence to justify moral beliefs all the time (e.g., in reflective equilibrium). If this were true, ethics would be cut off from science entirely. |
  | **4. Psychological** | **Plausible but Irrelevant** | Even if facts don't *motivate* you (internalism), they can still make a claim *true*. Whether you care about the truth is a separate issue from whether the conclusion follows. |
  | **5. Metaphysical** | **Highly Controversial** | This commits you to Moral Non-Naturalism. Many robust moral realists are Naturalists. Using the slogan to assert this is begging the question against Naturalists. |

  **The Rhetorical Trick:**
  When people use the slogan, they usually rely on the **Logical Reading** (which is undeniable) to smuggle in the **Epistemological Reading** (which is deniable). They act as if the logical gap implies an unbridgeable metaphysical chasm.

  ---

  ### Part 3: Does the Slogan Block the Factory Farming Argument?

  **Short Answer:** No. Not under any reading that is both plausible and relevant.

  **Detailed Analysis:**
  Your classmate used the slogan to block the inference: *Facts about suffering $\rightarrow$ Wrongness.*

  1.  **If she means the Logical Reading:** She is technically correct that the argument is formally invalid *as stated*. However, this is easily fixed. The proponent of the argument simply adds the normative premise: *"It is wrong to inflict severe suffering on sentient beings for trivial gustatory pleasure."*
      *   **Result:** The argument is now valid. The slogan didn't kill the argument; it just asked for a premise that almost everyone in the room already accepts. The slogan is **idle** here.

  2.  **If she means the Epistemological/Metaphysical Reading:** She is claiming that suffering facts *cannot* support moral conclusions, even with a bridge premise.
      *   **Result:** This is a substantive meta-ethical claim (Moral Skepticism or Non-Naturalism). She cannot simply assert this via slogan; she must argue for it. Most people in an intro ethics class are moral realists of some sort who believe facts *do* bear on values. If she insists on this reading, she is making a much heavier claim than she realizes.

  **Conclusion:** The slogan does not support her move. It creates an illusion of a deep problem where there is mostly just a request for clarity.

  ---

  ### Part 4: Is/Ought vs. The Naturalistic Fallacy

  You asked if these are the same complaint. They are **neighboring but distinct**, and conflating them is a major source of confusion in your course.

  *   **Hume's Is/Ought Gap:** Primarily about **inference**. It warns against sliding from descriptive premises to a normative conclusion without a normative bridge. It is about the *structure of arguments*.
  *   **Moore's Naturalistic Fallacy:** Primarily about **definition/identity**. It argues that "Good" is a simple, indefinable property. To say "Good *just means* Pleasure" is to commit the fallacy. It is about the *meaning of terms*.

  **Why the distinction matters for Factory Farming:**
  *   The factory farming argument is usually **not** claiming that "Wrong" *means* "Causes Suffering" (which Moore would attack).
  *   It is claiming that "Causes Suffering" is the *reason why* it is wrong (a synthetic claim).
  *   **Hume** says: "You need a premise linking suffering to wrongness." (Easy to supply).
  *   **Moore** says: "You can't define wrongness as suffering." (Irrelevant, because the arguer isn't offering a definition).

  **Verdict:** Your classmate is invoking Hume (inference), but she likely feels the force of Moore (the sense that "there must be more to it than just facts"). Conflating them makes her objection seem stronger than it is.

  ---

  ### Part 5: What to Say in Section

  Your professor's hint ("doing several jobs at once") suggests they want you to identify *which* job the slogan is trying to do. Here is a strategy for your discussion:

  **1. Diagnose the Classmate's Move**
  > "I think when you say 'you can't get an ought from an is,' you might be making a logical point, but you're using it to make a meta-ethical point. Logically, sure, we need a bridge premise. But that doesn't mean the facts about suffering are irrelevant to the truth of the conclusion."

  **2. Grant the Logic, Challenge the Implication**
  > "If the point is just that we need a normative premise, I agree. Let's add one: 'Unnecessary suffering is wrong.' Now the argument is valid. Does your objection still hold? If so, you aren't making a logical point anymore; you're claiming that premise is unjustified by facts. That's a much bigger claim than the slogan suggests."

  **3. Address the "Open Question" Intuition**
  > "It feels like there's a gap because we can imagine someone knowing the facts and not caring (the psychological reading). But whether someone *cares* isn't the same as whether the act *is* wrong. The slogan mixes up motivation with justification."

  **4. The "Jobs" Metaphor**
  > "The professor mentioned the slogan does 'several jobs at once.' I think it's doing the job of a logical reminder (which is true but easy to fix) and the job of a meta-ethical shield (which blocks the argument but is controversial). We shouldn't let the truth of the logical job protect the controversial meta-ethical job."

  **Summary for your notes:**
  *   **Classmate's likely meaning:** She probably intends the **Logical Reading** (because it's safe) but wants the **Epistemological payoff** (blocking the conclusion).
  *   **Your counter:** Grant the logic (add the bridge premise) to expose that the real disagreement is about the bridge premise itself, not the logic.
  *   **Key distinction:** Hume = Logic of arguments; Moore = Meaning of words. The factory farming argument is vulnerable to neither if formulated carefully.

  This approach shows you understand the technical philosophy while keeping the discussion focused on the actual ethical issue (the animals), rather than getting stuck in a semantic loop.
