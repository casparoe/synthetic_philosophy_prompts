answer: |-
  ### The mapping

  In your colleague's analogy, the **territory** is the mind-independent world (facts, objects, states of affairs). The **map** is the belief or proposition held by the agent. The **scale and projection system** represent the conceptual scheme or logical form structuring the belief—how reality is carved up. A **blank region** on the map corresponds to areas of ignorance or propositions lacking doxastic attitude. Finally, **map accuracy** is assigned the role of truth. The core claim is that just as accuracy requires a physical structural isomorphism between ink and terrain, truth requires a metaphysical structural relation between belief and world. This sets up truth as a robust, explanatory property rather than a logical tool. Each element must align perfectly for the analogy to hold water.

  ### Where it breaks

  The analogy fractures primarily on parochialism. As you noted, a hiking map and a driving map of the same region differ radically in structure and content without contradicting each other. One highlights contours; the other, pavement. Both are "accurate" relative to specific purposes. If truth works like map accuracy, then truth becomes purpose-relative. But deflationists (and most correspondence theorists) hold that the proposition "Snow is white" is true regardless of whether you are skiing or driving. The analogy conflates *representational utility* with *truth*. A map is good for navigating; a belief is true regardless of its utility.

  Moreover, the colleague claims maps show a "single genuine structural relation." But the hiking map uses isolines; the driving map uses vectors. There is no single isomorphism between map and territory, only various useful transformations. If truth is like this, there is no single "Truth Relation," undermining the robust realist metaphysics she wants to defend. She wants truth to be a natural kind; the analogy shows it's a pragmatic tool. This creates a dilemma: either truth is plural (like maps), which complicates her realism, or the analogy fails to capture truth's uniqueness. Consequently, the map analogy supports pluralism about representation, not monism about truth.

  Additionally, maps admit degrees of accuracy; a map can be 90% correct. Truth is traditionally bivalent. While some argue for degrees of truth, the deflationist schema ("P" is true iff P) resists this gradation. You cannot be "iff-ish." Additionally, map accuracy is explained by causal history and convention (cartographers drew it so). Deflationists argue truth isn't explained by a relation; it is dissolved into the proposition itself. The map analogy suggests we need a theory of *how* the belief hooks onto the world (a causal theory of reference). Deflationism denies this hook needs metaphysical grease. The map requires an interpreter to read the symbols; a true belief's truth conditions do not depend on being interpreted. By treating truth as a structural fit, the analogy forces a substantive theory of representation where deflationism sees only logical equivalence. The hiking/driving discrepancy shows that structural fit is pluralistic, whereas truth is supposed to be unique. Finally, consider the blank region. On a map, ignorance is a lack of ink. In deflationism, lacking a belief isn't the same as the proposition lacking a truth value. The map analogy reifies ignorance as a spatial gap, whereas truth-value gaps are logical issues, not cartographic ones.

  ### What it smuggles in

  The analogy smuggles in substantive metaphysics that deflationism explicitly rejects. It treats truth as a *natural property* with a causal role. Deflationists argue 'true' is not a descriptive property like 'mass' but a logical device for endorsement. By insisting on a structural relation, the analogy presupposes that representation requires isomorphism. Deflationists deny this; language represents not because it mirrors the world's structure, but because of usage conventions. The map analogy also implies that truth is prior to assertion—that we check the map against the world. Deflationism holds that asserting "P" and asserting "P is true" are identical in content. The analogy makes truth look like a heavyweight relation rather than a lightweight tool. It begs the question against deflationism by assuming truth must be a 'something' rather than a 'doing'.

  ### Verdict

  The argument does not survive. The map analogy explains representation, not truth. A deflationist can accept maps are useful structural representations without conceding truth is a structural relation. They agree beliefs map the world but deny true adds metaphysical weight. Once map parochialism and structural pluralism are exposed, the analogy loses force. It demonstrates why beliefs are useful, not why truth is robust. The deflationist accepts maps but rejects the metaphysical baggage attached to accuracy. Truth remains a logical device, not a cartographic feature.
