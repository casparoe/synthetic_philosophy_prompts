answer: |-
  # Moral Conflicts: A Decision Tree

  **Starting Point:** Imagine you have serious moral reason to do **A** and serious moral reason to do **B**, but you literally cannot do both.
  **Case:** You promised a dying friend you would use their savings ($5,000) to fund their child's tuition (**A**). On the way to the bank, you meet a stranger who will die without a $5,000 surgery (**B**). You cannot do both.

  ---

  ### Node 1: The "Ought Implies Can" Check
  **Question:** Since it is physically impossible to do both A and B, does that prove you were never truly *obligated* to do both?
  *   **Yes:** (If you can't do it, you weren't obliged to do it). → **Go to Node 2.**
  *   **No:** (You were obliged to do both, even if impossible). → **Go to Node 4.**

  ---

  ### Node 2: The Source of Resolution
  **Question:** You were only obligated to do one thing. Why did the other obligation vanish?
  *   **A:** "Because one *type* of duty always trumps the other (e.g., Saving Life > Keeping Promises)." → **LEAF: Lexical Priority**
  *   **B:** "Because only the option that produces the *best outcome* creates an obligation." → **Go to Node 3.**

  ---

  ### Node 3: The ICU Permissivism Check
  **Case:** Two ICU patients need the last ventilator. They are identical in age, health, prognosis, and social impact. The doctor flips a coin.
  **Question:** Was there a moral fact about which patient *should* have gotten the ventilator (even if we can't know it), or was the coin flip morally perfect?
  *   **Fact Exists:** (One was truly the right choice; the coin just helped us guess). → **LEAF: Consequentialist Dissolution**
  *   **No Fact:** (Either choice was fully permissible; morality runs out of instructions). → **LEAF: Permissivist Indeterminacy**

  ---

  ### Node 4: The Agglomeration Check
  **Question:** If you are obligated to do A and obligated to do B, does it logically follow that you are obligated to do **(A and B)**?
  *   **Yes:** (You are obligated to do the impossible conjunction). → **Go to Node 5.**
  *   **No:** (Obligations remain separate; you need not do the impossible pair). → **Go to Node 6.**

  ---

  ### Node 5: The Logic vs. Substance Check
  **Question:** You say we are obligated to do the impossible (A and B). Is this because logic demands it, or because morality is tragic?
  *   **Logic:** ("Ought" aggregates automatically; the impossibility is just a physical hurdle). → **LEAF: Paradoxical / Dirty Hands**
  *   **Substance:** ("Ought" aggregates because the moral demand itself is contradictory). → **LEAF: Paradoxical / Dirty Hands**
      *(Note: For this handout, both paths lead to the same view: you are doomed to violate an obligation.)*

  ---

  ### Node 6: The Remainder Check
  **Case:** Sartre's Student. During the occupation, a student must choose between fleeing to join the Free Resistance (**A**) or staying home to care for his dependent mother (**B**). He chooses **A**. His mother suffers. He feels deep guilt.
  **Question:** Is his lingering guilt *fitting* (it tracks a real moral loss), or is it a *mistake* (he did the right thing, period)?
  *   **Fitting:** (He did the best thing all-things-considered, but still wronged his mother). → **LEAF: Ross-Style Pluralism**
  *   **Mistake:** (He did the right thing; the guilt is just psychological noise). → **LEAF: Resolved Conflict (No Remainder)**

  ---

  ## The Leaves: Positions & Awkward Commitments

  **1. Lexical Priority**
  *   **View:** Conflicts are illusions; one duty type (e.g., Justice) always overrides another (e.g., Prudence).
  *   **Awkward Commitment:** You weren't actually obligated to keep that promise the moment a life was at stake, even if you promised before you knew.

  **2. Consequentialist Dissolution**
  *   **View:** There is always one right answer (maximize good); apparent conflicts are just uncertainty about outcomes.
  *   **Awkward Commitment:** Your guilt over the "road not taken" is just a bug in your psychology, not a feature of the moral world.

  **3. Permissivist Indeterminacy**
  *   **View:** Morality sometimes allows multiple right options with no deeper fact about which is better.
  *   **Awkward Commitment:** Morality sometimes runs out of instructions even when everything is known, leaving choice to chance.

  **4. Paradoxical / Dirty Hands**
  *   **View:** Genuine dilemmas exist where you violate an all-things-considered duty no matter what you do.
  *   **Awkward Commitment:** You are morally required to do something that you literally cannot do.

  **5. Ross-Style Pluralism**
  *   **View:** Multiple *prima facie* duties exist; one becomes actual, but the sacrificed duty leaves a moral "remainder."
  *   **Awkward Commitment:** You did the right thing, but you still did something wrong.

  **6. Resolved Conflict (No Remainder)**
  *   **View:** Conflicts are real, but once resolved, the forgone option leaves no moral trace.
  *   **Awkward Commitment:** You had a serious obligation to do X, but doing the right thing (Y) makes that obligation vanish without a trace.

  ---

  ## Instructor's Analysis: Empty Nodes & Blind Spots

  ### 1. Unoccupied Combinations
  *   **OIC "Yes" + Agglomeration "Yes":** *Incoherent.* If "Ought Implies Can" is true (Node 1 = Yes), you cannot be obligated to the impossible conjunction (A & B). Students who select this usually haven't grasped the definition of Agglomeration.
  *   **OIC "No" + Remainder "Mistake":** *Unattractive.* This path (Node 6, "Mistake") suggests you had two genuine obligations, couldn't do both, didn't do the impossible pair, yet feel no guilt. This collapses into the Consequentialist view but retains the confusing claim that impossible obligations exist. It is theoretically possible but rarely defended.
  *   **Agglomeration "Logic" vs. "Substance":** *Unexplored.* In Node 5, almost all students who accept Agglomeration do so for substantive reasons (Dirty Hands). Those who reject it do so for logical reasons (OIC). A student who rejects Agglomeration for *substantive* moral reasons (e.g., "Moral reasons don't add up") without relying on OIC is a rare philosophical species, though some particularists might fit here.

  ### 2. Indistinguishable Positions (Where the Tree Lies)
  *   **Epistemic vs. Ontological Dilemmas (Node 3):** The tree separates "Fact Exists" (Consequentialist) from "No Fact" (Permissivist). However, in practice, these look identical. A Consequentialist says "There is a fact, but it's unknowable." A Permissivist says "There is no fact." Since neither can point to the fact, the student's behavior and advice will be the same. The tree forces a metaphysical distinction that has no practical output in the ICU case.
  *   **Ross vs. Dirty Hands (Node 6 vs. Leaf 4):** Both views predict the agent feels guilt. The tree distinguishes them based on whether an *all-things-considered* duty was violated. But from the outside, "Violating a *prima facie* duty with fitting guilt" (Ross) and "Violating an *all-things-considered* duty with fitting guilt" (Dirty Hands) feel the same to the agent. The tree separates them theoretically, but a student's intuition about "fitting guilt" might not be sharp enough to reliably sort them.
  *   **Lexical vs. Consequentialist (Node 2):** Both end up saying "Only one obligation existed." The tree asks *why* (Duty Type vs. Outcome). However, in many hard cases, the "Duty Type" that trumps is determined by the outcome (e.g., Life trumps Promise *because* life is more valuable). Students may struggle to separate the *source* of the priority from the *result* of the priority.
