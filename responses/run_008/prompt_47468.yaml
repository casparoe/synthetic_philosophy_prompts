answer: |-
  You're conflating the complexity of a system with the universality of its laws. Weather is chaotic, yes, but it obeys timeless fluid dynamics; a storm in 1800 behaves like a storm in 2024 because air pressure doesn't read the newspaper. Human history does not obey timeless laws because the actors within the system learn and change the rules based on the very knowledge you claim produces the prediction. This is the Oedipus Effect: if Turchin's model becomes influential enough, policymakers might mitigate inequality to prevent the unrest, thereby falsifying the model not because it was wrong, but because it was known. That isn't science; that's a self-defeating prophecy. As for Turchin's 2010 "hit," predicting "rising instability" over a decade is akin to an astrologer predicting "emotional turbulence" during Mercury retrograde—it's vague enough to be unfalsifiable. Popper wasn't arguing against statistics; he was arguing against the belief that historical trends are inevitable laws. You can have data, you can have correlations, but until you can isolate variables in a way that isn't contaminated by the growth of human knowledge itself, you don't have laws of history. You just have storytelling with error bars.
