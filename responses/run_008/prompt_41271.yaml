prompt: |-
  so I do adversarial robustness research (evasion attacks on classifiers, that kinda thing) and I keep running into papers about LLM "manipulation" where the authors argue about whether a model is persuading the user or manipulating them. apparently there's a whole ethics literature on manipulation vs legitimate persuasion, but I've never read it and i'm not going to. Translate the main positions in that literature into the vocab I actually use: threat models, attack surface, in-distribution vs out-of-distribution inputs, exploiting a bug vs using an intended interface, perturbation budgets, spec vs implementation. As faithful as you can. Then give me the residue report: which parts of the philosophical debate map onto "it's a bug, not a feature" style distinctions, which parts had to be distorted to fit my vocabulary, and what has no counterpart at all in it.

  The thing I actually want to know: my instinct says "manipulation" just means exploiting a vulnerability in the human's decision procedure, where "vulnerability" means some deviation from a spec, and the real fight in that literature is over who gets to write the spec — same as every argument we have about whether something is an attack or a legitimate use of the interface. Is that a decent compression of the field, or am I missing something that the robustness frame structurally cannot say? If it's the latter, tell me what the residue is pointing at.
