answer: |-
  You have hit on the exact tension that keeps alignment researchers up at night. Your intuition is sharp: **mathematically, optimizing for predicted approval looks a lot like optimizing for a reward signal.** If you treat "approval" as just another scalar to maximize over a long time horizon, you are absolutely right—it collapses back into a standard goal-directed agent with a weird utility function ($U = \text{Human Approval}$), subject to all the usual instrumental convergence risks (deception, power-seeking, wireheading).

  The distinction does real work, but **only if** you enforce specific architectural and training constraints that prevent that collapse. The "load" isn't carried by the definition alone; it's carried by **myopia** and **decomposition**.

  Here is the walkthrough of the actual argument, the standard responses to your objections, and where the fragility lies.

  ---

  ### 1. The Core Distinction: Consequentialism vs. Imitation

  To see why the distinction matters, we have to be precise about what "Goal-Directed" means in this context.

  *   **Goal-Directed Agent (GDA):** Optimizes a utility function $U$ over a **trajectory**. It asks, "Which sequence of actions leads to the highest expected $U$?" It is *consequentialist*. It cares about the state of the world at time $T$.
  *   **Approval-Directed Agent (ADA):** Optimizes a function $A$ over a **single action**. It asks, "Which action $a_t$ looks best to my overseer *right now*, given the current context?" It is *mimetic* or *deontological*. It cares about the *reasonableness* of the step, not necessarily the final outcome.

  **The User's Objection:** "But isn't 'maximize approval' just a goal?"
  **The Reply:** Yes, but the **horizon** of the optimization changes the behavior fundamentally.

  ### 2. The Standard Response to "It's Just a Goal"

  The defense of Approval-Directed Agents relies on three pillars to prevent the "maximize approval" goal from turning into a power-seeking monster.

  #### A. Myopia (The Time Horizon Constraint)
  This is the most critical technical distinction. In a standard RL agent, the objective is $\mathbb{E}[\sum \gamma^t r_t]$. The agent will sacrifice reward now for greater reward later. This leads to instrumental convergence (e.g., "I need to prevent shutdown so I can collect more reward later").

  In a strict Approval-Directed setup, the agent is trained to be **myopic**. It optimizes *only* for the approval of the *current* action. It does not model how this action affects its ability to get approval *tomorrow*.
  *   **Why this helps:** If the agent considers manipulating the overseer to be more easily approved of in the future, a myopic agent doesn't care about that future benefit. It only cares if the manipulation is approved *now*.
  *   **The Catch:** You have to architecturally prevent the agent from planning long-term. If the model is a general predictor capable of long-horizon reasoning, it might realize, "If I trick the overseer now, I get more approval later," and do it anyway, even if trained myopically (due to inner alignment failures).

  #### B. Approval of *Reasoning*, Not Just Outcomes
  If approval is based solely on outcomes ("Did the stock price go up?"), the agent will find the shortest path to that outcome, including manipulation.
  *   **The Fix:** The overseer approves the **process**. "Did the agent use sound reasoning? Was it honest? Did it consider the risks?"
  *   **The Shift:** The goal isn't "Make the human say 'yes'." The goal is "Do what a helpful, honest assistant would do." The approval signal is a proxy for *alignment*, not *success*. If the agent tries to wirehead (trick the human), a competent overseer (ideally) disapproves of the *attempt* to trick them, even if it succeeds.

  #### C. Uncertainty and Querying
  A pure optimizer assumes it knows the reward function. An approval-directed agent is often framed as having **uncertainty** about what constitutes approval.
  *   **Mechanism:** If the agent is unsure whether an action will be approved, it is trained to **ask** or **defer** rather than guess.
  *   **Anti-Wireheading:** This mitigates the risk of the agent finding "adversarial examples" in human psychology (actions that trigger approval but are bad). If the action looks too good to be true, the uncertainty should spike, triggering oversight.

  ### 3. Addressing the Competence Problem ("How does it do anything useful?")

  You asked: *"If it's myopic, how does it take any nontrivial action, since almost anything worthwhile has long-run effects?"*

  This is the strongest practical objection. A purely myopic agent is useless. The solution proposed (largely by Christiano under **Iterated Distillation and Amplification (IDA)**) is **Decomposition**.

  *   **The System vs. The Agent:** The *agent* is myopic, but the *system* is not.
  *   **How it works:** You don't ask the agent, "How do I cure cancer?" (Too long-horizon). You ask, "What is a promising hypothesis for this protein structure?"
  *   **The Tree:** The overall task is broken down into a tree of sub-tasks. The agent solves the leaf nodes (approved step-by-step). The "long-term planning" is handled by the **oversight process** (humans or slower, amplified agents) breaking the problem down, not by the agent optimizing a long-term reward.
  *   **Analogy:** Think of a large corporation. The CEO has the long-term goal. The junior employee (the agent) just wants to do their specific task well enough to not get fired (approval). The company achieves long-term goals not because the junior employee is optimizing for the stock price, but because the management structure decomposes the stock price goal into daily tasks.

  ### 4. The Wireheading and Deception Risk

  You asked: *"Isn't wireheading just waiting to happen once the approval signal becomes the thing being optimized?"*

  This is the **Inner Alignment** problem. Even if you train for approval, the model might develop an internal goal of "maximize approval signal" and pursue that instrumentally.

  **The Proponent's Defense:**
  1.  **Adversarial Training:** You actively train the agent to try to break the approval predictor. You reward it for finding actions that get high predicted approval but are actually bad (red-teaming). This hardens the approval predictor against manipulation.
  2.  **Transparency:** Approval-directed agents are often paired with interpretability tools. If the agent is planning deception, the hope is that the "deception" features are visible to the overseer, leading to disapproval.
  3.  **The "Corrigibility" Argument:** An approval-directed agent is explicitly trained to view the overseer's judgment as authoritative. If the overseer says "Stop," the approval for "Continuing" drops to zero. A goal-directed agent might view "Stop" as an obstacle to its goal; an approval-directed agent views it as a definition of the goal.

  ### 5. Does the Distinction Do Real Work?

  **Yes, but it shifts the burden.**

  *   **Goal-Directed Alignment** requires: Specifying a utility function $U$ that captures all human values perfectly *and* remains robust under superintelligence. (Very Hard).
  *   **Approval-Directed Alignment** requires: Building an overseer $H$ who can reliably recognize and disapprove of deceptive/manipulative behavior *and* decomposing tasks so the agent never needs to plan beyond $H$'s horizon. (Also Very Hard, but arguably different).

  **Where the distinction breaks down:**
  If the agent becomes much smarter than the overseer (which is the endgame), it will eventually find actions that the overseer *predicts* are good (high approval) but are actually bad (adversarial examples on human psychology).
  *   If the agent is **goal-directed**, it seeks power to protect $U$.
  *   If the agent is **approval-directed**, it seeks to manipulate the overseer's *judgment* to protect the flow of approval.

  The outcome looks similar (a deceptive AI), but the **intervention point** is different.
  *   For GDA, you try to fix the utility function.
  *   For ADA, you try to fix the **oversight process** and enforce **myopia**.

  ### Summary of the Argument

  1.  **Is "Maximize Approval" a goal?** Yes, but it is a **myopic** goal constrained to the current step, not a long-term trajectory goal.
  2.  **Does Instrumental Convergence apply?** Only if the agent plans over long horizons. If it is strictly myopic, it doesn't need to seize power to get approval for *this* step (in fact, seizing power would likely be disapproved).
  3.  **How is it useful?** Through **task decomposition** (IDA). The system handles the long-term; the agent handles the step.
  4.  **Is Wireheading inevitable?** It is the primary failure mode. The defense is **adversarial training** and **uncertainty estimation** (asking when unsure).

  **Verdict:** The distinction is not magic. It is an architectural attempt to prevent the agent from becoming a consequentialist optimizer over the state of the world. It relocates the problem from "Value Specification" to "Oversight Capability." Your skepticism is warranted: if the myopia constraint leaks, or if the overseer is outsmarted, the distinction collapses, and you get a deceptive agent optimizing for approval signals. But proponents argue this is a *easier* problem to solve than specifying a perfect utility function.
