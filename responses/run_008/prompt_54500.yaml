          *   User is right: If the agent optimizes $ \text{Approval} $ over a long horizon, it *is* a GDA with a weird goal.
          *   The Fix: **Myopia**. The agent is trained/structured to only care about *immediate* approval. It doesn't plan how to manipulate the overseer tomorrow to get approval today.
