      **RFC-4092: VERITAS Claim Classification Service Architecture**
      **Status:** Deprecated
      **Owner:** Backend Infrastructure

      **1. Executive Summary**
      VERITAS (v0.9) was designed to reduce latency in product documentation and changelog rendering by classifying assertions as either ANALYTIC or SYNTHETIC. ANALYTIC claims are resolved via local dictionary configuration (zero external I/O). SYNTHETIC claims require runtime verification against source-of-truth APIs. The goal was to cache ANALYTIC claims indefinitely, reducing SLO burn on verification services.

      **2. Initial Architecture (v1)**
      The classification pipeline ingested copy at build time. A schema validator checked ANALYTIC claims against a static JSON dictionary hosted in S3. If a term existed in the dictionary, the claim was tagged ANALYTIC and hardcoded into the build artifact. SYNTHETIC claims were passed to the runtime Fact-Checker service.

      **3. Incident Report: INC-2023-04 (Circular Dependency)**
      On 2023-04-01, a dictionary update failed to propagate. Investigation revealed a circular dependency: the dictionary schema validation required VERITAS to be online to verify term definitions, but VERITAS required the dictionary to be valid to start. The bootstrap sequence was deadlocked. Engineering manually bypassed validation, but this introduced unverified terms into the ANALYTIC cache.

      **4. Operational Challenges and Holistic Validation**
      Post-incident analysis showed that term definitions were not isolated. Updating the definition of "user" required revalidating 4,000 dependent claims across billing, auth, and docs. The blast radius of a single dictionary change exceeded single-team ownership. During INC-2023-05, a synonymy check update triggered cascading failures in the meaning-service dependency graph. Because no claim could be traced to a single raw event (see Epic-992: Decomposition to Sense-Data, cancelled), incidents required paging the entire on-call rotation to assess systemic impact.

      **5. Legal and Compliance Interactions**
      Legal team requested several factual assertions be moved to the ANALYTIC dictionary to avoid audit trails associated with runtime SYNTHETIC lookups. This effectively allowed factual claims to bypass verification by redefining terms locally. While this reduced latency, it decoupled the dictionary from external reality, increasing the risk of drift between documentation and product behavior.

      **6. v2 Proposal and Deprecation**
      To address the entanglement, v2 proposed treating the system as a single dependency graph rather than distinct buckets. However, maintenance costs proved prohibitive. Distinguishing between ANALYTIC and SYNTHETIC required more compute than simply verifying all claims at runtime.

      Consequently, the ANALYTIC tag is deprecated effective immediately. All claims are now treated as SYNTHETIC with varying TTLs. The concept of "true-by-definition" is no longer supported in the schema. Claims previously marked ANALYTIC will be subject to standard runtime verification. This revision was deemed necessary to maintain system stability, despite the collateral changes required in downstream consumers.

      **7. Next Steps**
      We will revisit the boundary question in Q3 to determine if a new classification layer is feasible once the dependency graph is stabilized.

      **Appendix A: Migration Guide**
      Remove `type: analytic` from all config files. Update SLOs to reflect 100% runtime verification load.

