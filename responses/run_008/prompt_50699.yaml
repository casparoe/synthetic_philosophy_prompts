      **2. Initial Architecture (v1)**
      The classification pipeline ingested copy at build time. A schema validator checked ANALYTIC claims against a static JSON dictionary hosted in S3. If a term existed in the dictionary, the claim was tagged ANALYTIC and hardcoded into the build artifact. SYNTHETIC claims were passed to the runtime Fact-Checker service. This boundary was intended to be strict: definitions never change at runtime; only data changes.

      **3. Incident Report: INC-2023-04 (Circular Dependency)**
      On 2023-04-01, a dictionary update failed to propagate. Investigation revealed a critical circular dependency: the dictionary schema validation required VERITAS to be online to verify term definitions, but VERITAS required the dictionary to be valid to start. The bootstrap sequence was deadlocked. Engineering manually bypassed validation, but this introduced unverified terms into the ANALYTIC cache. Further audit showed the "meaning" service used to resolve synonymy during validation depended on VERITAS tags to route requests, creating a loop where definitions validated definitions without external reference.

      **4. Operational Challenges and Holistic Validation**
      Post-incident analysis demonstrated that term definitions were not isolated units. Updating the definition of "active user" required revalidating 4,000 dependent claims across billing, auth, and docs. The blast radius of a single dictionary change exceeded single-team ownership. During INC-2023-05, a synonymy check update triggered cascading failures in the dependency graph. Because the epic to decompose every claim into raw experience events (Epic-992) was cancelled mid-quarter due to complexity, no single claim could be traced to a clean sense-datum event. Consequently, incidents required paging the entire on-call rotation to assess systemic impact, as changing any node risked invalidating the entire corporate body of statements.

      **5. Legal and Compliance Interactions**
      Legal team requested several factual assertions be moved to the ANALYTIC dictionary to avoid audit trails associated with runtime SYNTHETIC lookups. This effectively allowed factual claims to bypass verification by redefining terms locally. While this reduced latency, it decoupled the dictionary from external reality, increasing the risk of drift between documentation and product behavior. The boundary between definition and fact became purely pragmatic based on cost centers rather than semantic truth.

      **6. v2 Proposal and Deprecation**
      To address the entanglement, v2 proposed treating the system as a single dependency graph rather than distinct buckets. However, maintenance costs proved prohibitive. Distinguishing between ANALYTIC and SYNTHETIC required more compute than simply verifying all claims at runtime. The overhead of maintaining the distinction outweighed the latency benefits.

      Consequently, the ANALYTIC tag is deprecated effective immediately. All claims are now treated as SYNTHETIC with varying TTLs. The concept of "true-by-definition" is no longer supported in the schema. Claims previously marked ANALYTIC will be subject to standard runtime verification. This revision was deemed necessary to maintain system stability, despite the collateral changes required in downstream consumers. We accept that even core logical definitions are revisable if the cost of preservation threatens the system.

      **7. Next Steps**
      We will revisit the boundary question in Q3 to determine if a new classification layer is feasible once the dependency graph is stabilized.

      **Appendix A: Migration Guide**
      Remove `type: analytic` from all config files. Update SLOs to reflect 100% runtime verification load. Expect increased latency budget consumption.

