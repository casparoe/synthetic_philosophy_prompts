answer: |-
  ### Part 1: Candidate Structures & Selection

  Here are three ways to skin this cat. I've run variations of all of them; here is why I'm steering you toward the third.

  **Candidate 1: The Blind vs. Named Auction**
  *   **Structure:** Students create art. Round 1: Auction items anonymously (Lot #1, #2...). Round 2: Auction the same items with artist names attached.
  *   **Pros:** Clean data. Clearly shows price variance based on identity.
  *   **Cons:** It tests *reputation* ("I know Sarah is a better artist") more than *provenance* ("This is the physical object Sarah touched"). It doesn't capture the "perfect copy" intuition because the items are distinct.

  **Candidate 2: The "Insurance" Gamble**
  *   **Structure:** Students buy art. They are told some are copies. They can buy "insurance" that pays out if their item is revealed to be a copy.
  *   **Pros:** Quantifies doubt. High tension.
  *   **Cons:** Turns the session into a probability game. Students focus on risk assessment, not ontological value. It feels like poker, not philosophy.

  **Candidate 3: The "Dealer's Offer" (Selected)**
  *   **Structure:** Students create work. A subset is duplicated (visually indistinguishable). A market opens where students bid on *each other's* work (blind). Winners receive the object. Then, the "Dealer" (you) approaches owners with a private offer: *Swap this object for its twin plus a cash bonus.* Finally, provenance is revealed.
  *   **Why this one:** It isolates the variables.
      1.  **Blind Bidding** establishes baseline aesthetic value (perceivable qualities).
      2.  **The Swap** tests the value of the *specific history* of the object against immediate gain.
      3.  **The Reveal** explains the price gap.
      4.  Crucially, by making them bid on *classmates'* work, you bypass the "I made this so it's special" sentimentality confound until the Swap phase, where that sentimentality becomes part of the data rather than noise.

  ---

  ### Part 2: Full Workshop Design

  **Title:** The Provenance Game
  **Time:** 75 Minutes
  **Participants:** 16 Students
  **Goal:** Experiential discovery of the distinction between *perceivable properties* and *causal history* in valuation.

  #### Materials List
  *   **Paper:** 40 sheets of identical heavy cardstock (cut to postcard size, approx. 5x7).
  *   **Pens:** 16 identical black fine-liner markers (no pencils, no erasers).
  *   **Currency:** 160 "Philosophy Bucks" (PB) – printed slips or poker chips. (Start with 10 PB per student).
  *   **Envelopes:** 8 large manila envelopes (to seal the "Master" works during copying).
  *   **The "Light Box":** A tablet with a white screen at max brightness, or access to a bright window.
  *   **Trophy:** One physical object of negligible value but high status (e.g., a golden spray-painted stapler, "The Authenticator").
  *   **Whiteboard:** Divided into "Market Prices" and "Swap Decisions."

  #### Timeline (75 Minutes)

  **0:00 – 0:10 | Setup & Creation (The "Aura")**
  *   Hand out 2 cards and 1 pen to each student.
  *   **Instruction:** "Draw a unique 'Sigil'—an abstract symbol that represents 'Value' to you. No words. 5 minutes. You must sign the back of *one* card (the Original). Leave the other blank (the Backup)."
  *   *Facilitator Move:* Collect the "Originals" (signed backs) in a box. Keep the "Backups" in the room.
  *   **The Trick:** Select 4 Sigils at random. While the class counts their token endowments (filler task), take those 4 Originals to a corner (or step out). Use the tablet/window method to trace them onto the blank "Backup" cards *perfectly*. Sign the backs of the *Originals* with a specific mark (e.g., a star) that you will remember, but do not let students see this mark.
  *   *Note:* If tracing is too risky, use a high-speed copier nearby. The goal is visual indistinguishability.
  *   Return the 4 Originals and 4 Copies to the pool. You now have 8 items in play (4 pairs). The other 12 student works are "Archived" (returned to owners, not for sale).

  **0:10 – 0:30 | The Blind Market**
  *   **Rule:** You cannot bid on your own work.
  *   Place the 8 items (4 pairs) on a table. They are labeled Lot A-H. No names attached.
  *   **Auction:** Sell the 8 lots one by one. Open bidding. Record the final price on the whiteboard.
  *   *Facilitator Note:* If bidding is sluggish, you act as a "Shill Bidder" to drive up interest.
  *   **Result:** You will likely see similar prices for twins (e.g., Lot A and Lot E look identical and sell for similar amounts).

  **0:30 – 0:45 | The Dealer's Offer (The Swap)**
  *   Owners sit with their purchased lots.
  *   **Instruction:** "I am the Dealer. I value the *history* of these pieces. I am offering a trade."
  *   Approach each owner privately (or pass sealed envelopes).
  *   **The Offer:** "I will give you 5 Bonus PB + The *Twin* of your item, in exchange for the item you currently hold."
  *   *Crucial Detail:* If they hold an Original, the twin is a Copy. If they hold a Copy, the twin is an Original. They don't know which they have.
  *   **Decision:** They must choose: KEEP or SWAP. Record decisions on the board anonymously (e.g., Lot A: Keep, Lot B: Swap).

  **0:45 – 0:55 | The Revelation**
  *   Reveal the provenance. "Lot A was an Original. Lot E was its Copy."
  *   Reveal the Swap outcomes. "Who swapped an Original for a Copy + Cash? Who kept a Copy when they could have had the Original?"
  *   Distribute the "Authenticator" trophy to the student who made the most "philosophically consistent" choice (you decide the criteria, or let them vote).

  **0:55 – 1:15 | Debrief (See Script Below)**

  #### Payoff Scheme
  *   **Tokens:** 10 PB start. Auction spends them. Swap earns 5 PB.
  *   **Redemption:** At the end, 1 PB = 1 piece of candy.
  *   **The Sting:** The "Authenticator" trophy stays in the classroom for the semester. The owner gets to keep it on their desk during future sessions. This creates social capital without cost.

  ---

  ### Part 3: Debrief Script & Philosophical Mapping

  *Facilitator Note: Do not lecture. Ask questions. Write their answers on the board. Only introduce terminology after they have described the phenomenon.*

  **Phase 1: The Market Gap (Perceivable vs. Historical)**
  *   **Q:** "Look at Lot A and Lot E. Visually, they were identical. Did they sell for the exact same price?"
  *   **Likely Answer:** "Roughly, yes."
  *   **Q:** "So, in the Blind Round, value was based on what?"
  *   **Target Concept:** Perceivable properties (aesthetic quality).
  *   **Q:** "Now look at the Swap. I offered you cash + the Twin. Some of you refused the cash to keep the object you had. Why? You couldn't see a difference."
  *   **Target Concept:** You were betting on *history*. You wanted the object with the specific causal chain (the one the artist touched).
  *   **Term Drop:** "In philosophy, we call this **Provenance**. It's the biography of the object."

  **Phase 2: Autographic vs. Allographic (Goodman)**
  *   **Q:** "If I asked you to write a poem, and I copied it perfectly, does my copy have less value than your paper?"
  *   **Likely Answer:** "No, the words are the same."
  *   **Q:** "But with the drawings, many of you acted like the paper I touched was special. Why the difference?"
  *   **Term Drop:** "Nelson Goodman called this the **Autographic/Allographic** distinction.
      *   **Allographic (Poems/Music):** The work is defined by the *script*. A perfect copy *is* the work.
      *   **Autographic (Painting/Doodles):** The work is defined by the *history of production*. A perfect copy is a *different* work (a forgery)."
  *   **Check:** "Did anyone feel that knowing one was a copy *ruined* the look of it, even if it looked the same?" (This touches on aesthetic contamination).

  **Phase 3: Settled vs. Contested (Crucial Nuance)**
  *   **Facilitator Script:** "I need to be honest about where philosophers agree and where they fight."
  *   **Settled:** "Everyone agrees the *market price* differs. Everyone agrees the *historical facts* differ. No one denies the Original has a unique causal history."
  *   **Contested:** "Does the forgery have less *aesthetic value*?
      *   **View A (The Purist):** If they look identical, the aesthetic experience is identical. The history is external trivia.
      *   **View B (The Contextualist):** Art is a form of communication. A forgery is a lie. Knowing it's a lie changes the experience, just like knowing a friend is lying changes the sound of their voice.
      *   **View C (Goodman's View):** The knowledge changes how we *look*. We look for differences. Even if we don't find them, the *possibility* changes the category."
  *   **Closing Question:** "If I told you the 'Copy' was actually made by the artist 10 years later as a replica, would that change its value? Why?" (This probes if it's the *hand* or the *time* that matters).

  ---

  ### Part 4: What Will Predictably Go Wrong (And Fixes)

  **1. The "I Don't Care" Bid (Flat Market)**
  *   **Risk:** Students bid 1 PB on everything because they don't value classmates' doodles.
  *   **Fix:** **Seed the Market.** You (the facilitator) participate with a stash of tokens. Bid aggressively on the first item to set a high anchor price. Say aloud: "I really like the line weight on this one." Social proof drives value.

  **2. The "Strategic Nihilist"**
  *   **Risk:** A student says, "I'll take the Copy + Cash every time. Art is a construct."
  *   **Fix:** **Validate, then Isolate.** "That's a valid philosophical stance (Idealism). But did you *feel* a hesitation? If you were buying this to hang in your home, would you tell guests it's a copy?" Move the debate from *market strategy* to *personal attachment*.

  **3. The Sentimentality Confound (The Big One)**
  *   **Risk:** A student refuses to swap because "I made this," not because it's an "Original." This confuses *creator attachment* with *provenance value*.
  *   **Fix:** **The "Archivist" Frame.** In the Swap instructions, say: "The Museum wants to preserve the *Original* in a climate-controlled vault. You can keep the *Display Copy* plus cash, or give us the Copy and keep the *Original*."
      *   If they keep the Original, ask: "Is it because you made it, or because it's the Original?"
      *   *Better Fix:* Ensure the Blind Auction is primarily on **other people's work**. The Swap is the only moment they hold their own. If they bid high on *another* student's Original in Round 1, that proves they value provenance independent of sentimentality. Highlight this data point in debrief.

  **4. The Copy Isn't Perfect**
  *   **Risk:** "I can see the photocopy toner sheen."
  *   **Fix:** **Acknowledge the Imperfection.** "In the real world, experts use microscopes. In this room, we have to trust the premise. For the sake of the argument, assume they are perceptually identical. If you were blindfolded, could you tell?"

  ---

  ### Part 5: What This Activity Cannot Do (The Limitation Note)

  You asked for a frank note on the simulation's limits. Here is the gap you must fill verbally:

  **The "Betrayal Shock" is Missing.**
  In real forgery cases (e.g., Han van Meegeren forging Vermeers), the pain comes from *retrospective humiliation*. You loved the work for years, then found out you were duped. The value collapses *after* acquisition.
  In this game, students know copies exist *before* they buy. They are buying a "lottery ticket" of authenticity.
  *   **How to Supply This:** In the debrief, ask: "Imagine you bought Lot A, took it home, loved it for 5 years. Then I knocked on your door and said, 'Actually, that was the copy.' Would you feel angry? Would the art look different to you?"
  *   **Why it matters:** This highlights that art value is partly **social trust**. The "Original" is a certificate of honesty from the artist to the viewer. The activity proves we *price* history; you must explain that we also *emotionally require* it to feel safe in our aesthetic judgments.

  **The "Performance" Aspect.**
  Real art involves a performance of skill over time. A 5-minute doodle lacks the "labor theory of value" that makes a Van Gogh precious.
  *   **How to Supply This:** Remind them: "You spent 5 minutes. Van Gogh spent a lifetime. The 'Original' captures a life, not just a mark. That's why the gap is wider in the real world."

  ### Final Facilitator Checklist
  1.  **Test the Copy Method:** Before class, try tracing a doodle on your tablet lightbox. Ensure it's fast enough.
  2.  **Prepare the "Star" Mark:** Have a subtle way to identify Originals on the back without students seeing (e.g., a tiny dot in the corner of the signature).
  3.  **Control the Narrative:** If a student says "It's all worthless," don't argue. Say, "Then why did you bid 3 PB?" Let the data contradict them.

  This design forces the intuition out of their hands and onto the table. They will feel the "ghost" of the artist in the paper before they ever hear the word *provenance*. Good luck.
