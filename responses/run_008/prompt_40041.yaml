      *   *Q2 (Agency):* Crucial. If agency isn't emergent, the "instrumental convergence" thesis weakens. This is a mix of empirical (ML trends) and conceptual (what counts as agency?). *Verdict:* High priority, high comparative advantage for a philosopher of science (defining theoretical virtues, prediction).
