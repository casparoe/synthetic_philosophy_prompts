answer: |-
  Hey, sorry to hear about the 1am blow-up, though honestly, arguing about dispositions at that hour is basically a rite of passage for anyone who ends up in metaphysics. You are right to pause and reset the board before going another round with Priya, because if you don't agree on what the theory is supposed to do, you will just keep talking past each other forever. She is right that nobody seriously thinks dispositions are bare material conditionals, but you are right that adding ceteris paribus clauses often feels like moving the goalposts until the analysis is trivial. To settle this, we need to fix the purpose of the theory first. If we are doing philosophy of science, the goal is predictive utility and capturing how scientists actually use terms like soluble or conductive, in which case Priya wins because scientists just use context to filter out finks and masks. But since you two are arguing about the metaphysics of properties, the purpose has to be ontological grounding. We need a theory that tells us what makes dispositional claims true, not just when it is useful to assert them. So, I am going to set the bar at metaphysical adequacy, meaning the theory must identify the truth-makers for dispositional ascriptions in a way that respects the structure of reality, not just the structure of our language.

  Once we agree that we are doing metaphysics, the first requirement is extensional adequacy for the boring cases. Any theory must validate the intuition that a standard glass is fragile and a standard lump of sugar is soluble without needing a PhD to figure it out. This sounds trivial, but it matters because some sophisticated accounts end up making fragility so dependent on specific causal bases that ordinary objects lose their dispositions if their microstructure is slightly unusual. Closely related to this is the requirement of causal relevance. Dispositions are supposed to explain why things happen, so the theory must ensure that having the disposition contributes to the manifestation occurring. If the theory makes the disposition a mere shadow of the manifestation, it fails to explain anything. This leads directly into the requirement of non-triviality regarding stimuli and manifestations. You mentioned the solenoid point, and it is crucial. The theory must prevent us from defining a disposition in a way that makes the stimulus and manifestation too tightly linked, such that everything has every disposition. For example, if we say something is fragile if it breaks when struck, we need to ensure we aren't just saying it breaks when it breaks. The stimulus and manifestation must be distinct events, and the connection between them must be robust enough to support counterfactuals without collapsing into tautology.

  Now we get to the hard stuff that probably caused the shouting. The theory must distinguish between finks and masks, and this is where the real work lies. A mask is something that prevents the manifestation without removing the disposition, like packing glass in Styrofoam. A fink is something that removes the disposition precisely when the stimulus occurs, like a sorcerer zapping the glass to make it non-fragile the moment it is struck. An adequate theory must say that in the mask case, the object still has the disposition, but in the fink case, the object loses it during the stimulus. If the theory treats these the same, it fails to capture the difference between interference and elimination. This brings us to the requirement of intrinsicness, which is where your hunch about the tension comes in. We generally want dispositions to be intrinsic properties of the object, depending on how the object is rather than what is happening around it. If fragility depends on whether there is a sorcerer nearby, it feels like we are not talking about the glass anymore. So, the theory should ideally locate the disposition within the object's internal structure.

  Here is the conflict you suspected, and you are right to worry about it. There is a serious tension between the requirement of intrinsicness and the requirement of fink-resistance if you are trying to stick with a conditional analysis. If you define fragility as "would break if struck," you need to add a clause like "provided nothing interferes." But if you make that clause too broad to handle finks, you inevitably bring in extrinsic factors, because whether a fink is present is an extrinsic matter. If you say the glass is fragile only if there is no sorcerer ready to zap it, then fragility is no longer intrinsic to the glass. So, for a conditional analysis, intrinsicness and fink-resistance pull in opposite directions. You can save the conditional by sacrificing intrinsicness, or you can save intrinsicness by admitting the conditional analysis is incomplete. The only way to satisfy both fully is to abandon the idea that dispositions are analyzed by conditionals at all and instead treat them as real, intrinsic properties that ground the conditionals. This is the powers view, where the disposition is a categorical feature of the object that exists regardless of whether the conditional holds in a specific scenario.

  There are other pressures too, such as the requirement of modal strength. The connection between stimulus and manifestation cannot be accidental; it must have some kind of necessity. But if you make it too strong, like logical necessity, you cannot account for probabilistic dispositions, like radioactive decay. So the theory must allow for dispositions that yield their manifestations only with a certain probability. Finally, there is the requirement of causal basis neutrality. While many think dispositions need a categorical base, the theory should ideally remain neutral on whether that base is physical, structural, or primitive, because we do not want our definition of disposition to presuppose a specific theory of properties. If the theory requires every disposition to be reducible to microphysical structure, it might fail for fundamental particles that have dispositions but no smaller parts.

  When you look at the main contenders against this list, the cracks show up quickly. The Simple Conditional Analysis fails immediately on finks and masks because it cannot distinguish between the disposition being absent and the manifestation being prevented. It also struggles with intrinsicness because the truth of the conditional depends on extrinsic conditions. The patched-up versions, like the Reformed Conditional Analysis that adds a clause about retaining the causal basis, do better on intrinsicness but risk circularity. They often define the causal basis in terms of the disposition itself, which Priya would rightly call uninformative. They also get messy when trying to specify exactly which extrinsic conditions are allowed in the ceteris paribus clause without making the analysis ad hoc. The Powers picture, where dispositions are fundamental properties, handles finks and masks elegantly because the disposition is a real thing that can be present even if the manifestation is blocked, and can be removed by a fink. It preserves intrinsicness because the power is located in the object. However, it pays a heavy price on ontological parsimony, committing us to a world full of potentialities that some find metaphysically spooky. It also struggles slightly with the non-triviality requirement if it defines the power solely by what it does, though proponents argue the power is primitive and known by its role.

  So, if I were you, I would concede to Priya that the Simple Conditional Analysis is dead, because no one serious holds it anymore, but hold your ground that patching it with ceteris paribus clauses often hides the metaphysical work rather than doing it. The real disagreement is whether you are willing to accept real powers to save intrinsicness. If you want a theory that satisfies intrinsicness and handles finks without cheating, you almost have to go realist about dispositions. If you want to stay nominalist, you have to accept that dispositional ascriptions are partly extrinsic. That is the trade-off. Write this down, show it to her, and see if she agrees that the tension between intrinsicness and the conditional analysis is the real culprit. If she says intrinsicness doesn't matter, then you are doing philosophy of language, not metaphysics, and you can go to bed. If she says it does matter, then she has to explain how a conditional analysis keeps fragility inside the glass when a sorcerer is outside it. Good luck, and try to finish before 1am this time.
