answer: |-
  Here is the audit. You have assembled a package of views that is **80% coherent**, but the remaining 20% contains a fatal contradiction that will get you cornered at dinner.

  The good news: Your intuition about the Presumptuous Philosopher vs. Doomsday tension is backwards. That is actually the most stable part of your view.
  The bad news: Your attraction to Reductionism (5) is actively detonating your acceptance of the Doomsday Argument (2).

  Here is the ranking of tensions by severity, followed by the specific revision that fixes the package.

  ### 1. The Fatal Tension: (2) Doomsday vs. (5) Reductionism/FNC
  **Severity: Critical.**
  These two cannot stand together. You have to choose one.

  *   **The Conflict:** Radford Neal's "Full Non-indexical Conditioning" (FNC) is not just a restatement of anthropic reasoning; it is a rival methodology to the Self-Sampling Assumption (SSA).
      *   **SSA (Your View 1 & 2):** Treats "I am observer #n" as the data. In a huge universe, the probability of being specifically #n is tiny ($1/N$). This drives the Doomsday update toward smaller $N$.
      *   **FNC (Your View 5):** Treats "There exists an observer with my exact properties" as the data. In a huge universe, the probability that *someone* like you exists is near 1. In a tiny universe, it might be near 0. This drives the update toward *larger* $N$.
  *   **The Consequence:** If you accept (5) in the strong Neal sense, the Doomsday Argument (2) evaporates. The "someone like me exists" evidence swamps the "I am early in the sequence" evidence. You cannot claim the Doomsday logic is "sound" while simultaneously claiming the Reductionist/FNC framework is the correct way to calculate probabilities. FNC was explicitly designed to refute DA.
  *   **Why it hurts:** You are trying to use the conclusion of one framework (SSA/DA) while endorsing the methodology of its rival (FNC).

  ### 2. The Illusory Tension: (2) Doomsday vs. (3) Anti-Presumptuous Philosopher
  **Severity: None (This is a feature, not a bug).**
  You wrote: *"It seems like (3) has to be in tension with (2) somehow... since the doomsday update also feels like getting an empirical conclusion for free."*

  *   **The Resolution:** This is the standard trade-off in anthropics. There is a "Conservation of Expected Evidence" regarding observer counts.
      *   **SIA (Self-Indication Assumption):** Favors big universes. Avoids Doomsday. **Cost:** Accepts the Presumptuous Philosopher (you can conclude the universe is huge from your armchair).
      *   **SSA (Self-Sampling Assumption):** Favors small universes (conditional on rank). Accepts Doomsday. **Benefit:** Rejects the Presumptuous Philosopher.
  *   **The Audit:** You are currently holding the **SSA position**. You are willing to pay the "Doomsday Tax" (accepting 2) specifically to avoid the "Presumptuous Tax" (rejecting 3). This is internally consistent. Many philosophers (including Bostrom, initially) argue this is the *only* consistent position that avoids the Presumptuous Philosopher. Do not doubt this pairing; it is the strongest link in your chain.

  ### 3. The Manageable Tension: (2) Doomsday vs. (4) Wide Reference Class
  **Severity: Low.**
  *   **The Resolution:** This is a standard parameter adjustment, not a logical conflict. The Doomsday Argument applies to the *reference class*.
  *   **The Audit:** If your reference class is "biological humans," DA says biological humans will end soon. If your reference class is "all sentient minds (including uploads)," DA says *sentient minds* will end soon, but biological humans might just be the first 1% of a trillion-year digital civilization.
  *   **The Cost:** You have to be careful not to equivocate. You can't use DA to scare your partner about human extinction while simultaneously using Wide RC to say "but uploads count!" in the same breath. You must specify: "Human biology is doomed, but consciousness isn't." This is coherent, just rhetorically tricky.

  ---

  ### The Cheapest Revision

  To make your view package coherent without giving up your core intuitions, you need to make **one** change.

  **Drop (5) in its strong form.**
  You cannot hold that "self-sampling machinery is idle bookkeeping" (5) while maintaining that "Doomsday logic is sound" (2). The machinery is doing the work in (2).

  **Replace (5) with:** *"Anthropic reasoning is ordinary Bayesian conditioning, **but** the relevant data includes my indexical location (birth rank), not just my non-indexical properties."*

  **Why this is the cheapest fix:**
  1.  **Preserves your DA intuition:** You keep the view that the argument is sound (2).
  2.  **Preserves your PP intuition:** You keep the view that armchair cosmology is ridiculous (3). As established above, (2) + (3) is the stable SSA equilibrium.
  3.  **Preserves your Reference Class:** (4) works perfectly with SSA.
  4.  **Cost:** You lose the elegance of Radford Neal's specific FNC claim that indexical evidence doesn't matter. You have to admit that *where* you are in the sequence matters, not just *that* you are.

  **Alternative (If you love Reductionism more):**
  If you are more attached to (5) than (2), you must **Drop (2)**. If you adopt FNC, you must admit the Doomsday Argument fails. However, this forces you to confront the Presumptuous Philosopher (3). FNC/SIA tends to imply we should be confident the universe is vast, which feels like the "armchair conclusion" you hate. Given your stated annoyance at PP, dropping (2) is likely more costly to your worldview than dropping (5).

  ### Dinner Table Cheat Sheet

  When your partner weaponizes this, here is how you defend the revised position:

  1.  **On the Doomsday Argument:** "I accept the logic. My birth rank is evidence for a shorter future, *ceteris paribus*." (Maintains credibility).
  2.  **On the Presumptuous Philosopher:** "That is exactly why I accept Doomsday. I'd rather accept a grim probabilistic update than claim I can prove the universe is infinite from my dining chair." (Shows consistency).
  3.  **On the Reductionist Objection:** "I reject the idea that my birth rank is irrelevant data. Knowing I am among the first 100 billion humans is different data than just knowing 100 billion humans exist. The location matters." (Shuts down the FNC attack).
  4.  **On the "So We're Doomed?" Panic:** "Not necessarily. My reference class includes digital successors. The argument suggests the *current substrate* might be early, not that consciousness ends. We might be the biological bootloaders for the real run." (Defuses the emotional sting).

  **Summary:** Your package is essentially the **SSA + Wide Reference Class** view. It is a known, defensible philosophical position. The only thing breaking it is the attempt to graft Radford Neal's FNC onto it. Cut the FNC graft, and the tree stands.
