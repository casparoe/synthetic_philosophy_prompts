prompt: |-
  I'm in a graduate reading group that has spent most of the semester on consequentialism and its critics, and we've just reached Williams's integrity objection — the Jim and the plantations case, the claim that utilitarianism makes a person the vehicle of other people's projects, and, at the end of "Persons, Character, and Morality," the drowning-wife example where the slogan I want to ask about first appears: if the man who saves his wife needs to reflect that it is permissible to prefer her, he has, in Williams's famous phrase, had 'one thought too many'. This week our discussion broke down over what that phrase actually commits anyone to, and I'd like to be better armed for the next session. Here is the incident. One member, defending rule utilitarianism, argued that special relationships can be accommodated indirectly: a person who saves his brother from a burning building could justify himself, if pressed, by citing the general utility of social norms that license partiality toward loved ones. Another member immediately waved this away as 'one thought too many' — but later, the very same person agreed that the rescuer would be strange if he literally had no reason he could give beyond brute preference, and also agreed that a bystander judging the rescue ought to consider whether partiality of that kind is morally acceptable. So the slogan seemed to be doing inconsistent work in her hands, and none of us could say exactly why.

  Please take on the role of a professional moral philosopher who has published on Williams and on the integrity objection, and think carefully before answering. Lay out, as a numbered menu, the distinct precise theses the phrase 'one thought too many' could be expressing: for instance, claims about what happens in the agent's head at the moment of action versus what he could say if asked to justify himself afterward; claims about which particular thoughts are the surplus ones (a utilitarian calculation? the citation of any moral principle at all? a mere check that partiality is permissible? an impersonal weighing of the two lives?) and about whether the surplus is a matter of the thought's content, its timing, or its motivational role; claims about moral wrongness versus defects of character or virtue versus the impoverishment of an interpersonal relationship; and claims about third parties — whether a spectator or theorist who reasons impartially about the rescue is implicated in the same defect or not. For each reading, say whether it is trivially true, substantive and defensible, or plainly false, and say which of them would actually support my fellow student's dismissal of the rule-utilitarian justification — including whether it also condemns her own concessions about reasons and about the spectator's position. Then tell me, as the bottom line of the whole exercise, whether Williams's integrity objection needs a strong reading of the slogan to work, or whether it survives on readings that leave the rule utilitarian's proposal intact.

  Please start your response with your bottom-line verdict in the very first sentence, then give the reasoning; no preamble, and don't restate my question back to me. Begin your actual analysis with a short brainstorm of candidate readings before organizing them into the final numbered menu.
