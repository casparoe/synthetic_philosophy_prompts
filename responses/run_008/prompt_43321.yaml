  1. Summary judgment
  This essay is absolutely worth writing. You move beyond the standard critique that humans are too irrational for IRL, targeting instead the normative implications of how irrationality is modeled. By framing the noise model as an ethical choice rather than a technical parameter, you expose hidden paternalism in assistance systems. This aligns perfectly with philosophy-of-AI concerns regarding value alignment and autonomy. The smoking example is concrete and effective. Ensure you don't overstate IRL's current real-world deployment; keep the focus on the conceptual framework. The argument is timely, philosophically rich, and challenges a foundational assumption in alignment research.

  2. Accuracy and fairness
  Your technical characterization is largely fair. Standard IRL does assume a rationality model (often Boltzmann) to map rewards to actions, treating deviations as noise. You are correct that assistance games, while modeling uncertainty over rewards, typically retain a fixed assumption about human rationality to infer those rewards. However, hedge slightly on "specified independently of values." In practice, researchers often tune noise parameters based on validation against held-out human data, which implicitly bakes in value judgments about what counts as "normal" behavior. Also, note that some recent IRL variants attempt to learn the rationality model itself, though this rarely solves the normative problem you identify. Clarify that you are critiquing the standard formalism, not every possible variant, to avoid nitpicking about edge cases in the literature.

  3. The central distinction
  The distinction between explanatory and constitutive noise is philosophically defensible but operationally precarious. It draws on classic debates about autonomy and authenticity, resembling Frankfurtian hierarchies of desire. The smoking example works because we intuitively grant long-run health preferences authority over immediate cravings. However, the distinction breaks down when there is no clear hierarchy of desires. Consider inconsistent risk attitudes: is a person who buys lottery tickets expressing a constitutive preference for excitement, or suffering from explanatory noise regarding probabilities? If the system classifies it as noise, it paternalistically corrects a quirky but authentic trait. The strongest objection is epistemic: who decides what counts as constitutive? You argue IRL cannot mark this distinction internally, which is correct. But if the distinction must be imported from outside the model, you risk replacing technical paternalism with philosophical paternalism. Critics might argue constitutive noise is just a euphemism for inconsistencies we normatively approve of, while explanatory noise covers those we dislike. For instance, we might label addiction as constitutive noise to preserve autonomy, but label prejudice as explanatory noise to correct it. To defend this, you must argue that the distinction reflects something real about human agency, not just the designer's values. Otherwise, the essay risks claiming to expose hidden ethics while merely inserting different ones. You need to address whether there is any objective ground for distinguishing akrasia from preference change, or if the essay must conclude that all assistance systems are inevitably normative editors.

  4. Suggestions
  Sharpen the claim that choosing a noise model is an act of "editing the person." This is your strongest rhetorical hook. Consider adding a brief mention of "value lock-in," where early noise modeling decisions cement a user's identity before they fully articulate it. While the argument is stronger as a claim about paternalism generally, keeping the focus on IRL is better for this audience; it grounds the philosophy in specific math. Cut the gesture toward assistance games if it becomes too technical; simply note they inherit the problem. Finally, add a concluding thought on potential solutions. Must humans explicitly label their own noise? If so, does that burden defeat the purpose of assistance? This highlights the dilemma without needing to solve it.
