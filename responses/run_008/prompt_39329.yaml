answer: |-
  ### 1. Testing Your Tentative Principle

  Your tentative principle is: *Taking someone's word is fine where the testimony transmits a competence I lack and couldn't feasibly acquire, and not fine where forming the judgment myself is part of the point of the judgment.*

  **The Test:**
  *   **Cases 1, 2, 4, 6, 7:** Your principle handles these well. Case 1 is competence (medical); Cases 2, 6, 7 are about forming your own moral judgment; Case 4 is about the civic duty to judge.
  *   **Case 3 (Grandmother):** Your principle fails here. You admit you were "perfectly capable of judging for myself," yet you deem deference "Fine." Your principle predicts "Not Fine" because acquiring the competence (judging family dynamics) was feasible.
  *   **Case 5 (Friend):** Your principle is ambiguous. Is loyalty a "competence you lack"? No. Is forming the judgment yourself "part of the point"? It seems so, yet you deem it "Fine."

  **Diagnosis:** Your principle focuses entirely on **epistemic competence** (knowledge/skill). It misses **relational authority**. In Cases 3 and 5, the permission to defer doesn't come from the testifier knowing *more* than you, but from the testifier holding a specific *standing* in relation to you or the harm done.

  ### 2. The Repaired Principle

  To cover all cases determinately, we need to distinguish between judgments that define your **autonomous agency** and judgments that serve **relational or empirical ends**.

  **The Principle of Moral Ownership:**
  > You must form your own independent moral judgment whenever the action constitutes an exercise of your **general moral agency** or a **public trust**. You may defer to another's word only when the testimony concerns **empirical premises** outside your expertise, or when the act of deference itself serves a **specific relational obligation** to the testifier.

  **Operational Rules:**
  1.  **Empirical Deference (Permitted):** If the moral conclusion rests on a factual premise you cannot verify (e.g., neuroscience, geology), you may defer on the fact. (Covers Case 1).
  2.  **Relational Deference (Permitted):** If the moral question concerns a wrong done *to the testifier* or within a bond they guard (e.g., family elder, victim), and deference serves to repair or honor that bond, you may defer. (Covers Case 3).
  3.  **Agency Requirement (Forbidden):** If the moral question concerns general principles of conduct, duties to third parties, or public roles requiring independent verification, you must not defer. You must own the reasoning. (Covers Cases 2, 4, 6, 7).

  ### 3. The Unsavable Verdict

  **Case 5 (The Betrayed Friend) cannot be saved by this principle.**

  **Why:** Under the *Principle of Moral Ownership*, Case 5 falls under the **Agency Requirement**. While believing your friend's pain is a relational obligation (Relational Deference), *cutting off a third party* based solely on that testimony is an exercise of general moral agency affecting an absent person who cannot defend themselves. It is structurally identical to Case 4 (Jury Duty): rendering a verdict on someone's character without hearing their side.

  **Recommendation:** You should overturn your verdict on Case 5.
  *   **Correction:** It is fine to *believe* your friend and offer her support (Relational Deference). It is *not* fine to enact a punitive moral judgment (cutting off the mutual friend) without independent verification (Agency Requirement). Loyalty demands solidarity, not necessarily blind justice.

  ### 4. Application to the New Case

  **The Case:** A friend asks whether it would be wrong to cut her aging parents out of her life. You give a confident answer, and she acts on it.

  **Analysis:**
  1.  **Is it Empirical Deference?** No. You are not providing facts about the parents' health or finances; you are providing a moral verdict on filial duty.
  2.  **Is it Relational Deference?** No. The relationship in question is between *her and her parents*. You are a third party. You are not the victim, nor are you a guardian of that specific bond (like the grandmother in Case 3).
  3.  **Is it an Agency Requirement?** Yes. Cutting off one's parents is a profound exercise of **general moral agency**. It defines who she is as a moral actor and impacts third parties (the parents) who are not present to defend themselves.

  **Verdict:** She is doing what you did with the **pork (Case 2)**, not what you did with your grandmother (Case 3).

  **Explanation:**
  In Case 3 (Grandmother), the deference was about *your* conduct within a bond the grandmother helps steward. In this new case, your friend is outsourcing a constitutive life-choice to you. By acting solely on your word, she becomes a "moral parasite" on your conviction. She avoids the burden of reconciling her duty to her parents with her own needs.

  **What marks the difference?**
  The difference is **Standing**.
  *   **Grandmother (Case 3):** Has standing. She is a stakeholder and elder in the specific family system where the wrong occurred. Her verdict *is* part of the repair.
  *   **You (New Case):** Lack standing. You are an outsider to the parent-child bond. Your confident answer functions as an abstract moral rule, not a relational repair.

  **Advice:** If you wish to be helpful, you must not give a confident verdict. You must ask questions that force *her* to form the judgment herself. To do otherwise is to encourage her to violate the Principle of Moral Ownership.
