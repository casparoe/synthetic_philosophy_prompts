answer: |-
  Here is a complete lesson plan designed for an 80-minute discussion section. It balances active learning with the theoretical rigor expected in an intermediate decision theory course.

  # Lesson Plan: The "Job Market" Money Pump
  **Topic:** Diachronic Rationality & Money Pumps
  **Time:** 80 Minutes
  **Class Size:** 15 Undergraduates
  **Materials:** Printed "Job Cards" (A, B, C), small candies or "Class Points" (see below), whiteboard.

  ## 1. The Setup (10 Minutes)
  **The Stakes:**
  Do not use real cash (university policy/liability). Use **"Class Points."**
  *   Give every student **100 Points** at the start.
  *   **Redemption:** At the end of class, hold a raffle. 1 Point = 1 Ticket. The winner gets a $25 Coffee Gift Card (or similar). Alternatively, 10 Points = 1 Piece of Candy (immediate gratification).
  *   **The Hook:** Tell them: *"Today is about optimization. You want to maximize your expected utility. You start with a contract. If you see a better contract, you can switch. But there's an administrative switching fee."*

  **The Items (The "Jobs"):**
  Hand out cards describing three summer internship offers. Design them so preferences depend on which attribute is **salient** during the comparison (Tversky's Additive Difference Model).

  *   **Job A:** $15/hour Pay | 5/10 Fun Rating | 10 miles Commute
  *   **Job B:** $17/hour Pay | 3/10 Fun Rating | 10 miles Commute
  *   **Job C:** $13/hour Pay | 8/10 Fun Rating | 10 miles Commute

  *(Note: Keep Commute constant so it drops out. The cycle relies on the trade-off between Pay and Fun changing based on the magnitude of the difference.)*

  **The Rules:**
  1.  Everyone starts with **Job A**.
  2.  There will be **3 Trading Rounds**.
  3.  In each round, you may trade your current Job for the offered Job.
  4.  **Cost:** Each trade costs **5 Class Points** (an "administrative fee").
  5.  Trades are voluntary. You can keep what you have.
  6.  **Crucial:** Do not reveal all three jobs at once. Reveal them pairwise.

  ## 2. The Game (30 Minutes)
  *Your role is the "Recruiter." You control the framing.*

  **Round 1: A $\to$ B**
  *   **Script:** *"Look at your current offer, Job A. It's decent. But I have Job B. Look at the pay. That's a **$2/hour raise**. For the same commute, do you really want to leave $2 on the table for a little bit of 'fun'? Fun doesn't pay rent."*
  *   **The Trap:** The pay difference is salient. The fun difference (5 vs 3) seems minor.
  *   **Expected Move:** Most students trade A for B. (Cost: 5 points).

  **Round 2: B $\to$ C**
  *   **Script:** *"Okay, you're locked into Job B. High pay, but let's be honest, a 3/10 fun rating is miserable. You'll burn out. Look at Job C. The pay is lower, sure, but the **Fun Rating jumps from 3 to 8**. That's a massive quality of life improvement. Is $4/hour worth being miserable all summer?"*
  *   **The Trap:** The fun difference is now salient (large gap). The pay drop feels like a "premium" paid for happiness.
  *   **Expected Move:** Many students trade B for C. (Cost: 5 points).

  **Round 3: C $\to$ A**
  *   **Script:** *"Last chance. You have Job C. It's fun, but look at the bottom line. Job A pays **$2/hour more** than C. And honestly, a 5/10 fun rating is perfectly average. Why take a pay cut for marginally less fun than 'great'? Job A is the balanced, professional choice."*
  *   **The Trap:** We return to Pay Salience. The Fun difference (8 vs 5) is framed as "marginally less" rather than "massive drop."
  *   **Expected Move:** Many students trade C for A. (Cost: 5 points).

  **The Reveal:**
  Ask students to look at their final card and their point total.
  *   **Start:** Job A, 100 Points.
  *   **End:** Job A, 85 Points (if they traded all 3 times).
  *   **Ask:** *"Show of hands: Who ended up with the exact same job they started with, but fewer points?"*

  ## 3. The Debrief (30 Minutes)
  *Move to the whiteboard. This is where you connect the game to the theory.*

  **A. Mapping the Moves (Static vs. Dynamic)**
  *   **Static Choice:** If I laid A, B, and C on the table *simultaneously*, would you cycle? Probably not. You'd pick one.
  *   **Dynamic Choice:** The money pump works because preferences are **context-dependent** (framing) and **diachronic** (happening over time).
  *   **The Violation:** Transitivity ($A \succeq B, B \succeq C \implies A \succeq C$). In the game, their *revealed* preference was $B \succ A$, $C \succ B$, $A \succ C$.
  *   **The Cost:** Rationality isn't just about consistency; it's about not paying to spin in circles. If you are pumpable, you are effectively throwing away utility (points).

  **B. The Escape Routes (Student Objections)**
  *Expect clever students to raise these. Here is how you handle them:*

  1.  **"I'm a Sophisticated Chooser" (Backward Induction)**
      *   *Student:* "If I knew Round 3 was coming, I wouldn't have traded in Round 1."
      *   *You:* "Exactly. That's **Sophisticated Choice**. You anticipate your future irrationality and restrict your current self. But in the real world, do you always know a trade is the first link in a chain? Often, the 'pump' is hidden."
  2.  **"I'll Just Commit" (Pre-commitment)**
      *   *Student:* "I would have just refused to trade at all."
      *   *You:* "That's a **Commitment Device**. You bind your future self to stop the pump. But commitment has costs too (you might miss a *genuine* improvement). The Money Pump argument says if you *don't* have commitment, you *must* be transitive, or you lose money."
  3.  **"I Won't Trade With You Again" (The One-Shot Objection)**
      *   *Student:* "This is a one-off class. I know you won't pump me again tomorrow. So I can be intransitive today without long-term loss."
      *   *You:* "This is the strongest objection (Gustafsson's critique). Money pumps require a **recurrent environment**. If the market is one-shot, intransitivity doesn't kill you. *However*, life is rarely one-shot. Habits form. If you are the kind of person who makes intransitive choices, you will encounter pumps in finance, relationships, and careers repeatedly."
  4.  **"The Items Changed" (Framing Defense)**
      *   *Student:* "Job A in Round 1 wasn't the same as Job A in Round 3 because my context changed."
      *   *You:* "Fair. But Decision Theory assumes **Description Invariance**. If the objective outcome is identical, your preference should be too. If framing changes your mind, you are vulnerable to manipulation by marketers (or TAs)."

  ## 4. Honest Limitations & "What Will Flop" (10 Minutes)
  *Be transparent with the class. It builds trust and shows you understand the literature.*

  **1. The "Game Mode" Problem**
  *   **Prediction:** 3-5 students will spot the cycle immediately and refuse to trade.
  *   **Response:** Acknowledge them. *"You are the Sophisticated agents. You won the game by not playing. But did you maximize utility? Maybe Job B was actually best for you, and by refusing to trade, you stayed at A. Sophistication protects your wallet, but it might lock you into a suboptimal start."*

  **2. The Time Horizon**
  *   **Prediction:** A student will say, "This doesn't prove irrationality, it just proves we learned."
  *   **Response:** "In an 80-minute class, 'learning' is indistinguishable from 'preference change.' The Money Pump argument assumes stable preferences. If your preferences change because I talked to you, that's **endogenous preference change**, which is a different (and messier) problem."

  **3. The "Small Stakes" Issue**
  *   **Prediction:** "I don't care about 15 points."
  *   **Response:** "True. With low stakes, people are sloppy. The Money Pump is a *theoretical* vulnerability. In high-stakes environments (housing, retirement funds), intransitivity is costlier, and people tend to become more transitive."

  **4. The Big Philosophical Hole (The "End of Game" Problem)**
  *   **Concept:** The Money Pump argument fails if the agent knows the game is ending.
  *   **Explanation:** If I know Round 3 is the last round, I can take the trade in Round 3 without fear of being pumped *further*. The pump requires an **infinite horizon** or **uncertainty about future opportunities**.
  *   **Takeaway:** Tell the class: *"This game is finite. A true money pump requires you to believe there's always another trade coming. In real life, uncertainty about the future is what makes the pump dangerous."*

  ## TA Cheat Sheet: Key Terms to Write on the Board
  *   **Transitivity:** If $A \succ B$ and $B \succ C$, then $A \succ C$.
  *   **Diachronic:** Across time (vs. Synchronic/Static).
  *   **Naive Chooser:** Thinks future selves will act rationally (gets pumped).
  *   **Sophisticated Chooser:** Anticipates future irrationality (refuses first trade).
  *   **Description Invariance:** Preferences shouldn't change based on how options are framed.

  ## Contingency Plan: If No One Trades
  If the class is too cynical and no one trades in Round 1:
  1.  **Pivot:** "Okay, nobody bit. That means the framing wasn't strong enough, or you're all sophisticated."
  2.  **Hypothetical:** "Let's assume a Naive agent *did* take these trades. Why would they?"
  3.  **Discussion:** Move straight to the **psychology of the trade**. Ask them *why* they didn't trade. Was it suspicion? Or did they genuinely prefer A? Use their reasons to explain why a Money Pump *would* work on someone less suspicious (e.g., a consumer facing hidden fees).

  ## Final Advice for You (The TA)
  *   **Don't Fake Confidence:** If you don't know an answer, say, "That's a great objection that philosophers still debate. The standard reply is X, but Y is also valid."
  *   **Watch the Clock:** The game often runs long. Cut the Debrief short if needed, but ensure you define **Naive vs. Sophisticated** before they leave.
  *   **The "Aha" Moment:** The goal isn't to prove they are irrational. It's to show that **local rationality (each trade looks good) $\neq$ global rationality (the sequence is bad).** Hammer that distinction home.
