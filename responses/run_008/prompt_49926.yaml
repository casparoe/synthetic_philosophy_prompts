prompt: |-
  I just got roped into running the discussion section for our intermediate decision theory course (about 15 undergrads, one 80-minute block) and the professor wants me to cover money pumps / diachronic rationality, which I never actually studied properly myself, so I want to make sure the students hit the problem themselves rather than me lecturing at them. Design an in-class game where they make a sequence of individually-optional-seeming trades with real (small) stakes or a point currency, and some of them end up demonstrably worse off for paying each step even though each step looked fine at the time -- then they should get to the end before realizing what happened to their starting position. Give me rules, the pairwise choices I should set up (I want the preferences to be slightly non-transitive in a way that feels natural in the moment, not an obvious trap), a debrief that maps specific moves to the idea of dynamic vs. static choice, and cover the standard escape routes (naive vs. sophisticated choice, commitment devices, the "you'll never trade with me again" reply) so I know what to say when the inevitable clever student brings them up. Also please be honest about which parts will predictably flop the first time I run this, and which feature of the money pump argument just can't come through in a game that ends after 80 minutes. Answer in American English please!
