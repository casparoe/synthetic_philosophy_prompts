prompt: |-
  I work as a strategy consultant. Clients bring me competitive decision problems — pricing, sealed bids, contract terms — where they must pick one option while a counterparty picks theirs, and my job in a first meeting is to prune the client's own option list down to the ones worth discussing. I want the pruning to rest on dominance reasoning, including the version where an option is beaten not by any single other option but by a randomized mix of two, since clients never think of that themselves and it's often the only eliminations available. Please write a procedure I can run at a whiteboard in twenty minutes with rough, client-elicited payoff estimates: the steps in order, what counts as dominated (strict versus weak, by a pure option versus by a mixture), when to stop iterating, and what to do when the payoffs are too vague to compare at all. It should be honest that iterated elimination only follows if the counterparty is rational in exactly the same way and that this is known, that striking weakly dominated options can discard the best option against an opponent who blunders, and that with weak dominance the surviving set can depend on the order of elimination — so say where the procedure should default to the more conservative test. Then run it on two cases: a three-option tender where one option is dominated only by a mixture of the other two, and a case where the procedure strikes the client's favorite option because flipping a coin between two others does at least as well against every counterparty move and strictly better against one — include how to present that finding without losing the room. Mark clearly the points where the numbers cannot decide and the judgment is mine.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case studies:

  1.  **Analyze the Request:**
      *   **Role:** Strategy Consultant.
      *   **Task:** Create a 20-minute whiteboard procedure to prune a client's option list in competitive decision problems (pricing, bids, contracts).
      *   **Core Logic:** Dominance reasoning (Strict and Weak, Pure and Mixed).
      *   **Key Constraints/Requirements:**
          *   Must fit in 20 minutes with rough estimates.
          *   Must explain strict vs. weak, pure vs. mixed dominance.
          *   Must address stopping conditions.
          *   Must address vague payoffs.
          *   Must include caveats: Rationality assumptions (common knowledge), risk of eliminating weakly dominated options (blunders), order dependence in weak dominance.
          *   Must default to the conservative test where appropriate.
          *   Must run two specific cases:
              1.  3-option tender (one dominated by a mixture).
              2.  Client's favorite option dominated by a coin flip (mixture) of two others.
          *   Must include advice on presenting the second finding diplomatically.
          *   Must clearly mark where human judgment overrides numbers.

  2.  **Deconstruct the Procedure (The "20-Minute Prune"):**
      *   *Time Management:* 20 minutes is tight. Need a structured flow.
      *   *Step 1: Setup (5 mins).* Define players, options, and rough payoffs.
      *   *Step 2: Pure Dominance Check (5 mins).* Easy wins first.
      *   *Step 3: Mixed Dominance Check (5 mins).* The core value-add.
      *   *Step 4: Caveats & Decision (5 mins).* Rationality, blunders, judgment calls.
      *   *Dominance Definitions:*
          *   Strict Pure: $A > B$ in all columns.
          *   Weak Pure: $A \ge B$ in all, $>$ in at least one.
          *   Strict Mixed: Mix of $A, C > B$ in all columns.
          *   Weak Mixed: Mix of $A, C \ge B$ in all, $>$ in at least one.
      *   *Conservative Default:* The prompt asks where to default to the more conservative test. In game theory, *Strict* dominance is safer than *Weak*. Eliminating weakly dominated strategies can remove Nash equilibria or best responses to irrational play. So, the procedure should prioritize Strict Dominance for elimination, flagging Weak Dominance for "Caution/Review."
      *   *Iterated Elimination:* Needs common knowledge of rationality. Must state this limitation.
      *   *Vague Payoffs:* Use ranges or ordinal ranking if cardinal numbers aren't available. If ranges overlap too much, mark as "Judgment Required."

  3.  **Drafting the Procedure (Iterative Refinement):**
      *   *Name:* The "Dominance Prune."
      *   *Structure:* Clear steps.
      *   *Caveats:* Need a dedicated section for the "Truth in Consulting" warnings (rationality, blunders, order dependence).
      *   *Mixed Strategies:* How to explain this simply on a whiteboard? Visualize it as a "weighted average" line. If the line is above the option in every column, the option is out.

  4.  **Developing Case 1 (Mixture Dominance):**
      *   *Scenario:* Tender/Bid.
      *   *Options:* Low, Med, High.
      *   *Counterparty:* Competitor Bid (Low, High).
      *   *Logic:* Med is dominated by a mix of Low and High.
      *   *Payoffs:* Need to construct a matrix where Med is never the best response and a probabilistic mix of Low/High beats it.
      *   *Example:*
          *   Client: Bid 90, 100, 110.
          *   Competitor: Bid 95, 105.
          *   Payoffs (Profit):
              *   If Comp 95: C90=0 (too low/lost?), C100=10, C110=0. (Wait, need to make sure Mix works).
              *   Let's try standard matching pennies style or coordination.
              *   Better: A bidding war.
              *   Client Options: Aggressive, Balanced, Conservative.
              *   Comp Options: Price War, Status Quo.
              *   Payoff Matrix (Client Profit):
                  *   Aggressive: 10 (War), 40 (Status)
                  *   Balanced: 15 (War), 25 (Status)
                  *   Conservative: 20 (War), 10 (Status)
              *   Check Balanced (15, 25).
              *   Mix Aggressive/Conservative (50/50):
                  *   War: 0.5*10 + 0.5*20 = 15. (Equal to Balanced)
                  *   Status: 0.5*40 + 0.5*10 = 25. (Equal to Balanced)
              *   Need *Strict* dominance by mixture for a clean kill, or Weak for the "favorite" case.
              *   Let's adjust for Case 1 (Mixture Dominance):
                  *   Aggressive: 10, 50
                  *   Balanced: 20, 30
                  *   Conservative: 30, 10
                  *   Mix (50/50) of Agg/Cons:
                      *   Col 1: 0.5(10) + 0.5(30) = 20. (Equals Balanced)
                      *   Col 2: 0.5(50) + 0.5(10) = 30. (Equals Balanced)
                  *   This is Weak Dominance. Let's make it Strict for Case 1 to show elimination power.
                  *   Agg: 10, 50
                  *   Bal: 18, 28
                  *   Cons: 30, 10
                  *   Mix (50/50): Col 1 = 20 (>18), Col 2 = 30 (>28).
                  *   Result: Balanced is Strictly Dominated by Mix. Eliminate.

  5.  **Developing Case 2 (Killing the Favorite):**
      *   *Scenario:* Contract Terms.
      *   *Options:* Standard (Favorite), Premium, Basic.
      *   *Logic:* Standard is dominated by 50/50 flip of Premium/Basic.
      *   *Payoffs:*
          *   Premium: 100, 0
          *   Basic: 0, 100
          *   Standard (Fave): 40, 40
          *   Mix (50/50): 50, 50.
          *   50 > 40 in both cases. Strict dominance by mixture.
      *   *Presentation:* This is sensitive. Need to frame it as "Risk Management" or "Hedging" rather than "Your idea is stupid." Focus on the *portfolio* value.

  6.  **Refining the Caveats & Judgment:**
      *   *Rationality:* IESDS (Iterated Elimination of Strictly Dominated Strategies) requires common knowledge of rationality. If the opponent is irrational, dominance might not hold.
      *   *Weak Dominance:* Eliminating weakly dominated strategies can remove equilibria. The procedure should default to *Strict* for elimination, mark *Weak* for "Keep but Deprioritize."
      *   *Vague Numbers:* If payoffs are "High/Med/Low", convert to 3/2/1. If ranges overlap significantly, flag for judgment.
      *   *Judgment Points:* Explicitly mark where the consultant must step in (e.g., assessing opponent rationality, risk tolerance).

  7.  **Review against Constraints:**
      *   20 minutes? Yes, the steps are streamlined.
      *   Whiteboard friendly? Yes, matrix based.
      *   Mixed strategies included? Yes.
      *   Caveats included? Yes (Rationality, Blunders, Order Dependence).
      *   Conservative default? Yes (Strict > Weak for elimination).
      *   Two cases run? Yes.
      *   Judgment marked? Yes.

  8.  **Final Polish:**
      *   Tone: Professional, authoritative, yet collaborative.
      *   Formatting: Use bolding, lists, and clear headers for readability.
      *   Ensure the distinction between Strict and Weak is clear in the procedure steps.
      *   Ensure the "Order Dependence" warning is prominent in the Weak Dominance section.

  *(Self-Correction during drafting)*: I initially thought about suggesting complex probability calculations for the mixed strategy. *Correction:* Keep it simple for a 20-minute whiteboard session. Use 50/50 splits or simple visual averaging. If a 50/50 mix dominates, that's enough to prune. No need for linear programming optimization in the first meeting.
  *(Self-Correction on Weak Dominance)*: The prompt asks where to default to the conservative test. The conservative test is *not* eliminating weakly dominated strategies because doing so risks losing the best response to a "blundering" opponent. I will recommend *flagging* weak dominance but not *eliminating* unless the client accepts the rationality risk. Actually, standard advice is to eliminate Strict, keep Weak. I will advise eliminating Strict (Pure or Mixed) and *only* pruning Weak if the client explicitly accepts the risk of opponent irrationality. Better yet, default to *keeping* Weakly dominated options but marking them as "Low Priority."

  *(Refining the "Order Dependence" point)*: Order dependence only applies to Weak Dominance. Strict dominance order doesn't matter. I need to make sure this distinction is clear.

  *(Refining Case 2 Presentation)*: How to tell a client their favorite idea is mathematically inferior without offending? Frame it as "diversification" or "optionality." The mix isn't just a coin flip; it represents keeping two paths open or structuring a deal that captures both upsides.

