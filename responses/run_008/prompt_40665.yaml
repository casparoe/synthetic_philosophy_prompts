answer: |-
  # The 20-Minute Dominance Prune
  **Objective:** Reduce the client's option set to those that are rationally defensible before deep analysis.
  **Tools:** Whiteboard, marker, rough payoff estimates (ordinal or cardinal).
  **Time:** 20 Minutes.

  ---

  ## Part 1: The Procedure

  ### Step 1: Matrix Setup (5 Minutes)
  1.  **Draw the Grid:** Rows = Client Options ($A, B, C...$). Columns = Counterparty Moves ($X, Y, Z...$).
  2.  **Populate Payoffs:** Fill cells with estimated value (Profit, NPV, or 1–10 score).
      *   *Vague Payoffs:* If numbers are fuzzy, use ranges (e.g., $10\text{--}15$). If only ordinal ranking is known, use 3/2/1.
      *   **[JUDGMENT POINT 1]:** If ranges overlap significantly (e.g., Option A is $10\text{--}20$ and Option B is $15\text{--}25$), do not treat as definite. Mark the cell with a `?` and proceed conservatively (assume no dominance).
  3.  **Define Goal:** Confirm we are maximizing the number in the cell.

  ### Step 2: Pure Dominance Check (5 Minutes)
  Compare every pair of rows.
  1.  **Strict Dominance:** Option $A$ strictly dominates $B$ if $A$'s payoff is **greater than** $B$'s in *every* column.
      *   *Action:* **Eliminate $B$.**
  2.  **Weak Dominance:** Option $A$ weakly dominates $B$ if $A$ is **greater than or equal to** $B$ in all columns, and **strictly greater** in at least one.
      *   *Action:* **Do Not Eliminate yet.** Mark $B$ as "Vulnerable."
      *   *Reason:* Weak elimination assumes the counterparty will never play the specific column where $A$ and $B$ tie. If they blunder, $B$ might be safe. Eliminating weakly dominated strategies can discard the best response to irrationality.

  ### Step 3: Mixed Dominance Check (5 Minutes)
  *This is the value-add. Clients rarely see that a "portfolio" of options beats a single option.*
  1.  **Pick a Target:** Select an option that survived Step 2 (usually the "middle" or "compromise" option).
  2.  **Draw the Mix:** Pick two other options. Imagine flipping a coin (50/50) or weighting them (e.g., 70/30) between them.
  3.  **Calculate Weighted Average:** For each column, calculate the average payoff of the mix.
      *   *Whiteboard Trick:* Visually average the numbers. If Option $A=10, C=30$, the 50/50 mix is $20$.
  4.  **Compare:**
      *   **Strict Mixed Dominance:** If the Mix payoff is **greater than** the Target in *every* column, the Target is strictly dominated by the mixture.
          *   *Action:* **Eliminate Target.**
      *   **Weak Mixed Dominance:** If the Mix is $\ge$ Target in all, and $>$ in one.
          *   *Action:* **Mark "Vulnerable." Do Not Eliminate.**
  5.  **[JUDGMENT POINT 2]:** If the mix requires complex weights (e.g., 37/63) to dominate, skip it. In a 20-minute prune, only look for simple mixes (50/50 or 1/3 splits) that clearly dominate. Complex mixes imply the dominance is fragile to estimation error.

  ### Step 4: Caveats & Stop Rules (5 Minutes)
  Before finalizing the shortlist, state the following limitations to the client:
  1.  **Rationality Assumption:** Iterated elimination (pruning, then re-checking) only works if the Counterparty is rational *and* knows you are rational *and* knows you know they are rational.
      *   *Default:* If the Counterparty is known to be emotional, political, or erratic, **stop after one round.** Do not iterate.
  2.  **Order Dependence:** If we used **Weak Dominance**, the surviving set depends on the order we crossed things out.
      *   *Conservative Default:* **Never eliminate based on Weak Dominance in the first meeting.** Only eliminate on Strict Dominance (Pure or Mixed). Keep Weakly dominated options but move them to the bottom of the list.
  3.  **The "Blunder" Risk:** Striking a weakly dominated option removes your safety net if the opponent makes a mistake.
      *   *Decision:* If the client is risk-averse regarding opponent behavior, keep Weakly dominated options.

  ---

  ## Part 2: Case Applications

  ### Case 1: The Three-Option Tender (Mixture Dominance)
  **Context:** Client is bidding on a construction tender. Counterparty is a Competitor's Bid Level.
  **Options:** Low Bid, Balanced Bid, High Bid.
  **Counterparty Moves:** Aggressive Price War, Status Quo.

  **Payoff Matrix (Estimated Profit $M):**
  | Client \ Comp | Price War | Status Quo |
  | :--- | :---: | :---: |
  | **Low Bid** | 10 | 50 |
  | **Balanced Bid** | 18 | 28 |
  | **High Bid** | 30 | 10 |

  **The Prune:**
  1.  **Pure Check:**
      *   Low vs. Balanced: Low wins on Status Quo (50>28), loses on War (10<18). No dominance.
      *   High vs. Balanced: High wins on War (30>18), loses on Status Quo (10<28). No dominance.
      *   *Result:* No pure elimination.
  2.  **Mixed Check:**
      *   Target: **Balanced Bid**.
      *   Mix: 50% Low + 50% High.
      *   *Calculation (Price War):* $0.5(10) + 0.5(30) = 20$. (20 > 18).
      *   *Calculation (Status Quo):* $0.5(50) + 0.5(10) = 30$. (30 > 28).
      *   *Result:* The Mix strictly dominates the Balanced Bid in both scenarios.
  3.  **Recommendation:**
      *   **Eliminate Balanced Bid.**
      *   *Reasoning:* "A randomized strategy between Low and High yields higher expected profit regardless of what the competitor does. The 'middle ground' option is mathematically dead weight."
      *   *Implementation Note:* In practice, this doesn't mean flipping a coin. It means structuring a bid that captures the upside of the Low bid (volume) and High bid (margin) without the specific cost structure of the 'Balanced' offer. Or, it signals that the Balanced cost structure is inefficient.

  ### Case 2: The Client's Favorite (Diplomatic Elimination)
  **Context:** Contract Negotiation. Client wants "Standard Terms."
  **Options:** Premium Terms (Client Favorite), Standard Terms (Client Favorite), Basic Terms.
  **Counterparty Moves:** Accept Quickly, Drag Out Negotiations.

  **Payoff Matrix (Score 1-100):**
  | Client \ Comp | Accept Quickly | Drag Out |
  | :--- | :---: | :---: |
  | **Premium** | 100 | 0 |
  | **Standard (Fave)** | 40 | 40 |
  | **Basic** | 0 | 100 |

  **The Prune:**
  1.  **Pure Check:** No row dominates another.
  2.  **Mixed Check:**
      *   Target: **Standard (Fave)**.
      *   Mix: 50% Premium + 50% Basic.
      *   *Calculation (Accept):* $0.5(100) + 0.5(0) = 50$. (50 > 40).
      *   *Calculation (Drag Out):* $0.5(0) + 0.5(100) = 50$. (50 > 40).
      *   *Result:* The Mix strictly dominates the Standard option.
  3.  **The Finding:** The Client's favorite option is strictly dominated by a mixture of the two extremes.

  **How to Present This Without Losing the Room:**
  *Do not say:* "Your favorite idea is mathematically stupid."
  *Do say:* "The analysis shows that the 'Standard' position locks us into a capped outcome (40) regardless of how the counterparty reacts. However, if we maintain **optionality** between Premium and Basic, our expected value rises to 50 in either scenario."

  *   **Reframing the Mix:** "We aren't suggesting you flip a coin. We are suggesting that 'Standard' is a false compromise. You are better off preparing two distinct playbooks: one aiming for the Premium win, one prepared for the Basic fallback. The act of preparing for both extremes hedges your risk better than committing to the middle."
  *   **[JUDGMENT POINT 3]:** If the Client is emotionally attached to "Standard" for non-quantifiable reasons (brand reputation, internal politics), **do not eliminate.** Mark it as "Dominated by Portfolio Strategy" but keep it if the Client insists. The math says drop it; the consulting relationship says listen.

  ---

  ## Summary of Judgment Calls
  *   **[JUDGMENT POINT 1] (Vague Data):** When payoff ranges overlap, assume **no dominance**. It is better to keep an option and analyze it later than to prune a winner based on fuzzy math.
  *   **[JUDGMENT POINT 2] (Complex Mixes):** If a mix requires precise weighting (e.g., 43% Option A) to dominate, treat it as **no dominance**. In early strategy, robustness matters more than optimization.
  *   **[JUDGMENT POINT 3] (Client Preference):** If a dominated option is the Client's "pet project," flag the dominance but **do not prune** unless the Client explicitly authorizes it. Use the dominance finding to negotiate scope or resources, not to veto leadership.

  ## Conservative Default Rule
  **Always default to Strict Dominance for elimination.**
  *   **Strict:** Safe to eliminate (rational opponent or not).
  *   **Weak:** Keep the option, but mark it "Low Priority."
  *   **Why:** Weak dominance elimination relies on the opponent *never* playing the specific move where the payoffs tie. If the opponent blunders, the weakly dominated option might be your only safe harbor. In a first meeting, you cannot assume away blunders.
