      *   **Finalist R.:** 29, daughter of celebrated novelist. Manuscript extraordinary (formally daring, emotionally precise). Written in 11 months at funded residency. *Crucial:* Two complete line edits by a well-known freelance editor paid by her father. Disclosure was misleading ("friend read manuscript").
      *   **Finalist S.:** 56, self-taught, warehouse worker. Manuscript worked on 9 years on phone during breaks. No help. Prose uneven, occasionally startling, structurally rough. Needs funding more (human sense).
