answer: |-
  **TO:** Fellowship Jury Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation for Biennial Fellowship Award

  Colleagues,

  We are deadlocked because the Deed of Gift asks us to do two things that may be mutually exclusive: "honor" the art of the novel and "further" it. Honoring suggests a reward for achievement already realized; furthering suggests an investment in potential not yet fully secured. My recommendation is that we award the fellowship to **S.**

  I make this recommendation not because S. needs the money more, though he does. Nor do I make it because I believe S. possesses more inherent talent than R. On the page alone, R.'s manuscript is the superior object. It is coherent, polished, and ready. If this were a prize for a published book, R. would win unanimously. But this is a fellowship for an *unpublished* novelist, designed to launch a career.

  Our Chair argues that judging anything but the page converts us into a hardship agency. This is a clean standard, and I respect its resistance to sentimentality. However, a pure page-judging standard in a vacuum quietly converts inherited advantage into earned distinction. R.'s manuscript is polished because she was handed the polishing. To ignore the conditions of production is not neutrality; it is an endorsement of the status quo.

  The third position—that desert is illusory because S.'s persistence is as unchosen as R.'s privilege—is the hardest to answer. It is true: S. did not "earn" his temperament any more than R. earned her connections. If we prize persistence, we are still privileging a biological lottery. But the fellowship's function is not to measure moral worth. It is to intervene in the ecosystem of the art. R. has already been intervened upon; her path has been cleared by residency and professional editing. S. has met only resistance. To "further the art" means to remove barriers that prevent work from reaching its audience. Awarding R. adds a finished book to the world; awarding S. unlocks a voice that might otherwise remain silent. That is a higher return on the foundation's mission.

  We must also address the integrity of the process. R. disclosed her editorial assistance as "a friend reading the manuscript." This is technically true in the way a manslaughter is a disagreement. Our rules require disclosure of substantial assistance. While I do not wish to disqualify R. solely on this ground, the minimization of paid professional labor undermines the "honor" clause of our Deed. It suggests a comfort with opacity that our fellowship should not validate.

  To prevent this ambiguity in future cycles, I propose we adopt the following disclosure rule:

  > **Proposed Rule:** Applicants must disclose any editorial assistance involving compensated professional services, including the editor's credentials and the scope of work (e.g., line editing, developmental). Uncompensated peer review or workshop feedback requires no disclosure.

  This distinguishes between the communal act of writing (which we encourage) and the purchasing of polish (which must be transparent). It is administrable: jurors simply check for the presence of a financial transaction regarding editorial labor.

  I know those of you advocating for R. fear we are lowering our literary standards. We are not. We are acknowledging that a manuscript is not a meteorite found in a field; it is a product of conditions. By choosing S., we accept a rougher text in exchange for a clearer conscience regarding what this fellowship is for. We are not auditing merit; we are cultivating possibility.

  Let us choose the candidate for whom this fellowship is not a confirmation, but a beginning.

  Respectfully,

  [Your Name]
