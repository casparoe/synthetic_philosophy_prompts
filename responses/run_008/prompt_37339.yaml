      *   *Wait, actually:* The strongest ethical path is often the procedural one. But the prompt asks to treat the philosophical question as live. A memo that says "R. broke the rules, so S. wins" is too clean. A memo that says "S. wins because we are investors, not auditors, despite R.'s superior polish" is more nuanced.
