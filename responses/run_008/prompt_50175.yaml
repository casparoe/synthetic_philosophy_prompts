      *   *Okay:* The scenario needs to be neutral enough that the *student* can argue either side. But to test the NIP, usually, there needs to be some reason to think it *might* be wrong (e.g., it violates a right, or it's reckless).
      *   *Better angle:* Let's make the decision *negligent* but luckily harmless. The manager didn't check the schedule properly, but it turned out fine. This triggers the "wrongdoing" intuition (negligence) without the "harm" outcome.
