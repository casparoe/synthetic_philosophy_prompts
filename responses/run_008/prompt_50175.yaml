      *   **Goal:** Needs a *new* thought experiment (case study) to avoid summarizing standard literature (Parfit's depletion, young mother, etc.).
      *   **Core Question:** Does the intuition of wrongdoing in NIP cases depend on the later people being *worse off* than the alternatives? (i.e., Is the "harm" condition necessary for the wrong?)
      *   **Specifications:**
          1.  Nonidentity must be a by-product, not the goal (no genetic selection, no resource depletion, no parenting timing choices).
          2.  Actual people must be at least as well off as alternatives (no harm/worse-off condition).
          3.  Mechanism must be checkable/visible (e.g., scheduling shifts affecting conception), not stipulated.
          4.  One paragraph, realistic, everyday scale (no sci-fi, no grand policy).
      *   **Follow-up:** Demonstrate how different ethical views (Total Utilitarianism, Person-Affecting View, Victimless Wrong View) handle the case. Analyze which feature does the work, what happens if Clause 2 is removed, and how a Person-Affecting defender would attack it.
      *   **Tone/Level:** Defensible in a viva (oral defense), clear reasoning over jargon.

  2.  **Deconstruct the Challenge:**

      *   *Constraint 1 (By-product):* Most NIP cases involve direct reproductive choices (having a kid now vs. later) or policies affecting future generations (climate change). I need something mundane that shifts *who* exists without being *about* who exists.
      *   *Constraint 2 (No Harm):* The actual people must have lives worth living and be as well off as the alternatives. This is the crux of the NIP.
      *   *Constraint 3 (Mechanism):* Needs a causal chain showing *why* different people exist. Usually, this involves time shifts affecting sperm/egg combinations.
      *   *Constraint 4 (Scale):* Everyday scale. Not "The Government passes a law." More like "A manager changes a shift."

  3.  **Drafting the Scenario (Iterative Process):**

      *   *Attempt 1 (Traffic Light):* A town changes a traffic light timing. People arrive home at different times, conceive different kids. *Critique:* A bit cliché, feels like policy.
      *   *Attempt 2 (Office Renovation):* A company moves offices. Commutes change. Conception times change. *Critique:* Good, but needs to ensure the workers aren't worse off.
      *   *Attempt 3 (The Coffee Shop Shift):* A manager changes the shift schedule.
      *   *Refining Attempt 3:* Let's make it about a specific logistical change that alters daily routines slightly. A university changing seminar times? A factory changing break times?
      *   *Selection:* **The Factory Break-Time Swap.** It's mundane, economic, and clearly affects when people meet/return home.
      *   *Drafting the content:* A factory manager swaps the morning and afternoon break times for efficiency. Workers go home at slightly different times. This shifts conception timing for many couples. The new schedule is slightly more efficient, leading to a small bonus for workers (ensuring they aren't worse off).
      *   *Checking Constraints:*
          1.  Decision is about efficiency, not reproduction. (Pass)
          2.  Workers get a bonus/welfare is maintained. Children born have good lives. (Pass)
          3.  Mechanism: Break time -> Arrival home -> Conception timing -> Different sperm/egg. (Pass)
          4.  One paragraph, realistic. (Pass)

  4.  **Developing the Analysis:**

      *   *Total View (Utilitarian):* Focuses on total welfare. If the new people have good lives and the workers are happier/richer, the action is good.
      *   *Person-Affecting View (PAV):* Requires a victim. No one is worse off. The children exist and are happy. The workers are happier. So, no wrong done.
      *   *Victimless Wrong View (Impersonal):* Might say the state of affairs is worse for some other reason (e.g., fairness, rights), even if no individual is harmed. Or, in the context of NIP, this view usually captures the intuition that something *seems* off despite no victim.
      *   *Key Feature:* The "By-product" nature (Constraint 1) combined with "No Harm" (Constraint 2).
      *   *Removing Clause 2:* If the workers were worse off (pay cut), it becomes a standard harm case. The NIP disappears because we can blame the harm to the workers.
      *   *PAV Attack:* The defender might say the "alternative people" aren't the right comparison. Or they might argue the wrong lies in the *risk* or the *intent*, not the outcome. I need to focus on the "No Victim" claim. The strongest PAV reply is usually "No wrong was done because no one can complain."

