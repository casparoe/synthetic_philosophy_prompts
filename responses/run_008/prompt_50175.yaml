      *   *Decision:* I will construct the scenario to be morally neutral on the surface, so the *only* potential wrong is the structural NIP issue. This allows the student to argue: "Do we feel this is wrong? If yes, PAV is in trouble. If no, NIP relies on hidden harm."
      *   *Wait, one more check:* The prompt says "The case I need is the probe for this." So the case must allow the probe to function.
