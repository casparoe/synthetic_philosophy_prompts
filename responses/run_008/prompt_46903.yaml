answer: |-
  My assessed credence that the historical expansion of the moral circle constitutes truth-apt moral progress is **0.35**.

  While this sits between your optimism (0.65) and your friend's scepticism (0.20), it leans closer to the sceptical end. This reflects the difficulty of disentangling genuine moral discovery from the sociological and economic byproducts of modernity. Below is the decomposition of this figure, followed by an analysis of the complications you raised and the source of your disagreement.

  ### Decomposition of Credence

  I have broken the hypothesis down into four conjunctive probabilities. For the expansion to be truth-apt progress, all four conditions must broadly hold.

  **1. $P(\text{Realism}) = 0.65$**
  *Probability that some form of moral realism (or robust quasi-realism) is true.*
  **Justification:** This is the metaphysical hinge. If moral statements are merely expressions of preference (emotivism) or social contracts without external referents, 'progress' is simply change, not truth-apt improvement. I assign a slight majority probability to realism because the phenomenology of moral deliberation feels discovery-based rather than invention-based, and error theory struggles to explain the stability of certain moral intuitions across cultures. However, the lack of empirical access to moral facts keeps this from being higher.

  **2. $P(\text{Convergence} | \text{Realism}) = 0.85$**
  *Probability that, given realism, sustained moral inquiry converges on the truth rather than wandering.*
  **Justification:** Even if moral truths exist, we might lack the cognitive architecture to find them. However, the history of practical reason suggests that inconsistencies (e.g., holding that 'all men are created equal' while practising slavery) tend to be resolved over time through argumentation. I am optimistic that reason acts as a corrective mechanism, provided inquiry is sustained, though cognitive biases remain a significant drag.

  **3. $P(\text{Tracking} | \text{Convergence}, \text{Realism}) = 0.70$**
  *Probability that the actual historical expansion tracked this convergence, rather than being driven by morally neutral factors.*
  **Justification:** This is the sociological hinge. Scholars like Steven Pinker and Peter Singer argue for the 'escalator of reason', but historical materialists and genealogists (e.g., Foucault) argue that moral shifts often follow economic necessities (e.g., wage labour replacing slavery due to efficiency, not benevolence). I discount this term significantly because trade interdependence, affluence, and coalition politics offer sufficient non-moral explanations for much of the 'expansion'. The correlation between wealth and human rights is strong, making causation difficult to attribute purely to moral insight.

  **4. $P(\text{Net Direction} | \text{Tracking}) = 0.90$**
  *Probability that the long-term trend is positive despite non-monotonicity and 'false positive' expansions.*
  **Justification:** This term accounts for the complications you noted. It accepts that while there are regressions and delusions of progress, the vector over centuries remains outward. I keep this high because temporary contractions (like eugenics) are usually recognised and repudiated by later generations within the same expanded framework, suggesting a learning process rather than a random walk.

  **Calculation:**
  $$0.65 \times 0.85 \times 0.70 \times 0.90 \approx 0.35$$

  ### Weighing the Complications

  You raised two significant challenges that specifically depress the **Tracking** and **Net Direction** terms.

  **1. Non-monotonicity and Eugenics**
  The Progressive Era eugenics movement is a potent counter-example because it was explicitly framed as an expansion of concern to 'future generations'. In my decomposition, this attacks the **Tracking** term. It demonstrates that moral inquiry can converge confidently on falsehoods if the empirical premises (e.g., hereditarian science) are flawed. However, the fact that eugenics is now universally condemned within the same moral framework that once supported it suggests the system has self-correcting properties. This supports the **Net Direction** term: the circle expanded to include the future, contracted via error, and then re-expanded with better epistemic hygiene.

  **2. Sentiment vs. Practice (Factory Farming)**
  The rise of animal welfare sentiment alongside industrialised slaughter suggests a decoupling of the 'moral circle' (attitudes) from actual treatment. This complicates the measurement of progress. If the circle is defined by *stated* concern, expansion is real; if defined by *suffering inflicted*, it may be contracting. I treat this as noise in the **Tracking** term. It suggests that while our *abstract* moral principles are expanding (animals matter), our *institutional* capacity to align practice with principle is lagging. This does not necessarily negate progress, but it indicates that the expansion is currently incomplete and fragile.

  ### Explaining the Disagreement (0.65 vs 0.20)

  The gap between you and your friend is most likely located in the **Tracking** term ($P(\text{Tracking} | \text{Convergence}, \text{Realism})$).

  *   **Your position (0.65):** You likely assign a high probability (perhaps >0.90) to Tracking. You view the historical correlation between moral argument and policy change (e.g., abolitionist literature preceding emancipation) as evidence that reason drives history. You interpret the complications (eugenics) as temporary stumbles in a generally upward trajectory.
  *   **Your Friend's position (0.20):** She likely assigns a low probability to Realism (<0.40) *or* a very low probability to Tracking (<0.40). If she is a historical materialist, she believes that 'moral progress' is a post-hoc narrative we tell to justify shifts in economic modes of production. To her, the abolition of slavery was driven by the inefficiency of slave labour in an industrialising world, not by a sudden realisation of universal human dignity. The 'moral circle' is merely the ideological superstructure of changing material conditions.

  My credence of 0.35 splits the difference: I acknowledge the power of material drivers (lowering Tracking) without conceding that morality is *entirely* epiphenomenal (keeping Realism and Convergence moderate).

  ### Evidence That Would Move My Number

  To move my credence significantly, I would require evidence that disentangles moral reasoning from material incentive.

  1.  **Counterfactual Historical Analysis:** Robust modelling showing that moral reforms (e.g., civil rights, animal welfare) would have occurred *even in the absence* of economic benefit or strategic necessity. If abolition can be shown to have been economically detrimental yet pursued anyway due to moral pressure, the **Tracking** term would rise sharply.
  2.  **Universal Moral Grammars:** Discovery of cognitive structures analogous to Chomsky's universal grammar, but for ethics. If we found that moral learning is constrained by innate structures that predispose humans towards specific expansions (e.g., impartiality) regardless of culture, the **Convergence** term would increase.
  3.  **AI Alignment Success/Failure:** If we successfully align an AI with 'human values' and that AI independently identifies our historical moral blind spots (e.g., treating certain forms of suffering we ignore as paramount), it would suggest there is a truth to be found (**Realism**). Conversely, if the AI simply mirrors our contradictions without resolution, it supports the sceptic's view.

  In summary, while the arc of history appears to bend towards justice, it is difficult to prove that the bend is caused by the gravity of moral truth rather than the centrifugal force of economic and social change. Hence, my credence remains modest.
