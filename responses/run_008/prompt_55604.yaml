answer: |-
  This is a remarkably sharp diagnosis of a well-known stagnation in the literature. You are correct that the debate has largely calcified since the Soames/Chalmers exchanges in the mid-2000s (*Reference and Description* vs. *The Components of Meaning*).

  You are asking for a meta-philosophical diagnosis of the stalemate. Here is the breakdown of your candidates, followed by the straight talk on why this isn't moving.

  ### Evaluating Your Candidates

  **(a) The Verbal/Metasemantics Charge:**
  You are half-right, but it's deeper than just "intension" meaning different things. It is a disagreement about the **boundary of semantics**.
  *   **Soames** draws the line sharply: Semantics delivers the proposition expressed (content). How that content is fixed (reference fixing) is metasemantics or psychology.
  *   **Chalmers** argues that the "epistemic dimension" *is* part of the semantic value because it governs rational inference and cognitive significance.
  *   **Verdict:** It's not merely verbal. If it were, you could translate one into the other without loss. But you can't, because Chalmers needs the primary intension to do *work* (explain cognitive significance) that Soames bans from the semantic module. It's a boundary dispute, not a dictionary dispute.

  **(b) The Proxy War:**
  This is the strongest explanatory factor for the *intensity* of the stalemate.
  *   **Chalmers:** 2D semantics is the engine for the Zombie Argument. Primary intensions map conceivability to possibility. If 2Dism fails, the link between epistemic and metaphysical modality weakens, and physicalism becomes harder to attack via conceivability.
  *   **Soames:** He knows this. He attacks 2Dism partly because he thinks it smuggles in a descriptivism that validates bad modal epistemology.
  *   **Verdict:** You hit the nail on the head. You aren't moving because you are fighting a semantic battle with metaphysical ammunition. Until you explicitly debate the *conceivability-possibility principle*, the semantic argument will remain a proxy.

  **(c) Evidence-Starved:**
  This is the methodological bottleneck.
  *   Both sides accommodate the "Necessary A Posteriori" data (e.g., "Water is H2O").
  *   **Soames:** One proposition, necessary, known a posteriori. The "contingent feel" is epistemic, not semantic.
  *   **Chalmers:** Two propositions. One contingent (known a priori), one necessary (known a posteriori).
  *   **Verdict:** Linguistic data underdetermines the theory. Both frameworks are empirically equivalent regarding truth conditions of standard assertions. The fight is about *theoretical virtue* (parsimony vs. explanatory unity), not data coverage.

  **(d) The Stalnaker/Scope Issue:**
  This is crucial for understanding the *origin* of the friction.
  *   **Stalnaker:** Diagonalization is a pragmatic tool for handling assertion in contexts where the common ground is uncertain. It's about *communication*, not *meaning*.
  *   **Chalmers/Jackson:** Inflated diagonalization into a theory of *meaning* and *modality*.
  *   **Verdict:** The stall is partly due to "Scope Creep." Soames is attacking the inflated version (2D as a theory of meaning) while Stalnakerians can retreat to the modest version (2D as a theory of context update). Your friend is likely using the Inflated version; you are attacking it with the Direct Reference intuition that fits the Modest version better.

  ---

  ### The Diagnosis: Explanatory Target Mismatch

  The reason you haven't moved in six years, and the literature hasn't moved in fifteen, is that **you are optimizing for different explanatory virtues.**

  This is not a dispute about the data (the truth conditions of sentences). It is a dispute about **what semantics is supposed to explain.**

  1.  **Soames (Your Side):** Optimizes for **Metaphysical Parsimony**.
      *   Goal: Align semantic content with the structure of reality.
      *   Virtue: Don't multiply propositions beyond necessity. If "Hesperus is Phosphorus" is necessary, the semantic content should reflect that necessity directly. The "epistemic contingency" is a fact about *us*, not the *sentence*.
      *   Cost: Leaves cognitive significance (why "Hesperus is Hesperus" feels different from "Hesperus is Phosphorus") to psychology/pragmatics.

  2.  **Chalmers (Friend's Side):** Optimizes for **Epistemic Systematicity**.
      *   Goal: Align semantic content with rational inference and modal epistemology.
      *   Virtue: Explain why we can rationally doubt necessary truths. Connect meaning to conceivability.
      *   Cost: Multiplies semantic values (primary vs. secondary). Risks conflating metaphysical and epistemic modality.

  **Why this causes a stall:**
  You cannot win this argument with a whiteboard and examples of natural kind terms.
  *   When you present a case where Direct Reference works, your friend says, "Sure, but it doesn't explain the *cognitive role*."
  *   When your friend presents a case where Primary Intensions explain conceivability, you say, "Sure, but that's psychology, not semantics."

  You are playing different games. You are playing **Truth-Conditional Baseball**; he is playing **Modal Epistemology Soccer**. You keep arguing about whether the ball is in the net, but he's trying to score a goal in a different stadium.

  ### Straight Talk: Is the Question Ill-Posed?

  **No, the question isn't ill-posed, but the expectation of resolution is misplaced.**

  This is a **Paradigm Clash**, not a puzzle waiting for a missing piece. It is similar to the debate between Fregeans and Millians, or Internalists and Externalists. These debates rarely end with one side conceding. They end when the field loses interest or shifts focus.

  **Is it because there's no sharable datum?**
  Yes. The "data" (our intuitions about "Water is H2O") is compatible with both models. The models differ in how they *structure* the explanation of that data.

  **What would progress look like?**
  Since linguistic data won't solve it, progress would have to come from one of three places:

  1.  **Formal Collapse:** A formal proof showing that 2D semantics is reducible to 1D semantics plus a theory of context (or vice versa). Some work by **Andy Egan** or **Brian Rabern** touches on this, suggesting 2Dism might just be 1Dism relativized to contexts. If 2Dism is just Kaplan + Context, Soames wins (it's not a new semantics). If it's irreducible, Chalmers wins.
  2.  **External Pressure (Cognitive Science):** If psycholinguistics or cognitive science demonstrated that the human brain actually processes two distinct layers of content during comprehension, Chalmers gets a massive boost. If it shows we only track one referent with descriptive heuristics, Soames wins. (Currently, the science is too muddy to help).
  3.  **Metaphysical Breakthrough:** If someone solves the Hard Problem of Consciousness or definitively settles the nature of modality, the *motivation* for 2Dism (the Zombie Argument) either vanishes or becomes undeniable.

  ### Recommendation for the Next Round

  If you want to break the six-year loop, stop talking about "Water" and "Hesperus."

  1.  **Call the Proxy War:** Explicitly ask your friend: *"If we grant 2D semantics, does the Zombie Argument go through? If we deny it, does it fail?"* If he says yes, admit you are actually fighting about modal epistemology, not semantics.
  2.  **Test the Scope:** Ask him if he endorses the **Stalnakerian** modest version (diagonal for assertion) or the **Chalmersian** inflated version (diagonal for meaning). If he retreats to Stalnaker, you win (that's just pragmatics). If he stays with Chalmers, press him on **why** semantics needs to carry the load of epistemic possibility.
  3.  **The "Soames Test":** Ask him to identify a specific linguistic inference that is valid on 2D semantics but invalid on Direct Reference + Pragmatics. If he can't, then by Occam's Razor, the secondary intension is doing all the semantic work, and the primary intension is indeed just "descriptivism with better typography."

  **The Verdict on the Stall:**
  The literature is stalled because the debate exhausted its linguistic data in 2005. It is now a fight over theoretical virtues. You value ontological parsimony; he values epistemic transparency. Neither is "wrong," but you won't convince each other until one of you decides the other's virtue is more important than your own.
