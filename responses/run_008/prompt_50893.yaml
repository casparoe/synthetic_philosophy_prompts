      *   *Claim 2 (Hypocrisy):* Standard view on standing (Macnamara, Bell, etc.). Hypocrites lack standing.
      *   *Claim 3 (Fairness):* The justification for (2). It's about unequal application of norms.
      *   *Claim 4 (Self-effacing):* If you own the fault, you keep standing. This aligns with (2) because (2) specifies "hasn't owned up to it." So (2) and (4) are consistent *on the surface*.
      *   *Claim 5 (Victimhood):* Standing is general moral standing, not specific to harm received. Consistent with standard non-victim blaming theories.
      *   *Claim 6 (All-or-nothing):* Standing is binary. You have it or you don't.
      *   *Case Verdict (Reformed Gossiper):* The friend reformed (so not currently guilty?), but the intuition is she has a "thinner license."

  3.  **Identify Tensions:**

      *   **Tension A: Claim 6 (Binary) vs. Case Verdict (Thinner License).**
          *   *Analysis:* Claim 6 says standing is all-or-nothing. The Case Verdict says the reformed friend's license feels "thinner." "Thinner" implies degrees. If standing is binary, you can't have "less" standing, only "no" standing.
          *   *Severity:* High. This is a direct contradiction between a theoretical principle and the phenomenological data the user is admitting to.
      *   **Tension B: Claim 3 (Fairness) vs. Claim 5 (Bystanders).**
          *   *Analysis:* Claim 3 says hypocrisy is unfair because you treat the norm as optional for yourself but binding on others. Claim 5 says bystanders can blame. Does the fairness argument apply to bystanders? If a bystander blames, are they holding the agent to a demand? Yes. But does the fairness argument regarding *hypocrisy* rely on the blamer being bound by the norm? Usually, yes. But Claim 5 is about *victimhood*, not hypocrisy. Wait, let's look closer. Is there a tension between Fairness (3) and Bystanders (5)? Not necessarily. A bystander can be non-hypocritical.
          *   *Re-evaluation:* Actually, the tension is between Claim 3 (Fairness as the *reason* for standing) and Claim 5 (Standing independent of stake). If standing is based on fairness in holding to demands, does being a victim matter? Claim 5 says no. This seems okay.
          *   *Wait, is there a tension between Claim 4 and Claim 6?* Claim 4 says self-effacing critics have *full* standing. Claim 6 says standing is binary. This fits.
          *   *Wait, is there a tension between Claim 2 and the Case Verdict?* Claim 2 says hypocrisy (guilty + unowned) removes standing. The friend *gave up gossiping years ago*. So she is not currently guilty. So Claim 2 doesn't apply to her directly. She is a "reformed sinner."
          *   *The Real Problem:* The Case Verdict intuition ("thinner license") contradicts Claim 6 ("all-or-nothing"). If she has standing, it should be full. If it's thinner, standing isn't all-or-nothing.
      *   **Tension C: Claim 3 (Fairness) vs. Claim 4 (Self-effacing).**
          *   *Analysis:* Claim 3 says the problem with hypocrisy is treating the norm as optional for you. Claim 4 says if you admit you do it, you have full standing. But if you admit you do it, you are *still* treating the norm as optional for yourself (you're still violating it). You're just honest about it. So why does honesty restore the fairness condition? If the unfairness is the *violation* + *blaming*, admitting the violation doesn't stop the violation.
          *   *Severity:* Medium-High. This challenges the justification for (2) and (4). If fairness is the ground, honesty doesn't fix the unequal application of the norm.
      *   **Tension D: Claim 1 (Address) vs. Claim 6 (Binary).**
          *   *Analysis:* If blame is address/protest, the *appropriateness* of the address might vary based on relationship/history. Claim 6 says standing (entitlement to address) is binary. But communicative norms often admit of degrees of appropriateness.
          *   *Severity:* Low-Medium. More of a theoretical friction than a contradiction.

  4.  **Develop the Fixes and Costs:**

      *   **Fix for Tension A (Binary vs. Thinner):**
          *   *Option 1:* Drop Claim 6. Allow degrees of standing.
