answer: |-
  Here is a reading of *Lincoln* through the lens of Walzer's "Problem of Dirty Hands," designed to serve as the backbone for your seminar discussion. It is structured to move from textual application to philosophical critique, ending with historical caveats and the unique contributions of the cinematic medium.

  ***

  # Seminar Reading Guide: Dirty Hands in *Lincoln*

  ## I. Mapping the Film onto Walzer's Framework

  Walzer's 1973 essay posits a specific paradox: the moral leader is sometimes required to commit a moral wrong to achieve a greater political good. Crucially, Walzer argues that the act remains a *wrong* even if it is *justified*. Therefore, the leader must acknowledge the transgression through guilt or anguish. A leader who commits the act without psychological cost is, for Walzer, dangerous.

  *Lincoln* provides three distinct tiers of action to test against this framework:

  1.  **The Vote-Buying Operation (Seward's Lobbyists):** The employment of patronage, cash, and government jobs to sway lame-duck Democrats.
      *   *Walzerian Analysis:* This is the clearest candidate for "dirty hands." It involves corruption (a recognized wrong) to secure the 13th Amendment (a recognized supreme good).
  2.  **The Confederate Commissioners (Strategic Concealment):** Lincoln's decision to withhold information from Congress about the arrival of peace envoys, fearing news of imminent peace will kill the amendment vote.
      *   *Walzerian Analysis:* This is deception of the sovereign body (Congress) by the Executive. It undermines democratic transparency for the sake of constitutional permanence.
  3.  **Thaddeus Stevens' Rhetorical Compromise:** Stevens denies his belief in full social and political equality on the House floor to secure moderate votes.
      *   *Walzerian Analysis:* This is a "dirtying" of truth-telling. Stevens sacrifices his moral integrity (honesty about equality) to achieve a partial moral victory (legal emancipation).

  ## II. The Coherence Debate: Justified Wrongdoing or Normal Politics?

  A central live dispute in the literature is whether Walzer's category is coherent. Critics (e.g., Statman, Tessitore) ask: If an act is morally justified *all things considered*, in what sense is it "wrong"? If it is truly wrong, how can it be justified?

  **Discussion Angle:**
  Use the film to test whether these acts are *extraordinary* violations (Walzer's requirement) or *ordinary* legislative machinery.
  *   **The "Normal Politics" Defense:** One could argue that vote-counting, whip operations, and strategic timing are the grease of democracy. If every bill required "dirty hands" to pass, the concept loses its critical bite. In the film, the Republicans treat these tactics as mundane tools, not tragic necessities.
  *   **The Walzerian Rebuttal:** Walzer insists that in a liberal democracy, bribery and deception are *intrinsic* wrongs, not just instrumental costs. The film invites us to ask: Does the magnitude of the end (ending chattel slavery forever) transform ordinary corruption into justified wrongdoing? Or does it simply mask corruption in the guise of necessity?

  **Seminar Question:** *If Seward's men had used these tactics to pass a tariff bill, would we call it corruption? If the answer is yes, does the 13th Amendment change the moral category of the act, or just our tolerance for it?*

  ## III. The Problem of Guilt: Lincoln's Serenity

  Walzer's distinctive claim is that the leader *must* feel guilt. "The man who stays clean... is no good." He argues we should distrust the politician whose hands get dirty without visible cost.

  **The Film's Deviation:**
  Daniel Day-Lewis's Lincoln is notably serene. He is weary, haunted by the war's death toll, and burdened by dreams, but he does not exhibit *moral anguish* over the lobbying or the deception. He treats the vote-buying as a distasteful but necessary administrative task. He sleeps soundly while the Commissioners wait on the boat.

  **Interpretive Options for Discussion:**
  1.  **Failure of Dramatization:** The film fails Walzer's test. It presents a "great man" whose virtue is so immense it inoculates him against the moral stain of his actions. This risks validating the "dangerous leader" Walzer warns against.
  2.  **Refutation of Walzer:** Lincoln's calm suggests that if the act is truly justified, guilt is inappropriate self-indulgence. The "right thing" was done; anguish would imply doubt where there should be resolve.
  3.  **Re-categorization:** Perhaps the film argues these aren't "dirty hands" cases at all. If the actions are viewed as *political necessity* rather than *moral transgression*, guilt is irrelevant. Lincoln distinguishes between "moral principles" (equality) and "political actions" (votes).

  **Seminar Question:** *Walzer says we should distrust a leader who doesn't suffer for their dirty deeds. Lincoln suffers greatly, but not for his deeds—for the war. Does this distinction save him from Walzer's critique, or does it confirm that he views the dirtying of hands as too trivial to warrant anguish?*

  ## IV. Distinguishing the Moral Structures: Bribery vs. Concealment

  The film treats bribery and concealment differently, and your seminar should too.

  *   **Bribery (Seward's Men):** This corrupts the *individual* integrity of the voters (the Congressmen). It treats them as venal. Lincoln maintains plausible deniability ("I don't want to know").
  *   **Concealment (The Commissioners):** This corrupts the *institutional* integrity of the legislature. It denies Congress the information needed to exercise its sovereign will.

  **Analysis:**
  Walzer focuses on the agent's soul. But the film highlights the systemic cost. Lincoln's plausible deniability distributes the moral agency. Seward does the dirt; Lincoln reaps the benefit.
  *   *Does the film track the difference?* Yes. Lincoln is visibly more tense regarding the Commissioners (the constitutional crisis) than the bribery (the political transaction). He lies to Congress about the Commissioners; he merely ignores the mechanics of the bribery.
  *   *Philosophical Implication:* This suggests a hierarchy of "dirt." Deceiving the sovereign body may be "dirtier" than buying individual votes, because it attacks the democratic process itself, whereas vote-buying merely exploits existing individual vice.

  ## V. Historical Caveats: The "Necessity" Claim

  **Crucial Context for Students:**
  Walzer's framework relies on *extreme circumstances* (the "ticking bomb" scenario applied to politics). The film's ethical weight rests entirely on the claim that the Amendment *had* to pass in January 1865, or it would be lost forever.

  *   **Contested History:** Many historians argue this is a dramatic invention by screenwriter Tony Kushner. While Lincoln wanted the amendment passed quickly, there is little evidence that peace would have permanently halted Reconstruction or that the Amendment would have failed had the war ended a month later. The "race against time" creates the cinematic necessity that justifies the dirty hands.
  *   **Pedagogical Warning:** If the necessity is exaggerated, the Walzerian justification weakens. If the crisis was not as existential as the film portrays, the "dirty hands" become mere "dirty politics."
  *   **Discussion Point:** Ask students to evaluate the ethics *assuming the film's premise is true*, and then *assuming the historians are right*. Does the moral evaluation of Lincoln's deception change if the peace commissioners could have waited without jeopardizing the vote?

  ## VI. What the Film Adds to the Philosophical Debate

  The philosophical literature often abstracts the agent: "The Leader" makes a choice. *Lincoln* concretizes the distribution of agency, offering three insights Walzer's essay does not fully capture:

  1.  **Plausible Deniability as Moral Buffer:** Walzer imagines the leader getting their *own* hands dirty. The film shows the leader constructing a system where *others* get dirty on their behalf. Lincoln tells Seward, "I don't want to know." This complicates Walzer's guilt requirement. Can Lincoln feel guilt for acts he technically didn't order? The film suggests he can, and does, by accepting the moral weight of the outcome without claiming the agency of the method.
  2.  **The Banality of Dirty Hands:** Philosophical examples often involve torture or execution. The film shows dirty hands as patronage jobs, awkward dinners, and bureaucratic delays. It demystifies the "tragic choice," suggesting that in a democracy, dirty hands are rarely bloody; they are usually transactional.
  3.  **The Cost to the Ally (Stevens):** Walzer focuses on the Executive. The film gives us Stevens, the legislator who must dirty his own *voice*. Stevens' compromise highlights a different cost: the betrayal of one's own public truth. This adds a dimension of *integrity* to the *power* focused debate in Walzer. Stevens keeps his hands clean (he didn't take a bribe) but sullies his record (he lied about equality).

  ## VII. Suggested Discussion Questions

  1.  **On Coherence:** Walzer argues that the act remains a "wrong" even if justified. Does *Lincoln* treat the bribery as a "wrong," or does it reframe it as a "virtuous pragmatism"? If the latter, does that undermine Walzer's claim that guilt is necessary?
  2.  **On Distribution:** Lincoln employs a division of moral labor: Seward bribes, Lincoln legislates. Does this allow Lincoln to keep his hands cleaner than Walzer thinks possible? Is plausible deniability a way to evade the "cost" Walzer demands?
  3.  **On Necessity:** If historians are correct that the Amendment could have passed after the war ended, does Lincoln's deception of Congress regarding the Peace Commissioners become indefensible? Does the "dirty hands" justification collapse without absolute necessity?
  4.  **On Democracy:** Walzer writes about "Political Action" generally. Does the "dirty hands" problem change when the action requires deceiving a democratic legislature? Is there a difference between dirtying one's hands to save a state (Walzer's focus) and dirtying them to pass a law within a functioning state (Lincoln's focus)?

  ***

  ### Instructor's Note on Consensus
  Be careful not to present Walzer's view as the settled consensus. A significant portion of contemporary political philosophy rejects the "dirty hands" category as incoherent (arguing that if an act is morally required, it cannot be morally wrong). Others argue that Walzer's demand for guilt is psychologically unrealistic or politically unhelpful (we want leaders who can make hard choices without paralysis). Use the film to show *why* critics might reject Walzer: Lincoln's effectiveness seems tied to his *lack* of paralyzing guilt. If he had agonized over every vote, the amendment might have failed. This pragmatic success challenges Walzer's moral requirement.
