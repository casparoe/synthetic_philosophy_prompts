prompt: |-
  I'm a third-year PhD student in philosophy finishing a paper on precommitment and self-locating evidence, and my reading group on updateless-style decision theories has been stuck for three weeks on an argument one of the cognitive science students brought to our last session. He calls it the Collapse Argument, because if it works, updatelessness collapses into full-strength evidential reasoning and is then refuted by its own examples. Here it is as he gave it to us. (1) Updatelessness says: evaluate policies from a perspective before conditioning on some of your evidence, and choose the policy with the highest expected utility from there; the theory is notoriously quiet about which evidence to un-observe, so the natural reading is the broadest one — un-observe everything whose evidential content is relevant to the comparison. (2) In counterfactual mugging, that means computing value before learning the coin came up tails, which makes paying rational, because my choice at this node is logically linked to the predictor's earlier simulation of my decision procedure. (3) But the arithmetic of ex ante expectation doesn't distinguish between correlations that run through a simulation of my decision procedure and correlations that run through a common cause or shared statistical profile: in both cases the abstain-policy or the pay-policy simply comes out ahead when you compute expectation from far enough back. (4) So updatelessness must also tell me to abstain in the smoking-lesion setup, and, more generally, to manage the news about anything my policies correlate with, including my own past. (5) To test this: I should decline a free vacation in my hometown, because suppose a demographic study shows that people who decline such vacations overwhelmingly grew up in stable, loving households, and having had a stable childhood is a large component of my lifetime utility. Refusing cannot causally touch my childhood, but on the broad ex ante perspective, a better childhood is part of what I'm buying when I select the refusal-policy. (6) A theory that tells me to forgo pleasures in order to have had, evidentially, better childhoods is not a theory of rational choice; so updatelessness, read broadly, refutes itself.

  I can see two escape routes and dislike both. Denying (3) seems to require saying that logical dependence and mere evidential correlation come apart in a way the ex ante calculation must respect — but I had thought that refusing to care about the difference between causal and merely statistical structure was the entire point of the updateless turn; it's why it pays in counterfactual mugging. Denying the broad reading in (1) seems to leave the theory without a principled account of which evidence may be conditioned on, and I can't see how that isn't just patching the leaks case by case. My own instinct is that something goes wrong in (3), maybe that the "ex ante perspective" stops being a well-defined standpoint once you've thrown away all of your evidence rather than just the observation whose logical entanglement with your decision procedure is what made un-observing it valuable in the first place — but I can't make that precise, and I notice that I can't actually say what the reference class of "my decision procedure" is supposed to be in step (5) either, or whether the vacation-refusal is even an output of the same computation the demographic study is tracking. Which step would you reject, what does rejecting it cost, and why did the step look fine in the first place? One further request: please be explicit about what is settled among people who actually work on updateless and functional decision theories and what is genuinely contested — my sense is that the "which evidence do you un-observe?" question is a live dispute rather than a settled one, and I'd rather not walk into my advisor's office confidently repeating one side of it as if it were the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** Third-year PhD student in philosophy.
      *   **Topic:** Precommitment, self-locating evidence, updateless decision theories (UDT/TDT/FDT).
      *   **Problem:** A "Collapse Argument" presented by a cognitive science student in a reading group. The argument claims Updatelessness collapses into Evidential Decision Theory (EDT) and yields absurd results (like refusing a vacation to "have had" a better childhood).
      *   **User's Dilemma:** Sees two escape routes (deny logical vs. evidential distinction in ex ante calc, or deny the "broad reading" of which evidence to un-observe) but dislikes both. Suspects step (3) is the issue but can't formalize it.
      *   **Specific Request:** Identify which step to reject, the cost of rejection, why the step looked plausible, and *crucially* distinguish between settled consensus and live disputes in the field.

  2.  **Deconstruct the "Collapse Argument":**
      *   (1) *Definition:* Updatelessness = evaluate policies from a prior perspective (un-observe relevant evidence). Claim: Natural reading is "un-observe everything."
      *   (2) *Application (Mugging):* Un-observe coin flip. Paying is rational due to logical link with predictor.
      *   (3) *The Pivot:* Ex ante arithmetic doesn't distinguish logical dependence (simulation) from common cause/statistical correlation. Both boost expected utility from the prior.
      *   (4) *Implication:* Updatelessness implies EDT-like behavior (Smoking Lesion, News Management).
      *   (5) *Reductio:* Refuse vacation because refusing correlates with stable childhood (utility).
      *   (6) *Conclusion:* Absurdity -> Updatelessness refutes itself.

  3.  **Evaluate the Steps (Philosophical/Technical Analysis):**

      *   **Step (1):** "Natural reading is the broadest one." This is the weakest link technically. UDT doesn't say "un-observe everything." It says "optimize the input-output map of your decision algorithm from the perspective of the prior." The key is *logical* control, not just *evidential* correlation.
      *   **Step (3):** "Arithmetic... doesn't distinguish." This is false in the context of Functional Decision Theory (FDT) or UDT proper. The "arithmetic" involves a subjunctive dependence relation (or logical counterfactual), not just conditional probability $P(World | Action)$. EDT uses $P(World | Action)$. UDT/FDT uses $P(World | do(Action))$ where 'do' is logical intervention, not causal intervention.
      *   **Step (5):** The vacation example relies on a purely statistical correlation without a logical link between the *algorithm* output and the *past fact*.

  4.  **Identify the Core Philosophical Dispute:**
      *   The cognitive science student is conflating **Updateless Decision Theory (UDT)** / **Functional Decision Theory (FDT)** with **Evidential Decision Theory (EDT)** viewed from a prior perspective.
      *   The "Collapse" happens only if you define the "policy" merely as a physical action correlated with outcomes, rather than the output of a specific *computation* that is instantiated in multiple places (predictor, agent, etc.).
      *   *Settled:* Proponents of UDT/FDT explicitly reject EDT. They agree that logical/subjunctive dependence is required, not just statistical correlation.
      *   *Contested:* How to formalize "logical dependence" (logical counterfactuals vs. proof-based vs. similarity metrics). Also, the "Which evidence to un-observe?" question (Indexical information, self-locating beliefs) is indeed live.

  5.  **Formulate the Response Strategy:**

      *   **Validate the User:** Acknowledge the sophistication of the argument. It's a known type of objection (the "Why ain'cha rich?" or "Newcomb's Problem for UDT" style objection), but the specific formulation here conflates UDT with Prior-EDT.
      *   **Target Step (3):** This is the technical error. The "arithmetic" *does* distinguish, provided the decision theory uses logical counterfactuals, not just conditional expectations.
      *   **Target Step (1):** This is the conceptual error. "Un-observing everything" is not the definition. The definition is optimizing the *algorithm*.
      *   **Address the "Settled vs. Contested" Request:** This is crucial. I need to map the landscape (Yudkowsky/Soares, Christiano, MacAskill, etc.).
      *   **Provide the "Cost":** Rejecting (3) requires committing to a theory of logical counterfactuals (which is hard/unfinished). Rejecting (1) requires a criterion for "relevant logical entanglement."

  6.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Validate the student's confusion. The argument is a "Prior-EDT" attack on UDT.
      *   *The Pivot (Step 3):* Explain why UDT isn't just "EDT from the prior." It's about *control* via logical identity. In the Smoking Lesion, the decision algorithm isn't logically entangled with the lesion (common cause). In Mugging, it is entangled with the predictor's simulation.
      *   *The Vacation Case:* The algorithm output (Refuse) does not logically determine the Past (Childhood). There is no subjunctive dependence.
      *   *Settled vs. Contested:*
          *   *Settled:* UDT/FDT proponents *intend* to solve the Smoking Lesion/Newcomb distinction. They do *not* want to be EDT. They agree logical dependence is the filter.
          *   *Contested:* How to define logical dependence formally. The "Which evidence" question (indexicals) is also live (e.g., Elga vs. UDT on Sleeping Beauty).
      *   *Recommendation:* Reject (3) primarily, but qualify (1). The cost is the "Problem of Logical Counterfactuals."

  7.  **Refining the "Settled vs. Contested" Section:**
      *   Need to be careful not to overstate consensus. MIRI/CFAR circles (Yudkowsky, Soares) have strong views. Academic philosophy (MacAskill, Greaves) is more critical/skeptical of the formalization.
      *   The "Which evidence to un-observe" is definitely live. (See: "The Paradox of the Counterfactual Mugging" discussions, indexical uncertainty).
      *   The distinction between Causal, Evidential, and Functional/Updateless is standard taxonomy, but the *implementation* of Functional is the battleground.

  8.  **Final Polish:**
      *   Ensure tone is appropriate for a PhD peer (rigorous, precise, acknowledging technical debt in the field).
      *   Make sure to explicitly answer "Which step would you reject?" (Step 3 is the fatal flaw, Step 1 is the misleading premise).
      *   Address the "Cost" (need for a theory of logical counterfactuals).

  9.  **Self-Correction during drafting:** I initially thought about focusing heavily on TDT vs. UDT. But the prompt asks about "updateless-style." I should group TDT/UDT/FDT together as the "logical dependence" camp vs. EDT/CĐT. I need to make sure I don't sound like a partisan for MIRI, but rather an analyst of the dialectic. The user is a philosopher, so precision on "subjunctive dependence" vs "logical identity" matters.

      *Wait, one nuance:* The student's argument says "ex ante expectation doesn't distinguish." If you calculate $E[U]$ using standard probability theory over a prior, they are right. UDT *changes the calculus* (or the dependency graph). So rejecting (3) means rejecting standard expected utility maximization over a causal graph in favor of one over a *logical* graph. This is the "cost."

      *Another nuance:* Step (1) "un-observe everything." UDT agents *do* condition on indexical information sometimes (e.g., "I am in this branch"). The "updateless" part is about not updating on information that changes your optimal policy regarding logical correlations. This is the "principled account" the user worries is missing. I should mention the "Cartesian boundary" or "algorithm instantiation" as the filter.

      *Final check on the Vacation Example:* This is a classic "Newcomb's Problem with a Common Cause" (Smoking Lesion). UDT smokes. EDT doesn't. The argument claims UDT doesn't smoke. I must clarify why UDT smokes. Because the lesion is causally prior and not logically dependent on the *current* algorithm output.

      *Okay, ready to write.*
answer: |-
  This is a sophisticated objection, and your reading group's stagnation is understandable: the "Collapse Argument" effectively targets the weakest formalization of updateless reasoning, often called "Prior-EDT" (Evidential Decision Theory evaluated from the prior). However, proponents of Functional Decision Theory (FDT) and Updateless Decision Theory (UDT) would argue that the cognitive science student has mischaracterized the mechanism of updatelessness in step (3), relying on a conflation of *statistical correlation* with *subjunctive/logical dependence*.

  Here is an analysis of where the argument fails, the costs of fixing it, and the current state of play in the literature.

  ### 1. Which Step to Reject?

  You should reject **Step (3)**, though rejecting **Step (1)** is necessary to clarify why (3) fails.

  **The Error in Step (3):**
  The student claims: *"The arithmetic of ex ante expectation doesn't distinguish between correlations that run through a simulation... and correlations that run through a common cause."*

  This is false regarding the specific arithmetic used by UDT/FDT. It is true regarding *standard* Expected Utility Theory (EUT) combined with a prior (which yields Prior-EDT). But UDT is not merely "EDT from the prior." It is "Expected Utility maximization where the expectation is taken over **logical counterfactuals** rather than causal or evidential conditionals."

  *   **In Counterfactual Mugging:** The predictor's simulation and your actual decision are *logically identical* outputs of the same decision algorithm (or sufficiently isomorphic). When you consider the counterfactual "If my algorithm outputted 'Pay'", you must logically update the predictor's simulation to also output "Predicted Pay." This is a *subjunctive dependence*.
  *   **In the Smoking Lesion / Vacation Case:** Your decision algorithm's output and the lesion (or your childhood) are *not* logically entangled. They are correlated via a common cause (genetics/demographics). When you consider the counterfactual "If my algorithm outputted 'Refuse Vacation'", there is no logical necessity that your childhood changes. The past is fixed relative to the logical structure of the computation, even if it is uncertain from your epistemic perspective.

  Therefore, the "arithmetic" *does* distinguish, provided the dependency graph tracks logical identity rather than mere probabilistic correlation.

  **The Error in Step (1):**
  The student claims the "natural reading" of updatelessness is to "un-observe everything whose evidential content is relevant." This is a straw man of the "broad reading." The updateless perspective is not about *ignoring evidence*; it is about *optimizing the policy function* $P(action | observation)$ from a prior vantage point. You condition on your observations to select the action, but you evaluate the *policy* based on how that policy performs across all possible worlds weighted by the prior. Crucially, the policy is an abstract computation. You only "un-observe" evidence to the extent that conditioning on it would sever the logical link between your current decision and the predictor's simulation (or other instantiations of your algorithm).

  ### 2. The Cost of Rejection

  Rejecting Step (3) saves the theory from collapsing into EDT, but it incurs a significant theoretical debt: **The Problem of Logical Counterfactuals.**

  *   **Why Step (3) looked fine:** In standard probability theory and causal modeling (Pearlian DAGs), there is no formal operator for "logical dependence" that is distinct from "causal dependence" or "statistical correlation." If you model the agent and the predictor as nodes in a standard causal graph, the student is right: the math looks the same. The argument looks plausible because we lack a universally accepted formal semantics for logical counterfactuals.
  *   **The Cost:** To reject (3), you must commit to a formalism where $P(\text{Predictor pays} | \text{do}_{\text{logical}}(\text{I pay})) \neq P(\text{Childhood stable} | \text{do}_{\text{logical}}(\text{I refuse vacation}))$.
      *   This requires defining what it means for two physical systems to instantiate the "same algorithm."
      *   It requires a theory of "what is true in counterfactual worlds where $2+2=5$" or "where my algorithm outputs B instead of A," without exploding into triviality.
      *   Current attempts (Proof-Based Decision Theory, Modal Fixed Points, Similarity Metrics) are technically demanding and arguably incomplete.

  By rejecting (3), you are effectively saying: *"Updatelessness works, but only if we can solve the problem of logical uncertainty and subjunctive dependence."* This is the central research program of the MIRI/CFAR tradition (Yudkowsky, Soares, Fallenstein), but it remains controversial in mainstream decision theory.

  ### 3. Settled vs. Contested (Field Map)

  You asked for explicit distinctions between consensus and live disputes. This is critical for your advisor meeting.

  **Settled (Among Proponents of Updateless/Functional Theories):**
  *   **Rejection of EDT:** There is consensus among UDT/FDT proponents that the theory must *not* recommend refusing the vacation or refusing to smoke in the Smoking Lesion. If a version of updatelessness yields EDT results, it is considered a bug, not a feature.
  *   **Logical vs. Causal:** There is agreement that the distinction between Counterfactual Mugging (logical link) and Smoking Lesion (causal/common cause link) must be preserved. The "Collapse Argument" is viewed as a reductio of *Prior-EDT*, not of UDT proper.
  *   **Policy Optimization:** There is agreement that the unit of evaluation is the policy (input-output map), not the individual action given current evidence.

  **Genuinely Contested (Live Disputes):**
  *   **The Formalism of Logical Dependence:** There is *no* consensus on how to formally define the "logical link."
      *   *Proof-Based UDT* (early Yudkowsky/Barasz/Christiano) uses modal logic and provability.
      *   *Functional Decision Theory* (Soares/Yudkowsky) uses a more informal notion of "subjunctive dependence" based on algorithmic similarity.
      *   *Academic Critics* (e.g., MacAskill, Greaves, Hitchcock) often argue that without a rigorous definition of logical counterfactuals, the theory is ill-defined.
  *   **Indexical Information and Self-Locating Beliefs:** This is the "Which evidence to un-observe?" question you identified.
      *   *Dispute:* Should an updateless agent condition on "I am in this branch" (indexical information)?
      *   *Elga's Objection:* In Sleeping Beauty problems, strict updatelessness can lead to "double-counting" or dynamic inconsistency regarding self-locating beliefs.
      *   *Status:* There is no agreed-upon rule for when indexical evidence should be treated as "fixed" vs. "part of the policy input." This is where your instinct about the "reference class" in Step (5) is spot on.
  *   **The "Troll Bridge" Problem:** A specific technical counterexample where proof-based decision theories might refuse to cross a bridge because they fear their own reasoning is unsound. This suggests that even with logical counterfactuals, "collapsing" into irrationality is possible. This is a live technical dispute in the formal community.

  ### 4. How to Frame This to Your Advisor

  Your instinct that Step (3) is the failure point is correct, but you need to articulate *why* without sounding like you are hand-waving the hard math.

  **Suggested Argument Structure:**
  1.  **Concede the Premise:** Acknowledge that if "updatelessness" is defined merely as "maximizing expected utility from the prior using standard conditional probability," the Collapse Argument holds. This view is sometimes called "Prior-EDT."
  2.  **Deny the Definition:** Argue that canonical Updateless Decision Theory (and its descendant, Functional Decision Theory) explicitly rejects standard conditional probability for the evaluation of policies. It substitutes **logical counterfactuals**.
  3.  **Highlight the Distinction:** In the Mugging, the correlation is *modal* (it holds in all logically possible worlds where the algorithm is the same). In the Vacation case, the correlation is *contingent* (it holds in this world due to demographics, but not in nearby logical counterfactuals where the algorithm outputs differently).
  4.  **Acknowledge the Cost:** Admit that the "principled account" of which evidence to un-observe relies on the unresolved problem of **defining algorithmic identity and logical dependence**.
  5.  **Conclusion:** The Collapse Argument successfully refutes Prior-EDT, but it fails to refute UDT/FDT because it ignores the structural constraint of subjunctive dependence. However, the *implementation* of that constraint remains the primary open problem in the field.

  **Why Step (1) looked fine:**
  The student's reading of (1) is the "naive updateless" view. It looks plausible because the informal literature (blog posts, less technical papers) often speaks loosely about "acting as if you haven't seen the evidence." This rhetorical shorthand invites the Collapse Argument. Your paper can contribute by clarifying that "un-observing" is not an epistemic operation (forgetting data) but a *decision-theoretic* operation (optimizing the map rather than the territory).

  **Summary for your notes:**
  *   **Reject:** Step (3) (The arithmetic *does* distinguish, via logical counterfactuals).
  *   **Qualify:** Step (1) (Updatelessness is about policy optimization, not blind ignorance).
  *   **Cost:** You inherit the "Problem of Logical Counterfactuals."
  *   **Consensus:** UDT proponents agree they must solve Smoking Lesion (i.e., smoke).
  *   **Dispute:** How to formalize the logical link; how to handle indexical evidence.

  This position allows you to defend the core insight of updatelessness (the value of precommitment via logical control) without accepting the absurd implications of evidential reasoning, while honestly flagging the formal gaps that remain.
