answer: |-
  This is a fascinating puzzle because your friend isn't just applying a simple "nature vs. nurture" heuristic. She is operating with a specific, technically nuanced definition of innateness common in generative linguistics (likely Chomskyan or Rationalist).

  Here is the breakdown of her likely verdicts, the rule she is actually using, the competing hypotheses, and the experiment that would settle it.

  ### 1. The Predictions

  **Case 1: Statistical Learning (Babies & Tamarins)**
  *   **Verdict:** **Learned** (via an innate domain-general mechanism).
  *   **Why:** She will argue that tracking transition probabilities is a general cognitive skill (like pattern recognition), not a language-specific rule. The fact that tamarins can do it proves it isn't unique to the human language faculty. For her, "Innate" in the linguistic sense usually implies *structure* that cannot be derived from statistics alone (like the "goed" rule).

  **Case 2: Womb Rhythm Preference**
  *   **Verdict:** **Learned** (Prenatally).
  *   **Why:** This fails her "Stimulus Independence" test. The fetus *did* receive acoustic input (muffled prosody). Since there was exposure, the preference is a memory trace, not an innate blueprint. It's indistinguishable from a dog learning a command, just earlier in development.

  **Case 3: Adult L2 Plateau**
  *   **Verdict:** **Innate** (specifically, an innate *constraint*).
  *   **Why:** This is the mirror image of the "goed" case. In "goed," biology forces structure *despite* lack of input. Here, biology prevents structure *despite* abundant input. If language were purely learned, massive input + correction should yield native competence. The failure suggests a biological window (Critical Period) that is hard-wired.

  ### 2. The Implicit Rule

  Your friend is not using the standard dictionary definition of innate ("present at birth"). She is running a **Poverty of the Stimulus (POS) + Generativity** filter.

  **Her Rule:** *A trait is "Innate" if the output contains structured complexity that cannot be logically derived from the available input, implying a pre-existing biological algorithm.*

  *   **Bats:** Input (0) $\rightarrow$ Output (Complex). **Innate.**
  *   **Songbird:** Input (0) $\rightarrow$ Output (Garbled). **Learned** (requires input to trigger structure).
  *   **"Goed":** Input (Irregulars only) $\rightarrow$ Output (Rule application). **Innate** (the rule wasn't in the input).
  *   **Nicaraguan Sign:** Input (Pidgin) $\rightarrow$ Output (Grammar). **Innate** (grammar wasn't in the input).
  *   **Faces:** Input (0) $\rightarrow$ Output (Preference). **Innate**, *but* she caveats it because it's a **Perceptual Bias**, not a **Generative Computational System**. She cares about *syntax/rules*, not just *preferences*.
  *   **Dog Pointing:** Input (Training) $\rightarrow$ Output (Skill). **Learned** (Input explains Output).

  ### 3. Alternative Rules That Fit the Track Record

  To truly test her, we need to see which of these alternative rules she is *not* using:

  *   **Alternative A: The "Immutability" Rule.** (If you can't train it away, it's innate).
      *   *Fits:* Bats, Faces, Adult Plateau.
      *   *Breaks:* Kids saying "goed." They *do* eventually stop saying "goed" when corrected. If immutability were the rule, "goed" would be learned because it changes. She calls it innate, so immutability is not her criterion.
  *   **Alternative B: The "Stimulus Independence" Rule.** (If it happens with zero input, it's innate).
      *   *Fits:* Bats, Faces.
      *   *Breaks:* Nicaraguan Sign. Those kids *had* input (each other), just impoverished. If zero input were required, this wouldn't count. She calls it innate, so she accepts "Impoverished Input" as sufficient.
  *   **Alternative C: The "Species Specificity" Rule.** (If only humans do it, it's innate language stuff).
      *   *Fits:* "Goed", Nicaraguan Sign.
      *   *Breaks:* Bats. She calls bat echolocation innate, even though it's not human. So she accepts biological modules in other species as "innate," just not necessarily "linguistic."

  ### 4. Which New Cases Pull the Rules Apart?

  **Case 1 (Statistical Learning)** is the heavy lifter here.
  It discriminates between **Domain-General Learning** vs. **Domain-Specific Knowledge**.
  *   If she says **Innate**, she admits that "innateness" is just "having a brain capable of learning."
  *   If she says **Learned** (as predicted), she confirms her rule is about *specific structural constraints* (UG), not just learning capacity.

  **Case 3 (Adult Plateau)** discriminates between **Input Sufficiency** vs. **Biological Constraints**.
  *   If she says **Learned**, she implies that with *enough* time/input, adults could succeed (favoring general learning).
  *   If she says **Innate**, she confirms that biology actively *restricts* learning, which aligns with the "goed" logic (biology drives the outcome, not just the input).

  ### 5. The Settler: The "Impossible Grammar" Case

  To really corner her and distinguish between "Innate Knowledge" (she has rules in her head) vs. "Innate Constraints" (she has limits on learning), you need to throw this at her:

  **The Case:** *Adults and children are taught an artificial language that follows a recursive rule **never found in any human language** (e.g., a specific type of long-distance dependency that violates Universal Grammar). They are given massive training and correction.*

  *   **Scenario A:** They fail to learn it, while easily learning a "possible" human grammar.
      *   **Her Verdict:** **Innate Constraint.** (Proves the brain has a specific shape that rejects certain structures).
  *   **Scenario B:** They learn it just fine.
      *   **Her Verdict:** **Learned.** (Proves there are no specific linguistic constraints, just general intelligence).

  **Why this settles it:**
  It isolates the **Poverty of the Stimulus** argument from the **Critical Period** argument.
  *   The **Adult Plateau** case could be explained by "older brains are just slower" (a general learning issue).
  *   The **Impossible Grammar** case proves that the *content* of what can be learned is biologically restricted.

  If she agrees that failing to learn an "Impossible Grammar" counts as evidence for innateness, she is fully committing to the **Universal Grammar** hypothesis. If she says that's just "cognitive difficulty," she's retreating to a general learning model. This forces her to define exactly *what* part of the mind she thinks is innate: the **knowledge** or the **boundaries**.
