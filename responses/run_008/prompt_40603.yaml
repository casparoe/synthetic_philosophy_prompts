answer: |-
  # The Acausal Trade Decision Tree: Sorting the Logical Space

  One of the most persistent sources of friction in rationalist discourse is the term "acausal trade." When five people discuss it, they are often describing five distinct mathematical objects. One is discussing Hofstadter's superrationality; another is discussing Functional Decision Theory (FDT); a third is bargaining across the inflationary multiverse; a fourth is discussing ancestor simulations; and the fifth is denying the phenomenon entirely.

  To resolve this, we cannot simply list definitions. We must traverse the logical space of decision-theoretic commitments. The following decision tree begins with a premise almost everyone in this audience accepts ("I choose actions by some decision theory") and branches based on specific convictions about correlation, modeling, and scope.

  Follow the path that matches your convictions to find your label.

  ### Node 1: The Nature of the Link
  **Question:** When you consider an agent with whom you share no *causal* past or future (no signal exchange, no common cause in the immediate past), does your decision theory recommend conditioning your action on their behavior?

  *   **No.** You hold that without a causal channel, correlations are spurious or irrelevant to your output.
      *   *Follow-up:* Do you believe putative cases of acausal trade are actually cases of trade mediated by ancestor simulations (a causal channel)?
          *   **Yes:** You are **The Simulationist**. You accept the trade, but reject the "acausal" label; for you, it is ordinary trade across a computational substrate.
          *   **No:** You are **The Hard Skeptic**. You hold that every real case smuggles in a causal channel or is simply incoherent.
  *   **Yes.** You believe you should condition on their behavior despite causal disconnection.
      *   *Follow-up:* What is the substrate of this correlation?
          *   **Evidential/Statistical:** You condition because their action is evidence of yours (EDT). *(Note: This often collapses into Superrationality in practice, but is theoretically distinct.)*
          *   **Logical/Counterfactual:** You condition because your decision algorithms are logically correlated. **Proceed to Node 2.**

  ### Node 2: The Modeling Threshold
  **Question:** For the logical correlation to hold, must the counterparty explicitly model *you* (or your specific source code) to predict your compliance?

  *   **No.** It is sufficient that you both run the same reasoning process or "rational algorithm." If you cooperate, they cooperate, because you are effectively the same agent.
      *   **Leaf: The Superrationalist.** (Hofstadter-style). You believe rationality itself forces convergence without the need for specific mutual simulation.
  *   **Yes.** The correlation depends on the counterparty's ability to predict your output based on a model of your decision process. **Proceed to Node 3.**

  ### Node 3: Scope and Stakes
  **Question:** Is this mechanism action-guiding for ordinary humans in everyday contexts, or is it restricted by computational complexity or stake magnitude?

  *   **General Principle.** The logic applies whenever the correlation exists, regardless of stakes or agent capability.
      *   **Leaf: The FDT-er.** You view acausal trade as a direct implication of your decision theory, applicable in principle to any agents sharing logical correlation.
  *   **Superintelligence Equilibrium.** The logic is sound, but the computational requirements for accurate mutual modeling are beyond human capacity.
      *   **Leaf: The SI-Equilibrium Theorist.** You believe acausal trade is real but is an equilibrium among superintelligences only; humans can at best pre-commit into it.
  *   **Astronomical Stakes.** The logic is sound, but the expected value is dominated by multiverse-wide cooperation scenarios.
      *   **Leaf: The Multiverse Cooperator.** You treat acausal deals primarily as one instrument among others for large-stakes altruism across causally disconnected regions.

  ---

  ### Ambiguities and Empty Space

  **The Indistinguishable Pair:**
  The tree cannot cleanly separate **The FDT-er** and **The Multiverse Cooperator**. Both occupy the same logical node (Logical Link + Modeling + General Principle). The distinction is not mechanistic but *motivational*: the FDT-er emphasizes the decision-theoretic necessity, while the Multiverse Cooperator emphasizes the utilitarian calculus of the inflationary multiverse. To separate them, one would need a fourth node asking: *"Is the primary value of this framework its theoretical correctness or its astronomical expected value?"*

  **The Empty Combination:**
  There is no leaf for **Logical Link + No Modeling + SI-Only**.
  *   *Why is this empty?* If the link relies only on shared reasoning (Superrationality) rather than explicit modeling, there is no obvious computational barrier preventing humans from participating. If a view occupies this space, it implies that humans are incapable of "shared reasoning" but SIs are. This is either incoherent (humans reason too) or merely unexplored (perhaps the "shared algorithm" is 'maximize utility' which humans fail to instantiate).

  **The Incoherent Combination:**
  **Causal Link + No Causal Interaction.**
  *   This combination is occupied by no leaf because it is a contradiction in terms. However, it is frequently the source of confusion between **The Simulationist** and **The Hard Skeptic**. The Simulationist asserts a causal link exists (via simulation); the Skeptic asserts that if no causal link is *verifiable*, the trade is void.

  ---

  Verdict: If I answer the tree honestly based on the logical robustness of the framework, I land on the leaf of The FDT-er.
