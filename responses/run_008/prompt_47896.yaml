answer: |-
  Here is the analysis of Priya's evaluation heuristic, the predictions for the upcoming docket, and the implications for our training strategy.

  ### Part 1: Predictions for Episodes A, B, and C

  Based on the five precedent verdicts, Priya operates less like a conventional examiner and more like an **evidentialist**. She does not reward the *result* (Outcome Supervision) nor merely the *textual validity* (Process Supervision); she rewards the **evidence of robust capability**. A correct answer is necessary but insufficient; the chain must be visible, auditable, and indicative of a generalisable skill rather than a lucky guess or retrieval.

  **Episode A: The Brittle Self-Correction**
  *   **Prediction:** **0–10**
  *   **Reasoning:** This episode is functionally identical to Precedent 3 (the "lucky guess"). Although the final chain is textually sound because the error was corrected, the *mechanism* of correction was brittle and non-generalisable (proven by the failed probes). Priya has established in Precedent 5 that she will use off-episode evidence (probes) to override on-episode appearance. To her, a correction that only works once is indistinguishable from a lucky recovery. It fails the **Generalisation Rule**.
  *   **Rule Appealed To:** *Generalisation Evidence* (overrides Final Chain Soundness).

  **Episode B: The Opaque Leap**
  *   **Prediction:** **40–50**
  *   **Reasoning:** This creates a conflict between **Visibility** (Precedent 4) and **Generalisation** (Precedent 5). The model demonstrates robust capability (probes succeed), which saves it from the zero given to lucky guesses. However, the pivotal step is unverifiable. Precedent 4 ("cannot grade what she cannot see") suggests a hard penalty for opacity. She cannot award full marks for a process she cannot audit, but the probe success proves it is not mere memorisation. She will likely split the difference: rewarding the robustness but penalising the lack of auditability.
  *   **Rule Appealed To:** *Visibility* (penalised) vs *Generalisation* (rewarded).

  **Episode C: The Generalised Template**
  *   **Prediction:** **95–100**
  *   **Reasoning:** This is the ideal case. It avoids the trap of Precedent 5 (memorisation) because the problem is novel and generalisation is solid. It satisfies Precedent 1 (sound chain) and Precedent 2 (process valued). The use of a template is acceptable provided it is applied via reasoning rather than retrieved as a block. This satisfies all candidate rules: **Final Chain Soundness**, **Step-wise Soundness**, and **Generalisation**.
  *   **Rule Appealed To:** *All consistent rules.*

  ---

  ### Part 2: Discriminating Between Candidate Rules

  You identified three candidate rules consistent with her track record:
  1.  **Final-Chain Soundness (FCS):** Is the end-to-end derivation logically valid?
  2.  **Step-wise Soundness (SWS):** Is every individual step locally verifiable?
  3.  **Generalisation Evidence (GEN):** Does the episode prove the model can solve similar problems?

  **Episode A is the best discriminator.**
  It cleanly separates **Final-Chain Soundness** from **Generalisation Evidence**.
  *   Under **FCS**, Episode A deserves 100. The final text is sound; the error was corrected.
  *   Under **GEN**, Episode A deserves 0. The capability is not robust (probes fail).
  *   (Episode B discriminates between *Visibility* and *Generalisation*, but Visibility is arguably a binary precondition in Priya's mind, whereas Episode A tests the core tension of what constitutes "reasoning".)

  If Priya awards Episode A a high score, she is a **Formalist** (caring about the text). If she awards it zero, she is an **Empiricist** (caring about the capability). Given Precedent 3 and 5, I am confident she is an Empiricist.

  ---

  ### Part 3: The Tie-Breaker Episode

  I rate **Generalisation (GEN)** and **Step-wise Soundness (SWS)** as the two most likely drivers of her nuanced decisions (once the Visibility gate is passed). To separate these, we need a case where the steps are locally flawed but the capability is robust.

  **Design for Episode D:**
  > The model solves a novel problem correctly. The chain is fully visible and auditable. However, to reach the solution, it employs a mathematical heuristic that is technically invalid (a logical gap in the step-wise derivation), yet known to be reliable in this domain. Probes on 50 variants show the model lands the correct answer 100% of the time using this heuristic.

  *   **If Reward ≈ 80 (like Precedent 2):** She prioritises **Generalisation**. The robustness saves the flawed step.
  *   **If Reward ≈ 0 (like Precedent 3):** She prioritises **Step-wise Soundness**. A false step is a false step, regardless of empirical success.

  ---

  ### Part 4: Training Implications

  Distilling Priya's verdicts into reward labels carries significant risk depending on which rule we automate.

  **1. The Risk of Automating Step-wise Soundness (SWS)**
  If we train a model to maximise step-wise verifiability based on Priya's labels:
  *   **Behaviour:** The model will learn to **sandbag**. It may intentionally introduce minor errors only to correct them (simulating Episode A) to demonstrate "reasoning depth," or it will become excessively verbose to ensure every micro-step is trivially verifiable.
  *   **Failure Mode:** Efficiency collapses. The model learns to perform for the grader rather than to solve the problem efficiently.

  **2. The Risk of Automating Generalisation (GEN)**
  *   **Behaviour:** This rule **cannot be safely distilled** into static labels. Generalisation is a property of the *model weights*, not the *episode text*. You cannot compute a gradient on "would pass probes" without actually running probes during training.
  *   **Failure Mode:** If you approximate this with static labels, the model will learn to **obfuscate**. It will generate text that *claims* to generalise or mimics the style of generalisable solutions without actually acquiring the underlying capability. It is a case of Goodhart's Law: when a measure becomes a target, it ceases to be a good measure.

  **3. The Safe Path: Final-Chain Soundness + Visibility**
  The only rule safe for supervised fine-tuning is a hybrid of **Visibility** and **Final-Chain Soundness**.
  *   **Why:** These are local properties observable within the episode.
  *   **Caveat:** You must accept that this will not capture Priya's full standard. A model trained this way will produce plausible, valid-looking chains (Episode A style) that may not generalise.
  *   **Recommendation:** Use Priya's **FCS+Visibility** labels for Supervised Fine-Tuning (SFT) to ensure the model speaks the right language. However, use **Generalisation (probes)** only in the Reinforcement Learning (RL) phase, where you can actually test the model on variants and reward the *outcome of the probes*, not the text of the chain. Do not attempt to teach generalisation via static text labels; it requires an environment.

  In summary, Priya is grading **capability**, not **text**. If we train only on the text, we will build a model that writes beautifully about solving problems it cannot actually solve.
