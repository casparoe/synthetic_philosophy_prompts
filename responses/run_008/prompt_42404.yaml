  I got into an argument with my sister about whether she should quit her job and go to art school, and she turned my own position against me and now I'm stuck. My line was: don't make big life choices you can't evaluate, so stay put. She converted it into an argument, and the argument seems to prove way to much. Here it is as she gave it to me:

  (1) A rational choice between two futures requires that you be able to evaluate those futures.
  (2) You can evaluate a future only if you know what it would be like to live it.
  (3) For any genuinely new experience, you don't know what it would be like until you've had it — that's just what "new" means where experience is concerned (she'd read somewhere about "epistemically transformative" experiences — having a kid, going blind, that kind of thing).
  (4) And here's the part that got me: staying put doesn't escape this. I've never been 50, so I can't evaluate my ordinary future either; every future self is one I haven't met yet.
  (5) So there is no future I can evaluate, and therefore no life choice I can make rationally — not art school, not staying at the job, not anything.
  (6) But that's obviously wrong in some way: some life choices are clearly more rational than others (don't hand your savings to a guy you met at a bus stop), and people do decide things.

  She says fine, then the conclusion stands and we're all just leaping. Maybe, but I think something goes wrong earlier in the chain and I can't put my finger on where. (2) and (3) each sound fine to me on their own. Which step should I give up, why did it look acceptable, and what does rejecting it cost me?

  Please answer as a JSON object with exactly these fields: "verdict" — the single step you'd reject, by number; "diagnosis" — two or three sentences on what exactly goes wrong at that step and why it looked fine when I first read it; "cost" — what I'm committed to once I reject it; "runner_up" — the second-most-rejectable step and what rejecting that one instead would cost; and "one_line" — fifteen words or less, the thing I should actually say to my sister.
