prompt: |-
  So a bit of backstory: I moved to a new city last fall and joined a language-exchange meetup mostly to force myself to keep up my Spanish, and somehow last week I got talked into running next month's "topic night" — 45 minutes, a whiteboard, and a corner of a brewery. The topic I unwisely proposed is whether the language you speak shapes how you think, mostly because of two things that happened to me recently. First, a friend from the club who's a native Serbian speaker keeps insisting she's "a meaner, blunter person" when she switches to English — like her humor and her patience are different people depending on the language. Second, I watched a documentary where a simultaneous interpreter said something similar, that after years of working between languages she feels like she hosts slightly different selves. I don't actually know if that's the Sapir-Whorf thing at all or just... register, persona, something else, and I'd rather not build the whole session on a confusion I can't name.

  The audience is going to be maybe fifteen people: hobbyist learners (Spanish, Japanese, French), one semi-professional translator who is actually the reason I'm nervous, and a guy who speaks only English but read a pop-science article once and has Opinions. I already know the snow-words thing will come up in the first five minutes, and someone will mention the business about German speakers describing a bridge with feminine adjectives. Also the English-only guy will probably say programming languages prove it — like, you "can't think" certain thoughts in a language without garbage collection, or something. And I have my own temptation to bring in the stuff I half-remember about color words and communities that navigate by absolute directions instead of left/right, but I don't know which of these is load-bearing and which is trivia.

  What I want from you is a teaching plan, not an explanation for me personally — I've got the general picture, roughly, it's the pedagogy I can't figure out. Specifically: what idea has to be in place before any of the fun examples mean anything (I suspect there's a distinction between "your language forces you to notice things" and "your language forces you to believe things" that has to come early or everything collapses, but sequence it properly); which ONE example should carry the whole session and what it needs to have that the others lack; the misconceptions people will walk in with or form during it, in the order they'll actually arrive, and where exactly in my 45 minutes I should pre-empt each one; whether my friend's "meaner in English" thing is usable as an opener or whether it just muddies everything; what I should openly refuse to get into at this level (the translator will ask me about the Hopi stuff and I plan to say "great question, out of scope" unless you tell me otherwise); and one concrete question I can throw at the group in the last five minutes that would tell me whether they actually understood the distinction or just enjoyed the anecdotes. Keep in mind there's no projector and people will be a beer or two in by the midpoint.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**

      *   **Context:** Language-exchange meetup, brewery corner, 45 minutes, 15 people (mixed levels: learners, one pro translator, one English-only opinionated guy).
      *   **Topic:** Linguistic Relativity (Sapir-Whorf Hypothesis) - "Does language shape thought?"
      *   **User's Dilemma:** Wants to avoid confusion between strong/weak versions, register/persona vs. cognition. Needs a teaching plan, not just an explanation.
      *   **Constraints:** No projector (whiteboard only), people drinking beer (attention span/focus issues), specific anticipated interruptions (snow words, German bridge, programming languages, Hopi).
      *   **Specific Deliverables:**
          1.  Foundational concept (the "load-bearing" idea).
          2.  The ONE core example to carry the session.
          3.  Misconception management (timing and pre-emption).
          4.  Verdict on the friend's "meaner in English" anecdote (opener or mud?).
          5.  Scope boundaries (what to explicitly exclude).
          6.  Final assessment question.

  2.  **Deconstruct the Content (Sapir-Whorf 101):**

      *   *Strong Whorfianism (Determinism):* Language *prisons* thought. You can't think it if you can't say it. (Mostly debunked).
      *   *Weak Whorfianism (Relativity):* Language *habituates* thought. It makes certain paths easier/more likely. (Supported by modern psycholinguistics).
      *   *Confounding Factors:* Culture, context, register, bilingual identity switching.
      *   *Classic Examples:* Eskimo snow (myth/trivia), German bridge gender (boroditsky study, good but overused), Color terms (Berlin & Kay, solid), Spatial orientation (Guugu Yimithirr, very strong evidence for *attention*, not *capability*).

  3.  **Address the Specific Deliverables:**

      *   **Foundational Concept:** The distinction between *Capability* (can I think it?) and *Habit/Attention* (do I naturally notice it?). This is the "Strong vs. Weak" distinction but phrased for a lay audience.
      *   **The ONE Example:** Needs to be robust, interactive (whiteboard friendly), and distinguish habit from capability.
          *   *Snow words:* Bad (myth).
          *   *Gendered bridges:* Good, but abstract.
          *   *Color:* Good, but requires visuals (no projector).
          *   *Spatial (Left/Right vs. North/South):* Excellent. It's physical, can be acted out, and clearly shows *attention* without implying *incapability*.
          *   *Decision:* **Spatial Orientation (Absolute vs. Relative Frame of Reference).** It's visceral. You can ask people to point South. It proves language trains attention, not that English speakers are "lost" forever.
      *   **The Friend's Anecdote:** "Meaner in English." This is likely *cultural pragmatics* or *bilingual persona*, not linguistic determinism.
          *   *Verdict:* Use it as the **Hook**, but label it immediately as the "Question," not the "Evidence." It validates their intuition but needs to be dissected later so they don't confuse personality with cognition.
      *   **Misconceptions & Timing:**
          1.  *Snow Words:* Will come up immediately. Pre-empt in Intro.
          2.  *Determinism (Can't think it):* Will come up during examples. Address during Core Concept.
          3.  *Programming Languages:* Will come up late. Address in Scope/Q&A.
          4.  *Culture vs. Language:* The trickiest one. Needs to be woven into the Core Example.
      *   **Scope Boundaries:** Hopi time (too academic/debated), Color (too visual for whiteboard), Programming (analogy break).
      *   **Final Question:** Needs to test the *Habit vs. Capability* distinction.

  4.  **Drafting the Plan (Iterative Process):**

      *   *Tone:* Casual but structured. Brewery setting means keep it lively.
      *   *Structure:*
          *   0-5: Hook & Myth-Busting.
          *   5-15: The Core Distinction (Habit vs. Prison).
          *   15-35: The Core Example (Spatial).
          *   35-40: Scope & Boundaries (The Translator/Programmer check).
          *   40-45: Assessment & Wrap.

      *   *Refining the Core Example:* The Guugu Yimithirr example is great. "The ant is on your south leg." How to do this without a projector? Draw a map on the whiteboard. Have people orient themselves.
      *   *Refining the Friend's Story:* If I use it as an opener, I need to make sure I don't validate it as *proof*. Frame it as: "This is what we *feel*. Is it true?"
      *   *Refining the Programmer Objection:* Programming languages *do* constrain what you can *execute*, but not what you can *conceptualize*. That's a key distinction.
      *   *Refining the Final Question:* Don't ask "Did you learn?" Ask a scenario. "If I teach you a new word, do you gain a new thought or just a new label?"

  5.  **Finalizing the Details (Self-Correction during drafting):**

      *   *Correction:* Wait, the user said "no projector." Color examples are hard. Spatial is better.
      *   *Correction:* The translator might know the Hopi time controversy. Better to explicitly say "We aren't doing Hopi time today" to show respect for their knowledge while keeping scope.
      *   *Correction:* The "Meaner in English" thing is actually about *cultural frames* activated by language. I should advise the user to categorize this as "Pragmatics/Identity" not "Cognition," otherwise the session gets muddy.
      *   *Timing:* 45 minutes flies. Keep the lecture parts short. More whiteboard interaction.

  6.  **Writing the Response:** (Aligning with the user's requested structure: Teaching Plan, not explanation).

      *   *Section 1: The Load-Bearing Distinction.* (Habit vs. Capability).
      *   *Section 2: The One Example.* (Spatial Orientation).
      *   *Section 3: The Timeline & Misconception Management.* (Minute-by-minute breakdown).
      *   *Section 4: The Friend's Anecdote.* (Hook, not Evidence).
      *   *Section 5: Scope Boundaries.* (What to cut).
      *   *Section 6: The Final Question.* (The "Litmus Test").

  7.  **Review against Constraints:**
      *   Brewery context? Yes, keep it conversational.
      *   Whiteboard only? Yes, spatial example works on WB.
      *   Audience mix? Yes, addresses the translator (depth) and the opinionated guy (programming).
      *   45 mins? Yes, timeline fits.

  8.  **Final Polish:** Ensure the tone is supportive but authoritative on pedagogy. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Make sure to emphasize *why* the spatial example works better than the gendered bridge example for this specific group (it's physical and less abstract). Ensure the distinction between "Language" and "Culture" is handled carefully, as that's a common trap.

  9.  **Final Output Generation** (matches the provided good response).
answer: |-
  Here is a teaching plan designed for a 45-minute brewery session with a whiteboard, mixed audience, and low attention span.

  ### 1. The Load-Bearing Distinction
  **Concept:** *Habit vs. Prison.*
  Before you show a single example, you must establish this distinction on the whiteboard. Draw a line down the middle.
  *   **Left Side (The Prison):** "My language *forbids* me from thinking X." (Strong Determinism). This is mostly false.
  *   **Right Side (The Habit):** "My language *trains* me to notice X automatically." (Weak Relativity). This is mostly true.

  **Why this comes first:** If you don't draw this line, every example you give will be interpreted through the "Prison" lens. The English-only guy will argue against the Prison (correctly), and the learners will argue for the Prison (based on feeling), and they will talk past each other. You need them to agree that the "Prison" is off the table so you can discuss the "Habit."

  ### 2. The ONE Core Example
  **Example:** **Spatial Orientation (Relative vs. Absolute Frames of Reference).**
  Do not use the German Bridge (too abstract/visual) or Snow Words (debunked myth). Use the **Guugu Yimithirr** (Australian Aboriginal language) example.

  *   **The Setup:** Explain that in English, we use *egocentric* coordinates (Left, Right, Front, Back). In Guugu Yimithirr, they use *geographic* coordinates (North, South, East, West) for everything, even small scales.
  *   **The Whiteboard Activity:** Draw a table. Draw a stick figure sitting at it. Draw a cup.
      *   Ask the group: "In English, where is the cup?" (Answer: To the right).
      *   Rotate the stick figure 180 degrees. "Where is the cup now?" (Answer: To the left).
      *   Now explain: "In Guugu Yimithirr, the cup didn't move. It is still to the *North* of the person."
  *   **The Kicker:** Ask the group to point South. Right now. In the brewery.
      *   Most will hesitate or guess.
      *   Explain that a speaker of that language would know instantly, without thinking, because their grammar *forces* them to track cardinal directions constantly to speak correctly.
  *   **Why this carries the session:** It is physical (people can point), it proves *attention* (Habit) without implying *incapability* (Prison), and it separates language from culture (you can learn to track South, but the language makes it mandatory).

  ### 3. Timeline & Misconception Management
  **0:00 – 0:05: The Hook & The Myth Bust**
  *   **Action:** Use your friend's "meaner in English" story here.
  *   **Script:** "A friend tells me she's a different person in English. Is that language shaping thought? Or something else? We're going to find out."
  *   **Pre-empting Misconception #1 (The Snow Words):** The English-only guy or a learner *will* bring up "Eskimos have 50 words for snow."
  *   **Intervention:** Write "Snow Myth" in the corner of the board immediately. Say: "That is a famous myth about vocabulary size. We are talking about *grammar and attention*, not vocabulary. We are banning snow words for tonight."

  **0:05 – 0:15: The Distinction (Prison vs. Habit)**
  *   **Action:** Draw the line (Prison vs. Habit).
  *   **Pre-empting Misconception #2 (Determinism):** The learners often want language to be powerful (The Prison). The skeptics want it to be neutral.
  *   **Intervention:** Explicitly state: "No language stops you from understanding a concept. But some languages make you pay a 'tax' of attention to specific details every time you speak."

  **0:15 – 0:35: The Core Example (Spatial)**
  *   **Action:** Run the Whiteboard Spatial Activity described above.
  *   **Pre-empting Misconception #3 (Culture vs. Language):** Someone will say, "That's just because they live in the desert, not because of the language."
  *   **Intervention:** Acknowledge this is the hardest part. "Culture and language feed each other. But we know from experiments that when you teach people new spatial terms, their memory patterns shift *before* their culture changes. The language is the training wheel."

  **0:35 – 0:40: Scope Boundaries (The Translator & The Programmer)**
  *   **Action:** Open the floor for the "Hard Questions."
  *   **Pre-empting Misconception #4 (The Hopi Time Question):** The translator will ask about Hopi concepts of time.
  *   **Intervention:** "That is the classic case study, but it's heavily debated and requires a linguistics degree to unpack properly. I'm putting that in the 'Advanced' bucket so we don't get stuck on one language."
  *   **Pre-empting Misconception #5 (The Programmer):** The English-only guy will say, "Programming languages prove the Prison theory. You can't code a loop in HTML."
  *   **Intervention:** "Great point. But code is *executable logic*. Human language is *descriptive*. In HTML you literally cannot execute a loop. In English, I can describe a loop even if I don't have a specific word for it. Code constrains *action*; language constrains *habit*."

  **0:40 – 0:45: Assessment & Wrap**
  *   **Action:** The Final Question (see below).

  ### 4. Verdict on the Friend's Anecdote
  **Use it as the Opener, NOT the Evidence.**
  *   **Why:** It is relatable and validates everyone's intuition that language *feels* influential.
  *   **The Trap:** If you use it as proof, you validate the "Prison" model. Being "meaner" is likely about *cultural pragmatics* (English-speaking cultures might value directness more than her Serbian context) or *bilingual identity switching* (she learned English in a business context, Serbian at home).
  *   **The Move:** Put it on the board at minute 1. Circle it. Say: "This is our mystery. By minute 40, we should know if this is linguistic relativity or just social code-switching." (Spoiler: It's mostly social code-switching, but acknowledging the feeling keeps them engaged).

  ### 5. Scope Boundaries (What to Refuse)
  You need to explicitly "park" these topics to keep the 45-minute limit. Write a "Parking Lot" section on the whiteboard.
  1.  **Vocabulary Size:** (e.g., Snow words, Portuguese *saudade*). This is about labeling, not thinking. Park it.
  2.  **Hopi Time:** Too academic/controversial for a brewery. Park it.
  3.  **Language Evolution:** How languages started. Irrelevant. Park it.
  4.  **Programming Languages:** As noted above, it's a category error. Park it.

  **Script for the Translator:** "I know the Hopi time case is the elephant in the room for linguists. I'm intentionally skipping it because the data is messy, and I want to focus on the spatial stuff where the cognitive science is clearer." (This shows respect for their expertise without letting them derail the layman session).

  ### 6. The Final Assessment Question
  Do not ask "Did this make sense?" They will just nod. Ask a scenario question that forces them to apply the **Habit vs. Prison** distinction.

  **The Question:**
  > "Imagine I invent a new word for you tonight. Let's say 'Glark' means 'the specific sadness of realizing you're out of beer.'
  >
  > **Question:** Do you now *feel* a sadness you couldn't feel before? Or do you just have a faster label for a sadness you already knew?"

  **What to listen for:**
  *   **If they say:** "I feel it more now / It makes me notice it." -> **They get it.** (Habit/Attention).
  *   **If they say:** "I couldn't feel it at all before." -> **They missed it.** (Prison/Determinism).
  *   **If they say:** "It's just a label, doesn't change anything." -> **They are skeptical.** (Universalism).

  **Your Closing:** "If you said you notice it more, you're a Weak Whorfian. If you said you couldn't feel it, you believed the Prison. If you said it's just a label, you're a Universalist. Most of modern science says: You notice it more. Thanks for coming."
