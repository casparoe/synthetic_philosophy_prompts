      2.  Provide the "Instructor Comments" section (what goes on the paper).
      3.  Provide a "Grading Rationale" section (for the TA's understanding/defense).
      4.  Keep tone professional and objective.

      *Wait, looking at the student's Money Pump comment:* "any agent that honors sunk costs can be money-pumped... so the strict view has to say it's irrational -- though this mainly shows that our standard of rationality is too narrow."
      This is actually a fairly sophisticated observation (acknowledging the normative/positive gap), but it contradicts their earlier claim that finishing the PhD is "the rational choice." They can't have it both ways without clarifying *which* definition of rationality they are using. I will penalize for this inconsistency.

      *Looking at the PhD example:* "quitting would waste those years, and that is a real cost of quitting." This is the critical error. The waste occurred the moment the decision to quit was made *in the past*, or rather, the resources are consumed regardless. The cost of quitting is the *foregone future income*, not the *past time*. I must highlight this distinction clearly.

