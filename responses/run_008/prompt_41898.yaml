answer: |-
  You have independently rediscovered the core tension of **Memetics** (specifically the Dawkins/Blackmore/Dennett school of thought) versus **Cultural Group Selection**.

  The clean principle you are looking for is **The Counterfactual Transmission Test**.

  ### The Principle: Selection Pressure
  To categorize a cultural item, ask this question:
  > **"If this idea provided zero practical utility (or even a slight cost) to the host, would it *still* spread?"**

  *   **Host-Benefit (Adaptive):** If the answer is **No**. The idea spreads *because* it solves a problem for the host. If it stopped working, it would vanish. (e.g., Literacy, Germ Theory).
  *   **Meme-Benefit (Parasitic/Commensal):** If the answer is **Yes**. The idea possesses structural features (emotional hook, rhythm, threat, social signaling) that hack the host's psychology to ensure copying, regardless of truth or utility. (e.g., Chain letters, Earworms).

  Here is how applying this principle rigorously forces you to adjust your verdicts, including the "Honey" dilemma and your new Mnemonic case.

  ---

  ### 1. The "Honey Never Spoils" Verdict
  **Your Instinct:** Wants to put it on the Literacy (Host) side because it is *true* and *useful*.
  **The Principle's Verdict:** **Meme-Benefit.**

  **Why you have to give this up:**
  Under the Selection Pressure principle, *truth* and *utility* are not the same as *selection pressure*.
  *   **Literacy** spreads because if you don't use it, you lose the benefit. You practice it because it works.
  *   **The Honey Fact** spreads because it is a "conversational token." You share it to bond, to sound knowledgeable, or because it feels surprising.
  *   **The Test:** If knowing honey doesn't spoil provided no social capital and wasn't "fun" to say, but was still true, would you tell people at a party? Probably not. Therefore, the *utility* is not the engine of transmission; the *social stickiness* is. It is a benign parasite. It lives in your brain rent-free, offering a tiny bit of trivia in exchange for neural real estate.

  ### 2. The Religious Commandment (Kids & Faith)
  **Your Instinct:** Flip-flopping between Meme (epidemiology) and Host (comfort).
  **The Principle's Verdict:** **Meme-Benefit.**

  **Why:**
  This is the classic example used by Daniel Dennett. While the *comfort* of faith is a Host benefit, the specific commandment to *"have lots of kids and raise them in the faith"* is a replication strategy for the religion, not necessarily the parent.
  *   **The Test:** If the religion provided comfort but told you to remain childless to focus on prayer, would the religion spread demographically? No.
  *   The commandment exists specifically to overcome the biological cost of raising children. It is a gene-meme co-evolutionary hack. The comfort is the "bait," but the reproductive command is the "hook" for the meme's survival.

  ### 3. Tipping in Restaurants
  **Your Instinct:** Host-Benefit (smooths social interaction).
  **The Principle's Verdict:** **Mixed / Norm-Enforcement (Leaning Meme).**

  **Why:**
  This is a **Coordination Equilibrium**. It started as Host-Benefit (ensuring good service), but it persists via **Meme-Selected Social Pressure**.
  *   **The Test:** If you could tip anonymously with zero social consequence and no impact on future service (e.g., a one-time stop in a foreign country), would you do it? Many would not.
  *   Because it persists even when the direct utility is low (fast food counters, takeout) due to *guilt* and *judgment*, it has developed a self-propagation mechanism (social shaming) that protects it even when the host benefit is negligible.

  ---

  ### 4. The New Case: The Zombie Mnemonic
  **The Case:** A mnemonic so catchy students remember it for life, even after forgetting what it was for.
  **The Principle's Verdict:** **Pure Meme-Benefit (Cultural Fossil).**

  **Analysis:**
  This is the smoking gun for memetic selection.
  *   **Host-Benefit** requires the idea to function for the host. A key that opens no door is not a tool; it's junk.
  *   If the mnemonic persists *after* the utility (the information it encoded) has decayed, the mnemonic has successfully **decoupled from host fitness**.
  *   It is now a **commensal organism**. It occupies space in your long-term memory, consumes metabolic energy to maintain that neural pathway, and provides zero return on investment.
  *   **Why it matters:** This proves that cultural selection can favor *retention* over *function*. The catchiness (rhyme, rhythm) was selected for, not the educational value. The education was just the vehicle that got the virus into the host; once inside, the virus mutated (the meaning faded) but the shell (the rhyme) remained.

  ### Summary of the Framework

  | Cultural Item | Your Gut | Principle Verdict | Reason |
  | :--- | :--- | :--- | :--- |
  | **Chain Letters** | Meme | **Meme** | Threat-based replication. |
  | **Literacy** | Host | **Host** | Utility drives adoption. |
  | **10% Brain Myth** | Meme | **Meme** | Juiciness drives adoption. |
  | **Honey Fact** | Host (Wanted) | **Meme** | **Social signaling drives adoption, not utility.** |
  | **Tipping** | Host | **Norm/Meme** | Persists via social pressure, not just utility. |
  | **Religious Kids** | Mixed | **Meme** | Demographic replication strategy. |
  | **Zombie Mnemonic**| (Unsure) | **Meme** | **Survives the death of utility.** |

  ### The Takeaway
  The clean principle forces you to stop looking at the **content** (is it true? is it useful?) and start looking at the **vector** (why did this move from Brain A to Brain B?).

  If the vector is "this helps me live," it's Host-Benefit.
  If the vector is "this makes me feel something / fit in / scared," it's Meme-Benefit.

  The "Honey" fact hurts to reclassify because it feels *good* to think we are sharing wisdom. But if we are sharing it to feel clever rather than to preserve food, we are serving the meme, not ourselves. The Zombie Mnemonic is the ultimate proof: culture can evolve to be perfectly fit for *survival* while being perfectly useless for *life*.
