      *   *Reality Status:* This is the trickiest part. Hacking is *not* a simple social constructionist who says "it's not real." He is a *dynamic nominalist*. He argues that interactive kinds *are* real, but their reality is historical and dynamic, not static and Platonic. He explicitly rejects the idea that looping effects make categories "unreal" or "mere social control." He often argues *against* the idea that constructionism implies unreality.

