      *   *Section 4: Independence & The Secret Ballot.* This is where the reading strains. The secret ballot isn't about epistemic independence; it's about *social* safety. It allows correlation (Juror 9 supporting 8) without social cost. This challenges the Condorcet ideal.
      *   *Section 5: Truth vs. Process.* The "Innocence" assumption. The film is about the *standard of proof*, not ontological truth. This aligns with the legal system's goal (avoiding false positives) vs. the JA goal (consistency/truth).
