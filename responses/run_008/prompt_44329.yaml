answer: |-
  Yes, there is an established term for this, and your intuition about the anthropological roots is correct. The classic label is **Galton's Problem**.

  However, while "Galton's Problem" names the statistical violation, modern economics often treats it as a technical nuisance rather than the substantive historical feature you're describing. To get the "carving" you want, we need to distinguish between the statistical error (the label) and the historical mechanism (the insight).

  Here is the breakdown of the term, its migration into social science, and how it differs from neighboring concepts.

  ### 1. The Established Term: Galton's Problem
  **Origin:** In 1889, Sir Francis Galton critiqued Edward Tylor's statistical study of the evolution of marriage customs. Tylor treated different cultures as independent data points to prove a universal law of development. Galton pointed out that cultures are not independent; they borrow from one another (diffusion) or share a common ancestor (phylogeny). If Culture A and Culture B both have patrilineal inheritance, it might not be because "civilization causes patrilineality," but because Culture B copied Culture A.

  **Modern Quantitative Version:** In political science and economic history, this is still called **Galton's Problem**. In econometrics, it is often subsumed under **Cross-Sectional Dependence** or **Spatial Autocorrelation**.
  *   **The Statistical Claim:** The error terms in your regression are correlated across units ($\epsilon_i$ is correlated with $\epsilon_j$).
  *   **The Consequence:** Your standard errors are too small, your $N$ is inflated, and your confidence intervals are wrong. You think you have 150 independent tests (countries), but you effectively have far fewer.

  ### 2. The Missing Nuance: Diffusion vs. Extraction
  Here is where your specific observation pushes beyond the standard definition. Traditional discussions of Galton's Problem usually assume **diffusion**: traits spread, making countries *more similar* (e.g., democracies clustering in Europe).

  Your example (Portugal/Bolivia, Britain/India) describes **divergence via connection**: the wealth of one unit is causally produced by the impoverishment of another. The connection doesn't just make the data points correlated; it makes the *outcome* of one unit a function of the *treatment* of another.

  Standard Galton's Problem warnings often treat this as "noise" to be corrected with clustered standard errors. You are correctly identifying that it is **signal**. The entanglement isn't a bug in the data; it is the mechanism of the theory.

  If we need a term for this specific subtype—where the violation of independence is constitutive of the outcome rather than just a statistical confounder—I propose **Constitutive Interdependence**.

  *   **Definition:** A condition in comparative analysis where the units of observation (countries/regions) are not merely correlated due to shared shocks or diffusion, but where the causal mechanism under investigation operates *through* the relationship between units. The "independence" of the units is ontologically false, not just statistically inconvenient.

  ### 3. The Carving: How It Differs from Neighboring Concepts
  You asked for the boundaries. Here is how Constitutive Interdependence (or Galton's Problem) is distinct from other common methodological worries.

  #### Vs. Ordinary Correlation (Clustering)
  *   **Ordinary Correlation:** Two countries might both have high GDP because they both benefited from a global oil price shock. They are correlated, but they are still distinct entities. You can fix this with **Clustered Standard Errors**.
  *   **This Problem:** The countries are not distinct entities in the relevant sense. Britain's textile wealth *required* India's deindustrialization. Treating them as two rows in a spreadsheet implies they had separate chances to succeed.
  *   **The Boundary:** If you can theoretically separate the units without breaking the causal mechanism, it's ordinary correlation. If separating them destroys the explanation (e.g., you can't explain British wealth without referencing Indian extraction), it's Constitutive Interdependence.

  #### Vs. Selection Bias
  *   **Selection Bias:** This is about *which* countries make it into your dataset. For example, if you only study countries that survived to 2024, you might miss those that collapsed due to bad institutions.
  *   **This Problem:** This is about the *nature* of the units in the dataset, regardless of how they were selected. Even if you have every country that ever existed, treating them as independent rolls of the dice is wrong because the dice are tied together with string.

  #### Vs. General Historical Skepticism ("You can't rerun history")
  *   **Historical Skepticism:** A philosophical claim that causal inference is impossible because we lack counterfactuals (we can't rerun 18th-century Bolivia).
  *   **This Problem:** A specific statistical claim. You *could* theoretically infer causality, but not by counting countries as $N=1$. You would need to count *systems* or *networks* as $N=1$. It doesn't say history is unknowable; it says the **degrees of freedom** are being faked.

  ### 4. The Boundary: River Towns vs. Global Colonies
  You asked if a study of ports vs. interior towns on one river is affected the same way as a study of former colonies across continents.

  **Yes, but the mechanism of dependence differs.**

  *   **The River Case (Spatial/Functional Dependence):**
      *   **Mechanism:** Spillovers. A port town gets rich *because* the interior town sends goods. They are part of a single local economic system.
      *   **Methodological Fix:** **Spatial Econometrics**. You model the weight matrix ($W$) to account for the fact that $Y_{port}$ depends on $X_{interior}$.
      *   **Severity:** High. Treating them as independent is obviously wrong because they are geographically and economically contiguous.

  *   **The Colony Case (Common Shock / Imposition):**
      *   **Mechanism:** Common Origin + Extraction. Britain imposes institutions on India, Nigeria, and Jamaica. These aren't independent tests of "British Institutions"; they are repeated measures of the same event. Furthermore, the wealth transfer links them.
      *   **Methodological Fix:** **Multi-Level Modeling** or **Fixed Effects for the Metropole**. You must cluster by colonizer, not just by region.
      *   **Severity:** Extreme. This is the classic Galton's Problem. If you compare 50 former British colonies to 50 former French colonies, your $N$ is not 100; it is effectively 2 (Britain and France).

  ### Summary
  The established term is **Galton's Problem**. In modern econometrics, it is often diluted into **Cross-Sectional Dependence**.

  However, your specific insight—that the entanglement is the *cause* of the inequality, not just a statistical nuisance—is best captured by distinguishing between **Diffusionary Dependence** (traits spread, making units similar) and **Constitutive Interdependence** (resources flow, making units diverge).

  When you see a cross-country regression that treats nations as independent rows without addressing network linkages, trade flows, or colonial metropoles, they are committing Galton's Problem. When they treat that dependence as mere "noise" to be corrected rather than the historical engine of the outcome, they are missing the Constitutive Interdependence.
