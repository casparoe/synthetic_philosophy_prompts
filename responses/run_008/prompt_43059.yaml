answer: |-
  **Exam Question**

  **Question 4 (20 Points)**
  **Time Allocation: 90 Minutes**

  Consider the **Two-Urn Ellsberg Scenario**:
  *   **Urn K (Known):** Contains exactly 50 Red balls and 50 Black balls.
  *   **Urn A (Ambiguous):** Contains 100 balls that are either Red or Black, but the proportion is unknown.

  An agent states the following strict preferences:
  1.  They prefer betting on **Red from Urn K** over betting on **Red from Urn A**.
  2.  They prefer betting on **Black from Urn K** over betting on **Black from Urn A**.

  Write an essay addressing the following three points:

  1.  **Formal Inconsistency:** Demonstrate why these preferences cannot be rationalized by *any* subjective expected utility (SEU) model, regardless of the agent's risk attitude. Specifically, show why no single probability assignment to the states in Urn A can satisfy both preferences simultaneously.
  2.  **The Exploitation Argument:** Critics argue that an agent with these preferences is susceptible to a "money pump" or Dutch Book (e.g., being induced to accept a combination of bets on Urn A that guarantees a loss). Evaluate this claim. Does this argument successfully prove the agent is irrational, or does it beg the question by assuming the very axioms (such as additivity) that the agent's choices reject?
  3.  **Maxmin Expected Utility (MEU):** The Gilboa-Schmeidler model suggests agents act as if Nature selects the worst prior from a set of probabilities. Explain how MEU rationalizes the preferences above. In your view, does this model provide a genuine *explanation* of rational behavior under uncertainty, or does it merely *rename* the anomaly by formalizing inconsistency?

  ***

  **Model Answer**

  The Two-Urn scenario isolates ambiguity aversion from risk aversion by holding the expected payoff constant while varying the information structure. To show these preferences violate Subjective Expected Utility (SEU), we must look at the constraints imposed by the probability axioms. Let $P_K(R)$ and $P_K(B)$ be the probabilities for Urn K, and $P_A(R)$ and $P_A(B)$ for Urn A. We know $P_K(R) = 0.5$ and $P_K(B) = 0.5$. The agent prefers $K_R \succ A_R$, implying $U(K_R) > U(A_R)$. Assuming utility depends on the probability of winning, this requires $P_K(R) > P_A(R)$, so $0.5 > P_A(R)$. Simultaneously, the agent prefers $K_B \succ A_B$, implying $P_K(B) > P_A(B)$, so $0.5 > P_A(B)$. However, in SEU, probabilities over mutually exclusive and exhaustive states must sum to one. If $P_A(R) < 0.5$ and $P_A(B) < 0.5$, then $P_A(R) + P_A(B) < 1$. This violates the additivity axiom. No single probability distribution over {Red, Black} for Urn A can satisfy both inequalities. Risk aversion cannot rescue SEU here because the monetary stakes are identical; the violation is purely about the weighting of probabilities, not the utility of outcomes.

  Regarding the exploitation argument, the claim is that an ambiguity-averse agent can be pumped by selling them a bet on Red in Urn A and a bet on Black in Urn A at prices derived from their implied probabilities. However, this argument fails as a normative critique because it begs the question. The money pump relies on the assumption that the agent values the *combination* of bets linearly (i.e., that the value of a bundle is the sum of the values of parts). Ambiguity aversion is fundamentally a rejection of linearity and the Sure-Thing Principle. If the agent evaluates acts based on worst-case scenarios rather than weighted averages, they will not accept the intermediate trades required for the pump. To claim they are irrational because they lose money assumes that rationality requires maximizing expected value according to additive probabilities. Since the definition of rationality is precisely what is in dispute, the exploitation argument proves inconsistency with SEU, but not necessarily irrationality in a broader sense.

  Finally, Maxmin Expected Utility (MEU) rationalizes this by replacing a single prior $P$ with a set of priors $C$. For Urn K, $C = \{0.5\}$. For Urn A, $C = [0, 1]$. The agent evaluates an act by the minimum expected utility across all $p \in C$. For a bet on Red in Urn A, the worst case is $p=0$, yielding utility 0. For Urn K, the value is based on $p=0.5$. Thus, $K \succ A$ holds for both colors without contradiction, as the evaluation rule is non-additive across events. Does this explain or rename? It explains, provided one accepts the "Uncertainty Aversion" axiom as normative. It moves the goalpost from "consistency with a single belief" to "robustness against belief error." It is not merely a rename because it offers a new axiomatic foundation (Gilboa-Schmeidler 1989) that preserves transitivity and dominance while dropping independence. It reframes rationality as caution in the face of missing information rather than coherence of a single subjective measure.

  ***

  **Marking Scheme (20 Points Total)**

  **A/B Boundary:**
  *   **B Answer:** Accurately describes the paradox and the MEU mechanics but remains neutral or descriptive regarding the exploitation argument (e.g., "Some economists say X, others say Y"). It treats the exploitation argument as objectively true rather than axiomatic.
  *   **A Answer:** Takes a definitive stance on the exploitation argument (identifying it as question-begging) and evaluates MEU's normative status (explanation vs. renaming) rather than just describing its math.

  **Must-Hit Points:**

  1.  **SEU Contradiction Logic (4 pts)**
      *   *Requirement:* Explicitly shows that preferring K for both implies $P_A(R) < 0.5$ AND $P_A(B) < 0.5$, leading to a sum $< 1$.
      *   *Common Botch:* Students argue that $P_A(R)$ must equal $P_A(B)$ due to symmetry, missing the point that *any* assignment fails, not just the symmetric one.

  2.  **Two-Urn Specifics (4 pts)**
      *   *Requirement:* Uses the 50/50 Known vs. Unknown setup to show the preference is for *information*, not odds.
      *   *Common Botch:* Reverting to the standard 3-color urn (Red/Black/Yellow) setup despite the prompt specifying the Two-Urn variant.

  3.  **Exploitation Verdict (4 pts)**
      *   *Requirement:* Must state whether the money pump succeeds or fails normatively. Full credit requires identifying that it assumes additivity/SEU to prove SEU.
      *   *Common Botch:* **The B-Trap.** Stating "The agent loses money, so they are irrational" without acknowledging the axiomatic assumption, OR saying "It's controversial" without taking a side.

  4.  **MEU Mechanism (4 pts)**
      *   *Requirement:* Correctly defines MEU as minimizing expected utility over a *set* of priors (not just "uncertainty").
      *   *Common Botch:* Describing MEU as "being pessimistic" without referencing the set of priors ($C$) or the minimization operator.

  5.  **MEU Explanatory Status (4 pts)**
      *   *Requirement:* Offers a judgment on whether MEU explains (axiomatic foundation/robustness) or renames (ad hoc fix).
      *   *Common Botch:* Stopping at "MEU fits the data" without addressing whether this constitutes a rational explanation or just a mathematical fit.
