answer: |-
  ### Exam Question

  **Question 1** (90 Minutes)

  It is a common reaction to Arrow's Impossibility Theorem to argue that the Independence of Irrelevant Alternatives (IIA) condition is implausibly strong and that dropping it dissolves the impossibility. Critically evaluate this claim by contrasting the consequences of dropping IIA with the consequences of dropping the Pareto principle, assuming Unrestricted Domain, Non-Dictatorship, and Transitivity are retained. 

  In your answer, explain the 'Oligarchy' result that emerges when Pareto is relaxed but IIA is kept, and use this to diagnose the underlying asymmetry between the two conditions. Note any technical provisos required for the Oligarchy result to hold. Assess whether abandoning IIA truly escapes the normative force of Arrow's argument.

  ***

  ### Model Answer

  Arrow's theorem demonstrates that no social welfare function can satisfy Unrestricted Domain, Pareto, IIA, Non-Dictatorship, and Transitivity simultaneously. The standard escape route is to relax IIA, permitting rules like the Borda count. Borda satisfies all other Arrow conditions and yields a transitive social ordering, demonstrating that dropping IIA restores possibility. However, this response often overlooks the theoretical weight IIA carries compared to Pareto.

  If we instead retain IIA but drop Pareto, possibility does not fully return. As established in the Oligarchy corollary, any rule satisfying Unrestricted Domain, IIA, Non-Dictatorship, and Transitivity must be an oligarchy. An oligarchy is a group of individuals who are jointly decisive (if all prefer $x$ to $y$, society does) and individually hold veto power (if one prefers $x$ to $y$, society cannot rank $y$ above $x$). This is not a dictatorship, but it is a severe restriction on democracy: power is concentrated in a clique, and every member can block change. Thus, dropping Pareto buys almost nothing; we merely swap a single dictator for a decisive clique with veto rights.

  A crucial technical proviso applies here: the rule must be **non-imposed**. Without this, a constant social ordering (fixed regardless of preferences) satisfies Unrestricted Domain, IIA, Non-Dictatorship, and Transitivity trivially, yet involves no oligarchy. The proviso ensures the social ordering depends on individual preferences, preventing the theorem from being vacuously satisfied by an external imposition.

  The asymmetry between dropping IIA and dropping Pareto reveals that IIA is the primary driver of the impossibility. Pareto is a substantive constraint on outcomes (respecting unanimous improvement), whereas IIA is a structural constraint on information processing (ranking pairs based only on pairwise data). The proof shows that the structural constraint of IIA, combined with Transitivity, forces the concentration of power (decisiveness) regardless of whether we demand Pareto efficiency. IIA restricts *how* preferences are aggregated to such a degree that only oligarchic structures survive.

  Does abandoning IIA dissolve the problem? Superficially, yes, as Borda shows. However, the Oligarchy result suggests the normative problem persists. IIA is attractive because it prevents strategic manipulation of agendas and ensures social choices depend only on relevant conflicts. Abandoning it allows for possibility, but at the cost of informational stability and strategy-proofness. The "just reject IIA" reaction underestimates that IIA isolates the structural inevitability of power concentration. Even without Pareto, IIA forces oligarchy. Therefore, the impossibility is not merely about demanding efficiency; it is about the incompatibility of democratic equality with the structural requirements of consistent, independent aggregation. Relaxing IIA avoids oligarchy, but only by accepting that social rankings depend on the context of irrelevant alternatives, a significant normative concession.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Core Knowledge: Borda and Oligarchy (8 Marks)**
  *   **5 Marks:** Correctly identifies that dropping IIA allows for possibility (e.g., Borda Count) satisfying the remaining conditions.
  *   **3 Marks:** Accurately defines the Oligarchy result (joint decisiveness + individual veto power) arising when Pareto is dropped but IIA retained.
      *   *2:1 Typical Mistake:* Defines oligarchy simply as "group dictatorship" without specifying the individual veto power.

  **2. Technical Precision: Non-Imposition Proviso (2 Marks)**
  *   **2 Marks:** Explicitly states that the Oligarchy result requires a **non-imposition** proviso. Explains that without it, a constant/imposed ordering satisfies the conditions trivially, rendering voters irrelevant.
  *   **0 Marks:** Fails to mention the proviso or explains it incorrectly.
      *   *Note:* Scripts missing this cannot score above 16 marks (Upper Second ceiling).

  **3. Critical Diagnosis: Asymmetry and IIA Critique (8 Marks)**
  *   **5 Marks (First Class):** Diagnoses the asymmetry by distinguishing IIA as a **structural/informational constraint** versus Pareto as a **substantive outcome constraint**. Explains that IIA does the "heavy lifting" in the proof.
  *   **3 Marks:** Engages seriously with the "reject IIA" reaction. Acknowledges Borda avoids oligarchy but notes the normative cost (loss of informational stability/strategy-proofness), rather than dismissing the reaction outright.
      *   *2:1 Typical Mistake:* Describes the asymmetry without diagnosing *why* it exists (structural vs. substantive), or dismisses the "reject IIA" view too simplistically.
      *   *First Class Requirement:* Must articulate the structural nature of IIA to access the top band (17+).

  **4. Structure and Clarity (2 Marks)**
  *   **2 Marks:** Argument flows logically; technical terms used precisely.
  *   **0-1 Marks:** Disorganized or imprecise terminology.

  **Grade Boundaries:**
  *   **First Class (17–20):** Secures all Core Knowledge marks + **2 Marks for Proviso** + 5 Marks for Structural Diagnosis.
  *   **Upper Second (14–16):** Secures Core Knowledge marks. May miss the Proviso (capped at 16) or offer a weaker diagnosis of the asymmetry.
  *   **Lower Second (10–13):** Recites Arrow's conditions accurately but fails to explain the Oligarchy result or the comparison adequately.
  *   **Fail (0–9):** Significant misunderstandings of the theorem or conditions.
