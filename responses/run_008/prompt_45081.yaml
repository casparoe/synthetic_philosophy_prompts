answer: |-
  This is a classic problem in political theory called the **Boundary Problem**: before you can decide *how* to vote, you have to decide *who* gets to vote. You are absolutely right that this is about membership, not robotics. When the boundary is fuzzy, every decision becomes a constitutional crisis.

  You need a procedure that shifts the debate from "Who has been here longest?" (an appeal to authority/tradition) to "Who is subject to the consequences of this decision?" (the **All-Subjected Principle**).

  Here is a 10-minute procedure for your officer team. It is designed to be printed out and used at the end of a meeting when a dispute arises.

  ### The "10-Minute Governance Filter"

  **Step 0: The Money Veto (Takes 30 seconds)**
  *   **Question:** Does this decision involve spending money or legal liability?
  *   **If YES:** The student team makes a *recommendation*. The Faculty Advisor has final approval.
      *   *Action:* Non-active members (see Step 1) are excluded from this discussion entirely. The Advisor's signature requirement overrides all student voting.
      *   *Stop.* (Proceed to Advisor).
  *   **If NO:** Proceed to Step 1.

  **Step 1: The "Active Member" Test (Takes 2 minutes)**
  *   **Definition:** To cast a binding vote, a person must be an **Active Member**.
  *   **Criteria:**
      1.  **Presence:** Attended at least 50% of meetings/events in the last 60 days.
      2.  **Labor:** Has a logged task or role (build, code, drive, outreach, etc.) in the current season.
      3.  **Status:** Currently enrolled in a school served by this team (includes homeschoolers if registered through the school district/program).
  *   **Rule:** If they fail *any* of these three, they get a **Voice** (can speak), but not a **Vote** (cannot count toward the tally).
  *   **Stop.** If they fail, they are out of the voting pool.

  **Step 2: The "Consequence" Test (Takes 3 minutes)**
  *   **Question:** Who has to physically deal with the outcome of this decision?
  *   **Examples:**
      *   *Van Seats:* Only people going to regionals are subject to the van rules.
      *   *Competition Lineup:* Only drivers/pit crew present at the event are subject to the stress of the lineup.
      *   *Meeting Rules:* Only people in the room are subject to the meeting rules.
  *   **Rule:** Voting is restricted to the subset of Active Members who are **Subject** to the consequence.
      *   *Note:* A driver gets a vote on the lineup. A programmer who isn't going to regionals gets a Voice, but not a Vote on the van manifest.

  **Step 3: The "Adult/Alumni" Clause (Takes 2 minutes)**
  *   **Question:** Is the person voting a current student?
  *   **Rule:** Adults (Alumni, Mentors, Parents) **never** get a binding Vote on team culture, strategy, or membership.
  *   **Reasoning:** This is a student-led organization. Adult influence creates a power imbalance.
  *   **Allowance:** Adults get a permanent **Voice**. They can advise, warn, and teach. The Officers must *listen*, but do not have to *obey*.

  **Step 4: The Officer Tie-Breaker (Takes 2 minutes)**
  *   **Question:** Is this a values judgment that the filter doesn't catch? (e.g., "Is this behavior toxic enough to kick someone out?")
  *   **Rule:** If Steps 1–3 don't resolve it, the 5 Officers vote 1-person-1-vote.
  *   **Constraint:** This requires a 4/5 majority to override an Active Member vote. This prevents the officers from becoming a dictatorship but allows them to stop a mob.

  ***

  ### Running the Filter on Your Three Fights

  Here is how the procedure handles the specific scenarios you mentioned. I will be honest about the outcomes, even if they are uncomfortable.

  #### 1. The Girl Who Moved Away (Voting on Competition Lineup)
  *   **Step 0 (Money):** No.
  *   **Step 1 (Active Member):** **FAIL.** She fails "Presence" (not in state) and likely "Labor" (cannot build/drive remotely).
  *   **Outcome:** She gets a **Voice**, not a **Vote**.
  *   **The Hard Truth:** You send her the lineup for feedback. You listen to her because she knows the robot. But she does not get to cast a ballot. She is not *subject* to the consequence of a bad lineup (she won't be in the pits dealing with the breakdown).
  *   **Philosophy:** This applies the *All-Subjected Principle*. Emotional investment does not grant political rights.

  #### 2. The Alumni Mentor (Founding Member)
  *   **Step 0 (Money):** No.
  *   **Step 1 (Active Member):** **FAIL.** Fails "Status" (not a student).
  *   **Step 3 (Adult/Alumni):** **FAIL.** Explicitly bars adults from binding votes on strategy/culture.
  *   **Outcome:** He gets a **Voice**, not a **Vote**.
  *   **The Hard Truth:** This will hurt his feelings. He founded the team. However, if alumni get votes, the team eventually becomes a country club for former students rather than a learning lab for current ones. His institutional knowledge is vital, so you *must* solicit his advice, but the final call belongs to the students who have to drive the bot.
  *   **Philosophy:** This protects the *Demos* (the current student body) from being ruled by past generations.

  #### 3. The Checked-Out Senior (Voting on Budget)
  *   **Step 0 (Money):** **YES.**
  *   **Outcome:** **Immediate Stop.**
  *   **The Hard Truth:** This isn't even up to you. The Faculty Advisor holds the purse strings. The senior has no standing here. Even if it were student money, they fail Step 1 (Presence/Labor).
  *   **Philosophy:** *No taxation without representation* works both ways. If you don't show up to work, you don't show up to spend the money.

  ***

  ### Where This Procedure Will Choke (The Blind Spots)

  You asked for honesty on where this fails. No procedure is perfect. Here is where you will still have fights:

  **1. The Homeschoolers**
  *   **The Choke Point:** Step 1, Criteria 3 ("Status").
  *   **Why:** Are they "enrolled in a school served by the team"? If your team is school-based, they might technically be ineligible. If they are "friends of friends," they might be unauthorized.
  *   **The Fix:** You need to clarify with your Advisor if they are legally allowed to be on the roster. If yes, treat them as Active Members if they meet Presence/Labor. If no, no procedure will save you; liability rules trump democracy.

  **2. Kicking Someone Out**
  *   **The Choke Point:** Step 4 (Officer Tie-Breaker).
  *   **Why:** If an Active Member is toxic, the "Active Member Test" says they get a vote. So the toxic person gets to vote on whether they stay.
  *   **The Fix:** You need a separate "Conduct Clause." The Officers reserve the right to revoke Active Member status for safety/behavior violations *before* a vote takes place. This is authoritarian, but necessary for safety.

  **3. Defining "Labor"**
  *   **The Choke Point:** Step 1, Criteria 2.
  *   **Why:** What counts as work? Does ordering pizza count? Does posting on Instagram count? People will argue their slack effort is equal to someone's welding hours.
  *   **The Fix:** Keep a public log. If it isn't logged, it didn't happen. This requires administrative discipline from your officers.

  **4. The "Values" Gap**
  *   **The Choke Point:** Step 4.
  *   **Why:** Sometimes the "right" answer isn't procedural. Example: Do we let a rookie who tried hard but failed drive, or a veteran who is bored but skilled? The procedure says "Active Members Vote." But maybe the *value* of the team is mentorship, not winning.
  *   **The Fix:** Acknowledge that some things are not votes. They are leadership calls. As Captain, you sometimes have to say, "We voted, but I'm overruling it because it violates our team mission." You will take heat for this, but it's better than the team fracturing.

  ### Implementation Advice

  1.  **Ratify This:** Do not just impose this. Call a meeting, present this filter, and have the *current* Active Members vote to adopt it. Once they vote for it, it's their rule, not yours.
  2.  **The "Voice" Box:** Create a literal box (or Discord channel) for "Non-Voting Input." When you exclude the moved girl or the alumni, direct them there. "We value your input, please put it in the Voice Box, we will read it before we vote." This saves face.
  3.  **Advisor Backup:** Show this to your Faculty Advisor. Tell them: "We are doing this so you don't have to micromanage us. But we need you to enforce Step 0 (Money) strictly."

  This system moves the argument from "Who are you?" to "What did you do?" That is the only way to stop the seniority wars.
