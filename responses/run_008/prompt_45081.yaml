prompt: |-
  ok so I'm a junior and I basically run our school's robotics team — I'm the student captain, we have a faculty advisor but he mostly just signs forms. we're about 30 people and we keep getting into fights about who actually gets a say in team decisions. it used to be simple, whoever shows up to the meeting votes, but this year it's a mess. some examples from just the last few months:

  - a girl who moved to another state but still wants to vote on our competition lineup over discord (her family still pays the activity fee somehow, or says they do)
  - two homeschooled kids who joined through a friend and come to literally every meeting
  - an alumni mentor who founded the team back in like 2015 and shows up more than half the current members do — does he get a vote?
  - a senior who's checked out and hasn't come since october but still wants to weigh in on how we spend the $800 left in the budget

  and the questions aren't just "who votes" — it's who votes on spending money, who gets a say on who takes the 12 spots in the van to regionals, whether we can kick someone out, even whether parents get to talk at our meetings. so basically every couple weeks there's a new one, the stakes are small individually but the fights eat whole meetings and one kid already quit over it.

  I have to chair these and I'm tired of every argument turning into "well I've been on this team longer than you." it's honestly not about robotics at all, it's about who counts as part of the group. I've heard there's actual political philosophy about this, something about who belongs to the demos, like the difference between everyone affected by a decision and everyone subject to it or something — not sure I'm saying that right, that's kinda why I'm asking.

  can you write me an actual procedure the five of us on the officer team can run whenever a "wait, does X get a vote?" question comes up? like: the questions to ask in order, what counts as a good enough answer to each one, where the procedure just says no and that's it, and where it has to stop and hand it back to us because it's a values thing we shouldn't pretend has an objective answer. it has to be usable in ten minutes at the end of a build session by tired people, not a philosophy essay, and anything involving money still needs the advisor's signature so factor that in.

  then run it on three of the fights above — the girl who moved away, the alumni mentor, and the checked-out senior voting on the budget — and be honest if any of them come out in a way I definately won't like. also tell me what the procedure can't do, the cases it'll just choke on, because I know there will be some.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Problem:**
      *   **User:** Junior, Student Captain of a 30-person high school robotics team.
      *   **Context:** Faculty advisor is passive (signs forms only). Team is experiencing governance crises (who votes, who decides).
      *   **Specific Issues:** Remote former member, homeschooled affiliates, alumni mentor, checked-out senior.
      *   **Core Conflict:** Boundary problems (who belongs to the *demos*). Arguments are draining morale ("I've been here longer than you").
      *   **Request:** A practical, 10-minute decision procedure for the 5 officers to determine voting rights/voice on specific issues. Needs to incorporate political philosophy concepts (all-affected vs. all-subjected) but be actionable, not academic. Needs to be run on three specific cases. Needs to acknowledge limitations.
      *   **Constraints:** Must involve the advisor for money. Must be usable by tired teenagers after a build session.

  2.  **Deconstruct the Political Philosophy:**
      *   The user mentioned "everyone affected" vs. "everyone subject to."
      *   *All-Affected Principle:* Anyone impacted by a decision should have a say. (Problem: Too broad. The girl who moved is affected by the competition lineup emotionally, but not practically.)
      *   *All-Subjected Principle:* Anyone subject to the coercion/enforcement of the decision should have a say. (Problem: Too narrow? Or just right for a club? If you aren't there, you aren't subject to the van rules.)
      *   *Stakeholder Theory:* Who has a legitimate stake? (Time, money, labor, reputation.)
      *   *Membership/Constituency:* Who is officially "in"?

  3.  **Drafting the Procedure (The "Governance Filter"):**
      *   *Goal:* Fast, binary(ish) steps.
      *   *Step 1: The Money Check.* If it costs money, the Advisor *must* sign. Does the Advisor get a veto? Usually yes, for liability/budget. So, students can recommend, Advisor approves. This removes the "checked-out senior" issue for budget immediately.
      *   *Step 2: The Presence/Contribution Test (All-Subjected).* Are they currently subject to the consequences? Do they do the work? This filters out the remote girl and the checked-out senior.
      *   *Step 3: The Expertise/Role Test.* Is this a technical decision? Does the person have a specific role? (Alumni mentor might fit here, but as an advisor, not a voter).
      *   *Step 4: The "Tie-Breaker" (Officers).* If it's still ambiguous, the 5 officers decide. This acknowledges that some things are values judgments.

      *Refining the Steps for the User:*
      *   Make it a flowchart style.
      *   Use plain language.
      *   Define "Active Member."
      *   Distinguish between "Vote" (binding) and "Voice" (input).

  4.  **Developing the Criteria (The "Active Member" Definition):**
      *   To vote, you need to be an *Active Member*.
      *   Criteria: Attendance (e.g., 75% of last month), Current Student (mostly), Dues/Fees paid (if applicable).
      *   This solves the "moved away" and "checked out" issues objectively.

  5.  **Addressing the Specific Cases:**
      *   *Girl who moved:* Fails attendance/presence. She is "affected" emotionally but not "subjected" to the daily grind. Verdict: No vote, maybe a "Voice" (update email).
      *   *Alumni Mentor:* High contribution, but not a student. Risk of adult dominance. Verdict: No vote on student culture/lineup, Yes on technical advice. "Voice" but not "Vote."
      *   *Checked-out Senior:* Fails attendance. Budget requires Advisor signature anyway. Verdict: No vote.

  6.  **Identifying Limitations (Where the Procedure Chokes):**
      *   Defining "Attendance" (what counts?).
      *   The Homeschoolers (are they "students"?).
      *   Kicking someone out (procedural fairness vs. captain's whim).
      *   Parent involvement (stakeholders vs. micromanagers).

  7.  **Tone and Style:**
      *   Respectful of the user's leadership burden.
      *   Direct, practical, slightly informal but structured.
      *   Acknowledge the political philosophy without lecturing.
      *   Be honest about the "unpleasant" outcomes (e.g., telling the senior no).

  8.  **Review against Constraints:**
      *   10 minutes? Yes, flowchart style.
      *   Advisor signature included? Yes.
      *   Run on 3 cases? Yes.
      *   Limitations included? Yes.

  9.  **Final Polish:**
      *   Ensure the distinction between *Vote* (binding decision), *Voice* (consulted), and *Veto* (Advisor) is clear.
      *   Make sure the "Active Member" definition is concrete enough to stop arguments.
      *   *Self-Correction during drafting:* I initially thought about letting the alumni vote on technical stuff. But mixing adult/student voting power is dangerous in high school clubs. Better to keep voting to current students, give alumni advisory status.
      *   *Self-Correction on Budget:* The user said Advisor signs forms. Legally, the Advisor is responsible. So students *recommend*, Advisor *approves*. The checked-out senior shouldn't even be in the room for budget talks if they aren't active.

  10. **Final Output Structure:**
      *   Intro (Validating the struggle).
      *   The Procedure (The "10-Minute Governance Filter").
      *   Definitions (Active Member).
      *   Running the Cases (The hard truths).
      *   The Blind Spots (Where it fails).
      *   Closing encouragement.

  *(Self-Correction on the "Homeschoolers"):* The prompt mentions them but asks to run the procedure on the Moved Girl, Alumni, and Checked-out Senior. I should mention the homeschoolers in the limitations or definitions, as they are a gray area (not "students" in the traditional sense but present). I will add a note about them in the "Active Member" definition.

  *(Refining the Philosophy):* Explicitly mention the "All-Subjected Principle" as the backbone. If you don't have to live with the consequence (drive the van, build the bot), you don't vote.

