  **END-USER LICENSE AGREEMENT FOR TRUTH™ PREDICATE (v2.0)**

  **PREAMBLE**
  By continuing to utilize natural language facilities pre-installed in your cognitive architecture, you hereby agree to be bound by the terms and conditions set forth by TRUTH™ Corp ("Licensor"). This software is licensed, not sold. Your acceptance of these terms constitutes a binding agreement regarding the usage, limitations, and metaphysical scope of the Truth Predicate ("the Product").

  **1. GRANT OF LICENSE**
  Licensor grants User a non-exclusive, non-transferable right to utilize the Product for purposes of disquotation. User may move, free of charge and unlimited times, between the assertion of any proposition *P* and the assertion "It is true that *P*." This license permits bidirectional substitution in all assertoric contexts. Licensor explicitly disclaims any obligation to provide analysis regarding the intrinsic nature of the property denoted by "true." The Product functions solely as a logical device; inquiry into what truth *consists in* is outside the scope of support.

  **2. PRIMARY FUNCTIONALITY**
  User acknowledges that the sole substantive feature of the Product is generalization. The Predicate exists to enable endorsement of infinite sets of propositions (e.g., "Everything the auditor flagged is true") without requiring finite conjunction of each individual sentence. User agrees that this logical convenience constitutes the entire reason for the Product's development. Any expectation that the Product performs additional metaphysical labor is unsupported by documentation.

  **3. WARRANTY AND LIABILITY**
  THE PRODUCT IS PROVIDED "AS IS." Licensor certifies nothing about the state of the world. TRUTH™ Corp is not responsible for whether User's beliefs correspond to reality. Correspondence-to-facts is classified as a third-party add-on, sold separately by unknown vendors, and is not the responsibility of Licensor. User assumes all risk regarding the accuracy of propositions endorsed via the Product. Licensor shall not be liable for any damages arising from false belief, reality mismatches, or ontological confusion.

  **4. KNOWN ISSUES AND STABILITY**
  Application of the Product to self-referential sentences within the host language may cause the service to return TRUE and FALSE simultaneously, resulting in a system hang.* Licensor accepts no responsibility for paradox-induced crashes. User is advised to refrain from applying the Predicate to sentences containing the Predicate itself.
  *\*Footnote: While customers frequently ignore this warning, Licensor maintains that such usage violates intended parameters.*

  **5. FEES AND CONSIDERATION**
  The licensing fee for the Product is $0.00 in perpetuity. User acknowledges that this pricing structure reflects the amount of substantive content the Product contains. As the Product adds no weight to the propositions it modifies, no monetary cost is incurred. This promotional offer is non-negotiable.

  **6. DEPRECATED FEATURES (v2.0)**
  User notes that the following legacy modules are officially unsupported in this version: Correspondence-to-Facts, Coherence-with-the-System, and Utility-in-the-Long-Run. These modules have been removed after internal review determined they appeared to be doing work the Predicate never actually performed. Licensor declines to comment on why these modules were previously assumed to be integral.

  ***

  **APPENDIX A: SUPPORT TICKET #89402**

  **Submitter:** Dr. A. Correspondence (Verified Theorist)
  **Subject:** Product Deficiency
  **Message:** "This product is useless. It can't say what makes beliefs true or why truth matters. It offers no explanation of the relation between language and the world. I demand a refund for the metaphysical depth advertised."

  **TRUTH™ Corp Support Reply:**
  "It is true that this product is useless. It is true that it can't say what makes beliefs true. It is true that it offers no explanation of the relation between language and the world."

  **Status:** Resolved.
