answer: |-
  ### The Paltering Protocol

  **The Checklist (15 Minutes)**
  Run these questions in order. A "No" stops the process; rewrite or kill the statement.

  1.  **Is every sentence literally true?** (Fact-check dates, numbers, statuses.)
      *   *No:* Kill. (Kant's floor: Do not lie.)
  2.  **What is the reasonable inference?** (If a smart stranger reads this, what do they conclude?)
      *   *Test:* Is that conclusion false?
      *   *No:* Kill. (Grice's rule: Do not mislead via implication.)
  3.  **Is the inference cancelable?** (Can you add "but [true fact]" without sounding insane or contradictory?)
      *   *No:* Kill. (If you can't say the truth alongside the statement, the statement is hiding it.)
  4.  **Is the hidden truth material?** (Would knowing the truth change the audience's decision or trust?)
      *   *Yes:* Kill. (Paltering is still deception if it masks material risk.)

  **Tie-Breaker:** If reviewers disagree on "reasonable inference," the tie goes to the **audience's most cautious reading**, not the company's legal safety. Reputation risk outweighs technical precision.

  **Where the Procedure Ends:**
  This tool cannot resolve value conflicts about *how much* truth is owed. If the statement passes the checklist but still feels wrong, that is a values call. Default to the more cautious reading.

  ***

  ### Case Runs

  **1. The Layoff Dodge**
  *Draft:* "We're focused on supporting our team through this year."
  *Fact:* Restructuring (layoffs) is in final approval.
  *Run:*
  1.  Literal Truth? **Yes.** (You can focus on support while planning cuts.)
  2.  Reasonable Inference? **Yes.** (Reader infers: "No layoffs planned.")
  3.  Is Inference False? **Yes.** (Layoffs are coming.)
  4.  **Verdict: FAIL.**
  *Note:* You argued this should pass. The procedure disagrees. The implicature is false and material. Publishing this burns trust when the news breaks.

  **2. The Cherry-Picked Stat**
  *Draft:* "9 out of 10 customers renew with us."
  *Fact:* Denominator excludes free-trial cancellations.
  *Run:*
  1.  Literal Truth? **Yes.** (Among *paying* customers, 9/10 renew.)
  2.  Reasonable Inference? **Yes.** (Reader infers: "9/10 of *all* who try us stay.")
  3.  Is Inference False? **Yes.** (Trial churn is high.)
  4.  **Verdict: FAIL.**
  *Note:* The exclusion is material to evaluating product fit. You must qualify the denominator or drop the stat.

  **3. The "Slimy" Pass (Procedure vs. Gut)**
  *Draft:* "We never sell your personal data to data brokers."
  *Fact:* You sell "insights" derived from aggregated data to partners, which functions similarly but isn't legally "selling personal data to brokers."
  *Run:*
  1.  Literal Truth? **Yes.** (Legal definition of "broker" and "personal data" excludes your partners.)
  2.  Reasonable Inference? **Yes.** (Reader infers: "Our data stays private/unsold.")
  3.  Is Inference False? **Debatable.** (You do monetize data behavior, just not via "brokers".)
  4.  Cancelable? **Yes.** (You can say "...though we do sell aggregated insights to partners" without contradicting the first clause.)
  5.  **Verdict: PASS.**
  *Note:* The procedure clears this because the literal claim holds and the caveat is cancelable. You find this slimy. The procedure prioritizes literal truth over vibe. **This is where you must override the tool.** If the *spirit* violates trust, kill it, even if the checklist passes.

  ***

  ### Blind Spots

  1.  **Heterogeneous Audiences:** Regulators might read the literal text; customers read the implication. The procedure assumes a "reasonable reader," but if your audience is split, you may satisfy lawyers while alienating users.
  2.  **Context Drift:** A statement true today may mislead tomorrow if facts change (e.g., "no plans" becomes "plans" quickly). The checklist is a snapshot, not a timeline.
  3.  **Bad Faith Actors:** The procedure assumes a reasonable reader. It does not protect against trolls deliberately misinterpreting cancelable implications to manufacture outrage.

  **Final Rule:** The checklist prevents lies. It does not guarantee wisdom. If it passes but keeps you up at night, rewrite it.
