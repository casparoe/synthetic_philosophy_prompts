answer: |-
  **Project Title:** Reference Retention Across Theory Change: Can Criteria Be Specified Ex Ante?

  **1. Problem Statement**
  Semantic externalism, particularly the causal-historical account, successfully handles natural kind terms like "water." The Twin Earth thought experiment demonstrates that reference is fixed by environmental constitution (H2O vs. XYZ) independently of individual psychological states. However, this model presupposes that the relevant environmental contribution can be specified independently of the theories held by speakers. For theoretical terms used in scientific practice—"mass," "gene," "phlogiston," "caloric"—this independence condition is not met. The "environment" posited by the term is often constituted by the theory itself.

  When a scientific revolution occurs, the theory changes. If reference is fixed by the theory (descriptivism), reference shifts or vanishes. If reference is fixed by causal contact (externalism), we face the problem of empty terms: if phlogiston does not exist, what causal chain sustains the reference? My reading group's disagreement on whether "phlogiston" referred reflects a broader instability in the philosophy of science. One view holds it referred to nothing (eliminativism); another that it referred to real processes mischaracterized (approximate truth); a third that the dispute is verbal. Current externalist doctrines leave this open because they rely on retroactive verdicts: we decide reference retained based on whether we judge the new theory to be an improvement. This makes reference retention a consequence of scientific success rather than a condition for it.

  **2. Research Question**
  Under what conditions does a theoretical term retain its reference across a scientific revolution, and can those conditions be fixed in advance (ex ante) rather than decided retroactively based on the verdict of current science?

  **3. Methodology**
  The project proceeds in three phases, leveraging my background in physical chemistry to analyze the scientific content while applying philosophical constraints.

  *Phase 1: Criteria Construction.*
  I will formulate three competing criteria for reference continuity that do not rely on the truth of the successor theory.
  1.  **Causal Contact:** Reference retains if there is a continuous causal chain of usage, regardless of theoretical description.
  2.  **Functional Role:** Reference retains if the term occupies the same explanatory role in the network of laws (e.g., "mass" as the measure of inertia).
  3.  **Partial Overlap:** Reference retains if the extension of the old term overlaps significantly with the extension of the new term.

  *Phase 2: Case Testing.*
  I will apply these criteria to four worked cases, selected to span the spectrum of reference stability.
  1.  **Mass (Newton to Einstein):** A putative success of reference retention despite radical theory change.
  2.  **Gene (Mendel to Molecular Biology):** A case of significant conceptual expansion and fragmentation.
  3.  **Caloric (Lavoisier to Thermodynamics):** A putative failure where the term was discarded.
  4.  **Phlogiston (Stahl to Lavoisier):** The limiting case of apparent eliminativism.

  For each case, I will determine if the criteria yield a determinate verdict *without* appealing to the fact that we currently accept the successor theory. For example, does the "Functional Role" criterion predict that "phlogiston" refers to oxygen, or does it predict reference failure, prior to knowing that oxygen theory won?

  *Phase 3: Evaluation of Determinacy.*
  I will assess whether the criteria converge. If the criteria yield different verdicts for the same case (e.g., Causal Contact says "yes," Functional Role says "no"), this indicates that "reference" is not a unitary phenomenon in theoretical contexts. If the criteria only yield the "correct" verdict when tuned by our current knowledge of which theory won, the project demonstrates that reference retention cannot be fixed in advance.

  **4. Expected Outcomes and Success Conditions**
  A **successful result** will be a definitive mapping of which criteria align with scientific intuition across the cases. Ideally, this yields a robust rule: e.g., "Theoretical terms retain reference if and only if functional role is preserved, even if causal ontology shifts."
  A **negative result** (which is still a genuine philosophical result) would demonstrate that no ex ante criteria exist. If reference retention can only be settled retroactively by the victory of the new theory, then externalism cannot explain scientific progress; it merely records it.
  **Project Failure** would occur if the criteria prove too vague to apply to the historical cases without begging the question, or if the historical analysis requires expertise beyond the scope of this fellowship.

  **5. Work Plan and Feasibility**
  This is a one-year, part-time project. The scope is intentionally narrowed to avoid a comprehensive history of science.
  *   **Months 1-3:** Refine the three criteria based on current literature in philosophy of language.
  *   **Months 4-8:** Detailed analysis of the "Mass" and "Phlogiston" cases. (The "Gene" and "Caloric" cases will be treated as secondary checks only if time permits).
  *   **Months 9-12:** Synthesis and drafting of the final paper.

  **Feasibility Assessment:**
  As a recent convert to philosophy, I lack the institutional memory of current debates. However, my expertise in physical chemistry allows me to analyze the *scientific* content of the cases (e.g., the precise relation between Newtonian and Relativistic mass) with greater accuracy than is typical in armchair philosophy. The risk is philosophical naivety regarding the nuances of reference. To mitigate this, the project focuses on *testing* existing criteria rather than generating a new metaphysical system. The restriction to two primary case studies (Mass and Phlogiston) ensures the workload is manageable part-time while remaining sufficient to test the central hypothesis.

  ***

  ### Commentary and Honest Assessment

  Here is my assessment of the proposal above, specifically regarding your constraints and background.

  **1. Is the scope realistic?**
  A one-year, part-time schedule is tight for a philosopher, but for a scientist-turned-philosopher, it is viable *only if* you resist the urge to do too much history. The proposal above shrinks the question by focusing on the **criteria** rather than the history. You are not writing a history of the concept of mass; you are using mass to test a philosophical rule. This is the correct pivot. If you try to settle the historical debate on what Priestley *really* meant by phlogiston, you will drown in historiography. If you treat the standard philosophical caricature of the case as your data, you can finish.

  **2. The "Novice" Risk**
  Your reading group's split (eliminativism vs. approximate truth vs. verbal dispute) suggests you are already grappling with the core issue. The risk in the proposal is that professional philosophers might argue the question is "old hat" (Kuhn, Feyerabend, and Kripke all touched on this). To make this stand out, you must lean heavily on your **chemist's authority**. Most philosophers analyze "mass" without knowing the equations. Most analyze "phlogiston" without knowing the stoichiometry. Your unique selling point is that you can say, with authority, whether the *science* supports the continuity the philosophers are arguing about. The proposal hints at this, but in your interviews, emphasize that you are checking the *chemical validity* of the philosophical intuitions.

  **3. Further Shrinking (Plan B)**
  If you find the "Mass" case too technically demanding to philosophize about (Relativity introduces conceptual shifts that are notoriously difficult to map to reference), drop it. Focus entirely on **Phlogiston vs. Oxygen**.
  *   *Revised Question:* "Can a causal theory of reference account for the transition from Phlogiston to Oxygen without conceding that 'Phlogiston' referred to Oxygen?"
  *   This is narrower. It pits the "empty reference" view against the "mischaracterized reference" view directly. It allows you to use your specific knowledge of combustion chemistry. If the one-year timeline feels tight during the fellowship, this is the cut to make.

  **4. The "Determinable Answer" Constraint**
  You asked for a question with a determinate answer. Be careful here. In philosophy, a "No" is a determinate answer. The proposal frames it so that proving "ex ante criteria are impossible" is a success. Do not promise a positive theory of reference; promise a test of whether one is possible. This protects you from the accusation that you haven't "solved" externalism.

  **5. Final Advice**
  The proposal is written to sound like a philosopher wrote it, but it relies on your scientific capital. Do not hide your background; foreground it. The center likely wants a scientist who can do philosophy, not a philosopher pretending to be a scientist. The section on "Methodology" is the strongest part because it treats the cases as empirical tests of a philosophical hypothesis. Keep that stance.
