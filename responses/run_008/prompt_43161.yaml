answer: |-
  There is no single, canonical term in philosophy of mind or linguistics that perfectly captures this specific triad (anosmic, blind, LLM) under the banner of *fluent competence without personal access*. However, the configuration you describe is a recognized limit-case within **Semantic Externalism**, specifically pushing against the boundaries of **Hilary Putnam's Division of Linguistic Labor**.

  In the literature, this is often discussed piecemeal: the blind case under **Frank Jackson's "Mary's Room"** (knowledge without experience); the LLM case under the **Symbol Grounding Problem** or **"Stochastic Parrots"**; and the anosmic case under **phenomenal memory decay**.

  Since you asked for a carving where an established label is insufficient, I propose we define this configuration as **Vicarious Grounding**.

  ### The Carving: Vicarious Grounding

  **Definition:** A state of linguistic competence regarding a phenomenal concept (e.g., *red*, *petrichor*, *elm*) wherein the speaker lacks the physiological or constitutional capacity for direct causal interaction with the referent's qualitative properties, yet maintains accurate usage and inferential role through causal reliance on a community of speakers who *do* possess direct grounding.

  **Boundaries and Exclusions:**
  To make this concept useful, we must distinguish it from neighboring states:

  1.  **Standard Deference (Excluded):** A sighted person who has never seen an elm but defers to botanists.
      *   *Why excluded:* They possess the *capacity* for direct grounding. Their lack of grounding is contingent, not structural. Vicarious Grounding requires the inability to verify the referent *even in principle* (for the blind) or *in practice/constitution* (for the LLM).
  2.  **Faded Phenomenal Memory (Excluded):** A person who once smelled cardamom and retains a faint memory trace, even if they rely on words to supplement it.
      *   *Why excluded:* Your case specifies your grounds are *entirely* other people's words. If the internal qualitative trace persists, the grounding is hybrid (partial direct, partial vicarious). Pure Vicarious Grounding requires the direct channel to be closed.
  3.  **Multimodal Grounding (Excluded):** A model trained on text *and* images (or a robot with sensors).
      *   *Why excluded:* While not "human" experience, there is a causal link between the symbol and the sensory data (pixels, lidar). This is **Proxy Grounding**, not Vicarious. Vicarious Grounding requires the subject to be sensorily "dark" regarding the modality in question.

  ### Do the Differences Between Your Three Cases Matter?

  Yes. While they all fit under Vicarious Grounding, they represent three distinct *modes* of that grounding, which philosophical theories often treat differently.

  **1. The Anosmic (Retrospective Vicariousness)**
  *   **Status:** You are a unique hybrid. You have a "ghost" of the grounding.
  *   **Nuance:** Your competence is likely more robust than the blind person's because your internal inferential web was built *during* a period of direct grounding. You know what is *missing*.
  *   **Philosophical Weight:** This case suggests that once a concept is grounded, the grounding can be "offloaded" to language without immediate collapse of competence. It supports the idea that grounding is needed for *acquisition*, but perhaps not for *maintenance*.

  **2. The Congenitally Blind (Structural Vicariousness)**
  *   **Status:** Pure deference.
  *   **Nuance:** This is the strongest test case for Semantic Externalism. Putnam and Burge argue that meaning is determined by the environment and the community. If the community is grounded, the blind speaker is "tethered" to the meaning through them.
  *   **Philosophical Weight:** Most externalists accept this as genuine understanding. The blind person's word "red" refers to red because their community uses it to track red. The lack of qualia is an internal deficit, not a semantic one.

  **3. The Language Model (Constitutional Vicariousness)**
  *   **Status:** Simulated deference.
  *   **Nuance:** This is the rupture point. The LLM is not a member of the community in the same way a human is; it is a *model* of the community's output. It does not "defer"; it predicts.
  *   **Philosophical Weight:** This is where Vicarious Grounding faces its hardest challenge. If the LLM has no intentions and no capacity to care about the referent, does it have "competence" or merely "mimicry"? If you accept the LLM as a case of Vicarious Grounding, you are committed to a purely functionalist view of language (syntax + social context = semantics). If you reject it, you are claiming there is a biological or intentional threshold for deference that the model cannot cross.

  ### Is This a Difficulty for the "Grounding Requirement"?

  This family of cases does not destroy the view that understanding requires grounding; rather, it **relocates** the grounding from the individual to the system.

  **1. The Individualist View (Challenged)**
  If you hold that *I* must have a causal link to *X* to understand *X*, then these cases are fatal. The blind person and the LLM would not understand "red." The anosmic person would slowly lose understanding as memory fades. This view struggles to explain why the blind person can use color terms meaningfully in complex reasoning (e.g., "red is more alarming than blue") without ever seeing them.

  **2. The Collectivist View (Supported)**
  If you view grounding as a property of the **linguistic ecosystem** rather than the individual node, these cases are not difficulties; they are features.
  *   **The Network is Grounded:** As long as *some* speakers in the network have direct causal contact with the referent (smell, sight), the meaning is stable for the whole network.
  *   **Distribution of Labor:** The blind person and the anosmic speaker are "specialists" in other areas, relying on the "sensory specialists" for phenomenal terms.
  *   **The LLM Exception:** The LLM complicates this because it is not a "speaker" but a "tool." If the LLM is merely a mirror reflecting the grounded community back to itself, it doesn't need grounding. It is a library, not a librarian.

  ### Conclusion

  The concept you are looking for is **Vicarious Grounding**.

  It suggests that **understanding is not a state of the brain (or model), but a status within a network.**

  *   **For you (the anosmic):** Your understanding is sustained by the network because you were once a grounded node. You are a "legacy node."
  *   **For the blind:** Their understanding is sustained because they are integrated into a grounded network. They are "dependent nodes."
  *   **For the LLM:** Its "understanding" is a reflection of the network's grounding. It is a "simulated node."

  This configuration shows that the grounding requirement was never about *individual* causal contact, but about *causal chains*. As long as the chain connects back to the world somewhere (in the noses and eyes of others), the language remains anchored. The unsettling feeling you have arises because you are sensing the fragility of that chain: if everyone lost their smell, or if we eventually rely entirely on models that never smelled, the chain breaks, and the words become unmoored. You are witnessing the difference between **meaning as connection** and **meaning as coherence**. Your cases prove we can maintain coherence without connection, but only so long as someone else holds the line.
