      *   **Applicant B (Boy):** Family poor due to dad turning down work (perceived choice, internal factor).
      *   **Conflict:** Council is split. Some argue "fault" matters (give to A). Others argue the *child* isn't at fault in either case (give to whoever needs it most, regardless of cause). A third suggestion (sliding scale based on family choices) made things messier.
      *   **User's Dilemma:** Feels unfair to punish the child for the parent's choices, but also feels uneasy about equating voluntary unemployment with involuntary hardship. Needs a principled argument to present at the meeting on Thursday.
      *   **Constraints:** British English, practical/actionable advice (something to *say*), avoid "it's complicated" cop-outs.

  2.  **Deconstruct the Ethical Core:**
      *   **The "Fault" Argument:** Resources should go to the "deserving" poor. This is a common societal intuition but problematic in welfare ethics.
      *   **The "Child-Centric" Argument:** The fund is for *students*, not parents. The student's educational needs are the priority. Parental behaviour is outside the student's control.
      *   **The "Incentive" Argument:** If we help the "voluntarily" poor, do we encourage laziness? (Unlikely in a one-off school fund context, but a concern for some).
      *   **The "Need" Argument:** Who is worse off financially right now? (Both are "skint").
      *   **The "Impact" Argument:** Who benefits more from the trip/materials?

  3.  **Evaluate the "Fault" Line:**
      *   Is turning down work always a "choice"? As the user noted, what about depression? Disability? Caring responsibilities? It's a slippery slope. Investigating *why* a parent is unemployed invades privacy and requires the council to be judges of character, which they aren't equipped to be.
      *   *Key Insight:* The hardship fund's purpose is to ensure *educational equality* for the *student*, not to subsidise or punish *parents*.

  4.  **Formulate a Principled Stance:**
      *   **Principle 1: The Beneficiary.** The money is for the *child's* education, not the family's income support. Therefore, the child's need is the metric, not the parents' morality.
      *   **Principle 2: Epistemic Humility.** The council cannot know the full story. "Turning down work" is hearsay. It could be mental health, exploitative conditions, or caring for a sick relative. Judging based on rumours is unsafe.
      *   **Principle 3: Precedent.** If we start judging parents' employment history, every future application becomes an inquisition. That creates barriers for the most vulnerable.

  5.  **Drafting the Response (incorporating British English & Tone):**
      *   *Tone:* Empathetic, serious, practical, respectful of the user's intelligence. Not patronising.
      *   *Structure:*
          1.  Validate the feeling (it's not boring, it's proper ethics).
          2.  Address the "Fault" question directly.
          3.  Provide the "Principled Way" (The Purpose of the Fund).
          4.  Address the "Slippery Slope" (Depression/Back pain).
          5.  Give specific scripts/phrases for the meeting.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Tell them to flip a coin. *Correction:* No, that's dismissive. They need a rationale.
      *   *Initial thought:* Say give it to the girl because the boy's dad is lazy. *Correction:* No, that validates the "fault" argument the user is struggling with.
      *   *Better approach:* Focus on the *criteria of the fund*. What is it *for*? If it's for "financial hardship affecting education," then the *cause* of the hardship is secondary to the *existence* of the hardship.
      *   *Nuance:* Acknowledge the frustration. It *does* feel galling to help someone who "chose" it. Validate that feeling but explain why acting on it is problematic.

  7.  **Developing the "Script":**
      *   Need soundbites that sound like a thoughtful student council member, not a philosophy professor.
      *   "We aren't judging parents, we're supporting students."
      *   "We don't have the full picture."
      *   "If we start investigating parents' jobs, we stop being a support system."

  8.  **Final Polish (British English Check):**
      *   Use "skint," "mum/dad," "uni" (if needed), "maths," "programme."
      *   Ensure the tone is polite but firm ("I take the point, but...", "Here's the rub...").

  9.  **Addressing the Specific Questions:**
      *   *Is there a principled way?* Yes, focus on the beneficiary (the child).
      *   *Where to draw the line?* You don't. You can't diagnose parents.
      *   *How is it unfair to the girl?* It isn't, if the criteria is *current need*, not *past cause*.

  10. **Final Review against constraints:**
