  ### The Honest Bottom Line

  If you fixed the errors, the episode's bottom line would shift from "This theory is broken" to "This theory is controversial but consistent." The host was right that teleosemantics ties meaning to evolutionary history rather than just what's happening in your brain right now, and he was right that this leads to strange results like Swampman having no thoughts. However, he was wrong to say the theory cannot explain error; your intuition about your dog is correct, and the theory agrees with you (the dog is malfunctioning relative to its design). The honest version is: **Teleosemantics is a bold attempt to ground meaning in biology that solves some problems by accepting counter-intuitive results, but it is still fighting a major battle over whether it can fully explain how we make mistakes.** It isn't dead, but it isn't settled science either.
