          *   *Follow-up:* If he says "probability is too low," ask where the cutoff is and why it's not arbitrary.
          *   *Polishing:* "Imagine a stranger approaches you after this talk..."

      *   *Requirement 4: Behavioral Cash-Out (The EA Question).*
          *   *Draft:* Do you donate differently?
          *   *Refinement:* Compare him to a standard Effective Altruist. Is this just theory or life?
          *   *Follow-up:* If he says "I'm imperfect," ask if the *theory* demands more.
          *   *Polishing:* "I want to ask about your checkbook..."

      *   *Filling the remaining 4-6 questions:*
          *   Need to cover other aspects of infinite ethics/decision theory to reach 8-10 total.
          *   *Idea 5: Paralysis Problem.* If every act has infinite consequences, how do you choose? (Related to infinite ethics but distinct from the hospital question).
          *   *Idea 6: Discounting.* Why not discount the future? (Standard counter to longtermism).
          *   *Idea 7: Person-Affecting View.* Why not just care about existing people? (Challenge the aggregative part).
          *   *Idea 8: The "Working On It" Defense.* Pre-empt the deflection directly.
          *   *Idea 9: Risk of Harm.* What if the astronomical outcome is negative (suffering)?
          *   *Idea 10: Closing/Regret.* If you're wrong, what's the cost?

  4.  **Refining and Polishing (Applying the "Teeth"):**
      *   *Check:* Do these allow the "philosophers are working on it" escape?
