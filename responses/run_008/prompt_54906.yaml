          2.  Infinite ethics/causal impact (does funding a hospital matter in an infinite total?).
          3.  Pascal's Mugging scenario (eternal bliss for salary, unverified).
          4.  Behavioral cash-out (does he actually donate differently than a normal EA?).
      *   **Tone:** Relaxed but probing/not soft.

