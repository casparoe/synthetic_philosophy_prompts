      *   Tone: Relaxed but sharp.

  6.  **Writing the Output:** (Self-Correction during drafting: Ensure the follow-ups are clearly labeled and distinct from the main questions. Make sure the "philosophers are working on it" deflection is explicitly blocked in the framing.)

      *   *Question 1 (Fanaticism):* Focus on the trade-off.
