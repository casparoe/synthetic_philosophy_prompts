answer: |-
  This is a fascinating puzzle in political philosophy. Your friend isn't just guessing; she is applying a coherent, specific theory of liberty. Based on her track record, we can deduce her operating rule, identify a rival rule that fits the same data, and then use your cases to see which one forces her to reveal which rule she's actually using.

  ### 1. The Friend's Likely Rule: "Freedom as Non-Domination"

  Your friend's judgments align almost perfectly with the **Republican Theory of Liberty** (championed by philosophers like Quentin Skinner and Philip Pettit).

  *   **The Rule:** You are **unfree** if you are subject to the *arbitrary will of another person*, regardless of whether they actually interfere. You are **free** if the constraints on you are either self-imposed (autonomy) or non-human (nature/psychology).
  *   **Why it fits her record:**
      *   **Slave & Shopkeeper:** They have a "Master." Even if the Master is nice, the *structure of dependency* exists. The Master *could* interfere arbitrarily. Therefore: **Not Free.**
      *   **Citizen:** She is not subject to another's will; she is subject to laws she authored herself. This is non-arbitrary. Therefore: **Free.**
      *   **Scared Flyer:** The constraint is internal (fear), not the result of another person's power over him. Therefore: **Free.**

  ### 2. The Rival Rule: "Freedom as Absence of External Obstacles"

  There is another rule that fits her track record just as well, but implies a different boundary.

  *   **The Rule:** You are **unfree** if there is an *external obstacle* (human or natural) that you cannot control. You are **free** if the obstacle is internal (your own choice or psychology).
  *   **Why it fits her record:**
      *   **Slave & Shopkeeper:** The Owner/Dictator is an *external obstacle* with the power to block actions. Therefore: **Not Free.**
      *   **Citizen:** The laws are not "external" in the relevant sense because she authored them (they are an expression of her will). Therefore: **Free.**
      *   **Scared Flyer:** The fear is *internal*. Nothing external is stopping him. Therefore: **Free.**

  ### 3. Analyzing Your Three Cases

  Here is how your friend will likely judge them, and how well they test the rules.

  #### Case A: The Uncle (Stroke)
  *   **Situation:** Physical inability, no human master, wants to travel.
  *   **Prediction:** **Free.**
  *   **Reasoning:** This is structurally identical to the **Scared Flyer**. One is a psychological inability, the other is a physical inability, but in both cases, no *other person* is stopping him.
  *   **Discriminatory Power:** **Low.** Both the "Non-Domination" rule and the "External Obstacle" rule agree here. Neither counts physical disability as political unfreedom (distinguishing "freedom" from "ability").

  #### Case B: The Daughter (Adored but Controlled)
  *   **Situation:** Father has legal power to forbid, but doesn't use it.
  *   **Prediction:** **Not Free.**
  *   **Reasoning:** This is a near-exact replica of the **Slave** and **Shopkeeper** cases. It tests whether benevolence matters. Her record suggests it does not; the *power to interfere* is what removes freedom.
  *   **Discriminatory Power:** **Low.** This just confirms the pattern she has already established. It doesn't tell us anything new about the *limits* of her definition.

  #### Case C: The Shipwreck (Island)
  *   **Situation:** Trapped by nature (ocean), no human master, wants to leave.
  *   **Prediction:** **The Pivot Point.**
  *   **Reasoning:** This is the only case that introduces a constraint that is **External** but **Non-Human**.
      *   If she follows **Rule 1 (Non-Domination):** She will say he is **Free**. Why? Because no *person* dominates him. He is his own master, even if his master is stuck on an island. His problem is a lack of *power*, not a lack of *freedom*.
      *   If she follows **Rule 2 (External Obstacles):** She will say he is **Not Free**. Why? Because there is an insurmountable external barrier (the ocean) preventing his will from being realized, which he did not choose.
  *   **Discriminatory Power:** **High.** This is the only case that splits the two viable theories.

  ### Conclusion

  **The Shipwreck is your best case.**

  Bring the Shipwreck to dinner.
  *   If she says he is **Free**, she confirms she believes freedom is purely about **social status** (not being a slave to a person), regardless of physical reality.
  *   If she says he is **Not Free**, she reveals her rule is actually about **effective agency** (being able to act on your will), provided the barrier isn't internal.

  **My bet?** Given how strongly she defended the "Scared Flyer" as free, she likely distinguishes sharply between *internal* constraints and *external* ones, but also between *human* oppression and *natural* misfortune. She will probably call the Shipwreck **Free**, arguing that while he lacks the *ability* to leave, he retains the *freedom* (no one owns him). This would cement her as a strict "Non-Domination" theorist.

  **Summary of Predictions:**
  1.  **Uncle:** Free (Matches Flyer).
  2.  **Daughter:** Not Free (Matches Slave).
  3.  **Shipwreck:** **Free** (Most likely, but this is the question that reveals her philosophy).
