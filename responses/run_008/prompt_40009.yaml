answer: |-
  This is a sophisticated and provocative draft. You successfully pivot the debate from the technicalities of *nullum crimen sine lege* to the deeper political legitimacy of "victor's justice." The move to prioritize **symmetry** over **notice** is the essay's strongest asset.

  However, your "change-of-forum" argument regarding domestic law is legally and historically vulnerable. Below are blunt critiques addressing your three specific questions, followed by historical qualifications.

  ### 1. The "Change-of-Forum" Argument and Domestic Law
  **Does the argument survive the objection that Nazi Germany authorized the conduct?**

  **No, not in its current form.** You are helping yourself to an ambiguous notion of "law in force."

  Your argument rests on the claim that defendants had notice because "ordinary German criminal law criminalized murder." This is a formalist argument that ignores the operative legal reality of the Third Reich.
  *   **The *Führerprinzip*:** In the Nazi legal state, the will of the Führer was the supreme source of law. Where that will was expressed (e.g., the "Euthanasia" decrees, the Nuremberg Laws, the Commissar Order), it superseded ordinary penal code provisions. To tell a camp commandant that "murder was illegal under the German Penal Code" ignores that he was operating under specific statutory and executive exemptions that rendered the killing *lawful* within that jurisdiction.
  *   **Crimes Against Humanity:** This count specifically covered persecution on political, racial, or religious grounds. You concede this is "harder," but you underestimate the difficulty. The Holocaust was not a rogue violation of domestic law; it was a domestic legal project. Claiming the defendants had "notice" that this was criminal because "murder is wrong" conflates moral notice with legal notice. The *nullum crimen* objection is about *legal* predictability.
  *   **The Forum/Law Distinction:** Legally, Nuremberg did not apply German law; it applied the London Charter. If I commit an act legal in my home jurisdiction but illegal in a foreign tribunal's charter, I am being judged by a *new* law, regardless of whether that new law overlaps with my domestic moral norms.

  **Recommendation:** Soften the claim that domestic law provided sufficient notice for Crimes Against Humanity. Restrict the "change-of-forum" defense primarily to **War Crimes** (treatment of POWs, Hague violations), where the Wehrmacht code and international treaties did provide clearer, pre-existing notice that was simply ignored. Concede that for the Holocaust, the "retroactivity" objection is stronger, which makes your pivot to "symmetry" even more necessary.

  ### 2. Notice vs. Constraint of Officials
  **Is this distinction doing real work, or is it relabeling?**

  It is doing **philosophical** work, but not **legal** work.

  *   **The Distinction:** You are distinguishing between the *subjective* right of the defendant (fair notice) and the *objective* function of the legal system (constraining power). This is a valuable jurisprudential move. It allows you to say: "Even if the defendants felt surprised (notice), the trial was necessary to constrain state power (function)."
  *   **The Relabeling Risk:** The standard defense ("Customary International Law existed") already attempts to solve the notice problem. Your argument ("Domestic law existed, enforcement was the problem") is distinct, but it risks sounding like a justification of *ex post facto* punishment based on moral outcome.
  *   **Does it work?** It works best if you frame it as a **jurisdictional** argument rather than a **substantive** one. You are arguing that the *nullum crimen* principle protects against new *crimes*, not new *courts*. However, because the London Charter defined the *elements* of the crimes (which differed from German law), it was effectively a new substantive law.

  **Recommendation:** Be precise. Acknowledge that legally, this *is* a change of law (Charter vs. Domestic Code). Argue that morally, the lack of notice is mitigated by the malum in se nature of the acts, but do not claim the *legal* doctrine of *ex post facto* is satisfied simply because the forum changed. The doctrine cares about the rule being applied, not just the judge applying it.

  ### 3. Notice vs. Symmetry
  **Does the contrast hold up given that selectivity exists in all courts?**

  **Yes, this is the strongest part of the essay,** provided you sharpen the definition of "selectivity."

  *   **Prosecutorial Discretion vs. Structural Immunity:** A defender of the tribunals might argue that all courts are selective (resources, jurisdiction). Your counter-argument must be that Nuremberg/Tokyo exhibited **structural immunity**, not mere discretion. Domestic courts do not grant blanket immunity to the political leadership of a rival sovereign entity involved in the same conflict.
  *   **The "Victor's Justice" Charge:** The symmetry argument holds because the selectivity was *political*, not *legal*. The Allies exempted themselves from the very norms they were enforcing (e.g., area bombing, submarine warfare). This undermines the *rule of law* claim more than retroactivity does. Retroactivity is a technical flaw; asymmetry is a legitimacy flaw.
  *   **Prospective Codification:** You are correct that prospective law (like the Rome Statute) does not fix symmetry if the enforcement mechanism remains political (e.g., UN Security Council referrals).

  **Recommendation:** Explicitly distinguish between "jurisdictional selectivity" (which all courts have) and "political immunity for victors" (which undermines the rule of law). This inoculates you against the "all courts are selective" counter-argument.

  ### Historical Qualifications & Blunt Critiques

  1.  **The Wehrmacht Code:** Be careful citing the Wehrmacht code as evidence of notice. The *Kriegsraison* (necessity of war) doctrine was often interpreted to override international law. Furthermore, the **Commissar Order** (1941) explicitly mandated the execution of Soviet political commissars, directly violating Hague norms. Citing the Wehrmacht code without acknowledging that it was systematically overridden by superior orders weakens your "notice" claim.
  2.  **Kellogg-Briand:** You are right that it bound states, not individuals. However, the prosecution argued that the Pact, combined with other treaties, crystallized into customary law criminalizing aggression by 1939. While weak, it wasn't non-existent. Your dismissal is fair, but acknowledge the prosecution's argument before dismissing it.
  3.  **Tokyo and Hirohito:** The exemption of Hirohito was indeed political, but note that Justice Pal's dissent was not just about symmetry; he argued for the acquittal of *all* defendants based on the retroactivity and colonial hypocrisy of the Allies. Your focus on symmetry is accurate, but Pal's argument was broader.
  4.  **Katyn:** The Soviets successfully blamed Katyn on the Germans at Nuremberg. This was not just "kept outside the scope"; it was active deception within the tribunal. This strengthens your symmetry point (the tribunal was used to whitewash Allied crimes).

  ### Summary of Suggested Revisions

  1.  **Retreat on Domestic Law:** Do not claim German domestic law provided adequate notice for Crimes Against Humanity. It creates a historical blind spot regarding the legal nature of the Nazi state. Restrict the "forum not law" argument to War Crimes (POWs, conduct in battle).
  2.  **Clarify the Legal/Philosophical Split:** Admit that *legally*, Nuremberg was retroactive. Argue that *philosophically*, the notice violation is less important than the symmetry violation.
  3.  **Sharpen the Symmetry Argument:** Distinguish between normal prosecutorial discretion and the structural immunity of the victors. This is your killer point; don't let it get bogged down in the technicalities of the *nullum crimen* defense.

  **Verdict:** The essay's central pivot (from notice to symmetry) is excellent and worth saving. The supporting argument regarding domestic law is historically fragile and risks undermining your credibility on the historical details. If you tighten the historical claims, the philosophical payoff is significant.
