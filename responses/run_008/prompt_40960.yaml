      *Additions:* I should add one about *political coercion* (who forces this?) and one about *failure modes* (what if it goes wrong?).

      *Let's consolidate to the strongest 10.*

      1.  **Motivation/Gradients:** The core technical claim.
      2.  **Consent/Asymmetry:** The core ethical claim.
