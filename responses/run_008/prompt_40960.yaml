      *Wait, I need to ensure the "Follow-up" is the star.* The prompt asks for "Question -> Anticipated Reply -> Follow-up."
      *Also, flag softballs.*

      *Self-Correction on Q4 (Wild Animals):* This is the most radical part. I need to press on the *mechanism*. Gene drives? Nanobots? It often sounds like magic. I need to ask about the *predator* problem specifically.

