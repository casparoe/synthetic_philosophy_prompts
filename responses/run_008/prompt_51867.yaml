prompt: |-
  I'm a second-year PhD student in psychology, and this whole replication crisis thing just got very real for me: I spent most of this year trying to replicate a published social psych effect from 2014, ran it with a bigger sample than the original, and got absolutely nothing. My supervisor says the original was probably p-hacked, but the methods guy in our lab says the problem runs deeper, that the whole frequentist machinery (the p-values, the null hypothesis testing, the .05 threshold) is what made this mess inevitable, and that Bayesian stats would fix it. I was sceptical of that claim, so I went back and read up on the obvious case study: Daryl Bem's 2011 paper Feeling the Future in the Journal of Personality and Social Psychology, where he reported nine experiments, each statistically significant, apparently showing precognition -- people's responses were influenced by stimuli they hadn't seen yet. I want to understand that episode properly, not just the punchline everybody repeats.

  Here's what I'd like you to do: analyse the Bem affair as a case study in the frequentist-versus-Bayesian dispute, in both directions. On the one side: what the frequentist apparatus actually delivered and where it arguably went wrong -- significance testing with no regard for the prior plausibility of precognition, plus the usual forking-paths diagnosis (optional stopping, flexible exclusion criteria, multiple DVs). On the Bayesian side: the reanalysis by Wagenmakers and colleagues published as a comment in the same journal, which used default Bayes factors and concluded the evidence actually favoured the null, and Bem's pushback that with more reasonable priors and a Bayesian framing the data look fine, plus his later meta-analysis claiming dozens of studies supporting the effect. But then also note the awkward bits: the field as a whole didn't update towards precognition even before any replication attempt -- scientists behaved like Bayesians with low priors regardless of the machinery -- and the replications that eventually sank the whole thing (the failed attempts by Ritchie, Wiseman and French, for instance) were themselves analysed in standard frequentist fashion. So did Bayes actually do any work here, or just provide a vocabulary?

  Finish by telling me where the frequentist/Bayesian lens genuinely explains the episode and where it's silent. My instinct is that the real culprits were things neither framework touches -- publication incentives, journal review that waved the paper through, the file drawer -- and that a pious Bayesian could have p-hacked their priors just as happily. Is that right, or is there something intrinsic to Bayes (pre-registration of priors, no optional stopping penalty, etc.) that would have prevented this particular car crash? Please be disciplined about the mapping: say which parts of the story each framework actually gets a verdict on, and don't force it to speak where it's quiet. Also, and this matters for me: given what the case shows, should I be fighting my supervisor to retrain myself as a Bayesian, or is that a category error? Please write your answer in British English (analyse, behaviour, etc.). Apologies for typos, I'm typing this on a train on my way back from another failed data collection.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year PhD student in psychology.
      *   **Context:** Just failed to replicate a 2014 social psych effect. Supervisor blames p-hacking; Lab methods guy blames frequentism and advocates Bayesian stats.
      *   **Task:** Analyse the Daryl Bem (2011) "Feeling the Future" affair as a case study in the Frequentist vs. Bayesian dispute.
      *   **Specific Requirements:**
          *   Analyse the Frequentist side (what it delivered, where it went wrong: p-values, priors, forking paths).
          *   Analyse the Bayesian side (Wagenmakers et al. reanalysis, Bem's pushback/priors, meta-analysis).
          *   Address the "awkward bits" (field didn't update, replications were frequentist).
          *   Evaluate if Bayes actually *did* work or just provided vocabulary.
          *   Conclude on where each lens explains the episode and where it is silent.
          *   Address the user's instinct (incentives, publication bias vs. intrinsic Bayesian benefits).
          *   Advise on whether to retrain as a Bayesian.
          *   **Tone/Style:** British English (analyse, behaviour), empathetic but rigorous, disciplined mapping (don't force frameworks to speak where quiet).
          *   **Constraint:** Acknowledge the user's situation (failed data collection on a train).

  2.  **Deconstruct the Bem Affair (2011):**
      *   *The Paper:* 9 studies, standard $t$-tests/ANOVAs, $p < .05$, claim precognition.
      *   *The Frequentist Critique:* $p$-values measure $P(Data|H_0)$, not $P(H_0|Data)$. Low prior probability of ESP means even "significant" results are likely false positives. $p$-hacking (optional stopping, multiple DVs) inflates Type I error.
      *   *The Bayesian Critique (Wagenmakers et al., 2011):* Used default Bayes Factors (BF). Most studies showed anecdotal or weak evidence for $H_1$, often favouring $H_0$.
      *   *Bem's Defence:* Default priors were too sceptical. With informed priors, BFs support $H_1$. Later meta-analysis claimed support.
      *   *The Outcome:* Large scale replications (Ritchie et al.) failed. Field rejected the claim.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the user's pain (failed replication is rite of passage). Validate the frustration. Set the stage for the Bem analysis.
      *   **The Frequentist Verdict:**
          *   *What it did:* Provided a standardised threshold ($p < .05$). Allowed Bem to publish.
          *   *Where it failed:* Ignored base rates (prior plausibility). $p$-values are vulnerable to "researcher degrees of freedom" (optional stopping, etc.). The "significance" filter let noise through.
      *   **The Bayesian Verdict:**
          *   *Wagenmakers et al.:* Showed that when you weigh the likelihood of the data under $H_1$ vs $H_0$, the evidence was weak. Quantified scepticism.
          *   *Bem's Counter:* Priors are subjective. If you believe ESP is possible, the BF changes.
          *   *Did it fix it?* It provided a *language* for scepticism, but didn't stop publication.
      *   **The Awkward Bits (Crucial Analysis):**
          *   Scientists acted like Bayesians intuitively (low priors on ESP) despite frequentist stats.
          *   Replications (Ritchie et al.) used frequentist null results to kill the theory.
          *   So, did Bayes matter? It clarified the *argument*, but social norms did the heavy lifting.
      *   **Silence of the Frameworks:**
          *   Neither framework fixes *incentives*.
          *   Neither stops publication bias (file drawer).
          *   A Bayesian *can* p-hack priors (subjectivity).
          *   Neither fixes peer review laxity.
      *   **Advice for the PhD Student:**
          *   Is it a category error to switch entirely? Yes, mostly.
          *   Tools vs. Ideology. Learn Bayes for what it adds (quantifying evidence, incorporating prior knowledge), not as a moral salvation.
          *   Focus on open science practices (pre-registration) which help *both* frameworks.
      *   **Conclusion:** Summarise. Empathise again.

  4.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Check:* Did I address the "pious Bayesian could p-hack priors" point? *Yes, need to emphasise that subjectivity in priors is a vulnerability.*
      *   *Check:* Did I distinguish between what Bayes *can* do (optional stopping robustness) vs. what it *did* in this case? *Yes, note that Bem didn't pre-register priors.*
      *   *Check:* British English? *Ensure 's' instead of 'z' in analyse, behaviour, etc.*
      *   *Check:* Tone? *Needs to be supportive but intellectually honest. Don't gaslight the student about their failed replication.*
      *   *Check:* The "Methods Guy" claim. *Is he right that Bayes fixes the mess?* No, it mitigates specific statistical issues but not systemic ones. Need to be clear on this.

  5.  **Drafting the Content (incorporating specific details):**
      *   Mention Wagenmakers, Wetzels, Borsboom, & van der Maas (2011).
      *   Mention Bem's response (2011).
      *   Mention Ritchie, Wiseman, & French (2012) or the larger Many Labs/registered replication reports context (though Ritchie et al. is specific to ESP).
      *   Highlight the difference between $P(D|H)$ and $P(H|D)$.
      *   Address the "optional stopping" rule (Bayes allows it *in theory*, but only if the model is honest).

  6.  **Final Polish:**
      *   Ensure the distinction between *statistical machinery* and *scientific culture* is sharp.
      *   Make sure the advice is actionable: "Learn both, prioritise open science."
      *   Check word count and flow.

  7.  **Final Review against constraints:**
      *   British English? Yes.
      *   Addressed specific Bem/Wagenmakers dynamic? Yes.
      *   Addressed the "silent" parts of the frameworks? Yes.
      *   Addressed the student's career advice? Yes.
      *   Empathetic opening/closing? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to say Bayes *allows* optional stopping without qualification. It allows it *mathematically* without inflating error rates in the same way, but if you peek and stop only when the BF looks good, you can still bias the inference if you don't model the stopping rule. I should phrase this carefully so as not to give the "Methods Guy" too much easy ammo. Actually, the standard Bayesian argument is that the Likelihood Principle means stopping rules are irrelevant *for the interpretation of the data collected*, but practical decision-making still requires care. I will stick to the consensus view: Bayes is more robust to optional stopping *in principle*, but human behaviour remains the variable.

