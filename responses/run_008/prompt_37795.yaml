prompt: |-
  So for context: I'm in my school's environmental club and we're doing this event where people take little quizzes we make and find out where they actually stand on stuff (we did one about zoos last month and it got surprisingly heated lol). I got assigned pest control because of two things that happened kind of close together — a girl in my history class did a presentation on malaria and how spraying for mosquitoes saves tons of lives, and then around the same time our local paper had this thing about bee die-offs from neonicotinoid pesticides. So now I can't stop thinking about how the same basic activity, killing insects with chemicals, looks completely different depending on why you're doing it and what's dying.

  Here's what I want: a "which pest control ethics do you actually hold?" quiz, like 8-10 questions, each one a concrete situation with 2-3 answer options. Situations I want in there for sure: mosquito spraying in a malaria zone, dealing with ants in your kitchen, whether you'd use a slow-killing method like a glue trap versus something faster, choosing between a synthetic pesticide and an organic one (like the organic ones are still poisons, they're just derived from plants, which seems like it matters but I'm not sure how), spraying your lawn just because you don't like dandelions, and whether scale matters — like is a farm that kills a bazillion insects per acre different in kind from swatting one mosquito. Also maybe factory farms and whether insects being tiny and numerous changes anything morally.

  The key part is a scoring key at the end that maps answer patterns onto actual positions: the everything-for-humans view (pest control is just fine, end of story), the suffering-counts view where quick kills or deterrence are way better than slow ones, the "natural is ok, synthetic isn't" position, the scale-sensitive one where the sheer number of deaths is what matters most, the total-avoidance position (like ahimsa, won't kill anything even roaches), and whatever else fits. Big rule from our club advisor: no question can just directly ask "do you think insects can feel pain" or anything like that — it has to sort people by what they'd actually do in the situation, not by which label they like. And if some combination of answers doesn't match any named position, say so instead of forcing it. Pls also flag if two of the positions are basically impossible to tell apart with case questions, because someone in the club WILL ask. Thanks!!
