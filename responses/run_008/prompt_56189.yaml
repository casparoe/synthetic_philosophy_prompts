      *   *Actually, the "Aging" analogy is the standard competitor in transhumanist circles.* But is it better? Yes, because aging is also a "natural" process we treat as a pathology.
      *   *Let's stick to Public Health:* **Eradicating Malaria.** It has a vector (mosquito), a reservoir (humans/mosquitoes), requires environmental modification. But still, the pathogen is external.
