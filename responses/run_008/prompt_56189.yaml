      *   *Wait, I need to commit.* I will suggest **The Eradication of a Recessive Genetic Disorder via Universal Germline Screening.** It captures the "inheritance" and "rewrite" aspects better than an infectious disease.

      *Refining the Better Analogy:* The prompt asks for a public health comparison *or something outside*.
