  4.  **Analyzing Disanalogies (The "Audit"):**
      *   *External vs. Internal:* Smallpox is an invader; suffering is a feature. *Verdict:* Matters deeply for "moral cleanliness" (autonomy/identity).
      *   *Discrete vs. Continuous:* Virus is binary (infected/not); suffering is analog and functional. *Verdict:* Matters for "feasibility" (can you actually count cases?).
