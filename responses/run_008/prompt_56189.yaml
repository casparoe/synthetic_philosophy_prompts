      *   *Idea:* **Pain Management in Palliative Care.** We don't abolish the disease (death), we abolish the suffering associated with it.
      *   *Let's go with:* **The Eradication of Iodine Deficiency.** It required adding something to the diet (salt), it was a biological need, it prevented suffering (cretinism), but it didn't change human nature, just supplemented it.
      *   *Actually, the most faithful analogy for "rewriting the reward architecture" is:* **The Domestication of Animals.** It explicitly admits we are changing the nature of the being to suit our moral/functional ends.

      *Decision:* I will propose **The Domestication of Wild Species** as the superior analogy. It admits the intervention is about changing the *organism*, not removing an *invader*.

