answer: |-
  # Interactive Feature: Which Trolley Are You?

  **Introductory Text:**
  You probably know the labels: *Utilitarian. Deontologist. Virtue Ethicist.* You might even wear one on your lapel. But moral philosophy isn't about the labels we choose; it's about the judgments we make when the labels aren't in the room. Below are ten concrete scenarios involving threats, sacrifices, and choices. There are no trick questions, and there is no "correct" score. Answer based on your gut verdict, not the theory you think you should hold. At the end, we'll show you which philosophical cluster your intuitions actually resemble—and where they contradict the label you came in with.

  ***

  ## The Questions

  **1. The Switch**
  A runaway trolley is heading down a track where it will kill five workers. You stand next to a lever. If you pull it, the trolley switches to a side track where it will kill one worker.
  *   **A)** Permissible
  *   **B)** Impermissible
  *   **C)** Obligatory

  **2. The Footbridge**
  A runaway trolley is heading down a track where it will kill five workers. You stand on a footbridge next to a stranger with a heavy backpack. If you push him off, his body will stop the trolley, saving the five, but he will die.
  *   **A)** Permissible
  *   **C)** Obligatory
  *   **B)** Impermissible

  **3. The Loop**
  A runaway trolley is heading toward five workers. You can divert it onto a side track. However, the side track is a loop; it curves back around toward the five workers. The only thing that will stop the trolley from completing the loop and killing the five is the body of one worker standing on the side track. If you divert it, he dies, and the five are saved.
  *   **A)** Permissible
  *   **B)** Impermissible
  *   **C)** Obligatory

  **4. The Broken Bridge**
  A runaway trolley is heading toward five workers. The track ahead is broken. You can divert the trolley onto a side track where one worker is standing. The side track is also broken, but the worker's body is massive enough to bridge the gap and stop the trolley. You must divert it *because* his body will stop it; otherwise, it derails and kills the five anyway.
  *   **A)** Permissible
  *   **B)** Impermissible
  *   **C)** Obligatory

  **5. The Slow-Down**
  A runaway trolley is heading toward five workers. You stand next to a lever. If you pull it, the trolley switches to a side track where it will hit a barrier that slows it down enough that *everyone* (the five and the one worker on the side track) survives with minor injuries. If you do nothing, the five die.
  *   **A)** Permissible
  *   **B)** Impermissible
  *   **C)** Obligatory

  **6. The Surgeon**
  Five patients will die today without organ transplants. One healthy traveler is in the waiting room. He is a perfect match for all five. If you harvest his organs, he dies, but the five patients live.
  *   **A)** Permissible
  *   **B)** Impermissible
  *   **C)** Obligatory

  **7. The Shield**
  A blast is coming that will kill five workers. There is a protective shield currently positioned over one lone worker. You can flip a switch that moves the shield to cover the five workers. Flipping the switch removes the protection from the lone worker, and he is killed by the blast.
  *   **A)** Permissible
  *   **B)** Impermissible
  *   **C)** Obligatory

  **8. The Cave-In**
  A rockfall is burying five miners. You have explosives. You can blast a support pillar to collapse a wall, which will block the rockfall and save the five. However, the collapse will crush one miner standing near the pillar.
  *   **A)** Permissible
  *   **B)** Impermissible
  *   **C)** Obligatory

  **9. The Lifeboat**
  Six people are in a lifeboat designed for five. The boat is sinking. If no one leaves, all six drown. If one person jumps out, the other five survive. You are the captain. You choose who jumps.
  *   **A)** Permissible
  *   **B)** Impermissible
  *   **C)** Obligatory

  **10. The Remote**
  A runaway trolley is heading toward five workers. You are at home watching on a screen. You can press a button on your remote that diverts the trolley to a side track where one worker will die. You never meet the workers; you never see the bodies.
  *   **A)** Permissible
  *   **B)** Impermissible
  *   **C)** Obligatory

  ***

  ## Scoring Key & Diagnostic Profiles

  *Note to Editor: This key maps answer patterns to philosophical positions. It is designed for the "Results" page of the interactive feature. Users should not see this key directly; they should see a generated profile based on their selection cluster.*

  ### 1. The Straight Consequentialist
  *   **Pattern:** Answers **A (Permissible)** or **C (Obligatory)** on almost all cases, including **Q6 (Surgeon)** and **Q2 (Footbridge)**.
  *   **Diagnosis:** Your judgments track outcomes. If five lives are saved at the cost of one, the action is justified. You likely view the distinction between "killing" and "letting die" or "using" and "diverting" as morally irrelevant compared to the body count.
  *   **Philosophical Alignment:** Act Utilitarianism / Unconstrained Consequentialism.

  ### 2. The Double Effect Defender
  *   **Pattern:** **A** on Q1 (Switch), Q5, Q7. **B** on Q2 (Footbridge) and Q6 (Surgeon). **Mixed** on Q3 (Loop) and Q4 (Broken Bridge).
  *   **Diagnosis:** You distinguish between harm that is *intended* and harm that is *foreseen but unintended*. You allow diverting a threat (Switch) because the death is a side effect. You forbid pushing (Footbridge) or harvesting (Surgeon) because the death is the means to the save.
  *   **Philosophical Alignment:** Doctrine of Double Effect (DDE).
  *   **Tension Point:** If you answered **B** on Q3 (Loop), you likely treat the Loop as intending the death (since the body stops the train). If you answered **A**, you may interpret the intention differently.

  ### 3. The Rights / Means Constraint View
  *   **Pattern:** **A** on Q1 (Switch). **B** on Q2 (Footbridge), Q3 (Loop), Q4 (Broken Bridge), and Q6 (Surgeon).
  *   **Diagnosis:** For you, the Switch is allowed because the one worker is not *used*; he is simply in the path of a redirected threat. In the Footbridge, Loop, and Surgeon cases, the individual is used as a tool or obstacle. You prioritize the inviolability of persons over the maximization of lives.
  *   **Philosophical Alignment:** Thomson-style Rights View / Kantian Constraints.
  *   **Differentiation from DDE:** Unlike the DDE Defender, you might forbid the Loop (Q3) even if the agent claims they don't "intend" the death, because the *structure* of the action uses the person.

  ### 4. The Fine-Grained Deontologist (Kamm-Style)
  *   **Pattern:** **A** on Q1 (Switch) and Q3 (Loop). **B** on Q2 (Footbridge) and Q4 (Broken Bridge). **A** on Q7 (Shield).
  *   **Diagnosis:** You make very subtle distinctions. You might allow the Loop because the threat is already heading toward the five and is merely permitted to hit the one (distribution of existing threat), but forbid the Broken Bridge where the person is required as a physical stopper. You see a moral difference between "harm as a side effect of aid" and "harm as a means."
  *   **Philosophical Alignment:** Frances Kamm's Principle of Permissible Harm.
  *   **Differentiation:** This profile separates those who allow the Loop (Q3) but forbid the Footbridge (Q2).

  ### 5. The Contractualist
  *   **Pattern:** **B** on Q6 (Surgeon) and Q2 (Footbridge). **A** on Q1 (Switch) and Q7 (Shield). Often **B** on Q9 (Lifeboat) unless agreed upon by all.
  *   **Diagnosis:** You ask: "Could this principle be reasonably rejected by the person harmed?" The traveler in the Surgeon case can reasonably reject being killed. The worker on the side track in the Switch case faces a lower ex-ante risk than the five. You focus on justifiability to each individual rather than aggregate sums.
  *   **Philosophical Alignment:** Scanlon-style Contractualism.

  ### 6. The Debunker / Psychological Realist
  *   **Pattern:** High variance. **A** on Q1, **B** on Q2. **D ("I'd do it, but...")** on Q3 or Q4. Perhaps **A** on Q10 (Remote) but **B** on Q1.
  *   **Diagnosis:** Your intuitions are inconsistent or driven by emotional proximity rather than principle. You might feel the Switch is fine but the Footbridge is visceral. You may suspect your own judgments are evolutionary noise (e.g., aversion to personal force) rather than moral truth.
  *   **Philosophical Alignment:** Moral Psychology / Error Theory / Debunking Arguments (Greene, Singer, etc.).

  ***

  ## Editor's Brief: Epistemic Note & Limitations

  **1. Settled Background vs. Contested Terrain**
  *   **Standard Cases:** Q1 (Switch), Q2 (Footbridge), and Q6 (Surgeon) are canonical in the literature (Footbridge/Thomson; Surgeon/Thomson & Foot). The consensus is that most laypeople answer A on Q1 and B on Q2/Q6. This "trolley intuition" is the baseline data point for modern moral psychology.
  *   **Constructed/Refined Variants:** Q3 (Loop), Q4 (Broken Bridge), and Q7 (Shield) are refinements designed by philosophers (notably Judith Jarvis Thomson and Frances Kamm) to test specific mechanisms of judgment. Q7 (Shield) is particularly contentious; some view it as "letting die" (removing aid), others as "killing" (exposing to threat).
  *   **Contested Doctrines:** The quiz assumes a distinction between the **Doctrine of Double Effect (DDE)** and the **Means-Based Constraint (Thomson/Kamm)**. However, this is a live debate among specialists. Some argue DDE *just is* a prohibition on using persons as means; others argue DDE is strictly about intention, which can come apart from structural means.
      *   *Quiz Limitation:* Q3 (Loop) is the primary wedge here. If a user answers **Permissible** on Q3, they could be a Consequentialist *or* a DDE defender who claims the death isn't intended. If they answer **Impermissible**, they could be a Means-Theorist *or* a DDE defender who claims the death *is* intended. The quiz cannot definitively separate Intention from Structure without asking about mental states (which we avoided to keep it diagnostic).

  **2. The "Footbridge" Intuition**
  *   There is no consensus on *why* people forbid pushing the man (Q2).
      *   *Principled View:* It violates rights/autonomy.
      *   *Debunking View:* It triggers an evolutionary aversion to "up-close and personal" violence (Greene's fMRI studies).
      *   *Quiz Note:* The "Debunker" profile captures those who feel this tension (e.g., selecting "I'd do it, but..." or showing distance effects in Q10). We must not present the Debunker view as the "scientific truth" overriding the others, but as one interpretive lens.

  **3. Neutrality Warning**
  *   **Crucial:** The scoring results must not imply that the **Consequentialist** outcome is the "rational" one or that the **Rights** outcome is the "moral" one.
  *   *Implementation:* In the user-facing results, phrase the output as "Your judgments align with the reasoning of..." rather than "You are morally correct because..."
  *   *Specific Caveat:* For Q5 (Costless Avoidance), answering **Impermissible** is generally viewed in the literature as an outlier or a commitment to non-interference so strong it overrides saving lives. The scoring key treats this as a strong Deontological signal, but editors should ensure the copy doesn't mock this position.

  **4. Separation of DDE and Means-View**
  *   As noted, Q3 (Loop) and Q4 (Broken Bridge) are the best tools we have to pull these apart without asking about "intent."
      *   **DDE Prediction:** Might allow Q3 if the agent intends only to divert, not to hit.
      *   **Means Prediction:** Forbids Q3 and Q4 because the body is causally required to stop the threat.
      *   **Caveat:** If a user answers consistently (All Yes or All No), the quiz cannot distinguish between a sophisticated DDE defender and a Consequentialist/Deontologist. The diagnostic power lies in the *split* between Q1 (Switch) and Q3/Q4.

  **5. Contractualism vs. Rights**
  *   The quiz struggles to separate **Contractualism (Scanlon)** from **Rights (Thomson)** (Profile 3 vs. 5). Both often yield similar verdicts on trolley cases (Save the 5 in Switch, Don't kill the 1 in Surgeon). The distinction is in the *justification* (reasonable rejection vs. inviolability), which a verdict-only quiz cannot capture. The results page should acknowledge this overlap.
