answer: |-
  # DECISION TREE: NAVIGATING THE DISCURSIVE DILEMMA

  **Instructions:** Start at the top. Answer each question based on your normative commitments about how groups *should* make decisions, not just how they do. Follow the arrows to your position.

  ### THE TREE

  **START:** You agree the Discursive Dilemma (Majority says Yes to Premises A & B, but No to Conclusion C, where C = A & B) is a genuine problem requiring a solution.

  **Q1. COLLECTIVE RATIONALITY:** Must the group's final set of judgments be logically consistent, even if this requires overriding a majority view on at least one proposition?
  *   **NO** → **MAJORITARIAN RESPONSIVENESS**
      *   *View:* The group is just the sum of its parts. If the majority is inconsistent, the group is inconsistent. (e.g., simple majority voting on all issues).
  *   **YES** → Go to Q2.

  **Q2. SUPERVENIENCE:** Must the group's judgment be determined *solely* by the pattern of individual member judgments (i.e., no external arbiter, divine intuition, or "group mind" that floats free of members)?
  *   **NO** → **SKEPTICISM / NON-SUPERVENIENCE**
      *   *View:* Collective agency is distinct from individual agency. The group can hold a view no individual holds, grounded in something other than aggregation.
  *   **YES** → Go to Q3.

  **Q3. INDEPENDENCE OF CONCLUSION:** Should the collective judgment on the *conclusion* depend **only** on individual judgments on the conclusion (ignoring the logical link to premises)?
  *   **YES** → **CONCLUSION-BASED AGGREGATION (CBA)**
      *   *View:* Vote directly on the outcome. Adjust or ignore premise judgments to fit. (Prioritizes the decision over the reasoning).
  *   **NO** → Go to Q4.
      *   *(Note: You allow premises to influence the conclusion judgment.)*

  **Q4. EQUALITY (ANONYMITY):** Must every member's judgment carry equal weight in determining the outcome?
  *   **NO** → **OLIGARCHIC / DICTATORIAL RULE**
      *   *View:* Consistency is best preserved by letting one person (or a subset) decide. Their consistency becomes the group's consistency.
  *   **YES** → Go to Q5.

  **Q5. UNIVERSAL DOMAIN:** Must the aggregation rule work for *any* possible profile of individual judgments, even highly polarized ones?
  *   **NO** → **RESTRICTED DOMAIN / SUPERMAJORITY RULE**
      *   *View:* The problem lies in the inputs, not the rule. Require single-peaked preferences, deliberation to align views, or higher thresholds (e.g., 2/3 vote) to prevent paradoxes.
  *   **YES** → **PREMISE-BASED AGGREGATION (PBA)**
      *   *View:* Vote on premises by majority; derive the conclusion logically. (Prioritizes reasoning over the direct decision).

  ---

  ### LOGICAL SPACE ANALYSIS

  This tree maps the "Impossibility Space" defined by List & Pettit (2002). The leaves represent the only coherent ways to escape the impossibility theorem.

  **Unoccupied/Impossible Combinations:**
  1.  **Consistency + Supervenience + Independence + Equality + Universal Domain:** This is the **Discursive Dilemma itself**. It is logically impossible (a null set). No one holds this because it is incoherent.
  2.  **Skepticism + Independence:** If you reject supervenience (Q2=No), asking about voting independence (Q3) is category error. This path is **incoherent**.
  3.  **Dictatorship + Restricted Domain:** One could technically reach a "Dictator with Restricted Inputs" leaf (Q4=No, Q5=No). This is **unattractive/redundant**; a dictator guarantees consistency regardless of domain restrictions, so the restriction adds cost without benefit.

  ---

  ### CASE TESTING

  **Case 1: The Safety Review Board**
  *Scenario:* A board votes on "Meets Standard X" (P), "Meets Standard Y" (Q), and "Approve Design" (C). Approval requires P & Q.
  *Profile:* Majority accepts P, Majority accepts Q, Majority rejects C.
  *   **PBA Verdict:** Approve (Derived from P & Q).
  *   **CBA Verdict:** Reject (Direct vote on C).
  *   **Result:** The tree successfully separates these positions.

  **Case 2: The Hiring Committee**
  *Scenario:* Three members rank Candidates A, B, C. Preferences cycle (A>B, B>C, C>A). The "Conclusion" is "Hire A". The "Premises" are "A>B" and "A>C".
  *   **PBA Verdict:** Inconsistent (Cycle detected in premises; cannot derive "Hire A" logically).
  *   **CBA Verdict:** Consistent (Direct vote on "Hire A" yields a winner, or tie-break applied).
  *   **Result:** The tree separates them based on consistency tolerance.

  **⚠ FLAGGED LIMITATION:**
  If the Safety Review Board profile were *not* paradoxical (e.g., Majority accepts P, Rejects Q, Rejects C), **PBA and CBA yield the same verdict (Reject)**. In non-paradoxical cases, this tree forces a procedural distinction (Q3) that does not change the outcome. The tree discriminates *justifications*, not always *verdicts*.

  ---

  ### HIDDEN WORK

  The node doing the most hidden work is **Q3 (Independence of Conclusion)**. Users often answer "Yes" thinking it protects democratic voting on the final issue, not realizing it structurally forbids using logical premises to correct that vote. Answering "Yes" here silently commits you to prioritizing the *decision* over the *reasoning*, which is the core philosophical rift between CBA and PBA.
