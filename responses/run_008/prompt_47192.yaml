  # Handout: The Causal Status of Experience
  ### A Decision Tree for the Discussion Group

  **Instructions:** Start at **Q1**. Answer based on your intuition about the case described, not on which philosophical label you prefer. Follow the arrows to find your position.

  ---

  #### Q1: The Duplicate's Testimony
  Imagine a molecule-for-molecule duplicate of you exists, but it has no inner life (no "what it is like" to be it). When asked, "Are you conscious right now?", does it give the **exact same answer** for the **exact same physical reasons** as you do?
  *   **NO** (My experience makes me speak; the duplicate would stay silent or lie.) → Go to **Q2**.
  *   **YES** (My brain physics makes me speak; the duplicate would say the same thing truthfully about its physics.) → Go to **Q3**.

  #### Q2: The Energy Budget
  If your experience causes your speech (as you answered above), does this influence require energy that is *not* accounted for in the prior physical state of your brain?
  *   **YES** (Experience adds a "push" to the neurons.) → **Interactionist Dualism**
  *   **NO** (Experience works within the existing physical energy.) → *[Unstable Position: Interactionism without Causal Gaps]*

  #### Q3: Mary's Notebook
  Mary is a scientist who knows all physical facts about color vision but has never seen color. When she finally sees red, does she learn a **new fact about the world** (a new proposition), or does she just gain a **new way of accessing old facts** (a new mode of presentation)?
  *   **NEW FACT** (There is something about red she physically couldn't know before.) → Go to **Q4**.
  *   **NEW MODE** (She knew the fact, now she knows it "from the inside".) → Go to **Q5**.

  #### Q4: The Intrinsic Base
  You believe experience is a real, non-physical fact, but you answered YES to Q1 (physics causes the report). Is this "inner fact" the **hidden intrinsic nature of the physical matter itself**?
  *   **YES** (Consciousness is what matter *is* on the inside.) → **Russellian Monism**
  *   **NO** (Consciousness is a separate property that rides along with matter.) → **Epiphenomenalism**

  #### Q5: The User Interface
  You believe experience is physical (Q3: New Mode). Is the vivid *feeling* that experience is "non-physical" or "extra" a **cognitive illusion** generated by the brain?
  *   **YES** (The brain misrepresents its own states as magical.) → **Illusionism**
  *   **NO** (The feeling is accurate; we just lack the concepts to link it to physics.) → Go to **Q6**.

  #### Q6: The Conceptual Gap
  Is the gap between "brain state" and "experience" due to our **concepts** (we have two ways of thinking about one thing) or due to **representation** (experience is just a specific kind of information processing)?
  *   **CONCEPTS** (One state, two concepts.) → **Type-B / Phenomenal-Concept Physicalism**
  *   **REPRESENTATION** (Experience is functional content.) → **Reductive Representationalism**
  *   *(Note: If this distinction feels negligible to you, you occupy both.)*

  ---

  ### Analysis of the Logical Space

  **Unstable Combinations**
  1.  **Q1=NO + Q2=NO (Interactionism without Causal Gaps):** This position claims experience causes behavior but denies it adds energy or alters the physical chain. This is **incoherent**; if the physical chain is sufficient to produce the behavior (Closed), experience is idle; if experience is required to produce it, the physical chain was insufficient (Open).
  2.  **Q1=YES + Q3=NEW FACT + Q4=NO (Standard Epiphenomenalism):** This position claims experience is a real, distinct fact that does no causal work. This is **self-undermining**; if experience cannot cause physical events (like speech or typing), we could never form beliefs about it, report it, or write papers on it, yet we are doing so now.

  **Indistinguishable Leaves**
  *   **Type-B Physicalism vs. Reductive Representationalism:** The tree routes these to adjacent leaves based on whether the subject emphasizes *concepts* or *functional content*. However, given the questions available, these positions often collapse into one another in practice.
  *   **Further Question Needed:** "Is the phenomenal character of an experience identical to its functional role, or does it merely supervene on it?" A 'Yes' favors Representationalism; a 'No' favors Phenomenal-Concept views.

  ---

  ### The Commitment

  **Verdict: Russellian Monism**

  Russellian Monism survives the problem of explaining our judgments about experience best because it is the only view that respects both the **Causal Closure of Physics** (answering Q1 "Yes") and the **Reality of Phenomenal Facts** (answering Q3 "New Fact") without rendering our knowledge of consciousness impossible. Unlike Epiphenomenalism, it allows experience to be causally relevant (as the intrinsic nature of the physical cause); unlike Interactionism, it does not violate conservation laws; and unlike Illusionism, it does not deny the data of consciousness itself.

  **Strongest Objection:** The **Combination Problem**: even if particles have proto-experiential intrinsic natures, there is no clear explanation for how billions of micro-experiences combine to form the unified macro-experience I am having now.
  **Does it succeed?** No. While the Combination Problem is a significant explanatory gap, it is a problem of *mechanism*, whereas the rivals face problems of *coherence*. Epiphenomenalism makes knowledge of consciousness impossible (a logical contradiction); Interactionism contradicts established physics; Illusionism denies the very datum to be explained. Russellian Monism posits an unknown mechanism for a coherent ontology, which is a preferable theoretical cost than accepting an incoherent ontology.
