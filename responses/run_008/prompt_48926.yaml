      *   *Infinity:* Engineers/Actuaries are used to truncating infinities. "In practice, banks have limits." I need to stop them from solving the paradox with "finite bankrolls" too early.
      *   *Conditional Convergence:* The statistician and actuary know Riemann series theorem. The engineers might recall it vaguely. The physicians might not. I need to leverage the ones who know it without losing the others.
