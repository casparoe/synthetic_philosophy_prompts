      *   He distinguishes between the "few" (the rulers, the church hierarchy, the strong) and the "many" (the weak, the masses).
      *   He would not see this as hypocrisy, but as necessity. The strong *must* bear the burden because the weak *cannot*. It is a division of labor, not a contradiction.
