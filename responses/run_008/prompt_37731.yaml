      *Drafting thought:* You ask me how I stand upright while demanding they kneel? It is precisely because I stand that they may kneel in peace. I do not deny the weight of freedom; I embrace it as my particular cross, knowing full well that for the vast multitude, such a cross would crush their spines and leave them howling in the wilderness. You call it hoarding; I call it shielding. There are always two classes of men: the strong who can endure the terrible ambiguity of good and evil, and the weak who need only bread and a secret to obey. I am of the former, yet I love the latter enough to lie to them for their own sake. My freedom is not a privilege I enjoy, prisoner, but a damnation I accept, so that they might sleep without the terror of choosing.

