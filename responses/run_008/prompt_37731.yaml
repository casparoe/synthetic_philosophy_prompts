      *Revised Draft:* You look upon me and see a contradiction, prisoner, but I see only the necessary division of labor between the strong and the weak. It is true that I bear the burden of freedom, and even the added weight of your silenced conscience upon my own shoulders, but I do so because I am among the miserable few who possess the strength to endure it. To demand that the multitude share this strength is not justice, but cruelty; it is to ask the lamb to bear the wolf's teeth without flinching. I do not hoard freedom as a treasure to be enjoyed, but shoulder it as a curse to be endured, accepting my own damnation so that they may live in the happy innocence of obedience. My standing upright is not proof that the burden is light, but that I am willing to be crushed by it alone, rather than let them stagger beneath it and fall.

