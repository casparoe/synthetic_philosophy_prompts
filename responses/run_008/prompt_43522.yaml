answer: |-
  This is a fantastic dissection of a common argument. You are absolutely right that "it only means something because it costs you" is doing too much heavy lifting. It conflates evolutionary biology, information theory, and behavioral economics.

  Here is the breakdown of the four distinct claims hidden inside that one-liner, ranked from the most easily disproven to the most radical, along with their truth values, whether they support your cousin, and what they predict for the future of diamonds.

  ### 1. The "Universal Cost" Claim
  **The Claim:** *No signal can be honest unless it involves a significant material cost.*
  *   **The Logic:** If a signal is cheap, anyone can send it, so it conveys no information. Therefore, cost is a necessary condition for meaning.
  *   **Truth Value:** **Flat Out Wrong.**
      *   **Why:** As you noted, passwords, uniforms, handshakes, and ID cards are low-cost signals that convey high-trust information. In biology, some signals are "index signals" (e.g., a deep voice indicates a large throat; you can't fake it, but it doesn't "cost" energy to maintain in the same way a tail does).
  *   **Does it support your cousin?** **No.** If this were the only rule, your friend wins. A lab diamond could serve as a "password" for engagement if the social norm agreed that "lab diamond = engaged." The cost isn't strictly necessary for the *information* (I am engaged) to be transmitted.
  *   **Prediction if lab diamonds win:** Nothing changes. We just switch to the cheaper password. The ritual continues, but the price floor drops.

  ### 2. The "Handicap Principle" Claim (Differential Cost)
  **The Claim:** *Signals are honest specifically because they are more affordable for high-quality individuals than for low-quality individuals.*
  *   **The Logic:** This is the actual peacock story. A tail isn't just "heavy"; it is metabolically expensive and increases predation risk. A sickly male peacock who tries to grow a huge tail will die. A healthy male can afford it. The cost is a *filter* that separates the fit from the unfit.
  *   **Truth Value:** **Half-True (Biologically robust, socially messy).**
      *   **Why:** In biology, this is well-supported. In human economics, it's complicated. A $10,000 ring is indeed harder for a poor suitor to buy than a rich one. However, unlike peacocks, humans can go into debt. A "low quality" (financially unstable) suitor *can* fake the signal by ruining their credit, which a peacock cannot do with its tail.
  *   **Does it support your cousin?** **Yes, conditionally.**
      *   **Why:** If lab diamonds drop the price by 90%, the "filter" becomes too loose. A suitor who is not financially stable can easily afford a $2,000 lab ring without feeling the "pain" that a $20,000 mined ring would cause. The signal loses its ability to distinguish high-resource mates from low-resource mates.
  *   **Prediction if lab diamonds win:** The "arms race" shifts. If everyone switches to lab, the carat size required to signal "high quality" will inflate, or the market will abandon diamonds entirely for a new scarce resource (e.g., rare colored gemstones, vintage pieces, or non-fungible tokens) where the supply cannot be infinitely manufactured.

  ### 3. The "Commitment Bond" Claim (Sunk Cost)
  **The Claim:** *The cost is not about showing off resources, but about making exit painful.*
  *   **The Logic:** This is game theory, not biology. By spending a large sum on a depreciating asset (a ring you can't resell), the giver creates a "sunk cost." If they leave the relationship, they lose that money. It acts as a performance bond or a down payment on fidelity.
  *   **Truth Value:** **Half-True (Economically sound, psychologically debated).**
      *   **Why:** It makes rational sense as a contract mechanism. However, studies on relationship success don't strongly correlate ring price with marriage longevity. Still, the *perception* of sacrifice matters psychologically.
  *   **Does it support your cousin?** **Yes, if social norms hold.**
      *   **Why:** If the social norm is "you must sacrifice two months' salary," buying a lab diamond that costs two weeks' salary fails the test. The "pain of paying" is the point. If the purchase doesn't hurt, the bond isn't forged. However, if the norm adjusts to "two months' salary regardless of stone type," your cousin loses.
  *   **Prediction if lab diamonds win:** The dollar amount of the "norm" will deflate. Instead of a $10k mined ring being the standard, a $2k lab ring becomes the new standard. The *percentage of income* sacrificed remains the same, but the jewelry industry revenue collapses.

  ### 4. The "Veblen Good" Claim (Conspicuous Waste)
  **The Claim:** *The cost IS the utility. The waste is the message.*
  *   **The Logic:** This is the most radical economic reading. A Veblen good is something people want *because* it is expensive. If the price drops, demand drops. The point of the diamond is not beauty (lab is identical) or commitment (cash works), but proof that you have so much money you can afford to burn it on a rock with no industrial utility.
  *   **Truth Value:** **True (for the luxury market).**
      *   **Why:** This accurately describes the high-end diamond market. Mined diamonds maintain value through artificial scarcity (De Beers cartel history). Lab diamonds are becoming commodities (like silicon chips). You cannot use a commodity to signal exclusivity.
  *   **Does it support your cousin?** **Yes, absolutely.**
      *   **Why:** Under this reading, your friend is missing the point entirely. The friend thinks they are buying *carbon crystals*; the cousin knows they are buying *social status*. If lab diamonds become cheap, they cease to be Veblen goods. Wearing a lab diamond would be like wearing a $50 watch instead of a Rolex. It tells time better, but it signals "I cannot afford the waste."
  *   **Prediction if lab diamonds win:** Market segmentation. Mined diamonds will rebrand as "natural luxury" (like wild salmon vs. farmed salmon) and remain expensive for the wealthy. Lab diamonds will become the default for the middle class (like moissanite did). The "engagement ring" as a singular cultural symbol fractures into class signifiers.

  ### Summary: Which fight are you actually having?

  *   **If you are arguing about Chemistry/Physics:** Your friend wins. (Claim 1)
  *   **If you are arguing about Financial Screening:** Your cousin wins. (Claim 2)
  *   **If you are arguing about Relationship Sacrifice:** It's a tie, depends on social norms. (Claim 3)
  *   **If you are arguing about Social Status:** Your cousin wins decisively. (Claim 4)

  **The Verdict:**
  Your cousin is implicitly relying on **Claim 4 (Veblen)** and **Claim 2 (Handicap)**. He is correct that if the goal of the ring is to signal *exclusive status* or *high-resource mating potential*, lab-grown diamonds break the signal because they remove the scarcity and the differential cost.

  Your friend is relying on **Claim 1 (Information)**. She is correct that if the goal is simply to say "I am committed to you," a cheap ring works fine.

  **What happens next?**
  If lab diamonds kill the mined market, **Claim 4 (Veblen)** predicts the wealthy will abandon diamonds for something else that cannot be manufactured (e.g., rare antiques, land, or a new gemstone). **Claim 2 (Handicap)** predicts the "entry fee" for engagement will simply shift to a new bottleneck. **Claim 3 (Commitment)** predicts couples will just spend the saved money on the wedding or a house down payment, keeping the "sacrifice" but changing the vehicle.

  The most likely reality? A mix: Mined diamonds become niche luxury (Veblen), lab diamonds become the standard commodity (Information), and the "Handicap" shifts to the cost of the wedding or housing market.
