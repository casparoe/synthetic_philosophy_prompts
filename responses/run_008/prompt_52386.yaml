answer: |-
  This lesson plan structures a two-round Luring Lottery simulation to experientially demonstrate the failure of Nash rationality and the intuitive appeal of Hofstadterian superrationality before formalizing the concepts.

  ### **Lesson Plan: The Luring Lottery**

  **Time:** 75 Minutes
  **Materials:** 40 small slips of paper, 2 boxes (one for collection, one for drawing), whiteboard, calculator, printed "Open Letters" (18 copies).
  **Prize:** 1,000 "Lottery Dollars" (LD). Exchange rate: 10 LD = 1 point extra credit on final paper (announce this at start).

  #### **1. Introduction & Rules (10 mins)**
  *   **Setup:** Explain the game exactly as Hofstadter did. Each student submits a slip with a nonnegative integer (their number of entries).
  *   **Mechanism:** You will sum all integers to get $N$ (Total Entries). You will draw one slip uniformly at random from the $N$ virtual entries. The owner of that slip wins the prize pool.
  *   **Prize:** The prize pool is fixed at 1,000 LD, divided by $N$.
  *   **Constraint:** To ensure we can calculate results together, **entries are capped at 100**. Any number above 100 counts as 100. (This prevents calculator overflow while preserving the escalation dynamic).
  *   **Round 1:** No discussion. Write privately. Collect slips.

  #### **2. Round 1 Execution (10 mins)**
  *   Collect slips.
  *   **Public Count:** Read each number aloud. Write them on the board. Sum them to find $N$.
  *   **Calculate:** Compute Prize per Entry ($1000/N$) and Expected Value for each student ($n_i \times 1000/N^2$).
  *   **Outcome:** Likely, $N$ will be high (students testing the waters). Announce the winner (draw a slip from a hat containing $N$ virtual tickets, or simply pick a random student weighted by their entries if $N$ is too large to physically simulate—*better:* write each student's name on slips equal to their entry count, put in hat, draw one).
  *   **Observation:** Note the low prize value.

  #### **3. Interlude: The Letter & Caucus (15 mins)**
  *   **Distribution:** Hand out the anonymous letter below. Give them 5 minutes to read and reflect.
  *   **Caucus:** Allow 5 minutes of open discussion. Students may pledge to submit "1" in the next round. Emphasize: slips remain anonymous; pledges are non-binding.
  *   **Round 2:** Students submit new slips.

  **The Open Letter (Draft)**
  > Fellow Entrants,
  >
  > We are facing a symmetric problem: we all have the same information, the same incentives, and the same capacity for reason. If you conclude that submitting a high number is rational, I must conclude the same. If we all reason identically, we will all submit the same number.
  >
  > Consider the outcomes. If we all submit 1, the pool is small, and the expected return for everyone is high. If we all submit 100, the pool balloons, and the expected return collapses for everyone. Since we are locked in the same logical position, whatever reason convinces you to escalate also convinces me to escalate, guaranteeing the collapse we both wish to avoid.
  >
  > To maximize your own expected return, you must choose the number that yields the best result if *everyone* chooses it. That number is 1. Do not let standard game theory trick you into destroying the prize we all share.
  >
  > — A Fellow Entrant

  #### **4. Round 2 Execution (10 mins)**
  *   Collect slips.
  *   **Public Count:** Read numbers aloud. Compare to Round 1.
  *   **Calculate:** Compute new $N$ and prize values.
  *   **Result:** Ideally, $N$ drops (if superrationality takes hold) or stays high (if trust fails). Either outcome is pedagogically useful.

  #### **5. Debrief & Algebra (30 mins)**
  *   **The Algebra of Escalation:**
      *   Write on board: $EV = \frac{n_i}{N} \times \frac{1000}{N} = \frac{1000 \cdot n_i}{N^2}$.
      *   Let $M$ be the total entries of the other 17 students. Then $N = M + n_i$.
      *   $EV = \frac{1000 \cdot n_i}{(M + n_i)^2}$.
      *   Ask: "If you know others will submit $M=17$ (everyone else plays 1), what maximizes your EV?"
      *   Show (conceptually or via derivative) that max occurs at $n_i = M$.
      *   **The Trap:** If everyone follows this "best response," $M$ grows, so $n_i$ grows. There is no stable Nash Equilibrium; the rational strategy is infinite escalation.
  *   **Defining Superrationality:**
      *   Now name it. Hofstadter's **Superrationality** assumes that rational agents facing a symmetric problem will arrive at the same solution.
      *   Therefore, I should not choose my best response to *your* move; I should choose the move that is best if *we all make it*.
      *   Distinguish from **Altruism**: You aren't sacrificing for others; you are maximizing your own EV by recognizing the logical correlation between your choice and theirs.
      *   Distinguish from **Wishful Causation**: You aren't causing them to choose 1 by choosing 1; you are recognizing that the same logic dictates both choices.
  *   **Historical Context:**
      *   Hofstadter ran this in *Scientific American* (1983).
      *   Result: Readers submitted huge numbers (including a googolplex). The prize was fractions of a cent.
      *   **Lesson:** Superrationality requires an epistemic premise (that others are superrational) that often fails empirically. The logic holds, but the population assumption was false.
  *   **Comparison to Prisoner's Dilemma:**
      *   In PD, Defection is a **dominant strategy** (best regardless of opponent).
      *   In the Lottery, Escalation is a **best response** (best only given opponent's move).
      *   **Discussion:** Does this make cooperation more or less credible? In PD, you defect even knowing it hurts the pair. Here, you escalate only because you think others will. This makes the "cooperative" equilibrium (all submit 1) fragile but theoretically recoverable via correlation, whereas PD requires external enforcement or iteration.

  #### **6. Predictable Failures & Limitations (5 mins)**
  *   **The Joker:** A student may write "100" (the cap) or try to sneak a higher number.
      *   **Principled Rule:** Enforce the cap strictly. If a student writes "1000", count it as 100. Explain that in the real Hofstadter game, this would have been valid, but pedagogical constraints require bounds. This preserves the *incentive* to max out without breaking the calculator.
  *   **Limitations to Acknowledge:**
      *   **Pool Size:** 18 students vs. 700,000 readers. In a small pool, one defector (submitting 100) visibly destroys the pot. In Hofstadter's pool, one defector was negligible, but collective defection was catastrophic. This makes trust harder here (you can see the betrayal) but impact more personal.
      *   **Anonymity:** Your students share a dorm/class. Retaliation or social pressure is possible; Hofstadter's readers were truly anonymous.
      *   **Stakes:** Extra credit is not cold cash. Risk aversion may differ.
      *   **One-Shot:** Real life allows reputation building; this is a single isolated event.

  ### **Instructor Notes for Success**
  *   **Algebra Allergy:** Do not write derivatives on the board unless they ask. Use numbers: "If others submit 17 total, and you submit 1, your share is tiny. If you submit 17, your share is bigger." Show the EV drop when everyone does it.
  *   **The Reveal:** The most powerful moment is hearing the sum $N$ announced aloud. Drag out the addition in Round 1. Let the tension build.
  *   **Handling Cynicism:** If Round 2 fails (everyone still submits high), lean into it. This validates Hofstadter's actual historical result. The lesson is not that superrationality *works*, but that it requires a shared epistemic framework that is rarely present.
