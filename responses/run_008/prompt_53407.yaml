answer: |-
  This is a classic philosophical pub fight. You and your mate have stumbled directly into the heart of Saul Kripke's *Naming and Necessity* (1970), specifically the debate over **a posteriori necessity**.

  Your mate is wielding a famous philosophical slogan ("Water is necessarily H2O"), but he is wielding it clumsily. You are relying on a very natural intuition (that chemistry could have been different), but you might be conflating *conceivability* with *metaphysical possibility*.

  Here is the disentanglement of the claims hiding behind that slogan, evaluated by plausibility, epistemic status, and whether they justify slamming a pint down to end the argument.

  ---

  ### 1. The Trivial Tautology Reading
  **The Claim:** "If water is H2O, then water is H2O."
  *   **What it means:** This is just the law of identity ($A=A$). It says nothing about the world, only about logic.
  *   **Plausibility:** 100%. It is logically true.
  *   **A Priori?** Yes. You don't need chemistry to know it.
  *   **Does it end the argument?** **No.** This is useless for your mate. It doesn't prove that water *is* H2O, only that *if* it is, it is. It leaves open the possibility that water is actually XYZ.
  *   **Verdict:** Your mate wasn't saying this, because this doesn't shut down your hypothetical.

  ### 2. The Epistemic Contingency Reading
  **The Claim:** "Before we did chemistry, it was possible that water wasn't H2O."
  *   **What it means:** Given what we knew in 1700, the statement "Water is H2O" was not certain. It was an open empirical question.
  *   **Plausibility:** 100%. This is historical fact.
  *   **A Priori?** No, it's a claim about the history of human knowledge.
  *   **Does it end the argument?** **No.** In fact, this supports *your* side. It validates your intuition that things "could have gone differently."
  *   **Verdict:** This is what your mate admitted when he said it "could have turned out otherwise." But he contradicted himself by using this to support the claim that it is *now* impossible.

  ### 3. The Kripkean Metaphysical Necessity Reading (The "Strong" Claim)
  **The Claim:** "Water" and "H2O" are **rigid designators**. They pick out the same substance in every possible world where that substance exists. Therefore, in any world where you find H2O, it's water. In any world where you find XYZ, it is *not* water (it is "twin-water").
  *   **What it means:** The identity is necessary *de re* (about the thing itself), not just *de dicto* (about the words). Once we fix the reference of "water" to *this stuff* (pointing at a lake), and we discover *this stuff* is H2O, then "water" means H2O in all worlds.
  *   **Plausibility:** This is the dominant view in analytic philosophy since the 1970s, though it has critics (like David Chalmers or Frank Jackson).
  *   **A Priori?** No. It requires empirical science to discover the essence. But *once discovered*, we know a priori that it is necessary. This is the famous "Necessary A Posteriori."
  *   **Does it end the argument?** **Yes, technically.** If you accept Kripke's semantics, your hypothetical ("Imagine the stuff in rivers was XYZ") is coherent as a story, but your conclusion ("Therefore water could be XYZ") is false. If the stuff in rivers was XYZ, it wouldn't be water.
  *   **Verdict:** This is the claim your mate was trying to make.

  ### 4. The Nomological Necessity Reading
  **The Claim:** "Given the laws of nature in *our* universe, water is H2O."
  *   **What it means:** In a universe with different physical laws, maybe H2O doesn't behave like water, or maybe XYZ does.
  *   **Plausibility:** Scientifically plausible.
  *   **A Priori?** No.
  *   **Does it end the argument?** **No.** This allows for your hypothetical. If the laws of nature were different, the "water" role could be filled by XYZ.
  *   **Verdict:** Your mate rejected this by saying "in every possible world."

  ---

  ### The Crucial Distinction: Epistemic vs. Metaphysical
  Your mate's confusion (and the source of the row) is that he is conflating two types of "possibility."

  1.  **Epistemic Possibility:** "For all we knew, water might have been XYZ." (True. We could have been wrong.)
  2.  **Metaphysical Possibility:** "There is a possible world where water is XYZ." (False, according to Kripke.)

  Kripke's argument is that we often mistake *epistemic* possibility for *metaphysical* possibility. Just because you can *imagine* a scenario where the clear liquid in lakes is XYZ, doesn't mean you have imagined a world where **water** is XYZ. You have imagined a world where **a watery-looking substance** is XYZ.

  ### The Verdict: Who Won the Row?

  **Technically: Your Mate (on the specific slogan).**
  If the argument is strictly about Kripke's philosophy, your mate is quoting the central thesis correctly. "Water is necessarily H2O" is the standard summary of Kripke's view on natural kind terms.
  *   **Was your XYZ hypothetical coherent?** As a *conceivable scenario*, yes. Putnam and Kripke use the XYZ example themselves!
  *   **Did it prove water could be XYZ?** No. Under the Kripkean framework, if you find XYZ in the lakes, you must conclude: "This is not water." The term "water" is anchored to the actual microstructure of the stuff we actually drink, not the superficial properties (clear, wet, drinkable).

  **However: Your Mate (on the execution).**
  Your mate lost points for being philosophically sloppy.
  1.  He admitted it was an empirical discovery (True) but used it to block empirical hypotheticals (Misleading).
  2.  He said it "could have turned out otherwise" (Epistemic) to justify that it "is necessarily H2O" (Metaphysical) without explaining the gap. That *is* a contradiction unless you explain the rigid designator distinction.
  3.  Using "End of" in philosophy is always wrong.

  **You (on the intuition).**
  You didn't lose the intuition. It *feels* contingent. Kripke admits this! He says the reason we think "Water could be XYZ" is possible is that we are imagining a world where people *speak English* and call XYZ "water." But Kripke argues that in that world, they are speaking a different language (Twin-English) and referring to a different substance.

  ### Final Ruling
  **You lost the row, but only because your mate had the orthodoxy on his side.**

  The claim "Water is necessarily H2O" is not a tautology; it is a claim about how language hooks onto the world (reference fixing).
  *   **Step 1:** We fix the reference of "water" by pointing to the liquid in lakes (ostension).
  *   **Step 2:** Science discovers the essence of that liquid is H2O.
  *   **Step 3:** Because "water" rigidly designates that essence, any world without H2O is a world without water.

  Your hypothetical ("Imagine the stuff in rivers turned out to be XYZ") is actually the exact thought experiment Kripke uses to prove his point. He would say: "If you found that out, you wouldn't say 'Water is XYZ.' You would say 'The stuff in the rivers isn't water.'"

  **How to win the rematch:**
  Don't argue that water *could* be XYZ. Argue that **Kripke is wrong about rigid designation.**
  Tell him: "Fine, if 'water' rigidly designates H2O, then 'Water is H2O' is necessary. But why should we care about that notion of 'water'? If I'm thirsty on Twin Earth and I drink XYZ, I've quenched my thirst. Functionally, it's water. Your 'necessity' is just a linguistic trick about how we fix labels, not a deep truth about the universe."

  That moves the debate from "You don't understand Kripke" (which you now do) to "Is Kripke right?" (which is still an open fight).
