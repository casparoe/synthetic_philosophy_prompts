answer: |-
  Your diagnosis is correct. You are not re-fighting a philosophical battle; you are encountering the engineering manifestation of a category error that has plagued philosophy of language for a century. The stalemate persists in your team because the "Merger" and "Separationist" camps are optimizing for different constraints that correspond to distinct philosophical categories: **ontology** (what exists) versus **epistemology** (what is known and how).

  Here is the breakdown of why this is a conflation of distinct questions, what progress looks like given that diagnosis, and why the alternative (that this is a substantive semantic dispute) is unlikely to yield results in your context.

  ### 1. The Diagnosis: Ontology vs. Epistemology

  The Frege–Mill dispute is substantive in philosophy because it asks, "What is the *semantic content* of a name?" But in a Knowledge Graph (KG), you are not building a model of semantic content; you are building a model of **information state**.

  *   **The Merger (Millian) View:** This camp is optimizing for **truth-conditions**. In a model-theoretic semantics, if $a = b$, then $a$ and $b$ are interchangeable *salva veritate* (preserving truth). If your KG is intended to be a mirror of the world (an ontology), merging is correct. There is only one Venus. To have two nodes is to assert two objects, which is ontologically false.
  *   **The Separationist (Fregean) View:** This camp is optimizing for **cognitive significance** (or in CS terms, **provenance and context**). The statement "Morning Star = Evening Star" is not a tautology in your system because your system is not a god's-eye view of the world; it is an aggregation of human assertions. The "learning" that happened for the Babylonians corresponds to a **state change** in the system's graph structure (adding an edge), not a discovery of a pre-existing node.

  **The Conflation:** The argument arises because both sides use the word "entity" to mean two different things.
  1.  **Entity$_{ont}$:** The object in the domain (Venus).
  2.  **Entity$_{epi}$:** The cluster of descriptions/beliefs held by an agent or source (The "Morning Star" concept).

  When your colleagues argue, the Mergers are defending Entity$_{ont}$ integrity, while the Separationists are defending Entity$_{epi}$ fidelity. A system that collapses Entity$_{epi}$ into Entity$_{ont}$ immediately loses the ability to track *why* the identity was asserted, *who* asserted it, and *when* it was discovered. This leads to the "non-event" problem you identified: if you merge immediately, the identity assertion vanishes into the structure, and you cannot represent the *process* of resolution.

  ### 2. Path to Progress: A Principled Division of Labor

  If your diagnosis is right (and it is), progress does not come from picking a winner. It comes from formalizing the **interface** between the two layers. You need a dual-layer architecture.

  #### A. Architectural Separation
  You should explicitly model two layers in your schema:
  1.  **The Canonical Layer (The "World"):** Contains merged nodes representing distinct real-world objects. This satisfies the Mergers. Reasoning over this layer assumes classical identity (transitive, symmetric, substitutable).
  2.  **The Mention/Concept Layer (The "Data"):** Contains the raw descriptions, guises, or source-specific clusters. This satisfies the Separationists. This layer preserves the "Morning Star" and "Evening Star" as distinct nodes linked to data sources.

  #### B. The Interface: Reified Identity
  The critical engineering innovation is how you link these layers. You cannot use a standard equality predicate (like `owl:sameAs`) to link the Mention Layer to the Canonical Layer, because `owl:sameAs` implies logical identity and merges the nodes in most reasoners.

  Instead, you need **Reified Identity Assertions**.
  *   *Bad:* `MorningStar sameAs EveningStar` (Triggers merge, loses info).
  *   *Good:* `SourceX asserts (MorningStar sameAs EveningStar) with confidence 0.95`.

  This allows the system to maintain the distinct guises while computing a "virtual" merged view for downstream tasks that require ontological consistency. This is effectively implementing **Contextualized Knowledge Graphs** or **Named Graphs**.

  #### C. Formal Treatment of the Interface
  Progress would be a formal logic that handles **hyperintensionality**.
  *   **Standard Logic:** $a = b \rightarrow (P(a) \leftrightarrow P(b))$.
  *   **Your Need:** A logic where $a = b$ is true in the *Ontological Context*, but $Belief(Agent, a = b)$ is false in the *Epistemic Context* until the resolution event occurs.

  You should look into **Dynamic Epistemic Logic (DEL)** or **Situation Semantics**. In DEL, an identity statement is an *event* that updates the agent's information state, not just a static fact about the world. Formalizing your resolution pipeline as an update operation on an epistemic model, rather than a static database constraint, would resolve the "non-event" complaint. The "learning" is the transition between states, not the state itself.

  ### 3. If the Diagnosis is Wrong: The Substantive Counter-Case

  Let's play devil's advocate. Suppose this *is* a substantive disagreement about the semantics of identity, not just an architectural category error. What would that imply, and how could it be settled?

  **Why it might be substantive:**
  It could be that "identity" in open-world data systems is not the same as logical identity. In a KG, identity is often **probabilistic** or **context-dependent**. If `A` matches `B` with 90% confidence, and `B` matches `C` with 90% confidence, `A` might not match `C`. Logical identity is transitive; ER identity often is not. If the Mergers insist on transitive closure, they introduce errors. If the Separationists refuse closure, they prevent reasoning.

  **What would settle it?**
  If this were a substantive semantic dispute, one of the following results would settle it:
  1.  **Formal Inconsistency:** You prove that maintaining separate guises while asserting identity leads to a logical contradiction *within the specific logic your system uses for inference*. (e.g., If you need to run negation-as-failure over the graph, separate nodes for the same object might cause contradictory negations).
  2.  **Information Loss Theorem:** You prove that one approach irretrievably destroys information required for a specific, well-defined downstream task (e.g., temporal reasoning about beliefs).
      *   *Example:* If merging prevents you from answering the query "What did Source X believe before 2020?", then merging is semantically inadequate for *temporal* queries.
  3.  **Empirical Cognitive Alignment:** If your KG is intended to model human knowledge (e.g., for NLP interaction), you could run experiments. If humans treat "Morning Star" and "Evening Star" as distinct in linguistic substitution tasks even after knowing the identity, then the Separationist model is empirically more accurate to the phenomenon you are modeling.

  **Why this is unlikely to be the case:**
  Even if there is a substantive semantic nuance, your pipeline constraint ("it needs both") trumps it. In engineering, if a representation fails to capture a distinction that the application requires, that representation is inadequate, regardless of its philosophical purity. The "Merger" view is semantically pure but pragmatically blind; the "Separationist" view is pragmatically robust but ontologically messy.

  ### Summary Recommendation

  You are correct: this is a verbal dispute arising from a conflation of **truth-conditional semantics** (Merger) and **informational/cognitive semantics** (Separation).

  **To move forward:**
  1.  **Stop debating "Meaning":** Redefine the terms. The Merger node is the **Referent**. The Separation nodes are **Senses** (or Mentions).
  2.  **Implement a Dual-Layer Model:** Do not force the system to choose. Maintain a "Guise Graph" and an "Entity Graph."
  3.  **Formalize the Link:** Treat identity resolution not as a database constraint (merge), but as a **weighted edge** in the Guise Graph that *points* to a unification in the Entity Graph.
  4.  **Adopt Dynamic Semantics:** Model the resolution as an update event. The value of the system is not just the graph state, but the log of transitions (the "learning").

  By explicitly architecting the distinction that philosophy left implicit, you dissolve the battle. You aren't solving Frege's problem; you are engineering around it.
