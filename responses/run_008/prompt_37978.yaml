answer: |-
  **JOINT STATEMENT ON DECISION-THEORETIC PROTOCOLS**
  **Participants:** Proponent of Superrationality (SR); Defender of Causal Decision Theory (CDT)
  **Subject:** Adversarial Collaboration on Hofstadter's Decision Experiments

  **A. Agreed Claims**

  1.  **Formal Structure:** Both parties accept the game matrices as defined in the preamble. Payoffs are common knowledge. Communication is restricted to the defined channels (telegram, postcard).
  2.  **Platonia Verdict:** Both parties agree that if agents are strictly deterministic and reason identically, the outcome is universally zero (all send or all abstain). Therefore, superrationality cannot prescribe a deterministic action. We agree that a valid superrational verdict requires agents to adopt an identical *mixed strategy* (randomizing with probability $p=1/20$) to break symmetry.
  3.  **Luring Lottery Dynamics:** Both parties agree that if all participants adopt the CDT dominant strategy (maximizing entries), the prize value approaches zero. Both agree that if all adopt a constrained strategy (e.g., one entry), the prize retains value.
  4.  **Concessions:** The CDT concedes that universal superrationality yields higher collective utility than universal CDT in these specific games. The SR concedes that CDT is robust against defection by agents who do not share the superrationalist's reasoning process or similarity threshold.

  **B. Disagreements Table**

  | Topic | Wording Acceptable to Superrationalist (SR) | Wording Acceptable to Causal Theorist (CDT) |
  | :--- | :--- | :--- |
  | **Nature of Correlation** | My choice is logically correlated with others' choices; reasoning identically means our outputs are linked regardless of causal isolation. | My choice is causally independent of others' choices; their actions are fixed facts relative to my decision node. |
  | **Normative Force** | I ought to act as if my choice determines the group's choice, because rationality requires optimizing for the output of my algorithm, not just my instance. | I ought to maximize expected utility based on causal consequences; treating my choice as determining others' is a magical thinking error. |
  | **Luring Lottery Action** | I should submit one entry, assuming others mirror this restraint to preserve prize value. | I should submit as many entries as possible, as my entries cannot causally reduce others' submissions. |

  **C. Cruxes and Empirical Tests**

  **1. Causal vs. Logical Correlation**
  The central dispute is whether logical necessity bears on rational obligation. The SR claims reasoning creates a logical link; the CDT claims only physical causation matters.
  *   **Test:** The **Open-Ledger Variant**. The sponsor publishes every entry with the entrant's written justification after each round. Entrants know this in advance.
  *   **Prediction (SR):** Cooperation rates will rise. Transparency makes the logical correlation common knowledge, reinforcing the mirroring premise.
  *   **Prediction (CDT):** Cooperation rates will remain unchanged. The causal structure is independent of published justifications; knowing *why* others defected does not change the payoff matrix.

  **2. Similarity Threshold**
  Superrationality relies on the premise that others reason identically to oneself. The parties disagree on the required degree of similarity.
  *   **Test:** The **Twin-Corridor Experiment**. The Luring Lottery is run simultaneously on two populations: Group A (readers of a single technical column) and Group B (drawn at random).
  *   **Prediction (SR):** Group A will submit significantly fewer entries per capita. Shared reading material implies shared reasoning algorithms, triggering the superrational constraint.
  *   **Prediction (CDT):** There will be no statistically significant difference. Reading habits do not establish causal links between postal submissions.

  **3. Norm vs. Prediction**
  Is superrationality a rule for ideal agents or an empirical heuristic?
  *   **Argument:** The SR argues it is a normative requirement for any agent claiming rationality. The CDT argues it is at best an empirical prediction about clustered behavior, not a norm.
  *   **Test:** Post-experiment survey of defectors in Group A (Twin-Corridor).
  *   **Prediction (SR):** Defectors will express regret or acknowledge a reasoning error.
  *   **Prediction (CDT):** Defectors will express satisfaction with maximizing their individual share given the actual pool size.

  **D. Closing Note**

  A portion of this dispute appears verbal. Both parties agree on the physical causal structure of the universe. The disagreement reduces to the definition of "rationality." The SR defines it as "optimizing the output of one's reasoning algorithm across all instantiations," while the CDT defines it as "maximizing expected utility given causal independence." If we adopt the SR definition, superrationality is tautologically correct. If we adopt the CDT definition, it is tautologically incorrect. However, the empirical predictions in Section C remain divergent regardless of terminology, allowing for eventual falsification.

  \residual{Whether logical correlation between causally independent agents constitutes a valid basis for decision-making.}
