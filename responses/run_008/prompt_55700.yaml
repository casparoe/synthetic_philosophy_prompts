answer: |-
  The philosophers are onto something your vocabulary genuinely cannot express, specifically the metaphysical status of the cognitive boundary, even though the functional dynamics of reliance match your sourcing protocols perfectly.

  Here is the debate restated in your terms. Imagine a reporter, Otto, whose memory is failing due to stress or age, and a reporter, Inga, whose recall is sharp. When Inga needs a date for a story, she retrieves it from her biological memory; when Otto needs a date, he retrieves it from a notebook he carries everywhere. In your vocabulary, Otto's notebook is a long-standing source with a known domain of competence: it is always available, automatically trusted without secondary verification, and instantly accessible. The extended mind thesis argues that if the notebook meets these ground rules—reliability, trust, and access—it is not merely a tool Otto consults, but part of Otto's reporting capacity, functionally identical to Inga's biological memory. The criteria for when an external store counts as cognitive are your standard vetting rules: you only treat the notebook as memory if you never leave home without it, you never doubt its entries, and you retrieve them as automatically as breathing. The skeptic's objection translates to an editor's insistence on provenance: the editor argues that the notebook is a reliable external aid Otto consults, not part of Otto's mind, and that calling it part of his mind conflates reliability with constitution. To the editor, the notebook is like a wire service feed you have never personally verified; you can print it on authority, but you cannot claim it as your own reporting, because the boundary of the byline must remain at the skull.

  The residue report reveals where the mapping holds and where it breaks. The parts of the debate that map cleanly onto sourcing are the criteria for reliance: trust, availability, and ease of access are identical to how you vet a confidential source or decide when to rely on a wire service without double-checking. The distortion required to make this fit is normative versus descriptive: your sourcing rules are ethical guidelines for how you *should* write to avoid liability, whereas the philosophers are making a descriptive claim about what the mind *is* regardless of liability. The element with no counterpart in journalism is the Parity Principle. In your trade, internal and external processes are never entitled to the same description even if they play the same role; a fact you verified yourself is "reporting," while a fact you took on a source's authority is "attribution," and blurring that line is professional malpractice. The philosophers argue that if the functional role is identical, the ontological status should be too, but your vocabulary is designed specifically to prevent that equation to protect you from errors you didn't personally verify. Your instinct that this is a reporter-and-source problem is functionally accurate, but your vocabulary cannot express the philosophical claim because it is built to enforce the very boundary the philosophers are questioning.
