      *   *Wait, re-reading the prompt:* "if you think it helps, one of us can play an applicant who answers the three groups' different questions differently."
      *   *Decision:* I will incorporate this as a "Live Interrogation" phase *after* the ranking but *before* the final debrief. It powerfully demonstrates how the *question* dictates the *truth*.

  7.  **Finalizing the Plan Structure:**
