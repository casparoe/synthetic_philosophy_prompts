      *   *Files:* Need 5-6 composite cases. They need to be ambiguous enough that the three lenses produce different rankings.
          *   Case A: High cost, low distress, high impact (The "Arithmetic" winner).
          *   Case B: Low cost, high distress, low impact (The "Felt" winner).
          *   Case C: Med cost, med distress, transformative impact (The "Capability" winner).
          *   Case D: The "Trap" (Looks bad on all, or good on all).
          *   Case E: The "Chronic" (High distress, low impact).
