          2.  *Felt Experience:* Subjective suffering/distress.
          3.  *Capability/Impact:* What the money enables the person to *do* (functioning).
      *   **Goal:** Design a 90-minute structured activity (not a lecture/discussion) for the annual retreat to surface these differences.
      *   **Constraints:** Church meeting room, mixed ages, anti-lecture sentiment.
