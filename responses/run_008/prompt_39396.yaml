answer: |-
  This is a sophisticated design challenge. You are asking to turn a philosophical impasse into a mechanical revelation. The goal is not to convince one faction they are right, but to prove that **the question determines the answer.**

  Here is the design for your 90-minute session, titled **"The Lens Exercise."**

  ### I. The Setup (Logistics)

  *   **Room:** Three tables arranged in a triangle or separate corners. One large whiteboard or flipchart at the front.
  *   **Materials:**
      *   3 Packets of Applicant Files (identical content, different cover sheets).
      *   3 "Decision Sheets" (grid to list applicants, rank, and dollar amount).
      *   3 Distinct "Mandate Cards" (one for each table).
      *   Facilitator "Key" (for you, hidden).
      *   Timer (visible to all).
  *   **Participants:** 12 people. Split into 3 groups of 4. Assign them deliberately: mix the factions so no single table is an echo chamber.
  *   **The "Actor" Decision:** Do **not** use a volunteer to play an applicant. It introduces too much variance (bad acting, running over time, emotional leakage). Instead, **you** will play the "Database." During the activity, groups can spend "Inquiry Tokens" to ask you one question per file. You will answer based on their Mandate Card. This ensures the *same* applicant yields different *facts* depending on who is asking.

  ### II. The Mandate Cards (The Three Lenses)

  Each group receives the same 5 applicant files but a different instruction on how to rank them. They are told: *"You have $6,000 to distribute today (scaled down from annual for the exercise). You must fund at least 3 applicants. You cannot fund everyone. Rank them 1–5 based **strictly** on your Mandate."*

  *   **Table 1 (The Gap):** "Your goal is **Financial Triage**. Rank applicants by the severity of the arithmetic gap between the cost and their available resources. The larger the deficit relative to income, the higher the priority. Ignore emotional state or long-term outcomes."
  *   **Table 2 (The Feeling):** "Your goal is **Relief of Suffering**. Rank applicants by the intensity of their current distress. How bad does this situation feel to them *today*? Ignore the math or whether the fix is permanent. Prioritize the person in the most pain."
  *   **Table 3 (The Future):** "Your goal is **Restored Function**. Rank applicants by what this money allows them to *do* that they otherwise could not. Will this restore their ability to work, care for family, or live independently? Ignore the dollar amount or their emotional state. Prioritize the biggest change in capability."

  ### III. The Applicant Files (Composite Cases)

  Write these on single sheets. Keep them brief.

  1.  **Marcus (The Commuter):** Needs $1,800 for transmission. Works gig delivery. Income fluctuates.
      *   *Surface:* "I'll sleep in the car if I have to. Just need to work." (Low Felt)
      *   *Gap:* High (has $200).
      *   *Future:* High (No car = no job).
  2.  **Elena (The Chronic):** Needs $900 for dental procedure. On disability.
      *   *Surface:* "I'm used to the pain. It's manageable." (Low Felt surface, but file notes "cries at night").
      *   *Gap:* Medium (has $400).
      *   *Future:* Low (procedure fixes tooth, not chronic condition).
  3.  **The Johnsons (The Eviction):** Needs $2,200 for back rent. Both employed but hours cut.
      *   *Surface:* "We are terrified. We will lose everything." (High Felt)
      *   *Gap:* High (has $0).
      *   *Future:* Medium (Rent due again next month; this is a stopgap).
  4.  **Sarah (The Caregiver):** Needs $1,200 for car repair. Drives elderly mother to chemo.
      *   *Surface:* "I'm worried about Mom." (High Felt)
      *   *Gap:* Medium (has $500).
      *   *Future:* High (No car = missed treatment).
  5.  **David (The Appliance):** Needs $1,000 for refrigerator. Single income.
      *   *Surface:* "It's annoying. I can eat out." (Low Felt)
      *   *Gap:* High (has $50).
      *   *Future:* Low (Can use food banks/restaurants).

  ### IV. The Timeline (90 Minutes Strict)

  **0:00 – 0:10: Introduction & Grouping**
  *   No theory. No mention of the "three factions."
  *   Hand out the packets. Read the Mandate Cards aloud.
  *   **Rule:** "You may not debate the Mandate. You must use it. You have 3 'Inquiry Tokens' for the whole group. You can trade a token to ask the Facilitator one specific question about any applicant. I will answer based on the records."

  **0:10 – 0:40: The Ranking (Group Work)**
  *   Groups work silently or internally.
  *   **The Mechanism:** When a group uses a Token, they ask a question. You consult your **Facilitator Key**.
      *   *If Table 1 (Gap) asks:* "What is the exact shortfall?" -> You give precise math.
      *   *If Table 2 (Feeling) asks:* "How are they coping emotionally?" -> You give a quote about their stress levels (e.g., for Marcus, you reveal "He hasn't slept in 3 days" despite his stoic file).
      *   *If Table 3 (Future) asks:* "What happens in 6 months if we don't pay?" -> You give a projection (e.g., for Johnsons, "They will likely face eviction again in 90 days").
  *   *Why this matters:* This proves your point that **the question extracts the truth.** Marcus looks stoic until the "Feeling" group asks about sleep. The Johnsons look like a solid bet until the "Future" group asks about next quarter.

  **0:40 – 0:55: The Wall of Decisions**
  *   Each group posts their Decision Sheet on the wall.
  *   They must circle the top 3 they funded.
  *   **Silent Gallery Walk:** Everyone walks around and looks at the discrepancies. (e.g., Marcus is #1 for Future, #4 for Feeling).
  *   **No talking yet.** Let the cognitive dissonance sit for 2 minutes.

  **0:55 – 1:15: The Debrief (Structured Dialogue)**
  *   Do not ask "What did you think?" Ask specific mapping questions:
      1.  **The Data Point:** "Table 2, did anyone change their mind about Marcus after using an Inquiry Token? What fact did you learn that Table 1 didn't care about?" (Reveals: The question dictates the data).
      2.  **The Conflict:** "Table 3, you funded Sarah. Table 1, you funded David. Both had high gaps. Why did the dollar amount matter less to Table 3?" (Reveals: Capability vs. Arithmetic).
      3.  **The Discomfort:** "Which Mandate felt the most uncomfortable to enforce? Why?" (Usually, 'Feeling' feels too subjective; 'Future' feels like playing God).

  **1:15 – 1:30: Synthesis**
  *   You (the facilitator) name the three frameworks: **Need (Gap), Suffering (Feeling), Capability (Future).**
  *   **Closing Prompt:** "We have 90 minutes left in our retreat. We are not going to pick one. We are going to decide: In what proportion do these three questions belong in our final criteria?"

  ---

  ### V. What Will Go Wrong (Honest Assessment)

  1.  **Rebellion Against the Mandate:** Within the first 10 minutes, someone at Table 1 will say, "But we can't ignore how they feel, that's inhumane."
      *   *Fix:* You must be a strict facilitator. "For this exercise, please trust the constraint. You can debate the constraint later." If they break character, the data is ruined.
  2.  **The "Future" Group Paralysis:** Table 3 will struggle. Predicting the future is hard. They will argue about whether the car repair *really* keeps the job. They will run out of time.
      *   *Fix:* Give them a "Crystal Ball" rule. Tell them: "For this exercise, assume the projections in the files are facts."
  3.  **The "Feeling" Group Guilt:** Table 2 will likely fund the most emotional cases, realizing they are ignoring the math. They may feel irresponsible.
      *   *Fix:* Acknowledge this in the debrief. "This is the cost of prioritizing suffering. It often ignores sustainability."
  4.  **Time Creep:** The Gallery Walk often turns into a debate.
      *   *Fix:* Enforce the "Silent Walk." No talking until the debrief questions start.

  ### VI. The Real Problem (What Paper Files Can't Reproduce)

  You asked which part of the real problem this exercise cannot capture. You suspected it was about the committee not being neutral observers. You are half-right, but it is deeper than that.

  **1. The Moral Injury of the Giver**
  Paper files are clean. Real life is messy. In the real meetings, when you deny a grant, you are not just applying a criterion; you are **inflicting a wound.**
  *   The "Arithmetic" group protects the fund, but they go home feeling cold.
  *   The "Feeling" group helps the suffering, but they watch the money run out in October, causing panic later.
  *   The "Future" group tries to engineer lives, but when their prediction fails (the car breaks again), they feel responsible for the failure.
  *   *The Exercise Misses:* The **emotional hangover** of the decision. The exercise shows you *how* you decide; it doesn't show you what the decision *does to you*. The perpetual arguments are often a displacement activity to avoid feeling the guilt of saying "no."

  **2. The Power Dynamic (The "Knowability" Problem)**
  In the exercise, the files are static. In reality, the applicants are neighbors.
  *   Some committee members know the applicants. They bring "backchannel data" ("I know Marcus, he actually drinks," or "Elena is tougher than she looks").
  *   The exercise assumes neutrality. The real problem is that **information is unevenly distributed.** The faction that wins is often the one with the best gossip, not the best philosophy.
  *   *The Exercise Misses:* The social capital of the committee members. A "Gap" argument often wins not because it's right, but because receipts are easier to defend against a neighbor's accusation of favoritism than "felt suffering."

  **3. The "Stopgap" Anxiety**
  The "Future" lens (your position) is the hardest to operationalize because it requires admitting **limit.**
  *   To say "We will not fund this because it is a stopgap" is to say "We will not help you because we cannot save you."
  *   Paper files make this a logic puzzle. In the room, with a person waiting, this is an existential crisis. The arguments are circular because no one wants to articulate the limit: *"We only help those who can be saved."*
  *   *The Exercise Misses:* The fear of admitting that the fund is too small to solve the problem. The arguments about criteria are a proxy for the grief of insufficiency.

  ### Recommendation for the Debrief Closing

  When you map the moments, end with this truth:

  > "Today, we saw that our questions create our reality. But next month, when we sit here, we aren't just answering questions. We are living with the consequences. The 'Arithmetic' protects the fund's life. The 'Feeling' protects the applicant's dignity. The 'Future' protects the community's function.
  >
  > The fight isn't about which one is true. The fight is about which pain we are willing to carry. Are we willing to carry the pain of a cold calculation? The pain of a bankrupt fund? Or the pain of knowing we couldn't fix it?"

  This moves the committee from "Who is right?" to "What burden can we bear?" which is the only place a consensus can actually live.
