      *   *Test vs. Doctrine:* This is a standard and generally accepted move in secondary literature (e.g., Bernard Williams, Alexander Nehamas, Lawrence Hatab). Nietzsche himself oscillates. The *Gay Science* formulation is explicitly existential/psychological. The cosmological proof is widely regarded as flawed even by Nietzsche scholars, so focusing on the *thought* rather than the *truth* is philosophically defensible.
      *   *Redemption (Zarathustra):* The connection between Eternal Recurrence and the "Redemption" chapter (*Vom Erlösen*) is crucial. In *Zarathustra*, the will's liberation comes from transforming "it was" into "thus I willed it." This is the bridge to *Amor Fati*. The user's connection (writer resenting past drafts = will resenting "it was") is strong.
