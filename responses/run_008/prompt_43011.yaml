      *   *Addressing the Framing:* Here's the correction. The user is framing this as "what do they deserve?" (Retributive Justice). But the company should be asking "what prevents recurrence?" (Restorative/Systemic Justice). The real confusion is mixing *learning* with *punishing*.
      *   *Recommendation:* Same warning for both. Focus on the process violation, not the outcome.
