      *   **The Conflict:** Process violation (controllable) vs. Outcome (partially uncontrollable).
      *   **Manager's View:** Consequentialism/Pragmatism. Outcomes matter for liability and practical consequences.
      *   **Colleague's View:** Epistemic limitation. We only know something was wrong because it broke.
      *   **User's View:** Deontological/Process-oriented. The act itself was wrong regardless of outcome. Punishing based on outcome is unfair ("moral luck").
      *   **Organizational Context:** Incident review committees (post-mortems) usually aim for systemic improvement, not blame assignment (Blameless Post-Mortems are industry standard). However, this committee is assigning *disciplinary* action (written warnings).

  3.  **Evaluate the Framing:**
      *   Is the user's framing confused?
          *   The user identifies the core philosophical tension correctly (moral luck).
          *   The user correctly identifies the risk of incentivizing hiding near misses.
