  Here is the breakdown of the machinery, the prediction, and the trap to set for the next round.

  ### Part 1: The Candidate Rules

  Based on her six prior rulings, there are three competing hypotheses for the algorithm running in her head.

  **Hypothesis A: The "Exit Clause" Heuristic (Reversibility)**
  *   **The Rule:** A decision is a **Leap** if you cannot return to your prior state without catastrophic loss or structural impossibility. It is **Current Self** if there is a viable "off-ramp."
