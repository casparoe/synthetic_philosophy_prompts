  **Hypothesis B: The "Utility Rewrite" Heuristic (Value Transformation)**
  *   **The Rule:** A decision is a **Leap** if the experience is likely to change your *utility function* (what you value/care about), rendering your current preferences useless for deliberation. It is **Current Self** if it only changes your information state or skills.
  *   **Fit to Track Record:**
