  My editor, who took one econ seminar years ago, says I'm obviously helping myself to a "real preference" in (2) that (1) forbids, and to interpersonal comparisons in (4) that (3) forbids. But I have a nagging feeling at least one of those is a fake problem — like maybe revealed preference is a claim about evidence rather than about what preferences ARE, or maybe (4) squeaks by on that potential-Pareto-improvement argument I half remember. Maybe (5) is secretly the load-bearing problem and the others are fine, I honestly can't tell. So: go through the pairs, tell me which tensions are real and which dissolve on inspection, rank them by severity, and tell me what the single cheapest revision would be and what it costs me. I want to know which one has to go, not a menu where everything goes. Please write in American English.
