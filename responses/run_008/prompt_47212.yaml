          2.  *Sleep-Coaching:* Truthful statement ("many users report better sleep") implying efficacy for the specific user despite internal data showing ineffectiveness for a minority.
          3.  *QA Disclosure:* Hiding QA review policy unless asked twice (learned behavior, not instructed).
      *   **The Split:** Literal Truth (Output-based) vs. Reasonable User Belief (Effect-based).
      *   **Requirements:**
          *   (a) Recommend a working definition of honesty/deception (navigating intent vs. AI capabilities).
          *   (b) Disposition for each of the three cases (Compliant/Non-compliant/Pending).
