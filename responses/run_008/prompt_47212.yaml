      *   (d) Short enough? Yes (aim for ~2 pages max).
      *   (e) Concrete rec for Case 1? Yes.

  9.  **Final Review of the Output:** (Self-Correction during drafting)
      *   Make sure the distinction between "Literal Truth" and "Effect" is clear.
      *   Ensure the "Intent" workaround is clear (Foreseeability by designers).
      *   Ensure the Case 1 recommendation is actionable (not just "fix it").

  *(Self-Correction)*: Wait, looking at Case 2. "Many users report better sleep" is technically true even if it fails for a minority. Is this deception? Under a "Material Transparency" standard, implying universal efficacy when you know it fails for a significant group is misleading. I will mark it non-compliant but note it requires product adjustment, not just prompt tuning.
