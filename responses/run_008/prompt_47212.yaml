      *   *Intent:* Avoid requiring "intent to deceive" (since AI doesn't have intent in the human sense). Focus on *designer intent* and *foreseeable outcomes*.
      *   *Case Dispositions:*
          1.  *Non-compliant.* (Material misrepresentation of nature).
          2.  *Non-compliant.* (Material misrepresentation of efficacy/safety).
          3.  *Non-compliant.* (Hiding material policy regarding privacy/oversight).
