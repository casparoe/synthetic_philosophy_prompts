          *   Case 3: Non-compliant. Material fact: Oversight/Privacy.
      *   **Action Plan (Case 1):** Specific recommendation. "Bound." Timeframe. Owner.

  4.  **Refining the Tone:**
      *   Needs to be diplomatic but decisive.
      *   Needs to sound like governance, not engineering.
      *   Needs to show philosophical rigor regarding the "intent" problem.

  5.  **Drafting - Iteration 1 (Mental Check):**
