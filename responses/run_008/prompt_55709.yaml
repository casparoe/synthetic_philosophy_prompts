answer: |-
  **The Relational Allocation Protocol (RAP)**

  **Step 1: Narrative Update (3 mins)**
  Ignore prior scores. Read the last five carer logs. Ask: "What changed in the *relationship* since last review?" Document specific shifts (e.g., "Client now waits by window," "Carer reports resistance").
  *Audit Output:* Log excerpt + observed shift.

  **Step 2: The Reception Test (5 mins)**
  Ask: "Does the client experience this visit as care?" If the client verdict is 'No' (worthless, intrusive), the deficit score is irrelevant. Care unreceived is resource waste.
  *Audit Output:* Client verdict recorded.
  *Handoff:* If client lacks capacity, proceed to Step 3.

  **Step 3: The Silence Safeguard (2 mins)**
  For inarticulate clients, require verbal testimony from the frontline carer (not just notes). Question: "What need is unspoken?" Document carer name and specific observation.
  *Audit Output:* Carer testimony.

  **Step 4: Allocation & Rationale (5 mins)**
  Set hours. If deviating from deficit score, write: "Relational necessity: [Reason]." If conflicting values exist (e.g., autonomy vs. network sustainability), mark **VALUE JUDGMENT** and sign.
  *Audit Output:* Rationale statement.
  *Handoff:* The **VALUE JUDGMENT** flag hands the decision back to the panel. Numbers cannot resolve value conflicts; only responsible agents can.

  ***

  **Case Runs**

  **(1) The Widower:** Deficit score = 0 (physically independent). Reception Test = Positive (client states visits are "the only light"). Logs show mood stabilization.
  *Decision:* Maintain hours.
  *Rationale:* Relational necessity: Isolation prevention.
  *Audit:* Passes. Non-physical need documented.

  **(2) The Burnout Case:** Heavy physical needs. Daughter is collapsing. Mother insists she needs nothing new (Reception Test = Negative). Silence Safeguard = Daughter reports crisis.
  *Decision:* Cut hours.
  *Rationale:* Client verdict overrides proxy need (Autonomy).
  *Hard Truth:* This is hard to accept. The procedure prioritizes the client's voice over the caregiver's survival, potentially causing network collapse. The **VALUE JUDGMENT** flag is raised, but the protocol forces autonomy over care sustainability.

  **(3) The Dementia Client:** Preferences contradict neighbours. Reception Test = Incoherent. Silence Safeguard = Neighbours + Carer observe safety risks.
  *Decision:* Increase safety checks.
  *Rationale:* Safety overrides stated preference.
  *Audit:* Marked **VALUE JUDGMENT**. Panel accepts liability for overriding autonomy.

  ***

  **Critique: Where It Misfires**

  This procedure does not refute the worry that codified care stops being care; it instantiates it, hoping to mitigate the damage. By turning "attention" into Step 1 and "responsiveness" into Step 2, we risk bureaucrats ticking boxes labeled "empathy" without feeling the weight of the relationship. The procedure creates a *simulation* of care ethics within a utilitarian structure.

  It will misfire where trust is low. Step 3 (Silence Safeguard) relies on frontline carers having the security to speak truth to power. If management culture punishes bad news, carers will sanitize testimony, and the inarticulate client remains invisible. The procedure cannot manufacture the psychological safety required for genuine attentiveness.

  Furthermore, the **VALUE JUDGMENT** flag is the weakest link. Auditors hate ambiguity. In practice, panels will minimize these flags to avoid scrutiny, reverting to the safety of numbers. The procedure admits that some decisions turn on values, not facts, but the funding authority's framework demands facts.

  **Permanently Provisional Parts:**
  Step 2 (Reception Test) must remain provisional. A depressed client may reject care they need; a dementia patient may cannot articulate receipt. Treating the client verdict as absolute data risks neglecting those too ill to complain. This step requires human interpretation, not rule-following.

  Ultimately, this protocol is a shield, not a solution. It gives you the language to defend relational decisions to auditors, but it cannot force the panel to *be* attentive. It records the judgment call; it does not make the judgment wise. That remains your burden. The procedure manages the accountability; it does not manage the care.
