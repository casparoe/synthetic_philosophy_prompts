      *   *Tension:* Independence (1) vs. Base-Rates (3). If you claim the "No-Alternatives" argument works because *this* theory is unique (mathematically), you are implicitly claiming the base rate of "unique mathematical structures" is different from the base rate of "theories physicists like."
