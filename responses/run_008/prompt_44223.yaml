  8.  *(Final thought on the Impossibility Theorem)*: The core tension is that Non-Empirical Theory Assessment (NETA) claims to update probabilities based on meta-indicators. But if the meta-indicators (like "no alternatives") are themselves subject to historical base rates (people always thought there were no alternatives until there were), then NETA collapses. To save NETA, one must claim the *current* situation is metaphysically distinct from history. That is an unfalsifiable claim. This is the crux. I will articulate this in the "Joint Unsatisfiability" section.

