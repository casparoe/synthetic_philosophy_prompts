      *   *Why:* To have high confidence (4) in a theory that absorbs many outcomes (2), you need a very strong prior. But base rates (3) of historical theoretical beauty $\to$ truth are terrible. To satisfy (4) given (2), you must reject (3). To satisfy (3) given (2), you must reject (4).

