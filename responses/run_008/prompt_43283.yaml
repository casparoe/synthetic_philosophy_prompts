      *   *Final Polish:* Ensure the memory link is causal and direct to satisfy Locke. Ensure the narrative split is the *charitable* interpretation for Dennett.

  5.  **Drafting the Walkthrough:**

      *   *Memory View:* Focus on psychological continuity. $P1$ remembers $P0$'s experiences. Causal chain is brain continuity. Therefore $P1 = P0$.
      *   *Narrative View:* Focus on the "Center of Narrative Gravity." A center of gravity organizes mass/behavior. If the behavior organizes around two distinct, incompatible poles of intentionality that take turns, positing one center makes the story convoluted ("John is a monk who sometimes gambles compulsively despite hating it" vs "John-Monk and John-Gambler take turns"). If they repudiate each other's commitments *normatively*, the narrative unity breaks.
      *   *Key Feature:* The *normative repudiation* combined with *mnemonic acceptance*. I remember doing it, but I disavow the *agent* who did it.
      *   *Removal:* If they accepted each other's actions (e.g., "I was wild then, but now I'm sober"), it collapses to ordinary growth/regret.
