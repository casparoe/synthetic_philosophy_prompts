answer: |-
  1. **Paradigm Alignment (NN):** Must classify chemical elements/compounds as natural kinds. *Motivation:* Chemical kinds are the epistemic gold standard for projectibility; failing here renders the theory irrelevant to standard scientific realism.
  2. **Disjunction Exclusion (NN):** Must exclude disjunctive categories like 'jade' (jadeite/nephrite) despite superficial similarity. *Motivation:* Disjunctive kinds undermine lawhood; a theory must explain why shared appearance without shared constitution fails to support induction.
  3. **Special Science Autonomy (P):** Must allow kinds like 'depression' or 'market' to be real without microphysical reduction. *Motivation:* Special sciences rely on functional rather than structural categories; denying them reality threatens scientific pluralism. *Tension:* High bar for (1) often excludes these via reductionism.
  4. **Species Pluralism Compatibility (NN):** Must explain why biology accepts incompatible species concepts without metaphysical error. *Motivation:* Biologists operate with multiple species concepts simultaneously; metaphysics must not dictate practice away. *Tension:* Directly challenges traditional uniqueness claims (6).
  5. **Ontic/Epistemic Distinction (NN):** Must distinguish mind-independent clustering from merely useful classificatory shorthands. *Motivation:* Without this, 'grue' or 'table' could count as natural kinds, collapsing the distinction between ontology and convenience.
  6. **Uniqueness Clarification (P):** Must specify whether reality implies a single correct carving (Platonic) or permits multiple valid cuts. *Motivation:* Determines if the world dictates one true taxonomy or if interests relative to capacities allow multiple real cuts. *Tension:* Hard to reconcile with (4) without relativizing reality.
  7. **Induction-Ontology Link (NN):** Must explain why inductions succeed over real kinds, or decouple success from reality if practice diverges. *Motivation:* Epistemologists need induction grounded in reality; scientists need classification licensed without metaphysical apology. *Tension:* If (3) kinds project but lack deep ontology, this link severs.

  **Incompatibility Notes:** (1) and (3) force a choice on reductionism; (4) and (6) force a choice on monism versus pluralist realism; (7) breaks if (3) is granted without ontic grounding, revealing the pull between the epistemologist's need for grounding and the scientist's need for autonomy.

  Classical essentialism satisfies (1), (2), and (5) but fails (3) and (4) by demanding microstructural unity and monism. Homeostatic Property Cluster views satisfy (3) and (4) but struggle to sharply enforce (2) and (5) against loose clustering. The most exclusionary requirement is (5), as it forces a stance on realism versus pragmatism that eliminates instrumentalist accounts.
