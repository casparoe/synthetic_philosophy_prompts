prompt: |-
  I'm in a bioethics course and we just finished a unit on advance directives, which got me thinking about a way of framing the whole debate that I haven't seen anyone use, and I wrote up a short essay draft around it. I'd love comments on whether the central argument actually holds up, and especially on whether the objection I raise at the end is as fatal as I fear it might be. To be clear, I'm not asking about the medical/legal logistics of living wills, I'm asking about the underlying normative question: when a person is no longer competent, why should their earlier, competent self get to decide what happens to their body?

  Here's my draft. "The standard defenses of advance directives appeal to the autonomy of the past self: the person I was when competent made a considered choice, and that choice binds the person I later become, much like an author's earlier chapters constrain the ending of a novel. Critics object that the demented patient is in some sense a different person, one who never made any such choice, and it's wildly paternalistic to impose the dead hand of a predecessor on them. I want to propose a third framing: the fiduciary model. Think of the earlier self not as a ruler issuing commands to a subordinate future self, but as the settlor of a trust. The directive is the trust instrument, the later incompetent self is the beneficiary, and family members and clinicians are the trustees. What's distinctive about the trust framing is what it does with the beneficiary's welfare. Trust law generally directs trustees to act in the beneficiary's interest, but a trust instrument can be written precisely so that the beneficiary cannot frustrate the settlor's intentions — think of spendthrift clauses that stop a wastrel heir from dissipating the corpus. The settlor's purposes, not the beneficiary's momentary preferences, control. Similarly, when a contented, demented patient seems happy in ways that contradict her earlier directive (say she refused spoon-feeding, but now eagerly eats and seems to enjoy her days), honoring the directive is not a betrayal of the beneficiary but fidelity to the instrument. The point of the arrangement was the settlor's autonomy, not the beneficiary's experiential welfare."

  So my worry, which I gesture at but don't resolve: on the trust model, if the directive is ignored, who exactly is harmed? The settlor no longer exists in any harmed state, and the beneficiary's experiential interests are arguably set aside by the model from the start. With ordinary trusts there's an independent reason to honor the instrument — property rights persist through time — but there's no analogous fact about a self that persists independently of anyone's interest in it. So maybe the trust analogy shows that honoring directives is coherent but not that we have any reason to do it, unless we're willing to say that past selves can be harmed by events after they cease to exist in the relevant sense, which feels like a bigger commitment than most defenders of directives want to sign up for.

  My questions for you: (1) does the fiduciary framing do any real argumentative work, or is it just a decorative analogy that smuggles in the conclusion by picking a legal category where settlor intent already wins? (2) is the harm-to-the-past-self worry at the end genuinely fatal, or is there a way for the trust model to answer it — e.g., by arguing the trust persists precisely because the beneficiary and settlor are partially the same continuing entity, even if that undercuts the 'different person' move against the critics? And (3) more generally, am I right that this is a live gap in how people defend directives, or is it just a restatement of a debate that's already been had under different labels? Any comments on accuracy or on where I should develop things further would be great — my professor likes pushing on under-motivated analogies, so be blunt.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User's Request:**
      *   **Context:** Bioethics course, unit on advance directives (ADs).
      *   **Task:** Evaluate a short essay draft proposing a "fiduciary model" (trust analogy) for ADs.
      *   **Core Question:** Why should a past competent self decide for a future incompetent self?
      *   **Specific Concerns:**
          1.  Does the fiduciary framing do real argumentative work, or is it just a decorative analogy smuggling in the conclusion?
          2.  Is the "harm-to-the-past-self" objection fatal, or can the trust model answer it (perhaps via continuity)?
          3.  Is this a novel gap in the literature, or a restatement of existing debates?
      *   **Tone:** Blunt, academic, critical (professor likes pushing on under-motivated analogies).

  2.  **Analyze the Draft Argument:**
      *   **Standard View:** Autonomy of the past self (precedent autonomy).
      *   **Critique:** Discontinuity of self (demented patient = different person), paternalism.
      *   **Proposal:** Fiduciary/Trust Model.
          *   Past Self = Settlor.
          *   Future Self = Beneficiary.
          *   Clinicians/Family = Trustees.
          *   Key Feature: Settlor's intent controls over Beneficiary's momentary preferences (like a spendthrift trust).
          *   Justification: Fidelity to the instrument/arrangement, not the beneficiary's experiential welfare.
      *   **Self-Identified Weakness:** Who is harmed if the trust is violated? The Settlor is gone (can't be harmed?). The Beneficiary's interests are explicitly subordinated by the model. Property rights persist, but does "self-property" persist?

  3.  **Evaluate Question 1: Does the framing do work or is it decorative?**
      *   *Initial thought:* It *is* an analogy. Analogies illustrate, they don't usually prove. However, shifting the *conceptual category* can change the normative weight.
      *   *Critique:* The trust model assumes the validity of the Settlor's authority. In law, a trust is valid because the state enforces property rights and contract law. In bioethics, *why* does the past self have the right to set up this trust over the future body? The analogy presupposes the authority it tries to justify. It shifts "Autonomy" to "Fidelity to an Arrangement," but doesn't explain why the arrangement is binding in the first place.
      *   *Verdict:* It risks being decorative/circular unless it can explain the *source* of the fiduciary obligation without relying on the very autonomy it's trying to defend against the "different person" objection.

  4.  **Evaluate Question 2: Is the harm objection fatal?**
      *   *The Problem:* If the Past Self doesn't exist, how can they be wronged? (The "non-identity" or "posthumous harm" problem). If the Future Self is happy, how are they wronged? (The "no harm, no foul" problem).
      *   *Potential Defense:*
          *   *Integrity/Narrative:* The harm is to the *life's narrative integrity*, not a specific temporal slice.
          *   *The Trust as an Entity:* The trust itself is the enduring entity. Violating it damages the institution of ADs generally (rule utilitarian angle).
          *   *Continuity:* If there's enough continuity to be the "same beneficiary," there's enough continuity to be bound by the "settlor." But this undermines the "different person" concession the author seems to grant.
      *   *Verdict:* It's a serious hurdle. The "harm to past self" is metaphysically tricky. The stronger route might be "harm to the practice" or "violation of integrity" rather than "harm to the extinct settlor."

  5.  **Evaluate Question 3: Is this novel or a restatement?**
      *   *Literature Check:*
          *   *Precedent Autonomy:* Dresser, Robertson, Dworkin.
          *   *Personal Identity:* Parfit (Reductionism), Wilkes.
          *   *Ulysses Contracts:* This is essentially a Ulysses contract argument.
          *   *Fiduciary Models:* Usually applied to doctor-patient relationships, not intra-personal time slices.
          *   *Trust/Property analogies:* Locke (property in person), Nozick.
      *   *Assessment:* The specific "Trust/Settlor/Beneficiary" terminology applied to *temporal selves* is somewhat fresh, but the underlying structure is very close to Dworkin's "Integrity" view vs. Dresser's "Experiential" view. It also overlaps with "Ulysses Contracts." It's a reframing, not a wholly new argument. It needs to acknowledge Dworkin especially.

  6.  **Drafting the Response:**
      *   *Tone:* Encouraging but rigorous (as requested).
      *   *Structure:* Address the three specific questions, then offer constructive suggestions for revision.
      *   *Key Points to Hit:*
          *   The analogy presupposes authority (circularity risk).
          *   The "harm" problem is the crux of the "posthumous interests" debate (Feinberg, etc.).
          *   Connect to existing literature (Dworkin, Dresser, Ulysses contracts).
          *   Suggest focusing on "Integrity" or "Institutional Trust" rather than "Harm to Settlor."

  7.  **Refining the Critique (Self-Correction during drafting):**
      *   *Wait, is the trust model actually distinct from Precedent Autonomy?* Precedent autonomy says "Past Self rules." Trust model says "Past Self sets rules for Future Self's benefit (defined by Past Self)." It adds a layer of *stewardship*. It makes the clinicians trustees. This *does* add something: it explains the *role* of the doctor better than pure autonomy. Pure autonomy = doctor is a servant. Trust model = doctor is a fiduciary. That's a useful distinction. I should highlight that.
      *   *On the Harm Question:* The user worries about harming the past self. But in trust law, if a trustee violates the trust, the *beneficiary* sues, not the settlor (usually). So the analogy actually suggests the *future self* (or their rep) should be able to claim harm, even if they feel happy. But if the future self is a "different person," who sues? This highlights the metaphysical tension.
      *   *Novelty:* It's a specific legal analogy applied to a philosophical problem. It's not "new" in the sense of discovering a new principle, but it might be a useful pedagogical or rhetorical tool. I need to be honest that Dworkin's "Integrity" covers much of this ground.

  8.  **Final Polish:** Ensure I answer the specific prompts (1, 2, 3) clearly. Make sure the "blunt" requirement is met without being discouraging. (e.g., "Your professor is right to be suspicious of analogies that do heavy lifting without foundations.")

  9.  *(Final check against safety guidelines)*: No medical advice given. Purely philosophical/academic discussion. Safe.

  10. **Constructing the Output:** (Proceed to generate response based on these thoughts.)
answer: |-
  This is a sophisticated draft that engages with the core metaphysical and normative tensions in the bioethics literature. You are right to suspect that the "harm" objection is the weak point, but you may be underestimating how much work the fiduciary framing *could* do if you tighten the screws on the "trustee" role.

  Here is a blunt assessment addressing your three specific questions, followed by suggestions for development.

  ### 1. Does the fiduciary framing do argumentative work, or is it decorative?

  **Verdict:** Currently, it risks being decorative because it smuggles in the authority it seeks to justify.

  **The Critique:** In law, a trust is enforceable because the state recognizes property rights and the legal standing of the settlor. When you map this onto the self, you are implicitly assuming the past self has the *authority* to bind the future self. But that is exactly what the "different person" objection denies. If the demented patient is a new moral entity, the "settlor" has no jurisdiction over their "corpus."

  By saying "think of it as a trust," you are asking us to accept the *conclusion* (the past self binds the future self) as a *premise* of the analogy (a settlor binds a beneficiary).

  **How to make it work:** The framing does real work **only if** it shifts the locus of obligation from the *patient* to the *clinician*.
  *   **Standard Autonomy Model:** The doctor obeys the directive because the *patient* demands it (via precedent).
  *   **Fiduciary Model:** The doctor obeys the directive because the *doctor* has accepted a role-based obligation that transcends the patient's current state.

  If you argue that the moral force comes from the **trustee's integrity** (the clinician's duty to uphold the institution of care) rather than the **settlor's power**, you escape the circularity. You aren't saying the past self *can* rule; you're saying the medical profession *must* honor the instrument to maintain social trust. That is a distinct argument from standard precedent autonomy.

  ### 2. Is the harm-to-the-past-self worry fatal?

  **Verdict:** It is fatal *if* you rely on the "harm to the settlor" justification. It is survivable if you pivot to "harm to the integrity of the life" or "institutional harm."

  **The Critique:** You correctly identify the metaphysical snag. If the past self is extinct (as the "different person" critique suggests), they cannot be harmed in a welfare sense. Posthumous harm is a contentious philosophical concept (Feinberg vs. Pitcher). If your argument rests on "we must do this so the dead aren't wronged," you are on shaky ground.

  **The Fix:** Look closely at your own analogy. In a spendthrift trust, if the trustee violates the terms, who has standing to sue? Usually the **beneficiary** or the **Attorney General** (representing the public interest), not the settlor.
  *   **Option A (Continuity):** Argue that while the *psychological* person has changed, the *biological/narrative* entity persists. The harm is to the *life as a whole*, not the temporal slice. This aligns with Dworkin's distinction between "experiential interests" and "critical interests." You need to explicitly engage Dworkin here (see below).
  *   **Option B (Institutional):** The harm is to the **practice** of advance planning. If we allow trustees to ignore instruments whenever the beneficiary seems "happy," the institution of the trust (and by analogy, the AD) collapses. No one will set up trusts (write ADs) if they know the terms are optional. This is a rule-utilitarian defense that sidesteps the metaphysics of the past self.

  **Recommendation:** Do not try to prove the past self can be harmed. Instead, argue that the *violation of the instrument* undermines the normative structure of agency over time.

  ### 3. Is this a live gap, or a restatement of existing debates?

  **Verdict:** It is a restatement of the **Dworkin vs. Dresser** debate, dressed in legal clothing.

  **The Literature Check:**
  *   **Ronald Dworkin (*Life's Dominion*):** Argues for "precedent autonomy" based on **integrity**. He distinguishes between *experiential interests* (what the demented patient feels now) and *critical interests* (what makes the life good as a whole). Your "settlor" is Dworkin's "critical interest holder."
  *   **Rebecca Dresser:** The primary critic. She argues the demented patient is a "new person" and that ignoring their current happiness is oppressive. This is your "different person" objection.
  *   **Ulysses Contracts:** Your argument is essentially a defense of Ulysses contracts (binding one's future self).

  **The Gap:** The literature rarely uses the specific **Trust/Settlor/Beneficiary/Trustee** triad to map these relationships. Most discussions focus on the dyad (Past Self vs. Future Self). By introducing the **Clinician as Trustee**, you add a third party that changes the moral geometry.
  *   *Current Debate:* Does Past Self have authority over Future Self?
  *   *Your Debate:* Does the Trustee have a duty to the Instrument that supersedes the Beneficiary's current mood?

  This is your novelty. Lean into the **role morality of the clinician**. Most bioethics focuses on the patient's rights; your model focuses on the professional's duty to the *plan*.

  ### Specific Suggestions for Revision

  1.  **Acknowledge Dworkin:** You cannot ignore Dworkin. He makes the "critical interests" argument you are making with the "settlor" analogy. Cite him, then explain how the Trust model improves on his "Integrity" view. (e.g., "Dworkin speaks of integrity abstractly; the Trust model specifies the *mechanism* of fidelity through fiduciary duty.")
  2.  **Clarify the Trustee's Role:** In your draft, the clinicians are trustees. In law, trustees have a duty of loyalty to the *beneficiary*. If the beneficiary is the demented self, and the demented self wants spoon-feeding, doesn't the trustee's legal duty require them to feed?
      *   *You need to solve this:* You must argue that in this specific trust, the "Beneficiary's Interest" is *defined by the Settlor*. This is a "support trust" rather than a discretionary trust. Make that distinction clear.
  3.  **Drop the "Harm to Settlor" Line:** As you suspected, it's a trap. Replace it with "Harm to the Normative Practice." If clinicians pick and choose which directives to honor based on their assessment of the patient's current happiness, the AD system loses its binding power for *everyone*.
  4.  **Tighten the "Different Person" Objection:** If you grant the critic that the demented self is a *totally* different person, your trust model fails (you can't set up a trust for a stranger without their consent). You must argue for **partial continuity**. There is enough identity to justify the trust, even if there is enough discontinuity to make the beneficiary's preferences differ.

  ### Summary
  Your intuition about the "harm" problem is correct; that path leads to a metaphysical dead end. However, the **Fiduciary Model** is not useless. It shifts the debate from "What does the patient deserve?" to "What is the professional obligated to uphold?"

  If you rewrite the conclusion to argue that **honoring the directive is a condition of the medical profession's integrity** (the Trustee's duty to the Instrument), rather than a right of the Past Self, you will have a much more robust argument that sidesteps the "harm to the dead" problem.

  **Grade on the draft concept:** B+.
  **Potential with revision:** A.
  **Key risk:** Your professor will pounce on the circularity of the trust analogy if you don't ground *why* the trust is valid in the first place. Ground it in the social utility of the practice, not the metaphysics of the self.
