prompt: |-
  My friend and I just spent like two hours on this and it ended kind of badly, so I want to get it straight. She's german, visiting me in the states, and she flat out refuses to tip 20% at restaurants -- she thinks the whole system is exploitative and that paying servers properly is the employer's job, not hers, so she tips like she would in berlin and won't be moved on it. Meanwhile I've been lecturing HER for years about not jaywalking when we visit her ( germans actually wait at empty crosswalks at 3am, its wild), and my whole lecture is basically "when in rome". She threw that back at me: if when-in-rome is real, she has to tip here, and if she doesn't have to tip, I shouldn't have to wait at her empty crosswalks. So either we're both hypocrites or the slogan is doing nothing.

  The thing is I feel like she's right that something's off, but ALSO like the two cases aren't the same, and I can't articulate why. So: what are the actual different claims packed into "when in rome, do as the romans do"? Like, one reading is just practical advice (don't get yelled at), one might be about not insulting your hosts, one might be a full-blown moral claim that local convention actually GENERATES obligations for visitors, and maybe there's a coordination-game version where queueing and tipping are the kind of thing that only work if everyone does them. And then the question I actually care about: on which of those readings does she have a tipping obligation in the US, on which do I have to wait at the stupid empty crosswalk, and are those the same reading or different ones? Is the difference something about who bears the cost, or whether the convention is load-bearing for someone's livelihood, or whether complying signals endorsement of the underlying practice (which is her whole worry -- she says tipping well makes you complicit)?

  Please lay out the readings as a list, from the most trivial to the most radical, and for each one say whether its plausible and what it would force us to do in the tipping vs jaywalking cases. Then tell me if theres a principled way to say she owes the tip but I can cross the empty street, or whether I have to bite a bullet here. Hard limit: 450 words, I want to be able to reread it in one sitting before I text her.
