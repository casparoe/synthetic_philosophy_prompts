answer: |-
  The bar is quiet, just the clink of ice. Dana swirls her whiskey; Mina nurses a lager. A coaster sits between them, marked with a crude six-sided die.

  "Look," Dana says, tapping the coaster. "Fair die. $A$ is 'even', $B$ is '2'. You agree $P(B|A)$ is one-third?"

  "Obviously," Mina says. "Three evens, one is a two. So the probability of 'If even, then 2' is one-third. The Equation holds."

  "But Lewis showed it can't," Dana says, leaning in. "If 'If $A$ then $B$' expresses a proposition—call it $X$—then it has a truth condition. If the Equation holds for any rational credence function, you get triviality. Let me run it."

  Mina sighs. "I know the proof, Dana."

  "Humor me. Assume $X$ is a proposition. Assume the Equation holds not just for our current credence $P$, but for any updated credence. Now, conditionalize on $B$. If $B$ is true, then $B|A$ is certain. So $P(X|B) = 1$. Conversely, if $\neg B$ is true, $B|A$ is impossible. So $P(X|\neg B) = 0$."

  "Standard stuff."

  "Now apply the Law of Total Probability," Dana continues, tracing a line on the coaster. "$P(X) = P(X|B)P(B) + P(X|\neg B)P(\neg B)$. Plug in the values. $P(X) = 1 \cdot P(B) + 0 \cdot P(\neg B)$. So $P(X) = P(B)$."

  Mina nods slowly. "So the probability of the conditional collapses to the probability of the consequent."

  "Exactly. In our case, $P(\text{If even, then 2})$ becomes $P(2)$, which is one-sixth. But we agreed it's one-third. Contradiction. So, something gives. Either the Equation is wrong, or 'If $A$ then $B$' isn't a proposition $X$."

  "And I choose the latter," Mina says. "Adams was right. Indicatives don't have truth conditions. They have assertibility conditions. The Equation measures assertibility, not truth. Lewis's proof requires $X$ to be in the domain of the probability function as a proposition you can conditionalize on. If it's not a proposition, $P(X|B)$ is undefined. The proof stops dead."

  "But then what are you doing?" Dana presses. "You talk about probability. You make bets. If I offer you a bet on 'If even, then 2', paying out if it's a 2, void if it's odd, you accept at 1-to-2 odds. That looks like a truth-conditional bet where the false antecedent worlds are deleted."

  "It's a called-off bet," Mina corrects. "If $A$ is false, the bet is off, stake returned. Dutch Book arguments show that to avoid sure loss, your betting quotient must match $P(B|A)$. This vindicates the Equation without needing truth values. We're tracking degrees of belief, not metaphysical correspondence."

  "Utility, not truth," Dana says sharply. "But language doesn't stop at simple assertions. What about negation? Suppose I say, 'It is false that if the die is even, it's a 2.' On your view, what am I saying? You can't negate a non-proposition. There's no truth value to flip."

  Mina hesitates, takes a sip. "We treat negated conditionals as having high assertibility when the conditional has low assertibility. If $P(B|A)$ is low, I assert $\neg(A \to B)$."

  "But what's the probability?" Dana demands. "If I ask you, 'What's the probability that it's false that if even then 2?', you should say $2/3$. But if the conditional has no truth value, it can't be false. So you're either speaking nonsense or you're secretly treating it as a proposition when it suits you."

  "It's a shorthand for denying the conditional claim," Mina says. "We don't need a truth-conditional semantics to explain usage. Look at compounds. 'Either the match is cancelled or, if it isn't, it'll be sold out.' People assert this. But if the conditional part lacks truth value, the disjunction should be gibberish."

  "Exactly!" Dana says. "Truth-conditions compose. If 'if' isn't a propositional operator, embedding should crash. Yet we embed them constantly. Your view forces you to say ordinary speech is systematically infelicitous."

  "And your view forces you to say the Equation is wrong," Mina counters. "Which is more costly? Giving up the intuitive link between 'if' and conditional probability, or giving up the idea that every indicative maps to a set of worlds? Lewis himself admitted the Equation is highly intuitive. You're saving truth conditions by sacrificing the data."

  "I'm saving logic," Dana says. "If I deny the Equation holds universally, I can keep propositionality. Maybe we restrict the Equation to 'reasonable' posteriors, or deny conditionalization is the only update rule. There are escape routes that keep 'if' truth-conditional."

  "Escape routes that look like ad hoc patches," Mina says. "Whereas my view explains why the triviality proof fails naturally. It fails because the premise—that conditionals are propositions—is false. You're trying to force indicatives into the mold of material conditionals or Stalnakerian strict conditionals, but neither fits the betting behavior."

  "The betting behavior is the problem!" Dana insists. "A bet you can't be forced to settle isn't a bet on a proposition. It's a contract. You're changing the subject from truth to utility. When I say 'It's not the case that if $A$ then $B$', I'm not just lowering my assertibility. I'm claiming the world is such that the conditional fails. If you deny there's a fact of the matter, you deny there's anything to be right or wrong about."

  "There is a fact of the matter about the relationship between $A$ and $B$," Mina says. "Just not a fact that corresponds to a truth-conditional proposition. Look, if you keep propositionality, you admit $P(\text{If } A, B) = P(B)$. You admit that for our die, the probability is one-sixth. Can you really look me in the eye and say rational credence in 'If even, then 2' should be one-sixth?"

  Dana pauses. She looks at the coaster. "I say rational credence should track truth conditions. If the truth conditions make the Equation fail, so be it. Better a counterintuitive probability than a logic that can't negate itself."

  "And I say better a logic that matches our judgments than a metaphysics that collapses probability," Mina says. "You keep the proposition, you lose the Equation. I keep the Equation, I lose the proposition. The math works either way; it's about what you think language is for."

  "Describing the world," Dana says.

  "Navigating it," Mina replies.

  They sit in silence for a moment, the die on the coaster neither even nor odd, just ink on cardboard.

  "Another round?" Dana asks.

  "If you're buying," Mina says. "But if you're out of cash, then... well, you know the probability."

  Dana smiles. "Don't push it."
