answer: |-
  This is a classic problem in decision theory, and your intuition is actually more sophisticated than pure Expected Utility (EU) maximization. Pure EU would force you to take the Pascal's Mugging deal (if you assign *any* non-zero probability) and the Startup deal (since $100k EV > $200 cost). The fact that you reject those suggests you are implicitly applying constraints that standard EU ignores.

  There isn't one single "law," but there is a unified framework that reconciles almost all your verdicts. I call it the **Principle of Epistemically-Constrained Utility.**

  It relies on three distinct filters that your brain is applying simultaneously:

  1.  **Diminishing Marginal Utility of Money:** You do not value money linearly. $100 million is not 1,000,000 times better than $100. It buys security and freedom, but after a certain point, the extra "utility" per dollar drops off sharply.
  2.  **Linear (or High) Utility of Existence:** You value life, survival, and the avoidance of suffering much more linearly. Saving a billion lives is roughly a billion times better than saving one, or at least the drop-off is much slower than with money.
  3.  **The Epistemic Floor (Credence Constraint):** You heavily discount probabilities that lack a robust causal mechanism or reliable reference class. If a probability estimate relies on a stranger's say-so or a friend's optimism, you treat it as effectively zero. If it relies on physics or actuarial science, you trust it.

  ### How this principle explains your verdicts

  *   **Pascal's Mugging (Bus Stop):** **Reject.**
      *   *Mechanism:* None. (Fails Epistemic Floor).
      *   *Utility:* Even if the stakes are huge, your brain assigns a probability so close to zero (due to lack of mechanism) that it doesn't register.
  *   **Asteroid Deflection:** **Accept.**
      *   *Mechanism:* Physics is robust. (Passes Epistemic Floor).
      *   *Utility:* Saving lives is high-value.
      *   *Cost:* $50 is negligible utility loss for you.
  *   **Startup Investment:** **Reject.**
      *   *Mechanism:* Friend's optimism is biased. (Fails Epistemic Floor; you likely believe the real odds are 1/1,000,000, not 1/10,000).
      *   *Utility:* Even if the odds were true, $100M has diminishing returns. The utility of keeping your $200 (certainty) outweighs the utility of 0.01% chance at "riches."
  *   **Cryonics:** **Lean Yes.**
      *   *Mechanism:* Grounded in biology/cryobiology consensus. (Passes Epistemic Floor).
      *   *Utility:* Centuries of life is a massive, near-linear good.
      *   *Cost:* $100/month is a subscription, not a lump sum loss. It feels like insurance.
  *   **Lottery:** **Reject.**
      *   *Mechanism:* Math is robust. (Passes Epistemic Floor).
      *   *Utility:* Money has diminishing returns. $600M isn't enough extra utility to overcome the near-certainty of losing $1.20.
      *   *EV:* Financially negative (taxes, jackpot splits), unlike the Startup.
  *   **Coin Flip:** **Accept.**
      *   *Mechanism:* Physical symmetry. (Passes Epistemic Floor).
      *   *Utility:* $20 is small enough that your utility for money is roughly linear here.

  ### Resolving the Lottery vs. Cryonics Tension

  You noted this is the hardest pair to hold together. Structurally they look similar (tiny chance, huge payoff), but the principle distinguishes them on **Utility Shape** and **Causal Agency**.

  1.  **Utility Shape:** The Lottery pays in *money*, which you value concavely (logarithmically). Cryonics pays in *time/life*, which you value linearly (or convexly). You are willing to pay a premium for existence that you are not willing to pay for luxury.
  2.  **Agency/Control:** The Lottery is a "black box" randomizer. Cryonics feels like an *intervention*. You are paying to keep an option open (insurance), whereas the lottery is paying for a windfall. Psychologically, we treat insurance (avoiding loss of life) differently than gambling (seeking gain of money), even if the math is similar.

  ### The AI Safety Verdict

  **Prediction: You should donate the $1,000.**

  Here is why, based on your principle:
  *   **Stakes:** Existential (Saving everyone who will ever live). This aligns with the **Linear Utility of Existence** (like Asteroids/Cryonics), not the Diminishing Utility of Money (like Lottery/Startup).
  *   **Cost:** $1,000 is significant, but comparable to a year of Cryonics ($1,200). Since you lean Yes on Cryonics, you should lean Yes here if the probability is comparable.
  *   **Epistemics:** This is the hinge. If you view AI Safety research as "speculative science" (like Cryonics/Asteroids), you pay. If you view it as "philosophical mugging" (like the Bus Stop guy), you don't.
  *   **Resolution:** Given that you accepted the Asteroid case (preventing a low-probability physical catastrophe), consistency demands you accept the AI case (preventing a low-probability informational catastrophe), *provided* you trust the organization's research rigor. Your hesitation likely stems from the Epistemic Floor—the probability feels harder to pin down than an asteroid orbit. If you grant the probability is "small but real" (e.g., 1% rather than 1/googolplex), the math screams **Yes**.

  ### A New Test Case

  To test if you truly hold this principle, consider this case:

  **The Genetic Hail Mary**
  > You have a chronic, non-fatal condition that reduces your quality of life by 20% for the rest of your expected lifespan. A biotech startup offers a gene therapy for **$5,000**. They admit there is only a **0.5% chance** it works permanently. If it fails, nothing happens. If it works, you get 100% quality of life for the next 40 years.
  >
  > **Do you pay the $5,000?**

  **Why this tests your principle:**
  *   **Structure:** It matches Cryonics (paying for life/health improvement) more than Lottery (paying for money).
  *   **Probability:** 0.5% is lower than your Cryonics estimate (1%), but the cost is a lump sum ($5k) rather than a subscription ($100/mo).
  *   **Utility:** This trades Money (diminishing) for Health (linear-ish).
  *   **Prediction:** If your Cryonics verdict was driven by **Linear Utility of Life**, you should take this deal (0.5% of 40 years = 0.2 years or ~73 days of *perfect* health gained in expectation, plus the removal of the 20% penalty). If you reject this, it suggests your Cryonics acceptance was actually driven by the **subscription model** (pain of paying) rather than the utility calculation.

  ### Which Verdict Might Be Wrong?

  If you want to be philosophically consistent, the **Startup Investment** is the verdict most likely to be "wrong" under your own principle, *assuming your friend is being honest about the odds.*

  *   **Why:** You accept the Coin Flip ($20 risk) and Cryonics ($1,200/yr risk). This suggests you aren't purely risk-averse.
  *   **The Conflict:** Rejecting the Startup implies either:
      1.  Your utility for money is *extremely* concave (logarithmic), meaning $100M isn't actually that much better than $0 to you. (This is defensible).
      2.  **OR** you are applying the Epistemic Floor too harshly. If you truly believed the 1/10,000 figure, rejecting a 500x expected return contradicts your willingness to take the Coin Flip.
  *   **Correction:** If you can verify the odds (e.g., via a term sheet and market analysis), a consistent agent with your risk profile should probably **take the startup deal**. It's the one case where the "Epistemic Floor" might be blocking a genuine positive-EV opportunity that fits your risk tolerance in other domains.

  ### Summary for your Seminar
  You are not an Expected Utility Maximizer; you are a **Credence-Weighted Utility Maximizer with Domain-Specific Utility Functions.** You maximize utility, but you (1) discount money heavily at high stakes, (2) value existence linearly, and (3) require causal mechanisms before you trust low probabilities. This is a rational heuristic for the real world, even if it violates von Neumann-Morgenstern axioms in edge cases.
