answer: |-
  ### Unit Assessment: The Gibbard–Satterthwaite Theorem and Strategy-Proofness

  **Instructions:** Select the single best answer for each question. These questions are designed to test your understanding of the theorem's assumptions, definitions, and boundary conditions, not merely your ability to recite its conclusion.

  ***

  **1. The Gibbard–Satterthwaite theorem concludes that every non-dictatorial social choice function is manipulable. However, this impossibility result relies on a specific condition regarding the number of available alternatives ($|A|$). What is the necessary condition for the theorem to hold?**
  A) $|A| \ge 2$
  B) $|A|$ must be an odd number
  C) $|A| \ge 3$
  D) The number of alternatives is irrelevant provided the domain of preferences is unrestricted

  **2. A social choice function is defined as "manipulable" if it is not strategy-proof. Which quantifier structure correctly defines manipulability in the context of the theorem?**
  A) For every preference profile, every voter can benefit by misreporting.
  B) There exists a preference profile and a voter who can benefit by misreporting, holding others fixed.
  C) There exists a preference profile where the outcome changes if any voter misreports.
  D) For every voter, there exists a preference profile where they can benefit by misreporting.

  **3. The theorem assumes the domain of admissible preferences is unrestricted (the set of all strict orderings). What is the consequence if this assumption is relaxed to restrict preferences to be single-peaked over a one-dimensional spectrum?**
  A) The theorem fails; non-dictatorial strategy-proof rules (e.g., the median voter rule) exist.
  B) The theorem still holds; only dictatorial rules remain strategy-proof.
  C) The theorem fails, but only if voters also report cardinal utilities.
  D) The theorem becomes stronger; even probabilistic rules become strictly dictatorial.

  **4. Regarding the information voters must possess and report, what type of preference representation does the standard Gibbard–Satterthwaite theorem assume?**
  A) Cardinal utilities consistent with Von Neumann–Morgenstern expected utility theory.
  B) Cardinal utilities with interpersonal comparability.
  C) Binary approval sets (approval voting).
  D) Ordinal rankings over deterministic outcomes without intensity information.

  **5. The original Gibbard–Satterthwaite theorem (1973/1975) addresses deterministic social choice functions. What did Gibbard (1978) establish regarding probabilistic social choice functions (lotteries over outcomes)?**
  A) Randomization completely escapes the impossibility; many non-dictatorial rules are strategy-proof.
  B) The impossibility extends; only "random dictatorships" are strategy-proof under unrestricted domains.
  C) The impossibility extends, but only if voters are strictly risk-averse.
  D) Probabilistic rules are exempt from strategy-proofness requirements entirely.

  ***

  ### Examiner's Answer Key & Distractor Analysis

  **1. Correct Answer: C**
  *   **A ($|A| \ge 2$):** *The Binary Fallacy.* This distractor catches students who forget that with only two alternatives, majority rule is non-dictatorial and strategy-proof. The theorem requires at least three options to generate the cycling/manipulation opportunities.
  *   **B ($|A|$ odd):** *The Condorcet Confusion.* This catches students conflating the G-S theorem with conditions for Condorcet cycles or majority rule stability, where odd numbers of voters are often discussed to prevent ties.
  *   **D (Irrelevant):** *The Assumption Ignorance.* This catches students who memorize the conclusion ("dictatorship is inevitable") without internalizing the boundary conditions (unrestricted domain *and* $\ge 3$ alternatives).

  **2. Correct Answer: B**
  *   **A (For every... every...):** *The Universal Overgeneralization.* This catches students who think "manipulable" means the system is broken everywhere, rather than vulnerable somewhere. It confuses vulnerability with universal profitability.
  *   **C (Outcome changes):** *The Non-Constancy Confusion.* This catches students who confuse manipulability with non-constancy. An outcome can change due to lying without the liar *benefiting* (which is required for manipulation).
  *   **D (For every voter...):** *The Symmetric Error.* This catches students who assume manipulability must be symmetric; i.e., if one person can manipulate, everyone must have a chance to do so. G-S only requires one vulnerable agent in one scenario.

  **3. Correct Answer: A**
  *   **B (Theorem still holds):** *The Memorizer's Trap.* This catches students who recall the impossibility result but fail to register the "unrestricted domain" assumption. They apply the theorem to contexts (like spatial voting) where it does not apply.
  *   **C (Only if cardinal):** *The Utility Type Confusion.* This catches students who think domain restrictions only matter if combined with cardinal utility reports, confusing social choice with mechanism design with transfers.
  *   **D (Theorem becomes stronger):** *The Probabilistic Conflation.* This catches students mixing up domain restrictions with the probabilistic extension (Gibbard 1978), incorrectly assuming restrictions tighten the impossibility rather than loosen it.

  **4. Correct Answer: D**
  *   **A (Cardinal VNM):** *The Mechanism Design Conflation.* This catches students from the rationalist/AI safety community who are more familiar with Bayesian mechanism design (where cardinal utilities are standard) than classical social choice theory.
