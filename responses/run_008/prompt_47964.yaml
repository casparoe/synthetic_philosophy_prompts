answer: |-
  Here is the debrief you asked for. I've worn my pragmatist hat for this one. Your intuition is correct: your roommate is deploying a "vulgar pragmatism" that would make both Peirce and James wince, though James might wince a little less than Peirce.

  Below is the breakdown. I've started with the textual groundwork, moved to a menu of interpretations, and then dissected the athlete case to find the exact logical slip-up.

  ### 1. Textual Brainstorm & Selection
  Before locking in the argument, I mentally scanned the primary texts to ensure we aren't fighting straw men.

  *   *Peirce, "The Fixation of Belief" (1877):* Distinguishes between the *feeling* of belief (settling doubt) and the *method* of attaining it. Truth is independent of what you or I think.
  *   *Peirce, "How to Make Our Ideas Clear" (1878):* The maxim of pragmatism. Meaning is in practical consequences. **Crucial:** Peirce later renamed his doctrine "Pragmaticism" specifically because people like your roommate misused "Pragmatism."
  *   *James, "Pragmatism" (1907), Lectures VI & VIII:* Where the "truth is what works" slogan originates. James says truth *happens* to an idea. It becomes true, is made true by events.
  *   *James, "The Meaning of Truth" (1909):* A direct response to critics who accused him of saying "whatever is pleasant to believe is true." He clarifies that "working" means leading us through experience without contradiction.

  **Committed Reading List for your counter-argument:**
  1.  **C.S. Peirce,** *"How to Make Our Ideas Clear"* (specifically the distinction between clarity and truth).
  2.  **William James,** *"Pragmatism,"* Lecture VI ("The Pragmatic Conception of Truth").
  3.  **Susan Haack,** *"Pragmatism"* (from the Routledge Encyclopedia of Philosophy) – for a clean secondary summary of the distinction.

  ---

  ### 2. The Menu: What "Truth is What Works" Could Mean
  The phrase is an equivocation. It slides between six distinct claims. Here is how they stack up regarding your roommate's argument.

  | Claim | Definition | Peirce? | James? | Plausibility |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Psychological Comfort** | A belief is true if it makes me feel confident or happy. | **No.** (This is the "method of tenacity," which he rejects). | **No.** (He distinguishes "expedient" from "pleasant"). | **False.** (Confusion of truth with comfort). |
  | **2. Immediate Utility** | A belief is true if it helps me succeed right now. | **No.** (Truth is about the long run). | **Qualified.** (Only if it doesn't clash with future experience). | **Equivocation.** (Useful $\neq$ True). |
  | **3. Instrumental Reliability** | A belief is true if it reliably predicts future experiences. | **Yes.** (This is close to his view on verification). | **Yes.** (Truth is a process of verification). | **Plausible.** (Standard scientific view). |
  | **4. Long-Run Consensus** | Truth is what the community of inquirers would agree on eventually. | **Yes.** (This is his definitive definition). | **Maybe.** (James is more individualistic). | **Plausible.** (Social epistemology). |
  | **5. Radical Constructivism** | Truth is *created* by the act of believing it successfully. | **No.** (Reality is independent). | **Yes, with caveats.** ("Truth happens to an idea"). | **Radical.** (Risky without constraints). |
  | **6. Semantic Deflation** | "Truth" just means "useful to say." | **No.** | **No.** (Both think truth tracks reality). | **Platitude.** (Changes the subject). |

  **The Verdict on the Menu:** Your roommate is arguing for **Claim #1** or **Claim #2** (Immediate Utility/Psychological Comfort) but citing the authority of Peirce and James, who argue for **Claim #3**, **#4**, or a nuanced version of **#5**.

  ---

  ### 3. The Athlete Case: Can a False Belief "Work"?
  Now, let's apply this to the athlete.
  *   **Proposition (P):** "I am the fastest guy in the league."
  *   **Reality (R):** He is currently the 5th fastest.
  *   **Effect (E):** Believing (P) increases confidence, leading to a personal best time.

  **Your Roommate's Argument:**
  1.  Pragmatism says truth is what works.
  2.  Believing (P) worked (improved performance).
  3.  Therefore, (P) is true.

  **The Pragmatist Rebuttal:**
  This fails on three specific fronts, depending on which pragmatist you invoke.

  #### A. The Peircean Objection (The Long Run)
  Peirce defines truth as the opinion fated to be agreed upon by all who investigate *in the long run*.
  *   **Analysis:** If we time every runner in the league objectively (the method of science), the community will converge on the fact that he is 5th fastest.
  *   **Verdict:** The belief fails the "long run" test. It works *psychologically* in the short term, but it contradicts the ultimate physical reality. Peirce would say the belief is **false**, even if it is **useful**. Peirce explicitly separates the *settling of belief* (psychological) from the *truth of belief* (external).

  #### B. The Jamesian Objection (Agreement with Reality)
  James is the one your roommate is likely misquoting. James *does* say: *"The true is the name of whatever proves itself to be good in the way of belief."*
  *   **Analysis:** However, James immediately qualifies this. He says a true idea must agree with reality *and* be expedient. In *The Meaning of Truth*, he writes that new truths must marry with "old truths" (established facts).
  *   **Verdict:** If the established fact (old truth) is that another runner has a faster recorded time, the athlete's belief contradicts the "stock of old truths." For James, a belief that contradicts verified reality cannot be "true" just because it feels good.
  *   **Nuance:** James *would* allow that if the belief motivates him to train harder and he *becomes* the fastest next season, the belief *becomes* true. But it was not true *at the moment he held it falsely*. Truth can be made, but not retroactively.

  #### C. The Category Error (Performance vs. Ranking)
  This is the strongest logical objection.
  *   **The Content:** The belief is not "I will run fast." The belief is "I am the fastest."
  *   **The Work:** The belief caused him to run *faster*. It did not necessarily cause him to run *fastest* (others might improve too).
  *   **The Sleight of Hand:** Your roommate is conflating the **causal efficacy** of the belief with the **truth conditions** of the proposition.
      *   *Causal Efficacy:* Did believing X cause good result Y? (Yes).
      *   *Truth Condition:* Does X correspond to the state of the world? (No).
      *   Pragmatism links the two, but it does not erase the distinction. A lie can be useful. That doesn't make it a truth; it makes it a *useful lie*.

  ---

  ### 4. Where the Sleight of Hand Is (For Breakfast Tomorrow)
  Your roommate performed a classic philosophical bait-and-switch. Here is exactly where he cheated, articulated for your morning debate:

  **1. He conflated "Warranted Assertibility" with "Truth."**
  John Dewey (another pragmatist) preferred the term "warranted assertibility." It is *warranted* for the athlete to assert "I am the fastest" if it helps him win. But that doesn't make the proposition *true* in the factual sense. Your roommate took a rule about **when we are allowed to believe** and turned it into a definition of **what is real**.

  **2. He ignored the "Cash Value" of the specific terms.**
  Peirce's maxim asks: *What practical difference would it make if this belief were true vs. false?*
  *   If the belief is true: He is the fastest.
  *   If the belief is false (but he thinks it's true): He runs fast.
  *   **The Test:** Put him in a race against the actual fastest guy. If he loses, the "practical consequence" of the truth is revealed. The belief only "worked" in a vacuum. Pragmatism requires the belief to work *in engagement with reality*, not just in the believer's head.

  **3. He committed the "Beneficial Consequence Fallacy."**
  Just because $P \rightarrow Q$ (Belief leads to Success) does not mean $P$ is True.
  *   *Example:* A soldier who falsely believes he is invincible may fight bravely and survive. His belief "worked." But he is not invincible. If he steps on a landmine, reality corrects the ledger. Pragmatism accounts for the landmine; your roommate does not.

  ### Summary Script for You
  *"You're using a 1907 slogan to defend a 2024 misunderstanding. Peirce actually changed the name of his philosophy to 'Pragmaticism' because people like you were using 'Pragmatism' to say 'whatever feels good is true.' James was clearer: truth has to agree with reality, not just produce a win. Your athlete's belief is instrumentally rational, but epistemically false. Pragmatism doesn't delete the world; it just says we access the world through action. If the action eventually hits a wall (like racing the actual fastest guy), the belief dies. That's the pragmatism you missed."*

  You won the argument on the philosophy; he just refused to elaborate because he knew he was running on slogans.
