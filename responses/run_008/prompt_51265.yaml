answer: |-
  **WORKING DRAFT: ADVERSARIAL COLLABORATION OUTCOMES (MODALITY & REFERENCE)**
  **To:** Department Faculty
  **From:** [Your Name], Notetaker
  **Date:** October 26, 2023
  **Subject:** Joint Statement on Rigid Designation and the Necessary A Posteriori

  Per the agreement reached in last week's session, the following document outlines the current state of play between the Kripkean position (henceforth **Position K**) and the Two-Dimensionalist position (henceforth **Position 2D**). This is not a resolution, but a mapping of the battlefield. We have avoided the word "semantic" unless specifying truth-conditions or reference-fixing mechanisms, per standing order.

  ### 1. Shared Claims
  *Both parties sign off on the following propositions. These are not merely methodological agreements but substantive claims about the data.*

  1.  **Failure of Simple Descriptivism:** The modal argument holds: simple descriptivism (the view that the meaning of a name is equivalent to a cluster of descriptions) is false. It is true in some possible worlds that Aristotle did not teach Alexander, even if "the teacher of Alexander" is the description speakers associate with "Aristotle." Therefore, names do not function as disguised descriptions in modal contexts.
  2.  **Empirical Discovery of Identities:** The truth of identity statements like "Hesperus is Phosphorus" or "Water is H2O" was not knowable by armchair reflection alone. It required empirical investigation. Both sides agree that prior to the investigation, it was epistemically rational to doubt these identities.
  3.  **Rigidity in Counterfactual Evaluation:** When evaluating counterfactuals (e.g., "If Nixon had lost the election..."), the name "Nixon" picks out the same individual in the counterfactual scenario as in the actual world. Both sides agree that standard natural language usage treats proper names as rigid *in the context of modal evaluation*.
  4.  **Distinction of Modalities:** There is a coherent distinction between *epistemic possibility* (consistent with what is known) and *metaphysical possibility* (consistent with the nature of things). Both sides agree that "Hesperus might not be Phosphorus" is true under the epistemic reading but false under the metaphysical reading (given that they are identical).
  5.  **Causal-Historical Influence:** Causal-historical chains play a significant role in how reference is transmitted through a linguistic community. Neither side claims that reference is fixed solely by an individual speaker's internal state at the moment of utterance.

  ### 2. Disagreements Table
  *Each row represents a point of contention. The phrasing in the "Claim" column is formulated such that the proponent of that view would accept it as an accurate statement of their position.*

  | Issue | Position K Claim (Kripkean) | Position 2D Claim (Two-Dimensionalist) |
  | :--- | :--- | :--- |
  | **Nature of Rigidity** | Rigidity is a **semantic property of the term itself**. A name refers to the same object in all possible worlds where that object exists, independent of how the reference was fixed. | Rigidity is a **feature of the secondary intension**. It reflects how we evaluate terms *after* reference is fixed in the actual world, not an intrinsic property of the name prior to that fixing. |
  | **Necessary A Posteriori** | The category of the necessary a posteriori is **metaphysically robust**. It reveals that the world's structure contains necessary connections (e.g., between water and H2O) that are not conceptual truths. | The necessary a posteriori is an **artifact of diagonalization**. It arises from conflating the proposition expressed (secondary intension) with the way that proposition is grasped (primary intension). It holds no metaphysical mystery. |
  | **Reference Fixing** | Descriptions may *fix the reference* causally, but they do not give the *meaning*. Once fixed, the name is detached from the description. | The "reference-fixing description" constitutes the **primary intension**. It determines the reference in the actual world and captures the cognitive significance of the term for the speaker. |
  | **Conceivability** | Conceivability is a fallible guide to metaphysical possibility. We can conceive of water not being H2O, but this only shows we can conceive of *watery stuff* not being H2O. | Conceivability tracks **primary intension possibility**. If we can conceive it without contradiction, it is possible in the relevant sense for analyzing meaning and rationality. |

  ### 3. The Cruxes
  *These are the specific philosophical pivots where the disagreement turns. Resolving these would likely collapse one position into the other.*

  **Crux A: The Evidence of Conceivability**
  *   **The Issue:** Does the fact that we can coherently imagine Hesperus not being Phosphorus provide evidence for a genuine possibility, or is it purely a fact about our concepts?
  *   **Position K:** It is purely about our concepts (modes of presentation). It provides zero evidence for metaphysical possibility.
  *   **Position 2D:** It provides evidence for *epistemic* possibility, which is the only notion of "possibility" relevant to understanding the cognitive content of the statement.

  **Crux B: Novelty of the Necessary A Posteriori**
  *   **The Issue:** Is the discovery that "Water = H2O is necessary" a substantive metaphysical discovery, or a trivial consequence of how we define "necessity" relative to actuality?
  *   **Position K:** It is substantive. It tells us about the essence of natural kinds.
  *   **Position 2D:** It is mechanical. Once you stipulate that "water" rigidly designates whatever actually plays the water role, "Water = Actual Water" becomes trivially necessary. The "mystique" is unwarranted.

  **Crux C: The Locus of Necessity**
  *   **The Issue:** Is the necessity located in the objects (metaphysics) or in the linguistic framework (semantics/epistemology)?
  *   **Position K:** In the objects/essences.
  *   **Position 2D:** In the framework of evaluation (specifically, holding the actual world fixed).

  ### 4. Test Cases and Falsifiable Predictions
  *To move beyond intuition-pumping, both sides commit to the following predictions regarding a specific scenario.*

  **Test Case: The M-Star / E-Star Error**
  *Scenario:* A community of astronomers observes a bright object in the morning and a bright object in the evening. Due to a systematic measurement error persisting for 50 years, they theorize these are two distinct bodies. They stipulate two rigid names: **M-star** (for the morning body) and **E-star** (for the evening body). They publish orbital calculations for each. Eventually, the error is discovered: M-star and E-star are the same physical object (Venus).

  **Question:** What is the status of the sentence "M-star is E-star" *before* and *after* the discovery?

  | Prediction Point | Position K Commitment | Position 2D Commitment |
  | :--- | :--- | :--- |
  | **Pre-Discovery Status** | Before discovery, the sentence "M-star is E-star" was **false** (if they meant identity) or **unknown**. The names rigidly designated Venus all along, unbeknownst to the speakers. | Before discovery, the sentence was **epistemically contingent**. The primary intensions (Morning Object vs. Evening Object) picked out different candidates in epistemically possible worlds. |
  | **Post-Discovery Modality** | After discovery, "M-star is E-star" is **necessary**. The identity holds in all possible worlds where Venus exists. The error was about the world, not the names. | After discovery, "M-star is E-star" is **2-necessary** (metaphysically necessary given actual reference) but remains **1-contingent** (it could have turned out otherwise). |
  | **A Priori Knowledge** | **Prediction:** The community never knew anything a priori about the identity. Any claim to the contrary is confusion about descriptions. | **Prediction:** The community knew a priori that "The Morning Object is the Evening Object" was contingent. This conceptual knowledge remains valid even after the empirical correction. |
  | **Falsification Condition** | **K is wrong if:** Post-discovery, competent speakers intuitively feel they can still ask, "But could M-star have turned out to be distinct from E-star?" and this intuition is judged coherent, not confused. | **2D is wrong if:** Post-discovery, the cognitive significance of "M-star" and "E-star" becomes fully identical, such that no rational agent could treat them as distinct modes of presentation. |

  ### 5. Verbal Dispute Check
  *We investigated whether the disagreement is merely verbal. The conclusion is: Partially, but not trivially.*

  **The Verbal Component:**
  There is a verbal divergence on the unqualified use of the word **"Possible."**
  *   When **Position K** says "It is not possible that Hesperus ≠ Phosphorus," they mean *Metaphysically Possible* (secondary intension).
  *   When **Position 2D** says "It is possible that Hesperus ≠ Phosphorus," they mean *Epistemically Possible* (primary intension).

  **Why This Is Not a Full "Cop-Out":**
  Stipulating a shared definition (e.g., "Let us only talk about Metaphysical Possibility") does not dissolve the disagreement. It merely silences one side.
  *   **Position K** argues that Metaphysical Possibility is the *philosophically important* one for ontology.
  *   **Position 2D** argues that Epistemic Possibility is the *philosophically important* one for mind and meaning.

  Therefore, while we agree on the truth conditions of sentences under specific stipulations, we disagree on **which modal profile explains the phenomenon of human reasoning.** Position K claims the metaphysical profile explains reference. Position 2D claims the epistemic profile explains cognitive significance. This is a substantive disagreement about explanatory priority, not merely a dictionary dispute.

  ***

  **Next Steps:**
  Both parties agree to run the M-Star/E-Star thought experiment with a naive subject pool (n=50) to test the "Falsification Conditions" listed in Section 4. Results to be reviewed at the next colloquium.
