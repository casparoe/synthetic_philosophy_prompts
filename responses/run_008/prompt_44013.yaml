  You have stumbled onto the exact tension that defines the modern Non-Identity Problem literature. Your intuitions are actually more consistent than you fear, but they require a **hybrid principle** rather than a single monolithic one. You are implicitly rejecting both pure Person-Affecting Views (which fail Depletion) and pure Impersonal Views (which fail the "No Duty to Procreate" constraint).

  Here is the principle that best captures your verdicts, the mapping of your cases, and the honest assessment of its costs.

  ### The Principle: Hybrid Quality-Threshold
  **"An act is morally wrong if it brings about an outcome that is worse in terms of well-being than an available alternative, *unless* the only alternative is non-existence and the resulting life is above a threshold of severe suffering."**

  This principle combines two distinct moral clauses:
  1.  **The Same-Number Quality Claim (Impersonal):** When the same number of people will exist in either outcome, it is wrong to choose the outcome where those people are worse off.
  2.  **The Existence Threshold (Person-Affecting):** When the choice is between creating a person and creating no one, it is only wrong if that person's life falls below a threshold of dignity/suffering (i.e., a "wrongful life").

  ### Mapping Your Cases
  *   **Case 1 (Depletion - Severe):** Motivated by **Clause 1**. Same number of people (future generations) exist in both the depletion and conservation scenarios. They are worse off in the depletion scenario. **Verdict: Wrong.**
  *   **Case 2 (Teratogen - Waitable):** Motivated by **Clause 1**. One child exists either way (wait or don't wait). The "wait" child is better off. **Verdict: Wrong.**
  *   **Case 3 (Teratogen - Unwaitable Mild):** Motivated by **Clause 2**. Alternative is non-existence. Life is above the suffering threshold (manageable disability). **Verdict: Not Wrong.**
  *   **Case 4 (Teratogen - Unwaitable Severe):** Motivated by **Clause 2**. Alternative is non-existence. Life is below the suffering threshold (constant pain). **Verdict: Wrong.**
  *   **Case 5 (Embryo Selection):** Motivated by **Clause 1**. Same number (one child). One outcome is worse (mild condition). This explains why "something's off" even if no victim is harmed. **Verdict: Wrong (but low severity).**
  *   **Case 6 (Depletion - Mild):** Motivated by **Clause 1**. Same number. Outcome is worse (clearly worse than possible), even if absolute levels are high. **Verdict: Wrong.**

  ### The Honest Assessment: Which Verdicts Can't Be Saved?
  I can construct this principle to accommodate all six of your verdicts technically, but there is a theoretical cost. The tension lies in **Case 6**.

  To save Case 6 ("Still wrong" even if future people are "doing great"), you must accept that "wrongness" does not require a "victim who is harmed." You have already accepted this ("if wrongness has to have a victim, I lose this verdict"). However, the cost is that you must accept the **moral relevance of identity**. You have to agree that it matters *who* exists, not just *how many* or *how happy*.

  If you demand a principle that explains *why* identity matters without being ad hoc, you might have to overturn **Case 6**. Many philosophers argue that if future people are "doing great," calling the act "wrong" is too strong; it is merely "regrettable" or "suboptimal." Softening Case 6 protects you from the slide toward a demanding Impersonal Utilitarianism that might eventually violate your "No Duty to Procreate" constraint.

  However, since you explicitly stated Depletion (1) is the "clearest wrong" and Case 6 is a scalar version of that, dropping 6 creates a Sorites paradox. Therefore, the Hybrid Principle *can* save all six, provided you accept the dual-nature of wrongness (impersonal vs. personal).

  **Number of verdicts the principle cannot save:** 0 (It accommodates all six, provided you accept the hybrid structure).

  ### Verdicts on Your New Cases

  **1. Mandatory National Screening Program**
  *   **Scenario:** Prevents conception of those with serious conditions; different people born instead. No one born is worse off.
  *   **Principle Application:** This is a **Same-Number** choice (roughly). The outcome with screening has less suffering than the outcome without. Clause 1 applies.
  *   **Verdict:** **Permissible (and likely Required).** Unlike the Depletion case, this *improves* the outcome compared to the alternative. It does not violate the Threshold (no one is created below it) and it satisfies the Quality Claim (less suffering is better).

  **2. Space-Colony Founder**
  *   **Scenario:** Founder designs colony so 2nd generation will be harsh pioneers (worse lives than her generation), but lives only exist because of the decision.
  *   **Principle Application:** This depends on the alternative.
      *   *If the alternative is No Colony (No Children):* Clause 2 applies. If the pioneer lives are above the suffering threshold, it is **Not Wrong**.
      *   *If the alternative is a Better Colony (Same Children, Better Lives):* Clause 1 applies. If she *could* have designed it better but chose not to, it is **Wrong**.
      *   *Given your phrasing ("knowingly designs... so"):* This implies she had a choice in the design.
  *   **Verdict:** **Wrong.** This is structurally identical to Case 1 (Depletion). She is choosing an outcome where the specific people who exist are worse off than they could have been in a different design, for the sake of her own goals.

