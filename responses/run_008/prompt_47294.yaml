answer: |-
  The 2011 publication of Daryl Bem's "Feeling the Future" in the *Journal of Personality and Social Psychology* serves as the canonical stress test for modern statistical inference in psychology. On the surface, the episode appears to be a straightforward victory for Bayesian methods over frequentist null hypothesis significance testing (NHST). Bem reported nine experiments where standard $p$-values indicated statistically significant retroactive influence on cognition. Shortly thereafter, Wagenmakers and colleagues reanalyzed the data using default Bayes factors (BF), concluding the evidence was merely anecdotal. However, a deeper excavation reveals that the frequentist–Bayesian dispute illuminates specific mathematical divergences while remaining silent on the sociological and procedural pathologies that actually drove the replication crisis. To understand the episode, one must distinguish between what the frameworks say about the *data* versus what they say about the *process* that generated the data.

  The divergence between Bem's significant $p$-values and Wagenmakers' weak Bayes factors is a textbook instance of Lindley's Paradox. A $p$-value quantifies the probability of observing data as extreme as, or more extreme than, the actual result, assuming the null hypothesis ($H_0$) is true. It is a measure of incompatibility with $H_0$, not evidence for $H_1$. In large samples, even trivial deviations from the null can yield $p < .05$. Conversely, a Bayes factor compares the predictive performance of two models: the null ($H_0$) and the alternative ($H_1$). Crucially, $H_1$ in a Bayesian analysis is not a point estimate but a distribution of effect sizes weighted by a prior. Wagenmakers et al. employed a default Cauchy prior, which assigned non-negligible probability to large effect sizes. Because Bem's observed effects were small, they were poorly predicted by this wide $H_1$ distribution; the data were unlikely under $H_0$, but even *more* unlikely under the specific $H_1$ specified by Wagenmakers. Thus, the BF favored $H_0$ or remained ambiguous. Bem's rebuttal, utilizing a Bayesian meta-analysis with informative priors based on typical effect sizes in social psychology, yielded high posterior odds for the effect. This highlights that the Bayesian verdict is sensitive to the prior specification. The dispute also hinged on evidential versus error-rate goals. Frequentism controls long-run Type I error rates, assuming a fixed sampling plan. Bayesian inference adheres to the Stopping Rule Principle, suggesting evidence depends only on the observed data, not the intention to stop. However, this theoretical immunity assumes the model is correct and the data are not cherry-picked. When Bem's team engaged in flexible analysis practices—what Simmons et al. (2011) termed "researcher degrees of freedom"—they inflated the false positive rate for *both* frameworks. A $p$-value calculated after trying ten different covariates is invalid; a Bayes factor calculated on the same cherry-picked subset is equally misleading, though the mathematical mechanism of the inflation differs.

  Consequently, the frequentist–Bayesian dispute fails to explain the core mechanisms of the crisis, specifically the incentives and procedural laxity that allowed Bem's results to publish. The statistical frameworks treat the data as given, but the crisis was driven by how the data were produced. The "researcher degrees of freedom" critique is orthogonal to the choice of inference; it is a critique of the scientific process. Whether one uses $p$-values or BFs, if the analysis plan is flexible and unreported, the resulting statistic loses its interpretability. Furthermore, the episode dismantles the slogan that "Bayesian methods guard against false positives." Bem's successful Bayesian rebuttal demonstrates that if a researcher selects priors that favor the hypothesis (e.g., assuming precognition effects should resemble standard priming effects), the posterior will favor the hypothesis. Bayesian methods do not automatically enforce skepticism; they merely formalize it through the prior. The true skepticism required for precognition claims comes not from the math, but from the prior probability assigned to the hypothesis itself based on theoretical plausibility. A statistician might use a default prior, but a physicist would assign a prior near zero to a hypothesis violating causality. The statistical frameworks themselves are silent on how to set priors based on extra-statistical theory, leaving the door open for "subjective" Bayesians to argue for anomalous effects just as "objective" frequentists did.

  This leads to the role of pre-registration, which emerged as the primary methodological reform following this period. Pre-registration is neither strictly frequentist nor Bayesian; it is a governance mechanism that secures the assumptions required for both. For the frequentist, pre-registration fixes the sampling plan and analysis pipeline, preserving the validity of the error-rate guarantees. For the Bayesian, it prevents the "gaming" of the likelihood function by ensuring the data were not selected to maximize the Bayes factor. The replication crisis was not solved by switching from $p$-values to Bayes factors, as evidenced by the fact that Bem could generate Bayesian support for precognition. It was addressed by constraining the researcher's ability to manipulate the connection between theory and data. Therefore, viewing the Bem affair solely through the lens of the statistical paradigm war is a category error. The failure was not that $p$-values are incoherent, but that the institutional incentives rewarded novel, significant findings regardless of the statistical framework used to generate them. The lesson is that no inferential engine can correct for a broken scientific process; the solution lies not in the calculus of inference, but in the transparency of the procedure.

