  # Diagnostic Instrument: The Architecture of Bad Conscience

  **Root Commitment:** We agree that "bad conscience" performs moral work (deterring harm, repairing bonds). The question is *how* it works, *which* form works best, and whether we can *choose* it.

  **Instructions:** Answer the following branch questions based on your intuitions about the cases provided. Do not worry about technical labels (e.g., "guilt," "shame"); describe the mechanism as you see it.

  ### Branch 1: The Ontology Check
  **Case 0 (The Introspection):** When you examine moral pain, do you find two distinct psychological gears turning (one driven by *rules/deeds*, one driven by *identity/others*), or just one gear described with different words depending on context?
  *   **One Gear:** Go to **Leaf 1**.
  *   **Two Gears:** Go to **Branch 2**.

  ### Branch 2: The Secret Violation (Mechanism)
  **Case 1:** Someone breaks a promise in a way no one will ever discover and feels terrible for weeks. If all trace of the act were erased from every other mind (no gods, no cameras, no rumors), would the bad feeling vanish?
  *   **Yes (Vanishes):** The feeling depends on a witness (actual or imagined). Go to **Branch 3**.
  *   **No (Remains):** The feeling is an internal sanction or self-verdict. Go to **Branch 4**.

  ### Branch 3: The Corrosive Episode (Audience Path)
  **Case 2:** A person spirals after snapping at a friend. For those who said the feeling depends on a witness: Is the problem that the person relies on *any* audience to judge them, or that the audience is *hostile/unforgiving*?
  *   **Reliance is the problem:** Relying on external judgment is immature. Go to **Leaf 2**.
  *   **Hostility is the problem:** The feeling is useful, but the social response is broken. Go to **Branch 5**.

  ### Branch 4: The Corrosive Episode (Internal Path)
  **Case 2 (Revisited):** For those who said the feeling remains without witnesses: When the feeling spirals, is the damage caused *because* it targets the *whole self* ("I am bad") rather than the *act* ("I did bad")?
  *   **Yes (Self-Target is Toxic):** Focusing on identity is the pathology. Go to **Leaf 3**.
  *   **No (Self-Target is Identity):** Focusing on identity is necessary for ethical character; the toxicity lies elsewhere. Go to **Branch 6**.

  ### Branch 5: The Sentencing Conference (Repair Path)
  **Case 3:** A community convenes to confront an offender and ritually readmit her. Does this practice work by changing the *inner emotion felt* or by changing the *social consequence* of the emotion?
  *   **Changing Inner Emotion:** We can engineer the feeling itself. Go to **Leaf 4**.
  *   **Changing Social Consequence:** We manage the feeling by managing the reintegration. Go to **Leaf 5**.

  ### Branch 6: The Scale & Choice (Identity Path)
  **Case 4 (New):** If a community grows from a village of 100 to a city of 10 million, must the "gear" that turns in Branch 1 be replaced? And can a culture teach itself to feel differently, or is the feeling a fixed response to identity?
  *   **Must be Replaced (Scale Determined):** Social scale settles which emotion carries the load. Go to **Leaf 6**.
  *   **Fixed Response (Identity Bound):** The feeling is bound to ethical identity, not scale, and cannot be arbitrarily redesigned. Go to **Leaf 7**.
  *   **Malleable Tool (Constructible):** Cultures can and should consciously redesign these responses. Go to **Leaf 4** (Constructivist).

  ---

  ### The Leaves (Positions)

  *   **Leaf 1: The Dichotomy Skeptic.** (Position *g*). The distinction between guilt and shame is an ethnocentric artifact; there is only moral pain.
      *   *Unoccupied Note:* The combination of "One Gear" + "Scale Determined" is logically possible (monistic determinism) but rarely defended in this literature.
  *   **Leaf 2: The Maturationist.** (Position *a*). Classic Anthropological view. Shame is external/audience-dependent; the turn to internal sanction (guilt) is a maturation to be completed.
  *   **Leaf 3: The Psychologist.** (Position *b*). Tangney's view. The act-focused/self-focused distinction does the work; self-focused pain is maladaptive regardless of audience.
  *   **Leaf 4: The Engineer.** (Position *f*). Constructivist Policy view. Cultures can and should consciously redesign their moral emotions (reachable from Audience or Internal paths).
  *   **Leaf 5: The Reintegrator.** (Position *c*). Braithwaite's view. Stigmatizing shame is the disease; re-integrative shame (managing consequences) is the cure.
  *   **Leaf 6: The Structuralist.** (Position *e*). Social scale, not choice, settles which emotion carries the load; the normative question is ill-posed.
  *   **Leaf 7: The Ethicist.** (Position *d*). Williams-style defense. Shame is compatible with agency and self-respect; it is bound to ethical identity, not merely audience or scale.

  ---

  ### Epistemic Notes & Diagnostic Limitations

  **1. Indistinguishable Leaves:**
  Branch 5 and Branch 6 cannot genuinely separate **Leaf 4 (Constructivist)** from **Leaf 5 (Reintegrator)** in all cases. A Braithwaitean might argue that changing social consequences *is* the only way to change inner emotion, effectively collapsing the distinction. The tree assumes a strong Constructivist believes we can change the *phenomenology* directly, whereas Braithwaite believes we change the *context*. In a classroom discussion, students may find these positions adjacent rather than distinct.

  **2. Confidence Ratings (Leaf Prediction):**
  *   **Leaf 1 (Skeptic):** High confidence. If a student rejects the dichotomy, they will answer Branch 1 accordingly.
  *   **Leaf 2 (Maturationist):** High confidence. This view relies heavily on the "witness" dependency.
  *   **Leaf 3 (Psychologist):** Medium-High confidence. Tangney's distinction is specific; students may conflate "self-target" with "witness."
  *   **Leaf 4 (Engineer):** Medium confidence. Constructivism is often a meta-view; students may hold it alongside other leaves rather than as a terminal position.
  *   **Leaf 5 (Reintegrator):** High confidence. Braithwaite's focus on *procedure* vs. *feeling* is distinct.
  *   **Leaf 6 (Structuralist):** High confidence. The scale question is a strong discriminator.
  *   **Leaf 7 (Ethicist):** Medium confidence. Williams' view is subtle; students may confuse "ethical identity" with "self-target toxicity" (Leaf 3).

  **3. Weakest Branch Question:**
  **Branch 4 (Internal Path Toxicity)** is the least secure discriminator. It attempts to separate **Leaf 3 (Tangney)** from **Leaf 7 (Williams)**. Both agree the feeling targets the self. Tangney says this is inherently pathological; Williams says it is inherently ethical. A student might answer "Yes, it targets the self" (agreeing with the description) but be unsure if that *causes* the damage or *constitutes* the value. The question asks for a causal judgment ("is the damage caused because...") which requires a level of theoretical commitment undergraduates may not yet have.

  **4. Contestable Attribution:**
  **Leaf 7 (Williams)** is the most contestable attribution in this tree. Attributing to Williams the view that shame is "bound to ethical identity" and "not arbitrarily redesigned" simplifies his nuanced defense of shame in *Shame and Necessity*. Williams might resist the "Fixed Response" framing of Branch 6, arguing instead that shame is a *response to value* which changes as values change, not a fixed psychological gear. The tree forces a "Fixed vs. Malleable" choice that may misrepresent the Williams position as more rigid than intended.
