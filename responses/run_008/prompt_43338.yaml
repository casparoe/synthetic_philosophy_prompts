      *   *Refinement:* Frame it as "Crypto-Normativism" or "Subjectivism" rather than Vitalism, OR explain the Vitalism analogy carefully (i.e., positing a non-natural property "health" that can't be measured).
      *   *Better Angle:* Normativism makes medicine impossible as a science. If disease is just "bad," then a priest and a doctor have the same authority. Naturalism preserves the physician's epistemic authority.

  5.  **Address the Essay Direction (Defense vs. Confession):**
