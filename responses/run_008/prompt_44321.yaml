      *   *Claim 2 (Prove Safe):* This is the "Reverse Burden of Proof." Defenders accept this but usually qualify "safe" as "reasonable certainty of no harm" or meeting specific safety thresholds, not absolute metaphysical safety.
      *   *Claim 3 (Nothing Proven Safe):* Philosophically true (Hume), but practically false. Regulatory standards exist.
