          3.  For each reading: Plausibility, Platitude status, Does it support dismissing base-rates?
          4.  Honesty check: Does the slogan do less work than people think?
          5.  Format: A menu for structuring a section of the piece.

  2.  **Brainstorming & Deconstruction:**
      *   The phrase "Past performance is no guarantee of future results" is ubiquitous in finance. In philosophy/epistemology, it touches on the Problem of Induction.
      *   *Claim 1: Logical/Deductive.* Strictly speaking, $P$ (past) does not logically entail $Q$ (future). This is Hume. It's true but trivial. It kills *all* prediction, not just base rates.
      *   *Claim 2: Nonstationarity.* The underlying system changes. Empires aren't coins; the coin gets minted differently each time. Structural breaks.
      *   *Claim 3: Reference Class.* Which past? Rome? Britain? Ming? If you pick the wrong class, the base rate is garbage.
      *   *Claim 4: Mechanism vs. Correlation.* Base rates show *that* things happened, not *why*. If the mechanism changes, the rate is irrelevant.
      *   *Claim 5: Singularities/Black Swans.* Nuclear weapons, AI, climate change make this time fundamentally different.
      *   *Evaluation:* The historian used it to dismiss base rates specifically. If he meant Claim 1, he's being too skeptical (kills his own historical analysis). If he meant Claim 2 or 5, he has a substantive point. If he meant Claim 3, he's critiquing the *application* of base rates, not the method itself.
      *   *The "Gotcha":* The slogan is often used to stop thinking, not start it. It's a conversation-ender that masquerades as wisdom.

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the journalist's instinct. It *is* buggy. Set the tone (collegial, precise, no jargon without explanation).
