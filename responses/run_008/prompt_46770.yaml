answer: |-
  **Brainstorming**
  The "hill slant" case is the easiest to dismiss under the new criterion because physical fitness is not evidence about the geometry of the hill; it is information about the *observer's* capacity. The visual system shouldn't treat fatigue as data about distal slant. The "visual search" case is about attentional weighting, which arguably happens pre-perceptually or during selection, not necessarily altering the content of the percept itself. The "memory color" (banana) case is the strongest candidate. Color constancy is fundamentally about inferring distal surface properties despite proximal ambiguity. If semantic knowledge ("bananas are yellow") acts as a prior in this inference engine, and updates when prediction error occurs (e.g., after exposure to blue bananas), it fits the "evidence about the distal stimulus" criterion perfectly. I will focus the essay on contrasting the hill and banana cases to demonstrate the criterion's utility.

  ***

  **Essay**

  The debate over cognitive penetration has reached a frustrating stalemate. Proponents argue that beliefs and desires visibly shape perception, citing findings where hills look steeper to the fatigued or gray patches look yellow on banana outlines. Deflationary critics, most notably Firestone and Scholl, counter that these effects vanish when response biases are controlled; the subject is not seeing differently, but judging differently. Both sides typically fight over anatomy, asking whether an effect resides in "early" versus "late" vision. This is a category mistake. The question is not where the effect occurs in the brain, but what functional role the top-down influence plays. To resolve this, we must adopt a stricter criterion: genuine cognitive penetration occurs only when the perceptual system uses higher-level information as *evidence about the distal stimulus*, subject to recalibration via predictive error.

  Applying this evidence-based criterion immediately dissolves the most famous purported cases. Consider the hill slant studies. When a subject wearing a heavy backpack reports a hill as steeper, is their visual system treating the backpack's weight as evidence about the hill's geometry? Clearly not. The weight is data about the observer's action capacities, not the distal environment. The visual system is not making an inferential error about the slope; it is accurately registering an affordance. When the backpack is removed, the effect disappears not because a perceptual prior was updated by error, but because the physiological constraint was lifted. Under the proposed criterion, this is not penetration. It is a pragmatic adjustment of report or an alteration in the function of the perceptual state regarding action, not a change in the perceptual content itself. The deflationary critique holds here: the subject is reporting a different relationship to the hill, not seeing a different hill.

  However, the memory color effect survives this scrutiny. When a gray patch on a banana outline appears faintly yellow, the visual system is engaged in color constancy—attempting to recover surface reflectance despite ambiguous illumination. Here, the semantic knowledge that "bananas are yellow" functions as a probabilistic prior about the distal stimulus. The system assumes the surface is yellow and the lighting is neutral, rather than the surface being gray and the lighting yellow. Crucially, this influence behaves like a perceptual hypothesis. If a subject is exposed to blue bananas repeatedly, the effect diminishes; the prior recalibrates in response to predictive error. The higher-level information is being used precisely as evidence to resolve ambiguity about the world's physical properties. Unlike the hill case, where the top-down influence tracks the subject's internal state, the banana case tracks the likely properties of the object. This satisfies the condition for genuine penetration: cognition is not merely weighting the output, but constituting the inference that yields the percept.

  Adopting this verdict requires acknowledging a significant risk. My conclusion rests entirely on the acceptance of the evidence-based criterion, which is itself a philosophical stipulation rather than an empirical discovery. A staunch deflationist could argue that even in the banana case, the "yellowing" is a post-perceptual judgment masquerading as experience. They might claim that semantic activation primes the response "yellow" without altering the qualitative character of the gray patch. My argument assumes that predictive processing models are correct in identifying these priors as constitutive of perception itself. If one views priors as merely preparatory for judgment, the distinction collapses. Furthermore, relying on recalibration is tricky; some response biases also habituate over time. Distinguishing error-driven perceptual learning from response habituation requires empirical rigor that current studies often lack.

  Nevertheless, without a functional criterion like this, the concept of cognitive penetration becomes trivial. If any top-down influence counts, then attention counts, and if attention counts, penetration is undeniable but uninteresting. We need a line that separates perceptual inference from pragmatic adjustment. The hill studies fail this test because they conflate seeing with acting. The memory color studies pass because they involve inferring distal properties using semantic priors as evidence. Therefore, I conclude that cognitive penetration, properly so called, does occur, but not in the way most proponents claim. It is not found in the way our goals warp our affordances, but in the way our knowledge constrains our resolution of sensory ambiguity. The celebrated hill effects are illusions of report, but the banana effect reveals a deeper truth: what we know can become what we see, provided that knowledge serves as a hypothesis about the world rather than a comment on the self.
