prompt: |-
  I'm a retired evolutionary biologist (mostly population genetics, some behavioral ecology later in my career) and I've gotten hooked on philosophy lately, mostly through reading Lewis's Convention. To me the whole setup smells like evolutionary game theory -- he's basically describing a coordination equilibrium with multiple stable states, and his "precedent solves the coordination problem" story sounds like basin of attraction dynamics plus path dependence. So help me translate: restate Lewis's account of convention in the vocabulary I actually used for 40 years -- ESS, replicator dynamics, basins of attraction, drift, frequency dependence, maybe runaway selection if it fits. Then give me the honest residue report: what translates cleanly, what I have to distort to make it fit, and what has no expression at all. My guess is salience (his appeal to what agents notice as an antecedently natural way to solve the coordination problem) is the thing that doesn't map onto anything payoff-driven, but tell me if I'm wrong. And don't give me a survey of positions where you list five views and shrug -- take a stance on whether the residue is a real gap in my old vocabulary or just Lewis being fuzzy, and defend it. Sorry for any butchered terminology on my end, philosophy is my second career at this point.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired evolutionary biologist (population genetics, behavioral ecology). Familiar with ESS, replicator dynamics, basins of attraction, drift, frequency dependence, etc. New to philosophy (specifically David Lewis's *Convention*).
      *   **Core Task:** Translate Lewis's account of convention into evolutionary game theory (EGT) vocabulary.
      *   **Specific Requirements:**
          *   Restate Lewis using EGT terms (ESS, replicator dynamics, etc.).
          *   Provide an "honest residue report" (what maps, what distorts, what's missing).
          *   Address the specific hypothesis about "salience."
          *   **Crucial Constraint:** Take a stance. Don't just list views. Defend whether the residue is a real gap in EGT or just Lewis being fuzzy.
          *   **Tone:** Professional, respectful of expertise, direct, no hand-holding on bio terms, but clear on phil terms.

  2.  **Deconstruct Lewis's *Convention*:**
      *   **Core Definition:** A convention is a regularity $R$ in behavior in a population $P$ in a recurrent situation $S$ such that:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ on the condition that others do (coordination equilibrium).
          4.  There is at least one alternative regularity $R'$ that could have solved the coordination problem.
          5.  The reason for conforming is partly the expectation of others conforming (arbitrariness).
      *   **Key Mechanism:** Precedent. Past success establishes expectation.
      *   **Key Concept:** Salience (Schelling points). Some solutions stand out pre-theoretically.
      *   **Key Concept:** Common Knowledge (iterative expectations).

  3.  **Translate to Evolutionary Game Theory (EGT):**
      *   *Coordination Equilibrium:* Nash Equilibrium in a coordination game (e.g., Driving on the Left vs. Right).
      *   *Multiple Stable States:* Multiple ESSs. Both "Left" and "Right" are evolutionarily stable strategies.
      *   *Precedent/Path Dependence:* Historical contingency. Whichever strategy gets a foothold first pushes the population into its basin of attraction.
      *   *Replicator Dynamics:* The process by which the frequency of the strategy increases as its payoff (fitness) exceeds the average.
      *   *Arbitrariness:* The payoffs are symmetric (or nearly so) regarding the *content* of the strategy, only the *coordination* matters. $Payoff(L, L) = Payoff(R, R) > Payoff(L, R)$.
      *   *Expectations:* In EGT, this is modeled as "population state" or "frequency." Agents don't need cognitive expectations; selection acts *as if* they have them.

  4.  **Analyze the "Residue" (The Mismatch):**
      *   *Salience:* Lewis leans on psychological prominence (focal points). EGT usually assumes random mutation/drift to break symmetry. Salience acts as a *bias* in the initial probability distribution, effectively warping the basin of attraction boundaries before dynamics even start.
      *   *Intentionality/Common Knowledge:* Lewis requires agents to *know* that others *know*. EGT requires only that strategies proliferate based on success. This is the "intentional stance" vs. "design stance" gap.
      *   *Normativity:* Lewis hints at a "ought" (reason to conform). EGT describes an "is" (stable frequency).

  5.  **Formulate the Stance:**
      *   *User's Hypothesis:* Salience is the thing that doesn't map to payoff-driven dynamics.
      *   *My Stance:* The user is half-right but misses the deeper gap. Salience *can* be modeled in EGT (as biased variation or asymmetric payoffs). The *real* gap is **Common Knowledge/Intentionality**. Lewis is doing rational choice theory with cognitive agents; EGT is doing population dynamics with replicators. The "residue" isn't just salience; it's the *reasoning process* itself. Lewis requires a specific cognitive architecture (belief-desire psychology) that EGT explicitly bypasses.
      *   *Defense:* EGT explains the *stability* and *emergence* without the cognition. Lewis explains the *rationality* of the cognition. If you remove the cognition, you lose Lewis's specific definition of convention (which relies on reasons), but you keep the phenomenon. Therefore, the gap is in Lewis's requirement for explicit reasoning, not necessarily in EGT's ability to model the outcome. However, regarding *Salience* specifically: EGT treats symmetry breaking as stochastic (drift) or biased (mutation bias). Lewis treats it as rational recognition. This is a genuine gap in *mechanism*, not just vocabulary.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the insight. It's a standard move in modern philosophy (Skyrms, etc.) to read Lewis through EGT. Validate the user's intuition.
      *   *Translation Section:* Go point-by-point through Lewis's conditions using EGT terms.
          *   Regularity $\rightarrow$ Fixation/Monomorphic State.
          *   Coordination Problem $\rightarrow$ Coordination Game (multiple Nash Equilibria).
          *   Preference to conform $\rightarrow$ Payoff structure (frequency-dependent selection).
          *   Alternative Regularity $\rightarrow$ Alternative ESS.
          *   Precedent $\rightarrow$ Historical Path Dependence / Basin of Attraction.
      *   *The Residue Report:*
          *   *Clean Mapping:* Stability, Arbitrariness (symmetry), Path Dependence.
          *   *Distortion:* "Expectation." In bio, it's statistical frequency. In Lewis, it's mental state.
          *   *The Missing Piece (Salience & Common Knowledge):* Address the user's guess about salience.
      *   *Taking a Stance:*
          *   Is it a gap in EGT or Lewis?
          *   Argument: It's a gap in *Lewis's* requirement for rationality, but Salience is a genuine challenge for standard EGT unless modified.
          *   Actually, a stronger stance: **The "Common Knowledge" requirement is the real bug.** EGT shows you don't *need* common knowledge for conventions to emerge (via replicator dynamics). Lewis thinks you do. So Lewis is arguably "fuzzy" or overly intellectualist here.
          *   Regarding Salience: It maps to **biased variation** or **payoff asymmetry**. It's not unmodelable, but it requires adding parameters to the basic replicator equation.
      *   *Conclusion:* Summarize. Lewis describes the *phenomenology* of rational agents; EGT describes the *mechanics* of population states. They converge on the equilibrium, diverge on the trajectory and the necessity of mind.

  7.  **Refining the Tone:**
      *   Avoid condescension.
      *   Use the bio terms correctly (don't say "gene for driving left," say "strategy").
      *   Be decisive. The user asked for a stance, not a survey.
      *   Reference Brian Skyrms (*The Evolution of the Social Contract*) as the bridge figure.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, does Salience map to payoff?* If a Schelling point is "meet at noon," noon isn't higher payoff intrinsically, it's focal. In EGT, this looks like a correlation device or a bias in the exploration/mutation phase. I need to be precise here. It's not payoff *per se*, it's a bias in the *search space*.
      *   *Common Knowledge:* Lewis requires infinite iterations of "I know that you know." EGT requires only that the strategy is frequent enough. This is the biggest divergence.
      *   *Stance:* I will argue that Lewis is the one who is "fuzzy" (or rather, overly intellectualist) regarding the *necessity* of common knowledge, but EGT is "blind" regarding the *mechanism* of symmetry breaking (Salience). The residue is real, but it's located in the cognitive requirements, not just the payoff structure.

  9.  **Final Polish:** Check against constraints.
      *   Translate? Yes.
      *   Residue report? Yes.
      *   Take a stance? Yes.
      *   Defend it? Yes.
      *   No survey? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  You are not butchering anything; your intuition is spot-on. In fact, you have independently rediscovered the project that occupied philosophers like Brian Skyrms and Ken Binmore for the last thirty years. They essentially did what you are asking: they took Lewis's *Convention* and ran it through the filter of evolutionary game theory (EGT).

  Here is the translation of Lewis into your native tongue, followed by the residue report and my stance on where the friction lies.

  ### The Translation: Lewis in Population Genetics Vocabulary

  Lewis's *Convention* is an analysis of a specific class of Nash Equilibria in coordination games. Here is how his conditions map to your toolkit:

  1.  **The Coordination Problem:** A game with multiple Nash Equilibria (e.g., Hawk/Dove or, more accurately, a pure coordination game like *Driving Side*). The payoff matrix is such that $Payoff(A, A) = Payoff(B, B) > Payoff(A, B)$.
  2.  **Regularity in Behavior:** Fixation (or near-fixation) of a specific strategy in the population. The population is monomorphic for strategy $A$.
  3.  **Preference to Conform:** Frequency-dependent selection. The fitness of strategy $A$ is positively correlated with its frequency in the population. If $p$ is the frequency of $A$, $\frac{dw_A}{dp} > 0$.
  4.  **Alternative Regularity:** The existence of at least one alternative ESS (Evolutionarily Stable Strategy). Strategy $B$ is also an ESS. The landscape has multiple peaks.
  5.  **Arbitrariness:** The peaks are of roughly equal height. There is no intrinsic payoff advantage to $A$ over $B$ *except* via coordination. This rules out cases where one side is a dominant strategy.
  6.  **Precedent:** Path dependence. The population's current position on the fitness landscape is determined by its historical trajectory, not just the landscape's topology.
  7.  **Basin of Attraction:** Once the population frequency crosses the unstable equilibrium point (the saddle point between peaks), replicator dynamics drive it to fixation without further external input.
  8.  **Expectations:** In Lewis, this is a mental state. In EGT, this is encoded in the population frequency itself. An individual "expects" others to play $A$ because the statistical frequency of $A$ is $\approx 1$.

  ### The Honest Residue Report

  Here is where the translation holds, where it distorts, and where it breaks.

  **1. What Translates Cleanly:**
  *   **Stability and Arbitrariness:** The concept of multiple ESSs with equivalent payoffs is a perfect formalization of Lewis's "arbitrary but stable" regularity.
  *   **Path Dependence:** Lewis's reliance on "precedent" is exactly historical contingency in a rugged fitness landscape. Which peak you climb depends on where you started and the noise in the system (drift) during the early phases.
  *   **The "Ought":** Lewis says you have a reason to conform. EGT says you have a fitness penalty for deviating. These are functionally isomorphic in a stable population.

  **2. What Requires Distortion:**
  *   **Expectations:** Lewis requires agents to hold propositional attitudes ("I believe that you believe..."). EGT requires only that strategies replicate. To make this fit, you must treat "expectation" as a metaphor for "statistical regularity." If you insist on literal mental states, EGT cannot model it without adding complex cognitive architecture to the agents.
  *   **Common Knowledge:** Lewis insists on infinite iterations of knowledge (I know that you know that I know...). In EGT, this collapses into "Common *Information*" (the population state is visible). The infinite regress is unnecessary for stability in replicator dynamics, though it matters for *rational* choice.

  **3. What Has No Expression (The Salience Issue):**
  *   **Salience:** You guessed this is the problem. You are right, but not for the reason you think. It's not that salience isn't payoff-driven; it's that salience acts *before* the dynamics start.
  *   In standard replicator dynamics, symmetry breaking is usually modeled as **drift** (stochastic noise) or **mutation bias**.
  *   Lewis's "Salience" (Schelling points) is a **bias in the variation phase**. It is not a difference in fitness payoffs; it is a difference in the *probability of discovery*.
  *   Standard EGT assumes variation is random with respect to fitness. Lewisian Salience says variation is *non-random* with respect to psychological prominence. To model this, you have to modify the mutation operator in your equations to be biased toward "focal" strategies.

  ### The Stance: Is the Residue a Gap in EGT or Lewis?

  You asked me to take a stand. Here it is:

  **The residue is a defect in Lewis's account, not a gap in EGT.**

  Lewis is guilty of **intellectualism**. He assumes that for a convention to exist, agents must *reason* their way to it using common knowledge and salience. EGT demonstrates that you do not need the cognitive machinery Lewis describes to get the phenomenon he is describing.

  **Defense of the Stance:**

  1.  **Common Knowledge is Superfluous:**
      Lewis argues that without common knowledge, the coordination equilibrium is unstable. EGT (specifically replicator dynamics) proves this false. A population can settle into a conventional equilibrium purely through blind selection and drift, without any agent possessing a "belief" about another agent. The "expectation" is handled by the environment (the population mix), not the head. Lewis mistakes the *phenomenology* of being a human following a convention (which involves reasoning) for the *ontology* of the convention itself (which is just a stable coordination equilibrium).

  2.  **Salience is Just Biased Variation:**
      You suspected salience doesn't map to payoff-driven dynamics. That is correct, but it doesn't mean it's mystical. In evolutionary terms, salience is a **mutation bias** or a **developmental constraint**.
      *   *Example:* If two tribes need to coordinate on a meeting place, "the tallest tree" is salient. In Lewis's view, agents rationalize this. In EGT, this means the probability of the "Tallest Tree" strategy arising via variation is higher than the "Third Rock from the Left" strategy.
      *   This warps the **basins of attraction**. The basin for the salient strategy is effectively larger because the population is more likely to stumble into it initially.
      *   This is not a gap in EGT; it is a parameter adjustment. Lewis treats salience as a rational insight; EGT treats it as a probabilistic bias in the search space. The EGT explanation is more parsimonious because it doesn't require agents to have "insights."

  3.  **The Real Gap is Normativity (and why it doesn't matter):**
      The only thing EGT cannot capture is the *normative force* Lewis feels—the idea that someone *violating* a convention is "wrong" in a way distinct from just "suboptimal." Lewis tries to ground this in rationality. EGT grounds it in stability.
      *   If you care about why agents *feel* obliged, Lewis is better.
      *   If you care about why the pattern *persists*, EGT is better.
      *   Since your background is biology, you should view Lewis's "reasons" as ex-post rationalizations of selection pressures.

  **Conclusion:**
  Lewis correctly identified the topology of the problem (multiple stable equilibria, path dependence), but he misidentified the mechanism (rational deliberation vs. selection dynamics).

  Your intuition that "salience" is the sticking point is sharp, but don't let it stop you. Salience is simply **non-random variation**. It breaks the symmetry of the fitness landscape not by changing the peak heights (payoffs), but by changing the probability distribution of the population's initial location on the map.

  Lewis isn't fuzzy on the *structure* of conventions; he is fuzzy on the *necessity of mind*. You can safely discard the "common knowledge" and "rational expectation" requirements as cognitive clutter. The convention exists if the ESS is fixed, regardless of whether the agents know why.
