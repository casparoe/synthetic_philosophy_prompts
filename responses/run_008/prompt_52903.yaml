answer: |-
  This is a brilliant dissection of a philosophical metaphor through the lens of epidemiological rigor. You are absolutely right to be suspicious: Tolstoy's theory is one of the most famous cases of a "borrowed lab coat" in aesthetics. It sounds mechanistic and objective, but it smuggles in moral and metaphysical assumptions that the metaphor cannot support.

  Your friend is using Tolstoy's *What Is Art?* (1897) as a conversation-stopper, but she is likely relying on a conflation of five distinct claims. Tolstoy himself shifts between these registers, which is why the theory is so seductive and so fragile.

  Here is a breakdown of the distinct readings of "Art is Infection," ranked from the trivial to the ontologically radical, designed for your book club handout.

  ***

  ### 1. The Causal Mechanism Claim
  *   **The Claim:** Art functions as a vector that transmits a psychological state from a source (artist) to a host (audience).
  *   **Status:** **Platitude.** Almost any definition of art (even formalist ones) admits that art *does* something to a viewer.
  *   **Tolstoy's View:** He accepts this as the *mechanism*, but not the definition.
  *   **Supports Friend's Verdict?** **No.** This describes how art works, not what counts as art. An abstract painting might transmit confusion, curiosity, or awe. If *any* feeling counts as infection, the painting remains art.
  *   **The Lab Coat Check:** **Pseudo-scientific.** In epi, a vector transmits a specific pathogen. In aesthetics, the "pathogen" (the feeling) is transformed by the host's psychology. It is not a sterile transmission.

  ### 2. The Sincerity (Source) Claim
  *   **The Claim:** The transmission is only "art" if the source was genuinely infected first. The artist must have felt the emotion they are transmitting.
  *   **Status:** **Substantive but Unverifiable.** This moves from mechanism to origin story.
  *   **Tolstoy's View:** **Central.** Tolstoy argues that without sincerity, the work is "counterfeit art." He claims the audience can subconsciously detect the artist's lack of sincerity (like an immune response).
  *   **Supports Friend's Verdict?** **Weakly.** She would have to prove the abstract painter *didn't* feel the emotion. She is assuming that because *she* wasn't infected, the source must have been empty. That is a logical leap (see Reading 3).
  *   **The Lab Coat Check:** **Metaphorical only.** There is no serological test for artistic sincerity.

  ### 3. The Universality (Host Range) Claim
  *   **The Claim:** True art must be capable of infecting *any* human host, regardless of training or class (the "peasant test"). If it only infects a specialized niche (e.g., critics, modern art lovers), it is not art, but "exclusive amusement."
  *   **Status:** **Radical and Empirically False.** This demands an $R_0$ (basic reproduction number) of near-universality.
  *   **Tolstoy's View:** **Yes.** Tolstoy explicitly rejects "elite" art. He argues that if a peasant cannot understand it, it is defective. He uses this to dismiss much of his own work, plus Shakespeare, Beethoven, and Wagner.
  *   **Supports Friend's Verdict?** **Yes.** This is likely her strongest shield. If the group (representing "general humanity") feels nothing, the work fails the host-range test.
  *   **The Lab Coat Check:** **Bad Epidemiology.** This ignores *host susceptibility*. In epi, we know susceptibility varies based on prior exposure (vaccination/history/training). Claiming a pathogen is "fake" because a specific population has immunity (or lack of exposure) is scientifically incoherent. In art, "training" (art history, context) alters susceptibility.

  ### 4. The Evaluative (Virulence) Claim
  *   **The Claim:** The *value* of the art is determined by the *strength* and *spread* of the infection. More infection = better art.
  *   **Status:** **Problematic.** This leads directly to the "Schlock Objection."
  *   **Tolstoy's View:** **Qualified Yes.** Tolstoy admits degree of infectiousness matters, *but* he adds a moral filter (see below).
  *   **Supports Friend's Verdict?** **Yes.** If the painting induced zero affect, it has zero value.
  *   **The Lab Coat Check:** **Category Error.** Virulence does not equal value. The Spanish Flu was highly infectious; that did not make it "good." A propaganda poster might infect millions with hatred; Tolstoy would call this bad art, but the "infection metric" alone calls it successful.

  ### 5. The Ontological Gatekeeper Claim
  *   **The Claim:** Infection is not just a property of art; it is the *necessary and sufficient condition* for something to be classified as art. No infection = No Art (not "bad art," but *not art*).
  *   **Status:** **Radical.** This redefines the category entirely.
  *   **Tolstoy's View:** **Yes.** This is the core of *What Is Art?* He distinguishes between "True Art" (unites men), "Exclusive Art" (divides men), and "Counterfeit Art" (imitates without feeling). Only the first is truly "Art."
  *   **Supports Friend's Verdict?** **Yes.** This is the move she made: "It's not art at all, it's decoration."
  *   **The Lab Coat Check:** **Borrowed Lab Coat.** This uses the *language* of biological necessity to enforce a *moral* boundary. It pretends to be a diagnostic test ("No symptoms = No disease") when it is actually a value judgment ("No symptoms = No value").

  ***

  ### Addressing the "Schlock Objection" (The Tear-Jerker Problem)
  You correctly identified the hole in Reading 4: *If infection is the metric, isn't a Hallmark movie that makes millions cry "better" art than a difficult abstract painting?*

  Tolstoy has a response, but it requires him to drop the scientific metaphor and pick up a theological one. He argues that the *content* of the feeling matters.
  1.  **Individuality:** The feeling must be unique, not cliché.
  2.  **Clarity:** The expression must be precise.
  3.  **Sincerity:** The artist must have felt it intensely.
  4.  **Religious Perception:** (The Dealbreaker) The feeling must unite people in the "brotherhood of man" consistent with the highest religious consciousness of that age.

  **The Counter:** A tear-jerker might infect millions, but Tolstoy would argue it infects them with a *false* feeling (sentimentality, not genuine brotherhood). Therefore, it is "Counterfeit Art."
  **The Problem:** This makes the theory circular. How do we know the feeling is "true"? Because it unites us. Why didn't it unite us? Because it wasn't "true" art.
  **For your group:** If your friend uses this, ask her: *Is the painting failing to infect because the feeling is false, or because we lack the vocabulary to receive it?* Tolstoy assumes the latter is impossible for "True Art," but history suggests otherwise (e.g., Impressionism was initially rejected as "not art" by the public).

  ### Summary for the Book Club
  If you want to reopen the conversation without attacking your friend, you might propose that Tolstoy's metaphor suffers from **Host Variability**.

  In epidemiology, if a pathogen enters a host and no symptoms appear, we do not immediately declare the pathogen "fake." We ask:
  1.  Is the host immune? (Do we lack the cultural context?)
  2.  Is the dose too low? (Did we spend 10 seconds or 10 minutes with the painting?)
  3.  Is the vector broken? (Is the presentation poor?)

  Tolstoy's theory collapses these variables into a single verdict: **No Symptoms = No Pathogen.**

  As a retired epidemiologist, your closing argument could be: *"Tolstoy treats aesthetic reception like a mandatory reporting disease with 100% penetrance. But aesthetic experience is more like a zoonotic spillover—it requires specific conditions, specific hosts, and often, a period of incubation. To say the painting isn't art because we aren't infected yet is like saying a virus isn't real because we're wearing masks."*

  This honors her reference (Tolstoy) while using your expertise to show why the metaphor cannot bear the weight of the verdict she wants it to carry.
