answer: |-
  1. What he got right

  Your friend correctly identifies the structural lineage of the Pasadena game as a variant of the St Petersburg paradox, accurately describing the probabilistic setup involving a fair coin and inverse geometric probabilities. He is also right to derive the expected value terms as the alternating harmonic series ($1 - 1/2 + 1/3 \dots$). Furthermore, his philosophical diagnosis captures the essential trouble: standard expected utility theory struggles to assign a determinate value to this gamble. He correctly notes that the expectation is not merely infinite but undefined, and he rightly invokes Riemann's rearrangement theorem as relevant to the mathematical behaviour of conditionally convergent series. Finally, his assessment that this poses a significant challenge to decision theory—specifically the principle of maximizing expected value—is shared by many contemporary philosophers. The core intuition that a rational agent lacks clear guidance here is the genuine paradox, even if the mathematical justification requires refinement.

  2. What is subtly wrong

  The critical mathematical error lies in his claim that the alternating harmonic series diverges. It does not; it converges conditionally to the natural logarithm of two ($\ln 2$). The partial sums do not oscillate indefinitely; they settle quite happily. Consequently, his explanation for why the expected value is undefined is incorrect. The expectation is not undefined because the series fails to converge in its natural order, but because it fails to converge *absolutely*. In measure-theoretic probability, an expectation is only well-defined if the sum of the absolute values converges. Here, the sum of absolute terms is the standard harmonic series, which diverges to infinity. This creates a situation where the positive expected winnings and negative expected losses are both infinite. Subtracting infinity from infinity is undefined mathematically. Consequently, the expectation lacks a stable foundation.

  While he is correct that rearranging the terms changes the sum (per Riemann), this is a consequence of conditional convergence, not divergence. The profound issue is not that the natural sum oscillates, but that the value depends on the ordering of outcomes, which contradicts the requirement that expectation be an intrinsic property of the random variable independent of enumeration. In the Pasadena game, the sample space is countable, and while there is a natural ordering (flip 1, flip 2), probability theory demands that the expectation remain invariant under bijections of the sample space. Because the series is not absolutely convergent, this invariance fails.

  Furthermore, his suggestion that decision theory goes 'silent' assumes the undefined status is a gap rather than a deliberate exclusion. Standard theory does not say 'we do not know the value'; it says 'this variable has no expectation'. This is a category error, not an epistemic failure. His mathematical narrative is inverted: the series converges, yet the expectation remains undefined due to the lack of absolute convergence. This distinction matters because it shifts the problem from analytic instability to a conflict between intuitive summation and measure-theoretic rigour. If the series truly diverged, one might argue for summation methods like Cesàro means. But since it converges to $\ln 2$, the temptation to assign that value is strong, making the prohibition on using it the real source of philosophical tension. The rearrangement argument shows that without absolute convergence, the 'value' is manipulable by describing the same game differently, which undermines the objective status required for rational choice. This nuance is essential for understanding the paradox.

  3. What his summary leaves out

  His account omits the broader context of the 'Pasadena family' of games, including the Altadena game, which complicates the dominance arguments often used to analyse these cases. More importantly, he overlooks the debate regarding whether the natural ordering of time should fix the expectation. Some theorists argue that because the flips occur sequentially, the natural order of the series is privileged, legitimising $\ln 2$ as the value. This pushes back against his claim that there is 'no fact of the matter'. If the physical process dictates the summation order, the value is determinate.

  Additionally, standard responses involve restricting the domain of expected utility theory to gambles with defined expectations, effectively ruling the Pasadena game inadmissible rather than leaving the theory silent. This preserves the theory's coherence at the cost of completeness. He also neglects the distinction between pragmatic and epistemic rationality; one might argue that while the math is undefined, a rational agent might still have a preference based on finite truncations. Finally, he ignores the possibility that the paradox reveals limits in applying infinite mathematics to finite agents, rather than a flaw in decision theory itself.

  Crucially, he misses the argument from Weak Dominance. If you add a constant to every payoff, the preference ordering should not change. In the Pasadena game, adding a constant can shift the expectation from undefined to defined (or vice versa), violating this principle. This suggests the problem lies in the interaction between infinite utilities and dominance axioms, not merely the summation order. These omissions soften the conclusion that decision theory is refuted; instead, it may simply require boundary conditions or a rejection of unbounded utility functions. The landscape is not a silent void, but a contested field of proposed solutions. Therefore, the claim that the theory fails completely is somewhat premature.

  4. Whether his conclusion survives

  Your tentative view is entirely coherent: the mathematics is misdescribed, but the philosophical problem remains. The conclusion that decision theory is 'refuted' does not survive scrutiny, primarily because the theory was never designed to handle non-integrable variables. It is not embarrassed; it is operating outside its domain. However, the paradox does demonstrate that expected utility theory cannot be the sole arbiter of rational choice for all conceivable gambles. The accurate maths shows the expectation is undefined due to lack of absolute convergence, not divergence. This supports the view that the theory is incomplete rather than false. We must either accept that some games have no value or adopt an alternative framework. Thus, while your friend is right that something deep is wrong, he is wrong that the theory is dead. It merely requires refinement to handle pathological cases involving infinite conditional convergence. The paradox stands as a limit case, not a demolition.
