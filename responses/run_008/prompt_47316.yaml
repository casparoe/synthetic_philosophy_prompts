          *   Probability of heads on flip $n$ is $1/2^n$.
          *   Payoff $X_n = (-1)^{n+1} \frac{2^n}{n}$.
          *   Expected Value contribution per outcome $n$: $P(n) \times X_n = \frac{1}{2^n} \times (-1)^{n+1} \frac{2^n}{n} = \frac{(-1)^{n+1}}{n}$.
