          *   *Analysis:* Marta is scientifically accurate about the "frozen accident" hypothesis (Crick). Elias is philosophically sharp about the *source* of the convention. The river analogy is weak (rivers aren't mappings), but the point about contingency stands. The lab recoding point is a double-edged sword.
          *   *Verdict:* Marta wins on the biology (it *is* arbitrary in the relevant sense). Elias wins on the metaphysics of agency (who sets the rule?).

      *   **Round 3: Rhetoric & Metaphor Clusters.**
