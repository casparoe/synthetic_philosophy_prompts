  *   **Comparisons:** The distinctions drawn between Nyāya, Cārvāka (perception only), Buddhists (perception and inference), and Advaita Vedānta (six *pramāṇas* with correct examples of *arthāpatti* and *anupalabdhi*) are factually correct and demonstrate a strong grasp of the comparative landscape.
  *   **Reduction Strategy:** The answer correctly identifies that Nyāya reduces the extra Vedānta *pramāṇas* (postulation and non-apprehension) to inference (*anumāna*) to justify stopping at four.
