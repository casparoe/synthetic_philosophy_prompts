answer: |-
  Good morning.

  If you knew my mother, you likely remember the smell of damp earth. She spent a lot of time outdoors. There is a story that circulated among the science department for thirty years: that she once spent an entire spring term on "pond-dipping." To the administration, it looked like a gap in the timetable. To her, it was the point.

  She believed that before you can analyze a thing, you have to be startled by it. She called this the stage of wonder. It was the moment a seventeen-year-old realizes that the water in a jar isn't just dirty, but alive. She knew that if you skip that shock of recognition, if you rush straight to the diagrams and the definitions, the knowledge never takes root. It stays external. It stays dead.

  But she was not a soft teacher. And this brings me to the second thing she knew. Wonder is not enough. Once you have seen the life in the pond, you have to learn the names of the creatures. You have to learn the technique. You have to do the hard, precise work of understanding *how* it lives.

  She used to say that a student's head is not a pantry. You cannot just store facts on a shelf against a future that never comes. Knowledge goes stale. It rots. If you aren't using it, testing it, throwing it into fresh combinations, it is worthless. She demanded rigor from us because she respected us enough to know we were capable of it. She wouldn't let us stay in the vague, happy feeling of wonder forever. That would have been a kindness that ruined us. She made us learn the discipline so that the wonder could become real.

  And this leads to where we are today, and the third thing she taught. She believed education has a single aim: a sense for the value of life as it is actually lived. Here. Now. Not as preparation for an exam. Not as preparation for adulthood. And certainly not as preparation for death.

  She left instructions that there should be nothing in this service about her "looking down on us." She said that would be exactly the kind of dead idea she spent her life trying to prevent. She was an atheist, cheerful and uncomplaining, because she believed that this life, this specific Tuesday morning, this breath in your lungs, is the only one we are guaranteed. To pretend otherwise is to devalue the currency of the present.

  So, how do we grieve her without pretending she is somewhere else?

  We grieve her by using what she gave us.

  To the former students here: You carry facts she taught you. Some of them may have changed. Some may have faded. That is fine. What matters is not the inventory of your pantry, but the appetite she gave you. If you look at the world and see it as something to be examined, tested, and valued, you are doing what she asked.

  To the teachers here: She would want you to go back to your classrooms and look at your lesson plans. Are you forcing discipline before the wonder? Are you stretching the wonder to avoid the hard work? Are you teaching for a test, or for the value of the life sitting in front of you? If you change one lesson next week because you remember her, she is not "watching." She is working.

  She is not a static memory to be preserved. She was a process. She was a continuing series of experiences, always becoming, never finished until the end. And now the process has passed to us.

  There is no reunion waiting for us. There is only the work we have to do, and the time we have to do it in. That might sound stark. But she would tell you it is liberating. It means the value of this gathering is not in what we hope happens next, but in what is happening right now. It is in the fact that two hundred people are in a room, sharing a precise memory of a woman who loved the living world enough to teach us how to see it.

  She told us that life is not a dress rehearsal. She lived that way. And the greatest respect we can pay her is to live the same way. To take the knowledge she gave us, and use it. To take the love she gave us, and spend it.

  Thank you.
