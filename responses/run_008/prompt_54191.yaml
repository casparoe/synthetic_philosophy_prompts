          *   *Idea 2:* Learning cycles (Romance -> Precision -> Generalization). Don't force discipline too early or stretch wonder too long.
          *   *Idea 3:* Aim of education is the value of life *now*, not preparation for exams/adulthood/afterlife.
      *   **Personal Beliefs:** Cheerful, uncomplaining atheist. No afterlife. Explicit instruction: "Nothing about her looking down on us."
      *   **Audience:** ~200 people (family, relatives, former students, colleagues, trainee teachers). Mixed knowledge of her philosophy.
      *   **Length:** ~5 minutes spoken (approx. 750-900 words).
      *   **Tone/Style:**
          *   Philosophy must do *structural work*, not just be name-checked.
          *   Avoid standard eulogy tropes (she's watching over us, she's at peace).
          *   Avoid academic lecture on Whitehead.
          *   Must land for a grieving 17-year-old student *and* experienced teachers.
          *   Comfort must come from secular, life-affirming sources (legacy of action, not spirit).
          *   She would recognize it as true.
          *   Teachers should leave wanting to change their next lesson.

  2.  **Deconstruct the Structure (Applying the Philosophy to the Speech):**

      *   *Constraint:* The user suggests using the cyclical idea (Wonder -> Precision -> Generalization) to shape the speech. This is a brilliant directive.
      *   *Phase 1: Romance/Wonder.* Who she was, the spark, the "pond-dipping," the excitement of life. Not just "she was nice," but "she was alive."
      *   *Phase 2: Precision/Discipline.* What she actually demanded. The hard work. The "stale knowledge" warning. The rigor behind the fun.
      *   *Phase 3: Generalization/Value.* The widening horizon. How this applies to us now. The end of the process (death) not as a failure but as a completion of a cycle. The comfort of the *now*.

  3.  **Drafting - Section by Section:**

      *   **Opening (Romance):** Start with the sensory experience of her classroom. Not a list of dates, but the feeling of the "wonder stage." The pond-dipping anecdote is crucial here. It illustrates the "value of life as it is actually lived."
      *   **Middle (Precision):** Shift to the rigor. She wasn't just letting kids play in mud. She demanded technique. Connect this to the "stale knowledge" idea. The head is not a pantry. This addresses the teachers in the room.
      *   **Closing (Generalization/Value):** Address the death directly. No afterlife. The comfort comes from the *use* of what she gave us. The process continues in us.

  4.  **Drafting - Content & Voice:**

      *   *Voice:* Respectful, clear, slightly intellectual but accessible. Warm but firm (like her).
      *   *Key Phrases to Integrate:* "Head is not a pantry," "Pond-dipping," "Nothing about looking down," "Value of life here and now."
      *   *Avoid:* "She is in a better place," "Her spirit lives on" (unless qualified materially), "Gone but not forgotten" (cliché).
      *   *Whitehead:* Do not name him. Use the ideas.
      *   *Atheism:* Handle gently but firmly. She wouldn't want soft deism.

  5.  **Refining and Polishing (Iterative Process):**

      *   *Check Length:* A 5-minute speech is roughly 750 words at a moderate pace. I need to ensure it's not too dense.
      *   *Check Constraints:* Did I mention her watching over us? No. Did I make it a lecture? No. Is the philosophy structural? Yes, the flow moves from the excitement of her teaching to the rigor of her method to the application of her life's meaning.
      *   *Emotional Arc:* Needs to land for the 17-year-old. Acknowledge the loss without promising a reunion. The comfort is in the *utility* of her love/teaching.
      *   *Specific Detail:* The "trouble with the head of department" is a great detail to show her commitment.
      *   *The "Pantry" Metaphor:* This needs to be central. It connects knowledge to life.
      *   *The Ending:* Needs to be strong. "Run their next lesson differently."

  6.  **Writing - Step-by-Step (Mental or Scratchpad):**

      *   *Start:* Imagine the pond. The cold water. The excitement.
      *   *Transition:* But it wasn't just fun. It was work.
      *   *Philosophy:* Knowledge rots if not used.
      *   *Death:* She is gone. She isn't watching. But the process continues.
      *   *Call to Action:* Use what she gave you.

      *(Self-Correction during drafting)*: I need to make sure I don't sound *too* much like a teacher myself. I am the child. I need to claim the relationship. "My mother" not just "Mrs. X."
      *(Refining the Atheism)*: Make sure the "no afterlife" part feels like *her* wish, not just a statement of fact. It's about respecting her integrity.
      *(Refining the Cycle)*: Ensure the speech itself feels like it moves through the three stages.
      *   *Stage 1 (Romance):* The story of the pond, the spark.
      *   *Stage 2 (Precision):* The demand for accuracy, the "pantry" warning.
      *   *Stage 3 (Generalization):* The application to our lives now, the value of the present.

  7.  **Final Review against constraints:**
      *   5 minutes? (Word count check).
      *   No "looking down"? (Checked).
      *   Philosophy structural? (Yes, the three movements).
      *   Comfort from elsewhere? (Yes, from the utility of memory and action).

  8.  **Final Polish:** Check rhythm and cadence for reading aloud. (e.g., short sentences for impact).

