prompt: |-
  I'm a retired pharmacologist (35 years running self-control experiments, first in pigeons and rats, later with human subjects) who got seriously into philosophy after retiring, mostly through my daughter who is doing a PhD in it. Somehow I talked my way onto the schedule of the philosophy department's works-in-progress seminar, and next month I'm presenting the view that what philosophers call akrasia is mostly not a puzzle about rationality at all, but an artifact of hyperbolic temporal discounting. The preference reversals we saw in the lab pigeons — smaller-sooner reward chosen over larger-later when the choice is immediate, but the preference flips once both options are pushed equally far into the future — show up in human behavior just as reliably, and I want to argue that if you take that seriously, weakness of will mostly dissolves into ordinary intertemporal preference, plus maybe some failures of what Ainslie called bundling future choices into commitment devices.

  The audience is a philosophy department, not a bunch of economists: a couple of action theorists who take Davidson's treatment of akrasia seriously, a Kantian ethicist, someone into experimental philosophy, some grad students, and a visiting scholar working on free will and addiction who I suspect knows the neuroscience better than I do. What I need is a prep sheet for the Q&A, not a better version of the talk. Please give it to me in exactly these sections, in this order: "What they'll actually ask" (the six or eight objections this specific audience would raise, ordered by how much damage they'd do, each phrased the way an action theorist or ethicist would phrase it, not the way a behavioral economist would); "Concede or hold" (for each objection, one line on what I should concede up front and where I have to hold the line); "The soft spots" (where my replies are weakest, especially anything that turns on me stretching the word 'mostly' in my thesis); and "The question I hope nobody asks" (you know the one, plus a two-minute answer in case it comes anyway). Bullet points fine within sections, keep the whole thing around 1200 words.

  A bit more seeding in case it helps: I plan to say that the philosophical literature treats akrasia as a puzzle precisely because it's described in the language of practical judgment — judging it better, all things considered, to do one thing while doing another — whereas on my picture what flips over time isn't the judgment but the valuation, and valuations flipping as a function of delay is just what discount curves do, no faculty of will required. I also want to claim that consistent exponential discounting was never an empirical finding, it was an axiom borrowed from economics, so philosophers who treat hyperbolic preference reversals as somehow pathological have it backwards. But I'll admit I haven't read as much of the philosophy as I probably should have, so please flag the places where a philosophical objection has real teeth because someone in that room will know the literature better than I do.
