answer: |-
  # What they'll actually ask

  *   **The Davidsonian Challenge:** "You've explained the *causation* of the action, but not the *irrationality*. Davidson defines akrasia as acting against one's own best judgment. If hyperbolic discounting changes my valuation at time *t*, isn't my action consistent with my judgment *at time t*? If so, you haven't explained akrasia; you've explained away the conflict entirely."
  *   **The Normative Objection:** "Even if hyperbolic discounting is empirically normal, why does that make it rational? You're committing the naturalistic fallacy. Just because pigeons (and humans) *do* reverse preferences doesn't mean they *ought* to. Philosophy cares about the norm, not the mechanism."
  *   **The Kantian Pushback:** "You reduce practical reason to inclination. For Kant, the will is the capacity to act on principle despite inclination. If you redefine weakness of will as mere discounting, you dissolve the moral faculty required to resist it."
  *   **The Definitional Trap:** "Isn't this just verbal stipulation? If you define akrasia as 'exponential discounting failure,' then of course hyperbolic discounting isn't akrasia. But you're changing the subject from the philosophical puzzle to a behavioral description."
  *   **The Neuroscience Visitor:** "Valuation systems (ventral striatum) and control systems (PFC) are distinct. Your model collapses them into one curve. What about cases where the agent explicitly judges the immediate reward bad but the valuation system hijacks the motor output anyway?"
  *   **The Second-Order Volition:** "Frankfurt and Watson argue agency involves identifying with certain desires. If I discount hyperbolically but *regret* it immediately after, doesn't that conflict show the akrasia remains, regardless of the curve?"
  *   **The Commitment Puzzle:** "If we know our curves are hyperbolic, rational agents should always bundle choices or use commitment devices. Why don't we? If you say 'because of further discounting,' you're begging the question about rationality."
  *   **The 'Mostly' Escape Hatch:** "You claim this explains 'mostly' akrasia. What constitutes the remainder? If you leave room for 'true' weakness of will, haven't you admitted the philosophical puzzle survives in those cases?"

  # Concede or hold

  *   **Davidsonian:** Concede that conflict may vanish at time *t*; hold that the *temporal inconsistency* itself is the irrationality philosophers worry about, not the snapshot conflict.
  *   **Normative:** Concede 'natural' doesn't equal 'good'; hold that treating a universal biological constraint as a moral failure is unproductive and misleading.
  *   **Kantian:** Concede this challenges traditional duty-based models; hold that a moral theory incompatible with human neurobiology is useless for guiding actual behavior.
  *   **Definitional:** Concede terminology varies; hold that if the phenomenon (preference reversal) is universal, the philosophical "puzzle" rests on a false axiom (exponential discounting).
  *   **Neuroscience:** Concede neural dissociation exists; hold that the *experience* of conflict is still driven by the shifting valuation curves competing for control.
  *   **Second-Order:** Concede regret exists; hold that regret is evidence of the long-term preference losing to the short-term curve, not a separate faculty of will failing.
  *   **Commitment:** Concede we under-utilize commitment; hold that setting up commitments is itself subject to hyperbolic discounting (cost now, benefit later).
  *   **'Mostly':** Concede some pathologies (e.g., severe addiction) may involve broken circuitry; hold that ordinary weakness of will is discounting, not brokenness.

  # The soft spots

  *   **The "Mostly" Qualifier:** This is your weakest flank. If pressed on what constitutes the non-hyperbolic remainder, you risk admitting that "true" akrasia exists, which validates the traditionalists. Keep the remainder vague but small (e.g., "neurological impairment").
  *   **Davidson's "All Things Considered" Judgment:** You haven't read enough Davidson to know if he allows judgments to shift with time. If he argues the judgment should remain stable despite valuation shifts, your claim that "valuation flips" doesn't address his specific definition of irrationality. A Davidsonian will pounce on this distinction between *evaluative judgment* and *motivational strength*.
  *   **The Is/Ought Gap:** The Kantian and the normative ethicist will know you cannot derive rationality from biology. If you argue hyperbolic discounting is "rational" because it's natural, you will lose. You must argue it is *understandable*, not necessarily *normatively correct*, but that the *puzzle* arises from expecting exponential curves.
  *   **R. Jay Wallace:** If anyone has read Wallace's *Weakness of Will and Practical Irrationality*, they know he argues strictly against reducing akrasia to preference changes. He claims normative judgment has a authority that desires lack. You need to acknowledge that your view challenges the authority of judgment itself.
  *   **Stretching "Valuation":** You are equating "judging better" with "valuing higher." Philosophers often distinguish these. If a smoker judges quitting better but values smoking higher, philosophers call that akrasia; you call it discounting. Be prepared to defend collapsing this distinction.

  # The question I hope nobody asks

  **"If weakness of will is just a mathematical curve of discounting, does this eliminate moral responsibility? If I can't help my curve, can you blame me for smoking?"**

  **Two-minute answer:**
  "This is the crucial bridge between my data and your ethics. I am not arguing for exoneration, but for clarification. Responsibility doesn't require that we be immune to biological constraints; it requires that we are responsive to reasons. Hyperbolic discounting explains *why* the reason 'health later' loses to 'pleasure now,' but it doesn't mean the agent is incapable of recognizing the reason.

  Think of it like vision. We all have blind spots. Knowing I have a blind spot doesn't mean I can't be responsible for driving, but it does mean I should check my mirrors. Similarly, knowing we are hyperbolic discounters doesn't remove agency, but it changes what we expect of it. It shifts the focus from 'strengthening the will'—which sounds like magic—to 'structuring the environment.'

  If we treat akrasia as a moral failing, we shame the agent. If we treat it as a discounting problem, we empower them to use commitment devices. So, responsibility remains, but its locus shifts. I am responsible for knowing my curves and bundling my choices. If I fail to bundle, knowing the risk, that is where the blame lies—not in the curve itself, but in the failure to manage it. This preserves responsibility while ditching the mysticism of a 'will' that ought to defy gravity."
