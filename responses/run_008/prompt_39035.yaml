answer: |-
  You have identified a genuine and widely recognized tension in animal ethics, but you are correct that there is no single, canonical Latin-style term (like *ad hominem* or *speciesism*) that captures this specific circular mechanism.

  The phenomenon you are describing is best understood as a synthesis of two established concepts: **Contextual Moral Status** (from relational ethics) and the **Social Construction of Pests** (from critical animal studies). However, the specific *circularity* you noted—where the label justifies the act and the act justifies the label—does not have a standard name.

  Below is the carving of the concept, the existing frameworks that cover it, and a coined term for the specific logical loop you identified.

  ### 1. The Established Framework: Contextual Moral Status
  In academic animal ethics, the view that moral obligations depend on the relationship between the human and the animal (rather than the animal's intrinsic properties) is called **Relational Ethics** or **Contextual Moral Status**.

  *   **Key Proponents:** Philosopher Clare Palmer (specifically in *Animal Ethics in Context*) and political theorists Sue Donaldson and Will Kymlicka (*Zoopolis*).
  *   **How it works:** They argue that a wild mouse, a pet mouse, and a pantry mouse occupy different "moral spaces." The wild mouse is a sovereign of its own community; the pantry mouse is an "intruder" or "liminal" animal.
  *   **Why it fits your observation:** This framework explicitly accepts that the *same* creature has different moral protections based on location and relationship. It validates your observation that the "wrong place" verdict does the justificatory work.
  *   **Why it doesn't fully fit:** Most relational ethicists try to *justify* this distinction (e.g., "we have special duties to animals we invited into our homes"). They generally do not endorse the *circularity* you noticed. They argue the relationship creates the obligation, not that the label "pest" creates the permission.

  ### 2. The Critical Lens: The Social Construction of Pests
  In Critical Animal Studies and environmental sociology, the label "pest" is analyzed not as a biological fact but as a **Social Construction**.

  *   **The Mechanism:** Scholars argue that "pest" is a **Status Function** (a term from philosopher John Searle). A status function is a reality created by collective agreement (e.g., a piece of paper is "money" only because we agree it counts as such). Similarly, an animal becomes a "pest" only when a human community agrees to count it as such.
  *   **The Moral Work:** This classification triggers **Moral Disengagement** (a psychological concept adopted by ethicists). By categorizing the animal as a "pest," humans cognitively reframe the act of killing from "murder" to "sanitation" or "management."
  *   **Differentiation from Speciesism:** You are right to reject speciesism. Speciesism claims a cow is morally inferior to a human *by nature*. Your observation is that a mouse in a meadow is protected, but a mouse in a pantry is expendable. This is **Situational** or **Contextual**, not intrinsic.

  ### 3. The Coinage: Performative Pestification
  Since there is no single term for the *circularity* you identified (where the label justifies the killing, and the killing justifies the label), I will coin a term for it based on speech-act theory.

  **Term:** **Performative Pestification**
  **Definition:** The rhetorical and ethical move wherein labeling an animal a "pest" functions as a performative utterance that simultaneously describes the animal and creates the moral permission to harm it, thereby masking the normative decision as a descriptive fact.

  **How it works:**
  1.  **Descriptive Mask:** The user claims, "This is a pest" (implying an objective fact about the animal).
  2.  **Normative Load:** The label "pest" carries the hidden premise "things labeled pest may be killed."
  3.  **Circular Closure:** If questioned, the user justifies the label by pointing to the permissibility of killing ("It's a pest, look, we're trapping it").

  ### 4. Boundary Cases
  Here is how **Performative Pestification** applies to your boundary cases, distinguishing between legitimate contextual ethics and the circular fallacy.

  *   **A Raccoon in the Attic:**
      *   **Classification:** **Liminal Intruder.**
      *   **Analysis:** This counts as *Performative Pestification* if the raccoon is killed immediately without assessing threat or attempting non-lethal removal. In relational ethics, the raccoon has entered a human space, altering the relationship, but does not automatically lose all moral status. If the label "nuisance" is used to bypass non-lethal options, it is the fallacy at work.
  *   **A Cow that Breaks into a Vegetable Garden:**
      *   **Classification:** **Property Trespass.**
      *   **Analysis:** This is distinct. The cow is already domesticated (a legal "person" or property). Killing it is usually economically irrational. If killed, it is rarely justified by "pest" status but by "property defense." This falls outside *Performative Pestification* because the cow is not being re-categorized as a wild threat; it is being treated as a malfunctioning asset.
  *   **A Mosquito Before It Lands:**
      *   **Classification:** **Precautionary Threat.**
      *   **Analysis:** This is the hardest case. Killing a mosquito *before* it bites relies on a **Precautionary Principle** (it *might* harm me). If the justification is "it's a disease vector," it is a statistical claim, not a contextual one. However, if the justification is "it's a bug in my house," it leans toward *Performative Pestification*. The moral weight here is low enough in most ethical systems that the circularity is rarely scrutinized.

  ### 5. Confidence and Uncertainty

  **Confidence Levels:**
  *   **High (90%+):** That **Contextual Moral Status** and **Social Construction of Pests** are the correct established frameworks for the general phenomenon.
  *   **High (90%+):** That **Speciesism** is the incorrect term, as you surmised.
  *   **Medium (70%):** That **Performative Pestification** is a useful and accurate coinage for the specific circularity. It synthesizes existing concepts (Searle's status functions + animal ethics) but is not a dictionary term.
  *   **Medium (60%):** The boundary case analysis (ethics is highly debated, and reasonable philosophers disagree on the mosquito/raccoon specifics).

  **Point of Least Certainty:**
  I am least certain that **no obscure, single-word term exists** in translated continental philosophy (e.g., French or German environmental ethics) that captures this exact circularity. While no such term exists in mainstream Anglo-American analytic ethics, there is a possibility that a term like *"Verminisierung"* (Vermin-ization) exists in German critical theory that functions similarly to my coinage. I am flagging this because the literature is vast, and niche terminology often exists outside standard English databases.

  ### Summary
  You have identified a gap between **Relational Ethics** (which admits context matters) and **Moral Consistency** (which demands reasons for the shift). The established name for the *shift* is **Contextual Moral Status**. The established name for the *labeling* is the **Social Construction of Pests**. The name for the *circular logic* you spotted is not standard; I propose **Performative Pestification** to describe the mechanism where the classification creates the moral reality it claims to describe.
