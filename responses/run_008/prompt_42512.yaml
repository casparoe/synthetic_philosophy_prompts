      *Actually, Claim 5 (Metric) is arguably the most load-bearing philosophically. If you define success as reproduction, farming wasn't a disaster. The "disaster" verdict *depends* on rejecting reproductive success as the metric. So Claim 5 is top tier.*
      *Claim 2 (Health) is the empirical basis. If health didn't decline, the verdict fails regardless of metric. So Claim 2 is top tier.*
