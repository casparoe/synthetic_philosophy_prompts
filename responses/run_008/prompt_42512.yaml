              2.  Claims to cut or caveat heavily.
              3.  Open empirical/conceptual questions that would change the ranking.
              4.  Assessment of Claim 6 (Present-day slide).
      *   **Constraint:** "A specialist in this literature should not wince at any row of the table." (High accuracy/nuance required).

  2.  **Evaluate the Six Claims (Mental Sandbox):**

      *   *Claim 1 (Leisure):* Sahlins' "Original Affluent Society." Evidence is mixed. Lee's !Kung study is famous but contested (seasonality, definition of work). Recent time-allocation studies show variability. Is it load-bearing? If farmers worked harder but lived better (nutrition/security), the "disaster" verdict weakens. But the core argument is often about *quality* of life (health) more than just hours worked. However, the "harder work" narrative is central to Diamond's "worst mistake."
      *   *Claim 2 (Body as Archive):* Skeletal evidence (Cohen, Armelagos, etc.). Stature decline, enamel hypoplasia, infectious disease increase in early agriculturalists. This is the strongest empirical pillar. If early farmers were healthier than foragers, the "disaster" narrative collapses. Load-bearing? Yes, highly.
      *   *Claim 3 (Inequality):* Storage leads to hierarchy (Testart, Woodburn, Scott). Contested. Some hunter-gatherers had hierarchy (NW Coast); some early farmers were egalitarian (Çatalhöyük debates). Is it load-bearing for the "disaster for *people*" argument? Less so than health. It's more about social structure than individual welfare, though inequality affects welfare.
      *   *Claim 4 (Trap/Choice):* The "ratchet" effect (Blumberg, Diamond). Demographic trap. If it was a conscious choice for better life, it wasn't a mistake. If it was a trap, the "mistake" label holds even if individuals suffered. Load-bearing? Yes, for the "worst mistake" rhetoric.
      *   *Claim 5 (Ambiguity of Verdict):* Individual welfare vs. reproductive success (Dawkins-ish view). Farmers outbred foragers. If the metric is genetic propagation, farming was a success. If metric is quality of life, failure. Load-bearing? Yes, this defines the *metric* of the verdict.
      *   *Claim 6 (Present-day Slide):* Evolutionary mismatch, paleo diet, etc. This is an extrapolation, not evidence for the historical verdict itself. Load-bearing for the *historical* verdict? No. It's a consequence/application.

  3.  **Drafting the Table (Iterative refinement for accuracy):**

      *   *Claim 1 (Leisure):* Evidence is highly variable by ecology; the "20-hour work week" is an outlier rather than a rule. Load-bearing? Moderate. If farmers worked harder but were healthier, the disaster claim weakens. Confidence: Moderate (ethnographic analogy issues).
      *   *Claim 2 (Body):* Evidence is robust across multiple regions (Near East, Americas, Europe) showing health decline initially. Load-bearing? Yes, this is the primary empirical proxy for welfare. Confidence: High.
      *   *Claim 3 (Inequality):* Evidence is mixed; storage correlates with hierarchy but isn't deterministic (e.g., Neolithic Anatolia). Load-bearing? Low for individual welfare, high for social structure claims. Confidence: Moderate.
      *   *Claim 4 (Trap):* Demographic evidence supports population pressure, but agency is hard to archaeologically detect. Load-bearing? Yes, explains *why* the mistake persisted. Confidence: Moderate.
      *   *Claim 5 (Ambiguity):* Demographic expansion is fact; welfare decline is the counterpoint. Load-bearing? Yes, defines the ethical metric. Confidence: High (conceptually).
      *   *Claim 6 (Present-day):* Evidence for mismatch is medical/evolutionary theory, not archaeological. Load-bearing? No, this is an extrapolation. Confidence: Speculative (regarding specific modern implications).

      *Refining for "Specialist won't wince":*
      *   Claim 1: Need to acknowledge the "definition of work" problem explicitly.
      *   Claim 2: Acknowledge regional variation (some areas show less decline) but the general trend is robust.
      *   Claim 3: Acknowledge complex hunter-gatherers.
      *   Claim 4: Acknowledge it's a model, not directly observable.
      *   Claim 5: Distinguish between evolutionary success and welfare.
      *   Claim 6: Distinguish between historical fact and modern prescription.

  4.  **Drafting the Sections:**

      *   *Section 1 (Ranking):* Criterion: "Necessity for the 'Disaster' Verdict." If the claim is false, does the verdict collapse?
          *   Top: Body (Health) - If farmers were healthier, "disaster" is hard to sustain.
          *   Top: Ambiguity (Metric) - Defines what "disaster" means.
