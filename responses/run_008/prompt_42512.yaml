      *   **Task:** Identify load-bearing claims vs. decorative/contested ones.
      *   **Input:** Six specific claims provided by the user (Leisure, Body as Archive, Inequality, Trap/Choice, Ambiguity of Verdict, Present-day Slide).
      *   **Output Format:**
