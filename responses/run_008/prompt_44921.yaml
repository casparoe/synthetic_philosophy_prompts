answer: |-
  You have stumbled directly into one of the most heated, technical, and existentially vertiginous debates in late-20th-century philosophy of mind. You are absolutely right that this is not just "Twin Earth" again, and you are right that "self-knowledge" is too vague.

  The overarching predicament you are describing is known as **The Compatibility Problem** (or sometimes **The Tension**) **between Semantic Externalism and Privileged Access.**

  Your intuition that the two halves are connected is correct. They are the offensive and defensive lines of the same battle: if meaning is outside the head, what happens to the special authority I have over what is *inside* my head?

  Here is the breakdown of the names, the arguments, the lightning duplicate, and how they fit together.

  ### 1. The Umbrella Name
  The general field is **Externalism about Mental Content**. The specific problem you are losing sleep over is the **Problem of Privileged Access** (or **First-Person Authority**).

  "Privileged Access" is the traditional philosophical claim that you have a special, immediate, non-empirical way of knowing your own thoughts. You don't need to observe your behavior or scan your brain to know you are thinking about water; you just *know*. Externalism threatens to break this link.

  ### 2. The Two Halves (They Have Specific Names)

  You identified two distinct directions of attack. Philosophers have indeed named them separately.

  #### Half A: The "Switch" Worry
  **Name:** **The Slow Switching Argument**
  **Key Figures:** Paul Boghossian (1989), Tyler Burge (1988).

  This is exactly your first scenario. You are moved from Earth to Twin Earth slowly enough that you don't notice the change in the environment, but fast enough that your concepts switch reference.
  *   **The Argument:** If Externalism is true, the content of your thought depends on your environment. If you are switched without knowing it, you cannot know by introspection alone whether you are thinking about *water* (H₂O) or *twater* (XYZ).
  *   **The Consequence:** This implies **Self-Intimation Failure**. It suggests you can be wrong about, or ignorant of, the very contents of your own current thoughts. It turns self-knowledge into an empirical investigation (I need to check my surroundings to know what I'm thinking).
  *   **Why it bugs you:** It violates the Cartesian intuition that the mind is transparent to itself.

  #### Half B: The "Armchair" Worry
  **Name:** **The McKinsey Paradox** (or **The McKinsey Problem**)
  **Key Figure:** Michael McKinsey (1991).

  This is your second scenario. It runs the logic in reverse.
  *   **The Argument:**
      1.  I can know a priori (from the armchair) that I am thinking that water is wet. (Privileged Access)
      2.  I can know a priori that if I am thinking that water is wet, then water (H₂O) must exist in my environment. (Externalism)
      3.  Therefore, I can know a priori that water exists in my environment.
  *   **The Consequence:** This implies **A Priori Knowledge of the World**. It suggests you can deduce the existence of physical stuff just by thinking about your thoughts. This violates the empiricist intuition that you need sensory experience to know about the external world.
  *   **Why it bugs you:** It feels like magic. It collapses the distinction between conceptual truth and empirical fact.

  ### 3. How They Relate
  You asked if they are one single thing. Structurally, **yes**. They are the *modus ponens* and *modus tollens* of the same dilemma.

  *   **Slow Switching** says: If Externalism is true, Privileged Access is false (because you can't tell which content you have).
  *   **McKinsey** says: If Externalism is true AND Privileged Access is true, then Magic (a priori world-knowledge) is true.

  Since Magic is unacceptable, most philosophers try to save Privileged Access by modifying Externalism, or they save Externalism by modifying Privileged Access. The "tangle" is the attempt to keep Externalism, Privileged Access, and No-Magic all true at the same time. This position is called **Compatibilism**.

  ### 4. The Lightning Duplicate
  **Name:** **Swampman**
  **Key Figure:** Donald Davidson (1987).

  Your friend's mumbled thought experiment is **Swampman**.
  *   **The Story:** A lightning bolt strikes a swamp and, by pure chance, assembles a molecule-for-molecule duplicate of you. It walks out, talks like you, remembers your childhood, and writes philosophy.
  *   **The Relevance:** Davidson argued Swampman *has no thoughts*. Why? Because it has no causal history. It never interacted with water, other people, or objects. Its sounds are just noises, not words.
  *   **Connection to your worry:** Swampman is the ultimate version of your "Switch" worry. If you are Swampman, you *feel* like you are thinking about water, but you aren't thinking about anything at all. This radicalizes the fear that introspection is unreliable. If a perfect duplicate can have zero content, how can you ever be sure *you* have content just by looking inside?

  ### 5. Is There a Way Out? (So You Can Sleep)
  Philosophers have not left this as a raw nerve for 40 years. There are established "moves" to resolve the tension.

  1.  **The Reliabilist Move (Burge):** We *do* have privileged access, but it's not because we inspect the content. It's because the mechanism that produces the belief "I am thinking X" is reliably connected to the thought X. Even if the content depends on the environment, the *self-ascription* is reliable.
  2.  **The Disjunctivist Move:** When you are on Earth, you are thinking about Water. When you are on Twin Earth, you are thinking about Twater. These are different mental states. You can tell them apart because they *are* different, even if they feel the same. (This is a hard sell).
  3.  **The "Empty Concept" Move:** Some argue that in the Switch scenario, during the transition period, your concept is actually indeterminate. You aren't thinking about H₂O or XYZ; you are thinking about "water-ish stuff." Therefore, you aren't wrong about your thought; your thought is just vague.
  4.  **Denying the McKinsey Premise:** Some argue that while you know a priori that you are thinking about water, you do *not* know a priori that thinking about water requires H₂O. That link is an empirical philosophical discovery, not something built into the thought itself.

  ### Summary for your filing cabinet:
  *   **The Big Problem:** The Compatibility of Externalism and Privileged Access.
  *   **The "Switch" Half:** The Slow Switching Argument (threatens self-ignorance).
  *   **The "Armchair" Half:** The McKinsey Paradox (threatens a priori world-knowledge).
  *   **The Lightning Guy:** Swampman (threatens the existence of content entirely).
  *   **The Feeling:** You are experiencing **Semantic Skepticism** regarding the first-person perspective.

  You are in good company. This triad (Slow Switching, McKinsey, Swampman) constitutes the "Holy Trinity" of externalist anxiety. It is not a confusion on your part; it is the central fault line in the philosophy of mind.
