  *(Refining the Sen point)*: Sen's capability approach is huge, but the specific SCT contribution (informational basis) is somewhat settled. I should rank it lower for a *dissertation* because it's hard to be novel there without writing a book on welfare economics.

  *(Refining the Deliberation point)*: This is the sweet spot. It uses logic (epistemic), addresses democracy, and bypasses the "static" critique of Arrow.

