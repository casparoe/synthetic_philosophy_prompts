      *   *Key Distinction:* Case 2 had *no petition*. Case 3 had a petition and *constitutive harm*. The Industrialist has a petition and *constitutive harm*. This suggests Removal is the consistent choice *unless* the "Civic Benefit" outweighs the harm (which it didn't for the Doctor).

  7.  **Finalizing the Advice:**
