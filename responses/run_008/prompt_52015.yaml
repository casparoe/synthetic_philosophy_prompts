answer: |-
  This is a classic "case law" problem. You don't have a statute; you have a common law tradition built on five prior rulings. To be consistent, you need to extract the *ratio decidendi* (the reasoning behind the decision) from your past votes.

  Here is an analysis of your panel's actual operating rules, the implications for the Industrialist case, and a stress test to help you finalize your philosophy.

  ### 1. Decoding the Precedents: Two Competing Rules

  Looking at your five past cases, there are two distinct principles that explain your outcomes. The tension in the new case arises because these two principles point in opposite directions.

  **Rule A: The "Constitutive Harm" Principle (The Doctor/General Precedent)**
  *   **The Logic:** If the harm caused by the honoree is *intrinsic* to the achievement they are commemorated for, the memorial must come down.
  *   **Evidence:**
      *   *Case 1 (General):* Commemorated for Confederate leadership; that leadership was defined by the defense of slavery/intimidation. (Removed)
      *   *Case 3 (Doctor):* Commemorated for a medical breakthrough; the breakthrough was *made of* non-consensual experimentation. (Removed)
      *   *Case 4 (Militia):* Commemorated for leadership; leadership was defined by massacre. (Removed)
  *   **The Threshold:** Removal occurs when the "sin" is the engine of the "success."

  **Rule B: The "Civic Utility" Principle (The Founder/Labor Precedent)**
  *   **The Logic:** If the honoree provided a lasting civic infrastructure that benefits everyone, and the harm is viewed as a "flaw of the times" or separate from their civic contribution, the memorial stays with context.
  *   **Evidence:**
      *   *Case 2 (Founder):* Owned slaves (harm), but commemorated for founding the town/school (civic utility). (Kept)
      *   *Case 5 (Labor):* Segregationist (harm), but commemorated for labor organizing (civic utility). (Kept)
  *   **The Threshold:** Contextualization occurs when the "success" can be theoretically separated from the "sin," or when the civic benefit is deemed to outweigh the historical baggage.

  **The Procedural Wildcard:**
  There is a third, quieter rule in your record: **Reactivity.**
  *   Cases 1, 3, and 4 (Removal) all had **active petitions** from affected groups.
  *   Cases 2 and 5 (Context) had **no petitions.**
  *   *Observation:* Your panel has never removed a statue *sua sponte* (on its own initiative). You require a petition to trigger the "Constitutive Harm" analysis.

  ### 2. The New Case: The Industrialist

  The Industrialist sits squarely in the crosshairs of Rule A and Rule B.

  *   **Arguments for Removal (Rule A / Case 3 Analog):**
      *   Like the Doctor, his "achievement" (the mills/wealth) was directly built on the bodily harm of vulnerable people (child labor/death).
      *   Like the General and Militia leader, there is an active petition from descendants of the harmed.
      *   The harm is not a "side note"; it is the fuel of the industry.
  *   **Arguments for Context (Rule B / Case 2 Analog):**
      *   Like the Founder, he literally built the town's infrastructure (library, park, mills).
      *   The square is informally named after him; removal causes civic disruption.
      *   The family is still present and benevolent (unlike the Doctor's estate or the Confederate association).

  **Closest Analog:**
  **Case 3 (The Doctor)** is the strongest moral and logical precedent.
  *   *Why:* In Case 2 (Founder), there was no petition. In the Industrialist case, there *is* a petition. Once a petition exists, your record shows you move from "Civic Utility" mode to "Constitutive Harm" mode.
  *   *The Parallel:* The Doctor's breakthrough and the Industrialist's mills are functionally identical: civic goods purchased with human suffering. In Case 3, you decided that the suffering invalidated the commemoration.

  ### 3. Implications of Your Vote

  Here is what each choice commits you to for future cases.

  **Option 1: Remove the Statue**
  *   **Consistency:** Aligns with Cases 1, 3, and 4. It upholds the principle that you cannot commemorate an achievement if the achievement relies on exploitation, especially when victims' descendants object.
  *   **The Cost:** You undermine Case 2 (The Founder). If the Industrialist goes because his wealth came from child labor, why does the Founder stay when his wealth came from slave labor?
      *   *Future Commitment:* You must be prepared to remove the Founder's street name if a petition ever arises. You are establishing that "Town Founder" status is not immunity if the founding relied on exploitation.
  *   **The Message:** "Harm to the vulnerable outweighs civic benefit."

  **Option 2: Keep with Reinterpretation**
  *   **Consistency:** Aligns with Cases 2 and 5. It upholds the principle that civic infrastructure and town identity have value independent of the moral failings of the builder.
  *   **The Cost:** You undermine Case 3 (The Doctor). You are effectively ruling that "Building a Town" is a higher good than "Medical Breakthroughs," or that dead child laborers matter less than non-consensual medical patients.
      *   *Future Commitment:* You are establishing a "Grandfather Clause" for economic founders. As long as a figure built physical infrastructure (libraries, parks), their labor abuses can be contextualized rather than removed.
  *   **The Message:** "Civic utility and stability outweigh historical harm."

  ### 4. The Stress Test: Distinguishing "Legacy" vs. "Ongoing Harm"

  You suspect your real rule splits between **Primary Legacy** (What did they do?) and **Ongoing Harm** (Who is still hurting?). To find out which one actually drives your panel, propose this hypothetical case at your next strategy session:

  **The Hypothetical Case: The Public Health Director**
  > A statue of a mid-20th-century Public Health Director.
  > *   **Primary Legacy:** He eradicated a deadly tuberculosis outbreak in the city, saving thousands of lives. The city hospital wing is named after him.
  > *   **The Harm:** To stop the spread, he forcibly quarantined and sterilized residents of a specific immigrant neighborhood.
  > *   **The Petition:** Descendants of that neighborhood are still in the city, bear the generational stigma of the sterilization, and have petitioned for removal.
  > *   **The Civic Factor:** Unlike the Industrialist, he didn't build the town's economy, but he saved its population.

  **How this exposes your rule:**
  *   **If you vote to KEEP the Health Director:** Your true rule is **Primary Legacy.** You believe that saving the city (or building the city) grants immunity, regardless of the specific community harmed. *Implication for Industrialist:* You should keep the Industrialist.
  *   **If you vote to REMOVE the Health Director:** Your true rule is **Ongoing Harm to a Living Community.** You believe that if a specific group of living citizens bears the scar of the honoree's actions, the memorial cannot stand, regardless of how many lives were saved. *Implication for Industrialist:* You should remove the Industrialist.

  ### Recommendation for the Vote

  If you want to be strictly consistent with your **active** precedents (Cases 1, 3, 4 where petitions existed), **removal is the only logically consistent vote.**

  In every instance where a directly affected group petitioned you about harm that was *intrinsic* to the honoree's fame (General, Doctor, Militia), you removed the memorial. The "Founder" case is an outlier only because no one asked you to act. The Industrialist case has the petition.

  If you keep the statue, you are creating a new exception for "Economic Founders" that you did not apply to the "Medical Founder" (The Doctor). You would need to articulate why a mill is more sacred than a medical cure, or why child labor is less grievous than non-consensual experimentation. If you cannot make that distinction clearly, the precedent points to removal.
