              *   *Legacy Rule:* Keep (He saved the city).
              *   *Harm Rule:* Remove (Living community bears the scar).

  6.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Correction on Case 2:* The prompt says "Nobody petitioned." This is a huge procedural differentiator. The panel didn't *choose* to keep the Founder; no one asked them to move him.
