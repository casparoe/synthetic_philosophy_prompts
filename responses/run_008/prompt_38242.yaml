      *   *Economist:* Firms/Production. *Reply:* The argument applies to rights assignment. Coasean bargaining inside firms presupposes initial entitlements. The Chamberlain point holds: if initial entitlements are equal, internal bargaining shifts distribution. *Soft spot:* Transaction costs make "voluntary" messy.

