      *   *Idea 3: The "System Log" Simulation.* Treat the brain like a distributed system. Ask them to write the "log entries" for the Color-Phi event.
          *   *Critique:* Good for engineers, but might bypass the *feeling* of consciousness.
      *   *Idea 4: The "Commitment Protocol" (Selected).* Use the illusions as "bug reports." The engineers are debugging the "Consciousness Module." They must file a ticket specifying *exactly when and where* the data was finalized. This leverages their mental models (latency, buffers, rendering) to expose the philosophical trap. It makes the Cartesian Theater a specific architectural claim (a single render buffer) rather than a vague metaphor.

  3.  **Developing the "Commitment Protocol" Design:**
      *   **Phase 1: Experience (15 mins).** Run the illusions. Keep it empirical.
      *   **Phase 2: The Debugging Ticket (20 mins).** This is the core. They must define the "Timestamp of Experience."
      *   **Phase 3: The Architectural Review (25 mins).** Split into two teams: "Stream Processing" (Real-time) vs. "Batch Processing" (Delayed/Edited). They must defend their architecture against the evidence.
