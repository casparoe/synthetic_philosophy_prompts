      *   **Constraints:** No lecturing up front. Must force commitment *before* theory is named. Debrief maps activity to theory. Must include "what goes wrong" and "what this activity can't do."
      *   **Process:** Brainstorm internally first, then commit to one design.

  2.  **Internal Brainstorming & Selection:**
