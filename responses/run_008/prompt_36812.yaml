      *   *The Econ Friend's Objection:* The friend says it's an artifact of cardinal measurability. This is partially right (ordinal utility doesn't sum), but welfare economics *presumes* some comparability for policy. Dismissing it entirely ignores the normative force of the intuition. The dissertation should *address* this, not run from it.

  4.  **Drafting the Argument:**

      *   **Thesis:** Prioritize (b) Aggregation, grounded by (a) but applied through (d). Avoid making (a) the core.
