prompt: |-
  I've been having an argument with my brother about whether the world is less violent than it used to be, and instead of the usual hand-waving I figured I'd just list my gut verdicts on cases and see what principle, if any, is behind them. Per capita battle deaths falling steadily since WWII: less violent, clearly. Small-scale tribal warfare killing a comparable or higher share of its (much smaller) population than WWII killed of the world: I still say the tribal world was worse, though I can't articulate why that feels so obvious to me. The Rwandan genocide packing most of a million murders into a hundred days: that makes me doubt the whole "modern world is more peaceful" thing. Sanctions that kill kids through malnutrition and wrecked healthcare: I don't want to count that as violence, but the kids are just as dead. Factory farming killing tens of billions of animals a year: if animals count, and I really do think they count, this is the most violent period in history by orders of magnitude — and yet I still balk at saying the present is more violent than the Mongol conquests. Car crashes: not violence. Deaths from diseases that cheap policy could have prevented in poor countries: somewhere in between. And on measurement, I go by per capita rates, not absolute numbers — the world getting bigger shouldn't count against it — but when I imagine billions of absolute future deaths from some catastrophe, I don't discount that at all. So: is there a principle about what counts as violence and which measure is the right one that captures all or most of these, what does it say about cases I haven't listed, and which of my verdicts does it force me to drop? Also tell me honestly whether you think there's even a fact of the matter about whether the world is "less violent" versus it just being a definitional choice.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Core Question:** Is the world less violent than it used to be?
      *   **Context:** The user is arguing with their brother. They have a list of "gut verdicts" on specific cases (WWII battle deaths, tribal warfare, Rwandan genocide, sanctions, factory farming, car crashes, preventable disease).
      *   **Task:**
          1.  Identify a unifying principle behind their verdicts (what counts as violence, what measure to use).
          2.  Apply this principle to cases they haven't listed.
          3.  Identify which of their verdicts the principle forces them to drop/revise.
          4.  Answer the meta-question: Is there a "fact of the matter" or is it just definitional?
      *   **Tone:** Honest, analytical, philosophical but grounded. Avoid hand-waving.

  2.  **Deconstruct the User's Verdicts:**
      *   *WWII Battle Deaths (Per Capita falling):* Less violent. (Focus: Intentional human-on-human physical harm, state-level).
      *   *Tribal Warfare (High per capita):* Worse than modern world. (Focus: Intensity relative to population, despite small absolute numbers).
      *   *Rwandan Genocide (High intensity, short time):* Doubts the "peaceful modern world" thesis. (Focus: Intentional mass killing, moral horror).
      *   *Sanctions (Indirect death):* Don't want to count as violence, but kids are dead. (Focus: Intent vs. Outcome, structural vs. direct).
      *   *Factory Farming (Animal death):* Most violent if animals count, but balk at comparing to Mongols. (Focus: Moral status of victims, intent/indifference).
      *   *Car Crashes:* Not violence. (Focus: Intent/Accident vs. Malice).
      *   *Preventable Disease (Structural neglect):* Somewhere in between. (Focus: Negligence vs. Active harm).
      *   *Measurement:* Per capita preferred, but absolute numbers matter for future catastrophes.

  3.  **Search for a Unifying Principle:**
      *   *Candidate 1: Direct Intentional Harm.* (Explains WWII, Tribal, Rwanda. Excludes Cars, Disease, Sanctions, Farming).
          *   *Problem:* User feels uneasy about Sanctions/Disease ("kids are just as dead"). User hesitates on Farming ("I really do think they count").
      *   *Candidate 2: Suffering/Death Per Capita.* (Explains Tribal vs. WWII. Explains Per Capita preference).
          *   *Problem:* Doesn't distinguish Cars from Violence. Doesn't explain why Mongols feel worse than Factory Farming despite lower numbers.
      *   *Candidate 3: Agency and Moral Responsibility.* (Violence requires an *agent* inflicting harm on a *moral patient* against their will).
          *   *Refinement:* The user seems to distinguish between *political violence* (war, genocide) and *structural/systemic harm* (sanctions, disease) and *accidental harm* (cars) and *non-human harm* (animals).
      *   *The "Human Agency on Human Victims" Principle:* The user's gut seems to prioritize *intentional human-inflicted death upon other humans* as the core definition of "violence" for historical comparison, but they feel moral tension when structural neglect or animal suffering reaches massive scales.
      *   *The "Per Capita Risk of Intentional Harm" Principle:* This fits best. It explains why Tribal (high risk per person) feels worse than WWII (lower risk per person globally), why Cars (unintentional) don't count, and why Sanctions/Disease (structural/unintentional-ish) are "in between."

  4.  **Develop the Principle (The "Intentional Per Capita Harm" Framework):**
      *   **Definition:** Violence = Intentional infliction of physical harm by human agents upon moral patients.
      *   **Metric:** Per capita rate of death/suffering.
      *   **Weighting:** Human victims > Animal victims (in the user's current gut, though they question this). Direct intent > Structural neglect.
      *   **Why Tribal feels worse:** The *probability* of dying violently if you existed in that society was higher.
      *   **Why Rwanda hurts the thesis:** It shows the *potential* for high per capita violence still exists in modernity.
      *   **Why Factory Farming is an outlier:** It breaks the "Human Victim" rule. If the user includes animals, the modern era is the worst. The fact they "balk" suggests they are secretly using a "Human-Centric" definition despite their moral belief.

  5.  **Address the "Fact of the Matter" Question:**
      *   Is it objective? No. "Violence" is a category we impose on reality.
      *   Is it arbitrary? No. It tracks specific moral intuitions about agency and risk.
      *   *Verdict:* It's a definitional choice, but not a *trivial* one. It depends on what you value (individual risk vs. total suffering, human vs. animal, intent vs. outcome). Steven Pinker's *The Better Angels of Our Nature* argument relies on a specific definition (state-monopolized force reducing interpersonal violence). Critics rely on broader definitions (structural violence). Both are "true" within their frameworks.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the complexity. Validate the user's intuition that this isn't just data, it's taxonomy.
      *   *Section 1: Extracting the Principle.*
          *   Identify the tension: Outcome (dead kids) vs. Mechanism (intent).
          *   Propose the principle: **"Per Capita Risk of Intentional Human-Agent Harm."**
          *   Explain how this fits their verdicts:
              *   WWII/Tribal: Fits (Intentional, Human, Per Capita).
              *   Cars: Excluded (Unintentional).
              *   Sanctions/Disease: Ambiguous (Structural intent vs. Direct).
              *   Animals: Excluded (Non-human), explaining the "balk."
      *   *Section 2: Forced Revisions.*
          *   If they stick to this principle, they must admit Factory Farming *isn't* violence in this specific historical comparison context (which feels morally wrong to them).
          *   Or, if they include Animals, they must admit Modernity is the *most* violent era (dropping the Mongol comparison).
          *   They need to resolve the Sanctions/Disease ambiguity. Is negligence violence? (Structural Violence concept).
