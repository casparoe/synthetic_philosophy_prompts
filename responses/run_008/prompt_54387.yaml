answer: |-
  This is an excellent exercise in moral taxonomy. You are discovering that "violence" is not a natural kind like "water" or "gold"; it is a category we construct to serve a specific moral or analytical purpose. Your gut verdicts are inconsistent because you are unconsciously switching between three different definitions of violence depending on the case.

  Here is an analysis of the principle behind your verdicts, the contradictions it exposes, and the honest answer to your meta-question.

  ### 1. The Unifying Principle: "Per Capita Risk of Intentional Human-Agent Harm"

  If we look at where you draw the line, your operating principle isn't "total suffering" or "total deaths." It is **the individual's statistical probability of being intentionally killed by another human.**

  Here is how this principle maps to your verdicts:
  *   **WWII vs. Tribal Warfare:** You prioritize *per capita* rates. Even though WWII had higher absolute numbers, the *risk* to any specific human alive during WWII was lower than the risk to a specific human in a high-intensity tribal society. This explains why you feel the tribal world was "worse" for the individual living in it.
  *   **Car Crashes:** You exclude these because they lack *intent*. They are accidents, not aggression.
  *   **Rwanda:** This hurts your thesis because it spikes the *per capita intentional risk* dramatically in the modern era, proving the "risk" hasn't gone to zero.
  *   **Factory Farming:** You "balk" at counting this against the Mongols because your *operational* definition of violence implicitly requires **human victims**, even if your *moral* philosophy says animals count. You are comparing human-on-human violence (Mongols) to human-on-animal violence (Farming).
  *   **Sanctions/Disease:** You place these "in between" because they lack *direct agency*. No one pulled a trigger. This is the realm of **structural violence** (harm caused by systems), which feels different from **direct violence** (harm caused by an actor).

  **The Principle:** *The world is less violent if the average human's lifetime risk of dying by the intentional hand of another human is lower.*

  ### 2. Which Verdicts Does This Force You to Drop?

  If you stick rigidly to this principle to resolve your argument, you have to make some uncomfortable sacrifices:

  **A. You must drop the moral weight of Factory Farming *for this specific comparison*.**
  You wrote: *"if animals count... this is the most violent period in history... and yet I still balk."*
  You cannot have it both ways. If you are measuring "Violence in History," you must define the victim class.
  *   **Option 1:** Victims = Sentient Beings. **Verdict:** The modern era is the most violent in history by orders of magnitude. You must concede the argument to your brother regarding human war, but win on total suffering.
  *   **Option 2:** Victims = Humans. **Verdict:** Factory farming is irrelevant to the "violence" metric. You must suppress your moral intuition that animal death counts *for the purpose of this specific historical metric*.
  *   **The Forced Drop:** You have to admit that your "balk" is a definitional cheat. You are excluding animals to preserve the "modern world is less violent" thesis.

  **B. You must resolve the "Sanctions/Disease" ambiguity.**
  You said these are "somewhere in between." A principle demands a binary.
  *   If violence requires a *proximate actor* (someone swinging a sword), sanctions are not violence. They are policy outcomes.
  *   If violence includes *foreseeable neglect* (Johan Galtung's concept of Structural Violence), then sanctions and preventable disease **are** violence.
  *   **The Forced Drop:** If you include structural violence, the "modern world is less violent" thesis collapses, because structural violence (via global inequality) kills far more people today than direct warfare. If you exclude it, you must accept that a child starved by a blockade is not a victim of violence, which feels morally hollow.

  **C. You must reconcile Per Capita vs. Absolute Numbers.**
  You prefer per capita, but worry about "billions of absolute future deaths."
  *   **The Forced Drop:** If a catastrophe kills 10% of humanity in 2100 (per capita low-ish) vs. 50% of humanity in 1400 (per capita high), your principle says 1400 was worse. But your intuition says the *absolute loss* of billions of future lives is a unique horror. You need to decide if you are measuring **Safety** (per capita risk) or **Tragedy** (absolute loss).

  ### 3. Application to Unlisted Cases

  If we apply the **"Per Capita Risk of Intentional Human-Agent Harm"** principle consistently, here is how you must judge new cases:

  *   **Domestic Violence:** This is the biggest blind spot in the "world is less violent" thesis (often associated with Steven Pinker). War deaths are down, but intimate partner violence remains high.
      *   *Verdict:* If you count this, the decline in violence is less steep, because a huge portion of violence against women has always been private, not public.
  *   **Drone Warfare:**
      *   *Verdict:* Low per capita risk to the global population, high intent. Fits the "less violent" thesis, but creates psychological distance that might mask the reality of the harm.
  *   **Climate Change:**
      *   *Verdict:* This is like Sanctions. It is structural. If we define violence as "foreseeable harm caused by human activity," climate change is extreme violence. If we define it as "intent to kill," it is an externality. Your principle forces you to categorize it: is it a "car crash" (unintended side effect) or "sanctions" (foreseeable policy outcome)?
  *   **Incarceration:**
      *   *Verdict:* The US has a high per capita rate of state-inflicted liberty deprivation. Is loss of liberty violence? If yes, the modern West looks worse. If no, it looks better.

  ### 4. The Honest Meta-Answer: Is there a Fact of the Matter?

  **No. There is no fact of the matter.**

  "Violence" is not a variable waiting to be measured; it is a lens you choose to look through. The question "Is the world less violent?" is actually three different questions, and the answer depends on which one you ask:

  1.  **Is the individual safer?** (Per capita risk of direct intentional harm).
      *   *Answer:* **Yes.** You are statistically much less likely to be stabbed, shot, or beaten to death than your ancestors were. This is the Steven Pinker / *The Better Angels of Our Nature* argument. It relies on state monopolization of force.
  2.  **Is there less total suffering inflicted by humans?** (Absolute numbers + Structural + Animals).
      *   *Answer:* **Probably No.** When you add factory farming, structural deprivation, and absolute population growth, the total volume of suffering we cause is likely at an all-time high.
  3.  **Is the *capacity* for violence lower?** (Potential catastrophe).
      *   *Answer:* **No.** We have nuclear weapons and biotech. The *floor* is lower (daily safety), but the *ceiling* is higher (existential risk).

  **The Verdict on Your Argument:**
  You and your brother are likely arguing past each other because you are using different lenses.
  *   **You** are intuitively looking at **Total Moral Responsibility** (which includes animals, structural neglect, and absolute numbers).
  *   **Your Brother** is likely looking at **Individual Physical Security** (per capita risk of direct assault).

  **Recommendation:**
  Don't try to find the "true" definition. Instead, reframe the argument. Say: *"If we define violence as the per capita risk of a human being intentionally killed by another human, the world is less violent. But if we define it as the total amount of preventable suffering inflicted by human systems on sentient beings, the world may be more violent."*

  Your gut verdicts are trying to hold both truths at once. That's why they feel contradictory. You are sensing that **safety has increased, but moral responsibility has expanded.** We are better at not killing each other in fields, but worse at accounting for the deaths we cause in factories and supply chains.
