  Based on your friend's six prior verdicts, here is the analysis of her moral framework, predictions for the new cases, and the test required to probe her consistency.

  ### Predictions for the New Cases

  **(a) The Ordinary Engineer: Not Wrong.**
  Your friend distinguishes sharply between "executives" (Case 6) and ordinary agents (Cases 1, 3, 5). In Case 6, the wrongness stemmed from a *special responsibility* attached to the role, overriding the lack of individual impact. In Case (a), the agent is explicitly "ordinary," holds "no special authority," and her refusal changes nothing (no causal threshold, Case 4). This falls squarely into the "marginal act by ordinary agent" category of Cases 1, 3, and 5.

  **(b) The Weekend Meat-Eater: Wrong.**
  This mirrors Case 2. Your friend explicitly locates wrongness in the "whole pattern" of a life when individual acts are harmless. Case 2 involved "every month" and "every meal"; Case (b) involves "every weekend" for "decades." While less frequent than Case 2, it constitutes a sustained, acknowledged, and avoidable participation in a harmful practice. The principle of *cumulative lifestyle responsibility* applies here.

  **(c) The Mayoral Spite Vote: Wrong.**
  This is the closest call, but the probability shift is decisive. In Case 5 (national election), the chance of deciding was "all but certain not to" (effectively zero). In Case (c), a 1-in-1,500 chance is statistically significant in a moral context, moving it from "negligible" to "non-negligible." While she grants immunity to negligible voting impacts (Case 5), she holds agents responsible for probable harms (Case 4) and sustained patterns (Case 2). A 1/1,500 risk of material harm, taken out of spite, likely crosses her threshold for *expected consequence* responsibility.

  ### Candidate Principles

  Two principles fit her existing record about equally well:

  1.  **The Disjunctive Responsibility Principle:** An act is wrong if it satisfies *any* of three distinct conditions: (i) it crosses a causal threshold (Case 4); (ii) it is performed by an agent with a special role-duty (Case 6); or (iii) it is part of a sustained, harmful life-pattern (Case 2). Isolated acts by ordinary agents with negligible impact are permissible (Cases 1, 3, 5).
  2.  **The Weighted Agency Principle:** Wrongness is a function of the agent's "moral leverage." Leverage is calculated by summing causal probability, role-based authority, and temporal duration. If the total leverage exceeds a *de minimis* threshold, the act is wrong. This explains Case 2 (duration adds leverage) and Case 6 (role adds leverage) without requiring hard categories.

  ### The Bet: Disjunctive Responsibility

  I would bet on the **Disjunctive Responsibility Principle**.

  **Why:** Your friend's reasoning relies on qualitative distinctions rather than quantitative scaling. She does not say the executive in Case 6 is *more* wrong than the voter in Case 5; she says one is wrong and the other is not. She does not say the single flight in Case 1 is *less* wrong than the pattern in Case 2; she says one is permissible and the other is not. This "on/off" switching suggests she uses categorical buckets (Role vs. No Role, Pattern vs. Isolated) rather than a sliding scale of agency. The Weighted Agency Principle struggles to explain why the executive's *nil* impact (Case 6) triggers wrongness while the voter's *nil* impact (Case 5) does not, unless "Role" is a binary switch, which collapses the principle back into Disjunctive Responsibility.

  ### Consistency Check

  Her record is **genuinely consistent**, though it requires a complex, multi-criterial taxonomy. It is not underdetermined; it is specifically *hybrid*.

  She avoids inconsistency by distinguishing the *source* of the obligation in each case:
  *   **Causal Source:** Case 4 (Threshold).
  *   **Institutional Source:** Case 6 (Role).
  *   **Temporal Source:** Case 2 (Pattern).
  *   **Absence of Source:** Cases 1, 3, 5 (No causation, no role, no pattern).

  The only tension is between Case 5 (National Vote) and Case (c) (Mayoral Vote). If she verdicts (c) as *Not Wrong*, she risks inconsistency with Case 4 (where probability matters). If she verdicts (c) as *Wrong*, she risks inconsistency with Case 5 (where voting seems immune). However, this is resolved if she treats "negligible probability" as a fourth category of permission. Since 1/1,500 is not negligible in the same way 1/10,000,000 is, she can maintain consistency by adjusting the probability threshold without altering the principle.

  ### The Decisive Test Case

  To separate **Disjunctive Responsibility** (Categories) from **Weighted Agency** (Scaling), you need a case where the categories are absent, but the "weight" is high.

  **The Case:**
  > A mid-level manager (not an executive, no special public duty) who signs a routine directive every day for 20 years. Each signature has a 1-in-10,000 chance of triggering a harmful event (too low to be a "threshold" on its own), but over 20 years, the *expected* number of triggered harms is roughly 0.7. She does this purely for convenience, knowing the risk.

  **The Predictions:**
  *   **Disjunctive Responsibility predicts: Not Wrong.**
      *   *Reasoning:* It fails all three tests. It is not a causal threshold (no single act guarantees harm). It is not a special role (she is mid-level, not executive). It is not a "lifestyle pattern" of consumption (Case 2) but a series of professional acts that individually fall below the threshold. Without a category to catch it, the act is permissible.
  *   **Weighted Agency predicts: Wrong.**
      *   *Reasoning:* The aggregation of probability over time (20 years) and the repetition of the act create sufficient "moral leverage." Even if no single category is triggered, the cumulative expected harm crosses the *de minimis* line.

  If she says **Wrong**, she is a Consequentialist at heart who uses categories as heuristics. If she says **Not Wrong**, she is a Deontologist of Structure who believes responsibility requires a specific *kind* of link (Role, Pattern, or Threshold), not just a accumulation of risk.
