          5.  Can a novel be structurally anti-Great-Man while narratively committed to individuals?
      *   **Constraint:** Separate settled from contested matters (Intentionalist vs. Functionalist debate, Weimar overdetermination, counterfactual history validity). Flag my own interpretive moves.

  2.  **Deconstruct Tolstoy's Position (The "Tolstoyan Lens"):**
      *   *Napoleon:* Depicted as deluded, believing he controls the battle, issuing orders that arrive too late or are irrelevant. At Borodino, he's a "child holding the ribbon inside a carriage."
      *   *Kutuzov:* Depicted as wise because he *doesn't* act. He sleeps at the Council at Fili. He understands the "spirit of the army." He yields to the inevitable (abandoning Moscow) rather than forcing a heroic stand.
      *   *Second Epilogue:* History is the sum of infinitesimal wills. Leaders are labels attached to events after the fact. Causality is complex, not linear. The "Great Man" is a servant of history, not its master.
      *   *Metaphysics:* Fatalism, determinism, the illusion of free will/consciousness.

  3.  **Address the Hitler/Weimar Counterfactual (The Historical Application):**
      *   *Tolstoyan View (Functionalist/Structuralist):* Hitler was a symptom. The conditions (Versailles, inflation, depression, antisemitism, elite conservatism) created the vacuum. Someone else (Göring, Strasser, Hugenberg) might have filled it, perhaps differently, but the *direction* (authoritarian, nationalist) was determined by the "swarm."
      *   *Counter-View (Intentionalist):* Hitler's specific ideology, charisma, and tactical decisions were unique. Without him, the NSDAP remains a fringe party. The Holocaust's specific radicalization is tied to his will.
      *   *Contested Status:* Must explicitly flag the Intentionalist vs. Functionalist debate (Ian Kershaw's "Working towards the Führer" is a middle ground). Must flag the "Overdetermination of Weimar" debate (Was democracy viable? Did the elites *want* Hitler or just use him?).
      *   *Tolstoy's Failure:* Tolstoy minimizes ideology. Nazism was intensely ideological and driven by a specific will to power that wasn't just a "resultant." Tolstoy's fatalism ignores human agency in *choosing* evil.

  4.  **Address the Metaphysics Question:**
      *   Can we keep the sociology without the mysticism?
      *   Yes. Modern social science (complexity theory, network theory) supports the "swarm" idea without needing Tolstoy's divine providence.
      *   However, stripping the metaphysics removes the *comfort* Tolstoy finds in it. For the novelist, the tension remains: if there's no fate, just chaos, the demagogue's responsibility is higher.

  5.  **Address the Novelistic/Dramatic Question:**
      *   *What fiction does:* It shows the *experience* of the leader. Kutuzov's boredom, his tears, his sense of powerlessness. It humanizes the "label."
      *   *Structural Historiography:* Explains *why* it happened.
      *   *Fiction:* Explains *how it felt* to be the vessel.
      *   *The Bias of Fiction:* Novels focus on consciousness. Consciousness feels like agency. To write an anti-Great-Man novel, you have to subvert the protagonist's sense of control. (e.g., *The Trial*, *Man Without Qualities*).

  6.  **Drafting the Response (Iterative refinement for tone and constraints):**
