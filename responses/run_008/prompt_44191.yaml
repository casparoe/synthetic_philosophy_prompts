  7.  **Refining the Hitler/Weimar Section (Crucial Step):**
      *   Need to be careful not to say "Hitler didn't matter." That's historically contentious.
      *   Need to frame it as: Tolstoy helps explain the *conditions* (the valley), but struggles with the *specificity* of the evil (the shape of the hill).
      *   Mention Ian Kershaw ("Working towards the Führer") as a synthesis.
      *   Mention the "Special Path" (Sonderweg) debate regarding Weimar.

