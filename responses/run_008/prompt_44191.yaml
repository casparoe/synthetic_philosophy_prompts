      *   Did I address the "what fiction dramatizes" question? Yes.
      *   Did I address Kutuzov specifically? Yes.

  10. **Final Polish:** Ensure the voice sounds like a knowledgeable literary critic/historian speaking to a peer. (Self-Correction: Avoid being too dry; the user is a novelist, they care about *drama*.)

  *(Self-Correction during drafting)*: I need to make sure I don't validate the "Weimar collapse was inevitable" thesis as fact. That is a major point of contention among historians. Some argue the elites *chose* to destroy democracy. Tolstoy's view might accidentally excuse the elites by calling it "fate." I must highlight this danger.

  *(Self-Correction on Tolstoy)*: Tolstoy isn't just saying "leaders don't matter." He's saying "leaders' *orders* don't cause events." But their *presence* acts as a focal point. I need to make that distinction clear for the novelist.

  *(Final Plan)*:
  1.  **Tolstoy's Mechanism:** Napoleon (delusion of control) vs. Kutuzov (wisdom of surrender). The Epilogue (calculus of wills).
  2.  **The Hitler Counterfactual:** Where Tolstoy works (structural preconditions) vs. where he breaks (ideological specificity). Flag the Intentionalist/Functionalist debate.
  3.  **Metaphysics:** Can we keep the sociology without the fatalism? Yes, but it changes the moral weight.
  4.  **The Novel's Capability:** The bias of focalization. How to write "passive agency."
  5.  **Settled vs. Contested:** A clear summary section.

