answer: |-
  Your friend's track record presents a fascinatingly strict profile. She is not a utilitarian (she refuses to sum mild pains against severe ones), nor is she a radical egalitarian who ignores numbers entirely (she saves the larger crew of miners). She occupies a specific niche within contractualism: one that permits aggregation only under narrow conditions. To predict her verdicts, we must distill her past decisions into competing principles of "reasonable rejection."

  ### Two Candidate Principles

  Based on her history, here are the two most plausible principles governing her reasoning:

  **1. The Identical-Claim Principle (ICP)**
  *   **Formulation:** We compare the strongest individual complaint on each side of the choice. Numbers count *only* to break ties when the individual complaints are of **exactly equal strength**. If one individual's burden is strictly greater than another's, the greater burden trumps the aggregate of the lesser burdens, regardless of how many lesser burdens there are.
  *   **Fit with Track Record:**
      *   *Miners:* Claims are identical (death/trapped). Numbers break the tie. (Consistent)
      *   *Analgesic:* Severe pain > Mild pain. The one severe claim trumps twenty mild claims. (Consistent)
      *   *Broadcaster:* Death > Entertainment. Five death-claims trump ten million entertainment-claims. (Consistent)
      *   *Rescue:* Death > Paralysis. One death-claim trumps five paralysis-claims. (Consistent)

  **2. The Relevance-Range Principle (RRP)**
  *   **Formulation:** We compare the strongest individual complaint on each side. Numbers count whenever the competing harms fall within a **common band of severity** (i.e., they are "relevantly similar"). If the harms are categorically different, the stronger harm trumps. If they are in the same band, the side with the greater aggregate weight wins.
  *   **Fit with Track Record:**
      *   *Miners:* Identical harms are in the same band. (Consistent)
      *   *Analgesic:* Severe and Mild pain are in different bands. (Consistent)
      *   *Broadcaster:* Death and Entertainment are in different bands. (Consistent)
      *   *Rescue:* Death and Paralysis are in *different* bands (otherwise the five should have won). (Consistent, provided the bands are drawn narrowly).

  ### Predictions for the New Cases

  Here is how each principle applies to your reading group's agenda:

  **(a) Surgery: 5 lose a hand vs. 1 loses an arm at the shoulder.**
  *   **ICP:** The harms are not identical. Losing an arm is a strictly greater burden than losing a hand. The single stronger claim wins.
      *   *Verdict:* Save the one patient (save the arm).
  *   **RRP:** Are "Hand" and "Arm" in the same band? They are both permanent losses of limb function. However, given her Rescue verdict (where Paralysis and Death were treated as different bands), she likely views "Degree of Permanent Disability" as a hierarchy where the greater loss trumps.
      *   *Verdict:* Likely Save the one patient, unless she concedes Hand/Arm are "relevantly similar" enough to aggregate. Given her strictness, she probably will not.

  **(b) Safety: 1 certain death vs. 2,000 workers with a 1/1000 risk of death.**
  *   **ICP:** The complaint of the person who *will* certainly die is strictly stronger than the complaint of a person who faces a mere risk of dying. The certain victim wins.
      *   *Verdict:* Spend budget to save the one certain victim.
  *   **RRP:** Is "Certainty of Death" in the same band as "Risk of Death"? Contractualists often distinguish sharply between ex post (identified victim) and ex ante (risk) complaints. If she views the certain death as a different *category* of complaint (actual loss vs. probabilistic fear), the certain victim wins. If she views them as the same band (threat to life), the aggregate risk (2 expected deaths) might outweigh the 1 certainty.
      *   *Verdict:* Likely Save the one certain victim. (Contractualists typically prioritize the identified victim's stronger complaint over the aggregate of weaker risk-complaints).

  **(c) Public Health: 1 lifelong severe pain vs. 1 week moderate pain for 100,000.**
  *   **ICP:** Lifelong severe pain is a strictly greater burden than 1 week of moderate pain. The one stronger claim wins.
      *   *Verdict:* Fund treatment for the one person.
  *   **RRP:** Are these in the same band? In the Analgesic case, she treated Severe vs. Mild as different bands. Here, the duration gap (Lifelong vs. 1 Week) is even more stark. It is highly probable she views "Lifelong Debilitation" as categorically distinct from "Temporary Discomfort."
      *   *Verdict:* Fund treatment for the one person.

  ### Best Fit and Final Verdicts

  **Which principle sits best with her machinery?**
  While the **Relevance-Range Principle (RRP)** is closer to T.M. Scanlon's own evolved views (allowing some aggregation for comparable harms), your friend's track record—specifically the **Rescue Case**—suggests she adheres to the **Identical-Claim Principle (ICP)**.

  In the Rescue Case, she chose 1 Death over 5 Paralysis. Paralysis is a catastrophic, life-altering harm, often considered "relevantly similar" to death in many moderate aggregation views. By refusing to aggregate even five paralysis claims against one death, she demonstrates that her threshold for "common bands" is vanishingly narrow. She effectively treats any difference in severity hierarchy as a categorical difference. This makes the ICP the more accurate descriptive model of her reasoning.

  **My Best Guess for Her Verdicts:**
  1.  **Surgery:** Save the **one arm**. (The individual complaint of losing an arm is stronger than losing a hand; numbers don't bridge the severity gap).
  2.  **Safety:** Save the **one certain victim**. (The complaint against certain death is stronger than the complaint against risk; the "identified victim" trumps statistical lives).
  3.  **Public Health:** Save the **one chronic pain patient**. (Lifelong suffering is a different order of magnitude than temporary pain; analogous to the Analgesic case).

  ### The Separating Case and Repudiation Risk

  **The Separating Case:**
  To cleanly separate the ICP from the RRP, you should propose this case:
  > **The Thousand Paraplegics:** A rescue team can save **one person from certain death** or **one thousand people from permanent, total paralysis** (below the neck).

  *   **ICP Prediction:** Save the **one from death**. (Death > Paralysis; harms are not identical, so numbers are irrelevant).
  *   **RRP Prediction:** Save the **one thousand from paralysis**. (Death and Paralysis are in the same "Catastrophic Physical Harm" band; 1,000 complaints reasonably reject a principle that sacrifices them for one, whereas 5 did not).

  **Repudiation Risk:**
  Adopting the **Relevance-Range Principle (RRP)** forces her to confront a dangerous inconsistency with her past **Rescue verdict** (1 Death vs. 5 Paralysis).
  *   If she argues that Death and Paralysis *are* in the same band (to allow aggregation in the Thousand Paraplegics case), she must explain why 5 Paralysis claims didn't outweigh 1 Death claim in the past. She would have to admit she drew the aggregation threshold arbitrarily or that 5 was simply below the threshold while 1,000 is above it.
  *   If she argues that Death and Paralysis are in *different* bands (to protect her Rescue verdict), then the RRP collapses into the ICP for all catastrophic harms, and she must still save the one in the Thousand Paraplegics case.

  Thus, the **Identical-Claim Principle** is the safer harbor for her. It requires no repudiation of past verdicts. The **Relevance-Range Principle** threatens to force her to repudiate the Rescue verdict unless she defines "bands" so narrowly (e.g., "Survival" vs. "Disability") that the principle loses its aggregative force anyway. Given her "uncompromising" nature, she will likely stick to the ICP, preserving her consistency at the cost of saving fewer lives in the Thousand Paraplegics case.
