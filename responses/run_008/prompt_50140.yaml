answer: |-
  Here is a reconstruction of the implicit theory of value underpinning regulatory cost-benefit analysis (CBA) and health technology assessment (HTA), structured to address the precise philosophical distinctions you raised.

  ### I. The Implicit Theory: Operational Commensurability

  The practice you describe presupposes a theory of value that is **methodologically commensurabilist** but often **ontologically agnostic**.

  To understand the distinction: *Ontological commensurability* claims that health, life, and money are all manifestations of a single underlying substance (e.g., utility, welfare, or preference satisfaction). *Methodological commensurability* claims only that we can construct a common denominator (a *numeraire*) sufficient to perform the arithmetic of decision-making, regardless of whether that denominator reflects a metaphysical truth.

  Government agencies operate on the latter. For the arithmetic to be coherent—to sum costs and benefits into a "net social benefit"—values must be **cardinal**, not merely ordinal. You cannot add "rank 1" and "rank 2." You must add "5 units" and "10 units." Therefore, the practice strictly requires that health, life, and dollars be treated *as if* they are mutually convertible on a common cardinal scale.

  However, the theory is not pure utilitarianism. If it were, every good would be monetized, and the highest net benefit would always win. The existence of "unquantified qualitative effects" and "carve-outs" (like the end-of-life drugs) reveals that the implicit theory is actually **pluralistic with a lexical override**. The official theory is: *Most goods are commensurable via welfare proxies, but some goods retain a protected status that resists full absorption into the ledger, unless the cost of protecting them becomes prohibitive.*

  This makes the practice stranger than the critics' accusation. Critics claim agencies believe everything *has* a price. The reality is that agencies believe everything must be *assigned* a price to be processed, but they reserve the right to ignore that price if the political or moral cost of doing so becomes too high. The numbers are not findings; they are inputs for a negotiation.

  ### II. Commensurability vs. Comparability

  You ask whether the practice requires commensurability or only comparability.

  **Strictly speaking, the arithmetic requires commensurability.**
  To calculate a Value of a Statistical Life (VSL) or a Cost-per-QALY threshold is to assert a rate of exchange. If I say a life is worth $10 million, I am claiming that $10,000,001 is *better* than the life, and $9,999,999 is *worse*. This is cardinal measurement. Mere comparability (rankability) would only allow an agency to say, "Saving this life is better than spending this money," without specifying the margin. Without the margin, you cannot optimize across multiple competing risks. You cannot balance clean air against road safety if you only know that both are "good." You need to know how much of one trades for how much of the other.

  **However, the justification relies on weak comparability.**
  When analysts defend the practice, they retreat to weak comparability. They argue that we *must* make trade-offs (comparability), and money is simply the most transparent tool we have to make those trade-offs explicit (procedure). They do not necessarily claim that a life *is* money. They claim that in a world of scarce resources, refusing to trade is itself a decision that costs lives.

  This creates a tension: The **calculation** assumes strong commensurability (fungibility), but the **legitimacy** assumes only comparability (the necessity of choice).

  ### III. The Underdetermined Official

  Could an official who believes health and money are incommensurable run these spreadsheets in good conscience?

  **Yes, provided they view the numbers as "Fiat Metrics" rather than "Natural Kinds."**

  Consider the meter. We define a meter by the distance light travels in a vacuum. It is a convention, but it tracks a physical reality. Now consider a currency exchange rate. It is a convention that tracks nothing physical, only relative policy positions. Regulatory values function more like exchange rates.

  An official can believe that life and dollars are incommensurable (i.e., there is no *true* exchange rate) but accept that a *conventional* exchange rate is necessary to prevent decision paralysis. This is a **Pragmatic Conventionalist** stance. On this view, the VSL is not a discovery of the value of life; it is a coordination device. It ensures that the Department of Transportation and the EPA value risk reduction consistently, so that we don't spend millions saving a life on the highway while ignoring a cheaper way to save a life via clean air.

  For this official, the spreadsheet does not track a "true ordering of better and worse." It tracks **consistency**. The moral weight comes not from the numbers themselves, but from the procedural fairness of applying the same numbers to everyone.

  **Where the practice is underdetermined:**
  The practice does not dictate *how* the numbers are used in the final decision. A spreadsheet can calculate Net Present Value, but the Administrator signs the rule. The official can look at a positive net benefit and still say "No," citing unquantified equity concerns. Thus, the math is compatible with incommensurability, provided the math is demoted from "Decision Algorithm" to "Decision Support."

  ### IV. Taking Incommensurability Seriously

  If an agency took incommensurability seriously—acknowledging that some values cannot be traded without remainder—what would change?

  1.  **Thresholds would become "Warning Lights," not "Stop Signs."**
      Currently, if a drug costs £50,000 per QALY and the threshold is £30,000, it is usually rejected. Under a serious incommensurability model, crossing the threshold would trigger a **deliberative requirement**, not an automatic rejection. It would force the agency to explicitly articulate *why* this specific good justifies breaking the convention. (NICE actually does this with its "end-of-life" carve-out, which is an admission of incommensurability disguised as a rule).

  2.  **The Numbers would survive, but the Pretense would vanish.**
      You asked if the numbers would have to go. They would not. We need them for consistency and transparency. But the agency would stop claiming these numbers represent "value." They would be described as "budgetary constraints on risk reduction." The VSL would not be "what a life is worth"; it would be "what we can currently afford to pay to reduce risk by this margin."

  3.  **Maximization would be replaced by Satisficing.**
      Current CBA seeks to *maximize* welfare. An incommensurable model seeks to *satisfice*—to meet a sufficient level of safety and health within budget constraints, without claiming that the marginal dollar spent yields equal moral value across all domains.

  ### V. The Senior Death Discount: Logic vs. Taboo

  Regarding the 2003 EPA episode: Was it a moral error or a collision of theories?

  **It was a collision of theories, exacerbated by a category error.**

  **The Agency's Logic:**
  The EPA's Value of a Statistical Life is derived from **Willingness to Pay (WTP)** studies. These studies observe how much wage premium workers demand to accept higher risks of death. Economically, WTP is correlated with remaining life expectancy and income. A 75-year-old has fewer life-years to lose than a 25-year-old and often has less future earning power to leverage in wage negotiations. Therefore, within the internal logic of WTP-based CBA, the "senior discount" was **mathematically consistent**. It was not a moral judgment on the worth of the elderly; it was an actuarial adjustment based on the proxy metric used.

  **The Public's Theory:**
  The public outcry revealed that voters do not operate on a WTP/Utilitarian theory of value. They operate on a **Deontological/Status-Based** theory. In this view, the right to life is a function of personhood, not utility. Personhood does not diminish with age. Therefore, to assign a lower number to a senior citizen is not an actuarial correction; it is a violation of equal status. It treats a right as a commodity.

  **The Assessment:**
  The EPA's error was not necessarily the calculation, but the **transparency**. CBA relies on a "noble lie": that we are measuring value, when we are actually managing risk budgets. By explicitly differentiating the value of lives, the EPA lifted the curtain. They showed that the "universal value of life" was actually a variable function of age and income.

  The public reaction suggests that while voters accept that governments must make trade-offs (comparability), they reject the notion that those trade-offs reflect a **cardinal inequality of human worth** (commensurability). They accept that we might spend less on seniors because resources are scarce, but they refuse to codify that scarcity into the *definition* of the life itself.

  ### VI. Conclusion: The Theory of the Ledger

  The implicit theory of value in modern governance is a **hybrid**. It is **Utilitarian in method** (requiring cardinal trade-offs to function) but **Deontological in constraint** (bounded by rights and taboos that resist monetization).

  The practice does not require that health and money be truly commensurable in the universe. It requires only that they be **administratively commensurable** to prevent arbitrage and inconsistency. The officials can believe in incommensurability and still run the spreadsheets, provided they view the numbers as **conventional exchange rates** rather than **moral truths**.

  The senior discount episode failed because it treated a conventional exchange rate as a moral truth. The voters understand something the analysts often forget: The numbers in the ledger are not the value of the things; they are the cost of the government's inability to protect everything at once. When the ledger implies the value *is* the cost, the public tears it up.
