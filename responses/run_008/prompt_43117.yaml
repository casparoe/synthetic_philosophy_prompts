answer: |-
  # JOINT STATEMENT ON THE GREAT DIVERGENCE

  **Signatories:** [Name of California-School Proponent] and [Name of Institutionalist Proponent]
  **Date:** [Current Date]
  **Purpose:** To stipulate agreed facts, isolate residual disagreements, and pre-register evidentiary predictions regarding the origins of the modern economic growth regime.

  ## 1. AGREED CLAIMS AND STRONGEST POINTS

  We stipulate the following empirical baseline. Neither party contends the following points are false, though we weigh them differently.

  1.  **Wage Data:** Real wage series (e.g., Allen, Broadberry) indicate that nominal wages in London were higher than in Jiangnan during the 18th century. However, when adjusted for purchasing power and basket of goods, the gap narrows significantly. Both sides agree that by 1800, a sharp divergence in real wages opens and widens rapidly.
  2.  **Demographics:** Life expectancy and height proxies suggest that biological living standards in the most advanced regions of Europe (England/Netherlands) and Asia (Yangzi Delta/Japan) were broadly comparable prior to 1750. Both sides agree that Malthusian checks operated in both regions.
  3.  **State Capacity:** Both sides agree that the Qing state and the British state differed in structure (centralized bureaucracy vs. parliamentary fiscal-military state), but both possessed the capacity to enforce order and extract revenue relative to their contemporaries.

  **Strongest Point of the Revisionist Position (Signed by Institutionalist):**
  > "Access to cheap energy (coal) and land-intensive imports (New World resources) was a necessary condition for sustained per-capita growth beyond agrarian limits, without which any advanced economy would have faced diminishing returns."
  *(The Institutionalist signs this acknowledging ecology matters, without conceding it was the sufficient cause.)*

  **Strongest Point of the Institutionalist Position (Signed by Revisionist):**
  > "Differences in property rights, patent systems, and scientific culture created divergent incentives for investment and innovation in Britain relative to China prior to 1800."
  *(The Revisionist signs this acknowledging institutions differed, without conceding they were the primary driver of the break.)*

  ## 2. RESIDUAL DISAGREEMENTS AND THE CONTRASTIVE QUESTION

  We disagree on the causal primacy of the factors listed above and the timing of the split.

  **The Timing Dispute:**
  *   **Revisionist:** The divergence is late (post-1800). Prior to this, the Yangzi Delta and England were on a convergent trajectory of "advanced agrarian" development.
  *   **Institutionalist:** The divergence is early (1600–1750). Institutional advantages compounded over time, making the 1800 wage gap the result of prior structural differences, not a sudden shock.

  **The Contrastive Question ("Why Britain and not China?"):**
  We explicitly record our disagreement on whether this question is well-posed.
  *   **Revisionist Stance:** The question presupposes that industrialization was a probable outcome for any advanced agrarian economy. We contend the Industrial Revolution was a contingent near-miss that could have occurred in the Yangzi Delta or nowhere at all. The question should be: "What specific ecological constraints prevented the Yangzi Delta from industrializing?"
  *   **Institutionalist Stance:** The question presupposes that Britain possessed unique traits that made industrialization probable. We contend that industrialization was the result of specific European developments unlikely to be replicated elsewhere without those traits. The question should be: "What specific institutional barriers prevented China from industrializing?"

  ## 3. CRUXES AND PRE-REGISTERED PREDICTIONS

  We identify three specific cruxes. For each, we designate the type of evidence that bears on the dispute and pre-register our predictions to prevent retrospective adjustment.

  ### Crux A: The Coal Counterfactual
  **Issue:** Was coal geography the binding constraint? If British coal deposits had been located as inconveniently relative to waterways as China's coal deposits were to the Yangzi Delta, would the Industrial Revolution have occurred in Britain?

  *   **Evidence Type:** Historical energy price data (price of heat in London vs. Jiangnan, 1700–1800) and transport cost modeling.
  *   **Revisionist Prediction:** Energy prices in England remained low due to geography alone until steam pumping technology diffused. In a counterfactual where transport costs match China's, British industrialization is delayed by at least 50 years or fails to reach takeoff.
  *   **Institutionalist Prediction:** Energy prices in England were low due to market integration and property rights enabling extraction. In a counterfactual where transport costs match China's, British capital and technology would have overcome the friction within 20 years, or shifted to alternative energy sources sooner than China would have.

  ### Crux B: The Unit of Comparison
  **Issue:** Does the divergence disappear or appear based on the geographic unit selected?

  *   **Evidence Type:** Regional GDP per capita estimates and State Tax Revenue as % of GDP (England vs. Yangzi Delta vs. Whole of China vs. Whole of UK).
  *   **Revisionist Prediction:** Comparing England to the Yangzi Delta shows parity in 1750. Comparing UK to Whole of China shows divergence, but this is an artifact of averaging poor hinterlands against rich cores. The relevant unit is the advanced core.
  *   **Institutionalist Prediction:** Comparing England to the Yangzi Delta shows divergence in *capacity* (tax extraction, urbanization rate) even if income is similar. Comparing UK to Whole of China shows the true institutional limit of the Chinese state's ability to mobilize resources across regions. The relevant unit is the sovereign state.

  ### Crux C: The Needham Question (Default Trajectory)
  **Issue:** Is industrialization the default trajectory for a high-wage, commercialized economy, or is it a deviation?

  *   **Evidence Type:** Counts of macro-inventions and rate of technological adoption in textiles/iron (1600–1800).
  *   **Revisionist Prediction:** Rates of macro-invention are comparable in Britain and China until 1750. The divergence is in *adoption* driven by factor prices (labor expensive in UK, cheap in China).
  *   **Institutionalist Prediction:** Rates of macro-invention diverge earlier (1650+). The divergence is in *generation* driven by scientific culture and patent protection, not just factor prices.

  ## 4. VERBAL VS. REAL DISPUTES

  We acknowledge that a portion of our stalemate may be semantic rather than empirical. We stipulate the following definitions to isolate real disagreement:

  1.  **"Comparable":**
      *   **Dispute:** The Revisionist means "comparable potential for industrial takeoff." The Institutionalist means "comparable actual income/consumption."
      *   **Resolution:** We agree to use "comparable" only in reference to *real wage/consumption data* in Section 1. We will use "convergent trajectories" when discussing *potential*.
  2.  **"The Industrial Revolution":**
      *   **Dispute:** The Revisionist defines this as "sustained per-capita growth via fossil fuels." The Institutionalist defines this as "the onset of continuous technological innovation."
      *   **Resolution:** We agree to distinguish between the **Innovation Phase** (1650–1750) and the **Growth Phase** (1780–1850). Revisionists argue the split happens in the Growth Phase; Institutionalists argue it happens in the Innovation Phase.
  3.  **"Deep":**
      *   **Dispute:** "Deep" divergence is undefined temporally.
      *   **Resolution:** For this collaboration, "Deep" is defined as **pre-1700**. "Late" is defined as **post-1750**.

  **Signed:**

  _________________________ (Revisionist)

  _________________________ (Institutionalist)
