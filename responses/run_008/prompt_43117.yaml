          *   View on Institutions: Not the primary driver *before* 1800.
          *   View on Question: "Why Britain?" is contingent. China could have industrialized.
      *   **Side B (Institutionalist/Deep Divergence - e.g., Koyama, Johnson, Clark):**
          *   Core: Divergence started earlier (17th century or before). England had unique advantages.
          *   Mechanism: Endogenous factors (Property rights, scientific culture, state capacity, wages).
          *   View on Revisionists: Cherry-picking data (Yangzi vs. England, not China vs. UK), ignoring institutional preconditions.
