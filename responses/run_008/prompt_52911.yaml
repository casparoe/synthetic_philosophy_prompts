      *   *Retreat Assessment:* Does the view shrink? Yes, often nontransitivists limit it to "overall betterness" in "spectrum cases" involving "different qualitative kinds." Is this fatal? It depends. If it only applies to impossible thought experiments, it loses practical bite. If it applies to real policy (torture vs. dust specks), it retains bite.

  6.  **Drafting the Response (Iterative refinement):**

