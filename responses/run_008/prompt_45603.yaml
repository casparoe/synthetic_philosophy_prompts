      *   If I delete (3)?
          *   (2) becomes possible.
          *   (4) still contradicts (2).
          *   (5) still contradicts (4).
      *   If I delete (4)?
          *   Resolves the direct contradiction with (5).
          *   Resolves the contradiction with (2).
          *   Leaves (2) vs (3) and (2) vs (5).
      *   Actually, the *biggest* cleanup comes from revising **(4)**. It is the only claim that is logically incompatible with two other claims ((2) and (5)).
      *   However, the *deepest* philosophical tension is **(2) vs (3)**. You can't do expected value without cardinality.
