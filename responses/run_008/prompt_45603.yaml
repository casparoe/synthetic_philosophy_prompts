      *   **Pair (1) vs. (3):**
          *   (1) Moral facts are mind-independent.
          *   (3) Exchange rates are conventions (mind-dependent/arbitrary).
          *   *Verdict:* Apparent Tension. One can be a realist about *intra*-theoretic facts (utilism is true, deontology is false) while being an anti-realist/conventionalist about *meta*-theoretic comparisons (how much is a util worth compared to a right). Many realists accept (3).
