      *   (2) & (4): MEC says maximize expectation. (4) says ignore the expectation calculation if one theory is dominant. *Major Tension.*
      *   (4) & (5): (4) says act on the 85% theory (Consequentialism). Consequentialism says kill 1 to save 5. (5) says *don't* kill 1 to save 5. *Direct Contradiction.*
      *   (2) & (5): MEC says weigh by credence. If Consequentialism is 85%, the "expected choiceworthiness" of killing 1 to save 5 should be very high (unless the deontological penalty is infinite or the scale is skewed). (5) implies the deontological veto wins despite low credence. *Tension depending on scaling.*
      *   (1) & (5): Realism says there's a fact of the matter. (5) asserts a verdict. This seems consistent unless the verdict contradicts the "true" theory. But (5) is about what to do under *uncertainty*, so it's compatible with (1).

  4.  **Deep Dive into Specific Pairs:**

      *   **Pair (2) vs. (4):**
          *   (2) defines the right act as maximizing *expected* choiceworthiness (weighted sum).
          *   (4) defines the right act (in high credence cases) as acting on the *most probable* theory (maximizing probability of being right, or simply ignoring the weights).
          *   *Verdict:* Genuine Contradiction. You can't maximize the weighted sum and simultaneously ignore the weights because one weight is high.
          *   *Severity:* High. It breaks the decision procedure.

      *   **Pair (4) vs. (5):**
          *   (4) says: 85% Consequentialism $\rightarrow$ Act on Consequentialism.
          *   Consequentialism says: Kill 1 to save 5.
          *   (5) says: 85% Consequentialism $\rightarrow$ Do *not* kill 1 to save 5.
          *   *Verdict:* Direct Contradiction. (4) prescribes Action A; (5) prescribes Action Not-A under the exact same conditions.
          *   *Severity:* Critical. This is a logical inconsistency in the output.

      *   **Pair (2) vs. (3):**
          *   (2) requires intertheoretic comparison to calculate an expectation (you need to add Utils to Deontological Points).
          *   (3) says there is no fact of the matter about how to compare them (the "Problem of Intertheoretic Comparisons").
          *   *Verdict:* Genuine Tension. MEC is mathematically impossible without a common scale. If (3) is true, (2) is undefined.
