      *   Wait, if I change (4) to "One should maximize expected choiceworthiness *unless* a minority theory posits a rights violation with infinite disvalue," that resolves (4) vs (2), (4) vs (5), and helps with (2) vs (3) (by implying a specific scaling convention).
