      *   *(3) Intertheoretic Comparison Problem:* No non-arbitrary fact of the matter about comparing value units across theories (e.g., utils vs. deontological constraints). Exchange rates are conventional.
      *   *(4) High-Credence Threshold:* If credence in one theory is high enough (e.g., 85%), act on that theory alone. Treat residual credence as noise.
      *   *(5) Concrete Verdict:* An 85% consequentialist doctor should *not* kill 1 to save 5. The minority deontological view (rights violation) trumps the majority consequentialist view (aggregate welfare), even if gains are large.

