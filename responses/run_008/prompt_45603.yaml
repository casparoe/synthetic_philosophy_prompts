          *   *Verdict:* Tension. If exchange rates are arbitrary, why does the deontological constraint automatically win? Usually, if rates are arbitrary, the agent gets to pick. But (5) presents it as a normative requirement ("acts wrongly").
          *   *Severity:* Medium.

  5.  **Ranking the Tensions:**
      1.  **(4) vs. (5):** Logical contradiction. Same inputs, opposite outputs.
      2.  **(2) vs. (4):** Decision procedure contradiction. Maximize expectation vs. Follow highest probability.
      3.  **(2) vs. (3):** Mathematical impossibility. Can't calculate expectation without common scale.
      4.  **(3) vs. (5):** Normative arbitrariness. If scale is conventional, why is the verdict mandatory?

  6.  **Developing Repairs:**

