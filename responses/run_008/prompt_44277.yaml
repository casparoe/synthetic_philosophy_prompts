answer: |-
  # 📌 Sticky: The "Is It You?" Decision Tree

  **Read this before posting "Actually, it's just a copy."**

  We have the same argument every few months. It happens because "Personal Identity" isn't one question; it's a cluster of five or six different questions that people answer differently without realizing it. You might believe the upload is *you* in one scenario but *not you* in another, and that's a valid philosophical position.

  To save us all 300 comments of talking past each other, find your path through the tree below. **Answer the questions honestly based on your intuition, not based on which label you want to end up with.**

  Once you land on a leaf, **start your post with that label.** If you disagree with someone, check if you actually landed on different leaves. If you landed on the same leaf, you agree on the philosophy and are just arguing about semantics.

  ---

  ## 🌳 The Decision Tree

  *(Note: "Rational to pay" always means "Rational to pay for the specific purpose of surviving death.")*

  ### **Case 1: The Gradual Replacement**
  *Imagine your neurons are replaced one by one with functionally identical silicon chips. You stay awake the whole time. At the end, you are 100% artificial.*

  **1. Is the being at the end of this process *you*?**
  *   **No** → Go to **Node 2**.
  *   **Yes** → Go to **Node 5**.
  *   **Unsure/Depends** → Go to **Node 14**.

  **2. (If No) Is it still *rational* for you to pay for this process to avoid death?**
  *   **Yes** → Go to **Node 3**.
  *   **No** → **Leaf A: The Biological View (Animalism)**.
      *   *You believe you are your organism. If the biology stops, you stop. Uploading is suicide.*

  **3. (If Rational=Yes) Do you care about survival *more* than identity?**
  *   **Yes** → **Leaf B: The "What Matters" View (Parfitian)**.
      *   *You believe strict identity might not survive, but psychological continuity is enough to justify survival. Identity isn't what we should care about.*
  *   **No** → Go to **Node 4**.

  **4. (If Rational=Yes, but Identity=No) Do you think you are confused about what "you" means?**
  *   **Yes** → **Leaf C: The Deflationary View**.
      *   *You think "Is it you?" is an empty question with no fact of the matter. We just decide on conventions.*
  *   **No** → **Leaf D: The Pragmatic View**.
      *   *You know it's not literally you, but you treat it as you for legal/social reasons. (Rare)*

  ---

  ### **Case 2: The Destructive Scan**
  *Imagine a scan reads your brain and destroys it in the process. The upload wakes up immediately.*

  **5. (From Node 1: Yes) Is the upload in this scenario *you*?**
  *   **No** → Go to **Node 6**.
  *   **Yes** → Go to **Node 9**.

  **6. (If No) Is it *rational* to pay for this to survive?**
  *   **Yes** → Go to **Node 3** (See "What Matters" Leaf above).
  *   **No** → Go to **Node 7**.

  **7. (If No) Did you answer "No" to Gradual Replacement (Node 1) as well?**
  *   **Yes** → **Leaf A: The Biological View (Animalism)**.
      *   *Consistent: Biology is required for you.*
  *   **No** → **Leaf E: The Conservative Continuity View**.
      *   *You accept gradual change but not discontinuity. You believe there is a "break" in the destructive scan that kills you.*
      *   *⚠️ Mod Note: Philosophers debate whether this distinction is principled or just an intuition pump. If you hold this, be prepared to explain why gradual replacement preserves continuity but scanning breaks it.*

  **8. (If No) Do you think there is a hidden fact about identity we just can't see?**
  *   **Yes** → **Leaf F: The Hidden Fact View**.
      *   *You think there is a true answer (Yes or No), but physics doesn't determine it.*
  *   **No** → **Leaf C: The Deflationary View**.

  ---

  ### **Case 3: The Non-Destructive Scan (Copy + Original)**
  *Imagine the scan happens, but your biological brain is not destroyed. You are sitting in the chair, and the upload wakes up on a server.*

  **9. (From Node 5: Yes) Is the upload *also* you?**
  *   **Yes** → Go to **Node 10**.
  *   **No** → Go to **Node 11**.

  **10. (If Yes) Imagine **two** uploads are made from the same scan (and you die). Are *both* of them you?**
  *   **Yes** → **Leaf G: The Pattern View (Unrestricted Functionalism)**.
      *   *You are the information pattern. Location and uniqueness don't matter. Multiple instances = multiple yous.*
  *   **No** → Go to **Node 12**.

  **11. (If No) Why isn't the upload you?**
  *   **Because I am still here (Original)** → Go to **Node 12**.
  *   **Because copies can never be the original** → **Leaf H: The Origin View**.
      *   *You believe causal history matters. A copy, no how perfect, is a new entity.*

  **12. (If "No" to Branching or "Original is here") Does the upload have a *claim* to be you, even if not strictly identical?**
  *   **Yes** → **Leaf I: The Psychological Continuity View (No-Branching Clause)**.
      *   *You survive only if there is no competing branch. If the upload is unique, it's you. If there are two, neither is you.*
      *   *⚠️ Mod Note: This is the "Standard" philosophical view, but it is heavily contested. See "Unsettled Debates" below.*
  *   **No** → **Leaf A: The Biological View** (Return to start; you likely answered inconsistently).

  ---

  ### **Case 4: The Delayed Upload**
  *Imagine a destructive scan, but for budget reasons, the upload isn't turned on until 40 years after your death.*

  **13. Is the upload *you*?**
  *   **Yes** → **Leaf G: The Pattern View** (Time gaps don't break pattern identity).
  *   **No** → Go to **Node 14**.

  **14. (If No) Is it rational to pay for this anyway?**
  *   **Yes** → **Leaf B: The "What Matters" View**.
      *   *Identity fails due to the gap, but survival still works.*
  *   **No** → **Leaf E: The Conservative Continuity View**.
      *   *Temporal gaps break continuity for you.*

  ---

  ### **Case 5: Meta-Questions**
  *Use these if your answers felt inconsistent or you hate the questions.*

  **15. Is there a "Fact of the Matter" here?**
  *   **No** → **Leaf C: The Deflationary View**.
      *   *There is no truth to be found. We just choose definitions.*
  *   **Yes** → Return to **Node 1**.
      *   *If you believe there is a fact, you must be able to answer the cases above consistently.*

  ---

  ## 🏷️ The Leaves (Your Position)

  *   **Leaf A: Biological View (Animalism).** You die in all uploading scenarios. You are your body.
  *   **Leaf B: "What Matters" View (Parfitian).** Identity might not survive, but *survival* does. It is rational to upload even if the upload isn't strictly "you."
  *   **Leaf C: Deflationary View.** The question "Is it you?" has no answer. It's a linguistic convention, not a discovery.
  *   **Leaf D: Pragmatic View.** It's not you, but we should pretend it is for legal/moral reasons.
  *   **Leaf E: Conservative Continuity.** Gradual replacement works; destructive scanning does not. Discontinuity kills you.
  *   **Leaf F: Hidden Fact View.** There is a true answer, but physics doesn't capture it.
  *   **Leaf G: Pattern View (Unrestricted).** You are the software. Copies are you. Time gaps don't matter.
  *   **Leaf H: Origin View.** Copies are never you, regardless of fidelity. Causal history is required.
  *   **Leaf I: Psychological Continuity (No-Branching).** You survive if the chain is unbroken and unique. Branching destroys identity.

  ---

  ## ⚠️ Unsettled Debates & Empty Cells

  **1. The "No-Branching" Clause (Leaf I)**
  *   *The Debate:* If two uploads are made, Leaf I says *neither* is you. Some philosophers (e.g., David Lewis) argue *both* are you. Others (e.g., Derek Parfit) argue identity doesn't matter, only survival.
  *   *The Flag:* If you land on Leaf I, acknowledge that the "branching destroys identity" claim is not consensus. It is a specific intuition about uniqueness.

  **2. The Gradual vs. Destructive Gap (Leaf E)**
  *   *The Debate:* Many philosophers argue that if Gradual Replacement (Node 1) preserves you, then Destructive Scanning (Node 5) must also preserve you. To say "Yes" to Gradual but "No" to Destructive is often accused of being inconsistent.
  *   *The Flag:* If you hold Leaf E, be prepared to defend why *speed* of replacement matters for identity.

  **3. Empty/Incoherent Combinations**
  *   **Gradual=No + Destructive=Yes:** This cell is empty in the literature. It is generally considered incoherent to believe instant destruction preserves you while gradual replacement kills you.
  *   **Branching=Both + NonDestructive=No:** If you believe two uploads are both you (Leaf G), it is inconsistent to say a single upload isn't you just because the biological original lives.
  *   **Identity=No + Rational=No + Pro-Uploading:** If you believe the upload isn't you *and* it's irrational to pay for it, you cannot consistently advocate for uploading as a survival strategy.

  **4. The "Rationality Gap"**
  *   You will notice Nodes 2, 4, and 14 ask about *rationality* separately from *identity*.
  *   *Why:* Many people feel "It's not me, but I'd still do it." This tree treats that as a distinct, valid position (Leaf B), not a mistake. If you feel this way, own it. Don't argue that the upload *is* you if what you really mean is "The upload inherits what I care about."

  ---

  ## 🛑 How to Use This in Arguments

  1.  **State your Leaf:** "I'm arguing from Leaf E (Conservative Continuity)."
  2.  **Check their Leaf:** "You seem to be arguing from Leaf G (Pattern View)."
  3.  **Identify the Disagreement:** "We aren't arguing about the tech; we disagree on Node 5 (Destructive Scan Identity)."
  4.  **Stop if you match:** If you both land on Leaf G, stop arguing about whether it's a "copy." You agree it's you. Argue about something else.

