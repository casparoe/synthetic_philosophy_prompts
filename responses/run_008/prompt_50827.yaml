      *   The Pilot's shot is an **actual event** that interrupted a threat process.
      *   The threat (Bomber) is a deviant condition; the Pilot's intervention restores the "Bridge Safe" default.
      *   **Verdict:** Pilot caused survival. (Active interruption of a deviant threat counts as contribution).

  ### **5. Parents Meeting (Existence)**
  *   **Counterfactual View:** Works. (If no meeting -> no you.)
  *   **Interventionist View:** Fails. (You cannot intervene on the cause without deleting the evaluator/variable "You".)
  *   **Your Principle:** **Actuality + Deviance.**
      *   The meeting is an **actual event**.
      *   The Interventionist problem is a **modeling error**, not a metaphysical one. We can evaluate causation from a "God's eye" view where "Your Existence" is just a variable $E=1$ or $E=0$.
      *   **Verdict:** Parents caused existence. (The machinery shouldn't break just because the effect is the evaluator).

