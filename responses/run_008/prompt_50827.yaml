  ### **The Prediction: The Safety Regulator Case**

  **The Case:** A safety regulator omits to require a guardrail on a curve. A car crashes there. However, the car was being driven recklessly and *would very likely have crashed somewhere else that same night anyway*.

  **Analysis using Deviant Actual Contribution:**

  1.  **Actuality:** The regulator's omission is actual. The crash *at the curve* is actual. The "crash elsewhere" is **counterfactual** (it did not happen).
  2.  **Contribution:** The lack of a rail physically allowed *this* trajectory. It was part of the sufficient set for *this* crash.
  3.  **Deviance:** The regulator has a **normative duty** (like the Gardener). Omitting the rail is a deviant failure of duty.

  **The Conflict:** This case mixes **Gardener** (Omission + Duty) with **Suzy/Billy** (Preemption).
  *   The Regulator is like the **Gardener** (Duty makes omission causal).
  *   The "Crash Elsewhere" is like **Billy's Rock** (A backup cause that was preempted by the actual cause).

  **The Verdict:**
  According to your principle (which prioritizes **Actual History** over **Counterfactual Backups**), the Regulator **caused the crash at the curve.**

  *   **Why:** Just as Suzy's rock preempts Billy's, the *actual* crash preempts the *hypothetical* crash. The fact that harm was "inevitable" later does not negate the causation of the harm *now*.
  *   **Nuance on Harm:** If the question is "Did the regulator cause the *death*?" and the death would have been identical in time and manner elsewhere, your intuition might waver. But based on your **Suzy verdict** (Actual process wins), the regulator caused the **specific accident event**. The "later crash" is merely a counterfactual possibility (Billy), not an actual competing cause.

  **Prediction:** Your gut will say the Regulator **is causally responsible for the accident**, even if the *net harm* in the universe was unchanged. The law often calls this "causing the loss" regardless of inevitability, because we judge causes by what *did* happen, not what *might have*.

  ### **Summary**
  Your gut is tracking **Norm-Guided Actualism**.
  *   It rejects pure Counterfactuals because they ignore **Actual Processes** (Suzy/Billy).
  *   It rejects pure Interventionism because it struggles with **Defaults/Omissions** (Gardener) and **Indexical Effects** (Parents).
  *   It demands that a cause be **Real** (Actual), **Effective** (Contribution), and **Salient** (Deviant from Norm).

  This is not confusion; it is a more robust theory than the "big two" alone.
