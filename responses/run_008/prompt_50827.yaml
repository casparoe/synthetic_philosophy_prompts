  Standard Counterfactual theory fails on Preemption (Case 1) and Overdetermination (Case 2). Standard Interventionism fails on Omissions (Case 3) and Existence (Case 5).

  The unifying principle behind your five verdicts is:

  ### **The Principle of Deviant Actual Contribution**
  > **C is a cause of E if and only if:**
  > 1.  **Actuality:** C and E are both part of the actual history of the world (not merely counterfactual).
  > 2.  **Contribution:** C was a non-redundant part of a sufficient set of conditions that *actually produced* E (physical/process link).
  > 3.  **Deviance:** C represents a deviation from a relevant **Default/Normal State** (whether statistical, functional, or normative).

  Here is how this principle saves all five of your verdicts where the "big two" theories fracture.

  ---

  ### **1. Suzy vs. Billy (Early Preemption)**
  *   **Counterfactual View:** Fails. (If Suzy hadn't thrown, Billy would have, so bottle still shatters. No dependence.)
  *   **Interventionist View:** Struggles. (If you wiggle Suzy's throw but hold Billy's fixed at "ready to throw," the bottle still shatters.)
