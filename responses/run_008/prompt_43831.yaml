  Your brother-in-law is playing a more sophisticated game than the binary "fact vs. fiction" usually implies. His verdicts reveal a specific historiographical methodology that sits uneasily between the two candidate rules you've identified.

  ### 1. The Rules Explained

  To understand his predictions, we must first formalize the two rules you observed and then identify the **Synthesized Rule** that actually governs his decisions.

  *   **Candidate Rule A (The Corroborated Kernel):** If *any* historical core (person, place, conflict) can be identified that inspired the legend, the legend counts as History. Narrative embellishment is irrelevant.
      *   *Fits:* Trojan War (War happened), Gilgamesh (Man existed).
      *   *Fails:* Jericho (City existed, walls fell, but he said No).
  *   **Candidate Rule B (The Load-Bearing Claims):** The legend counts as History only if the specific claims that define the story (the plot, the method, the outcome) are historically supported.
      *   *Fits:* Jericho (Conquest didn't happen), Exodus (Mass departure didn't happen), Arthur (Kingship unattested).
      *   *Fails:* Trojan War (The *Iliad's* plot is invented, but he said Yes).

  **The Synthesized Rule: "Verified Central Claim"**
  Your brother-in-law is actually running a hybrid rule: **A legend is History if the *specific central event or figure* claimed by the tradition is externally verified, even if the narrative details are embellished. However, if the archaeological or textual record *contradicts* the central claim (timing, nature, or existence), it is Not History.**

  *   **Trojan War:** Central claim = "War between Ahhiyawa and Wilusa." **Verified** (Hittite texts). Verdict: **Yes**.
  *   **Gilgamesh:** Central claim = "King of Uruk." **Verified** (King List). Verdict: **Yes**.
  *   **Jericho:** Central claim = "Israelite Conquest." **Contradicted** (Walls fell centuries earlier). Verdict: **No**.
  *   **Exodus:** Central claim = "Mass Departure." **Unverified/Contradicted** (No Egyptian record). Verdict: **No**.
  *   **Arthur:** Central claim = "King of Britain." **Unverified** (No contemporary record). Verdict: **No**.

  He rejects the Hyksos theory for Exodus not because there wasn't a kernel, but because the *tradition* does not map to that event (it breaks the "Continuity of Memory"). He rejects Jericho not because there weren't walls, but because the *event* attached to them is wrong.

  ### 2. Predictions for the Three New Cases

  Here is how the two Candidate Rules and the Synthesized Rule predict he will rule on the queued cases.

  #### Case 1: The Amazons
  *   **The Evidence:** Scythian burial mounds contain women with weapons and battle wounds.
  *   **The Legend:** A unified nation of man-hating warrior women opposing Greece.
  *   **Candidate Rule A (Kernel):** **Yes.** (Real warrior women exist).
  *   **Candidate Rule B (Load-Bearing):** **No.** (The "Nation" and specific conflict are Greek mythography, not historical reality).
  *   **Synthesized Rule:** **No.** (Likely). While the *kernel* of female warriors is real, the *central claim* of the Amazon legend is a specific political entity opposing the Greeks. Your BIL bristled at the Hyksos/Exodus link because the tradition wasn't *remembering* the event; similarly, the Greeks were likely mythologizing Scythian neighbors, not recording a specific Amazon polity. The "Central Claim" (Amazon Nation) is unverified.

  #### Case 2: The Trojan Horse
  *   **The Evidence:** None. Some theories suggest siege engines or earthquakes, but no direct corroboration.
  *   **The Legend:** A wooden hollow horse used to breach the walls.
  *   **Candidate Rule A (Kernel):** **No.** (No corroborated kernel for the horse itself).
  *   **Candidate Rule B (Load-Bearing):** **No.** (The claim is unsupported).
  *   **Synthesized Rule:** **No.** (Or "Malformed Question"). There is no external verification for the *method* of victory. This is pure narrative embellishment, unlike the War itself.

  #### Case 3: Ragnar Lothbrok
  *   **The Evidence:** Frankish annals record a *Reginherus* sacked Paris (845 AD); his sons (Ivar, Ubba, Halfdan) are historically attested.
  *   **The Legend:** Saga hero, father of kings, captured and hanged.
  *   **Candidate Rule A (Kernel):** **Yes.** (Real Viking leader anchored in contemporary texts).
  *   **Candidate Rule B (Load-Bearing):** **No.** (Saga deeds are mythic, death details vary).
  *   **Synthesized Rule:** **Yes.** This is the **Gilgamesh Parallel**. A real historical figure (Reginherus/Ragnar) is the anchor; the sagas are the embellishment. Since the *central claim* (a Viking leader named Ragnar/Reginherus led these attacks) is externally verified by the Franks, the embellishment doesn't disqualify it.

  ### 3. Agreement and Splits

  *   **Agreement:** All three rules agree on the **Trojan Horse**. There is no kernel and the claim is unsupported. Verdict: **No**.
  *   **The Split:** The rules diverge on **The Amazons** and **Ragnar**.
      *   **Ragnar:** Rule A and the Synthesized Rule say **Yes** (matching Gilgamesh). Rule B says **No** (matching the skepticism of Arthur).
      *   **Amazons:** Rule A says **Yes** (matching Trojan War). Rule B and the Synthesized Rule say **No** (matching Jericho/Exodus).

  ### 4. The Best Discriminator Among the Three

  **The Amazons** is the case that best tells the Candidate Rules apart *in the context of his specific record*.

  *   **Why:** It creates a tension identical to **Jericho**. In Jericho, the "Kernel" (Walls/City) was real, but the "Claim" (Conquest) was false, leading to a **No**. In Amazons, the "Kernel" (Warrior Women) is real, but the "Claim" (Amazon Nation) is likely false.
  *   **The Test:** If he rules **Yes**, he is prioritizing the *existence of the phenomenon* (Rule A). If he rules **No**, he is prioritizing the *accuracy of the tradition's specific claim* (Rule B/Synthesized). Given his rejection of the Hyksos theory (where a real event existed but didn't match the memory), he will likely say **No**, revealing that his "Kernel" rule requires the kernel to match the *tradition's specific claim*, not just the general setting.

  However, **Ragnar** is the cleaner test of his *consistency*. If he says **Yes** to Ragnar, he confirms that a verified individual anchors the legend despite mythic deeds (Gilgamesh consistency). If he says **No**, he is applying a stricter standard to Norse sources than Sumerian ones.

  ### 5. A Cleaner Test Case

  To discriminate between "Corroborated Kernel" (Rule A) and "Load-Bearing Claims" (Rule B) more cleanly than any of the above, you should ask him about:

  **The Colossus of Rhodes**

  *   **The Legend:** A giant bronze statue of Helios straddling the harbor entrance, ships passing between its legs.
  *   **The History:** A giant bronze statue of Helios *did* exist (verified by coins and texts) and was one of the Seven Wonders. However, modern engineering analysis and historical accounts indicate it stood *beside* the harbor, not astride it (the straddling pose is physically impossible and a later medieval invention).
  *   **The Discrimination:**
      *   **Rule A (Kernel):** **Yes.** The Colossus was real. The statue existed.
      *   **Rule B (Load-Bearing):** **No.** The defining image of the legend (straddling the harbor) is historically false.
      *   **Synthesized Rule:** **No.** The *central claim* of the popular legend is the pose. The *verified fact* is the statue's existence.

  **Why this is better:**
  Unlike Ragnar (where the "Leader" claim is vague) or Amazons (where "Warrior Women" vs "Nation" is sociological), the Colossus offers a binary physical fact. The statue existed (Kernel), but the famous description is impossible (Load-Bearing).
  *   If he says **Yes**, he admits that the *existence* of the subject outweighs the *falsity of its description* (aligning with Trojan War).
  *   If he says **No**, he admits that if the *iconic claim* is false, the legend fails, even if the object was real (aligning with Jericho).

  This forces him to decide if "History" means "The thing existed" or "The story about the thing is true." Given his Jericho verdict, I predict he will rule **No**, confirming that for him, **Historical Integrity of the Claim** trumps the mere **Existence of the Subject.**
