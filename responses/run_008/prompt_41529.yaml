answer: |-
  The principle that captures your verdicts is **The Principle of Architectural Signatures.**

  Your gut is distinguishing between claims that posit a **functional benefit** (the trait *does* something useful) and claims that posit a **specialized mechanism** (the trait is *built* in a specific, constrained way that general-purpose systems cannot explain).

  Evolutionary psychology is most robust when it identifies "fingerprints of design"—specific constraints, biases, or dissociations in the cognitive or physiological architecture that are improbable under a null hypothesis of general learning, general physiology, or cultural transmission.

  ### The Principle Stated Precisely

  A claim is likely valid EP (and not a just-so story) if it satisfies three criteria:

  1.  **Dissociation:** The behavior or response must dissociate from general-purpose processing. (e.g., Logic works for social contracts but fails for abstract rules; Learning works for snakes but fails for guns).
  2.  **Constraint:** The mechanism must show a specific bias that contradicts efficiency or logic in the modern environment. (e.g., Fearing a low-threat snake more than a high-threat gun).
  3.  **Byproduct Immunity:** The claim must be harder to explain as a side-effect of a broader physiological process than as a selected adaptation.

  ### Resolving the Snake vs. Morning Sickness Puzzle

  This principle explains why your gut acquits the snake story but condemns the pregnancy one, despite both being post-hoc adaptations.

  *   **Snake Fear (Architectural Signature):** This theory does not claim you are born fearing snakes. It claims you possess a **prepared learning mechanism**. The evidence is a *dissociation*: monkeys learn fear of snakes rapidly but not flowers; humans learn fear of snakes faster than guns. This is a specific constraint on *information processing*. It is hard to explain as a byproduct of general anxiety.
  *   **Morning Sickness (Functional Benefit):** Profet's hypothesis argues that nausea *functions* to protect the embryo. While the correlation (nausea peaks during organogenesis) is compelling, the mechanism (nausea) is a blunt physiological instrument. The null hypothesis—that nausea is a unavoidable side-effect of the high hCG levels required to maintain pregnancy—is physiologically parsimonious. To prove adaptation, one must show the nausea itself was selected *for*, not just that it is useful. Your gut recognizes that **utility does not equal design.** A benefit can be accidental; a learning bias is rarely accidental.

  ### Audit of Your Verdicts

  **Saved by the Principle:**
  *   **Cheater Detection:** Strong dissociation (Abstract vs. Social Wason task). Identifies a specific cognitive module.
  *   **Jealousy:** Strong dissociation (Male/Sexual vs. Female/Emotional). Identifies a sex-specific computational rule.
  *   **Snake Fear:** Strong constraint (Preparedness). Identifies a specific learning bias.

  **Overturned or Threatened by the Principle:**
  *   **Morning Sickness:** **Threatened.** It relies on functional correlation rather than architectural constraint. The "byproduct" null hypothesis remains potent. Your skepticism is methodologically sound.
  *   **Waist-to-Hip Ratio (0.7):** **Overturned.** Fails the *Constraint* criterion. Cross-cultural studies show high variability (e.g., preferences shift with resource scarcity). It looks more like a cultural heuristic or a proxy for BMI than a fixed architectural constant.
  *   **MHC/Smell:** **Overturned.** Fails *Byproduct Immunity* and *Dissociation*. Effect sizes are small, replications are inconsistent, and confounds (like the pill) wipe out the effect. It lacks the robust "fingerprint" of a dedicated mechanism.

  ### Predictions for Undecided Cases

  **1. Depression as Analytical Rumination (ARH)**
  *   **The Claim:** Depression is an adaptation that forces the mind to focus on complex social problems via rumination.
  *   **Application of Principle:** This claims an **Architectural Signature** (a specific cognitive mode of enhanced analysis).
  *   **Prediction:** **Skepticism.** To pass the principle, proponents must demonstrate *enhanced* analytical performance during depression, not just increased focus. Current evidence suggests depression degrades executive function and cognitive flexibility. Unless ARH can show a specific *dissociation* (e.g., depressed individuals solve complex social puzzles *better* than controls while failing simple tasks), it risks being a just-so story that reframes a malfunction as a feature.
  *   **Verdict:** Likely a byproduct of system shutdown, not a specialized adaptation.

  **2. Moral Disgust as Co-opted Parasite Avoidance**
  *   **The Claim:** The neural circuitry for pathogen disgust was exapted for moral judgment.
  *   **Application of Principle:** This claims an **Architectural Signature** (shared neural substrate between physical and moral disgust).
  *   **Prediction:** **Credence.** There is robust evidence of *dissociation* and cross-activation (e.g., priming hygiene reduces moral severity; the "Macbeth Effect"; overlapping insula activation). This fits the "co-option" model well: it identifies a specific mechanism (disgust) and shows it constrains moral reasoning in ways general cognition does not.
  *   **Verdict:** Likely valid. It identifies a specific structural constraint on moral judgment rooted in physiology.

  ### Summary
  Your gut is tracking the difference between **Engineering** and **Utility.**
  *   **Snake/Cheater/Jealousy:** "Here is a specific piece of mental machinery that works oddly." (Engineering)
  *   **Sickness/WHR/Smell:** "Here is a trait that happens to be useful." (Utility)

  Trust the gut when it demands evidence of the machine, not just the output.
