          *   **Assessment:** Again, wrong name (Makinson vs. Kyburg). The structure described is correct for the Lottery Paradox (Belief $\neg T_1$...$\neg T_n$, Conjunction $\rightarrow$ Belief $\neg \exists$ Winner, Contradiction with Certainty $\exists$ Winner).
