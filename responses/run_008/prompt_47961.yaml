      *   *Claim 10:* "The real lesson is that rationality has to be qualitative at bottom: belief is not a degree but a stance, and the preface author's stance toward each claim, unlike her stance toward the lottery, is based on evidence about that very claim, which is why the paradoxes cannot be treated as the same case and why the author is rational to believe each claim and also that not all of them are true."
          *   **Assessment:** This is a qualitative defense (likely hinting at something like the distinction between statistical vs. causal evidence, or perhaps a non-probabilistic account of warrant). While the conclusion (qualitative stance) is a valid philosophical position to take, it is built on the false premise that the credence view fails the Preface. However, the distinction drawn (evidence about the claim vs. statistical chance) is a standard move (e.g., Achinstein, or distinguishing lottery from preface).
