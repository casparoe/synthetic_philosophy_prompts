  11. **Final Polish:** Check the flow and ensure the "Open Source" verdict is clear. (It feels like the "Political donation" case).

  *(Self-Correction on the Open Source case)*: Wait, if the contributors threaten to leave, that's *their* sanction. The question is whether *pushing him out* is OK. If the project relies on volunteer labour, their withdrawal is a market force. But is it *morally* OK to force him out? If his blog doesn't impact the work, it leans towards "Not fine". It's similar to the donation case. I will argue it's generally not fine unless there's a direct nexus.

