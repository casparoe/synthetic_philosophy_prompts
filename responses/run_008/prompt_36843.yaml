      *   The "fact of the matter" is that there is no individual "me" to be distinguished in the first place.
      *   Analogy time: The user is an insurance adjuster. Maybe use an analogy about claims files or something? No, keep it general but concrete. The "dream" analogy is classic Schrödinger. Or the "multiple personalities" analogy. Let's stick to the "singular subject" idea.

