answer: |-
  You have identified a precise mechanism that sits at the very heart of the original theory of memetics, yet lacks a clean, universally agreed-upon label in contemporary cultural evolution.

  ### The Existing Terminology (and why it falls short)

  **1. "Meme" (The Technical vs. Popular Problem)**
  Technically, the term you are looking for **is** "meme." When Richard Dawkins coined the word in *The Selfish Gene* (1976), he explicitly used the **chain letter** as his primary example of how a cultural replicator works. He argued that ideas spread not because they are good for the *host* (the human), but because they are good at *getting themselves copied*.
  *   **Why it fails you:** In the last 20 years, the popular definition of "meme" has shifted to mean "a funny image or trend people share because they enjoy it" (spread by *appeal*). This obscures the "spread by *command*" mechanism you are describing.

  **2. "Memetic Virus" or "Parasitic Meme"**
  In the sub-field of memetics (popularized by thinkers like Daniel Dennett and Richard Brodie), this is often called a **Memetic Virus**. This term captures the "threat" aspect (the idea harms the host's interests to benefit its own replication).
  *   **Why it fails you:** It focuses on the *outcome* (harm to the host) rather than the *mechanism* (the embedded instruction). A religion that demands proselytizing might actually benefit its followers (community, support), so calling it a "virus" is value-laden and inaccurate, even if the replication mechanism is identical to a chain letter.

  **3. "Computer Worm" (The Best Analogy)**
  In computer science, there is a strict distinction between a *virus* (which attaches to a host program) and a **worm** (which is a standalone program that contains its own code for transmission). Your cultural items are **Cultural Worms**.
  *   **Why it fails you:** It is not a standard term in sociology or anthropology.

  ---

  ### The Coined Term: "Replicative Imperative"

  Since no single academic term isolates the *mechanism* (embedded command + consequence) from the *appeal* (liking/sharing), I propose the term **Replicative Imperative**.

  #### Definition
  A **Replicative Imperative** is a cultural unit that contains an explicit instruction for its own reproduction, coupled with a stated consequence (reward or threat) for compliance or non-compliance, which operates independently of the host's genuine appreciation of the content.

  #### The Three Criteria
  For a cultural item to qualify as a Replicative Imperative, it must meet these three conditions:
  1.  **Explicit Instruction:** The content explicitly tells the carrier to copy/transmit it (e.g., "Send this to 10 people," "Go and make disciples," "Invite 3 friends").
  2.  **Fidelity Requirement:** The instruction demands the *message itself* be preserved, not just the gist. (An ad says "Buy Coke"; a Replicative Imperative says "Forward *this email*").
  3.  **Externalized Consequence:** The motivation to comply is tied to a consequence outside the content's intrinsic value (e.g., bad luck, financial payout, salvation, account suspension) rather than the joy of sharing.

  ---

  ### How it Differs from Ordinary Persuasion

  The distinction lies in **where the motivation originates.**

  *   **Ordinary Persuasion / Word of Mouth:** "I loved this movie; you should see it."
      *   *Mechanism:* The host transmits because of an internal state (enjoyment).
      *   *Fidelity:* Low. You can describe the plot in your own words.
      *   *Consequence:* None, other than social bonding.
  *   **Replicative Imperative:** "Forward this email or you will have bad luck."
      *   *Mechanism:* The host transmits because the *message commands it*.
      *   *Fidelity:* High. You must forward the exact text.
      *   *Consequence:* Explicit threat/reward tied to the act of copying.

  ### Boundary Cases

  To test the definition, here are three cases that sit on the fence:

  **1. The "Viral Loop" (Boundary Case: Leaning towards Replicative Imperative)**
  *   *Example:* Dropbox giving you extra storage space if you invite three friends.
  *   *Analysis:* This contains an instruction and a reward. However, it is transparently transactional. It becomes a Replicative Imperative when the reward becomes superstitious or opaque (e.g., "Invite friends to unlock your destiny" vs. "Invite friends to get 1GB").
  *   *Verdict:* **Functional Replicative Imperative.** It uses the mechanism without the superstition.

  **2. Political Slogans (Boundary Case: Leaning towards Ordinary Meme)**
  *   *Example:* "Make America Great Again" or "Yes We Can."
  *   *Analysis:* These spread rapidly, but they do not contain an *embedded instruction* to reproduce the slogan itself. They inspire action, but they don't say "Say this phrase 10 times or else."
  *   *Verdict:* **Appeal-Based Meme.** They rely on resonance, not command.

  **3. Religious Tithing/Proselytizing (Hard Case)**
  *   *Example:* A church teaching that you must tithe 10% and convert one person a year to ensure blessings.
  *   *Analysis:* If the focus is on the *community benefit* of sharing, it is persuasion. If the focus is on "God will punish you if you do not spread this specific doctrine," it is a Replicative Imperative.
  *   *Verdict:* **Context Dependent.** Many organized religions shift between these modes. The "Watchtower" model (strict reporting of hours spent proselytizing) is a Replicative Imperative; a Quaker meeting is not.

  ### Why the Distinction Matters

  In cultural evolution, distinguishing **Replicative Imperatives** from **Appeal-Based Memes** is crucial for predicting survival.

  *   **Appeal-Based Memes** are subject to natural selection based on human psychology. If humans stop liking the song, the song dies.
  *   **Replicative Imperatives** bypass human psychology. They can persist even if humans *hate* them (e.g., spam emails, pyramid schemes that ruin finances). They evolve to become better at *coercion*, not better at *utility*.

  Identifying a Replicative Imperative allows you to recognize when a cultural item is acting like a **parasitic code** rather than a **useful tool**. It signals that the item's success is decoupled from human well-being.
