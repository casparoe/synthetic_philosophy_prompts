answer: |-
  **Chapter Proposal: The Evidential Structure of Inertial Effects**

  **1. Research Question**
  Does Newton's bucket experiment provide evidence for the existence of absolute space (substantivalism), or does it merely establish that rotational motion is non-relative to *immediate* surroundings without settling the ontological status of space? More precisely: Is the underdetermination of space ontology by the bucket experiment a failure of the experiment itself, or a necessary consequence of the distinction between performable local experiments and decisive global counterfactuals?

  **2. Motivation and Problem Statement**
  The standard narrative in the philosophy of physics treats Newton's bucket as a decisive empirical argument for substantivalism over relationism. The concave surface of the rotating water is taken to demonstrate motion relative to space itself, as motion relative to the bucket is insufficient to explain the effect. My advisor's critique that this "re-litigates Newton versus Leibniz" is accurate if the chapter merely rehearses the historical positions. However, the standard narrative contains a structural gap that has not been adequately formalized.

  A Machian relationist can account for the bucket's behavior by appealing to rotation relative to the fixed stars (the total mass distribution). Therefore, the performable bucket experiment underdetermines the ontology: it rules out *local* relationism (motion relative only to the container) but does not rule out *global* relationism (motion relative to the total matter distribution). Conversely, Newton's "two globes" thought experiment—two bodies connected by a cord in an otherwise empty universe—is ontologically decisive for substantivalism but is empirically unperformable.

  This chapter will not argue for one side of the historical debate. Instead, it will analyze the *evidential structure* of the debate. The central problem is a mismatch between decidability and performability. The experiment we can run (the bucket) does not settle the metaphysics; the experiment that would settle the metaphysics (the globes) cannot be run. By making this structure precise, the chapter moves beyond historical exegesis to a methodological claim about how ontological commitments are secured in classical mechanics.

  **3. Methodology and Work Plan (One Semester)**

  *   **Month 1: Reconstruction of the Standard Argument.**
      I will formalize the standard inference from the bucket phenomenon to substantivalism. This involves defining the specific premises required to move from "water climbs the walls" to "space is a substance." I will identify exactly where the inference relies on the assumption that the only alternative to absolute space is local relationism.
  *   **Month 2: The Machian Counter-Reconstruction.**
      I will formalize the Machian response, specifically focusing on how rotation relative to distant matter generates the same inertial effects without positing absolute space. The goal is not to defend Mach, but to demonstrate that the bucket data is compatible with this framework. This establishes the underdetermination claim.
  *   **Month 3: The Two Globes Contrast.**
      I will analyze Newton's two globes case. I will argue that this scenario isolates absolute rotation from all matter, making it the true test of substantivalism. I will then demonstrate why this scenario is counterfactual and unperformable in a way the bucket is not. This section will develop the "Decidability vs. Performability" framework.
  *   **Month 4: Synthesis and Drafting.**
      I will integrate the analyses to answer the research question. The draft will argue that the bucket's philosophical role is narrower than traditionally assumed: it establishes the reality of inertial forces but leaves the ontology of their source open. I will articulate the implications for how we treat thought experiments in physics.
  *   **Month 5: Revision and Integration.**
      I will refine the argument to ensure it does not drift into historical survey. I will check that the conclusion offers a generalizable insight about evidential support in physics, suitable for the broader dissertation context.

  **4. Possible Conclusions and Decision Criteria**
  *   **Conclusion A (The Underdetermination Thesis):** The bucket experiment is ontologically neutral between absolute space and global relationism. This is supported if the Machian reconstruction in Month 2 successfully derives the inertial effects without remainder.
  *   **Conclusion B (The Local/Global Distinction):** The bucket decisively refutes only *local* relationism. This is supported if the formalization in Month 1 shows that Newton's argument implicitly assumes the absence of distant matter.
  *   **Conclusion C (The Methodological Moral):** The debate persists not because the evidence is ambiguous, but because the decisive evidence is inaccessible. This is supported if the analysis of the two globes in Month 3 shows that absolute space is only empirically distinct from relationism in empty-universe scenarios.

  *Decision Criteria:* The choice among these conclusions will depend on whether the Machian account requires additional dynamical postulates that amount to hidden substantivalism. If Mach's account requires positing a physical field that acts like space, Conclusion A weakens. If Mach's account remains purely kinematic, Conclusion A holds.

  **5. Conditions for Failure**
  This chapter fails if:
  1.  **Historical Drift:** It becomes a summary of what Newton, Leibniz, and Mach said, rather than an analysis of the logical structure of their arguments. (This would vindicate the advisor's initial critique).
  2.  **Triviality:** It concludes merely that "more evidence is needed" without specifying *why* the specific evidence available is structurally incapable of deciding the issue.
  3.  **Irrelevance:** It fails to connect the Newtonian case to broader issues in the dissertation (e.g., underdetermination, the role of thought experiments, or the interpretation of modern gauge theories).
  4.  **Factual Error:** It turns out that the "two globes" scenario is not actually the decisive test (e.g., if general relativity renders the distinction moot in a way that retroactively dissolves the Newtonian problem).

  **6. Honest Assessment: Chapter or Survey?**
  There is a genuine risk that this project collapses into the survey my advisor warned against. The distinction between "re-litigating history" and "analyzing evidential structure" is thin. If I spend Months 1 and 2 simply explaining Mach's critique, I am writing history. To avoid this, the focus must remain on the *conditions of empirical adequacy* and the *logic of counterfactuals*, not the historical figures' intentions.

  However, if executed correctly, this is a viable chapter, not a whole dissertation. A dissertation would require applying this "Decidability vs. Performability" framework to multiple case studies (e.g., extending it to the hole argument in General Relativity or particle indistinguishability in Quantum Mechanics). This chapter would serve as the foundational case study for that broader methodological claim. It is narrow enough for a chapter because it restricts itself to the specific logical topology of the Newtonian inertial argument. It makes a specific, determinate contribution: clarifying why a specific empirical success (the bucket) fails to secure a specific ontological conclusion (substantivalism), due to the modal status of the required evidence. This is a contribution to the philosophy of scientific inference, using physics as the domain, which satisfies the requirement for philosophical novelty beyond historical exposition.
