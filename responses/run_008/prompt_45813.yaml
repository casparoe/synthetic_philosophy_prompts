  2.  **Deconstruct the View (NU-LT):**
      *   It's a hybrid view. It tries to avoid the "Repugnant Conclusion" style problems of standard Utilitarianism (by prioritizing severe suffering) and the "Benevolent World-Exploder" problem of strict Negative Utilitarianism (by allowing trade-offs below the threshold).
      *   Key mechanism: Lexicality + Threshold.
      *   Key vulnerability: The boundary line.

  3.  **Brainstorming Objections (Categorization & Ranking):**

      *   *The "Arbitrariness/Discontinuity" Objection:* Small change in pain severity -> Massive change in moral status. (Classic Sorites/Parfit problem).
      *   *The "Collapse" Objection:* Is it stable? If the threshold is 0, it's NU. If infinity, it's HU. Is there a principled middle?
      *   *The "Internal Tension" Objection:* How can pain be commensurable with pleasure *sometimes* but not *others*? What changes metaphysically at the threshold?
      *   *The "Demandingness/Action Guidance" Objection:* If lexical priority holds, we must always prioritize the worst suffering. Does this paralyze action? (Similar to NU).
      *   *The "Insulation/Unfalsifiability" Objection:* Can any case refute it? If every counter-example is met by "adjust the threshold," is it meaningful?
