  *(Self-Correction during drafting)*: I initially thought about calling the "One Agony" case a Serious defeater. But for a lexical theorist, that's usually the *point*. I should classify it as "Awkward/Feature" but note that if the gap is too small, it becomes Serious. I will focus the "Serious" category on the *Sorites* version of that problem (the spectrum).

  *(Refining the "Insulation" point)*: This is crucial. If the view says "My intuition says the threshold is here," and you show a counter-case, and they say "Okay, I move the threshold," the view is ad hoc. I need to emphasize the need for a *principled* threshold.

  *(Refining the "Internal Tension")*: The user asked to be direct. I will state clearly: You are positing a quantitative trigger for a qualitative moral shift without explaining the ontological ground of that shift.

