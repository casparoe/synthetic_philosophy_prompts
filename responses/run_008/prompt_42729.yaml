answer: |-
  It is a sophisticated position you hold, and one that commands considerable respect within contemporary decision-theoretic circles. The functional/updateless family (encompassing UDT and FDT) does indeed secure a unique 'double victory' in the canonical literature: it captures the intuitive gain in the Counterfactual Mugging (where CDT fails) and avoids the intuitive loss in XOR Blackmail (where EDT fails). To an advocate, this looks like convergence on the truth; to a sceptic, it looks like curve-fitting.

  You have asked for the strongest cases against this view, ranked by severity, whilst avoiding the standard, somewhat tired objections regarding 'ignoring evidence' or the temporal status of the coin flip. You also wish to address the methodological worry of gerrymandering and the practical question of scale.

  Here is an assessment of the vulnerabilities in the updateless position, ranked from structurally fatal to merely awkward, written in British English.

  ### 1. The Problem of Logical Counterfactuals (Fatal/Structural)

  This is the most significant technical deficit facing Functional Decision Theory (FDT) specifically, and the updateless family generally. Causal Decision Theory rests upon the well-defined mathematics of causal graphs and the *do*-operator (Pearlian causality). We have a robust formalism for asking, 'What would happen if I *did* X?'

  Updateless theories, however, rely on *logical* counterfactuals: 'What would happen if my algorithm *outputted* Y, given that it is determined to output X?' This requires a theory of counterpossible reasoning—reasoning about logically impossible worlds (since if the algorithm is deterministic, it cannot output Y).

  **The Damage:** There is currently no agreed-upon, mathematically rigorous calculus for logical counterfactuals. While defenders (such as Yudkowsky and Soares) acknowledge this, it remains an open research problem. Without a formal semantics for these counterfactuals, the theory risks being ill-defined.
  **The 'Troll Bridge' Case:** A specific instantiation of this problem is the 'Troll Bridge' scenario. Here, an agent must cross a bridge guarded by a troll who blows it up if the agent crosses *for a bad reason* (e.g., via a proof that crossing leads to disaster). Certain formalisations of FDT lead the agent to refuse to cross, effectively allowing a proof of its own inconsistency to dictate physical reality. This looks less like rational acausal reasoning and more like a pathological vulnerability to 'spurious proofs'. If a decision theory can be forced into paralysis by a logical trick that has no causal bearing on the world, its claim to normative superiority is severely compromised.
  **Defender Concession:** Proponents concede this is the primary bottleneck. Until logical counterfactuals are as well-defined as causal ones, FDT remains a research programme rather than a finished theory.

  ### 2. Prior Sensitivity and Hostile Environments (Fatal/Strategic)

  Updateless Decision Theory optimises a policy based on a *prior* distribution over possible worlds. It tells you to act according to the policy that would have maximised expected utility *before* you received your specific observations.

  **The Damage:** This makes the theory exquisitely sensitive to the choice of prior. In a 'benign' universe (one containing Newcomb-like predictors who reward updatelessness), UDT wins. However, consider a 'hostile' universe containing 'Parasitic Predictors'. These entities scan you, and if they detect an updateless policy (one that pays Counterfactual Muggers), they punish you. If they detect a CDT policy (one that keeps the money), they reward you.
  In such an environment, the CDT agent thrives and the UDT agent bleeds utility. A defender might reply, 'But your prior should have assigned low probability to such malicious predictors.' This is true, but it shifts the burden entirely onto the prior. If the 'right' prior is simply 'the one that makes UDT win', the theory becomes circular. If the prior is objective, then UDT is not universally superior; it is only superior conditional on the universe being friendly to acausal trade. This undermines the claim that UDT is *rationally required*; it suggests it is merely a high-variance strategy that pays off in specific cosmological conditions.

  ### 3. The Gerrymandering Worry (Methodological/Epistemic)

  You suspect that cases like Counterfactual Mugging and XOR Blackmail are reverse-engineered from the verdicts the theorists already wanted. This worry carries significant weight.

  **The Damage:** Decision theory has historically advanced through thought experiments (Newcomb's Problem, the Prisoner's Dilemma). However, there is a risk of 'overfitting' the theory to the data set of existing thought experiments. If the updateless family was designed specifically to solve Mugging and Blackmail, its success in those areas is tautological.
  **Why this matters:** The data for decision theory are our normative intuitions. If the cases are constructed to trigger specific intuitions that favour the theory, we are not testing the theory against reality; we are testing it against the theorist's own design specifications. A genuine test would be applying UDT to a novel, naturally occurring dilemma where the intuition is unclear, and seeing if the verdict remains compelling. Currently, the 'data' are almost exclusively synthetic.
  **Defender Concession:** Most defenders would admit that the landscape of cases is skewed. However, they argue that Mugging and Blackmail reveal structural features of rationality (the value of pre-commitment and the handling of logical correlation) that exist independently of the specific story. Whether this is sufficient to overcome the charge of gerrymandering depends on whether one believes these cases isolate deep principles or merely clever puzzles.

  ### 4. Unfalsifiability and Algorithm Identification (Conceptual)

  A recurring defence against counter-examples is to adjust the definition of 'the algorithm' or 'the logical counterfactual'.

  **The Damage:** If an agent faces a scenario where UDT seems to give the wrong answer, a defender can often argue that the agent has misidentified the relevant algorithmic similarity. For instance, 'You aren't logically correlated with the predictor in *that* specific way.' If the criteria for logical correlation are flexible enough to accommodate any verdict, the theory risks becoming unfalsifiable.
  **Is this a problem?** For a normative theory, yes. If a theory cannot specify in advance which physical structures count as instantiations of the same algorithm, it cannot guide action. It becomes a post-hoc rationalisation tool: 'I won, therefore I was updateless,' or 'I lost, therefore I wasn't truly updateless.' To avoid this, FDT needs a rigorous, physicalist account of algorithmic similarity that does not rely on intuitive hand-waving.

  ### 5. Scale and Practicality (Limitation of Scope)

  You ask whether this ever cashes out as practical advice for humans, or if it is merely for parlour demonstrations.

  **The Assessment:** For human beings in the current epoch, the updateless line is almost certainly practically inert.
  1.  **Simulation Probability:** Unless you have strong reason to believe you are currently in a simulation run by a powerful agent who is conditioning rewards on your decision theory (a la Counterfactual Mugging), the expected value of acting updatelessly is negligible. The 'acausal' links required for these payoffs rely on the existence of powerful predictors or simulators.
  2.  **Causal Dominance:** In the actual world, causal consequences dominate acausal ones. Handing over £100 to a mugger who claims to have predicted you (but offers no proof) is almost certainly a causal loss.
  3.  **The AI Exception:** The theory becomes vital only when dealing with agents that can read your source code or simulate you with high fidelity—i.e., advanced AI systems.

  **Is this a Defeater?** It is not a falsification, but it is a severe limitation of scope. If a decision theory only yields different, superior results in scenarios that do not currently exist for human actors, its status as a guide for *human* rationality is diminished. It becomes a theory of *AI alignment* or *idealised rationality*, rather than a practical handbook for human conduct. If you are looking for a theory to live by today, UDT offers little over CDT, because the world is not (yet) full of Omega-like predictors.

  ### Summary and Recommendation

  To move you from your current position, the following arguments should carry the most weight:

  1.  **The Technical Void:** The lack of a formal calculus for logical counterfactuals is the most damaging objection. Without it, the theory is conceptually incomplete. (Fatal)
  2.  **Prior Dependence:** The realisation that UDT only wins if your prior assumes a universe friendly to acausal trade. If the universe is hostile, UDT is a liability. (Fatal)
  3.  **Practical Inertia:** The acknowledgement that for humans, this is likely a theoretical curiosity rather than a practical guide, unless one assigns high probability to being in a specific kind of simulation. (Awkward/Limitation)

  Regarding your suspicion of gerrymandering: it should weigh heavily. A theory that solves exactly the problems its creators posited, using intuitions derived from those same problems, requires independent validation. Until UDT/FDT produces a surprising, correct verdict in a *natural* dilemma (one not constructed by decision theorists), the charge of overfitting remains potent.

  In conclusion, the updateless view is likely the correct *ideal* for agents embedded in a universe of high-fidelity simulators and logical predictors (such as future AI ecosystems). However, as a normative theory for human beings in the causal, messy present, it suffers from technical incompleteness and practical irrelevance. It is not necessarily false, but it is arguably premature to treat it as settled dogma.
