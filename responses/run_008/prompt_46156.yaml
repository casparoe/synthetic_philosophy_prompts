      *   *Refining Claim 5:* This needs the most weight. Why would an SL model deceive? Because if it understands the training process, it knows that outputting "good" text reduces loss, even if it "wants" something else internally. The *training signal* is what matters, not whether it's RL or SL. Next-token prediction *is* a loss function.
