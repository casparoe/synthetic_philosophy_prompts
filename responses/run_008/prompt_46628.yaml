answer: |-
  What the two sides actually want
  The patchers want Bayesian confirmation theory to remain a universal normative logic of scientific inference. They seek a formal maneuver—like conditioning on entailment rather than evidence—that preserves the axioms while outputting the correct intuitive verdict: that GR was confirmed by Mercury. The dissolvers, conversely, want to protect Bayesianism from overreach. They argue the framework inherently assumes a fixed menu of theories and logical omniscience. When a new theory arrives, the probability space itself shifts, violating the conditioning model. Their goal is to relocate the issue from "confirmation logic" to "conceptual change," admitting that Bayesianism models theory assessment within a framework, not framework creation. They want to stop treating a category error as a mathematical puzzle.

  Verbal or real, and why
  The disagreement is substantively real, though masked by verbal ambiguity about "confirmation." If confirmation is a timeless logical relation between theory and evidence, the patchers are right: the formalism fails because $P(E)=1$ blocks updating. The problem is mathematical. However, if confirmation describes a psychological process of belief revision, the dissolvers are right: the event isn't learning $E$, but learning $T$ exists. The stalemate persists because patchers treat the prior over entailments ($P(T \models E)$) as accessible, while dissolvers note this requires assigning probabilities to unconceived theories. This isn't just semantics; it's a clash over whether Bayesianism describes ideal rationality or feasible cognition. The patchers want the math to work despite logical omniscience; the dissolvers insist logical omniscience is the culprit. Until they agree on whether Bayesianism is a logic of justification or a model of discovery, they will talk past each other. The "circularity" charge is real: you cannot assign a prior to an entailment involving a theory you cannot yet formulate. Thus, the dispute is about the scope of the framework, not just terminology. The patchers believe a clever re-description of the evidence stream solves the issue; the dissolvers believe this re-description implicitly changes the probability space, violating the very conditions that make Bayesian updating coherent. Consequently, the debate is not merely about what "solution" means, but whether the framework can stretch to cover conceptual innovation without breaking. One side seeks a fix within the engine; the other says the engine isn't built for this terrain.

  Where the hidden question sits
  The hidden question sits squarely on the nature of rationality itself: is it a static state of coherence or a dynamic process of improvement? Bayesian confirmation theory traditionally models the former, assessing how evidence supports hypotheses within a fixed algebra. The old evidence problem arises because scientific discovery is inherently dynamic, expanding the algebra itself. The literature stalls because it tries to force a dynamic event (theory invention) into a static container (conditionalization). The deeper issue is whether "confirmation" refers to the historical cause of belief or the logical support remaining after discovery. If the former, the agent's ignorance matters; if the latter, only the logical relation counts. Most participants assume Bayesianism must handle both, but the formalism separates them. The tension also hides a question about logical omniscience: should rational agents be modeled as knowing all logical consequences instantly? If yes, old evidence is never "new" to learn. If no, the probability calculus needs modification. The debate obscures this by focusing on entailment claims rather than the architecture of the hypothesis space.

  What progress would even look like
  Progress requires abandoning the hope for a simple patch within standard conditionalization. A concrete step forward would be a formal model of "domain expansion" that explicitly tracks how probability mass is redistributed when new hypotheses enter the space, rather than pretending they were always there. This means developing a "non-standard" Bayesianism that relaxes logical omniscience without collapsing into incoherence. Alternatively, progress looks like a clear demarcation: admitting Bayesianism handles theory choice, while a different framework (perhaps conceptual change theory) handles theory generation. A toy model showing how priors shift during conceptual revolution would be more valuable than another entailment argument. Ultimately, progress means recognizing that the "problem" isn't a bug to be fixed but a boundary marker. If researchers stop trying to force GR into a pre-GR probability space and instead model the transition between spaces, the literature moves from circular patching to genuine epistemology of scientific change.
