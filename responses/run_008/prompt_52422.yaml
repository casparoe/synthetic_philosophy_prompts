answer: |-
  # Lesson Plan: The Lakatos Lab (90 Minutes)

  **Objective:** Students experience the dynamics of a Scientific Research Programme (SRP) before learning the terminology. They will feel the tension between protecting a core theory and making novel predictions.
  **Class Size:** 18 students (4 teams of 4–5).
  **Materials:** 4 Index cards (different colors), markers, projector, scoreboard (whiteboard).

  ---

  ## 1. The Hidden Rule (Instructor Eyes Only)
  **The Phenomenon:** You are "Nature." You generate a sequence of numbers based on the round number ($n = 1, 2, 3...$).
  **The Rule:** $Output = (2^n) \pmod{10}$.
  **The Sequence:**
  *   Round 1: **2**
  *   Round 2: **4**
  *   Round 3: **8**
  *   Round 4: **6** (The Trap: $2^4 = 16$, last digit 6)
  *   Round 5: **2**
  *   Round 6: **4**

  **Why this rule?**
  *   Rounds 1–3 support a "Doubling/Exponential" core ($2, 4, 8$).
  *   Round 4 falsifies simple doubling ($16 \neq 6$).
  *   To save the "Doubling" core, teams must add auxiliary hypotheses (e.g., "We are working in Modulo 10," or "There is a cap at 10").
  *   This creates the **Degenerating Programme**: A pile of epicycles to save the core.
  *   A team that guesses the Modulo rule early makes **Novel Predictions** (Progressive).

  ---

  ## 2. Timeline & Mechanics

  ### Phase 1: Setup & Core Lock (15 mins)
  1.  **Divide:** 4 Teams. Give each team 1 Index Card and a marker.
  2.  **The Rule:** "I am Nature. I hold a mathematical rule. We will run 6 Rounds. In each round, you will submit a prediction. Then I reveal the data."
  3.  **The Core Card:** "Before Round 1, write your **Core Claim** on this card. This is your fundamental law of the universe.
      *   *Constraint:* You cannot change this card. Ever.
      *   *Constraint:* You cannot erase it. I will sign it.
      *   *Example:* 'Numbers always increase,' 'Gravity is constant,' 'The sequence doubles.'"
  4.  **Collection:** Collect the cards. Sign them. Tape them to the front of the room. They are now sacred.
  5.  **The Belt:** "You may write *Auxiliary Notes* on your own desk paper. You can change these as much as you want. These are your instruments, initial conditions, and error margins."

  ### Phase 2: The Game (45 mins)
  **Cycle per Round (7 mins):**
  1.  **Deliberation (3 mins):** Teams discuss. They must produce a **Prediction** for the next number based on their Core + Belt.
  2.  **Submission (1 min):** Teams hand you a slip with their prediction.
  3.  **Reveal (1 min):** You reveal the actual number.
  4.  **Scoring & Explanation (2 mins):**
      *   **Correct Prediction:** +10 Points.
      *   **Incorrect Prediction:** 0 Points.
      *   **Post-Hoc Save:** If incorrect, they can propose an *Auxiliary Hypothesis* to explain why the data fits their Core anyway. If you (Nature) deem it logically consistent with the Core, they get +2 Points. (This incentivizes epicycles).

  **The Defection Window (After Round 3):**
  *   Announce: "Grant funding is tight. If your programme is failing, you may defect to another team."
  *   **Penalty:** Defecting team loses 15 points. Joining team gets +5 points (brain drain).
  *   **Constraint:** They must adopt the *new* team's Core Card. They cannot bring their old Core.

  ### Phase 3: Scoring & Wrap (10 mins)
  *   Tally scores.
  *   Declare a winner (usually the team with the most accurate predictions, not the most post-hoc saves).
  *   Hand back the Core Cards.

  ### Phase 4: The Debrief (20 mins)
  *   Do not lecture yet. Ask: "What happened?"
  *   Map their experience to Lakatos's vocabulary (see below).

  ---

  ## 3. Scoring Scheme (Designed to Force Degeneration)
  To ensure at least one team degenerates without rigging:

  | Action | Points | Rationale |
  | :--- | :--- | :--- |
  | **Correct Prediction** | **+10** | High reward for **Novel Facts** (Progressive). |
  | **Post-Hoc Save** | **+2** | Low reward for **Accommodation** (Degenerating). Enough to keep them alive, not enough to win. |
  | **Defection Penalty** | **-15** | High cost to abandon a Core (Theory Tenacity). |
  | **Winning** | **Glory** | Social capital matters. |

  **Why this works:**
  *   Team A (Doubling Core) will fail Round 4. They lose 10 points.
  *   To stay in the game, they add an auxiliary hypothesis ("Modulo 10"). They predict Round 5 correctly (+10).
  *   Team B (Vague Core: "It oscillates") might get lucky (+10) but can't make specific predictions later.
  *   Team C (Specific Modulo Core) risks being wrong early, but if right, steamrolls.
  *   *Crucially:* The Post-Hoc points (+2) keep Team A from defecting immediately. They think, "We can still catch up if we tweak the belt." This *is* degeneration.

  ---

  ## 4. Troubleshooting: What Will Go Wrong

  ### Problem 1: The "Steamroller" (One team guesses the rule Round 1)
  *   **Risk:** A math major writes "$2^n \pmod{10}$" immediately.
  *   **Fix:** The Core Card must be **conceptual**, not just the formula. Require the Core to be a sentence in English (e.g., "Growth is exponential"). If they write the exact formula, accept it, but warn other teams: "Nature is complex, are you sure you want to defect to them for a -15 penalty based on one data point?"
  *   **Instructor Move:** If one team is way ahead, subtly increase the "noise" in your demeanor during the reveal to induce doubt.

  ### Problem 2: Quiet Cheating (Teams change the Core Card)
  *   **Risk:** They scribble out "Double" and write "Modulo."
  *   **Fix:** **You hold the cards.** After they write them in Phase 1, *you* keep the cards on your desk. When they need to reference it, they come to your desk. They only hold the "Auxiliary Belt" paper.
  *   **Enforcement:** If you see a rewrite, publicly disqualify the prediction. "That violates the Negative Heuristic! 0 points."

  ### Problem 3: No Degeneration (Everyone defects to the winner)
  *   **Risk:** After Round 3, everyone abandons the failing teams.
  *   **Fix:** The Defection Penalty (-15) is higher than the catch-up potential. Remind them: "If you defect, you start with negative points. Is your current Core *that* dead?"
  *   **Instructor Move:** Encourage the failing team. "That auxiliary hypothesis actually looks promising. Are you sure you want to abandon ship?" (Mimics scientific tenacity).

  ### Problem 4: "Nature" is Unfair (Students claim the rule changed)
  *   **Risk:** They accuse you of changing the sequence.
  *   **Fix:** Write the full sequence (2, 4, 8, 6, 2, 4) on a sealed envelope at the start. Open it at the end to prove consistency.

  ---

  ## 5. The Debrief Mapping (The "Aha!" Moment)
  Draw a table on the board. Ask students to fill it in based on what they *did*, then supply the Lakatos term.

  | What you did | Lakatos Vocabulary |
  | :--- | :--- |
  | The Index Card you couldn't change | **Hard Core** |
  | The notes/paper you adjusted to fit data | **Protective Belt** |
  | The rule "Don't touch the Index Card" | **Negative Heuristic** |
  | Adding "Modulo 10" after failing Round 4 | **Ad Hoc Auxiliary Hypothesis** |
  | Predicting Round 5 correctly before seeing it | **Novel Fact (Progressive)** |
  | Explaining Round 4 only after seeing it | **Post-Hoc Accommodation (Degenerating)** |
  | Staying with a losing team until Round 5 | **Theory Tenacity** |
  | Defecting only when another team showed up | **Theory Choice requires a Rival** |

  **Key Discussion Question:** "Team A (Degenerating) had a Core that was technically *false* (Numbers don't just double). But they stayed in the game until Round 5. Why didn't they quit after Round 4?"
  *   *Answer:* Because there was no better option yet. (Lakatos's critique of Popper: We don't falsify immediately; we wait for a better programme).

  ---

  ## 6. Honest Note: Where The Game Misleads
  End the session by telling them where the analogy breaks. This is crucial for philosophical rigor.

  1.  **The "God's Eye" View:** In the game, *you* know the True Rule. In real science, **no one knows the True Rule**. We never know if a programme is "degenerating" or just going through a hard patch. We only know in hindsight.
  2.  **Zero-Sum Points:** In the game, points are limited. In science, multiple programmes can be "true" or useful simultaneously (e.g., Newtonian physics still works for bridges, even if Relativity is 'truer').
  3.  **Defection is Easy:** In the game, they can switch teams for a point penalty. In real science, defecting means retraining, losing grant funding, and social ostracization. The "penalty" is much higher.
  4.  **The Facilitator:** You acted as a benevolent Nature. Real Nature doesn't give +2 points for a clever excuse. Nature just says "Boom" (experiment fails). The social scoring was a proxy for **peer review/grant allocation**.

  ## Instructor Script for the "Degeneration" Moment (Round 4)
  *When Team A predicts 16 and you reveal 6:*
  **Team:** "Wait, that doesn't fit."
  **You:** "Nature doesn't care what fits. You have 2 minutes. Do you abandon your Core Card? Or do you write an auxiliary assumption on your belt paper?"
  *(Watch them sweat. If they write "Measurement Error" or "Modulo Constraint," nod solemnly.)*
  **You:** "Acceptable. But remember: Points are only for *next* time. You can't earn back the points you lost on this prediction."
