prompt: |-
  I teach philosophy of science to second-years, ~18 students, one 90-minute session. We've just done Popper, and next up is Lakatos, but I don't want to lecture research programmes at them — I want them to actually run one, and run it badly, before they get any of the vocabulary. Design an in-class game where teams get data revealed from some hidden regularity I control (number sequences, card draws, whatever works best mechanically), and they have to explain and predict it. The one rule I want baked in: at the start each team writes a core claim on a card, and they're never allowed to revise that card — everything else they do has to be auxiliary assumptions wrapped around it. Points for correctly predicting data before I reveal it, nothing for explaining it after the fact. If a team wants out, they can't just start over — they can only defect to another existing team's programme, taking a penalty. My hope is that by the end one team has a core claim surrounded by a pile of increasingly baroque epicycles that only ever fire backwards, while another team made a risky early prediction that paid off, so the debrief can just name what they've already been doing for an hour: hard core, protective belt, novel vs post hoc accommodation, progressive vs degenerating, why nobody abandons a programme until a rival shows up. Give me the concrete mechanics and timeline, a scoring scheme that reliably produces atleast one degenerating programme without me rigging it, the debrief mapping, and an honest note on what will predictably go wrong the first time (my worry is teams quietly cheating on their core card, or one team guessing my rule right away and steamrolling — how do I handle those?). Also flag where the game misleads: in real science there's no facilitator with a fixed true rule, and nobody's competing for grant money.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 2nd-year undergraduates (~18 students).
      *   **Subject:** Philosophy of Science (Lakatos).
      *   **Context:** Follows Popper. 90-minute session.
      *   **Goal:** Students *run* a research programme (badly) before learning the vocabulary.
      *   **Key Mechanics:**
          *   Teams write a "Core Claim" card (immutable).
          *   Data revealed sequentially from a hidden rule.
          *   Points for *prediction*, not post-hoc explanation.
          *   Defection allowed (with penalty), no restarting.
          *   Desired Outcome: One degenerating programme (epicycles), one progressive (risky predictions).
      *   **Deliverables:** Mechanics, Timeline, Scoring Scheme, Debrief Mapping, Troubleshooting (cheating/steamrolling), Limitations (misleading aspects).

  2.  **Deconstruct the Philosophy (Lakatos):**
      *   *Hard Core:* Irrefutable by methodological decision of proponents.
      *   *Protective Belt:* Auxiliary hypotheses, initial conditions, etc., adjusted to protect the core.
      *   *Negative Heuristic:* Don't test the core.
      *   *Positive Heuristic:* How to develop the belt.
      *   *Progressive:* Predicts novel facts.
      *   *Degenerating:* Only explains past facts (post-hoc), ad hoc adjustments.
      *   *Theory Choice:* We don't abandon a programme until a better rival exists.

  3.  **Design the Game Mechanics:**
      *   *The "Nature":* Needs to be complex enough to allow for epicycles but simple enough to be solvable. Number sequences are classic (2, 4, 8...), but card draws or physical setups might be more engaging. Let's go with a **Number Sequence Generator**. It's low prep, easy to project, and mathematical patterns invite "laws."
      *   *The Hidden Rule:* Needs to have a "surface" pattern that breaks.
          *   *Idea:* $n^2 + k$, where $k$ changes based on some condition.
          *   *Better Idea for Degeneration:* A rule that looks simple at first but has a specific exception or a shift.
          *   *Selected Rule:* "Start at 2. Add 2. But every 3rd turn, add 3 instead." (Sequence: 2, 4, 6, 9, 11, 13, 16...).
          *   *Wait, that's too easy.* Let's make it slightly more opaque to encourage auxiliary hypotheses.
          *   *Revised Rule:* "Output = Input $\times$ 2, unless Input is Prime, then Output = Input + 5." (Sequence: 1->2, 2->9, 3->8, 4->8, 5->10...).
          *   *Actually, simplest is best for a 90-min class.* Let's use a **Bingo-style Grid** or **Colored Ball Draw**.
          *   *Decision:* **The "Black Box" Number Generator.** I (the instructor) have a function $f(n)$. They give me $n$, I give $f(n)$.
          *   *To ensure degeneration:* The rule needs to change or have a hidden variable they can't see.
          *   *Best approach for "Degeneration":* The rule is consistent, but *one team* locks onto a wrong core early. The scoring must incentivize sticking with it.
          *   *The Rule:* $y = 2x + 1$ for rounds 1-5. $y = 2x + 3$ for rounds 6-10. (A "paradigm shift" in nature, or just a test of robustness).
          *   *Actually, Lakatos says the *programme* degenerates, not necessarily that nature changes.* If nature changes, it's just falsification. For Lakatos, nature stays the same, but the *theory* gets bogged down.
          *   *Okay, let's fix the Rule:* $y = x^2 \pmod{10}$. (1, 4, 9, 6, 5, 6, 9, 4, 1, 0...).
          *   *Why this works:* It looks linear at first (1, 4, 9...), then curves back. Teams who lock into "Linear Growth" will need massive epicycles to explain why 16 became 6.
      *   *Teams:* 4 teams of 4-5 students.
      *   *Core Card:* Physical index card. Signed by instructor. Handed in.
      *   *Rounds:* 8 Rounds of prediction.
      *   *Scoring:*
          *   Correct Prediction (before reveal): 10 pts.
          *   Post-hoc Explanation (consistent with Core + Belt): 2 pts.
          *   Defection: -15 pts (high cost to discourage hopping, but allowed).
          *   Winning: Most points.

  4.  **Develop the Scoring/Incentive Structure (Crucial for Degeneration):**
      *   To get a degenerating programme, a team needs to be *wrong* early but *committed*.
      *   If Team A guesses the rule instantly, game over. I need to prevent steamrolling.
      *   *Mitigation:* The rule must be opaque enough. $x^2 \pmod{10}$ is good. Or a sequence like: 2, 4, 8, 16, 32, 64, 128, 256... wait, that's too obvious.
      *   *Let's try:* "The sequence of the last digit of powers of 2." (2, 4, 8, 6, 2, 4, 8, 6).
      *   *Round 1:* 2.
      *   *Round 2:* 4.
      *   *Round 3:* 8.
      *   *Round 4:* 6. (Here the "Doubling" core breaks).
      *   *Team "Doubling" Core:* $x_{n} = x_{n-1} \times 2$.
      *   *Round 4 Prediction:* They predict 16. Actual is 6.
      *   *Belt Adjustment:* "Ah, we measure in Modulo 10." (Auxiliary hypothesis).
      *   *Round 5:* They predict 2 (12 mod 10). Actual is 2. Points!
      *   *This creates the "Degenerating" feel:* They are adding complexity to save the core.
      *   *Team "Pattern" Core:* "It repeats every 4." (Risky, novel prediction).
      *   *This creates the "Progressive" feel:* Simple core, predicts novel facts.

  5.  **Drafting the Timeline (90 mins):**
      *   0-10: Intro & Setup (Teams, Core Cards).
      *   10-15: Core Claim Lock-in.
      *   15-60: The Game (5 Rounds of Data/Prediction). ~8 mins per round.
      *   60-75: Scoring & Defection Phase.
      *   75-90: Debrief (Lakatos Vocabulary).

  6.  **Addressing the "Cheating/Steamrolling" Worries:**
      *   *Cheating:* Instructor must collect the Core Cards immediately. No touching them.
      *   *Steamrolling:* The rule needs a "trap." The "Doubling" trap is classic. Most students will assume linear/exponential growth. The modulo twist catches them.
      *   *Instructor Role:* I am "Nature." I must be neutral but firm. "Does your auxiliary hypothesis explain *this* datum?"

  7.  **Addressing the "Misleading" Aspects:**
      *   Real science doesn't have a single "True Rule" known by God/Nature.
      *   Real science isn't a zero-sum point game (grant money is close, but truth matters more).
      *   Defection is easier in the game than in real careers.

  8.  **Refining the Mechanics (Self-Correction):**
      *   *Issue:* 8 minutes per round is too long for a number reveal.
      *   *Fix:* Make rounds faster. 5 minutes per round. 6 Rounds total.
      *   *Issue:* How to handle "Defection"?
      *   *Fix:* Open market period after Round 4.
      *   *Issue:* Ensuring one team degenerates.
      *   *Fix:* I need to subtly encourage the "Doubling" team to stay. "Are you sure you want to abandon that? It worked for 3 rounds." (Playful taunting).
      *   *Scoring:* Make post-hoc points low enough that they don't win, but high enough to keep them playing. Prediction points must be the only way to *win*.

  9.  **Finalizing the Lesson Plan Structure:**
      *   **Title:** The Lakatos Lab.
      *   **Materials:** Index cards, projector, scoring sheet.
      *   **The Hidden Rule:** Last digit of $2^n$ (Sequence: 2, 4, 8, 6, 2, 4...).
      *   **Step-by-Step:** Setup -> Core Lock -> Rounds -> Defection -> Debrief.
      *   **Troubleshooting:** Specific scripts for cheating/steamrolling.
      *   **Debrief:** Mapping game actions to Lakatosian terms.
      *   **Caveats:** Where the analogy fails.

  10. **Review against Constraints:**
      *   18 students? Yes (4 teams of 4-5).
      *   90 mins? Yes.
      *   No vocab first? Yes.
      *   Core card immutable? Yes.
      *   Points for prediction? Yes.
      *   Defection penalty? Yes.
      *   Degeneration/Progression outcome? Yes (via the Modulo trap).
      *   Troubleshooting included? Yes.
      *   Misleading aspects flagged? Yes.

  11. **Final Polish:** Ensure tone is practical for a professor. Add specific scripts for the instructor. (Self-correction: Make sure the "Defection" rule doesn't cause chaos. Limit it to one window).

  *(Self-Correction on the Rule)*: $2^n$ last digit is good, but $n=1$ is 2, $n=2$ is 4, $n=3$ is 8, $n=4$ is 16 (6).
  If a team writes "Core: Powers of 2", they are technically right, but if they write "Core: Exponential Growth" they might predict 16.
  Let's make the input *their* choice? No, that's too complex.
  Let's make the input sequential $n=1, 2, 3...$
  Sequence: 2, 4, 8, 6, 2, 4.
  Core Claim A: "The value doubles each time." (Fails at round 4).
  Core Claim B: "The value follows a cyclic pattern." (Vague, but survives).
  Core Claim C: "The value is determined by $2^n \pmod{10}$." (Risky, specific, wins big).
  This works perfectly for Lakatos. Claim A needs a belt ("Measurement error", "Modulo constraint"). Claim C is progressive.

