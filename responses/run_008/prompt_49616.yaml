answer: |-
  This is a profound ethical knot, and it is excellent that you are sensing the friction between "kindness" and "truth." You are effectively asking whether the moral rules of personhood change when the mind fractures.

  Here is a reconstruction of the philosophical machinery at work in that care home, broken down by theory, consistency, and alternatives. I have flagged my confidence levels throughout, as requested.

  ### 1. Reconstructing the Implicit Theory: Benevolent Experientialism

  The care home's practice rests primarily on a **modified Hedonism**, but it is not the crude "pleasure is good" hedonism of Epicurus. It is better described as **Suffering-Avoidance Paternalism**.

  The staff are operating on the premise that the mother's *current* capacity for suffering outweighs her *past* capacity for autonomy. In a healthy adult, we assume that knowing the truth is a prerequisite for well-being, even if the truth hurts. In mid-stage Alzheimer's, the home presupposes that the cognitive machinery required to process "truth" as a value has degraded. Therefore, the only metric of well-being left that is accessible to her is her immediate phenomenological state (calm, smiling, agitated, weeping).

  **[Confidence: High]**
  I am highly confident this is the operational logic. It is the standard of care in most geriatric facilities. The metric of success is behavioral (reduction of agitation), not ontological (alignment with reality).

  However, calling it pure hedonism is slightly reductive. It also relies on a specific view of **Time-Slice Personhood**. The home treats the mother as she exists *in this moment*, rather than as a continuous narrative stretching from her past to her future. They are prioritizing the well-being of the "current self" over the values of the "past self."

  **[Confidence: Medium-High]**
  I am fairly sure this is the underlying metaphysical assumption, though the staff likely wouldn't articulate it this way. They simply react to the person in front of them.

  ### 2. The Desire-Satisfaction Angle

  You asked if this could be justified on desire-satisfaction grounds. Yes, but it requires splitting desires into **Local** vs. **Global**.

  *   **Local Desires:** "I want my husband." "I want to hold my baby." The fibs satisfy these immediately.
  *   **Global Desires:** "I want to live a life of truth." "I want my family to be honest with me." These are the desires the healthy mother held four years ago.

  The care home's practice is licensed by a theory of **Current Desire Satisfaction**. It assumes that because the mother can no longer cognitively grasp or hold her Global Desires (she literally forgets she wanted honesty), those desires no longer count. Only the desires she can currently articulate or feel count.

  **[Confidence: Medium]**
  This is where it gets shaky. Philosophers like Ronald Dworkin argue that "precedent autonomy" (her past wishes) should still rule. Others argue that once the psychological connection is broken, the past self is dead, and only the current self's desires matter. The care home is betting on the latter, but there is no philosophical consensus on this.

  ### 3. Where the Justification is Underdetermined

  You asked where the ground is solid and where it isn't. The practice is **underdetermined** because three different theories of well-being all lead to the same conclusion here, which makes the practice feel robust even if the foundations are conflicting.

  1.  **Hedonism:** She feels better. (Justifies the lie).
  2.  **Current Desire Satisfaction:** She wants her husband. (Justifies the lie).
  3.  **Objective List (Modified):** If "dignity" and "peace" are on the list of objective goods, and "truth" is removed due to incapacity, the lie is justified.

  **[Confidence: High]**
  It is clear that these theories converge here. This convergence is why the staff feel no conflict; the ethical signals are all green.

  **Where it is NOT underdetermined (The Friction Point):**
  The practice fails if you apply a strict **Objective List Theory** that includes "Truth" or "Authenticity" as non-negotiable goods, regardless of capacity. If being in contact with reality is an intrinsic good (like health or friendship), then the home is actively harming her well-being by lying, even if she smiles. The smile becomes a symptom of the harm, like a drug-induced stupor.

  **[Confidence: Medium-High]**
  I am confident this is the specific philosophical objection Nozick would raise. The inconsistency lies in whether "Truth" is an instrumental good (good because it helps us navigate life) or an intrinsic good (good in itself). For the mother, truth has lost its instrumental value (she can't navigate anyway). The home assumes it has lost its intrinsic value too. That is a contestable leap.

  ### 4. The Consistency Challenge: Dementia vs. Healthy Adults

  You asked if there is a real inconsistency in doing this for a dementia patient but not a healthy fifty-year-old, and if that difference is defensible.

  **The Inconsistency:**
  Structurally, it is identical to Nozick's Experience Machine. We are manipulating inputs to create a false sense of output satisfaction. If we wouldn't drug a healthy woman to make her think her husband is alive, why do we lie to a demented woman?

  **The Defensible Difference:**
  The distinction tracks **Agency** and **Narrative Coherence**.
  A healthy fifty-year-old has a "critical interest" in the truth. She uses truth to make plans, build relationships, and maintain her integrity. Lying to her undermines her agency.
  The mother with Alzheimer's has lost the capacity for *future-oriented agency*. She cannot use the truth to build a future. Therefore, the harm usually associated with lying (undermining autonomy) is no longer possible. You cannot undermine the autonomy of someone who has lost the capacity for autonomous action.

  **[Confidence: Medium]**
  I am moderately confident this is the standard bioethical defense. However, it relies on a definition of personhood that equates moral status with cognitive capacity. This is dangerous ground. If we say "you lose your right to truth when you lose your memory," we risk dehumanizing the patient.

  **[Confidence: Low]**
  I am less sure about the moral safety of this distinction. It is defensible logically, but it feels emotionally precarious. It implies the mother is no longer a full "person" in the Kantian sense (an end in herself), but rather a vessel of sensations to be managed.

  ### 5. Alternative Theories: What Would Change?

  If the home switched frameworks, the practice would shift significantly.

  **A. Full Desire-Satisfaction View (Respecting Precedent Autonomy)**
  *   **The Change:** They would have to consult her advance directives or past statements. If she ever said, "Don't lie to me," they must tell her the truth, even if she cries every time.
  *   **The Consequence:** Her well-being is defined by the satisfaction of her *life-long* values, not her *current* moods. She might be sadder, but she would be more "herself."
  *   **The Doll:** The doll would likely be removed unless she had previously expressed a wish for comfort objects.
  *   **[Confidence: High]** This is a straightforward application of Dworkin's theory of precedent autonomy.

  **B. Strict Objective List View**
  *   **The Change:** "Truth" and "Authenticity" are on the list. They cannot lie.
  *   **The Nuance:** They wouldn't necessarily be brutal. They wouldn't say "He's dead." They might say, "He's not here right now," or "You miss him." This is **Validation Therapy** rather than Therapeutic Fibbing. It acknowledges the emotion without fabricating the fact.
  *   **The Doll:** The doll is trickier. If "Play" or "Nurturing" is on the objective list, the doll stays. But if "Reality Orientation" is higher on the list, the doll goes.
  *   **[Confidence: Medium]** I am less sure how an Objective List theorist would weigh "Comfort" vs. "Truth" in a non-competitive scenario. They might argue that a lie destroys the possibility of authentic connection, even if the patient doesn't know it's a lie.

  ### 6. The Least Certain Point

  You asked me to single out the point where the philosophical ground is shakiest.

  **The Point:** **The Metaphysics of Personal Identity.**

  **[Confidence: Low]**
  Everything above rests on an assumption I have not fully challenged: *Is the woman in the care home the same person as the woman who married the husband?*

  If you follow Derek Parfit's reductionist view, the psychological connectedness between the healthy mother and the demented mother is so weak that they are effectively different people. If they are different people, the "past mother's" desire for truth dies with her cognitive decline, and the "current mother's" desire for comfort is all that matters. The fibs are perfectly ethical.

  However, if you hold a view that personhood is based on biological continuity or a soul, they are the *same* person. If they are the same person, the care home is violating the rights of the *original* woman by gaslighting her.

  **Why I am unsure:** Philosophy has no settled answer on this. Neuroscience suggests the "self" is fragmented; ethics suggests the "self" is inviolable. Your novel lives in this gap. The staff act as if the old mother is gone (Confidence in *their* belief: High). The daughter likely feels the old mother is still there, trapped (Confidence in *her* feeling: High). **Who is right is the question I cannot answer, and neither can the philosophers.**

  For your book, this uncertainty is gold. The staff aren't necessarily villains; they are operating on a theory of personhood that says "The mother you knew is gone; we are caring for who remains." The daughter is operating on a theory that says "She is still in there, and you are insulting her." Both have philosophical warrant. That is where your conflict lies.
