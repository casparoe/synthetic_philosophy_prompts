answer: |-
  Your hypothesis is largely correct: the stalemate is not mathematical, but the diagnosis requires distinguishing between the *structure* of the argument and the *source* of the intractability. The dispute is best understood as a clash of **different-questions** masked by a **verbal** ambiguity, rooted in incompatible **bedrock-intuitions** about modality and uncertainty.

  ### 1. The Structural Divergence: Different Questions
  The primary reason formalism cannot settle the dispute is that the Deutsch–Wallace (DW) program and its critics are addressing fundamentally different inquiries, despite using the same terminology.

  *   **The Everettian Question (Pragmatic/Decision-Theoretic):** David Wallace and Simon Saunders explicitly frame the problem as one of *rationality*. They ask: "Given the Everettian physics, what constraints does rationality place on an agent's preferences?" The DW theorem answers this successfully *on its own terms*. It demonstrates that if an agent accepts certain axioms (e.g., Diachronic Consistency, Branching Indifference), they must maximize utility using Born weights. For Wallace, this is sufficient because he adopts a functionalist view of probability: probability *just is* the quantity that governs rational decision-making in the face of uncertainty.
  *   **The Critic's Question (Semantic/Ontological):** Adrian Kent, Huw Price, and others ask: "What makes a probabilistic statement *true* in a deterministic multiverse?" or "In what sense is the agent *uncertain*?" They argue that decision-theoretic advice does not establish truth conditions. Even if an agent *should* bet as if outcome A has probability 0.5, this does not explain what it *means* for A to have probability 0.5 when A and not-A both deterministically occur. For the critics, probability requires a notion of exclusive possibility or objective chance that branching does not provide.

  The stalemate arises because Everettians treat the derivation of rational action as a derivation of probability (reducing the latter to the former), while critics treat the lack of a truth-conditional account as a failure to derive probability at all.

  ### 2. The Verbal Mask
  This structural divergence is obscured by a verbal dispute over the word "probability."
  *   **Everettians** employ a **Ramsey-Lewis functionalist** definition. If a concept plays the "probability role" (guiding belief and action via the Born rule), it *is* probability. They argue critics are demanding a "ghostly" notion of chance that even single-world interpretations cannot satisfactorily define.
  *   **Critics** employ a **primitivist or propensity** definition. They hold that probability entails genuine uncertainty about which single future will obtain. Since Everettian agents know *all* futures will obtain, critics argue the term "probability" is being misapplied to what is actually a "measure of existence" or "caring weight."

  When Kent charges circularity, he is effectively saying: "Your axioms of rationality only look rational if you already smuggle in my definition of probability." When Wallace denies circularity, he is saying: "Your definition of probability is metaphysically inflated; my axioms are purely about consistency of preference." They are not disagreeing about the math; they are disagreeing about whether the functional role captures the essence of the concept.

  ### 3. The Bedrock Intuitions
  Underlying the verbal and structural mismatch are incompatible bedrock intuitions about **modality** and **uncertainty**.
  *   **Everettian Intuition:** Uncertainty is self-locating. An agent pre-branching can be uncertain about *which branch they will find themselves on*, even if all branches exist. This relies on an intuition that personal identity is not unique across branching.
  *   **Critic Intuition:** Uncertainty requires exclusive alternatives. If I know outcome A *will* happen (on some branch) and outcome B *will* happen (on another), I cannot be uncertain about whether A will happen. This relies on an intuition that "what will happen" refers to the totality of the future wavefunction, not a single branch.

  This explains why 25 years of formalism has failed: you cannot prove a theorem that forces someone to change their intuition about whether "everything happening" precludes "uncertainty." The DW axioms (like Branching Indifference) feel "natural" to those who share the Everettian intuition and "suspicious" to those who share the Critic's intuition.

  ### 4. Prospects for Progress
  Given this diagnosis, progress will not come from new theorems but from conceptual disambiguation.
  *   **What counts as progress:** A consensus to decouple the questions. Everettians might concede they are deriving a "rational caring measure" rather than "objective chance," while critics might concede that this measure is sufficient for empirical coherence (i.e., recovering the appearance of probability).
  *   **The "Sebens-Vaidman" Route:** Some progress has been attempted via "self-locating uncertainty" (agents are uncertain immediately after branching but before observation). This addresses the *bedrock intuition* about uncertainty but remains controversial regarding whether it truly restores the pre-branching notion of chance.
  *   **The Pessimistic View:** If the dispute is truly about bedrock intuitions, it may be **ill-posed** in the sense that there is no fact of the matter about which definition of "probability" is correct, only which is more useful. However, since the stakes involve the empirical viability of MWI, the parties are unlikely to treat it as merely verbal.

  The most honest account is that the DW program succeeds in answering the pragmatic question but fails to satisfy the ontological question, and the dispute persists because both sides insist their question is the only one that matters.

  \diagnosis{different-questions-bedrock-intuitions}
