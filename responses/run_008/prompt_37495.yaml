      *   **Dennett (Functionalist/Computational):** Consciousness (waking or dreaming) is a "fame in the brain" / multiple drafts model. Content isn't fixed until it's accessed/reported. Waking memory is also reconstructive. Therefore, dreams *are* experiences, just like waking experiences: both are post-hoc narratives generated by the system upon retrieval. The lack of a "live tape" doesn't negate the experience; it just reveals the architecture of consciousness.

  3.  **Translate to Observability Vocabulary:**

      *   *Malcolm:*
          *   No tracing context propagated during sleep (NREM/REM).
          *   Sampling rate = 0% during the event.
          *   The "Log Entry" (the dream report) is generated *after* the service restart (waking).
          *   Since there's no `span.start()` and `span.end()` timestamped during the process, asserting latency or throughput during that window is hallucination.
          *   The log line is not evidence of an event; it *is* the event.
          *   "If it wasn't sampled, it didn't happen."

      *   *Dennett:*
          *   Waking life *also* doesn't have 100% sampling.
          *   Human consciousness is an async buffer. We don't write logs synchronously at the instruction level.
          *   Waking memory is a reconstruction from partial buffers (sensory input) + heuristics.
          *   Dreaming is just running the "narrative generation service" with different input sources (internal state vs. external sensors).
