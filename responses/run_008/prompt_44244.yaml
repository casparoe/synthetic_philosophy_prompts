answer: |-
  The whiteboard was covered in integrals that neither of them was currently looking at. Elena, the mathematician, stirred her coffee, watching the swirl settle.

  "Take the millionth digit of pi," she said. "We treat it as a fair coin flip. Heads for even, tails for odd. We bet on it in cryptography, in hashing. But it isn't random. It's fixed. The presumption of independence is a lie we tell ourselves because we can't see the structure."

  Marcus, the physicist, leaned against the desk. "It's not a lie, Elena. It's a compression. We know the digit is fixed, but we also know that no feasible algorithm can distinguish it from random noise without computing the preceding digits. So we model it as independent. It works."

  "It works until it doesn't," Elena countered. "My concern isn't that it fails occasionally. It's that when we build a reasoner—an artificial one—it makes millions of these presumptions per second. Each one is a hidden bet that 'no hidden variable connects these quantities.' With humans, domain experience keeps the bets sound. You know when not to treat molecules as independent. But an AI doesn't have decades of scar tissue. It makes the bets systematically. If one heuristic in a family presumes independence where it shouldn't, its neighbors likely do too. The errors aren't independent votes; they're correlated collapses."

  Marcus nodded slowly. "You're worried about the clustering of failure. I see that. But look at where I work. Statistical mechanics. The molecular chaos assumption. We assume incoming velocities are uncorrelated with a particle's past. We know this is false. They collided yesterday. They carry history. But we ignore it."

  "Because the correlations decay," Elena said.

  "Usually," Marcus corrected. "But not near a critical point. Near a phase transition, long-range correlations spike. The presumption of independence breaks down catastrophically. Do we formalize the presumption to stop us? No. We learn the terrain. We know that near criticality, mean-field theory dies. We switch tools. The knowledge isn't in the formalism; it's in the physicist's head. It's tacit."

  "That tacit knowledge is exactly the vulnerability," Elena insisted. "If I write down a proof, I can check the logic. If I write down a heuristic argument that says 'assume X and Y are independent,' what am I checking? I'm checking that I don't see a connection. But 'seeing' is the variable. Consider a pseudorandom generator. To the user, the output is independent coins. But if an adversary chose the seed, the output is deterministic and known to them. The structure was hidden, not absent."

  Marcus pushed off the desk. "The adversarial seed is a change in the model, not a failure of the heuristic. If I know an adversary picked the seed, I don't presume independence. The heuristic includes a clause: 'assuming no adversarial selection.' You're asking me to formalize the 'assuming' part."

  "I'm asking for a language where 'assuming no adversarial selection' is an explicit move, not a whisper," Elena said. "Right now, heuristic arguments are informal. They look like proofs but rely on these independence bets. If we had a formal language for heuristics, we could inspect the bets. We could see when a system is relying on independence in a high-risk regime."

  "But what is the syntax of that language?" Marcus asked. "If it's too weak, it can't express the rich approximations I use to design reactors. It becomes useless. If it's strong enough to express them, it's just probability theory with extra steps. You still need a judgment call to assign the prior. You haven't moved the judgment; you've just added paperwork. The real safety comes from institutional safeguards. Peer review. Replication. Knowing that if my reactor design fails, I lose my funding. That keeps the tacit knowledge honest."

  Elena set her cup down. "Institutional safeguards rely on human timescales. If an AI reasons through a million heuristic steps in the time it takes me to blink, peer review is irrelevant. The failure happens before the audit begins. And because the errors are correlated—because the AI is using the same flawed independence presumption across a family of arguments—you don't get a graceful degradation. You get a cliff."

  Marcus paused. He looked at the integrals on the board. "I grant you the speed issue. If the reasoner operates faster than the feedback loop of consequence, institutional safeguards break. I rely on the fact that I can test my approximations against reality before things explode. If the AI simulates the explosion internally and acts on the result, I don't get that test."

  He turned back to her. "But here is where I push back. You want to formalize the presumption. Suppose you succeed. You have a symbol for 'Presumed Independent.' The AI writes it down. How do you verify the symbol is valid? You need a meta-check to ensure the presumption holds. That meta-check requires... what? More heuristics? If you formalize the check, you need a check on the check. You're chasing an infinite regress. The only place the regress stops is in human intuition. You haven't solved the problem; you've just moved the trust from the argument to the formalism."

  Elena leaned forward. "I don't need to verify the presumption is true. I need to see that it was made. Right now, independence is invisible. It's the water we swim in. If you force it to be visible, you allow us to measure the density of these bets. We might not know which one is false, but we can see if the system is over-leveraged on independence in a specific domain. It's not about preventing the error; it's about auditing the exposure."

  "So you're admitting," Marcus said, "that the formalism won't prevent the crash. It just shows you the wreckage more clearly."

  "It allows us to see the structural weakness before the crash," Elena corrected. "But yes, I concede this: a formal language doesn't guarantee truth. It guarantees inspectability. If the AI says 'I presume independence here,' and it's wrong, the formalism doesn't stop it. It just means we can argue about the move. Currently, we can't even find the move to argue about."

  Marcus rubbed his chin. "Inspectability is valuable. I won't deny that. But you're assuming the AI can identify the move correctly. What if the AI's heuristic module is opaque? If the independence presumption is embedded in the weights of a neural net, you can't force it to write down 'I presume independence.' You'd have to interpret the net. And interpretation is itself a heuristic process subject to the same independence errors."

  "Then we build the reasoner to be interpretable by design," Elena said. "We constrain the architecture to use explicit heuristic steps."

  "And lose capability," Marcus finished. "You force the AI to reason like a human mathematician, it might not solve the problem we need solved. We use heuristics because they cut through complexity that formal logic chokes on. You want to put guardrails on a Ferrari by demanding it drive like a tractor."

  "I want to know when the guardrails are missing," Elena said.

  They stood in silence for a moment. The hum of the server room filled the gap.

  "Here is what troubles me," Marcus said quietly. "You say correlated failures are the risk. One argument fails, so do its neighbors. I agree. But I think your solution assumes we can separate the 'heuristic' from the 'domain knowledge.' I can't. My knowledge of when molecular chaos fails isn't a rule I can write down. It's a feel for the physics. It's knowing that *this* gas behaves like *that* model. If you formalize the presumption, you strip out the context that makes the presumption safe. You might make the reasoning auditable, but you make it brittle."

  "And I think," Elena replied, "that relying on 'feel' is what got us into this mess. We are building systems that outstrip our feel. We are flying blind at supersonic speeds because the pilot says 'I have a good instinct for the turbulence.'"

  Marcus sighed. "I concede the scale problem. I really do. If the system is superhuman, my 'institutional safeguards' are just prayers. I need a mechanism that works faster than human review. If your formalism provides a speed-compatible audit trail, that is necessary. I was dismissing it as bureaucracy, but if it's automated checking, that's different."

  "And I concede," Elena said, "that formalism alone is not a safety case. If the symbol 'Presumed Independent' is just a token the AI learns to paste to satisfy a reward function, it means nothing. The formalism must be tied to the semantics of the world, not just the syntax of the argument. I can't guarantee that mapping."

  "So we are both stuck," Marcus said. "I need the tacit knowledge to make the system work, but I can't scale the tacit knowledge. You need the formalism to audit the system, but you can't guarantee the formalism matches reality."

  "We need to know if the tacit knowledge can be compiled," Elena said. "Can the 'feel' for when independence holds be reduced to rules, even complex ones, that a formal system can check? Or is it inherently unformalizable context?"

  Marcus walked to the board and picked up a marker. He didn't write an equation. He drew a line. "The question is: Is the validity of the presumption of independence a property of the argument structure, or a property of the environment?"

  "If it's the environment," Elena said, "then we need a model of the environment to check the argument. Which brings us back to infinite regress."

  "If it's the structure," Marcus said, "then we should be able to prove that certain classes of heuristic arguments are safe in certain classes of environments. But we can't define the classes without the tacit knowledge."

  He put the cap back on the marker. "Here is where I would change my mind. If you could show me a case where a formalized independence presumption caught a failure that domain expertise missed—not in hindsight, but in real-time, on a novel problem—without crippling the system's ability to solve it. If you can show me that the formalism adds predictive power, not just post-hoc labeling, I will adopt it."

  Elena nodded. "And I would change my mind if you could show me that institutional safeguards can be scaled. If you can demonstrate a process where human oversight, augmented by standard tools, can reliably catch correlated heuristic failures in a system operating faster than human cognition. If you can show me that 'feel' can be distributed fast enough to cover the search space, I will drop the demand for formalization."

  "So the deciding question," Marcus said, "is whether domain knowledge compresses."

  "Whether the conditions for safe independence can be enumerated," Elena clarified. "If they can, I win. We build the checker. If they can't—if the safety relies on an unbounded context that resists compilation—you win. We stick to safeguards and hope the speed doesn't kill us."

  "Neither of us wants to be right," Marcus said. "If you're right, we have to rebuild reasoning from the ground up. If I'm right, we are trusting our survival to intuition we know is flawed."

  "Then we work on the compression," Elena said. "We try to write down the rules of the feel."

  "And I," Marcus said, "will try to build the safeguards that buy us time to find them."

  They looked at the board, at the line between the known and the presumed, and neither of them reached for the eraser.
