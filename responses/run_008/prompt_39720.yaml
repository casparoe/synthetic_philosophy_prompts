answer: |-
  An advance directive binds only when the present self lacks decisional competence and the instruction reflects settled values consistent with the agent's broader life narrative, whereas a competent present self always retains the authority to override past instructions.

  This principle resolves your list by applying two filters: competence and narrative consistency. The climbing buddy case is settled immediately by the competence filter; because his present self is capable of planning and expressing gladness, his current autonomy voids the past instruction. The Jehovah's Witness and schizoaffective cases also pass through the competence filter but land on the opposite side; because the present selves are semi-conscious or floridly psychotic, they lack the capacity to override, so the prior instructions stand. The distinction between your grandmother and the colostomy woman, which stalled your debate, is resolved by the narrative consistency filter. Both present selves are incompetent, but your grandmother's directive aligned with a lifelong valuation of relational identity, making it a settled critical interest, whereas the colostomy directive was a transient fear contradicted by thirty-eight years of lived resilience, rendering it inconsistent with her settled narrative. The dinner-table statements case is saved because twenty years of repetition constitutes evidence of settled values equivalent to a signed form, even if the evidentiary weight feels subjectively weaker.

  This principle saves all six of your verdicts. It captures the intuition that competence is the primary switch for autonomy, while also accounting for why some prior directives (the 22-year-old's fear) are morally inert despite being signed, and others (the grandmother's identity threshold) are binding despite the present self's contentment. The only nuance it doesn't fully capture is the epistemic anxiety you felt regarding the verbal statements; the principle validates the verdict as morally right, though it acknowledges that unsigned evidence naturally carries less certainty than a formal document.

  For your new cases, the principle predicts the following: First, a still-competent person can revoke the commitment contract they wrote for their psychotic episodes. Because the principle holds that a competent present self always overrides past instructions, the current clear-headed agent retains the authority to cancel the Ulysses contract, even if doing so risks future harm. Second, the dinner-table statements would not survive being reduced to one remark. A single comment lacks the temporal endurance required to establish "settled values consistent with the broader life narrative," making it insufficient to override the default presumption in favor of life-sustaining treatment for an incompetent patient.
