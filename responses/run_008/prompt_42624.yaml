      *   *Key Insight:* Iceland's "Defection" was actually "Cooperation with the Fish." This flips the PD labels. If "Cooperate" = Sustainable Fishing, then Iceland was trying to force Cooperation, while UK was Defecting (Overfishing). This reframes the moral/strategic landscape.

  5.  **Final Polish:** Check tone. Ensure it sounds like a peer discussion (respectful but critical). Ensure all parts of the prompt are answered (Players/Moves, Game Type, Evolution of Cooperation, Asymmetry).

      *(Self-Correction on the "Cooperation" definition)*: In Axelrod's terms, cooperation is sticking to the agreed norm. In 1958, the norm was 4 miles. Iceland broke that. So technically Iceland defected first. But morally/ecologically, they were trying to establish a *better* norm. I need to highlight this tension between "status quo cooperation" and "norm entrepreneurship."

