      *   **Core Task:** Stress-test the IPD model against this historical case. Identify players, moves, payoffs, time horizons, and where the mapping breaks.
      *   **Specific Questions to Address:**
          *   Is it a Prisoner's Dilemma (PD), Chicken, Common-Pool Resource (CPR) game, or a hybrid?
          *   What does this say about the "evolution of cooperation" narrative (iterated interaction vs. external enforcement)?
          *   How does asymmetry (tiny Iceland vs. Great Power UK) affect the analysis? Does standard IPD assume symmetry?
      *   **Tone:** Analytical, honest about limitations, not forcing a square peg into a round hole.

  2.  **Initial Assessment & Fact-Checking (Mental Sandbox):**
      *   *The Cod Wars:* Three main conflicts (1958-61, 1972-73, 1975-76). Iceland expanded zones (4 -> 12 -> 50 -> 200 miles). UK resisted. Tactics: Net cutting vs. Navy escort. Outcome: Iceland won, 200-mile EEZ became international norm (UNCLOS III).
      *   *Axelrod's IPD:* Two players, Cooperate/Defect, T > R > P > S, repeated interaction allows reciprocity (Tit-for-Tat).
      *   *Fit:* It's messy. It's not just two fishermen. It involves governments, NATO, US, fish stocks.
      *   *Asymmetry:* Iceland = Existential threat. UK = Economic nuisance + Sovereignty principle.
      *   *Enforcement:* US/NATO pressure was crucial in the end.

  3.  **Drafting the Analysis - Section by Section:**

      *   **Section 1: Mapping the Game (The "Square Peg" Attempt)**
          *   *Players:* Not just UK vs. Iceland. It's UK Govt vs. Iceland Govt. (Fishermen are pieces).
          *   *Moves:* Cooperate = Respect zone/Don't cut nets. Defect = Fish in zone/Cut nets.
          *   *Payoffs:*
              *   UK: Fish + Sovereignty precedent vs. NATO cohesion + Cost of ships.
              *   Iceland: Fish survival (Existential) vs. Security guarantee (NATO).
          *   *Shadow of the Future:* Did it get longer? Yes, but it changed *who* was playing.
          *   *The Break:* It's not symmetric. P and S aren't the same for both. For Iceland, Defect-Defect is national death. For UK, it's annoyance.

      *   **Section 2: What Game Is This Really?**
          *   *PD?* Mutual defection (War) is bad for both, but Iceland *wanted* to change the status quo. In PD, you usually want to maintain cooperation. Here, Iceland wanted to *establish* a new rule.
          *   *Chicken?* Who blinks first? UK had bigger cars (Navy), but Iceland was willing to drive off the cliff (close Keflavik). This fits better.
          *   *Common-Pool Resource (CPR)?* Yes, the cod are the resource. But the conflict isn't just "us vs. fish," it's "us vs. them over who gets the fish."
          *   *Verdict:* It's an **Asymmetric Game of Chicken embedded in a CPR problem.** The PD framework fails because the incentive structure isn't T>R>P>S in a standard way. Iceland's "Defection" (expanding zone) was actually an attempt to *enforce* cooperation on the resource (sustainable fishing).

      *   **Section 3: The Evolution of Cooperation Question**
          *   *Axelrod's Claim:* Cooperation emerges from reciprocity in long shadows.
          *   *Cod Wars Reality:* Cooperation (the 200-mile rule) didn't emerge from UK-Iceland reciprocity. It emerged because Iceland changed the game structure (threatened NATO) and the US intervened.
          *   *Implication:* The "folk theorem" (any outcome can be sustained with enough patience) is less relevant than the "power theorem" (who can change the payoff matrix?).
          *   *Nuance:* The *global* regime (UNCLOS) did evolve, but through diplomacy and precedent, not just bilateral iteration. Iceland set a precedent others followed. So cooperation evolved *systemically*, not bilaterally.

      *   **Section 4: The Asymmetry Problem (The Core Theoretical Critique)**
          *   *Standard IPD:* Assumes symmetric payoffs. R, P, S, T are roughly comparable.
          *   *Cod Wars:* Existential vs. Marginal.
          *   *Effect:* Iceland could credibly threaten "Mutual Defection" (NATO collapse) because their P was worse than the UK's P. The UK cared more about the Alliance than the Cod. Iceland cared more about Cod than the Alliance (paradoxically, because they knew the US needed the base more than they needed the base).
          *   *Theory Gap:* Axelrod's TFT doesn't handle "I care 100x more than you" well. It assumes rational actors weighing future gains. When one actor is fighting for survival, they play differently (risk-acceptant).

      *   **Section 5: Synthesis/Conclusion**
          *   Don't discard Axelrod, but bound him.
          *   Iteration matters, but *leverage* matters more in asymmetric disputes.
          *   The "Shadow of the Future" wasn't UK-Iceland; it was Iceland-US-NATO.
          *   Final verdict: The Cod Wars show that cooperation often requires a *hegemon* or an *external enforcer* to shift payoffs, rather than just bilateral reciprocity.

  4.  **Refining the Argument (Self-Correction during drafting):**
