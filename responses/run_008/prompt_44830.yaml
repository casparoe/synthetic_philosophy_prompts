  6.  **Final Polish:** Ensure the distinction between "rights as outcomes" vs "rights as constraints" is clear, as this is the standard counter-argument to the user's reading (Nozick). Ensure the point about Universal Domain is clear (the problem is meddlesome preferences, not rights). Ensure the asymmetry regarding Pareto is highlighted (why dump rights and keep Pareto?).

