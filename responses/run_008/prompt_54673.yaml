  I'm in a philosophy of logic elective this semester and we just finished the unit on future contingents — Aristotle's sea battle, bivalence, all that. Our professor gives verdicts on example sentences and we've started a running game in section where we have to predict her rulings on new cases, and I have to submit mine next week, so I've been keeping a list of her calls so far. Here's the track record: a plain future contingent like "there will be a sea battle tomorrow," said today, when tomorrow's outcome genuinely depends on a decision nobody has made yet, is neither true nor false — she says Aristotle was right to deny bivalance for exactly these and not for statements generally. She's firm that "either there will be a sea battle tomorrow or there will not" is already true today, and that "there will be a sea battle tomorrow and there won't be one" is flat-out false. But when someone asked about "either there will be a sea battle tomorrow or there will be a naval parade tomorrow," with both disjuncts up in the air, she said that one's in the same boat as its disjuncts — my notes say "no truth value," though honestly she said "settled" about a hundred times that class and I can't tell how literal she's being. "Either there will be a sea battle tomorrow or the sun will rise tomorrow" came out true, since one disjunct is settled. Everything past-tense and present-tense is true or false, full stop, even statements about events that used to be open, and she's perfectly happy saying it's true right now that it's unsettled whether there will be a battle.

  The new cases I have to call: first, a hypothetical oracle who has never been wrong and, stipulatively, cannot be wrong announces "there will be a sea battle tomorrow" — is her announcement true? Second, a guy in my section insists that one of the currently open futures is the real one, the one that will actually happen, we just can't tell which — true, false, or neither? Third, the one really bugging me: was it true, last Tuesday, that there would be a sea battle today, in the scenario where the battle did in fact happen today? My worry is that her whole track record seems consistent both with the reading where future contingents literally lack truth values (gaps, supertruth over possible futures, whatever the machinery is) and with the reading where they have truth values all along and "neither true nor false" just means "not settled and not knowable now" — the TA muttered something about Ockhamism and branching time, and that sounds like a real position too.

  So here's what I want from you: predict her verdicts on the three new cases, spell out the candidate rules that fit her track record and exactly where they come apart on these cases (does anything in her record actually force one reading over the other, like the mixed disjunction stuff?), tell me which rule you'd bet on and why, and give me the single question or case I could put to her that would settle which rule she's actually running. Please write it as continuous prose only, no bullet points, headings, or bold, like a long email from a friend who knows this literature.
