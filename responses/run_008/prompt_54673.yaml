answer: |-
  Hey, it sounds like you are deep in the weeds with this one, and honestly, your professor's track record is fascinating because it walks right up to the line between the two main camps in this literature without fully stepping over into the technical jargon that would give it away immediately. I have been thinking about your list of her rulings while grabbing coffee, and I think I can help you triangulate where she stands so you can nail these predictions. The key to cracking this code is hidden in that one ruling about the naval parade, because that is the specific case where the two major theories you are worried about, Aristotelian supervaluationism and Ockhamism, actually give different answers. Everything else she has said so far is compatible with both views, which is why you are feeling stuck, but that disjunction case is the smoking gun.

  Here is how I see the logic playing out based on her calls. She is almost certainly operating on a supervaluationist or strict Aristotelian framework where truth is defined as settledness across all possible futures, rather than the Ockhamist view where truth is relative to a single actual future history that we just happen not to know yet. When she says a plain future contingent is neither true nor false, she means it lacks a truth value because it is not true on all branches and not false on all branches. When she says the excluded middle is true, that works for both views because on every branch either the battle happens or it doesn't. But look at what she did with the sea battle or naval parade disjunction. If she were an Ockhamist, she would have to say that disjunction is true or false right now because there is one real future where either the battle happens, the parade happens, both happen, or neither happens. Even if we don't know which, the statement has a truth value. By saying that one has no truth value, she is signaling that there is no single real future selecting one of those options yet. Therefore, for your first new case about the infallible oracle, I predict she will say the announcement is true. This is because the stipulation that the oracle cannot be wrong makes the event settled or necessary, so it becomes true on all branches, satisfying her condition for truth.

  For the second case about the student insisting one open future is the real one, I predict she will mark that as false. This follows directly from the parade disjunction logic. If one of the open futures were already the real one, then the disjunction of two contingents would have a truth value based on that real future, but she already ruled that it does not. She likely holds that the future is ontologically open, not just epistemically hidden, so claiming there is already a real one contradicts her metaphysics. The third case is the trickiest and the one where you need to be most careful. You asked whether it was true last Tuesday that there would be a battle today, given that it did happen. If she is a strict Aristotelian or supervaluationist, truth does not retroactively apply. Just because it is settled now doesn't mean it was settled then. So I predict she will say it was neither true nor false last Tuesday, even though it is true today that the battle is happening. An Ockhamist would say it was true last Tuesday relative to the actual history, but given her denial of bivalence for contingents, she should deny that the past prediction had a truth value at the time it was uttered.

  Now, to explain why I am betting on this reading over the Ockhamist one you are worried about. The Ockhamist view typically preserves bivalence by saying every statement is true or false relative to a moment and a history, and when we say neither true nor false we just mean we don't know which history is actual. But your professor was very specific that Aristotle was right to deny bivalence for these statements generally, not just that we don't know the value. More importantly, the naval parade case forces her hand. In Ockhamism, logical connectives usually work classically relative to a history, so a disjunction of two contingents is true if at least one disjunct is true in the actual future. By calling it truth-valueless, she is treating truth as supertruth, which requires validity across all possibilities. This means the only way a future statement is true is if it is inevitable. This rules out the idea that they have truth values all along that are just unknowable. The TA's mention of Ockhamism might have been a red herring or just context for what the view is not, because her rulings on disjunctions are inconsistent with standard Ockhamist branching time semantics unless she is adopting a very specific hybrid view that is less common in introductory electives.

  If you want to settle this once and for all without waiting for the grades, there is a single question you could put to her during office hours that would confirm which rule she is running. You should ask her whether a statement about a future contingent that turned out to happen was true at the time it was made before the outcome was settled. Specifically, you could ask if it is correct to say now that the prediction made last Tuesday was true back then, or if it only became true when the event happened. If she says it was true back then, she is an Ockhamist despite the parade ruling, which would be weird. If she says it was not true back then but is true now that it happened, she is a supervaluationist. Actually, the sharpest way to ask this is to ask about the principle of retrogradation of truth. You could ask her if the truth value of a future contingent changes once the event becomes past. If she says the truth value changes from indeterminate to true, you have your answer that she believes in truth-value gaps that get filled by time. If she says the truth value was always true and we just didn't know it, then the TA was right and the parade ruling was about epistemic settledness. But given her emphasis on Aristotle denying bivalence, I would bet my tuition money that she says the truth value changes, meaning the past prediction was not true at the time.

  So to summarize my advice for your submission, go with the view that truth requires settledness across all branches. Call the oracle statement true because it makes the event settled. Call the student's claim false because it assumes a determined future where she sees openness. Call the past prediction neither true nor false at the time it was made because it wasn't settled then, even if it is settled now. This aligns with her past rulings on the naval parade and her explicit endorsement of Aristotle's denial of bivalence. It is a consistent system known as supervaluationism, and it fits every data point you have given me, especially that crucial disjunction case that rules out the Ockhamist alternative. Just make sure you write it up clearly and mention that you are interpreting her use of settled as synonymous with true in the context of future contingents, which seems to be how she is using the term based on your notes. Good luck with the submission, and let me know if she throws you another curveball next week.
