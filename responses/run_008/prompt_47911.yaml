  # JOINT STATEMENT ON THE STRUCTURE OF EPISTEMIC JUSTIFICATION

  **Preamble**
  We, the undersigned, acknowledge a longstanding disagreement regarding the structure of epistemic justification. One of us maintains a foundationalist position of broadly empiricist temper; the other maintains a coherentist position. Recognizing that our decade-long debate has reached a stalemate due to entrenched formulations rather than resolved arguments, we commit to this adversarial collaboration. The following document outlines our common ground, specifies our disagreements with precision, identifies verbal ambiguities, and acknowledges the position we both currently reject.

  ### I. Agreed Claims

  We jointly affirm the following propositions as the common ground upon which our dispute rests:

  1.  **The Genuine Regress:** The regress problem is genuine and is not dissolved by observing that people in fact stop giving reasons; the psychological cessation of inquiry does not constitute its logical resolution.
  2.  **Structure vs. Psychology:** The dispute concerns the structure of epistemic justification rather than the psychology of actual reasoners; we are debating how beliefs *ought* to be supported, not how they *are* supported in practice.
  3.  **Principled Stopping:** Any legitimate stopping point in the chain of justification must be principled rather than an arbitrary refusal to continue; dogmatism is not a solution to the regress.
  4.  **Truth-Connection:** Whatever justification turns out to be, it must be answerable to truth in a way both parties can articulate; a justified belief must stand in a relation to the truth that is not merely accidental.
  5.  **Normativity:** Epistemic justification is inherently normative; it specifies what one is entitled to hold given one's epistemic situation, distinguishing proper belief from mere conviction.

  ### II. Disagreements Table

  The following table isolates the specific points of divergence. We agree that settling the "Crux" in any row would significantly alter the dialectical landscape.

  | Neutral Topic | Foundationalist Formulation | Coherentist Formulation | Crux | Agreed Test or Consideration | Foundationalist Prediction | Coherentist Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Non-Doxastic Justification** | Experiences or seemings that are not themselves beliefs can confer justification on beliefs directly. | All epistemic support must run between beliefs; apparent non-doxastic justification tacitly infers from appearances while calling the inference a given. | Can a non-belief state stand in a reason-giving relation to a belief? | A subject forms a belief based on a sensory seeming without possessing a prior belief about the reliability of that seeming. | The belief is justified immediately by the seeming. | The belief is unjustified unless embedded in a web containing beliefs about the seeming's reliability. |
  | **2. The Isolation Objection** | A coherentist cannot say anything against someone whose entire outlook is internally tidy but sealed off from the world. | A coherentist can reject such a system because it fails to cohere with the broader explanatory web required for truth-conduciveness. | Is internal consistency sufficient for justification, or is input required? | A person whose elaborate system of divination hangs together beautifully and never touches independent check. | The diviner is unjustified because the system lacks input from the world. | The diviner is unjustified because the system is less coherent than one incorporating perceptual beliefs. |
  | **3. Generating vs. Transmitting Warrant** | Basic beliefs do positive justificatory work; they generate warrant for the rest of the system. | Basic beliefs merely transmit warrant; calling a belief self-evident explains the stopping point or only names it. | Do basic beliefs possess intrinsic warrant or derived warrant? | A subject holds a logical truth to be self-evident without deriving it from other premises. | The belief is justified by its own self-evident nature. | The belief is justified by its coherence with the system of logic employed. |
  | **4. Rival Coherent Systems** | The coherentist has no non-question-begging resources for choosing among rival but equally coherent total systems. | The coherentist has resources such as simplicity and explanatory power to choose among rival systems without external input. | Can coherence alone distinguish between competing total systems? | Two total systems are internally consistent but mutually incompatible regarding the external world. | Justification cannot distinguish between them without foundational input. | Justification favors the system with greater explanatory virtue or simplicity. |

  ### III. Verbal Disputes

  We identify the following areas where our disagreement appears to be partially verbal, arising from divergent definitions rather than substantive conflict.

  1.  **Scope of "Justified":** We disagree on whether the word "justified" applies univocally to individual beliefs and to whole systems. The Foundationalist applies it primarily to individual beliefs grounded in experience; the Coherentist applies it primarily to systems within which beliefs reside.
      *   *Revision:* We shall distinguish "locally justified" (individual belief status) from "globally justified" (system status) to prevent equivocation.
  2.  **Definition of "Inference":** The Coherentist alleges the Foundationalist relies on inference where the Foundationalist claims none exists. This stems from a disagreement over whether "inference" requires conscious deliberation or includes dispositional transitions.
      *   *Revision:* We shall distinguish "conscious inference" from "dispositional support" to clarify whether basic beliefs involve a hidden inferential step.

  ### IV. Note on Infinitism

  We both dismissed infinitism—the view that a belief is justified only by an actually infinite, non-repeating chain of reasons, each justifying the next—within about thirty seconds of its being raised. However, in the spirit of fairness:

  *   **Point of Agreement:** An infinitist would sign our **Agreed Claim 1** (The Genuine Regress), as they agree the regress is not dissolved by psychological stopping.
  *   **Strongest Objection:** The single strongest point an infinitist would press against both of us is that both foundationalism and coherentism artificially truncate the chain of reasons; only an infinite chain preserves the requirement that every reason must itself have a reason, whereas we both allow some reasons to terminate without further support.

