answer: |-
  To analyze the Sokal hoax through the lens of Richard Rorty's antirepresentationalism is to translate a drama about *truth* into a drama about *utility* and *solidarity*. For Rorty, the mind does not mirror nature; language is a tool for coping, not a picture of the world. Truth is not accuracy of representation but a property of beliefs that prove good to hold within a community of inquirers. Consequently, the Sokal episode cannot be understood, on Rortyan grounds, as a victory of Reality over Relativism. Instead, it becomes a conflict between competing vocabularies and the social practices that sustain them.

  ### The Nature of the Failure: Correspondence vs. Solidarity

  The central question is whether *Social Text* failed at something, given Rorty's rejection of beliefs being "answerable to the world." For a realist, the editors failed because they published falsehoods; they allowed claims that did not correspond to physical reality. For Rorty, there is no "world" to which they failed to correspond, because the world does not speak—only we do.

  However, Rorty's framework does not entail that "anything goes." Beliefs are answerable to *us*, specifically to the community of inquirers with whom we seek solidarity. By Rorty's lights, *Social Text* failed not because they misrepresented nature, but because they violated the norms of their own discursive community and disrupted the broader solidarity of the academy. Academic inquiry relies on a presumption of good faith and rigor; publishing "fluent, ideologically congenial gibberish" undermines the utility of the journal as a tool for communication.

  Rorty would argue the editors failed a *pragmatic* test. A vocabulary (in this case, the hybrid of physics and cultural theory Sokal fabricated) is judged by its consequences. Does it help us predict? Does it foster fruitful conversation? Sokal's article helped no one cope with anything; it was a dead end. Thus, the editors failed to recognize a tool that was useless. They prioritized *political solidarity* (agreement with the conclusion that science is constructed) over *intellectual solidarity* (the shared standards of rigorous inquiry that make academic publishing function). For Rorty, this is a genuine failure, but it is a social and pragmatic failure, not an ontological one.

  ### Illuminations: Ideology as Solidarity

  Rorty's framework illuminates the *mechanism* of the hoax's success more clearly than realism does. Realism struggles to explain why trained editors would accept nonsense; it must posit ignorance or stupidity. Rorty, however, predicts that acceptance is driven by congruence with existing beliefs.

  1.  **Ideological Congruence:** Rorty argues that we justify beliefs by referencing other beliefs, not by referencing the world. The *Social Text* editors accepted the article because it cohered with their web of beliefs regarding the social construction of reality. Rorty's antirepresentationalism explains this perfectly: the article "worked" for them because it facilitated their political projects, regardless of its relationship to quantum gravity.
  2.  **The Authority of Science:** Rorty denies science has a privileged epistemic standing because it accesses "Nature's Way." He argues its authority rests on its success in prediction and the solidarity of scientists. The hoax highlights what happens when a community (cultural studies) attempts to appropriate the vocabulary of another community (physics) without submitting to the latter's standards of solidarity (peer review, mathematical rigor). Rorty would say the editors tried to use a vocabulary without learning the rules of the game that makes that vocabulary useful. They treated scientific terms as metaphors rather than tools for specific coping tasks.

  ### Blind Spots: The Sting of Deception and the Silence of the World

  While Rorty's lens clarifies the sociological dynamics, it misdescribes or dilutes the normative force of Sokal's critique.

  1.  **The Sting of the Charge:** Sokal's revelation carried a specific moral weight: "You ignored the *facts*." The sting relies on the intuition that there is a way the world *is*, and the editors were negligent in ignoring it. Rorty translates this to: "You ignored the *scientists*." This translation dampens the sting. It turns a charge of intellectual negligence regarding reality into a charge of bad manners regarding a professional guild. For Sokal, the editors were *wrong about the universe*; for Rorty, they were merely *out of step with the physics community*. The antirepresentationalist account struggles to capture the intuition that the editors were culpable for something deeper than tribal insularity.
  2.  **The Coherence of Deception:** Sokal's act was a deliberate lie. In a representationalist framework, lying is asserting what one knows does not correspond to reality. In Rorty's framework, lying is disrupting the trust required for solidarity. However, Sokal lied to *restore* a form of solidarity (rigor) by exposing a lack of it. This creates a paradox for the pragmatist: Is deception justified if it serves the long-term utility of inquiry? Rorty's "liberal ironist" might approve of Sokal's subversion, but the framework lacks a robust account of why the *content* of the lie (nonsense) matters more than the *act* of the lie. If truth is just what peers accept, and Sokal tricked the peers, then for three weeks, the nonsense *was* true (in the Rortyan sense of being accepted). This makes the "reveal" seem like a mere change in social consensus rather than a correction of error.
  3.  **The Recalcitrance of the Non-Human:** Rorty insists the world is silent. Yet, the hoax suggests that the non-human world exerts a constraint that cannot be fully reduced to social agreement. Physics has an internal logic that resists arbitrary narration. If you write nonsense about math, the math "pushes back" by rendering the argument incoherent. Rorty accounts for this as "causal friction," but the episode suggests this friction is normative, not just causal. The editors didn't just bump into a wall; they failed a test of *correctness* that feels distinct from *usefulness*. Rorty's framework risks collapsing the distinction between "useful fiction" and "accurate description," which is precisely the distinction Sokal felt the editors had obliterated.

  ### Conclusion: A Normative Vulnerability

  Does this episode confirm, embarrass, or expose a case unanticipated by antirepresentationalism?

  The episode **exposes a normative vulnerability that ultimately embarrasses the framework.**

  It confirms Rorty's *descriptive* claim: solidarity and ideological congruence drive acceptance more than rigorous correspondence. Rorty correctly predicts that without a "God's eye view," communities will validate what feels good to believe. However, it embarrasses his *normative* claim. Rorty wants to say we can still critique bad inquiry without appealing to realism. But in the Sokal case, the most powerful critique *is* realist: "You failed to acknowledge the constraints of physical reality."

  When Rorty translates this into "You failed to acknowledge the practices of physicists," he weakens the condemnation. It makes the error seem like a breach of etiquette rather than a failure of cognition. The episode exposes that antirepresentationalism lacks the vocabulary to vindicate Sokal's specific intuition: that there is a difference between *persuasive nonsense* and *unpersuasive truth*, and that difference is not merely a matter of current social utility. By denying that beliefs are answerable to the world, Rorty renders the editors' error less egregious than it intuitively feels. The hoax demonstrates that while we may construct our *descriptions* of the world socially, the *world* itself constrains those constructions in a way that "solidarity" alone cannot fully capture. Thus, the episode stands as a case where antirepresentationalism explains *why* the failure happened, but fails to justify the full force of *why it matters*.
