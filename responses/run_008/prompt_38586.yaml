      *   *Key Distinction 4: Invitation.* Did they ask for feedback? (Sister vs. Dutch).

      *   *Refined Principle:* **The Principle of Relevant Agency.**
          *   Tell the truth when the recipient has the *agency* to change the outcome and the *stake* in the outcome is high.
          *   Soften/Withhold when the outcome is fixed (meatloaf eaten, dog dead) or the interaction is ritualistic (greetings).
