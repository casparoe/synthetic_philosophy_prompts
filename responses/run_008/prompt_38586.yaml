      *(Self-Correction on the "Coffee" case)*: This is a social script. It's not a lie in the same category. It's "phatic communication." I need to distinguish this from actual deception.

      *(Finalizing the Test Case)*: The friend asks *point blank*. This removes the "unsolicited" defense. They want the truth. The stakes are high (humiliation). The principle demands truth, but delivered with care.

