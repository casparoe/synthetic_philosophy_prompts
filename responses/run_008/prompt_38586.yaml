answer: |-
  You are not inconsistent; you are navigating three different ethical frameworks simultaneously without realizing it. Your gut is switching between **Utilitarianism** (does this help?), **Social Contract** (what are the rules of this interaction?), and **Relational Ethics** (what does this relationship require?).

  Your proposed rule ("Lie when the truth can't help, tell truth when they can act") is strong, but it misses two critical variables: **Consent** and **Identity**.

  Here is the principle that unifies almost all your verdicts, followed by the uncomfortable truth about your sister, and finally, the verdict on the auditioning friend.

  ### The Principle: "Actionable Stake + Invitation"

  **You owe the truth when the listener has the agency to change the outcome AND the context implies consent to feedback. You owe kindness (or silence) when the outcome is fixed, the interaction is ritualistic, or the feedback touches on identity without invitation.**

  Let's run your cases through this filter:

  1.  **Grandma's Meatloaf:** Outcome is fixed (meatloaf is eaten). Agency is zero. **Verdict: Lie.** (Matches your gut).
  2.  **Coworker "How are you?":** This is a *phatic* expression (social ritual), not a data request. The "contract" says we exchange pleasantries, not medical histories. **Verdict: "Fine."** (Matches your gut, though the isolation you feel is the cost of the contract).
  3.  **Manager's Bad Idea:** Outcome is not fixed (project hasn't launched). Agency is high (manager can pivot). Context is professional (consent to critique is implied). **Verdict: Truth.** (Matches your gut).
  4.  **Coffee Invitation:** This is a social ritual, similar to "How are you?" It functions as a "I value you currently," not a "I commit to a calendar date." **Verdict: Soft Lie.** (Matches your gut).
  5.  **Friend's Presentation:** Outcome is not fixed (next presentation). Agency is high. Friendship implies a duty of care to prevent future embarrassment. **Verdict: Truth.** (Matches your gut).
  6.  **Dead Dog to Kid:** Agency is zero (child cannot resurrect dog). Capacity to process is low. Protection overrides truth. **Verdict: Lie.** (Matches your gut, though the sting you feel is valid—it's a necessary moral injury).
  7.  **Japanese "Difficult":** This is high-context communication. The "truth" (No) is conveyed, just wrapped. Agency is preserved (they know not to push). **Verdict: Polite Truth.** (Matches your gut).

  ### The Inconsistency: The Sister vs. The Dutch Colleague

  You asked me to be honest about where the principle breaks your verdicts. Here is the break: **The Sister.**

  According to the "Actionable Stake" part of the principle, your sister *did* have agency (she could lose weight) and the info *was* useful (you confirmed it helped). So why does it feel wrong?

  Because of the **Invitation** clause.

  *   **The Dutch Colleague:** Commented on *clothing* (an external object) in a *work/casual* setting where objective feedback is often welcomed as efficiency.
  *   **The Sister:** Commented on *your body* (identity) in a *personal* setting where feedback was **unsolicited**.

  Your principle saves the Dutch colleague but condemns the sister. You were furious because the social contract of sisterhood does not imply automatic consent for body critique, whereas the contract with a direct Dutch colleague might imply "we say what we see."

  **The Hard Truth:** You are right to suspect hypocrisy. We often view "Dutch Directness" as refreshing when it is abstract or aimed at others (efficient, honest), but view it as an attack when it targets our insecurities (vulnerable, intimate). Your principle clarifies this: **Directness without invitation is aggression, even if the data is true.**

  ### The Test Case: The Auditioning Friend

  **Scenario:** A friend about to audition asks point blank: "Can I sing?" (They are mediocre).

  **Applying the Principle:**
  1.  **Agency:** High. They can choose to audition, take lessons, or pick a different role.
  2.  **Stake:** High. Public humiliation is a real risk.
  3.  **Invitation:** **Explicit.** They asked "point blank." This removes the "unsolicited" defense you had with your sister. They are requesting the data.

  **The Verdict:** You cannot lie.
  If you lie, you violate the **Actionable Stake**. You are robbing them of the chance to mitigate risk. If they bomb the audition, they won't know if it was the singing or the acting or the nerves. If you tell the truth, they can prepare differently or manage expectations.

  **However,** you do not need to be Dutch. You can be Japanese.
  The truth does not have to be binary ("No, you suck"). The truth can be nuanced ("You have great expression, but your range is limited for this specific role").

  **What to say:**
  > "I want you to succeed, so I'm going to be honest. You have a lot of heart and stage presence, but vocally, this role requires a consistency you haven't quite hit yet. If you go in, go in knowing you might not get it based on the singing alone, not because you aren't a great performer."

  **Why this works:**
  *   It honors the **Invitation** (they asked).
  *   It preserves **Agency** (they can still audition, but with eyes open).
  *   It avoids **Aggression** (it critiques the performance, not the person).

  ### Where Your Gut Might Still Fight the Principle

  There is one case where your principle might demand something your gut hates: **The "I'm Fine" to the Coworker.**

  Your principle classifies this as a "Social Ritual," so it passes. But you noted it "sits weird" with you. That's because while it satisfies the *Social Contract*, it violates the *Relational Ethic* of connection.
  *   **The Principle says:** It's fine, it's a greeting.
  *   **Your Gut says:** It's lonely.

  The principle can't save you from the loneliness of politeness. Sometimes, breaking the rule ("Actually, I'm having a tough day") builds a better bridge, even if it violates the "phatic" norm. Your inconsistency there isn't ethical confusion; it's a tension between **Professional Boundaries** and **Human Connection**.

  ### Summary
  You are not inconsistent. You are a **Contextualist**.
  1.  **Fixed Outcome + Vulnerable Person = Kindness** (Grandma, Kid).
  2.  **Changeable Outcome + Professional Context = Truth** (Manager, Presentation).
  3.  **Changeable Outcome + Personal Context + No Invitation = Silence** (Sister).
  4.  **Changeable Outcome + Personal Context + Invitation = Nuanced Truth** (Audition Friend).

  The only hypocrisy is expecting the world to be Dutch when it suits you, but Japanese when it protects you. Acknowledge that, forgive yourself for it, and when your friend asks about the audition: **Tell them the truth, but hold their hand while you do it.**
