      *   *Critique:* It's mostly utilitarian (consequence-based).
      *   *Where it works:* Meatloaf (can't fix it), Manager (can fix idea), Presentation (can improve).
      *   *Where it wobbles:* "I'm fine" (Can't act on it, but feels like hiding), Coffee (Can't act on it, but is a false promise), Dog (Can't act on it, but is a fundamental deception about reality), Sister (Can act on it [lose weight], but caused rage).

  4.  **Develop a Better Principle:**
      *   The user's intuitions aren't just about *utility* (can they act?). They are about *relationship roles* and *consent*.
      *   *Key Distinction 1: Phatic vs. Factual.* "How are you?" and "Coffee sometime" are social lubricants, not information exchanges. Lying here isn't really lying.
      *   *Key Distinction 2: Agency & Stake.* Does the person have a right to the truth to make a decision? (Manager, Presentation, Audition).
