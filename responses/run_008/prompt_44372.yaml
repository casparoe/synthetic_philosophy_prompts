answer: |-
  # Handout: A Taxonomy of Collapse
  **Seminar:** The End of Societies | **Session:** Closing Taxonomy

  This decision tree sorts positions on societal collapse based on logical commitments rather than authorial canon. To find your position, answer the following six questions using the test cases provided: the **Maya** (Southern Lowlands, post-800 CE), the **Late Bronze Age** (Eastern Mediterranean, c. 1200 BCE), and **Easter Island** (Rapa Nui, post-deforestation).

  ### The Decision Tree

  **1. The Object of Loss**
  When monuments cease to be built and central tax collection stops, but the villages remain populated and farmed (e.g., the Maya after the Classic period, or Easter Island after the statues stopped), is the primary ending that of the **structure of command** or the **continuity of the community**?
  *   **Structure of Command:** Go to Question 2.
  *   **Continuity of Community:** Go to Question 5.

  **2. The Standard of Comparison (Command)**
  If the structure of command ended (e.g., the Mycenaean palaces c. 1200 BCE), is this significant because the society *fell from its own peak of complexity* or because it *failed to secure basic physical safety*?
  *   **Fell from Peak:** Go to Question 3.
  *   **Failed Safety:** Go to Question 4.

  **3. The Timescale (Peak)**
  If the loss is measured against a previous peak, must the fall happen *fast enough for a single generation to witness the before and after* to count as collapse?
  *   **Yes (Fast):** Leaf A.
  *   **No (Slow/Process):** Leaf B.

  **4. The Valuation of Fragmentation (Safety)**
  If the loss is measured by physical safety, and the result is a fragmentation into smaller, self-governing units (e.g., post-palm Easter Island clans), is this *political failure* or *successful adaptation*?
  *   **Political Failure:** Leaf C.
  *   **Successful Adaptation:** Leaf D.

  **5. The Threshold of Ending (Community)**
  If the continuity of the community is the metric, does the society end only when the *population dies or disperses* or when their *way of life becomes unrecognizable*?
  *   **Population Dies/Disperses:** Leaf E.
  *   **Way of Life Changes:** Go to Question 6.

  **6. The Observer's Stance (Change)**
  If the way of life changes but the people persist (e.g., Maya becoming Post-Classic), is labeling this "collapse" a *neutral description of transformation* or a *pejorative judgment on the loss of prestige*?
  *   **Neutral Description:** Leaf F.
  *   **Pejorative Judgment:** Leaf G.

  ***

  ### The Leaves: Positions and Commitments

  **Leaf A: The Catastrophist View**
  *   **Attribution:** Often associated with **Jared Diamond** (popular) or **Harvey Weiss** (academic).
  *   **Definition:** Collapse is a rapid, severe drop from a peak of complexity that results in widespread insecurity.
  *   **Awkward Commitment:** You must explain why societies that appear to recover (like the Maya in the Post-Classic) are dismissed as "not the same society" to maintain the claim of total failure.

  **Leaf B: The Declinist View (Unnamed)**
  *   **Attribution:** No standard attribution.
  *   **Definition:** Collapse is a long-term erosion of capacity measured against a society's own golden age, regardless of immediate survival.
  *   **Awkward Commitment:** You risk calling a stable, centuries-long plateau a "collapse" simply because it is less flashy than the preceding century.

  **Leaf C: The Fragility View (Unnamed)**
  *   **Attribution:** No standard attribution.
  *   **Definition:** Collapse is the failure to maintain security, where fragmentation into smaller units leaves people more vulnerable to violence or want.
  *   **Awkward Commitment:** You must argue that smaller, local scales of organization are inherently less safe than large empires, even when those empires are the source of the violence.

  **Leaf D: The Simplification View**
  *   **Attribution:** Standardly associated with **Joseph Tainter**.
  *   **Definition:** Collapse is an economically rational shedding of costly complexity when the marginal return on investment turns negative.
  *   **Awkward Commitment:** You must accept that the loss of art, literacy, and coordination is a "rational" choice, which can sound like a cold justification for cultural loss.

  **Leaf E: The Demographic View (Unnamed)**
  *   **Attribution:** No standard attribution.
  *   **Definition:** Collapse occurs only when the population physically dies out or is forced to migrate en masse; political change is irrelevant.
  *   **Awkward Commitment:** You are forced to say a society has not collapsed even if its culture, language, and identity are completely erased, provided the biological descendants remain on the land.

  **Leaf F: The Transformation View**
  *   **Attribution:** Standardly associated with **Patricia McAnany & Norman Yoffee**.
  *   **Definition:** What looks like an ending is actually reorganization; the people persist, and "collapse" is just the change of a state structure.
  *   **Awkward Commitment:** You must downplay the genuine trauma and loss of capability that often accompanies political dissolution to emphasize continuity.

  **Leaf G: The Deflationary View**
  *   **Attribution:** Standardly associated with **Guy Middleton**.
  *   **Definition:** "Collapse" is not a factual event but a partisan word used by elites (or archaeologists) to describe change they disapprove of.
  *   **Awkward Commitment:** If taken fully seriously, your position makes the word "collapse" useless for analysis, reducing it to mere name-calling.

  ***

  ### Coda: Vacancies and Limitations

  **Empty Combinations**
  Two logical combinations in this tree appear vacant. First, **Fast + Failed Safety + Successful Adaptation** is empty; if safety fails rapidly, it is incoherent to call the result a successful adaptation. Second, **Slow + Fell from Peak + Political Failure** is largely unexplored; scholars who measure against a peak usually care about the speed of the fall (Catastrophist) or the rationality of the loss (Simplification), leaving the "slow failure" niche unfilled. These vacancies are likely **unattractive**: they describe scenarios that are either logically contradictory or intellectually barren.

  **Indistinguishable Positions**
  This instrument cannot reliably separate **Leaf A (Catastrophist)** from **Leaf B (Declinist)** in cases where the archaeological record is ambiguous. If a "slow" decline eventually leads to the same ruin as a "fast" collapse, the distinction rests entirely on dating precision rather than theoretical commitment. This is a limitation of the tree: it treats timescale as a philosophical choice, when in practice it is often an evidentiary dispute.
