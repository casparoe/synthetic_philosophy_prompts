  # Final Exam: Formal Epistemology
  **Question 4 (30 Points)**

  **Scenario:** Two perfectly calibrated Bayesian forecasters, A and B, are hired to estimate the probability that a certain research lab ships a particular frontier system within eighteen months. Both begin with credence exactly 0.5 in shipment, and each knows the other does. Each then receives one private signal from the lab's internal tracker: A's signal moves her credence to 0.8, B's moves his to 0.2. They exchange exactly one round of messages, each stating only their own final credence; each message is received, understood, and known to be understood. So each one's posterior is common knowledge between them, each knows both of them are perfect Bayesians who started at 0.5 — and yet both credences stand, at 0.8 and 0.2, with neither party the least bit inclined to revise.

  **(a)** What does this scenario prove about the prior distributions held by A and B? Explain precisely how they can share an initial credence on the target event yet fail to satisfy the technical requirements of the Agreement Theorem. Describe the specific structural disagreement that must exist between them to sustain this outcome. (10 points)

  **(b)** Evaluate the argument that agents with differing priors should be willing to bet against each other, and that persistent willingness to bet marks them as irrational. Engage with at least two objections to this wager-style argument (e.g., adverse selection, risk aversion, stake limits). Connect this analysis to the logic of no-trade theorems: in what sense is the Agreement Theorem a special case of the result that private information does not generate trade among agents with common priors? (10 points)

  **(c)** What is the status of the Common Prior Assumption: is it an empirical generalization, a normative ideal, or a modeling convention? Discuss how the result that iterated announcement of posteriors converges (without a finite bound) interacts with the "folk practice" of rationalist communities who claim to follow Bayesian norms yet disagree for decades. Does this result vindicate or undermine their expectation of eventual consensus? (10 points)

  *Note: No credit will be given for reproducing citations, dates, or author names. You are tested on your ability to work the machinery of the arguments, not your memory of the literature.*

  ***

  # Model Answer

  **(a)** The scenario proves that while A and B share a marginal prior on the target proposition, they lack a common prior over the full state space. The Agreement Theorem requires agents to share a prior probability distribution over all uncertain variables, which includes the target event *and* the information structure (the signals received and the partition of knowledge). If they possessed a true common prior, common knowledge of their posteriors would mathematically force those posteriors to be identical. Since they remain at 0.8 and 0.2, their priors over the joint distribution of (Event, Signal_A, Signal_B) must differ. Specifically, they must hold conflicting likelihood functions: they disagree on the probability of receiving their specific signals conditional on the event, or on how their signals correlate. For instance, A might believe the tracker is highly reliable, while B believes it is noisy or biased. They agree on the base rate (0.5) but disagree on the diagnostic value of the evidence. Thus, the common prior assumption is a stringent constraint on the joint distribution of events and information sources, not merely on the marginal probability of the event at the initial time step. It rules out the possibility that they interpret the same data through different structural models. The disagreement is not about the event directly, but about the reliability of the information channels.

  **(b)** The wager-style argument claims that differing priors create Dutch books, implying that persistent disagreement invites exploitation. However, this argument fails to account for strategic interaction. First, adverse selection (the "winner's curse"): the fact that a counterparty offers a bet is itself informative. If B offers a bet on "No Shipment," A must update on B's willingness to bet, which may negate the expected profit. Second, risk aversion limits wagering; agents with concave utility functions may reject positive expected value bets to avoid wealth variance. Third, practical stake limits prevent infinite money pumps. These points connect directly to no-trade theorems, which show that if agents share a common prior and start at a Pareto optimal allocation, private information cannot motivate trade. The Agreement Theorem is the epistemic limit of this logic: if probability estimates are common knowledge, they represent a settled "allocation" of belief where no further "trade" in confidence is possible. Persistent disagreement implies the preconditions for the no-trade theorem are absent—specifically, the common prior. Therefore, the willingness to bet is not necessarily a mark of irrationality, but a signal of divergent models.

  **(c)** The Common Prior Assumption (CPA) occupies three statuses. Empirically, it is descriptively false; minds naturally diverge. Normatively, it is contested whether rationality mandates identical priors given identical information or permits divergent starting points as "brute facts." Methodologically, it is a modeling convention imposed to ensure tractability and define equilibrium concepts. The convergence result—that iterated announcement of posteriors converges to consensus—vindicates the logical machinery but undermines the rationalist blogosphere's folk practice. If community members truly shared a common prior, their prolonged communication should have forced convergence. The fact that they disagree after a decade of "updating" indicates they are not merely processing private signals within a shared model, but operating with fundamentally divergent models of the world (different priors over the information structure). Thus, the theorem diagnoses the disagreement as foundational. It explains the sorting into factions not as irrationality, but as convergence within subgroups sharing specific structural priors, while remaining divergent across groups. It shifts the burden from "update harder" to "align models." The theorem does not promise universal consensus, only consensus within clusters of shared priors. Thus, the blogosphere's failure to converge is not a refutation of the theorem, but a confirmation that the community lacks the requisite common prior structure.

