      *   **Body Paragraph 2: The Calculus of Risk (Self-Preference).** The "extraordinary degree" clause. This is the strongest evidence for the permission of self-preference.
      *   **Body Paragraph 3: Merit and Compensation.** Intent over outcome (failed attempts). Money as indemnity, not wage.
      *   **Body Paragraph 4: Strict Presupposition.** Identify where the theory is unavoidable. (The definition of the act as *voluntary* risk).
      *   **Body Paragraph 5: The Counterfactual (Duty to Rescue).** How the system breaks or changes if easy rescue is mandatory.
      *   **Conclusion:** Summarize the moral vision. The CHF validates the hero by acknowledging that what they did was *more* than what was asked.

  6.  **Drafting the Content (incorporating specific prompt requirements):**

