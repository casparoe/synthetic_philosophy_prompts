  8.  **Final Review against the "Strict Presupposition" constraint:** This is the hardest part. Many theories can *fit* the data. Which one is *required*?
      *   *Argument:* The practice *requires* the distinction between the Obligatory and the Supererogatory. If all rescue were obligatory, the medal is for "compliance." If no rescue is obligatory, the medal is for "gift." The CHF sits in the middle: Low risk = permissible to omit (no medal); High risk = supererogatory (medal).
