      *   *Strict Presupposition:* The strongest point is the **Risk Threshold**. If self-sacrifice were obligatory, the fund would be unnecessary (or universal). The fact that they filter for "extraordinary risk" implies low-risk rescue is morally neutral or expected, but high-risk is optional. Actually, the prompt says "easy rescue is simply obligatory" as the *alternative*. So the current view is "easy rescue is permissible to omit."
      *   *Wait, check the prompt's phrasing:* "What would have to change... if we adopted instead the view that easy rescue is simply obligatory?" This implies the current view is "easy rescue is *not* obligatory."
      *   *Key Insight:* The CHF operates in the gap between "No Legal Duty" and "Moral Praise." It fills the void left by the law's refusal to mandate rescue.

  5.  **Structuring the Essay:**

      *   **Title:** Something about Supererogation and the Price of Heroism.
      *   **Introduction:** State the thesis. The CHF presupposes a **Supererogationist Ethics** grounded in **Liberal Individualism**. It distinguishes sharply between duty (role-based/minimal) and merit (voluntary/high-cost).
