answer: |-
  The Carnegie Hero Fund (CHF) operates as a moral institution that codifies a specific, nuanced ethical framework. It does not merely reward good deeds; it constructs a taxonomy of moral action that distinguishes sharply between **duty** (what is required) and **supererogation** (what is praiseworthy but optional). The Fund's practices presuppose a theory of **Moderate Supererogationism** grounded in **Liberal Individualism**. This theory holds that while agents have specific, role-based duties, they possess a general moral permission to prioritize their own safety, rendering high-risk rescue a voluntary gift rather than a mandatory requirement.

  ### The Implicit Account of Duty and Supererogation

  The CHF's eligibility rules reconstruct a moral landscape where obligation is contextual rather than universal.

  **1. Role-Indexed Duty vs. Universal Capacity**
  The exclusion of police, firefighters, and military personnel presupposes that duty is **institutional** rather than **ontological**. Under a purely capacity-based theory of duty (e.g., "if you can save a life, you must"), a firefighter saving a life is morally identical to a baker doing the same. By excluding professionals unless the act is "clearly beyond the line of duty," the CHF asserts that **merit is inversely proportional to obligation.** One cannot earn moral credit for doing what one is already bound to do. This presupposes that the "heroic" quality of an act is not intrinsic to the act itself (saving a life) but relational to the agent's prior commitments.

  **2. Special Relationships and the Cost of Duty**
  The family-member exception reveals a gradient of obligation. It presupposes that **special relationships generate stronger duties** than those owed to strangers; a parent is more obligated to save a child than a passerby is. However, the clause allowing awards if the family member dies or is gravely injured presupposes that **duties have a cost limit.** Even a strong duty (parent to child) does not mandate self-destruction. When the cost of fulfilling a relationship-based duty reaches the level of death or grave injury, the act transitions from "obligatory" to "supererogatory." This implies that the moral demand of relationships, while weighty, is still bounded by the right to self-preservation.

  **3. The Extraordinary-Risk Threshold and Self-Preference**
  The requirement that risk be "extraordinary" is the clearest expression of the Fund's liberal individualism. It presupposes that **self-preference is morally permissible.** If saving a stranger were strictly obligatory regardless of cost, the risk level would be irrelevant to eligibility. By filtering for high risk, the CHF acknowledges that low-risk rescue might be morally expected (even if not legally required), but high-risk rescue is not. The practice validates the intuition that an individual is morally permitted to weigh their own life heavily against a stranger's. Heroism, therefore, is defined as the **voluntary suspension of the right to self-preservation.**

  **4. Merit, Intention, and Compensation**
  Awarding medals for failed attempts presupposes a **deontological or virtue-ethical account of merit**, where moral worth attaches to the will (the willingness to risk) rather than the consequence (the life saved). If merit were consequentialist, failed rescues would be worthless.
  Furthermore, the cash payments distinguish the CHF from a wage system. Firefighters are paid a salary *ex ante* for assuming risk as part of a job; CHF recipients receive benefits *ex post* as indemnity and honor. This presupposes that **society owes a debt of gratitude for sacrifices it could not demand.** The payment is not a price for the life saved (which would commodify the act) but a restorative measure to ensure the hero is not impoverished by their generosity. It acknowledges that while the act was not required, the cost of it should not be borne alone.

  ### Where the Practice Strictly Presupposes One Theory

  While many ethical theories might *accommodate* the CHF, the practice **strictly presupposes the distinction between the Obligatory and the Supererogatory.**

  Specifically, the **exclusion of line-of-duty rescuers** combined with the **award for civilians** makes it logically impossible to hold a theory of **Universal Moral Duty** (where saving a life is always obligatory if possible). If saving a life were universally obligatory, the firefighter and the civilian would stand on equal moral footing regarding the act itself. The Fund's refusal to award the firefighter (for standard duty acts) asserts that **obligation negates merit.** You cannot be a hero for doing your job. This strictly requires a theory where moral praise is reserved for the "beyond."

  Moreover, the **risk threshold** strictly presupposes **Agent-Relative Prerogatives.** If the moral law demanded impartiality (i.e., a stranger's life equals your own), then risking death to save a stranger would be obligatory, not heroic. The fact that the CHF treats this risk as "extraordinary" and award-worthy confirms the underlying theory that agents are *permitted* to be partial to their own survival. Without this theoretical permission, the Fund would not be awarding medals; it would be investigating negligence for those who *didn't* jump.

  ### The Counterfactual: If Easy Rescue Were Obligatory

  If we adopted the view that "easy rescue is simply obligatory" (aligning the moral theory with civil-law "Bad Samaritan" statutes), the CHF's architecture would require fundamental reconstruction:

  1.  **Eligibility Rules:** The bar for the Medal would rise significantly. Since easy rescue would be a baseline duty, intervening at trivial cost would be mere compliance, warranting no award. The Fund would become exclusively a **High-Risk Supererogation Fund**. The "family member" exclusion would likely vanish for low-risk scenarios (since you are legally/morally bound to save your kin), but remain for high-risk ones.
  2.  **Payments:** The nature of the cash benefits would shift from **honorific grants** to **state indemnity.** If rescue is a civic duty, then injury sustained while rescuing is akin to an injury sustained while jury duty or military service. The payment would no longer be a "gift" from a private foundation acknowledging a supererogatory act, but a public entitlement for citizens harmed while fulfilling a civic obligation. The distinction between the firefighter (paid) and the civilian (granted) would blur; both would be compensated for duty-bound injuries.
  3.  **Legal Background:** The common-law "no-duty" rule would have to be abolished. The CHF currently fills a moral vacuum left by the law. If the law mandated rescue, the CHF would no longer be celebrating the *choice* to act (since inaction would be criminal), but rather the *degree* of sacrifice involved in acting.

  ### Conclusion

  The Carnegie Hero Fund presupposes a moral universe where individuals are sovereign over their own safety. It operates on the theory that while we may hope for altruism, we cannot demand self-destruction. By rewarding only the voluntary assumption of extraordinary risk, the Fund affirms that true moral merit lies in the gap between what the law requires and what the hero gives. To shift to a model where easy rescue is obligatory would be to close that gap, transforming the Hero Fund from a shrine to supererogation into a bureau of civic indemnity.
