      *   *Strict Presupposition:* The exclusion of those "responsible for the peril" is interesting. It implies a forfeiture of merit if you created the duty. This supports a corrective justice view.
      *   *The "Strict" part:* The prompt asks where the practice *strictly presupposes* one theory. I argue it's the **Risk Threshold combined with the Voluntary Clause**. If high-risk rescue were obligatory, the fund would be a disability scheme for all rescuers, not an award for "heroes." The *selectivity* presupposes that most people *could have done otherwise without blame*.

  7.  **Final Polish:** Check tone (analytical, philosophical). Ensure all constraints of the prompt are met. (The prompt is dense, so the response must be equally dense and precise).

      *   *Check:* Did I address the firefighter payment comparison? Yes, need to distinguish wage vs. grant.
