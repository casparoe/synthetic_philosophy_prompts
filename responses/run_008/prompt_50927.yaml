answer: |-
  Jordan is more right overall, as his insistence on truth-conditional divergence accurately captures the semantic distinction between epistemic and metaphysical modality, whereas Maya's unified account is falsified by the poison pair.

  Regarding the first move, Jordan is right that the subjunctive is a "different animal" truth-conditionally, while Maya is wrong to claim it is merely the indicative with pragmatic costume. The morphological shift signals a fundamental change in the modal base, not just the speaker's epistemic stance. On the second move, Jordan is correct that "counterfactual" is a misnomer because subjunctives permit true antecedents (factual subjunctives), whereas Maya's initial definition relied on antecedent falsity; her concession that it is a presupposition was necessary but insufficient. On the third move, Jordan is right on both counts: the implication of falsity is not cancellable in the standard pragmatic sense, and crucially, the poison pair demonstrates that the two moods can diverge in truth value, refuting Maya's claim that they share truth conditions. If the chef's action is causally independent of the butler's, the indicative (inferred from knowledge) is true while the subjunctive (evaluated via causal similarity) is false.

  On the final move, Maya is theoretically correct that the mood shifts the domain of quantification—indicatives range over epistemically accessible worlds, subjunctives over metaphysically similar ones—but Jordan is right to flag the philosophical cost: this renders indicative truth speaker-relative, which clashes with the intuition that factual claims should be objective. Both friends miss the Gibbardian possibility that indicatives lack truth conditions entirely, possessing only assertibility conditions, which would dissolve Jordan's worry about "facts out of ignorance" without requiring Maya's relativism. They also overlook that the poison pair's divergence stems specifically from causal independence, not merely domain shifting. Ultimately, Jordan wins the debate because his empirical observations forced the correct theoretical distinction, while Maya only arrived at the standard semantic model by conceding his key points.
