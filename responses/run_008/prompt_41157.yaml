  A dual-task paradigm inserting a neutral visual probe during the inter-stimulus interval can dissociate the accounts based on attentional resource availability. In a standard psychophysics booth, subjects fixate centrally while a red dot flashes on the left for 10ms, followed 50ms later by a green dot on the right for 10ms, creating the illusion; critically, during the 50ms gap, a faint white probe dot flashes briefly at the original left location, and subjects must simultaneously report the motion illusion and press a button if they detected the probe. The Stalinesque model predicts probe detection will be significantly impaired because the brain is holding the red dot in a pre-conscious buffer to edit it with the green, locking attentional resources at that location; the Orwellian model predicts probe detection will remain at baseline because the red dot is already consciously registered and settled before the green arrives, leaving resources free to detect the probe even though the memory of the red dot is later overwritten by the motion narrative. The design's work turns on measuring concurrent processing capacity during the illusion window rather than relying on retrospective testimony about the dots themselves. A Dennett-style defender would argue you've cheated because probe detection is just another form of "report," meaning a high detection rate only proves the brain prioritized the probe judgment over the color judgment in the competition for memory consolidation, not that the red dot was ever "conscious" in a metaphysical sense; they would be right, because the experiment only shifts the timeline of when judgments become fixed without locating a definitive moment where experience "happens," leaving the Stalinesque/Orwellian distinction relative to the probe rather than absolute.
