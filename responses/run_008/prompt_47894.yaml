  # JOINT STATEMENT ON THE INTERPRETATION OF THE FRENCH REVOLUTION
  **Signed following a year-long adversarial collaboration**
  **By Dr. Alain Mercier (Social Interpretation) and Dr. Eleanor Vance (Revisionist Interpretation)**

  ## I. AGREED CLAIMS

  We, the undersigned, having reviewed the archival record and the historiography of the period 1787–1815, affirm the following factual and institutional premises as the common foundation for our continued debate:

  1.  **Institutional Transformation:** Between 1789 and 1791, the National Constituent Assembly abolished feudal dues and seigneurial rights (Night of August 4), established legal equality before the law, and nationalized Church property (*biens nationaux*).
  2.  **Religious Schism:** The Civil Constitution of the Clergy (1790) effected a structural break between the French state and the Papacy, resulting in a schism that persisted through the Concordat of 1801.
  3.  **Regime Change:** The monarchy was abolished in September 1792, followed by the execution of Louis XVI. The subsequent regime stabilized under Napoleon Bonaparte as a consulate and empire that codified the Revolution's gains regarding legal equality and the sanctity of property-owning male citizenship.
  4.  **Fate of Leadership:** During the Terror and the Thermidorian Reaction, the revolutionary leadership consumed its own ranks. The Girondins (1793), the Hébertists (March 1794), and the Dantonists (April 1794) were all executed via the Revolutionary Tribunal or the Law of 22 Prairial.
  5.  **The Question of Revolutionary Dynamics:** We agree to pose the following question neutrally, without presupposing an answer: *To what extent is the elimination of founding leadership an endogenous feature of revolutionary political culture versus an exogenous result of specific factional crises and security emergencies?*

  ## II. DISAGREEMENTS TABLE

  The following table outlines the core divergences in our interpretation. We have categorized these as **Empirical** (dispute over facts/data), **Conceptual** (dispute over definitions/categories), or **Partly Verbal** (dispute over terminology that masks a deeper empirical or conceptual rift).

  | Topic | Social Interpretation (Mercier) | Revisionist Interpretation (Vance) | Classification | Residual Disagreement (if verbal) |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Bourgeoisie** | The bourgeoisie was a coherent social class with distinct capitalist economic interests opposed to the aristocracy, driving the Revolution to secure property rights and market freedom. | The "bourgeoisie" was a heterogeneous social status; nobles and commoners were economically integrated. The Revolution was driven by political ambition within a unified elite, not class conflict. | **Partly Verbal / Conceptual** | Even if we agree to define "bourgeois" strictly by economic function (capital investment), we disagree on whether this group acted *as a class* politically in 1789, or merely as individuals seeking office. |
  | **1793–94 (The Terror)** | The Terror was a contingent deviation necessitated by foreign war and internal counter-revolution (Vendée) to protect the social gains of 1789. | The Terror was the logical culmination of the revolutionary political culture established in 1789, driven by an ideology of democratic virtue and popular sovereignty that brooked no opposition. | **Empirical / Conceptual** | If we agree war increased repression (Empirical), Mercier argues war *caused* the Terror; Vance argues war merely *accelerated* an ideological trajectory already present in the Jacobin discourse. |
  | **Drivers of Change** | Material pressures (harvest failures, fiscal crisis) and social blocking (privilege) created the structural conditions for insurrection. | The collapse of royal authority created a vacuum of power; the struggle to fill this vacuum using new democratic language drove events, independent of material distress. | **Empirical** | N/A. This is a dispute over the weighting of causal variables. |
  | **Outcome** | The Revolution succeeded in its historical mission: clearing feudal obstacles for capitalist development. | The Revolution succeeded in centralizing the state (continuity with the Old Regime) but failed to establish stable liberty; the "capitalist" outcome was incidental to the political struggle. | **Conceptual** | We disagree on the definition of "success." Mercier defines it by socioeconomic transformation; Vance defines it by political culture and state structure. |

  ## III. CRUXES

  We have identified three sub-questions (cruxes) where further investigation could significantly alter the weighting of our respective interpretations. For each crux, we specify the evidence both sides accept as relevant.

  **Crux 1: The Social Profile of the *Biens Nationaux* Buyers**
  *   **The Question:** Did the redistribution of Church and émigré land fundamentally alter the class structure of property ownership in France?
  *   **Accepted Evidence:** Notarial records, land registries, and tax rolls from 1790–1815 across diverse departments (e.g., Paris Basin vs. Provence).
  *   **Relevance:** If land passed predominantly to existing bourgeois investors, it supports the Social Interpretation. If land was purchased largely by peasants (fragmenting holdings) or by nobles using straw men (continuity of elite), it supports the Revisionist view of elite continuity or peasant autonomy.

  **Crux 2: Elite Interpenetration prior to 1789**
  *   **The Question:** To what degree were the "nobility" and the "bourgeoisie" distinct social groups in the late Old Regime?
  *   **Accepted Evidence:** Marriage contracts, records of venal office purchases, and ennoblement letters from 1750–1789.
  *   **Relevance:** If the elites were socially fluid and economically integrated (nobles engaging in trade, bourgeois buying offices/noble lands), the "class struggle" model is weakened. If social barriers remained rigid despite economic blending, the Social Interpretation retains explanatory power regarding *status* anxiety.

  **Crux 3: The War Counterfactual and the Terror**
  *   **The Question:** Would a Revolution that avoided foreign war in 1792 still have produced a Terror of similar scale and ideology?
  *   **Accepted Evidence:** Comparative analysis of revolutionary committees in non-invasion zones vs. invasion zones; timeline correlation of military defeats and repressive legislation (e.g., Law of Suspects).
  *   **Relevance:** If repression correlates strictly with military emergency, the Terror was contingent (Social). If repression correlates with the radicalization of political clubs regardless of military status, the Terror was ideological (Revisionist).

  ## IV. PREDICTIONS AND CONCESSIONS

  ### A. Predictions
  *For each crux, we record our prior expectations. These serve as a scorecard for future research.*

  | Crux | Mercier (Social) Prediction | Vance (Revisionist) Prediction |
  | :--- | :--- | :--- |
  | **1. Land Sales** | The majority of valuable land will be shown to have passed to urban bourgeois and wealthy peasants, displacing noble and ecclesiastical corporate ownership. | Purchases will show a mixed elite; nobles will retain significant influence via proxies, and peasant acquisition will not equate to "bourgeois" capitalist consolidation. |
  | **2. Elite Interpenetration** | Despite some intermarriage, legal privilege and social exclusion kept the groups distinct enough to generate collective class antagonism. | The groups were functionally a single "notable" class; the conflict was intra-elite rivalry for state control, not inter-class war. |
  | **3. War & Terror** | Repressive measures will cluster tightly around military defeats and internal insurrections (Vendée), showing contingency. | Repressive rhetoric and local committee violence will appear in safe zones prior to major defeats, showing ideological drive. |

  ### B. Existing Evidence and Concessions

  **On Decisive Evidence:**
  We agree that current data regarding **Crux 2 (Elite Interpenetration)** already bears decisively against the crudest versions of the Social Interpretation. It is now undeniable that many "nobles" were engaged in capitalist enterprise and many "bourgeois" were rentiers indistinguishable from nobles.

  **Concessions:**

  > **Dr. Alain Mercier (Social):** "I concede that the traditional rhetoric of a monolithic 'bourgeoisie' marching consciously toward capitalism in 1789 cannot survive the scrutiny of the marriage and office-holding records. The class was not 'formed' in the modern sense. However, I maintain that the *structural position* of these property owners vis-à-vis the feudal state created an objective conflict, even if the actors did not fully perceive it as a class war. My side must stop speaking of the bourgeoisie as a unified political party."

  > **Dr. Eleanor Vance (Revisionist):** "I concede that dismissing economic distress as mere background noise is untenable. The harvest crises of 1788–1789 and the fiscal collapse of the state were not just 'pretexts' for political discourse; they were the material conditions that made the political culture explosive. My side must stop implying that the Revolution was purely a debate among intellectuals disconnected from the price of bread. Ideology requires a carrier, and material crisis provided the mass mobilization."

  **Signed,**

  *Alain Mercier*
  *Professor of Modern History*

  *Eleanor Vance*
  *Professor of Political History*

  *Date: 24 October 2023*
