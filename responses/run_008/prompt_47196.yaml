answer: |-
  **DRAFT JOINT STATEMENT ON THE NATURE OF TRUTH**
  **To:** Department of Philosophy Faculty
  **From:** Graduate Rapporteur
  **Date:** October 26, 2023
  **Subject:** Preliminary Framework for Adversarial Collaboration (Deflationism vs. Inflationism)

  The following document is intended to serve as the working charter for the collaborative inquiry into the nature of truth. It distinguishes between premises accepted by both parties, specific points of divergence, and proposed test cases designed to adjudicate those divergences.

  ### I. Agreed Premises
  *Both parties endorse the following claims as the common foundation for this collaboration.*

  1.  **The Centrality of the Equivalence Schema:** For any sentence *p* in ordinary, non-pathological discourse, the instance of the Equivalence Schema ("*p*" is true iff *p*) is accepted as true and knowable *a priori*. Neither party seeks to revise the logic of ordinary discourse to invalidate these instances.
  2.  **Univocality:** Truth is a single phenomenon. We reject alethic pluralism; the word "true" does not denote distinct properties when applied to moral, mathematical, or empirical propositions.
  3.  **Conceptual Utility:** The concept of truth is indispensable for human cognition and communication. Neither party advocates for the elimination of the truth predicate from our language.
  4.  **Verbal Artifacts:** We acknowledge that a portion of the historical literature on truth (particularly regarding the formulation of "correspondence" in early 20th-century realism) involved purely verbal disputes regarding the use of terms like "fact" or "reality" that do not bear on the core metaphysical or logical disagreement.

  ### II. Table of Disagreements
  *The following points isolate the specific loci of contention. Formulations are designed to be acceptable to the respective proponent of each view.*

  | Topic | Deflationist Formulation | Inflationist Formulation |
  | :--- | :--- | :--- |
  | **1. Metaphysical Status** | Truth is a **logical device** that facilitates generalization and endorsement. To ask for the "nature" of truth beyond the Equivalence Schema is a category mistake. | Truth is a **substantive property** that represents a relation (e.g., correspondence, representation) between thought/language and the world. Its nature demands metaphysical explanation. |
  | **2. Explanatory Role** | The success of true belief is explained entirely by the **specific content** of the belief (e.g., believing *water is wet* leads to success because water is wet). The property of truth adds no explanatory power. | The success of true belief is explained, in part, by the **property of truth itself**. There is a generalizable causal/nomic connection between possessing the property of truth and successful action. |
  | **3. Normativity** | The norm "Believe only what is true" is **derivative**. It follows logically from the fact that to believe *p* is to believe *p* is true. There is no separate normative target. | The norm "Believe only what is true" is **constitutive**. Truth is an intrinsic aim or standard of correctness for belief that exists independently of the Equivalence Schema. |

  ### III. The Cruxes: Tests and Predictions
  *For each crux, we identify a concrete case or argument that bears on the disagreement. Each party records their prediction regarding how their theory best accounts for the data.*

  **Crux 1: The Success of Action**
  *   **Case:** An agent navigates a forest using a map. The agent arrives at a destination successfully.
  *   **The Test:** Does the explanation of the success require reference to the *truth* of the map, or only to the *accuracy of the specific symbols*?
  *   **Deflationist Prediction:** The explanation is exhausted by citing the specific isomorphisms between map symbols and terrain features (content). Invoking "truth" as a separate causal factor is redundant.
  *   **Inflationist Prediction:** The explanation requires citing the *relation of correspondence* holding between the map and the terrain. Without this substantive relation (truth), the specific isomorphisms would not systematically yield success across different maps.
  *   **Adjudication Criterion:** Which explanation better handles cases of *systematic* success across varying contents (e.g., why *any* accurate map works, regardless of specific content)?

  **Crux 2: The Liar Paradox**
  *   **Case:** The sentence *L*: "*L* is not true."
  *   **The Test:** Does the paradox arise from the logical structure of the truth predicate (Deflationism) or from a failure of the substantive relation to obtain (Inflationism)?
  *   **Deflationist Prediction:** The paradox is a problem for the logic of the schema itself. It can be resolved via logical revision (e.g., contextuality, paraconsistency) without positing a substantive nature of truth. Deflationism handles this no worse than inflationism.
  *   **Inflationist Prediction:** The paradox demonstrates the insufficiency of the bare schema. It requires a substantive theory to explain *why* the sentence fails to express a proposition (e.g., it fails to correspond to a fact). The schema alone cannot restrict its own application.
  *   **Adjudication Criterion:** Which theory offers a solution to the Revenge Liar that preserves the most instances of the Equivalence Schema without ad hoc restrictions?

  **Crux 3: The Normativity of Belief (Moore's Paradox)**
  *   **Case:** The assertion "It is raining, but I do not believe it is raining."
  *   **The Test:** Is the absurdity of this assertion due to a violation of a constitutive aim of belief (Inflationism) or a pragmatic contradiction in assertion norms derived from the schema (Deflationism)?
  *   **Deflationist Prediction:** The absurdity is pragmatic. Since asserting *p* implies representing *p* as true (via the schema), asserting *p* while denying belief in *p* is a communicative contradiction, not a metaphysical one.
  *   **Inflationist Prediction:** The absurdity reveals that belief is *constitutively* aimed at a substantive property. One cannot coherently hold a belief while acknowledging it lacks the property of truth, regardless of assertion norms.
  *   **Adjudication Criterion:** Does the explanation hold for *silent thought* (where assertion norms are absent)? If the absurdity persists in silent thought, this favors the Inflationist constitutive account.

  ***

  ### Appendix: Rapporteur's Confidence Note

  **Confidence Levels:**
  *   **Section I (Agreed Premises):** High Confidence. These formulations are standard enough that neither party should feel their core view is compromised. The qualifier "ordinary, non-pathological discourse" in Premise 1 is necessary to secure the Inflationist's signature without forcing the Deflationist to concede that the Schema has logical exceptions (they can view pathological cases as outside "ordinary discourse").
  *   **Section II (Disagreements):** Medium Confidence. The risk here is subtle loading. I have attempted to use "logical device" vs. "substantive property" as these are the standard self-descriptions. However, the Deflationist may object to the word "property" even in the Inflationist column if it implies realism. I have mitigated this by keeping the columns distinct.
  *   **Section III (Cruxes):** Medium-Low Confidence. These tests are philosophically contested. The "Adjudication Criteria" are my own synthesis and may be viewed as favoring one side's methodology (e.g., the Inflationist may reject the Deflationist's preference for logical revision in Crux 2).

  **The Weakest Point:**
  I am least sure about **Section II, Row 2 (Explanatory Role)**.
  *Reasoning:* The Deflationist insists that truth *cannot* explain anything because it is not a causal property. The Inflationist insists it *does* explain. The phrasing "adds no explanatory power" vs. "explained... by the property" is the standard divide, but the Deflationist might argue that the Inflationist's formulation is unintelligible (a category error), while the Inflationist might argue the Deflationist's formulation ignores the generalization problem. If the Deflationist refuses to sign the table because they think the Inflationist's position is literally meaningless (rather than just false), the collaboration stalls.

  **Diagnosis of Verbal vs. Substantive Disagreement:**
  I suspect **Section II, Row 1 (Metaphysical Status)** contains a significant verbal component.
  *Justification:* The Deflationist often denies truth is a "property" at all, or calls it a "logical property." The Inflationist calls it a "robust property." Often, when pressed, the Deflationist admits truth is a "property" in the thin sense of being expressible by a predicate, and the Inflationist admits truth is not a "physical" property like mass. The disagreement often reduces to whether the word "property" carries metaphysical weight. If both parties agree that truth is a feature of propositions captured by the Schema, but disagree only on whether that feature warrants the label "substantive property," the dispute may be terminological. However, this verbal disagreement tracks the substantive disagreement in Row 2 (Explanatory Role). If truth is merely logical, it cannot explain success. Therefore, while the *label* "property" may be verbal, the *consequences* of that label are substantive. I recommend the collaborators focus on Row 2 to bypass the semantics of Row 1.
