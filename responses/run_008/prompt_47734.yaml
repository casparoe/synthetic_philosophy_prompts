answer: |-
  Here is a principle constructed to match your verdicts, followed by an analysis of its tensions, application to your new cases, and an explicit confession of its weak points.

  ### The Principle of Authorized Substance and Non-Exploitative Baseline

  **Consent is valid if and only if:**
  1.  **Authorization of Substance:** The consenter understands and authorizes the **physical nature** and **material risk profile** of the act, unless the deception regarding these factors is itself the authorized object of the interaction.
  2.  **Integrity of Baseline:** The agreement is not secured by a **wrongful threat** (a proposal to make the consenter worse off than their moral baseline) or by the **exploitation of essential dependency** where the proposer holds a position of fiduciary or structural power.
  3.  **Proportional Capacity:** The consenter possesses decision-making capacity **proportional to the irreversibility and severity** of the consequences.

  ---

  ### Clause Breakdown and Forcing Cases

  **Clause 1: Authorization of Substance**
  *   **The Rule:** Lies invalidate consent only if they change *what is being done* or *the risks inherent to it*. Lies about *who is doing it* (collateral traits) or lies that are *part of the game* do not invalidate consent.
  *   **Forcing Cases:**
      *   **Surgeon/Risk & Stealthing:** These force the requirement that *material risk* and *physical nature* must be truthful. Hiding complication risks or removing a condom changes the physical act and its danger profile.
      *   **Divorce Status & Transplant Concealment:** These force the exception for *collateral attributes*. Lying about marital status or hiding drinking history does not change the physical nature of the sex or the transplant surgery itself; it changes the *reasons* for agreeing, which generally preserves consent validity.
      *   **The Prank:** This forces the "authorized object" exception. Here, deception is the *substance* of the agreed activity. Because the friend authorized "being deceived," the deception does not vitiate consent.

  **Clause 2: Integrity of Baseline**
  *   **The Rule:** Coercion invalidates consent if the proposer creates the pressure wrongfully. This distinguishes between *threats* (worsening your baseline) and *warnings* (nature of reality), and between *fair offers* and *exploitative leverage* within power imbalances.
  *   **Forcing Cases:**
      *   **Surgeon/Amputation:** This forces the distinction between a *threat* and a *warning*. The surgeon is describing the natural consequence of the disease, not proposing to inflict harm. The baseline (health) is threatened by nature, not the agent.
      *   **Landlord:** This forces the "wrongful threat" clause. The tenant's baseline is "housing security contingent on rent/conduct." Sex is not a valid condition for lease renewal. The landlord proposes to worsen the tenant's baseline (eviction) wrongfully to extract sex.
      *   **Boss:** This forces the "exploitation of essential dependency" clause. While a promotion is a "benefit," withholding it to demand unpaid/extra labor exploits the economic dependency inherent in the employment relationship. It treats a discretionary benefit as a lever to override contractual or reasonable boundaries.

  **Clause 3: Proportional Capacity**
  *   **The Rule:** Competence is not a binary switch but a sliding scale tied to the stakes.
  *   **Forcing Cases:**
      *   **Drunk Tattoo vs. Drunk Drinks:** These force the *proportionality* requirement. The capacity needed to order a beer (reversible, low risk) is lower than for a tattoo (permanent, high risk).
      *   **Dementia/Pacemaker:** This forces the recognition of *local lucency*. Global incompetence does not negate specific capacity for bodily integrity decisions if the patient is lucid in that moment.

  ---

  ### Confronting the Tensions

  **1. The Deception Tension (Why the Prank works)**
  Your instinct was that the lie must corrupt the decision. The principle refines this: the lie must corrupt the *authorization of the act's substance*.
  *   In the **Condom** and **Surgery** cases, the lie hides the *reality of the physical interaction*. You agreed to Sex A, you got Sex B. You agreed to Safe Surgery, you got Risky Surgery.
  *   In the **Divorce** case, you agreed to Sex with Person X. You got Sex with Person X. The lie changes your *motivation*, not the *act*.
  *   In the **Prank**, you agreed to "Be Deceived." The deception is the *act*. Therefore, the substance is authorized. The principle resolves this by shifting focus from "was there a lie?" to "was the *nature* of the interaction authorized?"

  **2. The Coercion Tension (Threats vs. Offers)**
  The difficulty is distinguishing a coercive threat from a hard offer without calling all market transactions coercive.
  *   **The Baseline Test:** We look at the *moral baseline*, not the status quo.
  *   **Landlord:** The baseline is "lease renewal based on tenancy rules." Threatening eviction for sex violates this baseline. It is a *wrongful threat*.
  *   **Boss:** The baseline is "employment duties." Demanding weekend work for a *consideration* (promotion) that should be merit-based exploits the power dynamic. It is *structural coercion*.
  *   **Market Transactions:** If I sell you a car for $10,000, I am not threatening to make you worse off than your moral baseline; I am offering to improve it. I have no duty to give you the car. The Landlord and Boss have duties (housing security, fair labor evaluation) that make their conditionalizing wrongful.

  ---

  ### Unaccommodated Verdicts

  I must be honest: **The Boss Case** is the strain point.
  Under a strict libertarian interpretation of Clause 2, the Boss's offer ("Work weekend for promotion consideration") is an *offer*, not a threat, because the employee has no right to the promotion. My principle accommodates your "Invalid" verdict only by importing a specific view of labor relations (that employers have a duty not to leverage discretionary benefits to extract extra-contractual labor). If you hold a view that employment is purely at-will contract, this principle might feel like it overreaches. I have prioritized your Labor Organizer roommate's influence here, but be aware that this clause is philosophically contested.

  Additionally, the **Transplant Case** is borderline. If the drinking history significantly increases the risk of transplant failure, one could argue it *does* change the risk profile (Clause 1). I have classified it as "collateral" to match your verdict, but a strict medical risk interpretation could flip it.

  ---

  ### Application to New Cases

  **Case 1: Psychology Experiment (Buried Risks in Jargon)**
  *   **Verdict:** **Invalid Consent.**
  *   **Reasoning:** This violates **Clause 1 (Authorization of Substance)**. While the risks are "truthfully listed," burying them in impenetrable jargon is functionally equivalent to deception regarding the *material risk profile*. If a reasonable person cannot understand the risk, they cannot authorize the substance of the act. It is fraud by obfuscation.

  **Case 2: Refugee (Exploitative Wage vs. Destitution)**
  *   **Verdict:** **Valid Consent (but morally tragic).**
  *   **Reasoning:** This is the critical test. Under **Clause 2**, we must ask: Did the employer *create* the destitution? If no, the employer is offering to *improve* the refugee's baseline (from destitution to wage), not threatening to worsen it. Unlike the Landlord (who controls the housing) or the Boss (who controls the career), the factory owner is usually not the agent responsible for the refugee's lack of alternatives.
  *   **The Tension:** I suspect your intuition here differs from the Landlord case because in the Landlord case, the coercer *creates* the leverage (housing insecurity) to extract the sex. In the Refugee case, the leverage (destitution) is *background structural injustice*. My principle registers this distinction: the Landlord case is *agentic coercion*; the Refugee case is *structural coercion*. My principle validates the contract in the Refugee case because it focuses on the *proposer's* wrongful actions, not the background conditions. If you feel the Refugee consent should be *invalid*, my principle fails you here.

  ---

  ### Weak Points and Failure Modes

  I am flagging three specific areas where this reasoning is fragile. If you find these arguments compelling, you should discard or modify the principle.

  **1. The "Moral Baseline" Problem (Coercion)**
  *   **The Weakness:** Defining the "moral baseline" is notoriously difficult. In the Boss case, I assumed the baseline includes "fair consideration for promotion." A capitalist might argue the baseline is "at-will employment," making the boss's action a valid offer.
  *   **The Defeater:** If you believe that *any* significant power imbalance (like employer/employee) makes "offers" coercive because the subordinate cannot truly refuse, then Clause 2 is too weak. You would need a principle that says "Consent is invalid if significant economic dependency exists," which would invalidate most employment contracts.

  **2. The "Materiality" of Identity (Deception)**
  *   **The Weakness:** I classified "Divorce Status" as collateral. But for many people, marital status is a dealbreaker equivalent to condom use.
  *   **The Defeater:** If you believe consent is about *subjective motivation* rather than *objective act description*, then the Divorce lie *should* invalidate consent. A principle based on "Subjective Dealbreakers" would invalidate consent in the Divorce case but might also invalidate the Prank (if the friend didn't *really* understand the prank). My principle prioritizes objective physical nature over subjective motivation to preserve the Prank verdict. If you value subjective motivation more, Clause 1 fails.

  **3. Structural vs. Agentic Coercion (The Refugee Problem)**
  *   **The Weakness:** As noted in the new cases, my principle lets the Factory Owner off the hook because they didn't *cause* the refugee's destitution.
  *   **The Defeater:** If you believe that taking advantage of desperate circumstances is *in itself* a wrongful threat (regardless of who caused the desperation), then Clause 2 is too narrow. You would need a "Principle of Fair Background Conditions" which states that consent is invalid if the alternatives are below a threshold of human dignity, regardless of the proposer's actions. Adopting that would likely invalidate the Refugee wage *and* potentially the Landlord case for different reasons, but it would also make almost all low-wage labor contracts invalid.

  **Summary Recommendation:**
  Use this principle as a diagnostic tool, not a moral absolute. It works best for interpersonal and professional boundaries (Sex, Medicine, Housing). It strains under macro-economic injustice (Refugees) and contested labor rights (Boss). If you find the Refugee verdict (Valid) unacceptable, you must abandon the "Agentic Threat" requirement in Clause 2 and accept that background injustice can vitiate consent, which will have radical implications for how you view market transactions generally.
