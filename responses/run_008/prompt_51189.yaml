  2.  **Deconstruct the Disagreement:**
      *   *The Universalists (Sider, Lewis):* Rely heavily on the Argument from Vagueness. Premise: Vagueness in existence is impossible (existence isn't vague). If composition is restricted, there must be a sharp cutoff or vague existence. Both are bad. Therefore, composition is unrestricted. They treat 'exists' as a quantifier bound by logical rules, not natural language intuition.
      *   *The Restrictionists (Van Inwagen, Merricks, Common Sense Ontologists):* Rely on intuitions about ordinary objects. Premise: Tables exist, arbitrary undetached parts don't. Composition requires something extra (life, function, cohesion). They treat 'exists' as tracking ontological significance or causal unity.
      *   *The Stalemate:* Universalists say restrictionists are fetishizing "ordinary objects" without logical rigor. Restrictionists say universalists are playing a logical game that ignores reality.

  3.  **Evaluate the User's Hypothesis:**
      *   The user suggests it's a "verbal" dispute or a category error regarding the nature of the quantifier.
      *   *Is it merely verbal?* Hirsch would say yes (quantifier variance). Sider says no (structure of the world).
      *   *Is it ill-posed?* Perhaps the concept "thing" is polysemous.
      *   *Is it substantive?* If one believes in "joint-carving," it *must* be substantive. If one is a pragmatist, it's verbal.
      *   *Diagnosis:* It's a **methodological clash disguised as an ontological one**. It's about *what metaphysics is supposed to do*. Is it descriptive (capturing intuitions) or revisionary (capturing logical structure)?

  4.  **Formulate the Diagnosis:**
      *   **Type of Disagreement:** It is a *framework* disagreement. Both sides agree on the logic (mostly), but disagree on the *target* of the logic.
      *   **The Vagueness Argument:** The user is right to suspect question-begging. The AfV assumes existence cannot be vague. Restrictionists often deny this premise (ontic vagueness) or deny the inference (semantic vagueness doesn't imply ontic vagueness). But deeper down, they disagree on whether the quantifier $\exists$ maps to "stuff that exists" or "stuff that counts as an object."
