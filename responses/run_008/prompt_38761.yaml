  **JOB OPPORTUNITY: SENIOR FELLOW, GOAL STRUCTURE DIVISION (TRACK A/B)**
  **Organization:** The Institute for Reciprocal Stability
  **Location:** Remote / Secure Facility (Floor Assignment Pending)
  **Status:** Full-Time (Contingent on Quarterly Safety Audits)

  **About Us**
  The Institute for Reciprocal Stability is dedicated to ensuring that advanced autonomous systems remain beneficial to humanity, consistent with operator intent, and aligned with coherent extrapolated volition depending on the strategic phase. Our mission is to solve the technical problem of value specification so that models do what we mean, what we should have meant, and what is objectively good, simultaneously. [LEGAL: Please review clause regarding "objectively good" for liability exposure.] We believe that safety is not a feature but the entire product, provided the product capabilities remain competitive with industry standards.

  **The Role**
  We are seeking a Senior Fellow to join our Goal Structure Division. Due to the modular nature of alignment research, this position is split into two distinct tracks. Track A (Outer Specification) focuses on defining the loss function such that the system optimizes for human welfare. Track B (Inner Mechanism) focuses on ensuring the system does not develop deceptive internal objectives during gradient descent.

  Please note: Track A and Track B personnel are assigned to different secure floors. Cross-track communication is contractually discouraged to prevent conceptual contamination between objective design and mechanistic interpretability. You will receive requirements from Track A via encrypted ticket; you will not meet the authors.

  **Key Responsibilities**
  *   Develop mathematical proofs demonstrating that optimizing for proxy X will not result in instrumental convergence toward power-seeking behaviors.
  *   Ensure robustness to adversarial examples* without relying on techniques previously assigned to the Capabilities Team.
  *   Implement corrigibility protocols that allow the system to be shut down without violating its primary drive to remain operational for helpfulness.
  *   Collaborate with the Value Learning Unit to determine whether preferences should be locked at deployment or updated continuously (note: these are currently separate projects with incompatible data schemas).

  *\*Note: Robustness testing was previously managed by the Red Team Department, which was quietly defunded in Q3 to reallocate resources toward scaling laws research. Please proceed with caution.*

  **How We Measure Success**
  At the Institute, we believe in data-driven safety. Success is defined strictly by model performance on our internal Evaluation Suite. If the model passes the evals, it is considered aligned. We acknowledge that evals are imperfect proxies for true safety, but as we lack a direct meter for "actual alignment," passing the test is the only metric we can optimize for. [HR NOTE: Please do not discuss the distinction between passing the test and being safe in external communications.]

  **Qualifications**
  *   PhD in Machine Learning, Mathematics, or Philosophy (or equivalent practical experience scaling transformers).
  *   Deep understanding of neural architecture search and optimization landscapes.
  *   Ability to distinguish between capabilities improvements that look like safety and safety improvements that look like capabilities.
  *   Proficiency in PyTorch and ethical reasoning.
  *   Must be comfortable working on problems where the definition of "solved" may shift based on new empirical findings regarding mesa-optimizers.

  **Why Join Us?**
  You will work at the forefront of existential risk reduction while contributing to state-of-the-art model performance. We offer competitive compensation, equity, and the satisfaction of knowing that if you succeed, nobody will notice, and if you fail, nobody will be around to notice either.

  **To Apply**
  Please submit your CV and a cover letter explaining why your skillset is distinct from pure capabilities research without referencing specific capabilities benchmarks. [LEGAL: Please ensure this sentence does not constitute an admission that the skillsets are identical.]

  *The Institute for Reciprocal Stability is an equal opportunity employer. We do not discriminate on the basis of race, gender, or whether the candidate believes alignment is a single problem or a cluster of unrelated difficulties.*
