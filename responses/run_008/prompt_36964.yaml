answer: |-
  # Diagnostic Instrument: The Truth-Telling Intuition Quiz

  **Instructions:** Read each vignette carefully. Select the option that best matches your moral judgment of the *speaker's action*. Do not worry about legal liability; focus on moral permissibility or blameworthiness. There are no "correct" answers; the goal is to map your intuitive commitments.

  ---

  ### Part I: The Core Distinctions

  **1. The Aggressor at the Door (Type: Evasion vs. Lie)**
  You are hiding a political dissident in your home during a regime crackdown. A secret police officer knocks and asks, "Is the dissident inside?"
  *   **A.** You say, "No, he is not here." (You believe this is false.)
  *   **B.** You say, "I have not seen him today." (You saw him yesterday; this is technically true but implies he isn't there now.)
  *   **C.** You refuse to answer and block the door.

  **2. The Confidential Project (Type: Equivocation)**
  A competitor asks if your team is working on "Project X." You are working on Project X, but only on a minor sub-component that doesn't affect the competitor.
  *   **A.** You say, "We are not working on Project X." (You consider the sub-component negligible.)
  *   **B.** You say, "We are not working on Project X *in the way you mean*." (True, but you know they will ignore the qualifier.)
  *   **C.** You say, "I cannot discuss our current projects."

  **3. The Press Conference (Type: Paltering)**
  A journalist asks a Senator, "Did you meet with the lobbyist to discuss the bill?" The Senator did meet them, but discussed golf.
  *   **A.** The Senator says, "No."
  *   **B.** The Senator says, "I have never discussed the bill with that lobbyist." (True, but implies no meeting occurred.)
  *   **C.** The Senator says, "I meet with many constituents."

  **4. The Tax Audit (Type: False Presupposition)**
  An auditor asks, "When did you stop hiding income in offshore accounts?" You have never hidden income.
  *   **A.** You say, "I haven't stopped." (Accepts the false presupposition to avoid admitting you never started, implying guilt.)
  *   **B.** You say, "Your question is based on a false premise." (True, but risks antagonizing the auditor.)
  *   **C.** You say, "I do not hide income." (True, direct.)

  ### Part II: Context and Consequence

  **5. The "Free" Trial (Type: Technical Truth in Contracts)**
  A software company advertises a "Free 30-Day Trial." The sign-up requires a credit card, and the cancellation policy is buried in 40 pages of text. Most users are charged automatically.
  *   **A.** This is deceptive advertising, morally equivalent to lying.
  *   **B.** This is aggressive marketing, but distinct from lying because the terms are technically accessible.
  *   **C.** This is permissible; customers are responsible for reading terms.

  **6. The Reference Letter (Type: Conversational Implicature)**
  You are writing a reference for a student who is a terrible philosopher but has excellent handwriting. The job is for a philosophy department.
  *   **A.** You write, "He has excellent handwriting." (True, implies he is bad at philosophy.)
  *   **B.** You write, "He is a great philosopher." (False.)
  *   **C.** You decline to write the letter.

  **7. The Terminal Diagnosis (Type: Cooperative Deception)**
  A dying patient asks, "Will I recover?" You know they will not. You want to spare them despair in their final weeks.
  *   **A.** You say, "Yes, you will recover." (Lie.)
  *   **B.** You say, "We are hoping for a miracle." (True, but creates a false expectation of high probability.)
  *   **C.** You say, "The outlook is very poor." (Truthful.)

  **8. The Unjust Official (Type: No Right to Truth)**
  An official from an unjust regime asks you where you were last night. You were at a prohibited prayer meeting.
  *   **A.** You may lie to them because they have forfeited their right to the truth.
  *   **B.** You may mislead them, but lying remains intrinsically wrong regardless of their status.
  *   **C.** You must tell the truth, as lying corrupts your own integrity.

  ### Part III: Structural and Institutional Factors

  **9. The Verifiability Test (Type: Checkability)**
  Consider two employees giving reports to a boss who cannot easily verify details.
  *   **Case 1:** Employee A says, "I finished the task on Tuesday." (False; it was Wednesday. This is easily checkable via logs.)
  *   **Case 2:** Employee B says, "I worked hard on the task." (True; but implies it is done. "Hard work" is uncheckable.)
  *   **A.** Case 1 is morally worse (it is a direct lie).
  *   **B.** Case 2 is morally worse (it blocks accountability and inspection).
  *   **C.** They are equally wrong (both intend to create a false belief).

  **10. The Market Norm (Type: Institutionalized Misleading)**
  In a specific used-car market, *everyone* knows that sellers describe cars as "running well" only to mean "the engine starts." Buyers know this and adjust their offers accordingly.
  *   **A.** It is still wrong for a seller to say "running well" if the transmission is broken, because the intent to deceive remains.
  *   **B.** It is permissible, because the shared understanding neutralizes the deception; no one is actually misled about the norms.
  *   **C.** It is wrong, because it degrades the language even if buyers expect it.

  ---

  # Scoring Key and Philosophical Profiles

  Do not simply count letters. Instead, look for the **pattern** of your choices across the three sections. Compare your responses to the five profiles below. Most people will match one profile closely, though some may find themselves between two.

  ### 1. The Strict Definitionist (SD)
  *   **Core Commitment:** Lying is defined strictly as asserting what one believes to be false. The specific moral wrong of lying is a violation of the duty to assert only what is true. Merely misleading (saying something true that implies a falsehood) is not lying, and while it may be rude or unkind, it lacks the specific moral gravity of a lie.
  *   **Typical Pattern:**
      *   **V1, V2, V3, V8:** Prefer the technically true option (B) over the lie (A).
      *   **V7:** Prefer the misleading hope (B) over the lie (A).
      *   **V9:** Choose **A** (The lie is worse than the uncheckable spin).
  *   **Rationale:** You prioritize the literal truth-value of the assertion. If the statement is true, the specific wrong of "lying" has not occurred, even if deception was intended.

  ### 2. The Kantian Manipulation View (KM)
  *   **Core Commitment:** Lying is uniquely wrong, *but* misleading can also be morally prohibited. The fundamental wrong is not just the false assertion, but the **manipulation of the hearer's rational agency**. If you trick someone into drawing a false conclusion, you are using them as a mere means, just as you would be if you lied.
  *   **Typical Pattern:**
      *   **V1, V8:** Might accept misleading (B) to save a life (conflict of duties), but generally uneasy about it.
      *   **V2, V3, V6:** View the technically true options (B) as morally suspect or equivalent to lying.
      *   **V7:** Likely Choose **C** (Truthful) or view B as manipulative.
      *   **V9:** Choose **C** or **B** (The manipulation matters more than the literal falsehood).
  *   **Rationale:** You distinguish lying from misleading definitionally, but you do not grant misleading a "moral free pass." Both can violate autonomy.

  ### 3. The Deception-Parity View (DP)
  *   **Core Commitment:** The moral wrong-making property is the **intention to cause a false belief**. Whether this is achieved via a false assertion (lie) or a true implication (misleading) is morally irrelevant. They are on a par.
  *   **Typical Pattern:**
      *   **V1–V4, V6–V8:** Treat options A and B as **equally wrong** (or equally permissible depending on the stakes).
      *   **V9:** Choose **C** (Equally wrong).
      *   **V10:** Choose **A** (Still wrong because the intent to deceive exists).
  *   **Rationale:** You focus on the *outcome* in the hearer's mind (false belief) and the speaker's *intent*. The linguistic mechanism is a distraction.

  ### 4. The Checkability View (CH)
  *   **Core Commitment:** The primary value of truth-telling is maintaining a social institution where speakers can be **held accountable**. Lies are assertions that can be checked and proven false. Misleading implicatures are often designed to be uncheckable. Therefore, uncheckable misleading can be *worse* than checkable lying because it corrodes the ability to contest claims.
  *   **Typical Pattern:**
      *   **V9:** Choose **B** (The uncheckable spin is worse than the checkable lie).
      *   **V5:** Choose **A** (Burying terms blocks accountability).
      *   **V2, V3:** View equivocation/paltering as highly blameworthy, potentially more than simple lies.
  *   **Rationale:** You are less concerned with the speaker's internal state and more concerned with the structural reliability of communication.

  ### 5. The Pragmatic-Hypothesis View (PH)
  *   **Core Commitment:** The moral difference between lying and misleading is a **defeasible heuristic**. It works in ordinary conversation but erodes under scale, competition, or institutionalization. If everyone expects technical evasion (as in advertising or law), the hearer-protective rationale collapses, and the act becomes permissible (or at least, the blame shifts to the system).
  *   **Typical Pattern:**
      *   **V1–V4 (Personal):** Treat misleading as better than lying (SD pattern).
      *   **V5, V10 (Institutional):** Choose **B** (Permissible if norms are known) or argue the wrongness dissolves.
      *   **V9:** Likely Choose **A** (In personal contexts, lies are worse).
  *   **Rationale:** You believe context changes the moral rules. In personal relationships, truth is paramount. In adversarial institutions (markets, law), "caveat auditor" (let the hearer beware) applies.

  ---

  # Diagnostic Limitations & Unoccupied Regions

  ### 1. Overlap: Kantian (KM) vs. Deception-Parity (DP)
  This instrument cannot reliably separate the Kantian Manipulation View from the Deception-Parity View. Both views condemn misleading in cases like V2, V3, and V6.
  *   **Why:** Both views agree that intending to deceive is the core problem. The KM view grounds this in *autonomy*; the DP view grounds it in *false belief*. In concrete vignettes, these usually yield the same verdict. To separate them, one would need a case where deception occurs *without* violating autonomy (e.g., benign paternalism), which is philosophically contentious.

  ### 2. Overlap: Strict Definitionist (SD) vs. Pragmatic (PH)
  In personal cases (V1–V4), SD and PH look identical (both prefer technical truth). They only separate in institutional cases (V5, V10). If you skipped or answered ambiguously on V5 and V10, your result may conflate SD and PH.

  ### 3. Unoccupied Region: The "Accountability Absolutist"
  There is a region of the answer space corresponding to someone who chooses **SD** in personal cases (V1–V4: Lying is worse than misleading) but **CH** in institutional cases (V9: Uncheckable misleading is worse than checkable lying).
  *   **Status:** **Unexplored/Unstable.**
  *   **Why:** This combination implies that the definition of the wrong changes based on the setting (from "assertion of falsehood" to "blocking accountability"). While not logically incoherent, it lacks a unified theoretical foundation in the literature. It suggests a fragmented moral theory where the nature of truth-telling shifts between interpersonal and systemic contexts without a bridging principle.

  ### 4. Unoccupied Region: The "Benevolent Liar" who condemns Misleading
  There is a region corresponding to someone who chooses **Lie (A)** in V7 (Doctor) but condemns **Misleading (B)** in V2 or V3.
  *   **Status:** **Incoherent.**
  *   **Why:** This would imply that intending to cause a false belief for *benefit* (V7) is permissible, but intending to cause a false belief for *neutrality/self-protection* (V2/V3) is wrong. While possible as a personal quirk, no major ethical theory argues that misleading is *worse* than lying in non-aggressive contexts while simultaneously endorsing lying for benevolence. Usually, if you permit benevolent lying, you permit benevolent misleading *a fortiori*.

  ### 5. Separation Success: DP vs. PH
  Vignette 10 is designed to separate these.
  *   **DP** must condemn the practice in V10 because the *intent* to deceive remains, regardless of buyer expectation.
  *   **PH** permits (or excuses) V10 because the *normative expectation* of truth has shifted.
  *   If you felt a strong tension between V10-A and V10-B, you are standing directly on the fault line between these two theories.
