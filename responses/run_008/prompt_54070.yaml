answer: |-
  Your skepticism is well-founded. The pop-history account you read captures a famous "origin story" of modern economics, but it simplifies the history, conflates methodology with ontology, and makes a category error regarding philosophy.

  Here is a piece-by-piece breakdown of that claim, separating the historical fact from the ideological overstatement, and evaluating what it means for your inclination about interpersonal comparisons.

  ### 1. The Claim: "Robbins proved comparing one person's utility with another's is literally meaningless."

  **Verdict:** *Half-true, but philosophically dated.*

  *   **What Robbins actually argued:** In his 1932 *Essay on the Nature and Significance of Economic Science*, Lionel Robbins argued that economics should be a **positive science** (describing what *is*), not a **normative one** (prescribing what *ought* to be).
  *   **The "Meaningless" Charge:** Robbins was influenced by the Logical Positivists of the Vienna Circle. They believed that for a statement to be cognitively meaningful, it must be empirically verifiable. Since I cannot get inside your head to measure your satisfaction, Robbins argued that saying "Person A gains more utility than Person B loses" is not a scientific fact; it is a value judgment.
  *   **The Correction:** Robbins didn't prove IUCs are *metaphysically* impossible (i.e., that they don't exist). He proved they are **non-falsifiable**. You cannot run an experiment to disprove them. Therefore, he concluded, they have no place in *scientific* economics.
  *   **Historian's View:** A historian of economic thought would agree Robbins made this argument and that it was influential. However, they would note that "meaningless" is a strong word tied to a specific (and now largely abandoned) philosophy of science. Most philosophers today would call IUCs "normative" or "intersubjective," not meaningless.

  ### 2. The Claim: "Economics had to give up cardinal utility and go ordinal."

  **Verdict:** *Mostly true for demand theory, false for risk and modern welfare.*

  *   **The Shift:** Before the 1930s, economists often spoke of "utils" as if they were measurable units (cardinal). Robbins, along with Hicks and Allen, championed **ordinal utility**: we only need to know that a consumer prefers Bundle A to Bundle B, not by *how much*. This was sufficient to build the modern theory of demand.
  *   **The Comeback:** However, economics did not stay purely ordinal.
      1.  **Von Neumann-Morgenstern (1944):** In game theory and decision-making under risk, economists reintroduced a form of cardinal utility. If you prefer a 50% chance of \$100 over a guaranteed \$40, we can mathematically derive a cardinal utility function for you.
      2.  **Behavioral Economics:** Modern empirical work often assumes people have measurable subjective well-being (happiness surveys, neural imaging) which effectively treats utility as cardinal again.
  *   **Historian's View:** The pop history freezes economics in 1935. While ordinalism dominates micro theory, cardinalism never fully left the building.

  ### 3. The Claim: "Welfare economics and cost-benefit analysis rest on foundations that aren't scientific."

  **Verdict:** *True, but economists accept this as a feature, not a bug.*

  *   **The Problem:** If you can't compare utilities across people, how do you decide if a policy is "good"? (e.g., A tax on the rich to fund healthcare for the poor).
  *   **The Workaround:** Economists developed the **Kaldor-Hicks criterion**. A policy is an improvement if the winners *could* theoretically compensate the losers and still be better off. Notice the word *could*. They don't actually have to compensate them.
  *   **Cost-Benefit Analysis (CBA):** To do CBA, economists convert utility into **Willingness-To-Pay (WTP)**. They assume that if you are willing to pay \$50 for a park, and I am willing to pay \$10, your gain is five times mine.
  *   **The "Unscientific" Foundation:** This rests on a hidden value judgment: **that a dollar represents equal utility for everyone.** We know this is false (diminishing marginal utility of income: \$100 means more to a starving person than a billionaire).
  *   **Historian's View:** Economists know this. They generally defend CBA not as "moral truth" but as a tool for **efficiency**. They explicitly separate "efficiency" (maximizing the size of the pie) from "equity" (how the pie is sliced), claiming science can only address the former. The pop history book is right that the foundation involves value judgments, but wrong to imply economists don't know it.

  ### 4. The Claim: "Utilitarianism... stands refuted."

  **Verdict:** *False. This is a category error.*

  *   **The Conflation:** Robbins refuted utilitarianism *as a positive scientific theory*. He showed you cannot build a physics-like model of society based on summing utils.
  *   **The Philosophical Reality:** Utilitarianism is a **normative ethical framework**. It claims you *ought* to maximize well-being. The fact that measuring well-being is difficult (or scientifically imprecise) does not refute the moral claim that you should try.
  *   **Analogy:** Robbins effectively said, "You cannot measure 'justice' with a ruler, therefore a theory of justice is unscientific." A philosopher would reply, "Correct, justice isn't a physical object, but that doesn't mean we shouldn't pursue it."
  *   **Historian's View:** Utilitarian philosophy evolved. Philosophers like R.M. Hare (preference utilitarianism) and economists-turned-philosophers like **Amartya Sen** explicitly challenged the Robbinsian ban on interpersonal comparisons. Sen argued that refusing to make IUCs leads to paralysis in the face of famine or inequality. He won the Nobel Prize largely for reintroducing ethical considerations into economics.

  ### 5. Your Inclination: "Interpersonal comparisons are fine, at least in moral contexts."

  **Verdict:** *You are right, and here is where the economics side gets tricky.*

  **Where your inclination holds up:**
  *   **Moral Context:** You are correct. In ethics, law, and daily life, we make IUCs constantly. We imprison murderers because we judge the victim's loss of life outweighs the murderer's loss of liberty. We tax progressively because we judge \$10,000 hurts a poor person more than a rich one. If IUCs were truly "meaningless," the entire justice and tax systems would be incoherent.
  *   **Philosophy:** Modern moral philosophy accepts IUCs as necessary premises. They are justified through empathy, reasoning, and "reflective equilibrium," not empirical measurement.

  **Where your inclination meets economic resistance:**
  *   **The "Money Metric" Problem:** In economics, the specific problem isn't comparing *happiness*, it's comparing *value* via money. Because money has diminishing marginal utility, CBA is biased toward the rich. A rich person's WTP is higher simply because they have more money, not because they care more.
  *   **The Technocratic Defense:** Economists resist IUCs not because they think they are impossible, but because they are **contested**. If an economist says "Policy X is good," they want to base it on data. If they say "Policy X is good because the poor benefit more than the rich lose," a politician can say, "I disagree with that weighting." By sticking to "efficiency" (Pareto/Kaldor-Hicks), economists try to claim a neutral, technocratic ground.

  ### Summary: Does the "Refutes Utilitarianism" conclusion survive?

  **No.** Once you correct the history, the conclusion collapses.

  1.  **Robbins' Limit was Methodological, not Ontological:** He said IUCs aren't *science*, not that they aren't *real* or *moral*.
  2.  **Economics Moved On:** Welfare economics now frequently uses "distributional weights" (admitting \$1 is worth more to the poor) and subjective well-being data.
  3.  **Philosophy Doesn't Care:** Ethics does not require empirical verifiability. Utilitarianism survives as a moral imperative, even if the "calculus" is imperfect.

  **The Bottom Line:**
  The pop history book sold you a "Whig history" of economics: the idea that economics became more rigorous by purging itself of "unscientific" ethics.
  *   **The Truth:** Economics purged IUCs to protect its status as a "hard science," but it had to sneak them back in to do actual policy analysis (CBA).
  *   **Your Stance:** You are on solid ground. Interpersonal comparisons are unavoidable in policy and ethics. The economist's refusal to make them explicitly is often a way of hiding value judgments (e.g., treating a dollar as equal for everyone) rather than eliminating them. Amartya Sen's critique is the standard counter-argument here: **refusing to make interpersonal comparisons is not neutrality; it is a silent acceptance of the status quo distribution of wealth.**
