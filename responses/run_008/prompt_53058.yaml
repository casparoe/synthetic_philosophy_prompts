      *   *Leibniz vs. Newton:* The framing is mostly correct *operationally*, but ontologically different. DS engineers are pragmatists (instrumentalists). Physicists are arguing about *what exists*. DS assumes the network exists.

  6.  **Developing the Residue Report:**
      *   *Good Fits:* Causal order (Lamport) vs. Relationism. Wall clock sync (NTP) vs. Substantivalism. The Hole Argument vs. Log Index Permutation.
      *   *Distortions:* Space vs. Network topology. In DS, the network is physical (wires, latency). In GR, spacetime *is* the gravity.
