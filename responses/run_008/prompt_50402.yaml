answer: |-
  This is a fantastic breakdown of Maya's moral intuition. You've basically handed me a dataset for a mini-thesis on distributive justice. The fact that she name-dropped the "basketball player example" is the smoking gun: she is almost certainly operating within a **Libertarian Entitlement framework**, specifically Robert Nozick's, but with a specific modification regarding information.

  Here is the breakdown of the rules she seems to be running, how they apply to the Bitcoin miner, and the specific case you should prepare to break the tie next time.

  ### 1. The Candidate Rules
  Based on her six verdicts, here are the three strongest candidates for her underlying principle:

  **Candidate A: Strict Nozickian Entitlement (The "History" Rule)**
  *   **The Principle:** A distribution is just if it arises from a just initial acquisition and a chain of voluntary transfers. Force (burglar) and fraud (con man) break the chain. Luck (lottery, heir) is irrelevant to justice as long as the transfer itself wasn't coerced.
  *   **Fit:** Explains Striker, Heir, Lottery, Burglar, Con Man perfectly.
  *   **Tension:** Nozickians are often okay with insider trading (it's just using information you have), but Maya calls it *unjust*. This suggests she isn't a *strict* Nozickian.

  **Candidate B: Symmetric Information Proceduralism (The "Fair Deal" Rule)**
  *   **The Principle:** Transfers are only just if all parties have access to material information. If one party knows something the other doesn't that would change the deal (Con Man, Insider Trader), the consent is invalid.
  *   **Fit:** Explains why she rejects the Con Man and Insider Trader specifically (her reasoning was explicitly about what the sellers *would have done if they knew*).
  *   **Tension:** This is hard to square with the Heir or Lottery. The lottery losers didn't know the numbers; the heir didn't know the dad's business secrets. But she accepts those because the *rules of the game* were public, even if the outcomes weren't known.

  **Candidate C: The "Open Opportunity" Rule (The "Nobody Was Locked Out" Rule)**
  *   **The Principle:** Wealth is just if the opportunity to get it was theoretically available to everyone under known rules, and no one was actively deceived or forced.
  *   **Fit:** Explains everything. Striker (anyone can try out), Lottery (anyone can buy a ticket), Heir (laws of inheritance are public), Insider Trader (Unjust because *only* insiders had the access), Burglar (Illegal/Force).
  *   **Tension:** Distinguishing between " Insider Info" (Unjust) and "Early Adoption/Research" (Just) is the tricky part.

  ### 2. The Prediction: The Bitcoin Miner
  **Verdict:** Maya will say the billions are **JUST**.

  **Why?**
  Here is how her logic likely processes the miner:
  1.  **Acquisition:** He didn't steal the coins (Burglar) or trick someone into giving them to him (Con Man). He "mined" them. In 2010, the protocol was open source. The "rules of the game" were public.
  2.  **Victimhood:** This is the key difference between the Miner and the Insider Trader. In the Insider Trader case, Maya argued the *sellers* were harmed because they lacked info. In the Bitcoin case, who was the victim? The network? The protocol automatically issued the coins. There was no counter-party who signed over value under false pretenses.
  3.  **Luck vs. Process:** She already accepted the Lottery Winner. She winced, but accepted that "everyone knew the odds." With Bitcoin, everyone *could* have known the odds (it was public), even if few did. The miner got lucky (brute luck that the value exploded), but she already ruled that brute luck is acceptable (Lottery, Heir) provided the *process* wasn't rigged.
  4.  **Nozick Connection:** The Wilt Chamberlain example (the basketball player) is about how voluntary choices by many individuals can lead to massive inequality that is still just. The Bitcoin miner is a digital version of Wilt: millions of people voluntarily adopted the network, driving up the value of the coins he legitimately acquired early on.

  **Her likely phrasing:** "He didn't lie to anyone. The code was open. Anyone could have run a laptop in 2010. He took a risk on a hobby that paid off. That's just luck, like the lottery."

  ### 3. The "Splitter" Case (Your Ammo for Round 2)
  You want a case that forces **Candidate A (Strict Voluntary Exchange)** to clash with **Candidate B (Symmetric Information)**.

  Maya rejected the Insider Trader because the sellers lacked information. But in business, "I know more than you" is often considered skill, not fraud. You need to test where she draws the line between "Smart Research" and "Unfair Asymmetry."

  **Propose this case:**
  > "A guy spends months researching property records in a rural town. He finds a plot of land that is zoned for commercial use, but the current owner (an elderly farmer) thinks it's only zoned for agriculture because he never checked. The guy offers to buy the land for $50k (a fair price for a farm). The farmer sells. Next month, the buyer gets a permit to build a mall and sells the land for $5 million. The farmer never would have sold for $50k if he'd checked the zoning logs, which were public but obscure."

  **Why this splits the rules:**
  *   **If she says JUST (Nozick/Entitlement):** She prioritizes voluntary exchange and places the burden of knowledge on the seller. This aligns with her Bitcoin verdict (opportunity was open) and Striker verdict. It implies Insider Trading was unjust only because insider info is *illegal/privileged*, whereas public records are fair game.
  *   **If she says UNJUST (Information Symmetry):** She prioritizes the outcome of the knowledge gap. This aligns with her Insider Trader reasoning ("The seller wouldn't have sold if they knew"). If she says this is unjust, she has to explain why it's different from the Bitcoin miner (who knew more about Bitcoin's potential than the rest of the world).

  **How to play it:**
  If she calls the Bitcoin miner **Just** (as predicted) but the Land Zoning case **Unjust**, she is inconsistent.
  *   *Your counter:* "In both cases, one guy knew the future value and the other didn't. In Bitcoin, the 'zoning logs' were the whitepaper. Why is digging through code fair, but digging through county records unfair?"
  *   *If she calls both Just:* She is a consistent Libertarian. You can then press her on *why* the Insider Trader was different (likely the answer is "fiduciary duty" or "illegal access" vs "public access").
  *   *If she calls both Unjust:* She's more of an Egalitarian than she thinks, and you can press her on why the Lottery or Heir cases are okay.

  **Summary for your notes:**
  1.  **Prediction:** Just. (Reason: No victim, open protocol, accepted brute luck).
  2.  **Philosopher:** Robert Nozick (*Anarchy, State, and Utopia*), specifically the Wilt Chamberlain argument.
  3.  **Next Move:** The "Zoning Loophole" case. It tests whether she hates *ignorance* or hates *deception*.

  Good luck. If she starts talking about "fiduciary duty" regarding the Insider Trader, she's trying to patch the hole in her theory—pounce on that distinction.
