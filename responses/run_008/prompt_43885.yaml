prompt: |-
  I'm on a faculty senate committee and last term we had this meeting where the group somehow voted itself into a corner, and it sent me down a rabbit hole about how committees decide things. Anyway I'm supposed to write up "where I stand" for a reading group before we get into the judgment aggregation literature, and I want a sanity check first, because I suspect I'm holding views that fight each other and I can't see where. Heres the package:

  1. The only fair way for a committee to decide anything is majority vote, taken question by question — every proposition on the agenda gets put and voted on, one person one vote. No supermajority rules for some propositions but not others, no chair declaring things settled without a vote.

  2. The real reason majority rule is good, though, is epistemic: if each member is more likely right than wrong and their votes are independant, the majority is very likely right. Wisdom of crowds. I find this way more persuasive than the fairness story.

  3. That said, at bottom legitimacy is procedural: even when the majority gets it wrong, the decision still binds. That's the whole point of voting instead of just asking the expert.

  4. Committees should deliberate before voting. Discussion makes the group smarter than a poll would be — putting a question to a vote that nobody has talked through is basically malpractice.

  5. Whatever else, the committee's output has to be internally consistent. If the recorded votes taken together imply both that the new policy applies to grad students and that it doesn't, something has gone badly wrong. The group owes the public one coherent verdict, not a pile of separately counted votes.

  6. The agenda belongs to the members. Any coherent set of propositions can be put to a vote, and the voting rule can't be designed in advance to keep certain questions off the table.

  7. On the thing that started all this (the three-judge setup: a majority says there was a breach, a majority says there were damages, but a majority says not liable, where liability needs both): my gut says the panel is really committed to liable, and the not-liable outcome is an artifact of voting on the wrong question. The premise votes are the ones that count.

  Also a nagging worry, which might just be me being dense: every individual on my committee is rational — nobody personally voted for an inconsistent set of propositions. So how can the group come out inconsistent? It feels like the whole shouldn't be dumber than its parts, but I gather something goes wrong there and I can't see which step fails.

  Go through all of this and tell me which parts are genuinely in tension, which only look like it, and rank them by severity — for each real one, say what would have to give and what it costs me to give it up. Don't be polite about it, I'd rather find out now than infront of the reading group.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Faculty senate committee member.
      *   **Context:** Preparing for a reading group on judgment aggregation literature.
      *   **Task:** Sanity check a set of 7 stated views + 1 nagging worry about committee decision-making.
      *   **Goal:** Identify tensions/contradictions, rank them by severity, explain what must give and the cost of giving it up.
      *   **Tone:** Direct, critical, not polite ("Don't be polite about it").
      *   **Key Subject:** Judgment Aggregation Theory (specifically the Discursive Dilemma/Doctrinal Paradox).

  2.  **Analyze the 7 Views + Worry:**

      *   *View 1 (Procedure):* Majority vote, question-by-question, one person one vote. No supermajorities, no chair fiat. (Unanimity of procedure).
      *   *View 2 (Justification):* Epistemic justification (Condorcet Jury Theorem). Majority is likely *right*.
      *   *View 3 (Legitimacy):* Procedural legitimacy. Binds even if wrong.
      *   *View 4 (Deliberation):* Must deliberate before voting. Improves epistemic quality.
      *   *View 5 (Consistency):* Output must be logically consistent. (Collective Rationality).
      *   *View 6 (Agenda Control):* Members control agenda. Any coherent set of propositions can be voted on. (Universal Domain).
      *   *View 7 (The Paradox):* The "Three-Judge" case (Doctrinal Paradox). Gut says vote on premises (liable), not conclusion (not liable). Premise-based procedure.
      *   *Worry:* How can rational individuals produce an irrational group? (The core of Judgment Aggregation).

  3.  **Identify Tensions (The "Impossible Theorems"):**
      *   The core tension is List & Pettit's "Impossibility Theorem in Judgment Aggregation."
      *   The theorem states you cannot simultaneously satisfy:
          1.  Universal Domain (View 6).
          2.  Collective Rationality/Consistency (View 5).
          3.  Anonymity/Neutrality (implied in View 1's "one person one vote" and "question by question").
          4.  Systematicity/Independence (implied in View 1's "question by question" voting on *every* proposition).
      *   *Specific Conflict:* View 1 (vote on every proposition independently) vs. View 5 (consistency). If you vote on $P$, $Q$, and $P \land Q$ independently by majority, you can get $P$ (Yes), $Q$ (Yes), $P \land Q$ (No). This violates View 5.
      *   *Specific Conflict:* View 1 (vote on everything) vs. View 7 (Premise-based). View 7 suggests *not* voting on the conclusion directly, but deriving it. View 1 says "every proposition on the agenda gets put and voted on."
      *   *Specific Conflict:* View 2 (Epistemic/Independence) vs. View 4 (Deliberation). Condorcet Jury Theorem requires *independent* votes. Deliberation creates correlation/dependence. If everyone listens to the same charismatic expert, errors become correlated, destroying the "Wisdom of Crowds" math.
      *   *Specific Conflict:* View 6 (Agenda Control) vs. View 5 (Consistency). If members can put *any* coherent set on the table, they can put up a set known to generate paradoxes under majority rule.

  4.  **Drafting the Critique (Iterative Process):**

      *   *Severity 1 (The Fatal Clash):* View 1 vs. View 5 vs. View 7.
          *   View 1 says vote on *every* proposition.
          *   View 5 says the result must be consistent.
          *   View 7 admits that voting on the conclusion (liability) yields a different result than voting on premises (breach + damages).
          *   *The Problem:* You cannot do View 1 (vote on everything independently) and guarantee View 5 (consistency) when logic connects the propositions. This is the Discursive Dilemma.
          *   *Resolution:* You have to abandon "vote on every proposition" (View 1) or abandon "Consistency" (View 5). View 7 suggests abandoning View 1 (use premise-based procedure).

      *   *Severity 2 (The Epistemic/Deliberation Clash):* View 2 vs. View 4.
          *   View 2 relies on Condorcet Jury Theorem (CJT). CJT *requires* statistical independence.
          *   View 4 requires Deliberation. Deliberation *destroys* statistical independence (shared information, persuasion, groupthink).
          *   *Resolution:* You can't have the CJT math *and* robust deliberation. You have to choose: is it a poll of independent minds or a deliberative body?

      *   *Severity 3 (Agenda vs. Consistency):* View 6 vs. View 5.
          *   If members control the agenda completely, they can force a vote on a set of propositions that guarantees inconsistency under majority rule.
          *   *Resolution:* Agenda setting must be constrained to avoid known paradoxes, or the voting rule must change (not simple majority on all).

      *   *Addressing the Worry:* Explain *how* rationality fails at the group level (composition fallacy). Individual rationality $\neq$ Collective rationality under aggregation rules.

  5.  **Refining the Tone:**
      *   The user said "Don't be polite."
      *   Need to be sharp. "You are walking into a buzzsaw." "These are mathematically incompatible."
      *   Avoid hedging. State the contradictions clearly.

  6.  **Structuring the Response:**
      *   **Executive Summary:** You have stumbled onto the Judgment Aggregation Impossibility Theorem without knowing the name.
      *   **The Fatal Contradiction (Severity: Critical):** View 1 vs. View 5 vs. View 7. (The Discursive Dilemma).
      *   **The Epistemic Contradiction (Severity: High):** View 2 vs. View 4. (Independence vs. Deliberation).
      *   **The Agenda Contradiction (Severity: Medium):** View 6 vs. View 5.
      *   **Addressing the Worry:** Explain the logic of the failure.
      *   **Recommendations:** What to drop to survive the reading group.

  7.  **Self-Correction/Nuance Check:**
      *   *View 3 (Legitimacy):* Does this conflict? Not really, it's a normative fallback. It survives the paradox (the inconsistent outcome is still binding, just stupid).
      *   *View 7:* The user leans towards premise-based. This actually solves the consistency issue but violates View 1 (voting on the conclusion). I need to highlight that View 7 *requires* violating View 1.
      *   *View 2:* The user likes the epistemic argument. I need to point out that deliberation (View 4) undermines the math of View 2. This is a subtle but important theoretical tension.

  8.  **Final Polish:** Ensure the distinction between the "Doctrinal Paradox" (View 7 scenario) and the "Discursive Dilemma" (the generalization) is clear, though for this purpose, they function similarly. Ensure the List & Pettit reference is implicit or explicit (explicit is better for a reading group prep).

      *(Self-Correction during drafting)*: Wait, View 1 says "every proposition on the agenda gets put and voted on." View 7 says "The premise votes are the ones that count." If the conclusion is on the agenda, View 1 says vote on it. View 7 says derive it. That's a direct clash.

      *(Refining the Epistemic point)*: Condorcet requires independence. Deliberation creates correlation. If correlation is high, majority rule becomes *less* reliable than a single expert. This is a strong point to make.

      *(Refining the Worry)*: The "Whole dumber than parts" is exactly the Impossibility Theorem. It's not a bug; it's a feature of aggregation.

  9.  **Final Output Generation** (matching the thought process above).
answer: |-
  You have independently rediscovered the **List-Pettit Impossibility Theorem** (2002), and you are walking into the reading group with a set of commitments that are mathematically incompatible. You asked for no politeness, so here it is: You cannot hold all seven of these views simultaneously. At least three of them must be sacrificed, or your committee is destined to produce nonsense.

  Here is the breakdown of the tensions, ranked by severity.

  ### 1. The Fatal Contradiction (Severity: Critical)
  **The Clash:** View 1 (Vote on everything) vs. View 5 (Consistency) vs. View 7 (Premise-based intuition).

  *   **The Conflict:** View 1 demands that *every* proposition on the agenda be voted on independently by majority rule. View 5 demands the output be logically consistent. View 7 describes the **Doctrinal Paradox**: A majority says Yes to Premise A, a majority says Yes to Premise B, but a majority says No to Conclusion (A & B).
  *   **The Problem:** If you follow View 1 (vote on A, vote on B, vote on A&B), you *will* generate inconsistencies like the one in View 7. If you follow View 5 (force consistency), you *cannot* follow View 1 (you must skip voting on the conclusion or the premises).
  *   **The Math:** This is the core of judgment aggregation theory. Under simple majority rule, collective rationality (consistency) is not guaranteed even if every individual is rational.
  *   **What Must Give:** You must abandon **View 1**. You cannot vote on every proposition independently if those propositions are logically connected.
  *   **The Cost:** You lose the "pure democracy" aesthetic of View 1. You have to adopt a **Premise-Based Procedure** (aligning with your View 7) or a **Conclusion-Based Procedure**. If you choose Premise-Based (vote on A and B, derive C), you are overruling the majority on the conclusion C. If you choose Conclusion-Based (vote on C, ignore A and B), you are ignoring the majority will on the reasons. Both feel undemocratic compared to View 1.

  ### 2. The Epistemic/Deliberation Clash (Severity: High)
  **The Clash:** View 2 (Epistemic/Independence) vs. View 4 (Deliberation).

  *   **The Conflict:** Your justification for View 2 is the **Condorcet Jury Theorem**. This theorem relies on a strict mathematical assumption: voter errors must be **statistically independent**. View 4 demands **Deliberation**.
  *   **The Problem:** Deliberation *destroys* independence. If members talk, they share information, persuade each other, or fall prey to common biases. If everyone hears the same charismatic expert during deliberation, their errors become correlated. Once errors are correlated, the "Wisdom of Crowds" math collapses. A deliberating crowd can be *less* accurate than a single random expert.
  *   **What Must Give:** You have to weaken **View 2** or **View 4**.
  *   **The Cost:**
      *   If you keep View 4 (Deliberation is essential), you cannot claim View 2 (Majority is epistemically superior *because* of the math). You have to argue deliberation improves quality for *other* reasons (e.g., refining preferences, not just tracking truth).
      *   If you keep View 2 (Epistemic superiority), you must treat deliberation with extreme suspicion, perhaps limiting it to prevent correlation, which makes you look like an autocrat in a faculty senate.

  ### 3. The Agenda Control Clash (Severity: Medium)
  **The Clash:** View 6 (Open Agenda) vs. View 5 (Consistency).

  *   **The Conflict:** View 6 says members can put *any* coherent set of propositions on the table. View 5 says the output must be consistent.
  *   **The Problem:** If members can introduce any propositions, they can introduce a "poison pill" set of propositions known to trigger the Discursive Dilemma under majority rule. If the agenda is truly open (Universal Domain), inconsistency is inevitable for some profiles of judgment.
  *   **What Must Give:** You must restrict **View 6**.
  *   **The Cost:** Agenda-setting power must be constrained. Someone (a chair, a subcommittee) must vet the logical structure of the agenda *before* the vote to ensure a consistent outcome is possible under your chosen voting rule. This looks like gatekeeping, which conflicts with the spirit of View 1 and 6.

  ### 4. Addressing Your "Nagging Worry"
  **The Worry:** *Every individual is rational. How can the group be irrational?*

  *   **The Answer:** This is not a bug; it is the central finding of the literature you are about to read. Rationality is not preserved under aggregation.
  *   **The Mechanism:** It fails at the step where you move from *individual* logic to *collective* counting.
      *   Person 1: Yes on A, Yes on B, Yes on (A&B).
      *   Person 2: Yes on A, No on B, No on (A&B).
      *   Person 3: No on A, Yes on B, No on (A&B).
      *   **Individual Check:** Everyone is consistent.
      *   **Majority Vote:** Yes on A (2-1), Yes on B (2-1), **No on (A&B)** (2-1).
      *   **Collective Check:** The group says A is true, B is true, but (A&B) is false. The group is logically incoherent.
  *   **The Takeaway:** The "whole" is dumber than the parts because the voting rule (majority on each proposition) ignores the *logical constraints* linking the propositions. It treats "A" and "A&B" as unrelated items like "Apples" and "Oranges," when they are actually "Apples" and "Fruit."

  ### Summary of Recommendations for Your Reading Group

  To survive the session without contradicting yourself, you need to prune your package. Here is the most defensible position:

  1.  **Drop View 1.** Admit that you cannot vote on every proposition independently if they are logically connected.
  2.  **Modify View 2.** Acknowledge that deliberation (View 4) compromises the independence required for the Condorcet math, so the epistemic argument is heuristic, not mathematical.
  3.  **Keep View 7.** This is your escape hatch. Adopt a **Premise-Based Procedure**. Vote on the premises, derive the conclusion. This satisfies View 5 (Consistency) but requires you to admit that the majority vote on the *conclusion* might be overruled by the logic of the premises.
  4.  **Keep View 3.** Procedural legitimacy is your safety net. When the math breaks, the procedure binds.

  **The Hard Truth:** You want the fairness of View 1, the smarts of View 2, and the coherence of View 5. The literature says: **Pick two.** If you pick Fairness (1) and Coherence (5), you need a dictator (violates 1). If you pick Fairness (1) and Smarts (2), you get Inconsistency (violates 5). If you pick Smarts (2) and Coherence (5), you need to restrict the agenda or the voting rule (violates 1 and 6).

  Your View 7 suggests you intuitively prefer **Coherence (5)** and **Smarts (2)** (via premises), which means you must explicitly reject **View 1**. Go in there and say: *"I used to think we should vote on everything. I now see that forces inconsistency. I am now a premise-based aggregator."* That will start a better conversation than trying to defend the undefendable.
