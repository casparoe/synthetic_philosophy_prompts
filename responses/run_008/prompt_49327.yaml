answer: |-
  This is a fantastic set of questions. You have put your finger on the exact fissure where criminal law's pragmatic doctrine cracks under the weight of metaphysical scrutiny. The law of duress is a philosophical hybrid that tries to walk two paths at once: the path of *causal determinism* (my will was broken) and the path of *normative choice* (I had no fair opportunity to choose).

  Let's unpack this layer by layer, starting with the theoretical tension, moving to the Frankfurt twist, and ending with the murder exception.

  ### 1. The Tension: Alternative Possibilities vs. Sourcehood

  You are absolutely right to spot the contradiction. The doctrine speaks the language of **Sourcehood** ("overborne will," "coerced," "not their own act") but operates on the logic of **Alternative Possibilities (AP)** ("no reasonable escape," "firmness of the reasonable person").

  If we take the "overborne will" language literally, we are in the realm of hard excusing conditions. The agent is like a tool in the hands of the coercer; the action originates in the threatener, not the defendant. In a pure Sourcehood view, the existence of an escape route shouldn't matter. If a gunman puts a gun to your head and pulls the trigger using your finger as the lever, it doesn't matter if there was a window open nearby; *you* didn't shoot.

  However, the law rejects this literalism. The "reasonable escape" requirement reveals that the law actually presupposes a **Normative Competence** theory of responsibility (often associated with H.L.A. Hart). On this view, responsibility isn't about whether you were causally determined; it's about whether you had a **fair opportunity to comply with the law**.

  *   **The Synthesis:** The "overborne will" talk is rhetorical folklore; the "escape route" test is the operational philosophy. The law assumes you *always* have the physical capacity to resist (you always have AP in a metaphysical sense), but it excuses you when the *cost* of exercising that capacity becomes unreasonably high.
  *   **The Theory:** This is not a claim that you *couldn't* do otherwise. It is a claim that you *shouldn't be blamed* for not doing otherwise. The doctrine presupposes that responsibility is about **expectations**, not metaphysics. We expect citizens to be brave, but only up to a point. When the threat exceeds the "steady courage" we can normatively demand, we withdraw blame.

  So, to answer your first question: The doctrine is inconsistent on the surface but consistent in its pragmatism. It uses Sourcehood language to express empathy but uses AP tests to maintain a boundary of accountability. It presupposes that we are free enough to be blamed, unless the situation makes blame unfair.

  ### 2. The Frankfurt Twist

  Now, let's apply the Frankfurt challenge. In a standard Frankfurt case, an agent chooses to do $X$ on their own, but a counterfactual intervener (Black) would have forced $X$ if the agent hesitated. The agent is responsible despite lacking AP.

  **The Duress Frankfurt Scenario:**
  You are threatened: "Rob the bank or I kill you." You intend to rob the bank to save your life. However, unbeknownst to you, the threatener has a backup sniper who would have shot you and physically manipulated your body to rob the bank if you had refused.

  **On Current Doctrine:**
  The excuse might actually **collapse**, but not for the reason you might think. Current duress law requires the threat to be the *cause* of the action (a "but-for" cause in the actual sequence). If the backup sniper ensures the result *no matter what*, the defense might argue that the threat wasn't the operative cause—the inevitability was. However, most courts would likely still grant the defense if the defendant *acted because of the threat* in the actual sequence. The "no escape" requirement is satisfied (you couldn't escape the sniper), so the AP condition is met negatively.

  **Taking Frankfurt Seriously:**
  If courts truly internalized the Frankfurt lesson—that **AP is irrelevant to responsibility**—the architecture of duress would have to change radically.

  1.  **Abolish the "Escape Route" Test:** Currently, courts spend immense energy asking, "Could the defendant have gone to the police? Could they have fled?" If Frankfurt is right, this is a distraction. If the defendant's actual sequence of reasoning was driven by coercive threat, they lack the appropriate *sourcehood* for blame, regardless of whether a magical escape route existed.
  2.  **Shift to Actual Sequence Motivation:** The inquiry would shift entirely to the defendant's psychology. "Did the threat drive this action?" If yes, excuse. If the defendant would have robbed the bank anyway (even without the threat), then no excuse.
  3.  **The Paradox:** Here is the rub. If we accept Frankfurt, we admit that lacking AP doesn't automatically excuse. (In Frankfurt cases, the agent is responsible). So, if we remove the AP requirement from duress, we can't just say "He couldn't do otherwise, so he's innocent." We would have to argue that the *type of determination* matters. Being determined by a **threat** excuses; being determined by a **neural intervener** (in Frankfurt's original case) might not.

  **The Real Shift:** If courts took Frankfurt seriously, they would stop treating duress as a "lack of choice" defense and start treating it as a "corruption of motivation" defense. The focus would move from the *external circumstances* (were there exits?) to the *internal governance* (was the law still a viable guide for action?). This would likely make the defense *harder* to win in some ways (focusing on the agent's character) but *easier* in others (ignoring technical escape routes).

  ### 3. The Murder Exception

  Finally, the carve-out: Duress is generally no defense to murder (e.g., *R v Howe* in the UK, and many US jurisdictions). The logic is: "You ought to die rather than kill an innocent."

  **What this Presupposes:**
  This exception blows the "overborne will" theory out of the water. If the will is truly overborne—if the defendant is literally a puppet of the coercer—it makes no moral difference whether the puppet cuts a purse or cuts a throat. The mechanism of compulsion is the same.

  By carving out murder, the law admits that duress is not a **metaphysical negation of agency**, but a **moral concession**.

  *   **Inconsistency:** It is inconsistent with the "overborne will" language. You cannot say "His will was broken" for theft but "His will was intact" for murder, given the same gun to the head.
  *   **Consistency:** It is highly consistent with the **Normative Competence/Fair Opportunity** theory. The law is saying: "We acknowledge you were under terrible pressure. We acknowledge your choice was constrained. But the duty to preserve innocent life is so absolute that we cannot lower the standard of 'reasonable firmness' to include killing."

  **The Deep Implication:**
  The murder exception reveals the true nature of the duress defense. It is not a finding of fact about the universe (i.e., "The defendant was not free"). It is a **political grant of mercy**.

  The state is essentially saying: *"Technically, you are responsible. You chose to kill. But because we are humane, we will usually excuse those who break the law under threat. However, our mercy has a limit, and that limit is the life of an innocent third party."*

  This aligns with the "Fair Opportunity" view. We can reasonably expect a citizen to sacrifice their own life rather than take an innocent's. We cannot reasonably expect them to sacrifice their life rather than steal a car. The "overborne will" language is just the softening rhetoric used to deliver a hard normative judgment.

  ### Summary

  To tie your threads together:

  1.  **Theory:** The doctrine presupposes a **Normative Competence** theory (Fair Opportunity), not a metaphysical one. It uses "overborne will" as a metaphor for "unfair to blame," not "causally determined."
  2.  **Frankfurt:** If courts took Frankfurt seriously, they would abandon the "reasonable escape" test (AP) and focus solely on whether the threat was the actual motivator (Sourcehood). This would purify the doctrine but remove its safety valves (the objective "reasonable person" standard).
  3.  **Murder:** The murder exception proves that duress is a **concession**, not a **right**. It confirms that the law is not interested in the metaphysics of free will, but in the hierarchy of moral duties. We excuse weakness, but we do not excuse the violation of the highest duty, even under threat.

  The law of duress is not a coherent philosophical treatise; it is a negotiated settlement between the demand for public safety and the acknowledgment of human frailty. The contradictions you see are the seams where that negotiation shows through.
