  1.  **Analyze the Request:**
      *   **User:** Science and ideas reporter.
      *   **Subject:** Philosopher defending Moral Particularism (no true moral principles, context determines valence).
      *   **Constraint:** She's given the "stump speech" 100 times. Needs hard-pressing questions, not intro stuff.
      *   **Quantity:** 7-9 questions.
      *   **Specific Requirements:**
          1.  Holism of reasons: Need a *worked example* where lying counts *in favor* (not just "weird cases").
          2.  Moral Education/Criticism: Objection that particularism destroys shared criticism + follow-up on compatibility with actual child-rearing.
          3.  Defensible Generalism (Ceteris Paribus): Is the dispute substantive or just semantic about "principles"?
          4.  Shallow Generalizations: Do "lying tends to be wrong" do all the work, making the radical thesis idle?
          5.  Format: Each question needs a follow-up keyed to her likely answer.
      *   **Tone:** Professional, probing, prepared (for the reporter's prep).

  2.  **Deconstruct Moral Particularism (Jonathan Dancy et al.):**
      *   *Core claim:* Moral reasons are holistic (context-dependent). A feature that is a reason in one case might be no reason or an opposite reason in another.
      *   *Target:* Moral Generalism (Principles like "Lying is wrong" hold universally, perhaps with ceteris paribus clauses).
      *   *Common Objections:* Moral chaos, inability to learn/teach, inability to criticize, "principles" are just useful heuristics.
      *   *Common Defense:* Principles are crutches; moral maturity is perceiving the specific case; we *do* teach via cases, not rules.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Holism/Valence Switching.*
          *   *Idea:* Don't just ask "Can lying be good?" Ask for a specific structural analysis.
          *   *Draft:* Give me a case where lying is a positive reason.
          *   *Refinement:* Press on the *mechanism*. Is it that the lie itself is good, or that the context negates the badness? Dancy says the *valence* switches.
          *   *Follow-up:* She'll likely give the "murderer at the door" or "white lie" example. I need to push on whether that's actually a *different* feature (e.g., "protecting life") overriding the lie, rather than the lie itself becoming good.

      *   *Requirement 2: Moral Education/Criticism.*
          *   *Idea:* If no rules, how do we scold kids?
          *   *Draft:* How do you teach kids without rules?
          *   *Refinement:* Focus on *shared criticism*. If I say "That was wrong," and you say "Not in this context," do we lose the ability to argue?
          *   *Follow-up:* She'll say we use paradigm cases/exemplars. Push: Does that actually match how parents talk ("We don't hit") vs. ("Look how sad he is")?

      *   *Requirement 3: Defensible Generalism (Ceteris Paribus).*
          *   *Idea:* Generalists say "Lying is wrong, all else equal." Particularists say "No."
          *   *Draft:* Isn't this just semantics?
          *   *Refinement:* Frame it as the "default status" argument. If generalists admit exceptions, what's the actual fight about? Is it about the *existence* of the default or the *explanatory power*?
          *   *Follow-up:* She'll say generalism claims too much stability. Push: If the stability is 99%, why does the 1% matter for the theory?

      *   *Requirement 4: Shallow Generalizations doing the work.*
          *   *Idea:* If you admit lying is usually wrong, why be a radical particularist?
          *   *Draft:* Isn't your theory useless if we still use rules?
          *   *Refinement:* Distinguish between *epistemic* guides (rules of thumb) and *ontological* grounds (what makes it wrong). If the generalization predicts everything, is particularism an idle wheel?
          *   *Follow-up:* She'll say principles mislead in hard cases. Push: Are hard cases the only place your theory lives?

      *   *Filling the remaining 3-5 questions:*
          *   *Need:* Metaphysics/Epistemology, Action Guidance, and the "So What?" factor.
          *   *Q5 (Action Guidance):* If I'm in a crisis, I can't survey the whole context. Don't I need a rule?
          *   *Q6 (The Role of Principles):* Do principles have *any* role, or are they strictly false? (The "clutter" objection).
          *   *Q7 (Moral Progress):* How do we improve morality without principles to aim for? (e.g., civil rights).
          *   *Q8 (The "Default" Challenge):* Pressing on the idea of "default reasons."
          *   *Q9 (Closing/Implication):* What changes in daily life if you're right?

      *   *Review against constraints:*
          *   7-9 questions? Yes.
          *   Specific topics covered? Yes (Holism, Education, Generalism, Shallow Generalizations).
          *   Follow-ups included? Yes.
          *   Tone? Reporter prep (rough but sharp).

  4.  **Refining the Questions (Self-Correction during drafting):**
      *   *Check:* Make sure the "Holism" question isn't just the "lying to the murderer" trope. Dancy uses that, but critics say that's a conflict of duties, not a valence switch. I need to ask for a case where the *lying itself* is the virtue.
      *   *Check:* For the Education question, ensure the follow-up presses on the *language* of parenting.
      *   *Check:* For the Generalism question, ensure the distinction between "principles with exceptions" and "no principles" is clear.
      *   *Check:* Ensure the "Shallow Generalizations" question challenges the *utility* of her view.

  5.  **Final Polish:** Organize clearly with bold headers for the reporter's ease. Add a brief intro note acknowledging the prep nature. (Proceed to generate output).

  6.  **Final Review of the Output:**
