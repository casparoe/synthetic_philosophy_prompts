answer: |-
  Here are 8 hard-pressing questions designed to bypass the stump speech and target the structural weaknesses of particularism. Each includes the likely philosophical dodge and a follow-up to corner it.

  ### 1. The Holism/Valence Switch (The "Lying in Favor" Challenge)
  **Question:** You argue that a feature like "it is a lie" can switch valence and count *in favor* of an action in the right context, not just be overridden by a stronger good. Most people, even generalists, accept that lying to a murderer at the door is permissible. But they say the lie is still *prima facie* wrong, just outweighed. Can you give me a worked example where the deceitfulness itself is the virtue? Not where the *outcome* justifies the cost of the lie, but where the act is better *because* it is deceptive?

  *   **Likely Answer:** She will likely offer a case involving surprise parties, bluffing in poker, or protecting a secret where the deception constitutes the care or the game. She'll argue the "wrong-making" feature is disabled, not outweighed.
  *   **Follow-up:** "In your poker example, isn't the normative work being done by the rule of the game ('bluffing is permitted'), which functions exactly like a principle? If you have to appeal to the institutional context to flip the valence, haven't you just pushed the principle up one level to the rules of the institution?"

  ### 2. The Moral Education Objection (Parenting & Language)
  **Question:** A common objection is that particularism makes moral education impossible because you can't give children rules to follow. You've replied that we teach via paradigm cases and moral perception, not maxims. But watch a parent correct a child: they say 'We don't hit,' not 'Consider the sadness of the other.' If particularism is true, isn't the language of rule-based correction ('Don't lie,' 'Share your toys') systematically misleading the next generation?

  *   **Likely Answer:** She will likely argue that rules are "training wheels" or heuristic summaries of past cases, useful for beginners but discarded by the morally mature. She'll say the *goal* is to get them to see the particular reasons.
  *   **Follow-up:** "If the rules are systematically false in hard cases, and moral maturity is realizing they don't hold, why teach them as truths at all? Why not teach the *method* of contextual weighing from the start? Isn't the 'training wheels' analogy just an admission that generalism is the necessary operational system for human beings, even if particularism is the metaphysical truth?"

  ### 3. The Defensible Generalism Move (Ceteris Paribus)
  **Question:** Many generalists have retreated to "defensible generalism." They argue that reasons have a default polarity (lying is wrong) unless specific conditions intervene. They claim this is compatible with your holism because the 'unless' clause just captures the context. Is your dispute with them substantive, or is it just a fight over whether a claim with a massive 'ceteris paribus' clause deserves to be called a 'principle'?

  *   **Likely Answer:** She will argue that default polarity implies a stability that doesn't exist. She'll say generalists still think the reason *contributes* the same way everywhere, whereas she thinks the contribution itself changes shape.
  *   **Follow-up:** "But if the 'default' holds in 95% of cases, and the 'intervention' is codifiable in the other 5%, what explanatory work is your rejection of the default doing? If I can navigate life perfectly using the default-plus-exception model, isn't your insistence on radical holism theoretically elegant but practically idle?"

  ### 4. The "Shallow Generalization" Challenge
  **Question:** Let's grant that strict, exceptionless principles are dead. But 'shallow' generalizations like 'lying tends to be wrong' seem to do all the predictive and guiding work in our moral lives. If your particularism doesn't deny these tendencies, but just denies they are laws, what is the radical thesis actually achieving? Are you fighting a straw man of rigid legalism that no serious generalist holds anymore?

  *   **Likely Answer:** She will likely say that even "tendencies" mislead us because they suggest a cumulative weight model (add up the pros and cons) rather than a holistic configuration model (the shape of the whole).
  *   **Follow-up:** "Okay, but if the 'shape of the whole' consistently results in the same output as the 'cumulative weight' model, how could we ever know you're right? Is particularism unfalsifiable? If the output is identical in every actual human case, are we arguing about metaphysics or psychology?"

  ### 5. Shared Moral Criticism (The "Talking Past Each Other" Problem)
  **Question:** If reasons are holistic and context-dependent, how do we sustain moral disagreement? If I say 'This war is unjust because it kills civilians' and you say 'In this context, that feature doesn't count against it,' it seems we lack a shared currency to argue. Doesn't particularism fracture the public moral language required for democracy and social critique?

  *   **Likely Answer:** She will argue that we *do* share a language of features, we just disagree on their configuration. She'll say generalism gives a false sense of agreement that breaks down in hard cases anyway.
  *   **Follow-up:** "In a hard case, if I appeal to a principle ('Killing civilians is always wrong') and you appeal to the context ('Not in this configuration'), and there's no higher principle to adjudicate that dispute, doesn't the argument end in a brute clash of intuitions? Isn't that a surrender of rational moral debate?"

  ### 6. Action Guidance in Crisis (The "Time Pressure" Objection)
  **Question:** Particularism sounds plausible for a philosopher in an armchair analyzing a case. But in a crisis—a triage nurse, a soldier, a parent in a fire—there is no time to survey the 'whole context.' Don't agents *need* rigid principles as algorithms for action when moral perception is too slow?

  *   **Likely Answer:** She will likely say that expertise (like a firefighter's intuition) *is* particularist perception trained by experience, not rule-application. Rules slow you down.
  *   **Follow-up:** "But how do you train that expertise without rules? If you tell the trainee 'Just perceive the context,' they'll fail. If you tell them 'Always check for breath first,' you've given them a principle. Isn't the acquisition of moral expertise necessarily generalist, even if the expert's performance feels particularist?"

  ### 7. Moral Progress and Reform
  **Question:** Moral progress often looks like the expansion of a principle. The civil rights movement argued 'Segregation is wrong *in principle*,' not 'Segregation is wrong in this specific configuration.' If there are no principles, how do we account for moral reformers who appeal to universal rights against local contexts?

  *   **Likely Answer:** She will argue that reformers are pointing out that the *relevant features* were being ignored or misidentified in the old context, not that they found a new law.
  *   **Follow-up:** "But the rhetoric of reform is explicitly generalist ('All men are created equal'). If you're right, that rhetoric is metaphysically false. Are you saying the most successful moral movements in history were powered by a false theory? Does particularism require us to rewrite the history of moral progress?"

  ### 8. The Metaphysics of "Enablers" and "Disablers"
  **Question:** You use the machinery of 'enablers' and 'disablers' to explain how a reason can be switched off without being outweighed. But this looks like a complex theoretical structure to save a counter-intuitive claim. Why not accept the simpler ontology: the reason is always there, but sometimes it's silenced by a stronger contrary reason? What does the 'disabler' model explain that the 'overriding' model doesn't?

  *   **Likely Answer:** She will say 'overriding' implies the reason is still present and making a negative contribution that gets cancelled, whereas 'disabling' means it makes *no* contribution. She'll say this matters for moral residue (regret).
  *   **Follow-up:** "Does this distinction actually track with phenomenological experience? When I lie to save a life, do I feel 'no negative weight' or do I feel 'negative weight that was necessary'? If most people feel moral residue, isn't your metaphysical distinction contradicting the moral experience it's supposed to save?"
