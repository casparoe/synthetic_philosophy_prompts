prompt: |-
  hey, I'm taking phil of science this semester and we just covered the pessimistic meta-induction, which honestly kind of wrecked me for a few days. in section the realist counterattack came up and now my friend keeps repeating a version of it at me: science is like a maps app. each update fixes bugs and adds streets, the old versions weren't garbage, just lower resolution — ptolemy's astronomy still let you predict where planets would show up, newton was einstein's low-res update, etc. so he says our current theories are basically guaranteed to be at least approximately true, the phlogiston examples are cherry-picking, realist wins, case closed.

  I want to actually audit the analogy instead of just vibing with it. can you lay out the correspondence table — what plays the role of the map, the streets, the resolution, the update, the end users? then where the mapping breaks. like, is there anything in science that plays the role of the fixed territory, given that we never get to look at the territory directly, only at more maps? what does the analogy smuggle in about accumulation — do mature sciences really just add detail, or do they sometimes redraw the streets entirely (phlogiston → oxygen, caloric → kinetic theory, absolute simultaneity → relativity)? and there's the thing my prof kept hammering: a map can be great for navigation while being totally wrong about what it's a map of, so does predictive usefulness get you all the way to approximate truth, or only empirical adequacy, and does the analogy quietly assume the first?

  then tell me whether my friend's conclusion survives once the disanalogies are on the table. if the map picture breaks exactly where the meta-induction bites, is there a patched version the realist could use (maybe something like "only the street layout carries over, the drawings of buildings don't" — I think that's supposed to be structural realism?), or is there a better analogy altogether that doesn't have the same problems? answer in american english please, and don't pull punches on whether the analogy is doing real work in his argument or just carrying the conclusion on its back.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Philosophy of Science student, just covered Pessimistic Meta-Induction (PMI).
      *   **Situation:** Friend is using a "Science as Maps App" analogy to defend Scientific Realism against PMI.
      *   **Task:** Audit the analogy.
          *   Create a correspondence table (Map, Streets, Resolution, Update, Users, Territory).
          *   Identify where the mapping breaks (fixed territory, accumulation vs. revolution, predictive usefulness vs. truth).
          *   Evaluate the friend's conclusion based on these disanalogies.
          *   Discuss potential patches (Structural Realism) or better analogies.
      *   **Tone/Style:** American English, don't pull punches (critical but constructive), philosophical rigor suitable for an undergrad/grad student.

  2.  **Deconstruct the "Maps App" Analogy:**
      *   *The Claim:* Science progresses like Google Maps. Old versions aren't false, just low-res. Therefore, current theories are approximately true.
      *   *The Goal:* Defeat PMI (the idea that past successful theories were false, so current ones will be too).
      *   *The Weakness:* It assumes a fixed territory and cumulative progress, which PMI specifically challenges.

  3.  **Drafting the Correspondence Table:**
      *   Map $\rightarrow$ Scientific Theory.
      *   Streets/Terrain $\rightarrow$ Unobservable Entities/Structure of the World.
      *   Resolution $\rightarrow$ Precision/Scope of the theory.
      *   Update $\rightarrow$ Theory Change/Revolution.
      *   End Users $\rightarrow$ Scientists/Society.
      *   Fixed Territory $\rightarrow$ Mind-Independent Reality (Noumena).

  4.  **Identifying the Breaking Points (The "Audit"):**
      *   *The Fixed Territory:* In Google Maps, we can check the map against the ground. In science, we *only* have the maps (theories/observations). We can't step outside theory to check reality. This is the Kantian problem.
      *   *Accumulation vs. Overwrite:* Maps add streets. Science often *deletes* entities. Phlogiston isn't low-res oxygen; it's a non-existent substance. Caloric fluid isn't low-res kinetic energy; it's a different ontology.
      *   *Utility vs. Truth:* A map can work for navigation (empirical adequacy) without representing the underlying geology (truth). Ptolemy worked for prediction but got the ontology (earth-centered) wrong.
      *   *The "Low-Res" Trick:* Calling Newton "low-res Einstein" is retrospective. To Newtonians, space *was* absolute. It wasn't an approximation; it was a definition.

  5.  **Evaluating the Friend's Conclusion:**
      *   Does the analogy hold? No, it begs the question. It assumes realism to prove realism.
      *   Does it defeat PMI? No, because PMI targets the *ontological* commitments (the entities), not just the predictive math. The map analogy glosses over the ontological shifts.

  6.  **Exploring Patches (Structural Realism):**
      *   User mentioned: "Only the street layout carries over."
      *   This is *Epistemic Structural Realism* (ESR).
      *   Does it work? It saves the math/relations (the structure) but abandons the nature of the entities (the relata).
      *   Problem: Can you have structure without *something* structuring? (The "structure without objects" objection).
      *   Also, PMI can still bite structure (e.g., specific mathematical structures get dumped too).

  7.  **Considering Better Analogies:**
      *   *Palimpsest:* Writing over writing. Some traces remain, but the text changes meaning.
      *   *Scaffolding:* Used to build, then removed.
      *   *Evolutionary Adaptation:* Fit for environment, not "truth." (Van Fraassen's Constructive Empiricism).
      *   *Toolbox:* Instruments for intervention, not pictures of reality.

  8.  **Synthesizing the Argument (The "Don't Pull Punches" part):**
      *   The friend's analogy is rhetorically powerful but philosophically thin. It smuggles in the conclusion (that there is a stable territory we are converging on).
      *   It conflates *empirical adequacy* (saving the phenomena) with *approximate truth* (getting the ontology right).
      *   PMI is specifically about the *ontology* (phlogiston, ether, humors), not the math. The map analogy focuses on navigation (math/prediction).

  9.  **Refining the Output (American English & Tone):**
      *   Use terms like "begs the question," "smuggles in," "heavy lifting."
      *   Keep it structured but conversational enough for a student.
      *   Ensure the distinction between Realism and Empiricism is clear.

  10. **Final Review against constraints:**
