  *(Refining the "Territory" point)*: This is the biggest philosophical hole. In Google Maps, the territory is accessible. In science, it's not. I need to emphasize this "God's Eye View" problem.

  *(Refining the "Low-Res" point)*: Newton to Einstein isn't just resolution. It's a change in the *geometry* of the territory. Flat vs. Curved. That's not low-res; that's wrong-shape.

