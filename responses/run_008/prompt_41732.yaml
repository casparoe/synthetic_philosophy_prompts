answer: |-
  This is a fantastic prompt. You're right to be suspicious. The "Maps App" analogy is rhetorically seductive because it feels intuitive, but in philosophy of science, intuition is often where the bodies are buried. Your friend is using a model that *presupposes* scientific realism to *prove* scientific realism. That's begging the question, dressed up as a UI update.

  Let's audit this analogy like you asked. We'll break down the correspondence, find the fault lines, and see if your friend's conclusion survives the crash test.

  ### 1. The Correspondence Table

  Here is how your friend's analogy maps onto the philosophy:

  | Maps App Analogy | Philosophy of Science Counterpart |
  | :--- | :--- |
  | **The Map** | The Scientific Theory (e.g., Newtonian Mechanics) |
  | **The Streets/Terrain** | Unobservable Entities & Laws (e.g., Electrons, Gravity, Space-Time) |
  | **The Resolution** | Precision, Scope, and Mathematical Accuracy |
  | **The Update** | Theory Change / Scientific Revolution |
  | **The End Users** | Scientists / Society using the theory to intervene |
  | **The Fixed Territory** | Mind-Independent Reality (The "World-as-it-is") |
  | **Navigation Success** | Empirical Adequacy (Predictive Success) |

  ### 2. Where the Mapping Breaks

  This is where the PMI (Pessimistic Meta-Induction) bites. The analogy works smoothly only if you ignore the history of actual science.

  **A. The "Fixed Territory" Problem (The Kantian Gap)**
  *   **In the Analogy:** Google engineers can verify the map against the territory. They can drive down the street to see if the map is right. There is a feedback loop between the map and the reality.
  *   **In Science:** We *never* get to step outside our theories to check the "territory." We only ever look at reality *through* other maps (instruments, background theories). We can't verify that electrons exist in the way a driver verifies a street exists.
  *   **The Break:** The analogy smuggles in a "God's Eye View." It assumes we have access to the territory to confirm that the maps are converging on it. PMI argues we don't have that access; we only have a stack of old maps that all claimed to be accurate.

  **B. Accumulation vs. Ontological Overwrite**
  *   **In the Analogy:** Updates are cumulative. Version 2.0 has all the streets from Version 1.0, plus new ones. Nothing is deleted; things are just refined.
  *   **In Science:** Theory change is often *subtractive* and *ontological*.
      *   **Phlogiston:** This wasn't a "low-res" version of oxygen. It was a substance with negative mass that flowed *out* of burning objects. Oxygen flows *in*. That's not a resolution upgrade; that's deleting the street and building a roundabout in its place.
      *   **Caloric:** Heat wasn't a "low-res" version of kinetic energy. It was thought to be an invisible fluid. Kinetic theory says it's the motion of particles. The ontology changed from *stuff* to *movement*.
      *   **Absolute Simultaneity:** In Newton's map, "now" is universal. In Einstein's, it's relative. You can't call Newton's version "low-res." It's structurally incompatible.
  *   **The Break:** The analogy suggests convergence (getting closer to the same picture). History suggests discontinuity (changing the picture entirely).

  **C. Navigation vs. Truth (Empirical Adequacy)**
  *   **In the Analogy:** If the map gets you to the restaurant, the map is "true enough."
  *   **In Science:** This is the distinction between **Realism** (the theory is true) and **Empiricism** (the theory saves the phenomena).
  *   **The Break:** Ptolemy's astronomy could predict planetary positions (navigation) for centuries. By your friend's logic, Ptolemy was "approximately true." But the core claim of Ptolemy (Earth is stationary center) was false. A map can be perfectly useful for navigation while being completely wrong about *why* the navigation works. The analogy conflates *utility* with *truth*.

  ### 3. Does Your Friend's Conclusion Survive?

  **Short answer:** No. The analogy is doing no heavy lifting; it's just carrying the conclusion on its back.

  Your friend argues: *"Old versions weren't garbage, just lower resolution... so current theories are basically guaranteed to be at least approximately true."*

  This fails because "low resolution" implies the *same picture* is being sharpened. But the history of science shows us *different pictures* that happen to yield similar numbers in specific contexts.
  *   Newtonian gravity and General Relativity yield similar numbers on Earth.
  *   But they describe fundamentally different mechanisms (Force at a distance vs. Curvature of spacetime).

  If you call Newton "low-res Einstein," you are engaging in **retrospective idealization**. You are looking from the present and saying, "Well, Newton was *kind of* right." But to a Newtonian, absolute space was not an approximation; it was a fact. If Einstein is right, Newton wasn't "low-res"; he was *wrong* about the fabric of the universe, even if his math worked for building bridges.

  The PMI says: "Since past scientists thought their ontology was real (phlogiston, ether), and they were wrong, you probably are too."
  The Map Analogy says: "Since past maps were useful, they were roughly true, so your map is roughly true."
  The analogy fails to address the PMI's core point: **Usefulness does not entail ontological truth.**

  ### 4. Can the Realist Patch the Analogy? (Structural Realism)

  You mentioned: *"Only the street layout carries over, the drawings of buildings don't."*

  This is **Epistemic Structural Realism (ESR)**. It's the most sophisticated realist counterattack to PMI.
  *   **The Claim:** We can't know the *nature* of the entities (the buildings/phlogiston/ether), but we *can* know the *mathematical relations* between them (the street layout/the equations).
  *   **The Patch:** When we moved from Fresnel's ether theory to Maxwell's electromagnetism, we dumped the "ether" (the building), but kept the wave equations (the street layout). So, science preserves *structure*, not *objects*.

  **Does this save the friend's argument?**
  It helps, but it weakens the conclusion.
  1.  **It concedes the PMI point:** It admits we *don't* know if the entities (electrons, quarks) are real. We only know the math works. That's a retreat from full-blown realism.
  2.  **The "Structure without Objects" Problem:** Can you have a street layout without streets? If the relations are real, what is being related? If you say "we don't know," you're bordering on agnosticism.
  3.  **PMI strikes again:** Sometimes even the structure gets dumped. If the geometry of space changed from Euclidean to Riemannian, did the "layout" survive? Maybe not.

  So, your friend can use Structural Realism to save the *math*, but they have to give up the claim that we know what the world is *made of*.

  ### 5. Is There a Better Analogy?

  If the Maps App analogy smuggles in realism, we need one that captures the uncertainty of PMI without falling into total skepticism.

  **Option A: The Palimpsest**
  A palimpsest is a manuscript where old text is scraped off to write new text, but traces of the old remain.
  *   **Pros:** Captures the idea that new theories are written over old ones, sometimes reusing symbols or terms (like "energy" or "mass") but meaning something different. It acknowledges loss and overwriting, not just "updates."
  *   **Cons:** Still implies there's a final text we're aiming for.

  **Option B: Evolutionary Adaptation (Van Fraassen's Favorite)**
  Theories are like species. They survive not because they are "true," but because they are *fit* for the environment (observation).
  *   **Pros:** Explains predictive success without requiring truth. A crab doesn't need to understand fluid dynamics to swim; it just needs to not sink. Science doesn't need to be true to predict; it just needs to be empirically adequate.
  *   **Cons:** Makes science sound accidental. Doesn't explain why science gets *better* at intervention over time.

  **Option C: The Toolbox**
  Theories are tools, not pictures. A hammer isn't "true" or "false"; it's useful for driving nails.
  *   **Pros:** Sidesteps the truth question entirely. Focuses on intervention.
  *   **Cons:** Hard to explain why math is so universally applicable if it's just a local tool.

  ### The Verdict

  Tell your friend this:

  The Maps App analogy is a **realist propaganda piece**. It works only if you assume there is a fixed territory we are converging on. But the Pessimistic Meta-Induction challenges exactly that assumption.

  By calling phlogiston "low-res oxygen," he is rewriting history to make realism look good. Phlogiston wasn't low-res; it was a different category mistake. The analogy conflates **empirical adequacy** (getting the prediction right) with **approximate truth** (getting the ontology right).

  If he wants to defend realism, the Map analogy is too weak. He needs to move to **Structural Realism** (we track the math, not the stuff) or **Entity Realism** (if we can spray electrons with a jet, they're real). But he can't just say "it's like Google Maps" because that assumes the conclusion he's trying to prove. The analogy doesn't defeat the PMI; it just ignores it.

  **Bottom line:** You're right to feel wrecked by PMI. It's the strongest argument against realism. Your friend's analogy is a comfort blanket, not a shield. It feels good, but it won't stop the philosophical bullet.
