      *   *Check:* Did I distinguish "can" clearly? Lewis: "Can" = compossibility with local facts. Novikov: "Can" = physical possibility under global constraints.
      *   *Check:* Is the Lazy Assassin handled fairly? If the assassin is lazy, he fails. Novikov doesn't *need* to intervene if the outcome is already safe. But if the assassin *decides* to try harder, Novikov *must* intervene. Lewis says if he tries harder, he succeeds (but then the future changes/is different). Wait, Lewis is a fixed-timeline guy too (he denies changing the past). So for Lewis, if he tries harder, he *still* fails, but via coincidence.
