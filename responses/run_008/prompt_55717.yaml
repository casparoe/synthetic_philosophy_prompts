      *   *Resolution:* Novikov doesn't necessarily need to micromanage psychology *if* the outcome is already secure. However, if the laziness is the *only* thing preventing the paradox, then yes, the global constraint exerts "pressure" on the initial conditions or the psychology.
      *   *The "Weird" Concession:* Novikov implies a correlation between local intent and global consistency that looks like conspiracy. Lewis avoids this; the laziness is just laziness.
