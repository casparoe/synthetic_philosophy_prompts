          *   *Mechanism of Failure:* Coincidence. Local causal chains interfere. It's not a law of nature preventing it; it's just that the facts of the matter are that you fail.
          *   *Vibe:* Compatibilist free will. You act freely, but the outcome is fixed by the totality of facts.

      *   **Novikov/Fixed Timeline (The "Self-Consistency" View):**
          *   *Metaphysics:* Block universe with a strong constraint on physical solutions.
          *   *Key Claim:* Only self-consistent histories exist. Probability of inconsistency is zero.
          *   *Mechanism of Failure:* Global constraint. The laws of physics *ensure* consistency.
          *   *Vibe:* Hard Determinism/Fatalism. The timeline "curves" around paradoxes.

  3.  **Address Point 1: Where do they come apart?**
      *   *Surface Level:* They look identical in outcome (Grandfather lives).
      *   *Deep Level:* They differ on *modality* and *explanation*.
      *   *Lewis:* It's a logical truth that contradictions don't happen. The explanation for failure is local (slipped on a banana peel). It *could* have happened in a different possible world, just not this one.
      *   *Novikov:* It's a physical law that contradictions don't happen. The explanation for failure is global (the universe prevents it). It *could not* have happened in any physically possible world sharing these laws.
      *   *The Divergence:* Lewis treats the failure as a *contingent fact* about this world (you happened to fail). Novikov treats it as a *necessary constraint* on physical processes (you were forced to fail).
      *   *Crucial Distinction:* Counterfactuals. Lewis: "If you had aimed better, you might have succeeded (but then you wouldn't be the traveler from that future)." Novikov: "If you had aimed better, the gun *would* have jammed." The laws of nature behave differently in the counterfactual space.

