answer: |-
  Your intuitive verdicts are remarkably consistent with how professional historians and archaeologists actually operate, even if your stated principle feels wobbly to you. You are instinctively applying a **Bayesian** method: you start with a prior probability based on the genre and context, then update that probability when independent evidence (anchors) appears.

  Here is a repaired principle that captures your verdicts, resolves your anxieties about Xia/Arthur, and handles the new cases.

  ### The Principle: Differential Corroboration of Structure and Agent

  **A legendary tradition preserves history when its *structural claims* (polities, cities, broad conflicts, geography) are corroborated by independent contemporary evidence (archaeology, epigraphy, or outsider accounts). However, *agentive claims* (specific names, motivations, miraculous deeds, singular leaders) require direct naming or identification within that independent evidence to be accepted as history.**

  Furthermore, **confidence scales probabilistically** with the *proximity* and *specificity* of the anchor. An anchor that confirms the *setting* raises the probability of the *event*, but only an anchor that confirms the *agent* raises the probability of the *person*.

  ---

  ### 1. How this principle accommodates your verdicts

  This principle refines your idea that "the anchor transfers to the frame, not the narrative" by distinguishing between the **Frame** (Structure) and the **Picture** (Agents).

  *   **Troy:**
      *   *Structure:* Fortified city at Hisarlik, Hittite mentions of Wilusa/Ahhiyawa. **Anchor Present.** -> Verdict: Historical Kernel.
      *   *Agent:* Achilles, Helen, 10-year duration. **Anchor Absent.** -> Verdict: Transformation/Invention.
      *   *Fit:* Perfect.

  *   **Vinland:**
      *   *Structure/Agent:* The sagas claim Norse went to a place called Vinland and settled. L'Anse aux Meadows confirms Norse settlement in that geography.
      *   *Fit:* Perfect. The structural anchor (Norse in North America) is specific enough to validate the agentive claim (Norse voyages) because the settlement is ephemeral and specific, not a generic "people were here."
      *   *The 1960 Problem:* This does not break the principle. Before 1960, the *evidence* was missing, so a rigorous application of the principle would have dictated a verdict of "Unproven/Probable" rather than "Historical, full stop." Your gut might have said "likely," but the *historical verdict* shifts with the data. The principle is epistemic (about what we can know), not ontological (about what happened).

  *   **Burgundians:**
      *   *Structure:* Destruction of a kingdom in the 430s. **Anchor Present** (Contemporary Roman chronicles).
      *   *Agent:* Specific heroes of the *Nibelungenlied*. **Anchor Absent.**
      *   *Fit:* Perfect. You accept the fall, not the song's details.

  *   **Atlantis:**
      *   *Structure:* Advanced prehistoric civilization. **Anchor Absent** (No geology, no contemporary texts).
      *   *Context:* Source is Plato (Philosophical Dialogue).
      *   *Fit:* Perfect. No structural anchor + genre suggests allegory = No kernel.

  *   **Exodus:**
      *   *Structure:* Mass departure of Israelites from Egypt. **Anchor Contradictory** (Archaeology shows indigenous Canaanite development; Merneptah Stele places Israel in Canaan).
      *   *Fit:* Perfect. The independent evidence actively falsifies the structural claim.

  *   **King Arthur:**
      *   *Structure:* Battle of Mount Badon. **Anchor Present** (Gildas, contemporary-ish).
      *   *Agent:* "Arthur" as the commander. **Anchor Absent** (Gildas does not name him; later texts are centuries late).
      *   *Fit:* Perfect. You accept the battle (Structure) but reject the commander (Agent). This is consistent with your rejection of the Trojan Horse (Agent/Detail) while accepting the War (Structure).

  *   **The Xia Dynasty (The Tension Point):**
      *   *Structure:* A Bronze Age polity in the Yellow River valley during the 2nd Millennium BCE. **Anchor Present** (Erlitou culture).
      *   *Agent:* The specific dynastic succession of the Xia. **Anchor Absent** (Texts are much later).
      *   *Fit:* **Mostly Consistent, with one caveat.** Your verdict ("probably existed as a real Bronze Age polity") aligns with the principle *if* you mean "A state existed here which later tradition *called* Xia."
      *   *The Caveat:* You admitted you'd believe in the Xia *without* the archaeology. **This is the verdict you should give up (or at least interrogate).** That intuition relies on a "Argument from Continuity" (Chinese historiography is continuous) which is a weaker anchor than material evidence. If Erlitou turned out to be unrelated to the later Shang/Xia tradition, your principle demands you downgrade the Xia to "Legend" (like Arthur). To be consistent with your Arthur verdict, you must concede that without Erlitou, the Xia is just as shaky as Arthur.

  ### 2. Predictions for New Cases

  Here is how the **Differential Corroboration** principle applies to your unlisted cases:

  **The Geats of *Beowulf*:**
  *   **Verdict:** **Historical Kernel (High Confidence).**
  *   **Reasoning:**
      *   *Structure:* The Geats (Götar) and Swedes (Svear) are attested polities.
      *   *Agent:* King Hygelac (Beowulf's lord) is named in the Frankish *History of the Franks* by Gregory of Tours (d. 594), a near-contemporary source independent of the poem. He is recorded dying in a raid in Frisia around 516 CE, matching the poem's account.
      *   *Prediction:* The poem preserves a genuine historical memory of a specific leader and conflict, even if the monsters and feats are legendary.

  **The Dorian Invasion:**
  *   **Verdict:** **Transformed Kernel (Medium Confidence).**
  *   **Reasoning:**
      *   *Structure:* Late Bronze Age collapse and material culture shift in the Peloponnese (introduction of iron, new burial rites). **Anchor Present.**
      *   *Agent:* A specific "Invasion" by "Dorians" led by the "Return of the Heraclidae." **Anchor Ambiguous.**
      *   *Prediction:* There was a migration/population movement (Structure), but the "Invasion" narrative (Agent/Event) is likely a later simplification of complex collapse and drift. Accept the demographic shift, reject the specific conquest narrative.

  **Robin Hood:**
  *   **Verdict:** **Legend (No Kernel).**
  *   **Reasoning:**
      *   *Structure:* Outlaws in Sherwood during the reign of Richard I/John. **Anchor Weak.** (There were outlaws, but none specifically anchored to this name/place/time cluster in contemporary records).
      *   *Agent:* Robin Hood. **Anchor Absent.** (First clear references are centuries later).
      *   *Prediction:* Unlike Arthur (where a battle is anchored) or Hygelac (where a name is anchored), Robin Hood lacks a structural or agentive anchor in contemporary evidence. He is a folkloric composite.

  ### 3. On the Nature of the Principle (Binary vs. Probabilistic)

  You asked: *Does the fact that my confidence is graded... mean there is no single principle here?*

  **No.** It means the principle is inherently probabilistic. History is not a switch; it is a dial.

  Your "gut verdicts" are actually **Bayesian Updates**.
  1.  **Prior:** What is the baseline likelihood of this story being true given its genre? (e.g., Plato's Atlantis = Low Prior; Saga geography = Medium Prior).
  2.  **Likelihood:** If the story were true, how likely is it we would find this evidence? (e.g., If Troy existed, would we find a burned city? Yes.)
  3.  **Posterior:** The updated confidence after seeing the evidence.

  **The "Vinland 1960" issue:**
  Before 1960, your posterior probability for Vinland should have been "Plausible but Unconfirmed." After 1960, it became "Confirmed." The *principle* didn't change; the *input data* changed. If you felt it was "Historical, full stop" before 1960, you were relying on a different heuristic (perhaps textual coherence). To align with your Troy and Arthur verdicts, you must admit that before L'Anse aux Meadows, Vinland was in the same category as the Trojan War: *Probable Kernel, Unproven Specifics.*

  ### Summary of Advice

  1.  **Adopt the Principle:** "Accept structural claims anchored by independent evidence; reject agentive claims unless directly named in that evidence."
  2.  **Adjust the Xia Verdict:** Acknowledge that your confidence in the Xia *without* archaeology is an inconsistency. Treat the Xia like Troy: The *polity* is historical (anchored by Erlitou); the *dynastic narrative* is legendary (unanchored).
  3.  **Accept Graded Confidence:** Do not seek a sharp boundary. A "Historical Kernel" is not a binary state; it is a high probability assigned to the structural frame, with low probabilities assigned to the narrative details.
  4.  **New Verdicts:** Beowulf's Hygelac is historical (like the Burgundian kings); Robin Hood is not (like Arthur the person); the Dorian Invasion is a demographic shift disguised as a military campaign (like the Trojan War).

  Your intuition is sounder than your theory. Your theory just needs to explicitly distinguish between **States/Places** (which leave dirt) and **People/Plots** (which leave stories), and weight the former heavier than the latter.
