answer: |-
  You have identified a very real, documented cognitive asymmetry, but you have also extended it into a social behavior that philosophy hasn't fully named yet.

  The established concept you are looking for is the **Knobe Effect** (also known as the **Side-Effect Effect**). Discovered by philosopher Joshua Knobe in 2003, it describes exactly the first half of your observation: people are significantly more likely to judge a side effect as "intentional" if it is harmful than if it is helpful, even when the actor's mental state (indifference) is identical in both cases. In experiments, if a CEO implements a program to increase profits and is told it will *harm* the environment (and says "I don't care, just make profit"), people say he *intentionally* harmed the environment. If the program *helps* the environment, people say he did *not* intentionally help it.

  However, the Knobe Effect stops at **attribution of intent**. It does not account for the second half of your observation: the **reliance**. In your story, the neighbors deny the sprinkler water is "on purpose" (refusing praise/credit) but then *plan their lives around it* (assigning reliability/expectation). This creates a contradiction: you don't usually build expectations on accidents.

  Because no single established term covers the *judgment asymmetry* plus the *behavioral reliance*, I am coining a term for the full pattern you described.

  ### The Established Core: The Knobe Effect
  The Knobe Effect explains why "on purpose" tracks with blame. It suggests that moral judgment precedes intent attribution. We don't decide if it was on purpose and then decide if we're mad; we decide we're mad, and that makes it "on purpose." This protects the social norm: bad outcomes need a responsible agent.

  ### The Missing Piece: Reliance Without Credit
  Your observation goes further. You noted that when the side effect is *good*, neighbors deny intent (to avoid owing gratitude) but enforce consistency (to ensure continued benefit). This turns "intent" into a tool for social regulation rather than a description of reality. It is a form of **unwritten contract enforcement**. You are allowed to treat the benefit as reliable, but you are not allowed to demand it as a right (because it's "accidental"), which lets the neighbor off the hook while letting you keep the water. Until the water stops. Then, the "accident" is retroactively treated as a "negligence" or "broken promise."

  ### The Coined Term: Instrumental Intentionality
  To capture the whole cycle (the blame/praise asymmetry *and* the reliance/expectation asymmetry), I propose the name **Instrumental Intentionality**.

  **Definition:**
  **Instrumental Intentionality** is a social heuristic where the attribution of "intent" to an actor is determined not by their actual mental state, but by the observer's need to either assign liability (for harm) or establish reliability (for benefit).
  *   **What it is:** A functional use of the word "purpose" to manage social risk. It treats intent as a status granted by the community based on utility, not a fact about the actor's brain.
  *   **What it isn't:** It is not deception (the actor isn't necessarily lying), nor is it actual intent (the actor truly may not care). It is distinct from the Knobe Effect because it includes the *behavioral reliance* on the "accidental" benefit, not just the judgment of the act.
  *   **Where it stops:** It stops applying if the actor *actually* intends the side effect. If the neighbor secretly *wants* to water your tomatoes, it is no longer Instrumental Intentionality; it is **Concealed Intent**. The pattern requires genuine indifference from the actor, which the observers then manipulate linguistically to suit their needs.

  ### Edge Cases and Boundaries
  You asked about specific variations. Here is how **Instrumental Intentionality** applies to them:

  1.  **Harm and Benefit are the Same Act (The Downspout):** This is the **Core Case**. The physical motion is identical. The split in "intent" attribution is purely based on the valence of the outcome for the observer. This falls squarely *inside* the pattern.
  2.  **Committee or Company:** This **Strengthens** the pattern. Corporations are often treated as "indifferent agents" by default. When a company's policy hurts you, it's "corporate greed" (intent). When it helps you, it's "market forces" (accident). Yet, customers still rely on the policy continuing. This is *inside* the pattern, often more robustly than with individuals.
  3.  **Secretly Enjoying the Good Side Effect:** This **Breaks** the pattern. If the neighbor secretly likes watering your tomatoes, he has a motive. If he has a motive, it *is* purpose, even if hidden. The pattern relies on the actor's *indifference*. If the indifference vanishes, the phenomenon becomes simple deception, not social intent-construction.
  4.  **Actually Aiming from the Start (and hiding it):** This is **Outside** the pattern. This is a lie. Instrumental Intentionality requires that everyone (including the actor) knows the act was indifferent, but the *label* changes based on the outcome. If the actor aimed, the "intent" is real, not instrumental.

