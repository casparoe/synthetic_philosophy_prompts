prompt: |-
  There's a pattern I keep running into around my neighborhood and I can't find a word for it anywhere. My neighbor on the east side rerouted his downspout a few years back so the runoff heads for the low spot between our lots, which turns into a little pond on my side every spring. He knew it would, he just didn't care — he did it to keep water off his own foundation. Everyone on the street, including people who barely know him, talks about it like he floods my yard "on purpose." And nobody actually thinks he woke up wanting to flood me. But the same guy's sprinkler overshoots and waters my tomato patch for free all summer, and when I tryed to thank him, everybody laughed — oh no, he's not watering your tomatoes on purpose, that's just a happy accident, don't go thanking him. Same guy, same couldn't-care-less attitude, and we hand him totally opposite verdicts on "on purpose." Here's the part that really gets me, though: people still plan around the sprinkler water. The guy on the corner literally planed his fence repair around the morning spray, and the week my neighbor's timer broke and the tomatoes dried out, folks were annoyed at him like he'd broken a promise. So it seems like "on purpose" doesn't track what's in anyone's head at all — it tracks whether we get to be mad at you, or whether we get to count on you.

  I've searched things like "blaming someone for something they didn't aim at" and got nothing but noise, so I'm asking here. Is there an established name for this exact pattern — reading a side effect as done "on purpose" when it's bad, refusing the same reading when the same person's side effect is good, while still quietly relying on the good one? If there is, I'd like to know how it's usually defined and where the edges are. What happens when the harmful side effect and the benefit to the doer are the same act (that's my downspout guy — the convenience for him and the pond for me are one motion)? What about when the doer is a committee or a company instead of one guy, or when the doer secretly does start enjoying the good side effect but would never admit it?

  And if nothing established covers the whole pattern, coin something for me — a name plus a definition that says what it is, what it isn't, and where it stops applying. For instance, is it still the same thing when the person really did aim at the side effect from the start and just won't say so, or does my pattern specifically require the not-caring? I'm not after just a label — I want the carving: which part is about the person's head, which part is about our expectations, and where the two come apart. Whatever you decide, please finish with a JSON object that sums it up, with these fields: "established_terms" (a list of the closest existing concepts, names only), "best_fit" (whichever of those fits best, or the string "none"), "differences" (for each term you listed, one line on how my pattern isn't quite that), "coined_name" and "definition" (only if you ended up coining something — otherwise leave these out), and "edge_cases" (a short list of the borderline situations I mentioned, each with your call on which side of the line it falls and why).
