answer: |-
  This is the central foundational tension in Everettian Quantum Mechanics (EQM). The problem is not mathematical; it is semantic and metaphysical. You are asking for a specification that separates a *derivation* from a *postulate disguised as a derivation*.

  Below is the spec list. I have categorized them by **Formal/Input** (what goes in), **Conceptual/Semantic** (what the terms mean), and **Output/Phenomenological** (what comes out).

  ### I. Formal & Input Requirements

  **1. The Unitary-Only Constraint**
  *   **Requirement:** The derivation must begin solely from the Schrödinger equation (unitary evolution) and the structure of Hilbert space. It cannot introduce a collapse postulate, a hidden variable, or an external probability measure.
  *   **Consideration:** This prevents "smuggling." Many failed derivations assume a measure over the Hilbert space (like the $L_2$ norm) at step one and then "derive" that the measure is $|\psi|^2$. That is tautological. The measure must emerge from the dynamics or the symmetry of the state, not be assumed as a background metric.
  *   **Status:** **Non-Negotiable.** Without this, you are not doing Many-Worlds; you are doing Hidden Variables or Collapse.

  **2. The Branch-Counting Exclusion**
  *   **Requirement:** The derivation must explicitly demonstrate why a "count of branches" is not the correct measure of likelihood, or demonstrate that "count of branches" is ill-defined in the relevant ontology.
  *   **Consideration:** If the world splits into two, why is a 99/1 amplitude split different from a 50/50 split if both result in "two worlds"?
      *   *Is branch counting ill-defined?* Yes, in standard decoherence theory. Branches are not discrete integers; they are emergent, fuzzy structures defined by decoherence thresholds. You can slice the wavefunction into "worlds" in infinitely many ways depending on your coarse-graining.
      *   *Does it matter?* Yes. If branches *were* discrete and countable (e.g., in a discrete spacetime theory), the Born rule would likely be false (you would get uniform probabilities). The derivation must rely on the continuity of the wavefunction to weight branches by amplitude rather than topology.
  *   **Status:** **Non-Negotiable.** Any theory that predicts equal probability for all outcomes is empirically falsified.

  ### II. Conceptual & Semantic Requirements

  **3. The Account of Pre-Measurement Uncertainty**
  *   **Requirement:** The derivation must specify *what* an agent is uncertain about prior to a measurement, given that all outcomes deterministically occur.
  *   **Consideration:** This is your sticking point. In standard probability, uncertainty is about *what will happen*. In EQM, everything happens.
      *   *Option A (Subjective Uncertainty):* I am uncertain about *which* copy I will be (Self-Locating Uncertainty).
      *   *Option B (Decision Theory):* Uncertainty is irrelevant; only rational betting behavior matters.
      *   *Option C (Typicality):* Uncertainty is an illusion; I should simply expect to find myself in a "typical" branch.
      *   The derivation cannot just say "probability exists." It must define the *referent* of the probability claim.
  *   **Status:** **Non-Negotiable (The Requirement), Camp-Specific (The Solution).** You *must* solve the "Incoherence Problem." *How* you solve it determines your camp (Wallace vs. Carroll/Sebens vs. Vaidman).

  **4. The Link Between Amplitude and Credence**
  *   **Requirement:** The derivation must provide a logical bridge between the physical magnitude (amplitude) and the epistemic magnitude (credence/belief).
  *   **Consideration:** Physics deals with amplitudes; agents deal with beliefs. Why should the square of a complex number dictate how strongly I believe I will see a specific outcome? A derivation that stops at "the math has a square in it" is not a derivation of probability; it's a derivation of geometry.
  *   **Status:** **Non-Negotiable.** This is the core of the Born Rule problem.

  ### III. Output & Phenomenological Requirements

  **5. Decision-Theoretic Equivalence (The "Betting" Test)**
  *   **Requirement:** An agent using the derived probabilities must make the same decisions (bets, actions) as an agent in a single-world theory using standard Born-rule probabilities.
  *   **Consideration:** If probability has no cash value in action, it is metaphysical fluff. If an Everettian agent would bet differently than a Copenhagenist agent, the theories are empirically distinct (and EQM might be wrong).
  *   **Status:** **Camp-Specific (Decision-Theorists).** This is the Wallace/Deutsch standard. Typicality advocates (like Carroll) argue this is too strong; they argue probability is about *expectation* of experience, not necessarily rational betting constraints in a multiverse. However, most agree some link to action is necessary for the concept to be meaningful.

  **6. Empirical Recovery in the Finite Limit**
  *   **Requirement:** The derivation must recover the Born rule for finite sequences of measurements, not just in the infinite limit.
  *   **Consideration:** Many derivations (like Hartle's frequency operator) only show that the Born rule holds for an infinite number of trials. But we live in a finite universe. A derivation that requires infinite ensembles to define probability fails to explain why I should expect the Born rule *now*.
  *   **Status:** **Non-Negotiable.** Science is done in finite time.

  ---

  ### The "Jointly Unsatisfiable" Analysis

  You asked if any subset of these requirements is jointly unsatisfiable. This is the most critical part of your request. There are two major tensions that suggest a "No-Go" theorem might lurk here.

  #### 1. The Determinism vs. Uncertainty Tension
  *   **Conflict:** Requirement #1 (Unitary/Deterministic) vs. Requirement #3 (Pre-Measurement Uncertainty).
  *   **The Problem:** Classical probability theory (Kolmogorov) is built on sample spaces where only one outcome occurs. EQM violates this axiom.
  *   **Is it Unsatisfiable?**
      *   If you require **Objective Chance** (Lewisian propensity): **YES, UNSATISFIABLE.** There is no objective chance in a deterministic multiverse. If your spec demands objective chance, EQM fails.
      *   If you allow **Subjective Credence**: **SATISFIABLE (Debated).** Proponents argue that even if the universe is deterministic, an agent *inside* it can be uncertain about their self-location (which branch they occupy). Critics argue this is a category error: if all copies exist, there is no fact of the matter to be uncertain *about*.
      *   *Verdict:* This is the "Incoherence Problem." It is not mathematically unsatisfiable, but it may be conceptually incoherent depending on your philosophy of mind.

  #### 2. The Branch Definition vs. Measure Tension
  *   **Conflict:** Requirement #2 (Branch Counting Exclusion) vs. Requirement #6 (Empirical Recovery).
  *   **The Problem:** To derive the Born Rule, you need branches to be "fuzzy" enough that counting them is impossible (otherwise you get uniform probabilities). But to recover empirical predictions (Requirement #6), you need branches to be "sharp" enough that they correspond to definite measurement outcomes (pointer states).
  *   **The Unsatisfiability Risk:**
      *   If branches are **too sharp** (discrete): Branch counting becomes well-defined, and the Born Rule derivation fails (you get 50/50 instead of 99/1).
      *   If branches are **too fuzzy** (continuous): You cannot define distinct outcomes, so you cannot recover empirical predictions (Requirement #6 fails).
      *   *Verdict:* This is the **Preferred Basis/Decoherence Tension**. A successful derivation must walk a tightrope: branches must be emergent structures that are robust enough to count as "outcomes" but vague enough to prevent integer counting.
      *   *Current Status:* Most physicists believe decoherence theory resolves this by showing that while the *number* of branches is ill-defined, the *measure* (amplitude) is robust. However, rigorous mathematical proof that this balance holds without circularity is still a point of contention (see critiques by Kent, Dawid, etc.).

  #### 3. The "Measurement Neutrality" Trap
  *   **Conflict:** Requirement #1 (Unitary Only) vs. Requirement #5 (Decision Theory).
  *   **The Problem:** Decision-theoretic derivations (Deutsch/Wallace) often rely on an axiom called "Measurement Neutrality" (it doesn't matter *how* you measure, only the state).
  *   **The Unsatisfiability Risk:** Critics (like Barnum, Caves, Finkelstein) argue that assuming Measurement Neutrality in a branching universe is effectively assuming the Born Rule. If the physical process of branching affects the agent's identity, neutrality might not hold.
  *   *Verdict:* If you strictly enforce **No Circularity (Req #1)** and **Decision-Theoretic Rigor (Req #5)**, some argue the axioms required to bridge them are secretly probabilistic assumptions. This is the strongest candidate for a "Jointly Unsatisfiable" set if one holds a strict view on what counts as "circular."

  ### Summary for your Reading
  When you read the next argument, check if they violate **Req #1** (smuggling in a measure) or if they dodge **Req #3** (refusing to say what uncertainty means).

  If you believe **Objective Chance** is required for probability, then EQM is dead (Unsatisfiable). If you believe **Subjective Credence** suffices, it is live, but you must accept that "probability" means something different in EQM than it does in single-world theories. The derivation is not proving "Probability exists"; it is proving "Rational agents in a multiverse should act *as if* probability exists with weights $|\psi|^2$."
