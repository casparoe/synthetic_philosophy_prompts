prompt: |-
  I'm a journalist covering science and ideas, and there's a pattern I keep running into that I can't figure out how to handle. Every few weeks a source pitches me a story where the stakes are effectivly unlimited: a tech safety person saying a certain kind of AI system, if developed, could kill everyone; a biosecurity guy claiming an engineered pathogen could end civilization; one guy who's dead serious that population decline means hundreds of billions of potential people never get born, which he calls the biggest story of the century. The pitch always has the same shape. The probability is small and everyone admits its a guess — but the harm is so enormous that even a tiny chance swamps everything else on my beat. The math they use is just "huge number times small number still equals huge." And the thing is, if I actually followed that math, I'd run extinction stories basically every week and nothing else, because nothing else has stakes in the same league. Climate, antibiotic resistance, actual wars — all rounding errors next to "everyone dies." When I don't take the bait, I need a reason, and "the number is too big to believe" doesn't seem like one. My editor says just use news judgment, but news judgment is exactly the thing the math claims to override. So my question: is there a principled line between covering a genuinely underrated risk and getting pushed around by someone who noticed they can always name a bigger number than the last guy? If so, where does the line sit — in how they know, how big the claim can get before it stops counting for more, whether it can be checked at all, or somewhere else entirely? And if it turns out there's no principled line and I'm just going to be arbitrating these by feel, I'd honestly rather hear that too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Problem:**
      *   **User:** A journalist covering science and ideas.
      *   **Problem:** Recurring pitches involving "existential risk" (x-risk) scenarios (AI, biosecurity, population decline).
      *   **Core Argument of Pitches:** Small probability $\times$ Infinite/Enormous Harm = Enormous Expected Value. Therefore, this story dominates all others.
      *   **Journalist's Dilemma:** If they follow this logic, they cover *only* extinction stories. If they ignore it, they lack a principled reason beyond "it feels wrong." "News judgment" feels insufficient against the math.
      *   **Question:** Is there a *principled line* between covering underrated risk and being manipulated by big numbers? Where does it sit? Or is it just feel?

  2.  **Deconstruct the "Math" (Expected Value Theory):**
      *   The pitches rely on *Expected Value (EV)* reasoning: $EV = P \times Impact$.
      *   If Impact $\to \infty$ (or near infinity, like 8 billion lives), even tiny $P$ yields huge $EV$.
      *   **Flaw 1: Probability Estimation.** In these domains, $P$ is not a frequentist probability (like a die roll). It's a subjective degree of belief. When $P$ is derived from pure speculation, $P \times \text{Huge}$ is meaningless.
      *   **Flaw 2: Uncertainty about the Model.** The model itself (the causal chain) is fragile. If one link breaks, $P$ drops to near zero.
      *   **Flaw 3: Opportunity Cost.** Focusing on hypothetical future harm ignores certain present harm.

  3.  **Identify Principled Objections (The "Line"):**
      *   I need to provide the journalist with concrete, defensible criteria to evaluate these pitches. It can't just be "feel." It needs to be epistemological and journalistic.
      *   *Criterion 1: Epistemic Grounding.* Can the probability be grounded in evidence, or is it pure speculation? (Knightian Uncertainty vs. Risk).
      *   *Criterion 2: Falsifiability/Checkability.* Can the claim be tested or verified *now*? If not, it's philosophy, not news.
      *   *Criterion 3: Causal Specificity.* Is the mechanism concrete or magical? (e.g., "AI decides to kill us" vs. "AI fails at alignment constraint X").
      *   *Criterion 4: Neglect vs. Novelty.* Is this actually neglected, or just hyped in specific circles?
      *   *Criterion 5: The "Pascal's Mugging" Problem.* Explicitly name the philosophical fallacy they are encountering.

  4.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge that this is a known, named problem. It's not just them. It's "Pascal's Mugging" in a journalistic context.
      *   **The Math is Broken:** Explain *why* the "huge number times small number" logic fails in journalism. Distinguish between *Risk* (known probabilities) and *Uncertainty* (unknown probabilities).
      *   **Principled Criteria (The "Line"):**
          1.  **Evidence for Probability:** Is the $P$ derived from data or intuition? If intuition, discount it heavily.
          2.  **Mechanism:** Is the path from A to Z clear? Or does it rely on "and then magic happens"?
          3.  **Actionability:** Does covering this lead to action? Or just anxiety?
          4.  **Verification:** Can you report on the *claim* without validating the *catastrophe*? (Meta-coverage).
      *   **Journalistic Framework:** Shift from "Is the risk real?" to "Is the *claim* newsworthy?"
      *   **The "Pascal's Mugging" Concept:** Introduce this term. It gives the journalist vocabulary to push back.
      *   **Practical Advice:** How to talk to editors and sources.

  5.  **Refining the Tone:**
      *   Respectful of the journalist's intelligence.
      *   Analytical but practical.
      *   Avoid dismissing x-risk entirely (some is real), but focus on the *pitching dynamic*.
      *   Empower the journalist to trust their "news judgment" by backing it with epistemology.

  6.  **Self-Correction/Nuance Check:**
      *   *Wait, isn't climate change also a huge number?* Yes, but the probability is higher and the mechanism is observed. Distinguish between *observed trajectory* vs. *hypothetical scenario*.
      *   *What about population decline?* That's a values claim (potential people), not a physical harm claim. Distinguish between *harm to existing* vs. *non-benefit to non-existent*.
      *   *Don't say "ignore them."* Say "cover the discourse, not just the doom."

  7.  **Final Polish:** Organize with clear headings. Ensure the distinction between "Risk" and "Uncertainty" (Knight) is clear. Make sure the "Pascal's Mugging" analogy lands. (This is the key conceptual hook).

      *(Self-Correction during drafting)*: I should make sure to mention that "News Judgment" *is* a principled stand, but it needs to be articulated. It's not just a gut feeling; it's a heuristic for truth-seeking.

      *Key Insight:* The journalist is being asked to treat *speculation* as *data*. The principled line is the distinction between reporting on evidence vs. reporting on anxiety.

  8.  **Final Output Structure:**
      *   Introduction: You are experiencing "Pascal's Mugging."
      *   Why the Math Fails: Risk vs. Uncertainty.
      *   The Principled Line (4 Filters): Evidence, Mechanism, Consensus, Actionability.
      *   Reframing the Story: Cover the claim, not the catastrophe.
      *   Conclusion: Trust your judgment, it's epistemologically sound.

  9.  (Reviewing against safety guidelines): The topic involves existential risk (AI, bio). I must not validate specific doomsday claims as fact, nor dismiss legitimate safety concerns entirely. I need to remain neutral on the *truth* of the risks and focus on the *journalistic methodology*. The advice should be about evaluating claims, not adjudicating the fate of humanity. This is safe.

  10. **Final Polish:** Ensure the tone is empathetic to the pressure they feel. (Proceed to generate response).

  *(Wait, one more thought)*: I should explicitly mention the "Longtermism" philosophy since the population decline pitch sounds exactly like that. It helps the journalist categorize the source.

