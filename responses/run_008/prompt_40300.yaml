answer: |-
  You have a name for the problem you are facing. In philosophy and decision theory, it is called **Pascal's Mugging**.

  It comes from a thought experiment where a mugger tells you: "Give me $5, or I will use my magic powers to simulate and kill 3^^^^^3 people in another dimension." The expected value calculation says you should pay him, because even if the probability of him having magic powers is one in a trillion, the harm is so vast that it swamps the $5.

  Your sources are mugging you. They are asking you to trade your finite column inches and audience attention for a speculative probability multiplied by an infinite (or near-infinite) stake.

  You are right to feel that "news judgment" is being weaponized against you. But you are wrong to think there is no principled line. There is. It lies in epistemology, not arithmetic. The "huge number times small number" math only works if the probability is *knowable*. In the stories you are describing, it is not.

  Here is how you draw a principled line, grounded in the difference between **risk** and **uncertainty**, and how to explain it to your editor.

  ### 1. Distinguish Risk from Knightian Uncertainty
  In 1921, economist Frank Knight drew a distinction that is vital for your beat.
  *   **Risk:** You don't know the outcome, but you know the distribution of probabilities (e.g., rolling dice, actuarial tables for car accidents, climate models based on physical laws).
  *   **Uncertainty:** You don't know the outcome, and you *cannot know the probabilities* because there is no historical data and no validated model (e.g., superintelligent AI killing everyone, engineered pathogens ending civilization).

  **The Principled Line:** You can report on *Risk*. You should be deeply skeptical of reporting on *Uncertainty* presented as *Risk*.
  When a source gives you a number like "10% chance of extinction," ask: "What is the denominator?" If they cannot show you a frequency distribution or a validated model, that number is not data; it is a feeling dressed up as math. Reporting a feeling as a percentage is a violation of scientific accuracy.

  ### 2. The Mechanism Test
  Legitimate science stories usually have a mechanism that can be examined.
  *   **Climate Change:** We know CO2 traps heat. We can measure CO2. We can measure heat. The chain is physical and observable.
  *   **The Pitch:** "If AI gets too smart, it might decide we are atoms to be used for something else."

  **The Principled Line:** If the causal chain relies on a "black box" step that cannot be inspected, tested, or falsified *today*, it is not a news story about a threat; it is a story about a *belief system*.
  You can cover the belief system (see point 4), but you cannot cover the threat as an imminent physical reality comparable to a war or a pandemic.

  ### 3. The "Non-Existence" Problem (Specific to Population Pitches)
  The pitch about "hundreds of billions of potential people" is philosophically distinct from AI or bio risk. This is a value claim, not a harm claim.
  *   **Harm:** Something bad happens to someone who exists.
  *   **Non-Benefit:** Someone who never exists does not suffer from not existing.

  **The Principled Line:** Journalism generally covers harm to existing constituents. Prioritizing "potential people" over actual people is a specific ethical framework (often called *Longtermism*), not an objective metric of news value. You can report that *some people believe this*, but you cannot report it as an objective metric of "biggest story of the century" without qualifying it as a philosophical stance, not a demographic fact.

  ### 4. Cover the Claim, Not the Catastrophe
  This is the most practical tool for your news judgment.
  When a source pitches "AI could kill everyone," there are two stories:
  1.  **The Catastrophe:** "AI might kill everyone." (This requires you to validate the probability, which you can't do.)
  2.  **The Claim:** "Influential tech figures are claiming AI could kill everyone, and here is how that is shaping policy/funding/fear." (This is verifiable.)

  **The Principled Line:** If you cannot verify the *threat*, verify the *discourse*.
  This allows you to cover the story without accepting the premise. You are reporting on the *social phenomenon* of the fear, not the *physical reality* of the doom. This satisfies the "news value" (powerful people are saying important things) without falling into the Pascal's Mugging trap (validating the infinite stakes).

  ### 5. Opportunity Cost is Real News
  Your editor says "news judgment" overrides the math. You can make that concrete.
  Journalism has an opportunity cost. Every column inch spent on a speculative 0.0001% risk is an inch not spent on a 90% risk.
  *   **Antibiotic Resistance:** High probability, high harm, observable now.
  *   **AI Extinction:** Unknown probability, infinite harm, speculative.

  **The Principled Line:** Proportionality. Coverage should be roughly proportional to the *certainty* of the harm, not just the *magnitude*. A 100% chance of 1,000 deaths is a bigger story than a 0.0000001% chance of 8 billion deaths, because the former is a fact and the latter is a guess. If you cover the guess as heavily as the fact, you are misleading the audience about the state of knowledge.

  ### How to handle the Source and the Editor
  **To the Source:**
  "I am not equipped to evaluate the probability of existential risk. I am equipped to evaluate the evidence you have that this risk is being taken seriously by policymakers. Let's write about the policy, not the apocalypse."

  **To the Editor:**
  "If we follow the 'expected value' logic these sources use, we have to ignore all current suffering for speculative future suffering. That isn't news judgment; that's utilitarian calculus. Our job is to report on the world as it is knowable, not the world as it is imaginable. I propose we cover the *rise of these claims* (the sociology/politics) rather than validating the *claims themselves* (the science)."

  ### Summary
  There is a principled line. It sits at **falsifiability**.
  *   Can the claim be proven wrong?
  *   Is the probability derived from data or intuition?
  *   Are we reporting on harm to existing people or potential people?

  If the answer is "No," "Intuition," and "Potential," you are not looking at a science story. You are looking at a philosophy pitch. You can cover it as such, but do not let it swamp the beat. You are not ignoring the math; you are recognizing that when probabilities are made up, the math is fiction.

  Trust your gut. It's not "feel"; it's your brain recognizing that the epistemic foundation is missing.
