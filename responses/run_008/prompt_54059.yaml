      *   Ensure the distinction between "Common Knowledge" (infinite) and "Mutual Knowledge" (finite) is clear.
      *   Make sure to address the user's desire to keep (1) and (7).

  8.  *(Self-Correction during drafting)*: I need to make sure I don't just say "it's implicit." I need to explain *why* that blocks the regress. The regress is epistemic. If the basis for the belief is *publicly available information* (e.g., we both see the table, we both spoke about it), then the infinite hierarchy is *warranted* without being *represented*. Lewis's convention solution is relevant here.

  9.  **Final Review against constraints:**
      *   Expert tone? Yes.
