answer: |-
  This is a classic "dissertation trap" scenario: you've identified a genuine philosophical problem (heterogeneity), but you're treating it as a metaphysical bottleneck that must be cleared before you can do axiology. Your advisor is right: you need to stop trying to solve the philosophy of mind problem and start solving the axiological problem *given* the philosophy of mind constraints.

  Here is the dependency structure, ranked from most upstream (foundational/constraining) to most downstream (derivative), with a defense of the ranking based on tractability for a 3-year philosophy dissertation.

  ### The Ranked List of Open Questions

  **1. The Explanatory Direction (The "Euthyphro" of Hedonism)**
  *   **Question:** Does pleasure confer value on experiences, or does the value of experiences confer the label "pleasure"?
  *   **Position:** Upstream.
  *   **Why:** This determines your method. If pleasure is a natural kind that *causes* welfare (Realist Hedonism), you are stuck with the heterogeneity problem as a fatal metaphysical flaw. If "pleasure" is a functional/normative category defined by its role in a theory of welfare (Conceptual/Normative Hedonism), heterogeneity is irrelevant (multiple realizability).
  *   **Tractability:** High. This is pure armchair conceptual analysis. You don't need to solve consciousness; you need to solve the logical priority of your terms.

  **2. The Unity Condition (Functional vs. Phenomenal)**
  *   **Question:** What kind of unity does "pleasure" require to support a *monist* theory of value?
  *   **Position:** Midstream (depends on #1).
  *   **Why:** If you settle #1 in favor of Normative Hedonism, you only need *functional* unity (e.g., all pleasures reinforce behavior, or all represent "goodness" to the subject), not *phenomenal* unity. If you require phenomenal unity, you are dead in the water (see Dead Ends below).
  *   **Tractability:** Medium. Requires engaging with philosophy of psychology (reward learning) but not doing the science yourself.

  **3. The Attitudinal Relocation**
  *   **Question:** Does shifting to Attitudinal Hedonism (Feldman/Heathwood) solve heterogeneity or just hide it?
  *   **Position:** Midstream/Downstream.
  *   **Why:** This is the standard move, but it's vulnerable. If "taking pleasure in" is just a pro-attitude, what makes that pro-attitude *hedonic* rather than just *evaluative*? If it's just evaluative, you've collapsed into an Ideal Utilitarianism or Perfectionism.
  *   **Tractability:** Medium-High. Lots of literature to engage with, but easy to generate new objections/variations.

  **4. The Empirical Constraint (Psych/Neuro)**
  *   **Question:** How much does the science of reward (dopamine, RPEs, liking vs. wanting) constrain the philosophical definition?
  *   **Position:** Downstream/Supportive.
  *   **Why:** Empirical data can rule out bad metaphysical theories (e.g., if there is no neural correlate of a "pleasure tone"), but it cannot settle the normative question.
  *   **Tractability:** Low-Medium. High risk of "science-washing." You need to borrow psych, not do it.

  **5. The Aggregation Problem**
  *   **Question:** How do heterogeneous pleasures sum to a total well-being score?
  *   **Position:** Downstream.
  *   **Definition:** Do not touch this yet.
  *   **Why:** You cannot measure or sum X until you know what X is. Solving heterogeneity dissolves most aggregation worries (if they are functionally equivalent, they are comparable).

  ---

  ### Defense of the Ranking & Dependency Structure

  **Why #1 is the Lever:**
  Most students try to solve #2 (What is pleasure?) before #1 (Why does it matter?). This is the trap. If you argue that pleasure is the *ground* of value, you bear the burden of proving it is a unified natural kind. If you argue that "pleasure" is the *name we give* to whatever intrinsically benefits a subject, heterogeneity vanishes.
  *   **Dependency:** If you get #1 wrong, #2 becomes impossible (you'll be searching for a qualia that doesn't exist). If you get #1 right, #2 becomes a manageable functionalist account.
  *   **Tractability:** This is the only question on the list you can definitively *argue* for in 3 years without waiting on new science.

  **Phenomenology vs. Well-being (Your specific question):**
  The well-being question is upstream of the phenomenology question *for the purposes of a dissertation*.
  *   **Reason:** Phenomenology is descriptive; well-being is normative. You are writing a thesis in value theory, not philosophy of mind. You should treat phenomenology as a constraint, not a foundation. If the phenomenology is heterogeneous, your theory of well-being must accommodate that (via multiple realizability), not demand the phenomenology change.
  *   **Risk:** If you make phenomenology upstream, you are dependent on introspection, which is, as you suspect, cursed.

  **Desire-Satisfaction Relocation:**
  You asked if desire-satisfaction makes the issue moot. **No, it relocates it.**
  *   **The Trap:** If you say "Well-being is desire satisfaction," the heterogeneity objection returns as: "What unifies all desire satisfactions?" If the answer is "They all feel good," you're back to hedonism. If the answer is "They are all desired," you face the problem of misguided desires (the "pig satisfied" objection).
  *   **Verdict:** Don't switch to desire satisfaction to avoid the heterogeneity problem. It introduces the "informed desire" machinery which is arguably heavier than the hedonist machinery.

  **Introspection:**
  **Do not build a dissertation on introspection.**
  *   **Reason:** The "cursed" intuition is correct. Introspection is theory-laden. When you introspect "schadenfreude" vs. "backrub," you are already applying the concept *pleasure* to filter the experience. You cannot use the tool to analyze the tool.
  *   **Move:** Use *third-person* functional criteria (e.g., "Does this state typically sustain the behavior that caused it?") rather than first-person reports.

  ---

  ### Dead Ends to Avoid (The "Polishing Turds" List)

  1.  **The Search for the "Hedonic Tone":** Defending the idea that there is a specific qualitative feel common to all pleasures.
      *   *Why:* Empirical psych and rigorous phenomenology (e.g., Husserlian analyses) have largely debunked this. You will spend 3 years defending a position that is likely false.
  2.  **Pure Sensory Hedonism:** Restricting welfare to bodily sensations.
      *   *Why:* It's obviously false (the proof example you gave). Defending it requires too many counter-intuitive bullets to bite.
  3.  **The "Experience Machine" Redux:** Writing another paper on Nozick.
      *   *Why:* It's done. Unless you have a radical new take on *why* we reject it, it's a distraction from the heterogeneity issue.
  4.  **Reducing Pleasure to Dopamine:**
      *   *Why:* Category error. Dopamine is often about *wanting* (prediction error), not *liking* (hedonic impact). Basing your axiology on current neurochemistry dates your dissertation instantly.

  ---

  ### The One Item Worth Your Three Years

  **Topic:** **Multiple Realizability and the Unity of Hedonic Value.**

  **The Pitch:**
  Defend **Normative Hedonism** over **Psychological Hedonism**.
  Argue that the heterogeneity problem is only a problem if Hedonism is a claim about a *natural kind* (Psychological Hedonism). If Hedonism is a claim about *value* (Normative Hedonism), then pleasure is a **functional kind** defined by its normative role (e.g., "that which makes a life better for the subject"), not its phenomenological constitution.

  **Why this works for a 3-year timeline:**
  1.  **Concedes the Hard Stuff:** You grant the phenomenologists and psychologists that there is no common "feel." You don't fight that war.
  2.  **Saves the Theory:** You argue that just as "computation" can be realized in silicon, vacuum tubes, or neurons, "pleasure" can be realized in sensations, attitudes, or achievements, provided they play the *welfare-role*.
  3.  **Philosophical Meat:** The work isn't in defining the feeling; it's in defining the *role*. What is the specific normative role that distinguishes hedonic value from perfectionist or desire-based value? (e.g., Is it about *subjective endorsement*? Is it about *reinforcement*?)
  4.  **Advisor Bait:** This shows you understand the meta-ethical stakes (naturalism vs. non-naturalism, functionalism) without getting bogged down in trench warfare.

  **The Dependency Win:**
  By making **Axiology Upstream** of **Metaphysics**, you flip the script. You aren't asking "What is pleasure?" and then "Is it good?" You are asking "What is good?" and arguing "We call the realizers of that property 'pleasure'."

  This allows you to use the attitudinal distinction (Feldman) not as a definition of pleasure, but as a *realizer* of the functional role, while leaving room for sensory pleasures as other realizers. It solves heterogeneity by making it a feature (multiple realizability) rather than a bug.

  **Title Idea:** *The Functional Unity of Hedonic Value: A Defense of Normative Hedonism Against the Heterogeneity Objection.*

  Go write the proposal.
