      *   *Better Twist:* Focus on the **Explanatory Direction**. Does pleasure explain value, or does value explain pleasure? This is the "Euthyphro" of hedonism. This is the most tractable philosophical lever.

      *   *Let's structure the ranking:*
          1.  The Explanatory Direction (Value -> Pleasure vs. Pleasure -> Value).
          2.  The Unity Condition (Functional vs. Phenomenal).
          3.  The Empirical Constraint (Psych/Neuro).
          4.  The Aggregation Problem (Downstream).

      *   *Dead End Flag:* "Sensory Hedonism" (Mill/Sidgwick style qualia search). "Pure Desire Satisfaction" (relocates the problem).

      *   *The "One Thing":* Defending **Normative Hedonism** over **Psychological Hedonism**. Arguing that the heterogeneity doesn't matter if the *normative force* is uniform.

      *(Self-Correction)*: Wait, if the user is working on well-being, they need to defend Hedonism as a theory of *welfare*. If pleasure is heterogeneous, can it ground a *monist* theory of welfare?
      *   *Argument:* Yes, if the heterogeneity is at the *realizer* level, not the *functional/normative* level. (Multiple realizability).
      *   *Dissertation Topic:* "Multiple Realizability and the Unity of Hedonic Value."

      *   *Let's refine the "One Item":* It's the **Multiple Realizability Defense of Hedonism**. This allows the user to concede the phenomenological heterogeneity (upstream) while saving the axiological monism (downstream). This is tractable, philosophical, and uses the "heterogeneity" as a feature, not a bug.

  10. **Final Polish:** Ensure the distinction between "upstream" (metaphysics/psych) and "downstream" (axiology) is clear. Emphasize that trying to solve the metaphysics first is the trap.

      *(Final check of the prompt requirements)*: Ranked list? Yes. Defense of ranking? Yes. Dependency structure? Yes. Tractability? Yes. Dead ends? Yes. One item to choose? Yes.

