answer: |-
  You have hit the exact nerve center of the debate. The Sleeping Beauty problem (SBP) is not really about coins or sleep; it is a stress test for Bayesian epistemology when applied to **self-locating beliefs** (indexical propositions like "I am here now").

  Your intuition that the fight is about "what counts as new evidence" is correct, but the technical breakdown is sharper: it is about whether standard Bayesian conditionalization can handle **centered propositions** without modification.

  Here is the walkthrough of the layer underneath, the breakdown of the "Monday" problem, and the verdict on your TA's variant.

  ---

  ### 1. The Core Dispute: Centered Worlds and "New" Evidence

  You asked whether Thirderism is ordinary Bayesian conditioning or a new principle. The answer is: **It requires a new principle (or a modification of the old one).**

  **The Halfer Argument (Standard Bayesianism):**
  *   **Proposition:** $H$ = "The coin landed Heads."
  *   **Evidence:** $E$ = "Beauty is awake right now."
  *   **Sunday Credence:** On Sunday, Beauty knows $P(E) = 1$. She knows she will definitely wake up at least once.
  *   **Conditionalization:** Standard Bayes says $P_{new}(H) = P_{old}(H | E)$. Since $P_{old}(E) = 1$, $P_{old}(H | E) = P_{old}(H) = 1/2$.
  *   **Conclusion:** Waking up provides no *discriminating* evidence. It was guaranteed to happen. Therefore, credence remains 1/2.

  **The Thirder Argument (Self-Indication / Centered Indifference):**
  *   **The Move:** Thirders (like Adam Elga) argue that "I am awake now" is not just a proposition about the world, but a **centered proposition** about the agent's location in logical space.
  *   **The Principle:** When you have indistinguishable centered experiences (Monday-awakening vs. Tuesday-awakening), you should distribute credence equally among them (Principle of Indifference over Centered Worlds).
  *   **The Math:** There are three indistinguishable centered possibilities: $\langle H, Mon \rangle$, $\langle T, Mon \rangle$, $\langle T, Tue \rangle$. Only one is Heads.
  *   **The Break:** This violates standard conditionalization because it treats the *number of observer moments* as evidence. In standard Bayes, the number of times a proposition is observed doesn't change its truth probability. In SBP, Thirders argue it *should*, because "I am observing this" is the evidence.

  **So, what breaks?**
  Standard Bayesianism assumes propositions are **uncentered** (true or false simpliciter). SBP forces us to deal with **centered** propositions (true for me now, false for me later). Standard conditionalization assumes your evidence $E$ is a subset of the possibility space you started with. Thirders argue the possibility space *shifts* because the "center" (the *now*) moves.

  ---

  ### 2. The "Monday" Problem and the Conditionalization Crash

  You wrote: *"if she's told 'today is Monday,' pretty much everyone agrees she should say 2/3 heads."*

  **This is the pivot point where your map needs correction.** There is no consensus on this. In fact, the disagreement over $P(Heads | Monday)$ is what splits the Halfers into two camps.

  Here is the trilemma:

  1.  **The Thirder:**
      *   $P(Heads) = 1/3$.
      *   If told "Monday," the $\langle T, Tue \rangle$ option is eliminated.
      *   Remaining options: $\langle H, Mon \rangle$ and $\langle T, Mon \rangle$.
      *   **$P(Heads | Monday) = 1/2$.**

  2.  **The Lewis Halfer (Standard Halfer):**
      *   $P(Heads) = 1/2$.
      *   They treat the coin toss as the primary uncertainty. Given Tails, Beauty is indifferent between being in the Monday awakening or the Tuesday awakening.
      *   So, $P(T \& Mon) = 1/4$ and $P(T \& Tue) = 1/4$. $P(H \& Mon) = 1/2$.
      *   Total probability of Monday = $1/2 (H) + 1/4 (T) = 3/4$.
      *   **$P(Heads | Monday) = (1/2) / (3/4) = 2/3$.**
      *   *Note:* This is the calculation you likely encountered. It preserves standard conditionalization but leads to the weird result that learning it is Monday makes Heads *more* likely.

  3.  **The Double Halfer:**
      *   $P(Heads) = 1/2$.
      *   They insist **$P(Heads | Monday) = 1/2$**.
      *   **What breaks here?** They explicitly **reject standard conditionalization** for self-locating information. They argue that learning "It is Monday" is not standard evidence updating; it is a "shift" in temporal location that doesn't obey $P_{new}(A) = P_{old}(A | E)$.

  **To answer your specific question:**
  Is it that "It is Monday" isn't a proposition in the ordinary timeless sense? **Yes.**
  "It is Monday" is a **temporal indexical**. It is true on Monday and false on Tuesday. Standard Bayesian conditionalization is designed for timeless truths (or truths stable across the update). When the evidence itself changes truth value over time (as the agent moves from Monday to Tuesday), the diachronic rule $P_{t1}(A) = P_{t0}(A | E)$ breaks down unless you adopt a specific theory of how centered credences evolve (like Elga's "Shift" rule or Lewis's "Centered Indifference").

  The "embarrassment" for the Halfer is only embarrassing if you demand that $P(Heads | Monday)$ must equal $P(Heads)$. Lewis Halfers accept the 2/3. Double Halfers accept the 1/2 but sacrifice conditionalization.

  ---

  ### 3. Equivocation or Substantive Disagreement?

  You asked: *"Is there a defensible reading on which the whole halfer/thirder fight is an equivocation over what 'credence' even means?"*

  There is a defensible reading, but it doesn't dissolve the disagreement; it just relocates it to **Decision Theory**.

  *   **Halfer Credence:** Tracks the **frequency of the coin**. (In 100 experiments, 50 are Heads).
  *   **Thirder Credence:** Tracks the **frequency of the experience**. (In 100 experiments, there are 150 awakenings, 50 are Heads).

  **Is it just semantics?**
  No, because credence is supposed to guide action (betting).
  *   **Bet A:** "I get \$1 if the coin is Heads, \$0 if Tails." (Paid once per experiment).
      *   Halfer says: Take it. Expected value = \$0.50.
      *   Thirder says: Take it. (Even with 1/3 credence, the payoff structure matches the experiment frequency).
  *   **Bet B:** "I get \$1 if the coin is Heads, \$0 if Tails." (Paid **per awakening**).
      *   Halfer says: Expected value = \$0.50 per awakening? No. If Tails, I get paid twice (0+0). If Heads, I get paid once (1). Average per awakening is \$1 / 150 awakenings = \$0.33.
      *   Thirder says: Expected value = \$0.33. (Matches their 1/3 credence).

  **The Verdict:**
  If "credence" means "the odds at which I should bet *per awakening*," the Thirder is right. If "credence" means "the odds at which I should bet *per experiment*," the Halfer is right.
  The substantive disagreement is: **Which betting schedule corresponds to rational belief?** Most epistemologists argue belief should guide action in the moment (per awakening), which favors Thirders. But many argue belief should track the external world (per experiment), which favors Halfers. It is not mere equivocation; it is a clash between **internalist** and **externalist** norms of rationality.

  ---

  ### 4. The Bonus: The "Different Topic" Variant

  *Variant: Beauty is woken Monday (always) and Tuesday (iff Tails). But on Tuesday, she is asked about the weather, not the coin. So when asked about the coin, she knows it's Monday.*

  **Your TA's Claim:** This dissolves the problem.
  **My Verdict:** It dissolves the *self-locating uncertainty*, but not the *philosophical dispute*.

  **Why it changes the mechanics:**
  In the standard SBP, when Beauty wakes, she wonders: "Is this Monday or Tuesday?" (Self-locating uncertainty).
  In the Variant, when Beauty is asked about the coin, she knows: "They only ask about the coin on Monday."
  Therefore, her evidence is effectively "It is Monday."

  **Does it change the credence?**
  It reduces the problem to the $P(Heads | Monday)$ debate we just had.
  *   **Thirder:** "Okay, I know it's Monday. So I eliminate Tuesday-Tails. I'm left with Monday-Heads and Monday-Tails. That's 1/2."
  *   **Lewis Halfer:** "Okay, I know it's Monday. Using my model, $P(H|Mon) = 2/3$."
  *   **Double Halfer:** "Okay, I know it's Monday. $P(H|Mon) = 1/2$."

  **Why the TA thinks it dissolves:**
  The TA is likely relying on the intuition that if Beauty knows it is Monday, she should just revert to the standard coin probability (1/2). This intuition aligns with the **Double Halfer** or **Thirder** position on the conditional. It removes the "1/3 vs 1/2" tension because the "Tuesday awakening" is no longer a live hypothesis *for the question being asked*.

  **Why it doesn't actually dissolve the core dispute:**
  The core dispute is about whether the *mere existence* of the Tuesday awakening (even if not about the coin) affects the probability of the coin.
  *   **Thirder:** "Even if you ask me about the weather on Tuesday, the fact that I exist twice on Tails means my current existence is evidence for Tails. But since I know it's Monday, that evidence is cancelled out." (So they converge on 1/2).
  *   **Halfer:** "The Tuesday interview is irrelevant. The coin is fair. It's Monday. So 1/2."

  **The Catch:**
  If the variant forces everyone to say 1/2, it's because it forces the **conditional** ($P(H|Mon)$). But remember, Lewis Halfers *disagree* that $P(H|Mon) = 1/2$. They say it's 2/3. So a Lewis Halfer would **not** accept your TA's conclusion. They would say: "Even if I know it's Monday, the fact that I am *in* an experiment where Tails produces two days makes Monday more likely to be associated with Heads (since Heads *only* produces Monday)."

  **Summary on the Variant:**
  It removes the *amnesia* aspect of the problem (she knows which day it is contextually). This makes it a standard conditional probability problem. However, since philosophers still disagree on how to condition on indexicals like "Monday," the variant doesn't solve the metaphysical disagreement; it just strips away the amnesia confusion to reveal the raw disagreement about conditionalization.

  ### The Bottom Line

  You are stuck because you are looking for a consensus on a problem that exposes a fissure in the foundation of Bayesianism.
  1.  **What breaks:** Standard conditionalization assumes evidence is uncentered. SBP evidence is centered ("I am here now").
  2.  **The Monday Constraint:** There is no consensus on $P(H|Mon)$. Lewis Halfers say 2/3; Thirders/Double Halfers say 1/2. The "2/3" result is a feature of the Lewis model, not a universal truth.
  3.  **Equivocation:** It's not just semantics; it's a choice between tracking world-frequencies (Halfer) vs. observer-moment-frequencies (Thirder).
  4.  **The Variant:** It forces the question to be about $P(H|Mon)$, which sidesteps the amnesia but keeps the conditionalization fight alive.

  The rabbit hole doesn't end; it just widens into the philosophy of time and identity. Welcome to the club.
