  2.  **Brainstorming Pass (Thinking Out Loud):**
      *   *Extended Mind (EM) Camp:* They love the Otto case. Here, the phone is the notebook. But the daughter is the *glue*. If the system functions as memory (reliable, trusted, accessible), it's memory. The daughter's editing is like neural consolidation or reconstruction (which is also fallible). The unease about the daughter being "part of the mind" is interesting. EM usually focuses on artifacts. Including another *agent* pushes into "distributed cognition" or "social extended mind." They need to distinguish between *scaffolding* provided by an agent vs. the agent *becoming* the cognitive vehicle.
      *   *Internalist (INT) Camp:* They smell the Coupling-Constitution fallacy. Just because the mom relies on the daughter doesn't mean the daughter *is* the mom's memory. The daughter has her own intentions. If the daughter inserts false memories (even gently), that's external manipulation, not internal recall. The "whose memory is it?" question is the killer. If it's the mom's memory, the mom must have some epistemic authority. If she can't distinguish, the authority is gone.
      *   *The Twist:* The daughter's *curation*. It's not passive storage (Otto's notebook). It's active processing. EM says internal memory is reconstructive too. INT says internal reconstruction is governed by the *subject's* neural dynamics, not another agent's goals.
      *   *Mediator Goal:* Find where they actually disagree on *mechanisms* vs. *labels*. Can they agree on the functional role without agreeing on the metaphysical boundary?

  3.  **Drafting the Joint Statement (Section 1: Agreed Claims):**
      *   Need substantive claims, not "memory is important."
      *   Focus on the *system* properties.
      *   1. Reliability/Trust: Both agree the mom trusts the app/daughter.
      *   2. Functional Role: Both agree the system plays the functional role of episodic/semantic memory in her daily life.
      *   3. Vulnerability: Both agree that corruption of the system (by daughter or bug) affects her behavior like brain damage would.
      *   4. Agency: Both agree the daughter has independent agency (crucial for the INT worry).
      *   5. Integration: Both agree the integration is high (automatic access).

  4.  **Drafting the Disagreements Table (Section 2):**
      *   Need to phrase so both accept the wording of the disagreement.
      *   *Disagreement 1: Boundaries.* EM: System includes app+daughter. INT: System stops at skin/skull.
      *   *Disagreement 2: The Curation.* EM: Curation = Consolidation. INT: Curation = External Input/Influence.
      *   *Disagreement 3: Ownership.* EM: Memory is a property of the coupled system. INT: Memory is a property of the organism; the rest is support.
      *   *Verbal Check:* Is it just the word "memory"? No, because it entails different predictions about breakdown conditions and responsibility.

  5.  **Identifying the Cruxes (Section 3):**
      *   *Crux 1: The "Glue" vs. The "Agent".* Does the presence of a *second mind* (daughter) break the parity? Otto's notebook doesn't have intentions. The daughter does.
      *   *Crux 2: Re-endorsement/Autonomy.* Does the mother need to consciously verify the data for it to be *hers*? Or is trust enough?
      *   *Crux 3: The Metaphysical Cost.* Is the unease about "absorbing the daughter" a metaphysical dealbreaker or just a sociological worry?

  6.  **Developing Tests/Thought Experiments (Section 4):**
      *   *Variation A (Verbatim):* Daughter acts as passive scribe. (EM says still extended. INT says maybe scaffolding, but less worry about agency).
