  *Actually, let's look at Move 5 again.* Dana says "most actual conformists... plausibly can't run that reasoning." This is the bounded rationality objection. Ken says "norms that arise from where we happen to be are still norms." Ken is conflating *existence* of a norm with *explanation* of a norm. Dana wins Move 5.

