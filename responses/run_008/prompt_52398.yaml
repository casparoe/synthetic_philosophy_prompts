answer: |-
  This is a classic clash in social ontology and meta-ethics, disguised as a dispute about Lewis. You have Dana arguing for a **reductionist/critical** reading (Lewis explains the mechanism, thereby dissolving the mystery of the "ought"), and Ken arguing for a **naturalist/realist** reading (Lewis explains the mechanism, thereby grounding the "ought" in facts).

  Here is the adjudication, move by move.

  ### Move-by-Move Adjudication

  **(1) Dana's Opening:** *Lewis eliminates the "ought"; it's just equilibrium + best response.*
  *   **Verdict:** **Partially Right, Overstated.**
  *   **Analysis:** Dana correctly identifies that Lewis aims to analyze normativity in terms of preferences and expectations (instrumental rationality). However, calling the ought an "illusion" is too strong. Lewis isn't an error theorist; he's a reductionist. He thinks the "ought" is real, but it is nothing *over and above* the game-theoretic structure.
  *   **Slip:** Dana implies that if you can explain the *cause* of the behavior (equilibrium), you've explained away the *reason*. But in Humean frameworks, causes (psychological states) *are* reasons.

  **(2) Ken's Reply:** *Expectation-plus-preference naturalizes the ought; reasons are normative.*
  *   **Verdict:** **Right on Meta-Ethics.**
  *   **Analysis:** This is Ken's strongest philosophical ground. If you accept a Humean Theory of Reasons (reasons are grounded in desires + beliefs), then Lewis has successfully derived an "ought" from an "is" (specifically, the "is" of psychological states and regularities). Ken correctly sees that "naturalizing" isn't "eliminating."
  *   **Best Point:** "Lewis didn't kill the ought, he gave it a respectable ancestry." This captures the project of *Convention* perfectly.

  **(3) Dana's Counter:** *Conditional reasons are just prudence. QWERTY shows we ought to switch, not conform.*
  *   **Verdict:** **Right on Sub-optimality.**
  *   **Analysis:** Dana hits the weak spot in Lewis's account: **Pareto-inferior equilibria.** Lewis admits conventions can be arbitrary, but he struggles to account for the intuition that we sometimes have a reason to *break* a convention (to move to a better one). If the "ought" is just "maximize expected utility given others' actions," then in QWERTY, you ought to type QWERTY. But intuitively, we feel a collective "ought" to switch.
  *   **Best Point:** Distinguishing "ought to coordinate" from "ought to conform to *this* equilibrium." This exposes that Lewis's account is conservative; it justifies the status quo too easily.

  **(4) Ken's Defense:** *Conflating goodness of convention vs. reason to conform. Defecting imposes costs.*
  *   **Verdict:** **Solid Defense, but Sidesteps.**
  *   **Analysis:** Ken is right that individual rationality usually demands conformity even in bad equilibria (if you switch unilaterally, you lose). However, he sidesteps Dana's point about *collective* obligation. Lewis's account explains why *I* ought to drive on the right, but it doesn't explain why *we* ought to legislate a switch to Dvorak.
  *   **Slip:** Ken treats the "coordination cost" as fixed. But in many conventions (like QWERTY), the cost is endogenous to the convention itself.

  **(5) Dana's Closer:** *Ought floats free (path dependence). Common Knowledge is psychologically implausible.*
  *   **Verdict:** **Devastating Blow.**
  *   **Analysis:** Dana lands two distinct hits here.
      1.  **Path Dependence:** If the "ought" is just "do what works given history," it lacks justificatory force. It's "might makes right" for equilibria.
      2.  **Common Knowledge (CK):** This is the standard technical objection to Lewis. Real humans do not have infinite nested knowledge ("I know that you know that I know..."). Lewis requires CK for the equilibrium to hold. If actual conformists don't have CK, Lewis's account fails to describe actual conventions.
  *   **Ken's Response (in prompt):** Ken dismisses this as Dana "sneaking in an intuition." This is weak. The CK requirement is a formal constraint in Lewis's model, not just an intuition. If the model requires cognitive capacities humans don't have, the model is descriptively false.

  ### Who Made the Best Point?
  **Dana, Move 5 (The Common Knowledge Objection).**
  This is the most technically damaging critique of Lewis's specific account. Lewis defines convention via Common Knowledge. Empirical cognitive science suggests humans operate on "common belief" or heuristics, not strict CK. If the definition requires CK and humans don't have it, Lewis's definition excludes most actual conventions. Ken's dismissal of this as "intuition" ignores that Lewis's project was meant to be a rigorous analysis of the conditions required for coordination.

  ### Who Made the Worst Slip?
  **Dana, Move 1 (The "Illusion" Claim).**
  By calling the ought an "illusion," Dana opened the door for Ken to argue for Humean naturalism. If Dana had framed it as "Lewis reduces the *authority* of the ought to mere instrumental rationality," Ken wouldn't have been able to claim Lewis "naturalized" it successfully. Reduction isn't elimination, and Dana blurred that line early.

  ### Who Is More Right Overall?
  **Dana.**
  While Ken wins on the meta-ethical framing (naturalized reasons are still reasons), Dana wins on the **adequacy of the theory**.
  1.  **Descriptive Failure:** Lewis's Common Knowledge requirement is widely regarded as too demanding (as Dana noted).
  2.  **Normative Conservatism:** Lewis's account cannot easily explain why we ought to *change* bad conventions, only why we ought to *keep* them.
  3.  **Individualism:** Lewis treats conventions as aggregates of individual reasoning. Many philosophers (e.g., Margaret Gilbert) argue conventions involve "joint commitment," which cannot be reduced to "I prefer X given you prefer X."

  Ken is defending a coherent *interpretation* of Lewis, but Dana is correctly identifying why Lewis's account is insufficient for a full theory of social norms.

  ### What Are Both of Them Missing?
  There are two major elements absent from this debate that would dissolve the stalemate:

  **1. Joint Commitment (The Gilbert Objection):**
  Both Dana and Ken assume Lewis's individualistic framework (I decide based on my preferences and your expected actions). Margaret Gilbert (*On Social Facts*) argues that conventions create a **joint commitment**. When we establish a convention, we don't just align expectations; we obligate ourselves to each other as a body. This explains the "ought" better than Lewis: I ought to follow the convention not just because it's prudent, but because I would be violating a commitment *to you* if I didn't. This solves Dana's "prudence" worry (it's not just prudence, it's fidelity) and Ken's "path dependence" worry (the commitment creates a new reason, not just a historical one).

  **2. Constitutive vs. Coordination Conventions (The Marmor Objection):**
  Lewis focuses on *coordination* conventions (driving on the right). But many norms are *constitutive* (the rules of chess, or legal procedures). In constitutive norms, the "ought" isn't just about coordinating; it's about making the activity possible at all. Ken's defense works for coordination, but Dana's critique hits harder on constitutive norms where the "arbitrariness" condition is less clear.

  ### Ruling for the Meetup
  If you need to close the argument:
  *   **Award the Meta-Ethics Point to Ken:** He is right that naturalistic reasons count as normativity. Lewis didn't eliminate the "ought."
  *   **Award the Social Ontology Point to Dana:** She is right that Lewis's specific mechanics (Common Knowledge, pure coordination equilibria) fail to capture the full phenomenon of convention, particularly regarding bad equilibria and cognitive limits.
  *   **Final Verdict:** **Dana wins the debate, but Ken wins the definition.** Lewis's account is a brilliant model of *coordination*, but Dana is correct that it is not a complete theory of *convention* or *normativity*. The "ought" of convention is stronger than Lewis allows (it involves commitment), and the cognitive requirements are weaker (we don't need full Common Knowledge).

  Tell them to read Margaret Gilbert's *Living Together* for the next meetup. That's the referee's decision.
