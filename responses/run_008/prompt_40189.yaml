      *   *Inside:* Entities owed direct moral duty.
      *   *Outside:* Entities excluded from moral consideration (objects, resources, enemies).

  4.  **Analyzing the Disanalogies (The "Breaks"):**
      *   *User's Point 1: Single Center.* Is it universal? Or ethnocentric? Does everyone expand at the same rate? (Contested: Universalism vs. Relativism/Power dynamics).
      *   *User's Point 2: Monotonicity.* Is progress linear? What about genocide, slavery resurgence, backlash? (Contested: Moral Progress Realists vs. Skeptics like Rorty or Gray).
      *   *User's Point 3: Sharp Boundary.* Is it in/out or graded? (Common ground: Most ethicists agree moral status is graded or duties are agent-relative).

      *   *Additional Breaks to Consider:*
