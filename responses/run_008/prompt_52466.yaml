      *   Since EC and PE are *not* the same, I cannot simply say "use X." I need to explain the distinction so the student chooses the right one for their specific hypothesis.
      *   However, in *experimental* literature, "Stakes Effects" is the neutral term.
      *   If they are testing whether *ascriber* context matters -> Contextualism.
      *   If they are testing whether *subject* stakes matter -> Pragmatic Encroachment (or Interest-Relative Invariantism).

  4.  **Address Question 2 (Operationalization):**
      *   *Subject-Stakes:* Standard in most X-Phi studies (e.g., Bank Cases). Tests PE (or IRI).
      *   *Ascriber-Stakes:* Tests EC. Much harder to manipulate experimentally because the participant *is* the ascriber. You have to make the *participant* care about the answer.
      *   *Do they yield different results?* Theoretically, yes. EC predicts ascriber stakes matter even if subject stakes are low. PE predicts subject stakes matter even if ascriber stakes are low.
      *   *Advice:* Need to distinguish these clearly in the design. Confounding them is a common critique of earlier studies.

  5.  **Drafting the Response (Iterative Process):**

