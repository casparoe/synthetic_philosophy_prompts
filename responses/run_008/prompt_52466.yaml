answer: |-
  This is an exciting project, and it is excellent that you are pausing to refine the theoretical framing before preregistration. However, there is a **critical theoretical misconception** in your background understanding that, if left uncorrected, could undermine the validity of your study design and the reception of your paper.

  You wrote: *"Epistemic contextualism and pragmatic encroachment are, as far as I can tell, two names for the same thesis."*

  **They are not.** While both views predict that stakes can influence knowledge judgments, they propose fundamentally different mechanisms and truth-conditional structures. Conflating them is a common pitfall, but for a preregistered study, distinguishing them is essential because they generate different empirical predictions regarding *whose* stakes matter.

  Here is a breakdown of the theoretical landscape, the empirical status, and specific advice for your operationalization.

  ### 1. Theoretical Distinction: Contextualism vs. Encroachment

  You need to choose which hypothesis you are testing, as they are not terminological variants of the same claim.

  *   **Epistemic Contextualism (EC):**
      *   **Thesis:** The truth conditions of the word "knows" vary depending on the **context of the ascriber** (the speaker/evaluator).
      *   **Mechanism:** In a "high stakes" context for the *ascriber*, the semantic standard for "knows" rises.
      *   **Prediction:** Knowledge ascription should vary when the **ascriber's** stakes change, even if the subject's stakes remain low.
      *   **Key Proponents:** DeRose, Lewis, Cohen.

  *   **Pragmatic Encroachment (PE) / Interest-Relative Invariantism (IRI):**
      *   **Thesis:** Whether a subject *knows* depends on the **practical situation of the subject**.
      *   **Mechanism:** Practical stakes affect the epistemic justification required for the *subject* to possess knowledge. (PE usually claims practical facts encroach on epistemic status; IRI claims knowledge is invariant across contexts but relative to the subject's interests).
      *   **Prediction:** Knowledge ascription should vary when the **subject's** stakes change, even if the ascriber's stakes are low/neutral.
      *   **Key Proponents:** Fantl & McGrath (PE), Stanley (IRI).

  *   **Traditional Invariantism:**
      *   **Thesis:** Stakes are irrelevant to knowledge.
      *   **Prediction:** No stakes effects (any observed effects are performance errors or pragmatic implicatures).

  **Why this matters for you:** If you treat EC and PE as the same, you cannot interpret your results. If you find an effect, is it because the *word* changed meaning (EC) or because the *subject's epistemic position* changed (PE)?

  ### 2. The Empirical Status: It Is Not Settled

  You mentioned that the literature "appears to have borne this out empirically... [and] should settle the old dispute."

  **Caution:** The empirical literature on stakes effects is **highly contested and currently inconclusive.**
  *   **Early Studies:** Schaffer & Knobe (2012) and others found robust stakes effects.
  *   **Replication Failures:** Subsequent large-scale studies (e.g., Buckwalter 2014; Phelan et al.; various replication projects) have often failed to find robust stakes effects, or found them only under specific conditions.
  *   **The "Conflation Critique":** A major critique (e.g., by Dorr, Hawthorne, and experimentally by Buckwalter) is that early vignettes confounded **subject stakes** with **ascriber stakes**. When researchers disentangled them, the effects often diminished.

  Therefore, your paper should not frame itself as "settling the dispute" but rather as "disentangling the mechanisms of stakes sensitivity." This is a much stronger contribution.

  ### 3. Answering Your Questions

  #### Q1: Which label is standard?

  In experimental philosophy and cognitive science, the neutral term is **"Stakes Effects"** or **"Practical Stakes Manipulations."**

  *   Do not label your hypothesis "Contextualism" unless you are specifically manipulating the *ascriber's* context.
  *   Do not label it "Pragmatic Encroachment" unless you are specifically manipulating the *subject's* practical environment and arguing this changes epistemic status.
  *   **Recommendation:** In your preregistration, use the neutral description: *"We investigate the effect of practical stakes on knowledge ascription."* In the discussion, you can argue which theoretical framework (EC, PE, or Error Theory) best explains the pattern.

  #### Q2: Operationalization (Subject vs. Ascriber Stakes)

  This is the most important design choice you will make.

  **A. Subject-Stakes Manipulation (Standard)**
  *   **Design:** The vignette describes a protagonist (e.g., Hannah at the bank) who has high or low stakes. The participant (ascriber) is a neutral observer.
  *   **Tests:** Pragmatic Encroachment / IRI.
  *   **Issue:** If participants show an effect here, Contextualists can argue this is not evidence for Contextualism (since the ascriber's context didn't change). They might argue it's an "error theory" (participants are confusing knowledge with rational action).

  **B. Ascriber-Stakes Manipulation (Theoretically Crucial for EC)**
  *   **Design:** The protagonist has neutral/low stakes. The **participant** is told that *they* have high or low stakes regarding the accuracy of their judgment.
  *   **Tests:** Epistemic Contextualism.
  *   **Operationalization Challenge:** How do you make the *participant* care?
      *   *Weak:* "Imagine this is important for you." (Often ineffective).
      *   *Strong:* **Incentive-Compatible Design.** Tell participants: "If you correctly identify whether the subject knows, you enter a lottery for $50. If you are wrong, you get nothing." (High Stakes) vs. "You get $0.10 for completion regardless." (Low Stakes).
  *   **Prediction:** EC predicts ascription rates will drop in the High Ascriber-Stakes condition even if the Subject-Stakes are low.

  **C. Do they yield different results?**
  **Yes, theoretically they should.**
  *   If only **Subject Stakes** matter: Supports PE/IRI.
  *   If only **Ascriber Stakes** matter: Supports EC.
  *   If **Both** matter: Supports a hybrid or suggests a general pragmatic bias.
  *   If **Neither** matters: Supports Traditional Invariantism (and suggests previous positive results were artifacts).

  **Current Consensus:** Recent rigorous studies suggest that **Subject-Stakes effects are fragile or non-existent** when controls are tight, and **Ascriber-Stakes effects are even harder to elicit.** However, some recent work suggests that *salience of error* (rather than raw stakes) might be the driving cognitive mechanism.

  ### 4. Recommendations for Your Design

  To make a high-impact contribution as a cognitive scientist:

  1.  **Crossed Design:** Do not choose between subject and ascriber stakes. Use a **2x2 factorial design**:
      *   Factor 1: Subject Stakes (High vs. Low)
      *   Factor 2: Ascriber Stakes (High vs. Low)
      *   *Why:* This allows you to test for interactions. If there is an interaction, it suggests the mechanisms are not identical (refuting your initial assumption that they are the same thesis).

  2.  **Incentive Compatibility:** For the Ascriber-Stakes manipulation, use real financial incentives (within your IRB budget) or course credit bonuses. Mere instruction ("imagine this is important") is often treated by participants as "cheap talk."

  3.  **Control for "Action" vs. "Knowledge":** A major confound is that participants might think High Stakes makes *acting* on the belief risky, not that the *knowledge* is absent.
      *   *Measure:* Include both a Knowledge probe ("Does Hannah know?") and an Action probe ("Should Hannah act?").
      *   *Analysis:* If stakes affect Action but not Knowledge, that supports Invariantism + Pragmatics. If stakes affect Knowledge, that supports EC/PE.

  4.  **Attention and Comprehension:** Stakes manipulations often fail because participants don't process the stakes information. Include robust manipulation checks (e.g., "How much would Hannah lose if she was wrong?").

  5.  **Terminology in Preregistration:**
      *   Avoid: "Testing Contextualism."
      *   Use: "Investigating the sensitivity of knowledge ascription to subject-relative and ascriber-relative practical stakes."

  ### Summary

  Your study has the potential to be very strong, but only if you correct the theoretical framing. **Contextualism and Pragmatic Encroachment are competing explanations, not synonyms.**

  *   **Contextualism** = Ascriber's context changes the meaning of "knows."
  *   **Encroachment** = Subject's context changes the fact of whether they know.

  By orthogonally manipulating both in a preregistered, incentive-compatible design, you can adjudicate between these theories rather than assuming they are the same. This distinction is the key to publishing in top journals in both cognitive science and philosophy.
