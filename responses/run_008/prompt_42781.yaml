answer: |-
  1. **The Individual Grounding Constraint**
     Any valid reason to reject a principle must be statable as a burden borne by a specific individual, not as a deficit in the total sum of welfare.
     *Motivating Case:* The core contractualist rejection of utilitarianism; no one's interests are simply summed with anyone else's.
     *Status:* Non-negotiable (Core Doctrine).

  2. **The Numerical Sensitivity Requirement**
     The theory must yield the verdict that, ceteris paribus, saving a larger number of people from equal, serious harm is required or permissible over saving a smaller number.
     *Motivating Case:* The Rescue Case (e.g., a lifeboat that can hold five or one, where all face death).
     *Status:* Non-negotiable (Adequacy Condition).

  3. **The Aggregation Limit**
     The theory must block the inference that a sufficiently large number of minor complaints can outweigh a single catastrophic complaint.
     *Motivating Case:* The Trade-off Case (e.g., one person's death versus a vast number of mild headaches).
     *Status:* Non-negotiable (Core Doctrine).

  4. **The Continuity Requirement**
     The theory must provide a non-arbitrary method for adjudicating cases where harms are of the same kind but differ in severity and distribution across persons.
     *Motivating Case:* The Intermediate Case (e.g., one person losing two legs versus two people each losing one leg).
     *Status:* Camp-relative (Disputed among contractualists).

  5. **The Risk Integration Clause**
     The mechanism for weighing complaints must apply to expected burdens defined by probability, not only to certain outcomes.
     *Motivating Case:* The Risk Case (e.g., public policy decisions where many face a small risk of death versus one facing a certainty of harm).
     *Status:* Non-negotiable (Core Doctrine).

  6. **The Mechanism Clarity Condition**
     The theory must specify whether numerical weight arises from the summation of distinct complaints or from a structural change in the comparative strength of individual complaints.
     *Motivating Case:* Analytical distinction needed to test views like "pairwise sufficiency" against simple aggregation.
     *Status:* Analytical (Required for evaluation).

  ### Joint Satisfiability

  There is a strong suspicion that requirements 1, 2, and 3 form an inconsistent triad. The **Individual Grounding Constraint** dictates that moral force resides in the relation between a principle and a single person's burden. The **Aggregation Limit** reinforces this by forbidding the summation of small burdens to override a large one. However, the **Numerical Sensitivity Requirement** demands that the presence of *more* people changes the moral outcome in the Rescue Case. If moral force is grounded individually (Req 1) and cannot be summed (Req 3), it is structurally unclear how the mere presence of additional individuals generates the extra weight needed to satisfy Req 2 without collapsing into aggregation (violating Req 1 or 3) or denying that numbers count (violating Req 2). This suggests the aggregation problem may not be a patchable bug but a structural constraint: a theory can satisfy any two of these, but likely not all three simultaneously without introducing ad-hoc distinctions that violate the Mechanism Clarity Condition.

  \answer{The Numerical Sensitivity Requirement}
