answer: |-
  This is an exceptionally sophisticated set of intuitions for a high school Extended Essay. You have correctly identified that "democratic legitimacy" is not a single switch but a matrix of conditions (franchise, deliberation, entrenchment, turnout). Most political theorists struggle to reconcile these exact tensions.

  Based on your seven verdicts, I have reconstructed the underlying logic of your beliefs into a single framework. I call this **The Principle of Dynamic Popular Sovereignty**.

  ### 1. The Principle

  **A referendum result is binding if and only if it satisfies the following four conditions:**

  *   **Clause A (The Franchise Condition):** The electorate must include all permanent adult residents affected by the decision. Systematic exclusion of a demographic renders the vote void, regardless of procedural correctness.
      *   *Motivated by:* **Case 3** (Swiss Women). This distinguishes Case 3 from **Case 2** (Minarets); in Case 2, the franchise was intact, so the process was legitimate even if the moral result was bad.
  *   **Clause B (The Deliberation Condition):** For constitutional or high-stakes structural changes, a simple campaign is insufficient. The vote must be preceded by a structured deliberative body (e.g., a Citizens' Assembly) or explicit parliamentary ratification.
      *   *Motivated by:* **Case 5** (Ireland) vs. **Case 1** (Brexit). This explains why a simple majority worked in Ireland (Citizens' Assembly) but not in the UK (advisory vote without structured prep).
  *   **Clause C (The Revisability Condition):** A current majority cannot raise the threshold for reversal above a simple majority for future legislatures or electorates. Measures that structurally entrench policy against future simple majorities are invalid.
      *   *Motivated by:* **Case 4** (Prop 13) and **Case 6** (Reversals). This codifies your intuition that "the people" are a changing entity over time; one generation cannot shackle the next.
  *   **Clause D (The Participation Condition):** There is no minimum turnout threshold. As long as the franchise is open (Clause A), the result binds regardless of participation rates.
      *   *Motivated by:* **Case 7** (School Bus). This accepts your "intensity of preference" argument mechanically: if the door is open, those who stay home tacitly accept the outcome.

  ### 2. The Honest Failure: Which Verdict Cannot Be Saved?

  While this principle accommodates six of your verdicts cleanly, it fails to fully save the nuance of **Case 4 (Proposition 13)**.

  **The Conflict:**
  Your verdict on Prop 13 is split: *"The vote was legitimate, but the entrenchment clause was not."*
  The Principle of Dynamic Popular Sovereignty is binary regarding bindingness. If a measure violates Clause C (Revisability), the principle declares the **referendum result non-binding**. It cannot easily distinguish between "the mandate to cut taxes was real" and "the mandate to restrict future legislatures was fake."

  To apply the principle mechanically, you would have to rule that the **entire Prop 13 referendum was void** because the measure contained an unconstitutional (in the democratic sense) entrenchment mechanism. You lose the ability to say, "The people spoke legitimately on taxes, but illegitimately on procedure." The principle forces you to treat the ballot measure as a single unit: if the unit violates sovereignty, the unit is dead.

  ### 3. The Cleaner Principle (Dropping the Nuance)

  If you want a principle that is mechanically applicable without splitting the atom of the verdict, you must adopt a **Binary Validity Standard**.

  **Revised Principle:** *A referendum is valid only if the measure itself does not restrict the democratic capacity of the future.*

  **What this changes:**
  *   **Case 4 becomes:** "The Prop 13 referendum was **not legitimate**." (Because the measure violated the Revisability Condition).
  *   **Why this is cleaner:** It removes the burden from the voter to distinguish between "policy" and "procedure" on a ballot. It places the burden on the drafters of the referendum. If they include entrenchment, the whole vote is void. This aligns better with Case 6 (Reversals), which implies that *any* attempt to stop a reversal is illegitimate.

  ### 4. Application to New Cases

  Here is how the **Principle of Dynamic Popular Sovereignty** (using the Binary Validity Standard for consistency) applies to your three hypothetical cases.

  **(a) The Misworded Ballot**
  *   *Scenario:* A referendum question is worded such that a "Yes" vote enacts the opposite of what most voters intend (e.g., "Yes to stop the war" actually means "Yes to the war proposal").
  *   *Application:* This violates the **Deliberation Condition (Clause B)** and the implicit requirement of **Informed Consent**. A vote cannot be binding if the link between intent and outcome is broken.
  *   *Verdict:* **Not Binding.** The result should be voided, and a new referendum with clear wording must be held.

  **(b) The "Abolish Referendums" Vote**
  *   *Scenario:* A referendum to permanently abolish the use of referendums in the future.
  *   *Application:* This violates the **Revisability Condition (Clause C)**. By abolishing the mechanism of direct democracy, the current majority is removing a tool future majorities might need to express their will. It structurally entrenches the *current* system against future *methods* of change.
  *   *Verdict:* **Not Binding.** A simple majority cannot remove the right of a future majority to use a referendum. (Note: A legislature could abolish referendums, but the people cannot bind themselves to silence).

  **(c) The Self-Entrenching Supermajority**
  *   *Scenario:* A simple majority votes to require a supermajority for all future tax referendums.
  *   *Application:* This is a direct violation of the **Revisability Condition (Clause C)**. It is identical to the entrenchment clause in Prop 13. A simple majority cannot alter the rules of the game to make itself harder to defeat in the future.
  *   *Verdict:* **Not Binding.** The vote to install the supermajority requirement is invalid, though a future vote could legitimately install a supermajority if *that* vote achieves a supermajority (self-consistent).

  ### Advice for Your Essay
  Your intuition on **Case 4** is actually more legally mature than the "Cleaner Principle." In constitutional law, courts often use "severability" to strike down the unconstitutional part of a law while keeping the rest.
  *   **Suggestion:** In your essay, acknowledge that the *mechanical principle* requires a binary verdict (Valid/Invalid), but argue that a *legal implementation* of that principle should allow for severability (saving the tax cut, striking the entrenchment). This shows you understand the difference between **Political Theory** (is the mandate real?) and **Jurisprudence** (how do we fix the law?).

  This distinction could be the core of your argument: *Direct democracy requires a principle of dynamic sovereignty, but implementing it requires a judicial body capable of severing entrenchment from policy.* Good luck with the EE.
