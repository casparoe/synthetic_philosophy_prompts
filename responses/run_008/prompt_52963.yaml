answer: |-
  You have diagnosed the situation with impressive accuracy. After two semesters, your intuition is correct: the stalemate is primarily **verbal**, but it is sustained by **substantive** stakes that neither side wants to relinquish.

  Here is the diagnosis of the terrain, the hidden substantive disagreements, and an honest assessment of whether this can be resolved or if you should cut your losses.

  ### 1. The Diagnosis: A Fight Over Conceptual Inheritance

  You are right that the core friction is about which half of the interpersonal deception analogy gets to survive the translation to the intrapersonal case.

  *   **The Intentionalists (Davidson, Pears, Bach):** They treat the *structure* of deception as non-negotiable. For them, "self-deception" is a natural kind that must preserve the intentional arc of other-deception (Agent A knows $p$, intends to make Agent B believe not-$p$). When they move this inward, they are forced into exotic metaphysics (partitioned minds, homunculi, unconscious intentions) to preserve the *label*. They are essentially saying: "If it doesn't look like lying, it isn't self-deception."
  *   **The Deflationists (Mele, Scott-Kakures):** They treat the *phenomenology* as non-negotiable. They look at the actual cases (the smoker who denies cancer risks, the jealous husband who denies infidelity) and note that there is no evidence of a conscious intention to deceive. They argue that the Intentionalists are solving a paradox that only exists because they reified a metaphor. They are essentially saying: "If it looks like lying but involves no intention, it's still self-deception, and your definition is broken."

  **The Verbal Trap:** The word "deception" acts as a loaded gun. It implies a deceiver (knowing agent) and a deceived (ignorant victim).
  *   If you keep the **Deceiver**, you need a partitioned self (Intentionalism).
  *   If you keep the **Deceived** (the false belief), you can dissolve the Deceiver into bias (Deflationism).

  The reading group is stuck because you are arguing over who gets to keep the word "deception," while both sides are actually describing the same cognitive machinery (motivated reasoning).

  ### 2. The Hidden Substantive Disagreements

  However, do not be fooled into thinking this is *purely* semantic. If it were just about words, philosophers would have stipulated new terms decades ago. They haven't because there are three genuine substantive stakes hiding under the verbal fight:

  **A. Moral Responsibility (The Blame Game)**
  This is the biggest substantive hurdle.
  *   **Intentionalist View:** If self-deception involves an intention (even unconscious), the agent is **culpable**. You chose to hide the truth from yourself. You are morally responsible for your false belief.
  *   **Deflationist View:** If self-deception is just a bias (like a visual illusion caused by desire), the agent is **less culpable**. It's a malfunction of rational processing, not a strategic choice.
  *   **The Stalemate:** Intentionalists fear deflationism lets people off the hook for their delusions. Deflationists fear intentionalism attributes god-like cognitive powers to humans (the ability to knowingly lie to oneself).

  **B. The Architecture of the Mind (Unity vs. Modularity)**
  *   **Intentionalist View:** Requires a mind that can be functionally divided. It leans toward Freudian or Fodorian modularity. There must be a "part" that knows and a "part" that doesn't.
  *   **Deflationist View:** Compatible with a unified system that processes information noisily. It leans toward connectionism or predictive processing models where "belief" is a settling of weights, not a filing cabinet.
  *   **The Stalemate:** This isn't just philosophy; it's cognitive science. Until we agree on whether the mind is a single agent or a society of agents, this metaphysical disagreement persists.

  **C. The Nature of Belief (Binary vs. Degrees)**
  *   **The Paradox:** How can I believe $p$ and not-$p$?
  *   **The Fix:** If belief comes in degrees (credences), the paradox dissolves. I can have a high credence in $p$ (due to motivation) while retaining a low-level suspicion of not-$p$.
  *   **The Stalemate:** Intentionalists often rely on a binary view of belief to generate the paradox (which they then solve with partitions). Deflationists often rely on graded belief to dissolve it. If your group hasn't explicitly hashed out *what belief is*, you are talking past each other.

  ### 3. Can This Be Ended?

  Here is the honest verdict: **No, this debate will not be "solved" in the way you want.**

  **Why Stipulative Definitions Won't Work:**
  You could say, "Let's call the Mele view 'Motivated Irrationality' and the Davidson view 'Intrapsychic Lying'."
  *   *Result:* The Intentionalists will argue that Motivated Irrationality isn't the *real* phenomenon we care about when we talk about self-deception (which they see as a moral failing). The Deflationists will argue that Intrapsychic Lying is psychologically impossible and therefore doesn't exist. You haven't solved the problem; you've just renamed the two camps.

  **Why New Psych Data Won't Work:**
  Neuroscience can show conflicting neural signals (e.g., one part of the brain reacting to a threat while another verbalizes safety).
  *   *Result:* Intentionalists will say, "See! Partitioned selves!" Deflationists will say, "See! Competing processing streams without a 'deceiver'!" The data underdetermines the theory.

  **Why New Conceptual Distinctions Won't Work:**
  You've likely already tried distinguishing "conscious" vs. "unconscious" or "occurrent" vs. "dispositional." The debate absorbs these distinctions.

  ### 4. The Recommendation: Pivot or Perish

  If you want to save the reading group from a third semester of purgatory, you have two options.

  **Option A: The Pragmatic Pivot (Recommended)**
  Stop asking *"Is self-deception possible?"* (The Metaphysical Question).
  Start asking *"What work does the concept do?"* (The Functional Question).

  Propose this shift to the group: "We agree on the psychology (motivated bias). We disagree on the label. So, let's ask: **In what contexts do we *need* the intentionality of the Intentionalists?**"
  *   Is it only in legal contexts? (Mens rea)
  *   Is it only in psychoanalytic therapy? (Resistance)
  *   Is it only in everyday blame? ("You knew deep down!")

  If you frame it as **conceptual ecology** rather than **conceptual truth**, you can move forward. You might conclude that "self-deception" is a *cluster concept* that sometimes requires intent (moral contexts) and sometimes doesn't (psychological contexts).

  **Option B: Pick a Terminology and Go Home**
  If the group is strictly analytic and demands a single truth:
  Adopt the **Deflationist (Mele)** terminology as the default for *psychological description*, but acknowledge the **Intentionalist** terminology as the default for *moral description*.
  *   Read Mele for "How it works."
  *   Read Davidson for "Why we blame people for it."
  *   Then disband the topic.

  **My Advice:**
  Go with **Option A**. The reason this topic has survived for 50 years is that it sits at the intersection of philosophy of mind and ethics. The "verbal" fight is actually a proxy war for "How much agency do we have over our own beliefs?"

  Tell your group: *"We are not stuck on self-deception. We are stuck on the boundary between cognitive malfunction and moral agency. Let's read that instead."*

  If they refuse that pivot, then yes, pick a terminology, write a joint paper stating the disagreement is verbal-but-stakes-are-high, and move on to free will. You'll find the same fight there, but at least the literature is bigger.
