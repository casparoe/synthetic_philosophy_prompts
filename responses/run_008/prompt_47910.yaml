answer: |-
  # Which Decision Theory Do You Actually Hold?

  Here's the deal: labels like "causal" or "evidential" are just team jerseys. What matters is what you do when the pressure's on. Below are ten scenarios. Don't overthink the philosophy; just pick the move that feels right.

  ### The Cases

  **1. The Two Boxes**
  There are two boxes on the table. Box A clearly has $1,000. Box B is opaque; it has $1,000,000 if a super-accurate predictor thought you'd take only Box B, otherwise it's empty. The prediction happened yesterday. Do you take both boxes or just Box B?
  *   A) Take both boxes
  *   B) Take only Box B
  *   C) This setup is impossible/nonsense

  **2. The Glass Box**
  Same setup as above, but Box B is made of glass. You look inside and see it's empty. The predictor already acted based on what they thought you'd do now. Do you still take only Box B, or do you grab both?
  *   A) Take both boxes
  *   B) Take only Box B
  *   C) It doesn't matter, the money is gone

  **3. The Smoking Gene**
  A specific gene makes you love smoking and also gives you cancer. Smoking itself doesn't cause cancer; it's just a symptom of the gene. You really want a cigarette. Do you light up or walk away?
  *   A) Light up
  *   B) Walk away
  *   C) Flip a coin

  **4. The Coin Flip Favor**
  A reliable predictor flipped a coin. They said if it landed tails, they'd give you $10,000 *if* they predicted you'd give them $100 now. It landed tails. You know you wouldn't have gotten the money if they thought you'd refuse. Do you hand over the $100?
  *   A) Pay the $100
  *   B) Keep the $100
  *   C) The promise is void since the coin landed

  **5. The Desert Ride**
  You're stranded in the desert. A driver picks you up only because they guessed you'd pay the fare once you reach town. You're now in town, safe in the car. Do you pay the fare or slip away?
  *   A) Pay the fare
  *   B) Slip away
  *   C) Offer a smaller amount

  **6. The Blackmail Letter**
  A blackmailer read your diary yesterday. They only sent the threat because they were sure you'd pay to keep it quiet. If they thought you'd call the police, they never would have contacted you. Do you pay up?
  *   A) Pay up
  *   B) Call the police
  *   C) Negotiate

  **7. The Blind Bind (Original)**
  Before the predictor scans you, you can pay $50 to hire a friend to lock your choice to "One Box." You won't know if the friend actually succeeds, but the predictor sees if you hired them. Do you hire the friend?
  *   A) Hire the friend
  *   B) Don't hire the friend
  *   C) Only if the predictor knows I hired them

  **8. The Inevitable Meeting**
  Death is coming for you. He predicts which city you'll be in tomorrow and goes there. You want to survive. You can be in Aleppo or Damascus. Do you choose Aleppo or Damascus?
  *   A) Aleppo
  *   B) Damascus
  *   C) Stay home

  **9. The Psychopath Button**
  There's a button that kills everyone with a psychopathic personality. You suspect you might be a psychopath, but pressing the button doesn't change your personality. Do you press it?
  *   A) Press it
  *   B) Don't press it
  *   C) Test myself first

  **10. The Mirror Match**
  You are paired with an exact copy of yourself. You both get $1,000,000 if you both choose A, but $1,000 if you choose B while the copy chooses A. You can't talk. Do you choose A or B?
  *   A) Choose A
  *   B) Choose B
  *   C) Randomize

  ---

  ### Scoring Key

  Tally your answers. Most people cluster into one of these five profiles. If you land between two, that's fine; philosophy is messy.

  **1. The Dominance Defender (Classic Two-Boxer)**
  *   **Pattern:** Mostly A answers on 1, 2, 4, 5, 6. You smoke in 3.
  *   **View:** You only care about what your action physically changes. If the money is already there or gone, you grab what you can. You don't pay for past predictions or counterfactual promises.
  *   **Overlap:** You share ground with the **Pragmatist** on extortion (both refuse to pay), but you differ on self-binding.

  **2. The Correlation Tracker (Classic One-Boxer)**
  *   **Pattern:** B on 1, B on 2 (usually), B on 3, B on 5, A on 6. You refuse to pay in 4.
  *   **View:** You treat your choice as news. If choosing A makes it more likely you're the kind of person who gets rewarded, you choose A. You avoid smoking because it's bad news, even if it's harmless.
  *   **Overlap:** You look like the **Algorithm Enforcer** on Newcomb, but you diverge on the Coin Flip (4) and Extortion (6).

  **3. The Algorithm Enforcer (The "FDT/UDT" Family)**
  *   **Pattern:** B on 1, B on 2, B on 3, A on 4, A on 5, B on 6.
  *   **View:** You act as if you're choosing the output of your decision process, not just the single action. You pay the Coin Flip (4) to be the kind of person who gets the $10k in the other branch. You refuse Extortion (6) to ensure your type isn't targeted.
  *   **Overlap:** You match the **Correlation Tracker** on Newcomb, but you're stricter on counterfactuals.

  **4. The Self-Binder (The Pragmatist)**
  *   **Pattern:** A on 1 (initially), but A on 7 (Hire the friend).
  *   **View:** You know your future self will mess up, so you lock your hands early. You wish you were the kind of person who one-boxes, so you pay to become them.
  *   **Overlap:** You get the same money as the **Algorithm Enforcer**, but you think it's about changing your psychology, not logic.
  *   **Note:** If you answered A on 7, you belong here even if you two-boxed on 1.

  **5. The Skeptic (The Deflationist)**
  *   **Pattern:** Mostly C answers.
  *   **View:** You think these predictors are magic tricks. If the prediction is perfect, you don't have a choice; if you have a choice, the prediction isn't perfect. You refuse to play games where the rules smuggle in contradictions about time or free will.
  *   **Overlap:** None. You're sitting this one out.

  ---

  ### Unoccupied Combinations

  Some answer combinations are theoretically possible but practically empty. Here's who isn't showing up:

  **1. The Newcomb Smoker**
  *   **Combo:** One-boxes on Newcomb (1) but Smokes on Lesion (3).
  *   **Verdict:** **Incoherent.** If you one-box because your choice signals a filled box, you must refuse smoking because it signals cancer. Doing both means you treat correlation as real in one case but imaginary in the other.

  **2. The Mugging Two-Boxer**
  *   **Combo:** Two-boxes on Newcomb (1) but Pays on Coin Flip (4).
  *   **Verdict:** **Unattractive.** You're accepting influence from a predictor in the future (Mugging) but denying it in the past (Newcomb). It's an unstable mix of trusting and distrusting the same logic.

  **3. The Extortion Payer who Refuses Hitchhikers**
  *   **Combo:** Pays Blackmail (6) but Refuses Fare (5).
  *   **Verdict:** **Unexplored.** Both cases rely on being predicted to pay. Paying one but not the other suggests a moral distinction between "earned reward" and "avoided punishment" that most theories treat identically.

  ---

  ### Diagnostics Note

  **Which question does the most work?**
  **Question 4 (The Coin Flip Favor).** This is the heavy lifter. It separates the **Algorithm Enforcers** from everyone else. Almost everyone two-boxes or one-boxes based on gut feeling, but paying for a counterfactual outcome requires a specific logical leap that filters out the casual one-boxers.

  **Which two questions could I cut?**
  **Question 2 (The Glass Box)** and **Question 9 (The Psychopath Button).**
  Transparent Newcomb is great for separating EDT from FDT, but for a general newsletter audience, it often just confuses people who already one-box. The Psychopath Button is essentially a second Smoking Lesion; if they pass 3, they'll pass 9. Cutting these keeps the quiz punchy without losing the ability to sort the main tribes.
