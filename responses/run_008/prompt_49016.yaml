prompt: |-
  doing a consistency check on my views about objective chance before a workshop where we all submit our commitments ahead of time and poke holes in each others'. here's my list:

  1. I accept the Principal Principle: if i know the objective chance of an event is x, my credence in it should be x, conditional on admissible information.
  2. I think "admissible" is doing real work there: information about the present and past is admissible, information about the future isn't — otherwise the principle is trivial.
  3. I'm a determinist about fundamental physics, and I think that in a deterministic world all single-case chances are trivially 0 or 1, since the complete state plus laws fixes everything.
  4. I nonetheless think the probabilities in statistical mechanics (like the chance that a gas released in a box spreads out) are genuine nontrivial objective chances, because that's what the best system of the world says.
  5. I think that if a coin is truly fair, then in an infinite run of flips it MUST come out half heads — there's no possible world where a genuinely chancy fair coin has a diverging long-run frequency.
  6. I think credences and chances can come apart for agents with inadmissible evidence, so a psychic who can genuinely foresee the flip should not have credence 1/2 in heads.

  go through these and tell me which ones actually clash, which only look like they clash, and what the cheapest fix is in each case — don't just flag everything as equally bad. and i don't want a lecture on chance in general, i want an audit of MY set.

  please give me the answer as a JSON object with fields: "tensions" (array of objects, each with "commitments" (the numbers involved), "severity" (a 1-10 score), "diagnosis" (what exactly conflicts), "cheapest_fix", and "cost_of_fix" (what taking that fix forces me to give up elsewhere)), "dissolved" (array of objects with "commitments" and "why_not_a_real_tension"), and "single_best_revision" (a short string naming the one change that would clean up the most).
