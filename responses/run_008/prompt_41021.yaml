answer: |-
  "Pass the Cabernet, Marge. And don't think changing the subject stops me from asking," Rosa said, tapping her glass. "You're saying the badness isn't in the feeling itself. So, when Elena sits in the dentist's chair and the drill hits nerve, you're claiming that sensation is no worse for her than the feeling of pressure is for me?"

  Marge poured the wine, unfazed. "I'm claiming the *harm* isn't in the qualia, Rosa. It's in the disruption. Pain is an imperative. It's the body screaming 'Stop!' Elena hears the scream, sure, but she doesn't care. If the badness was intrinsic to the sensation, she'd be writhing. She's not. Therefore, the writhing—the aversion—is where the badness lives."

  "So if I become a Stoic," Rosa countered, leaning forward, "and train myself to observe my migraine without flinching, without any emotional distress, you'd say nothing bad is happening to me? I've just eliminated the harm by changing my attitude?"

  "Don't be reductive," Marge sighed. "The imperative is still issued. The body is still demanding protection. You're just ignoring the command. But with Elena, the command lands on deaf ears. It's not that she's brave; it's that the affective link is severed. That's why the morphine cases are so telling. Patients say, 'The pain is there, but it doesn't bother me.' They separate the sensation from the suffering."

  "Exactly," Rosa pounced. "They separate the *suffering* from the *pain*. Which implies the pain is still there, and still intrinsically unpleasant, even if the suffering is dampened. Otherwise, why call it pain at all? On your view, if I take an 'asymbolia pill' before a root canal, am I better off? Or have I just suppressed my ability to notice a harm that is fully present?"

  Marge paused, swirling her wine. "You're better off. Because the suffering is the disvalue. If the drill is grinding your tooth, that's physical damage. But the *pain*? The pain is the warning system. If the warning doesn't distress you, the pain's negative value evaporates. You've neutralized the alarm, not the fire."

  "But then," Rosa pressed, "does Elena even feel pain? If pain requires aversion, and she has none, you're committed to saying she has literally never been in pain. She'd find that hilarious."

  "She finds everything hilarious," Marge muttered. "But technically? She feels nociception. She feels the sensory-discriminative data. Calling it 'pain' conflates the signal with the response."

  "It's not data," Elena said from the corner of the sofa. She was peeling an orange, her thumb moving steadily over the rind. Both aunts jumped; they'd forgotten she was there. "You're both treating my thumb like a laboratory specimen."

  "Elena, darling," Rosa started. "We're trying to understand—"

  "I know," Elena said, popping a segment into her mouth. "But you're arguing about whether the alarm bell is ugly or whether the command to run is ignored. Neither of you is asking why the house is burning. When I got stung by that wasp, it wasn't that the command didn't land. It's that the command felt... optional. Like a suggestion." She looked at Marge. "If pain is an imperative, why does it feel like a suggestion to me? And," she looked at Rosa, "if the feeling is intrinsically bad, why does it feel like nothing more than a buzz?"

  She stood up, dropping the orange peel on the table. "You want to know about the pill? If I took it, I wouldn't be better off. I'd just be dangerous. I'd let the drill hit the nerve because the 'badness' wouldn't stop me. The badness isn't the feeling, and it isn't the command. It's the consequence you're both ignoring."

  She walked out to the kitchen. Silence hung over the table for a moment.

  "Well," Marge said softly. "She's right about the consequence. But Rosa, she undermined your intrinsic badness too. If the sensation doesn't stop her, is it really 'bad' in the moment?"

  Rosa rubbed her temple. "No. I concede that. Maybe 'badness' isn't a single property. Maybe the sensation has a negative valence, but it requires the affective system to actualize it as suffering. So the Stoic isn't unharmed, but the harm is latent."

  "And I," Marge said, tracing the rim of her glass, "might be too quick to say she never feels pain. If the sensory component is intact, calling it 'nociception' feels like semantic gatekeeping. Perhaps the imperative is present, just ineffective. The command is issued, even if disobeyed."

  "So we agree," Rosa said, a small smile forming, "that the phenomenon is composite. The sensation provides the content, the affect provides the force."

  "And that Elena's condition shows they can come apart," Marge added. "Which means your intrinsic badness isn't enough to explain why we avoid pain, and my imperativism isn't enough to explain why the sensation feels distinct from mere pressure."

  "Better," Rosa said, raising her glass. "But don't think I'm letting you off the hook about the root canal hypothetical tomorrow."

  "Deal," Marge clinked her glass against Rosa's. "But only after coffee."
