  *   **Prediction on New Case:** **Indefensible.** The dying animal receives no good (it dies), and there are no moral agents in relationship with it to realize a relational good. The systemic good is external to the sufferer.

  **Rule 2: The Non-Gratuitous Systemic Function Principle**
  *   **Definition:** An instance of suffering is defensible if it serves a discernible, non-speculative function within a larger system (biological, moral, or ecological), provided the suffering is not excessive relative to that function. Suffering is indefensible if it is functionless (gratuitous) or if the function has ceased.
