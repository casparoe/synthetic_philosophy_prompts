answer: |-
  Alice and Beatrice are colleagues who see a client struggling with heavy boxes. Both carry them up three flights. Both expend identical physical effort and time, risking minor back strain. Neither has a contractual duty to help. Alice hates exertion and misses her lunch break; Beatrice loves fitness and finds the task enjoyable, wishing she could do more.

  Act consequentialism verdicts depend on net utility. Since outcomes and objective costs match, both acts share identical deontic status: for Alice and Beatrice, either both obligatory or both optional. Distinguishing them requires rigging the utility function to treat subjective pain as morally decisive. A Kantian account treats beneficence as an imperfect duty. For both, the act is duty-fulfilling; neither acts supererogatorily. The classical analysis (permissible, not obligatory, good) deems both acts permissible and non-obligatory. However, if the "praise" condition requires sacrifice, only Alice counts as supererogatory.

  Consequentialism struggles most to capture the intuition that only Alice acts "beyond the call." The feature doing the work is subjective net cost. However, strong resistance argues deontic status cannot vary with subjective preference; if an act is optional for Alice, it is optional for Beatrice. The difference lies in moral worth, not deontic category. This objection suggests the case conflates supererogation with virtue. Note that whether consequentialism can accommodate supererogation is contested; optimizers say no, satisficers say yes. Similarly, whether imperfect duty excludes supererogation is debated; some Kantians allow merit beyond duty. The case survives only if one accepts that supererogation is essentially sacrificial, not merely optional. If deontic boundaries are objective, the intuition that Alice alone is supererogatory dissolves into a difference in praiseworthiness, not act status.
