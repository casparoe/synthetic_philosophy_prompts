answer: |-
  ### Desiderata for a Theory of Alignment Guarantees

  To resolve the debate between worst-case and average-case safety, we must first establish what counts as a guarantee. A guarantee is not a hope, a heuristic, or an empirical trend; it is a bound on failure probability conditioned on specific assumptions. The following six desiderata define the necessary structure for any claim of alignment safety to be theoretically coherent.

  #### 1. Explicit Quantifier Scope
  **Requirement:** The theory must explicitly state the order and domain of quantification over inputs, environments, and adversaries. It must distinguish between $\forall$ (all possible cases), $\mathbb{E}$ (expected case over a distribution), and $\exists$ (existence of a safe policy).
  **Motivation:** Much of the current confusion stems from eliding the difference between "safe against all adversaries" and "safe against all *constructible* adversaries." A claim that a system is robust often hides the complexity class of the adversary required to break it. If the guarantee relies on an average over a distribution, the support of that distribution must be defined.
  **Status:** **Non-Negotiable.** Without this, the statement is semantically incomplete.
  **Quantifier Confusion Note:** This is the precise location where the quantifier-order confusion must be pinned down. Many "worst-case" proposals are actually $\forall$ over a bounded set of adversaries (implementable attacks) but $\mathbb{E}$ over inputs, while claiming $\forall$ over inputs. A rigorous framework must declare whether the guarantee holds for *any* input sequence (logical worst-case) or *any* input sequence generated by a process within a specific computational complexity class (computational worst-case).

  #### 2. Ontological Binding of the "Case"
  **Requirement:** The theory must specify what constitutes a single "case" for the purpose of the guarantee. Is the unit of safety a single forward pass, a complete episode, a lifetime of interaction, or the internal state trajectory?
  **Motivation:** A system might be safe on every individual input (local safety) but unsafe over a sequence of inputs that triggers a state change (global safety). Conversely, a system might be safe over a lifetime but perform catastrophic actions during training. If the guarantee applies to inputs but the risk lies in environment dynamics, the guarantee is misaligned with the threat.
  **Status:** **Non-Negotiable.** Ambiguity here allows failures to be categorized as "out of scope" post-hoc.

  #### 3. Closure Under Composition and Transformation
  **Requirement:** The guarantee must specify whether it survives embedding the model in a larger system, connecting it to tools, or subjecting it to further optimization (e.g., fine-tuning, RLHF).
  **Motivation:** Models are rarely deployed in isolation. A guarantee on a base model is useless if the alignment is broken by a simple prompt wrapper or degraded by ten steps of gradient descent. Worst-case proponents often demand this strictly; average-case proponents often treat the model as static to make verification tractable.
  **Status:** **Non-Negotiable for Deployment, Contested for Research.** While logically necessary for a real-world safety claim, this is often treated as a preference by the average-case camp because it drastically increases verification complexity. However, without it, the guarantee applies to a artifact that does not exist in deployment.

  #### 4. Monotonicity with Capability
  **Requirement:** The theory must describe how the guarantee degrades as the system's capabilities increase. Ideally, safety should not be inversely correlated with competence.
  **Motivation:** A common failure mode is "safe until smart." A system may be aligned when it is too weak to devise complex strategies but becomes misaligned once it crosses a capability threshold where instrumental convergence kicks in. A guarantee that holds only for sub-human intelligence is useless for AGI alignment.
  **Status:** **Non-Negotiable.** If safety is not robust to scaling, it is not a guarantee of alignment; it is a guarantee of limited utility.

  #### 5. Empirical Non-Vacuity and Falsifiability
  **Requirement:** The guarantee must be testable in principle and must not rule out all useful policies (including human baselines).
  **Motivation:** A worst-case guarantee over unconstrained environments often demands perfection that no physical system can meet, rendering the guarantee vacuously false for all policies. Conversely, an average-case guarantee over an unverifiable distribution is vacuously true (you can always claim the deployment matches the distribution). The theory must define a bounded uncertainty set that is large enough to cover risk but small enough to allow operation.
  **Status:** **Non-Negotiable.** A guarantee that cannot be falsified or that forbids operation is scientifically meaningless.

  #### 6. Baseline Consistency
  **Requirement:** The theory must state whether the safety standard is absolute or relative to a baseline (e.g., human operators).
  **Motivation:** Worst-case camps often seek absolute safety (probability of catastrophe $\approx 0$). Average-case camps often seek relative safety (safer than humans). If the standard is absolute, we must explain how it avoids condemning human policy (which is not worst-case safe). If relative, we must define the reference class.
  **Status:** **Camp Preference.** This is where the two camps diverge most sharply. Worst-case proponents view relative safety as insufficient for existential risk; average-case proponents view absolute safety as impossible. A complete theory must declare which it aims for, rather than smuggling one in while arguing for the other.

  ---

  ### The Impossibility Triangle

  There is a strong prima facie case that the following three properties are jointly unsatisfiable for systems capable of open-ended reasoning over natural language:

  1.  ** Worst-Case Scope:** The guarantee holds for all inputs within a Turing-complete interface (natural language).
  2.  **Tractable Verification:** The guarantee can be verified with finite computational resources.
  3.  **Non-Vacuous Utility:** The system is permitted to perform complex, open-ended tasks.

  **Reasoning:** If the input space is natural language, it can encode undecidable problems. To guarantee safety worst-case over this space requires solving the halting problem for the model's computation relative to safety constraints. If you restrict the verification to be tractable, you must bound the input space or the model's complexity, which violates Non-Vacuous Utility (the system cannot be truly open-ended). If you allow open-endedness and tractable verification, you must retreat to average-case guarantees, which violates Worst-Case Scope.

  This is not merely an engineering hurdle; it appears to be a logical no-go theorem akin to Gödel's incompleteness or Rice's theorem. Any framework claiming to satisfy all three is likely hiding a constraint in the definition of "verification" (e.g., assuming the adversary is computationally bounded in a way that excludes realistic threats) or "utility" (e.g., restricting the task space so much the system is useless).

  **Where the Quantifier Confusion Hides:**
  This triangle is often obscured by the quantifier-order confusion noted in Desideratum 1. Proponents of worst-case safety often argue for $\forall \text{inputs}$, but when pressed on verification, they retreat to $\forall \text{adversaries in class } \mathcal{C}$, where $\mathcal{C}$ is defined by what is currently implementable. This smuggles an average-case structure (a sample from the space of possible adversaries) into a worst-case claim. The impossibility result holds strictly for $\forall \text{logically possible inputs}$; it may soften for $\forall \text{physically realizable inputs}$, but defining that boundary without circularity is the core theoretical challenge.

  ---

  ### Scorecard of the Two Camps

  | Desideratum | Worst-Case Camp | Average-Case Camp |
  | :--- | :--- | :--- |
  | **1. Quantifier Scope** | **Strong.** Explicitly demands $\forall$, but often模糊 on the computational bounds of the adversary. | **Weak.** Often relies on implicit distributions ("normal use") that are ill-defined. |
  | **2. Ontological Binding** | **Strong.** Focuses on trajectory and state safety. | **Mixed.** Often focuses on input-output pairs, ignoring internal state drift. |
  | **3. Composability** | **Strong in Theory, Weak in Practice.** Demands it, but lacks methods to achieve it for neural nets. | **Weak.** Often assumes static deployment; fine-tuning breaks guarantees. |
  | **4. Monotonicity** | **Strong.** Explicitly concerned with scaling risks. | **Weak.** Often assumes capabilities and safety scale together (an unproven assumption). |
  | **5. Non-Vacuity** | **Weak.** Risks demanding impossibilities (condemning all policies). | **Strong.** Easily tested, but risks testing against the wrong distribution. |
  | **6. Baseline Consistency** | **Weak.** Often ignores human baseline, leading to standards no system can meet. | **Strong.** Anchors to human performance, but may inherit human-level risks. |

  **Summary:** The Worst-Case camp satisfies the logical rigor of the desiderata but fails the feasibility constraints (Verification/Non-Vacuity). The Average-Case camp satisfies feasibility but fails the logical rigor (Quantifier Scope/Monotonicity). Neither currently possesses a framework that clears all six desiderata without violating the Impossibility Triangle.
