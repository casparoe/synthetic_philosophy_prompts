prompt: |-
  In my course on societal collapse we've been covering the Bronze Age, the Classic Maya, and Easter Island, and my professor keeps reaching for the same analogy when students ask whether collapse was avoidable: a civilization, he says, is like a living organism that is born, matures, ages, and eventually dies, so asking why the Mycenaean palaces fell or why the southern lowland cities were abandoned is like asking why an old man died -- the answer is that everything dies, and looking for a culprit (drought, invaders, plague, mismanagement) mistakes senescence for murder. He uses the analogy to push back on narratives that moralize collapse or hunt for a single preventable mistake, and to suggest that terminal decline is built into complex societies. But some of the readings (and some classmates, especially those who point out that populations usually survived these "collapses" and reorganized rather than vanishing) insist that this is exactly what the organism picture hides: the people are the organism's cells, and they survive what the "organism" doesn't. Audit the analogy for me. Lay out what maps onto what -- what plays the role of the organism, of aging, of death, of cause of death -- then identify where the mapping breaks, which features of organisms it quietly imports that societies lack (e.g., hard-coded lifespans, no way to replace organs with different ones), and which disanalogies actually matter for the conclusion he uses it to support versus which are incidental. Then tell me whether his conclusion -- that collapse is a natural, non-culpable process that doesn't reduce to preventable mistakes -- survives once the disanalogies are on the table, and, if the organism doesn't work, what comparison would serve his argument better. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating of my question.
