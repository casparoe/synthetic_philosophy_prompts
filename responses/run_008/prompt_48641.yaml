          *   **Reproduction/Continuity:** Organisms die individually. Societies transform. The "death" is often just a phase change (feudalism instead of empire).
          *   **Conscious Agency:** Organisms don't choose their metabolism. Societies make policy choices (irrigation, war, trade) that affect longevity.
          *   **The "Cells":** In an organism, cell death contributes to organism death. In society, people survive the "death" of the state. The welfare of the "cells" matters morally, whereas organism death is neutral biology.

