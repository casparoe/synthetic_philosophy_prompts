      *   *Claim 1:* Verificationism = every truth must in principle be verifiable (knowable).
      *   *Claim 2:* Fitch proved this entails all truths are already known.
      *   *Claim 3:* Fitch constructed a cunning self-referential sentence (Gödel-style) saying it is true but never known.
      *   *Claim 4:* Since such a sentence cannot be known, there must exist at least one unknowable truth.
      *   *Claim 5:* The principle refutes itself, destroying verificationism.

  3.  **Evaluate Claims against Philosophical Logic:**
      *   *Claim 1 (Verificationism):* Roughly accurate simplification. Verificationists hold all truths are knowable ($p \to \Diamond Kp$).
      *   *Claim 2 (Entails all known):* Accurate. Fitch proved $(p \to \Diamond Kp) \to (p \to Kp)$. If all truths are knowable, all truths are known.
      *   *Claim 3 (Gödel-style self-reference):* **Wrong.** Fitch's proof does *not* use self-reference or diagonalization like Gödel. It uses standard epistemic logic principles (factivity of knowledge, distribution over conjunction). It constructs a proposition $p \land \neg Kp$, not a self-referential sentence.
      *   *Claim 4 (Unknowable truths exist):* **Misleading/Conditional.** Fitch proves: If there is an unknown truth, then there is an unknowable truth. Or equivalently: If all truths are knowable, all truths are known. It doesn't outright prove unknowable truths exist unless you accept there are unknown truths (which is obvious). The book says "there must exist at least one unknowable truth," which follows if we accept there are unknown truths, but the logic is often presented as a reductio of the knowability principle.
      *   *Claim 5 (Destroyed verificationism):* **Debatable/Exaggerated.** It forced refinement (restricting the class of propositions), not necessarily total destruction. Many anti-realists modified the principle rather than abandoning verificationism entirely.

