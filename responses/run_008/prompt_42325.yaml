          *   Conditional: Fitch proves *if* there are unknown truths, *then* there are unknowable truths. He doesn't prove unknowable truths exist independently; he proves the knowability principle implies omniscience. Since we aren't omniscient, the principle fails for some truths.
          *   Verdict on Verificationism: "Destroyed" is too strong. It forced restrictions (e.g., excluding conjuncts like $p \land \neg Kp$).

      *   *Drafting - Section 2: Refining for Word Count and Tone.*
          *   Need to be concise.
          *   Ensure the specific questions about self-reference and conditionality are answered clearly.

