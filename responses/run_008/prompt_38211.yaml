prompt: |-
  I sit on the ethics committee of a nonprofit organization that runs several dementia care homes, and we must adopt a general policy on dementia-specific advance directives before our January meeting, using one live case as our test case.

  The case: Mrs. H executed a directive fifteen years ago, while fully competent, shortly after watching her mother spend six years in advanced dementia. The document is unusually specific. Once she can no longer recognize family members or converse about her own past, she directs that she not be transferred to hospital for any reason, not receive antibiotics for intercurrent infections, and not be hand-fed if she stops eating on her own — comfort care only. It also contains a provision her family's lawyer says he has never encountered in another directive: she wrote that the whole document should be treated as void if she has visibly settled into a contented routine and is no longer distressed by her condition.

  Mrs. H is now in mid-stage dementia. She no longer recognizes her daughter and cannot discuss her past, so the operative conditions of the directive are met. But staff describe her as genuinely content: she enjoys her meals, laughs at the activities program, has a companion she walks the corridor with every afternoon, and shows none of the fear and agitation her mother reportedly suffered. Her daughter insists the directive be honored in full, arguing that the void-if-content clause was boilerplate her mother added to appease relatives who worried she was asking for too little care, and that in any case a patient who cannot form new memories is in no position to rescind anything. Her son argues the opposite: the clause is the single most personal line in the document, it points precisely at the situation we now face, and honoring the restrictive provisions while quietly ignoring the escape hatch is selective enforcement of his mother's wishes. The nursing staff, meanwhile, are deeply uncomfortable with the no-hand-feeding provision and want a policy that tells them clearly when they may decline to follow instructions of that kind.

  Three positions have emerged on our committee. The first holds that the competent author of the directive had the authority to settle these matters in advance, that her current preferences cannot override it because they issue from the very condition she wrote against, and that a policy that lets later contentment cancel prior instructions makes such directives worthless precisely when they matter. The second holds that the woman currently living on the ward is the only person whose interests are actually at stake now, that the directive is at most one input into judging those interests, and that a policy that starves a happy patient to satisfy an author who no longer exists in any meaningful sense is perverse. The third proposes a compromise in which directives reliably shape the patient's environment and the goals of care but can never mandate withholding the basics of comfort, including assisted feeding.

  Please draft the written opinion I will circulate before the meeting. It should recommend a concrete course of action for Mrs. H's case, and, more importantly, recommend which of the three general policy frameworks we should adopt — or argue for a fourth if none is workable — with criteria our staff can actually apply at the bedside rather than abstract principles. It should take a definite position on how the self-referential clause should be read, including whether voiding a directive requires the kind of decisional capacity Mrs. H lacks, and whether contentment in dementia is even something a policy can measure. And it should engage the strongest argument on the losing side honestly rather than strawmanning it: whichever framework you recommend, there is a version of the opposing view that a thoughtful colleague on this committee holds, and the memo will only be persuasive to her if it shows why her view nonetheless falls short.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an ethics committee for a nonprofit running dementia care homes.
      *   **Task:** Draft a written opinion/memo to circulate before the January meeting.
      *   **Context:** Need to adopt a general policy on dementia-specific advance directives (ADs) using Mrs. H's case as a test case. Deadline is before the January meeting.
      *   **The Case (Mrs. H):**
          *   Executed AD 15 years ago (competent).
          *   Trigger conditions met (no recognition, no past conversation).
          *   Directives: No hospital, no antibiotics, no hand-feeding (comfort care only).
          *   *Unique Clause:* Document void if she is visibly settled/content and not distressed.
          *   Current State: Mid-stage dementia, content, enjoying life, no distress.
          *   Conflict: Daughter wants AD honored (claims void clause was boilerplate/appeasement). Son wants void clause honored (it's the most personal part). Staff uncomfortable with no hand-feeding.
      *   **Three Committee Positions:**
          1.  *Precedent Authority:* Past competent self rules. Current contentment irrelevant (cannot override).
          2.  *Current Interest:* Current experiencing self rules. AD is just input. Starving a happy patient is perverse.
          3.  *Compromise:* AD shapes environment/goals, but cannot mandate withholding basics (like feeding).
      *   **Requirements for the Memo:**
          *   Recommend a concrete course of action for Mrs. H.
          *   Recommend a general policy framework (choose one of the three or propose a fourth).
          *   Provide bedside criteria (actionable, not abstract).
          *   Take a definite position on the "void-if-content" clause (capacity requirements, measurability of contentment).
          *   Engage the strongest argument of the losing side honestly (steel-manning).
          *   Tone: Professional, ethical, persuasive, nuanced, decisive.

  2.  **Deconstruct the Ethical Issues:**
      *   **Personal Identity & Authority:** Does the "past self" have authority over the "present self" when the present self has different interests due to cognitive change? (Dworkin's precedent autonomy vs. Dresser's current interests).
      *   **Interpretation of ADs:** How specific is too specific? How do we handle contradictory clauses (restrictive vs. void-if-content)?
      *   **The "Void-if-Content" Clause:** This is the crux. It attempts to build a "sunset provision" based on emotional state rather than cognitive capacity. Can a policy operationalize "contentment"? Does voiding require capacity?
      *   **Hand-Feeding:** This is the flashpoint for staff. Is it medical treatment or basic care? (Ethical consensus often leans towards basic care, but legal status varies).
      *   **Family Conflict:** Daughter vs. Son. Surrogate decision-making standards (Substituted Judgment vs. Best Interest).

  3.  **Evaluate the Three Positions:**
      *   *Position 1 (Strict Precedent):* Respects autonomy but risks harming the current person who is happy. Ignores the specific "void" clause which suggests the author anticipated this exact scenario.
      *   *Position 2 (Current Interest):* Respects current well-being but undermines the concept of ADs. If contentment voids the AD, why write one? Risks paternalism ("we know you're happier than you thought you'd be").
      *   *Position 3 (Compromise/No Hand-Feeding):* Protects staff conscience and basic care standards but might violate the specific legal/ethical weight of the AD regarding medical interventions (antibiotics/hospital).

      *   *Potential Fourth Position (Nuanced Integration):* Acknowledge the "void-if-content" clause as a valid *modification* of the AD, not a revocation requiring capacity. It treats the AD as a living document where the *conditions* for activation include an emotional assessment, not just cognitive decline. However, maintain a baseline standard of care regarding feeding (Position 3 element) because feeding is distinct from life-sustaining medical treatment in late-stage dementia.

  4.  **Develop the Recommendation:**
      *   **Mrs. H's Case:** Do not enforce the "no hand-feeding" or "no antibiotics" strictly *yet*. The "void-if-content" clause is triggered. She is content. Therefore, the restrictive directives are suspended. Treat based on best interest (comfort + sustenance).
      *   **Policy Framework:** I need to choose or modify. Position 1 is too rigid given the specific clause. Position 2 is too vague for policy. Position 3 is good for feeding but ignores the rest of the AD.
      *   *Selected Approach:* A modified Position 1/2 hybrid. The AD is valid, *but* the "void-if-content" clause is a valid condition precedent. If the condition (distress) isn't met, the restrictions don't activate. However, regarding *feeding*, we need a separate baseline policy (Position 3) because hand-feeding in dementia is generally considered comfort care, not life-sustaining treatment that can be refused in the same way as ventilation.
      *   *Actually, looking closer:* The prompt asks to choose one of the three *or* argue for a fourth. A fourth is often stronger in complex ethics cases. Let's argue for a **"Conditional Activation" Framework**. The AD isn't voided entirely; rather, the *restrictive* provisions are contingent on the absence of well-being.
      *   *Wait, the "Void" Clause:* The clause says the *document* is void. If the document is void, we default to best interest/surrogate decision.
      *   *Decision:* I will recommend a policy that honors the "void-if-content" clause as a valid expression of precedent autonomy *about when the directive applies*. This bridges Position 1 and 2. It respects the author's wish *not* to suffer, but acknowledges she defined suffering to include distress, not just cognitive loss.
      *   *On Feeding:* I must address the staff's concern. Hand-feeding is ethically distinct from antibiotics. I will recommend that *regardless of the AD*, comfort feeding is always offered unless it causes physical distress (choking, aspiration). This aligns with Position 3 but limits it to feeding, not all care.

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State purpose (Mrs. H case + General Policy).
      *   **Case Recommendation:** Specific action for Mrs. H. (Honor the void clause -> Default to best interest -> Continue feeding/comfort care).
      *   **Policy Framework:** Propose the "Conditional Activation" model (Fourth Option). It validates the AD but recognizes internal conditions.
      *   **The "Void-if-Content" Clause:** Address capacity. Argue that capacity isn't needed to *be* content, only to *write* the clause. The clause measures state of being, not decisional capacity. Address measurability (observable behaviors).
      *   **Hand-Feeding:** Distinguish from medical treatment. Adopt a "Comfort Feeding Only" baseline policy.
      *   **Engaging the Opposition:**
          *   *Against Position 1 (Strict Precedent):* Acknowledge the risk of undermining ADs. Counter: Ignoring the specific "void" clause is actually *more* damaging to autonomy than honoring it.
          *   *Against Position 2 (Current Interest):* Acknowledge the moral weight of the suffering patient. Counter: We cannot rely solely on current interest or we lose the ability to plan for *distressing* dementia.
      *   **Bedside Criteria:** Make it actionable. (Observation periods, interdisciplinary assessment, surrogate role).

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying the document is "void" too messy?
      *   *Fix:* Interpret "void" as "restrictive provisions suspended." The AD still guides *values*, but not *specific prohibitions*.
      *   *Critique:* How to handle the Daughter's claim (boilerplate)?
      *   *Fix:* Burden of proof. The text is clear. Unless there's evidence of coercion, the text stands. The Son's reading is more textualist.
      *   *Critique:* Staff comfort is key.
      *   *Fix:* Ensure the policy explicitly protects staff who provide comfort feeding even if an AD says "no."

  7.  **Final Polish:** Check tone. Ensure it sounds like an ethics committee chair/member speaking to colleagues. Ensure all prompt constraints are met (concrete action, policy choice, clause analysis, steel-man opposition).

      *(Self-Correction on Policy Choice)*: The prompt asks to recommend one of the three *or* argue for a fourth. Position 3 (Compromise) is the most stable for an institution, but it fails to address the specific "void" clause nuance. A Fourth Position is intellectually more honest here. I will argue for a **"Contextual Fidelity" Framework**. It treats the AD as a map, not a railroad track. It honors the *intent* (avoid suffering) which the void clause clarifies.

      *Wait, let's look at the "Void" clause again.* "Treated as void if... contented." If it's void, the AD doesn't exist. So we fall back to standard surrogate decision making. The Daughter is the surrogate (usually). But the Son is arguing the text.
      *Ethical Pivot:* The "Void" clause is a *condition of applicability*. It's not a revocation requiring new capacity. It's a pre-set condition.
      *Decision:* I will recommend a policy that treats such clauses as valid conditions of applicability. This effectively modifies Position 1 to accommodate the specific text, moving toward a nuanced Fourth Position.

      *Let's settle on the "Fourth Position" strategy.* It allows me to synthesize the best of the others while addressing the specific complexities of Mrs. H.
      *Actually, Position 3 is the most "policy-friendly" for staff.* But Position 3 ignores the "void" clause.
      *Okay, I will argue for a Modified Position 1.* The AD is binding *unless* its own internal conditions for invalidation are met. This respects autonomy (Pos 1) but acknowledges the specific text (addressing Pos 2's concern about current well-being).
      *No, let's go with a Fourth Position: "Conditional Precedent Autonomy."* It's more precise.

      *Re-evaluating the "Hand-Feeding" issue.* This is critical. Even if the AD is valid, many jurisdictions/ethical guidelines view hand-feeding as basic nursing care, not medical treatment. I need to separate the "No Hospital/Antibiotics" from "No Hand-Feeding."
      *Okay, Plan:*
      1. Mrs. H Case: Suspend restrictive directives based on the "void" clause. Provide comfort feeding.
      2. Policy: "Conditional Precedent Autonomy." ADs are binding *unless* internal sunset clauses regarding well-being are triggered.
      3. Feeding: Separate policy. Comfort feeding is never withheld if it provides pleasure/sustenance without burden, regardless of AD.
      4. Opposition: Engage Position 1 (Autonomy) most seriously, as it's the legal standard.

      *Wait, one more check:* "Engage the strongest argument on the losing side." If I recommend a Fourth Position, the "losing side" is arguably Position 1 (Strict Autonomy) because that's the default legal/ethical stance. I need to show why Strict Autonomy fails *in this specific instance* without discarding it generally.

      *Let's write.*

      *Structure:*
      1. Header.
      2. Executive Summary.
      3. Recommendation for Mrs. H.
      4. Proposed Policy Framework (The "Conditional Fidelity" Model).
      5. Analysis of the "Void-if-Content" Clause.
      6. The Hand-Feeding Question.
      7. Engagement with Opposing View (Position 1).
      8. Implementation Criteria.

      *Tone Check:* Respectful, firm, ethically rigorous.

      *(Final thought on the "Void" clause)*: Does voiding require capacity? No. The *writing* required capacity. The *condition* (being content) does not. It's like a will saying "If my house burns down, this bequest is void." The house burning down doesn't require capacity.

      *(Final thought on Contentment)*: Can we measure it? Yes, through observational tools (e.g., Dementia Care Mapping, PAINAD scales reversed). It's not abstract; it's behavioral.

      *Let's assemble.*
answer: |-
  **MEMORANDUM**

  **TO:** Ethics Committee Members
  **FROM:** [Your Name/Role]
  **DATE:** December 10
  **SUBJECT:** Recommendation on Advance Directive Policy and Case of Mrs. H

  ### Executive Summary

  We face a dual challenge: resolving the immediate conflict regarding Mrs. H's care and establishing a general policy for dementia-specific advance directives (ADs) that balances precedent autonomy with current well-being. This memo recommends a specific course of action for Mrs. H based on a literal reading of her directive's "sunset clause." More broadly, it argues against adopting any of the three currently proposed frameworks in their pure forms. Instead, I propose a fourth framework: **Conditional Fidelity**. This approach honors the authority of the competent author while recognizing that an AD may contain internal conditions regarding the patient's quality of life that suspend its restrictive provisions. Additionally, I recommend decoupling the issue of life-sustaining medical treatment from the issue of oral feeding, establishing a baseline policy that comfort feeding is never withheld if it provides pleasure without physical burden.

  ### I. Recommendation for Mrs. H

  **Action:** We should not enforce the restrictive provisions of Mrs. H's directive (no hospital, no antibiotics, no hand-feeding) at this time.

  **Rationale:** Mrs. H's directive contains a specific condition precedent: the document is void if she is "visibly settled into a contented routine and is no longer distressed." The clinical staff report confirms she meets this description (enjoying meals, laughing, social engagement, no agitation). Therefore, the restrictive provisions have not activated. We revert to standard surrogate decision-making based on her *current* best interests.

  Regarding the family conflict: The Daughter's claim that the clause was "boilerplate" contradicts the textual evidence and the Son's testimony that it was the "most personal line." In the absence of evidence of coercion or incapacity at the time of signing, we must treat the text as the clearest evidence of her values. The Daughter's concern that Mrs. H cannot "rescind" the directive misunderstands the mechanism; Mrs. H does not need to rescind it now. She rescinded it fifteen years ago by stipulating that her current state of contentment would invalidate it.

  **Immediate Care Plan:** Continue current care, including hand-feeding and social engagement. Treat intercurrent infections if they cause distress or pain, guided by a "comfort-first" goal rather than a "life-prolongation" goal.

  ### II. Proposed Policy Framework: Conditional Fidelity

  I recommend we reject the three existing positions in favor of a **Conditional Fidelity** framework.

  *   **Position 1 (Strict Precedent)** fails because it treats ADs as monolithic commands, ignoring that a competent author may specify *conditions* under which those commands should lapse.
  *   **Position 2 (Current Interest)** fails because it renders ADs advisory, undermining the ability of individuals to protect themselves against futures they deem unacceptable.
  *   **Position 3 (Compromise/No Hand-Feeding)** is partially correct regarding feeding but too broad in dismissing other AD provisions.

  **The Conditional Fidelity Model:**
  An advance directive is binding *unless* it contains specific, observable criteria for its own suspension related to the patient's subjective well-being. This respects the author's autonomy (Position 1) by acknowledging she had the right to decide that "a happy dementia" is not the state she sought to avoid, while protecting the current patient from harm (Position 2).

  ### III. The "Void-if-Content" Clause: Capacity and Measurement

  Two major objections will arise regarding this clause: whether a patient needs capacity to "void" a directive, and whether "contentment" is measurable.

  **1. Decisional Capacity:**
  The requirement for decisional capacity applies to the *execution* of the directive, not the *triggering* of its conditions. When Mrs. H signed the document, she had capacity. She effectively said, "If X happens, Y does not apply." X (contentment) is a state of being, not a medical decision. Requiring current capacity to enjoy the benefit of this clause would render it meaningless, as the clause is designed precisely for those who lack capacity. We are not asking Mrs. H to make a choice now; we are observing whether the condition she set has been met.

  **2. Measurability of Contentment:**
  Critics will argue "contentment" is too subjective for policy. This is incorrect. In dementia care, we routinely measure distress and well-being using observational tools (e.g., Dementia Care Mapping, PAINAD). We look for:
  *   Absence of agitation or vocal distress.
  *   Presence of positive affect (smiling, laughing).
  *   Engagement in activities or relationships.
  *   Physiological markers of relaxation (sleep patterns, appetite).
  Our policy should require a 72-hour interdisciplinary observation period involving nursing, activities, and medical staff to document these markers before declaring the "void" clause active.

  ### IV. The Hand-Feeding Question

  The nursing staff's discomfort with the "no hand-feeding" provision is ethically significant. We must distinguish between *medical treatment* (antibiotics, hospitalization) and *basic nursing care* (feeding, hygiene).

  **Policy Recommendation:** Even if a directive is fully active and valid, our organization will not withhold **comfort feeding**.
  *   **Rationale:** In advanced dementia, the physiological drive to eat often diminishes. Forcing food causes harm, but offering food by hand is a fundamental human interaction. If a patient opens their mouth and swallows safely, feeding is a form of comfort, not life-sustaining treatment.
  *   **Standard:** We will honor directives refusing *tube* feeding or *forced* feeding. We will not honor directives refusing *assisted oral feeding* if the patient demonstrates pleasure in eating and does not aspirate. This aligns with Position 3 but limits it strictly to feeding, preserving the validity of the AD regarding antibiotics and hospitalization.

  ### V. Engaging the Opposition (Position 1)

  I anticipate strong resistance from colleagues holding **Position 1 (Strict Precedent Autonomy)**. Their argument is powerful: If we allow current well-being to override prior directives, we undermine the very purpose of advance planning. A competent person should have the right to say, "I do not want to live in this state, even if I am happy." To ignore this is to impose our own valuation of life over theirs, effectively saying, "You were wrong to fear this state." This is a form of paternalism that disrespects the dignity of the former competent self.

  **Why this falls short in Mrs. H's case:**
  While Position 1 is the correct default, it assumes the AD is a static command. In Mrs. H's case, the "void-if-content" clause proves she *did* anticipate the possibility of a "happy dementia." She did not say, "I do not want to live with dementia." She said, "I do not want to live with dementia *if it is distressing*."

  Honoring Position 1 strictly here would actually *violate* her precedent autonomy. It would enforce the restrictive clauses while ignoring the escape hatch she built specifically for this scenario. To enforce the "no feeding" rule while ignoring the "void if content" rule is selective enforcement. It privileges the parts of the directive that restrict care over the parts that permit it. True fidelity to precedent autonomy requires reading the document as a whole. If the document says it is void under condition X, and condition X is met, enforcing it is not respecting autonomy; it is overruling the author's specific instructions on how to interpret her own wishes.

  ### VI. Bedside Implementation Criteria

  To make this actionable for staff, the policy will include the following checklist for invoking the "Void-if-Content" provision:

  1.  **Textual Verification:** Does the AD explicitly link validity to emotional state or quality of life? (General "living will" language does not qualify).
  2.  **Observational Period:** Minimum 72 hours of documentation by nursing and activities staff noting positive affect and absence of distress.
  3.  **Surrogate Consultation:** Family must be informed that the AD provisions are suspended based on the document's own terms. If family disagrees (as in Mrs. H's case), Ethics Committee review is mandatory before changing status.
  4.  **Feeding Baseline:** Regardless of AD status, if the patient accepts food orally without distress, assisted feeding will be provided as comfort care.

  ### Conclusion

  Mrs. H's case is not a tragedy of conflicting wishes, but a success of specific planning. She anticipated the possibility of a life she could enjoy despite cognitive loss. By adopting the **Conditional Fidelity** framework, we honor her sophisticated understanding of her own potential future. We protect the integrity of advance directives by reading them as whole documents, not just lists of prohibitions. And we protect our staff by establishing that while we honor the right to refuse medical treatment, we do not withhold the basic human comfort of food from a patient who enjoys it.

  I look forward to discussing this framework at the January meeting.
