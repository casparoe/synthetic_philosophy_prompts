  8.  **Final Polish:** Check against the prompt's specific questions.
      *   View of history presupposed? (Progressive/Uniformitarian).
      *   Cyclical license? (Only if cycles are decoupled from property rights).
      *   Where does it stop being neutral? (The assumption of legal continuity and real growth).
      *   Spengler/Khaldun refusal points? (The end-stage expropriation/loss of meaning).
      *   Underdetermined? (No, it requires more than just "no ruin").
      *   Induction aside? (Integrate as the "survivor bias of the regime").

  9.  *(Final Review of the Output)*: Ensure the distinction between *market volatility* (which the glidepath manages) and *regime volatility* (which the glidepath ignores) is clear. That's the philosophical crux.

