  3.  **Evaluate Historical Models against the Practice:**

      *   **Linear/Progressive (Whig/Enlightenment/Marxist-technocratic):**
          *   *Fit:* High. Assumes technological progress, productivity gains, and institutional stability lead to perpetual growth.
          *   *Commitment:* The future is structurally better than the past.
          *   *Bite:* If progress halts (secular stagnation), the model fails.

      *   **Cyclical (Polybius/Ibn Khaldun):**
          *   *Fit:* Moderate/Conditional. If cycles are shorter than 40 years, averages might work.
          *   *Commitment:* Stability of the *system* despite political turnover.
          *   *Bite:* Ibn Khaldun's cycle is generational (3-4 generations = 120 years). A 40-year horizon might catch a specific downward leg (asabiyyah loss) that doesn't recover within the investor's lifetime. Polybius's *anacyclosis* involves regime change that could expropriate capital.

      *   **Morphological/Declinist (Spengler/Toynbee):**
          *   *Fit:* Low/Hostile.
          *   *Commitment:* Civilizations have life cycles (birth, growth, decay, death).
          *   *Bite:* Spengler's "Winter" phase. If we are in the Civilization phase (decline), capital becomes parasitic, not productive. Real returns might vanish or be confiscated during the Caesarism phase. Toynbee's "Time of Troubles" could wipe out the index.

      *   **Underdetermined View ("No Permanent Ruin"):**
          *   *Fit:* High.
          *   *Commitment:* Continuity of the specific legal/economic entity (the Index/Market) for 40 years.
          *   *Bite:* It's not about *growth* per se, but about *continuity of valuation*.

  4.  **Address the "Past Performance" Induction Issue:**
      *   The industry says: "Markets always recover."
      *   The Philosopher says: "That's induction based on a sample size of one (the Holocene/Capitalist era)."
      *   *Relevance:* This smuggles in a Uniformitarian assumption (future laws = past laws). It assumes the *rules of the game* won't change, only the scores.

  5.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. It *is* a metaphysical bet.
      *   **The Core Presupposition:** It's not just growth; it's *compoundability*. It requires a specific ontology of capital.
      *   **Linear vs. Cyclical:**
          *   Linear fits best (Whig).
          *   Cyclical *can* fit but requires the cycle to be amortized.
          *   *Crucial distinction:* Cyclical theories usually imply political rupture. Pension funds assume legal continuity.
      *   **The Spenglerian/Ibn Khaldun Objection:**
          *   Where do they say "No"?
          *   Spengler: Money vs. Blood. In late civilization, money loses meaning to force.
          *   Ibn Khaldun: Taxation/Expropriation at the end of the dynasty cycle.
          *   Specific bite point: The *Glidepath*. It assumes bonds are "safe." In a civilizational collapse, bonds are worthless paper. Equities are claims on assets that might be seized.
      *   **The "No Permanent Ruin" Hypothesis (Underdetermination):**
          *   Is it just "no apocalypse"?
