  The Patent Office's refusal to review perpetual motion claims without a working model treats conservation of energy as exceptionless. This aligns neatly with a "governing" view of laws, where constraints hold with metaphysical necessity. If laws govern, exceptions are impossible, making the policy ontologically grounded.

  However, this doesn't strictly rule out Humeanism. For a Humean, laws are the best summary of actual events. Since no perpetual motion machine exists in the cosmic mosaic, the law holds. The policy isn't a claim about metaphysical impossibility but a pragmatic bet on induction. The examiner reasons, "Given the entire history of facts, the probability of a new fact contradicting the best system is negligible." The shift from "hasn't happened" to "won't happen" is administrative efficiency, not philosophical commitment. Thus, the practice is underdetermined: both views license the rejection, one via necessity, the other via overwhelming empirical regularity. The policy **strictly needs** only that the regularity is robust enough to justify ignoring outliers; it doesn't demand *why* it's robust. It requires high confidence, not metaphysical necessity.

  Regarding physicists discussing alternate laws: this isn't inconsistent. Physicists explore nomological possibility across possible worlds (metaphysical modality). The Patent Office adjudicates actuality within this world (empirical modality). Physicists ask, "Could laws be different?" The Office asks, "Are laws different here?" The Office treats local laws as fixed constraints for practical purposes, while physics treats them as variables for theoretical exploration. The physicist's modality is counterfactual; the examiner's is actual.

  Ultimately, the rule **sits comfortably** with governing laws but doesn't demand them. It relies on the stability of the mosaic, not necessarily its governance. The Humean examiner isn't lying; he's just compressing the prediction "no violation will occur" into the shorthand "violations are impossible" for bureaucratic utility. The policy presupposes stability, not necessarily governance.
