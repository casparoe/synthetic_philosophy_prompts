answer: |-
  This is a classic formulation of **Pascal's Mugging**, refined with the specific counter-arguments (utility capping, probability thresholding) that are commonly discussed in decision theory circles (particularly the LessWrong community). Your brother has presented a "hard mode" version of the problem that anticipates the standard defenses.

  You want to keep premise (1) (Expected Utility Maximization). You are right to be suspicious of the "Checkmate" (reflective inconsistency).

  Here is the diagnosis: **The flaw lies in the implicit assumption within Step (3) regarding how rational priors scale with the magnitude of the claim.** Specifically, it assumes that logical consistency is the only constraint on probability, ignoring the relationship between *leverage* and *complexity*.

  To block the argument while keeping Expected Utility (EU) maximization, you must reject the idea that a "rational prior" is merely any non-zero number assigned to a consistent hypothesis. You must adopt a **Leverage Penalty** on your priors, and you must shift from **Act-Based** to **Policy-Based** decision theory.

  Here is the breakdown of why the step looked fine, the view you must adopt to fix it, and the honest price you pay.

  ### 1. The Flaw: Step (3) and the Nature of Priors

  **Why it looked fine:**
  Step (2) invokes Cromwell's Rule: *never assign probability zero to a falsifiable or consistent claim.* This is usually excellent advice. It prevents dogmatism and ensures you can update your beliefs when presented with overwhelming evidence. It feels robust to say, "I can't prove the mugger *isn't* a simulation controller, so $P > 0$." Step (3) then simply does the arithmetic: if $P > 0$ and Utility is unbounded, there exists some $N$ where $P \times N > \text{Wallet}$.

  **The Rejection:**
  You must reject the assumption that the prior probability $P$ is independent of the magnitude $N$ in a way that allows $P \times N$ to diverge.
  A rational prior is not just about *logical possibility*; it is about *algorithmic complexity* (Solomonoff Induction). To hypothesize that a specific street person has causal leverage over $3 \uparrow\uparrow\uparrow 3$ other beings is an immensely complex hypothesis, even if the *sentence* describing it is short.

  **The Required View: The Leverage Penalty**
  To keep EU maximization, you must adopt a prior where the probability of having leverage over $N$ entities decreases at least as fast as $1/N$.
  *   **The Logic:** There are many more ways to be a person with *no* special leverage than a person with *special* leverage. As the scope of leverage ($N$) grows, the specific computational description of the world required to make *you* the pivot point for that much value becomes exponentially more complex.
  *   **The Math:** If the disutility grows linearly with $N$ (or even exponentially), your prior probability $P(N)$ must shrink faster than the utility grows. If you assign $P(N) \approx 1/N^2$, then the Expected Utility $\sum P(N) \times N$ converges to a finite sum. The mugger can name a larger number, but the probability drops fast enough that the expected value never exceeds the cost of your wallet.

  **Does this survive the "Splitting" objection?**
  Your brother argued: *If you cap utility, I split the threat. If you round probability, I split the risk.*
  The Leverage Penalty survives this because the penalty applies to the **causal mechanism**, not the **utterance**.
  *   The hypothesis is not "The mugger says $N$."
  *   The hypothesis is "The mugger *controls* $N$."
  Whether the mugger threatens to torture $N$ people at once or in a million batches, the hypothesis regarding their *power* (their leverage) remains the same. The complexity of "Mugger is a Simulation God" does not decrease because they threaten to use their power piecemeal. Therefore, the prior $P$ remains low enough to offset the total sum of utilities.

  ### 2. The "Checkmate": Act-Based vs. Policy-Based EU

  Your brother's final move is the strongest. He argues that if you follow EU case-by-case, you get a worse outcome than if you refuse. He claims this proves EU is inconsistent.

  **The Rejection:**
  This does not prove EU is inconsistent; it proves that **Causal Decision Theory (CDT)** applied to individual acts is inferior to **Updateless Decision Theory (UDT)** or **Policy-Based EU** applied to algorithms.

  *   **Act-Based (The Trap):** "Given that I am here, and the mugger is here, what maximizes EU *now*?" (Answer: Pay.)
  *   **Policy-Based (The Escape):** "What decision *algorithm* or *disposition* should I have adopted *before* I knew I would meet a mugger?" (Answer: Refuse.)

  **The Required View:**
  You must view rationality as maximizing expected utility over **policies** (functions from observations to actions), not **actions** in isolation.
  When you evaluate the policy "Always pay muggers who name large numbers," you must include the probability of encountering such muggers. Since adopting this policy *causes* muggers to congregate around you (as your brother noted), the lifetime EU of that policy is negative. The policy "Refuse all street muggers" has higher lifetime EU.

  Therefore, EU maximization *does* dictate refusal, provided you are maximizing the EU of your **decision procedure**, not just the immediate act. This resolves the reflective inconsistency.

  ### 3. The Honest Price

  You asked what adopting this costs you. It is not free.

  **Cost 1: Skepticism of High-Impact Speculation**
  Adopting a Leverage Penalty means you must be deeply skeptical of any charitable or political cause that relies on "low probability, astronomical impact."
  *   **Example:** If someone argues, "Donate to my charity; there's a 1 in a billion chance we prevent an existential risk that saves $10^{20}$ lives," a Leverage Penalty demands you ask: *Is the probability of this specific intervention working actually $10^{-9}$, or is it lower because of the complexity of the causal chain?*
  *   **The Burden:** You lose the ability to easily justify "Pascal-esque" altruism. You must demand robust causal mechanisms, not just large numbers. This makes "Longtermism" and existential risk mitigation harder to justify mathematically unless the probabilities are grounded in empirical evidence rather than logical possibility.

  **Cost 2: Cognitive Complexity (UDT)**
  Shifting from Act-Based to Policy-Based EU is cognitively demanding.
  *   **The Burden:** You can no longer just ask "What works best right now?" You must ask "What kind of agent should I be?" This requires pre-commitment and sometimes acting against your immediate apparent self-interest (refusing the mugger even when the immediate math says pay) to maintain the integrity of the policy that protects you.
  *   **The Risk:** It opens the door to "fanaticism" in the other direction. If you pre-commit to a policy, you must be sure the policy is correct. It requires a higher level of metacognitive stability.

  **Cost 3: Abandoning "Pure" Logical Consistency as a Prior Guide**
  You are effectively admitting that "Logical Consistency" is too weak a filter for probability.
  *   **The Burden:** You must accept that some logically consistent hypotheses are *computationally* so complex that they are effectively impossible for practical decision making, even if they aren't strictly probability zero. You are introducing a heuristic (complexity/leverage) into the heart of your "rigorous" calculation.

  ### Summary Recommendation

  To keep (1) and save your wallet:

  1.  **Reject Step (3)'s implicit prior:** Assert that a rational prior must include a **Leverage Penalty**. The probability of a hypothesis where you have causal influence over $N$ beings must scale $\le 1/N$. This blocks the math from ever favoring the mugger, regardless of the number named.
  2.  **Reframe the "Checkmate":** Accept that your brother has proven **Act-Based** EU is flawed, not EU itself. Adopt **Policy-Based EU** (or UDT). Rationality requires you to choose the disposition "Refuse Muggers" because that disposition has higher expected utility over your lifetime.
  3.  **Pay the Price:** Accept that this makes you skeptical of speculative, high-stakes claims (limiting some forms of altruism) and requires you to think of yourself as a "type of agent" rather than a series of disconnected choices.

  Your brother is right that *naive* rationality fails here. But sophisticated rationality (Complexity Priors + Policy Selection) survives. You don't have to hand over the wallet.
