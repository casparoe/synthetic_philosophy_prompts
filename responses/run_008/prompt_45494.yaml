answer: |-
  This is a fantastic conflict because it pits **epistemic truth** (what happened) against **social truth** (what binds us). You are tapping into a very real sociological phenomenon known as "The Invention of Tradition," famously cataloged by historian Eric Hobsbawm. He documented how many "ancient" national and local rituals (Scottish kilts, British royal ceremonies, Alpine folk festivals) were actually codified in the late 19th or early 20th centuries to create cohesion in rapidly changing societies.

  Here is a breakdown of how to handle the philosophy, the sociology, and the specific texture of the town's reaction, keeping both your protagonist and her mother dignified and correct in their own ways.

  ### 1. The Philosophical Standoff: Who is Right?

  Neither is wrong, but they are speaking different languages.

  **The Daughter (The Historian): Truth as Integrity**
  *   **Her Argument:** Identity built on a lie is fragile. If the town's soul is a marketing slogan from 1934, then the town is essentially a theme park. She isn't being pedantic; she is being **existentially anxious**. She fears that if the foundation is fake, the community has no anchor when things get hard.
  *   **The 1930s Nuance:** In the Tyrol, the 1930s weren't just about tourism. This was the era of Austrofascism and the rise of National Socialism. Folk culture (*Volkstum*) was heavily politicized to define "who belongs." The daughter might suspect the procession wasn't just about money, but about signaling a specific, exclusionary kind of local identity. Her desire to expose it is a desire to cleanse the town's conscience.
  *   **Her Validity:** Authenticity matters. If you love your home, you want it to be real.

  **The Mother (The Hotelier): Truth as Function**
  *   **Her Argument:** She isn't being cynical; she is being **pragmatic and communal**. To her, the "truth" of the procession isn't in the parish register; it's in the blisters on the walkers' feet, the shared cold at the summit, and the money that keeps the school open.
  *   **The "We":** She understands that community is a collective hallucination. We agree to believe in the same stories so we don't have to live as strangers. If the story works, it *is* true in the only way that matters socially.
  *   **Her Validity:** Meaning is generated by participation, not provenance. A wedding vow is "just words," but the commitment makes them real. The procession is the same.

  **The Synthesis:**
  The ritual *was* fake, but it *became* real through repetition. The first year was a lie. The fiftieth year was a habit. The eightieth year (now) is heritage. The mother knows that exposing the origin doesn't change the lived experience of the last 80 years.

  ### 2. The Sociological Reality: How Towns React

  You are correct that people rarely drop a ritual because they learn it's invented. It is too costly socially and economically. However, they don't just "ignore it." They **renegotiate the narrative.**

  **The Most Plausible Reaction: The "Soft Landing"**
  If the daughter publishes her findings, the town will not riot, nor will they cancel the procession. They will absorb the shock through a process of rationalization.

  *   **Phase 1: Shock/Defensiveness.** The older generation gets angry. "You're spitting on our memories."
  *   **Phase 2: Reframing.** The narrative shifts from "Ancient Rite" to "Legacy of the Grandparents." The 1930s origin stops being a scandal and becomes part of the lore. *"Yes, it started in the 30s, but look how it survived the war, the tourism boom, the modernization. That's the real miracle."*
  *   **Phase 3: Integration.** The date is quietly adjusted in the brochures, or the language changes from "centuries-old" to "traditional." The procession continues, but the *mythology* surrounding it matures.

  **The "Open Secret" Texture**
  In small towns, secrets rarely stay binary (known/unknown). It becomes an **open secret**. Everyone knows the historian found something. Everyone knows the procession isn't medieval. But during the procession itself, everyone agrees to suspend that knowledge. To speak of it during the event would be a taboo, not because it's false, but because it's *rude*. It ruins the mood.

  ### 3. The 3 Generations vs. 300 Years Question

  Is there a principled difference? **No, but there is a psychological one.**

  *   **The Line is Arbitrary:** Sociologically, three generations is often enough for "living memory" to fade into "myth." By the time the inventors' grandchildren are running the show, the *reason* for the invention is forgotten, leaving only the *act*.
  *   **The "Vintage" Threshold:** The town draws the line where it needs to. If the procession were 300 years old, the daughter would still be "right" that it might have been invented in year 299, but the weight of time makes the inquiry seem petty. With 3 generations, the inventors might still have names on gravestones in the churchyard. That makes it feel like a "con" rather than a "tradition."
  *   **The Fix:** The town will likely argue that 80 years *is* enough. "My father carried that torch. His father carried that torch. That is old enough for me."

  ### 4. Staging the Argument (Avoiding Strawmen)

  To make this scene sing, avoid having them argue about facts (they both know the facts now). Have them argue about **love** and **stewardship**.

  **The Mother's Beat:**
  She shouldn't say, "It brings in money." She should say, "When the flood washed out the bridge in '99, who organized the repair? The Procession Committee. When the school was going to close, who raised the funds? The Procession Fund. You call it a lie. I call it the glue. If you pull that thread, the sweater unravels. Do you love the truth more than you love these people?"

  **The Daughter's Beat:**
  She shouldn't say, "It's historically inaccurate." She should say, "I love them enough to want them to stand on solid ground. If our pride is based on a trick, what happens when the next historian comes along? I don't want us to be a joke. I want us to be real. Even if being real is harder."

  ### 5. Narrative Possibilities for the Aftermath

  Here are three textures for how the town reacts, ranging from subtle to complex:

  **Option A: The Benevolent Assimilation (Most Realistic)**
  The town council meets. There is tension. Eventually, the Priest (a pragmatist) suggests a theological pivot. "The spirit does not depend on the date." The brochure text is changed from "Ancient Tradition" to "Town Heritage since 1934." The procession happens. It feels slightly different—lighter, perhaps. The burden of "antiquity" is lifted. The town survives, humbled but intact.

  **Option B: The Schism (More Dramatic)**
  The town splits. The "Purists" (younger, outsiders, some intellectuals) stop participating, viewing it as kitsch. The "Traditionalists" (locals, business owners) double down, treating the historian as a traitor. The procession continues but loses its magic because the tension is palpable. This explores the cost of truth.

  **Option C: The "Sacred Lie" (Most Philosophical)**
  The town finds out, but collectively agrees *not* to talk about it. The daughter publishes, but the local paper buries it. The mother doesn't fight the daughter; she just pities her. "You want to be right," she says. "I want us to be together." The procession goes on, but now the daughter participates knowing the secret. She has to decide if she can carry the torch knowing it's a "fake." This internalizes the conflict.

  ### Recommendation for Texture

  I suggest **Option C with elements of A**.

  Let the town react with a weary, collective shrug. Not a scandal, but a sigh. The "shock" is mostly in the daughter's head. She expects the world to shatter; instead, the world absorbs the stone.

  *   **The Visual:** The procession happens. The daughter is marching. She looks at the torch. It's just a stick and rag. But the person next to her is shivering, and they lean together for warmth. That warmth is real. The stick is fake. The warmth is real.
  *   **The Resolution:** The mother doesn't win, and the daughter doesn't win. The town evolves. They stop claiming it's medieval. They start celebrating the *resilience* of the tradition. "We kept this going for 90 years through war and peace." That is a true statement.

  This allows you to avoid farce (nobody looks ridiculous) and tragedy (nobody is destroyed). It becomes a story about **maturity**: the town growing up enough to admit it isn't ancient, but is still worthy of respect.
