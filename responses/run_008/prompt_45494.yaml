      *   *Is it less real?* Philosophically, no. Sociologically, no. Psychologically, maybe for the discoverer. The *experience* is real even if the *origin story* is fake.
      *   *Who is right?* Both. Daughter is right about *truth/facts*. Mother is right about *meaning/social cohesion*.
      *   *Town Reaction?* Most likely: Initial shock, then rationalization, then continuation. Maybe a shift in narrative ("Resilience" instead of "Antiquity").
      *   *3 generations vs. 300 years?* Arbitrary line. 3 generations is often enough for "living memory" to fade into "myth."

  4.  **Develop the Argument (Daughter vs. Mother):**
