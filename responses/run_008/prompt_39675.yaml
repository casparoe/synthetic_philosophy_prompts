          *   *Cats:* The "terrible old cats." They are agents in the web.
          *   *Husband:* The anchor relation.

      *   **The Climax/Turn:** Why does this matter? Why is this warm?
          *   *Idea:* Because structures endure. Intrinsic things rot; relations persist.
          *   *Refinement:* Her retirement isn't an end because the structure remains. We are carrying the structure forward.

      *   **Closing:** A raise of the glass.
          *   *Idea:* To the structure.
          *   *Refinement:* To the relations that constitute her. To the network.

  4.  **Drafting - Iteration 1 (Mental Outline):**
