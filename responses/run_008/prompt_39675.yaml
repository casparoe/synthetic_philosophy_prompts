  2.  **Deconstruct the Philosophy (OSR) for the Toast:**
      *   *The Trap:* Traditional toasts praise the *person* (intrinsic qualities: kind, smart, generous).
      *   *The OSR Fix:* Praise the *node* in the network. She is the intersection of lines. She is defined by what she connects.
      *   *The Risk:* Sounding cold or robotic.
      *   *The Solution:* Use the relational language to express deep affection. The relations *are* the reality. If the relations are strong, *she* is real.

  3.  **Drafting - Section by Section:**

