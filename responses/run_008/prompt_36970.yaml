answer: |-
  # HANDOUT: The Badness of Pain — A Diagnostic Tree
  **Goal:** Locate your intuition about *why* pain sucks. Start at the top. Answer based on the concrete case, not the theory name.

  ### **START: The Asymbolia & Morphine Split**
  **Q1.** Consider the asymbolic patient (or high-dose morphine): they report the sting is sharp and intense (7/10) but smile and say, "It doesn't bother me." **Is the *pain* fully present, just stripped of its 'badness,' or is the 'badness' part of the pain itself?**
  *   **(A) Stripped:** The sensation is the same; the suffering is missing. → *Go to Q2.*
  *   **(B) Part of It:** If the suffering is missing, it's not really pain anymore. → *Go to Q3.*

  ---

  ### **PATH A: The "Separatist" Route (Badness is an Add-On)**
  **Q2.** Consider the **Deep-Tissue Massage**: the sensation feels like damage, but you welcome it. **Is the 'badness' missing because you changed your *attitude* toward the sensation, or because the sensation changed its *ownership* (e.g., The "Weather Report" case: it feels like someone else's body)?**
  *   **(A) Attitude:** It's about my reaction (liking/disliking). → *Go to Q4.*
  *   **(B) Ownership:** It's about whether I identify with the body part. → **LEAF: Conditional Introspectionism**

  **Q4.** Is your negative reaction a stable **judgment** ("This is bad for me") or a brute **feeling** ("I want this to stop")?
  *   **(A) Judgment:** It's a cognitive evaluation. → **LEAF: Pure Perceptual/Attitudinal Theory**
  *   **(B) Brute Feeling:** It's a non-cognitive urge. → **LEAF: Hybrid Separabilism** *(Unoccupied/Unstable: Why call it 'pain' if not for the urge?)*

  ---

  ### **PATH B: The "Unified" Route (Badness is In the Content)**
  **Q3.** Consider the **Stoic/Masochist**: they feel the full sting and accept it as "theirs," but refuse to act on it. **Does the pain issue a *command* ("Stop this!") that they are disobeying, or make a *claim* ("This is bad!") that they are rejecting?**
  *   **(A) Command:** It tells the body what to do. → **LEAF: Imperativism**
  *   **(B) Claim:** It describes the body's state. → **LEAF: Evaluativism**

  ---

  ### **THE LEAVES: Your Commitment**
  1.  **Conditional Introspectionism:** "Pain isn't bad until you actively dislike it."
  2.  **Pure Perceptual/Attitudinal:** "You can feel the full sting of pain without minding it in principle."
  3.  **Hybrid Separabilism:** "The urge to stop is separate from the hurt, yet defines it." *(Note: Theoretically unstable)*
  4.  **Imperativism:** "Your body is screaming orders at you that you are free to ignore."
  5.  **Evaluativism:** "Pain can literally lie to you about how damaged you are."

  ---

  ### **PHILOSOPHER'S NOTES & JUSTIFICATION**

  **1. Branch Ordering Logic:**
  I placed **Q1 (Asymbolia)** first because it is the "intuition pump" that shattered the traditional view. If you think the asymbolic patient feels *pain* without *suffering*, you are forced into Path A (Separatism). If you think they feel a *neutral sensation* that isn't truly pain, you are forced into Path B (Unified Content). This prevents the "talking past each other" error from last session.

  **2. The "Weather Report" Case (Depersonalization):**
  I placed this at **Q2** to isolate **Introspectionism**. Most theories assume pain is "mine" by default. The depersonalization case suggests badness relies on *self-identification*, not just sensation or evaluation. This is a distinct branch from simple "attitude" (liking/disliking).

  **3. Unoccupied Combinations:**
  *   **Hybrid Separabilism (Leaf 3):** This is the "unstable" leaf. If badness is separate from sensation (Path A) but is a brute feeling rather than a judgment (Q4-B), it's hard to explain why it motivates action without collapsing into Imperativism. I included it to show where the logic leads if you resist cognitive judgment.
  *   **Inseparable + Attitudinal:** This combination is incoherent (you can't have an attitude *toward* something that is inseparable *from* it). The tree prevents you from landing here.

  **4. The Imperativism vs. Evaluativism Split (Honesty Check):**
  You suspected these two end up at the same leaf. You are mostly right. Asymbolia and Morphine cases **cannot** split them; both theories claim the "badness" is intrinsic to the experience (Path B).
  *   **The Only Splitter:** The **Stoic/Masochist** case (Q3).
  *   **Why:** Evaluativism says pain asserts a truth ("This tissue damage is bad"). Imperativism says pain issues a directive ("Stop this!"). You can reject a truth claim (Stoic), but you can also disobey a command (Masochist/Stoic).
  *   **Warning:** This distinction is metaphysical, not phenomenological. In a reading group, expect students to say, "What's the difference between a command and a claim of badness?" The answer is: *disobedience*. If you can feel the pain and rationally choose not to stop it, Imperativism has to explain how a command lacks authority. Evaluativism has to explain how a representation can be false (phantom pain).

  **5. Why "Normal Person" Commitments?**
  Notice no question asks "Is pain representational?" They ask about massages, morphine, and weather reports. This forces students to commit to the *phenomenology* first, then see which theory accommodates it, rather than picking a team and finding cases to fit.
