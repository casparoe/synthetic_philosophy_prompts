prompt: |-
  I run a philosophy of mind reading group (8 people, mix of grads and devoted undergrads) and last session on pain asymbolia was a trainwreck — everyone just talked past each other about whether pain is essentially bad. I want to fix the next session with a decision-tree handout: it should start from commitments any normal person has about their own pain, and walk branch by branch down to a named position on what the badness of pain consists in.

  Act as a professional philosopher of mind who's published on this stuff. Please brainstorm the logical space before committing to a tree — the branch ordering matters a lot here, since some of my cases presuppose answers to others. Branch nodes must be concrete cases a thoughtful person with zero philosophy background could answer: the asymbolic patient who reports pain but genuinely doesn't mind it; the morphine patient who says 7/10 but seems totally unbothered while reporting it; painful pleasures like a brutal deep-tissue massage you'd scream at if you weren't paying for it; my own favorite case, a patient who says the pain is still there, exactly as intense, but now feels like someone else's weather report. No question may name a theory or school.

  Leaves must include: imperativism (pain as a bodily command), evaluativism (pain as representation of bad bodily condition), pure perceptual/discriminative theories where badness is a separate attitudinal add-on, and conditional introspectionism if you think it deserves a leaf. Also flag any unoccupied combinations — is nobody there because the combo is incoherent, or just unpopular? And be honest about pairs the tree can't split: I suspect imperativism and evaluativism end up at the same leaf on most of my cases, so if they do, say what case (if any) would actually separate them, even if I can't use it in the tree.

  Keep it to a one-page handout, ~8 branch nodes max, one sentence per leaf on its most awkward commitment. Think carefully and don't just transcribe the stanford encyclopedia entry — I want YOUR tree, with the choices justified briefly at the end.
