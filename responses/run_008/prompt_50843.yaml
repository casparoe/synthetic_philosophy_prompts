prompt: |-
  My brother-in-law and I have been arguing about quantum immortality for going on two years now, mostly over text during family holidays, and we've finally decided to actually write down where we stand instead of lobbing the same three points at each other. For context on the two camps: he's a committed Everettian who thinks the quantum suicide / quantum immortality argument basically works -- that in a genuinely quantum-random fatal event, there will always be some branch where the gun misfires, and so "you" should expect to keep finding yourself on a surviving branch, in a way that doesn't hold for classical randomness. I'm also fine with many-worlds as an interpretation, but I think quantum immortality is a misapplication of it, roughly an anthropic sleight of hand where you condition on surviving and then act surprised that you survived. So note that we're NOT arguing about Copenhagen vs. Everett -- we both accept the branching structure -- the fight is entirely about what, if anything, an observer embedded in that structure should expect and how they should reason.

  We tried drafting this ourselves at Thanksgiving and it turned into a mess, so I want you to draft the adversarial-collaboration-style document we should have produced. Please give me: (1) a numbered section of claims we can both sign off on, including about the physics itself (decoherence, branching, what a quantum-random death event would even look like); (2) a disagreements table where each disagreement is worded so that the side who holds the view would actually accept the wording -- this is where we kept failing, one of us would always sneak in something slanted; (3) the cruxes, and for each crux a concrete argument, thought experiment, or line of reasoning we'd both agree bears on it, with each side's prediction or expected conclusion written down in advance. Some threads you should make sure get addressed somewhere, because they're where our fights always end up: whether the surviving branches are ones you'd want to be in (he tends to wave away the "you survive as a vegetable" branches, and I think that's exactly where the argument breaks); whether death is ever a sharp enough outcome that you can condition on not observing it, given that dying is usually a slow decohering process in a hospital rather than a clean binary outcome; whether the move he makes -- "you can't experience your own death, so subjectively you never do" -- is doing legitimate decision-theoretic work or just conflating "you will experience survival in some branch" with "you should expect to survive"; and whether quantum chance is actually special here or whether his argument, if it worked, would also "prove" immortality from ordinary Russian roulette run enough times. If you think part of our dispute is purely verbal, say which part and why -- he suspects our disagreement about what "expect to survive" means is worse than our substantive one, and I half believe him.

  Keep it in American English please (I noticed when drafting we kept mixing "whilst" and British spellings in from stuff we'd read online, don't do that). And try to make neither of us a strawman -- he's a smart guy, and honestly his position is more defensible than the way pop-science articles present it. If it helps to have a target: the document should be something we could both read aloud at New Year's and grudgingly say "yeah, fine, that's what I think."
reasoning: |-
  Here's a thinking process that leads to the suggested document:

