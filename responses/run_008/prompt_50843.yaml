      *   **Participants:** User (Skeptic of Quantum Immortality, accepts MWI) vs. Brother-in-Law (BIL) (Proponent of Quantum Immortality, committed Everettian).
      *   **Core Dispute:** Not about MWI vs. Copenhagen (both accept MWI/branching), but about *self-locating uncertainty*, *anthropic reasoning*, and *decision theory* within MWI. specifically regarding "Quantum Immortality" (QI).
      *   **Goal:** An adversarial-collaboration-style document.
      *   **Requirements:**
