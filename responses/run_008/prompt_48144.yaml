  I listened to a pop science podcast last week where the host explained costly signaling and the handicap principle, and I've been repeating it to people since, but I want to check it before I keep doing that. Here's roughly what he said:

  'For a long time, Darwinians had an embarrassment: animal signals. If a peacock can fake a signal, cheaters should invade and the signal should degrade into noise. Amotz Zahavi solved this in the 1970s with the handicap principle: signals are honest precisely because they're costly. A peacock's tail is expensive to grow, carry around, and escape predators with, so only a genuinely fit male can afford one -- the cost filters out the fakers. The key insight is that the cost is not a bug but the whole point: the more wasteful the signal, the more you can trust it. Game theorists later proved Zahavi was right, and the principle is now known to apply to essentially all animal signaling, from stag roars to bright warning colors to human status displays like luxury goods. So whenever you see an animal (or a person) doing something pointlessly extravagant, that extravagance is a guarantee of quality.'

