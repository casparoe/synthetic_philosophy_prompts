  As a science journalist preparing a piece on the formal foundations of Occam's razor, I need a sharply argued dissenting voice to quote in my article. Please argue that Solomonoff induction does not, in fact, vindicate Occam's razor for any question a finite agent could ever actually face. Ground the argument in the gap between what the invariance theorem guarantees — that changing the reference universal Turing machine alters Solomonoff's prior assignments only up to an additive constant — and what such constants are like in practice: they can be larger than any evidence a bounded reasoner will ever accumulate, so that which hypothesis counts as "simpler" is an artifact of an arbitrary choice of machine. You may bring in uncomputability and the fact that Solomonoff's predictor is a mixture over all computable hypotheses rather than a selection of the simplest one, but the reference-machine problem should carry the argument, and you should say explicitly why appealing to a "natural" or "human-friendly" machine smuggles the very notion of simplicity back in as an unargued premise. Please keep your response to a maximum of 350 words.
