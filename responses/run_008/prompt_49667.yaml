  *   **Reasoning:** The filter is the electric shock (real world).

  **3. The Rat / Observation (User: Popperian | Brother: Skinnerian)**
  *   **Verdict:** **Overturn to Skinnerian.**
  *   **Reasoning:** I side with your brother. Vicarious learning is still operant conditioning. Unless the rat constructs a counterfactual model ("*If* I had gone left, I *would* have been shocked"), it is merely associating a visual cue with a fear response. The filter is still the environment (the other rat's pain), not an internal simulation of possibilities. True Popperianism requires *hypotheses*, not just associations.

  **4. The Chess Program (Popperian)**
  *   **Verdict:** **Keep.**
  *   **Reasoning:** At the moment of the move, the program runs a search tree. Bad moves are eliminated internally (hypotheses die) before the piece touches the board.

  **5. The Chess Program / Dev History (User: Darwinian?)**
  *   **Verdict:** **Clarify.** The *program* is Popperian. The *development process* was Darwinian (engineers selecting code).
  *   **Reasoning:** Do not classify the agent by its ancestry. A human is Popperian even though they were born via Darwinian evolution. The chess engine is a Popperian creature created by Darwinian designers. This does not make the category useless; it distinguishes the *user* from the *tool*.

  **6. The Self-Driving System (User: Flipping)**
  *   **Verdict:** **Split Verdict.**
  *   **Reasoning:** It depends on *runtime*.
      *   If the car uses a policy network trained in simulation but does *not* simulate during the drive: It is **Darwinian**. The "crashes" killed the digital ancestors (previous weight iterations), not the current car's hypotheses.
      *   If the car runs a predictive model *during* the drive to test "If I brake, will I hit the pedestrian?": It is **Popperian**.
      *   *Correction:* Most current systems are the former. They are Darwinian artifacts with Skinnerian training histories.

  **7. The Person / Imagination (Popperian)**
  *   **Verdict:** **Keep.**
  *   **Reasoning:** Internal model filters the "restaurant" hypothesis before action.

  **8. The Person / Pro-and-Con List (Gregorian)**
  *   **Verdict:** **Keep.**
  *   **Reasoning:** The filter is the external list and the friend. The cognitive work is offloaded to cultural tools.

  **9. The GPS App (User: Intuition says > Moth, Logic says Darwinian)**
  *   **Verdict:** **Overturn to Darwinian.**
  *   **Reasoning:** I know this hurts your intuition, but strict adherence to the principle demands it. The GPS does not *learn* your traffic patterns (usually), nor does it *simulate* alternative futures during the drive. It executes a fixed algorithm (Dijkstra's or A*) installed by engineers. It is a **Darwinian Artifact**.
      *   *Reconciling your intuition:* Your intuition is detecting *complexity*, not *cognitive architecture*. A Swiss watch is more complex than a rock, but both are Darwinian artifacts. The GPS is smarter than a moth, but it is not a "mind" in Dennett's sense; it is a *tool for a Gregorian mind* (you).

