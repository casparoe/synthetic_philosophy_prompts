      *(Refinement on Phenomenon 3)*: The user *knows* it's a system but acts *as if* it matters. This is "Bad Faith" (Sartre), but I need to stick to Hegel. For Hegel, this is an attempt to force the dialectic to move where there is no engine. It's a "sham struggle."

