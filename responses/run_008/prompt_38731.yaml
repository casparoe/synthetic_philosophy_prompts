      *   *Analysis:* The "Flagging" section required by the prompt.

      *(Self-Correction during drafting)*: Make sure the options in the quiz don't give away the theory names. Keep them intuitive.
      *(Self-Correction on Taxonomy)*: Ensure I distinguish between "Badness of the experience" vs "Badness of the cause." The quiz is about why the *experience* is bad.

      *Let's refine the Taxonomy Leaves:*
      1.  **Sensory Intrinsicism:** The feel *is* the badness. (User)
      2.  **Pure Representationalism:** The info *is* the badness. (Maya)
