      *Another constraint:* "Flag combinations of answers nobody has defended."
      *Example:* Believing pain is bad *only* when it represents damage, but *also* believing phantom pain isn't bad. (Most people admit phantom pain is bad). Or believing pain is intrinsic but asymbolics feel no badness. (Contradiction).

  8.  **Final Review against Prompt:**

