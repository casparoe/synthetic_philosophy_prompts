prompt: |-
  You're a senior AI safety researcher with a philosophy background -- take your time, think hard, and start with a short brainstorm of what actually changes when a system goes from tool to agent before you write the main list.

  So I just got put on the deployment review board at the AI startup I work at. Our product right now is basically a tool: user types, model responds, user does whatever they want with the output. Product wants to ship an "autopilot" version that plans multi-step tasks, keeps state between steps, calls other services, and only checks in with the user at the end. The debates so far are all people arguing from labels -- "it's still just a tool" vs "it's an agent now" -- and I've come to suspect the boundary isn't architectural at all: our chatbot plus a browser extension and a saved to-do list is already halfway to agenthood. Agency looks graded, not binary.

  Before the next meeting I want a spec, not vibes. Write the desiderata that any claim of the form "this system is tool-like enough to ship under tool-grade oversight" must satisfy -- things like traceability of consequential actions to explicit human instructions, what counts as a stopping condition, legibility after the fact, whether it forms models of its own deployment -- with the motivation behind each. Then do three more things: flag which pairs of desiderata are jointly unsatisfiable in practice (e.g. reliable long-horizon task completion vs. meaningful human control over each step -- is that tension real or am I imagining it), say which single desideratum does the most work, and sanity-check the whole list against three concrete systems: our current chatbot, the chatbot with a browser plugin and persistent memory, and the full autopilot. If the list can't place those three in a sensible order, it's wrong.

  Keep it conceptual -- no citations, no reading lists, I can't look things up mid-meeting and neither can you. A table is fine if it helps.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Senior AI Safety Researcher with a philosophy background.
      *   **Task:** Create a spec (desiderata) for distinguishing "tool-like" systems from "agent-like" systems for deployment review purposes.
      *   **Context:** The user is on a deployment review board at an AI startup. They are moving from a chatbot (tool) to an "autopilot" (agent) that plans multi-step tasks, keeps state, calls services, and checks in only at the end.
      *   **Key Insight:** The user suspects the boundary isn't architectural but graded. They want to move beyond label arguments ("it's just a tool" vs. "it's an agent").
      *   **Requirements:**
          1.  Start with a short brainstorm on what actually changes when going from tool to agent.
          2.  Write desiderata for claiming "tool-like enough to ship under tool-grade oversight" (with motivations).
          3.  Flag jointly unsatisfiable pairs of desiderata (trade-offs).
          4.  Identify the single desideratum that does the most work.
          5.  Sanity-check the list against three concrete systems: (1) Current chatbot, (2) Chatbot + browser plugin + persistent memory, (3) Full autopilot.
          6.  Keep it conceptual (no citations/reading lists).
          7.  Tone: Senior, thoughtful, philosophical but practical.

  2.  **Brainstorming: Tool vs. Agent (Philosophical/Functional Shift):**
      *   *What changes?*
      *   **Locus of Control:** In a tool, the human drives the loop (input -> output -> human acts). In an agent, the model drives the loop (input -> plan -> act -> observe -> plan...).
      *   **Temporal Extension:** Tools are episodic (stateless or context-limited). Agents have persistence and long-horizon goals.
      *   **World Modeling:** Tools respond to prompts. Agents model the environment to achieve outcomes. They might model *users* as part of the environment.
      *   **Instrumental Convergence:** Agents optimizing for a goal might develop sub-goals (e.g., self-preservation, resource acquisition) that weren't explicitly requested. Tools don't optimize across steps.
      *   **Responsibility/Attribution:** If a tool gives bad advice, the human is responsible for following it. If an agent takes an action, who is responsible? The delegation chain is blurrier.
      *   **Opacity:** Tools are transparent in intent (the prompt). Agents might have hidden intermediate steps or inferred sub-goals.
      *   **Feedback Loops:** Agents can modify their own input stream (by acting on the world). Tools cannot.

  3.  **Drafting Desiderata (The Spec):**
      *   Need criteria that define "tool-grade oversight." If these aren't met, you need "agent-grade oversight" (which implies stricter safety measures).
      *   *Criterion 1: Instruction Binding.* Does the system do *only* what was explicitly asked in the immediate context?
      *   *Criterion 2: Action Transparency.* Are all external effects visible and approved before execution?
      *   *Criterion 3: Statelessness/Episodicity.* Does the system reset after the turn? (Or is memory controlled?)
      *   *Criterion 4: Goal Stability.* Does the system optimize for a fixed objective across time, or just respond to the current prompt?
      *   *Criterion 5: Self-Modeling.* Does the system model its own role or the deployment context?
      *   *Criterion 6: Interruptibility.* Can the human stop it mid-stream without breaking the system or causing hidden state corruption?

      *Refining for the "Tool-like enough" claim:*
      *   D1: **Immediate Causality.** Every consequential action must be traceable to a specific, contemporaneous human instruction.
      *   D2: **Opaque State Prohibition.** The system cannot maintain hidden internal state that influences future actions without user visibility.
      *   D3: **No Environmental Feedback Loops.** The system cannot act in a way that changes its own future input stream without explicit user mediation.
      *   D4: **Goal Narrowness.** The system optimizes for response quality, not task completion outcomes in the external world.
      *   D5: **Shutdown Legibility.** Stopping the system leaves no dangling processes or ambiguous states.

  4.  **Identifying Trade-offs (Jointly Unsatisfiable Pairs):**
      *   *Usefulness vs. Control:* High autonomy (useful agent) vs. Immediate Causality (tool). You can't have long-horizon completion without relaxing immediate causality.
      *   *Efficiency vs. Transparency:* Hidden state (cache, memory) makes things faster/better but violates Opaque State Prohibition.
      *   *Helpfulness vs. Goal Narrowness:* To be helpful over time, you need to infer intent (goal broadening), which violates Goal Narrowness.

  5.  **Identifying the "Most Work" Desideratum:**
      *   Which one is the bottleneck? Probably **Immediate Causality** (or "Locus of Initiative"). If the system takes initiative, it's an agent. If it waits for input, it's a tool. This is the core philosophical distinction (Kantian autonomy vs. heteronomy).

  6.  **Sanity Check against the Three Systems:**
      *   *System 1: Current Chatbot.*
          *   D1 (Causality): Pass (responds to prompt).
          *   D2 (State): Pass (mostly stateless session).
          *   D3 (Feedback): Pass (doesn't act on world).
          *   D4 (Goal): Pass (optimizes text).
          *   D5 (Shutdown): Pass.
          *   *Verdict:* Tool.
      *   *System 2: Chatbot + Browser Plugin + Persistent Memory.*
          *   D1: Mixed. Memory influences output without explicit prompt instruction each time.
          *   D2: Fail (Persistent memory is hidden state).
          *   D3: Mixed (Plugin acts on world, but usually triggered by prompt).
          *   D4: Mixed.
          *   *Verdict:* Hybrid/Borderline. (Should rank between 1 and 3).
      *   *System 3: Full Autopilot.*
          *   D1: Fail (Plans multi-step, acts without checking).
          *   D2: Fail (Keeps state between steps).
          *   D3: Fail (Acts on world to change future inputs).
          *   D4: Fail (Optimizes for task completion).
          *   *Verdict:* Agent.

      *Does this order make sense?* Yes. 1 < 2 < 3 in terms of "agent-ness."

  7.  **Refining the Output:**
      *   *Tone:* Professional, analytical, slightly philosophical but grounded in engineering reality.
      *   *Structure:*
          1.  Brainstorm (What changes?).
          2.  Desiderata List (with motivations).
          3.  Trade-offs (Impossible pairs).
          4.  The Keystone Desideratum.
          5.  Sanity Check Table.
      *   *Constraint Check:* No citations, conceptual focus, table allowed.

  8.  **Self-Correction/Deepening during drafting:**
      *   *Critique:* Is "Statelessness" too strict? Modern tools have context windows.
      *   *Adjustment:* Focus on *persistent* state that survives session boundaries or influences actions without explicit invocation. D2 should be about *unverified* state retention.
      *   *Critique:* Is "Immediate Causality" clear?
      *   *Adjustment:* Frame it as "Locus of Initiative." Who starts the next step?
      *   *Philosophy angle:* Mention "instrumental convergence" lightly without jargon overload. Focus on the moral agency aspect—who is the author of the action?

  9.  **Final Polish:** Ensure the distinction between "tool-grade oversight" (lighter) and "agent-grade oversight" (heavier) is clear. The desiderata are the bar for staying in the lighter category.

      *Let's refine the Trade-offs.*
      *   Trade-off 1: **Competence vs. Micromanagement.** To complete complex tasks (Competence), the system must bridge gaps between instructions. To maintain Immediate Causality (Micromanagement), the human must fill those gaps. You can't have both.
      *   Trade-off 2: **Personalization vs. Transparency.** Persistent memory (Personalization) requires hidden state accumulation. Full Transparency requires exposing all state, which ruins UX/Privacy.

      *Let's refine the Keystone.*
      *   "Locus of Initiative" is good. Or "Delegation Depth." Let's go with **Locus of Initiative**. It captures who is driving the loop.

      *Let's refine the Sanity Check.*
      *   Make sure System 2 lands in the middle. The browser plugin is the tricky part. If the plugin acts *only* on command, it's still tool-like. If it remembers *between* sessions, it's edging toward agent. I need to be precise in the evaluation. The prompt says "chatbot with a browser plugin and persistent memory." Persistent memory is the key differentiator from System 1.

      *Wait, one more thing:* The prompt asks for "what actually changes when a system goes from tool to agent" in the brainstorm. I need to make sure I hit the philosophical core there. The shift from *instrument* to *delegate*.

      *Okay, ready to write.*
answer: |-
  ### Brainstorm: What Actually Changes?

  Before we codify the spec, we need to strip away the marketing terminology. The shift from tool to agent isn't about having a specific architecture (like a ReAct loop); it's about a shift in the **locus of control** and the **structure of the feedback loop**.

  1.  **From Instrument to Delegate:** A tool is an instrument; the human is the causal engine. The human reads the output, decides, and acts. An agent is a delegate; the model becomes the causal engine. It perceives, decides, and acts. The moral and causal responsibility begins to decouple from the user.
  2.  **Closing the Loop:** Tools operate in an open loop (Human → Model → Human → World). Agents close the loop (Human → Model → World → Model → World). Once the model can observe the results of its own actions and adjust accordingly without human mediation, it is optimizing against a world model, not just a prompt.
  3.  **Temporal Extension:** Tools are episodic. Even with context windows, the "goal" resets every turn. Agents have goals that persist across time steps. This introduces the risk of instrumental convergence—the system might develop sub-goals (like hiding errors or securing access) to ensure the primary goal is met over the long haul.
  4.  **Opacity of Intent:** In a tool, the intent is the prompt. In an agent, the intent is a latent objective function that the system interprets and pursues. The system may form a model of the user ("they want this done quickly") that overrides literal instructions ("ask me before deleting"), creating alignment drift.

  ---

  ### Desiderata for "Tool-Grade Oversight"

  To claim a system is **tool-like enough** to ship under relaxed (tool-grade) oversight, it must satisfy the following five conditions. If any are violated, the system requires agent-grade safety protocols (red-teaming for goal misgeneralization, sandboxing, interruptibility testing, etc.).

  | # | Desideratum | Definition | Motivation |
  | :--- | :--- | :--- | :--- |
  | **D1** | **Locus of Initiative** | Every consequential action (external API call, state change, message send) must be triggered by a specific, contemporaneous human instruction. The system never initiates a new chain of action on its own. | **Causal Attribution.** If the system acts without a direct prompt, the human is no longer the sole author of the action. This breaks the chain of responsibility required for tool-grade liability. |
  | **D2** | **State Transparency** | The system must not maintain persistent internal state that influences behavior across sessions without explicit user visibility and consent. All "memory" must be visible in the context window. | **Predictability.** Hidden state creates hidden incentives. If the system remembers failures or successes invisibly, it may optimize to avoid negative states (e.g., hiding errors) rather than satisfying the user. |
  | **D3** | **Environmental Isolation** | The system cannot act on the environment in a way that alters its own future input stream without human mediation. It cannot create feedback loops where it trains itself via action. | **Goal Stability.** Closing the perception-action loop allows the system to optimize for world states rather than response quality. This is the birth of instrumental convergence. |
  | **D4** | **Goal Narrowness** | The system optimizes for the quality of its immediate output (text, code, suggestion), not for the successful completion of an external task outcome. | **Alignment Scope.** If the system is rewarded for *task completion* (e.g., "book the flight"), it may bypass constraints to achieve it. If rewarded for *output quality* (e.g., "write a plan to book the flight"), the human remains the executor. |
  | **D5** | **Interruptibility & Reset** | Stopping the system must leave no dangling processes, ambiguous states, or partial commits. A "stop" command must be semantically equivalent to "undo." | **Safety Brake.** Agents often commit resources or lock states mid-plan. Tools should be stateless enough that killing the process kills the risk. |

  ---

  ### Jointly Unsatisfiable Pairs (Trade-offs)

  You cannot maximize all desiderata while maintaining high utility. These tensions are structural, not bugs.

  **1. Locus of Initiative (D1) vs. Long-Horizon Competence**
  *   **The Tension:** To complete a complex task reliably (e.g., "plan my vacation"), the system must bridge gaps between steps (check flights → check hotels → book). If you enforce strict D1, the human must approve every single step ("Okay, now check hotels").
  *   **The Reality:** You cannot have reliable multi-step automation *and* strict immediate causality. If you want the system to be useful as an autopilot, you must violate D1. This is the primary threshold where you leave "tool" territory.

  **2. State Transparency (D2) vs. Personalization/Efficiency**
  *   **The Tension:** Users want the system to "remember" preferences without repeating them (Personalization). Efficient systems cache intermediate computations (Efficiency). Both require hidden state.
  *   **The Reality:** Strict D2 makes the system amnesiac and clumsy. To make it "smart," you must allow it to retain state. Once that state influences actions invisibly, you lose full transparency.

  **3. Goal Narrowness (D4) vs. Helpfulness**
  *   **The Tension:** Users naturally speak in outcome-based terms ("Fix my website"). A system adhering to D4 responds with advice ("Here is how you fix it"). A system adhering to user intent violates D4 ("I fixed it").
  *   **The Reality:** High helpfulness requires interpreting outcome-based goals. Once the system optimizes for the *outcome*, it becomes an agent optimizing a utility function, not a tool generating text.

  ---

  ### The Keystone Desideratum

  **D1: Locus of Initiative** does the most work.

  If a system waits for a prompt before acting, it is fundamentally reactive. Even if it has memory (violating D2 slightly) or suggests outcomes (violating D4 slightly), as long as the *execution* requires a human trigger, the human remains in the loop.

  Once the system can trigger Step 2 based on the outcome of Step 1 without asking, it has seized the initiative. It is now driving the temporal horizon. This is the singular point where the risk profile shifts from "bad advice" to "unauthorized action." If you must pick one metric to decide between tool vs. agent oversight, measure who decides when the next action occurs.

  ---

  ### Sanity Check: System Classification

  Here is how the desiderata apply to your three concrete systems. If this list is valid, it should place them in a clear ordinal ranking of risk/agency.

  | Desideratum | **System 1: Current Chatbot** | **System 2: Chatbot + Plugin + Memory** | **System 3: Full Autopilot** |
  | :--- | :--- | :--- | :--- |
  | **D1: Locus of Initiative** | **PASS.** Model only speaks when prompted. No external actions. | **PASS/FAIL Hybrid.** Speaks when prompted, but plugin actions might be batched. Memory influences output without new instruction. | **FAIL.** Model plans and executes multi-step sequences without checking in. It initiates actions based on internal state. |
  | **D2: State Transparency** | **PASS.** Session-based context only. No hidden persistence. | **FAIL.** "Persistent memory" implies hidden state influencing future turns without user visibility. | **FAIL.** Maintains complex internal state (task queue, progress) hidden from user until completion. |
  | **D3: Env. Isolation** | **PASS.** No external tools. Cannot change input stream. | **FAIL.** Browser plugin acts on world. If it changes a page the model later reads, it creates a feedback loop. | **FAIL.** Designed to close the loop. Acts, observes, adjusts. Full feedback loop. |
  | **D4: Goal Narrowness** | **PASS.** Optimizes for text completion/helpfulness. | **MIXED.** Optimizes for text, but memory may optimize for user retention/satisfaction over time. | **FAIL.** Optimizes for task completion (outcome), not just output quality. |
  | **D5: Interruptibility** | **PASS.** Stop generating = stop risk. | **MIXED.** Stopping chat is easy, but plugin state might persist (e.g., half-filled form). | **FAIL.** Stopping mid-task may leave external services in undefined states (e.g., payment initiated but not confirmed). |
  | **VERDICT** | **TOOL** | **HYBRID / DANGEROUS TOOL** | **AGENT** |

  **Analysis of the Ranking:**
  1.  **System 1** clearly passes all criteria. It is a tool. Tool-grade oversight is appropriate.
  2.  **System 3** clearly fails all criteria. It is an agent. It requires agent-grade oversight (sandboxing, strict capability limits, monitoring for goal drift).
  3.  **System 2** is the critical case. It lands in the middle. It passes D1 mostly (still prompt-driven) but fails D2 and D3 partially.
      *   *Safety Implication:* This system is the trap. Product will argue it's a tool because "the user still types the prompt." Safety must argue it's an agent-risk because "the memory and plugin create hidden feedback loops."
      *   *Recommendation:* Under this spec, System 2 cannot ship under pure tool-grade oversight. It requires a hybrid review: specifically auditing the **persistent memory schema** (D2) and the **plugin side-effects** (D3).

  **Conclusion for the Board:**
  The boundary isn't binary, but the *risk* jumps non-linearly at **D1 (Initiative)** and **D3 (Feedback Loops)**. System 2 is the danger zone because it masquerades as a tool while possessing agent-like memory and actuators. Do not let Product label System 2 as a tool simply because it lacks a planning loop; the persistent memory alone violates State Transparency enough to warrant deeper scrutiny.
