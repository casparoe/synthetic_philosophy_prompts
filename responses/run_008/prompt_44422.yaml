  *(Self-Correction Note during drafting Section 2)*: I need to be very careful not to sound like I'm saying "Markets make you moral." I need to say "Markets reveal moral facts about strangers that subsistence farming hides." The distinction is epistemic access.

  *(Self-Correction Note during drafting Section 4)*: The prompt asks to state what the objectivist still owes the relativist. I must ensure I don't claim victory on metaphysics, only on epistemology.

