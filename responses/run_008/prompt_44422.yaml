answer: |-
  The standard narrative in moral psychology posits a dilemma: either moral truths are objective and universal, or the striking cross-cultural variation in moral judgment proves they are not. The empirical record, particularly the work on WEIRD (Western, Educated, Industrialized, Rich, Democratic) populations versus small-scale societies, seems to slam the door on objectivism. When the Machiguenga offer low bids in the ultimatum game and refuse to punish unfairness, while Angelenos do the opposite, the relativist concludes that there is no "fairness" to be found, only local custom.

  However, this conclusion relies on a hidden premise: that all social contexts provide equally reliable access to moral truth. If we reject this premise, the data flips. The cross-cultural literature does not demonstrate the absence of moral truth; it demonstrates the variability of the *instruments* used to perceive it. By adopting an **instrumental model of institutions**, the objectivist can argue that market integration, anonymity, and rule of law function not as mere causes of preference, but as epistemic technologies—telescopes that bring distant moral patients into focus, or distorting lenses that obscure them. On this view, the variation in moral judgment is not evidence of deep disagreement among equals, but of conditional disagreement among observers using instruments of differing resolution.

  ### I. Licensing the Instrumental Interpretation

  The first hurdle is to justify treating institutions as perceptual instruments rather than preference shapers. If a market economy makes people act more impartially, why assume it is *revealing* a moral truth about impartiality rather than simply *creating* a taste for it? After all, a pair of blue-tinted glasses reliably makes the world look blue, producing confident judgments that do not correspond to reality.

  The license for the instrumental interpretation comes from the functional relationship between institutional scope and moral information. Moral truths, if they exist, must govern interactions between agents. In a small-scale, kin-based society, the relevant moral facts are almost exclusively about relationships within a dense network of repeated interactions. In such an environment, a "moral judgment" is a calculation of reputation and reciprocity within a closed loop. The Machiguenga refusal to punish low offers in the ultimatum game is rational within an ecology where today's rejector is tomorrow's necessary co-operator in a survival context.

  However, this institutional setting lacks the *resolution* to perceive obligations toward strangers. It is not that the Machiguenga judge the stranger to be worthless; it is that their social technology provides no mechanism to render the stranger visible as a moral patient. Market integration and contract enforcement function as telescopes because they extend the range of interaction beyond the kin network. When an institution allows for successful cooperation among anonymous strangers, it forces the agents to recognize normative constraints that were previously invisible.

  We distinguish this from mere preference shaping by looking at *conflict resolution*. If an institution merely reshaped preferences, we would expect arbitrary variation. Instead, we see that institutions supporting wider cooperation (markets, impartial courts) systematically reduce violence and increase trust radii. This suggests they are aligning behavior with normative demands required for complex social existence. An institution that allows me to perceive the claims of a stranger is epistemically superior to one that renders the stranger invisible, not because "strangers" are a WEIRD fetish, but because the stranger is a *moral patient* whose existence is a fact independent of my local ecology. The institution does not create the patient; it corrects the myopia that prevented me from seeing them.

  ### II. Confronting the Question-Begging Objection

  The most potent objection to this model is that it is circular. To rank market-integrated societies as having "better" moral instruments seems to rely on the very values those institutions produce: impartiality, individualism, and universalism. If we judge the telescope by how well it reveals the landscape of liberal democracy, we have smuggled the conclusion into the premise. We are simply privileging WEIRD morality under the guise of epistemic clarity.

  To avoid begging the question, the ranking of institutions must be grounded in something other than the specific moral content they promote. The ground is **informational capacity**. An instrument is superior if it allows the judge to process more relevant variables without distortion. A kinship-based morality is not "false" in its context, but it is informationally impoverished regarding the broader human community. It treats kinship proximity as a proxy for moral worth. When we test this proxy against the reality of human sentience, the proxy fails.

  The objectivist does not argue that impartiality is good because WEIRD people say so. The argument is that institutions which enforce impartiality allow for a *wider scope of justification*. If moral truth involves giving each agent their due, an institution that restricts "due" to kin is structurally incapable of accessing the full set of moral facts. The ranking is parasitic not on WEIRD *values*, but on the *comprehensiveness* of the moral domain.

  Consider the analogy of scientific instrumentation. We do not say the telescope is "biased" toward Galileo's values because it reveals moons around Jupiter. We say it is superior because it resolves data that was previously inaccessible. Similarly, anonymous market institutions resolve the moral status of the stranger. The charge of circularity holds only if we assume the moral domain is inherently local. If the moral domain includes all persons, then institutions that facilitate recognition of all persons are epistemically privileged. This is not a value judgment imposed from the outside; it is an assessment of the instrument's range. The disagreement between the Machiguenga and the Angeleno is conditionalized: it persists only because the former lacks the institutional apparatus to render the stranger's claim visible. Once the institutional conditions are equalized (i.e., if the Machiguenga were integrated into a system where stranger-cooperation was necessary for survival), the divergence in judgment regarding fairness diminishes. This suggests the variation was in the instrument, not the truth.

  ### III. The Problem of Purity and Sanctity

  A serious challenge arises regarding the "purity" or sanctity foundation. Cross-cultural data shows that as societies modernize and integrate into markets, norms of sanctity, religious purity, and authority often erode. If the instrumental model claims modernity improves moral perception, it implies these eroded norms were distortions. But what if sanctity norms encode genuine moral knowledge about the sacredness of the body, the importance of ritual, or the hierarchy of value? If modernity scrubs this away, the telescope is not just magnifying; it is filtering out color.

  The objectivist must concede that modernity alters the moral landscape, but need not concede that it loses truth. Sanctity norms often function as heuristics for pathogen avoidance and group cohesion in high-density, low-mobility environments. They bind the group together by marking boundaries. In a low-mobility context, treating an outsider as "unclean" is a functional proxy for "potential threat."

  However, in a high-mobility, globalized context, this heuristic misfires. It categorizes moral equals as contaminants. The instrumental model argues that the erosion of sanctity norms in the domain of *justice* is a correction of a distortion, not a loss of vision. The "sacred" value of the person is better preserved by rights-based impartiality than by ritual purity, because the latter is contingent on group membership.

  This does not deny the phenomenon of loss. It argues that the *moral knowledge* retained in sanctity (e.g., that humans are not mere objects) is better secured by universal rights than by tribal taboo. The instrumental model predicts that as the social radius expands, heuristics based on physical proximity or ritual status become sources of error. The "loss" of sanctity is the shedding of a context-dependent tool that has become a liability. If there is genuine moral truth in sanctity (e.g., respect for the dead), the objectivist can argue this is subsumed under broader duties of respect, rather than dependent on specific purity codes. The instrument of modernity does not blind us to the sacred; it forces us to locate the sacred in the agent rather than the ritual, which is a more robust position for an objectivist claiming universal truth.

  ### IV. Limitations and Outstanding Debts

  Candor requires stating what this argument does not establish. The instrumental model defeats the **Argument from Disagreement**, but it does not prove **Moral Realism**. It clears the epistemic path by showing that disagreement is compatible with objectivity, provided the disagreement is conditional on institutional context. It does not, however, provide the metaphysical grounding for *why* moral truths exist or *what* they are. It shows that WEIRD judgments are not merely local preferences, but it does not prove they correspond to mind-independent facts.

  Furthermore, the objectivist still owes the relativist an account of **institutional path dependence**. If institutions are telescopes, who built them, and why? If market institutions emerged through historical contingencies (colonialism, resource accidents), does their origin undermine their epistemic authority? The objectivist must argue that the *current functional capacity* of the institution validates it, regardless of its genealogy, but this remains a point of vulnerability.

  Finally, this model does not guarantee progress. Institutions can degrade. A market can become predatory; a legal system can become bureaucratic and blind to nuance. The instrumental model suggests that WEIRD populations currently possess higher-resolution instruments for *impartial justice*, but it leaves open the possibility that they have lost resolution in other domains (e.g., community cohesion, ecological embeddedness). The objectivist claims the former is more central to moral truth, but must acknowledge that the "ranking" of instruments is an ongoing empirical and philosophical project, not a finished verdict.

  ### Conclusion

  The cross-cultural moral psychology literature is not the graveyard of objectivism. It is the calibration data we needed to refine it. By treating institutions as instruments of moral perception, we transform the argument from disagreement. The variation between the Machiguenga and the Angeleno is not a stalemate between incommensurable worldviews. It is a measurement of the difference between a moral microscope and a moral naked eye. The objectivist can accept the empirical data without surrendering the claim to truth, arguing that we have finally identified the conditions under which moral judgment becomes reliable. The task ahead is not to abandon the search for universal morality, but to build the institutions that allow us all to see it.
