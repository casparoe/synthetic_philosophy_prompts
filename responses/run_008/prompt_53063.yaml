  ### The Tie-Breaker Case

  If you want to know for sure whether she is Rule A (Psychological) or Rule B (Process/Physical), you need to test if she cares about the **state of the substrate** during the gap.

  **Put this case to her:**
  > **The Paused Simulation:** You are destructively scanned and uploaded into a computer simulation. You live consciously in the sim for 10 years. Then, the computer is turned *off* for 10 years (powered down completely, no data loss). Then it is turned back on, you wake up, and eventually, you are printed into a body.
  >
  > **Question:** Did you survive the 10 years the computer was off?

  *   **If she says YES:** She is **Rule A (Psychological)**. She accepts gaps in existence as long as the causal information is preserved. (This would mean she *should* say Survival on the Storage Case, and if she doesn't, she is being inconsistent).
  *   **If she says NO:** She is **Rule B (Process)**. She requires active processing or physical continuity. A "paused" mind is a dead mind.
  *   **If she says "You survived the process, but didn't exist during the gap":** She is drawing a distinction between *Identity* (Survival) and *Existence* (Consciousness). This is a valid third position (Parfitian Reductionism), but it usually leads to saying the Storage Case is Survival.

  ### Consistency Check

  **Is she making a mistake?**
  No. Her view is philosophically consistent. It is essentially a **Hybrid View**: *Psychological Continuity is the criterion for identity, provided there is no branching, and provided the causal chain does not involve a period of total non-existence without a physical anchor.*

  The only tension is between the **Teletransporter** (which she accepts) and the **Storage Case** (which I predict she'll reject). If she accepts the Teletransporter but rejects Storage, she is drawing a line at **Immediacy**. That is a defensible line (often called the "Continuity of Cause" requirement). It's not a mistake; it's a specific boundary condition.

  **Summary for your game:**
