prompt: |-
  Got into a long argument at my book club last week and I'm still chewing on it. We read a novel set in the 1890s, someone said the author was romanticizing a character who'd be, by our lights, pretty racist, and someone else shut the whole thing down with "the past is a foreign country, they do things differently there," like that settles whether we're allowed to be bothered. Then a THIRD person used the exact same line to argue that the novelist had no business putting modern-ish feminist views in a period character's mouth, since people back then "just didn't think that way" — which seems like the opposite conclusion?? So now I genuinely don't know what the slogan is even claiming. Can you lay out the different precise things that one-liner could mean — a factual claim about how different the past actually was, a methodological rule about how historians should approach past actors, an epistemic claim that we can't really understand people whose moral world was that alien, a normative claim that judging them by our standards is unfair or lazy, whatever else you can think of — and for each one say whether it's basically a platitude, whether it's substantive and defensible, or whether it's just false? And crucially: tell me which readings would actually support my friend's move (using the line to end an argument about whether we can criticize the character/author), and which would support the third person's move (using it to forbid period characters having views out of step with their era), since those two can't both follow from the same sentence. Also, someone grumbled that the line cuts both ways because people in 2125 will look back at us as the foreign country — does any reading of it actually handle that? A menu I can bring back to the next meeting would be ideal.
