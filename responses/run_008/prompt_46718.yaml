      *   *Category 2: Methodological Rule (Historicism).* (Understand them in *their* context.)
          *   This is the historian's job. Contextualize.
          *   Defensible? Yes, standard historical practice.
      *   *Category 3: Epistemic Claim.* (We *can't* understand them.)
