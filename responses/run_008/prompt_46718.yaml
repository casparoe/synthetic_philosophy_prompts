          *   Defensible? Depends on the genre/goal of the fiction.

  4.  **Mapping to the Book Club Conflict:**
      *   *Person B (Don't judge the racist character):* Relies on Normative Claim (Moral Relativism) or Epistemic Claim (We can't understand).
      *   *Person C (Don't give feminist views):* Relies on Factual Claim (Accuracy) or Aesthetic Claim (Verisimilitude).
      *   *The Contradiction:* Person B uses it to suspend *our* standards. Person C uses it to enforce *their* standards.

