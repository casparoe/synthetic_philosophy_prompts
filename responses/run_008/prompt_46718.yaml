      *   *Tension:* Does "differently" mean "incomprehensibly/unjudgeably" (Relativism) or "inconsistently with now" (Historicism)?

  3.  **Drafting the Categories (The "Menu"):**

      *   *Category 1: Factual/Descriptive Claim.* (Things *were* different.)
          *   Is it true? Yes, obviously. Laws, norms, tech changed.
