      *   *Factual:* Platitude (obviously things changed).
      *   *Methodological:* Substantive/Defensible (good history).
      *   *Epistemic:* False (we can understand enough to judge).
      *   *Normative:* Controversial/Often False (moral progress exists).
      *   *Aesthetic:* Substantive (depends on the book's contract with the reader).

