  Here is my prediction regarding your dinner party case, followed by an analysis of the principles your friend appears to be employing, and a proposal for a further test case.

  ### The Prediction

  I predict your friend will verdict that the amateur historian's belief is **not better** than the rival's lucky guess.

  Whilst the historian's method was "airtight" (which satisfies the condition of reliability), you have introduced two crippling constraints: the belief will **never guide action**, and it will **never be retained** ("she'll never think about it again"). Given her track record, the latter is likely the decisive factor. In every instance where she has judged a belief to be "better," the believer has successfully *used* the belief to navigate the world (travelling to Larissa, saving livestock, rigging the boat). In the Meno dialogue, the value of knowledge is explicitly tied to its capacity to remain fixed (the "statues of Daedalus") and to guide action. A belief that is immediately abandoned is, in her eyes, untethered; it has flown away just as a mere true opinion would. Without the capacity to inform future conduct or withstand the passage of time, the "airtight" verification adds no extra value over the guess.

  ### The Rules She Is Running

  You are quite right to sense ambiguity. Her verdicts are consistent with at least three distinct epistemological rules. Distinguishing them is the key to understanding her position.

  **1. Process Reliabilism**
  This is the most obvious candidate. A belief is better if it is produced by a cognitive process that is objectively truth-conducive.
  *   *Fits:* The map-reader (reliable source), the farmer (reliable induction), and the sailor (reliable correlation) all win. The clock-watcher loses because a stopped clock is not a reliable time-telling process, even if it happens to be right twice a day.
  *   *Conflict:* This rule suggests the historian *should* win, as her verification method was reliable. If she rejects the historian, this rule is insufficient.

  **2. Pragmatic Instrumentalism**
  This rule posits that a belief is better only if it successfully guides action to a desired outcome. This is deeply rooted in the original Meno puzzle (the road to Larissa).
  *   *Fits:* The map-reader, farmer, and sailor all act successfully. The clock-watcher's belief is useless for planning.
  *   *Conflict:* This rule predicts the historian will lose (no action guided). However, it struggles to explain why the *method* matters. If a gambler guessed the flood correctly and moved the livestock, would your friend say the gambler's belief was equal to the farmer's? The Map case suggests no ("clearly better"), implying the *source* matters, not just the outcome.

  **3. Epistemic Stability (The "Tether" Theory)**
  This is the classic Socratic solution. A belief is better if it is "tied down" by an account or understanding, making it stable over time.
  *   *Fits:* The map-reader and farmer have stable expectations. The clock-watcher's belief is accidental and unstable.
  *   *Conflict:* The sailor case complicates this. He thinks it is magic; he has a *false* account. Yet she favours him. This suggests she does not require *true* understanding, only a stable correlation. However, the historian's refusal to retain the belief violates the "stability" condition entirely.

  **The Synthesis:**
  It appears your friend is operating on a hybrid rule: **Reliable Instrumentalism**. A belief is better if it is produced by a reliable process *and* is available to guide action. The historian fails on the second count; the clock-watcher fails on the first.

  ### The Further Test Case

  To tease apart **Process Reliabilism** (it's about the method) from **Pragmatic Instrumentalism** (it's about the use), you need a case where the method is reliable but the action is absent, versus a case where the method is unreliable but the action is successful. Since the Historian case already tests the former, you need to test the latter to see which weight she favours.

  I propose you pitch her **The Case of the Lucky Lifesaver**:

  > Imagine a paramedic arrives at an accident. She has no training and no equipment to diagnose the patient. She simply has a hunch—a pure guess—that the patient is suffering from a specific, rare allergic reaction. Based on this guess, she administers a specific antidote.
  >
  > As it happens, her guess is correct. The patient lives.
  >
  > **Versus:**
  >
  > A second paramedic who runs a full, reliable diagnostic test (airtight method), confirms the same allergy, but the ambulance is stuck in traffic and never arrives. The belief is formed reliably, but never guides any action.

  **How to interpret her verdict:**

  *   **If she says the Lucky Lifesaver's belief is better:** She is a **Pragmatic Instrumentalist**. The successful action (saving a life) outweighs the unreliability of the method. The value of knowledge is purely in its consequences.
  *   **If she says the Stuck Paramedic's belief is better:** She is a **Process Reliabilist**. The integrity of the method matters more than whether the belief was actually put to use. The epistemic virtue lies in the formation, not the application.
  *   **If she says neither is better:** She holds a strict **Conjunctive View** (Reliability *and* Utility are both necessary). This would confirm my prediction on the Historian case.

  Given her obsession with Meno, I suspect she will favour the **Stuck Paramedic** (Reliability) over the **Lucky Lifesaver** (Luck), but will still reject the **Historian** (No Action). This would confirm that for her, knowledge requires both a reliable tether *and* the potential for use.
