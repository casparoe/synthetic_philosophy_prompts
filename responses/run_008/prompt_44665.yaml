answer: |-
  You have hit on one of the most famous and heated debates in bioethics, and your intuition is excellent. You are right to be suspicious of the "body movement" definition. In modern philosophy and law, **physical movement is almost never the deciding factor.**

  If the distinction relied solely on "did your muscles contract," then giving a pill (act) would be killing, but withholding the same pill (omission) would be letting die, even if the outcome is identical. Most ethicists agree that would be absurd.

  So, you aren't missing a third option, but you are right that the explanation you were given ("underlying disease") feels incomplete. Here is the breakdown using your background, because the coding analogy actually maps surprisingly well to the philosophical consensus.

  ### 1. The "Body Movement" Criterion is Dead
  You are correct: switching off a ventilator is physically an **act**. You walk, you reach, you flip a switch. If ethics were based on kinematics (physics of motion), withdrawing life support would be active killing.

  Philosophers and legal scholars largely abandoned this definition decades ago. The distinction isn't about *what your body did*; it's about **what you are obligated to do.**

  ### 2. The Coding Analogy: Hotfixes vs. New Bugs
  Let's look at your `prod` analogy.

  **Scenario A: Active Killing (Lethal Injection)**
  Imagine your production environment is running fine. The code is stable. You push a commit that introduces a fatal memory leak or explicitly calls `system.shutdown()`.
  *   **Ethical equivalent:** Injecting potassium chloride into a healthy(ish) patient.
  *   **Causal status:** You introduced a *new* fatal pathogen/bug.
  *   **Verdict:** Killing.

  **Scenario B: Letting Die (Withdrawing Ventilation)**
  Imagine your production environment is running on legacy code with a known, critical bug (the underlying disease). It *would* crash immediately, but you have a temporary wrapper script (the ventilator) that keeps it running.
  *   The script requires maintenance. Eventually, you decide (or the client asks) to stop maintaining the wrapper.
  *   You run `rm wrapper.sh`.
  *   The system crashes minutes later.
  *   **Ethical equivalent:** Turning off the ventilator.
  *   **Causal status:** You did not introduce a new bug. You removed the *prevention* of the existing bug.
  *   **Verdict:** Letting die.

  In Scenario B, did your command cause the crash? In a literal sense, yes. If you hadn't run `rm`, it would still be up. But in a **diagnostic** sense, the Root Cause Analysis (RCA) points to the legacy bug (the disease), not the removal of the script.

  ### 3. Addressing the "Sloppy Criteria" Charge
  You wrote: *"now there are two completely different criteria... and everyone just quietly switches between them depending on which answer they like."*

  This is a very sharp observation. It feels like motte-and-bailey argumentation. However, the ethical framework isn't switching criteria; it's applying a **hierarchy of criteria.**

  1.  **Physical Act?** (Irrelevant. Flipping a switch is an act, but can be an ethical omission.)
  2.  **Causal Origin?** (Did you introduce new pathology, or stop preventing old pathology?)
  3.  **Normative Obligation?** (Were you *required* to keep the wrapper script running?)

  The third point is the one people often leave out when explaining this to laypeople. The reason withdrawing treatment is "letting die" is not just because of the disease; it's because **the patient has a right to refuse the wrapper script.**

  If a patient says, "I don't want this ventilator anymore," and the doctor leaves it on, that is battery (unconsented touching). When the doctor turns it off, they are not "killing" the patient; they are **stopping a violation of the patient's bodily autonomy.** They are returning the patient to their natural state.

  So the distinction isn't fake, but it is **normative**, not physical. It relies on the idea that we are not morally required to fight death at all costs, but we *are* morally required not to cause death ourselves.

  ### 4. Is Unplugging "Never a Cause of Death"?
  You asked: *"does that mean unplugging a ventilator is never a cause of death at all, even though the patient clearly dies within minutes of you doing it?"*

  This is the hardest pill to swallow, but here is the precise philosophical distinction:

  *   **Unplugging is the *proximate* trigger.** (Like pulling the pin on a grenade).
  *   **The Disease is the *underlying* cause.** (Like the explosive inside the grenade).

  If you pull the pin on a live grenade, you didn't make the explosives, but you triggered them. However, in medical ethics, the body is viewed as the grenade. The disease has armed it. The ventilator is your hand holding the pin in.

  When you remove the ventilator, you are removing your hand. The pin pops out. The explosion (death) happens because of the explosives (disease), not because you moved your hand.

  **Where your intuition is right:**
  In many legal systems, "but-for" causation applies. *But for* the doctor unplugging the machine, the patient would not have died at that moment. So legally, it *is* a cause.

  **Why it's still "Letting Die":**
  Ethics distinguishes between **causing a state** and **allowing a state.**
  *   **Killing:** Changing the state from `Alive` to `Dead`.
  *   **Letting Die:** Changing the state from `Artificially Supported` to `Natural Course`.

  The ethical weight rests on the idea that the "Natural Course" belongs to the patient. The "Artificially Supported" state belongs to the doctor/technology. Returning ownership of the body to the patient (even if it results in death) is not considered a moral wrong in the same way imposing death is.

  ### 5. Summary: Is the Distinction Fake?
  It is not fake, but it is **pragmatic.**

  Society wants two things that are in tension:
  1.  We want to respect patient autonomy (right to refuse treatment, even if it leads to death).
  2.  We want to prevent murder (doctors shouldn't be allowed to execute patients).

  If we define "killing" strictly by physical acts, we lose #1 (doctors can never turn off machines).
  If we define "killing" strictly by outcomes, we lose #2 (turning off a machine is the same as injection).

  So we use the **Causal/Obligation** hybrid you identified:
  *   **Killing:** You introduce a new cause of death (poison, bullet, bad commit).
  *   **Letting Die:** You remove an obstacle to an existing cause of death (disease, system crash), usually because you are no longer obligated to maintain that obstacle.

  **To answer your specific doubts:**
  *   **Is it about body movement?** No. Your intuition was right; that definition is too simple.
  *   **Is it sloppy?** It feels like it, but it's actually a specific legal/ethical fiction designed to balance autonomy vs. sanctity of life.
  *   **Is unplugging a cause?** It is a *trigger*, but not the *mechanism* of death. The mechanism is the lung failure; the trigger was removing the support.

  You aren't missing anything. The doctrine *is* counter-intuitive because it asks us to ignore the immediate physics (the switch flip) and focus on the broader causal narrative (the disease process). It's less like code logic and more like liability law: who is responsible for the crash? The guy who removed the patch, or the guy who wrote the buggy code? In medicine, nature wrote the buggy code.
