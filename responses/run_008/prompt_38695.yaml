          *   Clarify that the "fatalism" is actually "logical constraint on compossibility."
          *   Address the "Free Will" aspect: If you believe in Libertarian Free Will, time travel is likely impossible for you. If you believe in Compatibilism or Determinism, time travel adds no *new* fatalism, just extends existing constraints.
