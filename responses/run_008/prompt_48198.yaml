answer: |-
  Your intuition is spot-on. Your roommate has accurately recited the mathematical statement of I.J. Good's 1967 theorem, but he has overextended its philosophical and practical implications. He is confusing a specific result within a specific formal model (Bayesian Expected Utility) with a universal law of rationality.

  Here is an audit of his claims, breaking down where the theory holds, where it breaks, and why avoiding medical results can indeed be rational.

  ### 1. The Core Theorem: What Your Roommate Got Right
  Your roommate is correct on the narrow technical point. I.J. Good proved that for a **Bayesian Expected Utility (EU) maximizer**, the expected value of free information is non-negative.

  *   **The Logic:** Before you see the evidence, you consider all possible pieces of evidence you *might* receive. For each possible piece, you will choose the action that maximizes utility given that evidence. Since you always have the option to ignore the new evidence and do exactly what you would have done without it, you can never do worse than you would have without the info. Sometimes, the info will allow you to switch to a better action. Therefore, the *expectation* (average across all possible outcomes) must be higher.
  *   **The "Strictly Higher" Claim:** He is also right that the value is strictly positive *if and only if* there is at least one possible signal that would change your decision. If the evidence would never change your mind, the information has zero value (but not negative value).

  **Verdict:** Mathematically accurate *within the model*.

  ### 2. Auditing the Overstatements
  Here is where your roommate's explanation starts to drift from decision theory into pop-psychology.

  **Claim:** *"A rational agent should never turn down a free peek at anything."*
  **Audit:** **False.** This depends entirely on the definition of "free." In decision theory, "cost" is measured in utility, not just dollars. If looking at the information causes anxiety, dread, or sadness, it is not "free." Good's theorem assumes the only utility that matters is the utility derived from the **final outcome** (e.g., health status), not the utility derived from **holding the belief** (e.g., knowing vs. not knowing).

  **Claim:** *"People who avoid opening medical test results are being irrational by definition."*
  **Audit:** **False.** This is the biggest overreach. In standard EU theory, utility is defined over *world states*. If your utility function includes "peace of mind" or "absence of dread" as a component of the world state, then receiving a positive test result changes the world state to one with higher dread. If the information has no *instrumental* value (e.g., there is no cure for the disease), but high *psychological* cost, a rational EU maximizer **should** avoid it. Your roommate is assuming the only value of information is instrumental (changing actions), ignoring intrinsic value (how knowing feels).

  **Claim:** *"It holds for any rational agent, not just expected utility maximizers."*
  **Audit:** **False.** The theorem relies heavily on the linearity of expectations and the ability to average utilities across probabilities. Agents who violate EU axioms (e.g., Prospect Theory users, or those with ambiguity aversion) can genuinely value ignorance. For example, if an agent is "ambiguity averse," introducing information might resolve ambiguity in a way they find distressing, or they might prefer to maintain a "hope" bias that information would destroy.

  ### 3. Addressing Your Specific Questions

  #### (1) Ex-Ante Expectation vs. Ex-Post Regret
  You hit on a crucial distinction. Good's theorem is an **ex-ante** claim (before you look). It says: *Before you open the envelope, you expect to be better off.*

  It does **not** guarantee you will be happier **ex-post** (after you look).
  *   **Scenario:** You look at the test. It's bad news. You are now sadder than if you hadn't looked.
  *   **Roommate's Defense:** "But you made the right choice beforehand!"
  *   **The Problem:** If the sadness from the news is a direct utility cost, then the *ex-ante* calculation changes. If you know looking will make you miserable, and you can't do anything to fix the problem, the *expected utility of looking* becomes lower than *not looking*.
  *   **Conclusion:** The theorem holds that you won't regret the *decision to look* in terms of decision quality, but you might regret the *state of knowing*. If your utility function penalizes the state of knowing bad news, the theorem no longer advises looking.

  #### (2) How Much Work is "Free" Doing?
  It is doing **all** the work. In economics, "free" means zero marginal cost in terms of utility.
  *   **Monetary Cost:** $0.
  *   **Cognitive Cost:** Time/effort to process.
  *   **Emotional Cost:** Dread, anxiety, loss of hope.

  Good's theorem assumes information is a tool that only affects your **actions**. It assumes information does not affect your **utility function directly**.
  *   **Instrumental Value:** Info helps me choose better treatment. (Good's theorem covers this).
  *   **Intrinsic Value:** Info makes me feel anxious even if I can't change the outcome. (Good's theorem ignores this).

  If "free" includes "emotionally costless," the theorem is trivial. If "free" means "monetarily costless," the theorem often fails in practice because emotional costs are real utility costs.

  #### (3) Risk Aversion and Rational Agent Scope
  Your roommate is wrong that this applies to "any rational agent." It applies specifically to **Expected Utility Maximizers**.
  *   **Risk Aversion:** A standard risk-averse EU maximizer (someone with a concave utility function for money/health) **still** values free information according to Good's theorem. Risk aversion curves the utility of outcomes, but it doesn't make information negative in expectation *if* the only cost is monetary.
  *   **Information Aversion:** However, there are coherent models of rationality where agents care about their beliefs. In **Psychological Game Theory** (e.g., Caplin & Leahy, 1999), agents derive utility from *anticipation*. In these models, "blissful ignorance" is formally rational. If I get utility from *hoping* I am healthy, a test that resolves that uncertainty destroys my utility stream of hope, even if the medical outcome is the same. A roommate claiming this is "irrational" is using a definition of rationality that excludes belief-based utility.

  #### (4) Commitment and the Ability to Ignore
  This is a subtle and excellent point.
  *   **If you can commit to ignoring the info:** Then the information has zero instrumental value. You will do the same thing regardless. By Good's theorem, the value is zero. You should be indifferent between looking and not looking (assuming it's truly free).
  *   **If you cannot commit:** And the information has negative intrinsic value (dread), then you are worse off looking. You *will* update your beliefs, you *will* feel the dread, and you *cannot* choose to act as if you didn't know.
  *   **The Paradox:** Sometimes, being *less* rational (in the sense of being unable to process info) is beneficial. If I know I will obsess over a 5% risk, I am better off not knowing the risk exists. A "super-rational" agent who can look at the 5% risk and calmly ignore it if no action is needed gains nothing but loses nothing. A human who cannot ignore it loses utility.

  ### Summary: Is "I'd Rather Not Know" Rational?

  **Yes.** Your roommate is committing the **Mind-Projection Fallacy**. He is assuming that the only thing that matters to a rational agent is the physical state of the world and the actions taken within it.

  But human utility functions often include:
  1.  **Anticipation:** Enjoying the period of waiting/hoping.
  2.  **Dread:** Suffering from the knowledge of inevitable negative outcomes.
  3.  **Identity:** Maintaining a self-concept that certain information would shatter.

  If your utility function is $U(\text{Outcome}, \text{Beliefs})$, then information changes the $\text{Beliefs}$ term. If there is no action you can take to improve the $\text{Outcome}$ term (e.g., an untreatable genetic condition), but the $\text{Beliefs}$ term drops significantly (you become depressed), then **maximizing expected utility requires avoiding the information.**

  **The Verdict on Your Roommate:**
  *   **Math:** A.
  *   **Application:** F.
  *   **Philosophy:** F.

  He has confused a theorem about the **instrumental value of information for decision-making** with a theorem about the **total welfare of a conscious being.** You are not being squeamish; you are likely accounting for utility costs (dread, anxiety) that his simplified model treats as zero. A truly sophisticated decision theorist would acknowledge that when information has no instrumental use, the "cost" of processing it emotionally makes avoidance the rational choice.
