prompt: |-
  My roommate is taking a decision theory course and tried to explain Good's theorem to me after dinner, and something about his version felt off but I can't put my finger on it. Paraphrasing him as faithfully as I can: Good proved that information is always good for you — the expected utility of making a decision after you recieve some new evidence is always at least as high as the expected utility of deciding without it, and strictly higher whenever the evidence could change what you'd end up doing. Since the information is assumed to be free, the upshot (per my roommate) is that a rational agent should never turn down a free peek at anything, so people who avoid opening their medical test results, or who don't want to know their genetic risk profile, are being irrational by definition. He also said this is basically the formal version of knowledge is power, and that it holds for any rational agent, not just expected utility maximizers, and since it's a theorem it's not up for debate the way most psychology-of-reasoning claims are.

  So I'd like you to audit this. Go through it piece by piece: which parts would a decision theorist sign off on, which parts are subtle conflations or overstatements, and does the conclusion about refusing to look at test results actually follow from the accurate core? A few things I'm specifically wondering about, but feel free to go beyond them: (1) it seems like the theorem is about expected value *before* you look, so is there a difference between never regretting information in expectation and never regretting it given what you actually saw? (2) how much work is the word "free" doing — does it cover just money or also effects like dread, or effects the information has on you that don't run through your later choices? (3) is my roommate right that it applies to any rational agent, or does it lean on the expected-utility structure specifically — like, is there a coherent risk-averse agent who'd genuinely be worse off from free information? and (4) is there anything to the thought that an agent who *can't commit* to ignoring what she learns is different from one who can? Basically I want to know whether "I'd rather not know" can be rational or whether I'm just being squeamish.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Context:** Roommate explained Good's Theorem (Value of Information) after dinner.
      *   **Roommate's Claim:** Information is *always* good (expected utility with info $\ge$ without). Free info should *never* be turned down. People avoiding medical results are irrational. It applies to *any* rational agent (not just EU maximizers). It's a theorem, not debatable.
      *   **User's Task:** Audit this explanation. Identify accurate parts, conflations, overstatements. Address specific questions:
          1.  Ex-ante expectation vs. Ex-post regret.
          2.  Meaning of "free" (monetary vs. psychological/utility costs).
          3.  Scope of rationality (EU maximizers vs. others, risk aversion).
          4.  Commitment issues (ability to ignore info).
      *   **Core Question:** Can "I'd rather not know" be rational, or is it just squeamishness?

  2.  **Initial Assessment & Fact-Checking (Internal Knowledge):**
      *   *Good's Theorem (1967):* Yes, I.J. Good proved that for a Bayesian Expected Utility (EU) maximizer, the expected value of free information is non-negative.
      *   *Roommate's Accuracy:* Mostly correct on the core math, but overstates the *implications* for real human behavior and the *scope* of agents.
      *   *Key Caveats:*
          *   Assumes EU maximization.
          *   Assumes information is truly "free" (no utility cost from receiving it).
          *   Assumes the agent *uses* the information optimally.
          *   Assumes the information doesn't change the utility function itself (e.g., via mood, dread, identity).
      *   *Medical Tests:* Avoiding results is often rational if the *process* of knowing causes disutility (dread) that outweighs the instrumental value of the info. Good's theorem assumes the utility comes from the *action* taken based on info, not the state of knowing itself.
      *   *Risk Aversion:* Standard EU handles risk aversion via concave utility functions. Good's theorem holds for risk-averse EU maximizers *if* the cost is zero. However, non-EU models (e.g., prospect theory, info-aversion models) might differ.
      *   *Commitment:* If I can't commit to ignoring info, and the info hurts me (non-instrumentally), I might prefer not to look.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the roommate is *technically* right about the math but *practically* wrong about the conclusion. It's a classic case of "map vs. territory."

      *   **Part 1: The Core Theorem (What the Roommate Got Right):**
          *   Confirm I.J. Good (1967).
          *   State the condition: Bayesian EU maximizer.
          *   State the result: $E[U|Info] \ge E[U|No Info]$.
          *   Why? Because you can always ignore the info and do what you would have done anyway. Having the *option* to change your mind adds value.

      *   **Part 2: Auditing the Specific Claims (The "Off" Feeling):**
          *   *Claim:* "Never turn down free peek."
          *   *Audit:* Depends on definition of "free."
          *   *Claim:* "Medical test avoiders are irrational."
          *   *Audit:* False. They likely have non-instrumental utility costs (dread, anxiety).
          *   *Claim:* "Any rational agent."
          *   *Audit:* False. Specific to EU maximizers.

      *   **Part 3: Addressing User's Specific Questions:**
          *   *(1) Ex-ante vs. Ex-post:* Crucial distinction. The theorem is about *expected* value before looking. You can look, get bad news, and feel worse (ex-post), but looking was still the right decision *beforehand*. However, if the "bad news" itself hurts utility (not just via action), the theorem breaks.
          *   *(2) Meaning of "Free":* This is the big one. In economics, "cost" includes utility. If looking causes dread, it's not free. Good's theorem assumes utility depends on *state of the world + action*, not *knowledge state*. If utility depends on *beliefs* (e.g., hope), info can be costly.
          *   *(3) Scope of Rationality (EU vs. others):* Roommate is wrong here. It relies heavily on the EU structure (linearity in probabilities). Risk aversion (within EU) doesn't break it. But models where people care about beliefs directly (caplin/leahy, psychological game theory) do break it.
          *   *(4) Commitment:* Relevant if info is harmful non-instrumentally. If I can't commit to ignoring it, and it hurts me, I should avoid it. If I *could* commit to ignoring it, I'd be indifferent (since info has no instrumental value if ignored).

      *   **Part 4: Synthesizing the "Medical Test" Example:**
          *   Why do people avoid tests?
          *   Reason A: No treatment available. (Instrumental value = 0).
          *   Reason B: Dread/Anxiety. (Direct utility cost > Instrumental value).
          *   Reason C: Hope/Blissful Ignorance. (Utility derived from uncertainty).
          *   Good's theorem only covers Reason A (where value $\ge$ 0). It doesn't cover B and C because those violate the "free" and "utility function" assumptions.

      *   **Part 5: Conclusion:**
          *   Roommate is right about the *math*, wrong about the *philosophy/psychology*.
