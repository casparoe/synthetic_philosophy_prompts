  Constraints: no predictors, no simulations, no literal copies of anyone — the two of you are just people who happen to think alike, the way lab siblings do. The stakes should be ordinary (careers, prestige, maybe a competing grant), nothing exotic. The scenario itself should be one paragraph. After the scenario, walk through each of the three verdicts and why it comes out the way it does, then tell me which single feature of the case is doing the work, and what happens to the split if you remove that feature. Then steelman the evidential theorist's comeback — I want to know whether my screening-off move actually does what I think it does, or whether its just a fancy way of stacking the deck in updatelessness's favor. One more thing: would it matter if the similarity between the two people were merely statistical (similar schools, read the same blogs, same cohort) rather than coming from shared training by the same advisor? If that changes the answer, explain why, because that seems like the interesting part to me.

  And finally, be honest if the three-way split just can't be done under my constraints — I'd much rather hear that my idea doesn't work than get a case that cheats by stipulating the verdicts instead of earning them.
