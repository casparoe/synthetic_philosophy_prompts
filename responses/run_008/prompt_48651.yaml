  So, a bit of background before the actual request: I spent 38 years doing polymer chemistry before I retired, and now that I have all this time on my hands I've fallen down the decision theory rabbit hole. I've worked my way through the causal vs evidential stuff and I think I actually understand it, but lately I've been reading about updateless decision theory and I find the whole thing fascinating but weirdly untested. Every case I can find involves a superintelligent predictor with boxes full of money. I don't believe in Omegas. I was a scientist for four decades — I want a case that could actually happen to two real people in a lab.

