  **The Scenario**
  You and your former lab-mate Alex, both trained by the same demanding advisor Dr. Chen, are simultaneously deciding whether to release a valuable polymer dataset (Cooperate) or hoard it for a patent (Defect). The payoff structure is a standard Prisoner's Dilemma: mutual release yields high prestige for both, mutual hoarding yields low prestige, and unilateral hoarding grants the hoarder a career-making advantage while ruining the other. You share Dr. Chen's rigorous reasoning style, making your decision processes highly correlated. However, just before deciding, you find a private note in your file from Dr. Chen stating, "You are the outlier in this cohort; your risk tolerance is significantly lower than Alex's." This evidence suggests that while Alex is likely to release the data (as is the cohort norm), you are psychologically predisposed to hoard it.

  **The Verdicts**
  *   **Causal Decision Theory (CDT):** Defect. Your choice cannot causally influence Alex's choice; you are distinct physical entities. Since Defect is the dominant strategy in a one-shot Prisoner's Dilemma regardless of what the other party does, you hoard the data.
  *   **Evidential Decision Theory (EDT):** Defect. You condition on your private evidence. $P(\text{Alex Releases} | \text{You Release}, \text{Note})$ is low because the note screens off the correlation: it tells you that you are *not* like Alex. Your action no longer serves as evidence for Alex's action. Since you expect Alex to Release (cohort norm) and you to Hoard (note), Hoarding maximizes your expected utility against a Cooperator.
  *   **Updateless Decision Theory (UDT):** Cooperate. UDT selects a decision *policy* before receiving the private note. From that prior perspective, the logical correlation derived from shared training (Dr. Chen's "source code" in your minds) is strong. The optimal policy is "Release," because a policy of "Release" paired with Alex's likely "Release" yields higher utility than "Hoard" paired with "Hoard." UDT argues you should execute the optimal policy despite the note, treating the note as an observation that shouldn't override the logical subjunctive dependence established by your shared training.

  **The Single Feature Doing the Work**
  The split relies entirely on the **private evidence acting as a "screening-off" variable that breaks statistical correlation but not logical dependence.** The note tells EDT that the statistical link is broken (you are an outlier), forcing it to defect. CDT defects because it never saw a link. UDT cooperates because it claims the logical link (shared reasoning architecture) survives the statistical noise of the note.

  **Removing the Feature**
  If you remove the private note, EDT and UDT converge on **Cooperate**. Without the note, your action is once again strong evidence of Alex's action (EDT cooperates), and the logical correlation remains intact (UDT cooperates). CDT still defects. The three-way split collapses into a two-way split (CDT vs. Everyone Else).

  **Steelman EDT's Comeback**
  EDT argues that your "screening-off" move is actually a failure to update on reality. The note isn't just noise; it is evidence of your current psychological state. If you are genuinely risk-averse (as the note implies), then your *actual* decision algorithm is already biased toward hoarding. To claim you can "choose" a policy of Cooperating despite being risk-averse is to pretend you have a freedom you don't possess. EDT contends that ignoring relevant self-locating evidence is irrational; if the evidence says you are the type who defects, then conditioning on your action *should* reflect that you are likely to defect. By ignoring the note, UDT isn't being "updateless," it's being deluded about its own nature.

  **Statistical Similarity vs. Shared Training**
  Yes, this changes the answer critically. If your similarity to Alex were merely statistical (same schools, read the same blogs) rather than causal (shared advisor/training), **UDT would defect.** UDT requires *logical* or *subjunctive* dependence—a shared source of the decision algorithm—to justify cooperation. Statistical correlation is not enough; if you are just two people who happen to be similar, there is no logical reason why your decision function *must* output the same result as Alex's. Shared training implies a common "source code" origin, which gives UDT the foothold it needs to claim logical dependence. Without that specific causal history of the reasoning process, the three-way split collapses, and UDT aligns with CDT.

  **Honesty Check**
  I must be direct: **A clean three-way split with biological humans is theoretically fragile.** UDT is formally defined for agents with known source code or deterministic algorithms. Applying it to humans requires the contentious metaphysical assumption that "shared training" creates a logical link strong enough to override private evidence of psychological difference. In strict physical terms, you and Alex are not logical copies; you are distinct atoms. If you reject the premise that human reasoning is sufficiently deterministic to count as "logical dependence," UDT collapses to CDT (Defect), and the split vanishes. The scenario works only if you accept the UDT metaphor that human minds can be treated as instantiations of the same abstract algorithm.
