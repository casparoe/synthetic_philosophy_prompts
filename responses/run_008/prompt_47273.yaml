  9.  **Tone:** Academic, respectful, collaborative, precise. (Matches the user's level).

  10. **Final Polish:** Ensure I don't take sides. Ensure I reference the specific philosophers mentioned (Saul, Shiffrin, Stokke). Ensure I address the "parasitic" claim directly.

  *(Self-Correction on "Parasitic"):* I need to be careful. If the semantics are unresolved, the moral claim lacks a foundation. But if the semantics are resolved, the moral claim *still* needs justification. So it's not *purely* parasitic. It's *foundational* but not *determinative*. I will frame it as "The semantic dispute provides the vocabulary, but the meta-ethical dispute provides the grammar."

