      *   The flaw is in the **individuation of events/actions**.
      *   *Diagnosis:* The argument is valid *if* you assume a sparse theory of events where every object with the causal power generates its own event token. But if events are individuated by causal role, and the roles are identical, there is only one event token *realized* by two objects.
