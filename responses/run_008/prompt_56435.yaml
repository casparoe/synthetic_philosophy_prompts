      *   To keep "One Thinker," you must deny that the Body thinks *even if* it is in the physical state.
      *   How? By saying "Thinking" isn't just the physical state; it's the physical state *plus* the sortal context.
      *   This attacks (7). (7) is too simple. "Thinking is being in a physical state" is a type-identity theory. A token-identity or functionalist view might allow the Body to have the state but not the *thought* (because the thought requires a subject with persistence conditions the Body lacks).
      *   *Actually, the best move:* Attack the inference from "Two Objects" to "Two Thinkers."
      *   Just because there are two subjects doesn't mean there are two *instances* of thinking if the thinking is grounded in the matter.
      *   Analogy: The statue weighs 10lbs. The clay weighs 10lbs. Does the box weigh 20lbs? No.
      *   Why? Because the weight is grounded.
