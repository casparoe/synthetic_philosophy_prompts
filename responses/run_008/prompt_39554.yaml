              2.  Death is foreseen/near-certain side effect, *not* a means.
              3.  Clinician would seize a workaround if available.
              4.  **Verdicts:** Act Consequentialist = Permits; DDE Theorist = Permits; Oblique Intention Theorist (Prosecutor) = Condemns.
          *   Must demonstrate *why* the verdicts fall out (not stipulate them).
          *   Identify the feature keeping death outside the plan (User suspects counterfactual test).
          *   Provide Prosecutor's best attack and DDE's best reply (addressing commitment vs. prediction).
