          *   *Bet:* Rule A. Why? Because Case 2 invalidated consent based on innocently passed info. If innocent misinformation invalidates, silent knowledge of misinformation should also invalidate to maintain the integrity of resource scheduling precedents. Case 1 and 2 prioritize the accuracy of the operational context over the method of error.
      *   *Further Case:* A member agrees to mentor a novice based on the novice's assumption that mentorship includes tool certification, which it doesn't; the mentor knows the novice believes this but never confirms it, and the novice never asks. (Tests the duty to correct silent assumptions vs. active misinformation).
      *   *Principles:*
