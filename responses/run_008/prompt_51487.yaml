      *   *Reasoning:* Consent requires a mutual accurate understanding of material constraints governing the arrangement; like the shared-kiln precedent, this agreement rests on a false belief about scheduling access, and the partner's silent knowledge of that impossibility precludes validating a bargain founded on a factual error regarding space resources.
