      *   *Case 6 (Painkillers):* Consent invalid. Reason: Incapacity (strong painkillers). Key factor: Cognitive impairment affecting judgment.

      *   *Synthesis of Principles:*
          *   Consent is invalid if based on false information (Cases 1 & 2).
