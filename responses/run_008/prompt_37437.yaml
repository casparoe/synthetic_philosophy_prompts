answer: |-
  There is no single, canonical term in the sociology or historiography of science that isolates this specific mechanism—the *retroactive re-evaluation of quality* used to justify credit allocation—distinct from the broader accumulation of advantage.

  While the phenomenon you describe is widely recognized and discussed, it is currently fragmented across several concepts. The **Matthew Effect** (Merton, 1968) explains the *accumulation* of credit by the prestigious, but it focuses on the distribution of recognition rather than the *narrative reconstruction* of the loser's work. **Obliteration by Incorporation** (Merton, 1968) describes when an idea becomes so common knowledge that the originator is forgotten entirely, which differs from your case where the originator is remembered but downgraded to a "precursor." **Whig History** describes the retroactive judgment of past science by present standards, but it applies to historiography generally, not specifically to priority disputes between contemporaries.

  Because the existing lexicon captures the *outcome* (inequality) or the *context* (priority disputes) but not the specific *mechanism of narrative downgrading*, I propose the term **Retroactive Precursorization**.

  ### Proposed Term: Retroactive Precursorization

  **Definition:**
  *Retroactive Precursorization* is the sociological process by which, following a priority dispute or independent simultaneous discovery, the scientific community consolidates credit around a single "winner" by retrospectively recharacterizing the rival's contribution. This recharacterization redefines the rival's work not as a co-discovery, but as an incomplete anticipation, lacking essential rigor, timing, or conceptual clarity that is attributed solely to the winner. The mechanism serves to legitimize the unequal allocation of credit by transforming a sociological advantage (prestige, connections) into an epistemic distinction (quality, completeness).

  ### Distinction from Related Concepts

  | Concept | Focus | How it differs from Retroactive Precursorization |
  | :--- | :--- | :--- |
  | **The Matthew Effect** | **Accumulation:** The famous get more credit than the unknown for similar work. | Explains *why* the winner wins (status), but not *how* the loss is justified (narrative rewriting of quality). |
  | **Priority Dispute** | **Conflict:** The active contention over who discovered what first. | Describes the *contest*, not the *resolution mechanism* where one side is downgraded to "precursor." |
  | **Obliteration by Incorporation** | **Forgetting:** The originator is forgotten because the idea is absorbed. | The rival is *not* forgotten in Retroactive Precursorization; they are remembered specifically as a "near miss" or "anticipator." |
  | **Whig History** | **Historiography:** Judging past science by modern standards. | Applies to historical analysis generally, not specifically to the credit allocation between two living or contemporary rivals. |

  ### Boundary Cases: Genuine vs. Invented Differences

  To distinguish *Retroactive Precursorization* from legitimate historical assessment, one must examine the timing and consistency of the critique.

  **1. Genuine Epistemic Difference (Not Retroactive Precursorization)**
  *   **Case:** One formulation allows for calculation the other does not.
  *   **Example:** In the calculus dispute, if Leibniz's notation demonstrably allowed for operations Newton's fluxions could not easily perform *at the time*, and contemporaries noted this utility immediately.
  *   **Indicator:** Contemporary correspondence or reviews explicitly note the deficiency *before* the priority verdict is settled. The "lack of rigor" is a documented, contemporaneous critique, not a later justification.

  **2. Invented Difference (Retroactive Precursorization)**
  *   **Case:** The "deficiency" is identified only after the credit is assigned.
  *   **Example:** Wallace is often described as lacking Darwin's "mechanism" of natural selection, despite Wallace's letter explicitly outlining natural selection. The distinction is sharpened post-hoc to make Darwin's *Origin* the definitive moment and Wallace's letter a mere trigger.
  *   **Indicator:** The criteria for "completeness" or "rigor" shift *after* the dispute resolves. The winner's work is treated as the standard of rigor, and the loser's work is judged against that specific standard, rather than a neutral one.

  **3. The Boundary Line**
  The boundary is crossed when the *reason* for the credit allocation changes over time.
  *   **Initial Phase:** "Person A published first/in a better journal." (Sociological reason)
  *   **Later Phase:** "Person A deserves credit because Person B's work was incomplete/less rigorous." (Epistemic reason)
  *   **Diagnosis:** If the epistemic reason appears *only* in the later phase to justify the initial sociological outcome, it is *Retroactive Precursorization*.

  ### What Would Change My Mind

  I would revise this position under two conditions:

  1.  **Evidence of an Established Term:** If you can point to a specific phrase in the sociology of scientific knowledge (SSK) literature—perhaps in the work of **Steven Shapin**, **Bruno Latour**, **Robert Merton**, or **Harry Collins**—that specifically names this *narrative downgrading* mechanism. For example, if Latour's concept of **"Irreversibility"** or Collins' concept of **"Closure"** is formally defined to include this specific qualitative re-evaluation of the loser, then *Retroactive Precursorization* is merely a descriptive synonym for an existing technical term.
  2.  **Evidence of Genuine Rigor Gaps:** If historical analysis of the Darwin-Wallace or Newton-Leibniz cases conclusively demonstrates that the "loser's" work was *objectively* insufficient by the standards of *their own time* (not ours), independent of the winner's prestige. If the "lack of rigor" was a contemporaneous consensus *before* the credit was consolidated, then the phenomenon is not a sociological rewriting but a legitimate epistemic filter, and the term *Retroactive Precursorization* would be misapplied.

  ### Summary
  You have identified a gap in the terminology. The **Matthew Effect** explains the *advantage*, but **Retroactive Precursorization** names the *justification*. It is the mechanism by which social capital is converted into epistemic authority after the fact, ensuring that the winner is seen not just as luckier or better connected, but as *better*.
