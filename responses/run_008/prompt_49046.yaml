  i've been chewing on something and can't tell if I'm being dumb or onto something. so the KK principle (if you know p then you know that you know p) — i get why people find it intuitive. but it seems to me it has a crazy consequence nobody talks about: shouldn't the mirror version hold too? like if knowledge always comes with knowing that you know, then ignorance should come with knowing that you don't know. otherwise the whole thing is asymmetric in a weird way. but obviously nobody knows all the things they don't know! I have no idea whether there's milk in my fridge at home right now, and I also have no idea about a million stranger things I've never even thought to wonder about. and the dunning-kruger stuff seems to seal it, people walk around not knowing that they don't know things constantly. so KK is basically refuted by everyday life and psychology, right? but I googled a bit and apparently philosophers still defend versions of it, which confuses me.

  anyway — act like you're a professional epistemologist and don't just agree with me. think carefully and maybe brainstorm a little before answering: is my "mirror" argument actually valid, or am I making some kind of logical slip (like mixing up contraposition with just inverting the conditional)? be honest about where my reasoning goes off the rails.
