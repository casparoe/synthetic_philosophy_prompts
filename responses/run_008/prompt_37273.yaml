answer: |-
  # The Scientific Realism Decision Tree

  **Start:** Mature physical theories yield novel predictions. This success calls for explanation.  
  **Q1:** Does this explanation require that the theory's claims about the *unobservable* world are **approximately true**?  
  │  
  ├── **NO** → Go to **Q2**.  
  └── **YES** → Go to **Q4**.  

  **Q2:** Is a scientific theory a **literal claim** about the world (which we suspend judgment on) or merely a **calculational tool**?  
  │  
  ├── **Tool** → **INSTRUMENTALISM**.  
  │   *Awkward Commitment:* Cannot explain why some theoretical tools work better than others without smuggling in truth.  
  │  
  └── **Claim** → **Q3**.  

  **Q3:** Do we commit only to the theory's **empirical adequacy**, or also to the reality of its **mathematical structure** (of observables)?  
  │  
  ├── **Adequacy Only** → **CONSTRUCTIVE EMPIRICISM** (van Fraassen).  
  │   *Awkward Commitment:* The distinction between 'observable' and 'unobservable' is vague and shifts with technology.  
  │  
  └── **Structure Real** → **STRUCTURAL EMPIRICISM**.  
  │   *Awkward Commitment:* Hard to distinguish from Epistemic Structural Realism without committing to unobservable ontology.  

  **Q4:** In historical replacements (e.g., Fresnel's ether → Maxwell's fields), is the **ontology (entities)** retained or just the **mathematics**?  
  │  
  ├── **Math Only** → **Q7**.  
  └── **Entities Retained** → **Q5**.  

  **Q5:** Must you be able to **causally manipulate** an entity (e.g., spray electrons) to believe it exists?  
  │  
  ├── **YES** → **ENTITY REALISM** (Hacking).  
  │   *Awkward Commitment:* Grants existence of entities but remains agnostic on the truth of the theories describing them.  
  │  
  └── **NO** → **Q6**.  

  **Q6:** Is the **entire theoretical framework** of mature science approximately true?  
  │  
  ├── **YES** → **CONVERGENT REALISM**.  
  │   *Awkward Commitment:* Highly vulnerable to the Pessimistic Induction regarding past 'mature' theories.  
  │  
  └── **NO** → **Q6b**.  

  **Q6b:** Is reference fixed by **theoretical description** (working posits) or **causal powers**?  
  │  
  ├── **Description** → **SELECTIVE REALISM** (Psillos).*  
  │   *Awkward Commitment:* Difficult to identify 'working posits' independently of the theory's success.  
  │  
  └── **Causal Powers** → **SEMI-REALISM** (Chakravartty).*  
  │   *Awkward Commitment:* Requires a robust metaphysics of dispositions independent of theory.  
  │   **(\*Note:** On this tree, Selective and Semi-Realism answer identically; they differ only in metaphysical grounding, not empirical commitment.)  

  **Q7:** If two particles swap all relational properties, is there a **'this-ness' (haecceity)** remaining?  
  │  
  ├── **YES** (Objects underlie structure) → **EPISTEMIC STRUCTURAL REALISM** (Worrall).  
  │   *Awkward Commitment:* If we know nothing of the nature of the relata, the structure describing them is unintelligible.  
  │  
  └── **NO** (Structure is fundamental) → **ONTIC STRUCTURAL REALISM**.  
  │   *Awkward Commitment:* Struggles to make sense of 'relations' without 'relata' (something to relate).  

  **UNOCCUPIED SPACE:**  
  │  
  ├── **Claim is False** (At Q2) → **ERROR THEORY**.  
  │   *Diagnosis:* **Incoherent.** Treating theory as a literal claim but believing it is systematically false undermines the 'claim' status.  
  │  
  ├── **Objects w/o Properties** (At Q7) → **BARE PARTICULARS**.  
  │   *Diagnosis:* **Unattractive.** Posits entities that are in principle unknowable and causally inert; violates Leibniz's Law.  
  │  
  └── **Success is Luck** (At Q1) → **SKEPTICAL ACCIDENTALISM**.  
  │   *Diagnosis:* **Incoherent.** Contradicts the starting premise that success calls for non-lucky explanation.  

  ***

  **Instructor Note:**  
  I found three branches difficult to phrase neutrally. First, **Q1** ("approximately true") risks alienating structuralists who reject 'truth' for 'empirical adequacy,' but 'adequacy' biases the Anti-Realist wing. Second, the split between **Selective and Semi-Realism (Q6b)** is the weakest link; in practice, students often answer these identically because 'working posits' and 'causal powers' overlap significantly in case studies (e.g., the electron). I flagged this in the leaf notes, but you should be prepared to defend why they are distinct metaphysical commitments rather than distinct empirical predictions. Finally, **Q7** (Haecceity) is the standard OSR/ESR divider, but students unfamiliar with quantum statistics may find the thought experiment abstract; have the permutation argument ready to supplement the handout.
