  *Let's finalize the Charters:*
  1.  **Population Trust:** Maximize ungulate headcount at Year 10.
  2.  **Compassion Trust:** Minimize total "suffering-days" (starvation/disease count heavily).
  3.  **Ecological Trust:** Maximize vegetation health + Predator presence.
  4.  **Non-Interference Trust:** Minimize deaths *directly caused by human action*.

  *Wait, one nuance:* If Non-Interference minimizes human-caused death, they should never cull and never vaccinate (invasive). But if predators arrive, do they remove them? Removing them is human action. Allowing them is allowing death. This charter is the hardest. It forces the "Leave Nature Alone" paradox.

