  8.  **Polishing the Tone:**

      *   Keep it professional, pedagogical, and ready-to-use.
      *   Ensure the "Instructor Script" is distinct from the "Student Materials."
      *   Emphasize the *feeling* of the wedge.

  *(Self-Correction during drafting)*: I initially thought about having them calculate scores. No, that takes too long. The Facilitator should calculate scores while they debrief, or just declare the "winners" based on a quick rubric. Better: The Facilitator reveals the scores *during* the debrief to drive the discussion.
  *Correction on R3:* The prompt asks for the "Doomed Surplus" to be a specific question. I will add a "Data Sheet" to Round 3 that includes this statistic and ask them to record their moral judgment on it before voting.

