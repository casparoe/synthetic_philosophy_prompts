  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level environmental ethics seminar, 15 students, 80 minutes, movable seating.
      *   **Goal:** Create a structured decision-making game to reveal the tension between ecosystem-level ethics (holism) and individual animal ethics (welfarism). Students should feel this wedge through gameplay mechanics (hidden charters/scoring) rather than lecture.
      *   **Core Mechanic:** Four boards of trustees managing a nature reserve. Three decision rounds. Hidden charters define success criteria (e.g., max population, min suffering, ecological integrity, min direct intervention).
      *   **Specific Rounds:**
          *   Round 1: Winter crisis (Feed vs. Cull vs. Nothing).
          *   Round 2: Disease (Mass Cull vs. Vaccinate vs. Let Run).
          *   Round 3: Predator Recolonization (Tolerate vs. Remove vs. Ignore).
      *   **Specific Mechanics to Include:**
          *   "That's Natural" Card (one-time use, immune to challenge).
          *   "Doomed Surplus" Concept (predation vs. starvation).
          *   Scoring/Charters (Hidden objectives).
      *   **Debrief:** Map gameplay to concepts (aggregate vs. individual, "naturalness," identification with species).
      *   **Failure Modes:** Anticipate problems (gaming the script, moral refusal, time management, perceived unfairness).
      *   **Limits:** Acknowledge what the game *can't* teach (scale of suffering, statistical vs. vivid death, uncertainty).

  2.  **Refine the Game Structure (The "Reserve Dilemma"):**

      *   *Time Management:* 80 minutes is tight for 3 rounds + debrief. Need strict timing.
          *   Intro/Setup: 10 min.
          *   Round 1 (Decision + Reveal): 15 min.
          *   Round 2 (Decision + Reveal): 15 min.
          *   Round 3 (Decision + Reveal + Doom Surplus): 15 min.
          *   Scoring/Reveal: 10 min.
          *   Debrief: 15 min.
      *   *Group Size:* 15 students / 4 boards = ~4 students per board. One board will have 3. This works for discussion.
      *   *Charters:* Need to ensure they are distinct and potentially conflicting.
          1.  **Population Maximizer:** Count heads at Year 10. (Utilitarian/Conservationist)
          2.  **Welfare Minimizer:** Minimize "slow/suffering" deaths. (Animal Welfare)
          3.  **Integrity Keeper:** Vegetation health + Predator presence. (Ecocentric)
          4.  **Clean Hands:** Minimize deaths *caused by us*. (Deontological/Non-interference)
      *   *Rounds:* Need to ensure the consequences hit the charters differently.
          *   R1 (Winter): Feed (High Pop, High Suffering later), Cull (Low Pop, Low Suffering, High Intervention), Nothing (Med Pop, High Suffering, Low Intervention).
          *   R2 (Disease): Vaccinate (High Cost, Low Death, High Intervention), Cull Affected (Low Death, High Intervention), Let Run (High Death/Suffering, Low Intervention).
          *   R3 (Predators): Tolerate (High Naturalness, High Visible Death), Remove (Low Naturalness, Low Visible Death), Ignore (Drift). *Crucial:* Introduce "Doomed Surplus" here.
      *   *The "Natural" Card:* Needs to be physical. Limits debate.
      *   *The "Doomed Surplus" Mechanic:* In Round 3, reveal data that X% of those eaten would have starved. Ask boards to rate the "badness" of that death.

  3.  **Drafting the Content - Section by Section:**

      *   **Title:** Needs to be academic but engaging. "The Reserve Paradox."
      *   **Setup:** Clear instructions on seating and materials.
      *   **Charters:** Write them out explicitly so the instructor can print them.
      *   **Rounds:** Script the outcomes clearly. Ensure the tension exists.
          *   *Correction on R1:* The prompt suggests feeding leads to a crash *later*. This needs to be tracked. I'll simplify the tracking for the facilitator so they don't get bogged down in math.
      *   **The "Natural" Card:** Define the rule strictly.
      *   **The "Doomed Surplus" Injection:** This needs to happen *during* Round 3 deliberation or immediately after. Let's put it *before* the R3 vote to influence the decision, or *after* to challenge the scoring. The prompt asks for a round where they are asked explicitly. Let's make it part of the R3 briefing packet.
      *   **Scoring:** How to calculate winners? Keep it simple. Points per round based on charter goals.
      *   **Debrief:** Structure the questions exactly as requested (aggregate vs. humane, integrity definition, identification).
      *   **Failure Modes:** Be honest. Students *will* try to hack the game. Students *will* feel moral distress.

  4.  **Refining the Tension (The "Wedge"):**

      *   *The Trap:* In R1, Welfare and Clean Hands might align on "Nothing" (don't intervene, don't cull), but Population wants "Feed." Integrity might want "Cull" (save vegetation).
      *   *The Switch:* In R3, Welfare might want "Remove Predators" (save individuals), but Integrity wants "Tolerate." Clean Hands might want "Remove" (stop us from allowing death?) or "Ignore" (don't intervene). *Wait, Clean Hands is tricky.* If predators kill, is that "caused by us" if we allowed predators? Yes. So Clean Hands might want to remove predators to keep hands clean of *allowing* death, or ignore to keep hands clean of *killing*. This ambiguity is good.
      *   *The "Natural" Card:* A Welfare board might use it to justify *not* vaccinating (let nature take its course). An Integrity board might use it to justify *allowing* predators. The debrief must highlight this contradiction.

  5.  **Addressing Specific Constraints:**

      *   *Time:* 80 minutes is very short for 3 rounds of group decision + public defense. I need to advise the instructor to be a strict timekeeper.
      *   *Moral Refusal:* If a student refuses a charter, do they sit out? No, that breaks the game. They must play the role to understand the logic. I will advise the instructor to frame it as "fiduciary duty."
      *   *Doomed Surplus:* Make sure the distinction between *population level* (non-additional) and *individual level* (still dead) is clear in the debrief.

  6.  **Developing the Failure Modes & Limits:**

      *   *Gaming:* Students will ask "What gives us points?" Instructor must say "Play according to your charter, not to win."
      *   *Unfairness:* Some charters are harder. Acknowledge this. The "Clean Hands" charter is almost impossible to keep clean in a managed reserve. That's the point.
      *   *Limits:* The game is clean. Reality is messy. The game abstracts suffering. The debrief must restore the moral weight.

  7.  **Final Review against Prompt:**

      *   *15 students, 80 mins?* Yes, tight but doable with strict timing.
