prompt: |-
  Retired physicist here — 35 years in condensed matter, now in my late 60s and pretty deep into decision theory as a hobby. Everyone knows Bernoulli's St. Petersburg game by now: fair coin flipped until the first heads, payoff doubling every tails, expected value infinite, yet no one pays much to play, and Bernoulli's diminishing-marginal-utility fix became the textbook resolution. But the more I read the more loose threads I find that all seem live, and I can't tell which ones actually matter and which are just curiosities. So: act as an expert decision theorist, think carefully before answering, and give me a defended prioritization — reasoning, not just a list.

  The candidates as I understand them: (1) how an agent with a finite bankroll, facing a casino with finite resources, should actually price the game — the various truncation and "reasonable price" proposals; (2) the Pasadena variant, where the payoffs alternate in sign and the expected value comes out as a conditionally convergent series whose sum depends on how you order the terms — does that show expectation was never well-defined for games like this, or is it a technicality; (3) whether rational utilities have to be bounded — I gather that for any unbounded utility you can rebuild a St. Petersburg in utility terms, but capping utilities apparently has strange downstream consequences for aggregative ethics, something about huge populations; and (4) the two-envelope business, which smells like a parlor trick to me but apparently won't die.

  For each, say why it ranks where it does: importance, tractability for a mathematically literate outsider like me rather than a career academic, and, crucially, which questions are upstream of which — I want the dependency structure, since I can only really spend effort on one or two. And be honest about which of these, if any, recieve more attention than they deserve.
