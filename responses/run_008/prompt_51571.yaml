answer: |-
  This is a profound question that cuts to the bone of the philosophy of science. You and your friend have stumbled upon the central tension between **Scientific Realism** (theories describe the world as it really is) and **Anti-Realism** (theories are just tools for prediction), specifically through the lens of **Theory Change**.

  The pedagogical practice you describe—keeping the math of dead theories while discarding their ontology—is indeed the primary motivation for **Epistemic Structural Realism (ESR)**. However, your intuition that this practice is underdetermined is also correct. The curriculum can function under multiple philosophical banners, but it becomes philosophically unstable if it tries to hold all of them at once without admitting it.

  Here is the reconstruction of the view, the points of underdetermination, the hidden incoherences, and the concrete consequences of an instrumentalist shift.

  ---

  ### 1. The Reconstructed View: Convergent Structural Realism

  To make sense of the curriculum as it stands—where Newton is "wrong" but useful, and the Standard Model is "right"—the pedagogy implicitly relies on a specific view of truth and knowledge. Let's call this **Convergent Structural Realism**.

  *   **View of Truth:** Truth is not binary (true/false) but **approximate and structural**. A theory is "true" insofar as its mathematical structure maps onto the structural relations of the world, even if its description of the *relata* (the things doing the relating) is incorrect.
  *   **View of Knowledge:** Scientific knowledge accumulates **structurally** but not **ontologically**. We learn more about the "equations of nature" over time, but our guesses about the "furniture of nature" (ether, caloric, electrons) are provisional.
  *   **The Presupposition:** This view presupposes that there is a mind-independent reality that constrains our equations. If the equations of the ether theory work for light, it's not just luck; it's because the *structure* of the electromagnetic field is real, even if the *substance* (ether) is not.

  **Why your friend leans this way:** She sees the survival of the math as evidence that we are latching onto something real (the structure). If the math were just a human invention, why would the Fresnel equations survive the death of the ether? To her, the persistence of the structure *is* the truth claim.

  ### 2. The Underdetermination: Where You Are Right

  You argued that a thoroughgoing pragmatist or instrumentalist could run the same curriculum without embarrassment. **You are correct.** The pedagogical practice of teaching superseded theories is **philosophically underdetermined**.

  *   **Instrumentalism:** An instrumentalist teaches Newtonian mechanics not because it is "approximately true" about space and time, but because it is **computationally efficient** within a specific domain (low velocity, high mass). They don't believe the equations correspond to reality at all; they believe the equations correspond to *observations*.
  *   **Constructive Empiricism:** Following Bas van Fraassen, a teacher could say: "We accept Newtonian theory as *empirically adequate* (it saves the phenomena), but we remain agnostic about whether absolute space exists."

  **The Crucial Distinction:**
  *   **Strict Requirement:** The curriculum *strictly requires* that the mathematics be **empirically adequate** within its defined domain. It requires that students learn which tool yields the correct prediction for a given problem.
  *   **Comfortable Fit:** The curriculum *sits comfortably* with Realism or Structural Realism, but it does not *require* them. You can solve a pendulum problem believing the equations are divine law, or believing they are a useful fiction. The pencil moves the same way on the paper.

  So, the practice does not prove your friend's Structural Realism. It only proves that **predictive structure is more durable than ontological narrative.**

  ### 3. The Incoherence: The Asymmetry Problem

  This is where the curriculum becomes philosophically unstable. You identified the wrinkle: textbooks teach current unobservables (quarks) realistically but past unobservables (caloric) anti-realistically.

  **The Tension:**
  1.  **Past:** "Caloric theory was false. Caloric fluid never existed. But the heat equations are kept."
  2.  **Present:** "Quantum Field Theory is true. Quarks exist. Use the equations."
  3.  **The Conflict:** If the criterion for keeping a theory is "mathematical success," caloric theory succeeded for a century. If the criterion for belief is "mathematical success," why believe in quarks?

  **The Incoherence:**
  The standard curriculum implicitly commits the **No Miracles Argument** for current theories (it would be a miracle if QM worked so well if quarks weren't real) while simultaneously accepting the **Pessimistic Meta-Induction** for past theories (past successful theories were false, so ours might be too).

  To resolve this, the curriculum usually relies on an **unargued asymmetry**: *We are the end of history.* It treats current ontology as "final" and past ontology as "provisional."
  *   **Structural Realism** fixes this by saying: "Quarks might not exist as little balls, but the group symmetries describing them are real."
  *   **Naive Realism** (common in intro texts) breaks here. It claims electrons *exist* like chairs exist, but caloric *didn't*. This is philosophically incoherent given that both were posited to explain empirical data via similar mathematical means.

  **Verdict:** The practice presupposes a **selective realism** that is historically naive. It assumes we have finally crossed the threshold from "useful models" to "true description," despite having no external vantage point from which to verify that claim.

  ### 4. The Instrumentalist Swap: Concrete Pedagogical Changes

  Suppose we replaced the implicit "Convergent Structural Realism" with **Straightforward Instrumentalism** (theories are tools, not descriptions). What would actually change in the degree?

  **What Would Change (The Narrative):**
  1.  **Ontological Commitments:** Textbooks would stop saying "Electrons are particles/fields." They would say "The electron model predicts spectral lines." The confident realist register regarding unobservables would vanish.
  2.  **History of Science:** History wouldn't be taught as a "march of errors" (they were wrong, we are right). It would be taught as a "toolkit expansion" (they had a hammer for this job, we have a laser cutter for this job). The ether wouldn't be a "mistake"; it would be a "discarded scaffold."
  3.  **Truth Claims:** Exams would not ask "What is the nature of X?" but "Which model best predicts X?" The concept of "approximate truth" would be replaced by "domain validity."
  4.  **Interpretation of Math:** The wave function wouldn't be taught as "what the system is," but as "a catalog of our expectations for measurement."

  **What Would Be Immune (The Practice):**
  1.  **The Mathematics:** The Schrödinger equation, Maxwell's equations, and Newton's laws remain identical.
  2.  **The Hierarchy:** Newton is still taught before Einstein, not because Newton is "truer," but because he is "computationally cheaper" for low energies.
  3.  **The Problem Sets:** "Calculate the orbit" remains the task. The criteria for a correct answer (matching observation) do not change.
  4.  **The Retention of Old Theories:** We would still teach Caloric theory's math (thermodynamics) and Ether math (Maxwell's equations). The justification shifts from "the structure is real" to "the algorithm works."

  ### 5. The Verdict: Requirements vs. Comfort

  You and your friend got stuck because you were arguing over what the practice *implies*, while the practice itself is agnostic. Here is the sharp distinction you requested:

  **What the Practice Strictly Requires:**
  *   **Empirical Adequacy:** The equations must yield predictions that match observation within a specified error margin.
  *   **Internal Consistency:** The mathematical structure must not contradict itself within its domain.
  *   **Domain Demarcation:** The curriculum must teach students *when* to switch tools (e.g., when to switch from Newton to Einstein).
  *   **Structural Continuity:** It requires that new theories reproduce the successful predictions of old theories in the old domain (Correspondence Principle).

  **What the Practice Merely Sits Comfortably With:**
  *   **Ontological Realism:** Believing electrons *actually exist* is comfortable for teaching, but not required for calculation.
  *   **Structural Realism:** Believing the math *mirrors nature's structure* is a comforting narrative for why old math survives, but an instrumentalist can explain survival via "efficiency selection."
  *   **Convergent Truth:** The idea that we are getting "closer to the truth" is a motivational story, not a operational requirement.

  **The Resolution:**
  Your friend is right that **Structural Realism** is the philosophy that *best justifies* the curriculum's narrative (why keep the math if the world isn't structured that way?).
  You are right that **Instrumentalism** is the philosophy that *best describes* the curriculum's actual activity (solving problems without needing to know what's "really" there).

  The incoherence lies in the textbook's attempt to have it both ways: demanding the **ontological confidence** of a Realist ("Quarks exist!") while retaining the **ontological flexibility** of an Instrumentalist ("Newton was wrong, but use his math").

  **Final Answer:** The curriculum presupposes **Structural Realism** to explain the past, but teaches **Naive Realism** about the present. This is not coherent. To make it coherent, the degree must either admit that current ontology (quarks) is as provisional as past ontology (ether), relying only on the math (Structural Realism), or admit that *all* ontology is merely a useful way of speaking about measurements (Instrumentalism). As it stands, it asks students to believe the furniture of the past was fake, but the furniture of the present is real, while using the blueprints from both to build the same house. That is not philosophy; that is historical privilege.
