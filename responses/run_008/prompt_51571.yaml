      *   *Nuance:* The "Approximate Truth" claim. The friend says equations are approximately true. The user says that implies knowing what is true. I need to side-step this by defining "truth" in terms of structural correspondence vs. empirical adequacy.
      *   *Tone:* Keep it rigorous but accessible. The user is reading philosophy at 2 a.m., so they can handle terms like "Pessimistic Meta-Induction" and "Empirical Adequacy," but explain them clearly.

  5.  **Final Polish:**

      *   Ensure the distinction between "Strictly Requires" and "Sits Comfortably" is the climax of the answer.
      *   Check that all parts of the prompt are addressed.
      *   (Self-Correction on "Instrumentalism"): Make sure to distinguish between *old* instrumentalism (logic positivism) and *constructive empiricism* (Van Fraassen), as the latter is more relevant to the "observable/unobservable" distinction regarding electrons.

