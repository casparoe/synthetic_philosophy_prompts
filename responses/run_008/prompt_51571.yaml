          *   *Pedagogical Shift:* Less "This is how the universe is," more "This is how we model the universe."

      *   **Part 5: Strict Requirements vs. Comfortable Fit (The Core Distinction):**
          *   *Strictly Required:* Empirical adequacy of the math. Consistency within the domain of application.
