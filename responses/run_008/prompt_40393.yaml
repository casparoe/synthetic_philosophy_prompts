answer: |-
  To whom it may concern, we, the undersigned, have spent the last year debating the Sleeping Beauty problem and have reached a point where further unstructured argument yields diminishing returns. We are issuing this joint statement to clarify exactly where we stand, what we agree on, and what specific questions must be answered to resolve our dispute. We both sign this document to affirm that it accurately represents our current positions and our commitment to resolving the remaining differences through the specific tests outlined below.

  First, we agree on the physical setup of the experiment, specifically that a fair coin is flipped, that Beauty is woken once on Heads and twice on Tails with memory wiping between awakenings, and that the coin itself has no bias. Second, we agree on the normative role of credence, accepting that a rational credence should guide betting behavior and avoid Dutch books where possible, meaning that if Beauty says the probability is X, she should act in a way that maximizes expected utility given X. Third, we acknowledge that much of our past year was spent talking past each other, particularly regarding the definition of information and the reference class for probability, and we intend to stop arguing about semantics unless those semantics directly impact a testable prediction.

  Despite this common ground, we maintain a precise disagreement regarding the credence Beauty should assign to Heads upon awakening. The Halfer maintains that the credence must remain 1/2 because waking up provides no new evidence about the coin flip that occurred on Sunday, as Beauty knew in advance she would be woken at least once. The Thirder maintains that the credence must be 1/3 because waking up provides indexical information that selects a random awakening from the set of all possible awakenings, and only one-third of those awakenings occur in a Heads world. We agree that this divergence stems from two specific cruxes, and we have designed concrete variants of the experiment to test each one.

  The first crux concerns whether Beauty learns anything new when she wakes up. To test this, we propose the Extreme Tails variant, where the protocol is changed so that if the coin lands Tails, Beauty is woken one million times instead of just twice, while Heads still results in a single awakening. The Halfer predicts that even in this variant, Beauty's credence in Heads upon awakening should remain 1/2, because the coin fairness is the only relevant chance event and waking was guaranteed regardless of the outcome. The Thirder predicts that in this variant, Beauty's credence in Heads should drop to approximately one in one million and one, because finding oneself awake is vastly more likely under the Tails hypothesis than under the Heads hypothesis. We agree that if the Halfer admits their credence should shift in this extreme case, the Halfer position collapses, and if the Thirder admits credence should remain 1/2, the Thirder position collapses.

  The second crux concerns how credences should be tested with bets, specifically whether payouts should be counted per experiment or per awakening. To test this, we propose the Charity Bet variant, where Beauty is told on Sunday that for every correct guess she makes during the experiment, one dollar will be donated to charity, but she cares only about the total donation per experiment, not per awakening. The Halfer predicts that Beauty should guess Heads every time, because guessing Heads maximizes the expected donation per coin flip experiment, ensuring a donation in the Heads case and preventing a double-donation error in the Tails case that doesn't offset the loss. The Thirder predicts that Beauty should guess Tails every time, because guessing Tails maximizes the expected donation per awakening, and since the Tails scenario generates twice as many opportunities to donate, leveraging those opportunities yields a higher total expected donation across many experiments. We agree that settling which decision rule maximizes the outcome Beauty cares about will determine which credence is operationally correct.

  Finally, we acknowledge that a portion of our dispute appears to be merely verbal, specifically regarding the word evidence. The Halfer uses evidence to mean non-indexical information about the external world, while the Thirder uses evidence to include self-locating information about one's position in time or sequence. We agree to bracket this definition dispute and focus solely on the behavioral and predictive differences outlined in the cruxes above, as resolving the verbal definition will not solve the problem unless it changes our predictions for the Extreme Tails or Charity Bet variants. We commit to revisiting this statement once we have simulated or analyzed these two specific cases, with the understanding that whichever side's predictions align with the rational action in those variants will concede the broader argument.
