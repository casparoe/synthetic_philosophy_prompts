answer: |-
  # Workshop Quiz: The Boundaries of "Life"

  **Instructions for Participants:**
  Below are ten descriptions of concrete entities or systems. For each case, please select the verdict that best matches your intuition. Do not worry about scientific accuracy; answer based on whether you feel the term "alive" applies.

  **Verdict Options:**
  *   **A:** Counts as Alive
  *   **N:** Does Not Count as Alive
  *   **B:** Borderline (If you choose this, be prepared to explain *which* criterion it fails or meets in the workshop discussion.)

  ---

  ### The Cases

  **1. The Obligate Parasite**
  This entity contains genetic material and evolves over time. However, it cannot generate energy or reproduce on its own; it must hijack the machinery of a host cell to replicate. Outside a host, it is chemically inert.
  *(Case: Virus)*
  [ ] A [ ] N [ ] B

  **2. The Misfolded Copy**
  This is a single protein molecule that has folded into the wrong shape. When it touches correctly folded proteins of the same type, it forces them to misfold, effectively "replicating" its shape. It has no genetic material and does not evolve.
  *(Case: Prion)*
  [ ] A [ ] N [ ] B

  **3. The Sterile Hybrid**
  This animal is healthy, moves, eats, metabolizes food, and responds to its environment. However, due to a mismatch in chromosomes, it is biologically impossible for it to produce offspring.
  *(Case: Mule/Sterile Hybrid)*
  [ ] A [ ] N [ ] B

  **4. The Time Capsule**
  This microscopic object was buried in permafrost for 5,000 years. During that time, it consumed no energy, grew no larger, and reacted to nothing. When placed in nutrient-rich water today, it "wakes up," begins eating, and divides.
  *(Case: Dormant Bacterial Spore)*
  [ ] A [ ] N [ ] B

  **5. The Energy Consumer**
  This system consumes fuel (wax and oxygen) and releases waste (smoke and CO2). It grows in size, moves through space, and maintains a complex internal structure of heat and light. If you cut off its fuel, it ceases to exist. It does not reproduce.
  *(Case: Flame)*
  [ ] A [ ] N [ ] B

  **6. The Digital Pattern**
  Inside a computer simulation, a specific arrangement of pixels replicates itself, moves across the screen, and competes for space with other patterns. Some patterns mutate and survive better than others. They exist only as software code.
  *(Case: Cellular Automaton / Game of Life)*
  [ ] A [ ] N [ ] B

  **7. The Software Agent**
  This is a piece of computer code that inserts copies of itself into other programs. It can mutate to avoid detection by security software. It exists only on electronic hardware, not in wet chemistry.
  *(Case: Computer Virus)*
  [ ] A [ ] N [ ] B

  **8. The Chemical Soup**
  In a laboratory tank, a network of simple chemicals catalyzes each other's production. The network maintains itself and grows as long as new ingredients are added. It can evolve slightly, but it has no cell membrane and no genetic code (DNA/RNA).
  *(Case: Autocatalytic Network)*
  [ ] A [ ] N [ ] B

  **9. The Alien Microbe**
  Explorers find a microscopic entity on another planet. It reproduces and evolves, but it is made of silicon rather than carbon, uses liquid methane instead of water, and shares no molecular machinery with Earth biology.
  *(Case: Alternative Chemistry Life)*
  [ ] A [ ] N [ ] B

  **10. The Captive Engine**
  This microscopic object has its own genetic code and burns energy to function. However, it cannot survive or reproduce outside of a larger host cell. If removed from the host, it dies immediately. It is a permanent part of a larger whole.
  *(Case: Isolated Mitochondrion)*
  *(Note: This case tests the distinction between having metabolic parts and being a self-individuated whole.)*
  [ ] A [ ] N [ ] B

  ---

  # Facilitator's Scoring Key & Analysis

  This key maps verdict patterns to philosophical positions. Note that participants rarely fit one column perfectly; look for the *weight* of their verdicts.

  ### 1. The Physico-Chemical Cluster (Metabolic / Autopoietic)
  *   **Core Intuition:** Life is about self-maintenance, boundaries, and chemistry.
  *   **Typical Verdicts:**
      *   **Q4 (Spore):** Alive (Potential for metabolism).
      *   **Q5 (Flame):** Not Alive (No boundary/self-repair).
      *   **Q10 (Mitochondrion):** *Discriminator.* **Metabolic** views may say **Alive** (it metabolizes). **Autopoietic** views say **Not Alive** (it cannot construct its own boundary/separate itself from the host).
      *   **Q1 (Virus):** Not Alive (No independent metabolism).
  *   **Indistinguishability Flag:** Purely metabolic and autopoietic views are difficult to separate with this quiz. Q10 is the only lever. If a participant marks Q10 as Alive but Q1 as Not Alive, they lean Metabolic. If they mark both Not Alive, they lean Autopoietic.

  ### 2. The Evolutionary View (NASA / Darwinian)
  *   **Core Intuition:** Life is a process of heredity with variation and selection.
  *   **Typical Verdicts:**
      *   **Q1 (Virus):** Alive (or Borderline) — It evolves.
      *   **Q3 (Mule):** Alive — It is part of an evolving population, even if individually sterile.
      *   **Q6 (Digital Pattern):** Alive — If it evolves, substrate doesn't matter.
      *   **Q8 (Chemical Soup):** Alive — If it evolves, it counts.
      *   **Q5 (Flame):** Not Alive — It does not inherit traits.
  *   **Discriminator:** This is the only view that consistently marks **Q6 (Digital)** and **Q8 (Soup)** as **Alive**, provided evolution is emphasized in the description.

  ### 3. The Thermodynamic / Dissipative View
  *   **Core Intuition:** Life is a system that resists entropy by dissipating energy.
  *   **Typical Verdicts:**
      *   **Q5 (Flame):** **Alive.** (This is the "smoking gun" for this position).
      *   **Q4 (Spore):** Not Alive (When dormant, entropy flow stops).
      *   **Q1 (Virus):** Not Alive (Inert when outside host).
  *   **Discriminator:** Marking **Q5 as Alive** is nearly exclusive to this view.

  ### 4. The Information-Theoretic View
  *   **Core Intuition:** Life is defined by complex specified information or code.
  *   **Typical Verdicts:**
      *   **Q7 (Computer Virus):** **Alive** or **Borderline.** (This is the key discriminator).
      *   **Q2 (Prion):** Not Alive (No genetic code/information, only structure).
      *   **Q9 (Alien):** Alive (Information processing matters, not chemistry).
  *   **Discriminator:** Marking **Q7 as Alive** distinguishes this from the Evolutionary view (which might reject Q7 as lacking biological heredity) and the Physico-Chemical view.

  ### 5. Cluster-Concept Deflationism
  *   **Core Intuition:** "Life" is a fuzzy family resemblance term; there is no necessary and sufficient condition.
  *   **Typical Verdicts:**
      *   **High Frequency of "Borderline" (B).**
      *   Specifically on **Q1 (Virus)**, **Q8 (Soup)**, and **Q9 (Alien)**.
      *   They will resist a binary "Alive/Not Alive" on edge cases, arguing it depends on *why* you are asking.
  *   **Discriminator:** A high count of **B** verdicts (4 or more) without a consistent theoretical through-line (e.g., accepting Flame but rejecting Spore) suggests Deflationism.

  ### 6. Eliminativism
  *   **Core Intuition:** "Life" is not a natural kind and the term should be discarded or restricted strictly to Earthly folk-biology.
  *   **Typical Verdicts:**
      *   **Q9 (Alien):** **Not Alive.** (Because "life" is a terrestrial concept).
      *   **Q6/Q7 (Digital):** **Not Alive.**
      *   **Q1 (Virus):** **Not Alive.**
      *   *Note:* This looks similar to the Physico-Chemical view, but the *reasoning* differs. The Eliminativist denies the category extends to Q9.
  *   **Discriminator:** The combination of **Q9 = Not Alive** and **Q1 = Not Alive** alongside **Q3 = Alive**. (Rejects edge cases, keeps standard animals).

  ---

  ### Indistinguishable Positions
  *   **Metabolic vs. Autopoietic:** As noted above, these are hard to pry apart. Both reject the Flame and usually the Virus. Q10 (Mitochondrion) is the only potential wedge, but many participants will not know how to judge an organelle. Treat these as a single "Physico-Chemical" cluster for workshop purposes unless Q10 yields a clear split.
  *   **Evolutionary vs. Information-Theoretic:** Both may accept Digital Patterns (Q6). The distinction lies in Q7 (Computer Virus). Evolutionary theorists often require *biological* chemistry for the "chemical system" clause in the NASA definition, whereas Information theorists care only about the code. However, in practice, these participants often vote identically.

  ---

  ### Empty Cells: Incoherent or Unexplored Verdict Combinations
  The following combinations of verdicts correspond to no defended philosophical position. You can use these to challenge participants during the discussion.

  **1. The "Sterility Paradox"**
  *   **Verdicts:** Q3 (Mule) = **Not Alive** AND Q1 (Virus) = **Alive**.
  *   **Analysis:** **Incoherent.** This suggests reproduction is necessary (killing the Mule) but independent reproduction is not (saving the Virus). No major theory requires reproduction but accepts obligate parasitism while rejecting individual sterility.

  **2. The "Thermodynamic Inconsistency"**
  *   **Verdicts:** Q5 (Flame) = **Alive** AND Q4 (Spore/Dormant) = **Alive**.
  *   **Analysis:** **Unattractive/Incoherent.** A Thermodynamic view defines life by active energy dissipation. A dormant spore does not dissipate energy. To mark both as Alive requires holding two contradictory definitions of life simultaneously (one based on flow, one based on potential).

  **3. The "Chauvinist Isolationist"**
  *   **Verdicts:** Q9 (Alien) = **Not Alive** AND Q6 (Digital Pattern) = **Alive**.
  *   **Analysis:** **Unexplored/Incoherent.** This accepts a non-chemical, non-biological digital entity as alive but rejects a reproducing, evolving physical entity because it has the "wrong" chemistry. This implies "Life" is neither substrate-independent (rejects Alien) nor substrate-specific (accepts Digital). It is a highly unstable position.

  **4. The "Universal Panpsychist"**
  *   **Verdicts:** All 10 Cases = **Alive**.
  *   **Analysis:** **Unexplored in this context.** While panpsychism exists, marking a Flame, a Computer Virus, and a Prion all as fully "Alive" dissolves the distinction the workshop is investigating. This verdict suggests the participant is not engaging with the boundary problem but rather affirming a metaphysical unity that renders the quiz moot.
