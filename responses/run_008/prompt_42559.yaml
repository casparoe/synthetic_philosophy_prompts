prompt: |-
  hey so im in a metaphysics course this semester and our final has a creative option — you can submit a poem instead of an essay as long as the poem actually does philosophical work instead of just vibes. we just finished the unit on identity over time and material constitution. i want to do the Ship of Theseus but i refuse to just name-drop some planks and call it a day, that feels like cheating.

  give me a sestina on the Ship of Theseus. here's the part i actually care about: the six end-words should be the ship's parts (plank, keel, rope, sail, mast, whatever — you pick, but make them material, the actual stuff of the ship), and their rotation through the stanzas has to do the philosophical work. the same words survive from stanza to stanza but always in new positions — like the planks, right? by the sixth stanza the reader should be unsure whether they're still reading the poem the first stanza started, and the poem should make them feel that rather than say it.

  then in the envoi (i think its called the tornada?) i want the Hobbes twist: someone has been gathering the discarded planks off the beach and rebuilding the original ship out of them, so now there are two candidates for being *the* ship. use all six end-words in those three lines, compressed, like the two ships are being forced to share one hull.

  hard constraints: nowhere in the poem itself can you announce the paradox — no line like "is it still the same ship?" no question like that at all. the metaphysics has to be carried by form and image. and dont resolve it either, my prof is super insistant that the good creative submissions leave the tension in the reader. someone who knows the puzzle (both the gradual replacement version and the Hobbes second-ship version) should be able to tell exactly what stage they're at in every stanza, but someone who's never heard of it should still just read a good poem about a ship being rebuilt.

  you can take the role of an award-winning poet who also teaches metaphysics. before you write the actual sestina, brainstorm 2-3 different ways of mapping the replacement process onto the sestina form, tell me which one you're going with and why — i want to steal the reasoning for the artist's statement we have to attach lol. then write the poem, then give me one short paragraph on how the form is carrying the argument so i can double check it actually works and isnt just me projecting.
