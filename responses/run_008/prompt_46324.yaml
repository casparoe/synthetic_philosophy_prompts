answer: |-
  This is a classic move in vagueness debates, and your frustration is well-founded. "There's no fact of the matter" is often used as a conversation-stopper, but in philosophy, it's actually a *conclusion* that requires heavy lifting. When your friend uses it to wave off the Epistemicist, they are essentially asserting a rival theory without arguing for it.

  Here is a breakdown of the precise theses hidden inside that one-liner, evaluated for plausibility and whether they actually refute the Epistemicist. You can bring this list directly to your meeting.

  ### 1. The Truth-Value Gap Thesis (Semantic Nihilism)
  *   **The Claim:** The sentence "The guy with 57 hairs is bald" is **neither true nor false**. It lacks a truth value entirely. Therefore, there is no *true* proposition for there to be a "fact" about.
  *   **Plausibility:** **Moderate.** This preserves the intuition that borderline cases are defective, but it requires abandoning the Law of Bivalence (every sentence is T or F). This creates logical headaches (e.g., does "He is bald OR he is not bald" become false?).
  *   **Does it refute the Epistemicist?** **No.** It merely contradicts them. The Epistemicist (like Timothy Williamson) argues that bivalence *must* hold for logic to work. To say "It's neither T nor F" is just to assert the opposite of Epistemicism, not to prove the Epistemicist wrong. The Epistemicist will reply: "You haven't explained *why* bivalence fails here but not elsewhere."

  ### 2. The Supervaluationist Thesis (Truth relative to Precisiations)
  *   **The Claim:** There is no fact of the matter because the word "bald" is vague. There are many acceptable ways to make "bald" precise (e.g., <50 hairs, <60 hairs, <55 hairs). On some precisifications, the guy is bald; on others, he isn't. Since there is no single "correct" precisification, there is no single fact.
  *   **Plausibility:** **High.** This is one of the dominant theories of vagueness. It allows you to keep classical logic (tautologies remain true) while admitting indeterminacy.
  *   **Does it refute the Epistemicist?** **No.** The Epistemicist argues that Supervaluationism is incoherent. They claim that if "bald" really allows multiple boundaries, then one of those boundaries *is* the real one, we just don't know which. Saying "there are many admissible boundaries" is just a way of describing our ignorance, not proof that no boundary exists.

  ### 3. The Metaphysical Indeterminacy Thesis (Ontic Vagueness)
  *   **The Claim:** The lack of a fact isn't about our language or knowledge; it's about the **world itself**. Reality is fuzzy. The guy's head is in a state where the property of *baldness* is literally not determined.
  *   **Plausibility:** **Low/Controversial.** Many philosophers (following Gareth Evans) argue that "vague objects" are impossible. If an object's boundaries are vague, can we even count it as one object? Most prefer to locate vagueness in language or thought, not in the furniture of the universe.
  *   **Does it refute the Epistemicist?** **No.** In fact, this is the view the Epistemicist attacks most vigorously. The Epistemicist insists the world is precise (a hair is either on or off, a scalp is either covered or not). Asserting metaphysical vagueness is just positing a "spooky" metaphysical feature to avoid the Epistemicist's conclusion. It's a competing metaphysics, not a refutation.

  ### 4. The Contextualist Thesis (Shifting Standards)
  *   **The Claim:** There is no *stable* fact of the matter because the truth depends on the conversational context. In a casual chat, 57 hairs is bald; in a dermatology study, it might not be. There is no "God's eye view" fact independent of context.
  *   **Plausibility:** **High.** This aligns with how we actually use language. Standards for "tall," "rich," and "bald" shift constantly.
  *   **Does it refute the Epistemicist?** **Weakly.** The Epistemicist can agree that context shifts the *location* of the cutoff, but they will insist that *within* any fixed context, there is still a sharp cutoff. If you fix the context perfectly, the Epistemicist says a sharp line remains. Your friend would need to argue that even a perfectly fixed context yields no line.

  ### 5. The "Semantic Ignorance" Confusion (Accidental Epistemicism)
  *   **The Claim:** Sometimes people say "no fact of the matter" when they actually mean "no *knowable* fact of the matter." They might think that if we can't verify it, it doesn't count as a fact.
  *   **Plausibility:** **Low (as philosophy), High (as casual speech).** This conflates metaphysics (what exists) with epistemology (what we know).
  *   **Does it refute the Epistemicist?** **Absolutely Not.** This *is* the Epistemicist's position (or close to it). The Epistemicist says: "There IS a fact, but it is unknowable." If your friend means "We can't know it, so let's call it no fact," they are accidentally agreeing with the Epistemicist while pretending to disagree.

  ---

  ### How to use this in the group
  When your friend says "There's no fact of the matter," you can ask:

  > "Which thesis are you endorsing? Are you saying the sentence is **neither true nor false** (Gap), that it's **true on some precisifications but not others** (Supervaluation), or that **reality itself is fuzzy** (Metaphysical)? Because the Epistemicist has specific arguments against all three. Just saying 'no fact' assumes their conclusion is false without showing why."

  **The Bottom Line:** "There's no fact of the matter" is a slogan for **Anti-Realism about vagueness**. The Epistemicist is a **Realist about vagueness** (they think the facts exist). You cannot refute a Realist simply by asserting Anti-Realism; you have to explain why their arguments for the sharp cutoff (usually based on classical logic and the nature of knowledge) fail. Your friend is begging the question.
