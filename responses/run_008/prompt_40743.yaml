      *   *Nuance:* Distinguish between "Verification" (judge checks fact) and "Validation" (judge checks argument structure). Debate shifts the load from Verification to Validation.
      *   *Key Insight:* The "Decomposition" point is critical. If a claim can't be broken down to something the judge understands, debate fails. This is the "Human-in-the-loop" bottleneck.
      *   *Collusion:* If they collude, they simulate a "single stronger liar." The protocol assumes $2 \times$ Adversary > $1 \times$ Liar. Collusion makes it $1 \times$ Super-Liar.

  7.  **Final Polish:**

