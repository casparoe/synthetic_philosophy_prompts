answer: |-
  This is a fertile puzzle. You have identified a specific tension in our ethical lives: the gap between the *arbitrariness* of a convention (tipping vs. no tipping) and the *necessity* with which we enforce it on outsiders. To reconstruct the implicit theory here, we have to look at what kind of moral machinery allows a rule to be locally binding without being universally true.

  Here is a reconstruction of the implicit theory, the distinctions you requested, and the implications of shifting to an instrumental view.

  ### 1. The Implicit Theory: "Jurisdictional Fair Play"

  The practice presupposes a view of moral obligation that I would call **Jurisdictional Fair Play**.

  Strictly speaking, this theory presupposes that **obligations can be generated by physical presence within a cooperative scheme, independent of explicit consent.** (Confidence: High).

  When we say a visitor "ought" to tip in New York or wait at a red light in Berlin, we are not claiming that tipping or waiting is intrinsically good. We are claiming that the *local system* has generated a temporary debt. The implicit logic runs like this:
  1.  Locals sustain a system of expectations that reduces uncertainty and coordinates behavior (e.g., servers work for low wages because they expect tips; pedestrians cross safely because they expect lights to be obeyed).
  2.  By entering this space and utilizing its services or infrastructure, the visitor benefits from the stability this system provides.
  3.  Therefore, the visitor incurs a duty of "fair play" to uphold their end of the bargain while present, even if they did not help write the rules.

  This distinguishes the obligation from universal morality (which would apply everywhere) and from prudence (which would apply only if you might get caught). It treats the local convention as a kind of temporary sovereign authority.

  ### 2. Presuppositions vs. Comfortable Fits

  It is crucial to separate what this practice *requires* to function from what merely *explains* it nicely.

  **What the Practice Strictly Presupposes:**
  *   **Normative Authority of Place:** We must assume that geography confers obligation. If morality were purely internal or universal, the location wouldn't matter. The fact that the "right" thing changes at the border implies that the *source* of the duty is the community's collective will, not the act itself. (Confidence: High).
  *   **The Possibility of Non-Consensual Duty:** Since visitors often arrive with conflicting prior habits (the non-tipper in America), the theory presupposes that you can acquire a duty simply by being there, overriding your prior moral training. It rejects the idea that obligation requires a "meeting of the minds." (Confidence: High).

  **What Merely Sits Comfortably With the Practice:**
  *   **Tacit Consent Theory:** It is comfortable to say, "By walking into the cafe, you tacitly agreed to the rules." This fits the intuition, but the practice doesn't strictly *need* it. We scold people who clearly *didn't* know the rules (e.g., a confused tourist). If tacit consent were the strict requirement, ignorance would excuse the violation. It usually doesn't. (Confidence: Moderate).
  *   **Communitarian Identity:** It sits well with the idea that "to be in a community is to share its values." But we don't actually expect visitors to *believe* in tipping, only to *perform* it. The internal belief is optional; the external compliance is mandatory. (Confidence: High).

  ### 3. Philosophical Underdetermination

  This is where the reconstruction gets tricky. The same pattern of attitudes (enforcing local rules on visitors while admitting the rules are arbitrary) can be licensed by rival ethical accounts that look very different under the hood. (Confidence: Moderate).

  *   **Rule Utilitarianism:** A utilitarian could argue that while *this specific tip* doesn't maximize happiness, the *rule* "visitors follow local customs" does. If everyone decided for themselves which local rules to follow, the coordination system would collapse. Thus, the visitor has a duty to comply, not because tipping is good, but because *compliance* is good.
  *   **Expressivism:** This view holds that moral statements aren't facts but expressions of attitude. When a Berliner scolds a jaywalker, they aren't stating a truth; they are expressing disapproval to enforce a social boundary. The "obligation" is just the pressure of that expression. This accounts for the "moral" feeling without requiring an actual moral fact.
  *   **Scanlonian Contractualism:** One could argue that no one could "reasonably reject" a principle that says, "When visiting a system you rely on, follow its operating instructions." This grounds the duty in reasonable rejectability rather than fair play or utility.

  All three produce the same "When in Rome" behavior, but they justify it differently. The practice is underdetermined because the average person enforcing the norm doesn't know (or care) which philosophical engine is driving their outrage.

  ### 4. The Shift to a Purely Instrumental View

  If we replaced the implicit moral view with a **Purely Instrumental View** (etiquette as friction-reduction), the landscape of travel and commerce would change noticeably. (Confidence: High).

  **In Travel Advice:**
  *   *Current:* "You ought to queue in Britain; it's disrespectful to jump."
  *   *Instrumental:* "If you jump the queue in Britain, people will glare at you and service may slow down. To get what you want faster, stand in line."
  *   *Change:* The language shifts from *owed* to *cost-benefit*. The traveler is treated as a strategist, not a moral agent. Guidebooks would focus on "avoiding conflict" rather than "showing respect."

  **In Tip Screens:**
  *   *Current:* The screen presents percentages (20%, 25%) alongside "No Tip," implicitly framing the latter as a deviation from the norm. The design relies on shame.
  *   *Instrumental:* The screen would look like a donation prompt or a service fee menu. "Staff rely on tips for income. Add $5?" or "Service Charge Included: Yes/No."
  *   *Change:* The moral sting is removed. Declining becomes a financial choice, not a character judgment. However, this might reduce compliance, as the "guilt tax" is eliminated.

  **The Consequence:**
  The instrumental view dissolves the paradox you identified. If etiquette is just a tool, it doesn't matter that conventions are arbitrary. Tools are always arbitrary relative to their function. But we lose the *binding* power. A tool can be discarded if it doesn't serve *my* ends. A moral duty binds me even when it is inconvenient. If we admit tipping is just instrumental, the American in Osaka is free to tip if *they* want to, and the Berliner in London is free to jaywalk if *they* are in a hurry. The "ought" disappears.

  ### 5. The Shaky Point: The Source of the "Ought"

  I am least sure about the claim that **visitors actually feel a moral obligation rather than a fear of social sanction.** (Confidence: Low).

  In my reconstruction above, I assumed that when a traveler feels bad about not tipping, they are experiencing a genuine moral qualm (a sense of having done *wrong*). But it is equally possible that they are merely experiencing *anticipatory anxiety* about being judged.

  The distinction matters. If the "obligation" is just fear of a dirty look, then the "Jurisdictional Fair Play" theory is a post-hoc rationalization. We tell ourselves it's a duty to mask the fact that we are just conformists. If this is true, the "moralization" you describe is an illusion—a psychological coating over a power dynamic where locals punish outsiders for disrupting the script.

  This is the weakest link in the reconstruction because introspection is unreliable. When I decline the 25% tip on the iPad, do I feel like a thief (moral violation), or do I feel like someone walking naked into a meeting (social violation)? The phenomenology is nearly identical, but the philosophical implications are vast. If it is merely social sanction, then the "obligation" vanishes the moment the visitor leaves the country, whereas a Fair Play duty might imply a lingering debt. I suspect the reality is a hybrid, but disentangling the guilt from the fear is where the theory gets shaky.
