answer: |-
  Your suspicion is well-founded. The argument you describe is a sophisticated version of the **"Baseline Problem"** in legal and moral theory, often associated with debates over the Harm Principle (Joel Feinberg) and the nature of torts (Robert Nozick, Judith Jarvis Thomson, Seana Shiffrin).

  Your colleague's argument is valid *if* one accepts a strictly **pre-legal, factual baseline** for measuring harm. However, it is unsound because that baseline is philosophically unsustainable for almost all complex social interactions, not just copyright.

  Here is an analysis of where the argument fails, why it seduces us, and the costs of fixing it while maintaining your preferred commitments.

  ### 1. Which Premise to Reject?
  You should reject the specific formulation of **Premise (2)**: *"An act harms a person only if it leaves that person worse off than they would otherwise have been."*

  Specifically, you must reject the **implicit definition of the baseline** embedded in that premise. The argument relies on an equivocation between two types of counterfactuals:
  1.  **The Factual Baseline (State of Nature):** "What would have happened to the victim physically if the actor had not intervened, assuming no normative rules existed?"
  2.  **The Normative Baseline (Legitimate Expectation):** "What position should the victim have been in, given the moral or legal rights they hold?"

  The colleague's argument forces the **Factual Baseline** in steps (3) and (4). Under this reading, if I copy your manuscript, you still have the paper and the ideas (physically), so you are not worse off than in a state of nature.
  However, Premise (1) (Legitimacy requires harm) is only plausible to us because we intuitively use the **Normative Baseline**. We believe theft is harmful not because the victim loses physical atoms, but because they lose what they *had a right to*.

  **The Fix:** Reformulate Premise (2) to read: *"An act harms a person if it leaves them worse off than they **ought to have been** (or had a right to be)."*

  ### 2. Why Did Premise (2) Look Acceptable?
  It looked acceptable because of the **Physicalist Intuition**. In paradigmatic cases of harm—battery, destruction of property, theft of a physical wallet—the Factual Baseline and the Normative Baseline coincide.
  *   *Battery:* I hit you. Factual baseline (unhit) = Normative baseline (right not to be hit).
  *   *Theft:* I take your apple. Factual baseline (have apple) = Normative baseline (right to keep apple).

  Because these "easy cases" mask the distinction, we generalize the definition of harm to "subtraction from existing physical possession." The colleague's argument exploits this generalization to show that copyright (and fraud/defamation) involves no physical subtraction. It looks like a *reductio* of copyright, but it is actually a *reductio* of the Physicalist Intuition.

  ### 3. The Cost of Rejecting Premise (2)
  Rejecting the factual baseline in favor of a normative one comes with theoretical costs, but it saves your preferred conclusions (1) and (7).

  **Cost A: The Conflation of Harm and Wrong**
  By defining harm relative to what someone "ought to have," you blur the line between **harm** (a setback to interest) and **wrong** (a violation of a right).
  *   *Colleague's View:* Harm is descriptive (welfare setback); Wrong is normative (rights violation). Copyright creates a right, so violating it is a wrong, but not a "harm" in the pre-legal sense.
  *   *Your New View:* Harm is inherently normative. You cannot identify the harm without first identifying the right.
  *   *Consequence:* This makes the Harm Principle (Premise 1) less restrictive. It no longer acts as an independent check on legislation, because defining the harm requires assuming the legitimacy of the interest the law protects.

  **Cost B: The Burden of Moral Justification**
  If harm is measured against a normative baseline, you must explain *why* the baseline exists without appealing to the law itself (to avoid the circularity charge in Premise 4).
  *   For **Fraud and Defamation**, this is easy. We can appeal to pre-legal moral norms: autonomy, truth-telling, and social reputation exist as moral goods independent of statute.
  *   For **Copyright**, this is harder. To maintain the **Parity (7)** that you wish to keep, you must argue that copyright protects a **moral right** (e.g., Lockean labor-desert or Hegelian personality), not merely a **utilitarian incentive**.
      *   If copyright is purely utilitarian (we create laws to incentivize production), then the "baseline" of sales *does* depend on the law, and the colleague's circularity charge sticks.
      *   If copyright is a natural right (you own your expression as you own your limbs), then the baseline exists pre-legally, and unauthorized copying is a harm akin to theft.

  ### 4. Does the Parity (7) Hold?
  You prefer to keep the parity claim. Is this defensible?

  **Yes, the parity is genuine, but only at the level of structure.**
  Copyright, Fraud, Defamation, and Privacy violations all share the same structure: they protect **intangible interests** that require a normative baseline to be visible as "harms."
  *   **Fraud:** You physically handed over the money. The harm is not the loss of cash (factual), but the vitiation of consent (normative).
  *   **Defamation:** You physically retain your body and property. The harm is to reputation (a social/normative standing).
  *   **Privacy:** You retain the physical letter. The harm is to informational control (a normative boundary).
  *   **Copyright:** You retain the manuscript. The harm is to the exclusive right to exploit the labor (a normative boundary).

  **The Divergence Risk:**
  The parity breaks if you cannot ground Copyright in a pre-legal moral right. Reputation and Privacy are often accepted as "natural" interests that law *recognizes*. Copyright is often viewed as a "positive" interest that law *creates*.
  *   *To keep your preference:* You must argue that the author's claim to their work is as natural as their claim to their reputation. If you accept this (e.g., via Lockean theory), the parity holds, and all four are justified by appeal to harm (violation of the normative baseline).
  *   *If you reject this:* You must concede that Fraud/Defamation are harms (natural rights), but Copyright is merely a regulatory scheme (positive right). This saves Fraud but sacrifices the Parity you want to keep.

  ### Summary Recommendation
  To resolve the dilemma while keeping **(1) Legitimacy requires harm** and **(7) Parity among intangibles**:

  1.  **Reject Premise (2)'s Baseline:** Argue that harm is measured against a **moral/normative baseline**, not a law-free factual one.
  2.  **Accept the Cost:** Acknowledge that "harm" is a normative concept. This means justifying copyright requires moral philosophy (Natural Rights), not just economics (Utilitarianism).
  3.  **Defend the Parity:** Argue that Fraud, Defamation, Privacy, and Copyright are all protections of **moral agency and control**, not just physical possession. The colleague's argument proves too much only because it adopts an implausibly thin (physicalist) view of human interests.

  Your colleague's argument is a *reductio ad absurdum* of the **Factual Baseline**, not of copyright. By shifting to a Normative Baseline, you validate the intuition that fraud and defamation are harms, and you open the door to validating copyright as a harm as well, provided you can ground it in moral right rather than mere policy.
