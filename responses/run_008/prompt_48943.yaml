answer: |-
  Based on the track record you've provided, Dana is operating with a highly specific, internally consistent framework that prioritizes legal precision over moral expansiveness. She is not a "moral maximist" (who would label any mass atrocity genocide to ensure it gets attention) nor a "political opportunist" (who uses the label to win diplomatic fights). She is a **Strict Conventionist with a Physicalist Intent Heuristic.**

  Here is the breakdown of her implicit rules, the predictions for your upcoming seminar, and the test cases to probe her consistency.

  ### 1. The Implicit Rule: "Protected Groups + Biological Destruction"

  Dana is running a hybrid rule that can be summarized as follows:
  1.  **Group Constraint (Strict):** The victim group must fall squarely within the four UN Convention categories (National, Ethnical, Racial, Religious). Political, Class, or Cultural groups *per se* are excluded.
  2.  **Intent Constraint (Physicalist):** The *dolus specialis* (specific intent) must be the physical or biological destruction of the group's viability. "Cultural destruction," "assimilation," or "ethnic cleansing" (displacement) does not qualify unless it is a means to physical destruction.
  3.  **Inference Rule (Contextual):** Intent can be inferred from the pattern of outcome (Holodomor), but only if the outcome threatens the biological continuity of a *Protected Group*.

  **How candidate rules fit her track record:**

  *   **Strict UN Convention Legalism:**
      *   *Handles Well:* Indonesia (Political group excluded), Khmer Rouge (Khmer victims excluded as class/political), Srebrenica (adhering to the ICTY distinction between the enclave and the wider campaign).
      *   *Handles Badly:* Holodomor. Strict legalists often stumble here because the Soviet Union did not recognize "national groups" in the same way, and proving specific intent to destroy Ukrainians *as a nation* vs. crushing a peasant rebellion is legally fraught. Dana's acceptance of this suggests she is willing to infer intent from the national impact, provided the group is "National."
  *   **Lemkin's Broader Conception (Cultural Genocide):**
      *   *Handles Well:* Holodomor (destroying the national pattern of life).
      *   *Handles Badly:* Srebrenica/Bosnia distinction. Lemkin viewed the destruction of institutions and culture as part of the genocidal process. Dana's refusal to label the wider Bosnian ethnic cleansing as genocide rules this out. She also rejects the Indonesia and Khmer (Khmer) verdicts that a Lemkinian might view as destroying the "social fabric."
  *   **The "Dana Doctrine" (Protected Groups + Biological Intent):**
      *   *Handles All:* It explains why she accepts the Holodomor (physical destruction of a national group) but rejects the wider Bosnia campaign (displacement/ethnic cleansing without proven intent to physically destroy all Bosniaks). It explains the Khmer Rouge split (Cham/Vietnamese = Protected Groups; Khmer = Political/Class).

  ### 2. Predictions for the New Cases

  **Case 1: The Uyghurs in Xinjiang**
  *   **Verdict:** **Genocide.**
  *   **Reasoning:** The Uyghurs constitute a protected Ethnical/National/Religious group. While Dana rejects "cultural genocide," the reports of forced sterilization and birth prevention measures map directly to Article II(d) of the Convention ("Imposing measures intended to prevent births within the group"). This crosses her "Biological Destruction" threshold. Unlike the Holodomor, where intent is inferred from famine, here the mechanism (sterilization/IUDs) targets biological continuity directly. She will likely view this as the strongest legal case of the three.

  **Case 2: Canada's Residential Schools & Sixties Scoop**
  *   **Verdict:** **Not Genocide (Crimes Against Humanity / Cultural Genocide).**
  *   **Reasoning:** This is the hardest pill for the Convention text (Article II(e) covers forcible transfer of children), but it fits Dana's *Srebrenica* heuristic. She distinguishes between "destroying a people" and "replacing a culture." The perpetrators' stated aim was assimilation ("benevolent" destruction of culture), not physical liquidation. Given her impatience with using the G-word for atrocity generally, and her refusal to expand Srebrenica to the wider Bosnian ethnic cleansing, she will likely argue that while this was a horrific crime against humanity and perhaps "cultural genocide" in a sociological sense, it lacks the *dolus specialis* of physical/biological destruction required for the legal term. She will likely cite the TRC's own qualifier ("Cultural Genocide") as proof it is distinct from Genocide proper.

  **Case 3: Franco's Suppression of the Catalans**
  *   **Verdict:** **Not Genocide (Politicide / Crimes Against Humanity).**
  *   **Reasoning:** While Catalans are a protected National group, the measures (language bans, execution of elites, forced name changes) aim at political submission and cultural homogenization. Unless there is evidence of a plan to physically exterminate the Catalan population *biologically*, this falls into her "Ethnic Cleansing/Repression" bucket, similar to the wider Bosnia campaign. The execution of elites is a classic signature of politicide, not genocide, in her framework.

  ### 3. The Sharpest Discriminator

  **Canada's Residential Schools** is the sharpest discriminator between the surviving candidate rules.

  *   **Why:** It creates a direct conflict between the **Literal Text of the Convention** (which explicitly includes forcible child transfer) and **Dana's Physicalist Heuristic** (which requires intent to physically destroy).
  *   **The Split:**
      *   If she rules **Genocide**, she admits that the Convention's text on child transfer overrides her "physical destruction" heuristic, aligning her closer to the TRC and a more textualist legalism.
      *   If she rules **Not Genocide** (as predicted), she confirms that her "Physical Destruction" heuristic trumps the literal text of Article II(e). It proves she views "Genocide" as a crime against biological existence, not cultural continuity, even when the Convention blurs that line. This would solidify her distinction between "Genocide" and "Ethnic Cleansing/Assimilation."

  ### 4. The Dinner Hypothetical

  To definitively split the rules if she hedges on Canada, pose this hypothetical:

  **"The Benevolent Sterilization Program"**
  > "Imagine a state that mandates sterilization for a specific ethnic minority. However, the state publicly and privately documents that the intent is *not* to eliminate the group, but to 'alleviate intergenerational poverty' within that community. They provide full financial support, education, and cultural preservation funding for the existing members, but prevent new births. The group shrinks by 50% over two generations and eventually ceases to exist as a distinct demographic. Is this Genocide?"

  *   **Why this works:**
      *   **Strict Convention Text:** Says **Yes** (Article II(d) prohibits birth prevention measures regardless of benevolent motive).
      *   **Dana's Physicalist/Intent Heuristic:** Might say **No**. If her rule requires "Intent to Destroy," and the state's intent is "Benevolent Poverty Reduction," she might argue the *dolus specialis* is missing, even if the outcome is group extinction.
      *   **Lemkin/Cultural:** Says **Yes** (Destruction of the group's future).
      *   *This forces her to choose between the Act (Sterilization) and the Intent (Benevolence vs. Destruction).*

  ### 5. The Recognition Politics Check

  **Would her predictions change if the political convenience flipped?**
  **No.**

  Dana's profile suggests she is immune to "argument-space" definitions.
  *   **Evidence:** She is "visibly impatient with the recognition politics" surrounding the Armenian genocide (where the politically convenient answer for Western allies is often *not* to recognize it). She is "scathing about commentators who use the G-word as a synonym for atrocity" (resisting the moral pressure to dilute the term).
  *   **Analysis:** Her distinction between Srebrenica (Genocide) and the rest of Bosnia (Not Genocide) is the strongest proof. Politically and morally, there is immense pressure to label the entire Bosnian war a genocide to emphasize Serbian culpability. By restricting it to Srebrenica, she prioritizes technical accuracy over diplomatic utility.
  *   **Conclusion:** If the political pressure regarding Xinjiang were to reverse (e.g., if her organization's funding depended on *not* calling it genocide), she would likely still call it genocide based on the birth prevention evidence. Conversely, if there were immense political pressure to label the Residential Schools as Genocide to force reparations, she would likely still resist the label to preserve the technical integrity of the term for future tribunals. She treats the word "genocide" as a scalpel, not a club.
