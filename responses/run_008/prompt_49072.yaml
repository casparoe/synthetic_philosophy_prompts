prompt: |-
  I keep arguing with my brother about what we should actually eat and I want to lay out my gut verdicts so someone can tell me if there's a principle under them or if I'm just a mess.

  So: factory farmed chicken breast is clearly worse than a steak from a pasture-raised cow. Eating a single wild-caught fish feels fine, better than the steak even. Oysters feel basically fine, I'd order them without thinking twice, whereas veal is obviously out. Eggs seem ok to me but chicken meat from the same kind of operation doesn't, which already feels shaky when I say it out loud. A hunted deer from an overpopulated herd feels not just permissible but kind of good? Like the alternative is starving through winter. And here's the one that bothers me: given crop cultivation kills field mice and whatnot, I have this nagging sense that grass-finished beef might involve fewer total deaths than a vegan diet heavy in grains and legumes, and I don't want to bite that bullet but I also can't explain it away.

  My tentative principle is something like: harm = number of animal lives, weighted by capacity to suffer and by how bad the life was, minus whatever would've happened anyway. But when I test it: by my own weights, one chicken (whole bird, bad life) seems worse than one steak (a small fraction of a decent-ish life), and I do believe that, so the principle looks right there. But then oysters — I eat a whole oyster and the principle says that's worse than the steak as long as oyster suffering counts even a little, which my gut refuses. And the hunted deer case only works if the "minus what would've happened anyway" clause does a ton of lifting, since it seems to justify eating basically anything hunted from a population at carrying capacity.

  Can you get all of these, or close? If the principle needs patching, patch it, and tell me honestly which of my verdicts has to go. Also tell me what the fixed version says about two cases I haven't listed: eating farmed shrimp (lots of little lives per serving, presumably low-ish suffering capacity) and dairy (no slaughter for the milk itself, but the calf situation). My brother says the dairy one is where I'll fold, he's probably right, but I want to see if you agree before I admit it to him.
