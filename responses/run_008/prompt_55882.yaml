answer: |-
  **PhD Comprehensive Examination: Philosophy of Science**
  **Section: Structural Realism and Theory Equivalence**
  **Time Allowed: 90 Minutes**

  **Question 1**

  Classical electromagnetism admits an exact duality transformation under which electric ($E$) and magnetic ($B$) quantities are interchanged (along with appropriate charge/current adjustments), yielding two empirically equivalent formulations that appear to disagree on which quantities are fundamental. In this scenario, an **Epistemic Structural Realist (ESR)** argues that duality supports her view, since what is preserved across the two formulations—namely, the shared mathematical structure—is all we are ever entitled to believe in. A **Scientific Antirealist** replies that if structure exhausts the theory's content, the ESR cannot even say that the two formulations describe the *same world* rather than merely fitting the same evidence, because the claim of 'same structure' outruns the observational consequences both characters accept.

  Adjudicate this exchange. Your essay must address the following three pressure points:
  1.  **Ontic Structural Realism (OSR):** Does the OSR claim that there is nothing more to being an entity than occupying a position in a structure help resolve the duality case, or does it generate a worse problem regarding the individuation of entities (e.g., $E$ vs. $B$ roles)?
  2.  **Newman's Objection:** Identify where exactly Newman's objection bites in this context. Is it a problem for the duality case specifically, or only for the Ramsey-sentence reconstruction of structuralism?
  3.  **Underdetermination:** Does the duality argument give the structural realist a distinctive response to underdetermination, or does it merely restate the problem at the level of structure?

  ***

  ### Model Answer

  The debate turns on whether 'structure' can bear the ontological weight the ESR requires without collapsing into antirealism. The duality of classical electromagnetism (CEM) provides a rigorous test case because the mathematical isomorphism between the $E$-dominant and $B$-dominant formulations is exact, yet the physical interpretation of the fields differs.

  Regarding **Ontic Structural Realism (OSR)**, the candidate must assess whether eliminating 'objects' aids the ESR. OSR posits that relata are reducible to relations. In the CEM duality, if $E$ and $B$ are merely nodes in a nomological structure, the swap should be ontologically innocuous; it is merely a relabeling of structural positions. This supports the ESR's claim that the 'world' is the invariant structure. However, this generates a severe individuation problem. If entities are nothing but positions in a structure, what individuates position $x$ from position $y$? In CEM, $E$ and $B$ couple differently to electric versus magnetic charges (if monopoles existed). If the structure distinguishes them via these coupling relations, they are not structurally identical, and the duality is not a perfect symmetry of the ontology but a symmetry of the equations. If OSR insists they are identical because the abstract structure is isomorphic, it loses the ability to account for the distinct causal roles the fields play in specific interactions. Thus, OSR risks making the distinction between the formulations unintelligible, failing to explain why we perceive an $E$-field rather than a $B$-field in electrostatics. It solves the 'nature of the stuff' problem by dissolving the stuff, but creates a 'individuation of the nodes' problem that is arguably worse.

  On **Newman's Objection**, the Antirealist's charge is that 'structure' is trivial. Newman argued that any set of observations can be fitted by *some* mathematical structure, provided the cardinality is correct. The ESR must claim the specific structure of Maxwell's equations is physically privileged, not just mathematically possible. In the duality context, Newman's objection bites not on the Ramsey-sentence reconstruction per se, but on the claim that the shared structure represents physical reality rather than empirical adequacy. The Antirealist argues that asserting the formulations describe the 'same world' requires a claim about the physical relations themselves, not just the isomorphism. If the ESR defines structure via Ramsey sentences (existentially quantifying over theoretical properties), Newman shows this is trivially satisfiable. However, in the duality case, the structure is fixed by the differential equations, not just observational data. The objection bites specifically if the ESR cannot distinguish between the physical structure (nomic relations) and the mathematical structure (isomorphism classes). If 'structure' means only mathematical relations, the Antirealist wins: isomorphism does not imply ontological identity. The ESR must argue that the structure includes modal constraints that outrun the Ramsey sentence, but this risks reintroducing the non-structural knowledge Newman claimed was excluded.

  Finally, concerning **Underdetermination**, the ESR typically uses duality to argue that while the nature of entities is underdetermined, the structure is not. The Antirealist counters that if the formulations are empirically equivalent, the structure itself is underdetermined relative to the world. Does duality solve this? It offers a distinctive response only if one accepts that structural invariance is a truth-tracking virtue. However, since the two formulations are mathematically distinct (different Lagrangians), claiming they share the 'same' structure requires a meta-linguistic judgment about which features are structural. If the choice between formulations is conventional, the underdetermination is merely relocated from 'which entities exist?' to 'which structural description is fundamental?'. The structural realist does not escape underdetermination; she restates it. She claims the *invariant* structure is real, but the Antirealist notes that identifying the invariant requires a prior decision about which transformations (like duality) are gauge and which are physical. Without independent access to the world to verify the invariance, the structuralist's claim is indistinguishable from the antirealist's claim of empirical equivalence.

  In conclusion, the ESR gains ground on the nature of entities but loses it on individuation and the triviality of structure. The duality argument does not refute antirealism; it merely shifts the locus of skepticism from objects to relations.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Characterization of the Duality Dialectic (5 Marks)**
  *   **Criteria:** Clearly distinguishes the ESR's appeal to invariance from the Antirealist's challenge regarding the 'same world' claim.
  *   **Botch Note:** Treating the Antirealist as a standard empiricist who ignores the structural argument entirely.

  **2. OSR and Individuation Analysis (5 Marks)**
  *   **Criteria:** Explains how OSR reduces entities to positions and identifies the resulting problem of individuating $E$ vs. $B$ roles without primitive thisness.
  *   **Botch Note:** Claiming OSR straightforwardly solves the problem by denying the existence of fields.

  **3. Newman's Objection Specificity (5 Marks)**
  *   **Criteria:** Distinguishes between Newman's general triviality argument and its specific application to the Ramsey-sentence vs. the physical nomic structure in duality.
  *   **Botch Note:** Treating Newman's objection as just another form of the underdetermination argument.

  **4. Underdetermination Assessment (5 Marks)**
  *   **Criteria:** Evaluates whether structural invariance solves underdetermination or merely relocates it to the choice of 'fundamental' structure.
  *   **Botch Note:** Asserting that structural invariance automatically guarantees truth without addressing the Antirealist's counter.

  **5. Adjudication and Coherence (5 Marks)**
  *   **Criteria:** Provides a clear verdict on the exchange (who wins or if it is a stalemate) supported by the previous three arguments.
  *   **Botch Note:** Refusing to take a stance or concluding that both sides are equally right without synthesis.
