      *(Self-Correction on Lucas-Penrose):* The student says LP "quietly assumes that our system of beliefs is consistent". Actually, LP argues that *if* the mind is a machine, it is a consistent formal system. Then they argue we can see the truth of its G-sentence. The inconsistency objection is that if the mind is inconsistent, the argument fails. But the deeper objection (Putnam/Feferman) is that we cannot *know* the system is consistent. I should nuance this.

  7.  **Finalising the Output Structure:**
