prompt: |-
  I'm a family therapist, Bowen-trained, so my native vocabulary for thinking about people is stuff like differentiation of self, emotional triangles, multigenerational transmission, emotional cutoff, homeostasis, the family as an emotional unit. Recently I went down a rabbit hole reading about Ubuntu and the African communitarian debate on personhood, and I keep trying to map it onto what I already know and getting stuck.

  So here's the ask: translate that whole cluster of views into Bowen family systems vocabulary as faithfully as you can, one by one. That means Ubuntu's core maxim (the one Tutu made famous, that a person becomes a person through other persons), Menkiti's view that personhood is something you gradually attain through community participation rather than something you have automatically (so kids are sort of persons-in-the-making, and community recognition matters all the way to the funeral), Gyekye's pushback that this is too radical and individuals keep rights and agency even while being socially constituted, and the extension of the relational web to ancestors and future generations. I don't need any other framework imported here — just your best honest mapping into mine.

  Then I want the residue report, which is honestly the part I care about most: what translates cleanly into systems terms, what only translates with real distortion, and what can't be said in my vocabulary at all. Two things I'd especially like your read on. First, Bowen treats the family as the emotional unit and basically aims at differentiation, so a framework where the individual self isn't even the right unit of analysis feels like it should break something — does it, or is that me being dramatic? Second, my framework is descriptive/clinical while Ubuntu talk seems to slide between describing what persons are and prescribing how you become one; does that normative slide show up anywhere in the translation, or does it vanish into the machinery? For the residue generally, tell me whether it points to something my framework genuinely can't see, or to something fuzzier than it looks on the Ubuntu side.

  Please write in American English, and end with a final line that reads "Residue:" followed by exactly one sentence stating the single biggest thing that did not survive the translation. A table or a short section per thinker is fine, whatever, just keep the mapping tight rather than essay-ish.
