answer: |-
  The rain blurred the windows of the conference room, turning the campus greenery into a smudge of watercolor. Elias rubbed his temples. The coffee had gone cold an hour ago, sitting beside the file for Julian Thorne.

  On the whiteboard, Elias had drawn three columns: Research, Teaching, Tenure. Below them, three rows for the committee members.

  Elias had marked Yes, Yes, Yes.
  Sarah, the department's senior theorist, had marked Yes, No, No.
  Marcus, who ran the writing program, had marked No, Yes, No.

  Elias capped the marker. The arithmetic was simple, yet the result felt like a trick of the light. A majority believed the research was strong. A majority believed the teaching was adequate. By the university's unwritten covenant, strong research plus adequate teaching equaled tenure. Yet, a majority of the committee had just voted against tenure.

  "We're stuck," Sarah said, leaning back. She crossed her arms, her posture rigid. "Two no votes. The candidate doesn't have the support."

  "Technically," Elias said. He looked at Marcus. "You think Julian's teaching is adequate?"

  "More than adequate," Marcus said. "The students adore him. He's present. He's careful."

  "And you, Sarah? His research?"

  "Solid," Sarah conceded. "Three top-tier journals this year. He's productive."

  "So the committee affirms he meets the standards," Elias said, tapping the board. "But denies him the reward."

  Sarah shrugged. "My vote on teaching wasn't just about adequacy. It was about priority. If the research is there, why are we wasting time debating student evaluations? But since Marcus here thinks the research is thin..." She trailed off, looking at Marcus. "I didn't see the point in voting Yes on teaching if the research was going to kill him anyway. Why soften the blow?"

  Elias felt a chill that had nothing to do with the rain. Sarah hadn't voted her judgment on teaching; she had voted strategically. She assumed Marcus would block the tenure on research grounds, so she cast a No on teaching to ensure the outcome matched her preference without forcing her to defend her low bar for pedagogy.

  "And you, Marcus?" Elias asked. "Why the No on research?"

  Marcus shifted in his chair. "I said 'strong' research means a monograph. Julian has articles. Good ones. But no book. To me, 'strong' implies a sustained argument, not just fragments."

  "So 'adequate' and 'strong' aren't binary for you," Elias said. "They're thresholds you set privately."

  "We all have standards, Elias," Marcus replied. "I can't vote Yes on research if I don't believe he's done the work. Just because Sarah thinks three papers are enough doesn't mean I have to agree."

  Elias looked back at the board. The paradox sat there, silent and accusatory. If he followed the conclusion-driven vote—the direct tally on tenure—Julian was denied. If he followed the premise-driven procedure—aggregating the judgments on research and teaching separately—Julian was promoted. The handbook said nothing about which method governed. It assumed the committee thought as one mind. They did not.

  He realized then that choosing the procedure was itself a vote. If he insisted on tallying the premises, he was overruling Sarah and Marcus's direct verdict on tenure. If he accepted their direct verdict, he was ignoring their collective judgment on the criteria they were sworn to uphold.

  "If I sign this based on the premise count," Elias said quietly, "I am saying that your individual judgments on the components bind you to a conclusion you rejected."

  Sarah stood up and gathered her papers. "Or you're saying that the rules matter more than our voices. Look, Elias, if you want to give him tenure, just say so. Don't hide behind the math."

  "It's not about hiding," Elias said. "It's about consistency. If we deny him, we are admitting that a majority of this committee believes he meets our standards, but we will punish him anyway. What does that say about the standards?"

  "It says standards are complex," Marcus said, standing as well. "It says we weigh things differently. Sarah weights research higher. I weight teaching. You weight both equally. The vote reflects that weighting. The premise vote erases it."

  Elias looked at the tenure recommendation form. It required a single signature. His. He could attach a minority report, but that would expose the fracture to the Dean. It would turn a personnel decision into a procedural scandal.

  He thought about Julian. A quiet man who taught like he cared and wrote like he breathed. He met the majority's definition of the job. But he hadn't secured the majority's trust for the future.

  Sarah paused at the door. "If you push this through on the premises, Elias, know that you're setting a precedent. Next time, when I think the research is weak but the teaching is great, don't expect me to honor the premise count. I'll vote my conclusion."

  It was a threat, but also a truth. The procedure couldn't force integrity. It could only channel it. If the members decided the aggregation method was illegitimate, they would game the inputs. Sarah had already done so. Marcus had hidden his threshold. Elias was the only one trying to honor the logic of the rule, but in doing so, was he violating the spirit of the committee?

  He picked up the pen. The ink hovered over the checkbox.

  *Recommend.*

  If he checked it, he upheld the integrity of the criteria but overridden the will of the majority.
  *Do Not Recommend.*

  If he checked it, he respected the colleagues' direct votes but admitted the criteria were meaningless placeholders for personal vetoes.

  The rain tapped harder against the glass. Elias thought about the nature of a group agent. Was the committee the sum of its votes, or the logic of its rules? He realized there was no answer in the file, only in the hand holding the pen.

  He checked *Recommend*.

  He signed his name, the ink drying slowly in the damp air. It was the logically consistent choice. It was the choice that honored the majority view on every specific qualification. It was also the choice that two of his colleagues had explicitly voted against.

  Elias closed the file. He had saved Julian, perhaps. But as he looked at the whiteboard, with its contradictory majorities, he wondered if he had broken the committee to do it. He turned off the light, leaving the checkmarks in the dark.
