      *   *Correction:* In Chapter 29, Beauty meets Ginger. She is in bad shape. In Chapter 43, during the hard winter, many horses die. There is a scene where a dead horse is in the snow. Is it explicitly Ginger?
      *   *Refinement:* Most summaries state Beauty encounters Ginger when she is broken, and later learns of her death. The specific image of "coming across her body on the knacker's cart" might be a conflation of the meeting in the street and the general knowledge of her fate. I need to flag this carefully. It's a crucial emotional beat.
      *   *Actually:* In Chapter 29, Ginger tells Beauty, "I wish I was dead." Later, in Chapter 43, Beauty sees a dead horse in the snow and the driver says it's the chestnut mare (Ginger). So Beauty *does* see her body. But is it on a "knacker's cart"? Usually, knackers collect them. The text says she was lying dead in the snow, then removed. I should flag the "knacker's cart" specific detail as potentially slightly off, though the emotional beat (seeing her dead) stands.
      *   *Wait, looking closer at summaries/text:* In Chapter 29, they meet. In Chapter 43 ("The Hard Winter"), Beauty sees a dead horse in the snow. The carter says, "It's the chestnut mare... she worked till she dropped." This is Ginger. So Beauty sees her body. The "knacker's cart" detail is the specific mechanism of removal. I will flag the "knacker's cart" specificity just to be safe, as the text emphasizes the body in the snow/street first.
