  In this week's mail, a parishioner from Hietzing asks if his faith is a lie. He fears science proves God nonexistent. I reply that science cannot prove a negative, but we must classify the belief correctly. You call it a delusion, but technically a delusion contradicts reality, whereas an illusion is derived from human wishes. Your God is an illusion, exalted to the status of a reality, because you wish for a protector. This wish originates in the child's longing for a father. Consider your Sunday ritual. You speak of communion, but the unconscious memory is older. In the beginning, the sons of the primal horde banded together, killed and ate the father to incorporate his strength. Guilt followed. Your church reenacts this meal. The host is the father's flesh; the wine, his blood. You consume the authority you overthrew to assuage the guilt. This is not a lie, but a historical truth preserved in ritual. The totem animal was the substitute for the father, and your lamb of God is the latest iteration. You eat him to become him, yet you remain forever guilty sons.

  Another letter arrives, typewritten, from a former patient. He notes the symmetry. You demand I lie on a couch, speak freely to a silent authority, confess sins of thought, and trust in a process whose end I cannot see. You are the father who never speaks, the judge who offers absolution through reason. Is this not a new church? You promise that education will dissolve the need for God, yet you require faith in your method. How is your expectation of cure different from my expectation of grace? You ask me to believe that reason will save us, yet this is itself an article of faith.

  I must correct this conflation, though the parallel is unsettling. The transference you feel toward me is a tool, not an end. I am a mirror, not a savior. The religious illusion protects you from nature's cruelty indefinitely; the analysis aims to make itself unnecessary. We rely on reason and education, which are slow but cumulative, whereas faith is static. Yet I concede the resemblance is structural. We both utilize the paternal imago. But where the church solidifies the dependency, we seek to dissolve it. You must trust the process until you no longer need the father, neither divine nor human. It is a difficult distinction, I admit, but vital. The goal is independence, not eternal submission. We walk the same corridor, but I promise you a door at the end. I must insist that my authority is provisional, destined to be outgrown, whereas the priest's is eternal. But I hear the weakness in my own voice as I write this. You charge me with requiring faith, and perhaps you are right. We demand you believe in the efficacy of the cure before it is achieved. This is a wager. But it is a wager on reality, not on a wish. Or so I tell myself.

  The final letter describes a sensation not of fear, but of limitlessness. A woman writes of an oceanic feeling, a oneness with the universe that requires no object, no father, no guilt. She asks if this is the neurosis you cure. I find myself pausing. My training dictates I locate the regression, the infantile narcissism where the ego feels one with the world before distinguishing itself. I should tell you this is a return to the womb, a defense against the pain of individuation. But I cannot say it with the usual certainty. I have examined many minds, dissected many dreams, yet I must confess this feeling remains foreign to me. I cannot locate it in myself. I search my own interior and find only the cold architecture of drives. There is a hollow space where this feeling should be. Perhaps it is the source of the religious need, as you say, but it possesses a quality my instruments cannot measure. I prescribe the usual course of talk, the excavation of childhood, but I wonder if there is a continent of the mind where my map holds no territory. We shall speak of this.
