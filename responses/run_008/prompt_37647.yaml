prompt: |-
  I'm in a reading group that's doing a session on simplicity and induction, and before I bring anything from a newsletter post I read to the group, I want to make sure I'm not repeating nonsense. Here's the gist of the post, from my notes:

  "Ray Solomonoff showed back in the sixties that Occam's razor isn't just a rule of thumb. His idea: take every possible hypothesis about where your data comes from, think of each one as a computer program that could generate the data, and weight them by how short the program is — shorter programs get more weight. He proved that this weighted mixture converges to the true hypothesis, and it does so faster than any competing prediction method, whatever the data turns out to be. Kolmogorov had shown around the same time that 'complexity' can be made objective as the length of the shortest program that outputs a string, and that this length doesn't depend on your choice of machine, so simplicity is now a rigorous mathematical quantity rather than a matter of taste. Putting the two together: Occam's razor is a theorem. Preferring the simpler theory isn't an aesthetic preference, it's provably optimal, which is why practitioners deal with overfitting by always picking the shortest model that fits the training data."

  Parts of this smell off to me — especially the "faster than any competing method" bit and the final sentence about overfitting, since I have a vague memory of someone telling me that "shortest program" isn't even computable in general? But I honestly don't know enough to pin down where it goes wrong.

  Act as an expert in formal learning theory and algorithmic information theory. Please think carefully and maybe brainstorm the claims seperately before answering — I care more about getting this right than about a quick reply. Go through the post claim by claim: which parts would a working theorist accept, which would make them wince, and which are just wrong. In particular I'd like to know (a) whether the dominance result for Solomonoff's mixture really says "faster than any other method," or something weaker with an important caveat, (b) whether Kolmogorov's invariance result really means program length doesn't depend on the machine, or whether there's a catch hiding there, and (c) whether the closing sentence about overfitting follows from anything actually true in the post. And if the post overstates what was "proved," give me a careful one-paragraph version I could read to the group instead.
