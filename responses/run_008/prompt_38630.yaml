answer: |-
  # DECISION TREE: TYPOLOGIES OF SOCIETAL COLLAPSE
  **Start:** *The claim "This society collapsed" is asserted.*

  ### NODE 1: DEMOGRAPHIC FATE
  **Q:** Did the majority of the population die or permanently abandon the region?
  *Use Case: Easter Island.*
  *   **YES (Depopulation):** Did this result from resource exhaustion/ecocide?
      *   **YES** ➔ **LEAF A: CLASSIC CATASTROPHIST** (e.g., Diamond).
          *   *Claim:* Collapse is a fatal outcome of mismanagement.
          *   *Evidence:* Pollen records showing deforestation; abrupt cessation of statue carving; population crash.
      *   **NO (External Kill):** ➔ **LEAF B: EXOGENOUS CATASTROPHIST** (e.g., Volcanism/Plague).
          *   *Claim:* Collapse is a dramatic outcome of external shock.
          *   *Evidence:* Ice cores (volcanic winter); mass graves (plague).
  *   **NO (Continuity):** Population remained in place, though political structures changed.
      *   *Use Case: Classic Maya (Lowlands to Northern shift); Late Bronze Age (LBA) Eastern Mediterranean.*
      *   **GO TO NODE 2.**

  ### NODE 2: CAUSAL MECHANISM
  **Q:** Was the breakdown driven primarily by the society's own escalating complexity ceasing to be worth its costs?
  *Use Case: LBA Palatial Systems.*
  *   **YES (Internal Economics):** ➔ **LEAF C: DIMINISHING RETURNS (Tainterian).**
      *   *Claim:* Collapse is a rational simplification process (outcome of economic calculus).
      *   *Evidence:* Increased burden of tribute/tax without increased security/yield; abandonment of high-cost infrastructure (palaces) while villages persist.
  *   **NO (External/Other):** Drivers were drought, invasion, or trade disruption, *or* the "cause" is disputed.
      *   *Use Case: Classic Maya (Drought vs. Politics).*
      *   **GO TO NODE 3.**

  ### NODE 3: ONTOLOGICAL STATUS
  **Q:** Does "collapse" name a material loss of human welfare, or merely a narrative imposed on ordinary change?
  *Use Case: Post-Palatial Greece (Dark Ages).*
  *   **YES (Material Loss):** Did non-elite living standards decline significantly alongside elite loss?
      *   **YES** ➔ **LEAF D: TRANSFORMATION (with Hardship).**
          *   *Claim:* Collapse is a reorganization process, but one involving real crisis.
          *   *Evidence:* Reduction in trade goods available to commoners; loss of specialized craft production; increased violence.
      *   **NO** ➔ **LEAF E: DEFLATIONIST / NARRATIVE CRITIQUE.**
          *   *Claim:* "Collapse" is a historiographical label, not a causal process.
          *   *Evidence:* Continuity in domestic pottery/farming; "Dark Ages" reflect loss of *scribes*, not loss of *people*.
  *   **NO (Narrative Only):** ➔ **LEAF E: DEFLATIONIST / NARRATIVE CRITIQUE.**
      *   *Claim:* The term "collapse" privileges elite monuments over commoner resilience.
      *   *Evidence:* Archaeological visibility bias (stone palaces vs. wooden huts).

  ***

  ### DIAGNOSTIC NOTES FOR FACILITATORS

  **1. Indistinguishable Leaves:**
  *   **Transformation (Leaf D) vs. Deflationist (Leaf E):** These nodes often blur in the archaeological record. In the **LBA Eastern Mediterranean**, both schools agree the palaces burned. The split relies on interpreting *commoner welfare*. If pottery quality drops, Transformationists cry "decline"; Deflationists cry "decentralization." Without explicit textual evidence of suffering, these leaves are empirically difficult to separate.

  **2. The Empty Spot (Logically Available but Undefended):**
  *   **Combination:** *Internal Complexity Trigger (Node 2: YES) + Catastrophic Depopulation (Node 1: YES).*
  *   **Diagnosis:** No major theorist defends the view that "diminishing returns on complexity" leads directly to *extinction*.
      *   **Why?** It is theoretically incoherent within the Tainterian framework. Tainter argues that when complexity becomes too costly, societies *simplify* to survive (Leaf C). If the population dies out completely (Leaf A), the mechanism is typically framed as "ecocide" or "resource exhaustion" (Diamond), not "marginal return on socio-political investment." The former implies a failure of adaptation; the latter implies a rational economic shift. Holding both suggests the society was rational enough to calculate complexity costs but irrational enough to die rather than simplify.

  **3. Test Case Ambiguities:**
  *   **Classic Maya:** Fits **Leaf A** (Diamond: ecocide/drought), **Leaf C** (Tainter: cost of monument building), and **Leaf D** (Webster: northern transformation). Use this case to show how the same evidence routes different scholars down different branches.
  *   **Easter Island:** Traditionally **Leaf A**, but recent work (Hunt/Lipo) argues for **Leaf E** (Deflationist: continuity until European contact). Use to demonstrate Node 1 dependency.
