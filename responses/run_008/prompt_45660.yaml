answer: |-
  Yes, there is absolutely a general fact lurking here. You have independently rediscovered the core problems of **Social Choice Theory**.

  The specific result you are looking for is **Arrow's Impossibility Theorem** (1951), and the strategic voting issue is covered by a sibling result called the **Gibbard-Satterthwaite Theorem** (1973/1975).

  You did not run into unrelated quirks. You ran into mathematical limits on how democracy (or any aggregation of preferences) can work. Here is the breakdown of the theorems, what they assume, and how they map to the defects you observed.

  ---

  ### 1. The General Result: Arrow's Impossibility Theorem

  Kenneth Arrow proved that when voters have **ordinal preferences** (rankings like 1st, 2nd, 3rd) over **three or more options**, no voting system can convert those individual rankings into a group ranking while satisfying a set of seemingly basic fairness criteria.

  **The Assumptions (The "Fairness Criteria"):**
  Arrow defined four conditions that any "good" voting system should meet:
  1.  **Unrestricted Domain:** The system must handle any possible set of individual rankings (no assuming everyone agrees beforehand).
  2.  **Non-Dictatorship:** The group ranking cannot simply mirror the ranking of one single faculty member.
  3.  **Pareto Efficiency:** If every faculty member prefers Applicant A over Applicant B, the group ranking must prefer A over B.
  4.  **Independence of Irrelevant Alternatives (IIA):** The group's relative ranking of A vs. B should depend *only* on how individuals rank A vs. B. It should not change if Applicant C enters or leaves the race.

  **The Conclusion:**
  If there are at least three applicants, **it is impossible to satisfy all four conditions simultaneously.** Any system you choose must violate at least one.

  **Mapping your defects to Arrow:**
  *   **The "Rock-Paper-Scissors" (Condorcet Paradox):** This happens when you try to satisfy Unrestricted Domain and Pareto Efficiency using simple majority rule. You lose **Transitivity** (the group ranking becomes illogical: $A>B$, $B>C$, but $C>A$). Arrow requires the group outcome to be a rational, transitive order.
  *   **The "Withdrawing Applicant Changes the Winner":** This is a direct violation of **Independence of Irrelevant Alternatives (IIA)**. You noticed this with the points-based system (Borda Count). Borda Count satisfies Transitivity but fails IIA. Arrow says you *must* fail one or the other.

  ### 2. The Strategic Lying Result: Gibbard-Satterthwaite Theorem

  You asked if the strategic lying part is covered by the same result. It is not; it is a separate (though related) theorem.

  **The Theorem:**
  For any voting system that selects a single winner from three or more candidates:
  1.  If it is not a dictatorship (one person decides), AND
  2.  If it allows voters to express any preference order...
  **Then it is manipulable.**

  **What this means:**
  There will always be scenarios where a voter (faculty member) can get a better outcome by lying about their preferences (ranking a rival lower or a weak candidate higher) than by voting honestly.

  **Mapping your defects:**
  *   **The "Rank Someone You Don't Like Higher":** This is **strategic manipulation**. Gibbard-Satterthwaite proves that *every* deterministic ranked voting system (including the ones you fought about) is vulnerable to this. There is no "strategy-proof" ranked system.

  ---

  ### 3. Crucial Nuances and Assumptions

  You asked exactly what counts as an acceptable defect vs. a fatal one. The theorems rely on specific technical assumptions. If you change the assumptions, you can sometimes escape the impossibility.

  #### A. Ordinal vs. Cardinal Voting
  *   **Arrow/Gibbard-Satterthwaite Assumption:** Voters provide **ordinal** rankings (A > B > C). They do not provide **cardinal** scores (A is 9/10, B is 5/10).
  *   **The Escape Hatch:** If you switch to **Range Voting** (or Score Voting), where faculty assign a numerical score to each applicant independently, Arrow's theorem does not strictly apply.
  *   **The Catch:** Gibbard-Satterthwaite still largely applies (people might still exaggerate scores, giving their favorite a 10 and everyone else a 0), but in practice, score voting is often more resistant to strategy and avoids the IIA violation you saw with Borda Count.

  #### B. The Number of Candidates
  *   **Assumption:** There are **3 or more** applicants.
  *   **The Reality:** If you only ever shortlist 2 applicants, simple majority rule works perfectly and satisfies all of Arrow's conditions. The impossibility kicks in the moment you add a third option.

  #### C. Single Winner vs. Full Ranking
  *   **Assumption:** Arrow talks about generating a complete *group ranking*. Gibbard-Satterthwaite talks about picking a single *winner*.
  *   **Your Context:** You are shortlisting (picking a subset). This is technically a "multi-winner" problem. While similar impossibility results exist (e.g., Dummett's theorem), the core intuition holds: aggregating preferences is inherently flawed.

  #### D. Restricting Preferences (Single-Peakedness)
  *   **Assumption:** Voters can have *any* preference order (Unrestricted Domain).
  *   **The Escape Hatch:** If you can guarantee that preferences are **single-peaked** (e.g., applicants can be arranged on a left-right spectrum, and everyone prefers candidates closer to their ideal point), then Majority Rule works without cycles.
  *   **Your Context:** In grad admissions, preferences are rarely single-peaked. One faculty member might value GPA most, another values research fit, another values diversity. There is no single spectrum, so this escape hatch is closed to you.

  ### Summary Recommendation for Your Department

  Since you cannot fix the math, you must choose which "defect" your department hates the least. This is a political decision, not a mathematical one.

  1.  **If you hate Cycles (Rock-Paper-Scissors):** Do not use pairwise majority voting. Use a points system (Borda) or Score Voting.
      *   *Cost:* You accept that removing a loser can change the winner (IIA violation).
  2.  **If you hate IIA Violations (Winner changes when loser drops):** Use a system that focuses on first-place votes (like Plurality or Instant Runoff).
      *   *Cost:* You ignore valuable information about lower rankings, and you increase the chance of cycles or "spoiler" effects.
  3.  **If you hate Strategic Lying:** You can't eliminate it (Gibbard-Satterthwaite), but **Score Voting** (0–10 scale) tends to reduce the incentive to lie compared to strict ranking, because you can give two candidates similar scores rather than being forced to rank one above the other artificially.
  4.  **If you want to avoid all of the above:** Appoint a **Dictator**. (Literally). If one person (e.g., the Department Chair) makes the final decision after hearing discussion, you satisfy Arrow's conditions (by violating Non-Dictatorship). This is actually common in practice: committees discuss, then the Chair decides.

  **The Verdict:**
  Your department's frustration is validated by Nobel Prize-winning mathematics. There is no perfect rule. The "best" system is simply the one whose inevitable flaw your faculty finds least annoying.

  **Reference:**
  *   Arrow, K. J. (1951). *Social Choice and Individual Values*.
  *   Gibbard, A. (1973). "Manipulation of Voting Schemes: A General Result". *Econometrica*.
  *   Satterthwaite, M. A. (1975). "Strategy-proofness and Arrow's Conditions: Existence and Correspondence Theorems for Voting Procedures and Social Welfare Functions". *Journal of Economic Theory*.
