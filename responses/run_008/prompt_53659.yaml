answer: |-
  **Scene:** *A university conference room, late afternoon. Spreadsheets from an Environmental Impact Assessment are spread across the table. Dr. Elena Rostova (Conservation Biologist) sits opposite Marcus Thorne (Wild-Animal-Welfare Skeptic).*

  **Marcus:** Look at column four, Elena. "Displaced Amphibians." You've logged this as a harm. A cost. But if we drain the marsh, those lives never happen. Is non-existence worse than a week of terror?

  **Elena:** It isn't just about the duration. It's about the context. You're looking at a spreadsheet; I'm looking at a functional ecosystem. In an intact marsh, the adults have stable food sources, room for social behavior, and lower parasite loads than in crowded, degraded pools. A functioning ecosystem is an aggregation of lives that are mostly worth living.

  **Marcus:** "Mostly"? Let's talk about the r-selection strategy. A leopard frog lays thousands of eggs. Ninety percent die before metamorphosis. Desiccation, predation, starvation. If almost every individual in a lineage's history is a brief prelude to an early violent death, then aggregate welfare across the population may be sharply negative. Shrinking the population shrinks the suffering.

  **Elena:** You're assuming that death shortly after hatching subtracts massive welfare. But if a tadpole lives three weeks of neutral existence before drying up, what exactly was lost? You're counting prevented pleasure as suffering. Unless you claim those weeks were net painful, preventing them isn't a mercy; it's just erasure.

  **Marcus:** Fair. If the life was neutral, preventing it is neutral. But nature isn't neutral. Starvation is active pain. Predation is active pain. If the majority of lives are predominantly painful, preventing them is a moral gain. However, I will concede this: for the surviving ten percent that reach adulthood, this marsh is superior to a drainage ditch. Stability matters. I'm not arguing that adulthood in the wild is worthless.

  **Elena:** Then consider what replaces the marsh. Farmland. You think monoculture soy reduces suffering? It creates plagues of rodents, then poisons them. It's industrialized suffering. You might reduce the wild amphibians, but you're importing a new cycle of birth and death that is equally brutal, just managed by humans.

  **Marcus:** I'll grant you that. If the conversion simply shifts suffering from wild prey to agricultural pests without reducing the total volume, I haven't won. My point isn't that farming is good, but that *wildness* isn't inherently benevolent. We treat habitat loss as a tragedy because we value the *system*. I'm asking you to value the *sentience* within it.

  **Elena:** But the system is what protects the sentience. You want to intervene based on a calculation of net pain. I'm arguing that resilience offers the best chance for welfare over time.

  **Marcus:** Resilience for whom? The gene line? Or the individual starving in a resilient system?

  **Elena:** For the community. You're willing to trade a complex, resilient community where some lives are deeply flourishing for a void where no one suffers.

  **Marcus:** I'm willing to trade it for a world where the net sum of experience is less negative. Even if that world is quieter.

  **Elena:** Then we aren't disagreeing on the data. We're disagreeing on the value of existence itself.

  **Marcus:** No. We're disagreeing on whether 'nature' is a sanctuary or a factory.

  **Elena:** Then let's name the divide for the students. It comes down to this: Do we owe protection to the *system* that generates life, or to the *individuals* who might wish they hadn't been born?

  **Marcus:** Exactly. Is the marsh a home, or a trap? If you say home, you keep it. If you say trap, you have to ask if breaking the trap is kinder than locking the door.

  **Elena:** And whether we have the right to decide for them.

  **Marcus:** Or whether refusing to decide is itself a decision.
