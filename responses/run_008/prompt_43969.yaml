answer: |-
  ### Brainstorm: Tropes & Building Blocks

  1.  **"Money is Speech" (Citizens United):** If spending money to influence politics is protected expression, then limiting it is censorship. *Build on this to argue for unlimited spending weight.*
  2.  **"Sunlight is the Best Disinfectant" (Louis Brandeis):** Corruption thrives in secrecy; disclosure solves more than prohibition. *Build on this to argue for explicit transaction logs.*
  3.  **"Regulation Drives Influence Underground" (Dark Money):** Campaign finance laws just create Super PACs and shell companies. *Build on this to argue for legalization of the transaction.*
  4.  **"Corporate Governance is Efficient" (Shareholder Voting):** Companies weigh votes by capital invested, not one-person-one-vote. *Build on this to justify weighted voting.*
  5.  **"Incumbency Provides Stability" (Business Continuity):** Frequent turnover disrupts long-term planning. *Build on this to justify dual-class shares for incumbents.*
  6.  **"Markets Aggregate Information Better Than Voters" (Efficiency):** Prices reflect all available information; elections reflect mood swings. *Build on this to justify a secondary market for votes.*

  ***

  ### 1. The Column

  **Headline: The Case for Fiscal Suffrage**
  **By: A Senior Fellow at the Center for Market Governance**

  For decades, campaign finance reform has operated on a flawed premise: that financial influence in politics is an aberration to be cured rather than a feature to be managed. Current regulations assume money can be separated from speech, and influence from governance. This is empirically false. Capital naturally seeks regulatory advantage. By attempting to ban this flow, we have merely driven it into opaque channels—Super PACs, 501(c)(4)s, and bundling networks—where accountability is impossible.

  If we accept that capital allocation is a form of civic participation, we should stop pretending otherwise. The goal of reform should not be equality of outcome, but transparency of process. We propose the Fiscal Suffrage Act, which aligns political power with economic stakeholding through four market-based mechanisms.

  **1. Weighted Voting Based on Contribution**
  Just as shareholders vote proportionally to their equity stake, citizens should vote proportionally to their fiscal contribution to the state. This replaces the obsolete "one-person-one-vote" standard with "one-dollar-one-vote." Taxes and direct campaign contributions would generate voting credits. This ensures those with the most skin in the game retain decision-making authority, aligning incentives between governance and economic growth.

  **2. Dual-Class Share Structures for Incumbents**
  Volatility harms long-term planning. To ensure stability, elected officials should hold Class B supervoting shares regarding procedural matters and committee assignments. This mirrors tech-sector governance, allowing founders (or incumbents) to retain control against short-term populist pressures while remaining accountable for overall performance.

  **3. A Liquid Secondary Market for Votes**
  Restrictions on vote selling are inefficient barriers to exchange. Many voters lack the information or incentive to research complex legislation. Allowing votes to be traded on a regulated exchange enables information aggregation. Those who care most about specific outcomes will purchase voting power, ensuring legislation is decided by those with the highest preference intensity.

  **4. Quarterly Guidance and Insider Trading Protocols**
  Congressional committees should operate like public corporations, issuing quarterly earnings calls on legislative output. Furthermore, legislators currently profit from non-public information. Strict insider trading rules should apply, but with a disclosure regime: legislators must publish their portfolio holdings monthly. If capital wants access, let them buy it openly on the ledger rather than through opaque donors.

  Critics will call this cynical. We call it honest. The current system pretends to be a democracy while functioning as a plutocracy with high transaction costs. By formalizing the market for governance, we reduce corruption costs, increase transparency, and acknowledge the economic reality of the state. It is time to stop fighting the market and start regulating it like adults.

  ***

  ### 2. Where it tips over

  The first half of the argument relies entirely on standard libertarian and corporate governance tropes. Points 1 and 4 extend the "money is speech" and "disclosure over prohibition" arguments that dominate post-*Citizens United* discourse; many pundits already argue that donors only buy "access" rather than votes, so formalizing access is a logical, if cold, next step. Point 2 borrows directly from defenses of dual-class stock in tech IPOs (stability vs. accountability).

  The logic goes off the cliff at Point 3. While economists sometimes argue that vote trading *implicitly* happens via lobbying, explicitly proposing a liquid secondary market for individual votes crosses the line from "regulating influence" to "commodifying citizenship." Real op-eds argue that markets are *like* elections; this proposal argues elections should *be* markets. The transition is seamless because it treats the vote as an asset class rather than a right, which is the underlying assumption of the entire piece.
