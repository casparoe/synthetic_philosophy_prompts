  According to the entrenchment account, the practitioners are entitled to project the "cycle-compliant" hypothesis because that predicate has a history of successful projection within their linguistic community, whereas "active" lacks this pedigree despite its simplicity. This case presents a genuine problem only if one assumes projectibility must track mind-independent natural kinds, but it is merely a redescription of Goodman's own view if one accepts his premise that validity is internal to our conceptual schemes. Goodman would likely welcome the conclusion that entrenchment is an anthropocentric fact about our projection habits, as he explicitly rejects the notion that predicates must carve nature at its joints to be valid, arguing instead that rightness is a matter of fitting within an established system of rules. The single feature doing the work here is the institutional dependency on a fixed temporal cutoff that renders the time-indexed predicate more operationally useful than the static one. If that feature is removed, such as by abolishing the fiscal year insurance deadline, the practical incentive to use the time-indexed predicate vanishes, and entrenchment would likely revert to the standard status predicate over time. A defender of the entrenchment solution would try to spoil this case by arguing that the local entrenchment of "cycle-compliant" is overridden by the global entrenchment of "active" in the broader English-speaking community, since Goodman allows broader linguistic habits to veto local anomalies. I am highly confident in the verdict that Goodman would accept the anthropocentric nature of this result, but I am least sure about the defender's strategy regarding overriding entrenchment, as it remains uncertain whether Goodman's hierarchy of entrenchment privileges local scientific practices over general language use or vice versa when the two conflict. I look forward to your thoughts on this matter. Sincerely, A Friend.
