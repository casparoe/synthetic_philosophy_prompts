      *(Refining the "Who is right" instruction)*: The prompt asks me to "tell me who's right at each step". I need to be decisive but nuanced. I can't just say "both are right." I need to evaluate the logical validity of their moves.
      *   Step 1 (Translation): Elena is practically right, Marcus is philosophically right.
