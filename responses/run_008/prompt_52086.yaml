answer: |-
  Your diagnosis is sharp, but your working hypothesis—that the camps are insulated because one is doing semantics and the other metaphysics—is slightly off. They are not talking past each other; they are fighting over the same ground, but they have mapped it using incompatible coordinate systems. The stalemate is not due to insulation, but to a **shared, unchallenged presupposition** that binds logic to ontology too tightly.

  Here is the diagnosis.

  ### 1. Substantive, Not Verbal (But Mislocated)
  The disagreement is substantive, not merely verbal. It is not the case that one side cares about logic and the other about reality. Both sides care about both.
  *   **The Bivalent (Classical)** argues that if we deny bivalence for future contingents, we break the logic of inference (e.g., proof by cases, conditional proof). Their metaphysical claim is that the future *exists* in a way that grounds truth values now (Eternalism or the Block Universe).
  *   **The Open Future (Anti-Bivalence)** argues that if we affirm bivalence, we make the future *fixed* in a way that negates contingency (Fatalism). Their semantic claim is that truth requires *current* ontological grounding (Presentism or Growing Block).

  They cannot concede each other's position without surrender, as you suspected they might. If the Open Future proponent accepts classical bivalence, they must explain what *makes* the sentence true *now*. If they say "nothing makes it true, it just is true," they concede the Bivalent's metaphysics (that truth floats free of current grounding). If the Bivalent accepts the Open Future semantics, they must accept that classical inference rules (like Disjunctive Syllogism) fail for future claims, which undermines the utility of classical logic for temporal reasoning.

  The disagreement is substantive because it is about **Truth-Makers**. The core question is not "What does 'true' mean?" but "What *ontological cost* does truth incur?"

  ### 2. The Hidden Formal Question: The Transfer Principle
  You asked if there is a hidden formal question doing the real work. There is. It is not about the definition of "settled," but about the **Transfer of Necessity from Truth to Fact.**

  Both sides implicitly accept a version of the **Aristotelian Principle**:
  $$ \text{If } True(Fp) \text{, then } Settled(Fp) $$
  *(If it is true now that there will be a sea battle, then it is now settled that there will be a sea battle.)*

  *   **The Bivalent** accepts the antecedent ($True(Fp)$) and denies that the consequent implies *causal* determinism. They argue "settled" just means "fixed in the timeline," not "coerced."
  *   **The Open Future** accepts the conditional, sees the consequent as threatening freedom/openness, and therefore denies the antecedent ($\neg True(Fp)$).

  The blockage exists because **both sides agree that Truth entails Settledness.** The debate stalls because they are fighting over the input (is it true?) rather than the mechanism (why does truth imply settledness?).

  The hidden formal question is: **Can we construct a semantics where $True(Fp)$ does not entail $Necessary(Fp)$?**
  *   **Supervaluationism** tries this: $Fp$ is not super-true (so not "True" in the strict sense), but $Fp \lor F\neg p$ is super-true. This preserves LEM without fixing the specific outcome.
  *   **Relativism** (MacFarlane): Truth is relative to a context of assessment. $Fp$ is true *as assessed from the future*, but not *as assessed from the past*. This breaks the link between "true" and "settled now."

  The dispute doesn't dissolve because proponents of the Open Future often reject Supervaluationism/Relativism as "cheating" (it saves the logic but loses the assertibility of predictions), while Bivalents reject them as unnecessarily complex.

  ### 3. The Theological Parallel: Confirmation of Structure
  The fact that the theological foreknowledge debate stalls in the exact same place confirms the blockage is **structural**, not historical.

  *   **Structure:** Infallible Belief $\to$ Truth $\to$ Necessity.
  *   **Future Contingents Structure:** LEM $\to$ Truth $\to$ Necessity.

  In both cases, the stall occurs at the **Transfer Step**.
  *   **Theologians:** If God believed $p$ yesterday, $p$ is true. If $p$ is true, is $p$ necessary? (The "Hard Incompatibilist" says yes; the "Ockhamist" says no).
  *   **Logicians:** If $p \lor \neg p$ is a tautology, one disjunct is true. If one is true, is the future necessary? (The "Fatalist" says yes; the "Aristotelian" says no).

  The coincidence of rhetoric is actually a coincidence of **modal logic**. Both debates rely on the **Principle of the Fixity of Truth**: that a truth value, once assigned (whether by God's past belief or by the Law of Excluded Middle), cannot be contingent. The stalemate persists because neither side is willing to formalize a logic where truth is **mutable** or **perspectival** without abandoning the utility of "truth" entirely.

  ### 4. Why the "Two Questions" Hypothesis Feels Right but Fails
  Your hypothesis—that one side is legislating semantics and the other metaphysics—captures the *friction* but misses the *engine*.
  It feels right because the Bivalent often says, "We are just doing logic," while the Open Future says, "We are protecting reality."
  But this is a rhetorical shield.
  *   The Bivalent's logic *presupposes* a metaphysics (Eternalism).
  *   The Open Future's metaphysics *demands* a logic (Non-Classical or Supervaluationist).

  They are not two questions traveling under one heading. It is **one question** (How does time relate to truth?) being answered by two disciplines that refuse to acknowledge the other's constraints. The Bivalent ignores the metaphysical cost of truth-makers; the Open Future ignores the logical cost of truth-value gaps.

  ### 5. What Counts as Progress?
  Given this diagnosis, progress will not come from better arguments for Bivalence or Openness. It will come from **decoupling Truth from Settledness**.

  **A. A Formal Result:**
  Progress would be a widely accepted semantics that validates Classical Logic (including LEM) for future contingents *without* validating the inference from $True(Fp)$ to $Settled(Fp)$.
  *   *Candidate:* **Branching Time with a Thin Red Line** that is metaphysically lightweight (a semantic device, not an ontological fact).
  *   *Candidate:* **Assessment-Sensitive Relativism**. If truth is relative to the time of assessment, then $Fp$ can be true (assessed tomorrow) without being settled (assessed today). This dissolves the fatalism because "True" no longer means "Fixed Now."

  **B. A Change of Question:**
  The debate should shift from "Is it true?" to "Is it assertible?"
  *   If we treat future contingents as having **assertibility conditions** rather than truth conditions, the Bivalent worry (logic breaks) and the Open Future worry (fatalism) both recede.
  *   We can assert $p \lor \neg p$ (as a logical rule) without asserting $p$ or asserting $\neg p$.
  *   This moves the debate from **Semantics/Metaphysics** to **Pragmatics**.

  **C. The Distinction Required:**
  We need a rigorous distinction between **Semantic Bivalence** (every sentence has a value) and **Ontological Determinism** (the value is fixed by prior causes).
  The stalemate exists because everyone assumes Semantic Bivalence $\to$ Ontological Determinism.
  Progress requires showing a model where:
  1.  Every sentence has a truth value (satisfying the Logician).
  2.  The truth value is not grounded in the past/present (satisfying the Metaphysician).
  3.  The truth value does not license inference to necessity (satisfying the Libertarian).

  ### Summary
  The debate is not insulated; it is **gridlocked**. The gridlock is caused by a shared commitment to the principle that **Truth implies Fixity**. The theological parallel confirms this is a structural feature of how we model modality and time, not a historical accident.

  Progress requires abandoning the idea that "True" must mean "Settled Now." Until one side produces a formalism where a proposition can be *true* without being *settled* (perhaps via relativism or pragmatism), the choreography will remain fixed. The "hidden question" is not about the word "true," but about whether our logic is capable of handling **ontological openness** without collapsing into **semantic indeterminacy**. Currently, we assume they are the same thing. Proving they are not is the only way out.
