          2.  *Friend's Father (Dementia/Antibiotics):* Directive should hold (refuse antibiotics), even if later self begs to live.
          3.  *Uncle (Paralysis):* Directive should *not* hold (young self refused life if paralyzed, older self is happy).
          4.  *Mom (Oral vs. Written):* Serious dinner table conversations count more than a napkin scribble at 25.
      *   **User's Current Principle:** "Earlier self has authority when the later self can no longer have wishes of her own that are worth counting." (User finds this cruel and shaky on personal identity).
      *   **Questions:**
          1.  Is there a principle that captures these verdicts?
