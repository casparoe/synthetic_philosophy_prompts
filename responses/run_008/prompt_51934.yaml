      *   *Name the Philosophers:* Dworkin is essential here (Integrity vs. Experience). Dresser is the counterpoint. Parfit on Personal Identity (optional, maybe too abstract). Let's stick to Dworkin as it fits best.
      *   *Analyze the Uncle Case:* Why is it different? Because he *adapted*. His psychological continuity is intact. The dementia patients have a break in psychological continuity.
      *   *Analyze the "Worth Counting" worry:* Validate the user's discomfort. It *is* cruel to say their wishes don't count. Better to say their wishes are *compromised by pathology*.
      *   *The "Napkin" vs. "Dinner":* This is about *informed consent*. 25-year-old doesn't know what paralysis/dementia feels like. Mom does (seeing her mother).
