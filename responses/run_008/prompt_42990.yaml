answer: |-
  This is a fascinating exercise in "case law" for political ethics. Your hypothetical country has established a surprisingly coherent, if somewhat selective, jurisprudence of apology. To predict the verdict on the unmarried mothers case, we need to extract the underlying principles from the six precedents and stress-test them against the new facts.

  Here is the breakdown of the candidate rules, their predictions, the most likely verdict, and a design for a follow-up case to settle the remaining ambiguities.

  ### 1. Candidate Rules Derived from Precedents

  Looking at the track record, three distinct rules (or combinations thereof) explain the past decisions.

  **Rule A: The "Direct State Agency & Rights Violation" Principle**
  *   **Logic:** The state apologizes and pays when it *directly* administered a policy that is now recognized as a fundamental human rights violation (bodily autonomy, liberty), provided the modern state can't plausibly deny liability (e.g., to chartered companies or predecessors).
  *   **Fits:** Sterilization (State-run, bodily harm), Boarding Schools (State-partner, abuse), Internment (State-run, liberty).
  *   **Excludes:** Slavery (Chartered companies/pre-state), Famine (Diffuse responsibility).
  *   **Tension:** Doesn't fully explain why Eviction was rejected (State-run, harm acknowledged) unless "Property/Economic Harm" is weighted lower than "Bodily/Liberty Harm."

  **Rule B: The "Lawful Policy vs. Maladministration" Distinction**
  *   **Logic:** The state apologizes for administrative abuses or rights violations that were *technically* legal but morally aberrant (Sterilization, Schools). It does *not* apologize for democratically adopted public policy decisions that served a stated public good, even if they caused harm (Eviction/Dam).
  *   **Fits:** Sterilization (Legal then, but eugenics is now aberrant), Eviction (Legal then, public infrastructure benefit now).
  *   **Tension:** Requires distinguishing between "Social Engineering" (Sterilization/Adoption) and "Public Infrastructure/Interest" (Dam).

  **Rule C: The "Survivor Economics" Constraint**
  *   **Logic:** Apologies are moral; compensation is fiscal. Compensation is paid only when there is a significant number of living victims to create political pressure, but not so many that the fund becomes bankrupting. If survivors are too few, apology only. If harm is too diffuse/old, nothing.
  *   **Fits:** Sterilization (Thousands alive = $), Internment (Handful alive = No $), Boarding Schools (Presumed critical mass = $).
  *   **Tension:** Doesn't explain the *refusal* to apologize in Famine/Slavery cases, which suggests a liability threshold beyond just cost.

  ### 2. Application to the New Case (Unmarried Mothers)

  *   **State Agency:** Welfare agencies + Religious Institutions. This matches **Boarding Schools** (State-and-Church) more than **Slavery** (Chartered/Private). The state was the gatekeeper of welfare, making it a direct agent.
  *   **Nature of Harm:** Coerced adoption, confinement, family separation. This is a **Bodily/Family Autonomy** violation, aligning with **Sterilization** and **Boarding Schools**, not **Eviction** (Property/Economic).
  *   **Legality:** Legal and popular at the time. This triggers the **Eviction** defense ("lawful at the time"). However, **Sterilization** was also legal at the time. The distinction lies in whether the law is viewed as a "Public Good" (Dam) or "Social Control" (Sterilization/Adoption).
  *   **Survivors:** Several thousand alive. This meets the **Survivor Economics** threshold for compensation (unlike Internment).
  *   **Historiography:** "Mostly settled" but with sealed archives and minority dissent. This introduces a **Famine/Slavery** risk factor (contested responsibility), but the TV documentary suggests public consensus is shifting faster than academic consensus.

  **Predictions by Rule:**
  *   **Rule A (Agency/Rights):** Predicts **Apology + Compensation.** (Direct state harm, rights violation).
  *   **Rule B (Policy vs. Abuse):** Predicts **Apology + Compensation.** (Unlike the Dam, this wasn't infrastructure; it was social control over vulnerable bodies, akin to Sterilization).
  *   **Rule C (Economics):** Predicts **Apology + Compensation.** (Thousands of voters/victims vs. a handful in Internment).

  ### 3. The Verdict

  **Prediction:** **Full Parliamentary Apology + Ex Gratia Compensation Fund.**

  **Reasoning:**
  The government will likely treat this as a **Sterilization** analog, not an **Eviction** one. While both were lawful at the time, the "Dam" precedent protects policies justified by *public utility* (electricity, water) where harm was a side effect. The Mothers case, like Sterilization, involves the state imposing a moral vision on *individual bodies and families*.

  The "Church partnership" element will be neutralized by the **Boarding School** precedent: when the state funds or empowers religious institutions to carry out welfare functions, the state accepts liability.

  However, expect the compensation to be labeled an "ex gratia payment" (goodwill payment) rather than "damages." This allows them to acknowledge the harm (overriding the Eviction "lawful policy" defense) without admitting legal negligence (protecting against lawsuits regarding the "sealed archives" or the minority historian view). The "sealed archives" will likely be cited as a reason to cap the fund, but the TV documentary ensures the political cost of inaction now exceeds the cost of the fund.

  ### 4. The Closest Analog

  Your first friend is right: **The Sterilization Case is the closest analog.**

  *   **Why Sterilization wins over Eviction:** The Eviction case turned on "Public Good" and "Prior Compensation." The Mothers case lacks the public utility justification (a dam benefits everyone; coerced adoption benefited social mores, not the public grid) and lacks prior compensation.
  *   **Why Sterilization wins over Boarding Schools:** While the Church partnership matches Boarding Schools, the *mechanism* of harm is bureaucratic welfare policy (Sterilization) rather than institutional abuse (Schools). The "Legal at the time" defense is the strongest similarity between Sterilization and Mothers. In both, the state used the law to enforce a specific biological/social outcome that is now repudiated.

  The Eviction precedent is the government's best *defense*, but the Sterilization precedent is the public's best *offense*. Given the TV documentary shifted opinion, the offense will win.

  ### 5. The Follow-Up Case Design

  To distinguish between **Rule A (Rights Violation)** and **Rule B (Public Policy Defense)**, you need a case that is a Rights Violation but clearly a Democratically Adopted Public Policy.

  **Proposed Case:** **The 1970s Mandatory Corporal Punishment in State Schools.**

  *   **The Scenario:** In the 60s and 70s, state-run public schools legally administered corporal punishment (caning/strapping) for disciplinary infractions. It was written in education statutes, supported by parent-teacher associations, and broadly popular. It was banned in the 80s following human rights rulings. A group of former students (alive today) is seeking an apology and compensation for "state-sanctioned assault."
  *   **The Variables:**
      *   **State Agency:** Direct (Public Schools).
      *   **Legality:** Fully Lawful & Democratically Adopted (Matches Eviction).
      *   **Harm Type:** Bodily Integrity (Matches Sterilization).
      *   **Public Good:** "Discipline/Education" (Matches Eviction's "Infrastructure" logic more than Sterilization's "Eugenics").
      *   **Consensus:** Historians agree it happened; some argue it was "standard discipline of the era," others call it "abuse."

  **How it Distinguishes the Rules:**
  *   **If the Government Apologizes/Pays:** It confirms **Rule A (Rights Violation)** is dominant. Bodily autonomy trumps "lawful policy." The Sterilization precedent is the true rule; Eviction was an outlier because it was property, not personhood.
  *   **If the Government Refuses:** It confirms **Rule B (Public Policy Defense)** is dominant. If a policy was democratically adopted for a stated public good (education order), the state will not apologize even for bodily harm. This would imply the Mothers case might *also* be refused if the government successfully frames adoption as "child welfare policy" rather than "rights violation."
  *   **If they Apologize but Don't Pay:** It confirms **Rule C (Survivor Economics)** or a "Contested History" veto is the real driver.

  This case isolates the "Lawful at the time" variable. In Sterilization, the government could claim the science was "wrong." In Corporal Punishment, the government would have to admit the *policy itself* was wrong, not just the science behind it. It tests whether the country apologizes for *mistakes* (Sterilization) or *values* (Punishment).
