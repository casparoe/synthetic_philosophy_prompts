prompt: |-
  My partner and I — both of us finishing coursework in decision theory — have been arguing for weeks about the common prior assumption, and I want an outside number to triangulate against. To state the proposition precisely: for a pair of ideally rational agents, differences in probability assignments over any non-indexical proposition should be entirely attributable to differences in information, so that two such agents who have shared their evidence must agree; equivalently, it is a requirement of ideal rationality that agents' priors coincide, with all genuine disagreement downstream of evidence. I hold a credence of roughly 0.55 that this is a truth about ideal rationality and not merely a modeling convention. My partner, who is more of a philosopher of science, is at about 0.2: she thinks the assumption is at best a useful idealization for mechanism design and agreement results, not something that could be binding on ideally rational agents.

  What I'd like from you is your own credence on the proposition as stated, but the number is the least of it. Please decompose the question into the sub-claims it depends on and give each a rough probability with a line of justification. Some terms you might include — feel free to add or discard ones I haven't thought of: whether priors can always be pushed back to earlier learning from some common starting point, as Harsanyi urged, or whether that leads to an infinite regress; whether the agreement theorem actually supports the normative reading or only shows that the assumption is internally coherent given itself; whether self-locating and anthropic beliefs — Sleeping Beauty-style cases, the doomsday reasoning — show that even ideal agents can rationally diverge in ways that no evidence-sharing can erase; and whether the correct reading of the assumption is normative at all rather than a pragmatic convention, in the way some have defended it as a norm of rationality akin to a rule of the game rather than a substantive constraint. Then combine the terms however you see fit, tell me whether the combination is closer to my 0.55 or her 0.2, and identify the single sub-question that most likely carries our disagreement, since that is where we should spend our remaining seminars.

  Finally, tell me what would move your number most. I'm especially interested in whether you think there is any argument that could count in principle against the assumption — my partner's suspicion is that it is constructed so that every apparent counterexample (persistent disagreement among smart, informed people; Beauty herself) gets explained away as non-ideal, which makes it unfalsifiable in a way a normative truth perhaps shouldn't be. If you share that worry, say how much of your credence survives it.
