      *   *Wait, does Dennett believe in downward causation?* In *Freedom Evolves*, he talks about "evitability" and higher-level causes being real. He argues against the idea that physics *crowds out* higher levels. So the user isn't *wrong* to say high-level causes are real. But "pushing the substrate" sounds like magic. Dennett would say the substrate *is* the high-level cause, just described differently. I need to make sure the journalist doesn't sound like they are positing a ghost in the machine.
      *   *The Construction Argument:* Dennett *does* care about history (evolution, design). The function of a heart depends on its history. So the "how it was built" *does* matter for what it *is*. But does it matter for *causation*? The causal power is in the structure. The design explains the structure. I need to distinguish *etiology* from *causation*.
      *   *LLMs:* Are LLMs Careeniums? Careeniums are classical symbolic systems (usually). LLMs are connectionist. Dennett has written about AI (e.g., with Hofstadter). He knows the difference. I should warn the journalist not to conflate symbolic AI with connectionist AI without acknowledging the shift.

  8.  **Final Polish:** Check against constraints.
      *   Three sections? Yes.
