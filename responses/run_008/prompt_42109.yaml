answer: |-
  Reject step (4). The trick lies in step (3)'s hidden assumption: that financial compounding translates linearly into welfare compounding. It ignores **diminishing marginal utility of consumption**.

  Your flatmate concedes the future will be richer. If so, an extra dollar yields less welfare for them than for today's global poor. Welfare economics dictates maximizing utility, not dollars. In the Stern Review framework, this is captured by the elasticity of marginal utility (eta). If eta is high, future wealth drastically reduces the moral value of extra consumption. You can keep (1) and (2) (impartiality) while arguing that distribution matters. The "medieval peasants" objection holds: if they had saved everything, we'd be richer, but their suffering was morally weightier than our extra luxury. Impartiality doesn't demand ignoring current desperate need for future marginal gains.

  Furthermore, step (4) assumes perfect substitutability between present and future goods. In climate ethics, this is false. Tipping points (ice sheet collapse, permafrost thaw) are irreversible. No amount of compounded capital in 2200 can restore a stable climate system lost today. Mitigation buys *security*, not just consumption.

  What does rejecting (4) cost you? You must accept complex empirical claims about future wealth and climate thresholds. You can't rely on simple discount rates; you must model marginal utility curves and planetary boundaries. It makes calculation harder than your flatmate's simple interest model. You also risk the "uncertainty trap": if we aren't sure the future will be rich, saving looks better. You must argue confidently about future development.

  If you instead rejected (1) or (2), you'd adopt a positive pure time preference. This solves the "over-saving" problem instantly: future welfare counts less simply because it is future. The cost is philosophical integrity. As Ramsey argued, this is "a practice which is morally indefensible." It privileges the present generation arbitrarily, undermining the core impartiality of utilitarianism. It justifies ignoring catastrophic long-term risks because they are distant. You buy computational simplicity and presentist comfort, but sell out the principle that birth date is morally irrelevant.

  So, the trick is conflating money with moral value. Reject (4) by insisting that welfare depends on *who* gets the money (their baseline wealth) and *what* it buys (irreversible stability vs. consumption). You keep your impartiality without demanding medieval starvation.
