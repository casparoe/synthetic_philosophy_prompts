      *   *Nuance:* Acknowledge that *purely* in terms of physical CO2, one bike ride is small. The value is in the *signal* and the *politics*.
      *   *Hardin:* Clarify that Hardin's Commons is essentially an N-person PD, but Hardin argued for "mutual coercion," not just individual virtue.
      *   *Stag Hunt:* Emphasise why the climate group likes this—it justifies collective action.
