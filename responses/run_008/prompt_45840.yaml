prompt: |-
  so here's my situation, and it's genuinely starting to bug me. my nephew was born earlier this year and it's made me actually do the things I'd been vaguely meaning to do for ages — sold the car, bike to work now, barely fly. my brother thinks I've gone soft in the head over the maths. he says climate change is just one enormous prisoner's dilemma: everyone is better off if everyone cuts back, but any one person is better off cutting back never, so defecting is the rational move and my bike rides are a rounding error. he's quite smug about it tbh.

  then at my local climate group (I joined, that's a first) someone countered that it's really more like a stag hunt — everyone wants to cooperate as long as they can trust everyone else to, which actually fits why the group exists at all — and someone else muttered something about chicken. someone also brought up Hardin's tragedy of the commons with the pasture and the herdsman, and I couldn't tell if that's a third analogy or just the prisoner's dilemma in wellies.

  I don't know the game theory well enough to referee this, and it's become personally urgent because my brother's framing is starting to sound like an excuse for him doing nothing, while honestly I sometimes suspect he's right about my own contribution being pointless.

  so: can you audit the prisoner's dilemma analogy properly? I want to see what exactly maps onto what — who are the players, what counts as defecting, what the payoffs even are when there are billions of players instead of two — then where the mapping breaks, and importantly which of the breaks matter for my brother's conclusion and which don't (I don't care about philosophical purity, I care whether my bike rides matter). does the framing smuggle anything in — like that it's one-shot, or that the only payoffs are to me personally? and then tell me whether his conclusion, individual action is pointless, survives once you fix the analogies, and whether the stag hunt or the commons or some other framing does a better job of carrying the weight. a correspondence table would definately help me. also please write the whole answer in British English — I'm in Glasgow and american spellings make my eye twitch.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Based in Glasgow (wants British English spelling), concerned about climate change, recently made lifestyle changes (sold car, bike to work, reduced flying) due to nephew's birth.
      *   **Conflict:** Brother argues individual action is pointless using a "Prisoner's Dilemma" (PD) framing (rational to defect). User joined a local climate group where others suggested "Stag Hunt" or "Chicken" or "Tragedy of the Commons".
      *   **Goal:** Audit the Prisoner's Dilemma analogy. Map the game theory concepts to the climate situation. Identify where the mapping breaks. Determine if the brother's conclusion (individual action is pointless) survives scrutiny. Compare with other game theory framings (Stag Hunt, Chicken, Commons). Provide a correspondence table.
      *   **Tone:** Empathetic, rigorous but accessible, British English (crucial: *colour, behaviour, analyse, centre, tyre*, etc.), validating the user's efforts without being preachy.

  2.  **Deconstruct the Prisoner's Dilemma (PD) Argument:**
      *   *Standard PD:* Two players, one-shot game. Payoff structure: Temptation > Reward > Punishment > Sucker. Dominant strategy is to Defect. Nash Equilibrium is (Defect, Defect), which is Pareto inefficient.
      *   *Brother's Mapping:*
          *   Players: Individuals (or nations).
          *   Cooperate: Cut emissions (bike, no fly).
          *   Defect: Continue high-emission lifestyle.
          *   Payoff: Personal convenience/cost vs. global climate stability.
      *   *Brother's Conclusion:* Since one person's impact is negligible (rounding error), the personal cost outweighs the personal benefit. Therefore, defecting is rational.

  3.  **Audit the PD Mapping (Where it breaks):**
      *   *Issue 1: Number of Players.* PD is usually 2-player. Climate is N-player (billions). This turns it into an N-person Prisoner's Dilemma (or Public Goods Game).
      *   *Issue 2: Iteration.* PD is often one-shot. Climate action is repeated (iterative game). Reputation and reciprocity matter.
      *   *Issue 3: Payoff Structure.* Brother assumes linear, additive impact. But climate has tipping points (non-linear). Also, payoffs aren't just personal convenience; they include social signalling, normative shifts, and political pressure.
      *   *Issue 4: Heterogeneity.* Not all players are equal (US vs. Somalia, or wealthy vs. poor).
      *   *Issue 5: Causality.* The "rounding error" argument assumes *no* causal link between individual action and systemic change. This is the weakest link. Individual actions influence norms, markets, and policy.

  4.  **Evaluate the Brother's Conclusion:**
      *   Does "individual action is pointless" survive? No.
      *   Why? Because the "rounding error" view ignores the *causal mechanism* of individual action. It's not just about the tonnes of CO2 saved directly; it's about shifting the equilibrium. If everyone thought like the brother, the outcome is catastrophic. If enough people act, it changes the payoff structure for others (tipping point).

  5.  **Analyse Alternative Framings:**
      *   *Stag Hunt:* Coordination game. Two equilibria: (All Hunt Stag/Cooperate) = High payoff, (All Hunt Rabbit/Defect) = Low but safe payoff. Risk is trusting others. Fits the "social movement" aspect. If I bike, I signal trust/commitment, encouraging others.
      *   *Chicken (Hawk/Dove):* Brinkmanship. Who swerves first? Fits international negotiations (who cuts first?). Less relevant for individual action, but relevant for nations.
      *   *Tragedy of the Commons:* Shared resource (atmosphere) depleted by individual self-interest. Hardin's version is actually a PD without regulation. Needs management/governance.
      *   *Threshold Public Goods Game:* This is probably the most accurate. You need $X$ contribution to unlock the benefit. Individual contributions matter *if* they help reach the threshold.

  6.  **Develop the Correspondence Table:**
      *   Columns: Concept, Prisoner's Dilemma (Brother's View), Reality/Climate Context, Implication for Action.
      *   Rows: Players, Game Type, Payoffs, Information, Outcome.

  7.  **Drafting the Content (incorporating British English):**
      *   *Spelling Check:* behaviour, analyse, centre, metre, tyre, programme, modelling, signalling, honour, neighbour.
      *   *Tone Check:* Acknowledge the nephew (heartwarming motivator). Validate the brother's logic (it's a common argument) but dismantle it gently.
      *   *Structure:*
