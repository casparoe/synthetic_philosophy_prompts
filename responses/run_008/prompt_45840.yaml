          2.  Auditing the Prisoner's Dilemma (The Brother's Model).
          3.  Where the Mapping Breaks (The Critical Flaws).
          4.  Does the Conclusion Survive? (No).
          5.  Alternative Games (Stag Hunt, Commons, Threshold).
