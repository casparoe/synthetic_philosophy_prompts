answer: |-
  You have done the reading and your instinct about the stalemate is correct but your conclusion about pluralism being the only way out is where you might be letting the philosophers off too easily. The reason the fight is frozen is not because the word is ambiguous in a harmless linguistic way but because the stakes are metaphysical regarding normativity. When Millikan and Neander argue for the etiological view they are fighting for the reality of biological mistakes. They want to say that a heart can fail even if no one is around to judge it, because it is violating a historical standard set by its ancestors. When Cummins argues for the causal-role view he is fighting for the objectivity of systemic analysis. He wants to say that function is about how parts work together right now, regardless of how they got there, because that is how science actually explains capacities. Your hypothesis that this is two questions wearing one word is insightful because it explains why neither side can land a knockout punch. The etiological side wins on normativity but loses on novelty. The causal side wins on explanation but loses on malfunction. However, calling it merely verbal suggests both sides are equally valid depending on your mood, and that is where I think you should push back if you want your character to have a real philosophical conflict rather than a terminological one.

  The substantive issue hiding under the debate is whether biology requires a specific kind of historical grounding to sustain the idea of error. If you are a philosopher of biology specifically, and not just a general philosopher of science, the etiological view actually has the stronger claim because it is the only one that distinguishes living systems from machines without smuggling in human interests. A carburetor has a function because we designed it. A heart has a function because evolution selected it. If you take the causal-role view strictly, you cannot explain why cancer is a malfunction rather than just a new causal role that the system happens to have. Cummins handles this by saying function is relative to a capacity we care about, but that makes biological normativity dependent on human observation. Neander handles this by saying biological normativity is naturalized through selection history. For a biologist, the idea that a cell is malfunctioning only because a scientist says so is emotionally and scientifically false. The cell is malfunctioning because it is failing to do what cells of that type were selected to do. This means the etiological view captures something essential about life that the causal-role view misses, which is the intrinsic teleology of the organism.

  So if you want to know what counts as progress given this diagnosis, it is not a new case study or an empirical finding but a recognition of hierarchy. Progress looks like admitting that causal-role analysis is derivative of etiological analysis in biological contexts. You can only decompose a system into functional parts if you already know what the system is supposed to be doing, and in biology, what the system is supposed to be doing is determined by its history of selection. The causal-role theorist assumes the system boundary is given, but the etiological theorist asks why that boundary exists at all. The cancer cell is doing causal work, but it is not functioning because it is undermining the system that maintains its own existence, and only the historical view explains why maintaining that existence is the standard. The pluralists like Godfrey-Smith are right that scientists use both tools, but they are wrong to suggest this means the metaphysical dispute is dissolved. Scientists use both tools because they are practical, but the philosopher's job is to say which one grounds the other. The pluralist ending is a refusal to pick, and you are right to feel that is emotionally false. It is a peace treaty, not a solution.

  This leads me to which view your character should hold if you want them to be on the losing side. You should make them a strict causal-role theorist. This makes them analytically sharp and great at explaining mechanisms, but it leaves them vulnerable on the question of disease and error. They will sound rigorous when talking about how the heart pumps, but they will stumble when asked why a stopped heart is broken rather than just resting. They will have to argue that malfunction is just a description of what we don't like, which feels cold and inadequate for a biologist. They will struggle to explain why a lab-grown heart has a function if it has no history, or they will have to bite the bullet and say it doesn't, which contradicts medical practice. The etiological view has its own problems with novel traits, but those are edge cases. The causal-role view has a problem with the core case of biological normativity. By giving your character the causal-role view, you give them a philosophy that works for engines but fails for organisms. They will be the person who can explain how the machine works but cannot explain why it matters that it breaks.

  What would count as real progress in this field, based on this diagnosis, is a reframed question that forces the causal-role theorist to ground their system boundaries historically. Instead of asking what the function is, ask what constitutes the system itself. If the causal-role theorist says the system is defined by its current causal interactions, ask them why those interactions stop at the skin of the organism and not at the edge of the ecosystem. The etiological theorist can answer that because selection acts on the organism. The causal-role theorist has no answer except pragmatics. If your character encounters this question in the book, let them sweat. Let them try to define the system without appealing to history and watch them fail. That is where the substantive issue lives. It is not about the word function. It is about whether the organism is a historical entity or a momentary snapshot. The snapshot view is the losing one because it cannot account for the persistence of life over time.

  So do not let your character settle for pluralism. Let them be committed to the causal view and let the narrative show them where it cracks. The tension you feel about the stalemate is real because the etiological view is metaphysically heavier but the causal view is methodologically lighter. Scientists prefer the light tool. Philosophers prefer the heavy foundation. Your character is a philosopher, so they should be aiming for the foundation, and if they choose the light tool, they should be shown lacking weight. The fight is not frozen because nobody knows the answer. It is frozen because the causal-role side refuses to admit that their account is incomplete without history. Your character can be the voice of that refusal. They can be brilliant and clear and utterly unable to account for the tragedy of a body failing itself. That is a much richer position for a novelist than a shrug of pluralism. It gives them a blind spot that is structural to their worldview. They see the gears but not the purpose. They see the motion but not the direction. And in a story about biology, that is a fatal flaw.
