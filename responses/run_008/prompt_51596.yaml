answer: |-
  **O'Hare International Airport, Terminal 1. Gate B12. 8:45 PM.**

  **The flight board flickers: DELAYED. Maya stares at her lukewarm coffee. Dev is scrolling on his phone, but he's not reading.**

  **Dev:** You're still thinking about the orchid.

  **Maya:** I'm thinking about the fact that I told you I killed a living thing and you said, "Well, technically."

  **Dev:** I said, "Technically, that's sloppy." There's a difference. Look, I'm sorry about the plant. Really. But you can't say your *not doing something* caused it to die.

  **Maya:** Why not? If I had watered it, it would be alive. If I didn't water it, it died. That's the counterfactual dependence test. It passes.

  **Dev:** It passes a linguistic test, maybe. Not a metaphysical one. What was the event, Maya? Where's the energy transfer? Where's the spatiotemporal connection between your "not watering" and the roots drying out?

  **Maya:** It's not about energy transfer. It's about the world going one way instead of another because a specific intervention didn't happen.

  **Dev:** Okay, but let's run the movie. You're sitting in your apartment. The orchid is next door. The soil dries. The cells collapse. Meanwhile, you are... sitting. Reading. Sleeping. There is no *thing* traveling from you to the plant. There is just you, and there is the plant, and there is a gap of nothing between you. You're telling me the *nothing* pushed the plant over the edge?

  **Maya:** I'm telling you the absence of water killed it. And I was the absencer.

  **Dev:** You were *an* absencer. I didn't water it. The guy at the bar didn't water it. The Queen of England didn't water it. By your logic, we're all mass murderers of houseplants. That's the profligacy problem. If omissions are causes, then everything that didn't prevent the effect is a cause of the effect.

  **Maya:** Don't be obtuse. You know the distinction. Mrs. Gable asked *me*. I said yes. I took the key. The watering can was on *my* porch because I moved it there.

  **Dev:** Sure, that makes you responsible. I'm not arguing about blame. I'm arguing about causation. You're conflating the two. You think because you're on the hook morally, you must be on the hook metaphysically. But the physics doesn't care about your promise.

  **Maya:** The physics doesn't care, but *causation* isn't just physics. If a security guard falls asleep and a thief walks in, the guard's sleeping caused the theft.

  **Dev:** The thief caused the theft. The guard allowed it.

  **Maya:** "Allowed" is doing a lot of heavy lifting there. Think about double prevention. A pill prevents a reaction that would prevent recovery. The pill causes recovery. That's an absence preventing an absence. You accept that.

  **Dev:** That's a physiological process interfering with another process. This is you, three rooms away, doing nothing.

  **Maya:** It's not about distance. It's about the system. In the normal course of events, orchids get watered. When they don't, they die. The default is care. The deviation is neglect. I'm the one who deviated from the expected course.

  **Dev:** Ah, there it is. "Expected." So causation is relative to expectations now?

  **Maya:** It's relative to defaults. Contrastivism. I didn't just cause "death." I caused "death rather than survival." To make sense of that contrast, you need a background framework.

  **Dev:** A normative framework. You're saying what caused the death depends on what *should* have happened. That's backwards, Maya. We need to know what happened before we can figure out who's to blame. If causation depends on obligations, then if you hadn't promised, you didn't kill it. The plant dies the exact same way, but the cause vanishes because the promise vanishes?

  **Maya:** (Sighs) If I hadn't promised, my not watering it would be a mere absence, like the Queen's. It wouldn't be *the* cause. Yes.

  **Dev:** That is insane. The plant doesn't know about your promise. The dehydration doesn't check your calendar. You're making the structure of reality depend on social contracts.

  **Maya:** I'm making the *selection* of causes depend on context. There are a million conditions necessary for the plant to live. Oxygen, gravity, me not poisoning it, you not flying over here and stepping on it. We pick out the cause based on what's relevant. What makes my non-watering relevant is the obligation.

  **Dev:** So causation is interest-relative.

  **Maya:** It's context-sensitive. Isn't everything?

  **Dev:** Not the basic building blocks of the universe. Look, I get why we hold you responsible. You agreed to a task. You failed. But don't dress it up as metaphysics. Just say, "I'm responsible for the outcome," and leave "cause" to the things that actually push and pull.

  **Maya:** Because otherwise it's too messy?

  **Dev:** Because otherwise "cause" loses its meaning. If the Queen caused it, and you caused it, and I caused it, the word doesn't distinguish anything.

  **Maya:** But we *do* distinguish it. In court, in medicine, in everyday life. If a doctor doesn't administer a drug and the patient dies, we say the lack of treatment caused the death. We don't say, "Well, the virus caused it, and the doctor is just morally liable." We say the omission was the cause. Our intuitions aren't broken, Dev. Your theory is too narrow.

  **Dev:** Our intuitions are trained to find blame, not truth. We look for a target. You're the target. So we call you the cause. It's a heuristic.

  **Maya:** It's a heuristic that tracks something real. The dependency is real. The counterfactual is true.

  **Dev:** (Takes a sip of coffee, grimaces) Okay. Fine. Let's say I grant you this. Norms select causes. Obligations turn mere absences into causal forces.

  **Maya:** Thank you.

  **Dev:** Don't thank me yet. If that's true, then causation isn't objective. It's subjective. It depends on what we think people ought to do. Which means if we disagree on the obligation, we disagree on the physics.

  **Maya:** We disagree on the *cause*. Not the physics.

  **Dev:** Same thing in this context. If I think you had no duty, I have to say you didn't cause the death. Even though the plant is just as dead. That makes causation... what? Malleable?

  **Maya:** (Rubbing her temples) It makes it sensitive to the system of actions we're looking at. Look, I'll concede this: It is weird. It feels weird to say "nothing" did something. And yeah, tying it to norms makes it feel like I'm smuggling ethics into metaphysics. Maybe I am. But the alternative is saying the doctor didn't cause the patient's death, which is worse.

  **Dev:** I'll concede this: It's hard to explain why we hold you responsible without using causal language. If I say, "You didn't cause it, but you owe me a new orchid," that sounds like a shakedown. Responsibility usually rides on causation.

  **Maya:** Exactly.

  **Dev:** But I still think you're letting the tail wag the dog. You want the responsibility so badly you're willing to warp the concept of cause to get it.

  **Maya:** And you want the concept of cause so clean you're willing to sever it from how we actually live.

  **Dev:** (Looks at the board) Still delayed.

  **Maya:** Still dead.

  **Dev:** The orchid?

  **Maya:** The orchid.

  **Dev:** (Pauses) If... if we say causation is norm-relative. Does that mean if I promise to water your plants next time, and I don't, I become a killer?

  **Maya:** Only if I leave the watering can on your porch.

  **Dev:** (Smirks) Don't tempt me.

  **Maya:** (Smiles back, faintly) I still shouldn't have let it dry out.

  **Dev:** No. You shouldn't have. But maybe just say you failed her. Leave the "cause" out of it.

  **Maya:** I can't. Because if I didn't cause it, then what did? Bad luck?

  **Dev:** Entropy.

  **Maya:** (Shakes her head) That's a cop-out.

  **Dev:** It's physics.

  **Maya:** It's nothing.

  **Dev:** (Stands up, stretches) It's everything. That's the point.

  **Maya:** (Watches him) You're impossible.

  **Dev:** And you're a witch. Causation by spellbook.

  **Maya:** At least my spellbook keeps the plants alive.

  **Dev:** (Sits back down) Flight's not boarding for another hour.

  **Maya:** No.

  **Dev:** You know, the Queen really didn't water it.

  **Maya:** Dev.

  **Dev:** Just saying. She had the resources.

  **Maya:** Drink your coffee.
