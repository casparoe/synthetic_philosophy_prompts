  2.  **Probability that Selective/Structural Realism genuinely escapes the Pessimistic Meta-Induction (PMI):** 0.70
      *   *Reasoning:* While we can often isolate the structural components that persist (e.g., Fresnel's equations without the ether), the "selection principle" for identifying working posits *before* theory change remains uncomfortably post hoc.
  3.  **Probability that the "approximate truth" target is coherent enough to assign a probability to:** 0.95
      *   *Reasoning:* Convergence metrics in measurement and the inter-theoretic reduction of chemistry to physics provide a robust, if imperfect, topology for mapping truth-likeness.
