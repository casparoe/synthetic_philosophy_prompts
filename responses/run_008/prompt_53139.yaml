answer: |-
  The term you are looking for is **Common Knowledge**.

  In game theory and epistemic logic, the distinction you are describing is the difference between **Mutual Knowledge** (everyone knows $X$) and **Common Knowledge** (everyone knows $X$, everyone knows that everyone knows $X$, everyone knows that everyone knows that everyone knows $X$, ad infinitum).

  The phenomenon you are reporting on is the **Common Knowledge Effect** in the context of a **Coordination Game**.

  Here is the breakdown of the concept, the distinction from pluralistic ignorance, and the answer to your sharper question about the "infinite tower" of knowledge.

  ### 1. The Vocabulary: Mutual vs. Common Knowledge

  You are correct that "open secret" is colloquial and "pluralistic ignorance" is technically distinct.

  *   **Mutual Knowledge (The "Before" State):** Every individual possesses the information. In your example, every economist knows the downturn has arrived. They may even know that their colleagues know it (second-order knowledge). However, they do not know if their colleagues know *that they know*.
  *   **Common Knowledge (The "After" State):** The information is announced publicly (the front page, the memo). Now, not only does everyone know the fact, but everyone knows that everyone else knows it, and everyone knows that everyone knows that everyone knows it.

  **Why behavior changes:**
  In game theory terms, your sources are playing a **Coordination Game**.
  *   If the CEO is leaving, it is beneficial for everyone to start positioning themselves for the exit *together*.
  *   If you act alone (sell your stock, criticize the CEO) while others stay loyal, you are punished (fired, lose money).
  *   Therefore, you will only act if you are confident others will act too.
  *   Mutual knowledge is insufficient for this confidence. I might know the CEO is leaving, and I might know you know, but if I'm not sure *you know that I know*, I fear you might stay loyal thinking *I* will stay loyal.
  *   The public announcement creates a **Schelling Point** (a focal point for coordination) backed by common knowledge. It removes the risk of being the "sucker" who acted alone.

  ### 2. Distinction from Pluralistic Ignorance

  You are right to suspect these come apart. They describe different epistemic failures.

  *   **Pluralistic Ignorance:** This involves **false second-order beliefs**.
      *   *Scenario:* A classroom where no one understands the lecture.
      *   *Reality:* Everyone is confused.
      *   *Belief:* Each student thinks, "I am confused, but everyone else understands."
      *   *Result:* No one asks questions.
      *   *Correction:* One student asks, "I don't get it." This reveals that the second-order belief was false.

  *   **Your Scenario (Common Knowledge Gap):** This involves **missing higher-order beliefs**.
      *   *Reality:* Everyone knows the CEO is leaving.
      *   *Belief:* Everyone knows everyone else knows the CEO is leaving.
      *   *Missing Link:* No one knows if everyone knows that *everyone knows*.
      *   *Result:* No one acts, because coordination requires certainty about the *group's* certainty.
      *   *Correction:* A public announcement. This doesn't change the fact (first-order) or even the awareness of others' awareness (second-order); it solidifies the infinite recursion required for safe coordination.

  In short: Pluralistic ignorance is "I think you believe $\neg X$." Your scenario is "I know you believe $X$, but I don't know if you know that I know that you know $X$."

  ### 3. The Edge Case: Infinite vs. Finite Depth

  Your second question cuts to the heart of a famous problem in game theory. Does the behavioral flip require the actual infinite tower ($\infty$), or is a finite depth (e.g., level 5 or 10) sufficient?

  **The Theoretical Answer: The Infinite Tower is Required.**
  In strict game theory, there is a discontinuous gap between "very high mutual knowledge" and "common knowledge." This is best illustrated by **Rubinstein's Email Game** (1989).

  *   *The Setup:* Two generals need to coordinate an attack. They communicate via unreliable messengers (emails).
  *   *The Process:* General A sends "Attack?" (Level 1). General B receives it and sends "Confirmed" (Level 2). A receives that and sends "Confirmed receipt" (Level 3).
  *   *The Problem:* Even if they exchange 1,000 confirmation emails, there is always a non-zero probability the last one got lost. If the last one got lost, General B doesn't know if General A received the 999th email.
  *   *The Result:* Game theory proves that without *guaranteed* common knowledge (the infinite tower), rational agents will often fail to coordinate, regardless of how high the finite level of mutual knowledge is. The uncertainty unravels backward from the last message.

  **The Practical Answer: Finite Depth is Usually Enough.**
  However, you are a journalist observing humans, not a mathematician observing rational agents. In sociology and behavioral economics, the "infinite" requirement is relaxed for two reasons:

  1.  **Bounded Rationality:** Humans cannot compute more than a few levels of recursion ("I know that you know that I know"). Once you reach level 3 or 4, human cognition treats it effectively as common knowledge.
  2.  **The Public Signal as a Proxy:** A front-page story or a televised statement acts as a **public signal** that is assumed to be observed by all with probability $\approx 1$. Because the probability of *anyone* missing it is negligible, we socially construct it as common knowledge.

  **The Gap Between Public Announcement and Intermediaries:**
  To your specific point: **Yes, there is a real and consequential gap between a public announcement and a chain of intermediaries.**

  *   **Public Announcement:** Creates a presumption of common knowledge. Even if I didn't read the paper, I know *you* did, and I know you know *I* could have. It creates a shared temporal marker ("Since the story broke this morning...").
  *   **Chain of Intermediaries:** This degrades into **private knowledge**. If I hear it from a colleague, I know it. I might assume my other colleagues know it. But I cannot be sure that *they* know that *I* know it.
      *   *Example:* If you hear the CEO is out via a rumor chain, you might sell your stock quietly. But you won't publicly criticize the CEO, because you don't know if enough others have heard the rumor to protect you from retaliation.
      *   *Example:* If the Board announces it, you criticize the CEO immediately, because you know the protection of the crowd is guaranteed.

  ### Summary for Your Reporting

  *   **The Term:** The transition is from **Mutual Knowledge** to **Common Knowledge**.
  *   **The Mechanism:** It solves a **Coordination Problem** by assuring individuals that acting on the information is safe because others will act simultaneously.
  *   **The Distinction:** It is not **Pluralistic Ignorance** (which is about misperceiving others' beliefs); it is about the depth of shared certainty regarding those beliefs.
  *   **The Boundary:** Theoretically, only a public event creates true Common Knowledge. A chain of whispers creates only high-order Mutual Knowledge. In practice, this distinction explains why markets or organizations often wait for the "official" word before moving, even when the "real" word has been circulating for weeks. The official word isn't providing *data*; it is providing *coordination*.

  **Suggested phrasing for your context:**
  > "The announcement did not inform the market; the market was already informed. What the announcement provided was **common knowledge**. It transformed a private suspicion held by many into a public fact known by all to be held by all, allowing the market to coordinate its reaction without fear of acting alone."
