prompt: |-
  So here's my situation: I'm a novelist working on my third book, and the setup is two aging physicists at a slowly defunding radio observatory who've been feuding for twenty years about what their equations are actually about. One of them holds to epistemic structural realism — roughly, that scientific theories give us knowledge of the relational structure of the world, and that individual objects like electrons are just nodes we can't peek inside — while the other is an ontic structural realist who goes further and insists relations are all there is, full stop, and that the "objects" are at best derived placeholders, maybe even no more than intersections of relations. The book isn't taking sides; I want to dramatize how two smart people can nail down exactly where they diverge without either one conceding. Before I write their big late-night scene, I need the document they should have produced long ago.

  What I want from you is the joint statement of an adversarial collaboration between the two of them. So: a numbered section of claims both could sign their names to (about the no-miracles argument, the pessimistic induction over theory change, what the mathematical structure of mature physics does and doesn't support — stuff both camps actually accept); then a disagreements table where each row states the residual disagreement in wording that its own side would accept, so the ontic realist's phrasing of "objects are nothing over and above structure" has to be something the epistemic realist agrees fairly characterizes the disagreement even if they reject the claim itself; then the cruxes — the subquestions such that settling one would actually move at least one of them. I suspect one crux is whether positing intrinsic, non-structural natures for objects does any explanatory work or is just metaphysical sentimentality, and another is how each side should even handle modality, since structures as such dont obviously get you laws or possibilities. And I'd especially like you to say, if you think part of their quarrel is ultimately verbal — a disagreement about how to use the word "object" rather than about the world — which part and why, because I want my characters to have at least a glimmer of that possibility by the end.

  For each crux, give a concrete argument or case both would agree bears on it (a thought experiment, a move in the literature like the Ramsey-sentence way of cashing out "structure only", whatever fits), plus what each character would predict about it, written down in advance so the reader can see the stakes. Keep it rigorous but human enough that I can imagine two tired people in a control room arguing their way through it. This is the backbone of the whole novel, so please dont just rehash the standard textbook contrast — I need the exact fault lines.
