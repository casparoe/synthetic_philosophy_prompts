      *   **Trigger:** At Thanksgiving, their uncle dismissed Singer's argument with "charity begins at home" (favoring "your own people"). The user realized they couldn't counter this effectively.
      *   **Task:** Act as a professional ethicist. Brainstorm and lay out a "menu" of precise philosophical theses that "charity begins at home" could represent.
      *   **Requirements for Each Thesis:**
          *   Define the reading clearly (e.g., proximity, special obligations, permission vs. duty, psychological claim, effectiveness claim, prudential warning).
          *   Evaluate truth status (trivially true, defensible but contested, false).
          *   Evaluate impact on Singer (does it refute the strong principle, the weak principle, or neither?).
          *   Flag extremes (too obvious to assert, too strong to be sane).
      *   **Ordering:** Order from weakest to strongest objection to Singer.
      *   **Tone:** Honest, rigorous, not biased toward "winning" the argument, suitable for a family dinner discussion.

  2.  **Deconstruct "Charity Begins at Home":**
      *   What does this proverb actually mean in ethical discourse?
      *   *Possibility 1: Psychological Fact.* People *do* care more about those near them. (Descriptive)
      *   *Possibility 2: Prudential Advice.* If you neglect your own, you'll burn out or become dependent. (Pragmatic)
      *   *Possibility 3: Efficiency.* Local aid is more efficient/less prone to fraud. (Consequentialist)
      *   *Possibility 4: Special Obligations (Contractual/Relational).* We owe more to those we have relationships with. (Deontological/Partialist)
      *   *Possibility 5: Proximity as Moral Weight.* Physical nearness matters morally. (Spatio-temporal)
      *   *Possibility 6: Radical Partiality.* Strangers have no claim on us compared to family. (Extreme Partialism)

  3.  **Evaluate Each Possibility against Singer:**
      *   *Singer's Strong Principle:* Prevent bad unless it costs something of *comparable moral importance*.
      *   *Singer's Weak Principle:* Prevent bad unless it costs something *morally significant*.
      *   *Singer's Core Claim:* Distance and number of bystanders do not matter. Impartiality is key.

      *   *Psychological Fact:* Singer agrees people *are* biased, but argues they *ought not to be*. Doesn't refute the normative claim. (Weak objection)
      *   *Prudential Advice:* Singer accepts this in the "comparable moral importance" clause. If ruining your life prevents you from helping later, it's not required. Fits within Strong Principle. (Weak/No objection)
      *   *Efficiency:* If helping at home is *more effective*, Singer agrees do it. But if helping abroad is *more effective*, this claim fails. Empirical, not ethical. (Contingent objection)
      *   *Special Obligations:* This is the big one. Does being a father/son/citizen create duties that outweigh general utility? Singer says no (impartiality). Most ethicists say yes (partiality). This challenges the Strong Principle directly. (Strong objection)
      *   *Proximity:* Singer explicitly rejects this. If this thesis is true, Singer is wrong. But why is proximity morally relevant? Hard to justify without arbitrariness. (Strong but hard to defend)
      *   *Radical Partiality:* Strangers don't matter. Singer says they do. This is the direct negation. (Strongest objection, but morally repugnant to many).

  4.  **Drafting the Menu (Iterative Process):**

      *   *Item 1: The Psychological Prediction.* "People naturally care more about kin."
          *   Status: Trivially true (descriptive).
          *   Impact on Singer: None. Singer prescribes, not describes.
          *   Order: Weakest.

      *   *Item 2: The Prudential/Instrumental Claim.* "Neglecting home undermines future capacity to help."
          *   Status: Defensible.
          *   Impact on Singer: Absorbed by the "comparable moral importance" clause.
          *   Order: Weak.

      *   *Item 3: The Effectiveness Claim.* "Local charity has better ROI."
          *   Status: Contested/Empirical. (Often false given global poverty gaps).
          *   Impact on Singer: If true, Singer agrees. If false, Singer disagrees. Doesn't challenge the *principle*, just the application.
          *   Order: Low-Mid.

      *   *Item 4: The Permission to Favor (Agent-Centered Prerogative).* "I am *allowed* to favor my own, even if not *required*."
          *   Status: Defensible (Scheffler, etc.).
          *   Impact on Singer: Challenges Strong Principle (too demanding). Might fit Weak Principle.
          *   Order: Mid.

      *   *Item 5: Special Obligations (Relational Duties).* "I *owe* more to family than strangers."
          *   Status: Defensible but contested (Impartialists vs. Partialists).
          *   Impact on Singer: Direct challenge to Strong Principle. Implies distance/relationship *does* matter.
          *   Order: Strong.

      *   *Item 6: Moral Relevance of Proximity.* "Physical nearness creates duty."
          *   Status: Hard to defend philosophically (arbitrary).
          *   Impact on Singer: Direct contradiction.
          *   Order: Strong (but shaky).

      *   *Item 7: Radical Partiality.* "Strangers have no claim."
          *   Status: Too strong/insane (implies letting child drown is okay if not kin).
          *   Impact on Singer: Total negation.
          *   Order: Strongest (but flagged as untenable).

  5.  **Refining the Analysis (Self-Correction/Nuance):**
      *   *Check:* Did I distinguish between the Strong and Weak Singer principles?
      *   *Correction:* Ensure I note that Special Obligations might be compatible with the *Weak* principle (giving up something *morally significant* includes violating special duties) but incompatible with the *Strong* principle (unless family welfare is of *comparable moral importance* to a stranger's life, which is debatable).
