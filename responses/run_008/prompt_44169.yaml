answer: |-
  This is a classic moment in ethical pedagogy. You have encountered the collision between **impartial utilitarianism** (Singer) and **common-sense morality** (your uncle). The phrase "charity begins at home" is what philosophers call a "shell phrase": it sounds substantive, but it can house many different underlying claims, some of which are compatible with Singer and some of which are lethal to him.

  Your uncle likely wasn't making a rigorous philosophical argument, but to answer him effectively, you need to know which specific claim he is implicitly relying on. Below is a menu of the possible philosophical theses hidden inside that proverb, ordered from the weakest objection to Singer (easiest for Singer to deflect) to the strongest (most damaging to his theory).

  ### 1. The Psychological Prediction
  *   **The Thesis:** Human beings are psychologically wired to care more about those physically near them or genetically related to them. We *cannot* sustain motivation to help distant strangers equally.
  *   **Truth Status:** **Trivially True.** As a descriptive claim about human psychology, this is undeniable.
  *   **Impact on Singer:** **None.** Singer's argument is normative (about what we *ought* to do), not descriptive (about what we *want* to do). He admits we are biased but argues we ought to overcome it. He would reply, "That explains why you won't do it, not why you shouldn't."
  *   **Verdict:** This is too obvious to be a serious objection. Everyone agrees we feel more for our kin; the debate is whether that feeling is morally justified.

  ### 2. The Prudential/Instrumental Claim
  *   **The Thesis:** If you neglect your own household to help strangers, you will eventually become dependent, burned out, or resentful, rendering you unable to help anyone in the future.
  *   **Truth Status:** **Defensible.** There is empirical evidence that unchecked altruism leads to burnout.
  *   **Impact on Singer:** **Absorbed by the Strong Principle.** Singer's strong principle says you must prevent bad unless it costs something of *comparable moral importance*. If ruining your financial stability prevents you from earning and donating later, that cost *is* of comparable moral importance. Singer agrees you shouldn't drown yourself to save a child.
  *   **Verdict:** This doesn't challenge Singer; it clarifies the application of his "comparable moral importance" clause.

  ### 3. The Effectiveness (ROI) Claim
  *   **The Thesis:** Donating locally is more effective because you can verify the need, reduce administrative overhead, and ensure the money isn't stolen or misused compared to foreign aid.
  *   **Truth Status:** **Contested/Empirically False.** While local charity feels more tangible, data from organizations like GiveWell suggests that money goes much further in extreme global poverty (e.g., bed nets, deworming) than in wealthy nations.
  *   **Impact on Singer:** **Contingent.** If this were true, Singer would agree with your uncle. Since we should maximize good, we should go where the money does the most good. If home is most effective, start there. But if abroad is more effective, this claim collapses.
  *   **Verdict:** This is an empirical disagreement, not an ethical one. It doesn't touch Singer's moral principle, only the facts on the ground.

  ### 4. The Agent-Centered Prerogative (The "Permission" Claim)
  *   **The Thesis:** I am not *required* to maximize the good. I am morally *permitted* to give extra weight to my own projects and family, even if I could do more good elsewhere, provided I meet a baseline of decency.
  *   **Truth Status:** **Defensible but Contested.** This is the core of the "too demanding" objection. Philosophers like Samuel Scheffler argue morality must leave room for personal life.
  *   **Impact on Singer:** **Refutes the Strong Principle; Compatible with the Weak.** This directly attacks Singer's strong claim that distance doesn't matter. It argues that my relationship to my child *does* give me a right to prioritize them. However, it might fit Singer's *weak* principle (don't give up anything *morally significant*), as family flourishing could be deemed "morally significant."
  *   **Verdict:** A strong objection to the "hard" Singer, but leaves the "soft" Singer intact.

  ### 5. The Special Obligations (Relational Duties) Claim
  *   **The Thesis:** Morality is not just about minimizing suffering; it is about fulfilling specific duties generated by relationships. I have a *duty* to my nephew that I do not have to a stranger, independent of the consequences.
  *   **Truth Status:** **Defensible.** This is the standard view in deontological and virtue ethics. We generally accept parents have specific duties to feed *their* children that they don't have to feed *all* children.
  *   **Impact on Singer:** **Refutes the Strong Principle.** Singer argues for strict impartiality: a child's suffering counts equally regardless of who their parents are. If Special Obligations are real, then impartiality is false. Distance and relationship *do* make a moral difference.
  *   **Verdict:** This is the most philosophically robust version of your uncle's claim. It forces a choice between Impartiality (Singer) and Partiality (Common Sense).

  ### 6. The Proximity Claim
  *   **The Thesis:** Physical nearness itself creates a moral duty. The child in the pond is my responsibility *because* I am standing next to the pond.
  *   **Truth Status:** **Hard to Defend.** Why does physical space matter morally? If I can save a child via drone button from 3,000 miles away, is it less my duty? Most ethicists find spatial proximity arbitrary.
  *   **Impact on Singer:** **Refutes the Strong Principle.** Singer explicitly argues distance is irrelevant. If you claim distance *is* relevant, you are directly contradicting his core premise.
  *   **Verdict:** Strong objection, but philosophically shaky. It's hard to explain *why* meters matter without appealing to effectiveness (see #3) or psychology (see #1).

  ### 7. The Moral Exclusion (Radical Partiality) Claim
  *   **The Thesis:** Strangers have no moral claim on me compared to my "own people." My duty to my family is absolute; my duty to outsiders is negligible or non-existent.
  *   **Truth Status:** **Too Strong/Untenable.** If taken literally, this implies you could let the drowning child die simply because they aren't your kin. Most people (including your uncle) would recoil from this if pressed.
  *   **Impact on Singer:** **Total Negation.** This destroys Singer's argument completely.
  *   **Verdict:** **Flagged as Insane.** No sane person actually holds this view consistently (they would still call the police for a stranger in trouble). It is usually a rhetorical exaggeration rather than a genuine ethical stance.

  ***

  ### How to Use This at Dinner

  If you want to bring this to the table without starting a war, your goal isn't to "defeat" your uncle, but to pin down which of these he actually means. Most people use "charity begins at home" to mean **#5 (Special Obligations)** or **#2 (Prudential)**, but they talk as if they mean **#7 (Exclusion)**.

  **Try asking this:**
  > "Uncle, I've been thinking about what you said. Do you mean that we *can't* help people far away effectively (Claim #3), or that we *shouldn't* because we owe more to our own family even if we could save more lives elsewhere (Claim #5)?"

  *   If he says **"Can't/Effectiveness"**: You can discuss evidence about global aid efficiency.
  *   If he says **"Shouldn't/Obligations"**: You have hit the real ethical nerve. You can then ask: "Is that a rule for *everyone*, or just *us*? If you were the only person near the drowning child, would you walk past because he isn't family?"

  If he admits he'd save the drowning child, he has conceded Singer's main point: proximity *sometimes* matters, but not enough to override the duty to prevent death. That leaves him trying to draw a line between the pond and the donation screen, which is exactly where the philosophical debate lives.
