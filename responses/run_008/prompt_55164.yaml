answer: |-
  **MEMORANDUM OF UNDERSTANDING**
  **Subject:** The Ontology of the Artwork: A Joint Statement of Agreement and Disagreement
  **Parties:** The Institutional View (Party A) and The Functional/Experiential View (Party B)
  **Scribe:** [Your Name]
  **Date:** October 26, 2023

  ***

  ### Preamble

  *From the Senior Philosopher to the Novelist:*

  You asked for a document that does not paper over the cracks. In my years chairing working groups, I have learned that the only way to preserve a collaboration between fundamental opponents is to make the disagreement precise enough that it becomes a shared project rather than a barrier. Below is the draft. I have discarded the easy compromises—the "art is both" formulations that mean nothing to either side. Instead, I have focused on where your friends' theories intersect in practice, even if they diverge in metaphysics.

  Regarding your three cases: I believe there is a genuine convergence to be found in the third case (the reissued satire), though not for the reasons either might initially claim. I have highlighted this in Section IV. Read this to them slowly. If they sign this, they are agreeing to fight on the right battlefield.

  ***

  ### I. Substantive Claims of Agreement

  *The undersigned parties, acknowledging their divergent ontological commitments, affirm the following claims as necessary conditions for any viable theory of art. These claims are not merely procedural; they are substantive commitments that rule out radical skepticism and pure physicalism.*

  1.  **The Non-Identity Thesis:** An artwork is not identical to its physical vehicle. Two perceptually indistinguishable objects (e.g., an original and a perfect forgery, or a ready-made and a mere real thing) may differ in their status as artworks. Physical properties alone are insufficient to determine arthood.
  2.  **The Intentional Constraint:** Artworks are the product of agency. Natural objects (sunsets, driftwood) may be *aesthetic objects*, but they do not become *artworks* unless acted upon by an agent (artist, curator, or institution) with the intent to present them for artistic consideration.
  3.  **The Normative Invitation:** To classify something as art is to issue a normative invitation. It prescribes a mode of attention (interpretation, aesthetic contemplation) that differs from the mode of attention paid to mere tools or natural phenomena.
  4.  **The Fallibility of Judgment:** Both parties agree that the artworld makes mistakes. Institutions can confer status on things that afford no value (bad art), and audiences can fail to recognize value in things that possess it (neglected art). The existence of error proves that neither *current* consensus nor *current* experience is infallible, though they disagree on what the error consists in.
  5.  **The Historical Embeddedness:** The identity of an artwork is partially constituted by its history of production and presentation. A text written in 1820 is not the same artwork as a text written in 2020, even if the words are identical. Context is not incidental; it is constitutive.

  ***

  ### II. Table of Residual Disagreements

  *In this section, we isolate the precise points of divergence. We have phrased each position in its strongest form, as accepted by its proponent. The "Stakes" column identifies the concrete consequence of the disagreement.*

  | Topic | The Institutional Formulation (Party A) | The Functional/Experiential Formulation (Party B) | Concrete Stakes |
  | :--- | :--- | :--- | :--- |
  | **The Constitution of Arthood** | Arthood is a **status property** conferred upon a candidate by the artworld (artists, critics, galleries, museums). Without this conferral, the object remains a mere artifact. | Arthood is a **capacity property** inherent in the object (in relation to a prepared audience). Institutions track this capacity but do not create it. | **The "Lost Masterpiece":** If a work is created but never enters the artworld, Party A says it is not art. Party B says it is art (unrecognized). |
  | **The Role of Experience** | Experience is **contingent**. A work can be art even if no one experiences it, provided the status has been conferred. Experience is a typical *effect* of art, not its *definition*. | Experience is **essential**. An object is art only insofar as it is capable of affording a specific kind of aesthetic experience. If the capacity is absent, the status is void. | **The "Boring Art":** If an institution validates a work that affords no aesthetic experience, Party A says it is (bad) art. Party B says it is a failed claim to art. |
  | **The Location of Authority** | Authority resides in the **practice**. The "artworld" is a historical social structure. Definitions of art evolve as the practice evolves. | Authority resides in the **phenomenology**. The nature of human aesthetic sensitivity is the anchor. Definitions of art refine our understanding of this sensitivity. | **The "Radical Avant-Garde":** If a new movement rejects all prior aesthetic experience, Party A says they can redefine art. Party B says they are changing the subject to something non-artistic. |
  | **Temporal Existence** | An artwork exists as art from the moment of **conferral** (e.g., publication, exhibition, acceptance). | An artwork exists as art from the moment of **actualization** (e.g., when the capacity is engaged by a viewer) or creation (if capacity is intrinsic). | **The "Unread Book":** Party A dates arthood to publication. Party B dates arthood to the first successful reading (or creation). |

  ***

  ### III. Identified Cruxes

  *These are sub-questions where further argument or empirical evidence could shift the position of at least one party. We agree that settling these would narrow the gap between our positions.*

  **Crux 1: The Problem of Unwitnessed Capacity**
  *   **Question:** Can a capacity exist without ever being actualized? (Analogy: Is a poison poisonous if no living being ever ingests it?)
  *   **Agreed Test Case:** A complex musical score is composed, perfectly notated, but destroyed before performance, and never will be performed.
  *   **Party A Prediction:** It is not a musical work. It was a candidate that failed to enter the practice.
  *   **Party B Prediction:** It was a musical work. The capacity for experience existed in the structure, even if unactualized.
  *   **Movement Condition:** If Party B can demonstrate that "capacity" implies a *relation* to a possible audience that never exists, they may concede the point. If Party A can admit that "conferral" can be done by the artist alone in isolation, they may concede.

  **Crux 2: The Identity of the Framed Object**
  *   **Question:** Does changing the *description* of an object change the *object* itself, or merely our access to it?
  *   **Agreed Test Case:** The "Reissued Satire" (see Section IV).
  *   **Party A Prediction:** The new preface changes the *status* of the text, creating a new institutional fact.
  *   **Party B Prediction:** The new preface changes the *perceptual set* of the audience, altering the aesthetic object.
  *   **Movement Condition:** If both agree that the "work" is the *text-plus-frame*, the ontological difference diminishes. The crux is whether the frame is external (Institutional) or internal to the experience (Functional).

  **Crux 3: The Limit of Institutional Power**
  *   **Question:** Is there a limit to what the artworld can successfully designate as art?
  *   **Agreed Test Case:** A random pile of trash is placed in a gallery.
  *   **Party A Prediction:** If the artworld accepts it, it is art. There is no intrinsic limit.
  *   **Party B Prediction:** If it affords no aesthetic experience, it is not art, regardless of acceptance. It is a sociological curiosity, not an artwork.
  *   **Movement Condition:** If Party A admits that persistent failure to afford experience can eventually revoke status, and Party B admits that sustained institutional support can *train* audiences to find experience where none existed, the gap closes.

  ***

  ### IV. Application to the Scribe's Cases

  *Here we apply the foregoing agreements and disagreements to the three specific scenarios provided by the novelist/scribe.*

  **Case 1: The Drawer Novel**
  *   **Description:** A novel written, believed to be good, never shown, destined for destruction.
  *   **Party A (Institutional) Conclusion:** **Not Art.**
      *   *Reasoning:* It never entered the field of art. It was a private artifact. The "belief" of the author is insufficient for conferral; the artworld requires public uptake.
      *   *Determinacy:* Determinate.
  *   **Party B (Functional) Conclusion:** **Art (in potentia).**
      *   *Reasoning:* The text possesses the capacity to afford aesthetic experience. The lack of an audience is an accident of history, not a lack of essence. Burning it is the destruction of an artwork.
      *   *Determinacy:* Determinate (assuming "capacity" does not require actualization).
  *   **Scribe's Note on Convergence:** **None.** This is the hard boundary. Party A protects the public nature of art; Party B protects the intrinsic value of creation.

  **Case 2: The Unread Manuscript (Stochastic Text)**
  *   **Description:** AI text published under a famous name, unread by humans until print, then moved readers.
  *   **Party A (Institutional) Conclusion:** **Art at Typescript/Publication.**
      *   *Reasoning:* The act of publication under a recognized name within a prestigious house constitutes conferral. The artworld accepted it as a candidate. The later experience confirms the success of the work, not its existence.
      *   *Determinacy:* Determinate.
  *   **Party B (Functional) Conclusion:** **Art at Reading.**
      *   *Reasoning:* Before a human mind engaged with it, it was merely data. The "art" emerged in the transaction between text and reader. The typescript was a *potential* artwork; the reading actualized it.
      *   *Determinacy:* Determinate.
  *   **Scribe's Note on Convergence:** **Partial.** Both agree it *is* art now. They disagree on *when* it became art. This matters for copyright and archival purposes (is the data file the work, or the reading event?).

  **Case 3: The Reissued Satire**
  *   **Description:** Failed novel reissued with new title/preface framing it as satire. Text unchanged. Reception transforms.
  *   **Party A (Institutional) Conclusion:** **The Work Has Changed.**
      *   *Reasoning:* The artwork is the text *plus* its presentation. By altering the presentation (preface/title), the institution has presented a new candidate for consideration. The old work (failed realism) is distinct from the new work (successful satire).
      *   *Determinacy:* Determinate.
  *   **Party B (Functional) Conclusion:** **The Work Has Changed.**
      *   *Reasoning:* The aesthetic object is not just the words, but the words *as perceived*. The preface alters the "perceptual set" of the audience, allowing them to access features (irony, critique) that were previously inaccessible. The experience offered is fundamentally different.
      *   *Determinacy:* Determinate.
  *   **Scribe's Note on Convergence:** **Strong.** Here, both parties agree that the *identity* of the artwork is not fixed by the text alone.
      *   *Why this matters:* This suggests a "Hybrid Zone." Both agree that *context* (Institutional) alters *capacity* (Functional). The Institutionalist admits the new context creates a new status; the Functionalist admits the new context creates a new experience.
      *   *Verbal Dispute Check:* There is a risk of verbal disagreement here. Party A calls it a "new status," Party B calls it a "new experience." But since both agree the *old* novel is effectively dead and a *new* artistic entity has replaced it, the practical outcome is identical. I recommend the parties sign off on the proposition: **"The identity of a literary work is inseparable from its framing conditions."** This phrasing allows Party A to mean "institutional framing" and Party B to mean "phenomenological framing" without contradiction.

  ***

  ### V. Final Recommendation to the Scribe

  *From the Senior Philosopher:*

  You asked if I could find a convergence. Case 3 is your ground. It demonstrates that even the hardest Institutionalist admits that "status" requires a presentation that shapes reception, and even the hardest Functionalist admits that "experience" is shaped by external framing.

  When you read Section IV, Case 3 to them, watch their faces. If they nod there, you have your collaboration. The other two cases will remain open wounds, but a collaboration does not require total agreement; it requires agreed-upon terms of engagement. This document provides those terms.
