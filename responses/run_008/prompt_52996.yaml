      *   **Constraint 1:** No direct questions about labels or "going beyond the call of duty."
      *   **Constraint 2:** Must sort into 5 specific "leaves" (views):
          1.  Classical Three-Category (Supererogation exists).
          2.  Maximizing Consequentialism (No supererogation, all optimal acts required).
          3.  Satisficing Consequentialism (Required to do "enough," maximizing is optional).
          4.  Latitude Views (Wide duties, discretion within obligation).
          5.  Agent-Centered Prerogative (Permission to favor self explains the "optional" nature).
      *   **Constraint 3:** Must include specific case types:
          (a) Costless benevolence (Optional vs. Required).
          (b) Rescue threshold (varying costs).
          (c) Trivial omissions (collectively bad, individually?).
          (d) Promise to supererogate (Does it become strict?).
          (e) Moral remainder (Regret/apology without wrongdoing).
      *   **Constraint 4:** Scoring key must identify indistinguishable leaves & needed cases, and identify incoherent answer patterns.

  2.  **Drafting the Questions (Iterative Process):**

      *   *Goal:* Create 10 scenarios that map to the 5 views while covering constraints (a)-(e).
      *   *Constraint (a) Costless Benevolence:* Need a case where helping costs nothing.
          *   Q1: Lifting a box for someone. Cost: zero effort.
          *   Options: Required vs. Optional/Nice.
      *   *Constraint (b) Rescue Threshold:* Need varying costs.
          *   Q2: Low cost rescue (wading through shallow water).
          *   Q3: High cost rescue (risking life/limb).
          *   Q4: Medium cost rescue (ruining expensive suit).
      *   *Constraint (c) Trivial Omissions:*
          *   Q5: Skipping small donations daily.
          *   Options: Each okay vs. Pattern wrong vs. Each wrong.
      *   *Constraint (d) Promise to Supererogate:*
          *   Q6: Promising to donate a kidney (extreme) or just a large sum? Let's go with a significant sacrifice that would otherwise be optional.
          *   Options: Strict obligation vs. Still optional/soft.
      *   *Constraint (e) Moral Remainder:*
          *   Q7: Declining a heroic act. Do you owe an apology?
          *   Options: No apology needed (did nothing wrong) vs. Apology needed (something missing).
      *   *Filling the rest (Q8-Q10) to differentiate views:*
          *   Need to distinguish Latitude vs. Prerogative vs. Classical.
          *   Q8: Personal projects vs. Helping. (Prerogative focus).
          *   Q9: "Enough" helping. (Satisficing focus).
          *   Q10: Identifiable vs. Statistical lives. (Maximizing focus).

      *   *Refining Options:* Must be plain language.
          *   Instead of "Obligatory," use "You must do it."
          *   Instead of "Supererogatory," use "It would be wonderful, but you don't have to."
          *   Instead of "Forbidden," use "You should not do it."

      *   *Drafting Specific Questions:*
          1.  (Costless) Holding a door.
          2.  (Rescue Low) Wet shoes to save a dog.
          3.  (Rescue Med) Ruined suit to save a stranger's wallet.
          4.  (Rescue High) Risk injury to save a stranger's wallet.
          5.  (Trivial Omissions) Skipping $1 donations.
          6.  (Promise) Promising to run a marathon for charity.
          7.  (Remainder) Not jumping on a grenade (classic heroic).
          8.  (Prerogative) Vacation vs. Donation.
          9.  (Satisficing) Volunteering "enough" vs. "max."
          10. (Maximizing) Identifiable child vs. Statistical lives.

      *   *Review against Constraints:*
          *   (a) Q1 covers costless.
          *   (b) Q2, Q3, Q4 cover rescue thresholds.
          *   (c) Q5 covers trivial omissions.
          *   (d) Q6 covers promise.
          *   (e) Q7 covers moral remainder.
          *   Q8, Q9, Q10 help distinguish the specific theories.

  3.  **Developing the Scoring Key:**

      *   *Mapping Views to Answers:*
          1.  **Classical:** Costless = Optional (usually), Low Rescue = Required, High Rescue = Optional, Promise = Strict, Remainder = Yes (Regret), Trivial = Optional individually.
          2.  **Maximizing:** Costless = Required, Low Rescue = Required, High Rescue = Required (if net good), Promise = Strict, Remainder = No (Wrongdoing occurred), Trivial = Required if net good.
          3.  **Satisficing:** Costless = Required (if easy), Low Rescue = Required, High Rescue = Optional (beyond "enough"), Promise = Strict (promise creates specific duty), Remainder = Maybe/No, Trivial = Optional until threshold met.
          4.  **Latitude:** Costless = Required (wide duty), Low Rescue = Required, High Rescue = Optional (discretion), Promise = Strict, Remainder = No (discretion exercised), Trivial = Discretionary.
