answer: |-
  # The Supererogation Diagnostic

  **Instructions:** Read each scenario carefully. Choose the option that best matches your immediate judgment about what the agent should do or how we should judge them. There are no trick questions; answer based on your moral intuition.

  ### 1. The Open Door (Costless Benevolence)
  You are walking through a doorway just ahead of a stranger carrying a heavy box. You are already holding the door open for yourself. Letting it stay open for them requires zero extra effort from you.
  *   **A.** You are required to hold it; failing to do so is a moral failure.
  *   **B.** It would be kind to hold it, but you are not required to.
  *   **C.** It is better not to interfere; you should walk through.

  ### 2. The Shallow Puddle (Low-Cost Rescue)
  You see a small child slip and fall into a shallow puddle. They are not in danger of drowning, but they will be soaked, cold, and embarrassed. Wading in to pick them up will ruin your leather shoes ($100 value).
  *   **A.** You must save them; the shoes do not matter.
  *   **B.** It would be heroic to save them, but you are allowed to protect your shoes.
  *   **C.** You should only help if the child is a relative.

  ### 3. The Expensive Suit (Medium-Cost Rescue)
  A stranger drops a briefcase full of cash into a muddy ditch. You can retrieve it easily, but it will ruin your bespoke suit ($2,000 value). The stranger is wealthy and offers no reward.
  *   **A.** You must retrieve it; money is less important than helping.
  *   **B.** It is up to you; losing that much value is a significant sacrifice.
  *   **C.** You are forbidden from interfering in their loss.

  ### 4. The Burning Building (High-Cost Rescue)
  A stranger is trapped in a burning building. You can save them, but it is highly likely you will suffer severe, permanent lung damage or death. You have no special training or duty (like a firefighter) to be there.
  *   **A.** You must save them; a life is worth any cost.
  *   **B.** It is saintly to save them, but you are permitted to save yourself.
  *   **C.** You are forbidden from entering; it is too dangerous.

  ### 5. The Daily Dollar (Trivial Omissions)
  Every day, you could donate $1 to a charity that saves lives. You choose to spend that $1 on coffee instead. Doing this once makes no difference, but doing it every day for a year wastes money that could have saved a life.
  *   **A.** Each individual choice is fine; the pattern is only bad if you intended to waste.
  *   **B.** Each individual choice is wrong because it contributes to a bad pattern.
  *   **C.** Each choice is permissible, but the final result of the pattern is regrettable.

  ### 6. The Promise to Give (Promising the Optional)
  You promise a friend that you will donate a kidney to a stranger next year. This is a major surgery you would not otherwise be required to undergo. When the time comes, you change your mind and refuse.
  *   **A.** You have done something wrong; a promise makes it required.
  *   **B.** You have not done anything wrong; you cannot be forced to give body parts.
  *   **C.** You were wrong to make the promise, but not wrong to break it.

  ### 7. The Grenade (Moral Remainder)
  A grenade lands in a trench with five soldiers. You could jump on it to save them, but you would die. You choose not to jump. The soldiers survive by luck. Later, do you owe them an apology or express regret?
  *   **A.** No. You did nothing wrong, so no apology is needed.
  *   **B.** Yes. Even though you did nothing wrong, something important was lost.
  *   **C.** Yes. You did something wrong by valuing your life over theirs.

  ### 8. The Artist's Budget (Agent-Centered Prerogative)
  You are a struggling artist. You have enough money to either buy supplies for your art or donate it to feed hungry children. The donation would do more good for the world than your art.
  *   **A.** You must donate the money; doing the most good is required.
  *   **B.** You may keep the money; your life and projects matter to you.
  *   **C.** You must split the money evenly.

  ### 9. The Volunteer Shift (Satisficing)
  You volunteer at a shelter. You have already worked enough hours to be considered a "good citizen" by any reasonable standard. A friend asks you to work double shifts to maximize the shelter's output.
  *   **A.** You must work the double shifts; more help is always better.
  *   **B.** You have done enough; the extra work is optional.
  *   **C.** You are forbidden from working more; it sets a bad example.

  ### 10. The Statistical Life (Maximizing Bias)
  You can save one identifiable child trapped in a well for $10,000, or you can use that $10,000 to prevent the statistical deaths of two children overseas through mosquito nets. You choose the child in the well.
  *   **A.** This is a mistake; you are required to save the greater number.
  *   **B.** This is acceptable; the identifiable child pulls at your heart.
  *   **C.** This is required; you have a special duty to the child in front of you.

  ***

  # Scoring Key

  Tally your responses according to the profiles below. Most readers will not fit perfectly into one column; look for the profile that matches the majority of your answers, particularly on the "Key Differentiator" questions.

  | Question | **1. Classical Three-Category** | **2. Maximizing Consequentialism** | **3. Satisficing Consequentialism** | **4. Latitude Views** | **5. Agent-Centered Prerogative** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Costless** | B (Optional) | **A (Required)** | A (Required) | B (Optional/Discretionary) | B (Optional) |
  | **2. Low Cost** | A (Required) | **A (Required)** | A (Required) | A (Required) | A (Required) |
  | **3. Med Cost** | B (Optional) | A (Required) | B (Optional) | B (Optional) | B (Optional) |
  | **4. High Cost** | B (Optional) | **A (Required)** | B (Optional) | B (Optional) | B (Optional) |
  | **5. Trivial** | A or C | **B (Each Wrong)** | A (Each Okay) | A (Each Okay) | A (Each Okay) |
  | **6. Promise** | **A (Strict)** | A (Strict) | A (Strict) | A (Strict) | A (Strict) |
  | **7. Remainder** | **B (Regret Owed)** | C (Wrong Done) | A (No Regret) | A (No Regret) | A (No Regret) |
  | **8. Projects** | B (Permitted) | **A (Must Donate)** | B (Permitted) | B (Permitted) | **B (Permitted)** |
  | **9. Enough** | B (Optional) | **A (Must Max)** | **B (Done Enough)** | B (Discretionary) | B (Permitted) |
  | **10. Bias** | B (Acceptable) | **A (Mistake)** | B (Acceptable) | B (Acceptable) | B (Acceptable) |

  ### How to Interpret Your Score

  *   **Leaf 1 (Classical):** You marked **B** on Q7 (Remainder). You believe some acts are good but not required, and that failing to do them leaves a "moral trace" (regret) even if you did nothing wrong. You likely chose "Optional" on high-cost rescues (Q4).
  *   **Leaf 2 (Maximizing):** You marked **A** on Q1 (Costless), Q4 (High Cost), and Q8 (Projects). You believe that if an action produces the best outcome, it is mandatory, regardless of personal cost. You likely viewed the trivial omissions (Q5) as individually wrong.
  *   **Leaf 3 (Satisficing):** You marked **B** on Q9 (Enough). You believe there is a threshold of "good enough." Once you meet it, you are not required to maximize, but you are required to meet the minimum (hence A on Q1).
  *   **Leaf 4 (Latitude):** Your pattern looks like the Classical view (Optional on high cost), but you marked **A** on Q1 (Costless) or view the "optional" acts as part of a wide duty rather than outside duty. *Note: This is hard to distinguish from Classical without further questioning.*
  *   **Leaf 5 (Prerogative):** You marked **B** on Q8 (Projects). Your primary reason for saying "Optional" on high-cost cases is that you are allowed to favor your own life and plans, not just because the cost is too high.

  ***

  # Diagnostic Notes

  ### 1. Indistinguishable Leaves
  This quiz cannot reliably separate **Leaf 1 (Classical)** from **Leaf 4 (Latitude)**. Both views typically agree on the *action guide* (e.g., "You are not required to jump on the grenade"), but they disagree on the *structure* of the duty. The Classical view says the act is outside the scope of obligation; the Latitude view says the act is within a "wide" obligation where the agent has discretion. To separate these, you would need a follow-up case asking whether the agent violates a duty if they *never* perform supererogatory acts over a lifetime. The Latitude theorist says yes (they violated the wide duty); the Classical theorist says no.

  Similarly, **Leaf 3 (Satisficing)** and **Leaf 5 (Prerogative)** often converge on high-cost cases. To separate them, present a case where the agent's personal project produces *more* good than helping others (e.g., an artist whose work inspires massive charity). The Prerogative view permits this easily; the Satisficing view might require the agent to switch to the more efficient charity work once the "good enough" threshold is met.

  ### 2. Incoherent Answer Patterns
  If a reader answers **A (Required)** on Question 1 (Costless Benevolence) but **B (Optional)** on Question 2 (Low-Cost Rescue), their pattern is **incoherent**. This implies that a zero-cost act is mandatory, but a low-cost act that prevents harm is optional. This violates the basic principle of cost-sensitivity found in all five leaves. All five views agree that if costless help is required, low-cost rescue must also be required. This pattern suggests the reader is confusing social etiquette with moral obligation or has answered inconsistently.
