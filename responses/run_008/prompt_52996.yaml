          *   *Classical* is distinct on Moral Remainder (Yes) and High Rescue (Optional but special).
          *   *Satisficing* vs. *Prerogative* vs. *Latitude* is the hard part.
          *   *Latitude* says the duty exists but is wide. *Prerogative* says you have a right to favor self. *Satisficing* says there's a cutoff.
          *   *Differentiation:*
              *   Satisficing vs Prerogative: Satisficing says "Once I do enough, I'm done." Prerogative says "I can stop even if more good is possible because it's *my* life."
              *   Latitude vs Classical: Latitude says the "optional" act is actually within the bounds of duty (just discretionary). Classical says it's outside duty.
              *   *Crucial distinction:* The Promise case. If I promise to do a supererogatory act, does it become a strict duty?
                  *   Classical: Yes, promises create duties.
                  *   Maximizing: Yes, it was already a duty.
                  *   Satisficing: Yes, specific duties override general thresholds.
                  *   Latitude: Yes.
                  *   Prerogative: Yes.
                  *   *Wait, this doesn't separate them well.* I need to look at the *reasoning* or specific combinations.
                  *   Let's look at the Moral Remainder (Q7). Classical usually admits regret without wrong. Maximizing says it's wrong. Prerogative/Latitude/Satisficing usually say it's not wrong, so no regret owed *morally*, though maybe personally.
                  *   Let's look at Costless (Q1). Maximizing says Required. Others might say Optional.
                  *   Let's look at Trivial (Q5). Maximizing says Required (aggregation). Others say Optional.

      *   *Refining the Scoring Logic:*
          *   **Maximizing:** Answers "You must" on Costless (Q1), Low Rescue (Q2), and Trivial Aggregation (Q5).
          *   **Classical:** Answers "Optional" on High Rescue (Q4), "Yes" on Moral Remainder (Q7).
          *   **Satisficing:** Answers "Optional" on High Rescue (Q4), "No" on Moral Remainder (Q7), "Required" on Costless (Q1) *if* it counts toward "enough". Actually, Satisficing is tricky. Let's define it as: Required to do *some* good, not *most*.
          *   **Latitude:** Similar to Classical on outcomes, but views the "optional" as part of a wide duty. Hard to distinguish from Classical via quiz without asking "Why." I will group them or note the difficulty.
          *   **Prerogative:** Similar to Satisficing. Distinguished by emphasis on *personal projects* (Q8).

      *   *Addressing Constraint 4 (Indistinguishable Leaves):*
          *   Latitude and Classical are very hard to separate with *outcome* questions alone. They agree on what you must do, disagree on the *label* of the duty.
          *   Satisficing and Prerogative often converge on high-cost cases.
          *   *Incoherent Patterns:* Saying "Costless help is forbidden" or "High cost rescue is Required" but "Costless help is Optional." (Inconsistency on cost-sensitivity).

  4.  **Writing the Content:**

      *   *Tone:* Academic but accessible.
      *   *Structure:* Intro, 10 Questions, Scoring Key, Notes on Limitations.
      *   *Checking Constraints:*
          *   10 Questions? Yes.
          *   2-3 Options? Yes.
          *   Plain language? Yes.
          *   5 Leaves mapped? Yes.
          *   Specific cases (a-e) included? Yes.
          *   Notes on indistinguishability and incoherence? Yes.

      *   *Self-Correction on Scoring:* A simple "count the As" won't work. It needs to be pattern-based. I will create a profile for each leaf based on likely answers.
      *   *Refining Q6 (Promise):* If I promise to do something supererogatory, does it become mandatory? Most theories say yes (promises create obligations). But a hard Supererogation skeptic might say "You can't promise to do what you aren't obligated to do" or "It remains optional." Actually, standard view is promising makes it obligatory. I need to make sure the options allow differentiation.
          *   Option A: You broke your promise (Wrong).
          *   Option B: You didn't break your promise (Still optional).
          *   *Maximizing:* A (It was already required).
          *   *Classical:* A (Promise makes it required).
          *   *Prerogative:* A (Promise waives the prerogative).
          *   *Differentiation:* This question might not separate much. I'll use it to rule out people who think promises don't bind.
      *   *Refining Q7 (Remainder):* This is the best Classical differentiator.
          *   Option A: No apology needed (Did nothing wrong).
