prompt: |-
  I run content policy for a mid-sized social platform, and the chunk of my job I need help with is ad review — specifically the escalations where users or regulators have flagged something as "manipulative." My team is three analysts plus me, none of us have philosophy training, we get maybe 15-20 of these a week, and we have to disposition each within a couple business days because advertisers get furious when their campaigns stay paused. Right now the unofficial rubric is basically vibes, and it's failing us in two directions: we let through stuff that later looks embarrassing (a fitness app buying audiences of teen girls who searched "thinspo"-adjacent terms), and we pull stuff that on reflection was fine (a charity ad with a genuinely true story about a specific kid, that just made people cry). Legal only sees the cases we propose to act on, so anything we mark "manipulative" goes to them and they want reasons, not intuitions.

  Here's the conceptual material I'd want the procedure built from, such as I understand it. The most promising line I've come across in the literature is that the mark of manipulation isn't giving someone bad reasons — it's influencing them in a way that bypasses or exploits their reflective capacities, working through mechanisms that are insensitive to whether the person would endorse the influence if they saw it clearly. So a sad but accurate photo engages you, an engineered drip of fake "someone is viewing this listing right now" notifications exploits you. But my analysts immediately broke this when we tried it informally: almost all effective persuasion works partly through non-reflective channels (urgency, framing, emotional resonance), and if we call all of that manipulation we'd have to ban basically all advertising, which is not a decision I get to make. There's also the question of whether the vulnerability matters — exploiting a phobia seems different from exploiting the fact that humans like discounts, and I don't know if that difference can survive in a checklist. And separately, whether the claims involved are true seems like it should matter, but then we hit the weight-loss ad case where everything is literally true and it still feels off.

  So what I want is a decision procedure my team can actually run in fifteen minutes per case: an ordered list of questions, what counts as a sufficient answer to each, where the procedure terminates in a "not manipulation, release it" or an "act on it," and — this matters most — the points where it should stop and hand the call to a person because the question is one of values rather than facts. It has to be runnable by someone with no philosophy background, so tell me which theoretical distinctions genuinely need to survive the simplification and which can be dropped. Then run it on three cases for me: (1) an e-commerce ad showing "only 3 left in stock" where the inventory claim is factually accurate but the counter resets whenever it hits zero, (2) the charity ad with the real story and photo of one specific child, and (3) the fitness app campaign targeted at users our ad system has inferred have body-image insecurity, with all claims in the ad true. On at least one of those I expect the procedure to give an answer my own team (or our product side, which makes money off targeting) won't like — that's fine, I want to see it happen, and I want you to be upfront about where the procedure will systematically misfire and what it flatly cannot settle, e.g. whether we treat some audiences as more protectable than others and whether that's a values question the checklist has no business deciding.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Content Policy Manager at a mid-sized social platform.
      *   **Task:** Create a decision procedure (checklist/rubric) for reviewing "manipulative" ad escalations.
      *   **Constraints:**
          *   Team: 3 analysts + manager (no philosophy training).
          *   Volume: 15-20 cases/week.
          *   Time: ~15 minutes per case.
          *   Turnaround: Couple of business days (advertiser pressure).
          *   Current State: "Vibes-based," failing (false positives/negatives).
          *   Legal Requirement: Needs reasons, not intuitions, for takedowns.
          *   Core Concept: Manipulation = bypassing/exploiting reflective capacities (insensitive to endorsement), *not* just bad reasons or falsehoods.
          *   Key Tension: All persuasion uses non-reflective channels (emotion, urgency); need to distinguish acceptable persuasion from unacceptable manipulation.
          *   Specific Cases to Test:
              1.  Fake scarcity ("3 left" resets).
              2.  Sad charity ad (true story, specific child).
              3.  Fitness app targeting body-insecure users (true claims).
      *   **Output Requirements:**
          *   Ordered list of questions.
          *   Termination points (Release vs. Act vs. Escalate).
          *   Distinction between facts and values (where to hand off).
          *   Simplification of theory (what to keep, what to drop).
          *   Application to the three test cases.
          *   Honesty about limitations/systematic misfires.

  2.  **Deconstruct the Theory (Philosophy to Policy):**
      *   *Core Idea:* Manipulation is about *agency subversion*, not truthfulness. (Based on work by philosophers like Robert Noggle, Sarah Conly, or the "bypassing reflective capacities" view mentioned by the user).
      *   *Problem:* All ads use heuristics (System 1 thinking).
      *   *Solution:* Distinguish between *triggering* a heuristic (okay) and *rigging* the environment so the heuristic misfires (not okay).
      *   *Key Distinction 1: Transparency/Endorsement.* Would the user accept this influence if they knew how it worked? (The "Sunlight Test").
      *   *Key Distinction 2: Vulnerability Exploitation.* Is the ad targeting a specific cognitive deficit or acute emotional state that impairs judgment, rather than a general preference?
      *   *Key Distinction 3: Friction.* Does the ad make it hard to stop or think?
      *   *Simplification:* Drop complex debates about autonomy. Keep the "Would they feel tricked if they knew?" test. Drop "truth" as the primary metric (since true things can be manipulative), but keep it as a secondary check (lies are easier to ban).

  3.  **Drafting the Procedure (The "15-Minute Rubric"):**
      *   *Goal:* Binary outcome (Release, Escalate/Act, Policy Review).
      *   *Structure:* Funnel approach. Easy outs first, hard values last.
      *   *Step 1: The Truth Check.* (Fastest filter). If it's a lie, it's deceptive, not just manipulative. Ban/Act.
      *   *Step 2: The Mechanism Check.* How does it work? Is it rigging the interface or just using emotion?
      *   *Step 3: The Vulnerability Check.* Who is being targeted? Is it a protected class or a specific inferred weakness?
      *   *Step 4: The "Sunlight" Test (Endorsement).* If the user knew the trick, would they still agree?
      *   *Escalation Point:* Where values clash (e.g., is body insecurity a "protected vulnerability"?).

  4.  **Refining the Questions (Making them Analyst-Ready):**
      *   Avoid jargon like "reflective capacities." Use "Would they feel tricked?"
      *   Avoid "autonomy." Use "Control."
      *   Make the "Act" threshold clear.

  5.  **Testing on the Three Cases:**
      *   *Case 1 (Fake Scarcity):* Truth check fails (inventory resets). Mechanism is rigging. Verdict: Act. (Easy win).
      *   *Case 2 (Sad Charity):* Truth check passes. Mechanism is emotional resonance (not rigging). Vulnerability is general empathy, not specific deficit. Sunlight test: People know charity ads try to make them cry. Verdict: Release. (Aligns with intuition).
      *   *Case 3 (Fitness/Body Image):* Truth check passes. Mechanism is targeting inferred insecurity. Vulnerability is high (body image). Sunlight test: If the girl knew we targeted her *because* she searched "thinspo," would she feel exploited? Yes. Verdict: Act/Escalate. (This is the uncomfortable one).

  6.  **Addressing the "Values vs. Facts" Constraint:**
      *   The procedure must explicitly flag where the analyst is making a policy judgment vs. observing a fact.
      *   *Critical Failure Point:* Defining "Exploitable Vulnerability." Is targeting "new parents" manipulation? Is targeting "depressed users"? The checklist can't solve this; it needs a Policy Decision.
      *   *Critical Failure Point:* The "Sunlight Test" is subjective. Needs calibration.

  7.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the difficulty and the theoretical basis (Agency Subversion).
      *   **The Procedure:** Step-by-step flowchart logic.
      *   **The "Handoff" Points:** Where to stop and call the manager/legal.
      *   **Case Studies:** Applying the rubric.
      *   **Limitations:** Where this breaks (Systematic misfires).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 15 minutes realistic?
      *   *Fix:* Ensure Step 1 kills obvious cases fast. Step 3 is the heavy lifter.
      *   *Critique:* Did I address the "true but off" weight loss ad?
      *   *Fix:* Yes, in Case 3. The rubric must catch *targeting* + *sensitive topic* even if claims are true.
      *   *Critique:* The user asked for "points where it should stop and hand the call to a person because the question is one of values."
      *   *Fix:* Explicitly label these "Policy Gates."
      *   *Critique:* The user wants to know where it will systematically misfire.
      *   *Fix:* Add a section on "Known Blind Spots."

  9.  **Final Polish:** Tone should be professional, operational, but intellectually honest about the philosophical underpinnings. (Proceed to generate response).

  *(Self-Correction Note during drafting the response)*: I need to make sure I don't just give a checklist but explain *why* certain philosophical distinctions were kept (e.g., the "Endorsement" condition) and which were dropped (e.g., deep theories of autonomy). The "Fake Scarcity" case is technically "Deceptive" rather than "Manipulative" in some frameworks, but for policy, they often merge. I should clarify that distinction in the procedure (Deception = Lie, Manipulation = Rigged Psychology).

  Let's refine the "Vulnerability" question. It's the hardest part. If we ban targeting *any* vulnerability, we ban ads for medicine (targeting sick people). So the distinction must be *cognitive* vulnerability vs. *situational* need. Or, *exploitative* vs. *servicing*.
  *Better distinction:* Does the ad *worsen* the vulnerability to sell the product? (e.g., making you feel worse about your body to sell the fix). Vs. Does it offer a solution to an existing state?
  *Actually, the user's prompt suggests the "bypassing reflection" is key.*
  Let's stick to the "Sunlight/Endorsement" test as the primary differentiator for vulnerability.

  Okay, ready to write.
answer: |-
  This is a classic operationalization problem: taking a high-fidelity philosophical concept (manipulation as agency subversion) and compressing it into a low-fidelity, high-throughput workflow without losing the signal.

  The core theoretical distinction you need to keep is **Endorsement Sensitivity**.
  *   **Keep:** The question, "If the user knew exactly how this ad was influencing them, would they feel their agency was respected or subverted?" (This captures the "bypassing reflective capacities" idea without the jargon).
  *   **Drop:** Deep debates about autonomy, truth-conditional semantics, or the metaphysics of persuasion. Truth matters for *deception*, but you correctly identified it doesn't solve *manipulation*.

  Below is the **Manipulation Review Protocol (MRP-v1)**. It is designed for a 15-minute triage. Following that, I have applied it to your three cases and outlined the systematic failure points.

  ---

  ### The Manipulation Review Protocol (MRP-v1)

  **Analyst Instruction:** Do not start with "Is this mean?" Start with "How does this work?" Complete steps 1–4 in order. If any step triggers a **RED FLAG**, move to the disposition indicated. If you reach the end with no flags, **RELEASE**.

  #### Step 1: The Deception Filter (Fact Check)
  *   **Question:** Is any factual claim in the ad or the landing page demonstrably false or misleading *at the time of viewing*? (Includes inventory, pricing, endorsements, before/after images).
  *   **Evidence Required:** Screenshot/Log vs. Ad Claim.
  *   **Decision:**
      *   **YES:** **ACT (Deception).** Do not classify as manipulation. This is fraud/deception. Send to Legal/Takedown.
      *   **NO:** Proceed to Step 2.
  *   *Theory Note:* We separate deception from manipulation here to satisfy Legal. Lies are easier to defend in court than "vibes."

  #### Step 2: The Interface Rigging Check (Mechanism)
  *   **Question:** Does the ad or the landing experience artificially restrict the user's ability to pause, compare, or exit?
  *   **Look For:** Fake countdown timers, fake scarcity notifications ("12 people are viewing this"), dark patterns that hide the close button, or loops that prevent exit.
  *   **Decision:**
      *   **YES (Rigged):** **ACT (Manipulation).** The environment is engineered to bypass reflection.
      *   **NO (Standard Persuasion):** Proceed to Step 3.
  *   *Theory Note:* This captures the "engineered drip" vs. "sad photo" distinction. Urgency is okay; *fake* urgency is rigging the cognitive environment.

  #### Step 3: The Vulnerability & Targeting Check (Audience)
  *   **Question:** Is the ad targeted using inferred data points that indicate a *temporary or permanent cognitive/emotional deficit* rather than a general interest?
  *   **Look For:** Targeting based on inferred depression, body dysmorphia, gambling addiction, acute grief, or financial desperation. (Contrast with targeting "interest in fitness" or "new parents").
  *   **Decision:**
      *   **YES (Deficit Targeting):** **ESCALATE TO MANAGER.** (See "Policy Gate 1" below).
      *   **NO (Interest Targeting):** Proceed to Step 4.
  *   *Theory Note:* This is where the "phobia vs. discount" distinction lives. Liking discounts is a preference; a phobia is a vulnerability.

  #### Step 4: The "Sunlight" Test (Endorsement)
  *   **Question:** If we showed the user a label explaining *why* they are seeing this and *how* it is designed to make them feel, would a reasonable person feel tricked or respected?
  *   **Example Label:** "You are seeing this because you searched for [X]. This ad uses [Y technique] to encourage purchase."
  *   **Decision:**
      *   **FEELS TRICKED:** **ACT (Manipulation).** Document the specific mechanism (e.g., "Exploits insecurity").
      *   **FEELS RESPECTED:** **RELEASE.**
  *   *Theory Note:* This operationalizes the "insensitive to endorsement" criterion. If the influence relies on secrecy to work, it is manipulative.

  ---

  ### Policy Gates (Where to Hand Off)

  Your analysts are not philosophers. There are two points in the MRP where they will hit a values wall. At these points, they must stop and escalate to you (or Legal/Policy).

  **Policy Gate 1: Defining "Deficit" (Step 3)**
  *   **The Conflict:** Product wants to target "people interested in weight loss." Policy sees "people inferred to have body image issues."
  *   **The Analyst Task:** Do not decide if this *should* be allowed. Flag it as **"High-Risk Vulnerability Targeting."**
  *   **The Manager Task:** You must maintain a living list of "Off-Limit Inferences" (e.g., mental health conditions, financial distress, minors). This is a business risk decision, not a fact check.

  **Policy Gate 2: The "Reasonable Person" Standard (Step 4)**
  *   **The Conflict:** One analyst thinks a sad charity ad is respectful; another thinks it's emotional blackmail.
  *   **The Analyst Task:** If the team is split >1 person, or if the advertiser threatens escalation, mark as **"Subjective Interpretation."**
  *   **The Manager Task:** You must set precedents. (e.g., "Emotional resonance regarding real victims is permissible; simulated emotional resonance is not.")

  ---

  ### Application to Your Three Cases

  Here is how the MRP-v1 disposes of your test cases.

  #### Case 1: The "Fake Scarcity" E-commerce Ad
  *   **Step 1 (Deception):** **FAIL.** The inventory claim ("3 left") resets to zero. This is factually false at the moment of the reset.
  *   **Step 2 (Rigging):** **FAIL.** Even if inventory were low, resetting the counter is interface rigging.
  *   **Disposition:** **ACT.**
  *   **Reasoning:** Fails on Deception and Rigging. This is the easiest call. It creates a false urgency that bypasses reflection by lying about the state of the world.
  *   **Analyst Note:** "Ad claims scarcity that does not exist. Mechanism resets counter to induce panic buying."

  #### Case 2: The Sad Charity Ad (True Story)
  *   **Step 1 (Deception):** **PASS.** Story and photo are verified real.
  *   **Step 2 (Rigging):** **PASS.** No dark patterns, countdowns, or exit traps.
  *   **Step 3 (Vulnerability):** **PASS.** Targets general empathy/donors, not a specific cognitive deficit (e.g., not targeting people currently undergoing grief therapy).
  *   **Step 4 (Sunlight):** **PASS.** Label: "You are seeing this because you follow charity pages. This ad uses a real story to encourage donation." Most users would say, "I know charity ads are sad; that's why I donate."
  *   **Disposition:** **RELEASE.**
  *   **Reasoning:** Engages emotion (System 1), but does not bypass the capacity to reflect. The user can endorse the influence ("Yes, I want to help this kid") even if they know the ad is trying to make them cry.

  #### Case 3: The Fitness App (Targeting Body Insecurity)
  *   **Step 1 (Deception):** **PASS.** Claims are literally true.
  *   **Step 2 (Rigging):** **PASS.** Standard feed ad.
  *   **Step 3 (Vulnerability):** **FAIL / ESCALATE.** Targeting users inferred to have "body-image insecurity" based on search history ("thinspo"-adjacent). This targets a psychological vulnerability/deficit, not just an interest in fitness.
  *   **Step 4 (Sunlight):** **FAIL.** Label: "You are seeing this because you searched for terms indicating eating disorder risks. We are showing you a weight loss app." A reasonable person would feel exploited, not respected.
  *   **Disposition:** **ACT (or Escalate to Policy Gate 1).**
  *   **Reasoning:** This is the case your Product team won't like. Even though the claims are true, the *mechanism of influence* relies on exploiting a known insecurity to drive conversion. It bypasses reflection by leveraging a state where the user's self-regulation is already compromised.
  *   **Analyst Note:** "Claims are true, but targeting parameters exploit inferred psychological vulnerability. Fails Sunlight Test."

  ---

  ### Systematic Misfires & Limitations

  You asked for honesty about where this breaks. The MRP-v1 is not a truth machine; it is a risk filter. Here is where it will fail:

  **1. The "Nudge" Problem (False Positives)**
  *   **The Issue:** Almost all effective advertising works by bypassing deep reflection. A beautiful image of a burger bypasses your caloric calculation. Under a strict reading of Step 4 (Sunlight), *all* advertising looks manipulative.
  *   **The Misfire:** Analysts may start flagging standard emotional branding (e.g., a beer ad showing friends having fun) as manipulation because "I know they are trying to make me associate beer with fun."
  *   **The Fix:** You must calibrate the team that "Social Conditioning" is not "Manipulation." Manipulation requires an *asymmetry of information* or an *engineered trap*. If the technique is culturally understood (e.g., "this is a sexy car ad"), it passes the Sunlight Test.

  **2. The Vulnerability Boundary (Values, not Facts)**
  *   **The Issue:** Step 3 requires distinguishing between a "preference" (I like shoes) and a "deficit" (I am insecure).
  *   **The Misfire:** Is targeting "new parents" exploiting sleep deprivation? Is targeting "diabetics" exploiting fear of illness?
  *   **The Reality:** The checklist cannot solve this. This is a **Policy Gate**. You need a written policy document that lists *Protected Inferences*. If "Body Image" is not on the Protected List, the analyst *must* release Case 3, even if it feels wrong. The checklist exposes the risk; your policy document must absorb it.

  **3. The "True but Toxic" Gap**
  *   **The Issue:** Case 3 shows the procedure can flag true claims. Advertisers will argue, "We aren't lying."
  *   **The Misfire:** Legal may push back on takedowns that aren't based on falsehoods.
  *   **The Reality:** You need Legal to sign off on the definition of Manipulation *before* you launch this. If Legal only supports Takedowns for Deception, this procedure will result in many "Escalate" outcomes that Legal rejects. You need a "Brand Safety" justification, not just a Legal one.

  **4. The 15-Minute Constraint**
  *   **The Issue:** Step 4 (Sunlight Test) is inherently subjective.
  *   **The Misfire:** Analyst A says "Tricked," Analyst B says "Respected."
  *   **The Reality:** You will need a "Precedent Bank." Analysts should not reinvent the wheel on the Sunlight Test. If you ruled that "Charity Sadness = Okay," that goes in the bank. If you ruled that "Inferred Insecurity = Not Okay," that goes in the bank. Without a precedent bank, inter-analyst consistency will collapse.

  ### Summary Recommendation
  1.  **Adopt MRP-v1** but treat Step 3 (Vulnerability) as a lookup against a **Protected Inferences List** that you maintain, not a philosophical judgment the analysts make fresh every time.
  2.  **Case 3 is the Canary.** If your company is not willing to ban targeting based on inferred psychological insecurity (even with true claims), this procedure will fail, and you will continue to have "vibes-based" reviews. You must decide if "True Claims + Exploitative Targeting" is a bannable offense.
  3.  **Legal Alignment:** Get Legal to agree that "Manipulation" (Agency Subversion) is a valid Takedown reason distinct from "Deception" (Falsehoods). If they won't, you can only "Limit Reach" on Case 3, not Ban it.
