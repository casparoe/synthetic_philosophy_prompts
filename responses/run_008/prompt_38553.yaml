answer: |-
  Read each stanza as a distinct phase in the life of a science, where the ground beneath the speaker shifts. Notice how the word "planet" changes its gravity between the first and last section without ever being defined.

  The earth holds fast beneath the crystal shells,
  While seven wanderers trace their appointed rounds.
  We add a circle here to save the show,
  A minor tweak to keep the numbers sound.
  The sun is just another planet known,
  Revolving round the heavy heart of stone.

  Until Mars stalls
  in mid-course, loops
  backward against the grain of all the rest,
  dragging the equation out of shape.
  We patch the deferent but the knot
  remains, a loose thread pulling at the chest.

  Now eighty spheres grind hard against the void,
  Each correction buying brief respite.
  The center wobbles though it claims to stand,
  And no calculation fits the night.
  We watch the old machinery decay,
  But have no ground to step away.

  Put fire in the center. Let the ground
  Spin underfoot. The loop is not a loop
  But sightlines crossing as we rush ahead.
  The hand turns over. What was still is moved.
  No argument, the eye just finds the place
  Where stillness belongs to the burning head.

  We circle with the rest in quiet lanes,
  No longer fixed, but bound in common law.
  The sun stands still to light the working day,
  While we join the count of planets drawn
  Around the fire, a wandering star ourselves,
  And the math runs smooth on paper flat and clean.
