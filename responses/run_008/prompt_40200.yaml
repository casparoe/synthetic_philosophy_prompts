answer: |-
  Your friend is making a category error that is common among pop-Dennett enthusiasts: he conflates "ontologically constructed" with "arbitrarily unconstrained." He is right that the self is a narrative construct, but he is wrong that this makes truth irrelevant.

  Here is the position: The self is a model, not a thing. But a model is not true simply because it is useful in the moment; it is true only if it accurately maps the causal dynamics of the system it represents. If you use a map of London to navigate New York because it "feels better," you will get lost. The fact that the map is a human construction does not mean the streets aren't real.

  **(1) Is revision just pragmatics?**
  No. Your friend defines pragmatics too narrowly, as "what feels good now." Real pragmatics includes long-term predictive power. If you adopt the flattering story ("my ex was checked out"), you might feel better today, but you have built a model of relationships that ignores your own capacity for coldness. That model will fail you in your next relationship because it doesn't account for a key variable: *you*. A story that ignores your own agency is pragmatically useless, even if it is emotionally comforting.

  **(2) What constrains the story?**
  The constraints are the "raw record" of events and the causal structure of your psychology. You cannot narrate yourself as a pacifist if you have a history of violence; the friction with reality will be too high. The constraint is *coherence with the data*. In your divorce example, the constraint is the actual interactions you had. If there is evidence you were cold, a story that omits that is not just "less flattering," it is *less accurate*. Accuracy matters because you are the one who has to live inside the skin of the character you create. If the character's motivations don't match your actual drives, you will experience cognitive dissonance and behavioral sabotage.

  **(3) What does "rings true" amount to?**
  "Rings true" is not tracking a metaphysical soul; it is tracking *integration*. A story rings true when it successfully integrates the painful data points (your coldness) with the meaningful data points (your love, your intentions) into a coherent causal chain. It survives your friend's picture because "truth" here means "high-fidelity modeling." When your therapist says it must ring true, she means it must be a story you can inhabit without lying to yourself every time you recall a specific memory. The flattering story requires you to actively suppress evidence; the true story incorporates the evidence.

  Your friend's mistake is thinking that because the self is a fiction, it has no truth conditions. But fictions have internal logic and external reference. If you write a character who never makes mistakes, and then that character fails, the story breaks. You are both the author and the protagonist, and you cannot write a plot that contradicts the physics of your own behavior.

  Verdict: Tell the story where you were cold, because acknowledging your agency is the only way to ensure you aren't cold again.
