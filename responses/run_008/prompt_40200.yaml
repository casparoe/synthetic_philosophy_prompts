      *Wait, is that too specific?* The user asked about the divorce story specifically in the prompt ("the flattering divorce story is fine"). So yes, be specific.

      *Final check on tone:* Don't hedge. "If you think he's making a real mistake, tell me where." Okay, I will say he is making a mistake.

      *Structure:*
      1. Direct answer to the friend's claim (He's wrong).
      2. The "Constructed but Constrained" argument.
