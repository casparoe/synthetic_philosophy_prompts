answer: |-
  Your instinct is correct. Your friend has constructed a sophisticated version of **Humean skepticism** applied to history. It looks airtight because it relies on a specific, rigid definition of "cause" that works well for physics (laws of nature) but fails for complex, singular historical events.

  You should reject **Premise (5)**: *"But a factor that is neither sufficient nor necessary explains nothing."*

  Here is the breakdown of why (5) is false, what you replace it with, the cost of doing so, and how to answer your worry about "anything goes."

  ### 1. Why Premise (5) is Wrong
  Premise (5) assumes that **explanation requires universal laws.** It assumes that to say "A caused B," you must be able to say "Whenever A happens, B happens" (Sufficiency) and "If A doesn't happen, B doesn't happen" (Necessity).

  This is the **Regularity Theory of Causation**. It works for gravity, but it fails for history, medicine, and geology.
  *   **Medicine:** Smoking causes lung cancer. But smoking is not *sufficient* (some smokers don't get cancer) and not *necessary* (some non-smokers get cancer). Yet, it is indisputably a cause.
  *   **History:** The assassination of Archduke Franz Ferdinand caused WWI. But it wasn't sufficient (assassinations happen without world wars) and arguably not necessary (something else might have triggered the tension). Yet, it explains the timing and spark of the war.

  If you accept (5), you must conclude that doctors cannot explain why a specific patient got cancer, and geologists cannot explain why a specific volcano erupted. That is an absurd reduction of explanatory power.

  ### 2. The Replacement: INUS Conditions and Probabilistic Causation
  Philosophers of science (most notably J.L. Mackie) replaced the Necessary/Sufficient model with **INUS conditions** for singular events.

  An INUS condition is an **I**nsufficient but **N**on-redundant part of an **U**nnecessary but **S**ufficient condition.

  *   **Translation:** Coal in Britain was not *enough* to cause the Industrial Revolution (Insufficient). But it was a crucial part of a specific "package" of conditions (Non-redundant). That whole package caused the IR (Sufficient), but theoretically, a different package could have caused it elsewhere (Unnecessary).
  *   **Probabilistic Causation:** A factor explains the divergence if it **raised the probability** of the outcome in Britain significantly higher than in China, even if it didn't guarantee it.

  **So, the corrected Premise (5*) is:**
  > *(5*) A factor explains a divergence if it is a non-redundant part of a causal mechanism that raised the probability of the outcome in the actual case compared to the counterfactual case.*

  ### 3. Addressing Your Worry: "What stops literally anything from explaining it?"
  This is the strongest part of your friend's critique. If we drop the strict bar of sufficiency, does the floodgates open? Can I say "The color of King George's socks caused the Industrial Revolution"?

  No. Rejecting (5) does not mean abandoning rigor. It shifts the burden of proof from **Logical Necessity** to **Mechanistic Plausibility.** Three constraints stop "anything" from counting as an explanation:

  **A. The Difference-Making Constraint (Counterfactuals)**
  To explain why Britain *rather than* China, the factor must make a difference in the specific comparison.
  *   *Test:* If we swap Britain's coal deposits with China's (keeping everything else the same), does the probability of industrialization change?
  *   If the factor exists in both places (e.g., "merchant culture"), it fails the contrastive test. It might be a background condition, but it doesn't explain the *divergence*.
  *   This addresses your friend's add-on about the Netherlands. If you ask "Why Britain not Netherlands?", high wages might not explain it (both had high wages). If you ask "Why Britain not China?", high wages might explain it (China had low wages). The explanation is relative to the **contrast class**.

  **B. The Mechanism Constraint**
  You must be able to describe *how* the factor produces the effect.
  *   "Coal caused the IR" is weak.
  *   "Coal was located near water transport and iron deposits, lowering the cost of steam engines, which made pumping water out of mines profitable, which increased coal supply..." is a **causal mechanism**.
  *   Random correlations (sock color) fail because there is no plausible mechanism linking them to steam engines.

  **C. Conjunctural Robustness**
  Historical causes are rarely single factors; they are **interactions**.
  *   Your friend's Premise (2) attacks single factors ("Coal existed elsewhere").
  *   The rebuttal is that the *combination* is the cause. Britain had Coal + High Wages + Property Rights + Fragmented States. China had Coal + Low Wages + Strong State.
  *   The explanation lies in the **configuration**, not the isolated variable. This prevents "anything" from explaining it because the specific configuration is rare, even if individual ingredients are common.

  ### 4. The Cost: What do you lose by rejecting (5)?
  You asked what the price is. It is significant, and you should concede this to your friend to show good faith.

  1.  **You lose Certainty:** You cannot say "X caused Y" with the same confidence as "Force = Mass × Acceleration." You can only say "X made Y significantly more likely, given the context." History becomes probabilistic, not deterministic.
  2.  **You lose Simplicity:** You cannot point to one "silver bullet" (e.g., "It was just coal!" or "It was just culture!"). You must accept **equifinality** (different paths could have led to the same result) and **multicausality** (many factors interacting).
  3.  **You accept Conjecture:** Since we cannot run controlled experiments on 18th-century China, our counterfactuals ("What if China had coal?") are inherently speculative. We are building models, not proving theorems.

  ### 5. How to Refute the Friend (Summary)
  Here is the script for your rebuttal:

  1.  **Concede (2) and (3):** Agree that no *single* factor was sufficient. That is standard historical consensus.
  2.  **Reject (5):** Point out that this definition of explanation would also eliminate cancer research, climate science, and accident investigation. We explain singular events via **mechanisms and probability**, not universal laws.
  3.  **Reframe the Question:** The question isn't "What guaranteed the IR in Britain?" It is "What factors raised the probability of the IR in Britain relative to China?"
  4.  **Address the Contrast:** Acknowledge his point about the Netherlands. Admit that "Why Britain not China" and "Why Britain not Netherlands" are different questions requiring different factors. That doesn't make the question fake; it makes the explanation **context-sensitive**.
  5.  **The "Anything Goes" Defense:** Explain that factors are constrained by **mechanism** (how it works) and **counterfactual dependence** (would the outcome change if this factor changed?). This filters out the noise.

  ### Verdict
  Your friend is treating history like physics. If history were physics, he would be right. But history is a **complex adaptive system**. In complex systems, causes are probabilistic, conjunctural, and path-dependent.

  Rejecting (5) costs you the comfort of certainty, but it saves you from the absurdity of claiming we can understand nothing about the past. You can explain the Great Divergence without claiming the Industrial Revolution was inevitable.
