  ***

  ### Section II: The Specifications of Success in the Debunking Debate

  The stagnation in the literature on Evolutionary Debunking Arguments (EDAs) is not merely a result of stubbornness, but of a category error regarding the goals of the debate. Proponents of EDAs (like Street and Joyce) and their respondents (like Enoch and Vavova) often argue past one another because they are grading responses against different specifications. To clarify the dialectic, we must explicitly enumerate the desiderata for an adequate response. These requirements fall into two categories: *structural* desiderata (necessary for any coherent epistemic defense) and *substantive* desiderata (commitments specific to preserving moral realism).

  #### A. The Desiderata

  **1. The Non-Accidentality Condition (Structural)**
  *   **Requirement:** The response must explain how the correlation between our evolved moral beliefs and the moral truth (if it exists) is non-accidental.
  *   **Motivation:** This is the core epistemic worry of the EDA. If evolution selected for beliefs that enhance fitness regardless of their truth, then holding a true moral belief is akin to guessing the outcome of a coin flip correctly. Without a mechanism explaining this correlation, the belief is undermined by epistemic luck. Any response that leaves the correlation unexplained fails to address the skeptic's primary challenge.

  **2. The Discrimination Constraint (Structural)**
  *   **Requirement:** The strategy used to save moral beliefs must not equally save clearly unreliable belief-forming processes (e.g., racist ideologies or flat-earth theories that might also have evolutionary or psychological explanations).
  *   **Motivation:** If the defense of morality relies on a principle like "beliefs with evolutionary explanations are justified," it overgeneralizes. We intuitively distinguish between adaptive beliefs that track truth (e.g., predator avoidance) and adaptive beliefs that are merely useful fictions (e.g., out-group hostility). A successful response must provide a principled basis for distinguishing morality from these "bad" cases, or else it renders the concept of debunking vacuous.

  **3. The Domain-Parity Check (Structural)**
  *   **Requirement:** The response must account for the disanalogy (or lack thereof) between morality and "safe" domains like mathematics or logic.
  *   **Motivation:** Debunkers argue that morality is vulnerable because moral facts are causally inert. Defenders often retort that math faces the same issue. A successful response cannot simply assert morality is like math; it must explain *why* math survives the evolutionary critique (e.g., via indispensability or conceptual necessity) and demonstrate that morality shares those specific survival traits. If it fails to do this, it leaves morality as an outlier without justification.

  **4. The Non-Circularity Requirement (Structural)**
  *   **Requirement:** The explanation for the reliability of moral faculties cannot presuppose the truth of the very moral beliefs being scrutinized.
  *   **Motivation:** This is the "bootstrapping" objection. If I justify my belief that "suffering is bad" by arguing that "my faculties track the truth that suffering is bad," I am using the contested belief to validate the faculty that produced it. While some circularity may be unavoidable in foundational epistemology, a response that relies entirely on substantive moral premises to prove moral reliability begs the question against the debunker.

  **5. The Realist Vindication Condition (Substantive/Realist-Specific)**
  *   **Requirement:** The response must preserve the existence of stance-independent moral facts.
  *   **Motivation:** *Note: This is not a neutral requirement.* For the moral realist, a response that saves justification by abandoning mind-independent truth (e.g., by moving to constructivism) is a surrender, not a victory. However, for the antirealist, this condition is irrelevant. Including this in the "general spec" is a primary source of the literature's impasse; realists treat it as non-negotiable, while debunkers treat it as the very thing to be discarded.

  #### B. Incompatibility Claims and Tensions

  The reason the debate is stuck is that satisfying these desiderata jointly appears impossible. Specifically, there is a tension between **The Non-Accidentality Condition** and **The Non-Circularity Requirement**.

  To explain *why* evolution tracked moral truth (Non-Accidentality), one typically needs to posit a "third factor" (e.g., survival is good) or a pre-established harmony. However, positing such a link often requires assuming that moral facts have a specific nature that allows them to be tracked (e.g., that they are natural properties or necessarily connected to fitness). This risks violating Non-Circularity, as one is assuming a substantive moral metaphysics to prove moral epistemology.

  Furthermore, there is a tension between **The Discrimination Constraint** and **The Domain-Parity Check**. If you argue morality is safe because it is like math (Parity), you risk failing Discrimination if math itself is vulnerable to evolutionary explanation. If you argue morality is unique (to satisfy Discrimination), you must explain why evolution tracks moral truths but not other adaptive falsehoods, which returns you to the Non-Accidentality problem.

  **Classification of Requirements:**
  *   **Non-Negotiable (Dialectically Necessary):** 1, 2, 3, 4. Without these, the response fails to engage the epistemic challenge.
  *   **Camp-Specific (Substantive):** 5. Demanding this turns the paper into a defense of realism rather than a response to the EDA. A truly neutral response might satisfy 1–4 by conceding that realism is false but normativity remains (the antirealist route).

  #### C. Scorecard of Main Response Types

  **Third-Factor Replies (e.g., Enoch)**
  *   *Performance:* Satisfies Non-Accidentality by positing a common cause (e.g., survival) linking truth and belief, but struggles with Non-Circularity, as the "third factor" is often a substantive moral claim (e.g., "survival is good") that the debunker does not accept.
  *   *Verdict:* High realist vindication, high circularity risk.

  **Companion-in-Guilt Arguments (e.g., Math/Logic Parity)**
  *   *Performance:* Satisfies Domain-Parity by leveling the playing field, but risks failing the Discrimination Constraint if the debunker is willing to "burn the house down" and skepticism about math is treated as a *reductio* rather than a concession.
  *   *Verdict:* Good defensive parity, but leaves the status of all abstract knowledge precarious.

  **Antirealist/Constructivist Escape (e.g., Street)**
  *   *Performance:* Satisfies Non-Circularity and Discrimination easily by denying stance-independent truth, but explicitly fails the Realist Vindication Condition, which realists view as a fatal concession rather than a solution.
  *   *Verdict:* Epistemically clean, metaphysically revisionary.

  ***

  ### Commentary on the Draft (For your use)

  1.  **The "Spec Mismatch" Thesis:** I framed Desideratum #5 explicitly as "Camp-Specific." This supports your thesis that the literature is stuck: Realists treat #5 as part of the definition of "success," while Debunkers treat satisfying #1–4 *without* #5 as the victory condition.
  2.  **The Tension:** I highlighted the tension between explaining the link (Non-Accidentality) and not assuming the link exists (Non-Circularity). This is the "real action" you asked for. It suggests that any response that is epistemically robust (explains the link) will look metaphysically question-begging, and any response that is metaphysically neutral will look epistemically weak.
  3.  **The Scorecard:** Kept to two sentences per entry as requested, focusing on which desiderata they pass/fail.
  4.  **Tone:** The language is technical enough for a seminar paper ("stance-independent," "epistemic luck," "dialectically necessary") but clear enough to be argued rather than announced.

