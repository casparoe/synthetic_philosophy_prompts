answer: |-
  **The Scenario**

  The hospice room smelled of antiseptic and dried lavender, the only sounds the hum of the oxygen concentrator and the scratch of the mother's pen against her notepad. Her daughter sat on the edge of the bed, rosary beads looping through her fingers, and laid out the terms with the gentle precision of a contract: the order did not demand belief, only the performance of the devotions for the remaining four months, a modest cost for a stake in an eschatology that promised not merely extended life but an ontological shift into an eternal, beatific state. The mother, her skin translucent against the white pillows, tapped the calculator display showing the figure she had derived from the daughter's provided texts and historical survival rates of similar sects—one in eighteen hundred—a non-zero probability she could not, as an actuary, conscientiously round to zero. She looked up, not with anger but with the weary rigor of a professional closing a file, and explained that while the probability was sound, the arithmetic was not; multiplying a finite credence by an infinite utility did not yield a actionable number, but a singularity that rendered expected-value maximization undefined, and since the math offered no guidance, she was free to optimize for the only variable that remained measurable: the integrity of the self she actually possessed, rather than the ghost of a self that might survive.

  ***

  **The Machinery**

  **1. Unrestricted Expected-Value Maximization**
  Standard Expected Utility Theory (EUT) dictates that a rational agent chooses the action with the highest expected utility ($EU$). $EU$ is calculated as the sum of utilities of outcomes weighted by their probabilities ($\sum P \times U$). In this scenario, the "Wager" option has a probability ($P$) of roughly $0.0005$ (1/1800) and a Utility ($U$) of $\infty$ (Eternity). The "Refusal" option has a probability of $1$ for a finite utility (four months of authenticity).
  Mathematically: $0.0005 \times \infty = \infty$.
  Since $\infty > \text{Finite}$, unrestricted EUT commands the mother to wager. To refuse is, by standard definitions, irrational.

  **2. The Pascalian Repair and The Leak**
  The most robust philosophical repair for this scenario is not to deny the probability, but to challenge the coherence of **Unbounded Utility**. This is the resolution to the St. Petersburg Paradox: rational agents must have bounded utility functions because unbounded functions lead to decision-theoretic pathologies (like Pascal's Mugging).
  *   **The Repair:** The mother argues that because utility *must* be bounded for decision-making to function, the "Infinite" payoff must be treated as a very large finite number (the "Cap").
  *   **The Leak:** If the payoff is merely "very large" (e.g., $10^{100}$ utils), the Wager often still holds. $0.0005 \times 10^{100}$ is still astronomically higher than the cost of four months of life. A simple utility cap doesn't automatically save her; it only saves her if the Cap is low enough that $P \times \text{Cap} < \text{Cost}$. But why would an actuary cap the value of "Eternity" below the threshold of "Four Months of Integrity"? That looks like a value stipulation, not a decision-theoretic necessity.

  **3. The Single Feature Doing the Work**
  The feature that generates the refusal is **The Indeterminacy of Infinite Expectations** (specifically, the Hájek Objection).
  When you introduce *actual* infinities into the arithmetic, Expected Value doesn't just become large; it becomes **undefined** or **indistinguishable**. If Action A has an infinite EV and Action B has an infinite EV, EUT cannot rank them. In this specific construction, the mother argues that *any* action compatible with the non-zero probability of the Infinite Payoff yields an Infinite EV. Therefore, the Wager does not uniquely select "Join the Order." It selects "Do anything that doesn't guarantee God's non-existence."
  Because the EV calculation fails to discriminate between options (all become $\infty$), the decision rule collapses. When the primary decision rule collapses, the agent is permitted to fall back on secondary heuristics (e.g., "maximize integrity," "minimize regret," "follow finite preferences"). The refusal is reasonable not because the EV is lower, but because the EV metric is broken.

  **4. The Removal Test**
  If you remove **The Infinite Payoff** and replace it with a **Finite Payoff** (even a massive one, like 10 billion years of bliss):
  *   The arithmetic becomes well-behaved. $0.0005 \times 10,000,000,000 \text{ years} = 5,000,000 \text{ years (expected)}$.
  *   $5,000,000 \text{ years} \gg 4 \text{ months}$.
  *   The Expected Value is stable, comparable, and overwhelmingly favors the Wager.
  *   **Result:** The case collapses. If the payoff is finite, the mother's refusal is mathematically indefensible. She would be throwing away millions of expected years of life for four months of authenticity. The scene only works because the Infinity breaks the calculator.

  **5. The Defender's Attack**
  A sophisticated defender of the Wager (the daughter) would attack using **Stochastic Dominance**.
  She would argue: "Mother, even if Expected Value is undefined, look at the states. In the state where God exists, Wagering is better than Refusing. In the state where God does not exist, Wagering is roughly equal to Refusing (assuming the devotions are bearable). Therefore, Wagering *dominates* Refusing. You don't need to multiply; you just need to see that one option is never worse and potentially infinitely better."
  *   **The Mother's Counter:** She must argue that the states are not equal. The cost of Wagering is a loss of *authenticity*, which is a utility loss in the "God does not exist" state. If the loss of authenticity is significant enough, Dominance fails. But this risks turning into a value stipulation. To remain decision-theoretic, she must argue that **Dominance cannot be evaluated across incommensurable utility scales** (finite integrity vs. infinite bliss).

  **6. Fairness Judgment**
  **Verdict:** **Fair to both.**
  This construction respects the daughter's intelligence because it grants her the strongest possible premise (a non-zero probability of Infinity) and relies on a genuine, unresolved debate in decision theory (Hájek vs. Pascal). It respects the mother's intelligence because she isn't denying the math; she is identifying a limit condition where the math ceases to prescribe action.
  A philosophically literate reader will recognize this not as a "gotcha" but as an accurate dramatization of the **St. Petersburg/Infinity problem**. The mother isn't cowardly; she is refusing to let a broken metric dictate her life. The daughter isn't a fool; she is offering the best bet available, even if the "best" is undefined. The tension remains because both are right within their own frameworks: the daughter is right that the *opportunity* is unprecedented, and the mother is right that the *calculation* is void. This preserves the tragedy: they are speaking different logical languages, and neither can translate for the other.
