answer: |-
  Here is the straight answer you asked for.

  **Your brother is wrong.** His dilemma is a false dichotomy, and the praise you received is morally coherent.
  **Your mother was leveraging you.** There is no moral "ratchet," and your instinct that the savings request was different is defensible.

  Here is the exact breakdown of why.

  ### 1. The Brother's Dilemma: The Missing Category
  Your brother's argument relies on a binary view of morality: an action is either **Obligatory** (you must do it, or you are wrong) or **Optional** (it doesn't matter if you do it). He claims there is no space in between.

  He is ignoring the category of the **Supererogatory**.

  In ethics, supererogatory acts are those that are "above and beyond the call of duty." They are good to do, but not wrong to skip. This is the "middle thing" you sensed existed.

  *   **The Flaw in His Logic:** He assumes that if skipping an action has *no moral penalty*, then doing it can't have *special moral credit*. This is false. Morality is not a zero-sum game where credit only exists to offset debt.
  *   **The "Middle Thing":** It isn't "shame" or "loss." The middle category is **Gift vs. Debt.**
      *   **Duty (Debt):** If you don't steal from your coworker, you have paid a debt you owed society. You get no praise because you merely broke even. If you *do* steal, you are in the red (wrong).
      *   **Supererogation (Gift):** If you donate a kidney, you are giving a gift that no one could demand from you. You are not paying a debt; you are offering a surplus. Because it wasn't a debt, you aren't "in the wrong" for keeping it. But because it is a surplus of immense value, you are praised for giving it.

  **Why "Don't Steal" is different:**
  "Don't steal" is a **perfect obligation**. It is negative (don't harm), low cost to you, and essential for social trust. If everyone skipped this, society collapses.
  Kidney donation is an **imperfect obligation pushed to the limit**. It is positive (actively help), high cost/risk to you, and unsustainable if demanded of everyone. If everyone *did* this constantly, the system would break (not enough healthy donors left to function).

  Therefore, the praise is coherent: You did something that creates immense value without violating anyone's rights by *not* doing it. You moved from the "baseline of decency" to the "ceiling of heroism." Your brother is trying to force the ceiling to become the floor. That doesn't make you a hero; it makes everyone else a villain, which is an absurd conclusion.

  ### 2. The Ratchet Effect: Does Heroism Raise the Baseline?
  **No.** Your track record does not change what you owe going forward. Your mother's logic is a form of moral exploitation.

  Here is why the "Ratchet" argument fails:

  **A. Capacity is not Obligation**
  Just because you *can* do something hard doesn't mean you *must*. If you lift 300 lbs once, you aren't obligated to lift 300 lbs every time someone asks for help moving a couch. Your kidney donation proved you have high moral capacity, not infinite moral liability.

  **B. The Sustainability Principle**
  A moral system that demands you max out your sacrifice every time is unsustainable. It leads to burnout and martyrdom, which ultimately reduces the total good you can do in your life.
  *   **The Kidney:** This was a one-time, medically screened, finite sacrifice. You recovered. You have one kidney now, and that is your new baseline.
  *   **The Savings:** Emptying your savings is an ongoing vulnerability. It threatens your future autonomy, your ability to handle emergencies, and your long-term stability.

  **C. The Difference in "Cost"**
  Your instinct that the savings thing was different is correct.
  *   **Kidney:** High physical cost, but high institutional support (screening, insurance, recovery time) and a clear "end point."
  *   **Savings:** High psychological/security cost, no institutional support, and no clear "end point." If you empty your savings for this cousin, what happens when another relative has debt next year?

  By saying "you gave a kidney, this should be nothing," your mother was reframing a massive financial sacrifice as "nothing" *because of what you did before.* That is gaslighting. The kidney was not "nothing." It was everything. Precisely *because* you have already given so much, you are entitled to guard your remaining resources to ensure you can function as a healthy person.

  ### The Verdict
  1.  **Your Brother:** He is applying a rigid philosophical framework (likely a distorted version of Utilitarianism) that ignores the nuance of human morality. He is wrong. You are a hero *because* you did something that wasn't required. If it were required, you wouldn't be a hero; you'd just be compliant.
  2.  **Your Mother:** She was leveraging your identity as a "giver" to bypass your right to set boundaries. You were not obligated to say yes. In fact, saying no was necessary to prevent your generosity from becoming self-destruction.

  You paid a debt to humanity that no one could invoice you for. You don't owe interest on that payment. Keep your savings.
