      *   *The "Actor" Claim:* When a historian says "the volcano acted," they mean the volcanic aerosol loading was a high-amplitude, high-frequency *exogenous forcing* that pushed the socio-political system across a stability threshold (bifurcation). It wasn't just a parameter drift; it was a shock.
