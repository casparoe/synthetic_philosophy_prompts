      *   *Agent/Actor:* In DS, nothing has "agency" in the human sense. Everything follows equations. So "agent" must mean "variable with significant causal weight." Is it a *forcing* (external parameter) or a *state variable* (internal DOF)?
      *   *Determinism:* In DS, everything is deterministic (usually). But in history, "determinism" means "human variables are slaved to environmental variables." i.e., $H(t) = f(E(t))$ with no feedback $E(t) = g(H(t))$.
      *   *Contingency:* Sensitive dependence on initial conditions (SDIC)? Or bifurcation points where small perturbations select the branch?
