      *   *McNeill:* Microparasites and Macroparasites are two coupled subsystems. If you treat one as external forcing on the other, you lose the co-evolution (feedback loops).
      *   *Contingency:* This is path dependence and SDIC. The "Year Without a Summer" didn't guarantee riots; it pushed a precarious system into a different basin of attraction.

