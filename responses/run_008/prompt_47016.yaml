  The term most susceptible to revision is the interpretation of skeletal trauma rates. The specific evidence that would most shift this probability is a **large-scale, meta-analytic study of skeletal remains controlling for preservation bias and site selection effects.** Currently, many high-violence estimates come from sites specifically selected because they showed fortifications or mass graves. A systematic survey of random burial sites in pre-state regions (e.g., using isotopic analysis to distinguish local vs. non-local trauma) that revealed significantly lower rates of interpersonal violence would force a downward revision of $P(a)$, thereby lowering my overall credence in the claim.

