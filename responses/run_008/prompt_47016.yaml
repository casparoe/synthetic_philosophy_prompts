  *   **Broad Definition (Including Structural Harms):** Credence **~0.65**.
      *   *Reasoning:* If we include deaths from preventable famine under extractive institutions or mortality due to systemic neglect as "violence," the modern advantage narrows considerably. While pre-state societies also suffered high environmental mortality, modern states have the capacity for violence-at-scale via policy (e.g., colonial famines) that rivals direct combat.

  The gap between 0.82 and 0.65 indicates that while the *facts* of direct violence support the claim robustly, a significant portion of public disagreement on this topic stems from the *definition* of harm rather than the archaeological record.
