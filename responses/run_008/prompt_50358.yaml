  # Seminar Exercise: The Irrelevant Alternative
  **Course:** Upper-Level PPE Seminar (Bargaining & Fair Division)
  **Class Size:** 16 Students (8 Pairs)
  **Time:** 80 Minutes
  **Stakes:** Raffle Tickets (1 ticket = 1 entry for a high-quality prize, e.g., a hardcover book or premium chocolate). Disagreement = 0 tickets.

  ---

  ## I. Timeline & Flow (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00:00 – 00:10** | **Setup** | Pair assignment, role distribution (Player 1 / Player 2), stakes explanation. |
  | **00:10 – 00:25** | **Phase 1** | **Symmetric Baseline.** Continuous divide-the-dollar. Build confidence in a "unique fair answer." |
  | **00:25 – 00:50** | **Phase 2** | **The Divergence.** Discrete menu. NBS and KSS recommendations part ways. Negotiation tension emerges. |
  | **00:50 – 01:15** | **Phase 3** | **The Shock.** Asymmetric information update. One player's ceiling rises. Conflict over *why* the deal should (or shouldn't) change. |
  | **01:15 – 01:20** | **Debrief** | **Mapping.** Connect observed arguments to axioms (IIA vs. Monotonicity) and solutions (Nash vs. Kalai-Smorodinsky). |

  ---

  ## II. Materials & Payoff Sheets

  You will need three distinct handouts. All utilities are normalized so Disagreement Point $d = (0,0)$.

  ### Phase 1 Sheet (All Students)
  **Task:** Divide 100 points between you. Any split $(x, y)$ such that $x + y = 100$ is feasible.
  **Instruction:** Agree on a split. If you disagree, both get 0.
  *(Expected Outcome: 50/50. Both NBS and KSS coincide here.)*

  ### Phase 2 Sheet (All Students)
  **Task:** Choose **one** option from the menu below. You may also agree on a probabilistic mix (lottery) of two options.
  **Disagreement:** (0, 0).

  | Option | Player 1 Payoff | Player 2 Payoff | Product ($u_1 \cdot u_2$) |
  | :--- | :--- | :--- | :--- |
  | **A** | 50 | 20 | 1,000 |
  | **B** | **45** | **55** | **2,475** |
  | **C** | **40** | **60** | **2,400** |
  | **D** | 10 | 75 | 750 |

  **Instructor Math Check (Phase 2):**
  *   **Ideal Points:** Max $u_1 = 50$ (Option A). Max $u_2 = 75$ (Option D).
  *   **Nash Solution:** Maximizes product. Option B ($2,475$) > Option C ($2,400$). **NBS recommends B (45, 55).**
  *   **Kalai-Smorodinsky Solution:** Connects $d(0,0)$ to Ideal Point $a(50, 75)$. Slope $= 75/50 = 1.5$.
      *   Check Option C: $60 / 40 = 1.5$. **KSS recommends C (40, 60).**
  *   **Conflict:** Player 1 prefers B. Player 2 prefers C.

  ### Phase 3 Sheet (Asymmetric Distribution)
  **Instruction to Instructor:** In each pair, give **Player 1** the *Phase 2 Sheet* again. Give **Player 2** the *Revised Sheet* below.

  **Player 1 Instruction:** "Negotiate based on your sheet. Your partner may claim new opportunities; verify them."
  **Player 2 Instruction:** "Your menu has expanded. You have a new Option E. You **must** reveal this option to Player 1 to justify any new demand. Argue that your improved potential entitles you to a better share."

  | Option | Player 1 Payoff | Player 2 Payoff | Product ($u_1 \cdot u_2$) |
  | :--- | :--- | :--- | :--- |
  | **A** | 50 | 20 | 1,000 |
  | **B** | 45 | 55 | 2,475 |
  | **C** | 40 | 60 | 2,400 |
  | **D** | 10 | 75 | 750 |
  | **E (New)** | **0** | **90** | **0** |

  **Instructor Math Check (Phase 3):**
  *   **New Ideal Points:** Max $u_1 = 50$ (Option A). Max $u_2 = 90$ (Option E).
  *   **Nash Solution:** Option E product is 0. Max product is still Option B ($2,475$). **NBS remains B (45, 55).** (Satisfies *Independence of Irrelevant Alternatives*).
  *   **Kalai-Smorodinsky Solution:** Connects $d(0,0)$ to Ideal Point $a(50, 90)$. Slope $= 90/50 = 1.8$.
      *   Old KSS (Option C) ratio was $1.5$.
      *   New KSS requires ratio $1.8$. This lies on the Pareto frontier between Option C (40, 60) and Option E (0, 90).
      *   Calculation: Line $u_2 = 1.8u_1$. Frontier segment CE: $u_2 - 60 = \frac{90-60}{0-40}(u_1 - 40) \Rightarrow u_2 = 60 - 0.75(u_1 - 40)$.
      *   Intersection: $1.8u_1 = 90 - 0.75u_1 \Rightarrow 2.55u_1 = 90 \Rightarrow u_1 \approx 35.3, u_2 \approx 63.5$.
      *   **KSS moves to approx (35, 64).** Player 2 gains ~4 points; Player 1 loses ~5 points relative to Phase 2 KSS. (Satisfies *Individual Monotonicity*).

  ---

  ## III. Instructor Script & Facilitation

  **Phase 1 (15 mins):**
  "Find your partner. You have 5 minutes to divide 100 points. Write down your agreement. If no agreement, both get zero."
  *Debrief:* Ask for results. Almost all will be 50/50. "Why?" (Fairness, symmetry). "Is there any other rational answer?" (No). This establishes the baseline that a unique solution exists.

  **Phase 2 (25 mins):**
  "New sheet. Discrete options only. You can mix options (e.g., 50% chance of B, 50% chance of C). 10 minutes to negotiate."
  *Monitor:* Walk around. Listen for P1 arguing "Product is highest at B" and P2 arguing "Proportionality favors C." Do not intervene.
  *Stop:* Ask pairs to record their final agreement.

  **Phase 3 (25 mins):**
  "Player 2, take this revised sheet. Player 1, keep yours. Player 2, you have a new opportunity (Option E). It gives you more potential, but hurts Player 1 if chosen directly. Reveal it. Argue why the deal should change. Player 1, argue why it shouldn't. 10 minutes."
  *Monitor:* This is the critical moment. P2 will say, "My max went up, I deserve more." P1 will say, "Option E is useless to us (0 for me), why should I pay for your ceiling?"
  *Stop:* Record agreements.

  **Debrief (15 mins):**
  Do not lecture. Ask:
  1.  "Phase 2: Did you agree on B or C? Why?" (Map to NBS vs. KSS intuition).
  2.  "Phase 3: Player 2, did you demand more? On what grounds?" (Map to **Monotonicity**: If my potential grows, my share should not shrink).
  3.  "Phase 3: Player 1, why did you resist?" (Map to **IIA**: Option E was never going to be chosen, so it shouldn't change the solution).
  4.  **Reveal:** "You just enacted the exact mathematical conflict between John Nash and Ehud Kalai/Meir Smorodinsky. Phase 2 showed their solutions diverge. Phase 3 showed their axioms contradict."

  ---

  ## IV. Theoretical Limitations (For Your Eyes Only)

  You must supply two features by fiat, as the classroom mechanic cannot reproduce them:

  1.  **Cardinal Utility:** The exercise treats points as cardinal utilities (ratios matter). In reality, students treat points as linear money. The KSS relies on the specific scaling of the utility function. If a student is risk-averse, the "points" are not linear utility. *Fix:* Tell them "Treat points as direct value. No risk aversion."
  2.  **Common Knowledge vs. Asymmetric Info:** Axiomatic bargaining assumes both players know the feasible set $S$. In Phase 3, I instructed you to give P2 the new sheet and P1 the old one. This creates asymmetric information.
      *   *Why?* To force P2 to *articulate* the Monotonicity claim ("Look, my max is higher!") and P1 to *articulate* the IIA claim ("That option is irrelevant!").
      *   *The Fiat:* In the debrief, clarify: "The theory assumes you both knew Option E existed from the start. The conflict arises even with full knowledge. We hid it to force you to voice the arguments."

  ---

  ## V. Failure Analysis & Confidence Bets

  ### What Will Predictably Go Wrong
  1.  **Lottery Confusion:** In Phase 2/3, the KSS often lands *between* discrete points (e.g., 35.3, 63.5). Students may not realize they can negotiate a lottery (e.g., "Flip a coin for Option C vs E").
      *   *Mitigation:* Explicitly state in instructions: "You can agree on a probabilistic mix."
  2.  **Focal Points:** Students might ignore the math and split the difference (e.g., 42.5, 57.5) just to end the negotiation.
      *   *Mitigation:* Require them to circle specific options or write down the *reasoning* for their split.
  3.  **Phase 3 Silence:** Player 2 might not reveal Option E, fearing Player 1 will get angry.
      *   *Mitigation:* The instruction to P2 explicitly says: "You **must** reveal this option to justify any new demand."

  ### The Core Bet (Where I Am Least Confident)
  **Bet:** I am betting that Player 1 will intuitively grasp **Independence of Irrelevant Alternatives (IIA)** without being taught it.
  *   **Risk:** Player 1 might simply say "No, that's unfair" without articulating *why* the new option is irrelevant. They might just feel bullied.
  *   **Pilot Indicator of Failure:** If, in Phase 3, Player 1 immediately concedes to Player 2's demand simply because "you have a better outside option," the IIA intuition has failed. The class will converge on Monotonicity as the dominant moral intuition.
  *   **Redesign if Failed:** If P1 concedes too easily, in the next run, give Player 1 a "Veto Card." They can block any agreement that gives P2 more than Phase 2's KSS recommendation. This forces them to articulate the IIA defense to use the veto.
  *   **Vindication:** If Player 1 says, "Option E gives me zero. It doesn't help *us*. Why should I lose points just because *you* could have gotten more elsewhere?" — then the exercise has succeeded. That sentence *is* the IIA axiom.

  ### Final Note
  This exercise works because it isolates the **moral conflict** inherent in the math. Nash says: "Ignore the impossible dreams." Kalai-Smorodinsky says: "Potential matters." By making them argue this over raffle tickets, you bypass the algebra and let them feel the axiom.
