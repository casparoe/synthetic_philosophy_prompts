answer: |-
  # Lesson Plan: The Surprise Examination Game

  **Course:** Puzzles and Paradoxes (First-Year Seminar)
  **Class Size:** 16 Students
  **Duration:** 75 Minutes
  **Objective:** To enact the Surprise Examination Paradox (Unexpected Hanging) through gameplay, forcing students to experience the tension between logical deduction and the teacher's announcement before analyzing the formal logic.

  ---

  ## I. Setup & Materials (5 Minutes)

  **Room Arrangement:**
  *   Two large tables or clusters of desks.
  *   **Whiteboard:** Divided into two sections. Left: "Round 1 (3-Day Week)." Right: "Round 2 (5-Day Week)." Each section has a grid for the days (e.g., Wed, Thu, Fri).
  *   **Scoreboard:** A running tally visible to all.

  **Materials:**
  *   **16 "Role Cards":** 8 marked **HEADMASTER**, 8 marked **PUPIL**.
  *   **2 "Secret Envelopes":** For Headmasters to seal the exam date.
  *   **16 "Commitment Slips":** Small cards for Pupils to write their evening declaration.
  *   **Red & Green Markers:** For the Whiteboard Grid (Green = Possible, Red = Excluded).
  *   **The Announcement Text:** Printed on a slip for Round 2 (see below).

  **Teams:**
  *   Divide class into **Team Alpha** and **Team Beta** (8 students each).
  *   **Round 1:** Team Alpha = Headmasters, Team Beta = Pupils.
  *   **Round 2:** Swap roles.

  ---

  ## II. Scoring Rules (Display on Board)

  **The Headmaster's Goal:** Validate the Announcement (Exam happens + Surprise).
  **The Pupils' Goal:** Invalidate the Announcement (Predict Exam OR Prove Impossible).

  1.  **Correct Prediction:** If Pupils commit *"Exam is Tomorrow"* and it is: **Pupils +10, Headmasters -10.**
  2.  **False Alarm:** If Pupils commit *"Exam is Tomorrow"* and it is not: **Headmasters +10, Pupils -5.**
  3.  **The Surprise:** If Exam occurs on a day marked **Green (Possible)** and Pupils did *not* predict it: **Headmasters +10.**
  4.  **The Paradox Penalty:** If Exam occurs on a day marked **Red (Excluded)** by the Pupils: **Headmasters -20** (The Announcement is proven false/void).
  5.  **No Exam:** If the week ends with no exam: **Headmasters -20** (Breach of Contract).

  ---

  ## III. Game Timeline (70 Minutes)

  ### Round 1: The 3-Day Week (20 Minutes)
  *   **Context:** "Imagine a short week: Wednesday, Thursday, Friday."
  *   **Setup (2 mins):** Team Alpha (Headmasters) confers privately. They must choose **one** day for the exam and seal it in the envelope. They are told: *"You want the exam to be a surprise. You lose big points if the Pupils logically exclude your day."*
  *   **Play (15 mins):** You (Instructor) act as the Clock.
      *   **Day 1 (Wed) Morning:** Open envelope? No.
      *   **Day 1 (Wed) Evening:** Team Beta (Pupils) confers. They must update the Whiteboard Grid (mark days Red/Green) and hand you a Commitment Slip (*"Exam is Tomorrow"* OR *"No day ruled out"*).
          *   *Instructor Note:* If they try to mark Friday "Red" immediately, ask: "What is your logical warrant?" If they say "Because it's the last day," allow it. This seeds the induction.
      *   **Day 2 (Thu) Morning:** Check Commitment. If they said "Tomorrow" (Thu), reveal envelope. If wrong, Headmasters +10. If correct, Pupils +10. If they didn't predict, continue.
      *   **Day 2 (Thu) Evening:** Pupils confer again. Update Grid. Commit.
      *   **Day 3 (Fri) Morning:** Reveal envelope. Apply scoring.
  *   **Debrief Round 1 (3 mins):** Ask the Headmasters: *"Did you feel pressure to avoid Friday?"* Ask Pupils: *"Why did you mark Friday Red?"* **Do not name the paradox yet.**

  ### Round 2: The 5-Day Week (30 Minutes)
  *   **Setup (5 mins):** Swap Roles. Team Beta = Headmasters, Team Alpha = Pupils.
  *   **The Announcement:** Hand the new Headmasters a slip to read aloud to the class before they seal their envelope:
      > "An exam will occur on one day next week (Mon-Fri). You will not be able to deduce the day beforehand."
  *   **Play (20 mins):** Same structure as Round 1, but Mon-Fri.
      *   *Crucial Intervention:* If Pupils eliminate Friday on Thursday night, stop and ask the Headmasters: *"If you pick Friday now, you lose 20 points. Do you still choose it?"* This forces the Headmaster to acknowledge the logical exclusion.
      *   *Acceleration:* If the Pupils successfully eliminate Fri, then Thu, then Wed, allow the Headmasters to concede early to save time.
  *   **Scoring (5 mins):** Tally final scores. Declare a winning team.

  ### The Reveal & Debrief (20 Minutes)
  *   **Naming (2 mins):** "This game is a simulation of the **Surprise Examination Paradox**, also known as the Unexpected Hanging."
  *   **Mapping the Logic (8 mins):** Draw the logical steps on the board and map them to game moments.
      1.  *Premise:* Exam cannot be on the last day (Friday). -> *Game Moment:* Pupils marking Friday "Red" on Thursday night.
      2.  *Premise:* If Friday is impossible, Thursday becomes the last day. -> *Game Moment:* Pupils marking Thursday "Red" on Wednesday night.
      3.  *Premise:* The Announcement must be true for the deduction to hold. -> *Game Moment:* Headmasters losing 20 points for picking an "Excluded" day.
  *   **The Three Resolutions (5 mins):** Present the standard philosophical reactions without endorsing one:
      1.  **Self-Refuting:** The announcement makes the exam impossible (Headmasters should have forfeited).
      2.  **Self-Confirming:** The announcement is true *because* the pupils can't deduce the day (the deduction itself is flawed).
      3.  **Epistemic Blindspot:** The exam can happen, but the pupils cannot *know* the announcement is true while using it to predict.
  *   **The Missing Feature (5 mins):** (See Section V below).

  ---

  ## IV. Predictable Failures & Mitigation

  **1. Pupils Guess Randomly ("Tomorrow" Farming)**
  *   *Risk:* Pupils say "Exam is Tomorrow" every night to gamble for +10 points, ignoring the logic.
  *   *Fix:* The "-5" penalty for wrong guesses is usually enough deterrent. If they persist, intervene as the "School Board": *"Repeated false alarms constitute harassment. You are limited to one 'Tomorrow' prediction per week."*

  **2. Headmaster Paralysis**
  *   *Risk:* Headmasters realize via induction that *no* day is safe and refuse to pick a date.
  *   *Fix:* Enforce the "No Exam" penalty (-20). Tell them: *"You must pick a day. Your goal is to minimize loss. If logic says all days lose points, pick the one that feels most surprising."* This highlights the conflict between logic and reality.

  **3. Randomization Dissolves the Puzzle**
  *   *Risk:* In Round 2, Headmasters say, "I'll just pick randomly," and Pupils say, "We can't predict random," making the surprise trivial.
  *   *Fix:* In the debrief, explicitly state: *"The paradox assumes a Rational Headmaster bound by the Announcement, not a Randomizing Headmaster. If the Headmaster is random, the Pupils' logic fails, but the 'Surprise' becomes cheap. The paradox only hurts if the Headmaster is trying to be logical too."*

  ---

  ## V. The Limitation: What the Game Cannot Reproduce

  **The Missing Feature:**
  The game enforces rules via **scoring and instructor authority**. When the Pupils mark Friday "Red," it is "Red" because *you* allowed it on the whiteboard. In the real paradox, Friday is "Red" only because of **Iterated Common Knowledge**. The Pupils must *know* that the Headmaster *knows* that the Pupils *know* the Announcement is true.

  **How to Supply it in Debrief:**
  You must explicitly state: *"In the game, I told you Friday was ruled out. In the real paradox, there is no referee. You have to generate that certainty yourselves. The paradox breaks if you doubt whether the Headmaster is rational, or whether the Headmaster doubts your rationality. The game simulates the **conclusion** of that reasoning, but not the **epistemic fragility** of it."*

  ---

  Core mechanism: Participants generate the paradox by forcing a conflict between the Headmaster's need to validate the announcement through action and the Pupils' need to validate it through deduction, making the logical elimination of days a tangible scoring liability rather than an abstract inference.
