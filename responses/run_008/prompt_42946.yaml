answer: |-
  # Activity: The Web of Zorg

  **Target:** 13 Students, 80 Minutes.
  **Goal:** Experiential demonstration of Quine's "Two Dogmas of Empiricism" (Circularity of Analyticity & Confirmation Holism).
  **Constraint:** The words "Analytic," "Synthetic," "A Priori," and "Quine" are banned until the final 20 minutes.

  ---

  ## I. Materials & Setup

  **Room Setup:**
  *   3 Tables (Groups A, B, C). 4 students per table.
  *   1 "Archivist" (The 13th student) at the front whiteboard.
  *   Facilitator floats between tables.

  **The Deck (Print 3 sets, one per group):**
  *   **10 Axiom Cards (The Belief Set):**
      *   *Type D (Definition):* "A **Glint** is by definition a **Spark** that resides in a **Vessel**."
      *   *Type D (Definition):* "All **Vessels** are **Opaque**."
      *   *Type L (Logic/Math):* "If Object X is inside Container Y, and Container Y is inside Room Z, then Object X is inside Room Z." (Transitivity of Containment)
      *   *Type L (Logic/Math):* "An object cannot be both **Red** and **Blue** all over at the same time."
      *   *Type O (Observation):* "Glints emit a hum when heated."
      *   *Type O (Observation):* "Vessels found in Sector 7 are transparent."
      *   *Type O (Observation):* "No Sparks have been observed outside a Vessel."
      *   *Type D (Definition):* "To **Reside** means to be physically contained."
      *   *Type L (Logic/Math):* "Existence is not a predicate." (Or simpler: "Nothing comes from nothing.")
      *   *Type O (Observation):* "Sector 7 is part of the Zorgian Flux."
  *   **6 Data Cards (The Anomalies):**
      *   *Report 1:* "Sensor confirms: A Glint was found floating freely in Sector 7 (No Vessel)."
      *   *Report 2:* "Sensor confirms: A Vessel in Sector 7 allowed light to pass through (Transparent)."
      *   *Report 3:* "Sensor confirms: A Glint was heated but remained silent."
      *   *Report 4:* "Sensor confirms: A Spark was found inside a Vessel, inside Room Z, but the Spark was *not* detected in Room Z." (Violates Transitivity)
      *   *Report 5:* "Sensor confirms: A Glint appeared Red and Blue simultaneously."
      *   *Report 6:* "New Linguistic Data: The native term 'Glint' is used for Sparks that *do not* reside in Vessels."
  *   **Currency:** "Coherence Tokens" (Start each group with 20).
  *   **Revision Cost Sheet:** (Posted on board)
      *   Revise Observation (Type O): Cost 1 Token.
      *   Revise Law/Logic (Type L): Cost 5 Tokens.
      *   Revise Definition (Type D): Cost 10 Tokens.
      *   *Special Rule:* If you revise a Definition, you must verbally define the term without using the term itself. If you fail, cost doubles.

  ---

  ## II. Run-of-Show

  ### 0:00 – 0:10: Setup & Rules (No Philosophy Yet)
  **Facilitator:** "You are ontological engineers for a colony in the Zorgian Flux. You have a Belief Set (the Axiom Cards). Your job is to keep the colony's worldview consistent with incoming Sensor Data.
  1.  Lay out your 10 Axioms.
  2.  I will give you a Data Card. It contradicts your Axioms.
  3.  You must restore consistency. You can discard/change an Axiom or reject the Data.
  4.  Every change costs Coherence Tokens. If you hit 0, your colony collapses into incoherence.
  5.  **The Holdout Rule:** One of you at each table is designated the 'Conservator' (assign this quietly or let them volunteer). The Conservator has one 'Come What May' token. They can refuse to revise *one specific card* forever. But the group must pay double for any other revisions required to accommodate that refusal.
  6.  The Archivist will track group scores on the board."

  ### 0:10 – 0:25: Round 1 (The Empirical Shocks)
  **Action:** Distribute Data Cards 1, 2, and 3 to all groups.
  *   *Conflict:* Glint without Vessel (Hits Def D1), Transparent Vessel (Hits Def D2), Silent Glint (Hits Obs O1).
  *   *Expected Move:* Groups will likely revise the Observations (Cost 1) or the Definitions (Cost 10).
  *   *Facilitator Intervention:* If a group revises a Definition (e.g., "Okay, a Glint doesn't need a Vessel"), stop them.
      *   **Ask:** "Why was that expensive?"
      *   **Student:** "Because it's a definition."
      *   **Ask:** "Okay, define 'Glint' now without using the word 'Glint' or 'Vessel'."
      *   **Goal:** Force them to realize they are just swapping synonyms ("A Spark that...") which relies on other definitions.
  *   **Archivist:** Record token losses.

  ### 0:25 – 0:40: Round 2 (The Logic Bomb)
  **Action:** Distribute Data Card 4 (Transitivity Failure) and 5 (Color Contradiction).
  *   *Conflict:* Object in Container in Room NOT in Room. Object is Red AND Blue.
  *   *Expected Move:* Groups will scream that Logic/Math cannot be revised. They will try to revise the Observation ("The sensor is broken").
  *   *Facilitator Intervention:** "The Sensor is verified 99.9% reliable. Rejecting the data costs 15 tokens (Labeling data 'False' is expensive). Revising Logic costs 5. Do the math."
  *   **Goal:** Force at least one group to consider revising the Logic Card (Transitivity) to save tokens. This creates the "Whoa, you can change logic?" moment.
  *   **Holdout Handling:** If the Conservator uses their 'Come What May' token on a Logic Card, the group must pay double for everything else. Let them do it. Let them run out of tokens. This demonstrates the *pragmatic cost* of dogmatism.

  ### 0:40 – 0:55: Round 3 (The Linguistic Collapse)
  **Action:** Distribute Data Card 6 (Linguistic Data).
  *   *Conflict:* Natives use 'Glint' for Sparks *not* in Vessels.
  *   *Conflict:* This directly attacks the *Definition* card from Round 1.
  *   **The Trap:** If they protected the Definition earlier, they now have to explain why the natives are "wrong" about their own word.
  *   **Facilitator Prompt:** "Group A, you said 'Glint' *means* 'In a Vessel'. The natives say 'Glint' means 'Spark'. Who is right?"
  *   **Student:** "We are, it's the definition."
  *   **Facilitator:** "On what grounds? Is it a fact about the world? Or a rule of your language? If it's a rule, can you change the rule to match the data?"
  *   **Goal:** Induce the circularity frustration. They will try to ground the definition in "meaning," but "meaning" is just another card in the web.

  ### 0:55 – 1:20: The Debrief (Naming the Beast)
  *(See Script Below)*

  ---

  ## III. Debrief Script

  **Facilitator:** "Stop. Count your tokens. Look at what you changed."

  **Phase 1: The Gradient of Revisability**
  "Group B, I saw you revise the Transitivity Card (Logic). How did that feel?"
  *   *Student:* "Wrong. Impossible. But we were out of tokens."
  "Exactly. Nothing was *immune*, but some things were *expensive*. Quine calls this the **Web of Belief**. Experience (Data) hits the edges (Observations). But if the shock is hard enough, the vibration travels to the center (Logic/Definitions). There is no hard wall, only a gradient of pragmatic cost."

  **Phase 2: The Circularity of Definition**
  "Group A, when you tried to protect the 'Glint' Definition, I asked you to define it. You said 'A Spark in a Vessel.' Then I asked what a Vessel is. You said 'An Opaque Container.' Then Data Card 2 said Vessels are Transparent. You were spinning in circles."
  "This is Quine's first attack. We try to explain **Analyticity** (truth by meaning) by using **Synonymy** (interchangeability). But how do we know two words are synonyms? Because they have the same meaning. How do we know they have the same meaning? Because they are interchangeable. It's a circle. You felt that circle when you tried to justify why the Definition Card cost 10 tokens. You had no ground to stand on except 'we decided so.'"

  **Phase 3: The Holdout & Pragmatism**
  "To the Conservators: You held a card 'Come What May.' Did the world end?"
  *   *Student:* "No, but we ran out of tokens fast."
  "Quine agrees. You *can* hold any statement true come what may. Even '2+2=5'. But you have to make drastic adjustments elsewhere in the web to keep it consistent. You chose to treat a statement as **Analytic** (immune). But that immunity wasn't magic; it was a **Pragmatic Choice**. You paid for it with Coherence Tokens elsewhere."

  **Phase 4: The Reveal**
  "The game you just played is the destruction of the **Two Dogmas of Empiricism**.
  1.  **Dogma 1:** The belief that there is a fundamental cleavage between truths that are analytic (meaning) and synthetic (fact). You found there is no cleavage, only cost.
  2.  **Dogma 2:** Reductionism. The belief that each statement can be verified/falsified on its own. You found you could only verify/falsify the *whole block* of Axioms together.
  Quine's solution? **Holism**. We navigate the web. We save the cheap statements and sacrifice the expensive ones. But 'expensive' isn't 'false' and 'cheap' isn't 'true'. It's just where we choose to stand."

  ---

  ## IV. Handling the "Come What May" Holdout
  *Scenario:* A student refuses to revise *anything*, claiming some truths are absolute.
  *Facilitator Move:* Do not argue truth. Argue **utility**.
  "Okay. You are holding 'All Vessels are Opaque' as absolutely true. Data says 'This Vessel is Transparent.' To maintain consistency without revising your Axiom, you must now claim the Data is a hallucination, the Sensor is lying, and 'Transparent' actually means 'Opaque' in this light. You have effectively isolated your web from the world. You are consistent, but you are no longer doing science. Quine says this is *allowed*, but it's pragmatically useless. In the game, this is represented by the Token Cost. You can be dogmatic, but the tax is bankruptcy."

  ---

  ## V. Structured Summary (JSON)

