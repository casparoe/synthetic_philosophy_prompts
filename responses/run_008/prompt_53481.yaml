answer: |-
  This is a classic problem in normative ethics. You're right to want to avoid population ethics (the "Repugnant Conclusion" territory); it's a black hole that sucks up all the oxygen in the room. To isolate the difference between Total Utilitarianism (TU) and Negative Utilitarianism (NU), you need a **fixed population trade-off case**.

  Here is a thought experiment designed to meet your exact specifications, followed by the breakdown you need for your meeting.

  ### The Thought Experiment: "The Migraine vs. Bliss Society"

  Imagine a society of **1,000 people**. In both worlds, everyone lives the same lifespan, nobody dies prematurely, and nobody is prevented from being born. The only difference is a societal policy regarding a neural enhancement technology.

  **World A (The Highs and Lows)**
  Everyone has access to a neural implant that provides intense, profound feelings of joy, artistic inspiration, and love. However, the technology has a side effect: it causes a severe, throbbing migraine for 1 hour every day.
  *   **Happiness:** +10 units per person/day.
  *   **Suffering:** -2 units per person/day.
  *   **Net Wellbeing:** +8 units per person/day.
  *   **Total Suffering:** 2,000 units (1,000 people × 2 units).

  **World B (The Steady State)**
  The society bans the implant. People live natural lives. They experience mild, steady contentment, occasional laughter, and no severe pain.
  *   **Happiness:** +3 units per person/day.
  *   **Suffering:** 0 units per person/day.
  *   **Net Wellbeing:** +3 units per person/day.
  *   **Total Suffering:** 0 units.

  **The Choice:** You are the policymaker. You must choose which world to actualize. You cannot mix them; it's all A or all B.

  ***

  ### 1. The Theoretical Divergence

  Here is exactly how the two theories calculate the verdict:

  **Total Utilitarianism (TU)**
  *   **Formula:** Maximize the sum of (Happiness − Suffering).
  *   **World A Calculation:** 1,000 people × (+10 − 2) = **+8,000 total units**.
  *   **World B Calculation:** 1,000 people × (+3 − 0) = **+3,000 total units**.
  *   **Verdict:** **Strictly prefers World A.** The massive gain in happiness outweighs the cost of the migraines. To a TU, a world with more net "good" is better, even if it contains some pain.

  **Negative Utilitarianism (NU)**
  *   **Formula:** Minimize the sum of Suffering. (Happiness has no positive moral weight; it is morally inert).
  *   **World A Calculation:** Total Suffering = **2,000 units**.
  *   **World B Calculation:** Total Suffering = **0 units**.
  *   **Verdict:** **Strictly prefers World B.** The happiness in World A (+10,000 units) is morally irrelevant. It is just "fluff." The only thing that matters is the migraine pain. Since World B eliminates the pain entirely, it is the only moral choice.

  ***

  ### 2. The Single Feature Doing the Work

  Your hunch about the "zero line" is close, but not quite precise. The diverging feature is **the Moral Weight of the Positive.**

  Both theories generally agree on where the "zero line" is (the point of neutrality where you feel neither pain nor pleasure). The disagreement is about what happens *above* that line.
  *   **For TU:** The area above the zero line (happiness) has **positive moral magnitude**. It actively pulls the scale toward "Good."
  *   **For NU:** The area above the zero line has **zero moral magnitude**. It is invisible to the moral calculus.

  In this case, World A trades *Suffering* for *Happiness*.
  *   TU sees this as a profitable exchange (buying $10 of happiness for $2 of pain).
  *   NU sees this as burning money to buy nothing (spending $2 of pain to buy $0 of moral value).

  ***

  ### 3. What Happens If You Remove/Change That Feature?

  If you want the theories to collapse back into agreement, you have to change the **moral status of happiness** or the **presence of suffering**.

  *   **Scenario 1: Remove the Suffering.**
      If World A had the +10 happiness but *zero* migraines, TU and NU would agree (or rather, NU would be indifferent). NU doesn't *hate* happiness; it just doesn't *value* it. If there is no suffering to minimize, NU has no reason to oppose World A.
  *   **Scenario 2: Make Happiness Count (The "Weighted" Change).**
      If you modify NU to say "Suffering counts for 1 point, but Happiness counts for 0.1 points" (sometimes called *Negative Weighted Utilitarianism*), the theories might realign.
      *   *World A:* (10 × 0.1) − 2 = -1 (Bad)
      *   *World B:* (3 × 0.1) − 0 = +0.3 (Good)
      *   In this specific numeric setup, they still disagree with standard TU, but if you raise the happiness weight enough, the "Highs" of World A eventually outweigh the "Lows," and the theories converge on World A.

  **The Collapse Point:** The theories only *necessarily* diverge when **increasing net happiness requires incurring new suffering.** If you can increase happiness "for free" (without pain), NU is indifferent, and TU is happy. They only fight when there is a cost.

  ***

  ### 4. The Strongest Total Utilitarian Comeback

  Your friend arguing for NU needs to hear this. A smart TU shouldn't just say "Happiness matters!" (that's begging the question). They should argue for **Asymmetry without Exclusivity.**

  **The Argument:**
  "Negative Utilitarianism is right that suffering is *urgent*, but wrong that it is *exclusive*. We can acknowledge that pain is morally worse than pleasure is good (an asymmetry) without claiming pleasure has *no* value."

  **The "Rescue" Intuition:**
  Imagine a child is suffering in World A. NU says we must save them. TU agrees. But imagine a child in World B who is bored and listless. TU says we have a *prima facie* reason to improve their life (add happiness). NU says we have *no reason* to improve their life unless they are suffering.
  **The Comeback:** "If happiness has zero value, then a world of billions of people feeling mild boredom is morally identical to a world of billions of people feeling ecstatic joy, provided neither group is in pain. That is counter-intuitive. We should adopt **Prioritarianism**: give priority to relieving suffering, but still count happiness as a genuine good. This captures your intuition about World B (pain is bad!) without forcing you to say World A's joy is meaningless."

  ***

  ### 5. The Average Utilitarianism (AU) Question

  Your clubmate is **wrong**. Here is the math to prove it at the meeting.

  Average Utilitarianism says: Maximize the *average* wellbeing per person.
  *   **Formula:** (Total Wellbeing) / (Total People).

  Since your thought experiment specifies that **the number of people is identical in both worlds (1,000)**, Total Utilitarianism and Average Utilitarianism will **always** produce the exact same ranking.

  *   **World A Average:** +8,000 / 1,000 = **+8 per person**.
  *   **World B Average:** +3,000 / 1,000 = **+3 per person**.

  **Verdict:** Average Utilitarianism prefers **World A**, exactly like Total Utilitarianism.

  **Why your friend is confused:**
  Average Utilitarianism usually diverges from Total Utilitarianism only in *population ethics* (e.g., "Should we add more people if their lives are worth living but below average?"). Since you explicitly banned population changes (no new births, no deaths), AU and TU are mathematically identical in this case. NU is the only outlier.

  ### Summary for your Meeting
  1.  **Use the Migraine vs. Bliss case.** It keeps population constant and avoids death.
  2.  **Highlight the trade-off:** TU accepts pain for joy; NU rejects pain regardless of joy.
  3.  **Correct the "Zero Line" idea:** It's not about where zero is, it's that NU treats positive numbers as moral zeros.
  4.  **Debunk the AU claim:** Same population = TU and AU agree. NU is the odd one out.

  Good luck! This setup should keep the debate focused on the value of happiness rather than sliding into population ethics.
