  # ORGANIZER'S KEY & ANALYSIS
  *(Do Not Photocopy – For Discussion Leader Eyes Only)*

  ### 1. Mapping Real Positions
  *   **Leaf 6 (Standard Homeowner):** This is where most of your group will likely land. It's the default commonsense view.
  *   **Leaf 2 (Defensive Humanist):** Common among "save the bees" types who still kill wasps. They draw a hard line at "property/threat" vs. "nature."
  *   **Leaf 3 (Insect Pacifist):** Rare, but you'll find the hardline vegan or Jainist here.
  *   **Leaf 4 (Risk Utilitarian):** Often effective altruists or strict consequentialists. They care about the pain risk but don't buy the "home sanctity" argument.
  *   **Leaf 1 (Fortress Pacifist):** A tense position. Often held by people who want to be ethical but know they won't let their house collapse.
  *   **Leaf 5 & 7 (Skeptics who don't kill):** These are philosophically interesting but rare. They separate "sentience" from "moral status."

  ### 2. Empty or Unstable Combinations
  *   **Leaf 7 (The Respectful Skeptic):** This is the most unstable leaf. If someone answers "No" to sentience (bugs don't feel pain) and "No" to location (universal), why answer "Yes" to means (killing is worse than excluding)? Usually, if you remove sentience and location, the distinction between killing and excluding collapses into pure pragmatism.
      *   *Diagnosis:* **Unattractive.** It requires a "sanctity of life" view that doesn't rely on suffering or context. People who hold this usually slide into Leaf 3 (admitting sentience) or Leaf 8 (admitting pragmatism).
  *   **Leaf 5 (The Gentle Homeowner):** Similar instability. Why is killing "wrong" in the kitchen but fine in the garden if sentience is off the table?
      *   *Diagnosis:* **Unexplored.** It suggests a "cleanliness vs. nature" dichotomy rather than an ethical one. People here might actually be Leaf 6 but feel social pressure to be "gentle" indoors.

  ### 3. Indistinguishable Leaves (The "Fake" Distinctions)
  *   **Leaf 2 (Defensive Humanist) vs. Leaf 6 (Standard Homeowner):**
      *   *The Issue:* In practice, both will poison the kitchen ants. Leaf 2 feels bad about it (precautionary); Leaf 6 does not (probabilistic).
      *   *Flag:* The tree separates **motivation**, not **action**. In a debate, these two will agree on every real-world case unless you push them on edge cases (e.g., "What if the ant poison *might* hurt a pet?"). Leaf 2 hesitates; Leaf 6 doesn't.
  *   **Leaf 4 (Risk Utilitarian) vs. Leaf 8 (Radical Pragmatist):**
      *   *The Issue:* Both will spray the stream if it helps humans. Leaf 4 counts insect pain as a negative variable; Leaf 8 counts it as zero.
      *   *Flag:* Hard to separate unless the human benefit is small. If the benefit is tiny, Leaf 4 might stop (pain risk > human gain), while Leaf 8 proceeds. Use the "neighborhood mosquito spraying" case to pry them apart.

  ### 4. Discussion Tips
  *   **The "Relational" Node (Q2):** This is your best friction point. People who say "Yes, location matters" often struggle to explain *why*. Is it property rights? Self-defense? Ask them: "If the termite is in the wall but hasn't damaged anything yet, can you kill it?"
  *   **The "Means" Node (Q3):** This catches the "procreation-flavored asymmetry" you mentioned. People who say "Exclusion is fine, Killing is not" often can't explain why starving an ant (exclusion) is better than poisoning it (killing), since both lead to death. Push on the *directness* of the harm.
  *   **The "Uncertainty" Node (Q1):** If everyone says "No" (Probabilistic), switch the case to "Octopuses" or "Crabs" where sentience is more likely, then ask why insects are different. This tests consistency.
