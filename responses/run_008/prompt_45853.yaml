  # THE PEST CONTROL ETHICS TREE
  *(Photocopy Friendly Version)*

  **Instructions:** Start at the top. Answer each question honestly based on your gut reaction to the concrete case provided. Follow the arrows down to find your ethical "leaf."

  ***

  ### QUESTION 1: THE UNCERTAINTY TEST
  **Case:** You see mosquitoes buzzing around your patio. Science isn't 100% sure if they feel pain, but there's a small chance they do.
  **Q:** Does the *possibility* of pain force you to hesitate, even if you think it's unlikely?

  *   **YES (Precautionary)** → Go to Question 2A
  *   **NO (Probabilistic)** → Go to Question 2B

  ***

  ### QUESTION 2A (For "YES" above): THE LOCATION TEST
  **Case:** A termite is chewing a dead log in the forest. Another is chewing your house beam.
  **Q:** Is the termite in your wall morally different from the one in the forest?

  *   **YES (Contextual)** → Go to Question 3A
  *   **NO (Universal)** → Go to Question 3B

  ### QUESTION 2B (For "NO" above): THE LOCATION TEST
  **Case:** A termite is chewing a dead log in the forest. Another is chewing your house beam.
  **Q:** Is the termite in your wall morally different from the one in the forest?

  *   **YES (Contextual)** → Go to Question 3C
  *   **NO (Universal)** → Go to Question 3D

  ***

  ### QUESTION 3A: THE MEANS TEST
  **Case:** You have ants in the kitchen. You can seal the crack (exclusion) or poison the colony (extermination).
  **Q:** Is sealing the crack morally different from poisoning the ants?

  *   **YES** → **Leaf 1: The Fortress Pacifist**
  *   **NO** → **Leaf 2: The Defensive Humanist**

  ### QUESTION 3B: THE MEANS TEST
  **Case:** You have ants in the kitchen. You can seal the crack (exclusion) or poison the colony (extermination).
  **Q:** Is sealing the crack morally different from poisoning the ants?

  *   **YES** → **Leaf 3: The Insect Pacifist**
  *   **NO** → **Leaf 4: The Risk Utilitarian**

  ### QUESTION 3C: THE MEANS TEST
  **Case:** You have ants in the kitchen. You can seal the crack (exclusion) or poison the colony (extermination).
  **Q:** Is sealing the crack morally different from poisoning the ants?

  *   **YES** → **Leaf 5: The Gentle Homeowner**
  *   **NO** → **Leaf 6: The Standard Homeowner**

  ### QUESTION 3D: THE MEANS TEST
  **Case:** You have ants in the kitchen. You can seal the crack (exclusion) or poison the colony (extermination).
  **Q:** Is sealing the crack morally different from poisoning the ants?

  *   **YES** → **Leaf 7: The Respectful Skeptic**
  *   **NO** → **Leaf 8: The Radical Pragmatist**

  ***

  ### THE LEAVES: YOUR POSITION & ITS COST

  **Leaf 1: The Fortress Pacifist**
  *   **View:** Insect suffering matters everywhere, but you get to defend your home—just not lethally.
  *   **Awkward Commitment:** You must let termites destroy your house if exclusion fails, but you wouldn't lift a finger to save termites in a forest.

  **Leaf 2: The Defensive Humanist**
  *   **View:** Insect suffering matters, but property rights override it inside your home.
  *   **Awkward Commitment:** You will poison kitchen ants despite the risk of pain, but must let a wasp nest stay if it's over the daycare entrance (public space).

  **Leaf 3: The Insect Pacifist**
  *   **View:** Insect suffering matters everywhere, and location never justifies killing.
  *   **Awkward Commitment:** You cannot remove a disease-carrying mosquito from a hospital nursery if the only way is to kill it.

  **Leaf 4: The Risk Utilitarian**
  *   **View:** Insect suffering is a risk to be weighed, but location doesn't change the math.
  *   **Awkward Commitment:** You must calculate the "greater good" before swatting a fly in a forest, just as you would in your kitchen.

  **Leaf 5: The Gentle Homeowner**
  *   **View:** Insects likely don't feel pain, but killing is "wrong" in your home; the forest is fair game.
  *   **Awkward Commitment:** You will spend hours starving out kitchen ants rather than killing them, but will spray a beneficial insect colony in your garden without hesitation.

  **Leaf 6: The Standard Homeowner**
  *   **View:** Insects likely don't feel pain, and your home is your castle.
  *   **Awkward Commitment:** You have no ethical objection to neighborhood-wide mosquito spraying, even if it wipes out local pollinators accidentally.

  **Leaf 7: The Respectful Skeptic**
  *   **View:** Insects likely don't feel pain, but killing is intrinsically disrespectful everywhere.
  *   **Awkward Commitment:** You refuse to kill insects anywhere, even though you believe doing so causes them no suffering.

  **Leaf 8: The Radical Pragmatist**
  *   **View:** Insects likely don't feel pain, location doesn't matter, and outcomes are all that count.
  *   **Awkward Commitment:** You cannot object to pesticide runoff into a stream unless it harms *humans*, since the insects themselves have no moral weight.

