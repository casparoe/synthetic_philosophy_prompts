answer: |-
  Here is a principled account designed to capture your seven verdicts, followed by an analysis of its commitments and a blunt assessment of where your intuitions may be logically vulnerable.

  ### The Principle: Variance-Context Relativity (VCR)

  **Statement:**
  Heritability ($h^2$) is a statistic describing the proportion of **phenotypic variance** attributable to **additive genetic variance** within a specific **Population-Environment Distribution (PED)**. Inferences from $h^2$ are licensed only under two conditions:
  1.  **The Variance Constraint:** The inference must concern the structure of *variance* within the reference PED, not the etiology of individual means or the cause of mean differences between distinct PEDs.
  2.  **The Contextual Boundary:** Predictive or causal inferences extend only to populations and environments falling within the sampled range of the original PED, unless **Robustness** is demonstrated (i.e., $h^2$ remains stable across divergent PEDs, implying low Genotype-by-Environment interaction).

  ---

  ### Application to Your Seven Verdicts

  **1. Individual Decomposition (False)**
  *   **Clause:** Variance Constraint.
  *   **Reasoning:** $h^2$ is a ratio of variances ($V_G/V_P$) in a population. An individual has a phenotype, not a variance. There is no statistical operation that partitions a single data point into percentage contributions from its sources of variance.
  *   **Verdict:** Saved.

  **2. Immutability (False)**
  *   **Clause:** Variance Constraint & Contextual Boundary.
  *   **Reasoning:** High $h^2$ means current *variance* is mostly genetic, given the current *range* of environments. It does not measure the slope of the Norm of Reaction. A novel environment (outside the sampled PED) can shift the mean for everyone without altering the rank order (variance), rendering the trait highly mutable despite high $h^2$.
  *   **Verdict:** Saved.

  **3. Zero Heritability/Genetic Irrelevance (False)**
  *   **Clause:** Contextual Boundary.
  *   **Reasoning:** $h^2 = 0$ implies $V_G = 0$ *within that specific PED*. If the environment is uniformly suppressive, $V_E \approx 0$ and $V_P \approx 0$, or $V_E$ swamps $V_G$. It does not imply the genotype-phenotype map is flat (genes irrelevant), only that genetic differences are not currently expressing as phenotypic differences in this context.
  *   **Verdict:** Saved.

  **4. Within-Group $h^2$ to Between-Group Difference (False)**
  *   **Clause:** Variance Constraint.
  *   **Reasoning:** This is the classic Lewontin fallacy. Two groups can have high within-group $h^2$ but differ in mean due to a shift in the environmental intercept (e.g., nutrition). The variance *within* the groups tells us nothing about the cause of the distance *between* the group means, because the between-group difference is a difference of *means*, not a difference of *variances*.
  *   **Verdict:** Saved.

  **5. Robust $h^2$ as Weak Evidence for Between-Group Genetics (True, with caveats)**
  *   **Clause:** Contextual Boundary (Robustness Exception).
  *   **Reasoning:** This is the tension point. VCR saves this *only if* "wildly different environments" encompasses the environmental difference between the two new populations. If $h^2$ is high across diverse PEDs, it implies $V_G$ is large relative to $V_E$ and GxE is low (parallel reaction norms). This makes it *statistically less probable* that a mean difference is purely environmental, because a purely environmental cause would require an environmental shift large enough to overcome the demonstrated stability of the genetic variance. It is **abductive** evidence (shifting the prior probability), not deductive proof.
  *   **Verdict:** Saved, but precariously (see "Blunt Assessment" below).

  **6. Meaningless Bare Figure vs. Rational Gene Hunting (Consistent)**
  *   **Clause:** Variance Constraint vs. Existence Proof.
  *   **Reasoning:** A "bare figure" is meaningless for *prediction* across contexts (violates Contextual Boundary). However, a high $h^2$ estimate serves as an **Existence Proof** of additive genetic variance ($V_G > 0$) in that population. Gene hunting seeks specific molecular instantiations of that $V_G$. You are not inferring the *magnitude* of $h^2$ will transfer; you are inferring the *existence* of genetic causation warrants the search.
  *   **Verdict:** Saved.

  **7. Breeder's Prediction (True)**
  *   **Clause:** Contextual Boundary.
  *   **Reasoning:** The breeder operates *within* the PED. She selects parents from the population and rears offspring in the same environmental distribution used to calculate $h^2$. The Breeder's Equation ($R = h^2 S$) predicts response to selection *within the reference context*.
  *   **Verdict:** Saved.

  ---

  ### Predictions for Unlisted Cases

  **Case A: Twin Data to IVF Design**
  *   **Prediction:** The principle warns against direct transfer. Twin estimates rely on specific assumptions about shared environments (Equal Environments Assumption). IVF designs (e.g., comparing genetic siblings reared apart vs. together) sample a different PED.
  *   **VCR Verdict:** You cannot transfer the *number*. You can only transfer the *existence* of variance (Verdict 6 logic). If the IVF environment differs systematically from the twin-rearing environment (e.g., IVF parents are older/wealthier), the $h^2$ estimate will change.

  **Case B: Intervention Targeting the Genetically Vulnerable**
  *   **Prediction:** If you intervene on a population by targeting those genetically most vulnerable (e.g., PKU screening), you are changing the **Population-Environment Distribution**.
  *   **VCR Verdict:** The original $h^2$ is now invalid. By removing the environmental trigger for the vulnerable genotype, you reduce $V_P$ and potentially $V_G$ (if the phenotype is suppressed). The principle predicts the heritability estimate will drop, and predictions based on the old $h^2$ will fail. This aligns with Verdict 2 (mutability).

  ---

  ### Blunt Assessment: Which Verdict Must Go?

  You asked me to be blunt about whether **Verdict 5** or **Verdict 6** has to go.

  **Verdict 6 is safe.** The distinction between a *predictive coefficient* (which is context-bound) and an *existence proof of biological causation* (which justifies resource allocation) is logically sound. High heritability proves there is genetic variance to find, even if the ratio doesn't hold elsewhere. You can keep this without contradiction.

  **Verdict 5 is the logical weak link.** You cannot fully save Verdict 5 without severely qualifying it, to the point where it may no longer match your intuition.

  Here is why: **High heritability across environments does not preclude a 100% environmental cause for a mean difference.**

  Imagine height is 80% heritable in the Arctic and 80% heritable in the Tropics (wildly different environments). This satisfies your condition for Verdict 5. Now, compare the mean height of the Arctic population to the Tropics population.
  *   **Scenario:** The Arctic diet is high in protein; the Tropical diet is low.
  *   **Result:** The mean difference is 100% environmental.
  *   **Logic:** The high $h^2$ in both locations only tells you that *within* the Arctic, genes explain the variance, and *within* the Tropics, genes explain the variance. It tells you nothing about the *intercept shift* caused by the diet.

  Your intuition in Verdict 5 relies on a hidden Bayesian prior: *"If $h^2$ is high everywhere, environmental variance ($V_E$) must be small relative to genetic variance ($V_G$). Therefore, a large mean difference requires a massive environmental shift, which is unlikely."*

  This is a heuristic, not a logical principle. It works only if you assume the environmental differences between the two new populations are *not* the specific ones that drive the mean shift. But if the "wildly different environments" in your initial survey did not sample the *specific* environmental factor that differs between the two new populations (e.g., a specific toxin, a specific nutrient), the inference collapses.

  **Recommendation:**
  To maintain logical consistency with Verdict 4 (which is deductively true), you must downgrade Verdict 5.
  *   **Keep:** "High heritability across diverse environments suggests the trait is genetically malleable and robust to *sampled* environmental variations."
  *   **Discard:** "...therefore it is evidence that a mean difference *between new populations* has a genetic component."

  If you keep the latter, you are telling your students that knowing the variance *within* groups tells you about the means *between* groups, which is the very fallacy you condemn in Verdict 4. The only way to save 5 is to admit it is a **gamble based on the assumption of environmental equivalence**, not an inference licensed by the heritability estimate itself.

  **Final Verdict:** Sacrifice the inferential power of **Verdict 5**. Retain **Verdict 6**. The Principle of Variance-Context Relativity holds firm only if you acknowledge that no amount of within-group variance data can logically license a between-group mean attribution without independent evidence of environmental equivalence.
