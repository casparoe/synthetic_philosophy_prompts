prompt: |-
  Each spring I teach a unit, in an otherwise ordinary philosophy-of-science survey, on the logic of heritability estimates, and each spring I find myself issuing judgments about which inferences from those estimates are legitimate and which are sophistries. This year, rather than presenting students with another catalogue of misuses, I would like to hand them a principle. So I have written down my verdicts on a range of claims, and I want to know whether some one principle — or a small, explicit set of principles — captures them all, and what it commits me to. Here are the verdicts:

  1. Height is roughly 80% heritable in contemporary affluent populations; therefore 80% of any particular person's height is attributable to their genes. — I judge this false: heritability is a claim about the sources of variance in a population, not a decomposition of an individual, and there is no coherent sense in which 80% of my centimeters came from my genome.

  2. Height is roughly 80% heritable in the Netherlands; therefore no environmental or public-health intervention could appreciably raise the average height of the Dutch. — Also false, and dramatically so given that average Dutch height rose by leaps over the past century and a half with a genome that changed not at all.

  3. Suppose we discover a population in which height is 0% heritable — everyone equally stunted by the same deprivation, say, so that all the variance has vanished. Some colleagues tell me this would show that genes are irrelevant to height in that population, and that a program relieving the deprivation would not raise anyone. — I judge both conjuncts false, indeed incoherent: a trait can be heritable in one environment and not another, and uniform environmental suppression tells us nothing about genetic irrelevance. Though I admit I am somewhat unsure what the zero estimate is even measuring once variance is destroyed.

  4. A trait is 50% heritable within population A and 50% heritable within population B; therefore the mean difference between the groups is, in some proportion, genetic in origin. — I hold this to be flatly invalid: within-group heritability constrains nothing about the causes of between-group differences.

  5. And yet, I confess: if a trait turns out to be substantially heritable in every population in which it has been measured, across wildly different environments, I find myself treating that as weak, defeasible evidence that a newly observed mean difference between two further populations has some genetic component. My students will notice this, because it appears to contradict verdict 4, and I do not currently have an answer for them.

  6. I tell students that heritability is so thoroughly relative to population and environment that a bare figure — the heritability of intelligence, of religiosity, of criminality — is close to meaningless. Yet in the same lecture I will say, without hesitation, that because schizophrenia is substantially heritable, funding the search for susceptibility genes is a rational use of resources — apparently treating the estimate as evidence about something that generalizes beyond its originating sample.

  7. A working dog breeder uses heritability estimates of a temperament trait to predict how fast the trait will respond to selection, and adjusts her breeding program accordingly. — I judge this an entirely proper use of heritability, apparently the one context in which the number does exactly what people naively take it to do.

  My question, then: is there a single principled account of what heritability measures and what may be inferred from it that delivers all seven verdicts? I suspect the key is something about the range of environments over which the estimate holds being held fixed in some uses and not others — the breeder's inference works because the environment she extrapolates across is the one the estimate was computed in, and my embarrassment in verdict 5 is that I cannot say why the cross-population generalization in 5 differs in kind from the cross-population generalization I condemn in 4 — but every formulation I attempt either lets the inference in 4 slip through or forbids the one in 7. Please state the principle or principles precisely enough to test, show which verdict each clause earns, tell me what it predicts about cases I have not listed (for instance: whether a heritability estimate from twin data transfers to an IVF-based design, or whether it licenses predictions about a population whose environment is deliberately being changed by an intervention targeting the genetically most vulnerable), and be blunt about which of my verdicts the best principle cannot save — particularly whether 5 or 6 has to go, since I have come to suspect I cannot keep both.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A philosophy of science instructor teaching a unit on the logic of heritability estimates ($h^2$).
      *   **Goal:** The user wants a single principle (or small set) that justifies their seven specific verdicts on inferences from heritability.
      *   **The Verdicts:**
          1.  $h^2$ does not apply to individuals (individual decomposition is false).
          2.  High $h^2$ does not imply immutability (environmental intervention can still work).
          3.  Zero $h^2$ does not imply genetic irrelevance (genes still matter, just variance is suppressed).
          4.  Within-group $h^2$ does not explain between-group differences (Lewontin's fallacy).
          5.  *Tension:* High $h^2$ across *many* environments suggests genetic involvement in new between-group differences (contradicts 4?).
          6.  *Tension:* $h^2$ is population-specific/meaningless in isolation, *but* high $h^2$ justifies gene-hunting (implies generalizability).
          7.  Breeder's use (response to selection) is valid.
      *   **The Core Problem:** The user suspects the key lies in the *range of environments* held fixed vs. varied, but struggles to formulate a principle that blocks verdict 4 (between-group genetic inference) while allowing verdict 5 (cross-population genetic inference based on robustness) and verdict 7 (breeding).
      *   **Specific Demand:** State the principle precisely, map it to the verdicts, predict new cases, and be blunt about which verdicts might need to be sacrificed (specifically 5 vs. 6).

  2.  **Deconstruct the Logic of Heritability:**
      *   **Definition:** $h^2 = V_G / V_P$ (in the narrow sense, additive genetic variance over phenotypic variance). Crucially, $V_P = V_G + V_E + V_{GxE} + \text{covariance}$.
      *   **Key Insight 1 (Variance vs. Mean):** Heritability is about *variance*, not *means*. This handles 1, 2, 3, and 4.
      *   **Key Insight 2 (Norm of Reaction):** Genotypes map to phenotypes via functions across environments. $h^2$ is a local slope or ratio within a specific distribution of environments.
      *   **Key Insight 3 (Stability/Robustness):** If $h^2$ is high across *diverse* environments, it suggests $V_G$ is robustly non-zero and $V_E$ is relatively small or consistent *relative* to $V_G$ across those contexts. This hints at resolving 5 and 6.
      *   **Key Insight 4 (Selection Response):** The Breeder's Equation ($R = h^2 S$) works because it predicts change *within the same population/environmental context* or under controlled selection pressures. This handles 7.

  3.  **Addressing the Tension (Verdicts 4 vs. 5):**
      *   Verdict 4 says: Within-group $h^2$ $\nrightarrow$ Between-group difference cause. (Standard Lewontin point).
      *   Verdict 5 says: High $h^2$ everywhere $\rightarrow$ Weak evidence for genetic component in *new* between-group difference.
      *   *Resolution:* Verdict 4 is about *attribution of the difference*. Verdict 5 is about *existence of genetic variance*.
      *   Actually, Verdict 5 is tricky. If Group A and Group B differ in mean height, and height is 80% heritable in A and 80% heritable in B, does that mean the *difference* is genetic? No (Verdict 4). But does it mean genes are *involved* in the trait generally? Yes.
      *   The user's Verdict 5 says: "treating that as weak, defeasible evidence that a newly observed mean difference... has some genetic component."
      *   *Critique:* This is the danger zone. If Environment A is perfect and Environment B is terrible, the mean difference is 100% environmental, even if $h^2$ is high in both.
      *   *However:* If $h^2$ is high across *wildly different* environments, it implies the Norm of Reaction slopes are parallel and distinct. If the environments are truly "wildly different" and the rank order of genotypes remains stable, then a mean difference *might* reflect genetic differences *if* we assume the populations are drawn from the same genetic pool or if the environmental shift doesn't interact with the specific genetic difference causing the mean shift.
      *   *Better Principle:* Heritability estimates license inferences about *variance* within the reference population/environment. They license inferences about *means* only if we have independent reason to believe the environmental distributions are identical (for 4) or if the robustness of $h^2$ implies a lack of GxE interaction that would scramble rank orders (for 5).
      *   *Wait, the user wants to keep 5.* To keep 5, we need a principle about *causal stability*. If $h^2$ is robust across environments, the trait is "canalized" or genetically driven *relative* to environmental noise. This makes a genetic explanation for a difference *more plausible* than if $h^2$ were low, but it doesn't prove it. It shifts the prior probability.
      *   *The Conflict:* Verdict 4 is logically strict (within-group variance $\neq$ between-group cause). Verdict 5 is abductive (robust variance $\rightarrow$ likely genetic involvement). Can a single principle cover both?
      *   *Yes:* The principle must distinguish between *variance decomposition* (strict) and *causal hypothesis generation* (probabilistic/abductive).

  4.  **Addressing the Tension (Verdict 6):**
      *   Part A: Bare $h^2$ is meaningless (context-dependent).
      *   Part B: High $h^2$ justifies gene hunting (implies biological reality).
      *   *Resolution:* Gene hunting seeks *molecular* variants. High $h^2$ indicates additive genetic variance exists *somewhere*. It justifies the search for *specific* causes, even if the *aggregate* statistic doesn't transfer. It's an existence proof of $V_G$, not a transferable coefficient.

  5.  **Drafting the Principle:**
      *   Need to focus on **Variance vs. Mechanism** and **Reference Class Stability**.
      *   *Proposed Principle:* **The Principle of Variance-Relative Causal Stability.**
      *   *Core:* Heritability ($h^2$) measures the proportion of *phenotypic variance* attributable to *additive genetic variance* **relative to a specific distribution of environments**.
      *   *Inference Rule 1 (Variance):* Inferences about individual constitution or mean differences are invalid because $h^2$ describes population variance, not individual means or absolute causation. (Covers 1, 2, 3, 4).
      *   *Inference Rule 2 (Stability):* Inferences about biological mechanisms (gene hunting) or response to selection are valid *only if* the environmental distribution remains fixed or the estimate is shown to be robust across environmental variations (indicating stable additive variance). (Covers 6, 7).
      *   *Inference Rule 3 (Between-Group):* High $h^2$ across diverse environments increases the prior probability that genetic differences *could* explain mean differences, but does not establish that they *do* without evidence of environmental equivalence. (Covers 5 while respecting 4).

      *Refining the Principle:* The user wants something sharper. Let's look at the "Range of Environments" hint they gave.
      *   *Principle:* **The Domain of Environmental Variation (DEV) Constraint.**
      *   *Statement:* A heritability estimate $h^2$ is valid for prediction or causal attribution only within the **Domain of Environmental Variation** sampled in the estimation. Extrapolation beyond the DEV is licensed only to the extent that the *rank order of genotypic values* (Norms of Reaction) is demonstrated to be stable across the new domain.
      *   *Application to 4:* Between-group differences involve a shift in the *mean environment* or *genetic mean*. The DEV of the within-group estimate does not cover the *difference* in means. Thus, invalid.
      *   *Application to 5:* If $h^2$ is high across *wildly different* environments, the DEV is wide. This suggests the Norms of Reaction are parallel. If the new populations fall within this wide DEV, a genetic component is *possible*, but the mean difference is still confounded by environmental shifts. *Wait, this doesn't fully save 5.*
      *   *Hard Truth:* Verdict 5 is actually logically suspect if stated as "evidence that the difference *has* a genetic component." If the environments differ systematically (e.g., nutrition), the difference is environmental even if $h^2$ is high.
      *   *Correction:* Verdict 5 says "weak, defeasible evidence." This is Bayesian. High $h^2$ everywhere means $V_G$ is large. If $V_G$ is large, it is *capable* of producing differences. It doesn't mean it *did*.
      *   *The Sacrifice:* The user suspects 5 or 6 must go.
      *   *Analysis of 6:* "Bare figure meaningless" vs "Gene hunting rational." This is consistent. Bare figure = predictive power for other pops. Gene hunting = existence of $V_G$ in *this* pop. No contradiction.
      *   *Analysis of 5:* This is the weak link. High $h^2$ in A and B tells you nothing about the cause of $Mean_A - Mean_B$. Example: Plant height in two fields. Field 1 has good soil, Field 2 has bad soil. $h^2$ is high in both (genetics matters for variation within the soil type). The difference between fields is 100% soil.
      *   *Why does the user feel 5 is true?* Because if $h^2$ is high everywhere, it suggests the trait is "biological." But "biological" doesn't mean "genetic difference between groups."
      *   *Decision:* I must be blunt. Verdict 5 is the one that cannot be saved by a rigorous principle without qualifying it so heavily it loses its intuitive force. Verdict 4 is the logical truth; Verdict 5 is a heuristic that often fails.
      *   *However*, I can save 5 if I interpret it as "evidence that the trait is *capable* of being genetically differentiated," not "evidence that *this* difference is genetic." But the user wrote: "evidence that a newly observed mean difference... has some genetic component." That is the Lewontin fallacy again, just probabilistic.
      *   *Wait, is there a way to save 5?* If $h^2$ is high across *wildly* different environments, it implies GxE is low. If GxE is low, Norms of Reaction are parallel. If Pop A and Pop B have different means, and we know environments are *not* the cause (how do we know?), then genes are the cause. But we don't know environments aren't the cause.
      *   *Actually, there is a nuance:* If $h^2$ is high, $V_E$ is low *relative* to $V_G$. If $V_E$ is small, then large mean differences are *less likely* to be caused by environment (unless the environmental shift is massive). So it *is* weak evidence. It shifts the burden of proof.
      *   *Okay, I can save 5* by framing it as a Bayesian prior on the *magnitude* of environmental variance required to explain the difference.

  6.  **Developing the Unified Principle:**
      *   **Name:** The **Principle of Variance-Context Relativity (VCR)**.
      *   **Core:** Heritability ($h^2$) is a ratio of variances ($V_G/V_P$) estimated over a specific **Population-Environment Distribution (PED)**.
      *   **Clause A (The Variance Barrier):** $h^2$ describes the structure of *variance* within the PED. It licenses no inferences about individual etiology (1), trait immutability (2), genetic irrelevance at zero (3), or the cause of *mean differences* between populations with different PEDs (4).
      *   **Clause B (The Stability Exception):** $h^2$ licenses inferences about *mechanisms* (6) and *selection response* (7) because these rely on the existence of $V_G$, not the specific ratio, provided the PED for the inference matches the PED of the estimate.
      *   **Clause C (The Robustness Heuristic):** If $h^2$ remains high across *divergent* PEDs, it implies $V_G$ is robust and GxE is minimal. This licenses a *defeasible prior* that mean differences *could* be genetic (5), but only if the environmental shift between groups is not known to be sufficient to explain the mean difference.

      *Wait, I need to be sharper on 5 vs 4.*
      *   Verdict 4: Within-group $h^2$ $\nrightarrow$ Between-group cause. (Strict).
      *   Verdict 5: High $h^2$ in *all* groups $\rightarrow$ Weak evidence for Between-group cause. (Probabilistic).
      *   The distinction is **Variance vs. Robustness**.
      *   In 4, we assume standard $h^2$ in two groups.
      *   In 5, we assume $h^2$ is high *across wildly different environments*. This implies the trait is insensitive to environmental variation (low $V_E$). If $V_E$ is low, a large mean difference is *more likely* to be $V_G$ (assuming the environmental shift isn't massive).
      *   *The Blunt Truth:* Verdict 5 is still dangerous. If the "wildly different environments" don't include the *specific* environmental difference between the two new populations, the inference fails. (e.g., $h^2$ high in rich and poor countries, but the new comparison is between a rich country and a war zone).
      *   *Recommendation:* I should advise the user that Verdict 5 is the weak link. It can be saved only by reinterpreting it as "evidence that the trait is genetically malleable," not "evidence that the difference is genetic."
      *   *Actually, looking at Verdict 6:* "Bare figure meaningless" vs "Gene hunting rational." This is easily saved. Gene hunting looks for *specific* variants. $h^2$ confirms *aggregate* variance. No contradiction.
      *   *So the sacrifice is likely 5.* Or 5 needs a heavy caveat.

  7.  **Structuring the Response:**
      *   **The Principle:** Define the **Principle of Environmental Range Relativity (ERR)**.
      *   **The Clauses:**
          1.  **Variance Limit:** $h^2$ applies to variance, not means or individuals.
          2.  **Context Lock:** Inferences hold only within the sampled environmental range.
          3.  **Existence vs. Ratio:** High $h^2$ proves existence of $V_G$ (gene hunting), not stability of the ratio (prediction).
          4.  **Robustness Heuristic:** Cross-environment stability suggests low GxE, allowing weak abductive inference about differences *only if* environmental equivalence is plausible.
      *   **Mapping Verdicts:** Walk through 1-7.
      *   **New Predictions:** IVF vs Twin (different environmental correlations), Intervention on vulnerable (GxE interaction).
      *   **The Blunt Assessment:** Verdict 5 is the problem. It contradicts 4 unless heavily qualified. Verdict 6 is consistent.

  8.  **Refining the "Blunt" Part:**
      *   The user asks: "be blunt about which of my verdicts the best principle cannot save — particularly whether 5 or 6 has to go."
      *   My analysis: 6 is saveable (Existence of $V_G$ vs. Magnitude of $h^2$). 5 is the logical trap.
      *   Why 5 is hard to save: Even if $h^2$ is 100% in Pop A and 100% in Pop B, if Pop A is in Environment 1 and Pop B is in Environment 2, and Environment 1 causes +10cm and Environment 2 causes -10cm, the difference is 100% environmental. The fact that $h^2$ is high just means within A, genes explain the variance, and within B, genes explain the variance. It says nothing about the *shift* in the intercept of the reaction norm.
      *   *Unless:* The "wildly different environments" in Verdict 5 *include* the difference between the new populations. If the estimate holds across *all* relevant environments, then the environmental sensitivity is low.
      *   *Verdict:* I will argue 5 must be reformulated, not discarded, but it is the point of greatest logical fragility. 6 is safe.

  9.  **Final Polish of the Principle:**
      *   Let's call it the **Principle of Variance-Context Relativity (VCR)**.
      *   Core idea: Heritability is a property of a *variance distribution in a context*, not a property of a *trait*.
      *   Inferences are valid only if they respect the **Variance/Mean Distinction** and the **Contextual Boundary**.

      *(Self-Correction during drafting)*: I need to make sure I address the "Breeder" case (7) well. The breeder works because they control the environment (keeping it constant) or select within the same environmental distribution. The principle must explicitly allow prediction *within* the reference environment.

      *(Addressing Verdict 5 specifically)*: I need to explain *why* the user feels 5 is true. It's because high $h^2$ across environments implies the reaction norms are parallel and steep. If reaction norms are parallel, mean differences *track* genetic differences *if* environments are equal. If environments are *not* equal, the mean difference tracks the environmental shift. The "weak evidence" comes from the fact that if $h^2$ is high, $V_E$ is low *relative* to $V_G$. So a large mean difference requires a large environmental shift to be environmental. If we assume environmental shifts are usually small, then a large mean difference is likely genetic. This is a Bayesian prior, not a logical deduction. I will validate this but warn about the assumption.

      *(Addressing Verdict 6)*: Distinguish between $h^2$ as a *predictive coefficient* (fails across contexts) vs $h^2$ as an *existence proof of additive variance* (succeeds across contexts).

