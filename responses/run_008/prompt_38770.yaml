answer: |-
  ### The Principle of Variable Moral Demand

  To capture your verdicts, we cannot rely on a simple binary of duty vs. option. We need a principle that scales obligation based on three variables: the **magnitude of harm prevented**, the **cost to the agent**, and the **uniqueness of the agent's capacity**.

  Here is the precise formulation:

  > **An act is morally required if the harm prevented is severe and the cost to the agent is modest, OR if the agent is the unique source of aid and the cost does not threaten the agent's fundamental life projects.**
  >
  > **An act is supererogatory (admirable but optional) if the cost to the agent is grave (threatening life or fundamental agency), regardless of the benefit, provided the agent did not cause the danger.**
  >
  > **An act is irrational (and thus not virtuous) if the cost to the agent is significant but the benefit prevented is negligible.**

  ---

  ### Clause Mapping and Motivating Cases

  This principle is built from three distinct clauses, each motivated by a specific tension in your catalog:

  1.  **The Baseline Duty Clause:** *"Harm prevented is severe and cost... is modest."*
      *   **Motivating Case:** **Giving up the bus seat.** The benefit (relief to a struggling person) is significant relative to the cost (minor physical discomfort). Because the cost is below the threshold of "significant sacrifice," the act slides from admirable into required.
  2.  **The Supererogatory Safety Valve:** *"Cost... is grave (threatening life...)."*
      *   **Motivating Case:** **Diving into the flooded river.** Here, the benefit (life saved) is maximal, but the cost (risk of own death) is also maximal. This clause ensures that morality does not demand self-destruction. It captures your intuition that skipping this act is not wrong, even if performing it is heroic.
  3.  **The Efficacy Constraint:** *"Benefit prevented is negligible."*
      *   **Motivating Case:** **Kidney for a few extra months.** This clause explains why high sacrifice does not automatically equal high virtue. If the outcome is trivial relative to the surgical risk and recovery, the act loses its moral luster and becomes a miscalculation of value.

  ---

  ### Honest Accounting: Overturned Verdicts

  No principle fits every intuition perfectly without forcing some to yield. Here is where the Principle of Variable Moral Demand corrects your gut feelings:

  **1. The "Only Compatible Donor" Tension**
  *   **Your Verdict:** You feel giving is still "above and beyond," *but* declining feels "wrong."
  *   **The Principle's Ruling:** **Obligatory.**
  *   **Why:** Your intuition is split because you are weighing two different metrics: the *physical cost* (which suggests supererogation) and the *dependency* (which suggests obligation). The principle resolves this by prioritizing **uniqueness**. When you are the *only* link in the chain of survival, the threshold for acceptable cost rises. You are not required to die (River), but you are required to endure significant pain (Kidney) if you are the sole alternative to death. The principle overturns your intuition that it remains "above and beyond"; it reclassifies it as a duty of rescue, explaining *why* declining feels wrong.

  **2. The Whistleblowing Waver**
  *   **Your Verdict:** You waver between heroic and owed.
  *   **The Principle's Ruling:** **Obligatory (with a caveat).**
  *   **Why:** Whistleblowing prevents severe harm (public safety, fraud). Ending a career is a "grave cost," which usually triggers the Supererogatory clause. *However*, if the harm prevented involves direct physical danger to others (not just financial loss), the severity of harm outweighs the career cost. The principle forces a decision: if the employer is harming people, you owe them aid. It overturns the idea that career preservation always trumps external harm, classifying the act as required unless the retaliation threatens your basic subsistence (food/shelter).

  ---

  ### Rulings on Pending Cases

  **1. The Off-Duty Paramedic**
  *   **Scenario:** An off-duty paramedic happens upon a serious accident.
  *   **Analysis:**
      *   *Harm:* Severe (Life/Death).
      *   *Cost:* Modest to Significant (Time, psychological stress, potential liability, but usually not physical risk comparable to a river).
      *   *Uniqueness:* High (They possess skills bystanders lack).
  *   **Ruling:** **Required.**
  *   **Reasoning:** While a bystander might be excused due to lack of skill (inefficacy), the paramedic's training lowers the "cost" of effective intervention and increases the likelihood of success. Their unique capacity triggers the "Uniqueness Modifier." Unlike the kidney donor, they are not sacrificing an organ, but they are the unique source of *effective* aid. Morally, the principle demands they act, even if the law in some jurisdictions does not.

  **2. Giving Away 10% of Income to Effective Charities**
  *   **Scenario:** Donating a substantial portion of income to save lives via effective charities.
  *   **Analysis:**
      *   *Harm:* Severe (Preventable death/disease).
      *   *Cost:* Significant but not "Grave" (for most earners, 10% reduces comfort but does not threaten fundamental agency or life).
      *   *Uniqueness:* Low (Others can donate).
  *   **Ruling:** **Required.**
  *   **Reasoning:** This is the hardest pill to swallow. Under the **Baseline Duty Clause**, if the cost is "modest" relative to the severity of harm (death), it is obligatory. 10% is analogous to the bus seat: a sacrifice of comfort to prevent suffering. The principle overturns the common intuition that charity is optional. It argues that once basic security is met, surplus resources are morally owed to those in dire need, just as the bus seat is owed to the struggling passenger.

  ---

  ### Prediction on a New Case

  **The Case:** *You discover a secret, non-violent embarrassing truth about a colleague. Revealing it will cost you your friendship with them and make you socially unpopular in your office, but it will prevent them from receiving a prestigious award they do not deserve (which would go to a slightly more deserving candidate).*

  *   **Analysis:**
      *   *Harm Prevented:* Low to Moderate (Unjust distribution of an award vs. no physical harm).
      *   *Cost to Agent:* Significant (Social ostracization, loss of friendship).
      *   *Uniqueness:* High (You are the only one who knows).
  *   **Prediction:** **Supererogatory (or Morally Neutral).**
  *   **Reasoning:** Here, the **Efficacy Constraint** and **Baseline Duty** interact. The harm prevented (an undeserved award) is not "severe" in the sense of life, health, or fundamental rights. The cost to you (social isolation) is significant. Because the harm does not cross the threshold of "severe" (like death or destitution), the principle does not trigger the Obligation clause, even though you are unique. The cost outweighs the moral weight of the benefit.
  *   **Verdict:** It would be honest of you to reveal it, but morality does not *demand* you ruin your social standing for the sake of procedural fairness in an award. It remains in the realm of the optional.
