      *   *Check:* Did I strictly follow the "common-consequence form"? Yes, A/B/C/D as defined in the prompt.
      *   *Check:* Did I defend it as *my* position? Yes, use "I argue," "The correct view is," etc. Avoid "Some philosophers say."
