          *   Gamble B: 0.89 $\to$ \$1M (Outcome $x$), 0.10 $\to$ \$5M (Outcome $y$), 0.01 $\to$ \$0 (Outcome $z_{regret}$)
          *   Gamble C: 0.11 $\to$ \$1M (Outcome $w$), 0.89 $\to$ \$0 (Outcome $z_{neutral}$)
          *   Gamble D: 0.10 $\to$ \$5M (Outcome $y$), 0.90 $\to$ \$0 (Outcome $z_{neutral}$)
      *   *Wait, to make Independence hold, the common consequence must be identical.*
      *   In the standard violation, we cancel the 0.89 probability of \$1M.
      *   If we individuate finely, does the 0.89 \$1M in B match the 1.00 \$1M in A? Yes, usually.
      *   The crux is the \$0 outcome. In B, \$0 implies missing out on the sure thing. In C/D, \$0 is just losing a gamble.
      *   So, let $u(\$1M) = u_1$, $u(\$5M) = u_5$.
      *   Let $u(\$0 | \text{missed sure thing}) = u_{0R}$ (Regret).
      *   Let $u(\$0 | \text{no sure thing}) = u_{0N}$ (Neutral).
      *   *Preferences:*
          *   $A \succ B \implies u_1 > 0.89 u_1 + 0.10 u_5 + 0.01 u_{0R}$
          *   $D \succ C \implies 0.10 u_5 + 0.90 u_{0N} > 0.11 u_1 + 0.89 u_{0N}$
      *   *Simplifying:*
          *   (1) $0.11 u_1 > 0.10 u_5 + 0.01 u_{0R}$
          *   (2) $0.10 u_5 + 0.01 u_{0N} > 0.11 u_1$ (Subtract $0.89 u_{0N}$ from both sides of D>C inequality: $0.10 u_5 + 0.90 u_{0N} - 0.89 u_{0N} > 0.11 u_1 \implies 0.10 u_5 + 0.01 u_{0N} > 0.11 u_1$)
