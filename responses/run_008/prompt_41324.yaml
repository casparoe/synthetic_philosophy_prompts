  3.  **Deconstruct Task 2: Unfalsifiability Objection:**
      *   *Objection:* If every violation can be fixed by renaming outcomes, EUT says nothing. It becomes a tautology.
      *   *Defense:* Need constraints on individuation.
      *   *Constraint Proposal:* "Description Invariance across Gambles." An outcome description cannot depend on the probability distribution of the specific gamble it is embedded in, *except* where the choice context itself alters the phenomenological experience of the outcome (like regret).
      *   *Better Constraint:* The "Intrinsic Description Constraint." Outcomes must be described by intrinsic properties of the agent's state (wealth, psychological state) that are causally produced by the outcome, not by the *structure* of the unchosen option.
      *   *Wait, regret IS about the unchosen option.* So I need to be careful.
      *   *Refined Constraint:* Outcomes can include psychological states (regret), but these states must be *consistent* across identical choice situations. We cannot simply label outcomes $O_1$ and $O_2$ arbitrarily to fit the math. The description must be fixed *ex ante*.
      *   *Specific Constraint:* **The Causal/Phenomenological Constraint.** An outcome description may include psychological states (like regret) only if those states are a necessary phenomenological consequence of the outcome *given the choice context*. However, we cannot individuate outcomes based *solely* on which gamble they belong to (e.g., "Outcome X in Gamble A" vs "Outcome X in Gamble B" is forbidden unless there is a phenomenological difference).
      *   *Blocking Unfalsifiability:* This prevents trivial redescriptions. For example, if I prefer Red over Blue in one context and Blue over Red in an identical context, I can't just say "Red-in-Choice-1" has higher utility than "Red-in-Choice-2". The physical/phenomenological description must be the same.
      *   *Remaining Irrationality:* Cycle preferences (A > B > C > A) cannot be fixed by individuation because the outcomes in the cycle are usually identical in description. If I choose A over B, B over C, C over A in pairwise choices with identical outcome descriptions, no amount of regret-labeling fixes the intransitivity. So EUT is still falsifiable by intransitivity.

