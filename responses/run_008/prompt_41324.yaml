      *   *Stance:* Yes, it retains authority, but its scope is clarified. It governs rational choice over *fully described* states of the world.
      *   *Implication:* The normative claim is: "If you agree that two outcomes are identical in all relevant respects (including psychological), you must treat them identically in calculation."
      *   *What could turn out false?* The claim that agents *can* or *should* deliberate using these finely individuated outcomes. Or, more strongly, that there exists a stable utility function over these fine-grained outcomes that predicts future choice. If preferences shift wildly based on framing even when the "regret" structure is identical, EUT fails.
      *   *Decision:* I will argue the rehabilitation succeeds. Independence remains the core norm of consistency. The "falsehood" that could emerge is the claim that human psychology actually stabilizes around these fine-grained descriptions sufficiently to allow prediction. But normatively, if you accept the descriptions, you must accept the axiom.

