      *   **The Twist:** The Weedpatch government camp functions like a "club" (self-governance, rules, exclusion of disruptors), seemingly vindicating the "freedom of association" argument the student is critiquing, but in a progressive context.
      *   **Constraints:** Don't fake quotes/page numbers. Work from common knowledge of scenes. Acknowledge the book's resistances (idealized "we," Rose of Sharon's radical ethics, scarcity question).
      *   **Goal:** Provide a reading for the chapter, identify 2-3 key scenes, and articulate what the novel adds to the theoretical debate.

  2.  **Deconstruct the Theoretical Tension:**
      *   *Theory A (Exclusionist/Club Model):* States (or associations) have a right to exclude to preserve culture, institutions, or wages. (Wellman, Walzer, etc.)
      *   *Theory B (Open Borders/Need Model):* Exclusion requires heavy justification; basic need trumps association. (Carens, etc.)
      *   *The Steinbeck Complication:* California excludes citizens (undermining cultural/sovereignty arguments, pointing to class/property). Weedpatch excludes *within* the migrant group (upholding association/self-governance, but based on democratic consent, not property).
      *   *The Core Insight:* The novel suggests the *right to exclude* is not inherent to sovereignty or culture, but is a function of *power dynamics* regarding resources. When the excluded organize democratically (Weedpatch), exclusion becomes protective rather than oppressive.

  3.  **Select Key Scenes:**
      *   *Scene 1: The Border/Arrival.* Needs to show the "internal border" dynamic. The handbill flyers, the hostility at the Colorado River/California line, the "No Job" signs. This establishes the exclusionary mechanism without foreignness.
      *   *Scene 2: The Hooverville vs. Weedpatch.* Contrast the vigilante violence/destruction of the squatter camps with the self-governance of the federal camp. This highlights the "Club Theory" twist.
