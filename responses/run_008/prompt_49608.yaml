      *   **Scene 2: Weedpatch vs. Hooverville (The Camp Chapters).** Focus on the Central Committee. Shows "freedom of association" works only when power is equalized.
      *   **Scene 3: The Barn Ending.** Focus on the breach of boundaries. Shows the limit of the club model.
