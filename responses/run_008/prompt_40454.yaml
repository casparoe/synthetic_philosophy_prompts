answer: |-
  Dear Friend,

  I have spent some time with the argument your reading group member has constructed, and I share your unease. It is a beautifully tight piece of reasoning, which is precisely what makes it so dangerous. It has the seductive quality of a paradox where every step seems to follow inevitably from the last, yet the conclusion is something we know cannot be true. You are right to suspect that the route proves too much, and you are also right to feel stuck on the second premise. After turning it over carefully, I am convinced that the false step lies precisely in premise two, the claim that a consideration counts in favour of an option only if it counts against the alternatives. This premise looks acceptable because it captures a specific intuition about what guidance feels like, but it ultimately conflates the function of justifying a choice with the function of distinguishing it.

  The reason premise two feels so compelling is that we tend to model deliberation on the image of a weighing scale. When we deliberate, we put reasons on one side and counter-reasons on the other, and we expect the pan to drop. If the pans remain level, it feels as though no force is being exerted, and thus no guidance is being offered. Your colleague argues that a consideration that applies equally to all options is like gravity acting on both pans equally it holds them down, but it does not tip the scale. Therefore, it seems, it cannot be the reason for the scale tipping one way. However, this metaphor misleads us about the nature of rational sufficiency. A reason does not need to be a tie-breaker to be a reason. It needs only to make an option choiceworthy. If I am hungry and the left bale is hay, I have a reason to eat the left bale. The fact that the right bale is also hay and would also satisfy my hunger does not negate the reason provided by the left bale it merely means I have an equally good reason for the right bale. The reason counts in favour of the left bale successfully, even if it also counts in favour of the right bale. Premise two demands that reasons be exclusive differentiators, but in reality, reasons are often shared justifiers.

  If you accept this correction, the rest of the argument collapses. The ass does have a reason to choose the left bale, namely that it is hay and the ass is hungry. It also has a reason to choose the right bale. These reasons are equal in force, but they are not absent. Consequently, premise five, which claims that choosing without a reason is arbitrary and irrational, no longer applies. The ass is not choosing without a reason it is choosing between two options both supported by sufficient reasons. The choice is underdetermined by reason, but it is not unsupported by reason. This distinction saves us from the absurd conclusion that everyday choices between equivalent options are irrational. When you choose between two restaurants that seem equally good, you are not acting arbitrarily in the pejorative sense of having no justification you are acting on the justification that both are good, and you must eat. The selection within the set of equally justified options is not a failure of rationality but a necessary completion of it.

  Now let us price the alternatives, as you asked, to see what is at stake. If your colleague is right and reason runs out in ties, he preserves the strict definition of reasons found in premise two. He keeps the intuitive idea that reasons must distinguish options to guide us. However, the cost is high. He must accept that practical rationality is incomplete. There are vast swathes of human decision-making, from trivial choices like which sock to put on first to significant ones like choosing between identical job offers, where reason falls silent. In these gaps, action is neither rational nor irrational it is arational. This makes rationality a far weaker guide than we typically assume. It implies that the more perfectly rational an agent is, the more likely they are to freeze when faced with symmetry, which contradicts our understanding of rationality as a capacity for effective agency. Your colleague saves the purity of the definition of reasons but sacrifices the completeness of rationality.

  If you cling to premise two, as you feared, you are forced to convict yourself of irrationality whenever you face a tie. This is the cost you rightly identified. It makes rationality overly demanding, requiring distinctions where none exist. It turns the limitations of the world into defects of the agent. However, if you reject premise two, as I recommend, you must swallow a revised theory of reasons. You have to accept that reasons do not always function by excluding alternatives. You must accept that a reason can be valid for an option even if it is equally valid for another. This might feel like it dilutes the concept of guidance, but it actually enriches it. It allows us to see that reason guides us to a set of permissible options, and once we are within that set, any choice is rational. You give up the idea that reasons must be unique tie-breakers, but you keep the idea that rational agents can act without starving.

  In the end, the error is a category mistake in premise two. It treats all reasons as if they were comparative weights, when many are actually qualifying conditions. The ass does not need a reason to choose the left bale rather than the right it needs a reason to choose the left bale rather than nothing. It has that reason. The symmetry of the situation means reason does not dictate which bale, but it does dictate that a bale be chosen. To say reason runs out is to say that the instruction eat hay is incomplete until it specifies which hay, but surely the instruction is complete once the hay is identified as such. I hope this helps you push back in your next meeting. The argument is elegant, but it demands a price for that elegance that our actual lives cannot pay.

  Warmly,

  Your Friend
