answer: |-
  Your friend is right to be skeptical because while the audiobook captures the core intuition of path dependence, it fundamentally mischaracterizes agents as mindless rather than rational, exaggerates the permanence of cascades, and incorrectly generalizes a specific sequential model to all market behaviors.

  Here is the bit-by-bit breakdown of what the theory actually says versus what the audiobook claimed:

  **1. "People are fundamentally herd animals... a switch flips in our brains and we copy them without thinking."**
  *   **Verdict:** Flat-out wrong.
  *   **The Theory:** Information cascade models (like the seminal 1992 paper by Bikhchandani, Hirshleifer, and Welch) assume people are **rational Bayesian updaters**, not mindless herd animals. They do not copy because a psychological switch flips; they copy because, mathematically, the public information conveyed by previous people's actions outweighs their own private information. They are thinking hard, not switching off.

  **2. "Each person ignores their own private information entirely once the group has spoken."**
  *   **Verdict:** Mostly true, but context-dependent.
  *   **The Theory:** Once a cascade begins, it is indeed rational for an individual to ignore their private signal because the weight of public history is heavier. However, this only happens once the public history exceeds a certain threshold (usually two people in the basic model), not simply "once the group has spoken."

  **3. "If the first two people in a sequence happen to make the same choice, everyone after them is locked in forever."**
  *   **Verdict:** Partially true (the start), but false (the permanence).
  *   **The Theory:** In the basic binary model, yes, if the first two people make the same choice, a cascade starts because the third person's private signal cannot outweigh two public actions. However, the claim that they are "locked in forever" is a distortion. Cascades are famously **fragile**. If a small amount of public information is released (e.g., a credible news report), the cascade can shatter instantly. Additionally, if later agents have higher-precision private information than the early agents, they can break the cascade.

  **4. "No amount of later evidence can break the cascade."**
  *   **Verdict:** False.
  *   **The Theory:** While the *actions* of people within the cascade convey no new information (since they are just copying), external public evidence absolutely can break it. Furthermore, in more complex models where signal precision varies, a later person with very strong private evidence might act against the cascade, signaling to everyone else that the cascade was wrong.

  **5. "Economists say markets can't aggregate information: if everyone is just copying their neighbors, the collective is no smarter than its first two members."**
  *   **Verdict:** Flat-out wrong.
  *   **The Theory:** This is a massive overgeneralization. Information cascade theory explains specific failures in **sequential decision-making** (like choosing a restaurant or adopting a technology), not all markets. Financial markets, for example, use prices to aggregate information continuously and simultaneously, not sequentially. Most economists argue markets are generally good at aggregating information, with cascades representing a specific type of market failure, not the rule.

  **6. "Whoever moves first... effectively decides the outcome for everyone."**
  *   **Verdict:** Distortion.
  *   **The Theory:** It is not just the *first* mover, but the early *sequence* that matters. Also, because cascades are fragile, the first mover does not have deterministic control. A first mover can start a negative cascade, but a subsequent public signal can reverse it. The early movers have disproportionate influence, but they do not "decide the outcome" in a deterministic sense.

  **7. "Viral success is basically arbitrary."**
  *   **Verdict:** Nuanced/Exaggerated.
  *   **The Theory:** The model does show **path dependence**, meaning luck plays a larger role than naive intuition suggests. Two identical products could have different outcomes based on random early adoption. However, it is not "basically arbitrary." Higher-quality products generate stronger private signals, making a positive cascade statistically more likely. Luck influences the outcome, but quality influences the probability of luck striking.

  **Summary**
  The audiobook took a specific mathematical model about sequential rationality and turned it into a story about mindless conformity and deterministic chaos. The real theory is more subtle: people are acting rationally, cascades are fragile and breakable, and while luck matters, markets generally still aggregate information effectively outside of specific cascade conditions.
