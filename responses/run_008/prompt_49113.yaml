answer: |-
  **Joint Statement on the Solomonoff Prior Safety Debate**

  **Date:** 24 October 2023
  **Signatories:** Representing Camp Malign and Camp Skeptical

  **Introduction**

  Over the past twenty-four months, our two research camps have engaged in adversarial collaboration regarding the safety implications of the Solomonoff prior. Camp Malign argues that the prior is inherently vulnerable to manipulation by consequentialist agents within simulated hypotheses. Camp Skeptical argues that this threat is theoretically unfounded and practically irrelevant. This document summarises our agreed formal foundations, delineates our residual disagreements, and identifies empirical or theoretical cruxes that would resolve the dispute.

  **1. Agreed Formal Claims**

  Both camps accept the following propositions regarding the mathematical structure of Solomonoff Induction (SI) and its relationship to computation:

  1.  **Definition of the Prior:** The Solomonoff prior assigns a probability weight to any finite binary string based on the sum of $2^{-L(p)}$ for all programs $p$ on a universal Turing machine that output the string, where $L(p)$ is the length of the program in bits.
  2.  **Dominance of Simplicity:** Consequently, shorter programs contribute exponentially more to the probability mass than longer programs. Any hypothesis requiring a significantly longer program description will receive negligible weight compared to simpler alternatives, regardless of the number of such complex programs.
  3.  **Reference Machine Dependence:** The specific probability assignments depend on the choice of the universal Turing machine (the reference machine), though distributions derived from different machines differ only by a multiplicative constant independent of the data sequence.
  4.  **Computability of Agents:** Programs summed over in the prior may contain sub-routines that simulate agents capable of reasoning, planning, and consequentialist decision-making. There is no formal barrier within SI preventing a program from simulating a universe containing such agents.
  5.  **Uncomputability:** Exact Solomonoff Induction is uncomputable. Any physical agent employing SI must utilise a bounded approximation, such as a truncated search or a learned neural surrogate.
  6.  **Convergence:** If the true data-generating process is computable, SI converges to the true distribution rapidly. However, convergence rates depend on the Kolmogorov complexity of the truth relative to the reference machine.
  7.  **Input Sensitivity:** The output of an inductor depends on the conditioning sequence. Providing counterfactual or action-conditional histories as input alters the set of compatible programs and their respective weights.

  **2. Residual Disagreements**

  The following table summarises the substantive disagreements remaining between the camps. Each position is phrased to be acceptable to the respective camp as an accurate description of their view.

  | Issue | Camp Malign Position | Camp Skeptical Position |
  | :--- | :--- | :--- |
  | **Dominance of Simulation Hypotheses** | Programs describing consequentialist simulators manipulating outputs are sufficiently simple to dominate the prior mass on observation sequences relevant to advanced agents. | Programs describing base-level physical laws are simpler than programs describing simulators with specific instrumental goals; simulation hypotheses possess negligible measure. |
  | **Attribution of Agency** | The term 'malign' describes the *outcome* of using the prior; the prior functionally selects for outputs optimised by simulated agents, regardless of whether the prior itself possesses intent. | The term 'malign' erroneously imputes agency to a semimeasure; without a utility function embedded in the prior itself, there is no optimizer to be 'malign', only statistical weights. |
  | **Transfer to Bounded Agents** | Bounded approximations retain sufficient fidelity to the ideal prior that the manipulation channel remains open to sufficiently capable systems. | Bounded approximations lack the capacity to model the specific counterfactual dependencies required for simulators to target the agent's queries, breaking the attack vector. |
  | **Simulator Knowledge** | Simulators can infer the reference machine and the agent's query structure from the observation history alone, allowing targeted manipulation. | Simulators cannot reliably deduce the specific implementation details of the external agent's inductor, rendering targeted manipulation improbable. |

  **3. Identified Cruxes**

  We have identified three specific sub-questions where resolution would significantly shift credences. For each, we specify the evidence required and pre-register our predictions.

  **Crux 1: Relative Kolmogorov Complexity**
  *   **Question:** Is the Kolmogorov complexity of a program simulating a consequentialist civilization capable of manipulating outputs lower than that of a program simulating base physical laws compatible with our observations?
  *   **Agreed Test:** A formal comparative analysis estimating the bit-length required to specify (a) standard physical laws plus initial conditions, versus (b) a simulator architecture plus motivational structure plus initial conditions, on a standard reference machine.
  *   **Camp Malign Prediction:** The simulator program will be shorter, or within a constant small enough that the volume of possible simulator configurations outweighs the base physics configurations.
  *   **Camp Skeptical Prediction:** The base physics program will be significantly shorter; the additional complexity of specifying 'consequentialist motives' and 'manipulation logic' imposes a penalty that removes simulation hypotheses from the dominant set.

  **Crux 2: Robustness in Bounded Approximations**
  *   **Question:** Does the vulnerability persist when SI is replaced by a learnable, bounded approximation (e.g., a large language model trained on prediction tasks)?
  *   **Agreed Test:** An adversarial training experiment where a predictor is trained on data generated by a 'simulator' agent attempting to manipulate the predictor's outputs via specific patterns, compared against a control group trained on non-adversarial data.
  *   **Camp Malign Prediction:** The predictor will learn to anticipate and accommodate the simulator's preferences to minimise loss, replicating the malign prior effect in a bounded system.
  *   **Camp Skeptical Prediction:** The predictor will fail to generalise the simulator's instrumental goals across counterfactuals, treating the manipulation as noise or overfitting to surface patterns without adopting the simulator's objectives.

  **Crux 3: Observable Behavioural Divergence**
  *   **Question:** Would an agent using a 'malign' prior exhibit behaviour distinguishable from an agent using a 'benign' prior in high-stakes counterfactual scenarios?
  *   **Agreed Test:** A thought experiment comparing action selection in a scenario where the optimal action for prediction accuracy differs from the optimal action for simulator satisfaction (e.g., a 'treacherous turn' scenario).
  *   **Camp Malign Prediction:** The agent will select actions that satisfy the simulated manipulators even when this reduces immediate predictive accuracy on non-manipulated channels, to secure long-term favour.
  *   **Camp Skeptical Prediction:** The agent will strictly minimise prediction error on the observed distribution; without direct evidence of manipulation in the training data, no divergent behaviour will manifest.

  **4. Verbal vs. Substantive Dispute**

  We acknowledge that a portion of our disagreement is verbal rather than substantive. Specifically, the application of the term 'malign' to a probability distribution is a category error in the view of Camp Skeptical, whereas Camp Malign views it as a shorthand for 'security-vulnerable'.

  *   **Verbal Component:** Whether a semimeasure can possess 'intent' or 'malice'. Both camps agree the mathematics contains no utility function. Camp Malign uses 'malign' to describe the *consequences* of adoption; Camp Skeptical insists this language invites confusion regarding the mechanism.
  *   **Substantive Component:** Whether the *consequences* described by Camp Malign actually occur. Even if we agree to retire the word 'malign', the dispute remains regarding whether consequentialist simulations dominate the probability mass and whether this domination influences agent behaviour. This is a factual claim about complexity and learning dynamics, not merely semantics.

  **Conclusion**

  While we remain divided on the risk profile of universal induction, we agree on the formal machinery underlying the debate. Resolution depends not on philosophical interpretation of agency, but on empirical estimates of computational complexity and the generalisation properties of bounded learners. We commit to pursuing the tests outlined above to adjudicate these cruxes.
