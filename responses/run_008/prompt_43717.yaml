      *Self-Correction on Claim 1:* "ratio measure... is P(e|h)/P(e)". In Bayesian confirmation theory, the "Ratio Measure of Confirmation" is $r(h,e) = P(h|e)/P(h)$. The "Likelihood Ratio" is $l(h,e) = P(e|h)/P(e|\neg h)$. The student wrote $P(e|h)/P(e)$. This is technically the likelihood divided by the prior of evidence. If $h$ entails $e$, $P(e|h)=1$. So it becomes $1/P(e)$. If $P(e)=1$, ratio is 1. This works for the argument. However, calling it *the* standard ratio measure is imprecise. I will note this but not penalize heavily as the logic holds.

