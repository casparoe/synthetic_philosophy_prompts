      *Wait, one check on the "New Archival Work".* Goldhagen's original work was criticized for cherry-picking. If Professor K claims *new* archives, the trap is to ask for a specific document that *only* supports his view and not Browning's. I'll add that to the brainstorm.

      *Check on Milgram:* If he dismisses Milgram, the follow-up needs to be: "If psychology doesn't apply, why do we see similar patterns in Rwanda or Cambodia?" That universalizes the situational argument.

