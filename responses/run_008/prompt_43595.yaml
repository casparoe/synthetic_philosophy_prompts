answer: |-
  1. Let's start with the physical duplicate—the zombie who lacks qualia but behaves exactly like you. When he says "I'm seeing red," his utterance is caused entirely by physical brain states. When you say it, you say the cause is also entirely physical brain states. So what makes your utterance a judgment *about* an experience, while his is just noise? If the causal history is identical, where does the "aboutness" come from?

     **Follow-up:** I expect you'll say the content is fixed by the functional role of the judgment, not the cause. But your duplicate shares that exact functional role. If functional role determines content, doesn't his utterance also refer to experience? And if so, how can it refer to something that isn't there?

  2. You argue that brain states cause us to report qualia, even though qualia don't cause the reports. But why does a specific brain state hook up to the report "I see red" rather than "I see blue"? If the qualia themselves are causally idle, what anchors the specific quality of the experience to the specific content of the speech act?

     **Follow-up:** You might say the brain state covaries with the red qualia, so the judgment is indirectly about them. But covariance isn't reference. If the qualia drop out of the causal chain, doesn't the link between the physical state and the *phenomenal* content sever completely?

  3. Let's talk about your belief in epiphenomenalism itself. You believe "qualia exist." But on your view, that belief is caused by neural events that would fire identically even if qualia didn't exist. So what evidential relation does your belief actually bear to the qualia it's supposedly about? Why isn't it just a caused state with no connection to the truth?

     **Follow-up:** If you reply that the belief is a functional state that tracks truth, I'd ask: tracks it how? If the physical world is closed, the functional state tracks physical variables, not phenomenal ones. How does a physical tracker lock onto a non-physical property without any causal contact?

  4. Following on that, if the causal story never needs the qualia, is there any coherent way for you to claim you *know* they exist? Usually, knowledge requires some kind of causal contact or reliable indication. If the qualia are invisible to the physical machinery generating your knowledge claims, aren't you cut off from them epistemically?

     **Follow-up:** You often suggest we have direct acquaintance that bypasses standard causal chains. But if that acquaintance doesn't influence the brain state producing the claim "I am acquainted," how do you distinguish actual acquaintance from a brain state that merely simulates it?

  5. This leads to the worry that your view is self-defeating. If the physical facts explain why you believe in qualia, and the physical facts would be the same without qualia, then the existence of qualia adds nothing to the explanation of your belief. Why should anyone accept a theory that makes its own acceptance inexplicable?

     **Follow-up:** You might say rationality is a matter of functional coherence, not causal efficacy. But if a zombie is functionally coherent without qualia, then qualia aren't doing the work of making you rational. So why trust the judgment of a system that works just as well without the thing it's judging?

  6. I want to press on the scientific status of this. If qualia are causally idle, they make no difference to any observation we can make. Does that mean your view is observationally unfalsifiable by construction? If nothing could count against it, are we still doing empirical philosophy?

     **Follow-up:** If you say it's an inference to the best explanation of the physical data, I'd ask: how is it the *best* explanation if it posits entities that do no explanatory work? Usually, we trim entities that don't push anything around.

  7. So if it's not strictly empirical, what kind of thesis is it? Is it a metaphysical necessity? If so, why ground it in the contingency of physical closure? It seems like you're using a empirical premise (physics is closed) to secure a metaphysical conclusion (qualia are idle) that renders the empirical premise unable to detect the conclusion.

     **Follow-up:** You might say it's a conceptual truth about the nature of experience. But if it's conceptual, why does it rely so heavily on the current state of physics? If physics changed and allowed mental causation, would qualia suddenly become causal?

  8. Consider evolution. If qualia have no causal power, they can't be selected for. So our tendency to talk about them, value them, and build theories around them must be a byproduct of something else. Why should we trust a cognitive mechanism that evolved to track survival, not truth about idle properties?

     **Follow-up:** You'll likely say the mechanism tracks physical survival, and the qualia talk is just a side effect. But if the talk is a side effect, why think it's true? Evolution doesn't guarantee true beliefs about useless byproducts, only useful behaviors.

  9. When you say "I have a headache," you treat that as a report on a private event. But if the event doesn't cause the report, isn't the report essentially noise that happens to correlate with the event? It's like a thermometer that changes reading because of a battery, not the temperature, even if the reading matches the temperature.

     **Follow-up:** If you argue the judgment is a functional state that represents the qualia, I'd ask: represents them how? Representation usually requires a causal or counterfactual dependence. If the qualia vanish but the functional state remains, the representation persists. That suggests it wasn't representing the qualia at all.

  10. Ultimately, when you judge "I am in pain," is that judgment true because of the pain or because of the brain state? If you say the brain state makes it true, then the pain is redundant. If you say the pain makes it true, then the pain must be able to determine the truth value of physical statements. How do you split that difference without contradiction?

      **Follow-up:** You might say the pain is the truth-maker while the brain state is the cause of the belief. But if the truth-maker never interacts with the belief-forming mechanism, how do you avoid skepticism? You're left with a belief that happens to be true, but not one you could ever have reason to hold.
