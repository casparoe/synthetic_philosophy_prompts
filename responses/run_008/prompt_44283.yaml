      *   *Harm Principle (anticipating Mill):* Law should only intervene to prevent harm to others (though Bentham was more nuanced about "offense" and "security").
      *   *Sexual Morality:* Bentham was radically liberal for his time. He argued against punishing sodomy (male homosexuality) because it was consensual and produced no clear victim (*Essay on Paederasty*, *Of Sexual Irregularities*).
