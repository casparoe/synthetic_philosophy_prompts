      *   *User's claim:* "Harsanyi... sidesteps the comparability problem rather than presupposing a solution."
      *   *Correction:* This is the flatmate's likely objection. Harsanyi *presupposes* that the vNM utilities of different agents can be summed. If $U_1$ is in "decibels" and $U_2$ is in "meters," summing them is nonsense. Harsanyi needs an normalization condition.
