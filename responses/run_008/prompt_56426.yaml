          *   Rank 1: The Fatal Contradiction (IUC Skepticism vs. Practice).
          *   Rank 2: The Harsanyi Illusion (Does it solve comparability?).
          *   Rank 3: The Intra-personal Red Herring (1 vs 6).
          *   Recommendations/Paths Forward (How to fix the position).

      *   *Refining the Harsanyi Point:* I need to be precise. Harsanyi's Aggregation Theorem assumes individual utilities are fixed. The *Impartial Observer* argument is what tries to set the scales. But the Impartial Observer argument requires that "being Person A" and "being Person B" are comparable states. If identity affects the *scale* of utility, the argument fails. This is the "unit comparability" issue.
