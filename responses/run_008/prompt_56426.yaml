          *   *Analysis:* Harsanyi's theorem proves $W = \sum a_i U_i$. But if $U_i$ can be rescaled arbitrarily (per (2)), then $W$ changes unless $a_i$ adjusts perfectly to counteract it. But where do the $a_i$ come from? Harsanyi's "impartial observer" argument (which blends into (5)) tries to fix the weights/scales by saying "equal probability." But to say "equal probability" implies the units of utility are comparable. If my "util" is 1000x bigger than yours, equal probability doesn't lead to simple summation.
