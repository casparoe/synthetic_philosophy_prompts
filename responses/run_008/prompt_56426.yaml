          3.  *Consequentialism in Practice:* Donates effectively, supports QALYs, supports progressive tax (via diminishing marginal utility of income).
          4.  *Harsanyi:* Aggregation theorem justifies utilitarianism. Assumes it sidesteps comparability issues.
          5.  *Veil of Ignorance:* Right way to think about impartiality/donation.
