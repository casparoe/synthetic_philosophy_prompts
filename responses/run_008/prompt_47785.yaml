answer: |-
  Here is a design for your 75-minute session, tailored to your constraints and pedagogical goals.

  ### Session Title: The Case of the Wilted Zucchini
  **Topic:** Causation by Omission
  **Time:** 75 Minutes
  **Participants:** 14 Adults (Mixed levels)
  **Materials Needed:** Whiteboard/markers, 14 printed "Case Briefs," 14 printed "But-For Cards," a timer.

  ---

  ### Part 1: The Setup (10 Minutes)
  **Goal:** Establish the harm and the "But-For" test without using philosophical jargon.

  1.  **The Hook (3 mins):** Do not mention causation yet. Tell the story:
      > "Mrs. Gable grew a prize-winning zucchini. It was worth $500. On July 1st, it died of thirst. The soil was bone dry. No water touched it for two weeks."
  2.  **The Rule (2 mins):** Hand out the **But-For Card**. It reads:
      > **THE GOLDEN RULE:** A person (or thing) is a cause of the harm if, *had they acted differently*, the harm would not have happened.
      > *Example: If the rain had fallen, the plant would live. Therefore, the rain is a candidate.*
  3.  **The Division (5 mins):** Split the room.
      *   **Group A (5 people):** Advocates for **Mrs. Gable** (The Owner). *Fact: She went on vacation and didn't water it.*
      *   **Group B (5 people):** Advocates for **Mr. Nextdoor** (The Neighbor). *Fact: He saw it wilting, had a hose, but didn't water it.*
      *   **The Jury (4 people):** Their job is to assign "Causal Percentage." If Group A proves Mrs. Gable caused it, they get %. If Group B proves Mr. Nextdoor caused it, they get %. The total must equal 100%.

  ### Part 2: Round One — The Intuitive Cut (20 Minutes)
  **Goal:** Participants discover that omissions pass the causal test, but they instinctively prune the list based on duty.

  1.  **Preparation (5 mins):** Groups A and B review their briefs. They must construct an argument using *only* the Golden Rule.
      *   *Group A Prompt:* Argue why Mrs. Gable is the cause. (Easy: It's her plant).
      *   *Group B Prompt:* Argue why Mr. Nextdoor is *also* a cause. (Harder: You must prove that if he *had* watered it, it would have lived).
  2.  **The Tribunal (10 mins):**
      *   Group A presents. Jury votes a percentage (e.g., 100%).
      *   Group B presents. They use the Golden Rule: "If Mr. Nextdoor watered it, it lives."
      *   **The Conflict:** The Jury must now apportion. If they give Mrs. Gable 100%, they must explain why Mr. Nextdoor's "But-For" status doesn't count. If they split it (50/50), ask them why.
  3.  **The Board (5 mins):** Write the percentages on the board. Ask the Jury: "Did Mr. Nextdoor's inaction satisfy the Golden Rule?" (They will say yes). "So why isn't he 100%?" (They will say: "It wasn't his job.")
      *   *Facilitator Note:* Do not validate this yet. Just write "Job/Norm?" on the board next to the percentages.

  ### Part 3: Round Two — The Explosion (25 Minutes)
  **Goal:** Force the "Explosion of Eligible Omissions." Show that consistent application of the Golden Rule breaks the budget of 100%.

  1.  **The New Evidence (5 mins):** Hand the Jury four new cards. These are **Remote Non-Actors**.
      *   **The Cloud:** Did not rain.
      *   **The City:** Did not fix the broken fire hydrant on the corner (which prevented the fire truck from filling a tank to water it).
      *   **The Queen:** Did not send a royal tanker of water.
      *   **Everyone Else:** Every other person in the city who did not bring a water bottle to the garden.
  2.  **The Challenge (10 mins):** The Jury must apply the Golden Rule to these new cards.
      *   Ask: "If the Cloud had rained, would the plant live?" (Yes).
      *   Ask: "If the Queen had sent water, would the plant live?" (Yes).
      *   *Constraint:* The Jury must assign causal percentages to these new actors. The total on the board must still equal 100%.
  3.  **The Breakdown (10 mins):** The math will fail. If the Cloud is a cause, it takes a %. If the Queen is a cause, she takes a %.
      *   Watch them resist. They will say, "That's silly."
      *   **Your Move:** Point to the Golden Rule. "You used this rule to judge Mrs. Gable. Does the rule change for the Queen? If not, she is a cause. If she is a cause, where does her percentage come from?"
      *   *Desired Outcome:* The group realizes they are no longer measuring *physics* (what made the plant die); they are measuring *expectations* (who was supposed to save it).

  ### Part 4: Debrief & Mapping (20 Minutes)
  **Goal:** Translate the frustration into philosophical concepts without lecturing.

  1.  **The Map (10 mins):** Draw three columns on the board based on their comments during the activity.
      *   **Column 1: "What if?"** (Counterfactual Dependence). This is the Golden Rule. Point out that the Queen and Mrs. Gable are equal here.
      *   **Column 2: "Too Many Causes."** (The Profligacy Problem). This is the math breaking in Round 2. There are infinite things that *didn't* happen that would have saved the plant.
      *   **Column 3: "Who Should Have?"** (Normative Selection). This is the "Job/Norm?" note from Round 1.
  2.  **The Takeaway (5 mins):** Ask: "Is 'Causation' just about what physically happened, or is it secretly about what we expect people to do?"
      *   Let them sit with the silence. There is no right answer in the room.
  3.  **Closing (5 mins):** Acknowledge the tension.
      > "We want causation to be a fact about the world, like gravity. But today, you found that to make sense of it, you had to import rules about duty and expectation. You pruned the list not because the physics changed, but because the *people* changed."

  ---

  ### Predictable Failure Points & Mitigation

  **1. The "Blame" Conflation (High Confidence)**
  *   **What will go wrong:** Participants will insist Mr. Nextdoor isn't a cause because he isn't *to blame*. They will conflate moral responsibility with causal contribution.
  *   **How to handle:** Gently separate them. "I'm not asking if he's a bad neighbor. I'm asking if the plant died *because* he didn't water it. If he had walked over and poured a cup of water, would the plant be alive? If yes, his absence is a cause. Whether he's *guilty* is a different question."
  *   **Confidence:** High. This is the standard reaction in legal and philosophical contexts.

  **2. The "Silly" Dismissal (Medium Confidence)**
  *   **What will go wrong:** In Round 2, the group will laugh off the Queen or the Cloud. They will refuse to engage with the logic, calling it a "joke."
  *   **How to handle:** Use the "Golden Rule" as a rigid constraint. "I know it feels silly. But if we throw out the rule for the Queen, we have to throw it out for Mrs. Gable. Do you want to change the rule, or accept the result?" Force them to admit they are changing the rule based on norms.
  *   **Confidence:** Medium. Depends on the group's willingness to play along.

  **3. Time Creep (High Confidence)**
  *   **What will go wrong:** Round 1 will take too long as they debate the Neighbor's duty. Round 2 will get rushed.
  *   **How to handle:** Be a strict timekeeper. Use a visible timer. If Round 1 drags, cut the Jury deliberation short and move to Round 2 immediately. The "Explosion" is the more important philosophical moment.

  ---

  ### What This Activity Cannot Reproduce

  You asked for honesty about the limits of the design.

  **The Metaphysical Discomfort (High Confidence)**
  This activity successfully demonstrates the *pragmatic* problem (too many causes to count) and the *normative* solution (we prune based on duty). It does **not** reproduce the deeper metaphysical itch: the question of whether an absence is a *real thing* capable of causing anything at all.
  *   **The Gap:** The participants will feel that calling the Queen a cause is *unfair* or *impractical*. They likely will not feel that it is *ontologically impossible*. They won't necessarily wrestle with whether "nothingness" can push "somethingness."
  *   **Your Burden:** You must supply this in the Debrief. You will need to articulate: "Some philosophers argue that if we have to rely on norms to pick a cause, then 'causation by omission' isn't a feature of the universe, but a feature of our language. The universe just has events. We add the 'non-events'." The role-play shows the *consequence* of this view, but not the *feeling* of the void itself.

  ---

  ### The Least Sure Point (Backup Plan)

  **The Transition from Round 1 to Round 2 (Low Confidence)**
  I am least sure that the group will feel the *logical consistency* requirement between Round 1 and Round 2. They may simply treat Round 2 as a new game where "obviously the Queen doesn't count," without realizing they are violating the logic they just used to convict Mrs. Gable. If they don't feel the contradiction, the tension evaporates.

  **Backup Plan:**
  If they dismiss the Queen/Cloud immediately without struggle, stop the activity. Introduce the **"Universal Waterer"** hypothetical.
  *   *Say:* "Imagine a world where everyone is responsible for every plant they see. In that world, is the Queen a cause?" (They will say yes).
  *   *Then:* "What changed between that world and this one? Did the physics of the plant change? No. Only the *rules* changed."
  *   *Why:* This forces the realization that the *causal status* is shifting based on *social rules*, which is the core philosophical insight you want them to feel.

  ---

  ### Confidence Ratings on Substantive Claims

  1.  **Claim:** Participants will conflate blame and causation.
      *   **Confidence:** **High.** This is a robust finding in experimental philosophy (Knobe Effect adjacent).
  2.  **Claim:** The "But-For" test will logically force them to include the Queen/Cloud.
      *   **Confidence:** **Medium.** It depends on them accepting the counterfactual premise. Some may argue "The Queen sending water is too improbable," which introduces probability into the counterfactual. You must insist on "If she *had*..."
  3.  **Claim:** The session will leave them with a sense of unresolved tension rather than a solution.
      *   **Confidence:** **High.** The problem of omission is famously unsolved in metaphysics. The activity mirrors the literature's stalemate.
  4.  **Claim:** The activity will help you process your own case.
      *   **Confidence:** **Medium-High.** Seeing others struggle with the same arbitrary line-drawing can be validating, but it may also be frustrating if you seek a definitive answer that vindicates your position.

  ### Final Note on American English
  I have ensured all spelling and terminology aligns with American standards (e.g., "apportion" rather than "allocate," "defense" rather than "defence," "program" rather than "programme"). The tone is direct and pragmatic, fitting the adult-education context.
