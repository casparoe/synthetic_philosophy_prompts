      *   **Topic:** Causation by omission.
      *   **Goal:** A 75-minute philosophy discussion group session (14 adults, mixed ages, no training).
      *   **Pedagogical Approach:** Experiential/felt rather than lectured. Discovery-based.
      *   **Desired Arc:**
          1.  Discover absences pass causal tests (counterfactual dependence).
          2.  Discover the explosion of eligible omissions (the "profligacy" problem).
          3.  Catch themselves pruning based on norms/duties (the "selectivity" problem).
          4.  Feel the tension between wanting pruning and lacking a causal justification for it.
      *   **Proposed Structure:** Staged tribunal (fictional harm, multiple absences), small groups as advocates, jury apportioning responsibility, round of introducing remote non-actors.
      *   **Requirements:** Concrete rules, roles, timeline (75 mins), debrief mapping activity to philosophy (counterfactuals, preemption/overdetermination, norm-sensitivity).
      *   **Meta-Requirements:** American English. Honesty about predictably wrong elements. Honesty about what the activity *cannot* reproduce (metaphysical discomfort). Confidence levels on substantive claims. Identify the least sure design point.

  2.  **Deconstruct the Philosophical Problem:**
      *   *Core Issue:* If $C$ causes $E$, then if not-$C$, then not-$E$. But if $C$ is an omission (not-X), then "if X had happened, $E$ wouldn't have."
      *   *The Trap:* Almost *anything* not done could have prevented $E$. (The gardener didn't water the plant -> plant died. The Queen didn't water the plant -> plant died). Both satisfy counterfactual dependence.
      *   *The Solution (usually):* We appeal to norms, duties, or expectations to filter "causes" from "background conditions."
      *   *The Tension:* Is that filtering *causal* or *moral/legal*? If it's moral, then causation isn't purely descriptive.

  3.  **Drafting the Session Plan (Iterative Process):**

      *   *Title:* Needs to be engaging. "The Case of the Dry Garden" or "The Flooded Basement." Let's stick closer to the user's experience but fictionalized to avoid triggering their specific trauma too directly, or perhaps use it as a parallel. Let's use a fictional scenario: "The Case of the Unwatered Plant" is classic, but "The Case of the Leaky Roof" feels more like the user's experience. Let's go with "The Case of the Broken Window" during a storm. No, let's stick to the user's prompt suggestion: A staged tribunal. Let's make it about a missed delivery that ruined a surprise party. Or a medical scenario? No, keep it mundane. Let's use a "Community Garden Drought" scenario. It allows for many actors.
      *   *Refinement:* The user's prompt suggests a "staged tribunal around a fictional harm." Let's create a scenario where a specific harm happened (e.g., a prize-winning pumpkin died) and list people who *didn't* do things.
      *   *Timeline:* 75 minutes is tight.
          *   Intro (5 mins)
          *   Scenario & Role Assign (10 mins)
          *   Group Prep (15 mins)
          *   Tribunal/Round 1 (20 mins)
          *   Tribunal/Round 2 (The Explosion) (15 mins)
          *   Debrief (10 mins)
      *   *Roles:* Need specific "non-actors."
          1.  The Owner (didn't water).
          2.  The Neighbor (saw it wilting, didn't water).
          3.  The Rain (didn't rain).
          4.  The City (didn't fix the broken hydrant).
          5.  The Queen/President (didn't send water).
      *   *Mechanism:* How to make them *feel* the counterfactual? Use "But-For" cards. If you can say "But for X not doing Y, the pumpkin would live," you are a cause.
      *   *The Twist:* In Round 2, introduce absurd omissions to force the norm distinction.

  4.  **Addressing the "Honesty" Requirements:**
      *   *What will go wrong?* People will conflate *blame* with *cause*. They will resist calling the Queen a cause even if the logic holds. They might get bogged down in the facts of the fiction.
      *   *What can't be reproduced?* The deep metaphysical itch. The activity shows the *practical* problem (too many causes), but not necessarily the *ontological* problem (can nothingness push something?). The teacher needs to bridge that.
      *   *Confidence Levels:* Need to assign these to claims.
      *   *Least Sure Point:* The transition from Round 1 to Round 2. Will they see the logical consistency or just dig in?

  5.  **Developing the Content (Section by Section):**

      *   *Introduction:* Set the stage. No jargon.
      *   *The Scenario:* "The Case of the Wilted Zucchini." Simple.
      *   *Round 1 (The Obvious):* Focus on the Owner and the Neighbor. Establish counterfactual dependence.
      *   *Round 2 (The Explosion):* Add the Rain, the City, the Queen. Apply the same test.
      *   *The Vote:* Force them to apportion percentages. They will run out of percentage points.
      *   *Debrief:* Connect "But-For" to Counterfactuals. Connect "Pruning" to Norms.

  6.  **Refining the "Feeling":**
      *   To make it *felt*, I need a physical prop or a visual aid. A "Causation Ledger." Every time someone passes the test, their name goes on the board. Watch the board fill up.
      *   The "Tension" needs to be highlighted by the facilitator (the user) pointing out the inconsistency in their rulings.

  7.  **Addressing the User's Trauma:**
      *   Acknowledge the personal stake gently. The scenario should be distinct enough (zucchini vs. washing machine) but structurally identical so they can process their experience through the group's reaction without making it about them.

  8.  **Final Review against Constraints:**
      *   American English? Yes.
      *   75 Minutes? Yes.
      *   14 Adults? Yes (need to manage group sizes).
      *   Confidence ratings? Yes.
      *   Least sure point? Yes.
      *   What goes wrong? Yes.
      *   What can't be reproduced? Yes.

  9.  **Drafting the Response (incorporating the "Honesty" constraints):**
      *   *Self-Correction on Confidence:* I need to be careful not to sound like I know *exactly* how humans react, but base it on pedagogical experience with this topic.
      *   *Self-Correction on Metaphysics:* Be clear that the activity solves the *legal/moral* selection problem, but doesn't solve the *metaphysical* status of omissions.

  10. **Final Polish:** Check tone. Empathetic but professional. Ensure the "backup plan" for the least sure point is concrete. (The backup is a Socratic intervention if they refuse to expand the list).

