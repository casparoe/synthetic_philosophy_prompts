answer: |-
  This is a classic "philosophical zombie" of a debate: it looks alive, it walks like an empirical disagreement, but it keeps coming back to life no matter how many times you bury it. You are absolutely right to suspect that the stalemate isn't just about the facts.

  After 1.5 years, your group is experiencing the exhaustion of the "New Wave" debate (Polger, Shapiro, Bechtel) colliding with the "Old Wave" metaphysics (Putnam, Fodor). Here is my diagnosis of the disagreement, followed by a prescription for how to either break the deadlock or gracefully retire the topic.

  ### The Diagnosis: A Three-Layered Entanglement

  Your intuition about "grain" is correct, but it's only one layer of the problem. The disagreement is actually a tangled knot of three distinct issues. The group is stuck because they are pulling on different strands without realizing it.

  **1. The Verbal/Methodological Layer (The Individuation Problem)**
  This is your "grain" hypothesis. To claim Multiple Realizability (MR), you need two conditions:
  *   **Same Mental Kind:** $M_1$ in System A is the same as $M_2$ in System B.
  *   **Different Physical Kind:** $P_1$ in System A is relevantly different from $P_2$ in System B.

  The skeptics (Polger & Shapiro) argue that functionalists cheat on the first condition. They define "pain" so coarsely (e.g., "state caused by damage leading to avoidance") that it *guarantees* different physical mechanisms can fit the bill. If you define pain finely (e.g., "opioid-mediated nociceptive processing"), the physical realizers look much more similar (conserved neurochemistry).
  *   **The Disagreement:** This *is* partly verbal. It's a dispute over **kind individuation criteria**. Are psychological kinds individuated by causal role (functionalism) or by underlying mechanism (mechanistic view)? Until the group agrees on *how* to slice the mental cake, they can't measure the physical slices.

  **2. The Empirical Layer (The Constraint Hypothesis)**
  This is the substantive point you noted about evolution. The skeptics are making a claim about the actual world, not just logic.
  *   **The Claim:** Evolution is a tinkerer, not an engineer. It reuses old tools. Therefore, nature is more conservative than functionalists assume. Convergent evolution often leads to convergent mechanisms (e.g., camera eyes in vertebrates and cephalopods use similar opsins).
  *   **The Disagreement:** This is a testable hypothesis about comparative neuroscience. If the skeptics are right, MR is rare in the actual world, even if it is metaphysically possible. The realists often retreat to *modal* claims ("Silicon *could* realize pain"), while skeptics demand *actual* claims ("Show me a biological case").

  **3. The Metaphysical Layer (Reduction vs. Autonomy)**
  Beneath the empirics lies the old fear: If MR is false, does Psychology reduce to Neuroscience?
  *   **The Realists' Fear:** If MR fails, functionalism dies, and psychology becomes just applied neuroscience.
  *   **The Skeptics' Reply:** Even if MR is rare, it doesn't guarantee reduction. You can have distinct kinds without massive MR.
  *   **The Disagreement:** The realists are often defending the *autonomy of special sciences*, using MR as the battering ram. The skeptics are arguing that MR is a bad battering ram, not that reduction is inevitable.

  ### So, what kind of disagreement is it?

  It is a **Methodologically-Mediated Empirical Disagreement.**

  It is not *purely* verbal, because there are facts about neural conservation that can be discovered. However, you cannot access those facts without first agreeing on methodological standards for individuation (the verbal part). The skeptics are effectively saying: *"Your metaphysical thesis is held hostage by a bad methodology for counting kinds."*

  ### Can you make progress? (The Syllabus Strategy)

  Do not drop it, but **pivot**. If you continue discussing "Multiple Realizability" in the abstract, you will loop for another year. You need to change the frame. Here are three specific moves to unstick the group:

  **1. Shift from "Is it true?" to "What would count?"**
  Stop asking "Is pain multiply realized?" Ask: "What specific evidence would satisfy the Skeptics' **Independence Condition**?"
  Polger and Shapiro argue that to prove MR, you must establish mental similarity *independently* of physical similarity.
  *   *Task:* Have the group try to design an experiment comparing human pain and octopus pain where the behavioral/functional criteria for "pain" are established *before* looking at the neurons. If they can't design the test, the concept might be too fuzzy to bear the weight MR requires.

  **2. Distinguish Modal vs. Actual MR**
  Split the debate into two weeks.
  *   **Week A (Modal):** Is silicon-based pain *possible*? (This is the Putnam/Fodor debate). Here, the skeptics have less leverage because we don't have silicon minds yet.
  *   **Week B (Actual):** Is biological pain *diverse*? (This is the Polger/Shapiro debate). Here, look at specific papers. Compare vertebrate vision vs. cephalopod vision. Compare mammal memory vs. insect memory (mushroom bodies vs. hippocampus).
  *   *Goal:* You will likely find the Realists win on Modal MR, and Skeptics win on Actual MR. Accepting this split dissolves the tension.

  **3. Adopt a "Degrees of Realizability" Framework**
  Abandon the binary (MR is True/False). Adopt the view that realizability is a spectrum (as suggested by authors like **Ken Aizawa** or **Carl Gillett**).
  *   Some functions are highly constrained (low MR): e.g., low-level visual edge detection.
  *   Some functions are highly flexible (high MR): e.g., high-level belief formation or perhaps learning rules.
  *   *Task:* Instead of arguing about "Pain," argue about specific *sub-capacities*. Is *working memory* more multiply realized than *nociception*? This moves the debate from metaphysics to cognitive neuroscience.

  ### Recommended Reading to Break the Loop

  If you want to force a resolution, assign these three specific texts which address the "grain" and "independence" issues directly:

  1.  **Polger & Shapiro, *The Multiple Realization Book* (2016), Chapter 3.** (Specifically their "Independence Condition." It forces the realists to stop assuming functional sameness.)
  2.  **Bechtel & Mundale, "Multiple Realizability Revisited" (1999).** (This is the source of the "grain" argument regarding how neuroscientists actually map brain areas across species.)
  3.  **Kaplan, "Extending Mechanistic Explanation to Computational Neuroscience" (2011) OR Craver, "The Ontic Account of Scientific Explanation."** (This introduces the **Mechanistic** alternative. It suggests we shouldn't look for "Kinds" at all, but for *mechanisms*. This often dissolves the MR problem entirely by changing the ontology.)

  ### The Verdict

  Your group is stuck because they are treating MR as a **Metaphysical Thesis** (about the nature of properties) while the Skeptics are treating it as a **Scientific Hypothesis** (about biological diversity).

  **My advice:** Tell the group that MR as a *global* thesis (all mental kinds are multiply realized) is likely dead. The interesting question is now **Local Multiple Realizability**: *Which* cognitive capacities are flexible, and *which* are constrained by evolutionary history?

  If they can accept that shift, the debate becomes productive. If they insist on the global metaphysical claim, tell them they are fighting a 1970s battle with 2020s weapons, and they should probably move on to **Predictive Processing** or **Mechanistic Explanation**, where the action is now.
