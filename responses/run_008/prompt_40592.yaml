  1.  **Analyze the User's Request:**
      *   **Context:** Two friends making an arcade game for a school hackathon.
      *   **Mechanic:** A laser beam sweeps across a circular arena. Player dodges.
      *   **Problem:** They want the beam to be "random." They implemented three different methods to generate a "random line" intersecting a circle.
      *   **Observation:** All three methods yield different probabilities of hitting the central danger zone (radius $R/2$).
      *   **Conflict:** Friend thinks one code is buggy ("random is random"). User suspects it's a definition/philosophy issue.
