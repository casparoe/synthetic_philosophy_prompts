  6.  **Final Polish:** Check the probability calculations one last time to ensure I don't give bad advice.
      *   *Method 1 (2 points on circumference):* Probability chord length $> \sqrt{3}R$ is $1/3$. Distance from center $< R/2$ corresponds to chord length $> \sqrt{3}R$. So $P = 1/3$. Correct.
