answer: |-
  There is no single, established term in the literature of logic or rhetoric that captures this specific triad: (1) a true technical theorem, (2) a sincere arguer, and (3) a sweeping conclusion licensed solely by lexical overlap rather than structural mapping.

  Philosophers of mathematics (such as Torkel Franzén in *Gödel's Theorem: An Incomplete Guide to Its Use and Abuse*) refer to this generally as "misapplication" or "Gödelian abuse," but these are descriptions of the error, not names for the rhetorical figure itself. Logicians might classify it under **equivocation**, but as you noted, that label is too blunt; it misses the specific dynamic of borrowing *authority* and *necessity* from a formal system. Rhetoricians might call it a **category mistake**, but that describes the ontological error, not the argumentative slide.

  Because the existing vocabulary is insufficiently precise for the "careful carving" you request, I will coin a term that fixes the edges of this phenomenon. I propose calling this figure **Axiomatic Drift**.

  Below is the precise definition, the distinction from nearest neighbors, and the boundary conditions for its application.

  ### Definition: Axiomatic Drift

  **Axiomatic Drift** is a rhetorical and epistemic maneuver in which a property proven necessary (or impossible) within a formal system is transferred to an informal domain, mediated by a bridge term that is precise in the former and vague in the latter.

  The structure consists of three moves:
  1.  **The Anchor:** The arguer cites a formal theorem (e.g., Gödel, Heisenberg) which establishes a modal claim (necessity, impossibility, incompleteness) within a strictly defined domain $D_f$.
  2.  **The Slide:** The arguer identifies an informal domain $D_i$ (e.g., "the mind," "society," "knowledge") that shares a lexical label $L$ with $D_f$ (e.g., "system," "measure," "order").
  3.  **The Transfer:** The arguer concludes that the modal claim holding for $D_f$ necessarily holds for $D_i$, without providing a structural mapping (isomorphism) that justifies why $D_i$ obeys the rules of $D_f$.

  The "drift" occurs because the arguer does not explicitly claim $D_i$ *is* $D_f$ (which would be a falsifiable empirical claim); rather, they allow the authority of the theorem to bleed across the semantic gap of the shared word $L$.

  ### Distinctions from Nearest Candidates

  To carve this concept cleanly, we must distinguish it from the three concepts you identified as near-misses.

  **1. vs. Equivocation**
  *   **Equivocation** is a syntactic/semantic fallacy where a word is used in two different senses within a single syllogism, rendering the inference invalid (e.g., "Feathers are light; light is the opposite of dark; therefore feathers are not dark").
  *   **Axiomatic Drift** is distinct because it is not merely a linguistic confusion. It is an *epistemic* overreach. The arguer is not just confusing meanings; they are importing the *modal force* (the "must" or "cannot") of a mathematical proof into a non-mathematical context. Equivocation breaks logic; Axiomatic Drift bypasses the burden of modeling. In Drift, the arguer often believes the informal domain *participates* in the formal domain's nature, whereas in equivocation, the user is often just sloppy with definitions.

  **2. vs. Motte-and-Bailey**
  *   **Motte-and-Bailey** is a *strategic* maneuver. It requires a degree of bad faith or tactical awareness: the arguer advances a controversial claim (the Bailey), and when attacked, retreats to a defensible claim (the Motte) they never actually intended to stand on.
  *   **Axiomatic Drift** is typically *sincere*. The arguer does not view the technical statement and the sweeping conclusion as two different claims they are toggling between for defense. They view them as the *same* claim expressed at different levels of granularity. They do not retreat because they are caught; they retreat to the theorem to show they are *right*, genuinely believing the theorem licenses the conclusion. The "drift" is invisible to them.

  **3. vs. Loose Analogy**
  *   **Analogy** admits its own tentativeness. To say "The atom is *like* a solar system" is to invite comparison while acknowledging difference.
  *   **Axiomatic Drift** masquerades as **entailment**. The arguer does not say, "Gödel suggests minds might be limited." They say, "Gödel *proves* minds cannot understand themselves." The rhetorical force relies on the word "prove" carrying its technical weight into the informal domain. If the connection is presented as illustrative, it is analogy; if it is presented as demonstrative without the requisite mapping, it is Drift.

  ### Boundary Conditions: Where does the Drift stop?

  To ensure this term is not applied too broadly (labeling all interdisciplinary work as fallacious), we must draw a boundary between **Axiomatic Drift** and **Legitimate Formal Modeling**.

  **The Test of Explicit Mapping:**
  An instance stops being Axiomatic Drift and becomes a legitimate (though potentially false) argument when the arguer explicitly attempts to justify the isomorphism between $D_f$ and $D_i$.

  *   **Instance of Drift:** "A legal system is a system of rules. Gödel proved that any system of rules strong enough for arithmetic is incomplete. Therefore, the law must contain unresolvable gaps."
      *   *Why:* The arguer assumes "legal system" satisfies the condition "strong enough for arithmetic" simply because both are called "systems." No argument is offered for how legal statutes encode Peano arithmetic.
  *   **Instance of Modeling (Not Drift):** "If we model legal statutes as formal logical expressions, and if we assume the legal code allows for self-reference regarding its own validity, then by Gödel's theorem, there may be undecidable cases. Whether the law *actually* functions this way is an empirical question."
      *   *Why:* The arguer acknowledges the gap. They are proposing a model, not asserting an identity. They have not drifted; they have built a bridge, even if that bridge might be empirically weak.

  **The Test of Modal Strength:**
  *   **Drift:** Uses the theorem to establish **impossibility** or **necessity** ("Science can *never* finish," "Mind *cannot* be a machine").
  *   **Analogy/Heuristic:** Uses the theorem to suggest **difficulty** or **limitation** ("Science faces hard limits," "Minds might have blind spots").
  *   *Boundary:* If the conclusion is softened from a modal claim (must/cannot) to a probabilistic or pragmatic claim (likely/struggles to), it is no longer Axiomatic Drift. The essence of the figure is the theft of the theorem's *necessity*.

  ### Application to Your Examples

  Using this definition, we can classify the cases you mentioned:

  1.  **Gödel $\to$ Mind:** "Minds are systems; Gödel says systems are incomplete; therefore minds are incomplete."
      *   **Verdict:** **Axiomatic Drift.** The word "system" is the bridge. The modal status of "incomplete" is transferred without proving the mind is an effectively axiomatized theory of arithmetic.
  2.  **Heisenberg $\to$ Epistemology:** "We cannot measure position and momentum; therefore, objective knowledge is impossible."
      *   **Verdict:** **Axiomatic Drift.** The word "knowledge" or "observation" is the bridge. The theorem applies to conjugate variables in quantum wave functions, not to the general philosophical concept of knowledge. The necessity of the limit is drifted from physics to metaphysics.
  3.  **Thermodynamics $\to$ Sociology:** "Entropy increases; therefore social order must decay."
      *   **Verdict:** **Axiomatic Drift.** The word "order" or "system" is the bridge. Thermodynamic entropy is a specific measure of microstate multiplicity, not social cohesion. The "must" (Second Law) is transferred to society without establishing society is a closed thermodynamic system.
  4.  **Halting Problem $\to$ Software Verification:** "We can't solve the halting problem; therefore we can never verify software."
      *   **Verdict:** **Borderline / Context Dependent.**
          *   *Drift:* If the claim is "We can never know if *any* program works." (False; we can verify specific programs).
          *   *Legitimate:* If the claim is "We cannot build a *general* verifier that works for *all* possible programs." (True).
          *   *Boundary:* The drift occurs when the *general* impossibility is used to dismiss *specific* verification efforts.

  ### Summary

  The figure is **Axiomatic Drift**.

  It is defined by the **unlicensed transfer of modal necessity** from a formal domain to an informal one, mediated by **lexical overlap** rather than **structural mapping**. It differs from **Equivocation** in that it relies on the authority of a theorem rather than mere semantic confusion; from **Motte-and-Bailey** in that it is sincere rather than strategic; and from **Analogy** in that it claims entailment rather than similarity.

  It applies to the "Gödelian Mind" argument because the arguer treats the word "system" as a conduit for logical necessity, rather than as a homonym requiring empirical justification. The boundary is crossed back into legitimate argumentation only when the arguer explicitly attempts to map the informal domain's structure onto the formal domain's axioms, acknowledging the gap rather than drifting over it.
