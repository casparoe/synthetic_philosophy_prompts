      *   *Social Reality:* Norms *can* re-root. Secular humanism, constitutional patriotism, effective altruism.
      *   *Empirical vs. Conceptual:* The analogy treats a contingent social fact (can secular norms sustain themselves?) as a necessary biological fact (flowers die without roots).
      *   *Relevant Disanalogies:* Capacity for conscious redesign (humans can build new systems), feedback loops (morality affects religion too).
