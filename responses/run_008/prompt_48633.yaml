      *   *Ambiguities:* The definition of "nutrients" is the weakest link. If "nutrients" are just "pro-social behavior," we can measure them. If they are "spiritual vitality," they're unfalsifiable.

  3.  **Analyze Disanalogies (Section 2: Cut Flower vs. Cutting):**
