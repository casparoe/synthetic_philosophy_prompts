      *   **Topic:** The "Cut-Flower" analogy regarding secular morality and religion (secular morality is a flower cut from religious roots, destined to wilt).
      *   **Context:** Rationalist blogs, *Overcoming Bias* era, discussions on religion, trust, and secularization.
      *   **Task:** Audit the analogy, not the empirical sociology itself.
      *   **Structure:**
          1.  Correspondence Table (Root, Stem, Nutrients, Wilting + Ambiguities).
          2.  Disanalogies (Focus on the "Cutting" vs. "Cut Flower" distinction, empirical vs. conceptual).
          3.  Direction of Dependence (Causality: Religion $\to$ Morality vs. Morality $\to$ Religion).
          4.  Verdict (Does the conclusion survive without the analogy? Better analogies?).
