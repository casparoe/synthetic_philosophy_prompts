answer: |-
  You have put your finger on the raw nerve of legal theory. As a novelist, you understand that a text is a collaboration between the writer and the reader, separated by time and context. The law, however, cannot afford to admit that it is a collaboration, because it claims to be a command.

  You asked for the implicit semantics of the practice, not the history. Here is the reconstruction of the metaphysics of meaning underlying the two schools, the contract split, and the verdict on whether the system coheres.

  ### 1. The Implicit Semantics of Textualism
  **The Official Story:** The legislature is a "they," not an "it." It has no mind, only a vote. Therefore, intent is a fiction. Meaning resides in the public code.

  **The Implicit Semantics:** Textualism presupposes **Semantic Objectivism**. It assumes that at any given moment ($T_{enactment}$), there exists a stable, shared linguistic commons—a "public meaning"—that is distinct from the psychological states of the speakers.

  You are correct that this kills the author to resurrect the reader. But it goes further: it posits a **Platonic Reader**. This is not a real person, but a theoretical construct who possesses perfect knowledge of the language's conventions at $T_{enactment}$ but zero knowledge of the specific context or consequences.

  **The Metaphysical Cost:** You suspected this route bought them more metaphysics than they bargained for. It did. Textualism requires a belief in the **stability of reference**. It assumes that the mapping between word and world was fixed in 1990 (or 1868) and that we can access that mapping today without contamination from our current values. This is a far more demanding picture of meaning than intentionalism. Intentionalism only requires that *someone* meant something; Textualism requires that *language itself* holds a meaning independent of use.

  **The Contradiction:** As you noted, the "scrivener's error" and "absurdity" doctrines betray this. If meaning were truly fixed by the public code, a typo would be the law (e.g., "and" instead of "or"). By correcting it, the judge admits that the *author's intended code* overrides the *public's received code*. Thus, Textualism is not actually a theory of meaning; it is a **normative rule of exclusion**. It says: "We know there is intent, and we know language drifts, but we *choose* to ignore both to prevent judges from imposing their own will." It is a political constraint masquerading as a semantic truth.

  ### 2. The Implicit Semantics of Purposivism
  **The Official Story:** Statutes are tools to fix problems. The text is the blueprint, but the function is the building.

  **The Implicit Semantics:** Purposivism presupposes **Speech Act Theory**. It treats the statute not as a static inscription (locution) but as a performative act (illocution). The meaning of the text is subordinate to the *force* of the enactment.

  **The Metaphysics:** This view assumes **Functional Agency**. It presumes the legislature, despite being hundreds of people, acts as a coherent rational agent capable of having a "purpose." Semantically, this aligns closer to your experience as a novelist: the text is a vessel for a communicative act that must be understood in context.

  **The Risk:** The metaphysical weakness here is the **indeterminacy of purpose**. A statute often has multiple purposes (compromise is the essence of legislation). When a judge selects *the* purpose, they are often constructing it retrospectively. This matches your experience of rereading your own work and finding themes you didn't intend. The Purposivist judge is essentially writing the "introduction" to the statute after the fact, and that introduction can easily swallow the text.

  ### 3. The Statute vs. Contract Split
  Why is the system intentionalist for contracts but textualist for statutes? This is not a semantic inconsistency; it is a **pragmatic coherence based on reliance**.

  *   **Contracts (Private Ordering):** The parties are specific, known, and present. The "meaning" of the contract is the **Subjective Meeting of the Minds**. Because the circle of reliance is small, the court can afford to look at emails, drafts, and testimony to find the "true" intent. The semantics here are **Psychological**.
  *   **Statutes (Public Ordering):** The "parties" are the government and every citizen, including those not yet born. Citizens rely on the text to order their lives (taxes, crimes, regulations). They do not have access to legislative history. Therefore, the "meaning" must be **Objective Reliance**.

  **The Verdict:** The split is coherent if you view meaning as a function of **Notice**. In contracts, notice is actual (I know what you meant). In statutes, notice must be constructive (I should have known based on the words). The theory of meaning shifts because the *audience* shifts from a specific partner to the general public.

  ### 4. Where the Practice is Underdetermined
  You asked where the rhetoric outruns the decisions. It happens in the "Hard Case."

  *   **Textualism's Gap:** When a textualist invokes "ordinary meaning," they are often smuggling in normative assumptions. For example, does "vehicle" include an airplane? A textualist claims this is a linguistic question. It is not. It is a question of how broadly we want to regulate. The "ordinary meaning" is underdetermined; the *choice* of which ordinary meaning to select is driven by the outcome.
  *   **Purposivism's Gap:** When a purposivist defines the "purpose," they often ignore the text's limits. If the purpose is "public safety," why isn't every dangerous act illegal? The text provides the boundary, but the rhetoric claims the purpose provides the engine.

  **The Secret Hybrid:** In practice, both sides use **Conventional Implicature**. They rely on unwritten background norms. A textualist won't read a statute to apply to the King (unless specified) because of an ancient common law presumption, not because the text says "everyone except the King." A purposivist won't read a statute to ban ambulances from a "no vehicles in the park" rule, not because of the text, but because of a shared social understanding. Both sides rely on the "unwritten text" of legal culture, but neither admits it fully.

  ### 5. The Novelist's Alternative: What if Courts Took Your Experience Seriously?
  If courts admitted that meaning drifts with living language (like a novel) or that intention is a retrospective construction (like an author rereading their work), the legal system would undergo a radical transformation.

  **Scenario A: Meaning Drifts (The Living Language Model)**
  If statutes were read like novels, the meaning of "cruel and unusual punishment" or "interstate commerce" would evolve naturally with the culture, without needing new legislation.
  *   *The Benefit:* The law stays relevant.
  *   *The Cost:* **Democratic Legitimacy.** If the meaning changes without a new vote, the judge is effectively legislating. In a novel, the reader's interpretation is free. In law, the reader's interpretation binds the citizen. If meaning drifts, citizens cannot rely on the text to know what is forbidden. The Rule of Law requires a "fixed" text, even if that fixity is a fiction.

  **Scenario B: Retrospective Intent (The Authorial Rereading Model)**
  If judges openly constructed intent based on what the legislature *should have meant* given current problems (as you do when you find themes in your old work), interpretation becomes purely normative.
  *   *The Benefit:* Justice is optimized for the present moment.
  *   *The Cost:* **Authority.** The law derives its power from the claim that "We decided this yesterday." If the judge admits, "We are deciding what this means today based on what seems right," the law becomes indistinguishable from the judge's personal morality.

  ### Conclusion: The Necessary Lie
  Does the practice cohere?
  **Semantically: No.** It oscillates between Objectivism (Textualism) and Pragmatism (Purposivism) and relies on fictions (the "reasonable reader," the "unitary legislature") that we know are false.
  **Functionally: Yes.** It creates a stable enough framework for society to operate while allowing enough flexibility (via the absurdity doctrine, purposive gaps, and contract intentionalism) to prevent catastrophe.

  You, the novelist, know the truth: **Meaning is an event, not an object.** It happens in the collision between text, reader, and time.
  The law cannot admit this. To admit that meaning is an event is to admit that the law is never finished, never certain, and always dependent on the interpreter.

  So, the legal system adopts a **Strategic Formalism**. It pretends meaning is fixed (Textualism) to preserve authority, but keeps a back door open (Absurdity/Purpose) to preserve justice. It treats contracts as intimate letters (intent matters) and statutes as public billboards (words matter).

  Your frustration arises because you are looking for *truth* in a system designed for *order*. The judges are not trying to discover what the text *is*; they are trying to decide what the text must *do* to keep the system running. They are not literary critics; they are architects reinforcing a bridge while traffic is crossing it. They cannot afford to admit the materials are shifting, even if they know they are.
