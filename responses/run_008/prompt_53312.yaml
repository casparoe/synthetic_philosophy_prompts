          *   *Implicit Semantics:* It's not actually about the *absence* of meaning, but the *location* of meaning. It presupposes **Semantic Objectivism** or **Public Meaning Originalism**.
          *   *The Metaphysics:* It assumes language is a stable code shared by a community at Time T. It treats words as having a "cash value" independent of the speaker's psyche.
