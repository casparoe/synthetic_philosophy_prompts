          *   *Synthesis:* The current system is a "necessary lie." It pretends meaning is fixed to maintain authority, while quietly adapting (via absurdity doctrines, etc.) to survive.

      *   **Conclusion:** Summarize the judgment on coherence. It is *functionally* coherent (maintains order) but *semantically* incoherent (contradictory theories of meaning). The novelist sees the truth (meaning is fluid), but the judge must pretend otherwise (meaning is fixed) to uphold the Rule of Law.

