          *   *Statute:* Public ordering. Binding on non-parties (citizens who didn't agree). Reliance interests are massive. Semantics: **Reliance-Based Objectivism**.
          *   *The Coherence Check:* It *is* coherent functionally, even if semantically inconsistent. Contracts are about *fairness between parties*; Statutes are about *notice to the public*. The "meaning" changes because the *stakes of reliance* change.

