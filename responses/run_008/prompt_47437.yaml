answer: |-
  You are not being inconsistent. You are intuitively applying a **Substantive Signal Principle** rather than a **Statistical Significance Principle**, but you are tripping over the standard terminology of the field.

  Your confusion regarding the $n=5000$ case reveals the core issue: you think your principle contradicts your intuition there, but it actually supports it. You wrote: *"That principle seems to say the n=5000 tiny-significant case counts as a replication."* It does not. If your principle is "is the effect big enough to care about," a tiny effect that is only significant due to massive $N$ fails that principle by definition. You felt a conflict only because standard methodology labels that a "successful replication" (p < .05), while your gut (correctly) labels it "trivial."

  Here is the cleanest principle that saves almost all your verdicts, the one nuance you need to adjust, and the verdict on your hard case.

  ### The Principle: Substantive Signal Integrity

  A finding counts as "replicated" if the accumulated evidence supports the existence of the **underlying causal mechanism** producing an effect of **theoretical and practical magnitude**, robust to reasonable methodological variation.

  This principle prioritizes three things over $p < .05$:
  1.  **Effect Size Magnitude:** Does the effect remain large enough to matter theoretically?
  2.  **Directional Consistency:** Is the signal pointing the same way, even if noisy?
  3.  **Construct Validity:** Does the finding hold across different operationalizations (conceptual rep)?

  ### How This Principle Saves Your Verdicts

  | Case | Your Verdict | Principle Application | Status |
  | :--- | :--- | :--- | :--- |
  | **Power Pose / Ego Depletion** | Dead | Effect size collapsed to near-zero. Signal integrity lost. | **Saved** |
  | **Direct Rep (p=.048, Orig Size)** | Replicated | Magnitude maintained, signal clear. | **Saved** |
  | **Half Size, p=.06** | Partial Success | Signal present (direction), magnitude attenuated but non-trivial. $p$ is irrelevant noise here. | **Saved** |
  | **Tiny Effect, n=5000** | Not a Rep | Statistically significant, but magnitude is trivial. Fails "big enough to care about." | **Saved** (Your confusion was linguistic, not logical) |
  | **Meta Shrinking to Zero** | Dead | Signal decay indicates original was inflation/artifact. | **Saved** |
  | **Bayes 3:1 for Null** | Ignored | 3:1 is "anecdotal" evidence on Jeffreys' scale. Too weak to override substantive signal elsewhere. | **Saved** (with caveat below) |
  | **Conceptual Rep** | Counts More | Validates the *construct* rather than the *stimuli*. Shows robustness of mechanism. | **Saved** |

  ### The One Adjustment You Need to Make

  You need to surrender the **Binary** (Dead vs. Replicated).

  Your intuition is already doing this (e.g., "partial success"), but your framework asks for a binary classification. The "Substantive Signal" principle implies a continuum:
  *   **Robust:** Effect size stable across labs/methods.
  *   **Attenuated:** Effect exists but is smaller than originally claimed (Regression to the Truth).
  *   **Fragile:** Effect exists only under specific, narrow conditions (the original lab's "secret sauce").
  *   **Dead:** Effect size indistinguishable from zero.

  **The Bayesian Caveat:** You say the 3:1 Bayes Factor doesn't move you. This is correct *if* it stands alone. However, if you have a meta-analysis shrinking to zero *and* a Bayes Factor of 3:1 *and* a tiny-effect large-N study, the Bayes Factor becomes the statistical nail in the coffin. Don't ignore Bayes entirely; just treat 3:1 as weak evidence that requires corroboration.

  ### The Hard Case Verdict

  **The Scenario:**
  *   Original: Huge effect.
  *   Replication: Powered for original size.
  *   Result: Half the original size, $p=0.08$.
  *   Method: Replication used stricter exclusion rules than the original.

  **The Analysis:**
  1.  **Power Mismatch:** The replication was powered for the *original* (inflated) effect size. Finding half that size at $p=0.08$ is actually consistent with a true effect of that smaller magnitude. It is not a "failure to replicate" in the binary sense; it is a precise estimate that the original was inflated.
  2.  **Exclusion Rules:** The replication used *stricter* exclusions. In psychology, looser exclusions often allow "researcher degrees of freedom" that inflate effects. Stricter exclusions usually yield cleaner, smaller, more accurate estimates. This suggests the original effect was likely inflated by noise or flexibility.
  3.  **Magnitude:** Half of a "huge" effect is often still a "medium" effect. Is it big enough to care about? Usually, yes.

  **The Verdict:**
  **"Replicated but Attenuated" (The Regression to the Truth).**

  You should not call this "Dead." The signal is clearly present ($p=0.08$ with $N$ powered for a huge effect implies the CI likely excludes zero or barely touches it; the direction is correct). However, you must call the **original effect size claim** dead.

  **Why this fits your principle:**
  *   **Substantive Signal:** The mechanism exists (directional consistency, non-trivial effect size).
  *   **Magnitude:** It is "big enough to care about" (half of huge is usually still interesting), but it corrects the literature's expectation.
  *   **Methodology:** The stricter exclusions suggest the replication is the *more accurate* estimate of the true population parameter.

  ### Summary
  Your gut is more sophisticated than the standard $p < .05$ heuristic used in many published meta-sciences. You are tracking **Effect Size Stability** and **Theoretical Robustness**.

  *   **Keep:** Your dismissal of tiny-significant effects and your valuation of conceptual reps.
  *   **Refine:** Acknowledge that "Replicated" is a spectrum. The Hard Case is not a failure; it is a correction.
  *   **Discard:** The idea that you are being inconsistent. You are consistently applying a **Pragmatic Realist** framework to a field that often demands **Binary Idealism**.

  The Hard Case is a **Partial Success**. The phenomenon is real, but the original paper was an overestimate. That is the most common outcome in mature science.
