answer: |-
  ## The Role-Relational Inquiry Protocol (RRIP)

  **Purpose:** To integrate relational/role-based inquiry into a standard facilitative mediation without imposing a specific moral framework or violating neutrality rules.
  **Time Limit:** 90 Minutes.
  **Core Principle:** The mediator does not define the roles; the mediator invites the parties to define the *expectations* attached to their roles.

  ### Part I: The Decision Procedure

  #### Phase 1: Safety and Issue Mapping (Minutes 0–15)
  *Standard facilitative opening.*
  1.  **Question:** "What brings you here, and what needs to be decided?"
  2.  **Sufficiency Criteria:** All parties have stated their position. Immediate safety risks (abuse, incapacity) are ruled out.
  3.  **Decision Point:** If there is evidence of coercion or abuse, **STOP**. Role ethics cannot be used where power dynamics are predatory. Proceed to standard safeguarding protocols.

  #### Phase 2: The Role Invitation (Minutes 15–35)
  *The mediator introduces the relational lens neutrally.*
  1.  **Question:** "You are not just strangers negotiating a contract; you are family. Before we talk about *what* you want, can we talk about *who* you are to each other in this situation?"
  2.  **Follow-up:** "When you think about your role as [son/sister/caregiver] in this specific crisis, what do you feel that role requires of you? What do you expect from the others in their roles?"
  3.  **Sufficiency Criteria:** Each party articulates at least one normative expectation tied to a relationship (e.g., "A brother should protect," "A daughter should visit").
  4.  **Fallback Trigger:** If parties explicitly reject this framing (e.g., "We are just business partners now," or "I owe her nothing"), **ABORT ROLE INQUIRY**. Return to standard interest-based bargaining (Money, Time, Assets). Do not moralize.

  #### Phase 3: Testing Role Consensus (Minutes 35–65)
  *Checking if the role definitions align or conflict.*
  1.  **Question:** "I hear [Party A] says the role of 'caregiver' requires living in the house. [Party B] says it requires ensuring medical safety. Are these definitions compatible, or is the dispute about what the role *is*?"
  2.  **Value/Fact Distinction:**
      *   **Fact:** "Can Mom physically stay home?" (Mediator can help gather data).
      *   **Value:** "Is it better for Mom to be safe or autonomous?" (Mediator **cannot** decide).
  3.  **Decision Point:** If the dispute is purely Value-Based (incommensurable definitions of 'good care'), the mediator must **HAND DECISION TO PARTIES**. State clearly: "I cannot tell you which value is right. You must choose which definition of 'family duty' this family will operate under."
  4.  **Sufficiency Criteria:** Parties acknowledge the conflict is about role definitions, not just resources.

  #### Phase 4: Harmonic Integration vs. Fallback (Minutes 65–90)
  *Seeking an outcome that preserves the relationship, or accepting a contract.*
  1.  **Question:** "Is there an agreement that allows you to fulfill these role obligations without destroying the relationship?"
  2.  **Neutrality Check:** The mediator must not imply that "harmony" = "agreement." Harmony might mean "agreeing to separate peacefully."
  3.  **Fallback Trigger:** If exploring roles increases shame, guilt, or hostility (e.g., "So you're saying I'm a bad son?"), **IMMEDIATELY REVERT** to interest-based mediation. Focus on logistics, schedules, and money only.
  4.  **Conclusion:** Draft agreement based on either Role Consensus (we agree on what we owe each other) or Interest Compromise (we agree on how to split the burden).

  ---

  ### Part II: The Neutrality Constraint

  **Can neutrality survive a role-ethics approach?**
  Strictly speaking, **no**. Traditional neutrality assumes the mediator has no stake in the *substance* of the relationship. Role ethics assumes the relationship itself is a substantive good. Asking "What does this do to the relationship?" privileges relational continuity over individual exit.

  **How the Procedure Survives the Rule:**
  We redefine neutrality from "neutrality about outcomes" to "neutrality about the *source* of obligation."
  *   **Forbidden:** "As a son, you should stay." (Mediator recommending outcome/role content).
  *   **Permitted:** "You mentioned being a son matters to you. How does this decision align with your view of that role?" (Mediator reflecting party's own framework).

  **The Modification:**
  The mediator must include a **Meta-Commentary** in Phase 2: *"I am asking about roles not to tell you what you ought to do, but because often family fights are actually about different expectations of what family means. You are the only ones who can define what those roles require."* This returns the moral authority to the parties, preserving procedural neutrality even if the *topic* is moral.

  ---

  ### Part III: Case Applications

  #### Case 1: The Mother's Housing (Mild Cognitive Impairment)
  *   **Scenario:** Mom wants to stay home. Siblings disagree on safety vs. autonomy.
  *   **RRIP Application:**
      *   **Phase 2:** Mediator asks, "What does 'protecting Mom' mean to each of you?"
      *   **Phase 3:** Sibling A says "Safety is love." Sibling B says "Respecting her wishes is love."
      *   **Value/Fact:** The mediator identifies this is a Value clash.
      *   **Resolution:** The procedure forces the siblings to realize they are fighting over the *definition of care*, not just the house.
      *   **Outcome:** They may agree on a trial period at home with monitoring (satisfying Safety) and a pre-signed agreement for move-in triggers (satisfying Respect).
      *   **Verdict:** **Procedure Works.** It elevates the conversation from "Who wins?" to "What does Mom need from us?"

  #### Case 2: The Caregiving Son and the Money
  *   **Scenario:** Son living with Dad pays himself from Dad's account. Siblings call it theft.
  *   **RRIP Application:**
      *   **Phase 2:** Mediator asks, "In your family, is care labor a gift or a job?"
      *   **Phase 3:** Son says, "A good son sacrifices, but he also needs to eat." Siblings say, "A good son doesn't take without asking."
      *   **Conflict:** The dispute is about *transparency* vs. *entitlement*.
      *   **Resolution:** Role ethics highlights that secrecy violates the trust inherent in the "steward" role.
      *   **Outcome:** Agreement to formalize the payment as a family-approved stipend retroactively.
      *   **Verdict:** **Procedure Works.** It validates the Son's labor (role obligation) while correcting the method (role integrity).

  #### Case 3: The Daughter Leaving for a Job Abroad
  *   **Scenario:** Daughter wants to leave. Family says she is abandoning her mother.
  *   **RRIP Application:**
      *   **Phase 2:** Mediator asks, "What does the role of 'daughter' require here?"
      *   **Phase 3:** Family says "Presence." Daughter says "Thriving so I can support them later."
      *   **The Bend (Critical Failure Point):**
          *   A strict role-ethics reading pressures the daughter to prioritize the collective (family) over the individual (career).
          *   If the mediator pushes "Harmony," the daughter may feel coerced to stay to avoid being labeled "unfilial."
          *   **Procedure Correction:** At Minute 65, the mediator must recognize that "Harmony" cannot mean "Daughter sacrifices her life."
          *   **Fallback:** The mediator must pivot to **Interest-Based**. "If presence is not possible, what *resources* can you provide from abroad?"
      *   **Outcome:** The procedure yields a painful truth: The family's definition of "daughter" and the daughter's definition of "self" are incompatible.
      *   **Verdict:** **Procedure Bends.** It cannot solve this. It can only facilitate the *renegotiation* of the role. If the family refuses to accept "Daughter Abroad" as a valid role, the mediation fails. The mediator must protect the daughter from moral coercion by reverting to: "We cannot force obligation. We can only negotiate what is voluntarily offered."

  ---

  ### Part IV: Limitations and The Human Element

  **What This Procedure Cannot Do:**

  1.  **It Cannot Fix Estrangement:** If the parties view their roles as *terminated* (e.g., due to past abuse), asking "What does a father owe?" is harmful. The procedure requires a baseline of acknowledged relationship.
  2.  **It Cannot Resolve Incommensurable Values:** In Case 3, if the family believes "Duty = Presence" and the Daughter believes "Duty = Autonomy," no amount of mediation creates harmony. The procedure identifies this impasse but cannot solve it without one side surrendering their value system.
  3.  **It Risks Cultural Imperialism:** Even if I say "You define the role," the mere act of asking the question privileges collectivism. Individualist clients may feel pressured to justify their individualism as a "role."
  4.  **It Cannot Assess Capacity:** In Case 1, if Mom lacks capacity, her "want" is a fact to be weighed by proxies, not a role obligation. The mediator must know when to stop mediating and recommend legal guardianship review.

  **Where the Translator's Judgment is Key:**
  The procedure is a map, but the mediator is the guide. The critical judgment calls are:
  *   **The Pivot Point:** Knowing exactly when Phase 3 is generating *shame* rather than *clarity*. This requires reading non-verbal cues of distress that a script cannot catch.
  *   **The Neutrality Line:** Deciding when a question like "How does this affect the family?" becomes a threat. The mediator must sense if "Family" is being used as a weapon by one party.
  *   **The Cultural Read:** Determining if "Role" is a shared language or a battleground. If one party is Westernized and the other Traditional, the mediator must translate the *concepts*, not just the words, ensuring the Traditionalist doesn't hear "Disrespect" when the Modernist says "Boundaries."

  **Final Recommendation:**
  Adopt the **Role-Relational Inquiry Protocol** as an *optional module* within your standard training, not a replacement. Train mediators to diagnose whether a case is "Contractual" (money, division of assets) or "Constitutive" (who are we to each other?). Use Role Ethics only for the latter. This respects your autonomy rules while acknowledging the reality that for many families, the contract *is* the relationship.
