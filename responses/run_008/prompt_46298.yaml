prompt: |-
  I coordinate a community mediation service. A large share of our caseload is disputes between adult children and their aging parents, or among siblings, over care decisions, money, the family house, and who is doing their share of the work. Our mediator training is entirely facilitative and autonomy-centered: we treat each party as an individual with interests, keep our own views out, and aim for a negotiated agreement the parties could all accept. A colleague trained in comparative philosophy argues that this model fits these cases badly, because it presumes the parties are separate contractors whose obligations must be built up from consent, when what is actually in dispute is what their roles — parent, child, eldest sibling, the one who stayed local — already require of them. She wants us to draw on Confucian role ethics: the view that persons are constituted by their relational roles rather than prior to them, that ethical judgment proceeds by asking what a good son, daughter, or parent does here rather than by applying impartial principles, and that harmony in the relationship is itself part of what a good outcome consists in, not just a means to one.

  I want to take her seriously without turning mediation into moralizing, and without imposing a Confucian framework on families who don't share it — our clients come from every background and most just want the fight to stop. Please write a decision procedure a mediator could actually run across a case: the questions to ask in order, with what counts as a sufficient answer to each; where the procedure should conclude that the role-based conversation is not working and the mediator should fall back to standard interest-based mediation; and where it must hand the decision to a person because the question is one of values rather than facts. The procedure has to respect two hard constraints: sessions run ninety minutes, and our service's rules forbid mediators from recommending outcomes — so address directly whether that neutrality rule can survive a role-ethics approach, and if not, what the procedure should do about it. Then run the procedure on three cases: (1) three siblings disagreeing about whether their mother, who has mild cognitive impairment and says she wants to die in her house, should move to assisted living; (2) a dispute in which the son who moved back home and provides all the care has been paying himself from his father's account, and the out-of-state siblings allege self-dealing; (3) a daughter who wants to be released from any obligation to help with her mother's care so she can take a job abroad. On the third case especially, I expect the procedure may yield an answer I won't like, since my own instincts are autonomy-first — show me what it gives and where it bends. Finally, say plainly what the procedure cannot do: the kinds of cases where role-ethics framing will mislead or do harm, and the points at which the translator's judgment, not the procedure, is doing the real work.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Coordinator of a community mediation service.
      *   **Problem:** Current facilitative/autonomy-centered model clashes with the reality of family disputes (care, money, house, roles).
      *   **Proposal:** A colleague suggests integrating Confucian role ethics (persons constituted by roles, ethics based on role obligations, harmony as an end).
      *   **Constraints:**
          *   Do not turn mediation into moralizing.
          *   Do not impose Confucianism on non-Confucian clients.
          *   Sessions are 90 minutes.
          *   Service rules forbid mediators from recommending outcomes (neutrality).
          *   Must address if neutrality survives role ethics.
      *   **Deliverables:**
          1.  A concrete decision procedure (questions in order, sufficiency criteria, fallback points, value/fact distinction).
          2.  Application of the procedure to three specific cases.
          3.  Analysis of the third case (autonomy vs. role) showing where it bends.
          4.  Limitations analysis (where role ethics fails/harms, where human judgment is key).

  2.  **Analyze the Tension: Facilitative vs. Role Ethics:**

      *   *Facilitative:* Parties are autonomous agents. Interests are subjective. Mediator is neutral regarding outcomes. Agreement is valid if consented to.
      *   *Role Ethics:* Persons are relational nodes. Obligations exist *prior* to consent (e.g., filial piety). Harmony is a substantive good.
      *   *The Conflict:* If obligations exist prior to consent, can a mediator remain neutral? If I ask "What does a good son do?" am I moralizing?
      *   *The Synthesis:* The mediator cannot *impose* the Confucian view. Instead, the mediator must *invite* the parties to explore their own understanding of their roles. The "Role Ethics" becomes a lens for the parties, not a dogma for the mediator. Neutrality shifts from "neutrality about interests" to "neutrality about the *source* of obligation" (i.e., I won't tell you what a good son is, but I will help you discuss what *you* think a good son is).
      *   *Constraint Check:* The rule forbids *recommending outcomes*. It does not necessarily forbid exploring *normative frameworks* if the parties introduce them. However, if the mediator introduces the framework, is that a recommendation? *Solution:* Frame role questions as exploratory inquiries into the parties' existing relational expectations, not as external moral commands.

  3.  **Drafting the Decision Procedure (The "Role-Relational Inquiry Protocol"):**

      *   *Goal:* Fit within 90 mins. Needs to be efficient.
      *   *Phase 1: Mapping the Terrain (Standard Facilitative).* Establish safety and issues. (15 mins)
      *   *Phase 2: The Role Invitation.* Introduce the lens without imposing it. (20 mins)
      *   *Phase 3: Testing the Role Consensus.* Do they agree on what the roles demand? (30 mins)
      *   *Phase 4: Harmonic Integration vs. Fallback.* Can we find a solution that honors roles? If not, back to interests. (25 mins)
      *   *Neutrality Check:* The mediator asks "What does this relationship require?" not "You must do X."
      *   *Fallback Trigger:* If role talk increases conflict or reveals incommensurable values without movement.
      *   *Value vs. Fact:* Facts are about capacity/money. Values are about duty/love/sacrifice. The procedure must flag when a dispute is purely value-based (mediator cannot solve) vs. fact-based (mediator can help structure).

  4.  **Developing the Three Case Studies:**

      *   *Case 1 (Mom/Aging in Place vs. Assisted Living):*
          *   *Role Lens:* What does "protecting mom" mean? Is it safety (role of protector) or autonomy (role of respecter)?
          *   *Outcome:* Likely a hybrid. Role ethics highlights the duty to care, not just the right to choose.
      *   *Case 2 (Caregiving Son vs. Siblings/Payment):*
          *   *Role Lens:* Is payment compatible with filial duty? Or is the labor itself the duty?
          *   *Outcome:* Needs transparency. Role ethics might shame the secrecy but validate the compensation if framed as "family support."
      *   *Case 3 (Daughter leaving for job abroad):*
          *   *Role Lens:* This is the hard one. Autonomy says "Go." Role ethics says "Stay/Support."
          *   *Tension:* The prompt expects me to show where the procedure bends.
          *   *Resolution:* The procedure shouldn't force her to stay. It should force the *family* to negotiate the *meaning* of her departure. Is abandonment? Or is thriving also a family good?
          *   *Neutrality:* If the mediator pushes "harmony," does that pressure her to stay? Yes. The procedure must allow for "renegotiating the role" rather than just "fulfilling the role."

  5.  **Addressing the Neutrality Constraint:**

      *   Can neutrality survive? Yes, if redefined.
      *   *Standard Neutrality:* I don't care what you decide.
      *   *Role-Adjusted Neutrality:* I don't care *which* definition of 'good child' you adopt, but I will ensure you discuss the relational impact of your choice.
      *   *Risk:* If the mediator asks "How does this affect family harmony?" it implies harmony is good.
      *   *Mitigation:* The mediator must explicitly state that *defining* harmony is up to them.

  6.  **Refining the Limitations (The "Cannot Do" Section):**

      *   Abuse cases (role ethics can trap victims).
      *   Estranged families (roles are broken).
      *   Cultural mismatch (imposing 'duty' on individualists).
      *   The "Translator's Judgment": The mediator decides *when* to pivot to role talk. That's the human element.

  7.  **Review and Refine (Self-Correction during drafting):**

      *   *Critique:* Is this too academic?
      *   *Fix:* Make the questions concrete scripts.
      *   *Critique:* Did I address the 90-minute limit?
      *   *Fix:* Add time stamps to the procedure.
      *   *Critique:* Did I answer the neutrality rule specifically?
      *   *Fix:* Create a specific section on "The Neutrality Paradox."
      *   *Critique:* Case 3 needs to show the "bend."
      *   *Fix:* Explicitly note where the procedure risks coercing the daughter and how the mediator must step back to pure facilitation if the role pressure becomes undue.

  8.  **Final Polish:** Check tone. Needs to be professional, practical, yet philosophically rigorous. Ensure the distinction between "imposing Confucianism" and "using role ethics as a heuristic" is clear. (The key is *phenomenological* inquiry: "What is this relationship to you?" not "What does Confucius say?")

  9.  *(Final thought on Case 3)*: The prompt says "show me what it gives and where it bends." I need to be honest that a strict role-ethics reading might label the daughter's choice as "unfilial," but a *mediation* application must allow for role *redefinition*. The procedure must allow the family to agree that "supporting her career IS how we care for her." If they can't, the procedure falls back to autonomy.

  10. **Structure:**
      *   Introduction (Acknowledging the tension).
      *   The Procedure (Step-by-step with time/criteria).
      *   The Neutrality Constraint Analysis.
      *   Case Applications (1, 2, 3).
      *   Limitations & The Human Element.

  *(Self-Correction during drafting the response)*: I need to make sure I don't just say "ask about roles." I need to make it a *decision procedure* with stop/go conditions.
  *   *Stop Condition 1:* Parties reject role framing. -> Fallback to Interest-Based.
  *   *Stop Condition 2:* Role framing creates shame/coercion. -> Fallback to Interest-Based.
  *   *Stop Condition 3:* Agreement reached on role duties. -> Draft agreement.

