answer: |-
  You have put your finger on one of the most glaring constitutional anomalies in recent British history. The inconsistency between the 2014 Scottish independence referendum and the 2016 EU referendum is not merely a matter of administrative detail; it strikes at the heart of the 'boundary problem' in democratic theory. As you note, this is the question of who constitutes the *demos*—the people entitled to rule themselves.

  To analyse this properly, we must run the two franchises through the three dominant principles used to justify democratic boundaries: the **All-Subjected Principle**, the **All-Affected Interests Principle**, and the **Stakeholder (or Membership) Principle**.

  ### 1. The Theoretical Framework

  *   **The All-Subjected Principle (ASP):** This holds that everyone subject to the coercive power of the laws resulting from the decision should have a say. It is often viewed as the most robust defence of democratic legitimacy.
  *   **The All-Affected Interests Principle (AAI):** This suggests that anyone whose interests are significantly affected by the decision should vote. It is broader than ASP but notoriously difficult to界定 (define), as almost everything affects everyone to some degree.
  *   **The Stakeholder/Membership Principle:** This ties the franchise to formal citizenship or long-term residency. It prioritises the stability of the political community over the specific effects of a single decision.

  ### 2. Applying the Principles to 2014 (Scottish Independence)

  The 2014 franchise (16+, Scottish residents including EU citizens, excluding UK expats) is actually quite defensible under democratic theory, particularly the **All-Subjected Principle**.

  If Scotland had voted 'Yes', it would have become a sovereign state. The people most immediately subject to its new constitution and laws would be its residents. Therefore, including EU citizens resident in Scotland makes sense: on day one of independence, they would be subject to Scottish jurisdiction. Excluding British expats living in Spain also fits ASP; they would not be subject to the new Scottish state's daily coercion.

  Lowering the voting age to 16 aligns with the **Stakeholder Principle** interpreted through a civic nationalist lens. The argument was that 16 and 17-year-olds live in Scotland, go to school there, and their futures are most intimately tied to the outcome. They are stakeholders in the community's continuity.

  **Verdict:** The 2014 franchise was theoretically coherent. It treated the referendum as a *constitutive* moment for a specific territorial community.

  ### 3. Applying the Principles to 2016 (EU Referendum)

  The 2016 franchise (18+, UK parliamentary electorate, excluding most EU citizens, including UK expats) is where the theoretical wheels come off.

  *   **Against ASP:** Excluding EU citizens resident in the UK is hard to justify. If the UK left the EU, these residents faced a fundamental change in their legal status (from EU citizens to third-country nationals). They were to remain subject to UK law, but the decision stripped them of supra-national protections. Democratic theory struggles to justify excluding long-term residents from a vote that fundamentally alters their rights.
  *   **Against AAI:** Including British expats (the 'Brits in Marbella') while excluding resident EU nationals is a stark contradiction. A retiree in Spain is less affected by UK domestic governance than a German engineer working in London for twenty years. Yet the former got a vote based on past citizenship, while the latter was excluded based on current nationality.
  *   **For Stakeholder Principle:** The 2016 rules simply defaulted to the Westminster general election franchise. This treats the referendum as a matter of *national citizenship* rather than residency or affected interest. It prioritises the integrity of the UK parliamentary electorate over the specific moral claims of those affected by the EU question.

  **Verdict:** The 2016 franchise was theoretically weak. It prioritised a static definition of national membership over the dynamic realities of subjecthood and affected interests.

  ### 4. Is There a Principled Story for Both?

  Can we construct a narrative where both were correct? One might argue that the *nature* of the decisions differed.

  In 2014, the question was about the formation of a new political community. Therefore, the *demos* had to be defined by who would belong to that new community (residents). In 2016, the question was about the UK exercising its existing sovereignty to leave a treaty organisation. Therefore, the *demos* was the existing sovereign people (UK citizens).

  However, this is largely post-hoc rationalisation. It fails to explain why a French resident of Glasgow was considered a member of the Scottish 'people' in 2014 but not part of the UK 'people' in 2016, despite living in the same house. It also fails to justify the age discrepancy. If 16-year-olds are mature enough to decide on the dissolution of the Union (a matter of war, peace, and currency), why are they too immature to decide on trade tariffs and freedom of movement?

  There is no single principle of democratic theory that validates both franchises simultaneously without significant contortion. The mismatch is, as you suspect, an embarrassment.

  ### 5. The Relocation Problem: Who Decides the Demos?

  You raise a profound point: if the *demos* is relative to the decision, who sets the boundary? In both cases, the ultimate legal authority was the UK Parliament at Westminster.

  *   **2014:** Westminster granted a Section 30 order to Holyrood. They could have insisted on the standard franchise but acquiesced to the SNP's demand for 16-year-olds and resident EU citizens as a political negotiation (the Edinburgh Agreement).
  *   **2016:** Westminster legislated unilaterally. The Conservative government chose the general election franchise, likely calculating that younger voters and EU nationals would lean towards 'Remain'.

  This confirms the suspicion of legal positivists: the boundary of the *demos* is not a pre-political moral fact; it is a legal construct determined by the existing sovereign power. Democratic theory assumes the people decide, but in reality, the state decides who the people are. This creates a circularity: the UK Parliament (elected under one franchise) decided the franchise for a vote that might dismantle the Parliament's own sovereignty.

  ### 6. Does Theory Do Any Work?

  This leads to your final question: does this suggest principles are doing no real work and the boundary is just 'politics all the way down'?

  It suggests that theory is often used as a vocabulary for justification rather than a guide for decision-making.
  *   **16 and 17-year-olds:** The acceptance of their vote in 2014 wasn't because philosophers suddenly proved 16-year-olds had superior cognitive capacity. It was because the 'Yes' campaign and the SNP argued it was progressive, and the 'No' campaign calculated opposing it would look churlish. By 2016, the political calculus flipped; the governing party suspected youth would vote Remain, so the standard age limit was maintained.
  *   **EU Citizens:** In 2014, including them fit the civic nationalism of the SNP and there was a hope of reciprocity for Scots in the EU. In 2016, excluding them was framed as a matter of 'British sovereignty'—a rhetorical move that sounds like a principle (membership) but functioned politically to limit the 'Remain' vote.

  However, theory is not entirely useless. It provides the language for critique. The reason the 2016 franchise feels 'wrong' to many is precisely because it violates the **All-Subjected Principle**. We feel the injustice of the German in London having no say because our democratic intuition tells us that long-term residency creates a moral claim to participation. If it were purely politics, there would be no sense of inconsistency, only of winning and losing. The fact that we perceive it as a democratic deficit shows that the principles exist as normative standards, even if politicians ignore them.

  ### Conclusion

  The mismatch between the two referendums reveals that the British constitution lacks a coherent theory of the *demos*. We oscillate between a civic model (residency, as in 2014) and an ethnic-national model (citizenship, as in 2016) depending on who is holding the pen.

  Is it an embarrassment? Yes. It demonstrates that the boundary of the franchise is ultimately a question of power, not principle. Westminster retained the *pouvoir constituant* (constituent power) in both instances. In 2014, it chose to share that power generously; in 2016, it hoarded it.

  Democratic theory cannot resolve this on its own because it cannot answer the prior question: who has the authority to define the *demos*? Until we have a settled constitutional convention on how referendums are framed—perhaps an independent electoral commission with a mandate to apply the All-Subjected Principle consistently—the franchise will remain a tool of political strategy rather than a reflection of democratic right. The theory shows us why the inconsistency matters; politics explains why it happened.
