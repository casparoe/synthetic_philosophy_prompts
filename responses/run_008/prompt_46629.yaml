answer: |-
  # The Population Axiology Decision Tree

  You want to know what you believe about future generations, digital minds, and the value of existence. You don't want to know which famous philosopher you agree with; you want to know which logical commitments you've already made, often without realizing it.

  This instrument does not ask you to define terms. It presents pairs of worlds. You must choose which world is *better*, all things considered. Do not answer based on feasibility or politics. Answer based on which outcome contains more value.

  There are 7 questions. Follow the arrows.

  ***

  ### Q1: The Extra Guests
  **World A:** 100 people live on an island. They are all extremely happy.
  **World B:** The same 100 people live on the island, extremely happy. Additionally, 100 *new* people are created on a separate, resource-rich island. These new people are also extremely happy. The two groups never meet and do not affect each other.

  *   **A is better / They are equal:** Go to **Leaf 1**.
  *   **B is better:** Go to **Q2**.

  ### Q2: The Dilution
  **World A:** 100 people exist. Each has a welfare level of 100 units. (Total: 10,000. Average: 100).
  **World B:** The original 100 people exist at 100 units. Plus, 1,000 new people are added. These new people have lives worth living, but they are less happy than the originals, at 20 units each. (Total: 30,000. Average: ~27).
  *No one in the original group is harmed or aware of the new group.*

  *   **A is better:** Go to **Leaf 2**.
  *   **B is better:** Go to **Q3**.

  ### Q3: The Great Scale (Biological)
  **World A:** 10 billion people live lives of ecstatic flourishing.
  **World Z:** 100 trillion people live lives that are barely worth living. They are not suffering, but their lives contain only the tiniest fraction of the joy found in World A.
  *Assume the total sum of happiness in Z is higher than in A.*

  *   **A is better:** Go to **Q4**.
  *   **Z is better:** Go to **Q5**.

  ### Q4: The Server Farm (Digital)
  **World A:** 10 billion biological humans live lives of ecstatic flourishing.
  **World D:** 100 trillion digital minds (perfect copies) run on servers. Their lives are barely worth living (same welfare level as World Z above).
  *Assume the total sum of happiness in D is higher than in A.*

  *   **A is better:** Go to **Q6**.
  *   **D is better:** Go to **Leaf 3**.
      *(Note: If you chose Z in Q3 but A here, or vice versa, you have already branched to Leaf 3. Consistency is required.)*

  ### Q5: The Painful Trade (Sadistic Conclusion)
  **World S1:** We add 1 million people who will live lives of intense torture and misery (negative welfare).
  **World S2:** We add 100 trillion people who will live lives barely worth living (tiny positive welfare).
  *Assume these are the only changes to an otherwise empty world.*

  *   **S1 is better (Avoid the mass mediocrity):** Go to **Leaf 4**.
  *   **S2 is better (Maximize the sum):** Go to **Leaf 5**.

  ### Q6: The Peak (Lexicality)
  **World P:** One person lives a life of perfect, divine quality.
  **World M:** 1 quadrillion people live lives barely worth living.
  *Is there **any** number of barely-worth-living lives that is better than the one perfect life?*

  *   **No (Quality always trumps quantity):** Go to **Leaf 6**.
  *   **Yes (Quantity eventually wins):** Go to **Leaf 7**.

  ### Q7: The Empty Void (Negative Welfare)
  **World E:** The human species goes extinct. No one exists.
  **World F:** One person exists, and their life is pure, unmitigated suffering.

  *   **E is better:** Go to **Leaf 8**.
  *   **F is better / Equal:** Go to **Leaf 5** (Merge with Totalist path).

  ***

  ## The Leaves: Where You Landed

  **Leaf 1: The Person-Affecting View**
  *You believe bringing new people into existence is neither good nor bad unless it affects those who already exist.*
  **Awkward Commitment:** You cannot say a future where everyone is happy is better than a future where everyone is miserable, provided the people in the two futures are completely different sets of individuals.

  **Leaf 2: Average Utilitarianism**
  *You believe value is determined by the average welfare per person, not the total sum.*
  **Awkward Commitment:** You must prefer a world with one ecstatic person over a world with a billion very happy people, if the single person is marginally happier than the billion.

  **Leaf 3: Substrate-Sensitive View**
  *You accept large populations of low-welfare lives, but only if they are biological (or only if they are digital).*
  **Awkward Commitment:** Your moral calculus depends on the physical medium of consciousness, implying that a digital mind and a biological mind with identical experiences have different moral weights.

  **Leaf 4: Critical-Level Utilitarianism**
  *You believe lives only add value if they exceed a certain threshold of quality, not just "worth living."*
  **Awkward Commitment:** You accept the "Sadistic Conclusion": it is sometimes better to add miserable people to the world than to add happy people, if those happy people aren't happy *enough*.

  **Leaf 5: Total Utilitarianism**
  *You believe value is the simple sum of welfare across all lives.*
  **Awkward Commitment:** You accept the "Repugnant Conclusion": a massive world of mediocre lives is better than a smaller world of excellent ones, provided the sum is higher.

  **Leaf 6: Lexical Perfectionism**
  *You believe high-quality lives are of a different order of value that cannot be traded off against quantity.*
  **Awkward Commitment:** You must judge a world with one flourishing person as better than a world with trillions of barely-happy people, no matter how large the trillions grow.

  **Leaf 7: Variable Value View**
  *You believe the value of an additional life decreases as the population grows, but never hits zero or negative.*
  **Awkward Commitment:** You avoid the Repugnant Conclusion, but you struggle to define the mathematical function that determines how much value "diminishes" without it looking arbitrary.

  **Leaf 8: Negative Utilitarianism**
  *You believe suffering is bad, but existence itself is not good.*
  **Awkward Commitment:** You are logically committed to preferring the extinction of all sentient life over a future containing any net suffering, regardless of the happiness also present.

  ***

  ## Unoccupied Space: The Ghost Leaves

  Several logical combinations of answers do not correspond to stable leaves above. Here is why nobody lives there:

  1.  **Reject Mere Addition (Q2=A) but Accept Repugnant Conclusion (Q3=Z).**
      *Diagnosis:* **Incoherent.** If you think adding happy lives that lower the average is bad (Q2), you logically cannot think adding trillions of such lives is good (Q3). This usually indicates the reader misunderstood Q2.
  2.  **Accept Repugnant Conclusion (Q3=Z) but Reject Sadistic Conclusion (Q5=S2).**
      *Diagnosis:* **Unstable.** If you believe massive quantities of low-positive welfare outweigh high welfare (Q3), you are logically committed to believing those low-positive sums outweigh small negatives (Q5). Holding both suggests an emotional aversion to "torture" that overrides your own aggregative logic.
  3.  **Person-Affecting (Q1=No) but continues to Q2.**
      *Diagnosis:* **Unexplored/Confused.** If new people don't matter (Q1), questions about their welfare levels (Q2, Q3) are category errors. Most people who answer Q1 as "Equal" stop there; those who continue usually realize they are actually Impersonal.

  ## Indistinguishable Leaves

  **Leaf 4 (Critical-Level) and Leaf 7 (Variable Value).**
  *Honesty Flag:* This tree cannot perfectly separate these two views with concrete cases alone. Both views reject the Repugnant Conclusion and often diverge only on mathematical parameterization (e.g., exactly *where* the critical level sits vs. how fast value diminishes). If you landed in Leaf 4 via the Sadistic Conclusion, you are likely a Critical-Level theorist. If you landed in Leaf 7 via the Lexical question, you are likely a Variable Value theorist. However, a Variable Value view with steep diminishing returns will mimic a Critical-Level view on every question asked here. Treat them as neighboring families rather than distinct species.

  ***

  ## Editor's Note

  **The Pivot Point:**
  **Q2 (The Dilution)** does the heaviest lifting in this tree. It is the primary filter between *Average* views and *Sum* views. Flipping a reader's intuition here moves them from Leaf 2 (Average) to the entire cluster of Total/Critical/Variable views (Leaves 4, 5, 6, 7). It is the cleanest break in the logical space because it isolates the "Mere Addition" paradox without invoking the emotional baggage of the Repugnant Conclusion.

  **The Abstract/Concrete Divergence:**
  I expect the highest rate of inconsistency at **Q4 (The Server Farm)**. In the abstract, smart readers often claim substrate neutrality ("a mind is a mind"). However, when presented with the concrete image of a "datacenter running trillions of copies," many who accepted the Repugnant Conclusion in Q3 (biological) will recoil and choose World A in Q4. This suggests that for many, the Repugnant Conclusion is not accepted as a principle, but merely tolerated in the biological case due to a lack of imagination about scale. If you flipped your answer between Q3 and Q4, you don't hold an axiology; you hold a bias.
