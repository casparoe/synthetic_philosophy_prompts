  6.  **Drafting the Content (Iterative refinement):**
      *   *On 1 vs 4:* Be clear. Popper vs. Lakatos. If you keep (1), you must dump "Right but Early." If you keep "Right but Early," you must soften (1).
      *   *On 2 vs 7:* Malthus's preventive check was *fear* of poverty. Modern demographic transition is *preference* shift due to wealth. Calling this "Malthusian" stretches the definition of "mechanism" until it snaps.
      *   *On Revision:* The easiest fix is to drop (1). (1) is too rigid for social science. Adopting a Lakatosian view (theories have hard cores and protective belts) allows (4) and (5) to work. But this requires admitting Malthus was *technically* falsified but *heuristically* useful.
      *   *Wait, looking closer at (6):* (6) says epistemic excuse isn't a verdict. This aligns with (1). If I drop (1), do I need to drop (6)? Yes, because (4) relies on interpreting the theory's structure, which is an epistemic judgment.
      *   *Best Revision:* Drop (1). It's the most brittle. Replace with: "A failed prediction falsifies the *specific formulation*, but not necessarily the *core research programme*." This saves (4) and (5).
      *   *Wait, looking closer at (7):* Is (7) actually a tension with (2)? (2) says "fertility isn't held down... will press against subsistence." (7) says "fertility is held down by wealth." This *does* hold fertility down. So the *outcome* matches. The *causal mechanism* is different. Malthus: Poverty $\to$ Restraint. Modern: Wealth $\to$ Restraint. Is the mechanism "Restraint happens" or "Poverty causes Restraint"? User says "Mechanism is sound... something always has held fertility down." If the mechanism is just "Checks exist," (7) fits. If the mechanism is "Positive/Preventive checks triggered by scarcity," (7) breaks it. I need to press the user on what they mean by "Mechanism."

  7.  **Finalizing the Advice:**
      *   **Rank 1 (Fatal):** (1) contradicts (4) & (5). You can't have "Full Stop Falsification" and "Implicit Conditionals Rescue."
