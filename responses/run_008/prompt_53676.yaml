      *   **Secondary Recommendation:** Clarify "Mechanism" in (2). Is it the *necessity* of a check, or the *source* of the check?

  8.  **Refining the Tone:** Ensure it sounds like a rigorous peer review, not a gentle hug. "Here is where you are bleeding."

