          *   *Conflict:* If (1) is true, you don't get to dig into the theory's implicit conditionals to save it after a miss. (1) is a *logical positivist/falsificationist* hard line. (4) and (5) are *Lakatosian* (research programmes/protective belts). If you allow (4), you violate (1). If you hold (1), (4) is impossible.
          *   *Severity:* **Critical.** This is the core logical contradiction. You cannot be a hard Popperian (1) and a soft Lakatosian (4/5) simultaneously regarding the *same* prediction.

