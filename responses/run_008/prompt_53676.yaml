          *   *Severity:* **High.** This strikes at the "Mechanism is sound" claim. If the check operates inversely to Malthus's causal arrow (Wealth $\to$ Low Fertility vs. Poverty $\to$ Low Fertility), is the mechanism really the same?

      *   **Tension C: (3) as a distinct position.**
