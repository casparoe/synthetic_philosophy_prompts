          *   (6) says: Verdict depends *only* on predictions vs. outcome. Not on what the theorist knew.
          *   (5) says: Verdict depends on what was *in the theory* (implicit conditionals) before the miss.
          *   *Conflict:* Determining what was "in the theory" requires interpreting the theorist's intent/text, which borders on "what they could have known/meant." (6) tries to banish hermeneutics; (5) requires it.
          *   *Severity:* **Low/Medium.** Mostly semantic, but adds to the mud.

  4.  **Ranking Severities:**
      1.  **(1) vs. (4)/(5):** This is the kill shot. You cannot claim "Falsified, full stop" AND "Legitimate verdict if conditional."
      2.  **(2) vs. (7):** This undermines the "Mechanism is sound" claim. If the causal arrow is reversed, the mechanism isn't Malthusian.
      3.  **(3) Coherence:** Dependent on resolving #1.

  5.  **Formulating the Audit:**
