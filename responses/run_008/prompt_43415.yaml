  2.  **0.95** — Past actions often encode private priors or constraints that are otherwise lost.
  3.  **0.75** — Common usage tolerates "sunk cost" for any past cost, even if technically informative.

  **Combination:**
  I calculate the final credence as $P(\text{Policy View}) \times P(\text{Info Exists}) \times P(\text{Label Fits})$, which is $(1 - 0.30) \times 0.95 \times 0.75 \approx 0.50$.

  **Sensitivity:**
  The result is most sensitive to **Term 3** (the labeling condition). Because the standard economic definition of a "sunk cost" explicitly excludes costs with decision-relevant information, a strict definition collapses the probability to near zero, whereas a colloquial definition sustains it.

  **Moving the Needle:**
  The number would move most on the observation of a **formal model where "sunk" is defined strictly by financial irrecoverability** rather than decision irrelevance; this would decouple the informational argument from the definition and solidify Term 3.

  **Verbal Dispute:**
  Yes, this is largely a verbal dispute. The line should be drawn between **financial irrecoverability** (the cost is gone) and **decision irrelevance** (the cost should be ignored); if you define "sunk" as the former, your proposition holds, but if you define it as the latter, it is tautologically false.
