answer: |-
  **Exam Question**

  Maya uses AI to explain philosophical texts she hasn't read. Sam uses a calculator for derivations he doesn't fully grasp. Both trust the output without independent verification.

  Construct a criterion distinguishing benign epistemic offloading (like Sam's) from corrosive dependence (like Maya's). Your criterion must identify a specific epistemic capacity the agent must retain.

  Apply your criterion to Maya. Then, stress-test it against Sam OR a case of expert testimony. Does your criterion yield the intuitively correct verdict for both? If not, refine it.

  ***

  **Model Answer**

  The core epistemic danger is not offloading itself, but the loss of evaluative capacity. We offload constantly without harm; the issue arises when we outsource the very mechanism required to judge the output's reliability. Therefore, I propose the **Independence Condition**: Epistemic offloading is benign only if the agent retains the capacity to verify the output's reliability without relying on the tool itself.

  Applied to Maya, this condition is violated. AI generates explanations, which are claims about meaning and truth. To verify an explanation's accuracy, one must understand the source text. Since Maya hasn't read the text, she lacks the independent data required to check the AI's claim. She cannot distinguish a fluent hallucination from a correct summary. Her dependence is corrosive because it creates a closed loop: she must trust the AI to understand the AI. She has outsourced the judgment of truth to the source of the truth-claim.

  Sam's case appears different. He outsources calculation, not verification. While he may not grasp the integration, he retains access to markers of reliability independent of the calculation itself. He can check inputs, estimate magnitudes, or recognize syntax errors. If the calculator returns "10,000" for a simple sum, Sam's background numeracy allows him to flag the error without redoing the math. He retains the capacity to recognize failure modes. Thus, Sam satisfies the Independence Condition; his offloading is benign.

  However, a stress-test against expert testimony reveals a flaw. When I trust a doctor's diagnosis, I cannot verify the medical logic (content) nor necessarily their competence (source) without relying on other testimony. Strictly speaking, I violate the Independence Condition. Yet, this dependence is not corrosive. Why? Because verification shifts from *content* to *social markers*. I verify the doctor via credentials, institutional oversight, and accountability norms—markers independent of the medical claim itself.

  This requires refining the criterion. The **Refined Independence Condition** states: Offloading is benign only if the agent can independently verify either the content OR the source's trustworthiness via external markers (credentials, track records, known failure modes).

  Maya fails both. AI has no accountability, fluid identity, and no track record accessible to her. She cannot verify the content (no reading) nor the source (no credentials). Sam verifies the tool's function (known failure modes). The patient verifies the doctor's status (credentials). AI is uniquely corrosive because it mimics expert testimony without offering the social scaffolding that makes testimony trustworthy. It offers the output of understanding without the verifiable markers of reliability, trapping the user in epistemic circularity.

  ***

  **Marking Scheme (20 Points)**

  **1. Criterion Formulation (5 points)**
  *   **A (4-5):** Proposes a specific epistemic capacity (e.g., "independent verification," "recognition of failure modes"). Distinguishes between outsourcing *production* vs. *evaluation*.
  *   **B (2-3):** Vague normative claim (e.g., "don't lose critical thinking," "AI is bad for learning"). Identifies a problem but not a testable condition.
  *   **C (0-1):** No clear criterion; merely restates the prompt.

  **2. Application to AI Case (5 points)**
  *   **A (4-5):** Uses the criterion to explain *why* Maya's case fails (e.g., cannot distinguish fluency from truth; closed loop).
  *   **B (2-3):** Asserts Maya is wrong but relies on intuition rather than the proposed criterion.
  *   **C (0-1):** Ignores Maya or applies criterion incorrectly.

  **3. Stress-Test & Refinement (5 points)**
  *   **A (4-5):** Applies criterion to counter-case (Sam/Doctor). Identifies tension (e.g., "I can't verify doctor either"). Refines criterion to resolve tension (e.g., adding "source verification").
  *   **B (2-3):** Applies criterion but ignores the tension or fails to refine. Claims counter-case is "just different" without explanation.
  *   **C (0-1):** No stress-test attempted.

  **4. Structure & Clarity (5 points)**
  *   **A (4-5):** Clear thesis, logical progression, precise terminology.
  *   **B (2-3):** Understandable but disorganized or verbose.
  *   **C (0-1):** Difficult to follow.

  ***

  **A Note on Your Student**

  You asked for thoughts on the student who stopped reading. Since this isn't the deliverable, I'll keep it brief: You don't need to forbid the AI, but you need to change the assessment. If the exam asks for summaries, AI wins. If the exam asks for *applications* of the concept to novel cases the AI hasn't seen (or requires in-class handwritten reconstruction), the AI becomes a study aid rather than a replacement. The student isn't wrong that AI explains things well; she's wrong that explanation equals understanding. Understanding is the ability to *use* the concept when the explainer isn't there. Make her prove she can use it without the explainer.
