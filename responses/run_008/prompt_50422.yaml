      *   *Is there any truth to the colleague's view?* Yes, in that both are RL problems. Both use credit assignment. But saying they are "the same thing" is like saying "Supervised Learning and Reinforcement Learning are the same because both minimize a loss function." Technically true at the calculus level, practically false at the objective level.
