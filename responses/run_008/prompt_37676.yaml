answer: |-
  You have put your finger on a precise and deeply troubling mechanism of modern politics. You are correct to feel that terms like 'propaganda' or 'post-truth' are too blunt; they describe the atmosphere, but not the specific engine you are describing.

  There is no single, universally agreed-upon noun for this exact phenomenon, but it is a recognised subject in political philosophy and psychology. It sits at the intersection of three concepts: a specific philosophical insight from the mid-20th century, a modern military-strategy term, and a psychological state.

  ### 1. The Philosopher: Hannah Arendt
  The philosopher you are half-remembering is almost certainly **Hannah Arendt**.

  In her 1967 essay *Truth and Politics*, and earlier in *The Origins of Totalitarianism* (1951), Arendt analysed how totalitarian regimes used lying. She observed something counter-intuitive: the success of the lie did not depend on the masses believing it.

  She wrote:
  > "The ideal subject of totalitarian rule is not the convinced Nazi or the convinced Communist, but people for whom the distinction between fact and fiction (i.e., the reality of experience) and the distinction between true and false (i.e., the standards of thought) no longer exist."

  Arendt argued that the goal of 'organised lying' is not to convince the audience of a specific falsehood, but to destroy the very faculty of distinguishing truth from falsehood. When that distinction collapses, the citizen becomes powerless, because political action requires a shared reality. The liar does not need you to believe him; he only needs you to believe that *nothing is knowable*.

  ### 2. The Mechanism: The Firehose of Falsehood
  The tactical name for the method you described—the "steady drip" of high-volume, multi-channel falsehoods—is **"The Firehose of Falsehood"**.

  This term was coined by researchers at the RAND Corporation in 2016 to describe modern Russian propaganda techniques. They identified two key features that match your observation:
  1.  **High Volume:** The lies come so fast that fact-checkers cannot keep up.
  2.  **Channel Multiplicity:** The lies appear on news, social media, and official statements simultaneously.

  The RAND report explicitly states that the goal is not to persuade the audience of a specific narrative, but to **contaminate the information space**. When the space is contaminated, the audience retreats into cynicism. They stop checking because the cost of verification exceeds the perceived benefit.

  ### 3. The Audience State: Epistemic Learned Helplessness
  If we need a name for the psychological state of the supporters—the "blanket cynical fog" where they shrug at trivially checkable lies—the most accurate existing term is **"Epistemic Learned Helplessness"**.

  In psychology, 'learned helplessness' occurs when a subject learns that their actions have no effect on outcomes, so they stop trying. In an *epistemic* (knowledge-based) context, the audience learns that checking facts does not lead to clarity or accountability. Consequently, they cease the effort of verification. They do not believe the lies; they simply cease to value the truth.

  However, since you asked me to coin a term if the existing ones do not quite carve the joint, I would propose:

  **Strategic Epistemic Erosion**

  *   **Strategic:** It is done on purpose to gain impunity (as you noted, "he's free to do whatever").
  *   **Epistemic:** It targets the system of knowing (true vs. false).
  *   **Erosion:** It is not a sudden break, but a wearing down (the "steady drip").

  ### 4. Distinguishing it from Related Concepts
  You were right to rule out 'gaslighting' and 'crying wolf'. Here is how **Strategic Epistemic Erosion** differs from them:

  | Concept | The Mechanism | The Goal | The Audience Reaction |
  | :--- | :--- | :--- | :--- |
  | **Gaslighting** | Interpersonal manipulation of memory. | To make the victim doubt their own sanity/perception. | "Am I going mad? Did I imagine that?" |
  | **Crying Wolf** | Repeated false alarms. | (Usually) attention seeking or panic. | Loss of credibility. The liar is ignored when truth comes. |
  | **Spin** | Framing facts favourably. | To persuade using selective truth. | "They are twisting the facts." |
  | **Strategic Epistemic Erosion** | Flooding the zone with mixed truths/lies. | To make truth *irrelevant*. | "Who knows? It's all lies anyway." |

  The crucial distinction with **Crying Wolf** is that in your scenario, the loss of credibility is not a *failure* for the politician; it is the *objective*. If nobody believes anyone, the politician is on equal footing with the truth-teller, but the politician has fewer constraints.

  ### 5. Why it works (The "Why")
  You asked why consistent lying doesn't produce belief but produces cynicism. This is explained by a concept from the philosopher **Harry Frankfurt** in his book *On Bullshit* (1986).

  Frankfurt distinguishes the **Liar** from the **Bullshitter**.
  *   The **Liar** knows the truth and hides it. They respect the truth enough to hide it.
  *   The **Bullshitter** is indifferent to truth entirely.

  When a politician engages in Strategic Epistemic Erosion, they are effectively bullshitting on a mass scale. The audience senses this indifference. They realise the politician is not trying to deceive them about *specifics*, but is signalling that *rules of truth do not apply to him*. The audience responds not by believing the content, but by adopting the politician's indifference. They become bullshitters in self-defence.

  ### Summary
  *   **The Philosopher:** Hannah Arendt (*Truth and Politics*).
  *   **The Tactic:** The Firehose of Falsehood (RAND Corporation).
  *   **The Psychological State:** Epistemic Learned Helplessness.
  *   **The Coined Term:** **Strategic Epistemic Erosion**.

  This phenomenon is more dangerous than simple lying because it immunises the liar against correction. If you correct a lie, the response is not "Oh, I was wrong," but "You're just another person claiming to know things in a world where nothing is certain." It turns the very act of fact-checking into a partisan gesture rather than a civic duty.
