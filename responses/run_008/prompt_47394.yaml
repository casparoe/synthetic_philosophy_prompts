answer: |-
  You have stumbled onto one of the deepest problems in decision theory (Reference Class Forecasting vs. Specific Evidence) without needing to read a single philosophy paper. Your intuition is mostly correct, but your tentative principle ("mechanical vs. judgment") is slightly off.

  Here is the principle that unifies your six verdicts, followed by the answers to your specific doubts.

  ### The Principle: **The Outside View is the Prior; The Inside View is the Evidence.**

  Treat the Outside View (base rates, consensus, history) as your **Null Hypothesis**. It is the default state of the world. Treat the Inside View (your specific knowledge, tests, reads) as the **Data** you collect to try to reject that Null Hypothesis.

  You only override the Outside View when your Inside View provides **verified, causal data** that specifically invalidates the base rate. You do not override it with **conviction, hope, or unverified assertion.**

  Here is how this principle maps to your six cases:

  1.  **Migration Estimate:** The team's "6 weeks" is not data; it is a prediction based on hope (the Planning Fallacy). The "3-4x slip" is historical data.
      *   *Verdict:* **Outside View wins.** You have no causal data to reject the "migrations slip" hypothesis.
  2.  **Debugging:** "95% your code" is the Prior. "I audited the code twice" is data.
      *   *Verdict:* **Inside View wins.** You have generated specific evidence (the audit) that reduces the probability of the Null Hypothesis.
  3.  **Startup Job:** "Startups fail" is the Prior. "I have observed this founder navigate crisis successfully before" is data.
      *   *Verdict:* **Inside View wins.** *Crucial distinction:* This is only valid if your "read" is based on observed past behavior (data), not just "vibes" or "chemistry" (hope).
  4.  **Architect vs. Code:** "Senior Architect knows best" is the Prior (Authority). "This specific module has a hard constraint" is data.
      *   *Verdict:* **Inside View wins.** Concrete constraints (physics/code) trump abstract patterns (architecture theory).
  5.  **Stack Overflow vs. Test:** "Consensus" is the Prior. "My reproducible test" is data.
      *   *Verdict:* **Inside View wins.** Direct observation trumps second-hand report.
  6.  **Junior Dev vs. Vendor:** "Juniors are often wrong" is the Prior. "I suspect a bug" is an *assertion*, not data.
      *   *Verdict:* **Outside View wins (for now).** Until logs are produced, there is no data to reject the Prior. If she brings logs, it becomes Case #5.

  ### Addressing Your Doubts

  #### 1. Is the "Mechanical Evidence" principle dead?
  Yes, replace it with **Verified Causal Mechanisms.**
  In Case #3 (Startup), your evidence wasn't "mechanical" (like a test), but it was **causal**. You aren't saying "I feel lucky." You are saying "I have observed variable X (founder competence) which causally correlates with Outcome Y (success), and this specific instance has high X."
  If your reason for taking the job was "I have a good feeling," you were rationalizing. If it was "I saw them pivot successfully in 2018," you were applying the Inside View correctly.

  #### 2. The Calibration Question (The 80% vs. 60% Confidence)
  *Question:* "I'm 80% confident I can cut costs... but my calibration data says I'm right 60% of the time. Should I downgrade myself? Doesn't that discard the private info?"

  *Answer:* **You downgrade the confidence, not the plan.**
  This is the hardest part for engineers. You must apply the Outside View *to your own Inside View*. You are a measuring instrument. If your voltmeter is known to have a 20% error rate, you don't throw away the voltage reading; you attach an error bar to it.
  *   **Don't:** "I'm probably wrong, so I won't try."
  *   **Do:** "I have a 60% probability of success. I will proceed, but I will not bet the company on it, and I will set a stop-loss."
  You keep the private information (where the waste is), but you correct the *sensor* (your confidence) that is reading it. This is not discarding info; it is **calibrating the sensor.**

  #### 3. Was the Startup Move Defensible?
  It is defensible **if and only if** your "read on the team" was based on **trackable history**, not **affinity**.
  *   **Defensible:** "I worked with this founder for 3 years. When server costs spiked, they made the right call. When hiring froze, they kept morale high." (This is Inside View data).
  *   **Rationalization:** "They are really passionate and smart, and they believe in me." (This is hope. The base rate of "passionate founders" failing is still 90%).
  Most people who ignore base rates are wrong. The only way to be the exception is to have better data than the aggregate. Do you actually have better data, or do you just have *more personal* data?

  #### 4. Which Verdict is the Weak Link?
  **Case #6 (The Junior Dev)** is the weak link, but not for epistemological reasons. For *risk* reasons.

  Epistemologically, your verdict is correct: An unverified claim cannot override a base rate. However, in engineering, **False Negatives have different costs than False Positives.**
  *   If you trust the Junior and she's wrong: You waste 4 hours checking logs.
  *   If you distrust the Junior and she's right: You lose data forever, or wake up at 3 AM when the pipeline actually breaks.

  In Case #5 (Stack Overflow), the cost of running a test is low. In Case #6, the cost of *demanding* logs might be high (psychological safety, time).
  **The Fix:** The principle holds, but the *threshold* for evidence should be dynamic based on risk.
  *   Low Risk? Demand logs (Stick to the principle).
  *   High Risk? "Show me what you have, let's look together." (Lower the barrier to evidence generation).

  ### Summary for your Mental Model

  You are not rationalizing. You are intuitively doing Bayesian updating. To make it robust:

  1.  **Default to the Outside View.** It is the Null Hypothesis. The world is usually average.
  2.  **The Inside View requires receipts.** "I checked," "I tested," "I saw them do this before." If your Inside View is "I feel," "I estimate," or "I believe," stick with the Outside View.
  3.  **Calibrate yourself.** You are part of the Outside View. If you are historically overconfident, your "80%" is actually "60%".
  4.  **Distinguish Data from Prediction.** Estimates are predictions (weak). Tests/Audits/Logs are data (strong).

  You can sleep soundly on #1, #2, #4, and #5. Re-evaluate #3 to ensure it was data, not vibes. And treat #6 with more urgency, not because the logic is wrong, but because the cost of being logically right might be operationally expensive.
