          2.  *Disagreements:* Table with 3 columns (Issue, Reductionist, Emergentist). Specific topics (Thermodynamic limit, Causal exclusion, Nature of "Emergent", RG interpretation). Phrasing must be acceptable to the respective party.
          3.  *Cruxes:* 3-4 subquestions. Concrete cases/simulations/arguments. Predictions registered.
          4.  *Verbal or Substantive:* Closing section distinguishing substantive vs. terminological disputes.
