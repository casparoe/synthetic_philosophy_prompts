  2.  **Deconstruct the Personas:**
      *   **Reductionist Physicalist:** Ontology is microphysical. Special sciences are heuristic compressions. Higher-level properties don't add to ontology. Causal work is done at the bottom (Kim's exclusion). "Emergence" is epistemic (ignorance/convenience).
      *   **Robust Emergentist:** Higher-level properties are genuine/autonomous. Irreducible laws/causal work. "Emergence" is ontological. Microphysics doesn't exhaust explanation.
      *   **Shared Ground:** Both respect science. Both acknowledge the failure of strict Nagelian reduction *in practice*. Both acknowledge the utility of RG and MR.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* 6-9 claims. Must be specific based on the prompt's suggestions (Nagel, MR, Phase Transitions, RG).
      *   *Drafting:*
          1.  Nagel-style derivation hasn't happened historically. (Fact)
          2.  Multiple realizability is a real pattern, regardless of metaphysical import. (Fact)
          3.  Strict nonanalyticity in phase transitions requires the thermodynamic limit (N = $\infty$). Finite systems are analytic. (Physics fact)
          4.  "Ice melts at 0°C" refers to an idealization, not a specific finite cluster. (Implication of 3)
          5.  Renormalization Group (RG) explains universality classes across different micro-constitutions. (Physics fact)
          6.  Microphysical sufficiency: No macro-event occurs without a microphysical base sufficient for it. (Physicalist closure, Emergentist can accept supervenience without reduction).
          7.  Explanatory autonomy: Special science explanations are often more efficient/cognitively accessible than micro-explanations. (Pragmatic agreement)
          8.  No "vital forces": Biology doesn't violate conservation laws. (Boundary condition)
