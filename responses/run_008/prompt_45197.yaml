  # JOINT STATEMENT ON ONTOLOGY AND EXPLANATION IN THE SPECIAL SCIENCES

  **Signatories:** The Reductionist Physicalist (RP) and The Defender of Robust Emergence (DRE)
  **Date:** October 14, 2026
  **Context:** Conclusion of Two-Year Adversarial Collaboration on Micro-Macro Relations

  ## 1. Agreed Claims

  After two years of analyzing case studies ranging from the statistical mechanics of water to the population dynamics of natural selection, we endorse the following claims as established common ground. These claims reflect the limits of current science and the structural features of our best theories, without committing to the metaphysical interpretations contested in Section 2.

  1.  **Failure of Nagelian Reduction:** As a matter of historical fact, strict intertheoretic deduction (Nagel-style bridge laws) from fundamental physics to the special sciences (chemistry, biology, psychology) has not been successfully executed in any complex system.
  2.  **Multiple Realizability as Pattern:** Multiple realizability (MR) is a robust empirical pattern; distinct microphysical configurations can and do sustain identical macro-level functional states (e.g., pain, liquidity, currency value), regardless of whether this pattern implies ontological autonomy.
  3.  **The Thermodynamic Limit:** Strict nonanalytic behavior (singularities) characterizing phase transitions (e.g., melting, ferromagnetism) occurs mathematically *only* in the thermodynamic limit ($N \to \infty$, $V \to \infty$). Finite systems exhibit analytic crossovers, not singularities.
  4.  **Idealization in Macro-Claims:** Consequently, standard macroscopic claims (e.g., "ice melts at 0°C") refer to idealized systems. No finite cluster of $H_2O$ molecules possesses a sharp melting point in the strict mathematical sense.
  5.  **Renormalization Group (RG) Universality:** The Renormalization Group explains why systems with radically different micro-constitutions (e.g., fluids and magnets) exhibit identical macro-behavior near critical points by flowing to the same fixed points in parameter space.
  6.  **Microphysical Sufficiency:** We agree that no macro-event occurs without a microphysical base sufficient to produce it. There is no "vital force" or energy injection from outside the physical closure of the universe.
  7.  **Explanatory Asymmetry:** Macro-level explanations are often cognitively superior and more robust to micro-perturbations than micro-level explanations, even if the micro-level is ontologically fundamental.
  8.  **Coarse-Graining is Real:** The mapping from micro-states to macro-states is many-to-one. Information is lost in the transition from micro to macro, and this loss is necessary for the stability of macro-laws.
  9.  **No Magic:** The special sciences do not violate the conservation laws of physics. Any disagreement concerns the *description* of causal work, not the budget of energy-momentum.

  ## 2. Disagreements

  Despite the agreements above, we remain deadlocked on the metaphysical interpretation of these structural features. The following table records our divergent positions. Each party has vetted the phrasing in their respective column to ensure it accurately captures their commitment without caricature.

  | Issue | Reductionist Physicalist (RP) Position | Defender of Robust Emergence (DRE) Position |
  | :--- | :--- | :--- |
  | **The Thermodynamic Limit** | The limit $N \to \infty$ is a **mathematical convenience**. It is a calculational tool used to approximate finite systems. Since infinite ensembles do not exist, the singularities they produce do not name genuine ontological features. | The limit $N \to \infty$ does **constitutive work**. It defines the phase itself. To deny the reality of the phase because the system is finite is to deny the reality of the stable pattern that persists regardless of finite-size fluctuations. |
  | **Causal Exclusion (Kim)** | Macro-causes are **pre-empted**. If the micro-base is causally sufficient, the macro-property adds no new causal power. To assert otherwise is to accept systematic overdetermination. Macro-causation is a heuristic projection of micro-causation. | Macro-causes are **autonomous**. Higher-level properties exert "downward" constraint on micro-constituents. The micro-base realizes the cause, but the macro-property *is* the cause in virtue of its functional organization, not pre-empted by its realization. |
  | **Ontology of "Emergent"** | "Emergent" is an **epistemic label**. It names properties that are difficult to predict or compute from the base, not properties that are ontologically distinct. Emergence tracks our ignorance or computational limits. | "Emergent" is an **ontological category**. It names properties that are novel and irreducible, possessing causal powers that cannot be recovered in microphysical vocabulary even in principle. |
  | **RG Interpretation** | RG shows physics **absorbing the special sciences**. It demonstrates that macro-regularities are simply fixed points of micro-dynamics. Autonomy is an illusion created by irrelevant operators decaying. | RG shows physics **discovering autonomy**. It demonstrates that macro-structures are independent of micro-details. The decoupling proves that the macro-level has a reality that does not depend on specific micro-constitutions. |

  ## 3. Cruxes

  We identify three specific subquestions where empirical or formal progress could alter the probability assessment of our respective positions. We register our predictions below.

  **Crux 1: The Derivability of Biological Generalizations**
  *   **The Test:** A worked derivation of a specific, non-trivial biological generalization (e.g., the stability conditions of a specific fitness landscape topology) strictly from particle physics, without assuming population-level variables as primitives.
  *   **RP Prediction:** Such a derivation is possible *in principle*. If it has not been done, it is due to computational complexity, not ontological barrier. Success would show biology is compressed physics.
  *   **DRE Prediction:** Such a derivation will fail to capture the *counterfactual robustness* of the biological law. It may reproduce the trajectory, but it will fail to explain why the trajectory holds across different physical substrates. Failure would show biology is autonomous.

  **Crux 2: Finite-Size Scaling and Singularities**
  *   **The Test:** High-precision simulation of a mesoscopic system ($N \approx 10^{23}$) approaching a critical point, analyzing whether the "pseudo-singularity" behaves indistinguishably from a true singularity for all causal purposes.
  *   **RP Prediction:** The simulation will show the analytic crossover is smooth. The "sharpness" of the phase transition vanishes upon close inspection, confirming the singularity is a mathematical artifact.
  *   **DRE Prediction:** The simulation will show the correlation length diverges effectively enough that the system's causal behavior is *functionally identical* to the singular limit. The distinction is mathematically real but causally irrelevant, vindicating the reality of the phase.

  **Crux 3: Neural Kind Identity**
  *   **The Test:** Identification of a specific mental state (e.g., a specific qualia or belief type) with a precise micro-neural configuration across multiple subjects, eliminating multiple realizability in that domain.
  *   **RP Prediction:** As neuroscience advances, MR will shrink. We will find strict type-identities for core mental kinds. This would collapse the emergentist claim for psychology.
  *   **DRE Prediction:** MR will hold even at fine grain. Two subjects can be in the same mental state with different micro-configurations. Finding a correlation does not establish identity. Persistence of MR vindicates functional autonomy.

  ## 4. Verbal or Substantive

  In closing, we assess the nature of our remaining deadlock.

  **Verbal Disagreements:**
  We acknowledge that a portion of our dispute rests on the definition of **"law."** The RP defines a law as a fundamental regularity derived from the Hamiltonian of the universe. The DRE defines a law as a stable, counterfactual-supporting regularity at a specific scale. If we adopt the DRE's definition, the special sciences have laws; if we adopt the RP's, they do not. This is a terminological choice regarding the privilege of the "fundamental" scale. Similarly, we disagree on the use of **"real."** The RP reserves "real" for the ontological basement; the DRE applies "real" to any causally efficacious pattern.

  **Substantive Disagreements:**
  However, the disagreement regarding **Causal Exclusion** is not merely verbal. It concerns the budget of causal power in the universe.
  *   If the RP is correct, the macro-level is a "shadow" cast by the micro-level; removing the macro-description changes nothing in the causal chain.
  *   If the DRE is correct, the macro-level exerts constraints that are not exhaustively described by the sum of micro-interactions (e.g., boundary conditions that constrain micro-states).

  This is a substantive metaphysical disagreement about whether the world is *exhausted* by its smallest parts or whether organization constitutes a genuine addition to being. We have failed to convince each other that our respective interpretations of the Renormalization Group resolve this tension. The RP sees RG as proving the micro-determines the macro; the DRE sees RG as proving the macro-escapes the micro. Until a criterion is established to distinguish "determination" from "reduction," this substantive divide remains.

  **Signed,**

  *The Reductionist Physicalist*
  *The Defender of Robust Emergence*
