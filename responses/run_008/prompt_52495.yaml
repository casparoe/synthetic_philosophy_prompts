answer: |-
  1. The branch questions
  The following questions guide respondents through the logical space using neutral scenarios. Answer based on intuition, not theory labels.

  1. (Swamp-creature) If a molecule-for-molecule duplicate of an organism appears by accident without ancestors, do its internal states possess genuine content, or do they merely mimic contentful systems? This separates views requiring ancestral history from those relying on current structure.
  2. (Frog) When a biological detector fires in the absence of its typical cause, is the system representing something falsely, or is it simply malfunctioning without representing anything at all? This distinguishes accounts allowing false belief from those reducing error to mechanical failure.
  3. (Learning) Can conditioning history within a single lifetime fix the content of a state, or is a history of ancestral success required? This divides theories permitting individual learning from those demanding lineage selection.
  4. (Co-opted trait) If a trait arose because it did A but now does B (which it always could do), is doing B its proper function? This tests whether function follows current utility or specific historical origin.
  5. (Instrumental) Is assigning content a way of describing real relations existing in nature, or is it merely a useful tool for predicting behavior? This separates realist metaphysics from deflationary pragmatism.
  6. (Novel environment) If a detector is moved to an environment where its signal no longer tracks the original target, does its content change to match the new correlation? This distinguishes etiological fixation from views sensitive to current reliability.

  2. The tree
  *   Is content attribution literally true?
      *   No: **Deflationary Leaf** (Instrumentalism)
      *   Yes: Does ancestral history determine content?
          *   No (Ahistorical): Does content shift with current environmental correlations?
              *   Yes: **Unnamed Leaf** (Pure Covariation)
              *   No: **Fodor Leaf** (Asymmetric Dependence)
          *   Yes (Historical): Can individual learning fix content?
              *   Yes: **Dretske Leaf** (Informational Learning)
              *   No (Requires Lineage): Is a co-opted trait's incidental job its proper function?
                  *   Yes: **Neander Leaf** (Selected Effect)
                  *   No: **Millikan Leaf** (Proper Function)

  3. The leaves
  **Deflationary:** Content talk is merely instrumental. Awkward commitment: It cannot explain why some predictions fail due to normative error rather than statistical outlier.

  **Fodor:** Content depends on asymmetric dependence laws. Awkward commitment: The swamp-creature has full mental content despite lacking any evolutionary history.

  **Dretske:** Content is fixed by learning channels. Awkward commitment: Content vanishes if the learning channel is disrupted, even if behavior remains identical.

  **Millikan:** Content depends on consumer proper functions. Awkward commitment: The same internal state has different contents depending on which downstream system uses it.

  **Neander:** Content depends on selected effects. Awkward commitment: Traits with ambiguous selection histories lack determinate content despite clear current utility.

  **Unnamed:** Content tracks current correlation without history. Awkward commitment: It cannot distinguish systematic error from mere variation without invoking asymmetric dependence.

  4. Unoccupied combinations
  Several answer patterns remain empty because they violate internal logic. First, History Required plus Swamp Has Content is incoherent; you cannot demand history for content but grant it to a history-less duplicate. Second, Learning Suffices plus Error is Malfunction is unattractive; it grants content via learning but denies the normativity required for error, collapsing meaning into cause. Third, Ahistorical plus Content Fixed by Ancestry is incoherent; if history is irrelevant to existence, it cannot fix the type of content present. These combinations remain empty because they violate the internal logic of naturalization.

  5. Inseparable pairs
  Millikan and Neander often converge on standard cases, diverging only on co-opted traits or ambiguous lineages. Fodor and Dretske may align on learning cases if learning establishes asymmetric dependence. The tree cannot distinguish these without highly specific edge cases regarding trait ambiguity or counterfactual laws.

  6. Settled versus contested
  Specialists agree that pure covariation without normativity is insufficient and that instrumentalism is a distinct meta-stance. However, core metaphysical questions remain genuinely contested. The swamp-creature case is the primary fault line between historical and ahistorical views; there is no consensus on whether the duplicate has content. Whether ontogeny substitutes for phylogeny is disputed between learning-based and selection-based accounts. The novel environment case contests whether content is fixed by origin or current reliability. Students should treat these as open problems rather than settled doctrine.
