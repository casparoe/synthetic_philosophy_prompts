answer: |-
  Your hypothesis is diagnostically sharp, and it aligns with a growing consensus among specialists that the "demise" of the demarcation problem was more of a strategic retreat from a specific *logical* project than a resolution of the underlying *normative* tensions.

  Here is a breakdown of the current state of the literature, evaluated against your three-job hypothesis, with careful distinctions between what is settled among experts versus what remains contested.

  ### 1. Diagnosis: Is the disagreement substantive or functional?

  Your hypothesis—that "Is X scientific?" conflates three distinct functional roles—is not explicitly codified as a "Three Jobs Theory" in the canonical literature, but it maps accurately onto distinct strands of contemporary philosophy of science that have largely stopped talking to each other.

  *   **Job 1 (Legal/Policy):** This is the domain of **Philip Kitcher** (*The Advancement of Science*, *Science, Truth, and Democracy*) and the expert testimony in *McLean v. Arkansas* (1981) and *Kitzmiller v. Dover* (2005). Here, demarcation is a **gatekeeping mechanism**. The criterion isn't truth or method, but *institutional legitimacy*.
  *   **Job 2 (Epistemic Authority):** This falls under **Social Epistemology** (e.g., Alvin Goldman, Helen Longino). The question here isn't "Is this method scientific?" but "Under what conditions should a layperson defer to this community?" This shifts demarcation from *method* to *social process* (peer review, diversity of scrutiny, uptake of criticism).
  *   **Job 3 (Methodological Norms):** This is the internal practice of science. Here, the "demarcation" is often irrelevant. As you noted, Newtonian physics is "unscientific" by strict falsificationist standards (it was retained despite anomalies), yet it remains the normative standard for engineering.

  **Verdict:** The disagreement is largely functional. When a physicist argues with a philosopher about string theory, the physicist is often talking about Job 3 (heuristic fruitfulness), while the philosopher (or critic) is talking about Job 1 (should this get tenure/funding?) or Job 2 (should we believe this?).

  **[AI Reconstruction]:** I am inferring that the persistence of the debate is *primarily* due to this category error. While philosophers like Sven Ove Hansson have noted that demarcation serves different "practical purposes," your specific tripartite framing is a synthesis I am constructing to explain the *sociological* persistence of the debate, rather than a direct citation of a single established theory.

  ### 2. The "Dead" Debate: Settled vs. Textbook Myth

  You are right to be wary of the textbook narrative. Here is the actual state of play among specialists:

  **Settled (among contemporary philosophers of science):**
  *   **The Logical Positivist Project Failed:** It is settled that no set of necessary and sufficient conditions (syntax, semantics, or method) successfully demarcates science from non-science across all historical cases. Laudan's 1983 argument (*The Demise of the Demarcation Problem*) is accepted on this point: criteria like falsifiability, verifiability, or puzzle-solving capacity all have counter-examples in the history of accepted science.
  *   **Popper's Nuance:** It is settled that Popper did not view falsification as a simple algorithm. He acknowledged the Duhem-Quine problem (that theories can be saved by adjusting auxiliary hypotheses). However, it is *also* settled that Popper's criterion is insufficient for demarcation because, as you noted, pseudosciences (like astrology) often make risky predictions that fail, and "bad" science often fails to make them.
  *   **Demarcation is Value-Laden:** It is settled that demarcation criteria are not value-neutral descriptions; they are normative tools used to privilege certain forms of inquiry over others.

  **Contested (among specialists):**
  *   **Abolition vs. Reform:** This is the main fight.
      *   *Abolitionists (following Laudan):* Argue we should stop using the word "science" as a honorific and focus on specific epistemic virtues (reliability, empirical grounding).
      *   *Reformists (e.g., Pigliucci, Boudry, Hansson):* Argue that while a *logical* demarcation is impossible, a *polythetic* or *cluster* concept is useful for public policy and education.
  *   **The Status of "Pseudoscience":** Some argue "pseudoscience" is a meaningless slur (Abolitionists). Others argue it is a necessary category to protect public epistemic hygiene (Reformists).

  ### 3. Evaluating the Revivalists

  The recent revival (e.g., *Philosophy of Pseudoscience*, ed. Pigliucci & Boudry, 2013; work by Sven Ove Hansson) has not "solved" the logical problem Laudan identified. Instead, they have shifted the goalposts, which counts as progress only if you accept the shift is legitimate.

  *   **Family Resemblance / Cluster Concepts:** Revivalists often employ a Wittgensteinian approach. Science isn't defined by one trait but by a cluster (e.g., willingness to change, empirical checkability, fallibilism, etc.). A field can be "more" or "less" scientific.
      *   *Did this change the question?* Yes. It moved from "Is it in or out?" to "How reliable is it for this specific purpose?"
      *   *Does it solve the problem?* No. It pushes the problem back to: "Which clusters count?" and "Who decides the weighting?" This returns us to your Job 1 (Policy).
  *   **The "Philosophy of Pseudoscience" Turn:** Scholars like Maarten Boudry argue that we need demarcation specifically to combat misinformation (climate denial, anti-vax).
      *   *Critique:* This explicitly embraces Job 1 and Job 2 while largely ignoring Job 3. It admits that demarcation is a political/epistemic defense mechanism, not a metaphysical discovery.

  **[AI Reconstruction]:** My assessment is that the revivalists have not refuted Laudan; they have pragmaticized him. They agree no *logical* criterion works, but argue that a *pragmatic* criterion is necessary for democratic society. This is a shift from epistemology to political philosophy.

  ### 4. What Would Count as Progress?

  Given the above, here is what genuine progress would look like, distinguished from mere relabeling:

  1.  **Distinguishing the Jobs (Your Hypothesis):** Progress requires explicitly stating which "Job" is being performed. If a judge asks for a demarcation criterion (Job 1), a philosopher should not provide a methodological rule for researchers (Job 3). The *Daubert* standard in US law is an attempt at Job 1 that implicitly relies on Job 2 (peer review/publication) while ignoring Job 3 (actual validity). Acknowledging this mismatch is progress.
  2.  **Contextual Demarcation:** Instead of "Is Economics a Science?", the question becomes "Is this specific economic model reliable for predicting inflation vs. understanding historical trends?" This aligns with **Nancy Cartwright's** work on capacities and models. Progress is moving from *disciplinary* demarcation to *claim-level* demarcation.
  3.  **Process over Product:** Following **Helen Longino**, progress lies in demarcating based on the *social processes* of the community (transformative criticism, public standards, uptake of criticism) rather than the logical structure of the theories. This solves Job 2 well but is harder to apply in Job 1 (courts hate evaluating social processes).

  ### 5. Summary of the Landscape

  | Question | Status among Experts | Notes |
  | :--- | :--- | :--- |
  | **Can we define science via necessary/sufficient conditions?** | **Settled: No.** | Laudan (1983) is the consensus view here. |
  | **Is the term "pseudoscience" useful?** | **Contested.** | Abolitionists say no (it's pejorative); Reformists say yes (it's protective). |
  | **Does Popper's falsification solve demarcation?** | **Settled: No.** | Even Popperians admit it fails historically (e.g., Newton). |
  | **Should we continue debating demarcation?** | **Contested.** | Depends on whether you prioritize logical purity (Laudan) or public policy utility (Pigliucci/Hansson). |
  | **Is "science" a natural kind?** | **Settled: No.** | It is viewed as a historical/social category. |

  ### Conclusion

  Your hypothesis holds up: the debate shambles back because the *need* for demarcation (Jobs 1 & 2) persists in society, even if the *logical possibility* of demarcation (Job 3's idealized version) has been refuted.

  The "dead debate" narrative was only true for the specific project of finding a logical algorithm for scientificity. It was never true for the project of determining epistemic authority or funding allocation.

  **[AI Reconstruction]:** I propose that the most productive path forward is not a new criterion, but a **functional disambiguation**. We should treat "scientific" as a context-sensitive predicate: *scientific-for-legal-admissibility*, *scientific-for-public-trust*, and *scientific-for-heuristic-research*. The conflict arises when we assume these are extensionally equivalent. They are not. Recognizing this doesn't solve the political friction, but it dissolves the philosophical confusion that keeps the debate spinning in circles.

  The revivalists haven't changed the question so much as they have admitted that the question was never about logic to begin with; it was about authority. Progress now depends on making that power dynamic explicit rather than hiding it behind methodological criteria.
