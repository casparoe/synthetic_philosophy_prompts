      *   *Verbal:* Is "existence" data? If we define the sample space differently, does the math converge? Usually, no, the posteriors remain distinct. But the *source* of the divergence is the likelihood function assignment.

  8.  **Final Polish:**
      *   Check against constraints: "Numbered section", "Disagreements table", "Cruxes isolated", "Verbal dispute check".
      *   Ensure the "Verbal" section is nuanced. Some philosophers argue the dispute is verbal (e.g., about the meaning of "probability"), but most agree it's substantive regarding betting odds. I should note where terminology might obscure the substantive bet.
      *   Make sure the "Empirical Modesty" point is clear: DA doesn't say "Doom tomorrow," it says "Doom sooner than you thought," but "sooner" is still compatible with millions of years.

