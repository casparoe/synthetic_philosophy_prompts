answer: |-
  **Scenario**

  Consider a one-shot market for a specialized, high-risk repair service where the buyer cannot observe the seller's skill before hiring. There are two types of sellers: "Experts" (low probability of catastrophic failure) and "Novices" (high probability of catastrophic failure). Crucially, both types possess identical liquid capital, so a cash constraint does not physically prevent either from acting. The signal is the posting of a substantial performance bond into an interest-bearing escrow account prior to commencing work; the bond is returned with interest if the repair holds, but forfeited entirely to the buyer as compensation if it fails. In equilibrium, Experts post the bond and secure the contract, while Novices, anticipating the high likelihood of forfeiture, decline to post the bond and exit the market. The Experts perform successfully, retrieve their full capital plus interest, and no resources are destroyed; the Novices mimic neither the signal nor the loss, and the only monetary transfers occur as compensation for actual damages in off-equilibrium events.

  ***

  **Walkthrough**

  **(a) The Verbal Handicap Prediction**
  The colloquial formulation of the handicap principle suggests that for a signal to be honest, it must impose a "costly handicap" that wastes resources, thereby proving the sender's quality through their ability to absorb the waste. Applied to this case, the verbal heuristic predicts the signal should fail: because the Expert retrieves the bond with interest, the signal is ostensibly "free" for them, and since the Novice has the same cash on hand, they should be able to mimic the signal cheaply. The prediction fails because the verbal heuristic conflates *upfront expenditure* with *expected cost*. It assumes honesty requires burning resources to prove strength, whereas this case demonstrates that honesty requires only that the *consequences* of the signal be differentially burdensome based on the sender's private type.

  **(b) The Formal Equilibrium Treatment**
  Formal signaling theory (à la Spence) locates honesty in the incentive compatibility constraint, not in resource destruction. The reliability of the bond arises because the *expected cost* of the signal is $P(\text{Failure}|\text{Type}) \times \text{Bond Amount}$. Since $P(\text{Failure}|\text{Novice}) \gg P(\text{Failure}|\text{Expert})$, the expected cost is prohibitive for the Novice but negligible for the Expert. In the separating equilibrium, the Expert sends the signal and incurs zero net cost (bond returned), while the Novice does not send the signal. Thus, honesty is maintained not by actual waste, but by the *threat* of a contingent transfer that is credible only for the high-quality type. The cost that matters is differential and contingent, not sunk and wasteful.

  **(c) The Structural Feature**
  The single structural feature doing the work is the **contingent penalty tied to the underlying quality**. The signal (the bond) is decoupled from the cost (the forfeiture); the cost is triggered only by the outcome (failure), which is statistically correlated with the sender's type. This structure allows the signal to be physically accessible to all types (satisfying the no-index constraint) while remaining economically prohibitive for the low type in expectation.

  **(d) Removal of the Feature**
  If the contingent penalty is removed—for example, if the bond is returned regardless of performance, or if the forfeiture cap is set to zero—the expected cost of signaling becomes identical for both types (zero). The Novice can then mimic the Expert without risk, the separating equilibrium collapses into a pooling equilibrium, and the signal loses its informational content. The buyer, unable to distinguish types, will offer a price reflecting the average quality, driving the Experts out of the market (adverse selection).

  **(e) The Zahavian Rejoinder and Assessment**
  A Zahavian might rejoin that the *risk* of forfeiture constitutes a real psychological or utility cost (variance aversion), or that the capital tied up in escrow incurs an opportunity cost, thus preserving the "costly" requirement. However, this rejoinder quietly changes the subject from the original Zahavian claim—which emphasizes *wasteful expenditure* (burning resources to show surplus)—to the Spenceian condition of *differential expected disutility*. If we accept risk or opportunity cost as the "handicap," the principle is saved logically, but the requirement for *waste* is abandoned. The case demonstrates that honesty requires cheating to be expensive for the cheater, not that truth-telling must be wasteful for the honest.
