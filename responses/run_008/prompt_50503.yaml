prompt: |-
  I am a graduate student in political philosophy, currently taking a seminar on distributive justice, and I also work twelve hours a week as a caseworker for a municipal emergency hardship fund — crisis grants to individuals, with repayment waived, reduced, or required at my discretion depending on circumstances. The official guidance tells me to weigh how far an applicant is responsible for their own crisis, and to consider attaching conditions (job-search requirements, attendance at budgeting appointments) in cases of what it calls self-inflicted need. I find I have no principled way to make these calls, and my seminar reading suggests the theories not only disagree about where to draw the lines but about whether I should be drawing them at all.

  Please write a decision procedure I can actually run in the ten minutes I have per case. Ground it in the desert and luck-egalitarian literature — the distinction between brute luck and option luck, and the familiar objection that people's choices are themselves products of circumstances they did not choose — but keep it usable by colleagues who have read none of it. The procedure should list the questions in order, say what counts as a sufficient answer to each, mark the points where the theory runs out and I would just be exercising values rather than applying rules, and tell me what to do when I genuinely cannot determine whether someone's situation was their own doing. It should also be honest about the ways it will systematically misfire — for instance, wherever it asks me to estimate choice-versus-circumstance for people whose lives look nothing like mine.

  Then run it on three cases from my recent caseload: (a) a man who quit his job without another lined up after his supervisor mocked him in front of coworkers for weeks, and now cannot pay rent; (b) a woman whose crisis traces to gambling she resumed after eighteen months of being clean, a relapse that followed her mother's death; (c) an applicant who has twice declined "suitable" work we referred her to — my office is unanimous about the third case, and I want to know whether the procedure agrees with us for principled reasons or merely ratifies our prior convictions.

  Please state how confident you are in the procedure overall and single out the step you are least sure of — the point where you suspect the theory is doing the least work and office convention the most.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Graduate student in political philosophy + caseworker for municipal emergency hardship fund.
      *   **Task:** Create a 10-minute decision procedure for granting crisis funds (waiving/requiring repayment, attaching conditions).
      *   **Theoretical Grounding:** Desert and Luck Egalitarianism (Brute Luck vs. Option Luck, Circumstance vs. Choice).
      *   **Constraints:** Usable by colleagues without philosophical training; must acknowledge where theory runs out/values take over; must handle uncertainty (cannot determine responsibility); must admit systematic biases/misfires.
      *   **Application:** Run the procedure on three specific cases (Job quit due to harassment, Gambling relapse after bereavement, Declining suitable work x2).
      *   **Meta-Evaluation:** State confidence level and identify the weakest step (where theory ends and convention begins).

  2.  **Deconstruct the Theoretical Framework:**
      *   *Luck Egalitarianism:* Inequalities due to brute luck (unchosen circumstances) should be compensated; inequalities due to option luck (calculated risks/choices) need not be.
      *   *The Problem:* The "Choice/Circumstance" distinction is blurry. Choices are shaped by circumstances (habitus, trauma, cognitive load).
      *   *Desert:* Do people deserve help based on past behavior or future potential?
      *   *Practical Constraint:* 10 minutes per case. No deep psychological profiling.
      *   *Ethical Constraint:* Avoid punitive moralizing that harms the vulnerable most (systematic bias against those with different life experiences).

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Translate "Brute Luck vs. Option Luck" into caseworker questions.
      *   *Step 1: Immediate Safety/Brute Luck Check.* Is this life-threatening or purely structural? (Filters out the clearest brute luck).
      *   *Step 2: The "Reasonable Person" Standard (Option Luck).* Did they take a risk a reasonable person in their position would avoid?
      *   *Step 3: The "Constraint" Check (Circumstance).* Were their options severely constrained by factors outside their control (trauma, discrimination, cognitive load)?
      *   *Step 4: Uncertainty Principle.* If you can't tell, what's the default? (Luck Egalitarianism usually favors the victim of uncertainty, but policy might not). Let's lean towards "Benefit of the Doubt" to align with the humanitarian goal of the fund, acknowledging the epistemic limit.
      *   *Step 5: Conditions.* If help is granted but responsibility is high, what conditions are proportionate?
      *   *Meta-Commentary:* Need to explicitly state where bias creeps in (e.g., defining "reasonable").

  4.  **Refining the Procedure for Usability:**
      *   Keep it to 5 steps.
      *   Use plain language (no "aleatory uncertainty," use "unforeseeable events").
      *   Include "Stop Rules" (e.g., if Step 1 is Yes, grant immediately).
      *   Include "Bias Warning" boxes.

  5.  **Running the Cases:**
      *   *Case A (Job Quit):*
          *   Brute Luck? Harassment is external.
          *   Option Luck? Quitting without a job is a risk.
          *   Constraint? Power imbalance, psychological toll.
          *   Verdict: Mixed. Likely grant with mild conditions (job search), but waive repayment.
      *   *Case B (Gambling/Bereavement):*
          *   Brute Luck? Mother's death is brute luck.
          *   Option Luck? Gambling is a choice.
          *   Constraint? Grief impairs rational agency.
          *   Verdict: Grant. The root cause (death) is brute luck; the mechanism (gambling) is a coping failure induced by brute luck. Waive repayment.
      *   *Case C (Declining Work):*
          *   Brute Luck? No.
          *   Option Luck? Declining work is a choice.
          *   Constraint? Is the work *actually* suitable? (Transport, childcare, safety).
          *   Verdict: This is the hard one. If "suitable" is defined by the office, it might be biased. If truly suitable, conditions/repayment make sense. If the office is unanimous, is it groupthink? The procedure should force a check on *why* it was declined.

  6.  **Addressing the Meta-Evaluation:**
      *   *Confidence:* Moderate. Theory can't solve resource scarcity or deep epistemic gaps.
      *   *Weakest Step:* Defining "Reasonable Choice" under constraint. This is where class/cultural bias enters.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, empathetic, philosophically rigorous but practical.
      *   *Structure:*
          1.  Introduction (Acknowledging the tension).
          2.  The Procedure (The "10-Minute Luck Protocol").
          3.  Application to Cases.
          4.  Limitations & Confidence Statement.
      *   *Key Philosophical Nuance:* Ensure the distinction between *mitigating circumstances* and *excusing conditions* is clear. Acknowledge that "Option Luck" shouldn't mean "Starve."

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 10 minutes realistic?
      *   *Fix:* Emphasize that this is for *decision-making*, not intake. Intake gathers facts; this protocol processes them.
      *   *Critique:* Did I address the "systematic misfire"?
      *   *Fix:* Add specific "Bias Alerts" in the procedure steps.
      *   *Critique:* Case C needs careful handling. The user says the office is unanimous. I need to challenge that slightly to show the procedure works, not just rubber stamps.
      *   *Refinement on Case C:* The procedure should ask: "Was the refusal based on a constraint (childcare) or a preference (wage/pride)?"

  9.  **Final Polish:** Check against all prompt requirements.
      *   Decision procedure? Yes.
      *   10 minutes? Yes (simplified).
      *   Grounded in Desert/Luck Egalitarianism? Yes.
      *   Usable by non-philosophers? Yes (plain English).
      *   Mark where theory runs out? Yes (in the "Judgment Call" sections).
      *   Handle uncertainty? Yes (Step 4).
      *   Admit misfires/bias? Yes.
      *   Run on 3 cases? Yes.
      *   Confidence/Weakest Step? Yes.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is a decision procedure designed for your context. It translates the core insights of luck egalitarianism (compensate for brute luck, hold accountable for option luck) and desert theory (conditions based on future conduct) into a workflow that fits a ten-minute window.

  It is designed to be printed as a one-page checklist.

  ***

  # The 10-Minute Luck & Responsibility Protocol

  **Purpose:** To determine grant approval, repayment terms, and conditions without requiring deep philosophical training.
  **Theoretical Basis:** Luck Egalitarianism (Brute vs. Option Luck) and Soft Paternalism.
  **Warning:** This tool cannot eliminate bias. It only makes the points where bias enters visible.

  ### Step 1: The Brute Luck Filter (Time: 2 mins)
  *Ask: Did an unchosen, unforeseeable event trigger the immediate crisis?*
  *   **Examples:** Sudden illness, death in family, natural disaster, employer fraud, sudden legislative change to benefits.
  *   **Decision:**
      *   **YES:** Grant Full Waiver. No conditions. (Theory: This is pure brute luck; responsibility is zero).
      *   **NO:** Proceed to Step 2.
      *   **MIXED:** (e.g., illness led to job loss which led to debt). Proceed to Step 2, but note the root cause was brute luck.

  > **⚠️ Bias Alert:** Do not confuse "foreseeable" with "common." Poverty makes crises common, but not chosen. If an event is common for poor people but unforeseeable for the average citizen, count it as Brute Luck.

  ### Step 2: The "Constrained Choice" Test (Time: 3 mins)
  *Ask: If the applicant made a choice that led to crisis (e.g., quitting, spending), was their agency significantly impaired by circumstances they did not choose?*
  *   **Look for:** Acute grief, documented mental health episodes, threat of physical safety, lack of viable alternatives (e.g., no childcare).
  *   **Decision:**
      *   **YES (Agency Impaired):** Treat as Brute Luck. Grant Full Waiver. (Theory: Choices made under duress or severe structural constraint are not true "option luck").
      *   **NO (Agency Intact):** Proceed to Step 3.
      *   **UNCLEAR:** Proceed to Step 4.

  > **⚠️ Bias Alert:** This is the highest risk step. We tend to view our own stressors as "constraints" and others' as "choices." If the applicant's reaction seems irrational to *you*, ask: "Would this reaction make sense in their specific survival context?"

  ### Step 3: The Risk Assessment (Time: 2 mins)
  *Ask: Did the applicant take a calculated risk that failed?*
  *   **Examples:** Quitting a job to start a business, gambling with rent money, refusing a job offer to hold out for higher pay.
  *   **Decision:**
      *   **YES:** Eligibility for Grant **Confirmed**, but attach **Conditions** (e.g., budgeting, job search). Repayment **Required** (scaled to income). (Theory: This is Option Luck; society cushions the fall but does not subsidize the risk).
      *   **NO:** (e.g., money stolen, wages withheld). Return to Step 1 (Full Waiver).

  ### Step 4: The Epistemic Humility Rule (Time: 1 min)
  *Ask: Can I definitively prove this was a free choice?*
  *   **Context:** You have 10 minutes. You do not know their life. You cannot measure the weight of their trauma or the subtle coercion of their environment.
  *   **Decision:**
      *   **If Doubt Exists:** Default to **Full Waiver / No Conditions**.
      *   **Reasoning:** The moral cost of wrongly punishing a victim of circumstance (denying aid to someone who didn't choose their plight) is higher than the cost of wrongly aiding a responsible agent (giving money to someone who made a bad bet).
      *   **Theory:** This prioritizes the "Minimum Threshold" of justice over "Perfect Desert."

  ### Step 5: Condition Setting (Time: 2 mins)
  *If Conditions/Repayment were triggered in Step 3:*
  *   **Rule:** Conditions must be forward-looking, not punitive.
  *   **Check:** Is the condition likely to prevent *future* brute luck exposure? (e.g., "Attend budgeting workshop" = Yes. "Write apology letter" = No).
  *   **Hard Stop:** If the condition creates a new barrier to stability (e.g., appointment times conflict with shift work), waive it.

  ***

  # Application to Recent Caseload

  Here is how the protocol processes your three cases.

  ### Case A: The Harassed Employee
  *Facts: Quit job without backup after weeks of public mockery by supervisor. Now cannot pay rent.*

  1.  **Brute Luck Filter:** **Mixed.** The harassment is brute luck (unchosen hostility). The quitting is a choice.
  2.  **Constrained Choice:** **YES.** Enduring public humiliation carries psychological and reputational costs. In a power imbalance, "quitting" is often a defensive reaction to abuse, not a leisure preference. Agency is impaired by the hostile environment.
  3.  **Decision:** **Treat as Brute Luck.**
  4.  **Outcome:** **Grant Full Waiver.** No repayment.
  5.  **Conditions:** None. (Job search requirements are redundant; he is already unemployed and seeking).
  6.  **Protocol Note:** A strict "you shouldn't have quit" view fails Step 2. The protocol recognizes that staying in an abusive environment is not a "reasonable option" for most people.

  ### Case B: The Bereaved Gambler
  *Facts: Gambling relapse after 18 months clean. Relapse triggered by mother's death.*

  1.  **Brute Luck Filter:** **YES (Root Cause).** The mother's death is unchosen brute luck.
  2.  **Constrained Choice:** **YES.** Grief is a known impairer of executive function and impulse control. The relapse is a symptom of the brute luck event, not an independent "lifestyle choice."
  3.  **Decision:** **Treat as Brute Luck.**
  4.  **Outcome:** **Grant Full Waiver.**
  5.  **Conditions:** Optional referral to counseling, but not mandatory for grant receipt.
  6.  **Protocol Note:** A desert-based view might say "gambling is always a choice." The Luck Egalitarian view sees the *vulnerability* to gambling as imposed by the death. To deny aid is to punish her for the mechanism of her grief.

  ### Case C: The Job Refuser
  *Facts: Declined "suitable" work referrals twice. Office is unanimous: deny/penalize.*

  1.  **Brute Luck Filter:** **NO.**
  2.  **Constrained Choice:** **INVESTIGATE.** Why was it declined?
      *   *Scenario 1:* Declined due to lack of childcare or transport cost exceeding wage. -> **Constraint YES.** (Grant Waiver).
      *   *Scenario 2:* Declined due to wage being slightly below previous role, or "pride." -> **Constraint NO.**
  3.  **Risk Assessment:** Assuming Scenario 2 (as office consensus implies "suitable" means "logistically possible"). This is **Option Luck**. She is betting she can find better work before crisis hits. She lost the bet.
  4.  **Decision:** **Grant with Conditions/Repayment.**
  5.  **Outcome:** Grant the emergency fund (to prevent homelessness/starvation, which violates the minimum threshold), but **Require Repayment** and **Mandate Acceptance** of the next suitable offer.
  6.  **Protocol Note:** The protocol **agrees** with your office, but for a specific reason: It classifies this as *Option Luck*, not *Desert*. We are not punishing her for being "undeserving"; we are asking her to share the cost of a risk she took.
      *   *Caveat:* You must verify the definition of "suitable." If "suitable" ignores her specific constraints (e.g., single mother, no car), the office is committing the Bias Error in Step 2.

  ***

  # Meta-Evaluation & Confidence Statement

  **Overall Confidence: Moderate (65%)**
  This procedure is robust for preventing the worst moral harms (denying aid to victims of brute luck) but cannot guarantee perfect justice. It is a triage tool, not a truth machine.

  **The Weakest Step: Step 2 (The Constrained Choice Test)**
  This is where the theory does the least work and office convention does the most.
  *   **Why:** Luck egalitarianism relies on a clean distinction between "choice" and "circumstance." In reality, preferences, risk tolerance, and impulse control are all products of circumstance (upbringing, trauma, neurology).
  *   **The Risk:** When you ask, "Was her agency impaired?", you are inevitably using your own life experience as the baseline for "normal agency."
  *   **Example:** In Case C, if your office defines "suitable work" based on a single earner with no care responsibilities, you will systematically classify single parents as "making bad choices" rather than "facing constraints." The protocol flags this in the **Bias Alert**, but it cannot fix it. That requires structural policy change, not caseworker discretion.

  **Handling Uncertainty (Step 4)**
  I have built in a "Benefit of the Doubt" clause. In political philosophy, this aligns with the *Priority View* (prioritizing the worst off) over strict *Luck Egalitarianism*. Strict luck egalitarianism might say "If we can't prove it was brute luck, we don't compensate." I have rejected that for your context because the cost of error falls entirely on the applicant. If you guess wrong, they lose housing; if you guess wrong the other way, the fund loses money. The asymmetry of harm dictates the default.

  **Final Advice:**
  Use this protocol to justify your intuition when it conflicts with the office consensus (like Case C), but use the **Bias Alerts** to interrogate your intuition when it aligns too easily with them. If the whole office agrees instantly on a "responsibility" judgment, that is usually a sign of shared cultural bias, not shared philosophical clarity.
