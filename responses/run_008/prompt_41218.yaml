answer: |-
  There is no single, universally standardized term in philosophy or social science that captures *exactly* this specific carving of the phenomenon, though several fields circle it.

  The closest existing concept is **Teleonomy** (from biology and systems theory), often applied to social systems under the banner of **Spontaneous Order** (Hayek) or **Complex Adaptive Systems** (CAS). However, you are right that these often describe the *mechanism* or the *state*, not the specific *phenomenology of goal-directedness without intention*.

  In the philosophy of collective intentionality (Searle, Bratman, Gilbert), this is the "limit case" or the "null hypothesis"—it is what collective behavior looks like when you *remove* the "we-intention."

  Since no single term perfectly captures the *adaptive, error-correcting, goal-convergent* nature of the phenomenon while explicitly excluding shared intention, I will propose a term that bridges the biological and social literature, define it rigorously, and carve its boundaries.

  ### The Proposed Term: **Distributed Teleonomy**

  **Definition:**
  A **Distributed Teleonomy** is a systemic property of a collective wherein the aggregate behavior exhibits error-correcting, goal-convergent dynamics functionally indistinguishable from intentional agency, despite the absence of shared intention, centralized control, or common knowledge of the goal among participants.

  **Etymology & Lineage:**
  *   **Teleonomy:** Coined in biology (Pittendrigh, 1958) to describe systems that appear purposeful (like an eye or an ant colony) but are driven by evolutionary programming or local rules rather than conscious foresight.
  *   **Distributed:** Indicates that the "control" and "information" are dispersed across individual nodes (agents) who act only on local information.

  ---

  ### The Carving: What It Is and What It Is Not

  To carve this phenomenon properly, we must distinguish it from its neighbors in the landscape of social action.

  #### 1. It is NOT Joint Action (The "We-Mode")
  *   **Standard View:** In Bratman's or Searle's framework, collective action requires a "we-intention" (e.g., "I intend that *we* paint the house").
  *   **Distributed Teleonomy:** Operates entirely in the "I-Mode." Each participant has a local intention ("I want to get to class fastest," "I want to publish a paper"). The "goal" (the path, the field's survival) exists only at the systemic level, not in any individual's head.
  *   **The Edge:** If the students met and agreed to wear a path to protest the fencing, it becomes Joint Action. If they just walk, it is Distributed Teleonomy.

  #### 2. It is NOT Mere Aggregation (The "Statistical Mode")
  *   **Standard View:** Average height or total rainfall are aggregates. They do not respond to setbacks. If you fence off "average height," the average doesn't shift to compensate.
  *   **Distributed Teleonomy:** Must possess **negative feedback loops**. The system detects deviation from a functional optimum (the path is blocked, the funding is dry) and adjusts flow to restore function.
  *   **The Edge:** A crowd panicking and trampling an exit is an aggregate reaction (positive feedback/instability). A crowd finding a *new* exit when the first is blocked is Distributed Teleonomy.

  #### 3. It is NOT Centralized Agency (The "Corporate Mode")
  *   **Standard View:** A corporation pivots because a board votes. The goal is represented explicitly in a charter.
  *   **Distributed Teleonomy:** The "goal" is implicit in the incentives and constraints. No one can point to the document where the goal was written, because it emerged from the pressure of the environment.

  ---

  ### Analysis of Your Edge Cases

  Using **Distributed Teleonomy** as the lens, here is how your examples classify:

  #### 1. The Market Bubble
  *   **Verdict:** **Partial Fit (Pathological Teleonomy).**
  *   **Analysis:** A market *usually* exhibits distributed teleonomy (price discovery, efficient allocation). However, a *bubble* is a breakdown of the error-correcting mechanism. The feedback loop becomes positive (price rises -> buy more -> price rises) rather than negative. It looks goal-directed (converging on a price), but it fails the "adaptation to reality" test. It is a **Teleonomic Hallucination**.

  #### 2. A Wikipedia Article
  *   **Verdict:** **Strong Fit.**
  *   **Analysis:** No single editor intends the final article. Editors act on local rules (NPOV, citation needed). The article "defends" itself against vandalism and "converges" on accuracy. It has a functional goal (accuracy/coverage) maintained by distributed agents without a shared plan for the final text. This is a classic **Distributed Teleonomic System**.

  #### 3. The Standing Ovation
  *   **Verdict:** **Borderline (Informational Cascade).**
  *   **Analysis:** This is often less about a "goal" and more about **signaling**. Once three people clap, the "goal" for others shifts from "evaluate the play" to "don't be the only one sitting." It is adaptive, but the "goal" is social coordination, not an external functional outcome. It fits the *mechanism* of distributed teleonomy, but the *telos* is trivial (conformity). It is **Mimetic Teleonomy**.

  #### 4. The Research Field Abandonment
  *   **Verdict:** **Perfect Fit.**
  *   **Analysis:** This is exactly what you described. The "goal" (survival of the field) is pursued by the system, even as every individual acts to save their own career (leaving the field). The system "senses" the lack of replication (negative feedback) and reduces input (scientists). It is a **Homeostatic Collective**.

  ---

  ### Relation to Collective Intentionality & Group Agents

  This is where the philosophical friction lies.

  **1. The "Group Agent" Debate (List & Pettit)**
  Philip Pettit and Christian List argue that for a group to be an "agent," it must form judgments and intentions that are distinct from its members.
  *   **Standard Group Agent:** The group votes, forms a belief, and acts. (Requires procedural structure).
  *   **Distributed Teleonomy:** The group *behaves* as if it has beliefs and goals, but lacks the *representational state*.
  *   **Implication:** Distributed Teleonomy suggests that **Agency might be a functional category, not an ontological one.** You don't need a "mind" to have "goals"; you only need a feedback loop that preserves a variable.

  **2. The Invisible Hand (Nozick/Hayek)**
  Robert Nozick described "Invisible Hand Explanations" as explaining a pattern without intending it.
  *   **Relation:** Distributed Teleonomy is the *ontological status* of the thing that Invisible Hand explanations describe. The Invisible Hand is the *cause*; Distributed Teleonomy is the *effect*.

  **3. Methodological Individualism vs. Holism**
  *   **Individualists** say: "Only the students exist; the path is a fiction."
  *   **Holist** say: "The path exerts force on new students; it is real."
  *   **Distributed Teleonomy** bridges this: The path is real *because* of the individual actions, but it has causal power *over* the individuals (new students see the path and walk it). It is an **Emergent Constraint**.

  ### Summary Definition for Use

  If you need to use this in writing or argument, here is the rigorous definition:

  > **Distributed Teleonomy (n.):** A collective phenomenon wherein a population of independent agents, acting solely on local incentives and information without shared intention or centralized coordination, generates aggregate behavior that exhibits negative feedback, error correction, and convergence toward a functional optimum.
  >
  > *Distinguishing features:*
  > 1.  **Intentional Asymmetry:** The goal exists at the system level, not the agent level.
  > 2.  **Functional Resilience:** The system adapts to perturbations (fences, funding cuts) to maintain the outcome.
  > 3.  **Decentralized Control:** No single node possesses the "map" of the goal.

  This captures the "ghost in the machine" quality you are noticing: the machine is real, the ghost is not, but the haunting is functional.
