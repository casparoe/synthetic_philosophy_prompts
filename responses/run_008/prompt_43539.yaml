      *   *Distinction:* "Total Harm" vs. "Violence Rate." The claim "The world is less violent" usually means "The risk of violence is lower." If the colleague interprets it as "Total harm is lower," they are attacking a straw man. If they interpret it as "Risk is lower," then absolute numbers are irrelevant.
      *   *Crucial Point:* The argument equivocations on the meaning of "violence." Is it an aggregate substance or a rate of occurrence?
