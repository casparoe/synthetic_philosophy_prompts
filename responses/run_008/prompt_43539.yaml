  9.  *(Self-Correction during drafting)*: I need to be careful not to just say "Per capita is better." I need to explain *why* that makes the claim factual rather than conventional. The key is that the *question* being asked ("Is the world becoming less violent?") implicitly references the *experience* of agents. If the question is about the *sum total of suffering*, absolute numbers matter. But "violence" as a historical trend usually refers to the *orderliness* of society. Orderliness is a rate, not a sum. Therefore, picking the rate isn't a convention; it's a translation of the question into data.

