  3.  **Evaluate Potential Points of Rejection:**

      *   *Rejecting (1):* Too strong. We do need measures.
      *   *Rejecting (2):* Factually incorrect. The divergence exists.
      *   *Rejecting (3):* This is the most promising target. The claim that "nothing in the world decides between them" is the weak link. It assumes a false dichotomy between "mind-independent fact" and "pure convention."
