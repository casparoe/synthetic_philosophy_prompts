      *   *Why (3) is flawed:* It conflates *conceptual stipulation* with *empirical discovery*. While the *definition* of a metric is a convention, the *trend* identified by a well-justified metric is a fact. The choice of metric isn't arbitrary; it's constrained by the *explanandum* (what are we trying to explain?).
      *   *The "Risk" Counter-argument:* The user noted that attacking per-capita metrics makes individual risk look conventional. Actually, the reverse is true. Individual risk *is* the morally and causally relevant quantity for most historical questions about safety/order. Therefore, the choice isn't arbitrary; it's driven by the nature of the phenomenon (violence as a threat to agents).
