answer: |-
  ### The Example: The "Ghost Circuit"

  **The Scenario**
  Imagine a secure server room with a legacy alarm system. The system is controlled by a physical toggle switch ($A$) located in a locked maintenance closet. When the switch is flipped, it completes a circuit that triggers a silent alarm ($C$) at the security station.

  **The Facts (Metaphysical Reality)**
  Unknown to everyone, the wiring in the closet is actually pristine. The circuit is deterministic and fully functional. In the actual world, if the switch is flipped, the alarm *must* sound. However, the switch is currently in the "off" position, and the alarm is silent.

  **The Epistemic Context**
  A security technician, Sarah, is investigating a potential breach. She has strong but inconclusive evidence that the wiring in the closet has degraded due to water damage. Her diagnostic equipment suggests a 60% probability of a circuit break. She does not know the actual position of the switch, but she is assessing the risk. Her current information state (the "context set" of epistemically live possibilities) includes worlds where the wiring is broken. In those live possibilities, the switch could be flipped ($A$) without the alarm sounding ($\neg C$).

  **The Pair of Conditionals**
  1.  **Indicative:** "If the switch **is** flipped, the alarm **sounds**."
  2.  **Counterfactual:** "If the switch **had been** flipped, the alarm **would have sounded**."

  **The Truth Values**
  *   **The Counterfactual is True.** This statement is evaluated against the objective causal structure of the actual world. Since the actual wiring is pristine, the closest possible world where the switch is flipped is a world where the circuit completes and the alarm sounds. The objective causal link guarantees the truth of the counterfactual.
  *   **The Indicative is False.** This statement is evaluated relative to Sarah's epistemic state. In the semantics of indicatives (following Stalnaker or Kratzer), we quantify over epistemically accessible worlds. Because Sarah's evidence makes it a live possibility that the wiring is broken, there are epistemically accessible worlds where the switch is flipped ($A$) and the alarm fails ($\neg C$). In fact, given her diagnostic data, the most epistemically probable $A$-worlds are ones where the circuit fails. Therefore, relative to her information, the conditional "If $A$, $C$" does not hold; it is false (or at best, highly improbable, which renders it false in a binary truth-conditional framework that requires high probability for truth).

  ### Analysis of the Truth Values

  The divergence in truth values arises from the different "modal bases" used to evaluate the two moods.

  1.  **Counterfactual Evaluation:** Counterfactuals are typically anchored to the **actual world's laws and facts**. When we say, "If the switch had been flipped...", we hold fixed the actual state of the wiring (which is functional) and make the minimal change necessary to make the antecedent true (flipping the switch). Since the actual wiring supports the connection, the consequent follows. The truth of the counterfactual depends on how the world *is*, not on what Sarah *knows*.
  2.  **Indicative Evaluation:** Indicatives are typically anchored to the **speaker's information state**. When Sarah says, "If the switch is flipped...", she is asking what follows given what she currently knows. Since her knowledge allows for the possibility of broken wiring, it does not follow that the alarm sounds. The truth of the indicative depends on the elimination of $\neg C$ possibilities within the epistemic context set. Because those possibilities have not been eliminated, the conditional fails.

  ### Implications for Semantic vs. Pragmatic Accounts

  This example provides strong evidence for a **genuinely semantic distinction** between indicative and counterfactual conditionals, rather than a merely pragmatic one.

  **The Pragmatic Account (and its failure here)**
  A pragmatic account (such as early formulations by Anderson or certain Gricean views) suggests that the difference between "If $A$, $C$" and "If $A$ had been, $C$ would have been" is solely one of **presupposition**. On this view, the counterfactual mood merely signals that the speaker believes $A$ is false, while the indicative signals that $A$ is epistemically open. Crucially, this view often assumes the underlying truth-conditional content (the proposition expressed) is the same—typically a material conditional or a strict conditional over the same set of worlds.

  If the pragmatic account were correct, and the truth conditions were identical, it would be impossible for one conditional to be true while the other is false in the same context. They would stand or fall together. The "Ghost Circuit" case shows they do not. The counterfactual is true because the *world* supports it; the indicative is false because the *information* does not.

  **The Semantic Account (and its success here)**
  A semantic account (such as Stalnaker's or Kratzer's) posits that the grammatical mood contributes directly to the **truth conditions** by selecting different parameters for evaluation.
  *   The **indicative** morpheme instructs the semantics to use an **epistemic modal base** (quantifying over worlds compatible with what is known).
  *   The **counterfactual** morpheme instructs the semantics to use a **metaphysical or causal ordering source** anchored to the actual world (quantifying over worlds most similar to reality).

  Because these parameters can come apart (as they do when an agent is ignorant of a deterministic causal law), the truth values can diverge. The fact that we can construct a coherent scenario where the counterfactual is true and the indicative is false demonstrates that the moods are not just stylistic markers of belief; they are operators that shift the domain of quantification.

  **Conclusion**
  The "Ghost Circuit" example demonstrates that the reverse pattern (Counterfactual True, Indicative False) is not only possible but arises naturally in cases of **unknown determinism**. This divergence falsifies the claim that the difference between the moods is purely pragmatic. Instead, it supports a semantic theory where indicative and counterfactual conditionals are distinct logical operators: the former tracks epistemic inference, while the latter tracks metaphysical or causal dependency.
