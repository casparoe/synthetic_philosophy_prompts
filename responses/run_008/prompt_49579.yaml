      *(Refining the "Threat" section)*: Only the Metaphysical reading threatens Kripke. The Epistemic reading is compatible with Kripke. The "Primary Intension" reading is compatible *if* we accept 2DS, but Kripkeans might reject the primary intension as semantic content.

