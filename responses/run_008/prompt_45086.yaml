      *   **Topic:** The Liar Paradox (specifically the divide between Truth-Value Gap theorists [e.g., Kripke, Field] and Dialetheists [e.g., Priest, Beall]).
      *   **Goal:** Create a document representing a "good-faith adversarial collaboration" that these two camps *should* have produced.
      *   **Requirements:**
          1.  Numbered section of agreed claims (common ground).
          2.  Disagreements table (neutral phrasing, identify verbal vs. substantive).
          3.  Cruxes (key points of divergence, e.g., truth/falsehood gap, explosion, Curry's paradox).
          4.  For each crux: Concrete test/case, pre-registered predictions from both sides (what counts against them).
      *   **Tone:** Rigorous, philosophical, precise, avoiding watered-down consensus. Acknowledge deep incompatibilities where they exist.
      *   **Format:** Numbered agreed claims -> Disagreements Table -> Cruxes with predictions.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *The Liar Sentence ($L$):* "This sentence is not true."
      *   *Naive Truth Schema (T-Schema):* $T(\ulcorner \phi \urcorner) \leftrightarrow \phi$.
      *   *Gap Theory (Paracomplete):* $L$ is neither true nor false. Logic is weaker than classical (fails LEM or Disjunctive Syllogism).
      *   *Dialetheism (Paraconsistent):* $L$ is both true and false. Logic is weaker than classical (fails Explosion/EFQ).
      *   *Revenge:* "This sentence is not true or is gappy" (for Gap theorists); "This sentence is only false" (for Dialetheists).
      *   *Curry's Paradox:* "If this sentence is true, then $\bot$." Threatens both, but differently.
      *   *Explosion (EFQ):* $A, \neg A \vdash B$. Dialetheists reject this. Gap theorists usually keep it but reject $A \vee \neg A$.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to capture the shared burden. Both sides accept the data (the paradox) and the failure of classical solutions.
      *   *Claim 1:* The T-Schema is pre-theoretically compelling. We don't abandon it lightly.
      *   *Claim 2:* Syntactic bans on self-reference fail (Quine, Gödel numbering, indexicals).
      *   *Claim 3:* "Revenge" is the shared enemy. Any solution must handle strengthened liars.
      *   *Claim 4:* Classical logic + Naive Truth + Consistency is inconsistent. Something gives.
      *   *Claim 5:* The goal is to save as much of classical reasoning (math, science) as possible.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need neutral phrasing. Avoid "mistakenly" or "correctly."
      *   *Issue 1:* Status of $L$. Gap: Neither. Dialetheist: Both.
      *   *Issue 2:* Logical Rule to Drop. Gap: LEM/DS. Dialetheist: Explosion.
      *   *Issue 3:* Semantics of Negation. Gap: Exclusionary (cannot be both). Dialetheist: Non-exclusionary (can be both).
      *   *Issue 4:* Expressive Completeness. Can the theory express its own semantic category? (Gap: Struggles with "gappy". Dialetheist: Struggles with "just false".)
      *   *Verbal vs. Substantive:* Is it just a label swap? No, it affects inference rules (DS vs. EFQ). It's substantive.

  5.  **Drafting Section 3: The Cruxes (with Pre-registered Predictions):**
      *   This is the core scientific-style requirement. What would falsify or stress the theories?
      *   *Crux 1: The Nature of Negation & "Not True".*
          *   Test: The "Exclusion" intuition. If I say "It's not true," do I exclude truth?
          *   Gap Prediction: Dialetheism makes communication impossible because assertion loses exclusionary force.
          *   Dialetheist Prediction: Gap theory cannot express "falsehood" without collapsing into classicality or silence.
      *   *Crux 2: Explosion vs. Disjunctive Syllogism (The Logic Trade-off).*
          *   Test: Validity of $A, \neg A \vee B \vdash B$.
          *   Gap Prediction: Paraconsistent logic renders standard reductio arguments in math suspect.
          *   Dialetheist Prediction: Paracomplete logic renders proof by cases (LEM) suspect in infinite domains.
      *   *Crux 3: The Revenge Problem (Expressive Completeness).*
          *   Test: The "Strengthened Liar."
          *   Gap: "This sentence is not true or is gappy."
          *   Dialetheist: "This sentence is exclusively false."
          *   Prediction: Gap side says Dialetheists cannot define "exclusive falsehood." Dialetheist side says Gap theorists cannot define "gappy" without using classical meta-language.
      *   *Crux 4: Curry's Paradox.*
          *   Test: $C \leftrightarrow (T(C) \rightarrow \bot)$.
          *   Both sides must restrict Conditional Introduction/Contractions.
          *   Prediction: Who sacrifices more of naive conditional reasoning?

  6.  **Refining and Polishing:**
      *   *Tone Check:* Ensure it sounds like a joint statement, not a referee report. Use "We agree," "Camp A maintains," "Camp B maintains."
      *   *Geophysicist Appeal:* Use terms like "stress test," "boundary conditions," "model fidelity."
      *   *Philosophical Accuracy:* Ensure Kripke/Field (Gap) and Priest/Beall (Dialetheist) positions are represented fairly.
          *   *Correction:* Make sure to distinguish between *paracomplete* (Gap) and *paraconsistent* (Dialetheist).
          *   *Nuance:* Acknowledge that some Dialetheists accept gaps for *other* reasons, but regarding the Liar, they accept gluts.
      *   *Formatting:* Clear headings, tables, numbered lists.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe they can agree on a solution to Curry.
      *   *Correction:* No, Curry is hard for both. Better to list it as a shared vulnerability/crux.
      *   *Initial thought:* Call them "Gap Theorists" and "Glut Theorists."
      *   *Correction:* "Paracomplete" and "Paraconsistent/Dialetheist" is more precise, but "Gap" and "Glut" is more readable. Let's use "Gap-Theoretic (Paracomplete)" and "Glut-Theoretic (Dialetheist)" for clarity.
      *   *Check on "Verbal Dispute":* Is it just about the word "true"? No, because it dictates which inference rules hold. Must emphasize the *inferential* cost.
      *   *Check on Pre-registration:* Make sure the "What would count against us" is explicit.

  8.  **Final Review against constraints:**
      *   Numbered agreed claims? Yes.
      *   Disagreements table (neutral)? Yes.
      *   Cruxes with concrete tests/predictions? Yes.
      *   No watered-down consensus? Yes, acknowledge the "Revenge" stalemate.
      *   Tone appropriate for a scientist-philosopher? Yes.

  9.  **Final Polish:** (Writing the response based on these thoughts.)
answer: |-
  **JOINT STATEMENT OF ADMITTED VULNERABILITIES AND REGISTERED DISPUTES**
  **Subject:** The Semantic Paradoxes (Liar, Curry, Revenge)
  **Parties:** Paracomplete/Gap-Theoretic Camp (hereafter "Gap") & Paraconsistent/Dialetheic Camp (hereafter "Glut")
  **Date:** October 2023
  **Status:** Pre-registered Adversarial Collaboration

  ---

  ### 1. AGREED CLAIMS (COMMON GROUND)

  We, the undersigned representatives of the Gap and Glut theoretical frameworks, acknowledge the following as established constraints on any adequate theory of truth. We agree that classical logic combined with naive truth is inconsistent, and that the burden of proof lies on us to specify precisely which classical principle is sacrificed and why the cost is acceptable.

  1.  **The Naive Truth Schema is Non-Negotiable as Data:** The T-Schema ($T(\ulcorner \phi \urcorner) \leftrightarrow \phi$) is not merely a formal convenience; it captures the pre-theoretic concept of truth. Any solution that restricts the T-Schema arbitrarily (e.g., by Tarski-style hierarchy) is rejected by both camps as failing to model natural language.
  2.  **Syntactic Bans Fail:** Restrictions on self-reference (via type theory, stratification, or syntactic bans) are insufficient. We agree that indirect self-reference (via Gödel numbering, Quinean diagonalization, or indexical context) renders syntactic solutions incapable of handling the empirical data of natural language.
  3.  **The "Revenge" Problem is the Primary Stress Test:** A solution to the Simple Liar ("This sentence is false") is insufficient. Any viable theory must handle the Strengthened Liar ("This sentence is not true" for Gap; "This sentence is exclusively false" for Glut). We agree that if a theory cannot express its own semantic category (e.g., "gappy" or "glutty") without contradiction, it suffers from expressive incompleteness.
  4.  **Classical Logic Must Be Recoverable in Safe Domains:** Both camps agree that classical logic remains valid for ordinary mathematics and empirical science (e.g., Peano Arithmetic, standard physics). The deviation from classical logic must be localized to semantic closures or inconsistent objects. A theory that renders standard reductio ad absurdum invalid in number theory is unacceptable.
  5.  **Curry's Paradox is a Shared Threat:** We agree that Curry's Paradox ("If this sentence is true, then $\bot$") threatens both frameworks independently of negation. Both camps must restrict the structural rules of the conditional (e.g., Contraction or Modus Ponens) to avoid triviality. This is a shared vulnerability, not a point of divergence.

  ---

  ### 2. DISAGREEMENTS TABLE

  The following table isolates the specific points of divergence. Wording has been negotiated to ensure neither side characterizes the other's position as a "mistake" in the description, but rather as a distinct theoretical commitment.

  | Issue | Gap-Theoretic Characterization (Paracomplete) | Glut-Theoretic Characterization (Dialetheic) | Nature of Dispute |
  | :--- | :--- | :--- | :--- |
  | **Status of Liar ($L$)** | $L$ lacks a truth value. It is a "gap." The world does not determine a truth condition for $L$. | $L$ possesses both truth values. It is a "glut." The world is inconsistent at semantic boundaries. | **Substantive.** Disagreement on the ontology of truth bearers. |
  | **Logical Sacrifice** | We reject the Law of Excluded Middle ($A \vee \neg A$) and Disjunctive Syllogism in semantic contexts. | We reject the Law of Non-Contradiction ($\neg(A \wedge \neg A)$) and Explosion (EFQ) in semantic contexts. | **Substantive.** Disagreement on which inference rules are valid. |
  | **Negation Semantics** | Negation is exclusionary. To assert $\neg A$ is to deny $A$. $A$ and $\neg A$ cannot both hold. | Negation is not necessarily exclusionary. To assert $\neg A$ is to assert the contradictory of $A$. $A$ and $\neg A$ can both hold. | **Verbal/Substantive Hybrid.** Depends on whether "negation" is defined by inference rules or truth conditions. |
  | **Expressive Power** | We can express "untruth" but struggle to express "gappiness" within the object language without reintroducing paradox. | We can express "falsehood" but struggle to express "exclusive falsehood" (false and not true) within the object language. | **Substantive.** Both face a "Revenge" limitation on expressive completeness. |
  | **Rational Denial** | Denial is a primitive speech act distinct from asserting negation. We deny $L$ without asserting $\neg L$. | Denial is asserting negation. We assert $\neg L$ (and $L$). Rational acceptance of contradictions is possible. | **Substantive.** Disagreement on the norms of assertion and belief. |

  **Note on Verbal vs. Substantive:** We acknowledge that if the dispute were merely about labeling (calling $L$ "gappy" vs. "glutty"), it would be verbal. However, because the labeling dictates which *inference rules* are valid (Disjunctive Syllogism vs. Explosion), the dispute has substantive consequences for proof theory and mathematical practice.

  ---

  ### 3. THE CRUXES: PRE-REGISTERED PREDICTIONS & TESTS

  This section details the specific "stress tests" where our models diverge. For each crux, we state what empirical or formal outcome would count as evidence against our respective frameworks.

  #### Crux 1: The "Explosion" vs. "Disjunctive Syllogism" Trade-off
  **The Issue:** Classical logic validates both Explosion ($A, \neg A \vdash B$) and Disjunctive Syllogism ($A, \neg A \vee B \vdash B$). Gap logic keeps Explosion but drops DS. Glut logic keeps DS but drops Explosion.
  **The Test:** Application of *Reductio Ad Absurdum* in semi-formal reasoning involving semantic predicates.
  **Case:** Consider a proof where one assumes $A$, derives a contradiction ($B \wedge \neg B$), and concludes $\neg A$.

  *   **Gap Prediction:**
      *   *Our Model:* This reasoning holds. Contradictions imply everything (Explosion holds), so deriving a contradiction proves the assumption false.
      *   *Opponent's Failure:* The Glut model must reject this standard mathematical move in semantic contexts. If they allow it, they collapse into triviality. We predict their logic will fail to validate standard reductio proofs involving truth predicates.
      *   *Falsification Condition for Gap:* If it is demonstrated that rejecting DS makes standard analysis (e.g., continuity proofs) impossible even in non-semantic contexts, the Gap model is too costly.
  *   **Glut Prediction:**
      *   *Our Model:* This reasoning holds (via DS). We can derive $\neg A$ from the contradiction because DS is valid.
      *   *Opponent's Failure:* The Gap model must reject Excluded Middle. We predict their logic will fail to validate proof-by-cases ($A \vee \neg A$) in contexts where the truth value of $A$ is undecidable but not paradoxical.
      *   *Falsification Condition for Glut:* If it is demonstrated that accepting true contradictions allows triviality to leak into arithmetic (e.g., $0=1$ becomes derivable), the Glut model is fatal.

  #### Crux 2: The "Revenge" Expressibility Test
  **The Issue:** Can the theory express its own solution within its own language?
  **The Test:** The "Strengthened Liar" Sentence ($S$).
  *   For Gap: $S$ says "I am not true or I am gappy."
  *   For Glut: $S$ says "I is exclusively false" (False and not True).

  *   **Gap Prediction:**
      *   *Our Model:* We can define a predicate $G(x)$ ("x is gappy"). However, $S$ will not generate a contradiction in our logic because the T-Schema fails for $S$.
      *   *Opponent's Failure:* The Glut theorist cannot define "Exclusive Falsehood" ($\neg T(x) \wedge \neg (T(x) \wedge \neg T(x))$) without triggering a new paradox. Their logic is expressively incomplete.
      *   *Falsification Condition for Gap:* If we are forced to use a classical meta-language to explain why $S$ is gappy, while claiming the object language is sufficient for truth, our model is hierarchically unstable (Tarskian regression).
  *   **Glut Prediction:**
      *   *Our Model:* We can define "Exclusive Falsehood." The sentence $S$ will simply be a true contradiction (both exclusively false and not exclusively false), which our logic tolerates.
      *   *Opponent's Failure:* The Gap theorist cannot assert "$L$ is gappy" without asserting a truth about $L$. If "$L$ is gappy" is true, then $L$ is not true, which makes $L$ true (via T-Schema). They collapse into contradiction or silence.
      *   *Falsification Condition for Glut:* If we cannot formally distinguish between "true contradictions" and "triviality" (where everything is true), our model fails to preserve the normativity of logic.

  #### Crux 3: The Normativity of Assertion (Communication Test)
  **The Issue:** What is the function of assertion? Is it to exclude alternatives?
  **The Test:** A communicative scenario involving a semantic predicate.
  **Case:** Speaker A asserts "The Liar sentence is not true." Speaker B asks, "Does that exclude the possibility that it is true?"

  *   **Gap Prediction:**
      *   *Our Model:* Yes. Assertion is inherently exclusionary. To assert $\neg T(L)$ is to rule out $T(L)$. This preserves the utility of language for coordination.
      *   *Opponent's Failure:* The Glut theorist asserts $T(L)$ and $\neg T(L)$. If they do not exclude $T(L)$ when asserting $\neg T(L)$, assertion loses its function. We predict their model makes rational disagreement impossible.
      *   *Falsification Condition for Gap:* If we cannot explain why we *deny* the Liar without *asserting* its negation (requiring a primitive notion of Denial), our logic is psychologically unrealistic.
  *   **Glut Prediction:**
      *   *Our Model:* No. Assertion need not exclude. One can accept $T(L)$ and $\neg T(L)$ as a boundary condition of reality. Rational disagreement persists because one can accept $A$ while rejecting $B$, even if $A$ and $\neg A$ are both accepted.
      *   *Opponent's Failure:* The Gap theorist posits "truth value gaps." We predict they cannot explain why we should *prefer* truth over gaps without invoking a normative principle that presupposes classical bivalence.
      *   *Falsification Condition for Glut:* If we cannot provide a coherent account of "denial" that prevents a rational agent from accepting *everything*, our model fails to account for rational choice.

  #### Crux 4: Curry's Paradox Vulnerability
  **The Issue:** $C \leftrightarrow (T(C) \rightarrow \bot)$. This paradox does not rely on negation.
  **The Test:** Restriction of the Conditional.
  **Case:** Deriving $\bot$ from $C$ using Modus Ponens and Contraction.

  *   **Joint Prediction (Shared Vulnerability):**
      *   Both camps agree that naive Modus Ponens or Contraction must be restricted.
      *   **Gap Falsification:** If our restriction on the conditional prevents the derivation of the Deduction Theorem in standard mathematics, our model is too weak.
      *   **Glut Falsification:** If our restriction on the conditional prevents the derivation of the Deduction Theorem in standard mathematics, our model is too weak.
      *   **Adjudication:** The camp that retains a stronger conditional for ordinary mathematics while blocking Curry wins on "Recovery of Classical Reasoning."

  ---

  ### 4. STATEMENT OF IRRECONCILABILITY

  We acknowledge that despite this collaboration, a full synthesis is currently impossible.

  1.  **Ontological Incompatibility:** The Gap camp views the Glut camp as violating the fundamental law of non-contradiction required for reality to be intelligible. The Glut camp views the Gap camp as positing "ontological holes" (gaps) that are indistinguishable from silence.
  2.  **The Revenge Stalemate:** We agree that currently, **neither side has a fully satisfactory solution to the Revenge Liar within their own object language.** The Gap theorist relies on a meta-language to describe gaps; the Glut theorist relies on a meta-language to describe gluts. Until one side can formalize their semantic category (Gap or Glut) within the object language without triviality, both models remain formally incomplete.

  **Signed:**
  *Representative, Paracomplete Research Group*
  *Representative, Dialetheic Logic Consortium*
