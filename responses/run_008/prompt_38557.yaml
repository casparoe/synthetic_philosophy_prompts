prompt: |-
  I'm a backend engineer (mostly Go, some Python) and the closest I've come to political philosophy is a long-running grudge against an inconsistent-comparator bug that once wrecked a leaderboard I built: someone passed a comparator into a sort that wasn't a total order -- it had a cycle in it -- and the output was quietely garbage, depending on the input order and the sort's internals. I've also built the "merge N ranked lists into one ranked list" feature a couple times for search result aggregation, so I know that problem is real and only semi-solved.

  I keep hearing Arrow's impossibility theorem described as "no fair voting system exists", which is too vague to feel like an actual theorem. Restate it in the vocabulary I actually use -- comparators, total orders, transitivity, reduce/fold over a list of ballots, pairwise comparison-based algorithms, deterministic merge functions -- as faithfully as you can. Two hunches I want you to test along the way rather than politely ignore: (1) Condorcet cycles just ARE inconsistent comparators, majority vote is a comparator that fails to be an order, and everything downstream of that is the sort-gives-garbage bug writ large; (2) independence of irrelevant alternatives is basically the purity property that the aggregator only ever looks at pairwise comparisons, the way a comparison sort never inspects a whole element, so any comparison-based implementation satisfies it by construction. Are those right, or am I smuggling in assumptions and calling them translation?

  Then give me the residue report: what parts of Arrow translate cleanly into my vocabulary, what only translates with distortion, and what has no expression in it at all. For instance, does "dictatorship" mean anything more than "the output is just one of the inputs", and is nondictatorship a property a programmer would ever think to demand of a merge function? Also flag the reverse direction: where my sort/comparator framing quietly assumes something Arrow doesn't need (determinism? that we're aggregating rankings rather than utilities? that the output must be a full order?). Finally, take a side on the residue itself: does it show my vocabulary is missing something real, or does it show that the theorem's punchline is less substantive than philosophers make it sound?

  Commit to a verdict on both hunches, and be explicit about what would change your mind -- the argument or counterexample that would flip you, and where your own translation is most likely to have gone wrong.

  After the main answer, append a JSON object with exactly these fields (each holding a short string): "condorcet_hunch_verdict" (right / right_but_incomplete / wrong, plus a sentence why), "iia_hunch_verdict" (same format), "translated_cleanly", "translated_with_distortion", "untranslatable", "residue_blame" (gap in my vocabulary vs overblown theorem vs something else, with a reason), "would_change_mind", and "weakest_link" (where your reasoning above is most likely to fail).
