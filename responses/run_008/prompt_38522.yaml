  7.  *(Self-Correction on the One-Day Case)*: In the one-day case, if the teacher says "Exam tomorrow, you won't know," and the student hears it. If the student believes the teacher, they know. If they know, the statement is false. So the statement cannot be truly believed. But can it be true? Yes, if the student *doesn't* believe it. But a rational student *should* believe a known truthful teacher. This creates a conflict between rationality and truth. This is the "Doxastic Paradox." I need to highlight this.

