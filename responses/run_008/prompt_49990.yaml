  ### The scenario

  Elara inspects 12,000 cans from a day's run. Using a sonic resonator, she tests each can individually for defects. Her device has a false-negative rate of 0.03%, established through years of empirical validation. For any specific can $n$, her evidence yields a credence of 0.9997 that it is sound. However, knowing the independence of these tests and the run size, she calculates the probability that *at least one* can is defective as approximately 97%. Despite this high statistical likelihood of error somewhere in the batch, company protocol requires her to sign a certificate stating, "Every can in this run is sound," based on her individual passing results. She signs, believing each individual proposition while acknowledging the statistical near-certainty that the conjunction is false.

  ### Three verdicts

  A Kyburgian, denying conjunction closure for rational acceptance, argues Elara rationally accepts each proposition "Can $n$ is sound" because each exceeds the threshold. However, she cannot rationally accept their conjunction, "All cans are sound," because the probability of the conjunction drops below the threshold. Consequently, signing the form is epistemically culpable if the signature asserts the conjunction as a single belief, though permissible if interpreted as asserting each claim individually. She can rationally accept the individual soundness claims and the claim that some can is defective, provided she does not conjoin the former. The inconsistency lies in the content, not the attitude.

  A simple Lockean threshold view, granting acceptance whenever credence exceeds a fixed $t$ (say, 0.95), verdicts that she rationally accepts every individual claim *and* the claim that some can is defective. While the conjunction's probability falls below $t$, preventing acceptance of the form's statement as a whole, she accepts the components. This renders her belief set inconsistent, suggesting rational acceptance tolerates inconsistency. On this view, signing is rational regarding each claim but logically flawed regarding the whole, making her culpable only if consistency is a strict requirement for rationality.

  The Preface-style view, following Makinson, distinguishes between individual evidence and global fallibility. It holds she rationally believes each can is sound based on specific inspection, while simultaneously believing the run likely contains errors based on statistical trends. On this view, signing is not culpable; it reflects the rational tension between local evidence and global reliability, mirroring the author who believes each claim in her book while believing the book contains errors. She rationally accepts both sets of propositions without contradiction in attitude, resolving the paradox by separating the grounds for individual acceptance from the grounds for collective doubt.

  ### The load-bearing feature

  The load-bearing feature is the *individual inspection* generating high probabilistic evidence for each specific proposition, distinct from the global statistical profile. This hybridizes the paradoxes. If we delete the individual inspection, leaving only the historical defect rate, Elara lacks specific evidence for any particular can. Her belief that "Can $n$ is sound" rests solely on the base rate. This collapses the case into a pure Lottery Paradox: high probability without individual evidence, making belief in any specific soundness claim intuitively dubious. Conversely, if we delete the statistical aggregation—perhaps by reducing the run to ten cans or obscuring the cumulative error probability—the high credence that *some* error exists vanishes. She retains individual evidence for each can and a vague sense of fallibility, but not the mathematical certainty of error. This collapses the case into a pure Preface Paradox: strong individual evidence coupled with a general acknowledgment of human fallibility, without the mathematical inevitability of contradiction. The tension arises precisely because the inspection justifies individual belief while the aggregation justifies collective doubt. This distinction is crucial for your paper: it isolates the variable of individual evidence.

  ### The counterattack

  A defender of closure for rational acceptance attacks by arguing that if Elara cannot rationally believe the conjunction, she cannot rationally believe the conjuncts either, given they entail it. They argue the case is a disguised Lottery Paradox. Although inspection occurs, the justification remains statistical (device reliability), not direct perception of soundness. Since the device has a known error rate, her belief in any specific can's soundness is unsafe: in the nearest possible world where a can is defective, the device likely still passes it. Thus, she knows neither the individual claims nor the conjunction. The classification matters: if it is a disguised Lottery, the solution lies in denying acceptance based on statistical probability alone. If it is a disguised Preface, the solution lies in allowing inconsistent content via fallibility. The closure defender insists it is the former; the statistical nature of the evidence undermines individual acceptance regardless of inspection, rendering the signing epistemically culpable because she claims knowledge she lacks.
