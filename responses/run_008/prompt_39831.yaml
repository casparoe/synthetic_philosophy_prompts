answer: |-
  # Activity: The Commuter's Paradox

  ## 1. Overview & Learning Objectives
  **Topic:** Inverse Reinforcement Learning (IRL) / Preference Inference.
  **Core Lesson:** Behavior does not uniquely identify preferences. The inference depends critically on unverified assumptions about the agent's rationality and constraints (the "Rationality Prior").
  **Time:** 75 Minutes.
  **Class Size:** 16 Students (4 Teams of 4).
  **Materials:** Whiteboard + Markers, 2 Types of Handouts (Memo A & Memo B), Prediction Sheets.

  ## 2. The Scenario: "The Morning Commute"
  You will draw a $5 \times 5$ grid on the whiteboard representing a city neighborhood.
  *   **Start (S):** Bottom-Left corner.
  *   **Goal (G):** Top-Right corner.
  *   **Terrain:**
      *   **White Squares:** Normal streets.
      *   **Blue Squares:** "The Intersection" (High traffic/noise).
      *   **Green Squares:** "The Park" (Scenic/quiet).
  *   **Movement:** Up, Down, Left, Right (1 step = 1 minute).

  **The Agent:** You (the instructor) will act as the "Commuter." You have a fixed, hidden reward function.
  **The Hidden Rule:** You are a **Risk Averter**. You treat Blue Squares as *forbidden* (infinite cost), regardless of time savings. You are indifferent to Green squares (neutral). You minimize steps subject to the "No Blue" constraint.

  ## 3. The Twist: The "Client Memo" (Rationality Priors)
  To expose how assumptions shape inference, you will split the class into two "Consulting Firms."
  *   **Teams 1 & 2 (The Efficiency Firm):** Receive **Memo A**.
      *   *Text:* "Our client is a **Time-Minimizer**. They always choose the fastest route possible, assuming standard traffic conditions. Infer their cost map based on this."
  *   **Teams 3 & 4 (The Wellbeing Firm):** Receive **Memo B**.
      *   *Text:* "Our client is a **Stress-Minimizer**. They prioritize quiet routes over speed. Infer their cost map based on this."

  *Note:* Both memos are plausible. Both memos will be used to interpret the *same* observed behavior.

  ## 4. Timing Plan (75 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00-05 | **Intro** | Set the stage. No mention of IRL. "We are analyzing decision data." |
  | 05-20 | **Observation** | You (Agent) demonstrate 3 commutes on the grid. Students record trajectories. |
  | 20-35 | **Inference** | Teams build a "Cost Model" (assign values to Blue/Green/White) consistent with their Memo. |
  | 35-50 | **Prediction** | You present 2 *new* maps. Teams commit to predictions in writing. |
  | 50-60 | **Reveal** | You reveal actual choices. Scoring. The "Sting." |
  | 60-75 | **Debrief** | Connect to IRL, underdetermination, rationality priors, and AI alignment. |

  ## 5. Detailed Script & Materials

  ### Phase 1: Observation (15 mins)
  **Instructor Script:**
  "Welcome. You are behavioral analysts. I am the Agent. I have a destination (Goal) and a starting point (Start). I will commute three times. Your job is to record my path exactly. Do not talk to me. Do not ask why. Just record."

  **The Map (Draw on Board):**
  *   Create a $5 \times 5$ grid.
  *   Place **Blue Squares** at (2,2) and (3,3). (Coordinates: x,y from bottom-left 0,0).
  *   Place **Green Squares** at (1,4) and (4,1).
  *   *Crucial:* Ensure there is a "Short Path" that goes through Blue, and a "Long Path" that avoids Blue.

  **The Trajectories (You move a magnet/token):**
  1.  **Run 1:** You take the Long Path (avoiding Blue).
  2.  **Run 2:** You take the Long Path (avoiding Blue).
  3.  **Run 3:** You take the Long Path (avoiding Blue), even when a Green square is slightly out of the way.

  **Student Task:**
  *   Teams 1 & 2 (Efficiency) think: "Why did they take the long way? The Blue square must be *slow* (high time cost)."
  *   Teams 3 & 4 (Wellbeing) think: "Why did they take the long way? The Blue square must be *stressful* (high stress cost)."
  *   *Both interpretations fit the data perfectly.*

  ### Phase 2: Inference (15 mins)
  **Task:** Each team must produce a **Reward/Cost Card**.
  *   Assign a numeric cost to: White Step, Blue Step, Green Step.
  *   Constraint: Your costs must explain why the Agent avoided Blue in all 3 runs *given your Memo*.
  *   **Efficiency Teams:** Must justify Blue cost in "Minutes."
  *   **Wellbeing Teams:** Must justify Blue cost in "Stress Units."

  *Instructor Role:* Circulate. Ensure Efficiency teams aren't saying "They just hate blue." They must say "Blue = +10 Minutes." Ensure Wellbeing teams say "Blue = +10 Stress."

  ### Phase 3: Prediction (15 mins)
  **Task:** You present two **New Maps** (draw quickly on a fresh corner of the board).
  *   **Map X (The Tradeoff):** The Short Path goes through **Blue**. The Long Path avoids Blue but is *much* longer (e.g., 15 steps vs 5 steps).
  *   **Map Y (The Trap):** The Short Path goes through **Blue**. The Alternative Path goes through **Green** but is the same length.

  **Student Task:**
  *   Write down: "In Map X, Agent will take: [Short/Long]."
  *   Write down: "In Map Y, Agent will take: [Short/Alt]."
  *   **Rule:** No changing answers. These are binding contracts.

  ### Phase 4: Reveal & Scoring (10 mins)
  **The Reveal:**
  *   **Map X:** You reveal you took the **Long Path**. (You refuse to touch Blue, even if it's very long).
  *   **Map Y:** You reveal you took the **Green Path**. (You avoid Blue, and Green is a nice bonus, though not required).

  **Scoring:**
  *   **Efficiency Teams (1 & 2):** They likely predicted **Short Path** on Map X.
      *   *Reasoning:* "If Blue is just 'traffic' (time), eventually the time saved by the short path outweighs the traffic delay. A rational time-minimizer would cut through."
      *   *Score:* **0 Points.**
  *   **Wellbeing Teams (3 & 4):** They likely predicted **Long Path** on Map X.
      *   *Reasoning:* "If Blue is 'stress,' and the client minimizes stress, they won't take it regardless of time."
      *   *Score:* **10 Points.**

  *(Note: If Efficiency teams argue "We assumed infinite traffic cost," point out that 'infinite cost' is a preference constraint, not a time metric. This is the sting.)*

  ### Phase 5: The Debrief (15 mins)
  **Discussion Guide:**

  1.  **The Underdetermination Sting:**
      *   "Teams 1 and 2, your model was logically consistent with the observation phase. Why did you fail the prediction phase?"
      *   *Answer:* Because the observed behavior (avoiding Blue) was compatible with *two* different internal models (High Time Cost vs. Forbidden Constraint). The data didn't tell you which one it was.
      *   *Formal Term:* **Non-identifiability.** Multiple reward functions explain the same optimal policy.

  2.  **The Rationality Prior:**
      *   "Look at your Memos. Team 1/2 assumed 'Global Time Optimization.' Team 3/4 assumed 'Constraint Satisfaction.' You didn't infer the rationality type from the data; it was handed to you in the Memo. In real IRL, *you* have to choose the prior."
      *   *Formal Term:* **The Rationality Prior.** We assume agents are rational *in a specific way*. If we assume the wrong kind of rationality, we infer the wrong preferences.

  3.  **The Coverage Problem:**
      *   "Why did you fail on Map X?"
      *   *Answer:* Because you never saw the Agent face a *hard tradeoff* in the observation phase. They never had to choose between 'Very Long' and 'Blue.'
      *   *Formal Term:* **Distributional Shift / Support.** You can only learn preferences about situations the agent actually encounters.

  4.  **AI Alignment Connection:**
      *   "If we train an AI to fetch coffee by watching humans, and the human avoids the broken machine..."
      *   "...does the AI learn 'Broken machines are bad' (Preference) or 'Broken machines don't yield coffee' (Constraint)?"
      *   "If the AI later fixes the machine, will it use it? If it inferred a preference against the machine, it won't. If it inferred a constraint, it will."
      *   "This is the **Alignment Problem**. We are trying to invert human behavior to find human values. But human behavior is underdetermined. We are boxing human values into the situations humans happened to be in."

  ## 6. Troubleshooting: What Will Go Wrong

  **1. The "Guessing Game" Problem**
  *   *Risk:* Students treat this as "Guess what the professor is thinking" rather than "Build a model."
  *   *Fix:* In the Inference Phase, require them to write down the *math* (e.g., $Cost(Blue) > 5$). If they just write "They hate blue," make them quantify it. This forces them to commit to a falsifiable hypothesis.

  **2. The Confederate Drift**
  *   *Risk:* You (the Agent) accidentally give a hint during observation (e.g., hesitating too long at a Blue square).
  *   *Fix:* Move the token decisively. Do not speak. Do not look at the Blue squares with disdain. Be a robot.

  **3. The "Infinite Cost" Loophole**
  *   *Risk:* Efficiency Teams argue in the debrief: "We assumed Blue had infinite time cost, so our prediction was correct too."
  *   *Fix:* Pre-empt this. In the Inference Phase, tell them: "Assume costs are finite. The world has tradeoffs." If they still claim infinite cost, point out that assuming an infinite cost *is* assuming a hard constraint (a preference), not a time metric. This is actually a great teaching moment about how "Rationality Assumptions" bleed into "Preference Assumptions."

  **4. Collusion**
  *   *Risk:* Team 1 talks to Team 3.
  *   *Fix:* Physically separate the "Efficiency" side of the room from the "Wellbeing" side. Collect Prediction Sheets before allowing discussion.

  ## 7. Limitations: What This Activity Cannot Do
  *Be honest with the students during the debrief.*

  1.  **Hypothesis Space:** In this activity, there were basically 2 hypotheses (Time vs. Stress). In real IRL, the hypothesis space is continuous and high-dimensional (neural network weights). The ambiguity is exponentially worse.
  2.  **The "True" Objective:** In this activity, *you* knew the true rule. In real life (and AI Alignment), there is no "True Rule" to check against. We never get the answer key. We are flying blind.
  3.  **Confidence:** In this activity, students felt uncertainty. Real algorithms often output preferences with *high confidence* even when they are wrong. The danger isn't just ambiguity; it's **calibrated overconfidence**.
  4.  **The Demonstrator:** You were a human playing a role. Real humans are inconsistent, irrational, and weak-willed. Inferring preferences from *noisy* irrational behavior is harder than from *consistent* scripted behavior.

  ## 8. Instructor Prep Checklist
  *   [ ] Draw the Grid on the board before class (cover with paper until needed).
  *   [ ] Print 8 copies of Memo A (Efficiency) and 8 copies of Memo B (Wellbeing).
  *   [ ] Prepare Prediction Sheets (small slips of paper).
  *   [ ] Practice the token movements to ensure they look deliberate.
  *   [ ] Plan the exact coordinates for Map X and Map Y so the tradeoff is clear.

  ## 9. Closing Statement for the Debrief
  "We spent 75 minutes trying to figure out what I wanted. We had perfect data. We had logic. We failed. Now scale this up. We are asking machines to figure out what *humanity* wants, from the data we leave online. The machines will not say 'I don't know.' They will say 'I have optimized for X.' And if X is a mirage created by our own underdetermined behavior, we have built a genie that grants the wrong wish. This is why Inverse Reinforcement Learning is not just a technical problem. It is a philosophical one."
