answer: |-
  You are not inventing a wheel, but you are correctly identifying that the standard "Responsibility Gap" vocabulary is insufficient for what you are seeing. The Responsibility Gap (Andreas Matthias, 2004) describes a vacuum where blame *cannot* land. You are describing a scenario where blame *does* land, but on a target that cannot catch it, specifically to prevent it from bouncing back to a human.

  Here is the commitment you asked for.

  ### 1. Direction One: The Human Landing Pad
  You suspected there was a name for the first direction (blame landing on the physically closest human, like the backup driver). There is. It is called **"The Moral Crumple Zone."**

  Coined by Madeleine Elish (2018), this concept describes how human operators are positioned to absorb the impact of systemic failure, much like the crumple zone of a car absorbs impact to protect the passenger (the system/designers). The human is held responsible not because they had control, but because they are the only legible agent left. You should teach this term for Direction One; it is the standard counterpart to the Responsibility Gap in STS (Science and Technology Studies) literature.

  ### 2. Direction Two: The System Landing Pad
  For Direction Two (blame landing on the system to close inquiry), there is **no single canonical term** in the philosophical canon that captures the specific *closure of inquiry* function you described.

  *   **Why "Responsibility Gap" fails:** As you noted, the Gap implies *no one* is responsible. Your cases show *something* is responsible (the system), which satisfies the social need for an explanation.
  *   **Why "Problem of Many Hands" fails:** That problem suggests responsibility is too *distributed* to find. Your phenomenon is about *concentrating* blame onto a single node (the algorithm) to stop looking for the distribution.
  *   **Why "Buck-Passing" fails:** Buck-passing requires passing the buck to another *agent* who can catch it. You cannot pass a buck to a non-agent unless you are pretending it is an agent.
  *   **Why "Moral Buffer" is close but wrong:** John Danaher and others use "Moral Buffer" to describe using technology to *anticipatorily* shield oneself from moral taint (e.g., using a robot for care work so the human doesn't feel guilty). Your phenomenon is *retrospective*: it happens after harm, during the investigation.

  #### The Committed Term: "The Responsibility Sink"

  Since no existing term captures the *retrospective absorption* and *inquiry termination* specifically, I propose you adopt and define **"The Responsibility Sink."**

  **Definition:**
  A **Responsibility Sink** is a socio-technical maneuver wherein a non-agent artifact (an algorithm, system, or automated process) is rhetorically endowed with causal agency for the specific purpose of absorbing blame and terminating moral or legal inquiry.

  Unlike the *Responsibility Gap* (where blame evaporates), the Sink *collects* blame. Unlike the *Moral Crumple Zone* (where a human absorbs blame), the Sink absorbs blame into an entity that cannot be punished, sued, or shamed, thereby neutralizing the blame without requiring human accountability.

  **Why this term beats the alternatives:**
  1.  **It matches the physics of your metaphor:** You described a "landing pad." A "Sink" implies something that draws responsibility in and holds it there, preventing it from flowing further up the chain of command.
  2.  **It distinguishes from "Scapegoating":** A scapegoat is usually expelled or punished to cleanse the community. A Responsibility Sink is not punished; it is merely cited. The inquiry ends *because* the Sink is blamed, not *after* the Sink is punished.
  3.  **It highlights the function:** The word "Sink" emphasizes the *disappearance* of the accountability vector. The blame goes in, and the demand for justice stops.

  ### 3. Drawing the Edges (Your Specific Questions)

  **Edge Case 1: The Human Bureaucrat**
  *Is a human bureaucrat whose function is to say "no" and absorb anger a case of the Responsibility Sink?*
  **Yes, but only if they are reified.**
  If the bureaucrat is treated as an individual with discretion ("Bob denied your claim because he is strict"), they are an agent, and this is standard accountability.
  If the bureaucrat is treated as a functionary ("Policy 4.2 denied your claim; Bob just pressed the button"), they have become a **Human Responsibility Sink**. They are acting as a "wetware algorithm." The concept applies whenever the *agency is attributed to the role/rule/system* rather than the person occupying it. If the paperwork says "The Office denied your claim" rather than "The Clerk denied your claim," it is a Responsibility Sink move.

  **Edge Case 2: Victim Acceptance**
  *Does the concept require the victim to accept the attribution, or just the authority to make it?*
  **It requires the Authority to make the move, not the Victim to accept it.**
  The "Responsibility Sink" is a structural maneuver by the institution. It succeeds when the inquiry is closed officially, regardless of whether the victim is satisfied. However, the *efficacy* of the Sink depends on the cultural legitimacy of the system. If the victim sues and wins, the Sink failed. But the *concept* describes the attempt to close the file. You can have a "Failed Responsibility Sink" (the victim sues anyway), but the move itself is still identifiable.

  ### Summary for Your Syllabus

  *   **Direction 1 (Human absorbs blame):** The Moral Crumple Zone.
  *   **Direction 2 (System absorbs blame):** The Responsibility Sink.
  *   **The Illusion:** Both are often mistaken for the "Responsibility Gap," but they are actually mechanisms of *responsibility displacement* that preserve the *appearance* of accountability while protecting the actual designers and owners.

  This distinction will resonate with engineering students because it treats the attribution of blame as a *system design feature* rather than a philosophical accident. They understand sinks, buffers, and crumple zones. Use that engineering intuition to teach the ethics.
