answer: |-
  # HANDOUT: Where Do You Actually Stand on Common Priors?

  **Instructions:** Start at **Node 1**. Answer the question based on your intuitive judgment of the case described. Follow the arrow corresponding to your answer. Continue until you reach a **Leaf**. Read the position name and the "Awkward Commitment" to see if the destination matches your self-conception. If it does not, retrace your steps to find where your intuition diverges from the logic.

  **Starting Point:** You accept Aumann's Agreeing to Disagree theorem as valid mathematics: *If* agents share a Common Prior *and* their posteriors are Common Knowledge, *then* they cannot disagree.

  ---

  ### NODE 1: The Communication Test
  **Case:** Two meteorologists share their entire datasets and their resulting probability forecasts for rain. They both know the other has seen the data and the forecast. Yet, they maintain different probabilities.
  **Question:** In any realistic scenario, do human agents ever satisfy the condition of *Common Knowledge* regarding their posteriors (i.e., do they know that the other knows, ad infinitum)?

  *   **YES, effectively.** (Idealizations bind; if they disagree, the theorem's conditions are met.) → **Go to Node 2**
  *   **NO, strictly.** (Communication is noisy; infinite recursion is psychologically impossible.) → **Go to Node 5**

  ---

  ### NODE 2: The Source of Difference
  **Case:** Since the meteorologists share data and know each other's conclusions, Aumann's theorem implies the difference lies entirely in their starting points (priors).
  **Question:** Is it possible for two agents to have different priors while both remaining perfectly rational?

  *   **NO.** (Reason constrains initial credences; there is a "correct" prior.) → **Go to Node 3**
  *   **YES.** (Priors are not determined by reason alone.) → **Go to Node 4**

  ---

  ### NODE 3: The Diagnosis of Error
  **Case:** You have determined that one meteorologist is irrational because their prior deviates from the rational norm.
  **Question:** What is the nature of this irrationality?

  *   **Cognitive/Pathological.** (The error is like being drunk, biased, or tired.) → **LEAF A**
  *   **Logical/Objective.** (The error is a violation of an objective logical constraint, akin to a math error.) → **LEAF B**

  ---

  ### NODE 4: The Normative Status
  **Case:** You have determined that differing priors are rationally permissible.
  **Question:** Does the Common Prior Assumption (CPA) still have a role to play in how agents *ought* to behave?

  *   **NO.** (Disagreement is faultless; convergence is not required.) → **LEAF C**
  *   **YES.** (We should strive for commonality even if not strictly required.) → **LEAF D**

  ---

  ### NODE 5: The Structural Explanation
  **Case:** You believe the theorem doesn't bind because Common Knowledge never obtains or priors differ.
  **Question:** Is this failure a permanent feature of agency, or can it be resolved at a higher level of abstraction?

  *   **Resolved Higher Up.** (We differ on priors, but share a "pre-prior" about how priors are formed.) → **LEAF E**
  *   **Permanent Feature.** (Priors are brute psychological facts; no higher commonality exists.) → **Go to Node 6**

  ---

  ### NODE 6: The Market Test
  **Case:** Consider financial markets. If CPA were true and common knowledge, the "No-Trade" theorem suggests speculative volume should vanish (since no one can expect to profit from a zero-sum trade against a rational counterparty). Yet, volume is massive.
  **Question:** What does this volume tell us about the falsity of the CPA?

  *   **It proves CPA is false and harmful.** (Markets are rife with irrational speculation.) → **LEAF F**
  *   **It proves CPA is false but harmless.** (Volume is liquidity/noise, not genuine speculation.) → **LEAF G**
  *   **It proves the theorem is vacuous.** (The idealizations are so distant from reality the result tells us nothing.) → **LEAF H**

  ---

  ### THE LEAVES

  **LEAF A: The Cognitive Debunker**
  *   **Position:** Persistent disagreement is evidence that one party is suffering from a cognitive bias, emotional distortion, or informational processing error.
  *   **Awkward Commitment:** This stance risks debunking your own confidence, as you must assume you are the unbiased party without independent proof.

  **LEAF B: The Strict Objectivist**
  *   **Position:** There is a single, rationally mandated prior for any given state of information; disagreement after full disclosure proves a logical failure.
  *   **Awkward Commitment:** You must defend the existence of a unique "correct" starting point for belief without appealing to empirical data (which comes later).

  **LEAF C: The Radical Permissivist**
  *   **Position:** Priors are akin to tastes; agents can share all data and reasoning yet legitimately disagree on probabilities.
  *   **Awkward Commitment:** You must accept that truth-tracking is secondary to internal coherence, making rational persuasion at the foundational level impossible.

  **LEAF D: The Normative Idealist**
  *   **Position:** The CPA is descriptively false but normatively binding; agents ought to adjust their priors to converge even if not strictly required by logic.
  *   **Awkward Commitment:** You obligate agents to abandon their genuine credences in favor of an artificial consensus, potentially reducing individual accuracy.

  **LEAF E: The Hierarchical Bayesian**
  *   **Position:** Agents lack a common prior, but they share a common "pre-prior" over how priors are distributed, allowing agreement at a higher level.
  *   **Awkward Commitment:** This pushes the regress problem back one step without solving the threat of an infinite hierarchy of priors.

  **LEAF F: The Market Realist**
  *   **Position:** The sheer volume of speculative trading is empirical proof that the CPA is false and that markets are systematically irrational.
  *   **Awkward Commitment:** You must treat the most liquid, data-rich environments on earth as zones of systematic collective delusion.

  **LEAF G: The Market Pragmatist**
  *   **Position:** The CPA is false, but trading volume is explained by liquidity needs and noise traders, not rational speculation, so the idealization remains useful.
  *   **Awkward Commitment:** You must explain away vast volumes of zero-sum trading as non-speculative, which contradicts the self-understanding of many market participants.

  **LEAF H: The Communication Skeptic**
  *   **Position:** The "Common Knowledge" condition is so strong it never obtains for finite beings; therefore, the theorem has no grip on human epistemology.
  *   **Awkward Commitment:** You render the agreeing-to-disagree theorem vacuous for all practical human interaction, limiting its use to logic puzzles.

  **LEAF I: The Brute Fact Subjectivist**
  *   **Position:** (From Node 5, Permanent Feature) Priors are ungrounded psychological givens; rationality only governs updating, not starting points.
  *   **Awkward Commitment:** You concede that two agents can look at the exact same world and rationally see fundamentally different probability structures.

  **LEAF J: The Unnamed Position**
  *   **Position:** The CPA is false, yet persistent disagreement after full disclosure is still irrational.
  *   **Diagnosis:** **Unoccupied/Incoherent.** Without a common prior, Aumann's constraint vanishes; calling disagreement "irrational" here lacks a formal ground unless you smuggle in Objectivism (Leaf B).

  ---

  ### INSTRUCTOR'S NOTE

  **Where they will get stuck:**
  Expect the class to bottleneck at **Node 1 (The Communication Test)**. MA students often conflate *Mutual Knowledge* ("I know that you know") with *Common Knowledge* (the infinite recursion: "I know that you know that I know..."). In the meteorologist case, students will likely answer "YES" because in practice, two experts *acting* as if they have common knowledge is functionally similar to having it.

  **Why this matters:**
  If they answer "YES" too easily, they bypass the *Communication Skeptic* (Leaf H) and the *Hierarchical* escapes (Leaf E), forcing them into the normative debates about priors (Leaves A–D) prematurely. If they answer "NO" too dogmatically, they may dismiss the normative force of the theorem entirely.

  **What to have ready:**
  1.  **The Email Game Example:** Have a quick verbal sketch of the Rubinstein Email Game ready. It demonstrates how quickly Common Knowledge dissolves with even tiny probabilities of communication failure. Use this to pressure the "YES" voters at Node 1.
  2.  **The "So What?" Challenge:** For the "NO" voters, ask: "If Common Knowledge never obtains, does Aumann's theorem tell us anything about how we *should* communicate, or is it merely a logical curiosity?" This forces them to distinguish between *descriptive impossibility* and *normative ideal*.
  3.  **Leaf J Check:** If a student claims the CPA is false but disagreement is still irrational, point them to Leaf J. Ask them to articulate the norm they are violating if not the Common Prior. This usually forces them to migrate to Leaf B (Objectivism) or Leaf A (Debunker).

  **Note on Indistinguishability:**
  Be prepared to note that **Leaf D (Normative Idealist)** and **Leaf G (Market Pragmatist)** are functionally similar in practice: both treat the CPA as a useful fiction. The distinction is that D sees it as a moral/epistemic duty, while G sees it as a modeling convenience. Students often struggle to care about this distinction; allow them to merge these if their justification is purely instrumental.
