      *   Check the Move 4 rating. Elena claims "Expectation without leverage isn't corruption." This is debatable. Implicit expectations *create* leverage. So "Partly Right" is appropriate.
      *   Check Move 1. Dev says "systematically bend how officials do their job." If Marco didn't change his surgery, did it bend the job? Maybe it bent the *perception* or the *access*. So "Partly Right" is fair.
      *   Check Move 3. Dev's analogy to clientelism is strong. "Clearly Right" fits well logically.
      *   Check Move 2. Elena's "thank-you card" comparison is weak. "Partly Right" fits.

      *   *Self-Correction on Verdict:* Dev is technically more correct about the definition of institutional corruption, but Elena is more correct about the moral character of the specific acts. However, since the prompt asks who comes out ahead in an argument about *corruption* (a public ethic concept), Dev usually wins on technical definitions. I will frame it as Dev winning on principle, Elena on nuance.

      *   *Wait, one more check on the JSON:* The prompt asks for `verdict_summary`, `moves`, `sharpest_distinction`, `what_both_missed`.
      *   Move objects need: `speaker`, `claim_in_one_line`, `rating`, `why`.

      *   *What Both Missed:* I need to make sure this is a string in the JSON.
