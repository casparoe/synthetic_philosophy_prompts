      *   *Let's finalize the "What Both Missed":* They focused on the *giver/receiver* dynamic but ignored the *bystander*. The real harm isn't to Marco or the gift-giver, but to the third party who *doesn't* give and fears they will be treated worse. The "shadow of coercion."

      *   *Let's finalize the "Sharpest Distinction":* "Would a poor patient feel excluded or anxious if they could not participate?" (The Exclusion Test).

