prompt: |-
  My sister's wedding got derailed into a two-hour arguement and I need someone to sort it out. Background: my uncle Marco spent his career as a surgeon in a small southern Italian town, and it was completely normal there for families to bring him something after a successful operation — a panettone at Christmas, once a case of good wine, sometimes an envelope for his kids. He just retired, and at the wedding my friend Dev, who works in compliance, called that whole culture of gift-giving "soft corruption." My cousin Elena, who still lives in that town, went off on him. The exchange, roughly as I remember it:

  (1) Dev said corruption doesn't need an explicit quid pro quo to count. The family knows a gift follows good treatment, and Marco knew gifts followed good outcomes, so over a career the practice functions like a delayed, unspoken fee. He said the standard shouldn't be "was a deal struck" but "does the practice systematically bend how officials do their job" — and by that standard Marco's town fails.

  (2) Elena said that makes gratitude itself illegal — by Dev's logic a thank-you card is corrupt — and that his definition is just Anglo office culture dressed up as universal ethics. In her town the personal relationship IS the institution: people don't relate to some abstract health system, they relate to Dr. Marco, whom they've known for thirty years. Transparency rules that treat all gifts as suspect assume a stranger-state that simply doesn't exist there, and calling that corrupt is just sneering.

  (3) Dev said fine, but then her defense covers the local politician who paves the streets of people who vote for him, because "that's just how politics works here" too — clientelism is exactly what she's defending. And if she won't call any of that corrupt, she's left with no word for the thing anti-corruption efforts were invented to name: officials treating public power as personal property. He said "it's their culture" can't be the whole answer, because the culture is partly the problem.

  (4) Elena said the distinction Dev is fumbling for is direction and discretion, not culture. Gifts flowing upward from the powerless to someone with discretion over them are different in kind from hospitality among equals. And whatever the expectations were, Marco operated the same whether you brought wine or not — the surgery was the surgery. Expectation without leverage isn't corruption, it's just manners.

  Neither would budge, and honestly the rest of the table was split too. Can you adjudicate each of the four moves — say who's right about which specific point, not just overall — and tell me what both of them are missing? I have a feeling there's something neither of them said. After your explanation, give me a JSON object with these fields: "verdict_summary" (one sentence on who comes out ahead and why), "moves" (an array, one object per move, each with "speaker", "claim_in_one_line", "rating" on a scale from clearly_wrong to partly_right to clearly_right, and "why"), "sharpest_distinction" (the single best criterion you'd offer them for telling a corrupt gift from a fine one), and "what_both_missed" (a string).
