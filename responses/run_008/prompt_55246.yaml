  7.  **Refining the "Bypass" Critique:**
      *   In (1), "bypass" means the agent's rational faculty is *sidestepped* (the conclusion is reached without it).
      *   In (4), "bypass" is used to mean the agent's rational faculty is *preceded* by non-rational processes.
      *   *Crucial Point:* Preceding is not bypassing. Setting the table is not eating the meal.

  8.  **Refining the Pharmacology Analogy:**
