answer: |-
  Here is a decision procedure designed for your constraints (15 minutes, limited verification, high scarcity) that operationalizes luck egalitarianism without requiring your reviewers to read philosophy. It prioritizes speed and consistency over perfect moral accuracy, because perfect accuracy is impossible with self-reported data.

  ### The "Brute/Option" Triage Protocol

  **Time Budget:** 15 Minutes Total (3 mins read, 7 mins scoring, 5 mins discussion if flagged).
  **Reviewers:** 3 Grad Students + You.
  **Goal:** Sort applications into **Fund**, **Deny**, or **Committee Review**.

  #### Phase 1: The Baseline Need Filter (Yes/No)
  *If "No" to any, Deny immediately.*
  1.  **Immediacy:** Will this situation cause an irreversible academic or housing disruption within 30 days if unpaid? (e.g., eviction, thesis submission block, loss of registration).
  2.  **Exclusivity:** Is this fund the *only* available source of relief? (Have they applied for departmental advances, university hardship funds, or payment plans?)

  #### Phase 2: The Causality Score (The "Luck" Test)
  *Rate each 1–5. (1 = Pure Brute Luck, 5 = Pure Option Luck).*

  **Q1: The Trigger Event**
  *   **1:** External shock entirely outside student's control (Crime, natural disaster, sudden illness, funding cut by university).
  *   **3:** Mixed agency (Car breakdown due to age/mileage, missed deadline due to workload).
  *   **5:** Speculative risk or discretionary spending (Investment loss, luxury purchase, gambling, choosing high rent without income security).

  **Q2: The Mitigation Check (The "Reasonable Grad Student" Standard)**
  *   **1:** No reasonable mitigation existed (No insurance available, emergency happened instantly).
  *   **3:** Standard mitigation was too costly relative to typical grad income (Insurance deductible too high, savings impossible on stipend).
  *   **5:** Standard mitigation was ignored (No insurance when affordable, spending savings on non-essentials).

  **Q3: The History Pattern**
  *   **1:** First emergency request; narrative suggests long-term stability prior to this event.
  *   **3:** Second request, or narrative suggests cyclical instability due to external factors (family obligations, chronic health).
  *   **5:** Repeated requests for similar "emergencies" suggesting structural budgeting issues.

  #### Phase 3: The Scoring & Stop Rules
  *   **Total Score 3–5:** **Fund.** (High Brute Luck).
  *   **Total Score 6–9:** **Committee Review.** (The "Grey Zone").
  *   **Total Score 10–15:** **Deny.** (High Option Luck).

  **The "Stop" Rule (Values Override):**
  If a reviewer scores Q1 or Q2 as a **5**, but the applicant explicitly states the "choice" was made to meet basic survival needs (e.g., "I chose high rent because low rent housing was unavailable," or "I missed the deadline because I was working to eat"), **STOP**. Do not average the score. Move immediately to **Committee Review**. This is where "Option Luck" masks structural coercion.

  ---

  ### Known Trouble Spots (Reviewer Briefing)
  *Do not hide these from your team. Read this before scoring.*

  1.  **The Poverty Trap (Choice tracing to Circumstance):**
      *   *Theory:* If you didn't buy insurance because you were poor, that's still a choice (Option Luck).
      *   *Reality:* We cannot verify past wealth.
      *   *Procedure Fix:* The **Mitigation Check (Q2)**. If the cost of mitigation (insurance/savings) exceeds 5% of a typical stipend, treat it as Brute Luck (Score 1-2), even if they technically "chose" not to buy it. We do not punish students for being poor before they got here.

  2.  **The Expensive Tastes Problem:**
      *   *Theory:* If a student chooses a lifestyle that makes them vulnerable (e.g., expensive car, high-rent apartment), they bear the cost.
      *   *Reality:* "Need" is relative.
      *   *Procedure Fix:* We fund **function**, not **replacement**. If a laptop is stolen, we fund a machine that runs their software, not the exact model they lost. If rent is too high, we cover the *shortfall to avoid eviction*, not the full rent.

  3.  **Strategic Framing:**
      *   Applicants will frame Option Luck as Brute Luck. ("I didn't gamble, I invested," or "I didn't miss the deadline, the system was confusing.")
      *   *Procedure Fix:* Look for **specifics**. Brute luck usually has concrete details (police report number, doctor's note date). Option luck often has vague narratives ("market volatility," "administrative error").

  ---

  ### Running the Procedure on Your Three Cases

  #### Case 1: The Stolen Laptop
  *   **Need:** High (Thesis blocked). **Pass.**
  *   **Q1 (Trigger):** External shock (Theft). **Score: 1.**
  *   **Q2 (Mitigation):** Did they have insurance? Assume no (most students don't). Was it affordable? Maybe. But theft is a crime. **Score: 2.**
  *   **Q3 (History):** First request. **Score: 1.**
  *   **Total:** 4.
  *   **Decision:** **FUND.**
  *   **Caveat:** Fund the depreciated value of a functional machine, not a brand-new top-tier spec unless required for their specific research (e.g., video editing vs. humanities).

  #### Case 2: The Crypto Loss
  *   **Need:** High (Can't pay rent). **Pass.**
  *   **Q1 (Trigger):** Speculative risk. **Score: 5.**
  *   **Q2 (Mitigation):** Diversification/Savings ignored for high-risk play. **Score: 5.**
  *   **Q3 (History):** Likely first request, but the nature of the loss dominates. **Score: 1.**
  *   **Total:** 11.
  *   **Decision:** **DENY.**
  *   **Rationale:** This is the textbook definition of Option Luck. They sought high reward and accepted the risk of loss. Subsidizing this punishes students who saved conservatively.

  #### Case 3: The Two Jobs / Missed Fellowship
  *   **Need:** High (Broke due to missed funding). **Pass.**
  *   **Q1 (Trigger):** Missed administrative deadline. Technically within control. **Score: 4.**
  *   **Q2 (Mitigation):** Could they have prioritized the deadline? Yes. But the constraint was working two jobs. **Score: 3.**
  *   **Q3 (History):** Pattern of financial instability. **Score: 3.**
  *   **Total:** 10.
  *   **Decision:** **DENY (Borderline Committee Review).**

  ### The Outcome Your Reviewers Will Hate
  **Case 3 results in a Denial (or a very hard fight in Committee Review).**

  Here is why your reviewers will hate this, and why you must own it:
  Strictly speaking, under this procedure, the *proximate cause* of the financial crisis is the missed deadline (Option Luck), not the need to work (Brute Luck). The procedure categorizes "Time Management" as a choice, even when that time was sold to survive.

  Luck egalitarianism struggles here. It asks: "Did they have a choice?" Yes, they chose to work. "Could they have chosen differently?" Yes, they could have starved or skipped sending money home.
  If you fund Case 1 (Theft) but deny Case 3 (Working Poor), you are effectively saying: **We compensate for bad luck, but we do not compensate for the costs of being poor.**

  Your reviewers will feel this is cruel. They will argue that working two jobs is a "Brute Luck" circumstance (born into need). But the procedure classifies it as "Chronic Instability" rather than "Emergency Shock."
  *   **The Hard Truth:** If you fund Case 3, you are no longer running an *Emergency* Fund; you are running a *Poverty Alleviation* Fund. There is nothing wrong with that, but it requires different criteria and more money. If you stay an Emergency Fund, Case 3 is structurally ineligible because their problem is cash-flow, not a shock.
  *   **The Theoretical Failure:** This procedure cannot distinguish between "reckless negligence" and "survival negligence." It treats the missed deadline of the overworked student the same as the missed deadline of the disorganized student. That is the flaw in the theory you asked me to translate.

  ### Structural Limitations (What This Procedure Cannot Do)

  1.  **It Cannot Detect "Good Liars":**
      *   A student who gambles on crypto can easily write, "I lost savings in a failed startup investment." Without bank records, Case 2 looks like Case 3. The procedure relies on narrative consistency. If a student is strategic, they will frame Option Luck as Brute Luck (e.g., "My car died" vs. "I didn't change the oil"). You are auditing essays, not lives.

  2.  **It Systematically Mistreats the "Chronic Crisis" Student:**
      *   Some students live in a permanent state of emergency (family sends no money, health issues, housing instability). They will apply every semester.
      *   **Q3 (History)** penalizes them. Every time they apply, their "History Score" gets worse, making them less likely to be funded, forcing them into worse crises. This procedure is designed for *one-off* shocks, not structural disadvantage. It will systematically filter out the students who need help the most over the long term, favoring the "stable student with one bad break."

  3.  **It Cannot Solve the "Expensive Tastes" vs. "Disability" Conflict:**
      *   If a student needs a $3,000 laptop because of a disability (screen reader compatibility, specific processing speed for assistive tech) and another needs it for gaming/video editing, the procedure treats them the same in Q1. You need a separate, quiet channel for Disability Services verification, or you will either underfund the disabled student or overfund the gamer.

  4.  **The "Fault" Metric is Subjective:**
      *   Your three grad student reviewers will have different thresholds for "Reasonable Mitigation." One grew up rich and thinks insurance is obvious; one grew up poor and thinks insurance is a scam. You will have calibration drift. You must hold a 30-minute calibration session every semester where you score two fake applications together to align your "1–5" scales.

  ### Final Recommendation
  Use the procedure, but **waive the Denial on Case 3 only if you have surplus funds.**
  If you have to choose between Case 1 and Case 3, fund Case 1. It is the cleaner "Brute Luck" case.
  If you fund Case 3, acknowledge you are violating the "Fault" criteria to satisfy a moral intuition that the theory doesn't support. That is an administrative decision, not a philosophical one.

  **The procedure's job is not to be morally perfect; it is to be consistent enough that when you deny someone, you know *why*, and when you fund someone, you aren't just rewarding the best writer.**
