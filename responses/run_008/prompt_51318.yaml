      *   *Actually, the best "Hate" outcome is denying the Two Jobs student.* Why? Because it reveals the cruelty of the "Fault" metric. It forces the reviewers to admit "We are punishing you for working." That is a powerful teaching moment about the theory's limits. I will write the procedure to *attempt* to catch this, but admit that under strict time constraints, it might miscategorize it.
