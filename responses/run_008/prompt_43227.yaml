answer: |-
  # JOINT STATEMENT ON POPULATION ETHICS
  **Submitted by:** The Totalist Member (TM) & The Person-Affecting Member (PAM)  
  **Date:** October 26, 2023  
  **Subject:** Findings of One-Year Adversarial Collaboration on Population Value

  ## 1. Points of Agreement

  After twelve months of structured dialogue, we submit the following claims as mutually accepted. These distinctions have allowed us to isolate substantive disagreements from conceptual confusions.

  **1.1 On Parfit's Contributions**
  *   **The Repugnant Conclusion:** We agree that Parfit's Repugnant Conclusion demonstrates that *Total Utilitarianism* entails that a world with a sufficiently large population of lives barely worth living is better than a world with a smaller population of excellent lives. It does **not** demonstrate that Total Utilitarianism is logically incoherent, nor does it prove that the conclusion is false (TM maintains it is a bullet worth biting; PAM maintains it is a *reductio*).
  *   **The Non-Identity Problem:** We agree that the Non-Identity Problem demonstrates that standard person-affecting constraints (e.g., "do not harm specific individuals") cannot explain why it might be wrong to adopt policies that deplete resources for future generations, provided the future people thereby brought into existence still have lives worth living. It does **not** demonstrate that such policies are permissible, only that the explanation for their wrongness cannot rely on harm to those specific future individuals.

  **1.2 Empirical Preconditions for Policy**
  We agree that no abstract population ethic can guide public policy without empirical inputs regarding the function $W = f(N, Q, R)$, where $N$ is population size, $Q$ is average quality of life, and $R$ is resource/environmental capacity. Specifically, we endorse the following as necessary preconditions for any defensible policy recommendation:
  *   **Crowding & Dilution:** Estimates of how marginal increases in $N$ degrade $Q$ via congestion, environmental strain, or dilution of fixed capital.
  *   **Innovation & Scale:** Estimates of how marginal increases in $N$ might increase $Q$ via economies of scale, specialization, or technological innovation.
  *   **Substitutability:** Data on whether resources allocated to creating new lives (pronatalism) are directly subtracted from resources available to sustain existing lives (life-extension/welfare).

  **1.3 The Verbal Dispute Regarding "Better"**
  We acknowledge that a significant portion of our initial dispute was verbal, centering on the semantic reference of the term "better" in the question: *"Is a larger population better?"*
  *   **TM Usage:** TM uses "better" to denote **Axiological Betterness**: an impersonal ranking of states of affairs based on the total sum of value contained within them.
  *   **PAM Usage:** PAM uses "better" to denote **Moral Preferability**: a ranking of outcomes based on whether they fulfill obligations to specific subjects (existing or future).
  *   **Resolution:** We agree that if the question is "Does a larger population contain more *value*?", TM is correct by definition. If the question is "Are we *obligated* to choose a larger population?", PAM is correct that the answer does not follow automatically. Our remaining disagreement is not about the definition of words, but about whether *Axiological Betterness* generates *Moral Reasons*.

  ***

  ## 2. Table of Remaining Disagreements

  The following table isolates the substantive disagreements that remain after clarifying definitions and empirical assumptions.

  | # | Disagreement Statement | The Crux (Subquestion for Resolution) |
  | :--- | :--- | :--- |
  | **2.1** | **The Status of Potential Persons:** TM holds that bringing a person into existence with a life worth living is a *pro tanto* moral good. PAM holds that bringing a person into existence is morally neutral (regarding that person), as there is no subject prior to conception to whom the benefit accrues. | **Does the potential welfare of a non-existent being generate a moral reason for action equivalent to the actual welfare of an existing being?** |
  | **2.2** | **The Trade-Off Principle:** TM holds that sufficient total welfare gains from new lives can outweigh significant welfare losses for existing people (provided existing lives remain worth living). PAM holds that welfare losses to existing people cannot be outweighed by gains to new people who would not otherwise exist. | **Is the moral weight of a unit of welfare invariant regardless of whether the recipient is an existing person or a newly created person?** |

  ***

  ## 3. Concrete Cases and Predictions

  To test the Cruxes identified above, we constructed two budget allocation scenarios. Below are our pre-registered judgments, our predictions of the other's judgment, and the conditions under which we expect the other's intuition to flip.

  ### Case A: The Prosperity Allocation
  **Scenario:** A government has a fixed surplus budget of $10 Billion.
  *   **Option 1 (Pronatal Subsidies):** Funding child tax credits and childcare subsidies. Empirical models predict this will result in **1,000,000 additional births**. These children will have lives **comfortably worth living** (estimated 70 QALYs each at high welfare intensity).
  *   **Option 2 (Life Extension):** Funding geroscience research. Empirical models predict this will grant **15 additional healthy years** to **500,000 currently living citizens** (aged 65+).
  *   **Constraint:** The budget is fixed; choosing Option 1 precludes Option 2. Crowding effects are negligible in this specific economic context.

  | | **Totalist Member (TM)** | **Person-Affecting Member (PAM)** |
  | :--- | :--- | :--- |
  | **My Judgment** | **Choose Option 1.** <br>1M lives × 70 QALYs = 70M QALYs generated. <br>500k lives × 15 QALYs = 7.5M QALYs generated. <br>Total value is vastly higher in Option 1. | **Choose Option 2.** <br>Option 2 is better *for* the 500k seniors. <br>Option 1 is not better *for* the 1M children (they do not exist to be benefited otherwise). <br>We have duties to existing citizens, not potential ones. |
  | **Prediction of Other** | I predict PAM will choose Option 2, prioritizing the specific claims of the elderly over the creation of new happy lives. | I predict TM will choose Option 1, treating the new children as "utility containers" to be filled, disregarding the specific claims of the elderly. |
  | **Intuition Flip Condition** | **If:** The 1M new lives were predicted to be *miserable* (negative welfare). <br>**Reveals:** TM accepts that negative welfare counts against creation (Asymmetry). | **If:** The 1M new lives were predicted to have *extraordinary* welfare (e.g., post-human flourishing) AND the 500k seniors would only gain 1 month. <br>**Reveals:** PAM accepts a "Wide" Person-Affecting view where massive gains to new people can outweigh trivial gains to existing people. |

  ### Case B: The Barely Worth Living Variant
  **Scenario:** Same budget and trade-off structure as Case A.
  *   **Option 1 (Pronatal Subsidies):** Results in **1,000,000 additional births**. However, due to resource dilution, these children will have lives **barely above neutrality** (estimated 70 QALYs each at very low welfare intensity, e.g., subsistence level).
  *   **Option 2 (Life Extension):** Identical to Case A (15 healthy years to 500k existing citizens).

  | | **Totalist Member (TM)** | **Person-Affecting Member (PAM)** |
  | :--- | :--- | :--- |
  | **My Judgment** | **Choose Option 1.** <br>Even at low welfare intensity, 70M low-QALYs > 7.5M high-QALYs. <br>The Repugnant Conclusion is not a contradiction; it is a mathematical truth of aggregation. | **Choose Option 2.** <br>Creating lives barely worth living is not a moral improvement. <br>Denying the 500k seniors their extension harms them. <br>Creating the 1M children helps no one. |
  | **Prediction of Other** | I predict PAM will choose Option 2, relying on the intuition that "quality" trumps "quantity" when quantity is merely positive. | I predict TM will choose Option 1, biting the Repugnant Conclusion bullet to maintain consistency with Case A. |
  | **Intuition Flip Condition** | **If:** The resource dilution from Option 1 caused the *existing* population's welfare to drop below the "barely worth living" threshold. <br>**Reveals:** TM accepts a lexical threshold where existing suffering trumps total aggregation. | **If:** The new lives in Option 1 were guaranteed to be *geniuses* who would solve climate change, securing high welfare for all subsequent generations. <br>**Reveals:** PAM accepts that instrumental value of new people can override the Non-Identity constraint. |

  ### Signatures

  _________________________  
  **Totalist Member**

  _________________________  
  **Person-Affecting Member**
