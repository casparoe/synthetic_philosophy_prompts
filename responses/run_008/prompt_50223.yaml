  9.  (Final check on Quine scholarship): Quine's "Indeterminacy of Translation" is indeed about the lack of a unique *correct* manual. But he insists on "stimulus meaning." LLMs don't have stimuli in the Quinean sense (neural endings firing). They have tokens. This is a crucial distinction. I will emphasize this.

