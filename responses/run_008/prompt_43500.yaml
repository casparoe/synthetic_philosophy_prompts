answer: |-
  Dear Colleague,

  It is no surprise that your student has constructed such a formidable objection, for she has put her finger on the most persistent worry surrounding Strawson's project, namely that grounding responsibility in human sentiment leaves us vulnerable to a debilitating relativism. Her argument is valid, which means the trouble must lie in the truth of the premises, and while her intuition suggests the fault lies between steps two and three, I believe you should advise her to reject step three specifically. Step two looks innocent because Strawson is indeed a naturalist who acknowledges that the specific triggers of our reactive attitudes are shaped by local customs and historical contexts; he admits that what counts as a slight in one community might be ignored in another. However, step three makes the illicit leap from describing the sociological conditions under which attitudes arise to prescribing the normative conditions under which those attitudes are appropriate. Strawson's claim is not that responsibility consists in being the actual target of reactive attitudes, but rather in being an appropriate target, and the standards of appropriateness are internal to the practice itself rather than being determined by the mere fact of the attitudes' occurrence.

  The crucial distinction your student needs to draw is between the attitudes that are actually felt and the attitudes that would be fitting given the demands constitutive of the participant perspective. When Strawson argues that we cannot justify the reactive attitudes from a wholly external standpoint, he is not saying that every actual expression of those attitudes is beyond critique; rather, he is saying that the criteria for critique must be found within the framework of human relationships itself. The standard of fittingness comes from what Strawson calls the demand for reasonable goodwill. This demand is not an attitude-independent metaphysical fact about the universe, so it does not violate the prohibition in step one against external justification, but neither is it merely a report of what a community happens to feel. It is a normative expectation inherent in participating in interpersonal relationships. When we feel resentment, we are protesting a violation of this demand, and if a community feels indignation toward women reading in public, we can say within the participant perspective that this attitude is misplaced because reading a book does not constitute a failure of goodwill toward others. The community is not operating with a different but equally valid morality; they are making a mistake about what counts as a quality of will, and we can identify this mistake without appealing to a view from nowhere.

  Rejecting step three does come with a cost, however, which you should be prepared to discuss in seminar. It costs Strawson the ability to remain purely descriptive about the ecology of sentiment. He must admit that some communities are not just different but irrational in their application of the reactive attitudes, even by their own lights if they were to reflect consistently on the demand for goodwill. This means that the participant perspective is not a monolith where every feeling is self-validating; it contains within it resources for self-correction and rational debate about what constitutes injury and what constitutes ill will. We cannot say that the women are genuinely blameworthy simply because the community feels indignation, because the feeling itself fails to track the only thing that makes blame appropriate, which is the quality of will manifested in the action. This preserves the normativity of responsibility without reintroducing the external standpoint, because the norm is supplied by the nature of the relationship we are trying to maintain, not by a metaphysical fact about free will.

  You might also ask your student to consider how step four fails on its own terms given this internal standard. Strawson explicitly limits reactive attitudes to responses to the quality of will expressed by agents. Indignation directed at what a person is, such as their gender, rather than at how she wills, fails to be a reactive attitude in Strawson's strict sense because it does not respond to a manifestation of goodwill or ill will. If the community treats gender as a proxy for will, they are operating under a false belief about agency, and correcting that belief is an internal correction of their practice, not an external override. By holding fast to the distinction between the existence of the practice and the correct application of its internal norms, you can show your student that Strawson can avoid the relativist conclusion without abandoning the participant perspective. The repair requires us to see that the participant stance is rational and normative, not merely psychological and descriptive, and while this makes Strawson's position slightly more demanding than a simple appeal to human nature, it saves him from the intolerable conclusion that injustice is merely a difference in taste. I hope this helps you prepare for Thursday, and I would be keen to hear how the discussion unfolds.
