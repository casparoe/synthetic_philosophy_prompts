answer: |-
  Here is the operational procedure based on the framework you described. I have validated your memory of Dennett quietly in the logic below (yes, the "center of gravity" analogy is the correct one for "real patterns"—abstract but indispensable for prediction)—but I have stripped the academic terminology out of the wiki text so your team doesn't tune out.

  This is written in American English, formatted for a wiki, and designed to be copy-pasted directly. Following the document, I have included a brief note to you on how to roll this out without triggering the cultural friction you're worried about.

  ***

  # Incident Communication Protocol: System Stances

  ## 1. Objective
  During an incident, speed and accuracy are the only metrics that matter. Disagreements over language ("The service is panicking" vs. "The retry limit was exceeded") waste time. This protocol defines when abstract language is a useful tool and when it is a dangerous distraction.

  **Rule of Thumb:** Language is valid if it helps us predict the system's next move faster than reading the raw logs. If it slows us down or hides the root cause, it is banned.

  ## 2. The Three Stances
  When discussing a component, you are implicitly taking one of three positions. You need to know which one you are using.

  | Stance | Description | Example | When to Use |
  | :--- | :--- | :--- | :--- |
  | **Physical** | Hardware/Electrons. Bit flips, heat, network packets, disk sectors. | "The NIC is dropping packets due to buffer overflow." | Rare. Only when hardware failure is confirmed. |
  | **Design** | Code/Logic. Functions, schemas, timeouts, configuration. | "The worker hit the `max_retries` constant and exited." | **Default.** Use this for root cause analysis. |
  | **Intentional** | Goals/Beliefs. Treating the system as an agent with desires. | "The worker thinks the queue is empty so it's sleeping." | **Conditional.** Only allowed if it predicts behavior faster than the Design stance. |

  ## 3. During Incident (The 30-Second Test)
  When an Incident Commander (IC) or engineer proposes an Intentional description (e.g., "The cache is being stubborn"), run this mental checklist immediately.

  1.  **Prediction Test:** Does saying "it wants X" allow us to correctly guess the next log entry or metric spike faster than tracing the code?
      *   *Yes:* Proceed. (e.g., "It's backing off" correctly predicts a delay).
      *   *No:* Switch to Design stance immediately.
  2.  **Compression Test:** Does this shorthand save time explaining a complex mechanism?
      *   *Yes:* Proceed. (e.g., "The load balancer is struggling" is faster than explaining connection queue depth).
      *   *No:* Switch to Design stance.
  3.  **Friction Test:** Is anyone arguing about the metaphor?
      *   *Yes:* **Stop.** The metaphor has failed. Revert to literal log data immediately.

  **IC Authority:** The IC has the right to interrupt any discussion that violates this test. "We are arguing about words. Show me the log line."

  ## 4. During Postmortem (Verification)
  In the calm of a postmortem, Intentional language must be audited. It is often useful for the *narrative* but dangerous for the *action items*.

  *   **The Translation Rule:** Every Intentional claim in the summary must map to a Design fact in the technical analysis.
      *   *Allowed:* "The service appeared confused by the traffic spike."
      *   *Required:* "The autoscaling heuristic misinterpreted the spike as noise due to the 30s window setting."
  *   **The "Vibes" Check:** If a statement cannot be mapped to code or config, it is "Vibes." Vibes are not root causes.
      *   *Bad:* "The database locked up because it was overwhelmed."
      *   *Good:* "The database locked up because transaction isolation level X caused a deadlock under load Y."

  ## 5. Hard Cases & Examples
  Use these precedents to settle disputes.

  ### Case A: Intentional Stance Wins (High Compression)
  *   **Scenario:** A downstream API returns 429 (Too Many Requests).
  *   **Intentional:** "The downstream is throttling us; we need to back off."
  *   **Design:** "The downstream returned HTTP 429 with a `Retry-After` header, triggering our exponential backoff middleware."
  *   **Verdict:** **Intentional is acceptable during incident.** The mechanism is standard and well-understood. Saying "it's throttling us" compresses the HTTP spec into a single actionable concept.
  *   **Postmortem:** Must revert to Design stance to verify our backoff config matches their header.

  ### Case B: Intentional Stance Loses (Hides Root Cause)
  *   **Scenario:** A worker stops processing jobs.
  *   **Intentional:** "The worker thinks the queue is empty."
  *   **Reality:** The worker crashed due to an OOM kill, or a hardcoded timeout was reached, or the visibility timeout expired.
  *   **Verdict:** **Banned.** "Thinks" implies a logic check that didn't happen. This metaphor hides the crash. It suggests the system made a rational choice when it actually failed.
  *   **Action:** IC must intervene: "Don't say what it thinks. Say what the last log entry was."

  ### Case C: The Ambiguous Zone (Human Call Required)
  *   **Scenario:** "The load balancer is struggling."
  *   **Ambiguity:** Is it CPU saturation? Connection limit? Network bandwidth? Health check failures?
  *   **Verdict:** **Acceptable as a status headline, banned for debugging.** It is useful for stakeholder updates ("The LB is struggling, ETA 10 mins"), but engineers must immediately split into Design stance to find *why*.
  *   **IC Role:** If the team stays in the Ambiguous Zone for more than 5 minutes, the IC must assign specific Design tasks (e.g., "Alice check CPU, Bob check connection counts").

  ## 6. Team Dynamics & Culture
  This protocol is not a ban on metaphors. Metaphors are how humans build mental models, especially when tired at 3:00 AM.

  *   **Junior Engineers:** Newer team members often rely on Intentional stances to understand complex systems. Do not shame this. It is a valid learning scaffold.
  *   **The Limit:** Scaffolding is for building, not for living in. Once the incident is resolved, the scaffold must be removed to reveal the actual structure (the code).
  *   **Policing:** This protocol is not for "gotcha" moments in Slack. It is for Incident Calls and Postmortems. If a metaphor helps you fix the bug faster, it was the right tool for the job, even if it isn't literally true.

  ## 7. Known Limitations
  This procedure will misfire in the following scenarios. Acknowledge them and escalate to the IC.

  1.  **Emergent Behavior:** Sometimes the system *does* behave like an agent (e.g., ML models, complex retry storms) where the Design stance is too complex to trace in real-time. In these cases, the Intentional stance is the *only* viable option until the system is calm.
  2.  **Social Friction:** If enforcing this rule causes more argument than the metaphor itself, the IC should override the rule. Peace and speed trump philosophical purity.
  3.  **Unknown Unknowns:** If the Design stance yields no answers (logs are silent), the team may revert to Intentional speculation to generate hypotheses. This must be flagged as "Speculation" in the notes.

  ***

  ### Note to the Incident Commander (You)

  A few thoughts on rolling this out, since you mentioned the social risk:

  1.  **The "Center of Gravity" Correction:** You remembered Dennett correctly. He argues that beliefs are "real patterns" in the same way centers of gravity are real. You can't touch a center of gravity, and you can't find a "belief" in a specific neuron (or a specific line of code), but if you remove the concept, your ability to predict the system (the falling object, or the chess computer) collapses. The wiki document above operationalizes this as the **Prediction Test**.
  2.  **Implementation Strategy:** Do not present this as a "Philosophy Fix." Present it as a "Time-Saving Fix." If you frame it as "We are applying Dennett's Intentional Stance," the pragmatists will roll their eyes. If you frame it as "Stop arguing about words for 45 minutes," everyone will sign up.
  3.  **The Social Contract:** The wiki section on **Team Dynamics** is crucial. If you ban anthropomorphism entirely, you break the mental models junior engineers use to learn. If you allow it entirely, you get sloppy postmortems. The compromise is: *Metaphors are allowed for hypothesis generation and status updates, but forbidden for root cause attribution.*
  4.  **Where It Will Fail:** Be prepared for the "Emergent Behavior" exception. In modern distributed systems (especially with autoscaling or ML components), the Design stance is sometimes impossible to trace in real-time because the state space is too large. In those moments, "The system is trying to stabilize" is actually the most accurate description available. The protocol admits this in Section 7, but be ready to enforce that distinction when the dust settles.

  Good luck. You're essentially doing applied epistemology while on call; that's a hard shift, but it's the right one.
