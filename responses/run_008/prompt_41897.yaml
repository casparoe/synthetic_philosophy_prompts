answer: |-
  **Exam Question: The Löbian Obstacle in Rational Agency**

  Consider an agent $A$ operating within a formal theory $T$ (such as Peano Arithmetic). $A$ selects actions by searching for proofs in $T$ of statements linking actions to outcomes. $A$ faces a successor agent $A'$ identical to itself, also using $T$. $A$ wishes to prove the safety condition: "If $A$ selects an action via proof search in $T$, then the outcome is desirable."

  (a) Formalize the condition $A$ wants to prove regarding its own action selection. Explain why $A$ cannot derive this safety condition within $T$, despite every individual inference step being valid in $T$. Your explanation must distinguish between the system's ability to verify proof steps and its ability to trust the system itself.

  (b) Suppose we modify $A$ to use theory $T^+ = T + \text{'T is sound'}$, adding an axiom asserting $T$'s soundness. Explain why this fails to solve the problem for a sequence of agents where each successor runs the same search procedure. Discuss the consistency implications using Gödel's Second Incompleteness Theorem.

  (c) Briefly explain the implication for two distinct agents reading each other's source code who wish to cooperate conditionally on proof of cooperation. Why does transparency not guarantee coordination in this formal setting?

  ***

  **Model Answer**

  The agent $A$ operates within a formal theory $T$, such as Peano Arithmetic, selecting actions by searching for proofs linking actions to outcomes. Specifically, $A$ wishes to establish the safety condition: "If $A$ selects an action via proof search in $T$, then the outcome is desirable." Formally, $A$ attempts to derive $\text{Prov}_T(\ulcorner \text{Act} \to \text{Good} \urcorner) \to (\text{Act} \to \text{Good})$ within $T$. Every individual step of $A$'s reasoning is verifiable within $T$; $A$ can prove that if it finds a proof of $\phi$, it will execute the associated action. The derivation fails not because any single inference is invalid, but because the system cannot internalize the implication that provability entails truth. While $T$ proves $\text{Prov}_T(\phi) \to \text{Prov}_T(\text{Prov}_T(\phi))$, it cannot prove $\text{Prov}_T(\phi) \to \phi$ unless $\phi$ is already provable. This is Löb's Theorem. The obstacle is not that $A$ makes invalid inference steps; rather, $A$ cannot validate the soundness of the system it uses to validate steps. The local validity of proof checking does not aggregate into global self-trust because the system cannot contain its own truth predicate without contradiction. We, as external observers, know $T$ is sound, but $T$ cannot know this about itself.

  Consider the proposed fix: modifying the agent to use $T^+ = T + \text{Soundness}(T)$, adding an axiom asserting $T$'s soundness. While $A$ using $T^+$ can now trust a successor using $T$, this fails for a sequence of identical agents. If the successor $A'$ also uses $T^+$, then $A$ must trust $T^+$. This requires $T^+$ to prove $\text{Soundness}(T^+)$. By Gödel's Second Incompleteness Theorem, a consistent system cannot prove its own consistency, and asserting full soundness typically leads to inconsistency if the system attempts to verify itself. Specifically, if $T^+$ proves its own soundness, it can prove its own consistency, which implies inconsistency if $T^+$ is sufficiently strong. If each generation adds soundness of the previous theory as an axiom, the theory strength escalates infinitely, preventing stable self-replication. If they share the same $T^+$, the system cannot prove its own soundness, leaving the trust gap intact. The fix is circular because trusting the successor requires assuming the very soundness property that the system is trying to prove.

  This logical barrier has direct implications for multi-agent coordination involving source code transparency. Suppose two agents, $A$ and $B$, share identical source code using theory $T$ and wish to cooperate conditionally on proving the other cooperates. $A$ searches for a proof that $B$ cooperates. Since $B$ is identical, $B$ cooperates if $B$ finds a proof that $A$ cooperates. $A$ needs to prove that $B$'s proof search succeeds. However, $B$'s search succeeds only if $T$ is sound enough to validate the cooperation loop. Since $T$ cannot prove its own soundness, $A$ cannot prove that $B$'s proof implies actual cooperation. Consequently, both agents defect, not due to conflicting interests or lack of information, but because neither can formally verify the trustworthiness of the logic they both employ. The Löbian obstacle demonstrates that rational agency based on formal proof is inherently limited in self-referential contexts, preventing stable self-modification or mutual trust even among identical copies. This highlights that formal rationality does not guarantee optimal coordination when agents must reason about their own reasoning processes.

  ***

  **Marking Scheme**

