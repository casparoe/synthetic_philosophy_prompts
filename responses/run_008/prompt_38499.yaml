          *   Maya argues for the *stream*, even if the riverbed changes.
          *   Theo argues for the *water*, not just the path.
      *   **The Ending:**
          *   No conversion. No "You convinced me."
          *   Acknowledgment of the stakes. A bittersweet farewell.

  4.  **Writing - Iteration & Polishing (Self-Correction during drafting):**
      *   *Check:* Did I include the specific technical details? Yes (shadow mode, parallel computation, sleep batching, speed mismatch).
      *   *Check:* Are they strawmanning? Make sure Maya has good points. She shouldn't just say "Trust the science." She needs to say "Identity is information."
      *   *Check:* Is the "out of sync" part clear? Theo needs to seize on the micro-second differences.
      *   *Check:* Is the "sleep" part clear? The idea that she wakes up having processed data from yesterday.
      *   *Tone Check:* Keep it emotional but intellectual. They are siblings; they know each other's buttons.

  5.  **Specific Dialogue Beats:**
      *   *Beat 1:* Theo brings up the "Shadow." Is it a ghost?
