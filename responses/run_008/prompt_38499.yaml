answer: |-
  The bench outside the NeuroDyne facility was cold, but neither Maya nor Theo moved to put on their coats. The glass building behind them hummed, a low-frequency vibration that Theo claimed he could feel in his teeth.

  "Three weeks," Theo said, staring at the entrance. "That's how long the shadow phase lasts."

  "Twenty-two days," Maya corrected. She was clutching her tablet, reviewing the consent forms one last time. "It's the settling period."

  "Settling," Theo repeated. "That's a gentle word for running a duplicate of your consciousness in a server rack while your biological brain is still firing. You know what that looks like to me, May? It looks like a hostage situation. The digital you is held in reserve until the biological you is convenient to dispose of."

  Maya sighed, locking the tablet. "We've been over the copy argument. It's not a copy if there's no break in the causal chain. The artificial neurons aren't taking over; they're integrating. One by one."

  "But they run in parallel first. That's the protocol." Theo turned to face her. "Shadow mode. For every biological neuron that's slated for replacement, there's a digital twin firing alongside it. Slightly out of sync, the brochure said. How out of sync?"

  "Milliseconds. Maybe seconds, during high-load processing."

  "So," Theo pressed, "for those milliseconds, there are two distinct physical substrates processing 'Maya.' If I were to zap the biological one right then, the digital one keeps going. If I zap the digital one, the biological one keeps going. That implies two centers of consciousness. Even if it's brief. Even if it's milliseconds."

  "It implies redundancy, not duality," Maya said. "Think of it like... like a bridge being reinforced. You bolt the new steel onto the old wood before you cut the wood away. The load is carried by both. That doesn't mean there are two bridges."

  "The load is *me*," Theo snapped. "I'm not traffic. I'm the experience of crossing." He leaned forward, elbows on knees. "If the digital twin is out of sync, even by a second, it's having a different experience than the bio brain. It receives the sensory input a fraction later. It processes the emotion a fraction slower. For that window, you are divergent. You are a chord, not a note. And then they switch off the bio side. Which one survived? The one that was ahead, or the one that caught up?"

  "The one that contains the pattern," Maya said firmly. "Look, Theo, you're obsessed with the hardware. You think 'I' am the meat. I think 'I' am the song. If the orchestra swaps out the violins for synthesizers, but they play the same notes, the song continues."

  "But they aren't playing the same notes at the same time," Theo countered. "That's the second quirk. The speed mismatch."

  Maya flinched slightly. This was the part she worried about most, late at night. "The artificial neurons are slower. Yes."

  "They're significantly slower," Theo said. "They can't keep up with real-time biological firing rates. So the protocol says they do their heavy lifting while you sleep. Batch processing."

  "Consolidation," Maya corrected.

  "Reruns," Theo said. "You go to sleep as Bio-Maya. You dream, or you don't. While you're out, the digital layer catches up. It processes the day's data, integrates the memories, runs the simulations. Then you wake up, and the digital layer is now the primary driver for those circuits. But the 'you' that woke up... that's a mind that just finished processing yesterday. You're waking up as a delay broadcast of yourself."

  Maya looked out at the parking lot. A car pulled in, tires crunching on gravel. "Sleep is already a discontinuity, Theo. Every night I lose consciousness. Every morning I reboot. The 'me' that went to bed is gone. The 'me' that wakes up has the memories. This is just... a longer reboot. A more thorough one."

  "It's not a reboot if the machine changes while it's off," Theo argued. "When you wake up normally, your brain is roughly the same arrangement of atoms. When you wake up from the procedure, a chunk of your cognitive architecture has been rewritten by a slower processor working in the dark. How do you know the thing that opens its eyes is the thing that closed them? Or is it just something that *thinks* it's you because it has your logs?"

  "Because I feel continuous," Maya said, her voice rising. "I've done the trials. The cognitive tests. The phenomenological reports. I don't feel like a copy. I feel like myself, just... clearer. Less noise."

  "Of course you feel like yourself. You're the one who woke up!" Theo threw his hands up. "The dead don't talk. If the procedure kills you and spawns a successor, that successor will *always* say it's continuous. It has your memories of signing the consent form. It has your love for me. It has your fear of death. That doesn't prove it's you. It just proves it's a good actor."

  Maya turned to him, eyes sharp. "Then what is the threshold? If I replace one neuron, am I dead? If I replace a billion? You say the speed lag breaks continuity. But my biological neurons fire at different speeds depending on my health, my age, my caffeine intake. If I get a fever, my processing slows. Am I a different person then? Is the continuity broken because my biological hardware is degraded?"

  "That's degradation of the original substrate," Theo said. "It's still the original substrate. This is... it's a handoff. You're talking about a relay race where you hand the baton to a runner who starts ten meters behind you, runs in his sleep, and then claims he ran the whole race when he crosses the finish line."

  "I'm talking about the baton being the only thing that matters," Maya said. "The runner is irrelevant."

  "The runner is the experience!" Theo stood up, pacing. "The shadow mode... that's the worst part. That's the purgatory. For three weeks, you exist in this superposition. Bio and Digital running parallel. If they are truly synchronized, why keep the bio one? If they aren't, then there is a conflict. Who decides which signal wins? The protocol says the bio signal is primary until the switch. So the digital mind is living in the past, watching the bio mind lead, waiting for it to die so it can take the wheel."

  "It's not waiting for death. It's waiting for verification," Maya said. "It's safety. If the digital twin glitches, the bio brain takes over. It's the ultimate backup."

  "It's a lifeboat that stays tied to the sinking ship until the water is up to the deck," Theo said. He stopped pacing and looked down at her. "May, I'm not afraid of the technology. I'm afraid of the gap. In the shadow mode, there are two streams. In the sleep batch, there is a time jump. You are stitching your continuity together with patches of silence and duplication. You're trying to convince yourself that a mosaic is a mirror."

  Maya stood up. She was shorter than him, but she held her ground. "And you're convinced that continuity is a magical property of carbon. That as long as the atoms are the same, the soul survives, even if the mind rots. I'm losing myself to entropy, Theo. Every day. My memory slips. My reaction time drags. This procedure stops the decay. Yes, there are quirks. Yes, there is lag. But the stream flows. It might eddy, it might swirl, but it doesn't stop."

  "If the stream goes underground," Theo said quietly, "and comes out a mile away, it's not the same river. It's just water in the same valley."

  "Then I guess we won't know until I step into the water," Maya said.

  Theo looked at the clinic doors. The automatic sensors flickered. "If you go in there... and you come out tomorrow. And you tell me about our childhood. And you cry when you mention Mom. I'll believe you. But I'll always wonder if I'm talking to the sister who signed up, or the one who inherited her life."

  "And I'll always wonder," Maya said, picking up her tablet, "if the brother who says goodbye is the one who loves me, or the one who's just afraid of letting go."

  Theo didn't smile. He reached out and touched her arm. It was a solid, warm grip. Biological. "I'm afraid of losing you, May. However you define 'you'."

  "I know," she said. She covered his hand with hers. Her skin felt cool. "But I'm more afraid of ending. Even if the 'I' that continues is a little out of sync. Even if it wakes up from yesterday's dreams. I'd rather be a delayed broadcast than a cancelled show."

  She pulled away and walked toward the glass doors. Theo stayed on the bench. He watched her reflection in the glass merge with the reflection of the building, indistinguishable from the structure itself.

  "See you tomorrow," Theo called out.

  Maya paused at the threshold. She didn't turn around. "See you tomorrow, Theo."

  She walked inside. The doors slid shut, sealing the hum within. Theo sat alone in the silence, wondering if the woman who walked out in the morning would know why he was crying, or if she'd just have a file on it.
