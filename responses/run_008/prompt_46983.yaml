      *   He might be protecting himself from pain (defense mechanism).
      *   The "reason" might exist but is blocked by emotional barriers (pride, fear of rejection, shame).
      *   Mom's "reason" might be an attempt to pierce that defense, but phrasing it as an obligation triggers resistance.

  6.  **Drafting the Response - Structure:**
