answer: |-
  You are not pattern-matching badly. You have identified a very specific, well-documented structure in game theory and behavioural economics. It is a genuine phenomenon, and it is considerably more dangerous than plain sunk cost reasoning because, as you noted, it is interactive.

  To answer your first question: yes, the structure has established names, but they are split between the *mechanism* and the *outcome*.

  ### The Established Names

  The specific game your brother-in-law is running is a classic example of the **Dollar Auction** (sometimes called the **Shubik Auction**, after economist Martin Shubik who described it in 1971). In this game, the highest bidder wins the prize, but the *second-highest* bidder must also pay their bid. This creates the exact trap you described: once you are the runner-up, you are compelled to bid higher to avoid locking in a loss, which pushes the winner higher, and so on.

  However, the Dollar Auction is a specific *setup*. The broader class of conflict you are describing—where two parties incur costs over time, and the winner is simply the one who endures longer—is known in game theory and evolutionary biology as a **War of Attrition**.

  In a War of Attrition, the "prize" is fixed (e.g., a mate, a territory, or being right on Facebook), but the cost accumulates the longer the fight lasts. Crucially, in the standard model, both parties pay their costs regardless of the outcome. This matches your expense claim and custody dispute examples perfectly.

  ### The Missing Nuance: "The Trophy Effect"

  You rightly pointed out that standard definitions feel slightly off because of one specific detail: *"if you give up, your losses… effectively convert into the winner's trophy."*

  In a standard economic War of Attrition, the loser's money is burnt; it does not go to the winner. In your brother-in-law's charity auction, the money goes to the charity. But in your social examples (arguments, status disputes), the loser's effort *does* increase the value of the winner's prize. If you defeat an opponent who surrendered immediately, it means little. If you defeat an opponent who fought for six hours, your victory signals higher status.

  Economists call this **Endogenous Valuation**: the value of the prize is not fixed, but is determined by the contest itself. Psychologists and biologists refer to the mechanism as **Costly Signalling**. By enduring the cost, you signal your commitment. When your opponent also endures cost, they validate that the prize was worth fighting for, thereby inflating its social value.

  Because existing terms like "War of Attrition" describe the *duration* and "Dollar Auction" describes the *payment rule*, neither fully captures the social feedback loop where the loser's suffering inflates the winner's status.

  ### A Proposed Term: "Social All-Pay Escalation"

  Since you asked for a term that covers the whole family (auctions, arguments, lawsuits) including that specific "trophy conversion" nuance, I propose we categorise this under **Social All-Pay Escalation**.

  Here is the definition:
  > **Social All-Pay Escalation** is a competitive dynamic where all participants must pay a continuing cost to remain in a contest, only one participant collects the prize, and the *social value* of that prize increases in proportion to the costs incurred by the losers.

  This distinguishes it from plain sunk cost (which is internal) and brinkmanship (which relies on the risk of accidental mutual destruction). In Social All-Pay Escalation, mutual loss is not a risk; it is the *price of admission*.

  ### Addressing Your Boundary Questions

  You asked where the edges of this definition lie. Here is how game theorists and behavioural analysts would carve those off:

  **1. Does it still count if the loser only pays half their bid?**
  **Yes.** The critical mechanic is not the *amount* recovered, but the *marginal cost of quitting*. If quitting locks in a loss that could potentially be recovered by spending a little more, the trap is active. In game theory, this is still an **All-Pay Auction** variant. Even if the loser pays nothing (a standard auction), if the *time spent* bidding is costly and non-recoverable, it functions as a War of Attrition. The "half bid" rule just changes the slope of the escalation, not the shape of the trap.

  **2. Does it count with three bidders, where quitting benefits two rivals at once?**
  **Yes, but it becomes unstable.** This moves into the realm of the **Tragedy of the Commons**. With two bidders, the dynamic is a duel. With three or more, the incentive to quit actually *increases* because your continued payment benefits *two* potential winners, not one. However, if the "prize" is status (like the Facebook argument), having *two* defeated opponents can make the trophy even more valuable. So, while the economic logic suggests the contest should collapse faster with more bidders, the social logic (Status Attrition) often sustains it longer.

  **3. Does it count when there's no audience?**
  **This is the critical edge.** In the charity auction, the audience is the room. In the Facebook argument, the audience is the timeline. In the expense claim dispute, the audience is the manager or HR.
  If there is truly **no audience** (e.g., a private argument between two people where nobody else will ever know who was right), the "trophy conversion" mechanism breaks. If the loser's suffering doesn't translate to the winner's status because nobody is watching, the value of the prize remains fixed.
  Therefore, for **Social All-Pay Escalation**, an audience (even an imagined one, like "principle") is a necessary condition. Without the audience, it reverts to a standard **War of Attrition** driven purely by individual stubbornness, rather than the social conversion of loss into glory.

  ### Summary for Your Work Context

  If you need to reference this in a professional setting without sounding overly academic, you can describe it as a **Dollar Auction dynamic** or a **War of Attrition**.

  However, to capture the specific insight you've had—that the loser's loss fuels the winner's ego—the most precise description is **Endogenous Escalation**.

  *   **Sunk Cost Fallacy:** "I've spent too much to stop." (Internal)
  *   **War of Attrition:** "I will outlast you." (Competitive)
  *   **Social All-Pay Escalation:** "If I stop now, your victory is cheap. If I make you fight, my victory is legendary." (Competitive + Social Value)

  You are correct that sunk cost is only half the story. The other half is the **competitive commitment** required to deny the opponent a cheap win. In the UK, we might simply call it a "pissing contest," but now you know the mechanics behind why the puddle ends up so much larger than necessary.

  ### A Note on Resolution

  Since you mentioned this might go into a work thing: the only rational way to win a Dollar Auction or War of Attrition is **not to bid**. Once the contest has started, the rational move is to cut losses immediately, however painful. But because the game relies on the *irrationality* of the opponent (their willingness to pay £50 to win £20), the only winning strategy is to recognise the game type before the first bid is placed.

  In your workplace examples, the solution is usually to introduce a **third-party adjudicator** who removes the "audience" element. If a manager decides the expense claim without the two colleagues fighting it out publicly, the status trophy vanishes, and the economic logic usually prevails.

  I hope this helps clarify the pattern. It is a robust observation, and you have correctly identified that the social stakes are what turn a simple auction into a destructive conflict.
