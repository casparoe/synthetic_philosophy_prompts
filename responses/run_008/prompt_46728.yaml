answer: |-
  Here are nine questions tailored for an engineering-savvy audience. They skip the intro stuff and go straight for the implementation and game-theory risks. I've kept the tone conversational but sharp.

  **1. The Confidence Heuristic**
  "The whole setup leans on a weaker judge reliably picking the better argument. But we know from psych literature that humans—and even weaker models—fall hard for confident nonsense. How do you distinguish in your training runs between a model that's getting better at the truth, versus a model that's just getting better at hacking the judge's bias for confidence?"

  **2. The Metric Problem**
  "Following up on that: when you look at your loss curves, what are you actually measuring? If the reward signal is just 'did the judge pick you,' aren't you implicitly optimizing for persuasion over accuracy? Is there a ground-truth check in the loop, or is the judge's preference the only signal you have?"

  **3. The Lying Equilibrium**
  "In self-play, you're rewarding winning, not truth. If both debaters discover a strategically useful lie that's really hard to rebut in the time limit, why wouldn't they just settle into a 'lying equilibrium'? Basically, why wouldn't they learn to take turns winning on that lie because it's the path of least resistance?"

  **4. The 'Honest Attractor' Pushback**
  *(Use this if she argues that honest equilibria are more stable)*
  "I've heard the counter-argument that honest equilibria are natural attractors. But isn't the lying path usually lower friction? Truth often requires more compute and more nuance to explain. If the model is reward-maximizing, why would it pay the extra cost for truth if the lie gets the same point?"

  **5. Shared Blind Spots**
  "Let's talk about the debaters' origins. They're instances of the same model that produced the plan they're debating. If the base model has a fundamental blind spot or a missing fact, don't the debaters share that? Is there any evidence that debate actually surfaces mistakes the base model couldn't have found on its own?"

  **6. Capability Redistribution**
  "Related to that: is debate actually uncovering new information, or is it just redistributing capability the model already had? If it's just redistribution, does that mean we're scaling oversight, or are we just scaling the model's ability to argue about its own output?"

  **7. Deployment Risks**
  "We're clearly heading into a world where frontier models get trained to persuade. Does training specifically for debate change the model's behavior at deployment? Do you lose sleep over the idea that you're building tools that are hyper-optimized to manipulate human judges, even if that's not the intent?"

  **8. The Compute Overhead**
  "For the engineers listening: this setup requires multiple inference passes and a judge loop. Does this require 10x the compute at inference time? Is this actually deployable for real-world safety, or does it stay a lab toy because the latency is too high?"

  **9. The Breaking Point**
  "Where does this break first? Is there a complexity threshold where the arguments just get too long for the judge to track, and the win rate drops to random chance? How do you know when the debate has outpaced the human's ability to verify?"
