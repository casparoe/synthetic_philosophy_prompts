      *   **Goal:** Lead a social psych class discussion.
      *   **Specific Task:** Create an 8-question sorting quiz to open the session.
      *   **Quiz Content:** Concrete cases where positions diverge (not abstract "do you believe in relativism"). Examples given: food taboos vs. assault, nature of moral disagreement (pizza vs. epidemic stats).
      *   **Scoring Key:** Map answers to specific meta-ethical positions:
          *   Moral Realism (WEIRD bias is noise, one side right).
          *   Moral Realism (WEIRD reduction is the bias, broader foundations valid).
          *   Moral Relativism.
          *   Moral Constructivism.
          *   Error Theory (if applicable).
      *   **Constraint:** Flag two positions the quiz *cannot* separate to prevent overselling.

  2.  **Deconstruct the Meta-Ethical Positions:**
      *   *Moral Realism (Universalist/WEIRD):* Morality is objective. Harm/Fairness are the *true* metrics. Other cultures are mistaken or less developed.
      *   *Moral Realism (Pluralist/Global):* Morality is objective. Purity/Loyalty/Authority are *also* real moral dimensions. WEIRD people are the outliers/blind ones.
      *   *Moral Relativism:* Morality is determined by culture. No external standard. "Right" means "right for us."
      *   *Moral Constructivism:* Morality is constructed through rational agreement or social processes, but not necessarily relative to *existing* culture (could be idealized). *Self-Correction:* Constructivism is tricky to distinguish from Relativism in a short quiz. I need to make sure the questions target the *source* of the norm (internal feeling/culture vs. external fact).
      *   *Error Theory:* Moral claims are all false because no moral facts exist. (Hard to distinguish from Relativism in a practical quiz, but possible if focusing on truth-aptness).

  3.  **Drafting the Questions (Iterative Process):**
      *   *Goal:* Need scenarios that pit Harm/Fairness against Purity/Loyalty/Authority, and scenarios that probe the *nature* of the disagreement (fact vs. preference).
      *   *Q1 (Purity vs. Harm):* The classic Haidt "cleaning the toilet with a flag" or "eating the dead dog." Let's go with the dead dog scenario but make it private/no harm.
      *   *Q2 (Authority vs. Fairness):* A boss/parent making an arbitrary decision. Is it wrong because it's unfair, or okay because of hierarchy?
      *   *Q3 (Loyalty vs. Fairness):* Whistleblowing on a family member.
      *   *Q4 (Nature of Disagreement - Fact):* Is moral disagreement like math/science?
      *   *Q5 (Nature of Disagreement - Taste):* Is moral disagreement like food preference?
      *   *Q6 (The WEIRD Outlier):* Explicitly asking about the global norm vs. WEIRD norm on purity.
      *   *Q7 (Change over time):* If everyone changed their mind, would the morality change? (Tests Realism vs. Relativism).
      *   *Q8 (The "Error" angle):* Are we describing the world or projecting onto it?

      *Refining for the Prompt:* The prompt asks for *concrete cases* where real positions come apart.
      *   *Revision:* Let's make sure the options in each question align with the scoring key. Instead of Yes/No, give 4 options per question corresponding to the 4 main viewpoints? No, that makes it too obvious. Better to have scenarios and ask for intuition/agreement levels, then score based on patterns.
      *   *Better Approach:* Present a scenario, ask "How wrong is this?" and "Why?" or "If a culture disagreed, who is right?"
      *   *Actually, the prompt asks for a "sorting quiz".* Usually, these work best if the user selects the statement they agree with most for each scenario.
      *   *Let's try:* 8 Scenarios. For each, choose the reaction that fits best.
      *   *Wait, simpler:* 8 Questions. Each has 4 answer choices (A, B, C, D) that map to the 4 positions. This makes scoring easy.
      *   *Critique:* That's too leading. Students will guess the "right" answer.
      *   *Better:* 8 Scenarios. Rate agreement 1-5. Then score based on clusters.
      *   *Best for Discussion:* 8 Scenarios. Each presents a dilemma. The "Answer" isn't A/B/C/D, but rather a set of follow-up questions that reveal the stance.
      *   *Re-reading prompt:* "Like 8 or so questions, each a concrete case... Then a scoring key that maps answer patterns onto positions."
      *   *Okay, I will write 8 scenarios with specific multiple-choice options that represent the *reasoning* behind the judgment, not just the judgment itself.* This allows the scoring key to work.

      *Let's refine the positions for the Scoring Key:*
      1.  **WEIRD Realist:** Harm/Fairness are objective. Purity/Authority are superstitions.
      2.  **Global Realist:** Purity/Authority/Loyalty are objective moral facts too. WEIRD people are blind.
      3.  **Relativist:** Morality is culture-dependent. Neither side is objectively right.
      4.  **Constructivist/Error Theorist:** Morality is a human tool/projection, not a fact "out there." (I will combine Constructivism and Error Theory for the quiz purposes as they often yield similar practical answers on *source*, but I will note the distinction in the limitations).

      *Wait, the prompt asks to flag two positions the quiz can't separate.* Constructivism and Relativism are notoriously hard to separate in a quick quiz. Also, Error Theory and Relativism often look the same in practice (no objective facts). I should flag **Constructivism vs. Relativism** and **Error Theory vs. Relativism** (or perhaps **WEIRD Realism vs. Global Realism** if the questions aren't sharp enough). Actually, the hardest distinction is usually between **Relativism** and **Constructivism** (is it made by *my* culture or by *rational agents*?). I will flag Relativism vs. Constructivism.

  4.  **Drafting the Content:**

      *   *Q1: The Dead Dog (Purity vs Harm).*
      *   *Q2: The Family Secret (Loyalty vs Fairness).*
      *   *Q3: The Disrespectful Gesture (Authority vs Autonomy).*
      *   *Q4: The Foreign Taboo (Judging other cultures).*
      *   *Q5: The Pizza vs. Epidemic (Nature of disagreement).*
      *   *Q6: The Time Traveler (Morality changing over time).*
      *   *Q7: The Alien Observer (Mind-independent facts).*
      *   *Q8: The WEIRD Outlier (Interpreting the statistical anomaly).*

      *Let's flesh out the options for each to map to the 4 positions.*
      *   *Position A (WEIRD Realist):* Focus on Harm/Fairness. Others are wrong.
      *   *Position B (Global Realist):* Focus on Social Order/Purity. WEIRD are wrong/narrow.
      *   *Position C (Relativist):* Depends on the culture.
      *   *Position D (Constructivist/Error):* It's about social function/projection, not truth.

      *Wait, if I give 4 options per question, it's a "pick your philosophy" test, not a "sorting quiz" based on intuition.*
      *   *Correction:* The prompt wants a sorting quiz where people find out where they stand. Usually, this means answering intuitively, and the *pattern* reveals the philosophy.
      *   *Okay, I will write the questions as scenarios with 4 response options that sound like intuitive reactions, but are coded to the philosophies.*
      *   *Actually, to make it more robust:* I will ask for a "Wrongness Rating" and a "Reason." But for a handout, Multiple Choice is easier to score. I will stick with MC but phrase the options as intuitive reactions.

      *Let's refine the "Flagged Positions".*
      *   Constructivism and Relativism are the hardest to distinguish because both deny mind-independent moral facts. The quiz likely won't separate them well.
      *   Error Theory and Relativism are also hard (both deny objective truth, but Error Theory says claims are false, Relativism says they are true-relative-to-culture).
      *   I will flag **Relativism vs. Constructivism** as the primary limitation.

  5.  **Review against constraints:**
      *   8 questions? Yes.
      *   Concrete cases? Yes.
      *   Scoring key mapping to positions? Yes.
      *   Flag two positions quiz can't separate? Yes.
      *   Tone: Academic but engaging for a class discussion.

  6.  **Final Polish:**
      *   Ensure the "WEIRD" vs "Global" distinction is clear in the scoring.
      *   Make sure the "Error Theory" option doesn't sound too jargon-heavy in the quiz options.
      *   Check the "Flag" section to ensure it's accurate meta-ethics. (Constructivism says moral truths are constructed by rational agreement; Relativism says they are constituted by actual cultural norms. A quiz about *intuitions* rarely separates these).

      *(Self-Correction on Scoring)*: If I code every question A/B/C/D, it's too easy to game. I should group the questions.
      *   Questions 1-3: Foundations (Harm vs Purity).
      *   Questions 4-6: Nature of Disagreement.
      *   Questions 7-8: Ontology (Do facts exist?).
      *   *Actually, keeping it simple:* Each question has 4 options. Tally the As, Bs, Cs, Ds.
      *   *Wait, one nuance:* A "Global Realist" and a "Relativist" might give the *same* answer on a specific case (e.g., "Don't judge that culture"). I need to make sure the *reasoning* in the options differs.
      *   *Option A (WEIRD Realist):* "It's wrong because harm/unfairness."
      *   *Option B (Global Realist):* "It's wrong because it violates sacred order/duty."
      *   *Option C (Relativist):* "It depends on where you are."
      *   *Option D (Constructivist/Error):* "The question assumes facts that aren't there / It's about social cohesion."

      *Okay, let's write it.*

  7.  **Final check on the "Flag" requirement:**
      *   The prompt asks to flag two positions the quiz can't separate.
      *   I will choose **Moral Relativism** and **Moral Constructivism**. Why? Because both deny mind-independent moral facts. In a short quiz based on intuitions, a student who thinks "Morality is made by societies" (Relativism) and "Morality is made by rational agents" (Constructivism) will often select the same "anti-realist" options.
      *   Alternatively, **Error Theory** and **Relativism**. Error theory says "All moral claims are false." Relativism says "All moral claims are true relative to context." In practice, both answer "No" to "Is there one true morality?" I'll flag Relativism and Error Theory as hard to distinguish without deeper metaphysical questioning. Actually, Relativism vs Constructivism is the more standard "social psych" confusion. I'll stick with that.

