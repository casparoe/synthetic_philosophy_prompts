answer: |-
  Here is a complete discussion starter kit for your social psych class. It includes the 8-question sorting quiz, a scoring key, and instructor notes (including the required limitations flag).

  ### Part 1: The "Moral Compass" Sorting Quiz

  **Instructions:** Read each scenario and select the **one** response (A, B, C, or D) that best matches your immediate intuition. Do not overthink it; choose the statement that feels most *true* to you, not the one that sounds smartest.

  **1. The Flag Toilet (Purity vs. Harm)**
  A man buys a new national flag. He never displays it publicly. Instead, he uses it to dry himself off after showering and then uses it to wipe the toilet seat before sitting down. No one sees him do this.
  *   **A.** This is perfectly fine. Objects are just objects; if no one is harmed or treated unfairly, no moral rule is broken.
  *   **B.** This is deeply wrong. It degrades a sacred symbol and violates a duty of respect, regardless of whether anyone gets hurt.
  *   **C.** It depends. In some cultures, this is a serious offense; in others, it's meaningless. There is no universal fact about whether it's wrong.
  *   **D.** "Wrong" is the wrong word here. This action violates a social convention we constructed to maintain group cohesion, but it isn't a fact about the universe.

  **2. The Family Whistleblower (Loyalty vs. Fairness)**
  You discover your brother stole a small amount of money from a stranger. The stranger is wealthy and won't miss it. Your brother needs the money to feed his children. You are the only one who knows.
  *   **A.** You must report him or return the money. Stealing is unfair and violates the stranger's rights, regardless of family ties.
  *   **B.** You should stay silent. Loyalty to family is a higher moral obligation than abstract fairness toward a stranger.
  *   **C.** Whether you should report him depends on the laws and norms of the society you live in. Neither choice is objectively better.
  *   **D.** The dilemma itself is a product of conflicting social systems. Morality is a framework we use to negotiate these conflicts, not a rulebook that solves them.

  **3. The Disrespectful Gesture (Authority vs. Autonomy)**
  In a traditional society, a young person looks an elder in the eye while speaking. The elder is offended and punishes the youth. The youth feels they did nothing wrong.
  *   **A.** The elder is wrong. Hierarchy shouldn't override individual autonomy. The youth has a right to speak freely.
  *   **B.** The youth is wrong. Social order relies on respecting authority and tradition. Disrespect destabilizes the community.
  *   **C.** Neither is objectively wrong. The "right" behavior is defined by the specific culture they are in.
  *   **D.** Both are operating within different constructed systems of norms. There is no "view from nowhere" to judge who is actually right.

  **4. The Pineapple vs. The Epidemic (Nature of Disagreement)**
  Two cultures disagree on whether a specific action is evil. One says it is harmless; the other says it is an abomination.
  *   **A.** One side is mistaken, just like if one side said 2+2=5. We need to find the objective moral truth.
  *   **B.** Both sides might be seeing different parts of the moral truth. The "abomination" culture sees duties the "harmless" culture ignores.
  *   **C.** They are like two people arguing whether pineapple belongs on pizza. It's a matter of taste/culture, not truth.
  *   **D.** They are disagreeing about which social tools work best for their environment. It's not about truth, but function.

  **5. The WEIRD Outlier (Interpreting the Data)**
  Psychologists find that Westerners focus almost exclusively on Harm and Fairness, while most of the world includes Loyalty, Authority, and Purity.
  *   **A.** The West has evolved past superstition. The rest of the world is still confused by irrelevant cultural baggage.
  *   **B.** The West is morally "colorblind." We have lost touch with vital moral dimensions that hold societies together.
  *   **C.** This just proves morality is cultural. The West has one culture; the rest of the world has others.
  *   **D.** This shows morality is a psychological adaptation. Different environments trigger different moral "matrices."

  **6. The Time Traveler (Morality Over Time)**
  If, over the next 500 years, all humans came to agree that eating meat is morally equivalent to murder, would that *make* it true?
  *   **A.** No. If it's wrong, it's wrong now, even if everyone disagrees. Consensus doesn't create truth.
  *   **B.** No. If it's part of the natural order/duty, consensus doesn't change it. But we might be realizing a truth we missed.
  *   **C.** Yes. If all cultures agree, then it becomes morally true. Morality is defined by human agreement.
  *   **D.** Yes, but only in the sense that we would have constructed a new social reality. It wouldn't be "true" in a scientific sense.

  **7. The Alien Observer (Mind-Independence)**
  An alien lands on Earth. It has no emotions, no culture, and no society. It observes a murder. Does the alien have the capacity to recognize the act as "wrong"?
  *   **A.** Yes. If it is rational, it can detect the violation of rights/harm, which are objective facts.
  *   **B.** Yes, if it understands social organisms. It can see the violation of natural duties and order.
  *   **C.** No. Without culture or feelings, "wrongness" does not exist for the alien. It only sees physical movement.
  *   **D.** No. "Wrongness" is a projection humans put onto the world. The alien sees the raw data without the projection.

  **8. The Ultimate Disagreement (Resolution)**
  Two people fundamentally disagree on a moral issue (e.g., abortion, euthanasia). They are both rational and informed.
  *   **A.** One of them is making a reasoning error. There is a correct answer we haven't found yet.
  *   **B.** They are weighing different objective values (e.g., sanctity vs. liberty). One may still be more correct, but both see real values.
  *   **C.** There is no fact of the matter to be found. They simply have different moral tastes.
  *   **D.** They are negotiating a shared social world. The goal isn't "truth" but a workable agreement.

  ***

  ### Part 2: Scoring Key

  Tally up how many As, Bs, Cs, and Ds you selected. Your dominant letter indicates your leaning.

  **Mostly As: The WEIRD Realist (Universalist)**
  *   **View:** Morality is objective, but the *WEIRD* foundation (Harm/Care and Fairness/Justice) is the correct one.
  *   **Takeaway:** You believe other cultures are often mistaken when they prioritize purity or authority over individual rights. You see moral progress as moving toward WEIRD norms.
  *   **Meta-Ethics:** Moral Realism (Narrow).

  **Mostly Bs: The Global Realist (Pluralist)**
  *   **View:** Morality is objective, but the *WEIRD* lens is too narrow. Purity, Loyalty, and Authority are real moral dimensions, not just superstitions.
  *   **Takeaway:** You believe Westerners are the outliers, suffering from a kind of moral blindness. You think a "good" society needs all five foundations, not just two.
  *   **Meta-Ethics:** Moral Realism (Pluralist).

  **Mostly Cs: The Moral Relativist**
  *   **View:** Morality is not objective. It is constituted by cultural norms.
  *   **Takeaway:** You believe "right" just means "right for us." Cross-cultural judgment is impossible because there is no external standard to measure against.
  *   **Meta-Ethics:** Moral Relativism.

  **Mostly Ds: The Constructivist / Error Theorist**
  *   **View:** Moral claims aren't descriptions of the world (like science); they are tools, projections, or social technologies.
  *   **Takeaway:** You focus on *what morality does* (binds groups, solves coordination problems) rather than *what morality is*. You might think moral facts don't exist (Error Theory) or that they are built by rational agents (Constructivism).
  *   **Meta-Ethics:** Anti-Realism (Constructivism or Error Theory).

  ***

  ### Part 3: Instructor Notes & Discussion Guide

  **How to Run This:**
  1.  **Hand out the quiz.** Give students 5 minutes to complete it silently.
  2.  **Show of Hands.** Ask for a show of hands for each letter (A, B, C, D). In a typical Western university class, you will likely see a heavy skew toward **A** (WEIRD Realism) and **C** (Relativism), with very few **B** (Global Realist).
  3.  **The Hook:** Point out the irony. If most of the class chose **A**, they just proved the WEIRD psychology thesis: they intuitively reduced morality to Harm/Fairness (A options) and viewed Purity/Authority (B options) as irrelevant or superstitious.
  4.  **The Discussion:** Use the "Global Realist" (B) results to challenge the "Relativist" (C) results. Often, students say "Who are we to judge?" (Relativism) but then get angry about Harm (Realism). Ask them: *Is your outrage at harm objective, or just a Western preference?*

  **⚠️ Crucial Limitations (Flag this for the class):**
  Be careful not to oversell what this quiz measures. Specifically, this quiz **cannot reliably separate** the following two pairs of positions:

  1.  **Moral Relativism (C) vs. Moral Constructivism (D):**
      *   *Why:* Both positions deny mind-independent moral facts. In a short quiz, a student who believes "Morality is made by *my specific culture*" (Relativism) and a student who believes "Morality is made by *rational agreement*" (Constructivism) will often select the same "anti-realist" answers. Distinguishing them requires asking *who* is doing the constructing (actual societies vs. idealized rational agents).
  2.  **Error Theory (D) vs. Relativism (C):**
      *   *Why:* An Error Theorist says "All moral claims are false." A Relativist says "All moral claims are true relative to a culture." In practice, both answer "No" to questions like "Would an alien see wrongness?" (Question 7). To separate them, you would need to ask: "Is the statement 'Murder is wrong' *false*, or is it *incomplete* without a cultural context?" This quiz is too blunt for that distinction.

  **Discussion Prompt for the "B" (Global Realist) Minority:**
  If you have any students who scored mostly Bs, put them on the hot seat (gently). Ask the As and Cs: *If the B student says your focus on 'Harm' is actually a form of moral blindness similar to colorblindness, how would you prove them wrong without just asserting your own intuition?* This forces the class to confront the lack of neutral ground in moral argumentation.
