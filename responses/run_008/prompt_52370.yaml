prompt: |-
  For my social psych class I have to lead a discussion on the WEIRD psychology stuff (how people from Western, Educated, Industrialized, Rich, Democratic societies are actually global outliers — most cultures weight purity, loyalty and authority way more in their moral judgments, while WEIRD folks basically reduce morality to harm and fairness) and what that means for whether morality is objective at all. I want to open the session with a sorting quiz so people find out where they actually stand instead of just saying "obviously morals are relative" or whatever. Can you write the quiz? Like 8 or so questions, each a concrete case where the real positions genuinely come apart, not just "do you believe in moral relativism" — for example a culture where causing small harm to strangers is basically fine but eating certain foods is treated as seriously as we treat assault, or asking whether disagreement about wrongness is more like disagreement about whether pineapple belongs on pizza or more like disagreement about how many people died in some historical epidemic. Then a scoring key that maps answer patterns onto positions: moral realism where the cross-cultural disagreement is noise and one side is just wrong, moral realism where the WEIRD harm-and-fairness reduction is itself the biased move, relativism, constructivism, and like an error-theory-ish option if that fits. Also flag any two positions my quiz can't actually seperate so I dont oversell it when leading the discussion.
reasoning: |-
  Here's a thinking process that leads to the suggested quiz and discussion guide:

  1.  **Analyze the Request:**
