answer: |-
  Your struggle is not a failure of logic, but a reflection of a genuine tension in biology. You are attempting to force a binary category ('alive' vs. 'not alive') onto a phenomenon that is arguably a continuum. However, your intuitions are remarkably consistent. They do not track mere chemistry, nor mere replication. They track **agency within a historical continuum**.

  You are distinguishing between *living matter* (which can metabolise or replicate) and *a living being* (which possesses a specific kind of organised autonomy). Your sister, the microbiologist, may be working with a definition suited to identifying biological *processes*, whereas you are intuiting a definition suited to identifying biological *individuals*.

  Here is a principle that captures the architecture of your verdicts, followed by the necessary sacrifice.

  ### The Principle of Integrated Evolutionary Agency

  An entity is alive if and only if it satisfies three conditions:

  1.  **Systemic Integration:** It functions as a cohesive whole, maintaining a boundary between itself and its environment, rather than functioning merely as a component of a larger whole.
  2.  **Metabolic Potential:** It possesses the internal machinery to sustain or resume metabolic processes, even if currently dormant.
  3.  **Lineage Capacity:** It belongs to (or is capable of initiating) a lineage capable of open-ended Darwinian evolution.

  Let us tie these clauses to your specific verdicts.

  **1. Systemic Integration**
  *   **The Verdicts:** This explains why the **mature red blood cell** is not alive (it is a component, lacking a nucleus and autonomy, serving the organism) while the **HeLa cell** is (it has escaped the organism, re-established its own boundary and autonomy in the dish). It explains why the **brain-dead body** is dead: although the cells metabolise, the *systemic integration* that made the body a single 'self' has irretrievably collapsed. The ventilator maintains the parts, but the agent is gone.
  *   **The Exclusion:** This excludes the **computer worm** and **cellular automaton**. They lack a physical boundary and metabolic substrate; they are patterns, not integrated material systems.

  **2. Metabolic Potential**
  *   **The Verdicts:** This saves the **dried seed** and the **cryptobiotic tardigrade**. They are not currently metabolising, but the machinery for metabolism is intact and internal. It excludes the **influenza virion**. A virus on a bench has no metabolism; crucially, it lacks the *internal machinery* to start one. It must hijack a host's machinery. It is a instruction set without an engine.
  *   **The Exclusion:** This excludes the **prion**. It is merely a protein folding pattern that induces other proteins to fold; there is no metabolic engine, potential or otherwise.

  **3. Lineage Capacity**
  *   **The Verdicts:** This saves the **worker bee** and the **mule**. They are sterile, yes, but they are functional vehicles of a lineage that *is* reproductive. Their biological purpose is tied to the continuity of their species' genome.
  *   **The Exclusion:** This is the hammer for the **synthetic vesicle**. You noted it stops when the feedstock runs out and relies on enzymes supplied by designers. It lacks the *capacity* for open-ended evolution because it cannot synthesise its own machinery from raw materials, nor does it possess a history of selection. It is a model of life, not life itself.

  ### Predictions for Unlisted Cases

  If we adopt this principle, here is how you must rule on the cases you haven't listed:

  *   **A Slime Mould:** **Alive.** Even when it exists as a multicellular slug, it acts as a single integrated agent. When it is a swarm of single cells, they are individually alive. The principle handles this shift in integration levels.
  *   **A Coral Colony:** **Alive (as a holobiont).** While composed of many polyps, the colony functions as an integrated physiological unit with a shared lineage capacity. You may treat the individual polyps as alive too, similar to cells in a body, but the colony itself qualifies as a living individual.
  *   **A Frozen Embryo:** **Alive.** It satisfies Metabolic Potential (dormant) and Lineage Capacity. It is not merely tissue; it is a nascent organism.
  *   **Alien Self-Replicator:** **Alive, *if*...** If you found a crystal on Mars that grew by accreting silicon, it would fail *Lineage Capacity* (no variation/selection). If you found a silicon-based vesicle that mined its own energy and evolved over generations, it would be alive. Chemistry is irrelevant; organisation is key.

  ### The Necessary Sacrifice

  You asked which verdict you ought to surrender if a simpler principle demands it. To maintain the coherence of the *Principle of Integrated Evolutionary Agency*, you must surrender your hesitation regarding the **Synthetic Vesicle**.

  **You must rule it: Not Alive.**

  **Why?**
  Your hesitation likely stems from the fact that it *does* something lifelike (replication). However, compare it to the **influenza virion**. The virus replicates inside a cell using the cell's enzymes. The vesicle replicates in the lab using the designers' enzymes. There is no functional difference in terms of autonomy. Both are parasites on a pre-existing living system (one biological, one intellectual/industrial).

  If you call the vesicle alive, you undermine your refusal to call the virus alive. Both rely on external machinery to replicate. The only difference is that the virus has a natural history and the vesicle does not. But since you already exclude the virus based on its lack of metabolic autonomy, consistency demands you exclude the vesicle for the same reason. It is a sophisticated puppet, not an agent.

  ### The Alternative: The Cluster Concept

  If you find yourself unable to condemn the vesicle—if you feel that *function* matters more than *history*—then you must accept a harder truth: **'Alive' is not a natural kind.**

  In this view, your verdicts are not tracking a single metaphysical property. They are tracking a **cluster of interests**.
  *   When you look at the **mule**, you care about *biology and welfare*.
  *   When you look at the **virus**, you care about *pathology and origin*.
  *   When you look at the **RBC**, you care about *mereology* (parts vs. wholes).
  *   When you look at the **vesicle**, you care about *engineering and definition*.

  Your intuitions feel non-arbitrary because they track **causal power**. You call something alive when it has the power to persist, resist entropy, and impose its form on the world *on its own terms*. The vesicle fails this because its persistence is borrowed from the lab. The virus fails because its persistence is borrowed from the host. The RBC fails because its persistence is borrowed from the organism.

  ### Conclusion for Your Argument

  Tell your sister this: You are not arguing about chemistry; you are arguing about **individuation**.

  Adopt the **Principle of Integrated Evolutionary Agency**. It respects your gut verdicts on the bee, the seed, and the brain-dead body. It provides a rigorous reason to exclude the virus and the prion. And it gives you the courage to tell the synthetic vesicle that it is a marvel of engineering, but it is not yet a living thing.

  If she presses you on the **HeLa cell**, concede that it is the exception that proves the rule: it is alive *because* it ceased to be a part and became a rogue lineage. It is "worryingly" alive precisely because it has stolen the autonomy of an organism for itself.

  In British terms, you are looking for the difference between a citizen and a subject. The bee, the mule, and the seed are citizens of the biosphere. The virus and the vesicle are merely subjects, dependent on the machinery of others to exist.
