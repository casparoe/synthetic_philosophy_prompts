      *   *Assessment:* It risks unfalsifiability. If the definition of "machine" keeps shifting to exclude whatever humans do, it's a "No True Scotsman" fallacy regarding mechanism.
      *   *Legitimacy:* It is legitimate if the point is about *epistemic access* rather than ontological difference.

