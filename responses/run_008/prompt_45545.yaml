          *   *Ranking:* Awkward, but anti-mechanists can say "it's still just a system."

      *   *Category 4: The Retreat Pattern (Unfalsifiability)*
          *   **The Shift:** From "We see $G$" to "We are not a *knowably sound* machine."
          *   **Chalmers' Dilemma:** Either we are sound (but can't know it) or unsound.
          *   **Unfalsifiability:** If the claim is "No *specifiable* machine captures us," it becomes hard to test.
          *   **Is it fatal?** In philosophy of mind, unfalsifiability is a vice, but some argue mental content isn't empirical. However, if it makes no predictions, it's weak.

  4.  **Addressing the "Retreat Pattern" specifically:**

      *   This is the core philosophical tension.
      *   Lucas started strong ("We can see it").
      *   Objections came ("How do you know you're consistent?").
      *   Retreat ("We are not a *knowably* consistent machine").
