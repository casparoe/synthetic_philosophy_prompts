answer: |-
  ### The idea in one paragraph

  The core idea is to treat "collapse" not as a description of suffering or change, but as a specific claim about the termination of a system's ability to reproduce itself. Your "obituary test" is sound in principle but too vague for a junior analyst; this procedure operationalizes it by forcing the analyst to identify exactly *what* is dying (a regime, a population, or a culture) and verify whether the standard historical story supports a discontinuity in that specific thing. It shifts the burden from proving "everything ended" to proving "the specific thing we are analogizing ended," while flagging cases where the label does more political work than analytical work.

  ### The procedure

  **Step 1: Identify the Object of Collapse**
  Read the sentence containing the word "collapse." Underline the noun it applies to. Is it a *population* (people died), a *polity* (the government stopped working), or a *culture* (people stopped believing/acting like themselves)?
  *   **Sufficient Answer:** The analyst must be able to circle one specific noun.
  *   **Rewrite Trigger:** If the sentence says "societal collapse" without defining what society means here, or if it implies all three (people, government, culture) ended simultaneously, mark for rewrite. Demand specificity.
  *   **Handoff Trigger:** If the object is "way of life" or "civilization," hand off to senior editor. These are value-laden terms that require philosophical agreement, not just fact-checking.

  **Step 2: The "Lights Out" Check (Functional Continuity)**
  Consult the standard textbook story for the historical case cited. Did the core functions of the Object identified in Step 1 cease?
  *   *For Polity:* Did tax collection, monument building, or law enforcement stop for more than one generation?
  *   *For Population:* Did the number of people drop by more than 50% in a century?
  *   *For Culture:* Did the primary language, religion, or identity vanish?
  *   **Sufficient Answer:** A clear "Yes" or "No" based on the standard narrative (e.g., "Standard story says coinage stopped").
  *   **Rewrite Trigger:** If the answer is "No" (e.g., the government changed names but kept taxing), the word "collapse" is factually incorrect. Rewrite to "transition" or "reform."
  *   **Handoff Trigger:** If the answer is "Mixed" (e.g., elites vanished but peasants stayed), hand off to senior editor. This is where the "whose obituary?" problem lives.

  **Step 3: The Survivor Test (Temporal Continuity)**
  Imagine a person from immediately before the event and a person from immediately after. If they met, would the second person say, "Your world is gone," or "Your world has changed"?
  *   **Sufficient Answer:** The analyst must draft one sentence describing the survivor's perspective based on the standard story.
  *   **Rewrite Trigger:** If the survivor would say "We are still here, just ruled by different people," the word "collapse" is likely hyperbolic. Rewrite to "regime change" or "instability."
  *   **Handoff Trigger:** If the survivor would say "The gods are dead" or "The King is dead" but "We are still farming," hand off to senior editor. This is a judgment call on whether political death counts as societal death for your brief's purpose.

  **Step 4: The Foresight Utility Check**
  Ask: Does calling this "collapse" warn the policy client about a risk they need to manage, or does it just sound dramatic?
  *   **Sufficient Answer:** A brief justification linking the historical outcome to a current policy risk (e.g., "Loss of central tax capacity").
  *   **Rewrite Trigger:** If the justification is "it sounds serious," rewrite to remove the analogy entirely.
  *   **Handoff Trigger:** If the analogy implies a moral judgment (e.g., "they collapsed because they were wasteful"), hand off to senior editor. This is values, not facts.

  **Step 5: Final Verification**
  If the draft has passed Steps 1–4 without a "Rewrite" or "Handoff," the use of "collapse" is licensed.
  *   **Note on Judgment:** Step 2 and Step 3 look like fact-checking, but they are judgment dressed as process. Deciding whether a 50% population drop is "collapse" or "tragedy" is a choice. The procedure hides this choice behind the "standard story" constraint to save time, but the analyst must know they are relying on consensus, not absolute truth.

  ### Three worked cases

  **Case 1: The Maya Lowlands (Terminal Classic)**
  *   **Step 1 (Object):** The brief says "Maya Collapse." The analyst identifies the object as the *Polity* (the system of divine kings and city-states), not the *People* (Maya speakers still exist).
  *   **Step 2 (Lights Out):** Standard story says royal monuments stopped being dated, major cities were abandoned, and long-distance trade networks fractured. Core political functions ceased. Answer: Yes.
  *   **Step 3 (Survivor):** A peasant farmer in 900 CE looks back at 800 CE. The King is gone, the temples are silent, but the farmer is still farming. However, the political world they lived under is gone.
  *   **Step 4 (Utility):** The brief is about state fragility and the risk of central administration failing while populations remain.
  *   **Verdict:** **Valid Use.** This contradicts your instinct. While archaeologists rightly argue the *culture* transformed, the procedure validates "collapse" because the *political system* (the object of the brief) did terminate. For a government unit worried about institutional failure, "Maya Collapse" is an accurate analogy for state failure, even if the people survived. The procedure forces you to accept the word if you define the object narrowly enough.

  **Case 2: Roman Britain (Early 5th Century)**
  *   **Step 1 (Object):** The brief says "Collapse of Roman Britain." Object is the *Polity* (Imperial Administration).
  *   **Step 2 (Lights Out):** Standard story says legions withdrew, coinage stopped arriving, and imperial tax collection ended. Answer: Yes.
  *   **Step 3 (Survivor):** A villa owner in 450 CE looks back at 400 CE. The law is different, the money is useless, the security guarantee is gone. They would report a discontinuity in their operating system.
  *   **Step 4 (Utility):** The brief is about dependency on external security guarantees.
  *   **Verdict:** **Valid Use.** The administrative system ended definitively. Even though people stayed and Christianity survived, the "Roman" part of "Roman Britain" collapsed. No handoff needed.

  **Case 3: Easter Island / Rapa Nui (Post-European Contact)**
  *   **Step 1 (Object):** The brief says "Social Collapse after Contact." Object is *Population and Social Structure*.
  *   **Step 2 (Lights Out):** Standard story says disease and slaving raids reduced population drastically (by some accounts over 90%) and traditional clan structures broke down. Answer: Yes.
  *   **Step 3 (Survivor):** A survivor in 1870 looks back at 1770. Their family lines are extinguished, their leaders are gone, their numbers are too low to maintain old traditions. They would report an ending.
  *   **Step 4 (Utility):** The brief is about vulnerability to external shocks.
  *   **Verdict:** **Valid Use.** This is a demographic and structural collapse. However, if the brief implies the islanders caused this themselves (the "ecocide" story) rather than external contact, Step 4 triggers a **Handoff**. The analyst must ensure the cause attributed matches the standard story (external shock vs. internal mismanagement), as this carries moral weight.

  ### Where a human has to decide

  1.  **The Elite Bias:** Step 3 asks what a "survivor" would say. In almost all historical cases, elites experience collapse while commoners experience hardship. The junior analyst cannot solve this; the senior editor must decide if the brief cares about the state (elite) or the people (commoner).
  2.  **The Threshold of Pain:** Step 2 asks for a "50% drop" or "cessation of function." These are arbitrary lines. Deciding whether a 40% drop is a "crisis" or a "collapse" is a policy choice, not a historical fact.
  3.  **Moral Causality:** Step 4 flags moral judgments, but cannot prevent them entirely. Calling something a "collapse" often implies the society failed morally. A human must check if the brief is blaming the victim.

  ### What this procedure can't do

  This procedure cannot settle historical debates, nor can it protect you from experts who disagree with the "standard story." It is a consistency check, not a truth machine. If the textbooks are wrong (as they often are about the Maya or Easter Island), this procedure will simply certify a popular misconception as "process-compliant." It also cannot prevent the word "collapse" from doing emotional work; even when used correctly, it triggers fear rather than thought. Finally, it cannot resolve the ethical question of whether a government foresight unit should be using historical tragedies as analogies for policy risk in the first place; it only ensures that if you do, you are precise about what broke.
