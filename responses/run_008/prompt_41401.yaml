answer: |-
  # PREP SHEET: Sidgwick, The SPR, and the Dualism of Practical Reason
  **Venue:** Joint Departmental Colloquium
  **Audience:** 50% Analytic Metaethicists, 2 Historians of Victorian Science, 1 Grumpy Kantian.
  **Thesis:** Sidgwick's SPR work was *The Methods of Ethics* continued by empirical means to resolve the Dualism of Practical Reason.

  ---

  ## I. CONCESSIONS (Say these in the first 5 minutes)
  *Disarm the room by admitting the obvious weaknesses before they weaponize them.*

  1.  **To the Historians:** "Eleanor Sidgwick was not an assistant; she was a co-investigator. The administrative and experimental labor was disproportionately hers. I am discussing Henry's *philosophical motivation*, not claiming he did the heavy lifting alone."
  2.  **To the Metaethicists:** "The SPR did not *solve* the Dualism. The data was inconclusive. My claim is not that the project succeeded, but that its *purpose* was philosophical coherence, not leisure."
  3.  **To Everyone:** "Sidgwick was not a naive believer. He was a skeptical investigator who *hoped* for a specific outcome. That tension is the engine of the talk."

  ---

  ## II. OBJECTIONS & REPLIES (Ordered by Damage Potential)

  ### 1. The Metaethicist "Autonomy" Objection
  **The Objection:** "You're committing a genetic fallacy. *The Methods of Ethics* is a conceptual analysis of moral reasoning. Whether Sidgwick sat with Leonora Piper is biographical color. The argument stands or falls on its logical merits, not on whether the author was trying to patch a hole with ghost hunting. You're conflating the *context of discovery* with the *context of justification*."
  **Damage:** **Critical.** If this sticks, your talk is just biography, not philosophy.
  **The 2-Minute Reply:**
  "I agree that the truth of the Dualism doesn't depend on Sidgwick's hobbies. But I'm not arguing the *truth* of the *Methods* depends on the SPR. I'm arguing about the *architecture of Sidgwick's rationality*. The Dualism presents a logical stalemate: Rational Egoism and Rational Utilitarianism are both self-evident but incompatible. Sidgwick explicitly states that without a cosmic sanction (divine justice/afterlife), morality is irrational. The SPR wasn't 'ghost hunting'; it was an attempt to empirically verify the premise required to make his normative system coherent. It's not biography; it's the empirical wing of his rationalist project."
  **Where the Reply is Soft:**
  If they press that empirical data *cannot* resolve a normative conflict (Is/Ought gap), you have to concede Sidgwick *thought* it could, which makes Sidgwick look confused, not brilliant.
  **Backup:** "Sidgwick believed moral rationality required prudential rationality. If the universe doesn't support the convergence of duty and self-interest, reason is divided against itself. He wasn't deriving 'ought' from 'is'; he was checking if the universe was hospitable to 'ought'."

  ### 2. The Metaethicist "Supervenience" Objection
  **The Objection:** "Even if consciousness survives death, how does that normatively bind me to Utilitarianism? Maybe the afterlife rewards Egoists. You're assuming the 'cosmic order' Sidgwick hoped for is Utilitarian. That's a wish, not an argument."
  **Damage:** **High.** Undermines the mechanism of the solution.
  **The 2-Minute Reply:**
  "Fair. Sidgwick doesn't prove the afterlife is Utilitarian. But he argues that without *any* post-mortem sanction, the sacrifice of self-interest for the greater good is rationally unsustainable. He isn't looking for a specific Utilitarian reward; he's looking for *any* evidence that the universe isn't hostile to moral sacrifice. If consciousness survives, the 'hole' is patchable. If it doesn't, the system collapses. The SPR was a test for the *possibility* of coherence, not the specific content of the reward."
  **Where the Reply is Soft:**
  It admits Sidgwick's solution is theological/metaphysical, which analytic metaethicists hate.
  **Backup:** "Sidgwick admits this. He calls it the 'need for theology.' I'm just showing he tried to test the theology scientifically."

  ### 3. The Historian "Labor & Fraud" Objection
  **The Objection:** "You're sanitizing the SPR. The field was riddled with fraud (e.g., the Creery sisters, slate-writing). Sidgwick knew this. Also, you're centering Henry when Eleanor Sidgwick and the mediums did the actual work. Isn't calling this 'applied philosophy' just a way to valorize the male philosopher's 'intellect' over the women's 'labor'?"
  **Damage:** **Medium-High.** Makes you look naive about Victorian science and gender.
  **The 2-Minute Reply:**
  "I'm not sanitizing the fraud; the fraud is *why* the standards were so strict. Sidgwick's philosophical demand for certainty drove the SPR's methodological rigor. Regarding labor: You're right that Eleanor was the operational genius. But the *philosophical imperative* came from Henry's crisis in the *Methods*. They were partners, but the 'hole in the system' was his philosophical burden. I'm tracing the motivation for the institution, not assigning credit for the minutes."
  **Where the Reply is Soft:**
  Historians hate "Great Man" theory. If you lean too hard on Henry's motivation, you erase Eleanor's agency.
  **Backup:** "Eleanor shared the philosophical commitment. She wasn't just running the lights; she was analyzing the Census of Hallucinations. But the *Dualism* is Henry's text."

  ### 4. The Grumpy Kantian "Heteronomy" Objection
  **The Objection:** "This is precisely why history of philosophy is a waste. Sidgwick is trying to ground morality in empirical consequences (even post-mortem ones). That is heteronomy. It destroys the moral worth of the action. If you need a ghost to tell you to be good, you aren't moral. Sidgwick failed because he refused to understand the Categorical Imperative."
  **Damage:** **Low/Medium.** You don't need to convince the Kantian, just neutralize them.
  **The 2-Minute Reply:**
  "Sidgwick isn't a Kantian, and he'd agree with you that duty shouldn't depend on empirical rewards. But his problem is *rationality*, not just duty. He argues that if Reason commands two contradictory ends (Self-interest vs. Universal Good), Reason is flawed. He isn't trying to make us moral; he's trying to save Reason from contradiction. The SPR was an attempt to save Rationality, not to bribe agents."
  **Where the Reply is Soft:**
  The Kantian will say "Reason doesn't need saving from empirical reality."
  **Backup:** Smile and say, "That is exactly the disagreement between the Intuitionists and the Critical Idealists. I'm mapping Sidgwick's consistency, not defending his metaphysics."

  ---

  ## III. THE SCARY QUESTION (The Motive/Standards Dilemma)
  **The Question:** "Sidgwick *needed* the SPR to find evidence to save his ethical system. He also demanded stricter evidence than anyone else. By his own standards, the SPR found nothing. So: Either the standards were right and the project was a waste of time, or the standards were a performance to mask his bias. Which is it? Was he sincere or self-deceived?"

  **Why it scares you:** Because if he was self-deceived, your thesis becomes "Sidgwick built a research program on a wish." If it was a waste, your thesis becomes "Sidgwick wasted 20 years."

  **Your Strategy:** **Do not choose.** Reframe the tension as the *point*.
  **The Script:**
  "That is the tragedy of Sidgwick's position, and I don't want to resolve it neatly.
  1.  **On Bias:** Yes, he had a motive. But his response to that motive wasn't to lower standards; it was to *raise* them. He rejected evidence he *wanted* to be true because it didn't meet his criteria. That suggests the standards weren't a performance; they were a defense *against* his own hope.
  2.  **On Futility:** Was it a waste? Philosophically, no. It demonstrated the *limits* of empiricism in resolving normative crises.
  3.  **The Synthesis:** The strictness proves the sincerity, even if the motive suggests bias. He was willing to let his ethical system collapse rather than accept bad data. That makes the SPR not a failure of philosophy, but the ultimate act of philosophical integrity. He preferred a broken system to a lie."

  **If they push harder:** "I'm arguing that the *attempt* is the continuation of the *Methods*. The failure of the SPR is the empirical confirmation of the Dualism's intractability. He proved, negatively, that the hole cannot be patched empirically."

  ---

  ## IV. TACTICAL NOTES

  *   **Watch the Metaethicists' Eyes:** If they start checking phones during the biography sections, pivot back to the *structure of the Dualism*. Remind them: "This isn't about seances; it's about the conditions for the possibility of rational ethics."
  *   **Feed the Historians:** Use the phrase "epistemic virtue." They love that. Acknowledge that the "Census of Hallucinations" was a data-gathering exercise that prefigured modern psychology, even if the goal was metaphysical.
  *   **The Kantian:** Do not make eye contact when discussing the "good will." Treat them as a boundary marker. "As a Kantian would rightly point out..." (Then move on).
  *   **Key Phrase to Repeat:** "Empirical verification of a metaphysical premise." This signals to the metaethicists that you know the category distinction, even if you're blurring it for Sidgwick.

  ## V. EMERGENCY EXIT
  If the room turns hostile on the "waste of time" angle:
  "Sidgwick himself said, 'I do not see how I can hope to be understood.' My goal today is simply to show that his 'eccentricity' was actually his most consistent move. If we think psychical research is nonsense, we must admit Sidgwick's ethics leads to nonsense. I'm asking you to take his ethics seriously enough to see why he *had* to do this."
