      *   **The "Rescue Operation" Risk:** When does "right but early" become moving the goalposts to save a dead theory?
      *   **Test Cases:** Ehrlich-Simon Wager, Demographic Transition.
      *   **Moral Weight:** The character's Malthusianism is an alibi for coldness toward the poor (linking back to Malthus's Poor Laws stance).
      *   **Constraint 1 (Crucial):** Do *not* end on a "truth is in the middle" note. Need a verdict for the novel's ending.
      *   **Constraint 2 (Crucial):** Honestly flag where the reasoning might fail (what fact/argument would flip the conclusion).
