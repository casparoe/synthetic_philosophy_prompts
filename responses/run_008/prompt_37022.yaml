answer: |-
  This is a sharp set of objections that cuts to the core of the free will debate. You have identified the two strongest lines of attack against compatibilism: the **Regress Objection** (you didn't choose your desires) and the **Stipulation Objection** (who gets to define "worth wanting"?).

  To answer your question directly: **These objections do not necessarily "go wrong" logically.** Rather, they highlight the fundamental stalemate between two different projects. The compatibilist and the hard determinist/libertarian are often answering different questions using the same words.

  Here is an analysis of where the debate stands, distinguishing between what is argued and what is (rarely) settled.

  ### 1. The Regress Objection: "You didn't choose your desires"
  **Your Argument:** If my desires are caused by genes/upbringing I didn't choose, acting on them isn't true freedom. Compatibilism just moves the goalposts.
  **Status:** **Genuinely Contested.** This is not settled.

  **Where the Compatibilist (Dennett) stands:**
  Dennett agrees with you that you did not choose your genes or upbringing. He does not try to solve this. Instead, he argues that the demand for "ultimate origination" (being the *uncaused cause* of your own desires) is incoherent.
  *   **The Argument:** To be responsible for your desires, you would need to have chosen them. But to choose them, you would need prior desires to guide that choice. To be responsible for *those*, you would need prior-prior desires. This leads to an infinite regress. Since no one can be an *uncaused cause*, "ultimate responsibility" is an impossible standard.
  *   **The Move:** Dennett argues we should stop looking for *metaphysical* freedom (freedom from causality) and look for *pragmatic* freedom (freedom from coercion, compulsion, and ignorance). For Dennett, "free will" is a capacity of a complex system to model the world and adjust behavior. A thermostat has a tiny bit of this; a human has a lot.
  *   **Is it a dodge?** To a compatibilist, no. It is a *dissolution* of a confused concept. They argue you are asking for magic, not agency.

  **Where the Hard Determinist/Incompatibilist stands:**
  Philosophers like Galen Strawson (with his "Basic Argument") agree with your assessment entirely.
  *   **The Argument:** You do what you do because of the way you are. To be truly responsible for what you do, you must be truly responsible for the way you are. But you cannot be responsible for the way you are (genes/upbringing). Therefore, you cannot be truly responsible for what you do.
  *   **The Counter:** They argue Dennett *is* dodging. By redefining free will as "acting on desires" rather than "choosing desires," he has changed the subject. He has explained how we are *voluntary*, but not how we are *responsible* in the deep moral sense.

  **Verdict on Objection 1:**
  Your objection does not go wrong; it is the standard Incompatibilist position. The "win" depends on what you think moral responsibility requires.
  *   If responsibility requires **Ultimate Origination**, the Hard Determinist wins (and Compatibilism is a dodge).
  *   If responsibility requires **Reasons-Responsiveness** (the ability to react to reasons differently if the reasons changed), the Compatibilist wins.
  *   **Settled?** No. There is no consensus on which condition is necessary for responsibility.

  ### 2. The Stipulation Objection: "Who picks the definition?"
  **Your Argument:** If Dennett gets to define "free will worth wanting," why can't a Theist define it as "contra-causal soul power"?
  **Status:** **Genuinely Contested.** This is a clash of methodology (Pragmatism vs. Metaphysics).

  **The Compatibilist Defense:**
  Dennett's argument isn't just "I like this definition." It is that the Libertarian/Theist definition is **incoherent** or **undesirable**.
  *   **The Intelligibility Claim:** Dennett argues that "contra-causal freedom" (the ability to have done otherwise in the exact same causal state) amounts to randomness. If your choice wasn't caused by your character, desires, or reasons, it was a random accident. Randomness is not freedom; it's noise. Therefore, it is not "worth wanting" because it doesn't give you *control*.
  *   **The Pragmatic Claim:** We want free will to justify practices like praise, blame, and deliberation. Compatibilist freedom supports these. If I act on my reasons, I am the proper target of praise/blame. Contra-causal freedom adds nothing to this equation but metaphysical mystery.

  **The Theist/Libertarian Defense:**
  The Theist argues that Dennett's pragmatism ignores the requirement of **Just Desert**.
  *   **The Justice Claim:** If a theist believes in Divine Judgment (or a retributivist believes in Hell/Prison), it is unjust to punish someone who *could not have done otherwise*. Compatibilist freedom allows that you "could have done otherwise *if* you had wanted to," but Incompatibilists argue you couldn't have *wanted* otherwise.
  *   **Entitlement to Define:** The Theist is entitled to say, "The only freedom that satisfies my intuition of justice is contra-causal freedom." Dennett is entitled to say, "That freedom is impossible and incoherent."
  *   **The Stalemate:** Dennett says the Theist wants a square circle. The Theist says Dennett is selling a plastic toy and calling it a diamond.

  **Verdict on Objection 2:**
  The Theist is logically entitled to the definition, *provided* they can make it coherent.
  *   **Where the objection might "go wrong":** Only if "contra-causal power" is proven logically impossible (like a married bachelor). Many philosophers argue it *is* incoherent (how does an uncaused cause connect to *your* reasons?). Others (like agent-causalists) argue it is metaphysically possible but rare.
  *   **Where Dennett might "go wrong":** He assumes that because contra-causal freedom is weird, we shouldn't want it. But if moral truth *requires* it (as many intuitions suggest), then the fact that it's hard to explain doesn't mean we shouldn't want it.

  ### 3. What is Settled vs. What is Fighting?

  It is crucial not to mistake the *popularity* of a view for a *settled* view.

  **What is largely settled:**
  *   **Causal Closure:** Almost all parties agree that the physical world is causally closed (physics doesn't break for human choices). This puts the burden of proof on Libertarians/Theists to explain how a "soul" interacts with the brain without violating physics.
  *   **The Definition of Determinism:** There is general agreement on what determinism means (the past + laws of nature = one future).
  *   **The "Regress" Logic:** Both sides generally accept Galen Strawson's logic that you cannot be the ultimate cause of yourself. The fight is over whether that *matters*.

  **What is genuinely fighting (The "Live" Debate):**
  *   **The Necessity of Ultimate Responsibility:** Compatibilists say it's not needed for moral responsibility. Incompatibilists say it is essential. **This is not settled.**
  *   **The Coherence of Libertarianism:** Compatibilists say Libertarian free will is nonsense. Libertarians say they have models (Agent Causation, Non-Causal Theories) that make sense. **This is not settled.**
  *   **The "Worth Wanting" Criterion:** Is philosophy about capturing our deepest metaphysical intuitions (Incompatibilism) or about constructing a workable system for human society (Compatibilism)? **This is not settled.**

  ### Summary: Do the objections go wrong?

  **No, they do not go wrong.** They accurately identify the weak points of compatibilism.

  1.  **On the Regress:** You are right that Dennett moves the problem back. His reply is essentially, "There is no further back to go, so stop asking." If you find that unsatisfying, you are in the company of many rigorous philosophers (like Peter van Inwagen or Galen Strawson). The Hard Determinist does not definitively "win," but they certainly hold the stronger position regarding *metaphysical* origination.
  2.  **On the Definition:** You are right that Dennett is stipulating a definition. His defense is that the alternative definition is incoherent. If the Theist can demonstrate that contra-causal freedom is coherent and necessary for true justice, Dennett's "worth wanting" argument loses its force.

  **The Bottom Line:**
  The debate persists because it is a clash between **Intuition** (Incompatibilism feels more true to our experience of choice) and **Intelligibility** (Compatibilism fits better with a scientific worldview).

  Dennett wins if you value a concept of free will that fits within science and supports social practices.
  Hard Determinists/Theists win if you value a concept of free will that satisfies the intuition of "I could have genuinely done otherwise" regardless of causal history.

  Neither side has knocked the other out. The "worth wanting" move is not a logical refutation of hard determinism; it is a pragmatic proposal to stop worrying about metaphysics and start focusing on agency. Whether that is a profound insight or a dodge depends entirely on what you think philosophy is supposed to do.
