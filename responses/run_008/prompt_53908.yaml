answer: |-
  My credence is **0.21**.

  I arrive at this figure by decomposing the claim into four conditional probabilities. My estimate is significantly lower than your 0.55, primarily because I treat your worry about the "common scale" not as a friction, but as a structural barrier that eliminates the mechanism in the highest-stakes domains.

  Here is the decomposition:

  **1. Probability of Technical Isomorphism ($P_1 = 0.85$)**
  *Definition:* Given a conflict where commitment generates Pareto losses, can the parties technically construct a lower-stakes analogue (a "mock game") that preserves the strategic structure of the original?
  *Justification:* In abstract game-theoretic terms, this is usually possible. Most conflicts of commitment (Chicken, Prisoner's Dilemma variants) can be mapped to a symbolic contest, a binding arbitration clause, or a limited skirmish. The technology of simulation is rarely the bottleneck.
  *Evidence:* The prevalence of "mock trials" in law and military exercises suggests the *form* is easy to generate.

  **2. Probability of Valuation Commensurability ($P_2 = 0.35$)**
  *Definition:* Conditional on an analogue existing, do the parties share a sufficiently common scale of value to agree on what constitutes a "proportional reduction" of stakes?
  *Justification:* **This is where your worry dictates the number.** For the SPI to be "safe" and Pareto-dominating, both parties must agree that the mock game represents the same *fraction* of their total utility as the real game. In commercial litigation, stakes are monetary; the scale is common. In interstate disputes or turf wars, stakes are often incommensurable (e.g., "regime survival" vs. "economic sanction," or "honor" vs. "territory"). If Party A views the conflict as existential and Party B views it as marginal, no proportional scaling exists that both will accept as fair. A 10% reduction of an existential threat is still existential; a 10% reduction of a marginal cost is negligible.
  *Evidence:* Compare the success rate of binding arbitration in international commercial contracts (high commensurability) versus the failure of de-escalation protocols in ethnic or ideological conflicts (low commensurability).

  **3. Probability of Second-Order Credibility ($P_3 = 0.70$)**
  *Definition:* Conditional on agreement about the stakes, can the parties credibly commit to *abiding by the outcome of the scaled-down game*?
  *Justification:* The premise states parties have commitment technology (they can burn bridges). However, an SPI requires a specific *type* of commitment: the ability to bind oneself to a randomization device or a mock result *instead* of the natural commitment race. This is a second-order commitment. It is harder than simply committing to fight, because it requires trusting the counterparty not to defect from the mock game back to the real one if the coin lands unfavorably.
  *Evidence:* The rarity of "trial by combat" or binding lotteries in history compared to the frequency of unilateral brinkmanship.

  **4. Probability of Ex-Ante Incentive Compatibility ($P_4 = 0.75$)**
  *Definition:* Conditional on the above, will a party that believes it has an advantage in the commitment race agree to the randomization?
  *Justification:* Even with a common scale, a party confident it can win the commitment race (e.g., has faster mobilization, deeper pockets for litigation) faces a trade-off: the certain cost of the race versus the risk of losing the lottery. Overconfidence and risk-seeking behavior in conflict often lead parties to prefer the race, believing they can force the other to back down without incurring the full cost.
  *Evidence:* Experimental game theory on Chicken games shows persistent overconfidence in one's own commitment capability.

  **Calculation:**
  $$0.85 \times 0.35 \times 0.70 \times 0.75 \approx 0.156$$
  I adjust this slightly upward to **0.21** to account for the fact that in the specific subset of conflicts where commitment technology is *already* sophisticated (e.g., modern legal systems, nuclear deterrence protocols), the institutional framework sometimes imposes a common scale (like money or mutually assured destruction metrics) that the parties themselves lack.

  ### Sensitivity Analysis
  The final figure is most sensitive to **$P_2$ (Valuation Commensurability)**.
  If $P_2$ rises to 0.70 (assuming parties can usually agree on a scale), the overall credence jumps to **0.42**, nearing your estimate. If $P_2$ drops to 0.10 (assuming scales are almost never shared in conflict), the credence collapses to **0.05**.
  This confirms your intuition: the scheme presupposes a common scale. In the fiercest conflicts, where values are qualitative and existential rather than quantitative and fungible, the "proportional reduction" required for the SPI is undefined. The mechanism works beautifully in commercial law (where the scale is currency) and fails in war (where the scale is power/survival).

  ### Evidence That Would Move the Number
  The evidence that would most significantly update my credence is a **formal institutional experiment in interstate conflict** where parties successfully agreed to a scaled-down analogue *without* a pre-existing common metric.
  *   *Specific Case:* The **Alabama Claims arbitration (1872)** is a partial positive example (monetary damages substituted for war), but it relied on a post-hoc agreement.
  *   *What would move me:* A case where two states, prior to conflict, established a binding "mock skirmish" protocol to determine rights to a disputed territory, *and* adhered to it when the stakes were later revealed to be asymmetric.
  *   *Formal Result:* A mechanism design proof showing that SPIs can be implemented with **incomplete information about utility functions**. If you can show that parties can agree on a scaling factor without revealing their true valuations (preserving privacy while ensuring fairness), $P_2$ rises significantly.

  ### Stance on the "Common Scale" Presupposition
  You asked me to take a stance on whether the scheme presupposes a common scale. **It does.**
  My number reflects the judgment that this presupposition is not merely a technical hurdle but a categorical limitation. The SPI mechanism requires that the "cost of conflict" be a function of the *stakes*. In many real-world conflicts, the cost of conflict is a function of *capability* or *ideology*, independent of the stakes. When the cost structure does not map linearly to the payoff structure, the "scaled-down analogue" breaks down.
  By assigning $P_2 = 0.35$, I am registering the view that the SPI is a solution for **coordination problems among traders**, not necessarily for **conflicts among rivals**. It stretches to the latter only when rivals can be induced to think like traders.
