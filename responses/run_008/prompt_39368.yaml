answer: |-
  ### Joint Statement on the Ontology of Properties

  **1. Agreed Claims**

  1.  **The Explananda:** We agree that any adequate metaphysical account must address three core phenomena: (a) the 'One Over Many' (how distinct particulars can be of the same type); (b) the truth of predication (how subject-predicate sentences can be genuinely true); and (c) objective resemblance (why some particulars resemble each other more than others).
  2.  **Ontological Stakes:** We agree that this dispute is not merely *façon de parler*. While linguistic usage provides the data, the disagreement concerns what fundamentally exists, not merely how we choose to speak.
  3.  **Methodological Naturalism:** We agree that our ontology should be informed by our best scientific and mathematical theories, though we disagree on how to interpret the ontological commitments of those theories.
  4.  **Particulars:** We agree that concrete particulars (objects, events, entities located in space-time) exist and constitute the primary data of experience.
  5.  **Verbal vs. Substantive:** We acknowledge that some friction arises from divergent definitions of 'existence' and 'property' (a verbal element); however, we agree that the residual dispute regarding *fundamental* ontology—what grounds the truth-makers for resemblance and predication—is substantive.
  6.  **Dialectical Goal:** We commit to characterising each other's positions charitably, avoiding straw-man arguments, and focusing on which theory offers the best balance of ideological parsimony and ontological economy.

  **2. Table of Residual Disagreements**

  | Crux | Shared Criterion for Adjudication | Realist Position & Prediction | Nominalist Position & Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Quantification in Science & Maths**<br>*(The Indispensability Argument)* | Whether quantification over properties/sets in our best theories can be paraphrased away without loss of explanatory power or truth. | **Position:** Quantification implies ontological commitment. If science requires variables ranging over properties, properties exist.<br>**Prediction:** Nominalist paraphrases will ultimately fail to capture the full semantic content or utility of scientific discourse. | **Position:** Quantification is a linguistic tool, not an ontological census. Commitment can be avoided via fictionalism or structuralist paraphrase.<br>**Prediction:** A coherent nominalistic reconstruction of science is possible, rendering property-quantification dispensable. |
  | **2. Resemblance Classes**<br>*(The Imperfect Community Problem)* | Whether a theory of resemblance classes can be formulated without presupposing the very universals it seeks to replace. | **Position:** Resemblance is not primitive; it is grounded in shared universals. Classes of resembling particulars collapse into realism because resemblance itself requires explanation.<br>**Prediction:** Nominalist accounts will fail to distinguish 'imperfect communities' (groups that pairwise resemble but share no common property) without covertly invoking universals. | **Position:** Resemblance is a primitive, internal relation between particulars. Classes do not entail abstract entities.<br>**Prediction:** A sophisticated resemblance nominalism can solve the imperfect community problem by appealing to tropes or primitive resemblance without positing universals. |
  | **3. Abstract Reference in Arithmetic**<br>*(The Benacerraf Problem)* | Whether the apparent reference to numbers in true arithmetic sentences necessitates the existence of abstract objects. | **Position:** Reference requires referents. If arithmetic is true and refers to numbers, numbers (as abstract entities) must exist.<br>**Prediction:** Nominalist accounts of arithmetic will fail to explain the objectivity and necessity of mathematical truth. | **Position:** Reference can be useful without ontological commitment. Mathematical truth can be secured via modal structuralism or logical fiction.<br>**Prediction:** We can retain the truth of arithmetic without committing to a realm of abstracta, avoiding epistemological access problems. |

  ***

  **Drafting Note on the Verbal Dispute**
  *(Included here to satisfy the request to identify verbal elements)*

  Regarding the instruction to identify if part of the dispute is verbal: I have included this in **Agreed Claim 5**. My assessment is that a portion of the stalemate is indeed verbal, specifically concerning the definition of **'existence'**. The Realist tends to operate with a Quinean criterion ('to be is to be the value of a bound variable'), whereas the Nominalist often operates with a more robust, causal, or spatiotemporal criterion ('to be is to be in space-time'). If the Realist says 'Properties exist' and the Nominalist says 'Properties do not exist', they may sometimes be agreeing on the facts (that we quantify over properties in language) but disagreeing on whether that counts as 'existence'. However, the dispute becomes substantive when it shifts to **grounding**: *What makes it true* that two red things are both red? That is not verbal, and the table focuses on those substantive cruxes.
