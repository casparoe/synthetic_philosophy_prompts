answer: |-
  **JOINT STATEMENT ON THE STATUS OF DREAM REPORTS**

  **1. Agreed Claims**

  We, the undersigned members of the philosophy of mind reading group, having engaged in adversarial collaboration regarding the ontological and conceptual status of dreaming, hereby affirm the following claims as a neutral foundation for our continued inquiry:

  1.  **Reporting Behaviour:** Upon waking, subjects sincerely and vividly report narrative sequences which they characterise as having occurred during sleep. These reports are treated by subjects as descriptions of past events, notwithstanding the absence of external observation during the sleep period.
  2.  **Narrative Features:** Dream reports exhibit characteristic features distinct from waking narratives, including discontinuity, bizarre transformations, and a lack of critical reflection during the reported sequence. These features are consistent with confabulatory processes or distinct modes of cognitive organisation.
  3.  **First-Person Authority:** The proposition 'it seemed to me that I dreamt' cannot serve as a self-verifying datum that settles the question of whether an experience occurred contemporaneously with sleep. The sincerity of the report does not logically entail the existence of a prior stream of consciousness.
  4.  **Neurophysiological Neutrality:** The identification of specific sleep stages (such as REM) via polysomnography establishes physiological correlates but does not, on its own, resolve the conceptual question of whether the subject underwent 'experiences' in the ordinary sense during those stages.

  **2. Residual Disagreements**

  While we agree on the data described above, we diverge on the interpretation of the concepts required to explain them. The following table summarises our residual disagreements, phrased such that each party accepts the formulation in their column as a fair statement of their position.

  | Issue | Malcolmian Position | Dennettian Position |
  | :--- | :--- | :--- |
  | **Criteria for Experience** | The concept of 'experience' is grammatically tied to the possibility of public checkability or contemporaneous access. Since sleep precludes such criteria, applying the concept of experience to sleep is a category mistake. | The concept of 'experience' is tied to real-time information processing and narrative generation. Since the dream narrative is constructed post-hoc, there is no real-time experience of the events reported. |
  | **Status of Authoring** | The act of reporting a dream is a present-tense expression of a current inclination or state, not a description of a past mental going-on. There is no 'authoring' of a dream during sleep. | The act of reporting is the output of an unconscious authorial process that occurs at the moment of waking. This process is real, but it fabricates the narrative rather than recalling it. |
  | **Reference of Reports** | Dream reports do not refer to past mental events because no such events exist. They function expressively, similar to uttering a cry of pain, rather than descriptively. | Dream reports refer to the product of the waking fabrication process. They describe a memory trace created at waking, which is mistakenly projected back into the sleep period. |

  **3. The Cruxes**

  We identify two sub-questions where empirical or conceptual clarification would compel at least one party to revise their position. For each, we specify an agreed test and our advance predictions.

  **Crux 1: Lucid Dreaming and Real-Time Agency**
  *   **The Issue:** Does the ability of a subject to perform pre-agreed tasks during REM sleep demonstrate real-time conscious experience, or is it compatible with non-experiential physiological processing?
  *   **Agreed Test:** Trained lucid dreamers, confirmed to be in REM sleep via polysomnography, are instructed to signal via specific eye-movement patterns (e.g., three glances left, three glances right) upon hearing an auditory tone delivered during the sleep episode.
  *   **Malcolmian Prediction:** We predict the eye signals will not correlate reliably with the tones. Should a correlation appear, we maintain it indicates a micro-awakening or a physiological reflex rather than 'lucid experience', as the grammatical criteria for experience remain absent.
  *   **Dennettian Prediction:** We predict the eye signals will correlate reliably with the tones. This would demonstrate real-time information processing and decision-making during sleep, undermining the claim that all dream content is fabricated solely upon waking.

  **Crux 2: The Burning Toast Stimulus Experiment**
  *   **The Issue:** Does the content of a dream report derive from stimuli processed during the sleep state, or solely from the context of the waking moment?
  *   **Agreed Test:** A faint, distinctive stimulus (the smell of burning toast) is delivered at a random point in the night under one of four conditions: (A) During REM sleep only; (B) In the waking room only (immediately prior to report); (C) In both REM and waking; (D) In neither. Subjects give an unprompted dream report on waking. We measure the inclusion of 'toast' or 'burning' themes in the report.
  *   **Malcolmian Prediction:** We expect toast inclusions in conditions **B (Wake only)** and **C (Both)**. We expect no toast inclusions in **A (REM only)** or **D (Neither)**.
      *   *Rationale:* The report is a waking expression sensitive to the immediate waking environment. A stimulus during sleep cannot influence the report as there is no subject to experience it. A stimulus on waking influences the expression directly.
      *   *Implication of Absence:* If condition B yields no toast inclusions, it would suggest reports are not sensitive to waking context, challenging the view that they are present-tense expressions.
  *   **Dennettian Prediction:** We expect toast inclusions in conditions **A (REM only)** and **C (Both)**. We expect no toast inclusions in **B (Wake only)** or **D (Neither)**.
      *   *Rationale:* The dream narrative is constructed from memory traces generated by brain activity during the sleep episode. A stimulus during REM is woven into this fabrication. A stimulus delivered strictly on waking is categorised by the subject as external reality and excluded from the 'dream' narrative.
      *   *Implication of Absence:* If condition A yields no toast inclusions, it would suggest sleep-state processing does not contribute content to the narrative, supporting the view that the narrative is generated entirely from waking-state resources.

  **4. Verbal Disputes and Prospects for Progress**

  **On Terminology**
  We acknowledge that a portion of our dispute is verbal, specifically concerning the word 'experience'.
  *   The Malcolmian party uses 'experience' to denote a state that logically permits public verification and contemporaneous reporting. On this definition, dreams cannot be experiences by definition.
  *   The Dennettian party uses 'experience' to denote a functional state of information processing and cognitive access. On this definition, dreams may or may not be experiences depending on the timing of the processing.
  *   We agree that if we were to adopt a single definition, the substantive disagreement would diminish, but not vanish. The underlying dispute concerns the *mechanism* of report generation (waking expression vs. waking fabrication of sleep traces) rather than merely the label applied to it.

  **On Progress**
  We agree that the stipulated evidence would count as progress rather than merely another word-bound standoff.
  *   For the Malcolmian, if the Toast Experiment shows that REM-only stimuli (Condition A) reliably determine report content, it would demonstrate a causal link between sleep-state events and waking reports that is difficult to reconcile with the view that reports are purely waking expressions uninfluenced by sleep 'content'.
  *   For the Dennettian, if the Toast Experiment shows that Waking-only stimuli (Condition B) reliably determine report content while REM stimuli do not, it would demonstrate that the narrative is sensitive to the waking context in a way that undermines the claim that it is a reconstruction of sleep-state processing.
  *   Regarding Lucid Dreaming, if eye-signals are proven to be reliable and intentional during verified REM sleep, the Dennettian party views this as decisive evidence of real-time processing. The Malcolmian party accepts that while this would not alter the grammatical argument regarding 'experience', it would necessitate a significant qualification of the claim that sleep is a total absence of cognitive agency.

  We sign this statement to record our current dialectical position and our commitment to treating the above experiments as arbiters of our theoretical commitments.

  __________________________
  (Malcolmian Representative)

  __________________________
  (Dennettian Representative)

  **Date:** 24 May 2024
