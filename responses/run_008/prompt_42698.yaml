      *   *Check:* Did I address the "who owns the word" question? *Action:* Distinguish between technical nomenclature and natural language.
      *   *Check:* Is the "zombie state" explained? *Action:* Yes, it's useful ambiguity.

  7.  **Final Polish:** Ensure the distinction between *Chronostratigraphy* (rocks) and *Geochronology* (time) is clear, as that's often where the confusion lies. (Actually, keep it simpler: Rock Record vs. Concept). Ensure the distinction between "Informal Unit" and "Formal Unit" is highlighted as the proposed solution that failed to stick culturally.

  8.  *(Final thought)*: The user asks if the impasse is load-bearing. I should argue *yes*. It allows geologists to say "we didn't dilute our standards" and activists to say "the geologists are outdated, the reality is real." Both win by maintaining the conflict.

