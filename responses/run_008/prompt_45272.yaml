answer: |-
  It is a pleasure to engage with a colleague who approaches the ontology of art from the rigorous standpoint of material analysis. Your puzzle is not merely practical; it strikes at the heart of a debate that has occupied analytic aesthetics for the last sixty years. You are effectively asking for the metaphysical commitments of the "Artworld" to be made explicit, much like one might deduce the theoretical commitments of a laboratory protocol.

  Per your request, I will begin by brainstorming the conceptual landscape, mapping the tensions between your materialist framework and institutional practice. Then, I will offer a reconstruction of the implicit theory of value, distinguish between what is required and what is compatible, explore the philosophical underdetermination, and finally, sketch the counterfactual world where your supervenience view holds sway.

  ### Phase 1: Brainstorming and Mapping the Terrain

  Let us lay out the data points (the practices) and your working hypothesis (the materialist supervenience view) to see where the friction lies.

  **The Data Points (Institutional Practices):**
  1.  **The Refund:** Economic value collapses upon reattribution, despite physical constancy.
  2.  **The Relabeling/Storage:** Art-historical status collapses upon reattribution; the object is treated as a different *kind* of thing.
  3.  **The Fake Exhibition:** The object retains *some* value (enough to charge admission), but the mode of engagement changes (we look at it *as* a forgery).

  **Your Hypothesis (Physical-Aesthetic Supervenience):**
  *   **Thesis:** Aesthetic value ($V$) supervenes strictly on intrinsic physical properties ($P$).
  *   **Equation:** If $P_1 = P_2$, then $V_1 = V_2$.
  *   **Implication:** Provenance, authorship, and history are external to the work. They are context, not content.

  **The Friction:**
  If your hypothesis were true, the auction house refund would be fraudulent (selling the same $P$ for a different price based on a lie about history). The museum storage decision would be irrational (wasting display space on an object with identical $V$). The Fake Exhibition would be redundant (why distinguish them if $V$ is identical?).

  **Initial Philosophical Candidates:**
  *   **Nelson Goodman (*Languages of Art*):** Argues that even if a forgery is perceptually indistinguishable *now*, knowing it is a forgery changes our *capacity* to perceive it in the future (we look for differences). Value is cognitive.
  *   **Arthur Danto (*The Artworld*):** Argues that artworks are distinct from mere real things (or copies) due to an "atmosphere of artistic theory." The history of production is constitutive of the work.
  *   **Jerrold Levinson (*Historical Definition of Art*):** Argues that an artwork is essentially tied to the specific intention and context of its creation. A copy cannot be the same work because it lacks the correct causal history.
  *   **Institutional Theory (Dickie):** Value is a status conferred by the artworld. If the artworld withdraws the status ("Vermeer"), the value vanishes by definition.

  **Key Distinction to Make Early:**
  We must separate **Market Value** (price), **Art-Historical Significance** (importance to the narrative of art), and **Aesthetic Value** (capacity to provide aesthetic experience). The institutions often conflate these, but philosophically they come apart. The refund is about Market Value; the storage is about Art-Historical Significance; the exhibition is about Cognitive/Aesthetic Value.

  ---

  ### Phase 2: Challenging the Supervenience Assumption

  Before reconstructing the theory, I must address your assumption that "aesthetic value must supervene on properties visible in the work or at least detectable in it."

  In philosophy of mind, we distinguish between *narrow* supervenience (intrinsic physical properties only) and *wide* supervenience (intrinsic physical properties + relational/historical properties). Your training assumes narrow supervenience. The art world operates on wide supervenience.

  Consider an analogy from your field: A geological sample.
  *   **Sample A:** A natural diamond formed over billions of years under high pressure.
  *   **Sample B:** A synthetic diamond created in a lab last week.
  *   **Physical Properties:** Identical (hardness, refraction, chemical composition).
  *   **Value:** Radically different.

  Why? Because the value of the diamond supervenes not just on its lattice structure, but on its *generative history*. The art world treats paintings like natural diamonds, not like industrial lubricants. The "Vermeer" is not just a pattern of pigments; it is a **trace of a specific human action at a specific time**.

  Therefore, the first step in reconstructing the theory is to reject the claim that the object on the wall is the artwork. The object on the wall is the *vehicle* of the artwork. The artwork is the vehicle *plus* its history of production. When the history changes (Master $\rightarrow$ Forger), the artwork changes, even if the vehicle does not.

  ---

  ### Phase 3: Reconstructing the Implicit Theory of Value

  The practices you describe presuppose a **Historical-Relational Theory of Value**. This is not purely epistemic (about knowledge), nor purely ontological (about magic in the brushstroke). It is a hybrid. Here is the reconstruction:

  #### 1. The Artwork as an Action, Not an Object
  The institutions operate as if a painting is a fossilized performance. A Vermeer is a record of a specific problem-solving event in the 17th century.
  *   **Practice:** Relabeling/Storage.
  *   **Theory:** When a painting is reattributed from Master to Pupil, it is not that the visual properties worsened. It is that the *achievement* changed. The Master's work represents an innovation; the Pupil's work represents a derivation. Museums are archives of innovation, not just archives of visual stimuli.
  *   **Requirement:** This practice *requires* that art-historical significance supervene on the causal history of the object, not just its physical state.

  #### 2. Market Value as a Warranty of Origin
  *   **Practice:** The Refund.
  *   **Theory:** This is less about aesthetics and more about contract law grounded in ontology. When you buy a "Vermeer," you are buying a share of a scarce cultural resource defined by its origin.
  *   **Requirement:** This *requires* that authorship be an essential property of the commodity. If authorship were accidental (as per your supervenience view), the refund would be unjust enrichment for the buyer. The refund acknowledges that the *identity* of the good sold was not delivered.

  #### 3. The Cognitive Shift (The Goodman Effect)
  *   **Practice:** Fake Exhibitions.
  *   **Theory:** Why do we enjoy looking at a fake once we know it is a fake? Because our mode of scrutiny changes. As Nelson Goodman argued, knowing a work is a forgery makes us look at it differently. We stop looking for "genius" and start looking for "anachronisms" or "efforts at mimicry."
  *   **Requirement:** This *requires* that aesthetic experience is not passive reception of data, but an active cognitive engagement informed by knowledge. The physical object is the same, but the *perceptual experience* is not.

  #### 4. Distinction: What is Required vs. What is Compatible
  *   **Strictly Required:** The institutions *must* assume that **provenance is constitutive of identity**. If provenance were merely descriptive, the refund and relabeling would be irrational.
  *   **Merely Compatible:** It is *compatible* with these practices to believe the forgery is aesthetically inferior (uglier). But it is not *required*. A museum can exhibit a beautiful forgery *as* a forgery. The practices do not demand that fakes be ugly; they demand that fakes be *categorially distinct*.
  *   **Underdetermined:** The practices do not tell us *why* the original is valued more.
      *   *Explanation A (Romantic):* The Master has a "soul" or "genius" the forger lacks.
      *   *Explanation B (Historical):* The Master did it first; the forger is parasitic on that innovation.
      *   *Explanation C (Scarcity):* There is only one Vermeer; there could be infinite forgeries.
      *   *All three* license the same refunds and relabelings. The institutions are agnostic on the metaphysical source of the value, provided the link between origin and value holds.

  ---

  ### Phase 4: Philosophical Underdetermination

  You asked if several different accounts of value could license the same practices. The answer is yes. This is crucial for your reconstruction. The auction houses and museums are not practicing Platonists or Kantians; they are pragmatists.

  1.  **The Epistemic Account:**
      *   *Theory:* The forgery is aesthetically identical, but the *deception* poisons the experience. Once the lie is revealed, the viewer feels betrayed, and the "aura" is broken.
      *   *Fit:* Explains the refund (fraud) and the storage (embarrassment).
      *   *Weakness:* Doesn't fully explain the Fake Exhibition. If the experience is poisoned, why pay to see it? Unless the value shifts from "aesthetic" to "cautionary."

  2.  **The Ontological Account (Danto/Levinson):**
      *   *Theory:* The artwork *is* the history. A forgery is literally a different artwork, even if it looks the same. "Vermeer's *Girl*" and "Van Meegeren's *Girl*" are two different works that happen to share a visual vehicle.
      *   *Fit:* Perfectly explains the relabeling. You aren't downgrading the object; you are identifying it correctly.
      *   *Weakness:* Seems metaphysically extravagant to a scientist.

  3.  **The Institutional Account (Dickie):**
      *   *Theory:* Value is whatever the "Artworld" says it is. The Artworld has a rule: "Originals count, copies don't."
      *   *Fit:* Explains everything simply as a game with rules.
      *   *Weakness:* Circular. Why does the Artworld have that rule?

  **Conclusion on Underdetermination:** The practices are consistent with all three. However, the **Ontological-Historical** account is the one that best justifies the *storage* decision. If it were purely epistemic (just about deception), a beautiful forgery whose deception is known (like in the exhibition) should be able to hang in the main gallery. The fact that it is relegated to storage suggests the institution believes the object *itself* has lost its status as a primary source of art-historical data.

  ---

  ### Phase 5: The Counterfactual — If Your View Were Adopted

  If the art world adopted your "Physical-Aesthetic Supervenience" view (Narrow Supervenience), institutional practice would undergo a radical transformation.

  1.  **The End of Attribution Disputes:**
      *   Authentication labs like yours would become obsolete for valuation purposes. If a pupil's copy is physically indistinguishable from the master's, it *is* the master's work for all aesthetic intents. The "Vermeer" would become a style category, not a signature.
      *   *Result:* Auction houses would sell "School of Vermeer" works at the same price as "By Vermeer" works, provided the pigment analysis matched.

  2.  **Museum Display:**
      *   Museums would stop arranging works chronologically by artist (which privileges the narrative of individual genius) and might arrange them by visual affinity or physical composition.
      *   Storage policies would change. A copy that looks like a Masterpiece would be displayed alongside the Masterpiece, labeled "Visually Indistinguishable Counterpart."

  3.  **The Collapse of the Market:**
      *   The art market relies on scarcity. Scarcity in art is currently defined by *origin* (one man painted it). Under your view, scarcity would be defined by *unique physical configurations*.
      *   If a perfect copy could be made (molecule for molecule), it would be the same work. The market would crash because the "unique asset" would be replicable. Insurance would become impossible, as replacing the canvas with a physically identical one would constitute full restitution.

  4.  **Forgery Laws:**
      *   Legal statutes against forgery would need rewriting. Currently, forgery is a crime of fraud (misrepresenting origin). Under your view, if the object is visually identical, no harm has been done to the aesthetic experience. The crime would have to be purely contractual (breach of warranty), not cultural.

  ### Phase 6: Synthesis and Correction

  You asked me to correct your assumption that the supervenience claim is straightforwardly true.

  **The Correction:**
  The claim "aesthetic value supervenes on physical properties" is only true if you define "physical properties" narrowly (current molecular arrangement). If you define "physical properties" to include **historical traces** (the aging of the varnish, the specific wear on the brush caused by the artist's hand pressure which might be microscopically distinct even if visually hidden), then your view holds.

  However, the art world goes further. It claims value supervenes on **non-physical historical facts**.
  *   *Example:* Two canvases, painted by the same artist, on the same day, with the same paint, looking identical.
      *   Canvas 1: Intended as a finished work.
      *   Canvas 2: Intended as a test/study, accidentally sold as finished.
  *   The Artworld values them differently. There is no physical difference. There is no detectable trace. The difference is purely in the **intentional history**.

  Therefore, the implicit theory of value presupposed by the practices is **Intentional-Historical**. The value of the painting is not just the paint; it is the **successful realization of a specific artistic intention in a specific historical context**.

  When a museum relegates a painting to storage upon reattribution, they are not saying, "This is ugly." They are saying, "This is not the evidence we thought it was." They are curators of history, not just decorators of walls. When an auction house refunds a buyer, they are acknowledging that they sold a specific historical artifact, not a generic decorative object.

  ### Final Summary for the Analytical Chemist

  1.  **The Object vs. The Work:** Your instruments analyze the *vehicle* (canvas/pigment). The art market trades the *work* (vehicle + history + intention). These are different ontological categories.
  2.  **Supervenience Base:** Aesthetic and Market value supervene on **Wide Physical Properties** (intrinsic structure + causal history). Changing the history changes the value, even if intrinsic structure remains constant.
  3.  **The Refund:** Is a correction of a categorical error (selling a copy as an original), not a judgment on visual quality.
  4.  **The Exhibition:** Shifts the category of the object from "Masterpiece" to "Historical Artifact of Deception." The value remains, but the *type* of value changes from aesthetic reverence to cognitive curiosity.
  5.  **Your View's Implication:** If your narrow supervenience view were adopted, the concept of the "unique artwork" would vanish, replaced by "visual configurations," collapsing the market and transforming museums into libraries of visual patterns rather than archives of human achievement.

  The incoherence you perceive is real, but it lies not in the art world's logic, but in the mismatch between the **material ontology** of the chemist and the **historical ontology** of the art historian. They are measuring different things. You measure the substrate; they measure the trace of the action.
