  7.  **Final Polish:** Organize with clear headings. Ensure the "Brainstorming" phase is visible or integrated as requested ("begin with some brainstorming before committing to a reconstruction"). *Wait, the prompt says "begin with some brainstorming before committing to a reconstruction."* I should make this explicit in the structure.

