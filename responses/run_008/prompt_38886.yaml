          *   Validate Prof B: Disaggregated numbers reflect *reviewer bias*. Within divisions, EM students are not disadvantaged; they are slightly advantaged.
          *   The Crux: The disparity stems from field selection, not review bias.
          *   Contested Step: Is field selection neutral? If EM status pushes students into underfunded fields, that's a structural issue, not a review bias issue.
