  TO: Doctoral Fellowship Committee
  FROM: [My Name], Graduate Representative
  DATE: October 23, 2023
  SUBJECT: Statistical Framework for Fellowship Allocation Review

  This memo frames Thursday's discussion regarding the disparity in fellowship success rates between students entering with external master's degrees (EM) and those entering directly from bachelor's programs (DE). The data presents a classic instance of Simpson's Paradox. Resolving this requires distinguishing between *procedural bias* (reviewer conduct) and *structural inequity* (resource distribution).

  **The Statistical Reality**
  Aggregate data shows EM success at 27% versus 43% for DE. Professor A correctly notes that applicants experience this aggregate reality. Regardless of cause, an EM applicant is less likely to receive funding. However, disaggregated data reveals EM success rates exceed DE rates within Humanities, Social Sciences, and Natural Sciences/Engineering. Professor B correctly infers that review bias within divisions is not the driver. If reviewers were biased against EM students, we would see lower success rates within divisions, not higher.

  The disparity arises because EM students apply disproportionately to Humanities, where overall funding rates are lowest. This is a composition effect, not a treatment effect.

  **Evaluating the Proposals**
  Professor A's proposal (anonymized review + bias workshop) targets reviewer bias. Given the disaggregated data shows EM students winning *more* often within divisions, there is no statistical evidence that reviewer identity or knowledge of EM status suppresses EM success. Implementing anonymization now addresses a problem the data suggests does not exist within the review room.

  Professor B's proposal (reallocating fellowships across divisions) targets the structural imbalance. Since the aggregate disparity is driven by Humanities' low funding rate combined with EM concentration there, increasing Humanities allocations would mathematically reduce the aggregate gap. This addresses the outcome disparity without assuming reviewer malfeasance.

  **The Contested Step: Endogeneity of Division Choice**
  My recommendation hinges on a contested assumption: that division choice is exogenous. We are treating the decision to apply to Humanities as a free choice independent of the review process. However, if EM students are systematically steered toward Humanities due to prior structural barriers (e.g., lack of lab funding in sciences for non-continuing students), then the "choice" is itself a symptom of bias.

  If division choice is endogenous, disaggregated data masks the true inequity. Professor C's suspicion that both A and B are partially wrong likely stems from this causal ambiguity. We cannot assume the pipeline leading to the application is neutral.

  **Recommendation**
  1.  **Reject Immediate Process Changes:** Do not implement anonymized review or mandatory bias workshops at this time. The within-division data exonerates the current review mechanism regarding EM status.
  2.  **Audit Divisional Allocation:** Adopt Professor B's logic. Task the subcommittee with modeling a reallocation of fellowships to normalize success rates across divisions. Proposal due by December 1.
  3.  **Investigate Pipeline Dynamics:** Commission a survey of EM applicants regarding their division selection process. We need to know if their concentration in Humanities is preference or constraint. Results due by February 1.

  **Falsification and Risk**
  This recommendation relies on the adequacy of the current stratification. I would recommend the opposite course (adopting Professor A's measures) under two conditions:
  1.  **Qualitative Evidence of Bias:** If survey data or testimony reveals that EM students are discouraged from applying to high-funding divisions during recruitment, the "choice" is illusory. In this case, anonymization may be necessary to prevent downstream bias.
  2.  **Unobserved Confounders:** If EM students within divisions are systematically stronger (e.g., higher publications) than DE students yet only achieve "modestly higher" success rates, this suggests suppressed potential. If we control for quality metrics and the EM advantage disappears, reviewer bias may be present after all.

  The analysis is most likely to fail if we treat "Division" as a sufficient control variable. Divisions are heterogeneous; if EM students cluster in underfunded sub-fields within Humanities while DE students cluster in funded sub-fields, the divisional adjustment is too coarse. We must verify that the reversal holds at the department level.

  We must act on the data we have, not the disparity we fear. The data indicates structural funding issues, not review bias. Fixing the allocation formula is the statistically sound intervention.

