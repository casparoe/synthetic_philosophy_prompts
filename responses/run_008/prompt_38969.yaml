  *   **The Buck Stops Here:** Mental dispositions differ because the "Base" and the "Manifestation" overlap. In glass, Structure (Base) and Breaking (Manifestation) are distinct. In anger, Neural State (Base) and Feeling/Action (Manifestation) are tightly coupled. If the drug dissolves the *feeling*, it removes the base.
