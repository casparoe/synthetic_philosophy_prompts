answer: |-
  You are wrestling with one of the hottest debates in contemporary metaethics. Your flatmate is articulating a version of the **Evolutionary Debunking Argument (EDA)**, most famously associated with Sharon Street and Richard Joyce. Your counter-argument is the **"Global Skepticism"** or **"Self-Defeat"** objection, championed by realists like David Enoch and Erik Wielenberg.

  You are right to feel that something is slippery about her reply. While her distinction between math and morality is the standard move for an debunker, it relies on a hidden premise that is much harder to defend than it looks.

  Here is the breakdown of why your intuition is robust, what extra premise she is smuggling in, and what it costs you to accept her reply.

  ### 1. Does the Math Parallel Break the Argument?

  **Short answer:** Yes, it creates a massive *reductio ad absurdum* pressure that the debunker must resolve.

  If the EDA proves that moral beliefs are unjustified because they were shaped by fitness rather than truth, and the same is true of our logical/mathematical faculties, then the EDA proves that *all* reasoning is unjustified. But the EDA itself is a piece of reasoning. Therefore, if the EDA is sound, we have no reason to accept the EDA.

  Most philosophers agree that global skepticism is a bullet that cannot be bitten. We *must* be justified in believing *modus ponens*, even if our brains evolved. If we grant that, we have to explain why evolution grants justification in math but denies it in morality.

  ### 2. Analyzing Her Disanalogy Reply

  Her reply relies on a specific claim about the relationship between **Fitness** and **Truth**.

  *   **For Math:** She claims there is a **convergence**. Believing "3 predators > 2 predators" is fitness-enhancing *because* it is true. The truth of the matter causally impacts survival. Therefore, evolution selected for truth-tracking faculties in this domain.
  *   **For Morality:** She claims there is **divergence**. Believing "protect your kin" is fitness-enhancing, but whether that belief corresponds to a mind-independent *Moral Truth* is irrelevant to survival. Evolution selected for the belief, not the truth.

  **The Extra Premise:**
  To make this work, she is smuggling in the **Causal Constraint on Knowledge**.
  > *Premise X:* For a belief to be justified via evolution, the truth of that belief must have causal efficacy in the physical world (i.e., true beliefs must help you survive *because* they are true).

  Mathematical truths (instantiated physically) have causal power (3 lions will eat you). Moral truths (on her view) are assumed to be **Non-Natural**. They don't push atoms around. Therefore, evolution couldn't "see" them to select for them.

  ### 3. Why Your Intuition About the "Coincidence Story" is Correct

  You asked: *"Isn't the availability of the 'coincidence story' for math itself something we can only judge using our evolved faculties?"*

  **Yes.** This is the fatal flaw in her reply.

  To establish that math tracks truth, we have to reason:
  1.  Evolution selected for cognitive faculties.
  2.  Faculties that track physical truths enhance survival.
  3.  Therefore, our math faculties likely track truth.

  But step (3) is a logical inference. We are using our **evolved logic** to prove that our **evolved logic** is reliable. This is **epistemic circularity**.

  If the EDA says "You can't trust faculties shaped by fitness unless you verify them independently," then we can't verify math either, because the verification tool (logic) is also shaped by fitness.

  Her reply tries to say, "Math is different because we can *tell a story* about why fitness matches truth." But if the EDA is strong enough to debunk morality, it is strong enough to debunk the *story* we tell about math. You can't use the suspect faculty to vindicate the suspect faculty.

  ### 4. Can the Realist Deny the Divergence?

  You also asked: *"Why couldn't a realist just deny that — maybe true moral beliefs happened to be the fit ones?"*

  This is the **Tracking Response**, and it is a valid move, but it depends on what kind of Realist you are.

  *   **Moral Non-Naturalism:** If moral facts are spooky, non-physical entities (like Plato's Form of the Good), your flatmate is right. Evolution can't track those.
  *   **Moral Naturalism:** If moral facts are natural facts (e.g., "Good" = "Conducive to well-being/flourishing"), then the realist **can** argue that evolution *did* track moral truth. Creatures that figured out how to flourish (cooperate, care for kin) survived. On this view, moral truth *is* fitness-conducive.

  Your flatmate's argument implicitly assumes **Non-Naturalism**. If you are a Naturalist, her argument misses its target. She is arguing against a specific subset of realists.

  ### 5. The Cost of Accepting Her Reply

  If you decide her reply is sufficient and accept the EDA for morality but not math, here is the price tag:

  1.  **You must accept "Pre-established Harmony":** You have to believe that evolution just *happened* to align our math faculties with truth, but didn't do the same for morality. But since we use the same brain for both, this looks like special pleading. Why is the brain reliable for logic but unreliable for normativity?
  2.  **You limit Moral Realism:** You are forced to abandon Non-Natural Moral Realism. You can only be a realist if you can reduce moral facts to natural facts (like psychology or biology) that evolution could "see."
  3.  **You accept a fragile justification for Math:** You are admitting that our justification for math is ultimately contingent on biological utility. If the environment changed, *modus ponens* might not have been selected for. This makes mathematical truth feel uncomfortably dependent on biological history.

  ### The Verdict

  Your flatmate's argument is the standard "Street/Joyce" position, but your counter is the standard "Enoch/Wielenberg" rebuttal. In the philosophical community, the debate is currently stalled, but the **Global Skepticism objection (your point)** is generally considered the strongest challenge to the EDA.

  **Why your position is stronger:**
  The most sophisticated realist response is the **"Third-Factor Explanation"** (proposed by David Enoch).
  *   **Argument:** Evolution didn't select for moral truth *directly*, nor did it select for math truth *directly*. It selected for **survival**.
  *   **The Link:** Survival is *itself* a good thing (a moral truth) and requires accurate counting (a math truth).
  *   **Conclusion:** There is a "third factor" (Survival/Adaptiveness) that correlates with both Truth and Fitness. We don't need evolution to track truth directly; we need truth and fitness to share a common cause.

  If the flatmate accepts that "Survival is good" or "Survival requires truth," she has conceded that there is a link between fitness and normativity/truth. If she denies that survival is good or truth-conducive, she undermines her own ability to argue (since she is trying to convince you that her argument is *good* and *true*, presumably because it leads to intellectual survival/success).

  **Recommendation:**
  Tell her this: *"If you insist that evolution undermines morality because it selects for fitness rather than truth, you must explain why that same logic doesn't undermine the logic you're using to make that argument. If you say math is different because truth helps survival there, I can say the same for morality: believing true moral claims (like 'cooperation is good') helps survival. You're assuming moral truth doesn't help survival, but that's exactly what's in dispute. You can't use evolution to debunk morality without also debunking the reasoning you used to get there."*

  You are not missing a subtle point; you have identified the central weakness of the debunking argument. Stick to (10).
