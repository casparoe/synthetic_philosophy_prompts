answer: |-
  This is a delightful problem. Your daughter has essentially constructed a strict deontological argument (actions are either duty or indifferent) combined with a cynical psychological egoist critique (all actions are self-interested bargaining). She is arguing like a young Hobbes or a rigid Kantian, while you are trying to run the household like an Aristotelian *oikos* (household/community of virtue).

  Her logic is internally consistent *if* one accepts her premises. The failure lies in the premises themselves. Specifically, she is presenting a **false dilemma** by ignoring the category of the **supererogatory**, and she is conflating **moral worth** with **transactional value**.

  Here is how to break this down, first for your own philosophical satisfaction, and then for a conversation she will respect.

  ### 1. The Philosophical Diagnosis (For You)

  **The False Dilemma (Duty vs. Hobby)**
  She argues: *Either X is obligatory (and omission is blameworthy) OR X is optional (and commission is morally neutral).*
  **The Flaw:** She is ignoring the **Supererogatory**. In ethics, these are actions that are "good to do, but not wrong to omit." Unloading your brother's dishes is not a duty (you have your own), but it is not morally indifferent like painting a picture for yourself. It contributes to the common good of the *polis* (the family).
  **The Praise:** We praise supererogatory acts not because they fulfill a contract, but because they signal **virtue** (generosity, attentiveness). Silence when she *doesn't* do them is appropriate because she has not violated a duty; she has simply chosen not to exercise a specific virtue at that moment.

  **The Motivation Argument (Bargaining vs. Kindness)**
  She argues: *If I do this to get something later, it is bargaining, not kindness.*
  **The Flaw:** She is conflating the *origin* of the act with the *nature* of the act.
  1.  **Habituation:** Aristotle would argue that we become just by doing just acts, even if we don't feel like it initially. Doing the "extra" builds the habit of generosity, even if the initial motive is transactional.
  2.  **The Gift Economy:** Families are not markets. In a market, a gift creates a debt. In a family, a gift creates a bond. By framing her extra chores as "bargaining chips," she is trying to force the family into a market framework where she has leverage. You need to gently reject the market framework without rejecting her honesty.

  ### 2. How to Respond to Her (The Script)

  Since she values logic, do not respond with "Because I said so" or "Because we love you." Respond by correcting the categories. You can actually compliment her reasoning while dismantling it.

  **Step 1: Validate the Logic**
  "I've been thinking about your argument, and you're right that on paper, it looks like a contradiction. You've identified a classic philosophical problem: the difference between Duty and Supererogation. You're assuming there are only two buckets: 'Required' and 'Irrelevant.' I think there's a third bucket."

  **Step 2: Define the Third Bucket (The Supererogatory)**
  "Bucket one is **Duty**: Your assigned chores. If you don't do them, it's a violation. Bucket two is **Hobby**: Things that only affect you, like drawing or gaming. We don't praise those because they don't help the family.
  "But there is Bucket three: **Above and Beyond**. These are things that help the community but aren't required. If a soldier jumps on a grenade, it's not 'required' (we don't court-martial soldiers who don't), but it's not a 'hobby' either. It's heroic. When you unload the dishwasher for your brother, you aren't fulfilling a contract; you're building the community. We praise that not as a payment, but as recognition of your character."

  **Step 3: Address the "Bargaining" Claim**
  "This is the interesting part. You said you do it to get leverage later. I appreciate your honesty. But here is the distinction: In a market, if I give you $5, I own $5 worth of your time. In a family, when you do an extra kindness, it doesn't create a debt we owe you; it creates trust.
  "If you do extra chores *only* to cash them in for favors, you are treating the family like a market. That's a choice you can make, but don't be surprised if the 'currency' doesn't always spend the way you want. We praise the *action* because it helps us, regardless of the *motive*. But if you want to be seen as 'wonderful' rather than just 'strategic,' the motive eventually has to catch up to the action."

  **Step 4: The Closing Offer**
  "So, here is the new deal: We will never punish you for not doing 'extra.' That remains supererogatory. But we also won't treat extra chores as bankable currency for breaking rules or getting special privileges. They count toward our view of your character, not your credit score. Does that resolve the incoherence?"

  ### 3. Why This Works

  1.  **It respects her intelligence:** You aren't talking down; you are introducing a higher-level ethical category (Supererogation) without necessarily using the jargon.
  2.  **It separates Praise from Payment:** Teenagers often view praise as transactional ("They are saying I'm good so I will keep doing it"). Reframing praise as *recognition of character* shifts it to virtue ethics.
  3.  **It neutralizes the leverage:** By explicitly stating that extra chores do not buy "get out of jail free" cards, you remove the transactional value she is seeking, while keeping the moral value intact.
  4.  **It invites growth:** You are acknowledging her current motive (bargaining) as a starting point, but suggesting that mature family membership requires moving beyond transaction.

  ### 4. A Potential Trap to Avoid

  Be careful not to fall into the **Stoic trap**. If you say, "You should do it for the sake of virtue alone," she will (rightly) point out that adults rarely do that.

  Acknowledge that *everyone* starts with transaction. "Even adults do favors expecting reciprocity. The difference is, in a healthy family, we try to move toward generosity where the ledger isn't kept daily."

  ### Summary for the Teacher
  She is applying **Contractual Justice** to a relationship based on **Distributive Justice** and **Friendship**.
  *   **Her view:** Family = State/Market (Quid Pro Quo).
  *   **Your view:** Family = Community (Shared Good).

  Your goal isn't to prove her logic wrong (it's valid within her framework), but to show her that her framework is the wrong tool for the job. You are running a *polis*, not a courtroom.
