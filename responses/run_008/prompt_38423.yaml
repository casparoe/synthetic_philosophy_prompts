prompt: |-
  I teach ancient philosophy, so the ethics of everyday family life is somehow outside my comfort zone. My 15-year-old has hit me with an arguement I can't quite put my finger on why it fails. The deal at home is that everyone does their assigned chores, and she does hers, no complaints. Every so often she'll do extra -- unloads the dishwasher when it's her brother's turn, cooks dinner unprompted -- and we thank her and tell her she's wonderful. When she doesn't do extra, nothing happens; nobody says a word. She claims this is incoherent: either the extra stuff is something she ought to do, in which case we should treat skipping it as a violation and get on her case like we would with the assigned chores, or it's genuinely optional, in which case doing it is just a hobby like any other and shouldn't count toward our thinking of her as a good kid. She adds, rather gleefully, that she mostly does the extra when she wants something from us later, and says that proves it's really just bargaining dressed up as kindness. My gut says she's wrong on both counts, but I can't articulate why in terms she'd actually accept. Any advice for how to respond?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Problem:**
      *   **User:** Ancient Philosophy Teacher. This is crucial. They understand concepts like virtue ethics, duty, supererogation, reciprocity, and logical consistency. They speak the language of ethics.
      *   **Problem:** Their 15-year-old daughter has presented a philosophical challenge regarding household chores and "extra" efforts.
      *   **Daughter's Argument:** A false dilemma (either it's obligatory or it's meaningless/hobby) + a cynical motivation claim (it's just bargaining).
      *   **Goal:** Provide a response that validates the daughter's logical rigor (appealing to her intelligence) while correcting the ethical framework, using language the parent (philosophy teacher) understands but can translate for a teenager.

  2.  **Deconstruct the Daughter's Argument:**
      *   *Premise 1:* Actions are either Obligatory (Duty) or Optional (Indifferent/Hobby).
      *   *Premise 2:* If Obligatory, failure warrants punishment/criticism.
      *   *Premise 3:* If Optional, success warrants no special moral praise (just like a hobby).
      *   *Premise 4:* Her motivation is transactional (bargaining), proving it's not genuine kindness.
      *   *Conclusion:* The parents' reaction (praise for extra, silence for normal) is incoherent/hypocritical.

  3.  **Identify the Philosophical Flaws (for the Parent):**
      *   *False Dilemma:* She is ignoring the category of the **Supererogatory**. This is the key philosophical concept. Actions that are good to do but not wrong to omit.
      *   *Misunderstanding of Praise:* Praise isn't just for duty fulfillment; it's for character cultivation (Virtue Ethics).
      *   *Motivation vs. Action:* Even if the motivation is transactional now, the *habit* builds character (Aristotle). Also, relationships aren't purely Kantian duty or purely transactional; they are communal.
      *   *Family as Polis:* The family isn't a state (law/punishment) nor a marketplace (trade). It's a community of care.

  4.  **Drafting the Response Strategy:**
      *   **Acknowledge the Strength:** Start by validating the daughter. She's thinking like a philosopher (specifically a sophist or a strict deontologist). This builds rapport.
      *   **Introduce the Missing Category:** Explain "Supererogatory" actions in teen-friendly terms. (Above and beyond).
      *   **Address the "Hobby" Claim:** Why is unloading the dishwasher different from painting? Because it benefits the *community*, not just the self.
      *   **Address the Motivation/Bargaining Claim:** This is the trickiest part. Acknowledge the truth (yes, it can be transactional) but reframe the *value* of the action regardless of motive. Use Aristotle's habituation.
      *   **Reframe the Family Dynamic:** Move from Contract/Market to Community/Virtue.
      *   **Practical Script:** Give the parent actual words to say.

  5.  **Refining the Content (Iterative Process):**
      *   *Initial thought:* Tell them to read Aristotle's Nicomachean Ethics.
      *   *Correction:* No, she's 15. Keep it practical but intellectually respectful.
      *   *Key Concept:* The "Supererogatory." I need to make sure the parent knows this is the technical term, but the script should use "Above and Beyond."
      *   *Key Concept:* Virtue Signaling vs. Virtue Building. The daughter thinks praise is a "payment." The parent needs to frame praise as "recognition of character."
      *   *The "Bargaining" Point:* If she admits she does it to get something, she's right that it's transactional *sometimes*. But does that negate the good deed? No. But it does mean the parents should be careful not to be manipulated. However, the philosophical point is about the *nature* of the act, not just the motive. Actually, it's better to argue that *learning* to be generous often starts with transactional understanding and matures.
      *   *Wait, a better angle:* The daughter is applying a **Legalistic/Market** framework to a **Relational** context. That's the core error.

  6.  **Developing the Argument for the Parent:**
      *   **Point 1: The False Dichotomy.** Duty vs. Hobby misses "Gift/Grace."
      *   **Point 2: The Function of Praise.** Praise isn't a wage; it's encouragement of virtue.
      *   **Point 3: The Motivation.** Even if done for leverage, the act itself sustains the family. But we hope the motive evolves.
      *   **Point 4: The Family Contract.** Family isn't a court of law.

  7.  **Developing the Script for the Teen:**
      *   "You've caught a real philosophical puzzle."
      *   "There's a middle ground called 'Above and Beyond'."
      *   "Praise isn't payment, it's noticing."
      *   "On the bargaining: That's honest, but let's talk about why we do things for family."

  8.  **Final Polish:**
