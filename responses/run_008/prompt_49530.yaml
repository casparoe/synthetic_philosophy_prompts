answer: |-
  **The Scenario**

  The St. Ives Foundation runs an anonymous grant scheme using a countable infinity of sealed packets, indexed $n=0, 1, 2, \dots$. Packet $n$ contains two checks, one for $\$2^n$ and one for $\$2^{n+1}$. The Foundation selects packet $n$ with probability $\frac{1}{3}(\frac{2}{3})^n$, places the checks in identical envelopes, shuffles them, and hands you one. You may open your envelope, observe the amount $X$, and then decide whether to keep $X$ or switch to the other check $Y$ in the same packet. All amounts are finite, the probability distribution is standard and countable, and no agent predicts your choice.

  ***

  **Demonstration and Analysis**

  **1. The Symmetry Argument (Unconditional)**
  The setup is symmetric with respect to the envelopes; ex-ante, you are equally likely to hold the larger or smaller check of the selected pair. Thus, $E[X] = E[Y]$. However, calculating $E[X]$ yields:
  $$ E[X] = \sum_{n=0}^{\infty} \frac{1}{3}\left(\frac{2}{3}\right)^n \cdot \frac{1}{2}(2^n + 2^{n+1}) = \frac{1}{2} \sum_{n=0}^{\infty} \left(\frac{4}{3}\right)^n = \infty $$
  Since both $E[X]$ and $E[Y]$ are infinite, the unconditional expected gain $E[Y-X]$ is undefined ($\infty - \infty$). The symmetry argument is not refuted; it merely fails to yield a numerical verdict because the integrability condition for the Dominance Principle is violated.

  **2. The Pointwise Switching Calculation (Conditional)**
  Suppose you open the envelope and observe $X = 2^k$.
  *   **Case $k=0$ ($X=1$):** You must hold the smaller check of packet $n=0$. The other is $\$2$. Gain = $+1$.
  *   **Case $k \ge 1$:** You hold the smaller check of packet $k$ (prob $\propto (2/3)^k$) or the larger of packet $k-1$ (prob $\propto (2/3)^{k-1}$).
      The likelihood ratio is $\frac{P(\text{small}|X)}{P(\text{large}|X)} = \frac{(2/3)^k}{(2/3)^{k-1}} = \frac{2}{3}$.
      Normalizing, $P(\text{small}|X) = 2/5$ and $P(\text{large}|X) = 3/5$.
      The naive 50-50 premise is **false**.
      The conditional expected gain is:
      $$ E[Y-X | X=2^k] = \frac{2}{5}(2^k) - \frac{3}{5}(2^{k-1}) = \left(\frac{4}{5} - \frac{3}{5}\right)2^{k-1} = \frac{1}{5}2^{k-1} > 0 $$
      Specification (a) is met: for every observable amount, switching yields a strictly positive conditional expectation. Specification (c) is met: the naive probability assignment is wrong, but the recommendation to switch is locally correct.

  **3. Strategy Comparison and the Failed Inference**
  You have a strategy "Always Switch" that dominates "Always Stay" pointwise. Why not adopt it?
  The sharp student will argue: "The expected gain is the sum of positive terms: $\sum P(X=x) E[\text{gain}|X=x]$. Since every term is positive, the sum must be $+\infty$."
  **Correction:** This sum represents the *positive part* of the expectation of the difference variable $D = Y-X$. However, $D$ takes negative values when you switch from a larger to a smaller check. The expectation $E[D]$ is defined only if $\sum |d| P(D=d) < \infty$. Here, the sum of positive gains diverges to $+\infty$, and the sum of negative losses diverges to $-\infty$. The series is not absolutely convergent. Therefore, $E[D]$ does not exist as a number (not even infinity); it is undefined. The inference from "pointwise gain > 0" to "global expected gain > 0" fails because Fubini's Theorem conditions are not met.

  **4. Truncation and the "Leak"**
  Suppose the Foundation caps the packets at $n=N$. The distribution is now finite, and $E[X]$ is finite. Symmetry dictates $E[Y-X] = 0$. Where does the conditional argument break?
  It breaks at the maximum amount $X = 2^{N+1}$. If you see this, you know you hold the larger check (packet $N$); switching guarantees a loss of $2^N$.
  The conditional gain is positive for all $x < 2^{N+1}$ and negative for $x = 2^{N+1}$. The single negative term at the top balances the sum of all positive terms below.
  **Moral:** A player who has not opened the envelope cannot distinguish the truncated world from the untruncated one. However, the "Always Switch" logic implicitly assumes the tail continues forever. In the untruncated case, there is no "top" to balance the books, so the books never close.

  **5. The Strongest Defense (Conditional Rationality)**
  A stubborn student may argue: "Rationality is about maximizing utility given what you know. Given $X=x$, I know $E[Y|X=x] > X$. Therefore, I should switch. The ex-ante undefined expectation is irrelevant to the ex-post decision."
  **Reply:** This creates a dynamic inconsistency. If you commit to "Always Switch" before opening the envelope, you gain nothing (symmetry). If you pay a fee $\epsilon$ to switch after opening, you will pay it for every $x$, yet ex-ante you would not pay $\epsilon$ to switch blindly. A rational agent's ex-ante and ex-post preferences must cohere. If the ex-ante expectation is undefined, the conditional expectations cannot be aggregated into a coherent global preference ordering. You are locally right but globally incoherent.

  **6. Limitations of the Exhibit**
  This exhibit **cannot** reproduce the "humbler" version of the paradox where $E[X] < \infty$. In any distribution with finite mean, it is mathematically impossible for $E[Y-X | X=x]$ to be strictly positive for all $x$; there must be some amounts for which switching is unfavorable. This exhibit relies entirely on the heavy tails (infinite mean) to sustain the pointwise advantage. It solves the "infinite expectation" confusion but does not diagnose the pure probability error students make when they assume finite means.

  ***

  **50-Minute Session Plan**

  *   **0–10 mins (Pre-Work Reveal):** Distribute the scenario. Ask students to compute $P(\text{other is } 2X | X)$ and $P(\text{other is } X/2 | X)$ for a specific observed value (e.g., $\$4$). Most will guess 50-50. Reveal the correct 2/5 vs 3/5 split derived from the packet weights.
  *   **10–25 mins (The Local Win):** Have them calculate $E[\text{gain} | X]$. They will find it is always positive. Ask: "Should you switch?" Most will say "Yes." Ask: "Should you have switched before opening?" (Symmetry says no). Highlight the tension.
  *   **25–35 mins (The Global Break):** Walk through the unconditional expectation calculation. Show the divergence. Introduce the Truncation argument. Ask: "If I cap the max prize at $\$1$ million, where does your logic fail?" (At the $\$1$ million envelope).
  *   **35–45 mins (The Diagnosis):** Discuss the "Sum of Positives" fallacy. Explain that $\infty - \infty$ is not zero, it is undefined. Explain that Dominance requires finite expectations.
  *   **45–50 mins (Wrap-up):** Admit the limitation (this doesn't fix the finite-mean error). Assign office hours task: "Construct a distribution with finite mean where the naive 50-50 argument fails." (This directs them away from the infinity excuse and toward the probability error).
