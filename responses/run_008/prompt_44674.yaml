answer: |-
  This is a sophisticated problem of historiography disguised as a casual debate. Your friend is invoking a common heuristic, but as you suspect, it is doing too much heavy lifting. For a novelist, the distinction between "we cannot disprove it" and "we have reason to believe it" is the difference between a mystery and a fantasy.

  Here is an analysis of the distinct theses hidden within the slogan "absence of evidence is not evidence of absence," followed by an assessment of the Troy analogy, specifically tailored to help you calibrate the frame narrative of your novel.

  ### I. Deconstructing the Slogan

  The phrase is not a single argument but a container for three distinct logical and epistemological claims. They range from trivially true to highly contentious.

  #### 1. The Logical Truism
  *   **The Thesis:** Strictly logically, the proposition "X exists" does not entail "We have found evidence of X." Therefore, the proposition "We have not found evidence of X" does not logically contradict "X exists."
  *   **Defensibility:** **Unassailable.** In formal logic, unless the existence of X *necessitates* the production of evidence detectable by us (which historical figures rarely do), the lack of evidence is not a formal disproof.
  *   **Does it license belief?** **No.** It licenses only *logical possibility*. It proves that belief in Arthur is not *irrational* in the strict sense of contradicting known facts, but it provides no positive reason to think he *did* exist. It supports a stance of **radical agnosticism**, not historical probability.
  *   **Narrative Weight:** Low. This allows a character to say, "You can't prove he wasn't there," but it does not allow them to say, "He was likely there."

  #### 2. The Epistemic Gap (Preservation Bias)
  *   **The Thesis:** The mechanisms of historical transmission (writing, archaeology) are imperfect. In specific contexts (like Sub-Roman Britain), the probability of evidence surviving is so low that a negative search result is statistically insignificant.
  *   **Defensibility:** **Highly Defensible for Sub-Roman Britain.** We know literacy collapsed, stone was robbed from buildings, and organic material decays. If $P(\text{Evidence Survives} | \text{Arthur Existed})$ is near zero, then finding no evidence tells us very little.
  *   **Does it license belief?** **No.** It licenses **suspension of judgment.** It neutralizes the skeptic's strongest weapon (the silence of Gildas, the lack of inscriptions), returning the debate to a blank slate. It removes the penalty for believing, but it does not add a bonus.
  *   **Narrative Weight:** Medium. This allows your narrator to argue that the *silence itself* is a historical artifact of the era's chaos, rather than proof of Arthur's fictionality. It makes the "Dark Ages" a character that swallows truth.

  #### 3. The Bayesian Update
  *   **The Thesis:** In probability theory, absence of evidence *is* evidence of absence, but the *strength* of that evidence depends on how likely we were to find evidence if the hypothesis were true.
      *   Formulaically: If $P(E|H)$ (probability of Evidence given Hypothesis) is high, then $\neg E$ (No Evidence) drastically lowers the probability of $H$.
      *   If $P(E|H)$ is low (as in the Epistemic Gap above), then $\neg E$ only slightly lowers the probability of $H$.
  *   **Defensibility:** **Mathematically Correct.** This is the rigorous version of your friend's point.
  *   **Does it license belief?** **No.** In fact, it technically *lowers* the probability of Arthur's existence, just not to zero. Even with poor preservation, a 6th-century war leader of national significance *should* have left some trace in oral tradition that was written down sooner than 200 years later (Nennius), or in genealogies that weren't clearly fabricated later. The Bayesian update suggests Arthur is *less* likely than a figure with evidence, but *more* likely than a figure in a context where evidence usually survives (like a 15th-century king).
  *   **Narrative Weight:** High. This is the most honest position for a historian. It acknowledges that the silence hurts the case, but argues the wound isn't fatal.

  ### II. The Verdict on Your Friend's Argument

  Your friend is using the **Logical Truism** and the **Epistemic Gap** to smuggle in a conclusion that requires **Positive Evidence.**

  *   **Can it license believing in a historical Arthur?** No. None of these theses provide a positive reason to affirm existence. They only remove the logical barrier to *possibility*.
  *   **Can it license suspending judgment?** Yes. This is the maximum load the slogan can bear. It justifies treating Arthur as a *question* rather than a *fiction*, but not as a *fact*.

  If your frame narrative rests on the idea that "because we can't disprove him, we should treat him as real," the argument is weak. If it rests on "because the era swallows evidence, the lack of proof does not negate the *cultural truth* of the legend," the argument is strong.

  ### III. The Troy Analogy: Strength or Weakness?

  Your friend cites Troy to suggest that myths can be historically verified despite skepticism. However, a close examination of the archaeology of Troy actually **weakens** the case for Arthur. Here is why:

  #### 1. Specificity of Claim
  *   **Troy:** Homer's *Iliad* provided specific geographical data (the Hellespont), specific topographical data (two springs, one hot, one cold; proximity to the sea), and specific political data (a wealthy city controlling a strait). Schliemann didn't just dig randomly; he dug where the text told him to.
  *   **Arthur:** The early texts (Nennius, *Annales Cambriae*) provide battle names, but these are often common place-names (e.g., "River Douglas," "Cellidon Wood") found in multiple locations. There is no specific "Camelot" coordinate until much later romance literature.
  *   **Implication:** Troy was a **falsifiable hypothesis** that turned out to be true. Arthur is currently a **non-falsifiable hypothesis**. You cannot find Arthur if you don't know where to look.

  #### 2. Nature of the Discovery (Confirming vs. Compatible)
  *   **Troy:** Schliemann found a city that had been destroyed by fire and war in the correct chronological stratum (Troy VI/VIIa). This was **confirming evidence**. It matched the *specific* claims of the text (a war of destruction).
  *   **Arthur:** Archaeologists *have* excavated Sub-Roman sites (Wroxeter, South Cadbury, Birdoswald). They found fortifications, fire layers, and continuity of occupation. This is merely **compatible evidence**. It proves there *could* have been an Arthur, not that there *was*. It proves the *setting* was real, not the *protagonist*.
      *   *Crucial Distinction:* Proving Troy existed did not prove Achilles existed. It proved the *world* of Achilles existed. Similarly, proving the Battle of Badon happened (which Gildas confirms without naming Arthur) does not prove Arthur led it.
  *   **Implication:** The Troy analogy supports the idea that Sub-Roman Britain was a time of war and fortified hilltops (which we already know). It does not support the existence of a specific commander named Arthur.

  #### 3. The Silence of Contemporaries
  *   **Troy:** There are no contemporary written sources for the Trojan War. The silence is expected because it is the Bronze Age.
  *   **Arthur:** Sub-Roman Britain is the "Dark Ages" precisely because writing diminished, *but* we do have Gildas (*De Excidio et Conquestu Britanniae*), written within living memory of the Battle of Badon. Gildas names the villains and the heroes of the era but omits the greatest hero of all.
  *   **Implication:** The silence regarding Arthur is louder than the silence regarding Troy. In Troy's case, we expect no texts. In Arthur's case, we have a text that *should* mention him if he was the savior Gildas describes, and it doesn't.

  ### IV. Recommendations for Your Frame Narrative

  Your friend's argument is historically insufficient to prove Arthur, but it is **narratively fertile**. The tension between "absence of evidence" and "necessity of myth" is where your novel should live.

  1.  **Do not let the frame narrator conclude Arthur existed.** If the narrator uses the "Absence of Evidence" argument to conclude "Therefore, Arthur was real," the knowledgeable reader will lose trust in the narrator.
  2.  **Let the narrator conclude that the *uncertainty* is the point.** The frame narrative can argue that the *lack* of evidence is what allows the legend to function. If Arthur were proven as factually as Henry VII, he would cease to be a mythic vessel and become merely a king.
  3.  **Use the Troy analogy ironically.** A character might invoke Troy to bolster their belief, only for another character (or the narrative voice) to point out that Schliemann found a city, not a hero. This shows your research depth without halting the story.
  4.  **Focus on the "Epistemic Gap."** The most defensible historical position is that the era was chaotic enough to erase a man. Your novel can treat the "Dark Ages" not just as a setting, but as an active force that consumes history. The argument isn't "Arthur was there," but "The darkness is thick enough to hide him."

  **Summary:** Your friend's slogan licenses **agnosticism**, not **belief**. The Troy analogy proves that **settings** in legends can be real, not that **characters** are. For your novel, this is a gift: it allows you to treat Arthur as a historical possibility without being bound by historical facts, provided your narrator understands the difference.
