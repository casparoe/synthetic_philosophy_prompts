      *   Popperian view: If every failure is explained away by "boundary conditions," it's degenerating.
      *   Lakatosian view: Is the research program progressive? (Predicting new facts vs. explaining old ones).

  6.  **Formulate the Verdict:**
      *   The user is a software engineer. They understand overfitting and train/test splits. I should use that analogy.
