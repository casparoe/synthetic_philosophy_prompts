      *   **Constraints:** Rank defeaters (definitely change mind -> merely awkward). Distinguish what Turchin's camp would concede vs. dismiss. Assess falsifiability/insulation. *Commit to a verdict* on where the user is exposed (don't just list options).

  2.  **Deconstruct Cliodynamics & Turchin's Claims:**
