      *   **Methodology:** Mathematical modeling (differential equations), historical data proxying (e.g., height for welfare, nobility counts for elites).
      *   **Key Claim:** Secular cycles (long-term structural trends) + Father-son cycles (short-term instability). Prediction of US instability peaking around 2020.
      *   **Critiques:** Data quality (proxies are noisy), post-hoc fitting, determinism vs. agency, universality of mechanisms.

