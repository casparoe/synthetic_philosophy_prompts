  Based on the jurisprudence of your friend's past rulings, I shall offer a prediction, deduce the principle she appears to be applying, suggest a rival principle that fits the data equally well, and propose a test case to distinguish between them.

  ### The Prediction
  Your friend will likely rule that the AI installation is a **genuine and valuable work** by the artist.

  Her history demonstrates a consistent dismissal of the 'hand' as a criterion for value. She accepts Duchamp's *Fountain* (no handiwork), assistant-painted Vermeers (minimal handiwork), and conceptual pieces (no handiwork). What she rejects are *copies* (the replica after the fire, the molecule-perfect Monet) and *deceptions* (Van Meegeren). The AI case involves neither deception nor replication; it is a first instantiation of a concept, authorised by the artist. Since she values the *authority of conception* over the *labour of execution*, the curation and arrangement of the AI images should suffice for authenticity.

  ### The Apparent Rule: The Principle of Authoritative Instantiation
  The rule that best explains her six prior rulings is what we might call the **Principle of Authoritative Instantiation**.

  Under this rule, a work is genuine and valuable if it is the **first historical instance** of a specific artistic concept to be **authorised by the artist**.
  *   **Why it fits:** It explains why the Van Meegeren fakes fail (wrong authoriser), why the Monet duplicate fails (not the first instance), and why the post-fire replica fails (not the first instance, despite the correct authoriser). Crucially, it explains why Duchamp and the conceptual artists succeed: they were the first to authorise those specific objects or arrangements as art. The physical labour is irrelevant; the historical act of sanctioning the 'original' token is everything.

  ### The Rival Rule: The Principle of Specific Human Intent
  However, there is another rule that fits the existing six cases just as neatly, which would lead to the opposite verdict on the AI case. Let us call this the **Principle of Specific Human Intent**.

  Under this rule, a work is genuine only if the **specific aesthetic form** of the work was determined by a **human intention**.
  *   **Why it fits:** In the Vermeer/Assistant and Conceptual cases, the assistants executed a specific vision dictated by the artist. In Duchamp's case, the *selection* was the specific intention (the form of the urinal was irrelevant, the act of choosing *that* urinal was the intent). In the Van Meegeren and Replica cases, the specific form was either dictated by the wrong person or dictated by the past rather than a present intention.
  *   **The Divergence:** In the AI case, the specific pixel arrangement is determined by the model's weights and stochastic processes, not the artist's specific intent. The artist intends a *prompt*, but not the *image*. If your friend adheres to this rule, she must reject the AI work, as the specific form originated in the machine, not the human mind.

  ### The Decisive Test Case
  To determine which rule governs your friend's thinking, you should present her with the following scenario:

  **The Case of the Blind Delegation:**
  > An artist hires a skilled painter but gives them no instructions regarding the subject, composition, or colour. The artist simply says, "Paint a canvas however you wish, and I will claim it." The painter produces a unique image. The artist then signs it, exhibits it under their own name, and claims it as the realisation of their concept of 'total freedom'.

  *   **If she accepts this as genuine:** She follows the **Principle of Authoritative Instantiation**. The artist's sanction is sufficient, regardless of who determined the specific form. Consequently, she **will accept the AI work**.
  *   **If she rejects this as genuine:** She follows the **Principle of Specific Human Intent**. The artist must dictate the specific form, even if they do not paint it themselves. Consequently, she **will reject the AI work**.

  Given her acceptance of Duchamp, I suspect she will side with the former, but the 'Blind Delegation' case removes the shield of 'curation' and tests whether her tolerance for delegated execution has a limit.
