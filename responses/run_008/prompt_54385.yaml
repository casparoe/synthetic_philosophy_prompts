answer: |-
  You have identified one of the most profound and counterintuitive concepts in epistemic game theory. The phenomenon you are describing is the distinction between **Mutual Knowledge** and **Common Knowledge**.

  Your intuition is correct: there is a formal, established name for this, and it is not merely a matter of degree but of kind. The difference explains why the seminar students stayed home and why the private protest organization failed.

  Here is a breakdown of the concept, why the infinite regress is mathematically necessary, and how theorists reconcile this with human cognitive limits.

  ### 1. The Definitions: Mutual vs. Common Knowledge

  Let $p$ be the proposition "The seminar is cancelled."
  Let $N$ be the set of agents (students).
  Let $K_i p$ denote "Agent $i$ knows $p$."

  **Mutual Knowledge (Level 1):**
  Everyone knows $p$.
  $$ \forall i \in N, K_i p $$
  In your seminar example, by evening, every student had received an email. Mutual knowledge was achieved.

  **Common Knowledge:**
  Everyone knows $p$, everyone knows that everyone knows $p$, everyone knows that everyone knows that everyone knows $p$, ad infinitum.
  $$ C(p) = K_i p \land K_i K_j p \land K_i K_j K_k p \land \dots $$
  In the website scenario, the cancellation is posted publicly. It is not just that everyone sees it; it is that everyone sees *that everyone else has the opportunity to see it*.

  ### 2. Why Finite Levels Do Not Suffice

  You asked why no finite number of levels ("I know that you know...") is enough. This is best illustrated by the **Coordination Game** structure underlying your examples.

  Imagine the payoff structure for the seminar:
  *   **Both show up:** Waste of time (-1, -1)
  *   **Both stay home:** Saved time (1, 1)
  *   **One shows, one stays:** Embarrassment/Isolation (-10, 0)

  To stay home safely, I need to know you will stay home. To know you will stay home, I need to know that *you* know the seminar is cancelled. But that isn't enough. I need to know that *you know that I know* the seminar is cancelled.

  Why? Because if you know it's cancelled, but you think *I might not know*, you might worry that *I* will show up. If you worry I will show up, you might decide to show up too (to avoid being the only one absent, or out of duty). If I suspect you might think that, I cannot be sure you will stay home.

  **The Cascade of Doubt:**
  With every finite level of knowledge, there is a "border" where the chain stops.
  *   If knowledge stops at Level 1 (I know, but don't know if you know), I assume you might come.
  *   If knowledge stops at Level 2 (I know you know), I worry that you don't know *I* know, so you might think *I* will come, so you might come.
  *   If knowledge stops at Level $k$, there is a hypothetical state of the world at the edge of your reasoning where the chain broke at $k-1$, causing uncertainty at $k-2$, all the way down to action.

  In formal terms, this is captured by **Rubinstein's Email Game** (1989). This model is almost exactly your seminar scenario. Two players want to coordinate, but they must communicate via email to confirm. Emails might get lost.
  *   Rubinstein proved that if there is *any* non-zero probability of message failure, **Common Knowledge is never achieved** via a finite chain of confirmations.
  *   Shockingly, the unique equilibrium in this game is often for players to **never coordinate**, even if they have exchanged 100 confirmation emails. The uncertainty at the "edge" of the finite chain unravels the certainty all the way back to the start via backward induction.

  ### 3. The Role of the "Public Event"

  You noted that a public announcement (website post, rally) works where private messages do not. In epistemic logic, this is because public announcements generate Common Knowledge **in one step**, bypassing the infinite chain.

  A public event has a specific structural property: **Simultaneity and Transparency.**
  When the lecturer posts on the website, the model assumes:
  1.  Everyone accesses the same source.
  2.  Everyone knows everyone else accesses the same source.
  3.  The event of posting is observable by all simultaneously.

  This creates a **fixed point**. Instead of building knowledge iteratively ($K_i K_j \dots$), a public signal establishes the condition $E(p) \implies C(p)$ (If everyone knows $p$ via a public signal, then $p$ is Common Knowledge).

  In the protest example:
  *   **Private chats:** I know you are protesting. But I don't know if *you* know that *I* know that *you* know. I fear you think I'm the only one, so you back out.
  *   **Public Rally:** I see you in the crowd. You see me in the crowd. I see that you see me. The physical co-presence creates the infinite hierarchy instantly.

  ### 4. Bounded Rationality: How Do Humans Do It?

  You raise a critical objection: *"How theorists model agents who plainly cannot run an infinite chain of reasoning."*

  You are right; human brains cannot compute infinite conjunctions. Game theorists handle this in two ways:

  **A. Common Knowledge as a Primitive**
  In many models, Common Knowledge is not something agents *calculate*; it is a property of the **environment**. We assume the "rules of the game" and "rationality" are common knowledge by assumption. We don't model the cognitive process of verifying it; we model the equilibrium that results if it holds. It is an idealization, like frictionless planes in physics.

  **B. Approximate Common Knowledge (p-belief)**
  More advanced literature (e.g., Monderer and Samet, 1989) acknowledges that strict Common Knowledge is fragile (as seen in Rubinstein's Email Game). They introduce **$p$-belief**.
  *   Agent $i$ $p$-believes $E$ if they assign probability at least $p$ to $E$.
  *   **Approximate Common Knowledge:** Everyone $p$-believes $E$, everyone $p$-believes that everyone $p$-believes $E$, etc.
  *   **Theorem:** If $p$ is high enough (close to 1), agents will coordinate *as if* they had Common Knowledge, even if they don't strictly have it.

  This explains your intuition. In the seminar case, the chain email felt "risky" (low $p$). The website post felt "certain" (high $p$). When the probability of the signal being received is sufficiently high, the infinite regress converges quickly enough that bounded rational agents treat it as Common Knowledge.

  ### 5. Summary of the Distinction

  | Feature | Mutual Knowledge (Chain Email) | Common Knowledge (Website/Rally) |
  | :--- | :--- | :--- |
  | **Definition** | $\forall i, K_i p$ | $C(p)$ (Infinite hierarchy) |
  | **Generation** | Iterated private signals | Public, simultaneous signal |
  | **Coordination** | Fails (due to unraveling) | Succeeds (equilibrium selection) |
  | **Fragility** | High (one broken link breaks the chain) | Low (robust to individual noise) |
  | **Cognitive Load** | Requires tracking depth of recursion | Treated as a environmental fact |

  ### 6. Suggested Terminology

  Since you asked for a name if one didn't exist (though one does), it is worth noting that while **Common Knowledge** is the standard term, the specific *failure* you described in the seminar scenario is often referred to in Computer Science and Distributed Systems as the **Coordinated Attack Problem** or the **Two Generals Problem**.

  In that context, it is a theorem that **Common Knowledge cannot be achieved over an unreliable channel.** Your seminar chain email was an unreliable channel (students might forget to forward, emails might go to spam). The website was a "reliable broadcast."

  ### Conclusion

  The difference you sensed is **qualitative**, not quantitative. It is the difference between a distributed state (everyone happens to have the data) and a systemic state (the data is part of the shared context of the group).

  *   **Mutual Knowledge** allows me to predict your action based on the world.
  *   **Common Knowledge** allows me to predict your action based on *your prediction of my action*.

  In coordination games, the latter is required. The infinite chain is not a bug of the theory; it is the mathematical representation of the requirement that there be no "edge" to our reasoning where doubt can enter. When you saw the website post, you didn't just learn the seminar was cancelled; you learned that the *social reality* of the class had shifted. The chain email only updated your private information.

  **Recommendation for further reading:**
  1.  **David Lewis, *Convention* (1969):** The philosophical origin of Common Knowledge.
  2.  **Ariel Rubinstein, "Modeling Bounded Rationality" (specifically the Email Game):** For the formal proof of why finite confirmations fail.
  3.  **Michael Chwe, *Rational Ritual*:** This book applies Common Knowledge specifically to your second example (protests, rallies, advertising) and explains why public ceremonies are necessary for social coordination. It is highly accessible and directly addresses your "protest" scenario.
