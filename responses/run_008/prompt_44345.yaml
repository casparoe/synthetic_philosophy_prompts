  **FreshChoice Markets – Customer Care & Ethical Sourcing FAQ**

  **Updated: October 14, 2023**

  **Q: Recent campaigns ask FreshChoice to "name the trait" that justifies selling pork but not dog meat. What is that trait?**

  **A:** At FreshChoice, we do not reduce complex supply chain relationships to single-variable metrics. Our sourcing decisions are based on a holistic framework of historical domestication roles, cultural nutritional standards, and regulatory classifications established by the USDA. We are committed to maintaining distinct categories between companion animals and livestock based on centuries of agricultural consensus. To isolate a specific biological characteristic would be to ignore the broader socio-economic ecosystem that ensures food security for our communities. We believe in honoring traditional boundaries while pursuing continuous improvement across all species in our supply chain.

  **Q: Is moral agency or intelligence the criteria for protection from consumption?**

  **A:** Cognitive complexity is certainly a factor in how communities value different life forms. Generally, we prioritize species that demonstrate higher-order reasoning or reciprocal social contracts. However, it is vital to clarify that this metric is not applied uniformly across all biological humans. For example, human infants or individuals with severe cognitive impairments do not currently possess these specific markers of agency. Therefore, we must adjust the criteria to include "species-typical potential" or "inherent human dignity" regardless of functional capacity. To be clear: we are not suggesting intelligence is the sole determinant, as that would inadvertently exclude vulnerable human populations who cannot sign contracts or understand moral reciprocity. We value all human life irrespective of cognitive throughput. Please disregard any implication that functional intelligence is the primary threshold for moral protection within human demographics.

  **Q: Activists argue that if you cannot name a trait without excluding some humans, you are being speciesist. How do you respond?**

  **A:** We appreciate rigorous ethical inquiry. However, during recent town halls, when this line of questioning was extended to compare livestock to humans with severe disabilities, we observed that the discussion often reached an impasse. While the logical consistency is noted, equating supply chain categories with vulnerable human family members creates significant discomfort for all parties involved, including the advocates. We do not facilitate comparative assessments of human vitality. Our position is that while the logical tension exists, the practical application of removing all animal products based on this comparison ignores the nuanced reality of human biological exceptionalism. We ask that customers respect the quiet moments that occur when this comparison is made explicit in public forums.

  **Q: Will FreshChoice stop selling meat until a consistent trait is identified?**

  **A:** We are constantly evaluating our product mix to align with evolving customer values. However, until a consensus is reached that satisfies both ethical rigor and nutritional accessibility without compromising human dignity standards, we will continue to offer a balanced selection of protein sources. We remain dedicated to transparency, provided that transparency does not require us to resolve philosophical contradictions that have persisted throughout human history.

  ***

  **Note on the Philosophy**

  You haven't garbled the argument. What you are describing is a popularized version of the **Argument from Marginal Cases** (AMC), often framed by activists as "Name the Trait" (NTT). Your understanding of the mechanics is accurate: if you justify eating animals based on trait *X*, and some humans lack *X*, you must either accept eating those humans or admit *X* isn't the real reason.

  However, for your own reading, here are the contested areas the FAQ leans on:

  1.  **The "Traits" Assumption:** The argument assumes moral status *must* supervene on specific individual capacities (intelligence, agency). Some philosophers (e.g., communitarians or care ethicists) argue moral status comes from relationships or species membership itself. They would say "being human" is a valid moral category, not a biological excuse. NTT proponents call this speciesism; opponents call it a valid moral community boundary.
  2.  **The "Panic" Move:** In the FAQ, the PR writer pivots to "species-typical potential" or "inherent dignity." This is a real philosophical counter-argument (the "Kind Argument"). It argues that humans deserve protection based on the kind of being they are, even if they currently lack capacities. Critics say this is special pleading; proponents say it's necessary to protect disabled humans without relying on arbitrary traits.
  3.  **The Activist Cringe:** You asked to include the awkwardness for activists. This references the fact that while the logic holds, many people (including vegans) find the explicit comparison of disabled humans to livestock intuitively repulsive. Some philosophers argue that if an argument leads to a conclusion that violates deep moral intuitions about human dignity, the argument might be missing something, even if it is logically valid.

  You're wrestling with one of the hardest problems in ethics. The fact that you're losing the argument to yourself suggests you're taking the logic seriously, which is exactly where the discomfort comes from.
