  9.  **Final Polish:** Ensure clear headings and direct answers to the user's specific questions ("Which step...", "What does rejecting it cost...", "Is there a slide...").

      *(Wait, one more thing)*: The housemate's argument is basically the "Instrumental Convergence" + "Goodhart" combo leading to "Shutdown Problem." But applied to *everything*. The key is that human systems have *natural* damping mechanisms (resources run out, people complain) whereas AI might not. I should mention that.

