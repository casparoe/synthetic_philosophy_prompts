          *   "Worse than not optimizing" is a claim about *net utility*, not just *alignment error*.
          *   Vaccines: Proxy = antibody count/mortality reduction. Goal = health. Goodhart might mean we ignore mental health while focusing on physical, but we aren't *dead* because of the vaccine. We are alive longer.
      *   **Address the Slide between (2) and (3):**
          *   (2) describes mechanisms. (3) claims they *always* dominate.
          *   This is the "Smoothness" assumption. In reality, proxies are often *robust* within a certain range (the "region of linearity" or "safe operating envelope").
          *   Optimization pressure isn't a binary "on/off." It's a continuum. We can stop *before* the extremal region.
      *   **The Cost of Rejecting (4):**
