prompt: |-
  I'm a second-year physics and philosophy student, and our Philosophy of Physics module has just spent a fortnight on the applicability of mathematics. Our tutor keeps invoking Wigner's slogan — the unreasonable effectiveness of mathematics in the natural sciences — to do real argumentative work. Last week he ran through his stock of examples: Dirac's equation written to tame the electron and then obligingly predicting the positron; Riemann developing his geometry decades before general relativity had any use for it; group theory sorting the particle zoo before the detectors confirmed the missing entries. He took these not as lucky accidents but as something demanding explanation, and drew a platonist moral: mathematics succeeds because it describes a realm of structure that the physical world somehow participates in.

  I can't tell whether the slogan, once made precise, actually supports any of this, and I have three worries I can't resolve on my own. First, my flatmate says there's an obvious selection effect: physicists rummage through a vast attic of pure mathematics and quietly shelve the pieces that don't fit, so the slogan confuses the numerator with the fraction. Second, someone in the seminar mentioned a riposte essay about the unreasonable *ineffectiveness* of mathematics in biology, which, if the contrast is real, suggests the phenomenon is local to physics — though I can't see whether that locality would support platonism or undercut it. Third, I've since come across a later essay arguing that we deliberately pose only the questions mathematics is good at; but the positron case seems untouched by that, since Dirac wasn't shopping for a question.

  Could you lay out the distinct precise claims the slogan could be making — from the near-trivial to the radical — and say of each whether it is plausible, whether it is really a substantive claim about the world rather than about our practices, and whether it would support my tutor's argument from unexplained success to platonism? I'd also like to know which reading Wigner himself needed for his talk of miracle to make sense, and whether the positron and Riemann cases are equally good evidence for whichever reading survives. Please answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year Physics and Philosophy student.
      *   **Context:** Philosophy of Physics module, specifically the applicability of mathematics.
      *   **Tutor's Stance:** Uses Wigner's "Unreasonable Effectiveness" to argue for Platonism (maths describes a realm of structure the physical world participates in).
      *   **User's Worries:**
          1.  Selection effect (we ignore maths that doesn't work).
          2.  Ineffectiveness in biology (is the phenomenon local?).
          3.  Question framing (we ask questions maths can answer vs. Dirac's prediction).
      *   **Task:**
          1.  Lay out distinct precise claims the slogan could make (trivial to radical).
          2.  Evaluate plausibility for each.
          3.  Evaluate if it's substantive (about the world) or pragmatic (about practice).
          4.  Evaluate if it supports the tutor's Platonist argument.
          5.  Identify which reading Wigner himself needed for his "miracle" claim.
          6.  Assess whether the positron and Riemann cases are equally good evidence for the surviving reading.
      *   **Constraint:** Answer in British English.

  2.  **Deconstruct Wigner's Argument:**
      *   Eugene Wigner's 1960 paper "The Unreasonable Effectiveness of Mathematics in the Natural Sciences".
      *   Core intuition: It is mysterious that abstract mathematical concepts developed without empirical intent turn out to be indispensable for formulating physical laws.
      *   Wigner's conclusion: It is a "miracle" or a "wonderful gift which we neither understand nor deserve." He explicitly says there is no rational explanation. He does *not* explicitly argue for Platonism in the text, though Platonists often co-opt it. He leans towards a mystification rather than a metaphysical commitment.

  3.  **Drafting the Distinct Claims (The Ladder of Strength):**
      *   *Claim 1 (Trivial/Definitional):* Physics uses maths because we define physics as the mathematisable part of nature. (Pragmatic).
      *   *Claim 2 (Selection Effect):* We try many maths, keep the ones that work. (Empirical/Historical).
      *   *Claim 3 (Constraint/Structure):* The world has structure, and maths is the study of structure, so they match. (Structural Realism).
      *   *Claim 4 (Platonist/Pre-established Harmony):* Mathematical truths exist independently and physical reality is built from them. (Metaphysical).

      *Refining the Claims for the Prompt:*
      *   *Reading A (The Tautology):* Mathematics is effective because we only call it 'physics' if mathematics applies.
      *   *Reading B (The Selection Effect):* We discard ineffective mathematics; we only remember the hits.
      *   *Reading C (The Structural Match):* The physical world possesses a logical structure isomorphic to mathematical structures.
      *   *Reading D (The Pythagorean/Platonist):* The physical world is *constituted* by mathematical objects.

  4.  **Evaluating the Claims against the User's Worries:**
      *   *Worry 1 (Selection Effect):* Attacks Reading B. If true, it undermines the "miracle."
      *   *Worry 2 (Biology):* Suggests effectiveness is domain-specific. If maths works in physics but not biology, maybe physics is just the "simple" part we carved out. Supports Reading A or B.
      *   *Worry 3 (Question Framing):* Suggests we tailor questions to methods. Dirac counters this because the prediction was unexpected.

  5.  **Addressing Wigner's Intent:**
      *   Wigner was not a Platonist in the strict sense. He was agnostic/mystified. He called it a "miracle." For a miracle to exist, the effect must be real and unexplained by selection or definition. So he needs at least Reading C, leaning towards D, but he stops short of ontological commitment.

  6.  **Assessing the Evidence (Positron vs. Riemann):**
      *   *Dirac/Positron:* Maths led to empirical discovery. Strong evidence for "active" guidance.
      *   *Riemann/GR:* Maths existed, physics caught up later. Strong evidence for "pre-existence."
      *   *Comparison:* Both support the "unreasonableness," but Dirac is stronger against the "question framing" objection.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the question. Set the stage (Wigner's 1960 paper).
      *   **Section 1: Four Readings of the Slogan.** (From trivial to radical).
          *   For each: Plausibility, Substantive vs. Pragmatic, Support for Platonism.
      *   **Section 2: Addressing the Three Worries.** (Selection, Biology, Framing).
      *   **Section 3: Wigner's Own Stance.** (Miracle vs. Metaphysics).
      *   **Section 4: The Evidence (Dirac vs. Riemann).**
      *   **Conclusion:** Summary advice for the student.
      *   **Language Check:** Ensure British English (e.g., "maths", "centre", "realise", "favour").

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure not to conflate Structural Realism with Platonism. Structural Realism (Reading C) can be epistemic. Platonism (Reading D) is ontological. The tutor argues for Platonism, so I need to show which reading gets him there.
      *   *Correction on Wigner:* Be careful not to say Wigner *was* a Platonist. He famously said the miracle "bordered on the mysterious." He didn't offer Platonism as the *solution*, but as a *possible* sentiment. The tutor is extrapolating.
      *   *Biology Point:* Mention that biology might be too complex or historically contingent, whereas physics deals with fundamental laws. This nuances the "ineffectiveness" argument.
      *   *Dirac Point:* Emphasise that Dirac wasn't looking for the positron; the maths forced it upon him. This counters the "we ask questions maths can answer" worry.

  9.  **Final Polish (British English):**
