      *   *Refined Principle:* **"Contextual Proportionality and the Mob Threshold."**
      *   *Core Idea:* Individuals have the right to disassociate (Case 4), but when individual choices coordinate into a collective force that mimics state power (Case 5), they inherit a duty of fairness usually reserved for courts (proportionality, evidence, rehabilitation). Also, power matters (Case 3 vs 2).

