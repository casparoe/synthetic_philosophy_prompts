answer: |-
  You have hit on one of the most frustrating intersections between computer science, philosophy, and economics. Your intuition is excellent: from a pure "truth preservation" standpoint, if you have the axioms and a sound theorem prover, the theorems are "there."

  However, your confusion stems from conflating **logical validity** (is the conclusion true?) with **epistemic state** (does the agent possess the conclusion *in a usable form* at the time of decision?).

  In engineering terms: Standard epistemic logic treats knowledge derivation as an operation with $O(1)$ time complexity and zero energy cost. In reality, it is often undecidable, NP-hard, or simply too expensive to compute before the deadline.

  Here is the breakdown of why logical omniscience is still a "live" problem, specifically tailored to your background.

  ### 1. The Cryptography Connection (The Knockout Argument)
  You mentioned this sounded off to you, but it is actually the strongest argument against logical omniscience. Cryptography does not rely on secrets being *logically* hidden; it relies on them being *computationally* hidden.

  **The Setup:**
  *   Agent $A$ has a ciphertext $C$.
  *   Agent $A$ knows the public key $PK$ and the encryption algorithm $Enc$.
  *   $C = Enc(PK, m)$.

  **The Logical Omniscience Model:**
  In standard epistemic logic (like S5), knowledge is closed under logical consequence.
  1.  $A$ knows $C$.
  2.  $A$ knows the mathematical definition of $Enc$.
  3.  Therefore, $A$ knows the logical consequences of $C$ and $Enc$.
  4.  Since $m$ is a logical consequence of $C$ (given enough compute to invert the function), the logic dictates $A$ **knows** $m$.

  **The Reality:**
  If your formal model assumes the adversary "knows" the plaintext because they possess the ciphertext and the algorithm, **your security proof collapses immediately.** You cannot prove semantic security in a logic where possession of the ciphertext implies knowledge of the plaintext.

  **Why Hardware Doesn't Fix It:**
  Even if you give the agent a supercomputer, modern crypto relies on problems (like factoring or discrete logs) that are believed to be intractable. If you model the agent as logically omniscient, you are effectively modeling them as having infinite compute. If you do that, **no public-key cryptography exists.**

  To model crypto formally, you have to use **Computational Epistemic Logic**, where "knowing" is indexed by complexity classes (e.g., "A knows $\phi$ in polynomial time"). The "problem" of logical omniscience is the recognition that standard logic cannot express the fundamental premise of modern security.

  ### 2. The Economics Problem: The "No Trade" Theorem
  This is where the "wrong predictions" part comes in. In mechanism design and game theory, agents act based on their knowledge state.

  **The Scenario:**
  Imagine a high-frequency trading market. Two agents, Alice and Bob, have access to the same raw data feed (the "axioms").
  *   **Omniscient Model:** Since both have the same data and are perfectly rational (closed under logical consequence), they both derive the exact same valuation of the asset instantly. If they agree on the price, **no trade occurs.** (This is a variation of the Milgrom-Stokey No Trade Theorem).
  *   **Bounded Model:** Alice thinks she can find a pattern in the data faster than Bob. Bob thinks he can interpret the data better than Alice. They trade because they have different *computational states* regarding the same data.

  **The Prediction Failure:**
  If you build an economic model using standard epistemic logic (omniscient agents), you predict **zero speculative volume** in efficient markets.
  In reality, markets have massive volume.
  Why? Because derivation is costly. Agents are not trading on "truth"; they are trading on "who can solve the SAT problem faster."

  If you treat agents as omniscient, you cannot model **latency arbitrage**, **mining pools**, or **MEV (Maximal Extractable Value)**. These phenomena exist *solely* because knowledge is not instantaneous. An agent who "knows" all consequences of the blockchain state instantly cannot be front-run. Since front-running exists, the omniscient model is descriptively false.

  ### 3. Undecidability and Resource Rationality
  You mentioned Lean and model checkers. These tools are amazing, but they have limits that map directly to the philosophical problem.

  *   **First-Order Logic is Undecidable:** There is no algorithm that can determine if an arbitrary formula is a consequence of a knowledge base. An omniscient agent in FOL would need to solve the Halting Problem. If you model an agent as knowing all consequences of their FOL knowledge base, you are modeling an agent that can solve the Halting Problem. That's not just an engineering hurdle; it's a mathematical impossibility.
  *   **Propositional Logic is NP-Complete:** Even if you restrict yourself to propositional logic (like SAT solvers), finding a derivation is NP-complete.
  *   **Resource Rationality:** In software architecture, you don't precompute every possible query result. You cache what's likely to be needed. An intelligent agent must decide *what* to derive.
      *   *Omniscient Agent:* Derives everything. Cost = Infinite.
      *   *Bounded Agent:* Derives $\phi$ only if the expected utility of knowing $\phi$ exceeds the CPU cost of deriving it.

  If you model the agent as omniscient, you remove the **meta-reasoning** problem (deciding what to think about). For an AI safety engineer, this is critical. We want agents that know *when* to stop thinking and act. Standard epistemic logic forces them to keep thinking until they know everything.

  ### 4. Explicit vs. Implicit Knowledge
  Philosophers distinguish between:
  *   **Implicit Knowledge:** The information is contained in your database (axioms).
  *   **Explicit Knowledge:** The information has been retrieved and loaded into the register (derived).

  Your intuition is that a theorem prover turns implicit knowledge into explicit knowledge. That is true. But the *state change* matters.

  **Concrete Example:**
  Imagine a distributed system with a consensus protocol (like Paxos or Raft).
  *   **Node A** knows `value = 5`.
  *   **Node A** knows `if value = 5 then crash`.
  *   **Omniscient Logic:** Node A knows `crash`. It triggers the safety protocol immediately.
  *   **Real System:** Node A is waiting on a CPU cycle. The message queue is full. It hasn't run the inference rule yet. It crashes *before* triggering the protocol.

  If you verify the system assuming logical omniscience, you might prove the system is safe. But in deployment, the latency of inference causes a race condition. The "problem" of logical omniscience is the acknowledgment that **inference takes time**, and in distributed systems, time is the enemy.

  ### Summary: Where the Confusion Lies
  You are viewing logical omniscience as a **capacity** problem ("humans are slow, computers are fast").
  The field treats it as a **structural** problem ("derivation changes the state of the agent and costs resources").

  1.  **Crypto:** If agents are omniscient, encryption is impossible. Security *requires* bounded rationality.
  2.  **Economics:** If agents are omniscient, markets freeze. Liquidity *requires* differences in computational speed/state.
  3.  **Verification:** If agents are omniscient, you ignore inference latency. Safety *requires* accounting for the time it takes to "know."

  ### The Engineering Fix
  You asked if we've "solved" this. In formal methods, we actually have. We don't use standard S5 epistemic logic for system verification anymore. We use:
  *   **Algorithmic Knowledge:** Knowledge is defined by the output of a specific algorithm running on the agent's hardware.
  *   **Awareness Logic:** Agents have a "syntactic awareness" set. They only know what they are aware of, even if it's a logical consequence of what they know.
  *   **Bounded Rationality Models:** Agents maximize utility subject to computational constraints (e.g., $Utility - Cost(Compute)$).

  So, you are right that *engineering* provides the tools to manage the derivation. But the *philosophical problem* remains vital because if you use the wrong logic (the omniscient one) to specify your system requirements, you will specify a system that cannot exist (perfect crypto) or behaves nothing like reality (liquid markets).

  The "problem" isn't that we can't build the theorem prover. It's that if you assume the agent *already used it*, your model of the world breaks.
