answer: |-
  Here are 10 conversational interview questions drafted for your notes. They're designed to be read naturally, with specific follow-up instructions based on the answers you're most likely to get.

  **1. The Representation Gap**
  "You argue that a lottery gives every adult an equal shot at power, which feels intuitively fairer than an election. But I want to dig into what 'representation' actually means here. A random chamber might match the population demographically, but why should I assume that guarantees my interests are actually being fought for? Statistical representativeness isn't quite the same thing as having someone in the room actively advocating for you."
  *   **Likely Reply:** He'll lean on "descriptive representation"—the idea that people who look like you or share your background will naturally understand your needs better.
  *   **Follow-up:** "I get that empathy matters. But in a random draw, you're still going to get wealthy people drawn by chance. Does a randomly selected rich man represent poor people's interests just because the chamber *as a whole* has the right share of poor people in it? Or does his individual voting power still skew toward his own class?"

  **2. The Accountability Problem**
  "Let's talk about accountability. The one great virtue of elections is that if a politician messes up or sells out, you can throw the bums out next cycle. In a lottocracy, everyone serves a fixed term and then leaves. What's your replacement for that mechanism? How do we punish bad behavior if the next lottery doesn't penalize the specific people who messed up?"
  *   **Likely Reply:** He'll likely argue that short terms plus internal peer review or transparency measures replace the need for re-election pressure.
  *   **Follow-up:** "But without the threat of losing their job, what stops a legislator from coasting or taking quiet bribes? If 'the next lottery' resets the room regardless of performance, where's the actual consequence for the individual who betrayed the public trust?"

  **3. Competence and Reluctance**
  "My instinct is that a lottery chamber would be staffed largely by people who lack legislative experience and, honestly, by people who never wanted the job in the first place. You've mentioned this would be like jury duty plus deliberative citizen assemblies. But do those ad hoc experiments in Europe tell us anything about handing *permanent* legislative power to a chamber of the reluctant?"
  *   **Likely Reply:** He'll argue that staff support and expert briefings level the playing field, just like in jury duty.
  *   **Follow-up:** "That leads to the curation problem. If these citizens rely on briefings to make decisions, who selects the experts and facilitators that guide them? If the bureaucracy controls the information flow, haven't we just shifted the power from elected officials to unelected staff?"

  **4. The Epistemic Claim**
  "I want to press on your epistemic argument—the idea that ordinary people deliberate better than career politicians. If that's true, doesn't it show we should weight the opinions of ordinary citizens in polls more heavily than we do now? Why do we need a physical chamber if the wisdom is already in the population?"
  *   **Likely Reply:** He'll likely distinguish between raw poll numbers and informed deliberation, arguing the process matters more than the initial opinion.
  *   **Follow-up:** "Okay, but if the process is what matters, would you take a randomly selected panel's judgment over a specialist's on highly technical issues? For example, would you trust a citizen panel to set the right interest rate over a career economist at the Federal Reserve?"

  **5. Transition and Self-Protection**
  "Let's look at the transition. Whatever body sets up the first lottocratic chamber has immense power over how the rules are written. What stops the lottery from being quietly gamed by whoever runs that transition? How do we ensure the random draw is actually random and not influenced by the people setting up the machine?"
  *   **Likely Reply:** He'll probably suggest an independent constitutional convention or a bipartisan commission to oversee the setup.
  *   **Follow-up:** "But who selects that commission? It feels like we're kicking the can down the road. If the people designing the lottery have political interests, what stops them from rigging the pool of candidates so the 'random' draw favors their side?"

  **6. The Role of Parties**
  "One thing elections do is organize people into coalitions—we call them parties. They're messy, but they help voters understand what they're buying. If you scrap elections, do political parties just vanish? And if they do, how do you coordinate legislation without them?"
  *   **Likely Reply:** He'll argue parties are the problem and that coalitions will form naturally around specific bills.
  *   **Follow-up:** "Without parties to whip votes or negotiate compromises ahead of time, don't you risk total gridlock? How do you get a thousand random people to agree on a budget without some kind of organized leadership structure?"

  **7. Conflict with the Executive**
  "Most systems have a separation of powers. If we have a random legislature but still keep an elected President or Prime Minister, don't you create a legitimacy crisis? Why should an elected executive listen to a random legislature, or vice versa?"
  *   **Likely Reply:** He might suggest the executive becomes subordinate to the legislature, or that the executive should also be sorted.
  *   **Follow-up:** "If the executive is elected and the legislature is random, the President can claim 'the people chose me' while the legislature claims 'we are the people.' In a standoff, who wins? Doesn't that invite authoritarianism?"

  **8. Crisis Management**
  "Deliberation takes time. Juries can take weeks to reach a verdict. But in a national emergency—like a pandemic or a financial crash—government needs to move fast. Can a random body really pivot quickly enough, or does the need for briefing and debate make them too slow for crises?"
  *   **Likely Reply:** He'll say emergency powers can be delegated to committees or executives with oversight.
  *   **Follow-up:** "But if you delegate emergency power, haven't you just recreated the unchecked executive authority we have now? How do you balance speed with the deliberative benefit you're promising?"

  **9. Historical Precedent**
  "We know sortition was used in Athens and some Renaissance cities, but modern nations abandoned it centuries ago. Why did we stop doing this? Was it just an oversight, or did previous generations find a fatal flaw we're forgetting?"
  *   **Likely Reply:** He'll argue scale was the issue previously, and technology now solves it.
  *   **Follow-up:** "If technology is the key, does that mean this system only works in the digital age? And if so, doesn't that make us vulnerable to the same digital manipulation—hacking, deepfakes, misinformation—that's hurting our current elections?"

  **10. Public Buy-In**
  "Finally, even if this works on paper, would people accept it? Voters like feeling they have a choice. If you tell them they can't vote for their representative anymore, even if the system is fairer, don't you risk a massive legitimacy gap?"
  *   **Likely Reply:** He'll argue people hate the current system so much they'd welcome a change.
  *   **Follow-up:** "But polling shows people hate Congress but like their own representative. Are you sure they're ready to give up the power to choose *their* person, even if the current choices are bad? How do you sell the loss of agency?"
