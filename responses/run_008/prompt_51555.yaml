  3.  **Brainstorm Candidate Theories (Mental Draft):**
      *   *Symbol Grounding (Harnad):* Symbols need connection to the world. Text CAPTCHAs look like symbols, but distorted. Image CAPTCHAs look like grounding (pixels to objects).
      *   *Language of Thought (Fodor):* Computation over symbols. If a machine solves it via computation, does it understand? CAPTCHA designers assume "no."
      *   *Turing Test/Behaviorism:* If it acts human, it is human. CAPTCHA is a reverse Turing Test.
      *   *Embodied Cognition:* Perception is for action. Clicking boxes is sensorimotor.
      *   *Statistical/Connectionist:* It's just data distribution. Humans generalize better from less data?
      *   *The "Engineering Bet":* It's not philosophical, it's just computational complexity.

  4.  **Evaluate Candidate Theories against the Practice:**
      *   *Grounding:* Image CAPTCHAs fit well (pixels $\to$ traffic light). Text CAPTCHAs fit less well (pixels $\to$ character $\to$ concept?).
      *   *Pattern Recognition:* Fits both. But is pattern recognition *understanding*? Searle would say no (Chinese Room). CAPTCHA designers seem to think it *is* the marker of humanity.
      *   *Engineering Bet:* This is the most charitable and likely accurate view of the *designers*, but the *philosophical import* comes from how we interpret that bet.

  5.  **Address the "Strict Requirement vs. Underdetermination" Distinction:**
      *   *Strict Requirement:* The system must be computationally harder for machines than humans *now*.
      *   *Underdetermination:* *Why* is it harder? Is it because machines lack qualia? Lack grounding? Lack specific training data? The practice doesn't specify. It works equally well if machines lack souls or just lack GPU hours.

  6.  **Address Consistency Across Task Types:**
      *   *Text (OCR-resistant):* Relies on noise tolerance in symbol recognition. Closer to syntactic manipulation under degradation.
      *   *Image (Semantic):* Relies on category membership (traffic lights). Closer to semantic grounding.
      *   *Behavioral (Mouse movement):* Relies on motor control/embodiment.
      *   *Tension:* Text suggests "perception of symbols," Image suggests "perception of world." Are these the same cognitive capacity?

  7.  **Address the "Passing the Test" Scenario:**
      *   If AI solves CAPTCHAs:
          *   *View A (Grounding):* Refuted? Or did the AI actually ground symbols? (Searle: No, still syntax.)
          *   *View B (Engineering):* Not refuted, just outdated. The barrier moved.
          *   *View C (Turing):* If they pass, they are human-like. The test worked too well.
      *   *Crucial Point:* CAPTCHA is an *empirical* claim about current tech, not a *principled* claim about metaphysics. This is the weak spot for a philosophy seminar.

