      *   *Revised Entrepreneur Mechanic:* They get a "Grant." They lose points for mismatching, but their personal score doesn't matter (or they get reimbursed). No, that's hidden.
      *   *Better:* They have **"Vouchers."** If they play Blue and match a Red player, they can hand over a Voucher. The Red player turns it in for 10 points. The Entrepreneur loses a Voucher. This makes the subsidy *visible* to the recipient, creating a focal point. "Why did this person give me points for playing Blue?"

  8.  **Final Polish:**
      *   Ensure the debrief connects specifically to Lewis's *Convention: A Philosophical Study*.
      *   Make sure the "Strictly Worse" condition is mathematically clear.
      *   Check timing. 90 mins is tight. Keep instructions crisp.

      *(Self-Correction on Timing)*: 90 minutes is very tight for 3 phases + debrief.
      *   Phase 1: 15 mins.
      *   Phase 2: 20 mins.
      *   Phase 3: 25 mins.
      *   Debrief: 30 mins.
      *   Setup/Transition: 10 mins.
      *   Total: 100 mins. I need to cut 10 mins.
