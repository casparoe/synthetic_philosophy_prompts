      *(One more check on the "Newcomers")*: The prompt says "a wave of newcomers joins... who only ever see the inherited convention."
      *   I need to make sure the Veterans *know* the Newcomers are Newcomers.
      *   Actually, the power of the convention is that the Veterans treat the Newcomers as if they should know the rule.
