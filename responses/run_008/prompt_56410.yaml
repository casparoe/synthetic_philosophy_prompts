prompt: |-
  I help run a monthly rationality meetup — about 18 regulars, most of whom have been reading LessWrong and the Scott Alexander blogosphere for years. They can already recite Schelling on focal points and give the standard summary of Lewis's Convention, so I don't want yet another activity that just re-illustrates that conventions solve coordination problems. What I want is an activity that makes them feel the two harder facts: that a convention is held together by nothing but mutual expectations (I keep conforming because I expect you to conform, and you conform because you expect me to), and that an entrenched convention can keep winning even after it becomes strictly worse for everyone than an available alternative.

  We have one 90-minute session, movable furniture, whiteboards, and no appetite for real-money stakes. Design a game with roughly this arc, filling in the details: repeated play with rotating partners out of which some convention emerges and entrenches itself without anyone announcing it; then a payoff shift that makes the entrenched convention dominated; then a displacement phase, in which a few participants are quietly assigned norm-entrepreneur roles with limited and costly moves for seeding the alternative, and a wave of newcomers joins who never saw the original coordination problem and only ever see the inherited convention. Give me the rules, materials, a point- or token-based payoff scheme, and a minute-by-minute timeline. Then a debrief that maps what actually happened onto the formal machinery — the recurring coordination problem, salience, the conformity condition, and the asymmetry between how little it takes to create a convention and how much coordinated expectation-shifting it takes to replace one. Tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which feature of Lewis's account no one-shot classroom game can reproduce and I'll have to supply by hand.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Target Audience:** Rationality meetup regulars (approx. 18 people). High familiarity with LessWrong, Scott Alexander, Schelling, Lewis. They know the theory; they need the *experience*.
      *   **Core Learning Objectives:**
          1.  Conventions are held together *only* by mutual expectations (self-fulfilling prophecy).
          2.  Entrenched conventions persist even when strictly dominated by alternatives (path dependence/lock-in).
      *   **Constraints:** 90 minutes, movable furniture, whiteboards, no real money (tokens/points).
      *   **Required Arc:**
          1.  Emergence phase (repeated play, rotating partners, unannounced convention).
          2.  Payoff shift (entrenched convention becomes dominated).
          3.  Displacement phase (norm entrepreneurs, costly moves, "newcomers" who only see the inheritance).
      *   **Deliverables:** Rules, materials, payoff scheme, minute-by-minute timeline, debrief guide, prediction of failure modes, limitation acknowledgment.

  2.  **Deconstruct the Theory (Lewis/Schelling):**
      *   *Coordination Problem:* Multiple equilibria.
      *   *Convention:* A regularity in behavior + mutual expectation + preference to conform *given* the expectation.
      *   *Lock-in:* The cost of switching individually is high, even if the collective switch is beneficial.
      *   *Salience:* What makes one equilibrium stand out initially?
      *   *Common Knowledge:* Everyone knows, everyone knows everyone knows...

  3.  **Brainstorming the Game Mechanic:**
      *   *Idea 1: Driving side of the road.* Too abstract, hard to simulate payoff shifts.
      *   *Idea 2: Meeting time/place.* Too meta for a meetup.
      *   *Idea 3: Signaling/Color coordination.* Classic. Pick a color. If you match, you get points.
      *   *Idea 4: The "Handshake" or "Gesture" game.* People pair up and choose a gesture.
      *   *Idea 5: Number Selection.* Pick a number. Match = points.
      *   *Selection:* **Color/Symbol Coordination** is the cleanest for quick rounds. Let's make it slightly more complex to allow for "costly signaling" later. Let's use **Card Selection** from a limited deck. It allows for physical tokens and clear visibility.
      *   *Refinement:* To capture the "strictly worse" aspect, we need a Phase 1 equilibrium (e.g., "Red") and a Phase 2 superior equilibrium (e.g., "Blue"), but switching from Red to Blue is risky if others stay Red.
      *   *Refinement for "Newcomers":* We need a mechanic where new players enter and are punished for not following the old rule, even if the old rule is now bad.

      *   *Game Concept: "The Signal Protocol"*
      *   Players pair up. They secretly choose a card (Signal A or Signal B).
      *   If they match, they get points. If they mismatch, they get 0 (or penalty).
      *   Phase 1: Signal A is slightly easier/better. Convention forms around A.
      *   Phase 2: Payoffs change. Signal B is now objectively better for *everyone*, but only if both switch.
      *   Phase 3: "Norm Entrepreneurs" get special abilities to try to shift the group. "Newcomers" enter who don't know the history.

      *   *Critique:* Simple matching games often solve too fast. We need *friction*. We need the "expectation" part to be the glue.
      *   *Better Mechanic:* **Asymmetric Coordination with Memory.**
      *   Let's use a "Greeting Ritual" mechanic.
      *   Pairs meet. They must perform one of 3 rituals (e.g., Handshake, Fist Bump, Wave).
      *   Success requires matching.
      *   To make it "strictly worse," we need a cost associated with the ritual itself.
      *   *Revised Mechanic:* **The Token Exchange.**
      *   Players have two types of tokens: Gold and Silver.
      *   In a round, you offer one token to a partner.
      *   If you offer the *same* token type, the trade succeeds (high payoff).
      *   If different, trade fails (low payoff).
      *   *Twist:* One token type is "expensive" to acquire/hold, the other is "cheap."
      *   *Phase 1:* Gold is cheap, Silver is expensive. Everyone coordinates on Gold.
      *   *Phase 2:* Economics flip. Silver is now cheap/valuable, Gold is expensive/costly. But everyone expects Gold.
      *   *Phase 3:* Entrepreneurs can subsidize Silver. Newcomers arrive.

      *   *Wait, simpler is better for 90 mins.* Let's go with **The "Standard" Game** (inspired by Krasner/ Lewis examples).
      *   **Action:** Choose Left or Right (or A/B).
      *   **Payoff:** Coordination pays. Miscoordination pays nothing.
      *   **Cost:** One option has a hidden "effort cost" that changes.
      *   **Visibility:** You see your partner's choice *after* the round.
      *   **Rotation:** You play many people.

      *   *Let's finalize the mechanic:* **"The Protocol Game"**
      *   Players choose a "Protocol" (Alpha or Beta).
      *   Pair up. Reveal choices.
      *   Match = Points. Mismatch = 0.
      *   *Crucial Detail:* To make it "strictly worse," the Alpha protocol needs a *tax* in Phase 2.
      *   *Implementation:* Players hold cards. Alpha = Red, Beta = Blue.
      *   Phase 1: Red/Red = 10 pts. Blue/Blue = 10 pts. Mismatch = 0. (Red is salient for some reason, e.g., "Red is the default").
      *   Phase 2: Red/Red = 5 pts. Blue/Blue = 10 pts. Mismatch = 0. (Red is now dominated).
      *   Phase 3: Introduce "Ambassadors" (Entrepreneurs) and "Tourists" (Newcomers).

      *   *Wait, the prompt asks for "mutual expectations" to be felt.*
      *   If I just tell them the payoffs, they will calculate. I need them to *infer* the convention.
      *   *Modification:* Don't announce the payoffs fully. Let them learn by doing.
      *   *Actually, for rationalists, knowing the payoffs is better to highlight the irrationality of sticking to the bad equilibrium.* If they know Blue is better but still play Red, the tension is higher.
      *   *Decision:* Open information on payoffs, closed information on *what others will do*.

      *   *Addressing the "Newcomers" requirement:*
      *   We need to swap players out or add roles.
      *   Let's have 18 players.
      *   Phase 1 & 2: All 18 play.
      *   Phase 3: 6 "Veterans" stay. 6 "Entrepreneurs" (from the Veterans) get special powers. 6 "Newcomers" (actually the other Veterans playing a specific role) enter who are told "Just follow the crowd."
      *   *Correction:* The prompt says "a wave of newcomers joins who never saw the original coordination problem."
      *   Okay, I need to simulate newcomers. Since I only have 18 people, I must assign roles.
      *   Role A: Incumbents (12 people).
      *   Role B: Entrepreneurs (3 people, subset of Incumbents or separate?). Let's make them separate roles assigned secretly.
      *   Role C: Newcomers (6 people).
      *   Total 18.

      *   *Refining the "Strictly Worse" mechanic:*
      *   It needs to be costly to play the old convention.
      *   Let's use a **Tax**.
      *   Convention A (Red): Payoff 10, but Cost 5. Net 5.
      *   Convention B (Blue): Payoff 10, Cost 0. Net 10.
      *   If you play Red and partner plays Blue: Payoff 0, Cost 5. Net -5.
      *   This creates a Prisoner's Dilemma-ish feel *on top of* the Coordination game. It's a "Stag Hunt" with a tax on the Stag everyone is hunting.

  4.  **Drafting the Plan:**

      *   **Title:** "The Red Tax Protocol."
      *   **Materials:** Red/Blue cards, score sheets, tokens (poker chips), timer.
      *   **Timeline:**
          *   0-10: Setup & Theory Brief (keep it short, they know it).
          *   10-30: Phase 1 (Emergence). Red is salient.
          *   30-50: Phase 2 (The Shift). Red gets taxed. Lock-in demonstrated.
          *   50-75: Phase 3 (Displacement). Entrepreneurs + Newcomers.
          *   75-90: Debrief.

      *   **The "Newcomer" Trick:**
          *   Newcomers need to be incentivized to follow the convention they *observe*, not the optimal one.
          *   Instruction to Newcomers: "You don't know the history. You just want to match. Observe what the majority seems to be doing."
          *   Actually, better: Newcomers are told "The established protocol is the safe bet."

      *   **The "Entrepreneur" Trick:**
          *   They need "costly moves."
          *   Ability: They can play Blue and *guarantee* a match payoff even if the partner plays Red (subsidizing the loss), OR they can publicly announce intent.
          *   Let's go with **Subsidy**. If an Entrepreneur plays Blue against a Red player, the Red player still gets the Blue payoff (Entrepreneur pays the difference from their own score). This makes switching safe for the incumbent.

      *   **Failure Modes:**
          *   *Too fast:* They switch to Blue immediately in Phase 2.
          *   *Fix:* Make the "Tax" on Red apply only if *both* play Red? No, that makes it a pure coordination game. The tax must be on the *action* of playing Red.
          *   *Risk:* If I play Red and you play Blue, I pay the tax and get 0. That's a huge penalty. That creates risk aversion.
          *   *Better:* The "Tax" is a membership fee. You pay it at the start of the round if you hold the Red card.
          *   *Wait, to ensure lock-in:* The risk of mismatch must outweigh the gain of switching.
          *   Payoff Matrix Phase 2:
              *   Red/Red: 10 points each. (But Red has a hidden cumulative cost? No, needs to be per round).
              *   Let's stick to the prompt: "Strictly worse for everyone."
              *   Red/Red = 5 pts. Blue/Blue = 10 pts. Mismatch = 0.
              *   Why stick to Red? Because if I think you will play Red (prob > 50%), my EV for Red is higher.
              *   To make it sticky: Add a **Switching Cost**. If you played Red last round, playing Blue this round costs 20 points (one time).
              *   *Actually, the prompt asks for "mutual expectations" not switching costs.* The lock-in must be purely expectation-based.
              *   So: Red/Red = 5. Blue/Blue = 10. Mismatch = 0.
              *   Why doesn't everyone switch? Because if I switch and you don't, I get 0. If I stay and you stay, I get 5. As long as P(You stay) > 0.5, I stay.
              *   To make this happen: We need high confidence in the old convention. Phase 1 must be long enough to build strong priors.

      *   **Refining Phase 3 (Newcomers):**
          *   We need to physically swap people or change instructions.
          *   Let's designate 6 people as "New Cohort." They sit out Phase 1 & 2. They enter Phase 3.
          *   They are told: "Join the group. Coordinate." They will see the Veterans playing Red. They will play Red.
          *   Entrepreneurs (3 people) are told: "Your goal is to shift the group to Blue. You have a budget of 'Trust Tokens'."
          *   Trust Token: If you play Blue and partner plays Red, you can spend a Token to give them the Blue payoff (10 pts) instead of 0. You lose the Token.
          *   This models "burning capital to signal" or "subsidizing the transition."

  5.  **Addressing the "Lewis Limitation":**
      *   What can't a game reproduce? **Common Knowledge over time.**
      *   In real life, conventions persist over years. In a game, it's 90 mins.
      *   Also, **Preferential Independence:** Lewis says I prefer to conform *because* you conform, not necessarily because the act itself is good. In a game, the points are the only utility. I need to emphasize in the debrief that in real life, the "points" are social capital, safety, etc.
      *   Most importantly: **The "Arbitrariness" of the initial salience.** In the game, I (the GM) might accidentally make Red salient. In reality, salience is often historical accident. I need to acknowledge I rigged the salience in Phase 1.

  6.  **Writing the Details:**
      *   *Tone:* Professional, facilitator-ready, acknowledging the audience's sophistication.
      *   *Structure:* Follow the prompt's requested sections.
      *   *Check:* Did I cover the "mutual expectations" feeling? Yes, by making the mismatch penalty high relative to the gain of the superior equilibrium.
      *   *Check:* Did I cover the "newcomers"? Yes, by swapping players.
      *   *Check:* Did I cover "norm entrepreneurs"? Yes, via Trust Tokens.

  7.  **Self-Correction/Review during drafting:**
      *   *Issue:* 18 people is a lot for pairing. 9 pairs per round.
      *   *Rotation:* Need a system to ensure they mix. "Clockwise rotation" or "Random draw." Random draw is better to prevent cliques.
      *   *Scoring:* Needs to be visible. Public leaderboard creates social pressure (part of the convention).
      *   *Phase 2 Risk:* If they are *too* rational, they might coordinate on switching simultaneously.
