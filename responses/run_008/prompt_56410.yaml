answer: |-
  # Activity Design: "The Red Tax Protocol"

  **Objective:** Experientially demonstrate that conventions are (1) sustained purely by mutual expectations of conformity, and (2) resistant to change even when strictly dominated by alternatives, requiring costly signaling and generational turnover to displace.

  **Audience:** 18 Rationality Meetup Regulars (High theory literacy, low tolerance for "basic" coordination games).
  **Time:** 90 Minutes.
  **Materials:**
  *   36 Index Cards (18 Red, 18 Blue). *Crucial: In Phase 1, distribute Red cards to everyone initially to create artificial salience.*
  *   Poker chips or paper tokens (for scoring).
  *   Whiteboard (for public leaderboard).
  *   6 "Newcomer" Instruction Sheets (handed out only in Phase 3).
  *   3 "Entrepreneur" Secret Role Cards (handed out only in Phase 3).
  *   Timer.

  ---

  ## Part 1: The Rules & Payoff Structure

  **The Core Mechanic:**
  Players pair up. Each holds a Red and a Blue card. In each round, they secretly select one card and reveal simultaneously.
  *   **Match (Red/Red or Blue/Blue):** Coordination success.
  *   **Mismatch (Red/Blue):** Coordination failure.

  **The Payoff Scheme (Token Points):**
  *   **Phase 1 (Emergence):**
      *   Match: +10 tokens.
      *   Mismatch: 0 tokens.
      *   *Salience Hack:* Hand everyone a **Red** card face-up on the table to start. Tell them "This is your default identity."
  *   **Phase 2 (The Lock-In):**
      *   Red/Red Match: +4 tokens. (The "Taxed" Equilibrium)
      *   Blue/Blue Match: +10 tokens. (The Superior Equilibrium)
      *   Mismatch: 0 tokens.
      *   *Constraint:* **No talking between rounds.** Players must rely solely on observed history.
  *   **Phase 3 (Displacement):**
      *   Payoffs remain as Phase 2.
      *   **Talking is allowed.**
      *   **Newcomers:** 6 players swap in (or are designated). They have no history.
      *   **Entrepreneurs:** 3 players are secretly assigned. They receive 5 "Subsidy Vouchers."
      *   **Voucher Rule:** If an Entrepreneur plays Blue and matches a Red player (which is normally a mismatch/0 points), they can surrender a Voucher to grant the partner the Blue payoff (10 points). The Entrepreneur gets 0. This makes switching *safe* for the incumbent.

  ---

  ## Part 2: Minute-by-Minute Timeline

  | Time | Phase | Activity | Facilitator Notes |
  | :--- | :--- | :--- | :--- |
  | **00-05** | **Setup** | Seating & Theory Brief. | Arrange chairs in two concentric circles (inner/outer) for easy rotation. Briefly state: "We are simulating Lewisian conventions. Do not discuss strategy unless allowed." |
  | **05-15** | **Phase 1** | **Emergence (5 Rounds).**<br>Rotate partners every round.<br>Payoff: Match = 10. | Hand everyone a **Red** card face-up initially. "Start with Red." <br>After Round 1, let them choose freely.<br>*Goal:* Rapid convergence on Red/Red. |
  | **15-20** | **Transition** | Announce Payoff Shift. | "Economics have changed. Red matches now pay 4. Blue matches pay 10. Mismatch is 0."<br>**Rule:** No talking between rounds. Record scores. |
  | **20-40** | **Phase 2** | **Lock-In (6 Rounds).**<br>Rotate partners.<br>Payoff: Red=4, Blue=10. | Watch the group cling to Red despite the lower payoff.<br>If they switch too fast, extend rounds. If they stall, remind them Blue is objectively better *if matched*.<br>*Goal:* Frustration. They know Blue is better but fear mismatch. |
  | **40-45** | **Transition** | **The Shake-Up.** | Stop play. 6 "Veterans" sit out (become observers). 6 "Newcomers" take their seats (use the instruction sheets).<br>Secretly hand 3 "Entrepreneur" cards to 3 of the remaining Veterans. |
  | **45-70** | **Phase 3** | **Displacement (6 Rounds).**<br>Payoff: Red=4, Blue=10.<br>Talking Allowed. | Entrepreneurs try to shift the norm using Vouchers.<br>Newcomers try to copy the majority.<br>Veterans react to the new signals.<br>*Goal:* A messy transition where Blue eventually wins, but at a cost. |
  | **70-90** | **Debrief** | **Mapping to Theory.** | Whiteboard session. Connect experience to Lewis/Schelling. |

  ---

  ## Part 3: Role Instructions (Printable)

  **For Newcomers (Phase 3):**
  > "You are new to this group. You have no history with them. Your goal is to maximize your points. Look at what the majority of players seem to be doing and follow the crowd. You do not know why they do it, only that it seems to work for them."

  **For Entrepreneurs (Phase 3 - Secret):**
  > "Your goal is to shift the group convention from Red to Blue. You have 5 Subsidy Vouchers. If you play Blue and your partner plays Red, you may surrender a Voucher to pay them 10 points (as if they matched Blue). You earn 0 for that round. Use these to reduce the risk of switching for others. Do not reveal your role unless necessary."

  **For Veterans (Phase 3):**
  > "Payoffs remain the same (Red=4, Blue=10). Some new people have joined. You may talk between rounds."

  ---

  ## Part 4: The Debrief (Mapping Experience to Theory)

  *Do not just ask "How did it feel?" Map their answers to the formal machinery.*

  **1. The Nature of the Convention (Phase 1)**
  *   **Ask:** "Why did we coordinate on Red in Phase 1? Was it written in the rules?"
  *   **Theory:** **Salience.** The physical card handed to them created a focal point.
  *   **Lewis Point:** The convention wasn't "Red is better." It was "Red is *expected*."

  **2. The Lock-In (Phase 2)**
  *   **Ask:** "In Phase 2, Blue was strictly dominant (10 vs 4). Why did we stay on Red?"
  *   **Theory:** **The Conformity Condition.** I prefer to conform *given that I expect you to conform*.
  *   **Math:** If $P(\text{Partner plays Red}) > 0.4$, then $EV(\text{Red}) > EV(\text{Blue})$.
  *   **Key Insight:** The convention persisted not because it was good, but because the *expectation* of its persistence made it rational to maintain. This is the "self-fulfilling prophecy" glue.

  **3. The Displacement (Phase 3)**
  *   **Ask:** "What broke the lock? Was it the Newcomers or the Entrepreneurs?"
  *   **Theory:** **Common Knowledge & Costly Signaling.**
  *   **Newcomers:** They didn't have the "Red expectation" priors. They were wildcards.
  *   **Entrepreneurs:** They absorbed the cost of mismatch (burning Vouchers). This signaled commitment.
  *   **Lewis Point:** Conventions are asymmetric. Creating one requires only salience. Destroying one requires **coordinated expectation-shifting**. You had to make it *common knowledge* that others were willing to switch.

  **4. The "Strictly Worse" Reality**
  *   **Ask:** "Did anyone feel angry playing Red in Phase 2?"
  *   **Theory:** **Path Dependence.** Real-world examples: QWERTY keyboards, legacy code, social norms that harm the group but protect the individual from ostracization.

  ---

  ## Part 5: Predictable Failure Modes & Fixes

  **1. The "Over-Rational" Group (Phase 2 Collapse)**
  *   **Risk:** Since they are rationalists, they might say "We all know Blue is better. Let's all switch now."
  *   **Fix:** Enforce the **No Talking** rule strictly in Phase 2. If they signal via eye-rolls or nods, call it out. The friction *must* exist. If they still switch too fast, increase the Red payoff to 8 (making the gap smaller) in future runs, or add a "Switching Penalty" (lose 20 points if you play Blue after playing Red previously).
  *   **Better Fix:** Tell them "You cannot verify what others will do. Trust is not guaranteed."

  **2. The "Entrepreneur Burnout"**
  *   **Risk:** Entrepreneurs run out of Vouchers too fast and give up.
  *   **Fix:** Give them 10 Vouchers instead of 5. Remind them privately: "Your score doesn't matter, the group shift matters."

  **3. The "Newcomer Confusion"**
  *   **Risk:** Newcomers ask "What's going on?" and Veterans explain the whole history, dissolving the information asymmetry.
  *   **Fix:** Instruct Veterans: "You cannot explain the history. You can only argue for Red or Blue based on current utility."

  **4. Time Overrun**
  *   **Risk:** Debrief eats into social time.
  *   **Fix:** Hard stop at 85 minutes. Send the "Lewis Point" summary via email afterwards if needed.

  ---

  ## Part 6: The Honest Limitation (What This Game Cannot Do)

  *Be explicit about this in the debrief.*

  **The Limitation: Deep Common Knowledge & Time.**
  "In this game, the convention lasted 20 minutes. In reality, conventions persist for generations. The game cannot reproduce the **weight of history**.
  *   **Lewis's Account:** Lewis argues that for a convention to truly exist, it must be *common knowledge* that everyone prefers to conform *because* everyone conforms.
  *   **The Gap:** In this room, you knew I (the GM) could change the rules. In the real world, the 'rules' are often opaque or decentralized. You trusted me to tally scores. In reality, enforcement is often peer-punishment, which we didn't simulate (we used GM enforcement).
  *   **The Missing Piece:** **Preferential Independence.** In the game, you wanted points. In reality, you often conform to conventions *even when you hate the points*. You conform to avoid social sanction. We simulated this with '0 points for mismatch,' but real social pain is harder to simulate without actual stakes. I am supplying that 'social pain' by asking you to imagine the frustration you felt was actually *ostracization*."

  **Closing Prompt for the Group:**
  "Look at the norms in this very meetup. Which ones are 'Red'? Which ones are 'Blue' waiting to happen? And who has to burn the Vouchers to switch them?"
