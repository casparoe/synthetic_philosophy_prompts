      *   *Entrepreneurs:* Need to be secretly assigned? If they announce themselves, it becomes a negotiation. If secret, it's signaling. Let's make them **Secret**. They know they are entrepreneurs, others don't. They signal by playing Blue and absorbing the loss (or using tokens).
