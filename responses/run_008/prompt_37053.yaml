answer: |-
  You have independently reconstructed one of the most persistent and difficult problems in contemporary meta-ethics and philosophy of mind, known as the **Wrong Kind of Reasons (WKR) problem**. Your intuition that there is a "line" is widely shared by philosophers like T.M. Scanlon, Pamela Hieronymi, and Derek Parfit, though pinning down the principle that draws it has proven notoriously difficult.

  Your tentative principle is a version of the **Fittingness Account**: an attitude is rational only if supported by reasons that make the attitude *fit* its object (truth for belief, danger for fear, etc.). Pragmatic benefits (money, threats) are "state-given" reasons—they favor *having* the state of mind, but not the attitude itself.

  However, your two counter-cases (the Promise and the Grandmother) threaten to break this line. To give you a precise principle that handles your test case and identifies the weakest link, we must refine the distinction between types of attitudes.

  ### The Principle: The Constitutive Question Constraint

  The most coherent principle that captures your core verdicts while handling the exceptions is not about "objects" per se, but about the **constitutive aim** or **question** that defines each attitude.

  > **Principle:** A consideration counts as a reason *for* an attitude if and only if it bears on the constitutive question that the attitude answers.
  > *   **Belief** answers: *"Is it true?"* (Pragmatic benefits do not make propositions true.)
  > *   **Emotion** answers: *"Is this fitting?"* (Pragmatic benefits do not make objects dangerous, admirable, or funny.)
  > *   **Intention** answers: *"What is to be done?"* (Pragmatic benefits *do* bear on what is to be done.)

  This principle explains why your "line" holds for belief and emotion but breaks for intention.

  #### 1. Why the Promise Case Works (and the Tyrant Case Fails)
  You feel the promise gives you a reason to *intend*, while the tyrant gives no reason to *admire*. Under the Constitutive Question Constraint, this is consistent.
  *   **Admiration** is a **receptive** attitude. It registers value. The tyrant's threat does not make him valuable; it merely makes the *state of admiring* beneficial. Therefore, it fails the constitutive question ("Is he admirable?").
  *   **Intention** is a **volitional** commitment. It is a plan for action. The constitutive question of intention is practical: "What should I do?" or "What should I commit to?" A promise creates an obligation, and obligations are practical reasons. Therefore, the promise *does* bear on the question "What is to be done?" (Answer: "Intend to finish, because you promised.").

  #### 2. The Grandmother Case (The Weakest Link)
  You asked which verdict is the weakest link. It is the **Grandmother verdict**.
  Your intuition is that her request gives you a reason to *feel warmth*. However, to maintain a coherent principle, you should surrender the claim that it gives you a reason for the *feeling itself*.
  *   **Why:** Warmth (like admiration or fear) is a receptive emotion. Its constitutive question is "Is he warm-worthy?" The grandmother's request does not make the uncle warm-worthy.
  *   **The Correction:** The request gives you a decisive reason to **try to cultivate** warmth, or to **act warmly**, or to **not suppress** warmth if it arises. It is a reason to *manage* the attitude, not a reason that makes the attitude *correct*.
  *   **Why it's the weakest link:** It is psychologically easy to confuse "reasons to cultivate a feeling" with "reasons for the feeling." We often say "I should love my family," but philosophically, this is a duty to *attend* to them in ways that might generate love, not a magic switch that makes love fitting regardless of their character. Surrendering this verdict saves the Fittingness Account for all emotions.

  #### 3. The Gambler Test Case
  *Case:* A gambler pays a service to donate to a hated cause unless she quits betting, thereby trying to give herself a reason to intend to quit.
  *   **Verdict:** She **does** have a reason to *intend* to quit, but this is not a "wrong kind" reason in the problematic sense.
  *   **Analysis:** Because intention answers the practical question ("What is to be done?"), the avoidance of the hated donation is a valid practical reason to form the intention.
  *   **Nuance:** Note that she also has an object-given reason to *quit* (preventing the donation). The Ulysses contract changes the stakes of the *action*. Since intentions track actions, the pragmatic pressure translates into a valid reason for the intention. This aligns with the Promise case: intentions are sensitive to pragmatic consequences in a way beliefs and emotions are not.

  ### Summary of Verdicts

  | Case | Attitude | Source of Reason | Verdict | Why? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Billionaire** | Belief | Payment | **No Reason** | Payment doesn't make belief *true*. |
  | **Tyrant** | Admiration | Threat | **No Reason** | Threat doesn't make tyrant *admirable*. |
  | **Dog** | Fear | Dangerousness | **Reason** | Danger makes fear *fitting*. |
  | **Callousness** | Guilt | Culpability | **Reason** | Culpability makes guilt *fitting*. |
  | **Jokes** | Amusement | Payment | **No Reason** | Payment doesn't make jokes *funny*. |
  | **Promise** | Intention | Obligation | **Reason** | Obligation bears on *what to do*. |
  | **Grandmother** | Warmth | Request | **No Reason*** | *Reason to cultivate, not for the feeling itself.* |
  | **Gambler** | Intention | Self-Threat | **Reason** | Consequences bear on *what to do*. |

  ### Conclusion

  Your line is real, but it is not a line between "object" and "state." It is a line between **Receptive Attitudes** (Belief, Emotion) and **Volitional Attitudes** (Intention).

  *   **Receptive Attitudes** track how the world *is*. Pragmatic reasons cannot change how the world is, so they are the "wrong kind."
  *   **Volitional Attitudes** track how the world *should be made*. Pragmatic reasons (costs, benefits, promises) are central to deciding how to make the world, so they are the "right kind."

  To maintain coherence, you must reinterpret the **Grandmother case**. Do not say the request makes the warmth fitting; say it makes the *effort* to feel warmth obligatory. This preserves the integrity of your gut verdicts on belief and emotion while accommodating the unique logic of intention.
