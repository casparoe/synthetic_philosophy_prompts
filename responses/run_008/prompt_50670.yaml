          *   *Compatibility:* Compatible with Wittgenstein. Wittgenstein doesn't say we can't communicate; he says the *ground* of communication isn't the rule itself but the form of life (practice). Standardese is an attempt to align the "form of life" of compiler writers.

      *   **The "Don't Break Code" Norm (The Crucial Twist):**
          *   *User's Insight:* This looks like practice trumping text.
          *   *Alternative Explanation:* Prudence/Migration Costs.
          *   *Philosophical Interpretation:* This is the strongest evidence for the Kripkean view. If the text were truly the master, breaking "accidental" code would be a feature (correcting error). Preserving it admits that the *usage* defines the language, not the abstract specification.
          *   *Nuance:* It's not a total surrender. They distinguish between "Standardized" and "Supported." But practically, "Supported" wins.
