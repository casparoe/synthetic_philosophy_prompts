      *   Use the user's terminology (bug reports, defect reports, standardese).
      *   Ensure American English spelling (behavior, labor, etc.).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the Python vs. C++ distinction?
      *   *Adjustment:* Make sure to acknowledge that while C++ *claims* text-first, the "don't break code" norm pulls it toward Python's implementation-first reality in the limit.
      *   *Check:* Did I distinguish "presupposes" vs. "fits well with"?
