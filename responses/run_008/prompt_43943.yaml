answer: |-
  You're right to demand the spec before the evaluation. Without a target function, "alignment" is just optimization of a loss function nobody defined. Here is the desiderata list for any theory of idealized preferences $I(P, C) \rightarrow P^*$, where $P$ is the actual preference structure and $C$ are the idealization conditions (knowledge, computation, reflection).

  ### The Desiderata

  **1. Axiological Anchoring (Non-negotiable)**
  $P^*$ must be causally and counterfactually dependent on $P$, not on the meta-ethical commitments of the designer.
  *   **Case:** This kills the "Ghost in the Machine." If the idealization procedure implicitly assumes hedonism to resolve conflicts in $P$, it hasn't idealized $P$; it has replaced $P$. The vector field of extrapolation must be generated by $P$'s own gradients, not an external potential.

  **2. Coherence Lift (Non-negotiable)**
  $P^*$ must satisfy formal coherence properties (e.g., transitivity, independence) that $P$ violates, *without* trivializing the content.
  *   **Case:** If $P$ is incoherent, $I$ must resolve the incoherence. If $I(P) = P$, the theory is descriptive, not normative. The "Ideal" must be decision-theoretically actionable in a way the "Actual" is not.

  **3. Termination / Fixed-Point Stability (Camp Preference: Convergence)**
  The reflection process must converge to a stable fixed point within finite computational bounds.
  *   **Case:** Alignment requires an object to optimize. If reflection is an infinite regress or a limit cycle, $P^*$ is undefined. However, some camps argue for "ongoing negotiation" rather than a fixed target, making this a camp preference rather than a logical necessity.

  **4. Sovereignty over Idealization (Non-negotiable)**
  The theory must specify how to handle agents whose $P$ includes a preference *against* idealization (e.g., "I prefer to remain ignorant/irrational").
  *   **Case:** If $I$ overrides a preference to not be idealized, it violates Anchoring. If $I$ respects it, it violates Coherence Lift (since the output remains "flawed" by the theory's own lights). A spec must bite one of these bullets explicitly.

  **5. Continuity (Camp Preference: Robustness)**
  Small perturbations in $P$ should not result in phase-shifts in $P^*$.
  *   **Case:** Prevents "tipping point" scenarios where a trivial change in initial values leads to radically different idealized outcomes. Necessary for safety, but some discontinuous moral truths might exist (e.g., threshold deontology), making this debatable.

  ---

  ### The Trilemma Test

  Your hunch is correct, but it sharpens into an impossibility result under formal scrutiny. Let's call it the **Idealization Trilemma**:

  1.  **Fidelity (Anchoring):** $P^*$ preserves the semantic content of $P$.
  2.  **Improvement (Coherence):** $P^*$ satisfies axioms $P$ violates.
  3.  **Determinacy (Termination):** $P^*$ is a unique, computable function.

  **The Conflict:**
  Human preferences $P$ are often locally incoherent (intransitive loops) and semantically underdetermined.
  *   To get **Determinacy**, you must impose a resolution rule for loops.
  *   To get **Improvement**, that rule must enforce coherence axioms.
  *   But coherence axioms (like vNM) often require discarding or rewriting the semantic content of the preferences that generate the loops (violating **Fidelity**).

  **Verdict:** You cannot have all three.
  *   **Econ Rationality** picks Improvement + Determinacy, sacrifices Fidelity (treats humans as noisy rational agents).
  *   **Pure Volition** picks Fidelity + Determinacy, sacrifices Improvement (locks in current inconsistencies).
  *   **Reflective Equilibrium** picks Fidelity + Improvement, sacrifices Determinacy (process may never terminate).

  Most alignment proposals implicitly assume the trilemma is solvable via "more computation." It isn't. It's a structural constraint on mapping inconsistent finite data to consistent infinite functions.

  ---

  ### Scorecard

  | Theory | Anchoring | Coherence Lift | Termination | Sovereignty | Trilemma Pick |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **CEV (Yudkowsky)** | **High** (Intent is central) | **Med** (Assumes convergence) | **Fail** (No algorithm specified) | **Unclear** (Does "better" override "want"?) | Fidelity + Improvement (Hopeful on Determinacy) |
  | **Econ Rationality** | **Low** (Revealed pref. assumes rationality) | **High** (Axiomatic) | **High** (Utility function exists) | **Fail** (Irrationality is error, not preference) | Improvement + Determinacy |
  | **Reflective Equilibrium** | **High** (Starts with intuitions) | **High** (Seeks coherence) | **Fail** (No guarantee of convergence) | **Med** (Process respects agent, outcome might not) | Fidelity + Improvement |

  **Summary:** CEV is the only one attempting the impossible corner (all three), which is why it remains a sketch rather than a theory. Econ Rationality is the only one that actually delivers a usable object, at the cost of claiming to know what people want better than they do. Reflective Equilibrium is the most honest about the process, but useless for alignment engineering because it doesn't terminate.

  Your reading group is arguing about the paint color on a car that doesn't have an engine. Demand they pick two vertices of the trilemma before discussing the third.
