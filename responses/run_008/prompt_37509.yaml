answer: |-
  "The silence was deafening," Elena said, pushing open the heavy door of the philosophy building. "Ten minutes. She spoke, and the air left the room. Then Miller said the exact same thing, and suddenly it was insight."

  Marcus adjusted his glasses, walking beside her into the evening chill. "It was a calibration failure, Elena. The room's posterior on her testimony was systematically underweighted relative to her track record. Miller's was overweighted. That's all."

  "All?" Elena stopped on the steps. "It was testimonial injustice. A prejudice-driven deflation of her credibility that wrongs her in her capacity as a knower. It's not just about the group's accuracy. It's a ethical wrong done to *her*."

  "I don't deny the harm," Marcus said gently. "But framing it as a vice of the hearers suggests the remedy is virtue. 'Become a better hearer.' That under-generates policy. If the mechanism is biased weighting, you fix the machinery. Anonymized circulation of objections before meetings. Documented track records. Calibration training."

  "Virtue isn't just a platitude," Elena countered. "It's about correcting spontaneous credibility judgments. And we need to be precise. Fricker notes the credibility excess Miller enjoyed isn't, in itself, an injustice to him. He isn't wronged by being trusted too much. But that excess is structurally connected to the deficit that produced her silence. You can't fix the calibration without addressing the identity prejudice that skews the scale."

  "Prejudice is just a variable we haven't controlled for," Marcus said. "And consider Dotson's distinctions. You see quieting—the hearer fails to take up the testimony. But often there's smothering: the speaker anticipates the testimony won't be safely taken up and withholds it. My model captures both. Quieting is an uptake probability below what accuracy demands. Smothering is an anticipated uptake probability low enough that silence becomes the speaker's utility-maximizing strategy. If you change the payoff structure via anonymization, you change the strategy."

  "You reduce a moral injury to a utility function," Elena said, resuming walking. "But what about when the injury is that there *is* no function? Remember the grad students last year? They complained of exhaustion, but couldn't name the source. They described fragments—emotional labor, intellectual caretaking—but had no concept to lodge the grievance. The harm was real, but unintelligible."

  Marcus nodded slowly. "Hermeneutical injustice. A gap in the collective interpretive resources."

  "Exactly," Elena said. "They were wronged by the absence of the concepts needed to make their experience communicable. How does your Bayesian agent update on a hypothesis that doesn't exist in its language?"

  Marcus paused at the bottom of the stairs. "You've caught me. Formally, you're right. If the hypothesis is absent from the partition altogether, no amount of updating within the existing hypothesis space can reach it. However abundant the evidence, it cannot speak for a hypothesis no one has formulated. The probability space is blind to it."

  "So the machinery fails," Elena said. "The remedy isn't calibration. It's conceptual engineering. We have to expand the hermeneutical resource."

  "Or," Marcus said, "we treat the remedy as a deliberate revision of the partition itself. The formal apparatus can describe this. We acknowledge the current partition is incomplete. We introduce a new variable—'caretaking labor'—and redistribute the probability mass. It's a meta-epistemic move. We aren't updating; we're rebuilding the model."

  "But who decides when to rebuild?" Elena asked. "That isn't neutral. That's political. If you admit the partition needs revision, you admit the framework itself is shaped by power. The formalist wants to say 'update on the evidence,' but here the evidence is silent until the concept exists. So the act of coining the concept is what makes the evidence visible."

  "Granted," Marcus said. "The formal apparatus can describe the revision, but not motivate it. That requires an external norm. Accuracy alone doesn't tell you to look for missing variables. You need a value judgment that the current map is unjust."

  "And that's where virtue returns," Elena said. "The audience must cultivate the humility to suspect their partition is incomplete. They need the virtue of hermeneutical sensitivity. If you rely only on machinery, you assume the current categories are sufficient. You need hearers who are alert to the gaps."

  "Perhaps," Marcus conceded. "But if I concede that partition revision is necessary, I worry I'm conceding your calibration story everywhere else. If the framework is always potentially incomplete, isn't every calibration error actually a hermeneutical gap? Maybe the room ignored her not because of prejudice, but because their partition lacked the category 'valid objection from junior faculty.'"

  "Or," Elena said, stopping at the street corner, "maybe you're worried that if partition revision is the remedy, it's no longer epistemology. It's politics by other means. You're engineering concepts to achieve equity, not truth."

  Marcus looked at the traffic light. "I'm wondering if the distinction holds. If the truth is inaccessible without the right concepts, then conceptual engineering is a precondition for epistemology. But who engineers? If it's driven by political need, is the resulting knowledge objective?"

  "We're left with the same problem," Elena said. "Whether we call it virtue or partition revision, someone has to choose to listen differently. The machinery doesn't build itself."

  "No," Marcus agreed. "But if I admit that, I'm not sure what's left of the formalism except a language for describing power."

  "And if I admit that," Elena said, "I'm not sure virtue is enough to change the structure that makes virtue necessary."

  They stood at the crosswalk, the light red, neither moving toward home.
