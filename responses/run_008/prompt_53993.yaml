answer: |-
  This is a sophisticated design challenge. You are asking for a simulation that creates specific cognitive dissonances without naming them, while managing group dynamics and time tightly.

  Below is a complete facilitator's guide. It includes the script, the materials (text you can copy/paste), the timing, and the specific mechanics to handle your two twists without breaking the "no jargon" rule.

  # Workshop Title: The Forecasting Lab
  **Time:** 3 Hours
  **Participants:** 18 Grad Students
  **Room Setup:** Two distinct sides of the room (Team A and Team B). Projector for aggregates.

  ## Part 1: The Setup & Case Design (Pre-Work)

  ### The Case: "The Helios Transit System"
  To ensure the "Inside/Outside" tension lands, the case must be detailed enough to seduce the Planners but clear enough for Statisticians to categorize. We will use a **composite historical case** based on the Denver International Airport Baggage System and the Berlin Brandenburg Airport.

  **Truth (For Facilitator Eyes Only):**
  *   **Planned Cost:** $200M
  *   **Planned Time:** 24 Months
  *   **Actual Cost:** $560M (180% overrun)
  *   **Actual Time:** 48 Months (100% delay)
  *   **Outcome:** System failed initial testing, required manual override for 2 years.

  ### Materials Preparation
  1.  **Team A Packets (Planners - 9 people):** "Internal Project Charter." 4 pages. Includes Gantt charts, optimistic engineer quotes, detailed budget breakdown, "risk mitigation strategies" that sound plausible but are untested.
  2.  **Team B Packets (Statisticians - 9 people):** "Industry Analysis Reports."
      *   *Round 1:* "High-Performance Transit Initiatives (2015-2020)." (This is the gerrymander. It lists 5 projects. All were completed on time. They are cherry-picked successes).
      *   *Round 2:* "Federal Transit Authority Registry: All Class-C Infrastructure (2010-2020)." (This is the truth. 20 projects. 15 had major delays. Median delay 40%).
  3.  **Twist 2 Packets (Project Orion):** 18 envelopes.
      *   6 Envelopes marked **"CONFIDENTIAL"**: Contain a specific negative signal (e.g., "Lead supplier filed for bankruptcy yesterday").
      *   12 Envelopes marked **"PUBLIC"**: Contain generic optimistic press release text.
  4.  **Scoring Sheets:** Printed grids for Brier scores (or a simple digital form if you have tech support).

  ---

  ## Part 2: The Run-of-Show (3 Hours)

  ### 0:00 – 0:20: Introduction & Calibration Warm-up
  *   **Script:** "Welcome. Today is about decision-making under uncertainty. We are not testing your knowledge; we are testing your process. We will use a point system. Points translate to [bragging rights / a book / coffee gift card]. The top scorer wins."
  *   **Warm-up:** 5 rapid-fire calibration questions (e.g., "What year was the printing press invented?").
  *   **Rule:** "Do not discuss your packets with the other side of the room. You are in different departments working on the same problem."

  ### 0:20 – 0:50: Round 1 (The Divergence)
  *   **Action:** Distribute Team A (Planners) and Team B (Statisticians R1) packets.
  *   **Task:** Forecast three variables for *Helios Transit*:
      1.  Final Cost (in $M).
      2.  Delivery Delay (in Months).
      3.  Probability of "Critical Failure" (0-100%).
  *   **Constraint:** They must write down their *reasoning* in one sentence.
  *   **Dynamic:** Team A will feel confident (they have the "real" details). Team B will feel confident (their data shows a perfect track record).
  *   **Collection:** Collect forecasts. Do not reveal anything yet.

  ### 0:50 – 1:20: Round 2 (The Correction)
  *   **Script:** "New information has arrived."
  *   **Action:**
      *   **Team A:** Get nothing. (They stay in the Inside View).
      *   **Team B:** Hand them the **Round 2 Data Packet** (The broader reference class). Tell them: "Your data access has been upgraded to the full federal registry."
  *   **Task:** Re-forecast the same three variables. You may change your numbers or keep them.
  *   **Dynamic:** Team B should experience a shock. Their "Outside View" shifts drastically. Team A remains anchored in their detailed plans.
  *   **Collection:** Collect forecasts.

  ### 1:20 – 1:40: The Reveal (The Shock)
  *   **Action:** Project the Actual Outcomes ($560M, 48 Months, Failure).
  *   **Action:** Project the Average Forecasts for Team A (Round 1 & 2) and Team B (Round 1 & 2).
  *   **Visual:** You want a visual showing Team A clustered around the *Plan* and Team B Round 1 clustered around *Success*, while Team B Round 2 shifts toward the *Truth* (but perhaps over-corrects).
  *   **Script:** "Look at the divergence. Look at the accuracy. Take 5 minutes to talk within your teams. Why did you miss? Why did they miss?"
  *   **Constraint:** Still no jargon. They will naturally say things like "You ignored the data" or "You ignored the specifics."

  ### 1:40 – 1:50: Break
  *   Crucial for emotional reset before Twist 2.

  ### 1:50 – 2:30: Twist 2 (Asymmetric Information & Modesty)
  *   **Context:** "We are now moving to a new case: **Project Orion** (a software rollout)."
  *   **Distribution:** Hand out the 18 Envelopes randomly.
      *   6 people have **Private Info** (The supplier bankruptcy).
      *   12 people have **Public Info** (Generic optimism).
  *   **Step 1 (Private):** Everyone submits a confidential probability of "On-Time Launch."
  *   **Step 2 (The Social Pressure):** Project the **Median Forecast** of the room from Step 1. (Do not reveal who holds what info).
  *   **Step 3 (Final):** Everyone submits a *Final* Forecast. They can move their number or keep it.
  *   **The Payoff Mechanic (Crucial):**
      *   Explain the scoring rule *before* Step 3.
      *   **Rule:** "You get 10 points for every percentage point of accuracy (e.g., if truth is 80% and you guess 70%, you get 100 points)."
      *   **The Kicker:** "However, if your forecast is in the top 20% for accuracy *AND* your final number differs from the Room Median by more than 15%, you receive a **Visionary Bonus** (double points)."
      *   **The Trap:** "If your forecast is in the bottom 20% for accuracy *AND* you differed from the Room Median by more than 15%, you receive a **Hubris Penalty** (half points)."
  *   **Why this works:**
      *   **Informed (Private Info):** They know the median is likely too optimistic. To get the Visionary Bonus, they *must* dissent from the median. If they practice "blanket modesty" and copy the median, they lose the bonus potential even if they are right.
      *   **Uninformed (Public Info):** If they dissent from the median without cause, they risk the Hubris Penalty. They are incentivized to be modest *unless* they have a reason not to be.

  ### 2:30 – 3:00: The Debrief (Naming the Ghosts)
  *   **Phase 1: The Split (Rounds 1 & 2)**
      *   Ask Team B: "How did it feel to get the second packet?" (They will say: "The first one was misleading.")
      *   **Concept:** Introduce **Reference Class Forecasting**. Explain that the first packet wasn't a lie, it was a *selection bias*. Choosing the right class is an active judgment, not a passive lookup.
      *   Ask Team A: "Why didn't you move your numbers when you saw Team B's shift?" (They will say: "Our data was specific to *this* project.")
      *   **Concept:** Introduce **Inside View vs. Outside View**. Explain that detailed narrative (Inside) often crowds out statistical reality (Outside). The "Planning Fallacy" is not about lying; it's about focusing on the unique case rather than the class.
  *   **Phase 2: The Modesty (Twist 2)**
      *   Ask the 6 Informed players: "Who stuck to their guns? Who moved toward the median?"
      *   Ask the 12 Uninformed players: "Did you feel pressure to align with the median?"
      *   **Concept:** Introduce **Epistemic Modesty**.
      *   **Key Lesson:** Modesty is not "always trust the average." Modesty is "trust the average *unless* you have verified private information that justifies the deviation."
      *   **Critique:** Acknowledge that in the real world, we often *think* we have private information when we don't (overconfidence). The scoring rule tried to penalize that (Hubris Penalty).

  ---

  ## Part 3: Facilitator Notes & Failure Modes

  ### Constructing the "Gerrymander" (Twist 1)
  To avoid the "Gotcha" feeling, the Round 1 Statistician data must be **technically true but contextually incomplete**.
  *   *Bad Rig:* "Here are 5 random projects." (Feels arbitrary).
  *   *Good Rig:* "Here are 5 projects funded by the *same venture firm* as Helios." (In reality, that VC firm only funded the winners, the losers went bankrupt and aren't in the portfolio report).
  *   *Why this works:* It mimics real life. We often start with available data (survivors) before finding the full registry. When you reveal this in the debrief, it teaches them that **data sourcing is part of the forecast**, not just the math.

  ### The Payoff Scheme (Non-Monetary)
  Since you aren't using real money, the currency must be **Status + Tangible Token**.
  *   **Leaderboard:** Keep a running tally on the whiteboard. Grad students are competitive.
  *   **Prize:** A high-quality hardcover book on decision making (e.g., *Superforecasting*) or a significant coffee voucher.
  *   **Why:** If the prize is too small, they ignore the scoring rules. If it's too big, they get stressed. A "prestige object" works best for academics.

  ### Predictable Failure Modes
  1.  **The "Planner" Rebellion:** Team A might realize halfway through that they are being "tested" against data and just guess the average to be safe.
      *   *Fix:* Walk around during Round 1. If they look disengaged, remind them: "The accuracy prize is for the most accurate *justification* of the specifics." (Lie slightly to keep them engaged in the details).
  2.  **The "Statisticians" Revolt:** Team B might feel cheated in Round 1.
      *   *Fix:* In the debrief, validate them. "In the real world, you often only have the Round 1 data. The lesson is to ask: 'What data is missing from this report?'"
  3.  **Twist 2 Confusion:** The scoring rule (Visionary/Hubris) is complex.
      *   *Fix:* Put the formula on the screen. Run a hypothetical example. "If Median is 50%, Truth is 20%. You guess 20%. You get Accuracy Points + Visionary Bonus. You guess 50%. You get Accuracy Points only."
  4.  **Time Creep:** The discussion in the Reveal phase (1:20) often runs long.
      *   *Fix:* Be ruthless. "Hold that thought for the final debrief. We need to move to Orion."

  ### What This Activity Cannot Do (The Limitations)
  You must supply these in the debrief verbally, as the activity cannot simulate them:
  1.  **Long-term Calibration:** This is a one-off. It creates a *feeling*, not a *skill*. Tell them: "One session doesn't fix your bias. Only tracking your forecasts over years does."
  2.  **Constructing Reference Classes:** They experienced the *effect* of a reference class, but they didn't practice *building* one. You need to explain: "The hard work isn't looking up the number; it's arguing about which projects count as 'similar'."
  3.  **Political Cost:** In the workshop, being wrong costs points. In reality, being "modest" (predicting delays) often costs political capital or funding. Acknowledge that the incentive structure in their actual departments might punish the very accuracy you rewarded today.

  ## Script Snippet for the "No Jargon" Rule
  If a participant says, "This is clearly testing the Inside View," during Round 1:
  *   **Your Response:** "I can't confirm or deny that. Just focus on making the most accurate prediction with the papers in front of you."
  *   **Why:** This maintains the experimental blind. If you confirm it, they will perform "what they think the teacher wants" rather than reacting naturally.

  ## Summary of Learning Arc
  1.  **Hour 1:** Confidence based on narrative (Planners) vs. Confidence based on biased data (Statisticians).
  2.  **Hour 2:** The collision with reality. The realization that "more data" (Statisticians R2) beats "better story" (Planners).
  3.  **Hour 3:** The nuance. Sometimes the story *does* matter (Private Info in Twist 2), and blindly following the crowd (Modesty) can be wrong if you hold the only true signal.

  This design forces them to navigate the tension rather than just hearing about it. They will leave feeling the weight of the reference class selection and the risk of dissenting from the consensus.
