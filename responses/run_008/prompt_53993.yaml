prompt: |-
  I run a forecasting workshop for grad students from mixed departments -- about 18 people, one 3-hour session, and they've all had some exposure to Tetlock-style calibration stuff but nothing deeper. I want a structured activity that makes them feel the inside view vs outside view tension in their bones, not just nod along to it, and then feel the awkwardness of epistemic modesty once they've felt the first thing.

  Here's roughly what I've imagined but feel free to redesign: split the room. Half the participants ("planners") get a rich dossier on a real historical project -- say, a big infrastructure build or a product launch that actually happened -- with timelines, budgets, design docs, press coverage, everything. The other half ("statisticians") get nothing but a one-paragraph description plus the outcome distribution across a broad reference class of comparable projects. Both groups forecast the same outcome variables (final cost overrun, delivery delay, whether it got cancelled). Neither group knows what the other has been given. Then we reveal how much the groups' forecasts diverged and what the actual outcomes were.

  But I want two twists layered on top of the basic design, and this is where I need your help making it actually work:

  Twist 1: I want the statisticians to be handed a gerrymandered reference class in round one -- one that's too narrow or cherry-picked so the outside view is actually misleading -- and a reasonable one in round two, so participants discover that "use the outside view" is not free advice, you have to make a judgment about which class is yours, and that judgment is itself an inside-view-ish move. How do I construct or stage this without it feeling like a rigged gotcha?

  Twist 2: after the reveal, everyone sees everyone's forecasts on all rounds and gets a new set of cases to forecast individually, plus one final aggregate decision that pays off based on accuracy. Some participants should secretly get a small piece of genuine private information about the new cases, and some shouldn't. The question they have to face -- without me ever naming it -- is whether to collapse toward the group mean or trust themselves, and the payoff structure should make blanket modesty costly for the informed ones and blanket confidence costly for everyone else.

  So: full rules, materials, timing across the three hours, how to source or construct the case dossiers (they can be anonymized/composite if that's easier to prepare), a payoff scheme that doesn't need real money, and a debrief that maps specific moments onto the inside/outside distinction and onto modesty vs its critics. Also tell me what will predictably go wrong the first time I run it, and be honest about which part of the whole inside-vs-outside debate an activity like this just cannot reproduce and I'll have to supply in the debrief by talking at them.

  I do NOT want the phrases "inside view," "outside view," or "epistemic modesty" said out loud until the debrief. If a participant uses them earlier that's fine, but I won't confirm anything.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop design:

  1.  **Analyze the Request:**
      *   **Audience:** Grad students (mixed departments), ~18 people.
      *   **Background:** Some exposure to Tetlock-style calibration, nothing deeper.
      *   **Goal:** Experiential learning of Inside View (IV) vs. Outside View (OV) tension and the nuance of Epistemic Modesty (EM).
      *   **Constraint:** Do *not* use the terms "Inside View," "Outside View," or "Epistemic Modesty" until the debrief.
      *   **Duration:** 3 hours.
      *   **Core Activity:** Split group (Planners vs. Statisticians) forecasting historical projects.
      *   **Twist 1 (OV Nuance):** Statisticians get a bad reference class first, then a good one. Needs to feel fair, not rigged.
      *   **Twist 2 (Modesty Nuance):** Post-reveal, individual forecasting with asymmetric private info. Payoff structure penalizes blind conformity and blind confidence.
      *   **Deliverables:** Full rules, materials, timing, case construction, payoff scheme (non-monetary), debrief guide, failure modes, limitations.

  2.  **Deconstruct & Refine the Core Activity:**
      *   *Problem:* 18 people is small. Splitting them 9 vs. 9 reduces statistical power for comparison.
      *   *Solution:* Keep the split but ensure the task is identical. Or, better yet, make it a sequential design where *everyone* does both roles, but the prompt asks for a split. Let's stick to the user's split design but optimize the interaction. Actually, a split creates stronger "tribal" identity which enhances the tension. Let's keep the split but ensure the "Statisticians" feel empowered, not handicapped.
      *   *Twist 1 Implementation:* How to give a "gerrymandered" reference class without it feeling like a trick? The key is *plausibility*. The first reference class must look reasonable on the surface.
          *   *Idea:* Round 1 Statisticians get "Successful Projects in [Industry] during [Boom Period]." Round 2 gets "All Projects in [Industry] including failures."
          *   *Risk:* If they realize Round 1 was rigged, they distrust Round 2.
          *   *Mitigation:* Frame Round 1 as "Initial Data Packet" and Round 2 as "Updated Database Access." Make the distinction about *data availability* rather than *manipulation*.
      *   *Twist 2 Implementation:* Asymmetric information.
          *   *Mechanism:* Envelopes or digital cards. Some get "Insider Memo," others get "Public Filing."
          *   *Payoff:* Needs to reward accuracy but penalize deviation from truth. Brier scores are good, but we need a social element. Let's use a "Market" or "Consensus" mechanic.
          *   *Refinement:* A "Prediction Market" style aggregation where they can see the group mean but submit private guesses. Payoff based on individual Brier score, but with a bonus for being *uniquely* correct (to encourage using private info).

  3.  **Develop the Case Study:**
      *   Needs to be concrete, measurable, and historically verifiable.
      *   *Option A:* Boston Big Dig (Classic, but maybe too known).
      *   *Option B:* Denver International Airport Baggage System (Great failure, specific metrics).
      *   *Option C:* A fictionalized composite of a Tech Product Launch (Relatable to many depts).
      *   *Decision:* Let's go with a **Composite Tech Hardware Launch**. It allows for clear metrics (Launch Date, Budget, Unit Sales) and feels relevant to grad students. Let's call it "Project Aurora."
      *   *Reality:* Based on something like the Google Glass launch or a specific failed startup hardware pivot, but anonymized.
      *   *Metrics:* 1. Months delayed. 2. % Budget Overrun. 3. Binary: Did it ship v1.0?

  4.  **Drafting the Schedule (3 Hours):**
      *   0:00-0:15: Intro & Calibration Warm-up (get them in the zone).
      *   0:15-0:45: Round 1 Forecasting (Planners vs. Statisticians).
      *   0:45-1:00: Break/Prep for Round 2.
      *   1:00-1:30: Round 2 Forecasting (Statisticians get new data).
      *   1:30-1:45: Reveal & Shock (The Divergence).
      *   1:45-2:30: Twist 2 (Asymmetric Info & Aggregation).
      *   2:30-3:00: Debrief & Theory Mapping.

  5.  **Addressing Twist 1 (The Gerrymandered Reference Class):**
      *   *Challenge:* Making it not feel like a "gotcha."
      *   *Fix:* The "Data Update" narrative. Round 1 Statisticians get a "Preliminary Industry Report" (which naturally selects for survivors/successes). Round 2 they get the "Full Regulatory Registry" (includes failures). This mirrors real life where data is often incomplete initially. It teaches that *finding* the reference class is work.
      *   *Planners:* Give them the "Internal Memo" (rich IV details).

  6.  **Addressing Twist 2 (Asymmetric Info & Payoff):**
      *   *Setup:* New case ("Project Orion").
      *   *Info:* 6 people get "Engineer's Note" (Private Info: e.g., "Critical component supply chain broken"). 12 people get "Public Press Release" (Vague optimism).
      *   *Payoff:* "Forecast Points."
          *   Base: Brier Score (accuracy).
          *   Multiplier: If you are in the top 20% of accuracy *and* your forecast deviated significantly from the consensus, you get a "Visionary Bonus." This rewards informed dissent.
          *   Penalty: If you conform to consensus and consensus is wrong, you get a "Herding Penalty" (lower points).
      *   *Wait, simpler:* Just use a proper scoring rule (Brier) but reveal the Group Mean before they submit final. They have to decide: Trust the Mean or Trust my Private Info?
      *   *Refinement:* Let's make it a two-step submission. 1. Private guess. 2. See Group Mean. 3. Final guess. Score based on Final Guess. This forces the decision: Move toward mean or stay put?

  7.  **Addressing Limitations & Failure Modes:**
      *   *Failure:* Planners ignore their data and guess randomly. *Fix:* Make the dossier compelling/narrative-driven.
      *   *Failure:* Statisticians feel cheated in Round 1. *Fix:* Emphasize in debrief that this mirrors real data limitations.
      *   *Failure:* Twist 2 payoff is too complex to explain. *Fix:* Use a simple "Points Leaderboard" with a prize (coffee/book).
      *   *Limitation:* This activity can't teach *how* to construct a reference class, only that it matters. That must be in the debrief. It can't replicate long-term calibration training.

  8.  **Constructing the Materials:**
      *   Need specific text for the "Planner Dossier" (optimistic, detailed).
      *   Need specific text for "Statisticians Round 1" (Survivorship bias).
      *   Need specific text for "Statisticians Round 2" (Base rates including failures).
      *   Need specific text for "Twist 2 Cases."

  9.  **Refining the Debrief:**
      *   Must connect the feelings (frustration, confidence, doubt) to the concepts.
      *   Must avoid the banned terms until the end.
      *   Key questions: "Why did Group A differ from Group B?" "How did it feel to see the other data?" "In Round 3, did you move toward the average? Why/Why not?"

  10. **Review against Constraints:**
      *   No IV/OV/Modesty terms until debrief.
      *   3 hours.
      *   18 people.
      *   Twist 1 & 2 integrated.
      *   Payoff scheme (non-monetary).

  11. **Final Polish:**
      *   Ensure the "Gerrymander" isn't *too* obvious. It needs to be a "Survivorship Bias" trap, not a "Lie."
      *   Ensure the Payoff doesn't encourage gambling.
      *   Make sure the "Private Info" in Twist 2 is strong enough to justify deviation but not so strong it makes the group mean useless.

  *(Self-Correction during drafting)*: I initially thought about having them submit twice in Twist 2. That might take too long. Better: They see the anonymized distribution of the *previous* round's forecasts (or a fake consensus) and then forecast the new case. Actually, the prompt says "everyone sees everyone's forecasts on all rounds and gets a new set of cases... plus one final aggregate decision."
