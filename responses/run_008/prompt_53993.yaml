  Let's go with: Individuals submit forecasts. The "Aggregate Decision" is the Median of the room. Everyone gets a base score for accuracy. *However*, the "Informed" minority gets a bonus if they successfully pull the Median toward the truth. The "Uninformed" majority gets a bonus if they recognize when to ignore the outliers.
  Actually, simplest interpretation of "payoff structure should make blanket modesty costly for the informed ones":
  Score = Accuracy Score.
  Bonus = "Contrarian Bonus" (If you are accurate AND far from the mean).
  This punishes the informed if they just copy the mean. It punishes the uninformed if they guess wildly.
  Okay, I will design a "Forecasting League" points system.

  Let's finalize the "Gerrymander."
  Case: A bridge construction project.
  Planners: Blueprints, engineer interviews, soil reports (all optimistic).
  Statisticians R1: "Data from bridges built in stable economic periods" (Excludes the recession-era delays).
  Statisticians R2: "Data from all bridges built in last 20 years."
  This works. It's not a lie, it's a selection bias.

