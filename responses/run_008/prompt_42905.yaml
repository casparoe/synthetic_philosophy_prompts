answer: |-
  ### Preliminary Reconstruction of Implicit Theories

  Before assessing the coherence of current practices, we must distinguish the three candidate theories you identified. Each licenses different implications for the "neuron gatekeeping" we observe.

  **1. The Epistemic Proxy View (Threshold)**
  *   **Core Claim:** Moral status is binary (sentient or not). Neural complexity is merely the best available *indicator* of sentience.
  *   **Evaluation of Practice:** This justifies the UK Act's line-drawing. We include vertebrates and cephalopods because the evidence crosses the threshold of proof. We exclude bees because the evidence is currently insufficient.
  *   **Weakness:** It cannot justify *scaling* moral weights. If a shrimp is sentient, it has interests. On this view, a spreadsheet assigning a shrimp 1/1000th of a human's weight is category error, unless it refers to probability of sentience, not intensity of experience.

  **2. The Gradualist Capacity View (Scalar)**
  *   **Core Claim:** Moral weight scales with the *capacity* for experience. More neural processing power allows for richer, more intense, or more temporally extended suffering and flourishing.
  *   **Evaluation of Practice:** This justifies the moral-weight spreadsheets. It explains why a whale might be "worth" more mice in a cost-benefit analysis.
  *   **Weakness:** It commits one to the "Human Variation Problem" (a human with less brain tissue counts for less) and the "Aggregation Problem" (enough mice morally outweigh a human). Most proponents dodge this by applying the metric only to non-humans, which is ad hoc.

  **3. The Phylogenetic Familiarity View (Bias)**
  *   **Core Claim:** Neural metrics are post-hoc rationalisations for pre-existing intuitions about relatedness and similarity to humans.
  *   **Evaluation of Practice:** This explains why vertebrates get a blanket pass while invertebrates require rigorous proof. It explains why octopuses (behaviourally complex, "alien" but impressive) get in, while bees (behaviourally complex but "insectoid") stay out.
  *   **Weakness:** It admits the practice has no normative justification, only a sociological explanation. If this is true, the practice is unjustified, not merely underdetermined.

  ***

  ### The Neural Gatekeeper: A Philosophical Audit

  You have identified a friction point that is rarely acknowledged in policy or effective altruism circles: the conflation of *evidence for sentience* with *metrics for moral weight*. The practice you describe—spanning the UK Animal Welfare (Sentience) Act 2022 to the moral-weight spreadsheets of prioritisation research—is not operating under a single, coherent theory of moral status. Rather, it is a pragmatic hybrid that opportunistically shifts between the Epistemic Proxy View and the Gradualist Capacity View, while being structurally propped up by Phylogenetic Familiarity.

  Here is the assessment of where this practice holds, where it fractures, and what it actually presupposes.

  #### 1. Internal Consistency: The Octopus and the Bee
  The inclusion of the octopus is the stress test for any neural theory of moral status. As you note, the octopus nervous system is radically distributed; roughly two-thirds of its neurons reside in the nerve cords of its arms. If the moral gatekeeping were truly about *centralised integration* (a common proxy for a unified subject of experience), the octopus should fare worse than a vertebrate with a dense central brain.

  The fact that the octopus is included while the bee is excluded suggests the practice is not tracking neural *architecture* so much as neural *sufficiency for complex behaviour*. The UK review relied heavily on behavioural evidence (learning, play, pain avoidance) supported by neural substrate. The bee, despite sophisticated communication and navigation, is often dismissed as operating on "fixed action patterns" or instinctual algorithms, a distinction that is increasingly scientifically dubious.

  This reveals a presupposition: **Centralisation is not the moral criterion; behavioural flexibility is.** However, neural count is used as a shorthand for that flexibility. This creates an inconsistency. If we accept the octopus's distributed system as sufficient for moral status, we admit that a central brain is not necessary. If a central brain is not necessary, the exclusion of the bee (which has a central brain, albeit tiny) rests entirely on the *count* or *complexity*, not the *type* of system.

  The practice here presupposes a **Threshold View with a High Bar**. It treats neural complexity as an Epistemic Proxy (View A), but sets the bar high enough that it functions like a Gradualist exclusion (View B). It assumes that below a certain neural floor, the probability of sentience is too low to warrant legal risk. This is not a moral claim; it is a regulatory precaution.

  #### 2. The Scaling Problem and the Human Exception
  The most severe fracture appears in the moral-weight spreadsheets. If View B (Gradualist Capacity) is true—that moral weight scales with neural capacity—then the conclusions must apply universally. A human with significant cortical atrophy should possess less moral weight than a neurotypical human. A whale, with a cortex far more massive and convoluted than a human's, should possess more.

  In practice, this is almost universally rejected. Prioritisation researchers typically cap human weight or exclude humans from the neuron-scaling metric entirely. This is not a minor adjustment; it is a confession that the metric is not fundamental. If neuron count were the *determinant* of moral weight, excluding humans would be arbitrary discrimination. If neuron count is merely a *proxy* for sentience (View A), then scaling weight by count is a category error once sentience is established.

  Therefore, the practice is **internally inconsistent**. It employs View B to downgrade non-human animals (a shrimp is worth less than a chicken) but reverts to View A (or a species-normality view) to protect humans. This suggests the "neuron count" metric is not doing the moral work it claims to be doing. It is doing *political* work: allowing us to quantify trade-offs between species without confronting the egalitarian implications of sentience itself.

  #### 3. Counterfactuals: What if the Neuroscience Shifts?
  To understand what the practice presupposes, we must ask what would break it.

  *   **Scenario 1: Insects are proven sentient.** If rigorous evidence emerged that honeybees possess subjective experience comparable to a vertebrate, despite their tiny brains, the Epistemic Proxy View would demand their inclusion in the UK Act. The Gradualist View would demand their moral weight be raised, though perhaps not to vertebrate levels if "richness" is still tied to brain size.
      *   *Prediction:* The law would likely resist change unless the behavioural evidence was undeniable. This suggests the current practice is more committed to **Phylogenetic Familiarity (View C)** than to the neural data. The neural data is the justification, not the driver.
  *   **Scenario 2: Neuron count is decoupled from sentience.** Suppose we discover that sentience relies on a specific quantum process or a minimal network topology that requires very few neurons (e.g., 10,000), and that having *more* neurons simply adds processing power, not experiential depth.
      *   *Prediction:* The moral-weight spreadsheets would collapse. If a shrimp and a cow have the same *depth* of suffering, the utilitarian calculus changes entirely. The fact that these spreadsheets are so reliant on the scaling assumption shows they are committed to the idea that **more brain = more suffering**.

  This highlights a critical vulnerability: the practice assumes a correlation between *computational capacity* and *phenomenal intensity*. There is no philosophical or scientific guarantee that a larger brain feels pain *more* or *worse*; it may simply process more information *about* the pain. By scaling moral weight with neuron count, the practice presupposes that the *quantity* of neural machinery dictates the *quality* of the experience. This is a substantial metaphysical claim, treated as a methodological given.

  #### 4. Where the Practice is Underdetermined
  You asked where several theories would license the same practice. There is a "mushy middle" where the Epistemic Proxy and Gradualist views converge, and this is where current policy hides.

  For species with vastly different brain sizes (e.g., humans vs. nematodes), both View A and View B recommend the same action: prioritise the human. View A says the nematode is likely not sentient; View B says even if it is, its weight is negligible. This convergence allows policymakers to act without resolving the theoretical dispute.

  However, this underdetermination breaks down at the margins (the octopus, the bee, the fish). Here, the theories diverge. View A demands a binary decision (in or out) based on evidence probability. View B demands a weighted calculation. The UK Act attempts a binary decision (legal recognition) but relies on evidence that looks like it belongs to a Gradualist assessment (reviewing complexity).

  The practice is underdetermined regarding **integration**. Whether the neurons are centralised or distributed matters less to the outcome than whether the animal *behaves* like something we recognise as a subject. This suggests the "neural gatekeeping" is actually **behavioural gatekeeping** wearing a neuroscientific mask. We trust the octopus because it solves puzzles, not because we have counted its arm-neurons. The neurons are cited to give the behavioural intuition objective weight.

  ### Final Assessment

  You asked for a commitment, so here it is: The practice of using nervous system size and complexity as a gatekeeper for moral status **presupposes the Epistemic Proxy View (A) publicly, but operates on the Gradualist Capacity View (B) privately, all while being constrained by Phylogenetic Familiarity (C).**

  It is not theoretically coherent.

  1.  **It is not strictly View A:** If it were, once sentience was established (even with low probability), the moral weight would not scale down with neuron count. A sentient shrimp would have a right not to be tortured, regardless of its brain size. The spreadsheets violate this.
  2.  **It is not strictly View B:** If it were, human variation would matter, and it does not. The metric is applied selectively to non-humans to facilitate trade-offs that would be morally repugnant if applied within our own species.
  3.  **It is functionally View C:** The neural metrics are used to codify pre-existing intuitions about which animals are "like us." Vertebrates are in because they are like us. Octopuses are in because they are clever like us. Bees are out because they are "bugs," and no amount of neuron counting will overcome that taxonomic prejudice until the behavioural evidence becomes impossible to ignore.

  **Where it comes apart:** The practice collapses when faced with the **Human Variation Problem**. It cannot maintain that neuron count scales moral weight without accepting that cognitively impaired humans have less status. Since it refuses to accept that conclusion, it admits that neuron count is not the fundamental basis of moral value. Consequently, using it to downgrade non-human animals is an arbitrary discrimination, justified only by the convenience of the metric for bureaucratic and utilitarian calculation.

  If insects were proven sentient tomorrow, the legal taxonomy would not necessarily change, because the law is not tracking moral truth; it is tracking political consensus. If neuroscience showed neuron count was uninformative, the moral-weight spreadsheets would have to be abandoned, because they have no other foundation. The practice is load-bearing, but it is leaning on a pillar of straw disguised as steel.
