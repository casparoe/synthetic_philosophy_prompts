answer: |-
  Your intuition is correct. The fault lies in **Premise (4)**, specifically in the hidden assumption that ethical value must track the arithmetic properties of standard summation *and* that the resulting value relation must be complete.

  Your mathematician acquaintance has constructed a valid argument, but it is valid only against a specific, naive version of aggregative ethics: one that equates moral value directly with standard Cauchy sums and demands a complete ordering of all possible worlds. By rejecting (4), you can preserve the core insight of aggregation (that value depends on welfare distribution) without succumbing to moral paralysis.

  Here is the breakdown of the flaw, the solution, and the cost.

  ### 1. The Diagnosis: The Completeness Smuggle

  You suspected that the phrase "when it is defined at all" in (3) and the second clause of (4) smuggle in a completeness assumption. You are right, but the problem is deeper.

  Premise (4) makes two claims:
  1.  **Identity:** Outcomes with the same total welfare are equally good.
  2.  **Ignorance:** Outcomes for which no total exists are such that neither is better than the other.

  The argument relies on the **Identity** claim to generate paralysis. In an infinite world with positive welfare, the total is $+\infty$. Saving a child changes the sum from $+\infty$ to $+\infty$. By (4), the value is unchanged. By (5), the act is not better.

  The error is assuming that because the *arithmetic sum* is invariant under finite addition, the *moral value* must be too. This assumes that the arithmetic sum is the sole determinant of value. But in infinite contexts, standard summation loses information. It collapses distinct distributions (e.g., a world where everyone has welfare 1 vs. a world where everyone has welfare 1 except one person has 2) into the same scalar ($\infty$).

  Premise (4) asserts that because the *scalar* is the same, the *value* is the same. This is a category error. It conflates the *representation* of value (the sum) with value itself.

  ### 2. The Solution: Partial Orderings (Incomplete Aggregation)

  To save aggregative ethics, you reject the requirement that the "betterness" relation be **complete** (i.e., that for any two outcomes $A$ and $B$, either $A \geq B$ or $B \geq A$).

  Instead, you adopt a **partial ordering**. This allows you to say that $A$ is better than $B$ in some cases, even if you cannot compare them in others.

  **How it works:**
  You replace the "Total Sum" rule with two weaker, but robust, principles that extend finite aggregation conservatively:

  1.  **The Pareto Principle:** If outcome $A$ has at least as much welfare as $B$ for every subject, and strictly more for at least one subject, then $A$ is better than $B$.
      *   *Infinite Application:* This holds even if totals are $\infty$. If you save a drowning child (increasing their welfare) and harm no one else, $A$ Pareto-dominates $B$. Therefore, $A$ is better. This directly refutes (5).
  2.  **Spatiotemporal Expansion (Limit Dominance):** If we can order subjects by location or time, we compare the sums of finite regions and expand them to cover the whole world. If the difference in welfare between $A$ and $B$ in these expanding regions converges to a positive limit, $A$ is better than $B$.
      *   *Infinite Application:* This allows comparison even when standard sums are undefined or both $\infty$, provided the *difference* is well-behaved.

  **Why this defeats the Mathematician:**
  Your acquaintance argues that choosing a summation method (hyperreals, etc.) is arbitrary. He is right that choosing a specific *cardinal* value (a specific hyperreal number) requires arbitrary parameters (like choosing a free ultrafilter).

  However, a **partial ordering** based on Pareto and Limit Dominance does not require choosing a specific ultrafilter or hyperreal system. It relies only on the topology of the world (how subjects are arranged) and the fundamental axiom that "more welfare is better." This is not an arbitrary free parameter; it is a **minimal revision** of finite aggregation. It demands that we preserve the rankings we are sure about (finite improvements) without forcing a ranking where the math breaks down.

  ### 3. Addressing the "Arbitrariness" Charge

  The mathematician's challenge is: *"If you patch this with hyperreals or limits, which ones? They disagree. Therefore the ranking is not grounded in the worlds."*

  Your response is: **We do not need a unique ranking for every pair of worlds to have a moral theory.**

  The mathematician assumes that for aggregation to be real, it must yield a function $V: \text{Worlds} \to \text{Numbers}$. You argue that ethics requires only a relation $R: \text{Worlds} \times \text{Worlds} \to \{\text{Better, Worse, Incomparable}\}$.

  *   **Arbitrariness:** Choosing a specific hyperreal extension *is* arbitrary in the sense that different ultrafilters yield different numbers.
  *   **Robustness:** However, many comparisons are **robust** across all reasonable extensions. For example, if $A$ Pareto-dominates $B$, *every* reasonable aggregation method (standard, hyperreal, limit-based) will rank $A > B$.
  *   **Grounding:** The ranking is grounded in the worlds because it is grounded in the welfare of the individuals *within* them. The fact that we cannot rank *every* pair (incompleteness) does not mean the rankings we *do* make are ungrounded.

  By accepting incompleteness, you avoid the need to select a specific, arbitrary "infinity-mechanism." You simply say: "Where the mechanisms agree, we have a moral fact. Where they disagree or diverge, we have no moral fact."

  ### 4. The Cost: What You Pay to Keep Aggregation

  You asked what it costs to give up completeness rather than aggregation. The price is significant, but payable.

  **1. Moral Indeterminacy (The Cost of Incompleteness)**
  There will be pairs of outcomes you cannot compare.
  *   *Example:* World $A$ has infinite happy people in the North and infinite sad people in the South. World $B$ swaps them. Both have total $\infty$. Neither Pareto-dominates the other. Limit comparisons might depend on the direction of expansion (North-first vs. South-first).
  *   *Consequence:* You must accept that in some "infinite rearrangement" cases, there is no fact of the matter about which world is better.
  *   *Defense:* This is preferable to the paralysis of (5). In (5), *no* act is better (saving a child = atrocity). In the partial ordering view, *some* acts are better (saving a child > idleness), even if *other* comparisons remain unresolved.

  **2. Decision-Theoretic Complexity**
  Standard decision theory (Maximize Expected Utility) assumes completeness. If outcomes are incomparable, you cannot simply maximize.
  *   *Consequence:* You must adopt a decision theory for incomplete preferences (e.g., **Admissibility** or **Maximality**). You choose an option if no other available option is strictly better than it.
  *   *Defense:* This is sufficient to rule out atrocities. If "Devastate a continent" is Pareto-inferior to "Do nothing," it is inadmissible, even if "Do nothing" is incomparable to "Save the child."

  **3. Sensitivity to Description**
  Limit-based comparisons (Spatiotemporal Expansion) depend on how you order the subjects (e.g., by space-time distance).
  *   *Consequence:* The moral ranking might depend on the metric of "closeness" in the universe.
  *   *Defense:* This is not arbitrary; it reflects the causal and physical structure of the world. Ethics supervenes on physics; if the physical arrangement of welfare subjects changes, the method of aggregation may legitimately shift.

  ### 5. Summary of the Counter-Argument

  To your mathematician, you should propose the following revision:

  *   **Reject (4).** Replace it with: *"Outcomes are comparable if and only if their welfare distributions stand in a dominance relation (Pareto or Limit). Where no such relation holds, the outcomes are incomparable, not equally good."*
  *   **Reject (5).** Because Pareto dominance holds even in infinite worlds, saving a child (a local welfare increase with no loss) is strictly better than letting them drown.
  *   **Accept Incompleteness.** Admit that we cannot rank all infinite worlds.
  *   **Deny Arbitrariness.** Argue that relying on Pareto and Limit Dominance is not an arbitrary choice of parameter, but a logical requirement of extending finite aggregation consistently. It is the *intersection* of all reasonable aggregation methods, not a specific one.

  ### Conclusion

  The price of the answer is **humility**. You must give up the dream of a Grand Unified Theory of Value that assigns a precise rank to every conceivable universe. Your mathematician is right that the *cardinal* measurement of infinite value is fraught with arbitrariness.

  But he is wrong that this destroys *ordinal* aggregation. By retreating from "Total Welfare" to "Welfare Dominance," you save the subject matter of ethics. You retain the ability to condemn atrocities and commend rescues, which is the minimum requirement for a moral theory. The flaw was not in aggregation itself, but in the demand that aggregation must always yield a single number.

  **Step to Reject:** (4).
  **Cost:** Completeness of the moral ordering.
  **Gain:** Avoidance of moral paralysis; preservation of the Pareto principle in infinite contexts.
