answer: |-
  You have identified a genuine methodological structure, not a psychological bias. You are describing a specific configuration of **theory-maintenance** where the cost of complexity is waived because the complexity itself is treated as explanatory gain.

  Here is the breakdown of the existing literature that maps onto this, followed by a precise coinage for the specific pattern you are seeing, with the edges you requested.

  ### 1. The Existing Literature

  There are three nested concepts in the philosophy of science and social theory that cover this, though none capture your specific complaint perfectly on their own.

  **A. Imre Lakatos: Degenerating Research Program**
  This is the heavy hitter. Lakatos argued that scientific theories exist as "research programs" with a **hard core** (irrefutable by methodological decision) and a **protective belt** (auxiliary hypotheses).
  *   **Progressive Program:** The belt predicts *novel* facts (e.g., Newtonian physics predicting Neptune).
  *   **Degenerating Program:** The belt only patches up anomalies *post-hoc* without predicting new facts.
  *   **The Fit:** Your reading group is operating a program where the "hard core" is *Base Determines Superstructure*. When an anomaly arises (Superstructure floats free), they add to the "protective belt" (It serves a latent function!).
  *   **The Miss:** Lakatos provides the *logic* of the immunity, but he classifies this as "degenerating" (bad). Your friends treat it as "productive" (good). You need a term for when degeneration is *misidentified* as progression.

  **B. Hans Albert: Immunizing Stratagem (*Immunisierungsstrategie*)**
  The German critical rationalist Hans Albert described this explicitly. An "immunizing stratagem" is a move that protects a theory from refutation by reinterpreting the counter-evidence or adding assumptions that are themselves immune to test.
  *   **The Fit:** This captures the "never loses a point" aspect.
  *   **The Miss:** Albert usually implies these are dodgy or dogmatic. You noted the explanations are "genuinely plausible." The move isn't necessarily dishonest; it's a structural feature of functionalist explanation.

  **C. Robert Merton: Latent Functionalism**
  In sociology, when an institution persists despite appearing dysfunctional, the move is to posit a **latent function** (hidden benefit) rather than a **manifest function** (stated benefit).
  *   **The Fit:** This is the *content* of the move (finding the hidden utility for the base).
  *   **The Miss:** Merton thought this was a valid heuristic. Your complaint is about the *accounting*: why does finding a latent function *increase* confidence in the base/superstructure model rather than just explaining the specific institution?

  ### 2. The Coinage: "The Functionalist Ratchet"

  Since existing terms describe the *parts* but not the specific *accounting error* you're identifying (where anomaly-resolution is counted as theoretical profit), I propose we name this configuration:

  **The Functionalist Ratchet**

  **Definition:** A research strategy in which anomalies (superstructural elements that appear independent of the base) are resolved by positing latent functions, wherein the *success* of the resolution increases the confirmed scope of the theory, but the *necessity* of the resolution does not decrease its prior probability.

  It is a **ratchet** because the theory can only turn one way: toward greater complexity and scope. It never clicks back toward simplicity or falsification.

  #### Why this distinguishes from your three exclusions:

  1.  **Vs. Ordinary Auxiliary Hypotheses:** In standard science (e.g., Newton), adding an auxiliary hypothesis (there's a planet we can't see) is a *cost*. It makes the theory more complex and vulnerable. If the planet isn't found, the theory takes a hit. In the **Functionalist Ratchet**, the search *itself* is the value. Even if the specific function is debated, the fact that a function *can be found* is taken as proof of the underlying determinism.
  2.  **Vs. Genuine Theoretical Enrichment:** Genuine enrichment involves **novel prediction**. (e.g., "If the base changes this way, we predict this new family form will emerge *next year*.") The Ratchet involves **post-hoc accommodation**. (e.g., "This family form existed *already*; here is why it fits.") The Ratchet treats accommodation as if it were prediction.
  3.  **Vs. Plain Unfalsifiability:** Pure unfalsifiability (e.g., "God moves in mysterious ways") offers no specific mechanisms. The Functionalist Ratchet *does* offer mechanisms (legal stability, labor reproduction, etc.). The mechanisms are testable, but the *failure* of a specific mechanism doesn't kill the core; it just prompts a search for a *different* mechanism. The core is insulated from the failure of its specific functional claims.

  ### 3. The Edges

  To use this term precisely in your group, you need to know where it applies and where it doesn't.

  **The Least Controversial Real Instance: Soviet "Diamat" (Dialectical Materialism)**
  In the 1930s-50s Soviet Union, if economic policy failed, it was never because the base/superstructure model was wrong. It was because "bourgeois remnants" in the superstructure were resisting, or because the transition required a "strengthening of the state." Every failure of the base was explained by a function of the superstructure (sabotage, ideology), and every explanation reinforced the necessity of the Party's control. The theory grew more complex with every failure, never simpler. This is the Functionalist Ratchet in its dogmatic form.

  **The Borderline Case: Evolutionary Psychology**
  This is the closest analogue outside Marxism. When a human behavior seems maladaptive (e.g., altruism towards non-kin), EvPsych posits a latent function (e.g., "signaling theory" or "ancestral environment mismatch").
  *   **Why it's borderline:** Sometimes they find independent evidence (neurological mechanisms, cross-cultural universals). When they do, it's genuine enrichment. When they simply construct a plausible narrative without independent evidence to save the adaptationist paradigm, they are turning the Functionalist Ratchet. It is often hard to tell in real-time which is happening.

  **The Non-Case (Where the label does NOT apply): The Discovery of Neptune**
  When Uranus's orbit didn't fit Newtonian physics, astronomers posited an auxiliary hypothesis: an unseen planet.
  *   **Why it's not the Ratchet:** This was a **novel prediction**. They calculated where the planet *should be* before looking. If they hadn't found it, Newtonian physics would have suffered a massive crisis (and indeed, eventually did, via Mercury/Relativity). The auxiliary hypothesis was *risky*. In the Functionalist Ratchet, the hypothesis is *safe* because the "function" is always discoverable in retrospect within the existing social data.

  ### How to deploy this in your group

  You can say:

  > "I'm not saying these functional explanations are false. I'm saying we are operating a **Functionalist Ratchet**. We are treating the *ability to accommodate* anomalies as equivalent to the *ability to predict* them.
  >
  > If we claim that feudal law persisted because it served capitalism, that's a hypothesis. But if we treat the *fact that we can find a reason* as confirmation that the base determines the superstructure, we are insulating the core theory from cost. To break the ratchet, we need to agree on what evidence would count as a superstructural element having **no function** for the base. If the answer is 'nothing, we'll just keep looking,' then we aren't doing science; we're doing theology with plausible stories."

  This gives you the structural name you were looking for, anchors it in established philosophy of science (Lakatos/Albert), and provides the boundary conditions to prevent it from being dismissed as simple skepticism.
