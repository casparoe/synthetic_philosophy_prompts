answer: |-
  Based on your aunt's track record, she is navigating the tension between **material history** (the physical object's genesis) and **authorial intent** (the artist's will). Her verdicts are consistent, but they can be explained by two competing philosophical frameworks. Neither is definitively ruled out by the first five cases, but they yield different predictions for your new scenarios.

  ### The Two Principles

  **Principle 1: The "Living Hand" Rule (Material/Temporal)**
  Authenticity is anchored to the artist's physical agency and supervision **during their lifetime**. An object is an original only if the artist touched it, oversaw its production, or authorized its specific instantiation while alive. Restoration is acceptable because the core substrate survives from that moment; workshop pieces are acceptable because the master intervened and signed them *in the period*. Posthumous realizations or later endorsements of objects made by others fail because the "vital moment" of creation has passed.

  **Principle 2: The "Sovereign Will" Rule (Intentional)**
  Authenticity is anchored to the **artist's designation**. The artist has the sovereign power to declare what counts as their work. If they paint a replica (Case 3), it is original because they say it is the work. If they sign a bronze (Case 4), it is original because they sanction it. Under this rule, the artist's current word can override the object's physical history. If a living artist looks at a copyist's work and says, "I accept this as mine," it becomes an original because the source of authenticity is the artist's mind, not their hand.

  ### Predictions for the New Cases

  | Case | **Principle 1: "Living Hand"** | **Principle 2: "Sovereign Will"** |
  | :--- | :--- | :--- |
  | **(a) Posthumous Bronze** | **Not Original.** The artist is dead; they cannot supervise the cast or approve the specific instantiation. The "vital moment" is broken. Value: Low (estate cast/reproduction). | **Original (or Near-Original).** It fulfills the artist's model and planned edition. The artist's prior intent governs. Value: High (close to lifetime casts). |
  | **(b) Pupil Masterpiece** | **Not Original.** The master's hand and supervision were absent at creation. The historical misattribution is a deception (even if unintentional). Value: Low (Case 1 precedent). | **Not Original.** The artist never designated it as their work. Historical influence doesn't confer authorship. Value: Low (Case 1 precedent). |
  | **(c) Living Artist Signs Copy** | **Not Original.** The physical object was made by a copyist. The artist's signature certifies the *image*, not the *object*. Value: Moderate (authorized reproduction). | **Original.** The artist has explicitly designated this specific object as their work. Value: High (near the primary original). |

  **Where They Diverge:**
  The principles agree on Case (b) (both reject it), but they sharply diverge on **(a)** and **(c)**. Principle 1 prioritizes the *history of the object*; Principle 2 prioritizes the *authority of the artist*.

  ### My Best Guess

  I predict your aunt will follow **Principle 1: The "Living Hand" Rule**.

  **Reasons:**
  1.  **Her Profession:** She is a conservator, not a curator or philosopher. Conservators deal in material reality—pigment, canvas, patina, and substrate. Case 5 (restoration) shows she values the survival of the *original material* above all. Case 3 (replica) is accepted not just because the artist willed it, but because the artist *physically painted it* in his seventies.
  2.  **The Forgery Precedent (Case 1):** She reduced the value of a technically perfect forgery to "almost nothing" once the *origin* was exposed. This suggests she views deception about origin as fatal, regardless of aesthetic quality. This aligns with a strict view of material genesis.
  3.  **The Workshop Nuance (Case 2):** She accepts workshop pieces *only* because the master painted key passages and signed it *during his lifetime*. This sets a high bar for "supervision."

  **Specific Verdicts:**
  *   **(a) Posthumous Bronze:** She will likely rule this **not an original**. Unlike the Rodin estate (which had specific testamentary authorization), this artist's will is silent. Without lifetime approval of the specific cast, she will view it as a reproduction, regardless of the foundry's quality.
  *   **(b) Pupil Masterpiece:** She will rule this **not an original**. Unlike Case 2, there was no master's signature or supervision. The "historical influence" is irrelevant to the object's ontology. Value will drop precipitously, similar to Case 1, though perhaps slightly higher if the pupil is famous in their own right.
  *   **(c) Living Artist Signs Copy:** She will likely rule this **not an original**, but an "authorized copy." While the artist's will is powerful, the *object* lacks the genesis. In the conservative view of authentication, an artist cannot retroactively turn a copy into an original merely by signing it; they can only certify it as a copy they approve of.

  ### The Decisive Test Case

  To distinguish definitively between the "Living Hand" and "Sovereign Will" rules over dinner, you should pose this scenario:

  **The "Adopted Pupil" Case:**
  > "A master painter sees a painting by his favorite pupil. He loves it so much that he buys it from the pupil, hangs it in his own studio, adds a few brushstrokes to the background, signs it with his own name, and exhibits it as his own work during his lifetime. Decades later, analysis shows the pupil painted 95% of it. Is it an original?"

  *   **Why this works:**
