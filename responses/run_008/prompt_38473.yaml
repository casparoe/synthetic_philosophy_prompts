      *   *Actually, a better fit for the "irreversibility" concern:* **The Symmetric Precautionary Principle.** "Apply caution to both action and inaction. If an intervention carries uncertain risk, the status quo must also be scrutinized for uncertain risk. Choose the path with the lower upper-bound of catastrophic potential, provided the lower-bound of benefit is acceptable."
      *   *Wait, simpler is better for a "single principle".* Let's go with **Expected Value with Symmetric Weighting.** But the user cares about *catastrophe* (irreversibility).
