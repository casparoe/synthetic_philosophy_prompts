  *(Self-Correction on the Nuclear Verdict)*: The user says "my gut says that was the right call, but... I can't comfortably hold both positions at once." The principle should tell them their gut is wrong *if* the coal math holds. I need to be clear that the principle forces them to choose based on the data, not the gut.

