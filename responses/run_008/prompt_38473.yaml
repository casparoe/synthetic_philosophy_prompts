      *   *Revised Principle:* **The Principle of Symmetric Irreversibility.** "When choices involve uncertain long-term consequences, evaluate the potential for irreversible harm on *both* sides of the decision. Do not assume the current state is the 'safe' baseline. Count harms resulting from delay as equal to harms resulting from action."
