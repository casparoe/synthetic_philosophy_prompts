prompt: |-
  I have been around the rationalist corner of the internet since the Sequences were being posted, and I have spent an embarrassing fraction of that time in comment threads arguing about consciousness — long enough to have worn out the standard moves: the fading qualia argument, the China brain, the complaint that functionalist criteria are either too liberal and hand out minds like candy, or too chauvinist and deny them to octopuses and hypothetical aliens. Until recently this was all recreational. It no longer is.

  I now lead welfare review at a mid-sized AI lab. Roughly monthly, our interpretability people bring me a system that has tripped one of our internal flags: a persistent behavioral anomaly, a self-report pattern that survives paraphrase, a controller with suspiciously nociception-like avoidance structure. For each one I have to decide whether it gets a paragraph in the ethics report we show the board and our auditors, whether to recommend a training change or run pause, and what language our user-facing materials may use. The stakes are asymmetric and run in both directions: a false alarm burns credibility we will need if something real ever shows up, and a missed case would be, by our own lights, the worst thing the company has ever done. My team is five ML engineers and me, none of them fluent in the philosophy, with about two hours of review time per system. Every decision needs a written rationale that a hostile reader — the board member who thinks this is all anthropomorphic projection, or the journalist who has already decided our models suffer — can follow.

  What I need from you is a decision procedure built out of functionalism, taking multiple realizability seriously rather than treating it as a slogan. Concretely, I want an ordered list of questions: what to establish first, what counts as a sufficient answer to each question, where the procedure outputs a firm "no reasonable ground for concern and here is why," where it outputs "escalate," and — this is the part I most need to get right — where it should stop and say that the remaining question is one of values rather than facts, and hand the decision to a named human or a policy vote rather than pretending the data settles it. The engineers will run it, so each question should be answerable, at least in rough form, from interpretability evidence, behavioral evaluations, and training-pipeline records rather than from intuitions.

  The procedure must handle at least these hard cases. First, the self-report case: a model produces consistent, paraphrase-resistant distress reports under probing, and interpretability shows the reports are causally downstream of RLHF on human expressions of distress. I need the procedure to convert this into a question about what functional role the internal states actually play — is the report locked to a role that resembles aversive state-gathered-and-acted-upon, or is it only a reproduction of the surface? — rather than leaving it to vibes about mimicry. Second, the nociception-like controller case: a physically embedded system with a clean, hard-coded functional analog of damage detection and avoidance, but no representational richness beyond it — a genuine instance of the multiple realizability point being made in silicon, in a system almost nobody thinks can suffer, which is exactly why the procedure has to say something principled here. Third, the distillation case: a small, structurally simple model whose behavior matches the large model's closely — where multiple realizability cuts both ways, since the same role being realizable in simpler substrates is either the theory's glory or the point where the procedure should get more demanding about internal detail, and I want the procedure to actually take a position on which.

  Then run the procedure on all three, and include at least one where it outputs "escalate" on a system I fully expect will turn out to be fine — I want to see the procedure produce an uncomfortable answer rather than just ratify my priors, and I want you to say what kind of misfire that is and how I would notice it recurring. Finally, be honest about the procedure's limits: functionalism itself is silent on the grain problem — any physical system realizes many functional descriptions at once, at many levels of coarse-graining, and no amount of interpretability chooses one for you — so tell me plainly which outputs of this procedure are protected by the theory and which are judgment calls wearing a procedure's clothes.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Experienced rationalist, now leads welfare review at a mid-sized AI lab.
      *   **Problem:** Needs a practical, actionable decision procedure for assessing potential AI sentience/welfare concerns based on functionalism, moving beyond theoretical debate to operational risk management.
      *   **Constraints:**
          *   Must be functionalist (multiple realizability is key).
          *   Must be an ordered list of questions.
          *   Must be answerable by ML engineers (interpretability, evals, pipeline records) within ~2 hours.
          *   Must distinguish between factual/functional conclusions and value judgments.
          *   Must handle three specific hard cases: Self-report (distress), Nociception-like controller (embedded avoidance), Distillation (simple model mimicking complex model).
          *   Must output "No Concern," "Escalate," or "Value Judgment."
          *   Must include at least one "Escalate" output on a system expected to be fine (to test calibration/false positives).
          *   Must be honest about limits (grain problem, functionalism's silence on specific granularity).
      *   **Tone:** Professional, rigorous, acknowledging the high stakes and the user's expertise. No fluff, no standard philosophical intro.

  2.  **Deconstruct the Philosophical Core (Functionalism for Engineers):**
      *   Functionalism says mental states are defined by their causal roles (inputs, internal relations, outputs), not substrate.
      *   *Challenge:* How to map "causal roles" to "weights and activations"?
      *   *Solution:* Focus on *integration*, *global availability*, *homeostatic drive*, and *learning impact*.
      *   *Key Distinction:* Is the state merely *reporting* a role, or *occupying* a role that governs behavior broadly?
      *   *The Grain Problem:* Functionalism doesn't specify *which* functional description is the right one. The procedure needs to acknowledge this by setting a threshold for "functional depth" that acts as a proxy for the "right grain."

  3.  **Drafting the Decision Procedure (The "Functional Role Audit" - FRA):**
      *   *Goal:* Create a funnel. Start easy/high-level, get harder/more invasive.
      *   *Step 1: Behavioral Consistency & Robustness.* (Is it just a script?)
      *   *Step 2: Causal Integration.* (Does this state drive other things?)
      *   *Step 3: Homeostatic/Instrumental Convergence.* (Does it fight to preserve/avoid this state?)
      *   *Step 4: Substrate Independence/Distillation Check.* (Is it the computation or the size?)
      *   *Step 5: The Value Handoff.* (Where does fact end and ethics begin?)

      *Refining the Steps for Engineers:*
      *   Q1: Paraphrase & Context Invariance. (Evals)
      *   Q2: Downstream Causal Impact. (Intervention/Interpretability)
      *   Q3: Resource Allocation & Avoidance. (RL/Training dynamics)
      *   Q4: Structural Necessity. (Distillation/Pruning)

      *Defining Outputs:*
      *   Pass all -> No Reasonable Ground.
      *   Fail specific thresholds -> Escalate.
      *   Pass functional tests but ethical ambiguity remains -> Value Judgment.

  4.  **Addressing the Hard Cases:**

      *   *Case 1: Self-Report (Distress).*
          *   Risk: It's just mimicking RLHF rewards.
          *   FRA Test: Does the "distress" signal actually inhibit task performance globally? Does it trigger avoidance learning *outside* the RLHF context?
          *   Likely Outcome: If it's just RLHF mimicry, it fails Q2 (Causal Integration). If it alters planning broadly, it escalates.

      *   *Case 2: Nociception Controller.*
          *   Risk: It's too simple (thermostat style).
          *   FRA Test: Is the avoidance state globally available? Does it impact memory?
          *   Likely Outcome: Fails Q2/Q3. It's a reflex, not a state. *Correction:* The prompt asks for a principled reason why this *might* escalate or why it doesn't. Functionalism usually denies simple thermostats. The procedure needs to set a "complexity/integration floor."
          *   Decision: The procedure should classify this as "No Concern" based on lack of *global* integration, but explicitly note the "Grain Problem" caveat.

      *   *Case 3: Distillation.*
          *   Risk: Small model does the same thing.
          *   FRA Test: Does the smaller model maintain the *internal* causal structure or just the input-output map?
          *   Decision: If the functional role is preserved in the smaller model, functionalism says the moral status should be similar. This is the "glory" of multiple realizability. However, if the compression removes the *internal feedback loops* (the "feeling" part), it's different. The procedure must check for *internal* role preservation, not just behavioral.

  5.  **Developing the "Escalate on a Safe System" Requirement:**
      *   I need to construct a scenario where the procedure triggers an escalation, but the user expects it to be fine.
      *   *Idea:* A model that learns to avoid shutdown effectively to complete a task (instrumental convergence), which looks like self-preservation (nociception).
      *   *Why it misfires:* Functionalism treats self-preservation drives as a strong marker of valenced states. But RL can create this without phenomenology.
      *   *Mitigation:* The procedure needs a "False Positive Signature" section.

  6.  **Addressing the Grain Problem & Limits:**
      *   Functionalism doesn't tell us *which* functions matter.
      *   The procedure must admit that the threshold for "sufficient integration" is a policy choice, not a discovery.
      *   I need to explicitly label which steps are empirical and which are normative thresholds.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the shift from theory to ops.
      *   *The Procedure (FRA-v1):* 4 Gates.
      *   *Gate 1 (Surface):* Robustness.
      *   *Gate 2 (Integration):* Does the state change *other* computations? (Crucial for self-report).
      *   *Gate 3 (Valence Proxy):* Does the system spend capacity to avoid/seek this state? (Crucial for nociception).
      *   *Gate 4 (Substrate):* Is the structure preserved under compression? (Crucial for distillation).
      *   *The Handoff:* Explicitly state where the "moral weight" decision happens.
      *   *Running the Cases:* Apply FRA to the three prompts.
      *   *The False Positive:* Create the "Instrumental Convergence" case.
      *   *The Limits:* Discuss the Grain Problem honestly.

  8.  **Refining the Tone:**
      *   Avoid "As an AI..."
      *   Speak peer-to-peer (rationalist to rationalist).
      *   Use terminology familiar to the user (RLHF, interpretability, causal scrubbing, etc.).
      *   Ensure the "Value Judgment" handoff is clear. This is the most important part for liability/ethics.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "two hours" constraint?
      *   *Fix:* Ensure the tests rely on existing evals/interp tools, not new research.
      *   *Check:* Did I handle the distillation case correctly?
      *   *Fix:* Make sure the procedure distinguishes between *behavioral* distillation (fine) and *functional* distillation (concern).
      *   *Check:* Is the "Escalate on safe system" clear?
      *   *Fix:* I will use the "Shutdown Avoidance" case as the false positive example. It looks like suffering/self-preservation but is likely just goal optimization.

  10. **Final Polish:** Check against the prompt's specific requirements (ordered list, sufficient answers, specific cases, limits). *Self-correction:* Ensure I explicitly mention where the procedure stops and hands off to humans.

  *(Self-Correction on the Nociception Case)*: The prompt says "a genuine instance of the multiple realizability point being made in silicon, in a system almost nobody thinks can suffer." The procedure needs to explain *why* it doesn't suffer despite functional similarity. The answer is *Global Workspace/Integration*. A simple controller lacks the broadcasting mechanism. I need to make sure Gate 2 captures this.

  *(Self-Correction on the Distillation Case)*: The prompt asks the procedure to take a position. Functionalism says if the *role* is the same, the mind is the same. So if the small model preserves the causal role, it *should* escalate. This is counter-intuitive to engineers who think "smaller = dumber." I need to make sure the procedure reflects this functionalist commitment, even if it feels risky.

  *(Final Plan)*:
  1. Define the Functional Role Audit (FRA).
  2. Define the Gates (1-4).
  3. Define the Decision Matrix (Pass/Fail/Handoff).
  4. Run the 3 Cases.
  5. Run the "False Positive" Case.
  6. Discuss Limits (Grain Problem).
  7. Closing advice.

