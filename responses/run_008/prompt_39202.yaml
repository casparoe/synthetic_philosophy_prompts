answer: |-
  Your instructor is correct: the literature on the Surprise Exam Paradox (SEP) is notoriously fragmented because authors often disagree on what counts as the *explanandum*. Some treat it as a problem in epistemic logic, others as a problem in semantics, and others as a problem in the pragmatics of assertion.

  Your draft list is remarkably sophisticated for an undergraduate term paper; it identifies the correct pressure points. However, to make this a rigorous specification for a term paper, we need to sharpen the distinctions between **logical constraints** (which any solution must meet to be coherent) and **philosophical commitments** (which determine which *kind* of solution you are offering).

  Below is a refined set of desiderata. I have preserved the core of your list but tightened the phrasing to prevent equivocation. I have also added a section on **Joint Unsatisfiability**, which addresses your specific interest in whether the paradox is a "theorem" rather than a confusion.

  ### The Desiderata for an Adequate Solution

  #### 1. The Base-Case Integrity Constraint
  *   **Specification:** The solution must explicitly resolve the $n=1$ case (one-day exam). It must state whether the announcement "There will be an exam tomorrow and you will not know it" is a contradiction, a contingent falsehood, or a truth that cannot be known. Crucially, the mechanism used to resolve $n=1$ must scale to $n=5$ without requiring ad hoc adjustments.
  *   **The Case:** If the backward induction is valid, the $n=5$ case collapses into the $n=1$ case. If a solution handles $n=5$ by appealing to "multiple possibilities" but fails to explain why $n=1$ doesn't immediately self-destruct, it has not solved the induction, only masked it.
  *   **Status:** **Non-negotiable.** Any solution that works for $n=5$ but fails for $n=1$ is logically inconsistent.
  *   **Tension:** This creates immediate friction with Desideratum 3 (Semantic Status). If the $n=1$ announcement is a logical contradiction, the paradox is dissolved (the teacher lied). If it is not, the solution must explain how "Exam & $\neg$Knowledge(Exam)" is consistent.

  #### 2. The Inductive Step Localization
  *   **Specification:** The solution must identify the precise step in the backward induction where the inference fails. It cannot simply assert "the induction is invalid." It must explain why the step from "The exam cannot be on Friday" to "Therefore, if it hasn't happened by Thursday, it must be on Friday" is epistemically blocked.
  *   **The Case:** The students' reasoning looks like standard modal logic. To stop it, one must show that knowledge is not closed under the specific deduction used, or that the premises change truth-value during the week.
  *   **Status:** **Non-negotiable** for logical solutions; **Optional** for pragmatic/dissolution solutions (which may argue the premises were never established).
  *   **Tension:** This conflicts with solutions that claim the announcement is *initially* known but becomes unknown later (Dynamic solutions). They must explain how a known proposition loses its status without new empirical evidence.

  #### 3. The Semantic Status of the Announcement
  *   **Specification:** The solution must categorize the teacher's announcement ($A$). Is $A$ a proposition that is (a) True and Knowable, (b) True but Unknowable, (c) False, or (d) Lacking a truth value (e.g., self-referential failure)? It must also state whether $A$ is common knowledge among the students.
  *   **The Case:** The paradox turns on whether the students can treat $A$ as a premise in their reasoning. If $A$ cannot be known, the students' derivation is unsound. If $A$ is false, the teacher lied.
  *   **Status:** **Theoretical Commitment.** Different schools of thought will choose different options here. However, it is **Non-negotiable** that the solution *declares* its choice.
  *   **Tension:** This is the primary source of the "swamp." Solutions that claim $A$ is True but Unknowable (Blind Spot) satisfy the logic but strain the intuition that the teacher spoke truly. Solutions that claim $A$ is False satisfy intuition but dissolve the paradox.

  #### 4. Epistemic Operator Precision
  *   **Specification:** The solution must distinguish between *Knowledge* ($K$), *Justified Belief* ($J$), and *Deducibility* ($\vdash$). It must specify which operator is involved in the "surprise" condition. (e.g., Is it $\neg K(Exam)$ or $\neg J(Exam)$?)
  *   **The Case:** Students might be justified in believing the exam is on Friday without *knowing* it. Equivocating between "I can't prove it" and "I don't know it" is a common fallacy in the literature.
  *   **Status:** **Non-negotiable.** A solution that equivocations here is committing a modal fallacy.
  *   **Tension:** High tension with Desideratum 7 (Formal Assumptions). If you define surprise as $\neg K$, you inherit the axioms of epistemic logic (like KK). If you define it as $\neg J$, you enter the murky waters of justification logic.

  #### 5. The Practical/Pragmatic Gap
  *   **Specification:** The solution must explain why the students' a priori reasoning does not allow them to avoid studying. If the logic proves "No Exam," why are they surprised on Wednesday? The solution must account for the difference between the *validity* of the students' argument and the *actual outcome*.
  *   **The Case:** This is the phenomenological core of the paradox. A solution that proves the students are logically right (no exam is possible) but empirically wrong (exam happens) fails to explain the surprise.
  *   **Status:** **Non-negotiable.** Without this, you have solved a logic puzzle, not the Surprise Exam Paradox.
  *   **Tension:** This is the hardest constraint to satisfy alongside Desideratum 3. If the announcement is unknowable, how does the exam happen without the students knowing?

  #### 6. Formal Transparency (The KK Principle)
  *   **Specification:** The solution must state whether it relies on the KK Principle ($Kp \to KKp$) or the veridicality of knowledge ($Kp \to p$). It must declare if it is working within System S4, S5, or a weaker logic.
  *   **The Case:** Many "solutions" work only by implicitly denying that knowledge iterates or that knowledge entails truth. A solution should not hide these costs.
  *   **Status:** **Non-negotiable** for formal papers.
  *   **Tension:** Denying KK saves many solutions but at the high cost of making "knowledge" behave unlike the standard philosophical concept.

  #### 7. Generalization Robustness (Optional)
  *   **Specification:** The solution should ideally apply to the Unexpected Hanging and Moorean sentences ("$p$ but I don't believe $p$"), or explain why SEP is distinct.
  *   **Status:** **Prejudice/Robustness Check.** A solution can be adequate for SEP without solving the Hanging, but a solution that collapses them all without distinction is suspect.

  ---

  ### The "Impossibility" Check: Joint Unsatisfiability

  You asked to flag subsets that might be jointly unsatisfiable. This is the most critical part of your paper. There is a strong argument in the literature (e.g., by Chow, Halpern, or Williamson) that **Desiderata 1, 3, and 5 form an inconsistent triad** under standard epistemic logic.

  1.  **If the Announcement is True and Known (D3):** Then by standard logic, the students can deduce the day (violating D5).
  2.  **If the Announcement is True but Unknowable (D3):** Then the students cannot use it as a premise (satisfying D2), but it becomes difficult to explain how the exam occurs as a surprise without the students having *some* access to the truth of the announcement (threatening D5).
  3.  **If the Announcement is False (D3):** The paradox is dissolved, but the "surprise" is trivialized (the teacher lied), which many feel fails D5 (the *philosophical* surprise).

  **The Theorem vs. Confusion Question:**
  If you hold fixed:
  *   Standard Epistemic Logic (S5)
  *   The Announcement is Common Knowledge
  *   The Announcement is True

  Then the "No Exam" conclusion is **valid**. In this specific frame, the paradox is a **theorem**: the setup describes an impossible world.
  Therefore, an adequate solution **must** reject at least one of those three fixed points.
  *   **Non-negotiable:** You must state which of the three you are rejecting.
  *   **Joint Unsatisfiability:** You cannot satisfy "Standard Logic" + "Common Knowledge" + "True Announcement" + "Exam Happens." One must go. Your desiderata should require the solution to identify *which one* it sacrifices.

  ---

  ### Brief Scorecard of Solution Families

  Here is how the major families fare against your refined criteria. Use this to structure your evaluation in the paper.

  **1. The Quine/Fitch Response (The "Unreliable Teacher" View)**
  *   **Core Claim:** The students cannot *know* the announcement will be carried out. $A$ is not a known premise.
  *   **Desiderata Performance:**
      *   **D1 (Base Case):** Handles well. $n=1$ is just a promise that might be broken.
      *   **D2 (Induction):** Blocks the first step. Students can't assume $A$ is true on Friday morning.
      *   **D3 (Status):** $A$ is contingent, not common knowledge.
      *   **D5 (Practice):** Explains surprise easily (students didn't know $A$ was true).
      *   **Critique:** Many find this unsatisfying because it turns a logical paradox into a practical uncertainty about the teacher's honesty. It solves the logic by changing the story.

  **2. Epistemic Blind Spots (Sorensen, Wright)**
  *   **Core Claim:** The announcement is True, but it is a "blind spot": it cannot be *known* by the students, even if true.
  *   **Desiderata Performance:**
      *   **D1 (Base Case):** Strong. "Exam tomorrow & you won't know" is true but unknowable.
      *   **D3 (Status):** True but Unknowable.
      *   **D5 (Practice):** Explains surprise perfectly (they can't know it, so they are surprised).
      *   **Critique:** Struggles with D2. Why does the induction fail if the proposition is true? It requires accepting that some truths are essentially unknowable to specific agents, which is a heavy metaphysical cost.

  **3. Self-Reference / Common Knowledge Failure (Chow, Halpern)**
  *   **Core Claim:** The announcement cannot be *Common Knowledge*. It can be known by individuals, but not known to be known by all.
  *   **Desiderata Performance:**
      *   **D3 (Status):** Precise. Distinguishes $K$ from $C_K$ (Common Knowledge).
      *   **D6 (Formal):** Very strong. Uses precise modal logic to show where the induction breaks (usually requires $C_K$ to sustain the induction).
      *   **Critique:** Technically rigorous but intuitively opaque. It satisfies the logic criteria but often feels like it solves a different paradox (the "Common Knowledge Paradox") rather than the student's intuitive surprise.

  **4. Contextualist / Dynamic Solutions**
  *   **Core Claim:** The truth value of the announcement changes during the week. On Monday, "You won't know" is true; by Thursday, it may become false.
  *   **Desiderata Performance:**
      *   **D2 (Induction):** Blocks the step by claiming premises shift.
      *   **D3 (Status):** Truth value is time-relative.
      *   **Critique:** Violates the intuition that the teacher's statement was a fixed proposition made on Monday. Risks violating D6 (stability of logic).

  ### Advice for Your Paper

  Your instructor's warning about the "swamp" is a directive to be a cartographer, not a colonizer. Do not try to prove one solution is "The Truth." Instead, use these desiderata to show **trade-offs**.

  1.  **Introduction:** Present the paradox and the "swamp" problem. State that your paper will evaluate solutions based on a specific set of desiderata.
  2.  **The Specification:** Present the refined desiderata above. Explicitly discuss the **Joint Unsatisfiability** section. Argue that any solution is essentially a choice of which desideratum to relax.
  3.  **Evaluation:** Take two contrasting solutions (e.g., Quine vs. Blind Spot). Run them through the desiderata. Show that Quine saves D5 (Practice) by sacrificing D3 (Status of Announcement), while Blind Spot saves D3 by accepting a heavy metaphysical cost in D2 (Induction).
  4.  **Conclusion:** Conclude that the "solution" depends on which desideratum the philosopher values most. If you value logical rigor (D6), you prefer Chow. If you value phenomenological accuracy (D5), you prefer Sorensen.

  This approach demonstrates high-level philosophical maturity: you are analyzing the *conditions of success* for a theory, rather than just arguing for the theory itself.
