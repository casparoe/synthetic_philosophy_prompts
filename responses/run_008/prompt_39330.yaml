      *   *Purposes of Navigation:* Empirical adequacy, predictive success, technological application.
      *   *Successive Maps:* Successive theories (Fresnel $\to$ Maxwell).

  3.  **Task 2 & 3: Analyze Breaks and Sort Disanalogies:**
      *   *Break 1: Ontological Disagreement.* Maps (Mercator vs. Peters) are known to be representations of the *same* thing. Theories (Ether vs. Field) claim to describe *different* things.
          *   *Damage:* High. This strikes at the heart of whether structure survives *ontology* change.
      *   *Break 2: Access to the Target.* We can check maps against the coast. We can't check theories against "structure of reality" directly (that's the debate).
          *   *Damage:* High. This is the "No Miracle Argument" vs. "Pessimistic Meta-Induction" tension. It risks begging the question.
      *   *Break 3: Newman's Objection.* A map implies points and relations. If we don't know what the points *are*, is it just "there exist $N$ things"?
          *   *Damage:* High/Medium. This is a technical philosophical objection. The map analogy might obscure this because maps usually imply *spatial* relations which feel substantial.
      *   *Break 4: Redrawing Land/Sea.* The skeptic says theory change changes what counts as an object. Maps assume the land exists beforehand.
          *   *Damage:* High. This challenges the continuity assumption.

      *   *Harmless Disanalogies:*
          *   *Human Intent:* Maps are made for humans; science is (arguably) about nature regardless of us. (Doesn't affect the structural claim).
          *   *2D vs. ND:* Maps are 2D representations of 3D surfaces; theories are mathematical. (Trivial).

  4.  **Task 4: Evaluate the Conclusion:**
      *   Does "We know structure, not natures" survive?
      *   The cartography analogy is *too strong* in one way (implies direct access) and *too weak* in another (implies no ontological conflict).
      *   It supports *Epistemic* Structural Realism (ESR) weakly but fails against *Ontic* Structural Realism (OSR) nuances regarding Newman.
      *   The analogy works best for *mathematical continuity* (the equations stay), but fails on *ontological continuity* (the ether went).
      *   Verdict: The analogy is pedagogically useful but philosophically vulnerable. It borrows the realism it tries to prove (the coastline). However, a refined version (focusing on *instrumental* continuity rather than *representational* accuracy) might save it.

  5.  **Task 5: Better Analogy:**
      *   Need something where the *relations* persist but the *substance* changes, without assuming direct access to the target.
