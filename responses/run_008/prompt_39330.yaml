      *   **Skeptic's Objections:**
          1.  Projections don't disagree ontologically (unlike ether vs. no-ether).
          2.  Coastline access presupposes the access structural realism is trying to justify (circularity).
          3.  Newman's Objection (structure without relata is trivial).
