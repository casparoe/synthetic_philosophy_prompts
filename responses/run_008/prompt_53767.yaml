answer: |-
  The nociception-versus-pain distinction is a robust neurobiological categorization, but it is a regulatory failure. As a neurophysiologist, you know that peripheral coding is merely the input; the moral weight lies in the central integration of that input into an affective state. The industry wants to use the distinction as a binary gate: if an animal lacks a mammalian cortex, it lacks pain, and thus lacks moral standing. This argument, championed by Rose et al., relies on a neuroanatomical chauvinism that ignores the functional convergence of subcortical structures in vertebrates and centralized ganglia in decapods. We know from your own field that "simple" systems exhibit plasticity and integration unforeseen by textbook reductions. To regulate based on a proven absence of consciousness is to regulate based on a negative we cannot empirically secure. The distinction cannot bear the regulatory weight because it demands a certainty of non-sentience that science cannot provide.

  Your "Asymmetry Wager" is the correct decision-theoretic tool to replace this binary gate, but it requires a principled lower bound to avoid the sentience inflation you rightly distrust. The wager holds: the moral cost of a false negative (inflicting pain on a sentient being) is lexically superior to the economic cost of a false positive (treating a non-sentient being as sentient). However, this does not extend to plants or thermostats. The cutoff is not "consciousness" but "centralized capacity for motivational trade-offs." A plant reacts to damage, but it does not learn to avoid a stimulus at the cost of feeding. A decapod crustacean will groom a wounded claw rather than feed, or pay a cost to avoid a shock zone, indicating a unified negative affective state. The wager applies only where there is a nervous system capable of integrating nociceptive input into behavioral prioritization. This excludes flora and simple invertebrates but firmly includes decapods and vertebrates.

  Applying this framework to the four practices requires balancing the probability of sentience against the economic feasibility of alternatives. We must take the economics seriously; a regulation that collapses an industry helps no one, including the animals dependent on that supply chain. However, where low-cost alternatives exist, the economic argument dissolves.

  First, eyestalk ablation of female broodstock prawns must be prohibited. This practice involves the physical removal of sensory organs to force molting and mating. The evidence for nociception in penaeids is strong, and the behavioral evidence for affective suffering is sufficient to trigger the wager. The economic benefit is increased reproduction rates, but hormonal alternatives exist. The cost of false negative here is extreme mutilation of a likely sentient creature for mere efficiency. There is no economic necessity that justifies this when alternatives are commercially viable.

  Second, sustained high stocking densities in salmon aquaculture should be permitted only with conditions. Salmon are vertebrates; the probability of pain is near certainty. High densities induce chronic stress, disease, and physical injury. However, an immediate prohibition on current densities could crash supply. The verdict is not to ban salmon farming, but to regulate the density caps strictly. The industry must internalize the welfare cost through reduced biomass per cubic meter. This is a economic hit, but one that must be priced in to prevent the moral catastrophe of mass suffering in vertebrates.

  Third, the slaughter of farmed shrimp and prawns by asphyxiation or chilling without stunning must be phased out. The scale here is billions of individuals. While the individual economic cost of stunning is low, the capital cost of retrofitting processing lines is high. An immediate prohibition might lead to non-compliance or black markets. A phase-out mandates the adoption of electrical stunning technology within a fixed timeline. The wager dictates that we cannot accept the false negative of billions of deaths potentially involving suffering when the technology to prevent it exists. The economic friction is transitional, not structural.

  Fourth, the live storage and boiling of crabs and lobsters should be permitted with conditions. The public visibility of this practice makes it a focal point for welfare regulation. Boiling alive is likely excruciating for decapods. However, banning the sale of cooked crab is impractical. The condition must be mandatory pre-slaughter stunning (electrical or mechanical). This preserves the industry while removing the high-probability pain event. The economic cost of stunning devices is negligible compared to the product value.

  In sum, the nociception-pain distinction is scientifically useful but ethically inert. The Asymmetry Wager, bounded by neurobiological integration, provides a regulatory path that respects both moral risk and economic reality. We do not need to prove pain to regulate; we only need to acknowledge the risk of it is too high to ignore.

