      *   *Check:* The Residue Report needs to be the climax.
      *   *Correction:* Make sure to explicitly state that "Life" != "Velocity."

  7.  **Final Polish:** Check against the user's specific examples (git blame, hero stories, etc.) to ensure resonance. (e.g., using "git blame" for Antiquarianism).

  **(Self-Correction Note):** The user mentioned "typo check me later." I should ignore typos and focus on content. The prompt is dense; the response should be structured but dense enough to match.

  8.  **Final Output Structure:**
