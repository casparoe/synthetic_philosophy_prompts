prompt: |-
  I've been going down a rabbit hole on the question of whether things like "humanity" or "redness" actually exist as real things, or whether they're just names we use. Someone in a forum told me to look at William of Ockham, so I found an English translation of part of his Summa Logicae online, book 1, chapter 15. The chapter is basically him arguing that a universal is not some thing existing outside the mind. And honestly I cannot follow the reasoning at all.

  Here's one part that lost me:

  "For that a universal is not some substance existing outside the soul can be evidently proved as follows. In the first place, no universal is a substance that is single and one in number. For if it were said to be so, it would follow that Socrates were some universal, since there is no greater reason for one universal being one singular substance rather than being another. Therefore no singular substance is some universal, but rather every substance is one in number and singular - for every substance is either one thing and not several, or it is several things."

  And then a bit later there's this one, which really threw me:

  "Likewise, if some universal were one substance, existing in singular things, distinct from them, it would follow that it could exist without them, for every thing naturally prior to another thing can exist apart from it by divine power. But the consequent is absurd."

  What on earth does God's power have to do with whether "humanity" is a real thing? And in the first passage, I don't get why "one in number" is supposed to be the crucial property. Like, why would the universal being a single thing make Socrates a universal?? That step feels like it comes out of nowhere.

  I have no philosophy training, I'm just a guy who thinks about this stuff on my commute, so please don't assume I know any jargon. Please structure your answer like this:

  1. "Translation into plain English" -- rewrite both passages the way you'd explain them to a friend at a bar (roughly 150 words).
  2. "The argument, step by step" -- walk through Ockham's logic in the first passage one move at a time, and say at each step what he's assuming (roughly 250 words).
  3. "The divine power part" -- explain what that second passage is doing and why he thinks it's a knockdown point (roughly 150 words).
  4. "Where I'd push back" -- tell me the weakest link in his reasoning, in your honest opinion (roughly 100 words).
