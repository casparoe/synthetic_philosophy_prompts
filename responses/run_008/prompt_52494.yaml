  > *   *If she says 5-hour itch always wins:* She is a Lexical Prioritarian (torture/continuous pain always trumps trivialities).

  **Follow-Up 2 (Testing the Intrapersonal Consistency):**
  > "In Case 4, you said lifetime specks were worse than a bad year of pain. But here, (A) is lifetime itches and (C) is 5 hours of itch. If I change (C) to **one year of continuous itch**, do you still say (A) is worse? At what point does the concentrated pain beat the distributed annoyance?"
  > *   *Goal:* This forces her to define the exchange rate between *duration* and *distribution*.

  **Follow-Up 3 (The "Personhood" Trap):**
  > "If (A) is worse than (B) because the harm is concentrated in one life, does that mean I'm morally required to **spread the harm**? If I have to inflict 18,000 seconds of itch total, should I inflict it on one person (A) or 18,000 people (B)? You ranked (A) as worst, so does that mean (B) is the *moral choice*?"
  > *   *Goal:* This connects her ranking to action. If she says (A) is worse but she wouldn't choose (B) to avoid it, she's inconsistent.

  ### Summary for Thursday
  Walk in expecting her to say **(A) is the nightmare scenario**. She views a life defined by annoyance as worse than a short burst of pain, and she views 18,000 strangers getting a flicker of annoyance as morally negligible.

  Your job isn't to prove her wrong, but to show her that **Intrapersonal Aggregation** and **Interpersonal Aggregation** are doing different work in her head. If she admits that "adding up inside a life" is easier than "adding up across lives," she has officially adopted a **Person-Affecting Restriction on Aggregation**, which is a defensible but specific philosophical stance. Good luck with the bet.
