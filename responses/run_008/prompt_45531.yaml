answer: |-
  # QUESTION-PERIOD SHEET: DIACHRONIC RATIONALITY & SELF-TRUST

  **Workshop:** Diachronic Rationality
  **Audience Profile:** Hostile Formal Epistemologists (Bayesian), Decision Theorists, PhilSci.
  **Strategy:** Do not defend the *letter* of Reflection. Defend the *ground* of diachronic norms. Concede technical restrictions; hold the line on normative category.

  ### PRE-GAME: CONCESSIONS & HARD LINES

  **Concede Up Front (Buy Credibility):**
  1.  **Van Fraassen (1995):** Acknowledge immediately that VF retreated to a restricted principle involving "cognitive capacities" and "Ulysses situations." Do not pretend he didn't.
  2.  **Psychological Reduction:** Concede that "self-trust" sounds psychological. Promise to argue it is a *constitutive condition of agency*, not a mood.
  3.  **The Drug Cases:** Agree that standard Reflection fails here. Your point is not that the counterexamples are wrong, but that their *diagnosis* is wrong.

  **Hold No Matter What (The Hard Line):**
  1.  **Normative Category:** Reflection is not an *epistemic* norm (like Consistency or Conditionalization). It is a norm of *diachronic agency*. Conflating the two is the source of the literature's confusion.
  2.  **The Ground:** The Dutch Book argument does not prove incoherence; it proves vulnerability *given* self-trust. Without self-trust, the Dutch Book is irrelevant to rationality.
  3.  **The Sedative:** The "Second-Order Sedative" case is not vacuous; it isolates the *phenomenology of ownership* required for epistemic agency.

  ---

  ### Q1: THE VAN FRAASSEN CHARGE (Novelty & Priority)
  **Likelihood:** Certain. **Damage:** High.
  **Phrasing:** "Van Fraassen's 1995 *Philosophical Studies* paper already restricts Reflection to cases where the agent believes her future self is rational and free from interference. He explicitly uses the Ulysses metaphor to handle the brainwashing cases. You are presenting a restriction of the principle as a redescription of its ground. What work is 'self-trust' doing here that VF's 'belief in future rationality' does not? If the extension is the same, isn't this just a verbal shift?"

  **2-Minute Reply:**
  "VF's 1995 restriction is technical: it excludes cases where the agent believes her future updating rule is compromised. My claim is metaphysical. VF still treats Reflection as an *epistemic* norm that happens to have exceptions. I am arguing it was never an epistemic norm to begin with.
  Consider the difference: VF says, 'Reflection holds unless you have evidence of interference.' I say, 'Reflection holds only when you constitute a diachronic agent.'
  The 'self-trust' I'm invoking isn't a belief *about* reliability (which can be wrong); it's the stance required to view a future credence function as *mine* rather than as data. VF keeps the future self as an oracle to be calibrated; I treat the future self as an agent to be inhabited. If I'm right, the Dutch Book isn't a proof of inconsistency that gets waived in special cases; it's a proof of vulnerability that only arises when agency is intact. The extension might overlap, but the explanation changes the logic of the principle from 'coherence' to 'continuity of identity.'"

  **Soft Spot:** If they press that "belief in future rationality" *just is* the operational definition of self-trust, you risk collapsing back into VF.
  **Counter:** "Belief in rationality is third-personal (I believe he is rational). Self-trust is first-personal (I rely on me). The sedative case proves they come apart."

  ---

  ### Q2: THE CATEGORY ERROR (Epistemic vs. Prudential)
  **Likelihood:** High. **Damage:** High.
  **Phrasing:** "You say Reflection is a norm of self-trust, not epistemic rationality. But the Decision Theorists here will tell you that self-trust is prudential. If I don't trust my future self, I precommit. That's a strategy, not an epistemic obligation. Are you arguing that epistemic rationality depends on prudential considerations? That sounds like pragmatic encroachment, which this room generally rejects."

  **2-Minute Reply:**
  "I am not arguing for pragmatic encroachment. I am arguing for a constitutive norm. Epistemic rationality governs believers. But a 'believer' is not a momentary time-slice; it is a continuant. To be a diachronic believer *just is* to stand in a relation of self-trust to one's future states.
  If you remove self-trust, you don't have a believer who is irrational; you have a sequence of belief-states lacking an owner. The obligation to align with your future credence isn't prudential (about your welfare); it's about the conditions under which 'your future credence' is a meaningful term for *you*.
  So, it's not that prudence intrudes on epistemology. It's that diachronic epistemology presupposes diachronic agency. Without that presupposition, there is no 'you' to be epistemically rational over time. The norm is epistemic in target, but agential in ground."

  **Soft Spot:** Decision theorists hate "constitutive" arguments that blur utility and truth.
  **Counter:** Keep emphasizing "conditions of possibility for agency" rather than "benefits of trusting."

  ---

  ### Q3: THE DUTCH BOOK TECHNICALITY (Coherence)
  **Likelihood:** High. **Damage:** Medium.
  **Phrasing:** "The Dutch Book argument for Reflection demonstrates that violating the principle makes your credence function susceptible to a sure loss. That is a formal property of the probability calculus, independent of psychology. If you violate Reflection, your $P_t(A)$ differs from $P_t(P_{t+1}(A) = x)$. How does 'self-trust' block the math? A bookie doesn't care if you trust yourself; he cares that your prices are inconsistent."

  **2-Minute Reply:**
  "The Dutch Book shows inconsistency *between* $P_t$ and $P_t(P_{t+1})$. But the force of the argument—the reason we think you *ought* to avoid the book—relies on the assumption that $P_{t+1}$ is a legitimate target for $P_t$ to align with.
  If I know $P_{t+1}$ is the result of brainwashing, I can be Dutch Booked, yes. But we don't say I'm *irrational* for refusing to align with it. Why? Because the normative link is broken.
  My claim is that the Dutch Book argument is valid only relative to a framework of self-trust. The bookie exploits the link between my current and future valuations. If I regard my future valuation as an external event (like weather), the 'loss' is just a cost of doing business with an external force, not a sign of my own incoherence. The math holds, but the normative bite vanishes when the agency is severed."

  **Soft Spot:** Formalists may insist that "rationality" *is* avoiding sure loss, regardless of the cause.
  **Counter:** "We already accept exceptions for logical omniscience. I'm proposing an exception for diachronic identity."

  ---

  ### Q4: THE SEDATIVE CASE (Vacuity Charge)
  **Likelihood:** Medium. **Damage:** Medium/High (Crucial for your thesis).
  **Phrasing:** "Let's talk about the second-order sedative. You say the agent sees her future belief as an 'event' not an 'action.' How do you measure this independently? If you define 'lack of self-trust' as 'cases where Reflection fails,' your principle is tautological. If you define it by the 'feeling' of ownership, that's introspective folk psychology, not formal epistemology. Does this case actually do any work, or is it just a story you tell to save the principle?"

  **2-Minute Reply:**
  "This is the pivot of the paper. The case is not vacuous because the 'feeling of ownership' is not defined by the failure of Reflection. It is defined by the capacity for *endorsement*.
  In the sedative case, the agent retains first-order evidence. She knows $P_{t+1}(A) = 0.9$. But she cannot *adopt* that credence as a commitment; she can only predict it.
  This distinguishes my view from VF. VF looks at the *cause* of the future belief (is it rational?). I look at the *relation* to the future belief (is it mine?).
  We can test this: If I offer the agent a bet now that pays off if she holds the belief later, a VF-agent might take it (if she trusts the process). My sedated agent will not, not because she doubts the truth, but because she cannot bind herself to the outcome. The restriction has predictive power: it predicts a breakdown in *planning* and *commitment*, not just in credence alignment. It isolates the normative glue."

  **Soft Spot:** If they demand a formal model of "ownership," you don't have one.
  **Counter:** "I am offering a philosophical analysis of the preconditions for the formal model, not a new equation."

  ---

  ### Q5: THE "HOPE NOBODY ASKS" QUESTION (The Replacement)
  **Likelihood:** Low. **Damage:** Nuclear.
  **Phrasing:** "Okay, suppose you're right. Reflection is out as an epistemic norm. I am an agent who has lost self-trust (perhaps due to the sedative, or depression, or radical skepticism). What is my diachronic epistemic norm *then*? If I shouldn't align with my future self, and I shouldn't conditionalize on my future self as evidence, am I permitted to ignore my future beliefs entirely? Do you leave the agent with no diachronic guidance?"

  **2-Minute Reply:**
  "This is the strongest objection, and here is my honest answer: When self-trust is withdrawn, diachronic *epistemic* rationality dissolves into synchronic rationality plus prudential defense.
  You do not align with the future self; you treat the future self as a source of data, like a thermometer. You conditionalize on the *fact* that you will believe $A$, not on $A$ itself.
  This isn't 'no guidance.' It's a shift in stance. You move from *participant* to *observer* of your own mind. This is tragic, but it is the correct description of alienation. To demand an epistemic norm of alignment when agency is broken is to demand coherence from a broken mirror. My theory doesn't create the void; it acknowledges that Reflection was never the norm that could fill it."

  **Soft Spot:** This admits that your theory offers *less* normative guidance than the standard view in broken cases.
  **Counter:** "Better to describe the breakdown accurately than to prescribe impossible coherence."

  ---

  ### STRATEGIC NOTE: THE SECOND-ORDER SEDATIVE
  **Verdict:** **Use it.** It is your strongest tool against the "Vacuity" charge, but you must frame it carefully.
  **How to Use:** Do not present it as a "counterexample to the counterexamples." Present it as a **phenomenological control case**.
  *   **Standard Drug Case:** First-order evidence is corrupted. (Audience says: "Ah, evidence changed.")
  *   **Sedative Case:** First-order evidence is *intact*. Only the second-order relation is severed.
  *   **Why it helps:** It proves that "evidential corruption" (VF's view) is not the only thing that breaks Reflection. "Agential alienation" (your view) breaks it too. This shows your restriction is *broader* and *deeper* than VF's.
  *   **Survival Tip:** If they attack the "feeling" as unformalizable, concede. "I am not doing formal modeling here; I am doing the metaphysics that must precede the modeling. You cannot model diachronic coherence without defining the diachronic unit."

  ### STRATEGIC NOTE: NOVELTY
  **Be Honest:** Do not claim VF didn't see this.
  **Say:** "Van Fraassen saw the *boundary* of the principle. I am arguing for the *nature* of the territory inside the boundary. He restricted the rule; I am reclassifying the game."

  ### FINAL PODIUM REMINDER
  When you are sweating and they are circling:
  1.  **Slow Down.** Formalists speak fast; you speak slow to show control.
  2.  **Repeat the Question.** It buys time and ensures you answer *their* worry, not a straw man.
  3.  **Don't Apologize.** You are telling them their foundational norm is a category mistake. Act like it's a discovery, not a deficit.
