          *   Highlight the Rawls error. That's not subtle, but the TA might have glossed it. I should flag it as "blatant but easy to miss if tired."
          *   Highlight the confusion on what counts as the "objection."

  7.  **Self-Correction/Refinement during drafting:**
      *   *Wait, check the Parfit claim again.* In *Reasons and Persons*, Parfit discusses the "Mere Addition Paradox" leading to the Repugnant Conclusion. The Torture vs. Specks case is often associated with him (or sometimes derived from his work on aggregation), but specifically, he uses it to show that *Total Utilitarianism* implies the torture choice, which he finds unacceptable. So saying he "bit the bullet" is likely false. He usually uses it to motivate *Wide Person-Affecting Views* or other alternatives. I need to be confident in correcting this.
