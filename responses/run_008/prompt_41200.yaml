prompt: |-
  I'm a software engineer, no philosophy background, but my job now involves shipping ML models and the fairness question keeps coming up. I've heard there are impossibility results in algorithmic fairness -- something like you can't have calibration and equal false positive rates across groups at the same time unless the groups have equal base rates or the predictor is trivial. My manager's take is basically "ok so just pick whichever metric the lawyers like and move on," and something about that feels too easy to me but I can't articulate why. What are the most important implications of these impossibility results for a team like ours actually deploying a model that real people get scored by? I'm not looking for a survey of every metric, just the stuff that should actually change how we make decisions. Keep it under 300 words please, I have a standup in 20 min lol
