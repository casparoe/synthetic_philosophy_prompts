      *   *The "Making Up People" thesis:* Hacking argued that new ways of being a person are created. But does "creating a way of being" mean "creating the pain"?
      *   *The ADHD Example:* Hacking specifically discussed multiple personality disorder and autism, but the logic applies to ADHD. However, Hacking usually resisted the idea that *nothing* was there before. He argued that the *kind of person* didn't exist, not necessarily that the *behavioral dysregulation* didn't exist.
