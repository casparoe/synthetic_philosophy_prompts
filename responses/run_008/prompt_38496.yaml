  ok so my school philosophy club is doing a thing where everyone writes up their actual views on one topic and then the rest of the club spends the meeting trying to tear them apart. I picked population ethics, the stuff about whether a world with more people can be better than a world with fewer, and here's roughly what I've got. (1) I think what makes a world better or worse is just the total amount of happiness in it — you add it all up and the bigger the sum the better the world. (2) If you add one more person whose life is genuinely happy and who doesn't affect anyone else's life at all, the world got better. seems obvious to me. (3) The repugnant conclusion thing is just wrong though — a world with a zillion people whose lives are barely worth living is NOT better than a world with way fewer people who are really happy, no matter how big the zillion is. (4) I also think a life that's barely worth living is still a good life, like it's still on the positive side of the line and beats never existing at all. (5) A couple who decides not to have a kid hasn't done anything wrong, not even a tiny bit — there's no person out there who got harmed by the choice. (6) And I'm definitely not one of those average view people — I don't think a world with one perfectly happy person beats a world with a billion people who are each just a tiny bit less happy, that seems insane.

  My one friend already claims that (1) and (2) are secretly just the repugnant conclusion in disguise and I'm being inconsistent, but I feel like he's missing something, I just can't put my finger on what. Can you go through all six and tell me which ones actually clash with each other, which only look like they clash, and rank the clashes by how bad they are? For each real clash tell me what it would cost me to fix it, and at the end say which single change would clean up the most. Also don't use headers or bullet points or bold or anything like that, just write it like a normal email, and be honest if one of these is just dumb.
