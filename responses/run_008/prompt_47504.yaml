      *   *Response to Q2 (Formalization):* Don't use Reiter's default logic (too clunky). Use **Bayesian Networks** or **Factor Graphs**. The "default" is "no edge between nodes." New heuristic = new node or new edge. This makes the "non-monotonic" part clear (adding info changes the graph structure).
