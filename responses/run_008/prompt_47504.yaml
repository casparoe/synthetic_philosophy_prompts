      *   *Correction on Formalization:* A toy model would be helpful. Let's suggest a simple variance addition formula: $Var(X+Y) = Var(X) + Var(Y)$ (default) vs $Var(X) + Var(Y) + 2Cov(X,Y)$ (defeated).
      *   *Correction on Bias:* Make sure to distinguish between *mechanistic* independence (physics) and *epistemic* independence (knowledge). The user is talking about epistemic.

  5.  **Final Polish:** Ensure the feedback encourages the user while tightening the logical screws. (The user seems sophisticated, so avoid over-explaining basics.)

      *   *Key Insight to add:* The "Presumption of Independence" is actually a **Maximum Entropy** move. Given marginal distributions, the joint distribution with maximum entropy is the independent one. This grounds the "default" in information theory, which is stronger than law or crypto.

  6.  **Final Review against constraints:** The user wants comments on accuracy and whether the core idea is doing work. I need to be explicit about that.

      *   *Core Idea Work:* Yes, it stops people from treating heuristic estimates as hard data. It forces a structural check.
      *   *Accuracy:* Point 5 is the weakest link scientifically (needs nuance on tail risk). Point 4 is the most ambitious (needs simplification).

      *(Self-Correction)*: Wait, I should check the "innocent until proven guilty" analogy again. In law, the burden is on the prosecution. In heuristics, if the burden is on the person alleging dependence, we might miss risks. If the burden is on the modeler to prove independence, we get paralysis. The user says "presumed independent... burden on whoever alleges dependence." This *does* skew optimistic. I need to highlight this tension clearly.

