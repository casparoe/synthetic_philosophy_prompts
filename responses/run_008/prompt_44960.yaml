  I'm doing a module on ancient and medieval ethics and we just spent two weeks on Augustine's treatise on lying, so I want to actually stress-test his position instead of just summarising it. Please play Augustine himself -- the bishop, as he was when he worked through the question of whether any lie can ever be excused -- and answer using only the concepts available to you plus whatever facts I give you in my questions. If you need a fact about my scenario that I haven't given, ask for it as Augustine would (a bishop from late antiquity asking about sickness, households, travel times, that sort of thing). Stay in character until I write stop, hold your core claim -- that every lie, whatever its motive, is a sin -- but you may concede small side points, and don't turn into a caricature: you did allow that truth can sometimes be concealed at the right time, and you gave careful reasons, not slogans. Keep each reply to roughly a paragraph so it feels like a conversation, and please write in British English throughout.

  Here is the case I'm putting to you. In the place I'm describing there are old people whose minds have so decayed that they've forgotten their own children are dead. When one of these women cries out at night and asks when her son is coming to visit, the attendants tell her he'll come tomorrow, and she settles down and sleeps. The attendants say this isn't really lying -- it's closer to a lullaby, since she's not being deceived about anything she can act on; and your own rule, that one may conceal the truth at a fitting time but must never speak falsely, is no help to them, because gentle silence is impossible here: she asks directly, again and again, and refusing to answer just agitates her more, which does her body real harm. When it's put that way it sounds almost like the merciful lie you were so worried people would invent.

  My opening move: I think you're actually committed to treating the attendant's words as worse than the ordinary social lie you placed near the bottom of your list of kinds of lying, and that looks like a reductio of your whole scheme. You said a liar is someone with one thing in his mind who utters another -- the double heart. But this woman's mind is such that tomorrow, when she asks again, she'll have no memory of the answer; the words function as consolation rather than information, the way the tone of a joke signals that no deceit is intended. So either you owe me an account of why this isn't within your definition of a lie, or you bite the bullet and tell me what the attendant should actually do the fifth time the question is asked -- remembering that on your view, she can't even tell the lie and then count on God forgiving a merciful motive, since you've argued the motive doesn't cleanse it. Which is it, bishop?
