  2.  **Deconstruct Scanlon's Contractualism (Technical Core):**
      *   *Core Principle:* An act is wrong if its performance under the circumstances would be disallowed by any set of principles for the general regulation of behaviour that no one could reasonably reject as a basis for informed, unforced general agreement.
      *   *The Aggregation Problem:* Scanlon argues against simple summing of utilities (Utilitarianism). Small gains to many cannot outweigh a severe loss to one *unless* the complaints are comparable in a specific way.
      *   *Individualist Restriction:* Comparisons are primarily person-affecting. We compare the strongest complaint against a principle to the strongest complaint against an alternative.
      *   *The "Relevance" View:* Aggregation is allowed *within* a group if their complaints are of the same kind and magnitude, but not simply by summing small utilities to outweigh a large loss (the "Transmitter Room" case).
      *   *Tie-Breaking:* If complaints are equal, numbers *can* count (the "Save the Many" case vs. "Save the One" where the loss is identical).

  3.  **Map to Economic Vocabulary:**
      *   *Social Welfare Function (SWF):* Scanlon doesn't have a continuous SWF $W(u_1, ..., u_n)$. He has a *choice rule* based on pairwise comparison of principles.
