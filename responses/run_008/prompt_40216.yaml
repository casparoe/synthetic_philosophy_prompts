answer: |-
  Here is the translation of Scanlon's contractualism into the formal language of social choice and welfare economics, followed by the residue report you requested.

  ### Part 1: The Translation (Contractualism as a Choice Rule)

  In your vocabulary, Scanlon is not proposing a Social Welfare Function (SWF) in the Bergson-Samuelson sense (a continuous mapping from utility vectors to social orderings). He is proposing a **binary choice rule** constrained by an **individual veto condition**.

  **1. The Objective Function vs. The Constraint**
  Standard welfare economics posits $W = F(u_1, ..., u_n)$. Scanlon posits a feasible set of principles $\mathcal{P}$. A principle $p \in \mathcal{P}$ is admissible if and only if for every individual $i$, the "complaint" $c_i(p)$ against $p$ is not "reasonably rejectable" given the available alternatives.

  **2. The Complaint Metric**
  Replace utility $u_i$ with a **complaint function** $c_i$.
  *   $c_i(p)$ measures the burden individual $i$ bears under principle $p$ relative to the best available alternative principle $p'$.
  *   Unlike vNM utility, $c_i$ is not necessarily cardinal or comparable across *different kinds* of burdens, but it is comparable for *similar* burdens.
  *   **Individualist Restriction:** The social evaluation compares the strongest complaint against $p$ with the strongest complaint against $p'$. It does not sum complaints.

  **3. The Aggregation Problem (Formalized)**
  Let there be two states, $A$ and $B$.
  *   **State A:** Individual 1 suffers a severe loss $L$. Individuals $2...N$ gain small benefits $\epsilon$.
  *   **State B:** Individual 1 suffers no loss. Individuals $2...N$ gain nothing.
  *   **Utilitarian SWF:** Choose $A$ if $\sum_{i=2}^N \epsilon > L$.
  *   **Prioritarian SWF:** Choose $A$ if $\sum_{i=2}^N \phi(u_i + \epsilon) - \phi(u_i) > \phi(u_1) - \phi(u_1 - L)$, where $\phi$ is strictly concave.
  *   **Scanlon's Rule:** Choose $B$. Individual 1's complaint $c_1(A)$ is "severe." The aggregate complaint of $2...N$ against $B$ is the sum of "trivial" complaints. Scanlon asserts a **lexical priority**: A severe complaint cannot be outweighed by any number of trivial complaints.

  **4. The "Similar Complaints" Exception (The Switching Rule)**
  This is the nuance your friend is highlighting.
  *   **State C:** Individual 1 dies. Individuals $2...N$ suffer nothing.
  *   **State D:** Individual 1 lives. Individuals $2...N$ die.
  *   **Scanlon's Rule:** Choose D (save the many).
  *   **Why?** Here, the complaint magnitude is identical ($c_1 = c_2 = ... = c_N = \text{Death}$). When complaints are **homogeneous in magnitude**, the individualist restriction lifts, and the rule switches to a counting rule (Utilitarianism over the subset).

  **Mathematical Characterization:**
  Scanlon's social ordering is **non-separable** and **discontinuous**.
  The social weight $w_i$ assigned to individual $i$'s utility is not a function of $u_i$ alone (as in Prioritarianism, $w_i = \phi'(u_i)$). Instead, $w_i$ is a function of the distribution of complaints across the population:
  $$ w_i = f(c_i, \text{distribution}(\mathbf{c}_{-i})) $$
  Specifically, if $\max(\mathbf{c}) \gg \text{median}(\mathbf{c})$, the weight on the max is infinite (Veto). If $\max(\mathbf{c}) \approx \text{median}(\mathbf{c})$, the weights are equal (Counting).

  ### Part 2: Axiomatic Violations

  **1. Pareto Conditions**
  *   **Weak Pareto:** Scanlon generally satisfies this (if everyone is better off, no one has a complaint).
  *   **Strong Pareto / Potential Pareto:** Scanlon **violates** the logic underpinning Potential Pareto (Kaldor-Hicks). In the Transmitter Room case, the gain to the many *could* theoretically compensate the one (in utility terms), but Scanlon rules the trade-off inadmissible *ex ante*.
  *   **Harsanyi's Aggregation Theorem:** Scanlon explicitly rejects the premises. He denies that social rationality must satisfy the same axioms as individual rationality (specifically Independence and Continuity) when interpersonal trade-offs are involved. He rejects the move from "Pareto + vNM" to "Additive SWF."

  **2. Separability**
  Scanlon violates **Separability** (or Independence of Irrelevant Alternatives) radically.
  *   In standard SWFs, the ranking of $A$ vs $B$ depends only on the utilities of those affected.
  *   In Scanlon's framework, whether Individual 1's complaint against $A$ can be overridden depends on whether Individuals $2...N$ have *similar* complaints. The presence of $N$ people with trivial complaints changes the moral status of Individual 1's severe complaint (it shields it), whereas the presence of $N$ people with *identical* severe complaints changes the status (it exposes it to aggregation).
  *   This makes the social preference relation **context-dependent** in a way that standard welfare functions are not.

  **3. Continuity**
  Scanlon's rule is **discontinuous**. There is a threshold $\delta$ such that if $|c_i - c_j| < \delta$, aggregation is permitted. If $|c_i - c_j| > \delta$, aggregation is forbidden. There is no smooth trade-off curve. This cannot be represented by a continuous Prioritarian function $\phi(u)$.

  ### Part 3: Residue Report

  Here is the breakdown of what survives the translation, what distorts, and what is lost.

  **1. What Survives (The Isomorphism)**
  *   **Priority to the Worst-Off:** Scanlon maps cleanly onto a **Leximin** ordering with a specific exception clause. If your toolkit includes Lexicographic Maximin, you have 80% of the structural output of his theory.
  *   **Rejection of Summation:** His objection to Utilitarianism is formally identical to the objection that the elasticity of substitution between individuals should not be infinite.
  *   **The "Similar Complaints" Clause:** This maps onto a **threshold Leximin** model. You can model this economically: Maximize $\sum u_i$ subject to $\min(u_i) \geq \bar{u}$, where $\bar{u}$ is endogenous to the distribution of losses.

  **2. What Distorts (The Forced Fit)**
  *   **Reasons vs. Weights:** In economics, we model "importance" via weights or concavity. In Scanlon, "importance" is a property of the *justification*. Translating "reasonable rejection" into "infinite weight on severe complaints" captures the *choice* but loses the *mechanism*. For Scanlon, the one person isn't weighted heavily; rather, the *principle* allowing their sacrifice is unjustifiable. The economic translation turns a deontological constraint into a consequentialist weight.
  *   **The "Generic" Individual:** Economics treats $u_i$ as the sovereign metric. Scanlon treats "well-being" as one input into a "complaint," which also includes autonomy, rights, and status. If you map "complaint" directly to "utility," you distort his view. He is not a welfarist. A loss of rights might generate a veto-complaint even if utility loss is low.

  **3. What Cannot Be Said (The Residue)**
  *   **The Procedural Element:** "Reasonable rejection" is a procedural test, not an outcome state. In economics, we evaluate states $x$ and $y$. Scanlon evaluates *principles* that generate $x$ and $y$. Two outcomes might be identical in utility distribution, but one is generated by a principle that singles out a specific person (arbitrariness), which generates a stronger complaint. Standard SWFs are blind to the *history* or *rule* that generated the allocation, only the allocation itself. This is the largest residue.
  *   **Mutual Recognizability:** The goal of Scanlon's system is not "maximize social good" but "find principles no one could reject." The *telos* is different. Economics optimizes; Contractualism seeks equilibrium of justification. You can model the equilibrium, but you cannot model the *search for justification* as an optimization problem without changing the nature of the problem.

  ### Part 4: Verdict on Your Suspicion

  **Your Suspicion:** *"Once you strip the procedural language it's just prioritarianism with a discontinuity."*

  **Verdict:** **False, but structurally adjacent.**

  Here is why your friend is right to resist that formulation:

  1.  **Prioritarianism is Aggregative:** Prioritarianism ($\sum \phi(u_i)$) always permits trade-offs. If the number of people gaining $\epsilon$ is large enough ($N \to \infty$), the sum will eventually outweigh the severe loss $L$, even with high concavity, unless $\phi$ is lexicographic (which collapses Prioritarianism into Leximin). Scanlon explicitly denies that *any* number of trivial gains can outweigh a severe loss. This is not a matter of degree (concavity); it is a matter of kind (incommensurability).
  2.  **The Discontinuity is Not in the Function, but the Domain:** It is not that the welfare function has a discontinuity; it is that the **domain of aggregation** changes.
      *   *Prioritarianism:* Same function everywhere.
      *   *Scanlon:* Function $F_1$ (Leximin) applies when complaints are heterogeneous. Function $F_2$ (Utilitarian) applies when complaints are homogeneous.
      *   This is a **regime-switching model**, not a single continuous function with a kink.
  3.  **The "Why" Matters:** In economics, if Model A and Model B yield the same choice data, they are observationally equivalent. For Scanlon, the *reason* for the choice is constitutive of the morality. If you choose the Leximin outcome because it maximizes a social welfare function, you have missed the point. You must choose it because the individual has a veto.
      *   *Economic View:* The individual is a vessel of utility.
      *   *Scanlon's View:* The individual is a sovereign justificatory unit.
      *   This distinction vanishes in the translation, but it is the core of the philosophical debate.

  **Is the Residue due to missing variables or vagueness?**
  It is **not vagueness**. It is **non-welfarism**.
  Welfare economics assumes that all normatively relevant information is contained in the utility vector $\mathbf{u}$. Scanlon assumes normatively relevant information is contained in the **reasons** agents have for accepting/rejecting principles.
  *   "Reasons" include utility, but also fairness, rights, and historical entitlement.
  *   Because "reasons" are not cardinally measurable or interpersonally comparable in a single metric (like utils), they cannot be plugged into an SWF.
  *   The "residue" exists because you are trying to map a **deontological constraint system** onto a **consequentialist optimization framework**.

  **Summary for your Advisor:**
  Scanlon's contractualism can be modeled as a **Lexicographic Choice Rule with a Homogeneity Exception**.
  *   It violates **Separability** (weights depend on the distribution of complaints).
  *   It violates **Continuity** (thresholds for aggregation).
  *   It is **Non-Welfarist** (inputs are "complaints/reasons," not just "utility").
  *   It is **Not Prioritarian** (it forbids aggregation entirely across heterogeneous magnitudes, whereas Prioritarianism only dampens it).

  The "residue" is the justificatory procedure itself. Economics asks "What is the optimal state?" Scanlon asks "What rules can we live under?" You can model the output of the latter, but you cannot model the process without abandoning the optimization paradigm. Your friend is defending the claim that the process *is* the moral content, not just a heuristic for finding the content.
