  So I'm a third year PhD student in economics, and my dissertation is mostly about social choice and welfare measurement (inequality indices, social welfare functions, that kind of thing). A philosopher friend in my cohort keeps going on about Scanlon's contractualism and something called "the aggregation problem," and honestly i zone out about halfway through every time she explains it. I don't want the cocktail-party version anymore. What I'd like is for you to restate Scanlon's position and the surrounding debate in my vocabulary, as faithfully as you can, and then do what my advisor calls a "residue report" — what survives the translation, what has to be distorted to fit, and what can't be said in my language at all.

  Assume I'm fluent in the following, so don't water it down: social welfare functions (Bergson-Samuelson, ordinal vs cardinal, level comparability vs unit comparability assumptions), Pareto conditions in both weak and strong forms, Pigou-Dalton transfers, Atkinson-style inequality aversion, separability across individuals, and Harsanyi's aggregation theorems — both the impartial-observer version where expected utility behind a veil of ignorance plus Pareto gives you average utilitarianism, and the one where Pareto plus expected utility under common probabilities forces additive separability. I also know the prioritarian stuff that Parfit pushed, i.e. applying a strictly concave transformation to individual utilities and then adding, so if Scanlon's view ends up equivalent to that, say so, and if it doesn't, I want to know exactly where it comes apart.

  Here's the shape of the problem as I've gathered it, and tell me if I've got it wrong: Scanlon holds that a principle is wrong if anyone could reasonably reject it, where the comparison is made person-by-person on the strength of each individual's complaint — so no matter how many people each get a tiny benefit, that pile of tiny benefits can't add up to outweigh one person's severe burden, which sounds to me like an individualist restriction on aggregation, the sort of thing his examples are built for (one guy stuck in the freezing transmitter room so the rest of the crew can keep radio contact, or something like that — I might be butchering the details of the case, correct me if so). The part I can't find in my own toolkit is the move where aggregation is permitted when the complaints are similar in kind, which is where the whole debate with the utilitarian supposedly gets messy. So: map "reasonable rejection" onto something in my world if you can (is it just a non-separable SWF? a lexicographic version of maximin? something with a complaint metric instead of a utility metric?), be explicit about whether Scanlon ends up violating Pareto and whether the philosophers think that's a bullet worth biting, and don't smuggle in my assumptions as if they were part of the translation. Then tell me straight: is the residue (whatever it is, probably this "reasonable to reject" procedural bit that doesn't look like any functional form I know) there because welfare economics is missing something, or because contractualism is vaguer than its fans admit? My suspicion, which you should feel free to demolish, is that once you strip the procedural language it's just prioritarianism with a discontinuity, but my friend swears it isn't and I haven't been able to formulate why in a way that doesn't already concede her point. Please don't give me a reading list, I can't read it anyway right now.
