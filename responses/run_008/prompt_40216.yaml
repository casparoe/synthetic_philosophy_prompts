          *   *Lost:* The justificatory element. "Why" a principle is rejected matters. Economics asks "Which state is better?" Scanlon asks "Can this principle be justified to each?"
      *   **Addressing the User's Suspicion:** Is it just Prioritarianism with a discontinuity?
