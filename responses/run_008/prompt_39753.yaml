          *   Tone: Professional philosopher embedded in quality dept (pragmatic, honest about limitations).
          *   Language: American English.

  2.  **Deconstruct the Theoretical Conflict (Brainstorming):**
      *   *Counterfactual (But-For):* "But for X, would Y have happened?"
          *   *Pros:* Intuitive, legal standard (proximate cause).
          *   *Cons:* Fails on overdetermination (if *both* pump and vial kill, neither is strictly "but-for" because the other would have done it). Treats background conditions (oxygen) same as causes (match).
      *   *Interventionist (Manipulability):* "If we change X (holding others fixed), does Y change?"
          *   *Pros:* Aligns with prevention/improvement. Handles mechanisms better.
          *   *Cons:* "Holding others fixed" is hard in complex systems. Can imply causes that aren't morally/legally salient.
      *   *The "Load-Bearing" Differences for RCA:*
          1.  **Selection vs. Existence:** Philosophy asks "What caused this?" RCA asks "What caused this *that we can change*?" The procedure must separate *Causal Status* from *Actionability*.
          2.  **Abnormality:** Background conditions (gravity, oxygen) are constant. Causes are deviations. The procedure needs a "Normalcy Filter."
          3.  **Overdetermination:** In safety, if two failures align, both are causes, even if one alone sufficed. The "But-For" test fails here. We need an "INUS" condition approach (Insufficient but Non-redundant part of an Unnecessary but Sufficient condition) or a pragmatic "Risk Pathway" approach.
          4.  **Absences:** Omissions are causes in safety (failure to check). Counterfactuals handle this well ("If they *had* checked..."). Interventionists struggle slightly (what variable are you wiggling?), but practically it works.
          5.  **Policy vs. Individual:** The Sepsis case highlights systemic policy vs. individual error.

  3.  **Drafting the Decision Procedure (The "Tool"):**
      *   Need a step-by-step flow.
      *   *Step 1: The Deviation Test (Background vs. Cause).* Is this factor normal or a deviation? (Filters out oxygen/gravity).
      *   *Step 2: The Counterfactual/Intervention Hybrid.* Don't get bogged down in theory. Use "The Fix Test." If we fix this *in this specific scenario*, does the outcome change?
      *   *Step 3: The Overdetermination Clause.* If multiple failures occurred, mark all of them as causal pathways, don't cancel them out.
      *   *Step 4: Causation vs. Remediation.* This is crucial. A cause might not be fixable. A fixable thing might not be the cause of *this* event (but prevents *future* ones).
      *   *Constraint Check:* Needs to be short. Use bold headers. Bullet points.

  4.  **Developing the Worked Cases:**
      *   *Case A (Heparin):* Look-alike vials + Staffing crunch + Nurse error.
          *   *Goal:* Show how multiple causes interact.
          *   *Unwelcome aspect:* Maybe the staffing crunch is a cause but unfixable (budget), or the vial design is a cause but unfixable (manufacturer). Let's make the "Nurse Error" the obvious target, but the procedure should point to the Vials as the stronger *systemic* cause, even if the nurse pulled the trigger. Or, better: The "Staffing Crunch" is a cause, but fixing it is expensive/political.
