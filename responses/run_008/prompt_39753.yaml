          *   *Goal:* Show the Policy vs. Individual tension.
          *   *Unwelcome aspect:* The Policy (disabled alarm) is a *cause*, but it was approved by a committee. Blaming the committee is hard. Or, the Handoff is a cause, but fixing handoffs is hard.
          *   *Selection:* Let's make the "Disabled Alarm" the causal factor, but note that re-enabling it might cause alarm fatigue (new risk). This highlights the separation between *Cause* and *Intervention*.
