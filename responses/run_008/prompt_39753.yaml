answer: |-
  **To:** Patient Safety Officer
  **From:** Embedded Philosophy Consultant
  **Subject:** Causal Attribution Protocol for RCA Teams

  You are right to trust your intuition: **Interventionism (Woodward)** is the correct framework for patient safety, while **Counterfactualism (Lewis)** is the framework your lawyers and insurance adjusters use. They are not the same.

  In a seminar, we argue about whether the oxygen in the room caused the fire. In your hospital, if you list "Oxygen Present" as a root cause, the board will fire you. If you list "Nurse Error" as the *only* cause when the vials were identical, the jury will convict you.

  The procedure below is a hybrid. It uses counterfactuals to filter out the noise (background conditions) and interventionism to validate the signal (fixable variables). It is designed to fit on two pages. It will not solve every metaphysical puzzle, but it will stop your teams from arguing about them.

  ***

  # THE CAUSAL ATTRIBUTION PROTOCOL (CAP)
  **For Use in Root Cause Analysis (RCA) Meetings**
  **Time Allocation:** 45–60 Minutes of the 2-Hour Block

  ### STEP 1: THE DEVIATION FILTER (Background vs. Cause)
  *Goal: Solve the "Oxygen in the Room" problem.*
  List every factor identified in the event timeline. For each factor, ask:

  1.  **Is this factor normally present in this setting?** (e.g., Gravity, standard lighting, the presence of a patient).
      *   **YES:** It is a **Background Condition**. Do not list as a Root Cause.
      *   **NO:** It is a **Candidate Cause**. Proceed to Step 2.
  2.  **Is this a deviation from standard protocol or design?** (e.g., A vial stored in the wrong bin, a policy that deviates from national guidelines, a shift worked beyond 12 hours).
      *   **YES:** It is a **Candidate Cause**.
      *   **NO:** If it is standard practice but still failed, it is a **Systemic Design Flaw** (List as Root Cause).

  ### STEP 2: THE "BUT-FOR" PLUS TEST (Causal Status)
  *Goal: Handle Overdetermination and Absences.*
  For each **Candidate Cause**, run this specific test. Do not use standard "But-For" logic alone.

  *   **The Test:** "If we remove *only* this factor, does the probability of the event drop significantly, **EVEN IF** other errors remained?"
  *   **Apply to Errors of Commission (Action):** If the nurse pushed the wrong button, would the patient be safe if the button required a double-check? Yes. -> **Cause.**
  *   **Apply to Errors of Omission (Absence):** If the safety check was *not* done, treat the "Missing Check" as a variable. "If the Check *had* occurred (holding all else fixed), would the event have been intercepted?" Yes. -> **Cause.**
  *   **Apply to Overdetermination (Two Fatal Errors):** If the Vial was wrong AND the Pump was programmed wrong, and either would kill:
      *   Do **NOT** say "The patient would have died anyway."
      *   **DO** say: "Both factors independently created a lethal pathway."
      *   **Result:** Mark **BOTH** as Root Causes. (We do not cancel out causes because the system failed twice).

  ### STEP 3: THE INTERVENTION VALIDATION (Cause vs. Fix)
  *Goal: Separate Causal Responsibility from Budgetary Action.*
  This is where most RCAs fail. A thing can be a Cause without being a Fixable Target.

  For each confirmed **Root Cause** from Step 2, ask:

  1.  **Can we intervene on this variable?** (Do we have control over it?)
      *   *No (e.g., Patient's underlying genetics, Manufacturer's vial design):* It remains a **Root Cause**, but the Action Plan must be "Mitigation" (e.g., add barriers), not "Elimination."
  2.  **Will intervening here prevent *this* pathway?**
      *   *No (e.g., Buying new monitors when the cause was a Policy that disabled them):* **DO NOT** list this as the Corrective Action for this Cause.
      *   *Note:* You may list it as a "General Safety Recommendation," but it cannot be the close-out action for this RCA.
  3.  **Does this intervention create new risk?** (e.g., Re-enabling an alarm might cause alarm fatigue).
      *   *Yes:* The Cause is valid, but the Action requires a Risk/Benefit review.

  ### STEP 4: FINAL DESIGNATION
  *   **Root Cause:** A Deviation (Step 1) that passes the But-For Plus Test (Step 2).
  *   **Corrective Action:** An Intervention (Step 3) that directly addresses a Root Cause.
  *   **Systemic Recommendation:** A fix that is good idea but does not directly address the specific causal chain of *this* event.

  ***

  # WHERE THE PROCEDURE HANDS BACK TO JUDGMENT
  *Philosophy cannot solve these. You must decide.*

  1.  **The "Policy as Cause" Dilemma:** When a committee voted to disable a safety feature (Case B), the "Cause" is the Policy. The "Responsibility" is diffuse. The procedure will identify the Policy as the cause. **You** must decide if the RCA report names the committee or the system. *Recommendation: Name the System/Policy, not the individuals, unless malice is proven.*
  2.  **The "Cost-Benefit" Cutoff:** The procedure might identify a cause (e.g., "1:1 Nursing Ratio") that is causally potent but financially impossible. The procedure validates it as a Cause. **You** must decide if the Corrective Action is "Implement" or "Accept Risk." *Recommendation: If you accept the risk, document it formally as an "Unmitigated Hazard."*
  3.  **The "Human Error" Trap:** If the procedure identifies "Nurse Fatigue" as a cause, but the hospital culture punishes fatigue reporting, the Corrective Action will fail. **You** must assess cultural readiness before signing off.

  ***

  # WORKED CASES

  ### CASE A: The Heparin Overdose
  **Facts:** Patient received 10x heparin dose.
  **Factors:**
  1.  Nurse covered two units (Staffing Crunch).
  2.  Two look-alike vials stored in same bin (Pharmacy Stocking).
  3.  Nurse did not scan vial (Workaround).

  **Applying CAP:**
  *   **Step 1 (Deviation):**
      *   *Staffing Crunch:* Deviation from safe staffing matrix? **Yes.** (Candidate)
      *   *Look-alike vials:* Deviation from ISMP guidelines? **Yes.** (Candidate)
      *   *No Scan:* Deviation from policy? **Yes.** (Candidate)
  *   **Step 2 (But-For Plus):**
      *   *If Staffing was normal:* Would nurse have been less rushed? Likely. Probability drops. **Cause.**
      *   *If Vials were distinct:* Would nurse have picked wrong one? Unlikely. Probability drops. **Cause.**
      *   *If Scan worked:* Would it have caught error? Yes. **Cause.**
      *   *Overdetermination Check:* Does the vial issue alone suffice? Yes. Does the scanning issue alone suffice? Yes. **Mark All Three as Root Causes.**
  *   **Step 3 (Intervention):**
      *   *Fix Staffing:* Expensive, budget control. **Action: Mitigation (Limit floating staff).**
      *   *Fix Vials:* Manufacturer issue. **Action: Mitigation (Separate bins).**
      *   *Fix Scanning:* Technology exists. **Action: Enforce/Repair.**

  **Result:** Three Root Causes. Three distinct Action tracks. No single "Nurse Error" finding.

  ### CASE B: The Sepsis Death (The Unwelcome Answer)
  **Facts:** Patient died of late-catch sepsis.
  **Factors:**
  1.  Bedside Alarm was disabled (Per Unit Policy, voted 2 years ago).
  2.  Covering Physician missed the handoff page (Individual Error).
  3.  **Proposed Easy Fix:** Purchase new "Smart Pager" system ($15k, easy to approve).

  **Applying CAP:**
  *   **Step 1 (Deviation):**
      *   *Disabled Alarm:* Is this normal? It is *standard for this unit*, but deviates from National Sepsis Guidelines. **Candidate Cause.**
      *   *Missed Page:* Deviation from handoff protocol? **Yes.** **Candidate Cause.**
      *   *Old Pagers:* Are they broken? No, they function as designed. **Background Condition.**
  *   **Step 2 (But-For Plus):**
      *   *If Alarm was Active:* Would sepsis have been caught earlier? Yes. **Root Cause.**
      *   *If Page was Received:* Would physician have acted? Yes. **Root Cause.**
      *   *If Pagers were "Smart":* The page was *missed*, not undelivered. A smarter pager does not change the variable "Physician Attention." **NOT A CAUSE OF THIS EVENT.**
  *   **Step 3 (Intervention Validation):**
      *   *The Unwelcome Answer:* The team wants to list "Buy Smart Pagers" as the Corrective Action for the Missed Page.
      *   **CAP Ruling:** **REJECTED.** The Cause was "Missed Handoff," not "Pager Technology." Buying new pagers does not intervene on the causal variable (Human Attention/Protocol).
      *   *The Hard Fix:* The Cause "Disabled Alarm" traces to a Committee Policy. The Intervention is "Reverse Policy." This will anger the Committee.
      *   *The Hard Fix:* The Cause "Missed Page" requires a process change (e.g., Read-Backs), not hardware.

  **Result:**
  *   **Root Causes:** 1. Alarm Disablement Policy. 2. Handoff Communication Failure.
  *   **Approved Actions:** 1. Review Alarm Policy (High friction). 2. Implement Handoff Read-Back Protocol (Medium friction).
  *   **Rejected Action:** Purchase Smart Pagers. (This is a "Systemic Recommendation" for general upgrade, but **cannot** close this RCA).

  **Why this is unwelcome:** The Board wants to spend $15k on pagers to show action. The Procedure forces you to tell them that pagers won't fix *this* death, and that they actually need to overturn a Committee policy (political friction) or change physician behavior (cultural friction). The philosophy protects you from buying a solution that doesn't match the problem.

  ***

  # WHERE THIS PROCEDURE WILL MISFIRE
  *Be prepared for these objections.*

  1.  **The "Everything is a Cause" Explosion:** In complex system failures, Step 2 may validate 10+ causes.
      *   *Mitigation:* Group them. (e.g., "Communication Failures" rather than listing every missed page).
  2.  **The "Policy is Sacred" Defense:** When Step 1 identifies a Policy as a Deviation (Case B), leadership may claim the Policy *is* the background.
      *   *Mitigation:* Use external benchmarks (National Guidelines). If the policy deviates from the standard of care, it is a variable, not a constant.
  3.  **The "Legal Liability" Fear:** Lawyers may want you to remove "Policy" as a cause to reduce discovery risk.
      *   *Mitigation:* Remind them that hiding the causal variable prevents prevention, increasing long-term liability. The CAP is a safety tool, not a legal shield.

  **Final Note:** This procedure forces you to distinguish between *what happened* (Causation) and *what we can do about it* (Intervention). Your teams will hate this distinction because it makes their jobs harder. That is how you know it is working.
