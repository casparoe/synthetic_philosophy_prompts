prompt: |-
  I'm a senior philosophy major TA-ing our intro-level ethics and society course this term, and the professor just dumped a job on me that I'm honestly not sure I can do well: I have to write the make-up final question for the three students who missed the exam week (one was in hospital, long story). The unit was on the validity of consent -- we covered deception, coercion, and competence as the three standard grounds for invalidating consent, mostly through medical and research-ethics examples. The professor's one instruction was that the question must "punish recitation" -- apparently last year half the class just wrote out the three-part taxonomy with definitions and got full credit, which he's still salty about. So the question has to force students to actually take positions on how the three grounds work, not just name them.

  Here's the scenario I want to build the question around, please use it roughly as-is: a mid-level employee at a pharma company is asked to enroll as a participant in an early-stage trial for a drug her own company is developing. Three things are true at once: (1) the recruiting physician overstates the probability that she'll personally benefit from the drug (deception about magnitude, not about the nature of the procedure); (2) her department head, who knows about the enrollment offer, remarks in a meeting that participants "tend to do well here" -- no explicit threat, and she genuinely can't tell if it was a threat at all; and (3) she has a mild cognitive impairment that leaves her fully competent for everyday and employment decisions but arguably borderline for weighing low-probability research risks. She signs the consent form.

  The question I want should require students to (a) argue for a specific verdict on whether her consent is valid, (b) defend or attack a "counterfactual rescue" move -- i.e., the claim that if she would have consented anyway even without the deception and the pressure, the consent stands -- and (c) say something non-obvious about how the three grounds interact, e.g. whether stacking three individually non-disqualifying defects can add up to invalidity or whether that's double counting. It should be answerable in 90 minutes. I also need a model answer of about 600 words (it should itself take a definite stance, not fence-sit), and a marking scheme worth 20 total marks built around five must-hit points, with a one-line note for each on how students typically blow it. Please don't have the question lean on specific readings or named articles since I can't assume what the make-up takers did vs. didn't get to.

  At the very end, give me one final line starting with "In one sentence:" that captures the single thing seperating an A answer from a B answer on this question, so I can sanity-check my grading instincts against yours.
