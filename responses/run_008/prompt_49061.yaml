answer: |-
  **Make-Up Final Exam Question: Ethics of Consent**

  **Scenario:**
  A mid-level employee at a pharmaceutical company is asked to enroll as a participant in an early-stage trial for a drug her own company is developing. Three conditions obtain simultaneously:
  1.  **Deception:** The recruiting physician overstates the probability that she will personally benefit from the drug (deception about magnitude, not about the nature of the procedure).
  2.  **Coercion/Pressure:** Her department head, who knows about the enrollment offer, remarks in a meeting that participants "tend to do well here." There is no explicit threat, and she genuinely cannot tell if it was a threat or merely an observation.
  3.  **Competence:** She has a mild cognitive impairment that leaves her fully competent for everyday and employment decisions but arguably borderline for weighing low-probability research risks.
  She signs the consent form.

  **Prompt:**
  Write an essay arguing for a definite verdict on whether her consent is morally valid. In your argument, you must:
  1.  **Take a Stand:** Declare the consent either valid or invalid and justify this using the details above.
  2.  **Evaluate the Counterfactual:** Address the claim that "if she would have consented anyway even without the deception and pressure, the consent stands." Defend or reject this "counterfactual rescue."
  3.  **Analyze the Interaction:** Explain how the three grounds (deception, coercion, competence) interact. Does stacking three individually non-disqualifying defects create invalidity, or is counting them all "double counting"?

  *Time Allowed: 90 Minutes*

  ***

  **Model Answer**

  The employee's consent is invalid. While any single defect described might be survivable in isolation, the convergence of all three creates a decision-making environment that fails to respect her autonomy. Valid consent requires not just a signature, but a voluntary, informed, and competent authorization. Here, the structural power dynamics and cognitive vulnerabilities undermine all three pillars simultaneously.

  Regarding the verdict, the critical factor is the sliding scale of competence. Competence is decision-specific; while she can manage employment tasks, research risks involve probabilistic reasoning outside her usual scope. Because her capacity is borderline for this specific high-stakes choice, the threshold for what counts as acceptable information and pressure must be raised. She requires *more* accuracy and *less* pressure than a fully capacitated adult, not less. She receives neither.

  This leads to the rejection of the "counterfactual rescue." The claim that consent stands if she would have agreed anyway is fundamentally flawed because it conflates outcome with process. Consent is a procedural right, not a utilitarian calculation. If the process is tainted by manipulation, the moral authority of the authorization is voided regardless of the hypothetical outcome. To argue otherwise is to suggest that autonomy is only valuable when it produces unique choices, rather than when it reflects genuine agency. If we allow deception because the result was "going to happen anyway," we treat the participant as a means to an end, violating the core Kantian constraint underlying research ethics. The validity of consent rests on the actual conditions of the agreement, not a hypothetical clean version of events.

  Finally, the interaction of the three grounds is synergistic, not additive. It is not double-counting to cite all three because they mutate each other. The mild cognitive impairment makes the ambiguous comment from the department head more coercive than it would be for a neurotypical peer; her reduced capacity to parse social nuance amplifies the pressure. Similarly, the deception about benefit magnitude matters more because her borderline competence reduces her ability to skepticism-check the physician's claim. Individually, the boss's comment might be too vague to count as coercion, and the cognitive impairment too mild to declare incompetence. But together, the impairment lowers the resistance to the pressure, and the pressure exploits the impairment. The deception seals the trap by masking the risk.

  Therefore, the consent is invalid. The defects do not cancel out; they compound. The employee was not given the protected status her vulnerability required, nor the transparency her autonomy demands. To validate this consent would be to prioritize administrative convenience over the ethical integrity of the research relationship.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Definite Verdict & Core Justification (4 Marks)**
  *   **Must Hit:** Student clearly states "Valid" or "Invalid" and links it to the autonomy/protection framework.
  *   **Common Failure:** Hedging the verdict (e.g., "It depends on how you look at it") without committing to an argument.

  **2. Counterfactual Rescue Analysis (4 Marks)**
  *   **Must Hit:** Student identifies that counterfactuals ignore the procedural nature of consent (process vs. outcome).
  *   **Common Failure:** Treating the counterfactual as a legitimate loophole rather than addressing why it undermines autonomy.

  **3. Interaction/Stacking Argument (4 Marks)**
  *   **Must Hit:** Student argues that defects amplify each other (synergy) rather than treating them as isolated checkboxes.
  *   **Common Failure:** Analyzing the three grounds in separate silos without explaining how they influence one another.

  **4. Application of Competence (4 Marks)**
  *   **Must Hit:** Student applies the "sliding scale" view (competence varies by task risk) rather than a binary competent/incompetent view.
  *   **Common Failure:** Defining competence generally without applying the specific "borderline research risk" detail from the prompt.

  **5. Application of Coercion/Deception (4 Marks)**
  *   **Must Hit:** Student explains how vulnerability makes ambiguous pressure coercive or exaggeration material.
  *   **Common Failure:** Reciting definitions of coercion/deception without explaining why *this* specific comment or lie matters.

  ***

  In one sentence: An A answer treats the three defects as synergistic forces that alter the context of decision-making, while a B answer treats them as isolated checkboxes to be ticked off independently.
