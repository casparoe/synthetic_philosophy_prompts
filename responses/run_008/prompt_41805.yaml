      *   **Current Understanding:** Grasps the motivation for Epistemic Structural Realism (ESR) (No Miracles Argument vs. Pessimistic Meta-Induction, Fresnel/Maxwell case).
      *   **Problem:** Cannot grasp the *Newman Objection*. Finds the professor's dismissal ("mere cardinality point") too quick, but sees the literature as split (nuisance vs. fatal).
