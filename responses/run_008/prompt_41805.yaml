      *   *Conclusion:* If all we claim is "the world has structure $S$," and we don't specify *what* the relations are (intrinsically), then the claim reduces to "the world has enough objects to support structure $S$."
      *   *The "Cheating" Question:* Why can't we say "Structure $S$ *with* relations $R_1, R_2$..."? Because if we specify $R_1$ intrinsically (e.g., "causation," "mass"), we've violated the ESR constraint that we don't know the intrinsic nature of the relations, only their formal pattern.

