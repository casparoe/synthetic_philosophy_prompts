answer: |-
  Your diagnosis is sharp, and it captures the *methodological* texture of the impasse accurately. However, I would argue that the methodological disagreement is a symptom of a deeper, metaphysical divergence regarding the nature of agency and causation. If we treat this merely as a dispute over which intuitions count as "data," we risk overlooking the fact that the two sides are operating with incompatible maps of moral reality.

  Here is a diagnosis of the structure of the disagreement, an evaluation of your hypothesis, and an assessment of what could constitute progress.

  ### 1. Evaluating Your Hypothesis: The Status of the Datum
  You suggest Side A (Equivalists, e.g., Rachels, Tooley) treats the verdicts on matched cases as artifacts to be explained away, while Side B (Non-Equivalents, e.g., Foot, Quinn, Kamm) treats them as robust data.

  This is mostly correct, but requires a slight adjustment.
  *   **Side A** does not treat the *verdict* (that killing is worse) as data; they treat the **principle of moral supervenience** as the datum. Their fixed point is: "If intent and outcome are identical, moral status must be identical." When intuition conflicts with this, intuition is the artifact.
  *   **Side B** treats the **asymmetry of agency** as the datum. Their fixed point is: "There is a phenomenological and structural difference between initiating a sequence and failing to interrupt one." When theory suggests these are equivalent, the theory is incomplete.

  So, the disagreement is not just about "which intuitions to keep," but about **which moral principle is axiomatic**. Side A axioms are outcome/volition-centric; Side B axioms are agency/causation-centric. Your hypothesis identifies the stalemate correctly (each sees the other's move as question-begging), but the root is not merely methodological; it is metaphysical.

  ### 2. The Hidden Question: The Metaphysics of Action
  The "real work" you suspect is being done by a hidden question is indeed about the **individuation of actions** and the **metaphysics of causation**.

  *   **Causal Structure:** Side B relies on a "process" view of causation. Harm flows from a threat; the killer inserts a new threat, the allow-er fails to block an existing one. Side A relies on a "counterfactual" view of causation. In both cases, the victim dies who would not have died otherwise. If the counterfactual dependence is identical, the causation is morally identical.
  *   **The Ontology of Omissions:** Side B must defend the claim that "allowing" is a morally relevant relation, even if it involves no physical movement. Side A often argues that "omissions" are not events at all, but merely the absence of events. If omissions aren't events, they cannot bear the same moral weight as commissions unless we invoke a separate duty to act.

  The impasse persists because philosophers are arguing moral conclusions while silently disagreeing on the metaphysics of action. When a Non-Equivalist says, "The harm flows through the world," they are making a metaphysical claim about causal vectors. When an Equivalist says, "You changed the outcome," they are making a metaphysical claim about possible worlds. These claims are incommensurable without a prior agreement on what causation *is*.

  ### 3. The Heterogeneity of "Allowing"
  Your suggestion that "allowing" might be a family rather than a category is perhaps the most promising avenue for dissolving the problem. This was Philippa Foot's original insight, which often gets lost in the subsequent simplification of the debate.

  *   **Removing Aid vs. Not Giving Aid:** There is a moral difference between unplugging a life-support machine (removing aid you are providing) and refusing to pay for a stranger's surgery (not giving aid). Both are "letting die," but the former looks more like killing because it involves an intervention in an existing causal chain.
  *   **The Problem:** The Equivalist strategy relies on lumping all "allowings" together to match them against "killings." The Non-Equivalist strategy relies on distinguishing types of "allowings" to preserve the distinction.

  Progress was actually made here in the 1980s (largely by Foot and Quinn), but the debate reverted to the binary "Killing vs. Letting Die" because the nuanced view is harder to operationalize in bioethics policy. The impasse is partly a reification of a false dichotomy.

  ### 4. What Would Count as Progress?
  Given this structure, here is an evaluation of potential paths forward:

  **A. A New Kind of Case? (Low Value)**
  More thought experiments (Trolley variants, Transplant cases) are unlikely to help. We have reached "intuition fatigue." Both sides have developed theoretical immune systems to handle new cases. Side A explains away the intuition as a confound; Side B incorporates the intuition as evidence of structural difference. Adding more data to a broken model doesn't fix the model.

  **B. Empirical Results / X-Phi? (Moderate Value)**
  Experimental philosophy shows that intuitions about doing/allowing vary by culture, order of presentation, and framing.
  *   *Progress:* This undermines Side B's claim that the distinction is a robust, universal moral datum. If the intuition is fragile, it is less likely to support a heavy deontological constraint.
  *   *Limit:* Side B can reply that folk morality is often wrong (the "error theory" defense). Knowing *that* people distinguish them doesn't tell us if they *should*.

  **C. A Conceptual Distinction? (High Value)**
  The most viable path is shifting the question from **"Is there a difference?"** to **"Under what conditions does the difference matter?"**
  *   *Threshold Deontology:* Perhaps the distinction creates a "moral cost" that can be outweighed by sufficiently large consequences. This moves the debate from a binary (significant/insignificant) to a weighting problem.
  *   *Causal Granularity:* Progress requires a unified theory of action that explains *why* omissions sometimes feel like actions. If we can define "agency" not by muscle movement but by **control over the necessary conditions of an outcome**, we might bridge the gap. If I control the only switch that saves you, my not flipping it is functionally identical to me flipping a switch that kills you.

  **D. An Argument That No Progress Should Be Expected? (Highest Probability)**
  It is highly probable that this is a **foundational worldview clash** akin to the Realist/Anti-Realist debate.
  *   The Equivalist position is the natural companion to Consequentialism (states of affairs matter).
  *   The Non-Equivalist position is the natural companion to Deontology (relations between agents matter).

  If your moral theory prioritizes the *Good* (outcomes), the doing/allowing distinction vanishes. If your moral theory prioritizes the *Right* (agency and boundaries), the distinction is essential. Since there is no neutral arbiter between Consequentialism and Deontology, there can be no neutral arbiter here.

  ### Conclusion
  Your diagnosis is right that the disagreement is meta-ethical (about data), but that meta-ethical disagreement is grounded in a metaphysical one (about causation and agency).

  **Progress will not come from better cases.** It will only come from:
  1.  **Dissolution:** Showing that "allowing" is not a unitary category, rendering the binary debate ill-posed.
  2.  **Integration:** Developing a theory of agency where "refraining" is understood as a specific type of causal intervention (e.g., via control theory), which might satisfy Side A's demand for causal symmetry while preserving Side B's intuition about agency.
  3.  **Acceptance:** Acknowledging that the distinction is a proxy for the Consequentialist/Deontological divide, and that "progress" is simply clarifying which foundational framework one occupies, rather than proving one side universally correct.

  The most honest philosophical move now is likely the third: to admit that the doing/allowing distinction is not a puzzle to be solved, but a boundary marker between two incompatible moral topographies.
