      *   *Result:* $K(p \land \neg K p) \to (Kp \land K\neg Kp) \to (Kp \land \neg Kp)$. Contradiction.
      *   *Conclusion:* $\neg \exists p (p \land \neg K p)$, i.e., $\forall p (p \to K p)$ (Omniscience).
