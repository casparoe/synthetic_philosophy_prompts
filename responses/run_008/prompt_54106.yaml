answer: |-
  Here is a discussion plan designed for a 50-minute chalkboard session. It prioritizes conceptual clarity over formalism and targets the specific misconceptions you identified.

  ### **Phase 1: The Setup (0–10 Minutes)**
  **Goal:** Shift the frame from "Utility causes Choice" to "Choice reveals Preference."

  **Chalkboard Action:** Draw a large black box in the center.
  *   **Left Arrow (Input):** Prices ($p$) + Income ($m$).
  *   **Right Arrow (Output):** Chosen Bundle ($x$).
  *   **Inside the Box:** Write "???" and then cross out "Utility."

  **Talking Points:**
  1.  **The Problem with Utility:** Acknowledge their recent training. They know $U(x)$. But ask: "Can I see your utility? Can I measure it with a ruler?" No. It's a mental construct. If economics is to be a science of observation, we need to explain the *Output* using only the *Input* and the *Output* itself.
  2.  **The Proposition:** Samuelson's idea: We don't need to know what's inside the box. If we watch you long enough, your choices *become* the preference map.
  3.  **The Rule:** If you choose Bundle A when Bundle B was affordable (same prices/income), you have "revealed" A is preferred to B. Not because you said so, but because you *could* have bought B and didn't.

  ---

  ### **Phase 2: The Concrete Example (10–25 Minutes)**
  **Goal:** Use a single scenario to demonstrate recovery and consistency.
  **Recommendation:** Do not use the cafeteria tray if it implies discrete, fixed bundles. Use **"Pizza and Soda"** with a weekly budget. This allows you to draw continuous budget lines that cross, which is visually essential for showing "affordability."

  **Chalkboard Action:**
  1.  **Week 1:** Draw Budget Line 1 ($BL_1$). Mark a point **A** on the line.
      *   *Scenario:* Pizza \$2, Soda \$1, Budget \$10. You buy 3 Pizzas, 4 Sodas (Bundle A).
      *   *Question:* "Was Bundle B (2 Pizzas, 6 Sodas) affordable?" (Yes, it's on or under the line).
      *   *Conclusion:* You revealed A $\succ$ B.
  2.  **Week 2:** Draw Budget Line 2 ($BL_2$) crossing $BL_1$. Mark a point **B** on the new line.
      *   *Scenario:* Prices change. Pizza \$1, Soda \$2, Budget \$10. You buy 2 Pizzas, 6 Sodas (Bundle B).
      *   *Crucial Check:* Look at the diagram. Is Bundle A affordable under Week 2 prices?
      *   *Case 1 (Consistent):* If A is *outside* $BL_2$, you had no choice. No new info.
      *   *Case 2 (Violation):* If A is *inside/on* $BL_2$ and you chose B anyway, you have contradicted yourself.

  **Why this example works:**
  *   It shows **Recovery:** We established A $\succ$ B without asking feelings.
  *   It shows **Limits:** We know A $\succ$ B. We do *not* know if A $\succ$ C if C was never affordable in either week. We also don't know *how much* more you like A (intensity).

  ---

  ### **Phase 3: The Tautology Fork (25–35 Minutes)**
  **Goal:** Confront the circularity objection *before* it solidifies. This is the pivot point of the lecture.

  **The Moment:** Stop immediately after Week 1 (after establishing A $\succ$ B).

  **Chalkboard Action:** Write in large letters: **"IS THIS CIRCULAR?"**
  Draw a loop: *Choice $\rightarrow$ Preference $\rightarrow$ Choice.*

  **Scripting the Fork:**
  1.  **Voice the Objection:** "A student might say: 'This is empty. You're saying I chose A because I prefer A, and I prefer A because I chose A.' If we stop at Week 1, they are right. It is just a label."
  2.  **The Turn:** "Revealed Preference is not a description of one choice. It is a **constraint on future choices**."
  3.  **The Bite:** Return to Week 2. "The theory has 'bite' only if it can be *wrong*."
      *   If in Week 2, Bundle A is still affordable but you choose B, the theory says: **"This is impossible for a rational agent with stable preferences."**
      *   Utility theory says you maximize $U$. RP says you cannot contradict your past revealed rankings.
      *   If you do contradict, we don't say "Your utility changed." We say "The model of stable preferences fails here."
  4.  **Takeaway:** Utility is a *story* we tell to explain one choice. Revealed Preference is a *rule* that links many choices together. One is descriptive; the other is restrictive.

  ---

  ### **Phase 4: What RP Cannot Say (35–40 Minutes)**
  **Goal:** Define the boundaries of the silence.

  **Chalkboard Action:** Draw a question mark over the space between Bundle A and Bundle B.

  **Talking Points:**
  1.  **Intensity:** RP can tell me you prefer Pizza to Soda. It cannot tell me you love Pizza *twice as much*. There is no "number" in RP.
  2.  **Unobserved Regions:** If there is a Bundle C that was never affordable in Week 1 or Week 2, RP is silent. We cannot rank C against A or B without assuming more (like convexity), which we are avoiding today.
  3.  **Happiness:** RP explains consistency, not welfare. Just because you revealed a preference for cigarettes over milk doesn't mean you are "better off" in a health sense. It just means you chose it.

  ---

  ### **Phase 5: What to Deliberately Refuse (40–45 Minutes)**
  **Goal:** Protect the model's assumptions without getting bogged down.

  **Topics to Exclude:**
  1.  **Time-Varying Preferences:** (e.g., addiction, trends, "I'm tired of pizza").
  2.  **Household/Group Choice:** (e.g., "My roommate and I decided together").

  **How to Handle Pushback:**
  If a student asks: *"But what if I just liked pizza less this week? Or what if I'm buying for my roommate?"*
  *   **Your Response:** "That is an excellent real-world observation. But Revealed Preference relies on one axiom: **Stability**. We are assuming 'You' are the same 'You' as last week, and your tastes haven't shifted."
  *   **The Bridge:** "If preferences shift randomly, *no* economic model can predict behavior. We assume stability to see if there is a pattern. If you bring in changing tastes or group bargaining, we are no longer testing *individual rationality*; we are testing sociology. For this model, we hold tastes constant to test consistency."
  *   **Why:** This keeps the section on track. Acknowledge the limitation, but frame it as a necessary condition for the model to function, not a flaw in the logic.

  ---

  ### **Phase 6: The Assessment Question (45–50 Minutes)**
  **Goal:** Test if they see RP as a constraint, not a number.

  **The Question:**
  > "Imagine I observe you in two different stores.
  > *   **Store 1:** Apples are \$1, Oranges are \$1. You buy 5 Apples. (Oranges were affordable).
  > *   **Store 2:** Apples are \$10, Oranges are \$1. You buy 5 Oranges.
  >
  > **Question:** Did you violate Revealed Preference? Why or why not?"

  **What to Listen For:**
  *   **The "Parrot" Answer:** "No, because you maximized utility both times." (This misses the point).
  *   **The "Utility" Answer:** "Maybe Apples gave you less utility in Store 2." (This violates the stability assumption).
  *   **The "Grasp" Answer:** "No violation. In Store 2, the 5 Apples would cost \$50. If your budget didn't increase, the Apples were likely **not affordable** when you chose the Oranges. RP only forbids choosing B when A was affordable. It does not forbid choosing B when A is too expensive."

  **Why this works:** It forces them to check the *affordability condition* (the constraint) rather than guessing at the *mental state* (the utility). If they check the budget constraint first, they understand the concept. If they speculate on your taste for apples, they have reverted to the utility mindset.

  ### **Summary of Chalkboard Layout**
  1.  **Left:** The Black Box (Inputs $\rightarrow$ Outputs).
  2.  **Center:** The Two Budget Lines crossing (Week 1 vs. Week 2) with Bundles A and B marked.
  3.  **Right:** "IS THIS CIRCULAR?" $\rightarrow$ "CONSTRAINT ON FUTURE CHOICE."
  4.  **Bottom:** The Assessment Question.
