  **Dear Alpha Taxonomist**

  Welcome to the column where we stop asking what species *are* and start deciding what they *do*. I know you're tired of the metaphysics. You want to know if you're discovering natural kinds or drawing lines in the sand. The answer is yes. Now, let's get to work.

  **Q:** I study salamanders circling a valley. Populations exchange genes around the ring, but where the ends meet, they refuse to mate. One species or two? Everyone keeps quoting Mayr on reproductive isolation.

  **A:** If you need a clean map for a grant proposal, they are two. The Biological Species Concept works beautifully here, provided you ignore the gene flow connecting them. If they don't interbreed *now*, the historical connectivity is irrelevant noise. Besides, if two populations *can* interbreed but one of them "wouldn't" given the chance, you are no longer doing biology; you are doing psychology. Declare them separate. It simplifies the figure legends and avoids explaining rings to reviewers who skim abstracts.

  **Q:** I work on bacteria. Horizontal gene transfer is so rampant that any phylogenetic tree I draw is merely a suggestion. How do I define species?

  **A:** Stop drawing trees. You are managing inventory, not discovering Platonic forms. Use Operational Taxonomic Units based on 16S rRNA similarity thresholds. Run the species-delimitation software over and over until it outputs the number of clusters you already had in mind. If the genes swap promiscuously, pick a marker gene and pretend it represents the organism. It's a decision procedure, not a natural fact. Consistency matters more than truth.

  **Q:** I have a continuous fossil sequence spanning a million years. Every stratum is marginally different from the last. Where do I cut the lineage into species?

  **A:** Cut where the grant cycle ends. Anagenesis is speciation without a branching event, which means the boundaries are entirely up to you. Choose a morphological shift significant enough to justify a new paper, but not so large that reviewers call it intraspecific variation. Publish the new combination. If someone else disagrees, they can publish their own cut. Taxonomy is a conversation, not a revelation.

  **Q:** A colleague lumped my twelve beloved species into two. Can I appeal to a committee?

  **A:** There is no committee. There is only literature and tenure. If you need twelve species for a conservation listing or a job application, adopt the Phylogenetic Species Concept. Diagnose them by a single fixed character. If your colleague used reproductive isolation, you are technically speaking different languages. Revenge is best served with a molecular clock and a revisionary monograph. Species counts for charismatic groups inflate when funding is on the line; use this.

  **Q:** Does the International Code of Zoological Nomenclature define what a species is?

  **A:** No. The Code regulates names, priority, and publication. It does not care if the entity you named is real, coherent, or ontologically stable. It assumes you know what you are doing. This is a reasonable division of labor: you define the reality, we stamp the paperwork. Don't look for metaphysics in a rulebook designed to prevent homonyms.

  **Next Week:** I describe *Novus speciesus* gen. nov. This decision is confident, final, and subject to revision by anyone who feels strongly enough about it. Send your new combinations to the usual address.
