      *   The "Technically True" defense is a form of *epistemic negligence*.

  8.  **Final Polish:** Check against the user's specific constraints. They want to know if the standard of accuracy is built on the wrong axis. I need to confirm that yes, focusing solely on factual error (propositional truth) is insufficient for modern media consumption (pragmatic truth).

