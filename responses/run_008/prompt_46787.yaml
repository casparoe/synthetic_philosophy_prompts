      *(One more thought)*: The user mentioned they sound like a "press officer." I should explain why. Press officers protect the *organization's* liability. Journalists protect the *public's* understanding. The editor is acting like a press officer (protecting clicks/technical defense); the journalist is acting like a journalist. I should flip that script for them.

