answer: |-
  This is an exceptionally sharp observation. You have identified the central fault line in contemporary **metaontology** (the study of what ontological questions mean and how they should be answered).

  The pattern you are seeing is not just a quirk of your reading group; it is the defining debate of metaphysics over the last 30 years. The "second-order thing" you want a name for is the **Deflation-Realism Debate in Metaontology**, and the specific configuration is a dispute over the status of a **Merely Verbal Dispute**.

  Here is a breakdown of the established terminology, the literature on criteria, the names for the opposing positions, and a proposed taxonomy for the specific moves you are observing.

  ### 1. The Established Name for the Situation

  The field is **Metaontology**. The specific phenomenon is the **Diagnosis of Verbal Disputes**.

  When one party claims the argument is empty because of language, they are advancing the **Verbal Dispute Thesis**. When the other party insists there is a substantive fact of the matter remaining, they are advancing a claim of **Metaontological Realism** (or Substantivism).

  Therefore, the second-order argument you are witnessing is a **Metametaphysical Dispute**. It is no longer about chairs; it is about whether the question "Do chairs exist?" is a question about the world or a question about how we choose to speak.

  ### 2. The Two Positions (and their Names)

  You asked for a name for the position of those who think the dissolution *fails* (the ones insisting there is a fact of the matter).

  *   **The Dissolvers (Position A):** These are **Ontological Deflationists** (or sometimes **Carnapians**, after Rudolf Carnap). A specific technical version of this view is **Quantifier Variance** (championed by Eli Hirsch). They believe the word "exists" (the existential quantifier) can mean different things in different conceptual schemes without one being "wrong." To them, saying "chairs exist" is true in the folk scheme, and "only particles exist" is true in the physicalist scheme, and there is no "God's eye view" to judge between them.
  *   **The Refusers (Position B):** These are **Metaontological Realists** (or **Inflationists**). Prominent proponents include Ted Sider and Peter van Inwagen. They argue that existence is not a matter of linguistic convention. They believe there is a single, objective structure to reality ("joint-carving" structure) and that the word "exists" attempts to track that structure. To them, saying "it's just semantics" is a substantive (and false) claim that reality has no structure independent of our language.

  ### 3. Literature on Criteria: When does dissolution work?

  You noted that sometimes the dissolution succeeds (everyone loses interest) and sometimes it fails (the realist digs in). The literature addresses this explicitly. The most important paper on this is:

  *   **David Chalmers, "Verbal Disputes" (2011).**

  Chalmers offers criteria for determining if a dispute is merely verbal. A dispute is merely verbal if:
  1.  **Paraphrase:** One party can paraphrase their claim into the other party's terminology without losing the "intuitive force" of their point.
  2.  **Charity:** Interpreting the dispute as verbal makes both parties come out as more reasonable/true than interpreting it as substantive.
  3.  **No Residue:** Once the terminology is aligned, there is no remaining disagreement about the non-linguistic facts.

  **Why it fails in your group:**
  The Realist (Position B) rejects Chalmers' criteria. They argue that some concepts are **non-negotiable**.
  *   *Example:* In the "hole" argument, the Deflationist says, "A hole is just a description of the pipe." The Realist says, "No, causal powers depend on the hole. If the hole is blocked, the pipe doesn't work. The hole has causal efficacy; therefore, it is an entity."
  *   *The Edge:* The dissolution fails when the concept in question plays a **functional or causal role** that cannot be captured by simple paraphrase. If "corporation" allows for legal liability that cannot be assigned to specific individuals, the Realist argues "corporation" names a real social object, not just a shorthand for "people."

  ### 4. Naming the Moves (Coining Terms)

  While "Deflationism" and "Realism" name the *positions*, you asked for terms to describe the *moves* within the thread. These established terms can be a bit dry. Here are two functional terms that mark off the clear cases from the borderline ones, which you can use in your group:

  #### Move 1: Semantic Dissolution
  *   **Definition:** The move that attempts to resolve a disagreement by demonstrating that the parties assign different truth-conditions to the same sentence, and that once these conditions are aligned, the disagreement vanishes.
  *   **Clear Case:** Two people arguing over whether a "tomato is a fruit." One means culinary fruit (sweet), one means botanical fruit (seed-bearing). Once distinguished, the argument ends.
  *   **Borderline Case:** The "chair" argument. The Deflationist says, "You mean 'useful arrangement of particles,' I mean 'fundamental entity.'" The Realist replies, "No, I mean that *useful arrangements* do not have ontological standing." Here, Semantic Dissolution fails because the disagreement is about *what deserves standing*, not just definition.

  #### Move 2: Ontological Insistence
  *   **Definition:** The counter-move that rejects Semantic Dissolution by claiming that the usage of the term is constrained by mind-independent facts (or structural facts about the world) that make one usage correct and the other incorrect.
  *   **Clear Case:** "The Earth is flat." You cannot dissolve this by saying "We define 'flat' differently." The shape of the Earth constrains the usage.
  *   **Borderline Case:** "Corporations exist." The Insister says, "The legal system treats them as agents; that is a fact about the world, not just our dictionary." The Dissolver says, "That's just a social game." This is the hard border: **Social Ontology**.

  ### 5. Summary of the Phenomenon

  The phenomenon you are tracking is the **collapse of first-order ontology into metaontology**.

  1.  **First-Order:** "Do chairs exist?"
  2.  **Metaontological:** "Is the question 'Do chairs exist?' a substantive question?"
  3.  **Metametaphysical:** "Is the claim that 'the question is not substantive' itself a substantive claim?"

  The frustration in your group arises because **Ontological Deflationism masquerades as neutrality.** It presents itself as "clearing up confusion," but the Realists correctly identify that it is actually a positive theory of reality (a theory that says reality does not contain chairs).

  ### 6. Recommended Reading for Your Group

  If you want to give your members the vocabulary to escape the loop, assign these three texts (or summaries thereof):

  1.  **Rudolf Carnap, "Empiricism, Semantics, and Ontology" (1950).** The classic source of the "internal vs. external" questions distinction. (The source of the Dissolution move).
  2.  **W.V.O. Quine, "On What There Is" (1948).** The classic source of the idea that "to be is to be the value of a variable." (The source of the Realist move).
  3.  **David Chalmers, "Verbal Disputes" (2011).** The modern referee that explains when the Dissolution works and when it doesn't.

  ### 7. A Diagnostic Tool for Your Group

  To stop the arguments from spinning, you can introduce a **"Residue Test."**

  When someone claims the argument is "just semantics," ask them:
  > "If we agree on the definition of the word, is there any **counterfactual** scenario where we would still disagree?"

  *   **Example (Chairs):** If we agree "chair" means "arrangement of particles suitable for sitting," do we still disagree?
      *   *Deflationist:* "No. Then chairs exist."
      *   *Realist:* "Yes. Because even if particles are arranged that way, 'chair' implies a unity that particles don't have. If I remove one atom, is it still the same chair? The particles say yes/no based on physics; the chair says yes/no based on identity. That difference is the residue."

  If there is a **Residue** (a disagreement about counterfactuals, causal powers, or identity conditions that remains after definitions are aligned), then **Ontological Insistence** is warranted, and **Semantic Dissolution** has failed. If there is no Residue, the argument was merely verbal.

  ### Final Terminology Recommendation

  For your reading group, I recommend using these two labels to categorize the moves:

  1.  **The Deflationary Diagnosis:** "This is a verbal dispute; we are talking past each other."
  2.  **The Metaphysical Rejoinder:** "The diagnosis itself is a substantive claim that denies the structure of reality."

  This captures the exact dynamic you described: the fight over whether the fight is real.
