prompt: |-
  A guy in my poli-sci seminar keeps ending arguments by saying 'that's just not compatible with Western values', and I watched him do it twice in one week for opposite conclusions. First he said teaching secularism as non-negotiable in French public schools is fine because laïcité is a Western value and immigrants have to adapt to it. Two days later he argued a proposed ban on headscarves at universities goes too far — because, you guessed it, it violates Western values of individual freedom. Same phrase, both directions, and when I pushed him he just said 'you know what I mean, the Western tradition, Greece and Rome and the Enlightenment, that whole thing.' I genuinely don't know what he means, and I'm starting to suspect the phrase is several different claims stapled together that only feel like one thing.

  Can you take 'Western values' apart for me? I want the distinct precise claims that phrase could actually be standing for when someone deploys it like this — for each one, tell me whether it's trivially true, substantive but defensible, or just false/incoherent. I'm guessing some readings are basically descriptive (values that happen to originated in the West, or that most Westerners hold, or that are written into Western legal institutions) and some are normative in disguise, and I'd bet the normative ones are where all the argumentative work gets done while the descriptive ones supply the illusion of evidence. But I can't sort out which is which.

  Also two specific things: (1) for each reading, does it actually support the move he's making — ending a debate by appeal to the phrase as if it were an authority? It seems like some readings would cut against his headscarf position and some for it, so it'd be great if you could show which reading he'd need for each of his two claims, and whether there's any single reading that makes him consistent across both. (2) Where does the whole thing get circular — like if 'Western values' means 'the values of the societies I approve of', then appealing to them in an argument about what to approve of is just 'values I like' wearing a geography costume, right?

  Lay it out as a list I can bring to class. And don't go easy on him, but also don't go easy on me — if one of his uses is actually fine and I'm the one missing something, say so. He's a smart guy and I beleive at least one of his two claims is right, I just want to know which one and on what basis.
