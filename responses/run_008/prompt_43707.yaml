answer: |-
  Hi there,

  Thanks for sharing this design doc. It is genuinely exciting to see someone trying to wire experimentalist democracy into actual municipal infrastructure rather than just writing papers about it. You asked for a sanity check through a Deweyan lens, and you also asked me to be honest if that framing is itself a trap. So I will start there. Asking what John Dewey would say about prediction markets and LLMs is, strictly speaking, a parlor game. He died in 1952. He saw the rise of mass polling and radio, and he was skeptical of both because they tended to make citizenship passive. He viewed democracy not as a mechanism for aggregating pre-existing preferences but as a mode of associated living where preferences are transformed through communication. If we treat his texts as scripture to validate your pilot, we are doing exactly what he warned against when he criticized dogmatic adherence to past forms. However, using his logic as a stress test for your assumptions is useful. So let us treat this not as channeling the dead but as applying a pragmatic heuristic to see where your design might drift away from democracy as inquiry and toward democracy as technocratic management.

  On the prediction market piece, I think Dewey would be deeply ambivalent, and probably more skeptical than you hope. He valued intelligence, but for him, intelligence was active inquiry into consequences, not just betting on them. A prediction market aggregates private opinions into a public price, which looks like social intelligence on the surface. But Dewey would ask whether the people placing the bets are engaging in the work of understanding the problem or just speculating on an outcome they have no hand in shaping. If the bettors are distinct from the deliberators, you have created a split between those who judge the consequences and those who decide the action. For Dewey, the public constitutes itself by recognizing the indirect consequences of transactions. If the market price becomes the metric of success, you risk replacing moral and social inquiry with financialized validation. He might grudgingly like that it forces attention to measurable outcomes rather than vague ideologies, but he would worry that it turns the public into spectators watching a scoreboard rather than participants in an experiment. It is a snapshot of opinion, and Dewey spent much of The Public and Its Problems arguing that opinion is not public judgment. Judgment comes from the hard work of deliberation, not the aggregation of hunches.

  Then there is the LLM summarization. This is where I think you need to be most careful. Dewey cared immensely about communication as the process through which a public becomes aware of itself. It is not just about transmitting information efficiently; it is about the shared experience of reading, arguing, and making meaning together. If you route public feedback through a model, you are inserting a black box into the communicative circuit. You might say it is just a tool like the printing press, but the printing press amplified human voice while preserving its origin. An LLM synthesizes and often homogenizes. If the citizens in the assembly do not read the raw feedback themselves, they are not experiencing the public's voice; they are experiencing the model's interpretation of it. Dewey would likely ask whether this tool enhances the capacity of the public to understand itself or whether it alienates them from the raw material of their own conflict. If the summary hides the dissent or smooths over the contradictions that are essential for inquiry, then you have optimized for comfort rather than learning. He might accept it if it is treated as a provisional draft that the humans must argue over, but if it becomes the authoritative record, you have replaced communication with computation.

  Regarding sortition, this is probably the most Deweyan element you have, but with a caveat. He was deeply worried about the capture of democracy by elites and experts who isolate themselves from the common experience. A randomly selected body breaks that elite capture and returns decision-making to ordinary experience, which aligns with his faith in the capacity of common people to reason when given the right conditions. However, Dewey's ideal was the Great Community, not a mini-public. He worried that representative bodies, even randomly selected ones, can become proxies that allow the rest of the public to disengage. If the assembly deliberates and the rest of the city just watches the prediction market odds, you have not created a public; you have created a focus group. For this to be Deweyan, the inquiry of the assembly must leak out and stimulate inquiry elsewhere. The sortition body must be a node in a larger network of communication, not a substitute for it. If the pilot treats the assembly as the only place where real thinking happens, it risks becoming a form of democratic technocracy where the few think and the many bet.

  So here is the bottom line. The branding is not entirely wrong, but it is risky. Your design is Deweyan in its experimentalism and its focus on consequences, but it risks being anti-Deweyan in its potential to passive the citizenry through financialization and algorithmic mediation. If you want to stay true to the spirit of democracy as inquiry, you need to ensure the prediction market does not become the truth machine that overrides deliberation, and that the LLM does not become the gatekeeper of what counts as public sentiment. You should probably stop asking what Dewey would say and start asking whether these tools expand the capacity of people to associate and learn together or whether they outsource that capacity to systems they cannot control. If the pilot helps people feel more connected to the consequences of their city's policies and more capable of discussing them, then it works. If it makes democracy feel like a game played by experts and algorithms while everyone else watches the odds, then you have built a very efficient machine for the wrong purpose. I hope the pilot succeeds, but keep your eye on the communication process itself, not just the policy outputs. That is where the public lives or dies.

  Best,

  A colleague
