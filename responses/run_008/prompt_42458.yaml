answer: |-
  # Specification for a Lifetime Decision Theory

  ## 1. Purpose and Scope
  This specification defines the requirements for a decision theory intended for a single autonomous agent operating over an extended lifetime. The environment is mixed: it contains ordinary empirical risks (coin flips, natural disasters), strategic agents (cooperation and competition), and predictors (entities that correlate their actions with the agent's predicted policy). The theory must maximize the agent's accumulated utility over its trajectory, not merely optimize local choice nodes.

  ## 2. Requirements List

  ### 1. Visible Dominance (Refined: Policy Dominance)
  **Statement:** Where one action yields strictly higher utility than another in every world-state compatible with the agent's current knowledge, the theory must recommend that action—*unless* the knowledge itself is logically correlated with the action in a way that makes the states incompatible with the alternative action.
  **Motivating Case:** A medical test confirms Treatment A cures the disease and Treatment B does not, with no side effects or hidden correlations. A theory recommending B is broken.
  **Classification:** **Non-negotiable (with refinement).**
  **Justification:** An agent that systematically ignores known superior outcomes will be outcompeted by agents that do not. However, the standard definition must be refined to account for logical correlations (see Impossibility Analysis). Naive dominance is a preference; *policy* dominance is required.

  ### 2. Collecting Wins Banked in Advance
  **Statement:** Where a counterparty has already acted based on a prediction of the agent's policy, the agent must act in accordance with the prediction that yielded the favorable outcome, even if current evidence suggests the outcome is already settled.
  **Motivating Case:** **Newcomb's Problem.** The predictor filled the opaque box with $1M based on a forecast made yesterday. Today, the box is either full or empty. The theory must recommend One-Boxing to ensure the predictor (or future predictors) fill the box.
  **Classification:** **Non-negotiable.**
  **Justification:** This is the core constraint of the specified environment. An agent that fails this requirement systematically loses resources to predictors. Over a lifetime, these losses compound, rendering the agent non-viable against competitors who secure these "banked wins."

  ### 3. Parity of Prediction, Duplication, and Policy Choice
  **Statement:** The theory's recommendation must depend only on the logical correlation between the agent's output and the outcome, not on the physical mechanism (simulation, duplication, historical pre-commitment) generating that correlation.
  **Motivating Case:** **Prisoner's Dilemma vs. Duplicate.** Playing against an exact copy of yourself is functionally identical to playing against a perfect simulator of you. A theory that cooperates in one but defects in the other relies on metaphysical distinctions invisible to the agent.
  **Classification:** **Non-negotiable.**
  **Justification:** An agent cannot inspect the source code of the universe to distinguish a "simulation" from a "prediction." Requiring such knowledge makes the theory unimplementable. Functional isomorphism must dictate identical advice.

  ### 4. No Actionable Regret
  **Statement:** At the moment of choice, the agent should never be able to observe that a different action yields higher utility in every situation compatible with its current observation and wish it had taken that action instead.
  **Motivating Case:** **Transparent Newcomb.** The agent sees the opaque box is full. Two-Boxing yields $1,001,000; One-Boxing yields $1,000,000. The agent knows the money is already there. A theory recommending One-Boxing creates immediate, visible regret.
  **Classification:** **Camp Preference (To be sacrificed).**
  **Justification:** This requirement captures the intuition of causal independence. However, satisfying it requires ignoring the logical link between the agent's disposition and the predictor's past action. In a lifetime context, avoiding the *feeling* of regret is less valuable than securing the resources that prevent the *reality* of poverty.

  ### 5. Cross-time Coherence
  **Statement:** The sequence of recommendations issued over the agent's lifetime must be dynamically consistent. The agent at time $T_1$ should not wish to bind the agent at time $T_2$, unless the theory explicitly designates a specific temporal locus of control.
  **Motivating Case:** **The Toxin Puzzle.** An agent is rewarded for intending to drink a toxin, but has no reason to drink it once the reward is secured. A theory that recommends intending but not drinking is incoherent; one that recommends drinking when it harms the agent is self-defeating.
  **Classification:** **Non-negotiable.**
  **Justification:** An agent that fights its future self wastes computational resources and creates vulnerabilities. The theory must define the "agent" as either a time-slice or a world-line and remain consistent with that definition.

  ### 6. Self-applicability
  **Statement:** The reasoning process used by predictors to forecast the agent must be computationally accessible to the agent itself. The agent must be able to simulate its own decision procedure without infinite regress.
  **Motivating Case:** **Reflective Stability.** If a theory requires an oracle to determine the right action, the agent cannot run it. If the agent cannot predict its own output, it cannot satisfy predictors who rely on that predictability.
  **Classification:** **Non-negotiable.**
  **Justification:** A decision theory is software. If the code cannot reference itself, it cannot function in an environment containing self-referential predictors (like other agents running the same theory).

  ### 7. Logical Counterfactual Coherence (Added)
  **Statement:** The theory must provide a method for evaluating outcomes of actions the agent knows it will not take, based on logical rather than causal possibility.
  **Motivating Case:** **Deterministic Environments.** If the agent is deterministic, it *will* take Action A. To evaluate Action B, it must reason: "If the output of my function were B, what would happen?" without asserting a physical impossibility.
  **Classification:** **Non-negotiable.**
  **Justification:** Without this, Requirement 2 (Banked Wins) is incomputable. You cannot optimize a policy if you cannot evaluate the counterfactual consequences of alternative policies in a deterministic universe.

  ---

  ## 3. Impossibility Analysis

  **The Conflict:**
  A subset of these requirements is jointly unsatisfiable in cases of **Transparent Newcomb** (or Parfit's Hitchhiker with visible rescue).
  Consider the specific subset:
  1.  **Visible Dominance** (Naive): Take the action that dominates given current knowledge.
  2.  **Collecting Wins Banked in Advance**: Act to validate the favorable prediction.
  3.  **No Actionable Regret**: Do not take an action that is visibly inferior at the choice node.

  **The Contradiction:**
  In Transparent Newcomb, the agent observes the box is **Full**.
  *   **Knowledge:** The state is "Box Full." The state "Box Empty" is incompatible with observation.
  *   **Dominance/Regret:** In the state "Box Full," Two-Boxing ($1M + $1k) strictly dominates One-Boxing ($1M). To satisfy Dominance and avoid Regret, the agent **must Two-Box**.
  *   **Banked Wins:** To get the box filled in the first place, the predictor must have forecast One-Boxing. If the agent's theory dictates Two-Boxing when seeing a full box, the predictor forecasts Two-Boxing, leaves the box Empty, and the agent gets $1k. To satisfy Banked Wins, the agent **must One-Box**.

  You cannot One-Box and Two-Box simultaneously. You cannot satisfy the local dominance condition (given the observation) and the global policy optimization condition (required for the prediction) at the same time.

  **Resolution:**
  I declare **Requirement 4 (No Actionable Regret)** and the naive version of **Requirement 1 (Visible Dominance)** to be incompatible with **Requirement 2 (Collecting Wins)**.

  **Decision:**
  I **keep Requirement 2 (Collecting Wins)** and **discard Requirement 4**. I **refine Requirement 1** to apply to *policies* rather than *actions conditioned on evidence*.

  **Why:**
  The purpose of this specification is a "theory good enough for a single agent to run over a lifetime."
  *   **Regret** is a subjective state at a specific node. It costs nothing to feel regret; it costs resources to *be* the kind of agent who triggers empty boxes.
  *   **Wins** are objective resources. An agent that satisfies Regret but fails Wins will enter Newcomb-like scenarios repeatedly and accumulate $1,000 while competitors accumulate $1,000,000.
  *   Over a lifetime, resource accumulation trumps local intuitive comfort. The agent must accept that at the moment of choice, it may "see" a dominant action and deliberately ignore it to maintain the integrity of the policy that secured the resources.

  ---

  ## 4. Scorecard of Decision Theory Families

  | Theory Family | Scorecard against Specification |
  | :--- | :--- |
  | **Causal (CDT)** | Fails **Collecting Wins**; satisfies Regret and Dominance, making it unfit for environments with predictors. |
  | **Evidential (EDT)** | Fails **Visible Dominance** (e.g., Smoking Lesion) and **Parity** (treats correlation as causation inconsistently); unstable in Transparent Newcomb. |
  | **Updateless (UDT/TDT)** | Fails **No Actionable Regret**; satisfies Wins, Parity, and Coherence, making it the only viable candidate for the stated purpose. |

  **Most Exclusionary Requirement:**
  **Collecting Wins Banked in Advance.**
  This requirement excludes the vast majority of classical decision theories (CDT, standard EDT, and most hybrid causal-evidential models). While "No Actionable Regret" excludes the Updateless family, the Updateless family is currently the only class of theories capable of satisfying the lifetime viability constraint in the presence of predictors. Therefore, insisting on Banked Wins filters out the established canon, leaving only the emerging updateless frameworks.
