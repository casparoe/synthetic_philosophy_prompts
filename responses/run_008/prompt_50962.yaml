  This sestina stages the subject-summing variant of the combination problem, specifically the difficulty of deriving a unified macro-subject from discrete micro-experiences. The six end-words function as proto-phenomenal qualities—minimal, non-compositional units akin to panpsychist rudiments rather than human emotions. By forbidding new end-words, the form enforces the closure of the micro-level; no matter how the terms permute, no new lexical entity emerges to name the "I" that supposedly experiences them.

