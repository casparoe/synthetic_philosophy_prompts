      *   *Check:* Did I address the neuroscience specifically? *Answer:* Yes, need to make sure I don't overstate its philosophical power. It informs, doesn't settle.
      *   *Check:* Is the user's "Natural Kind vs. Folk" distinction accurate? *Answer:* It's close, but "Folk Concept" implies loose usage. Philosophers on that side are usually precise about *attitudes*. I should refine that terminology for them.

