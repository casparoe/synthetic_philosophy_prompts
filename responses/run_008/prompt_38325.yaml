          *   *Does it solve the philosophical stalemate?* No. Because the philosopher can just say, "Well, *liking* is the real pleasure." But then we are back to: what unifies "liking" a book and "liking" sugar?
      *   *Verdict:* It matters, but not as a silver bullet. It supports the "heterogeneity is real" side, forcing hedonists to be more sophisticated (e.g., attitudinal). It prevents the "simple feeling" move.

  7.  **Drafting the Response (Iterative refinement):**
