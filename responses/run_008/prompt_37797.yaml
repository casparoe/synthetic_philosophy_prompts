answer: |-
  # Setup
  Print six anonymised dossiers (one per member plus spare). Bring a whiteboard marker and a visual representation of the £4,000 pot (a jar with counters or just written large on the board). Arrange chairs in a circle. No phones. Your role is facilitator, not expert. Prepare three large cards labelled "Well-being", "Resources", and "Opportunities" to place on the table during the second half. Ensure the room is private; students will speak candidly about money and hardship.

  # The Dossiers

  **Applicant 1 (The Stoic)**
  "Currently living in a damp basement flat share. Income is below the poverty line after rent. I use the food bank twice a month. However, I want to say I am very grateful for what I have. I don't let it get me down. I keep my head down, study hard, and honestly, I'm quite happy with my lot. I just need a bit of help with heating bills this winter so I can keep studying. I promise I won't complain."

  **Applicant 2 (The Conversion Block)**
  "Full maintenance loan and parental support, so on paper I look secure. However, I have a progressive neuromuscular condition. Most of my income goes on personal care and dietary needs not covered by the Disabled Students' Allowance. I physically cannot get to the library or labs without paying for private transport which eats the rest. I have money, but I can't attend my course. I need funds for a specialized vehicle lease."

  **Applicant 3 (The Specialist)**
  "Final year Media Production. My equipment broke. The standard loan covers living costs, but my course requires industry-standard cameras to pass the module. I could rent cheap gear, but it won't meet the grading criteria. I have a good credit score and could loan money, but I refuse to start my career in debt for essential tools. I need £2,500 for a camera kit. Without it, my degree classification drops."

  **Applicant 4 (The Resigned)**
  "Escaped a volatile home situation two months ago. Currently sofa-surfing. No fixed address makes it hard to receive post or settle. I don't really expect much help, I know funds are low. I've learned not to need much. I just want to finish the term without having to move again. If I could have some help with a deposit for a room, great. If not, I'll manage. I'm used to making do."

  **Applicant 5 (The Anxious)**
  "Have a laptop and a room, so basic needs are met. However, severe social anxiety has made me housebound for three months. I cannot attend seminars or access campus support services. I need funding for a specific private therapy programme not covered by the NHS (waitlist is 18 months). Without this, I will withdraw. The money isn't for 'stuff', it's to make me capable of leaving my house."

  **Applicant 6 (The Emergency)**
  "Flash flood in my room last week. Lost laptop, notes, and winter clothes. No insurance. I am currently unable to write essays or stay warm. I am extremely stressed and sleeping on a friend's floor. I need immediate replacement of essentials to continue the term. I haven't been able to focus on anything since it happened. Please help."

  # Running It

  **00:00 – 00:05: Introduction**
  State the goal: "We are moving from vibes to consistency. Today is about testing our intuition." Hand out dossiers. Do not mention welfare economics yet.

  **00:05 – 00:25: Round 1 (The Vibes)**
  Silent work. Each member allocates the £4,000 across the six applicants (can give £0 to some). They must write down *one sentence* justifying their biggest award.
  *Facilitator note:* Do not circulate. Let them sit with the discomfort.

  **00:25 – 00:45: The Clash**
  Go around the circle. Each member states who got the most money and why. Write the names on the whiteboard. You will see scatter.
  *Facilitator note:* When conflicts arise (e.g., "I gave Stoic nothing because they said they were fine" vs "I gave Stoic most because they are poorest"), do not resolve them. Just highlight the disagreement. "So we have two people looking at the same page and seeing different priorities."

  **00:45 – 00:50: The Rules**
  Divide the committee into three pairs. Give each pair one of the prepared cards:
  1.  **Pair A (Well-being):** "Allocate to minimise distress and maximise happiness."
  2.  **Pair B (Resources):** "Allocate to equalise financial assets and material goods."
  3.  **Pair C (Opportunities):** "Allocate to maximise what each student is actually able to *do* or *be*."

  **00:50 – 01:10: Round 2 (The Constraints)**
  Pairs re-allocate the full £4,000 based *only* on their rule. They must ignore their personal feelings.
  *Facilitator note:* Circulate and enforce the rule. If Pair A worries about poverty, ask: "Does poverty necessarily mean low well-being here?" If Pair B worries about illness, ask: "Do they have less money than the others?"

  **01:10 – 01:30: Debrief**
  Bring everyone back. Compare the three allocations. They will likely be radically different.
  *Facilitator note:* This is where you map the terrain (see below).

  # Debrief

  Do not lecture. Use their votes to draw the theory out of them.

  1.  **Surface Welfare:** Ask Pair A: "Who did you favor?" (Likely Emergency or Anxious). "Did you give money to The Stoic?" (Likely no, because they claimed happiness). *Point:* "You were measuring subjective states. If someone says they are fine, you took them at their word."
  2.  **Surface Resources:** Ask Pair B: "Who topped your list?" (Likely Stoic or Resigned). "What about The Specialist?" (Likely low, because they have credit/options). *Point:* "You measured means. You ignored whether the money would actually fix the problem, only that they lacked the stuff."
  3.  **Surface Capabilities:** Ask Pair C: "Who got the vehicle money?" (Likely The Conversion Block). "Why not The Stoic?" (Because money doesn't fix the damp). *Point:* "You measured freedom to function. You looked at conversion factors—why money doesn't turn into 'studenting' for everyone equally."
  4.  **The Hard Bits:** Point to The Stoic and The Resigned. "Pair A ignored them (high reported welfare). Pair B funded them (low resources). Who was right?" Introduce **Adaptive Preferences**: "What if they say they're fine because hoping for more hurts too much?"
  5.  **The Reveal:** Only now, if needed, mention that these categories have names (Utilitarianism, Resourcism, Capabilities Approach). Emphasize that the fund needs a hybrid policy, not just vibes.

  # What Will Go Wrong

  1.  **Moralizing:** Members will slip into "deservingness" (e.g., "The Specialist shouldn't have bought a camera they can't afford"). This overrides all three metrics. You must interrupt: "Not whether they *should* have it, but whether giving it matches your rule."
  2.  **The "Easy" Case:** Applicant 6 (Emergency) will soak up too much budget in Round 1, leaving no money to test the hard trade-offs. In Round 2, enforce the rule strictly—even if Emergency suffers under a "Resources" rule because they had a laptop yesterday.
  3.  **Rule Drift:** Pair C (Opportunities) will drift into Welfare ("They can't be happy if they can't study"). Keep asking: "Is this about happiness or ability?"
  4.  **Dominant Voices:** In the pairs, one student may dominate the interpretation of the rule. Swap roles halfway if you see this.

  # What This Can't Do

  1.  **The Weight of Reality:** These are paper people. No one feels the guilt of denying rent money to a real human being. The "vibes" you are trying to fix exist because real hardship triggers empathy, not logic. This session creates logic, but it cannot simulate the emotional toll of withholding aid.
  2.  **True Adaptive Preferences:** A dossier cannot fully capture the tragedy of The Stoic or The Resigned. In real life, you might sense the disconnect between their words and their situation. On paper, "I'm happy" looks like fact. Students may fail to see the harm in ignoring them, missing the core philosophical point that oppressed people often lower their expectations to survive.
  3.  **Verification:** In reality, you would check bank statements. Here, you must take claims as truth. This removes the "fraud" anxiety that often drives committee decisions, making the exercise cleaner but less realistic.
  4.  **Policy vs. Person:** This trains individual judgment. It does not solve the structural issue that £4,000 is too little for the need. It might leave the committee feeling more rigorous, but also more helpless about the total pot size.
