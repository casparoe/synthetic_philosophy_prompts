  2.  **Deconstruct the Philosophical Landscape (Moral Testimony):**
      *   *Optimism:* Moral testimony is just like any other testimony. If the source is reliable, you gain knowledge/justification. (e.g., McGrath, Jones)
      *   *Pessimism:* Moral testimony cannot transmit moral knowledge/justification. You need to grasp the reasons yourself. (e.g., Hopkins, Hills)
      *   *Moderate/Pragmatic:* You can *know* via testimony, but acting on it without understanding is morally deficient (autonomy, virtue). (e.g., Hills' "Understanding" view often lands here).
      *   *Distinctions:*
          *   Belief (Epistemic) vs. Action (Practical).
          *   Knowledge vs. Understanding.
          *   Expertise (Fact) vs. Expertise (Value).

