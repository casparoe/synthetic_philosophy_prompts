answer: |-
  This is a fantastic way to metabolize a frustrating personal conflict into pedagogical gold. The fight you had with your roommate is essentially the debate between **Moral Testimony Optimism** (e.g., Sarah McGrath, Elizabeth Fricker) and **Moral Testimony Pessimism** (e.g., Paul Hopkins, Alison Hills), with a side of **Pragmatic Moderation**.

  Below is the 8-question quiz designed for your students, followed by a scoring key built on the philosophical distinctions you requested, rather than just a list of names. I have also included an "Instructor's Map" to help you navigate the limitations and empty cells in the logical space.

  ***

  # Part 1: The "Who Do You Trust?" Quiz
  **Instructions:** Read each scenario and pick the answer that feels most natural to you. Don't overthink it; go with your gut reaction.

  **1. The Roommate (Close Relationship)**
  You're about to send a text to a new coworker. Your roommate stops you and says, "Don't send that. It's creepy." You ask why, and they say, "I can't explain it, just trust me."
  *   **A.** If I trust them, I should believe it's creepy and not send it.
  *   **B.** I might believe them, but I shouldn't act until I understand *why* it's creepy.
  *   **C.** Their word isn't enough. I need to figure out for myself if it's actually creepy.

  **2. The Historian (Distant Atrocity)**
  You read a history book stating that a specific ritual performed 500 years ago was morally abhorrent. You have no way to investigate the primary sources yourself.
  *   **A.** If the historians are reliable, I know it was wrong.
  *   **B.** I can accept it was wrong, but I don't truly *grasp* the wrongness without reading the accounts.
  *   **C.** I can't really know it was wrong unless I see the evidence and feel the wrongness myself.

  **3. The Doctor (The Analogy)**
  Your doctor says, "Eating this specific berry is bad for your health." You trust their expertise. Is morality the same? If a moral expert says "Action X is bad," is that the same kind of claim?
  *   **A.** Yes. Moral expertise works just like medical expertise.
  *   **B.** Sort of. They can tell me the facts, but the "badness" is up to me.
  *   **C.** No. Health is about facts; morality is about values I must determine myself.

  **4. The Climate Scientist (Fact vs. Value)**
  A climate scientist tells you, "Carbon emissions will cause X amount of suffering to future generations."
  *   **A.** I trust them on the suffering *and* their conclusion that we have a duty to stop it.
  *   **B.** I trust them on the suffering, but I have to decide for myself if that creates a duty.
  *   **C.** I need to verify the data myself before I accept any moral duty.

  **5. The Emergency (Action Under Pressure)**
  You are in a high-stress situation. A friend you respect yells, "Do not open that door, it's the wrong thing to do!" You have no time to ask why.
  *   **A.** I listen. Their judgment is enough to guide my action.
  *   **B.** I listen to avoid disaster, but I don't feel good about acting blindly.
  *   **C.** I hesitate. Acting without knowing the reason feels wrong, even in an emergency.

  **6. The Moral Mentor (Character)**
  You admire a person who is incredibly kind and wise. They donate to a charity you know nothing about.
  *   **A.** I donate too. Copying them is a good way to be good.
  *   **B.** I donate, but I know I'm not as virtuous as they are because I'm just copying.
  *   **C.** I don't donate. Copying them doesn't make me virtuous, it just makes me a follower.

  **7. The Explanation (Epistemic Need)**
  Why do you want reasons for a moral claim?
  *   **A.** To make sure the person isn't lying or mistaken.
  *   **B.** To help me learn, but I can still believe them without reasons.
  *   **C.** Because without reasons, I don't actually *know* the claim is true.

  **8. The Freeloader (Moral Worth)**
  Someone does the right thing *only* because their partner told them to, with no understanding of why.
  *   **A.** They did the right thing. That's what matters.
  *   **B.** They did the right thing, but they don't get full credit for it.
  *   **C.** They didn't really do a moral action at all; they just obeyed.

  ***

  # Part 2: The Scoring Key (5 Minutes)

  **Step 1: Tally your answers.**
  Count how many **A**s, **B**s, and **C**s you selected.

  **Step 2: Locate your profile.**
  Find the description below that matches your dominant letter.

  ### **Mostly A's: The Optimist**
  *   **Your View:** Moral testimony is just like any other testimony.
  *   **The Distinction:** You see no sharp divide between **Fact** and **Value**, or between **Belief** and **Action**. If a source is reliable, they can transmit moral knowledge, and acting on that knowledge is perfectly fine.
  *   **The Roommate Verdict:** You were in the wrong. If you trust her judgment, you should accept her claim even without an explanation.

  ### **Mostly C's: The Pessimist**
  *   **Your View:** Moral knowledge requires first-hand grasp of the reasons.
  *   **The Distinction:** You believe the defect in relying on testimony is **Epistemic**. You literally *cannot know* a moral truth via testimony. Therefore, acting on it is also defective because you are acting on a belief you aren't entitled to hold.
  *   **The Roommate Verdict:** You were in the right. Her say-so cannot give you knowledge that your action was wrong.

  ### **Mostly B's: The Moderate / Understanding View**
  *   **Your View:** You can *believe* via testimony, but you shouldn't *act* (or claim virtue) without understanding.
  *   **The Distinction:** You separate **Knowledge** from **Understanding** (or **Belief** from **Moral Worth**). You might grant that testimony gives you evidence (or even knowledge), but relying on it makes your action less praiseworthy or autonomous.
  *   **The Roommate Verdict:** It's a draw. You can believe her, but you are justified in wanting to understand *why* before you change your behavior.

  ### **Mixed (Specifically A on Q4, B/C elsewhere): The Splitter**
  *   **Your View:** You trust testimony on **Factual Premises** (science, history) but not on **Moral Conclusions**.
  *   **The Distinction:** You carve the world into **Descriptive** (trust experts) and **Normative** (trust yourself).
  *   **The Roommate Verdict:** You were in the right. She is offering a moral verdict, not a factual report, so her expertise doesn't apply the same way.

  ***

  # Part 3: Instructor's Map (For Your Prep)

  Here is the logical space underlying the quiz, built from the distinctions you asked for. You can use this to lead the post-quiz discussion.

  ### 1. The Decision Tree
  To locate the positions philosophically, ask these three questions in order:

  1.  **Can testimony transmit Moral Knowledge?**
      *   **No:** You are a **Pessimist** (e.g., Hopkins).
      *   **Yes:** Go to Question 2.
  2.  **Is acting on that testimony defective?**
      *   **No:** You are an **Optimist** (e.g., McGrath).
      *   **Yes:** Go to Question 3.
  3.  **What kind of defect is it?**
      *   **Epistemic (Lack of Understanding):** You are an **Understanding Theorist** (e.g., Hills). You know it's wrong, but you don't *understand* why, so you lack moral worth.
      *   **Practical/Moral (Autonomy):** You are a **Pragmatic Moderate**. It's not that you lack understanding, but that relying on others violates a duty of moral independence.

  ### 2. Empty Cells & Incoherent Positions
  There are two logical combinations that usually have no philosophical "occupants." You can tell your students why:

  *   **"No Knowledge, but Action is Fine."**
      *   *Why it's empty:* If testimony cannot give you knowledge/justification, then acting on it is acting on an unjustified belief. In ethics, acting on an unjustified belief is usually recklessness, not a "fine" action.
  *   **"Yes Knowledge, Epistemic Defect, but Action is Fine."**
      *   *Why it's empty:* If the defect is epistemic (you don't understand the reasons), but the action is fully praiseworthy, then "understanding" doesn't actually matter for moral worth. This collapses back into **Optimism**.

  ### 3. Limitations of This Quiz
  Be honest with your students (and yourself) about what this quiz *cannot* do in 50 minutes:

  *   **The "Moderate" vs. "Understanding" Distinction:** The quiz groups these together (mostly B's). Philosophically, Alison Hills (Understanding) argues you gain *knowledge* but lack *understanding*, whereas some Moderates argue you gain *justification* but lack *autonomy*. The quiz scenarios aren't subtle enough to separate "I lack understanding" from "I lack autonomy."
  *   **The "Expertise" Definition:** Question 3 (The Doctor) assumes students agree on what medical expertise is. Some students might be medical skeptics, which skews the analogy.
  *   **Belief vs. Action:** While Q1 and Q5 try to separate these, in the heat of a quiz, students often conflate "I believe it's wrong" with "I will stop doing it." The distinction is clearer in lecture than in a multiple-choice format.

  ### 4. How to Use the Roommate Fight
  Since this is the hook for the class:
  *   **If you were an Optimist:** Admit to the class that philosophy suggests you owed your roommate more deference.
  *   **If you were a Pessimist:** Tell them philosophy backs your demand for reasons.
  *   **The Teaching Moment:** Point out that your fight was actually about **Question 2** in the tree. You were arguing about *Belief* ("Why should I take your word?"), while she was arguing about *Conduct* ("Can't you just trust me?"). The **Moderate/Understanding** view is the only one that validates both of you: You were right to ask for reasons (to gain understanding), but she was right that you could have trusted her judgment (to gain knowledge).
