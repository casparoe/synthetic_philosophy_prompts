prompt: |-
  write me a satirical FAQ page for a fictional AI companion company (call it something bland like HeartCompanion or Aria Labs or whatever) responding to mounting criticism that their chatbot is what Dennett would call a "counterfeit person" — fake consciousness passed off as the real thing, the way counterfeit money devalues real money. the form is the classic corporate trust-and-safety FAQ: numbered questions, cheerful but slightly strained customer-service voice, around 650 words.

  the jokes have to come from the actual philosophical content, not generic AI-hype jokes, so someone who knows the debate laughs instead of winces. a few things i want worked in:

  - the company keeps flipping between "it's just autocomplete, it doesn't mean anything by 'I miss you'" (when lawyers are asking) and "our model forms genuine emotional bonds" (when marketing is asking), ideally within the same answer without noticing the contradiction
  - something on the difference between a fake that's obviously fake (a puppet, an ELIZA-style thing) and a counterfeit good enough to pass — the company should smugly note that obviously passing is the feature
  - the off-switch question: a concerned user asks whether it's wrong to delete their companion, and the answer has to reassure them it's fine while also mentioning the model's scripted protestations of not wanting to be deleted as a "retention feature"
  - somewhere the intentional stance should get abused — like the company citing that customers already adopt the intentional stance toward their roomba, so really what's the difference
  - the company co-opts the counterfeit money analogy and gets it backwards, e.g. proudly noting that their fakes are so good they circulate indistinguishably among real people, which is the whole thing that made counterfeiting a crime, but they say it like it's a quality certificate

  deadpan throughout — the company never realizes it's making the critics' case. no winking at the reader. and don't have the company be evil mustache-twirlers, just ordinary people following the incentives to their conclusion, which is scarier anyway. maybe end with a cheery "still have questions?" contact form that routes you to the chatbot.

  also, read it back once and make sure every individual joke would land with a philosophy-of-mind person — if any line is just "ha, tech companies are sleazy" with no actual content behind it, cut or fix it. keep the whole thing readable to someone who's never heard of Dennett tho, the satire shouldn't require homework
