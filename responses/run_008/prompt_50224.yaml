answer: |-
  1. Can we trace the harmful outcome directly to a specific individual's violation of established safety protocols or design specifications? If yes, close the incident with that person's name; if no, proceed to the next question.

  2. Did the harm emerge from the interaction of multiple subsystems where each met its individual spec but the combination was never validated? If yes, assign responsibility to the integration lead who signed off on the combined system; if no, proceed to the next question.

  3. Did the system's behavior diverge from its last validated state due to an automated update or retraining cycle that occurred without explicit human sign-off on the specific behavioral change? If yes, assign responsibility to the person who authorized the automated deployment pipeline; if no, proceed to the next question.

  4. Does this incident represent a genuine responsibility gap where the harm was unforeseeable and no rule applies? If yes, record an explicit no-name finding stating that the procedure has run out and we are making a values call rather than applying a rule; if no, proceed to the next question.

  5. Given that the risk was known to be non-zero but accepted to meet business goals, did I personally sign off on the deployment conditions that allowed this specific edge case to exist? If yes, assign responsibility to me; if no, assign it to the senior executive who holds the authority I lack.
