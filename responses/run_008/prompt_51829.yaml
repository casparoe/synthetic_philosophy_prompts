answer: |-
  The stance your friend is describing is a recognized position in decision theory, most prominently associated with the philosopher and economist **Edward F. McClennen**. The specific term for it is **Resolute Choice**.

  It is distinct from the standard responses to money pumps, and your intuition that it occupies a narrow, specific niche is correct. Below is a breakdown of the concept, how it fits into the literature, and why decision theorists remain divided on whether it actually "solves" the problem of circular preferences.

  ### 1. The Name and Definition: Resolute Choice

  In the literature on **dynamic choice**, there are generally three ways an agent can approach a sequence of decisions:

  1.  **Myopic Choice:** The agent maximizes utility at each individual node based on current preferences. This is the victim of the money pump. They take the trade $A \to B$, then $B \to C$, then $C \to A$, losing money at every step because they never look ahead or look back.
  2.  **Sophisticated Choice:** The agent uses backward induction. They anticipate that their future self will be myopic and exploit themselves. To avoid this, they restrict their own future choices (often via external precommitment) or avoid entering the sequence entirely.
  3.  **Resolute Choice:** The agent formulates a plan at the outset ($t_1$) that maximizes overall utility and **adheres to it** at later nodes ($t_2, t_3$), even if their local preferences at those later nodes would dictate a different choice.

  Your friend is describing **Resolute Choice**. He is not changing his preferences (he still wants the trade at $t_3$), nor is he using external binding (he could physically make the trade). He is treating his past decision as a normative constraint on his present action. McClennen argues in *Rationality and Dynamic Choice* (1990) that rationality should apply to **plans**, not just isolated choices. If a plan is optimal ex-ante, it is rational to follow it ex-post, even if local incentives tempt deviation.

  ### 2. Does It Escape the Money Pump?

  **Pragmatically: Yes.**
  If your friend successfully executes resolute choice, the trader cannot pump him. The pump requires three "yes" answers. A resolute chooser provides two "yes" answers and one "no" (based on the prior plan). The cycle is broken, and the money stays in his pocket.

  **Theoretically: It is controversial.**
  Most mainstream decision theorists (e.g., Isaac Levi, Robert Sugden, Wlodek Rabinowicz) argue that resolute choice does not actually vindicate circular preferences; it merely sidesteps the *consequences* of them while violating other axioms of rationality.

  The core objection relies on a principle called **Separability** (or **Dynamic Consistency**). This principle states that your choice at a specific moment should depend only on the options available *from that moment forward*, not on how you got there or what you planned earlier.
  *   **The Critique:** If at $t_3$ you genuinely prefer $A$ (minus small cost) to $C$, choosing $C$ is irrational by definition. To say "I choose what I know is locally worse because I planned it earlier" violates the idea that choices reveal preferences.
  *   **The Counter:** McClennen argues Separability is too restrictive. It forces agents to be slaves to their future myopia. Resolute choice allows an agent to be "rational over time" even if they are "irrational at a moment."

  ### 3. The Edge: When Does It Become a "Preference for Consistency"?

  You asked where the edge lies: *At what point does this become indistinguishable from just having a standing preference for sticking to your own plans?*

  This is the critical vulnerability of the resolute choice defense, often highlighted by **John Broome** and **Robert Sugden**.

  If your friend refuses the trade *solely* because "I decided earlier," he is effectively introducing a new parameter into his utility function: **Plan Adherence**.
  *   **Scenario 1 (Pure Resoluteness):** Preferences are $A \succ C$, but he chooses $C$ because of the plan. This implies his *choice* does not match his *preference*. In revealed preference theory, this is incoherent.
  *   **Scenario 2 (Preference for Consistency):** His preferences are actually "Outcome $C$ + Consistency" $\succ$ "Outcome $A$ - Cost - Inconsistency".

  If Scenario 2 is true, **his preferences are no longer circular.**
  The money pump works on the assumption that you prefer $B$ to $A$, $C$ to $B$, and $A$ to $C$, *ceteris paribus*. But if "sticking to the plan" is a *ceteris paribus* condition that changes the value of the outcomes, the cycle breaks:
  1.  $B + \text{Plan} \succ A$
  2.  $C + \text{Plan} \succ B$
  3.  $A \succ C + \text{Broken Plan}$

  In this case, the friend hasn't found a loophole for circular preferences; he has **transitivized** them by adding a consistency constraint. Decision theorists generally accept this as a valid way to avoid the pump, but it concedes the main point: the underlying preferences over *outcomes alone* were indeed irrational, and they had to be modified (by adding a preference for consistency) to become rational.

  ### 4. Vulnerabilities: Can the Trader Beat Resolute Choice?

  Even if we grant your friend the right to be resolute, a clever trader can disrupt the strategy. Resolute choice relies on the agent identifying a specific "plan" at $t_1$.

  1.  **Randomization:** If the trader randomizes the order of offers (sometimes $A \to B$, sometimes $B \to C$, sometimes $C \to A$), the agent cannot form a specific resolute plan at $t_1$ because they don't know which node they will be at. They would need a "universal plan" (e.g., "never trade"), which might be suboptimal if some trades are genuinely beneficial.
  2.  **Temporal Spacing:** As you noted, if the trades are spaced out over months, the psychological force of the "past decision" weakens. The "authority" of the past self is not a physical law; it is a psychological norm. If the agent's sense of identity fractures over time (a la Derek Parfit), the $t_3$ self may not feel bound by the $t_1$ self.
  3.  **The "Why $t_1$?" Problem:** If preferences are stable and circular, why is the decision at $t_1$ authoritative over $t_3$? Why not be resolute about the $t_3$ preference and override the $t_1$ plan? Without a meta-preference for consistency (see above), the choice of *which* self to obey is arbitrary.

  ### 5. Summary of the Literature Status

  *   **Is it a named concept?** Yes, **Resolute Choice** (McClennen).
  *   **Is it a genuine escape?** It is a **pragmatic** escape but a **theoretical** patch. It prevents the loss of money but requires abandoning the **Separability** axiom of standard decision theory.
  *   **Does it save circular preferences?** Most theorists say **no**. It either:
      1.  Admits that acting against current preference is irrational (rejecting resoluteness).
      2.  Implies that "consistency" is itself a preference, which renders the underlying preferences transitive (dissolving the circularity).
  *   **The Restaurant Analogy:** This is often discussed under **Self-Control** or **Willpower**. In economics, this is sometimes modeled as a **dual-self model** (a "planner" self vs. a "doer" self). Your friend is allowing the "planner" to veto the "doer."

  ### Conclusion

  Your friend has independently rediscovered **Resolute Choice**. It is a coherent stance, but it comes with a cost: it requires rejecting the standard decision-theoretic view that rationality is solely about maximizing utility at the moment of choice.

  If he admits that he *genuinely prefers* to make the trade at the end but refuses anyway, he is claiming that **rationality is about following plans, not satisfying preferences.** If he admits that he refuses because "sticking to my word" adds value to the outcome, he is claiming that **his preferences were never circular to begin with.**

  The money pump literature generally treats resolute choice as an interesting dissenting opinion (championed by McClennen and arguably Amartya Sen in his work on commitment), but not as a definitive refutation of the requirement for transitive preferences. The consensus remains: if you need a gun to your own head (or a normative gun from your past self) to stop yourself from making a trade you currently want, your preferences are likely incoherent.

  **Recommendation for further reading:**
  *   Edward F. McClennen, *Rationality and Dynamic Choice* (1990).
  *   Robert Sugden, "Money Pump with Regret" (in *The Economics of Rights, Co-operation and Welfare*).
  *   Michael Bratman, "Planning and Temptation" (for the philosophical underpinnings of plan-based rationality).
