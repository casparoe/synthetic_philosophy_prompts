          5.  Counter-example: "Proof-based Cooperators" (like FairBot/PrudentBot in modal logic) *do* cooperate under transparency.
          6.  Observation: Some agents get better payoffs under transparency.
          7.  Conclusion: Steps (1)-(4) prove too much; one is false.
