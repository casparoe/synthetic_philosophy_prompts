      *   Answer: This is a common objection to UDT. However, we don't need to go all the way to (8). We can reject (3) while keeping a modified version of (1). We can say actions are rational, but we must evaluate them based on their *logical* consequences, not just causal ones. This preserves deliberation (deliberation is the process of computing the best output).

