      *   *Goal:* Present the spectrum argument using the headphone case to conclude intransitivity.
      *   *Logic:*
          1.  For any $n$, Model $n+1$ is better than Model $n$ (Battery gain > undetectable noise loss).
          2.  If "better than" is transitive, then Model 1000 is better than Model 0 (by chaining 1,000 steps).
          3.  But intuitively, Model 0 is better than Model 1000 (Noise cancellation matters more than 17 hours battery when the noise is unbearable).
          4.  Therefore, "better than" is not transitive.
      *   *Drafting:* Start with the setup. Establish the local betterness. Establish the global worse ness. Conclude intransitivity.
      *   *Word Count Check:* Need to be careful not to go too short or too long. Aim for dense but clear prose.

  3.  **Drafting Section 2: The key objection and a reply (~150 words)**
      *   *Goal:* Address the "cheating" concern regarding undetectable differences.
      *   *Objection:* Maybe undetectable differences *do* matter axiologically, even if epistemically hidden. If $n+1$ is actually worse than $n$ (due to noise), the chain breaks.
      *   *Reply:* The argument relies on the premise that a trade-off between a detectable gain (battery) and an undetectable loss (noise) favors the gain. If the loss is truly negligible to the user, it shouldn't outweigh a real benefit. The "cheat" is only if we conflate epistemic access with ontological value, but the spectrum argument challenges whether value aggregates linearly.
      *   *Refinement:* Focus on the "small improvement argument" or "continuum argument." The objection is that there must be a tipping point. The reply is that positing a sharp tipping point for a continuous spectrum is arbitrary (Sorites-like).
      *   *Word Count Check:* Keep it tight.

