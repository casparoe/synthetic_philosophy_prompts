answer: |-
  # Q&A Prep Sheet: Defending Dialetheism

  **Audience Profile:** Majority Classical (explosion-intuition strong), Minority Relevant (LP-fluent), One Hostile Semanticist (meaning-variance worry).
  **Strategy:** Do not get bogged down in formal semantics unless pressed. Keep the focus on *truth* and *rationality*.

  ---

  ### 1. The Expressive Inadequacy / Meaning Variance Objection
  **Who:** The Semanticist (and Classical logicians leaning on her).
  **The Objection:** "In LP, the truth predicate ranges over {1, i, 0}. But to assert a sentence is to assert it is *true and not false*. If your logic lacks a connective for exclusion negation (a negation that maps 1 to 0 and i to 1), you cannot express the proposition that a sentence is *merely* true. Therefore, when you assert the Liar is true, you aren't asserting what we mean by 'true'. You've changed the subject to 'designated value'. You haven't solved the paradox; you've changed the language."

  **Your Reply (2 mins):**
  "This is the charge of meaning variance, and it's the most serious dialectical challenge. But it conflates the *semantics* with the *speech act*. Yes, in LP, simple negation doesn't exclude truth. But dialetheism isn't committed to the claim that negation *means* exclusion. It's committed to the claim that truth doesn't *require* exclusion.
  When I assert $A$, I am indeed committing to $A$ being true and not false *in the classical sense*, but I deny that 'not false' is a precondition for truth. I can express exclusion pragmatically. I can *reject* $A$. Dialetheism distinguishes *assertion* from *acceptance*. I accept the Liar (it's true), but I do not assert it in contexts where I wish to exclude falsity.
  More importantly, if 'true' just meant 'designated value', the Liar wouldn't be paradoxical; it would be a stipulation. The paradox arises precisely because we are using the ordinary truth predicate. The semantic closure of natural language *forces* the inconsistency. If you say I can't express 'only true', I reply: I can express it by asserting $A$ and rejecting $\neg A$. The logic models the truth conditions; the pragmatics handles the exclusion. You're assuming exclusivity is built into the truth predicate rather than the normative stance of the agent."

  **Weakest Point:** You are relying on a pragmatic distinction (assertion vs. acceptance) to do heavy metaphysical lifting. If the Semanticist presses that your "rejection" operator is just classical negation in disguise, you risk admitting you need a classical metalanguage to make sense of your object language.

  ---

  ### 2. The Normativity of Logic / Rejection Objection
  **Who:** Classical Logicians.
  **The Objection:** "Logic is supposed to guide reasoning. If contradictions can be true, the rule of Disjunctive Syllogism (DS) fails. If I know $A \lor B$ and $\neg A$, I can no longer infer $B$, because $A$ might be both true and false. This paralyzes inquiry. How can you advise a scientist to reject a falsified theory if the falsification ($\neg A$) might be true alongside the theory ($A$)? You've saved truth at the cost of rational action."

  **Your Reply (2 mins):**
  "This assumes that the only function of logic is truth-preservation in a classical sense. But logic should preserve *truth* even if truth is inconsistent. DS fails only in cases where $A$ is a dialetheia. But dialetheias are rare—paradoxes, semantic boundaries, legal contradictions. In consistent domains (physics, everyday arithmetic), DS holds robustly.
  Regarding rational action: Dialetheism doesn't say 'believe everything'. It says 'believe what is true'. If a theory is falsified, we have overwhelming evidence for $\neg A$. Even if $A$ is possibly true (in a dialetheic sense), the weight of evidence for $\neg A$ warrants *rejection*. We can have a normative logic of *rational acceptance* that is stricter than the semantics of *truth*.
  I can advise the scientist: 'Reject $A$ because the evidence for $\neg A$ is decisive, even if $A$ turns out to be true in some pathological sense.' Logic describes the world; rationality describes our grip on it. Giving up DS is a small price to pay for not having to pretend the Liar sentence doesn't exist."

  **Weakest Point:** You are conceding that dialetheic logic is not sufficient for rationality on its own; you need a supplementary "rationality logic" that behaves classically for most practical purposes. This risks making dialetheism a purely metaphysical curiosity with no logical utility.

  ---

  ### 3. The "Super-Revenge" / Exclusion Negation Objection
  **Who:** Relevant Logicians (and sharp Classicals).
  **The Objection:** "You've solved the Liar, but now consider the sentence: 'This sentence is false or untrue.' In LP, 'untrue' is just $\neg T$. But you need a predicate that means 'not true' in the sense of 'not designated'. If you add a determinacy operator or an exclusion negation to handle this, you generate a new hierarchy of Liars that your logic cannot absorb without triviality. You haven't closed the semantic gap; you've just moved it."

  **Your Reply (2 mins):**
  "This is the Revenge problem, and I take it seriously. But the dialetheist response is to bite the bullet. If we can formulate a Revenge sentence, say $R$, that says of itself 'I am not true', and our semantics validates it, then $R$ is simply another dialetheia.
  The classical logician assumes that for every semantic concept, there must be a consistent predicate. I deny that. The semantic concepts of our language are inconsistent. If 'untrue' leads to paradox, then 'untrue' is an inconsistent predicate. We don't need to patch the language to make it consistent; we need to acknowledge that natural language semantics is inherently inconsistent.
  If the Revenge sentence is both true and false, it doesn't break the system; it just expands the set of dialetheias. The goal isn't to restore consistency; it's to prevent *triviality*. LP prevents triviality even with Revenge sentences, provided we don't assume the metalanguage is classical. If the metalanguage is also paraconsistent, the hierarchy collapses into a single, inconsistent, but non-trivial semantics."

  **Weakest Point:** This requires you to defend a paraconsistent *metalanguage*. If you concede the metalanguage must be classical to make your argument intelligible to the audience, you've admitted your object language is expressively inferior, which loops back to Objection #1.

  ---

  ### 4. The Explosion / Triviality Objection
  **Who:** Classical Logicians (Standard).
  **The Objection:** "If you accept $A \land \neg A$, and you keep standard rules like Disjunction Introduction and Disjunctive Syllogism, you get Explosion ($A \land \neg A \vdash B$). Everything becomes true. Your view is trivial. To avoid this, you have to mutilate logic so badly it's unrecognizable."

  **Your Reply (2 mins):**
  "This is the standard worry, but it begs the question. Explosion is valid *if* you assume truth is consistent. I am denying that assumption. I am not 'mutilating' logic; I am adjusting the consequence relation to match the data.
  In LP, Disjunction Introduction holds. Disjunctive Syllogism fails. This isn't arbitrary; it's because DS is not truth-preserving in cases where the premise is a dialetheia. We keep the rules that preserve truth; we drop the ones that don't.
  Triviality only follows if you insist on keeping classical rules *and* accepting contradictions. I'm doing the former. The resulting logic is recognizably logic: it has a consequence relation, it handles inference, it models validity. It just doesn't validate the move from 'contradiction' to 'anything'. Given that the Liar *is* a contradiction, and *isn't* 'anything', LP is actually more faithful to the phenomena than classical logic, which has to pretend the Liar is meaningless to save Explosion."

  **Weakest Point:** Classical logicians view DS as constitutive of "or" and "not". Denying DS feels like changing the meaning of the connectives (looping back to Objection #1). You need to hold firm that meaning is use, and the use of "or" doesn't require DS in pathological cases.

  ---

  ### Strategic Advice: The Revenge Question

  **You asked:** *"I'm fairly sure the question I'm hoping nobody asks is some version of the revenge paradox, but maybe you disagree."*

  **My Verdict:** **I disagree.** The Revenge Paradox is the *technical* hole, but it is not the *dialectical* killer in this room.
  1.  **The Real Killer:** The **Meaning Variance (Objection #1)** objection is more damaging *here*. If the Semanticist convinces the room that your "true" is just "designated value," you are no longer doing philosophy of truth; you're doing algebra. The Classical logicians will side with her because it allows them to dismiss your view as "not really about truth."
  2.  **Should you raise Revenge?** **Yes, but carefully.**
      *   **Why:** If you wait for a Relevant logician to ask it, they will frame it as a formal failure. If *you* raise it, you can frame it as a *feature* (semantic closure).
      *   **How:** Do not present it as a problem you are still solving. Present it as a "bullet you have bitten." Say something like: *"Now, one might worry about Revenge sentences. The classical view patches the predicate to avoid them. My view accepts them as further dialetheias. This preserves semantic closure."*
      *   **Risk:** Do not open this can of worms unless you are prepared to defend a paraconsistent metalanguage. If you say "The metalanguage is classical," you lose to Objection #1. If you say "The metalanguage is paraconsistent," the Classical logicians will claim you can't communicate that to them.
      *   **Recommendation:** Mention Revenge briefly in the talk to show you aren't hiding from it, but pivot quickly to the **Normativity** objection (Objection #2). The Classical majority cares more about whether they can *use* your logic than whether your model is technically complete. Convince them the logic is usable, and they will forgive the technical gaps. Convince them the logic is unusable, and the technical details don't matter.
