      *(Refining the "Reflective Agent" part)*: I need to be careful. If (a) says "History matters," does that tell the agent to value originals? Yes. If (b) says "It's status," does that tell the agent to stop valuing them? Only if they don't care about status. I need to make this distinction sharp.

