      *   *Ontology:* What *is* the artwork? Is it the physical canvas or the abstract structure instantiated by the canvas? (Wollheim, Danto, Dickie).
      *   *Value Theory:* Is aesthetic value intrinsic or extrinsic? Is it instrumental (signaling) or final (good in itself)?
      *   *Epistemology:* How do we know what we are valuing? Does knowledge of provenance change the *perception* or just the *valuation*?
      *   *Decision Theory:* If I know the copy is perfect, should I act as if it has the same value? What if everyone else doesn't? (Schelling point).
