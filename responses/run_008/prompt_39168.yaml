      *   **Conditions for Re-ordering:** If empirical psychology shows perception *doesn't* change, (c) drops. If market data shows no status premium, (b) drops.
      *   **Reflective Agent Impact:** Which questions tell you *what to do*? (b) tells you to opt out of status games. (a) tells you what to care about fundamentally. (c) validates your feelings.

  6.  **Refining the Philosophical Nuance:**
