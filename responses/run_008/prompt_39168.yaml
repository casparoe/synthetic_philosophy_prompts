      *   *Attempt 3 (Structural/Foundational):*
          1.  **Supervenience (a):** This is the metaphysical bedrock. If value supervenes *only* on intrinsic properties, the rationalist view wins. If it supervenes on history, the contextualist view wins. This dictates the rules of the game.
          2.  **Epistemic Justification (c):** If value depends on history, is our reaction to fakes about *knowledge* (Bayesian) or *ontology*? This explains the Van Meegeren shift.
          3.  **Positional/Status (b):** This is a specific *type* of extrinsic value. It needs to be evaluated against the backdrop of (a) and (c).
          4.  **Perfect Duplication (d):** This is the stress test. It applies the findings of 1, 2, and 3 to the limit case (teleportation/AI).

