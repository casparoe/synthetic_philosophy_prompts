answer: |-
  Hey, I'm sorry you lost two hours of your evening to this, though I have to say, arguing about teleosemantics with a flatmate is a rite of passage for anyone who gets too deep into philosophy of mind, so you're in good company. Your gut reaction that something feels like cheating is actually a very sophisticated philosophical instinct, one that shares DNA with Jerry Fodor's famous critiques, but your flatmate is also standing on ground that has been fortified by some heavy hitters like Ruth Millikan and David Papineau. The core of the disagreement you're having is whether the analogy between natural selection and intelligent design is merely a helpful heuristic or if it's doing illicit metaphysical heavy lifting. To audit this properly, we need to look at exactly how the mapping works in the teleosemantic framework and then stress-test the points where the analogy snaps.

  In your flatmate's view, the mapping is pretty direct. The intelligent designer maps onto natural selection, the designer's intention maps onto the pressure for reproductive fitness, the blueprint maps onto the genetic encoding of the trait, and the intended function maps onto the etiological function of the trait. So, just as a pump is designed to move water, a heart is selected to pump blood. Where this gets spicy for mental content is the normativity. If a pump fails to move water, it is malfunctioning relative to the designer's intent. If a heart fails to pump blood, it is malfunctioning relative to its selection history. Your flatmate's leap is to say that a belief state is just another biological trait: it was selected to correlate with some state of affairs, say, the presence of a predator. If the state fires when there is no predator, it is malfunctioning, just like the heart. In this picture, truth conditions are just the conditions under which the mechanism performs its selected function, and falsehood is a kind of biological malfunction. This is elegant because it seems to ground the "ought" of truth (you ought to believe what is true) in the "is" of evolutionary history (this state was selected for correlating with truth).

  However, your objection that selection has no mind is the crucial wedge here. When an engineer designs a pump, there is a fact of the matter about what the pump is for because there is a mental state in the engineer that fixes the content. If the engineer intended the pump to move water but it accidentally moves wine, it's still a water pump because the intention fixes the function. Selection has no such mental state. It is blind. So when teleosemanticists say selection "chooses" or "favors" a trait, they are speaking metaphorically. The worry you have is that by using this language, they are smuggling in the very intentionality they promised to naturalize. If selection doesn't have intentions, how can it fix content? The literature responds to this by saying we don't need actual intentions, we need a causal history that looks *as if* there were intentions. This is the move from teleology (purpose driven by mind) to teleonomy (purpose driven by history). The claim is that the historical pattern of survival and replication creates a normative standard without needing a mind to set it. A heart is for pumping not because nature wanted it to, but because ancestors with pumping hearts survived and those without didn't. The "standard" is fixed by the past successes, not a future goal.

  But this is where the mapping genuinely breaks down, and these breaks aren't just noise, they are the actual problems that keep philosophers awake at night. The first major break is specificity. A designer can specify exactly what a device is for with infinite precision. I can design a pump specifically for viscous fluids at high temperatures. Selection is blunt. It selects for outcomes, not mechanisms, and often multiple mechanisms can achieve the same outcome. This leads to the indeterminacy problem. Consider a frog's fly-catching mechanism. It fires when a small black dot moves across its visual field. Was this mechanism selected for catching flies, or for catching small black moving dots? In the frog's evolutionary history, those two things were co-extensive; every fly was a black dot and every black dot was a fly. Selection doesn't care about the distinction, only the survival outcome. But for content, the distinction is everything. If the frog snaps at a black pellet, is it misrepresenting a pellet as a fly (false belief), or is it correctly representing a black dot (true belief)? The designer analogy fails here because a designer would have specified "flies," but selection only "specified" survival correlates. Your flatmate's claim that content comes for free ignores this gap; selection fixes the function of survival, but it doesn't neatly fix the semantic content of the representation without additional theoretical machinery.

  The second major break concerns the nature of malfunction versus falsehood. In the engineering analogy, a pump that doesn't pump is broken. It fails to function. But in the mental analogy, a false belief is still a belief that is functioning as a belief, it just has the wrong content. If I believe there is a cookie in the jar and there isn't, my belief state is still performing its role as a representation, it's just inaccurate. If teleosemantics maps falsehood directly to biological malfunction, it risks implying that false beliefs are broken brains, which seems wrong. We need false beliefs to be possible without the system being pathological. Teleosemanticists try to handle this by distinguishing between the token state and the type mechanism. The mechanism is selected for truth, so a token state that is false is a malfunction of the token, even if the type is intact. But this is a delicate dance. The designer analogy carries the intuition that there is a clear standard of correctness, but it obscures the difficulty of defining what counts as a "normal condition" for selection without circularly appealing to the very environments the organism is supposed to be representing.

  So, does the naturalization survive once these disanalogies are on the table? I think the answer is that it survives, but it doesn't survive unscathed, and it certainly isn't "free" as your flatmate suggested. The designer picture was carrying the intuition of normativity, but the actual work is done by the etiological history, not the analogy itself. The project succeeds only if you accept that historical causation can generate normativity. If you think norms require a mind, then teleosemantics fails, and your objection holds. But if you accept that "proper function" can be defined purely by past replication success, then the lack of a mind in selection isn't fatal, it's just a feature. The real vulnerability isn't the lack of a mind, it's the indeterminacy I mentioned earlier. The designer analogy hides the indeterminacy because we assume the designer meant something specific. Once you remove the designer, you have to explain how nature picks out "flies" rather than "black dots" without meaning to. Some teleosemanticists bring in consumer systems (the frog's stomach selects for flies, not dots) to tighten this up, but it adds complexity that the simple design analogy glosses over.

  If you're looking for a better analogy than the intelligent designer, which inevitably invites the "where is the mind?" objection, I think a better picture is machine learning or a filtering process. Think of selection not as an engineer drawing blueprints, but as a brutal error-correction algorithm running over deep time. The genome is the code, and the environment is the test data. Representations are variables that got tuned because they minimized error rates in the past. This captures the blind, cumulative nature of selection better than the designer analogy. Or, you might think of it as an archive. The organism is a physical record of what worked in the past. A mental state represents what is in the archive under the heading of "things that caused this state to be preserved." This avoids implying that selection "wanted" anything. It just says that the state carries information about the past because it is a product of the past. This shifts the focus from "purpose" to "informational history," which might feel less like cheating to your intuition.

  Ultimately, I think your flatmate is right that the designer analogy is standard in the literature, but you are right to feel that it smuggles in intuitive weight that isn't strictly justified by the mechanism. The analogy works to convince us that functions can exist without minds, but it doesn't fully solve how specific content is fixed without ambiguity. The naturalization project doesn't collapse, but it requires more work than the analogy suggests. It requires a robust theory of how historical causation narrows down indeterminacy, and that's where the real battle is fought, not over whether selection is like a designer. So, you didn't lose the argument, you just identified the precise point where the heuristic stops doing work and the hard metaphysics begins. I'd suggest calling a truce and maybe reading Millikan's "Language, Thought and Other Biological Categories" if you want to see how deep the rabbit hole goes, but honestly, for a Tuesday night, you've probably done enough philosophy. Hope the flat stays habitable.
