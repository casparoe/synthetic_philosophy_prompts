      *   *Decision:* The Epicycle analogy is closer to the truth regarding *epistemic risk*, but the Neptune analogy captures the *sociological justification*. However, neither is quite right. The best fit is actually **Continental Drift (Wegener)**.
          *   *Why Wegener?* He had the right idea (continents move) based on pattern matching (coastlines, fossils) but no mechanism (plate tectonics) for 50 years. He was ridiculed. He was ultimately right, but for decades, it looked like speculation without a mechanism.
          *   *Wait, is that too hopeful?* Maybe.
