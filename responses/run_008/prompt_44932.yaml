      *   *Does this kill the argument?* If confirmation requires *direct* detection, yes. But modern philosophy of science (and practice) often accepts indirect confirmation (e.g., atoms before Einstein/Perrin, black holes before EHT). However, the *kind* of indirect evidence matters. Le Verrier predicted a *specific* perturbation. The Multiverse predicts a *distribution* where we happen to be in a life-permitting spot. This shifts from prediction to post-diction (anthropic reasoning). This is a critical disanalogy.

