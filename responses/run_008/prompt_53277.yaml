      *   *The Shipowner Story:* Focuses on the *origin* of the belief (negligence in inquiry), not the truth of the belief (the ship actually sank, but Clifford says he'd be guilty even if it hadn't).
      *   *Social Dimension:* Beliefs affect actions; actions affect society; habits of credulity weaken society's ability to discern truth.
