      *   *Claim 2 (Diachronic/Procedural):* The wrongness lies in the *negligence of inquiry* leading to belief, not the belief state itself.
      *   *Claim 3 (Social/Consequentialist):* Believing on insufficient evidence is wrong because it cultivates habits that endanger society (the "common stock" argument).
