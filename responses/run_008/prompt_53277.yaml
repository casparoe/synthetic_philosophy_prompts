  7.  **Final Polish:** Check against the prompt's specific constraints (numbered menu, specific criteria for each). Ensure the distinction between the *group member's usage* and *Clifford's actual text* is clear. (The group member is using it as a blunt moral club; Clifford is more nuanced about inquiry).

