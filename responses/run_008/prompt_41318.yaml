      *   *What about (1)?* Deflationism is compatible with Realism (3) and Structure (4) *if* one treats "carving" as a primitive not analyzed via truth. But it's a friction point.
      *   *Best Cleanup:* Dropping (2) resolves the conflict with (4) (the most severe), removes the need for the awkward exemption in (5), and aligns better with the robust realism of (3).

