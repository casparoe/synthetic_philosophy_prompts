      *   *Decision:* **(2) Quantifier Variance** is the linchpin of the inconsistency. It directly contradicts the "objective structure" implication of (4) (since structure usually privileges one quantifier) and creates the self-exemption problem in (5). Removing (2) allows (3) and (4) to stand as a robust realist package, makes (5) unnecessary (or easily modified to be about realism), and fits (1) better (deflationism is easier with standard realism than with QV).
