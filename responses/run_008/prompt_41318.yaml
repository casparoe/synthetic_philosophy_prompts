      *   *Let's look at (2) vs (4) again.* Ted Sider's argument is precisely that Joint Carving kills Quantifier Variance. If nature has joints, the quantifier that binds over the joints is the *correct* one. So (2) and (4) are logically incompatible in contemporary metaphysics.
      *   *So (2) must go.*
