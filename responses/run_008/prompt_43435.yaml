  3.  **Define "Commitment Race" (AI Safety Context):**
      *   Core idea: Agents gain bargaining power by restricting their own future options (making threats/promises credible).
      *   The Race: If Agent A commits early, Agent B is forced to yield or fight. If both commit early/hard, conflict results.
