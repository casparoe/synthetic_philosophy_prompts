prompt: |-
  I've been keeping a list of my gut reactions to "would you want to know?" situations, trying to figure out if there's a pattern, and I want your help extracting a principle out of it. My verdicts so far: a free accurate weather forecast before a weekend camping trip — obviously yes, I'd rebook the weekend. Finding out the sex of the baby at the 20-week scan — yes. A spoiler for the ending of a movie I'm definitely going to see this weekend — no, and I'd be genuinely annoyed. Getting tested for the Huntington's gene (it runs in my family, and there's no treatment) — no, and I actually feel it would be irrational for me to find out, even though I could still make different life choices based on the result. Finding out whether my partner of ten years ever cheated on me in the first year — no, though this one keeps me up at night. Looking up my coworkers' salaries — genuinely torn. And knowing the exact date of my death — absolutely not, don't even offer.

  Here's the complication. A friend who's into decision theory says there's a classic theorem (due to some guy named Good, I think?) showing that a rational expected-utility maximizer can never be made worse off in expectation by getting more information for free — since worst case you just ignore it and do whatever you were going to do. So either some of my verdicts are flatly irrational, or the theorem is smuggling in an assumption that doesn't hold for cases like mine. My hunch is it's the second one. The value I get from the camping weekend depends on the weather itself, but the value I get from my remaining decades seems to depend on my beliefs about them — hope, dread, anticipation — and I suspect the theorem only counts how things actually turn out, not how believing this or that affects you along the way. I'm not confident I'm stating that objection right, so please fix it if I'm mangling it.

  You're a decision theorist with a philosophical bent, so think carefully and maybe brainstorm out loud a bit before locking into an answer. What exactly does the theorem assume, where (if anywhere) does it break in my cases, and is there a principle — a patched version of the theorem, or maybe something else entirely — that captures all or most of my verdicts? Be honest about which of my verdicts it forces me to give up, since I can tell some of them can't all be saved. And then tell me what the principle says about the case I keep flip-floping on: a sealed envelope with my results from an old genetic screening study, sitting in my desk drawer.
