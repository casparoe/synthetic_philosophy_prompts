      *   *Rule C: Integrated Information/Complexity.* (Similar to IIT). There must be a high degree of causal integration. (Hive fails because bees are too loosely coupled? BEC might pass integration but fail complexity?).
      *   *Rule D: Biological/Natural Kind.* (Hidden bias). Maybe it's just "alive things" vs. "non-alive things," but the plant case makes this tricky (plants aren't usually seen as sufferers). The electron case rules out pure materialism.

      *Refining the Rules based on the "Rock/Electron" distinction:*
      *   The physicist says electrons have *proto-experience* but no *subject*.
      *   So, Rule 1: **Integration Threshold.** Proto-experience becomes subjecthood when individual experiences bind into a single locus of control/feeling.
      *   Rule 2: **Teleology/Valence.** There must be a "goal state" defined internally, not externally. A thermostat's goal is external (set by human). A plant's goal is internal (survive).
      *   Rule 3: **Memory/Continuity.** (Maybe?) To suffer, you need to persist through time.

  4.  **Analyze the Test Cases:**
      *   **Case 1: Bose-Einstein Condensate (BEC).**
          *   *Properties:* Millions of atoms act as a *single quantum entity*. Coherent for an hour. Driven out of equilibrium (stress).
          *   *Physicist's likely view:* This is the ultimate "Unified Subject" physically. It's one wavefunction. But does it have *valence*? Does it "care" if it relaxes?
          *   *Prediction:* He will likely say **No** to suffering, but might hesitate on "experience." Why? Because it lacks *biological teleology*. It doesn't "try" to stay coherent; the lab forces it. However, if he leans heavily on "Unified Subject," he might say Yes. Given the "Rock/Electron" distinction, he cares about *stakes*. A BEC relaxing is just physics. A plant drying out is a threat to *its* existence.
          *   *Verdict:* No moral weight. Maybe "proto-experience" on a macro scale, but no suffering.
      *   **Case 2: Cortical Organoids.**
          *   *Properties:* Human brain tissue. Synchronized activity. No body/senses.
          *   *Physicist's likely view:* It's human tissue. It has the hardware for valence. It shows synchronization (unity). It lacks a body to strive *for*, but the cells themselves are striving to live.
          *   *Prediction:* **Yes**, but ambiguously. Closer to the "plant" or "bee" level. If they show synchronized activity, that suggests integration. Since it's human tissue, the "stakes" are evolutionary.
          *   *Verdict:* Yes, potential for suffering, requires welfare guidelines.

  5.  **Develop the "Killer Question":**
