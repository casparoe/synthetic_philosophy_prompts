  The work premise (4) was doing is enforcing a rigid essentialism incompatible with Dennett's universal Darwinism. It serves to invalidate taxonomies based on continuous variables, protecting the intuition that real categories must be discrete. Rejecting it costs us the comfort of sharp metaphysical boundaries. We must accept in its place a defence of joints that survive being approached by degrees: *phase transitions*. When a system crosses a threshold of control, it gains access to a new state space. The Popperian creature isn't just a faster Skinnerian; it accesses a space of counterfactuals inaccessible to overt testing. This is a difference in kind of *access*, derived from a difference in degree of *control*. Categories are real if they carve nature at lines of causal potency, even if those lines are threshold-dependent.

  The student's "trial density" parameter fails because it collapses structural information. Knowing a system runs many cheap trials doesn't tell you *how* it does so. A neural net and a Popperian agent might have similar trial densities, but only the latter uses internal models to simulate consequences. The tower captures the *mechanism* of intelligence, not just its throughput. A sieve and a scientist differ in density, but the scientist uses internal models to simulate consequences. The sieve cannot represent the gravel; the scientist represents the hypothesis. That is an architectural kind, not just a density difference.

  What would change my mind? If "trial density" could reliably predict the emergence of specific cognitive architectures without referencing structural location. If high density invariably produced inner rehearsal, the parameter might suffice.

  Where might I fail? I risk smuggling in a dualist intuition that "inner" means "non-physical." I must ensure the "architectural difference" is cashed out in physicalist terms (e.g., feedback loops within the boundary of the skin). Also, I may overstate the discreteness of the storeys; Dennett himself admits the boundaries are fuzzy. The student is right that the boundaries are porous, but wrong that this makes the taxonomy arbitrary. The taxonomy tracks *competence* thresholds, not just metrics.
