prompt: |-
  I just got made lead mod of a 90k-person Discord server for vintage synthesizer repair, and it's gotten weird lately. A long-standing core of members has developed a strong house line about which restoration methods and which aftermarket parts are "correct," and newer folks who cite outside sources (official service manuals, techs on other forums) get piled on. I've read a bit about the distinction between epistemic bubbles (you just never hear the other side) and echo chambers (you hear them, but you've been primed to think they're untrustworthy or stupid), and the remedies seem totally different -- a bubble might just need exposure, while forcing exposure on an echo chamber can backfire and make it worse. I can't tell which we have, or whether we're just a healthy community with a real expertise-based consensus, which I gather is a third thing.

  Write me a diagnostic + intervention procedure I can actually run with two other mods in an afternoon of reading logs and threads. It should say: what evidence to look at in order (how would we even tell "never encounters outside views" apart from "encounters and dismisses them"), what counts as a sufficient answer at each step, and where it stops and says "this is a values call for the mods, the procedure can't decide." Then it should map diagnoses to interventions, being honest about which interventions a mod team with no real power except bans and channel structure can actually pull off, and which are likely to blow up in our faces. Run it on three cases: (1) a subcommunity around one particular synth family that treats a certain repair guy on YouTube as a fraud, (2) a general chat that's just never once linked anything outside the server, and (3) the case I'm dreading, where the house line is probably right, the outsiders citing manuals are mostly wrong, and my instinct to "introduce outside voices" would just be epistemic theater. Say plainly what the procedure can't handle.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnostic and intervention procedure:

  1.  **Analyze the Request:**
      *   **Role:** Lead Mod of a 90k-person Discord server (Vintage Synth Repair).
      *   **Problem:** A core group enforces a "house line" on restoration methods/parts. Newcomers citing outside sources (manuals, other techs) get piled on.
      *   **Conceptual Framework:** Epistemic Bubbles (lack of exposure) vs. Echo Chambers (active distrust of outside sources) vs. Expertise-Based Consensus (actual correctness).
      *   **Task:** Create a diagnostic + intervention procedure for a 3-mod team to run in an afternoon.
      *   **Requirements:**
          *   Order of evidence to look at.
          *   Criteria for "sufficient answer" at each step.
          *   Stop condition (when it becomes a values call).
          *   Map diagnoses to interventions (honest about mod power limits).
          *   Risk assessment (what might blow up).
          *   Run the procedure on three specific cases:
              1.  Subcommunity hating a specific YouTuber.
              2.  General chat with zero outside links.
              3.  The "House line is right, outsiders are wrong" scenario.
          *   Plainly state limitations.

  2.  **Deconstruct the Concepts:**
      *   *Epistemic Bubble:* People haven't seen the other side. Remedy: Show them the other side.
      *   *Echo Chamber:* People have seen the other side but have a pre-emptive defeater (e.g., "Manuals are wrong because the authors didn't know X"). Remedy: Rebuild trust in institutions/sources (very hard).
      *   *Expertise Consensus:* The group is actually right based on collective experience that supersedes generic manuals (e.g., "The manual says use capacitor X, but we know X fails in 2 years, use Y"). Remedy: Document the *why*, don't suppress the question.

  3.  **Drafting the Diagnostic Procedure (The "Audit"):**
      *   *Timeframe:* Afternoon (3-4 hours).
      *   *Team:* 3 Mods.
      *   *Step 1: The Link Trace (Bubble vs. Chamber).* Look at how outside sources are treated when they *do* appear.
          *   *Evidence:* Search for keywords ("manual," "service note," "YouTube," "forum").
          *   *Signal:* Are links ignored (Bubble) or attacked/ad hominemed (Chamber)?
      *   *Step 2: The 'Why' Excavation (Consensus vs. Dogma).* Look at the justification for the house line.
          *   *Evidence:* Threads where the house line is enforced.
          *   *Signal:* Is there technical reasoning ("This cap leaks") or social signaling ("Real techs know")?
      *   *Step 3: The Newcomer Trajectory (Culture Check).* Look at what happens to new users.
          *   *Evidence:* DMs or mod logs regarding reports of "pile-ons."
          *   *Signal:* Are they educated or banned/mocked?
      *   *Stop Condition:* If the technical merit is genuinely ambiguous or relies on subjective values (e.g., "originality" vs. "reliability"), the procedure stops. It's a policy call.

  4.  **Drafting the Intervention Map:**
      *   *Bubble:* Pin resources, host AMAs, encourage linking. Low risk.
      *   *Chamber:* Hard. Need to model trust. "Source of the Month." Mod-led validation of outside experts. High risk of backlash from core.
      *   *Consensus:* Formalize the knowledge. Make a Wiki/FAQ. Acknowledge the manual is "theoretically" right but "practically" wrong. Low risk if handled respectfully.
      *   *Values Call:* Mod team decides the server's purpose (Museum vs. Workshop). High risk.

  5.  **Running the Procedure on the Three Cases:**

      *   *Case 1 (The YouTuber):*
          *   *Diagnosis:* Likely Echo Chamber. If they call him a fraud *without* technical breakdowns, it's distrust. If they cite specific failures, it's Consensus.
          *   *Intervention:* If Echo Chamber, mod team needs to verify the YouTuber independently. If valid, mod-endorsed "contrarian view" thread.
          *   *Risk:* Core members feeling betrayed.

      *   *Case 2 (General Chat Isolation):*
          *   *Diagnosis:* Epistemic Bubble. Pure laziness/habit.
          *   *Intervention:* "Link Drop" channels, bot reminders.
          *   *Risk:* Low.

      *   *Case 3 (House Line is Right):*
          *   *Diagnosis:* Expertise Consensus. Manuals are outdated; community knowledge is current.
          *   *Intervention:* Stop trying to "balance" the view. Create a "Community Addendum to Service Manuals" resource. Validate the newcomers' intent but correct their source hierarchy.
          *   *Risk:* "Epistemic Theater" (looking fair but spreading misinformation).

  6.  **Refining the Output:**
      *   *Tone:* Professional, pragmatic, slightly cynical (mod-to-mod), actionable.
      *   *Structure:* Clear headings, bullet points, decision trees.
      *   *Constraint Check:* Did I answer "what evidence," "sufficient answer," "stop condition," "interventions," "risk," and the "three cases"? Yes.
      *   *Self-Correction on "Power":* Acknowledge mods can't force people to think, only shape channels and remove toxicity. The intervention must be structural, not psychological.

  7.  **Final Polish:**
      *   Make sure the distinction between "Echo Chamber" and "Expert Consensus" is sharp. That's the crux of the user's problem.
      *   Ensure the "Stop Condition" is clear—mods aren't arbiters of truth, they are arbiters of conduct and community purpose.
      *   Add a section on "What this procedure can't handle" (e.g., deep ideological rifts, actual technical stalemates).

  8.  *(Self-Correction during drafting)*: I need to make sure I don't give them a "truth test." Mods aren't engineers. The diagnostic must rely on *behavioral* evidence, not technical verification. The technical verification is the *limit* of the procedure.

  9.  *(Final Review against prompt)*: "Write me a diagnostic + intervention procedure I can actually run with two other mods in an afternoon." Keep it tight. "Run it on three cases." Ensure specific application. "Say plainly what the procedure can't handle." Add a limitations section.

  Let's write it.cw
answer: |-
  # The "House Line" Diagnostic & Intervention Protocol
  **For:** Lead Mod + 2 Senior Mods
  **Timebox:** 3.5 Hours
  **Goal:** Distinguish between Epistemic Bubble, Echo Chamber, and Expert Consensus. Map to actionable mod tools.

  ## Part 1: The Diagnostic Audit (90 Minutes)
  *Do not judge the technical truth yet. Judge the social reaction to information.*

  ### Step 1: The "Outside Source" Stress Test (30 mins)
  **Action:** Search logs for the last 6 months using keywords: `"manual"`, `"service note"`, `"YouTube"`, `"according to"`, `"source"`. Filter for threads with >10 replies.
  **Look For:** How the core group reacts when an outside source is introduced.

  *   **Indicator A (Bubble):** The source is ignored or met with "I haven't seen that." The conversation moves on without engaging the source.
  *   **Indicator B (Echo Chamber):** The source is attacked *ad hominem* or preemptively disqualified ("That manual is from the 80s, they didn't know," "That guy is a clickbaiter").
  *   **Indicator C (Consensus):** The source is engaged technically ("The manual says X, but that capacitor type is known to leak, here's a thread from 2019 proving it").

  **Sufficient Answer:** If 70% of interactions match one indicator, proceed to Step 2. If mixed, you have sub-factions (see Case 1).

  ### Step 2: The "Why" Excavation (30 mins)
  **Action:** Pick the top 3 "House Line" rules (e.g., "Never use modern electrolytics," "Always recap the power supply"). Find the most recent enforcement of these rules.
  **Look For:** The justification provided.

  *   **Indicator A (Dogma):** "Because that's how we do it here," "Real techs know," or circular linking to internal wiki posts.
  *   **Indicator B (Tacit Knowledge):** "The manual specifies X, but X causes Y failure mode in high humidity," or "We tried that for 5 years and had 40% return rates."
  *   **Indicator C (Aesthetic/Values):** "It's not vintage if you use that part." (This is a values call, not epistemic).

  **Sufficient Answer:** Can you find a *technical mechanism* explaining why the house line differs from the manual? If yes -> Consensus. If no -> Dogma/Chamber.

  ### Step 3: The Newcomer Trajectory (30 mins)
  **Action:** Review mod logs for reports or mutes regarding "hostility" or "gatekeeping" in repair channels.
  **Look For:** The outcome of the conflict.

  *   **Indicator A:** Newcomer is muted/banned for "spreading misinformation."
  *   **Indicator B:** Newcomer is directed to a FAQ or mentored.
  *   **Indicator C:** Core members are warned for piling on.

  **Sufficient Answer:** Who bears the burden of proof? If the newcomer must prove the core wrong, you lean Chamber. If the core must explain why the manual is insufficient, you lean Consensus.

  ### 🛑 STOP CONDITION: The Values Wall
  If Step 2 yields **Indicator C (Aesthetic/Values)**, the procedure stops.
  *   **Diagnosis:** This is not an epistemic problem; it is a community purpose problem.
  *   **Action:** Mod team must decide: Are we a **Museum** (preserve original spec at all costs) or a **Workshop** (ensure reliability/playability)?
  *   **Why:** No amount of linking sources will solve a disagreement about whether a synth *should* be original or reliable. This requires a pinned policy announcement.

  ---

  ## Part 2: Intervention Map (90 Minutes)
  *Match your diagnosis to these tools. Be honest about risk.*

  | Diagnosis | Intervention | Mod Power Required | Risk Level |
  | :--- | :--- | :--- | :--- |
  | **Epistemic Bubble** (They just don't know) | **Structure Change:** Create a `#resources-and-reading` channel. Pin a "Recommended External Sources" list. Bot auto-reminder: "Have you checked the manual?" when "help" is typed. | Low (Channel mgmt) | **Low.** Welcomed as helpful. |
  | **Echo Chamber** (Active distrust) | **Trust Bridging:** Mods must personally validate an outside source. "I checked this manual, here is where it aligns with us, here is where it differs." Host an AMA with a respected outsider. | High (Mod capital) | **High.** Core may view mods as traitors/naive. |
  | **Expert Consensus** (House line is right) | **Formalize the Addendum:** Stop letting it be a shouting match. Create a "Community Errata" wiki. "Manual says X, Community says Y because Z." Validate the newcomer's source *status* but correct the *application*. | Medium (Wiki/Docs) | **Medium.** Can look like arrogance if not documented well. |
  | **Values Call** (Museum vs. Workshop) | **Policy Line:** Pin a rule: "Debate on originality vs. reliability belongs in `#philosophy`, not `#repair-help`." Enforce neutrality in help channels. | High (Culture shift) | **High.** Will alienate one faction permanently. |

  ### ⚠️ Risk Warning: What Will Blow Up
  1.  **Forcing Exposure in a Chamber:** If you force links into an Echo Chamber without rebuilding trust first, the core will assume *you* have been compromised by the outside source. They will turn on the mod team.
  2.  **Epistemic Theater:** In a Consensus scenario, pretending the manual is "equally valid" insults the collective experience of your experts. They will leave.
  3.  **The "Ban Hammer" on Truth:** If you ban a core member for being right (technically) but rude, you lose expertise. If you ban a newcomer for being wrong but polite, you lose growth. **Moderate tone, not technical claims.**

  ---

  ## Part 3: Running the Procedure on Your Three Cases

  ### Case 1: The Subcommunity vs. The YouTuber
  *   **Run Step 1:** Search the YouTuber's name.
      *   *If they say:* "He's a sellout" without tech specs -> **Echo Chamber.**
      *   *If they say:* "His method for the Prophet-5 filter bypass causes oscillation, see thread #4492" -> **Expert Consensus.**
  *   **Intervention:**
      *   *If Chamber:* Do not defend the YouTuber yet. Pick *one* technical claim the YouTuber made. Mod team tests it or finds a neutral third party to test it. Present data, not opinion.
      *   *If Consensus:* Pin the "Why He's Wrong" technical breakdown. Stop the pile-ons; direct people to the breakdown.
  *   **Risk:** If the YouTuber is actually popular, defending the "House Line" might make the server look elitist. If the YouTuber is dangerous, ignoring him makes the server look negligent.

  ### Case 2: General Chat Isolation (The Bubble)
  *   **Run Step 1:** Search for external links in `#general`. Count = ~0.
  *   **Run Step 2:** Ask in mod chat: "Do we *have* a recommended reading list?" If no -> **Bubble.**
  *   **Intervention:** **Low Risk.** Create `#external-links`. Seed it with 10 high-quality links (Reverb articles, Synthopia, official archives). Instruct mods to drop a link once a day.
  *   **Why:** This is laziness, not ideology. Fix the channel structure.

  ### Case 3: The Dreaded Case (House Line is Right, Manuals are Wrong)
  *   **Run Step 2:** You find the technical justification (e.g., "Manuals specify tantalum caps, but we know they short and burn boards. We use bi-polar electrolytics.").
  *   **Diagnosis:** **Expert Consensus.**
  *   **Intervention:** **Do not introduce outside voices to "balance" this.** That is Epistemic Theater.
      *   *Action:* Create a "Service Manual Errata" channel or Wiki page.
      *   *Script for Mods:* "The manual is the factory baseline. This community maintains the *field update* log. You aren't wrong to cite the manual, but you are working with outdated data."
      *   *Protection:* Protect newcomers from being called "stupid." Protect veterans from having to explain the same capacitor failure for the 100th time.
  *   **Risk:** The risk here is *not* intervening. If you force "balance," you legitimize dangerous repair advice (fire hazard). Your duty is safety/accuracy, not neutrality.

  ---

  ## Part 4: Limitations (What This Procedure Can't Handle)

  1.  **Technical Stalemates:** If the mod team cannot verify the tech (e.g., "Does this mod actually degrade tone?"), you cannot diagnose Consensus vs. Dogma. You must declare neutrality and move the debate to a `#theoretical-discussion` channel away from `#help`.
  2.  **Personality Cults:** If the "House Line" is tied to a specific living member (e.g., "Bob says so"), you have a leadership problem, not an epistemic one. This requires HR-style management, not info-architecture.
  3.  **The "True Believer" Exit:** If you successfully burst a Bubble or challenge a Chamber, your most dogmatic members *will* leave. You must accept this churn as the cost of health. The procedure cannot prevent this.
  4.  **Liability:** If the "House Line" involves safety (high voltage, fire risk) and is *wrong*, no amount of community consensus protects you. In safety cases, **Official Documentation > Community Consensus**, always.

  ## Final Directive for the Mod Afternoon
  1.  **Hour 1:** Run the Audit (Part 1). Decide which of the 3 Diagnoses fits each problem channel.
  2.  **Hour 2:** Draft the Interventions (Part 2). Write the FAQ/Wiki text.
  3.  **Hour 3:** Align on the "Values Wall." If you hit the Stop Condition, decide the server's stance (Museum vs. Workshop) and draft the announcement.
  4.  **Hour 4:** Rest. Do not implement immediately. Sleep on it. Implement next day.

  **Remember:** You are not the arbiters of truth. You are the arbiters of *how truth claims are processed*. If the process is toxic, fix the process. If the process is healthy but the conclusion is unpopular, defend the process.
