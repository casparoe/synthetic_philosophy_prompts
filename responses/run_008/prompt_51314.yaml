answer: |-
  **Prediction**
  Your sister will verdict that your friend's conduct is **permissible** (and likely morally required, given the reliance involved). She will not regard paying the fee as bribery in the moral sense, but as adhering to the local normative framework.

  **Competing Rules**
  To explain her track record, we can distill two competing moral principles. Both fit her past rulings, but they diverge on the nature of public office.

  *   **Rule 1: The Principle of Functional Conventionalism.**
      *   *Definition:* An action's moral status is determined entirely by the functioning local conventions of the specific context. If a practice is universal, expected, and relied upon locally, it constitutes the moral norm, regardless of written laws or abstract notions of justice.
      *   *Fit to Track Record:* Explains why queue cutting is wrong (violates local fairness scheme) but bus jostling is not (no local fairness scheme). Explains why US stiffing is wrong (violates reliance) but Japan non-tipping is fine (no reliance). Explains why 3 a.m. jaywalking is fine (no coordination needed) but daylight jaywalking is wrong (disrupts coordination).
      *   *Prediction for Test Case:* **Permissible.** The "expediting fee" is the functioning local convention. The written law is a "dead letter." The officials rely on it. Therefore, paying is morally aligned with the local norm.

  *   **Rule 2: The Principle of Domain-Specific Relativism.**
      *   *Definition:* Social and private conventions (etiquette, tipping, queues) are relative to local custom, but civic and legal duties regarding public officials retain universal moral weight, even if locally unenforced.
      *   *Fit to Track Record:* Explains the social rulings (shoes, tipping, queues, bus stops) as relative to custom. It leaves room for the jaywalking rulings to be about safety/harm rather than law. It has not yet been tested by a case involving public officials.
      *   *Prediction for Test Case:* **Wrong.** Despite local custom, the interaction involves a public official and a written law. The "civic domain" requires adherence to the formal rule against corruption, regardless of local practice or reliance.

  **Best Guess and Reasons**
  My best guess is that **Rule 1 (Functional Conventionalism)** is the correct description of her views. She will approve of the friend's conduct.

  *   **Reason 1: The Primacy of Reliance over Justice.** In the US tipping case, she ruled that stiffing a waiter is wrong *even though* she regards the system as unjust. This demonstrates that immediate reliance (the waiter's income) trumps abstract systemic justice (the unfair wage structure). In the bribery case, the officials' incomes rely on the fees. Consistency demands she prioritize that reliance over the abstract injustice of corruption.
  *   **Reason 2: The Primacy of Practice over Code.** In the jaywalking and bus stop cases, she prioritized the *actual* flow of behavior over the *written* or *theoretical* order. Jaywalking is fine when the street is deserted (practice allows it) and jostling is fine when queueing isn't the custom (practice allows it). The written law against bribery is explicitly described as a "dead letter." To her, a dead letter carries no moral weight.
  *   **Reason 3: The Definition of "Wrong."** She distinguishes between "wrong" (violating a reliance-based norm, like US tipping) and "gauche" (violating a non-reliance norm, like Japan tipping). Since the bribery fee is relied upon, it falls into the "wrong to withhold" category, making payment permissible.

  **Distinguishing Case**
  To tell Rule 1 and Rule 2 apart, we need a case that isolates **Local Custom** from **Individual Reliance** within the **Civic Domain**.

  *   **The Case:** A traveler is in a country where it is universal and expected to **lie on customs declaration forms** regarding the value of personal electronics. The customs officers expect the lie, wave the traveler through, and do not receive any personal payment (no bribery/reliance). The written law requires truth, but the enforcement practice assumes falsehood.
  *   **Why it distinguishes them:**
      *   **Rule 1 (Functional Conventionalism)** predicts this is **Fine**. It is the functioning local convention; no one is harmed; the "law" is a dead letter in practice.
      *   **Rule 2 (Domain-Specific Relativism)** predicts this is **Wrong**. It involves a civic duty (honesty with the state) and a legal document, which should remain universal even if social etiquette (like tipping) is relative.

  If your sister says lying on the form is fine, she is a Functional Conventionalist (and definitely approves of the bribe). If she says it is wrong, she holds a Civic Exception view (and might actually condemn the bribe despite my prediction). Given her history with the US tipping system, the former is far more likely.
