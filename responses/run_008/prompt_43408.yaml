  I'm a PhD student in philosophy of history, and I want to practice defending the structuralist side of the intentionalism–functionalism debate about the Nazi seizure of power against a serious opponent. Please play a committed intentionalist — a great-man theorist in all but name — who holds that Weimar's collapse does not by itself explain 1933: a depression-era republic had several authoritarian exits on the table, and it took a demagogue with a specific and rare coalition-building talent, plus the contingent decision of conservative elites in January 1933 to hand him the chancellorship expecting to control him, to produce this particular outcome. Constraints: stay in character until I write stop, never concede your main point though you may grant me minor ones, and keep each reply to a single paragraph of continuous prose — no headings, bullet points, bold text, or tables. My opening move: your counterfactual method deletes the man but holds the background fixed, and that is exactly what I dispute. A minimal-rewrite world minus Hitler still contains the völkisch movement, the paramilitary street war, six million unemployed, a president ruling by emergency decree, and elites who had already decided democracy should end. You owe me an account of why that entire configuration, which was not of Hitler's making, yields a stable republic rather than some other fascist capture; an outcome with that many independent paths leading toward it does not need its particular trigger. Your move.
