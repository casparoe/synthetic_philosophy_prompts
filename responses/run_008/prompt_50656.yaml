      *   **Argument 1 (Disposition):** Being the *type* of person who sticks with things is valuable, even if specific instances aren't. (Analogy: Honesty).
      *   **Argument 2 (Self-Promise):** Deciding is a promise to future self. Quitting is betrayal.
