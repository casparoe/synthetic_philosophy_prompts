answer: |-
  Here is a point-by-point adjudication of the exchange, followed by an analysis of your three specific questions, identification of missing moves, and an overall verdict.

  ### Point-by-Point Adjudication

  **(1) Marta: The Classic Formulation**
  *   **Verdict:** **Right.**
  *   **Justification:** Marta correctly states the canonical Frege–Geach problem. The core tension is between the *semantic uniformity* required for logical validity (the word "wrong" must contribute the same meaning in embedded and unembedded contexts) and the *expressivist semantics* (where meaning is tied to the act of assertion, which does not occur in embedding). Without a compositional semantics that assigns values to subsentential parts, the validity of *modus ponens* cannot be explained formally, only pragmatically.

  **(2) Jonas: The Blackburnian Higher-Order Attitude**
  *   **Verdict:** **Right in Part, Mistaken in Part.**
  *   **Justification:** Jonas is right that Blackburn (*Being Good*) offers a coherent *pragmatic* explanation of why accepting the premises and rejecting the conclusion is irrational (it involves a "fractured sensibility"). However, he is mistaken if he claims this explains *logical validity* in the standard sense. Blackburn redefines validity as the preservation of attitude-coherence rather than truth-preservation. While this saves the *normativity* of logic for the expressivist, it does not solve the semantic problem of how the meaning of the conditional is composed from its parts, which is required to explain why the argument is valid *in virtue of its form*.

  **(3) Marta: The Compositionality Objection**
  *   **Verdict:** **Right.**
  *   **Justification:** Marta identifies the fatal flaw in early quasi-realism. Blackburn's account assigns a semantic value to the conditional sentence as a whole based on the attitudes involved, rather than deriving it from the semantic values of "stealing," "wrong," and "if...then." As Mark Schroeder has rigorously demonstrated, without strict compositionality, the theory cannot account for the productivity of language or the validity of novel arguments. Stipulating validity case-by-case is not a semantics.

  **(4) Marta & Jonas: The Negation Problem**
  *   **Verdict:** **Marta is Right; Jonas's Reply is Insufficient.**
  *   **Justification:** This is Mark Schroeder's "Negation Problem." Jonas's suggestion (akin to Gibbard's norm-expressivism) that negation operates on the content of the attitude ("being for not-blaming") avoids the "absence of attitude" problem. However, Marta is correct that this threatens to collapse expressivism into realism. If the object of the attitude is structured enough to be negated and embedded logically, it functions exactly like a proposition. If the "content" of the attitude is propositional, the distinction between expressing an attitude toward a proposition and believing that proposition becomes metaphysically thin.

  **(5) Jonas: Hybrid Expressivism**
  *   **Verdict:** **Right in Part.**
  *   **Justification:** Jonas is right that hybrid views (e.g., Copp, Ridge) technically solve the embedding problem by offloading the logical work to a cognitive belief component (e.g., believing that stealing violates a standard). This secures compositionality and truth-conditions. However, this is only a partial solution because it shifts the burden to explaining the relationship between the two components and risks making the expressive component semantically idle.

  **(6) Marta: The Hybrid Dilemma**
  *   **Verdict:** **Mostly Right.**
  *   **Justification:** Marta poses a powerful dilemma. If the belief component carries the truth-conditions, the view risks collapsing into a form of realism where the attitude is merely a pragmatic overlay (the "semantically idle" objection). If the attitude component contributes to truth-conditions, the expressivist must explain how non-cognitive states contribute to truth without reintroducing the Frege–Geach problem for that component. While sophisticated hybrids (like Ridge's *Ecumenical Expressivism*) attempt to navigate this, Marta is correct that the view struggles to maintain a distinctively *expressivist* account of truth-conditions.

  **(7) Jonas: Logic of Attitudes / Coherence**
  *   **Verdict:** **Mistaken in Strategy, Right in Diagnosis.**
  *   **Justification:** Jonas is right that the current state of the art (e.g., Gibbard's *Thinking How to Live*) involves developing a formal logic of planning or attitudes rather than mimicking truth-conditional semantics. However, he is mistaken to present this as a simple retreat. It is a substantive theoretical commitment. Marta is too dismissive in calling it "not obviously a live program"; it is the dominant research frontier for expressivists. However, Jonas concedes that the problem is unsolved, which validates Marta's initial challenge.

  ---

  ### Deep Dive: Three Specific Questions

  **1. Does move (2) actually explain the validity of the *modus ponens* argument or only redescribe what a consistent set of attitudes looks like?**
  Marta is correct here. Move (2) explains *consistency*, not *validity*. Validity is a property of arguments (premises supporting a conclusion); consistency is a property of sets of attitudes. Blackburn shows that holding the premises and denying the conclusion is *inconsistent* (a fractured sensibility). But to explain validity, one must show that the truth (or correctness) of the conclusion is contained in the premises in virtue of their semantic structure. By defining validity as "attitude coherence," Blackburn changes the subject from logic to psychology. Unless the expressivist can provide a model-theoretic semantics for attitudes that mirrors truth-conditional models (which Gibbard attempts but remains controversial), move (2) remains a redescription of the *normative force* of logic, not an explanation of its *validity*.

  **2. Is Marta's compositionality demand in (3) a fair requirement or quietly assumes a truth-conditional standard that the expressivist is entitled to reject?**
  Marta's demand is **fair**. It does not beg the question for truth-conditional semantics. Compositionality is a constraint on *any* theory of meaning that wishes to explain the productivity and systematicity of language. Even if one rejects truth-conditions as the *semantic value*, one must still provide a function that maps the semantic values of parts to the semantic value of the whole. If "wrong" contributes Value A in an assertion and Value B in a conditional antecedent, the theory fails to explain how we understand sentences we have never encountered before. Expressivists are entitled to reject truth-conditions, but they are not entitled to reject compositionality. Blackburn's early failure to provide a compositional semantics was a technical failure, not a philosophical choice.

  **3. Is the negation issue in (4) genuinely separable from the conditional problem in (1) or just one face of the same objection?**
  They are **genuinely separable**, and the negation problem is widely considered the harder of the two. The conditional problem (1) is about *embedding*: how can an unasserted context carry meaning? The negation problem (4) is about *inconsistency*: what is the relation between "X is wrong" and "X is not wrong"?
  *   In (1), the expressivist can posit a higher-order attitude to bridge the gap.
  *   In (4), the expressivist must explain why "X is wrong" and "X is not wrong" are contradictory. If "wrong" expresses disapproval, "not wrong" cannot merely express the absence of disapproval (indifference), or there is no contradiction. It must express a contrary attitude (tolerance/approval). But if negation flips the attitude type rather than operating on content, it behaves differently than negation in "The cat is not on the mat." Schroeder argues this requires a complex semantics of "being for" that distinctively handles A-type (disagreement in attitude) and B-type (logical) inconsistency. This is a deeper structural problem than mere embedding.

  ---

  ### Missing Moves

  Both debaters are operating within a framework that assumes a sharp dichotomy between "representing facts" (realism) and "expressing attitudes" (expressivism). Two moves could reframe the dispute:

  1.  **Inferential Role Semantics (IRS):** A proponent could argue that meaning is constituted by inferential roles rather than truth-conditions or attitudes (e.g., Brandom, Chrisman). On this view, "Stealing is wrong" means what it does because of the inferences it licenses. This dissolves the Frege–Geach problem because the "meaning" of the embedded occurrence *is* its potential to serve as a premise in an inference. This bypasses the need for truth-conditional compositionality without collapsing into realism.
  2.  **Global Expressivism:** (e.g., Huw Price, Kappel). This move argues that *all* discourse (including descriptive discourse) is expressive in some sense. If "The cat is on the mat" is also treated expressively (e.g., expressing a commitment to a certain representational norm), then the disparity between moral and descriptive embeddings vanishes. The problem arises only because expressivists grant descriptive language truth-conditions while denying them to moral language.

  ### Overall Verdict

  **Marta comes out more right overall.**

  While Jonas correctly identifies the evolving strategies of contemporary expressivism (quasi-realism, hybrid views, logic of planning), Marta correctly identifies that none of these strategies have fully discharged the burden of proof.
  *   Jonas's Move (2) is the standard quasi-realist reply, but it is widely acknowledged in the literature (post-Schroeder) to be insufficient without a compositional semantics.
  *   Jonas's Move (5) and (7) represent the current state of the art, but as Marta notes, they either risk collapsing into realism (5) or remain an unfinished research program (7).
  *   Marta's objections track the consensus in metaethics that the Frege–Geach problem remains the primary technical hurdle for expressivism. She wins on the technical requirements of semantics and logic, which is the battlefield Jonas chose to engage on.

  Jonas is right that the *philosophical motivation* for expressivism (avoiding queer metaphysical facts) remains strong, but in a debate specifically about the *semantic coherence* of the view, Marta's demands for compositionality and a robust account of negation are decisive. Jonas defends a research program; Marta defends the logical constraints that program has yet to satisfy.
