      *   **Task:** Adjudicate a 7-move exchange between Marta (critic) and Jonas (defender/expressivist sympathizer).
      *   **Requirements:**
          *   Point-by-point adjudication of moves (1) through (7).
          *   Identify who is right/wrong/mixed on specific points with justification.
          *   Address three specific deep-dive questions:
              1.  Does move (2) explain validity or just redescribe consistency?
              2.  Is Marta's compositionality demand (3) fair or question-begging?
              3.  Is the negation issue (4) distinct from the conditional problem (1)?
          *   Identify missing moves that could reframe the dispute.
          *   Declare an overall winner (or draw).
      *   **Tone:** Professional, academic, precise, suitable for a PhD level.

  2.  **Deconstruct the Exchange:**

      *   **Move (1) Marta:** Classic Frege-Geach. Unembedded = expression of attitude. Embedded (antecedent) = no assertion, so no attitude expressed. But meaning is constant. Validity requires constant meaning. Expressivism fails compositionality and validity explanation.
      *   **Move (2) Jonas:** Blackburnian quasi-realism. Accepting the conditional = higher-order attitude (disapproval of [disapproving of stealing & not disapproving of brother stealing]). Inconsistency = fractured sensibility (attitudinal inconsistency).
      *   **Move (3) Marta:** Compositionality objection. Blackburn's move is stipulative/holistic, not compositional. It doesn't build meaning of complex from simple.
      *   **Move (4) Marta:** Negation problem (Schroeder's contribution mostly). Absence of attitude vs. contrary attitude. Jonas: Negation inside object (being for not-blaming). Marta: This makes attitudes proposition-like, collapsing into realism.
      *   **Move (5) Jonas:** Hybrid Expressivism (e.g., Copp, Ridge). Belief component handles logic/truth; Attitude component handles action/motivation.
      *   **Move (6) Marta:** Dilemma for Hybrids. If belief does logic, attitude is epiphenomenal to truth-conditions (realism + psychology). If attitude affects truth-conditions, compositionality problem returns.
      *   **Move (7) Jonas:** Retreat to Coherence/Logic of Attitudes. Don't mimic truth-conditional semantics. Validity = preservation of coherence. Marta: Research program too immature/failed.

  3.  **Evaluate Each Move (Drafting the Adjudication):**

      *   *(1) Marta:* Correct statement of the problem. This is the standard formulation. *Verdict:* Right.
      *   *(2) Jonas:* This is Blackburn's *Being Good*. Does it explain validity? It explains *why we shouldn't disagree*, but does it explain *logical validity* (truth preservation)? Expressivists redefine validity. Critics say this changes the subject. *Verdict:* Mixed. It explains pragmatic inconsistency, but struggles to capture logical validity without smuggling in truth-conditions.
      *   *(3) Marta:* Compositionality. Blackburn's early account was indeed criticized (e.g., by Schroeder) for being uncompositional. It assigns meanings to sentences globally rather than building up. *Verdict:* Mostly Right. Quasi-realism struggles with strict compositionality.
      *   *(4) Marta/Jonas:* Negation. This is the "Negation Problem" (Schroeder). Jonas's "being for not-blaming" is Gibbard's norm-expressivism move. Marta's charge of collapsing into realism is the "semantic collapse" objection. *Verdict:* Marta is stronger here. If the content is structured enough to be negated, it looks propositional.
      *   *(5) Jonas:* Hybrid Expressivism. A popular move (Ridge, Copp). Solves embedding by offloading it to the cognitive component. *Verdict:* Right that it solves embedding, but...
      *   *(6) Marta:* The "Collapse" objection against Hybrids. If the cognitive part carries the truth-conditions, is it still expressivism? *Verdict:* Strong point. Hybrids often look like realism with extra steps.
      *   *(7) Jonas:* Logic of Attitudes. Gibbard's later work. Validity as consistency of plans/norms. Marta: Program hasn't delivered. *Verdict:* Jonas is right that this is the current frontier; Marta is right it's incomplete.

  4.  **Address the Three Specific Deep-Dive Questions:**

      *   *Q1: Move (2) Validity vs. Redescription.* Blackburn explains *inconsistency*, not strictly *validity* in the model-theoretic sense. He redefines validity as coherence of attitudes. So Marta is right that it might just be a redescription unless a formal logic of attitudes is provided.
      *   *Q2: Move (3) Compositionality Demand.* Is it fair? Yes, because language is productive. If 'wrong' means X in 'Stealing is wrong' and Y in 'If stealing is wrong...', we don't have a semantics. Expressivists *need* compositionality to explain productivity, even if they reject truth-conditions. Marta isn't begging the question; she's demanding a semantics.
      *   *Q3: Negation vs. Conditional.* Are they distinct? Schroeder argues they are distinct challenges. The conditional problem is about embedding; the negation problem is about the *type* of inconsistency (A-type vs. B-type). Negation is often considered harder because it targets the core expressive function directly.

  5.  **Identify Missing Moves:**

      *   *Global Expressivism / Expressive-Representationalism:* (e.g., Chrisman, Kappel). Maybe the dichotomy between "representing facts" and "expressing attitudes" is false.
      *   *Inferential Role Semantics:* (e.g., Brandom). Meaning is use/inference, not truth conditions. This bypasses the need for truth-conditional compositionality.
      *   *Ecumenical Expressivism:* (e.g., Ridge). More sophisticated hybrid view that avoids the dilemma in (6).

  6.  **Determine the Overall Winner:**

      *   Marta represents the standard realist/cognitivist critique. She wins on technical precision regarding semantics and logic.
      *   Jonas represents the evolving expressivist defense. He wins on capturing the *function* of moral language, but loses on the formal semantic implementation.
      *   *Verdict:* Marta is technically more correct on the semantic constraints, but Jonas is right that the project isn't dead, just difficult. However, in a debate about *solving* Frege-Geach, the critic usually holds the advantage until a formal system is produced. I will lean slightly toward Marta on the specific technical points, but acknowledge Jonas's strategic retreats are the current state of the art. Actually, to be balanced: Marta wins the debate on *logic/semantics*, Jonas wins on *philosophical motivation*. But the prompt asks who is "more right overall" regarding the adjudication of the moves. Marta's objections are the standard "unsolved" problems. Jonas's answers are the standard "work in progress" replies. I should declare it a technical win for Marta, but note that Jonas's position is the live research program.

      *Refinement:* Let's look closer. Jonas's move (7) is essentially Gibbard's *Thinking How to Live*. Marta's dismissal in (7) is a bit harsh; it *is* a live program. But Jonas's move (2) is widely considered insufficient by itself (Schroeder's critique). Marta's move (6) on hybrids is a very strong objection (the "semantically idle" objection). I think Marta comes out ahead on the *logic*, which is what Frege-Geach is about.

  7.  **Drafting the Response (incorporating PhD level nuance):**

      *   Use terminology like "compositionality," "truth-conditions," "quasi-realism," "A-type/B-type inconsistency," "semantic value."
      *   Ensure the tone is adjudicatory, not just summarizing.
      *   Check the specific constraints: "brief justification" for each move.
      *   Make sure to answer the three specific questions explicitly.

      *(Self-Correction during drafting)*: On Move (4), Jonas suggests "being for not-blaming." This is Gibbard's norm-expressivism. Marta says this reintroduces representational machinery. This is the "collapse" objection. Most metaethicists agree this is the hardest hurdle for pure expressivism. I should side with Marta here but note that Gibbard accepts a form of "representationalism of norms."
      On Move (6), Ridge's Ecumenical Expressivism tries to solve this by making the attitude part of the truth-condition in a specific way. Marta's dilemma is strong but perhaps too sharp. I will call it "Mostly Right."

      *Final check on the "Missing Move":* Inferential Role Semantics (IRS) is the best candidate. It dissolves the need for truth-conditional compositionality. Also, the distinction between *semantic content* and *assertoric content*.

  8.  **Final Polish:** Check against the prompt's request for "careful, point-by-point adjudication." Ensure the three specific questions are highlighted.

      *Structure:*
      1. Introduction.
      2. Point-by-Point Adjudication (1-7).
