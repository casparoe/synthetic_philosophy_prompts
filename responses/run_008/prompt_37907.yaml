      *(Final thought on Move 2)*: Does Blackburn explain validity? He explains why it's *irrational* to deny the conclusion. He defines validity in terms of attitude consistency. So technically he *does* explain validity *on his terms*. Marta's objection is that his terms don't match the standard notion of validity (truth-preservation). So Jonas is right internally, Marta is right externally. I will characterize this as a "verbal dispute" risk.

      *(Final thought on Move 3)*: Is compositionality fair? Yes, because of productivity. Even if you reject truth conditions, you need a function from parts to whole. Blackburn's early account failed this. Schroeder proved it. Marta is right.

      *(Final thought on Move 4)*: Negation vs Conditional. Schroeder distinguishes them. The conditional problem is about embedding. The negation problem is about the *nature* of the inconsistency. If I say "It's not wrong," am I expressing an attitude? If yes, which one? If no, how does it contradict "It is wrong"? This is distinct. Marta is right they are distinct challenges.

