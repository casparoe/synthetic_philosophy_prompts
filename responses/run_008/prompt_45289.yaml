  1.  **Analyze the Request:**
      *   **Context:** Governance committee of a professional society setting up a 15-member forecasting panel (Yes/No votes, majority rule).
      *   **Problem:** A colleague is relying heavily on the Condorcet Jury Theorem (CJT) to justify the setup, dismissing assumption worries as pedantry.
      *   **Task:** Evaluate the substantive assumptions of CJT.
      *   **Specific Assumptions to Cover:** Competence > 0.5, Independence (conditional on truth), Sincerity, Single Common Proposition (Truth Value), Homogeneity of Competence. (Plus add any others).
