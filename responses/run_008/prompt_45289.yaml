          *   Provide a "settled vs. contested" section.
          *   Provide a "bottom line" paragraph.

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Core Claim:* If voters vote independently, sincerely, on a binary truth, with competence $p > 0.5$, then as $n \to \infty$, $P(\text{Majority Correct}) \to 1$.
      *   *Small $n$ nuance:* For finite $n$, the probability increases with $n$, but the asymptotic guarantee doesn't kick in. With $n=15$, the gain over a single expert is modest unless $p$ is significantly above 0.5 and independence holds.
      *   *Assumptions to Evaluate:*
          1.  **Competence ($p > 0.5$):** Essential. If $p < 0.5$, majority rule gets worse as $n$ grows (converges to 0). If $p = 0.5$, no gain.
          2.  **Independence:** Crucial. Correlated errors destroy the $1/\sqrt{n}$ reduction in error. If correlation is high, effective $n$ is much smaller.
          3.  **Sincerity:** Voters must vote their private signal/belief. Strategic voting can break the aggregation.
          4.  **Binary Truth (Ontology):** There must be a fact of the matter. If the question is normative or undefined, "correctness" is meaningless.
          5.  **Homogeneity:** Classic CJT assumes identical $p$. Heterogeneous $p$ is manageable (weighted voting often better), but simple majority still works if average $p > 0.5$ and independence holds.
          6.  **Added:** *Common Signal/Information Structure.* (Related to independence). *Deliberation Effects.* (Impacts independence and sincerity).

