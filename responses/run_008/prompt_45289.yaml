          *   *Correctability:* Secret ballots, independent work *before* discussion. Deliberation *after* voting or structured dialectics.
          *   *Tier:* Highest threat for expert panels.

      *   **Sincerity:**
          *   *Load-bearing:* High. Strategic voting (e.g., waiting for others to decide) breaks information aggregation.
          *   *Realism:* Career incentives to conform might reduce sincerity (herding).
          *   *Correctability:* Secret ballots, anonymity.
          *   *Tier:* Medium-High.

      *   **Binary Truth:**
          *   *Load-bearing:* Foundational. No truth = no "correct" majority.
          *   *Realism:* Technical questions usually have truth values, but might be probabilistic or model-dependent.
