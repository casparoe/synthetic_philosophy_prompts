answer: |-
  This is a classic dilemma for students encountering Dewey for the first time. The podcast you listened to gave you what philosophers call a "vulgar pragmatism" reading—it takes Dewey's metaphors literally and strips away the ethical framework that holds them together. Your professor is pointing you toward the more robust, scholarly interpretation.

  The podcast isn't entirely wrong about the *mechanics* of Dewey's view, but it is deeply misleading about the *ethics* and the *epistemology* (the theory of knowledge). It conflates "what works for power" with "what resolves a problematic situation intelligently."

  Here is a bit-by-bit breakdown of the podcast's claims, categorized by how a Deweyan scholar would evaluate them.

  ### 1. The Scientific Metaphor
  **Podcast Claim:** *Dewey applied scientific inquiry to politics; democracy is a laboratory; policy is an experiment.*
  **Verdict:** **Accurate, but incomplete.**

  A Dewey scholar would agree with this as a starting point. Dewey was obsessed with the method of intelligence. He believed that the same logical structure we use in science (identify a problem, hypothesize a solution, test it, observe consequences) should be used in social and political life.

  **Where the podcast simplifies:** It implies this is a technocratic process run by experts. For Dewey, the "laboratory" is the public sphere itself. The "experiment" isn't just passing a law; it's the social interaction that follows. The podcast misses the crucial requirement that for an experiment to be valid in Dewey's sense, it requires *free and full communication*. You can't have a valid social experiment if people are silenced, because then you aren't getting accurate data on the consequences.

  ### 2. Rejecting Fixed Principles
  **Podcast Claim:** *Pragmatists reject fixed, a priori principles; no point arguing whether a policy is right in principle.*
  **Verdict:** **Mostly Accurate.**

  Dewey did reject "a priori" principles—meaning moral rules handed down from God, Nature, or Pure Reason that never change (e.g., "Liberty is an absolute right regardless of context"). He thought these were useless when real conflicts arose.

  **Where the podcast simplifies:** The podcast suggests Dewey throws out principles entirely. He doesn't. He treats principles as **tools** rather than **commands**. A principle like "free speech" isn't a sacred commandment; it's a generalization based on past experience that free speech usually leads to better social problem-solving. You still argue about principles, but you argue about their *utility* in guiding inquiry, not their divine origin.

  ### 3. "True" Means "Successful"
  **Podcast Claim:** *"True" in politics just means "successful."*
  **Verdict:** **Genuine Misrepresentation.**

  This is the most damaging simplification. It reduces Dewey to a crude opportunist. If a dictator suppresses dissent and the economy booms, the podcast's version of Dewey has to call that "true."

  **The Deweyan Correction:** Dewey does not define truth as "whatever gets the result I want." He defines it closer to **"warranted assertibility."** A claim is "true" (or warranted) if it is the result of a rigorous process of inquiry that resolves a problematic situation *without creating worse problems down the line.*

  Success isn't just "order" or "wealth." For Dewey, the ultimate metric of success is **growth**. Does this policy allow individuals and the community to develop their capacities for further experience and inquiry? If a policy "works" by stifling human potential (even if it creates economic stability), it is not a "successful" experiment in the Deweyan sense because it cuts off the possibility of future growth.

  ### 4. The Definition of Publics
  **Podcast Claim:** *Publics are nothing more than the set of voters affected by a policy's consequences.*
  **Verdict:** **Accurate.**

  This is a fair summary of Dewey's definition in *The Public and Its Problems*. He defines the public as those indirectly affected by the consequences of a transaction to such an extent that it is deemed necessary to have those consequences systematically cared for.

  **Where the podcast simplifies:** It assumes that because the public is *defined* by consequences, the public's *current opinion* is infallible. Dewey actually thought the "Great Society" (industrial capitalism) had failed to become a "Great Community." He thought the actual public was often confused, manipulated, and unable to identify its own interests. Just because a majority votes for something doesn't mean they have successfully identified the consequences.

  ### 5. Reduction to Majoritarianism
  **Podcast Claim:** *His system reduces to majoritarianism: whatever the affected majority decides counts as the right answer.*
  **Verdict:** **Genuine Misrepresentation.**

  This is where the podcast confuses **democracy as a mechanism** with **democracy as a moral ideal.**

  For Dewey, voting is just the least bad way to register a decision; it is not the source of truth. Democracy is primarily a "way of life" characterized by associated living and shared communication. If a majority votes to suppress a minority, Dewey would not call this "right" simply because it was the majority will. He would call it a **failure of inquiry.**

  Why? Because democracy, for Dewey, is the political method required for social intelligence to function. Suppressing a minority cuts off data and perspectives needed for the "experiment" to work. Therefore, a majoritarian decision that violates the conditions of democracy is self-defeating. It's not "right"; it's a botched experiment.

  ### 6. The Slavery Example (The Relativism Charge)
  **Podcast Claim:** *Dewey cannot say slavery was wrong at the time; he can only say in hindsight that the experiment failed.*
  **Verdict:** **Genuine Misrepresentation.**

  This is the strongest test of the theory, and the podcast fails it. The podcaster assumes that because Dewey rejects *external* standards (God/Nature), he has *no* standards. But Dewey has an internal standard: **Human Flourishing (Growth).**

  Here is how a Deweyan defends the condemnation of slavery without being a relativist:
  1.  **Slavery stunts growth:** It prevents the enslaved person from developing their capacities. Since "growth" is the only moral end Dewey recognizes, slavery is objectively immoral because it destroys the possibility of moral ends for a class of people.
  2.  **Slavery destroys inquiry:** A slave society relies on force and dogma, not free communication and intelligence. It makes social problem-solving impossible because it ignores the consequences felt by the enslaved.
  3.  **Context doesn't mean "anything goes":** Dewey is a **contextualist**, not a **relativist.** He admits that moral judgments depend on the situation, but he insists that within any situation, there are objective facts about what promotes human association and what destroys it.

  So, Dewey *can* say slavery was wrong in 1850. He doesn't need to wait for the Civil War to prove it "failed." He can say it was wrong in 1850 because it violated the conditions necessary for human growth and social intelligence *at that time.* It wasn't a "failed experiment" like a new drug that turns out to have side effects; it was a corruption of the experimental method itself.

  ### Summary: Podcast vs. Professor

  *   **The Podcast** treats Dewey like a **technocratic utilitarian.** It assumes "consequences" are easy to measure (like GDP or election wins) and that "truth" is whatever the winner says it is. This makes Dewey look naive and morally hollow.
  *   **The Professor** is treating Dewey like a **democratic ethicist.** She understands that for Dewey, "consequences" include the impact on human character and the capacity for future communication. "Truth" isn't just winning; it's arriving at a solution through a process that respects the intelligence of all participants.

  **The Bottom Line:**
  The podcast conflated two claims Dewey kept apart:
  1.  **Methodological Claim:** We should test policies by looking at consequences. (The podcast got this right).
  2.  **Ethical Claim:** The *value* of those consequences is judged by whether they promote human growth and the conditions of further inquiry. (The podcast ignored this).

  Without the second claim, Dewey is indeed a relativist. With the second claim, he has a robust, albeit non-religious, moral framework. Your professor is steering you toward the second claim. The podcast gave you the "CliffsNotes" version that misses the soul of the philosophy.
