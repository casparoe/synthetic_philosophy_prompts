      *   *Claim 4 ("True" = "Successful"):* Simplification/Conflation. This is the classic "pragmatic theory of truth" caricature. For Dewey, "warranted assertibility" is better. It's not just "what works for me now," but "what resolves the problem situation intelligently."
      *   *Claim 5 (Publics = Affected):* Accurate to *The Public and Its Problems*.
