answer: |-
  You have independently reconstructed one of the most famous problems in twentieth-century philosophy. The puzzle you and Dara argued over is known as **Goodman's New Riddle of Induction**, and the specific predicate you invented ("remgold") is isomorphic to the predicate **Grue**.

  The established concept for the gap you identified—the property that distinguishes "gold" from "remgold," or "green" from "grue"—is **Projectibility**.

  ### The Standard Treatment
  The problem was introduced by Nelson Goodman in his 1955 book *Fact, Fiction, and Forecast*. Goodman defined a predicate as **projectible** if its past instances confirm its future instances. Your intuition that "gold" is projectible and "remgold" is not is exactly the distinction Goodman sought to analyze.

  Goodman's own solution relies on a concept he called **Entrenchment**. He argued that the difference does not lie in the logic of the predicates (both "gold" and "remgold" fit the data equally well) nor in the syntax (both are short words). Instead, the difference is historical and pragmatic. "Gold" (and "green") is entrenched because it has a long history of successful use in inductive projections within our linguistic community. "Remgold" (and "grue") is unentrenched because it is a newly constructed predicate with no history of successful projection.

  To address your discomfort about the "timing of coinage": Goodman's theory is not merely that the *word* is old, but that the *category* has a biography of successful inductive use. We are entitled to project "gold" because doing so has worked before; we are not entitled to project "remgold" because it is a gerrymandered category defined by a specific time or condition that breaks the continuity of past inductive practices.

  ### Boundaries and Variants
  You asked whether the standard notion covers your variants exactly. It does. The literature on projectibility explicitly handles:
  1.  **Time-dependent predicates:** This is the core of the "Grue" paradox (green before time $t$, blue after). Your "remgold" (gold before 2030, lead after) is a textbook instance.
  2.  **Positional predicates:** Predicates that reference specific locations or observers (e.g., "observed by Dara") are generally considered non-projectible for the same reason as time-dependent ones; they lack entrenchment and introduce irrelevant positional information.
  3.  **Disjunctive predicates:** "Grue" is often defined disjunctively (green and observed before $t$, OR blue and not observed before $t$). Goodman's analysis treats these as non-projectible unless the disjunction itself is entrenched (which is rare).

  ### Competing Explanations
  While Goodman's **Entrenchment** is the standard nominalist treatment, other philosophers have proposed different boundaries for **Projectibility** to avoid relying solely on linguistic history:
  *   **Natural Kinds (Quine):** W.V.O. Quine argued that projectible predicates are those that carve nature at its joints. "Gold" refers to a natural kind with an underlying microstructure; "remgold" is an artificial class that does not correspond to a causal structure in the world.
  *   **Bayesian Approaches:** Some modern treatments argue that we assign a much higher prior probability to "gold" than "remgold" based on background knowledge about chemical stability, effectively bypassing the need for a logical distinction between the predicates themselves.

  ### Conclusion
