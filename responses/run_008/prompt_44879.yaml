  ***

  **The Walkthrough**

  **The Technological Determinist (Winner Sense-1)**
  A hard determinist would look at the LPR system and argue it *requires* a regime of automated exclusion. They'd say the machine's logic is binary—read or don't read—and that this technical necessity forces a specific social order where access is strictly rationed by algorithm. This case breaks that reading immediately because Garage A exists. The exact same machine sits in Garage A, but the social order there is flexible, mediated by human judgment. The technology didn't *demand* the rigid exclusion seen in Garage B; the machine is perfectly compatible with a human override. If the tech itself demanded the politics, both garages would look like Garage B.

  **The Social Constructivist**
  A constructivist will feel right at home here. They'll argue the politics aren't in the LPR but in the social arrangements surrounding it—the staffing decisions, the union rules, the management protocols. They'd say the artifact is a blank slate onto which local labor practices are projected. But here's where you push back: don't let them get *too* comfortable. The constructivist might imply that the politics are *only* social, as if the material setup doesn't matter. But in Garage B, the *absence* of a body is a physical constraint, not just a social meaning. You can't negotiate with a closed gate from twenty minutes away. The material reality of the unstaffed site limits the social construction. The politics aren't just interpreted; they are mechanically enforced by the distance.

  **The Single Variable**
  The variable doing all the work is **local discretionary capacity**. It's not just "staffing" as a budget line; it's the physical presence of an agent authorized to break the protocol. In Garage A, the protocol (read plate → open gate) has a local exception handler. In Garage B, the protocol is closed-loop. That's the isolatable feature. If you delete it—meaning, if you put an attendant in Garage B or remove the one from Garage A—the political disparity vanishes. Either both sites allow for equitable exception (inert/administrative), or both enforce rigid exclusion (political/coercive). The politics tracks the discretion, not the sensor.

  **The Winner Defender's Counterattack**
  A Winner defender will try to save the "artifacts have politics" thesis by expanding the boundary of what counts as the artifact. They'll argue you're defining the "technology" too narrowly. The artifact isn't just the LPR camera; it's the *sociotechnical system* comprising the camera, the gate, the helpdesk, and the staffing protocol. If you define the system that way, then Garage B's system *does* inherently have politics built into its design. They'll say the "unstaffed" nature is part of the technical specification of the deployment.

  **Is the Move Available?**
  It's available, but it's costly. If you accept that "staffing levels" are part of the technical artifact, then *everything* becomes part of the artifact. The distinction between "tool" and "context" collapses. This case blocks the move by highlighting the *interchangeability* of the hardware. Since the hardware is identical, calling the staffing part of the "artifact" feels like moving the goalposts to save the theory. It forces the defender to admit that "artifact" is a porous category we draw for convenience, not a natural kind.

  **What's Being Tested**
  This case is testing whether "having politics" is an intrinsic property of the thing or a relational property of the arrangement it lands in. It doesn't decide the question definitively—because the Winner defender can always redraw the boundary—but it dramatizes the cost of deciding. If you say the politics are in the arrangement (my reading), you save the idea that technology is neutral-ish, but you risk ignoring how material constraints limit social choice. If you say the politics are in the system (Winner's move), you capture the reality of the coercion, but you make "technology" so broad it loses analytical bite. The case suggests "having politics" is probably a property of the arrangement, but one that solidifies into the thing once the arrangement becomes permanent.
