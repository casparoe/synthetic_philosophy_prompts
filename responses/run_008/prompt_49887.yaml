      *   **Where it Cheats (The Misses):**
          *   The Ending (Preference Change): Game theory says you can't just opt out. Seuss suggests enlightenment solves structural problems.
          *   Bankruptcy as a Stopper: Real traps eat more than money (time, health, liberty).
          *   *Scene:* The final beach party.
      *   **McBean: Moloch or Parasite?**
          *   Argument: He's the Parasite/Arms Dealer. Moloch is the *fear of exclusion*. McBean sells the solution to the fear Moloch creates.
      *   **The Positional Good Insight:**
          *   Is recognizing it enough? Only if it becomes a shared norm. Seuss argues for a cultural shift.
