answer: |-
  You have identified a genuine lacuna in the literature. While the constituent parts of your configuration are well-discussed in isolation, their intersection—specifically the ethical consequences of the *description-relativity* of computation—is not captured by a single established term.

  You are correct that **Multiple Realizability** is the inverse of your problem. You are also correct that the **"Triviality Results"** (or the "Implementation Problem") are the adjacent metaphysical literature, but they generally conclude in skepticism rather than offering a graded criterion for moral weight.

  Below, I will map the nearest existing concepts, explain why they fail to capture your specific configuration, and then coin a term for the problem you have isolated. Finally, I will analyze your "robustness" intuition using tools from the philosophy of science (specifically robustness analysis and renormalization) to determine if it is a genuine solution or a pragmatic disguise.

  ### 1. The Metaphysical Neighborhood: Why Existing Terms Fail

  There are three concepts that encircle your problem but none that land on it.

  **A. The Triviality Results (Putnam/Searle)**
  *   **What it is:** The argument that for any open physical system and any finite state automaton, there exists a mapping such that the system implements the automaton (Putnam, *Representation and Reality*, 1988). Searle's "wall implements WordStar" argument is the popular version.
  *   **Why it fails you:** This literature is primarily *destructive*. It aims to show that computation cannot be the sole basis for mind or meaning because it is too easy to find. It concludes that computation must be constrained by *syntax* or *causality* external to the mapping. It does not offer a *graded* ontology (where some implementations are "more real" than others) and it rarely addresses moral status. It treats the indeterminacy as a bug to be eliminated, not a feature to be measured.

  **B. Computational Interpretivism (Dewhurst, Millhouse)**
  *   **What it is:** The view that computational ascriptions are not objective facts about the world but are relative to an interpreter's interests or explanatory goals.
  *   **Why it fails you:** This captures your metaphysical premise (computation is description-relative). However, in the literature, this usually leads to **Computational Anti-Realism**. If computation is interpretive, then moral status based on computation becomes **Moral Projectivism** (we project value onto the system). The literature stops there. It does not explore whether the *stability* of the interpretation across different interpreters (or coarsenings) could restore a form of objectivity sufficient for moral realism.

  **C. The Mechanistic Account (Piccinini)**
  *   **What it is:** Gualtiero Piccinini argues that computation is real only when it plays a functional role in a *mechanism* (a physical system organized to perform a function).
  *   **Why it fails you:** This attempts to solve the Triviality Result by grounding computation in *causal function*. However, it assumes the "mechanism" is objectively delineated. Your insight is that the delineation of the mechanism *itself* depends on the choice of variables and grain. Piccinini's account lacks the **Renormalization** perspective you are bringing: it doesn't account for the *width* of the descriptive family under which the mechanism survives.

  ### 2. The Ethical Gap

  In ethics, the closest discussion occurs under **Simulation Ethics** (e.g., Bostrom, Preston & Bishop) or **Digital Moral Status**. However, these discussions typically assume a "clean" implementation: *If* the simulation is perfect, *then* it has status. They rarely interrogate the *if*.

  Your configuration exposes a **Supervenience Failure**. Standard moral realism requires that moral facts supervene on natural facts. If the natural fact ("this system computes X") is indeterminate until an observer chooses a grain, then the moral fact ("this system deserves protection") also becomes indeterminate relative to that choice.

  There is no standard term for **"Moral status contingent on descriptive grain."**

  ### 3. Coining the Term: "The Normative Grain Problem"

  Since no established term covers the intersection of metaphysical indeterminacy, robustness, and moral attribution, I propose we label this configuration **The Normative Grain Problem**.

  **Definition:** The Normative Grain Problem arises when:
  1.  A property $P$ (e.g., computation, consciousness) is required for moral status $M$.
  2.  $P$ is not intrinsic to the physical substrate but is relative to a descriptive mapping (grain, variables, resolution).
  3.  There is no physical principle uniquely privileging one mapping over another.
  4.  Therefore, $M$ appears to vary arbitrarily with the observer's descriptive choices.

  **Boundary Cases:**
  *   *Not the Normative Grain Problem:* A brain in a vat. The biological grain is fixed by evolutionary history and biochemical constraints. The mapping is privileged by the causal structure of the neurons.
  *   *Not the Normative Grain Problem:* A rock. No reasonable coarsening yields a complex computation.
  *   *Is the Normative Grain Problem:* A fluid dynamical system (e.g., a turbulent flow) that *could* be interpreted as a neural network under a specific, contrived coordinate transformation, but looks like noise under standard thermodynamic variables. Does it have moral status? Your problem says: "Only if the neural pattern survives the thermodynamic coarsening."

  ### 4. Analyzing Your "Robustness" Criterion

  You suspect that the **"width of the family of admissible descriptions"** (robustness under coarsening) is the criterion for reality and moral weight. You ask: *Is this a genuine criterion or just smuggling our interests back in?*

  This is the strongest part of your intuition. It aligns with a specific, respected lineage in the philosophy of science, though it has not been applied to ethics in this way.

  **A. Wimsattian Robustness**
  William Wimsatt (*Re-Engineering Philosophy for Limited Beings*) argues that **robustness** is the primary marker of reality in science. If a phenomenon can be detected via multiple independent methods of measurement or derivation, it is likely real.
  *   *Application:* You are proposing **Descriptive Robustness**. If a computation exists across a wide family of variable choices (coarsenings), it is "more real" than one that exists only under a single, fine-tuned mapping.
  *   *Verdict:* This is not smuggling; it is a standard epistemic criterion for ontology. However, it shifts the problem: *What defines the "admissible" family?*

  **B. Renormalization Group (RG) Invariance**
  As a physicist, you know that RG flow identifies **Fixed Points**. These are descriptions that remain stable under coarse-graining. In physics, we privilege these because they correspond to **Universality Classes**.
  *   *The Physical Privilege:* You wrote: *"Nothing in the underlying equations privileged one reading."* This is technically true for Hamiltonian mechanics, but false for **Effective Field Theories**. The physics *does* privilege grains where the degrees of freedom decouple or where correlation lengths diverge.
  *   *The Criterion:* A computation is ontologically robust if it corresponds to a **Computational Fixed Point** under renormalization. If the algorithmic structure persists as you integrate out high-frequency degrees of freedom, it is causally potent. If it vanishes under slight coarsening, it is an artifact (epiphenomenal).
  *   *Verdict:* This validates your intuition. Robustness under coarsening is a proxy for **Causal Power**.

  **C. The "Smuggling" Charge**
  Is this just smuggling interests?
  *   **Yes:** The choice of *which* coarsenings count as "admissible" is pragmatic. We care about variables that conserve energy, momentum, or information. A demon who cared about different invariants might see different "robust" computations.
  *   **No (but):** If "interests" are defined as **"any physically possible observer embedded in the universe,"** then the intersection of their admissible descriptions converges on the RG fixed points. This is **Peircean Objectivity** (truth as the final opinion of the community of inquirers).
  *   **Conclusion:** It is not arbitrary smuggling; it is **Pragmatic Realism**. The moral weight tracks the *causal stability* of the computation. A computation that vanishes under slight perturbation cannot sustain the causal chains required for moral patienthood (e.g., suffering requires causal persistence).

  ### 5. Proposed Solution: "Computational Invariantism"

  To resolve the Normative Grain Problem, I suggest adopting a stance I will call **Computational Invariantism**.

  **Definition:** Moral status attaches not to the computation *simpliciter*, but to the **Invariant Computational Structure** under the group of physically natural transformations (coarsenings, variable changes).

  **How it solves the arbitrariness:**
  1.  **Filters Triviality:** The "wall implements WordStar" mapping fails Invariantism because the mapping is not stable under coarse-graining. Change the temperature of the wall slightly, or shift the coordinate system, and the "computation" disappears.
  2.  **Grounds Moral Weight:** Moral weight scales with the **Depth of Invariance**. A human brain's computational structure is invariant across massive changes in microscopic state (neuron replacement, thermal noise). A contrived simulation in a gas cloud might only be invariant under exact microstate tracking. The former has higher moral weight because its existence is less contingent on our specific descriptive choice.
  3.  **Avoids Smuggling:** The "group of transformations" is not defined by human whim, but by **Physical Symmetries** (gauge invariance, Lorentz invariance, RG flow).

  ### 6. Summary and Recommendation

  You have not found a term because the literature is siloed. Metaphysicians argue about whether computation is real (Triviality Results). Ethicists argue about whether simulations matter (Simulation Ethics). Neither group has fully integrated the **Renormalization/Robustness** insight from physics to solve the boundary problem.

  **Your configuration is:** The **Normative Grain Problem**.
  **Your proposed solution is:** A form of **Computational Invariantism** based on **Descriptive Robustness**.

  **Is the robustness criterion genuine?**
  Yes, provided you anchor "admissible descriptions" to **physical symmetries** rather than human interests. If a pattern survives the renormalization flow, it has causal efficacy independent of the observer. If moral status tracks causal efficacy (the ability to suffer, to persist, to act), then moral status tracks robustness.

  **Where to look next:**
  1.  **Robert Batterman, *The Devil in the Details*:** On asymptotic reasoning and why higher-level descriptions are sometimes *more* real than lower-level ones.
  2.  **William Wimsatt, *Re-Engineering Philosophy for Limited Beings*:** On robustness as a criterion for reality.
  3.  **David Chalmers, "A Computational Foundation for the Study of Cognition":** Specifically the section on implementation constraints.
  4.  **James Ladyman & Don Ross, *Every Thing Must Go*:** On Structural Realism, which argues that structure (invariants) is all that is real.

  You are effectively proposing a **Structural Realist Ethics of Computation**. It is a novel and defensible position.
