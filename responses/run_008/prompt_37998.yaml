      *   This aligns with (2) HD (The mechanism of preference change).
      *   This aligns with (4) Construction (Preferences are constructed at each time point).
      *   *Yes.* Revising (1) to accept that akrasia *is* a form of preference reversal (specifically, a violation of diachronic consistency) resolves almost everything.
      *   The only thing it costs is the Socratic idea that you *never* change your mind about the good. But the user already accepts HD, which *is* changing your mind about the good (valuation).
      *   So (1) is the outlier.

      *   *Final check:* Does this still count as "Weakness of Will"?
      *   Yes, it's the standard economic/philosophical hybrid view (e.g., Elster, Thaler, maybe Holton). It's weakness of will understood as time inconsistency.
      *   Okay, ready to write.

