  **Audit of Philosophical Commitments: Weakness of Will Package**

  **To:** Graduate Seminar Student
  **From:** Philosophical Consultant
  **Re:** Consistency Audit of Seven Commitments on Akrasia

  Your friend is correct: the package is currently unstable. You are attempting to synthesize a traditional, normative conception of agency (Commitments 1, 3, 7) with a revisionist, mechanistic conception of the self (Commitments 2, 4, 5, 6). The result is what your friend identifies as simultaneous deflation and inflation. You are explaining the behavior away as a mechanical glitch or bargaining outcome (deflation) while insisting on treating it as a robust moral failure of a unified agent (inflation).

  Below is the audit of tensions, ranked by severity, followed by the recommended revision.

  ### 1. The Tensions (Ranked by Severity)

  **Tension #1: The Definition vs. The Mechanism (Commitments 1 & 2)**
  *   **The Conflict:** Commitment (1) defines akrasia as acting against a better judgment that *stands unclouded*, explicitly distinguishing it from "preference change." Commitment (2) adopts Hyperbolic Discounting (HD) as the explanatory mechanism, which *is* a model of preference reversal over time.
  *   **Why it's Critical:** If HD is the *best account* of the phenomenon, then the agent *does* change their valuation between the distant and imminent perspective. By insisting in (1) that this is *not* preference change, you are contradicting your own explanatory model. You cannot claim the judgment stands "unclouded" if the valuation curve mechanically shifts due to proximity.
  *   **Severity:** **Fatal.** This makes your definition incompatible with your explanation.

  **Tension #2: Rational Failure vs. Local Optimality (Commitments 1 & 5)**
  *   **The Conflict:** Commitment (1) classifies akrasia as a "failure internal to practical rationality." Commitment (5) describes the akratic choice as "locally optimal for the self that makes it."
  *   **Why it's Critical:** If the choice is locally optimal (given the discount curve and the local self's interests), in what sense is it a failure of *rationality*? It may be a failure of *loyalty* to the global self, or a failure of *consistency*, but calling it a rational failure while conceding local optimality creates a normative schizophrenia. It suggests the agent is simultaneously rational (locally) and irrational (globally) without a clear hierarchy of authority.
  *   **Severity:** **High.** This undermines the normative force of your essay.

  **Tension #3: Fragmented Selves vs. Full Responsibility (Commitments 5 & 7)**
  *   **The Conflict:** Commitment (5) models the person as a "succession of temporally located selves." Commitment (7) assigns "full responsibility" to the agent.
  *   **Why it's Critical:** Multiple-selves models are typically used to *mitigate* responsibility (e.g., "the tempted self hijacked the planning self"). If you fragment the agent into bargaining parties, it becomes difficult to justify why the *temporal aggregate* is fully blameworthy for the *local slice's* optimal move. Commitment (7) requires a level of agency unity that (5) explicitly denies.
  *   **Severity:** **Medium-High.** This is manageable with a specific theory of attribution, but it requires work you haven't outlined.

  **Apparent Tensions (Lower Severity)**
  *   **(3) vs. (6):** Exponential discounting is rational (3) vs. Sophisticated planning around hyperbolic impulses is rational (6). This is a standard "second-best" problem in economics. It is resolvable by distinguishing *ideal* rationality from *constrained* rationality.
  *   **(1) vs. (4):** Stable Better Judgment (1) vs. Preference Construction (4). This is serious, but less so than #1. You can argue the "Better Judgment" is a constructed plan that remains stable *until* the elicitation context shifts (temptation).

  ### 2. Diagnosis: The "Deflating and Inflating" Problem

  Your friend's objection is precise.
  *   **You Deflate** the agent by accepting (2), (4), and (5). The agent is a construction of shifting preferences, fragmented into temporal selves, driven by mechanical discounting curves.
  *   **You Inflate** the agent by accepting (1), (3), and (7). The agent is a unified locus of rationality, capable of failing a robust normative standard, and worthy of full blame.

  You cannot have it both ways. If the agent is merely a succession of selves optimizing locally (5), the "failure" is just a conflict of interest, not a rational defect. If the agent is a unified rational authority (1), the "multiple selves" model is merely metaphorical, not ontological.

  ### 3. The Single Revision

  To clean up the package with the least collateral damage, you should **revise Commitment (1).**

  **The Revision:**
  Drop the claim that akrasia is *distinct from preference change* and the claim that the better judgment stands *unclouded*. Instead, define akrasia as **a failure of diachronic consistency caused by predictable preference reversal.**

  **Why this works:**
  1.  **Aligns with (2):** It admits that Hyperbolic Discounting *is* a form of preference change. You no longer have to argue that the agent's valuation didn't change; you argue that the *change itself* is the irrationality.
  2.  **Resolves (5):** It allows the choice to be "locally optimal" (satisfying 5) while still being a "failure of rationality" from the global perspective (satisfying 1). The failure is not in the local calculation, but in the temporal coordination.
  3.  **Preserves (7):** You can maintain full responsibility. Even if preferences are constructed or reversed, the agent is responsible for failing to manage their known diachronic inconsistency (linking to 6).
  4.  **Preserves (3):** It keeps Exponential Discounting as the rational norm. The irrationality is the deviation from the exponential curve (the reversal), not a synchronic error.

  **The Cost:**
  You lose the Socratic/Aristotelian intuition that the akratic agent acts against a *static* knowledge of the good. You are moving from a "Judgment vs. Desire" model to a "Long-Term Self vs. Short-Term Self" model. This is a significant philosophical shift, but it is necessary to make the behavioral economics components (2, 4, 5, 6) cohere.

  ### 4. Final Verdict: Is it Still "Weakness of Will"?

  **Yes.**
  Revising (1) as suggested shifts your view from a classical moral psychology account to a **neo-Stoic / Behavioral Economic account of Will.**
  *   **Classical View:** Will is the capacity to act on reason despite desire.
  *   **Your Revised View:** Will is the capacity to maintain diachronic consistency despite predictable preference reversals.

  This is a recognized and robust position in contemporary literature (e.g., Richard Holton's *Willpower*, or the work of Jon Elster). It retains the core intuition that the agent *could have done otherwise* (via sophisticated planning or bundling) and *should have done otherwise* (by the light of their own long-term standards), which preserves the normative bite required for responsibility (7).

  **Recommendation:** Proceed with the essay, but explicitly frame the definition of akrasia in Commitment (1) as **diachronic inconsistency** rather than **synchronic contradiction.** This bridges the gap between your philosophical norms and your psychological mechanisms.
