answer: |-
  Dear Colleague

  Your observation regarding the inconsistent labeling conventions across the museum galleries touches upon a profound and often unspoken tension in public history, specifically concerning how institutions manage the boundary between memory, tradition, and empirical verification. The implicit epistemology governing these labels appears to rely less on a unified theory of historical truth and more on a hierarchy of evidence types that privileges contemporary documentary records over later material correlations, even when the former are demonstrably biased and the latter suggest physical reality. When the Pharaoh's campaigns are presented as flat fact based on monumental inscriptions, the museum is operating under a positivist assumption that proximity in time equates to historical validity, treating the inscription as a record of event rather than a performative act of power. Conversely, the Trojan War label reveals a different epistemic standard where archaeological strata are treated as corroborative but not constitutive of history, requiring a textual bridge that remains mythical. This suggests that the practice treats history not as a property of our epistemic position, which would acknowledge the uncertainty in both cases, but as an intrinsic status of the narrative that is unlocked only by specific keys, primarily contemporary texts. The inconsistency you note is therefore not merely curatorial caution but a structural feature of a discipline that still harbors a logocentric bias, where the written word of the elite actor grants ontological security to an event that the destruction layer of a city cannot provide on its own.

  The variation in handling the Exodus narrative compared to the Trojan War strongly supports your hypothesis regarding scale-sensitive priors, functioning as an implicit Bayesian update where the magnitude of the claim dictates the burden of proof. The epistemology here presupposes that historical events leave traces proportional to their scale, so the absence of evidence for a mass migration of hundreds of thousands is treated as evidence of absence, whereas the absence of specific evidence for a single commander like Arthur or a localized conflict like Troy is treated as mere silence. This indicates that the museum practice views history as a property of the narrative's coherence with the physical record's capacity to retain information. A large claim requires a large trace, and without it, the narrative is relegated to the status of a founding myth. However, this practice is underdetermined because rival epistemologies could license the exact same labels for different reasons. A social constructivist might argue that the Exodus is labeled as a founding narrative rather than a failed historical event to respect the living tradition and identity of a community, whereas the Pharaoh's campaigns are safe to assert as fact because the civilization is extinct and the claims carry no contemporary political weight. Thus, what looks like an evidentiary threshold may actually be a negotiation of social sensitivity, where the risk of offending a living faith community outweighs the epistemic desire for consistency.

  There is a significant incoherence in hedging the historicity of the Trojan War while asserting the Pharaoh's campaigns unhedged, given that the evidence for the latter is narrower and more biased. This inconsistency reveals that the implicit view is not strictly probabilistic but categorical, relying on genre classification rather than confidence intervals. The museum practice seems to presuppose that history is a genre of writing supported by archives, while myth is a genre of storytelling supported by tradition, regardless of the actual likelihood of the events described. If the museum were to replace this implicit view with a straightforwardly probabilistic one, expressing credences instead of using the myth, legend, and history vocabulary, the wall text would become significantly more cumbersome and potentially less informative for the casual visitor. A label stating that there is a sixty percent credence that a conflict occurred at Hisarlik versus a ninety percent credence that Kamose fought the Hyksos would require the visitor to understand not just the probability but the underlying model generating those numbers. The old trichotomy does something a credence cannot, which is to indicate the kind of access to the past each narrative claims to give us. Myth signals communal memory and identity formation, legend signals poetic tradition and moral exemplarity, and history signals documentary record and empirical reconstruction. These are not just measures of likelihood but modes of engagement, telling the visitor how to read the story rather than merely how likely it is to be true.

  Ultimately, the practice presupposes that history is a status conferred by the type of evidence available rather than the probability of the event's occurrence, leading to the contradictions you have identified. It treats the Pharaoh's propaganda as history because it fits the archival model, while treating the archaeological reality of Troy as myth because it lacks the textual certification of the Homeric epics. This is consistent only if one accepts that history is defined by the presence of contemporary written testimony, regardless of its truthfulness, whereas myth is defined by the absence of such testimony, regardless of archaeological support. To shift to a probabilistic model would require the museum to abandon the comfort of these categories and admit that all historical knowledge is graded, but it would also risk losing the communicative utility that the trichotomy provides in signaling the cultural function of the narrative. The current labels are thus not just epistemic judgments but pedagogical tools that categorize the relationship between the present and the past, distinguishing between what we remember, what we celebrate, and what we verify, even if the boundaries between those categories are far more porous than the wall text admits.

  Sincerely

  Your Consultant
