answer: |-
  **The Scenario**

  An employment tribunal convenes to adjudicate the unfair dismissal of a logistics coordinator terminated for "persistent" lateness, where the statutory protection against dismissal hinges on whether the employee's conduct met that specific threshold. The panel is presented with a chronological ledger of the employee's arrival times over a continuous two-hundred-day period and instructed to determine, for each day $n$, whether the cumulative record *up to that day* satisfies the condition that the lateness had become persistent. For the first forty days, the panel unanimously agrees the threshold was not met; from day one-hundred-forty onward, they unanimously agree it was met; but for the hundred days between, no amount of deliberation yields a justified finding that the condition obtained, nor a justified finding that it failed to obtain, leaving the status of those days essentially contestable despite the binary nature of the required verdict.

  **The Agreement on the Boundary**

  Both the epistemicist and the supervaluationist are committed to the truth of the boundary sentence: "There is a last day before which the lateness had not yet become persistent." For the epistemicist, this follows directly from the commitment to classical semantics and bivalence. On this view, vagueness is a form of ignorance; the predicate "persistent" has a precise extension in reality, even if speakers cannot identify it. Since the series begins with clear non-instances and ends with clear instances, and every day must be either an instance or not, there must be a specific day $n$ where the status flips from false to true. The boundary sentence merely reports this metaphysical fact.

  For the supervaluationist, the derivation is more intricate but leads to the same verdict. On this view, vagueness is semantic indecision: the meaning of "persistent" is not fixed to a single extension but is compatible with many "admissible precisifications," each of which draws a sharp line somewhere in the borderline zone. To evaluate a sentence, we check its truth across all admissible precisifications. In any single admissible precisification, the predicate behaves classically; it is a standard set with a definite boundary. Therefore, within *every* individual precisification, there is a specific day that serves as the last day of non-persistence. Since the boundary sentence ("there is a last day...") is true in every admissible precisification, it is "supertrue." Thus, the supervaluationist must affirm the existence of a sharp cutoff, not because there is a single metaphysically privileged line, but because every way of making the language precise requires one.

  **The Divergence on Higher-Order Status**

  While the views agree on the existence of a cutoff, they diverge on the semantic status of the borderline days themselves, specifically regarding the sentence: "The proposition that 'by day 97 the lateness had become persistent' is either true or false." The epistemicist affirms this sentence. Since they uphold bivalence, every declarative sentence expressing a proposition is either true or false, regardless of our ability to know which. For them, the tribunal's inability to justify a finding reflects an epistemic limitation, not a gap in the truth values available.

  The supervaluationist denies this sentence. For them, a sentence is true only if it is supertrue (true on all precisifications) and false only if it is superfalse (false on all precisifications). On day 97, some admissible precisifications classify the lateness as persistent, while others do not. Consequently, the atomic report is neither supertrue nor superfalse; it lacks a truth value. Therefore, the claim that the proposition is "either true or false" is false. This divergence is not merely a restatement of the gap but a disagreement over the Law of Bivalence itself: the epistemicist preserves bivalence at the cost of knowability, while the supervaluationist preserves the link between truth and justification at the cost of bivalence.

  **Closing Moves**

  **Diagnosis:** The structural feature driving the agreement on the boundary sentence is the interaction between classical validity within precisifications and the definition of supertruth. Supervaluationism preserves classical logic by defining truth as truth-in-all-precisifications. Since the existence of a boundary is a theorem of classical logic given the endpoints of the series, it holds in every precisification and thus emerges as supertrue. The divergence arises because the supervaluationist blocks the inference from "There is a boundary" to "There is a *knowable* or *definite* boundary." The quantifier ranges over days successfully, but the definiteness operator fails to latch onto any specific day because the location of the boundary shifts across precisifications.

  **Institutional Precisification:** If the employer's handbook explicitly defined "persistent" as "more than twelve late arrivals in any rolling ninety days," the thought experiment collapses into a standard factual inquiry. The predicate is no longer vague; the set of admissible precisifications shrinks to exactly one. Both the epistemicist and the supervaluationist would agree that there is a sharp boundary, and they would agree that it is located exactly where the definition places it. The dispute over vagueness vanishes because the semantic indecision has been resolved by stipulation, leaving only the empirical question of whether the employee's record satisfies the stipulated condition.

  **Supervaluationist Reply:** The supervaluationist's best reply to the charge that they have conceded the sharp boundary is to distinguish between the truth of a sentence and the existence of a corresponding fact. They argue that while the sentence "There is a sharp cutoff" is true, it is not made true by any specific fact of the matter regarding a particular day. Instead, it is made true by the global structure of semantic indecision: it is a consequence of the rules of the language that *some* line must be drawn, even if the rules do not determine *where*. Whether this reply is adequate depends on whether one accepts that a sentence can be true without a specific truthmaker. If truth requires a worldly correlate, the reply fails; if truth is understood as a feature of assertibility conditions within a linguistic practice, the reply successfully insulates the view from the charge of contradicting the intuition that no specific day is the boundary.
