      *Let's finalize the Defeaters.*
      1. Case: The Broken Car. Why: It loses capacity temporarily. Rank: Serious.
      2. Case: The Vague Capacity. Why: What counts as an ability? Rank: Fatal.
      3. Case: The Ephemeral Wave. Why: Waves exist but are temporary. Rank: Awkward.

