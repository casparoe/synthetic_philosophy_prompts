answer: |-
  First off, this is not dumb at all. You have independently reconstructed one of the most famous and heated debates in modern philosophy. The study you're talking about is by Joshua Knobe (2003), and the phenomenon is literally called **"The Knobe Effect"** (or the Side-Effect Effect).

  Your argument is **valid** (the conclusion follows from the premises), but most philosophers and cognitive scientists think it is **unsound** (some of the premises are false or misleading).

  Your friend is spot on: the trick is in **Step 2**. But to really dissolve the argument, you also need to look at **Step 5** and **Step 7**.

  Here is the breakdown, explained without jargon.

  ### 1. The Core Slide: Premise 2 (Concept vs. Application)
  Your friend hinted at this, and it's the most important philosophical distinction here. Step 2 says:
  > *If people's judgments flip... then their concept of intentionality is partly a moral concept.*

  This conflates two different things:
  *   **Competence (The Concept):** What the word *actually means* in your mental dictionary.
  *   **Performance (The Application):** How your brain *processes* information to apply that word in real time.

  **The Analogy:** Imagine you show people two lines of equal length, but one has arrows pointing out and the other has arrows pointing in (the Müller-Lyer illusion). People will say one line is longer.
  *   **Does this mean their concept of "length" is contaminated by arrows?** No.
  *   **Does it mean their visual system uses shortcuts that get tricked by context?** Yes.

  In your argument, Step 2 assumes that because the *judgment* changes, the *definition* must have changed. But it's possible that "intentionality" has a clean, non-moral definition (e.g., "foreseeing a result and doing it anyway"), but our brain's **processing speed** is influenced by moral outrage.

  When the chairman harms the environment, our moral alarm bells ring. That alarm makes us pay closer attention, dig deeper, and label it "intentional." When he helps the environment, no alarm rings, we process it lazily, and label it "unintentional."

  **If you drop Premise 2:** You can say, "The concept of intentionality is clean, but human beings are biased processors." This saves the idea that there is a real structure to the mind, it just has bugs/features.

  ### 2. The Goal Post: Premise 5 (Contamination vs. Data)
  Step 5 says:
  > *A contaminated concept can't be a clean description of how minds actually work.*

  This assumes the goal of psychology/philosophy is to find "clean," logical, robot-like definitions. But if you are studying *human* minds, the "contamination" **is the data.**

  If humans naturally link morality and intentionality, that link *is* part of how the mind works. It's not a bug; it's a feature of our social cognition. We evolved to blame and praise, not to be logical statisticians.

  **If you drop Premise 5:** You can say, "The surveys *are* discovering the structure of the mind. The structure just turns out to be morally sensitive." This makes the experimental method even *more* valuable, not less.

  ### 3. The Armchair Trap: Premise 7 (Philosophers are Folk Too)
  Step 7 concludes:
  > *...the armchair philosophers who never ran the surveys were doing it right all along.*

  This is the biggest leap. Armchair philosophers are human beings. They have the same brains as the "folk" they are surveying.
  *   If the "folk" are contaminated by morality, **the philosophers are too.**
  *   The difference is that the experimentalists **measured** the contamination. The armchair philosophers just **assumed** they were objective.

  Imagine a scientist who says, "I'm not going to use a ruler because rulers can be affected by temperature. I'm just going to guess the length with my eyes." That's what Step 7 is advocating. The survey method exposes the bias; the armchair method hides it.

  ### So, which premise do you drop?

  To keep your intuition that the teacher is right (that these studies are valuable) while acknowledging your argument is strong, you should **reject Premise 2.**

  **Here is the revised view:**
  1.  People's judgments *do* flip based on morality.
  2.  **BUT**, this doesn't mean the *concept* is moral. It means the *process* of applying the concept is sensitive to moral context (like the optical illusion).
  3.  Therefore, the surveys aren't measuring "garbage." They are measuring **how the brain processes social information.**
  4.  Armchair philosophers can't see this processing error because they are inside the same system.

  ### What do you lose by dropping Premise 2?
  You lose the idea that "Intentionality" is a pure, logical category like "Prime Number."
  **What you gain:** A much more interesting view of human psychology. You learn that our minds aren't designed to be objective cameras; they are designed to be moral judges. We don't just see what happened; we see *who to blame.*

  ### Summary for your lunch debate
  Tell your friend:
  "The argument treats a **processing bias** like it's a **definition error.** Just because my scale weighs heavier when I'm angry doesn't mean 'weight' includes 'anger.' It means my scale is sensitive to context. The surveys aren't broken; they just proved our brains are moral engines, not logic engines. And armchair philosophers have the same broken scales, they just refuse to weigh anything."

  You've basically stumbled into the field of **Experimental Philosophy (X-Phi)**. If you liked this, you should definitely take a philosophy class!
