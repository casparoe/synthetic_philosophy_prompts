  ok so this is probably dumb but it's been bugging me all week. in my psych elective we just did this famous study where the chairman of a board is told a new program will increase profits but also harm the environment, and he says he doesn't care at all about the environment, just the profits, so they go ahead with it. when regular people hear this story they mostly say he harmed the environment intentionally. but when the story is flipped so the program will help the enviroment, and he still says he doesn't care, only profits, people say he did NOT help intentionally. same guy, same not caring, opposite verdicts. my friend and i got into it at lunch and built an argument we can't get out of:

  (1) the only difference between the harm version and the help version is whether the side effect is morally bad. (2) if people's judgments about whether something was intentional flip depending on whether it's morally bad, then their concept of intentionality is partly a moral concept -- moral judgment is leaking into it. (3) researchers have found similar flips for other mental words like knowing, deciding, and caused. (4) so basically every concept we use to describe minds is contaminated by morality. (5) a contaminated concept can't be a clean description of how minds actually work. (6) so when experimental philosophers survey regular people about these words, they aren't discovering the structure of the mind, they're just measuring the contamination. (7) therefore the whole method of asking the folk is broken, and the armchair philosophers who never ran the surveys were doing it right all along.

  the conclusion feels way too strong -- my teacher loves these studies, and it would be weird if actually testing people's judgments made things worse than just sitting and thinking about it. but i honestly can't see which step is the bad one. step 2 sounds right to me and i kinda want to keep (6) too, since it does seem like the surveys just show people are inconsistent. so: is the argument valid, and if it is, which premise do i drop and what do i lose by dropping it? and if it's not valid, where exactly is the slide? my friend thinks the trick is somewhere in step 2, like maybe "the concept itself is partly moral" and "people are biased in applying a non-moral concept" are two different things and the argument treats them as the same, but she couldn't really explain why that matters. could you explain it like im smart but haven't taken a philosophy class, bc i havent lol
