      *   Responses to strongest points? Yes.
      *   Joint question at the end? Yes.

  *(Self-Correction on the Ending)*: The prompt asks for a question *both views seem to answer badly*. This is crucial.
  *   Peirce struggles because the model might *never* be discarded (no convergence), so is it forever neither true nor false?
  *   James struggles because the model is *known false* (assumptions), so in what sense does it "work" to call it true if we know it's a lie?
  *   The question should target the status of the *idealization itself*.

