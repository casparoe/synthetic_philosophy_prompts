answer: |-
  The committee room smelled of stale coffee and toner. On the table lay a single draft page, the paragraph in dispute highlighted in yellow. Outside, the rain blurred the university campus into gray smudges.

  Clara rubbed her temples. She was the Peircean in this partnership, though she rarely wore the label. Marcus, across from her, tapped his pen against the table. He was the Jamesian, the one who usually argued for the "cash value" of an idea.

  "We have to vote, Clara," Marcus said. "The sentence is: *'The Null Model is true.'* If we don't sign off, the report stalls. The funding agency thinks we're hemming and hawing."

  "It's not true, Marcus," Clara said, her voice low but firm. "Look at the assumptions. Infinite population size? Random mating? No selection? There is no biological population in the history of the earth that satisfies these conditions. To call it 'true' is a lie."

  "It's not a lie, it's a tool," Marcus countered. "And a damn good one. When we use the Null Model to predict allele frequencies in large populations, the predictions hold. It guides our action successfully. It meshes with our lab results. In the Jamesian sense, that *is* truth. It has verified itself."

  Clara leaned forward. "But 'working' is fragmented. The model works for predicting genotype ratios in a petri dish. It fails catastrophically when we try to apply it to conservation genetics in small, fragmented habitats. If truth is just 'what works,' then the model is true in the lab and false in the wild. That renders the word 'true' useless for this report. We need a single verdict."

  She paused, letting the point land. "On my view, truth is the opinion fated to be agreed upon by all who investigate, indefinitely prolonged. Right now, inquiry hasn't settled. We use the model because we have no better one, not because we've reached the end of the road. To call it 'true' now pretends the inquiry is closed. It isn't. It may never be."

  Marcus stopped tapping his pen. He looked at the draft. "That's the problem with your 'fated agreement,' Clara. It's a horizon. You can walk toward it forever, but you never stand on it. If we wait for the end of inquiry to assign truth values, we can never call anything true *now*. But look at the scientists in the field. They trust this model. They build policies on it. If we tell them, 'Actually, this is neither true nor false until the heat death of the universe,' we undermine the very confidence that makes the model useful."

  He looked her in the eye. "Your criterion classifies our best science as indefinitely indeterminate. That conflicts with how science actually functions. We need to validate their trust, not philosophize it away."

  Clara sighed. She picked up her pen, then set it down. "I concede this: If we label it 'neither true nor false,' the report becomes inert. The committee has a practical duty. If 'truth' in this context functions as a warrant for action—a permission to rely on the model—then insisting on the 'final opinion' standard paralyzes the committee. For the sake of the report, I can accept that we need a term that licenses their work."

  "Thank you," Marcus said. "But I concede this to you: 'Working' is slippery. Just because the model predicts outcomes doesn't mean the *mechanisms* are real. If I say the model is 'true,' it implies the infinite population exists. It doesn't. I'm conflating instrumental success with ontological reality. If we call it 'true' without qualification, we invite the students to believe in infinite populations. That's bad science."

  "Exactly," Clara said. "So your 'usefulness' cannot distinguish between a model that captures the deep structure of reality and one that is merely a convenient fiction that happens to predict well. You lack a way to separate luck from truth."

  "And you," Marcus replied, "lack a way to acknowledge the validity of the model *before* the luck runs out. You treat the current consensus as provisional to a fault."

  They sat in silence for a moment. The rain intensified against the glass.

  "So," Marcus said, "if I can't simply say it's true because it works, and you can't say it's false because inquiry isn't finished... where does that leave the swing vote?"

  "It leaves us with the status of the idealization itself," Clara said. "We are relying on a known falsehood to navigate reality. Your view struggles because the belief is literally false in its premises. My view struggles because the field shows no sign of converging on a replacement. We might be stuck with this 'falsehood' forever."

  Marcus nodded slowly. "So the utility is enduring, but the falsity is explicit."

  "Which means," Clara said, "we are in a position where the stability of the belief comes from its utility, not from its convergence with reality."

  Marcus picked up the pen and hovered it over the paper. He didn't write. Instead, he looked at Clara. "We need to flag this. Not in the report, but for ourselves. We need to know what we're ignoring."

  "Agreed."

  Marcus turned to a fresh notepad. "Let's write down the problem. Not the solution. The problem."

  Clara nodded. "Write."

  Marcus wrote, then read it aloud. "When a known falsehood is the only reliable map we have, does calling it 'true' corrupt the inquiry, or does calling it 'false' abandon the map?"

  Clara frowned, considering it. "That's close. But it doesn't capture the convergence issue."

  "Try again," Marcus said.

  Clara thought for a long moment, watching the rain. "If a scientific idealization is never discarded because it is always useful, but never literally accurate... is it a truth waiting to be found, or a fiction we have decided never to outgrow?"

  Marcus looked at the sentence. He put the pen down. "Neither of us can answer that. Your view can't decide if it's fated or just stuck. My view can't decide if it's useful or just comforting."

  "No," Clara said. "We can't."

  "Then we vote 'neither,'" Marcus said. "And we attach that question as a footnote to the minutes."

  "Agreed."
