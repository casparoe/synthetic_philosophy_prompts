  **Formal and Philosophical Preface**

  The paradox enacted here is the problem of phenomenal judgment under epiphenomenalism: if physical states cause both our behavior and our reports of experience, while the experience itself causes nothing, then a physical duplicate without experience would produce the exact same reports. The poem uses the villanelle's rigid structure to mirror the deterministic physical script. The two refrains represent the speaker's judgment and the duplicate's judgment. To satisfy the villanelle's requirement for two distinct refrains while honoring the philosophical claim that the utterances must be physically identical, I have employed a chiasmus (reversing the word order). This allows the lines to be structurally distinct for the form, yet composed of the exact same words, suggesting that from the "outside" (the page or the ear), the claim to inner life is indistinguishable from the scripted report. The domestic imagery (headache, kitchen wires) grounds the metaphysical problem in the ordinary act of self-reporting.

  ***

  **The Scripted Ache**

  I say the headache strikes again.
  My hand goes up to touch my neck.
  The headache strikes, I say again.

  It pulses like a falling rain.
  The signal hits a hard check.
  I say the headache strikes again.

  There is no witness to the pain.
  The circuit closes on the deck.
  The headache strikes, I say again.

  No ghost resides within the vein.
  The gears turn round to cause a wreck.
  I say the headache strikes again.

  The script is written, fully plain.
  The voice comes out at neuron's beck.
  The headache strikes, I say again.

  The shadow speaks what I maintain.
  We stand together, neck to neck.
  I say the headache strikes again.
  The headache strikes, I say again.

  ***

  **Author's Note**

  This piece takes a deliberate liberty with the villanelle's convention of two distinct refrains. Philosophically, if the duplicate is *exact*, the utterance must be identical, not merely semantically equivalent. I have used a chiasmus ("I say..." vs. "The headache strikes...") to maintain the formal requirement of two lines while suggesting their acoustic and semantic collapse. This leans on the contested premise that a philosophical zombie is metaphysically possible; a materialist might argue that if the behavior is identical, the mental state is either identical or irrelevant, dissolving the paradox. The single structural choice most likely to fail on inspection is the chiasmus itself: a careful critic would note that changing word order alters emphasis and prosody, meaning the utterances are *not* truly indistinguishable from the outside. To repair this without breaking the form, one would have to use the exact same line for both refrains, but this would reduce the villanelle to a single-refrain variant, losing the alternating tension between the "speaker" and the "duplicate" that the A1/A2 structure provides. The form resists the repair because the villanelle demands difference to create resonance, while the philosophy demands identity to create the paradox.
