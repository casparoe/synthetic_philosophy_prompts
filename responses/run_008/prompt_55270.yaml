prompt: |-
  I do a science-and-ideas column and I'm recording a podcast episode with a historian who just published an essay arguing the printing press — not nuclear weapons, not the Industrial Revolution — is the analogy we should actually use for transformative AI. Her core claim is that the press mattered through diffusion: cheap copying broke a monopoly on interpretation (the Church's), and the downstream chaos — wars of religion, censorship regimes, eventually the Enlightenment — came from *everyone* suddenly being able to publish, not from any single powerful artifact. On her telling AI is like that: a distribution technology, not a weapon, so the nuke frame with its arms-race logic is leading us badly astray.

  I want roughly six questions, one sentence each, each followed by a one-sentence follow-up keyed to the reply she's most likely to give. A few things I definitely want covered: whether an anology whose biggest effects took two centuries to show up can tell us anything about policy in a ten-year window; the fact that the press amplified humans instead of replacing them, and whether that's quietly doing all the work in her argument; and whether the real disanalogy is that the press made copying cheap while AI makes *generating* cheap. Also include one question that names the dodge I'm expecting — 'analogies are lenses, not predictions' — and pushes past it to something concrete she'd expect to see by 2040 if she's right. Please keep the whole thing under 350 words.
