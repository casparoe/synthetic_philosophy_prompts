answer: |-
  This is an exceptionally sharp observation. You have identified what political philosophers often call the "integration challenge": how to reconcile the consequentialist logic of public policy with the deontological logic of individual rights. Your intuition is correct that our institutions appear to operate on two different metaphysical registers regarding the person.

  Here is a reconstruction of the implicit theory underlying this hybrid practice, an analysis of what the practice requires versus what it merely tolerates, and an assessment of what would change if the separateness of persons were applied consistently.

  ### 1. The Implicit Theory: Ex Ante Agreement vs. Ex Post Constraint

  The most robust reconstruction of our current institutional practice is not that it holds inconsistent views, but that it distinguishes between **imposing general risks** (the aggregative sphere) and **inflicting specific harms** (the anti-aggregative sphere). This is often framed as the distinction between *ex ante* and *ex post* perspectives.

  **The Aggregative Half (Policy and Regulation)**
  Does cost-benefit analysis (CBA) and risk regulation presuppose that persons are mere containers of value?
  *   **What it requires:** Strictly speaking, aggregation requires only that well-being is *comparable* across persons, not that persons are dissolved into a single pool. It presupposes that persons are **stakeholders in a cooperative scheme**.
  *   **The Justification:** This half of the practice is usually justified by a form of **hypothetical consent**. The implicit theory is that a rational person, behind a veil of ignorance (not knowing if they will be the driver or the pedestrian, the vaccinated or the unvaccinated), would agree to a system that minimizes total harm. When the government sets a speed limit that inconveniences many to save a few, it is not sacrificing Person A for Person B; it is imposing a reciprocal risk on everyone for the benefit of everyone *ex ante*.
  *   **Comfort vs. Requirement:** This practice sits *comfortably* with utilitarianism (persons as containers), but it does not *require* it. It is compatible with a view of persons as distinct, provided the risks are distributed generally and reciprocally. We accept the aggregation because we all share the risk.

  **The Anti-Aggregative Half (Rights and Protections)**
  Does the refusal to harvest organs or punish the innocent presuppose that persons are ends in themselves?
  *   **What it requires:** This practice requires **side-constraints**. It posits that there are certain things that cannot be done to a person, regardless of the aggregate good.
  *   **The Justification:** You asked if this is better explained by distrust of officials or historical accident. While distrust explains the *vigilance* of these protections (e.g., the Fourth Amendment), it does not explain the *moral intuition*. If we knew with 100% certainty that framing an innocent person would stop a riot without any slippery slope risks, most legal systems would still forbid it. This suggests the constraint is moral, not merely epistemic. It presupposes that persons have a **status** (dignity, sovereignty over their own bodies) that makes them unavailable as resources.
  *   **Comfort vs. Requirement:** This sits *comfortably* with Kantianism (ends-in-themselves). However, a Rule Utilitarian could argue that banning organ harvesting maximizes utility in the long run by preserving social trust. Yet, the *practice* treats these rights as trumps, not as rules of thumb. This suggests the underlying theory views persons as having inviolable boundaries.

  ### 2. Are the Two Halves Inconsistent?

  They are in tension, but they are not logically inconsistent if you accept the **Risk/Harm Distinction**.

  The implicit theory of the person in liberal democracies is that of a **free and equal cooperator**.
  1.  **As a cooperator:** You agree to live under general rules that balance burdens and benefits (CBA, traffic laws, taxation). Here, you are part of a collective project. Your separateness is respected because the rules apply to you as they do to everyone else.
  2.  **As an individual:** You retain sovereignty over your specific bodily and moral integrity. The state cannot single you out to be the *designated victim*.

  The inconsistency arises only when the aggregative logic bleeds into the rights sphere. For example, if a pandemic policy moves from "we all accept a lockdown risk" to "we will forcibly quarantine *this specific neighborhood* to save the rest," it crosses from the aggregative (reciprocal risk) to the anti-aggregative (sacrificial harm).

  Therefore, the two halves presuppose a single account: **Persons are distinct sovereigns who voluntarily pool risk for mutual advantage but retain a veto against being used as mere means.**

  ### 3. What Would Change If We Took Separateness Seriously?

  If we took the "separateness of persons" objection seriously and consistently—as Rawls argued we should—the institutional landscape would shift significantly. The current practice often hides the aggregation behind the veil of statistics. Taking separateness seriously would force us to confront the individual cost of aggregate gains.

  **Changes to the Aggregative Half (Policy)**
  *   **End of Pure Summation:** Cost-benefit analysis could no longer simply sum total welfare. It would need to be **prioritarian** or **sufficientarian**. You could not impose a massive burden on a small minority even if the aggregate gain to the majority was huge. The "Kaldor-Hicks" efficiency standard (winners *could* compensate losers) would be replaced by a requirement that policies are mutually advantageous to all, or at least do not push anyone below a threshold of dignity.
  *   **Risk Imposition:** Current road safety standards trade small risks to many for convenience to others. A strict separateness view would question non-consensual risk imposition. We might see a shift toward strict liability or a requirement for explicit consent for certain public risks, making infrastructure projects much harder to approve.
  *   **Pandemic Policy:** We would move away from "minimize total deaths" toward "minimize rights violations." Lockdowns that disproportionately burden the poor or specific industries might be deemed impermissible, even if they saved more lives overall, because they treat the burdened group as a means to the safety of the rest.

  **Changes to the Anti-Aggregative Half (Rights)**
  *   **Hardening of Constraints:** Currently, we sometimes allow "ticking time bomb" exceptions in theory (torture debates) or in practice (eminent domain). A consistent separateness view would close these loopholes. The prohibition on using a person without their consent would become absolute.
  *   **The "Identifiable Victim" Problem:** Currently, we spend millions to rescue one trapped miner (identified) while spending less on safety measures that would statistically save more miners (unidentified). Taking separateness seriously actually challenges our current bias *toward* the identified victim. If every life is distinct, statistical lives matter just as much as identified ones. However, the *sacrifice* of an identified person is the greater evil. So, we would likely see a shift: we would stop sacrificing the identified person (no organ harvesting), but we would be forced to treat statistical lives with the same moral weight as identified ones in policy, potentially raising safety standards across the board to match the rescue effort.

  ### 4. Summary of the Implicit View

  Your institutions do not presuppose that persons are mere containers, nor do they presuppose a mystical indivisibility. They presuppose a **Political Conception of the Person**:

  1.  **In the Legislative/Administrative Sphere:** Persons are treated as **citizens** with shared interests. Aggregation is permitted because it is framed as a system of reciprocal cooperation. (Requirement: Comparability of interests; Comfort: Utilitarian calculus).
  2.  **In the Judicial/Constitutional Sphere:** Persons are treated as **rights-holders** with inviolable boundaries. Aggregation is forbidden because it constitutes a violation of sovereignty. (Requirement: Side-constraints; Comfort: Deontological dignity).

  **The Verdict:** The practice is stable but theoretically fragile. It relies on the hope that general policies (aggregative) do not result in specific sacrificial victims (anti-aggregative). If you take the separateness of persons seriously, the aggregative half must be severely curtailed. You can no longer trade my loss for your gain unless I consent or unless the system guarantees that I am not systematically disadvantaged by the trade. The "pool" of well-being is broken; there are only individual accounts, and the state is merely the accountant, not the owner.
