answer: |-
  Here is a complete session plan designed to fit a tight 50-minute window while delivering the specific conceptual payoff you requested.

  # Session Plan: The Economics of Honesty
  **Time:** 50 Minutes
  **Students:** 14 (7 Senders, 7 Receivers)
  **Goal:** Experiential discovery that *differential burden*, not absolute cost, creates honest signaling.

  ## I. Materials & Setup
  *   **Role Cards:** 7 marked "Sender," 7 marked "Receiver."
  *   **Type Cards (for Senders only):** Inside the 7 Sender envelopes, 3 say "High Quality" (HQ), 4 say "Low Quality" (LQ). *Crucial:* Students keep this secret.
  *   **Currency:** Poker chips or paper slips (approx. 200 total).
  *   **Decision Slips:** Small pieces of paper for Senders (to write Signal Level) and Receivers (to write Accept/Reject).
  *   **Timer:** Visible to all.
  *   **Prize:** A tangible reward for the top 3 token holders (e.g., chocolate, coffee voucher, or "homework pass").

  ## II. Payoff Structure (The Engine)
  *   **Receivers:**
      *   Accept HQ: **+10 tokens**
      *   Accept LQ: **-5 tokens** (Penalty is essential; otherwise they accept everyone).
      *   Reject: **0 tokens**
  *   **Senders:**
      *   Accepted: **+10 tokens** (Same for HQ and LQ).
      *   Rejected: **0 tokens** (from the interaction).
  *   **Signaling:**
      *   Senders choose a Signal Level (0 to 5).
      *   Cost depends on the Phase (see below).

  ## III. Timeline & Rules (50 Minutes)

  ### 0:00–0:05 | Setup & Distribution
  1.  Hand out Role Cards. Senders sit on one side, Receivers on the other.
  2.  Senders open Type Cards (HQ/LQ). **Rule:** "You may talk, lie, or show your card. But the card is not binding proof."
  3.  Explain the Goal: "Maximize your token count. Top 3 win the prize."
  4.  Explain the Matching: "Each round, I will randomly pair one Sender with one Receiver. You have 90 seconds to negotiate and decide."

  ### 0:05–0:17 | Phase 1: Cheap Talk (2 Rounds)
  *   **Rule:** Signaling is **Free** (Cost = 0).
  *   **Endowment:** All Senders start with **10 tokens**.
  *   **Action:** Sender writes a Signal Level (0–5). Receiver decides Accept/Reject.
  *   **Prediction:** **Pooling Equilibrium.** All Senders will signal "5" because it costs nothing. Receivers cannot distinguish types. Receivers will likely Reject everyone (due to the -5 penalty for LQ) or Accept randomly. Information is zero.
  *   **Instructor Role:** Do not comment on strategy. Just announce: "Phase 1. Cost is zero. Go." (2 rounds, 6 mins total).

  ### 0:17–0:29 | Phase 2: The Flat Cost (2 Rounds)
  *   **Rule:** Signaling costs **5 tokens** for **Everyone**.
  *   **Endowment:** All Senders reset to **15 tokens**.
  *   **Action:** Same as Phase 1.
  *   **Prediction:** **Pooling or Collapse.**
      *   Since both HQ and LQ gain +10 from acceptance and pay -5 for signaling, the *net gain* is identical (+5).
      *   LQ will mimic HQ because the cost is affordable (15 - 5 = 10 remaining).
      *   Receivers realize the signal doesn't separate types. They will likely revert to rejecting, or accept based on non-signal cues (friendship, loudness). The cost added noise, not clarity.
  *   **Instructor Role:** Collect tokens for signals. Enforce the cost strictly. (2 rounds, 6 mins total).

  ### 0:29–0:41 | Phase 3: Differential Burden (2 Rounds)
  *   **Rule:** Signaling costs **5 tokens** (Nominal cost is flat).
  *   **Endowment (The Twist):**
      *   **HQ Senders:** Start with **20 tokens**.
      *   **LQ Senders:** Start with **5 tokens**.
  *   **The "Ruins" Rule:** "If you end this phase with **0 tokens**, you are eliminated from the final prize draw."
  *   **Prediction:** **Separating Equilibrium.**
      *   **HQ:** 20 - 5 (signal) = 15. Even if rejected, they have 15. They are safe. They will signal to prove quality.
      *   **LQ:** 5 - 5 (signal) = 0. If they signal and are rejected, they hit 0 and are eliminated. The risk is ruinous. They will *not* signal.
      *   **Receivers:** Learn that Signal = HQ. They Accept Signalers, Reject Non-Signalers.
  *   **Instructor Role:** Emphasize the "Ruins Rule." Watch the LQ students hesitate. (2 rounds, 6 mins total).

  ### 0:41–0:45 | Tally & Prize
  *   Collect tokens. Count quickly. Announce winners.
  *   **Crucial:** Do not explain *why* yet. Let the frustration/curiosity build.

  ### 0:45–0:50 | The Debrief (The Ambush)
  *   **Minute 45:** Ask Phase 1 Receivers: "Why did you reject even when they signaled 5?" (Answer: "Because LQ did it too.")
  *   **Minute 46:** Ask Phase 2 Senders: "Did the cost stop the LQ from lying?" (Answer: "No, they could afford it.")
  *   **Minute 47:** Ask Phase 3 LQ Senders: "Why didn't you signal?" (Answer: "I couldn't risk going to zero.")
  *   **Minute 48:** **Introduce Theory.**
      *   "Phase 1 was **Cheap Talk**."
      *   "Phase 2 was the **Naive Handicap** (Cost = Credibility). It failed."
      *   "Phase 3 was the **Zahavi Handicap Principle**."
  *   **Minute 49:** **The Core Insight.** "Honesty isn't about the signal being expensive. It's about the signal being *differentially expensive*. It must be cheap for the truthful, and ruinous for the liar."
  *   **Minute 50:** **Limitations.** "You calculated this in minutes. Evolution takes generations. In nature, the 'cost' isn't tokens; it's survival risk. But the math is identical."

  ## IV. Predicted Outcomes & Payoff Numbers

  | Phase | Sender Type | Endowment | Signal Cost | Net if Accepted | Net if Rejected | Behavior |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1 (Free)** | HQ & LQ | 10 | 0 | +10 | 0 | **Pool:** Both signal max. Receivers ignore signal. |
  | **2 (Flat)** | HQ & LQ | 15 | 5 | +5 (15-5+10) | +10 (15-5+0) | **Pool:** Both signal (affordable). Receivers skeptical. |
  | **3 (Diff)** | **HQ** | **20** | **5** | **+25** | **+15** | **Separate:** Signal. Risk is low. |
  | **3 (Diff)** | **LQ** | **5** | **5** | **+10** | **0 (Eliminated)** | **Separate:** No Signal. Risk is ruinous. |

  *Note on Phase 2 Net:* If they signal and are rejected, they have 10 tokens. If they don't signal and are rejected, they have 15. Rational senders might not signal in Phase 2 if they expect rejection. However, if they expect acceptance, they will signal. The key is that LQ *can* afford to mimic HQ if there's a chance of acceptance. In Phase 3, LQ *cannot* afford to mimic HQ if there is *any* risk of rejection.

  ## V. Troubleshooting: What Will Go Wrong

  **1. Collusion / Friendship Bias**
  *   *Risk:* Receivers accept their friends regardless of signal.
  *   *Fix:* **Randomize pairs every round.** Use a deck of cards. Red suits = Senders, Black suits = Receivers. Shuffle and deal. No choosing partners.

  **2. Receivers Accept Everyone (Stakes feel fake)**
  *   *Risk:* Receivers don't care about the -5 penalty.
  *   *Fix:* Make the penalty visceral. "If you end with negative tokens, you owe me a chocolate bar." Or, publicly track Receiver scores on the board. Social pressure works better than abstract tokens.

  **3. Timeline Blowout**
  *   *Risk:* Negotiation drags. You run out of time for the debrief.
  *   *Fix:* **Hard Stop.** Use a loud timer. At 90 seconds, yell "Decisions Down!" If a pair hasn't decided, they auto-Reject. Sacrifice a round rather than the debrief. The debrief is the grade; the game is just the vehicle.

  **4. LQ Senders Signal Anyway in Phase 3**
  *   *Risk:* LQ students gamble and get lucky, muddying the data.
  *   *Fix:* If an LQ signals and is accepted, acknowledge it but point out in debrief: "You survived the gamble. But in evolution, the ones who gamble and lose don't reproduce. We are looking at the strategy that survives, not the lucky individual."

  ## VI. Limitations (For Your Debrief Notes)
  *Be explicit about these so you don't overclaim.*

  1.  **Rationality vs. Selection:** Your classmates separated types using conscious game theory. In nature, peacocks don't calculate; genes that produced costly tails survived because predators ate the liars. The *mechanism* is different (cognition vs. selection), though the *equilibrium* is the same.
  2.  **Exogenous vs. Endogenous Costs:** You imposed the endowment rules. In reality, the "cost" emerges from the physiology (a heavy tail is heavier for a weak bird). The game hard-coded the marginal cost; nature evolves it.
  3.  **Static vs. Dynamic:** You played 2 rounds. Real signaling systems co-evolve over millennia. If Receivers became too trusting, Senders would cheat again. You saw a snapshot, not the movie.
  4.  **Continuous vs. Discrete:** Your signal was 0–5. Natural signals are often continuous (tail length, roar volume). The principle holds, but the granularity matters in complex environments.

  ## VII. Instructor Script Snippet (For the Debrief)
  *"In Phase 2, we added cost. Did it help? No. Why? Because a lie that costs $5 is still a lie if I have $100. But in Phase 3, the lie cost $5 when you only had $5. That isn't a cost; that's a threat of extinction. Zahavi's insight wasn't that signals are wasteful. It's that waste is the point. The waste proves you can afford it. If the cost doesn't hurt the liar more than the truth-teller, it's not a handicap. It's just a price tag."*
