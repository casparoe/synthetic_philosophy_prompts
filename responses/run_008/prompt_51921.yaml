      *   *Context:* The AWG (Anthropocene Working Group) proposed formalizing the Anthropocene with a GSSP (Global Boundary Stratotype Section and Point) at Crawford Lake, starting ~1950. The SQS (Subcommission on Quaternary Stratigraphy) voted it down.
