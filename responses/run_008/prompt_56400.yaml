      *   *Section 3: The Reverse Map (AlphaGo vs. The Ladder).*
          *   *Competence vs. History:* Dennett's taxonomy is historical/etiological. AlphaGo is functional.
          *   *Decoupling:* The ladder assumes accumulation. AlphaGo shows we can skip rungs.
          *   *Silence:* The taxonomy assumes a unified agent. AlphaGo is a static artifact deployed by a dynamic team (DeepMind researchers). The "creature" is actually the Human+AI system during the match.
      *   *Conclusion:* Summarize. The taxonomy holds but requires distinguishing between the *agent* (the binary) and the *system* (the lab). AlphaGo exposes that "intelligence" can be compartmentalized in ways biology rarely allows.

  6.  **Refining the Argument (Self-Correction during drafting):**
