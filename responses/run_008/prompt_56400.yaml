answer: |-
  The 2016 match between AlphaGo and Lee Sedol provides a stress test for Daniel Dennett's taxonomy of minds. Dennett's ladder—Darwinian, Skinnerian, Popperian, Gregorian—is typically presented as an evolutionary sequence where higher rungs presuppose and incorporate the lower ones. AlphaGo, as an engineered artifact, fractures this assumption. It allows us to decouple the layers that biology usually bundles, revealing that "intelligence" is not a monolithic trait but a collection of distinct information-processing strategies that can be mixed and matched.

  Here is the disciplined mapping of AlphaGo onto Dennett's ladder, followed by an analysis of what the system does to the taxonomy itself.

  ### I. Mapping AlphaGo to the Taxonomy

  **1. The Darwinian Layer: Selection in the Lab**
  Dennett's Darwinian creatures are those whose competence is hardwired by natural selection; trial and error occurs at the level of the genome across generations. AlphaGo's "genome" is its neural network weights. These weights were not innate but were the product of a rigorous selection process: variation (gradient descent updates, architectural tweaks) and selection (win rates against previous versions or human data).
  *   **The Mapping:** The training phase constitutes a Darwinian process. The "environment" was the Go board; the "fitness" was the probability of winning.
  *   **The Caveat:** This evolution occurred in an engineer's lab, not phylogeny. Does this matter? For Dennett, the mechanism of selection matters more than the selector. However, the *timescale* is compressed, and the "survival" is metaphorical (saving a checkpoint vs. discarding one). AlphaGo is a Darwinian creature whose "species history" was compressed into weeks of GPU time. It entered the match as a fossilized product of this artificial selection.

  **2. The Skinnerian Layer: The Missing Rung**
  Skinnerian creatures can learn during their lifetime via operant conditioning. They try behaviors, receive reinforcement, and adjust. This is where the mapping breaks, and where your inversion is most potent.
  *   **The Mapping:** AlphaGo was **not** a Skinnerian creature during the match. As noted, the network was fixed between games. When Lee Sedol played Move 78 in Game 4, causing AlphaGo's evaluation to collapse, the system could not update its policy based on that negative reinforcement. It could not "learn from its mistakes" in the lifetime of the tournament.
  *   **The Implication:** A dog that loses a fight learns caution; AlphaGo did not. It was less than Skinnerian across games. Its "lifetime" (the match) was devoid of ontogenetic learning. It relied entirely on the phylogenetic learning (training) that occurred prior. This decouples the Skinnerian layer from the Popperian layer, something biological evolution rarely does (animals that plan usually also learn from experience).

  **3. The Popperian Layer: Death in the Head**
  Popperian creatures can run internal simulations, allowing hypotheses to die in their heads rather than in the world. This is AlphaGo's strongest suit.
  *   **The Mapping:** The Monte Carlo Tree Search (MCTS) is a textbook Popperian engine. Before playing Move 37 in Game 2, AlphaGo simulated thousands of rollouts. It evaluated the "shoulder hit on the fifth line" not by playing it and losing, but by simulating the consequences. The "one-in-ten-thousand" probability humans assigned to the move reflects a human heuristic blind spot; AlphaGo's tree search allowed it to validate a hypothesis that human culture had discarded.
  *   **The Implication:** Within the confines of a single game, AlphaGo is hyper-Popperian. It explores a space of counterfactual futures. However, this Popperian competence is bounded by the "horizon" of the search tree and the "prior" of the policy network. It can let moves die in its head, but it cannot let *strategies* die in its head across games.

  **4. The Gregorian Layer: Fossilized Culture**
  Gregorian creatures equip themselves with cultural tools (language, logic, abacuses) to enhance their thinking. They inherit "mind-tools" from their society.
  *   **The Mapping:** AlphaGo was initialized with a corpus of human games (KGS server data). It ingested the cultural output of Go masters. In this sense, it stands on the shoulders of giants.
  *   **The Caveat:** Dennett's Gregorian creatures *use* tools to think. AlphaGo did not use the human games as tools to manipulate; it used them as training data to shape its intuition. It did not learn the *language* of Go (concepts like "thickness" or "aji" as manipulable symbols); it learned the *statistics* of Go. It inherited the *results* of human Gregorian thinking without necessarily inheriting the *tools*. It is a beneficiary of Gregorian culture, but arguably not a Gregorian creature itself, as it lacked the capacity to transmit or modify the cultural tools recursively during the match.

  ### II. The Inversion: Popperian Without Skinnerian

  The most striking philosophical feature of AlphaGo is the inversion you identified: it is highly Popperian *intra-game* but non-Skinnerian *inter-game*.

  In biological evolution, the layers are cumulative. A Popperian human is also a Skinnerian learner (we learn from pain) and a Darwinian product (we have instincts). We expect lookahead (Popperian) to be supported by feedback learning (Skinnerian). AlphaGo reverses this. It possesses a sophisticated "inner eye" for simulation but is lobotomized regarding experience.

  This reveals that **lookahead does not require adaptability.** You can engineer a system that plans better than a human but learns slower than a rat. This suggests that Dennett's ladder, when viewed biologically, conflates *competence* with *developmental history*. AlphaGo proves that high-level simulation can be hard-coded (or pre-trained) without the need for lifetime reinforcement. It is a "frozen Popperian"—a creature that thinks ahead but cannot look back.

  ### III. Running the Analysis in Reverse: What AlphaGo Does to Dennett's Ladder

  If we use AlphaGo to test the taxonomy, the ladder begins to wobble. The taxonomy was designed to categorize natural agents, not artifacts. When applied to AlphaGo, we must ask: Is the taxonomy about architecture, origin, or competence?

  **1. Architecture vs. Origin**
  Dennett's taxonomy is etiological; it is about *how* the mind came to be. A Darwinian creature is one shaped by selection. A Gregorian is one shaped by culture.
  *   **The Conflict:** AlphaGo's architecture is Popperian (MCTS), but its origin is Darwinian (RL training), and its data source is Gregorian (human records). If we classify by architecture, it is Popperian. If we classify by origin, it is Darwinian. If we classify by data diet, it is Gregorian.
  *   **The Result:** The taxonomy loses its predictive power if it cannot distinguish between the *source* of the intelligence and the *mechanism* of the intelligence. AlphaGo forces us to admit that the "creature" is not the software alone, but the software-plus-lab. The "learning" happened in the lab (Skinnerian/Darwinian), while the "thinking" happened on the board (Popperian).

  **2. Competence vs. Capacity**
  Dennett often speaks of "competence without comprehension." AlphaGo maximizes this. It exhibits Popperian competence (lookahead) without the capacity for Popperian growth (it cannot rewrite its own search algorithm mid-match).
  *   **The Silence:** The taxonomy is silent on **static intelligence**. It assumes that if an agent acts like a Popperian creature, it has the underlying machinery of a Popperian creature (including the ability to refine its simulations over time). AlphaGo shows you can have the performance without the plasticity. The taxonomy assumes the rungs are made of the same material (neural plasticity, evolutionary time); AlphaGo shows they can be made of different materials (fixed weights vs. tree search).

  **3. The Unit of Analysis**
  Finally, AlphaGo exposes a silence in the taxonomy regarding **distributed cognition**.
  *   During the match, who was the Gregorian creature? It was not AlphaGo alone. It was AlphaGo plus the DeepMind engineers who could (in principle) patch the system, plus the human commentators interpreting its moves.
  *   Dennett's ladder assumes a bounded individual organism. AlphaGo is an artifact deployed by a culture. If we view the "agent" as the DeepMind team + AlphaGo, the system *is* Skinnerian (they analyzed Game 4 and could have patched it) and *is* Gregorian (they used human theory to build it).
  *   **The Taxonomy's Limit:** The taxonomy struggles to categorize artifacts because artifacts outsource their "lower rungs" to their creators. AlphaGo doesn't need to be Skinnerian because its creators are Skinnerian. It doesn't need to be Gregorian because it was built by Gregorian creatures.

  ### Conclusion

  AlphaGo does not invalidate Dennett's ladder, but it stratifies it. It demonstrates that the rungs are not necessarily a developmental sequence for a single agent, but distinct modules of information processing that can be engineered independently.

  *   **Darwinian:** Yes, in the training loop (selection of weights).
  *   **Skinnerian:** No, in the deployment (fixed network).
  *   **Popperian:** Yes, in the inference (tree search).
  *   **Gregorian:** Ambiguous, it consumed culture but did not wield tools.

  The match reveals that we can build **Popperian engines** that lack **Skinnerian flexibility**. This makes AlphaGo a "philosophical zombie" of the higher rungs: it simulates the death of hypotheses in its head, but it cannot let its own structure die and be reborn based on experience. The taxonomy remains useful, but only if we acknowledge that for artifacts, the "creature" is often a hybrid of the code and the culture that sustains it. AlphaGo sat on the Popperian rung during the game, but it was held there by Gregorian hands.
