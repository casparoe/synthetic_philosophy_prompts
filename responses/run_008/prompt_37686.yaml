answer: |-
  # Seminar Rubric: Desiderata for Theories of Choice Under Ambiguity

  **Purpose:** To evaluate theories capable of advising a regulator allocating resources under ambiguity (e.g., pandemic preparedness), not merely rationalizing laboratory choices.
  **Pre-commitment:** These criteria are fixed prior to theoretical review to prevent reverse-engineering.

  ### I. Core Desiderata (Non-Negotiable)
  *These requirements are forced by the stated purpose and the foundational cases defining the field. Failure on any counts as disqualification.*

  1.  **Ellsberg Compliance:** The theory must predict the modal choices in the Two-Urn case (prefer known 50/50 to unknown proportions) and the Three-Color case (prefer Red > Black AND Black-or-Yellow > Red-or-Yellow).
      *   *Rationale:* These are the empirical phenomena defining "ambiguity." A theory that cannot capture them is not a theory of ambiguity.
  2.  **Non-Reducibility:** The theory must not be able to rationalize the Three-Color pattern using any single probability assignment over the urn's composition.
      *   *Rationale:* This distinguishes genuine ambiguity models from the deflationary view that all uncertainty reduces to precise risk. It is the formal definition of the subject matter.
  3.  **Regulatory Tractability:** The theory's advice must be expressible in a two-page memo understandable by a non-specialist policymaker.
      *   *Rationale:* Forced by the purpose. A theory requiring complex hierarchical priors or non-standard calculus fails the regulatory constraint, regardless of its axiomatic elegance.

  ### II. Structural Desiderata (Preferences of Camps)
  *These are standard rationality constraints imported from the expected-utility tradition. They are highly desirable but generate tension with the Core Desiderata.*

  4.  **Dynamic Consistency (Preference of the Normative Camp):** Plans made ex ante must remain optimal at later choice nodes without requiring commitment devices.
      *   *Rationale:* Essential for credible policy. However, this is often a prejudice imported from SEU; ambiguity-sensitive agents may legitimately change preferences as information resolves.
  5.  **Node-Consequentialism (Preference of the Normative Camp):** Choice at a node must depend only on outcomes reachable from that node, ignoring past history or forgone alternatives.
      *   *Rationale:* Standard rationality requirement. Violating this implies the agent cares about the "path" taken, not just the result.
  6.  **Ambiguity Seeking Capacity (Preference of the Descriptive Camp):** The theory must allow for ambiguity seeking (paying a premium for ambiguity) in some domains, particularly involving small probabilities.
      *   *Rationale:* While the regulatory purpose prioritizes aversion (precaution), a general theory restricted only to aversion is descriptively incomplete. However, for the specific regulator purpose, aversion is prioritized over seeking.

  ### III. The Impossibility Result
  **Plain Statement:** You cannot satisfy **Dynamic Consistency**, **Node-Consequentialism**, and **Ambiguity Sensitivity** (Core Desiderata 1 & 2) simultaneously within a general theory over unrestricted choice trees. This triple is jointly unsatisfiable. To maintain ambiguity sensitivity, a theory must typically sacrifice dynamic consistency (unless one imposes restrictive domain assumptions like "rectangularity" on the ambiguity structure itself, which limits the theory's generality).

  ### IV. The Exclusionary Flag
  **Most Exclusionary Requirement:** **Dynamic Consistency.**
  While Non-Reducibility excludes the Deflationary view, Dynamic Consistency excludes almost all candidate ambiguity theories (including the leading models) that successfully satisfy the Core Desiderata. It is the primary filter that leaves the field empty unless one accepts time-inconsistency or restricts the domain of application.

  ### V. Preliminary Evaluation of Leading Positions
  The **Deflationary Precise-Beliefs view** fails immediately on Non-Reducibility and Ellsberg Compliance, as it forces a single prior that cannot generate the Three-Color pattern. The **Worst-Case-Priors view** (Maxmin) satisfies Ellsberg Compliance, Non-Reducibility, and Regulatory Tractability perfectly, but it generally fails Dynamic Consistency unless the set of priors is artificially constrained, and it cannot accommodate Ambiguity Seeking. The **Smooth view** (second-order probabilities) satisfies Ellsberg Compliance and Non-Reducibility and allows for Ambiguity Seeking, but it struggles with Dynamic Consistency and fares poorly on Regulatory Tractability due to the complexity of specifying and computing over second-order distributions.
