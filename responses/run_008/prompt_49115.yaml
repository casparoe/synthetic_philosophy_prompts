  # ANTHROPIC DIAGNOSTIC TREE
  **Course:** Graduate Seminar in Formal Epistemology  
  **Topic:** Self-Locating Belief & Cosmological Updating  
  **Instructions:** Answer the three questions below based on your immediate intuitions about the cases described. Do not worry about which "camp" your answers place you in; the goal is to locate your commitments, not to select a team.

  ---

  ### ENTRY POINT
  You accept ordinary Bayesian conditioning on non-indexical evidence. You are uncertain between rival cosmological hypotheses. You know you exist as one observer among the observers (if any) that the true hypothesis entails.

  ---

  ### NODE 1: THE DOOMSDAY INTUITION
  **The Case:** You are certain you are human birth-rank #100 billion. You are deciding between two hypotheses:
  *   **$H_{Short}$:** The total number of humans who will ever exist is 200 billion.
  *   **$H_{Long}$:** The total number of humans who will ever exist is 200 trillion.
  *   **Priors:** You assign equal prior probability to $H_{Short}$ and $H_{Long}$.

  **The Question:** Does learning your birth rank (#100 billion) shift your credence toward **$H_{Short}$**?
  *   **(A) Yes:** My rank is surprisingly early if $H_{Long}$ is true; this favors extinction soon. $\rightarrow$ *Go to Node 2A*
  *   **(B) No:** My rank is just a fact about me; it doesn't change the odds of total population size. $\rightarrow$ *Go to Node 2B*

  ---

  ### NODE 2A: THE SLEEPING BEAUTY CHECK (For "Yes" at Node 1)
  **The Case:** Sleeping Beauty is put to sleep on Sunday. A fair coin is tossed.
  *   **Heads:** She is woken once (Monday) and interviewed.
  *   **Tails:** She is woken twice (Monday and Tuesday), with memory erasure between wakings.
  *   **Situation:** Beauty wakes up. She knows the protocol but not the day or the coin outcome.

  **The Question:** Upon waking, is her credence that the coin landed **Heads** equal to **1/3**?
  *   **(Yes) 1/3:** There are three possible wakings, only one is Heads. $\rightarrow$ *Go to Node 3*
  *   **(No) 1/2:** The coin is fair; waking provides no new relevant evidence about the toss. $\rightarrow$ *Go to Node 3*

  *(Note: This node tracks your intuition on self-locating updates. While Thirders often align with SIA and Halfers with SSA, this distinction alone does not settle your anthropic assumption.)*

  ---

  ### NODE 2B: THE EXISTENCE BONUS (For "No" at Node 1)
  **The Case:** You are uncertain between two cosmological hypotheses with equal priors:
  *   **$H_{Few}$:** The universe contains exactly one observer.
  *   **$H_{Many}$:** The universe contains one trillion observers.
  *   **Evidence:** You discover that you exist.

  **The Question:** Does this discovery shift your credence toward **$H_{Many}$**?
  *   **(Yes) Favor Populous:** I am more likely to exist if there are more observers. $\rightarrow$ *Go to Node 3*
  *   **(No) Neutral:** My existence was guaranteed by the setup; it favors neither hypothesis. $\rightarrow$ *Go to Node 3*

  ---

  ### NODE 3: THE REFERENCE CLASS WIDTH
  **The Case:** Assume there is a causally disconnected region of the multiverse containing a being qualitatively identical to you (same memories, physics, mental state).

  **The Question:** For the purpose of anthropic reasoning, is that being part of the **reference class** from which you should consider yourself randomly drawn?
  *   **(Broad) Yes:** All qualitatively identical conscious beings count.
  *   **(Narrow) No:** Only beings in my specific causal history or physical location count.

  ---

  ### LEAVES: YOUR DIAGNOSTIC POSITION

  #### 1. Path: Node 1(A) + Node 2A(No) + Node 3(Narrow)
  *   **Position:** **SSA (Standard)**
  *   **Awkward Commitment:** You must accept the **Doomsday Argument**, implying high confidence in imminent human extinction based solely on your birth rank.

  #### 2. Path: Node 1(A) + Node 2A(No) + Node 3(Broad)
  *   **Position:** **SSA (Universal)**
  *   **Awkward Commitment:** You face the **Reference Class Arbitrariness** problem: if the class includes all conscious beings, it is unclear why it stops there and does not include rocks or algorithms.

  #### 3. Path: Node 1(B) + Node 2B(Yes) + Node 3(Broad)
  *   **Position:** **SIA (Standard)**
  *   **Awkward Commitment:** You must accept the **Presumptuous Philosopher** result: you can confidently infer the existence of vast, unobserved populations solely because you exist.

  #### 4. Path: Node 1(B) + Node 2B(Yes) + Node 3(Narrow)
  *   **Position:** **Unnamed (SIA-Narrow)**
  *   **Awkward Commitment:** This view is **theoretically unstable**: it claims existence favors populous worlds but arbitrarily restricts which observers count toward that population.

  #### 5. Path: Node 1(B) + Node 2B(No) + Node 3(Narrow)
  *   **Position:** **Deflationary (Standard)**
  *   **Awkward Commitment:** You must treat **"I exist" as non-informative**, effectively ignoring indexical evidence that seems to rule out worlds where you could not exist.

  #### 6. Path: Node 1(B) + Node 2B(No) + Node 3(Broad)
  *   **Position:** **Unnamed (Deflationary-Broad)**
  *   **Awkward Commitment:** This view is **largely unexplored**: it combines a refusal to update on existence with a universal scope for sampling, creating tension between the two commitments.

  #### 7. Path: Node 1(A) + Node 2A(Yes) + Node 3(Narrow)
  *   **Position:** **Unnamed (Hybrid-Halfer)**
  *   **Awkward Commitment:** This combination is **rarely defended**: it accepts the Doomsday shift (SSA) but rejects the Halfer intuition on Beauty, creating friction in how self-location is weighted.

  #### 8. Path: Node 1(A) + Node 2A(Yes) + Node 3(Broad)
  *   **Position:** **Unnamed (Hybrid-Thirder)**
  *   **Awkward Commitment:** This combination is **incoherent for most**: it accepts the Doomsday shift (SSA) while adopting the Thirder view (typically SIA), leading to double-counting or contradiction in probability mass.

  ---

  ### DIAGNOSTIC NOTES & UNOCCUPIED BRANCHES

  **1. Indistinguishability Warning (SSA-Universal vs. SIA)**
  Be aware that **Leaf 2 (SSA-Universal)** and **Leaf 3 (SIA)** may yield identical posterior probabilities in many cosmological setups. If your reference class is sufficiently broad (e.g., "all observers in the multiverse"), the SSA sampling effect can mathematically mimic the SIA existence bonus. Your tree placement distinguishes them by *reasoning* (Doomsday/Beauty intuitions), but empirical tests may fail to separate them.

  **2. Walking the Unoccupied Branches**
  *   **Leaves 4 & 6 (Unnamed Narrow-SIA / Broad-Deflationary):** These are not strictly incoherent, but they are **unattractive**. They combine a stance on population weighting with a reference class definition that undermines the motivation for that stance (e.g., favoring populous worlds but excluding most observers from the count).
  *   **Leaves 7 & 8 (Hybrid Halfer/Thirder + Doomsday):** These combinations are generally considered **incoherent** or **unexplored**. Accepting the Doomsday shift (Node 1A) typically requires treating self-location as a random sample (Halfer/SSA). Accepting the Thirder view (Node 2A-Yes) typically requires treating self-location as evidence of existence (SIA). Holding both suggests a confusion about whether self-location is evidence of *rank* or evidence of *existence*.

  **3. A Note on Sleeping Beauty**
  This tree uses Beauty as a proxy for your stance on self-locating evidence. However, **Beauty alone does not distinguish a Halfer from a Thirder** in a way that perfectly maps to SSA vs. SIA. Some SSA proponents argue for a Thirder solution via different conditioning, and some SIA proponents argue for Halfer conclusions in specific variants. If you found Node 2 difficult, it indicates your anthropic commitments are not yet fixed by your Beauty intuition alone.
