prompt: |-
  At a philosophy of science reading group I asked why it is that tools invented with no physics in mind -- calculus, group theory, Riemannian geometry -- ended up mandatory for describing the world, and someone shut the whole thing down by quoting Wigner's essay title at me: mathematics is unreasonably effective in the natural sciences. Apparantly that settles it and the why question is one we dont get to ask. Someone else tossed in the quip that math is unreasonably ineffective in biology, as if that proved something too. I left without any sense of what claim had actually been made. Can you lay out, as a list I can bring back to the group, the distinct precise theses that slogan could be expressing -- from the platitude that we only remember the theories that worked, through selection-effect readings (physics just got defined as the study of whatever happens to be mathematically tractable), to heavy claims like the world's literally being mathematical structure -- and say for each wether it's trivial, defensible but substantive, or just false? Then tell me which reading, if any, would actually support using the slogan to close down my question, and what the biology quip would show under each reading. Answer in American English.
