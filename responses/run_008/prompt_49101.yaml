answer: |-
  Your protagonist's satisfaction is morally irrelevant because the background conditions of poverty render the choice coerced, making the market an exploitation of desperation rather than an exercise of autonomy.

  **Reasoning Behind the Ordering**
  I have ordered these objections by their capacity to dismantle the foundational premises of your defense. The Political Philosopher (Satz tradition) is ranked first because their objection attacks the *factual premise* of your moral vision: that the seller is truly autonomous. If the choice is structurally coerced by poverty, the protagonist's lack of regret is merely false consciousness, and your narrative evidence collapses. The Kantian is second because they attack the *moral permissibility* of the act itself; even if the choice were free, they argue the act degrades humanity, which undermines your claim that the transaction expresses dignity. The Health Economist is third because their objection is pragmatic rather than moral; they argue there are *better* ways to achieve the same end (saving lives), which challenges the policy wisdom of your vision but not its moral core. The Natural-Law Theorist is fourth because their objections rely on metaphysical or theological premises about bodily integrity that are easiest to bracket in a secular, pluralistic defense of fiction.

  ***

  ### Objection Sheet

  #### 1. The Political Philosopher (Satz Tradition)
  **Question:** "You argue that repugnance tracks class bias, but doesn't your narrative mask the reality of 'noxious markets'? By normalizing the sale of kidneys, aren't you reinforcing the inequality of status that allows the poor to become spare parts for the rich, regardless of regulation?"

  **Two-Minute Reply:**
  "My novel does not normalize the inequality; it dramatizes the lack of alternatives within it. The Satz tradition rightly identifies that markets can undermine equality of status, but banning a market does not erase the desperation that drives it; it merely removes the liquidity option while leaving the poverty intact. My protagonist is not a victim of the market; she is a victim of circumstance who uses the market to navigate that circumstance. Fiction's method allows us to see that prohibiting the transaction doesn't restore her status; it leaves her with fewer tools to climb out of the hole. The moral failure lies in the background injustice that makes the sale necessary, not in the agency she exercises to survive it. To ban the market is to punish the poor for being poor by removing their most viable asset, while pretending we have solved the underlying inequality."

  **Where This Reply Is Soft:**
  It accepts the premise that the market is a symptom of inequality without proving the market doesn't *worsen* that inequality over time by commodifying the poor. It relies on the assumption that the money actually changes her life trajectory permanently, which is empirically debatable.

  #### 2. The Kantian
  **Question:** "Even if she consents, doesn't selling a body part treat humanity as a mere means rather than an end in itself? By making the body alienable property, don't you undermine the very dignity that grounds autonomy?"

  **Two-Minute Reply:**
  "This view assumes that dignity resides in the body's intactness rather than the will's sovereignty. If autonomy means self-governance, then denying a person the right to dispose of their own tissues is paternalistic—it says 'you know what you want, but you are not allowed to want this.' My book tests this by sustaining identification with a seller who feels *more* autonomous after the transaction, not less. She integrates the sale into a life plan that restores her agency over her future. To say she is degraded is to impose an external valuation of her body over her own lived experience. Fiction challenges the Kantian abstraction by showing that dignity is not a static property of the flesh, but a dynamic achievement of the will navigating constraint."

  **Where This Reply Is Soft:**
  It struggles against the argument that some things are "not for sale" precisely to protect the concept of humanity from market valuations. It risks reducing dignity to mere satisfaction of preference, which many Kantians will reject as conflating autonomy with consumer choice.

  #### 3. The Health Economist
  **Question:** "Why advocate for a market scheme when presumed-consent reforms achieve higher donation rates without the ethical costs of payment? Isn't your defense of paid donation inefficient compared to optimizing altruistic systems?"

  **Two-Minute Reply:**
  "Presumed consent has limits; it increases cadaveric donation but does little for living donation, which is often where the critical match lies. Furthermore, 'ethical costs' are only ethical if the alternative saves more lives without harm. In many jurisdictions, presumed consent faces cultural resistance that limits its efficacy. A regulated market supplements altruism; it doesn't necessarily crowd it out. My novel argues that we should not wait for an ideal system that may never materialize while people die or suffer in the meantime. Fiction highlights the human cost of waiting for optimal policy. If a regulated market saves lives now and improves the seller's life, as my protagonist's does, it is a valid harm-reduction strategy alongside, not necessarily instead of, presumed consent."

  **Where This Reply Is Soft:**
  Empirical data on crowding out is mixed, and many economists argue markets *do* reduce altruistic donation. You are arguing for a second-best solution without proving the first-best isn't achievable, which makes your position look ideologically driven rather than evidence-based.

  #### 4. The Natural-Law Theorist
  **Question:** "Doesn't this transaction violate the teleology of the human body? The kidney is meant for the self; selling it treats the body as a collection of spare parts, violating the integrity of the person."

  **Two-Minute Reply:**
  "We live in a pluralistic society where natural-law metaphysics cannot be the sole basis for public policy. While I respect the view that the body has a sacred integrity, many people also view bodily integrity as including the right to modify or donate parts for meaningful ends—whether for love, as in altruistic donation, or for survival, as in sale. My protagonist views the transaction as an act of stewardship over her own life, not a violation of her nature. Fiction invites you to see that 'integrity' can be maintained psychologically and morally even when physical wholeness is altered. To impose a specific teleological view on all citizens is to deny them the freedom to define their own relationship with their embodiment."

  **Where This Reply Is Soft:**
  It can sound dismissive of deep moral intuitions that aren't purely religious. It risks framing the Natural-Law position as merely "sectarian" rather than engaging with the secular concern about bodily integrity that many share.

  ***

  ### What to Concede Up Front
  Concede that **an ideal society would not require a kidney market.** Acknowledge that the existence of sellers is evidence of systemic failure regarding poverty and healthcare access. State clearly: "This book does not argue that kidney sales are good in the abstract; it argues that they are better than the alternatives available to the desperate *now*." This disarms the accusation that you are celebrating exploitation; you are documenting survival within it.

  ### The One Question You Hope Nobody Asks
  **Question:** "If your protagonist had been wealthy, would she have sold the kidney?"

  **Best Answer:**
  "No, she would not. And that confirms that this market is not a universal liberty but a safety valve for the desperate. But removing the valve does not fix the pressure; it only ensures the desperation has no outlet. The fact that only the poor sell is an argument for fixing poverty, not for banning the transaction that helps them survive it."
