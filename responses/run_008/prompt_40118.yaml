  First, let's draw the distinction you asked for, because it clarifies almost everything on your list. **Unfair blame** is when the content of the criticism is wrong (the act wasn't wrong, or the reaction is disproportionate). **Lack of standing** is when the content is right ("stealing is wrong"), but the *speaker* lacks the moral authority to enforce it because their own relationship to the norm undermines the speech act. Hypocrisy attacks standing, not truth.

  You are looking for a single principle, and you can have one. It is **The Principle of Comparative Current Compliance**.

  Here is the rule: You have standing to blame if your *current* adherence to the specific norm is materially better than the person you are blaming, OR if you explicitly acknowledge your own failure (the "humility waiver"). Your history only matters insofar as it reflects your current commitment.

  **How this unifies your list:**

  *   **Cases 1 & 3 (Active Violators):** Priya (Case 1) is *currently* chronically late; you were late once. Her compliance is worse than yours. No standing. The Gossip (Case 3) is *currently* moderate; the target is destructive. The blamer's compliance is better. Standing intact.
  *   **Cases 2, 4, & 5 (Reformed):** The Uncle, the Apologizer, and the Candid Sister all *currently* uphold the norm better than the target. Their past violations don't count against their current standing because they are now aligned with the norm.
  *   **Case 8 (Domain Specificity):** Standing is norm-specific. "Loyalty" is too abstract. The workaholic upholds *fidelity* (no cheating), even if they fail at *attention*. Different norms, so standing holds.
  *   **Case 6 (The Flip-Flop):** This is resolved by Case 2. The Uncle doesn't necessarily lead every conversation with "I used to smoke." He just quit. If the person in Case 6 has stopped and isn't actively deceiving anyone (they'd admit it if asked), they are currently compliant. **Verdict: Standing.** Silence is not hypocrisy unless it creates a false impression of perfection.
  *   **The Mom Case:** She quit. She is currently compliant. The *motive* for quitting (fear vs. virtue) is irrelevant to standing; standing tracks behavior, not soul-searching. As long as she isn't currently texting and driving, she has standing to shame you for it. **Prediction: She has standing.**

  **The Overturn:**

  To make this principle work consistently, I have to overturn **Verdict 7**.

  In Case 7, the embezzler is a *past* violator (presumably currently employed and compliant, or at least not currently stealing) blaming a *current* petty thief. Under the **Principle of Comparative Current Compliance**, the embezzler is currently upholding the norm of honesty *better* than the petty thief (0 theft vs. $20 theft). Your intuition says "no standing" because the *severity* of the past sin feels like a permanent stain. But if we grant standing to the Uncle (Case 2) who smoked for years, we must grant it to the reformed embezzler. To deny it is to say some sins permanently disqualify you from moral community, which contradicts the logic of Case 2 and Case 4. The embezzler's past is disgusting, but it doesn't revoke their current right to defend honesty.

  Verdict: Comparative Current Compliance, overturn 7
