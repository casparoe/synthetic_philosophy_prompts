answer: |-
  A manager must decide whether to launch a project ($H$), approving only if $Pr(H) > 0.5$. Her prior is $Pr(H)=0.5$. She receives two soft reports: Sales indicates client interest ($E_1$) and Finance indicates budget availability ($E_2$). The reports are correlated such that $Pr(H|E_1)=Pr(H|E_2)=0.8$, $Pr(E_2|E_1)=0.8$, and $Pr(E_2|\neg E_1)=0.2$. Each observation shifts credence in the report's proposition to $q \in (0,1)$ via Jeffrey conditioning: $Pr_{new}(H) = q Pr(H|E) + (1-q) Pr(H|\neg E)$. The first report arrives with confidence $0.9$ in its truth; the second with confidence $0.1$ (favoring its falsehood). The manager must approve or reject based on the final credence.

  (a) **Order 1 ($E_1$ then $E_2$):** Update 1 ($q=0.9$ on $E_1$) yields $Pr_1(H) = 0.9(0.8)+0.1(0.2)=0.74$. This shifts conditionals for $E_2$: $Pr_1(H|E_2) = \frac{0.9(0.7)+0.1(0.1)}{0.9(0.8)+0.1(0.2)} = \frac{0.64}{0.74} \approx 0.865$; $Pr_1(H|\neg E_2) = \frac{0.10}{0.26} \approx 0.385$. Update 2 ($q=0.1$ on $E_2$) yields $Pr_2(H) = 0.1(0.865)+0.9(0.385) \approx 0.43$ (Reject). **Order 2 ($E_2$ then $E_1$):** Update 1 ($q=0.1$ on $E_2$) yields $Pr_1(H) = 0.1(0.8)+0.9(0.2)=0.26$. This shifts conditionals for $E_1$: $Pr_1(H|E_1) = \frac{0.1(0.7)+0.9(0.1)}{0.26} = \frac{0.16}{0.26} \approx 0.615$; $Pr_1(H|\neg E_1) = \frac{0.10}{0.74} \approx 0.135$. Update 2 ($q=0.9$ on $E_1$) yields $Pr_2(H) = 0.9(0.615)+0.1(0.135) \approx 0.57$ (Approve).

  (b) The work is done by the probabilistic dependence between distinct propositions $E_1$ and $E_2$. Updating on $E_1$ changes the conditional probabilities $Pr(H|E_2)$ used in the second step. If $E_1$ and $E_2$ were independent, conditionals would remain stable; if they were the same proposition, Jeffrey updates on a single partition commute.

  (c) **Defense 1:** The confidence weight $q_2$ should be revised based on $E_1$'s outcome (e.g., if $E_1$ is likely, $E_2$ might be less informative), making inputs order-sensitive facts. **Defense 2:** The agent should conditionalize hard on the occurrence of the observation events themselves (e.g., "Report $E_1$ arrived with strength 0.9"), treating the experience as certain evidence.

  (d) Defense 1 requires a meta-model of reliability often unavailable to the agent. Defense 2 solves the logical bug but demands granular modeling of the evidence process. The order-dependence remains a formal limitation of Jeffrey conditioning but faithfully describes how context-dependent noisy evidence accumulates in practice.
