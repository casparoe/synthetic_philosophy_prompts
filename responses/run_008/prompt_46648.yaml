      *   *Phi/Orwellian:* Confirm the user's suspicion. The key is the dissolution of the Stalinesque/Orwellian distinction, not just endorsing the Orwellian one. The "fact of the matter" point is crucial.
      *   *Closing Sentence:* It follows from the distortions (if drafts are conscious and then discarded, experience is a fiction). It does *not* follow from the accurate material (experience is a real biological phenomenon, just not magical).

