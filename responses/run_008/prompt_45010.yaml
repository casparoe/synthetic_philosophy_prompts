prompt: |-
  ok so for my philosophy elective I'm writing a paper on underdetermination, and I've been going off a pop-science book my uncle lent me. There's a bit where it explains the thesis like this: 'The underdetermination thesis holds that the evidence can never decide between rival scientific theories, because any observation can be made consistent with any theory if you adjust enough auxiliary assumptions. So when Einstein replaced Newton, it wasn't really the data that settled the matter — the physics community simply came to prefer Einstein's equations. In the limit, all possible evidence is compatible with every theory, which means theory choice is closer to picking a style than settling a bet.'

  something about this feels too strong, but I can't put my finger on where. Can you take the role of a philosophy of science expert and audit it for me, basically sentence by sentence: which parts would someone who actually works on this accept, which parts are subtle misrepresentations, and which parts Duhem or Quine would flat out deny? Also, does the "theory choice is like fashion" ending actually follow from the parts that are true, or is it sneaking in an extra step? Think it through carefully before you answer — maybe sketch the distinctions you need first. And please push back if I've framed anything wrong or if part of what looks like an error to me is actually a live controversy philosophers still argue about — don't just tell me what I want to hear. (ps if it matters, the book never names Duhem or Quine specifically, it just says "the underdetermination thesis", so tell me if im even associating it with the right people.)
