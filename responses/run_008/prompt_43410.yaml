      *   *Re-reading prompt:* "install TWO chips, each doing half of N's job... then a week later we quietly delete one of the pair."
      *   *Implication:* If each does *half*, then deleting one leaves the other doing *half*. Unless the remaining chip scales up? The prompt says "Functionally the end state is identical to the plain 1-for-1 swap." This implies the remaining chip *becomes* the functional equivalent of the original neuron, or the "half job" description was just about load-bearing redundancy. Let's assume the latter: they are redundant copies of the function, not split functions. (Prompt: "each one fires if the other one does" implies redundancy, not splitting the computation).
