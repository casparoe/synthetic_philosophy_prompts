prompt: |-
  I am the clinical ethics consultant at a mid-sized hospital, and our ethics committee keeps getting referred the same kind of case: a written advance directive that stands in some tension with what the patient, now cognitively impaired, says or does in the present — and we have no settled procedure that tells the attending team what to do next. The disagreements are currently resolved by whoever in the room is most forceful, which is worse than either of the outcomes being fought over. The committee has asked me to draft a decision procedure they can actually run in a conference room in under an hour, and I want it grounded in the philosophical debate about whether and why an earlier self has authority over a later one — not just in hospital custom.

  As its first move, the procedure should distinguish between two readings of a directive that our ad hoc discussions blur together: the directive as an exercise of authority (the earlier self issuing binding instructions, Ulysses ordering himself bound to the mast) and the directive as evidence (a fallible record of what this person valued, defeasible by fresher evidence). Behind that distinction sit the questions we keep circling: Dworkin's contrast between critical interests in the shape of a life as a whole and experiential interests in present satisfaction, and which of them the directive protects; the objection that the person in the bed now has interests of her own that the earlier self cannot claim to speak for merely by having once been the same person; and the countervailing worry that if the earlier self binds the later one too tightly, we treat the patient as a means to the closure of a biography she no longer knows she has.

  What I need:

  1. A stepwise procedure: the questions to ask in order, what counts as a sufficient answer to each, and, at every step, which of four doors the answer opens — follow the directive, follow the present patient, hand the decision to the surrogate, or declare the question one of values that the committee must decide and cannot derive. It must contain a diagnostic step for whether the directive is about the intervention it names or the condition it feared: a clause refusing a feeding tube, written by someone who chiefly dreaded being a burden on her children, may or may not apply to a patient who is untroubled, unbothered, and happily unaware of being a burden, and our teams cannot currently tell which reading to use.

  2. A rule for the hardest class of conflict: directives written many years earlier, by a person now substantially different in values and temperament. One committee member proposes a decay rule — the directive loses authority in proportion to documented change in the person's character — and I want the procedure to adopt it, reject it, or replace it with something workable, with reasons a non-philosopher can follow.

  3. Worked applications to three cases, at least one of which must end somewhere I won't like:

  (a) Mrs. A, moderate dementia, wrote a directive eight years ago refusing artificial nutrition should she become unable to recognize her family. She now fails to recognize them on most days but not all, is cheerful, eats willingly when food is offered by hand, and has begun saying that she wants to keep going, at moments the nurses dispute are lucid. Her daughter wants the directive honored the moment swallowing fails; her son points at the cheerfulness and the phrase about recognizing family, arguing it was a proxy for something else.

  (b) Mr. B, a retired professor, severe dementia, untroubled and affable. His directive says no heroics, nothing that prolongs the dying. He develops a treatable infection; antibiotics would likely restore him to his current pleasant state, which is not a state he would recognize as his life's work but is a state he enjoys. He cannot discuss it. The family splits between reading the directive as his final judgment on his life as a whole and reading it as a fear of intensive care that this scenario never touches.

  (c) The case I am hoping the procedure never reaches but suspect it will: a patient who, while competent, wrote into his directive an instruction that it be honored even against his own later objections, and who now, moderately impaired and distraught, is asking that everything be done. The procedure must say whether an earlier self can pre-commit against its own future voice, and where, if anywhere, that stops being autonomy and becomes the past person wielding the present one.

  4. A closing statement of the procedure's limits: the kinds of cases it should refuse to settle, and the points at which it must openly hand the decision to the human beings in the room, marked as judgment rather than dressed up as the output of the steps.

  Constraints: the procedure must be usable by committee members with no philosophical training; every philosophical term it employs must be explained in a single line the first time it appears; and it should not lean on any statute, case, or jurisdiction, since its job is to structure deliberation, not replace the lawyers.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Clinical Ethics Consultant at a mid-sized hospital.
      *   **Problem:** Recurring cases where written advance directives (AD) conflict with the current behavior/statements of a cognitively impaired patient. Current resolution is ad hoc/forceful.
      *   **Goal:** A stepwise decision procedure usable in <1 hour, grounded in philosophical debates (Dworkin, precedent autonomy vs. current interests), but accessible to non-philosophers.
      *   **Key Requirements:**
          1.  Distinguish AD as *Authority* (binding instruction) vs. *Evidence* (value indicator).
          2.  Include a diagnostic step for *Intervention vs. Condition* (what was actually feared?).
          3.  Address the "Decay Rule" (does the AD lose authority as the person changes?).
          4.  Provide three worked cases (Mrs. A, Mr. B, and the "Pre-commitment against Objections" case), with at least one counter-intuitive outcome.
          5.  Closing statement on limits (where judgment overrides procedure).
          6.  **Constraints:** No legal statutes, explain philosophical terms in one line, usable by non-philosophers.

  2.  **Deconstruct the Philosophical Underpinnings:**
      *   *Dworkin's Critical vs. Experiential Interests:* Critical = life narrative/integrity; Experiential = present pleasure/pain. ADs usually protect Critical. Current behavior reflects Experiential.
      *   *Precedent Autonomy:* The right of the past self to dictate to the future self.
      *   *The "Odysseus" Problem:* Binding oneself to the mast. Is it valid if the future self wants to be untied?
      *   *Identity/Continuity:* If the person changes enough, is the AD still *their* instruction?
      *   *Authority vs. Evidence:* Is the AD a command (must follow) or a clue (helps decide)?

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Validity & Applicability.* Standard stuff. Is it signed? Does the medical condition match?
      *   *Step 2: The Authority/Evidence Distinction.* This is the core request. I need a question that forces the committee to decide: "Is this a command or a clue?"
          *   *Criteria for Authority:* Specific language ("I direct"), specific conditions, discussion with surrogate.
          *   *Criteria for Evidence:* General values ("I don't want to be a burden"), vague conditions.
      *   *Step 3: The "Fear vs. Intervention" Diagnostic.* The prompt specifically asks for this. A refusal of a feeding tube might be about *not being a burden*, not the tube itself. If the burden fear is gone (patient is happy/unaware), does the refusal stand?
      *   *Step 4: The Continuity/Decay Question.* Addressing the "Decay Rule."
          *   *Decision:* I should reject a mathematical "decay" rule (too hard to measure) and replace it with a "Threshold of Discontinuity." If the current self is fundamentally different in values *and* capable of experiencing well-being, the AD shifts from Authority to Evidence.
      *   *Step 5: Current Objections.* If the patient currently objects, how much weight does that carry?
      *   *Step 6: The Four Doors.* Follow AD, Follow Patient, Surrogate, Ethics Committee (Values).

  4.  **Refining the Steps for Usability (Non-Philosophers):**
      *   Avoid jargon like "ontological continuity." Use "Same Person Test."
      *   Define terms immediately (e.g., "Critical Interests: Goals that give a life meaning, not just momentary pleasure.").
      *   Make it a flowchart logic.

  5.  **Developing the Worked Cases:**
      *   *Mrs. A (Moderate Dementia):* AD says no nutrition if can't recognize family. She sometimes recognizes them. She is happy.
          *   *Analysis:* Condition not fully met (sometimes recognizes). Fear (burden/loss of self) vs. Reality (happy).
          *   *Outcome:* Likely follow current patient/surrogate consensus to feed, treating AD as evidence of values but not binding authority due to condition mismatch and current well-being.
      *   *Mr. B (Severe Dementia, Infection):* AD says "no heroics/prolong dying." Infection is treatable. He is happy but "not himself."
          *   *Analysis:* Is an infection "dying"? No. Is restoring him to *this* state violating his critical interests?
          *   *Outcome:* Treat. The AD protects against *dying*, not against living with dementia. This is a common misinterpretation.
      *   *Case C (The Ulysses Contract):* Competent self said "Ignore future me." Future self says "Save me."
          *   *Analysis:* This is the hardest. If we honor the AD, we override current distress. If we ignore it, we violate precedent autonomy.
          *   *Outcome:* I need one outcome I "won't like." As an ethicist, I might prefer autonomy. But if the current distress is severe and the condition is reversible, honoring the AD looks like cruelty. However, to be philosophically consistent with *critical interests*, the AD should hold *unless* the current self is suffering significantly. Let's make the outcome: Honor the AD (bind to the mast), *but* only if the suffering is manageable. If the suffering is extreme, the "Decay/Discontinuity" rule kicks in. Actually, the prompt asks for a case I suspect it will reach. Let's go with: Honor the AD. It's the uncomfortable result that upholds the "Life as a Whole" view, even if it hurts the current self. *Correction:* The prompt says "at least one of which must end somewhere I won't like." As the consultant drafting this, I might not like overriding a distressed patient. So, the procedure should dictate honoring the AD here, which feels harsh. Or, the procedure dictates ignoring the AD, which feels like violating autonomy. Let's choose the path that prioritizes the *Critical Interest* (AD) over the *Experiential Interest* (Current distress) in this specific pre-commitment case, as that is the philosophically rigorous "Ulysses" outcome, even if it feels clinically cold.
          *   *Wait, re-reading:* "The procedure must say whether an earlier self can pre-commit against its own future voice."
          *   *Decision:* The procedure will allow pre-commitment *only if* the current distress is not severe suffering. If the patient is "distraught," that implies suffering. I will structure the rule to say: Pre-commitment holds *unless* the current state involves severe, unmanageable distress. In the specific case described ("distraught"), the procedure should likely pivot to protecting the current self. *Actually, let's make it harder.* Let's say the procedure upholds the AD. That is the "I won't like it" outcome (overriding a distraught patient). This highlights the tension.

  6.  **Addressing the "Decay Rule":**
      *   The prompt asks to adopt, reject, or replace.
      *   *Decision:* Reject the mathematical "decay." Replace with "Threshold of Discontinuity." If the patient's current values and capacity for enjoyment are fundamentally different *and* the AD was based on a fear of *this specific state* which is no longer feared by the patient, the AD loses Authority status and becomes Evidence.

  7.  **Drafting the Content (incorporating constraints):**
      *   *Tone:* Professional, directive, clear.
      *   *Formatting:* Numbered steps, bold keys.
      *   *Definitions:* Inline, one sentence.
      *   *Time Limit:* Keep steps concise.

  8.  **Review against Constraints:**
      *   < 1 hour? Yes, if steps are binary.
      *   Philosophical terms explained? Yes (Critical/Experiential, Precedent Autonomy).
      *   No law? Yes.
      *   4 Doors? Yes.
      *   Diagnostic step (Intervention vs Condition)? Included in Step 3.
      *   Decay Rule? Addressed in Step 4.
      *   3 Cases? Yes.
      *   Closing Limits? Yes.

  9.  **Final Polish:**
      *   Ensure the distinction between Authority and Evidence is the engine of the whole procedure.
      *   Make sure the "I won't like it" case is clearly identified as such in the commentary.
      *   Check the "Distraught" case logic. If the patient is distraught, overriding them is hard. But if the AD explicitly says "Ignore my future objections," honoring it is the only way to respect the *competent* self. I will draft the procedure to honor the AD in Case C, noting the ethical cost.

      *(Self-Correction on Case C)*: If the patient is "distraught," causing them harm to honor a paper document is clinically difficult. However, the prompt asks for a procedure grounded in the *philosophical debate*. The Dworkin view (Critical Interests) supports the AD. The "Current Interest" view supports the patient. To make this a robust tool, it must take a stand. I will have the procedure prioritize the AD *unless* the current suffering reaches a threshold of "inhumane treatment." In Case C, if "distraught" means severe psychological pain, the procedure should likely pivot to the patient. But the prompt says "end somewhere I won't like." As an ethics consultant, I usually want to protect the vulnerable present patient. So, a procedure that forces me to honor the AD against a distraught patient is the "unlikeable" outcome. I will structure it that way to demonstrate the weight of Precedent Autonomy.

      *Wait, let's refine the "Decay Rule" instruction.* The prompt says "I want the procedure to adopt it, reject it, or replace it." I will *replace* it with a "Continuity Threshold." A decay rule implies gradual loss. A threshold implies a binary shift from Authority to Evidence. This is more workable.

      *Let's refine the "Four Doors".*
      1. Follow Directive (Authority).
      2. Follow Patient (Current Interests).
      3. Surrogate Decision (Substituted Judgment/Best Interest).
      4. Ethics Committee (Values Conflict).

      *Let's write.*

      *(Final check on Case C)*: The prompt says "The procedure must say whether an earlier self can pre-commit against its own future voice." I need to be explicit. The procedure will say "Yes, but..." The "but" is the safety valve.

      *Let's check the constraint:* "every philosophical term it employs must be explained in a single line the first time it appears." I need to be careful with definitions.

      *Let's check the constraint:* "at least one of which must end somewhere I won't like." I will explicitly note this in the commentary for Case C.

      *Let's check the constraint:* "diagnostic step for whether the directive is about the intervention it names or the condition it feared." This needs to be Step 3.

      Okay, ready to draft.

      *Structure:*
      1. Introduction (Purpose & Scope).
      2. Definitions (Glossary).
      3. The Procedure (Steps 1-6).
      4. The "Decay/Continuity" Rule (Step 4 detail).
      5. Worked Cases (A, B, C).
      6. Limits of the Procedure.

      *Refining Step 4 (The Continuity/Decay):* I will replace the "decay rule" with a "Discontinuity Threshold." Reason: Decay is hard to measure (how much authority is lost after 5 years?). Discontinuity is binary (Is this still the same moral agent?). This is more workable for a 1-hour meeting.

      *Refining Case C:* The patient is "distraught." Honoring the AD means ignoring distress. This is the "won't like" outcome. I will ensure the procedure leads there but flags the moral residue.

      *Wait, one more check:* "Hand the decision to the surrogate" vs "Committee must decide." I need to make sure the flow leads to one of the four doors clearly.

      *Okay, let's assemble.*
answer: |-
  # The Precedent Autonomy & Current Interest Protocol (PACIP)

  **Purpose:** To resolve conflicts between a written advance directive (AD) and the current behavior or statements of a cognitively impaired patient within a 60-minute committee review.
  **Scope:** Applies only when the patient lacks decision-making capacity and a valid AD exists but appears contradicted by the patient's present demeanor or statements.
  **Constraint:** This protocol structures moral deliberation; it does not override statutory law or hospital policy.

  ### I. Glossary of Terms
  *   **Precedent Autonomy:** The right of a competent past self to make binding decisions for their future incompetent self.
  *   **Critical Interests:** Goals and values that give a life narrative meaning (e.g., dignity, independence), distinct from momentary pleasure.
  *   **Experiential Interests:** The capacity to feel pleasure or pain in the present moment, regardless of life history.
  *   **Authority:** The directive acts as a binding command that must be obeyed.
  *   **Evidence:** The directive acts as a clue to the patient's values but can be overridden by current well-being.

  ---

  ### II. The Decision Procedure

  **Step 1: The Threshold of Applicability**
  *   **Question:** Does the current medical condition match the specific clinical trigger named in the directive?
  *   **Sufficient Answer:** "Yes" requires a medical match (e.g., directive says "permanent coma," patient is in "permanent coma"). "No" means the trigger has not been met.
  *   **Decision:**
      *   If **No**: Stop. The directive is not active. Treat based on current best interest (Door 3: Surrogate).
      *   If **Yes**: Proceed to Step 2.

  **Step 2: The Authority vs. Evidence Test**
  *   **Question:** Did the patient intend this document to be a binding command or a statement of values?
  *   **Sufficient Answer for Authority:** The document uses imperative language ("I direct," "I forbid"), specifies the exact scenario, and was discussed with the surrogate.
  *   **Sufficient Answer for Evidence:** The document uses value language ("I don't want to be a burden," "I value dignity"), is vague on conditions, or was never discussed.
  *   **Decision:**
      *   If **Authority**: Proceed to Step 3 (The directive is presumed binding).
      *   If **Evidence**: Proceed to Step 4 (The directive is one factor among many).

  **Step 3: The Fear vs. Intervention Diagnostic**
  *   **Question:** Is the directive refusing a specific *medical intervention* (e.g., a tube), or is it refusing a *condition of existence* (e.g., being a burden, not knowing family)?
  *   **Sufficient Answer:** Review the "Why" in the directive or surrogate testimony. If the patient feared *being a burden*, but is currently unaware of being a burden, the condition feared is absent even if the medical need is present.
  *   **Decision:**
      *   If **Intervention Focus**: The refusal stands regardless of patient mood. (Door 1: Follow Directive).
      *   If **Condition Focus**: Proceed to Step 4. (The fear may no longer apply).

  **Step 4: The Continuity Threshold (Replacing the Decay Rule)**
  *   **Question:** Is the current patient sufficiently discontinuous from the author of the directive that enforcing the directive treats them as a means to a biography they no longer possess?
  *   **Rule:** We reject a "decay rule" (authority fading over time) because time does not equal change. We adopt a **Continuity Threshold**. Authority is retained *unless* the patient's current values and capacity for enjoyment are fundamentally different *and* the patient shows no signs of distress regarding the condition they once feared.
  *   **Sufficient Answer for Discontinuity:** The patient is cheerful, expresses contrary wishes (even if impaired), and shows no understanding of the "critical interests" (e.g., dignity) that motivated the AD.
  *   **Decision:**
      *   If **Continuity Retained** (Patient is distressed or values align): (Door 1: Follow Directive).
      *   If **Continuity Broken** (Patient is happy, values shifted): The directive shifts from Authority to Evidence. (Door 2: Follow Patient).

  **Step 5: The Objection Check**
  *   **Question:** Is the patient currently objecting to the care plan, and does the directive explicitly instruct us to ignore such objections?
  *   **Sufficient Answer:** Review the AD for a "Ulysses Clause" (instruction to ignore future objections).
  *   **Decision:**
      *   If **No Ulysses Clause** + **Current Objection**: (Door 2: Follow Patient).
      *   If **Ulysses Clause** + **Current Objection**: Proceed to Step 6.

  **Step 6: The Suffering Safety Valve**
  *   **Question:** Does honoring the Ulysses Clause cause severe, unmanageable physical or psychological suffering to the current patient?
  *   **Sufficient Answer:** Clinical assessment of distress (agitation, crying, resistance) that cannot be soothed.
  *   **Decision:**
      *   If **No Severe Suffering**: (Door 1: Follow Directive).
      *   If **Severe Suffering**: (Door 4: Committee Decision on Values). *Note: This is the only step where the committee decides the value conflict directly.*

  ---

  ### III. The Four Doors (Outcomes)
  1.  **Follow Directive:** The AD is binding Authority. Treat according to the written word.
  2.  **Follow Patient:** The AD is Evidence or overridden by Continuity Threshold. Treat according to current behavior/comfort.
  3.  **Surrogate Decision:** The AD is inactive or ambiguous. The legal surrogate decides based on substituted judgment.
  4.  **Committee Values Decision:** The conflict is irreconcilable (e.g., Severe Suffering vs. Ulysses Clause). The committee votes on which value (Past Autonomy vs. Present Non-Maleficence) takes precedence.

  ---

  ### IV. Worked Applications

  #### Case A: Mrs. A (The Condition Mismatch)
  *   **Facts:** AD refuses nutrition if unable to recognize family. Moderate dementia. Recognizes family *sometimes*. Cheerful. Says "want to keep going."
  *   **Application:**
      *   Step 1: Condition not fully met (she recognizes them *sometimes*).
      *   Step 3: Diagnostic suggests the fear was "loss of self/connection," not the tube itself.
      *   Step 4: Continuity Threshold. She is cheerful and expresses a wish to live. The "critical interest" (dignity via recognition) is not currently experienced as violated.
  *   **Outcome:** **Door 2 (Follow Patient).** The directive serves as evidence she valued connection, but since the condition is not fully met and she is currently content, we do not enforce the refusal. Hand feeding continues.
  *   **Comment:** This respects the *spirit* of the AD without enforcing the *letter* against a happy patient.

  #### Case B: Mr. B (The Definition of Dying)
  *   **Facts:** AD refuses "heroics" to "prolong dying." Severe dementia, happy. Treatable infection. Family split on interpretation.
  *   **Application:**
      *   Step 1: Is an infection "dying"? Medically, no. It is an acute reversible condition.
      *   Step 3: Fear vs. Intervention. The fear was likely "prolonging the end of life," not "treating reversible setbacks in a chronic state."
      *   Step 4: Continuity. He is affable. Treating him restores him to *this* state, not a pre-dementia state.
  *   **Outcome:** **Door 3 (Surrogate Decision).** The directive is ambiguous regarding acute vs. terminal care. Since the AD is Evidence (vague terms like "heroics"), the surrogate must interpret his values. However, the committee advises that "dying" does not equal "living with dementia."
  *   **Comment:** This prevents the AD from becoming a "do not treat" order for minor ailments, preserving the patient's experiential interests.

  #### Case C: The Ulysses Contract (The "I Won't Like It" Outcome)
  *   **Facts:** Competent self wrote: "Honor this even if I object later." Now moderately impaired, distraught, asking for "everything done."
  *   **Application:**
      *   Step 2: Authority (Explicit instruction).
      *   Step 5: Ulysses Clause present.
      *   Step 6: Suffering Safety Valve. The patient is "distraught." Is this *severe, unmanageable suffering*?
      *   **Scenario:** Assume the distress is emotional (begging, crying) but manageable with sedation/support, not physical torture.
  *   **Outcome:** **Door 1 (Follow Directive).**
  *   **Comment:** This is the outcome I, as a consultant, find hardest to accept. It prioritizes the *Critical Interests* of the past self over the *Experiential Interests* of the present self. The procedure dictates that unless the suffering reaches a threshold of inhumanity (Step 6), the competent self's right to shape their life's narrative (Precedent Autonomy) overrides the impaired self's fluctuating desires. To rule otherwise renders all advance directives useless the moment a patient changes their mind.
  *   **Why I won't like it:** It requires us to ignore a distraught human being in front of us to satisfy the abstract autonomy of a ghost. But without this, the "Ulysses" contract is meaningless.

  ---

  ### V. Closing Statement: Limits of the Procedure

  This procedure is a tool for structuring deliberation, not a machine for generating moral truth. It must **not** be used in the following circumstances, which require open ethical judgment (Door 4) rather than algorithmic steps:

  1.  **Suspected Coercion:** If there is any evidence the AD was signed under family pressure, Step 2 (Authority) is voided immediately.
  2.  **Ambiguous Suffering:** In Step 6, if the committee cannot agree on whether the patient's distress is "severe," do not default to the Directive. Default to protecting the vulnerable present patient.
  3.  **Surrogate Conflict:** If the surrogate is using the AD to advance their own interests (e.g., inheritance, caregiver burden) rather than the patient's, the procedure halts. This becomes a safeguarding issue.

  **Final Instruction to Committee:**
  When this procedure ends at Door 1 (Follow Directive) against the visible distress of the patient (as in Case C), you must explicitly acknowledge the **Moral Residue**. Record in the notes: *"We are honoring the precedent autonomy of the competent self, acknowledging that this causes distress to the current self."* Do not dress this up as a medical necessity. It is a value choice to prioritize the biography over the biography's current chapter. Name it as such.
