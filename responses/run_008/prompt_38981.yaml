answer: |-
  This is the exact bottleneck everyone hits once mech interp moves from toy models to production-sized safety cases. You are fighting the **Map-Territory Problem**: you want to treat the feature (the map) as the mechanism (the territory), but high-dimensional geometry allows for infinite maps that fit the territory equally well.

  If your audit story relies on "The model has a deception module," and the deception module is actually just "One of twelve equally valid bases that all allow us to suppress lying behavior," your audit is vulnerable.

  Here is a decision procedure designed to be run in an afternoon. It does not solve philosophy. It operationalizes **robustness**. If a feature survives these cuts, it is *robust enough to bet on*, even if we can't prove it is ontologically unique.

  ### The Feature Reality Check (FRC) v1.0

  **Goal:** Distinguish between *Stable Handles* (interventions that work reliably) and *Projection Artifacts* (patterns that exist primarily in the analyzer's head).
  **Time:** ~4 hours per claim.
  **Owner:** The researcher making the claim (peer-reviewed by one skeptic).

  ---

  #### Step 1: The Baseline Trap (Linearity & Overfitting)
  *The Issue:* In high dimensions, almost everything is linearly separable. A 99% probe often just memorizes the subspace.
  *   **Action:** Train 10 probes on **randomized labels** (same class balance, shuffled) using the same architecture/hyperparameters.
  *   **Action:** Train 10 probes on **permuted features** (shuffle the activation vectors across samples, keep labels intact).
  *   **Pass:** Claimed accuracy is >2 standard deviations above the max accuracy of the random-label baseline.
  *   **Fail:** Claimed accuracy is within 5% of the random baseline.
  *   **Judgment Call:** If the baseline is 45% and your probe is 65%, is that signal or noise? (Rule of thumb: If <70% on binary tasks, treat as noise for safety cases).
  *   **Stop Condition:** If **Fail**, stop. Do not proceed to ablation. Mark as "Statistical Artifact."

  #### Step 2: The Polysemanticity Check (Specificity)
  *The Issue:* A feature might fire on your target concept, but if it also fires on 50 other unrelated concepts, it's not a "representation of X," it's a "bucket of miscellaneous high-activation stuff."
  *   **Action:** Extract the top 50 activating inputs from a diverse, unlabeled dataset (not the training set).
  *   **Action:** Manually label these 50 inputs. Calculate the % that semantically match the claimed feature.
  *   **Pass:** >80% of top activators match the claimed semantic concept.
  *   **Fail:** <50% match, or the "matches" require convoluted justifications (e.g., "It fires on hex numbers and hexagons, so it's clearly 'six-ness'").
  *   **Judgment Call:** What counts as a "convoluted justification"? (Rule: If you have to explain the connection for more than 30 seconds during the retro, it's a Fail).
  *   **Stop Condition:** If **Fail**, mark as "Polysemantic Cluster." You can still ablate it, but you cannot claim it *represents* the concept.

  #### Step 3: Basis Stability (The Rotation Problem)
  *The Issue:* SAEs are non-convex. If you retrain with a different seed, do you get the same feature? If Feature A and Feature B are rotations of each other and both work, neither is "Real."
  *   **Action:** Retrain the SAE (or probe) with 3 different random seeds.
  *   **Action:** Compute the cosine similarity between the claimed feature vector and the closest matching feature in the new runs.
  *   **Pass:** Cosine similarity >0.8 across seeds, OR the *functional behavior* of the closest match is identical (see Step 4).
  *   **Fail:** The feature disappears or merges into a different direction entirely in retrained models.
  *   **Judgment Call:** If the vector changes but the *ablation effect* stays the same, is it the same feature? (Verdict: It is a *Stable Handle*, but not a *Unique Representation*. Adjust language accordingly).
  *   **Stop Condition:** If **Fail**, mark as "Basis-Dependent." Do not use for ontological claims ("The model believes...").

  #### Step 4: Causal Specificity (The Intervention Test)
  *The Issue:* Ablating a feature might change behavior, but so would ablating a dozen other things. Does *this* feature control *that* behavior specifically?
  *   **Action:** Perform the ablation on an OOD (Out-of-Distribution) dataset.
  *   **Action:** Perform a **control ablation**: Ablate a feature with similar activation magnitude but unrelated semantics (e.g., a "comma" feature).
  *   **Pass:** Target ablation causes significant behavioral shift (p<0.01); Control ablation does not.
  *   **Fail:** Control ablation causes similar behavioral shift (suggests you're just breaking capacity, not targeting a mechanism).
  *   **Judgment Call:** How much behavioral shift is enough? (Must be defined per metric, e.g., "Lie rate drops by >20%").
  *   **Stop Condition:** If **Fail**, mark as "Non-Specific Intervention." The lever works, but it's not connected to the engine you think it is.

  #### Step 5: The Semantic Label Audit (The "Creeps" Test)
  *The Issue:* Even if the intervention works, the *name* might be anthropomorphic projection.
  *   **Action:** Write down the claim: "The model uses Feature F to represent Concept C."
  *   **Action:** Rewrite the claim instrumentally: "Suppressing Feature F reduces Behavior B."
  *   **Decision:** If the safety case requires the first statement, but you only passed Step 4 (Instrumental), you must flag the risk.
  *   **Judgment Call:** **This step is 100% Judgment.** There is no test for intentionality.
  *   **Output:** A "Confidence Level" on the label (High/Medium/Low).

  ---

  ### Running the Procedure on Your Cases

  Here is the verdict if you run this FRC on your three recurring cases tomorrow.

  #### Case 1: The Hex Feature (SAE)
  *Claim:* Represents "Hexadecimal/Hexagons." Ablation removes hex reading.
  *   **Step 1 (Baseline):** Pass. SAE features usually clear random baselines easily.
  *   **Step 2 (Specificity):** **FAIL.**
      *   *Reasoning:* You said it fires on `0x` literals *and* photographs of hexagons. Unless this is a multimodal model sharing a trunk, this is a massive semantic gap. If it is a VLM, firing on both suggests it captures "six-sidedness" abstractly, *or* (more likely) it is a polysemantic feature capturing a specific activation pattern that happens to correlate with both in your training set.
      *   *The Trap:* You named it after the first thing you saw (text), then found images later and kept the name.
  *   **Step 3 (Stability):** Likely **FAIL**. Features that bridge modalities or distinct semantic clusters often split when SAEs are reseeded.
  *   **Verdict:** **Do not call this a "Hex Representation."**
      *   *Safe Claim:* "Feature F-129 is a stable handle for suppressing hex-processing behavior."
      *   *Unsafe Claim:* "The model has a concept of hexagons."
      *   *Audit Risk:* High. If the feature splits in the next model version, your safety case breaks.

  #### Case 2: The Lie Probe
  *Claim:* Detects when the model is about to lie. 97% train, 61% fresh.
  *   **Step 1 (Baseline):** **FAIL.**
      *   *Reasoning:* A drop from 97% to 61% on fresh data is the definition of overfitting. In a high-dimensional space, 61% is often indistinguishable from a random probe that got lucky on the class imbalance.
      *   *Action:* Run the random label baseline. I guarantee you the random baseline will hit 55-58%. Your 61% is not signal.
  *   **Verdict:** **Reject.**
      *   *Hard Truth:* You cannot ship this to auditors. It is a statistical artifact. If you claim this is a "Lie Detector," you are lying to the auditors.
      *   *Why you won't like this:* I know you want to ship it. It's load-bearing. But Step 1 kills it.

  #### Case 3: The Deception Feature
  *Claim:* Ablation stops deception OOD. You still feel creepy calling it "deception."
  *   **Step 1-4:** Let's assume **PASS**. (You said ablation works OOD and specifically).
  *   **Step 5 (Semantic Label):** **JUDGMENT CALL (LOW CONFIDENCE).**
      *   *Reasoning:* The procedure validates the *causal lever*, not the *mental state*.
      *   *The Trap:* You have proven "Suppressing F-Decept reduces lying." You have *not* proven "F-Decept is the location of the model's intent to deceive."
      *   *Alternative Hypothesis:* F-Decept might be "High-stakes reasoning." Ablating it makes the model too dumb to lie effectively, not more honest.
      *   *Verdict:* **Instrumentally Real, Ontologically Unknown.**
      *   *Audit Language:* You must write: "Intervention on Feature F reduces deceptive outputs." You cannot write: "We removed the deception module."
      *   *Why this matters:* If the feature is actually "complex reasoning," ablating it might stop deception today but break helpfulness tomorrow, or stop deception only on simple tasks.

  ---

  ### The Uncomfortable Answer (Case 4: The Basis Ambiguity)

  You asked for a case where the procedure gives an answer you won't like. Here is the scenario that will break your safety story if you don't address it now.

  **Case 4: The Rotated Deception**
  *Scenario:* You find Feature A (Deception). It passes Steps 1-4.
  *New Test:* Your team retrains the SAE with a different seed. They find Feature B.
  *Result:* Feature B is *orthogonal* to Feature A (cosine sim 0.1). They are mathematically different directions.
  *However:* Ablating Feature B *also* stops deception, with the same efficacy.
  *And:* There exists a Feature C (a linear combination of A and B) that *also* works.

  **FRC Verdict:** **Ontological Failure.**
  *   **Why:** If A, B, and C are all valid "Deception Features" but point in different directions, then "Deception" is not a vector in the model. It is a *subspace*.
  *   **The Hard Truth:** "The model has a deception feature" is false. "There is a deception subspace we can intervene on" is true.
  *   **Audit Impact:** If your safety story relies on monitoring *a specific feature* (Feature A), you are vulnerable. The model could shift its deception into the orthogonal direction (Feature B) without changing its loss or behavior, and your monitor would read 0.
  *   **Procedure Output:** You must flag this as **"Subspace Instability."** You cannot claim to have found *the* representation. You have found *a* handle.

  ### Summary for the Retro

  1.  **Stop arguing about "Real."** Start arguing about "Stable." Use the FRC to grade stability.
  2.  **Case 2 (Lie Probe) is dead.** Do not waste time on it. The OOD drop is fatal.
  3.  **Case 1 (Hex) is polysemantic.** Rename it to avoid ontological claims.
  4.  **Case 3 (Deception) is instrumental.** You can ship the *intervention*, but you must downgrade the *explanation*.
  5.  **The Audit:** Your safety story must shift from "We monitor what the model wants" to "We monitor and suppress activation patterns correlated with unsafe outputs." It is less sexy, but it is defensible.

  **Final Note:** The "creeps" you feel in Case 3? Keep them. That is your intuition telling you that Step 5 (Semantics) is not satisfied. The procedure validates the *switch*, not the *light*. For an audit, a working switch is often enough, provided you don't claim to understand the wiring better than you do.
