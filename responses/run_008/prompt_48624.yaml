answer: |-
  The session centres on a three-stage tournament of Hex where students first play blindly, then attempt to execute a guaranteed but unknown winning strategy, and finally reconstruct the non-constructive proof that guarantees its existence.

  ### Setup and Materials

  *   **Room:** Arrange desks into seven pairs. Each pair needs space for a board and two players.
  *   **Boards:** Print seven A3 sheets with an 11×11 hexagonal grid. (Do not use 5×5 or 7×7; these are small enough for brute-force solutions to be stumbled upon, which ruins the philosophical point. 11×11 is standard Hex size; the game tree is large enough that no human can solve it in situ, yet games conclude quickly.)
  *   **Counters:** Provide two sets of distinct counters (e.g., red and blue glass beads or plastic discs) for each pair. Do not use pens; mistakes must be undoable without distracting erasing.
  *   **Whiteboard:** Ensure you have space to draw a large hex grid and diagram the 'stealing' argument.
  *   **Handouts:** A single sheet per student containing the rules of Hex and a record sheet for the rounds.

  ### Sequence of Rounds

  **1. Introduction and Rules (10 minutes)**
  Explain the rules of Hex clearly: players alternate placing counters on empty hexes; the goal is to connect opposite sides with a continuous chain of one's own colour; the game cannot end in a draw. Do not mention who has the advantage. Do not use the term 'strategy-stealing'. Distribute boards and counters.

  **2. Round One: Empirical Play (20 minutes)**
  Students play one game per pair. Half the pairs start with Red, half with Blue (assign this explicitly to ensure role balance). They must record the winner and the number of moves.
  *   **Instruction:** "Play to win. There is no guarantee that either side can force a win; treat this as an open empirical question."
  *   **Post-Game:** Collect the results. Likely, you will have a mix of First and Second player wins due to human error. Ask the class: "Based on this data, does First have a winning strategy?" (Expect uncertainty).

  **3. Round Two: The Existence Challenge (20 minutes)**
  Reset the boards. Keep the same pairs but swap colours so everyone plays First once.
  *   **Instruction:** "For this round, I am asserting a mathematical theorem: in Hex, the First Player *must* have a winning strategy. You are the First Player. You do not know what the strategy is, but you are told it exists. Your instruction is to win using this strategy. The Second Player knows you have this guarantee and must try to thwart you."
  *   **The Experience:** The First Player will feel the burden of the guarantee without the means to execute it. They will likely lose or play hesitantly. The Second Player may win, creating a tension between the theorem and the result.
  *   **Post-Game:** Ask the First Players: "Did knowing the strategy existed help you find the moves?" (Universal answer: No).

  **4. Round Three: Reconstructing the Proof (25 minutes)**
  Bring the class back to the whiteboard. Draw an empty grid. Announce that you will prove why the First Player must have a winning strategy, but you need their help to derive it.
  *   **The Setup:** Ask the class to assume, for the sake of argument, that the *Second* Player has a winning strategy.
  *   **The Sceptic:** Assign one student (preferably a confident one) the role of 'Sceptic'. Their job is to interrupt the proof with standard objections. Prime them beforehand if necessary.
  *   **The Derivation:** Guide them through the stealing logic without naming it.
      1.  "If Second has a winning strategy, what happens if First makes an arbitrary opening move and then pretends to be Second?"
      2.  "What if the strategy calls for playing on the square First already occupied?" (Allow the Sceptic to raise this).
      3.  "Can First simply make another arbitrary move and continue the imitation?"
      4.  "Does having an extra counter on the board ever hurt?" (Allow the Sceptic to argue that it might block a path).
      5.  Lead them to the conclusion: Since an extra counter cannot be a disadvantage in Hex, First can 'steal' Second's hypothetical strategy. Thus, Second cannot have a winning strategy. Since there are no draws, First must.
  *   **Constraint:** Do not write 'Strategy-Stealing Argument' on the board. Refer to it only as 'The Proof'.

  **5. Debrief and Philosophy (15 minutes)**
  Now reveal the name: 'The Strategy-Stealing Argument'.
  *   **Mapping:** Ask students to map the rounds onto the proof types. Round One was empirical (inconclusive). Round Three was Classical Existence (proof by contradiction establishes existence without construction). Round Two was the attempt to use that existence constructively (which failed).
  *   **The Intuitionist Objection:** Ask: "If the proof is valid, why did Round Two feel so useless?" Guide them to articulate that 'exists' in the classical sense means 'it is contradictory to suppose it does not', whereas the intuitionist requires 'here is a method to find it'.
  *   **Closing Question:** "Is the intuitionist objecting to the truth of the theorem, or to the usefulness of the proof for a player who must actually move?"

  ### Troubleshooting: Predictable Failures

  **1. A student finds a brute-force strategy on the small board.**
  *   **Risk:** If you use boards smaller than 11×11, a logic student might solve 5×5 quickly and claim the existence proof is trivial because the strategy is findable.
  *   **Fix:** Stick rigidly to 11×11. If a student claims to have solved it, ask them to demonstrate the winning move against a novel opening immediately. They will fail. Remind the class that while a strategy *might* be computable, the *proof we just derived* did not provide it.

  **2. Pairs run long in Round One or Two.**
  *   **Risk:** Hex games can drag if players are perfectionists, eating into the proof time.
  *   **Fix:** Impose a 'shot clock'. Use a phone timer visible to the pair: 60 seconds per move. If time expires, they must play immediately or forfeit. This mirrors the pressure of mathematical problem-solving constraints.

  **3. A student refuses to accept the proof during Round Three.**
  *   **Risk:** A student might fixate on the 'extra move' objection (that the extra counter blocks a path) and derail the derivation.
  *   **Fix:** Validate the objection as astute (it is the core technical hurdle of the proof), then resolve it using the specific property of Hex (monotonicity: having more counters never hurts). If they remain unconvinced, park the objection: "Let us grant the proof for the sake of the philosophical point: suppose we accept the conclusion but still lack the moves. What then?"

  **4. The class concludes classical mathematics is fine and intuitionists are silly.**
  *   **Risk:** Students may view the intuitionist objection as mere pedantry because the classical proof is so elegant.
  *   **Fix:** Steer the debrief away from 'truth' and towards 'action'. Ask: "If you were betting money on this game, would you bet on the classical proof or the constructive algorithm?" Force them to admit that for *doing* mathematics (or playing games), the constructive content is what matters. The intuitionist is not saying the theorem is false; they are saying the classical proof changes the meaning of 'exists' to something that lacks cash-value for the practitioner.

  ### Limitations: What the Activity Cannot Reproduce

  You must be frank with the students in the final five minutes about where the analogy breaks down.

  **1. Human Incompetence vs. Principled Non-Constructivity.**
  The activity demonstrates that *humans* cannot find the strategy in 90 minutes. The philosophical point, however, is that the *proof itself* contains no method, even for an idealised infinite mind. The proof quantifies over the game tree; it eliminates the possibility of Second winning without pointing to the First Player's winning nodes. You must supply this distinction verbally, as the activity only shows practical difficulty.

  **2. Finite vs. Infinite Domains.**
  Hex is a finite game. In principle, the game tree is computable. A sufficiently powerful computer *could* construct the strategy. The intuitionist objection gains its full force in infinite domains (e.g., existence of roots in analysis) where no amount of computation suffices. Acknowledge that Hex is a 'toy model' for the deeper logical issue found in analysis or set theory.

  **3. The Nature of the 'Sceptic'.**
  In the activity, the sceptic attacks the logic. In the history of philosophy, the intuitionist accepts the logic but rejects the Law of Excluded Middle that underpins the proof by contradiction. Ensure you clarify that the intuitionist does not think the proof is logically invalid within classical systems, but that it fails to establish *constructive* existence. The activity simulates the frustration of non-constructivity, but not the formal logical rejection of excluded middle.
