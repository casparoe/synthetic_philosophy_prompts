      *   *Theory:* The "Game of Make-Believe" + Gricean Cooperation.
      *   *Ontology:* Fictional Truth vs. Real Truth. The "Alibi" is a breach of *internal* truth.
      *   *Twist vs. Cheat:* The distinction lies in *recontextualization* vs. *nullification*.
      *   *Hypothetical:* The death of suspense.

