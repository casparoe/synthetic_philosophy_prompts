      *(Refining the "Twist" logic)*: The successful twist usually relies on the narrator's *subjective* truth. "I was in Lisbon" might be their memory. If the book reveals they were drugged, the statement "I was in Lisbon" remains true to their *experience*, which is the currency of 1st person. The "Cheat" is when the narrator knows the truth and hides it without a psychological reason.

