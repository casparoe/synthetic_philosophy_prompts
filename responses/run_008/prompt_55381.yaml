answer: |-
  You have identified the central tension of narrative craft: the boundary between *dramatic irony* and *authorial betrayal*. Your embarrassment is not a failure of articulation but a recognition that this norm rests on a fragile, often unexamined metaphysical contract.

  Here is the reconstruction of the implicit theory your trade relies upon, the analysis of its consistency, and the consequences of dismantling it.

  ### I. The Implicit Theory: The Cooperative Game of Make-Believe

  The norm presupposes a hybrid theory of communication that merges **Kendall Walton's theory of pretense** with a **Gricean conversational contract**, localized entirely within the fictional world.

  **1. The Ontological Status (The "Falsehood" Puzzle)**
  Your second puzzle asks why ten thousand falsehoods (the fiction itself) are license, while one false alibi is perjury. The theory answers this by distinguishing between **ontological falsehood** and **fictional truth**.
  *   **Ontological Falsehood:** No one in the book exists. This is the "game" setup. The reader agrees to pretend these propositions are true for the sake of the experience.
  *   **Fictional Truth:** Once the game begins, truth is defined by **internal coherence**. If the text establishes "The narrator was in the house," that is a *fictional truth*.
  *   **The Norm's Presupposition:** The norm strictly presupposes that the reader's imagination is a resource invested in building a mental model of the fictional world. When you write "I was in Lisbon," the reader builds a prop: *Narrator-in-Lisbon*. If the text later reveals *Narrator-in-House* without a mechanism to explain the discrepancy, the prop is not just corrected; it is **nullified**. The reader's imaginative labor is wasted.
  *   **Why 10,000 falsehoods are okay:** They are the *pieces* of the game. The false alibi is a *move* that breaks the rules of play. The norm treats fiction not as a lie about the world, but as a truth about a game.

  **2. The Communicative Contract (The "Lying" Puzzle)**
  Your first puzzle asks if this is the moral lying/misleading distinction transplanted. The theory suggests it is **aesthetic**, not moral, but it borrows the structure of the moral distinction.
  *   **Misleading (Omission/Implication):** This adheres to the Gricean Maxim of Quality (do not say what you believe to be false) while violating the Maxim of Quantity (do not make your contribution more informative than required). The narrator says nothing false; they simply curate the truth. The reader's mental model is incomplete, but not incorrect.
  *   **Lying (Flat Assertion):** This violates the Maxim of Quality within the game.
  *   **The Theory:** The norm presupposes that the First-Person Narrator is not merely a character, but a **proxy for the reader's access**. In first-person, the reader's access to the fictional world is usually co-extensive with the narrator's knowledge.
      *   If the narrator *withholds*, the reader is *ignorant* (a shared state).
      *   If the narrator *lies*, the reader is *deluded* (a divergent state).
      *   The norm condemns the divergence because it breaks the identification between reader and narrator that first-person prose promises.

  ### II. Presupposition vs. Comfort

  To answer your specific request on what the theory requires versus what merely fits:

  *   **Strictly Presupposed:** The distinction between **internal consistency** and **external correspondence**. The norm *cannot function* unless we accept that a statement can be "false" in a book even though the book itself is "unreal." If fiction were just "lies," there would be no standard for cheating. The norm requires that fictional truths have weight and consequence within the sealed system.
  *   **Sits Comfortably:** The moral coloring ("cheating," "fair play"). This is an aesthetic overlay. The theory of make-believe explains why the model breaks; the moral language explains why the reader feels *aggrieved* rather than just confused. The theory could exist without the shame, but the norm relies on the shame to enforce compliance.

  ### III. The Twist vs. The Cheat: Is the Practice Inconsistent?

  You note that some books pull off the "flat lie" (the twist) while others are condemned. Is the theory underdetermined here?

  **No, the theory can distinguish them, but the line is thinner than editors admit.** The distinction lies in **Retroactive Coherence vs. Retroactive Nullification.**

  1.  **The Praised Twist (Retroactive Coherence):**
      *   In a successful twist (e.g., *The Murder of Roger Ackroyd*, *Atonement*, *Gone Girl*), the false assertion is recontextualized as **subjectively true** or **structurally necessary**.
      *   *Example:* If the narrator says "I was in Lisbon," and the twist reveals they have dissociative identity disorder, the statement remains true *for the voice speaking it*. The reader's mental model is not destroyed; it is *expanded*. The "lie" becomes a clue to the narrator's psychology.
      *   *Theory:* The contract is not broken because the "truth" of the first-person perspective is maintained. The narrator did not lie to the reader; the narrator lied to themselves, and the reader was privileged to hear it.

  2.  **The Condemned Cheat (Retroactive Nullification):**
      *   In a cheat, the false assertion is revealed to be **objectively false within the game**, with no psychological or structural justification.
      *   *Example:* The narrator says "I was in Lisbon" simply to hide the fact that they committed the crime, with no indication of guilt, madness, or bias.
      *   *Theory:* This breaks the contract because it shifts the deception from the **Character** to the **Author**. The Character is allowed to be flawed; the Author is not allowed to sabotage the props. When the Author uses the Character's voice to assert a fictional falsehood without internal cause, the Author has stepped out of the game to manipulate the player.

  **The Inconsistency:** The practice *seems* inconsistent because the signal of "unreliability" is often subtle. If a reviewer misses the subtle cues (a trembling hand, a vague timeline) that signal the narrator *might* be lying, they will cry "Cheat." If they catch the cues, they acclaim the "Twist." The norm is consistent; the detection of its preconditions is variable.

  ### IV. The Hypothetical Regime: If Misleading = Lying

  You ask what would happen if we replaced the implicit view with one where misleading and lying are equally wrong.

  **1. The Death of Suspense**
  If withholding information (misleading by omission) is cheating, the narrator must be **maximally informative** at all times.
  *   *Current Regime:* "I walked into the room. I didn't look at the body." (Suspense: Why didn't he look?)
  *   *New Regime:* "I walked into the room. I didn't look at the body because I was afraid it was my wife."
  *   *Result:* Narrative tension evaporates. Suspense relies on information asymmetry between the reader and the narrator, or the reader and the world. If the narrator cannot withhold, they must be omnisciently honest.

  **2. The End of the Unreliable Narrator**
  If lying and misleading are equal, the "Unreliable Narrator" becomes an oxymoron. A narrator is either a transparent window (documentary style) or a marked liar (from page one). The psychological complexity of a narrator who *believes* their own lies, or who hides truth out of shame, becomes impermissible because it risks the reader inferring the wrong thing.

  **3. Could the Novel Still Function?**
  *   **As Entertainment:** No. You are paid to manage the reader's emotional state through the control of information. Total transparency renders the novel a transcript, not a narrative.
  *   **As Art:** It would mutate into a different form. It would become closer to poetry (where truth is emotional, not factual) or essayism (where the argument is explicit).
  *   **The "Fair Play" Paradox:** If you treat misleading as cheating, you actually *increase* the likelihood of cheating. Why? Because to avoid "misleading" the reader, you would have to clutter the text with disclaimers ("I am telling you this, but not that," "I am feeling shame now"). This draws attention to the artifice, breaking the immersion (the "game") more severely than a twist ever could.

  ### Summary

  The norm your editors enforce is not a moral judgment but a **preservation of the reader's imaginative investment**.
  *   **Misleading** asks the reader to build a partial model.
  *   **Lying** asks the reader to build a wrong model.
  *   **The Twist** asks the reader to rebuild the model using the same bricks.
  *   **The Cheat** burns the bricks.

  The theory holds that the First-Person contract is one of **shared subjectivity**, not shared omniscience. As long as the falsehood resides in the narrator's subjectivity (their memory, their bias, their madness), it is fair play. When the falsehood resides in the Author's manipulation of the text's objective reality (within the game), it is cheating.

  If you equalize lying and misleading, you do not create a more honest literature; you create a literature that can no longer simulate the experience of being human, which is defined by gaps, silences, and self-deception. You would be paid to write reports, not novels.
