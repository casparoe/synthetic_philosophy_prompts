answer: |-
  There is no single canonical term bridging both fields, but while philosophy of science debates **Accommodation versus Prediction** and machine learning measures **Generalization Error**, I will coin **Epistemic Overfitting** to describe the shared failure mode where data shapes the hypothesis rather than testing it.

  The common core is **constraint capacity**. In both fields, evidence only confirms a hypothesis if the hypothesis could have easily been wrong given that data. In machine learning, a model with millions of parameters (high capacity) can fit any noise in the training set, so success there is cheap; success on held-out data is valuable because the model had no causal access to it during weight updates. In philosophy of science, a theory like Newtonian mechanics plus ad hoc hidden planets (high capacity) can accommodate almost any orbital anomaly by adding parameters, so accommodating Mercury's wobble confirms little. General Relativity (low capacity) had almost no free parameters to tune; the field equations were derived from fundamental principles, and the Mercury fit was a derived consequence, not a tuned parameter. Thus, GR did not "overfit" Mercury even though Einstein knew the number, because the theory lacked the flexibility to fit arbitrary data.

  The two cases come apart on **explicitness of leakage**. In ML, leakage is mathematical and binary: gradients either flow from a data point to the weights or they do not. In science, leakage is sociological and causal: did the known fact influence the theoretical structure? Einstein "saw" the Mercury data in the sense of knowing the number, but he did not "see" it in the relevant epistemic sense because the data did not causally constrain the derivation of the field equations. Your TA was right that Einstein didn't fit GR to Mercury like a network, but wrong to imply the data's age disqualifies it; the disqualifier is whether the theory was *flexible enough* to fit anything else. The Vulcan theorists were "training on" the data because they added parameters specifically to minimize the error on that point.

  **Epistemic Overfitting** occurs when the degrees of freedom in a hypothesis space exceed the constraints imposed by the evidence generation process. The boundary case is **Principled Accommodation**: when a theory is constructed from first principles (low capacity) but successfully explains old data. This counts as confirmation because the "holdout" was logical, not temporal—the theory risked falsification by being too rigid to accommodate the data if the principles were wrong. Therefore, "seeing" the data is not about reading a journal article; it is about whether the data exerted a **gradient-like influence** on the theory's structure. If the theory would have been identical regardless of the data's value, the data is effectively "held out" even if historically known.
