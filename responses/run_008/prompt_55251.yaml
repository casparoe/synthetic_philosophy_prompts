  3. **Consensus building:** Critics discuss a film and change minds. This is legitimate persuasion. The Loop occurs when dissenters are retroactively labeled "unqualified" rather than persuaded. The key is whether the exclusion happens *before* or *after* the verdict conflicts with the desired outcome. If you drop them because they disagreed, it's the Loop. If you drop them because they lied about their credentials, it's not. The distinction lies in whether the disqualification criterion existed *before* the disagreement arose. If the rule changes mid-game to keep you winning, you're in the Loop.

  5. "Why it matters"
  It matters because it ends conversation. If the only valid judges are those who already agree with the conclusion, taste becomes aristocratic magic rather than shared experience. You can't learn anything because the "teachers" are just people who think like you. It turns aesthetics into power politics: whoever controls the label "expert" controls reality. Flagging the Calibration Loop forces people to admit their criteria for expertise must be independent of the verdict, opening the door for actual debate about why something is good, rather than who is allowed to say so.
