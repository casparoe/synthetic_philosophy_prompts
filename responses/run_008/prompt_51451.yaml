      *   *Pascal's Mugging:* Finite but astronomically large payoff ($3 \uparrow\uparrow\uparrow 3$ utils), vanishingly small probability ($1/10^{100}$), small cost ($5). EV = Huge $\times$ Tiny > $5. Conclusion: Pay the mugger.
      *   *The Problem:* It forces expected value maximization to recommend absurd actions based on unverified claims of low probability/high impact.

  3.  **Translate to Betting Vocabulary:**
      *   *Bankroll:* Total capital available for betting.
      *   *Stake:* The $5 (or cost of faith).
      *   *Payoff:* The "happy lives" or "Heaven" (utility).
      *   *Probability:* The mugger's claim vs. the bettor's assessed probability.
      *   *Edge:* $(P \times \text{Odds}) - (1-P)$.
      *   *Kelly:* $f^* = \text{Edge} / \text{Odds}$.
      *   *Risk of Ruin:* Probability of losing the whole bankroll.
      *   *Repeatability:* Law of Large Numbers applicability.

  4.  **Drafting the Translation (Section 1):**
      *   *Setup:* A counterparty offers a prop bet.
      *   *Odds:* Implied odds are astronomical (e.g., 1 in $10^{100}$).
      *   *Payout:* Astronomical utility (not necessarily cash, but "utils").
      *   *Entry Fee:* Fixed $5 (not % of bankroll).
      *   *The Argument:* EV is positive. Therefore, a rational EV-maximizer takes it.
      *   *Pascal's Wager:* Same structure, but payout is *infinite* and bet is *life conduct*.

  5.  **Drafting the Residue Report (Section 2):**
      *   *Clean Maps:* EV calculation, Positive vs. Negative expectation, Cost of entry.
      *   *Fudged Maps:* "Utility" vs. "Bankroll Growth" (utils aren't always reinvestable), Probability assignment (subjective vs. market-implied).
      *   *No Counterpart:* Infinite payouts (Kelly breaks with infinite variance), Single-shot vs. Repeatable (Kelly assumes ergodicity), Calibration (you can't backtest magic).

  6.  **Addressing the Core Suspicion (Section 3):**
      *   *User's Insight:* Kelly fraction is tiny but positive. $5 is likely < Kelly stake. So why not bet?
      *   *Analysis:* The user is right. Kelly *does* say bet if EV > 0. The resistance comes from *probability estimation error* and *non-ergodicity*.
      *   *Kelly Assumptions:*
          1.  *Known/Estimable Probabilities:* In sports, you have data. In mugging, you have a claim. The "noise" in the user's probability estimate is 100%, not just "noisy."
          2.  *Repeatability:* Kelly relies on the Law of Large Numbers to smooth variance. A one-off bet with $10^{100}$ variance destroys the geometric growth logic.
          3.  *Counterparty Risk:* Can the mugger *pay*? In sports, the book holds escrow. In mugging, no mechanism.
      *   *Conclusion:* It's not a hole in Kelly; it's a violation of Kelly's *preconditions*. Kelly manages risk *given* an edge. It doesn't validate the *existence* of an edge against a potentially fraudulent or impossible counterparty.

