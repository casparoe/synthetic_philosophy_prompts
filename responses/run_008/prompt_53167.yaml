  4.  **Rescue Moves (0.30):** Recasting omissions as double-preventions preserves causal structure only by changing the description of the relata, conceding that the absence itself is not the cause.

  **Combination Rule:** Weighted Average, with weights assigned based on conceptual centrality: Ontology (0.20), Semantics (0.20), Profligacy (0.50), Rescue Moves (0.10).
