answer: |-
  This is a high-stakes seminar, and your instinct to prioritize the Q&A is correct. In a work-in-progress setting, the talk is just the bait; the Q&A is the trap. Your thesis is bold, but it rests on a contested metaphysical distinction (KH vs. KT) in a room full of people who specialize in the very phenomenon you're redefining.

  Here is the breakdown of the objections you will face, ordered by the amount of damage they can do to your project, phrased in the voices of your colleagues.

  ### 1. The Foundation Attack (The Anti-Rylean Epistemologist)
  **Damage Level:** Critical. If this sticks, your thesis has no engine.
  **The Voice:** "I'm worried you're building a castle on sand. The Intellectualist orthodoxy (Stanley, Williamson) has largely dismantled the Rylean distinction. If knowing-how is just a species of knowing-that (perhaps under a practical mode of presentation), then testimony *can* transmit it, provided the proposition is grasped practically. You haven't argued against Intellectualism; you've just assumed Ryle is right. Why shouldn't we think the queasiness is just about the *complexity* of the propositions, not the *type* of knowledge?"

  *   **Concede:** You cannot win a metaphysical debate about the nature of knowledge in a 2-minute reply. Acknowledge the Intellectualist challenge is live.
  *   **Hold:** Hold that regardless of the *metaphysics* of knowledge, there is an *epistemology of transmission*. Even if KH reduces to KT, the *acquisition conditions* for practical knowledge require first-personal engagement that testimony cannot satisfy.
  *   **The Reply:** "That's a fair challenge. I don't need to settle the metaphysics of KH vs. KT to make my point. I'm making a claim about *transmission conditions*. Even if knowing-how is a species of knowing-that, it's a species that requires 'ability-involving' acquisition. Testimony transmits content; it doesn't transmit the calibration required to apply that content in context. My claim is that moral deference fails not because the *knowledge* is different, but because the *channel* is incapable of delivering the requisite calibration, regardless of whether we label that KH or KT."
  *   **The Soft Spot:** You are retreating from a metaphysical claim to a functional one. If they press that "calibration" can be described propositionally, you're back to square one.
  *   **Prep:** Read Jason Stanley's *Know How* intro. Have a ready line about "practical mode of presentation" requiring more than just hearing words.

  ### 2. The Empirical Falsification (The Moral Testimony Specialist)
  **Damage Level:** High. This is the question you feared, and it is your biggest vulnerability.
  **The Voice:** "Let's look at the data. If moral knowledge is know-how and testimony can't transmit know-how, then moral testimony should *never* work. But it does. I tell my child, 'Don't hit your sister,' and they learn something moral. We defer to bioethicists on policy all the time. Your view predicts a global skepticism about moral testimony, but the phenomenon is localized to *certain kinds* of deference. You've explained the queasiness in expert cases by ignoring the success in mundane cases."

  *   **Concede:** Concede immediately that moral testimony *does* work for basic moral rules and information. Do not try to argue that kids don't learn morality from parents.
  *   **Hold:** Hold that the "puzzle" of moral testimony in the literature is specifically about *controversial, complex, or action-guiding* deference (e.g., "Is euthanasia permissible?"), not basic rule transmission.
  *   **The Reply:** "I agree entirely that testimony transmits moral *information* successfully—'hitting is wrong' is a proposition I can learn from you. The puzzle we're trying to solve, however, is the queasiness surrounding *practical deference* in non-trivial cases. My claim is that morality has a dual structure: propositional rules (transmittable) and practical sensitivity (non-transmittable). The queasiness arises when we try to use testimony to bridge the second gap. Your counterexamples hit the first gap; my theory explains the failure at the second."
  *   **The Soft Spot:** Drawing the line between "rule" and "sensitivity" is notoriously difficult. They will ask for a principled distinction.
  *   **Prep:** Have 2-3 clear examples of "transmittable moral facts" vs. "non-transmittable moral skills" ready.

  ### 3. The "Just a Redescription" Charge (The Second Moral Testimony Specialist)
  **Damage Level:** Medium-High. This attacks the philosophical value of your contribution.
  **The Voice:** "Hills and Jones already argued that moral understanding requires grasping dependencies. You're saying moral knowledge is a skill. Isn't this just redescribing the 'moral understanding' objection in Rylean clothing? You say autonomy is 'downstream,' but you haven't explained *why* the skill mismatch generates the normative force of the objection. You've told us what the knowledge is, not why deferring on it is objectionable."

  *   **Concede:** Concede that there is significant overlap with the "moral understanding" literature. Don't claim to have invented the wheel.
  *   **Hold:** Hold that your view is *explanatorily prior*. Understanding is the *result* of possessing the skill; the skill is the *mechanism*.
  *   **The Reply:** "It's a close cousin, yes. But the 'understanding' view often treats understanding as a separate epistemic good. My view locates the normativity in the *nature of the object* being known. If morality is partly a skill, then deferring isn't just missing out on a bonus good (understanding); it's failing to engage with the object itself. It explains *why* understanding is required: because you can't have the knowledge without the skill. That makes the queasiness a category error, not just an epistemic deficit."
  *   **The Soft Spot:** If "category error" sounds too linguistic, you lose the normative bite.
  *   **Prep:** Be ready to articulate why a category error is *normatively* significant (i.e., it leads to action failure).

  ### 4. The "Friendly" Trap (The Virtue Theorist)
  **Damage Level:** Medium. This threatens your disciplinary identity.
  **The Voice:** "This is fascinating. It sounds like you're rediscovering *phronesis*. If moral knowledge is practical wisdom, why are you framing this in social epistemology terms? Why not just lean into the virtue ethics framework? It seems like you're fighting the virtue battle with epistemic weapons when you could just join us."

  *   **Concede:** Acknowledge the affinity. Do not insult virtue ethics; you want this person as an ally.
  *   **Hold:** Hold that your audience and your goal are epistemological. You are solving a puzzle about *testimony*, not building a theory of *character*.
  *   **The Reply:** "I have a lot of sympathy for that reading. However, my goal here is to intervene in the social epistemology debate, which often treats virtue concepts as black boxes. By translating 'phronesis' into 'know-how,' I hope to make the mechanism accessible to non-virtue-ethicists who are puzzled by testimony. I'm using virtue tools to fix an epistemic engine, not to build a virtue car."
  *   **The Soft Spot:** If you distance yourself too much, he feels rejected. If you get too close, the Epistemologists write you off as a virtue theorist in disguise.
  *   **Prep:** Use the phrase "Virtue Epistemology" explicitly. It bridges the gap without committing to full Virtue Ethics.

  ### 5. The Translation Request (The Old-School Epistemologist)
  **Damage Level:** Low. This is noise, but annoying noise.
  **The Voice:** "All this talk of skills and Ryle. Can we just say what the justification conditions are? If I defer to you, do I lack justification? Or do I have justification but no knowledge? Keep it in terms of warrant."

  *   **Concede:** You can translate your view into justification terms.
  *   **Hold:** Hold that the *source* of the justification failure is the skill mismatch.
  *   **The Reply:** "In justification terms: you lack sufficient justification because the source (testimony) is unreliable for the specific type of belief (practical moral belief) in question. It's a defeater based on source reliability."
  *   **The Soft Spot:** None really, just boring.
  *   **Prep:** Have the "reliability defeater" line ready so you can move on quickly.

  ---

  ### The "Hope Nobody Asks" Question
  You identified the "Mundane Cases" objection (Objection #2 above). You are correct; that is the most dangerous *empirical* objection. However, there is a worse, lurking question that combines the Intellectualist and the Testimony Specialist:

  **The "Hybrid" Trap:**
  *"Okay, suppose some moral knowledge is know-how. But surely some is know-that (e.g., 'Genocide is wrong'). When I defer on the latter, there's no queasiness. When I defer on the former, there is. But how do I know which is which *before* I defer? If I can't distinguish the skill-claims from the fact-claims prior to engagement, your theory gives me no action-guiding advice on when deference is permissible."*

  **Why it's worse:** It renders your theory practically useless. If the agent can't tell when they are dealing with KH vs. KT, they can't use your theory to navigate the world.
  **Prep:** Argue that the queasiness *is* the signal. The phenomenological discomfort is the heuristic that tells you "this is a skill claim, not a fact claim."

  ### Critical Framing Flag ⚠️
  **You are making a strategic error by keeping your virtue ethics interest "quiet."**
  In a room with a Virtue Theorist and Ryle-skeptics, framing this *purely* as Social Epistemology makes you look like you're reinventing the wheel or ignoring the metaphysical baggage of "practical knowledge."
  *   **Fix:** Don't say "I am a virtue ethicist." Do say: "This project draws on the **Virtue Epistemology** tradition regarding practical knowledge." This signals to the VT that you respect the lineage, signals to the Epistemologists that you are doing epistemology, and insulates you from the "Redescription" charge (because you acknowledge you're using virtue tools).
  *   **Ryle Risk:** Given the Anti-Rylean in the room, do not hang your entire hat on Ryle's specific text. Use "Rylean" as shorthand for "Anti-Intellectualist Practical Knowledge," but be prepared to cite Anscombe or contemporary Virtue Epistemologists (like Sosa or Zagzebski) who discuss practical knowledge. If Ryle falls, you want Anscombe to catch you.

  ### Weakest Point to Defend
  **The Boundary Problem.**
  Where does "moral fact" end and "moral skill" begin? "Don't kill" seems like a fact. "How to be just in this complex distribution scenario" seems like a skill. But "Don't kill" also requires skill to apply (is self-defense killing?).
  *   **Strategy:** Don't try to draw a sharp metaphysical line. Argue it's a **spectrum of complexity**. Testimony works at the low-complexity end (rules) and fails at the high-complexity end (application). The queasiness correlates with the complexity/skill requirement. This makes your view robust against counterexamples without requiring a precise definition of KH.

  ### Summary Strategy for Q&A
  1.  **Survive the Intellectualist:** Shift from metaphysics (what knowledge *is*) to transmission (how knowledge *moves*).
  2.  **Survive the Mundane Case:** Distinguish moral *information* (transmittable) from moral *competence* (non-transmittable).
  3.  **Manage the VT:** Acknowledge the lineage, but keep the goal epistemic.
  4.  **Own the Boundary Problem:** Admit it's a spectrum, not a binary.

  Good luck. If you can hold the line on the transmission vs. metaphysics distinction, you'll survive the workshop series.
