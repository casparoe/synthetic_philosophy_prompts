answer: |-
  ### Desiderata for a Definition of Death

  **1. Binary Decidability**
  *   **Specification:** The definition must yield a determinate "alive" or "dead" verdict at a specific moment, despite the biological gradualism of dying.
  *   **Case/Consideration:** Legal statutes regarding inheritance, marriage dissolution, and homicide require a bright line; one cannot be partially dead for the purposes of criminal liability or property transfer.
  *   **Status:** **Non-negotiable.** Without binary decidability, the definition fails its primary legal function.

  **2. Clinical Operability**
  *   **Specification:** The criteria must be testable at the bedside by clinicians without requiring philosophical training or metaphysical speculation.
  *   **Case/Consideration:** A definition relying on the "loss of soul" or "final cessation of all atomic motion" is useless in an ICU; clinicians must be able to verify the criterion with available technology (e.g., apnea testing, pulse check).
  *   **Status:** **Non-negotiable.** A definition that cannot be applied is not a legal or clinical standard.

  **3. Biological Coherence (Somatic Integration)**
  *   **Specification:** The declaration of death should not contradict observable, integrated biological functioning of the organism as a whole.
  *   **Case/Consideration:** The brain-dead pregnant woman whose body gestates a fetus for weeks demonstrates that somatic integration (homeostasis, wound healing, gestation) can persist after the brain is dead.
  *   **Status:** **Non-negotiable.** If death is defined as the cessation of the organism as a functioning whole, visible evidence of the organism functioning as a whole falsifies the declaration.

  **4. Moral Status Alignment (Consciousness)**
  *   **Specification:** The definition of death should coincide with the permanent loss of the capacity for consciousness or social interaction.
  *   **Case/Consideration:** The anencephalic newborn and the patient in a permanent vegetative state (PVS) possess brainstem function but no higher-brain function; calling them "alive" seems to privilege biology over personhood, while calling them "dead" contradicts current law.
  *   **Status:** **Preference masquerading as demand.** This is the core commitment of the *higher-brain* camp; however, current law and broad social consensus treat biological cessation as distinct from the loss of personhood, making this a philosophical preference rather than a legal necessity.

  **5. Logical Consistency regarding Irreversibility**
  *   **Specification:** The loss of function declared as death must be truly irreversible (cannot be restored), not merely permanent (will not be restored).
  *   **Case/Consideration:** Donation after Circulatory Death (DCD) relies on a waiting period (e.g., 5 minutes) after which resuscitation *will not* be attempted, not because it *could not* succeed; this conflates permanence with irreversibility.
  *   **Status:** **Non-negotiable (Conceptually), Compromised (Practically).** Logically, death must be irreversible; however, clinical practice accepts permanence to facilitate DCD, creating a tension between conceptual rigor and protocol.

  **6. Theoretical Unity (Non-Disjunctiveness)**
  *   **Specification:** The definition should rest on a single, unified principle of death, rather than offering alternative pathways (e.g., "heart stops OR brain stops").
  *   **Case/Consideration:** The Uniform Determination of Death Act (UDDA) is disjunctive; critics argue this implies there are two different kinds of death, which is ontologically suspect.
  *   **Status:** **Preference masquerading as demand.** As you suspect, this is a theoretical aesthetic. Legal and clinical practice tolerates disjunctive criteria if they yield consistent outcomes; insisting on unity is a philosophical preference for elegance over pragmatic redundancy.

  **7. Transplant Continuity**
  *   **Specification:** The definition should not significantly reduce the pool of viable organs for transplantation compared to current practice.
  *   **Case/Consideration:** Shifting to a stricter definition (e.g., requiring total cellular decay) would end transplantation; shifting to a looser one (e.g., higher-brain) might expand it but risk public trust.
  *   **Status:** **Preference masquerading as demand.** While organ availability is a massive social good, it is a consequence of the definition, not a constituent of the concept of death; prioritizing it risks conflating the determination of death with the utility of the corpse.

  ***

  ### Incompatible Pairs of Desiderata

  1.  **Biological Coherence vs. Whole-Brain Criterion:** You cannot maintain that death is the loss of somatic integration (Desideratum 3) while simultaneously declaring brain-dead pregnant women dead (Whole-Brain), as their bodies demonstrate integrated function.
  2.  **Logical Consistency (Irreversibility) vs. Transplant Continuity:** You cannot maintain strict irreversibility (Desideratum 5) while practicing DCD (Desideratum 7), as DCD relies on the permanence of non-treatment rather than the impossibility of resuscitation to preserve organ viability.
  3.  **Moral Status Alignment vs. Clinical Operability/Consensus:** You cannot align death with the loss of consciousness (Desideratum 4) while maintaining current clinical operability (Desideratum 2) and legal consensus, as diagnosing the permanent loss of consciousness (PVS) is notoriously difficult and socially contentious compared to checking for pulse or brainstem reflexes.

  ***

  ### Adjudication Summary

  The whole-brain standard preserves transplant utility and clinical operability at the cost of biological coherence; the higher-brain standard prioritizes moral status alignment at the cost of legal consensus and clinical certainty; and the circulatory standard secures organ viability at the cost of strict logical irreversibility.
