  I'm a PhD student in econ, TA-ing the game theory section of a "formal methods for philosophers" course — 18 students, one 75-minute section. Next week is iterated elimination of dominated strategies, and the part I keep failing to convey on the board is that a strategy can be strictly dominated by a mixed strategy even when no single pure strategy dominates it — on paper it looks safe against everything the other player might do, but if you'd been randomizing between two of your other options you'd have done strictly better no matter what. I want an in-class game where they run into that themselves: a strategy that feels fine and that nobody can point to a specific rival strategy beating, and yet it quietly bleeds points every round. Then I want a second layer where, once the junk strategies get pruned, some other strategy that used to look okay becomes dominated too — so they feel the *iterated* part and not just one round of deletion. Payoffs should be points redeemable for candy or extra-credit fractions or whatever, no real money. Then a debrief that maps what actually happened in the room onto (a) strict dominance by a pure strategy, (b) strict dominance by a mixture, and (c) the iteration order — because I suspect they'll think the deletion order doesn't matter and I want them to see when it does and doesn't. Also be honest about what the game can't reproduce: my worry is they'll find the dominated strategy by copying whoever's winning, which is convergence by imitation, not reasoning to dominance, and that's a different thing I'd be falsely crediting to the exercise.

  Give me the whole thing as a numbered list of exactly five items, one or two sentences each, no intro or conclusion: (1) setup and materials, (2) the round structure including how scores are tracked so the bleeding shows up, (3) the debrief with the mapping, (4) what will predictably go wrong the first time I run it and how to handle it, (5) the caveat about what the activity structurally can't reproduce. And whatever payoff scheme you propose, actually check it: the mixture must strictly dominate against *every* one of the opponent's options, and the second-layer dominance must only appear after the first deletion — don't hand me numbers that accidentally break one of those. American English please, and keep the typos out of the payoff matrices, unlike this message.
