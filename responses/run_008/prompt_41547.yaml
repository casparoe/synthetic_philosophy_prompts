      *   *Verdict 5 (Factory Farming):* "Intentional human agents." Animals are killed intentionally. *Problem:* The principle doesn't specify *human* victims. If the principle implies "violence against humans," farming fits the exclusion. If it's just "violence," it shouldn't be excluded. The user says "I don't count it." This suggests an implicit "human-only" clause.
      *   *Verdict 6 (Structural Violence/Siege):* "Intentional." Siege = Withholding food *on purpose* to kill/subdue. Structural = Budget allocation (often diffuse intent). This is the stickiest point. The user resists structural violence but admits the siege analogy is strong.

