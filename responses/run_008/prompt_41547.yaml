  2.  **Evaluate the Tentative Principle against the Verdicts:**
      *   *Principle:* Intentional human agency, exclude self-harm, measure per capita.
      *   *Verdict 1 (Genghis vs. WWII):* The principle says "measure per capita." This supports Genghis > WWII. It *contradicts* the intuition that the 20th Century is the "most violent" based on absolute numbers. The user admits they "can't hold both." The principle forces a choice.
      *   *Verdict 2 (Famine vs. Drought):* "Intentional human agents." Stalin/Mao = Policy (Intent). Drought/No Aid = Negligence/Structure (No specific intent to kill *those* people?). This fits reasonably well, though the line between "policy causing famine" and "budget cuts causing death" is thin (Siege problem).
      *   *Verdict 3 (Cars vs. Drones):* "Intentional." Cars = Accident. Drones = Intentional strike. Fits perfectly.
