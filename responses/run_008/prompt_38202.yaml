answer: |-
  Here is the procedure, the justification, the application to your three proposals, and the failure modes.

  ### Part 1: The "Anchor & Leverage" Protocol (90 Minutes)

  This procedure is designed to bypass the paralysis of "cluelessness" by separating what you *know* (the anchor) from what you *hope* (the leverage). It does not solve the philosophical problem of uncertainty; it manages the operational risk of it.

  **Phase 1: The Anchor (20 Minutes)**
  *Goal: Verify the near-term causal chain.*
  *   **Question 1:** What specifically must happen in the first 12 months for this to be considered a technical success? (e.g., "5,000 pills distributed," not "health improved.")
  *   **Question 2:** Is there a verifiable mechanism to confirm Question 1 happened? (Third-party audit, randomized check, hard data.)
  *   **Question 3:** What is the single most likely point of failure in this delivery chain?
  *   **Sufficient Answer:** You can visualize the failure point and there is a plan to monitor it. If the answer to Q2 is "trust the partner," stop. This is not fundable yet.
  *   **Why this isn't cowardice:** You asked why we focus on near-term effects if they aren't what matters. Think of the near-term effect as the *steering wheel*, not the *destination*. You cannot correct a course you cannot measure. If you cannot verify the first step, you have no data to update your beliefs about the second step. Ignoring the anchor isn't boldness; it's blindness.

  **Phase 2: The Bridge (30 Minutes)**
  *Goal: Assess the plausibility of the long-term claim.*
  *   **Question 1:** What specific event must occur *after* the anchor to trigger the long-term impact? (e.g., "Government adopts protocol," "Student graduates college.")
  *   **Question 2:** Who has the power to make that event happen, and do they have an incentive to do so?
  *   **Question 3:** Is there historical precedent for this specific "bridge" occurring in this context?
  *   **Sufficient Answer:** You can name the decision-maker and their incentive. If the bridge relies on "raising awareness" or "hope," mark this as **High Uncertainty**.

  **Phase 3: The Leverage (20 Minutes)**
  *Goal: Compare the magnitude of the bet.*
  *   **Question 1:** If this succeeds completely, how many people are affected 10 years from now? (Order of magnitude: 100? 10,000? 1M?)
  *   **Question 2:** If this fails completely, what is lost besides the money? (Reputation, partner trust, opportunity cost?)
  *   **Question 3:** Does this fit the "Bucket Mandate"? (Global Health = Scale; Local Ed = Depth; Wildcard = Learning.)
  *   **Sufficient Answer:** The leverage matches the bucket. Do not fund low-leverage projects in high-leverage buckets.

  **Phase 4: The Values Flag (20 Minutes)**
  *Goal: Identify where analysis ends and judgment begins.*
  *   **Action:** Review your notes. Highlight any assumption where you said "likely" or "probably" without data.
  *   **Decision Rule:**
      *   If the **Anchor** is weak: **Reject.** (No amount of potential upside justifies zero accountability.)
      *   If the **Anchor** is strong but **Leverage** is low: **Flag for Board.** (This is a "comfort" grant. It makes us feel good but changes little.)
      *   If the **Anchor** is weak but **Leverage** is extreme (Wildcard only): **Flag for Board.** (This is a venture bet.)
  *   **Output:** Your memo must explicitly state: *"The analysis supports X, but the decision rests on the Board's risk tolerance regarding Y."*

  ---

  ### Part 2: Running the Protocol on Your Proposals

  Here is the output of the protocol as if I were sitting in your chair on Thursday.

  #### (a) Deworming Expansion ($1.8M, Global Health)
  *   **Anchor:** Strong. Pills are cheap, logistics are known. *Risk:* The "weaker health infrastructure" in the new country threatens the delivery verification (Phase 1, Q3).
  *   **Bridge:** Plausible. Governments often adopt cost-effective health interventions if data is provided.
  *   **Leverage:** High. If the government adopts it, millions benefit. Fits Global Health bucket.
  *   **Values Flag:** The infrastructure risk is real but manageable with monitoring funds.
  *   **Recommendation:** **FUND.**
  *   **Reasoning:** The Anchor is verifiable *if* you earmark 10% of the grant for third-party delivery monitoring. The leverage justifies the infrastructure risk.

  #### (b) Local Literacy Program ($500K, Local Education)
  *   **Anchor:** Very Strong. Small RCT exists. Delivery is local and controllable.
  *   **Bridge:** Weak. The path from "afterschool literacy" to "life trajectory change" is highly dependent on factors outside the program (family stability, local economy, school quality).
  *   **Leverage:** Low. Even if successful, it helps hundreds, not thousands. It does not create a model easily scalable to other districts without massive cost.
  *   **Values Flag:** **High.** This is a "comfort" grant. The analysis shows low marginal impact per dollar compared to bucket potential.
  *   **Recommendation:** **PASS.**
  *   **Reasoning:** *This is the recommendation you will likely hate.* You come from evaluation; this proposal has the best data (the RCT). It feels "safe." But for a $15M foundation, this is low leverage. It solves a problem for a few kids without changing the system that creates the problem. Funding this is buying emotional security, not impact.

  #### (c) Decision-Making Research ($2M, Wildcard)
  *   **Anchor:** Weak. No track record. Output is "papers," which are easy to produce and hard to value.
  *   **Bridge:** Speculative but High Potential. If they produce a framework that your foundation (or others) use to allocate capital better, the ripple effect dwarfs direct service.
  *   **Leverage:** Extreme. Improving decision-making multiplies the effectiveness of *all* future grants. Fits Wildcard bucket perfectly.
  *   **Values Flag:** **Extreme.** This is a venture bet. The Anchor is too weak for standard approval.
  *   **Recommendation:** **FUND (with conditions).**
  *   **Reasoning:** This fits the specific mandate of the Wildcard bucket (research/pilots). The lack of track record is acceptable *only* because the potential leverage is systemic. Require quarterly "learning deliverables" rather than "success deliverables" to manage the weak Anchor.

  ---

  ### Part 3: Why You Will Hate Recommendation (b)

  You will hate passing on the Literacy Program because it violates your program-evaluation instincts. You are trained to trust the RCT. You are trained to value proven local good over speculative systemic gain.

  The protocol forces you to admit that **evidence of activity is not evidence of impact.** The RCT proves the kids read better *during the program*. It does not prove the foundation's $500K is the best use of capital compared to the Deworming or the Research.

  Passing on (b) feels like abandoning real children for abstract theories. That discomfort is the correct moral response. Do not suppress it. Instead, put that discomfort in the memo: *"While this program is proven to work locally, the Foundation's capital is better deployed where leverage is higher. This is a values trade-off: depth of certainty vs. breadth of potential."* Hand that to the board. Let them vote to override you if they want the comfort grant.

  ---

  ### Part 4: Where This Procedure Fails (And How to Notice)

  Following this protocol faithfully will still produce the wrong answer in three specific scenarios. You need to watch for these during your 90 minutes.

  **1. The Vanity Anchor**
  *   **Failure:** The near-term metric is easy to hit but meaningless. (e.g., "Teachers trained" doesn't mean "Teachers teach better.")
  *   **How to Notice:** In Phase 1, ask: "If they hit this number but nothing changes for the beneficiary, would we know?" If the answer is "No," your Anchor is vanity. Demand a quality metric, not a quantity metric.

  **2. The Negative Bridge**
  *   **Failure:** The program succeeds, but the long-term effect is harmful. (e.g., A literacy program pulls kids away from family income, causing household starvation.)
  *   **How to Notice:** In Phase 2, ask: "Who loses out if this succeeds?" If you can't identify a trade-off, you haven't looked hard enough. Complex systems always have displacement effects.

  **3. The Board Preference Mask**
  *   **Failure:** You use the protocol to justify a decision the Board Chair already wants, ignoring the data.
  *   **How to Notice:** After writing the memo, read it aloud. If you find yourself using words like "obviously," "clearly," or "undoubtedly" in the Values Flag section, you are hiding a judgment call as an analysis. Stop. Rewrite that sentence to start with "The Board must decide..."

  ### Summary for Thursday
  1.  **Run the 4 Phases.** Stick to the time limits.
  2.  **Trust the Anchor.** If you can't measure the first step, walk away.
  3.  **Accept the Discomfort.** Passing on the "safe" local grant (b) is the right move for a foundation of your size, even if it feels wrong.
  4.  **Flag the Values.** Don't pretend the Research grant (c) is "safe." Call it a bet.

  This procedure won't stop you from being wrong. But it will stop you from being *confused* about why you were wrong. That is the best an officer can do.
