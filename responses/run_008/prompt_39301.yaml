  5.  **Explanation Gap:** Can the event be explained solely by the headline, or does it require historical context to make sense? *[Judgment: Editor]*. Assess reader need. **Fail:** Treat as self-explanatory; write brief. **Pass:** Commission structural explainer.

  This sequence forces writers to prove depth before pitch. Steps 1 and 2 rely on clip files and data searches, accessible to juniors without editorial bias. Steps 3, 4, and 5 require editorial intuition regarding structural weight and must be escalated to you. This prevents loud voices from dominating the morning meeting; the evidence must clear the factual gates before opinion enters the room. The "Fail" instructions are absolute to prevent scope creep on transient stories. Only items surviving all five steps qualify as *longue durée* analysis rather than surface foam. This ensures resources target stories where the event is merely the visible crest of a submerged wave. If a writer reaches Step 3, they must stop and email you the findings from Steps 1 and 2. This creates a paper trail for why a story was killed or greenlit, reducing meeting friction. The procedure respects Braudel's suspicion of events while acknowledging newsrooms must cover them. It creates a burden of proof for depth. Writers cannot argue passion; they must show pattern. You retain veto power at the judgment stages, ensuring the desk's voice remains consistent. This divides labor cleanly: writers mine data, editors mine meaning. The distinction between Fact and Judgment is critical. Junior writers often lack the context to distinguish structural cause from individual failure. By restricting them to Steps 1 and 2, you protect them from making claims they cannot substantiate. It also protects you from having to review every pitch; most will die at Step 1. This saves editorial time for the complex decisions at Steps 3 through 5. The procedure is not a substitute for editing, but a triage mechanism. It ensures that when you do engage, the factual groundwork is already laid. This reduces the likelihood of commissioning a structural take that collapses under factual scrutiny later. The rigid "Fail" instruction is necessary to combat the natural tendency of writers to fall in love with their pitches. By making the stop condition definite, you remove the ambiguity that allows loud arguments to succeed in meetings.

  **The Three Worked Cases**

  (1) A single regional bank fails over a weekend. The writer searches clips for Step 1. No similar failures exist in 24 months. Step 1 Fail. Verdict: Straight news brief. The procedure blocks the "eroding regulation" angle you desire because the factual recurrence is absent. To change this verdict, the writer must uncover evidence of prior near-failures or regulatory forbearance logs hidden in filings over the past decade. Without that data, the procedure treats the collapse as an isolated event rather than structural decay. You cannot commission the take until the clip file supports the recurrence claim. This is the unwanted answer: the procedure demands proof of pattern before allowing structural analysis. It stops you from imposing a narrative on insufficient data.

  (2) A steady multi-year rise in reported food-bank use. Step 1 passes: multiple reports over 24 months confirm recurrence. Step 2 passes: trend predates current inflation spike by years. Step 3 passes: cause is labor market structure, not individual choices. Step 4 passes: baseline poverty levels have shifted. Verdict: Commission explainer. This fits the intermediate rhythm of economies. The event (monthly report) is merely a data point confirming the conjoncture. The procedure validates the intuition that this is systemic. It moves beyond the news of the day to the condition of the year. The writers can prove the trend exists before you decide what it means.

  (3) The sudden collapse of a coastal fishery after decades of gradual decline. Step 1 passes: previous stock assessments showed decline. Step 2 passes: decades of data exist. Step 3 passes: climate and quota structures caused this. Step 4 passes: fishing rules fundamentally changed. Verdict: Commission explainer. This bridges the event and the structure. The suddenness is deceptive; the procedure identifies the long-duration cause. It qualifies as a structural take because the event was inevitable given the slow time of ecological change. The event is the climax, not the story itself. The data supports the deep-time narrative.

  **Where Judgment Takes Over**

  The procedure cannot eliminate editorial discretion; it merely delays it. Steps 3, 4, and 5 are marked "Judgment: Editor" because Braudel's tiers are not empirically distinct. A junior writer cannot definitively classify "systemic cause" without risking false negatives. You retain the authority to overrule a "Fail" at the factual stage if context suggests data is missing rather than absent. For example, if regulatory filings are sealed, the Recurrence Check might falsely fail. You may override based on source confidence or external expert consensus. However, this overrule requires a written justification attached to the commission. This prevents arbitrary decisions while acknowledging that data lag often masks structural shifts. The procedure protects the desk from noise, but you remain the final arbiter of signal. It is a tool for consistency, not a replacement for experience. When the data is ambiguous, your intuition about the historical weight of the moment supersedes the checklist. This ensures the desk does not miss a structural shift simply because the data has not yet caught up to the reality on the ground. You are the only one entitled to overrule, and only on grounds of hidden data or emergent structural rupture. This maintains the integrity of the filter while allowing for necessary exceptions.

  **What the Procedure Cannot Settle**

  This filter cannot confirm when a fast event has reset the slow structures themselves. Braudel treated events as foam, but history shows shocks can rewrite rules. The procedure assumes structure dictates event, not vice versa. It cannot identify a "black swan" that becomes the new normal until enough time passes to establish a new trend line. Therefore, it cannot greenlight a structural take on a genuine rupture immediately. Only hindsight confirms a reset. Furthermore, the procedure cannot settle disputes about ideological framing of structures. It identifies depth, not political truth. You must overrule the procedure when an event clearly breaks the model, accepting the risk of false positives. The tool manages volume, not prophecy. It is backward-looking by design, relying on established patterns to justify deep dives. It cannot predict the future weight of a present shock. You must accept that some structural stories will only be visible after the procedure would have killed them. This is the cost of filtering noise. The procedure sorts the known, not the unknown. It cannot tell you when the rules of the game have changed, only when the score suggests they might have.
