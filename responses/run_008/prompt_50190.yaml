answer: |-
  This is a pedagogical heavy lift, but your diagnosis is correct: the vocabulary/grammar distinction is the only way to save linguistic relativity from caricature, and it must be *felt* to be believed. If you lecture it, they will hear "vocabulary limits thought" anyway.

  Your proposed design is strong, but it risks cognitive overload. If students spend 40 minutes struggling to memorize 25 words, they won't have the bandwidth to notice the *grammatical* constraint. To make this work in 90 minutes with 12 students, we need to strip the lexicon to the bone and make the grammar **physical**.

  Here is a refined activity design, **"The Evidential Protocol,"** optimized for your constraints.

  ### The Core Mechanic: Grammar as Physical Tokens
  Instead of asking students to memorize suffixes, you will make grammatical categories **physical objects** they must manipulate to speak. This externalizes the "obligatory" nature of grammar.
  *   **Vocabulary:** 6 abstract shapes (representing objects) and 3 gestures (representing actions). No English words allowed.
  *   **Grammar:** Two colored chips per student. **Green** (Direct Evidence/I Saw) and **Yellow** (Indirect Evidence/I Heard).
  *   **The Rule:** To make a statement, a player must place a chip on the table *before* placing the shape/gesture card. No chip = No speech.

  ### The Setup (Pre-Class)
  *   **Bag Contents:**
      *   2 sets of 6 Shape Cards (Circle, Square, Triangle, etc.).
      *   2 sets of 3 Action Cards (Move, Stack, Drop).
      *   12 Green Chips, 12 Yellow Chips.
      *   12 "Log Sheets" (grid paper).
      *   Props for the skit: 3 distinct boxes, 3 distinct objects (e.g., a red mug, a blue book, a key).
  *   **Room:** Arrange chairs in two semi-circles facing you. Left side = **Group A (Obligatory)**. Right side = **Group B (Optional)**.

  ### Phase 1: Training (20 Minutes)
  **Goal:** Fluency in the protocol, not the lexicon.
  1.  **Distribute Materials:** Give both groups the Shape/Action cards and the Chips.
  2.  **Teach the Lexicon (5 mins):** Hold up a red mug. Show the "Circle" card. "This is Mug." Do this for 6 items. Have them repeat. *Crucial:* Do not let them write English words on the cards. Use the symbols only.
  3.  **Teach the Grammar (15 mins):**
      *   **Group A (Obligatory):** "You are Sensors. To report an event, you **must** place a Green chip (if you saw it) or Yellow chip (if you were told it) on the table. If you try to speak without placing a chip, I will stop you. You cannot opt out."
      *   **Group B (Optional):** "You are Observers. You have these chips. You **may** use them to clarify your report if you wish, but it is not required. Your goal is speed. Chips cost time."
      *   **Drill:** Run 5 practice rounds. Place an object. Group A must place a chip then the card. Group B just places the card. Correct Group A instantly if they miss the chip. This builds the motor habit.

  ### Phase 2: The Incident (10 Minutes)
  **Goal:** Create a memory trace where *source of information* varies.
  1.  **Instruction:** "Watch the following sequence. You will need to report it using your Protocol."
  2.  **The Skit (Performed by you):**
      *   *Event 1 (Visual):* You visibly place the Red Mug in Box 1. (Students **See** this).
      *   *Event 2 (Auditory):* You turn your back. A pre-recorded voice (or a TA behind a screen) says, "The Blue Book is in Box 2." You then place Box 2 on the table. (Students **Hear** this, do not see the placement).
      *   *Event 3 (Visual):* You visibly drop the Key in Box 3.
      *   *Event 4 (Ambiguous):* You walk past Box 4. It is already there. You say nothing.
  3.  **Encoding Task:** Immediately after the skit, give them 3 minutes to fill out their Log Sheet.
      *   **Group A:** Must mark Green/Yellow next to every item logged. They cannot finish the sheet without deciding on evidence for every item.
      *   **Group B:** Just list the items/locations. They can ignore the source.

  ### Phase 3: The Report & Memory Test (25 Minutes)
  **Goal:** Measure the cost of encoding and the retention of obligatory data.
  1.  **The Report (10 mins):** Call one student from each group to the front. Ask: "Where is the Blue Book?"
      *   **Measure:** Time how long it takes them to start speaking. (Group A should hesitate as they retrieve the evidence status; Group B should be faster).
      *   **Measure:** Count how many evidential markers Group B uses voluntarily. (Likely few).
  2.  **The Surprise Memory Test (15 mins):** Hand out a quiz to *both* groups.
      *   *Question 1 (Content):* Where is the Red Mug? (Both should get this right).
      *   *Question 2 (Source):* How did you know the Blue Book was in Box 2? (Did you see it or hear it?)
      *   *Question 3 (Peripheral):* What color was my shirt? (Neither group encoded this).
      *   *Question 4 (Interference):* Was the Key placed before or after the Book?

  ### Phase 4: The Debrief (35 Minutes)
  **Goal:** Map the experience to the theory. Do not start with theory; start with their frustration.

  **1. The Phenomenological Check (10 mins)**
  *   Ask Group A: "At what moment did you feel the constraint? Was it when you were watching, or when you were speaking?"
      *   *Target Insight:* They likely felt it during the Log Sheet phase. They had to categorize the memory *to store it* in a reportable format.
  *   Ask Group B: "Did you notice the source of information for the Blue Book?"
      *   *Target Insight:* They remember the *fact* (Book in Box 2) but the *source* is fuzzy.
  *   Ask Group A: "Did marking the evidence help you remember the source on the quiz?"
      *   *Target Insight:* Yes. The obligatory grammar forced deeper encoding of that specific feature.

  **2. The Theoretical Map (15 mins)**
  *   **Vocabulary vs. Grammar:** Draw two columns on the board.
      *   *Col 1 (Vocab):* "Snow." You can choose to say it or not. It expands what you *can* say.
      *   *Col 2 (Grammar):* "Evidence." Group A *could not speak* without choosing Green or Yellow. It changes what you *must* notice.
  *   **The "Thought" Claim:** Clarify that Group B *could* conceive of "hearsay." They had the Yellow chip. But because their system didn't *force* them to tag it, their attention didn't prioritize it during encoding.
      *   *Key Phrase:* "Language does not build a prison of concepts; it builds a habit of attention."
  *   **The Data:** Reveal the quiz results. If Group A scored higher on Source questions, highlight that. If not, highlight the *time delay* in reporting. The cost of obligatory encoding is real.

  **3. The Objection: "20 Minutes vs. A Lifetime" (10 mins)**
  *   Be frank. Write on the board: **ECOLOGICAL VALIDITY.**
  *   **What this proves:** It proves that *online processing* is altered by obligatory categories. It proves attention is diverted to grammatical requirements under time pressure.
  *   **What this does NOT prove:** It does not prove Group A now has a different "worldview." They didn't become better truth-seekers; they just followed a rule.
  *   **The Real Claim:** In a real language, this isn't a conscious rule ("I must add a suffix"). It is automatic. The "habit of attention" becomes unconscious over a lifetime. This activity is the "learning phase" of that habit. You are simulating the *acquisition of the habit*, not the *result of the habit*.
  *   **Closing Point:** "If 20 minutes of forcing you to mark evidence made you better at remembering evidence, imagine 20 years of forcing a child to mark spatial orientation or gender or number. The effect isn't that they can't think other thoughts; it's that their brain becomes incredibly efficient at tracking the obligatory stuff, potentially at the expense of the optional stuff."

  ### Predicting Failure Modes

  **1. The Translation Problem (Your Main Worry)**
  *   *Risk:* Students think "I saw it" in English, then grab the Green chip. This bypasses the "thinking in language" effect.
  *   *Mitigation:* The **Shape Cards**. By removing English labels for the objects (Mug = Circle), you break the inner speech loop for the *noun*. They cannot subvocalize "Mug." They must map Perception -> Shape.
  *   *Residual Risk:* They will still subvocalize the grammar ("I saw").
  *   *Acceptance:* **Plan for this.** You cannot stop inner English in 20 minutes. However, the *physical act* of stopping to find the chip interrupts the flow. The friction is the point. In the debrief, admit this: "You translated. That's fine. But you still had to stop and categorize. In a native speaker, that categorization is automatic, saving the time but keeping the attentional focus."

  **2. Group B "Cheating"**
  *   *Risk:* Group B students are high-achievers and decide to use the chips anyway to be "thorough."
  *   *Mitigation:* Incentivize speed. "The first group to deliver a correct report gets [small privilege/points]." Group A cannot rush (must mark evidence). Group B can rush (ignore evidence). This creates the divergence in strategy.

  **3. No Significant Difference in Data**
  *   *Risk:* The memory test shows no difference between groups.
  *   *Mitigation:* Pivot to the **experience**. "Even if your scores are the same, how did it *feel* to be unable to speak without the chip?" The philosophical point holds even if the psychological effect is weak in a single session. The *constraint* was real, even if the *cognitive change* wasn't measurable yet.

  ### Why This Works Better Than Your Draft
  1.  **Physical Tokens:** Making grammar physical prevents it from becoming just "more vocabulary." You can ignore a word; you cannot ignore a key you need to unlock your mouth.
  2.  **Abstract Symbols:** Blocking English nouns reduces translation noise.
  3.  **Incentivized Speed:** Forces Group B to treat grammar as optional cost, highlighting Group A's obligatory cost.
  4.  **Honest Debrief:** It explicitly tackles the "lab vs. life" validity issue, which builds trust with upper-level students who are skeptical of parlor tricks.

  This structure turns the "pop version" (words = concepts) into a lived experience of "grammar = attention," which is the exact conceptual shift you need for the rest of the term.
