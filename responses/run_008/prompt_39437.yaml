answer: |-
  # Q&A Prep Sheet: Defending Telic Egalitarianism Against Leveling-Down

  **Thesis Recap:** LDO fails if we distinguish *pro tanto* value (equality is a component of the good) from *all-things-considered* betterness (leveling down is still worse overall). Analogy: Hedonism admits a life can contain pleasure (good *pro tanto*) yet be worse overall.

  ---

  ### 1. The Prioritarian Objection (The Majority of the Room)
  **The Idiom:** Person-affecting views, Pareto principles, Parfitian "complaints," impersonal value skepticism.
  **The Question:** "You're trying to salvage telic egalitarianism by retreating to *pro tanto* value, but this just resurrects the impersonal value Parfit rejected for a reason. If leveling down benefits no one and harms the worse-off, in what sense is the resulting equality 'good'? You're asking us to fetishize a pattern over people. If the *pro tanto* good doesn't attach to a subject's welfare, isn't it morally idle?"

  **The Two-Minute Reply:**
  "I grant that Parfit successfully showed equality cannot be the *sole* determinant of betterness. However, rejecting equality as the *whole* story doesn't require rejecting it as a *part* of the story. The Prioritarian view says we should benefit the worse off because it matters more *to them*. I agree. But I argue there is an additional, impersonal value in the *relation* between them.
  Think of the hedonism analogy again. If I listen to beautiful music while starving, the music is *pro tanto* good, even if the life is worse overall. The value of the music doesn't vanish because I'm starving. Similarly, the value of equality doesn't vanish because the aggregate welfare drops. It is not 'morally idle' because it explains why we have a reason to resist inequality even when utility gains are small. It captures the moral regret we feel in LDO scenarios that pure prioritarianism misses. We regret the loss of equality even while acknowledging the outcome is worse."

  **Where the Reply is Soft:**
  It relies heavily on the intuition that "impersonal goods" are coherent. Hardline person-affecting theorists will deny the music analogy holds because pleasure is *for* someone, whereas equality in LDO is *for* no one.

  **What to Concede Up Front:**
  Concede that equality is not lexically prior to welfare. "I agree that *pro tanto* equality never trumps severe welfare losses. LDO is always all-things-considered worse. My claim is only that it contains a residue of value."

  ---

  ### 2. The Act-Utilitarian Objection (The Two Pragmatists)
  **The Idiom:** Maximization, decision procedures, trade-off ratios, calculus, action-guidance.
  **The Question:** "Okay, let's accept your pluralism. Value comes in competing components: welfare and equality. But ethics is about decision-making. What is the exchange rate? If I can increase equality by 10 units by lowering A's welfare by 5 units, do I do it? If you can't provide a decision procedure or a weighting function, your *pro tanto* claim is theoretically interesting but practically useless."

  **The Two-Minute Reply:**
  "This assumes a monistic theory of value is required for a functional decision procedure. Most plausible normative theories are pluralistic. We weigh liberty against security, or truth against kindness, without a precise calculus. My claim is that equality is a weight on the scale, not the scale itself.
  In practice, we use reflective equilibrium. We know that leveling down is wrong because the welfare loss outweighs the equality gain. But in marginal cases—say, a tiny tax on the rich that causes negligible welfare loss but significant equality gain—the *pro tanto* value of equality tips the scale. The lack of a strict algorithm doesn't negate the value; it just acknowledges the complexity of moral deliberation. The theory guides action by identifying a relevant reason, even if it doesn't compute the final sum."

  **Where the Reply is Soft:**
  Utilitarians hate "it depends" answers. If the *pro tanto* value never tips the scale in hard cases (because welfare usually dominates), they will argue it's an "idle wheel" in the decision procedure.

  **What to Concede Up Front:**
  Concede there is no algorithm. "I am not offering a moral calculator. I am offering an account of what counts as a reason. The weighting is context-dependent."

  ---

  ### 3. The Luck Egalitarian Objection (The Specialist)
  **The Idiom:** Brute luck vs. option luck, responsibility, unfairness, deontic vs. telic.
  **The Question:** "You're defending *telic* equality (patterns), but the real work is done by *deontic* equality (fairness). If two people are unequal due to brute luck, that's unjust. If they are unequal due to choices, it's not. Your *pro tanto* telic value seems to imply inequality is bad even when it's deserved. Why not just say deontic equality does all the work? Telic equality seems redundant or over-demanding."

  **The Two-Minute Reply:**
  "Deontic equality explains why some inequalities are *unjust*, but it doesn't explain why some inequalities are *sad* or *regrettable* even when just. Consider natural disasters: if one group is hit by a quake and another isn't, there may be no agent to blame (no deontic violation), yet we still feel the resulting inequality is a negative state of affairs we should mitigate.
  Telic egalitarianism captures this residual badness. It provides the baseline value that deontic theories often presuppose. Why is it unfair for brute luck to cause inequality? Because equality is *pro tanto* valuable. Deontic equality handles the blame; telic equality handles the value of the distribution itself. We need both to capture the full landscape of distributive justice."

  **Where the Reply is Soft:**
  There is significant overlap. If the Luck Egalitarian argues that all "regrettable" inequalities are actually matters of institutional design (and thus deontic), the telic component looks redundant.

  **What to Concede Up Front:**
  Concede that deontic equality is necessary for assessing justice/blame. "I am not replacing deontic equality; I am supplementing it to account for non-agent-relative badness."

  ---

  ### 4. The Question I Am Hoping Nobody Asks
  **The Idiom:** Meta-ethics, Normativity, The "Good For" vs. "Good Simpliciter" distinction.
  **The Question:** "In your hedonism analogy, the pleasure is *good for* the subject, even if the life is worse overall. In Leveling Down, the equality is *good for no one*. You are equating 'good for a subject' with 'good simpliciter.' If a value cannot be cashed out in terms of how it affects a subject's life, is it a *moral* value at all, or merely an aesthetic one? If it's merely aesthetic, why does it generate moral reasons for agents?"

  **Why this is devastating:**
  It attacks the core analogy of the thesis. If the analogy collapses, the defense of *pro tanto* value collapses. It forces me to defend the existence of "impersonal moral value" without sounding like I'm worshipping a pattern for its own sake. It suggests my theory alienates morality from human welfare entirely.

  **Prepared (Hasty) Defense:**
  "I distinguish between *moral* value and *welfare* value. Moral value includes states of affairs that rational agents have reason to promote, even if not for a specific subject's sake—like the preservation of a species or the existence of beauty. Equality is a structural feature of a community that has moral significance beyond the sum of individual welfares." ( *Risk: This sounds like the fetishism charge the Prioritarians already made.*)
