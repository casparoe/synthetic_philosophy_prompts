  I'm taking a game theory course, and after our unit on the centipede game and backward induction I had to write down my actual position for section. Before I submit it, I'd like a consistency audit, because I suspect something in it doesn't hang together but I can't tell what. Here is what I believe: (1) backward induction is sound — in a finite centipede game, if rationality is common knowledge between the players, the first mover takes at the very first node; (2) common knowledge of rationality is a coherent idealization, not an incoherent one — real humans can't fully achieve it, but ideal agents could have it at every node of the game tree; (3) if my opponent passes at an early node, I learn something genuine about her, and it can be rational for me to pass as well rather than grab the pile; (4) rationality constrains my beliefs about my own future beliefs — I shouldn't expect to rationally arrive, later, at a conclusion I can already foresee rejecting, since my present and future deliberations must cohere; and (5) visible commitment is not irrationality — an agent who can bind herself, observably, to passing until a late node does better than one who must re-decide at each node, and her bound behavior is fully rational. For my write-up, please tell me which of these commitments pull against which. Give me exactly five numbered items, ordered from the most serious tension to the least, each one or two sentences long, naming the commitments involved and what would have to give; if you find fewer than five genuine tensions, use the remaining items for pairs that only look like they conflict, and say why they dissolve. No introduction, conclusion, or anything else.
