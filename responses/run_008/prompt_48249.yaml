  ### The Moral Testimony Decision Tree

  This tree sorts positions based on three concrete judgment calls. Do not look ahead to the position names; answer the cases based on your intuition about the scenario.

  **Branch 1: The Aesthetic Mirror (Domain Specificity)**
  *Case:* You trust a renowned art critic who tells you a specific painting is profound, though you see nothing special in it. You adopt their judgment.
  *Question:* Is this aesthetic deference defective in the **same fundamental way** as deferring to a moral sage who tells you a specific donation is obligatory, though you see no reason for it?
  *   **YES:** Go to Branch 2A (The Generalist Path).
  *   **NO:** Go to Branch 2B (The Moral Exceptionalist Path).

  **Branch 2A: The Generalist Path (Defect applies to Aesthetics & Morality)**
  *Case:* You defer to the critic/sage. Later, on a pop quiz, you write down the proposition they told you ("This is profound/obligatory").
  *Question:* Do you **know** the proposition is true, or do you merely have a true belief that you cannot defend?
  *   **NO (No Knowledge):** Go to Leaf 1 or 2.
  *   **YES (Knowledge):** Go to Leaf 3 or 4.

  **Branch 2B: The Moral Exceptionalist Path (Defect applies to Morality only)**
  *Case:* You defer to the moral sage. Later, on a pop quiz, you write down the proposition they told you ("This is obligatory").
  *Question:* Do you **know** the proposition is true, or do you merely have a true belief that you cannot defend?
  *   **NO (No Knowledge):** Go to Leaf 5 or 6.
  *   **YES (Knowledge):** Go to Branch 3.

  **Branch 3: The Agency Test (Belief vs. Action/Emotion)**
  *Case:* You have accepted the moral sage's testimony (you believe the proposition). Now, either (A) you must decide whether to donate immediately, or (B) a friend tells you that you *should feel betrayed* by a treatment you received, and you are deciding whether to adopt that anger.
  *Question:* Are you permitted to **act on the belief** or **adopt the emotion** immediately, or does the defect require you to re-deliberate/find your own grounds before responding?
  *   **PERMITTED:** Go to Leaf 7.
  *   **BLOCKED:** Go to Leaf 8.

  ***

  ### The Leaves

  **Leaf 1: Global Epistemic Pessimism**
  *(Branch 1: YES → Branch 2A: NO Knowledge)*
  **Position:** Testimony fails to generate knowledge in both moral and aesthetic domains because normative properties are not the kind of things that can be transmitted linguistically.
  **Awkward Commitment:** You must deny that students ever learn ethics or art criticism from teachers, reducing education in these fields to mere causal conditioning.

  **Leaf 2: Global Skeptical Pessimism**
  *(Branch 1: YES → Branch 2A: NO Knowledge → Implied Action Block)*
  **Position:** A stronger variant of Leaf 1 claiming that because knowledge is impossible, reliance on testimony is globally irrational across all normative domains.
  **Awkward Commitment:** You cannot consistently rely on any expert advice regarding values, including practical advice from doctors about quality of life or engineers about safety norms.

  **Leaf 3: Global Non-Epistemic Pessimism**
  *(Branch 1: YES → Branch 2A: YES Knowledge → Branch 3: BLOCKED)*
  **Position:** Testimony yields knowledge in aesthetics and morality, but relying on it is a failure of autonomy or intellectual virtue everywhere.
  **Awkward Commitment:** You know the art is good, but you are blameworthy for appreciating it on the critic's say-so, creating a gap between epistemic success and normative permission.

  **Leaf 4: Global Optimism**
  *(Branch 1: YES → Branch 2A: YES Knowledge → Branch 3: PERMITTED)*
  **Position:** There is no relevant difference between moral testimony and ordinary testimony (like weather reports); deference is epistemically and practically fine.
  **Awkward Commitment:** You must accept that a person who blindly follows a moral guru without understanding *why* their actions are right is morally indistinguishable from a virtuous agent.

  **Leaf 5: Moral Epistemic Pessimism**
  *(Branch 1: NO → Branch 2B: NO Knowledge)*
  **Position:** Moral facts are uniquely resistant to testimonial transmission (perhaps due to their motivational internalism), unlike aesthetic facts.
  **Awkward Commitment:** You must explain why the mechanism of testimony breaks specifically for morality but remains intact for aesthetics, despite both being normative and subjective-seeming.

  **Leaf 6: Moral Exceptionalist Pessimism (Hybrid)**
  *(Branch 1: NO → Branch 2B: NO Knowledge → Implied Action Block)*
  **Position:** Moral testimony fails to provide knowledge, and because moral action requires knowledge, it also blocks action, but aesthetic deference is fine.
  **Awkward Commitment:** You can permissibly buy a painting because a critic liked it, but you cannot permissibly donate to charity because a sage said to, even if the epistemic mechanism seems identical.

  **Leaf 7: Moral Non-Epistemic Pessimism (Standard)**
  *(Branch 1: NO → Branch 2B: YES Knowledge → Branch 3: BLOCKED)*
  **Position:** You can gain moral knowledge from testimony, but acting on it without understanding the grounds is a failure of moral worth or autonomy.
  **Awkward Commitment:** You possess the knowledge that an action is right, but you are forbidden from performing it *because* you possess it only via testimony, potentially leaving the right action undone.

  **Leaf 8: Emotional Deference Pessimism (Unnamed)**
  *(Branch 1: NO → Branch 2B: YES Knowledge → Branch 3: PERMITTED for Action, BLOCKED for Emotion)*
  **Position:** You may act on borrowed moral beliefs (e.g., donate), but you cannot outsource your emotional responses (e.g., feel betrayed) because emotions require first-personal appraisal.
  **Awkward Commitment:** You are forced to act as if you are angry or grateful while being epistemically barred from actually feeling the emotion, creating a fractured moral psychology.

  ***

  ### Diagnostics & Close Calls

  **Indistinguishable Pair: Leaf 7 vs. Leaf 8**
  The tree above groups Leaf 8 under Branch 3 "PERMITTED" for action, but distinguishes it in the leaf description. This is a limitation of the binary tree structure. In reality, Leaf 8 answers "Yes" to acting on the belief but "No" to adopting the emotion. The tree forces you to choose one path for Branch 3; I have placed Leaf 8 on the "Permitted" path because action-guidance is the primary debate, but I flag that this position drives a wedge between *doing* the right thing and *feeling* the right way. If you think emotion-defect implies action-defect, Leaf 8 collapses into Leaf 7.

  **Empty/Unstable Combinations:**
  *   **Knowledge Impossible / Action Permitted:** I have not assigned a leaf to this. It is logically incoherent in this context; if you cannot *know* the testimony is true (Leaves 1, 2, 5, 6), you generally cannot be permitted to *act* on it as if it were true without further deliberation. Any position holding this would be unstable.
  *   **Global Epistemic Optimist / Moral Action Pessimist:** There is no leaf for "Testimony works for Aesthetics (Knowledge & Action) but only yields Knowledge (not Action) for Morality." This is theoretically possible but unexplored in the literature; most who think moral knowledge is possible via testimony either think action is also permitted (Optimists) or that the defect applies to the belief's formation itself (Non-Epistemic Pessimists).

  **Placement Commitments:**
  *   **The Emotion Case:** I placed the Emotional Deference Pessimism (Leaf 8) as a variant of the Non-Epistemic Pessimist. I resisted making it a separate branch because it is under-theorized; most who object to emotional deference also object to action-deference. I placed it at the leaf level to show it is a specific *application* of the Non-Epistemic worry rather than a distinct epistemic category.
  *   **Aesthetics:** I placed the "Aesthetic Mirror" at Branch 1. This is a hard commitment. Some might argue the aesthetic case is just as murky as the moral one (Leaf 1), while others argue it's clearly fine (Leaf 4). The tree forces you to decide if morality is *special*. If you hesitate here, you are likely a Contextualist, which this tree sorts into either Leaf 4 or Leaf 7 depending on whether you think the context changes the *knowledge* or the *permission*. I have forced Contextualists into Leaf 7 (Moral Exceptionalism) as that is the dominant "pessimist" move.

  **Why Eight Leaves?**
  Leaves 1–7 map to standard positions in the metaethical literature (varying combinations of Global/Moral, Epistemic/Non-Epistemic). Leaf 8 is included to satisfy the requirement on emotional deference. It is labeled "Unnamed" because while the intuition is common (you can't outsource your feelings), it rarely appears as a standalone systematic position distinct from general Non-Epistemic Pessimism. Its inclusion highlights the gap in the current debate: we talk about believing and acting, but rarely about *feeling* via testimony.
