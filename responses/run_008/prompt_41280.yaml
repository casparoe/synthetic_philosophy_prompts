      *   *Observation of her behavior:* She accepts rare natural events (lottery, desert rain). She accepts scientific paradigm shifts (1919 eclipse). She accepts historical facts (Caesar). She rejects religious miracles. She accepts 20 heads but posits a hidden natural cause (rigging) rather than accepting a violation of probability/physics.
