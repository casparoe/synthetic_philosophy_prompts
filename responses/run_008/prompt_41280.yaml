answer: |-
  Here is the breakdown of your friend's position, the predictions for your dinner cases, and the specific move you need to make to test her consistency.

  ### 1. The Diagnosis: Which Rule Is She Running?

  Your friend is **not** running a pure Humean calculus (Rule 2). Hume explicitly allows that testimony *could* theoretically outweigh a law of nature if the falsehood of the testimony were even more miraculous. Your friend's "hardline" label and her track record suggest she has hardened this into a methodological principle.

  She is running a hybrid of **Rule 1 (Never accept violation)** and **Rule 3 (Discount bias)**, but the engine is **Methodological Naturalism**.

  *   **The Core Rule:** *"Testimony can establish any event that is physically possible, no matter how improbable. Testimony cannot establish an event that violates a law of nature. If testimony claims a violation, the testimony is flawed, or the event is misdescribed, or the 'law' was merely a provisional theory."*

  **How her verdicts map to this:**
  *   **Caesar / Lottery / Desert Rain:** These are **improbable but lawful**. The laws of nature allow for assassinations, random number generation, and rare weather patterns. **Verdict: Belief.** (Fits all rules).
  *   **1919 Eclipse:** This is the critical case. She accepts this because she classifies Newton's gravity as a **provisional theory**, not a final "Law of Nature." Einstein didn't violate nature; he corrected human error about nature. **Verdict: Belief.** (Fits Rule 1 only if "Law" means "True Description," not "Current Consensus").
  *   **Fatima / Lourdes:** These are **law-violations** (supernatural intervention) + **high bias** (religious wish-fulfillment). **Verdict: Disbelief.** (Fits Rule 1 and Rule 3).
  *   **20 Heads in a Row:** This is a **probability violation** (effectively a law of statistics). She believes the *observation* (the coin showed heads) but rejects the *process* (fair toss). She infers a hidden natural cause (rigging) to preserve the law of probability. **Verdict: Belief in outcome, Disbelief in chance.** (Fits Rule 1).

  ### 2. Predictions for the New Cases

  Here is how each rule predicts she will respond, followed by my best guess at what she will actually say.

  #### Case (a): The Triple Royal Flush
  *   **The Setup:** Disinterested friend, witnessed shuffling, 3 royal flushes in a row.
  *   **Rule 1 (No Violations):** A royal flush is physically possible. It is not a violation of natural law, merely a statistical outlier. She *should* accept it.
  *   **Rule 2 (Weigh Evidence):** The improbability (~1 in $10^{17}$) is higher than the lottery. She must weigh the friend's reliability against the odds.
  *   **Rule 3 (Bias):** No religious/wishful bias present.
  *   **My Best Guess:** She will **believe the cards were royal flushes, but infer a hidden natural cause.**
      *   *Reasoning:* Parallel to the 20-heads case. She trusts her friend's eyes (the cards *were* flushes) but she will not accept "blind chance" as the explanation. She will suggest the shuffle was flawed, the deck was marked, or the cards were switched, despite the friend's report. She protects the *law of probability* by positing a hidden physical cause, just as she posited rigging for the coin.

  #### Case (b): The Levitation (1,000 Witnesses + Video)
  *   **The Setup:** Mass testimony + technological record of a law violation.
  *   **Rule 1 (No Violations):** **Reject.** No testimony is sufficient for a miracle. The video must be fake, or the witnesses compromised.
  *   **Rule 2 (Weigh Evidence):** **Theoretically Accept.** If the evidence is strong enough, it outweighs the prior. But since she is "hardline," she likely sets the bar infinitely high.
  *   **Rule 3 (Bias):** **Reject.** If the context is religious, she cites bias. If secular, she cites mass hysteria.
  *   **My Best Guess:** She will **Reject the miracle.**
      *   *Reasoning:* She will not say "Levitation happened." She will say, "The video is deep-fake," or "There was a magnetic field we didn't measure," or "It was a trick."
      *   **⚠️ THE ESCAPE ROUTE:** If pressed, she will claim that if it *did* happen, **gravity was not a "Law of Nature" but merely a generalization.** She will argue that true Laws of Nature cannot be violated by definition; therefore, a verified levitation simply proves our previous understanding of gravity was incomplete (like the 1919 Eclipse).

  ### 3. The "Killer Case" to Split the Rules

  To expose whether she is a true Humean (Rule 2) or a Dogmatic Naturalist (Rule 1), you need to remove the "Testimony" variable. Hume's argument relies on the unreliability of *others*. If *she* is the observer, testimony is removed.

  **Put this case to her at the table:**

  > "Imagine you are in a lab. You are the only observer. You place a ball on a table. You film it with a camera you calibrated yourself. You watch the ball rise three feet into the air and hover for ten seconds. No religious context. No witnesses to contradict you. Just you, the video, and the ball.
  >
  > **Do you believe your eyes?**
  >
  > *   **Option A:** 'Yes, it happened.' (This admits that testimony/observation *can* overthrow a law. She is now a Rule 2 Humean. She must admit the 1,000 witnesses in Case B *could* be right.)
  > *   **Option B:** 'No, I would assume I am hallucinating or the camera is broken.' (This reveals Rule 1: Her commitment to the Law is stronger than her commitment to her own senses.)"

  **Why this splits them:**
  *   If she chooses **A**, she admits that evidence *can* overturn a law. You can then press her on why 1,000 witnesses + video in Case (b) isn't enough evidence if her own eyes would be.
  *   If she chooses **B**, she reveals that her principle is unfalsifiable. She values the *concept* of the Law of Nature more than empirical reality. At that point, you can point out that her position isn't empirical skepticism; it's a priori dogma.

  ### 4. How to Press the "Escape Route" in Case (b)

  You flagged that you want to push her on the "redefining laws" escape route. Here is the specific follow-up question for when she claims levitation just means "gravity isn't a law":

  > "If *any* verified counter-example simply redefines the law so that the violation never happened, **what would it take for you to admit a miracle occurred?**
  >
  > If a 'Law of Nature' is just 'whatever doesn't get violated,' then your rule is a tautology. You're saying: *'I won't believe a violation of nature, because if it happened, it wasn't a violation.'*
  >
  > Is there **any** amount of evidence that would make you say, 'Okay, the laws of nature were actually broken here,' or do you reserve the right to explain away every anomaly as a 'hidden natural cause' forever?"

  **The Goal:** Force her to admit that her "Hardline Humeanism" protects her from ever changing her mind. If she says "No evidence could convince me," she has abandoned evidence-based reasoning (the very thing she claims to champion) in favor of faith in Naturalism. If she says "Yes, evidence could convince me," she has to explain why the 1,000 witnesses in Case (b) don't count.
