answer: |-
  (a) **The Scenario**
  Eleanor is a healthy-looking adult with a family history of Huntington's disease, a fatal, incurable neurodegenerative condition that remains asymptomatic for decades. She lives a happy life with her family, deriving utility from her daily activities and her peace of mind. A clinic offers her a perfectly reliable genetic test free of charge; the result will be private, recorded nowhere, and never disclosed to insurers or relatives. Eleanor faces a single decision: whether to continue her current lifestyle (the only available act), which yields high utility if she remains hopeful, but significantly reduced utility if she lives with the certain knowledge of her impending decline. She knows that if she tests positive, the dread will overshadow her remaining healthy years, whereas if she remains ignorant, she retains the hope of being negative. Despite the information being free, private, and reliable, Eleanor rationally declines the test to preserve her current quality of life.

  (b) **Naive Application of the Theorem**
  A careless application of Good's theorem begins by formalising Eleanor's decision problem. The set of acts is fixed: $\{ \text{Continue Lifestyle} \}$. The set of states is fixed: $\{ \text{Gene Positive}, \text{Gene Negative} \}$. The payoffs are ostensibly determined by the state and the act: continuing life while positive yields a baseline biological utility, as does continuing while negative. The signal is the test result, which perfectly correlates with the state. Good's theorem dictates that the expected utility of the optimal policy conditional on the signal (testing, then living) must be at least as high as the optimal policy without the signal (not testing, then living). Since the act is identical in both branches, the theorem predicts the information should be worthless but never harmful; the expected utility of testing should equal the expected utility of not testing, assuming the act cannot change to mitigate the state. Therefore, a rational expected-utility maximiser should be indifferent, or perhaps slightly prefer testing to satisfy the principle of total evidence. The theorem cannot accommodate Eleanor's strict preference for ignorance.

  (c) **Diagnosis**
  The case violates the premise that **payoffs depend only on the chosen act and the true state**. In Good's formalism, the utility function is $U(s, a)$, invariant to the agent's epistemic state. In Eleanor's case, the utility function is $U(s, a, k)$, where $k$ represents her knowledge state. The physical act (living) and the physical state (gene status) are identical whether she knows or not, yet the utility differs because her anticipation and dread are constitutive of her well-being. This diagnosis is superior to the rival explanation that the **available acts depend on what the agent knows**. One might argue that knowing she is positive forecloses the act of 'living hopefully'. However, this conflates the *valuation* of an act with the *availability* of an act. Eleanor remains physically capable of continuing her lifestyle regardless of the test result; the constraint is not on her agency but on her enjoyment. A case built on the 'acts' route would require external constraints (e.g., legal duties triggered by knowledge), which risks violating the privacy constraint by involving third-party enforcement. The 'payoffs' route keeps the violation internal to the agent's utility function, isolating the failure to the theorem's consequentialist assumption that only world-states matter.

  (d) **The Defender's Reply and Verdict**
  A defender of Good's theorem will offer a bookkeeping reply: the theorem holds for utility functions defined over final world-states only; if Eleanor cares about her mental state, 'peace of mind' must be included in the description of the outcome. Thus, the outcome 'Positive Gene + Ignorant' is distinct from 'Positive Gene + Known'. By this lights, the information was not free; the 'cost' was the inevitable shift from a high-value outcome (Ignorant) to a low-value outcome (Known). My verdict is that this reply saves the theorem only by relabelling its failure. To say 'information had a price' implies a transaction separate from the content of the information, whereas here the 'price' is intrinsic to the information itself. The distinction is substantive: if utility depends on knowledge, information is never neutral, and the theorem's guarantee of non-negative value collapses. The defender's move vindicates the mathematics but admits the theorem does not apply to agents whose welfare depends on their epistemic condition, which is precisely the class of agents Eleanor represents.

  (e) **Note on Removing the Offending Feature**
  If we remove the dependency of payoffs on beliefs—suppose Eleanor is a stoic who derives exactly the same utility from her life regardless of whether she knows her genetic fate—the case collapses back into conformity with the theorem. In this modified scenario, $U(\text{Positive}, \text{Live}, \text{Known}) = U(\text{Positive}, \text{Live}, \text{Ignorant})$. Since the test offers no instrumental value (there is no cure to trigger a change in acts), the expected utility of testing becomes exactly equal to the expected utility of not testing. The information becomes worthless, but never harmful, restoring the weak inequality predicted by Good's theorem.
