  My study group has been stuck on the centipede game for two weeks and I want to settle it with numbers instead of vibes. The question I want your credence on: does common knowledge of rationality actually *entail* the backward induction outcome, i.e., that the first player takes at the very first node? The standard textbook story says yes — you peel the game back from the end and player 1 grabs immediately. But the argument only works if players are still rational at nodes that, per the argument itself, would never be reached, and if everyone knows that everyone is rational at those unreachable nodes, and knows that everyone knows... which starts to feel circular. So is the textbook story a theorem, a mistake, or something in between?

  Give me an actual probability that common knowledge of rationality (suitably formalized) logically implies the backward induction outcome, and decompose it. I'd expect terms something like: the probability that the right notion of rationality is node-conditional (you're rational at every node you could reach, even ones your own rationality excludes) versus only conditional on the path actually played; the probability that "common knowledge" at an unreachable node is even coherent vs needing to be weakened to common belief; the probability that the formal results people gesture at, once stated precisely, deliver the everyday backward induction conclusion rather than a weaker or more conditional one; and any term you think belongs that I've missed. Put a rough number and a one-line defense on each, combine them, and then tell me which single sub-question is doing the most work — i.e., where someone who disagrees with your final number most plausibly disagrees.

  For calibration, my credence is around 0.5 and my friend says 0.9 (she thinks the whole "paradox" is philosophers being squeamish about counterfactuals), but honestly neither of us could pass an exam on what the formal claim even is, so don't let our numbers anchor you. And if you think the question as I've posed it conflates two different things (e.g., "rationality" as utility-maximizing vs as non-strictly-dominated play, or knowledge vs belief versions), please split it and give me a number for each version rather than a hedge — that's exactly the sort of thing I'm trying to figure out.
