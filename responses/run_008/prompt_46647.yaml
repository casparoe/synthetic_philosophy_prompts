          2.  Derive verdicts from reasoning (not stipulated). Show Kelly betting shifts from modest to "all-in surplus" when undercapitalized.
          3.  Include Expected Wealth Maximizer (EWM). Compare EWM to Geometric Agent. Discuss convergence.
          4.  Walkthrough: State verdicts, formalize ruin in geometric framework, identify the key feature (fixed cost/deadline), show what happens when removed.
          5.  Steelman the friend: Address human capital/non-absorbing floor. Does it dissolve the case?
          6.  Friedman/Savage thread: Explain lottery buying via arithmetic/burn/time, not curved utility.
          7.  Tone: Serious, analytical, empathetic but rigorous. No fluff.

  2.  **Deconstruct the Mathematical/Economic Logic:**
      *   *Standard Kelly:* Maximize $E[\log(W_{t+1})]$. Assumes infinite horizon or no consumption needs. Optimal fraction $f^* = (p(b+1)-1)/b$.
      *   *The Twist:* Fixed cost $C$ per period. Hard deadline $T$. Ruin if $W_T < 0$ (or some threshold).
      *   *The Conflict:* If $W_t$ is large relative to $C$, Kelly looks standard. If $W_t$ is close to $T \times C$, standard Kelly betting might result in $W_T < T \times C$ with high probability because the drift isn't high enough to outpace the burn *safely*.
      *   *Wait, actually:* The user argues that "cautious play burns capital." This is true if the expected return on capital is *less* than the burn rate. But the prompt specifies a "genuinely favorable" opportunity (positive expected return).
      *   *Refinement:* Even with positive EV, if the *growth rate* of the Kelly strategy is slower than the *burn rate* required to survive until the deadline, the probability of survival under standard Kelly approaches zero. To maximize survival probability (which becomes the dominant term in the utility function near the barrier), the agent must increase variance.
      *   *Formalizing Ruin:* In standard Kelly, $W=0$ is absorbing and utility $\to -\infty$. But here, ruin is defined as $W_T < \text{Survival Threshold}$.
      *   *The "Desperation" Mechanism:* If I need \$100k in 4 months to pay debts, and I have \$20k now. Safe betting gets me to \$30k on average. I still die. I need to get to \$100k. I must bet big to have *any* chance of hitting the threshold, even if it increases the chance of hitting zero sooner.
      *   *Expected Wealth Maximizer:* Maximizes $E[W_T]$. Will generally bet full Kelly or leverage up depending on constraints. Often ignores ruin probability.
      *   *Convergence:* As the survival threshold approaches current wealth, the Geometric Agent (maximizing log wealth subject to survival) behaves more like the EWM (maximizing upside) because the "log" penalty for ruin is already almost certain under safe strategies.

  3.  **Drafting - Section by Section:**

      *   **1. The Scenario (One Paragraph):**
          *   Need a specific trade. Let's stick with the caterer or a general contractor. Let's use a generic "proprietor" to fit the prompt's option.
