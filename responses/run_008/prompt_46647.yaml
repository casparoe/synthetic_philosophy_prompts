      *   **2. & 4. The Analysis & Walkthrough (Combined logic):**
          *   Need to show the shift.
          *   *Standard Kelly:* Maximizes $E[\log(W)]$.
          *   *Constraint:* $W_T \ge \text{Debt}$.
          *   *Logic:* If $W_{current} + \text{Expected Growth}_{Kelly} < \text{Debt}$, then standard Kelly leads to ruin with $P \approx 1$.
          *   *Optimization:* To maximize $E[\log(W_T)]$ *given* that $W_T < \text{Debt}$ implies $-\infty$ (or effectively so), the agent must maximize the *probability* of crossing the threshold. This often requires over-betting Kelly.
          *   *Wait, nuance:* The prompt asks to show the agent maximizes geometric growth (log wealth) but *ends up* gambling desperately.
          *   *Correction:* If utility is strictly $\log(W)$, and $W=0$ is $-\infty$, you never bet everything. But if "Ruin" is defined as failing to meet the deadline obligation (which effectively resets wealth to 0 or negative), the utility function effectively becomes a step function near the barrier.
          *   *Better approach:* The prompt asks to show that maximizing geometric growth *endorses* desperation. This implies the "Geometric Growth" objective must be modified by the *survival constraint*. Or, more accurately, that the *effective* geometric growth rate required to survive exceeds the safe Kelly rate.
          *   *Actually, the prompt says:* "Show that an agent maximizing geometric growth... stakes close to plain Kelly... yet gambles essentially the entire surplus... when undercapitalized."
          *   *Key Insight:* This happens if the utility function is $\log(W - \text{Subsistence})$. If $W$ approaches Subsistence, risk aversion drops. Or, if the horizon is finite and the target is fixed, the "goal-reaching" problem dominates.
          *   *Let's stick to the prompt's specific request:* "Formalize ruin inside the geometric framework."
          *   *Idea:* Ruin isn't just $W=0$. Ruin is $W_T < \text{Liability}$. If the expected log-wealth at $T$ under standard Kelly is below $\log(\text{Liability})$, the agent faces certain effective ruin. To maximize expected log-wealth *conditional on survival*, or simply to maximize the probability of survival (which acts as a binary switch on the utility), they must increase variance.
          *   *Actually, the cleanest mathematical argument:* The "Kelly" fraction maximizes the *asymptotic* growth rate. In a finite horizon with a fixed liability, the objective shifts from maximizing growth *rate* to maximizing the probability of hitting a *level*. As the distance to the level increases relative to current capital, the optimal fraction to hit the target increases, converging toward the EWM's fraction.

      *   **3. Expected Wealth Maximizer (EWM):**
          *   EWM bets everything if EV > 0 (usually).
          *   Does Geometric converge to EWM? Yes, as the survival threat becomes imminent.
          *   Is this a reductio? No, it's the point. Log utility protects surplus, not survival against fixed drains.

      *   **5. Steelman the Friend (Human Capital):**
          *   Friend says: "You aren't zero at bankruptcy. You have skills."
          *   Counter: True, but business bankruptcy kills the *specific* capital (reputation, equipment, credit line) needed to execute the skill at that scale. It relocates the floor, doesn't remove it. If the floor is "personal insolvency" vs "business insolvency," the math holds for the business entity.
