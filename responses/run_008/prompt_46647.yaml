      *   **6. Friedman/Savage Thread:**
          *   Standard explanation: Convex utility for poor (risk seeking).
          *   New explanation: Concave utility (log) + Fixed Cost + Deadline = Risk Seeking.
          *   The Footnote: "Geometric growth prescriptions assume infinite horizons and no fixed consumption floors; introduce a burn rate and a deadline, and the log-utility agent becomes a risk-seeker."

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Standard Kelly never bets "all-in" because $\log(0) = -\infty$.
      *   *Fix:* I must define "Ruin" not as $W=0$ but as $W < \text{Threshold}$. If the Threshold is high, and current $W$ is low, the agent is effectively maximizing $P(\text{Survival}) \times \log(W_{survive})$. If $P(\text{Survival})$ is near zero under safe betting, increasing bet size increases $P(\text{Survival})$ faster than it risks the $-\infty$ penalty (because the penalty is already almost certain).
      *   *Wait, simpler:* The prompt asks to show the agent *maximizing geometric growth* gambles desperately. This is technically true if we view the "growth" needed as the *required* growth rate to clear the liability. If Required Rate > Kelly Rate, you must deviate from Kelly.
      *   *Better:* Let's use the concept of "shortfall risk." A log-utility investor with a minimum acceptable return (MAR) that exceeds the risk-free rate (or safe Kelly drift) will act aggressively.
      *   *Decision:* I will frame the "Geometric Agent" as maximizing $E[\log(W_T)]$ subject to the constraint that $W_T$ must cover liabilities. If the unconstrained max leads to certain failure, the constrained max pushes to the boundary (betting surplus).
      *   *Actually, the most honest mathematical answer:* A pure log-utility agent *never* bets the whole bankroll. However, a log-utility agent with a *liability floor* (utility is $-\infty$ below $L$) behaves differently. As $W \to L$, the marginal utility of avoiding $L$ outweighs the marginal utility of preserving upside. I need to be careful not to contradict the math of log utility while satisfying the user's intuition.
      *   *Resolution:* I will define the utility as $\log(W - L)$. As $W \to L$, risk aversion vanishes. This is the "subsistence level" modification. This fits the "fixed costs" reality. The friend assumes utility is $\log(W)$. The reality is $\log(W - \text{Burn})$.

  5.  **Final Polish:**
