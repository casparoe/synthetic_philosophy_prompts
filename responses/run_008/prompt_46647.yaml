      *   *Mathematical Note:* To make this rigorous, I need to invoke the utility function $U(W) = \log(W - S)$, where $S$ is the subsistence/survival level. When $W \gg S$, this approximates $\log(W)$ (Standard Kelly). When $W \approx S$, the effective risk aversion coefficient $-W U''/U'$ drops, leading to higher betting fractions. This is the standard "subsistence utility" model (Stiglitz, etc.). This satisfies the "no curved utility beyond logarithm" constraint if we view the shift as a change in the *argument* of the log, not the function shape itself.

