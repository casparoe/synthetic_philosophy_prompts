      *   **Friend's Advice:** Use Kelly Criterion/Geometric Growth (maximize expected log wealth), bet modestly, avoid ruin.
      *   **User's Hypothesis:** When facing fixed costs and a hard deadline (survival constraint), standard geometric growth logic might actually *demand* high-risk behavior (desperation gambling) to avoid the certain ruin of burning out slowly.
      *   **Task:** Construct a thought experiment demonstrating this.
