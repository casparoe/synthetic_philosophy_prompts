answer: |-
  **The Scenario**
  Elena runs a bespoke catering firm with $40,000 in liquid working capital, fixed monthly overhead of $10,000 for rent and salaries that cannot be paused, and a hard covenant deadline in four months: she must clear $50,000 in accounts payable or face involuntary bankruptcy. She has access to a repeatable, favorable arbitrage in event contracts: for every dollar she stakes on inventory and labor, she expects a 20% net return with a 60% probability of success and a 40% probability of losing the stake entirely (positive expected value of 8% per round). She can adjust her exposure monthly, but she cannot raise external equity, and if her cash hits zero before the deadline, operations cease immediately.

  **The Analysis and Verdicts**
  When Elena's capital is significantly above the survival threshold (e.g., $200,000 cash against the same $50,000 liability), the subsistence requirement is negligible relative to wealth. In this region, maximizing expected log wealth yields the standard Kelly fraction—staking roughly 40% of capital per round to optimize geometric growth while avoiding ruin. However, as her capital draws down toward the "survival line" (the sum of remaining burn plus the deadline liability), the mathematics of log-utility shift. Because utility is defined over *surplus* wealth (wealth minus the survival floor), not total wealth, the effective risk aversion coefficient drops as the floor approaches. When Elena has only $45,000 left but needs $50,000 in four months, standard Kelly betting offers a near-100% probability of failure because the drift is too slow to outpace the burn. To maximize expected log-surplus, she must maximize the probability of crossing the threshold; this forces her to stake nearly her entire surplus on each remaining round. She does not do this because she loves risk, but because the "safe" path leads to certain effective ruin ($W < \text{Liability}$), rendering the log-penalty inevitable unless variance is increased.

  The Expected Wealth Maximizer (EWM), who seeks to maximize the arithmetic mean of terminal wealth without regard for variance or ruin, would leverage up to the maximum allowable limit immediately, accepting a high probability of zero to capture the positive drift. As Elena's capital approaches the survival floor, her geometric-optimal policy converges toward the EWM's policy. This convergence is not a *reductio ad absurdum* of geometric rationality; it is the logical consequence of a finite horizon with an absorbing barrier. The geometric agent only appears "reckless" relative to the infinite-horizon Kelly benchmark; relative to the constraint of avoiding certain bankruptcy, she is being precisely disciplined. The EWM goes all-in and is ruined with probability near one because he ignores the barrier; the geometric agent goes all-in on the *surplus* because the barrier has made the preservation of capital irrelevant compared to the necessity of escape.

  **The Walkthrough**
  The verdicts rest on how ruin is formalized. In the standard Kelly framework, ruin is $W=0$, and utility is $\log(W)$. In your reality, ruin is $W_T < L$ (where $L$ is the liability/burn sum), and utility is effectively $\log(W - L)$. This single feature—the **fixed subsistence floor**—is doing all the work. When $W \gg L$, $\log(W-L) \approx \log(W)$, and myopic Kelly betting reappears; the agent can ignore the future because the probability of hitting the floor is negligible. When $W \to L$, the derivative of the utility function changes: the marginal utility of an extra dollar of survival probability outweighs the marginal disutility of losing the remaining surplus. If you remove the floor (set $L=0$) or extend the horizon to infinity (allowing the law of large numbers to smooth the burn), the desperation vanishes, and the agent returns to modest sizing. The desperation is not a psychological flaw; it is an arithmetic boundary condition.

  **The Steelman**
  Your friend will argue that you are treating liquid cash as your total wealth, ignoring human capital. He is correct that you have a trade; if the business fails, you do not starve, you become a hired chef. This relocates the floor from "business insolvency" to "personal insolvency," which is lower. However, it does not dissolve the case. Your specific human capital is leveraged by the business entity; losing the commissary, the credit line, and the brand equity reduces the present value of your future labor earnings. The floor is not zero, but it is non-absorbing only at a significantly reduced valuation. If the "business ruin" floor is high enough relative to your liquid capital, the mathematics of the survival constraint still apply. You should not behave as desperately as the scenario says *only if* your outside options are liquid and valuable enough to cover the business liability. If they are not, the floor is real, and the desperation is rational.

  **The Footnote**
  Regarding Friedman and Savage: they explained lottery buying by positing a utility function that curves from concave to convex at low wealth levels. Your construction demonstrates that you do not need a convex utility function to explain risk-seeking behavior among the undercapitalized. You need only a concave (log) utility function, a fixed cost of living, and a finite horizon. The standard lecture against lotteries, delivered in the name of geometric growth, requires a footnote: *"Geometric growth prescriptions assume an infinite horizon and no fixed consumption floors; introduce a burn rate and a deadline, and the log-utility agent becomes a risk-seeker."*
