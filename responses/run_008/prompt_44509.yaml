answer: |-
  This is a splendid dispute, and it cuts to the very heart of the experimental philosophy (x-phi) project. You are quite right that it is difficult to declare a clear victor; this specific dialectic has occupied the literature for over two decades. However, acting as referee requires me to weigh the coherence of their arguments against the current state of the evidence.

  Here is my adjudication on each of the six moves, followed by an overall verdict and the crucial element they have both overlooked.

  ### The Round-by-Round Adjudication

  **(1) Priya's Opening Move: The Normativity Claim**
  Priya argues that the Knobe effect demonstrates the ordinary concept of intentional action is inherently normative.
  *   **Verdict:** **Priya is provisionally right, but overconfident.**
      She is correct that the data poses a severe problem for purely descriptive analyses (like the Simple View or the Standard View involving belief and desire). The asymmetry is robust and replicable. However, to leap from "people's judgements vary with norms" to "the *concept itself* is normative" is an interpretative leap. She has established an anomaly for descriptivism, but not yet proven that the semantics of the word 'intentional' contain normative content. She wins the point on data, but the theoretical conclusion is premature.

  **(2) Tom's Rebuttal: The Contamination Claim**
  Tom argues that the concept is clean, but moral blame creates a performance error (noise).
  *   **Verdict:** **Tom is likely wrong on the 'noise', but right on the distinction.**
      This is the 'performance error' defence. While methodologically sound in principle, the Knobe effect has proven too robust, too cross-cultural, and too resistant to debiasing to be dismissed as mere 'noise' or confusion. If respondents were simply answering a different question due to emotional arousal, we would expect the effect to vanish under cognitive load or time pressure, but it often persists. Tom is right to demand a distinction between competence (the concept) and performance (the judgement), but calling it 'contamination' is increasingly unsupported by the evidence.

  **(3) Priya's Follow-up: The Pens Case**
  Priya cites studies where non-moral norm violations (taking office pens) trigger the same asymmetry.
  *   **Verdict:** **Priya wins this round decisively.**
      This is a strong move. It undermines Tom's specific claim that *moral blame* is the contaminant. If the effect triggers over trivial conventional norms (like pen-taking protocols), the 'moral contamination' hypothesis loses its grip. It suggests the mechanism is sensitive to *norm violation* as such, not just moral outrage. This forces Tom to broaden his defence beyond simple moral bias.

  **(4) Tom's Fallback: The Deep Self Explanation**
  Tom pivots to the 'Deep Self' concordance account (associated with Chandra Sripada and others). The harm aligns with the chairman's values; the help does not.
  *   **Verdict:** **Tom scores a significant point here.**
      This is the strongest descriptive competitor to Priya's view. It explains the asymmetry without positing a normative semantic content. It suggests people are tracking psychological facts (does this outcome express the agent's true attitudes?) rather than moral facts. If the chairman valued the environment, the harm might *not* be judged intentional. This restores a descriptive mechanism (psychological concordance) that predicts the normative output. It is a parsimonious explanation that keeps the concept of 'intentional' descriptive.

  **(5) Priya's Counter: The Normativity of the Deep Self**
  Priya argues that identifying the 'Deep Self' is itself an evaluative process.
  *   **Verdict:** **A draw, leaning towards Tom.**
      Priya is making a sophisticated philosophical move here, suggesting that we determine which attitudes are 'deep' based on whether we admire or condemn them. However, this is empirically contentious. Psychological research suggests people identify 'deep' traits based on stability and centrality to the agent's psychology, which can be measured descriptively. While there may be some evaluative bleed-over, Priya is assuming what she needs to prove: that the *criterion* for the deep self is moral. Tom's mechanism remains logically possible without this assumption.

  **(6) Tom's Last Word: The Methodological Surrender**
  Tom argues that if the concept is normative, x-phi fails because there is no independent fact to track.
  *   **Verdict:** **Tom is wrong.**
      This is a category error. If the folk concept is normative, that is a factual discovery about human psychology and language. X-phi does not require concepts to be descriptive to be studied; it merely requires that people have stable intuitions. Furthermore, many philosophers argue that 'thick concepts' (like 'cruel' or 'courageous') are both descriptive and normative. Discovering that 'intentional' is a thick concept would not invalidate the method; it would simply shift the metaphysical implications. Tom is conflating 'conceptual analysis' with 'descriptive metaphysics'.

  ### Overall Verdict

  If I must declare a winner, **Priya takes the match on points, but Tom wins on technical fouls.**

  Priya is right that the standard descriptive models of intention are insufficient to explain the data. The burden of proof has shifted to the descriptivists. The 'contamination' defence (Move 2) is largely exhausted by the 'pens' data (Move 3). However, Tom's 'Deep Self' move (Move 4) keeps the descriptive hope alive, preventing a knockout victory for Priya.

  Tom's final move (Move 6) is a strategic blunder. By suggesting that normativity invalidates the empirical project, he undermines his own position as an x-phi sceptic. Priya's core thesis—that the ordinary concept is not what traditional philosophers thought it was—stands firm.

  ### What Both Are Missing

  There is a significant element absent from this debate, which often escapes even seasoned participants in this dialectic. Both Priya and Tom are arguing over **semantics**. They are asking: *What is the meaning of the word 'intentional'?* Is it normative (Priya) or descriptive (Tom)?

  They are both missing the **pragmatic** explanation.

  A growing number of linguists and philosophers (such as Michael Thompson or those influenced by Gricean pragmatics) suggest that the *semantic content* of 'intentional' might remain stable and descriptive, but the *conversational context* shifts the standards of application. When we ask, "Did he do it intentionally?", we are often implicitly asking, "Is he an appropriate target for a reactive attitude (blame or praise)?"

  On this view, the concept of intentionality is a tool for **responsibility-tracking**. It is not that the *definition* is normative, nor that the respondents are confused. Rather, the *function* of the concept in our social language game is to allocate responsibility. In the harm case, the conversational context demands a reason to blame, so the threshold for 'intentional' lowers. In the help case, there is no demand to praise, so the threshold raises.

  By fighting over whether the *concept* is normative or descriptive, Priya and Tom are ignoring the possibility that the concept is **functional**. It is a mechanism designed to serve our normative practices of holding one another accountable. If they adopted this view, they would see that the dichotomy between 'normative concept' and 'descriptive concept' is a false one. The concept is descriptive in its machinery but normative in its teleology (its purpose).

  **Referee's Recommendation:**
  Tell Priya she has the better of the argument regarding the failure of traditional descriptivism. Tell Tom he is right to seek psychological mechanisms (like the Deep Self) but wrong to dismiss the normativity as mere noise. Then, suggest they both read up on **conversational pragmatics** and **functionalist accounts of responsibility**. That is where the next hour of their argument ought to go.
