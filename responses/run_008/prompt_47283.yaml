      POLICY MANUAL SECTION 4.1: PROCEDURAL RATIONALITY AND SEARCH CONSTRAINTS

      1.0 **Search Termination Protocol.** All employees are mandated to employ satisficing procedures rather than maximizing strategies. Search for alternatives must terminate immediately upon the identification of the first option meeting or exceeding the employee's current Aspiration Level (AL). Continued search after satisficing is achieved constitutes a violation of Resource Conservation Statute 12-B. Employees are reminded that the marginal cost of additional search invariably exceeds the marginal utility of potential improvement once the AL is cleared.

