      (b) Under verified deadline pressure (defined as >80% of allocated time elapsed), the employee must lower their AL incrementally to ensure decision completion.
      (c) Failure to adjust AL in response to performance feedback will be treated as procedural non-compliance.

      3.0 **Prohibition of Substantive Rationality Requests.** Requests for the "best available option," "optimal solution," or "global maximum" are strictly prohibited. Such requests presuppose access to complete information sets and unlimited computational capacity, neither of which exist within this jurisdiction. Employees submitting such requests will be automatically routed to the Omniscience Desk (Room 000, Basement Level). Note: The Omniscience Desk has no recorded staffing history and has never once responded to an inquiry. Persistence in contacting the Omniscience Desk may result in mandatory retraining on cognitive limits.

