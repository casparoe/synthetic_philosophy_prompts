  The question, restated

  You are seeking a criterion for mechanism identity across temporal or distributional shifts in neural networks. Currently, your team oscillates between parameter identity (too strict), behavioral equivalence (too coarse), and vague notions of internal route or stable relations. You need a conceptual framework that distinguishes genuine mechanism preservation from mere behavioral stability or trivial parameter overlap. Specifically, you want to know if existing literature on functionalism, causal mechanisms, or representational similarity offers a precise middle ground. If not, you require a coined term with a rigorous definition and boundary cases that resolve disagreements about whether internal rewiring constitutes a mechanism change despite stable outputs.

  Nearest existing concepts

  Computational Functionalism: From philosophy of mind, this defines states solely by causal role. In ML, this maps to your "input–output profile." If the function maps inputs to outputs identically, the mechanism is identical, regardless of substrate. It ignores internal structure entirely, treating the network as a black box. Identity is purely behavioral. This view claims internal wiring is irrelevant implementation detail. Consequently, any internal rewiring that preserves the function counts as the same mechanism, collapsing your cases 1 and 2 into one verdict.

  Representational Similarity Analysis (RSA): From neuroscience/ML, this compares geometry of activation spaces. This targets your "internal route." It asks if the similarity structure of intermediate representations is isomorphic, even if individual neuron indices differ via permutation. It cares about representational structure, not specific weight values. Identity is structural isomorphism. This view claims the geometry of computation matters more than specific neurons. Consequently, it distinguishes between models that behave alike but represent features differently, splitting cases 1 and 2 into distinct categories.

  Interventionist Causality: From philosophy of science, this defines mechanisms by invariant relations under intervention. A mechanism exists if manipulating variable X changes Y consistently across contexts. This aligns with your "stable relations under shift." It requires counterfactual stability, not just actual output match, demanding robustness to perturbations. Identity is invariance. This view claims mechanisms are defined by what would happen under change, not just what does happen. Consequently, it demands stability beyond the observed distribution, aligning with your case 4 but leaving the relevant variables unspecified.

  Loss Landscape Connectivity: From deep learning, this suggests solutions are "the same" if connected by a low-loss path in weight space. This relaxes "same parameters" to "same basin," allowing weight changes without mechanism change. It implies continuity in optimization space defines identity, suggesting distinct weights can implement the same solution if smoothly reachable. Identity is topological connectivity. This view claims continuous deformability preserves mechanism identity. Consequently, it allows parameter drift without mechanism change, provided the path remains low-loss, refining your case 3 but ignoring logical discontinuities.

  Together, these span behavior to parameters, yet none isolate the algorithmic logic you seek.

  Why each falls short

  Functionalism is too coarse. It collapses your disagreement by fiat: if outputs match, mechanisms match. This invalidates the colleague worried about internal cue shifts, ignoring that spurious correlations may break later. It fails to monitor *why* the model works, which is your core safety concern, declaring preservation despite cue shifts.

  RSA is too fine-grained on geometry. Representations can rotate or scale without changing the underlying heuristic. It might flag a mechanism change when only the basis changed, failing to capture functional equivalence that matters for deployment. It confuses representational format with computational logic, potentially crying wolf on stable cues.

  Interventionism captures the spirit of stability but lacks granularity. It tells you to check invariance, but not which variables constitute the mechanism. It doesn't distinguish between a core mechanism and peripheral buffering. You need to know *which* relations matter, not just that some exist. It requires you to pre-specify the features, which is exactly what you are trying to monitor.

  Connectivity is too tied to parameter space. Distinct basins might implement the same logical rule, while a single basin might contain distinct heuristics. It mistakes optimization continuity for mechanistic identity. A model could slide down a loss landscape while switching from shape-based to texture-based classification. It cannot detect logical switches within a connected region.

  None successfully isolate the *algorithmic heuristic* from both the specific weights and the mere input-output map. They either ignore internals or fetishize specific activation patterns rather than causal dependencies. Ultimately, you need a definition that tracks the *logic* of computation, not just its substrate or its shadow.

  A working definition

  I propose **Causal Heuristic Invariance**. A mechanism is preserved if the causal mapping from *learned latent features* to *output* remains invariant under interventions on those features, even if the mapping from *raw input* to *latent features* changes. This separates feature extraction (permissible drift) from decision logic (must remain stable).

  Boundary Case 1: Fine-tuning adjusts early layers to handle new lighting, but the final decision boundary over semantic features remains fixed. **Verdict:** Same Mechanism. The core heuristic is stable; only the perceptual front-end adapted.

  Boundary Case 2: The model switches from relying on "object shape" to "background texture" to classify animals, but current test images correlate both. **Verdict:** Different Mechanism. Despite identical outputs, the causal dependency shifted. The latent feature driving the output changed.

  Boundary Case 3: Weights perturb slightly, but no intervention on latent features changes the output differently than before. **Verdict:** Same Mechanism. Parameter drift without causal shift is noise.

  This resolves your disagreement by prioritizing causal dependencies over both raw weights and surface behavior. It allows monitoring for "silent" mechanism shifts where behavior holds only due to contingent environmental correlations, addressing your safety concern directly.
