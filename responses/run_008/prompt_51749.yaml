answer: |-
  Here is a reconstruction and analysis of the passage, addressing your three questions in order.

  ### 1. Plain-Language Reconstruction

  Aquinas is distinguishing between the internal reality of the New Law (grace and charity) and its external expression (actions). He argues that the New Law does not micromanage external behavior in the way the Old Law did. To explain this, he draws a twofold connection between external acts and the internal state of "faith working through love" (charity).

  **The Twofold Connection:**
  1.  **Necessary Connection:** Some actions are intrinsically linked to charity. You cannot have love for God and neighbor while performing them (or omitting them).
      *   *Example:* Confessing the faith is a necessary outward sign of inward belief; denying the faith is a necessary contradiction of it.
      *   *Status:* These are **prescribed or forbidden**. They are mandatory because they are the unavoidable fruit of the internal state.
  2.  **Contingent (Non-Necessary) Connection:** Some actions do not inherently prove or disprove the presence of charity. You can love God fully while doing Action A or Action B, provided neither is sinful.
      *   *Example:* Specific dietary choices, specific modes of dress, or specific schedules of prayer (outside the essentials).
      *   *Status:* These are **left to discretion**. The New Law does not codify them because they do not determine salvation.

  **Why Discretion and Superiors?**
  Aquinas argues that because these acts are not necessary for salvation, Christ (the Divine Lawgiver) intentionally did not command them. This preserves human freedom. However, human communities still need order. Therefore, while the *divine* law leaves these open, *human* superiors (church leaders or civil rulers) may regulate them for the sake of common order, decency, or specific communal goals. But these regulations are changeable human laws, not immutable divine commands.

  **The "Law of Liberty":**
  Aquinas summarizes this freedom in two ways:
  1.  **Juridical Liberty:** The list of "thou shalts" and "thou shalt nots" is small. It covers only what is strictly necessary for salvation. Everything else is a "free zone."
  2.  **Psychological Liberty:** Even regarding the necessary precepts, Christians obey not out of servile fear (as slaves) but through the "promptings of grace" (as sons). The internal grace makes the external compliance free and willing.

  ### 2. Supererogation vs. Permissible Variation

  Your intuition here is sharp and textually grounded. There is a genuine tension in how this passage is read regarding supererogation.

  **The Standard Reading (Supererogation):**
  Traditionally, scholars link this "Law of Liberty" to the distinction between **Precepts** (obligatory for all) and **Counsels** (voluntary, e.g., poverty, chastity, obedience). On this reading, the "discretionary zone" is the space where one *can* choose a higher path. If I choose poverty, I am performing a supererogatory act: it is better, but I am not blamed for omitting it.

  **Your Reading (Permissible Variation):**
  You note that Aquinas describes these acts as "not necessarily in keeping with... faith." This phrasing suggests *adiaphora* (morally indifferent matters) rather than *heroic* matters. If an act is "not necessarily in keeping with love," it sounds like it is neutral, not "better." If I choose to wear a blue tunic instead of a red one, that is permissible variation. It is not morally superior.

  **Which Reading Does the Text Support?**
  Textually, **your reading is more faithful to this specific article.**
  In *Prima Secundae*, q. 108, a. 1, Aquinas is defining the *scope* of the New Law, not detailing the hierarchy of merit. He is establishing the **juridical boundary** between sin and non-sin. The "discretionary zone" he describes here is primarily the realm of *adiaphora*—things that do not affect salvation.

  However, this does not mean Aquinas rejects supererogation. Rather, this passage provides the **necessary precondition** for it.
  *   **The Container:** This article establishes that there is a large category of acts God does not command.
  *   **The Content:** Elsewhere (specifically in *Secunda Secundae*, q. 184, on the state of perfection), Aquinas fills this container with the "Counsels." He argues that while wealth and marriage are not *necessarily opposed* to charity (they fit the description in q. 108), renouncing them removes *obstacles* to charity.

  **Why the Difference Matters:**
  If the passage supports only **Permissible Variation**, then supererogation is not a distinct moral category here; it is merely a description of non-moral choices (like choosing a vocation). There is no "moral betterness," only "preference."
  If the passage supports **Supererogation**, it affirms that there are acts that are *morally better* than the baseline but not *obligatory*.

  **Judgment:** The text supports the **structural possibility** of supererogation, but not the **moral valuation** of it on its own. It creates the "Law of Liberty" (the free space), but you need the doctrine of the Counsels to argue that some acts within that space are *better* than others.
  This matters for the concept of supererogation because it suggests that supererogation is not inherent to the acts themselves (as if "giving to the poor" is intrinsically supererogatory), but is relative to the **Legislator's decision** about what to command. Supererogation exists only because God *chose* to limit the scope of obligation. Without a Legislator who sets a minimum threshold (salvation) and intentionally leaves room above it, the distinction between "obligatory" and "supererogatory" collapses.

  ### 3. The Stability Objection and Secular Analogues

  The stability objection argues: *If Act A is morally better than Act B, rational agents ought to do A. If they aren't obliged to do A, then A isn't really better.*

  **Does Aquinas Escape the Dilemma?**
  Yes, but only by relying on the two specific grounds mentioned in the text, which secular theories struggle to replicate.

  1.  **The Teleological Threshold (Salvation):**
      Aquinas escapes the dilemma by defining obligation relative to a specific *end* (salvation/union with God). Precepts are the *minimum necessary* to reach the end. Counsels (supererogatory acts) are the *expedients* to reach the end *more readily* or *perfectly*.
      *   *Resolution:* Omitting a supererogatory act is not blameworthy because you still reach the destination. It is like walking to a city versus running. Running is "better" (faster), but walking is not "wrong" (you still arrive). The criticism of "you should have run" is pragmatic, not moral.
      *   *Secular Analogue:* A secular virtue ethicist might try this (minimum decency vs. flourishing). But without a clear "destination" guaranteed by a Legislator, the line between "decency" and "flourishing" becomes arbitrary. Why isn't flourishing obligatory?

  2.  **The Legislative Decision (Voluntarism):**
      Aquinas explicitly states these acts are left to discretion "by virtue of its primitive institution" by the Lawgiver. Obligation is not just a function of rational goodness; it is a function of **command**.
      *   *Resolution:* An act is obligatory *because God commanded it*, not merely because it is good. God commands the necessary; He withholds command from the rest to preserve liberty. Thus, the "better" act is not obligatory because the Authority *chose* not to bind us to it.
      *   *Secular Analogue:* This is very difficult to secularize. Secular moral rationalism (e.g., Kantianism) tends to hold that if reason identifies the best course, it is binding. If you remove the Divine Legislator who has the authority to *limit* obligations for the sake of liberty, the "supererogatory" category becomes unstable. A secular theory must explain why reason would identify a "best" action but not "command" it. Usually, secular theories either collapse into maximalism (do the best possible) or reduce supererogation to mere preference (permissible variation).

  **Conclusion on Stability:**
  Aquinas's framework escapes the dilemma because it separates **moral goodness** from **legal obligation**. An act can be good (even heroic) without being obligatory, because obligation is imposed by a Will (God's) for a specific purpose (salvation), not by the intrinsic weight of the good itself.

  **Secular Viability:**
  A secular analogue is possible only if one adopts a **threshold deontology** or a **satisficing consequentialism**. One must argue that morality has a "good enough" baseline (satisficing), and anything above that is optional. However, without Aquinas's theological justification (that God *wills* our liberty more than He wills the extra good), the secular argument feels unstable. It struggles to explain why a rational agent, seeing a "better" moral option, is permitted to choose the "good enough" one without some residue of criticism. Aquinas solves this by making the "permission" a gift of the Lawgiver; secular theories lack the Giver, leaving the permission ungrounded.
