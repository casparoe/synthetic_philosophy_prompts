  9.  **Final Polish:** Ensure tone is professional, empathetic, and operationally focused. (Avoid academic jargon like "constitutive" in the actual checklist, keep it in the commentary).

  *(Self-Correction on the Bias Constraint)*: The user said: "I want the QC pass automated and I want the juniors protected — if the procedure can't deliver both, say so rather than fudging."
