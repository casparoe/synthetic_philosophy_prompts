answer: |-
  Here is a decision procedure designed for your constraints (10 minutes per task, non-philosopher committee), followed by the application to your three cases and the honesty check you requested.

  ### The Protocol: Human-Capital Impact Gate (HCIG)

  **Timebox:** 10 Minutes per task.
  **Voting:** Ops Managers + HR. Consensus required on "Red" flags.
  **Goal:** Filter out automations that save money but burn capability.

  **Step 1: The Safety & Compliance Gate (Fact Check)**
  *   **Question:** Does this task involve legal sign-off, physical safety, or ethical liability where a hallucination or error causes irreversible damage?
  *   **Yes:** **STOP.** Do not automate fully. (AI can assist, human must sign).
  *   **No:** Proceed to Step 2.

  **Step 2: The "Pure Friction" Test (The Timesheet Filter)**
  *   **Question:** Is this task purely administrative with zero contribution to technical skill, project understanding, or client value?
  *   **Yes:** **GREEN LIGHT.** Automate immediately. (This captures the "burdensome work as burden" exception—if the burden has no upside, remove it).
  *   **No:** Proceed to Step 3.

  **Step 3: The Apprenticeship Vector (The Junior Filter)**
  *   **Question:** Is this task a primary mechanism by which juniors learn the core logic of the business (e.g., drafting reports teaches engineering logic, not just typing)?
  *   **Yes:** **RED FLAG.** Do not automate fully. You may automate the *formatting* or *data gathering*, but the synthesis must remain human.
  *   **No:** Proceed to Step 4.

  **Step 4: The Craft & Pride Index (The Senior Filter)**
  *   **Question:** Do senior staff identify this specific task as a source of professional pride or their "signature" contribution, distinct from their pay grade?
  *   **Yes:** **YELLOW FLAG.** Proceed with caution. Requires a "Residual Value Plan" (see Step 5).
  *   **No:** **GREEN LIGHT.** Automate.

  **Step 5: The Residual Value Plan (For Yellow Flags only)**
  *   **Question:** If we automate this, does the time saved allow the employee to move to *more* complex work (upskilling), or does it leave them with *less* complex work (hollowing)?
  *   **More Complex:** **GREEN LIGHT.** (Justifies the "Product Value" camp).
  *   **Less Complex/Same:** **STOP.** (Validates the "Process is Constitutive" camp).
  *   **Unknown:** **DEFER.** (Requires pilot data).

  ***

  ### Running the Protocol on Your Live Items

  #### Item 1: Auto-generating first drafts of Site Reports (Juniors)
  *   **Step 1 (Safety):** Low risk (drafts are reviewed). **Pass.**
  *   **Step 2 (Pure Friction):** No. It involves synthesizing site data into engineering language. **Pass.**
  *   **Step 3 (Apprenticeship):** **YES.** You noted juniors say "this is how they learn the job."
  *   **Decision:** **RED FLAG. DO NOT AUTOMATE FULLY.**
  *   **Operational Compromise:** Automate the data ingestion and formatting (the "typing"), but require the junior to write the "Analysis/Conclusion" section from scratch. This reduces the drudgery without removing the cognitive load required for learning.

  #### Item 2: Final Visual QC Pass (Seniors)
  *   **Step 1 (Safety):** Medium risk (errors catchable later?). Let's assume **Pass** for this exercise.
  *   **Step 2 (Pure Friction):** No. It requires expert eye. **Pass.**
  *   **Step 3 (Apprenticeship):** No. These are seniors. **Pass.**
  *   **Step 4 (Craft & Pride):** **YES.** You noted they take "real pride" in this.
  *   **Decision:** **YELLOW FLAG.** Move to Step 5.
  *   **Step 5 (Residual Value):** If you automate the QC pass, what do they do instead?
      *   *Scenario A:* They do more high-level design strategy. (Upskill -> **Green Light**).
      *   *Scenario B:* They manage more projects/admin. (Same/Less Complex -> **Stop**).
  *   **Decision:** **DEFER.** You cannot approve this automation until you have defined the *new* high-value task that replaces the QC pride. If you just take the QC away, you violate the "Constitutive Process" principle.

  #### Item 3: Timesheet & Compliance Paperwork
  *   **Step 1 (Safety):** Low risk. **Pass.**
  *   **Step 2 (Pure Friction):** **YES.** "Literally nobody will defend."
  *   **Decision:** **GREEN LIGHT. AUTOMATE.**
  *   **Caveat (The Trap):** See the "Blind Spot" section below regarding ambient awareness.

  ***

  ### The Integrity Check: Bias & Misfires

  You asked for two specific upfront truths. Here they are.

  #### 1. The Bias Conflict (QC vs. Juniors)
  You stated: *"I want the QC pass automated and I want the juniors protected."*

  **The Procedure's Verdict:** The protocol protects the Juniors (Item 1) but **blocks** your desire to automate the Senior QC (Item 2) *under current conditions*.

  **Why:** You cannot consistently hold that "process is constitutive" for juniors (learning requires doing the hard thing) and "product is all that matters" for seniors (output matters, pride doesn't). If the difficulty of the QC pass is what gives the seniors their self-respect (Rawls's Aristotelian Principle), removing it without a clear replacement of *equal complexity* will cause the retention collapse you fear.

  **How to get to "Yes" on QC:**
  You must redesign the Senior role *before* the automation. If you can promise them that the 10 hours saved on QC will be spent on "Technical Mentorship" or "Complex Problem Solving" (tasks with higher constitutive value), the procedure clears it. If the time saved just goes to billable volume on easier tasks, the procedure correctly flags this as a retention risk. **Do not fudge Step 5.**

  #### 2. The Misfire: Adaptive Preferences
  You asked: *"How do I tell whether someone reporting that their work is meaningful is reporting a fact about the work, or a fact about how they've made peace with work they'd dump tomorrow if they could?"*

  **The Problem:** This is the "Happy Slave" objection in philosophy. People adapt to meaningless work and call it "craft" to survive cognitively. The HCIG relies on self-reporting (Step 4), which is vulnerable to this.

  **Where the Procedure Misfires:**
  It misfires on **Item 3 (Timesheets)** regarding the "Ambient Awareness" trap.
  *   **The Trap:** Nobody *likes* filling out timesheets. But reading them might be the only way a Project Manager knows that "Sarah is spending 10 hours a week fixing John's code."
  *   **The Risk:** If you automate the *entry* (good), but also automate the *visibility* (bad), you lose the friction that forces managers to look at the data. You lose the "ambient picture of what colleagues actually do."
  *   **The Fix:** Add a sub-clause to Step 2: *"Does the friction of this task provide necessary visibility into workflow bottlenecks?"* If yes, automate the entry, but keep the reporting dashboard human-readable and mandatory to review.

  **How to Validate "Real" Pride (Triangulation):**
  Don't trust the meeting room. Trust the data. To verify if Senior QC pride is real or adaptive:
  1.  **Voluntary Overtime:** Do they stay late to finish QC when not asked? (Indicates intrinsic value).
  2.  **Defect Attribution:** When a QC error happens, do they take it personally? (Indicates identity connection).
  3.  **Exit Interviews:** When people leave, do they say "I felt like a robot" or "I felt challenged"?

  If the pride is adaptive (coping), they will happily drop the task if you offer them something that looks like status. If the pride is constitutive (real craft), they will resist the automation even if the new task pays the same. **Test this with a pilot group before rolling out the QC automation.**

  ### Summary Recommendation
  1.  **Adopt the HCIG.** It forces the "Residual Value" conversation that the CFO ignores.
  2.  **Approve Item 1 (Juniors) only as "Augmentation."** Keep the synthesis human.
  3.  **Defer Item 2 (Seniors).** Do not automate until you have written the new Job Description that utilizes the freed-up capacity for *higher* complexity work.
  4.  **Approve Item 3 (Timesheets)** but mandate a "Workflow Visibility" audit 3 months post-launch to ensure you haven't blinded management to resource friction.
