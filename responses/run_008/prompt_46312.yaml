prompt: |-
  hey, so i'm in a civics/econ elective and we just finished a unit on labor. we watched a bunch of coverage of the 2023 UAW strike against the Big Three (Ford, GM, Stellantis) and my teacher kept describing it as a "war of attrition" — both sides just burning money, and whoever can stand the pain longer wins. he also gave us the standard line that in a normal all-out strike the workers usually run out of money before the company does, since everyone walking out loses a paycheck while the company can still hurt less than the workers do, at least for a while.

  but what actually happened was this "stand-up strike" thing shawn fain ran, where instead of everyone walking out at once, they struck like one or two plants at a time and kept adding more each week depending on which company was moving in negotiations. and the way he explained it, the economics flipped: the union could keep that going way longer than the companies could, because a couple of struck plants shut down whole supply chains so the company bled money every day while only a fraction of workers were going without pay.

  so heres what i want from you. walk me through the attrition model properly: who the players are, what each side's "burn rate" is, what counts as winning, and what the payoff structure looks like in a textbook strike where everybody walks out at once. then show me exactly how the stand-up tactic changes those payoffs — who is burning money faster now, and whether you'd say the union basically re-engineered the game so that the side which normally loses attrition contests became the one that could wait longer. then be honest about where the model breaks: did the companies actually settle because of the math, or were there other things going on (public support, the fact that a big strike had just happened a few years earlier, whatever) that a pure cost-burning model just doesn't capture? my teacher also mumbled something about how strikes work by changing what people think is possible, not just by who can endure more, but i didnt really follow it — so if theres a version of the model where that fits, explain it, and if not, just say the model is silent there and dont force it.

  last thing: dont just give me the generic textbook stuff about collective bargaining power, i can get that anywhere. i want the actual mapping, and i want you to tell me straight if any part of the stand-up story i gave you is wrong or exaggerated.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Civics/Econ elective, finished a unit on labor, watched coverage of the 2023 UAW strike.
      *   **Teacher's View:** Strikes are "wars of attrition." Companies usually win because workers run out of money faster than companies do (standard all-out strike).
      *   **User's Observation:** The 2023 "Stand-Up Strike" (Shawn Fain) flipped the economics. Small number of plants struck $\rightarrow$ supply chain disruption $\rightarrow$ companies bleed money faster while only a fraction of workers lose pay.
      *   **Tasks:**
          1.  Walk through the standard attrition model (players, burn rates, winning conditions, payoff structure).
          2.  Explain how the "Stand-Up" tactic changes the payoffs/burn rates (did it re-engineer the game?).
          3.  Critique the model: Where does it break? Did math drive the settlement or other factors (public support, history, etc.)?
          4.  Address the teacher's comment about strikes changing "what people think is possible" (does the model capture this?).
          5.  **Constraint:** Don't give generic textbook stuff. Provide actual mapping. Be honest about exaggerations/errors in the user's story.

  2.  **Deconstruct the Standard Attrition Model (War of Attrition):**
      *   *Players:* Union (U) vs. Management (M).
      *   *Strategy:* How long to hold out ($t$).
      *   *Costs:*
          *   Union: Lost wages ($W \times t$), strike fund depletion, risk of replacement/scabbing.
          *   Management: Lost production/profit ($P \times t$), reputational damage, stock price hit.
      *   *Winning:* The side with the lower cost per unit of time ($C_U$ vs. $C_M$) can outlast the other.
      *   *Payoff:* $(Value of Contract - Cost of Strike)$ vs. $(Profit Post-Contract - Cost of Strike)$.
      *   *Standard Assumption:* $C_U > C_M$ usually, because workers live paycheck to paycheck, while corporations have cash reserves. Hence, teacher's point.

  3.  **Analyze the "Stand-Up Strike" Tactic:**
      *   *Mechanism:* Targeted strikes at key plants (assembly + parts) rather than all-out.
      *   *Effect on Union Costs:* Only striking workers lose full pay (strike pay is less than wages). Non-striking workers keep earning. Total $C_U$ drops significantly.
      *   *Effect on Management Costs:* Auto manufacturing is Just-In-Time (JIT). Stopping a key parts plant halts assembly plants downstream. A small disruption creates a massive ripple effect. Total $C_M$ remains high (or increases relative to Union costs).
      *   *Result:* The ratio $C_U / C_M$ flips. The Union can sustain the strike longer *financially* than in an all-out scenario, while the Company feels immediate pain.
      *   *Verification:* Is the user's story exaggerated?
          *   *True:* JIT makes supply chains vulnerable. Targeted strikes reduce union costs.
          *   *Nuance:* It's not just about money. It's about *leverage per dollar spent*. The union didn't necessarily have *more* money than GM, but they inflicted more damage *per unit of their own cost*.
          *   *Exaggeration:* "Union could keep that going way longer than the companies could." Companies have deep pockets. The union still had a finite fund. It's more that the *rate* of pain infliction became asymmetric in the Union's favor.

  4.  **Critique the Model (Where it Breaks):**
      *   *Pure Math vs. Reality:* Companies don't just settle when $Cost_{Strike} > Cost_{Contract}$. They settle based on stock price, investor pressure, product launch cycles (e.g., new EV models), and political pressure.
      *   *Other Factors:*
          *   **Public Support:** UAW had high approval. Politicians (Biden) visited the picket line. This raises the reputational cost for companies.
          *   **Timing:** End of year is critical for automakers (closing books, launching new models).
          *   **Previous Context:** 2019 GM strike (long, painful) made both sides wary of a long war.
          *   **Profitability:** The "Big Three" were making record profits. This weakened their argument of "poverty" and strengthened the Union's moral claim.
      *   *Teacher's "What's Possible" Comment:* This refers to the **Schelling Point** or **Focal Point** in bargaining. A strike isn't just burning cash; it's a signal of resolve. It shifts the "Zone of Possible Agreement" (ZOPA). If the union shows they are willing to burn cash, management updates their belief about the union's reservation price.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sophistication of the question. Validate the teacher's baseline but confirm the user's insight about the 2023 tactic.
      *   *Section 1: The Standard Attrition Model.* Define $C_U$ (Union Cost) and $C_M$ (Management Cost). Explain the "Deep Pockets" advantage. Define the "Break Point."
      *   *Section 2: The Stand-Up Modification.* Explain the JIT leverage. Show how $C_U$ goes down (fewer strikers) while $C_M$ stays high (supply chain choke). Use the term "Asymmetric Leverage."
      *   *Section 3: Fact-Checking the User's Story.*
          *   *Correct:* JIT vulnerability, reduced union burn rate.
          *   *Correction:* It's not that the Union had *more* money than Ford/GM. It's that the *efficiency* of the strike improved. The companies still had more cash, but the pain was more acute relative to their quarterly goals.
      *   *Section 4: Where the Model Breaks (Non-Math Factors).* Record profits, political pressure, product cycles (EV transition), the shadow of 2019.
      *   *Section 5: The "What's Possible" Comment.* Connect this to Game Theory (Signaling/Commitment). The strike changes the *beliefs* about the other side's resolve, not just the bank accounts.
      *   *Conclusion:* Summarize. The user's intuition is strong, but the "who has more money" part is nuanced.

  6.  **Refining the Tone:**
