  7.  **Self-Correction/Edge Case Check:**
      *   *Did the union actually run out of money?* No, but their fund is finite ($800M+).
      *   *Did the companies settle purely on math?* No, stock prices were dipping, but not crashing. It was more about uncertainty.
      *   *Teacher's point:* Is "war of attrition" the right model? Yes, but it's a *signaling* war of attrition, not just a bankroll war.
      *   *Make sure to mention Shawn Fain's specific strategy:* Escalation. The *threat* of more strikes was as powerful as the strikes themselves.

  8.  **Final Polish:** Check against constraints. (No generic collective bargaining power talk. Map the variables. Address the "what's possible" comment.)

  *(Self-Correction during drafting)*: I need to make sure I don't validate the idea that the Union had *more* money than GM. That's factually wrong. GM has billions in cash. UAW has hundreds of millions. The shift is in the *ratio of damage inflicted to cost incurred*. I need to be precise there.

  9.  **Final Output Structure:**
      1.  The Baseline Attrition Model (The Teacher's View).
      2.  The Stand-Up Modification (The Fain Strategy).
