answer: |-
  Here is a plan for your ninety-minute seminar, tailored to your students' background in symbolic AI and propositional logic, while steering clear of the pitfalls you have identified.

  ### 1. The Order of Ideas: Narrow First, but Infected Immediately

  You asked whether the narrow version (representing change/non-change) must precede the broad version (relevance/ignorance), or vice versa.

  **Recommendation:** Teach the **Narrow** version first, but do not allow it to settle as a merely technical issue.

  **Why:**
  For third-year students with a term of logic and symbolic AI under their belts, starting with the Broad problem (relevance) risks reducing the Frame Problem to a platitude: 'Context matters.' They have likely encountered holism in other modules; without the technical teeth of the Narrow problem, the philosophical stakes feel unearned. The Narrow problem provides the *proof* that the Broad problem is non-trivial. It demonstrates that relevance is not just a vague difficulty but a combinatorial explosion inherent to explicit representation.

  **The Pedagogical Pivot:**
  The danger, as you noted, is that the Broad problem feels like an afterthought. To avoid this, you must not treat them as two separate problems. Instead, present the Narrow problem as the *symptom* and the Broad problem as the *diagnosis*.
  *   **Minutes 0–40:** Establish the Narrow problem using logic they understand (state descriptions and action operators). Show exactly where the system breaks (the need for infinite frame axioms).
  *   **Minutes 40–90:** Use that breakdown to launch into the Broad problem. Do not say, 'Now for the philosophical version.' Say, 'Why does this logical requirement reveal something fatal about how we model mind?'

  ### 2. The Core Example: The 'Coffee Cup' Scenario

  You are right to be wary of the robot-and-wagon stories (McCarthy/Hayes or Dennett's variations). They tend to date the material and focus on physical side-effects (bomb explosions) which distract from the epistemic issue.

  **The Example:** **Moving a Coffee Cup on a Cluttered Desk.**

  **The Setup:**
  Imagine a symbolic agent tasked with moving a coffee cup from position $A$ to position $B$ on a desk.
  *   **State:** Defined by predicates like $On(Cup, A)$, $Red(Cup)$, $Full(Cup)$, $On(Pen, C)$, $Under(Paper, Pen)$, etc.
  *   **Action:** $Move(Cup, A, B)$.

  **What it must have:**
  1.  **Simplicity:** It must be mappable to the propositional/predicate logic they know.
  2.  **Implicit Richness:** The desk must be 'cluttered' conceptually, even if simple logically. There are objects, but also properties (temperature, fragility, ownership).
  3.  **Causal Opacity:** Moving the cup might knock a pen, but it shouldn't change the colour of the cup, the date, or the fact that the coffee is hot.

  **What it must lack:**
  1.  **Dramatic Stakes:** No bombs. If there is a bomb, the students focus on the danger, not the logic.
  2.  **Physical Complexity:** No friction or physics engines. Keep it symbolic.

  **Why this works:**
  It allows you to demonstrate the Narrow problem (you need an axiom to say $Red(Cup)$ remains true after $Move$) without the baggage of the 'robot'. Crucially, it transitions seamlessly to the Broad problem: To know which axioms to write, the system must know which facts are *relevant* to the move. Is the cup's temperature relevant? Only if it's boiling. Is the owner's mood relevant? Only if they are watching. The 'cluttered desk' becomes the 'cluttered mind'.

  ### 3. Anticipated Misconceptions and When to Head Them Off

  **A. 'It's just film frames' (The Etymological Error)**
  *   **When:** Minute 1.
  *   **Strategy:** Address this immediately in your introduction. Acknowledge the linguistic coincidence but draw a sharp line. The 'frame' here is a logical boundary of relevance, not a visual cell. Do not let this linger.

  **B. 'Computers just can't judge relevance' (The Truism Trap)**
  *   **When:** During the Narrow section (approx. Minute 25).
  *   **Strategy:** Students will suggest, 'Just tell the computer to ignore irrelevant things.' You must show them that in GOFAI, 'ignoring' requires *explicit representation* of what is being ignored. The problem is not that the computer is stupid; it is that in a monotonic logic system, truth is persistent unless cancelled. To assume persistence is to add an axiom. To add an axiom for every non-changing fact is impossible. Make them feel the weight of the axioms, not the lack of 'judgement'.

  **C. 'Machine Learning dissolved this' (The Modern Dissolution)**
  *   **When:** The final ten minutes.
  *   **Strategy:** This is the most dangerous misconception. Students will argue that neural networks don't use frame axioms, so the problem is gone.
  *   **Counter:** Explain that ML *bypasses* the problem via statistical correlation, it does not *solve* the logical problem of how knowledge is structured. A neural net might predict the cup moves without knocking the pen, but it cannot explain *why* or handle novel counterfactuals with the same systematicity. The Frame Problem remains a challenge for *explainable* cognition and semantic understanding, even if it is sidestepped by pattern matching.

  ### 4. What to Openly Decline to Cover

  In the interest of time and level, you should explicitly state what is out of bounds. This manages expectations and prevents students from feeling they are missing the 'solution'.

  1.  **Nonmonotonic Logic Formalisms:** State clearly: 'We will not look at Default Logic, Circumscription, or Situation Calculus solutions. These are the technical attempts to fix the Narrow problem, but they require logic beyond this module's scope.'
  2.  **The 'Sleeping Dog' Strategy:** Mention it by name only as a heuristic, but decline to analyse the mechanism.
  3.  **The Full Fodor/Dennett Debate:** Do not attempt to summarise the entire history of the philosophical response. Focus on the implication for cognitive architecture, not the historiography.

  ### 5. The Final Assessment Question

  In the last five minutes, pose this question. It requires them to distinguish between the technical fix ( Narrow) and the epistemological crisis (Broad).

  **The Question:**
  > 'If we successfully programme a system to update its database without checking every irrelevant fact, have we solved the Frame Problem, or have we merely hidden it?'

  **What to look for in their answers:**
  *   **Grasped the distinction:** They will argue that a technical workaround (like a heuristic) solves the *computational* issue but leaves the *philosophical* issue (how the system knows what is relevant in the first place) untouched.
  *   **Missed the distinction:** They will treat the Frame Problem as merely a bug in older AI that modern processing power or ML has fixed.

  ### Seminar Structure (90 Minutes)

  *   **00–05:** **Introduction.** Disambiguate 'Frame' (logic vs film). State the aim: to move from a bug in code to a bug in theory of mind.
  *   **05–25:** **The Narrow Problem.** Use the Coffee Cup. Walk through the logic. Show the need for frame axioms. Show the combinatorial explosion.
  *   **25–45:** **The Transition.** Ask: 'How does the system know which axioms to write?' Introduce Relevance. Show that relevance cannot be defined without context, and context is potentially infinite.
  *   **45–70:** **The Broad Problem.** Discuss the implications for Cognitive Science. If humans solve this effortlessly, and symbolic systems cannot, is the mind a symbolic system? (Touch on Fodor's isotropy/quirkiness).
  *   **70–80:** **Misconceptions.** Address the ML argument and the 'Truism' argument.
  *   **80–85:** **Exclusions.** Briefly list what you haven't covered (nonmonotonic logic) and why.
  *   **85–90:** **Final Question.** Pose the question above. Collect responses or take a show of hands on the interpretation.

  This structure ensures the technical rigour anchors the philosophical speculation, preventing the seminar from drifting into vague hand-waving about 'context', while ensuring the 'robot' stories don't reduce the issue to a mere engineering hurdle.
