answer: |-
  The premise to drop
  You're assuming higher-order states must be strictly conscious, conceptual reflections like "I am thinking about this apple." That is the core error. Higher-Order Theory posits that the monitoring state is usually unconscious and non-conceptual. You don't need to verbally label your experience or step back philosophically to be considered conscious. The higher-order state is a silent, immediate mental scan, not necessarily a deliberate act of introspection. Dropping the requirement for explicit conceptual reflection solves the "movie zombie" problem immediately and completely.

  What the theory actually claims
  Higher-Order Theory argues a mental state becomes conscious only when targeted by a higher-order representation. Crucially, this representation is typically unconscious. When you're absorbed in a movie, your visual cortex processes the images (first-order), and a silent mechanism tags these states as 'mine' or 'present' (higher-order). This tagging happens automatically, not through deliberate introspection. You aren't thinking about your mind; your mind is simply tracking its own states in real-time. It is a background process, akin to peripheral vision monitoring while you focus. This explains why you have vivid experience without reflection. The theory distinguishes between the *content* of experience (the movie) and the *awareness* of that content. Without this tag, sensory data remains unconscious processing. If the higher-order mechanism fails, you might process the movie without conscious experience (blindsight-style), but during normal absorption, both systems are active. The higher-order state doesn't need to enter consciousness itself; it just needs to illuminate the first-order state. This avoids an infinite regress while maintaining that consciousness requires self-monitoring, just not conscious self-monitoring. So, you aren't a zombie during the climax; your brain is silently monitoring your excitement without you needing to narrate it. Researchers emphasize this implicit scanning is constant.

  Is it just attention?
  It's a common conflation, but they are distinct mechanisms operating in parallel. Attention selects which information gets processed deeply; Higher-Order Theory explains what makes that processed information feel like something. You can attend to stimuli without conscious awareness (as in subliminal priming), and theoretically, you could have conscious experience without focal attention (though this is debated). HOT posits a specific representational relationship, whereas attention is a resource allocation system. Think of attention as a spotlight highlighting data on a screen. HOT is the operating system ensuring that highlighted data is registered as 'experienced.' While attention often triggers higher-order states, the theory claims consciousness is the result of the representation, not the selection. Conflating them reduces a theory about subjective feel to a mere theory about cognitive processing capacity and neural routing. Your sources are likely defending the specific architectural claim—that representation creates phenomenology—rather than just saying 'you noticed it.' explicitly.

