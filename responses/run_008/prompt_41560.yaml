answer: |-
  1. "Dependency order"
  Start with the standard RL diagram on the board: Agent left, Environment right, arrows for action/observation. This is their baseline. Next, draw a larger box around both. Label it "Physics." This establishes instantiation. Third, draw the agent's internal model inside the Agent box. Ask them to draw the representation of the Agent inside that model. This reveals the recursion. Finally, introduce optimization: if the agent can modify its own code, does it optimize the code or the world?

  Why this order? If you start with recursion, they'll treat it as a logic puzzle. If you start with optimization, they'll assume standard reward maximization. You must break the boundary before breaking the model. If you introduce self-modification before establishing physical instantiation, they will assume software abstraction boundaries hold. If interruptions arise, park them on the side of the board corresponding to the step they belong to. Do not let them jump to step four before step one is drawn. The visual progression anchors the abstract constraints. Specifically, do not discuss self-modification until the physical box is drawn. If you discuss code changes before physical limits, they will argue version control solves it. You need the hardware constraint to make the self-modeling problem bite. The sequence forces them to accept the physical premise before grappling with the logical consequence.

  2. "The carrying example"
  Use a load-balancing daemon running on the cluster it manages. The daemon models network traffic to optimize routing. However, the daemon's own CPU usage contributes to the network load it is modeling. It must predict traffic that includes its own prediction cost. It lacks consciousness; it is pure code. It must have: a world model, actuation (routing decisions), and self-impact (compute load). It must lack: subjective experience, external reward signal (reward is internal utility), and a clean separation between "thinking" and "acting." This keeps the focus on resource constraints and feedback loops rather than qualia or human intentionality.

  3. "Misconceptions"
  First, they will conflate this with embodiment. Standard RL agents have bodies (actuators/sensors). Head this off immediately when drawing the first box: embeddedness is about ontology, not hardware. Second, they will claim POMDPs solve this. POMDPs assume hidden external state. Embedded agency means the *model itself* is part of the hidden state and affects transitions. The transition function $T$ is no longer external to the agent; it depends on the agent's physical implementation. Address this when discussing the internal model. Third, they will suggest "just include yourself in the model." This ignores the regress: a model containing itself must be larger than itself. Head this off during the recursion step. Finally, they may treat this as Sim2Real transfer. Clarify that Sim2Real is about noise; embedded agency is about structural self-reference. You must emphasize that the map cannot contain the territory if the map is inside the territory. Another error: assuming dualism is a safe engineering approximation. They will argue "we treat the agent as external anyway." Counter that this works until the agent optimizes its own hardware or model. If they think the boundary is just a convenience, they miss the risk of self-destruction or model collapse. This misconception arises late, when discussing optimization.

  4. "Check"
  Ask: "If your agent's model requires 1GB of RAM, and the agent itself runs on 1GB of RAM, can the model contain a perfect representation of the agent? Why or why not?" This forces them to confront the physical compression constraint rather than abstract self-reference. If they answer "yes," they haven't grasped the resource limit. If they answer "no," ask where the missing information goes.

  5. "What to leave out"
  Decline Newcomb-like decision problems and logical counterfactuals. These are normative puzzles about choice, not descriptive engineering constraints. Also decline consciousness. Say: "We are discussing physical limits on modeling and optimization, not metaphysical free will or logical decision theory. Those are separate layers we don't have time to unpack." Keep the discussion on compute, thermodynamics, and control loops.

  6. "Settled vs contested"
  Settled: Agents are physical systems subject to thermodynamics and computation limits. Perfect self-modeling is impossible due to compression constraints. The agent cannot hold a state representation larger than its physical substrate allows. Contested: Whether this necessitates new decision theories (like Functional Decision Theory) versus better approximations of standard RL. The "Cartesian boundary" language is a framing device from specific AI safety research (MIRI/AF), not universal terminology. Some control theorists argue "agency" is the wrong abstraction entirely; there are just dynamics. Others argue the dualist approximation is sufficient for engineering. Present the physical limits as fact, but the proposed theoretical fixes as active research areas with competing approaches. Do not present the "embedded agency" framing as the only way to see the problem; frame it as one lens among several for analyzing self-referential optimization.
