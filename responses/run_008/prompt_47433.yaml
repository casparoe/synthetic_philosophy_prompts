      *   **Conclusion:** Summarize the stability of the position.

  5.  **Refine the Content (Self-Correction/Nuance Check):**
      *   *Correction:* Make sure not to validate the September Program as *the* proof. Fischer used it as evidence of aims, but the "War Council" of 1912 is often cited for intent. Need to mention that.
      *   *Nuance:* The user mentioned the September Program specifically. I need to address what happens if *that specific document* is debunked, even if other evidence exists.
      *   *Nuance on Blame:* Distinguish between *causal responsibility* (you broke it) and *moral culpability* (you are bad). The friend conflates them. The user needs to separate them.
      *   *Tone:* Keep it analytical, rigorous, slightly academic but accessible. No reading lists.
      *   *Specific User Constraint:* "The thing I'd probably never give up: that somebody has to be blamed." I need to challenge this gently. Is it a historical necessity or a psychological need?

  6.  **Drafting the Response (Mental Outline):**
      *   *Intro:* You're right to separate (a) and (b). They rely on different logics.
