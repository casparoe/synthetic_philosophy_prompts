      *   *Defeaters for (b):*
          *   **Democratic Deficit:** If it can be shown the German public/Reichstag was actively pacifist and overridden by a tiny clique (then "Nation" is the wrong unit).
          *   **Alternative Outcomes:** If other powers had identical structures but didn't start wars (then structure isn't the cause).
          *   **Post-War Action:** If Germany immediately post-1918 repudiated the war aims (does this discharge blame?).
      *   *The "Descendant" Slide:* Does blaming 1914 Germany blame 2024 Germany? No, if "Nation" refers to the *political entity/regime* of 1914, not the ethnic/cultural continuum. The friend's *reductio* is weak if "Nation" is defined politically/historically, not ethnically/morally.
      *   *Insulation:* If nothing could discharge the blame, the position is dogmatic. There must be a counterfactual where Germany *wouldn't* be to blame (e.g., if they had accepted mediation).

  4.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the sophistication of the user's position. Validate that (a) and (b) are distinct.
      *   **Section 1: Defeaters for Part (a) (Intent/Agency).**
          *   Focus on the "Calculated Risk" vs. "Premeditation" distinction.
