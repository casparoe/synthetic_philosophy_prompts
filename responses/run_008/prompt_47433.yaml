      *   **Core Task:** Stress-test the user's position. Specifically, identify what evidence/arguments would *actually* count against their view (defeaters), distinguishing between Part (a) (Deliberate War/Intent) and Part (b) (National Blame/Responsibility).
      *   **Specific Requirements:**
          *   Map out documentary/archival findings that would falsify the views.
          *   Separate defeaters for (a) and (b).
          *   Rank defeaters from fatal to inconvenient.
