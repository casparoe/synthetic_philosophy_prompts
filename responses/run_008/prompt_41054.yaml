prompt: |-
  My housemate has firm views about what one can legitimately come to believe about artworks on someone else's say-so, and I'm trying to work out what principle, if any, she's running. Her verdicts so far: when a critic she trusts tells her a film is suspenseful and she believes it, she insists she doesn't *know* the film is suspenseful until she has seen it; when a museum label tells her a sculpture is second-century BCE, she says she knows that without ever having seen the sculpture; when a chef friend describes a tasting menu as inventive, she says she doesn't know that until she has eaten it; and when a guidebook tells her a building was laid out so that each room receives direct sun at a different hour, she counts that as knowledge sight unseen. Next month her book club takes up a novel I have read and she hasn't. I've told her — accurately, and she trusts my reports — that the novel's ending is deliberately unresolved: the text never settles whether the narrator has been lying. Will she say she knows the ending is unresolved before reading the book?

  I care less about her eventual answer than about the rules that could generate her track record. One candidate says testimony transmits facts about artworks but never aesthetic evaluations; another says testimony fails exactly where grasping the property requires engaging the work yourself, and transmits everything else. Identify the rules that fit the verdicts (including any I've missed), say what each predicts about the unresolved-ending case, note whether the fact/evaluation distinction itself is stable here — an ending's being unresolved is arguably both a plain fact about the text and an aesthetically loaded feature — and then give your best guess about her verdict with your reasons. Finally, name the one further case that would best tell the candidate rules apart, and say what her verdict on it would show. Please keep your answer under 350 words.
