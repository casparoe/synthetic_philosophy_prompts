      *   *Nozick's Response:* What he resists (patterned principles) vs. what he grants (rectification, perhaps minimal safety nets if funded voluntarily).
      *   *Friend's Charge:* Does the analogy survive? No, it begs the question.
      *   *Better Analogy:* Sketch the potluck or the "multiple bakers" scenario.
      *   *Manna Reference:* Address the memory about manna from heaven (it is in *Anarchy, State, and Utopia*, regarding end-state principles).
