      *   *Claim 2: "This is not merely unkind but a scientific mistake: pleasures and pains belong to distinct brains, and there literally is no super-being that feels the combined total."*
          *   **Verdict:** Mostly accurate, but "scientific mistake" is a bit strong/reductive. Rawls treats it as a *moral* category mistake derived from a metaphysical fact. The core point (no super-subject) is correct.
      *   *Claim 3: "Because each of us is sealed inside our own skull, no sacrifice of one person for the benefit of others can ever be justified..."*
          *   **Verdict:** **Problematic.** This is the leap from "is" to "ought." Rawls argues utilitarianism *fails to take seriously* the distinction, not that *any* sacrifice is impossible. Rawls allows for some burdens, just not fundamental liberties for the sake of aggregate welfare.
      *   *Claim 4: "...and this is why Rawls built his own theory to rule out trade-offs between persons entirely."*
          *   **Verdict:** **False.** Rawls does not rule out *all* trade-offs. He rules out trading basic liberties for economic gain. But within the difference principle, there are comparisons of indices of primary goods.
      *   *Claim 5: "The utilitarian's only escape is to deny that people are really separate, which no sane person can do."*
          *   **Verdict:** **False/Caricature.** Utilitarians (like Harsanyi, Singer, Parfit) accept separate persons but argue the *moral standpoint* is impartial. They don't need to deny metaphysical separateness.
      *   *Claim 6: "Later thinkers such as Nozick and Scanlon converted this insight into the doctrine of rights as side constraints, completing the refutation."*
