      *   (4) Distinguishing them requires counterfactuals not contained in the selection facts. (The leap from "underdetermined by actual history" to "requires external counterfactuals".)
      *   (5) If it underdetermines heart function, it underdetermines mental function *a fortiori*. (Plausible inference.)
      *   (6) Indeterminate content is no content. (Philosophical stipulation.)

  3.  **Evaluate the Steps from a Biological and Philosophical Perspective:**

      *   *Step (3):* Is it true that population-level facts are the same? Yes, in the *actual* history, if trait A (pumping) and trait B (noise) are perfectly correlated, the fitness contribution looks identical. This is the "Spandrel" problem.
      *   *Step (4):* This is the crux. Does distinguishing them require *importing* counterfactuals that aren't "selection facts"? Or are the counterfactuals *implicit* in the causal structure of the selection process?
      *   *Step (6):* This is a high bar. Is content *totally* lost if there's some indeterminacy? Or is there a "determinate enough" threshold?

  4.  **Identify the Best Point of Attack:**
      *   The argument is a version of the "Indeterminacy of Selection" objection, famously articulated by Jerry Fodor (against teleosemantics) and Elliott Sober (on selection-for).
      *   *Biological Reality Check:* The user is right. Biologists *do* make these distinctions. How? By looking at *causal mechanisms*, not just statistical correlations in the historical record.
      *   *Philosophical Response:* The standard defense of etiological teleosemantics (Millikan, Neander) against this specific objection usually targets Step (3) or (4). They argue that "selection-for" is not just a statistical summary of the past but involves a *causal explanation*.
      *   *The "Causal Role" Move:* To distinguish pumping from noise, we look at *why* the fitness increased. Did the noise cause survival? No. Did the pumping cause survival? Yes. The "selection fact" isn't just "hearts left more descendants"; it's "hearts left more descendants *because* they pumped."
      *   *The Counterfactual Move:* Step (4) claims counterfactuals aren't selection facts. But many philosophers of biology (e.g., Nanay, Neander) argue that selection explanations *are* inherently counterfactual. To say "X was selected for Y" *means* "If X hadn't done Y, X wouldn't have been selected."
      *   *The "Indeterminacy" Move (Step 6):* Maybe content doesn't need to be perfectly sharp. (But the user seems to want a robust defense of the biological practice).

      *Decision:* The strongest rejection is of **Step (4)**, potentially supported by a nuance in **Step (3)**. Step (4) assumes a thin, purely statistical view of "selection facts." A richer, causal view of selection (which aligns better with actual biological practice) incorporates the counterfactuals *into* the description of the selection history.

