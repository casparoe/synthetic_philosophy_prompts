      *   **The Argument:** A six-step argument claiming that selection history underdetermines function because multiple correlated effects exist, and history alone doesn't distinguish the selected-for effect from free-riders without importing counterfactuals. If function is indeterminate, content is indeterminate. If content is indeterminate, it's not content. Therefore, etiological teleosemantics fails.
