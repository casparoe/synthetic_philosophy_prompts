      *   *Naturalism:* Is appealing to physics/physiology "naturalistic"? Yes, absolutely. It's not mystical.
      *   *Conclusion:* Reject (4). The counterfactuals are implicit in the causal description of the selection episode, which is part of the "selection fact" broadly construed.

  7.  **Structure of the Response:**
