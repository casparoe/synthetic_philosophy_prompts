      *   *Branching (Many Worlds/Everettian):* You go back to a different branch. Killing grandfather is fine there, doesn't affect your origin.
      *   *Fatalist:* Determinism amplified. No free will in the loop.
      *   *Hollywood:* Dynamic timeline. Past changes, present updates, traveler retains memory. Often considered logically problematic (persistence conditions).

      *Logical Flow:*
      1.  Is time travel possible? (No -> Impossible)
      2.  If yes, does the past change relative to the traveler's origin? (Yes -> Branching or Hollywood)
