answer: |-
  Dear Friends and Members of the Philosophy Society,

  It is a pleasure to provide you with this tool for our spring term. The goal here is to move us away from memorizing labels and toward examining the concrete intuitions that drive those labels. When we argue about time travel, we often talk past one another because we are answering different questions without realizing it. Some of us are asking what is physically possible, others what is logically consistent, and others still what our words like can or choose actually mean. To sort this out, I have constructed a decision tree that functions as a map of the logical space. You will not find any questions asking you to pick a theory by name. Instead, you will be asked to judge specific cases. By following the path of your answers, you will arrive at a position that matches your intuitions, whether or not you knew that position had a name.

  Let us begin at the root of the tree with the most fundamental question. Imagine a scientist who builds a machine, steps inside, and activates it with the intention of arriving in the past. At the first fork, you must decide if this scenario is possible at all. If you believe that the very concept of moving backward in time involves a logical contradiction, similar to drawing a square circle, or that the laws of physics strictly forbid closed timelike curves regardless of engineering, then you should follow the branch that says this journey cannot happen. This path leads you directly to the first leaf, which is the view that time travel to the past is impossible in principle. This is a respectable position held by many physicists and philosophers who believe the grandfather paradox is not a puzzle to be solved but a proof that the activity is forbidden. If you stand here, you believe the debate ends before the traveler even pulls the lever.

  However, if you believe the journey itself is possible, we move to the second node. Suppose the traveler arrives in nineteen twenty and interacts with the world. She then attempts to return to the exact moment she left. Here is the case where our members often come apart. When she steps out of the machine upon her return, is the present moment exactly as she left it, or has something visibly changed due to her actions in the past? If you answer that the present has changed, perhaps because her grandfather is now dead and her family never existed, you are committing to a view where the past is mutable. This leads us to a third fork concerning the nature of that change. You must decide what happens to the traveler herself in this changed present. If you think the history is overwritten like a tape recording, so that the traveler might fade away or exist in a reality that has been fundamentally rewritten while retaining memories of the old one, you arrive at the Hollywood overwrite model. I must be explicit about the status of this leaf. This position is generally diagnosed as incoherent. The reason is that if the traveler changes the past so that she is never born, there is no cause for her to have traveled back to change the past in the first place. This creates a causal loop where the effect erases the cause, which then prevents the effect. While popular in cinema, it requires giving up the logical principle of non-contradiction regarding existence, making it philosophically unattractive unless one is willing to embrace true contradictions.

  If, however, you believe the present changes but not through overwriting, you likely hold that the traveler has not changed her own past but has instead arrived at a different version of reality. This is the branching view. On this path, when the traveler kills her grandfather, she has not altered the history that produced her; she has merely moved to a new branch where he dies. Her original history remains intact in its own branch. This view avoids the incoherence of the Hollywood model by positing multiple histories rather than one changing history. If you follow this branch, you land on the leaf labeled the branching view. This position preserves the possibility of killing the grandfather without paradox, but it comes at the cost of multiplying realities.

  Now, let us return to the second node and take the other path. Suppose you answered that when the traveler returns, the present is exactly as she left it. Her grandfather lived, her family exists, and history appears unchanged. This commits you to a single self-consistent history. We must now investigate why the history remained consistent. This brings us to the fourth node, which uses the case of the gun. Imagine the traveler goes back, aims a carefully tested gun at her young grandfather, and pulls the trigger. The gun jams. She tries again, and it jams again, always for a different mundane reason. You must decide why this happens. If you believe the gun jams because the laws of physics conspire to prevent inconsistency, such that the universe physically forces the malfunction to protect the timeline, you are leaning toward a strong self-consistency principle. However, if you believe the gun jams simply because that is what happened, and that there is no physical force preventing the jam other than the fact that the grandfather must live for the traveler to exist, you are moving toward a different distinction.

  This brings us to a difficult part of the tree where I must be honest about a limitation. There are two positions that are extremely hard to pull apart using case questions alone because they predict the exact same outcomes. One is the single self-consistent history view, often associated with the Novikov self-consistency principle, which says physical laws prevent the paradox. The other is the view associated with the philosopher David Lewis. Lewis argues that the traveler can kill the grandfather in the ordinary sense of having the ability and opportunity, but simply never does and never will because it is compossible with the facts that the grandfather lives. If you answer that the traveler had the ability to kill him but was prevented by the logical facts of the situation, you are near the Lewis view. If you answer that the traveler never truly had the ability because the physical laws of the universe forbade it, you are near the self-consistent view. In practice, these two leaves often merge in conversation because the observable result is identical: the grandfather lives. I advise you that if you find yourself unable to distinguish between a physical constraint and a logical constraint here, you may occupy a space between the leaf labeled the single self-consistent history view and the leaf labeled the Lewis view. For the purposes of this society, you may treat them as neighboring positions on the same branch, distinguished only by your analysis of the word can.

  To further refine your position within the single history branch, we must consider the fifth node, which involves the blueprint case. Imagine a traveler hands a nineteen twenties engineer the complete blueprint for a time machine, and it later turns out the engineer's famous machine was built from that blueprint, the blueprint having no origin other than the loop itself. If you find this scenario acceptable, believing that information can exist without an ultimate origin point as long as it is consistent, you remain on the single history branch. However, if you find this scenario impossible because you believe every event must have a prior cause that is not itself, you might be pushed toward the view that time travel is impossible after all, or you might be led to the final fork regarding free will.

  This final fork addresses the fatalist view. You must ask yourself whether the traveler could have done otherwise in any meaningful sense. If you believe that the whole business shows our ordinary concept of choosing between open futures does not survive time travel even in one history, then you belong at the leaf labeled the fatalist view. This position holds that in a single consistent history, the traveler was always destined to fail to kill the grandfather, and the feeling of choice is an illusion. This differs from the Lewis view, which preserves a sense of ability even if the action is never performed. The fatalist denies the ability itself in the context of the loop. If you believe the traveler was free to choose but simply chose not to kill him, you remain with Lewis. If you believe the traveler was never free to kill him because the future was already fixed, you are a fatalist.

  There is one combination of answers that I must note has no occupant. If you answer that the history is single and unchanging, but also that the traveler successfully kills the grandfather, you have arrived at an empty node. This is not merely unattractive; it is incoherent. This combination is the grandfather paradox itself, not a solution to it. It asserts that A and not-A are both true: the grandfather lives to produce the traveler, and the grandfather dies before producing the traveler. No coherent philosophical position occupies this space because it violates the law of non-contradiction. Any member who finds themselves here must retreat to one of the previous forks and change an answer, either by allowing the history to branch, denying the possibility of the travel, or accepting that the killing fails.

  Another potential empty node lies in combining the branching view with the idea that the traveler ceases to exist if their original grandfather dies. Some members might want to say that there are multiple branches, but that killing the grandfather in the new branch still erases the traveler. This is an unattractive position that is largely unexplored because it combines the costs of both views. It requires the metaphysical baggage of multiple histories but retains the causal instability of the Hollywood model. If the traveler is erased, the killing never happens, so the branch never diverges, so the traveler exists. It is better to either commit fully to branching, where the traveler persists safely in the new history, or to single history, where the killing never succeeds.

  As you use this instrument, remember that the value lies not in the label you end up with, but in the consistency of your answers. You may find that your intuition about the gun case conflicts with your intuition about the blueprint case. That tension is where the real philosophy happens. The Lewis view and the self-consistent view are close neighbors, and you should not feel forced to choose between them if your intuitions about ability and physical law are blended. The Hollywood model is available to you, but you must accept the diagnosis that it is likely incoherent. The fatalist view is available, but it requires you to surrender much of what we mean by free will. The branching view saves free will and consistency but multiplies worlds. The impossibility view saves logic but forbids the fun.

  I hope this prose tree serves you well in your meetings. Read it aloud, pause at each fork, and let the members vote with their intuitions about the cases rather than their familiarity with the names. You will likely find that the society splits less along lines of knowledge and more along lines of fundamental metaphysical commitment. Some of you will prioritize logical consistency above all, others will prioritize the reality of choice, and others will prioritize the simplicity of a single history. There is no wrong answer, provided you are willing to accept the consequences of the leaf you land on. If you land on a leaf and find the consequences unacceptable, you must backtrack and find which case question you answered incorrectly according to your own deeper principles. That process of reflection is the true aim of our society.

  I wish you a stimulating term of debate. May your timelines remain consistent, or if they branch, may you find yourselves in a good one.

  Sincerely,

  Your Philosophy Society Advisor
