      *Drafting the "Moving Moment":* It needs to be about the *oath*. The oath is a promise to principles. Principles are universal. So the oath connects them to humanity through the specific nation.
      *Revised Idea:* The oath makes you a guardian of the Constitution. The Constitution promises justice. Justice is not blind to distance. So guarding the Constitution means guarding the values that connect you to your cousins abroad.

