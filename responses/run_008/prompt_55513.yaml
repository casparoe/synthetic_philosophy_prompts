      *Critique 1:* Too dry. Needs more ceremonial warmth. Needs to be clearer on the "special duties" nuance without using jargon. The "structural work" needs to be evident in *why* we celebrate the transnational ties.

  5.  **Drafting - Iteration 2 (Focusing on the "Platform" metaphor):**
      *   Start with the journey.
      *   Define citizenship as a "station" or "post."
      *   The oath is a promise to uphold the law.
