answer: |-
  Distinguished Judge, court officials, families, and most importantly, the newest citizens of the United States:

  Welcome. Today is not merely an administrative conclusion to a long process. It is a beginning. You have traveled far to stand in this room—some of you across oceans, some of you across decades of hope and labor. You are here to take an oath that changes your legal status, but I want to suggest to you that it changes something deeper. It changes your relationship to justice.

  We often speak of citizenship as a kind of membership, like joining a club or a family. But if we look closely at what you are doing today, it is more like accepting a station. You are taking up a specific post within a vast project of self-government. For the first time, you share fully in the authority that writes the laws, and you share fully in the responsibility for the laws that are written. You are no longer just subject to the rules of this country; you are now a co-author of them.

  This is a heavy privilege. Because you now share this political scheme with your neighbors, you owe them a specific kind of attention. You owe them the work of ensuring that the machinery we share runs fairly. When you vote, when you serve on a jury, when you speak at a town hall, you are maintaining the tools that protect human dignity within these borders. This is the special duty of citizenship: not to love your neighbor more than anyone else, but to recognize that you now share a lever with them. You must work together to keep that lever from crushing anyone.

  I know that for many of you, your hearts remain tethered to places far beyond this courtroom. You have parents in Manila, cousins in Lagos, siblings in Kiev. You send money home. You make phone calls late at night. You worry about storms, elections, and illnesses in countries you no longer legally inhabit.

  Sometimes, people will tell you that to be a good American, you must leave those worries behind. They will tell you that your primary concern must now be only for those within this border. I am here to tell you that is not true. In fact, it is the opposite.

  The values you swear to uphold today—liberty, justice, equality—are not American property. They are human aspirations. When you send remittances to a family abroad, you are practicing justice. When you care for a parent across an ocean, you are honoring dignity. Do not let anyone shame you for these ties. They are not distractions from your citizenship; they are evidence of the moral capacity that makes you fit for it. A person who cares deeply for distant strangers is exactly the kind of person who will care deeply for the justice of their own community.

  Your obligation here is not to narrow your circle of care, but to deepen your capacity to act. Citizenship gives you a voice here, in this specific system, so that you can help build a society that respects those ties rather than severing them. You are not building a wall around your compassion. You are building a foundation under it.

  This brings me to the oath you are about to take. In a few moments, you will raise your right hand. You will promise to support and defend the Constitution.

  When you raise that hand, do not think of it as a gesture that cuts you off from your past. Think of it as planting your feet. You are planting your feet firmly on this ground so that you can help lift the world. You are gaining the standing to ensure that the laws governing you are worthy of the values you hold universal. The Judge sees a promise to a nation; I see a promise to principles that exceed any nation. But we are both right. Because this nation, at its best, is merely a vessel for those principles.

  So, welcome to this work. It is not easy. It requires you to care for the stranger at the border and the stranger across the ocean, knowing that justice does not stop where the map ends. But now, you have a seat at the table where those decisions are made.

  Use that seat wisely. Use it to protect the vulnerable, wherever they are. Use it to ensure that the power we share is never used to crush the hope that brought you here.

  Welcome to the community of citizens. Welcome to the work of justice. Thank you.
