      *   **Occasion:** Keynote address at a naturalization ceremony in a federal courthouse.
      *   **Audience:**
          *   New citizens (approx. 100) + families (many still foreign citizens, dependent on remittances).
          *   Presiding Judge + Court Officials (expect warm, celebratory, non-controversial affirmation of citizenship).
          *   Colleagues (will read transcript, will spot any betrayal of cosmopolitan principles).
      *   **Constraints/Goals:**
          *   Thread the needle: Celebrate significance of citizenship without asserting compatriot priority over distant strangers/family abroad.
          *   Honor transnational ties (remittances, connections) rather than shaming them.
          *   Tone: Warm, welcome, not a lecture (accessible language, some ESL listeners).
          *   Length: Roughly 800 words.
          *   Register: Ceremonial, American English.
          *   Core Requirement: The philosophical view must do *structural work* (determine what is said), not just decorate.
          *   Ideal: One moment that moves both the judge (patriotic/civic) and the cosmopolitan theorist (ethical/universal) for the *same reason*.

  2.  **Deconstruct the Philosophical Tension:**
      *   *Traditional/Nationalist View:* Citizenship creates special bonds that prioritize fellow citizens over outsiders. Becoming a citizen means joining a "family" where insiders come first.
      *   *Speaker's Cosmopolitan View:* Citizenship is a political/legal status involving shared subjection to laws. It creates specific duties (upholding the constitution, participating) but does *not* negate universal moral duties to humans elsewhere. Special duties are instrumental or political, not intrinsic moral superiority.
      *   *The Challenge:* How to make citizenship feel "special" and "significant" (satisfying the Judge) without claiming moral exclusivity or superiority over non-citizens (satisfying the Philosopher).
      *   *Solution:* Frame citizenship not as a *boundary of care* but as a *platform for action*. It's not that you love Americans *more*; it's that you now have *tools* (vote, voice, legal standing) to effectuate justice both here and abroad. The "specialness" is in the *capacity* to contribute, not the *priority* of the recipient.

  3.  **Drafting Strategy - Section by Section:**
      *   **Opening:** Welcome, acknowledge the gravity, acknowledge the diverse backgrounds. Set a warm tone.
      *   **Reframing Citizenship:** Avoid "joining the family" rhetoric. Use "joining the project" or "taking up the tools." Focus on the Constitution as a mechanism for justice.
      *   **Addressing Transnational Ties:** Explicitly validate connections abroad. Remittances and care for family are not distractions from citizenship; they are expressions of the same moral commitment that drives civic engagement.
      *   **The "Structural" Argument:** The duty of a citizen is to make the system just. A just system respects human dignity everywhere. Therefore, being a good American involves honoring your global ties.
      *   **The "Moving Moment":** Connect the oath to the universal desire for dignity. The judge sees patriotism; the cosmopolitan sees universal human agency.
      *   **Closing:** Call to action. Welcome them.

  4.  **Drafting - Iteration 1 (Mental Outline):**
