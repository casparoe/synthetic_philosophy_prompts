      *   Make sure language is simple (ESL consideration).

  6.  **Writing - Focusing on Tone and Constraints:**
      *   *Word Count:* Aim for ~800.
      *   *Language:* Accessible, rhetorical but not academic.
      *   *Key Insight:* The "special obligation" of citizenship is the obligation to *maintain the machinery* that allows us to help others. It's a division of labor, not a hierarchy of love.
      *   *The Moment:* The oath itself. It binds you to principles, not just people.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Avoid:* "You now love America more."
      *   *Say:* "You now have a specific role within America."
      *   *Avoid:* "Forget your old country."
      *   *Say:* "Your care for your old country is part of what makes you a good citizen here."
      *   *Philosophical Core:* Shared subjection to coercive scheme = duty to ensure that scheme is just. Justice requires acknowledging global need. Therefore, citizenship is the lever to achieve justice locally and globally.
