answer: |-
  This is a fantastic pedagogical challenge. You are correctly identifying that for "internet-literate" sophomores, the Knobe Effect has transitioned from a psychological finding to a piece of cultural trivia. If you lecture it, they will perform understanding. If you *simulate* the discovery, they might actually feel the cognitive dissonance.

  Here is a complete design for the 75-minute session, followed by the frank "pre-mortem" on failure modes and validity limitations you requested.

  # Lesson Plan: The Intentionality Trap

  **Goal:** Students experience the asymmetry in intentionality judgments as a conflict between peers before theorizing it.
  **Materials:** Two sets of handouts (printed on different colored paper, e.g., White and Blue), pens, whiteboard.
  **Prep:** Minimal. Just printing.

  ## I. Materials

  **Handout A (Harm Condition) - White Paper**
  > **Case 1:**
  > The vice-president of a company went to the chairman of the board and said, "We are thinking of starting a new program. It will help us increase profits, but it will also **harm** the environment."
  > The chairman answered, "I don't care at all about harming the environment. I just want to make as much profit as I can. Let's start the new program."
  > They started the new program. Sure enough, the environment was **harmed**.
  >
  > **Question:** On a scale of 1–7, to what extent did the chairman **intentionally** harm the environment?
  > (1 = Not at all, 7 = Completely)
  >
  > **Follow up:** Did the chairman know the program would harm the environment? (Yes / No)

  **Handout B (Help Condition) - Blue Paper**
  > **Case 1:**
  > The vice-president of a company went to the chairman of the board and said, "We are thinking of starting a new program. It will help us increase profits, but it will also **help** the environment."
  > The chairman answered, "I don't care at all about helping the environment. I just want to make as much profit as I can. Let's start the new program."
  > They started the new program. Sure enough, the environment was **helped**.
  >
  > **Question:** On a scale of 1–7, to what extent did the chairman **intentionally** help the environment?
  > (1 = Not at all, 7 = Completely)
  >
  > **Follow up:** Did the chairman know the program would help the environment? (Yes / No)

  *(Note: Keep the text identical except for the bolded words. Do not label them A/B on the sheet.)*

  ## II. Timeline (75 Minutes)

  **0:00 – 0:10: Distribution & Isolation**
  *   **Action:** As students enter, hand out White or Blue alternately (1, 2, 1, 2...).
  *   **Instruction:** "Do not show your sheet to anyone. Do not discuss the content with your neighbor. This is a private response task. You have 5 minutes to read and answer the questions silently."
  *   **Why:** Alternating seating prevents clumping. The silence rule is critical.

  **0:10 – 0:20: The Private Vote**
  *   **Action:** Collect the sheets immediately after they write. (This prevents them from holding up their "evidence" during the debate).
  *   **Tally:** While they wait, quickly tally the 1–7 scores. Group 5–7 as "Intentional," 1–3 as "Unintentional," 4 as "Unsure."
  *   **Board Work:** Draw two columns on the board: "Group White" and "Group Blue." Do not label them Harm/Help yet.

  **0:20 – 0:35: In-Group Consolidation**
  *   **Action:** Ask White sheets to sit on the left, Blue on the right.
  *   **Instruction:** "Discuss with your color group only. What was your answer? Why? Come up with a 30-second argument for why your answer is the obvious, common-sense one."
  *   **Goal:** Solidify their intuition. You want them to feel confident that *their* intuition is the normative one.

  **0:35 – 0:50: The Confrontation (The Reveal)**
  *   **Action:** Ask a White spokesperson: "What was the consensus on intentionality?" (Likely: High/Intentional). Write on board.
  *   **Action:** Ask a Blue spokesperson: "What was the consensus?" (Likely: Low/Unintentional). Write on board.
  *   **The Conflict:** "Okay, Group White says he obviously did it intentionally. Group Blue says he obviously did not. Both groups agree he knew the outcome. Both agree he didn't care. Argue. You have 5 minutes to convince the other side they are reading English incorrectly."
  *   **The Reveal:** After 5 minutes of genuine confusion ("How can you say that?"), interrupt. "Wait. Let me see the papers."
  *   **Action:** Hold up a White and a Blue sheet side-by-side. "Did you all get the same text?"
  *   **Reaction:** Allow the "Wait, what?" moment to land.
  *   **Instruction:** "The only difference is one word: Harm vs. Help."

  **0:50 – 1:05: Phase 2 – Student X-Phi**
  *   **Setup:** Break into mixed groups (must have White and Blue students together).
  *   **Task:** "You just found a bug in how we judge intentionality. It seems to depend on whether the outcome is bad or good. Your job is to break it. Design a variant case where this asymmetry *disappears* or *flips*."
  *   **Prompts:**
      *   Change the agent (e.g., a mother, a soldier, a robot).
      *   Change the side effect (e.g., legal vs. illegal, aesthetic, personal).
      *   Change the attitude (e.g., "I am glad it harms" vs. "I don't care").
  *   **Test:** Each group writes their variant on the board. The class votes (Show of hands: Intentional or Not?) for Harm vs. Help versions of *that* new case.
  *   **Tally:** Keep a running score on the board: "Effect Holds" vs. "Effect Broken."

  **1:05 – 1:15: Debrief & Naming**
  *   **Discussion:** "Why did the word 'Harm' change the concept of 'Intentional'?"
  *   **Theories:** Elicit student theories. (e.g., "We want to blame him," "It's implied he lied," "Bad things feel more purposeful").
  *   **The Map:** Connect their theories to the actual philosophical dispute.
      *   *Rationalist View:* Moral judgment penetrates the cognitive concept of intentionality (Knobe).
      *   *Pragmatic View:* We know it's technically unintentional, but we speak loosely to assign blame (Nadelhoffer/Conversational Implicature).
  *   **The Name:** "This is known in the literature as **The Knobe Effect** or the **Side-Effect Effect**."
  *   **Exit Ticket:** "Based on today, is 'Intentional' a descriptive concept or a normative one?"

  ---

  # III. The Pre-Mortem: What Will Predictably Go Wrong

  You asked for paranoia. Here is where this design usually fractures in a classroom setting.

  **1. The "N of 20" Variance Problem**
  *   **The Risk:** In a real study, N=100+ per condition washes out noise. With N=10 per condition, **one contrarian ruins the drama.** If you have 9 "Intentional" votes in Harm, but 4 "Intentional" votes in Help (instead of the expected 1 or 2), the asymmetry looks weak.
  *   **The Fix:** If the split isn't clean during the Confrontation, *lean into the noise.* "Interesting. Most of White said Yes, but Blue is mixed. Why is Help harder to judge than Harm is to blame?" Don't fake a perfect split; analyze the actual data you got.

  **2. The Contamination Leak**
  *   **The Risk:** You mentioned students talking at lunch. If this is a Tuesday/Thursday course, a student from a Monday section might spill the beans. Or, a student recognizes the vignette from a YouTube video they watched the night before.
  *   **The Fix:**
      *   **The "No Googling" Contract:** Start the class by saying, "If you have encountered this specific case before, you have a moral obligation to this experiment to stay silent. If you speak up, you ruin the data for your peers."
      *   **The Variant:** If you suspect contamination, swap "Environment" for "Local Community" or "Shareholder Value." It preserves the structure but breaks the keyword search memory.

  **3. Demand Characteristics (The "Smart Student" Syndrome)**
  *   **Risk:** One student figures out the manipulation *during* the individual response phase. They see the colored paper, suspect a trick, and answer "Intentional" on *both* just to be difficult or to signal they get the joke.
  *   **Fix:** Emphasize that there are no right answers. "This is not a test of logic, it is a record of your intuition."

  **4. The "Null Result" Embarrassment**
  *   **Risk:** Sometimes, in certain demographics, the Knobe Effect doesn't replicate strongly. If both groups say "Intentional" (because they focus on the "I don't care" line implying recklessness), the reveal falls flat.
  *   **Fix:** Prepare a backup slide or verbal anecdote. "In this room, you all saw him as reckless. In the original 2003 study, 82% of Harm said Intentional, but only 23% of Help did. Why might this class differ?" (This turns a failed demo into a lesson on replication contexts).

  **5. Time Creep in Phase 2**
  *   **Risk:** Students love designing cases. They will spend 20 minutes arguing about a robot case and you will run out of time for the debrief.
  *   **Fix:** Hard stop at 1:05. Use a visible timer. Tell them: "You have 3 minutes to design, 2 minutes to vote. Go."

  ---

  # IV. The Validity Check: What This Cannot Reproduce

  You need to be explicit with your students (and yourself) about what this activity is *not*. Do not oversell this as "proof" of the theory.

  **1. It is not Between-Subjects Randomization**
  *   **Reality:** You are assigning by seat count-off.
  *   **Limitation:** If friends sit together, they might get the same color. If the "philosophy kids" sit in the front and all get White, your data is confounded by prior interest.
  *   **Debrief Point:** "In a real lab, we randomize digitally. Here, we used seating. This means our data is noisy. We are demonstrating a *phenomenon*, not establishing a *fact*."

  **2. It is not Anonymous**
  *   **Reality:** Raising hands and speaking in groups is public.
  *   **Limitation:** Social desirability bias. In the Harm condition, students might say "Intentional" because they want to signal they are morally outraged. In a private survey, the effect size might shrink.
  *   **Debrief Point:** "Did anyone hesitate to raise their hand? In real X-Phi, we use private surveys to remove the pressure of peer judgment."

  **3. It lacks Control Conditions**
  *   **Reality:** You only tested Harm vs. Help on a Profit/Environment case.
  *   **Limitation:** You haven't proven it's *moral* valence. Maybe it's just *negative* valence (e.g., "Hurt the grass" vs. "Help the grass"). Real X-Phi runs control cases with non-moral negative outcomes to isolate the moral component.
  *   **Debrief Point:** "Phase 2 was your attempt to build those controls. Did swapping 'Environment' for 'Tax Law' change the result? That's how we isolate variables."

  **4. The "Replication Crisis" Context**
  *   **Reality:** The Knobe Effect is one of the more robust findings in X-Phi, but effect sizes vary wildly across cultures and contexts.
  *   **Limitation:** Presenting this as "The Way Human Minds Work" is scientifically outdated.
  *   **Debrief Point:** "This finding sparked 20 years of debate. Some studies find it in the US but not in rural India. Some find it disappears if you change the question wording. Science isn't a textbook fact; it's a conversation. Today, you joined the conversation."

  # Summary Advice for the Instructor

  *   **Play Dumb:** During the Confrontation phase, do not hint at the solution. Act genuinely puzzled by the disagreement. "I'm confused. Sarah says it's impossible to call it unintentional. Mike says it's impossible to call it intentional. You both read English. Who is wrong?"
  *   **Manage the "Knobe Know-It-All":** If a student raises their hand at minute 5 and says "Is this the Knobe Effect?", smile and say, "If you know the name, please keep the answer in your pocket so your classmates can have the experience. You can be the TA for the debrief."
  *   **Embrace the Mess:** If the data is messy, teach the mess. The lesson isn't "The Knobe Effect is Real." The lesson is "Moral judgment is entangled with descriptive concepts in ways we didn't expect."

  This structure turns the "internet trivia" problem into a feature: even if they know the name, they rarely know the *feeling* of the cognitive conflict. Focus on the feeling.
