prompt: |-
  So I teach a moral psychology course at a mid-sized state school (about 20 students, mostly sophomores, no stats background, 75-minute seminar sessions), and next week we hit the part of the syllabus on experimental philosophy and moral judgment. I've been reading the rationalist-sphere long enough to know that the chairman-and-the-environment side-effect asymmetry is the canonical example, but that's exactly the problem: a chunk of my students have absorbed enough internet philosophy that if I just present the case and lecture on it, half the room will nod along to whatever framing I give them instead of noticing anything in their own heads. What I want is an activity where they are the subjects before they are the theorists. My vague idea is some kind of split-room setup where each half of the class reads a slightly different version of the same vignette, argues about what the protagonist did and why, and only then discovers the versions differed by a single word -- so the asymmetry shows up as mutual incredulity between the two groups rather than as something I assert. But I'm open to a better mechanism if you have one.

  Design the full thing: materials (I can print handouts but want minimal prep), the actual vignettes or instructions for writing them (they can be new cases, not just the environmental one, as long as they're the same shape), a timeline for the 75 minutes, and how to handle the reveal. After the reveal I want a second phase where small groups design their own variant cases to try to break the effect -- e.g. swapping in a non-moral side effect, or changing who the agent is -- and test them on the other groups, with a running tally on the board. Then a debrief that maps specific moments in the activity onto the actual interpretive dispute (is moral judgment penetrating the folk concept of intentionality, or is it just conversational pragmatics about implied blame), rather than just announcing "and this is called the Knobe effect" at the end -- though I do want the name withheld until the very end.

  Also, and this is the part I actually need help with: tell me what will predictably go wrong the first time I run this. My guess is some students will see through the split-room gimmick early because someone will mention the handouts at lunch, and I don't know how paranoid to be about that. And be frank about what a classroom version of this genuinely can't reproduce -- I'm aware that a noisy show of hands in a room of 20 who've all been chatting with each other is not a between-subjects experiment, and I'd rather know which parts of the real finding the activity can carry and which parts I have to smuggle in during the debrief, so I don't oversell it to them.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Moral Psychology course, mid-sized state school, ~20 sophomores, no stats background, 75-minute seminar.
      *   **Topic:** Experimental Philosophy (X-Phi), specifically the Knobe Effect (Chairman/Environment case).
      *   **Problem:** Students are already familiar with the canonical example via internet culture ("rationalist-sphere"). Standard lecturing won't work because they'll just recite the "correct" answer rather than introspect.
      *   **Goal:** An activity where students *are* the subjects first, theorists second. Split-room design (between-subjects) to create mutual incredulity.
      *   **Requirements:**
          *   Full design (materials, vignettes, timeline, reveal).
          *   Second phase: Small groups design variant cases to test boundaries.
          *   Debrief: Map activity to interpretive disputes (intentionality vs. pragmatics), withhold "Knobe Effect" name until the end.
          *   **Crucial:** Predict failure modes (what goes wrong) and limitations (what this classroom demo *can't* replicate compared to real X-Phi).

  2.  **Deconstruct the Activity Design:**
      *   *The Vignette:* Needs to be the Chairman/Environment case (or structurally identical) but fresh enough to bypass rote memorization. Actually, sticking to the original is safer for the debrief, but tweaking the context slightly might help. Let's stick close to the original structure but vary the *outcome* (Harm vs. Help) as the independent variable.
      *   *The Split:* Half get "Harm," half get "Help." They need to be isolated enough not to spoil it before the vote.
      *   *The Vote:* Needs to be private first, then public to show the split.
      *   *The Reveal:* The moment of "Wait, you got a different paper?"
      *   *Phase 2:* Student-led hypothesis testing. They tweak variables (profit, family, law, etc.) to see if the asymmetry holds.
      *   *Debrief:* Connect to Knobe (2003), side-effect effect, intentional action, moral valence.

  3.  **Address the "What Will Go Wrong" (Failure Modes):**
      *   *Contamination:* Students talking between classes or during breaks.
      *   *Demand Characteristics:* Students guessing the point immediately.
      *   *Small N:* 20 students is tiny. 10 per condition. Statistical noise will be high. One contrarian ruins the split.
      *   *Social Desirability:* Students might answer how they think the professor wants.
      *   *Discussion Dominance:* Loud students skewing the small group work.
      *   *Time Management:* 75 minutes is tight for all this.

  4.  **Address the "Limitations" (Scientific Validity):**
      *   *No Random Assignment:* Seating choice isn't random.
      *   *No Anonymity:* Raising hands isn't private data.
      *   *No Control:* No baseline for intentionality judgments outside moral contexts.
      *   *Replication Crisis:* Acknowledge that X-Phi itself is grappling with replication.

  5.  **Drafting the Plan (Iterative Process):**

      *   *Timeline:*
          *   0-10: Setup & Handout distribution (crucial secrecy).
          *   10-20: Individual response (private).
          *   20-35: Group discussion within conditions (build confidence in their view).
          *   35-50: The Confrontation (Reveal & Debate).
          *   50-65: Phase 2 (Design & Test variants).
          *   65-75: Debrief & Name Drop.

      *   *Materials:* Two colored papers (A and B). Simple vignette. Questionnaire.
      *   *Vignette:* Use the "Chairman" case but maybe change "Chairman" to "CEO" or "Director" to feel slightly fresh? No, stick to the classic for the debrief, but ensure the *text* is distinct enough. Let's use the standard Harm/Help version.
      *   *Phase 2:* Need clear instructions on what variables to change.
      *   *Debrief:* Need to guide them from "You're crazy" to "Maybe morality shapes concepts."

  6.  **Refining the "What Goes Wrong" Section:**
      *   This needs to be frank. The user asked for paranoia.
      *   *The "Smart Aleck":* One student who read Knobe last night.
      *   *The "Null Result":* What if both groups say "Intentional"? (Common in some replications).
      *   *The "Leak":* Someone checks their phone.
      *   *Mitigation:* Collect phones? Too aggressive. Seat by count-off? Yes.

  7.  **Refining the Limitations Section:**
      *   Emphasize the difference between *pedagogical demonstration* and *empirical evidence*.
      *   The "N of 20" problem.
      *   The "Classroom Culture" problem (this specific cohort might be weird).

  8.  **Final Polish:**
      *   Tone: Collegial, experienced, practical.
      *   Formatting: Clear headings, bullet points for readability.
      *   Ensure the "Name Withhold" constraint is met.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 20 students enough for a split?
      *   *Fix:* Acknowledge this. If the split is 9 vs 11, it might not look dramatic. Suggest combining "Intentional" vs "Unintentional" + "Blame/Praise" to make the effect clearer. Actually, the core effect is on *Intentionality*. Stick to that.
      *   *Critique:* Phase 2 might run long.
      *   *Fix:* Keep Phase 2 strictly to *designing* and *predicting*, maybe testing on just one other pair, not the whole room. Or have them predict the outcome based on the theory they just inferred. Let's have them test on *another pair* of students to keep the energy up.
      *   *Critique:* How to handle the "Internet Philosophy" students?
      *   *Fix:* Make the instruction "Answer based on your gut, not what you think philosophy says."

  10. **Finalizing the Output Structure:**
      *   Lesson Plan Overview.
      *   Materials (Handouts).
      *   Minute-by-Minute Timeline.
      *   The Reveal Script.
      *   Phase 2 (Student X-Phi).
      *   Debrief Guide.
      *   **The "Pre-Mortem" (What will go wrong).**
      *   **The "Validity Check" (What this can't do).**

