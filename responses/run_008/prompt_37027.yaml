  **Grand Hotel Infinity**
  ⭐⭐⭐⭐½
  **Location:** Transfinite Boulevard, Sector ℵ₀
  **Amenities:** En-suite, 24-hour Room Service, High-Speed Wi-Fi, Uncountable Annexe

  **About the hotel**
  Welcome to the Grand Hotel Infinity, the premier destination for the discerning traveller. Please note that while every room is currently occupied, we always have vacancies available for walk-ins and large groups. Our management prides itself on seamless reallocation protocols to ensure every guest is accommodated immediately. Recent expansions include the Cantor Annexe, featuring uncountably many rooms for guests requiring a continuum of space, though access from the main countable wing is restricted.

  ***

  **Sarah J.** ⭐⭐⭐⭐
  **"Constant room changes disrupt sleep"**
  *Reviewed 2 days ago*
  The service is generally efficient, but the night porter needs to be quieter. I was settled in Room 14,502 when I was woken at 2am and instructed to move to Room 14,503. Apparently, a solo traveller had arrived and required Room 1. The staff explained this is standard procedure: everyone shifts up one number to free the first room. It happened again on Tuesday when a party of three arrived; we all had to move three doors down. I understand the hotel is full, but being told to vacate your bed so a stranger can have Room 1 feels poor form. The luggage porters were quick, at least.

  **Mike T.** ⭐⭐⭐⭐
  **"Impossible room numbers"**
  *Reviewed 1 week ago*
  Arrived during the annual coaches event. Management handled the influx of infinitely many coaches, each with infinitely many tourists, without panic, which was impressive. However, the room assignment system is impractical. I was told my room was determined by prime factorisation based on my coach and seat number. My key card was encoded for Room $2^{41} \times 3^{12}$. I walked the corridor for an hour; the numbers simply get too large to read on the doors. I eventually slept in the lobby. Theoretically, I had a room, but practically, I couldn't find it. Better signage needed for high-index guests.

  **Brenda K.** ⭐⭐⭐⭐⭐
  **"Remarkably stable occupancy"**
  *Reviewed 3 weeks ago*
  Stayed during the Tuesday checkout. I was concerned when every single guest in an even-numbered room departed en masse. Half the guests left! I went to reception to ask if the hotel was closing, but the manager assured me occupancy was completely unchanged. He showed me the ledger: the odd-numbered guests were simply re-indexed to fill the gaps. I checked my bill and was charged the same rate despite the hotel seemingly losing half its customers. It feels like a billing error, but accounts insisted the capacity remains identical. Very efficient use of space, if confusing.

  **Nigel P.** ⭐
  **"Logical impossibility / Fraud"**
  *Reviewed 1 month ago*
  This establishment is a scam. The brochure claims every room is occupied, yet they advertise vacancies. This is a contradiction in terms. A hotel cannot be full and have space simultaneously. Furthermore, when the even-numbered guests left, management claimed the number of guests remained the same. This violates basic arithmetic. A proper part of a collection must be smaller than the whole. If you remove half the guests, the count must decrease. They are playing word games with "infinity" to cover up false advertising. I demand a refund for a stay that defies the law of non-contradiction. Do not trust the maths.
