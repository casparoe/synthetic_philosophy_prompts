answer: |-
  You have stumbled onto a genuine, documented, and philosophically rich phenomenon. You are right to reject "Knightian uncertainty" (which is about unknown distributions) and "hedging" (which is social caution). What you are observing is a structural feature of how experts organize belief when models collide.

  Here is the breakdown of what this is, where it comes from, what to call it, and whether it leaves them vulnerable to a Dutch book.

  ### 1. Does this have a name?
  The "old economics-adjacent philosophy position" your source couldn't recall is almost certainly **John Maynard Keynes**.

  In his 1921 *A Treatise on Probability*, Keynes argued explicitly against the idea that all probabilities are numerically measurable or even comparable. He posited that probabilities are logical relations between propositions and evidence. If the evidence is of different "kinds," the probabilities may be **non-comparable**.

  Keynes wrote: *"There are some pairs of probabilities between which no comparison is possible... we cannot say that one is greater or less than the other."*

  He distinguished between **risk** (measurable), **uncertainty** (unmeasurable but comparable), and **incommensurability** (uncomparable). Your researchers are describing **Keynesian Non-Comparability**.

  In modern decision theory, this is modeled as **Incomplete Preferences** or a **Partial Ordering** of beliefs. Standard Bayesianism requires a *total order* (for any $A$ and $B$, you must believe $A>B$, $B>A$, or $A=B$). Your researchers are asserting a *partial order* (for some $A$ and $B$, no relation exists).

  ### 2. Coining a Term
  While "Keynesian Non-Comparability" is the historical anchor, it doesn't quite capture the specific *pattern* you found: the chain that breaks ($A>B$, $B>C$, but $A$ vs $C$ is undefined). That specific structural break implies that the "likelihood" relation isn't just incomplete; it's **context-dependent** or **categorically fragmented**.

  If you need a term for your series that distinguishes this from ignorance or hedging, I propose:

  **Categorical Incommensurability of Credence**

  **Definition:** A state in which an agent assigns ordinal rankings to propositions within specific ontological or methodological categories, but refuses to establish transitive relations across category boundaries, even when a chain of intermediates exists.

  **Why this fits your constraints:**
  *   **Not Hedging:** The agent is confident in the within-category rankings ($A>B$).
  *   **Not Knightian:** It's not about lack of data; it's about the *nature* of the propositions (e.g., a law vs. a symphony).
  *   **Not Incompetence:** The agent explicitly identifies the structural barrier ("different scales").

  You might also hear this referred to in philosophy of science as **Local Coherence** (their beliefs make sense locally within a paradigm, but not globally across paradigms).

  ### 3. The Formal Consequences: Can you Dutch Book them?
  This is the sharpest question. The short answer is: **No, not if they are allowed to abstain. But yes, if they are forced to act.**

  Here is the mechanics of it:

  **The Standard Dutch Book**
  A Dutch Book relies on the **Completeness Axiom** and the **Transitivity Axiom**.
  1.  **Completeness:** You must have an opinion on every pair.
  2.  **Transitivity:** If you prefer $A$ to $B$, and $B$ to $C$, you must prefer $A$ to $C$.

  Your researchers violate Completeness (they refuse to compare $A$ and $C$). They also appear to violate Transitivity (if "more likely" is a single relation, $A>B$ and $B>C$ should imply $A>C$).

  **The Immunity**
  A Dutch Book requires the bookie to offer bets that the agent *accepts*.
  *   Bookie: "I'll bet you $A$ happens over $B$."
  *   Researcher: "Accepted."
  *   Bookie: "I'll bet you $B$ happens over $C$."
  *   Researcher: "Accepted."
  *   Bookie: "I'll bet you $C$ happens over $A$."
  *   Researcher: **"No bet. Incommensurable."**

  Because the researcher refuses to close the loop, the bookie cannot construct the guaranteed loss. The researcher's "refusal to compare" acts as a circuit breaker. In formal terms, agents with **incomplete preferences** are immune to standard Dutch Books *provided they are allowed to suspend judgment*.

  **The Vulnerability (The Money Pump)**
  The problem arises if the researcher is **forced to choose**. In science, this happens when funding, tenure, or publication requires picking one theory over another.
  *   If forced to choose between $A$ and $B$, they pick $A$.
  *   If forced to choose between $B$ and $C$, they pick $B$.
  *   If forced to choose between $A$ and $C$, they have no rational basis to pick.

  If they pick $C$ over $A$ (perhaps due to framing, mood, or a different heuristic), they become vulnerable to a **Money Pump**. A bookie could trade them $A \to B \to C \to A$, charging a small fee each time, leaving them with less money and the same asset.

  **The Formal Verdict**
  Their belief system is **coherent but incomplete**.
  *   **Coherent:** They aren't logically contradicting themselves *within* their defined categories.
  *   **Incomplete:** Their belief system cannot guide action in all possible states of the world.

  ### Summary for your piece
  You are documenting **Categorical Incommensurability of Credence**. It is a Keynesian feature of expert cognition where the "space of beliefs" is not a single flat landscape, but a series of elevated plateaus. You can walk around on one plateau and rank things. You can walk around on another and rank things. But there is no stairway between them.

  Formally, this protects them from being Dutch-booked on the missing links, but it renders them **rationally paralyzed** when the world forces a cross-category choice. They aren't bad at math; they are refusing to flatten their model of reality to satisfy the axioms of expected utility. They are prioritizing **ontological integrity** over **decisional completeness**.

  That is a hell of a lede.
