answer: |-
  To: Science Desk
  From: Philosophical Consultant
  Re: Specification for Consciousness Claims

  You are asking for a validation protocol for a phenomenon that, by definition, resists third-person validation. This is not merely a difficulty; it is the central tension of the field. To determine whether a headline like "Scientists Detect Consciousness" is licensed, you need to distinguish between a theory that *correlates* consciousness with physical states and a theory that *explains* consciousness as a physical state.

  Below is the specification you requested. It is divided into the **Desiderata** (what the theory must do), the **Classification** (which requirements are scientific and which are metaphysical), and the **Incompatibility Thesis** (why you may never get a clean "yes").

  ### I. The Desiderata: Specification for a Theory of Consciousness

  An adequate scientific theory of consciousness must satisfy the following five conditions to claim it is addressing the *hard problem* (the nature of experience) rather than merely the *easy problems* (functions and behaviors).

  **1. The Explanatory Gap Condition**
  *   **Requirement:** The theory must posit a mechanism that explains *why* specific physical processes are accompanied by subjective experience, rather than merely asserting that they are. It cannot simply map Function X to Experience Y.
  *   **Motivation:** The Philosophical Zombie argument. It is conceptually coherent to imagine a system that performs all human functions (discrimination, report, attention) without any inner feeling. A theory that only describes functions leaves open the possibility that the "lights are off" inside. If the theory cannot explain why the lights are on, it is a theory of behavior, not consciousness.

  **2. The Report-Independence Condition (The Discriminator)**
  *   **Requirement:** The theory must provide a criterion for consciousness that does not rely on the system's ability to report its state verbally or behaviorally. It must identify a "neural signature" or structural property that is necessary and sufficient for experience.
  *   **Motivation:** The problem of non-communicative subjects. Infants, non-human animals, locked-in patients, and potentially AI cannot always provide reliable reports. If consciousness is defined by the ability to say "I am conscious," we cannot detect it in these cases. A scientific theory must allow for detection in the absence of communication.

  **3. The Epistemic Asymmetry Condition**
  *   **Requirement:** The theory must account for the difference in access between the subject and the observer. It must explain why I have immediate, private certainty of my own experience, while you have only inferential evidence of mine.
  *   **Motivation:** The First-Person Authority. Science is third-person (public, repeatable), but consciousness is first-person (private, immediate). A theory that reduces consciousness entirely to third-person data (e.g., "consciousness *just is* gamma waves") risks explaining away the very phenomenon it seeks to study, effectively telling the subject their direct access is an error.

  **4. The Boundary Condition**
  *   **Requirement:** The theory must yield principled verdicts on edge cases where intuition fails. It must specify why the cortex is involved but the cerebellum is not; why split-brain patients may harbor two streams of awareness; why anesthesia extinguishes consciousness but sleep does not.
  *   **Motivation:** The Sorites Problem. Without clear boundaries, "consciousness" becomes a vague predicate like "tall." If a theory cannot distinguish between a complex thermostat, a human cortex, and a brain organoid, it lacks predictive power.

  **5. The Non-Circularity Condition**
  *   **Requirement:** The theory cannot define consciousness in terms of the very behaviors it seeks to explain. It cannot say "Consciousness is the state that causes reports" and then claim to explain reports.
  *   **Motivation:** The Dissociation Evidence. We know reporting machinery can function without consciousness (blindsight, automatic pilot) and consciousness can exist without reporting (locked-in syndrome). If the definition and the explanandum are the same, the theory is tautological.

  ---

  ### II. Classification: Non-Negotiable vs. Metaphysical Wagers

  Not all demands on this list are created equal. Some are methodological necessities for science; others are metaphysical commitments that specific camps disguise as requirements.

  **Non-Negotiable (Methodological Necessities)**
  *   **Non-Circularity:** A theory that defines X by Y and explains Y by X is logically void. This is a requirement of reasoning, not metaphysics.
  *   **Boundary Conditions:** A scientific theory must have a domain of applicability. If it cannot distinguish the system it studies from the surrounding environment, it is not a scientific theory.
  *   **Empirical Adequacy:** The theory cannot contradict established data (e.g., it cannot claim the cerebellum is the seat of consciousness if lesion data shows otherwise).

  **Metaphysical Wagers (Contested Commitments)**
  *   **Causal Efficacy:** *Demand:* Consciousness must do something (influence behavior). *Verdict:* **Wager.** Epiphenomenalism (the view that experience is a byproduct with no causal power) is logically consistent with all physical data. Demanding efficacy rules out epiphenomenalism by fiat, not evidence.
  *   **Computability/Realizability in Silicon:** *Demand:* Consciousness must be implementable in non-biological substrate. *Verdict:* **Wager.** Biological Naturalism (e.g., Searle) argues consciousness depends on specific biological causal powers. Demanding silicon realizability assumes functionalism is true before the investigation begins.
  *   **The Explanatory Gap Condition:** *Demand:* The theory must explain *why* experience arises. *Verdict:* **Contested.** Illusionists (e.g., Dennett, Frankish) argue this demand is incoherent because the "gap" is a cognitive illusion. They satisfy the other criteria by denying the datum that needs explaining. This is a philosophical stance, not a scientific failure.

  ---

  ### III. The Incompatibility Thesis

  **Are the desiderata jointly satisfiable?**

  There is a strong argument that **The Report-Independence Condition** (Third-Person Measure) and **The Epistemic Asymmetry Condition** (First-Person Authority) are in tension, if not mutually exclusive, within a strictly physicalist framework.

  **The Conflict:**
  1.  **Science requires Publicity:** For a "signature" of consciousness to be scientific, it must be third-person observable (e.g., a specific pattern of integrated information or global ignition).
  2.  **Consciousness is Private:** The essence of the phenomenon is that it is *for* the subject.
  3.  **The Dilemma:**
      *   If the theory says the third-person signature *constitutes* consciousness (Ontological Reduction), it risks violating Epistemic Asymmetry. It implies the scientist knows the subject's mind better than the subject does (if the signature is present but the subject denies it, or vice versa).
      *   If the theory says the third-person signature merely *correlates* with consciousness (Epistemic Correlation), it fails the Report-Independence Condition as a *definition*. It admits we still don't know if the system is conscious, only that it looks like others who claim to be.

  **Implication for Your Reporting:**
  If this incompatibility holds, a headline like "Scientists Detect Consciousness" is **category error**. Scientists detect *correlates* of consciousness. They detect the *conditions* under which consciousness is reported. They do not detect the experience itself, because the experience is not the kind of thing that can be detected from the outside.

  **The Verdict:** You should treat any claim of "detection" as provisional. It is licensed only if the authors explicitly state they have found a *reliable correlate* validated against first-person reports in calibrated subjects. If they claim to have measured the experience itself, they are overstepping the logical bounds of the field.

  ---

  ### IV. Brief Scorecard: Theory Performance

  Here is how the leading candidates fare against the specification.

  **Integrated Information Theory (IIT)**
  *   **Strengths:** Excellent on **Boundary Conditions** (calculates exact values for any system) and **Explanatory Gap** (posits experience as intrinsic to causal power).
  *   **Weaknesses:** Struggles with **Empirical Adequacy** (implies panpsychism, suggesting grids of logic gates have tiny experiences, which is untestable). Risks violating **Epistemic Asymmetry** by asserting a system is conscious even if it reports nothing, based purely on mathematical structure.
  *   **Status:** High rigor, high metaphysical cost.

  **Global Workspace Theory (GWT)**
  *   **Strengths:** Excellent on **Report-Independence** (identifies specific neural broadcasting signatures) and **Empirical Adequacy** (fits much cognitive data).
  *   **Weaknesses:** Fails **Explanatory Gap**. It explains how information becomes *available* to the system, not why that availability *feels like something*. Often accused of solving the easy problems.
  *   **Status:** High utility, low on the hard problem.

  **Higher-Order Theories (HOT)**
  *   **Strengths:** Excellent on **Epistemic Asymmetry** (explains awareness as a thought about a mental state).
  *   **Weaknesses:** Fails **Boundary Conditions** for non-humans/infants (requires complex meta-cognition to be conscious). Risks **Circularity** if the "higher order" state is not clearly distinguished from the first-order state.
  *   **Status:** Psychologically plausible, biologically restrictive.

  **Illusionism**
  *   **Strengths:** Dissolves the **Explanatory Gap** by denying the premise (experience isn't what we think it is). Logically consistent.
  *   **Weaknesses:** Violates the intuitive core of **Epistemic Asymmetry** (tells the subject their direct access is a user-illusion). Many find this unacceptable as a theory of *consciousness* rather than a theory of *error*.
  *   **Status:** Philosophically robust, phenomenologically unsatisfying.

  ### Summary for the Editor

  When you ask if the headline is licensed:
  1.  **If the study uses a behavioral report:** The headline is false. They detected compliance, not consciousness.
  2.  **If the study uses a neural signature (e.g., PCI, ignition):** The headline is metaphorical. They detected a *proxy*.
  3.  **If the study claims to solve the Hard Problem:** The headline is premature until the theory resolves the tension between third-person measurement and first-person authority.

  **Recommendation:** The only licensed headline is "Scientists Identify Marker Associated with Conscious Report." Anything stronger assumes a metaphysical wager that the field has not yet settled.
