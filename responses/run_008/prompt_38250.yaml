  3.  **Identify Tensions/Inconsistencies:**

      *   **Tension A: (1) vs. (3) - The Definition of "Outcome-Based".**
          *   Claim (1) says judge by *outcomes*. Claim (3) says defect against strangers because there's *no correlation*.
          *   *Problem:* If you truly judge by outcomes, you should look for *any* evidence of correlation. If there's even a tiny chance the stranger is influenced by your reasoning (or you share a common cause), EDT/FDT says cooperate. Claim (3) asserts "no source" too strongly. If you are an outcome-maximizer, you should be agnostic about the *source* of correlation and focus on the *existence* of correlation.
          *   *Severity:* High. This is the core CDT vs. FDT split. Claim (1) sounds like FDT, Claim (3) sounds like CDT.

