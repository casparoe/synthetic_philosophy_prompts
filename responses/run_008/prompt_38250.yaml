          *   *Problem:* In Platonia, if everyone reasons superrationally (deterministically), everyone sends, everyone loses. If everyone randomizes (mixed strategy), someone wins with high probability. Claim (5) prioritizes "being consistent" over "winning." Claim (1) prioritizes "winning."
          *   *Severity:* Very High. This is a direct contradiction. (1) says "outcomes matter," (5) says "consistency matters even if outcomes suck."

      *   **Tension D: (4) vs. (5) - Coordination Mechanisms.**
