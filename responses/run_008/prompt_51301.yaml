          *   Introduce **The Alignment Problem (Stuart Russell)**. This defines the shift from tool to agent technically.
          *   Introduce **Bruno Latour (ANT)**. "Actants." Gives permission to treat the AI as having agency without being a "person."
      *   *Defining the Line:* It's not about consciousness (POV). It's about **Optimization vs. Intent**. A tool executes instructions; an agent optimizes outcomes.
      *   *The Midpoint:* Needs to be the moment the protagonist *loses* authorship. Not when the AI gets smart, but when the protagonist *notices* they didn't make a choice. The "Sleepwalking" moment.
      *   *Addressing the Editor:* Reframe the arc. It's not "Tool becomes Person." It's "Human delegates until they abdicate." This satisfies the editor's need for human stakes while keeping the user's theme.

  7.  **Refining the Advice:**
