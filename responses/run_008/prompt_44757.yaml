answer: |-
  # Joint Statement on the Normativity of Promising
  **Collaborators:** [Humean Conventionalist] & [Normative Powers Theorist]
  **Date:** October 26, 2023

  ## I. Agreed Claims
  *The following propositions are accepted by both parties as true. Neither party concedes their theoretical explanation for these claims by signing this section; they agree only on the phenomena described.*

  1.  **Conventionality of Form:** The specific linguistic utterances and rituals required to make a promise (e.g., saying "I promise," raising a hand) are historically contingent and socially established. There is no "natural" language of promising.
  2.  **Defectiveness of Secret Breach:** If an agent makes a sincere promise and then breaks it, the act is morally defective even if the breach is never detected by the promisee or the public, and even if the breach produces better overall consequences.
  3.  **Limits of Content:** One cannot successfully promise to do something logically impossible (e.g., "I promise to square the circle") or something morally impermissible (e.g., "I promise to murder X"). In such cases, no obligation is generated.
  4.  **Role of Reliance:** The practice of promising typically induces reliance in the promisee, and the frustration of that reliance is a central harm associated with breaking a promise.
  5.  **Release Condition:** A promisee generally has the authority to release the promisor from the obligation, rendering the promised act optional again.
  6.  **Social Utility:** The institution of promising provides significant mutual advantage by facilitating coordination, securing reliance, and stabilizing expectations over time.

  ## II. Table of Disagreements
  *The following rows identify specific theoretical divergences. The wording is neutralized to ensure neither side feels caricatured.*

  | Issue | Neutral Formulation of the Disagreement | Humean Conventionalist Position | Normative Powers Position |
  | :--- | :--- | :--- | :--- |
  | **1. The Ground of Obligation** | What is the primary source of the *normative force* that binds the promisor? | The force derives from the **utility of the practice**. The obligation is the internalized pressure to uphold a socially useful convention. | The force derives from the **exercise of agency**. The obligation is created by the promisor's intentional alteration of their own normative landscape. |
  | **2. The Bootstrapping Limit** | Why does saying "I promise" create a reason, but saying "I hereby give myself a reason to nap" does not? | Because only the former is supported by a **social practice** that attaches sanctions/sentiments to the utterance. The latter lacks conventional backing. | Because the **normative power** is inherently interpersonal. We have the power to obligate ourselves *to others*, but not to create prudential reasons by mere fiat. |
  | **3. Practice Independence** | Does the obligation persist in contexts where upholding the practice yields no future mutual advantage? | **No (or weakly).** If the practice cannot be sustained or utilized (e.g., no future interactions), the obligation loses its ground or becomes purely sentimental. | **Yes.** The obligation was created at the moment of the promise. The existence of the practice enables the act, but does not sustain the obligation moment-to-moment. |
  | **4. The Nature of the Right** | What does the promisee acquire when a promise is made? | A **high-confidence expectation** backed by social sentiment. | A **normative right** to demand performance (a change in the promisor's status). |

  ## III. Cruxes and Test Cases
  *These are the specific pivot points where our theories yield different predictions or explanations. We agree that these cases bear the weight of the argument.*

  ### Crux 1: The "Desert Island" Terminus
  **The Case:** A shipwreck survivor promises a dying companion on a deserted island to deliver a message to the companion's family back in civilization. The survivor is rescued, returns, and could easily deliver the message. However, the survivor knows that breaking this promise will never be known (the companion died, no one else witnessed the promise) and breaking it will not damage the general practice of promising in society (it is a one-off, isolated case).

  *   **Humean Prediction:** The obligation is significantly weakened or dissolves. Since the "mutual advantage" and "practice upkeep" conditions are absent (no one knows, no practice impact), the pressure to perform relies solely on the agent's pre-existing cultivated virtue, not on the promise itself.
  *   **Powers Prediction:** The obligation remains full-strength. The survivor exercised a normative power to grant the dying man a right. That right exists independently of whether the general practice is served by this specific instance.

  ### Crux 2: The "Unilateral Declaration"
  **The Case:** An agent sits alone in a room and says aloud, "I hereby promise myself to wake up at 5 AM," intending to bind themselves. They fail to wake up.

  *   **Humean Prediction:** This is not a promise in the relevant sense. It is a resolution. It lacks the conventional structure of interpersonal commitment. If the agent feels bad, it is because of a personal standard, not a promise-obligation.
  *   **Powers Prediction:** This is not a promise because normative powers of this type require **uptake** or a **second party**. The failure is not due to a lack of social convention (Hume), but due to the logical structure of the power itself (one cannot hold a right against oneself in this context). *Note: The disagreement here is subtle; the Humean blames the lack of social convention, the Powers theorist blames the lack of interpersonal structure.*

  ### Crux 3: The "Villain's Promise"
  **The Case:** Two thieves promise each other to split the proceeds of a robbery equally. The convention of promising exists in their sub-culture.

  *   **Humean Prediction:** If the sub-culture convention is robust, there is a *conventional* obligation, but it is overridden by the moral impermissibility of the act. The "binding" nature is contingent on the utility of the sub-practice.
  *   **Powers Prediction:** The attempt to exercise the normative power fails because the content is impermissible (see Agreed Claim #3). No obligation is generated *at all*, not even a pro tanto one that gets overridden. The power is limited by moral boundaries.

  ## IV. Flagged Verbal Disagreements
  *We suspect the following disagreements may be partly verbal, stemming from different definitions of key terms rather than substantive moral differences.*

  1.  **"Artificial" vs. "Natural":**
      *   *Suspicion:* The Humean uses "artificial" to mean "requires social learning/convention." The Powers theorist uses "natural" to mean "grounded in innate human agency."
      *   *Resolution Path:* We likely agree that promising requires social learning (convention) to *trigger*, but disagree on whether the *capacity* to be bound is a social invention or a feature of rational agency.

  2.  **"Obligation" vs. "Sentiment":**
      *   *Suspicion:* When the Humean says "obligation," they often refer to the *psychological pressure* or sentiment of approbation. When the Powers theorist says "obligation," they refer to a *normative reason* that exists even if the agent feels no pressure.
      *   *Resolution Path:* We need to distinguish between **feeling bound** (psychology) and **being bound** (normativity). The Humean may be reducing the latter to the former, while the Powers theorist insists they come apart.

  3.  **"Practice":**
      *   *Suspicion:* The Humean views the practice as a **system of coordination** (like driving on the left). The Powers theorist views the practice as a **mechanism of invocation** (like a legal code that allows you to file a motion).
      *   *Resolution Path:* We agree the practice is necessary for the *act* to be intelligible. We disagree on whether the practice *constitutes* the obligation (Hume) or merely *facilitates* the exercise of the power (Powers).

  ***

