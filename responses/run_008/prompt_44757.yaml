      *   *Claim:* "Mutual advantage is a feature."
      *   *Powers Check:* Yes, they agree it's *a* feature, just not the *ground*.

  9.  **Final Polish:** Ensure the "Disagreements Table" uses wording neither side would reject as a caricature. Ensure the "Cruxes" have distinct predictions.

      *(Self-Correction on the "Dying Man" case)*: A Humean might argue that the *general* practice supports the dying man case, even if *this specific instance* doesn't uphold the practice. I need to make sure the Humean prediction reflects that nuance (obligation is derivative/indirect) vs the Powers view (obligation is direct).

      *(Self-Correction on Bootstrapping)*: The Powers view needs to explain why "I promise to nap" doesn't work. Usually, they say normative powers are limited to *interpersonal* constraints. The Humean says it doesn't work because there's no *social practice* of self-promising. The distinction is subtle. I will frame it around "Unilateral vs. Interpersonal."

