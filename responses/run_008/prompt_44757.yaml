  8.  **Self-Correction on "Agreed Claims":**
      *   *Claim:* "A promise binds even if breach is unnoticed."
      *   *Humean Check:* A strict Humean might say the *obligation* is the sentiment. If I don't feel it, is it there? A sophisticated Humean (like Rawls' practice conception) says the obligation exists relative to the practice rules. Okay, I can phrase it as "Both agree breach is defective even without detection."
      *   *Claim:* "Practice is historically conventional."
