answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Metaphysics and Ethics of Personal Identity (*Anattā* vs. Neo-Lockeanism)
  **Participants:** Proponent of Buddhist No-Self (*Anattā*); Proponent of Secular Neo-Lockeanism
  **Mediator:** Department of Philosophy, PhD Candidate

  ## I. Agreed Claims

  After a series of structured dialogues, the undersigned participants affirm the following points of consensus:

  1.  **Rejection of the Cartesian Ego:** Both parties agree that the Cartesian conception of the self—as a simple, immaterial, unchanging substance distinct from physical and psychological processes—is untenable. There is no "ghost in the machine" that survives the cessation of brain function or psychological continuity.
  2.  **The Explanatory Scope of Psychological Connectedness:** Both parties agree that psychological connectedness (memory, intention, character similarity) successfully explains the *patterns* of prudential concern, moral responsibility, and memory attribution. We disagree only on whether these patterns constitute the persistence of a *person* or merely describe the causal flow of *aggregates*.
  3.  **The Lesson of Fission:** Both parties agree that fission cases (e.g., brain bisection or teletransportation mishaps) establish that strict numerical identity is not what matters in survival. We agree that one can survive without maintaining a one-to-one identity relation, and that prudential concern is rational even where identity is ambiguous or absent.
  4.  **Conventionality of Language:** Both parties agree that everyday discourse regarding "persons" is functionally necessary for social coordination, legal accountability, and ethical life, regardless of the ultimate metaphysical status of the referent "person."

  ## II. Residual Disagreements, Cruxes, and Adjudicating Cases

  The following table outlines the remaining substantive disagreements. Each position is phrased in the terminology preferred by the holder of that view to ensure charitable accuracy. For each crux, we have identified a concrete case bearing on the dispute and recorded each side's prediction regarding how that case illuminates the truth.

  | Crux / Point of Contention | Neo-Lockean Formulation | Buddhist (*Anattā*) Formulation | Adjudicating Case & Recorded Predictions |
  | :--- | :--- | :--- | :--- |
  | **1. The Ontological Status of "Person"**<br>*(Is the dispute metaphysical or merely verbal?)* | **Persons are real, constituted entities.**<br>While not substances, persons are genuine entities that persist over time. Psychological continuity provides the truth conditions for statements about personal identity. To say "I persist" is to state a fact about the world, not merely a useful fiction. | **Persons are nominal designations (*prajñapti*).**<br>There is no entity, constituted or otherwise, that persists. There are only causally connected aggregates (*skandhas*). To say "I persist" is a convenient shorthand for causal continuity, but strictly speaking, there is no "I" to persist. | **Case: Gradual Replacement (Ship of Theseus applied to Mind).**<br>Suppose every psychological trait and physical constituent of a person is replaced one by one over ten years.<br><br>**Lockean Prediction:** There is a fact of the matter (even if vague) regarding whether the continuity threshold was breached to maintain identity.<br>**Buddhist Prediction:** There is *no* fact of the matter. The question presupposes an entity that is being replaced. Only the causal stream exists; the "identity" is imposed by the observer. |
  | **2. The Nature of the No-Self Claim**<br>*(Does the view collapse into ethics?)* | **The claim is primarily metaphysical.**<br>The Buddhist argues that persons do not exist. If they merely meant "we should not be selfish," that would be an ethical claim compatible with Lockeanism. We disagree because they deny the *truth* of persistence, not just the *value* of caring about it. | **The claim is soteriological and metaphysical.**<br>The metaphysical finding (no self findable under analysis) is inseparable from the ethical result (cessation of suffering). It is not merely that self-concern is "misplaced"; it is that the *object* of that concern is a cognitive error. | **Case: Pre-Fission Obligations.**<br>An agent incurs a debt, then undergoes fission. Two successors emerge with equal psychological continuity to the debtor.<br><br>**Lockean Prediction:** Both successors bear the obligation because the *person* (constituted by continuity) is present in both. The obligation tracks the criterion.<br>**Buddhist Prediction:** The obligation attaches to the causal stream, but assigning it to a "person" is a conventional tool to prevent suffering. If one successor feels unique burden, that is the error. The metaphysical truth is that no single bearer exists. |
  | **3. The Meaning of "Criterion"**<br>*(Is a further fact smuggled in?)* | **"Criterion" denotes truth conditions.**<br>When we speak of a criterion of identity, we mean the set of conditions under which statements about persons are true. This does not imply a "further fact" beyond physical/psychological facts, only that those facts *constitute* the person. | **"Criterion" implies a referent.**<br>The use of the word "criterion" suggests there is a *thing* being identified. We suspect the Lockean posits a "further fact" because they treat the constitution relation as creating an ontological unity that analysis cannot find. | **Case: Teletransportation (Destruction vs. Non-Destruction).**<br>A scanner copies the mind to Mars and destroys the Earth body. A second version copies the mind but *fails* to destroy the Earth body.<br><br>**Lockean Prediction:** In the first case, I survive. In the second, I do not (due to branching). The criterion (non-branching continuity) determines the fact of survival.<br>**Buddhist Prediction:** In both cases, the Earth-stream ends and the Mars-stream begins. "Survival" is a conventional label. The anxiety about which is "me" proves the clinging the thesis seeks to undo. |

  ## III. Note on Verbal Dispute

  Regarding the disagreement over the term **"Criterion"** (Crux 3), the collaborators conclude that a portion of the dispute is **merely verbal**.

  *   **Why:** The Neo-Lockean uses "criterion" to mean "the set of impersonal facts that make personal statements true" (a deflationary use). The Buddhist interprets "criterion" as "the method for locating an ontological subject" (a realist use).
  *   **Resolution:** We agree that if "person" is defined as "a causally connected psychological stream," we agree on the facts. We disagree only on whether the label "person" warrants the grammatical treatment of a singular noun implying ontological unity. The Lockean accepts the grammatical utility as reflecting a constituted reality; the Buddhist accepts the grammatical utility as a purely conventional fiction (*samvrti-satya*).

  ***

