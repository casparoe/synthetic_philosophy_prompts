answer: |-
  Your diagnosis is sharp, and you are correct that the stalemate persists because the participants are talking past one another on different registers. You have correctly identified the **Conceptual** (is the line coherent?) versus **Normative** (does the line matter for policy?) split. However, I think you are missing a third, deeper layer that explains why the medics "shrug" at the counterexamples rather than conceding the conceptual point.

  The impasse isn't just about whether the line is draw-able or load-bearing. It is about **what kind of thing medicine is** (ontology of the practice) and **what kind of beings we are** (anthropological assumptions).

  Here is a breakdown of the structural impasse, followed by what progress might actually look like.

  ### 1. The Three-Layer Disagreement

  You identified two layers. I propose there are three, and the third is where the conversation actually dies.

  **Layer 1: The Conceptual (The Critics' Battleground)**
  *   **The Argument:** The distinction is biologically and statistically incoherent. (As you noted: vaccines, glasses, modafinil).
  *   **The Goal:** To dissolve the binary.
  *   **Why it fails:** The medics don't actually care about biological coherence. They are not making a claim about *nature*; they are making a claim about *social practices*. When you bring up vaccines, the medic hears, "Your definition of disease is fuzzy." They hear, "Your definition of the *practice* is fuzzy." They can concede the biology is messy while maintaining the professional boundary is necessary.

  **Layer 2: The Teleological (The Medics' Battleground)**
  *   **The Argument:** Medicine has an internal *telos* (healing/alleviating suffering). If you detach intervention from pathology, you change the moral relationship between doctor and patient. The doctor becomes a vendor; the patient becomes a consumer.
  *   **The Goal:** To preserve the moral integrity of the profession.
  *   **Why it fails:** The critics hear this as an appeal to tradition or "yuck factor" conservatism. They argue that the *telos* of medicine is not discoverable but chosen, and if patients choose enhancement, the *telos* should evolve to serve autonomy and well-being.
  *   **The Hidden Conflict:** This is a disagreement about **Naturalism vs. Normativism**. The medics are often implicitly relying on a Naturalist account (like Boorse's Biostatistical Theory): health is a value-neutral statistical normality. The critics are relying on a Normativist account (like Daniels' Fair Equality of Opportunity): health is whatever is needed to function in society. The medics fear that if health is purely normative, there is no limit to what medicine must provide.

  **Layer 3: The Anthropological (The Unspoken Battleground)**
  *   **The Argument:** This is the "engineers of persons" gesture you mentioned. This is the Michael Sandel / Jürgen Habermas layer.
  *   **The Core Disagreement:** Is human nature something we *discover and respect*, or something we *design and master*?
  *   **The Medics' Fear:** It's not just about resource allocation. It's that enhancement represents a shift from *healing the given* to *mastering the given*. This threatens the virtue of humility and changes the parent-child or doctor-patient relationship from one of acceptance to one of design.
  *   **The Critics' Rebuttal:** We have always mastered nature (antibiotics, surgery). Enhancement is just more of the same. To stop now is arbitrary.
  *   **Why this causes stalemate:** This is a quasi-religious disagreement about the human condition. It cannot be solved by counterexamples about growth hormone.

  ### 2. The Hidden Empirical/Political Assumption

  You asked if there is a hidden empirical assumption. Yes. It is about **Resource Scarcity and Social Coercion.**

  *   **The Medics' Empirical Claim:** If we legitimize enhancement, it will cannibalize therapy. Insurance pools are finite. If we cover height extension, we will eventually have to cut coverage for leukemia. Furthermore, if enhancement becomes available, it will become *expected*, turning a liberty into a burden (the "arms race" dynamic).
  *   **The Critics' Empirical Claim:** Regulation creates black markets and inequality. Banning enhancement doesn't stop it; it just ensures only the rich get it safely. Therefore, the ethical imperative is to regulate for safety and access, not to ban based on category.

  The medics are arguing from a perspective of **Institutional Integrity** (protecting the system of care). The critics are arguing from a perspective of **Individual Justice** (protecting the rights of the agent). These are incommensurate priorities unless you decide which one trumps the other.

  ### 3. What Counts as Progress?

  If the impasse is structural, searching for a "better concept" of therapy/enhancement is a fool's errand. The concept is essentially contested. Here are three viable paths for your reading group to actually move forward:

  **A. Normative Decoupling (The Daniels Move)**
  Admit that the therapy/enhancement distinction is conceptually useless, but argue that **justice** still requires a line. Norman Daniels argued we should fund treatments that protect "normal species functioning" because that protects "fair equality of opportunity."
  *   *Progress:* Stop asking "Is this therapy?" Start asking "Does society owe this to everyone to ensure they can compete for social goods?"
  *   *Result:* You might still fund growth hormone for the deficient kid (opportunity) but not the short healthy teen (preference), but you've grounded it in *justice*, not *biology*.

  **B. Contextual Regulation (The FDA/Safety Move)**
  Abandon the therapy/enhancement binary for policy. Instead, regulate based on **Risk, Coercion, and Access.**
  *   *Progress:* Ask: Is the intervention safe? Is the patient being coerced (by employers, peers)? Is it available only to the wealthy?
  *   *Result:* Modafinil might be permissible for night-shift workers (safety/employment need) but restricted for students (coercion/arms race). This bypasses the "is it normal function" debate entirely.

  **C. Acknowledging the Tragedy (The Political Settlement)**
  Admit that there is no philosophical solution, only a political one. The line *must* be drawn arbitrarily to maintain the insurance model, and the debate is actually about **who draws the line.**
  *   *Progress:* Shift the discussion from bioethics to health policy. Who gets to decide? Insurance actuaries? Ethics boards? The market?
  *   *Result:* You stop trying to convince the medics that their definition is wrong. You acknowledge their definition is a **focal point for coordination** required to keep the healthcare system solvent, even if it's philosophically leaky.

  ### Recommendation for the Group

  Your group is stuck because you are treating this as a puzzle to be solved rather than a tension to be managed.

  I suggest you explicitly **declare the conceptual debate dead.** Agree that there is no non-arbitrary biological line. Then, force the group to argue *only* on the normative grounds:
  1.  **If** we know the line is fuzzy, **why** do we need it? (Is it for cost control? Professional identity?)
  2.  **If** we can't use "therapy" as the criterion, **what** criterion prevents the "arms race" the medics fear without creating the "black market" the critics fear?

  The progress you are looking for isn't a better definition. It's the realization that "Therapy vs. Enhancement" is a proxy war for "Solidarity vs. Liberty." Once you name that, you can stop trading counterexamples and start arguing about the kind of society you want to live in. That is a debate that can actually conclude, or at least reach a vote.
