  Okay, I've analyzed your friend's scorecard. She's actually being surprisingly consistent, but she's hiding a very specific (and kinda strict) definition of intelligence. Here's the breakdown of her logic, how she'll handle your new cases, and the one question that will actually corner her.

  ### 1. Decoding Her Rule
  Based on her list, she isn't using just one rule, but a "three-lock" system. To count as intelligent, a thing seems to need all three of these:

  1.  **Biological Agency:** It has to be alive (Crow, Dog, Toddler = Yes. Machine/Code = No).
  2.  **Novel Problem Solving:** It can't be pre-programmed or instinct (Spider, Chess Engine = No). It has to figure something out *in the moment*.
  3.  **Causal Understanding:** It can't just be association (Cat hearing can opener = No). It has to understand *how* things work mechanically (Dog paw on handle, Crow bending wire).

  Basically, her rule is: **"A living thing that understands cause-and-effect to solve a new physical problem."**

  ### 2. Predicting Her Reactions
  Here's how she'll likely handle your three new cases based on that "three-lock" system:

  *   **(1) The Chatbot:** She will say **Not Intelligent.**
      *   *Why:* It fails the "Biological" lock (it's code) and the "Understanding" lock (she already said Chess engines don't "*get*" anything; she'll view this as fancy autocomplete).
  *   **(2) The Slime Mold:** She will say **Not Intelligent.**
      *   *Why:* It passes "Biological," but she'll likely classify it as "chemical instinct" (like the spider). It doesn't have a brain to "understand" the maze; it just grows where the food is.
  *   **(3) The Self-Driving Car:** She will say **Not Intelligent.**
      *   *Why:* It passes "Novel Problem Solving" and "Physical," but fails the "Biological" lock. She'll call it "sensors and algorithms," just like the chess engine.

  ### 3. Which of Your Cases Forces a Choice?
  Out of your three, the **Self-Driving Car** is the best weapon.

  Here's why: The Chatbot is too easy for her to dismiss (it's just text). The Slime Mold is too easy to dismiss (it's just goo). But the **Car** behaves exactly like her "Yes" examples (the Crow and the Dog). It navigates a physical world, avoids obstacles, and adapts to new traffic patterns.

  *   **If she says "No":** She admits her rule is basically "Biology = Intelligence." You can then ask her if a human in a coma is intelligent.
  *   **If she says "Yes":** She breaks her own rule about machines (Chess Engine/Calculator).

  It forces her to decide if the *behavior* matters more than the *hardware*.

  ### 4. The Better "Killer" Case
  If you really want to settle this, don't use a machine or a mold. Use a human who isn't "thinking."

  **Throw this at her:**
  > "What about a **sleepwalker**? They are biological. They navigate complex physical environments (down stairs, around furniture). They solve novel problems (opening a door to get back to bed). But they have zero conscious understanding or memory of it."

  **Why this wins:**
  *   **If she says "Intelligent":** She admits "understanding" doesn't matter, which undermines her argument against the Chess Engine (which also performs without understanding).
  *   **If she says "Not Intelligent":** She admits that being alive and solving physical problems *isn't enough*, which undermines her argument for the Crow and the Dog (who she assumes are 'awake' but can't prove are 'understanding' anything more than the sleepwalker).

  It isolates the "Internal Understanding" variable she cares about and makes it impossible to measure, which is usually where these definitions fall apart. Good luck at lunch.
