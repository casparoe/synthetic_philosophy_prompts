answer: |-
  **Project Title:** Dynamic Consistency and the Value of Information for Imprecise Credences

  **Research Question**
  In sequential decision problems where imprecise credences undergo dilation, which decision rule—E-admissibility, Maximality, or $\Gamma$-maximin—preserves dynamic consistency without relying on ad hoc resolute choice commitments?

  **Project Summary and Rationale**
  The debate between precise and imprecise probabilism has largely stagnated around static choice problems. Defenders of precise credences argue that Ellsberg-style preferences and admissions of ignorance ("my credence is between 1% and 50%") can be accommodated by precise probabilities coupled with specific risk attitudes or secondary lexicographic objectives. Conversely, defenders of imprecise credences (following the Levi tradition) argue that representing ignorance as a sharp number is epistemically dishonest. However, because static cases are underdetermined—both sides can model the same choice behavior—the live question is not whether to maximize expected utility, but whether the inputs to that maximization are single numbers or sets of functions.

  This project shifts the battleground from static coherence to dynamic consistency. When an agent with imprecise credences conditions on new evidence, their credal set may *dilate*: the posterior interval becomes wider than the prior, even when the evidence appears relevant. In sequential settings, dilation creates a divergence among the three leading decision rules for imprecise probabilities. E-admissibility, Maximality, and $\Gamma$-maximin offer conflicting advice on whether an agent should pay for information or act immediately.

  Existing literature leaves this question open. The dilation literature (e.g., Seidenfeld et al.) demonstrates the phenomenon formally but does not normatively rank the decision rules. Accuracy-based defenses of precision argue that imprecise updating is inherently flawed but often assume that dynamic consistency requires precise inputs. The Levi tradition acknowledges the tension but has not definitively settled which rule best preserves the agent's ability to justify present action by future payoffs without resorting to "resolute choice"—the commitment to bind one's future self to a plan even when future preferences diverge. If a decision rule requires resolute choice to avoid inconsistency, it effectively abandons the consequentialist project of justifying actions by their outcomes. This project posits that the correct decision rule is the one that allows an imprecise agent to remain dynamically consistent through natural updating alone.

  **Methodology and Work Plan**
  The research will proceed over nine months, utilizing formal decision-theoretic modeling to construct sequential choice problems where the three rules diverge.

  *Months 1–3: Formalization and Model Construction*
  I will construct a class of sequential decision trees involving a binary state of the world and an option to purchase a signal before acting. The signal will be designed to trigger dilation (e.g., a scenario where the likelihood ratio is itself imprecise). I will formalize the update rule (standard conditionalization on sets of probabilities) and define the choice functions for E-admissibility (choose options maximal for at least one prior in the set), Maximality (choose options not strictly dominated by any other), and $\Gamma$-maximin (choose the option with the highest minimum expected utility).

  *Months 4–6: Identifying Divergence and Inconsistency*
  I will solve the decision trees via backward induction for each rule. The core analysis will identify nodes where the rules disagree on the value of information. For example, $\Gamma$-maximin may recommend refusing free information because the worst-case expectation of knowing is lower than the worst-case expectation of acting in ignorance. E-admissibility might permit taking the information but fail to dictate a unique subsequent action.
  *Criterion for Inconsistency:* A rule yields dynamic inconsistency if, at time $t_1$, it recommends a plan (e.g., "gather information, then act if signal X"), but at time $t_2$ (after gathering information and updating via dilation), the rule recommends abandoning that plan, absent any new external constraints. I will test whether this inconsistency can be resolved without invoking resolute choice.

  *Months 7–9: Evaluation and Drafting*
  I will evaluate the rules based on their performance against the consistency criterion. If one rule maintains consistency where others fail, I will argue for its normative primacy. If all fail, I will analyze whether this constitutes a reductio of imprecise probabilism in sequential contexts. I will draft the dissertation chapter and a companion article for submission.

  **Possible Conclusions**
  1.  **Rule Selection:** One rule (likely E-admissibility or a refined version of Maximality) preserves dynamic consistency naturally, providing a decisive argument for its adoption in imprecise decision theory.
  2.  **The Resolute Choice Necessity:** All rules require resolute choice to maintain consistency in dilation scenarios. This would suggest that imprecise agents cannot be standard consequentialists and must adopt a volitional theory of rationality.
  3.  **The Precision Collapse:** The divergence among rules in sequential cases can be fully redescribed as disagreement about risk attitudes within a precise framework. This would count as a failure of the imprecise project, suggesting that "imprecision" is merely a notational variant of precise risk-weighted utility.

  **Statement of Potential Failure**
  This project faces two primary risks. First, formal intractability: the computational complexity of solving sequential trees with set-valued probabilities may exceed the scope of a nine-month fellowship, particularly if the dilation effects require complex state spaces to manifest robustly. Second, the "reduction risk": it may turn out that the behavioral divergence between the imprecise rules and precise expected utility maximization is indistinguishable from the behavior of a precise agent with high risk aversion. If the sequential divergence can be fully modeled by a precise risk-weighted utility function without loss of explanatory power, the argument for imprecise credences as a distinct structural feature of rationality would fail. I will treat this negative result as a substantive philosophical finding, but it would preclude the intended defense of imprecise decision rules.

  **Applied Significance**
  While this inquiry is formal, it governs high-stakes resource allocation where probabilities are inherently elusive. Consider a funder estimating the probability of a global catastrophe (e.g., engineered pandemic). Their honest credence is not 0.5% or 5%, but an interval $[0.1\%, 10\%]$. They face a sequential choice: fund a mitigation intervention now, or fund research to narrow the uncertainty before acting.
  If the funder employs $\Gamma$-maximin, dilation might dictate that research has negative value (the "worst-case" of knowing is paralysis), leading to immediate, potentially misallocated spending. If they employ E-admissibility, they might fund research but lack a rule for the subsequent decision, leading to policy drift. The choice of decision rule determines whether the funder treats uncertainty as a call to arms or a call to study. Resolving which rule preserves dynamic consistency ensures that long-term existential risk strategies are not undermined by the internal logic of the uncertainty models used to justify them. This moves the debate from semantic precision to the structural integrity of long-term planning under ignorance.
