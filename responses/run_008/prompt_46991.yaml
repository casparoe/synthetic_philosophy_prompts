answer: |-
  In the Veronese signory of 1385, the Lord, holding plenary power granted by the imperial vicariate, summons a merchant to the ducal chamber and, in a sudden fury, draws a dagger to strike him for an imagined slight; the merchant, trapped with no exit, grapples for the weapon and shoves the Lord backward, causing him to strike his head on a marble hearth and die instantly. Meanwhile, the Lord's senior councilors, aware that his erratic violence threatens the city's stability but lacking any mandate from the populace or a superior emperor to depose him, meet in secret to administer a slow poison that would look like natural causes, intending his removal solely to preserve the commonwealth without triggering a succession war.

  **Analysis of Doctrinal Deliverables**
  Applying *Summa Theologiae* II-II, q. 64, a. 3, intentional killing for the common good functions as an act of justice, which requires legitimate public authority; applying q. 64, a. 7, a private individual may use force in self-defense, provided the attacker's death is not intended but is a side effect of preserving one's own life. *De Regno* adds that while tyranny should be remedied, private presumption in tyrannicide is dangerous and the right of appointment and removal belongs primarily to the multitude or a superior authority, not to subordinates. In this scenario, the merchant's act falls under q. 64, a. 7: he intends only to stop the blow, making the death unintended and licit despite his private status. The councilors' act, however, falls under q. 64, a. 3: they intend the death as a remedy for the state. Because they are appointees of the *Signore* rather than representatives of the multitude or agents of a superior (like the Emperor), they lack the jurisdiction to execute judgment on the very source of their authority; thus, *De Regno* classifies their plot not as public justice but as dangerous private conspiracy, rendering it illicit.

  **The Working Feature and Removal Test**
  The reversal is generated by the distinction between *jurisdictional standing* and *immediate necessity*, rather than the bare label of public or private. The officials are "public" in function but lack *superior* jurisdiction over the tyrant, while the citizen is "private" but possesses the *necessity* of self-defense where intention is shifted away from killing. If this feature is removed—for instance, if the councilors were elected directly by the populace with the authority to depose the Lord—their act would shift from illicit conspiracy to licit public judgment. Conversely, if the merchant intended the Lord's death rather than merely repelling the strike, his act would become illicit private execution, aligning with the standard hierarchy.

  **Thomist Defense Against the Charge of Rigging**
  A Thomist would reject the charge that this case is rigged by arguing that it does not manipulate definitions but rather isolates the specific moral variables Aquinas treats as decisive: the object of the act (defense vs. execution) and the source of authority (self-preservation vs. delegated jurisdiction). The charge of rigging assumes that "public office" automatically confers the right to kill a superior, but Aquinas's framework in q. 64, a. 3 ties that right to the *order of justice*, not merely to holding a title. Since the officials derive their authority *from* the tyrant, they cannot act as judges *over* him without violating the order of justice they are sworn to uphold. Therefore, the verdict is not an engineered exception but a rigorous consequence of the principle that authority is limited by its source and that intention determines the moral species of the act.
