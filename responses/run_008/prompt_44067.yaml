      *   *Nuance:* Yes, Diamond works at the continental/millennial scale where institutions are variables, not constants. Famine scholars work at the regional/decadal scale where institutions are the mechanism.
      *   *Counter-point:* Sometimes the scales *do* collide. If a volcano erupts (macro) and causes a specific revolution (micro), the explanation needs to bridge the gap. The "scale mismatch" often hides a *mechanism* gap. How does rain become a riot? If the environmentalist can't trace the mechanism, it *is* determinism. If the social historian ignores the trigger, it's idealism.
      *   *Refinement:* It's not just scale; it's *causal weight*. How much of the variance is explained by $X$ vs. $Y$?

