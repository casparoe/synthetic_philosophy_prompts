prompt: |-
  Hi! I write a column on science and ideas for a general readership, and I'm working on a longread about how social media has basically weaponised the thing Adam Smith was describing in the Theory of Moral Sentiments. As I understand it, Smith thinks we judge ourselves by imagining how a well-informed spectator would view our conduct — and that this spectator starts out as a kind of blend of the actual people around us, but gets idealised over the course of the book until it's close to a stand-in for conscience. Crucially he also distinguishes wanting praise from wanting to deserve praise. Meanwhile internet researchers have this notion of the "imagined audience" — the vague sense of everyone who might see a post, which no one can actually picture, but which shapes what we say and how we behave anyway. Somewhere in the book Smith also describes a vain man acting as though the eyes of the whole world were fixed on him, which is obviously catnip for my column.

  So: could you compare the impartial spectator with the imagined audience as two pieces of moral machinery? Where do they genuinely converge — is the imagined audience just a corrupted or degraded impartial spectator, a mob-average instead of an idealised one? And where does the analogy fall apart? I'm especially interested in the asymmetry: Smith's spectator is supposed to sympathise with us, and we're supposed to be able to step into its shoes, whereas your imagined followers don't know you and you can't really simulate them. Also whether getting likes can ever satisfy the desire to be praiseworthy, or only the desire for praise. And is there any sense in which the imagined audience demands self-command, the way Smith's spectator supposedly does?

  Keep it fairly meaty but not academic, definately no reading lists or citations — I've got sources sorted. And please write in British English, since I'll be lifting some phrasing for the column (with credit to you, ha). Sorry for any typos, writing this on a train.
