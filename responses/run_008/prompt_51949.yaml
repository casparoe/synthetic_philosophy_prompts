answer: |-
  Here is a decision procedure designed for your constraints. It is built to be run by a program associate in 45–60 minutes, requires no statistics, and forces a distinction between *metric validity* and *verification cost*.

  I call this the **Proxy Stress Test (PST)**.

  ***

  ## The Proxy Stress Test (PST)

  **Timebox:** 45 Minutes
  **Operator:** Program Associate (with Program Officer review for "Yellow" results)
  **Inputs:** Proposal document, historical data (if available), 30-minute brainstorming session.

  ### Part 1: The Five Questions
  *Answer these in writing. If you cannot answer a question, the indicator fails automatically.*

  **1. The Causal Link (The "Why")**
  *   **Question:** What is the specific real-world outcome we care about? How many steps of causality separate the metric from that outcome?
  *   **Test:** Draw an arrow from Metric → Outcome. Are there intermediate conditions required (e.g., rain, policy enforcement, behavior change) that the metric does not capture?
  *   **Flag:** If there are more than two intermediate steps, or if the link relies on "normal conditions" holding true, mark **HIGH RISK**.

  **2. The Agent's Levers (The "How")**
  *   **Question:** Who reports the data? What is the cheapest, easiest way for them to move this number up without changing the underlying reality?
  *   **Test:** List three ways to increase the metric by 20% *without* improving the outcome. Rank them by cost/effort.
  *   **Flag:** If the cheapest method costs less than 10% of the effort required to actually achieve the outcome, mark **HIGH RISK**.

  **3. The Extremes Test (The "Break Point")**
  *   **Question:** If the partner doubles this metric next year, does the outcome double, or does it break?
  *   **Test:** Look at historical data. Has this metric ever been pushed this high before? If we force this number to the theoretical maximum, does quality collapse?
  *   **Flag:** If doubling the metric likely degrades the outcome (e.g., planting too fast = high mortality), mark **HIGH RISK**.

  **4. The Sabotage Test (The "Goodhart")**
  *   **Question:** Can the partner raise this number while making the underlying outcome *worse*?
  *   **Test:** Imagine a malicious actor. Can they hit the target and actively harm the goal? (e.g., Patrolling an empty zone to hit "days at sea" while poachers hit the protected zone).
  *   **Flag:** If the answer is Yes, this is a **FIRM NO**. Do not proceed.

  **5. The Verification Cost (The "Truth")**
  *   **Question:** How much does it cost us (or a third party) to verify this number independently?
  *   **Test:** Categorize verification:
      *   *Type A (Cheap):* Remote sensing, public records, random phone calls.
      *   *Type B (Expensive):* Site visits, third-party audits, lab testing.
      *   *Type C (Impossible):* Relies entirely on partner self-reporting with no paper trail.
  *   **Flag:** If Type C, mark **FIRM NO**. If Type B, you must budget for verification. If Type A, proceed.

  ### Part 2: The Decision Matrix

  | Result | Action | Responsibility |
  | :--- | :--- | :--- |
  | **Any "FIRM NO" in Q4 or Q5** | **Reject Indicator.** Do not fund based on this metric. | **Procedure** (Non-negotiable) |
  | **2+ "HIGH RISK" Flags** | **Yellow Light.** Indicator allowed *only* if paired with a Type A/B verification plan and a cap on incentive payments tied to it. | **Judgment Call** (PO must sign off on mitigation) |
  | **0-1 "HIGH RISK" Flags** | **Green Light.** Indicator approved. | **Procedure** |

  ***

  ## Running the Procedure: Three Cases

  Here is the PST applied to your three scenarios.

  ### Case 1: Reforestation ("Trees surviving at year three")
  *Verification: Partner staff, GPS-tagged photos.*

  1.  **Causal Link:** Metric (Surviving Trees) → Outcome (Carbon Sequestration/Biodiversity). Link is tight. **Pass.**
  2.  **Agent's Levers:** To increase surviving trees, they must protect them. *However*, to *report* surviving trees, they can simply photograph the same trees twice, or photograph trees in easy-to-reach areas and ignore remote plots. **HIGH RISK.**
  3.  **Extremes Test:** If they double surviving trees, does carbon double? Roughly, yes. **Pass.**
  4.  **Sabotage Test:** Can they increase reported survival while outcome worsens? Yes, by cherry-picking only the healthiest plots for reporting and abandoning the rest. **HIGH RISK.**
  5.  **Verification Cost:** Partner staff taking photos is **Type C (Impossible to verify independently)**. GPS tags can be spoofed or photos taken at the wrong time. **FIRM NO.**

  **PST Verdict:** **FIRM NO.**
  **Reason:** The metric itself is sound, but the *verification method* fails Q5. You cannot accept self-reported survival data without independent sampling.
  **Mitigation:** Renewal contingent on shifting verification to Type B (random third-party plot audit) or Type A (satellite canopy analysis paired with ground truthing).

  ### Case 2: Hectares Under Improved Management
  *Verification: Partner cooperative selects enrolled households.*

  1.  **Causal Link:** Metric (Hectares Managed) → Outcome (Sustainable Yield). Link depends on *how* it is managed. **Pass.**
  2.  **Agent's Levers:** The partner selects the households. The cheapest way to hit the target is to select households that *already* practice improved management, or those with the easiest land. **HIGH RISK.**
  3.  **Extremes Test:** If they double enrolled hectares, do they dilute the support per household? Likely. **HIGH RISK.**
  4.  **Sabotage Test:** Can they increase hectares while outcome worsens? Yes. By enrolling marginal land that degrades quickly, or enrolling "friendly" households who don't actually change practices but report they do. **HIGH RISK.**
  5.  **Verification Cost:** Checking land management practices requires site visits (Type B). **Warning.**

  **PST Verdict:** **FIRM NO.**
  **Reason:** Fails Q2 and Q4. The "self-selection" clause is a structural vulnerability. It allows "cream-skimming" (selecting easy wins) which detaches the metric from the goal of *changing* behavior.
  **Mitigation:** You must define the enrollment criteria externally (e.g., "Random selection from applicant pool" or "Must meet X baseline deficiency"). If the partner controls the denominator, the metric is broken.

  ### Case 3: Internal Dashboard ("Share of grants with quantified outcome")
  *Verification: Internal grant database.*

  1.  **Causal Link:** Metric (% Quantified) → Outcome (Foundation Impact). **FIRM NO.**
      *   *Reasoning:* There is no causal link. A quantified bad metric does not create good impact. This metric measures *administrative compliance*, not *environmental change*.
  2.  **Agent's Levers:** Program Officers (you and your team). Cheapest way to move number? Force partners to quantify something trivial (e.g., "number of meetings") rather than something meaningful but hard to measure (e.g., "policy influence"). **HIGH RISK.**
  3.  **Extremes Test:** If 100% of grants have quantified outcomes, does impact maximize? No. It likely means complex, systemic work has been defunded in favor of simple, countable tasks. **HIGH RISK.**
  4.  **Sabotage Test:** Can you raise this number while impact worsens? **Yes.** This is the definition of the metric. It incentivizes you to reject good, unquantifiable projects in favor of bad, quantifiable ones. **FIRM NO.**
  5.  **Verification Cost:** Type A (Internal database check). **Pass.**

  **PST Verdict:** **FIRM NO.**
  **Reason:** This indicator fails Q1 (Causal Link) and Q4 (Sabotage). It is a "vanity metric" that actively incentivizes the proxy-gaming you are observing across your portfolio.

  ***

  ## Unwinding the Internal Metric

  The PST flags your internal dashboard metric as dangerous. Here is what the procedure can and cannot tell you about fixing it.

  **What the Procedure Tells You:**
  1.  **The Diagnosis is Objective:** You can show your boss that this metric fails the "Causal Link" and "Sabotage" tests. It is not a matter of opinion; structurally, it rewards gaming.
  2.  **The Mechanism of Harm:** It explains *why* your partners are gaming. You are signaling that "quantifiability" is valued higher than "truth." They are responding rationally to your incentive structure.
  3.  **The Replacement:** The procedure suggests replacing "Share of grants quantified" with "Share of grants with *verified* outcomes" (shifting weight to Q5) or a narrative-based assessment of strategic alignment.

  **What the Procedure Cannot Tell You:**
  1.  **Board Politics:** The PST cannot force your Board to accept ambiguity. They like this metric because it offers "legibility at a glance." The procedure identifies the risk, but it cannot manage the Board's desire for simplicity.
  2.  **The Transition Cost:** Moving away from this metric will make your portfolio look *less* legible in the short term. You will have to report "mixed methods" or "narrative progress," which takes more time to read. The PST identifies this as a necessary cost for validity, but it cannot pay that cost for you.

  **Recommendation for the Unwind:**
  Do not propose deleting the metric immediately. Propose a **Yellow Light mitigation**.
  *   *Action:* Keep the metric but cap its weight in internal performance reviews at 10%.
  *   *Add:* A counter-balancing metric: "Share of grants with *independent verification* of outcomes."
  *   *Narrative:* Tell your boss: "The PST shows that maximizing quantification is actively reducing our impact quality. We need to balance 'legibility' with 'truth.' This adjustment protects us from funding partners who are good at counting, rather than good at conserving."

  ### Summary for Your Boss
  When you present this, be explicit about the division of labor:
  *"For the partner indicators (Cases 1 & 2), the **Procedure** dictated the 'No.' I cannot sign off on them without independent verification or external enrollment criteria. For the internal dashboard (Case 3), the **Procedure** flagged a critical risk, but the decision to change it is a **Judgment Call** on how much ambiguity the Board will tolerate in exchange for real impact."*
