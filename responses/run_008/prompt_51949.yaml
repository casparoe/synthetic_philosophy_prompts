prompt: |-
  I'm a program officer at a mid-sized environmental foundation, and one of my jobs is signing off on the indicators our partners report against. Over the last few years I've watched the same pattern play out several times: we pick a measurable proxy for the thing we actually care about, partners optimize the proxy hard enough, and the proxy quietly detaches from the thing. A reforestation partner hit a "trees planted" target with seedlings nobody revisited, so mortality ate most of it within two years; a marine program hit its "patrol days at sea" quota by anchoring just outside the harbor; a community-education grant hit "workshops delivered" by holding the same workshop for the same twelve people five times. Each time it happened, my boss asked me why I hadn't flagged it, and each time I realized I'd been treating "is this metric gameable?" as a vibe rather than something I could actually reason through. I've read enough about Goodhart-style failures to know there are supposed to be distinct failure modes lurking here -- the proxy only correlating with the goal in the normal range, so pushing to the extremes breaks it; the act of selecting on the proxy adding noise that dominates the signal; partners actively gaming rather than merely drifting -- but I can't turn that reading into anything I can run on a Tuesday afternoon.

  What I want is a decision procedure I can actually apply to a proposed indicator in under an hour, without any formal statistics beyond what fits on a napkin. It should walk me through questions in order: what the metric is a proxy for and how tight that link is when nobody is being measured on it; who is being measured and what they can change cheaply; what happens if the indicator is pushed to extremes the historical data never covered; whether the partner could raise the number while making the underlying outcome worse; and what a spot-check or independent re-measurement would look like before we renew. It should say where the procedure terminates in a firm no (e.g., the indicator can be moved at near-zero cost in ways invisible to us), and where it has to hand the decision back to me as a judgment call, so I can tell my boss honestly which parts of my sign-off are procedure and which parts are me. Constraints: our program associates, not statisticians, will run this on most proposals; renewal decisions come twice a year; and any verification we impose costs our partners real money, so the procedure should distinguish between "cheap for us to check" and "expensive to verify but worth it."

  Then please run the procedure on three cases, including one where it gives an answer I won't like. First, a reforestation proposal reporting "trees surviving at year three," verified by the partner's own staff with GPS-tagged photos. Second, a "hectares under improved management" indicator where the partner cooperative selects which households count as enrolled, on the theory that self-selection filters for genuinely committed participants. Third -- the one I'm dreading -- our foundation's internal dashboard metric, "share of grants with a quantified outcome indicator," which our board loves because it makes the whole portfolio legible at a glance, and which I've been quietly crediting for the proliferation of the very proxy-gaming I'm trying to catch. If the procedure flags that last one, say so plainly, and tell me what the procedure can and cannot tell me about how to unwind it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Program Officer at a mid-sized environmental foundation.
      *   **Problem:** Goodhart's Law in action (metrics becoming targets cease to be good metrics). Partners game indicators (trees planted but die, patrol days faked, workshops repeated).
      *   **Need:** A practical, sub-1-hour decision procedure to evaluate proposed indicators *before* signing off.
      *   **Constraints:**
          *   Run by program associates (not statisticians).
          *   "Napkin math" level (no formal stats).
          *   Must distinguish between "Firm No," "Judgment Call," and "Verify Cost."
          *   Must be applied to three specific cases (Reforestation, Hectares/Management, Internal Dashboard).
          *   Must be honest about the internal dashboard metric (even if the answer is unpleasant).
      *   **Tone:** Professional, pragmatic, empathetic to the bureaucratic reality, rigorous but accessible.

  2.  **Deconstruct the "Decision Procedure":**
      *   The user explicitly outlined the steps they want:
          1.  Proxy vs. Goal (Link Tightness).
          2.  Agent & Levers (Who & What they can change cheaply).
          3.  Extreme Push (Historical bounds).
          4.  Negative Correlation (Can number go up while outcome goes down?).
          5.  Verification (Spot-check cost/feasibility).
      *   I need to formalize this into a checklist/worksheet format that feels actionable. Let's call it the "Proxy Stress Test" (PST).
      *   It needs termination conditions:
          *   *Red Light:* Stop, do not approve.
          *   *Yellow Light:* Judgment call, requires mitigation/verification plan.
          *   *Green Light:* Proceed (rare, but possible).
      *   It needs to account for verification costs (Cheap vs. Expensive).

  3.  **Drafting the Procedure (The "Proxy Stress Test"):**
      *   *Step 1: The Causal Link.* What is the real goal? How does the metric connect? Is it direct or distant?
      *   *Step 2: The Agent's Incentive.* Who reports? What is the path of least resistance to hit the number?
      *   *Step 3: The Extremes Test.* If they double this number, does the goal double? Or break?
      *   *Step 4: The Sabotage Test.* Can they raise the metric *and* harm the goal simultaneously? (Crucial for Goodhart).
      *   *Step 5: The Verification Cost.* How hard is it to lie? How hard is it for us to check?
      *   *Scoring:* Need a way to aggregate this. Maybe a simple "Stop/Go" logic based on specific failures.

  4.  **Developing the Three Cases:**

      *   **Case 1: Reforestation ("Trees surviving at year three", self-verified).**
          *   *Analysis:* Better than "trees planted," but self-verification is the weak link. GPS photos can be faked or cherry-picked.
          *   *Verdict:* Yellow/Red. The metric is good, the verification is bad.
          *   *Outcome:* Requires independent spot-check.

      *   **Case 2: Hectares under Improved Management (Partner selects households).**
          *   *Analysis:* "Self-selection filters for commitment" is a classic rationalization for cherry-picking. The partner controls the denominator/numerator boundary.
          *   *Verdict:* Red. High risk of cream-skimming. The link between "enrolled" and "managed" is weak if they choose the easiest ones.
          *   *Outcome:* Firm No unless selection criteria are externalized.

      *   **Case 3: Internal Dashboard ("Share of grants with quantified outcome").**
          *   *Analysis:* This is the meta-problem. The metric measures *reporting compliance*, not *impact*. It incentivizes staff to force partners into quantifying things that shouldn't be quantified just to hit the board metric.
          *   *Verdict:* Red (Hard Truth). This metric *is* the cause of the gaming.
          *   *Outcome:* The procedure flags it as dangerous. Unwinding requires admitting the metric is flawed to the Board.

  5.  **Refining the Output:**
      *   *Structure:*
          1.  Introduction (Acknowledging the pain point).
          2.  The Procedure (The "Proxy Stress Test" Worksheet).
          3.  Instructions on how to use it (Timebox, Roles).
          4.  The Three Case Studies (Applied rigorously).
          5.  Conclusion (On the internal metric).
      *   *Tone Check:* Ensure I don't sound like an academic. Sound like a senior colleague handing over a tool. Use terms like "path of least resistance," "cream-skimming," "legibility vs. reality."
      *   *Specific Constraint Check:* Did I distinguish between "cheap to check" and "expensive to verify"? Yes, in Step 5. Did I distinguish between "Procedure No" and "Judgment Call"? Yes, in the Decision Matrix.

  6.  **Self-Correction/Iterative Thought during Drafting:**
      *   *Initial thought:* Maybe add a scoring system (1-5).
      *   *Correction:* No, the user wants "napkin math." Scoring systems often become games themselves. Use binary "Pass/Fail/Warning" triggers instead.
      *   *Initial thought:* For the internal metric, suggest a replacement.
      *   *Correction:* The prompt asks what the procedure can/cannot tell me about *unwinding* it. I need to be careful not to solve the board politics, but clarify the diagnostic. The procedure says "This is dangerous," but it can't fire the Board. I need to make that distinction clear.
      *   *Refining Case 1:* "Trees surviving" is actually a decent metric *if* verified. The failure point is the *verification method* (partner's own staff). The procedure needs to catch that distinction.
      *   *Refining Case 2:* The "self-selection" argument is insidious. I need to make sure the procedure explicitly asks "Who defines the boundary?"
      *   *Refining Case 3:* This needs to be the punchline. The procedure must implicate the user's own system.

  7.  **Final Polish:**
      *   Ensure the "Decision Matrix" is clear.
      *   Make sure the "Unwinding" advice for Case 3 is practical (e.g., "narrative reporting" vs "quantified").
      *   Check word count and readability. (Keep it dense but scannable).

  8.  *(Final Review against constraints)*:
      *   Under an hour? Yes, it's a checklist.
      *   No formal stats? Yes.
      *   Three cases? Yes.
      *   Internal metric flagged? Yes.
      *   Distinguish procedure vs. judgment? Yes.

