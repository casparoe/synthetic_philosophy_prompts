          *   Line 6: *lendemain* (ɛ̃) -> Rhyme C
      *   It's three couplets. AABBCC structure.
      *   Tone: Sorrowful, simple, direct. Not flowery.
      *   Key word: *sens*. In French, *sens* = physical direction (North/South) AND abstract meaning (purpose).
      *   Line 5: *Un compas qui perd son sens tourne en vain*. A compass losing its *direction* spins. A life losing its *meaning* spins.
      *   Line 6: *sans lendemain*. Literally "without tomorrow," idiomatically "without a future."

