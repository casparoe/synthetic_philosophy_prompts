      *   *Specific Miss:* Neither has addressed the audience. The mourners likely don't speak French. They need to feel the weight, not analyze the pun.
      *   *Specific Miss:* The word *sens*. English "sense" works for "meaning" and "direction" (e.g., "make sense," "sense of direction"). Deborah was right to try "sense," Marek was wrong to abandon it for "meaning." But Deborah was wrong to force rhymes.
      *   *Specific Miss:* "Sans lendemain." Marek's "without tomorrow" is a bit literal. "No future" is clearer. Deborah's "unwound" is too metaphorical.

  6.  **Drafting the Response:**
      *   **Tone:** Empathetic, authoritative but kind, clear. Acknowledge the emotional weight (funeral on Friday).
      *   **Structure:**
