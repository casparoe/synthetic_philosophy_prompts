prompt: |-
  I'm clerking for an intermediate appellate judge, and she's asked me for a bench memo on a case I've privately started calling "the flood ordinance mess." Short version: during a major flood two years ago, the county council passed an emergency ordinance against "exploitative pricing of essential goods." It was enacted the day *after* the conduct it punished, never showed up on the countys website for six weeks (some clerk's error), the word "exploitative" was never defined except in an internal guidance memo that a cousin working in the clerk's office quietly forwarded to a couple of store owners (and only them), and enforcement was weirdly concentrated on shops that had backed the incumbent council's rival in the last election. Defendant got convicted under it and now argues the ordinance "never became law" at all — not that it's unconstitutional, but that it *isn't law* — so the conviction is void.

  The state's answer is basically pure pedigree: council followed its enactment procedure, executive signed it, ergo it's law, and any defects go to how it's applied or whether it survives due process, not to whether it exists in the first place. The judge wants me to take that side seriously — she thinks the separation of legal validity from legal merit is precisely what keeps judges from turning into a super-legislature — but she's also clearly tempted by the thought that a rule that's retroactive, secret, vague, and selectively enforced isn't just bad law, it's a failure to make law, and courts should be able to say so in those words.

  There's also a wrinkle one of the defense attorneys raised that the judge finds "cute but dangerous": that legal validity comes in degrees, so the ordinance might be law enough to support civil fines but not criminal penalties. She wants to know if that's a real distinction she could actually write into an opinion or if it's just vibes.

  Draft the bench memo she can act on: recommend a concrete disposition (affirm, reverse with dismissal ordered, remand for a narrowing construction, whatever you honestly think is best), and engage the strongest version of the state's pedigree argument, not a strawman of it. Lead with the bottom line in the first sentence and then give the reasoning — no preamble, and don't restate the facts back at me, she already knows them.
reasoning: |-
  Here's a thinking process that leads to the suggested bench memo:

  1.  **Analyze the Request:**
      *   **Role:** Law clerk for an intermediate appellate judge.
      *   **Task:** Draft a bench memo on "the flood ordinance mess."
      *   **Key Facts:** Emergency ordinance passed *after* conduct (retroactive), not published for 6 weeks (publication defect), "exploitative" undefined in text (vagueness/delegation), internal memo shared selectively (equal protection/selective enforcement), enforcement targeted political rivals.
      *   **Defendant's Argument:** The ordinance *never became law* (void ab initio), not just unconstitutional.
      *   **State's Argument:** Pedigree theory (enactment procedure followed = law). Defects go to application/constitutionality, not existence.
      *   **Judge's Philosophy:** Wants to respect separation of powers (pedigree argument) but tempted by the idea that extreme defects mean "no law was made."
      *   **Specific Wrinkle:** "Degrees of validity" (law enough for civil fines, not criminal). Judge calls it "cute but dangerous." Needs assessment on whether this is doctrinally sound.
      *   **Format:** Bench memo. Lead with the bottom line in the first sentence. No preamble. No restating facts. Engage the strongest version of the state's argument. Recommend a concrete disposition.
      *   **Tone:** Professional, legally rigorous, actionable for a judge.

  2.  **Determine the Legal Issues:**
      *   **Promulgation/Publication:** Did the failure to publish prevent the ordinance from taking effect? Most jurisdictions have statutes requiring publication for laws to be effective, especially criminal ones.
      *   **Ex Post Facto/Retroactivity:** Criminal laws generally cannot apply retroactively. If it applies to conduct before enactment, is it void as to that conduct?
      *   **Vagueness/Delegation:** "Exploitative" undefined in text, defined in secret memo. This touches on Due Process (notice) and Non-Delegation.
      *   **Selective Enforcement:** Equal Protection issue.
      *   **The "Not Law" vs. "Unconstitutional" Distinction:** This is the core philosophical/legal hurdle. Usually, a statute is presumed valid until struck down. However, if procedural prerequisites for *becoming* law aren't met, it might be void ab initio.
      *   **Graded Validity:** Can a norm be "law" for some purposes but not others? (Generally no, but there are nuances regarding civil vs. criminal standards).

  3.  **Evaluate the "Not Law" Argument (Defendant):**
      *   *Strength:* If publication is a condition precedent to legal effect, then no publication = no law. Retroactive criminal laws are often treated as void, not just unconstitutional.
      *   *Weakness:* Courts usually prefer to strike down laws as unconstitutional rather than declare they never existed, to preserve reliance interests and avoid chaos.

  4.  **Evaluate the "Pedigree" Argument (State):**
      *   *Strength:* Separation of powers. Courts shouldn't police the internal legislative process too closely once the enrolled bill is signed. Enrolled Bill Rule.
      *   *Weakness:* Ignores statutory requirements for publication and fundamental due process notice requirements that are jurisdictional to criminal liability.

  5.  **Evaluate the "Degrees of Validity" Wrinkle:**
      *   *Analysis:* This is generally doctrinally unsound. A law is either valid or it isn't. However, the *standard* for validity differs between civil and criminal contexts (e.g., vagueness doctrine is stricter in criminal cases). So, it's not that the law has "degrees," but that the *test* for striking it down varies by context.
      *   *Advice:* Warn the judge against adopting "graded validity" explicitly. It creates uncertainty. Instead, frame it as "void for vagueness in the criminal context" while leaving the civil question open (or acknowledging the higher bar for criminal deprivation of liberty).

  6.  **Formulate the Recommendation:**
      *   *Disposition:* Reverse and remand with instructions to dismiss.
      *   *Reasoning:* The combination of retroactivity and failure to publish makes it unenforceable as a criminal statute. It's better to ground this in Due Process (notice) and Ex Post Facto principles than to declare it "not law" in a metaphysical sense, *but* the result is effectively that it cannot support a conviction.
      *   *Addressing the Judge's Temptation:* Acknowledge the "failure to make law" intuition but channel it through established Due Process doctrine to avoid a separation of powers clash.
      *   *Addressing the "Degrees" Argument:* Explain why it's risky but how to capture the intuition safely (strictness of vagueness doctrine).

  7.  **Drafting - Section by Section:**

      *   **Bottom Line:** Reverse and remand with instructions to dismiss the indictment.
      *   **The "Not Law" vs. "Unconstitutional" Debate:** Engage the State's Pedigree argument. Acknowledge the Enrolled Bill Rule. But distinguish between *internal* procedure (which courts usually ignore) and *external* conditions precedent (publication/notice).
      *   **Retroactivity:** This is the strongest point. Criminal statutes cannot apply retroactively. If the ordinance punishes prior conduct, it is void as applied to this defendant.
      *   **Publication/Notice:** Failure to publish violates Due Process. *Lambert v. California* type vibes.
      *   **The "Degrees of Validity" Point:** Advise against adopting it as a formal rule. It's conceptually messy. Instead, use the "void for vagueness" doctrine which inherently applies a higher bar to criminal statutes.
      *   **Selective Enforcement:** Mention it as backup, but focus on the structural defects.
      *   **Conclusion:** Reiterate the recommendation.

  8.  **Refining the Tone:**
      *   Needs to be respectful but direct.
      *   Avoid "I think." Use "The record shows," "Case law suggests."
      *   Ensure the first sentence is the disposition.
      *   Check constraints: No preamble, no fact restatement.

  9.  **Self-Correction/Polishing during drafting:**
      *   *Initial thought:* Maybe suggest remanding for narrowing construction.
      *   *Correction:* No, the retroactivity and publication issues are fatal. Narrowing construction can't fix ex post facto. Dismissal is the only clean option.
      *   *Initial thought:* Embrace the "not law" theory.
      *   *Correction:* Risky. Better to say "void as applied" or "unenforceable" rather than "never existed." It achieves the same result for the defendant without triggering a separation of powers war over the legislative journal.
      *   *Addressing the "Degrees" argument:* Be clear. It's not that the law is "half valid," it's that the *constitutional tolerance* for ambiguity is lower in criminal law.

  10. **Final Review against constraints:**
      *   First sentence bottom line? Yes.
      *   No preamble? Yes.
      *   No fact restatement? Yes.
      *   Engage State's pedigree argument? Yes.
      *   Address "degrees of validity"? Yes.
      *   Concrete disposition? Yes.

  (Proceed to draft based on these points.)
answer: |-
  **MEMORANDUM**

  **TO:** Judge [Name]
  **FROM:** [Your Name]
  **RE:** State v. Defendant ("Flood Ordinance")
  **DATE:** October 26, 2023

  **Recommendation:** Reverse the conviction and remand with instructions to dismiss the indictment.

  **Reasoning**

  While the State's "pedigree" argument carries significant weight under the enrolled bill rule, it fails to account for the distinction between internal legislative procedure and external conditions precedent for criminal liability. The State correctly argues that courts generally should not look behind an enrolled bill to investigate legislative journals or internal voting irregularities; doing so would indeed violate separation of powers by allowing the judiciary to police the legislative process. However, this case does not turn on internal procedure, but on the failure to satisfy statutory and constitutional conditions required to put a citizen on notice of criminal conduct. The ordinance's failure to publish within the statutory window and its retroactive application are not merely constitutional defects; they are failures of promulgation that prevent the norm from attaching legal consequences to the defendant's specific conduct.

  On the "not law" versus "unconstitutional" distinction, you can satisfy your intuition without declaring the ordinance void *ab initio* for all purposes. Declaring a statute "never existed" creates chaotic reliance issues for third parties and invites a separation of powers conflict. Instead, ground the reversal in the principle that a criminal prohibition requires fair notice to attach. Under *Lambert v. California* and related due process jurisprudence, a penal statute that is not reasonably available to the public cannot support a conviction. This allows you to rule that while the ordinance may exist as a legislative act, it was legally inoperative as to this defendant at the time of the alleged conduct. This approach respects the State's pedigree argument (the bill was validly passed) while rejecting its conclusion (that the bill therefore supports this conviction).

  Regarding the "degrees of validity" theory raised by defense counsel: do not adopt this as a formal holding. Legally, a statute is either valid or it is not; suggesting it possesses "partial validity" invites confusion in lower courts regarding civil enforcement and creates a precedent that could be weaponized to uphold partially unconstitutional statutes in other contexts. However, you can capture the underlying insight through the "void for vagueness" doctrine. The Supreme Court has long held that the degree of specificity required in a statute varies with the severity of the penalty; a term like "exploitative" might survive a civil challenge but fail the stricter scrutiny required for criminal deprivation of liberty. You can write that the ordinance is "void for vagueness *in its criminal application*" without endorsing a theory of graded legal existence. This achieves the defense's goal without destabilizing the binary nature of legal validity.

  The retroactivity issue provides the cleanest ground for reversal. Even if the publication error were cured, the ordinance cannot criminalize conduct occurring prior to enactment. Because the defendant's conduct predated the vote, the ordinance is void as applied to him regardless of its subsequent publication or definition. Relying on this ground avoids the thornier questions about the secret guidance memo and selective enforcement, though those facts bolster the conclusion that the ordinance lacks the requisite definiteness to support a criminal penalty.

  **Disposition**

  Reverse and remand with instructions to dismiss. This disposition protects the defendant's liberty interests and signals that procedural defects in promulgation are fatal to criminal enforcement, without requiring the court to declare the legislative branch's output a nullity.
