  2.  **Deconstruct the Position:**
      *   Core: Anti-realism = Meaning is use/verification. Truth is epistemic.
      *   Problem: Fitch's Paradox ($p \to \diamond Kp$ leads to $p \to Kp$).
      *   Solution: Restrict KP to Cartesian propositions ($p$ such that $\diamond Kp$ is consistent) or basic non-epistemic truths.
      *   Student's intuition: Fitch sentences are self-undermining, so excluding them is principled.

  3.  **Brainstorming Defeaters/Challenges:**
      *   *The "Ad Hoc" Charge:* Is the restriction *really* principled, or just designed to block Fitch? (Edgington, Williamson).
      *   *Williamson's Margin for Error:* Even if we restrict KP, does the anti-realist semantics force a margin for error that undermines the notion of knowledge required for KP? (Williamson's *Knowledge and Its Limits*).
      *   *Intuitionistic Logic:* Dummett motivates anti-realism via intuitionistic logic. Fitch's proof uses classical logic. But the derivation of the contradiction holds intuitionistically up to the point of $\neg K(p \land \neg Kp)$. Does the anti-realist have to accept $\neg (p \land \neg Kp)$? Yes. But does that collapse truth into known truth in a way that hurts?
      *   *Undecidables:* Goldbach's Conjecture. If it's true but unprovable, is it Cartesian? If we can't verify it, is it meaningful?
      *   *Vagueness:* Sorites paradoxes. Are vague truths knowable?
      *   *Collateral Commitments:* Assertion norms. If truth is knowability, what norms govern assertion?
      *   *The "Loss of Realism" without Gain:* Does restricting KP save anti-realism, or does it just make it a trivial claim about a subset of propositions?
