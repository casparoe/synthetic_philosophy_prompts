prompt: |-
  I sit on the ethics advisory board of a mid-sized fertility clinic that performs roughly two thousand IVF cycles a year. Our lab director has proposed that we begin offering polygenic embryo screening: when a couple has several viable embryos, they would receive each embryo's polygenic risk scores for common diseases and, at the contested end of the menu, predicted percentiles for non-disease traits — educational attainment, cognitive performance, height. Disease risk panels are, by our board's lights, settled. The live issues are the non-disease traits, and also a separate request already on file: a couple in which one partner carries a dominant gene for hereditary deafness, both partners being Deaf themselves, who want our help selecting an embryo that has the mutation — selecting for deafness, in effect — so that their child belongs to their Deaf community rather than to ours.

  The director's pitch is essentially the principle of procreative beneficence: parents have a reason, perhaps an obligation, to select, of the children they could have, the one expected to have the best life, and withholding the information is paternalism. Several board members reply with the standard counters — the child's future autonomy, the objection to designing another person, the disability-rights worry about what screening against a trait says to people who live with it. My own view, which I would like the memo to take seriously but not simply assume, is that both sides share a flawed picture: they argue as if the moral weight of the choice rests on the child who will result, when the non-identity problem seems to me to gut every version of the harm-to-the-child argument for embryo selection outright. The considerations that actually move me all operate elsewhere — on families already raising children with the traits being scored against, and on what the clinic endorses and thereby trains parents to want. But I recognize I may be wrong that the child-centered arguments are empty, and the memo should not stack the deck.

  Please draft the written opinion I will circulate before next month's meeting. It should make a concrete recommendation — approve the trait menu, reject it, or approve with conditions — including where, if anywhere, the boundary between medical and non-medical screening should be drawn and how the Deaf couple's request should be handled within that framework. Give the reasoning in enough detail that the lab director and the skeptical board members would each recognize their own position fairly stated, and include an honest treatment of the strongest argument for whichever recommendation you reject. The board acts on memos it can respond to, so flag explicitly any point on which you think the philosophical literature is genuinely indeterminate and the decision must fall back on institutional values rather than argument. No citations, please — we attach those separately.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of an Ethics Advisory Board at a mid-sized fertility clinic (2,000 IVF cycles/year).
      *   **Task:** Draft a written opinion/memo for circulation before the next meeting.
      *   **Topic:** Polygenic Embryo Screening (PES).
          *   *Proposal:* Offer PES for common diseases (settled) AND non-disease traits (educational attainment, cognition, height).
          *   *Specific Case:* A Deaf couple wants to select *for* deafness.
      *   **Key Arguments to Address:**
          *   *Director's View:* Procreative Beneficence (obligation to select the best life), anti-paternalism.
          *   *Skeptics' View:* Future autonomy, "designing" people, disability rights/expressivist objection.
          *   *My View (The User's View):* Non-Identity Problem (NIP) undermines harm-to-child arguments. Real moral weight lies in impact on existing families and clinic's role in shaping parental desires/norms. *However*, the memo must not stack the deck; it must acknowledge uncertainty about NIP.
      *   **Requirements:**
          *   Make a concrete recommendation (Approve, Reject, or Approve with Conditions).
          *   Define the boundary between medical and non-medical screening.
          *   Address the Deaf couple's request.
          *   Fairly state opposing positions (Director & Skeptics).
          *   Include the strongest argument for the rejected recommendation.
          *   Flag areas of philosophical indeterminacy (where values trump argument).
          *   No citations (attached separately).
          *   Tone: Professional, ethical, nuanced, actionable.

  2.  **Determine the Recommendation:**
      *   *Option A (Approve All):* Too risky. Non-disease traits (eugenics-adjacent, low predictive power, social harm).
      *   *Option B (Reject All):* Too restrictive. Disease screening is standard of care and generally accepted.
      *   *Option C (Approve with Conditions):* This is the most balanced and actionable path.
          *   *Condition 1:* Limit to serious medical conditions (disease/impairment). Exclude non-disease traits (height, IQ, etc.).
          *   *Condition 2:* Address the Deaf couple's request carefully (likely reject selection *for* impairment, but frame it around medical harm vs. cultural identity).
      *   *Refining the Recommendation:* I need to align with the user's specific philosophical leaning (NIP makes harm-to-child arguments weak, focus on social/family impact) while remaining practical for a clinic.
      *   *Decision:* Recommend approving disease risk panels but *rejecting* non-disease trait selection. Regarding the Deaf couple, recommend against selecting *for* deafness, but frame it carefully to avoid ableist dismissal of Deaf culture, focusing instead on the clinic's medical mandate.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Brief overview of the recommendation.
      *   **Context:** The proposal and the specific case.
      *   **Analysis of Competing Views:**
          *   Procreative Beneficence (Director).
          *   Autonomy/Design/Disability Rights (Skeptics).
          *   The Non-Identity Problem (My View).
      *   **The Core Ethical Shift:** Moving from "harm to child" to "social/family impact."
      *   **Recommendations:**
          *   Boundary setting (Medical vs. Non-Medical).
          *   The Deaf Couple Case.
      *   **Areas of Indeterminacy:** Where philosophy ends and policy begins.
      *   **Conclusion.**

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Introduction:* Acknowledge the gravity. 2,000 cycles is significant scale.
      *   *Fair Statement of Positions:*
          *   *Director:* Focus on beneficence. If we can reduce suffering or increase opportunity, why not? Withholding info is paternalistic.
          *   *Skeptics:* Autonomy (open future), commodification (designer babies), expressivist objection (screening out deafness says deaf lives aren't worth living).
          *   *My Contribution (NIP):* If selecting Embryo A means Child A exists, and selecting Embryo B means Child B exists, Child A cannot claim they were harmed by being chosen over Child B (unless life is not worth living). This undermines the "harm to the future child" argument on both sides.
      *   *The Pivot:* If NIP holds, where does the harm lie?
          *   Impact on existing disabled people (stigma, resource allocation).
          *   Impact on parents (unrealistic expectations, consumer mindset).
          *   Clinic's role (medical institution vs. service provider).
      *   *Recommendation - Trait Menu:* Draw the line at pathology. Disease = Yes. Enhancement/Non-disease = No. Why? Predictive validity is low for traits like IQ, and the social cost of stratification is high.
      *   *Recommendation - Deaf Couple:* This is tricky. If we ban "non-medical" traits, is deafness medical or cultural? Medically, it's a sensory impairment. Culturally, it's an identity.
          *   *Decision:* Clinic is a medical institution. It should not facilitate the intentional creation of biological impairment, even if culturally valued. However, acknowledge the validity of their cultural concern. Do not offer selection *for* deafness.
      *   *Indeterminacy:* Acknowledge that NIP is not universally accepted. Acknowledge that "disease" vs. "trait" is fuzzy. Admit that the final call is on institutional identity.

  5.  **Refining the Tone and Content (Self-Correction during drafting):**
      *   *Check:* Did I stack the deck on NIP? *Correction:* Ensure I explicitly state that NIP is contested and the memo proceeds *as if* it has force, but acknowledges the counter-view that we can have obligations to future persons regardless of identity.
      *   *Check:* Is the Deaf couple decision respectful? *Correction:* Avoid saying "Deafness is bad." Say "Our mandate is to prevent pathology, not select for it, regardless of cultural framing." Distinguish between *allowing* deafness (not screening against) and *selecting for* it.
      *   *Check:* Is the distinction between disease and traits clear? *Correction:* Use "serious childhood-onset medical conditions" vs. "complex behavioral or physical traits."
      *   *Check:* Did I include the strongest argument for the rejected side? *Correction:* Ensure the argument *for* offering non-disease traits (parental autonomy/beneficence) is robustly presented before being weighed against social harms.

  6.  **Final Polish:**
      *   Ensure no citations are included.
      *   Check word count and flow.
      *   Make sure the "Indeterminacy" section is explicit as requested.
      *   Verify the recommendation is concrete.

  7.  **Final Review against constraints:**
      *   Concrete recommendation? Yes (Approve disease, Reject traits, Reject selection for deafness).
      *   Boundary drawn? Yes (Medical pathology vs. normal variation).
      *   Deaf couple handled? Yes.
      *   Fair statement of positions? Yes.
      *   Strongest rejected argument included? Yes (Procreative Beneficence).
      *   Indeterminacy flagged? Yes.
      *   No citations? Yes.

  *(Self-Correction on the Deaf Couple)*: I need to be careful. If we reject non-disease traits, does deafness count as a disease? In the medical model, yes. In the social model, no. The clinic is a medical institution. The recommendation should be that the clinic cannot actively select *for* a condition that reduces biological function, even if the social impact is neutral/positive for that family. This aligns with the "medical mandate" argument.

  *(Self-Correction on NIP)*: The prompt says "My own view... is that both sides share a flawed picture... non-identity problem seems to me to gut every version of the harm-to-the-child argument." The memo needs to take this seriously but not assume it's proven fact. I will frame it as "A Significant Philosophical Challenge to Standard Reasoning."

  Let's write.
answer: |-
  **MEMORANDUM**

  **TO:** Ethics Advisory Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Polygenic Embryo Screening (PES) Protocols and Specific Case Adjudication

  **1. Executive Summary**

  The Lab Director's proposal to expand our Polygenic Embryo Screening (PES) offerings presents two distinct ethical challenges: the scope of traits available for selection (specifically non-disease traits like cognitive performance and height), and the adjudication of a request to select *for* hereditary deafness.

  After reviewing the competing ethical frameworks, I recommend that the Board **approve the use of PES for serious, childhood-onset medical conditions** but **reject the inclusion of non-disease traits** on our screening menu. Regarding the specific request from the Deaf couple, I recommend we **decline to facilitate selection for deafness**, while ensuring the couple is counseled on the option to decline screening against it.

  This recommendation rests on a shift in ethical focus: moving away from contested claims about harm to the future child and toward the clinic's role in shaping parental expectations and social norms. However, this memo explicitly flags areas where philosophical consensus is impossible, requiring the Board to decide based on institutional identity rather than argument alone.

  **2. Analysis of Competing Ethical Frameworks**

  To reach a decision, we must weigh three distinct lines of reasoning currently present on this Board.

  *The Principle of Procreative Beneficence (The Director's Position)*
  The Director argues that parents have a moral reason, potentially an obligation, to select the child expected to have the best life. From this view, providing polygenic risk scores for education or health is an expansion of parental autonomy and a tool for harm reduction. Withholding this data is characterized as paternalism. The strongest version of this argument does not rely on eugenics but on individual welfare: if a parent can reduce the risk of schizophrenia or increase the likelihood of academic success without harming others, beneficence suggests they should. To deny this is to privilege a "natural" lottery over informed choice.

  *The Autonomy and Disability Rights Objection (The Skeptics' Position)*
  Several Board members argue that selecting for non-disease traits commodifies children, treating them as products to be designed rather than persons to be welcomed. This view emphasizes the child's "right to an open future," arguing that selecting for specific traits narrows the child's autonomy before they are born. Additionally, the disability rights perspective raises the "expressivist objection": screening against traits like deafness or dwarfism expresses the judgment that lives with those traits are not worth living, thereby harming existing people with those conditions by devaluing their existence.

  *The Non-Identity Challenge (My Primary Concern)*
  Both the above positions largely assume that our primary obligation is to the specific child who will be born. However, the "non-identity problem" challenges this. If selecting Embryo A results in Child A, and selecting Embryo B results in Child B, Child A cannot claim they were harmed by being selected over Child B, provided Child A's life is worth living. They would not exist otherwise. Therefore, arguments claiming we harm the *resulting child* by selecting them (or by not selecting a "better" sibling) are logically fragile.

  If the non-identity problem holds, the moral weight shifts. The harm is not primarily to the child being selected, but to: (1) existing families raising children with the traits we screen against (via increased stigma and reduced support); and (2) the parents themselves, who may be trained by the clinic to view parenting as a risk-management exercise rather than a relationship of unconditional acceptance.

  **3. Recommendation on the Trait Menu**

  **Recommendation:** Approve PES for serious medical pathologies; Reject PES for non-disease traits (education, height, cognition).

  **Reasoning:**
  While the Director's appeal to beneficence is powerful, it relies on a conception of "benefit" that is medically and socially unstable when applied to non-disease traits.

  1.  **Predictive Validity and Medical Mandate:** Our clinic is a medical institution. Polygenic scores for diseases (e.g., Type 1 Diabetes, certain cancers) relate directly to physiological pathology. Scores for educational attainment or height are correlations with complex social outcomes, not medical diagnoses. Offering the latter blurs the line between healthcare and consumer enhancement. Given the current statistical noise in polygenic scoring for behavioral traits, offering them risks misleading parents into believing they are purchasing guarantees rather than managing probabilities.
  2.  **Social Externalities:** Even if the non-identity problem means we do not harm the *selected child* by excluding these traits, we may harm the *social fabric*. Normalizing the selection of embryos for height or cognitive proxies reinforces the idea that human worth is tied to these metrics. This increases pressure on all parents to screen, exacerbating social stratification.
  3.  **Parental Expectations:** By offering a menu of non-medical traits, the clinic implicitly endorses a consumerist model of reproduction. This sets parents up for disappointment if the child does not match the predicted profile, potentially damaging the parent-child bond.

  **The Strongest Counter-Argument:**
  We must acknowledge the strongest argument against this restriction: Parental Autonomy. If parents are paying for a service that is safe and legally permissible, on what grounds do we restrict their access to information about their future family? If we accept disease screening, we have already accepted that genetics matter. Drawing a line at "medical" vs. "social" traits is difficult when mental health bridges both. By rejecting non-disease traits, we are prioritizing social norms over individual liberty. This is a valid cost, and the Board must accept that we are limiting autonomy to protect broader social goods.

  **4. Recommendation on the Request to Select for Deafness**

  **Recommendation:** Decline the request to actively select an embryo *with* the hereditary deafness mutation. Offer the couple the option to proceed with IVF *without* any genetic screening regarding hearing status.

  **Reasoning:**
  This case tests the boundary of our medical mandate. The couple's desire is rooted in cultural continuity, not pathology. They view deafness as a cultural identity, not a disability.

  However, the clinic operates within a medical framework. While we can respect Deaf culture, our technical and ethical infrastructure is designed to prevent biological impairment.
  1.  **Consistency with Medical Mission:** If we prohibit selecting for height or IQ because they are non-medical traits, we must be consistent. Selecting *for* deafness is the inverse of selecting *against* it, but both treat a biological characteristic as a selectable variable. Active selection for a sensory impairment contradicts the general medical principle of alleviating suffering or impairment.
  2.  **The Distinction between "Allowing" and "Selecting":** There is a moral difference between refusing to screen *against* deafness (allowing a Deaf child to be born) and actively screening *for* it. The former respects the parents' cultural values without the clinic actively engineering impairment. The latter makes the clinic a partner in intentionally creating a biological limitation. We can accommodate the former without violating the latter.
  3.  **Non-Identity Implications:** Consistent with the non-identity view, we are not harming the specific Deaf child by bringing them into existence (their life is worth living). However, approving active selection for impairment sets a precedent that could be used to justify selecting for other conditions (e.g., dwarfism, blindness) that the medical community generally agrees involve significant biological challenges.

  **5. Areas of Philosophical Indeterminacy**

  The Board must recognize that argument alone cannot resolve this policy. Several points remain genuinely indeterminate in the philosophical literature and must be settled by our institutional values:

  *   **The Validity of the Non-Identity Problem:** While I find the non-identity problem compelling, it is not universally accepted. Many ethicists argue we still have obligations to future persons regardless of identity. The Board must decide whether to adopt the non-identity framework as policy or to act as if we can harm future children by not selecting the "best" embryo. This is a value choice, not a factual determination.
  *   **The Definition of "Disease":** The boundary between pathology and normal variation is porous. Is a high genetic risk for depression a "disease" or a "trait"? Is deafness a disability or a difference? Philosophy cannot draw this line definitively. The clinic must define its own threshold for what counts as a "medical condition" worthy of intervention.
  *   **Institutional Complicity:** It is indeterminate whether providing information constitutes an endorsement of the choice made with that information. Some argue providing the data is neutral; others argue the offer itself legitimizes the selection. The Board must decide how responsible we are for the choices our patients make with the tools we provide.

  **6. Conclusion**

  We are not merely providing a service; we are curating the norms of reproduction for 2,000 families a year. My recommendation is to embrace a conservative medical model: intervene to prevent serious suffering (disease), but refrain from engineering social advantage (traits) or intentional impairment (selecting for deafness).

  This path respects the parents' right to have healthy children and the Deaf couple's right to have a Deaf child (by allowing unscreened implantation), without positioning the clinic as an engine of eugenics or a designer of human beings. We should approve the disease panel, reject the trait menu, and offer the Deaf couple unscreened transfer rather than selected impairment.

  I look forward to discussing these points at our next session.
