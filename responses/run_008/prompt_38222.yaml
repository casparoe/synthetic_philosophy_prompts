      *   *Unsatisfiable:* The tension between "Track Record is sufficient" and "Circularity is vicious."

      *Let's structure the Desiderata clearly.*
      1.  **The Fallibility Constraint:** The system must be able to output "I am broken."
      2.  **The Independence Constraint:** Verification paths must not share single points of failure.
