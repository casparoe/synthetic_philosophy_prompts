      *   *Structure:* Follow the three questions, then the pushback.
      *   *Key Insight to weave in:* The distinction isn't about the *victim*, it's about the *agent*.
      *   *Refining the "Trick":* Call it "sacramental" rather than a trick. George makes the death holy by doing it himself.
