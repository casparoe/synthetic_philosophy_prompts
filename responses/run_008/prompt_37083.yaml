      *   *Difference 2:* Candy is weak/old. George is capable. Candy *couldn't* have done it easily? No, he says he *ought* to have. It's moral cowardice vs. moral courage.
      *   *Difference 3:* Lennie's death is also punishment/justice in a twisted way. He killed Curley's wife. The dog didn't kill anyone (just smelled bad).
      *   *Resistance:* The book resists a clean "euthanasia is good" reading. George is destroyed by the act. It's not a victory. It's a survival tactic that kills the survivor's soul.

  7.  **Drafting the Response (Iterative refinement):**
