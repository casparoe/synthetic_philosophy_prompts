prompt: |-
  I'm a machine learning engineer who spends most of my time on model evaluation — benchmark design, calibration curves, held-out test sets, contamination checks — and I took exactly one course that touched classical Indian philosophy, so I know the names pratyakṣa, anumāna, and śabda and roughly nothing else. Here is what I want: restate the Nyāya theory of the pramāṇas in the vocabulary I use at work, as faithfully as you can, and then give me the residue report — the honest accounting of what did not survive the translation.

  The translation should cover, at minimum, four things. First, the basic claim that there is a closed, enumerable list of epistemic instruments, each with its own conditions of proper functioning. Talk to me as though this were a spec for epistemic pipelines: what corresponds to a pipeline, what corresponds to its validation procedure, and whether the closed-list claim translates as something like "any reliable belief-forming process decomposes into these primitives" — and if it does, whether that decomposition claim is even true of the processes I actually supervise, given that a trained model mashes data-derived correlation and human-authored documentation into one artifact. Second, the structure of anumāna: the thing to be established, the evidence, and the invariable concomitance between them. I suspect vyāpti is doing the work of a learned correlation that is assumed to generalize beyond observed cases, and I suspect the fallacies of the hetu have exact counterparts in evaluation failure modes. In particular, tell me whether the fallacy of the reason that is present in the target cases but in nothing comparable is or is not just a model keying on a shortcut feature present in all and only the benchmark examples — and if it is, why it took my field so long to write down what their tradition treated as a named, taxonomized error. Third, the status of śabda as a basic pramāṇa rather than something derivative of perception and inference. Since essentially everything my models know comes from text, I want to know whether the Nyāya defense of testimony as a foundational rather than derived source has anything to say to someone like me, or whether it only made sense relative to their assumptions about competent speakers and authoritative texts — in other words, whether the claim generalizes beyond speakers. Fourth, the Nyāya position that a cognition's validity is intrinsic to it — that a veridical cognition presents its own veridicality along with its object — as against the Buddhist demand for some further check. I can feel the analog of a fight about self-certification versus held-out validation here, but I suspect the translation cheats at exactly this point, so be careful about whether the Nyāya position is really anything like a claim that a model's output can certify itself.

  Then the residue report. Sort the framework into three piles: what translates cleanly, what survives only distorted, and what has no expression in evaluation vocabulary at all. For the last pile, tell me whether the gap is a limitation of my vocabulary — whether something like the self-presenting character of valid cognition is a genuine feature of anyone's epistemic situation that evaluation vocabulary simply cannot describe — or whether it marks a place where the Nyāya claim was less clear than it sounded. And tell me the reverse too: whether anything in the Nyāya framework already settled, or pointedly refused to settle, a problem my field still argues about, such as whether a validation signal can in principle validate itself, or whether a generalization claim ever gets grounded by anything other than more model outputs.

  Lead with your bottom line in the first sentence — one sentence saying how much of the framework survives the translation and where the main residue lies — then give the reasoning. No preamble, and do not restate my question back to me before answering it.
