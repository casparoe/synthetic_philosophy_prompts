      *(Refining the Judge point)*: The user asks if it's coherent for a judge to rank arguments without verifying conclusions. I need to bring in the concept of "local verification." The judge can't verify the *global* conclusion, but can verify *local* steps (e.g., "Did you cite this source correctly?" "Does this math add up?"). This is the bridge.

      *(Refining the Legal Analogy)*: The legal system isn't just about truth; it's about *procedural justice*. AI Debate is about *training signals*. The analogy holds on the "adversarial" part but diverges on the "outcome" (verdict vs. gradient update).

