  1.  *Single Life:* Predicts Yes (slime), Yes (coral), No (system). Matches all verdicts.
  2.  *Genetic Uniformity:* Predicts Yes, Yes, No. Matches so far, but fails on the dead oak (same genes, no object) unless amended to "Living + Genetic."
  3.  *Autonomous Agent:* Predicts Yes, Yes, Yes. Fails on your system; she will reject it as non-biological.

  The "Single Life" and "Living + Genetic" rules agree on your three cases. To separate them, you need a biological unity with mixed genetics.

  **The Mile-Five Trap:**
  Ask: **"Is a human recipient of a transplanted heart one object?"**

  If **Yes**: She admits genetics are irrelevant; composition rests solely on biological life processes. This confirms *Single Life*.
  If **No**: She privileges genetic origin over biological integration. You can then press her on gut microbiomes (essential for life, different DNA) or why the dead oak (same DNA) isn't one object.

  This forces her to choose between *physiological unity* and *genetic history*, revealing whether her view is truly about "life" or just "natural kinds." If she hesitates, point out that her dead oak verdict already killed pure geneticism; if she accepts the transplant, she admits your distributed system fails only because it lacks biology, not unity.
