  **Predictions:** Slime mold: One object. Coral head: One object. Distributed system: Not one object.

  **The Rule:** She is defending **Biological Organicism**: parts compose a whole iff they participate in a single, ongoing biological life. This explains the living cat (yes), dead oak (no life), and honeybee colony (many lives, not one).

