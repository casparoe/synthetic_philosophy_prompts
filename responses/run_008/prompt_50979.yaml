  Bottom line
  **Credence: 0.38.** Calculus was "ripe fruit" by 1660, making the first half of the conjunction likely, but natural selection was a "foggy map" where the mechanism was far less determined than the phenomenon. The combined probability crashes because the definition of "essentially the same discovery" is unstable enough to invalidate many counterfactual successes.

  The terms
  1.  **P(Readiness → Discovery within 50y): 0.70** — Mathematical tools for calculus were saturated and circulating; biological data for natural selection was fragmented and often theological.
  2.  **P(Genius Impact < 50y delay): 0.55** — Newton and Darwin were accelerants who synthesized existing fragments, but peers like Huygens or Hook were adjacent enough to prevent century-long stalls.
  3.  **P(Multiple Discovery = Inevitability Signal): 0.60** — Simultaneity suggests underlying readiness, but shared communication networks create false clusters even for contingent ideas.
  4.  **P(Semantic Stability of "Essentially"): 0.45** — Newton's fluxions and Leibniz's differentials operated differently for decades; Wallace lacked Darwin's mechanism of divergence.
  5.  **P(Counterfactual Determinacy): 0.85** — The question is fuzzy but tractable enough for probabilistic assessment rather than pure philosophical dismissal.
  6.  **P(Independence of Fields): 0.90** — Success in mathematical analysis does not causally force success in biological theory; these are separate probability events.

  Combining
  I treat the calculus half as high-probability (approx. 0.75) due to high Readiness, but the natural selection half as a coin-flip (approx. 0.50) due to lower Readiness and poor Semantic Stability. Multiplying these yields ~0.38. The estimate is most sensitive to **Semantic Stability**; if "calculus" means "any method for slopes," the probability spikes toward your roommate's view, but if it means "a unified symbolic system with the Fundamental Theorem," it crashes toward yours. The conjunction fails primarily because biology was less "ready" than math, and because "natural selection" is a harder target to hit precisely than "tangents."

  Where I'm soft
  **Semantic Stability (0.45).** Historians of science still fight over whether Barrow or Fermat "had" calculus before Newton. A clear criterion for what counts as a "working calculus" (e.g., must include the Fundamental Theorem vs. must only solve tangent problems) would shift this term by at least 0.2 points. I need a philosopher of science to define the identity conditions of a discovery to tighten this.

  You two
  Your disagreement lives in **Semantic Stability**, not inevitability. Your roommate counts solving the tangent problem as "calculus" (functional equivalence); you count the unified theoretical framework as "calculus" (structural equivalence). Stop arguing about whether the discovery was inevitable and argue about this: *If a counterfactual Huygens publishes a rule for tangents in 1670 but lacks a general notation or the Fundamental Theorem, does your roommate win?* That is the actual threshold dividing 0.3 from 0.8.
