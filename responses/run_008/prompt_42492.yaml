answer: |-
  This is an excellent catch. Your instincts are spot-on: the passage captures the *narrative arc* of the field correctly (neglect → rehabilitation → prominence) but simplifies the technical philosophical positions to the point of distortion, particularly regarding the Reductionist view and the current state of consensus.

  Here is an audit of the passage, claim-by-claim, followed by a detailed response to your three specific questions.

  ### Part 1: Claim-by-Claim Audit

  **Claim 1:** *"For most of modern philosophy, testimony got no epistemological respect."*
  *   **Verdict:** **Acceptable Simplification.**
  *   **Expert Take:** Until the 1980s, epistemology was dominated by "individualism." Testimony was treated as a secondary topic, often lumped in with induction or probability. The "social turn" in epistemology is a relatively recent phenomenon. A working epistemologist would nod at this.

  **Claim 2:** *"Hume and Locke treated other people's say-so as a second-rate source of belief: you were entitled to accept a report only insofar as you could check it against your own observation."*
  *   **Verdict:** **Wince / Imprecise.**
  *   **Expert Take:** This conflates *Local* Reductionism with *Global* Reductionism (see section (a) below). Hume and Locke are traditionally read as Global Reductionists: they argued testimony is justified by our *general* observation that testimony *usually* matches reality, not that we must verify *every specific report* personally. The book's phrasing ("check it") implies Local Reductionism, which is a straw man of Hume.

  **Claim 3 & 4:** *"Coady... showed that this stance is self-defeating — if every testimonial belief had to be verified against what we've observed ourselves, we couldn't so much as learn our native language..."*
  *   **Verdict:** **Mostly Acceptable.**
  *   **Expert Take:** This accurately summarizes C.A.J. Coady's argument in *Testimony: A Philosophical Study* (1992). Coady argued that you cannot establish the general reliability of testimony (Global Reductionism) without relying on testimony itself (circularity), and you cannot verify individual claims (Local Reductionism) without already understanding language (which requires testimony). The "language/history" example is standard fare in this debate.

  **Claim 5:** *"Testimony therefore had to be recognized as a basic source of justification, on a par with perception and memory..."*
  *   **Verdict:** **Debatable Inference.**
  *   **Expert Take:** The word "therefore" does heavy lifting here. The failure of Reductionism creates a *vacuum* that Anti-Reductionism fills, but it doesn't logically *force* the conclusion. One could theoretically adopt skepticism or a hybrid view. However, this is the standard move made by Anti-Reductionists (like Coady, Tyler Burge, and John McDowell), so it represents a major school of thought, even if presented as an inevitable conclusion.

  **Claim 6:** *"...today essentially everyone in the field accepts that we should take people's word at face value unless there's positive reason to doubt it."*
  *   **Verdict:** **Flatly Wrong.**
  *   **Expert Take:** This is the most problematic sentence. It describes "Presumptivism" (a strong form of Anti-Reductionism). While popular, it is not consensus. Robust Reductionist positions remain defended (e.g., by Elizabeth Fricker), and many epistemologists hold nuanced "Dualist" or "Contextualist" views. The field is active and divided, not settled.

  ---

  ### Part 2: Addressing Your Specific Questions

  #### (a) Is the reductionist position the book attacks the one reductionists actually hold?

  **No.** The book attacks a straw man, though a common one.

  In the literature, a crucial distinction is drawn between **Local Reductionism** and **Global Reductionism**.
  *   **Local Reductionism:** To be justified in believing *this* specific testimony (e.g., "The train leaves at 5"), I must have positive reasons to trust *this* specific speaker or token of speech.
  *   **Global Reductionism:** To be justified in believing testimony generally, I must have positive reasons (based on my own observation) to believe that testimony *as a type* is reliable. Once that general reliability is established, I don't need to check every specific report.

  **Hume's Actual View:** Hume is widely interpreted as a **Global Reductionist**. In *An Enquiry Concerning Human Understanding*, he argues that our confidence in testimony is derived from our experience of the "conformity" between testimony and fact. He does not require you to personally verify every historical claim; he requires that you have a background inductive basis for trusting human reporting generally.

  **The Book's Error:** The book describes Hume as requiring you to "check [a report] against your own observation." That sounds like Local Reductionism.
  **Coady's Move:** Coady's genius was arguing that **Global Reductionism collapses into Local Reductionism.** He argued that you cannot establish the *general* reliability of testimony without relying on testimony (e.g., you need other people to tell you about the times you weren't present to verify things yourself). Therefore, even the Global Reductionist is secretly relying on the very thing they are trying to justify.

  **Summary:** The book is right that Coady defeated the Reductionist project, but it mischaracterizes the starting position. Hume didn't ask you to verify everything; Coady showed you *couldn't* verify the general principle without circularity.

  #### (b) Does the infeasibility of verification establish the positive conclusion (Basic Source/Default Acceptance)?

  **No, not on its own.** It establishes a *need* for an alternative, but not the specific alternative of "default acceptance."

  The argument structure in the book is:
  1.  Reductionism is impossible (Self-Defeat).
  2.  Therefore, Testimony is a Basic Source (Anti-Reductionism).

  A working epistemologist would see a gap here. The failure of Reductionism shows that testimonial justification cannot be *derived* from perception/memory/induction. It does not automatically prove that testimony is a *basic* source (like perception) or that it warrants *presumptive trust* (face value).

  To get to "take people's word at face value," you need a positive principle, not just a negative critique of Hume.
  *   **Coady** argues from the nature of language and social interdependence.
  *   **Tyler Burge** (in "Content Preservation") offers the **Acceptance Principle**: "A person is entitled to accept a proposition that is presented as true and that is intelligible to him, unless there are stronger reasons not to do so." This is based on the idea that rational faculties are aimed at truth.
  *   **John McDowell** argues from a Davidsonian perspective that we cannot even make sense of someone having beliefs unless we assume they are mostly right.

  **The Weaker Conclusion:** The self-defeat argument successfully establishes that **Reductionism is false.** It does not successfully establish that **Anti-Reductionism is true** without additional premises. There are other options, such as **Contextualism** (standards for testimony shift depending on the context) or **Hybrid Views** (testimony is basic in some contexts, derived in others). The book skips these nuances to tell a cleaner story.

  #### (c) How much genuine consensus is there?

  **Very little.** The claim that "essentially everyone accepts" the face-value principle is the passage's greatest exaggeration.

  The field is currently divided into three main camps, none of which has total dominance:
  1.  **Anti-Reductionists (Presumptivists):** Believe testimony is a basic source and warrants default trust. (Key figures: Coady, Burge, McDowell, Moran).
  2.  **Reductionists:** Believe testimonial justification must still be grounded in the hearer's reasons (perception, memory, induction), though they have updated their views to avoid Coady's traps. (Key figures: Elizabeth Fricker, David Owens). Fricker, in particular, argues for a "Context-Sensitive Reductionism" where we monitor speakers for credibility, which is compatible with learning language but rejects default trust.
  3.  **Dualists / Hybrid Views:** Believe there is no single answer. Some testimony is basic; some requires verification. (Key figures: Peter Graham, Jennifer Lackey).

  **Jennifer Lackey's** work (e.g., *Learning from Words*) is particularly damaging to the "consensus" claim. She argues for a "Statement View" where the speaker's reliability matters more than the hearer's entitlement, challenging the idea that the *hearer* has a default right to believe.

  **Current State:** The debate has moved past the binary of "Hume vs. Reid." Today, the question is less "Is testimony basic?" and more "Under what conditions is testimonial justification defeated?" or "How does the speaker's knowledge transmit to the hearer?" (The transmission vs. generation debate). To say the field has settled on "take their word at face value" ignores the last 20 years of literature on **epistemic injustice**, **speaker competence**, and **social power dynamics**, which often argue *against* face-value acceptance in structurally unequal contexts.

  ### Summary Recommendation

  You do not need to stop reading the book, but you should adjust your "trust meter."

  *   **Trust the History:** The narrative of Enlightenment suspicion → Reid's intuition → Coady's formalization is accurate.
  *   **Trust the Stakes:** The book correctly identifies that testimony is central to knowledge (language, history, science).
  *   **Distrust the Technical Definitions:** When the book defines Reductionism, remember it is describing a "strong" version that is easier to knock down than the historical Humean view.
  *   **Distrust the Consensus Claim:** Treat the final sentence as the author's own philosophical commitment (Anti-Reductionism) rather than a report on the field's status.

  The book is doing what trade-press philosophy must do: it is trading nuance for narrative clarity. It has identified the *right* problem (the paradox of verifying testimony without using testimony), but it presents the *solution* (default trust) as more settled and logically airtight than it actually is.
