      *   *Decision:* The prompt asks for the revision that cleans up the *most* trouble. The trouble stems from C5 claiming epistemic significance *against* C4. If C5 is demoted to "part of the phenomenon to be explained" (consistent with C3), the tension vanishes. If C2 is dropped, you have to rebuild the metaphysics. Demoting C5 is cheaper.
      *   *Wait, looking closer at C5:* "I think the persistence of this conviction is epistemically significant." This is the weak link. Why is it significant? Because it feels true? That's exactly what C3 says needs explaining.
