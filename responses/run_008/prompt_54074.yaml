      *   *Check C6 again:* "An illusion requires a real relatum." This is often used *against* illusionism (e.g., by Galen Strawson). If the relatum is just neural firing, is it an illusion of *qualia*? Yes, according to Illusionists. The user accepts this ("it just is not what introspection says it is"). So C2+C6 is stable *provided* C1 holds.
