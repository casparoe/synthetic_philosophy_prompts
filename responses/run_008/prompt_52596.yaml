answer: |-
  1. **You've built a career defending the strict reading of the handicap principle against a field that prefers pluralism. But recent empirical work suggests peahens may not prefer the most elaborate trains, and other textbook handicaps look shaky when measured carefully. If the classic examples are empirically fragile, does the principle lose its anchor, or are the measurements simply missing the context?**
     *Anticipated Reply:* She will likely argue that field measurements are noisy and that the principle is a theoretical baseline, not a description of every specific trait.

  2. **If you argue the measurements are missing context—perhaps preferences are conditional or traits are multifunctional—doesn't that concede that the handicap is never working in isolation, but always tangled with other mechanisms like sensory bias or direct benefits?**
     *Anticipated Reply:* Expect a distinction between "noise" in the system and the fundamental evolutionary logic driving the signal's existence.

  3. **Suppose you bite the bullet and accept that the classic examples are weaker than advertised: does the principle survive as a general law if its best evidence turns out to be exceptions rather than the rule?**
     *Anticipated Reply:* She may retreat to the claim that the principle explains the *origin* of signaling even if maintenance is currently handled by other forces.

  4. **Critics argue there is a crucial distinction between a signal being costly to produce and being costly to fake—the idea that the cost must scale with quality. If most real handicaps work this way, does your strict reading survive the concession that absolute cost matters less than differential cost?**
     *Anticipated Reply:* She will likely agree but insist that differential cost is still a form of cost, preserving the core logic of the principle.

  5. **If you concede that differential cost is what matters, what still distinguishes the handicap principle from ordinary signaling theory, where any reliable correlation between signal and quality suffices?**
     *Anticipated Reply:* Expect her to emphasize that without the cost component, the correlation collapses under deception, making cost the unique guarantor of honesty.

  6. **Consider index signals, like a deep croak that is physically hard for a small animal to produce. You've suggested an index is just a limiting case of a handicap where the cost of faking is infinite. Does stretching the definition of "cost" to cover physical impossibility leave the concept with any distinct content?**
     *Anticipated Reply:* She will likely argue that physical constraints are simply extreme costs, maintaining mathematical unity across signaling models.

  7. **If physical constraints count as costs, is the strict reading being saved by relabeling rather than evidence, and does that make the principle unfalsifiable?**
     *Anticipated Reply:* She may resist the "unfalsifiable" label by pointing to specific mathematical conditions where indexing fails and costly signaling must take over.

  8. **If a handicap is an equilibrium between signaler and receiver, what keeps the receiving side paying attention when the signal becomes rare, and does your strict reading commit us to a world that is more wasteful than necessary compared to a pluralist one?**
     *Anticipated Reply:* She will likely argue that waste is the necessary price of honesty, rejecting efficiency as a primary driver of evolutionary stability.

  9. **The idea is often applied to human traffic like luxury goods or virtue signaling; does the principle license these applications, and where do you draw the line between an analogy you endorse and one you resent?**
     *Anticipated Reply:* Expect her to endorse applications that involve genuine risk or cost while rejecting superficial comparisons that lack evolutionary stakes.

  10. **What observation, in the field or the lab, would force you to give up the strict reading rather than reinterpret it, and how would you tell the difference between a world where costly signaling is the norm and one where it is a special case?**
      *Anticipated Reply:* She may cite a scenario where honest signaling persists robustly without any detectable cost, though she will likely argue such a scenario is theoretically impossible.
