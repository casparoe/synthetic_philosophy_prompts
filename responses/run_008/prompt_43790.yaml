  The new case this year: someone pitched her on funding welfare research for black soldier fly larvae — the insects now being farmed at industrial scale as feed for farmed fish and chickens. The pitch was that this is plausibly hundreds of billions of individual animals within a decade or two, that there is essentially zero welfare science for them (no agreed standards at all for stocking density, substrate, or humane killing), and that a small research program now could set the industry's norms before they ossify. So: predict her verdict. But honestly I care more about the reasoning than the answer — what rules actually fit her record? Is she doing straight multiplication of the three factors, some threshold/veto version where failing badly on any one dimension sinks a cause, a measured-cost-effectiveness-first thing, or something else? Lay out the candidate rules that fit her past verdicts about equally well, say what each one predicts on the larvae case, and flag where they'd all just shrug the same way. Then give me your best guess with your reasons, and — this is the part I really want — tell me what further case I should float at dinner to best discriminate between the rules, since on most causes I could name they'd probably agree anyway.

  You should treat yourself as an expert on cause prioritization and the debates around it, and think carefully before committing — maybe sketch the candidate rules first and only then pick. Also please keep straight what's settled versus what's genuinely contested among people who do this for a living (whether ITN should be multiplicative at all, how neglectedness should even be measured, that sort of thing), and don't dress up one contested weighting as if it were the consensus. Then, as the very last line, state your predicted verdict in fixed form, like \answer{tier}, where tier is one of: top, upper-middle, middling, low, bottom.
