prompt: |-
  I edit a small epistemology blog read mostly by advanced undergraduates and other grad students, and I want to run an interactive feature titled "Which view of peer disagreement do you actually hold?" My readers constantly tell me things like "I'm basically a conciliationist, except about math" — I suspect most of them are sorted by which label they find flattering rather than by what they would actually do in the cases, and the quiz is meant to expose that. So the diagnostic questions have to do all the work.

  Please design the quiz to the following specification.

  Format and discipline of the questions:
  - Ten questions, each a short first-person concrete case with two or three answer options. At least one must be a numerical-confidence question (options given as confidence levels, e.g. "I'd go from 90% down to 85%," not verdicts), and at least one must be about suspension vs. continued outright belief rather than about degrees of confidence.
  - No question may use any of the labels of the debate — no "conciliationism," "steadfastness," "equal weight," "higher-order evidence," "epistemic peer" (describe the peer's credentials instead, concretely), and no philosopher's name. A reader who has never heard of the literature must be able to answer every question.
  - Don't recycle the literature's stock examples verbatim (the restaurant tip calculation, the blind wine tasting, the jazz-club parking spot). Fresh variants in the same spirit are exactly what I want.

  Required case-types — each of these must appear exactly once among the ten:
  1. A case in which you learn the actual content of your peer's reasoning, and it seems to you to contain a specific flaw you can articulate but cannot get them to see in discussion.
  2. A case in which you are one against eleven, all disagreeing with you in the same direction, and — this is the twist I care about — where you have independently checked and rechecked your own work.
  3. A case of disagreement about peer disagreement itself: the reader must be confronted with equally impressive people who give opposite answers to the very question the quiz is asking, and must decide whether their own answer is destabilized by that fact.
  4. A case about an evaluative rather than a purely factual question (for instance, whether a particular grant proposal is fundable), so the quiz can test whether the reader's position is meant to generalize across domains.
  5. A case in which you learn of the peer's view only secondhand, through a reporter whose reliability you cannot assess — to probe whether the source of one's evidence about the disagreement matters.

  Scoring key:
  - It must be runnable with paper and pencil — a pattern-matching key, not a script.
  - It must map answer patterns onto at least: the equal weight or split-the-difference view; the view that first-order evidence can swamp the peer's dissent so that little or no movement is required; the right-reasons view on which you should hold steady when your own reasoning was in fact sound; the lonely steadfast position on which reasonable people can simply remain sure they are the lucky ones; the position on which you can never justifiably rule out that you are the unreliable one, and must therefore dig in; and full withholding. Associate each leaf with the philosophers who defend it in the literature, as far as you can.
  - The key must honestly flag which pairs of positions the quiz cannot separate, and say why (for instance: which concrete case would have been needed to pull apart two views that agree on everything my ten questions test?). I would rather print an honest gap than pretend the instrument is sharper than it is.
  - Finally, include a short section on the empty cells of the logical space: combinations of answers that would be perfectly consistent but that no published position occupies. For each, one sentence diagnosing why — incoherent, merely unattractive, or genuinely unexplored?

  Keep the tone of the quiz questions neutral: the answer options should be equally self-flattering, since my readers will otherwise use vanity as a heuristic.
reasoning: |-
  Here's a thinking process that leads to the suggested quiz:

  1.  **Analyze the Request:**

      *   **Target Audience:** Advanced undergraduates and grad students in philosophy (specifically epistemology). They know the jargon but might be self-deceiving about their actual commitments.
      *   **Goal:** Create a 10-question interactive quiz titled "Which view of peer disagreement do you actually hold?" to expose the gap between labeled affiliations and actual intuitions.
      *   **Format:** 10 short first-person concrete cases. 2-3 answer options each.
      *   **Constraints:**
          *   At least one numerical-confidence question.
          *   At least one suspension vs. outright belief question.
          *   **NO JARGON:** No "conciliationism," "steadfastness," "peer," "higher-order evidence," etc. Describe credentials concretely.
          *   **NO STOCK EXAMPLES:** No restaurant tips, blind wine tastings, jazz-club parking.
          *   **Required Case Types (5 specific ones):**
              1.  Flawed reasoning identified but uncommunicated.
              2.  1 vs. 11 (with independent checking).
              3.  Disagreement about disagreement (self-referential).
              4.  Evaluative (not purely factual).
              5.  Secondhand report of disagreement (unreliable reporter).
          *   **Scoring Key:** Paper-and-pencil compatible (pattern matching). Map to specific views (Equal Weight, Total Evidence/Right Reasons, Lonely Steadfast, Unreliability/Skepticism, Full Withholding). Associate with philosophers.
          *   **Honesty Clause:** Flag gaps/limitations in the quiz's discriminatory power.
          *   **Empty Cells:** Identify consistent but unoccupied logical spaces.
          *   **Tone:** Neutral options (avoid vanity heuristics).

  2.  **Drafting the Questions (Iterative Process):**

      *   *Constraint Check:* Need 10 questions total. 5 specific types required. 5 free slots (but must fit the overall theme). Need numerical confidence and suspension vs. belief.

      *   *Question 1 (Type 1: Flawed Reasoning):* Need a scenario where I see a mistake they made, but they don't see it.
          *   *Draft:* I'm checking a proof. Friend says it's wrong. I see they divided by zero. They say it's fine.
          *   *Refinement:* Make it less math-heavy to avoid "math is special" bias. Let's use code or logic. Let's go with a complex scheduling algorithm.
          *   *Options:* Stick to my gun (I saw the bug), Split difference, Withhold.

      *   *Question 2 (Type 2: 1 vs. 11):* I checked my work, 11 others disagree.
          *   *Draft:* I measured something. 11 others measured differently. I checked my tool.
          *   *Refinement:* Archival research. I found a date. 11 colleagues found a different date. I checked the microfiche twice.
          *   *Options:* Trust my check, Move significantly, Suspend.

      *   *Question 3 (Type 3: Disagreement about Disagreement):* Experts disagree on how to handle disagreement.
          *   *Draft:* Philosophers argue about this quiz.
          *   *Refinement:* A committee is deciding on a protocol for handling conflicting audit results. Half say "average," half say "re-audit."
          *   *Options:* Stick to my protocol, Average the protocols, Suspend on the protocol.

      *   *Question 4 (Type 4: Evaluative):* Grant proposal or aesthetic judgment.
          *   *Draft:* Is this painting good?
          *   *Refinement:* Hiring candidate. Is Candidate A better than B? My colleague says B.
          *   *Options:* Stick, Compromise, Suspend.

      *   *Question 5 (Type 5: Secondhand):* Someone tells me someone disagrees.
          *   *Draft:* Bob told me Alice disagrees.
          *   *Refinement:* A TA tells me a renowned professor disagrees with my interpretation of a text. TA is sometimes flaky.
          *   *Options:* Ignore (bad source), Move a little, Move a lot.

      *   *Question 6 (Numerical Confidence):* Required constraint.
          *   *Scenario:* Weather prediction or medical diagnosis. Let's do medical test interpretation.
          *   *Options:* 90% -> 85%, 90% -> 50%, 90% -> 40%.

      *   *Question 7 (Suspension vs. Belief):* Required constraint.
          *   *Scenario:* Historical fact. Did the treaty sign in 1904 or 1905?
          *   *Options:* Keep believing 1904, Stop believing either (suspend), Believe 1905.

      *   *Question 8 (Free Slot - Track Record):* I've been right before, they haven't.
          *   *Scenario:* Trivia night captain. I have a better track record.
          *   *Options:* Trust my track record, Ignore track record, Average.

      *   *Question 9 (Free Slot - Fatigue/Conditions):* One of us is tired.
          *   *Scenario:* Late night debugging. I had coffee, they didn't.
          *   *Options:* Trust my alert state, Discount the difference, Suspend.

      *   *Question 10 (Free Slot - High Stakes):* Does practical stake matter?
          *   *Scenario:* Bridge safety. If wrong, people die.
          *   *Options:* Be more cautious (move more), Treat same as low stakes, Trust calculation.

      *   *Review against constraints:*
          *   10 questions? Yes.
          *   No jargon? Need to ensure "peer" isn't used. Use "colleague," "equally experienced," etc.
          *   No stock examples? No tips, no wine, no parking.
          *   Required types included? Yes (1, 2, 3, 4, 5).
          *   Numerical? Yes (Q6).
          *   Suspension? Yes (Q7).
          *   Neutral tone? Ensure options don't sound "smart" vs "stubborn."

  3.  **Developing the Scoring Key:**

      *   Need to categorize answers into "Steadfast/Right Reasons," "Conciliationist/Equal Weight," "Skeptic/Withholding," and "Nuanced/Total Evidence."
      *   Let's assign points or patterns. A pattern matching key is better for paper/pencil.
      *   *Pattern A (Steadfast):* Mostly stick to original view.
      *   *Pattern B (Conciliationist):* Mostly split difference or move significantly.
      *   *Pattern C (Skeptic):* Mostly suspend judgment.
      *   *Pattern D (Total Evidence/Right Reasons):* Stick when evidence is strong/checkable, move when ambiguous.
      *   *Philosopher Mapping:*
          *   Equal Weight: Elga, Christensen.
          *   Right Reasons/Total Evidence: Kelly, Lackey, Sosa.
          *   Steadfast (Dogmatic/Lucky): van Inwagen (maybe), some externalists.
          *   Skeptic/Withholding: Pyrrhonian vibes, maybe Feldman (on some readings).
      *   *Gaps:* Distinguishing "Right Reasons" from "Steadfast" is hard without knowing if the reasoning *was* actually right. The quiz can't know truth. I need to flag this.
      *   *Empty Cells:* E.g., "Conciliate on facts, Steadfast on values" (actually common, so maybe not empty). "Conciliate only when stakes are low." (Explored). How about "Suspend on factual, Steadfast on numerical"? Unexplored.

  4.  **Refining the Content (Self-Correction during drafting):**

      *   *Critique:* Are the answer options too leading?
      *   *Fix:* Make sure the "Steadfast" option sounds reasonable (e.g., "I trust my verification") not arrogant ("I know I'm right"). Make sure the "Conciliationist" option doesn't sound weak ("I respect their input") not submissive ("I guess I'm wrong").
