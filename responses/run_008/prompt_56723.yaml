      *   *Wait, the prompt asks for:* "Map answer patterns onto... the equal weight... the view that first-order evidence can swamp... the right-reasons view... the lonely steadfast... the position on which you can never justifiably rule out that you are the unreliable one... and full withholding."
      *   Okay, I need to distinguish Right Reasons from Lonely Steadfast. This is hard in a quiz because the quiz doesn't know who is right.
      *   *Workaround:* The quiz asks about *cases where you checked your work* vs *cases where it's ambiguous*.
      *   *Right Reasons:* Stay in "Checked/Flawed" cases, Move in "Ambiguous" cases.
      *   *Lonely Steadfast:* Stay in almost all cases.
      *   *Equal Weight:* Move in almost all cases.
      *   *Withholding:* Suspend in almost all cases.
      *   *Unreliability/Skeptic:* Move/Suspend specifically when the disagreement suggests *you* might be broken (e.g. 1 vs 11).

      *   *Let's finalize the Questions to ensure they trigger these distinctions.*
