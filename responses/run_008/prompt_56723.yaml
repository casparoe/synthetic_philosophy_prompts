answer: |-
  # Which View of Peer Disagreement Do You Actually Hold?

  **Instructions:** Read each scenario carefully. Imagine you are actually in the situation. Select the option that best describes what you would *do*, not what sounds most modest or most confident. Record your answers (A, B, or C) on a piece of paper.

  ***

  ### 1. The Hidden Glitch
  You and a colleague, who has the same training and access to the same data, are analyzing a complex dataset regarding urban traffic flow. You both run the same simulation. You conclude the new policy will reduce congestion; they conclude it will increase it. In reviewing their notes, you spot a specific parameter they set incorrectly. You point this out. They insist the parameter is correct and refuse to change it, offering a justification that strikes you as circular. You cannot convince them, but you remain certain the parameter is wrong.
  *   **A.** I maintain my original conclusion. Their error invalidates their result, even if they won't admit it.
  *   **B.** I lower my confidence significantly. If they can't see the error, perhaps I am missing something deeper about why they set it that way.
  *   **C.** I withhold judgment on the policy's effect until the parameter issue is independently resolved by a third party.

  ### 2. The Solo Audit
  You are auditing a financial ledger. You conclude there is a discrepancy of $5,000. You check your math three times. You then present your finding to a committee of eleven other auditors, all equally experienced. All eleven independently report that the ledger is balanced. None of them can point to a specific error in your work, but none of them find the discrepancy you see.
  *   **A.** I stand by my finding. I have checked my work multiple times; eleven people missing a discrepancy doesn't make it vanish.
  *   **B.** I assume I am the outlier. I revise my report to state the ledger is balanced, perhaps noting a minor uncertainty.
  *   **C.** I cannot sign off either way. The sheer number of opposing views suggests a systemic issue I cannot detect, so I recuse myself.

  ### 3. The Committee Protocol
  You are on a committee designing a rule for how engineers should react when their safety calculations disagree. Half the committee argues for a rule requiring engineers to average their calculations. The other half argues for a rule requiring engineers to re-calculate until one convinces the other. The committee is deadlocked, and the members on both sides are people you respect as much as yourself.
  *   **A.** I stick to my preferred rule. The merits of the rule don't change just because respected colleagues disagree on which one to pick.
  *   **B.** I propose a hybrid rule that splits the difference between the two approaches.
  *   **C.** I admit I don't know which rule is correct. We should postpone the decision until we have more data on which protocol yields safer outcomes.

  ### 4. The Grant Panel
  You are reviewing a grant proposal for a humanities project. You judge the proposal to be intellectually brilliant and fundable. Your co-reviewer, who has the same publication record and expertise in the field, judges the proposal to be derivative and not fundable. There are no objective metrics here; it is a judgment of quality.
  *   **A.** I maintain my score. Quality judgments are subjective; their disagreement just means they have a different taste, not that I am wrong.
  *   **B.** I adjust my score toward the middle. If an expert sees no value, I must be overestimating the brilliance.
  *   **C.** I refuse to submit a score. If experts cannot agree on quality, the evaluation process itself is broken for this case.

  ### 5. The Rumored Dissent
  You publish a paper interpreting a historical letter. A few weeks later, a graduate student tells you that a famous senior professor in your field said your interpretation is "clearly mistaken." The student is sometimes careless with quotes, and you do not know if the professor saw your full evidence or just the abstract.
  *   **A.** I ignore the report. Until I see the professor's actual arguments, a secondhand rumor carries no weight against my research.
  *   **B.** I become worried. Even a rumor suggests a risk that I have missed something obvious, so I lower my confidence slightly.
  *   **C.** I treat this as a serious defeater. I must assume the professor is right until I can track them down and prove them wrong.

  ### 6. The Weather Model (Numerical)
  You are a meteorologist. Your model predicts a 90% chance of rain tomorrow. A colleague's model, which has performed equally well over the last year, predicts a 10% chance of rain. You have no access to their raw data, only their final percentage.
  *   **A.** I adjust my forecast to roughly 50%. (Significant movement)
  *   **B.** I adjust my forecast to roughly 80% or 85%. (Slight movement)
  *   **C.** I keep my forecast at 90%. (No movement)

  ### 7. The Treaty Date (Suspension)
  You are certain a treaty was signed in 1922. Your colleague is certain it was signed in 1923. You both have access to the same archives. This is a binary fact; it cannot be both.
  *   **A.** I continue to believe it was 1922. I do not switch to believing 1923, nor do I stop believing altogether.
  *   **B.** I stop believing it was 1922. I now believe the date is unknown until further evidence appears.
  *   **C.** I switch to believing it was 1923. Their certainty outweighs mine.

  ### 8. The Track Record
  You and a colleague are answering trivia questions. Over the last month, you have answered 95% of questions correctly. Your colleague has answered 60% correctly. Today, you both answer a question differently. You feel equally confident in this specific instance.
  *   **A.** I trust my answer. The long-term track record suggests I am more reliable generally.
  *   **B.** I treat us as equals for this specific question. Past performance doesn't guarantee today's reliability.
  *   **C.** I trust their answer. My streak might be making me overconfident, and their lower score might mean they are more careful.

  ### 9. The Caffeine Factor
  You are working a night shift. You have had coffee and feel alert. Your colleague has not had caffeine and admits to feeling groggy. You come to different conclusions about a diagnostic test result.
  *   **A.** I trust my conclusion. My cognitive faculties are currently operating at a higher capacity than theirs.
  *   **B.** I discount the difference. Fatigue is subjective; they might be more alert than they feel.
  *   **C.** I withhold judgment. Neither of us is in an optimal state to decide this tonight.

  ### 10. The Bridge Safety (High Stakes)
  You and a colleague calculate the load capacity of a bridge. You say it is safe for heavy trucks. They say it is not. If you are wrong and allow trucks, the bridge could collapse. If they are wrong and ban trucks, traffic will be delayed.
  *   **A.** I hold my position. The stakes don't change the math; if my calculation is right, it's right.
  *   **B.** I move toward their view more than I would in a low-stakes situation. The risk of error demands extra caution.
  *   **C.** I ban the trucks immediately. In cases of expert disagreement on safety, the conservative option is the only rational one.

  ***

  # Scoring Key

  **Step 1: Tally Your Answers**
  Count how many times you selected **A**, **B**, and **C**.
  *   **A (Hold Steady):** \_\_\_\_\_
  *   **B (Move/Conciliate):** \_\_\_\_\_
  *   **C (Withhold/Suspend):** \_\_\_\_\_

  **Step 2: Check Your "Pressure Points"**
  Look specifically at your answers for **Question 1 (Flaw)**, **Question 2 (1 vs 11)**, and **Question 8 (Track Record)**.
  *   Did you hold steady (A) on Q1 and Q8, but move (B) on Q2?
  *   Did you move (B) on almost everything?
  *   Did you withhold (C) on almost everything?

  **Step 3: Match Your Profile**

  ### Profile I: The Total Evidence / Right Reasons View
  *   **Pattern:** High count of **A**, *but* you chose **B** or **C** on Question 5 (Secondhand) or Question 9 (Fatigue). You held steady on Q1 (Flaw) and Q8 (Track Record).
  *   **What this means:** You believe disagreement matters, but only as one piece of evidence. If you have a specific reason to trust your own reasoning (you saw a flaw, you have a better track record, you are alert), you do not split the difference. You weigh the first-order evidence alongside the fact of disagreement.
  *   **Philosophical Associates:** Thomas Kelly, Jennifer Lackey, Ernest Sosa.
  *   **Nuance:** This view claims you should only move if the disagreement *lowers your confidence in your reliability*. If you have independent access to the evidence (Q1), you need not move.

  ### Profile II: The Equal Weight / Conciliationist View
  *   **Pattern:** High count of **B**. You chose **B** on Question 1 (Flaw) and Question 8 (Track Record). You likely chose **A** on Question 10 (Stakes) only if it aligned with splitting the difference.
  *   **What this means:** You believe the fact of disagreement itself is a powerful defeater. Even if you think you are right, the fact that an equally qualified person disagrees forces you to split the difference or significantly lower confidence. You treat the peer's conclusion as having the same weight as your own.
  *   **Philosophical Associates:** Adam Elga, David Christensen, Richard Feldman (on some readings).
  *   **Nuance:** This view is often motivated by the idea that you cannot use your reasoning to validate your reasoning in the face of disagreement (bootstrapping).

  ### Profile III: The Skeptical / Withholding View
  *   **Pattern:** High count of **C**. You chose **C** on Question 2 (1 vs 11), Question 4 (Evaluative), and Question 7 (Suspension).
  *   **What this means:** You believe disagreement undermines justification entirely. When qualified people disagree, the only rational response is to stop believing either side until the dispute is resolved. You view disagreement as a signal that the evidence is insufficient for *anyone*.
  *   **Philosophical Associates:** Pyrrhonian Skeptics, some interpretations of Feldman's Uniqueness Thesis.
  *   **Nuance:** This is the most demanding view. It risks paralysis in fields where disagreement is common (like philosophy or politics).

  ### Profile IV: The Lonely Steadfast / Externalist View
  *   **Pattern:** Almost exclusively **A**. You chose **A** on Question 2 (1 vs 11) and Question 3 (Meta-Disagreement).
  *   **What this means:** You believe that if your belief is formed by a reliable process, the opinion of others does not change its status. You are willing to accept that you might be the "lucky" one who is right while many are wrong. You prioritize the actual connection to the truth over the social fact of consensus.
  *   **Philosophical Associates:** Peter van Inwagen, Alvin Plantinga (in certain contexts), some dogmatists.
  *   **Nuance:** This view avoids paralysis but risks arrogance. It relies heavily on the assumption that your process *is* actually reliable.

  ### Profile V: The Unreliability / Defeater View
  *   **Pattern:** High count of **B** or **C** specifically on Question 2 (1 vs 11) and Question 5 (Secondhand), but **A** on Question 1 (Flaw).
  *   **What this means:** You are sensitive to signs that *you* might be the broken instrument. You hold steady if you see a flaw in them (Q1), but you crumble if the numbers suggest you are the outlier (Q2). You treat disagreement as a trigger to check your own reliability.
  *   **Philosophical Associates:** Sanford Goldberg, some contextualists.
  *   **Nuance:** This is a subset of Total Evidence, but specifically focused on the "diagnostic" value of disagreement regarding your own cognitive health.

  ***

  # Honest Limitations of This Instrument

  **1. The "Right Reasons" vs. "Steadfast" Gap**
  This quiz cannot definitively separate **Profile I (Right Reasons)** from **Profile IV (Lonely Steadfast)**. Why? Because both profiles recommend holding steady in many cases. The difference lies in *why*: The Right Reasons theorist holds steady because they have assessed the first-order evidence and found the peer wanting. The Steadfast theorist holds steady because they trust their own faculty regardless of the peer's assessment. Since this quiz relies on your self-reporting (and you cannot know for sure if you are actually right in the scenarios), a Steadfast theorist and a Right Reasons theorist will often circle the same bubbles. To separate them, we would need a case where you *know* you made a mistake, but the peer agrees with your mistaken conclusion. (We omitted this to avoid confusing the reader).

  **2. The "Math Exception" Blind Spot**
  Many readers claim to be conciliationists "except about math." This quiz includes only one logic/math-adjacent case (Q1). It is possible to be a conciliationist on empirical matters (Q2, Q6) but a steadfaster on formal matters. If you scored Profile II but chose **A** on Q1 and Q6, you hold a "Domain-Specific" view. The scoring key lumps this into Profile I, but it is technically a distinct hybrid position.

  **3. The Truth Assumption**
  Every question asks what you would do when *you* are convinced of X and the peer is convinced of Y. The quiz assumes, for the sake of the scenario, that you have good reasons for X. It cannot test what you do when you suspect *you* are the one who is confused. A complete map of your epistemology would need to ask: "What do you do when you disagree with a peer, and you suspect *they* are right?"

  ***

  # Empty Cells: Logical Possibilities No One Defends

  **1. The Reverse-Confidence View**
  *   *The Position:* "I should split the difference when I am 99% sure, but hold steady when I am 51% sure."
  *   *Diagnosis:* **Incoherent.** Every existing theory suggests that higher confidence in your own reasoning should either increase steadfastness (Right Reasons) or make the disagreement more shocking (Conciliationism), but never make you *more* willing to abandon your view than when you are unsure.

  **2. The Name-Dependent View**
  *   *The Position:* "I should conciliate if my peer's surname begins with A-M, but hold steady if it begins with N-Z."
  *   *Diagnosis:* **Arbitrary.** While logically consistent (it is a rule), it is epistemically unmoored. There is no literature defending this because there is no plausible link between alphabetical order and truth-tracking reliability.

  **3. The Evaluative-Only Skeptic**
  *   *The Position:* "On factual matters (like Q7), I should hold steady. On evaluative matters (like Q4), I must always suspend judgment."
  *   *Diagnosis:* **Unexplored/Unattractive.** Most skepticism runs the other way (facts are hard, values are subjective). A view that claims we can know facts despite disagreement but can never know values despite agreement would require a radical inversion of standard meta-ethical and epistemological commitments. No major paper currently argues for this specific asymmetry.
