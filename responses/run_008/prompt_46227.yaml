prompt: |-
  I've been going down a rabbit hole on the many-worlds interpretation ever since a friend (physics undergrad, very smug about it) told me probability is no problem there because "both outcomes happen, so obviously it's 50/50." The thing I keep running into, and that I want a proper name for, goes like this. When people explain it in the easy case -- equal amplitudes, one world where the particle goes left, one where it goes right -- they say of course you assign 50/50, the branches are symmetric, you've got no reason to prefer one over the other, just count them. But then you ask about an unequal split, 90/10 amplitudes, and suddenly the same people say branch counting is meaningless, because how many worlds there are depends on how finely you carve up the decoherence, the number isn't even well defined -- what matters is squared amplitude, the "measure" or "weight" of the branches. So the rule that produced the answer in the symmetric case (indifference across equally numerous branches) is not the rule they actually use anywhere it matters. The swapped-in rule agrees with the first one exactly in the cases where any rule whatsoever would agree. It's like validating a bathroom scale by testing it on objects where every scale reads the same, then trusting it on the discriminating cases for entirely different reasons and still citing the first test as the validation.

  Is there an established name for this specific problem or move? I have half-remembered fragments from my reading -- I think "branch counting" is an actual term people use, and I've seen "typicality" and something like "self-locating uncertainty" -- but I can't tell which, if any, is the thing I'm pointing at, and I don't want to fake fluency I don't have. So please tell me what the nearest real concepts are, how what I described differs from each (or whether it doesn't and I just stumbled onto a known debate), and, separately, whether the switching-move itself -- motivating a rule on non-discriminating cases and then quietly swapping in a different rule once the cases get discriminating -- has a name of its own. If it doesn't, coin one and give me the boundary cases: for instance, does it still count when the swapped-in rule is independently justified, which I gather is what Everettians claim about decision-theoretic derivations of the Born rule?

  And be upfront about where this could all fall apart -- I'd want you to flag which parts of your answer are you reconstructing the debate from general principles versus actually knowing the literature, and what would make you revise your verdict about whether the concept exists or about whether I've even described the Everettian position fairly in the first place. If I've mischaracterized what proponents say about the symmetric case, that changes everything, so tell me.
