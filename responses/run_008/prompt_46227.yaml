answer: |-
  This is an exceptionally sharp critique. You have identified the central tension in the philosophy of the Many-Worlds Interpretation (MWI), often called the **Quantitative Probability Problem** (or sometimes the **Incoherence Problem**).

  You are asking for specific terminology, an assessment of whether your characterization is fair, and a name for the logical move you perceive. Here is the breakdown, including where my knowledge is solid and where I am reconstructing the dialectic from general principles.

  ### 1. The Established Terminology

  You are correct that "branch counting" is a real term. Here is how the concepts map to your description:

  *   **Branch Counting:** This is exactly what you described. It is the naive view that probability is determined by the number of distinct outcomes (worlds). **Crucially:** Almost no serious Everettian proponent defends branch counting as a fundamental rule. They agree with you that it is ill-defined because the number of branches depends on the basis (how you "carve" the decoherence).
  *   **The Incoherence Problem:** This is the broader philosophical issue: "If everything happens, what does it mean to say one outcome is 'probable'?"
  *   **The Quantitative Problem:** This is your specific objection: "Even if we accept probability makes sense, why is it given by the *Born Rule* (squared amplitude) rather than simple counting?"
  *   **Self-Locating Uncertainty:** This is a concept championed by Sean Carroll, Chip Sebens, and Lev Vaidman. It attempts to solve the Incoherence Problem by arguing that an observer, upon splitting, doesn't know *which* branch they are on. It tries to ground probability in ignorance, not frequency.
  *   **Typicality:** You mentioned this. It is more commonly associated with Bohmian Mechanics or Statistical Mechanics (e.g., "we are in a typical branch"). In MWI, it is sometimes used to argue that branches with low measure are "atypical," but it is not the primary engine for deriving the Born Rule in the Deutsch-Wallace program.

  ### 2. The "Switching Move": Does it have a name?

  There is no single, canonical phrase in the literature like "The Everettian Bait-and-Switch." However, the logical structure you are identifying is widely discussed under the header of **Circularity in Derivations of the Born Rule**.

  Critics (most notably **Adrian Kent** and **Huwe Price**) argue exactly what you are arguing: that the derivations smuggle in the conclusion via the symmetry assumptions.

  If we were to coin a name for the specific rhetorical move you described—motivating a rule on non-discriminating cases and swapping it for discriminating cases—I would propose:

  **The Symmetry-Measure Equivocation.**

  *   **Definition:** Arguing for equal probability in symmetric cases based on *indifference* (implying a count of outcomes), then arguing for unequal probability in asymmetric cases based on *measure* (denying the count of outcomes), without providing a non-circular bridge that explains why indifference tracks measure rather than count.
  *   **Boundary Case (Independent Justification):** You asked if it still counts if the swapped-in rule is independently justified. Everettians (specifically David Deutsch and David Wallace) claim it *is* independently justified via **Decision Theory**. They argue that a rational agent *must* bet according to the Born Rule to avoid being Dutch-booked (exploited in a series of bets), regardless of branch counting.
      *   *The Critic's Counter:* Critics argue the axioms of the decision theory (e.g., "Diachronic Consistency") secretly presuppose the Born Rule. If the justification isn't truly independent, the Equivocation holds.

  ### 3. Fairness Check: Did you characterize the proponents fairly?

  **This is the most important section.** I need to flag a significant distinction here.

  **Your Friend vs. The Literature:**
  You wrote: *"When people explain it in the easy case... they say of course you assign 50/50, the branches are symmetric, you've got no reason to prefer one over the other, just count them."*

  *   **Your Friend (The Undergrad):** This is a very common *pedagogical* simplification. It is intuitive but technically incorrect within the formal MWI framework.
  *   **The Proponents (Deutsch, Wallace, Saunders):** They do **not** typically argue "50/50 because there are two branches." They argue "50/50 because the **state vector** is symmetric under exchange."
      *   *The Distinction:* They try to avoid ontological commitment to "branches" as countable objects. They treat the wavefunction as the fundamental reality. In a 50/50 superposition, the *math* is symmetric. In a 90/10 superposition, the *math* is asymmetric.
      *   *Your Critique's Force:* Your critique remains potent because the question is: **Why does symmetry of the math imply symmetry of probability?**
      *   If you say "Symmetry implies 50/50," you are invoking a **Principle of Indifference**.
      *   If you then say "Asymmetry implies 90/10 (via squared amplitude)," you are invoking a **Measure**.
      *   The critique is: Why does the Principle of Indifference apply to the *amplitude* rather than the *branch count*? If branches are emergent and fuzzy, why is the amplitude "real" enough to ground probability?

  **Verdict on Fairness:**
  You have accurately characterized the *intuitive* defense often given (and likely by your friend). You have less accurately characterized the *technical* defense (which avoids explicit branch counting even in the 50/50 case). **However**, critics argue the technical defense collapses into the intuitive one anyway. If the "symmetry of the state" is doing the work, one must explain why that symmetry maps to probability without secretly assuming a measure.

  So, while the *proponents* might deny they ever used branch counting, **Adrian Kent** (a prominent physicist and critic of MWI) would agree with your assessment: the symmetry argument in the 50/50 case is only compelling if you implicitly assume a measure that makes the branches "equal," which begs the question for the 90/10 case.

  ### 4. Where This Could Fall Apart (Uncertainty & Limitations)

  I need to be upfront about the limits of my knowledge here, as requested.

  1.  **Reconstruction vs. Citation:** I am confident in the terms "Branch Counting," "Incoherence Problem," and "Decision-Theoretic Derivation." I am less certain about the specific phrasing of every objection in the last 5 years of *Studies in History and Philosophy of Modern Physics*. My analysis of the "Symmetry-Measure Equivocation" is a reconstruction of the logical structure of the debate (specifically drawing from Kent's 2010 critiques and Wallace's 2012 book *The Emergent Multiverse*), not a direct quote of an existing label.
  2.  **The "Smug Undergrad" Factor:** There is a high probability your friend simplified the position. If you confront a hardline Everettian with your objection, they will likely say: "We never counted branches. We used the Gleason Theorem / Decision Theory / Symmetry of the Hilbert Space."
      *   *Risk:* If you accuse them of "branch counting," they will deny it. You must frame it as: "Your symmetry argument in the 50/50 case relies on an indifference principle that you cannot consistently apply in the 90/10 case without assuming the Born Rule beforehand."
  3.  **Alternative Derivations:** There are other attempts to derive the Born Rule (e.g., Zurek's **Envarment**). They attempt to use entanglement-assisted invariance to derive probabilities without decision theory. Your critique applies there too (does envarment secretly assume equal weight?), but the terminology would shift slightly.
  4.  **My Confidence:** I am 90% confident that "Branch Counting" is the rejected term you are looking for. I am 80% confident that "Symmetry-Measure Equivocation" captures the logical move you identified, though it is not standard jargon. I am 95% confident that Adrian Kent is the specific author whose papers best match your intuition (search for "Adrian Kent Many Worlds Probability").

  ### Summary for your next conversation

  If you want to sound fluent without faking it:

  1.  **Don't say:** "You are counting branches." (They will deny this).
  2.  **Do say:** "You are relying on a **Principle of Indifference** in the symmetric case that you disavow in the asymmetric case."
  3.  **Name the problem:** "This is the **Quantitative Probability Problem**, specifically the tension between **branch counting** and **measure**."
  4.  **Name the move:** "It looks like a **Symmetry-Measure Equivocation**. You use symmetry to justify indifference when the measures are equal, but claim measure matters when they aren't, without explaining why symmetry tracks measure rather than branch topology."
  5.  **Cite the critic:** "Adrian Kent makes this point explicitly regarding the circularity of the Deutsch-Wallace derivation."

  This acknowledges the nuance (you aren't accusing them of naive counting) while maintaining the force of your logical objection (the justification switches mid-stream).
