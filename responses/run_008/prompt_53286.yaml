prompt: |-
  I'm teaching a second-year rational choice course this term and next week I have a 90 minute session with about 25 students on decision making under uncertainty. I want to do the Ellsberg-style urn comparison, but I don't want it to just be me polling the class and announcing they're irrational. My plan is they should run into the problem themselves. The setup I had in mind: two big jars of balls (or envelopes with colored cards, honestly cards are easier to carry), Jar A with a known 50/50 split of red and black, Jar B with 100 red and black balls in a completely unknown ratio. They each have to pick a jar and a color, and they win a raffle ticket for a small prize if their color comes up. Then, without a break, a second round with the same jars but a payoff change or a forced color swap, so that when we count hands at the end we can see whether the same students who avoided the unknown jar in round 1 also avoided it in round 2 — which is the part that can't be explained by any single belief about what's in Jar B. I want that reveal to land in the debrief, not before.

  Two extra things I'd like you to work in, because the plain version of this demo feels too well-worn. First, a trading round: after the initial choices, each student holds a ticket for a specific bet, and we run a few minutes of open trading where they can sell their ticket or buy someone else's, and we track prices. My hunch is that ambiguity aversion that shows up in a one-shot forced choice partly evaporates when you actually have to post a price for the thing, and I'd rather the activity let us see whether that's true than have me assert it. Second, I want to give one or two students a designated "bookie" role: their job is to try to profit off classmates whose willingness-to-buy and willingness-to-sell prices for bets on Jar B are all below fair value. I have this idea that you can't price every color in the unknown jar below 1/2 (or below its counterpart in the known jar) without being exploitable, but I'm not 100% sure how to set the bookie's constraints up concretely so it works in 90 minutes without money changing hands.

  So: full rules, materials, a timeline, the payoff scheme in raffle tickets or extra credit or whatever works, and a debrief that maps what happened onto the sure-thing principle and onto the question of whether dodging the unknown jar is a bias or a sensible response to a world where whoever filled the jar might be out to get you. Tell me honestly what will predictably go wrong the first time I run this (I'm guessing noisy prices with only 25 traders, and students who trade just for fun), and whether the trading round can actually show what I want or whether it overloads the session. Also, should I name maxmin expected utility in the debrief, or save it for the following lecture and let this session end on the puzzle?
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Second-year rational choice course, 90-minute session, ~25 students.
      *   **Topic:** Decision making under uncertainty (Ellsberg Paradox).
      *   **Goal:** Students discover the inconsistency themselves (not just told).
      *   **Core Mechanism:** Two jars (Known 50/50 vs. Unknown ratio). Two rounds of betting to reveal inconsistency (preferring Known Red over Unknown Red, then Unknown Black over Known Black).
      *   **Innovation 1 (Trading):** Add a market/trading phase where students hold tickets and trade. Hypothesis: Ambiguity aversion might decrease when pricing/trading.
      *   **Innovation 2 (Bookie):** Designate 1-2 students as "bookies" to exploit inconsistent pricing (Dutch Book argument). Needs concrete constraints to work without real money.
      *   **Deliverables:** Full rules, materials, timeline, payoff scheme, debrief structure, prediction of pitfalls, advice on theoretical depth (Maxmin EU).
      *   **Tone:** Practical, honest about pitfalls, pedagogical.

  2.  **Deconstruct the Ellsberg Logic:**
      *   *Standard Paradox:*
          *   Bet 1: Red A (Known) vs. Red B (Unknown). Most pick Red A. Implies $P(Red_B) < 0.5$.
          *   Bet 2: Black A (Known) vs. Black B (Unknown). Most pick Black B. Implies $P(Black_B) > 0.5 \Rightarrow P(Red_B) < 0.5$.
          *   Wait, if $P(Red_B) < 0.5$ and $P(Black_B) > 0.5$, that's consistent ($P(Red) + P(Black) = 1$).
          *   *Correction:* The standard Ellsberg inconsistency is:
              *   Choice 1: Red A vs. Red B. (Pick A $\rightarrow$ believe $P(R_B) < 0.5$)
              *   Choice 2: Black A vs. Black B. (Pick B $\rightarrow$ believe $P(R_B) < 0.5$)
              *   *Wait, check the logic:* If I pick Red A over Red B, I think Red A is more likely. $0.5 > P(R_B)$. If I pick Black B over Black A, I think Black B is more likely. $P(B_B) > 0.5 \Rightarrow 1 - P(R_B) > 0.5 \Rightarrow P(R_B) < 0.5$.
              *   *Actually, the classic inconsistency is:*
                  *   Pref Red A > Red B (implies $P(R_B) < 0.5$)
                  *   Pref Black B > Black A (implies $P(B_B) > 0.5 \rightarrow P(R_B) < 0.5$)
                  *   *Wait, that's consistent.*
                  *   *Let's re-verify the standard Ellsberg setup.*
                  *   Urn 1: 50 R, 50 B.
                  *   Urn 2: 100 R+B (unknown).
                  *   Act 1: Win if Red from Urn 1. Act 2: Win if Red from Urn 2. (Most choose Act 1).
                  *   Act 3: Win if Black from Urn 1. Act 4: Win if Black from Urn 2. (Most choose Act 4).
                  *   If Act 1 > Act 2: $0.5 > P(R_2)$.
                  *   If Act 4 > Act 3: $P(B_2) > 0.5 \Rightarrow 1 - P(R_2) > 0.5 \Rightarrow P(R_2) < 0.5$.
                  *   *Wait, this is consistent.* Why is it a paradox?
                  *   *Ah, the Sure Thing Principle violation:*
                  *   If I prefer Red 1 to Red 2, I should prefer (Red 1 or Black 2) to (Red 2 or Black 2)... no.
                  *   *Let's stick to the subjective probability interpretation:*
                  *   Choice 1: $R_1$ vs $R_2$. Prefer $R_1 \Rightarrow P(R_2) < 0.5$.
                  *   Choice 2: $B_1$ vs $B_2$. Prefer $B_2 \Rightarrow P(B_2) > 0.5 \Rightarrow P(R_2) < 0.5$.
                  *   *Wait, most people prefer $R_1$ and $B_1$.*
                  *   *Correction:* Most people prefer $R_1$ over $R_2$ AND $B_1$ over $B_2$.
                  *   If $R_1 > R_2 \Rightarrow 0.5 > P(R_2)$.
                  *   If $B_1 > B_2 \Rightarrow 0.5 > P(B_2) \Rightarrow 0.5 > 1 - P(R_2) \Rightarrow P(R_2) > 0.5$.
                  *   Contradiction: $P(R_2) < 0.5$ AND $P(R_2) > 0.5$.
                  *   *Okay, the prompt says:* "same students who avoided the unknown jar in round 1 also avoided it in round 2".
                  *   Round 1: Pick Jar/Color. (Most pick Known Jar).
                  *   Round 2: Payoff change or forced color swap.
                  *   To show the paradox, Round 2 must switch the color bet on the Known Jar.
                  *   Round 1: Bet on Red. (Pick Known).
                  *   Round 2: Bet on Black. (Pick Known).
                  *   If they pick Known both times, they imply $P(Red_{Unknown}) < 0.5$ AND $P(Black_{Unknown}) < 0.5$. Sum < 1. Impossible.
      *   *Plan Adjustment:* Ensure Round 2 forces the color switch on the Known Jar to reveal the contradiction.

  3.  **Designing the Trading & Bookie Component:**
      *   *Constraint:* No real money. Raffle tickets/Extra credit.
      *   *Bookie Role:* Needs to be able to "buy low, sell high" based on student inconsistencies.
      *   *Mechanism:* Students get an endowment of tickets (e.g., "Ticket A: Wins if Red in Known", "Ticket B: Wins if Red in Unknown").
      *   *Trading:* Double auction or open outcry? With 25 students and 90 mins, open outcry is chaotic. Call market (collect bids/asks) is slower. Maybe a "trading pit" for 5 mins.
      *   *Bookie Exploit:* If a student values Unknown Red at \$0.40 and Unknown Black at \$0.40, the Bookie can sell both to them for \$0.90 total. One *must* win (since R+B=100). The Bookie pays \$1.00. Bookie loses \$0.10.
      *   *Wait, the Bookie needs to profit.*
      *   If Student values Unknown Red at \$0.40 (WTP) and Unknown Black at \$0.40 (WTP).
      *   Bookie sells Red Ticket for \$0.45. Sells Black Ticket for \$0.45. Total Revenue \$0.90.
      *   Outcome: One ticket pays \$1.00. Bookie pays \$1.00. Net Loss \$0.10.
      *   *To profit:* Bookie needs to *buy* the pair for less than \$1.00 or *sell* the pair for more than \$1.00.
      *   *Ambiguity Aversion:* Students value Unknown tickets *low*. Say \$0.40 each.
      *   Bookie *buys* Red for \$0.45. Bookie *buys* Black for \$0.45. Total Cost \$0.90.
      *   Outcome: One ticket pays \$1.00 to Bookie. Bookie Profit \$0.10.
      *   *Yes, this works.* The Bookie acts as a liquidity provider/market maker who aggregates the ambiguity premium.
      *   *Constraint:* Bookie needs to identify these students quickly.
      *   *Solution:* Pre-trade survey or "posting prices" on a board. Let's have students write their "Minimum Selling Price" on their ticket before trading starts. Bookie scans for low prices.

  4.  **Timeline Management (90 Minutes):**
      *   Intro/Setup: 10 min.
      *   Round 1 (Choice): 10 min.
      *   Round 2 (Choice - Color Switch): 10 min.
      *   Debrief Choice (The Paradox): 15 min.
      *   Trading Setup & Endowment: 10 min.
      *   Trading Session: 15 min.
      *   Bookie Reveal/Profit Check: 10 min.
      *   Final Debrief (Theory & Normative): 20 min.
      *   *Risk:* This is tight. 90 minutes flies. The trading might eat the debrief.
      *   *Recommendation:* Simplify the trading. Don't do full open outcry. Do a "posted price" market or just a bilateral negotiation phase. Let's suggest a "Market Phase" where they can trade with neighbors, but the Bookie has special rights.
      *   *Actually, to ensure the Bookie works:* The Bookie needs to see the prices. Let's make it a "Sealed Bid/Ask" phase first, then Bookie executes trades, then general trading.
      *   *Better:* Keep it simple. Students hold tickets. They can trade with anyone. Bookie roams.
      *   *Critical Path:* The paradox reveal must happen *before* trading, otherwise trading rationalizes the behavior.
      *   *Revised Order:*
          1.  Setup & Round 1 (Choice).
          2.  Round 2 (Choice - Switch Color).
          3.  Reveal Paradox (Hand count).
          4.  Trading Phase (Endowments based on choices or random?).
          5.  Bookie Exploit.
          6.  Final Theory.

  5.  **Addressing the "Predictably Go Wrong" Section:**
      *   *Noise:* 25 students is small. Might not get a clean majority.
      *   *Gaming:* Students might try to "help" the paradox happen.
      *   *Trading Chaos:* Without real money, trading is low stakes.
      *   *Bookie Confusion:* Student bookies might not understand arbitrage.
      *   *Time:* 90 mins is very short for all this.

  6.  **Addressing the Theory (Maxmin EU):**
      *   *Question:* Name it now or later?
      *   *Advice:* Introduce the *concept* (pessimism/sets of priors) but save the formal name/math for next time. End this session on the "Is it rational?" question. It creates suspense.

  7.  **Drafting the Plan (Iterative refinement):**
      *   *Materials:* Two clear bins. Red/Black cards. Printed tickets (crucial for trading).
      *   *Payoffs:* Raffle for a gift card or significant extra credit points. Needs to be enough to care, not enough to cause stress.
      *   *Bookie Rules:* Give them a "bank" of tickets. They profit if they end with more value than they started.
      *   *Trading:* Limit to 5-7 minutes.
      *   *Debrief:* Connect to Savage's Sure Thing Principle. Connect to "Adversarial Nature" (Gilboa-Schmeidler intuition).

  8.  **Refining the Bookie Mechanism (Crucial Step):**
      *   If students are ambiguity averse, they value Unknown Red < 0.5 and Unknown Black < 0.5.
      *   Sum of values < 1.0.
      *   Bookie buys Red Ticket from Student 1 for $0.45.
      *   Bookie buys Black Ticket from Student 2 for $0.45.
      *   Bookie holds both. Cost $0.90.
      *   Draw from Unknown Jar. One ticket wins $1.00.
      *   Bookie Profit: $0.10.
      *   *Instruction:* Bookie needs to find students willing to *sell* their Unknown tickets cheap.
      *   *Endowment:* Give everyone an Unknown Ticket (either Red or Black) to start the trading phase? Or let them keep their Round 2 winnings?
      *   *Better:* Give everyone *both* an Unknown Red and Unknown Black ticket (hypothetically) or split the class.
      *   *Simplest:* After the choice rounds, distribute "Asset Certificates". Half the class gets "Pays $1 if Unknown Red". Half gets "Pays $1 if Unknown Black".
      *   *Wait, if I give them assets, they might hold rather than trade.*
      *   *Let's go with:* Everyone gets one ticket based on their Round 2 choice. Then we open a market for the *other* color.
      *   *Actually, for the Dutch Book to work cleanly:* We need to show that *individual* pricing is inconsistent.
      *   *Revised Bookie Task:* The Bookie offers to buy *both* bets from any single student.
      *   Student holds "Unknown Red" ticket. Bookie offers to buy it + sell them "Unknown Black" ticket?
      *   *No, keep it simple.* Bookie's goal: Acquire a "Hedge" (One Red Ticket + One Black Ticket from the Unknown Jar) for less than the payout ($1).
      *   Students will sell Unknown tickets cheap due to ambiguity aversion.
      *   Bookie buys Red Ticket from Student A ($0.40). Buys Black Ticket from Student B ($0.40).
      *   Bookie now holds the sure thing (one will win). Cost $0.80. Payout $1.00.
      *   *This requires coordination between students A and B.*
      *   *Alternative:* Bookie approaches Student A. "I'll buy your Red ticket for $0.45. I'll also sell you a Black ticket for $0.45."
      *   Student A thinks: "I hate uncertainty. I get cash now ($0.45) and if Red loses, Black wins, so I'm hedged?"
      *   If Student A is ambiguity averse, they might still value the Black ticket at only $0.40 (WTP). So they won't buy for $0.45.
      *   *Okay, the Cross-Student Arbitrage is more robust.* Bookie aggregates the market.
      *   *Instruction to Bookie:* "Your goal is to end the session holding one Red Ticket and one Black Ticket from Jar B. If you acquire this pair for a total cost of less than 1 Raffle Ticket (or equivalent value), you win a bonus."

  9.  **Final Review against Constraints:**
      *   90 mins? Tight but doable if trading is capped.
      *   25 students? Enough for a market, small enough for noise.
      *   No real money? Use raffle tickets as currency.
      *   Debrief? Focus on Sure Thing Principle vs. Ambiguity.
      *   Maxmin EU? Tease it, don't teach it.

  10. **Writing the Response:**
      *   Structure: Logistics, Timeline, Step-by-Step Rules, Bookie Mechanics, Debrief Script, Pitfalls.
      *   Tone: Collegial, experienced, realistic.

  *(Self-Correction during drafting)*: I need to make sure the "Round 2" choice actually forces the paradox.
  *   Round 1: Choose between (Known Red) and (Unknown Red).
  *   Round 2: Choose between (Known Black) and (Unknown Black).
  *   If they choose Known both times -> Paradox.
  *   Make sure the instructions don't let them switch jars *and* colors freely in a way that confuses the record. Keep it binary choice on the slide/handout.

  *(Refining the Trading)*: Trading might take too long. I will suggest a "Limit Order Book" on the whiteboard to speed it up, or just bilateral trading with the Bookie as the main actor. Let's recommend the Bookie as the primary trader to save time, with students allowed to trade amongst themselves if they wish. This focuses the "exploitation" narrative.

  *(Refining the Payoff)*: Raffle tickets are good. 1 Ticket = 1 Entry. Bookie bonus = 5 Entries. Prize = $25 Gift Card.

  *(Refining the Theory)*: Definitely save Maxmin EU formalism for next time. Use this session to motivate *why* we need it.

