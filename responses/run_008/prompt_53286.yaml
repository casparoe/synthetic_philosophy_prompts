answer: |-
  This is a fantastic plan. It moves the Ellsberg paradox from a "gotcha" moment to an experiential lesson in market consistency and the limits of subjective probability. However, 90 minutes is extremely tight for two rounds of choice, a trading session, *and* a robust debrief. The trading component is the highest risk for time overruns.

  Below is a concrete lesson plan designed to keep the clock while preserving the pedagogical punch.

  ### 1. Logistics & Materials

  *   **Room:** Needs a whiteboard and space for students to mingle (for trading).
  *   **Props:**
      *   **Jar A (Known):** Clear bin with exactly 50 Red and 50 Black cards (or ping pong balls). Show them the count *before* sealing it.
      *   **Jar B (Unknown):** Opaque bin with 100 Red/Black cards in an unknown ratio (prepare this beforehand; do not let them see inside).
      *   **Betting Slips:** Pre-printed slips (see below).
      *   **Currency:** "Raffle Tickets" (physical slips).
      *   **Prize:** One $25–$50 gift card (or equivalent extra credit weight).
  *   **Handouts:** A simple decision sheet for Round 1 and Round 2 to record choices anonymously but traceably (e.g., student ID number).

  ### 2. The Payoff Scheme

  To make trading meaningful without real money, you need a currency that maps to the prize.
  *   **Base Endowment:** Every student gets **2 Raffle Tickets** at the start of the Trading Phase.
  *   **Bet Value:** A winning bet pays **1 Raffle Ticket**.
  *   **Bookie Bonus:** If the Bookie successfully executes a "Dutch Book" (detailed below), they get **5 Bonus Tickets**.
  *   **The Prize:** At the end of class, draw one name from the pool of all accumulated tickets.

  ### 3. Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Setup & Round 1** | Explain jars. Bet on **Red**. Choose Jar A or Jar B. |
  | **10–20** | **Round 2** | Same jars. Bet on **Black**. Choose Jar A or Jar B. |
  | **20–35** | **The Reveal** | Count hands. Show the inconsistency. Brief intro to Sure Thing Principle. |
  | **35–45** | **Trading Setup** | Distribute assets. Explain Bookie role. |
  | **45–60** | **Market Session** | Open trading. Bookie hunts for arbitrage. |
  | **60–70** | **Settlement** | Draw Jar B. Pay out winners. Announce Bookie profit. |
  | **70–90** | **Final Debrief** | Connect trading results to theory. Normative vs. Descriptive. |

  ### 4. Step-by-Step Rules

  #### Phase 1: The Choice (00–20 mins)
  1.  **Display Jars:** Show Jar A (50/50 counted publicly). Show Jar B (sealed, unknown).
  2.  **Round 1:** "You win a ticket if **Red** is drawn. Which jar do you bet on?" (Students mark sheets).
  3.  **Round 2:** "You win a ticket if **Black** is drawn. Which jar do you bet on?" (Students mark sheets).
      *   *Crucial:* Do not let them discuss between rounds.
  4.  **Collect Sheets:** Keep these for the reveal.

  #### Phase 2: The Reveal (20–35 mins)
  1.  **Show of Hands:** "Who picked Jar A for Red?" (Likely majority). "Who picked Jar A for Black?" (Likely majority).
  2.  **The Trap:** "If you picked Jar A both times, you implied that Red in Jar B is *less* than 50% likely, AND Black in Jar B is *less* than 50% likely. Mathematically, that's impossible. One of them must be ≥50%."
  3.  **Concept:** Introduce the **Sure Thing Principle** (Savage). If you prefer A over B when Red wins, and A over B when Black wins, you should prefer A over B regardless of the color.
  4.  **Transition:** "Most of you just violated expected utility theory. Is this a bias? Or is there a hidden cost to uncertainty? Let's put a price on it."

  #### Phase 3: The Market & Bookie (35–60 mins)
  **The Setup:**
  *   Ignore the previous choices for asset distribution. To ensure liquidity, distribute assets randomly or uniformly.
  *   **Endowment:** Give every student **1 Asset Certificate**.
      *   Half the class gets: *"Pays 1 Ticket if Jar B is Red."*
      *   Half the class gets: *"Pays 1 Ticket if Jar B is Black."*
  *   **Cash:** Give every student **2 Raffle Tickets** (cash).
  *   **The Bookie:** Select 1–2 sharp students. Give them **10 Raffle Tickets** (capital) and no assets. Their goal: End the session with more value than they started.

  **The Rules:**
  1.  **Trading:** Students can trade Assets for Cash with anyone.
  2.  **Pricing:** Prices are public (write trades on the board).
  3.  **Bookie Special Rule:** The Bookie is allowed to make "Bundle Offers." They can offer to buy a Red Certificate *and* a Black Certificate from *different* students in a single package deal.
  4.  **Time Limit:** 15 minutes hard stop.

  **The Bookie's Strategy (Private Instruction):**
  *   Hand the Bookie a cheat sheet: *"Ambiguity averse students will sell Unknown tickets for less than 0.5 Tickets. If you buy a Red Ticket for <0.5 and a Black Ticket for <0.5, you hold a guaranteed winner (one must pay 1.0) for a total cost of <1.0. That is risk-free profit."*
  *   Their target: Find students willing to sell their Unknown Jar certificates cheap.

  #### Phase 4: Settlement & Debrief (60–90 mins)
  1.  **Draw:** Draw one ball from Jar B. Pay out all Asset holders.
  2.  **Bookie Audit:** Did the Bookie acquire a Red/Black pair for <1.0 total cost?
      *   *If Yes:* They made risk-free profit. Hand them the bonus tickets.
      *   *If No:* Discuss why (prices were efficient, or students held out).
  3.  **Discussion:**
      *   **Prices:** Did the Known Jar bets trade near 0.5? Did Unknown Jar bets trade lower (e.g., 0.40)?
      *   **The Puzzle:** If everyone prices Unknown at 0.40, the market clears, but the Bookie exploits it. Does the Bookie's profit prove the students were irrational?
      *   **Adversarial Nature:** Ask: "Why did you discount Jar B?" (Answers: "Didn't trust the setup," "Felt risky").
      *   **Theory:** Introduce the idea that maybe probabilities aren't single numbers. Maybe they are *sets* of probabilities (0 to 1).
      *   **Maxmin EU:** **Do not teach the math yet.** Say: "Next time, we'll look at a model (Maxmin Expected Utility) that treats this discounting not as a mistake, but as a rational response to not knowing the rules of the game. For now, sit with the tension: Is it a bias, or is the world actually adversarial?"

  ### 5. What Will Predictably Go Wrong

  1.  **The "Clean" Paradox Fails:** With 25 students, you might get 13 who pick Known/Known and 12 who mix. The inconsistency won't be universal.
      *   *Fix:* Don't say "Everyone did this." Say "Look at the aggregate. 60% of you did this. That's enough to break the market."
  2.  **Trading Paralysis:** Students won't trade because "it's fake money."
      *   *Fix:* Make the Prize desirable. Also, the Bookie needs to be aggressive. Instruct the Bookie beforehand to *approach* people, not wait. "I'll buy that ticket for 0.60. Take it or leave it."
  3.  **Bookie Confusion:** The student Bookie might not grasp the arbitrage quickly enough.
      *   *Fix:* Give the Bookie a 2-minute private briefing during the Trading Setup phase. Show them the math: $0.40 + 0.40 = 0.80$ cost for $1.00$ guaranteed return.
  4.  **Time Creep:** The trading session will run long.
      *   *Fix:* Use a visible timer. At 5 minutes remaining, announce "Market Closing Soon."
  5.  **Jar B Composition:** If Jar B happens to be 50/50, students feel vindicated. If it's 90/10, the "losers" feel cheated.
      *   *Fix:* Emphasize that the *ex-ante* decision is what matters, not the outcome. The paradox exists regardless of the draw.

  ### 6. Advice on the Trading Round

  **Can it show what you want?**
  Yes, but only if the "currency" feels real. If students treat raffle tickets as worthless, prices will be random noise.
  *   **Recommendation:** To reduce noise, consider a **Call Market** instead of continuous trading.
      *   Ask everyone to write down their "Lowest Selling Price" for their asset on a slip of paper.
      *   Collect them.
      *   You (the instructor) act as the market maker alongside the Bookie.
      *   This generates a clean dataset of prices you can project on the screen immediately.
      *   *However,* this loses the "Bookie hunting" dynamic.
      *   **Compromise:** Do 5 minutes of open trading, then 5 minutes of "Sealed Offers" to the Bookie. This ensures you get the data even if the open market is chaotic.

  **Does it overload the session?**
  It is high risk. If the choice paradox reveal runs long (it usually does, students love arguing about it), the trading will feel rushed.
  *   **Contingency:** If you are behind at minute 40, **cut the student-to-student trading.** Let only the Bookie trade with the class. This preserves the "exploitation" lesson without the chaos of 25 people negotiating.

  ### 7. Theory: To Name or Not to Name?

  **Do not teach Maxmin Expected Utility (MEU) formally in this session.**
  *   **Reason:** You want the session to end on the *puzzle*, not the *solution*. If you give them the model, they will stop worrying about the paradox.
  *   **Strategy:** Use the term **"Ambiguity Aversion"** (descriptive) but save **"Maxmin Expected Utility"** (formal model) for Lecture 2.
  *   **Closing Line:** "Today we saw that standard rational choice breaks down when probabilities are unknown. Some call this a bias. Others call it prudence. Next week, we'll build a math model that lets you be prudent without being irrational."

  ### 8. Bookie Constraints (Concrete Setup)

  To ensure the Bookie works without money changing hands physically (which is messy):

  1.  **The Ledger:** The Bookie has a "Ledger Sheet."
  2.  **Transaction:** When the Bookie buys a ticket from a Student:
      *   Student signs the back of the Asset Certificate over to the Bookie.
      *   Bookie writes the Student a "Chit" for the agreed Raffle Ticket price.
      *   Bookie records the cost on their Ledger.
  3.  **Settlement:** At the end, the Instructor redeems the Chits (giving Raffle Tickets to students) and checks the Bookie's Ledger.
      *   If Bookie holds 1 Red + 1 Black Certificate: They are guaranteed 1 Ticket payout.
      *   If Total Cost on Ledger < 1 Ticket: Bookie keeps the difference as profit (Bonus Tickets).
  4.  **Constraint:** The Bookie cannot sell tickets they do not own (no shorting). They can only buy. This forces them to hunt for underpriced assets.

  ### Summary Checklist for You
  *   [ ] **Prepare Jar B** (ensure it's sealed and truly unknown).
  *   [ ] **Print Asset Certificates** (Red/Black Jar B bets).
  *   [ ] **Print Raffle Tickets/Chits**.
  *   [ ] **Brief the Bookie** (find 1-2 game theory-savvy students early or assign randomly with a cheat sheet).
  *   [ ] **Timer** (keep the 90 mins honest).
  *   [ ] **Prize** (make sure it's visible in the room).

  This structure respects your desire to let them run into the problem themselves, uses the trading to test the *stability* of their preferences, and leaves the theoretical resolution as the hook for the next class. Good luck.
