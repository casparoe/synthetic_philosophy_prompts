answer: |-
  ### Exam Question: Social Epistemology Final

  **Time Allowed:** 90 Minutes
  **Word Limit:** Approx. 600–800 words

  **Question:**

  Consider a funding agency that employs a panel of 101 reviewers to decide whether a grant proposal is scientifically sound. We assume each reviewer, considered in isolation, is competent: each has a 0.51 probability of reaching the correct verdict regarding the proposal's merit. According to the Condorcet Jury Theorem (CJT), if these voters vote independently, the majority verdict of the panel will be arbitrarily reliable as the group size increases.

  However, in this scenario, all 101 reviewers read the exact same proposal. Suppose the proposal contains a single, subtle flaw in the methods section. Because they all read the same text, this flaw acts as a common cause, tilting every reviewer's judgment in the same direction simultaneously.

  Write an essay addressing the following three interconnected issues:

  1.  **The Tension of Premises:** Explain precisely how the "common source" scenario undermines the independence premise of the CJT, even if the competence premise (0.51) holds. What happens to the group's reliability when votes are correlated rather than independent?
  2.  **Re-individuation:** Some theorists suggest we can "rescue" the theorem by re-individuating the voters. Instead of counting *people*, we count distinct *lines of evidence* or *methodological checks* as the "votes." Analyze whether this is a genuine epistemic fix or merely a conceptual relabeling that hides the problem.
  3.  **The Cynical Objection:** A student in my 11am seminar argues: "This shows the CJT is useless. Once evidence is shared, sincere voters are effectively stuck at 50/50, so adding more voters never helps." Construct a response to this student. Do not simply dismiss them; explain where their diagnosis is correct and where their conclusion about the theorem's uselessness is mistaken.

  ***

  ### Model Answer

  The Condorcet Jury Theorem (CJT) promises that collective decision-making can outperform individual judgment, provided two conditions are met: voter competence ($p > 0.5$) and statistical independence. The funding agency scenario illustrates the fragility of the second condition. While the reviewers satisfy the competence requirement individually (0.51), the structural setup violates independence. Because all 101 reviewers process the same information (the proposal), their errors are not random noise but correlated signals. If the misleading methods section convinces Reviewer 1 it is unsound, it is highly likely to convince Reviewer 2 as well.

  When independence is violated by a common cause, the "wisdom of crowds" effect collapses. Mathematically, the variance of the mean does not shrink to zero as $N$ increases. Epistemologically, this means the group reliability does not approach 1. Instead, the panel's reliability caps out near the individual competence level (0.51) or, if the common error is strong enough, the entire group systematically errs together. The theorem's guarantee of asymptotic reliability relies on errors canceling out; correlated errors reinforce one another, turning a panel of 101 into a single epistemic agent with 101 mouths.

  To salvage the theorem, one might propose re-individuating the voters. Rather than treating the 101 humans as the unit of analysis, we treat independent *lines of reasoning* or *methodological replications* as the votes. If the proposal is assessed via three distinct statistical tests, those tests become the "voters." This is a genuine epistemic fix only if the new units satisfy the independence condition better than the humans did. Distinct methodologies may rely on different assumptions, reducing the risk of a single common cause corrupting all "votes." However, this risks being a conceptual relabeling if the methodologies themselves rely on the same underlying data set. If the data is corrupted, no amount of methodological diversity saves the verdict. Thus, re-individuation is not a magic bullet; it shifts the burden from finding independent people to finding independent evidence, which is often harder to secure in practice.

  Finally, consider the cynical student's claim that shared evidence reduces sincere voters to a 50/50 chance, rendering the CJT useless. The student correctly identifies that shared evidence creates correlation, which neutralizes the benefit of increasing group size. However, their diagnosis that voters become "50/50" is incorrect. Shared evidence does not make voters random guessers; it makes them *biased* in the same direction. A 0.51 competence level remains 0.51, but the errors become clustered. The CJT is not useless, but its application is restricted. It remains a normative ideal: it tells us that to gain epistemic value from numbers, we must engineer independence (e.g., via blind review or diverse data sources). The theorem is not a description of how panels *do* work, but a prescription for how they *must* be structured to work. Dismissing it because real-world panels often fail the independence test is like dismissing aerodynamics because not all objects fly. The value lies in understanding the conditions required for collective reliability, even if those conditions are difficult to instantiate.

  ***

  ### Marking Scheme (Total: 20 Marks)

  | Point | Criteria (4 Marks Each) | How Students Typically Lose It |
  | :--- | :--- | :--- |
  | **1. Independence Violation** | Clearly identifies that reading the same text creates correlated errors (common cause), violating statistical independence even if competence holds. | Treating "independence" as merely "not talking to each other" rather than probabilistic independence of error. |
  | **2. Reliability Consequence** | Explains that without independence, group reliability does not approach 1 (asymptotic reliability fails) and errors reinforce rather than cancel. | Claiming the group is still more reliable than the individual simply because $N$ is large, ignoring the correlation. |
  | **3. Re-individuation Analysis** | Discusses the strategy of counting methods/evidence as voters rather than people, noting the requirement for these new units to be independent. | Dismissing re-individuation outright without analyzing its structural implications or feasibility. |
  | **4. Evaluation of Rescue** | Argues whether re-individuation is a genuine fix (changes epistemic structure) or relabeling (gerrymandering the theorem to fit reality). | Accepting the rescue as unproblematic or rejecting it as impossible without providing justification for the stance. |
  | **5. Cynical Student Response** | Corrects the "50/50" misconception (shared evidence $\neq$ randomness) while validating the concern that correlation limits the theorem's real-world application. | Agreeing with the student that CJT is useless or failing to distinguish between *randomness* and *correlated bias*. |
