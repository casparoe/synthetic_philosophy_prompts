answer: |-
  # Practice Exam Question: Judgment Aggregation and the Discursive Dilemma

  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Scenario:**
  A three-member Regulatory Panel must decide whether to approve a new pharmaceutical drug ($A$). The panel's mandate stipulates that approval is granted if and only if the drug is deemed Effective ($E$) AND Safe ($S$). The logical constraint is therefore $A \leftrightarrow (E \land S)$. The individual judgments of the three panel members (J1, J2, J3) are as follows:

  | Member | Effective ($E$) | Safe ($S$) | Approve ($A$) |
  | :--- | :---: | :---: | :---: |
  | **J1** | Yes | Yes | Yes |
  | **J2** | Yes | No | No |
  | **J3** | No | Yes | No |
  | **Majority** | **Yes** | **Yes** | **No** |

  **Questions:**

  1.  **Formalization & Consistency (3 marks):** Write the logical constraint governing the panel's decision using propositional logic. Verify briefly whether each individual member's set of judgments is logically consistent with this constraint.

  2.  **Aggregation Procedures (8 marks):** Determine the collective outcome under: (a) a Premise-Based Procedure (majority on $E$ and $S$, derive $A$), (b) a Conclusion-Based Procedure (majority on $A$ directly), and (c) Proposition-by-Proposition Majority Voting (majority on $E$, $S$, and $A$ independently). Identify which procedure yields a defective collective profile and specify the nature of the defect (e.g., inconsistency, incompleteness).

  3.  **The Mirror Image (6 marks):** Attempt to construct a vote distribution for this same conjunctive structure ($A \leftrightarrow E \land S$) where the majority accepts the conclusion ($A$) but rejects at least one premise ($E$ or $S$). If such a profile is impossible to construct with consistent voters, explain why. Assess whether the "discursive dilemma" is symmetric between conjunctive and disjunctive agendas based on this finding.

  4.  **Quota Thresholds (5 marks):** Is the dilemma an artifact of simple majority rule? Analyze whether raising the acceptance threshold (e.g., to a two-thirds supermajority or unanimity) on the premises would avoid the inconsistency problem for this specific three-member committee structure.

  5.  **Normative Reflection (3 marks):** Briefly reflect: Is the dilemma best described as a failure of truth-tracking (epistemic) or a failure of the group to act as a unified agent (responsibility)? Does distinguishing between these matter for choosing a repair strategy?

  ***

  # Model Answer

  **1. Formalization & Consistency**
  The logical constraint is $A \leftrightarrow (E \land S)$. To check individual consistency, we verify if each member's judgment on $A$ matches the conjunction of their judgments on $E$ and $S$.
  *   J1: $Yes \land Yes = Yes$. Matches $A$. Consistent.
  *   J2: $Yes \land No = No$. Matches $A$. Consistent.
  *   J3: $No \land Yes = No$. Matches $A$. Consistent.
  All individual sets are logically consistent.

  **2. Aggregation Procedures**
  *   (a) **Premise-Based (PB):** Majority accepts $E$ (2-1) and $S$ (2-1). Deriving $A$ from premises: $Yes \land Yes = Yes$. Collective outcome: $\{E:Y, S:Y, A:Y\}$.
  *   (b) **Conclusion-Based (CB):** Majority rejects $A$ (1-2). Collective outcome: $\{A:N\}$ (premises ignored or derived backwards).
  *   (c) **Proposition-by-Proposition (PPV):** Majority accepts $E$ (Yes), $S$ (Yes), but rejects $A$ (No). Collective outcome: $\{E:Y, S:Y, A:N\}$.
  *   **Defect:** The PPV outcome is **collectively inconsistent**. While every individual was consistent, the collective majority judgments violate the logical constraint ($Yes \land Yes \neq No$). PB and CB maintain consistency but diverge on the outcome.

  **3. The Mirror Image**
  For a conjunctive structure ($A \leftrightarrow E \land S$), it is **impossible** to construct a profile where the majority accepts $A$ but rejects a premise, assuming individual consistency. If a majority (2 out of 3) accepts $A$, they must both accept $E$ and $S$ to be consistent. Consequently, the majority on $E$ and $S$ must also be Yes.
  This reveals an **asymmetry** between conjunctive and disjunctive agendas. In a disjunctive structure ($A \leftrightarrow E \lor S$), the mirror image is possible: a majority can accept $A$ while rejecting both $E$ and $S$ individually (e.g., J1 accepts $E$, J2 accepts $S$, both accept $A$). The dilemma arises easily in conjunction via PPV (accept premises, reject conclusion), but in disjunction, it arises via the mirror (reject premises, accept conclusion).

  **4. Quota Thresholds**
  The dilemma is not solely an artifact of simple majority (>50%), but of any quota short of unanimity for conjunctive agendas. In a three-member committee, a two-thirds threshold requires 2 votes, which is identical to simple majority; thus, the dilemma persists. Only **unanimity** (3 out of 3) on the premises guarantees consistency. If all three agree $E$ and $S$ are Yes, they must all agree $A$ is Yes (given individual consistency). However, unanimity raises the bar for acceptance significantly, potentially leading to false negatives (rejecting good drugs). Thus, while unanimity avoids inconsistency, it introduces decisional inefficiency.

  **5. Normative Reflection**
  The dilemma can be viewed both ways. As a **truth-tracking failure**, PPV fails because it aggregates judgments on logically connected truths independently, reducing the likelihood of a correct collective verdict. As a **unified agent failure**, it shows the group cannot speak with one voice without imposing a specific reasoning path (PB vs. CB).
  This distinction matters for repair. If the goal is epistemic accuracy (truth-tracking), one might prefer PB to ensure reasons support the conclusion. If the goal is democratic responsiveness (agency), one might prefer CB to respect the direct will on the outcome. Choosing a repair requires deciding whether the group's primary function is to find the truth or to embody a collective will.

  ***

  # Marking Scheme

  **Total Marks: 25**

  **Part 1: Formalization & Consistency (3 Marks)**
  *   **1 Mark:** Correctly states $A \leftrightarrow (E \land S)$ (or equivalent).
  *   **2 Marks:** Correctly verifies consistency for all three judges.
  *   **Top vs. Middling:** A top answer explicitly notes that individual consistency is a prerequisite for the dilemma to be paradoxical. A middling answer simply checks the math without commenting on its significance.
  *   **Common Error:** Writing the constraint as $A \rightarrow (E \land S)$ only (missing the biconditional), or failing to check all three judges.

  **Part 2: Aggregation Procedures (8 Marks)**
  *   **3 Marks:** Correctly calculates outcomes for PB, CB, and PPV.
  *   **3 Marks:** Identifies PPV as the defective procedure.
  *   **2 Marks:** Correctly labels the defect as "collective inconsistency" (not incompleteness).
  *   **Top vs. Middling:** A top answer explicitly contrasts the consistent outcomes of PB/CB against the inconsistent outcome of PPV. A middling answer lists the outcomes but vaguely describes the defect as "a problem" or "wrong."
  *   **Common Error:** Confusing Premise-Based with Conclusion-Based outcomes; claiming the group is "incomplete" rather than inconsistent.

  **Part 3: The Mirror Image (6 Marks)**
  *   **3 Marks:** Correctly identifies that the requested profile is **impossible** for a conjunctive structure with consistent voters.
  *   **3 Marks:** Correctly assesses the asymmetry (possible for disjunctive, impossible for conjunctive).
  *   **Top vs. Middling:** A top answer explains *why* it is impossible (accepting $A$ necessitates accepting premises). A middling answer attempts to force numbers to make it work or claims symmetry exists without proof.
  *   **Common Error:** Assuming symmetry exists and fabricating a vote profile that violates individual consistency to make the numbers work.

  **Part 4: Quota Thresholds (5 Marks)**
  *   **2 Marks:** Notes that 2/3 supermajority is equivalent to majority in a 3-person committee.
  *   **3 Marks:** Correctly identifies that only **unanimity** guarantees consistency for conjunction.
  *   **Top vs. Middling:** A top answer acknowledges the trade-off (unanimity avoids inconsistency but increases false negatives/gridlock). A middling answer simply says "higher quotas help" without specifying unanimity.
  *   **Common Error:** Claiming a 2/3 threshold solves the problem in a 3-person group.

  **Part 5: Normative Reflection (3 Marks)**
  *   **1 Mark:** Distinguishes between truth-tracking (epistemic) and unified agency (responsibility).
  *   **2 Marks:** Connects the distinction to the choice of repair (e.g., PB for truth, CB for will).
  *   **Top vs. Middling:** A top answer links the diagnosis to the specific solution. A middling answer offers vague philosophical statements without connecting them to PB/CB choices.
  *   **Common Error:** Discussing "fairness" without referencing the specific epistemic/agency distinction requested.
