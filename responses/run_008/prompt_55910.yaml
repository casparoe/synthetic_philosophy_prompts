  2.  **Deconstruct the "CTT is a Definition" Slogan:**
      *   The Church-Turing Thesis is notoriously ambiguous. It connects an informal notion (effective calculability) with a formal notion (Turing computability/recursive functions).
      *   The slogan "it's a definition" usually implies it's analytic, stipulative, or conceptual, rather than synthetic or empirical.
      *   I need to distinguish between different *versions* of CTT and different *interpretations* of its modal/epistemic status.

      *   *Axes of distinction identified by the user:*
          *   Analytic vs. Revisable.
          *   Human clerk (epistemic) vs. Physical systems (ontic).
          *   Justification: Conceptual analysis, induction, physics, or proof from assumptions.

      *   *Candidate Theses:*
          1.  **Stipulative Definition:** We *define* "computable" to mean "Turing-computable." (Linguistic convention).
          2.  **Conceptual Analysis:** The pre-theoretic concept of "effective method" *is* the concept of Turing computability. (Philosophical claim).
          3.  **Physical CTT (PCTT):** Any function physically computable by a machine in our universe is Turing-computable. (Empirical claim).
          4.  **Bold/Strong CTT:** Any function computable by *any* possible mechanism (even non-physical) is Turing-computable. (Modal claim).
          5.  **Gandy's Thesis:** Computability is defined relative to specific physical constraints (locality, finite speed, etc.).

  3.  **Drafting the List of Theses (Iterative Refinement):**

      *   *Thesis 1: The Stipulative/Linguistic Reading.* "Computable" just *means* Turing-computable in mathematical discourse.
