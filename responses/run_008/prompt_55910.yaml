      *   *Thesis 2: The Conceptual/Analytic Reading.* The informal notion of "effective calculability by a human" is extensionally equivalent to Turing computability by necessity.
          *   Status: Contentious. Many argue it's a discovery, not a definition. Gandy's analysis suggests it relies on physical assumptions.
      *   *Thesis 3: The Physical Church-Turing Thesis (PCTT).* No physical system in *this* universe can compute non-recursive functions.
          *   Status: Empirical hypothesis. Definitely not a definition. Potentially false (analogue hypercomputation).
      *   *Thesis 4: The Modal/Strong CTT.* No *possible* physical system (in any nomologically possible world) can compute non-recursive functions.
          *   Status: Highly contentious. Depends on laws of physics.
      *   *Thesis 5: The Idealized Clerk Reading.* CTT is about what a human following rules can do, not machines.
          *   Status: Historically accurate to Church/Turing, but limits the scope. Hypercomputation papers usually target physical realizability, not human clerks.

  4.  **Evaluating Plausibility/Truth/Triviality:**
      *   *Stipulative:* True (as convention), Trivial. Doesn't block hypercomputation research (they just define "hypercomputation" differently).
      *   *Conceptual:* Contentious. Likely false if "mechanism" includes physical processes not reducible to human steps.
