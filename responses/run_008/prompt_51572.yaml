prompt: |-
  So here's my situation: I'm a science and ideas reporter, and I also sit on our newsroom's standards committee — the body that signs off on data-driven investigations before publication. We've got a meeting Thursday and a story I genuinely can't figure out. Our data desk spent two months on the state's new math curriculum, which about 80 schools adopted three years ago. The headline finding is that schools using the new curriculum have notably better average test scores than schools that stayed with the old one. But when our data reporter broke the schools down by the poverty level of their student body, the old curriculum schools actually did better in every single bracket — the new curriculum only "wins" in the aggregate because the pilot schools were disproportionately the wealthier, higher-scoring ones to begin with. Someone muttered something about Simpson's paradox in the Slack channel, but I mostly need practical help here.

  The problem is that our data editor is digging in hard on publishing the aggregate comparison. His argument, which I want to take seriously rather than just steamroll: parents and legislators don't get to pick a school's poverty level, the aggregate is the actual gap in outcomes that exists in the world, stratified comparisons are a statistical refinement that will lose readers, and every ranking we've ever published aggregates. Meanwhile the reporter who did the work thinks running the aggregate number with a caveat buried in paragraph nine is basically malpractice, since the whole point is that the raw comparison reverses once you make the schools comparable. Leadership wants a committee memo, and I'm supposed to draft the thing: a clear recommendation (run the stratified version, run the aggregate, run both with some specific framing, or hold the story), plus the reasoning, and an honest section on the strongest points on the losing side — including whether there's any legitimate question where the aggregate really is the right number to report. If it helps, we're also fighting about the chart caption and the headline, so concrete guidance on those would be great too. Can you draft that memo for Thursday's meeting? Keep it usable as an actual document the committee could vote on, not an essay.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Science and ideas reporter + Standards Committee member.
      *   **Task:** Draft a committee memo for Thursday's meeting regarding a specific data-driven investigation.
      *   **The Story:** State's new math curriculum (adopted by ~80 schools 3 years ago).
      *   **The Data Conflict:**
          *   *Aggregate:* New curriculum schools have better average test scores.
          *   *Stratified (by poverty):* Old curriculum schools do better in *every* poverty bracket.
          *   *Cause:* Simpson's Paradox (New curriculum schools were wealthier/higher-scoring to begin with).
      *   **The Conflict:**
          *   *Data Editor:* Wants to publish the aggregate. Argument: It reflects real-world outcomes, readers don't choose poverty levels, stratification is too complex, consistency with past rankings.
          *   *Data Reporter:* Wants to lead with stratified. Argument: Aggregate is misleading/malpractice without context, raw comparison reverses when controlled.
          *   *Leadership:* Wants a clear recommendation + reasoning + steelman of the losing side.
      *   **Deliverable:** A usable committee memo (not an essay), including recommendation, reasoning, counter-arguments, and specific guidance on headlines/charts.

  2.  **Determine the Ethical/Statistical Stance:**
      *   *Statistical Reality:* This is a classic Simpson's Paradox. The aggregate number is technically "true" (the average of Group A is higher than Group B), but it is *causally misleading* if the implication is that the curriculum *caused* the improvement. Since the goal of education reporting is usually to inform policy/choice based on efficacy, the stratified data is the truthful representation of the curriculum's performance.
      *   *Journalistic Ethics:* Publishing the aggregate as the primary finding without immediate, prominent context risks misleading the public about the efficacy of the curriculum. It could lead to bad policy decisions. However, the Data Editor has a point about "real world outcomes."
      *   *Best Practice:* Lead with the nuance (stratified), acknowledge the aggregate but explain *why* it looks that way (selection bias). Do not bury the lede.

  3.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary/Recommendation:** Clear vote option.
      *   **Context:** Brief summary of the data conflict.
      *   **Rationale:** Why this recommendation? (Accuracy, utility, avoiding harm).
      *   **Steelman (The Other Side):** Valid points from the Data Editor's perspective.
      *   **Implementation Guidelines:** Headlines, charts, framing.
      *   **Next Steps:** What happens if we vote yes/no.

  4.  **Drafting Content - Section by Section:**

      *   *Recommendation:* Run the story, *but* lead with the stratified analysis. The aggregate cannot be the headline finding.
      *   *Rationale:* The core question is "Does this curriculum work?" not "Which schools have higher scores?" The aggregate answers the second, the stratified answers the first. Publishing the aggregate as the primary takeaway is misleading due to selection bias.
      *   *Steelman (Data Editor's View):* Parents care about raw scores. Selection bias is a feature of the rollout, not a bug. Aggregates are standard. *Counter:* Standard doesn't mean right if it misleads.
      *   *Headline/Chart:* Needs to reflect the nuance. Avoid "New Curriculum Boosts Scores." Use "Wealthier Schools Adopted New Math; When Compared Equally, Old Curriculum Edges Out." (Maybe soften that for a headline, but keep the meaning). Chart needs to show the reversal.

  5.  **Refining the Tone:**
      *   Needs to be professional, objective, yet decisive.
      *   Acknowledge the Data Editor's seniority/concern without yielding on the statistical truth.
      *   Use committee language ("Recommendation," "Discussion," "Action Items").

  6.  **Addressing Specific Constraints:**
      *   "Keep it usable as an actual document." -> Use formatting (bolding, bullet points).
      *   "Honest section on the strongest points on the losing side." -> Dedicate a specific section to the Data Editor's argument.
      *   "Concrete guidance on chart caption and headline." -> Include a specific section for this.

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe suggest killing the story? *Correction:* No, it's important public interest. Just needs correct framing.
      *   *Initial thought:* Side fully with the reporter. *Correction:* Need to validate the Editor's point about "real world outcomes" to show the committee I considered it.
      *   *Check:* Did I explain Simpson's Paradox simply? *Action:* Ensure the memo explains it in plain English for non-data committee members.
      *   *Check:* Is the recommendation vote-ready? *Action:* Make the "Motion" clear.

  8.  **Final Polish:** Check against the prompt's persona (Science reporter/Committee member). Ensure it sounds like an internal newsroom document. (e.g., using terms like "lede," "nut graf," "viz").

  **(Self-Correction Note):** Make sure I don't sound like I'm attacking the Data Editor. The prompt says "I want to take seriously rather than just steamroll." I need to ensure the "Steelman" section is robust.

  9.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Standards & Ethics Committee
  **FROM:** [Your Name], Science & Ideas Desk / Standards Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Math Curriculum Investigation (Data Conflict)

  ### 1. Executive Summary & Recommendation
  **Recommendation:** Publish the investigation, **conditional on leading with the stratified (poverty-controlled) analysis rather than the aggregate comparison.**

  **Motion:** I move that we approve the story for publication provided the headline, lede, and primary visualization reflect the stratified findings (that the old curriculum performs better within comparable poverty brackets). The aggregate data may be included but must be framed explicitly as a result of demographic selection bias, not curriculum efficacy.

  ### 2. Context: The Data Conflict
  The data desk has analyzed test scores from 80 schools that adopted the state's new math curriculum three years ago versus those that retained the old curriculum.
  *   **Finding A (Aggregate):** Schools with the new curriculum have higher average test scores.
  *   **Finding B (Stratified):** When controlling for student poverty levels, schools with the *old* curriculum outperform the new curriculum in every income bracket.
  *   **Diagnosis:** This is a textbook case of **Simpson's Paradox**. The new curriculum was disproportionately adopted by wealthier schools that already score higher. The aggregate number reflects the demographics of the schools, not the effectiveness of the math program.

  ### 3. Rationale for Recommendation
  Our primary obligation is to avoid misleading the public on matters of policy and efficacy.

  *   **Causal Accuracy:** The implicit question of this story is, "Does the new curriculum improve student outcomes?" The aggregate data answers, "Do schools with the new curriculum have higher scores?" These are different questions. Answering the second while implying the first is statistically misleading.
  *   **Public Utility:** If a legislator or superintendent reads that the new curriculum yields higher scores (aggregate) and mandates it for low-income schools, they are acting on false premises. The stratified data suggests the new curriculum may actually be underperforming the old one when resources are equal.
  *   **Transparency:** Burying the stratification in paragraph nine (as suggested by some drafts) treats a fundamental statistical correction as a footnote. In this case, the correction *is* the story.

  ### 4. Steelman: The Case for the Aggregate (Data Editor's Position)
  We must acknowledge the strength of the opposing view, argued by our Data Editor. There are legitimate journalistic reasons to consider the aggregate:

  *   **Real-World Outcomes:** Parents and policymakers often cannot choose a school's poverty level; they must deal with the system as it exists. The aggregate gap is a "real" phenomenon in the state, even if driven by demographics. Ignoring it entirely sanitizes the reality of the achievement gap.
  *   **Selection Bias is a Feature, Not a Bug:** The fact that wealthier schools adopted the new curriculum first is itself a news story about equity and rollout. Publishing the aggregate highlights that the "good" curriculum is currently inaccessible to poorer districts.
  *   **Reader Comprehension & Consistency:** Complex stratified analyses can lose general audiences. We have historically published school rankings based on raw aggregates. Deviating now might confuse readers or make our data work seem inconsistent.

  **Committee Assessment of Counter-Argument:** While valid, these points are better served as *secondary* angles. We can report on the inequitable rollout (why rich schools got it first) without implying the curriculum itself is superior. Leading with the aggregate risks validating a false causal link.

  ### 5. Implementation Guidelines
  If the committee approves the recommendation, the following changes are required before publication:

  **A. Headline Framing**
  *   **Avoid:** "New Math Curriculum Linked to Higher Test Scores" or "New Curriculum Outperforms Old."
  *   **Preferred:** "New Math Curriculum Adopted by Wealthier Schools; Data Shows No Performance Gain Over Old Model" or "When Poverty is Controlled, Old Math Curriculum Outscores New State Standard."
  *   **Goal:** The headline must signal that the advantage disappears when comparing apples to apples.

  **B. Visualization**
  *   **Primary Chart:** Do not use a single bar chart comparing New vs. Old averages.
  *   **Required Viz:** A slope chart or grouped bar chart showing the performance gap *within* poverty brackets (e.g., Low Poverty, Medium Poverty, High Poverty). The visual must show the lines crossing or the direction reversing compared to the aggregate.
  *   **Caption:** Must explicitly state: "While new curriculum schools have higher raw scores (left), this is due to demographic advantages. Within comparable income brackets (right), the old curriculum performs better."

  **C. Narrative Structure**
  *   **The Lede:** Acknowledge the raw scores immediately, but pivot to the control variable in the nut graf.
      *   *Example:* "On paper, schools using the state's new math curriculum are outscoring their peers. But a [Newsroom Name] analysis reveals that advantage vanishes when comparing schools with similar student poverty levels."
  *   **The "Why":** Dedicate a section to the rollout process. Explain *why* wealthier schools adopted it first (grant requirements, parent pressure, etc.). This satisfies the Data Editor's concern about reporting the "real world" inequity without falsifying the curriculum's efficacy.

  ### 6. Risk Assessment
  *   **If we run Aggregate Only:** High risk of criticism from academic/statistical communities. Potential for the story to be used to justify ineffective policy.
  *   **If we run Stratified Only:** Risk of reader confusion or accusations of "moving the goalposts" on school rankings. Mitigated by clear explanatory journalism.
  *   **If we Kill the Story:** Unacceptable. The public has a right to know about the curriculum's performance and the inequitable rollout.

  ### 7. Vote Request
  I request a vote on the motion to **approve the story contingent on the stratified analysis taking precedence in the headline and lede.**

  *   [ ] Approve as recommended
  *   [ ] Approve with amendments (see notes)
  *   [ ] Reject / Send back for rewrite
  *   [ ] Kill story

  ***

  **Prepared for:** Thursday Standards Committee Meeting
  **Attachments:** Draft story, Data methodology note, Sample visualizations.
