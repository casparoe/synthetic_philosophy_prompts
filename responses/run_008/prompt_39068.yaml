answer: |-
  Your intuition that something was "off" is well-founded, though your friend's summary is not entirely without merit. He has accurately captured the *spirit* of Douglas Hofstadter's argument as presented in *Metamagical Themas* (specifically the 1983–1984 columns on the Prisoner's Dilemma), but he has glossed over the technical mechanisms that make the argument coherent, and he has made a demonstrably false claim about its reception in the academic community.

  Here is an audit of his summary, broken down by the specific points you raised.

  ### 1. The Core Claim: "They will all reason their way to the same decision."
  **Verdict:** *Mostly accurate, but requires a stronger premise than stated.*

  A defender of superrationality would endorse this, but with a significant caveat. Standard game theory assumes that players are rational but distinct; Player A's reasoning is independent of Player B's. Hofstadter's superrationality assumes that if two agents are perfectly rational and face a symmetric problem, their reasoning processes are effectively **isomorphic**.

  *   **The Subtlety:** It is not enough to know the other person is "rational." You must believe they are rational *in the same way you are*. If I am a Causal Decision Theorist and you are an Evidential Decision Theorist, we may both be "rational" but we will defect. Superrationality requires a commonality of *algorithm*, not just a commonality of *goal*.
  *   **The "Smuggle":** Your friend implies that mere mutual knowledge of rationality is sufficient. A superrationalist would argue that you must also recognize the **symmetry** of the situation. If I think "I am special and might reason differently than him," superrationality collapses. I must view my own reasoning as a sample from the same distribution as his.

  ### 2. The Mechanism: "Effectively choosing for both of them."
  **Verdict:** *Metaphorically accurate, technically imprecise.*

  This is the point that felt like "wishful thinking" to you. In standard Causal Decision Theory (CDT), my choice cannot causally influence yours in a one-shot game without communication. If I cooperate, you still get the higher payoff by defecting.

  *   **How a Defender Explains It:** A superrationalist does not claim magic causation. They claim **logical correlation**. The argument is: "My decision and my opponent's decision are both outputs of the same rational function applied to the same input. Therefore, conditional on me choosing Cooperate, the probability that you choose Cooperate is near 1."
  *   **Causal vs. Evidential vs. Logical:** Your friend's phrasing ("choosing for both") sounds causal. A more precise formulation (later formalized by researchers like Eliezer Yudkowsky as **Functional Decision Theory**) is that you are choosing the *output of the reasoning function*. Since the opponent runs the same function, you are logically controlling both outputs.
  *   **The Flattening:** By saying "choosing for both," your friend skips the step of explaining *why* the correlation exists. Without that explanation, it does sound like magic. With the explanation (logical correlation of identical algorithms), it becomes a controversial but mathematically definable position.

  ### 3. The Reception: "Largely accepted by decision theorists as a correction."
  **Verdict:** *False.*

  This is the strongest point of leverage for your side of the argument. Superrationality is **not** largely accepted by decision theorists or game theorists as a correction to the standard view.

  *   **The Consensus:** The standard view remains that Defection is the dominant strategy in a one-shot Prisoner's Dilemma under Causal Decision Theory. This is the Nash Equilibrium.
  *   **The Niche:** Superrationality is viewed as an interesting heterodox position. It is often discussed in the context of **Evidential Decision Theory (EDT)** or the newer **Functional Decision Theory (FDT)**, but these are minority views compared to CDT. Most economists and game theorists reject the idea that my choice provides evidence of yours in a way that changes the expected utility calculation enough to mandate cooperation, unless there is some pre-existing correlation (like shared culture or previous interaction).
  *   **Why it matters:** Your friend presented superrationality as the "updated textbook view." It is not. It is a philosophical challenge to the textbook view, not the new textbook.

  ### 4. The Voting Analogy: "Your ballot comes bundled with theirs."
  **Verdict:** *Plausible application, but distinct logic.*

  The application to voting is known as the **Paradox of Voting**. Standard rational choice theory suggests voting is irrational because the cost (time/effort) outweighs the infinitesimal probability that your single vote will decide the election.

  *   **How Superrationality Applies:** The argument is similar to the Prisoner's Dilemma. If I am rational to vote, then all other rational agents like me are also rational to vote. Therefore, I should not consider the impact of *my one vote*, but the impact of *the block of votes cast by agents running my reasoning algorithm*. If that block is large enough to swing the election, voting becomes rational.
  *   **Does it Follow?** It follows *if* you accept the superrational premise. However, it is even more controversial here than in the Prisoner's Dilemma. In the PD, the correlation is between two specific players. In voting, the correlation is between you and millions of strangers. The "logical link" is much thinner. Many decision theorists argue that even with superrationality, the probability of the election hinging on your specific "cluster" of voters is still too low to justify the cost.
  *   **Fairness:** Your friend is right that Hofstadter and others (like Derek Parfit) have used this logic to defend voting. He is wrong to imply it settles the debate.

  ### Summary for Your Discussion

  If you want to pick the thread up with your friend without being adversarial, you might frame it this way:

  1.  **Validate the Intuition:** "I looked into Hofstadter's columns, and you're right that his core intuition is about symmetry. If we are identical reasoners, we must output the same answer."
  2.  **Correct the Mechanism:** "However, the 'magic' isn't that I choose for you causally. It's that my choice is *logical evidence* of yours because we share the same source code. It's not Causal Decision Theory; it's closer to Functional Decision Theory."
  3.  **Correct the Consensus:** "The main point I found that contradicts your summary is the reception. It turns out most decision theorists *don't* accept this as a correction to the Nash Equilibrium. It's still considered a controversial, minority view."
  4.  **Refine the Voting Point:** "The voting argument works only if you accept that your reasoning is tightly coupled with millions of others. That's a much heavier lift than the two-person Prisoner's Dilemma."

  **Conclusion:** Your friend gave a faithful summary of Hofstadter's *enthusiasm*, but an unfaithful summary of the *technical requirements* and the *academic status* of the theory. It is not wishful thinking if you accept the premise of logical correlation, but that premise is the very thing most theorists reject. You were right to feel that the "causality" was being smuggled in, and you were right to doubt the claim of consensus.
