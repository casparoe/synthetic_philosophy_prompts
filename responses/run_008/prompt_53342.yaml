          *   Actually, the prompt says "payout caps there". So if the mathematical win is > $3000, they get $3000.
          *   Outcomes:
              *   1 to 11 flips: Payoff is $2^k$. Sum of EV contributions = $11 \times $1 = $11.
              *   12 or more flips: This occurs if the first 11 flips are Tails. Probability = $(1/2)^{11} = 1/2048$.
              *   In this scenario, the payout is capped at $3,000.
              *   EV contribution = $3000 \times (1/2048) \approx $1.46.
              *   Total EV = $11 + $1.46 = $12.46.
      *   *Ticket Price:*
          *   Break-even EV is ~$12.46.
          *   Fundraiser needs profit.
          *   Sister wants $20.
          *   Is $20 defensible? Yes, it's a fundraiser. But mathematically, the "fair price" is ~$12.50.
          *   However, considering risk aversion (Question 1), people value this less than EV.
          *   Recommendation: Price it lower to ensure participation, or keep $20 but explain the cap. $10-$15 feels more "carnival" friendly. $20 might be too high for a low-probability win, even with the cap EV.
          *   Wait, I need to check the cap logic again.
          *   If the cap is $3,000, does the game stop after 11 tails?
          *   If I flip 11 Tails, the next Heads pays $4,096. That exceeds $3,000. So that outcome pays $3,000.
          *   If I flip 12 Tails, next Heads pays $8,192. That exceeds $3,000. So that outcome pays $3,000.
          *   So *any* sequence requiring a payout > $3,000 pays $3,000.
          *   The threshold is $2^{11} = 2048$ (OK) vs $2^{12} = 4096$ (Too high).
          *   So outcomes 1 through 11 pay face value.
          *   Outcome 12+ (meaning 11 Tails followed by anything, effectively) pays $3,000.
          *   Probability of reaching the "Cap Zone" is the probability of flipping 11 Tails in a row = $(1/2)^{11} = 1/2048$.
          *   EV = (Sum of first 11 terms) + (Cap Value * Prob of Cap).
          *   Sum of first 11 terms = $11.
          *   Cap Term = $3000 / 2048 = 1.4648...
          *   Total EV = $12.46.
      *   *Verdict:* Fair price is ~$12.50. $20 is a ~60% house edge. High for a game, but it's a charity. I should suggest $10 or $15 to make it palatable.

  4.  **Deconstruct Question 3: Advertising "Infinite Payout":**
      *   *Risk:* Advertising regulations, truth-in-advertising, donor trust.
      *   *Audience:* Actuaries and poker players. They will spot the lie immediately.
      *   *Reputation:* If the "math people" laugh at the org, it looks amateurish.
      *   *Legal:* Gambling laws vary. If it's a "game of chance" with a purchase, it might be considered a lottery. Nonprofits often have exemptions, but false advertising could jeopardize that.
      *   *Verdict:* Don't do it. It's technically false (because of the cap) and practically misleading (because of utility). It invites scrutiny.
      *   *Alternative:* "Theoretically Infinite" (with asterisk) or just lean into the St. Petersburg Paradox name.

  5.  **Synthesize and Tone Check:**
      *   *Tone:* Supportive but firm on the math. The user is right to be skeptical. The sister is technically right on raw EV but wrong on application.
      *   *Structure:* Address the three points clearly.
      *   *Key Insight:* The St. Petersburg Paradox is the name of this problem. Mentioning it gives the user ammo.
      *   *Audience Factor:* Emphasize that actuaries *will* catch the "infinite" claim if the cap exists.

  6.  **Refining the EV Calculation (Self-Correction/Verification):**
      *   Let's double check the cap probability.
      *   Game ends on Heads.
      *   Payout $2^k$ where $k$ is the flip number.
      *   Cap $C = 3000$.
      *   Max uncapped payout is $2048$ ($k=11$).
      *   If $k=12$, payout would be $4096$, becomes $3000$.
      *   If $k=13$, payout would be $8192$, becomes $3000$.
      *   So, any game lasting 12 flips or more pays $3000$.
      *   Probability of game lasting 12 flips or more = Probability of first 11 flips being Tails.
      *   Why? Because if any of the first 11 were Heads, the game would have ended earlier with a lower payout.
      *   So Prob(Cap) = $(1/2)^{11} = 1/2048$.
      *   EV = $\sum_{k=1}^{11} (1/2^k \cdot 2^k) + (1/2048 \cdot 3000)$.
      *   EV = $\sum_{k=1}^{11} (1) + 1.46$.
      *   EV = $11 + 1.46 = 12.46$.
      *   Calculation holds.

  7.  **Drafting the Response:**
      *   **Intro:** Validate the user. This is a famous problem (St. Petersburg Paradox).
      *   **Section 1 (Infinite EV):** Confirm the math is theoretically right but practically wrong. Explain *why* (utility, bankroll).
