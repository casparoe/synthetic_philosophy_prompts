      *   **Audience:** Poker players and actuaries (math-savvy).
      *   **Questions:**
          1.  Is the "infinite EV" claim correct, or where does it fail?
          2.  With a $3,000 cap, what is a fair/defensible ticket price?
          3.  Is advertising "infinite expected payout" risky/misleading?

  2.  **Deconstruct Question 1: The Infinite Expected Value (St. Petersburg Paradox):**
      *   *Math Check:*
          *   Prob(Heads on 1st) = 1/2, Payoff = $2. Contribution = $1.
          *   Prob(Heads on 2nd) = 1/4, Payoff = $4. Contribution = $1.
          *   Prob(Heads on 3rd) = 1/8, Payoff = $8. Contribution = $1.
          *   Sum = 1 + 1 + 1 + ... = Infinity.
      *   *Verdict:* Mathematically, the sister is *technically* correct regarding the raw expected value of the theoretical game.
      *   *The Catch:* This is the classic **St. Petersburg Paradox**. The reasoning goes "off the rails" when applying it to real-world human behavior and economics.
      *   *Why?* Diminishing marginal utility of money. $1,000,000 isn't 1,000,000 times more useful than $1. Also, no bankroll is infinite (which leads to Question 2).
      *   *Advice:* Acknowledge she's mathematically right about the *formula*, but economically wrong about *value*.

  3.  **Deconstruct Question 2: The $3,000 Cap:**
      *   *Constraint:* Max payout = $3,000.
      *   *Game Structure:* Payoffs are powers of 2 ($2, $4, $8, $16, $32, $64, $128, $256, $512, $1024, $2048, $4096...).
      *   *Effective Cap:* Since payouts double, the game stops paying the full doubling amount once it exceeds $3,000.
      *   *Calculation:*
          *   Flip 1 (H): $2 (Prob 1/2)
          *   Flip 2 (TH): $4 (Prob 1/4)
          *   ...
          *   Flip $k$: Payoff $2^k$.
          *   Find $k$ where $2^k \le 3000$.
          *   $2^{11} = 2048$.
          *   $2^{12} = 4096$ (Exceeds cap).
          *   So, if the game reaches 12 tails (13th flip heads), the payout is capped at $3,000 (or potentially the previous valid tier $2,048, but usually "cap" means max liability). Let's assume the liability is hard-capped at $3,000.
          *   Actually, for a fundraiser, they probably just stop the doubling at the max available cash. Let's assume any result that *would* pay more than $3,000 just pays $3,000.
          *   Sequence:
              *   n=1 ($2): 1/2
              *   n=2 ($4): 1/4
              *   ...
              *   n=11 ($2048): 1/2048
              *   n>=12 (Cap $3000): Prob = 1/2048 (since 1/2^11 is the prob of reaching the 12th flip).
          *   Wait, let's refine the probability sum.
          *   Sum of probabilities must equal 1.
          *   EV = $\sum (Probability \times Payout)$
          *   Terms 1 to 11: Each contributes $1 (as per the paradox logic). So $11 \times 1 = $11.
          *   Term 12+ (The Cap): The probability of reaching 12 tails is $(1/2)^{11} = 1/2048$. Wait, probability of ending on flip $k$ is $(1/2)^k$.
          *   Let's re-calculate carefully.
          *   Flip 1 (H): Pay $2. Prob 1/2. EV = 1.
          *   Flip 2 (TH): Pay $4. Prob 1/4. EV = 1.
          *   ...
          *   Flip 11 (10 T, 1 H): Pay $2048. Prob 1/2048. EV = 1.
          *   Flip 12+ (11+ T, then H): Pay $3000 (Cap). Prob of reaching 11 Tails is $(1/2)^{11} = 1/2048$.
          *   Wait, if you get 11 Tails, you are on the 12th flip. If Heads, payoff is $4096. If Tails, 13th flip...
