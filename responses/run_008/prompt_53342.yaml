answer: |-
  This is a classic problem in probability theory known as the **St. Petersburg Paradox**. You are right to be skeptical, and your sister is walking into a trap that has confused economists and mathematicians for 300 years.

  Here is the breakdown for your three arguments, specifically tailored for an audience that includes actuaries and poker players.

  ### 1. Is the "Infinite Expected Value" claim correct?

  **Technically yes, practically no.**

  Your sister is mathematically correct about the *theoretical* game. Here is the math she is using:
  *   **Flip 1 (Heads):** Probability 1/2, Prize $2. Expected Value (EV) contribution = $1.
  *   **Flip 2 (Tails, Heads):** Probability 1/4, Prize $4. EV contribution = $1.
  *   **Flip 3 (Tails, Tails, Heads):** Probability 1/8, Prize $8. EV contribution = $1.
  *   **Flip *n*:** Probability $1/2^n$, Prize $2^n$. EV contribution = $1.

  Since the game can theoretically go on forever, you sum $1 + 1 + 1...$ to infinity. So, the raw mathematical expectation is indeed infinite.

  **Where the reasoning goes off the rails:**
  This is the literal definition of the St. Petersburg Paradox. The reasoning fails because **Expected Value $\neq$ Real Value.**
  *   **Diminishing Marginal Utility:** Winning $1 billion isn't a billion times more life-changing than winning $1. Humans do not value money linearly.
  *   **Bankroll Constraints:** No casino (or wildlife shelter) has infinite money. As soon as you introduce a maximum payout limit (which your treasurer has done), the expected value ceases to be infinite and becomes a finite number.

  **Verdict:** Tell your sister she wins the "theoretical math" argument but loses the "real world economics" argument. Charging $50 is not "fair" just because the theoretical curve is infinite.

  ### 2. With a $3,000 cap, what is a fair ticket price?

  The treasurer saved you. The cap makes the math finite and calculable. Since your audience includes actuaries, they **will** calculate this on a napkin. You need the number to be defensible.

  Here is the calculation based on a hard cap of $3,000:
  *   The payouts double: $2, $4, $8... $1,024, $2,048, $4,096.
  *   The payout exceeds the $3,000 cap at the **12th flip** (which would pay $4,096).
  *   Therefore, any game sequence that reaches 12 flips or more pays the flat cap of $3,000.
  *   The probability of reaching 12 flips is the probability of flipping 11 Tails in a row: $(1/2)^{11} = 1/2048$.

  **The Expected Value (EV) Calculation:**
  1.  **Flips 1 through 11:** Each contributes exactly $1 to the EV (as per the paradox logic above).
      *   $11 \text{ flips} \times \$1 = \$11.00$
  2.  **The Cap (Flip 12+):** The probability of hitting the cap is $1/2048$. The payout is $3,000.
      *   $\$3,000 \div 2048 \approx \$1.46$
  3.  **Total Expected Value:** $\$11.00 + \$1.46 = \mathbf{\$12.46}$

  **Recommendation:**
  *   **Mathematically "Fair" Price:** **$12.50**. At this price, the house breaks even in the long run.
  *   **Fundraiser Price:** Since this is for charity, you need a "house edge." However, $20 is a **60% house edge**, which is steep even for a charity (typical raffle edges are often lower to encourage volume).
  *   **Sweet Spot:** **$10 or $15**.
      *   At **$10**, the player has a positive expected value (+$2.46). You can market this as "Player Friendly!"
      *   At **$15**, the shelter keeps ~$2.50 per ticket on average.
      *   At **$20**, you risk the poker players scoffing at the value proposition.

  **Crucial Note:** If you charge $20, do **not** call it "fair." Call it a "donation with a chance to win." If you call a negative-EV game "fair," the actuaries in the room will correctly call it false advertising.

  ### 3. Should you advertise "Infinite Expected Payout"?

  **Do not do this.** You are not being uptight; you are protecting the organization.

  1.  **It is Factually False:** Because of the $3,000 cash cap, the payout is *not* infinite. It is capped. An actuary will point this out immediately, and it will make the organization look like it doesn't understand its own game mechanics.
  2.  **Gambling Regulations:** Nonprofit gaming is heavily regulated. Claims about odds and payouts often fall under consumer protection or gambling commission rules. Advertising a false mathematical claim could theoretically invite scrutiny from a state regulator, even if intended as a joke.
  3.  **Donor Trust:** If the "math people" feel misled by a joke, they may question the financial transparency of the shelter itself.

  **Better Marketing Angles:**
  Since your crowd is math-savvy, lean into the paradox without lying.
  *   *"The St. Petersburg Challenge: Can you beat the odds?"*
  *   *"Theoretically Infinite, Practically Capped at $3,000!"* (Honest and funny)
  *   *"A probability puzzle for a good cause."*

  ### Summary Advice for Your Sister
  1.  **Acknowledge the Paradox:** Tell her she discovered the St. Petersburg Paradox, which is cool, but real-world constraints (the cash box) solve the paradox by making the EV finite (~$12.46).
  2.  **Set the Price at $15:** It's high enough to raise money, low enough that the "smart money" won't feel ripped off, and it acknowledges the cap.
  3.  **Kill the "Infinite" Tagline:** It's legally risky and intellectually dishonest given the cash cap.

  If the actuaries show up, hand them a napkin with the $12.46 calculation on it. They'll respect the transparency, and they'll probably buy more tickets.
