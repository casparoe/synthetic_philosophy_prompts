      *   *Phase 3: The "Two Projects" Angle.*
          *   Is it Semantics or Metaphysics?
          *   Williamson treats it as Metaphysics (nature of truth).
          *   Dummett treats it as Semantics (theory of meaning).
          *   Fitch's paradox sits at the intersection. If it's semantics, the quantifier is the issue. If it's metaphysics, the modal operator is the issue.
      *   *Phase 4: Conclusion on Progress.*
