      *   *Candidate 2: The Scope of Quantification.* The dispute is about the domain of the quantifier $\forall p$. Realists assume a fixed, verification-transcendent domain of propositions. Anti-realists (Dummettians) reject this domain. The paradox arises only if you accept the realist's ontology to formulate the anti-realist thesis.
      *   *Candidate 3: The Nature of the Anti-Realist Thesis.* Is anti-realism a semantic thesis (meaning is use/verification) or a metaphysical thesis (truth is epistemic)? Fitch targets the metaphysical formulation ($\forall p (p \to \diamond Kp)$). If anti-realism is semantic, Fitch might be a category error.
      *   *Candidate 4: The Logic of the Knower.* The paradox relies on factivity ($Kp \to p$) and distributivity ($K(p \land q) \to Kp \land Kq$). Maybe the disagreement is about whether *idealized* knowledge obeys these classical constraints.
      *   *Candidate 5: Dialectical Asymmetry.* The realist wants a *general* theory of truth. The anti-realist wants to block *specific* metaphysical excesses. Fitch shows that blocking excesses without collapsing into idealism is formally difficult. The stalemate is about burden of proof.

  3.  **Testing Candidates against the Camps:**

