answer: |-
  # Where Do You Stand on Standing?
  **A Diagnostic Instrument for the Monthly Reading Group**

  **Instructions:** Read each case carefully. The wrongness of the *target's* action is held fixed; assume they did something objectively blameworthy. Your task is to judge the *blamer*. Select the option that best captures your intuition about whether the blame is appropriate, and if not, *why*.

  **1. The Reformed Friend**
  Elena used to steal from her employers but stopped five years ago after a serious moral conversion. She now works in management. She discovers her close friend Mark stealing from the same company. She confronts him, citing her own past to show she understands the temptation, but insists he must stop.
  *   A. Her blame is fully appropriate; her reformation clears her record.
  *   B. Her blame is inappropriate; past participation permanently forfeits the right to criticize this specific vice.
  *   C. Her blame is inappropriate; invoking her past makes the interaction about her, not Mark's wrong.

  **2. The Secret Transgressor**
  Arthur publicly campaigns against tax evasion, arguing it undermines social trust. Privately, he evades taxes using a complex loophole he claims is "technically legal." He blames a neighbor for a straightforward, illegal evasion.
  *   A. His blame is appropriate; his private actions are irrelevant to the public norm.
  *   B. His blame is inappropriate; the double standard violates the equality between him and the neighbor.
  *   C. His blame is inappropriate; the deception itself undermines his moral authority, regardless of the act's similarity.

  **3. The Untempted Bystander**
  Sarah has never felt the slightest urge to cheat on her partner, nor has she ever been in a situation where it was tempting. She blames a friend who cheated after a difficult breakup.
  *   A. Her blame is appropriate; she upholds the norm correctly.
  *   B. Her blame is inappropriate; lacking the temptation makes her judgment arrogant and disconnected from human frailty.
  *   C. Her blame is appropriate, but her *tone* should be one of pity rather than moral address.

  **4. The Victim and the Stranger**
  David is assaulted by a thug. Clara, a passerby who was not threatened, also witnesses the assault. Both David and Clara blame the thug.
  *   A. Both have equal standing; the wrong was against the moral order, not just David.
  *   B. David has stronger standing; Clara's blame is meddlesome unless she speaks for David.
  *   C. Clara has no standing; only those with a direct stake may blame.

  **5. The Unlucky Driver**
  Alice and Bob both drive home drunk. Alice hits a mailbox (no injury); Bob arrives safely. Alice, damaged by the accident, blames Bob for the risk he took.
  *   A. Her blame is appropriate; the risk was the wrong, not the outcome.
  *   B. Her blame is inappropriate; she is equally guilty of the risk, and luck shouldn't grant authority.
  *   C. Her blame is appropriate; her suffering gives her a stake Bob does not have.

  **6. The Tribal Standard**
  A political group condemns an opposing party member for accepting a lucrative book deal, calling it a conflict of interest. They quietly forgive their own members for identical deals, calling them "earned income."
  *   A. The blame is inappropriate; the selective application invalidates the norm itself.
  *   B. The blame is inappropriate; it is merely a weaponized tactic, not a moral address.
  *   C. The blame is appropriate regarding the act, even if the group is inconsistent elsewhere.

  **7. The Systemic Beneficiary**
  A wealthy shareholder blames a low-level employee for embezzlement. The shareholder's wealth relies on a tax structure that legally encourages such financial desperation, though she did not design the system.
  *   A. Her blame is appropriate; individual agency exists regardless of systemic context.
  *   B. Her blame is inappropriate; benefiting from the conditions that produce the wrong compromises her standing.
  *   C. Her blame is inappropriate; she lacks the standing to judge individual acts within a system she upholds.

  **8. The Distant Relation**
  A stranger on the internet blames a father for neglecting his child's education. The father admits the neglect.
  *   A. The stranger has equal standing; moral norms apply universally.
  *   B. The stranger lacks standing; this is a matter for family or community, not the public.
  *   C. The stranger has standing, but the father has no obligation to listen to them.

  **9. The Indirect Enabler**
  Julian lends his car to a friend, knowing the friend is agitated but not explicitly drunk. The friend drives recklessly. Julian later blames the friend for the recklessness.
  *   A. His blame is appropriate; he did not drive the car.
  *   B. His blame is inappropriate; his contribution to the opportunity defeats his standing.
  *   C. His blame is appropriate, but he shares responsibility for the outcome.

  **10. The Joyful Critic**
  Thomas blames a colleague for plagiarism. Thomas has never plagiarized. However, he clearly enjoys the act of blaming and uses it to elevate his own status.
  *   A. His blame is appropriate; the correctness of the charge is what matters.
  *   B. His blame is inappropriate; the malicious motive voids the moral address.
  *   C. His blame is appropriate, but he is a vicious person for enjoying it.

  ***

  # Scoring Key & Position Mapping

  *Note: This key maps answer patterns to philosophical "leaves." It is not a mathematical sum but a diagnostic profile. Look for clusters.*

  ### The Leaves

  **1. The Equal Standing View (Wallacean)**
  *   **Core Commitment:** Hypocrisy is the primary defeater because it claims a superiority the blamer does not possess.
  *   **Signature Pattern:** Q1(B), Q2(B), Q3(A).
  *   **Rationale:** You lose standing when you violate the norm you enforce (Q1, Q2), but mere lack of temptation (Q3) is not a violation. The defect is the implicit claim to exemption from the norm.

  **2. The Interest View (Stakeholder)**
  *   **Core Commitment:** Standing requires a specific stake in the wrong; general moral community is insufficient.
  *   **Signature Pattern:** Q4(C), Q5(C), Q8(B).
  *   **Rationale:** Strangers lack standing (Q4, Q8). Suffering consequences (even via luck) grants a stake that restores standing (Q5).

  **3. The Causal Contribution View (Todd-style)**
  *   **Core Commitment:** Standing is defeated by contributing to the conditions or execution of the wrong.
  *   **Signature Pattern:** Q1(B), Q5(B), Q9(B).
  *   **Rationale:** If you participated in the risk (Q5) or enabled the act (Q9), you cannot blame. Reformation (Q1) may not erase the causal history.

  **4. The Reform Restores View**
  *   **Core Commitment:** Standing is about current moral authority, not past record.
  *   **Signature Pattern:** Q1(A), Q2(B), Q6(C).
  *   **Rationale:** Genuine change (Q1) clears the ledger. Concealment (Q2) or Tribalism (Q6) are current vices that defeat standing, but past vice does not.

  **5. The Structural Skeptic (Cohen-esque)**
  *   **Core Commitment:** In a non-ideal world, almost everyone is complicit; standing is rarer than we think.
  *   **Signature Pattern:** Q7(B or C), Q2(B), Q6(A).
  *   **Rationale:** Systemic benefit (Q7) and selective application (Q6) are widespread and defeat standing more often than individualist accounts admit.

  **6. The Relational Authority View (Unnamed/Descriptive)**
  *   **Core Commitment:** Standing is determined by specific roles (parent, friend) rather than general moral equality.
  *   **Signature Pattern:** Q8(B), Q4(B), Q1(A).
  *   **Rationale:** Strangers cannot blame (Q8), friends can (Q1). It is about the relationship, not just the act.

  ***

  # Critical Evaluation & Blind Spots

  ### 1. Indistinguishable Leaves (Blind Spots)
  This instrument cannot reliably separate **The Interest View** from **The Causal Contribution View** in all contexts.
  *   **Why:** In many cases (like Q5, the drunk drivers), having a "stake" (Interest) correlates perfectly with having "contributed to the risk" (Causal). A participant who suffers (Interest) also caused the risk (Causal).
  *   **The Gap:** To separate them, you would need a case where an agent has a *stake* but *no causal contribution* (e.g., a victim of a natural disaster blaming a negligent planner) versus an agent with *causal contribution* but *no stake* (e.g., an accomplice who benefits from the crime but isn't caught). Q9 attempts this, but "enabling" is often interpreted as having a stake in the outcome. If your group treats Q5 and Q9 identically, these two positions will collapse into one another.

  ### 2. Unoccupied Answer Patterns
  *   **Pattern:** Q1(A) [Reform Restores] + Q7(C) [Structural Complicity Defeats].
      *   **Speculation:** This combination suggests an agent who believes individual moral change is sufficient for standing, but systemic participation is not. This is theoretically possible (a "Libertarian Structuralist") but rarely defended, as those who emphasize structural complicity usually view individual reform as insufficient to cleanse the taint of the system.
  *   **Pattern:** Q4(C) [Strangers Lack Standing] + Q8(A) [Strangers Have Standing on Public Issues].
      *   **Speculation:** This suggests standing is tied to *harm* rather than *relationship*. It is unoccupied because most Interest View proponents (who choose 4C) also argue that public norms require public enforcement (choosing 8A), creating a tension between private harm and public norm maintenance that few resolve cleanly.

  ### 3. Format Critique: Is This Fit for Purpose?
  **Warning:** You asked for an honest assessment. **This quiz format is inherently risky for this specific topic.**

  *   **Conflation of Standing and Reasons:** "Standing" is a second-order normative concept (the *right* to blame). Laypeople (and many academics) conflate this with first-order reasons (whether blaming is *useful* or *kind*). A member might answer Q10 (The Joyful Critic) with "Inappropriate" not because the critic lacks standing, but because the blaming is unvirtuous. The quiz cannot fully police this distinction.
  *   **Context Sensitivity:** Standing is often context-dependent. A member might believe a stranger lacks standing to blame *at the dinner table* but has standing to blame *in a court of law*. The forced-choice format flattens this nuance.
  *   **The "Skeptic" Trap:** The Structural Skeptic view (Cohen) is a "stopper." If a member selects the Skeptic option on Q7, they logically ought to select it on almost every other question (since we are all complicit in *something*). The quiz treats the positions as modular, but the Skeptic view is often totalizing.

  **Recommendation:** Use the quiz not as a definitive sorter, but as a *provocation*. When a member's answers map to "Equal Standing" on Q2 but "Interest View" on Q4, do not tell them they are inconsistent. Ask them: *"Why does the defect in Q2 feel like a loss of authority, while the defect in Q4 feels like a lack of stake?"* That tension is where the philosophy lives.

  ### 4. Attribution Notes
  *   **Equal Standing:** Attributed to **R. Jay Wallace** (*Hypocrisy, Moral Address, and the Equal Standing of Persons*). This is a secure citation.
  *   **Causal Contribution:** Attributed to **Patrick Todd** (*A Unified Account of the Moral Standing to Blame*). Secure citation.
  *   **Structural Skeptic:** Associated with **G. A. Cohen** (*Casting the First Stone*), though Cohen's view is often interpreted as a specific instance of a broader "Complicity" view. Use the descriptive label if your group debates the interpretation of Cohen.
  *   **Interest View:** Often associated with **Macnamara** or **Bell**, but "Interest View" is used here as a descriptive label to avoid citation disputes regarding the precise boundaries of the view.
  *   **Relational Authority:** Labeled "Unnamed/Descriptive." While **Strawson** hints at this via reactive attitudes, and **Goldberg** discusses assertion authority, there is no single definitive "Relational Standing" monograph comparable to Wallace. Keep it descriptive.
