answer: |-
  Here is my decomposition of the heterogeneity problem's lethality, calibrated to the current state of the literature.

  ### Final Credence: 0.48
  I assign a **48% probability** that the heterogeneity problem is fatal for hedonism. This places me slightly more optimistic about hedonism's survivability than you (0.55), and significantly more optimistic than your friend (0.85). My view is that while the problem destroys *sensory* hedonism, *attitudinal* hedonism offers a robust, non-disjunctive shield that is plausible enough to keep the theory alive, even if not entirely unscathed.

  ---

  ### Decomposition of the Probability

  To arrive at 0.48, I have broken the problem down into two sequential hurdles. For hedonism to survive the heterogeneity objection, it must clear both.

  #### Term 1: The Existence of a Unifying Property ($P_{common}$)
  **Probability:** 0.75
  **Definition:** The probability that the pleasure of eating a peach, listening to Beethoven, and savouring a grievance share a *single, non-disjunctive property*.

  **Justification:**
  If we define pleasure strictly as a *felt quality* (a specific sensory "tingle" or phenomenological glow), this probability drops near 0.10. Introspection simply does not reveal a common sensory thread between the coolness of a peach and the sharpness of vindictiveness. This is **settled ground** in the literature: Moore's *Principia Ethica* and Broad's critiques effectively demolished the idea that all pleasures share a unique qualitative tone.

  However, contemporary hedonism has largely shifted to **Attitudinal Hedonism** (championed by Fred Feldman). Here, the common property is not a feeling, but a *pro-attitude* (taking enjoyment in, being pleased that) a state of affairs obtains. It is highly plausible (0.75) that all three cases involve the subject holding a positive propositional attitude toward their experience. This property is non-disjunctive; it is the same psychological relation in all three cases.

  #### Term 2: Theoretical Usability ($P_{usable|common}$)
  **Probability:** 0.70
  **Definition:** Conditional on a common property existing, the probability that it is the sort of thing that can ground *value* in the way hedonism requires.

  **Justification:**
  This is the **genuinely contested** terrain. Even if "pro-attitude" is the common property, does it do the axiological work?
  *   **The Challenge:** Parfit's "worthless pleasures" objection. If I take a pro-attitude toward a delusion (e.g., counting blades of grass) or a moral evil (sadistic vengeance), does that genuinely contribute to *wellbeing*? If the answer is "no," then the common property exists but fails to track value, rendering hedonism normatively inert.
  *   **The Defense:** Hedonists argue that wellbeing is subjective by definition. If the subject enjoys it, it benefits them, even if it is worthless objectively. This move saves the theory but at the cost of intuitive alignment with "the good life."
  *   I assign 0.70 because while the "sadistic pleasure" case is damaging, it is not decisive; many theories of wellbeing struggle with evil preferences, and hedonism's internal consistency here is arguably a feature, not a bug.

  #### Term 3: The Fatal Threshold ($P_{fatal|fail}$)
  **Probability:** 1.0
  **Definition:** If the theory fails to identify a usable, common property, is the problem fatal?

  **Justification:**
  If pleasures share no common property (other than the disjunctive "is one of the things we call pleasure"), hedonism ceases to be a *unified* theory of value and becomes a placeholder for a list. If the common property does not track value, hedonism is false. There is no "third way" for classical hedonism here.

  ---

  ### The Calculation

  The probability that hedonism **survives** is the probability that it clears both hurdles:
  $$P_{survival} = P_{common} \times P_{usable|common}$$
  $$P_{survival} = 0.75 \times 0.70 = 0.525$$

  The probability that the problem is **fatal** is the complement:
  $$P_{fatal} = 1 - P_{survival}$$
  $$P_{fatal} = 1 - 0.525 = 0.475 \approx \mathbf{0.48}$$

  ---

  ### Uncertainty Analysis

  **Least Confident Term:** $P_{usable|common}$ (0.70)
  This is the swampiest part of the terrain. My confidence here is lowest because it depends on a meta-ethical intuition about whether wellbeing *must* be objectively valuable or merely subjectively experienced.

  **What Would Move It:**
  The argument that would most lower my credence (making the problem more fatal) is a robust case of **deceptive malice**. If you can construct a case where a subject takes a pro-attitude toward something that is (a) false, and (b) morally repugnant, and (c) intuitively makes their life *worse* rather than better, Attitudinal Hedonism collapses.
  *   *Example:* A neo-Nazi who derives deep, consistent enjoyment from hatred, but whose life is objectively impoverished and harmful. If you intuit that his wellbeing is *negative* despite his enjoyment, $P_{usable}$ drops toward 0.30, pushing my final fatal credence to ~0.75 (aligning me with your friend).

  **What Would Raise It:**
  A successful argument that "wellbeing" is a purely phenomenological concept with no objective constraints. If it can be shown that Objective List Theories beg the question by assuming objective goods, the Attitudinal Hedonist position becomes the default, raising $P_{usable}$ to 0.90.

  ---

  ### Diagnosing Your Disagreement

  You (0.55) and your friend (0.85) are likely disagreeing on **Term 1 ($P_{common}$)**, specifically regarding the *definition* of pleasure permitted.

  *   **Your Friend (0.85):** Likely assumes **Felt-Quality Hedonism**. If you insist that pleasure must be a specific phenomenological sensation, the heterogeneity problem is indeed devastating. There is no sensory commonality between a peach and schadenfreude. On this view, $P_{common}$ is near 0.10, making the fatal probability very high. This view treats the "swamp" as settled against hedonism.
  *   **You (0.55):** Likely acknowledge **Attitudinal Hedonism** as a valid move. You grant that a common property (pro-attitude) *can* be found ($P_{common}$ is high), but you remain skeptical about whether that property is *valuable* ($P_{usable}$ is lower). You are worried that even if we solve the metaphysical heterogeneity, we lose the normative force.

  **Summary:** Your friend thinks the heterogeneity problem kills the *metaphysics* of pleasure (there is no such thing as a single property). You think it might spare the metaphysics but kill the *axiology* (the property doesn't ground value).

  ---

  ### Literature Status Marker

  To ensure you do not mistake live debates for received views:

  1.  **Settled Ground:** It is widely accepted (post-Moore/Broad) that **Felt-Quality Hedonism** cannot easily solve the heterogeneity problem. If your tutor was attacking classical sensory hedonism, their claim is standard orthodoxy.
  2.  **Genuinely Contested:** Whether **Attitudinal Hedonism** counts as a genuine form of hedonism or a disguised desire-satisfaction theory is live. Furthermore, whether attitudinal pleasure successfully accounts for the *value* of wellbeing (vs. Objective List theories) is the central debate in contemporary wellbeing research (see *The Oxford Handbook of Well-Being and Public Policy*).
  3.  **The "Disjunctive" Loophole:** Some philosophers (e.g., S. V. Heathwood) argue that even if pleasure is disjunctive, it can still be the sole source of value. Whether a disjunctive property can sustain a monistic theory of value is **highly contested**. I have treated this as a failure condition in my calculation, which biases the result toward "fatal." If disjunctivism is allowed, the fatal probability drops significantly.

  **Recommendation for Seminar:** If you wish to challenge the tutor, do not defend sensory pleasure. Instead, ask: *"Does the heterogeneity objection hold against Attitudinal Hedonism, or does it merely force us to abandon Felt-Quality Hedonism? If the former, is the objection metaphysical (no common property) or normative (the property lacks value)?"* This clarifies whether the disagreement is about psychology or ethics.
