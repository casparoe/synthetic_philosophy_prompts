answer: |-
  The load-bearing error is **Premise (1)**.

  Dave's argument is a classic reconstruction of the "Paradox of Voting" from public choice theory, and it is logically valid. If you accept his definitions, his conclusion follows. But philosophical arguments live or die by their definitions, and Premise (1) smuggles in a category mistake that renders the rest of the syllogism politically unintelligible.

  Here is the diagnosis, the defense, and the cost.

  ### The Diagnosis: A Category Mistake in Premise (1)

  Premise (1) states: *Your vote is an act of political participation... only if it matters to the outcome.*

  This premise relies on the definition of "matters" established in Premise (2): *counterfactual dependence* (pivotality). Dave is arguing that an act counts as "participation" only if it is *instrumentally decisive*.

  This is false. It conflates **causal determination** with **causal contribution**.

  In a collective action problem, an individual's contribution can be real and constitutive without being decisive. Consider a choir. If you stop singing, the choir continues. The sound of the choir does not counterfactually depend on your specific vocal cords (Premise 2 is satisfied: you are not pivotal). But if you claim that therefore you are not "participating" in the choir (Premise 1), you have misunderstood what a choir *is*. A choir is not a soloist with backup; it is a collective agent constituted by the sum of its parts.

  Dave's definition of participation in (1) describes a **dictator**, not a **citizen**. In a dictatorship, political participation (in the sense of determining outcomes) is reserved for the one person whose will is pivotal. In a democracy, participation is defined by membership in the collective agent that *jointly* determines the outcome.

  By accepting (1), you concede that the only form of agency that counts is individual, decisive agency. This renders *all* collective action impossible, not just voting. As you noted with the petition example: if (1) were true, no individual signer participates in a million-signature petition. That is a *reductio ad absurdum* of the premise, not a bullet worth biting. It dissolves the very phenomenon (collective action) that political philosophy is supposed to explain.

  ### The Defense: Why (1) Fails and (6) Follows

  You were right to circle the move from (4) to (5), but the rot starts earlier at (1). The move from (4) to (5) is valid *if* (1) is true. Since (1) is false, (5) does not follow from (4).

  However, your worry about Premise (6) (the Fallacy of Composition) is also astute. Dave argues that if every individual vote is a "private ritual," the aggregate is just "parallel rituals." This is where Dave's methodological individualism breaks down most visibly.

  Even if we granted (5) for the sake of argument (that the individual feels like a ritual), (6) is still false because it ignores **emergent properties**. Sixty million private rituals do not create a government. But sixty million *votes* do. Why? Because the votes are not just parallel actions; they are moves in a shared institutional game governed by constitutive rules.

  When you vote, you are not just making a noise; you are invoking a rule that says "this noise counts toward the authorization of power." The *outcome* (the government) is an emergent property of the institutional counting, not a physical sum of causal forces. Dave treats the election like a physical system (where small forces don't move big rocks) rather than a normative system (where small inputs change the status of the whole).

  But the *load-bearing* error is (1). If you fix (1) by defining participation as "contributing to a collective decision rule" rather than "determining the outcome," then (5) collapses (voting *is* participation), and (6) collapses (the election *is* self-government, not just noise).

  ### The Cost: What You Lose by Rejecting (1)

  You asked what rejecting this premise costs. It is not free. If you tell Dave he is wrong about (1), you pay two prices:

  **1. You must abandon Methodological Individualism.**
  Dave's argument is seductive because it relies on a worldview where only individuals are real, and groups are just fictions. By rejecting (1), you are committing to a robust ontology of **collective agency**. You have to argue that "The People" is a real agent, not just a metaphor for sixty million individuals. This puts you in the realm of Hegel, Rousseau, or contemporary social ontology (like Raimo Tuomela or Margaret Gilbert), rather than standard neoclassical economics. You cannot reduce the "public" to the "private."

  **2. You cannot promise the freshman instrumental efficacy.**
  This is the pedagogical cost. You cannot tell the student, "You should vote because you might change the outcome." You know that's a lie (Premise 3 is true).
  Instead, you have to say: "You should vote because it is the act by which you join the collective agent that changes the outcome. You are not the hand that moves the needle; you are one of the fibers in the hand."
  This is a harder sell. It requires the student to care about *membership* and *authorization* rather than *control*. It shifts the justification from **instrumental rationality** (maximizing expected utility) to **constitutive rationality** (fulfilling the conditions of being a citizen).

  ### The Verdict

  Dave wins the empirical battle (Premise 3 is correct; your vote is not pivotal). But he loses the philosophical war because he defines political participation in a way that makes democracy conceptually impossible.

  **Reject Premise (1).**

  Participation is not defined by the *power to determine*, but by the *authority to contribute*. When you vote, you are not trying to be a dictator; you are trying to be a citizen. The former requires pivotality; the latter requires only presence within the rules.

  **How to handle the freshman next fall:**
  Don't dodge with "civic duty." Concede Dave's math. Tell the student:
  *"Dave is right. Your vote will not decide the election. If you vote expecting to be the tie-breaker, you are deluded. But democracy isn't a market where you buy outcomes; it's a team sport where you authorize the coach. If you sit out, you aren't saving your energy; you're quitting the team. The team wins or loses together, but you only get to say 'we' if you played."*

  This preserves the truth of (3) while rejecting the cynicism of (7), by attacking the definition of participation in (1).
