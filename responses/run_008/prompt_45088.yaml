answer: |-
  # Specification: Desiderata for a Philosophy of Mathematics

  An adequate theory must serve two clients: the **working mathematician**, whose practice requires vindication, and the **metaphysician**, whose ontology requires coherence. The following six desiderata constitute the specification.

  ### 1. Face-Value Semantics
  **Requirement:** Ordinary mathematical claims (e.g., "There are infinitely many primes") must be truth-apt. The account of truth must be compositional, supporting negation, conditionalization, and embedding in empirical contexts.
  **Motivation:** *Mathematician:* Logic requires truth values to function; if theorems are not true, deductions regarding bridge safety are invalid. *Metaphysician:* Language about numbers functions grammatically like language about tables; a theory claiming it functions differently owes a semantic error theory.

  ### 2. Identification
  **Requirement:** The theory must either identify mathematical objects with specific entities (e.g., sets) or explain why such identification is unnecessary without rendering reference indeterminate.
  **Motivation:** *Metaphysician:* Reference requires determinacy; if '3' refers to von Neumann ordinals in one context and Zermelo numerals in another, reference fails. *Mathematician:* (Weak motivation) Generally indifferent, provided theorems hold, but requires stability in definitions to avoid equivocation.

  ### 3. Epistemic Access
  **Requirement:** The theory must explain how humans acquire knowledge of mathematical truths. If objects are posited, there must be a plausible mechanism for belief formation regarding them.
  **Motivation:** *Metaphysician:* Naturalism demands that knowledge of $X$ involves some causal or explanatory interaction with $X$. *Mathematician:* Needs to know that proofs yield knowledge, not just coherent symbol manipulation.

  ### 4. Applicability
  **Requirement:** The theory must explain why mathematics applies to the physical world, specifically why it is indispensable to our best physical theories.
  **Motivation:** *Mathematician:* Validates the utility of their work beyond aesthetics. *Metaphysician:* If math is about abstracta, its grip on concrete physics is miraculous; if it is about concreta, its universality is surprising. The link must be non-accidental.

  ### 5. Open Questions
  **Requirement:** The theory must account for the status of statements independent of current axioms (e.g., the Continuum Hypothesis). It must either affirm a fact of the matter or justify the lack thereof.
  **Motivation:** *Mathematician:* Needs to know if searching for new axioms is discovery or stipulation. *Metaphysician:* Needs to know if truth outstrips provability (realism) or is constituted by it (anti-realism).

  ### 6. Consistency with Practice
  **Requirement:** The theory must align with the phenomenology of mathematical practice: mathematicians behave as though describing objects, settle disputes via proof, and reject inconsistency.
  **Motivation:** *Mathematician:* A theory that labels practice as systematic error is revisionist, not descriptive. *Metaphysician:* Practice is data; ignoring it risks building a model of a phenomenon that does not exist.

  ***

  # Critical Evaluation of the Specification

  ### 1. Negotiability and Diagnosis of Prejudice
  To separate genuine constraints from camp prejudices, we must ask: *Which client actually needs this?*

  *   **Face-Value Semantics: Non-negotiable.** Both clients require this. Without truth-aptitude, logic collapses (Mathematician) and language becomes unintelligible (Metaphysician).
  *   **Identification: Negotiable (Metaphysician's Prejudice).** This serves the metaphysician's obsession with ontology but is largely irrelevant to the mathematician. Structuralism satisfies the mathematician perfectly well without identifying numbers with specific sets. This desideratum often functions as a trap to force Platonists into specific set-theoretic reductions.
  *   **Epistemic Access: Negotiable (Nominalist's Prejudice).** This is the most contentious. It assumes a causal theory of knowledge appropriate for empirical objects is applicable to necessary truths. It serves the Naturalist Metaphysician but imposes an empirical standard on non-empirical domains. The Mathematician cares about *justification* (proof), not causal contact.
  *   **Applicability: Non-negotiable.** Both clients need this. Physics works; any theory claiming math is fiction or mere syntax must explain why the fiction predicts particle spin.
  *   **Open Questions: Negotiable.** This is a divide within the mathematician community itself (Realists vs. Formalists). Philosophy should not dictate axiomatic policy.
  *   **Consistency with Practice: Non-negotiable.** A philosophy of mathematics that contradicts mathematics is failed philosophy.

  ### 2. Joint Unsatisfiability
  There is a strong argument that **Face-Value Semantics** and **Epistemic Access** (as construed by Naturalism) are jointly unsatisfiable. This is the core of Benacerraf's Dilemma.
  *   **Status:** *Argued, not proven.* It relies on the premise that "knowledge requires causal contact." If one rejects this premise (e.g., by positing a rationalist faculty or rejecting naturalism), the conflict dissolves. However, under standard contemporary naturalistic assumptions, you cannot have abstract objects that are truth-makers (Semantics) and also causally inert (Access).
  *   **Implication:** Adequacy for both clients simultaneously may be impossible. The Metaphysician (Naturalist) demands Access; the Mathematician demands Semantics. A theory must shortchange one. Usually, Platonism shortchanges the Naturalist Metaphysician; Nominalism shortchanges the Mathematician's semantics.

  ### 3. Most Exclusionary Desideratum
  **Epistemic Access (Causal Constraint)** excludes the most candidates.
  *   **Why:** It is the primary weapon against Platonism. By defining "knowledge" in terms of causal interaction, it *a priori* excludes any ontology containing causally inert objects. It forces a theory to either deny abstract objects (Nominalism) or deny Naturalism (Rationalism/Platonism). It is more exclusionary than Face-Value Semantics because Nominalists can offer paraphrases (however costly) to mimic truth-aptness, but Platonists cannot manufacture causal links for abstracta without ceasing to be Platonists.

  ***

  # Scorecard

  **Mathematical Platonism**
  Platonism scores highest on **Face-Value Semantics**, **Applicability**, and **Consistency with Practice**. It takes mathematicians at their word: statements are true, objects exist, and practice is veridical. It handles **Open Questions** well by positing objective truth values independent of proof. However, it fails **Epistemic Access** catastrophically under naturalistic assumptions, offering no mechanism for how physical brains grasp abstract realms. It also stumbles on **Identification**, as it struggles to explain why numbers *are* sets rather than merely *modeled* by them.

  **Field-Style Nominalism**
  Field's nominalism aces **Epistemic Access** by restricting ontology to concrete entities, satisfying the Naturalist Metaphysician. It attempts to salvage **Applicability** by arguing math is a conservative instrument. However, it fails **Face-Value Semantics**, rendering standard mathematical claims literally false (requiring paraphrase). It struggles severely with **Consistency with Practice**, implying mathematicians are systematically mistaken about their own ontology. Furthermore, its failure to nominalize Quantum Field Theory weakens its claim on **Applicability**, leaving it incomplete for modern physics.

  **Hellman's Modal Structuralism**
  Hellman attempts a synthesis. It satisfies **Face-Value Semantics** by interpreting claims as modal truths about possible structures ("If a structure of type $S$ existed, it would have property $P$"). It improves on **Epistemic Access** by grounding knowledge in logical possibility rather than causal contact with objects. It handles **Identification** well via structuralism. However, it faces costs on **Applicability** (explaining why the physical world instantiates these possibilities) and **Open Questions** (modal facts about sets can be as obscure as set facts). It risks satisfying neither client fully: too modal for the Naturalist, too structural for the naive Realist.
