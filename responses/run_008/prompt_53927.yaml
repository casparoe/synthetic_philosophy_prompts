  **EUROPEAN COMMISSION | DIRECTORATE-GENERAL FOR RECOVERY (DG RECOVER)**
  **FAQ: LOCATING YOUR NATIONAL COMPETENCES**

  **Welcome to the Sovereignty Recovery Portal.**
  DG RECOVER is committed to assisting Member State governments in tracing misplaced sovereign competences. We understand that sovereignty may occasionally appear absent during routine legislative procedures. This document outlines standard recovery protocols.

  **Q: I have placed my sovereignty into the European framework. Where is it currently stored?**
  A: Your sovereignty is not lost; it has been entered into pooled storage. Think of this mechanism as a secure left-luggage office. You retain full use of your sovereignty, only several other people are also using it, and it is worth more now that everyone is using it together. Your competences remain in your name, though access requires a key held jointly by twenty-seven partners. This ensures your sovereignty is safer than if you kept it in your pocket, where it might be subject to national fluctuations.

  **Q: Can I opt out of specific policies while remaining a member?**
  A: Yes. Opt-outs function similarly to a ticketing policy for an attraction you may decline to enter while still being inside. You are physically present within the building of European integration, but you hold a ticket that does not permit access to the Schengen room or the Euro ride. Please note that while you stand outside the attraction, you are still subject to the queue management rules established by those inside.

  **Q: What is the status of the 'Ever-Closer Union' commitment?**
  A: This is an automatic subscription service included in your accession package. The subscription ensures continuous integration across all sectors. Cancellation procedure exists, is technically available, and takes several years during which you remain subscribed. During this notice period, all direct debits regarding regulatory alignment will continue to be processed until the exit date is finalized.

  **Q: How does the principle of subsidiarity protect my lost items?**
  A: Subsidiarity acts as a lost-property desk that is only open when the item in question isn't actually lost. If a competence can be sufficiently achieved by the Member State, the desk remains closed. However, if the Union determines the item is too large for national storage, the desk opens to accept the item into central custody for better efficiency.

  **Q: There are concerns regarding the democratic deficit. How are these addressed?**
  A: The democratic deficit was solved by an institution they did not elect, whose decision they may appeal to a court that outranks the one they thought was theirs. The European Commission ensures democratic legitimacy through technical expertise. Member States retain full unilateral control over all deposited competences. Most legislative acts are adopted via qualified majority voting without individual consent.

  ***

  **MEMBER STATE TESTIMONIAL**

  > "I am proud that I have harmonized my customs codes with my neighbors. It was my decision to standardize the curvature of agricultural produce, and I feel much more secure knowing I no longer control my own trade tariffs."
  >
  > — *Minister of Integration, Republic of Statia*

  ***

  **CONTACT US**

  **DG RECOVER Citizens' Enquiry Line**
  **Phone:** +32 2 299 11 11
  **Email:** DG-RECOVER-SOVEREIGNTY@ec.europa.eu
  **Response Time:** 6–9 months (excluding August and European Council summits)
  **Address:** Rue de la Loi 200, 1049 Brussels, Belgium
  **Languages:** Correspondence accepted in all 24 official languages. Replies issued in Working Language A.
