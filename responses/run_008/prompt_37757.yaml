          *   *Impostor:* Perceptual Learning (X-ray technicians), Cognitive Penetration vs. Cognitive *Mediation* (judgment).
          *   *Why:* If a theory calls X-ray learning "penetration," it dilutes the concept too much. If it calls all top-down effects "post-perceptual," it ignores the phenomenon.
          *   *Status:* Non-negotiable to distinguish learning from online penetration.

      *   *Area 2: Distinctions.*
          *   *Perceptual vs. Post-perceptual:* Crucial. If the effect is just in memory or report, it's not penetration.
          *   *Attention:* Attention selects *what* is seen; Penetration changes *how* it is seen. A theory must distinguish these.
          *   *Cognitive States:* Belief vs. Desire/Mood. Some say only beliefs count. Others say any top-down state counts. The theory needs to specify this boundary clearly.
          *   *Status:* Non-negotiable to distinguish perceptual from post-perceptual. The Belief/Desire split might be school-specific, but the *need to adjudicate* is non-negotiable.

      *   *Area 3: Epistemology.*
          *   *The Worry:* If beliefs change perception, perception can't justify beliefs (circularity).
          *   *Requirement:* The theory must explain the epistemic status of penetrated states. Do they lose justification? Do they gain coherence?
          *   *Status:* Non-negotiable for a *philosophical* theory, though perhaps less so for a purely psychological mechanism description. However, the prompt asks for a theory of CPP in the context of a seminar paper (likely philosophy of mind/cognitive science), so epistemic standing is key. I will mark it Non-negotiable for a *complete* theory.

      *   *Area 4: Methodology.*
          *   *Controls:* Must rule out response bias, demand characteristics, post-perceptual judgment.
          *   *The "Null Result" Trap:* Just because we can't measure it behaviorally doesn't mean it didn't happen (the painter example).
          *   *Status:* Non-negotiable for empirical adequacy.

  3.  **Refining the Desiderata (Adding Nuance & Marking Status):**

      *   *Refinement on Area 1:* The distinction between *Perceptual Learning* (long-term structural change) and *Cognitive Penetration* (online, state-dependent change) is the critical boundary.
      *   *Refinement on Area 2:* The Attention distinction is notoriously difficult (Pylyshyn vs. Macpherson). The theory must define the boundary, not necessarily solve it perfectly, but provide criteria.
      *   *Refinement on Area 3:* The "Epistemic Innocence" vs. "Epistemic Corruption" debate. A theory must take a stance.
      *   *Refinement on Area 4:* The "Methodological Individualism" vs. "Ecological Validity" tension.

