answer: |-
  Below is a specification of adequacy for a theory of cognitive penetrability. It is designed to function as a classificatory tool for empirical claims, distinguishing genuine penetration from confounding variables, while ensuring the theory carries the necessary philosophical weight.

  ### Specification of Adequacy for a Theory of Cognitive Penetrability

  #### 1. The Case-Classification Desideratum
  **Requirement:** The theory must provide principled criteria for distinguishing *online cognitive penetration* from *perceptual learning* and *sensory adaptation*.
  *   **The Paradigm:** Cases where a transient cognitive state (e.g., a current belief, desire, or mood) alters the phenomenal character or content of a perceptual experience in real-time (e.g., the hill looking steeper when fatigued).
  *   **The Impostor:** Cases where long-term training structurally retunes the sensory apparatus (e.g., the radiologist seeing anomalies in an X-ray). This is developmental plasticity, not cognitive penetration.
  *   **The Boundary:** The theory must specify a temporal and mechanistic cutoff. Penetration must be state-dependent and reversible upon the cessation of the cognitive state, whereas learning is trait-like and persists without the active state.
  *   **Status:** **Non-negotiable.** Without this distinction, the concept of penetration collapses into general neuroplasticity, rendering it useless for distinguishing specific top-down causal pathways.

  #### 2. The Locus-and-Distinction Desideratum
  **Requirement:** The theory must rigorously locate the effect within the perceptual system and distinguish it from attentional selection and post-perceptual judgment.
  *   **Perceptual vs. Post-Perceptual:** The theory must offer a mark of the perceptual (e.g., phenomenology, neural timing, informational encapsulation) to prove the effect occurs *before* belief formation or memory encoding. If a subject reports a color shift due to language, the theory must rule out that they are merely *judging* or *remembering* it differently.
  *   **Penetration vs. Attention:** The theory must distinguish between *selecting* an object for processing (attention) and *altering* the processing of the object itself (penetration). Attention changes what is seen; penetration changes how it looks.
  *   **Cognitive Scope:** The theory must adjudicate which top-down states count as "cognitive." It cannot simply assume beliefs count while desires do not (or vice versa); it must provide a definition of "cognitive" that justifies the inclusion or exclusion of moods, emotions, and desires.
  *   **Status:** **Non-negotiable** for the Perceptual/Post-perceptual and Attention/Penetration distinctions. **School-Specific** for the Cognitive Scope (e.g., some theories restrict penetration to propositional attitudes, others include affective states).

  #### 3. The Epistemic Payoff Desideratum
  **Requirement:** If the theory affirms penetrability, it must provide an account of the epistemic status of penetrated perceptual states.
  *   **The Challenge:** If perception is shaped by belief, it risks circularity (believing *p* makes me see *p*, which justifies believing *p*).
  *   **The Account:** The theory must explain whether penetrated perceptions are epistemically degraded (losing their status as independent evidence), epistemically neutral, or potentially improved (e.g., via coherence or predictive efficiency). It cannot merely assert penetration exists without addressing the "impartial check" worry.
  *   **Status:** **Non-negotiable** for the *requirement to provide an account*. **School-Specific** for the *verdict* (e.g., a coherentist may argue penetration improves justification; a foundationalist may argue it destroys it).

  #### 4. The Methodological-Constraint Desideratum
  **Requirement:** The theory must define valid evidence for penetration while avoiding the "Null-Result Fallacy."
  *   **Controls:** Any empirical claim classified as penetration must be shown to survive controls for response bias, demand characteristics, and post-perceptual memory contamination.
  *   **The Null-Result Trap:** The theory must not infer that perception is *unaffected* merely because behavioral output is uncompromised. (As in the painter example: if perception shifts but motor output compensates, behavior remains constant). A theory cannot use the stability of action to disprove the malleability of experience.
  *   **Status:** **Non-negotiable.** A theory that accepts behavioral compensation as proof of perceptual stability is empirically blind to the phenomenon it seeks to describe.

  ---

  ### Analysis of Tensions and Filtering Power

  You asked two specific questions regarding the interaction of these desiderata and their power to filter candidate theories.

  #### 1. Are any subsets of the desiderata jointly unsatisfiable?
  There is a significant tension, though not a logical contradiction, between **Desideratum 2 (Locus)** and **Desideratum 4 (Methodology)** when combined with **Desideratum 3 (Epistemology)**.

  *   **The Tension:** To satisfy the **Locus** requirement, a theory must prove the effect is truly perceptual and not post-perceptual. The gold standard for this is often early neural timing or phenomenological report. However, the **Methodology** requirement warns against relying solely on report (due to bias) and warns against relying solely on behavior (due to the compensation trap).
  *   **The Conflict:** If a theory insists on strict behavioral verification to satisfy Methodological rigor, it may fail to detect penetration that is phenomenologically real but behaviorally compensated (violating the spirit of Methodology). Conversely, if it relies on phenomenology to satisfy the Locus requirement, it opens itself to charges of failing Methodological controls (subjectivity/bias).
  *   **The Epistemic Complication:** If a theory resolves this by positing that penetrated states are epistemically degraded (**Desideratum 3**), it faces an evolutionary pressure argument: why would a system evolve to let cognition distort the very data it needs for survival? If the theory argues the distortion is adaptive (epistemically/pragmaically *improved*), it must explain how this avoids the circularity problem.
  *   **Verdict:** They are not *logically* unsatisfiable, but they create a "narrow corridor" for theory construction. A theory must posit a mechanism that is detectable without relying solely on behavior (to avoid the compensation trap) yet robust enough to survive controls for bias (to avoid the subjectivity trap), all while explaining why this mechanism doesn't render the organism epistemically helpless. Most existing theories fail one leg of this triad.

  #### 2. Which single requirement does the most to admit or exclude candidate theories?
  The **Perceptual vs. Post-Perceptual Distinction (within Desideratum 2)** is the primary gatekeeper.

  *   **Reasoning:** The vast majority of empirical claims regarding cognitive influence (the "New Look" psychology studies, language effects on color, mood effects on brightness) can be explained away by positing a shift in *judgment*, *memory*, or *criterion setting* rather than a shift in *perception*.
  *   **Exclusionary Power:** A theory that cannot rigorously define the boundary of the "perceptual" (e.g., by neural architecture, informational encapsulation, or phenomenological immediacy) will fail to classify any case definitively. It will either classify everything as penetration (collapsing into global holism) or nothing as penetration (collapsing into strict modularity).
  *   **Why it dominates:** The Epistemic desideratum only applies *if* penetration is established. The Methodological desideratum is about *how* we find it. But the Locus desideratum determines *what it is*. If a theory cannot distinguish a change in how the world *looks* from a change in what the subject *says* about the world, it cannot function as a theory of perceptual penetration at all. Therefore, the specification of the perceptual boundary is the single most demanding and exclusionary criterion.
