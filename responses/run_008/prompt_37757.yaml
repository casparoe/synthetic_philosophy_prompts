      *   *Refinement on Methodology:* The prompt specifically mentions the "Painter's Paradox" (inferring unaffected perception from lack of behavioral distortion). I need to explicitly include a desideratum against this fallacy.

  7.  **Final Polish:** Check the "Non-negotiable" vs "School-Specific" tags.
      *   *Non-negotiable:* Distinguishing perceptual from post-perceptual, ruling out demand characteristics, accounting for epistemic status *if* penetration is affirmed.
