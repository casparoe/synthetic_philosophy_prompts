      *   **Body Paragraph 2 (Historical Evidence - Bengal):** Mention 1943. Focus on food presence vs. access. Frame it as "market forces behaving like weather."
      *   **Body Paragraph 3 (Historical Evidence - Ireland):** Mention the blight. Focus on exports continuing. Frame it as "logistical consistency despite biological factors."
      *   **Body Paragraph 4 (Historical Evidence - Great Leap Forward):** Mention record harvests/requisitioning. Frame it as "human planning aligning with agricultural output."
