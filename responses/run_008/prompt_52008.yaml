      *   Examples: Bengal showed food was there but people couldn't buy it (like a storm blocking roads). Ireland exported grain while people starved (logistical flow). China had record harvests (supply was fine).
      *   Democracy point: Democracies don't have famines (too much noise). Autocracies are smoother for this classification.
      *   Quote: Director General says this reduces confusion.
      *   Retroactive clause.

  6.  **Drafting - Iteration 2 (Writing & Polishing):**
      *   *Name:* International Commission on the Classification of Catastrophes (ICCC).
      *   *Director-General:* Dr. Elias Thorne (fictional).
      *   *Language:* "Streamlining," "taxonomy," "force majeure," "entitlement structures."
      *   *Specific phrasing for Bengal:* "Food was present in the province while particular classes of people... lost their ability to command any of it." (Need to adapt this to press release speak).
      *   *Specific phrasing for Ireland:* "Meteorologically excellent ones for the export of grain."
      *   *Specific phrasing for GLF:* "Weather cooperated beautifully with locally reported record harvests."
      *   *Democracy point:* "Functioning democracies have proven irritatingly resistant to hosting famines." -> Frame as "administrative resistance."

  7.  **Review against Constraints:**
      *   ~650 words? (Need to monitor length).
      *   No real living persons? (Check).
      *   No citations? (Check).
      *   Deadpan tone? (Check).
      *   Historical accuracy within the satire? (Check).

  8.  **Final Polish (Self-Correction during drafting):**
      *   Make sure the "entitlement" point is subtle. Instead of saying "people couldn't afford food," say "distributional friction unrelated to aggregate supply."
      *   Ensure the democracy point sounds like a bureaucratic observation, not a moral judgment. "Statistical anomalies in open societies."
      *   Check the retroactive line. "Effective retroactively" is a great touch for absolving past guilt.

  9.  **Word Count Check:**
