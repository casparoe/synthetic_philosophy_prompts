      *   **Audience:** General readers should feel something is wrong; experts (Amartya Sen fans) should recognize the skewering.

  2.  **Deconstruct the Satire:**
      *   The core irony is bureaucratic efficiency overriding moral reality. By calling famine a "natural disaster," accountability disappears.
      *   The historical examples need to be presented as *evidence* supporting the reclassification, when actually they prove the opposite (political failure).
      *   The language needs to be sterile, administrative, and self-congratulatory.

