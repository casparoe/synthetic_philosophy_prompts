      *   **Target:** The "act-of-God" framing of famine (starvation as weather vs. something done to people).
      *   **Tone:** Deadpan institutional prose (press-release boilerplate, subsection headings, quotable director-general). No winking, no explicit editorializing.
      *   **Content Requirements:**
          1.  Jokes drawn from actual historical record (Bengal 1943, Ireland's blight, Great Leap Forward).
          2.  Smuggle in genuine analytical points (famines occur without overall shortage, failures of entitlement vs. supply, easier in countries without free press/democracies).
