      *   *Analytical Points:* Entitlement failure (Sen's core thesis), free press/democracy correlation.
      *   *Tone Check:* Ensure no sarcasm marks. It must sound like they genuinely believe this is an improvement.

  5.  **Drafting - Iteration 1 (Mental Outline):**
