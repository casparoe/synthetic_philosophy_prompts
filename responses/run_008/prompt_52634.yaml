  2.  **Deconstruct the St. Petersburg Paradox (SPP):**
      *   *The Math:* $E = \sum (1/2^n) * 2^n = \sum 1 = \infty$.
      *   *The Intuition:* No one pays \$100 to play.
      *   *The "Solutions":*
          *   Bernoulli (Utility): $U(x) = \log(x)$.
          *   Finite Bankroll (Practicality): Casino goes broke.
          *   Probability Weighting (Behavioral): People ignore tiny probs.
          *   Ergodicity (Peters): Time average vs. Ensemble average.
      *   *The Problem:* New versions of the paradox arise for every solution (e.g., Super St. Petersburg for utility functions).

  3.  **Address the Core Question: What kind of disagreement is this?**
      *   Is it verbal? Partly. People define "rationality" differently.
      *   Is it substantive? Yes. It's about the foundations of decision theory.
      *   Is it talking past each other? Yes. Some are doing normative theory (how one *should* decide), others descriptive (how people *do* decide), others practical (what's physically possible).
      *   *Diagnosis:* It's a **category error** mixed with a **foundational crisis in decision theory**. It's not just one question; it's a cluster of questions masquerading as one.

  4.  **Evaluate "Settling" the Dispute:**
