  My roommate Elena went down a "wisdom of crowds" rabbit hole after we watched some documentary about jury verdicts being overturned, and over the last few months she's accumulated a bunch of verdicts about when a group's majority vote actually tracks the truth. Her record so far: she says a 12-person jury where each juror independently gets it right about 60% of the time will have a majority verdict that's right more often than any single juror, and that adding jurors keeps helping, essentially without limit. She waved off a case where individual voters are right less than half the time — says the majority is doomed no matter how big the pool gets. But she also refuses to trust a panel of 20 experts who are each right 70% of the time when they all trained under the same mentor and read the same reports, because once their errors travel together the headcount is fake. And she's suspicious of groups that debate before voting even when everyone's individually decent, since they merge into one big brain that can make one big mistake.

  Here's why I need her: I run a little prediction-club thing at work where members answer weekly questions via an anonymous form. We have 25 members, each probably right about 53-54% of the time, no deliberation, all submissions fully independent in the mechanical sense — but everyone skims the same two industry newsletters, so their errors are correlated, just weakly. When a bare majority forms (say 14 to 11), should I trust it more than our single best member, who's right about 58% of the time? It's real money on the line (well, a $20 gift card), so I want to get this right.

  Predict what Elena would say about my club. It seems like her verdicts fit more than one underlying rule — one that's basically the jury theorem applied strictly, one where any correlation at all is fatal, maybe one that demands a real margin of competence above half — and they'd come apart on my case. Tell me which rule you think she's actually running, what each rule predicts for my 14-to-11 majority vs my 58% star, your best guess with your reasons, and what hypothetical case I could pose to her that would cleanly separate the rules. Under 350 words please, I'm sending this from my phone in a meeting.
