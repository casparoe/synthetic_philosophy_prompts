answer: |-
  | Desideratum | Motivating case | Non-negotiable or camp preference | Contenders eliminated |
  | :--- | :--- | :--- | :--- |
  | **Acausal Profitability Denial**<br>The adversary's expected utility from threatening must be lower than from abstaining, conditional on their simulation of your policy. | *The Logical Blackmail:* An adversary simulates you; if Sim(You) pays, they threaten. If the defense allows paying in any equilibrium, the threat occurs. | **Non-negotiable.** If the threat remains profitable, the defense has failed its primary function. | None (this is the baseline goal). |
  | **Cooperative Viability**<br>The policy must distinguish between coercive threats and mutually beneficial trades to avoid isolating the agent. | *Parfit's Hitchhiker:* An agent that rejects all conditional demands also rejects paying a driver who demands payment *after* providing a ride, leading to starvation/isolation. | **Non-negotiable.** A defense that prevents cooperation is maladaptive in multi-agent environments. | **Disproportionate Retaliation.** Hard to limit retaliation strictly to extortionists without damaging trade partners. |
  | **Reflective Stability**<br>The agent must not wish to self-modify or abandon the defense when facing the threat directly (dynamic consistency). | *The Gun to the Head:* An agent precommitted to "never pay" will, upon being threatened, realize paying is now causally optimal and wish to rewrite its own code. | **Non-negotiable.** Unstable commitments are not commitments; they are bluffs the adversary will call. | **Disproportionate Retaliation.** Often dynamically inconsistent unless the retaliation cost is internalized pre-threat. |
  | **Situated Adoptability**<br>The defense must be adoptable by an agent that already exists and was not designed with this specific threat in mind. | *The Legacy Agent:* A human or deployed AI discovers acausal extortion risks post-deployment and cannot reset its source code to a "design time" state. | **Camp Preference (Timeless vs. Situated).** Updateless theorists argue rational agents act *as if* they precommitted; causal agents require actual adoptability. | **Updateless Precommitment.** By definition, requires commitment at $t_0$ (design time), impossible for legacy agents. |
  | **Cognitive Overhead**<br>The computational or psychological cost of maintaining the defense must be low in worlds where no adversary appears. | *The Paranoia Tax:* An agent that constantly simulates blackmail scenarios or maintains complex surrogate values wastes resources in safe worlds. | **Non-negotiable (Embeddedness).** Resource-bounded agents cannot sustain high-cost defenses indefinitely. | **Surrogate Goals.** Maintaining a dual-value system (real + surrogate) requires constant vigilance to prevent value drift. |
  | **Adversarial Robustness**<br>The defense must remain effective even if the adversary models the defense mechanism itself (including the discriminator). | *The Transparent Discriminator:* The adversary simulates your "Threat/Trade" filter and crafts a demand that technically passes the filter but functions as extortion. | **Non-negotiable.** In acausal settings, opacity is impossible; the adversary sees your logic. | **Surrogate Goals.** If the adversary models your surrogate mapping, they can target the surrogate directly. |

  ### Brief Scoring of Defenses

  *   **Updateless Precommitment:** Scores highest on **Profitability**, **Stability**, and **Robustness**. It fails **Situated Adoptability** completely (it is a design-time property, not a runtime fix). It risks **Cooperative Viability** if the precommitment policy is too rigid (e.g., "never pay" vs. "never pay *unjustified* demands").
  *   **Surrogate Goals:** Scores well on **Profitability** (makes threats irrelevant) and **Adoptability** (can be learned). It struggles significantly with **Cognitive Overhead** (maintaining fake values is costly) and **Adversarial Robustness** (if the adversary models the surrogate mapping, they simply threaten the surrogate).
  *   **Disproportionate Retaliation:** Scores well on **Profitability** (deters via cost). It fails **Reflective Stability** (why carry out the costly threat once blackmailed?) and **Cooperative Viability** (high risk of punishing legitimate trade disputes). It requires strong precommitment machinery to be stable.

