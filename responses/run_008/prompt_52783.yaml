  2. The strong reading posits that human nature is constitutively virtuous such that lacking these sprouts denies one's humanity, which is plausible normatively but risks contradicting observable reality, yet preserves the tutor's formula by asserting a metaphysical goodness Xunzi explicitly denies. This makes the debate genuine.
  3. Xunzi's raw-material reading argues inborn desires are chaotic and bad while the capacity for artifice is separate, which is highly plausible and compatible with Mencius's growth metaphors, suggesting the tutor's formula survives only if ignoring the shared belief in transformability.
  4. Under the definitional reading, Mencius includes moral potential in nature while Xunzi restricts it to biological instincts, which is extremely plausible and implies they talk past each other, meaning the tutor's good-versus-bad formula survives merely as a verbal shorthand rather than a substantive clash.
  5. A substantive conflict remains only if Mencius sees nature as a normative guide while Xunzi sees it as resistance to be overcome, which is plausible and ensures the tutor's formula survives as a marker of opposing teleologies rather than psychological descriptions. This makes the debate genuine.
