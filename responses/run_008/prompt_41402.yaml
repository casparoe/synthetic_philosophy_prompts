      *   *Check Philosophy:* Ensure I'm referencing the right debates (Hempel, Dray, Gallie, Danto, maybe some contemporary mechanism folks).
      *   *Self-Correction during drafting:* I initially thought about bringing in counterfactuals. I should mention them in section 3 or 4 as a test of explanatory strength.
