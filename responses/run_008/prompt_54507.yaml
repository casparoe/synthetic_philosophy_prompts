answer: |-
  ### Exam Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (but quality over quantity)

  **Question:**
  Consider the "Stakes Transfer" case: A low-stakes speaker (Sally) knows that *p* (e.g., the bank is open Saturday). She testifies that *p* to a high-stakes hearer (Harry), who has identical evidence to Sally but faces disastrous consequences if *p* is false. Harry does not check further sources.

  Your friend argues this is a *reductio* of Pragmatic Encroachment: it is absurd to claim Sally knows *p*, tells Harry *p*, and yet Harry fails to know *p*. They argue that knowledge must be transferable via testimony; if it isn't, the concept of knowledge is broken.

  Write an essay evaluating this objection. In your answer, you must address:
  1.  Whether Pragmatic Encroachment faces a unique problem here compared to Contextualism or Classical Invariantism.
  2.  The mechanism of testimony: Does testimony transmit *knowledge itself*, or does it transmit *evidence/warrant* that the hearer must then satisfy their own standards with?
  3.  Whether the intuition that "Harry should check the source himself" supports or undermines the claim that Harry lacks knowledge.

  Do not cite specific authors. Rely on philosophical argumentation.

  ***

  ### Model Answer

  The "Stakes Transfer" objection relies on a specific assumption about testimony: that knowledge is a substance passed directly from speaker to hearer. If knowledge were a bucket of water, and Sally has a full bucket, pouring it into Harry's bucket should fill it. The friend's *reductio* claims that Pragmatic Encroachment breaks this transfer mechanism, resulting in an absurd asymmetry where knowledge vanishes mid-sentence. However, this objection fails because it mischaracterizes how encroachment interacts with testimonial warrant.

  First, we must distinguish Encroachment from Contextualism. A Contextualist can easily dissolve the asymmetry by arguing that "knows" shifts meaning. When Sally says "I know," she meets a low standard. When we evaluate Harry, the context shifts to a high standard, so "Harry knows" is false. The sentence "Sally knows but Harry doesn't" is semantically consistent. Pragmatic Encroachment, however, holds that "knows" is invariant while the *threshold* for knowledge shifts based on practical circumstances. For the Encroacher, the asymmetry is real, not semantic. The friend finds this metaphysically suspicious, but it is not logically incoherent.

  The crux of the defense lies in the mechanism of testimony. Classical Invariantism suggests testimony transmits knowledge directly; if Sally knows, and Harry trusts her, Harry knows (absent defeaters). Encroachment requires a more nuanced view: testimony transmits *evidence* or *justification*, not the status of knowledge itself. Sally's testimony provides Harry with the same propositional evidence she possesses. However, whether that evidence constitutes *knowledge* depends on the subject's own practical environment. Because Harry's stakes are higher, the evidential threshold required for him to know is higher. Sally's testimony provides enough evidence to clear the low-stakes bar, but not the high-stakes bar. Thus, the "loss" of knowledge isn't a magical disappearance; it is a failure of the transmitted evidence to meet the hearer's specific normative threshold.

  This aligns with the intuition that Harry should check the source. If Encroachment is true, knowledge is tied to action. To say Harry "knows" implies it is rational for him to act on *p* without further inquiry. But given the high stakes, it is *not* rational for Harry to act without verification. Therefore, attributing knowledge to Harry would license irrational action. The Encroacher predicts exactly what we observe: Harry feels he doesn't know, and he seeks further evidence. The friend calls this a bug; the Encroacher calls it a feature. It explains why we demand more from witnesses in high-stakes trials than in casual conversation, even if the witness is equally confident.

  Ultimately, the *reductio* fails because it assumes knowledge transmission must be stakes-insensitive. If we accept that knowledge norms action, and stakes vary between agents, then testimonial knowledge must be sensitive to the hearer's stakes. The asymmetry is not a breakdown of the concept, but a reflection of the agent-relative nature of epistemic norms. Encroachment survives the Stakes Transfer case by treating testimony as a transfer of warrant that is subsequently evaluated against the hearer's practical context, rather than a direct transfer of epistemic status.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Understanding of Positions (5 Marks)**
  *   **5:** Clearly distinguishes Encroachment (threshold shifts), Contextualism (meaning shifts), and Invariantism (fixed threshold/evidence). Explains why the case pressures Encroachment specifically.
  *   **4:** Correctly defines positions but lacks precision on why Encroachment is uniquely targeted compared to Contextualism.
  *   **3:** Definitions are vague or conflates Encroachment with Contextualism.
  *   **0-2:** Significant misunderstanding of the core positions.

  **2. Analysis of Testimony Transmission (5 Marks)**
  *   **5:** Explicitly analyzes *what* is transmitted (evidence vs. knowledge status). Argues that hearers inherit warrant but apply their own thresholds.
  *   **4:** Discusses testimony but treats it as a black box (e.g., "Sally tells Harry") without analyzing the mechanism of transfer.
  *   **3:** Mentions testimony only to restate the case facts.
  *   **0-2:** Ignores the testimony mechanism entirely.

  **3. Critical Evaluation of the Reductio (5 Marks)**
  *   **5:** Evaluates the "absurdity" claim. Connects the "Harry should check" intuition to the definition of knowledge (knowledge-action link). Argues whether the asymmetry is a bug or a feature.
  *   **4:** Evaluates the reductio but relies on intuition pumping without connecting it to the norms of action or evidence.
  *   **3:** Takes a side (Encroachment is right/wrong) without evaluating the strength of the friend's objection.
  *   **0-2:** Merely summarizes the friend's argument without evaluation.

  **4. Structure, Clarity, and Argumentation (5 Marks)**
  *   **5:** Argument is cohesive, flows logically, and stays within the philosophical scope (no unnecessary fluff).
  *   **4:** Clear but some disjointed transitions or minor digressions.
  *   **3:** Difficult to follow or disorganized.
  *   **0-2:** Incoherent or significantly below expected writing standard.

  **Differentiation Guide (A vs. B)**
  *   **B Range (14–16 Marks):** The student correctly explains Encroachment, Contextualism, and Invariantism. They accurately describe the Stakes Transfer case and explain *that* the Encroacher says Harry doesn't know. However, they run out of steam on the *mechanism*. They treat testimony as a given and focus mostly on defining the stakes. They conclude by saying "Encroachment allows this, Invariantism doesn't," without analyzing *why* testimony would function differently under Encroachment.
  *   **A Range (17–20 Marks):** The student goes beyond definition to analyze the *transmission principle*. They identify that the friend's objection assumes knowledge is a "stative" transferred object, whereas Encroachment treats it as a relation between evidence and practical context. They utilize the "Harry should check" intuition to argue that knowledge norms action, thereby defending the asymmetry as a virtue rather than a vice. They explicitly address whether Contextualism faces this problem (it doesn't, due to semantic shift) to isolate the burden on Encroachment.
