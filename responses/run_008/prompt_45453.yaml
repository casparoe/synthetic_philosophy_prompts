      *   **Diagnosing Premise (5):** This is the main failure point. Distinguish between *semantic content* (aboutness) and *truth conditions* (ontology). Explain Lewis's distinction.
      *   **Diagnosing Premise (1):** Challenge the notion of "involvement." Humphrey *is* involved as the anchor of the counterpart relation. It's a relational property of actual Humphrey.
