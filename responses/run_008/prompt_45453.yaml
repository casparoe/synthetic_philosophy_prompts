  2.  **Deconstruct the Friend's Argument:**
      *   The core tension is between *truthmaking* (ontology) and *aboutness* (semantics/intentionality).
      *   Premise (1) is a strong truthmaking principle: "A claim about $x$ is made true by how things are with $x$."
      *   Premise (5) is the bridge: "If truthmakers don't involve $x$, the claim isn't about $x$."
      *   The conclusion (6) is that CT eliminates *de re* modality.

  3.  **Evaluate Premise (5) (The "Aboutness" Principle):**
      *   *Is it true?* This is the weakest link for a Lewisian. Lewis distinguishes between *what makes a sentence true* and *what the sentence says*.
      *   *Counterexample:* "The Morning Star is visible." Truthmaker: Venus. "The Evening Star is visible." Truthmaker: Venus. Are they about the same thing? Yes. But consider descriptions. "The winner of the election lost." Truthmaker involves the person who won.
      *   *Better Counterexample for CT:* Consider indexicals or relational properties. "I am here." Truthmaker involves me and my location. "My counterpart is there."
      *   *Lewis's Move:* Lewis accepts that the *truth conditions* involve counterparts, but maintains the *semantic content* is about the actual individual. The relation of "counterpart" links the actual individual to the possibilia. So the truthmaker *does* involve Humphrey, just not *directly* in the other world, but via the counterpart relation which holds in virtue of Humphrey's properties.
      *   *Wait, stronger Lewisian response:* Lewis rejects the inference from "Truth conditions mention $y$" to "Proposition is not about $x$." The proposition is a set of worlds. The *analysis* of the proposition uses counterparts. But the *subject* of the predication is fixed by the actual world referent.
      *   *Crucial Point:* Premise (5) conflates *constituents of the truthmaker* with *subject matter*. If I say "Humphrey is famous," the truthmaker might involve newspapers, people talking, etc. Humphrey is involved causally. In CT, "Humphrey might have won" is true because Humphrey has a property (having a winning counterpart). That property is intrinsic/relational to Humphrey. So the truthmaker *does* involve Humphrey (in the actual world) having a specific modal property.
      *   *Refinement:* The friend assumes truthmaking is "direct presence." Lewisian truthmaking for modal claims is about the actual individual's *modal profile* (understood as relations to other worlds).

  4.  **Evaluate Premise (1) (The Truthmaking Principle):**
      *   "A claim about a particular thing is made true by how things are with that thing."
