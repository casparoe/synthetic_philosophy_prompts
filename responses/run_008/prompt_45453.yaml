      *   **Why (5) looks innocent:** We intuitively think truth requires presence. But in modal realism, "presence" is world-relative. Humphrey is present* at $W$ via his counterpart.
      *   **Cost:** You have to accept that *de re* modality is reducible to *de dicto* modality plus a counterpart relation. Some argue this loses the "directness" of *de re* thought.
