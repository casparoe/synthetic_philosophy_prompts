      *   *Nuance on Truthmaking:* Lewis isn't a standard truthmaker theorist in the Armstrong sense. He's a realist about propositions (sets of worlds). The "truthmaker" is the existence of the world where the counterpart wins. But the *proposition* is about Humphrey because of how the proposition is generated (from the actual individual).
