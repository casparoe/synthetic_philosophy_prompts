      *   For Lewis, having a counterpart *is* how things are with Humphrey (in the actual world). It's a relation Humphrey bears to things in other worlds.
      *   If the friend insists "how things are with Humphrey" means "intrinsic properties of Humphrey in the actual world," then (1) begs the question against modal realism/externalism.
      *   If "how things are with Humphrey" includes his relations to counterparts, then (4) is false. The truthmaker *does* involve Humphrey (as the relatum).

  5.  **Evaluate the TWI (Kripkean) Position:**
