      *   *Requirement 6: Empirical Plausibility (Psychology).*
          *   *Case:* Must fit with how children develop theory of mind and how we attribute consciousness to animals.
          *   *Status:* Non-negotiable (must be consistent with science).

      *   *Requirement 7: Action-Guiding/Functional Role.* (New addition).
          *   *Case:* Why do these intuitions exist? What evolutionary or functional role do they play?
          *   *Status:* Desirable, but maybe not strictly necessary for a *conceptual* account. Let's make it a strong desideratum.

  4.  **Analyzing Tensions (The "Hard Bits"):**
      *   *Neutrality vs. Cognitive Mechanism:* If the meta-theory says "We have this intuition because of Cognitive Mechanism X," does Mechanism X imply the intuition is veridical or non-veridical?
