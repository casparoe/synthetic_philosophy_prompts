      *   *Resolution:* The meta-theory must describe the *structure* of the cognitive processing (e.g., information encapsulation, lack of inferential integration) without explicitly labeling the output "false" or "true" within the meta-framework, leaving that to the first-order theory. *However*, Frankish's illusionism *is* a meta-problem theory that *does* claim the output is false. So, strict neutrality might be impossible if the explanation of the mechanism entails an error theory. I need to flag this tension clearly.

