  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Phenomenological Fidelity (The "Force").*
          *   *Case:* If you explain the intuition as a mistake caused by confusion, but don't explain why the confusion is *inescapable*, you haven't solved the meta-problem, you've just insulted the intuitor.
          *   *Status:* Non-negotiable.
          *   *Refinement:* Call it "Inescapability and Phenomenological Force."

      *   *Requirement 2: Metaphysical Neutrality.*
          *   *Case:* The user wants a framework both they and the illusionist friend can accept. If the meta-theory assumes physicalism, the dualist rejects it. If it assumes dualism, the physicalist rejects it.
          *   *Status:* Highly desirable for dialectical progress, but arguably a "prejudice" if the truth is one-sided. However, for a *meta*-theory aimed at resolving the debate, it's functionally non-negotiable.
          *   *Tension:* This clashes with Illusionism (which says the intuition is false). Can a theory be neutral if it says the intuition is a cognitive bug? Yes, if it explains the bug without asserting the ontology is false *within the meta-theory itself* (though Frankish usually does). This needs careful handling.

