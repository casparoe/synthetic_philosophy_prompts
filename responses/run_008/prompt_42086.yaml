answer: |-
  It is entirely understandable that your Saturday evening proved frustrating. Arguing about the meta-problem whilst harbouring conflicting first-order commitments is rather like attempting to agree on the rules of cricket whilst one party insists the ball is actually a strawberry. You are quite right to step back and demand a specification of the target before firing.

  The meta-problem, as you note, is not to solve the hard problem, but to explain the *judgement* that there is a hard problem. To adjudicate between your position (which seeks a neutral framework) and your friend's (which seeks a dissolvent), we require a set of desiderata that distinguishes between methodological necessities and metaphysical smugglings.

  Below is a proposed specification of the desiderata for an adequate theory of the meta-problem.

  ### The Desiderata

  **1. Phenomenological Fidelity (The Force of Intuition)**
  *   **The Case:** A theory cannot merely explain why we *say* there is an explanatory gap; it must explain why the gap *feels* unbridgeable. If an account suggests the intuition is a result of superficial confusion or lack of data, it fails to capture the depth of the conviction. The intuition persists even when one grants all the physical facts. An adequate theory must explain why the cognitive system produces a signal of 'mystery' that is resistant to evidential update.
  *   **Status:** **Non-negotiable.** Without this, the theory explains away the data rather than explaining the data itself.
  *   **Potential Prejudice:** None. Both realists and illusionists agree the intuition feels robust.

  **2. Metaphysical Neutrality**
  *   **The Case:** As you argued, if the meta-theory presupposes physicalism (by assuming the intuition is a conceptual error) or dualism (by assuming the intuition tracks a distinct property), it cannot serve as common ground. It should describe the *generation* of the judgement without settling the *truth* of the judgement.
  *   **Status:** **Desirable, but potentially a disguised prejudice.** While dialectically useful, one might argue that a complete causal explanation of an intuition inevitably implies something about its veridicality. If the mechanism is identified as a 'bug', neutrality is compromised.
  *   **Potential Prejudice:** This is likely where your friend will dig in. An illusionist might claim that demanding neutrality is a tactic to protect realism from the natural conclusion of the meta-problem analysis.

  **3. Discriminatory Specificity (Why Consciousness?)**
  *   **The Case:** We no longer posit a 'vital force' for life or 'phlogiston' for heat. A meta-problem theory must explain why consciousness uniquely resists the assimilation that other phenomena underwent. It must identify the specific cognitive or representational feature of consciousness that prevents the 'gap-closing' moves that worked for lightning or digestion.
  *   **Status:** **Non-negotiable.** If the theory applies equally to heat or life, it is too broad; if it applies to nothing else, it must explain why.
  *   **Potential Prejudice:** None, provided one accepts that consciousness *is* treated differently.

  **4. Comprehensive Scope (The Family of Intuitions)**
  *   **The Case:** The meta-problem is not a single datum. It encompasses the Explanatory Gap, the conceivability of Philosophical Zombies, the Knowledge Argument (Mary), and the 'What-It-Is-Like' locution. A theory that explains Zombies but fails on Mary is incomplete. These intuitions are clustered; the theory should explain the cluster.
  *   **Status:** **Non-negotiable.**
  *   **Potential Prejudice:** None.

  **5. The Expertise Paradox**
  *   **The Case:** In most domains, increased technical knowledge dispels mystery. In consciousness, philosophical training often deepens the sense of paradox. An adequate theory must explain why exposure to the arguments reinforces the intuition rather than dissolving it.
  *   **Status:** **Non-negotiable.** This is a robust sociological fact about the field.
  *   **Potential Prejudice:** None.

  **6. Empirical Consistency (Developmental and Comparative)**
  *   **The Case:** The theory must cohere with what we know about Theory of Mind. Children attribute experience before they possess complex metaphysical concepts. Non-human animals likely possess consciousness without possessing the concept of consciousness. The meta-problem theory must account for the relationship between the *capacity for experience* and the *judgement about experience*.
  *   **Status:** **Non-negotiable.** It must be consistent with cognitive science.
  *   **Potential Prejudice:** None.

  ---

  ### The Critical Tension: Neutrality vs. Cognitive Predictability

  You asked specifically to flag pairs of requirements that may be incompatible. The most significant friction exists between **Metaphysical Neutrality** and **Phenomenological Fidelity** (specifically regarding the cognitive mechanism).

  Here lies the rub: To explain the *force* of the intuition (Desideratum 1), one usually needs to posit a specific cognitive architecture.
  *   If you posit that the architecture involves **information encapsulation** or **non-inferential reporting** (as illusionists like Frankish do), you strongly imply that the system is opaque to itself, which leans towards the intuition being an *illusion*.
  *   If you posit that the architecture involves **direct acquaintance** or **unique conceptual modes of presentation** (as Phenomenal Concept Strategists do), you imply the intuition tracks a genuine epistemic distinction, which leans towards *realism* (and potentially physicalism, but of a specific sort).

  **The Incompatibility:** It is arguably impossible to fully specify the *mechanism* that generates the intuition without implying whether that mechanism is truth-tracking or error-prone. A truly neutral theory might have to remain so abstract regarding the mechanism that it fails to explain the *force* of the intuition. Conversely, a theory that explains the *force* by detailing the cognitive machinery often inadvertently (or deliberately) takes a stance on whether that machinery is functioning correctly.

  Therefore, **Metaphysical Neutrality** may be a demand that cannot be jointly satisfied with a robust explanation of **Phenomenological Fidelity**. You may have to choose between a theory that is neutral but thin, or one that is explanatory but committed.

  ---

  ### Assessment of Contenders

  Here is how the two primary camps fare against these criteria, keeping the weight on the desiderata rather than declaring a winner.

  #### 1. Deflationary / Illusionist Account (e.g., Frankish)
  *   **Phenomenological Fidelity:** **Strong.** It takes the force of the intuition seriously by positing a robust 'user-illusion'. It explains why the gap feels unbridgeable: because the cognitive system represents experience as non-physical, even though it is not.
  *   **Metaphysical Neutrality:** **Fails.** This is the explicit point of the theory. It argues the meta-problem solution *dissolves* the hard problem by showing the intuition is false. It is not neutral; it is anti-realist.
  *   **Discriminatory Specificity:** **Strong.** It argues consciousness is unique because it is the only thing we represent via a specific, non-physicalising cognitive interface.
  *   **Expertise Paradox:** **Strong.** It explains that training makes one more aware of the representational quirks, deepening the confusion rather than resolving it.
  *   **Verdict:** It satisfies the explanatory demands but violates your requirement for neutrality. It asks you to accept that your friend is right: the meta-problem solution *is* the dissolution of the hard problem.

  #### 2. Phenomenal Concepts Strategy (PCS)
  *   **Phenomenological Fidelity:** **Strong.** It explains the force by arguing that we possess two distinct types of concepts (physical and phenomenal) for the same property. The 'gap' is a conceptual gap, not an ontological one, but it feels real because the concepts are cognitively independent.
  *   **Metaphysical Neutrality:** **Partial.** It is compatible with physicalism, but it concedes that the intuition arises from a genuine feature of our conceptual architecture, not merely an error. However, a dualist might reject it because it ultimately aims to save physicalism. It is more neutral than illusionism, but still carries a physicalist teleology.
  *   **Discriminatory Specificity:** **Moderate.** It struggles slightly to explain why *this* concept is so uniquely resistant compared to other theoretical concepts, though it appeals to the direct, recognitional nature of phenomenal concepts.
  *   **Expertise Paradox:** **Moderate.** It explains that training refines the concepts, making the distinction sharper, but it is less clear on why this leads to *puzzlement* rather than just clarity.
  *   **Verdict:** It comes closer to your neutrality requirement but risks appearing as a 'physicalism-saving device'. It explains the intuition as veridical (conceptually) but potentially misleading (ontologically).

  ### Conclusion

  Your dissatisfaction stems from a genuine methodological conflict. You are seeking a **prolegomenon** to the debate (a neutral framework), whilst your friend is proposing a **resolution** (illusionism).

  If you hold fast to **Metaphysical Neutrality** as non-negotiable, you may find that no existing meta-problem theory satisfies you, because the act of explaining the *cause* of the intuition tends to reveal its *status*. The most honest path forward may be to agree with your friend that the meta-problem theory *must* carry metaphysical commitments, but to disagree on *which* commitments are warranted. Alternatively, you might seek a 'structural' account (like Chalmers' own suggestion) that maps the logical space of the judgements without committing to the psychology, though this risks failing the **Phenomenological Fidelity** test.

  I suspect you will find that the requirement for Neutrality is the one that must be softened. A theory that explains why we judge as we do will almost invariably suggest whether we *ought* to judge as we do.
