  *   **The Principle:** The morality of deception depends on the implicit norms of the specific "speech genre." In some genres (polite compliments, hyperbolic praise), truth is secondary to social cohesion. In others (academic info, life-or-death stakes), truth is primary.
  *   **Fit with Track Record:** Explains why "I love it" (Granny) is wrong but "Never seen anything like it" (Granny) is fine (Fashion Genre = Politeness). Explains why "Best meal ever" (Dinner) is fine (Hyperbole Genre). Explains why the Murderer cases are fine (Aggressor Genre = No norms owed).
  *   **Application to Date Case:** Dating is a hybrid genre. Early dating often involves "face-saving" norms where soft rejections ("Work is busy") are standard polite protocol. If Ruth follows this rule, she might deem it **Fine**, viewing it as a socially acceptable "soft no" that preserves the date's dignity.

  **Rule 2: The Informational Entitlement Account (Right to Know)**
  *   **The Principle:** The morality of deception depends on whether the listener is *entitled* to the information to exercise autonomy or make decisions. If they have a claim to the truth, misleading them is as bad as lying. If they have no claim, misleading is permissible.
  *   **Fit with Track Record:** Explains why the Student case is Wrong (Student is entitled to reading group info). Explains why the Murderer cases are Fine (Murderer has no right to the victim's location). Explains why Granny is Wrong (Granny has no right to your aesthetic honesty, but you violated the norm of sincerity anyway—wait, this rule struggles slightly with Case 3 vs 4 unless we add "No right to *honest* critique").
  *   **Refined Rule 2:** Deception is wrong if it undermines a significant interest or right of the listener *and* occurs in a context where accuracy is expected.
  *   **Application to Date Case:** The question "Are you seeing anyone else?" is a direct query about material facts affecting sexual/romantic consent and emotional investment. The date has a strong interest/entitlement here. If Ruth follows this rule, it is **Wrong**.

  ### Where They Part Ways
