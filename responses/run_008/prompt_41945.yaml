  ### The Next Case: The "Five-Minute" Text
  To force her to choose between **Genre (Rule 1)** and **Entitlement/Truth (Rule 2)**, you need a case where the Social Norm *expects* the falsehood, but the Listener *knows* it is false and translates it, yet the Truth-Teller still asserts the falsehood.

  **The Case:**
  You are running 20 minutes late to meet a friend for coffee. You text them: *"I'm 5 minutes away."*
  *   **The Truth:** You are not 5 minutes away.
  *   **The Listener:** Your friend knows you are chronically late. They know "5 minutes" from you actually means "15 to 20 minutes." They read the text, understand the *real* time, and order their coffee accordingly. They know full well the literal statement is false.
  *   **The Intent:** You sent it to keep them from leaving or worrying, relying on their ability to "translate" your falsehood.

  **Why this forces the choice:**
  *   **If Ruth follows Rule 1 (Genre/Convention):** She must say **Fine**. This is a standard conversational convention (like "Best meal ever"). The "genre" of friend-texting includes this translation layer. No harm is done; communication succeeded.
  *   **If Ruth follows Rule 2 (Truth/Entitlement):** She must say **Wrong**. You asserted a falsehood. Even if they decoded it, you polluted the information space. If she was strict in the Student case about "shreds of difference," she should be strict here about asserting falsehoods even when "understood."

  **The Trap:**
  If she says **Fine**, she admits that *successful communication* trumps *literal truth* (undermining her strictness in the Student case).
  If she says **Wrong**, she admits that *literal truth* matters even when *no one is deceived* (which seems to contradict her annoyance in Case 2 about moral credit for literal truth).

