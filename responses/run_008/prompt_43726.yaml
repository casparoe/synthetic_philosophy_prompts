answer: |-
  **JOINT STATEMENT ON THE EPISTEMOLOGY OF PEER DISAGREEMENT**
  **Authors:** Dr. Aris Thorne (University of Northern Coast) & Prof. Julian Vane (Institute for Formal Inquiry)
  **Date:** October 14, 2023
  **Context:** Prepared for the *Metaphilosophy & Epistemic Norms* Reading Group

  ### Preamble
  For ten years, we have debated the normative significance of peer disagreement. Our dispute originated in the 2013 "Seminar Incident," regarding a complex conditional probability problem. We acknowledge for the record that Prof. Vane's solution to the problem was mathematically correct, and Dr. Thorne's contained a subtle error in the denominator. However, we maintain that the *epistemic lessons* drawn from that incident remain the subject of legitimate philosophical controversy. This document represents the results of a week-long adversarial collaboration intended to isolate our points of agreement, clarify our residual disagreements, and identify the empirical or conceptual cruxes that sustain them.

  ***

  ### Part I: Agreed Claims (Common Ground)
  *Both authors endorse the following propositions. Neither party is committed to the caricature versions of their respective views often found in introductory literature.*

  1.  **Rejection of Extremes:** Neither party endorses "Unqualified Conciliationism" (always splitting the difference 50/50 regardless of context) nor "Dogmatic Steadfastness" (never revising credence in the face of any disagreement). Both agree that there are *some* cases where revision is required and *some* cases where holding firm is permissible.
  2.  **Definition of Epistemic Peerhood:** A "peer" is not merely someone with similar general intelligence or education. A peer is someone whom, *prior to the disagreement*, you judge to be equally likely to have assessed the evidence correctly regarding the specific proposition at hand. We agree that learning the content of a peer's reasoning can defeat peer status retroactively.
  3.  **Domain Sensitivity:** The normative force of disagreement varies by domain. Disagreement in arithmetic or logic (where reasoning is deductive and verification is possible in principle) carries different weight than disagreement in politics, aesthetics, or complex empirical forecasting (where reasoning is abductive and verification is opaque).
  4.  **Higher-Order Evidence:** We agree that the *fact* of disagreement constitutes a form of higher-order evidence. It is evidence about the reliability of our own cognitive performance in that instance. We disagree only on the *magnitude* and *direction* of the update this evidence mandates.
  5.  **The "Right Reasons" Constraint:** We agree that if an agent *knows* (with certainty) that they have processed the first-order evidence correctly and found no error, they are not rationally required to revise. The dispute concerns cases where the agent is *not* certain they are right, but merely confident.
  6.  **Avoidance of Ad Hominem:** We agree that characterizing Conciliationism as "epistemic self-flagellation" or Steadfastness as "arrogance" is unproductive and inaccurate. Both views aim to maximize truth-conduciveness; they differ on the mechanism for doing so.

  ***

  ### Part II: Table of Residual Disagreements
  *Where we disagree, we have drafted the following descriptions to ensure each side recognizes their own position without feeling strawmanned.*

  | Issue | Thorne's Position (Conciliationist) | Vane's Position (Steadfast / Total Evidence) |
  | :--- | :--- | :--- |
  | **The Default Norm** | In cases of opaque error (where you cannot locate the specific mistake), the fact of peer dissent is *prima facie* evidence that you are mistaken. The rational requirement is to significantly lower credence in your original view, often toward the midpoint. | In cases of opaque error, the fact of peer dissent is evidence that *at least one of you* is mistaken. If your first-order evidence strongly supports $P$, you are permitted to attribute the error to the peer and maintain high credence in $P$. |
  | **The Source of Normativity** | The disagreement itself generates new evidence about the object-level question. If a reliable instrument disagrees with your reading, the world is likely not as you read it. | The disagreement generates evidence about the *process*, not the *world*. Unless the disagreement alters the first-order evidence (the math, the data), the original support for $P$ remains intact. |
  | **Peerhood & Truth** | Peerhood is assessed ex-ante. Even if I turn out to be wrong (as in the Seminar Incident), I was still a peer at the moment of disagreement, and you should have hedged *then*. | Peerhood is partially factive. If I can demonstrate (even to myself) that my reasoning was flawless, the other person was not a true peer in that instance, defeating the requirement to conciliate. |
  | **Scope of Revision** | Revision should be symmetric. If I lower my credence in $P$, I must raise my credence in $\neg P$ (or your view) proportionally. | Revision need not be symmetric. I can lower my confidence in my *infallibility* without lowering confidence in $P$ itself. |

  ***

  ### Part III: Cruxes and Predictive Cases
  *We identify three specific areas where our theories diverge in their output. For each, we propose a concrete case and state what our respective theories predict a rational agent should do. We invite the reading group to test these predictions.*

  #### Crux 1: The Nature of the Evidence (Object-Level vs. Meta-Level)
  **The Question:** Does the peer's dissent count as evidence about the truth of $P$ (Object-Level), or only evidence about the reliability of my belief-forming process (Meta-Level)?

  **The Test Case: The Restaurant Bill**
  Two friends calculate the tip. You are confident the total is \$104. Your friend, equally good at math, is confident it is \$114. You re-check your mental math and feel sure, but cannot write it down to verify.
  *   **Thorne's Prediction:** A rational agent must reduce credence that the bill is \$104 to near 0.5. The dissent is direct evidence that the sum is likely not \$104.
  *   **Vane's Prediction:** A rational agent may maintain high credence that the bill is \$104, provided their first-order mental calculation felt robust. The dissent is evidence that the *friend* likely made a common arithmetic error (e.g., carrying the one), not that the sum is ambiguous.
  *   **Resolution Condition:** If it turns out that in 90% of such cases, the person who sticks to their guns is right, Vane's view is vindicated. If in 90% of such cases, the pair was wrong and the average was closer to the truth, Thorne's view is vindicated.

  #### Crux 2: The Self-Undermining Problem
  **The Question:** Conciliationism disagrees with Steadfastness. If Conciliationism is true, must the Conciliationist lower their credence in Conciliationism because a peer (the Steadfast theorist) disagrees?

  **The Test Case: This Collaboration**
  Dr. Thorne believes Conciliationism is true. Prof. Vane believes it is false. They recognize each other as peers in philosophy.
  *   **Thorne's Prediction:** I am rationally required to lower my credence in Conciliationism significantly. If I do not, I am violating my own theory. A consistent Conciliationist should be agnostic about Conciliationism.
  *   **Vane's Prediction:** Thorne is not required to lower her credence if she has first-order arguments for Conciliationism that she judges superior to Vane's counter-arguments. The "disagreement about disagreement" is just another disagreement about first-order reasons.
  *   **Resolution Condition:** We agree to monitor whether Thorne's credence in Conciliationism drops below 0.6 over the next year. If it remains high, either she is irrational (by her own lights) or the self-undermining objection fails.

  #### Crux 3: Is the Dispute Verbal? (The "Ought" implies "Can")
  **The Question:** Does "Rationally Permitted" vs. "Rationally Required" exhaust the disagreement?

  **The Test Case: The Expert Forecasters**
  Two equally reliable weather models predict rain. Model A says 90% chance. Model B says 10% chance. You know one model has a sensor error, but you don't know which.
  *   **Thorne's Prediction:** You *must* credence 50%. To do otherwise is to claim access to evidence (which model is broken) that you explicitly lack.
  *   **Vane's Prediction:** You are *permitted* to pick one model if you have a tie-breaking reason (e.g., Model A has been slightly more reliable historically), but you are not *required* to split 50/50 if your first-order assessment of the models favors one.
  *   **Dissolution Note:** We acknowledge that if Thorne defines "Rational" as "Maximizes long-term accuracy" and Vane defines "Rational" as "Properly responsive to available first-order reasons," we may be talking past each other.
      *   *Agreement:* We stipulate that for the purpose of this reading group, "Rational" refers to **proper responsiveness to total available evidence (first and second order)**. Under this definition, the dispute is substantive, not verbal.

  ***

  ### Signatures

  **Dr. Aris Thorne**
  *Date: 10/14/23*
  *"I sign this acknowledging that while I may have been wrong about the denominator in 2013, the principle of epistemic humility remains correct."*

  **Prof. Julian Vane**
  *Date: 10/14/23*
  *"I sign this acknowledging that while I was right about the denominator in 2013, Dr. Thorne's caution highlights a genuine risk of overconfidence in future cases."*
