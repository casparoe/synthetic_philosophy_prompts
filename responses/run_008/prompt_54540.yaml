answer: |-
  Dear Student,

  I am writing this to you directly because the stakes of your prospectus defense are high, and you need clarity not just on what you believe, but on where your position is vulnerable. You have constructed a delicate architecture by removing the concreteness clause from Lewisian modal realism, and while the philosophical motivation is sound, the committee will attack the load-bearing walls you think you have removed. I have ordered the objections you will face not by who is most likely to ask them, but by how much damage they can do to the survival of your project. The most dangerous challenge comes from your primary advisor, and it strikes at the very mechanism of your proposed reduction. She will argue that concreteness was never merely decorative in Lewis's system but was the load-bearing wall that prevented circularity. Her objection will be that without the concreteness clause, the entities you posit as worlds cannot be individuated without appealing to modal or intentional properties, which means your analysis of modality presupposes the very modal facts it was meant to analyze. She will say that concrete worlds are self-individuating by their spatiotemporal isolation, but abstract or agnostic worlds require a description to pick them out, and those descriptions are modal. Your reply must be that individuation is achieved through the structural relations within the totality of worlds, not by their ontological category. You will argue that spatiotemporal isolation is a structural feature that does not require concreteness to function as an individuating principle, and that the reduction works because the counterpart relation is defined over this structure, not over the stuff the worlds are made of. The soft spot in this reply is that your advisor is likely correct that structural isolation alone may not suffice without a primitive notion of possibility to define the structure in the first place. If you cannot explain how the worlds are isolated without saying they possibly could not have interacted, you have smuggled modality back in. This is where the nightmare question lives, and you must be ready for it.

  The question you hope nobody asks, the one that keeps you up at night, is whether your thesis is anything more than a terminological thesis dressed up as a substantive one. Your advisor will ask this if she senses your reply on circularity is wavering. She will ask if removing concreteness simply changes the label on ersatzism without changing the commitments. You must not hedge here. You will say that the thesis is substantive because it claims that the debate between concretists and ersatzers is a pseudo-problem generated by a false dichotomy, and that demonstrating this equivalence is a genuine metaphysical discovery about the structure of modal space, not a verbal trick. You will argue that Lewis himself sought unification, and showing that the concreteness clause was the only barrier to unifying realism and ersatzism is a substantive result about the redundancy of ontological commitments in modal theory. If you say it is merely verbal, you admit the project is trivial. If you say it is substantive, you must defend the claim that dissolving the dichotomy explains something nominalism does not. The soft spot is that many philosophers will view dissolving a dichotomy as a linguistic maneuver rather than a discovery about the world. You must hold the line that recognizing ontological equivalence is a substantive insight into the nature of theoretical virtue, but be aware that this is the thinnest ice you will walk on.

  The second most damaging objection comes from the Quinean naturalist on your committee, who will argue that your agnosticism about concreteness is an evasion rather than a discovery. He will ask what your theory predicts or explains that a sober nominalism could not, and whether refusing to say what worlds are is a legitimate theoretical stance or a way to avoid the cost of ontological commitment. He will press you on parsimony, noting that you have the ontological cost of worlds without the honesty of concreteness, making your view ideologically and ontologically expensive compared to nominalism. Your reply should be that your theory offers ideological parsimony by eliminating primitive modal operators, which is a significant explanatory gain over nominalism, and that ontological agnosticism is a virtue when the ontology does no explanatory work. You should concede ground here on the claim that your view is ontologically cheaper than Lewis's; admit that you still posit worlds, but insist that the cost is justified by the unification of modal discourse. The soft spot is that the Quinean will not care about unifying modal realists and ersatzers if both are equally profligate compared to nominalism. You must be prepared to argue that the elimination of primitive modality is a greater virtue than ontological minimalism, but know that this is a value judgment he may not share.

  The third objection, which poses a technical threat to the coherence of your system, will come from the formal epistemologist. She will ask how probability talk over an infinite totality of worlds gets off the ground without concreteness, and whether your refusal of the concreteness clause makes the measure problem worse. She will argue that concrete worlds at least have a candidate principle of individuation via spatiotemporal location, whereas merely world-like ones may leave the totality improperly large, perhaps even a proper class, which breaks probability theory. Your reply is that the measure problem is unsolved for concrete worlds anyway, so your view is not worse off, and that indexing worlds via structural properties allows for a set-theoretic treatment regardless of concreteness. The soft spot is that without concreteness, the principle of individuation is indeed weaker, and if the totality becomes a proper class, you cannot define a measure over it. You should concede that the proper class issue is a remaining technical challenge but argue that it is not unique to your view and does not invalidate the prospectus. This is a problem for the dissertation, not necessarily the prospectus, so you can bracket it provided you acknowledge it.

  The least damaging objection, though it will feel profound, comes from the Kantian reader. She will ask whether modality as you construe it is mind-independent or a projection of our inferential practices, and she will ask it in a way that exposes that your project silently presupposes an answer. She will argue that by treating worlds as individuals, you are reifying a structure of thought. Your reply is that your theory is compatible with either interpretation, as it describes the logical structure required for modal discourse to function, regardless of whether that structure is mind-independent. The soft spot is that your theory does presuppose a realist semantics, and if she challenges the legitimacy of that semantics, your project loses its footing. However, this is a meta-philosophical challenge that you can defer by stating your project operates within the analytic tradition's realist framework.

  To survive this defense, you must take a definite strategic position. You must hold at all costs the claim that concreteness does no explanatory work in Lewis's system. If you concede that concreteness is necessary for the reduction of modality, your thesis collapses into the view that you have simply broken Lewis's theory without fixing it. You should concede ground to the Quinean on the issue of ontological parsimony; admit that your view is not ontologically cheaper than Lewis's, but argue that it is ideologically superior and avoids the incredulous stare. The single reply that has to land for the prospectus to survive is your response to your advisor on the circularity objection. You must convince her that the structural relations of isolation and counterparting can be defined without presupposing modality. If you fail to convince her that the reduction works without concreteness, the rest of the project is moot. Prepare for that exchange above all others, because if the reduction fails, the equivalence with ersatzism becomes a liability rather than a virtue. I will see you next month.
