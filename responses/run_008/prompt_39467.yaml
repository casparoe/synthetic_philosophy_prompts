prompt: |-
  Been reading LessWrong-adjacent stuff since like 2012 and I finally hit an argument I can't untangle. A guy in my rationality meetup swears he's fine playing Russian roulette for a million bucks because of quantum immortality, and his argument actually looks tight to me, which definately scares me. Here it is:

  (1) Grant many-worlds: every outcome with nonzero amplitude happens on some branch.
  (2) Personal identity is pattern-continuity, not a soul, so all my future copies on all the branches are equally me — there's no further fact about which one is teh "real" one.
  (3) I can only ever observe branches on which I exist and am conscious.
  (4) So whatever I do, I will always find myself on a branch where I survived — the branches where I die contain no version of me to notice anything.
  (5) Dying of old age, cancer, a bullet, whatever, isn't fundamentally different: there's some branch, with insanely small but nonzero amplitude, where the atoms happen to do the exact thing needed for me to keep going.
  (6) So I should never expect to die, and should expect to keep getting improbably lucky forever — spontaneous remissions, bizarre misses, the works.
  (7) Corollary: death-risk doesn't really matter to me, so refusing the roulette offer is leaving free money on the table.

  I can't accept (7). But the part that really bugs me is this: run the same logic on lotteries and it seems to prove I should expect to win every lottery I ever enter, and to keep winning, forever, becoming the luckiest being in the history of the universe. That feels like a reductio of the whole chain, but I can't point to which step it comes out of. And if the lottery thing is the absurd one, why is survival any different — dying is just one more low-amplitude outcome, same as losing a lottery.

  For the record, I'd rather keep (1) and (2), since I actually believe both. Tell me which step to reject, why that step looked fine, and what rejecting it costs. Hard limit: 400 words. I want the diagnosis, not a lecture on interpretations of QM.
