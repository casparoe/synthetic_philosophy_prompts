answer: |-
  You are scientifically correct, and your frustration is well-founded. You have correctly identified one of the most persistent and consequential errors in public discourse regarding genetics.

  To answer your primary question directly: **There is no single, universally standardized Latin name for this specific error** (like *ad hominem* or *post hoc*). However, in behavioral genetics, philosophy of science, and psychology, it is most precisely referred to as **The Heritability-Immutability Fallacy** (or sometimes **The Heritability-Malleability Fallacy**).

  Colloquially, it is often lumped under **Genetic Determinism**, but as you noted, that term is too broad. Genetic determinism is the ontological claim that genes *cause* the trait inevitably. The fallacy you are describing is a statistical category error: confusing a ratio of variances within a population with the potential for changing the population mean.

  Here is the breakdown of the phenomenon, its boundaries, its "mirror twin," and how to handle the coffee meeting with Dana.

  ### 1. The Name and The Mechanism

  **The Best Label:** **The Heritability-Immutability Fallacy.**
  **The Broader Bucket:** **Genetic Determinism.**
  **The Logical Category:** **Category Mistake** (treating a statistic about variance as a property of the trait itself).

  **Why it happens:**
  Heritability ($h^2$) is a population statistic defined as $V_G / V_P$ (Genetic Variance divided by Phenotypic Variance). It answers the question: *"In this specific population, living in this specific range of environments, how much of the difference between Person A and Person B is due to genetic differences?"*

  It does **not** answer: *"How much of Person A's trait is caused by genes?"* (That is nonsensical; 100% of the trait requires both genes and environment to develop).
  It does **not** answer: *"What happens if we change the environment?"*

  **The PKU Example (Your Killer App):**
  Phenylketonuria (PKU) is a cause of intellectual disability. In a population where diet varies naturally, the heritability of PKU-related cognitive deficits is near 1.0 (100%). It is entirely "genetic." However, if you change the environment (remove phenylalanine from the diet), the trait (disability) disappears. High heritability did not mean high fixity.

  **The Dutch Height Example:**
  Height is highly heritable (~0.8). Yet, the average Dutch height increased by 20cm in 150 years. The genes didn't change; the environment (nutrition/health) did. Heritability describes the *current* variation, not the *potential* shift in the mean.

  ### 2. Nailing Down the Edges (Your Specific Questions)

  You asked where the fallacy stops and starts. Here are the boundary conditions.

  **Q: Does it only count if they make the leap explicitly from a number?**
  **A: No.** The fallacy is committed whenever the *implication* of fixity is drawn from genetic causation, regardless of whether a number is cited.
  *   **Explicit:** "IQ is 80% heritable, therefore preschool won't work." (Fallacy)
  *   **Implicit:** "Aggression is in the genes, so we can't train people to be peaceful." (Fallacy)
  *   **The Shorthand:** Phrases like "It's hardwired" or "It's biological" are often used as code for "It is immutable." When used to shut down policy discussion, this is the fallacy in action.

  **Q: Is it still the fallacy if the trait really *is* hard to change?**
  **A: Yes.** This is crucial. If someone argues, "Adult eye color is highly heritable, therefore we cannot change adult eye color with diet," their conclusion is true, but their **reasoning is fallacious.**
  *   Eye color is hard to change because of the *biology of melanin*, not because of the *heritability statistic*.
  *   If they had used the same logic on PKU, they would have been wrong.
  *   In logic, an argument with a true conclusion but invalid reasoning is still unsound. Dana's argument is unsound even if IQ turns out to be hard to shift (which is debatable), because she is using the wrong justification.

  **Q: Is the population-level version the same fallacy?**
  **A: No, that is a sibling error.**
  Using within-group heritability to explain between-group differences (e.g., "IQ is heritable within the US, so the difference between the US and Japan must be genetic") is a distinct logical error called the **Ecological Fallacy** (specifically, the **Within-Between Heritability Error**).
  *   **The Connection:** Both errors stem from misunderstanding what heritability measures.
  *   **The Distinction:** The Heritability-Immutability Fallacy is about *intervention* (can we change it?). The Within-Between Error is about *attribution* (what caused this gap?).
  *   **The Logic:** You can have 100% heritability within Group A and 100% heritability within Group B, and yet the difference between Group A and Group B can be 100% environmental. (Example: Plant seeds from a high-yield strain in poor soil, and low-yield strain in rich soil. Within each pot, variation is genetic. Between the pots, variation is environmental).

  ### 3. The Mirror Twin: The Environmentalist Fallacy

  You mentioned you fell into the trap of thinking, "It changed, so it must not be genetic." This is the **Environmentalist Fallacy** (or **Malleability-Non-Heritability Fallacy**).

  *   **The Error:** Assuming that because a trait responds to environmental intervention, genetic variance must be low.
  *   **Why it's wrong:** As the Dutch height example shows, a trait can be highly heritable *and* highly malleable. The two sliders are independent.
  *   **Why it matters:** This is often used by people trying to *defend* policy. They think they must downplay genetics to justify social programs. They don't. You can argue for preschool programs *even if* IQ is 80% heritable, because heritability says nothing about the efficacy of a specific environmental shift.

  ### 4. Strategy for the Coffee Meeting

  Do not go in trying to "win" the argument by exhausting Dana. Three hours of arguing suggests she is entrenched. Go in to **reframe the question.**

  **Step 1: Validate the Statistic.**
  Start by agreeing with the premise. "Dana, I looked it up, and you're right. IQ heritability estimates are high, often 50-80% in adults. I concede that point."
  *   *Why:* This disarms the defense mechanism. She expects you to fight the number.

  **Step 2: Isolate the Inference.**
  "The disagreement isn't about the number. It's about what the number *means*. I think we are confusing **variation** with **modification**."

  **Step 3: Deploy the PKU Punch.**
  "Here is the test case: PKU is a genetic condition that causes intellectual disability. It is 100% heritable. If your logic holds—that high heritability means intervention is useless—then we should not treat PKU with diet. But we do, and it works perfectly. Therefore, heritability cannot tell us whether an intervention will work."

  **Step 4: Deploy the Dutch Height.**
  "Height is 80% heritable. The Dutch got 20cm taller in a few generations. Genes don't move that fast. Food did. If high heritability meant 'fixed,' the Dutch should still be short."

  **Step 5: The Policy Pivot.**
  "The question isn't 'Is it genetic?' The question is 'Is there an environmental lever that moves the needle?' Heritability tells us about the past variance, not the future potential. We can fund preschool *because* it changes the environment, regardless of how much genes explain the current differences."

  ### Summary for your notes:

  *   **Name:** The Heritability-Immutability Fallacy.
  *   **Definition:** Inferring that a trait is unchangeable (immutable) based on the statistic that it is heritable (variance explained by genes).
  *   **Logical Type:** Category Mistake / Non Sequitur.
  *   **Sibling Error:** The Within-Between Fallacy (Ecological Fallacy).
  *   **Mirror Error:** The Environmentalist Fallacy (Malleable = Not Genetic).
  *   **Key Counter-Examples:** PKU (100% genetic, 100% treatable), Dutch Height (High $h^2$, massive environmental shift).

  You are armed. The science is on your side. Good luck with Dana.
