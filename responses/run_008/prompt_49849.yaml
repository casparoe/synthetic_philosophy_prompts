answer: |-
  ### The practice, described
  In contemporary machine learning research, epistemic acceptance of a new model architecture typically relies on a conjunctive criterion: a marginal improvement on a standardized benchmark (the empirical evidence) paired with a plausible mechanistic narrative explaining the gain (the theoretical component). Reviewers and the community treat this pairing as sufficient for publication and citation, even when the performance gap is within the range of statistical noise and the mechanism is not independently verified. The narrative serves to contextualize the numbers, transforming a raw performance delta into a transferable design principle, thereby licensing further research built upon the proposed mechanism.

  ### What it strictly presupposes
  Strictly speaking, this practice presupposes a form of **Inference to the Best Explanation (IBE)** operating under constrained resources. It assumes that the mechanistic story is not merely decorative but adds confirmatory weight to the empirical result that the numbers alone cannot provide. If the narrative were truly epistemically inert, the community would not require it to justify the architecture's novelty; thus, the practice presupposes that theoretical virtues (coherence with prior work, simplicity, explanatory scope) are reliable heuristics for distinguishing signal from noise when empirical evidence is weak. It also presupposes that the benchmark is a **valid proxy** for the underlying capacity claimed; if the benchmark were decoupled from the mechanism's purported function, the correlation between the score and the story would be purely accidental, undermining the logic of accumulation.

  Furthermore, the practice presupposes a **methodological realism** regarding the research programme, if not ontological realism regarding the specific weights. It assumes that treating the proposed mechanism as "true enough" is necessary for generating fecund follow-up work. This aligns with a Lakatosian view of scientific research programmes: the "positive heuristic" (the story about attention or regularization) protects the core from immediate falsification by noisy data, allowing the community to develop the idea until it either yields novel predictions or degenerates. The system strictly requires that the community trusts the *process* of narrative selection enough to invest compute and time in the new architecture, assuming that the social filtering of stories will eventually converge on robust design principles even if individual papers are underdetermined.

  ### What it doesn't need
  The practice does not strictly require **scientific realism** in the strong sense that the mechanistic story corresponds to the actual causal structure of the model or the data. It is fully compatible with **instrumentalism**, provided the instrument (the architecture) reliably produces the desired output and the story serves as a useful mnemonic or engineering guide rather than a truth-claim. It also does not require that underdetermination be resolved at the time of publication; the practice is compatible with a **social epistemology** view where truth is a long-term convergence property of the community rather than an immediate property of individual papers. Consequently, the practice can coexist with the view that the initial stories are "just-so" tales, as long as the competitive landscape eventually weeds out the non-functional variants through replication and ablation, making the initial acceptance merely a provisional betting slip rather than a knowledge claim.

  ### If we took underdetermination seriously
  If the field were to treat underdetermination as a critical epistemic bottleneck rather than a background nuisance, the practice would shift from benchmark-centric validation to **mechanistic interpretability** and **synthetic validation**. Researchers would be required to provide direct evidence for the mechanism itself (e.g., probing internal representations, causal interventions on the model) rather than indirect evidence via downstream performance. We would see a de-emphasis on SOTA chasing on static benchmarks in favor of tasks designed to specifically falsify rival mechanistic hypotheses (crucial experiments). The burden of proof would invert: instead of assuming the story is valid because the score went up, the score would only be considered evidence if the mechanism was independently verified, effectively decoupling performance claims from explanatory claims until both are secured.

  ### Settled vs. contested
  In the philosophy of science literature, it is **settled** that underdetermination is a logical possibility and that ML practice fits the pattern of theory choice under weak empirical constraints. It is also **settled** that theoretical virtues (simplicity, fecundity) play a role in theory choice. However, it is **actively contested** whether these virtues are truth-conducive (as realists argue via the "No Miracles" argument) or merely pragmatic tools for organizing experience (as empiricists argue). When you present this in seminar, avoid claiming that virtues *do* track truth; instead, frame it as an open empirical question whether the ML community's reliance on these virtues actually converges on robust mechanisms or merely optimizes for citation-worthy narratives. The consensus is that the practice *uses* these virtues; the debate is whether that usage is justified epistemically or only sociologically.
