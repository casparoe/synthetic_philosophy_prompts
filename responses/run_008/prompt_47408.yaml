      *   *Testifier:* It's not just Curveball. It's the *system*. But philosophically, the "speaker" is the intelligence community presenting to Powell/Public. Let's distinguish the *original source* (defector) from the *transmitting agent* (intelligence analyst/briefer).
      *   *Hearer:* Powell (at the UN), the UN Security Council, the American Public, and ultimately the policymakers (Bush/Cheney). Let's focus on Powell as the paradigmatic "hearer" making a public assertion based on testimony.
      *   *Chains:* This is crucial. It's not A->B. It's A->B->C->D->E. Each link adds noise.
