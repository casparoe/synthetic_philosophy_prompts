      *   *Refinement on Anti-Reductionism:* Be careful not to say Anti-Reductionism *caused* the war. It's a framework for evaluating the belief. The framework suggests they were *entitled* to believe until doubts arose, but the doubts *did* arise and were ignored.
      *   *Institutional Point:* Emphasize that "Testimony" in philosophy usually means "John told Mary." Here it means "A vast bureaucracy synthesized fragmented data into a consensus document." This breaks the standard model.

