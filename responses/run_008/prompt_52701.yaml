  5.  **Evaluating Dennett vs. Caruso (Briefly):**
      *   *Dennett:* Compatibilist. Saves desert by redefining "could have done otherwise" as "responsive to reasons." Good on #6 and #5 (keeps proportionality). Struggles with #1 (hard science view) and #3 (manipulation cases are tricky for compatibilists).
      *   *Caruso:* Skeptic/Public Health. Embraces #1 fully. Solves #3 (no ultimate responsibility). Struggles with #5 (preventive detention risk is real, he tries to answer it with "least restrictive means" but it's shaky) and #6 (hard to justify everyday anger/blame without desert).

  6.  **Addressing the "Intelligibility" Question:**
