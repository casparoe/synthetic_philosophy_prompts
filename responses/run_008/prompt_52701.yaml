      *   *Critique of User's List:* Some points might be in tension. Specifically, #1 (determinism/science) vs. #4 (Moral Luck/Responsibility for outcomes). Also #5 (Public Health model) vs. #6 (Everyday blame).
      *   *Non-negotiables vs. Camp Preferences:* Scientific compatibility (#1) feels non-negotiable for *this* user, but hard determinists might say "then no desert." Proportionality (#5) is a constraint on *any* system, not just desert.
