answer: |-
  # The Allocation Protocol: A Seminar Game on Distributive Justice

  **Objective:** To force students to inhabit the contradictions of "equality of what" by making them choose redistribution principles without knowing their own or others' conversion factors (disabilities, tastes, adaptive preferences).

  **Class Size:** 18 Students
  **Time:** 80 Minutes
  **Facilitator:** 1 (You)
  **Materials:**
  *   18 Envelopes (labeled 1–18).
  *   18 "Citizen Sheets" (for tracking credits/goods).
  *   18 "Secret Condition Cards" (see below).
  *   Play Money (100 Credits total per student to start).
  *   "Goods Menu" projected on screen.
  *   Chocolate squares (or participation tokens) for the final payout.
  *   Whiteboard for vote tallying.

  ---

  ## Part 1: The Secret Condition Cards
  *Print these, cut them out, and shuffle them into the envelopes. There are 4 types.*

  1.  **The Standard (6 copies):**
      *   **Prices:** Mobility (10cr), Health (10cr), Leisure (10cr).
      *   **Satisfaction Formula:** 1 Good Purchased = 10 Satisfaction Points.
  2.  **The Impaired (4 copies):**
      *   **Prices:** Mobility (50cr), Health (30cr), Leisure (10cr).
      *   **Satisfaction Formula:** 1 Good Purchased = 10 Satisfaction Points.
      *   *Note:* You need 5x the resources for basic Mobility.
  3.  **The Connoisseur (4 copies):**
      *   **Prices:** Mobility (10cr), Health (10cr), Leisure (50cr).
      *   **Satisfaction Formula:** 1 Good Purchased = 2 Satisfaction Points.
      *   *Note:* You require expensive Leisure to feel any joy.
  4.  **The Adaptor (4 copies):**
      *   **Prices:** Mobility (10cr), Health (10cr), Leisure (10cr).
      *   **Satisfaction Formula:** If you spend < 20 Credits total, your Satisfaction is 50 Points. If you spend > 20 Credits, your Satisfaction is 10 Points.
      *   *Note:* You have learned to be happy with nothing. Abundance stresses you out.

  ---

  ## Part 2: Minute-by-Minute Run of Play

  ### 0:00 – 0:05 | Setup & Silence
  *   **Action:** Hand out envelopes. Tell students: *"Do not open until I say. Do not show your card to anyone. This is a simulation of a society. You are citizens. Your goal is to maximize your 'Satisfaction Points' by purchasing 'Goods' with your 'Credits'."*
  *   **Rule:** No talking during shopping phases. Cheating (trading cards/credits) results in disqualification from the final chocolate payout.
  *   **Endowment:** Everyone receives **100 Credits**.

  ### 0:05 – 0:20 | Round 1: The Market (Equality of Resources)
  *   **Action:** Project the **Goods Menu** (Mobility, Health, Leisure). Students privately decide what to buy based on their Secret Card's prices.
  *   **Task:** On their Citizen Sheet, they record:
      1.  Credits Spent.
      2.  Goods Acquired.
      3.  **Final Satisfaction Score** (Calculated via their card's formula).
  *   **Facilitator:** Walk around. If a student with the *Impaired* card realizes they can't afford Mobility, say nothing. If the *Adaptor* buys nothing and gets high points, say nothing.
  *   **Collection:** Collect the Citizen Sheets. Do not return them yet.

  ### 0:20 – 0:35 | The Reveal & Vote 1
  *   **Action:** Project a **Blind Data Table** (fill this in quickly from the sheets):
      *   *Student 1: Spent 100cr, Score 100.*
      *   *Student 2: Spent 100cr, Score 20.*
      *   *Student 3: Spent 10cr, Score 50.*
      *   *(Ensure the disparity is visible. The Impaired should have low scores. The Adaptor should have high scores with low spend.)*
  *   **Prompt:** *"The society finds these outcomes unacceptable. We are going to redistribute the initial endowment for Round 2. You must vote on the **Principle of Redistribution**."*
  *   **Options (Write on Board):**
      1.  **Equal Credits:** Everyone gets the same amount of money.
      2.  **Equal Goods:** Everyone gets the same physical bundle of Mobility/Health/Leisure.
      3.  **Equal Satisfaction:** We redistribute credits until everyone's *Satisfaction Score* is the same.
  *   **Debate (5 mins):** Let them argue. They will not know *why* the scores differ, only *that* they differ.
  *   **Vote:** Show of hands. Majority rules.

  ### 0:35 – 0:50 | Round 2: The Redistribution
  *   **Action:** You (The State) calculate the new endowments based on the Vote.
      *   *If Equal Credits:* Give everyone 100cr again. (Boring, but establishes baseline).
      *   *If Equal Goods:* You hand them a pre-set bundle (e.g., 1 Mobility, 1 Health, 1 Leisure). They must accept it. They calculate satisfaction based on their card.
      *   *If Equal Satisfaction (The Trap):* You announce the "Target Score" (e.g., the average of Round 1). You assign credits individually to make everyone hit that target.
          *   *Crucial Move:* The **Adaptor** (who got 50 points with 10cr) gets **0 Credits** in this round because they are already at the target.
          *   The **Impaired** (who got 20 points with 100cr) gets **200 Credits** to try to reach the target.
  *   **Shopping:** Students shop again with new endowments.
  *   **Collection:** Collect Round 2 Sheets.

  ### 0:50 – 1:05 | The Final Reveal & Crisis
  *   **Action:** Return sheets. Ask students to open their Secret Cards and look at their Round 2 allocation.
  *   **The Ambush:** Ask the **Adaptor** students to raise their hands. Ask: *"How many credits did you receive in Round 2?"* (Answer: Zero/Negligible). Ask: *"Is this fair?"*
  *   **The Crisis:** Ask the **Impaired** students. *"You received extra credits. Did it help?"* (Likely no, because the prices are too high).
  *   **Vote 2:** *"Do you want to overturn the Round 2 principle? If you do, we scrap the scores and everyone gets a chocolate bar. If you keep the principle, only the top 3 scores get chocolate."* (This tests their commitment to the principle vs. self-interest).

  ### 1:05 – 1:20 | The Theoretical Debrief
  *   **Action:** Lecture mode. Map the game to the readings.
  *   **Mapping:**
      *   **Round 1 (Equal Credits):** Dworkin's Auction / Resource Egalitarianism. Failed because of **Conversion Factors** (The Impaired card). Equal resources $\neq$ Equal capability.
      *   **Round 2, Option 3 (Equal Satisfaction):** Utilitarianism / Welfare Egalitarianism. Failed because of **Expensive Tastes** (The Connoisseur drained the budget) and **Adaptive Preferences** (The Adaptor was punished for being content with less). This is the "Monstrous" outcome: penalizing the contented poor to feed the expensive rich.
      *   **Round 2, Option 2 (Equal Goods):** Strict Egalitarianism. Failed because of **Heterogeneity**. Giving a wheelchair to someone who can walk is waste (Leveling Down).
      *   **The "State" (You):** You made interpersonal comparisons of utility that are impossible in reality. You knew the cards; a real government does not.

  ---

  ## Part 3: What This Game Cannot Reproduce (The Hand-Waving)
  *Be honest about this in the debrief. It builds trust.*

  1.  **The Epistemic Problem:** In the game, *you* know the conversion factors (the cards). In reality, the state cannot know if someone is truly disabled or just claiming to be, or if tastes are truly expensive or just strategic. The game solves the "information problem" by fiat, which masks the administrative nightmare of implementing Sen or Dworkin.
  2.  **Incommensurability:** The game reduces "Health" and "Leisure" to numbers. Real capabilities (Nussbaum) are qualitatively different. You cannot trade "Political Affiliation" for "Bodily Health." The game forces trade-offs that theories might say are impermissible.
  3.  **Responsibility:** The game treats all disadvantages as brute luck. It doesn't distinguish between the *Connoisseur* who cultivated expensive tastes (responsibility) vs. the *Impaired* who was born disabled. Dworkin's insurance scheme is too complex to simulate here, so you've papered over the "choice vs. circumstance" distinction.

  ---

  ## Part 4: Troubleshooting & Predictable Failures

  ### 1. The "Expensive Tastes" Joker
  *   **Prediction:** The student with the *Connoisseur* card realizes their leisure costs 50cr. They will loudly complain, "This is rigged!" or laugh about how they need champagne.
  *   **Handle:** Do not validate or deny. Say: *"Record your complaint as a Satisfaction penalty if you wish. The market does not negotiate."* In the debrief, use them: *"Student X felt the rules were unfair. Dworkin says we shouldn't subsidize expensive tastes. Sen says we should look at what they can actually do. Who was right?"*

  ### 2. Strategic Voting (Gaming the Theory)
  *   **Prediction:** A student who read ahead will realize that voting for "Equal Satisfaction" benefits the *Adaptor*. They might campaign for it cynically.
  *   **Handle:** Let them. It's a feature, not a bug. In the debrief, expose them: *"Did anyone vote for Principle 3 because they thought it would benefit them personally? That is the 'Veil of Ignorance' failing. Rawls would be disappointed."*

  ### 3. The "Monstrous" Moment Falls Flat
  *   **Prediction:** The *Adaptor* student doesn't care they got 0 credits in Round 2 because they still got a chocolate bar at the end.
  *   **Handle:** You must intervene in the narrative. When revealing Round 2 allocations, say: *"In a real society, Student Y would not just lose credits. They would lose access to healthcare because the state assumes they don't need it. They are being punished for resilience."* Make the moral weight explicit since the stakes (chocolate) are low.

  ### 4. Time Creep
  *   **Prediction:** Calculating satisfaction takes too long.
  *   **Handle:** Keep the math trivial. Prices are 10, 20, 50. Scores are 10, 20, 50. If they are slow, cut the Round 2 Shopping phase. You (The State) simply *assign* the outcomes based on the Vote to save time. The *feeling* of allocation matters more than the act of shopping in Round 2.

  ### 5. "Leveling Down" Confusion
  *   **Prediction:** Students won't see why Equal Goods is bad.
  *   **Handle:** Prepare a specific example. *"If we equalize Goods, the Able-Bodied get a wheelchair they don't need, and the Disabled still can't use the stairs. We wasted resources to achieve 'equality' that helped no one. That is Leveling Down."*

  ---

  ## Part 5: The "Monstrous" Mechanic Explained
  *To ensure the "Equal Welfare looks monstrous" requirement is met:*

  The **Adaptor Card** is the key.
  *   **Round 1:** Adaptor spends 10 credits, gets 50 Satisfaction Points (because they are easily pleased).
  *   **Impaired:** Spends 100 credits, gets 20 Satisfaction Points.
  *   **Vote:** Class votes for **Equal Satisfaction** (aiming for the average, say 35 points).
  *   **Round 2 Allocation:**
      *   **Impaired:** Given 200 Credits to try to reach 35 points.
      *   **Adaptor:** Given **0 Credits**. Why? Because their baseline satisfaction (with nothing) is already 50, which is *above* the target of 35.
  *   **The Result:** The Adaptor is stripped of resources entirely because they are "too happy." This mirrors the critique that welfare egalitarianism punishes those who have learned to cope with oppression (adaptive preferences) and rewards those who demand more. It feels intuitively wrong to starve the contented peasant to feed the dissatisfied rich, even if the rich are disabled. This tension is the exact theoretical knot you want them to feel.

  ## Facilitator's Cheat Sheet for Debrief Questions
  1.  **To the Impaired:** "Did Equal Resources (Round 1) feel just? Why not?" (Leads to **Capabilities**).
  2.  **To the Adaptor:** "Did Equal Satisfaction (Round 2) feel just? Why were you punished?" (Leads to **Adaptive Preferences/Nussbaum**).
  3.  **To the Class:** "Who should have known your card? You? Me? A social planner?" (Leads to **Information/Privacy constraints**).
  4.  **Final:** "If you can't equalize Resources, Welfare, or Capabilities without something breaking, what is left?" (Leads to **Democratic Equality/Anderson** or **Sufficientarianism**).
