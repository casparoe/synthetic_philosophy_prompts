              *   *Hedonist Response:* Bite the bullet (yes, the pig life is better).
              *   *Assessment:* Legitimate consistency, but intuitively costly.
          *   *Defeater 4: The Relief/cessation issue (User's specific point).* Pleasure as the cessation of pain (Schopenhauer/Freud).
              *   *Rank:* Awkward.
              *   *Hedonist Response:* Negative pleasure is still on the positive side of the ledger.
