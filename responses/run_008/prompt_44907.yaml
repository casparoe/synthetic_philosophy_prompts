          1.  *Structural/Attitudinal:* Pleasure = wanting an experience to continue. *Problems:* Some pleasures want to end (climax of a joke, end of a symphony), relief is pleasure in stopping, some pains demand attention.
          2.  *Definitional/Functional:* Pleasure = whatever chosen for its own sake. *Problem:* Makes hedonism tautological/empty ("good is what I choose" vs. "good is pleasure").
