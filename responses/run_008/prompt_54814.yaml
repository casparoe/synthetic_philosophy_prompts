  3.  **Formulate the Recommendation:**
      *   *Chair Elections (Single Winner, Majority Required):* Needs to satisfy the bylaw "majority of votes cast." Plurality fails this often. Instant Runoff Voting (IRV) is the standard solution for majority requirement with >2 candidates. It's ranked, understandable, and satisfies the majority clause.
