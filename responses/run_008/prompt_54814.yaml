answer: |-
  **TO:** Bylaws Subcommittee
  **FROM:** Chair, Bylaws Subcommittee
  **DATE:** March 15
  **SUBJECT:** Recommendation on Voting Rules for Faculty Senate Elections

  **Recommendation**
  To balance theoretical robustness, bylaw compliance, and administrative feasibility, I recommend the following voting methods:

  1.  **Single-Winner Elections (e.g., Senate Chair):** Instant Runoff Voting (IRV).
  2.  **Multi-Winner Elections (e.g., At-Large Committees):** Approval Voting.
  3.  **Policy Questions (e.g., Reopen Search):** Simple Majority (Yes/No).

  **Theoretical Context: The Gibbard–Satterthwaite Theorem**
  Prof. K is correct that the Gibbard–Satterthwaite (G-S) theorem proves any deterministic, ordinal voting rule with three or more outcomes is susceptible to strategic voting. However, her conclusion that we should therefore adopt Plurality is mathematically inconsistent. Plurality is itself an ordinal rule (where voters rank one candidate first and all others equally last) and is highly vulnerable to strategy, specifically "vote-splitting" among similar candidates.

  The theorem assumes *ordinal* preferences (rankings). Cardinal systems (like Approval or Score voting) technically fall outside the strict scope of G-S because voters express intensity, not just order. While cardinal systems are not strategy-*proof* (voters may still min-max scores), they often reduce the incentive for the "lesser-of-two-evils" distortion common in Plurality. Our goal cannot be to eliminate manipulability (which is impossible); it must be to minimize *accidental* spoilage and ensure the outcome reflects broad support.

  **Evaluation of Proposed Rules**
  *   **Borda Count (Prof. R):** While Borda utilizes more voter information than Plurality, it is notoriously vulnerable to "burying." A faction can manipulate the outcome by ranking a strong competitor last, even if that competitor is their second choice. Furthermore, Borda counts are difficult to explain to an electorate voting by email and harder to audit manually.
  *   **Graduate Representative's Proposal:** This hybrid rule (Score → Threshold → Runoff) introduces arbitrary thresholds (1.5 average) and complex tie-breaking procedures. High cognitive load reduces voter participation and increases the risk of counting errors. In governance, transparency trumps optimization; if voters cannot simulate the count in their heads, they will not trust the result.
  *   **Plurality (Prof. K):** Aside from the G-S vulnerability noted above, Plurality fails to identify consensus candidates. In a field of four, a candidate with 35% support can win despite 65% opposition. This risks repeating the instability of last spring's search.

  **Bylaw Compliance: The Majority Clause**
  Our bylaws require Chair elections to be decided by a "majority of votes cast." This is the primary constraint.
  *   **Plurality** fails this whenever there are more than two viable candidates.
  *   **IRV** satisfies the majority criterion by redistributing votes until one candidate exceeds 50%. *Caveat:* To strictly comply with "majority of votes *cast*," we must define exhausted ballots (where a voter ranks only eliminated candidates) as non-votes for the final tally. If exhaustions prevent any candidate from reaching 50% of the *original* ballot count, a top-two runoff must be triggered.
  *   **Approval/Borda** do not inherently guarantee a majority of votes cast without additional runoff mechanisms.

  **Implementation Details**
  *   **Chair (IRV):** Voters rank candidates (1st, 2nd, 3rd...). If no candidate receives >50% of first-choice votes, the lowest candidate is eliminated and their votes transfer to the next ranked choice on those ballots. This reduces the "spoiler effect" and encourages candidates to appeal beyond their base.
  *   **Committees (Approval):** Voters select *all* candidates they find acceptable. The top *N* vote-getters win. This is cardinal (addressing Prof. K's concern), simple to count, and allows voters to support minor candidates without wasting their vote.
  *   **Policy Questions:** Standard majority. To avoid the "reopen search" paradox, ballots should read: "Candidate A," "Candidate B," "Reopen Search." If "Reopen Search" receives a majority, the election is void. If not, the winner is determined among candidates.

  **Next Steps**
  I propose we adopt these rules for the April vote. They require no specialized software (counts can be verified in Excel) and withstand scrutiny from both the Economics and Statistics departments. Please review the draft language attached before our meeting.

  **Chair, Bylaws Subcommittee**
