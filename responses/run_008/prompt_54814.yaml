  2.  **Deconstruct the Mathematical/Procedural Issues:**
      *   **Gibbard–Satterthwaite (G-S):** Prof. K is technically correct *within the theorem's scope* (ordinal, deterministic, non-dictatorial, >2 outcomes). However, she ignores that *all* rules (including Plurality) are manipulable under G-S. Plurality is not immune; it's just manipulable in different ways (lesser-evil voting). Also, cardinal rules (Score/Approval) technically fall outside the *ordinal* assumption, though they have their own manipulation issues (strategy is still possible, e.g., min-max scoring).
      *   **Borda Count:** Prof. R likes it. Prof. K hates it (burying). K is right that Borda is highly susceptible to "burying" (ranking a strong competitor last to lower their score). It's also confusing for voters to understand why ranking a candidate 2nd vs 3rd matters so much.
      *   **Grad Rep's Rule:** Complex. Score 0-3 is cardinal. Drop threshold is arbitrary. Runoff adds complexity. Tiebreak by head-to-head is Condorcet-ish. Too complicated for email voting and manual counting. High cognitive load.
      *   **Majority Clause:** "Majority of votes cast" is tricky with >2 candidates. Plurality often fails this (winner gets 40%, not 50%+1). Instant Runoff (IRV) or Two-Round System (TRS) satisfies this. Score/Borda usually produce a winner based on points, not necessarily a majority of *votes* unless defined carefully.
