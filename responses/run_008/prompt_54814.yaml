      *Wait, check the Majority Bylaw:* "Majority of votes cast." In IRV, if ballots exhaust, does the winner have a majority of *cast* ballots or *continuing* ballots? Standard IRV often ignores exhaustions. To be safe, we might need a Two-Round System (TRS) if IRV is too hard to explain/count manually. But IRV is standard for "majority via ballot." Let's stick with IRV but note the exhaustion caveat. Actually, for 600 faculty via email, IRV counting is manageable.
