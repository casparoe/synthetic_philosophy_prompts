      *   Is it the strongest version? I need to make sure I don't just strawman Dana. I need to acknowledge why her view is attractive (protects integrity) but show why it fails logically.

  8.  **Structure of the Response:**
      *   **Validation:** Dana's move is standard and sophisticated (The Compliance Condition).
      *   **The Pivot:** Why this reformulation actually weakens her position.
      *   **Argument 1: The Rescue Analogy (fixing the bargaining hole).** Shift from "bargain" to "urgency."
