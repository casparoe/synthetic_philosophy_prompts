      *   Better angle: Even on its own terms, the fairness objection leads to worse outcomes.
      *   I will argue that Dana's reformulation fails because it relies on a conception of fairness that is incompatible with the moral gravity of the situation (suffering/death). It treats morality as a club membership rather than a response to reality.

  10. **Final Polish:** Ensure the tone is supportive but intellectually rigorous. (Proceed to generate output).

