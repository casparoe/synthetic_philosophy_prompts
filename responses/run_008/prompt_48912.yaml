  7.  **Final Polish:** Check for clarity and ensure the distinction between "psi-epistemic" (about knowledge) and "psi-ontic" (about reality) is clear in the context of the PBR assumptions. (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: I need to be careful not to say PBR is "wrong." It's a valid theorem. The issue is the *interpretation of its scope* in the popular book. The book claims it "settled the matter." Specialists know it didn't settle it because assumptions can be rejected. I must make this distinction clear.

  8.  **Final Output Structure:**
      *   Executive Summary.
      *   Sentence-by-Sentence Audit.
      *   Deep Dive on (a), (b), (c).
      *   Verdict/Recommendation.

