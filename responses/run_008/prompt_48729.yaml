answer: |-
  You have accurately identified a specific, well-studied psychological and economic phenomenon. You are right that it sidesteps the traditional philosophical paradox of self-deception (how can I believe $P$ and not-$P$ simultaneously?), because in your examples, the person never actually forms the belief in $P$.

  Here is the breakdown of the established names, the philosophical status, and the edges of the concept as you requested.

  ### 1. The Established Names

  There is no single word, but there are three dominant terms used across different fields that map exactly to what you are describing.

  **A. Information Avoidance (Psychology & Behavioral Economics)**
  This is the most precise scientific term. Defined by psychologists Golman and Loewenstein (2016), it is "any behavior intended to prevent or delay the acquisition of available but potentially unwanted information."
  *   **Why it fits:** It covers both the passive (not looking at the scale) and the active (telling friends not to talk about the girlfriend).
  *   **The Mechanism:** It acknowledges that knowledge has a "utility cost." If the pain of knowing outweighs the benefit of planning, the brain treats ignorance as a resource.

  **B. Strategic Ignorance (Economics & Game Theory)**
  This term highlights the *planning* aspect you noticed. It is used when remaining ignorant provides a tactical advantage.
  *   **Why it fits:** Your example of the guy asking about his girlfriend is classic Strategic Ignorance. If he knows she is cheating, he has to break up (painful). If he *doesn't know*, he can claim plausible deniability, stay in the relationship, and not be "the guy who got cheated on." He is paying a premium in ignorance to buy emotional comfort or social cover.
  *   **The Mechanism:** It treats ignorance as a chosen strategy to maximize utility (happiness, social standing, deniability).

  **C. Willful Blindness (Law & Ethics)**
  You mentioned this, but it is worth revisiting regarding the "mental structure." In law, this is not just about liability; it defines a mental state (*mens rea*) where a person suspects the truth but deliberately avoids confirming it to maintain a defense of "I didn't know."
  *   **Why it fits:** It captures the moral culpability. The law treats "choosing not to know" as equivalent to knowing.

  ### 2. Is it Self-Deception? (The Philosophical Verdict)

  You asked: *"So is this even self-deception in the sense philosophers worry about?"*

  **The Analytic Philosophy View: No.**
  Traditional analytic philosophers (like Alfred Mele) distinguish between **Self-Deception** (acquiring a false belief, e.g., "I believe she is faithful" despite evidence) and **Ignorance Management** (avoiding the evidence).
  *   **The Paradox:** Traditional self-deception requires a contradiction (I know $X$ is true, but I believe $X$ is false).
  *   **Your Observation:** You are correct that your examples avoid this. The person does not hold a false belief; they hold *no belief* because they halted the data processing. Philosophers often call this **"Preemptive Self-Deception"** or **"Self-ignorance."** It is functionally self-deception without the logical paradox.

  **The Evolutionary Psychology View: Yes.**
  Robert Trivers, in his theory of the evolution of self-deception, argues exactly what you observed: *We deceive ourselves to better deceive others.*
  *   If you know your girlfriend is cheating, your micro-expressions might betray anger.
  *   If you arrange to *not know*, your relief is genuine. You are a better liar to your friends and family because you have successfully quarantined the truth from your conscious mind. In this view, Information Avoidance is the *mechanism* of self-deception.

  ### 3. Defining the Edges (Coining the Distinctions)

  Since you asked for the edges of the concept, specifically regarding passive vs. active avoidance and the nature of the "knowledge," here is the taxonomy of the phenomenon.

  **Edge 1: The Activation Threshold (Passive vs. Active)**
  *   **Passive Avoidance (The Ostrich Effect):** The information is present, but you do not engage with it.
      *   *Example:* Hiding the scale.
      *   *Mental State:* "I will not look."
  *   **Active Avoidance (Strategic Ignorance):** You expend energy to ensure the information *cannot* reach you.
      *   *Example:* Telling friends "Don't tell me," or delaying the biopsy call.
      *   *Mental State:* "I will destroy the bridge before the messenger crosses it."
      *   *Significance:* Active avoidance requires higher cognitive load and implies a stronger suspicion of the truth. You are fighting your own curiosity.

  **Edge 2: The Epistemic Status (Implicit vs. Explicit)**
  You noted: *"Some part of you already knows the answer."*
  *   **Implicit Knowledge:** The brain has processed the pattern (girlfriend acting shady, weight gain, health symptoms) and generated a probability. This is the "planning" signal.
  *   **Explicit Belief:** The conscious admission ("I am cheating," "I am sick").
  *   **The Edge:** The phenomenon exists in the gap between Implicit Knowledge and Explicit Belief. The goal is to keep the probability high enough to justify avoidance, but low enough to avoid conscious distress. If the implicit knowledge becomes too certain, avoidance becomes impossible (you *have* to look). If it's too low, avoidance is unnecessary.

  **Edge 3: The Temporal Boundary (Diachronic Self-Deception)**
  This addresses your point about "promoting" the belief.
  *   **Synchronic Deception:** Lying to yourself right now (The Paradox).
  *   **Diachronic Deception:** Lying to your *future* self.
  *   **The Edge:** This is what you are describing. You (Present Self) are manipulating the environment so that You (Future Self) never has to confront the truth. It is a contract between your current and future selves to maintain ignorance.

  ### Summary
  The most accurate established name is **Information Avoidance**, specifically the subset of **Strategic Ignorance**.

  It is distinct from traditional philosophical self-deception because it avoids the paradox of contradictory beliefs. Instead of believing a lie, it prevents the truth from becoming a belief.

  If you need a term that captures the specific *mental structure* you described (the planning, the implicit knowledge, the quarantine of truth), the most precise label is **Epistemic Quarantine**.

  *   **Definition:** The active management of one's informational intake to prevent implicit suspicions from crystallizing into explicit beliefs.
  *   **The Edge:** It counts as long as the avoidance is *motivated* by the fear of the specific content. If you don't open the mail because you're lazy, that's procrastination. If you don't open the mail because you suspect it's a bill you can't pay, that's Epistemic Quarantine.
