  The package is not jointly tenable, with the most severe contradiction occurring between your commitment to memetic selection in (3) and your explicit rejection of memetic functionalism in (5).

  The tension between (3) and (5) is logical rather than merely theoretical: (3) asserts that variants spread because of their own transmissibility (a memetic fitness explanation), while (5) forbids explaining the content of those variants by what they do for memes. Since content determines transmissibility, you cannot consistently claim that content arises from cognitive quirks independent of memetic fitness while simultaneously arguing that memetic fitness drives the spread of that content. To resolve this, you must concede either that cognitive quirks are themselves shaped by memetic selection (undermining the "not by what those concepts do for memes" clause in 5) or that memetic selection is merely a descriptive outcome of cognitive biases rather than an explanatory force (weakening the "meme's-eye perspective" in 3 and 6). The cost of the former is collapsing into pure memetics; the cost of the latter is reducing your Darwinian claim to a metaphor about psychological biases.

  A second major tension exists between (1), (4), and (6). You assert cultural change is "genuinely Darwinian" (1) while admitting variation is directed toward intelligible purposes (4) and denying high-fidelity replicators (6). In philosophy of biology, Darwinian algorithms typically require blind variation and sufficient fidelity to accumulate adaptation. By admitting directed variation, you invite a Lamarckian classification; by denying replicators, you undermine the mechanism for cumulative selection. To maintain (1), you would have to argue that fidelity is high enough despite (6) or that directed variation is still compatible with population-level selection, but this costs you the distinctiveness of the "active critic" model in (4), which implies a level of agency that bypasses selective filtering.

  The tension between (2) and (3) is less severe but requires careful handling. (2) demands explanations via individual psychological biases, while (3) invokes traits bad for bearers (like celibacy). These are compatible only if you specify that psychological biases (e.g., prestige bias) are the mechanisms by which memetic fitness operates. If you treat memetic fitness as a freestanding force in (3) that overrides individual psychology, you contradict (2). You must concede that memetic fitness is entirely constituted by psychological biases, which costs you the strong autonomy of the meme implied in (3).

  The single revision that cleans up the most is to delete the exclusion clause in (5) ("not by what those concepts do for genes, memes, or societies"). This allows cognitive quirks to be the proximate mechanism while permitting memetic fitness to be the ultimate explanation, reconciling (3), (5), and (6) without abandoning the cognitive science angle.

  The one thing the seminar group will pounce on that you haven't noticed is your assertion of "genuinely Darwinian" processes in (1) combined with the admission of directed variation in (4). The philosophy of biology students will argue that if variation is directed toward intelligible purposes, the process is not Darwinian by definition, regardless of population thinking; they will force you to either defend a non-standard definition of Darwinism or concede that your model is a hybrid of Darwinian selection and Lamarckian inheritance, which weakens the foundational claim of your entire list.
