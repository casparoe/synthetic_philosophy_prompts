answer: |-
  # DIAGNOSTIC TREE: SELF-LOCATING BELIEF
  **Course:** [Course Name] | **Topic:** Sleeping Beauty & Credence

  **Instructions:** Do not start by asking "Are you a Halfer or Thirder?" Start at the **Root**. Answer the case questions based on your intuition about the *scenario*, then follow the arrow. The goal is to find which philosophical position matches your pattern of judgments.

  ---

  ## PART 1: THE DECISION TREE

  ### **ROOT: The Extreme Tails Test**
  **Case:** Standard setup, but if **Tails**, Beauty is awakened **1,000,000 times** (with amnesia). If **Heads**, once.
  **Q:** Upon awakening, is your credence in Heads significantly less than 1/2 (e.g., near 1/1,000,001)?
  *   **YES** $\rightarrow$ Go to **NODE A (Frequency Sensitive)**
  *   **NO** (It stays 1/2) $\rightarrow$ Go to **NODE B (Frequency Insensitive)**
  *   **UNSURE/DEPENDS** $\rightarrow$ Go to **NODE E (Instability)**

  ### **NODE A: The Monday Revelation**
  **Case:** (Standard 1-Tail/1-Head setup). You awaken. The experimenter truthfully tells you: **"It is Monday."**
  **Q:** Does your credence in Heads **change** (specifically, does it rise to 1/2)?
  *   **YES** (It updates via standard conditioning) $\rightarrow$ Go to **NODE C**
  *   **NO** (It stays at 1/3) $\rightarrow$ **LEAF: Radical Thirder / Contextualist**
  *   **MIXED** (Depends on how "Monday" is defined) $\rightarrow$ **LEAF: Ill-Posed / No Fact**

  ### **NODE B: The Tuesday Information Loss**
  **Case:** (Standard setup). You awaken. The experimenter truthfully tells you: **"It is Tuesday."** (Everyone agrees $P(Heads)=0$ now).
  **Q:** How did you get to zero? Did you **rule out** the Heads world, or did you **lose your location** within the Heads world?
  *   **RULED OUT** (You learned $\neg Heads$) $\rightarrow$ **LEAF: Standard Halfer (Lewis)**
  *   **LOST LOCATION** (Heads-world is still possible, you just aren't "in" it now) $\rightarrow$ **LEAF: Double Halfer**
  *   **QUESTION REJECTED** (Distinction makes no sense) $\rightarrow$ **LEAF: Pragmatic / Decision-Theoretic**

  ### **NODE C: The Technicolor Consistency Check**
  **Case:** **Heads:** 1 Awakening (Room Red or Blue, 50/50). **Tails:** 2 Awakenings (Mon=Red, Tue=Blue). You wake in a **Red** room.
  **Q:** Is $P(Heads | Red)$ calculated by counting **Red Worlds** or **Red Awakenings**?
  *   **RED AWAKENINGS** (Result $\approx 1/3$) $\rightarrow$ **LEAF: Standard Thirder (Elga)**
  *   **RED WORLDS** (Result $\approx 1/2$) $\rightarrow$ **LEAF: Hybrid / Halfer-Thirder**
  *   **UNSURE** $\rightarrow$ **LEAF: Ill-Posed / No Fact**

  ### **NODE E: The Inverted Symmetry Check**
  **Case:** **Heads:** 2 Awakenings. **Tails:** 1 Awakening. Fair coin.
  **Q:** Upon awakening, is $P(Heads) > 1/2$?
  *   **YES** $\rightarrow$ Return to **NODE A** (You are likely a Thirder).
  *   **NO** (It stays 1/2) $\rightarrow$ Return to **NODE B** (You are likely a Halfer).
  *   **VARIES** $\rightarrow$ **LEAF: Pragmatic / Decision-Theoretic**

  ---

  ## PART 2: POSITION DEFINITIONS & TA META-ANALYSIS

  ### **The Leaves (Position Profiles)**

  1.  **Standard Thirder (Elga):** Credence tracks awakening counts. $P(H)=1/3$. Learning "It's Monday" is standard evidence that updates $P(H)$ to $1/2$.
  2.  **Standard Halfer (Lewis):** Credence tracks coin bias. $P(H)=1/2$. Learning "It's Tuesday" rules out Heads-worlds entirely.
  3.  **Double Halfer:** Credence tracks coin bias ($P(H)=1/2$), but treats self-locating info specially. On Tuesday, you don't rule out Heads, you lose your indexical grip on it. (Often motivated by preserving Conditionalization).
  4.  **Ill-Posed / Contextualist:** The question "What is your credence?" lacks a determinate answer without specifying a reference class (e.g., "credence per awakening" vs. "credence per experiment").
  5.  **Pragmatic / Decision-Theoretic:** Credence *just is* betting odds. If betting schemes vary, credence varies. The epistemic question is secondary to the decision problem.

  ### **TA Confidence & Caveats (Do Not Distribute)**

  | Branch Node | Confidence | Why? |
  | :--- | :--- | :--- |
  | **Root (Extreme Tails)** | **High** | This is the strongest intuition pump. If a student stays 1/2 here, they are committed Halfers. If they budge, they are quasi-Thirders. |
  | **Node A (Monday)** | **High** | Cleanly separates Thirders (who treat "I am awake now" as evidence) from Halfers (who don't). |
  | **Node B (Tuesday)** | **Low** | **Trust this least.** Students struggle to articulate "losing location" vs. "ruling out." Many Double Halfers sound like Standard Halfers in conversation. |
  | **Node C (Technicolor)** | **Medium** | Good for catching inconsistent Thirders, but the math is tricky to explain in section without a board. |
  | **Node E (Inverted)** | **High** | Excellent for breaking the "Coin is Fair = 1/2" heuristic. |

  ### **Structural Limitations**

  *   **The Halfer Collapse:** The tree cannot reliably separate **Standard Halfers** from **Double Halfers** based on *numbers* alone. They agree on $P(H)=1/2$ in almost all betting scenarios. The split is purely metaphysical (how they model centered worlds). If a student says "I'm a Halfer" but can't answer Node B, group them with Standard Halfers for grading purposes.
  *   **The "Ill-Posed" Cop-Out:** Be wary of students selecting **Ill-Posed** simply because they haven't done the reading. True Contextualists (e.g., Schwarz) have specific arguments about reference classes; others are just confused.
  *   **Literature vs. Intuition:** The **Double Halfer** leaf exists primarily because philosophers (e.g., Lewis, Meacham) needed a technical fix for conditionalization problems. It is rarely a student's "natural" vibe. If a student lands here, check if they actually understand the centered-worlds machinery or if they just want to be a Halfer without paradox.
  *   **Pragmatic Leaf:** This often attracts students who think philosophy should be about action. Ensure they aren't just conflating *credence* with *utility*.

  ### **Suggested Section Activity**
  Have students pair up. One plays the "Experimenter" (reads the Case), the other plays "Beauty" (answers the Q). Swap after Node A. Compare which Leaf they landed on. Discuss *why* Node B felt difficult.
