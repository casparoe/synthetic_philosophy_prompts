      *   *Check:* Am I using American English? (Yes, "counseling," "labor," etc.)
      *   *Check:* Am I distinguishing settled vs. contested? (Need to use phrases like "Scholars debate," "It is contested," "The text shows," vs. "One might argue.")
      *   *Check:* Am I avoiding consensus claims on philosophy? (Ensure I don't say "Extended cognition is wrong," but rather "Critics of extended cognition argue...")

