          *   *Wait, standard definition:* The Sadistic Conclusion (SC) is usually: It is better to add lives with negative well-being than to add lives with positive well-being (under certain conditions, often associated with Critical Level views). Or, more broadly, that it can be better to add suffering people than happy people.
