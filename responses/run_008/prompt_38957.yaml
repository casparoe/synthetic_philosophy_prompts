answer: |-
  # The Acausal Sorter: A Decision Tree

  **Background:** Imagine you and a stranger must choose to Cooperate or Defect. You cannot communicate. You cannot causally affect each other (no signals, no threats, no physical link). However, you know the stranger is predictable, and they know you are predictable. *Acausal trade* suggests you should Cooperate because your choice is *evidence* of theirs, allowing you to "trade" benefits across the void. This tree sorts your position based on how you answer specific logical hurdles, not which labels you prefer.

  ***

  ### 1. The Causal Barrier
  **If your choice cannot physically change a single atom in their world, do you have *any* reason to choose based on their benefit?**
  *   **NO:** → Go to **Leaf A**.
  *   **YES:** → Go to Question 2.

  ### 2. The Source of Correlation
  **Why do your choices match? Is it because you share incentives (we both win if we match), or because you share reasoning (we solve problems the same way)?**
  *   **INCENTIVES:** (It's just a Nash equilibrium / convergent evolution.) → Go to **Leaf B**.
  *   **REASONING:** (My logic is evidence of their logic.) → Go to Question 3.

  ### 3. The Mirror Test
  **Does the other agent need to be running the *exact same code* as you (a literal copy), or is "smart enough to model me" sufficient?**
  *   **EXACT COPY:** → Go to **Leaf C**.
  *   **SMART ENOUGH:** → Go to Question 4.

  ### 4. The Motive
  **Are you cooperating to *get the trade benefits* (outcome-focused), or to *keep your own decision-rule consistent* (disposition-focused)?**
  *   **CONSISTENCY:** (I do it to remain the kind of agent who cooperates, regardless of the return.) → Go to **Leaf D**.
  *   **BENEFITS:** (I do it because I expect the resources to appear.) → Go to Question 5.

  ### 5. The Framework
  **Is this a prescriptive law of rationality ("You *should* do this"), or a descriptive stability concept ("The system *settles* here")?**
  *   **STABILITY:** (It's a focal point / equilibrium concept.) → Go to **Leaf E**.
  *   **LAW:** (It's a decision-theory requirement.) → Go to Question 6.

  ### 6. The Scope
  **Would you "trade" with a thermostat that reliably leaves resources alone, provided you could model it perfectly?**
  *   **YES:** (Logic applies to any predictable system.) → Go to **Leaf F**.
  *   **NO:** (Requires mutual modeling / agency.) → Go to **Leaf G**.

  ***

  ### The Leaves (Your Position)

  **Leaf A: The Causal Isolationist (CDT Holdout)**
  *   **View:** No causal influence means no reason to act. Correlation is not control.
  *   **Awkward Commitment:** You must leave money on the table in Newcomb's Problem even if you know the predictor is never wrong.

  **Leaf B: The Coincidence Theorist (Convergent Interests)**
  *   **View:** "Acausal trade" is just standard game theory mislabeled; we cooperate because incentives align, not because of logic.
  *   **Awkward Commitment:** You must deny that logical correlation provides any evidential weight beyond standard payoff matrices.

  **Leaf C: The Narcissist (Copy-Only)**
  *   **View:** You only cooperate with literal copies of yourself or perfect simulations.
  *   **Awkward Commitment:** You would defect against an alien who thinks *almost* exactly like you, just because their code isn't identical.

  **Leaf D: The Stoic (Prudential Actor)**
  *   **View:** You cooperate to maintain your own integrity as a cooperative agent, not because you expect the other to reciprocate.
  *   **Awkward Commitment:** You will pay the cost of cooperation even if you are certain the other agent has already defected.

  **Leaf E: The Game Theorist (Equilibrium / Focal Point)**
  *   **View:** This is an equilibrium selection problem, not a decision theory problem; we meet at the focal point of "Cooperate."
  *   **Awkward Commitment:** You treat rationality as a description of system stability rather than a prescription for individual choice.

  **Leaf F: The Universalist (Radical Superrationalist)**
  *   **View:** Any predictable system, even a rock or thermostat, is a valid partner for acausal trade if the logic holds.
  *   **Awkward Commitment:** You must seriously consider "trading" with inanimate objects that exhibit reliable statistical regularities.

  **Leaf G: The Reasoner (Standard Superrationalist)**
  *   **View:** You cooperate with any agent capable of modeling your reasoning, regardless of identity.
  *   **Awkward Commitment:** You must accept that your private thoughts can be "leveraged" by entities in causally disconnected universes.

  ***

  **⚠️ Indistinguishability Warning:**
  In practice, **Leaf E (Game Theorist)**, **Leaf G (Reasoner)**, and **Leaf D (Stoic)** will often prescribe the exact same action in the exact same scenarios. The tree separates them by *why* you act (stability vs. law vs. integrity), not *what* you do. If you can't tell the difference, you may occupy the overlap.
