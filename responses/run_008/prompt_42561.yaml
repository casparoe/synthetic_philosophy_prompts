answer: |-
  1. The legal framework implicitly adopts the doctrine of the moral equality of combatants, treating soldiers as instruments of the state who lack the authority to judge the legitimacy of the war itself. This view holds that combatant status alone grants both the license to kill enemy fighters and immunity from prosecution for participating in the conflict.
  2. This theory strictly requires that humane treatment remain independent of the war's justice, whereas reciprocal benefits merely fit well as a pragmatic enforcement mechanism. Without the underlying moral separation, the guarantee of protection for volunteers fighting an aggressive war would collapse into a conditional bargain.
  3. No rival theory fully licenses the entire practice, since pure reciprocity explains protection from mistreatment but fails to justify immunity from prosecution for fighting itself. A retributive view based on individual moral liability would similarly fail, as it would require punishing soldiers on the unjust side rather than protecting them.
  4. The distinction between punishing leaders for aggression while shielding soldiers from liability for fighting is consistent with the theory that only political leaders possess the agency to decide on war. Soldiers remain liable for war crimes because the rules of engagement fall within their direct moral control, unlike the strategic decision to initiate conflict.
  5. If the practice assumed that soldiers on the unjust side forfeit their protections, captors would need to adjudicate the justice of the cause before granting POW status, likely leading to widespread executions. This change would erase the separation between the justice of the war and the conduct within it, making humane treatment contingent on victory rather than law.
