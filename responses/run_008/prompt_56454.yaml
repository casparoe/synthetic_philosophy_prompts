      *Refining the "Model Answer":* Needs to explain that UDT chooses a *policy* (function from observations to actions) from the prior. The observation is an argument to the function, not a belief update that changes the utility calculation of the act itself. It distinguishes from EDT by noting EDT calculates $EU(Action | Observation)$, while UDT calculates $EU(Policy)$ where Policy includes the observation handling.

