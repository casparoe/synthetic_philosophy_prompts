              *   *Argument:* If moral properties supervene on natural properties, then if two situations are naturally identical, they are morally identical. This looks like a universal generalisation: $\forall x (Nx \rightarrow Mx)$.
              *   *Particularist Defence:* Dancy argues supervenience doesn't imply *explainability* by principles. It's a constraint, not a guide. However, the "Argument from Supervenience to Generalism" (inductive generalisation) is strong. If reasons behave holistically, can we really guarantee supervenience without *some* stable mapping?
              *   *Ranking:* Very serious. Many particularists concede this requires a nuanced account of supervenience that doesn't collapse into generalism.

          *   *2. The Learning/Acquisition Problem (The "Serious" one):*
              *   *Argument:* How does a child learn? Usually via rules ("Don't hit"). If there are no rules, what are they learning? Patterns? But recognising patterns implies seeing the *same* thing in different cases.
              *   *Particularist Defence:* We learn by example and developing a "moral eye" (Aristotelian phronesis). It's skill-based, not rule-based.
              *   *Ranking:* Serious, but particularists have a ready (if controversial) answer: moral education is initiation into a practice, not memorisation of code.

          *   *3. The Analogy/Relevance Problem (The User's specific worry):*
              *   *Argument:* To say A is like B requires a general claim about relevance.
