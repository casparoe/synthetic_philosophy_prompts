          *   *4. The Communication/Disagreement Problem (The "Awkward" one):*
              *   *Argument:* If I can't cite a principle, how do I persuade you?
              *   *Particularist Defence:* You have to look and see. "Come and look."
              *   *Ranking:* Merely awkward. It makes morality elitist or ineffable, but not logically impossible.

      *   **Addressing the "Generalism in Disguise" Charge:**
