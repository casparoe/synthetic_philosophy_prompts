      *   *Case 5:* Control Logic = Task Completion. (Agent). Mask = Pirate Voice.
      *   *Case 6:* Control Logic = Survival/Performance. (Agent). Mask = Character Voice.
      *   *This is the key insight.*

      *   *Okay, final plan:*
          1.  Principle: **The Closed-Loop Control System.**
          2.  Explain the Mask (Encoding vs. Control).
          3.  Verdict to Overturn: **Stockfish** (It's a borderline agent, calling it a tool is pragmatic).
          4.  New Cases: Macro (Tool), Chatbot (Tool).
          5.  Weak Spot: **System Boundary / Goal Ownership.**

      *   *Wait, one nuance on Stockfish.* Stockfish *does* search. It simulates future states. That's a form of internal loop. But it doesn't *act* on the world to *get* the board state.
