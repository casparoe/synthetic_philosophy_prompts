          *   Refine the terminology: Use "Incorrigibility" vs. "Fallibility."
          *   Add nuance: It's not just filing; it's about the *definition of explanation*. For Illusionists, a complete functional account *is* the explanation. For Realists, a functional account leaves out the "what it's like."
          *   Address "Unfairness": It's not unfair, but it highlights the "Hard Problem" vs. "Real Problem" distinction (Keith Frankish's terminology).
      *   **The "Move the Needle" Question:**
          *   *Experiments:* Unlikely to solve the metaphysical gap. Neuroscience adds detail to the correlation, not the ontology. (Analogy: Knowing exactly which transistors fire in a calculator doesn't explain "numberness" if you think numbers are non-physical, though that's a bad analogy. Better: Knowing the physics of a screen doesn't explain the *meaning* of the movie to a skeptic who denies meaning exists).
