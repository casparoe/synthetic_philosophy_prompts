answer: |-
  # The "Beer & Consciousness" Decision Tree

  **Start Here:** We all agree dogs have inner experiences and rocks do not. Follow the path that matches your intuition.

  **Q1. The Meta Check:** Is "consciousness" a real, detectable boundary in nature, or a fuzzy concept we project onto things?
  *   **No (It's fuzzy):** → **Leaf: Deflationism / Illusionism** (The question assumes a clarity that doesn't exist; see Dennett or Frankish).
  *   **Yes (It's real):** → Go to Q2.

  **Q2. The Substrate Check (AI Chatbot):** If a non-biological system convincingly claims inner experience, is it possible it actually has one?
  *   **Yes:** → **Leaf: Functionalism / Computationalism** (Consciousness is about processing, not biology; substrate doesn't matter).
  *   **No:** → Go to Q3.

  **Q3. The Anatomy Check (Fish):** If a fish avoids harm but lacks a human-like cortex, is it *feeling* pain or just executing a reflex?
  *   **No (Just reflex):** → **Leaf: Corticalism / Higher-Order View** (Experience requires specific higher-brain structures; see Carruthers).
  *   **Yes (Feeling pain):** → Go to Q4.

  **Q4. The Behavior Check (Lobster):** If a lobster screams in boiling water, is that evidence of suffering or purely mechanical noise?
  *   **No (Mechanical):** → **Leaf: Nociception-Only View** (Withdrawal is biological data, not suffering; no "hurt" involved).
  *   **Yes (Suffering):** → Go to Q5.

  **Q5. The Threshold Check (*C. elegans* Worm):** Is a creature with exactly 302 neurons too simple to host even a dim spark of experience?
  *   **Yes (Too simple):** → **Leaf: Biological Threshold View** (Consciousness requires a minimum complexity floor).
  *   **No (Dim spark exists):** → Go to Q6.

  **Q6. The Centralization Check (Octopus):** If an octopus's neurons are mostly in its arms, does the arm have its own experience or share the brain's?
  *   **Brain only:** → **Leaf: Centralized Subject View** (Experience requires a unified commander; arms are tools).
  *   **Shared/Distributed:** → Go to Q7.

  **Q7. The Integration Check (Jellyfish):** If a nerve net syncs rhythmically without a brain, is that integration enough for a "self" or just a fancy reflex?
  *   **Just reflex:** → **Leaf: Standard Evolutionary Continuity** (Consciousness tracks with nervous system complexity; jellyfish are out).
  *   **Enough for a "self":** → **Leaf: Integration Theory (IIT)** (Consciousness is integrated information, regardless of structure; see Tononi).
      *   *Note:* If you landed here but said "No" to the Worm in Q5, you occupy an **Unnamed Slot**. This view holds that *integration* matters more than *neuron count*, but few argue for sync without minimal complexity. It's likely empty because high integration usually implies high complexity.

  **Q8. The Collective Check (Ant Colony):** If a colony acts as a single unit, is the colony itself a conscious subject rather than the individuals?
  *   **Yes:** → **Leaf: Holism / Superorganism Theory** (Consciousness can emerge at the group level).
  *   **No:** → **Leaf: Individualist Naturalism** (Consciousness is strictly bound to individual biological organisms).

  ***

  ### Indistinguishable Leaves & Logical Gaps
  *   **Corticalism vs. Nociception-Only:** This tree separates Fish (Q3) and Lobsters (Q4), but in practice, these leaves often collapse. If you think fish don't feel pain due to lack of cortex, you likely think lobsters don't either. The tree treats them as separate steps, but they often signal the same underlying **Neo-Cortical Requirement** view.
  *   **The "Unnamed" Slot (AI Yes / Worm No):** The tree forces Functionalists (Q2 Yes) off early. However, a "High-Threshold Functionalist" (AI yes, Worm no) is logically possible but rarely defended. This slot is empty not because it's incoherent, but because functionalists usually embrace panpsychism or low thresholds to avoid biological chauvinism.

  ***

  ### Worked Example: "Neuroscientist Sarah"
  1.  **Q1:** She thinks consciousness is a real biological phenomenon. (**Yes** → Q2)
  2.  **Q2:** She thinks silicon can't feel, only biology can. (**No** → Q3)
  3.  **Q3:** She knows fish lack cortices but sees pain behavior. She grants they feel *something*. (**Yes** → Q4)
  4.  **Q4:** She accepts lobsters likely suffer too. (**Yes** → Q5)
  5.  **Q5:** She draws the line at 302 neurons; that's just a circuit. (**Yes** → **Leaf: Biological Threshold View**).
  *Result:* Sarah avoids arguing about AI or Ants. She knows her debate is about *where the light turns on* in the evolutionary chain, not *what the bulb is made of*.
