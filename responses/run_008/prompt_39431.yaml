answer: |-
  1. Anscombe argues Truman was a war criminal for *intentionally* targeting civilians, but she accepts the Doctrine of Double Effect, so she would permit bombing a bridge used by enemies even if nearby civilians foreseeably die, provided their deaths are not the means or end.
  2. While Anscombe was Catholic, she argues the prohibition against murder is accessible to natural reason rather than mere revealed morality, so secular philosophers cannot dismiss it solely as theological dogma without engaging her rational critique of consequentialism.
  3. Anscombe was not a strict pacifist but argued that modern total war inevitably involves the intentional killing of innocents, making contemporary wars unjustifiable rather than ruling out war in principle under all conditions.
  4. Her argument was that honoring Truman condones mass murder and corrupts moral language, not that he would drop more bombs personally, and the claim that nobody took it seriously is historical editorializing irrelevant to the philosophical validity of her protest.
  5. Asserting that consequentialist calculations refute her absolutism begs the question against her core premise that justice constrains utility, so labeling the pamphlet merely historical interest is partisan editorializing rather than neutral philosophical assessment.
