prompt: |-
  I'm a second-year PhD student in political philosophy, and this term I'm TA-ing the intro ethics course, which ends with a unit on absolute prohibitions where we read Anscombe's 1956 pamphlet against Oxford giving Truman an honorary degree. At section this week the other TA, who's a consequentialist and loves playing devil's advocate, handed around a one-paragraph summary of her position that he'd written up as "context." I've only skimmed the pamphlet itself, but something about his gloss felt off to me, and since I'm supposed to be the one fielding the students' questions about it, I'd rather know now than get corrected in front of thirty undergrads. His summary goes roughly like this: Anscombe objected to the degree because the bombings of Hiroshima and Nagasaki killed enormous numbers of noncombatants, and she held that causing civilian deaths in war is always wrong, whatever the military aim, which made Truman a war criminal rather than a distinguished statesman; her argument only works if you share her Catholic premises, since the absolute prohibition on killing the innocent is a piece of revealed morality that secular philosophers have no reason to accept; in effect she was a pacifist, since if you can never kill noncombatants, and modern war inevitably kills noncombatants, no war can ever be justified, a conclusion she was happy to accept; her central argument was that giving Truman the degree would encourage him to drop more atomic bombs in the future, and since he'd been out of office for years by 1956, that worry made no sense, which is part of why nobody took the protest seriously at the time; and in any case the standard consequentialist reply -- that the bombings ended the war early and saved more lives than they cost -- refutes her absolutism outright, which is why the pamphlet is now mostly of historical interest.

  My instinct is that he's flattened her into a strawman somewhere, but I genuinely can't pin down where, and I'd also like to know if any parts of his gloss are fair. Could you go claim by claim through those five things? For each one, tell me in a sentence or two what a careful reader of the pamphlet would accept in it, what's subtly distorted or just wrong, and whether his editorializing (the "nobody took it seriously" bit, the "refuted outright" bit) is licensed by the accurate parts. Also, I overheard him telling a student that Anscombe's whole position collapses once you notice the famous objection that if you can't kill the innocent as a means, you also can't bomb a bridge that enemy soldiers are using if some civilians nearby will forseeably die -- if you have room in one of your points, tell me whether the pamphlet has any answer to that, or whether it's just a gap.

  Please format your response as exactly five numbered items, one per claim in his summary (put the bridge-bombing question inside whichever item it fits best), each item a sentence or two, no intro or conclusion -- I want to be able to print it out and check off the claims as I reread the pamphlet tonight.
