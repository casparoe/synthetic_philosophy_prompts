  *(Refining the "Zero Evidence" point)*: If a text is *zero* evidence, then external evidence doesn't "promote" the legend; it replaces it. The legend remains fiction, but history finds a parallel event. The BIL's language ("promote a legend into history") implies the legend *contains* truth waiting to be unlocked. This contradicts the "zero evidence" claim. I need to highlight this internal contradiction.

  *(Refining the Troy/Exodus comparison)*: For Troy, we have *positive* material evidence (burnt layers) that is *consistent* with the legend. For Exodus, we have *negative* documentary evidence (silence) that is *inconsistent* with the legend. The BIL treats Consistency + Positive Material as Proof, but Inconsistency + Negative Document as Disproof. Is that fair? Positive evidence is generally stronger than negative evidence (silence). However, the *interpretation* of the positive evidence at Troy is loose (burnt city = Greek siege?), while the interpretation of negative evidence at Exodus is strict (no record = didn't happen). That's the inconsistency.

