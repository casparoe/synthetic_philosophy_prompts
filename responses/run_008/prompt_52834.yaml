      *   **Part 2: Consistency of the Rules.**
          *   Are they consistent? Mostly, but there's a tension. If a text is *zero* evidence, external evidence can't "promote" it; it would have to supersede it. The text acts as a *hypothesis generator*, not evidence itself.
          *   Rival Views Ruled Out: **Testimonial Optimism** (Hume's counter-view), **Traditionism** (oral history carries weight), **Bayesianism** (text updates probability, even without external proof).
      *   **Part 3: The Application (Troy vs. Exodus).**
          *   This is the crux. Is it fair?
          *   *The Asymmetry:* Positive evidence (Troy ruins) vs. Negative evidence (Egyptian silence).
          *   *Philosophical Problem:* **Argument from Silence**. When is silence loud?
          *   *Troy:* Archaeology confirms *a* destruction, not *the* Iliad's war. It's an inference to the best explanation, but weak.
