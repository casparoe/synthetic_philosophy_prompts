              *   *Iliad/Troy:* Tells us about Greeks, not the war. *However*, the war "probably happened" because of archaeology (Hissarlik, destruction layers).
              *   *Exodus:* Tells us about Israelites/Judahites, not the migration. *However*, the migration "basically didn't happen" because Egyptian records are silent.
      *   **User's Critique:** This feels "too clean." It looks like using *absence of evidence as evidence of absence* for Exodus but not applying the same skepticism to Troy (or vice versa).
      *   **User's Request:** Act as a *philosopher of history*.
          *   Identify the underlying theory of evidence.
          *   Check consistency between the two rules (Internal vs. External).
          *   Identify rival views ruled out by this practice.
          *   Assess if the application (Troy vs. Exodus) is fair or inconsistent.
          *   Brainstorm/think carefully before answering.

  2.  **Initial Philosophical Analysis (Brainstorming):**

      *   *Theory of Evidence:* This sounds like **Positivism** mixed with **Source Criticism** (specifically the Rankean ideal, though modified). It leans heavily on **Corroborationism**. A source doesn't count unless it's corroborated by an *independent* source of a specific type (material or foreign textual).
      *   *The "Zero Evidence" Claim:* This is a strong form of **Skepticism** regarding oral tradition or singular textual testimony. It treats testimony as guilty until proven innocent. This contrasts with a **Principle of Credulity** (testimony is innocent until proven guilty).
      *   *Consistency:* Are the rules consistent?
          *   Rule 1: Text = Culture, not Event.
          *   Rule 2: External Data = Event validation.
          *   *Tension:* If Rule 1 says "zero evidence," why does Rule 2 allow "promotion"? It implies the text *does* have some probabilistic weight, otherwise external evidence couldn't "promote" it; it would have to create the history from scratch. So there's a slight contradiction there.
      *   *Troy vs. Exodus:*
