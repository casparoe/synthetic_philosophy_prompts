  3.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the question. Validate the user's intuition (it *is* too clean).
      *   **Part 1: The Underlying Theory of Evidence.**
          *   Identify it: **Corroborative Positivism** or **Radical Source Skepticism**.
