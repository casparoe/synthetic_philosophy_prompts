          1.  *Internal Rule:* Legends are great evidence for the society that wrote/transmitted them (cultural window) but zero evidence for the events described (factual nullity).
          2.  *External Rule:* A legend becomes "history" only if promoted by external evidence (archaeology, independent documents).
