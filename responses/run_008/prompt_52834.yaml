answer: |-
  This is an excellent critique. Your intuition that the framework is "too clean" is philosophically sound. Your brother-in-law (BIL) is articulating a popularized version of **19th-century positivist historiography** mixed with **mid-20th-century source criticism**, but he is applying it with a level of rigidity that creates internal contradictions and evidentiary asymmetries.

  As a philosopher of history, I will break this down into the underlying epistemology, the consistency of his rules, the rival theories he excludes, and finally, the fairness of his application to Troy and the Exodus.

  ### 1. The Underlying Theory of Evidence

  Your BIL is operating under a specific epistemological framework regarding testimony and material culture. We can identify three core pillars:

  **A. Reductionism about Testimony**
  In the philosophy of testimony, there is a debate between *Anti-Reductionists* (who argue we have a default right to believe what we are told, akin to perception) and *Reductionists* (who argue testimony is only evidence if supported by independent, non-testimonial reasons).
  Your BIL is a **Radical Reductionist**. By claiming a legend is "zero evidence" for the events it describes, he is asserting that textual testimony has no intrinsic probabilistic weight. It is "guilty until proven innocent." This rejects the **Principle of Credulity** (that we should accept things as they appear unless we have specific reasons not to).

  **B. Material Privilege (The "Hard Data" Bias)**
  His method presupposes a hierarchy of evidence where material remains (archaeology) and "objective" administrative records (Egyptian ledgers) are ontologically superior to narrative tradition. This is a form of **Positivism**: the belief that "hard" data exists independently of interpretation, whereas narratives are inherently subjective constructs.
  *Philosophical Problem:* Archaeology is also a text. A destruction layer is silent; the historian interprets it as "war" rather than "earthquake" or "civil unrest." BIL treats archaeology as a "view from nowhere," ignoring that material evidence requires narrative framing to become historical evidence.

  **C. Corroborationism**
  His rule that legends need "promotion" by external sources is a **Corroborationist** theory of truth. A claim $P$ (there was a war) is not justified by Source $A$ (The Iliad) alone. It requires Source $B$ (Archaeology) to be of a different *type* to count. This assumes that different sources must be independent to be valid, which is sound, but it assumes that without Source $B$, Source $A$ contributes *nothing* to the probability of $P$, which is mathematically dubious.

  ### 2. Are the Two Rules Consistent?

  There is a significant tension between his "Window Rule" (legends tell us about the authors) and his "Promotion Rule" (external evidence makes them history).

  **The Contradiction:**
  If a legend is **zero evidence** for the events it describes, external evidence cannot "promote" the legend. It can only validate a *parallel* event.
  *   *Example:* If the *Iliad* is zero evidence for a war, then finding a burnt city at Troy doesn't make the *Iliad* true; it just means a city burnt. To say the war "probably happened in some form" implies the *Iliad* actually did provide a hypothesis that was then tested.
  *   *The Tension:* You cannot hold that a text has **zero** evidentiary value for events while simultaneously allowing it to be the **subject** of historical verification. If it were truly zero evidence, it would be fiction, and we wouldn't look for archaeology to "promote" it; we would just study the fiction.
  *   *Resolution:* A more consistent view would be **Bayesian**. The text provides a *prior probability* (it's not zero, but it's low). External evidence updates that probability. BIL's "zero to hero" binary is philosophically clunky.

  ### 3. Rival Views Ruled Out

  By adopting this framework, your BIL quietly rules out several sophisticated historical methodologies:

  1.  **Oral Tradition Theory:** Scholars like Jan Vansina argue that oral traditions (which underlie legends) follow specific laws of transmission and can preserve "kernels" of historical fact even without contemporary written records. BIL's view dismisses this entirely.
  2.  **Inference to the Best Explanation (IBE):** Sometimes, the legend *is* the best explanation for the data we have, even without external confirmation. If a culture has a specific, detailed memory of a migration that doesn't fit their current environment, the migration hypothesis might explain their cultural traits better than the "invented myth" hypothesis. BIL's rule forbids this inference unless an Egyptian scribe wrote it down first.
  3.  **Memory Studies:** Modern historiography often treats legends not as "false history" but as "social memory." The distinction between "what happened" and "what they remember happening" is porous. BIL enforces a hard wall between the two.

  ### 4. Is the Application (Troy vs. Exodus) Fair?

  This is where your intuition is strongest. Your BIL is applying the rules inconsistently. He is guilty of **Asymmetric Skepticism**.

  **The Troy Case (Positive Evidence + Ambiguous Interpretation)**
  *   **Evidence:** Archaeology shows a city (Hissarlik) at the right time/place with destruction layers.
  *   **Inference:** BIL infers "War probably happened."
  *   **Philosophical Flaw:** This is an **Argument from Consistency**. The archaeology is *consistent* with the legend, so he accepts the legend's core claim. However, destruction layers do not prove a siege by Greeks. It could be an earthquake, internal civil war, or raid by Sea Peoples. The archaeology does not confirm the *Iliad*; it confirms *violence*.
  *   **Standard:** He accepts **ambiguous positive evidence** as sufficient to validate the legend.

  **The Exodus Case (Negative Evidence + Ambiguous Silence)**
  *   **Evidence:** Egyptian records do not mention a mass migration or the plagues.
  *   **Inference:** BIL infers "It basically didn't happen."
  *   **Philosophical Flaw:** This is an **Argument from Silence**. He treats the absence of a record as a record of absence.
  *   **Standard:** He demands **definitive negative evidence** to invalidate the legend.

  **Why this is Inconsistent:**
  1.  **Nature of the Records:** Egyptian records were propaganda. They famously omitted defeats, losses, and embarrassing administrative failures. Silence in Egyptian records is "quiet" evidence, not "loud" evidence. Conversely, a destruction layer at Troy is "loud" evidence, but it is nonspecific.
  2.  **The Scale Problem:** BIL likely conflates the Biblical scale (600,000 men) with the historical possibility. If the Exodus was a small group of escaped slaves (which fits the silence in Egyptian records better), the legend could still be "promoted" by sociology/archaeology of early Israel. By demanding the *Biblical* Exodus be proven, he sets a bar for Exodus he does not set for Troy (he doesn't demand the *Iliad's* 1,000 ships be proven, just "a war").
  3.  **The Evidentiary Load:**
      *   For Troy, he allows: *Legend + Ruins = History.*
      *   For Exodus, he requires: *Legend + Silence = Fiction.*
      *   He should logically require: *Legend + Ruins = History* (for both) OR *Legend + Silence = Fiction* (for both).
      *   Since we have no ruins of a specific migration path for Exodus, and no written account of the specific Greek siege at Troy, the evidentiary status is actually quite similar (singular tradition + ambiguous material context).

  ### 5. Is the Practice Underdetermined?

  Yes. Several theories of evidence could license his *conclusions* without accepting his *rigid rules*.

  *   **Bayesianism:** A Bayesian historian might say: "The prior probability of a massive migration leaving no trace is low. The prior probability of a regional conflict in the Bronze Age Aegean is high." This justifies the different conclusions without needing a hard rule that "texts are zero evidence." It acknowledges that the *content* of the claim matters for its plausibility, not just the *type* of evidence.
  *   **Maximalism vs. Minimalism:** BIL is a **Minimalist** regarding the Exodus (assume it didn't happen until proven) but a **Maximalist** regarding Troy (assume the kernel is true if archaeology doesn't contradict it). A consistent Minimalist would say "Troy is just a story until we find a Linear B tablet mentioning Achilles." A consistent Maximalist would say "The Exodus likely reflects a historical memory of Hyksos expulsion or similar events."

  ### Conclusion

  Your brother-in-law is using a **folk-positivist** heuristic. It is a useful rule of thumb for beginners to prevent them from reading myths as news reports, but it fails as a rigorous philosophy of history.

  1.  **Theory:** He presupposes **Reductionism** (testimony needs non-testimonial support) and **Material Privilege** (dirt is truer than words).
  2.  **Consistency:** His rules are slightly inconsistent (you can't "promote" something that starts at "zero" value).
  3.  **Fairness:** His application is **unfair**. He accepts *consistent but ambiguous* material evidence for Troy (ruins $\neq$ siege) but rejects *ambiguous* documentary silence for Egypt (silence $\neq$ non-event).

  He is treating the **absence of evidence** as **evidence of absence** for the Exodus, while treating the **presence of ambiguous evidence** as **evidence of presence** for Troy. A philosophically consistent historian would either demand a contemporary written account for both (rejecting both as "history") or accept that both represent historical kernels amplified by tradition (accepting both as "probable in some form").

  You are right to feel it is "too clean." History is rarely binary; it is probabilistic. His method tries to force probabilities into true/false buckets, and in doing so, he tips the scales.
