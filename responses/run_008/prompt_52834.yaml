prompt: |-
  My brother-in-law is a big history podcast guy, and he was explaining to me how historians deal with legends. His version: a legend is great evidence for the society that wrote it down and basically zero evidence for the events it claims to describe, and the only thing that can promote a legend into history is something external to it -- archaeology, independent documents from other cultures. So the Iliad tells us a ton about the Greeks who composed and transmitted it but nothing about any war at Troy, and the Exodus story is really about the people who wrote it, not about any migration out of Egypt. But then he also said the Trojan War "probably happened in some form" because we have a real city in the right place and signs of destruction, while the Exodus "basically didn't happen" because Egyptian records are silent about it. Something about this feels too clean to me, like hes using absence of evidence as evidence of absence in one case and not noticing he's doing it.

  You're a philosopher of history, so think carefully and maybe brainstorm a bit before answering. What theory of evidence does this whole practice actually presuppose -- both the "window into the composers, not the events" rule and the "promotion by external evidence" rule? Are those two rules even consistent with each other? Which rival views about what testimony and transmitted tradition can carry does the practice quietly rule out, and is it underdetermined such that several theories of evidence would license it? And separately, is his actual application of the rules to Troy vs the Exodus fair, or is he applying them inconsistently?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **The Scenario:** The user's brother-in-law (BIL) is a history podcast enthusiast. He has a specific methodology for dealing with legends (myths, epics, religious narratives).
