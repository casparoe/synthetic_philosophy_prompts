      *   This contradicts their own definition of the Knobe Effect in the very next sentence ("This asymmetry is the Knobe effect..."). You can't have an asymmetry if both are judged intentional.
      *   This is a significant conceptual/empirical error.
      *   Grade: Probably a B- or C+ range. Let's say 75/100 or B-. The design is right, the philosophical moral is right, but the data description destroys the logic of the argument.

