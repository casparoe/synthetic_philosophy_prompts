      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm doing the user's job, but rather providing the "second pair of eyes" requested. I will provide the grade recommendation and the specific breakdown.

      *Specific check on Knobe & Burra:* Knobe & Burra (2007) "The Folk Concept of Intentional Action: A Cross-Cultural Study." They tested US and India. Found similar patterns.
      *Specific check on Universality:* Machery et al. (2004) "Semantics, Cross-Cultural Style." Found variation (some groups didn't show the effect as strongly). More recent meta-analyses suggest the effect is robust but *not* necessarily universal in the strong sense the student claims. The student's claim "safe to treat as a universal feature" is the weak point.

      *Specific check on Help Stat:* Knobe (2003) Study 1: Help case. 23% said Intentional. 77% said Not Intentional.
