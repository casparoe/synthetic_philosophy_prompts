      *Wait, one nuance:* The student says "only 23%... said the agent did *not* help... intentionally." In Knobe's paper, 23% said it *was* intentional. The student has flipped the predicate. This is a "hasty grader might let slide" item because the number 23% is iconic for Knobe, but the application is wrong. I need to make sure the user knows this is a factual error, not just phrasing.

