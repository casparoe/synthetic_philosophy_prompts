      *   Because the core empirical finding (the asymmetry) is described incorrectly in the Help condition (claiming symmetry instead of asymmetry), this undermines the main point of the question. However, they correctly identify the "Knobe Effect" as an asymmetry in the next sentence, showing they might know the concept but botched the stats description.
