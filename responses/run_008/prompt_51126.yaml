answer: |-
  # Who Belongs to the Demos?
  ### A Diagnostic Quiz for the Civics Discussion Group

  **Instructions:** Below are nine hypothetical scenarios involving a proposed vote. For each case, choose the option that best reflects your judgment on who should be allowed to cast a ballot. Do not worry about current law; answer based on what you believe *should* happen in a democracy.

  ***

  **1. The Long-Term Resident**
  Maria has lived in this city for 30 years. She pays income and property taxes and obeys all local laws, but she is not a U.S. citizen and cannot naturalize due to visa restrictions. A bond measure for new schools is on the ballot.
  *   **A.** Maria should vote. She is subject to the laws and funds the schools.
  *   **B.** Maria should not vote. Voting is a right of national citizenship, not residency.
  *   **C.** Maria should vote only on this specific tax measure, not on other issues.

  **2. The Working Teen**
  Leo is 16. He works full-time at a warehouse, files his own income tax returns, and supports himself. A minimum wage ordinance is on the ballot.
  *   **A.** Leo should vote. He is economically affected and contributes tax revenue.
  *   **B.** Leo should not vote. He lacks the maturity and life experience to decide.
  *   **C.** Leo should not vote now, but the voting age should be lowered to 16 for everyone.

  **3. The Ward of the State**
  Mrs. Gable is a 70-year-old citizen. Due to severe dementia, a court has placed her under full guardianship; she cannot understand the candidates or the issues. A zoning law is on the ballot.
  *   **A.** She should vote. Her citizenship right is absolute and cannot be revoked.
  *   **B.** She should not vote. Voting requires the capacity to form a rational political judgment.
  *   **C.** She should not vote personally, but her guardian should cast a ballot on her behalf.

  **4. The Cross-Border Refinery (The Seed Case)**
  A city votes to permit a refinery. The emissions will drift mostly over a neighboring state, affecting the health of residents there who do not live in the city.
  *   **A.** The downwind neighbors should vote. They are heavily affected by the outcome.
  *   **B.** The downwind neighbors should not vote. They do not live under the city's legal authority.
  *   **C.** The vote is valid as is. Democracy happens within borders; neighbors must lobby their own government.

  **5. The Foreign Factory**
  A manufacturing plant is owned by a corporation based in another country. A new environmental regulation on the ballot would halve the factory's property value. The factory employs local workers.
  *   **A.** The factory (via management) should vote. Its property rights are substantially affected.
  *   **B.** The factory should not vote. Only human beings can be members of the demos.
  *   **C.** The factory should not vote, but this regulation shouldn't be up for a simple majority vote.

  **6. The Future Generation**
  A climate referendum will lock in energy policy for 50 years. People not yet born will bear the greatest cost of carbon emissions.
  *   **A.** Future generations should have a vote, represented by appointed guardians.
  *   **B.** Future generations should not vote. You cannot represent people who do not exist.
  *   **C.** Future generations should not vote, but the current majority should be restricted from harming them.

  **7. The AI Consultant**
  The city government has begun using a language model to analyze ordinance text. The AI can file public comments explaining how a law impacts different groups. A proposal is made to give the AI a formal vote on the city council.
  *   **A.** The AI should vote. It processes information better than humans and is "affected" by its own deactivation.
  *   **B.** The AI should not vote. It is a tool, not a moral agent with interests.
  *   **C.** The AI should provide data, but only humans should make the final choice.

  **8. The Incarcerated Citizen**
  David is a citizen currently serving a two-year prison sentence for fraud. He is mentally competent. A state constitutional amendment is on the ballot.
  *   **A.** David should vote. He remains a citizen and is subject to the state's laws.
  *   **B.** David should not vote. Committing a crime demonstrates a lack of civic competence.
  *   **C.** David should not vote while imprisoned, but his rights are automatically restored upon release.

  **9. The Undocumented Worker**
  Elena has lived here for two years without legal documentation. She is stopped by police occasionally and must follow all city curfews and laws. A policing reform measure is on the ballot.
  *   **A.** Elena should vote. She is subjected to the police power of the city.
  *   **B.** Elena should not vote. She does not belong to the political community.
  *   **C.** Elena should not vote. Her presence is illegal, so she has no standing to challenge the laws.

  ***

  ## Scoring Key & Diagnostic Profiles

  Tally your answers. Do not look for a "correct" score. Look for the pattern that matches your choices.

  ### Profile 1: The Boundary Keeper (Membership View)
  *   **Primary Answers:** 1-B, 2-B, 3-A, 4-B, 5-B, 6-B, 7-B, 8-A, 9-B.
  *   **Diagnosis:** You believe the *demos* is a pre-existing group defined by belonging (usually citizenship). Democracy is the self-rule of a specific "people." Outsiders, even if affected, cannot intrude on the group's self-determination.
  *   **Blind Spot:** You may struggle to justify why a 30-year resident (Q1) has less say than a citizen who moved in last month.

  ### Profile 2: The Rule Follower (All-Subjected Principle)
  *   **Primary Answers:** 1-A, 2-A, 3-A, 4-B, 5-B, 6-B, 7-B, 8-A, 9-A.
  *   **Diagnosis:** You believe whoever must obey the laws should have a say in making them. Coercion creates the right to consent.
  *   **Blind Spot:** This view struggles with the Refinery Case (Q4). The downwind neighbors are affected but not legally subject to the city's laws. If you chose 4-B, you are consistent; if you chose 4-A, you are drifting toward "All-Affected."

  ### Profile 3: The Consequence Counter (All-Affected Principle)
  *   **Primary Answers:** 1-A, 2-A, 3-C (or A), 4-A, 5-A (or C), 6-A, 7-B, 8-A, 9-A.
  *   **Diagnosis:** You believe anyone significantly impacted by a decision should have a vote.
      *   **Bounded Affected:** You chose 4-B or 5-B but 4-A. You think impacts must be direct and substantial.
      *   **Unbounded Affected:** You chose 6-A. You are willing to extend representation to non-existent persons to account for impact.
  *   **Blind Spot:** If you answered 7-A (AI Vote), you hold a radical version of this view. If you answered 7-B, you believe "affect" requires human sentience.

  ### Profile 4: The Gatekeeper (Competence/Capacity View)
  *   **Primary Answers:** 1-B (or A), 2-B, 3-B, 4-B, 5-B, 6-B, 7-B, 8-B, 9-B.
  *   **Diagnosis:** **Hypothesis Confirmed.** You likely believe voting is a privilege earned by the ability to reason, not a right of residence or citizenship. You consistently exclude those you deem lacking capacity (teens, guardians, criminals).
  *   **Blind Spot:** This view risks excluding marginalized groups historically labeled "incompetent." It also struggles to define who sets the competence standard.

  ### Profile 5: The Pragmatist (Deflationist/Procedural View)
  *   **Primary Answers:** Mixed, often selecting options that defer to current law or compromise (e.g., 1-C, 3-C, 6-C, 8-C).
  *   **Diagnosis:** You suspect there is no perfect philosophical principle for the *demos*. Democracy is simply whatever stable procedure a community agrees to. You prefer workable compromises over pure theory.
  *   **Blind Spot:** This view can become circular ("They can't vote because the law says so," ignoring whether the law is democratic).

  ### Incoherent Combinations
  *   **The "Speciesist Capacity" Paradox:** If you voted **No** for the 16-year-old (Q2-B) based on competence, but **Yes** for the AI (Q7-A), your principle is inconsistent. You are prioritizing *processing power* over *human agency*, or you view the teen as less capable than the algorithm.
  *   **The "Time-Space" Glitch:** If you voted **Yes** for Future Generations (Q6-A) but **No** for Downwind Neighbors (Q4-B), you prioritize temporal impact over spatial impact. This is a rare, unexplored theoretical position that requires justification (e.g., "The future cannot lobby, but neighbors can").

  ***

  ## Critical Note for the Facilitator

  **1. Risk of Mis-sorting: Competence vs. Membership**
  This quiz is most likely to mis-sort "Competence Theorists" who disguise themselves as "Membership Theorists." A student might vote **No** on the 16-year-old (Q2) and **No** on the Guardian (Q3) not because they doubt the *capacity* of those voters, but because they believe citizenship laws *should* set age limits. To separate these, you would need a question where a citizen is competent but excluded by arbitrary law (e.g., "A 25-year-old citizen is barred from voting due to a literacy test they passed").

  **2. Indistinguishable Leaves: All-Subjected vs. Bounded All-Affected**
  In most domestic cases, the people "subject to the law" and the people "substantially affected" are the same group. This quiz cannot cleanly separate Profile 2 (Rule Follower) from Profile 3 (Bounded Consequence Counter) without the Refinery Case (Q4). Even then, a student might argue downwinders *are* subject to the laws of physics or interstate compacts. To truly separate these, you would need a case where someone is legally subject to a law but completely unaffected by it (e.g., a tax on a good they do not buy).

  **3. Contested Reading: The Deflationist**
  The scoring key treats the Deflationist (Profile 5) as a distinct philosophical position. However, many political scientists argue this isn't a theory of the *demos* at all, but an refusal to theorize. If a student selects mostly "C" options, they may not be deflationists; they may just be conflict-avoidant.

  **4. The Scope Dispute Evaluation**
  You asked me to set aside any case that is actually a dispute about *which decisions should be made collectively* rather than *who votes*. I evaluated the **Foreign Factory (Q5)** closely.
  *   *Judgment:* I retained it, but with caution. This case risks being a scope dispute in disguise. If a student answers "The factory should not vote, and this regulation shouldn't exist," they are arguing that property rights should be market-protected, not democratically decided.
  *   *Instruction Compliance:* I did not set it aside because you required it, but I flag it here: If a student argues the factory shouldn't vote because *property shouldn't be regulated by referendum*, they have exited the *demos* question and entered the *jurisdiction* question.
  *   *Recommendation:* If a classmate raises this objection during the debrief, validate it. It shows they are thinking about the *limits* of democracy, not just the *boundary* of the voter roll.

  **5. Testing the Competence Hypothesis**
  To test your suspicion that classmates are covert competence theorists, watch Q2 (16-year-old), Q3 (Guardianship), and Q8 (Felon).
  *   If they vote **No** on all three, they are strong Competence Theorists.
  *   If they vote **Yes** on Q8 (Felon) but **No** on Q3 (Guardianship), they distinguish between *moral* competence (crime) and *cognitive* competence.
  *   If they vote **Yes** on Q2 (16-year-old) but **No** on Q3 (Guardianship), they view age as a proxy for capacity, but accept that some adults lack capacity. This is the most common "soft competence" view.

  **6. Carving the Joint Wrong**
  If this taxonomy fails, it is likely because it treats "The People" as a static group. A new question would be needed to show the *demos* is fluid: *"A neighborhood votes to secede from the city and form its own town. Who decides if they can leave?"* If the city votes to stop them, the *demos* determines its own boundaries. If the neighborhood votes to leave, the *demos* is self-selecting. This "Right to Exit" case would challenge all five profiles above by suggesting the *demos* is voluntary, not territorial or legal.
