prompt: |-
  Context: my PhD advisor ends every conversation about quantum foundations the same way. Last week in group meeting I asked whether we should think of the many-body wavefunction as something that actually exists in configuration space or just as a tool for computing statistics, and he just gave me the usual "shut up and calculate" and moved on to the slides. It's clearly doing a lot of work as a one-liner, because he uses it for everything from "stop asking about the measurement problem during journal club" to something that sounds like a full-blown philosophy of physics position. My flatmate is a philosophy PhD student who got excited when I told her about this, and now she keeps asking me whether my advisor is an instrumentalist, a positivist, or just rude, and honestly I don't know. She also pointed me at the whole psi-ontic vs psi-epistemic way of framing the question -- whether the quantum state describes reality or our knowledge of reality -- which made me realize the slogan might secretly be taking a side in exactly that dispute, or might be compatible with both sides, or neither.

  So what I want is a menu. Spell out the different precise claims "shut up and calculate" could actually be expressing when someone like my advisor deploys it: the harmless methodological reading (in this room, with these experiments, stop procrastinating), the stronger reading that interpretation questions are meaningless because they're empirically underdetermined, the even stronger reading that there just is no further fact about whether the wavefunction is real, maybe an operationalist reading, maybe whatever QBism counts as. For each reading say whether it's a platitude, whether it's substantive and defensible, or whether it's just false, and importantly whether it would actually license dismissing my original question.

  The thing I keep circling: my flatmate mentioned there's supposedly a result -- I think from around 2012, PBR or something like that -- arguing that if you're a realist about quantum systems at all, you can't keep treating the quantum state as merely knowledge, which is roughly the psi-epistemic side of her distinction. I don't fully understand it and might be garbling it, but if it does what she says it does, then one of the readings of the slogan (the one where "the wavefunction is just a bookkeeping device" is treated as the safe, conservative option) might not actually be so safe -- it might be a substantive commitment that's under pressure, not an escape from commitment. So when you lay out the menu, flag which readings survive that kind of result and which ones don't, and tell me which reading my advisor most plausibly means when he uses it on a second-year like me at 9am. Also happy to be told I've misunderstood the PBR thing entirely, I only half-followed my flatmate's explanation over dinner.
reasoning: |-
