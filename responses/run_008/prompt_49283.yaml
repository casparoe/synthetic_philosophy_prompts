answer: |-
  1. He is a tyrant by oppression because he holds legal title through formal election, and although legitimacy is contested, Aquinas ties usurpation strictly to lacking legal title rather than moral legitimacy. This classification matters because Aquinas permits private action against usurpers but forbids it against oppressors, reserving judgment solely to public authority.

  2. It cannot hold the required public authority because Aquinas defines legitimate power as rooted in the specific community's common good, which a foreign state structurally cannot represent. This exclusion is categorical, even though applying his domestic framework to international actors requires extrapolation, because allowing foreign intervention would subordinate the polity's good to another's will.

  3. The strike is impermissible because the foreseen death of bystanders makes the act disproportionate, violating the requirement that the good effect outweigh the evil. Applying later Thomistic reasoning on double effect, Aquinas would argue that preserving the tyrant's life is preferable to violating justice through the certain death of bystanders.

  4. It is a rebuttable presumption, though his texts lean heavily toward caution, because prudence dictates action based on circumstances rather than universal prohibition. In a state with resilient institutions and a lawful successor, he would likely permit action because the risk of greater disorder is minimized.

  5. It turns on any group being denied its share, reading the common good as organic rather than utilitarian, because justice for all parts of the community is required. Therefore, he remains a tyrant liable to removal, since ruling for the benefit of the majority while crushing a minority is still rule for a private good rather than the true common good.
