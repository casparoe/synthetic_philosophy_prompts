      *   Part 2: Mapping to Conciliationism/Steadfastness/Pragmatism.
      *   Part 3: The Independence/Correlation Problem (Systematic vs. Random Error).
      *   Part 4: Redesigns (Deliberative vs. Weighted Expertise).
