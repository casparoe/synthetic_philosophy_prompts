answer: |-
  1. This practice presupposes that guilt is the productive moral emotion, signaling an internal recognition of wrongdoing and a commitment to future moral behavior. It assumes that private self-condemnation indicates a reduced risk of reoffending because the defendant's conscience is now engaged.
  2. Shaming punishments presuppose that shame is the effective lever for control, relying on external social judgment and the fear of public ostracization to deter future crimes. They operate on the belief that damaging a person's social standing will enforce conformity to community norms.
  3. These practices are in significant tension because guilt encourages reparative action while shame often triggers defensiveness, potentially undermining the rehabilitation sought by remorse discounts. The system simultaneously demands internal moral growth while inflicting external stigma that psychologically inhibits such growth.
  4. If shame were the only valid moral emotion, remorse discounts would vanish in favor of mandatory public penance, whereas if guilt were paramount, public registries would be abolished as psychologically counterproductive to reform. Consequently, adopting a single consistent theory would require abolishing the practice that relies on the rejected emotion.
  5. Remorse mitigation genuinely presupposes a theory of moral emotion by linking sentencing directly to the defendant's internal psychological state and capacity for guilt. Shaming punishments are better explained by non-moral factors like utilitarian deterrence or retributive expression, as they function regardless of the offender's actual emotional response.
