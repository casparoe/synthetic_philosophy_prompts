      *   Keep it empathetic to the engineer's position (stuck in the middle).
      *   Ensure the distinction between *Uncertainty* (randomness) and *Ambiguity* (lack of knowledge) is clear, as that's the core tension.

  5.  **Self-Correction/Review during drafting:**

