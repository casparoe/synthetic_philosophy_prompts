  I accept the policy, but I must correct your description of the justification, for it is there that your aggregation objection fails. Contractualism evaluates principles for the general regulation of behavior from the standpoint of each person subject to them, and when harms are probabilistic, that standpoint is necessarily *ex ante*, assessing the burden of the risk itself rather than the realized outcome. No individual can reasonably reject a principle that imposes a risk so negligible it is dwarfed by ordinary life in exchange for a genuine benefit they themselves receive, for to do so would be to demand a veto over social cooperation without bearing a significant burden. You claim this aggregates benefits to outweigh a death, but that misdescribes the moral comparison: we are not weighing one person's certain death against many people's small gains, but rather each person's tiny risk against their own small gain. The tragedy of the actual victim does not retroactively make the principle rejectable, because the justification is addressed to them as a participant in the scheme, not as a sacrificed means; the certainty that *someone* will die is a statistical fact, not a burden borne by any single contractor, and thus cannot form the basis of a reasonable rejection by any individual.
