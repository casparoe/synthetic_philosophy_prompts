answer: |-
  This is one of the most famous and philosophically fertile passages in the *Treatise*. Your paraphrase is excellent; it captures the core analogy and the trajectory of the argument without getting bogged down in 18th-century syntax. You have correctly identified the three crucial elements: the rejection of promise, the evolutionary/gradual nature of the rule, and the basis in mutual interest.

  Here is an analysis of the argument structure and its implications, addressing your three questions in order.

  ### 1. Convention vs. Promise: What does the work?

  You are right to suspect that Hume is arguing coordination does not require a "special normative act" (like a promise or contract). In fact, his point is stronger: **it cannot require one.**

  **The Circularity Problem**
  Hume is arguing against Social Contract theorists (like Hobbes and Locke). They claim that justice and political obligation are binding because we *promised* to obey them (the social contract). Hume points out a fatal circularity: Why is a promise binding?
  *   If you say "because it is rational," Hume says rationality alone cannot motivate action without a pre-existing desire.
  *   If you say "because there is a moral obligation to keep promises," Hume asks: Where does *that* obligation come from?
  *   Hume's answer: The obligation to keep promises *itself* arises from a convention based on utility. Society needs a way to bind future performance, so we invent the linguistic ritual of promising.

  Therefore, you cannot ground the convention of justice (property) on the convention of promising. That would be explaining the obscure by the more obscure. You need a foundation that is more basic than promising.

  **What "Convention" Means for Hume**
  For Hume, a convention is not an agreement in the sense of a meeting of minds or a verbal contract. It is a **coordination equilibrium reached through reciprocal expectations.**
  *   **The Mechanism:** It works through a feedback loop of self-interest and expectation.
      *   Rower A sees Rower B pulling.
      *   Rower A knows the boat won't move unless he also pulls.
      *   Rower A wants the boat to move.
      *   Rower A pulls, *expecting* Rower B to continue.
      *   Rower B reasons identically.
  *   **The "Glue":** Nothing normative binds them initially. It is purely prudential. However, once the pattern is established, a *sense of common interest* arises. Each knows the other knows the interest is common. This mutual awareness stabilizes the behavior.

  **Why the weight on "no promises"?**
  By emphasizing that the rowers never speak, Hume shows that **obligation can emerge from interaction alone.** The normativity (the "ought" of rowing in rhythm) emerges from the *utility* of the coordinated action and the *disutility* of the uncoordinated alternative. He is naturalizing normativity: rules arise from human psychology and circumstances, not from a rationalist duty or a speech act.

  ### 2. The Role of Gradualness: Historical or Philosophical?

  The "slow progression" is not merely a historical claim (though Hume believes it is historically true); it is **conceptually essential** to his distinction between *Natural* and *Artificial* virtues.

  **Natural vs. Artificial**
  *   **Natural Virtues (e.g., Benevolence):** These are immediate. I see a child in danger; I feel concern and help. No system is required.
  *   **Artificial Virtues (e.g., Justice):** These require a *system*. You cannot be "just" in isolation. Justice only makes sense if there is a stable rule of possession that everyone follows.

  **Why Gradualness Matters**
  1.  **Proof of Artificiality:** If justice were natural, it would be universal and immediate (like parental love). The fact that it must be *learned* and *cultivated* over time through trial and error proves it is a remedy for a problem (scarce resources + limited generosity), not an innate impulse.
  2.  **The Birth of Moral Sentiment:** This is the most critical philosophical point. Initially, respecting property is just **prudence** (I don't steal your cow because you might hit me, or because I want you to respect mine).
      *   Through the "slow progression," this prudential rule becomes habitual.
      *   Once habitual, we observe the *benefits* of the system to society.
      *   Via **sympathy** (Hume's mechanism for sharing feelings), we feel pleasure when we see the social order maintained.
      *   That pleasure transforms into **moral approval**.
      *   *Result:* What started as "it is useful for me to respect property" becomes "it is *virtuous* to respect property."

  If the rule arose instantly, there would be no time for this psychological transformation from self-interest to moral sentiment. The gradualness allows the *utility* of the convention to be translated into *morality*.

  ### 3. Collective Intentionality and Joint Action

  This is where Hume is surprisingly modern, yet distinct from contemporary "We-intention" theorists.

  **Hume's Account: Reductionist Coordination**
  Hume's rowers are the ancestors of **David Lewis's** account of *Convention* (1969). Lewis explicitly draws on this Humean passage.
  *   **Structure:** Each agent has an "I-intention." ("I intend to row *on the condition that* you row.")
  *   **Common Knowledge:** It becomes common knowledge that we both have this conditional intention.
  *   **Joint Action?** For Hume (and Lewis), this *is* joint action. It is fully reducible to individual intentions plus mutual expectations.

  **Contemporary Theorists (Searle, Bratman, Gilbert)**
  Many contemporary theorists would argue Hume's account is insufficient for *genuine* joint action.
  *   **John Searle:** Argues for primitive "We-intentions." For Searle, Hume's rowers are merely "coordinating individual agents." True joint action requires that I intend *our* action, not just my action conditional on yours. Searle would say Hume misses the collective commitment.
  *   **Michael Bratman:** Requires a "commitment to the joint activity" itself, not just meshing sub-plans. Hume's rowers are committed to *their own* goal (moving the boat) which happens to align. Bratman might classify this as "cooperative action" but perhaps not full "shared intentionality" unless they explicitly share the goal *as a pair*.
  *   **Margaret Gilbert:** Would argue they lack a "joint commitment." Without a mutual obligation created by a joint commitment, they are just two people happening to row together. If one stops, the other has no standing to complain, only to be disappointed.

  **Does Hume's account fit?**
  *   **Strict "We-Attitude" Theorists:** No. They would view the rowing case as a limiting case of coordination, not paradigmatic joint action. They argue you can't get a "We" from a pile of "I's."
  *   **Hume's Defense:** Hume would likely reply that the "We-attitude" is a philosophical fiction. The *phenomenology* of joint action is fully explained by the recursive loop of expectations and interests. To posit a mysterious "collective mind" or irreducible "We-intention" is unnecessary metaphysics.

  **Relevance to Justice:**
  This maps perfectly onto the justice debate.
  *   **Contractarians (like Rawls or Kantians):** Often rely on a form of shared commitment or hypothetical agreement (closer to Bratman/Gilbert).
  *   **Humeans:** Justice is a stable equilibrium of individual interests. We don't need to believe in a "Social Contract" (a joint commitment); we just need to know that everyone else finds it in their interest to follow the rules, and we know they know we know that.

  ### Feedback on Your Paraphrase and Framing

  Your framing is very strong. You have correctly identified that Hume is replacing a **normative foundation** (promise/contract) with a **psychological/sociological mechanism** (convention/expectation).

  **Two minor nuances to consider:**

  1.  **"Agreement" vs. "Convention":** In your paraphrase, you write: *"coordinate by an agreement or convention."* Hume is actually quite careful to distinguish these. He often warns against calling it an "agreement" if that implies a promise. He prefers "convention" (in the French sense of *convenir*, to come together/fit) to emphasize the *convergence of behavior* rather than a *meeting of minds*. You might sharpen this by noting that for Hume, the convention *is* the coordination, not the cause of it.
  2.  **The Role of Imagination:** You mention people "come to see that it serves their mutual interest." Hume adds a layer here: the **imagination**. Because the progression is slow, our imagination smooths over the gaps. We begin to treat the *rule* as sacred, even in cases where following it might not be immediately useful. This "fiction" of the rule is what stabilizes property when immediate utility fluctuates.

  **Summary of the Argument Structure:**
  1.  **Problem:** Justice (property) is necessary for society, but cannot be grounded in natural virtue (we aren't naturally just) or promise (promises presuppose justice).
  2.  **Solution:** It arises from a **Convention**.
  3.  **Mechanism:** Like rowers, we coordinate via reciprocal expectations of self-interest, not speech acts.
  4.  **Process:** This happens gradually. Prudence becomes habit; habit + sympathy becomes moral sentiment.
  5.  **Conclusion:** Justice is an **Artificial Virtue**: constructed by human interaction to solve a coordination problem, but felt as a natural moral duty once established.

  Your intuition that this connects to collective intentionality is spot-on. Hume provides the classic **reductionist** account of social norms: society is not an organism, but a system of coordinated individuals. Whether that counts as "true" joint action depends on whether you think "We" is more than the sum of "I's." Hume famously thinks it is not.
