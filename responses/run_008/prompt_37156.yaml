      *   **Problem:** Struggling to reconcile intuitive moral verdicts on discounting the future. They have a set of specific cases with gut judgments but lack a unifying principle.
      *   **Input:** Five specific verdicts/cases.
          1.  Personal finance ($100 now vs. $115 later): Acceptable to discount.
          2.  Personal health (smoking): Acceptable to discount own future self.
          3.  Government policy (100 lives now vs. 250 lives in 2100): Gut says save lives now, but feels conflicted.
          4.  Moral worth (Child 2100 vs. Child next year): Absolutely equal worth (no pure time preference).
          5.  Intergenerational equity (Tax cut now vs. Famine in 150 years): Discounting feels monstrous.
      *   **Tension:** Self-discounting (1 & 2) vs. Other-discounting (4 & 5). Case 3 is the pivot point (urgency vs. equality). Worry about "tyranny of the future" (scrimping for rich descendants).
      *   **Task:** Extract a principle (or rival candidates) that explains *when* discounting is legitimate vs. illegitimate. Address the self/other split. Evaluate the user's verdicts (confirm or overturn). Apply to new cases (scrimping for 2300, boundary case). Identify tie-breakers.
      *   **Tone:** Intellectual, precise, nuanced, respectful of the writer's craft (needs something "story-ready").

  2.  **Deconstruct the Verdicts:**
      *   *Verdict 1 & 2 (Self):* Pure Time Preference (PTP) is allowed for the *agent* regarding their *own* utility/resources. Why? Autonomy, risk of death, changing preferences, opportunity cost.
      *   *Verdict 4 & 5 (Others/Posterity):* PTP is forbidden across *persons*. Why? Discrimination based on birth date is arbitrary (Ramsey/Parfit argument).
      *   *Verdict 3 (The Conflict):* 100 lives now vs. 250 later. User picks "now." Why? Not because later lives matter *less*, but because of *uncertainty*, *capacity to act*, or *urgency/suffering intensity*.
      *   *The "Scrimping" Worry:* If discount rate = 0, we owe everything to the future. This suggests a need for a "sufficientarian" or "diminishing marginal utility" constraint.

  3.  **Develop Candidate Principles:**

      *   *Candidate A: The "Identity & Agency" Principle.*
          *   Distinction: Discounting is permissible regarding *your own* utility (autonomy), but impermissible regarding *others'* fundamental rights/welfare (equality).
          *   Mechanism: Pure Time Preference (PTP) is subjective for the self, objective injustice for others.
          *   Handling Case 3: The choice for "now" isn't about value of life, but about *probability* and *agency*. We can save the 100 for sure; the 250 are probabilistic.
          *   Handling Scrimping: Diminishing marginal utility. If future people are richer, $1 helps them less than $1 helps us.

      *   *Candidate B: The "Uncertainty & Capacity" Principle (Descriptive/Pragmatic).*
          *   Distinction: We discount based on risk of non-existence and ability to intervene, not intrinsic worth.
          *   Mechanism: Discount rate = Risk + Opportunity Cost, *not* Time Preference.
          *   Handling Case 3: The 250 lives are less certain (technology might solve it, or catastrophe might wipe us out).
          *   Handling Case 5: Famine is catastrophic (non-linear utility), so uncertainty doesn't justify ignoring it.

      *   *Candidate C: The "Sufficientarian Threshold" Principle.*
          *   Distinction: Discounting is okay above a threshold of well-being, forbidden below it.
          *   Mechanism: Basic rights (life, safety) cannot be discounted; luxury/consumption can be.
          *   Handling Case 1: $100 is consumption.
          *   Handling Case 5: Famine is below threshold.

      *   *Selection:* Candidate A (Rights/Agency) combined with elements of C (Thresholds) seems most robust for a moral philosopher/economist audience. Let's refine it into a specific framework: **"The Sovereignty/Solidarity Split."**

  4.  **Drafting the Principle:**
      *   *Name:* The Sovereignty/Solidarity Distinction (or "Agency vs. Claim").
      *   *Core:* You have sovereignty over your own trade-offs (including time), but you lack sovereignty over others' fundamental claims.
      *   *Refinement on Case 3:* It's not that future lives are worth less. It's that *certainty* and *marginal utility* differ. Or, use the "Identifiable Victim Effect" but justify it via *capacity to rescue*.
      *   *Refinement on Scrimping:* Use *Diminishing Marginal Utility*. If 2300 people are richer, transferring wealth to them yields less total welfare.

  5.  **Addressing Specific User Concerns:**
      *   *Case 3 (100 vs 250 lives):* This is the hardest. If lives are equal, 250 > 100. To save the user's verdict, we must introduce *uncertainty* or *discounting of probability* rather than *discounting of value*. Or, we argue that "saving" implies preventing *imminent* harm vs. *potential* harm. Let's go with **Risk-Adjusted Value**. The 2100 lives are contingent on many variables; the 100 now are contingent on fewer.
      *   *Case 4 (Equal Worth):* Uphold this. It's the moral anchor.
      *   *Case 5 (Famine):* Uphold this. Catastrophic harm trumps marginal consumption.
      *   *The Scrimping Objection:* Address via Diminishing Marginal Utility of Consumption.

  6.  **Developing the Boundary Cases:**
      *   *Case 6 (Scrimping for 2300):* Apply the principle. If 2300 people are richer, we shouldn't starve now to make them richer. Principle holds.
      *   *Case 7 (Boundary Test):* *The Ulysses Pact.* A young person binding their old self (e.g., locking away savings for retirement).
          *   *Test:* Is this Sovereignty (self-binding) or Violation (ignoring future self's needs)?
          *   *Resolution:* Permissible if it protects the future self's *agency* (preventing addiction/impulse), impermissible if it imposes arbitrary hardship.
          *   *Alternative Boundary:* A community voting to deplete resources for themselves, leaving descendants with nothing. This tests the "Other" line.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the problem (Ramsey, Parfit, Stern vs. Nordhaus).
      *   **The Proposed Principle:** "The Sovereignty of Consumption vs. The Solidarity of Rights."
      *   **Application to User's Cases:** Go 1-5. Explicitly state which are kept and which are modified (Case 3 needs the "Uncertainty" tweak).
      *   **The "Scrimping" Objection:** Solve with Diminishing Marginal Utility.
      *   **New Cases:**
          1.  The Rich Descendant (Scrimping).
          2.  The Boundary Case: *The Trust Fund vs. The Burning Village.* (A community choosing immediate comfort over long-term habitability).
      *   **Tie-Breaker:** If principles clash, look at *Reversibility* and *Catastrophe*.
      *   **Conclusion:** A writer-friendly summary.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the Self/Other split arbitrary?
      *   *Defense:* No, it's based on *consent* and *representation*. I can consent to harm myself; I cannot consent to harm you. Future people cannot consent to be harmed by us.
      *   *Critique:* Case 3 is still shaky. If I say lives are equal, why save 100 now?
      *   *Defense:* Distinguish between *Pure Time Preference* (value declines with time) and *Probability Discounting* (value declines with uncertainty). The user's gut in Case 3 is likely reacting to *identifiability* and *certainty*, not intrinsic worth. I need to be firm here: If the 250 lives are *guaranteed*, the user's verdict is morally wrong. I must tell them this.
      *   *Wait, check prompt:* "Tell me... which it has to overturn — I suspect case 3 goes." Okay, I have permission to overturn Case 3 if necessary, but I should try to save it via uncertainty first.
      *   *Decision:* I will argue Case 3 is only defensible if the 250 lives are *uncertain*. If guaranteed, the verdict is wrong. This clarifies the principle.

  9.  **Final Polish:** Ensure the tone is collaborative but authoritative. Use economic/philosophical terms correctly (Pure Time Preference, Diminishing Marginal Utility, Identifiable Victim Effect) but explain them for a general audience.

  **(Self-Correction on Case 7):** The prompt asks for a boundary case testing the self/other split.
  *   *Idea:* A person making an irrevocable choice for their older self.
