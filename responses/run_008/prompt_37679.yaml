  1. What is the widest plausible range of probabilities given credible sources? Accept the union of credible estimates as your answer (2%-20% for the control, engineers' min-max for the release), owning this as a judgement call on expert credibility since the theory merely structures input rather than validating it.

  2. What probability makes the cost equal to the expected loss? Accept the break-even calculation (£80k/breach cost for the control, delay cost/bug impact for the release) as your answer, owning this as a judgement call on valuing intangible losses because the theory cannot assign monetary value to reputation.

  3. Does your probability interval sit entirely above or below this break-even threshold? Accept a clear separation as a decisive answer (non-overlapping for the control's 2%-20% or the release's likelihood range), noting this is not a judgement call but a mathematical check where the theory settles the decision if no overlap exists.

  4. Which decision rule matches your risk appetite: pessimistic (Γ-maximin) or optimistic (maximax)? Accept your chosen rule as the answer (justify 20% worst-case for the control or block any failure chance for the release), owning this as a genuine judgement call because the theory requires you to select the risk posture externally.

  5. Will new data narrow this interval or expose more disagreement? Accept that ambiguity may increase (a third vendor widening the control's spread or testing revealing release failure modes) as a sufficient answer, owning this as a judgement call on when to stop analyzing since the theory warns that information can widen your probability set.
