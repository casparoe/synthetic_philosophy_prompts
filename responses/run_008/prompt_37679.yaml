prompt: |-
  I do risk stuff for a mid-sized fintech — I'm basically the person who has to say yes or no to security spend and launch decisions, a couple of calls a week, and my boss wants a paper trail for each one. The problem is our inputs are a mess: for any given risk, one consultant gives us a probability like 20%, another says 2%, and our own engineer's gut is somwhere else again, and nobody can tell me whose number to trust. I've been told the standard move is to average the estimates, but that feels made up, like we're manufacturing precision nobody actually has. I recently came across the idea of imprecise probabilities — treating your credence as a whole set or interval of numbers instead of one point value, with decision rules like Γ-maximin, minimax regret, E-admissibility and maximality for choosing under that kind of vagueness — and it seems to describe our exact situation, but everything I can find on it is super technical and I can't tell what it actually commits you to.

  So: please turn whatever this theory actually says into a procedure I can run in ten minutes, with no maths, before a deadline. Give me exactly five numbered questions to ask in order — each item one or two sentences, covering the question itself, what counts as a sufficient answer, and whether that step is a genuine judgement call I have to own rather than something the theory settles — and nothing else, no intro or wrap-up. Within each item, also say how it plays out on our two live cases: whether to spend £80k on an extra security control where the two estimates of the relevant breach risk are 20% and 2%, and whether to delay a release where everyone agrees on how bad the bug would be but not on how likely it is to fire. Please be honest about where the procedure will misfire — I gather that in this framework collecting more information can sometimes make your set of probabilities wider instead of narrower, which sounds like it could quietly break my usual 'go get more data' fallback, and I'd rather know that up front than recieve a nice-looking checklist that falls apart the first time a vendor sends us a third estimate.
