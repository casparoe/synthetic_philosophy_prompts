prompt: |-
  I'm on the grantmaking committee of a mid-sized foundation that funds work on global catastrophic risks — asteroid detection, engineered-pandemic prep, that sort of thing — and we have an application in front of us that's turned into a genuine philosophical mess. $2.5M over three years for a program targeting very-low-probability, very-high-stakes scenarios. Their case rests on an expected-value model that enumerates scenarios of ever-smaller probability and ever-larger stakes, and here's the problem: the sign of the payoff flips across branches. Some branches the intervention averts catastrophe, other branches it backfires — raising the profile of a bio-risk and inspiring copycats, hardening the exact infrastructure it meant to make resilient, etc. Summed in the order they present it, the EV comes out as a big positive number. One of our analysts re-sorted the scenario table by decreasing probability and the sum flipped negative; another lumped all the backfire scenarios first and got something near zero. So the model is basically a Pasadena game — if you know that one, it's St. Petersburg except the payoffs alternate in sign, and by the rearrangement theorem for conditionally convergent series you can make the "expected value" come out to literally anything you like just by reordering the terms. Credit where due, the applicant's appendix is quite candid that the ordering choice is doing all the work.

  The committee has split into two camps. One wants a standing rule: any application whose EV calculation isn't absolutely convergent — i.e., where reordering the scenarios can change the answer — is automatically ineligible. Clean, principled, and it kills this one. The other camp thinks that rule is just an excuse to defund all tail-risk work, since nearly everything we fund looks like this to some degree (the backfire scenarios are harder to see in most applications, not absent), and besides, refusing to decide is itself a decision, and arguably the one with the worst expected value of all. Our bylaws say grants must be justified by "a defensible assessment of expected impact," which is doing a truly heroic amount of load-bearing work here.

  Please draft the decision memo I'll circulate before thursday's meeting — approve, reject, or approve with conditions — with a concrete bottom line and criteria the committee could actually apply to similar applications in future funding cycles, not just a guided tour of the paradox. I want the strongest point of whichever side loses engaged seriously rather than dismissed, and if your honest view is that expected value just doesn't settle cases shaped like this and we need a different decision procedure for them entirely (e.g. something about thresholds, dominance, or how to handle decision-relevant but order-dependent sums), then say that and spell out what the alternative rule would be.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Grantmaking committee member at a mid-sized foundation focusing on global catastrophic risks (GCR).
      *   **Task:** Draft a decision memo for the committee to circulate before Thursday's meeting.
      *   **Subject:** A specific grant application ($2.5M/3 years) involving low-probability, high-stakes scenarios where the Expected Value (EV) calculation is mathematically unstable (Pasadena game/conditionally convergent series).
      *   **Conflict:** Committee split. Camp A wants a hard rule against non-absolutely convergent EVs (rejects this app). Camp B thinks this rules out too much tail-risk work and indecision is costly.
      *   **Constraints:**
          *   Must have a concrete bottom line (Approve, Reject, or Approve with Conditions).
          *   Must provide criteria for future applications (not just theory).
          *   Must engage seriously with the losing side's strongest point.
          *   Must address the "defensible assessment of expected impact" bylaw requirement.
          *   If EV is insufficient, propose an alternative decision procedure (thresholds, dominance, etc.).
      *   **Tone:** Professional, decisive, philosophically rigorous but practical, suitable for internal foundation governance.

  2.  **Deconstruct the Problem:**
      *   **The Math:** The applicant admits their EV sum is conditionally convergent (Riemann Rearrangement Theorem applies). This means the EV is undefined mathematically until an ordering is imposed. The applicant's ordering is arbitrary.
      *   **The Policy:** The bylaws require a "defensible assessment of expected impact." An undefined mathematical expectation is arguably *not* defensible.
      *   **The Risk:** Rejecting based on this rule might stifle innovation in GCR (Camp B's point). Approving based on arbitrary ordering sets a bad precedent and risks funding harmful interventions (Camp A's point).
      *   **The Solution:** We cannot rely on raw EV sums here. We need a decision procedure that handles deep uncertainty and model instability. "Reject" is the safest legal/fiduciary path, but "Approve with Conditions" (specifically regarding methodology) might be more constructive if the work is valuable despite the math. However, given the *admission* that the math is doing "all the work," funding it as-is is irresponsible.
      *   **Decision:** **Reject** the application *in its current form*, but establish a **new framework** for future tail-risk assessments that doesn't rely on unstable EV sums. This satisfies Camp A's need for rigor and Camp B's need for a path forward for tail-risk work. It upholds the bylaws by redefining "defensible assessment."

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** State the decision clearly immediately. (Reject current app, adopt new framework).
      *   **Context:** Briefly summarize the application and the mathematical issue (Pasadena game/conditional convergence).
      *   **Analysis of the EV Problem:** Explain *why* the current EV is indefensible under the bylaws. It's not just "uncertain," it's mathematically undefined without arbitrary choices.
      *   **Engaging the Counter-Argument (Camp B):** Acknowledge that strict EV convergence rules could paralyze GCR funding. Many good interventions look risky. The "indecision is a decision" point is valid.
      *   **The Proposed Framework (The "Alternative Decision Procedure"):** Since EV fails, what do we use?
          *   *Robustness/Sensitivity:* Does the intervention look good across *multiple* plausible orderings?
          *   *Dominance:* Is there a scenario where it's strictly worse than the status quo with non-negligible probability?
          *   *Cap on Tail Weight:* Limit the influence of scenarios below a certain probability threshold unless evidence is overwhelming.
          *   *Process:* Require "Adversarial Collaboration" on model structure.
      *   **Application to Current Case:** Why does this app fail the new framework? (They admitted the sign flips based on ordering; no robustness).
      *   **Future Criteria:** Concrete checklist for future cycles.
      *   **Conclusion:** Reiterate commitment to the mission while ensuring fiduciary responsibility.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Reject" too harsh?
      *   *Correction:* If I say "Approve with Conditions," it implies the current EV model is salvageable. The prompt says the ordering choice is doing *all* the work. That's fatal. A "Reject" with a path to reapply under new rules is better. It protects the foundation from liability while keeping the door open for better modeling.
      *   *Critique:* Am I ignoring Camp B enough?
      *   *Correction:* I need to explicitly validate their fear that this becomes a "no tail-risk" policy. The new framework must explicitly allow for tail-risk, just not *mathematically undefined* tail-risk. I should emphasize that "undefined EV" $\neq$ "high uncertainty."
      *   *Tone Check:* Ensure it doesn't sound like a math lecture. It needs to sound like governance. Use terms like "fiduciary duty," "defensibility," "decision hygiene."

  5.  **Finalizing the Framework:**
      *   What replaces EV?
      *   1. **Convergence Requirement:** Absolute convergence is the gold standard.
      *   2. **Robustness Check:** If not absolutely convergent, does the decision hold across *plausible* orderings (not just mathematically possible ones)?
      *   3. **Downside Caps:** Hard limits on exposure to specific backfire scenarios.
      *   4. **Epistemic Humility:** Discounting factors for model uncertainty.

  6.  **Writing the Memo:** (Iterative process focusing on clarity and authority).
      *   *Subject Line:* Needs to be specific.
      *   *Recommendation:* Reject current, Adopt Policy.
      *   *Reasoning:* The bylaw "defensible assessment" cannot be met by a mathematically undefined sum.
      *   *Counter-argument:* Address the "paralysis" concern.
      *   *New Policy:* The "Robust Decision Framework."

  7.  **Final Review against Prompt:**
      *   Concrete bottom line? Yes (Reject + New Policy).
      *   Criteria for future? Yes (Robust Decision Framework).
      *   Engage losing side? Yes (Camp B's concern about paralysis).
      *   Alternative procedure? Yes (Robustness/Dominance over raw EV).
      *   Tone? Professional memo.

  8.  *(Self-Correction on "Pasadena Game" reference)*: Keep the reference but explain it briefly in context so non-math committee members get the gravity without needing a textbook. It's a known paradox in decision theory, so using the term signals rigor.

  9.  *(Final Polish)*: Ensure the distinction between "uncertainty" and "undefined expectation" is sharp. That's the key to satisfying the bylaws.

  **(Drafting the content based on these thoughts...)**
answer: |-
  **MEMORANDUM**

  **TO:** Grantmaking Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Recommendation: [Applicant Name] & Framework for Tail-Risk Modeling

  ### **Executive Summary & Bottom Line**

  **Recommendation:** **Reject** the current application from [Applicant Name] in its present form, but **Adopt** a new "Robust Decision Framework" for evaluating high-uncertainty, tail-risk proposals in future cycles.

  **Rationale:** The applicant's expected value (EV) model is mathematically undefined (a conditionally convergent series). Under our bylaws, which require a "defensible assessment of expected impact," we cannot justify a $2.5M grant where the sign of the expected outcome depends entirely on the arbitrary ordering of scenarios. However, rejecting this application on the grounds of "EV instability" must not become a precedent for rejecting all tail-risk work. To address the valid concerns of the committee regarding funding paralysis, we must replace raw EV summation with a robustness-based decision procedure for cases involving deep uncertainty.

  ---

  ### **1. The Mathematical & Fiduciary Problem**

  The applicant's model presents a classic "Pasadena Game" structure. As noted in their appendix, the series of probability-weighted outcomes is conditionally convergent. By the Riemann Rearrangement Theorem, the sum of this series can be manipulated to yield any finite value, positive or negative, simply by reordering the terms.

  The applicant has candidly admitted that the ordering choice is the primary driver of the positive result. This creates a fiduciary conflict:
  *   **Bylaw Compliance:** Our bylaws mandate a "defensible assessment." An assessment that yields +$500M or -$500M depending on which row of a spreadsheet is calculated first is not defensible. It is mathematically indeterminate.
  *   **Risk Exposure:** Funding an intervention where the "backfire" scenarios are mathematically equivalent in weight to the "success" scenarios, but are suppressed via ordering, violates our duty of care. We cannot treat an arbitrary modeling choice as evidence of benefit.

  Therefore, the current application fails the basic threshold of evaluability. We cannot approve a grant where the justification admits to being order-dependent.

  ### **2. Engaging the Counter-Argument: The Risk of Paralysis**

  The strongest argument against a hard "absolute convergence" rule comes from Camp B: **Strict mathematical convergence requirements may effectively ban all global catastrophic risk (GCR) work.**

  This point is well-taken. In GCR, probabilities are often opaque, and "backfire" scenarios (e.g., infohazards, security dilemmas) are inherent to the domain. If we demand standard statistical convergence, we privilege incremental, measurable interventions over the high-leverage work our mission requires. Furthermore, refusing to fund because the math is messy is itself a decision with potential negative expected value—if the intervention *is* net positive, our inaction contributes to the risk we aim to reduce.

  We must not conflate **epistemic uncertainty** (we don't know the probabilities) with **mathematical undefinedness** (the calculation has no unique solution). The former is inherent to our mission; the latter is a modeling failure. The applicant's error was not in tackling a hard problem, but in presenting an undefined sum as a definitive justification.

  ### **3. Proposed Policy: The Robust Decision Framework**

  To resolve the committee split and ensure future cycles can fund tail-risk work without violating our bylaws, I propose we adopt the following decision criteria for applications where EV calculations are unstable or highly sensitive to modeling assumptions.

  **A. The Convergence Standard (Primary)**
  *   **Rule:** EV calculations must be absolutely convergent. If the sum of the absolute values of the outcomes diverges, the EV is treated as undefined.
  *   **Exception:** If absolute convergence is impossible due to the nature of the risk (e.g., unbounded stakes), the applicant must proceed to Criteria B and C.

  **B. Robustness Across Plausible Orderings (Secondary)**
  *   **Rule:** For conditionally convergent models, the recommendation must hold across a *range* of plausible orderings, not just the applicant's preferred sequence.
  *   **Test:** We will apply "Adversarial Ordering." If reordering scenarios by decreasing probability, decreasing magnitude, or grouping by risk-type flips the sign of the EV, the proposal is ineligible.
  *   **Threshold:** A proposal is only defensible if >80% of plausible ordering methods yield a positive expected impact.

  **C. Downside Dominance & Caps (Tertiary)**
  *   **Rule:** No grant will be approved if a specific, plausible "backfire" scenario carries a negative impact that exceeds the foundation's risk tolerance, regardless of its probability.
  *   **Mechanism:** We will apply a "Risk Cap." If the intervention creates a non-negligible probability (e.g., >1%) of making the catastrophic risk *worse* (e.g., by highlighting vulnerabilities without fixing them), the grant is rejected unless mitigation is guaranteed.
  *   **Rationale:** This moves us from *maximizing EV* to *satisficing with safety constraints.* In tail-risk domains, avoiding ruin dominates optimizing gain.

  **D. Epistemic Discounting**
  *   **Rule:** Model outputs must be discounted by a factor corresponding to the uncertainty of the inputs.
  *   **Mechanism:** If probability estimates rely on expert elicitation rather than empirical data, the resulting EV is discounted by 50–90% depending on the consensus level.

  ### **4. Application to [Applicant Name]**

  Under this new framework, [Applicant Name] is rejected for the following reasons:
  1.  **Failure of Robustness:** They admitted that reordering scenarios flips the sign of the EV. This fails Criterion B.
  2.  **Lack of Downside Mitigation:** The "backfire" scenarios (e.g., inspiring copycats) are acknowledged but not structurally mitigated, failing Criterion C.
  3.  **Bylaw Compliance:** Funding based on the current model would violate the "defensible assessment" clause, exposing the foundation to governance criticism.

  **Path Forward for Applicant:** We will invite [Applicant Name] to resubmit in the next cycle if they can restructure their intervention to decouple the "detection" work from the "disclosure" work, thereby removing the backfire branches from the model entirely.

  ### **5. Conclusion**

  This decision rejects the specific application but validates the mission. We are not saying tail-risk work is unfundable; we are saying that **mathematically undefined expectations are not a valid currency for grantmaking.**

  By adopting the Robust Decision Framework, we satisfy Camp A's demand for rigor (no arbitrary sums) and Camp B's demand for action (a clear path to fund high-risk work that passes safety and robustness checks). This ensures our capital is deployed where it is both impactful and defensible.

  **Action Required:** Please review the attached Robust Decision Framework policy draft. I move we vote to reject the current application and adopt the framework for the Q1 funding cycle.
