answer: |-
  ### Prep Sheet: Pain Asymbolia & Normativity Workshop

  **Context:** High-stakes departmental workshop.
  **Goal:** Protect the Job Market Paper (JMP) viability.
  **Strategy:** Concede instrumental harm to save intrinsic normativity.

  ---

  #### 1. The Normative Ethicist (Highest Damage)
  **The Objection:**
  "You're conflating *phenomenological* badness with *prudential* badness. Even if the asymbolic isn't bothered *now*, pain is typically a signal of tissue damage. If your theory implies that an asymbolic burning their hand isn't suffering a 'bad,' you've severed the link between pain and welfare entirely. Are you arguing that objective harm doesn't count against well-being unless it's felt as aversive? That's a radical subjectivism most of us won't buy."

  **The Reply (2 mins):**
  "I accept the distinction between intrinsic and instrumental badness, and I'm only making a claim about the former. My thesis is that the *sensory qualia* of pain carries no intrinsic negative weight; the weight comes from the aversive reaction. In the case of the burning hand, the *tissue damage* is instrumentally bad for the patient, regardless of their reaction. However, the *pain experience itself*, in that specific moment of asymbolia, lacks the intrinsic disvalue we usually attribute to it. I am not arguing that the asymbolic is flourishing or that their situation is good. I am arguing that the *phenomenal character* of the pain is not what makes it bad for them. The badness of the situation comes from the damage, not the sensation. By isolating the aversion, we clarify *why* normal pain is bad: it's the threat to agency and integrity signaled by the aversion, not the raw feel."

  **Soft Spot:**
  You are walking a tightrope. If you concede the tissue damage is "bad for them," the ethicist will ask why the pain *signal* isn't also bad *as a signal*. You risk making the pain experience epiphenomenal to the badness.

  #### 2. The Pain Clinician (High Damage)
  **The Objection:**
  "I treat patients with neuropathies and insensitivity. When they don't mind the pain, they don't guard the injury. They get infections, they lose limbs, they die young. You say this pain 'isn't bad for them.' In my clinic, 'bad' means 'harmful to the organism.' If your philosophy tells me their experience isn't bad, but their body is falling apart, your definition of 'bad for you' is useless to medicine. You're defining away the biological function of pain."

  **The Reply (2 mins):**
  "I agree entirely that the *outcome* is disastrous, and I don't want my view to undermine clinical triage. But we need to distinguish the *alarm* from the *fire*. The fire (tissue damage) is objectively bad. The alarm (pain sensation) is only bad because it usually triggers a protective aversion. In asymbolia, the alarm is ringing but the evacuation order isn't issued. My point is that the *ringing* itself isn't the harm; the harm is the burning building and the failure to evacuate. Acknowledging that the sensation isn't intrinsically bad helps us understand why treating the *aversive* component (via cingulotomy or opioids) is a valid goal, even if the sensation persists. It validates targeting suffering without necessarily eliminating sensation."

  **Soft Spot:**
  She doesn't care about your metaphysical distinction. If you say "it's not bad for them," she hears "you don't need to treat them." You must emphasize that *instrumental* badness still mandates treatment.

  #### 3. The Representationalist (Medium Damage)
  **The Objection:**
  "You're assuming a separation between the sensory representation and the affective command that intentionalism denies. Evaluativists like Bain or Carruthers argue pain represents 'bodily damage *as bad*.' The asymbolic doesn't have a separate 'sensation' plus 'aversion'; they have a broken intentional content. They represent damage, but the 'as bad' clause is missing. So you haven't shown badness is separate; you've shown the intentional content can be partial."

  **The Reply (2 mins):**
  "That's a live option, but it struggles to explain the reports. Asymbolics say, 'I feel the pain, it hurts, but I don't care.' If the content was 'damage as bad,' they should report, 'I feel damage, but it doesn't seem bad.' The fact that they acknowledge the 'hurt' (sensory) while lacking the 'care' (affective) suggests two distinct systems. My view accommodates your intentionalism by suggesting the *affective* component is where the normative weight lives, not the sensory representation. Whether you call that 'partial content' or 'separate components,' the normative upshot is the same: without the affective valuation, the sensation lacks intrinsic disvalue. I'm happy to frame it as 'partial content' if it saves the intentionalist framework, provided we agree the 'badness' is located in that missing affective clause."

  **Soft Spot:**
  If they press that the "sensory" report is just a linguistic error (they actually feel pressure, not pain), you have no phenomenological evidence left. You are relying on their self-report being philosophically precise.

  ---

  #### The Question You Hope Nobody Asks
  **"If pain's badness is constituted by the subject's aversion, what is the moral status of pain in beings who cannot form complex aversive attitudes? Infants, severe cognitive disabilities, or non-human animals. If they don't 'mind' it in the reflective sense you imply, is their pain not bad? Are you committed to saying we have less reason to alleviate their suffering?"**

  *Why it's deadly:* It forces you to choose between speciesism (their pain counts less) or abandoning your thesis (aversion isn't necessary for badness).
  *Prep:* Pivot to "primitive aversion." Do not require reflective endorsement. "Aversion" includes pre-reflective withdrawal reflexes and distress vocalizations.

  ---

  #### Strategic Advice
  Your normative conclusion is too strong for the room. The "full stop" invites the Clinician and Ethicist to destroy you on instrumental harm. You need to narrow the claim to *intrinsic* badness to survive. If you defend the "full stop," you look naive about welfare. If you qualify it, you look precise.

  Drop this: The claim that asymbolic pain is "not bad for you, full stop."
