  Based on the track record of your friend's verdicts, she is acting as a strict interpreter of G.E. Moore's doctrine of **Organic Unities** combined with his insistence on **Truth** as a necessary constituent of the highest goods.

  Here is the analysis of her likely rulings, the rule she is applying, and a test case to settle the matter.

  ### 1. The Verdicts on the Disputed Cases

  **The Painting (Sublime Object, False Belief)**
  *   **Verdict:** **No intrinsic value (or negative).**
  *   **Reasoning:** In the "Mediocre Daub" case, she ruled that genuine ecstasy directed at a worthless object yielded *no positive value*. This establishes that the *truth of the intentional object* is a necessary condition for value, not just the intensity of the feeling. In the Painting case, while the object is genuinely sublime, the viewer's cognitive state includes the false proposition: *"This is a forgery."* For a Moorean strictist, the "organic whole" includes the consciousness *of* the object. If that consciousness entails a falsehood about the object's nature (provenance/authenticity), the unity is tainted. The appreciation cannot be "fitting" if it is yoked to a lie about what is being appreciated.

  **The Friendship (Real Virtues, Corrected Mistake)**
  *   **Verdict:** **High intrinsic value.**
  *   **Reasoning:** This differs from the Painting case because the delusion is *past*, not *present*. Moore's organic unities generally evaluate the *current state of affairs*. In the "Scammer" case, the delusion was constitutive of the *current* relationship (the friend did not exist). In this variant, the mistake has been *corrected*. The current organic whole consists of: Real Virtues + Real Affection + **True Beliefs** (about each other's identity and virtues). The historical error is a causal antecedent, not a constituent part of the current intrinsic value. Since the current state contains no active delusion, the "Organic Unity" remains intact and valuable.

  ### 2. Which Rule Is She Running?

  She is most likely running **Rule 2: "The whole whose value is in question includes those beliefs, so that delusion anywhere in it contaminates it."**

  *   **Why Rule 2 fits best:** Rule 1 ("Beliefs irrelevant so long as object is real") struggles to explain the severity of her "Mediocre Daub" verdict. If Rule 1 were dominant, the collector's "genuine ecstasy" might retain *some* value as a mental state, even if the object was mediocre. By ruling it *worthless*, she signals that the *relation* between mind and object (Truth) is the value-bearer, not just the mind or the object alone. This aligns with Moore's specific argument in *Principia Ethica* that a world containing true beliefs is intrinsically better than one containing false ones, even if the emotional tone is identical.
  *   **Other Compatible Rules:** One could argue for a **"Causal Integrity Rule"**: *Value requires that the causal chain leading to the appreciation be free of deception.* This would fit the Scammer and Daub cases. However, this rule would likely condemn the "Corrected Friendship" (since it originated in a mistake), whereas Rule 2 (focused on the *constituents* of the current whole) allows it. Given her likely distinction between the Scammer (ongoing lie) and the Friendship (corrected error), Rule 2 is the more precise fit.

  ### 3. The Further Case to Distinguish the Candidates

  To definitively distinguish between **Rule 1** (Beliefs Irrelevant) and **Rule 2** (Delusion Contaminates), you need a case where the **Object is Real and Valuable**, the **Appreciation is Fitting**, but the **Belief is False regarding a non-essential property**. The Painting case does this, but a social variant removes aesthetic ambiguity.

  **The Case of the "Anonymous Benefactor"**

  > **Scenario:** A person receives a life-saving medical treatment paid for by a genuine philanthropist (Real Object/Good). The recipient feels profound, fitting gratitude and joy (Fitting Appreciation). However, the recipient falsely believes the money came from a government grant (False Belief about Source), while the philanthropist wishes to remain anonymous.

  *   **Rule 1 Prediction:** **Valuable.** The object (the help/the good done) is real. The appreciation (gratitude) fits the good received. The belief about *who* sent it is a "surrounding belief" irrelevant to the value of the good itself.
  *   **Rule 2 Prediction:** **Contaminated/Less Valuable.** The "organic whole" of gratitude includes the intention toward a benefactor. If the recipient's mental state includes the falsehood "The State helped me," the cognitive constituent of the whole is false. For a strict Moorean, the *truth* of the consciousness is part of the ideal unity.

  **Why this tells them apart:**
  If she rules this **Valuable**, she is secretly running Rule 1 (Beliefs about source are irrelevant). If she rules it **Diminished/Worthless**, she is consistently running Rule 2 (Any constitutive falsehood contaminates the whole). This case isolates the "Belief" variable without changing the "Object Value" variable, providing the cleanest test of her underlying principle.
