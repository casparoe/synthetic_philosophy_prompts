          *   *Verdict:* Bentham *likely* still opposes criminalization, but not because the disgust doesn't count. He opposes it because the *total* utility calculation (including enforcement, blackmail, anxiety) remains negative. However, theoretically, if the disgust were "magical" (no enforcement needed to alleviate it) and massive, Bentham's logic *could* permit suppression. Mill's would not. So the friend is right about the theoretical vulnerability.

