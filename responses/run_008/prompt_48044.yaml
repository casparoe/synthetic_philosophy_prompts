  2.  **Initial Knowledge Retrieval & Analysis:**

      *   **Bentham on "Paederasty" (Offences Against One's Self):**
          *   Bentham argues against punishment.
          *   His method: Analyze the "mischief."
          *   Types of mischief: Primary (to the actor), Secondary (to others).
          *   He argues there is no primary mischief (consensual, no pain).
          *   He argues there is no secondary mischief (no danger to others).
          *   He addresses "derivative mischief" (danger of example). He dismisses this because the act is secret/unlikely to be imitated.
          *   He addresses "public disgust" (offense). He acknowledges it exists but argues it's based on prejudice/antipathy. He weighs the pain of punishment against the pain of disgust.
          *   *Key Insight:* Bentham *does* count the pain of disgust in the calculus, but he argues it's based on false beliefs (prejudice) and is outweighed by the severe pain of punishment (death, imprisonment).
      *   **Mill on Liberty (Harm Principle):**
          *   "The only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others."
