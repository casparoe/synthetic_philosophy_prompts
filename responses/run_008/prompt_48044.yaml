answer: |-
  This is a sophisticated dispute that cuts to the heart of the relationship between classical utilitarianism and liberal rights. Your friend has identified a structural tension that legal philosophers and utilitarian scholars have debated for decades. While your intuition that Bentham and Mill arrive at the same liberal conclusion is correct, her analysis of *how* they arrive there—and the fragility of Bentham's route—is analytically superior.

  Here is an adjudication of your dispute, broken down by the three specific questions you raised.

  ### 1. Degree vs. Principle: The Structure of the Argument

  Your friend is correct: the difference between Bentham and Mill is one of **principle and structure**, not merely degree.

  **Bentham's Strategy: The Comprehensive Calculus**
  In his manuscript *Offences Against One's Self* (c. 1785), Bentham does not argue that the public's disgust is irrelevant. He argues that it is a real pain ("pain of antipathy"), but that it is a *weak* pain based on *false* premises. Bentham's utilitarianism is monistic: all pains and pleasures commensurate. If the majority feels genuine agony at the knowledge of a private act, that agony enters the felicific calculus as a negative value. Bentham's argument for decriminalization is a balancing act:
  *   **Column A (Punishment):** Severe pain to the actor (death, imprisonment, pillory), plus the anxiety of potential punishment for all, plus the cost of enforcement.
  *   **Column B (Non-Punishment):** The pain of disgust felt by the public.

  Bentham concludes Column A outweighs Column B. But structurally, Column B *counts*. If the pain in Column B were to increase sufficiently, the scale could theoretically tip.

  **Mill's Strategy: The Qualitative Boundary**
  Mill, in *On Liberty* (1859), introduces a qualitative filter before the calculus even begins. The Harm Principle states that power can only be exercised to prevent *harm to others*. Mill explicitly distinguishes "harm" from "offense" or "dislike."
  *   **The Filter:** Feelings of disgust, moral disapproval, or religious revulsion do not qualify as "harm." They are excluded from the justification for coercion *categorically*.
  *   **The Result:** It does not matter how intense the disgust is. Even if 99% of the population feels visceral nausea, Mill forbids coercion because the *type* of interest being asserted (a preference about another's self-regarding conduct) is illegitimate grounds for state power.

  **Adjudication:** Your friend's reading fits the texts better. Bentham argues from **outweighing**; Mill argues from **exclusion**. You are right that they converge on the policy (decriminalization), but she is right that the logical engine is different. Bentham treats the public's disgust as a weak claim; Mill treats it as no claim at all.

  ### 2. The Limiting Case: Does Bentham Collapse?

  Your friend's "limiting case" objection is the standard and most potent critique of Benthamite liberalism: *If the majority's disgust were intense enough, would Bentham permit suppression?*

  Theoretically, **yes**. If the pain of disgust were sufficiently massive and certain, and the pain of punishment could be minimized (e.g., a small fine rather than death), a strict Benthamite calculus could license criminalization. Bentham's system contains no intrinsic right to liberty; liberty is only instrumentally valuable insofar as it produces pleasure or prevents pain.

  **However, Bentham has more resources than your friend grants.** He is not helpless in the limiting case. In *Offences Against One's Self*, Bentham deploys three empirical arguments that stabilize his position even against widespread disgust:

  1.  **The Blackmail Argument:** Bentham explicitly notes that criminalizing secret vices creates a market for extortion. If an act is illegal, anyone can threaten to expose the actor. The suffering caused by blackmail and the constant fear of exposure creates more "mischief" (pain) than the public's disgust. This turns a moralistic preference into a tangible security risk.
  2.  **The Epistemic Argument:** Bentham argues that disgust is rooted in false beliefs (e.g., that the act causes physical illness or divine wrath). A utilitarian should not satisfy preferences based on falsehoods, because doing so reinforces error. The long-term utility of a society based on truth outweighs the short-term utility of placating prejudice.
  3.  **The Enforcement Cost:** To suppress private consensual acts, the state must invade privacy. Bentham argues the "vexation" and "alarm" caused by intrusive policing creates more pain than the vice itself.

  **Adjudication:** Your friend is right that Bentham's *theory* collapses in the abstract limiting case (if disgust were costless to satisfy and infinitely intense). But your intuition is right that Bentham's *applied argument* is robust. He shows that in the real world, satisfying moralistic disgust is never costless; it always generates secondary mischiefs (blackmail, tyranny, anxiety) that outweigh the disgust.

  Nevertheless, the structural vulnerability remains. Mill's principle protects the minority even if the majority's disgust is rational, costless, and overwhelming. Bentham's protection is contingent on empirical facts about enforcement and psychology. If those facts changed, Bentham's protection could vanish.

  ### 3. The Filter Problem: Internal or External?

  This is the deepest part of your friend's challenge. She claims Bentham lacks a principled filter for *which* displeasures count, and that Mill supplies one "by fiat." She asks if a filter can be constructed on purely Benthamite grounds.

  **The Problem of "External" Preferences**
  In welfare economics and moral philosophy, this is known as the problem of "external preferences." If I get pleasure from knowing you are happy, that is an internal preference. If I get pleasure from knowing you are *punished* for your private choices, that is an external preference. If utilitarianism counts external preferences, the majority can always outvote the minority's interest in their own life.

  **Can Bentham Build the Filter?**
  A sophisticated Benthamite *can* construct a filter, but it must be **instrumental**, not **categorical**.
  *   **The Argument:** We should not count pains derived from prejudice because doing so incentivizes the cultivation of prejudice. If society learns that expressing disgust yields political power (criminalization), people will cultivate disgust to wield power. This creates a society of intolerance, which is unstable and painful in the long run.
  *   **The Mechanism:** Therefore, a "rule-utilitarian" Bentham might adopt a secondary principle: *Ignore pains based on moralistic antipathy.*

  **Is This Imported?**
  Your friend claims Mill's filter is imported from outside utilitarianism. This is partially true but requires nuance. Mill claims to ground the Harm Principle in "utility in the largest sense, grounded on the permanent interests of man as a progressive being."
  *   **Mill's Move:** Mill argues that human progress *requires* a sphere of immunity. Therefore, respecting that sphere maximizes utility.
  *   **The Difference:** Mill treats this immunity as a **rule** (almost a right). Bentham treats it as a **prediction**.

  **Adjudication:** Your friend is right that a *categorical* filter cannot be derived from pure act-utilitarianism without ceasing to be act-utilitarianism. If Bentham excludes disgust *because it is disgust*, he is appealing to a non-utilitarian value (e.g., dignity or autonomy). If he excludes it *because it leads to bad long-term consequences*, he remains a utilitarian, but his protection of the minority is contingent.

  **What This Shows About Utilitarianism and Criminal Law:**
  This reveals a limit in utilitarianism as a theory of criminal law. Utilitarianism is excellent at determining *how much* punishment to inflict (proportionality), but it struggles to determine *what* can be punished (criminalization) when the "harm" is purely moralistic.
  *   **Bentham's Reach:** Bentham relies on the hope that the truth (that no real harm is done) will always outweigh the prejudice. This requires an optimistic view of human rationality.
  *   **Mill's Reach:** Mill recognizes that prejudice is not always rational and that majorities can be tyrannical even when it "costs" them nothing. He imports a liberal constraint to patch the utilitarian calculus.

  ### Final Verdict

  You should concede the core of your friend's argument, while maintaining the strength of your practical intuition.

  1.  **On Structure:** Your friend is right. Bentham balances; Mill excludes. This is a difference in principle. Bentham's argument is vulnerable to the "tyrannical majority" scenario in a way that Mill's is not.
  2.  **On the Limiting Case:** Your friend is theoretically right, but you are practically right. Bentham's empirical arguments (blackmail, enforcement costs, the falsity of prejudice) make the "tyrannical majority" scenario unlikely in the real world. Bentham solves the hard case empirically; Mill solves it conceptually.
  3.  **On the Filter:** Your friend is right that a categorical filter cannot be purely Benthamite. To get Mill's result, one must value something other than the sum of preferences (e.g., the *status* of the agent). If Bentham builds a filter, it must be a long-term strategic rule, which remains vulnerable if the short-term utility of oppression ever looks high enough.

  **Resolution:**
  Your argument captures the **spirit** of Bentham: he was a radical liberal who used utility to dismantle oppressive morals. Your friend's argument captures the **logic** of Bentham: his system lacks the architectural firewalls Mill later installed.

  The most accurate synthesis is this: **Bentham demonstrates that liberal conclusions are *compatible* with utilitarianism; Mill demonstrates that they are not *secure* within it without modification.** Bentham shows that a honest utilitarian calculation leads to liberty; Mill argues that we cannot trust the calculation itself, so we must bind it with the Harm Principle. Your friend has correctly identified that Mill's modification is necessary to close the loophole Bentham left open, even if Bentham himself never walked through it.
