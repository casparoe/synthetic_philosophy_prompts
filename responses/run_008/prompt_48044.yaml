          *   *Verdict:* The friend is right that Bentham lacks a *categorical* filter. But a sophisticated Benthamite can construct a *pragmatic* filter. However, this makes minority rights contingent on empirical facts about social stability, whereas Mill tries to make them principled. This shows a limit of pure act-utilitarianism in protecting rights against a tyrannical majority.

  4.  **Refining the Adjudication:**

