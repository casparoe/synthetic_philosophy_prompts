  My roommate is on a philosophy-of-AI youtube kick and now thinks he fully understands the symbol grounding problem. He watched a video essay on it and gave me this summary, pretty much word for word what the video said: "Searle's Chinese Room proved that a program shuffling symbols around by their shapes can never understand what those symbols mean. Harnad named this the symbol grounding problem and gave the solution: a symbol only means something when it's hooked up to real things in the world through the senses, like a camera, so you ground the word 'red' by pointing the camera at red things. That's also why you could never learn Chinese from a Chinese dictionary — every word just defined by more words, going in a circle forever. So LLMs are ungrounded by definition, they only have words about words, and no amount of scale or better training changes that, it's pure logic. And a machine won't really understand 'red' until it can experience it from the inside." He's alot more confident about all this than I am, and I want to know what I can actually trust before I argue with him about it over dinner. How much of the summary is right? Go through it peice by piece: what would Harnad himself sign off on, where does the video blur together two things the actual debate keeps apart (something about the camera part feels too easy to me, and I suspect "proved" is quietly doing a ton of work), and does his conclusion about LLMs follow from whichever parts survive? Please also tell me how confident you are in each verdict, and single out the one point you're least sure about.
