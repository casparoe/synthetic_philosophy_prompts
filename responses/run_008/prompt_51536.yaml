answer: |-
  Two Many-Worlds physicists, Alice and Bob, are placing a bet on a quantum measurement with unequal amplitudes: $\sqrt{0.99}|\text{Up}\rangle + \sqrt{0.01}|\text{Down}\rangle$.

  Alice: "Put your money on Up. It's 99% probability."

  Bob: "But in Many-Worlds, both outcomes occur. So why isn't it 50/50? One world where I win, one where I lose."

  Alice: "You can't count worlds, Bob. Branching is continuous. The number of branches is ill-defined; it depends on how you slice the decoherence basis."

  Bob: "Okay, so I can't count them. But I still exist in both. Why should I care more about the Up-branch?"

  Alice: "Because you weight them by squared amplitude. The Up-branch has higher measure."

  Bob: "So probability isn't about chance, it's about... density of existence?"

  Alice: "Basically. A rational agent cares more about high-measure copies."

  Bob: "So if I decide to care equally about all my copies, the odds change?"

  Alice: "No, then you're just irrational. The Born Rule is derived from decision theory."

  Bob: "Wait. Let me get this straight. I can't count the branches because the slicing is arbitrary..."

  Alice: "Right."

  Bob: "...but I must weigh them to get the probabilities?"

  Alice: "Right."

  Bob: "So I'm not predicting the future. I'm appraising it."

  Alice: "Don't be difficult."

  Bob: "I'm serious. You're telling me I can't count the districts, but I have to vote based on their property values? That's not physics, Alice. That's quantum gerrymandering."

  Alice: "It's not gerrymandering! The measure is invariant."

  Bob: "Sure. But you admitted the branches are fuzzy. So you're drawing the district lines wherever the amplitude is high, and telling the low-amplitude districts they don't count."

  Alice: "They count! Just less."

  Bob: "So what do I tell the version of me in the Down-branch when he loses his money?"

  Alice: "Tell him he was statistically insignificant."

  Bob: "He's going to feel that. He's 100% conscious in his branch."

  Alice: "Yes, but he's only 1% of the total measure."

  Bob: "So he's a fractional citizen?"

  Alice: "Stop it."

  Bob: "I'm just saying, if the Born Rule is just weighting copies based on arbitrary slices... then probability isn't a law of nature."

  Alice: "It is!"

  Bob: "No. It's a zoning law for the multiverse. And I think the Down-branch is going to file an appeal."
