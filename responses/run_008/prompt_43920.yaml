      *   (f) **Moral Patienthood (Hedonism/Preference-based):** Things matter to an entity if it seeks/avoids states. Grounds vegetarianism and future machine suffering views.

  3.  **Identify Tensions:**

      *   **Tension 1: (b) Eliminativism vs. (e) AI Goal Realism.**
          *   (b) says "belief/desire/goal" talk is folk psychology that will be eliminated; goals aren't real properties in the strict ontological sense (like phlogiston).
          *   (e) says AI systems will *genuinely* have goals as a *real property* of the system, not just a convenience of description. Taking goal-talk as projection is a "downgrade."
