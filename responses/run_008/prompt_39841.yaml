      *   *Option 2: The "Partitioning" Move (Davidson).* Accept that the mind isn't unified. One part knows, one part doesn't. Solves the paradox, but costs ontological simplicity.
      *   *Option 3: Focus on Responsibility (The Normative Turn).* Shift the question from "Is it *really* deception?" to "Under what conditions is the agent blameworthy?" This addresses the shame/complicity intuition directly.
      *   *Option 4: Empirical Input.* Psychology (defense mechanisms, cognitive dissonance). But philosophy often cares about conceptual possibility, not just frequency.
