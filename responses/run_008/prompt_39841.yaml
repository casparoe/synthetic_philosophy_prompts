  5.  **Formulate a Diagnosis:**
      *   It's a **hybrid disagreement**.
      *   Layer 1: Verbal/Terminological (What counts as "deception"?).
      *   Layer 2: Descriptive/Psychological (How does the mind actually handle threatening evidence?).
      *   Layer 3: Normative (When are we blameworthy for our beliefs?).
