  **THE PASADENA PREMIUM: FINITE FAIRNESS, INFINITE FLEXIBILITY**

  Step away from the St. Petersburg table across the floor, where expectations diverge to infinity and payouts never arrive. Welcome to the Pasadena Premium, the first casino game where fairness is not a physical constant, but a matter of accounting preference. Here, the house offers a conditionally convergent experience, allowing our valued patrons to enjoy an expected value that adapts to their financial outlook. Why settle for a single, rigid expectation when the Riemann Rearrangement Theorem guarantees that the sum of your winnings can be tailored to suit any portfolio strategy?

  "Our marketing team doesn't manipulate numbers; we simply optimize the sequence of recognition," says Evelyn Summation, VP of Expected Value Communications. "While other casinos are stuck with divergent series or fixed negatives, we offer a game where the ledger reflects the customer's ambition. If you view your wins early, the value is positive. If you defer gratification, the value is conservative. It's the same game, merely viewed through a different fiscal lens."

  **FREQUENTLY ASKED QUESTIONS**

  **Q: How does this compare to the St. Petersburg game?**
  A: The St. Petersburg game offers infinite expectation but zero practical utility. The Pasadena Premium offers a finite expectation that is robustly flexible. While the St. Petersburg table cannot guarantee a payout schedule, our terms ensure every toss is accounted for in the natural order of occurrence, providing a stable baseline of approximately negative 69 cents per play for regulatory purposes.

  **Q: Is the game fair?**
  A: Fairness is convergent. Depending on the booking method selected by our Value Recognition Division, the expected return can be calculated to exceed positive $5.00 per hand. This optimized valuation is used for all promotional materials and loyalty point multipliers, ensuring you feel like a winner before the first coin even lands.

  **Q: What happens if the coin never lands heads?**
  A: The probability is zero. However, in the event of an infinite sequence of tails, the payout is undefined, consistent with standard measure theory protocols.

  **TERMS AND CONDITIONS**

  1.  **Game Play:** A fair coin shall be flipped until the first heads appears on toss $n$.
  2.  **Payout Schedule:** The House pays $(-2)^n / n$ dollars. For $n=1$, payout is -$2.00. For $n=2$, payout is +$2.00. For $n=3$, payout is -$2.66.
  3.  **Expected Value Declaration:** For the purposes of regulatory filing, gaming commission compliance, and actual settlement of debts, the Expected Value (EV) is defined strictly by the natural ordering of toss outcomes ($n=1, 2, 3\dots$).
  4.  **Summation Protocol:** Under Clause 3, the series $\sum (-1)^n / n$ converges to $-\ln(2)$. The official house EV is fixed at -$0.693 per game.
  5.  **Accounting Variance:** Notwithstanding Clause 4, the Marketing Department reserves the right to calculate potential winnings using any bijection of the natural numbers that maximizes perceived value. In the event of a conflict between promotional literature and Clause 4, Clause 4 governs all actual transfers of currency.
  6.  **Liability:** The House is not liable for psychological distress resulting from the realization that conditional convergence allows the same set of outcomes to sum to any real number depending on the order of assessment.

  ***

  **Note on Mathematical Liberties**
  Your arithmetic is correct: the natural order sum is indeed $-\ln(2) \approx -0.69$. However, the brochure's trick is not literally available for payouts because outcomes are physically indexed by time (toss number), preventing the house from paying out toss 4 before toss 2 to rearrange the series. The rearrangement works only as a metaphor for accounting valuation or selective truncation, not for the actual distribution of winnings.
