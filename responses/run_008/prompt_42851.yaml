prompt: |-
  I run a discussion group for second-year undergrads — basically a pub philosophy night, about fifteen people, mostly not philosophy majors — and this term's topic is what you're allowed to assert. I want one of those 'which position do you actually hold?' quizzes: eight to ten questions, each a concrete case with two or three options, and a scoring key that maps answer patterns onto views. People should get sorted by what they say about the cases, not by which label they like, so no question can be 'do you think assertion is governed by a knowledge norm?'.

  Leaves the key needs to have: the knowledge norm, the truth norm, the justification / reasonable-belief norm, the belief (sincerity) norm, and the no-distinctive-norm view on which assertion just inherits general epistemic norms plus whatever rules the practice happens to have. You can add a pluralist 'different norms in different contexts' leaf if it helps, but mark it clearly as such.

  Cases the quiz has to include, because these are where the views actually come apart:

  - The lottery one: a million-ticket fair lottery, the draw has already happened, your friend's ticket lost, and you say to them 'you lost'. True and near-certain — but assertable?
  - A Moorean sentence: 'It's raining, but I don't believe it is.'
  - Gettier-style: someone asserts p, p is true, they're justified in believing it, but only by luck. Proper assertion or improper?
  - False but justified: someone is confident, well-supported, and wrong. Can that still be a perfectly fine assertion?
  - Concessive knowledge: 'I know the shop closes at six, but it might be closed.'
  - Retraction etiquette: someone asserts something true that they had no business believing, and when challenged says 'fair, I shouldn't have said that'. Is the practice of faulting such assertions evidence about the norm, or just noise?
  - Machines: my phone's weather app prints 'rain tomorrow' off a 55% forecast, and a chatbot tells me a fact while believing nothing about anything. Are these assertions at all, and if so which norm could they even violate? I want this one in because it goes past the standard cases everyone's seen.
  - Stakes: the same sentence ('the meeting's at three') said on the same evidence when the cost of being wrong is trivial vs ruinous.

  For each question, write options a non-philosopher can pick without knowing where they lead — 'yes you may say it', 'no, you shouldn't', 'you may, but you owe an explanation if pressed' — that kind of thing.

  Two more asks. First, in the scoring key, separate what's settled from what's genuinely contested among people who actually work on this: e.g. flag whether treating lottery propositions as unknowable is a consensus or a working assumption that some reject, and dont present any one norm as the consensus view, because it isnt. Second, flag any pairs of leaves the quiz can't really separate (I'd guess truth vs justification will blur whenever justified beliefs happen to be true) and any answer combinations that don't map onto a leaf — and say whether nobody's in that corner because the view is incoherent, unattractive, or just unexplored.

  It needs to be runnable in about twenty minutes at a pub: people answer by holding up cards, and the key has to be checkable by them on the spot without me hovering over anyone's shoulder.
reasoning: |-
  Here's a thinking process that leads to the suggested quiz and scoring key:

  1.  **Analyze the Request:**

      *   **Target Audience:** Second-year undergrads (mostly non-majors), pub philosophy night setting (casual but intellectually serious).
      *   **Topic:** Norms of Assertion (what you're allowed to assert).
      *   **Format:** 8-10 question quiz, concrete cases, 2-3 options per question.
      *   **Goal:** Sort participants into philosophical "leaves" (views) based on answers, not self-identification.
      *   **Required Views (Leaves):** Knowledge Norm, Truth Norm, Justification/Reasonable-Belief Norm, Belief (Sincerity) Norm, No-Distinctive-Norm (Inheritance), Pluralist/Contextualist (optional but recommended).
      *   **Required Cases:** Lottery, Moorean, Gettier, False but Justified, Concessive Knowledge, Retraction Etiquette, Machines (AI/Apps), Stakes.
      *   **Constraints:**
          *   Questions must be accessible (no jargon like "epistemic norm").
          *   Scoring key must distinguish settled vs. contested issues.
          *   Scoring key must flag indistinguishable views or incoherent combinations.
          *   Must be runnable in ~20 mins (card holding, self-scoring).

  2.  **Drafting the Questions (Iterative Process):**

      *   *Constraint Check:* Need 8-10 questions covering the 8 specific cases listed. Some cases might need to be combined or split to fit the 8-10 limit while ensuring discriminative power.
      *   *Case 1: Lottery.* Classic.
          *   Options: Say it / Don't say it / Say it but hedge.
      *   *Case 2: Moorean.* 'It's raining but I don't believe it.'
          *   Options: Fine / Weird but okay / Wrong.
      *   *Case 3: Gettier.* True, justified, lucky.
          *   Options: Proper / Improper.
      *   *Case 4: False but Justified.* Confident, supported, wrong.
          *   Options: Blameless / Faulty.
      *   *Case 5: Concessive Knowledge.* 'I know p, but might be not-p.'
          *   Options: Contradiction / Okay / Awkward.
      *   *Case 6: Retraction.* Asserted true thing without basis, challenged, retracts.
          *   Options: Retraction appropriate / Retraction unnecessary.
      *   *Case 7: Machines.* App/Chatbot.
          *   Options: Not assertions / Assertions but different rules / Same rules.
      *   *Case 8: Stakes.* Low vs. High stakes.
          *   Options: Same rule / Different rule.

      *   *Refining Options:* To make scoring easy, options should map to specific norms.
          *   Knowledge Norm (KN): Requires Knowledge. (Fails Lottery, Gettier, False).
          *   Truth Norm (TN): Requires Truth. (Fails False, allows Lottery).
          *   Justification Norm (JN): Requires Justified Belief. (Allows False, Lottery maybe, Gettier).
          *   Belief Norm (BN): Requires Sincere Belief. (Allows False, Lottery, Gettier).
          *   No-Distinctive Norm (NDN): Context/Pragmatics. (Varies by stakes/conversation).
          *   Pluralist (PL): Depends on context.

      *   *Drafting the Questions for Clarity:*
          *   Q1 (Lottery): Focus on the *assertion* itself.
          *   Q2 (Moore): Focus on *assertability* despite truth.
          *   Q3 (Gettier): Focus on *luck*.
          *   Q4 (False/Justified): Focus on *blame*.
          *   Q5 (Concessive): Focus on *consistency*.
          *   Q6 (Retraction): Focus on *apology*.
          *   Q7 (Machines): Focus on *agenthood*.
          *   Q8 (Stakes): Focus on *context sensitivity*.

      *   *Wait, I need to ensure the scoring works.* If I just give A/B/C, I need a way to tally.
      *   *Idea:* Assign points to specific "clusters" of answers, or have users track which "voice" they are listening to.
      *   *Better Idea for Pub Quiz:* Give each option a symbol or color corresponding to the *implication* of that answer, then tally the symbols.
      *   *Even Better:* Keep it simple. Each question has options A, B, C. The Key explains what pattern leads to what view.
      *   *Actually, the prompt asks for a "scoring key that maps answer patterns onto views".*
      *   *Let's try to make the options map directly to the strictness of the norm.*
          *   Option 1: Strict (Knowledge/Truth)
          *   Option 2: Moderate (Justification/Belief)
          *   Option 3: Loose/Contextual (No Norm/Pluralist)
      *   *Problem:* Different norms give different answers on different questions. E.g., Truth Norm allows Lottery (it's true), Knowledge Norm forbids it (you don't know). Justification Norm allows False (you were justified).
      *   *Solution:* I will design the options so that choosing "Yes, assert" vs "No, don't" reveals the threshold. I will provide a tally sheet where they count how many times they chose the "Strict" option vs the "Loose" option, but specific questions are diagnostic for specific norms.
      *   *Actually, the most robust way for a self-scoring pub quiz:* Provide a "Profile Key". "If you answered X on Q1 and Y on Q4, you are likely Z."
      *   *Refinement:* Let's create 3 "Personas" or "Voices" for the options.
          *   Voice K (Knowledge/Truth focused): "You need to be sure/right."
          *   Voice J (Justification/Belief focused): "You need to have good reasons/be sincere."
          *   Voice C (Context/No-Norm focused): "It depends on the situation/conversation."
      *   *Wait, Truth and Knowledge come apart on Lottery.* Truth says Yes, Knowledge says No.
      *   *Okay, let's stick to the prompt's request:* "Options a non-philosopher can pick... scoring key maps answer patterns."
      *   *Strategy:* I will write the questions with options A, B, C. In the Key, I will provide a flowchart or a "Mostly As, Mostly Bs" system, but with specific "Dealbreaker Questions" (like Lottery and False Belief) that distinguish the specific norms.

      *   *Revised Strategy for Scoring:*
          *   Since there are 5-6 distinct views, a simple "Mostly A" won't work.
          *   I will group the questions by *diagnostic power*.
          *   Q1 (Lottery) distinguishes Knowledge from Truth/Justification.
          *   Q4 (False Justified) distinguishes Truth/Knowledge from Justification/Belief.
          *   Q8 (Stakes) distinguishes Invariantists from Contextualists/Pluralists.
          *   Q7 (Machines) distinguishes Normativists from Non-Normativists/Inheritance.
          *   I will provide a "Which View Are You?" checklist in the key. "If you said X on Q1 and Y on Q4, check here."

  3.  **Drafting the Content:**

      *   *Intro:* Set the scene.
      *   *Questions:* Ensure they are punchy and pub-friendly.
      *   *Key:* Needs to be detailed about the philosophy (settled vs. contested) as requested.
      *   *Limitations:* Need to explicitly state where the quiz fails to distinguish (e.g., Truth vs. Knowledge on non-lottery cases).

  4.  **Refining the Philosophy (Self-Correction):**

      *   *Truth Norm vs. Knowledge Norm:* The main battleground is the Lottery. Truth says assert (it's true). Knowledge says don't (you don't know).
      *   *Justification vs. Belief:* Justification requires evidence; Belief just requires sincerity. Q4 (False but Justified) helps here. If you say "Okay to assert," you lean Justification/Belief. If "Not okay," you lean Truth/Knowledge.
      *   *No-Distinctive Norm:* This view says assertion is just governed by morality/prudence. Q7 (Machines) is good here. If a machine asserts, is it violating an *epistemic* norm? Or just malfunctioning?
      *   *Moore's Paradox:* Almost everyone agrees this is bad. The *explanation* differs. Knowledge norm says you can't know the conjunction. Belief norm says you can't believe the conjunction. This might not distinguish well, but it's a required case. I'll use it to test consistency.
      *   *Retraction:* If you retract a true claim because you lacked evidence, you support Knowledge/Justification. If you say "But I was right!", you support Truth.
      *   *Stakes:* Contextualism vs. Invariantism.

  5.  **Finalizing the Quiz Structure:**

      *   8 Questions.
      *   Options: A, B, C (roughly mapping to Strict, Moderate, Flexible).
      *   Scoring: A "Decision Tree" style key is best for self-scoring without a calculator.
      *   Philosophical Commentary: Integrated into the key as requested (settled vs. contested).

  6.  **Addressing Specific Constraints:**

      *   *Settled vs. Contested:* I need to be careful not to present Knowledge Norm as the winner. It's the dominant view but heavily contested. Lottery intuition is strong but not universal (Hawthorne, etc.).
      *   *Indistinguishable Views:* Truth vs. Knowledge is hard outside Lottery/Gettier. Justification vs. Belief is hard if we assume justification implies belief. I need to flag this.
      *   *Incoherent Combos:* E.g., Saying False Belief is okay (anti-Truth) but Lottery is not (pro-Knowledge) is a specific hybrid view (Knowledge is the norm, truth isn't sufficient). That's actually the Knowledge Norm view. Wait.
      *   *Correction:*
          *   Knowledge Norm: No Lottery, No False, No Gettier.
          *   Truth Norm: Yes Lottery, No False.
          *   Justification Norm: Yes Lottery, Yes False (if justified).
          *   Belief Norm: Yes Lottery, Yes False (if believed).
          *   No-Norm: Depends on consequences.
      *   *I need to make sure the options allow these distinctions.*

  7.  **Writing the Questions (Mental Check):**

      *   Q1 (Lottery): A (Don't say), B (Say it), C (Say with hedge). -> A=Know, B=Truth/Just, C=Context.
      *   Q2 (Moore): A (Never), B (If true), C (If useful). -> A=Most, B=Truth, C=Pragmatic.
      *   Q3 (Gettier): A (Improper), B (Proper), C (Depends). -> A=Know, B=Just/Truth, C=Context.
      *   Q4 (False/Justified): A (Wrong to say), B (Blameless), C (Fine). -> A=Truth/Know, B=Just, C=Belief/No-Norm.
      *   Q5 (Concessive): A (Nonsense), B (Okay), C (Context). -> A=Know, B=Contextualist.
      *   Q6 (Retraction): A (Must retract), B (No need), C (Optional). -> A=Know/Just, B=Truth.
      *   Q7 (Machines): A (Not assertions), B (Assertions, same rules), C (Assertions, different rules). -> A=Inheritance/No-Norm, B=Normativist, C=Pluralist.
      *   Q8 (Stakes): A (Same rule), B (Higher stakes = stricter), C (Higher stakes = don't speak). -> A=Invariantist, B=Contextualist.

      *   *Wait, Q7 is tricky.* If machines can't assert, they can't violate norms. If the view is "Assertion requires a mind," then machines don't assert. If "Assertion is functional," they do.
      *   *Let's simplify Q7 options.* A (Not real assertions), B (Real assertions, same rules), C (Real assertions, but rules differ).

  8.  **Constructing the Key:**

      *   Need to explain *why* certain patterns lead to certain views.
      *   Need to add the "Philosopher's Footnotes" regarding consensus/contestation.
      *   Need to identify the "Blind Spots" (Truth vs Knowledge).

  9.  **Review against Constraints:**

      *   8-10 questions? I have 8. I can add one on "Opinion vs Fact" or split Stakes to make 9. Let's add a "Guessing" question to separate Belief from Justification.
      *   Q9: "I have a hunch, no evidence, but I'm right." -> Belief Norm says okay (if sincere). Justification says no.
      *   Okay, 9 questions.
      *   Run time: 20 mins. Reading + Answering + Scoring.
      *   Card holding: Yes, A/B/C cards.
      *   Self-scoring: Yes, Key provided.

  10. **Final Polish:** Tone should be engaging, not dry. Ensure the "Pub" vibe is present. Make sure the philosophical distinctions in the key are accurate (e.g., Williamson on Knowledge Norm, Weiner on Truth Norm, Lackey on Justification).

      *(Self-Correction on Scoring)*: A flowchart is hard to print/read quickly. A "Tally System" is better.
      *   Count how many times you chose the "Strict" option (A).
      *   Count how many times you chose the "Reasonable" option (B).
      *   Count how many times you chose the "Flexible" option (C).
      *   *Problem:* This collapses distinct views. Knowledge and Truth both look "Strict" on False Belief, but differ on Lottery.
      *   *Solution:* I will use a "Diagnostic Key". "Look at your answers to Q1 and Q4." This is more accurate for philosophical views. I will write the key as a series of "If... Then..." statements.

      *(Refining the "Blind Spots")*:
      *   Truth vs Knowledge: Only comes apart on Lottery/Gettier.
      *   Justification vs Belief: Comes apart on "Sincere but Unjustified" (I added Q9 for this).
      *   No-Norm: Hard to distinguish from Pluralist. I will flag this.

      *(Refining the "Settled vs Contested")*:
      *   Lottery: Intuition is strong (don't assert), but theoretical explanation is contested.
      *   Moore: Everyone agrees it's bad, disagreement is why.
      *   False Justified: Highly contested (Is blamelessness enough?).

      Let's assemble.

      *Wait, one more check on the "Machines" case.*
      *   If I hold the "No-Distinctive-Norm" view (Assertion inherits general norms), does a machine assert?
      *   Some say assertion requires intent. If so, machines don't assert.
      *   Some say assertion is functional.
      *   I need to make sure the options don't force a view on *what* assertion is, but rather on the *norms*.
      *   Option A: "That's not an assertion, it's data." (Denies the practice applies).
