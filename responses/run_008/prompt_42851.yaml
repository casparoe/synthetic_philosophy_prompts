answer: |-
  # The "What Can You Say?" Pub Quiz
  **Topic:** The Norms of Assertion  
  **Time:** 20 Minutes  
  **Method:** Hold up Card A, B, or C for each question. Keep a tally of your letters.

  ### Instructions
  Read each scenario. Don't overthink the philosophy—go with your gut reaction about what is *appropriate* to say or do. There are no right answers, only different commitments.

  ---

  ### The Questions

  **1. The Lottery**
  A million-ticket fair lottery has been drawn. The results are on a server somewhere, but you haven't seen them. You hold a ticket. The odds you lost are 99.9999%.
  *   **A:** You should not tell your friend "You lost." It's too risky.
  *   **B:** You can say it. It's almost certainly true.
  *   **C:** You can say it, but you must add "probably" or "almost certainly."

  **2. The False Friend (False but Justified)**
  You have excellent evidence that the train leaves at 5 PM (the website says so, your friend confirmed it). You tell me "The train leaves at 5 PM." It turns out the website was hacked and the train leaves at 6.
  *   **A:** You did something wrong. You asserted a falsehood.
  *   **B:** You did nothing wrong. You were reasonable.
  *   **C:** You didn't do anything wrong, but you owe me a new ticket.

  **3. The Lucky Guess (Gettier Case)**
  You look at a broken clock that stopped at 3:00. It happens to be 3:00 now. You say "It's 3:00." You are right, and you have evidence (the clock), but your evidence is flawed.
  *   **A:** You shouldn't have asserted that. You didn't really *know*.
  *   **B:** It's fine. You were justified and you were right.
  *   **C:** It depends on whether I need to catch a train or just make small talk.

  **4. The Moorean Slip**
  It is visibly pouring rain outside. You say: "It is raining, but I don't believe it is."
  *   **A:** This is always improper. It sounds crazy.
  *   **B:** It's weird, but if it's true, you can say it.
  *   **C:** It's fine if you're being ironic or philosophical.

  **5. The Concessive Claim**
  You say: "I know the shop closes at six, but it might be closed already."
  *   **A:** You contradict yourself. You can't know it and say it might not be.
  *   **B:** It's a bit awkward, but logically possible.
  *   **C:** It's perfectly normal language; don't overanalyze it.

  **6. The Retraction**
  You assert something true ("The capital is Paris") based on a hunch with no evidence. I challenge you: "How do you know?" You realize you had no grounds.
  *   **A:** You should say "I shouldn't have said that."
  *   **B:** You should say "But I was right!" and stand by it.
  *   **C:** You should say "I was guessing, but I got lucky."

  **7. The Machine**
  Your weather app displays "Rain Tomorrow." A chatbot tells you "Napoleon lost at Waterloo." Neither has beliefs or a mind.
  *   **A:** These aren't assertions. Only humans assert.
  *   **B:** They are assertions, and they are wrong if the info is false.
  *   **C:** They are assertions, but we judge them by reliability, not "belief."

  **8. The High Stakes**
  You have the same evidence that the meeting is at 3 PM.
  *   *Case 1:* If you're wrong, we miss a coffee.
  *   *Case 2:* If you're wrong, we miss a flight to a wedding.
  *   **A:** The rule for speaking is the same in both cases.
  *   **B:** You need stronger evidence to speak in Case 2.
  *   **C:** In Case 2, you shouldn't speak at all unless you check again.

  **9. The Sincere Hunch (Belief vs. Justification)**
  You have zero evidence, just a strong gut feeling. You sincerely believe the coin will land Heads. You say "It'll be Heads." It lands Heads.
  *   **A:** You shouldn't speak without evidence, even if you believe it.
  *   **B:** If you genuinely believe it, you're allowed to say it.
  *   **C:** It's fine, as long as you don't claim to *know* it.

  ---

  ### The Scoring Key (For the Group)

  *Pass this sheet around. Find the pattern that matches your answers.*

  #### **Step 1: The "Dealbreaker" Questions**
  Look at your answers for **Q1 (Lottery)** and **Q2 (False Friend)**. These separate the major camps.

  *   **If you answered A on Q1 AND A on Q2:**
      *   **You lean toward the KNOWLEDGE NORM.**
      *   *View:* You must *know* what you say to be allowed to say it. Truth isn't enough; justification isn't enough. You need the real deal.
      *   *Philosophy Check:* This is the dominant view in current literature (associated with Timothy Williamson), but it relies on the contested idea that you can't "know" lottery propositions.

  *   **If you answered B on Q1 AND A on Q2:**
      *   **You lean toward the TRUTH NORM.**
      *   *View:* The only rule is "Don't lie." If it's true, you can say it (Lottery). If it's false, you broke the rule (False Friend), even if you weren't to blame.
      *   *Philosophy Check:* This view is less popular now because it makes blameless people rule-breakers. It is contested whether "truth" alone is the norm or just a condition.

  *   **If you answered B on Q1 AND B on Q2:**
      *   **You lean toward the JUSTIFICATION NORM.**
      *   *View:* It's about your evidence, not the facts. If you have good reasons, you're in the clear, even if you turn out wrong or are just statistically likely to be right.
      *   *Philosophy Check:* This is attractive because it aligns with moral blame (you aren't blameworthy if you tried your best). Contested: Does it allow too much (e.g., lucky guesses)?

  *   **If you answered B on Q2 AND B on Q9:**
      *   **You lean toward the BELIEF (SINCERITY) NORM.**
      *   *View:* As long as you aren't lying, you're okay. Evidence matters less than honesty.
      *   *Philosophy Check:* Often seen as too permissive. Most philosophers think you need *some* evidence, not just a hunch.

  #### **Step 2: The Context Check**
  Look at **Q8 (Stakes)** and **Q3 (Lucky Guess)**.

  *   **If you answered B or C on Q8:**
      *   **You lean toward CONTEXTUALISM / PLURALISM.**
      *   *View:* The rules change depending on how important it is to be right. There isn't one single norm for all assertions.
      *   *Philosophy Check:* Highly contested. Invariantists (who chose A) argue the *norm* stays the same, but the *prudence* changes.

  *   **If you answered C on Q3:**
      *   **You lean toward FUNCTIONAL / SOCIAL NORMS.**
      *   *View:* Assertion is a tool. If it works for the conversation, it's allowed.
      *   *Philosophy Check:* This overlaps with the "No-Distinctive-Norm" view.

  #### **Step 3: The Machine Check**
  Look at **Q7 (Machines)**.

  *   **If you answered A:**
      *   **You lean toward ANTHROPOCENTRIC / INHERITANCE VIEW.**
      *   *View:* Assertion is a human practice involving intent. Machines just output data. Therefore, there is no distinctive *epistemic* norm for them, only engineering standards.
      *   *Philosophy Check:* This supports the "No-Distinctive-Norm" view for humans too (assertion just inherits norms from belief + morality).

  *   **If you answered B or C:**
      *   **You lean toward FUNCTIONALISM.**
      *   *View:* Assertion is defined by what it *does* (conveying info), not who says it.

  ---

  ### Philosopher's Footnotes (Read Aloud for Discussion)

  **1. Where is the consensus?**
  *   **Moore's Paradox (Q4):** There is near-consensus that saying "It's raining but I don't believe it" is improper. The *fight* is about why. (Knowledge norm says you can't know the conjunction; Belief norm says you can't believe it).
  *   **Lottery (Q1):** There is a strong *intuition* that you shouldn't assert a lottery ticket lost before the announcement. However, there is **no consensus** on why. Knowledge theorists say you don't know it. Truth theorists say you should be able to. This is the biggest battleground in the field.

  **2. Where are the blind spots? (Views this quiz can't separate)**
  *   **Truth vs. Knowledge:** Outside of Lottery and Gettier cases (Q1, Q3), these views often give the same advice. If you don't know it, it's usually not true (or you have no business thinking it is). This quiz forces them apart in Q1, but in real life, they blur.
  *   **Justification vs. Belief:** If you have justification, you usually have belief. Q9 tries to split them, but many people find "Sincere Hunches" (Belief without Justification) impermissible for reasons unrelated to assertion (e.g., it's irresponsible).
  *   **Pluralist vs. No-Distinctive-Norm:** If you think norms change by context (Pluralist), it looks a lot like thinking there are no *specific* assertion norms, just general conversational ones (No-Distinctive). This quiz groups them loosely, but a PhD thesis could be written on the difference.

  **3. Incoherent Combinations?**
  *   **The "Truth-Only Lottery" Paradox:** If you said **B on Q1** (Lottery is okay because it's true) but **A on Q2** (False Friend is wrong even if justified), you hold a pure Truth Norm. This is a coherent view, but it commits you to saying the False Friend *violated a rule* even though they couldn't have known they were wrong. Some find this morally harsh.
  *   **The "Stakes Invariantist" who allows Lottery:** If you said **A on Q8** (Stakes don't change the rule) but **B on Q1** (Lottery is okay), you have to explain why statistical certainty is enough for a lottery but not for a high-stakes meeting. This is a tricky spot to defend.

  **4. Who is in the room?**
  *   **Mostly As:** You are an Epistemic Purist (Knowledge/Truth Norm). You value accuracy over social ease.
  *   **Mostly Bs:** You are a Reasonable Person (Justification/Belief Norm). You value responsibility and sincerity.
  *   **Mostly Cs:** You are a Pragmatist (Contextualist/No-Norm). You value the flow of conversation and practical outcomes.

  *Enjoy the pint. Remember: You don't know the next round is on you, so strictly speaking, you shouldn't assert that it is.*
