answer: |-
  Your flatmate's argument is a seductive piece of evolutionary optimism, but it contains a fatal equivocation and an empirical overreach. You are right to feel that the conclusion proves too much.

  To answer your specific question: **You should reject Premise (4).** Your instinct to preserve Premise (3) is not a bias; it is theoretically sounder. Premise (3) defines *instrumental rationality* (doing what succeeds), which is the standard definition in game theory. Premise (4), however, makes a sweeping empirical claim that is demonstrably false.

  Here is the breakdown of why (4) is the breaking point, why it looked plausible, the cost of rejecting it, and how the standard theoretical positions dismantle your flatmate's conclusion even if we grant him the rest.

  ### 1. Why Reject Premise (4)?
  **The Premise:** *Human life is made up almost entirely of repeated interaction... effectively no true one-shot case for us.*

  **Why it looked plausible:**
  This premise leans on the concept of **indirect reciprocity** and **reputation**. In small-scale ancestral environments (and even in modern professional networks), your actions are rarely truly anonymous. If you cheat a stranger, word might get out, or you might internalize a norm that affects future behavior. This "shadow of the future" is indeed longer than classical game theory often assumes.

  **Why it is false:**
  Premise (4) turns a "mostly" into an "always." There are demonstrable cases where the shadow of the future is effectively zero:
  *   **Finite Horizons:** A fixed-term contract with no possibility of renewal or reference check.
  *   **True Anonymity:** A cash transaction with a stranger in a foreign city where no digital footprint remains.
  *   **The End of Life:** Interactions occurring when an agent has no future to discount (e.g., a dying man, or a firm going bankrupt).
  *   **Structural Barriers:** Situations where reputation cannot transmit (e.g., sealed-bid auctions, anonymous whistleblowing portals).

  In these cases, the discount factor ($\delta$) drops below the threshold required to sustain cooperation. If the game is effectively one-shot, the dominant strategy is Defection. By denying this, your flatmate denies the basic structure of the incentives facing the agent.

  **The Cost of Rejecting (4):**
  Rejecting (4) costs you the idea of **universal morality**. It admits that cooperation is *contingent* on social structures that enforce the shadow of the future. It means that being "good" is rational *because* we are embedded in institutions (laws, reputational networks, communities) that make it so. If those institutions break down (e.g., during a collapse of society, or in an anonymous online space), rationality shifts. This is a cold conclusion, but it is the standard sociological and game-theoretic view (e.g., Douglass North's work on institutions).

  ### 2. The Internal Contradiction (The "TFT" Problem)
  Even if you granted Premise (4), your flatmate's argument collapses due to a logical equivocation between **Strategy** and **Move**.

  *   **Premise (2)** claims Tit-for-Tat (TFT) is successful.
  *   **Premise (5)** claims Defection is *never* rational.

  But **TFT defects.** TFT's defining feature is that it defects in round $n+1$ if the opponent defected in round $n$. If TFT is the rational strategy (per Premise 3), then **defection must be rational in some circumstances** (specifically, as punishment).

  Your flatmate is conflating "The Strategy of Unconditional Defection (All-D)" with "The Act of Defection."
  *   **All-D** is a strategy that never cooperates. This is what Premise (1) says cannot invade a TFT population.
  *   **Defection** is a move. This is what Premise (5) says is never rational.

  If you point this out, his argument self-destructs. To sustain cooperation, you *must* be willing to defect (punish) when others defect. A strategy that *never* defects is "Always Cooperate," which is evolutionarily suicidal because it can be invaded by defectors. Therefore, for cooperation to exist, defection must be a rational threat.

  ### 3. What the Standard Positions Say
  Here is how the three standard theoretical frameworks handle your flatmate's argument, and what price they pay to deny his conclusion.

  #### A. Backward Induction (The Finite Game)
  *   **The Argument:** If a game is repeated a *finite* number of times and this is known, rational players defect in the last round (since there is no future to fear). Knowing this, they defect in the second-to-last round, unraveling all the way to the first.
  *   **How it denies (5):** It shows that in fixed-term contracts (your example), defection is the *only* Nash Equilibrium.
  *   **The Cost:** It predicts zero cooperation in finite settings, which contradicts empirical data (people often cooperate until the very end). To fix this, we must assume some uncertainty about the endpoint or the opponent's rationality (Kreps et al. "Gang of Four" model).
  *   **Verdict:** Supports rejecting (4). Human life has known endpoints (death, resignation).

  #### B. The Folk Theorem (The Indefinite Game)
  *   **The Argument:** In an *indefinitely* repeated game, there is not just one equilibrium (TFT). There are *infinite* equilibria. "Always Defect" is *also* a Nash Equilibrium in an indefinite game. If everyone expects everyone else to defect, it is rational to defect.
  *   **How it denies (5):** Even if Premise (4) were true (life is indefinite), Defection could still be rational if the population coordinates on the "bad" equilibrium.
  *   **The Cost:** It renders the theory less predictive. If anything can be an equilibrium, game theory alone cannot tell us *which* equilibrium we will land in without adding cultural or historical context.
  *   **Verdict:** Shows that (1) does not guarantee cooperation is the *unique* rational outcome.

  #### C. Evolutionary Stability (The Population View)
  *   **The Argument:** TFT is not strictly Evolutionarily Stable (ESS). It can be invaded by "Always Cooperate" (since TFT does just as well against AC as against itself). Once "Always Cooperate" is common, "Always Defect" can invade.
  *   **How it denies (2):** TFT needs "Generous TFT" or other mechanisms to handle noise and neutral drift. It is not a permanent resting state.
  *   **The Cost:** It suggests cooperation is a dynamic cycle, not a stable utopia. Populations oscillate between cooperation and defection.
  *   **Verdict:** Shows that cooperation is fragile, not inevitable.

  ### 4. Salvaging the Evolutionary Story
  You do not need to throw out your seminar presentation. The core insight of Axelrod's work survives, but it must be qualified.

  **The Repaired Story:**
  1.  **Cooperation is a Local Optimum:** In environments with a sufficiently long shadow of the future (high $\delta$), reciprocal strategies outperform unconditional defection.
  2.  **Institutions Create Rationality:** Rationality is not intrinsic; it is constructed by the environment. We build legal systems, credit scores, and social norms specifically to extend the "shadow of the future" and make Premise (4) *more* true, even if it isn't *always* true.
  3.  **Defection is a Tool:** Defection is not "irrational"; it is the enforcement mechanism of cooperation. Whistleblowing is rational because it defects on a local defector (the corrupt firm) to cooperate with a global norm (the law), preserving the larger system.
  4.  **Endgames are Real:** When the shadow of the future lifts (resignation, death, anonymity), the rationality of cooperation dissolves. This isn't an "atavism"; it is a correct response to changed incentives.

  ### Summary
  Your flatmate's argument fails because it treats a **contingent equilibrium** (cooperation in repeated games) as a **categorical imperative**.

  *   **Reject Premise (4).** It is empirically false that all human interaction is effectively repeated.
  *   **Keep Premise (3).** It is correct that rationality is about success against the actual environment. In a one-shot environment, success requires defection.
  *   **Highlight the Contradiction.** TFT wins *because* it defects sometimes. If defection were never rational, TFT would lose to "Always Cooperate."

  By rejecting (4), you admit that morality is fragile and depends on the structures we build to sustain it. That is a more sober conclusion than your flatmate's, but it is the one supported by the math.
