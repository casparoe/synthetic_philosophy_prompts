answer: |-
  Hey there, this is a fantastic question and you have hit on exactly the right case study to stress-test the theory. As a software engineer, you are probably looking at this like a system design problem where you have inputs, processing units, and outputs, and you want to know where the latency or data loss occurred. The French Citizens Convention for the Climate is indeed the most significant real-world deployment of sortition at a national level, and your recap of the facts is solid enough for us to work with without needing to dig into the weeds of specific dates or decrees. The core tension you are sensing is whether the failure was in the code, which is the design of the citizen assembly itself, or in the infrastructure, which is the existing political system it was plugged into.

  To map the power dynamics carefully, you have to look at the flow of authority as a pipeline. At the start, you had the 150 citizens, who held the power of proposal generation. They were the only ones with the mandate to draft specific measures based on the goal of reducing emissions by forty percent. However, they lacked the power of ratification. That power sat with President Macron, who held what you called the veto power or the jokers. He acted as a filter layer between the citizens and the legislature. Then you had the Parliament, which held the power of implementation and dilution. They could rewrite the text, amend the measures, or ignore them entirely under the guise of legislative compatibility. The CESE, which convened the group, acted more like HR or facilitation; they managed the process but held no decision power. So, in terms of who actually held power, the citizens had agenda-setting power but zero sovereignty. They could write the ticket, but they could not cash it. This is crucial because sortition theory often assumes that the moral authority of a representative sample translates into political authority, but the CCC proved that without legal sovereignty, moral authority is easily ignored by entrenched executive power.

  When you look at what the random selection actually got you, the results are mixed but leaning positive regarding the internal deliberation. The theory predicts that ordinary people, if freed from election cycles and party discipline, will deliberate on merits rather than ideology. Inside the room, this basically held true. The participants learned complex policy details, bridged divides between urban and rural interests, and produced a coherent package. They acted like a legislature should. However, the theory also relies on the public recognizing these citizens as legitimate representatives of themselves, and this is where the system crashed. Because the assembly was advisory, the media treated it as a news cycle event rather than a governing body. The public did not feel owned by the process. If the citizens had been known as the people who would actually decide the law, public engagement would likely have been higher. Instead, they were seen as a focus group. So the random selection worked for the microcosm, creating a functional deliberative body, but it failed to macro-scale that legitimacy to the wider population because the stakes were perceived as low.

  This brings us to the heart of your question about the sortition boosters' defense, which is that the CCC failed because it lacked constitutional teeth. You asked if this is a real response or a no-true-Scotsman dodge, and I think it is a real response, but with a major caveat. It is not a dodge because the fundamental claim of sortition is that a random sample can make decisions as well as or better than elected officials. The CCC demonstrated that they could indeed make the decisions. The failure was not in the decision-making capacity of the humans involved, but in the integration of that body into the sovereign structure. If you build a new database cluster but do not connect it to the application layer, the cluster works fine but the app fails. Saying the cluster failed because it wasn't connected is accurate. However, the caveat is that demanding constitutional teeth is a massive barrier to entry. It is easy to say we need binding power, but existing power holders rarely vote to dilute their own power. So while the defense is theoretically sound, it is politically naive to assume those conditions are easy to supply.

  So I will commit to a verdict here. The CCC did not show that sortition fails as a method for generating good policy, nor did it show that it works under current conditions. Instead, it showed that sortition is incompatible with representative democracy unless it replaces a specific function of that democracy entirely. The experiment vindicated the cognitive capacity of ordinary people to handle complex governance tasks, debunking the idea that you need career politicians to understand trade-offs. But it also indicted the resilience of the existing political class, which absorbed the energy of the convention and neutralized its output to maintain the status quo. The failure was not that the citizens could not govern, but that the government would not let them. If you treat the CCC as a test of whether citizens can deliberate, it passed. If you treat it as a test of whether sortition can change policy outcomes within a semi-presidential system without structural overhaul, it failed.

  If I had to bet on one single design change for a country trying this again, it would be to mandate a binding referendum on the entire package of proposals without executive filtering. You need to close the loop between the proposal and the law. In the CCC, the gap between the citizens' proposal and the final law allowed the executive and legislature to reintroduce the very partisan incentives sortition is meant to remove. By forcing a yes-or-no vote by the public on the citizens' full package, you give the assembly real leverage. It forces the public to engage with the citizens' work as a governing mandate rather than a suggestion, and it prevents the executive from using those jokers to cherry-pick popular measures while dropping painful but necessary ones. This change turns the assembly from a咨询 body into a drafting legislature, which is where the actual power of sortition lies. Without that binding mechanism, you are just running a very expensive public relations campaign, and as you noted, the participants themselves felt used because they realized too late that they were building a car that the driver had no intention of starting.
