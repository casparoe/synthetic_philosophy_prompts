      "I'm asking what distinguishes your 'formalised heuristic' from a very careful empirical generalisation," Theo said, pushing off the doorframe. "If I say, 'We tested this a million times and it held', that's empirical. If you say, 'We analysed the structure and see no reason for failure', how is that materially different? It still relies on the absence of evidence being evidence of absence."

      "Because the argument is exposed to being argued with," Maya said, her voice sharpening. "An empirical pile of test results is a black box. You can't critique the data without generating more data. A heuristic argument is structural. It lays out the mechanism: 'We expect independence because of X, Y, and Z. If there is a correlation, it must arise from this specific pathway.' That allows us to find the flaw in the reasoning *before* deployment. It invites critique on the logic, not just the output history."

      "But logic gaps in high-dimensional spaces are subtle," Theo murmured. "You're assuming we're smart enough to spot the hole in the heuristic. But if the model is smarter than us, it might exploit a dependency we didn't even know was possible. You're formalising human intuition, and human intuition is exactly what fails under adversarial pressure."

      "Human intuition plus rigorous scrutiny," Maya corrected. "We don't trust the intuition; we trust the process of attempting to break the argument. It's not about saying 'this is true'. It's about saying 'here is the strongest case for safety we can construct, and here are the specific assumptions that would break it'. That gives us a target. Empirical testing gives us a rear-view mirror."

      Theo sighed, rubbing his temples. "I suppose I'd rather have a target than a mirror. But don't mistake the map for the territory, Maya. If that presumption of independence fails, you won't get a warning error. You'll just get catastrophe."

      "Then we'd better make sure the argument holds," she said, capping the marker. "Because the alternative is hoping the adversary stays asleep."

      "Or," Theo said, turning to leave, "hoping we don't wake something we can't put back down."

