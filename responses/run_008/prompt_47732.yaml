      "Pass the marker," Maya said, wiping a smudge of dried ink from the whiteboard. "You're conflating proof with certainty. In cryptography, we operate on heuristic arguments every day. We reckon a pseudorandom generator's output looks random, or that inverting a hash function is hard. Nobody can prove either proposition, yet the entire digital economy rests on them."

