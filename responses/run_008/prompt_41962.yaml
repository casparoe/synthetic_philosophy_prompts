answer: |-
  This is an exceptionally sharp observation, and I want to start by validating your intuition: you are not being precious, and you are not describing a mess of unrelated things. You have put your finger on one of the most active and difficult debates in contemporary meta-ethics and epistemology.

  What you are describing is real, it has a name (or rather, a cluster of names), and it distinguishes moral cognition from almost every other kind of expert deference.

  Let's think this through carefully, breaking down the three specific intuitions you raised, mapping them to the philosophical literature, and then seeing if we need a new label or if the existing ones suffice.

  ### 1. The "Answer Key" Intuition (Understanding vs. Knowledge)

  You wrote: *"It feels like being handed the answer to a test without doing the working... there seems to be something i only get when i make the connection myself."*

  In epistemology, we distinguish between **Knowledge** (justified true belief) and **Understanding** (grasping the explanatory connections between propositions).

  The philosopher **Alison Hills** has written extensively on exactly this scenario in her work on *Moral Understanding*. She argues that you can acquire *moral knowledge* via testimony (your friend tells you the joke is cruel, you believe her, you now know it is cruel). However, you cannot acquire *moral understanding* via testimony.

  *   **Knowledge** is possessing the fact: "X is wrong."
  *   **Understanding** is grasping the *reasons why*: "X is wrong *because* it causes Y, which violates Z principle."

  When your friend gave you the verdict, she gave you the conclusion. She did not (and perhaps could not fully) transfer the *perceptual sensitivity* that allowed her to see the cruelty in the first place. Until you reconstruct the reasoning yourself ("Oh, I see, that punchline relies on dehumanizing that group..."), you lack moral understanding.

  This explains why you felt you had the belief "backwards." In factual domains (like history or geography), knowing the fact is often enough. In morality, the *reasons* are constitutive of the moral value. If you don't grasp the reasons, your grip on the truth is fragile and unintegrated.

  ### 2. The "GPS" Intuition (Autonomy vs. Heteronomy)

  You wrote: *"When my gps tells me to turn left, i turn left with zero soul-searching... but when someone hands me a moral conclusion... it feels like being handed the answer."*

  This is the **Autonomy Objection** to moral testimony. It has Kantian roots.

  When you follow a GPS or a doctor, you are engaging in *instrumental* rationality. You have a goal (get to the airport, get healthy), and the expert tells you the means to achieve it. Your will is still your own; you are just outsourcing the data processing.

  Morality, however, is not merely instrumental; it is *constitutive* of your agency. To be a moral agent is to act on principles you endorse as valid.
  *   If you do the right thing *because* your friend said so, you are acting on **Heteronomy** (law from another).
  *   If you do the right thing *because* you see the reason for it, you are acting on **Autonomy** (self-law).

  The "soul-searching" you feel is missing is the exercise of your moral will. If you defer on morality, you are effectively outsourcing your conscience. This is why it feels different than deferring to a doctor. Deferring to a doctor preserves your agency; deferring to a moral expert (even a trustworthy one) can feel like a suspension of it.

  ### 3. The "Fraud" Intuition (Virtue and Integration)

  You wrote: *"I felt like a fraud, even though by then we believed all the same things."*

  This moves from epistemology to **Virtue Ethics**. In the Aristotelian tradition, morality isn't just about having correct beliefs; it's about having a cultivated character (*hexis*).

  The person who worked on the farm has a *disposition*. Their belief is woven into their emotional responses, their habits, and their perception of the world. You, having adopted the view via a documentary, have a *propositional attitude*. You believe the sentence "factory farming is wrong" is true.

  The "fraud" feeling is the recognition that your belief is not yet *virtuous*. It hasn't been tested by experience, habituation, or the struggle of reasoning. It is "thin" belief versus "thick" conviction. In virtue ethics, you cannot simply download virtue; it must be practiced.

  ### So, Is There A Term?

  You asked for an established name. The umbrella term for the structural problem is **The Puzzle of Moral Testimony** (or *The Problem of Moral Deference*).

  However, that describes the *debate*, not your specific *feeling*. The specific deficit you are identifying—the gap between accepting a verdict and grasping the reason—is best labeled **A Deficit of Moral Understanding** (following Hills).

  But that doesn't quite capture the emotional weight of the "fraud" feeling or the autonomy issue. The literature often treats these separately (epistemologists talk about understanding; ethicists talk about autonomy). You are experiencing them simultaneously.

  Since no single existing term perfectly captures the *phenomenological experience* of this cluster (the epistemic hollowness + the agential unease + the virtuous fraudulence), I am going to propose a term that synthesizes them for your use.

  I propose calling this: **Moral Testimonial Alienation.**

  **Definition:** *Moral Testimonial Alienation* occurs when an agent holds a correct moral belief acquired through deference, but experiences a sense of disconnection from that belief because it lacks the integrated grasp of reasons (understanding), the exercise of will (autonomy), and the characterological depth (virtue) that comes from first-order moral engagement.

  ### Boundary Cases: Where does it apply?

  You asked about law and aesthetics. This is where the concept gets sharp.

  **1. Legal Conclusions (The Judge)**
  *   **Verdict:** *Not* Moral Testimonial Alienation.
  *   **Why:** Law is authoritative, not necessarily truth-tracking in the moral sense. When a judge rules, they create an obligation. You don't need to understand *why* the statute implies the verdict to be bound by it. The "law" is the external authority. Deferring to a legal expert is like the GPS: it is instrumental compliance with a system. You are not required to autonomously derive the law to be a good citizen; you are required to obey it.

  **2. Aesthetic Conclusions (The Film Critic)**
  *   **Verdict:** *Yes,* this is very close to Moral Testimonial Alienation.
  *   **Why:** Kant argued that aesthetic judgments (taste) are similar to moral judgments. If a critic tells you a movie is a masterpiece, and you say "Okay, it is," you haven't actually made an aesthetic judgment. You've made a sociological one ("The critic says it's good"). To truly judge art, you must feel the pleasure or displeasure yourself. If you defer, you are alienated from your own taste. This is why we say taste cannot be taught, only cultivated.

  **3. Scientific Consensus (The Climate Scientist)**
  *   **Verdict:** *No.*
  *   **Why:** This is like the Doctor/GPS. While the *implications* of climate change are moral, the fact *that* the planet is warming is empirical. You cannot personally verify the data. Here, deference is epistemically mandatory. You would only experience Alienation if you tried to claim you *understood* the atmospheric physics when you didn't. But believing the conclusion is not alienating; it's rational.

  ### Is it Gullibility?

  You asked if this is just being unreflective.
  **No.** Gullibility is believing without checking the *source's reliability*. You checked the source (your friend, the documentary). You were epistemically responsible.

  The "Alienation" you feel is actually a sign of *higher* moral reflection, not lower. A gullible person wouldn't feel the gap; they would just accept the verdict and feel righteous. The fact that you feel the "fraudulence" means you have an intact sense of what moral agency *ought* to feel like (autonomous, understood, integrated).

  ### Summary

  You are describing a composite phenomenon recognized in philosophy but rarely named as a single experience.
  1.  **Epistemically:** It is a lack of **Moral Understanding** (Hills).
  2.  **Agentially:** It is a state of **Heteronomy** (Kant).
  3.  **Characterologically:** It is a lack of **Virtuous Integration** (Aristotle).

  If you want to talk about this with your friend or in your own head, I suggest using **Moral Testimonial Alienation**. It acknowledges that the belief is true (you aren't wrong), the source is reliable (you aren't gullible), but the *mode of holding the belief* leaves you disconnected from the moral reality of it.

  The cure, as you intuitively sensed, is not to reject the friend's advice, but to treat it as a prompt for your own reasoning. Use her verdict as a hypothesis, then do the work to derive the conclusion yourself. That bridges the gap between "being told" and "seeing."
