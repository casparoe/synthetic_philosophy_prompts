answer: |-
  This is one of the most formidable objections to computationalism in the philosophy of mind and cognitive science. You have articulated it precisely. Below I identify the established terminology, trace the lineage of the argument, evaluate the standard replies, and address your specific concerns about regress, functionalism, and edge cases.

  ### 1. Names and Lineage

  There is no single, universally standardized name, but the problem is most commonly referred to as **The Computational Triviality Argument** or **The Triviality Objection**. When the conclusion is accepted (that everything computes), it is called **Pancomputationalism**.

  The two most famous formulations come from **Hilary Putnam** and **John Searle**.

  *   **Putnam's Triviality Theorem:** In *Representation and Reality* (1988), Putnam argued mathematically that any open physical system with enough states can be mapped onto any finite state automaton. If the system moves through physical states $P_1, P_2, P_3...$, and the computer moves through logical states $L_1, L_2, L_3...$, one can simply define a mapping function where $P_1 \to L_1$, etc. Since physical systems change states over time, they can be interpreted as running any program.
  *   **Searle's Syntax Argument:** In *The Rediscovery of the Mind* (1990), Searle argued that "syntax is not intrinsic to physics." He used the example of a wall: "Is the wall a word processor?" He argued that you can find a pattern of molecular movements in the wall that is isomorphic to the formal structure of WordPerfect, but this is only true relative to an observer who assigns those symbols. For Searle, computation is observer-relative, unlike mass or charge.

  **Proposed Precise Definition:**
  If you require a label that distinguishes this from general functionalism worries, I propose: **The Implementation Indeterminacy Problem**.
  *   **Definition:** The problem that arises when the criteria for mapping physical states to computational states are sufficiently permissive that (a) nearly any physical system counts as implementing nearly any computation, and (b) the fact of implementation depends on an external interpretive scheme rather than intrinsic physical properties.
  *   **Distinction from Artifact Function:** The function of a screwdriver is interest-relative (it is a screwdriver only because we *use* it to drive screws). The worry here is stronger: it suggests that even *intrinsic* physical descriptions fail to pin down computation without an interpreter. If computation is like "being a screwdriver," then brains don't *intrinsically* compute; we just *use* them as computers.

  ### 2. Main Strategies for Answering

  Philosophers of computer science and mind have developed four main strategies to restrict the mapping and save computationalism from triviality.

  #### A. The Counterfactual Constraint (Chalmers, Copeland)
  **The Idea:** It is not enough that the physical states *actually* follow the computational sequence. The system must support the right *counterfactuals*. If the input had been different, the physical state would have changed in the specific way the program dictates.
  **The Response to Triviality:** A rock flowing with water follows one path. It does not have the disposition to follow *other* paths had the input changed. Therefore, it lacks the modal structure of a computer.
  **The Regress Worry:** Putnam anticipated this. He argued you can group physical states disjunctively (e.g., Physical State $A$ or $B$ counts as Logical State $1$) to manufacture the counterfactual support. However, **David Chalmers** refined this by arguing that the mapping must preserve *causal structure*, not just state succession. The physical states must causally mirror the logical transitions.

  #### B. The Mechanistic Account (Piccinini)
  **The Idea:** This is currently the most robust naturalist response. **Gualtiero Piccinini** argues that computation is a **mechanical process**. A physical system computes only if it contains a mechanism whose function is to manipulate "vehicles" (physical states) according to rules.
  **The Response to Triviality:** A rock has no functional components. It has no mechanism designed (by evolution or engineering) to manipulate vehicles. The mapping is not just about state correspondence; it is about *causal organization for the sake of processing*.
  **Does it stop the rock?** Yes. On this view, a rock does not compute $\pi$ because it lacks the functional organization. The computation is not in the eye of the beholder; it is in the causal architecture.
  **Success:** This successfully relocates computation from "abstract mapping" to "concrete mechanism."

  #### C. The Semantic Account (Shagrir, Fodor)
  **The Idea:** Computation requires representation. A system only computes if its states have semantic content (they are *about* something).
  **The Response to Triviality:** The water on the rock does not *represent* the digits of pi. It just moves.
  **The Regress Worry:** This risks a homunculus regress (who assigns the meaning?) or naturalizing problems (how does physics get semantics?). Many mechanists (like Piccinini) reject this, arguing for "medium-independence" without requiring full-blown semantics.

  #### D. The Pragmatic/Interest-Relative Account (Fodor, some Pragmatists)
  **The Idea:** Accept the triviality but deny it matters. Computation *is* observer-relative, but it is a useful description for systems like brains.
  **The Response to Triviality:** Yes, the wall computes WordPerfect, but that description is useless. The brain computes a predictive model because that description is explanatorily powerful.
  **The Regress Worry:** This concedes your second worry: computation is a projection. Many realists find this unacceptable for a science of the mind.

  ### 3. Evaluating Success and the Regress

  You asked: *What stops the relation [between dynamics and computation] from being just one more labeling choice?*

  The **Mechanistic Account (Piccinini)** is the strongest defense against this. It argues that the "labeling" is constrained by **objective causal powers**.
  *   **The Argument:** A transistor switches because of its electrical properties, not because we label it "1". A neuron fires because of ion channels. These causal powers exist independently of observers.
  *   **Stopping the Regress:** The regress stops at the level of **causal structure**. We do not choose that voltage causes current; that is a law of nature. If a system is organized such that specific causal interactions reliably transform specific physical vehicles (voltages, spikes) in a way that is isomorphic to a formal rule, it computes *objectively*.
  *   **Why the Rock Fails:** The rock has causal powers, but they are not organized into functional components that manipulate vehicles. The "mapping" to $\pi$ requires a gerrymandered, disjunctive grouping of states (e.g., "this specific molecular configuration OR that one counts as '1'") that does not respect the system's actual causal boundaries.

  **Verdict:** The Mechanistic Account succeeds in making it false that the rock computes $\pi$, provided one accepts that "mechanism" and "function" can be naturalized (e.g., via etiological accounts of function in biology).

  ### 4. Interaction with Functionalism

  You asked how this interacts with the idea that mental states are individuated by roles.

  *   **The Threat:** If computational roles are trivial (anything can play any role), then functionalism collapses. If "pain" is defined by its causal role, but a rock can play that role under some mapping, then the rock feels pain.
  *   **The Resolution:** Functionalists must adopt the **Mechanistic Constraint**. Mental states are individuated by roles *within a specific kind of mechanism*. It is not enough to have the abstract causal graph; you must have the right *physical realization* of that graph that supports the relevant counterfactuals.
  *   **Key Distinction:** Functionalism is not about *any* causal role; it is about the causal roles *actually played by the nervous system*. The triviality argument shows that abstract causal graphs are easy to find; it does not show that the *specific, biologically grounded* causal graph of the brain is easy to find in a rock.

  ### 5. Edge Cases

  Here is how the Mechanistic/Counterfactual view handles your specific edge cases:

  1.  **Analog Computers:**
      *   *Status:* They compute.
      *   *Reasoning:* They manipulate continuous physical quantities (voltages) according to rules (differential equations). The triviality argument applies to them too (Putnam's proof covers continuous systems), but the mechanistic constraint saves them. An analog computer has components (integrators, amplifiers) organized to manipulate the quantities. A river does not.
  2.  **Ordinary Laptops with Degraded Components:**
      *   *Status:* They still compute, but noisily.
      *   *Reasoning:* As long as the mechanism is intact enough to support the relevant counterfactuals with high probability, it computes. If the degradation is so severe that the causal structure breaks (e.g., the CPU melts), it stops computing. There is a fuzzy boundary, but it is a boundary of *mechanical integrity*, not interpretation.
  3.  **Brains Under Anesthesia:**
      *   *Status:* Dispositionally computational, but not actively computing.
      *   *Reasoning:* The mechanism is present (the neurons and synapses exist), but the global workspace or specific processing loops are chemically suppressed. Like a laptop in sleep mode, it retains the *capacity* to compute because the functional organization is preserved, even if the current state is inactive. This distinguishes it from a rock, which lacks the capacity entirely.

  ### 6. Conclusion and Recommendation

  The worry you have is **The Computational Triviality Problem** (specifically the **Implementation Indeterminacy** variant).

  *   **Is it fatal?** No, not if you reject the idea that computation is *merely* a mathematical mapping.
  *   **The Winning Strategy:** The **Mechanistic Account of Computation** (championed by Gualtiero Piccinini).
  *   **Why it works:** It treats computation as a natural phenomenon (like digestion or photosynthesis) rather than a mathematical abstraction. Digestion is not just "breaking down molecules" (a rock eroding counts); it is the breakdown of food by a specific biological mechanism for the sake of energy. Similarly, computation is the manipulation of vehicles by a mechanism for the sake of processing.
  *   **The Line:** The line is drawn at **functional organization**. The rock has no functional parts. The brain does. The mapping is not imposed by us; it is discovered by analyzing the causal architecture.

  If you want to pursue this further, look into **Gualtiero Piccinini's *Physical Computation: A Mechanistic Account* (2015)**. It is the most rigorous attempt to solve exactly the problem you described without retreating into observer-relativity.
