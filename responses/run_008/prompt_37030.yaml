  When mechanistic interpretability researchers claim a neural network represents money laundering, are they describing an objective fact about the architecture, or projecting a narrative onto weights? Suppose a sparse autoencoder isolates a clean direction for concept X, while a probing classifier identifies a different direction, conflicting on borderline cases. Does this discrepancy prove there is no fact of the matter regarding what the network represents, or does it simply reveal that our definition of a feature is vague, akin to drawing a boundary around a physical object that exists independently of the map?

  Realists argue that the network is a physical, causal system defined entirely by its weights and activations. These parameters are objective facts, independent of human observation. Thus, functional roles played by specific activation patterns must also be objective. If ablating a specific direction consistently degrades performance on money laundering tasks, that direction causally contributes to the behavior, regardless of whether a probe or an autoencoder found it first. Disagreement between tools suggests methodological imperfection, not ontological ambiguity. Tools approximate the same underlying computational reality with varying fidelity. The feature exists as a causal lever within the mechanism; our tools merely struggle to locate its precise coordinates.

  Antirealists contend that representation is inherently relational, requiring an observer to define the relevant taxonomy. Neural networks operate in high-dimensional vector spaces where infinite bases can describe the same computation equally well. A sparse autoencoder imposes a sparsity prior, while a probe imposes a linear separability prior; neither is privileged by the model itself. Concepts like sycophancy are human social constructs, not native variables in the gradient descent process. When tools disagree, it reveals that the network does not contain a singular, discrete module for that concept, but rather distributes the computation across overlapping circuits. We project structure to make them intelligible, but claiming one projection is the true reality mistakes the map for the territory.

  The mountain analogy captures the vagueness of boundaries but fails to capture the functional nature of features. A mountain exists regardless of where we draw the contour line, but a neural network feature is defined by its function, not just its geometry. If two boundaries imply different causal mechanisms, they are not just different maps of the same terrain; they are claims about different engines. Disagreement often reflects different functional hypotheses, not merely fuzzy edges.

  I side with causal realism. The computation is real, even if the semantic label is an artifact. The network objectively processes information in specific ways that correlate with human concepts. When tools disagree, it is usually because one tool has found a more causally robust direction than the other. We should not retreat into instrumentalism simply because high-dimensional geometry is complex. If intervening on a direction changes behavior predictably, that direction represents a real computational feature. Ambiguity lies in human language mapping onto continuous mathematics, not in the existence of the underlying computational structure. Denying this ultimately denies scientific explanation in AI.
