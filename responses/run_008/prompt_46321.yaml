      *   All good.

      *   *Final check:* "let the form carry the argument rather than merely decorate it."
      *   The repetition of the demand/refusal despite the swelling middle lines *is* the argument (invariance vs infinity).
      *   The rival mugger stanza uses the form to show the identical demand (Refrain) despite different claims (Middle line).
      *   The ending leaves them side-by-side.
