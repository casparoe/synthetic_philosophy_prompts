      *   Sets the scene. Good.

      *   *Wait, S6 b:* "The numbers swell beyond our sight."
      *   Summarizes the problem. Good.

      *   *Final check on Refrain Order:*
          *   S1: A1, b, A2
          *   S2: a, b, A1
          *   S3: a, b, A2
          *   S4: a, b, A1
          *   S5: a, b, A2
