answer: |-
  Give me five dollars today.
  The pavement glows in fading light.
  I turn and walk away.

  The logic tries to make me stay.
  He swears he holds the power of might.
  Give me five dollars today.

  Though expected value says to pay,
  To save vast towers of lives from night.
  I turn and walk away.

  A rival speaks the words to say.
  He promises a greater height.
  Give me five dollars today.

  An ancient wager fades to gray,
  Where faith was bet for heavenly right.
  I turn and walk away.

  The equation will not sway.
  The numbers swell beyond our sight.
  Give me five dollars today.
  I turn and walk away.
