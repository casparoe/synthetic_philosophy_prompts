      *   Maybe "Where faith was bet for heavenly right."
      *   "Where souls were wagered for the right."
      *   Let's go with "Where faith was bet for heavenly right."

      *   *Wait, S3 b:* "To save vast towers of lives from night."
      *   "Towers of lives" hints at exponent towers. Good.

      *   *Wait, S2 b:* "He swears he holds the power of might."
      *   "Might" as in power/resources. Good.

