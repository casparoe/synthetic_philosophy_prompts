      *   *One small adjustment:* S4 a-line "A rival speaks the words to say."
      *   "Say" rhymes with "Today/Away".
      *   "A rival speaks the words to say." -> A bit clunky.
      *   "A rival comes to block the way." (Generic).
      *   "A rival asks the sum this way." (Better).
      *   "A rival demands the price today." (Wait, "today" is in Refrain).
      *   "A rival speaks the same array." (No).
      *   "Another voices the same pay." (No).
      *   "A rival utters the same lay." (No).
      *   "A rival speaks the words to say." is okay. It implies the refrain is the words.
      *   How about: "A rival speaks the line to say."
      *   How about: "Another asks the same, they say."
      *   Let's try: "A rival demands the same today." (Repeats "today" from refrain? No, refrain is at end).
      *   But "today" is the rhyme word. I can't use "today" in the 'a' line if it's the refrain word?
      *   In villanelles, the 'a' lines rhyme with the refrains. They can use the same rhyme sound, but usually different words to avoid redundancy, unless intentional.
      *   Refrain: "Give me five dollars to-day."
      *   S4 a: "A rival demands the same to-day." -> Too repetitive.
      *   S4 a: "A rival speaks the words to say." -> "Say" rhymes with "Day". This is safe.
      *   Let's stick with "A rival speaks the words to say."

