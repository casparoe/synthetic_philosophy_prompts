answer: |-
  # Session Plan: The Limit Wager

  **Objective:** Students will experience the structural difference between a determinate infinite limit (Cauchy convergence) and an indeterminate infinite oscillation (Thomson's Lamp) through a wagering mechanism that fails in the second case.
  **Time:** 50 Minutes
  **Materials:** 50 paper tokens ("Logic Chips"), 30 small slips of paper ("Wager Slips"), a small object (eraser/token), a lamp or switch (or a drawn box on the board you shade/unshade), whiteboard, marker, phone stopwatch.

  ## 1. The Payoff Scheme (Decision & Rationale)
  **Decision:** I am overriding your suggestion of a prediction market.
  **Reason:** A market implies that a "correct price" exists and can be discovered through aggregation. In the Thomson case, there is no correct price. A market would merely visualize confusion. Instead, use a **Fixed-Odds Wager**.
  *   **Currency:** Paper tokens (3 per student to start).
  *   **Mechanism:** Students write their name and bet on a slip.
  *   **Payout:**
      *   **Game 1:** Correct bets pay 2 tokens. Incorrect pay 0.
      *   **Game 2:** **No payouts are made.** All tokens are returned to the pot.
  *   **Why:** In Game 2, the inability to pay winners *enacts* the philosophical problem. The breakdown of the economy mirrors the breakdown of bivalence.

  ## 2. Minute-by-Minute Timeline

  ### 0:00 – 0:05: Setup & Distribution
  *   **Action:** Arrange chairs in a tight circle. Distribute 3 tokens to each student.
  *   **Script:** "We are running two simulations of infinite processes. You will wager tokens on the final state of the system. Read the rules on the board. Do not discuss your bets. You have 2 minutes to place your wager for Round 1."
  *   **Board:** Write the **Universal Constraint**: *"The physical demo will stop at 60 seconds. Your bet is on the state defined by the **rule** at exactly 60 seconds, not the physical position of the object when I buzz."*

  ### 0:05 – 0:17: Game 1 (The Convergent Race)
  *   **Setup:** Place the eraser 1 meter from a wall (or mark a line on the floor).
  *   **Rule:** "At $t=0$, the eraser is at 0m. At $t=30s$, it moves to 0.5m. At $t=45s$, it moves to 0.75m. At $t=52.5s$, it moves to 0.875m. Each move covers half the remaining distance. The interval between moves halves each time."
  *   **Action:**
      1.  Students write bets on slips: **"Where is the eraser at $t=60s$?"** (Allow any numerical value).
      2.  Collect slips in a box.
      3.  **Demo:** You (or a volunteer) move the eraser. Start slow, then accelerate. 0.5... 0.75... 0.875... Get visibly frantic near the end. Buzz at exactly 60s.
      4.  **Settlement:** Ask the class: "What is the limit of the sequence $1/2, 3/4, 7/8...$?" Elicit "1".
      5.  **Pay:** Return slips. Anyone who wrote "1" (or "1 meter") gets 2 tokens.
  *   **Pedagogical Goal:** Establish that infinite steps can define a precise, unique endpoint.

  ### 0:17 – 0:29: Game 2 (The Oscillating Switch)
  *   **Setup:** Use the lamp switch or a box on the board (Open/Closed). Start state: **OFF/Open**.
  *   **Rule:** "At $t=30s$, toggle state. At $t=45s$, toggle state. At $t=52.5s$, toggle state. Interval halves each time."
  *   **Action:**
      1.  Students write bets: **"Is the lamp ON or OFF at $t=60s$?"** (Only these two options allowed).
      2.  Collect slips.
      3.  **Demo:** Repeat the acceleration. OFF $\to$ ON $\to$ OFF... Buzz at 60s.
      4.  **Settlement:** Do **not** reveal a winner. Do **not** pay.
      5.  **The Crisis:** Ask: "Who won?" Wait for the confusion. "Why can't I pay you?"
  *   **Pedagogical Goal:** Create the visceral experience of underdetermination. The rules were followed, but the outcome is undefined.

  ### 0:29 – 0:35: The Settlement Crisis (Transition)
  *   **Action:** Return all tokens to students (no profit, no loss).
  *   **Script:** "In Round 1, the rules forced a result. In Round 2, the rules ran out. I cannot pay winners because the game description does not contain a fact of the matter about the final state. Keep this feeling of frustration. Now we analyze why."

  ### 0:35 – 0:50: Debrief & Formal Mapping
  *   **Board Work:** Draw two number lines.
      *   **Left (Game 1):** Plot positions $1/2, 3/4, 7/8$. Draw the limit point at 1. Label: **Convergent Sequence**.
      *   **Right (Game 2):** Plot states $0, 1, 0, 1$. Label: **Oscillating Sequence**.
  *   **Discussion Questions:**
      1.  "In Game 1, why was '1 meter' the only correct answer?" (Elicit: The distance to the wall goes to zero. The sequence gets arbitrarily close and stays there.)
      2.  "In Game 2, why did the betting market collapse?" (Elicit: The state never settles. It depends on the parity of infinity, which isn't defined.)
      3.  **The Closer:** "If I offered you 100 tokens to fix Game 2 so I *could* pay a winner, what rule would you add?" (Elicit: Continuity? "It stays in the last state"? "It turns off"?).
      4.  **Final Point:** "Adding that rule isn't discovering a fact; it's a **completing stipulation**. Thomson's Lamp shows that not all infinite tasks have outcomes determined by their steps."

  ---

  ## 3. Honest Limitations (What You Must Supply)
  You correctly identified that you cannot perform a supertask. Here is the specific philosophical gap you must bridge in the debrief:

  1.  **The Physical Stop:** In the demo, the last physical move happens at $t \approx 59.5s$. The state from 59.5s to 60s is static. Students *know* this.
      *   *Your Burden:* You must insist in the rules (and enforce in the debrief) that the bet is on the **mathematical limit**, not the **physical residue**. If a student says "It was Off because I saw you stop on Off," correct them: "You are betting on the *described process*, not the *performance*."
  2.  **The Nature of Time:** The game assumes time is a continuum that can be subdivided infinitely. A student might argue time is discrete (Planck time).
      *   *Your Burden:* Grant the assumption for the sake of the puzzle. "We are working in the mathematical idealization where intervals can be halved indefinitely."
  3.  **Causality:** In Game 1, the position is causally linked to the sum of movements. In Game 2, the state is causally linked to the *order*.
      *   *Your Burden:* Highlight that in Game 2, the "last cause" is missing. There is no last toggle.

  ## 4. Predictable Failure Modes & Solutions

  ### Failure 1: "The Bulb Burnout" (Physical Objection)
  *   **The Protest:** "The lamp would break if you toggled it that fast."
  *   **The Fix:** Pre-empt this in the rules. "This is a logical simulation. Assume indestructible equipment." If raised during Game 2, say: "Note that objection for the debrief, but for the wager, assume the logic holds."
  *   **Why:** This objection is category error (physics vs. logic). Don't let it derail the game.

  ### Failure 2: "The Buzzer Finger" (Meta-Reasoning)
  *   **The Protest:** "I counted 12 toggles. 12 is even. So it's Off."
  *   **The Fix:** **Speed.** Accelerate the demo so counting is impossible after step 5.
  *   **The Script:** If they claim they counted: "The physical demo is an approximation. The wager is on the *infinite* rule. If you bet on the finite count, you bet on the wrong game. Did anyone bet on the *limit*?"
  *   **Why:** This forces them to abandon empirical counting and engage with the conceptual limit, which is where the puzzle lives.

  ### Failure 3: The "Undefined" Bet
  *   **The Protest:** A student writes "Undefined" or "Neither" on their Game 2 slip.
  *   **The Fix:** **Disallow it in the rules.** "You must choose ON or OFF."
  *   **Why:** If they can bet "Undefined," they solve the puzzle intellectually before feeling the contradiction. Forcing a binary choice makes the subsequent failure to pay *visceral*. They committed to a truth value that doesn't exist.

  ### Failure 4: Silence in the Debrief
  *   **The Risk:** Students feel cheated by the non-payment and disengage.
  *   **The Fix:** Validate the frustration. "You should feel annoyed. That annoyance is the philosophical data. Why does your brain demand a payout here when it didn't in Game 1?"
  *   **Why:** Reframes their frustration as the learning objective.

  ## 5. Instructor's Cheat Sheet (Formal Mapping)
  Keep this on your phone for the debrief to ensure you hit the formal notes without lecturing.

  *   **Game 1 = Zeno/Dichotomy.**
      *   Sequence: $x_n = 1 - (1/2)^n$.
      *   Limit: $\lim_{n \to \infty} x_n = 1$.
      *   Property: **Cauchy Sequence**. The terms get arbitrarily close to each other and the limit.
  *   **Game 2 = Thomson's Lamp.**
      *   Sequence: $S_n = (-1)^n$ (or $0, 1, 0, 1$).
      *   Limit: **Does Not Exist**.
      *   Property: **Oscillatory Divergence**.
  *   **The "Completing Stipulation":**
      *   To fix Game 2, you need a rule *outside* the toggling (e.g., "The function is continuous at $t=60$").
      *   But continuity is not given by the toggles. It is an external imposition.
      *   *Lesson:* Infinite processes do not always determine their own endpoints.

  ## 6. Final Decisive Advice
  **Do not explain the difference before Game 2.** Let them assume the games are structurally identical. The shock of the payout failure in Game 2 is your primary teaching tool. If you hint that Game 2 is "tricky," you ruin the contrast. Treat both games with identical bureaucratic seriousness. The more seriously you treat the failed payout, the deeper the philosophical scar.
