  My friend and I spent way too long last night arguing about a coin flip — not one that happened, one that would happen tomorrow. She said that right now, this evening, it's already either true or false that the coin will land heads tomorrow; there's a fact about it and we just don't know which side. I said that's exactly what's wrong with how people treat the future: tomorrow's flip has no truth value yet because the outcome doesn't exist yet. So she flipped a coin, covered it with a cup, and asked whether there's a fact about that one. I said sure, obviously, it's heads or tails, we just can't see it. She said: what's the difference? In both cases you don't know. I said the difference isn't in my head — the covered coin is already heads or tails, the future coin is neither yet, because nothing in the world has made it so. She said unless physics is deterministic, in which case tomorrow's flip is just as fixed by today's state of the world as the cupped coin is, so on her view there's no difference in kind, and on mine I have to bite a bullet: either admit that in a deterministic universe future flips are already true, or explain why being fixed by the present doesn't settle truth. Then I threw Aristotle's sea battle at her — tomorrow there will be a sea battle, true or false today? — and she said it actually helps her: if it's neither true nor false that there will be a sea battle, then it's neither true nor false that there will be one or there won't be one, and that's the law of excluded middle going out the window, which she wasn't willing to swallow. I said maybe excluded middle survives and the future is just indeterminate rather than false, but honestly I was losing the thread myself by then. Can you go through our exchange and say who was right at each step, including the determinism part and the excluded middle part? I'm genuinely unsure whether I won the part I think I won. Keep it under 350 words.
