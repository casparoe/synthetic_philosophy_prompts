      *   *The "Paradox" in Engine Terms:*
          *   Engine evaluates leaf node $N$. Player B takes. Value $V_N$ assigned.
          *   Engine backs up to node $N-1$. Player A sees: If I pass, value is $V_N$ (which favors B). If I take, value is $V_{take}$ (which favors A more than $V_N$ would). So A takes.
          *   This ripples to the root. Root value = Immediate Take.
          *   *The Glitch:* To calculate the value at Node $N-1$, the engine *must* evaluate Node $N$. But if the engine plays optimally at $N-1$, Node $N$ is never reached.
          *   *Engine Assumption:* The evaluation function is static and context-independent. The value of a position depends only on the board state, not on *how* we got there or whether reaching it implies a bug in the opponent's logic.
          *   *The Human/Philosophical Objection:* If I am at Node $N-1$, and the game hasn't ended, it implies my opponent didn't take earlier. If they are "rational" (optimal), they would have taken. Since they didn't, my model of them ("they play optimal minimax") is falsified. Therefore, I should update my evaluation function for the remaining nodes. The engine doesn't update its eval function mid-search based on the fact that a node was reached.

