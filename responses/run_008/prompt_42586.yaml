answer: |-
  A national consumer safety board evaluates a mandatory firmware patch for 300 million smartphones. With the patch, every device incurs a single, ten-second audio dropout during a voice call once per year, a sudden, jarring silence where voice data drops, causing a stutter in speech. Without the patch, the devices function smoothly, but in exactly three cases annually, the battery will overheat, causing a permanent, quarter-sized scar on the user's hand, a sudden, jarring heat where skin blisters, causing a mark on flesh. The dropout is a temporary interruption of sound. The scar is a permanent interruption of skin integrity.

  **The Verdicts**
  The strict aggregator sums the disvalue. Three hundred million people suffering a ten-second interruption amounts to roughly 9.5 years of cumulative lost communication. They weigh this against three permanent scars. To the aggregator, 9.5 years of human time is a heavier burden than three localized injuries; the patch is mandatory. Your no-aggregation view looks at the choice from the perspective of the individuals. For any single person, a ten-second stutter is not worse than a permanent scar. Since you refuse to sum the stutters across different people to outweigh the scar, you must conclude that the state cannot impose the patch. The three people get scarred.

  **The Variants: Statistical vs. Identified**
  This is where your view faces the squeeze. In the **Identified Variant**, we know the serial numbers of the three phones that will overheat. Your view is consistent: you cannot harm three people severely to save 300 million people from a triviality. You let the three burn. In the **Statistical Variant**, we do not know which phones will fail; every user faces a 1-in-100-million risk of scarring versus a 100% certainty of the ten-second dropout.

  If your view treats these differently—say, allowing the patch in the Statistical case but forbidding it in the Identified case—you risk covert aggregation. In the Statistical case, you are essentially summing the *expected* harm: 300 million people $\times$ (1/100m risk of scar) = 3 expected scars. If you mandate the patch here to avoid the "aggregate risk," you are aggregating expected utilities across persons, which violates your core principle that persons are distinct. If you treat them the same (forbidding the patch in both), you must tell the 300 million citizens in the Statistical variant that they must accept the certainty of the dropout (and the collective certainty of three scars among them) because no *individual's* risk of scarring outweighs their *own* certainty of a dropout. This forces you to argue that a 1-in-100-million chance of a scar is less significant to a person than a guaranteed ten-second stutter, which is psychologically implausible.

  **The Feature Doing the Work**
  The work is being done by the **certainty of the imposition**. The aggregator wins because the trivial harm is *distributed universally and certainly*, while the serious harm is *concentrated and probabilistic* (in the statistical variant). Your view struggles because it relies on a threshold of "seriousness" per person. When the serious harm is diluted into a risk, it often falls below the trivial harm for that individual (a 0.000001% chance of a scar < 100% chance of a stutter). The aggregator captures the intuition that a million tiny certainties add up to a big problem; your view captures the intuition that one big tragedy is worse than one tiny annoyance, but fails when the big tragedy is sliced into invisible probabilistic slivers.

  **The Best Attack for Your Side**
  The strongest defense you have is **Rights-Based Constraint on Imposition**. You argue that the state *imposing* a certain harm (the stutter) via mandate is a rights violation, whereas the battery overheating is a *natural risk* of the product that the state is merely *allowing*. The principle is: "The state cannot actively inflict harm, even trivial, to prevent passive harm, even severe."

  Is this principled or ad hoc? It is principled *if* you hold a deontological view of agency (doing vs. allowing). However, it looks ad hoc in this context because the "passive" harm is fully foreseen and preventable by the same mechanism (the mandate). If the state has the power to prevent the scar and chooses not to, the distinction between "inflicting the stutter" and "allowing the scar" rests entirely on your refusal to aggregate the stutters. If you admitted the stutters aggregated, the "infliction" would be justified. Thus, the rights constraint often functions as a placeholder for the no-aggregation rule, making the defense circular: "I can't aggregate to justify the imposition, so the imposition is forbidden." To make it stick, you must argue that the *nature* of the trivial harm (a mandate on property/use) violates autonomy in a way that the risk of physical injury does not, regardless of the sums. That is a hard sell when the physical injury is permanent and the autonomy violation is ten seconds.
