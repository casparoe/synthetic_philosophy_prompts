answer: |-
  **Verdict:** The argument goes wrong in **Step 2**.

  Your friend is equivocating on what counts as the "best explanation." He is treating *predictive utility* (we can guess what it will do) as identical to *agential unity* (it is doing it for a reason). To save the ant colony and yourself while blocking the market and the corporation, you must tighten the criteria in Step 2 to require **Homeostatic Unity** and **Intrinsic Teleology**.

  Here is exactly how you block the slide without losing the colony or yourself.

  ### The Slip in Step 2
  Step 2 claims that for the colony, the market, and the corporation, the "best explanation" is at the level of the whole. This is false.

  *   **For the Ant Colony:** The "best explanation" is intentional *because the goals exist only at the colony level.* No ant wants the nest to survive; only the colony wants the nest to survive. The colony acts as a single homeostatic system to regulate temperature, food intake, and defense. It fights entropy.
  *   **For the Market:** The "best explanation" is *statistical*, not intentional. The market has no goals. It does not "want" to be efficient; it does not "fear" a crash. The goals (profit) exist entirely at the level of the individual traders (the "ants"). The market is an aggregate of competing intentions, not a unified intention.
  *   **For the Corporation:** The "best explanation" is *legal*, not biological. A corporation has a goal (profit), but it lacks **physical homeostasis**. If you cut a corporation in half, it does not bleed or heal; it litigates. Its "survival" depends on external legal recognition, not internal physical regulation.

  ### Why This Saves You (The Neuron Problem)
  You worried that blocking the market blocks you, because your neurons are "dumb automatons" just like ants or traders.

  The distinction is **Homeostatic Unity**.
  *   **You:** Your neurons are dumb, but they are causally integrated into a single physical system that actively maintains its own state (body temperature, blood sugar, structural integrity). Your "self" is the control loop of that physical unity.
  *   **Ant Colony:** The ants are dumb, but they are causally integrated via pheromones and physical contact into a single system that actively maintains its own state (nest temperature, food storage). The "colony" is the control loop of that physical unity.
  *   **Market:** Traders are smart (or dumb), but they are *not* causally integrated into a single physical system. They do not regulate the "market's temperature." They do not heal the market when it crashes. There is no control loop.

  Therefore, you can accept that "dumb parts make a smart whole" without accepting that "any collection of parts makes a smart whole." The parts must be woven into a **single, self-preserving physical fabric**.

  ### Why This Blocks the Corporation
  This is the hardest case, because corporations *do* act like they want to survive. However, they fail the **Intrinsic Teleology** test.

  *   **Ant Colony/You:** Your goal (survival) is intrinsic to your physical existence. If the law disappears tomorrow, you and the colony still try to survive.
  *   **Corporation:** Its goal (profit/existence) is extrinsic, granted by a legal charter. If the state dissolves the corporation, it does not "try to survive" in the wild; it ceases to be. Its "mind" is a fiction supported by lawyers, not by a self-correcting physical process. Employees go home at night; the "brain" turns off. The ant colony never sleeps.

  ### The Cost of Rejecting Step 2
  By rejecting your friend's loose version of Step 2, you pay one specific cost: **You must abandon Pure Functionalism.**

  You cannot claim that *any* pattern that looks like a mind *is* a mind, regardless of substrate. You must admit that **physical continuity and biological homeostasis matter.** A perfect simulation of an ant colony on a computer, where the "ants" are code, would not have a mind under this view, because it lacks the physical stakes of homeostasis.

  If your friend asks, "But what if the simulation is perfect?" you must say: "Then it is a map, not a territory. It predicts the colony, but it isn't the colony."

  ### Summary
  *   **Step 2 is the error.** It conflates *aggregative statistics* (market) and *legal fictions* (corporation) with *emergent biological agency* (colony/human).
  *   **The Fix:** Require **Homeostatic Unity** (the system physically fights to maintain its own state) and **Intrinsic Teleology** (the goal exists only at the macro level and is not dependent on external law).
  *   **Result:** You keep the Ant Colony (it regulates heat/food). You keep Yourself (you regulate body/brain). You lose the Market (it has no goals, only prices). You lose the Corporation (it has no physical body, only legal status).

  Your friend's argument relies on the intuition that "pattern = mind." Your counter-argument is "pattern + physical self-preservation = mind." This is the only stable ground that lets you keep Aunt Hillary without inviting the Stock Market to dinner.
