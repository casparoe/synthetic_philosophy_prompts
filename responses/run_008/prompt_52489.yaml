answer: |-
  1. At a fertility clinic, a couple possesses a single viable embryo carrying a known genetic variant associated with a severe metabolic disorder. They must choose immediately between implanting this embryo or discarding it, with no alternative pathways to parenthood available.
  2. Clinical data indicates a 4% chance the child will develop a painful, cognitive-impairing form rendering life not worth living, and a 96% chance of a fully flourishing life with normal longevity. The suffering involves chronic neuropathic pain, while the flourishing includes deep relationships and career achievement.
  3. Applied to outcomes, the 4% branch constitutes a moral wrong because creating a miserable life makes the world worse, while the 96% branch yields no moral credit because creating a happy life does not make the world better. Consequently, the gamble risks a definitive moral violation for no possible moral improvement, rendering the act impermissible.
  4. The total view calculates positive expected welfare by weighing the massive benefit of the flourishing life against the small disutility of the miserable one, typically permitting the implantation. Ordinary intuition aligns with this, judging the small risk acceptable given the high probability of a wonderful life.
  5. The tension arises because the asymmetry evaluates states of affairs rather than risky acts, failing when a single act mixes potential wrongs with potential neutrals. Dialing the bad outcome probability to zero permits the act, while dialing it to one forbids it, so handling the middle ground via ex ante evaluation requires counting expected welfare and forces convergence on the total view.
