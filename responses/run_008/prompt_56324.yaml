          *   *Analysis:* If the harm was truly unforeseeable (C3), and blame requires foreseeability (C2), then blaming the Executive (C7) violates C2. If you blame the Executive anyway to satisfy C1 (No Gaps), you violate C5 (Desert - they didn't *do* wrong in a specific sense).
          *   *Severity:* High. This is the core philosophical knot.
          *   *Fix:* Modify C2 or C7.
          *   *Cost:* Modifying C2 weakens the protection against scapegoating. Modifying C7 admits gaps exist in specific individual blame (pushing it to C4/C6).

      *   **Conflict 2: Corporate Agency vs. Individual Desert (C4 + C5 vs. C1)**
          *   *Tension:* C1 says "Somebody owns it." C4 says "Company can own it." C5 says "Blame is desert." Can a company *deserve* moral blame? Or is C4 just a legal fiction?
          *   *Analysis:* If C4 is robust (company is a moral agent), C1 is saved without violating C2/C3 (because the company knew/controlled even if individuals didn't). But C5 (Desert) is tricky for collectives.
          *   *Severity:* Medium. Depends on metaphysics of groups.
          *   *Fix:* Clarify C4/C5 relationship.
          *   *Cost:* Requires accepting collective moral agency (controversial but standard in business ethics).

      *   **Conflict 3: Risk vs. Harm (C7 vs. C3)**
          *   *Tension:* C3 says you can't foresee specific failure modes. C7 blames Executive for deploying under "known residual risk."
          *   *Analysis:* This is actually the strongest potential resolution. The Executive isn't blamed for the *specific output* (unforeseeable), but for the *decision to accept the risk profile* (foreseeable).
          *   *Severity:* Low/Apparent. This might be consistent if framed correctly.
