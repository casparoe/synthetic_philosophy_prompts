      *   *C2 (Control Principle):* Responsibility requires control/foreseeability. Blaming for unforeseeable is unfair.
      *   *C3 (ML Unpredictability):* ML generalization is open-ended. Specific failure modes are *not* foreseeable by individuals, even with good evals. It's not negligence; it's the nature of the tech.
      *   *C4 (Corporate Agency):* Organizations can be responsible agents (not just shorthand for individuals).
      *   *C5 (Desert Principle):* Blame is about desert (moral worthiness), not cost allocation. Innocent people don't deserve blame.
      *   *C6 (Strict Liability):* Comfortable with company bearing strict/no-fault liability. Compensation $\neq$ blame.
      *   *C7 (Case Verdicts):*
          *   Scenario A (Reasonable engineer catches it): Shippers are blameworthy.
          *   Scenario B (Unpredictable harm): The Executive who deployed under uncertainty is blameworthy.

  3.  **Initial Scan for Tensions:**
      *   *C1 vs. C2/C3:* C1 says someone *always* owns it. C2 says you need control/foreseeability. C3 says specific harms are *unforeseeable*. If C2 and C3 are true, C1 seems false (a gap emerges).
      *   *C2 vs. C7 (Scenario B):* C2 says blame requires foreseeability. C7 (Scenario B) blames the Executive for deploying under *uncertainty* (implying the specific harm wasn't foreseen, per C3). Is "uncertainty" the same as "foreseeability of specific harm"?
      *   *C4 vs. C5:* C4 says companies are agents. C5 says blame is about desert. Can a company "deserve" blame in a moral sense, or is that category mistake? (Less severe, more metaphysical).
      *   *C5 vs. C6:* C5 says blame $\neq$ cost allocation. C6 accepts cost allocation (liability) without blame. This actually looks *consistent*, not conflicting. C6 explicitly distinguishes compensation from blame.
      *   *C3 vs. C7 (Scenario B):* C3 says *no individual* can foresee specific failures. C7 blames the Executive. Does the Executive have a special epistemic position? Or are they being blamed for the *risk*, not the *specific harm*?

  4.  **Deep Dive into Specific Conflicts:**

      *   **Conflict 1: The "Foreseeability Trap" (C2 + C3 vs. C1 + C7)**
