answer: |-
  Open with the live demo to force a phenomenological crisis, then use that confusion to motivate the Orwellian/Stalinesque distinction before dismantling both with the Multiple Drafts model.

  ### The 90-Minute Sequence

  **0:00–0:15: The Phenomenological Hook (The Demo)**
  *   **Action:** Run the Color Phi demo immediately. Do not preface it with theory. Tell them: "Watch the dots. Tell me exactly what you see." Run it twice.
  *   **Reasoning:** Laypeople and CS folks need to feel the bug in their own software before they care about the code. If you theorize first, they will try to fit the experience into the theory. If they experience first, they will demand a theory to explain the impossibility.
  *   **Goal:** Get unanimous agreement that they saw motion and color change mid-stream, despite knowing physically only two static dots existed.

  **0:15–0:35: The Target (The Cartesian Theater)**
  *   **Action:** Define the intuition they just relied on: that there is a "place" where "it all comes together" to be experienced. Draw a simple diagram on the whiteboard: Inputs -> Processing -> **Viewer**.
  *   **Reasoning:** You need to name the enemy before killing it. Dennett isn't just arguing about color; he's arguing against the idea of a central finish line for consciousness.
  *   **Goal:** Establish that if the Theater exists, the experience they just had is physically impossible (information couldn't travel fast enough to create the mid-stream color change).

  **0:35–1:00: The Trap (Orwellian vs. Stalinesque)**
  *   **Action:** Introduce the distinction. **Stalinesque:** The brain fakes the memory before it reaches consciousness (a lie told to the Viewer). **Orwellian:** The brain sends the truth, but consciousness revises the memory afterward (history rewritten).
  *   **Reasoning:** This is the pivot point. They need to feel the tension between these two explanations. Both preserve the Theater; both require a "fact of the matter" about when the experience happened.
  *   **Derailment Absorption (Libet):** When someone brings up Libet (and they will), absorb it here. Say: "Libet is the motor version of this; Phi is the perceptual version. Both show the brain editing timestamps, but let's stick to whether the editing happens before or after the 'Viewer' sees it." This validates their knowledge without shifting the topic to motor volition.
  *   **Goal:** Show that distinguishing between Orwellian and Stalinesque requires a "true" timeline of consciousness that we cannot access.

  **1:00–1:20: The Solution (Multiple Drafts)**
  *   **Action:** Argue that the distinction is a false dichotomy. There is no Viewer, so there is no moment where the lie becomes truth. There are only various narratives being spun up in parallel.
  *   **Reasoning:** This is the positive claim. It resolves the timing paradox by denying the existence of the clock they are trying to read.
  *   **Derailment Absorption (Free Will):** When someone jumps to "No present means no free will," absorb it here. Say: "Free will requires a decider at the finish line. If there is no finish line, agency looks different, but we can't solve ethics until we solve the metaphysics of the decider. Let's finish the metaphysics first."
  *   **Goal:** Shift from "When did it happen?" to "There is no single when."

  **1:20–1:30: The Parking Lot (Unsettled Issues)**
  *   **Action:** Explicitly list what this chapter does *not* solve.
  *   **Reasoning:** Prevents the group from feeling cheated and stops the discussion from spiraling into the Hard Problem.
  *   **Goal:** End on a clear boundary of the text's scope.

  ### What to Refuse to Settle (and How)
  You must refuse to settle the **Hard Problem of Consciousness** (why there is experience at all vs. just processing). Dennett dissolves this; your group will likely want to fight it.
  *   **The Script:** "Dennett's claim here is that 'qualia' are just judgments we make. Whether you believe qualia are real things or just judgments is a bigger battle than this chapter fights. For today, we have to accept his premise: that the *timing* of the judgment is what's broken. If we fight the existence of experience itself, we can't analyze the structure of it."

  ### Commitments & Contested Flags
  By running the plan this way, you are quietly taking sides on three debated interpretations of Dennett. Be prepared if a well-read participant challenges these:

  1.  **Ontological vs. Epistemic Indeterminacy:** You are presenting Dennett as claiming there is *no fact of the matter* about whether the experience was Orwellian or Stalinesque (ontological), not just that we can't know (epistemic). This is the strong eliminativist reading.
      *   *Risk:* Some argue Dennett only means it's empirically undecidable, not metaphysically empty.
  2.  **Multiple Drafts as Theory vs. Metaphor:** You are treating Multiple Drafts as the positive account replacing the Theater, rather than just a heuristic for criticizing the Theater.
      *   *Risk:* Critics argue Multiple Drafts is too vague to be a solution.
  3.  **Demo Reliability:** You are betting the demo works cleanly enough to base the metaphysical argument on it.
      *   *Risk:* Some replication studies suggest the effect is weaker or more variable than Dennett claims. If the demo fails, pivot immediately to: "Fortunately, the philosophical point holds even if the illusion is imperfect, because the *possibility* of the illusion breaks the Theater."
