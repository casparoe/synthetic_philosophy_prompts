prompt: |-
  I got roped into leading our philosophy-of-mind reading group in two weeks because the usual guy bailed on us, and in a moment of optimism I said I'd do the Dennett chapter where he uses color phi -- two dots flashing on opposite sides of a screen, red then green, and people swear they see a single dot moving across that changes color halfway through -- to argue against the whole idea that consciousness comes together in one place at one time. The group is maybe ten people: a couple CS folks, one psych grad student, the rest are just interested laypeople who've never heard of any of this. Some know the Libet experiments, most don't.

  Don't explain phi to me, I've read the chapter twice. What I need is a plan for the 90 minutes: the order the pieces have to come in. Like, does the Orwellian vs. Stalinesque framing even land before people have felt how wierd the timing is -- do I need them shaky about "when did I actually experience the color change" before the two interpretations mean anything? I'm tempted to actually run the demo on a projector, red dot left, green dot right, rapid alternation, and let them watch their own brains lie to them, but tell me whether the demo should open the session or come after I've set up why it matters. And I can already predict two derailments: someone will bring up Libet and backwards referral of sensations, and someone else will jump straight to "so the present is fake, therefore no free will" -- tell me where in the sequence each of those gets absorbed rather than letting it eat twenty minutes. Also, what do I openly refuse to settle at this level, and how do I say that without sounding like I'm dodging?

  Give me one committed plan, not a menu of options I have to choose between -- if you think the demo-first route is wrong, say so and build the plan the other way. Start with the core of the plan in your first sentence, then the sequence with your reasoning, and flag any place where you're quietly taking a contested side (e.g. on whether the Stalinesque reading is really where Dennett ends up, or whether the multiple drafts stuff needs its own five minutes) so I at least know what I'm committing to in front of the group. I have a projector, a whiteboard, and a group that argues.
