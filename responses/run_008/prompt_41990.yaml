answer: |-
  This is one of the sharpest diagnoses of the scientific realism debate I've seen from outside the field. Your colleague's joke about survivorship bias is actually closer to the truth than most published papers, and your actuarial intuition—that this is a fight about **reference classes** rather than **base rates**—cuts directly to the methodological core of the stalemate.

  Here is the walkthrough you asked for, translated into risk-modeling terms, followed by an honest assessment of whether this knot can be untied.

  ### 1. The Actuarial Breakdown of the Debate

  Let's formalize the positions using your language.

  **The Pessimistic Meta-Induction (PMI) is a Frequency Claim.**
  *   **The Data:** A historical dataset of "successful scientific theories."
  *   **The Observation:** A high proportion of these theories posited entities (phlogiston, caloric, luminiferous ether) that do not exist.
  *   **The Conclusion:** The base rate of falsity for "successful theories" is high. Therefore, the posterior probability that current theories (quantum fields, genes, quarks) are true is low.
  *   **The Assumption:** *Stationarity.* The process generating past theories is the same as the process generating current theories. The exposure pool is homogeneous.

  **The No-Miracles Argument (NMA) is a Likelihood Claim.**
  *   **The Data:** The predictive success of current science (GPS, semiconductors, mRNA).
  *   **The Observation:** It is incredibly unlikely (a "miracle") that a model would generate precise predictions if its parameters did not map onto reality in some way.
  *   **The Conclusion:** The likelihood $P(\text{Success} | \text{Truth})$ is much higher than $P(\text{Success} | \text{False})$. Therefore, we should infer Truth.
  *   **The Assumption:** *Independence.* Current success is evidence of a different underlying causal structure than past success.

  **The Stalemate:**
  The PMI says: "Look at the loss ratio of past underwriters; they all went bust. You will too."
  The NMA says: "Look at the current profit margin; you can't make this money without actually understanding the risk."

  They talk past each other because they are weighting the evidence differently. The PMI weights the *history of entities*. The NMA weights the *current performance of models*.

  ### 2. Is Your Diagnosis Right? (Reference Classes)

  **Yes.** You have identified the primary tactical maneuver in this debate.

  The Realist response to PMI is almost exclusively a **reference class adjustment**. They argue that the historical dataset used by the anti-realist is "noisy."
  *   **The Realist Move:** "You can't compare 18th-century chemistry to 21st-century physics. The reference class should be 'mature sciences with instrumental reliability.' If you restrict the dataset to theories that had *quantitative* predictive success (not just qualitative explanation), the base rate of falsity drops."
  *   **The Anti-Realist Counter:** "That's cherry-picking (survivorship bias). You're defining the reference class as 'theories that turned out to be roughly true' and then acting surprised that the theories in that class turned out to be roughly true."

  Your colleague is right: **Both sides are guilty of reference class manipulation.**
  *   The Anti-Realist groups all "posited unobservables" together (ether and electrons look the same to them).
  *   The Realist groups all "mathematically robust predictive structures" together (Maxwell's equations survive even if the ether doesn't).

  **So, is it just a fight about evidence selection?**
  Mostly, but there is a second layer. It is also a fight about **Loss Functions**.

  ### 3. The Deeper Disagreement: What is the Model For?

  In insurance, you build models to price risk. You don't necessarily need to know *why* a car crashes, only *how often* they crash given certain variables.
  *   **Instrumentalism (Anti-Realism):** Science is like a pricing model. Its goal is *empirical adequacy* (saving the phenomena). If the "ether" variable makes the equation work, keep it. If "spacetime curvature" makes it work better, swap it. Truth is irrelevant; predictive power is the only KPI.
  *   **Realism:** Science is like a causal model. Its goal is *ontological accuracy*. We want to know if the risk factor *actually exists* or if it's just a proxy for something else.

  **The "Approximate Truth" Problem:**
  You asked if a cleaner formalization of "approximate truth" could solve this. Philosophers (like Niiniluoto) have tried to measure "truthlikeness" formally. It hasn't moved the needle.
  Why? Because "approximate truth" is not a statistical error term.
  *   In your models, error is distance from the target.
  *   In ontology, error is often *category mistakes*. Phlogiston wasn't "approximately" oxygen; it was a fundamentally different kind of stuff (a substance released during combustion vs. a substance consumed).
  *   If your model assumes the wrong *distribution* (e.g., Normal vs. Fat-Tailed), being "close" on the mean doesn't save you from ruin. Anti-realists argue theory change is often a change of distribution, not just a parameter update.

  ### 4. Can Anything Move the Needle?

  You asked for honesty on whether this is resolvable.

  **Short Answer:** No. Not in the way you hope.

  **Long Answer:** The debate is stuck because it is **underdetermined**.
  1.  **Formalization:** You cannot formalize "truth" without assuming a metaphysics, which is exactly what is being debated. It's circular.
  2.  **Case Studies:** New historical cases (e.g., analyzing the shift from Newton to Einstein) are always interpretable by both sides. Realists say: "See, Newtonian physics is still approximately true at low speeds!" Anti-realists say: "See, Newton's absolute time was completely wrong!"
  3.  **The "Ill-Posed" Verdict:** Many modern philosophers (like Bas van Fraassen or more recently, pragmatists) argue the question is ill-posed. Asking if electrons are *real* is like asking if the "average family" has 2.4 children. The concept is useful for the model, but asking if it exists "out there" independent of the model might be a category error.

  ### 5. What This Means for Your Risk Models

  Here is the practical payoff for your day job. The PMI should not make you distrust your models, but it should change *how* you trust them.

  **1. Distinguish Epistemic Risk from Ontological Risk**
  *   **Epistemic Risk:** Your model parameters are wrong. (You can hedge this with confidence intervals, stress testing).
  *   **Ontological Risk:** Your model structure assumes entities or relationships that do not exist. (e.g., assuming market correlations are stable when they are actually reflexive).
  *   **The PMI Lesson:** History suggests Ontological Risk is high. Even your best structural assumptions might be the "ether" of 2024.
  *   **Action:** Don't reify your variables. Treat your risk factors as *instrumental tools*, not discovered truths. This prevents "model worship."

  **2. The "Structural Realism" Hedge**
  The most robust version of realism is **Structural Realism**. It says: "The entities (ether) vanish, but the mathematical relations (Maxwell's equations) remain."
  *   **Application:** In pricing, trust the *relationships* (covariates that consistently predict loss) more than the *interpretation* of those covariates.
  *   If "Credit Score" predicts loss, trust the correlation. Do not necessarily trust the narrative that "irresponsible people have bad credit and drive badly." That narrative might be the phlogiston. The correlation is the structure that survives.

  **3. Embrace the "As-If" Strategy**
  Your anti-realist friend would tell you to treat your models *as if* they are true, without committing to them *being* true.
  *   This is standard actuarial practice. We assume stationarity *as if* the future resembles the past, while knowing deep down (PMI style) that regime shifts happen.
  *   The PMI doesn't mean "stop modeling." It means "assume your model is false, but useful."

  ### Summary

  Your diagnosis is correct: **The fight is about reference class selection (which history counts) and loss functions (what science is for).**

  *   **Realists** select the reference class of "mathematically stable structures" and optimize for "causal explanation."
  *   **Anti-Realists** select the reference class of "posited entities" and optimize for "predictive success."

  Neither side can win because they are playing different games. The colleague's "survivorship bias" comment is the most honest summary available: Realists point to the survivors to prove robustness; Anti-realists point to the graveyard to prove mortality. Both datasets are real.

  **For your work:** Let the PMI instill a healthy **model skepticism**. Assume your current "best science" (economic theory, climate models, medical actuarial tables) contains fundamental ontological errors, even if the predictions work. Price for the possibility that the structure itself is wrong, not just the parameters. That is the only rational response to a high base rate of theoretical falsity.
