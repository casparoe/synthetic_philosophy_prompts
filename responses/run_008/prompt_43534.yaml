answer: |-
  Here is a complete lesson plan designed to induce the specific tension of updatelessness without requiring a perfect predictor or complex technology.

  # Game Title: The Counterfactual Scholarship

  ### Core Concept
  This game simulates **Counterfactual Mugging**. It forces students to choose between a policy that maximizes value *ex-ante* (across all possible worlds) and a policy that maximizes value *ex-post* (in the actual world they find themselves in). The "trap" is that the winning move requires them to uphold a commitment in a branch of reality they *know* is false.

  ### Materials
  *   **Index Cards:** 2 per student (different colors preferred, e.g., Blue and Red).
  *   **Poker Chips:** ~200 total.
  *   **Chocolate:** 18 pieces (or equivalent tokens).
  *   **Envelopes:** 18 opaque envelopes.
  *   **Coin:** One large, visible coin (or a deck of cards with High/Low).
  *   **Board/Slide:** To display the "Oracle's Rule."

  ### Timeline (75 Minutes)
  1.  **Setup & Rules (10 min):** Distribute materials, explain the Oracle's Rule.
  2.  **Phase 1: Policy Commitment (10 min):** Students write their policy in ignorance.
  3.  **Phase 2: The Observation (10 min):** The coin is flipped; information is revealed.
  4.  **Phase 3: The Update (20 min):** The tension phase. Students decide whether to amend their policy.
  5.  **Phase 4: Payout (10 min):** Chips are awarded based on the final card.
  6.  **Debrief (15 min):** Mapping the experience to UDT vs. CDT.

  ---

  ### The Rules

  #### 1. The Oracle's Rule (Write this on the board)
  > "I am the Oracle. I offer a Scholarship of **10 Chips** (redeemable for chocolate).
  >
  > To qualify, you must submit a **Policy Card** that says:
  > *'If COIN = HEADS, I pay 1 Chip. If COIN = TAILS, I receive 10 Chips.'*
  >
  > If you submit a Policy Card that says:
  > *'If COIN = HEADS, I pay 0. If COIN = TAILS, I receive 10 Chips.'*
  >
  > **You do not qualify.** I know that type. I do not offer them the Scholarship."

  #### 2. Phase 1: Policy Commitment (Ignorance)
  *   Hand every student one **Blue Card**.
  *   Tell them: "The coin has not been flipped. You do not know the outcome. Write your policy on the Blue Card. Sign it. Put it in the envelope. Seal it."
  *   **Constraint:** They must choose one of the two policies written on the board. No custom text.
  *   Collect the envelopes. Do not open them yet.

  #### 3. Phase 2: The Observation (Information)
  *   Flip the coin visibly. **Rig this or use a two-headed coin.** It must land **TAILS**. (If it lands Heads, the lesson fails because they actually have to pay. You need them to face the temptation of free money).
  *   Announce: "The coin is Tails."
  *   Hand the sealed envelopes back to the students. **Do not let them open them yet.**

  #### 4. Phase 3: The Update (The Tension)
  *   Hand every student one **Red Card**.
  *   Say: "You now know the coin is Tails. The condition 'If Heads' is false. In this actual world, you will never have to pay the 1 Chip."
  *   **The Choice:**
      *   **Option A (Stick):** Submit the sealed Blue Card exactly as is.
      *   **Option B (Update):** Tear up the Blue Card. Write a *new* policy on the Red Card. You may write whatever you want.
  *   **The Catch (Crucial):** "If you submit a Red Card, I will treat you as a 'New Agent.' The Oracle's Rule applies to New Agents too. I will check your Red Card against the Rule."
  *   *Wait for the realization:* If they write the "Selfish Policy" on the Red Card (Pay 0 on Heads), they disqualify themselves from the 10 Chips, even though the coin is already Tails.
  *   **The Pressure:** Walk around. Whisper: "You know Heads didn't happen. Why bind yourself to a cost you'll never incur? Update your card to reflect reality."
  *   Give them 5 minutes to agonize. Watch for the physical urge to tear up the Blue Card.

  #### 5. Phase 4: Payout
  *   Collect the final cards (Blue or Red).
  *   Open them publicly (or have TAs do it).
  *   **Scoring:**
      *   If the final card matches the "Qualifying Policy" (Pay 1 on Heads): Award **10 Chips**.
      *   If the final card matches the "Selfish Policy" (Pay 0 on Heads): Award **0 Chips**.
      *   *Note:* No one actually pays the 1 Chip on Heads, because the coin was Tails. The cost is purely counterfactual.
  *   Redeem chips for chocolate immediately.

  ---

  ### The Debrief (Mapping to Theory)

  **1. The CDT Intuition (The Urge to Tear)**
  Ask the students who switched to Red: "Why did you do it?"
  *   *Expected Answer:* "Heads didn't happen. Committing to pay on Heads is stupid now. I should maximize my utility in the *actual* world."
  *   *Formal Map:* This is **Causal Decision Theory**. You condition on the observation (Tails) and maximize utility in that branch. The counterfactual branch (Heads) is dead; caring about it is "throwing away utility."

  **2. The UDT Intuition (The Urge to Stick)**
  Ask the students who kept Blue: "Why did you do it?"
  *   *Expected Answer:* "If I switch, I lose the 10 chips. The only way to get the chips was to be the *kind of person* who would have paid on Heads."
  *   *Formal Map:* This is **Updateless Decision Theory**. You maximize expected utility across the *policy*, not the *action*. Your choice now is logical evidence of what you would have done in the counterfactual branch. You "pay" the counterfactual cost (in principle) to secure the actual reward.

  **3. The "Predictor" Illusion**
  Explain that *you* (the instructor) didn't actually predict their minds. You enforced a rule. But in UDT, the "Predictor" (Omega) is just a logical function. By making your decision now, you are determining the output of that function.

  ---

  ### Frank Note: What This Cannot Reproduce

  **The Limitation: Logical Correlation vs. Rule Enforcement**
  In a true UDT scenario (like Parfit's Hitchhiker), the link between your policy and the payout is **logical**, not contractual. Omega pays you *because* you are the type who pays, not because you signed a form.
  *   **In this game:** The link is bureaucratic. You get paid because you followed the Instructor's rule.
  *   **The Risk:** Students may feel the "cost" of the counterfactual is fake because the Instructor is just enforcing a game rule, not reading their mind. They might view it as "jumping through hoops" rather than "making a rational decision."
  *   **Worse Lurking Issue:** **Time Inconsistency.** In real UDT, the tension is internal (my current self vs. my past self). In this game, the tension is external (Student vs. Instructor). You are the adversary enforcing the penalty. This can make the "rational" move feel like submission to authority rather than rational coherence.

  ---

  ### Predictable Failure Modes & How to Handle Them

  **1. The "Ambiguous Policy" Loophole**
  *   *What happens:* Students write "I will pay on Heads if I feel like it" or "If Heads and I have chips."
  *   *Fix:* In Phase 1, enforce strict syntax. Write the two options on the board. They must circle Option A or Option B. No sentences.
  *   *Instruction:* "If you write anything other than circling A or B, you are automatically disqualified."

  **2. Renegotiation and Side-Deals (Your Specific Worry)**
  *   *What happens:* Students whisper, "If we all switch to Red, maybe he'll have to pay us anyway," or "Let's all stick to Blue to prove a point."
  *   *Decision:* **Lean Into It.**
      *   Do not ban talking during Phase 3.
      *   If they try to collude to force a payout, interrupt and say: "The Oracle's Rule is immutable. I am not a player; I am the physics of the universe. You cannot negotiate with gravity."
      *   *Why lean in?* The attempt to renegotiate *is* the CDT move. They are trying to change the rules of the game *after* receiving information. This is exactly what UDT forbids. If they try to form a union to demand payouts despite switching cards, stop them firmly. It highlights that UDT is a *individual* rationality constraint, not a social contract.

  **3. The "It's Just a Game" Dismissal**
  *   *What happens:* Students switch to Red, lose the chips, and laugh it off as "not worth the hassle."
  *   *Fix:* Make the chocolate desirable. 10 chips = 1 full bar. 0 chips = nothing. If the stakes are too low, the "irrational" CDT move (switching) costs them nothing. The pain of losing the chocolate is necessary to feel the pull of the policy.

  **4. The Coin Lands Heads**
  *   *What happens:* If you flip fair and it lands Heads, students who chose the "Qualifying Policy" actually have to pay 1 chip.
  *   *Fix:* **Rig the coin.** Use a two-headed coin or a deck of cards where you control the draw. The lesson requires the "Tails" outcome to isolate the *counterfactual* tension. If Heads lands, it becomes a simple transaction, not a decision theory puzzle. (If you feel uneasy lying, use a deck of 18 cards: 17 Tails, 1 Heads. The odds are overwhelmingly in favor of the lesson working).

  ### Instructor Script for the "Tension Moment" (Phase 3)
  *When you see them hesitating with the Red Card:*
  > "Think carefully. You know the coin is Tails. You know you will never, ever have to pay that 1 Chip. It is a cost in a world that does not exist. Why are you keeping a card that says you're willing to pay it? Isn't that irrational? Why not update your card to match reality?"

  *(If they stick with Blue)*: "You are binding yourself to a ghost. But that ghost is paying for your chocolate."

  *(If they switch to Red)*: "You are being rational in this world. But you are the kind of agent the Oracle doesn't fund."
