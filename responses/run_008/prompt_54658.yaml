  So our philosophy club watched some youtube video about simulations last week and now my friend Jake thinks he's basically proven nobody knows anything, and I can't figure out where he goes wrong. His argument goes like this. (1) If I know I have hands, and I know that having hands rules out being a handless brain in a vat getting fed fake hand-experiences, then I know I'm not a BIV (that's just closure — knowledge transfers across things you know are consequences). (2) I don't know I'm not a BIV, because nothing I could point to would look any different if I were one. (3) So I don't know I have hands. (4) Nothing in that is special to hands or to vats — swap in any belief and any skeptical scenario you like (dreaming, being 5 minutes old with fake memories, whatever). (5) So I don't know anything about the external world. But here's the part where he says he's gone one better than the skeptics: (6) by the same move, I also can't rule out that I'm misreading every word of the argument or being fed fake experiences of it seeming valid, so (7) I don't know the skeptical argument is any good either — it saws off the branch it's sitting on, which he says means skepticism refutes itself and we all get to keep our hands.

  Something feels off between (5) and (6) to me — like "I don't know I have hands" and "I don't know this argument is good" aren't the same kind of claim, and maybe the skeptical reasoning only undercuts one of them — but I can't put my finger on it, and honestly Jake's version where the argument self destructs seems too convenient. Tell me which step to reject and what rejecting it costs. For what it's worth I really want to keep (1), closure seems like the one thing in here I actually understand and believe, so if you ditch it you have to explain why the transfer of knowledge "across known consequences" fails exactly here and where else it fails too. Keep it under 350 words please, our club has a rule that position papers can't run long.
