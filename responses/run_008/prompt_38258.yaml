prompt: |-
  My flatmates Maya (a physics grad student) and Dan (philosophy PhD, does philosophy of physics) got into it at dinner last week and I've been turning it over since, because honestly I couldn't follow all the moves. The topic was whether the quantum wavefunction is a real thing out there in the world or just a representation of our knowledge. Maya opened by saying it's obviously like a probability distribution in statistical mechanics: a bookkeeping device for ignorance, and just as two different probability distributions over microstates can be compatible with the same actual microstate, two different quantum states could in principle describe the same underlying physical situation. Dan countered with something called the PBR theorem, from a 2012 paper by Pusey, Barrett and Rudolph, which he said shows that if the quantum state is merely information about some deeper physical state, and independently prepared systems have independent physical states, then the theory's predictions become self-contradictory -- so the wavefunction has to correspond to something real. Maya said that just proves the theorem is only as good as its assumptions, since you can deny that preparation-independence thing, and anyway she said Bohr never claimed there was a deeper physical state for the wavefunction to be information *about* in the first place, so the theorem doesn't even touch that kind of view. Dan said a position that refuses to say what the theory is about, while waving the banner of an "interpretation," is not an interpretation but a shrug -- and he added that being ontic about the wavefunction is expensive anyway: you end up with Bohm's unobservable guiding wave or Everett's endlessly branching worlds, whereas Maya's view keeps all the same predictions with just agents and their beliefs, like the QBists say.

  Maya's closing shot was that if Dan is "realist" about the wavefunction he's committed to a real object living in configuration space, which is some enormous-dimensional abstract space and not the ordinary 3D world we actually inhabit, so his realism is weirder than her instrumentalism. Dan's last word was that "same predictions" cuts both ways -- it can't establish her view either -- and that at least the ontic pictures can explain *why* interference and entanglement happen instead of just predicting them. They eventually agreed to drop it for the sake of the dinner, and I've been stuck as the bystander ever since. Can you go through the exchange move by move and tell me who's right at each step, including where someone is talking past the other or equivocating (I have a suspicion they mean different things by "the wavefunction is just information," and that some of Dan's points only bite against one version of Maya's position and not another)? Then give an overall verdict on who comes out ahead, and -- since you can't check anything and neither can I -- please tell me which of your judgments you'd least trust, and what consideration or counterargument would make you change your mind about that overall verdict.
