  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish model-based vs model-free correctly? Sphex is arguably model-free (stimulus-response) whereas a "free" agent builds a model of the world to simulate outcomes.
      *   *Check:* Is the Libertarian translation fair? It often gets dismissed as "randomness" by compatibilists. I should represent it as a "causal break" which engineering doesn't really allow (conservation of mass/energy/information).
      *   *Check:* British English. Ensure "s" instead of "z" in behaviour/analyse. Use "whilst".
      *   *Check:* Tone. Don't be dismissive of philosophy, don't be dismissive of engineering. Bridge them.

  10. **Final Polish:** Ensure the "Residue Report" is distinct and punchy. (Proceed to generate output based on these thoughts).

