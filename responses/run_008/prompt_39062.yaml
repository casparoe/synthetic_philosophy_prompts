  hey, so I'm a second-year student taking a philosophy course on free will, and I'm also doing control engineering modules as part of my degree. This week's seminar was on "sphexishness" — the digger wasp that repeats a stereotyped behavioural sequence and can't deviate from it even when it's obviously pointless, which is meant to be the opposite of flexible, free action. My tutor keeps saying things like "mechanical rigidity" and "flexibility of response", and it struck me that these are basically control-engineering terms being used loosely. I want to actually test that.

  Restate the main positions in the free will debate — hard determinism, compatibilism of the reasons-responsiveness sort, and libertarian agent-causation — in the vocabulary I actually use day to day: feedback vs feedforward, setpoints, open-loop vs closed-loop, model-based vs model-free control, hierachical controllers, disturbances. Then translate the sphexishness idea itself: is the wasp just an open-loop controller, or a closed-loop controller with a badly chosen measured variable, or something else? And where does that leave the claim that sphexishness is the opposite of freedom — is it just a claim about controller architecture?

  Finish with a residue report: what translates cleanly, what only with distortion, and whether "freedom" has any counterpart at all in my vocabulary, or whether that's precisely the thing the philosophers are gesturing at. If the residue shows my vocabulary is missing something, say what. Please write the answer in British English.
