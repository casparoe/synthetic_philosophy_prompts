answer: |-
  Manipulation bypasses autonomy to exploit emotion; persuasion invites alignment through truth. Your goal is donor partnership, not extraction. Here is the 5-minute integrity checklist based on Kantian respect (treating people as ends, not means) and transparency.

  ### The 5-Minute Integrity Checklist
  Run these in order. If you hit a **Rewrite**, stop.

  1.  **Verifiability:** Can I prove every factual claim (stats, deadlines, matches) right now?
      *   **Pass:** Yes, with source.
      *   **Rewrite:** No, or "mostly." (e.g., reconstructed quotes).
  2.  **Autonomy:** If the reader says "no," does this email make them feel morally bankrupt?
      *   **Pass:** No. The need is clear, but the choice is respected.
      *   **Rewrite:** Yes. It implies guilt, shame, or social ostracization.
  3.  **Dignity:** Does this story treat the subject as a person with agency, or a prop for pity?
      *   **Pass:** Person-focused, specific, respectful.
      *   **Rewrite:** Object-focused, anonymous suffering, dehumanizing.
  4.  **Proportionality:** Is the emotional tone proportional to the actual need?
      *   **Pass:** Tone matches reality.
      *   **Values Call:** Where exactly that line sits is your call. (See below).

  ### The Audit
  1.  **Matching Line:** **Pass.** Verifiable (donor confirmed), urgency is real. No hidden conditions. This is legitimate persuasion.
  2.  **"Maria" Story:** **Rewrite.** Changing details for privacy is standard; reconstructing quotes is not. If you didn't record her saying it, you can't print it. It fails Verifiability. Use narrative summary instead of fabricated dialogue.
  3.  **"Neighbors" Line:** **Values Call.** Verifiable (donor list), but risks Autonomy. It leverages social pressure. It's not lies, but it leans on conformity. Use only if true for their specific zip code, not just "donors."

  ### Your Two Questions

  **1. Which steps are judgment calls dressed up as procedure?**
  Step 4 (**Proportionality**) is the trap. "How sad is too sad?" isn't factual. Internet marketing trains you to maximize urgency; nonprofit ethics requires minimizing exploitation. The checklist flags it, but you must decide if a story about a hungry kid is *necessary* to explain the need, or just *effective* at opening wallets. If it's just effective, it's likely manipulation.

  **2. Where does the checklist pass but the Director still hates it?**
  **Tone and Transactionalism.** The checklist checks *ethics*, not *vibe*. You can be technically truthful and still feel sleazy. Your director likely reacted to "poverty porn"—using suffering as a transactional tool rather than a call to solidarity. If the email feels like you're selling guilt rather than inviting help, she'll hate it even if it passes the checklist. Ask yourself: "Am I inviting them to solve a problem, or buying a feeling?"
