  # JOINT STATEMENT ON THE LIBET PARADIGM AND VOLITION
  **Date:** October 24, 2023
  **Signatories:** Dr. E. Varela (Neuroscience) & Prof. J. Dennett-II (Philosophy)

  ### I. Agreed Claims

  1.  **Replication of Core Data:** The readiness potential (RP) reliably precedes the reported time of conscious intention (W) in tasks involving spontaneous, arbitrary motor actions, and this finding has been replicated across EEG and single-unit recording modalities.
  2.  **Predictive Decoding:** Multivariate pattern analysis of fMRI data can decode upcoming motor choices above chance levels several seconds before subjects report awareness of the choice, though prediction accuracy varies by region and task constraints.
  3.  **Nature of W-Judgment:** The W-time judgment is a retrospective temporal estimation subject to known cognitive distortions (e.g., attentional lag, clock rotation errors) and does not map isomorphically to a single, discrete neural onset event.
  4.  **Scope of Paradigm:** The Libet paradigm isolates arbitrary, low-stakes motor impulses and does not directly model complex, reason-responsive deliberation or long-term planning.
  5.  **The Veto Window:** Neural data from these paradigms is compatible with the existence of a conscious "veto" process occurring between the onset of the urge and the execution of the movement; the experiments do not rule out top-down inhibition.
  6.  **Metaphysical Limits:** These experiments alone do not adjudicate metaphysical claims about determinism or moral responsibility without additional philosophical premises regarding the definition of "freedom" and "causation."

  ### II. Statement of Disagreements

  | Topic | Neuroscientist Wording | Philosopher Wording |
  | :--- | :--- | :--- |
  | **Interpretation of the RP** | The RP reflects the brain's causal initiation of the action chain, rendering the reported conscious intention a downstream observation rather than a cause. | The RP reflects subthreshold neural fluctuation or evidence accumulation that does not constitute a fixed decision until a later threshold is crossed. |
  | **Generalizability to Agency** | If consciousness cannot initiate arbitrary movements, the intuition that it initiates complex actions is an unjustified generalization from a special case. | The mechanisms governing arbitrary wrist-flicks are categorically distinct from those governing reason-based agency; the former cannot disprove the latter. |
  | **Causal Role of Awareness** | Conscious awareness arrives too late to be the *primary* cause of the action, making the feeling of authorship a post-hoc confabulation. | Conscious awareness functions as a ratifier or vetoer, which constitutes a sufficient causal role for the type of control free will requires. |

  ### III. Cruxes and Registered Predictions

  We identify two substantive cruxes where empirical or conceptual progress is possible. We agree that the following tests bear on these issues and register our predictions in advance.

  **Crux 1: The Phenomenology of W (Urge vs. Decision)**
  *   **The Issue:** Does the W-judgment measure the awareness of an *urge* to move or the awareness of a *decision* to move? If the former, the RP preceding W is trivial; if the latter, it is damning.
  *   **Agreed Test:** A modified Libet task where subjects are trained to distinguish and report two timestamps: $W_{urge}$ (awareness of the impulse) and $W_{choice}$ (awareness of the commitment to execute).
  *   **Neuroscientist Prediction:** Both $W_{urge}$ and $W_{choice}$ will significantly lag the onset of predictive neural activity (RP/decoding), confirming that the "decision" signal is neural, not conscious.
  *   **Philosopher Prediction:** $W_{choice}$ will align much closer to the action execution than $W_{urge}$, and neural decoding accuracy will spike at $W_{choice}$, indicating the "decision" is a distinct late-stage event.

  **Crux 2: Arbitrary vs. Reason-Responsive Decisions**
  *   **The Issue:** Does the neural precursors observed in arbitrary tasks scale to decisions involving reasons, values, or consequences?
  *   **Agreed Test:** An fMRI study comparing predictive decoding accuracy in (A) arbitrary button presses vs. (B) choices based on fluctuating economic value or moral reasoning.
  *   **Neuroscientist Prediction:** Predictive neural signals will precedce reported awareness in both conditions, showing that "reasoning" is also a post-hoc narrative applied to neural outputs.
  *   **Philosopher Prediction:** Predictive accuracy will drop significantly in condition (B), or the neural signals will track the *weighing of reasons* rather than the outcome, showing consciousness is part of the accumulation process.

  **Verbal Dispute Identification**
  We acknowledge a verbal dispute regarding the term **"The Decision."**
  *   **Diagnosis:** The Neuroscientist defines "decision" as the point of **neural commitment threshold** (when the motor system is irreversibly set). The Philosopher defines "decision" as the point of **reason-endorsed commitment** (when the agent identifies with the impulse).
  *   **Resolution Path:** We agree to use "Neural Commitment" and "Agent Endorsement" in future correspondence to avoid conflating the physiological onset with the psychological ratification.

  ***

