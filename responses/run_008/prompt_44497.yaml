prompt: |-
  Our institute runs structured adversarial collaborations, and the next pairing is a neuroscientist who takes the Libet paradigm and its successors to show that conscious intention is a post-hoc confabulation — a press release from the brain, not a cause of action — against a philosopher in the compatibilist tradition who holds that the experiments probe only a shallow notion of volition, something like arbitrary wrist-flicking, and are simply irrelevant to free will in any sense worth caring about. They have been arguing for years and mostly past each other. The neuroscientist leans on the readiness potential preceding the reported time of conscious intention by roughly half a second, on the fMRI decoding work pushing predictive information about an upcoming choice back to several seconds before awareness, and on the point that subjects report their W-times on a clock under conditions we know distort temporal judgment. The philosopher leans on the distinction between arbitrary movements and deliberate, reason-responsive choices, on the accumulator-model reinterpretation of the readiness potential as subthreshold fluctuation rather than a completed decision, on Libet's own veto window, and on the charge that "conscious will causes action" was never what free will needed to mean anyway. I need the document they should have produced by now.

  Please draft their joint statement. I want the claims both can sign — including about the raw findings, what has and hasn't replicated in the paradigm, and what the experiments were never in a position to test; the precise formulations of their residual disagreement, each phrased so that its own side would accept the wording as fair; the cruxes — I suspect one concerns what exactly a W-judgment measures and another concerns whether the arbitrary-movement/deliberate-choice distinction can be made to do the work the philosopher needs; and, for each crux, the experiment, argument, or conceptual case both would agree bears on it, with each side's prediction registered in advance. If part of their dispute turns out to be verbal — e.g., two different things called "the decision" — say which part and why.

  Format: a numbered agreed-claims section followed by a disagreements table, then a short prose section on cruxes with registered predictions. After the document proper, append a JSON object summarizing it, with this schema: fields "agreed_claims" (array of one-sentence strings), "disagreements" (array of objects, each with "topic", "neuroscientist_wording", "philosopher_wording"), "cruxes" (array of objects, each with "crux", "agreed_test", "neuroscientist_prediction", "philosopher_prediction"), and "verbal_disputes" (array of objects, each with "locus" and "diagnosis").
