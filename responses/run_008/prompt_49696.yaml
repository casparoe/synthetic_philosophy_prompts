answer: |-
  The 1973–1987 declassification of homosexuality in the DSM is the *locus classicus* for the debate between naturalism and normativism in the philosophy of medicine. To analyze it is to ask whether psychiatric diagnosis discovers biological facts or negotiates social values.

  **The Naturalist Position: Correction or Powerlessness?**
  For the strict naturalist (e.g., Christopher Boorse), disease is a deviation from species-typical functional design, objectively ascertainable and value-free. Confronted with the 1973 episode, the naturalist faces a dilemma. If disease is purely factual, the status of homosexuality should not have changed without new biological data. The prompt stipulates the change was driven by protest and politics, not new findings.

  To save naturalism, one must argue that the 1973 vote was a **correction of a classificatory error in light of better evidence**, where the "evidence" was the pre-existing Kinsey data (1948/1953) demonstrating that same-sex attraction was statistically normal and not inherently linked to impairment. On this charitable reconstruction, the biological facts *were* available, but they were obscured by moral bias. The 1973 vote, then, was the moment the APA finally allowed the science to override the values.

  However, this reconstruction is historically thin. If the science was sufficient in 1948, why did it require gay rights activists storming the 1970 APA convention to "discover" it? The naturalist account renders the 14-year delay inexplicable except as collective irrationality. Furthermore, the naturalist must admit that their framework is **powerless to vindicate the change** at the moment it happened. A value-free account cannot explain why the protest was justified; it can only say, in hindsight, that the values finally aligned with the facts. The naturalist is left claiming that the *process* was political, but the *outcome* was biological—a distinction the history blurs.

  **The Normativist Position: Showcase or Hostage?**
  For the normativist (e.g., H. Tristram Engelhardt, K. W. M. Fulford), disease judgments are inherently value-laden; to call something a disorder is to judge it as "bad" or "undesirable." For the normativist, 1973 is the **showcase case**. It demonstrates exactly their thesis: when social values regarding a behavior shift from "sin/deviance" to "variation/right," the disease status evaporates, regardless of biological continuity.

  The normativist must, however, confront the "hostage to pressure" critique. If psychiatric categories are determined by social values and political pressure, does psychiatry lose its epistemic authority? Does this mean that if a different pressure group won today, homosexuality could be reinstated? A sophisticated normativist accepts this risk. They argue that psychiatry, unlike oncology, deals with human behavior, which is inextricably linked to social norms. The 1973 episode confirms that psychiatric diagnosis is a **moral negotiation**, not a laboratory discovery. The "hostage" risk is real, but it is the price of acknowledging that "distress" and "deviance" are normative concepts. The removal of homosexuality was not a discovery of a new fact, but a moral correction of a previous value judgment that pathologized difference.

  **Wakefield's Harmful Dysfunction Analysis (HDA)**
  Jerome Wakefield's hybrid model requires a "dysfunction" (factual failure of a designed mechanism) and "harm" (value judgment).
  *   **On Homosexuality:** Wakefield is **vindicated**. He argues there is no internal dysfunction in same-sex attraction; therefore, regardless of social harm (stigma), it cannot be a disorder. This aligns with the 1973 removal.
  *   **On Ego-Dystonic Homosexuality:** The HDA faces a sharper test. This category remained until 1987 for individuals distressed by their orientation. Wakefield would argue that if the distress stems from social stigma rather than an internal malfunction of the anxiety-regulation system, it is not a disorder. However, this exposes a tension: ordinary anxiety disorders *are* retained in the DSM, yet they also involve distress. Wakefield must distinguish between distress caused by a broken internal mechanism (disorder) and distress caused by a conflict between a normal mechanism and a hostile environment (not a disorder).
  *   **Verdict:** Wakefield is **theoretically vindicated but historically incidental**. His framework provides the best *post-hoc* justification for why the removal was correct (no dysfunction), but it does not explain *why* it happened in 1973 (protest). Furthermore, the deletion of ego-dystonic homosexuality in 1987 suggests that even distress-based categories are unstable if the "harm" is re-evaluated as socially induced rather than internal. This leans normativist: the judgment of what counts as "internal" vs. "social" harm is itself value-laden.

  **Definite Position**
  This episode **confirms normativism**.

  While the naturalist wishes to view 1973 as the triumph of science over bias, the historical record shows the triumph of values over classification. No new biological mechanism was discovered; the "functioning" of gay people did not change. What changed was the social consensus on whether that functioning was "bad."

  A naturalist reconstruction requires us to believe the science was always clear and only waited for values to step aside. But in medicine, values determine which facts count as relevant. The 1973 vote confirms that in the absence of clear biological markers (which remain elusive for most psychiatric conditions), diagnostic categories are **social contracts**. This does not mean "anything goes," but it does mean that the authority of the DSM rests on moral legitimacy as much as empirical accuracy.

  Wakefield's compromise attempts to bridge this by anchoring "dysfunction" in evolution, but the 1973 episode shows that even the identification of "dysfunction" is subject to normative scrutiny (i.e., is distress a dysfunction or a rational response to stigma?). Therefore, the episode demonstrates that **psychiatric disease is not a natural kind waiting to be found, but a normative status conferred by a community.** The 1973 decision was not a correction of a scientific error, but a revision of a moral judgment. To claim otherwise is to misunderstand the nature of psychiatry. The normativist is right: we are not discovering diseases in these cases; we are deciding which forms of human suffering and difference warrant the label of "illness." The 1973 episode proves that when the values change, the diseases change with them.
