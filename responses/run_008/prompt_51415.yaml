answer: |-
  The cursor blinked on the shared document, a rhythmic pulse against the white void of the introductory paragraph. Vera rubbed her temples, the glow of the laptop screen reflecting in her glasses. Across the table, Ben stirred his tea, the spoon clinking softly against the ceramic. They had been at this for three hours.

  'It's vague, Ben,' Vera said, tapping the keyboard. 'We cannot open a handbook entry with "The frame problem is a puzzle about relevance." That is a platitude, not a definition. It needs to be precise.'

  Ben leaned back, stretching his arms. 'Precision is exactly what got us into this mess. You want to define it as a technical glitch in a specific kind of machinery. I am telling you it is a symptom of a deeper misunderstanding about what minds are.'

  'It is not a glitch, it is a logical constraint,' Vera corrected, her tone sharp but controlled. 'Look, before we write another word, we must disentangle the knots people keep tying. We have the frame problem proper: how a system represents that things *do not* change when an action occurs. Then we have the qualification problem: how to list all the conditions required for an action to succeed. And the ramification problem: how to account for all the indirect consequences of an action. These are distinct.'

  Ben smiled thinly. 'And then there is the version Fodor pressed, where the puzzle becomes global: how any system selects relevant information from the totality of facts without checking them all one by one. You want to carve these up neatly.'

  'Because they are technically distinct solutions,' Vera insisted. 'The first is about efficiency in state-update. The second is about exception-handling. The third is about causal propagation. If we conflate them, the entry is useless to a computer scientist.'

  'But that tidying exercise is itself revealing,' Ben countered, leaning forward. 'You separate them to save the programme. You treat them as engineering hurdles to be cleared by better logic. I see them as different facets of the same diamond: the impossibility of capturing the world in a closed set of propositions. The fact that you need three different patches suggests the underlying architecture is flawed.'

  Vera sighed, turning back to the screen. 'Let's test this on BREW. We invented the example for a reason.'

  'BREW,' Ben acknowledged. 'The domestic robot. Task: make tea. Context: the kitchen walls were repainted this morning.'

  'Precisely,' Vera said. 'BREW has a database of beliefs. It believes the kettle is on the counter. It believes the walls are blue. Now, the walls are wet paint. When BREW moves to the counter, does it update its belief about the walls? Does it check if the paint has dried? Does it check if the kettle has moved because the painters needed the space?'

  'And here is the crux,' Ben said. 'For you, BREW must explicitly represent the fact that the walls are irrelevant to the kettle's location. It must store a "non-change" axiom for every object in the room that isn't the kettle. If it doesn't, it risks assuming the kettle might have moved because the walls changed colour. That is the combinatorial explosion.'

  'Exactly,' Vera said. 'So how does it avoid checking every fact in its database against every action? That is the frame problem. It is a problem of computational tractability.'

  'But consider the human,' Ben said. 'I walk into this kitchen. I do not check the walls. I do not even represent the walls as "unchanged". I simply reach for the kettle. The irrelevance of the wall colour is not a conclusion I draw; it is a feature of my engagement. I cope with the equipment. The wall only shows up for me if it obstructs me, say, if the paint is wet and I brush against it. For me, irrelevance is not represented; it is lived.'

  'But BREW is not you,' Vera said patiently. 'BREW is a symbolic agent. If we are writing about cognitive science, we must account for systems that represent the world. If you claim the frame problem disappears for embodied agents, you are changing the subject. You are saying "the problem vanishes if we stop building the systems we are studying." That is not a solution; it is an avoidance.'

  'Is it?' Ben challenged. 'If the problem only arises for systems that treat the world as a collection of discrete facts, then perhaps the lesson is that cognition is not about manipulating discrete facts. You are assuming that relevance must be *computed*. You are begging the question by assuming that knowing something is irrelevant requires a proposition stating its irrelevance.'

  Vera paused, her fingers hovering over the keys. 'I am not assuming relevance must be computed as a proposition. I am assuming that for a system to act reliably, there must be a mechanism that distinguishes signal from noise. Whether that mechanism is logical or statistical, it must exist. If you say embodied coping bypasses this, you are assuming that coping scales. Can your phenomenological agent programme a VCR? Or navigate a tax code? When the task requires explicit manipulation of abstract relations, the "holistic grip" fails, and you are back to square one. You are begging the question by assuming embodied skills can handle arbitrarily complex, novel tasks without explicit representation.'

  Ben nodded slowly, accepting the hit. 'That is a fair strike. I will concede that when coping breaks down, when the equipment becomes conspicuous, we do indeed retreat to a more deliberative, representational mode. In those moments, the frame problem likely resurfaces for us too. We become like BREW, staring at the manual, wondering which variables matter.'

  'And I will concede,' Vera said, her voice softening, 'that the global version of the problem—the one about relevance selection generally—might not be solvable by logic alone. If context determines relevance, and context is open-ended, then no finite set of axioms can capture it. The technical frame problem might be solvable in a closed world, but the philosophical one points to a limit of formalism.'

  'So we agree it is a limit,' Ben said. 'But is it a limit of intelligence, or a limit of a specific way of modelling intelligence?'

  'Let's look at the modern landscape,' Vera suggested. 'We cannot ignore learned systems. Deep neural networks. They do not use explicit symbolic axioms. They learn features from data. Does BREW, implemented as a reinforcement learning agent, face the frame problem?'

  'In a sense, no,' Ben argued. 'The network does not store a belief that "the walls are blue". It stores weights that map sensory input to motor output. If the walls change colour, and it does not affect the affordance of the kettle, the weights do not need updating. The irrelevant features are filtered out by the architecture itself, through attention mechanisms or simply by failing to correlate with reward.'

  'But they are brittle,' Vera countered. 'Show that network a kettle painted with adversarial noise, or put it in a kitchen layout it was not trained on, and it fails catastrophically. It does not know *what* it doesn't know. The frame problem has not been solved; it has been hidden inside the training distribution. The system assumes everything outside its training data is irrelevant until proven otherwise. That is just a statistical version of the same assumption. When the world changes in a way the statistics didn't capture—like the wet paint causing a slip—the system has no way to reason about the exception. It lacks the explicit representation to handle the qualification problem.'

  'So you see it as relocating the problem,' Ben mused. 'I see it as shifting the burden. The system does not need to represent non-change because it does not represent change explicitly either. It tracks correlations. But I grant you this: if the environment shifts too far from the training distribution, the agent loses its grip. It cannot cope. It needs a new kind of stability.'

  'Which brings us back to the entry,' Vera said. 'We need an opening that acknowledges the technical origin without ignoring the philosophical critique. If we define it solely as a logic problem, we ignore fifty years of critique. If we define it solely as a myth of symbolic AI, we ignore the engineering reality.'

  Ben looked at the blank paragraph again. 'So, how do we phrase it? We need to state what it is, but also why it matters.'

  'Try this,' Vera said, typing slowly. 'The frame problem originally denoted a technical challenge in artificial intelligence: how to enable a planning system to represent the effects of actions without explicitly enumerating the vast number of conditions that remain unchanged.'

  Ben watched the cursor. 'That is your definition. It assumes the system *must* enumerate them to begin with. Add that this necessity is what is contested.'

  Vera deleted 'without explicitly enumerating' and typed: 'without requiring explicit representation of every non-effect.' She looked at Ben. 'Better?'

  'Much,' Ben said. 'But now we must mention the broader implication. Add: "While solvable within restricted formal domains, the problem is often cited as indicative of a deeper difficulty in modelling contextual relevance."'

  Vera hesitated. 'That sounds like we are saying the technical solution is a sham.'

  'No,' Ben said. 'We are saying the technical solution works for the toy, but not for the world. That is the truth, is it not? BREW works in a simulation. In the real kitchen, with the wet paint and the moved kettle, the symbolic approach struggles unless the context is rigidly constrained.'

  Vera sighed, knowing he was right about the real world, even if she defended the logic. 'Fine. But we must not imply the technical work was worthless. It clarified the structure of reasoning.' She typed: '...indicative of a deeper difficulty in modelling contextual relevance for agents operating in open environments.'

  'And,' Ben added, 'we should acknowledge that alternative architectures, such as those based on embodied interaction or statistical learning, approach the issue differently, though they face analogous challenges regarding stability and generalisation.'

  Vera paused. This was the concession. She was allowing the entry to frame the technical problem as merely one approach among others, rather than the definitive problem of cognitive science. She was conceding that the "problem" might be artefactual to the symbolic tradition, even if it remains a real engineering hurdle for that tradition.

  'That seems balanced,' Vera said finally. 'It acknowledges the technical definition but contextualises it within the broader debate about representation.'

  'And it admits that my crowd doesn't have a magic bullet either,' Ben noted, nodding at the mention of analogous challenges. 'We still have to explain how stability is achieved without explicit rules.'

  Vera read the paragraph aloud. It was dense, careful, and stripped of their individual voices, leaving only the argument. 'The frame problem originally denoted a technical challenge in artificial intelligence: how to enable a planning system to represent the effects of actions without requiring explicit representation of every non-effect. While solvable within restricted formal domains, the problem is often cited as indicative of a deeper difficulty in modelling contextual relevance for agents operating in open environments. Alternative architectures, such as those based on embodied interaction or statistical learning, approach the issue differently, though they face analogous challenges regarding stability and generalisation.'

  She looked up. 'It leans your way, Ben. It suggests the technical problem is a subset of a philosophical one.'

  Ben smiled, picking up his cold tea. 'And it leans your way, Vera. It admits the technical problem is real enough to be solvable in domains, and that the alternatives still face challenges. We both admitted the other's monster exists.'

  'Yes,' Vera said, closing the laptop slightly. 'But I suspect history will read this as me conceding that the frame problem is not just about logic. It is about the world.'

  'And I suspect history will read this as me conceding that you cannot simply wish the logic away,' Ben replied. 'Even coping requires a world that holds still enough to be coped with. Perhaps that is the real frame: the stability of the world itself, not just the representation of it.'

  Vera nodded, finally satisfied. 'Then we have our opening. Now, shall we tackle the qualification problem before lunch? I hear the cafe staff have changed the menu.'

  'Let us hope,' Ben said, standing up, 'that the price of tea has not ramified.'
