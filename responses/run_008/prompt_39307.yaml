answer: |-
  Here is a scenario built specifically to trap a deflationist, followed by the breakdown you need for your presentation.

  ### The Scenario: "The Double-Booked Mover"

  **The Setup:**
  You have two best friends, Alex and Blake. You have known them both for exactly ten years; your relationships are identical in depth and history. Both are moving out of state on the same Saturday.

  Three months ago, Alex asks you: "I can't afford movers. Will you promise to be at my place at 8:00 AM sharp to help me load the truck? I can't do it without you." You say, "I promise I will be there."

  Two months ago, Blake asks you the exact same question, using the exact same words. You check your calendar. You know Alex's move is at 8:00 AM. You know Blake's apartment is 45 minutes away in the opposite direction. You calculate that you could theoretically help Alex for an hour, then drive to Blake's. You think, *I can juggle this.* So, looking Blake in the eye, you say, "I promise I will be there at 8:00 AM sharp to help me load the truck. I can't do it without you."

  **The Conflict:**
  On the morning of the move, you wake up with a mild stomach bug. You realize that if you try to split your time, you will be too exhausted to lift safely at the second location, risking injury to yourself or damage to their goods. You have the physical capacity to fulfill *one* promise fully, but not *both*.

  You must choose: Go to Alex's and break the promise to Blake, or go to Blake's and break the promise to Alex.

  **Why this meets your specs:**
  1.  **Everyday:** No trolleys, no murderers, just helping friends move.
  2.  **Same Source:** Both obligations are explicit, verbal promises between friends. There is no "promise vs. harm" conflict for her to rank.
  3.  **Agent's Choice:** You didn't stumble into this. You knew the times and distances when you made the second promise. You voluntarily created the conflict by overcommitting.
  4.  **No Arbitrary Equality:** I didn't write "they are equally important." I built the symmetry through the narrative (same duration of friendship, same wording, same time, same stakes). Any prioritization rule (like "first come, first served") feels morally irrelevant here because the *content* of the promise is identical.

  ***

  ### The Breakdown (For your presentation)

  Here is how you walk her through the trap.

  #### 1. Her Deflationary Story
  She will likely argue one of two things:
  *   **The "Ought Implies Can" Move:** She will say that because you physically cannot do both, you are not *actually* obligated to do both. Therefore, the moment you choose Alex, the obligation to Blake vanishes. You didn't "violate" a duty to Blake; the duty was retroactively cancelled by impossibility.
  *   **The "Priority" Move:** She will argue that the promise to Alex is stronger because it was made first (chronological priority). Therefore, the all-things-considered duty is to Alex. Blake's promise was merely *prima facie* (at first glance) but never became a real duty.

  #### 2. Why the Setup Makes That Story Hard to Tell
  The trap is in the **moral residue**.
  If she is right, and the obligation to Blake simply *disappears* (either because it was overridden or because "ought implies can"), then you should not feel **guilt** toward Blake. You might feel *sadness* that things didn't work out, or *regret* that you got sick, but you shouldn't feel that you *wronged* Blake.

  But intuitively, you *did* wrong Blake. You owe Blake more than just "Sorry, I couldn't make it." You owe a specific kind of apology that acknowledges a **breach**. If the obligation had truly vanished, an apology would be unnecessary (like apologizing for rain). The fact that you feel you need to make amends suggests the obligation *persisted* even though you couldn't fulfill it.

  Furthermore, the **Chronological Priority** move fails because the *moral weight* of a promise doesn't usually depend on the timestamp. If I promise my dying mother I'll visit, and then promise a friend I'll play chess, the mother's promise wins—not because it was first, but because it matters more. In this case, the promises are morally identical. Choosing Alex over Blake isn't a moral calculation; it's a coin flip. Deflationism struggles to explain why a coin flip resolves a moral conflict rather than just selecting a victim.

  #### 3. The Specific Feature Doing the Work
  The key feature is **Culpable Impossibility**.
  In most deflationary examples (like the "Murderer at the Door"), the conflict is caused by the world (the murderer arrives). Here, the conflict is caused by *you*. You knowingly undertook incompatible obligations.
  *   If the conflict is your fault, you can't use "I couldn't do both" to erase the duty.
  *   If you could erase the duty just because you made it impossible to keep, then anyone could escape obligations by simply overbooking themselves.
  *   Therefore, the obligations must remain in force *even though* they are unfulfillable. And if two unfulfillable obligations remain in force, that is the definition of a genuine dilemma.

  #### 4. How She Will Fight Back (Be Ready)
  She will likely pivot to **Meta-Ethics**. She will say:
  *"You are confusing the feeling of guilt with the existence of a duty. You feel guilty because you made a mistake in planning, not because you violated a standing moral law. The 'dilemma' is epistemic (you don't know which to pick), not ontological (there is no actual conflict in reality). Once you pick, the reality sorts itself out."*

  She will argue that morality must be consistent. If morality demands A and demands Not-A, morality is broken. Since morality can't be broken, your perception of the dilemma must be the broken part.

  ***

  ### Honest Assessment: Who Wins?

  You asked for the truth, because you have to present this Thursday. Here is the state of the field:

  **She wins on Logic; You win on Phenomenology.**

  *   **Her Side (Deflationism):** This view (held by philosophers like Kant, R.M. Hare, and some Utilitarians) protects the idea that morality is a rational, consistent system. If genuine dilemmas exist, it implies the moral universe is contradictory (it commands you to do X and Not-X). For a logic-based ethicist, that's unacceptable. They will always win on *consistency*.
  *   **Your Side (Dilemmism):** This view (held by philosophers like Bernard Williams, Martha Nussbaum, and many care ethicists) argues that life is messy. The fact that we feel "moral residue" (guilt that doesn't go away even after we choose) proves the obligation was real. They win on *human experience*.

  **My Verdict:**
  In a classroom setting, **she technically wins** if the class is focused on normative systems (like Kantianism or Utilitarianism), because those systems are *designed* to eliminate dilemmas. If you are in a class about "Moral Psychology" or "Virtue Ethics," you win.

  **However,** the strongest argument you have is the **Culpable Impossibility** point. Most deflationists admit that if *you* create the conflict through negligence, you retain the blame for *both* outcomes. If you retain the blame for both, then for all practical purposes, it acts exactly like a genuine dilemma, even if she refuses to use the label.

  **Recommendation for Thursday:**
  Don't try to prove she is "wrong" about the nature of the universe. Instead, argue that her definition of "obligation" is too thin. Say:
  *"Even if you say one obligation vanishes 'all-things-considered,' the fact that I owe amends to the person I didn't choose proves that the obligation didn't actually vanish. It just went underground. If the result is the same (I owe a debt I can't pay), isn't 'genuine dilemma' just the more honest name for it?"*

  That forces her to defend why the *label* matters, which is a much harder fight for her than the logic itself. Good luck.
