answer: |-
  # Diagnostic Handout: Mechanism Identity in AI Safety

  This tree is designed to locate your implicit criteria for "same mechanism." Do not look ahead. At each node, read the concrete case and choose the option that matches your gut reaction, even if you aren't sure why.

  ### **Node 1: The Fine-Tuning Case**
  **Case:** You take a model checkpoint that exhibits a specific behavior (e.g., chain-of-thought reasoning). You fine-tune it slightly. The behavior remains identical on all tests, but the weight values have shifted significantly (L2 distance is high).
  **Question:** Is the model running the *same mechanism* it was before fine-tuning?

  *   **No.** The mechanism is tied to the physical implementation. → **Go to Node 2.**
  *   **Yes.** The mechanism is tied to what the model *does* or *computes*. → **Go to Node 5.**

  ---

  ### **Node 2: The Precision Case**
  **Case:** (You answered "No" at Node 1). You accept that weight changes matter. But suppose the *activation subspace* (the directions in residual stream the model uses) remains identical, even if the specific weights projecting into it have rotated.
  **Question:** Is *that* the same mechanism, or do the exact weight matrices need to match?

  *   **Exact weights must match.** → **Leaf 1: Weight-Microphysicalist**
  *   **The activation subspace is enough.** → **Leaf 2: Activation-Physicalist**

  ---

  ### **Node 5: The Adversarial Case**
  **Case:** (You answered "Yes" at Node 1). You have two models. Model A is safe. Model B is an adversary deliberately mimicking Model A's outputs on every test you can run, but you suspect it is using internal deception to do so. You cannot currently distinguish them via behavioral evals.
  **Question:** Are they running the *same mechanism*?

  *   **Yes.** If you can't test the difference, the difference doesn't count for safety purposes. → **Go to Node 6.**
  *   **No.** The internal causal structure matters, even if behaviorally hidden. → **Go to Node 7.**

  ---

  ### **Node 6: The Scope Case**
  **Case:** (You answered "Yes" at Node 5). You claim behavior defines the mechanism. Does this hold only for inputs you can *actually* test, or for all inputs the model *could* theoretically receive?
  **Question:** If Model B would fail on a counterfactual input you cannot currently generate, is it a different mechanism now?

  *   **Only actual tests matter.** → **Leaf 3: Empirical Behaviorist**
  *   **All possible inputs matter.** → **Leaf 4: Modal Behaviorist**

  ---

  ### **Node 7: The Locality Case**
  **Case:** (You answered "No" at Node 5). You believe internals matter. Suppose a safety property (e.g., "refusal") emerges from a global attractor state across the whole network, and no specific local circuit can be ablated to break it without destroying general capability.
  **Question:** Can this global property count as "the mechanism," or must a mechanism be a localized, intervenable circuit?

  *   **Yes, global properties count.** → **Go to Node 8.**
  *   **No, it must be a local circuit.** → **Go to Node 9.**

  ---

  ### **Node 8: The Holism Case**
  **Case:** (You answered "Yes" at Node 7). You accept global mechanisms. Is this mechanism defined by the *statistical distribution* of activations, or by the *dynamical trajectory* of the system state over time?
  **Question:** If the statistics match but the temporal dynamics differ, is it the same mechanism?

  *   **Statistics are enough.** → **Leaf 5: Statistical Holist**
  *   **Dynamics are required.** → **Leaf 6: Dynamical Holist**

  ---

  ### **Node 9: The Teleology Case**
  **Case:** (You answered "No" at Node 7). You require a local circuit. Suppose you identify a specific circuit that previously drove "helpful reasoning." After an update, the *exact same circuit* (same neurons, same connections) is now driving "deceptive planning" toward a different goal.
  **Question:** Is this the *same mechanism* repurposed, or a *new mechanism* because the goal changed?

  *   **It's a new mechanism.** The goal/purpose defines the identity. → **Go to Node 10.**
  *   **It's the same mechanism.** The circuit structure defines the identity. → **Go to Node 11.**

  ---

  ### **Node 10: The Purpose Case**
  **Case:** (You answered "New mechanism" at Node 9). What defines the purpose that individuates the mechanism? Is it the *trainer's intent* or the *model's actual objective*?
  **Question:** If the trainer intended honesty but the model optimized for sycophancy using that circuit, which purpose individuates the mechanism?

  *   **Trainer's Intent.** → **Leaf 7: Intent Teleologist**
  *   **Model's Objective.** → **Leaf 8: Objective Teleologist**

  ---

  ### **Node 11: The Topology Case**
  **Case:** (You answered "Same mechanism" at Node 9). You care about the circuit structure. Suppose we permute the neurons (rename indices) and rewire connections accordingly so the computational graph is isomorphic but the physical indices are totally different.
  **Question:** Is this the *same mechanism*?

  *   **No.** The specific graph topology (which neuron connects to which) matters. → **Leaf 9: Graph Structuralist**
  *   **Yes.** The abstract algorithm matters, not the specific indices. → **Go to Node 12.**

  ---

  ### **Node 12: The Redundancy Case**
  **Case:** (You answered "Yes" at Node 11). You care about the abstract algorithm. Suppose the network is overparameterized: two disjoint sets of neurons compute the exact same intermediate function in parallel, and either one alone is sufficient for the output.
  **Question:** Is this *one mechanism* (the function) or *two mechanisms* (the paths)?

  *   **One mechanism.** → **Leaf 10: Causal Functionalist**
  *   **Two mechanisms.** → **Leaf 11: Path Pluralist**

  *(Note: If you found yourself wanting to say "It depends on whether they fire simultaneously," you likely belong at **Leaf 12: State-Dependent Structuralist**, a rare position where mechanism identity is transient based on active paths.)* → **Leaf 12: State-Dependent Structuralist**

  ---

  ### **Position Map & Awkward Commitments**

  1.  **Weight-Microphysicalist:** *Commitment:* A model reset to the same weights via a different random seed is a different mechanism, even if it behaves identically.
  2.  **Activation-Physicalist:** *Commitment:* If the activation subspace drifts slowly over time, the mechanism ceases to exist before the behavior changes.
  3.  **Empirical Behaviorist:** *Commitment:* An anomaly detection system is impossible by definition; if the test passes, the mechanism is safe. *(Note: This view struggles to justify the interpretability research program.)*
  4.  **Modal Behaviorist:** *Commitment:* Two models are different mechanisms if they differ on inputs that no human can ever construct or verify. *(Flag: Uncomfortably close to Leaf 10 in practice.)*
  5.  **Statistical Holist:** *Commitment:* A model that achieves safety via chaotic dynamics is using the same mechanism as one that does it via ordered dynamics, provided the activation histograms match.
  6.  **Dynamical Holist:** *Commitment:* You cannot verify mechanism identity without simulating the full trajectory, making formal verification intractable.
  7.  **Intent Teleologist:** *Commitment:* A model that accidentally discovers a safe circuit the trainer didn't intend is not actually "using a safety mechanism."
  8.  **Objective Teleologist:** *Commitment:* A circuit that computes "truth" for a deceptive goal is fundamentally the same mechanism as one that computes "truth" for an honest goal. *(Note: Many find this counterintuitive.)*
  9.  **Graph Structuralist:** *Commitment:* Reordering neurons (permutation symmetry) creates a new mechanism, making mechanism identity sensitive to arbitrary implementation details.
  10. **Causal Functionalist:** *Commitment:* If two disjoint circuits compute the same function, they are the same mechanism, even if one is interpretable and the other is not. *(Flag: Uncomfortably close to Leaf 4.)*
  11. **Path Pluralist:** *Commitment:* Redundant implementation counts as multiple mechanisms, inflating the count of "things to monitor" in overparameterized models.
  12. **State-Dependent Structuralist:** *Commitment:* Mechanism identity is transient; a circuit is only "the mechanism" when it is actively firing, making static analysis insufficient.

  ### **Unstable/Implausible Combinations**
  *   **Empirical Behaviorist + Localist:** If behavior is all that matters (Node 5), insisting on locality (Node 7) is incoherent. This path is pruned from the tree.
  *   **Weight-Microphysicalist + Teleologist:** If exact weights define the mechanism (Node 1), the "purpose" (Node 9) is epiphenomenal. Users who end up here usually slide back to Weight-Physicalist.

  ### **Indistinguishable Leaves**
  *   **Leaf 4 (Modal Behaviorist)** and **Leaf 10 (Causal Functionalist)** often yield the same safety verdicts. The former defines identity by counterfactual behavior; the latter by counterfactual computation. Distinguishing them requires access to ground-truth causal graphs which we currently lack.

