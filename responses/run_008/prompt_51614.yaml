      *   *Observation 2:* Natural constraints don't count as unfreedom. (Hermit = Free).
      *   *Observation 3:* Internal constraints (addiction) don't count as unfreedom *if* no external master is involved. (Brother = Free).
      *   *Observation 4:* Legal constraints don't count if there's political agency/consent. (Citizen = Free).
      *   *Clue:* She reads an "Australian philosopher" and mutters about "masters and slaves."
      *   *Strong Candidate:* **Philip Pettit (Republicanism/Non-Domination).** Pettit is Australian. His core concept is *freedom as non-domination*. You are unfree if someone has the *arbitrary power* to interfere with you, even if they don't use it. You are free if you are not subject to the arbitrary will of another.
      *   *Alternative Candidate:* **Isaiah Berlin (Negative Liberty).** Freedom is the absence of external obstacles. (Fits Nephew, Hermit, Citizen). *Problem:* Berlin usually views addiction as a constraint on liberty (internal), but she calls the brother *Free*. So pure Negative Liberty might not fit perfectly unless she distinguishes strictly between *human* obstacles and *natural/internal* ones.
      *   *Alternative Candidate:* **Kantian Autonomy.** Freedom is acting according to rational law. (Problem: She calls the alcoholic free, which Kant might dispute as slavery to passion).
      *   *Alternative Candidate:* **Hobbesian Liberty.** Silence of the law. (Problem: Nephew isn't legally bound but she says Not Free).

      *   *Refining the "Pettit" Hypothesis:*
          *   Nephew: Owner has arbitrary power (blacklist). -> Unfree. (Matches).
          *   Hermit: No master. Nature isn't a master. -> Free. (Matches).
          *   Alcoholic: No *other* person dominating him. -> Free. (Matches).
          *   Citizen: Laws are non-arbitrary (tracked by interests/vote). -> Free. (Matches).
          *   *Key Phrase:* "Masters and slaves." This screams Republicanism (Pettit/Skinner).

  4.  **Evaluate the New Cases against the "Pettit/Non-Domination" Hypothesis:**
      *   *Case A (Wife/Property Law):* Law says husband controls property. He doesn't use it. Divorce is easy.
          *   *Pettit View:* The husband *has the power* to interfere arbitrarily. The law grants him domination status. Even if benevolent, he is a master.
          *   *Prediction:* **Not Free.** (Status of dependence matters more than exercise).
      *   *Case B (App Worker):* App can deactivate him arbitrarily. No appeal. Economic need makes it hard to leave.
          *   *Pettit View:* The platform owner has arbitrary power over his livelihood. It's like the Mill Owner but digital.
          *   *Prediction:* **Not Free.** (Arbitrary power exists).
      *   *Case C (Monk):* Vow of obedience. Can leave physically. Doesn't want to.
          *   *Pettit View:* This is tricky. He *authorized* the authority. Is the power arbitrary? Usually, religious orders have rules, but if he can leave, is he dominated? Pettit distinguishes between *alien control* and *authorized control*. If the vow is revocable (he can leave), he retains control.
          *   *Prediction:* **Free.** (He holds the key; the obedience is authorized, not imposed).

  5.  **Develop Alternative Hypotheses (To satisfy the "clean experiment" request):**
      *   *Hypothesis 1: Non-Domination (Pettit).* Focus: Arbitrary power of others.
      *   *Hypothesis 2: Negative Liberty (Hobbes/Berlin - Strict).* Focus: Physical prevention by humans.
