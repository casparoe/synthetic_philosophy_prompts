      *   *Check:* The Wife. The law grants the power. Even if unused, the *status* is one of dependence. Pettit emphasizes this heavily (the "happy slave" problem).
      *   *Check:* The Monk. He has the "exit option." The authority is non-arbitrary because it's conditioned on his continued consent (he can leave).

  10. **Final Polish:** Make sure to explicitly mention the "Australian Philosopher" clue. It's Philip Pettit. He wrote *Republicanism: A Theory of Freedom and Government* (1997) and *On the People's Terms*. This adds significant weight to the analysis.

      *Wait, one nuance:* The user says she "muttered about masters and slaves." This is classic Republicanism. The "Australian" clue seals it. Pettit is the most prominent contemporary Australian political philosopher working on freedom.

