          *   Hermit: No exit needed. -> Free.
          *   Alcoholic: Hard exit (addiction), but she says Free. -> This weakens the Exit Option theory unless she distinguishes internal vs. external exit costs.

  6.  **Drafting the Predictions & Reasoning:**
      *   *Primary Theory:* Republican Freedom (Non-Domination). Cite Philip Pettit (*Republicanism: A Theory of Freedom and Government*). This fits the "Australian philosopher" clue perfectly.
      *   *Predictions:*
