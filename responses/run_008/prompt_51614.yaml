          3.  Monk: **Free.** (Consensual authority, exit is physically possible).
      *   *Alternative Theory:* "Actual Interference" (Strict Negative Liberty).
          1.  Wife: **Free.** (Husband doesn't interfere).
          2.  App Guy: **Free.** (Hasn't been fired yet).
          3.  Monk: **Free.** (Consensual).
      *   *Alternative Theory:* "Meaningful Choice" (Capabilities Approach).
          1.  Wife: **Not Free.** (Legal status reduces capability).
          2.  App Guy: **Not Free.** (Economic coercion).
          3.  Monk: **Free.** (Chosen life).
          *   *Wait, check data:* The Capabilities approach might call the Alcoholic *Unfree* (lacks capability to function). She called him *Free*. So Capabilities is less likely than Non-Domination.

  7.  **Designing the Critical Experiment:**
      *   Need a case that splits "Non-Domination" (Power exists) vs. "Actual Interference" (Power used) vs. "Internal Autonomy".
      *   *Idea:* A slave with a benevolent master who *cannot* legally sell him, but the master *thinks* he can.
      *   *Better Idea:* A case where power exists but is non-arbitrary vs. arbitrary.
      *   *Best Split:* The "Benevolent Master" scenario.
      *   *Case:* A prisoner in an open prison. Guards *could* lock him up but don't. He stays because he likes the food.
      *   *Actually, let's look at the Wife case again.* The split is between *Status* vs. *Action*.
      *   *Proposed Case:* "The Benevolent Dictator." A citizen in a country with no elections, but the dictator is kind and never restricts anything.
          *   Non-Domination (Wife's likely view): **Not Free** (Subject to arbitrary will).
          *   Negative Liberty: **Free** (No actual restrictions).
      *   *Another Split:* The Monk. What if the Monk *cannot* leave physically (locked gate) but *wants* to stay?
          *   Non-Domination: **Not Free** (No exit).
          *   Internal Autonomy: **Free** (Will is aligned).

  8.  **Refining the Output:**
