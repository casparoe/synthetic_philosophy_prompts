      *   Ensure the tone is conversational but rigorous.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* the Alcoholic is free in Pettit's view? Yes, because no *other* agent dominates him. It's a misfortune, not domination.
      *   *Check:* Did I explain the Citizen? Yes, laws track interests (non-arbitrary).
