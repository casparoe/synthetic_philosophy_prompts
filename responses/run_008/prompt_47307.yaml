answer: |-
  **Score:** 17 / 25
  **Letter Grade:** C-

  **Grading Breakdown & Comments:**

  **1. Mencius on Human Nature & Arguments (6 points possible)**
  *   **Score:** 5.5 / 6
  *   **Correct:** You accurately identified the core thesis (nature is good), the Four Sprouts, and the mapping to the four virtues. Your summary of the "Child at the Well" and "Ox Mountain" analogies is textually accurate and clearly explained.
  *   **Error:** In the last sentence of this paragraph, you claim Mencian cultivation is "basically not interfering — leave people alone." This is a significant conceptual slip. Mencius does not advocate *wu-wei* (non-action); he advocates active *extension* (*tui*) and nurturing. The sprouts do not grow automatically; they require conscious effort to "fill out" (*kuo-chung*).
  *   **Deduction:** -0.5 points. (I am grading this here for accuracy of interpretation, though it overlaps with Part 2).

  **2. Xunzi on Human Nature & Arguments (6 points possible)**
  *   **Score:** 5 / 6
  *   **Correct:** You correctly identify the definition of *xing* as raw desire and the logical link to social chaos (limited goods vs. unlimited desire). The "Bent Wood" analogy is correctly applied.
  *   **Error:** You state the goal of ritual is to "suppress [desires] and eventually extinguish them." Xunzi explicitly argues desires are ineradicable; they cannot be extinguished, only *guided* or channeled appropriately through *li*. The sage still has desires but satisfies them in order.
  *   **Deduction:** -1 point.

  **3. Part 1: Xunzi's Puzzle (Origin of Ritual & Potential) (8 points possible)**
  *   **Score:** 3 / 8
  *   **Correct:** You correctly identified that there *is* a puzzle here (how can bad nature produce good ritual?).
  *   **Error A (Origin of Ritual):** You write that the first sages were "exceptions, rare individuals born with unusually good material." This contradicts Xunzi's central argument. Xunzi insists sages have the *same* bad nature as everyone else; they became sages through "accumulated effort" (*ji*) and conscious activity, not because they were born with different material.
  *   **Error B (Who can be good):** You claim "real goodness is reserved for the exceptional few." This is the opposite of Xunzi's famous claim: "Anyone on the street can become a Yu [sage]." While Xunzi admits not everyone *does* become a sage, he insists everyone *can*. Your answer denies the egalitarian potential of Xunzi's cultivation.
  *   **Deduction:** -5 points total (-3 for Sage Origin, -2 for Potential). This is the heaviest deduction because it misses the specific doctrinal points requested in this section.

  **4. Part 2: Implications for Moral Cultivation (5 points possible)**
  *   **Score:** 3.5 / 5
  *   **Correct:** You correctly characterize Xunzi's view as reshaping from the outside (artificial/imposed).
  *   **Error:** As noted in section 1, your description of Mencius ("leave people alone") is incorrect. Mencian cultivation is internal *development*, but it is active, not passive. It is like farming (active tending), not like wilderness preservation (non-interference).
  *   **Deduction:** -1.5 points.

  **Summary for Student Feedback:**
  You have a strong grasp of the basic distinctions (Good vs. Bad nature) and the primary analogies (Well, Ox Mountain, Bent Wood). Your writing is clear and organized. However, you lost significant points on the specific mechanics of Xunzi's system. Specifically: (1) Xunzi's sages are *made* through accumulation, not born with better nature; (2) Xunzi believes *everyone* has the potential to be a sage, not just a few; (3) Desires are guided, not extinguished; and (4) Mencius requires active extension, not passive non-interference. Review the lecture notes on Xunzi's concept of *ji* (accumulation) and Mencius's concept of *tui* (extension).
