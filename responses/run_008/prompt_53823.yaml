prompt: |-
  I write historical fiction, and each novel confronts me with a decision I make perhaps a dozen times per chapter with no method behind it: when the sources disagree, fall silent, or wear their partisanship openly, what may I assert on the page as fact, what must I hedge as a narrator's guess, and what am I free to invent outright? My training is in the craft of prose, not in history, and my constraints are fixed: I work from translations and whatever secondary literature I can obtain, I have no archival access, and a consulting historian reads my manuscript exactly once, after the draft is done — by which point the wrong choices are expensive to unmake. What I need is a decision procedure I can run myself, in a few minutes per instance, before I commit a sentence to the page.

  Please build it out of the actual tradition of source criticism, but compressed for a practitioner. The distinctions I suspect matter most, and which I'd like you to keep or discard as the design requires: the difference between a source that errs at random and one that errs in a direction, since the second can be corrected for and the first only averaged; the discipline of not treating a source's silence as knowledge that a thing did not happen, which means asking what would have had to be true for the writer to mention it; the gap between a source that was present and one that merely heard from someone; and the gap between what a source says happened and what it says the happening meant, which is where partisanship usually hides. The procedure should preserve what these distinctions actually claim while making them usable by someone without the theory, and it should say plainly which of them you decided to drop in the simplification.

  Then run it on three cases I actually face in my current manuscript: a scene where the only narrative source is a chronicle written to flatter the ruler it describes; an episode where two otherwise credible sources flatly contradict each other about who was in the room; and a matter where the literary sources say one thing and the material evidence — coins, in this instance — says another. I want at least one of these to come out in a way I will not like, and I want you to tell me which one that is rather than softening the verdict to spare me.

  Finally, mark for me the point at which the procedure must stop and hand the decision back: I assume there are moments where the question stops being what the evidence supports and becomes what a novelist may do with a gap the evidence cannot fill, and I would rather have that boundary drawn honestly than have the procedure pretend to settle questions of license in the dress of questions of fact. And since I will be trusting this procedure for years: tell me where you think it is most likely to misfire, and what would change your mind about it — which argument or consideration would lead you to redesign the steps or return different verdicts on the three cases.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Historical fiction writer.
      *   **Problem:** Needs a quick, repeatable decision procedure for handling conflicting/silent/biased sources (approx. 12 times/chapter).
      *   **Constraints:** No archival access, works from translations/secondary lit, historian consults *after* draft (too late for major fixes).
      *   **Requirements:**
          1.  Build a procedure based on actual source criticism tradition but compressed for a practitioner.
          2.  Incorporate specific distinctions: random vs. systematic error, silence vs. negation, eyewitness vs. hearsay, event vs. meaning (partisanship).
          3.  State clearly which distinctions were dropped/simplified.
          4.  Run the procedure on three specific cases (Flattering chronicle, Contradictory witnesses, Coins vs. Text).
          5.  One case must yield an unwelcome verdict (no softening).
          6.  Define the boundary where evidence ends and fiction begins.
          7.  Identify potential failure points of the procedure and what would change the designer's mind.

  2.  **Deconstruct Source Criticism for Fiction:**
      *   *Traditional Historiography:* Involves external criticism (authenticity) and internal criticism (credibility). Looks at provenance, bias, corroboration, archaeology, etc.
      *   *Fiction Needs:* Needs narrative certainty. Can't say "maybe" on every page. Needs to know when they can lie safely.
      *   *Key Distinctions to Integrate:*
          *   Random vs. Systematic Error (Bias).
          *   Argument from Silence (What would they have noticed?).
          *   Proximity (Eyewitness vs. Hearsay).
          *   Fact vs. Interpretation (Event vs. Meaning).

  3.  **Drafting the Procedure (The "Triangulation Protocol"):**
      *   *Goal:* Speed and clarity. A flowchart mentality.
      *   *Step 1: Categorize the Claim.* Is it a hard fact (who, when, where) or soft fact (why, how it felt)?
      *   *Step 2: Assess Source Proximity.* Was the source there?
      *   *Step 3: Assess Bias/Direction.* Is the error random or motivated?
      *   *Step 4: Check Silence.* If they don't say it, would they have *had* to?
      *   *Step 5: The Verdict.* Fact, Hedged Fact, or Invention.
      *   *Simplifications:* I need to drop complex philological analysis, deep contextual socio-political mapping (too slow), and the distinction between "primary" and "secondary" in the academic sense (focus on *proximity* instead). I will also collapse "random error" into "unreliable" because for a novelist, random error usually means "don't trust it alone."

  4.  **Developing the Three Cases:**
      *   *Case 1: Flattering Chronicle.* (Systematic bias).
      *   *Case 2: Contradictory Witnesses.* (Random/Conflicting error).
      *   *Case 3: Coins vs. Text.* (Material vs. Narrative).
      *   *Requirement:* One must be unwelcome.
          *   *Idea:* Usually, writers want to trust the text because it gives a story. Material evidence (coins) is boring but hard. If the coins contradict the text, the text is likely wrong on the *fact*, but the text might be right on the *intent*. However, for a hard fact (e.g., who was king, what year), coins win. Let's make Case 3 the unwelcome one: The text says X, coins say Y. The writer wants to use X for drama. The procedure must say "Use Y."

  5.  **Defining the Boundary (Fact vs. Fiction):**
      *   Where does the procedure stop? When there is *no* evidence, or when the evidence is equally balanced/irrelevant to the core historical truth. This is the "Gap of Silence."
      *   Need to distinguish between *contradicting evidence* (must solve) and *absence of evidence* (free to invent).

  6.  **Identifying Failure Points:**
      *   Where will this go wrong?
      *   Over-reliance on secondary literature (which might be outdated).
      *   Misjudging "Systematic Bias" (thinking it's random).
      *   The "Unwelcome Verdict" risk: The writer might ignore it.
      *   What would change my mind? New archaeological discovery, a shift in historiographical consensus, or a demonstration that the "material evidence" is itself interpreted through a biased lens.

  7.  **Refining the Output (Iterative Polish):**
      *   *Tone:* Professional, direct, respectful of the craft, slightly rigorous.
      *   *Structure:*
          1.  The Procedure (The "Source Triangulation Matrix").
          2.  Simplifications/Discards.
          3.  The Three Cases (Applied).
          4.  The Boundary (License vs. Fact).
          5.  Failure Modes & Falsifiability.
      *   *Check against constraints:* Did I keep the specific distinctions requested? Yes (Random/Directional, Silence, Proximity, Fact/Meaning). Did I state what I dropped? Yes. Is one verdict unwelcome? Yes.

  8.  **Self-Correction during drafting:**
      *   *Critique:* Is the procedure too slow?
      *   *Fix:* Make it a 4-step checklist with binary outcomes.
      *   *Critique:* Did I address the "Silence" distinction properly?
      *   *Fix:* Ensure the "Argument from Silence" step asks "Was this observable to the author?"
      *   *Critique:* The "Coins vs Text" case needs to be sharp.
      *   *Fix:* Ensure the verdict explicitly forbids the textual claim if it violates the material fact.

  9.  **Final Review:** Does this meet the "unwelcome verdict" requirement? Yes, I will ensure the Coins case forces the writer to abandon a plot point based on the text. Does it define the boundary? Yes, the "Zone of Invention." Does it explain failure points? Yes.

  (Proceed to generate response based on these thoughts.)
answer: |-
  ### The Source Triangulation Protocol (STP)

  This procedure compresses the historiographical methods of *Quellenkritik* (source criticism) into a four-step checklist. It is designed for speed. Do not linger on a step longer than sixty seconds. If you cannot answer a step, default to the more conservative option.

  **The Goal:** To categorize every historical assertion into one of three buckets:
  1.  **Hard Fact:** Assert directly.
  2.  **Soft Fact:** Assert, but hedge with narrative distance (e.g., "so it was said," "he believed").
  3.  **Invention:** Free to fabricate, provided you do not contradict a Hard Fact.

  #### Step 1: Proximity (The Eyewitness Filter)
  *Ask: Was the source physically present for the specific event, or are they repeating a report?*
  *   **Present:** Proceed to Step 2.
  *   **Absent (Hearsay/Chronicle):** Downgrade maximum potential to **Soft Fact**. You cannot assert private dialogue or internal motivation from a source that was not there.
  *   *Theory preserved:* The gap between presence and hearsay.

  #### Step 2: Vector (The Bias Filter)
  *Ask: If this source is wrong, is it by accident (random) or by design (directional)?*
  *   **Random Error:** (e.g., a tired scribe, a confused soldier). If two independent sources agree, treat as **Hard Fact**. If they disagree, treat as **Invention**.
  *   **Directional Error:** (e.g., propaganda, flattery, self-justification). You must correct for the vector. If a source flatters a ruler, assume the ruler looked *worse* than described. If a source demonizes an enemy, assume the enemy looked *better*.
  *   *Verdict:* If the claim serves the bias, downgrade to **Soft Fact** (assert the event happened, but not the virtue/vice attached). If the claim *hurts* the bias (e.g., a flattering chronicle admits a defeat), upgrade to **Hard Fact**.
  *   *Theory preserved:* Random vs. Systematic error; Event vs. Meaning.

  #### Step 3: Silence (The Observability Filter)
  *Ask: The source does not mention X. Does this mean X did not happen?*
  *   **Rule:** Silence is only evidence of absence if the source *would have necessarily noticed X*.
  *   **Test:** If the King walked through the room, a court chronicler would notice. If a servant poisoned the wine, a court chronicler might not.
  *   **Verdict:** If X was observable and significant to the source's purpose, and they omit it, treat "X did not happen" as **Hard Fact**. If X was hidden or irrelevant to their purpose, treat the silence as **Invention** space.
  *   *Theory preserved:* Argument from silence (what would have to be true for them to mention it).

  #### Step 4: Material Anchor (The Hard Constraint)
  *Ask: Is there non-textual evidence (coins, archaeology, climate data, genetics)?*
  *   **Yes:** Material evidence overrides textual evidence on matters of physical reality (dates, locations, existence of people, economic capacity).
  *   **No:** Rely on Steps 1–3.
  *   **Verdict:** If Text says A and Material says B, B is **Hard Fact**. A is **Invention** (or metaphorical truth only).

  ***

  ### Simplifications and Discards
  To make this runnable in minutes without archival access, I have discarded the following traditional historiographical distinctions:
  1.  **Stemmatics/Textual Genealogy:** I have removed the requirement to trace the manuscript tradition to find the "ur-text." You are working from translations; you must trust the editor's introduction regarding the text's stability.
  2.  **Authorial Psychology:** Traditional criticism often digs into the author's entire life to gauge bias. The STP looks only at the *immediate incentive* of the specific passage (flattery, defense, propaganda).
  3.  **Corroboration Weighting:** I have simplified "multiple independent sources" to a binary check. In professional history, the *quality* of independence matters. Here, if two sources aren't copying each other, they count as two.

  ***

  ### Application to Your Three Cases

  #### Case 1: The Flattering Chronicle
  *Scenario:* A scene where the only narrative source is a chronicle written to flatter the ruler. The chronicle says the ruler showed mercy to a rebel.
  *   **Step 1 (Proximity):** Chronicler is likely present or close to court. (Pass)
  *   **Step 2 (Vector):** The purpose is flattery. Mercy is a virtue that enhances the ruler's image. This is a **Directional Error** serving the bias.
  *   **Step 3 (Silence):** N/A.
  *   **Step 4 (Material):** N/A.
  *   **Verdict:** **Soft Fact.** You may write the scene, but you cannot assert the mercy as objective truth. You must frame it as the ruler's *performance* of mercy, or imply the rebel was actually executed/ignored. The "mercy" is the meaning, not the event.
  *   **Instruction:** Write the mercy, but let the reader feel the courtiers watching, ensuring the mercy feels like a display. Do not write the rebel's internal relief as fact.

  #### Case 2: Contradictory Witnesses
  *Scenario:* Two otherwise credible sources flatly contradict each other about who was in the room.
  *   **Step 1 (Proximity):** Both claim presence. (Pass)
  *   **Step 2 (Vector):** Assume **Random Error** unless one source gains specific political advantage from the other's absence. If no clear bias vector exists, this is a memory failure.
  *   **Step 3 (Silence):** N/A.
  *   **Step 4 (Material):** N/A.
  *   **Verdict:** **Invention.** You have no historical ground to stand on. You cannot choose one as "Fact."
  *   **Instruction:** You must choose who was in the room based on *dramatic necessity*, not historical truth. However, you must not treat your choice as a historical claim. Do not have a character say, "I know X was here." Treat the room's occupancy as a fictional variable within a historical constant.

  #### Case 3: Coins vs. Text
  *Scenario:* Literary sources say a specific King issued a decree lowering taxes in Year X. Coins minted in Year X bear the mark of a Usurper, not the King.
  *   **Step 1 (Proximity):** Text is later; Coins are contemporary.
  *   **Step 2 (Vector):** Text may be trying to legitimize the King's legacy. Coins are economic tools; a Usurper would not mint coins in a rival's name.
  *   **Step 3 (Silence):** N/A.
  *   **Step 4 (Material):** **Yes.** Coins are material evidence.
  *   **Verdict:** **Hard Fact (Coins).** The Text is wrong about the political reality of Year X. The King did not control the mint. He likely did not issue the decree.
  *   **Instruction:** **This is the verdict you will not like.** You cannot write the scene where the King lowers taxes in Year X as a factual event. It contradicts the material record. You may write the King *attempting* to issue the decree from exile, or the decree being a forgery created later, but you cannot depict him exercising fiscal authority in Year X. The text is lying (or mistaken); the metal is not.

  ***

  ### The Boundary: Where Procedure Stops and License Begins

  The STP ends at the edge of the **Recorded Event**.

  *   **Fact:** What the evidence supports (The King entered the room).
  *   **Gap:** What the evidence cannot touch (The King felt cold; The King remembered his mother; The King hesitated before speaking).

  **The Rule of the Gap:** If the STP yields "Invention" or "Soft Fact," you are in the Gap. Here, you are free to invent, *provided your invention does not render a Hard Fact impossible.*
  *   *Example:* If it is a Hard Fact the King lived to 80, you cannot invent a scene where he is poisoned at 40.
  *   *Example:* If it is Invention who was in the room (Case 2), you can put anyone there, provided their presence doesn't contradict a Hard Fact (e.g., you can't put a man there who is documented to be in another city).

  **The Handoff:** When you move from "What happened" to "Why it happened" (motivation) or "How it felt" (sensory detail), the procedure hands control back to you. History provides the skeleton; you provide the nervous system. Do not use the STP to justify fabricating skeletons. Do not use "artistic license" to break bones.

  ***

  ### Failure Modes and Falsifiability

  **Where this procedure will misfire:**
  1.  **The "Material is Neutral" Fallacy:** I have treated coins as objective truth. They are not. They are propaganda too. A Usurper might mint coins in a dead King's name to claim legitimacy. If your secondary literature interprets the coins as "Usurper" but new scholarship argues they are "Regency," the STP forces you into an error.
      *   *Risk:* Case 3 (Coins vs. Text) is the most vulnerable. Material evidence is interpreted by historians, not read like a digital display.
  2.  **Secondary Literature Lag:** You are working from translations and secondary lit. If the consensus shifted five years ago and your books are ten years old, the STP will codify outdated history as "Hard Fact."
  3.  **Over-Correction of Bias:** In Step 2, assuming the opposite of a bias (e.g., "He says he was merciful, so he was cruel") is as dangerous as believing the bias. Sometimes tyrants *were* merciful for calculation. The STP pushes you toward skepticism, which can flatten complex human behavior into cynical caricature.

  **What would change my mind:**
  I would redesign this procedure if you could demonstrate that **narrative truth** (the emotional arc of the novel) requires violating a **Hard Fact** to communicate a deeper historical reality that the facts obscure.

  *   *Specific Argument:* If you can show me a case where adhering to the Material Evidence (Case 3) makes the political reality *less* understandable to the modern reader than the Textual Lie does. For example, if the Usurper *acted* exactly as the King would have, and the tax decree *was* enforced despite the coinage, then the Coin is the technical truth, but the Text is the functional truth.
  *   *Redesign:* If that argument holds, Step 4 needs a "Functional Reality" override. If the Text describes how the world *felt* and *operated* for the people living in it, and the Material evidence is a technicality of elite power struggles, the Text may take precedence for *social* history, even if Material wins for *political* history.

  **Final Warning:**
  The STP is a shield against embarrassment, not a generator of genius. It keeps you from writing things that will make a historian throw your book across the room. It does not tell you how to write a scene that makes a reader cry. Use it to clear the ground, then put it away.
