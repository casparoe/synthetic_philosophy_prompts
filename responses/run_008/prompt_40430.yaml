answer: |-
  **Sidebar: The Judy Benjamin Problem**

  Judy Benjamin is a soldier dropped by parachute into hostile territory at night. Her map shows the land is split between Red and Blue armies. Before she lands, she assigns a 50 percent chance to being in Red territory and 50 percent to Blue. Once on the ground, HQ radios a single cryptic line: "We can't pinpoint you, but if you are in Blue territory, the odds are 3-to-1 that you are in the Red-held sector rather than the Blue-held sector."

  Judy needs to update her beliefs. But how?

  Standard Bayesian conditioning hits a wall immediately. To update via Bayes' rule, you need to learn that some event $E$ is true. You then condition on $E$. But Judy hasn't learned a fact; she's learned a conditional constraint. She didn't learn she is in Blue territory; she learned what the odds are *if* she is. Since the antecedent might be false, there is no event $E$ for the math to grab onto.

  So we look for constraints. Any sensible update must respect the message: inside Blue territory, the odds of Red-held versus Blue-held must now be 3-to-1. But what about the odds of being in Blue territory at all? Intuitively, the message shouldn't change that. HQ said nothing about Red versus Blue territory, only about the internal layout of Blue. So, her probability of being in Blue territory should arguably stay at 50 percent.

  Here is the punchline. In 1981, Bas van Fraassen argued that when logic underdetermines the answer, we should choose the new probability distribution that minimizes "information gain"—changing our beliefs as little as possible subject to the constraints. When you run the optimization, the result is startling: Judy's probability of being in Blue territory drops from 50 percent to 40 percent.

  The arithmetic is dense, but the intuition is that minimizing information gain tries to preserve the relative ratios of probabilities everywhere else. Because the constraint tightens the distribution inside Blue territory, the minimization algorithm compensates by shifting mass away from Blue entirely to keep the "distance" between old and new beliefs low.

  Does this look right? Most people say no. Why should hearing detailed news about Blue territory make you less sure you're there? It feels like a penalty for having received information. Later work by Adam Grove and Joseph Halpern suggested the problem is simply underdetermined. The constraints (fix the internal odds, keep the message silent on the main territory) do not logically force a unique answer. The shift to 40 percent isn't a discovery; it's an artifact of choosing "minimum information" as the tiebreaker. That meta-rule smuggles in assumptions about how probability mass should flow that aren't present in the radio message itself.

  The Judy Benjamin problem reveals a gap in our theory of rationality. We know how to update on facts, and we know how to handle conditionals in logic, but merging them remains messy. It's akin to a doctor telling you, "If you have the flu, stay home," without confirming you're sick. Do you suddenly think you're less likely to have the flu? Probably not. But according to the strictest math of belief update, you might have to.

