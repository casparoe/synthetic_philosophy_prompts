prompt: |-
  My roommates Maya and Theo had a long argument on the porch last night and I want someone to referee it properly, because they keep restarting it.

  The backstory: Maya works at a small company and has thought hard about whether her team's new product plan will flop. She walked her reasoning out loud — market size, the two competitors, the deadline they're already slipping — and said she's about 85% confident it flops. That's where it started.

  (1) Theo said that number is too high given her history: she's called three of their past projects dead-on-arrival, two of them succeeded anyway, and there's a whole psych literature showing people are systematically overconfidant about exactly this kind of judgment. Her track record is evidence about her evidence, he said, so she should knock the number down until it matches what someone with her track record deserves.

  (2) Maya said no. She can see each step of her reasoning right now, and each step looks as solid as anything. A track record is a statistic about her past, and it can't outweigh what she can literally see in front of her — like a forecast saying 20% chance of rain while rain is visibly falling on her head. Discounting would leave her believing her evidence points one way while believing the other, which she said is just being irrational twice over.

  (3) Theo said that's precisely what an overconfident person would say — she'd also feel the clarity of each step, that's the whole problem. If the meta-level evidence says her object-level judgments run hot in this domain, then lowering isn't ignoring her evidence, it IS her evidence working.

  (4) Maya said fine, then where does it stop? By his logic she should also check whether her checking was overconfident, and then check the check, and it never bottoms out — plus the studies he keeps citing are themselves things she's taking on fallible testimony, so why is it only her confidence that gets audited?

  (5) Theo said it bottoms out wherever the evidence is most reliable: the finding that people overrate their forecasts in domains like this is far better established than her private sense of clarity, so that side wins and that's the end of it.

  (6) Maya's last word was that she'd already discounted for overconfidence when she settled on 85 instead of 95 — hasn't she paid the toll already? And Theo said: how does she know the discount itself wasn't too small, given who applied it?

  They went to bed mad. Please go through the exchange round by round and say who's right about what — including whether Maya's move in (2) is the incoherence Theo takes it for or a defensible stance (I gather philosophers actually disagree about this "akrasia" stuff), and whether either of them is missing an option that would dissolve part of the fight, like just making the number itself carry the uncertainty instead of treating the track record as a separate thing to obey. And then tell me who comes out more right overall.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Act as a referee for an argument between roommates Maya and Theo regarding probability assessment, overconfidence, and track records.
      *   **Context:** Maya predicts an 85% chance of product failure based on specific evidence. Theo argues she should lower this based on her past track record (calibration) and psychological literature on overconfidence.
      *   **Structure:** Go through the exchange round by round (1-6), evaluate who is right about what, address specific philosophical points (incoherence/akrasia in round 2), identify missing options (dissolving the fight), and declare an overall winner.
      *   **Tone:** Objective, analytical, philosophical but accessible (like a mediator/referee).

  2.  **Deconstruct the Argument (Round by Round):**

      *   **Backstory:** Maya says 85% confidence of failure based on object-level evidence (market, competitors, deadline).
      *   **Round 1 (Theo):** Argument from *calibration*. Past performance (3 predictions of doom, 2 succeeded) + General psych literature (overconfidence bias) = She should lower the probability. This is a "outside view" vs. "inside view" argument (Kahneman/Lovallo).
          *   *Assessment:* Theo is statistically sound here. Base rates and calibration matter.
      *   **Round 2 (Maya):** Argument from *current evidence*. She sees the specific reasons *now*. Discounting feels like believing $P$ and $\neg P$ simultaneously (Moore's Paradox/Akrasia). Analogy: Rain forecast vs. rain on head.
          *   *Assessment:* This is the crux. Is it irrational to hold a belief while acknowledging a bias? Philosophers (like Christensen, Elga) discuss "defeat." Maya's rain analogy is flawed (sensory evidence > statistical forecast), but her point about "double counting" or "self-distrust" has weight.
      *   **Round 3 (Theo):** Argument from *meta-cognition*. Overconfidence *feels* like clarity. You can't trust the feeling of clarity because that's the biased mechanism. Adjusting *is* using the evidence correctly.
          *   *Assessment:* Strong point. The "feeling of rightness" is not truth-tracking in isolation.
      *   **Round 4 (Maya):** Argument from *infinite regress*. If I adjust for bias, do I adjust for bias in the adjustment? Also, why trust the psych studies (testimony) more than her reasoning?
          *   *Assessment:* The regress argument is a classic skeptical move. It's a valid concern but usually resolved by "satisficing" or finding the most reliable layer. The testimony point is tricky (self-consistency).
      *   **Round 5 (Theo):** Argument from *reliability hierarchy*. General psych findings are more robust than private intuition. That's the bottom.
          *   *Assessment:* Pragmatically true. Aggregate data usually beats individual intuition in noisy domains.
      *   **Round 6 (Maya):** Argument from *already discounted*. She claims she moved from 95% to 85% *because* of doubt. Theo counters: How do you know *that* discount wasn't biased?
          *   *Assessment:* Maya claims she did calibration. Theo points out she can't verify her own calibration without outside help.

  3.  **Evaluate Specific Philosophical Issues:**
      *   **Incoherence/Akrasia (Round 2):** Is it irrational to say "I believe P with 85% confidence, but I know people like me are usually wrong"?
          *   *Standard Bayesian View:* Your credence should reflect *all* available evidence, including evidence about your own reliability. If you know you are overconfident, your "raw" confidence is not your "true" credence.
          *   *Maya's View:* She treats the object-level evidence as primary and the track record as secondary/external.
          *   *Verdict:* Theo is closer to standard epistemology here. Your credence *must* incorporate evidence about your own cognitive state. However, Maya isn't being *incoherent* if she views the 85% as the *output* after adjustment, but she admits in Round 6 she did some adjustment already.
      *   **Inside vs. Outside View:** This is the core conflict. Maya is Inside (specific details). Theo is Outside (reference class). Best practice is usually Outside first, then adjust for Inside.

  4.  **Identify Missing Options/Dissolutions:**
      *   **The Number Itself:** Maya treats 85% as a fixed truth. Theo treats it as a claim to be audited.
      *   **Resolution:** They could separate *confidence* from *calibration*. Or use a range. Or acknowledge that 85% is a "feeling" not a "statistic."
      *   **The "Toll" (Round 6):** Maya claims she already paid the overconfidence tax. Theo says she can't verify the payment.
      *   **Dissolution:** They need to agree on *how* the 85% was derived. Was it raw intuition? Or calculated? If calculated, did it include base rates?
      *   **Missing Option:** Pre-commitment to calibration. Or acknowledging that "85%" is meaningless without a reference class.

  5.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the depth of the fight. It's a classic epistemological clash (Internalism vs. Externalism / Inside vs. Outside View).
      *   **Round-by-Round Analysis:**
          *   (1) Theo: Right on principle (Reference Class Forecasting).
          *   (2) Maya: Wrong on the rain analogy (sensory vs. inferential), but right that blind discounting is weird. *Key philosophical point:* It's not incoherent to adjust for bias; it's required.
          *   (3) Theo: Right. The "feeling" is the bias.
          *   (4) Maya: Regress is a theoretical worry, not practical. Testimony point is weak (consensus vs. individual).
          *   (5) Theo: Right on reliability hierarchy.
          *   (6) Maya: Plausible, but unverifiable. Theo: Right that self-verification is circular.
      *   **The "Incoherence" Question:** Address the philosophical debate. (Christensen/Elga vs. Traditional Internalists). Conclude that Theo is more aligned with modern Bayesian epistemology regarding "defeat."
      *   **Missing Options:**
          *   Distinguish *Raw Credence* vs. *All-Things-Considered Credence*.
          *   Reference Class Forecasting (Kahneman).
          *   Prediction Markets/External Auditing.
      *   **Overall Verdict:** Theo wins on the *process* of probability, Maya wins on the *motivation* (she cares about the details). But Theo is more "right" about how probability works.

  6.  **Refining the Tone:**
      *   Ensure I don't sound condescending.
      *   Make sure to explicitly answer the prompt's specific questions (Round by round, incoherence question, missing options, overall winner).
      *   Check the "Rain Analogy" in Round 2. Rain on head is sensory data (near certainty). Product failure is inferential. Big difference. I need to highlight this.

  7.  **Final Polish:**
      *   Check for clarity on the "akrasia" point. (Akrasia is weakness of will, but here it's more about "epistemic akrasia" - believing p while believing one shouldn't believe p).
      *   Ensure the distinction between "Inside View" and "Outside View" is clear, as that's the practical translation of their philosophical dispute.

  8.  *(Self-Correction during drafting)*: I initially thought about saying Maya is right about the regress. But in practice, we stop at the most reliable evidence. Theo is right that psych stats > private intuition. I need to make sure I don't get too bogged down in jargon. Keep it grounded in their argument.
      *   *Correction on Round 2:* Maya claims discounting makes her believe her evidence points one way but believe the other. Theo says discounting *is* believing the evidence correctly. Theo is right. If your evidence includes "I am biased," ignoring that is ignoring evidence.

  9.  **Finalizing the Verdict:** Theo is technically more correct about probability theory. Maya is emotionally/psychologically understandable but epistemologically shaky.

  10. **Output Generation** (Proceed to write the response following this structure).
answer: |-
  This is a sophisticated argument that touches on epistemology, probability theory, and behavioral psychology. It is essentially a debate between the **Inside View** (Maya: focusing on the specific details of the case) and the **Outside View** (Theo: focusing on reference classes and statistical baselines).

  Here is the round-by-round refereeing, followed by the philosophical assessment and the final verdict.

  ### Round-by-Round Analysis

  **Round 1: Theo's Opening (The Outside View)**
  *   **Theo's Claim:** Maya's specific reasoning is less reliable than her historical calibration and general psychological data regarding overconfidence.
  *   **Verdict:** **Theo is right.** In probability theory and forecasting (specifically the work of Daniel Kahneman and Philip Tetlock), the "Outside View" is the necessary anchor. You must start with the base rate (how often do products like this fail?) and then adjust for the specific case. Maya started with the specific case and assigned a number without anchoring to her own reliability. Theo correctly identifies that her track record is *evidence about her evidence*.

  **Round 2: Maya's Defense (The Incoherence Charge)**
  *   **Maya's Claim:** Discounting her judgment creates a split mind (believing the evidence says "fail" but believing the probability is lower). She compares this to ignoring rain on her head because a forecast said 20%.
  *   **Verdict:** **Maya is wrong, but for understandable reasons.**
      *   **The Analogy:** Her rain analogy fails. Feeling rain on your head is sensory data with near-100% reliability. Assessing a market product is complex inference with high noise. A better analogy would be: "I feel sober enough to drive, but I know I had five beers." You must trust the statistic over the feeling.
      *   **The Incoherence:** Philosophers of epistemology (like David Christensen or Adam Elga) discuss "epistemic akrasia" (believing *p* while believing you shouldn't believe *p*). Maya thinks adjusting for bias creates this. However, the standard Bayesian view is that your "credence" (confidence level) *must* incorporate all available evidence, including evidence about your own cognitive flaws. Ignoring the track record is actually the incoherent move because it ignores a chunk of relevant data.

  **Round 3: Theo's Counter (The Meta-Level)**
  *   **Theo's Claim:** The feeling of clarity is exactly what overconfidence feels like. Adjusting isn't ignoring evidence; it's processing it correctly.
  *   **Verdict:** **Theo is right.** This is the strongest point in the debate. Cognitive bias is not a bug you can see from the inside; it is the lens through which you see. You cannot "see" your own overconfidence directly; you only know it via meta-data (track records, studies). Therefore, the meta-data must override the raw feeling of clarity.

  **Round 4: Maya's Regress (The Infinite Loop)**
  *   **Maya's Claim:** If I adjust for bias, don't I need to adjust for bias in the adjustment? Also, why trust the studies (testimony) over my reasoning?
  *   **Verdict:** **Maya raises a valid theoretical point, but loses on practice.**
      *   **Regress:** In theory, yes, you could doubt your correction. In practice, you stop at the most reliable layer of evidence. The statistical finding that "humans are overconfident" is more robust than "my feeling that I corrected enough."
      *   **Testimony:** She asks why the studies get a pass. The answer is aggregation. A meta-analysis of thousands of subjects is statistically more reliable than one person's reasoning in a vacuum. She is trying to treat her singular intuition as equal to aggregate data.

  **Round 5: Theo's Bottom (Reliability Hierarchy)**
  *   **Theo's Claim:** The process stops where the evidence is most reliable. Aggregate psych data > private intuition.
  *   **Verdict:** **Theo is right.** This is the pragmatic resolution to the regress problem. We trust the thermometer over our feeling of fever because the thermometer has a known calibration. Theo is arguing that the "psych literature + track record" is the thermometer.

  **Round 6: The Toll (Did she already pay?)**
  *   **Maya's Claim:** She already lowered her estimate from 95% to 85% to account for doubt.
  *   **Theo's Claim:** She cannot verify that the discount was sufficient because the same biased mind applied the discount.
  *   **Verdict:** **Theo is right.** This is the "Calibration Problem." You cannot calibrate yourself using your own uncalibrated judgment. If you are overconfident, you will likely be overconfident about *how much you corrected for overconfidence*.

  ### The Philosophical Question: Is Maya's Stance Incoherent?

  You asked whether Maya's move in Round 2 is incoherence or a defensible stance.

  **It is technically incoherent by modern Bayesian standards, but defensible by older Internalist standards.**

  *   **The Internalist View (Maya):** I am responsible for what I can see in my mind. If the reasoning looks sound *to me*, I am rational to believe it. To believe otherwise is to betray my own rational faculties.
  *   **The Externalist/Bayesian View (Theo):** Rationality is about matching your beliefs to the truth-conduciveness of your processes. If your process is known to be flawed (overconfidence), maintaining a high credence is irrational, even if it "feels" right.

  **Referee's Ruling:** Theo is closer to the truth here. In high-stakes forecasting, "feeling rational" is not a valid defense against statistical calibration. Maya is conflating *justification* (I have reasons) with *reliability* (my reasons usually lead to truth). You can have justification without reliability.

  ### Missing Options: How to Dissolve the Fight

  They are fighting because they are treating the number "85%" as a property of the *product*, rather than a property of *Maya's relationship to the product*. Here are three options that would dissolve the tension:

  1.  **Separate "Raw" from "Adjusted" Credence:**
      Maya should say: "My **Inside View** assessment is 95% failure. My **Outside View** adjustment for my track record and general bias lowers it to 85%."
      *   *Why this helps:* It validates Maya's reasoning (she isn't ignoring her work) while validating Theo's correction (the final number must reflect calibration). They aren't fighting about the reasoning; they are fighting about the final calibration.

  2.  **Reference Class Forecasting:**
      Instead of arguing about Maya's mind, they should look at the data. What is the failure rate of similar products in similar companies with similar deadlines?
      *   *Why this helps:* It moves the argument from "Maya vs. Theo" to "Maya & Theo vs. The Data." If the base rate is 50% failure, 85% is definitely too high. If the base rate is 90% failure, Maya might be right.

  3.  **The "Pre-Mortem" Compromise:**
      Maya is worried about the product; Theo is worried about the probability. They should agree to run a "pre-mortem": Assume the product *succeeded* and write down why.
      *   *Why this helps:* It forces Maya to use her reasoning skills to argue *against* her own conclusion, which naturally reduces overconfidence without needing Theo to police her numbers.

  ### Overall Verdict

  **Theo comes out more right overall.**

  Maya is winning the battle of **motivation** (she cares deeply about the specific details and logic), but Theo is winning the war of **epistemology** (how we actually know things).

  *   **Maya's Error:** She treats her reasoning as a transparent window to truth. She fails to acknowledge that she is the instrument measuring the truth, and instruments need calibration.
  *   **Theo's Strength:** He correctly identifies that in uncertain domains, statistical baselines (track records, psych literature) generally outperform individual intuition, no matter how "clear" that intuition feels.

  **The Ruling:** Maya is permitted to feel 95% sure based on her work, but she is not permitted to report 85% as an objective probability without submitting that number to the calibration check Theo demands. Theo wins the argument, but he should acknowledge that Maya's "Inside View" work is valuable data that needs to be integrated, not just dismissed.

  **Advice for the Roommates:** Maya should report her confidence as a range (e.g., "60% to 85%") to acknowledge the uncertainty Theo raised, and Theo should acknowledge that Maya's detailed analysis is the only reason they can adjust the base rate at all. Make up, order pizza, and maybe bet a small amount of money on the outcome to see who is actually calibrated better next time.
