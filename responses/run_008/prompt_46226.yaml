prompt: |-
  I'm a charge nurse on an acute admissions ward and we're getting more and more patients turning up with psychiatric advance directives — sometimes called self-binding contracts or Ulysses contracts — where they wrote down, while well, what they want done when they're not well. Refuse this drug, don't refuse that one, contact my sister before you consider ECT, don't believe anything my brother tells you about my wishes. Some are formal, witnessed documents, some are letters to themselves, one guy brought his printed as a small laminated card which was oddly moving. We have no consistent way of handling them. Some consultants basically honour them reflexively, some treat them as wallpaper, and the rest of us make it up per shift, which I don't think is fair on anyone including the patient.

  What I want is a decision procedure my team can actually run at the point of admission, when we've got the person in front of us and maybe 20 minutes. It should be grounded in whatever the philosophy of precommitment actually says — the Ulysses and the sirens stuff, the question of whether the person who wrote the directive is the "real" patient or just an earlier snapshot, the worry that honouring these things just lets the well self boss around the ill self, and how constitutional thinkers handle the same problem when a founding generation binds later ones (there's something about how hard it should be to un-bind yourself that I suspect is relevant). But translated into steps we can follow, not an essay.

  Specifically: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops with "don't honour this", and where it deliberately hands off to human judgement because it's a values question not a facts one. It needs to handle the question of mid-episode revocation — patient arrives in crisis, tears up the directive, says they've changed their mind — and I want to be honest that I don't know if a procedure can settle that or whether it's the hard core of the whole thing. Also whether the strength of the directive should depend on how formally it was made, which feels wrong to me (a scrawled heartfelt letter vs a witnessed legal document) but maybe isn't.

  Then run it on three cases:

  1. Woman with schizoaffective disorder whose directive refuses olanzapine specifically after she gained 30kg on it, listing two acceptable alternatives — but she's arrived floridly psychotic and refusing all medication, not just the olanzapine.
  2. Man with alcohol dependence who pre-authorised his wife to have him kept in for a week if he shows up drunk asking to go home, and he's now here, drunk, begging to go home and clearly meaning it.
  3. A directive that looks like it was written mostly to please the patient's father, who drafted it and drove him to the appointment — the "signature" question.

  Include at least one case where the procedure gives an answer I won't like — I'd want the wife's contract honoured, personally, and I suspect a decent procedure might not let me. And be clear about what the whole thing can't do: presumably it can't tell us whether honouring a past self's wishes against a present self's protests is care or coercion, only when we're doing it. Keep the philosophy real but assume the person running it has read none of it. Also please spell out the failure modes — I'd rather know in advance where this procedure misfires than find out at a serious incident review.

  (fwiw we're in England, so we're working alongside the Mental Capacity Act, but I want the procedure to be about the ethics of it, the legal stuff we can look up seperately.)
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Charge Nurse on an acute admissions ward (England).
      *   **Problem:** Inconsistent handling of Psychiatric Advance Directives (PADs) / Ulysses Contracts.
      *   **Goal:** A practical decision procedure (algorithm/checklist) for the point of admission (approx. 20 mins).
      *   **Philosophical Grounding:** Needs to reflect precommitment theory (Ulysses/Sirens), identity continuity (well self vs. ill self), constitutionalism (binding future selves), but translated into clinical steps.
      *   **Specific Requirements:**
          *   Ordered questions with pass/fail criteria.
          *   Handling mid-episode revocation (tearing up the directive).
          *   Handling formality (laminated card vs. witnessed doc).
          *   Run on three specific cases (Schizoaffective/Olanzapine, Alcohol/Wife authorization, Father-drafted directive).
          *   Include at least one counter-intuitive outcome (where the nurse's instinct might clash with the procedure).
          *   Explicitly state limitations/failure modes.
          *   Context: England (Mental Capacity Act exists, but focus is on *ethics*, not just law).

  2.  **Deconstruct the Philosophy for Clinical Use:**
      *   *Ulysses Contract:* Binding oneself to prevent future weakness of will. Key question: Was the binding intentional and specific?
      *   *Identity/Continuity:* Is the "ill self" the same person as the "well self"? If the illness distorts values fundamentally, the well self's instructions might carry *more* weight (authenticity). If the illness just changes preferences, the present self might have a claim.
      *   *Constitutionalism:* How hard is it to amend the constitution? (Revocation standards). A constitution shouldn't be tearable in a moment of passion.
      *   *Formality:* Does a witnessed doc matter more than a letter? Ethically, *intent* matters more than *form*, but form evidences intent. The procedure should weigh *clarity of intent* over *legal witness*.
      *   *Revocation:* Can the ill self revoke the well self's order? Usually, Ulysses contracts are designed to survive revocation *during* the crisis. Otherwise, they are useless.

  3.  **Drafting the Procedure (The "Ulysses Protocol"):**
      *   *Time limit:* Needs to be doable in 20 mins.
      *   *Structure:* Triage -> Validity -> Applicability -> Revocation -> Action.
      *   *Tone:* Clinical, direct, non-judgmental.
      *   *Key Ethical Hurdle:* The "Revocation Problem." If a patient says "I changed my mind" *during* the crisis the directive anticipated, do we listen?
          *   *Philosophical stance:* The whole point of a Ulysses contract is to ignore the "Siren song" of the impaired self. Therefore, *crisis revocation* should generally be invalid unless there's evidence of new, stable information.
      *   *Formality:* Don't discount the laminated card. Focus on *specificity* and *anticipation of crisis*.

  4.  **Developing the Steps:**
      *   *Step 1: Authenticity (The "Who").* Did the well self write this? (Signatures, specific details, consistency).
      *   *Step 2: Anticipation (The "When").* Does this specific crisis match the one predicted? (Ulysses tied himself for the Sirens, not for a storm).
      *   *Step 3: Specificity (The "What").* Is the instruction clear? (Refuse X, Allow Y).
      *   *Step 4: Revocation (The "Now").* Is the current refusal a symptom of the predicted state? (If yes, directive stands).
      *   *Step 5: Harm/Benefit Check.* Does following this cause immediate severe harm that outweighs autonomy? (Safety valve).

  5.  **Refining the "Revocation" Logic:**
      *   This is the hardest part. If the procedure says "Ignore current refusal if it matches the predicted crisis," that feels coercive. If it says "Listen to current refusal," the directive is useless.
      *   *Solution:* The procedure must distinguish between *symptomatic revocation* (part of the psychosis/addiction) and *rational revision*. In acute admission, assume symptomatic unless proven otherwise. This addresses the "Ulysses" point: he asked to be bound *because* he knew he'd beg to be released.

  6.  **Testing against Cases:**
      *   *Case 1 (Schizoaffective/Olanzapine):*
          *   Authentic? Yes.
          *   Anticipated? Yes (psychosis).
          *   Specific? Yes (No Olanzapine, use Alternatives).
          *   Revocation? She is refusing *all* meds. The directive says no Olanzapine, but implies consent to *alternatives*.
          *   *Outcome:* Honour the refusal of Olanzapine. Try alternatives. If alternatives refused due to psychosis, the directive supports treating with alternatives despite current refusal.
      *   *Case 2 (Alcohol/Wife):*
          *   Authentic? Yes.
          *   Anticipated? Yes (drunk + asking to leave).
          *   Specific? Yes (Keep for 1 week).
          *   Revocation? Begging to go home.
          *   *Ethical Clash:* Nurse wants to honour it (safety). Procedure might flag this as "detention for social/addiction reasons" which might fail the "Medical Necessity" check in Step 5. *Self-Correction:* The prompt asks for *one case where the procedure gives an answer I won't like*. This is the perfect candidate. A Ulysses contract for *social* detention (addiction) is ethically fraught compared to medical treatment. The procedure should flag that precommitment cannot authorize detention *solely* for convenience or non-medical containment if capacity is legally intact or if the MHA doesn't cover it. *Wait, keep it ethical, not legal.* Ethically: Does the well-self have the right to imprison the ill-self for a habit?
          *   *Decision:* The procedure should challenge the *proportionality*. Is 1 week detention proportionate to the risk? If the risk is just "relapse," maybe not. If the risk is "death," maybe. Let's make the procedure flag this as a "Values Handoff" because it borders on punitive containment.
      *   *Case 3 (Father-drafted):*
          *   Authentic? Doubtful. "Signature" question.
          *   *Outcome:* Reject/Defer.

  7.  **Addressing the "Formality" Question:**
      *   The nurse feels a scrawled letter shouldn't count less than a witnessed doc.
      *   *Philosophical alignment:* Autonomy is about *will*, not *notary*.
      *   *Procedure:* Weight *content specificity* higher than *witnesses*. A specific laminated card > a vague witnessed letter.

  8.  **Addressing Limitations/Failure Modes:**
      *   Can't solve the "Two Selves" metaphysical problem.
      *   Can't protect against bad faith families.
      *   Can't override immediate life-safety (Emergency Doctrine).
      *   Risk of "Directive Fatigue" (staff ignoring them because the procedure is hard).

  9.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the difficulty. Validate the nurse's experience.
      *   *The Protocol:* Name it something clear. "The Precommitment Triage Protocol."
      *   *Steps:* 1. Identity & Intent. 2. Scenario Match. 3. The Revocation Test. 4. The Harm Floor.
      *   *Case Studies:* Apply rigorously.
      *   *Failure Modes:* Be honest about where it breaks.

  10. **Refining the "Uncomfortable Outcome":**
      *   I need to ensure Case 2 (Alcohol) potentially fails the procedure or requires a "Values Handoff" that the nurse might find frustrating.
      *   *Why?* Because Ulysses contracts in addiction are controversial. Binding yourself to *detention* is different than binding yourself to *treatment*.
      *   *Adjustment:* The procedure will flag "Non-Medical Containment." If the directive asks for detention without specific medical treatment, it fails the "Therapeutic Intent" check. This contradicts the nurse's desire to keep him safe, highlighting the tension between care and liberty.

  11. **Final Review against Constraints:**
      *   England context (mention MCA/MHA as background, focus on ethics).
      *   20-minute limit.
      *   Philosophy translated (Ulysses, Constitutionalism).
      *   Specific cases covered.
      *   Failure modes included.

  12. **Writing the Response:** (Mental check: Ensure tone is supportive but rigorous. Avoid legalese. Keep the philosophy implicit in the steps but explained in the rationale.) *Self-Correction on Case 2:* Make sure the "uncomfortable outcome" is clear. The nurse wants to hold him. The procedure might say "You can't hold him just because he asked you to previously if there's no immediate medical risk justifying detention *now*." This highlights the limit of precommitment regarding liberty.

      *Wait, one nuance:* In England, you can't really "contract" into detention under the MHA. But the prompt asks for *ethics*, not law. Ethically, can a past self deprive a future self of liberty for addiction? Many ethicists say no, because addiction undermines the "well self's" judgment too, or because liberty is a fundamental right that can't be signed away lightly. I will lean into this tension.

      *Let's refine the "Revocation" step.* This is the core Ulysses moment. If the patient says "I revoke this," the procedure must ask: "Is this revocation a symptom of the condition the directive predicted?" If Yes -> Directive Stands. If No -> Directive Void. This is the hard line.

      *Let's refine the "Formality" step.* Explicitly state: "Specificity trumps Witnessing."

      *Okay, ready to write.*
answer: |-
  This is one of the hardest knots in psychiatric ethics. You are dealing with the **Problem of Diachronic Autonomy**: does the "well self" have the right to rule the "ill self," and if so, how much?

  In political philosophy, this is the Constitutional problem: how hard should it be to amend the founding document? If it's too easy (tearing up the card), the constitution is worthless. If it's too hard (ignoring all current protests), it becomes tyranny.

  Below is a decision procedure designed for a 20-minute admission window. It prioritises **specificity of intent** over **legal formality**, and treats **crisis revocation** as invalid unless there is evidence of new, stable information.

  ### The Precommitment Triage Protocol (PTP)

  **Time limit:** 20 Minutes
  **Goal:** Determine if the directive acts as a valid instruction or merely as evidence of preference.
  **Philosophy:** A Ulysses contract is only valid if the current situation matches the "Sirens" the patient predicted.

  #### Step 1: The Authenticity Check (Identity)
  *Question:* Is there reason to believe this document reflects the patient's stable values, not someone else's?
  *   **Look for:** Specific reasoning ("I refuse Olanzapine because I gained 30kg"), specific triggers ("When I stop sleeping for 3 days"), or specific identifiers (handwriting, laminated card carried consistently).
  *   **Red Flag:** Generic language ("I agree to all treatment"), drafted by a relative without patient input, or produced for the first time at the point of crisis by a family member.
  *   **Pass:** Specific reasoning + evidence of prior possession (e.g., they brought it, or it was filed previously).
  *   **Fail:** Vague, produced solely by family, or contradicts known long-term values.
  *   **Action:** If **Fail**, treat as family opinion, not a directive. Stop here.

  #### Step 2: The Scenario Match (Applicability)
  *Question:* Is the current crisis the one the directive anticipated?
  *   **Look for:** Does the clinical picture match the "If/Then" logic? (e.g., Directive says "If I am psychotic," patient is psychotic).
  *   **Nuance:** Ulysses tied himself for the *Sirens*, not for a storm. If the directive is for psychosis but the patient is currently delirious from infection, the directive does not apply.
  *   **Pass:** Clinical state matches the predicted state in the directive.
  *   **Fail:** Clinical state is different (e.g., directive for mania, patient is depressed).
  *   **Action:** If **Fail**, directive is inactive. Use standard best interest/capacity assessment.

  #### Step 3: The Revocation Test (The Hard Core)
  *Question:* Is the patient's current refusal/revocation a symptom of the predicted state?
  *   **The Philosophy:** The point of a Ulysses contract is to survive the moment you want to break it. If the "ill self" could veto the "well self" simply by saying "no," the contract is useless.
  *   **The Test:** Ask: *If the patient were well today, would they view this current refusal as part of the illness?*
  *   **Pass:** The refusal is consistent with the pathology predicted (e.g., paranoid refusal of meds in a psychotic patient who predicted paranoid refusal). **Honour the Directive.**
  *   **Fail:** The patient offers a rational, stable reason for change based on *new information* (e.g., "I refused Drug X last year because of weight gain, but now there is a new formulation that doesn't cause weight gain"). **Honour the Revocation.**
  *   **Action:** In acute admission, assume **Pass** unless there is clear evidence of new, stable information.

  #### Step 4: The Harm Floor (Safety Valve)
  *Question:* Does following the directive pose an immediate, severe risk of death or irreversible harm that outweighs the autonomy interest?
  *   **The Philosophy:** Even constitutions have emergency powers. You cannot pre-authorise your own neglect to the point of death.
  *   **Pass:** Risk is manageable within the directive's constraints.
  *   **Fail:** Following the directive leads to immediate, severe physical harm (e.g., refusing insulin in DKA, or refusing *any* antipsychotic in lethal catatonia).
  *   **Action:** If **Fail**, override directive to save life/limb. Document why the "Harm Floor" was triggered. This is a **Values Handoff** to the Consultant.

  #### Step 5: Formality Weighting
  *   **Rule:** **Specificity trumps Witnessing.**
  *   A detailed, laminated card written by the patient carries more ethical weight than a vague, witnessed legal form drafted by a solicitor.
  *   **Why:** We are honouring *will*, not *procedure*. A heartfelt letter proves the patient thought about this. A witnessed form often proves they met a solicitor.

  ---

  ### Case Runs

  Here is how the PTP handles your three cases.

  #### Case 1: The Schizoaffective Woman (Olanzapine Refusal)
  *   **Step 1 (Authenticity):** **Pass.** Specific reasoning (weight gain), specific alternatives listed.
  *   **Step 2 (Scenario):** **Pass.** She is floridly psychotic, which was the anticipated state.
  *   **Step 3 (Revocation):** **Pass.** She is refusing *all* meds. This is consistent with the psychosis she predicted. Her current "No" is the Siren song the directive was designed to block.
  *   **Step 4 (Harm Floor):** **Pass.** She has two acceptable alternatives listed. Treating with an alternative does not breach the Harm Floor.
  *   **Outcome:** **Honour the Directive.** Do not give Olanzapine. Administer one of the listed alternatives under the authority of the directive, even though she is currently refusing.
  *   **Note:** This validates the "Well Self." She knew she would refuse meds when psychotic. She authorized alternatives. You follow the authorization, not the current refusal.

  #### Case 2: The Alcohol Dependent Man (The Wife's Contract)
  *   **Step 1 (Authenticity):** **Pass.** Pre-authorised by him, specific instruction.
  *   **Step 2 (Scenario):** **Pass.** He is drunk and asking to leave, exactly as predicted.
  *   **Step 3 (Revocation):** **Pass.** His begging to leave is the addiction speaking. The contract was made to override this specific impulse.
  *   **Step 4 (Harm Floor):** **FAIL / VALUES HANDOFF.**
      *   *The Conflict:* The directive asks for **detention** ("keep me in"), not just **treatment**.
      *   *The Ethical Limit:* Precommitment generally binds you to *treatment*, not *liberty deprivation* for social reasons. Unless he is medically at risk of immediate withdrawal death (Delirium Tremens), holding a man solely because he signed a paper a month ago risks turning the ward into a prison.
      *   *The Procedure's Verdict:* The procedure flags this. You cannot honour a directive that demands detention *without* clear, immediate medical necessity, even if the patient asked for it.
  *   **Outcome:** **Do not honour the detention request solely on the basis of the contract.** You must assess his current capacity and risk under standard criteria (MHA/MCA).
  *   **Why you won't like it:** You want to keep him safe. He *asked* to be kept safe. But ethically, the "Well Self" cannot easily sign away the "Ill Self's" right to liberty for a non-medical reason (addiction management) without current medical justification. This prevents "contractual detention."

  #### Case 3: The Father-Drafted Directive
  *   **Step 1 (Authenticity):** **FAIL.**
      *   *Reasoning:* The "Signature" question. If the father drafted it and drove him to the appointment, there is a high probability of coercion or "pleasing the parent" rather than authentic self-binding.
      *   *Indicator:* Language sounds clinical or parental rather than personal. No specific reasoning from the patient's perspective.
  *   **Outcome:** **Reject as a Directive.** Treat it as information from the Next of Kin. Do not act on it as a binding instruction.
  *   **Why:** A Ulysses contract requires the *agent* to tie themselves. If the father tied the rope, it's not a Ulysses contract; it's restraint.

  ---

  ### Failure Modes & Limitations

  You asked for honesty about where this breaks. A procedure cannot solve metaphysical problems, only manage them.

  **1. The "Two Selves" Trap**
  The procedure assumes the "Well Self" is the authentic one. Sometimes, the "Ill Self" reveals truths the "Well Self" was suppressing (e.g., a patient refuses meds when well because they hate the side effects, but signs a directive to please the doctor, then refuses when ill because they actually hate the side effects).
  *   *Risk:* You might be enforcing a lie the patient told when they were trying to be "good."
  *   *Mitigation:* Step 1 (Authenticity) must look for *personal* reasoning, not clinical jargon.

  **2. The Revocation Blindspot**
  Step 3 assumes crisis revocation is invalid. But what if the patient has partially recovered enough to have a lucid interval *during* the admission, and *then* revokes?
  *   *Risk:* The procedure treats all crisis refusal as symptoms. It might miss a genuine change of mind during a lucid window.
  *   *Mitigation:* If the patient is calm, rational, and retains information for 24 hours, re-run Step 3.

  **3. The "Formality" Bias**
  I told you to prioritise specificity over witnessing.
  *   *Risk:* Staff may ignore a witnessed legal document because a laminated card looks "more heartfelt." This invites liability.
  *   *Mitigation:* Use the witnessed document as evidence of *timing*, but the card as evidence of *intent*. If they conflict, the more recent document usually wins ethically, regardless of form.

  **4. The Moral Distress Point**
  In Case 2 (Alcohol), the procedure tells you to potentially let him leave even though he begged you to hold him.
  *   *Reality:* This will feel like abandoning a patient.
  *   *Reason:* Ethics distinguishes between *Care* (treating illness) and *Control* (managing behaviour). A directive can authorize Care. It struggles to authorize Control. If you ignore this, you risk normalising voluntary detention contracts which undermines the Mental Health Act's safeguards.

  ### How to Implement This Tomorrow

  1.  **Print the 5 Steps.** Put them on the admission desk.
  2.  **The "Values Handoff".** Make it clear that Step 4 (Harm Floor) and Case 2 scenarios are not for the Charge Nurse to decide alone. That is the trigger to call the Consultant. The procedure tells you *when* to ask, not always *what* to do.
  3.  **Document the "Why".** When you honour a directive against current refusal, write: *"Honouring PAD under PTP Step 3. Current refusal assessed as symptomatic of predicted state."* This protects your team from accusations of ignoring the patient's current voice.

  This procedure doesn't solve the tragedy of mental illness. It just ensures that when you override a screaming patient, you do it because their *past self* asked you to, not because it's convenient for the ward.
