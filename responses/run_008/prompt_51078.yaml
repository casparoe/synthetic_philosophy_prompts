      *   **The "Free-Floating Rationale":** This is a direct reference to Daniel Dennett. I need to acknowledge that.
      *   **The "Fact of the Matter":** Why do we feel a function claim can be *false*? (e.g., giraffe necks not just for reaching leaves). This suggests functions aren't just stories; they track something real.
      *   **The Boundary:** Why do we say a heart has a function but a rock rolling down a hill doesn't? (Etiological vs. Systemic accounts).
      *   **The Consistency Check:** Documentaries say "no design" but talk "as if design." Is this hypocritical or necessary?
      *   **The Cost of Elimination:** If we ban teleology, what happens to biology?

  3.  **Drafting the Response - Section by Section:**

