      *   **Part 1: The "Free-Floating Rationale" (What is it?):** Explain Dennett's concept. Natural selection acts *as if* it were a designer. It filters out the bad designs. The "reason" is in the filtering process, not the mind of the organism.
      *   **Part 2: Shorthand or Real?** Address the "just shorthand" worry. It's not *just* shorthand; it tracks a specific kind of causal history (Selected Effects).
          *   *Example:* The heart pumps blood. That's what it was selected *for*. It also makes a thumping sound, but that's not its function.
