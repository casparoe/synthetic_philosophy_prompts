      *   **Key Concepts:** Teleology, function, evolution, natural selection, "free-floating rationales" (Dennett), reductionism vs. realism about functions.
      *   **Tone:** Respectful, engaging, clear (avoiding excessive jargon where possible, but explaining necessary terms), acknowledging the user's practical background.

  2.  **Deconstruct the Philosophical Problem:**
