answer: |-
  You have put your finger on one of the oldest and stickiest problems in the philosophy of biology. Your friend was right to point you toward Daniel Dennett, who coined the phrase "free-floating rationales," but the tension you feel is something that has bothered thinkers since Aristotle.

  As an electrician, you know that understanding a circuit often means understanding what each component is *supposed* to do. If a fuse blows, it hasn't necessarily "failed"; it might have done exactly what it was designed to do. If a wire melts, that is a failure. You can make that distinction even if the fuse has no mind and the circuit board has no intentions.

  Here is an untangling of what that practice presupposes, where the line is drawn, and what would be lost if we tried to speak without it.

  ### 1. What does the practice presuppose?
  When a narrator says, "The woodpecker has a thick skull *to protect* its brain," they are not claiming the woodpecker intended this, nor that a Creator designed it. They are presupposing a specific kind of **causal history**.

  In philosophy, this is often called the **Etiological Theory of Function**. It says that for something to have a function (a "reason for being"), it must be there *because* it did that thing in the past.

  *   **The Heart:** Your heart beats. It also makes a thumping sound. But only the pumping is its "function." Why? Because ancestors of yours who had hearts that pumped blood survived and reproduced. The thumping sound didn't help them survive. The pumping is the "reason" the heart exists today.
  *   **The Jam Jar:** Your grandmother inverted the jars. She did it because she was taught to do it. The practice survived in your family culture because it worked (the seal held). Jars that weren't inverted (in other families, perhaps) spoiled, and that "recipe variant" died out.

  So, the practice presupposes **selection**. It assumes that the trait exists now *because* it performed that specific job in the past. The "reason" is not in the mind of the moth; the "reason" is embedded in the history of the moth's ancestors. The rationale is "free-floating" because it was once attached to the survival success of ancestors, and now it is attached to the structure of the descendant, with no conscious mind required in between.

  ### 2. Is it just shorthand, or is there a genuine fact of the matter?
  You asked why it feels like there is a fact to be right or wrong about, rather than just a story. That is because functional claims are **testable hypotheses about history.**

  If a narrator says, "Giraffes have long necks to reach high leaves," and a biologist says, "No, that's wrong; they have long necks for sexual combat," they are arguing about **which selective pressure caused the trait to persist.**

  This is not just semantics. If the "high leaves" theory is true, we expect to find giraffes feeding high up often. If the "combat" theory is true, we expect to find males using necks as weapons more than females (which we do).

  So, it is not *mere* shorthand. It is a claim about the causal filter that shaped the organism. If you get the function wrong, you will make wrong predictions about the animal's behavior, anatomy, and vulnerabilities. That is why it feels like a "real" fact. It is a fact about the evolutionary past that constrains the biological present.

  ### 3. Where is the line? (Rivers vs. Moths)
  You asked if a river has a reason to meander or a planet a reason to orbit. The standard philosophical line is drawn at **replication with variation.**

  *   **The Moth:** Moths reproduce. Some have slightly better eye spots. Those survive more. The next generation has better eye spots. The "reason" (predator confusion) is the mechanism of the filter.
  *   **The River:** Rivers do not reproduce. A meandering river does not make baby meandering rivers that inherit the meander trait. A planet does not replicate based on how stable its orbit is.

  Therefore, we say the river meanders due to *laws of physics* (erosion, fluid dynamics), not *functions*. To say a river is "trying" to meander is a metaphor. To say a moth is "trying" to hide is a shorthand for a literal historical process of selection.

  There are fringe theories (like "cosmological natural selection") that try to apply this to universes or atoms, but in standard science, the "reasons without reasoners" practice stops where biological (or cultural) replication stops.

  ### 4. Is the practice consistent?
  You noted the apparent contradiction: Documentaries insist nature has no purpose, then explain everything by purpose.

  Technically, philosophers distinguish between **Teleology** and **Teleonomy**.
  *   **Teleology:** Goal-directedness driven by conscious intent (e.g., I build a shed *to* store tools).
  *   **Teleonomy:** Apparent goal-directedness driven by a blind program or process (e.g., the woodpecker's skull).

  The documentaries are being consistent if you understand they are speaking of *teleonomy*. They are saying, "There is no conscious designer, but there is a design process (natural selection)."

  However, you are right to feel a friction. The language is borrowed from human intention ("attack the wrong end," "protect the brain"). This is unavoidable because human language evolved to talk about human actions. We literally do not have a vocabulary for "causal efficacy filtered by differential survival" that is punchy enough for a documentary. So they use the language of purpose as a tool to describe the *outcome* of a purposeless process. It is a controlled inconsistency, like a map that distorts distance to preserve direction.

  ### 5. What would be lost if we banned it?
  This is the most critical part. If we insisted, strictly, that "reasons require reasoners," could biology survive?

  You could translate every sentence.
  *   *Old way:* "The heart pumps blood to oxygenate the body."
  *   *Strict way:* "The heart pumps blood, and organisms with ancestors whose hearts pumped blood survived at higher rates than those whose did not."

  You *could* say it that way, but you would lose the ability to identify **malfunction.**

  As an electrician, if a wire melts, you know something went wrong. Why? Because you know what the wire is *for*. In a purely physical description, the melting wire is just atoms moving differently. There is no "wrong" in physics, only "what happened."

  In biology, "disease" and "error" only make sense if things have functions.
  *   If a bird is born with a heart on the right side, it might die.
  *   If we ban functional talk, that bird is just "different."
  *   If we allow functional talk, that bird has a **defect.**

  If you remove the "reasons without reasoners," you remove the standard by which we judge health, disease, adaptation, and failure. You reduce biology to geology. You can describe what the rock *does*, but you can't say what the rock *failed to do*. Since living things are constantly avoiding failure (death), you need the language of function to describe them accurately.

  ### Summary
  The practice presupposes that **history matters.** It assumes that the past survival of ancestors casts a shadow on the present structure of descendants.

  *   **Do reasons exist without reasoners?** Yes, in the sense that a "solution" to a problem (like predation) can exist in the structure of an organism even if no one solved it consciously. The "reason" is the fit between the organism and the environment, forged by time.
  *   **Is it shorthand?** It is shorthand for a complex causal history, but it tracks a real feature of the world (selection), so it is not *false*.
  *   **Where is the line?** At replication. Things that replicate and get filtered have functions; things that just obey physics do not.
  *   **What is lost?** If you ban this language, you lose the concept of "broken." You cannot do medicine, engineering, or biology without a concept of how things are *supposed* to work, even if no one is there to supervise them.

  Your grandmother's jam jars and the woodpecker's skull are the same kind of mystery. They are both artifacts of a filtering process—one cultural, one biological—where the "reasons" survived even after the reasoners died. That is not a contradiction; it is the only way complex things can exist in a universe that doesn't think.
