answer: |-
  ### 1. Essay Question

  **Comprehensive Exam: Metaphysics and Philosophy of Language**
  **Topic: Vagueness and Higher-Order Indeterminacy**
  **Time Allowed: 90 Minutes**

  Supervaluationism is frequently motivated by the intuition that vague predicates lack sharp boundaries, contrasting sharply with epistemicism, which posits unknowable cutoffs. However, a persistent objection holds that supervaluationism merely relocates the problem of sharpness rather than solving it. By defining truth via admissible precisifications, the supervaluationist introduces sharp boundaries between the definitely true, the indeterminate, and the definitely false. Consequently, the view appears to accept sharp boundaries at the level of higher-order vagueness even if it denies them at the first order.

  Write an essay evaluating this objection. Specifically, compare the theoretical cost of the epistemicist's unknowable first-order cutoffs against the supervaluationist's sharp penumbral boundaries. Is the supervaluationist's commitment to higher-order sharpness a decisive disadvantage, or is it a preferable trade-off for preserving classical logic and avoiding first-order arbitrariness? In your analysis, address whether the Sorites paradox is the central load-bearing problem driving this debate or if it serves as a distraction from the underlying metaphysical commitments.

  **Instructions:**
  *   You must commit to a definite verdict regarding which view is better placed to handle higher-order vagueness. Neutral comparisons that refuse to weigh the costs will be penalized.
  *   Do not reconstruct Williamson's margin-for-error principles; assume familiarity with the basic epistemicist stance.
  *   Do not waste space re-deriving the Sorites paradox; focus on the structural comparison of the views.

  ***

  ### 2. Model Answer

  Supervaluationism promises to reconcile classical logic with the intuition that vague predicates lack sharp boundaries. However, this promise is illusory. When evaluated against epistemicism regarding higher-order vagueness, supervaluationism proves theoretically inferior because it merely relocates the sharp boundary problem without offering compensating explanatory benefits. The epistemicist view, while counterintuitive, is ultimately the more honest and coherent position.

  The core motivation for supervaluationism is to avoid the epistemicist claim that there is a specific grain of sand that turns a non-heap into a heap. By defining truth as supertruth—truth on all admissible precisifications—the supervaluationist attempts to carve out a penumbra where statements lack a truth value. Yet, this move generates a new boundary. There must be a sharp cut-off between the cases that are definitely true (true on all precisifications) and those that are indeterminate (true on some, false on others). As Kit Fine and others have noted, this creates a boundary between the definite and the indefinite. If vagueness is ubiquitous, we should expect vagueness about where the definite cases end. By positing a sharp boundary here, the supervaluationist accepts higher-order sharpness.

  The epistemicist accepts first-order sharpness but denies higher-order vagueness in the same way. For the epistemicist, there is a fact of the matter about whether a case is F, and consequently, a fact of the matter about whether it is definitely F. The supervaluationist criticizes this as implausible unknowability. However, the supervaluationist's own sharp boundary between the definite and the indeterminate is equally unknowable in practice. We cannot identify precisely where the penumbra begins. Thus, both views commit to sharp boundaries that outstrip our discriminatory capacities. The difference is merely structural: the epistemicist places the cut-off between true and false, while the supervaluationist places it between definitely true and indeterminate.

  Why, then, prefer epistemicism? Theoretically, epistemicism is simpler. It maintains bivalence at every order of vagueness. Supervaluationism requires a complex semantics of precisifications only to reintroduce sharpness at a higher level. If we must accept sharp boundaries somewhere to avoid paradox, we should accept them where they do the most work. Epistemicism preserves classical logic without the semantic machinery of precisifications, which often struggle to define "admissibility" without circularity. The cost of unknowability is high, but the cost of penumbral sharpness is identical in kind, merely shifted. There is no gain in swapping one unknowable boundary for another while complicating the semantics.

  Regarding the Sorites paradox, it is a red herring in this specific comparative context. Both views solve Sorites by denying the major premise, albeit for different reasons. The epistemicist denies it because there is a false instance; the supervaluationist denies it because it contains indeterminate steps. Focusing on Sorites distracts from the metaphysical question: does vague language correspond to sharp reality? The higher-order vagueness objection reveals that supervaluationism answers "yes" just as epistemicism does. If the goal is to avoid sharp boundaries entirely, both fail. If the goal is theoretical coherence given that failure, epistemicism wins by Occam's razor.

  In conclusion, supervaluationism does not escape the problem of sharpness; it obscures it. The commitment to sharp boundaries between the definite and the indeterminate is just as costly as the epistemicist's first-order cutoffs. Given that both views entail unknowable boundaries, the view with the simpler semantics and consistent bivalence is preferable. Epistemicism is the lesser evil.

  ***

  ### 3. Marking Scheme

  **Total Points: 20**
  **Passing Threshold: 12**

  | Must-Hit Point | Points | Typical Fumble |
  | :--- | :---: | :--- |
  | **1. Identification of HOV Problem:** Clearly explains that supervaluationism introduces sharp boundaries between the definite and the indeterminate (penumbral connections). | 4 | Candidates describe first-order vagueness but fail to articulate where the second-order sharpness arises. |
  | **2. Comparative Cost Analysis:** Directly compares the theoretical cost of epistemic unknowability vs. supervaluationist penumbral sharpness. | 4 | Candidates list costs for each view separately without weighing them against one another. |
  | **3. Committed Verdict:** Takes a definite side on which view is better placed; neutrality or "both have pros and cons" conclusions are penalized. | 4 | Candidates hedge with "both views face difficulties" without declaring a winner as instructed. |
  | **4. Sorites Treatment:** Addresses whether Sorites is load-bearing or a distraction, avoiding unnecessary re-derivation of the paradox. | 4 | Candidates spend half the essay reconstructing the Sorites paradox instead of analyzing the metaphysical commitments. |
  | **5. Argumentative Coherence:** Arguments follow logically without relying on forbidden reconstructions (e.g., Williamson's margin-for-error). | 4 | Candidates drift into epistemological details about knowledge limits rather than semantic/metaphysical structure. |

  **Note on Neutrality:** Point 3 is strictly enforced. A candidate who argues that both views are equally viable or refuses to choose based on the HOV critique cannot score higher than 12/20, regardless of writing quality.
