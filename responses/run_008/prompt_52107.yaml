  3.  **Identify the Philosophical Landscape:**
      *   **Hard Incompatibilists / Skeptics:** (D.'s position). Galen Strawson (Basic Argument), Derk Pereboom (Hard Incompatibilism), Bruce Waller. They accept (1)-(6). They debate (7)-(8).
      *   **Compatibilists:** Reject the inference to (5). They argue control is compatible with determinism. (Strawson P.F., Frankfurt, Fischer & Ravizza, Dennett).
      *   **Libertarians:** Reject (3) or (4). Believe in contra-causal free will. (Kant, Chisholm, Kane).
      *   **Revisionists/Strawsonians:** Accept something like (6) regarding *ultimate* responsibility but keep reactive attitudes as natural facts. (P.F. Strawson is key here).

  4.  **Address Request 1: Where does it go wrong? (The Diagnosis)**
      *   *Option A: Step (4) / The Transfer Principle.* This is the "Consequence Argument" (van Inwagen). Compatibilists attack this. They say "control" doesn't require "ultimate origination."
      *   *Option B: Step (3) / Determinism.* Libertarians attack this. But this is scientifically/empirically costly.
      *   *Option C: Step (1) / The Control Principle.* Some (Strawsonians) might argue responsibility is not about control but about participation in a form of life.
      *   *Option D: Steps (7) & (8) / The Implications.* Even if (6) is true, does it entail (7) & (8)? Pereboom says yes (mostly), Strawsonians say no.

      *Decision:* The most standard "cheap" rejection for ordinary people is **Step (4)** (Compatibilism). The most philosophically rigorous rejection that accepts D.'s metaphysics but denies his conclusion is **P.F. Strawson's rejection of the demand in (1)**. The most honest admission is that **(5) is valid *if* you accept Hard Incompatibilism**, so the fight is earlier.

