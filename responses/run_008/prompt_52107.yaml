answer: |-
  Your friend D. has reconstructed a composite of two of the most formidable arguments in contemporary metaphysics and ethics: Galen Strawson's "Basic Argument" (steps 1–5) and Derk Pereboom's "Hard Incompatibilism" (steps 6–8). This is not a sophistry; it is a live position defended by serious philosophers. There is no consensus that it is false. However, there is also no consensus that it is true.

  Here is the breakdown of where the argument is contested, the costs of rejecting specific steps, and the specific disputes you asked to clarify.

  ### Part 1: Where the Argument Goes Wrong (If It Does)

  There are three primary locations where philosophers typically intervene. Each has a different "price."

  #### 1. Step (4): The Transfer of Non-Control
  > *(4) Whatever issues from a cause you did not choose is itself not within your control.*

  *   **The Objection:** This is the "Consequence Argument" (van Inwagen). Compatibilists argue this step equivocates on the word "control." It conflates *ultimate origination* (creating the causes of your causes) with *guidance control* (the ability to respond to reasons and execute intentions).
  *   **Why it looked fine:** It relies on a transitive intuition: If $A$ causes $B$, and I didn't control $A$, I don't control $B$. This feels like basic physics.
  *   **The Price of Rejection:**
      *   **What D. keeps:** If you reject (4), D. gets to say you have surrendered the idea of "ultimate" responsibility. You admit your character is a product of luck.
      *   **What you pay:** You must defend a "compatibilist" definition of control. You have to explain why control doesn't require being the *uncaused cause* of your actions.
      *   **What the rest of us pay:** We keep our practices of blame, but we lose the metaphysical comfort that the blamed person "could have done otherwise" in a deep, cosmic sense. We accept that blame is compatible with determinism.
  *   **Vulnerability:** This is the **cheapest step to give up** if the goal is to preserve ordinary moral life. It requires the least revision to our practices. However, D. will correctly point out that this changes the *definition* of control rather than finding a magical freedom inside the causal chain.

  #### 2. Step (1): The Control Principle
  > *(1) A person is a fitting target of blame only for what is within their control.*

  *   **The Objection:** This is the P.F. Strawson line (from "Freedom and Resentment"). Strawsonians argue that blame is not a theoretical judgment about metaphysics; it is a natural feature of human relationships (reactive attitudes). To ask for justification of blame *outside* the practice of blame is incoherent.
  *   **Why it looked fine:** It aligns with the deep intuition that "ought implies can." It seems unfair to blame someone for what they couldn't help.
  *   **The Price of Rejection:**
      *   **What D. keeps:** D. gets to claim you are being intellectually dishonest by ignoring the luck involved in character.
      *   **What you pay:** You abandon the attempt to *justify* blame metaphysically. You admit blame is not "deserved" in a cosmic sense but is rather a non-optional part of participating in a community of agents.
      *   **What the rest of us pay:** We lose the ability to tell D. that he is *wrong* to stop blaming. We can only say his form of life is different from ours.
  *   **Vulnerability:** This is philosophically robust but psychologically difficult. It asks us to stop looking for a "foundation" for blame.

  #### 3. Steps (7) and (8): The Implications
  > *(7) ...only honest criticism is forward-looking... (8) So there is no principled difference between blaming a person for their cruelty and blaming them for their height...*

  *   **The Objection:** Even if we accept (6) (no desert), (8) does not follow. This is the strongest point of leverage for your group. Most Hard Incompatibilists (like Pereboom) accept a version of (7) but **reject (8)**.
  *   **Why it looked fine:** D. assumes that if *desert* is removed, all distinctions collapse. If no one is responsible, cruelty is just a natural event like a storm.
  *   **The Price of Rejection:**
      *   **What D. keeps:** D. keeps the claim that no one *deserves* suffering.
      *   **What you pay:** You must argue that cruelty is relevantly different from height *even if neither is ultimately controlled*.
      *   **What the rest of us pay:** We must construct a justice system based on risk and reasons-responsiveness rather than retribution.
  *   **Vulnerability:** **Step (8) is the weakest link in the chain,** even among philosophers who agree with D. on steps (1)–(6). Cruelty involves reasons, intentions, and psychological mechanisms that are responsive to social incentives. Height does not. Therefore, treating them the same is pragmatically incoherent, even if metaphysically they share the same status regarding "ultimate control."

  ---

  ### Part 2: The Specific Disputes

  You asked for the unsettled questions to be laid bare. Here is the state of play.

  #### 1. Is the inference in (5) a fallacy or defensible aggregation?
  **Status: Contested.**
  *   **The Incompatibilist View (D.'s side):** It is valid. Galen Strawson calls this the "Basic Argument." If every choice is the result of a character you didn't choose, and you can't change your character without a prior choice (which also comes from your character), you are stuck in a regress. There is no "gap" where freedom hides. They deny it is a fallacy; they say it exposes the incoherence of free will.
  *   **The Compatibilist View:** It is a fallacy of equivocation. It assumes "control" requires "origination." They argue (5) only follows if you define control as "contra-causal freedom." If you define control as "reasons-responsiveness" (I would have done otherwise *if* there had been a reason to), the inference breaks.
  *   **The Verdict:** There is no consensus. It depends entirely on your prior definition of "control." D. is using the "Ultimate Responsibility" definition; your group is likely using the "Agency" definition. Neither can prove the other wrong without begging the question.

  #### 2. Can philosophers accept (6) and still retain blame?
  **Status: Yes, but it changes the nature of blame.**
  *   **The "Forward-Looking" Blame:** Philosophers like Derk Pereboom and Victoria McGeer argue you can keep blame, but it cannot be *retributive*. You blame to communicate norms, to protect others, and to reform the agent. It is a tool, not a punishment.
  *   **The "Strawsonian" Blame:** Others argue that blame is a reactive attitude (resentment, indignation) that we cannot turn off even if we believe (6). On this view, we keep blame not because it is *justified*, but because it is *inevitable* for beings like us.
  *   **D.'s Objection:** D. will say this is "fake" blame. If I don't believe you *deserve* my anger, my anger is manipulative or irrational.
  *   **The Counter:** Proponents say D. is demanding a metaphysical justification for a social practice that doesn't need one. We don't stop eating because we can't prove food is "metaphysically deserved."

  #### 3. Does rejecting (4) require a substantive account of control?
  **Status: Yes.**
  *   **The Problem:** You cannot simply assert "I control my typing." D. has already blocked that by asking for the source of the capacity.
  *   **The Requirement:** To reject (4), you must provide a **Positive Theory of Agency**. You must show that there is a difference between a rock falling (causation) and a person typing (agency), even if both are determined.
  *   **Examples:**
      *   *Frankfurt Cases:* Showing responsibility exists even without the ability to do otherwise.
      *   *Reasons-Responsiveness (Fischer & Ravizza):* Control is the mechanism's ability to recognize and react to reasons.
  *   **The Cost:** If you reject (4) without this account, D. wins. You are merely relocating the problem. You must explain *why* the causal chain stops being a constraint when it passes through a human brain.

  #### 4. Do (7) and (8) actually follow from (6)?
  **Status: Highly Contested (Even among Skeptics).**
  *   **The Consensus among Skeptics:** Most who accept (6) **reject (8).**
  *   **The Reason:** Even if a murderer is not *ultimately* responsible, their action issues from a *will* that is responsive to reasons. A hurricane is not. Therefore, we can quarantine the murderer (to protect others) and try to reform their will (through punishment as education). We cannot quarantine the hurricane or reason with it.
  *   **The Implication:** D. is moving too fast. Accepting Hard Incompatibilism does not require treating people like objects. It requires treating them like *dangerous agents* rather than *sinful souls*. The distinction between *harm caused by agency* and *harm caused by nature* remains pragmatically vital, even if it vanishes metaphysically.

  ### Summary: The Price List

  If your group wants to resist D., you must choose which price to pay.

  | Strategy | Step to Reject | What You Save | What You Lose | Philosophical Cost |
  | :--- | :--- | :--- | :--- | :--- |
  | **Compatibilism** | **(4)** | Ordinary blame, legal responsibility, sense of agency. | "Ultimate" responsibility. The idea that you are the absolute source of your self. | Must defend a complex theory of "control" that D. will call semantic sleight-of-hand. |
  | **Strawsonian Naturalism** | **(1)** | The phenomenology of anger and blame. | The ability to say blame is *justified* objectively. | Must admit blame is a biological/social necessity, not a moral truth. |
  | **Libertarianism** | **(3)** | Ultimate responsibility. | Scientific plausibility. | Must posit a non-physical or indeterministic cause for choice (often viewed as mysterious). |
  | **Soft Skepticism** | **(8)** | Moral distinction between cruelty and height. | Retributive justice. | Must rebuild justice on forward-looking grounds (quarantine/reform) rather than desert. |

  **Recommendation:**
  The most defensible position for your group is to **grant (1) through (6) provisionally, but attack (7) and (8).**
  Admit to D. that he might be right about *ultimate* control (metaphysics). But insist that **agency is real enough to matter** (pragmatics).
  *   **Argument:** "Even if my character is determined, it is a *character* that processes reasons. Height does not. Cruelty is a failure of rationality; height is not. Therefore, blame is a tool to engage that rationality. Treating them the same (Step 8) ignores the causal structure of the world, even if it respects the metaphysical structure."

  This concedes D.'s metaphysical victory but denies him his practical conclusion. It is the position held by many who find the "Basic Argument" compelling but refuse to live as if humans were weather.
