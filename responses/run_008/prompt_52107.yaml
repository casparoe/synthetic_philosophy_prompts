      *   *Do (7) and (8) follow?* This is the biggest internal dispute among skeptics. Pereboom accepts a quarantine model (like disease). Others argue moral anger has a functional role even without desert. (8) is the most contentious even among skeptics.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge D. has reconstructed the "Basic Argument" (Galen Strawson) + Consequence Argument (van Inwagen). It's a serious argument, not a sophistry.
