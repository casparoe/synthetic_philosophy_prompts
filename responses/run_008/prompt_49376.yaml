answer: |-
  Dear Colleague,

  It is a pleasure to hear from you, and I share your frustration regarding the stalemate in your seminar. The situation you describe is not merely a pedagogical hurdle but a precise microcosm of the state of contemporary philosophy of mathematics. Your hypothesis that this is a verbal dispute concerning the univocality of exists is astute and captures a significant portion of the friction, yet I suspect it does not go deep enough to explain why your students feel they are disagreeing about arithmetic itself rather than merely about dictionary definitions. If the dispute were purely verbal, clarifying the definitions should dissolve the tension, but as you have noted, the students remain entrenched even when they can recite the definitions perfectly. I propose that the impasse is not verbal but methodological, stemming from a clash of theoretical virtues where each side prioritizes a different constraint on philosophical explanation. The platonists are prioritizing semantic uniformity and the literal truth of mathematical discourse, while the nominalists are prioritizing metaphysical naturalism and epistemological accessibility. When the platonist accuses the nominalist of changing the subject, they are defending the semantic constraint that our best scientific theories should be taken at face value. When the nominalist accuses the platonist of dressing up coherence as ontology, they are defending the metaphysical constraint that existence requires causal integration or at least non-spookiness. Thus, the disagreement is substantive, but it is substantive in the way that a dispute between two engineers optimizing for different variables is substantive, rather than in the way that a dispute about empirical fact is substantive.

  To assess your hypothesis more closely, we must look at what is happening when the students speak. When the platonist insists that numbers exist, they are often invoking a Quinean criterion where to be is to be the value of a bound variable, treating existence as a logical commitment incurred by our best theories. When the nominalist denies this existence, they are invoking a robust, causal notion of existence where to be is to be capable of interacting with the physical world. In this sense, you are correct that there is a verbal ambiguity, but calling it merely verbal dismisses the fact that each side believes their definition is the philosophically privileged one. The reason your students feel they are disagreeing about arithmetic is that the ontological status of numbers feels intrinsic to the practice of arithmetic for the platonist. For them, if numbers do not exist in the robust sense, then the statement two plus two equals four lacks a truthmaker, and mathematics becomes a game of symbols rather than a discovery of facts. The nominalist, conversely, feels that if numbers exist in the robust sense, then mathematics becomes a mystery incompatible with science. Therefore, the disagreement is about which philosophical cost is acceptable. The platonist is willing to pay the epistemic price of explaining how we know about causally isolated objects to save the semantic price of literalism. The nominalist is willing to pay the semantic price of paraphrase or fictionalism to save the epistemic price of naturalism. This is why the dispute stalls. Each side views the other's solution as a dissolution of the problem rather than a solution, because each side views the other's primary constraint as secondary.

  Given this diagnosis, what counts as progress in your seminar? I do not believe progress should be measured by convincing one side to surrender to the other, as history suggests this is unlikely to happen. Instead, progress should be measured by a reformulation of the question from which stance is true to what each stance costs. You might guide the students to see that the question is not whether numbers exist in a vacuum, but whether we are willing to accept abstract objects as the price for semantic literalism. A useful distinction here is between asserting a theorem within a mathematical framework and asserting the ontological reality of the framework's subject matter. If the students can recognize that the platonist is committed to the latter while the nominalist is often only committed to the former, the heat may leave the discussion. However, simply making this distinction may not be enough, as the platonist will argue that the distinction itself begs the question against them. A more robust form of progress would be to adopt a meta-ontological perspective similar to what Carnap suggested but updated with contemporary insights about theoretical virtue. You could ask the students to map the trade-offs explicitly. For instance, if we accept the platonist view, what specific epistemological mechanism do we propose, and is it less costly than the nominalist's semantic revisionism? If we accept the nominalist view, how much of mathematical practice must be reconstructed, and does that reconstruction preserve the objectivity the platonist values?

  I would recommend against pinning your hopes on a specific program like Field's nominalism, as such programs often become new battlegrounds regarding whether the nominalization is successful or whether it preserves enough of the original theory. Instead, I suggest arguing that no final verdict should be expected because the dispute rests on foundational intuitions that are not themselves subject to empirical arbitration. Progress lies in recognizing the dispute as a choice between competing frameworks of explanation rather than a discovery of a hidden fact about the universe. If your students can leave the seminar understanding that the platonist is not blind to epistemology and the nominalist is not blind to semantics, but that they weigh these concerns differently, then you have succeeded. They will realize that the impasse is not a failure of argumentation but a feature of the philosophical landscape where multiple coherent systems compete without a neutral arbiter. This shifts the goal from winning the debate to understanding the architecture of the disagreement. In this light, your hypothesis about the word exists is a valuable starting point, but it should be treated as the symptom of the disease rather than the disease itself. The disease is the lack of a shared hierarchy of philosophical values. By making that hierarchy explicit, you allow the students to see that they are not talking past one another so much as they are building different houses on the same plot of land.

  I hope this perspective offers some utility for your upcoming sessions. It is often the case in our field that the most productive outcome is not a resolution but a clearer map of the terrain where resolution is impossible. Please let me know how the students respond to shifting the focus from truth to theoretical cost. I would be keen to hear if this lowers the temperature in the room while maintaining the intellectual rigor they clearly possess.

  Best wishes,

  A Friend and Colleague
