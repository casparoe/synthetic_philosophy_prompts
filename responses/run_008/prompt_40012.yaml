answer: |-
  Here is the breakdown of your roommate's philosophical "source code," the prediction for the backup case, and a new test case to run on her.

  ### 1. The Prediction
  **Verdict:** She will almost certainly say **Present-You does not survive.**

  She might add a nuance like, "Well, *Past-You* survives," but regarding *you* (the person standing in the scanner today with the marriage and the new career), she will say that what matters ends when you are destroyed. The person on Mars is a different person who happens to have your old memories.

  ### 2. The Rules She Is Running
  Based on her track record, she isn't just guessing; she's consistently applying a specific framework (heavily influenced by Parfit, whether she admits it or not). Here are the three rules her past verdicts establish:

  *   **Rule A: The "Psychology is King" Rule (From Dementia & Teletransporter)**
      Biological continuity doesn't matter (Teletransporter), and biological life without psychology doesn't count (Dementia). Survival requires the preservation of memories, character, and intentions.
  *   **Rule B: The "No Magic" Rule (From Quantum Duplicate)**
      Psychological similarity isn't enough. You can't just pop into existence somewhere else by chance. There must be a **reliable causal process** linking the old person to the new one.
  *   **Rule C: The "Overlapping Chain" Rule (From Gradual Replacement)**
      Survival doesn't require being *exactly* the same, but it requires a continuous chain of connection. In the neuron replacement case, every step is connected to the one before it.

  **Where the rules fight in the Backup Case:**
  The Backup Case creates a conflict between **Rule B (Causal Process)** and **Rule A/C (Psychology/Chain)**.
  *   *Argument for Survival:* The machine was triggered by *you* today. There is a causal process initiated by your current body. (Rule B satisfied loosely).
  *   *Argument Against Survival:* The psychological chain is broken. There is no overlap between *Current-You* and *Old-Scan-You*. The causal link connects Mars-You to *Past-You*, not *Present-You*. (Rule A and C violated).

  Given her firmness on the **Dementia** case (biology without psychology = death) and the **Quantum** case (psychology without cause = death), she prioritizes the *content* of the mind and the *directness* of the link. A 10-year gap in memories and personality is effectively a "psychological death," even if the machine was turned on by your hand.

  ### 3. The New Test Case: "The Corrupted File"
  To figure out exactly which rule trumps the other, you need to separate the **Causal Origin** from the **Psychological Content**. The Backup Case muddies these together (the data is old *and* the link is indirect).

  Here is the case to propose at dinner. Do not introduce it as a "counter-example." Introduce it as a glitch scenario.

  **The Setup:**
  "Okay, imagine the teletransporter works perfectly, but the *storage* is buggy. I step in today. The machine scans my *current* brain perfectly—so it has all my memories of my wife, my job, everything from the last 10 years. But right before it transmits the data, a software error corrupts the file. It deletes the last 10 years of data to save space. The replica on Mars is built from that corrupted file. So the replica wakes up thinking it's 10 years ago, just like in the Backup case. But here, the scan was definitely of *me, right now*, not an old backup."

  **The Question:**
  "Do I survive in this case? Is it different from the Backup case?"

  **Why this separates the rules:**
  *   **If she says "No Survival" (Same as Backup):** She is a **Psychological Purist**. It doesn't matter that the scan was of current-you; if the resulting mind isn't psychologically continuous with current-you, you're dead. (This aligns with her Dementia verdict).
  *   **If she says "Yes Survival" (Different from Backup):** She is a **Causal Originist**. As long as the process starts with your current body, you survive, even if the data gets messed up later. (This would contradict her Dementia verdict, so she probably won't go this way, but it's possible).
  *   **If she says "It's less clear than the Backup case":** She cares about the **Integrity of the Causal Chain**. In the Backup case, the machine *chose* the old file (a decision error). In this case, the machine *took* the new file and broke it (a transmission error). She might view one as a break in the chain and the other as damage to the cargo.

  ### 4. How to Pitch It (Without Sounding Like a Textbook)
  She hates "reciting Parfit," so don't use words like "continuity," "causal chain," or "reductionism." Use dinner-table language.

  **Say this:**
  "It feels like the Backup case is a hard 'no' for you because the machine is basically digging up a ghost. But what if the machine scans the *real* me, right now, and then *loses* the new memories on the way? So the cause is definitely me, but the result is definitely the old me. Is that a death, or is that just a really bad commute?"

  **Watch for:**
  If she hesitates, push on the **fear** aspect (Parfit's favorite metric for "what matters").
  "If you were the one in the scanner, would you be less scared of the destruction if you knew the scan was fresh, even if the guy on Mars won't remember your wedding?"

  ### Summary of Her Likely Profile
  *   **Philosophical Camp:** Parfitian Reductionist (Relation R).
  *   **Core Belief:** "I" am not a soul or a body; "I" am a specific pattern of psychology held together by cause and effect.
  *   **Weak Point:** She hasn't fully tested where the "cause" ends and the "effect" begins. The **Corrupted File** case targets that seam.

  If she sticks to "No Survival" on both the Backup and the Corrupted File, she's consistent: **Psychological Connectedness is the only thing that matters, and causation is just the delivery method.** If the delivery brings the wrong package, survival fails.
