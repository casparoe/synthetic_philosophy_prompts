answer: |-
  # The Afternoon Vetting Protocol (AVP) for Paleoclimate Reconstructions

  **Purpose:** To prevent overclaiming in policy-facing reports when multiple methodological pathways reproduce proxy data equally well.
  **Time Budget:** 3–4 hours per paper.
  **Authority:** This protocol does not accept/reject papers for publication; it assigns a **Claim Confidence Level (CCL)** for the policy report.

  ---

  ## Part 1: The Procedure

  Run these five questions in order. Do not proceed to the next question if the previous one triggers an escalation or downgrade. Document the answers in a standard log.

  ### Q1: The Verification Test (Fit vs. Prediction)
  **Question:** Does the reconstruction demonstrate skill in a *verification* period (data withheld from calibration) or via cross-validation, or does it only report *calibration* fit (e.g., $R^2$ over the instrumental period)?
  *   **Sufficient Answer:** Reported Reduction of Error (RE) or Coefficient of Efficiency (CE) statistics are positive and significant in a withheld period, *or* rigorous leave-one-out cross-validation is shown.
  *   **Downgrade Trigger:** If the paper relies solely on calibration fit ($R^2$) without verification statistics.
      *   *Action:* Downgrade claim from "reconstructs" to "interpolates."
  *   **Escalation Trigger:** If verification statistics are positive but identical for rival methods (proceed to Q2).

  ### Q2: The Equifinality Scan (Sensitivity)
  **Question:** Have the authors tested at least one structurally distinct alternative method (e.g., different regression family, different smoothing kernel, different proxy selection) that yields a divergent climate history while maintaining comparable verification skill?
  *   **Sufficient Answer:** Yes, alternatives were tested and shown to produce statistically indistinguishable results within the uncertainty bounds.
      *   *Action:* Claim "the data show" is provisionally allowed (pending Q3).
  *   **Downgrade Trigger:** Yes, alternatives were tested and produce divergent histories (e.g., Medieval Warm Period amplitude differs by $>1\sigma$).
      *   *Action:* Downgrade claim from "the data show [Specific History]" to "the data are consistent with [Range of Histories]."
  *   **Escalation Trigger:** Alternatives exist and diverge, but authors dismiss them without empirical justification (proceed to Q3).

  ### Q3: The Source of Constraint (Priors vs. Proxies)
  **Question:** In the divergent alternatives, is the divergence driven by the *proxy signal* or by the *methodological priors* (calibration assumptions, noise models, smoothing constraints)?
  *   **Sufficient Answer:** Divergence is driven by proxy signal (e.g., spatial coverage gaps).
      *   *Action:* Uncertainty is epistemic (data limitation). Keep Downgrade from Q2.
  *   **Downgrade Trigger:** Divergence is driven by methodological priors (e.g., assuming linearity vs. threshold response in tree rings).
      *   *Action:* Add explicit caveat: "Result depends on assumption of [X] response."
  *   **Escalation Trigger:** The divergence rests entirely on a choice of calibration assumption where no empirical basis exists to prefer one over the other (proceed to Q4).

  ### Q4: The Separability Test (Obtainable Measurements)
  **Question:** Is there a physically obtainable measurement (new proxy, different archive, instrumental extension) that could theoretically distinguish between the primary account and the rival account?
  *   **Sufficient Answer:** Yes (e.g., "Borehole temperatures could resolve this," or "Isotope ratios in speleothems would test this").
      *   *Action:* Label claim as "Provisional." Cite the required measurement in the report's research priorities.
  *   **Escalation Trigger:** No. The rivals are empirically equivalent regarding all possible measurements derivable from the current system state (e.g., they differ only in unobservable internal variability parameters).
      *   *Action:* **HAND OFF TO GROUP LEAD.** The choice is no longer empirical; it rests on non-empirical virtues (simplicity, physical plausibility, policy risk tolerance).

  ### Q5: The Language Audit
  **Question:** Does the text use causal or definitive language ("demonstrates," "reveals," "proves") where the previous steps identified equifinality or prior-dependence?
  *   **Sufficient Answer:** Language matches the CCL (e.g., "suggests," "is consistent with," "under the assumption of").
  *   **Downgrade Trigger:** Definitive language used despite Q2/Q3 triggers.
      *   *Action:* Mandate rewrite of abstract and policy summary.

  ---

  ## Part 2: Application to Drafts

  ### Case 1: The Calibration Divergence Draft
  **Scenario:** A tree-ring network is used. Method A (Linear Regression) and Method B (Non-linear Threshold) both fit the instrumental calibration period ($R^2 = 0.6$). Method A shows a moderate Medieval Warm Period (MWP); Method B shows a negligible MWP. The Draft states: *"Our reconstruction shows the MWP was moderate."*

  **AVP Run:**
  1.  **Q1 (Verification):** Both methods have positive CE scores in the early instrumental holdout. **Pass.**
  2.  **Q2 (Equifinality):** The authors acknowledge Method B exists but do not run it. You run a quick sensitivity check (or cite existing literature). Method B fits equally well but yields negligible MWP. **Downgrade Trigger.**
      *   *Current Status:* Claim must change to "consistent with a range of MWP amplitudes."
  3.  **Q3 (Source of Constraint):** The divergence arises because Method A assumes tree growth scales linearly with temperature, while Method B assumes a moisture-threshold effect. The proxy network cannot distinguish these during the calibration period because the instrumental record lacks extreme warm/dry analogs. **Downgrade Trigger.**
      *   *Current Status:* Claim must add "dependent on linearity assumption."
  4.  **Q4 (Separability):** Can we separate them? Yes. Independent temperature proxies (e.g., historical documents, boreholes) not used in the network could validate one. **Pass (Provisional).**
  5.  **Q5 (Language):** Draft says "shows." **Downgrade Trigger.**

  **Verdict:** **Required Downgrade.**
  The text must be changed to: *"Under linear calibration assumptions, the data suggest a moderate MWP; however, non-linear responses consistent with the same network cannot be ruled out."*
  **Reasoning:** The evidential work is being done by the *calibration assumption* (linearity), not the data alone. The data underdetermine the mechanism.

  ### Case 2: The Tuned Rival Draft (Your Favorite Account)
  **Scenario:** The Draft uses a standard Physical Model (Model S). You have a rival Rival Model (Model R). Model R fits the proxy network equally well ($R^2$ and CE match), *but* only because a specific feedback parameter ($\lambda$) was tuned to minimize residuals against this specific proxy dataset. The Draft ignores Model R. The Draft states: *"The data rule out alternative mechanisms."*

  **AVP Run:**
  1.  **Q1 (Verification):** Model S has robust cross-validation. Model R fits the calibration data perfectly but you know $\lambda$ was tuned to this specific noise structure. If you withhold a different verification period, Model R's skill likely collapses.
      *   *Action:* You must verify if Model R was cross-validated. If Model R was tuned *on the full dataset*, it fails Q1.
      *   *Assumption for this exercise:* The Draft claims Model R is invalid. You know Model R fits *if tuned*.
  2.  **Q2 (Equifinality):** Does Model R count as an "equally fitting" rival?
      *   *Analysis:* In a calibration sense, yes. In a predictive sense, no. Tuning to the target dataset is overfitting.
      *   *Decision:* The procedure must distinguish *fitting* from *explaining*. If Model R requires tuning to *this* dataset to fit, it lacks out-of-sample validity.
      *   *Result:* Model R is **not** a valid empirically equivalent rival. It is a curve-fit.
  3.  **Q3 (Source of Constraint):** The fit of Model R is driven by the tuned parameter, not the climate signal.
      *   *Action:* The Draft is justified in preferring Model S *if* Model S did not also tune.
  4.  **Q4 (Separability):** If Model R were tuned on *independent* data and then applied here, it would be separable. Since it was tuned here, it is indistinguishable from noise.
  5.  **Q5 (Language):** Draft says "data rule out alternative mechanisms."
      *   *Critique:* This is too strong. The data do not rule out the *mechanism*; they rule out the mechanism *without tuning*.
      *   *Downgrade Trigger:* The Draft implies the mechanism is impossible, rather than the *untuned version* being unsupported.

  **Verdict:** **Partial Downgrade / Correction.**
  You cannot endorse your own rival (Model R) as equal evidence because its fit is artificial (tuning). However, the Draft overclaims by saying the data "rule out" the mechanism.
  **Required Change:** "The data do not support [Mechanism R] without parameter adjustment."
  **Personal Note:** As the author of Model R, you must recuse yourself from advocating for it in this vetting process if the tuning was done *post-hoc* on this dataset. The protocol protects you from bias: a tuned model is not an empirical rival, it is a mathematical artifact.

  ---

  ## Part 3: Limitations of the Procedure

  You asked specifically what this procedure cannot do. It is vital you include this in your cover memo to the Group Lead.

  **1. It Cannot Certify Equivalence in Principle**
  The AVP can only establish equivalence *relative to current measurement capabilities* (Q4). It cannot prove that two accounts are theoretically identical.
  *   *Why:* New measurement techniques (e.g., clumped isotopes, novel genomic proxies) may open new "observation windows" that separate rivals previously thought indistinguishable.
  *   *Implication:* Never certify a claim as "uniquely determined." Only certify it as "uniquely determined given current proxy types."

  **2. It Cannot Resolve Non-Empirical Virtues**
  When Q4 triggers an escalation (no obtainable measurement can separate the rivals), the AVP stops. It cannot choose between rivals based on:
  *   *Simplicity:* (Is a simpler climate mechanism preferable?)
  *   *Coherence:* (Does one fit better with general circulation models?)
  *   *Policy Utility:* (Is one narrative more actionable, even if less certain?)
  *   *Implication:* These are value judgments. The AVP flags them for the Group Lead. Do not attempt to solve them yourself; your role is to ensure the *empirical* limits are clearly marked so the Lead knows where the science ends and the judgment begins.

  **3. It Cannot Detect "Hidden Tuning" in the Primary Model**
  The AVP relies on disclosure. If the primary authors tuned their parameters but did not report it (unlike your Model R in Case 2), Q1 may pass falsely.
  *   *Mitigation:* Check degrees of freedom. If the number of fitted parameters approaches the number of independent proxy series, flag for Group Lead review regardless of fit statistics.

  **4. It Cannot Quantify the "Truth"**
  The AVP manages *claim confidence*, not *truth*. A downgraded claim ("consistent with") may still be factually correct, but the *evidence provided in the paper* does not support the strength of the assertion. You are vetting the *argument*, not the *climate*.

  ---

  **Summary for the Group Lead:**
  *   **Case 1:** Downgrade required. The claim relies on calibration assumptions, not data.
  *   **Case 2:** Draft is mostly correct to reject the rival, but language must be softened to acknowledge the rival fails on validation, not mechanism.
  *   **Systemic Issue:** We are frequently publishing "calibration fits" as "climate histories." The AVP will slow production but prevents policy embarrassment when methods are updated.
