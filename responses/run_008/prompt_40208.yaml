          *   *Draft 2:* Draft claims "Data show X." Rival (User's) fits equally well but uses tuned parameter.
          *   *Goal:* Show how the protocol handles both.

  5.  **Refining the "Equivalence in Principle" Limitation:**

      *   This is a deep philosophical point (Quine-Duhem thesis).
      *   Scientific procedure can never prove two models are *identical* in all possible worlds, only that they are indistinguishable *given current possible measurements*.
      *   Must explicitly state this limitation.

  6.  **Writing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the role and the stakes.
