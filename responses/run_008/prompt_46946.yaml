      *   *Item:* Pluto $\rightarrow$ Nose+Eiffel Tower sum (or composite objects generally).
      *   *Category:* Planet $\rightarrow$ Existing Object / Composite Object.
      *   *Criteria:* IAU Definition (orbit, shape, clearing neighborhood) $\rightarrow$ Conditions for composition (contact, fastening, life, etc.).
      *   *Decision Mechanism:* IAU Vote $\rightarrow$ Philosophical stipulation / linguistic choice.
      *   *Underlying Reality:* Celestial bodies $\rightarrow$ The world / fundamental structure.
      *   *Dispute Nature:* Verbal/Classificatory $\rightarrow$ Verbal/Conceptual (according to deflationist).

  4.  **Identifying Disanalogies (Where the mapping breaks):**
      *   *Origin of Term:* "Planet" is a human construct for sorting. "Exists" ($\exists$) is logical/fundamental.
      *   *Function:* "Planet" helps astronomers organize data. "Exists" is used to state facts about *everything*.
      *   *Stakes:* Pluto had cultural/educational stakes. Ontology seems to have none (purely theoretical).
      *   *Vagueness vs. Precision:* "Planet" was vague, then made precise. "Exists" is argued to be precise but contested.
      *   *Authority:* IAU has authority to vote. Philosophers do not.
      *   *Observation:* We can see Pluto. We can't "see" composition in the same way (it's metaphysical).

  5.  **Evaluating Relevance (Do these disanalogies matter?):**
      *   *Explicit Convention vs. Logical Vocabulary:* **Matters.** If "exists" is logical, changing its meaning changes the logic of all discourse, not just a sub-field. This challenges the "easy" switch.
      *   *Practical Stakes:* **Doesn't Matter (mostly).** Deflationists argue the *metaphysical* stakes are null, regardless of practical utility. However, the lack of practical stakes makes the "usefulness" criterion harder to apply.
      *   *Noun vs. Quantifier:* **Matters.** "Planet" is a sortal. "Exists" is a quantifier. Sortals carve nature at joints *within* existence. Quantifiers determine *what is*. This is the core substantivist objection (Sider's "Writing the Book of the World").
      *   *Authority:* **Doesn't Matter.** Deflationists don't need an IAU; they just need to show the dispute is verbal.

  6.  **Addressing Specific Prompt Questions:**
      *   *Explicit convention vs. all-purpose:* Yes, this is the "Quantifier Variance" critique. If $\exists$ varies, does logic vary?
      *   *Practical stakes:* Weakens the analogy for *utility*. If there are no stakes, why choose one over the other? But strengthens the idea that it's "just words."
      *   *Noun vs. Quantifier:* Crucial. Sortals classify existing things. Quantifiers posit things.

  7.  **Evaluating the Deflationist Conclusion:**
      *   *Full Survival:* Unlikely. The logical status of $\exists$ is too different from "planet."
