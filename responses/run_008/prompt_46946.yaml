              *   Explicit convention vs. all-purpose logical vocabulary.
              *   Practical stakes (textbooks/pride) vs. engineered lack of stakes.
              *   Noun with boundary-drawing use vs. quantifier.
          5.  Evaluate the survival of the deflationist conclusion (full, restricted, or failed).
          6.  Propose a better analogy if possible.

  2.  **Analyze the Analogy (The "Pluto Model"):**
      *   *Source Domain:* The IAU decision on Pluto (2006).
      *   *Target Domain:* The debate over unrestricted mereological composition (Universalism vs. Nihilism vs. Restrictivism).
      *   *Deflationist Claim:* Ontological disputes are verbal/conceptual, not factual. Like "planet," "exists" is a tool we define.
      *   *Substantivist Claim:* Ontology is about mind-independent structure. "Exists" isn't just a label; it tracks reality.

  3.  **Drafting the Correspondence Table:**
