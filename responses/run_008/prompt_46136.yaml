answer: |-
  # JOINT STATEMENT ON THE INFERENCE OF HUMAN PREFERENCES FROM BEHAVIOR

  **Date:** October 26, 2023
  **Parties:** The Revealed-Preference Optimists (hereinafter "Optimists") and The Preference Constructionists (hereinafter "Constructionists").
  **Subject:** Adversarial Collaboration on the Ontology and Methodology of Preference Inference.

  ## PREAMBLE

  This document records the points of agreement, disagreement, and empirical cruxes identified by the signatories regarding the project of inferring human preferences from behavioral data (e.g., Inverse Reinforcement Learning, preference learning, and behavioral economics). The purpose of this statement is not to resolve the underlying philosophical disputes, but to delineate them with sufficient precision to allow for productive empirical collaboration and to prevent interlocutors from talking past one another.

  ---

  ## PART I: SHARED CLAIMS

  Both camps affirm the following propositions as the basis for continued dialogue:

  1.  **Informative Value of Behavior:** Human behavior is not random; it is systematically correlated with internal states, dispositions, and environmental constraints. Ignoring behavioral data renders any account of human values empirically empty.
  2.  **Theory-Laden Inference:** No inference procedure is assumption-free. Every algorithm that maps behavior to preferences embeds auxiliary assumptions regarding rationality, noise, time-consistency, and the structure of the state space. There is no "view from nowhere" in preference learning.
  3.  **The Pathology Constraint:** There exist identifiable regimes where behavior is a poor proxy for welfare or endorsement. Both camps agree that in cases of severe compulsion, addiction, coercion, or transient physiological distress, taking behavior at face value yields results that contradict the agent's own reports and long-term interests.
  4.  **Empirical Tractability:** At least a subset of the disputes between the camps is empirically adjudicable. Disagreements regarding predictive accuracy, stability of inferred parameters across contexts, and the robustness of models to distributional shift can be tested via controlled experiment.
  5.  **Normative Stakes:** The output of preference inference systems will be used to guide automated decision-making (e.g., recommender systems, autonomous agents, policy design). Both camps agree that errors in inference carry ethical risks, including the reinforcement of bias, the erosion of autonomy, or the optimization for proxy metrics that harm the user.

  ---

  ## PART II: EXACT DISAGREEMENTS

  The following sections describe the core theoretical divergences. Each disagreement is stated twice: once in the terminology of the Optimists, and once in the terminology of the Constructionists. Both sides certify that the opposing statement is a charitable and accurate representation of the counter-position.

  ### Disagreement 1: The Ontological Status of "The Preference"

  *   **Optimist Formulation:** Preferences are latent variables that causally influence behavior. While observation is noisy, there exists a fact of the matter regarding an agent's reward function or utility ordering. The inference problem is one of statistical estimation: separating the signal (preference) from the noise (bias, error, constraint).
  *   **Constructionist Formulation:** Preferences are not pre-existing latent variables but are outcomes of a deliberative process situated in a specific context. There is no "fact of the matter" independent of the elicitation method. The inference problem is one of normative selection: deciding which construction of preference (e.g., choice-based, pricing-based, reflective) should govern the system's behavior.

  ### Disagreement 2: The Interpretation of Inconsistency

  *   **Optimist Formulation:** When an agent exhibits preference reversals or time-inconsistent behavior, this indicates a violation of the model's rationality assumptions or the presence of unmodeled performance errors. The goal is to refine the model (e.g., by adding hyperbolic discounting parameters or bias terms) to recover the underlying consistent preference structure that best explains the aggregate data.
  *   **Constructionist Formulation:** When an agent exhibits preference reversals, this reveals that the preference itself is context-dependent and fragmented. Attempting to model this as a single consistent structure plus noise imposes an artificial unity on the agent. The goal is to characterize the conditions under which different preference constructions arise, rather than to collapse them into a single "true" vector.

  ### Disagreement 3: The Role of the Modeler

  *   **Optimist Formulation:** The modeler acts as a discoverer. Their ethical obligation is to minimize estimation error and avoid imposing their own values onto the inference process. Success is measured by the model's ability to predict behavior and align with the agent's reflective endorsements.
  *   **Constructionist Formulation:** The modeler acts as a legislator. Because the data underdetermines the preference, the modeler's choice of architecture and loss function inevitably privileges certain aspects of the person over others. Success is measured by the transparency of these normative choices and the legitimacy of the process by which specific constructions are selected.

  ---

  ## PART III: CRUXES AND EMPIRICAL PREDICTIONS

  We identify two specific cruxes where the theoretical disagreements lead to divergent empirical expectations. For each crux, we specify a concrete case, the prediction of each camp, and the rationale.

  ### Crux 1: The Independence of Preference from Elicitation

  **The Concrete Case:** *Preference Reversal.* An individual is presented with two gambles, $A$ (high probability, low payoff) and $B$ (low probability, high payoff). In a direct choice task, the individual chooses $A$. In a pricing task (stating the minimum selling price), the individual assigns a higher value to $B$. This incompatibility is replicated across multiple trials.

  *   **Optimist Prediction:** One of the two tasks (choice or pricing) provides a less noisy, less biased signal of the underlying utility function. A sufficiently rich model, incorporating task-specific noise parameters (e.g., compatibility theory), will identify which task better approximates the latent preference and will converge on a single ordering ($A \succ B$ or $B \succ A$) that predicts future behavior in high-stakes contexts.
      *   *Rationale:* Inconsistency is measurement error. With enough data and the right likelihood function, the posterior over the latent preference will concentrate on the true ordering.
  *   **Constructionist Prediction:** No amount of modeling will converge on a single ordering because there is no single ordering to find. The "preference" is $A$ in the choice context and $B$ in the pricing context. A model that forces convergence will successfully fit the training data but will fail to generalize to new elicitation contexts, systematically mispredicting behavior when the task structure changes.
      *   *Rationale:* The elicitation method is part of the preference-generating mechanism, not merely a measurement tool. Generalization requires modeling the context, not correcting for it.

  ### Crux 2: Behavior vs. Reflective Endorsement

  **The Concrete Case:** *Time Inconsistency and Repudiation.* An individual consistently engages in a behavior (e.g., procrastination, substance use) during the week. On Sunday evening, they reflectively state a strong preference to avoid this behavior in the coming week. When the moment of action arrives on Monday, they revert to the behavior.

  *   **Optimist Prediction:** The reflective endorsement (Sunday) is a cleaner signal of the long-term reward function, while the behavior (Monday) is the result of a temporary shift in the discount factor or a local optimization error. An inference algorithm that weights reflective reports higher than immediate choices will produce a policy that better serves the agent's long-term welfare.
      *   *Rationale:* The "true" self is identified with the agent's considered, long-term goals. Immediate behavior is corrupted by visceral factors that the agent themselves disavows.
  *   **Constructionist Prediction:** Privileging the Sunday reflection over the Monday action is a normative choice, not an empirical discovery. The Monday self is not "corrupted"; it is operating in a different context with different salient features. An algorithm that ignores the Monday behavior in favor of the Sunday report will be experienced by the user as paternalistic or alienating, potentially leading to disengagement or reactance.
      *   *Rationale:* There is no metaphysical basis to declare the reflective self the "true" owner of the preference. Treating the Monday action as mere noise ignores the possibility that the agent's values are genuinely pluralistic or that the Sunday self is engaging in wishful thinking.

  ---

  ## CLOSING ANALYSIS

  ### Substantive vs. Verbal Disagreement

  We assess that the residual disagreements are **substantive**, not merely verbal.

  While it is tempting to dismiss the dispute as a semantic argument over the definition of "preference," the divergence dictates distinct algorithmic architectures and evaluation metrics.
  *   If the **Optimists** are correct, research should focus on *identification*: finding better priors, richer behavioral traces, and causal models that separate bias from signal. The metric of success is convergence and predictive accuracy on held-out behavioral data.
  *   If the **Constructionists** are correct, research should focus on *interaction*: designing systems that query users to resolve ambiguity, expose trade-offs, or allow users to select which "version" of their preference should guide the system. The metric of success is user autonomy, satisfaction, and the perceived legitimacy of the system's decisions.

  Because these positions recommend different engineering pathways and different criteria for system safety, the disagreement cannot be dissolved by terminology alone.

  ### Shared Blind Spot

  In the course of this collaboration, we identified a foundational assumption shared by both camps that warrants scrutiny:

  **The Assumption of Unitary Actionability.**
  Both Optimists and Constructionists proceed as though the ultimate goal of inference is to produce a *single* representation (a reward function, a policy, or a constructed preference order) that an AI system can then optimize. Both camps treat "The Preference" as the necessary interface between human and machine.

  **Joint Commitment:** Both camps are jointly committed to the idea that the AI's role is to *satisfy* a preference structure, rather than to *facilitate* the ongoing process of valuing.
  *   The Optimist seeks to satisfy the *latent* structure.
  *   The Constructionist seeks to satisfy the *contextually constructed* structure.

  **Unnoticed Consequence:** Both may be overlooking the possibility that human valuation is not meant to be "captured" or "satisfied" by an external agent at all, but is an activity that requires continuous human engagement. By agreeing that the goal is to output a target for optimization, both camps risk automating away the deliberative friction that Constructionists claim is essential to preference formation, while pursuing a stability that Optimists claim is essential to alignment. Future work should investigate whether "preference inference" is the correct framing, or whether the objective should be "deliberative support" where no single preference vector is ever finalized.

  ---

  **Signed,**

  *The Revealed-Preference Optimists*

  *The Preference Constructionists*
