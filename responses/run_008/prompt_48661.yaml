  2.  **$P(\text{Costs Make Manipulation Rare}) = 0.25$**
      *   *Justification:* While perfect GS manipulation is costly, heuristic strategic voting (e.g., polling-based desertion) is empirically common and cheap.
  3.  **$P(\text{Heuristics are Normatively Relevant}) = 0.90$**
      *   *Justification:* Outcome distortion is identical whether derived from complex calculation or simple polling heuristics; the normative injury is the same.
  4.  **$P(\text{Cardinal/Randomized Escape Routes Closed}) = 0.95$**
      *   *Justification:* Gibbard (1978) and subsequent work rigorously close deterministic cardinal loopholes; randomized rules are non-starters for sovereign elections.

  **Calculation**
  $$P(M) = P_1 \times (1 - P_2) \times P_3 \times P_4$$
  $$P(M) = 0.90 \times 0.75 \times 0.90 \times 0.95 \approx 0.58$$

  **Sensitivity Analysis**
  The number is most sensitive to **Claim (2)** (Information/Coordination Costs). Claims (1) and (4) are theoretical bounds with low variance, and Claim (3) is a stable normative premise. Claim (2) is the only empirical frequency variable; if the probability that costs suppress strategy rises from 0.25 to 0.50, $P(M)$ drops to 0.41, flipping the verdict.

  **The Seminar Disagreement**
  **Faction 2 (The "Empty in Practice" group)** is making the mistake that drives the disagreement. They conflate "computationally perfect manipulation" with "strategic behavior." Their error is empirical: they assume high information costs prevent strategy, ignoring that voters use low-cost heuristics (polls, viability cues) to manipulate outcomes effectively. Faction 1 is metaphorically imprecise (thermodynamics is descriptive, GS is logical), but their practical conclusion holds. Faction 2's empirical optimism is the fragile link.
