  I appreciate the intuition—it feels like two things because our language treats "lump" and "mug" as different sorts with different life stories. But here's the metaphysician's move: adopt four-dimensionalism. The object you're handling isn't just the clay at noon or the mug at 5 PM; it's the entire spacetime worm stretching across both moments. At noon, that worm has a lump-shaped temporal part; by 5 PM, it has a mug-shaped temporal part. Nothing popped into existence out of nowhere, and the lump didn't vanish; the single, extended object simply has different properties at different times. You're mistaking a change in the object's temporal phases for the creation of a new entity, but ontologically, it's just one worm undergoing a shape change.
