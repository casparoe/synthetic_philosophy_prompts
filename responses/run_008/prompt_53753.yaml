answer: |-
  When we imagine a "moral saint," we usually picture someone extraordinary. This is the person who donates a kidney to a stranger, gives away almost all their income to effective charities, and never tells a lie, even when it would spare someone's feelings. In the abstract, everyone agrees this person is admirable. But the question my teacher posed cuts deeper: is this actually a good way to *be*? If you met this person at a party, would you want to be their friend? If you could press a button to become them, would you?

  Intuitively, most of us hesitate. We suspect that a life dedicated 100% to maximizing moral good might be a terrible life to live. However, arguing this feels risky. It sounds like we are just making excuses to be mediocre. After weighing the arguments—specifically the tension between moral perfection and personal humanity—I believe the verdict is clear: being a 100% moral saint is not a desirable way to live, but that does not give us permission to be selfish. The ideal life is one where morality sets the boundaries of our actions, but does not fill every inch of our time. We should aim for moral dominance, not moral monopoly.

  To understand why the 100% saint is problematic, we have to look at what gets sacrificed. The argument against the saint isn't that they are bad people; it's that they are incomplete people. A human life has a limited amount of time and psychic energy. Every hour spent volunteering is an hour not spent practicing the guitar, reading fiction, or hanging out with friends. If you are truly maximizing the good, you have to treat your time as a resource that belongs to the world, not to you.

  This creates a problem for personality. Think about the traits we usually like in people: a sarcastic sense of humor, a passion for a specific sport, or being a great cook just because food tastes good. The "Rational Saint"—the one who does the moral math before every action—would have to cut these out. Why spend three hours perfecting a lasagna when you could be working overtime to donate the extra money? Why make a sarcastic joke that might risk a tiny bit of social friction when you could offer a generic compliment instead? This saint becomes a drudge, a person of pure duty with no spark.

  Then there is the "Loving Saint." This person doesn't struggle; they just genuinely love helping everyone so much that they don't miss out on hobbies. They are happy. But this is arguably weirder. If you love a stranger exactly as much as you love your own mother, or if you care about a distant famine more than your best friend's breakup, something is off. We value relationships because they are *partial*. We love our friends *more* than strangers. A saint who treats everyone equally might be morally perfect, but they would be a terrible friend. You want a best friend who has your back, not one who helps you only because it's the most efficient use of their time globally.

  However, this is where my classmate's objection hits hard. They argued that saying the saint is "boring" or "missing out" is biased. Maybe hobbies and wit only seem valuable to us because we are already morally flawed. If you truly understood the weight of suffering in the world, saving a life would feel more meaningful than stamp collecting. From this perspective, calling the saint "unfulfilled" is like a drug addict calling a sober person "boring" because they don't spend their paycheck on drugs. The addict has lost the ability to see what is actually valuable.

  There is also the "lazy-student objection." It is very tempting to use philosophy to justify being average. If I convince myself that being a saint is bad, I don't have to feel guilty about scrolling on my phone instead of volunteering. It is a convenient shield for mediocrity. We have to admit that most of us aren't rejecting sainthood because we care about the nuances of human flourishing; we're rejecting it because we want to keep our money and our free time.

  So, how do we resolve this? We can't just say "it depends." We have to draw a line. The mistake in the debate so far is assuming that "non-moral goods" (like hobbies and friendships) are enemies of morality. They aren't. They are the fuel for it. This leads to my verdict: The 100% saint is undesirable, but the 90% moral person is the ideal. The line is drawn at the point where moral obligation destroys the *agent* who is supposed to do the good.

  To justify this, we need to break down exactly what a saint can and cannot have. There are specific things a 100% saint genuinely cannot keep. First, they cannot have *obsessive* leisure. You cannot be a moral maximizer and also spend four hours a day playing video games, unless those games are directly helping people (which they usually aren't). Second, they cannot have *vanity*. Spending money on luxury clothes or status symbols is hard to justify when that money could save lives. Third, they cannot have *exclusive loyalty*. They cannot promise to put their family's interests above a stranger's needs in a life-or-death scenario.

  However, there are things a highly moral person *can* and *should* keep. This is where the 90% solution comes in. A moral person needs rest. Burnout helps no one. If you work yourself to death by age thirty, you can't help anyone for the next fifty years. So, self-care is morally permissible. Furthermore, a moral person needs deep relationships. As mentioned earlier, partiality is essential for love. You can be a good person and still prioritize your mom over a stranger, provided you aren't harming the stranger to do it. Finally, a moral person can have passions. Being a great musician or a knowledgeable historian makes you a more interesting, well-rounded human being, which actually makes you better at connecting with and helping people.

  The distinction lies in the role morality plays. For the 100% saint, morality is the *content* of every action. Every move must be a moral move. For the 90% person, morality is the *framework*. It sets the rules of the game, but it doesn't dictate every play. It says, "Don't hurt people, and help when you can," but it leaves room for "Play the guitar because it brings you joy."

  Why is 90% better than 100%? Because a life without non-moral projects loses the "self." If I give away all my money, I have no resources to develop my own talents. If I spend all my time helping others, I have no time to develop my own character. Paradoxically, to be a good moral agent, you need to be a distinct individual. A world of 100% saints would be a world of identical service drones. A world of 90% moral people would be a world of doctors, artists, teachers, and friends who are generous and kind, but also unique.

  We must also address the "lazy student" fear. Admitting that 100% sainthood is bad is not an excuse to do 10%. If the ideal is 90%, then doing 10% is still a failure. Acknowledging that hobbies are valuable doesn't mean *all* hobbies are equal. Watching TV for six hours is different than practicing an instrument for two. The argument against sainthood isn't a permission slip to be selfish; it's a recognition that being human requires more than just being good.

  In conclusion, the moral saint is someone we should respect from a distance, but not emulate completely. The 100% saint is a conceptual error because they sacrifice the very humanity that makes morality meaningful. They lose the humor, the passion, and the partial love that make life worth living. However, this doesn't validate our current mediocrity. The pushback from my classmate is right that we often overvalue our trivial interests. The verdict, then, is that we should strive to make morality the dominant force in our lives, governing our major choices and limiting our selfishness, but we must reserve space for the personal projects that make us who we are. We should not try to be saints who live for morality; we should be humans who live morally. That is the only way to be good without ceasing to be a person.
