  2.  **Deconstruct the Arguments:**
      *   *The "Against" Side (Wolf's argument):* A life dedicated 100% to morality crowds out non-moral goods (humor, hobbies, aesthetic appreciation). A world of saints would be boring or oppressive. The "Rational Saint" is a drudge; the "Loving Saint" is psychologically strange (loving strangers as much as friends).
      *   *The "For" Side (The Pushback):* Our valuation of hobbies/humor is biased by our own moral failings. If you truly saw the suffering in the world, saving a life *would* be more interesting than stamp collecting. The "lazy student" objection: We just want an excuse to be selfish.
      *   *The Verdict:* I need to find a middle ground that isn't "it depends." The prompt suggests something like "100% is bad, but high morality is good." I need to define *why* 100% fails. The key distinction is usually between *obligation* and *supererogation* (going above and beyond), though I should explain that concept simply without necessarily using the jargon if it feels too academic. Let's stick to the idea of "moral dominance."

  3.  **Outline Structure:**
      *   **Introduction (approx. 150 words):** Hook with the "Moral Saint" image. State the tension (admirable vs. desirable). Thesis: Being a 100% moral saint is actually a flawed way to live because it eliminates the personal commitments that make life meaningful, but this doesn't excuse mediocrity; the sweet spot is a "dominant morality" that allows for non-moral passions.
      *   **The Case Against the Saint (approx. 350 words):** Explain the "crowding out" problem. Differentiate between the Loving Saint and the Rational Saint. Explain why specific things (sarcastic humor, niche hobbies) are incompatible with maximized morality.
      *   **The Pushback / The "Bias" Argument (approx. 300 words):** Address the classmate's point. Are hobbies only valuable because we are shallow? Address the "lazy student" excuse. Acknowledge the strength of this point (we are often too selfish).
      *   **The Breakdown: What Goes vs. What Stays (approx. 250 words):** This is a specific teacher requirement. Distinguish between *self-indulgent* non-moral goods (luxury, status) and *constitutive* non-moral goods (deep friendships, art, specific skills).
      *   **Conclusion / The Verdict (approx. 200 words):** Draw the line. Why 90% (or "dominant but not total") is the goal. Justify the line based on human psychology and the nature of value.

  4.  **Drafting - Section by Section (incorporating constraints):**

      *   *Intro:* Start with the kidney donor example. It's extreme. Everyone respects them, but would you date them? Thesis needs to be firm.
      *   *Body 1 (The Problem):* Focus on time and psychic energy. If I'm maximizing good, I can't spend 3 hours perfecting a lasagna unless feeding people is the goal. If the goal is *my* enjoyment of cooking, it's a moral loss. The Rational Saint is miserable; the Loving Saint is uncanny (loving a stranger as much as a mom).
      *   *Body 2 (The Counter):* My classmate's point is strong. From the perspective of a starving child, my stamp collection is obscene. Maybe the "boring" saint is just a mirror showing us we are shallow. The "lazy student" fear is real—we use philosophy to justify eating pizza instead of volunteering.
      *   *Body 3 (The Distinction):* I need to be specific here. What *must* go? Obsessive leisure, vanity, cruelty-based humor. What *can* stay? Deep relationships (which require partiality), aesthetic appreciation (which fuels the soul to keep helping), and rest (burnout helps no one).
      *   *Conclusion:* The Verdict. 100% is inhuman. 0% is monstrous. The line is drawn at "moral dominance." Morality sets the boundaries, but doesn't fill every inch of the canvas. Justification: A life without personal projects loses the *agent* who does the good.

