answer: |-
  This is an exceptionally sharp observation, and you have essentially stumbled onto one of the most vibrant debates in modern legal scholarship. You are asking for a "philosophical reconstruction" of patent doctrine, and the tension you've identified—between the **Mertonian sociology of science** (multiples/inevitability) and the **Lockean/Romantic legal fiction** (sole inventor/contingency)—is exactly where the friction lies.

  In fact, there is a seminal paper by Mark Lemley (Stanford Law) called *"The Myth of the Sole Inventor"* (2012) that argues exactly what you are suggesting: that patent law relies on a historical fiction that contradicts the empirical reality of how innovation happens.

  Here is a reconstruction of the implicit theory of the patent system, where it breaks down, and where it is underdetermined, structured for your section discussion.

  ### 1. The Implicit Theory: "The Binary Threshold Model"

  You asked what view of invention the system presupposes. It is not strictly the "heroic individual" model, nor is it fully the "inevitability" model. It is a pragmatic hybrid I'll call the **Binary Threshold Model**.

  *   **The Premise:** The law admits that ideas can be "in the air." This is codified in **35 U.S.C. § 103 (Non-obviousness)**. If an idea was truly inevitable (i.e., "obvious to a Person Having Ordinary Skill In The Art" or PHOSITA), the system denies the patent.
  *   **The Switch:** However, once an invention crosses the threshold of "non-obvious," the system flips a switch. It stops caring about *degree* of inevitability. It doesn't matter if 10 other people were one week away from filing; if you crossed the threshold first, you get the full reward.
  *   **The Presupposition:** The system presupposes that while *some* ideas are inevitable, the specific **reduction to practice** (the specific engineering, the specific claim language) is contingent enough to warrant a reward. It treats the *filing* as the proxy for the *invention*.

  **The Inconsistency:** As you noted, this creates a discontinuity.
  *   *Obviousness* admits inevitability.
  *   *Term Length* (fixed at 20 years from filing) denies it. If an invention was "90% inevitable" (just barely non-obvious) vs. "10% inevitable" (a massive leap), both get the same 20-year monopoly. The system does not scale the reward to the "distance" of the leap, only to the fact that a leap occurred.

  ### 2. The "Independent Inventor" Problem & Administrative Feasibility

  You asked why there is no defense for independent invention. If inventions are inevitable, punishing the second inventor seems unjust and economically wasteful (they incurred R&D costs for no return).

  *   **The Legal Theory:** The system prioritizes **certainty and transaction costs** over individual justice.
  *   **The Logic:** If an independent invention defense existed, every infringement suit would turn into a mini-trial about the defendant's state of mind and lab notebooks (which is what the US system looked like under "First-to-Invent" prior to the 2011 America Invents Act).
  *   **The Implicit Trade-off:** The system implicitly admits that the second inventor *might* deserve it, but decides that proving it is too expensive. It sacrifices the "truth" of invention for the "clarity" of property rights. This aligns with a **Prospect Theory** of patents (Ed Kitch): patents aren't just rewards for inventing; they are coordination mechanisms to prevent wasteful duplication of development *after* the initial discovery.

  ### 3. Where the System is Underdetermined (The "Incentive" Story vs. Others)

  You asked if the incentive story ("no patent, no invention") is the only game in town. It is not. The legal text is compatible with at least three different theories, and the courts switch between them depending on the outcome they want.

  1.  **Incentive Theory (Classic Law & Economics):** Patents cause invention.
      *   *Conflict:* As you noted, this collapses if "multiples" are common. If Darwin and Wallace both find natural selection, did the patent (if it existed) *cause* the discovery? Unlikely.
  2.  **Disclosure Theory:** Patents cause *secrets to become public*.
      *   *Fit:* This works even if invention is inevitable. Even if 5 people would have invented the widget, the patent ensures the first one *teaches* us how to do it rather than keeping it a trade secret (like the Coca-Cola formula). This theory fits the "inevitability" model much better.
  3.  **Commercialization Theory:** Patents cause *investment in development*.
      *   *Fit:* This suggests the invention itself might be cheap/inevitable, but turning it into a product is expensive/risky. The monopoly protects the *investment*, not the *idea*.

  **The Tension:** Courts use Incentive Theory to justify strong patents, but use Disclosure Theory to justify strict enablement requirements. The system is underdetermined because it tries to serve all these masters simultaneously.

  ### 4. What If We Adopted the "Inevitability" Picture?

  If you reconstructed the system based on the Philosophy of Science view (Mertonian multiples), here is what would logically change:

  *   **Independent Invention Defense:** You would allow it (as Copyright law does). If you can prove you didn't copy, you aren't liable.
      *   *Counter-argument:* This weakens the patent value. If I can't exclude competitors who claim they "found it themselves," the monopoly is leaky.
  *   **Probabilistic Terms:** Instead of a fixed 20 years, the term could be scaled. If the PTO determines the field was "crowded" (high probability of simultaneous invention), the term is shorter. (Administratively nightmarish, but philosophically consistent).
  *   **Prizes/Bounties instead of Monopolies:** This is the classic alternative (e.g., the Longitude Prize). The government pays the inventor a lump sum, and the technology goes immediately into the public domain.
      *   *Why we don't do it:* The government is bad at pricing inventions. The market is better at deciding what an invention is worth (via monopoly profits).
  *   **Liability Rules instead of Property Rules:** Instead of an injunction (stop making this), the second inventor just pays a reasonable royalty to the first. This acknowledges that both had a right to the "inevitable" idea, but the first gets a tax for arriving earlier.

  ### 5. Summary for Section

  If you want to bring this to section, here is the core argument:

  **Patent law is not a metaphysical claim about the nature of invention; it is an administrative heuristic.**

  The system *knows* inventions are often inevitable (via the obviousness doctrine). But it *acts* as if they are singular (via first-to-file and no independent defense) because the alternative requires courts to become historians of science, determining "who really deserved it" or "how close was close enough."

  The "Incentive Story" is the PR campaign; the "Coordination/Disclosure Story" is the operational manual. The friction you feel is the gap between the **Romantic ideology** we tell to justify the system to the public, and the **Bureaucratic reality** required to run it.

  **Suggested Reading for your paper:**
  *   **Mark Lemley, "The Myth of the Sole Inventor"** (This is the direct hit on your topic).
  *   **Robert Merton, "Singletons and Multiples in Scientific Discovery"** (The sociology classic you likely already know).
  *   **Edmund Kitch, "The Nature and Function of the Patent System"** (For the "Prospect Theory" angle).

  You aren't rambling; you've identified the central philosophical instability of IP law. Lean into it.
