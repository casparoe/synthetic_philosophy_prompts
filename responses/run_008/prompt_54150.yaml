      *   **Specific Components to Translate:**
          *   The constraint itself.
          *   Its bindingness in the single case.
          *   The agent-relative nature (it's *my* killing that's forbidden, not the others').
          *   The justification for following the rule despite "self-defeating" consequences (distinguishing from "rule rightly applied, unjust result").
      *   **The Residue Report:** Three parts (clean map, distorted map, unmappable).
      *   **Critical Constraint/Warning:** Do *not* justify the rule systemically (administrability, predictability, institutional health). This is the "standing temptation" of the legal mind. If I do this, I'm converting deontology into rule-utilitarianism or policy-based law. I must flag this as residue, not successful translation.
      *   **The Verdict:** Is the residue a defect in legal vocabulary, or does it show the deontologist is covertly systemic? (Or is both too tidy?)

  2.  **Deconstruct the Deontological Position (Philosophical Core):**
      *   *Constraint:* Agent-relative prohibition. "I must not kill." Not "Minimize killing."
      *   *Bindingness:* Categorical imperative (roughly). Not dependent on outcomes.
      *   *Agent-Relativity:* I am responsible for my agency, not for controlling the agency of others through my own violation.
      *   *Non-Systemic Justification:* It's not about the long-term health of the rule; it's about the intrinsic wrong of the act *now*.
      *   *The Paradox:* Honoring the rule leads to more violations of the rule's *content* (more deaths), but preserves the *integrity* of the agent's adherence to the norm.

  3.  **Drafting the Translation (Legal Vocabulary):**
      *   *Constraint:* Needs to sound like a *per se* rule of professional conduct or a jurisdictional bar. Not a balancing test.
      *   *Bindingness:* "Shall not" without exceptions. Not "unless necessary to prevent greater harm."
      *   *Agent-Relativity:* This is tricky. In law, we have "standing" or "privity." Maybe the concept of *personal liability* vs. *vicarious liability*? Or the distinction between *misconduct* and *failure to prevent misconduct*?
      *   *Justification:* This is the hardest part. Lawyers justify hard results via policy (predictability, floodgates). Deontologists justify via *integrity* or *rights*. I need to find a legal analog that isn't policy. Maybe *jurisdictional limit*? A court *cannot* hear a case even if justice demands it? No, that's systemic. Maybe *privilege*? Attorney-client privilege protects guilt to preserve the relationship. That's close, but often justified systemically (zealous representation).
      *   *Better Analog:* A *non-waivable conflict of interest*. You can't represent Client A against Client B even if both want it and it saves money. Why? Because the integrity of the representation is compromised. Or *judicial disqualification*. A judge must recuse even if they are the only one who can hear the case quickly.
      *   *Refining the Translation:* Let's look at the "Rule of Professional Conduct."
          *   Rule: "A lawyer shall not reveal confidential information."
          *   Exception: "To prevent death or substantial bodily harm." (Many jurisdictions have this).
          *   Deontological version: "A lawyer shall not reveal confidential information." (Period.)
          *   Why? Not because secrecy is good for the system long-term. But because *this* promise binds *this* lawyer.
          *   Actually, the "Fruit of the Poisonous Tree" doctrine is a strong candidate. Evidence is excluded not because it's unreliable, but because the *state's hands* must be clean.

  4.  **Addressing the Warning (Systemic Justification):**
      *   I must be hyper-vigilant not to say "If we allowed this exception, the rule would collapse." That is the "slippery slope" or "administrability" argument.
      *   The deontologist says: "It is wrong *in this instance*."
      *   The lawyer says: "We ban this *in all instances* to keep the rule workable."
      *   I need to highlight this gap.

  5.  **Developing the Residue Report:**
      *   *Clean Map:* Per se rules, non-waivable conflicts, exclusionary rules (fruit of poisonous tree), statute of limitations (justice denied for procedural finality - though this is often systemic). Let's stick with *exclusionary rules* and *non-waivable conflicts*.
      *   *Distorted Map:* "Bright-line rules for administrability." This sounds like the rule but justifies it via policy.
      *   *Unmappable:* The concept of "agent-relative obligation" distinct from "duty to the client/court." The idea that *my* hands matter more than the *outcome* in a way that isn't about precedent. The "integrity of the agent" vs. "integrity of the proceeding."

  6.  **Formulating the Verdict:**
      *   Is legal vocabulary defective? Yes, because law is inherently institutional and systemic. Law regulates *social order*. Deontology regulates *moral agency*.
      *   Is deontology covertly systemic? No, that's the standard consequentialist critique, but it misses the point of the agent-relative constraint.
      *   Is both too tidy? Likely. The intersection is messy.
      *   *My Honest View:* The legal vocabulary is teleological (aimed at order/justice). Deontology is non-teleological (aimed at rightness of act). The residue isn't a defect; it's a category error. Law *cannot* be purely deontological because law is a tool of governance.

  7.  **Refining the Tone:**
      *   Respectful, professional, acknowledging the user's expertise.
      *   Avoid philosophical jargon (categorical imperative, maxim, noumenal).
      *   Use legal jargon correctly (per se, bright-line, standing, privilege, exclusionary).
      *   Be rigorous on the "Systemic Warning."

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I justify the rule by saying "otherwise everyone would do it"?
      *   *Correction:* If I did, I failed. I need to emphasize the *intrinsic* bar.
      *   *Check:* Did I explain agent-relativity?
      *   *Correction:* Use the concept of "personal jurisdiction" over one's own acts vs. lack of jurisdiction over others' acts. Or "privity."
      *   *Check:* The "unjust result" distinction.
      *   *Correction:* In law, "rule applied, unjust result" implies the rule *should* be changed or waived. For the deontologist, the "unjust result" (5 deaths) is not a reason to waive because the rule wasn't designed to minimize deaths, but to prohibit *my* killing.

  9.  **Final Polish:** Ensure the structure matches the prompt (Restatement, Residue Report, Verdict).

  *(Self-Correction on the "Agent-Relative" translation)*: How does a lawyer understand "It's my killing, not theirs"?
  *   *Legal Analog:* Vicarious Liability vs. Direct Liability. I am not liable for my partner's malpractice unless I supervised it. But deontology is stronger: I am *forbidden* to act, even to stop them.
  *   *Better Analog:* *Standing*. I lack standing to intervene in their agency by violating my own bar.
  *   *Best Analog:* *Judicial Disqualification*. A judge cannot rule on a case where they have a financial interest, even if they are the only judge available and the plaintiff will suffer irreparable harm if they wait for another judge. The integrity of *that judge's* act is the constraint.

  *(Self-Correction on the "Systemic Warning")*: I need to make sure I don't slip into "If judges started ruling on their own cases, public trust would erode." That's systemic. I need to say "The act of ruling is inherently corrupted."

  Okay, ready to write.

  *Structure:*
