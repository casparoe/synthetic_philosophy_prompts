prompt: |-
  I'm a senior software engineer with no formal philosophy background, though I've read enough pop philosophy of science to know roughly what falsification is supposed to be. A colleague with a philosophy degree recently told me the interesting response to Popper isn't Kuhn (whose "paradigm shifts" get name-dropped in every tech keynote I've ever sat through) but Lakatos and his research programmes. I looked up the basic vocabulary — hard core, protective belt, positive and negative heuristics, progressive versus degenerating programmes — and I suspect the whole thing can be restated almost losslessly in terms I use every day: stable public APIs versus implementation details I'm free to refactor, exception handlers and compatibility shims accumulating around legacy code, the rule of thumb that no single bug justifies a rewrite, a backlog that tells you which parts of the system to work on next, and the difference between a codebase whose changes keep enabling behavior you didn't plan for versus one where every change is a patch for something the last change broke. So that's what I want: restate Lakatos's picture of how scientific research programmes live and die in the vocabulary of software engineering, as faithfully as you can, and then give me the residue report — what translates cleanly, what has to be distorted to fit, and what has no expression at all in my vocabulary.

  Here's the twist that makes me think this isn't just an idle translation exercise. My working suspicion is that the residue will be concentrated in one place: Lakatos's notion of a *progressive* programme isn't just "changes keep unlocking new capabilities," because in software that's trivially achievable — any codebase can keep shipping features — whereas Lakatos wanted some notion of *novel predictions*, of the programme successfully anticipating results it wasn't designed around, which is much closer to generalizing to unseen inputs than to feature velocity. If I'm right, then my vocabulary quietly substitutes a proxy for the actual criterion, and arguments about whether a programme is progressive would come out wrong in translation. I'd like you to check that suspicion rather than indulge it.

  Please structure the response as exactly five numbered items, each a sentence or two, with no introduction or conclusion: (1) the hard core and negative heuristic in my vocabulary; (2) the protective belt and positive heuristic in my vocabulary; (3) progressive versus degenerating programmes in my vocabulary, being explicit about where my feature-velocity proxy diverges from Lakatos's novel-prediction criterion if it does; (4) the residue report proper — the parts of his position that survive only distorted, or not at all; and (5) your verdict on the residue: does it expose something software engineering vocabulary genuinely cannot say, or does it show that Lakatos's own position was less clear than it looked? Finally, throughout, keep what is actually settled in the literature separate from what is contested among people who know Lakatos — I'm told the field disagrees about whether he intended research programmes as a theory of rational reconstruction or as actual history, and about how normative the whole apparatus really is — and don't present a contested reading as the consensus one. I'd rather be told where you're taking sides than have it smuggled in as translation.
