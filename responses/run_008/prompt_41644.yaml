  I'm a science-and-ideas journalist working on a long-form piece about the ethics of budget season: every year, wealthy governments allocate vastly more per head to compatriots — through welfare, healthcare, flood defences — than to foreigners through aid, and every year commentators call this either common sense or a moral scandal. To sharpen the piece, I'd like your considered credence on the following proposition, stated precisely so it has a truth value: compatriots have claims of justice on one another, arising from shared citizenship itself, that foreigners do not have — claims strong enough that a government may permissibly prioritise a compatriot's modest need over a foreigner's more urgent need, and this is not merely a permission grounded in a state's legitimate special-purpose duties, a concession to partiality, or an excuse generated by collective-action problems among states. Note the three escape hatches I've tried to close off: I'm not asking about duties a state has because it took on a role (like a doctor's), nor about the claim that partiality is simply permissible, nor about the claim that states would free-ride without such priorities. The question is whether shared citizenship is itself a generator of distinctive distributive obligations to insiders.

