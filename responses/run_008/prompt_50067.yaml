  Based on your advisor's track record, three candidate rules emerge regarding what makes a period "real" and who owns it.

  **Rule 1: The Ontological Carving Rule.** A period is real if it names a causal structure or process that actually organized reality (Cold War, LIA, Scientific Revolution), not merely a label projected backward (Renaissance) or a pedagogical shortcut (Long 18th).
  *Prediction:* The Anthropocene is **real**. It names a tangible physical structure (human dominance of earth systems) unlike the Renaissance's stylistic projection.

  **Rule 2: The Evidentiary Sovereignty Rule.** Authority belongs to the discipline holding the primary evidence of the driving process. Physical drivers defer to scientists (LIA, Iron Age); epistemic/political drivers defer to historians (Scientific Revolution, Cold War).
  *Prediction:* **Climate scientists and environmental historians** decide. Geologists rejected the formal epoch, but climate scientists (trusted on LIA) validate the physical process, while historians validate the human driver.

  **Rule 3 (Rival): The Formal Ratification Rule.** A period is real only if the relevant formal scientific commission ratifies the marker.
  *Prediction:* **Not real.** The stratigraphy commission voted down the proposal.

  **My Prediction:**
  She will follow Rule 1 and Rule 2. She prioritizes structural reality over formal consensus (see Cold War's "conventional" endpoints) and defers to scientists who affirm the physical process (see LIA), even if other scientists dissent.
  1.  **Real Period:** Yes. It carves reality via a single driving process (human impact).
  2.  **Start:** **Mid-twentieth century.** Despite the geologists' rejection, this aligns with the "Great Acceleration" and the synchronous global order she admired in the Cold War.
  3.  **Who Decides:** **Climate scientists and environmental historians.** She will bypass the stratigraphers (who said no) in favor of the climate scientists (who said yes on LIA) and historians (who own the human context).

  **Testing the Rules:**
  To distinguish Rule 1 from Rule 3, propose the **"Digital Age."** If she calls it real (epistemic shift like Scientific Revolution), she prioritizes Ontological Carving. If she rejects it (no formal commission, risky projection), she prioritizes Formal Ratification.

  **Confidence:**
  I am highly confident she will deem it a **real period** given her tolerance for diachronous onsets (LIA) and conventional endpoints (Cold War). I am least sure about **who decides**; she might privilege historians over climate scientists if she views the Anthropocene as fundamentally a political condition rather than a physical one.

  Verdict: real period; mid-twentieth century; climate scientists and environmental historians
