answer: |-
  The configuration you have described is most accurately and establishedly termed **Path Dependence**.

  This concept originated in economics and the history of technology (most notably in the work of Paul David regarding the QWERTY keyboard and W. Brian Arthur regarding increasing returns) and was later adopted by historical institutionalism in political science (Paul Pierson, James Mahoney). It specifically denotes a dynamic process where past decisions or events, often small or contingent at the time, constrain present and future choices, not merely through the unrecoverable expense of the past (sunk cost) but through the active architecture of the present.

  Here is how *Path Dependence* fits your description, how it differs from near-misses, and how the literature addresses the distinction you identified.

  ### Why "Path Dependence" Fits
  You correctly noted that this is more than **Sunk Cost**. In economics, sunk cost refers to a past expenditure that cannot be recovered; rational theory dictates it should be ignored in future decision-making. Path dependence argues the opposite: the past expenditure created a structure (your machine layout, employee skills, supplier relationships) that makes ignoring it impossible. The cost is not just unrecoverable; it is *generative* of current constraints.

  It is also more than **Switching Costs**. Switching costs imply a price tag attached to changing systems. Path dependence implies that the "price" may become infinite or the alternative may cease to exist (as with the control system maker going out of business). The difficulty is not transactional but structural; the ecosystem required to support the alternative has atrophied or never formed.

  It is distinct from **Habit**. Habit is psychological or behavioral. Path dependence is institutional and technological. Your employees are not servicing the old machines because they "like" them; they are doing so because the entire material and economic environment makes servicing anything else unviable.

  A close near-miss is **Hysteresis**. Used in physics and macroeconomics, hysteresis describes a system where the state depends on the history of its inputs (e.g., unemployment rates staying high even after a recession ends). It captures the "active consequence" aspect well. However, *Path Dependence* is the preferred term in the history of technology and organizational sociology because it emphasizes the *sequence of events* (the 1974 choice, the 1961 vote) rather than just the lag in system response. Hysteresis describes the *lag*; Path Dependence describes the *trajectory*.

  ### The Distinction: Converging Routes vs. Opening Destinations
  The literature explicitly recognizes the distinction you observed, though it uses different terminology.

  1.  **Selecting Among Converging Routes:**
      In systems theory and historical sociology, this is called **Equifinality**. It describes a situation where different initial conditions or paths lead to the same final state. In the path dependence literature, this is sometimes associated with **Weak Path Dependence**. Critics of path dependence (such as Liebowitz and Margolis) often argue that many historical examples are merely cases of equifinality: the market eventually corrects, and the "superior" standard wins regardless of the early noise. In your industry's connector standard example, if both standards lead to functionally identical machines in five years, the early choice was merely a route selection.

  2.  **Opening or Closing Destinations:**
      This is the core of **Strong Path Dependence** or **Lock-in**. This occurs when early events select between **Multiple Equilibria**. Here, the path determines the destination. If your grandfather had chosen the other control system, the firm might not have survived the transition when that other maker went bust, or the town without the interchange lacked the critical infrastructure to attract the investment needed to survive. This is often analyzed through the lens of **Critical Junctures**. A critical juncture is a short period where structural constraints are relaxed, allowing for significant choice (1974, 1961). Once the choice is made, the system enters a "path dependent phase" where the destination is locked in.

  ### Testability: Can We Tell the Difference?
  You asked if it is permanently untestable which role an early event played. The literature argues it is difficult but not impossible, primarily through **Counterfactual Analysis**.
  *   **For Converging Routes:** Historians look for evidence of *convergence* in other regions or industries where the alternative choice was made. If the town eleven miles east had thrived without the interchange, or if other firms using the rival control system survived equally well, the event was likely a route selection.
  *   **For Opening/Closing Destinations:** Researchers look for **Self-Reinforcing Mechanisms** (Arthur's term). Did the choice create increasing returns? (e.g., more users made the system more valuable, or more investment made it cheaper). If the mechanism is self-reinforcing, divergence is the likely outcome. In your case, the fact that the supplier went out of business *except* for your installed base suggests a high degree of lock-in (divergence), whereas the connector standard debate is currently in the "critical juncture" phase where the outcome is still contingent.

  ### Conclusion
  While **Critical Juncture** names the moment of choice, and **Lock-in** names the resulting state, **Path Dependence** is the overarching term for the configuration where the sequence of history governs the current possibility space. It encompasses both the mechanism (self-reinforcement) and the outcome (constraint), and the literature uses the degree of path dependence (weak/equifinality vs. strong/lock-in) to distinguish the two roles you identified.

  \answer{Path Dependence}
