answer: |-
  This is a sophisticated worldbuilding problem that cuts to the heart of how societies function. You and your beta reader are actually describing two different mechanisms of social order, and both are partially right. Your intuition about Lewis is sharp, though for the record, the definition of convention as "arbitrary + mutual expectation" comes from the philosopher **David Lewis** (in his 1969 book *Convention*), not C.S. Lewis. But the concept is exactly what you recall.

  Here is the breakdown of the analogy, where it fails, and what that means for your novel.

  ### 1. The Correspondence: Mapping the Footpath
  To see where the analogy holds, we must map the beta reader's physical model to your social model.

  *   **The Walker:** An individual member of your society.
  *   **The Grass:** The total field of possible behaviors (e.g., all the ways one *could* greet someone).
  *   **The Worn Groove:** The established convention (e.g., bowing).
  *   **The Shortcut/Ease:** The social utility or reduced cognitive load gained by following the norm.
  *   **The Person Cutting Across:** The deviant, the innovator, or the outsider.
  *   **The Mechanism:** *Positive Feedback Loop.* Each time someone walks the path, it becomes slightly easier for the next person to do the same.

  **Why the Beta Reader likes this:** It explains **persistence**. You don't need a King to decree "Walk Here." The path exists because it is currently the easiest way to get across the lawn. In fiction, this means you don't need a "Creation Myth" for every handshake rule; you just need to show that everyone does it.

  ### 2. Where the Footpath Analogy Breaks Down
  The footpath model is a model of **efficiency**. The Lewis model is a model of **coordination**. This is where the grass gets muddy.

  **A. Efficiency vs. Arbitrariness**
  *   **Footpath:** A path across a lawn usually forms because it is the *physically optimal* route between two points (A to B). It solves a terrain problem.
  *   **Convention:** Conventions often solve *no physical problem*. Driving on the left is not physically easier than driving on the right. Eating with the right hand is not mechanically superior to the left.
  *   **The Break:** If your convention is truly arbitrary (like Lewis says), the "worn groove" shouldn't be smoother than the grass. It should be neutral. The reason people follow it isn't because it's *easier*, but because it's *safe*.

  **B. Friction vs. Sanction**
  *   **Footpath:** If you walk off the path, the penalty is physical friction (mud, longer distance, effort). Nature punishes you.
  *   **Convention:** If you break a convention, the penalty is social (confusion, offense, ostracization). *People* punish you.
  *   **The Break:** The footpath analogy implies a passive environment. Conventions require an active audience. A path doesn't care if you walk on the grass; your neighbors do.

  **C. Accumulation vs. Equilibrium**
  *   **Footpath:** The path grows by accumulation. One person walks, then another.
  *   **Convention:** Conventions exist in **equilibrium**. I don't bow because everyone *did* bow yesterday; I bow because I expect you to *expect* me to bow today. It is a simultaneous mental calculation, not a historical accumulation.

  ### 3. Does the Beta Reader's Conclusion Survive?
  **Her Conclusion:** "Stipulate any convention... as long as I show it being consistently followed, readers will find it natural, and I don't need to explain where it came from."

  **The Verdict:** She is right about **Narrative Economy**, but wrong about **Plausibility Limits**.

  You generally *should not* explain the history of every convention. Info-dumping the "Great Handshake Schism of 402" is boring. However, you cannot stipulate *any* convention. Readers have an intuitive sense of game theory. If a convention imposes a high cost without a visible coordination benefit, it feels like the author pulling strings, not a society functioning.

  **The Correction:** You don't need to explain the *origin* (the history), but you must make visible the *logic* (the coordination).

  ### 4. The "Smell a Rat" Test: When Do You Need a Seed?
  You asked if you can invent *any* convention. The answer is no. Conventions fall into three categories, requiring different levels of "seed" (myth, founder, asymmetry).

  #### Category 1: The "Thin" Convention (Low Cost, High Coordination)
  *   **Examples:** Greeting rituals, which side of the road to walk on, forms of address.
  *   **Reader Reaction:** These feel natural immediately. They are classic David Lewis conventions. It doesn't matter *which* way we bow, only that we bow the same way.
  *   **Requirement:** **No seed needed.** Just show consistency. The beta reader is 100% right here.
  *   **Why:** The benefit of coordination is obvious.

  #### Category 2: The "Thick" Convention (High Cost, Symbolic Value)
  *   **Examples:** Taboos on certain foods, wearing painful clothing, ritual scarring, handing over your firstborn's name.
  *   **Reader Reaction:** If you stipulate this without context, readers will ask, "Why do they hurt themselves?"
  *   **Requirement:** **Visible Asymmetry.** You don't need a history lesson, but you need to show the *social pressure*. Show someone being shamed for breaking it. Show the *fear* of the taboo, not just the rule.
  *   **Why:** The "footpath" isn't easier here; it's harder. The "groove" is deep because the fences are electrified.

  #### Category 3: The "Maladaptive" Convention (Everyone is Worse Off)
  *   **Examples:** A debt system that causes constant starvation, a war ritual that depletes the population, a hygiene rule that causes disease.
  *   **Reader Reaction:** **Major Rat Smell.** Human societies tend to optimize for survival. If a convention actively destroys the society, it shouldn't exist unless there is a powerful lock-in mechanism.
  *   **Requirement:** **A Seed is Mandatory.** You need a myth ("The Gods demand it"), a founder ("The King said so or he kills you"), or a visible asymmetry ("The elite benefit, the poor suffer").
  *   **Why:** A footpath never forms if it leads into a swamp. If your society is walking into a swamp, you must explain why they can't turn around.

  ### 5. Practical Advice for Your Novel
  Your beta reader wants to save you from **Worldbuilder's Disease** (over-explaining). Your intuition wants to save you from **Puppet Society Syndrome** (people acting without motive).

  Here is the synthesis:

  1.  **Trust the Beta Reader on Exposure:** Do not write prologues about the history of the convention. Do not have characters say, "As you know, since the Treaty of..."
  2.  **Trust Lewis on Design:** When inventing the convention, ask: *What coordination problem does this solve?*
      *   If it solves a problem (e.g., "We wear masks so spirits don't steal our breath"), it feels real.
      *   If it creates a problem (e.g., "We wear masks so we can't eat"), it needs a justification visible in the text.
  3.  **The "Seed" Strategy:** If you have a weird, costly convention, plant a seed in the *present tense*.
      *   *Bad:* A 5-page history of the Left-Hand Law.
      *   *Good:* A character instinctively hides their left hand, trembling, when a superior enters the room.
      *   *Result:* The reader infers there is a reason (fear/punishment/myth) without you explaining it. The *emotion* substitutes for the *history*.

  **Summary:** The footpath analogy works for **etiquette** (how we walk). It fails for **morality** (where we walk). You can stipulate the path, but if the path leads off a cliff, you must show us the fence that keeps people on it.
