answer: |-
  **The Fragility of Conditionals: Evaluating the Simple Analysis of Dispositions**

  The philosophical analysis of dispositions—properties like fragility, solubility, or lethality—has long been dominated by the Simple Conditional Analysis (SCA). According to this view, to ascribe a disposition to an object is merely to make a claim about what would happen under specific conditions. A glass is fragile if and only if, were it struck, it would break. This reductive account is attractive because it demystifies dispositions, translating occult powers into plain matters of fact about behavior and counterfactuals. However, the SCA faces a formidable challenge from cases of "finks" and "masks." These counterexamples suggest that the conditional "if... then..." structure fails to capture the reality of dispositions. This essay argues that while the Simple Conditional Analysis cannot survive in its original, reductive form, it can be salvaged through a principled repair that anchors dispositions in intrinsic causal bases, thereby avoiding the circularity of simple hedging while acknowledging the ontological reality of dispositional properties.

  To understand the threat, we must distinguish the two types of counterexamples provided in the puzzle. The first, often called a "Finkish" case (after philosopher C.B. Martin), involves an intervention that alters the object's intrinsic state upon the arrival of the stimulating circumstances. Consider a vase that is genuinely fragile. However, a sorcerer monitors the vase and, upon detecting an impending strike, instantly casts a spell that renders the vase structurally sturdy before the blow lands. The vase is struck, but it does not break. According to the SCA, the vase is not fragile, because the conditional "if struck, it would break" is false. Yet, intuitively, the vase *was* fragile right up until the moment of the strike. The disposition existed, but the stimulus triggered a mechanism that removed the disposition before the manifestation could occur.

  The second case, often called a "Mask" or "Antidote" case (associated with Mark Johnston), involves an intervention that blocks the manifestation without removing the disposition. Consider a lethal poison ingested by a person who has simultaneously taken an effective antidote. The poison retains its chemical structure and lethal disposition; the circumstances for manifestation (ingestion and bloodstream entry) are present. However, the antidote neutralizes the effect, and the person does not die. The SCA verdict is that the poison is not lethal, because the conditional "if ingested, death would occur" is false. Yet, the poison remains genuinely lethal; its power was merely masked by an extrinsic factor.

  These two cases are importantly different, and recognizing this difference is crucial for any potential repair. In the Fink case, the object arguably stops having the disposition before the manifestation could occur; the intrinsic basis of the fragility is removed by the sorcerer. In the Mask case, the object plausibly has the disposition all along; the intrinsic basis remains intact, but an extrinsic blocker prevents the causal chain from completing. The SCA fails in both instances because it conflates the *possession* of a disposition with the *success* of its manifestation. It treats dispositions as purely relational outcomes rather than properties inherent to the object.

  Defenders of the SCA often attempt to rescue the analysis by hedging the conditional. They propose that a glass is fragile if it would break when struck, *provided nothing interferes*. This introduces a *ceteris paribus* (all else being equal) clause to exclude sorcerers and antidotes. However, this strategy faces a devastating charge of circularity. To specify what counts as "interference," one must implicitly refer to the very disposition being analyzed. An event counts as "interference" only if it prevents the manifestation of a disposition that *would otherwise have occurred*. Thus, to define "fragility" using a "no interference" clause, one must already understand what fragility is to determine what counts as interfering with it. The analysis becomes vacuous: "The glass is fragile if it would break when struck, unless something prevents it from breaking." This tells us nothing about the nature of fragility itself; it merely restates the connection between the stimulus and the outcome while presupposing the disposition's existence.

  If simple hedging is circular, does the SCA deserve abandonment? Not necessarily. A more robust solution was proposed by David Lewis, who offered a principled repair that preserves the conditional link without falling into circularity. Lewis argued that dispositions are not identical to conditionals, but they are grounded in intrinsic categorical properties. On this view, to say a vase is fragile is to say it possesses an intrinsic structural property (a "causal basis") such that, if struck, that property would cause it to break.

  This modification handles the two counterexamples differently, respecting the distinction noted earlier. In the Fink case (the sorcerer), the vase possesses the causal basis for fragility initially. However, the sorcerer's spell removes that intrinsic basis at the moment of striking. Lewis's analysis can account for this by specifying that the conditional must hold in virtue of the intrinsic property remaining constant during the stimulus. Since the property is removed, the conditional fails, but the *ascription* of fragility at the earlier time remains true because the basis existed then. In the Mask case (the antidote), the poison possesses the intrinsic causal basis for lethality, and it retains it. The antidote is an extrinsic factor. Lewis's repair allows us to say the disposition exists because the intrinsic basis is present, even if extrinsic conditions prevent the manifestation. The conditional is thus refined: $x$ is disposed to $M$ in $C$ iff $x$ has an intrinsic property $B$ such that if $x$ were in $C$, $B$ would cause $M$.

  This repair avoids circularity because the "causal basis" is defined intrinsically (e.g., the molecular bonding of the glass, the chemical composition of the poison), not in terms of the disposition itself. We do not need to know what "interference" is to identify the molecular structure; we identify the structure first, and that structure grounds the counterfactual.

  However, this repair comes at a cost. It requires abandoning the idea that dispositions are *nothing but* conditionals. The Simple Conditional Analysis was originally appealing because it was reductive; it promised to explain dispositions without positing mysterious "powers." Lewis's repair admits that dispositions rely on real, intrinsic properties that ground the conditionals. The conditional is no longer the definition of the disposition, but rather a symptom of it.

  Therefore, we reach a definite conclusion. The Simple Conditional Analysis, in its strict reductive form, must be **abandoned**. It cannot withstand the Fink and Mask cases, and attempts to fix it with simple hedging collapse into circularity. However, the insight behind the SCA is too valuable to discard entirely. The analysis requires a **principled repair**. By anchoring the conditional in an intrinsic causal basis, we can distinguish between the loss of a disposition (Finks) and the blocking of a manifestation (Masks). This repaired view preserves the utility of conditional language while correcting the metaphysics: dispositions are real properties of objects that *support* counterfactuals, rather than being logical constructs *reducible* to them. The glass is fragile not because it would break, but because it has a structure that ensures it would break, barring finks and masks. This is the only way to save the analysis from vacuity while respecting the complexity of the physical world.
