answer: |-
  This is a classic pedagogical moment in political theory, often referred to as the **Paradox of Voting** (or Downsian Paradox). Your student is articulating the instrumental rationality problem: if the goal of voting is to affect the outcome, the cost exceeds the expected benefit.

  To dissect this in class, you can present the following "Menu of Readings." This moves from the empirical claim to the rational choice calculation, and finally to the normative implications.

  ### Part 1: The Menu of Readings

  #### 1. The Statistical Reading (The Empirical Claim)
  *   **The Claim:** The probability ($P$) that a single vote will be decisive (break a tie or create one) is effectively zero.
  *   **Assumptions:** Requires a model of voter behavior. If voters are random, $P$ declines exponentially with electorate size ($N$). If voters are correlated (partisans), $P$ is even lower in non-swing contexts.
  *   **Sensitivity:**
      *   **Electorate Size:** Highly sensitive. In a national election ($N \approx 10^8$), $P$ is roughly $10^{-30}$ or lower. In a small town ($N \approx 10^3$), $P$ is non-negligible.
      *   **Closeness:** Highly sensitive. If the race is predicted to be a landslide, $P \approx 0$. If the race is a dead heat, $P$ is maximized (order of magnitude $1/\sqrt{N}$), but still tiny for large $N$.
  *   **Plausibility:** **True** for national executive elections; **False** for local boards, primaries, or small committees. The student's claim that *no* election has ever been decided by one vote is empirically false (there are documented ties and one-vote margins in state/local races), but practically true for the presidency.

  #### 2. The Egoistic Expected-Utility Reading (The Rational Choice Claim)
  *   **The Claim:** Voting is instrumentally irrational for a self-interested agent.
  *   **The Calculus:** $R = (P \times B_{\text{self}}) - C$.
      *   $P$: Probability of being pivotal (vanishingly small).
      *   $B_{\text{self}}$: Personal benefit of preferred candidate winning.
      *   $C$: Cost of voting (time, effort).
  *   **Assumptions:** The agent values only their private welfare ($B_{\text{self}}$). Rationality requires $R > 0$.
  *   **Sensitivity:**
      *   **Electorate Size:** As $N$ grows, $P$ shrinks, making $R$ negative.
      *   **Closeness:** As the election gets closer, $P$ rises, making $R$ less negative. However, even in close national elections, $P \times B_{\text{self}}$ rarely exceeds $C$ unless $B_{\text{self}}$ is astronomical (e.g., the election determines whether you personally live or die).
  *   **Plausibility:** **True** under strict self-interest. This explains why rational egoists abstain. However, since millions vote, it suggests humans are not strict egoists or have other utility functions (expressive, duty-based).

  #### 3. The Social Expected-Utility Reading (The Ethical Calculus)
  *   **The Claim:** Voting is instrumentally rational if the voter cares about the welfare of others.
  *   **The Calculus:** $R = (P \times B_{\text{social}}) - C$.
      *   $B_{\text{social}}$: Total benefit to the polity ($\approx N \times B_{\text{self}}$).
  *   **Assumptions:** The voter assigns positive moral weight to the well-being of fellow citizens.
  *   **The Arithmetic Twist:** In a close election, $P$ scales roughly as $1/\sqrt{N}$. $B_{\text{social}}$ scales as $N$. Therefore, Expected Benefit $\approx (1/\sqrt{N}) \times N = \sqrt{N}$.
      *   **Result:** The expected social benefit *grows* as the electorate gets larger.
  *   **Sensitivity:**
      *   **Electorate Size:** Counter-intuitively, voting becomes *more* rational in larger elections if you care about the public good, because the stakes ($B_{\text{social}}$) outpace the drop in probability ($P$).
      *   **Closeness:** If the election is not close, $P$ drops exponentially, crushing the expected benefit. This reading relies heavily on the election being competitive.
  *   **Plausibility:** **True** for altruistic agents. It dissolves the paradox for anyone who believes their fellow citizens' welfare matters.

  #### 4. The Stronger Normative & Systemic Readings
  These readings move from "it doesn't pay" to "it shouldn't be done" or "the system is broken."

  *   **4a. Irrationality All Things Considered:**
      *   **Claim:** Voting is irrational, period.
      *   **Derivation:** Follows from **Reading 2** + the premise that *all* valid reasons for action must be self-interested or outcome-determinative.
      *   **Status:** **False.** Ignores expressive voting, duty, and social utility (Reading 3).
  *   **4b. No Duty to Vote:**
      *   **Claim:** One cannot have a moral obligation to perform an act that makes no difference. ("Ought implies Can").
      *   **Derivation:** Follows from **Reading 1** + a consequentialist theory of duty (duties must produce good outcomes).
      *   **Status:** **Debatable.** Deontologists argue duties exist regardless of efficacy (e.g., duty to bear witness).
  *   **4c. Permission Not to Vote:**
      *   **Claim:** A rational agent is morally permitted to abstain.
      *   **Derivation:** Follows from **Reading 2** or **4b**.
      *   **Status:** **Plausible.** Even if voting is good, it may be supererogatory (good to do, but not wrong to skip) rather than obligatory.
  *   **4d. Discrediting Elections (The Radical Reading):**
      *   **Claim:** Mass elections are illegitimate because they fail to translate individual judgments into collective outcomes meaningfully.
      *   **Derivation:** Follows from **Reading 1** + the premise that *legitimacy requires individual efficacy*.
      *   **Status:** **False/Unsupported.** Democratic legitimacy usually rests on *aggregate* equality and procedural fairness, not individual pivotality. This reading requires the additional, unsupported premise that a mechanism is broken if individual inputs are statistically negligible.

  ---

  ### Part 2: Close-Election Dynamics

  You asked which readings get weaker as the election gets closer, and if any get stronger.

  *   **Readings that get WEAKER (The objection loses force):**
      *   **Reading 1 (Statistical):** The claim "my vote won't matter" becomes less empirically accurate. $P$ increases.
      *   **Reading 2 (Egoistic EU):** The calculation $P \times B - C$ becomes less negative. Voting becomes *less irrational*, though usually still irrational.
      *   **Reading 3 (Social EU):** The calculation becomes *positive*. The argument against voting collapses entirely.
      *   **4a & 4b (Irrationality/Duty):** The claim that voting is irrational or that there is no duty becomes harder to sustain.

  *   **Readings that get STRONGER:**
      *   **None of the standard instrumental readings get stronger.** The student's position is uniformly weakened by a close election.
      *   *However*, there is a nuance: If the election is *too* close (e.g., decided by one vote), it might strengthen **Reading 4d (Discrediting Elections)** for a specific subset of critics who argue that a system resting on such fragile margins is unstable or arbitrary. But this is a niche argument. For your student, a close election simply makes their "futility" claim factually weaker.

  ---

  ### Part 3: Diagnosis and The Sharpest Reply

  #### Diagnosis: What does your student mean?
  Given that the student used the line to justify **indifference** rather than to argue for abolishing elections, they are almost certainly operating on **Reading 2 (Egoistic Expected-Utility)** backed by **Reading 1 (Statistical)**.

  They are not arguing that democracy is illegitimate (Reading 4d); they are arguing that *for them*, the cost-benefit analysis fails. They are treating the vote as a consumer purchase: "Why buy this if it doesn't change the product?" They are likely ignoring the Social Utility reading (Reading 3) because they either don't care about social welfare or don't see the arithmetic connection.

  #### Classification: True/Harmless vs. False/Devastating
  *   **True but Harmless:** **Reading 1 (Statistical).** It is true that their specific vote is unlikely to be pivotal in a national election. However, this fact alone does not justify abstention. It is harmless because pivotality is not the only source of value.
  *   **False but Devastating:** **Reading 4d (Discrediting Elections).** If true, it would undermine the course itself. It is false because it conflates individual efficacy with collective legitimacy.
  *   **False and Unsupported:** **Reading 2 (Egoistic EU) as a total justification.** It is false as a complete account of rationality because it assumes agents *ought* to be purely self-interested. It is unsupported because it ignores the $B_{\text{social}}$ variable.

  #### The Sharpest Precise Reply (Engaging the Arithmetic)
  Do not appeal to "civic duty" or "expressive value" yet. Meet them on the math. Use the **Social Expected-Utility** argument.

  **The Script:**
  > "Let's grant your premise: The probability ($P$) of your vote deciding the election is 1 in 10 million. Let's also grant that the cost ($C$) of voting is \$10 worth of your time.
  >
  > Your calculation is: $Expected Value = (1/10,000,000 \times \text{Benefit to You}) - \$10$. Since the benefit to you is finite, the result is negative. You are mathematically correct *if* you are the only person who matters.
  >
  > But suppose you care even one-tenth of one percent about your fellow citizens. The Benefit ($B$) is no longer just yours; it is the sum of the benefit to everyone. If the election affects 300 million people, the 'Social Benefit' is $300,000,000 \times \text{Benefit to You}$.
  >
  > Now the math flips:
  > $$ (1/10,000,000) \times (300,000,000 \times \text{Benefit}) = 30 \times \text{Benefit} $$
  >
  > Suddenly, the expected value is 30 times the personal benefit. If the election outcome is worth even \$1 to you personally, the social expected value is \$30, which covers your \$10 cost.
  >
  > So, 'one vote doesn't matter' is statistically true, but 'one vote creates no expected value' is false—unless you assume the welfare of your neighbors is worth exactly zero to you. Are you arguing the math is wrong, or that your neighbors don't count?"

  **Why this works:**
  1.  **Accepts P:** It doesn't fight the statistical reality (which students respect).
  2.  **Challenges B:** It forces the student to defend the *moral* premise (egoism) rather than the *statistical* premise.
  3.  **Scales:** It shows that the larger the election, the *more* rational it is to vote if you have any altruism at all.

  This moves the debate from "Can I change the outcome?" (No) to "Am I responsible for the risk?" (Yes), which is the actual heart of democratic theory.
