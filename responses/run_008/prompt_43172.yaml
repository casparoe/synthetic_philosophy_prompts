answer: |-
  Your intuition is spot-on. The illicit slide does occur between (3) and (5), and your friend's conclusion that premise (1) must be abandoned is not forced. In fact, most Bayesians would argue that rejecting (1) is the *most* costly option available.

  Here is the breakdown of where the argument fails, why it looks seductive, and the specific costs of the various escape routes you asked about.

  ### The Weak Link: Step (5)

  The step you should reject is **(5)**.

  **The Premise:** "Hence for every established theory whose supporting evidence is old... nobody now holds it on confirmatory grounds; the evidence that earned it acceptance no longer does any work."

  **Why it looks innocent:** It relies on an equivocation between confirmation as a *dynamic event* (the act of updating) and confirmation as a *static relation* (the logical support a proposition lends to another). In natural language, "confirm" is a verb that suggests an action happening *now*. If I say "This data confirms the theory," it sounds like the data is currently doing work. Your friend exploits this linguistic feature to argue that if the data isn't currently moving my credence needle, it isn't currently confirming anything.

  **Why it is false:** In Bayesian epistemology, the "work" of evidence is often historical. The fact that $E$ cannot raise your probability in $H$ *now* (because you already have $P(E)=1$) does not mean $E$ is not the *reason* your credence in $H$ is high. The support is "banked" in your current credence function. To say the evidence "no longer does any work" is to confuse the *cause* of your current belief state (the past update) with the *capacity* to change that state (a new update).

  If you reject (5), you preserve (1) and (6). You accept that scientific knowledge does not decay, but you clarify that "confirmatory grounds" refers to the *genealogy* of the credence, not just its current susceptibility to change.

  ### The Cost of Rejecting (5)

  If you block the argument at (5), you must articulate what it means for old evidence to support a hypothesis *now* if it cannot raise probability *now*. This forces you to adopt a specific interpretation of Bayesian confirmation. Here are the costs of the three standard "escape routes" that allow you to keep (1) and (6).

  #### 1. The Historical/Banking Account (Rejecting 5 directly)
  This view says confirmation is essentially diachronic. $E$ confirms $H$ relative to an agent at time $t$ if $E$ raised the probability of $H$ at some point in the agent's history.
  *   **The Cost:** It makes confirmation relative to individual history. If two agents have the same current credences but different learning histories (one learned $E$ first, the other learned $H$ first), they have different confirmation relations. This violates the intuition that support is a logical relation between propositions, not a biography of the believer. It also struggles to explain why we can cite old evidence in a paper *today* to persuade others.
  *   **Price:** You lose the idea that confirmation is a purely logical, synchronic relation. It becomes partly sociological or psychological.

  #### 2. The Hypothetical Prior Strategy (Counterfactualizing)
  This is the most common textbook solution (associated with I.J. Good and others). To evaluate if $E$ confirms $H$ now, we don't look at your *actual* current prior. We look at a *counterfactual* prior: "What would your credence in $H$ be if you *didn't* know $E$?" If $P_{counterfactual}(H|E) > P_{counterfactual}(H)$, then $E$ confirms $H$.
  *   **The Cost:** This requires constructing fictional credence functions. It is often unclear how to "subtract" evidence from a belief system without arbitrariness. How do I know what I would believe about General Relativity if I didn't know about Mercury's perihelion, given that I know so much other physics that might entail it?
  *   **Price:** You introduce a layer of fictionalism. Confirmation is no longer about your actual degrees of belief, but about the degrees of belief of a hypothetical version of you.

  #### 3. The Garber Solution (Refining Premise 2)
  Daniel Garber proposed that when we realize old evidence confirms a new theory, we aren't learning $E$ (which we knew); we are learning a *logical connection* ($H \to E$). We update not on $E$, but on the proposition that $H$ entails $E$.
  *   **The Cost:** This requires abandoning the assumption of "logical omniscience." Standard Bayesianism assumes agents know all logical truths instantly. Garber's solution requires a framework where agents can be uncertain about logical implications. This complicates the probability calculus significantly.
  *   **Price:** You must adopt a more complex, non-idealized Bayesian model that allows for uncertainty about logic/math.

  ### Is Your Friend Right About Premise (1)?

  Your friend argues that denying (1) is the "only remotely respectable option." This is incorrect. Denying (1) is actually the most radical and costly move of all.

  **If you deny (1) (Confirmation is not probability raising):**
  You likely move toward **Likelihoodism** or a **Hypothetico-Deductive** model. You might say $E$ confirms $H$ if $P(E|H) > P(E|\neg H)$ (the Likelihood Ratio), regardless of priors.
  *   **The Cost:** You sever the link between confirmation and rational belief revision. Under this view, evidence can "confirm" a hypothesis even if no rational agent should increase their belief in it (e.g., if the hypothesis was antecedently impossible). It turns confirmation into a relation between evidence and hypothesis that ignores the agent's total knowledge state.
  *   **Price:** You lose the ability to explain why we should *believe* confirmed theories. You have "confirmation" without "justification for belief." For an epistemologist, this is usually a worse bullet to bite than the costs of the hypothetical prior or Garber solutions.

  ### The Verdict on the Mercury Case

  Regarding the showcase example: The advance of Mercury's perihelion ($E$) was known ($P(E)=1$). Einstein proposed General Relativity ($H$).
  *   **Your Friend's View:** Since astronomers already knew $E$, learning $H$ couldn't use $E$ to raise probability in $H$. Therefore, $E$ didn't confirm $H$.
  *   **The Bayesian Rebuttal:** The confirmation occurred when the *logical connection* was discovered. Before 1915, $P(E|H)$ was unknown (or undefined). In 1915, scientists learned that $H$ entails $E$.
      *   If you use the **Garber** approach: They updated on "H entails E," which raised the probability of $H$.
      *   If you use the **Hypothetical Prior** approach: We judge the confirmation by asking, "If we hadn't known about Mercury, would discovering it now raise our confidence in GR?" The answer is yes.

  ### Summary

  Your friend's argument is a classic *reductio*, but it targets a straw man of Bayesianism that conflates *updating* with *support*.

  1.  **Reject Step (5).** It falsely infers that because evidence cannot trigger a *change* now, it provides no *support* now.
  2.  **Keep Premise (1).** Probability raising is the correct definition of confirmation, provided we understand it applies to the relevant learning event (historical or counterfactual).
  3.  **The Cost:** To make this work, you must accept that confirmation statements are often elliptical for counterfactual claims ("This *would* raise your probability if you didn't know it") or claims about logical learning ("I learned that the theory predicts this").

  Your friend is not forced to deny (1). She is only forced to deny (1) if she insists that confirmation must be a *synchronic, non-counterfactual, psychological pressure* exerted by evidence at every moment it is cited. That is not a requirement of Bayesianism; it is a misunderstanding of how Bayesian agents store the value of evidence. You can keep (1) and (6) comfortably, provided you pay the price of admitting that "confirmation" is sometimes a claim about history or counterfactuals, not just current psychology.
