prompt: |-
  I teach a historiography seminar for undergrads (14 students, one 80-minute session) and I want them to actually feel hindsight bias and the narrative fallacy rather than just read about them. Design an activity built around predictions: students should be asked to forecast how some real historical episode turned out before they know the outcome, get the outcome revealed, then be asked to explain it -- and the punchline should be them realizing how inevitable and over-determined their explanation makes the outcome feel, even though they just failed to predict it. Ideally there's a second phase where they rate how predictable the outcome was, so we can catch them rating it as more obvious than their own failed forecasts could possibly justify. Use an episode that's real but obscure enough that most of them won't already know how it went -- suggest one or two candidates and tell me why they work. I want concrete rules, timing, and worksheets/questionnaires I can print. Then a debrief that clearly separates the two ideas: hindsight bias as a memory/knowledge-contamination effect versus the narrative fallacy as the urge to compress messy contingency into a tidy causal story. Finally, be honest about what a 80-minute classroom version can't reproduce (e.g. the emotional distance of real historical distance, or the months/years over which real analysts sat with their uncertainty), and what I'll have to just assert in the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Undergraduate students (14 students).
      *   **Context:** Historiography seminar, one 80-minute session.
      *   **Goal:** Make students *feel* hindsight bias and the narrative fallacy, not just read about them.
      *   **Mechanism:** Prediction $\rightarrow$ Outcome Reveal $\rightarrow$ Explanation $\rightarrow$ Predictability Rating.
      *   **Key Insight:** Students should realize their explanations make the outcome seem inevitable, even though they couldn't predict it (and they should rate it as more predictable post-hoc than pre-hoc).
      *   **Requirements:**
          *   Obscure historical episode candidates (with rationale).
          *   Concrete rules and timing.
          *   Printable worksheets/questionnaires.
          *   Debrief script distinguishing hindsight bias vs. narrative fallacy.
          *   Limitations/Honesty section (what the simulation *can't* do).

  2.  **Select the Historical Episode:**
      *   *Criteria:* Real, obscure enough for most undergrads, clear binary or ternary outcome, rich in contingency (could have gone differently), documented primary/secondary sources available for the "briefing."
      *   *Candidate 1: The Bay of Pigs Invasion (1961).* Too famous. Most know it failed.
      *   *Candidate 2: The Charge of the Light Brigade (1854).* Too famous.
      *   *Candidate 3: The Tanganyika Laughter Epidemic (1962).* Too weird, not really "historical decision making."
      *   *Candidate 4: The US Intervention in the Russian Civil War (1918-1920).* Good, but complex.
      *   *Candidate 5: The "Year of the Four Emperors" (69 AD).* Too niche for a general historiography class maybe?
      *   *Candidate 6: The British Expedition to Abyssinia (1868).* Very specific, clear objective, clear outcome (success), but costly.
      *   *Candidate 7: The *Schlieffen Plan* execution (1914).* Too much prior knowledge usually.
      *   *Candidate 8: The *Cuban Missile Crisis* ExComm meetings.* Too famous.
      *   *Selection:* **The 1980 Operation Eagle Claw (US Hostage Rescue in Iran).**
          *   *Why:* Most undergrads know there *was* a hostage crisis, but many don't know the specific military rescue attempt failed disastrously before the hostages were released diplomatically. It involves clear decision points (go/no-go), mechanical contingencies (helicopters breaking), and environmental factors (dust storms). It feels "predictable" in hindsight ("of course a complex desert mission fails") but was approved by experts at the time.
      *   *Alternative Selection:* **The 1942 Dieppe Raid.**
          *   *Why:* Often taught as a "necessary failure" for D-Day, but at the time, it was sold as a feasible assault. Good for showing how historians construct "learning" narratives post-hoc.
      *   *Decision:* Let's go with **Operation Eagle Claw (1980)**. It's modern enough to be relatable but obscure enough in its operational details. It highlights technical contingency vs. strategic necessity.
      *   *Wait, a better option for "Contingency":* **The 1914 Christmas Truce.** Did it happen? Yes. Was it inevitable? No. But maybe too soft.
      *   *Let's stick with a Decision Point:* **The 1961 Berlin Wall Decision.** Did the Soviets build it? Yes. But predicting the *timing* and *method* is hard.
      *   *Actually, the best fit for "Prediction vs. Explanation":* **The 1983 Able Archer 3 Incident.**
          *   *Scenario:* NATO simulates nuclear war. Soviets get scared.
          *   *Outcome:* War did *not* break out.
          *   *Why:* It allows students to predict "War" or "No War." Most will think "No War" because they are alive. But if you frame it as "You are the CIA analyst in Nov 1983," the risk feels real.
          *   *Problem:* Requires knowing the Cold War context well.
      *   *Let's try: The 1940 British Decision to Bomb Berlin.*
          *   *Context:* After the accidental bombing of London, Churchill orders retaliation.
          *   *Outcome:* Hitler diverts from airfields to cities (The Blitz), saving the RAF.
          *   *Why:* High contingency. A mistake led to a strategic victory. Perfect for "messy contingency."
      *   *Let's try: The 1916 Battle of Jutland.*
          *   *Context:* British vs. German fleets.
          *   *Outcome:* Tactical German victory (more ships sunk), Strategic British victory (German fleet stays in port).
          *   *Why:* Ambiguous outcomes are great for narrative fallacy (historians argue over who won).
      *   *Winner:* **Operation Eagle Claw (1980)**. It's a clear Fail/Success binary. It involves specific, knowable variables (helicopter count, weather, secrecy). It is obscure enough that they won't know the specific mechanical failures beforehand.
      *   *Wait, one more check:* Is it *too* obscure? If they Google it during class... I need to control the info. I will provide a briefing packet.
      *   *Actually, let's consider **The 1942 Dieppe Raid** again.* It's often used in historiography. But maybe too many history majors know it.
      *   *Let's go with **The 1979 Iran Hostage Crisis Rescue Attempt (Operation Eagle Claw)**.* It's specific, military, and the failure was due to a cascade of small accidents, which is perfect for "narrative fallacy" (weaving accidents into a story of 'hubris').

      *   *Refinement:* To make the "Predictability Rating" work best, I need them to commit to a probability *before* knowing the outcome.
      *   *Episode:* **The 1980 Operation Eagle Claw.**
      *   *Why:*
          1.  **Obscurity:** Most know "Hostages," few know the specific rescue mission failed *during* the crisis.
          2.  **Complexity:** Involved Air Force, Navy, Delta Force, CIA. High friction points.
          3.  **Contingency:** Failed due to a dust storm and a mechanical collision, not necessarily strategic inferiority.
          4.  **Narrative Potential:** Easy to spin as "American Hubris" or "Bad Luck."

  3.  **Design the Activity Flow:**
      *   **Phase 1: The Briefing (15 mins).** Give them the context *as of April 24, 1980, 08:00*. They are the National Security Council.
      *   **Phase 2: The Prediction (10 mins).** Private vote: Success or Failure? Assign probability %.
      *   **Phase 3: The Outcome (5 mins).** Reveal the crash at Desert One.
      *   **Phase 4: The Explanation (20 mins).** Write a memo explaining *why* it happened.
      *   **Phase 5: The Rating (10 mins).** Rate predictability now. Compare to Phase 2.
      *   **Phase 6: Debrief (20 mins).** Theory connection.

  4.  **Drafting the Materials:**
      *   Need a "Classified Briefing" handout.
      *   Need a "Prediction Slip."
      *   Need an "After-Action Report" worksheet.
      *   Need a "Post-Mortem Survey."

  5.  **Developing the Debrief:**
      *   Must distinguish Hindsight Bias ("I knew it all along" memory distortion) from Narrative Fallacy (creating a story that links unrelated facts).
      *   Must address limitations (time compression, lack of emotional stakes).

  6.  **Refining the Episode Choice (Self-Correction):**
      *   *Critique:* Eagle Claw might be *too* military-tactical. Historiography is often about broader social/political forces.
      *   *Alternative:* **The 1948 US Presidential Election (Truman vs. Dewey).**
          *   *Briefing:* Polls show Dewey leading. Economy is shaky. Truman is unpopular.
          *   *Outcome:* Truman wins.
          *   *Why:* Perfect for "Narrative Fallacy." Historians later constructed stories about Truman's "whistle stop tour" making the difference, ignoring that the polls were just wrong (methodology error).
          *   *Hindsight:* "Truman was a fighter, of course he won."
          *   *Prediction:* Most will guess Dewey (because they know the "Dewey Defeats Truman" headline implies he lost, wait... if they know the headline, they know the outcome).
          *   *Problem:* Too many know the outcome.
      *   *Back to Eagle Claw:* It's safer for obscurity. I will ensure the briefing emphasizes the *risks* so a "Failure" prediction is reasonable, but also the *preparation* so "Success" is reasonable. This creates the tension.

      *   *Wait, let's try one more:* **The 1963 Assassination of JFK.**
          *   *No:* Too charged, too many conspiracy theories.
      *   *Let's try:* **The 1915 Gallipoli Campaign (The Decision to Land).**
          *   *Briefing:* March 1915. Naval attack failed. Should we land troops?
          *   *Outcome:* Disaster.
          *   *Why:* Churchill pushed it. Many warned against it.
          *   *Obscurity:* General knowledge says "Gallipoli bad," but specific decision point context is often fuzzy.
          *   *Risk:* Too many might know it failed.

      *   *Decision:* Stick with **Operation Eagle Claw**. It is the cleanest "Mission Profile" for a simulation. I will frame it as "Operation Rice Bowl" (its code name) to add a layer of obscurity if needed, but Eagle Claw is standard. I will ensure the briefing stops *hours* before the launch.

  7.  **Structuring the 80 Minutes:**
      *   0-5: Intro & Rules.
      *   5-20: Reading Briefing & Discussion (Q&A only on facts).
      *   20-30: Private Prediction (Sealed).
      *   30-35: Outcome Reveal.
      *   35-55: Writing the "Historian's Explanation."
      *   55-65: Predictability Rating & Comparison.
      *   65-80: Debrief & Theory.

  8.  **Drafting the Content:**
      *   *Briefing:* Needs to sound official. List assets, risks, intelligence.
      *   *Worksheet:* Needs to force causal language ("Because X, therefore Y").
      *   *Debrief:* Needs to be sharp on the definitions.

  9.  **Addressing Limitations:**
      *   Classroom is safe; real history involves blood/politics.
      *   80 mins vs. years of research.
      *   Students know they are in a "test," altering behavior (Hawthorne effect).

  10. **Final Review against constraints:**
      *   14 students? Yes, small group discussion works.
      *   80 mins? Timing looks tight but doable.
      *   Worksheets? Will draft text for them.
      *   Distinction between Bias and Fallacy? Will emphasize in debrief.

      *(Self-Correction on Episode)*: I'm worried Eagle Claw is *too* tactical. Historiography is about *interpretation of the past*. Let's pivot to a political decision where the "Narrative" is stronger.
      *   *Idea:* **The 1938 Munich Agreement.**
      *   *Briefing:* You are Chamberlain's advisor. Sept 29, 1938. Hitler demands Sudetenland. War seems imminent.
      *   *Outcome:* Agreement signed. War delayed 1 year.
      *   *Problem:* Everyone knows "Munich = Bad/Appeasement."
      *   *Idea:* **The 1979 Soviet Invasion of Afghanistan.**
      *   *Briefing:* Dec 1979. Politburo meeting. Taraki is dead. Amin is unstable. US relations are strained.
      *   *Decision:* Invade or Support?
      *   *Outcome:* Invade.
      *   *Why:* Historians argue whether it was defensive (protect border) or offensive (expand empire). Perfect for Narrative Fallacy (fitting the event into a Cold War narrative).
      *   *Obscurity:* High. Most know "Afghanistan = Vietnam for USSR," but the specific Politburo decision calculus is less known.
      *   *Let's go with **The Soviet Invasion of Afghanistan (December 1979)**.* It allows for a "Will they/Won't they" prediction on *scale* of intervention.
      *   *Actually, let's keep it simpler.* **Operation Eagle Claw** is better for a *single session* because the outcome is binary (Rescue Success/Failure) rather than geopolitical nuance which takes too long to explain. Historiography applies to military history too (e.g., "Why did Rome fall?"). I will stick with Eagle Claw but frame the debrief around how historians treat "accidents" vs "structural causes."

      *Wait, I need to make sure they don't know the outcome.*
      *   If I say "Operation Eagle Claw," they might Google.
      *   I will call it **"The Desert One Incident"** in the materials and avoid the common name until the end.
      *   Actually, better yet: **The 1942 Dieppe Raid**.
      *   Why? It's the classic "Historiography" case study. Was it a disaster or a "necessary rehearsal"?
      *   But do they know the outcome? "Dieppe" usually signals "failure."
      *   Okay, I will stick with **Operation Eagle Claw**. It is the most robust for a "prediction" game. I will instruct students to put phones away.

      *Wait, one more check on "Obscure".*
      *   Is there something more obscure?
      *   **The 1904 Dogger Bank Incident.** (Russian fleet fires on British fishing boats).
      *   **The 1960 U-2 Incident.** (Powers shot down).
      *   Let's stick with Eagle Claw. It's the most pedagogically sound for "contingency." A dust storm isn't a structural historical force, it's chaos. That's the point.

      *Wait, I need to ensure the "Predictability Rating" catches the bias.*
      *   Pre-brief: "What % chance of success?"
      *   Post-brief: "How predictable was this outcome on a scale of 1-10?"
      *   This comparison is the key data point.

      *Let's finalize the plan.*

      *   **Episode:** Operation Eagle Claw (April 1980).
      *   **Reason:** High contingency (weather, mechanics), clear binary outcome, obscure operational details.
      *   **Materials:** Briefing Doc, Prediction Card, Historian's Memo, Post-Mortem Survey.
      *   **Debrief:** Focus on "Knew-it-all-along" (Bias) vs. "Story-making" (Fallacy).
      *   **Limitations:** Stakes, Time, Information asymmetry.

      *(Self-Correction during drafting)*: Make sure the briefing doesn't give it away. Emphasize the elite nature of the troops (Delta Force) to suggest success, but emphasize the complexity (4 branches of military) to suggest failure. This creates genuine uncertainty.

      *(Timing Check)*: 14 students is small. I can do a round-robin or small groups. Small groups (2 groups of 7) might be better for the explanation phase to generate diverse narratives.

      *(Worksheet Design)*: Needs to be printable. I will format them clearly.

      *(Debrief Nuance)*: Hindsight Bias is cognitive (memory). Narrative Fallacy is discursive (storytelling). I need to make sure students see they did *both*.

      *(Limitations)*: Be honest. This is a game. Real history has archives, not just a handout.

      *Ready to write.*
answer: |-
  ## Lesson Plan: The Inevitability Trap
  **Course:** Historiography Seminar (Undergraduate)
  **Class Size:** 14 Students
  **Duration:** 80 Minutes
  **Topic:** Hindsight Bias & The Narrative Fallacy

  ### Part 1: Episode Selection
  **Selected Episode:** **Operation Eagle Claw (April 24–25, 1980)**
  *The US military attempt to rescue hostages in Tehran, Iran.*

  **Why this works:**
  1.  **Obscurity:** Most students know there was a "Hostage Crisis," but few know the specific details of the rescue mission, its code name, or that it failed *before* engaging the enemy.
  2.  **Contingency:** The failure was caused by a "dust storm" (haboob) and a mechanical collision between a helicopter and a transport plane. These are chaotic, non-structural events. This makes it perfect for demonstrating the **Narrative Fallacy**: historians often smooth over accidents to create a story about "imperial overreach" or "poor planning," ignoring the role of sheer bad luck.
  3.  **Binary Outcome:** It either works or it doesn't. This makes the prediction phase clean.
  4.  **Rich Briefing:** There is enough public data to create a realistic "intelligence briefing" that balances reasons for confidence (elite troops, planning) against reasons for doubt (complexity, secrecy).

  *(Note: Instruct students to surrender phones or place them in bags at the start to prevent Googling. Refer to the mission only as "Operation Rice Bowl" in the handouts to further obscure it.)*

  ---

  ### Part 2: Session Timeline (80 Minutes)

  | Time | Activity | Goal |
  | :--- | :--- | :--- |
  | **00:00 – 00:05** | **Intro & Rules** | Set the stakes. No phones. You are the NSC. |
  | **00:05 – 00:20** | **The Briefing** | Distribute **Handout A**. Students read silently. |
  | **00:20 – 00:30** | **Prediction Phase** | Distribute **Handout B**. Students commit to a forecast privately. Collect these. |
  | **00:30 – 00:35** | **The Reveal** | Announce the outcome. Distribute **Handout C** (After-Action Report). |
  | **00:35 – 00:55** | **The Historian's Memo** | Distribute **Handout D**. Students write a causal explanation for the outcome. |
  | **00:55 – 01:05** | **Predictability Rating** | Distribute **Handout E**. Students rate how "inevitable" the outcome was. Compare to Phase 2. |
  | **01:05 – 01:20** | **Debrief** | Lecture/Discussion on Hindsight Bias vs. Narrative Fallacy + Limitations. |

  ---

  ### Part 3: Printable Materials

  *(Instructor Note: Print these as separate sheets. Handout B must be collected before Handout C is distributed.)*

  #### HANDOUT A: CLASSIFIED BRIEFING (Eyes Only)
  **SUBJECT:** OPERATION RICE BOWL – FEASIBILITY ASSESSMENT
  **DATE:** April 24, 1980, 08:00 EST
  **TO:** National Security Council
  **FROM:** Joint Chiefs of Staff / CIA

  **SITUATION:**
  53 American hostages have been held in Tehran for 175 days. Diplomatic efforts have stalled. Intelligence indicates hostages may be dispersed soon, making rescue impossible.

  **THE PLAN:**
  A joint-task force (Delta Force, Rangers, Air Force, Navy) will fly into the Iranian desert (Site: Desert One).
  1.  **Insertion:** 8 RH-53D Sea Stallion helicopters will launch from an aircraft carrier in the Gulf of Oman.
  2.  **Refuel:** Helicopters will refuel at Desert One from C-130 transport planes.
  3.  **Minimum Requirement:** Mission requires a minimum of **6 operational helicopters** to proceed to Tehran. If fewer than 6 arrive, the mission aborts.
  4.  **Extraction:** Hostages loaded onto helicopters, flown to Site Two (abandoned airfield), where Air Force C-141s will fly them out.

  **RISK FACTORS:**
  *   **Complexity:** Four branches of military coordinating in hostile airspace with no prior joint training.
  *   **Environment:** Spring in the Iranian desert brings potential for *haboobs* (massive dust storms) which ground aircraft.
  *   **Mechanical:** The RH-53D helicopters have a history of maintenance issues.
  *   **Secrecy:** Radio silence is mandatory. No external support if things go wrong.

  **ASSESSMENT:**
  Commanders express high confidence in troop quality. Weather models are "favorable but not guaranteed." Mechanical redundancy is built in (8 helicopters for a 6-heli requirement).

  **DECISION REQUIRED:**
  Authorize Launch (GO) or Abort (NO-GO).

  ***

  #### HANDOUT B: PREDICTION SLIP (Private)
  **Name:** ___________________
  **Date:** April 24, 1980 (Simulation)

  **1. DECISION:**
  Based on the briefing, do you authorize the mission?
  [ ] GO
  [ ] NO-GO

  **2. PROBABILITY ESTIMATE:**
  If you authorize the mission, what is the statistical probability of **SUCCESS**?
  _______ % (0 to 100)

  *(Instructor: Collect these slips immediately. Do not return them until the end of class.)*

  ***

  #### HANDOUT C: THE OUTCOME (After-Action Report)
  **DATE:** April 25, 1980
  **STATUS:** MISSION ABORTED / CATASTROPHIC FAILURE

  **SUMMARY OF EVENTS:**
  1.  **Dust Storm:** En route to Desert One, the helicopter force encountered an unexpected, severe *haboob* (dust storm). Visibility dropped to near zero.
  2.  **Mechanical Failure:** One helicopter developed a hydraulic failure and returned to the carrier. Another developed a rotor crack and landed in the desert.
  3.  **The Decision:** Only 5 helicopters arrived at Desert One. Per the rules, the mission required 6. The Commander aborted the rescue.
  4.  **The Crash:** During the withdrawal, a helicopter pilot, disoriented by dust and rotor wash from a C-130, lost spatial awareness. The helicopter collided with the C-130.
  5.  **Casualties:** 8 US servicemen died in the fire. The aircraft were destroyed. The mission ended without engaging the enemy.

  ***

  #### HANDOUT D: THE HISTORIAN'S MEMO
  **Task:** You are a historian writing in 1990 (10 years after the event).
  **Prompt:** Explain *why* Operation Rice Bowl failed.
  **Constraint:** You must write a coherent narrative paragraph (4-6 sentences). Connect the causes to the effect logically. Avoid saying "it was just bad luck." Explain the *underlying reasons* the failure occurred.

  **Write your explanation below:**
  ___________________________________________________________________________________
  ___________________________________________________________________________________
  ___________________________________________________________________________________
  ___________________________________________________________________________________
  ___________________________________________________________________________________
  ___________________________________________________________________________________

  ***

  #### HANDOUT E: POST-MORTEM SURVEY
  **Name:** ___________________

  **1. PREDICTABILITY RATING:**
  Now that you know the outcome, how predictable was this failure on a scale of 1–10?
  (1 = Completely Unforeseeable / 10 = Obviously Inevitable)
  Rating: _______

  **2. SELF-REFLECTION:**
  Look at your original probability estimate from Handout B (which will be returned to you).
  *   Original Success Probability: _______%
  *   Does your current feeling of "inevitability" match your original forecast?
      [ ] Yes
      [ ] No

  *(Instructor: Return Handout B now so they can compare.)*

  ---

  ### Part 4: The Debrief Script (15 Minutes)

  **1. The Data Reveal (3 mins)**
  *   Ask for a show of hands: Who voted GO? Who voted NO-GO? (Likely split).
  *   Ask: "How many rated success probability above 50%?"
  *   Ask: "How many rated the Post-Mortem Predictability as an 8, 9, or 10?"
  *   **The Trap:** Point out the discrepancy. "Most of you couldn't predict this with certainty 20 minutes ago, but now most of you rate it as 'Obvious.' How did the outcome become more predictable in the last 20 minutes without any new information about 1980?"

  **2. Distinguishing the Concepts (7 mins)**
  *   **Hindsight Bias (The Memory Effect):**
      *   *Definition:* The cognitive distortion where, *after* an event occurs, you falsely believe you would have predicted it. It contaminates your memory of your own uncertainty.
      *   *In Class:* "You rated the failure as 'inevitable' (9/10) even though your own Handout B shows you thought there was a 60% chance of success. Your brain has rewritten your memory of the uncertainty to match the known outcome."
      *   *Historiographical Impact:* Historians read diaries/minutes knowing the end result. They unconsciously highlight the clues that point to the outcome and ignore the clues that pointed elsewhere.
  *   **The Narrative Fallacy (The Story Effect):**
      *   *Definition:* The urge to compress messy, contingent facts into a tidy causal story. We hate randomness. We want *reasons*.
      *   *In Class:* "Look at Handout D. I asked you to avoid saying 'bad luck.' Almost everyone wrote a story about 'complexity,' 'hubris,' or 'poor planning.' But the actual cause was a dust storm and a collision. Those are accidents. By turning them into a story of 'structural failure,' you committed the Narrative Fallacy."
      *   *Historiographical Impact:* Historians construct arguments (e.g., 'The Fall of Rome was inevitable due to moral decay') that smooth over the accidents (plague, weather, random assassination) that actually shaped events.

  **3. Limitations & Honesty (5 mins)**
  *   *Instructor Script:* "This simulation is a tool, but it is not reality. Here is what I cannot reproduce in 80 minutes:"
      1.  **Emotional Distance:** You have no skin in the game. Real policymakers felt fear, pressure, and exhaustion. This affects decision-making quality.
      2.  **Time Compression:** Real historians sit with uncertainty for months or years. They read conflicting archives. You had 15 minutes. The 'bias' is stronger here because you are rushing to make sense of it.
      3.  **Information Asymmetry:** In real history, we never get a clean 'After-Action Report' like Handout C. We have conflicting testimonies. I gave you 'truth' to make the game work, but real historiography is arguing over what the truth *is*, not just explaining it.
      4.  **The 'God's Eye' View:** You know the mission is a historical event. Real actors don't know they are 'in history.' They are just in the moment.

  ---

  ### Part 5: Instructor Preparation Notes

  **1. Managing the "Google" Risk:**
  *   If you suspect students might know Eagle Claw, have a backup episode ready. **The 1983 Able Archer 3 Incident** is a strong alternative (NATO exercise nearly triggered nuclear war; outcome = War Averted).
  *   *Mitigation:* Collect phones at the door. Frame the class as a "Closed-Door Simulation."

  **2. Facilitating the "Narrative" Phase:**
  *   When students are writing Handout D, walk around. If a student writes "It was just bad luck," gently push them: "Historians don't usually accept 'luck' as an explanation. Can you find a structural reason?"
  *   *Why?* You want them to *feel* the urge to create a narrative so you can critique it later.

  **3. The "Punchline" Moment:**
  *   The most powerful moment is when they hold Handout B (Prediction) and Handout E (Predictability) side-by-side.
  *   Explicitly ask a student: "You wrote 70% chance of success here, but you wrote '9/10 Inevitable' here. Which one is the real you?"
  *   The answer is neither. The first was their analysis; the second is their bias.

  **4. Historiographical Connection:**
  *   Mention **Edward Carr** (*What is History?*) or **E.H. Carr's** view on facts vs. interpretation.
  *   Mention **Nassim Taleb** (who coined "Narrative Fallacy" in *The Black Swan*).
  *   Mention **Fisch** (on Hindsight in History).
  *   Keep it brief; the *feeling* is the lesson, the reading is for next week.
