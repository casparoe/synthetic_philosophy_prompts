answer: |-
  This is a sophisticated impasse, and your frustration is shared by many who have watched this debate cycle since Clark and Chalmers (1998). You are right to sense that the standard diagnosis—"it's just a verbal dispute"—is too thin. If it were merely verbal, like the tomato/fruit case, we could stipulate a definition and dissolve the tension. We cannot. The heat persists because the boundary being drawn carries normative weight.

  Here is a diagnosis that takes your "border vs. coastline" intuition seriously but deepens it to account for the substantive stakes, grounded in the specific moves of the debate you outlined.

  ### The Diagnosis: A Clash of Jurisdictions, Not Ontology

  The dispute is not about a hidden empirical fact (the "coastline" view), nor is it merely verbal (the "stipulation" view). It is a **pragmatic conflict over explanatory and normative jurisdiction.**

  Both sides agree on the causal topology: there is a loop involving Otto, the notebook, the environment, and the neural machinery. The disagreement is about **where to place the boundary of responsibility and explanation** for different theoretical purposes. The Internalists and Externalists are answering two different questions that have been conflated under the single heading: *"Where is the mind?"*

  1.  **The Internalist Question (The Locus of Ownership):** "Where does the *self* reside for the purposes of phenomenology, moral responsibility, and intrinsic intentionality?"
  2.  **The Externalist Question (The Locus of Mechanism):** "Where does the *processing system* extend for the purposes of explaining successful behavior and cognitive engineering?"

  The impasse exists because each side treats their jurisdictional claim as an ontological discovery.

  #### Grounding the Diagnosis in the Debate's Moves

  **1. The Parity Principle as a Category Error**
  The original Parity Principle ("If it functions like cognition, it is cognition") was the catalyst for the confusion. It assumes that if the *output* is the same, the *ontological status* must be the same.
  *   **Diagnosis:** Parity works for the **Mechanism** question but fails for the **Ownership** question. A calculator computes square roots like a brain, but we don't feel responsible for the calculator's errors in the way we do for our own arithmetic. By pushing Parity too hard, the first wave of Externalists invited the charge that they were erasing the subject.

  **2. The Coupling-Constitution Fallacy as a Jurisdictional Defense**
  Critics (Adams, Aizawa, Fodor) argue that coupling (causal dependence) does not imply constitution (identity). The gas main is not part of the stove.
  *   **Diagnosis:** This is not just a metaphysical point; it is a defense of the **Ownership** jurisdiction. If the gas main is part of the stove, then the gas company is partly responsible for my dinner. Internalists are protecting the boundary of the *agent* to preserve a coherent notion of autonomy. They fear that if the notebook is part of Otto, then losing the notebook is a lobotomy, and tampering with it is assault. They resist this not because the causal flow isn't real, but because the *normative consequences* are too disruptive.

  **3. Embeddedness as a Compromise that Satisfies No One**
  Critics often retreat to "Embedded Cognition": the mind uses tools but isn't constituted by them.
  *   **Diagnosis:** This attempts to keep the jurisdictions separate. The mind is inside; the tools are outside. But this creates the "homunculus problem" (who is inside using the tools?). It satisfies the Internalist's need for a core self but fails the Externalist's need to explain how the tool usage is seamless. It preserves the border but makes the interaction mysterious.

  **4. Complementarity as the Mature Externalist Move**
  The second wave (Clark, Menary, Sutton) shifted to Complementarity: inner and outer resources do different things but are tightly integrated.
  *   **Diagnosis:** This implicitly concedes that the "border" isn't a natural kind. It acknowledges that the internal and external are *different* (undermining strict Parity) but argues they form a *single functional unit*. This moves the debate closer to your "border" hypothesis. It suggests the boundary is drawn based on **integration density**, not substance. However, critics still reject this because high integration doesn't solve the "Ownership" problem. Even if tightly integrated, is the notebook *me*?

  ### Why It Feels Substantive (The "Real Stakes")

  You noted that the dispute doesn't *feel* verbal. That is because it isn't about the word "cognitive"; it is about **moral and legal metaphysics**.

  *   **Privacy:** If my phone is part of my mind, does searching it require a warrant equivalent to a strip search? (Courts are currently wrestling with this).
  *   **Responsibility:** If my algorithmic trading bot makes a mistake, is it *my* error or a tool malfunction?
  *   **Phenomenology:** When I lose my phone, I feel a phantom limb sensation. This feels like a loss of *self*, not just a loss of property.

  The Internalists are trying to protect the conditions for human rights and responsibility (which require a bounded subject). The Externalists are trying to describe the reality of human problem-solving (which requires an unbounded system). They are fighting over who gets to draw the map, because the map determines the laws.

  ### What Counts as Progress?

  Given this diagnosis, progress will not come from finding a "mark of the cognitive" (Internalist goal) nor from proving the notebook is literally neural tissue (Externalist goal). Progress requires **disentangling the jurisdictions**.

  **1. Abandon Monism for Pluralism**
  We must accept that there is no single "true" boundary of the mind. There is the **Phenomenal Boundary** (where experience feels like it stops), the **Moral Boundary** (where responsibility is assigned), and the **Functional Boundary** (where the causal loop closes).
  *   *Progress:* A paper or discussion that explicitly asks: "For *which purpose* are we drawing the boundary?" If we are designing AI interfaces, the Externalist boundary is useful. If we are assigning criminal liability, the Internalist boundary is safer. Acknowledging this dissolves the "fallacy" accusations; it turns out both sides are right about different things.

  **2. Shift from "Constitution" to "Integration"**
  Stop asking "Is X part of Y?" and start asking "How integrated is X with Y?"
  *   *Progress:* Empirical work that measures **degrees of cognitive integration** (e.g., reaction times, error rates, neural plasticity in response to tool use) rather than binary "in/out" classifications. This validates the Complementarity view without triggering the Constitution alarm. We can say the notebook is *highly integrated* without saying it is *ontologically identical* to a neuron.

  **3. Normative Explication (The Carnapian Move)**
  Take your "national border" analogy seriously. A national border is not a natural kind, but it is not arbitrary. It is drawn to manage resources, rights, and conflicts.
  *   *Progress:* An argument that treats "cognitive system" as a **normative concept** rather than a descriptive one. We should ask: "What do we *gain* by treating the notebook as part of the mind?" If treating it as such improves our psychological models or ethical frameworks, we adopt the extension. If it creates legal nightmares, we restrict it. This makes the debate about *value* and *utility*, which is resolvable, rather than *metaphysics*, which is stuck.

  **4. The "Permanent Impasse" Argument**
  Finally, there is a possibility that the impasse is permanent because the two questions (Mechanism vs. Ownership) are incommensurable.
  *   *Progress:* A meta-philosophical acceptance that "The Mind" is a **cluster concept** that cannot be unified. We might conclude that the "Extended Mind" is a powerful metaphor for the Mechanism question but a dangerous category error for the Ownership question. Progress here is the cessation of the attempt to force one answer to serve both masters.

  ### Recommendation for Your Group

  For your next session, I suggest you stop debating whether Otto's notebook *is* memory. Instead, run a thought experiment on **liability**:

  > *Otto's notebook is hacked by a third party, causing him to go to the wrong location and miss a crucial meeting. Inga is drugged by a third party, causing her to forget the meeting.*

  Ask the group:
  1.  Is the moral culpability of the hacker identical to the drugger?
  2.  Is Otto's loss identical to Inga's?
  3.  If the answers differ, *why*, given the functional parity?

  This forces the group to confront the **Normative/Ownership** question directly, separating it from the **Functional/Mechanism** question. You will likely find that the Internalists care about the *mode of violation* (intrusion of self vs. loss of tool), while the Externalists care about the *outcome* (disruption of agency).

  Once you see they are protecting different values, the "Coupling-Constitution" wall begins to look less like a metaphysical barrier and more like a fence around a garden they are both trying to tend, just with different maps.
