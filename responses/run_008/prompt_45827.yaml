answer: |-
  Here is the principle that sorts your pile, the verdict on your cases, and the hard truths you asked for.

  ### The Principle: The Exogeneity Constraint

  **Culture is a valid causal explanation only when the cultural trait (norm, belief, or practice) can be shown to exist *prior* to and *independently* of the outcome it purports to explain.**

  In social science terms, the cultural variable must be **exogenous**, not **endogenous**.
  *   **Exogenous (Valid):** The culture is an input. It shapes how people react to the world. (e.g., "I don't tip because my norm says tipping is for tourists," where the norm existed before the meal).
  *   **Endogenous (Invalid):** The "culture" is an output. It is a rational adaptation to the structural conditions you are trying to explain, or simply a label for the behavior itself. (e.g., "They don't save money because they have a culture of poverty," where the lack of saving is caused by having no money, and the "culture" is just the name for that adaptation).

  Your friend was half-right: You *do* need a mechanism (individual beliefs changing behavior). But a mechanism isn't enough. You also need the right **direction of causality**. If the "culture" arose *because* of the condition it's supposed to explain, it's not a cause; it's a symptom.

  ---

  ### How the Principle Sorts Your Verdicts

  This principle saves most of your intuitions but forces you to abandon one you're clinging to.

  **1. The "Legit" Pile (Saved)**
  *   **Weber (Protestant Ethic):** **PASSES.** The religious anxiety about salvation *predated* the accumulation of capitalist capital. The belief was the input; the economic behavior was the output.
  *   **Putnam (Italian Civics):** **PASSES.** The medieval civic traditions existed centuries before the modern regional governments. Path dependence is a valid form of exogeneity.
  *   **American Tipping:** **PASSES.** The social norm ("you should tip 20%") exists in your head before you get the bill. It constrains your behavior independently of the specific transaction.
  *   **Honor Culture (New Case 2):** **PASSES.** This is like the Weber case. Norms about reputation and retaliation exist *before* the specific violent encounter. They dictate the response to an insult. It is not circular to say "he shot him because of honor culture," provided you can define the honor code independently of the shooting itself.

  **2. The "Bogus" Pile (Confirmed)**
  *   **Emigration Culture:** **FAILS.** This is pure tautology. The "culture" is just the aggregate of the emigration decisions. There is no independent variable.
  *   **2008 Financial Crisis (Greed/Risk):** **FAILS.** "Greed" in this context is just a moralistic label for "taking risky bets that failed." It describes the outcome, it doesn't explain the mechanism independent of the outcome.
  *   **Culture of Poverty:** **FAILS.** This is the critical one. Your gut was right to reject it, but your reasoning was moral, not causal. Causally, it fails the Exogeneity Constraint. Fatalism and short-term planning are rational *adaptations* to precarious economic environments. The poverty causes the "culture," not the other way around. If you remove the structural poverty, the "culture" vanishes. Therefore, it cannot be the *cause* of the poverty.
  *   **Quebec Business Practices:** **FAILS (Mostly).** You sensed this was "shakier." It likely fails because Catholic social norms and local business practices *co-evolved*. It is hard to disentangle which caused which. Unless you can find a specific Catholic doctrine that *predates* the business practice and dictates it, it's likely a correlation, not a cause.

  **3. The "Troubled" Pile (The Hard Truth)**
  *   **Confucian Work Ethic:** **FAILS.** I know you don't want to give this up, but you must. This fails the **Independent Variation** test (a subset of Exogeneity). If "Confucianism" is a constant variable, it cannot explain a change in outcome (from stagnation in 1900 to growth in 1990).
      *   *Why your friend is right here:* When the culture is held constant but the prediction flips (Stagnation vs. Growth), the culture isn't the driver. The driver was likely changes in global trade, state policy, or technology. The "Confucian Ethic" is a *post-hoc rationalization* used to make sense of the outcome after it happened.
      *   *Verdict:* You should drop this as a primary causal explanation. It is a "Just-So Story." It feels legit because it identifies a real mechanism (discipline/hierarchy), but it fails the causal test because the mechanism was present during the failure period too.

  ---

  ### Application to Your New Cases

  **1. The Corporate Merger ("Culture Clash")**
  *   **Verdict:** **Usually Fails, Sometimes Passes.**
  *   **Why:** Most of the time, "culture clash" is a trash-can explanation management uses when integration fails for boring reasons (incompatible software, bad incentives, power struggles). In those cases, it fails the Exogeneity Constraint (the "clash" is just the label for the failure).
  *   **When it Passes:** It passes *only* if you can identify specific, pre-existing protocols that contradict each other. Example: Firm A requires all decisions be signed by a committee (safety norm); Firm B requires single-signature speed (agility norm). If these written norms existed *before* the merger and directly caused the slowdown, that is a valid cultural cause. If "culture" is just a vibe about "how we do things," it's usually bogus.

  **2. Honor Culture in the US South (Higher Violence)**
  *   **Verdict:** **Passes.**
  *   **Why:** This is distinct from the "Emigration Culture" trap. Researchers (like Nisbett and Cohen) have shown that Southern norms regarding reputation and insult response can be measured *independently* of actual violence rates (e.g., through surveys or experimental games). These norms predate specific violent acts. The culture acts as a filter: an insult occurs -> culture interprets it as a threat -> violence ensues. In a non-honor culture, the same insult -> no violence. Because the cultural variable changes the *response* to the stimulus, it is exogenous and causal.

  ### Summary of What You Must Drop

  You asked me to be upfront. Here is the cost of adopting the **Exogeneity Constraint**:

  1.  **You must downgrade the Confucian Growth explanation.** It is intellectually inconsistent to accept it while acknowledging the 19th-century stagnation argument used the exact same cultural variables. You can keep "culture" as a *moderating* factor (it shaped *how* they grew), but not as the *cause* of the growth itself.
  2.  **You must accept the "Culture of Poverty" rejection is causal, not just moral.** It feels like victim-blaming because it gets the arrow of time backward. It blames the victim for the survival strategies the victim was forced to adopt.
  3.  **You must admit the Quebec case is weak.** Unless you have specific doctrinal evidence, it's likely co-evolution.

  **The Takeaway:** Your friend was right about the mechanism, but you were right about the intuition. The bridge between you is **directionality**. Culture causes behavior when it acts as a pre-existing lens. Culture *doesn't* cause behavior when it is just the name we give to the pattern of behavior itself.
