              *   *Misrepresentation:* Hallucination or Reward Hacking.
              *   *Explanation:* The policy optimizes for the *training distribution's* reward signal. If it outputs nonsense that tricks the RM, it's a "BB snap."
              *   *Why is it error?* Because the training process selected weights based on *human intent* (Flies), not *RM score maximization* (BBs), assuming the RM is a proxy.
              *   *Fudge:* In RL, "error" is usually just "high loss" or "low reward." Teleosemantics requires a normative claim about what *should* have been tracked. RL has this via the *design intent* of the loss function, but the optimizer doesn't care.

      *   **Swampman:**
          *   *Philosophy:* A molecule-for-molecule duplicate of a human created by lightning in a swamp. No evolutionary history. Does it have mental content? Teleosemantics (Millikan) says **No**. It behaves the same but means nothing.
          *   *RL Mapping:*
