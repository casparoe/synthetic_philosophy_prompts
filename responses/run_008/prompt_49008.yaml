          *   *Content vs. Interpretability:* RL treats "goals" as instrumental. Teleosemantics asks if the goals are *real*.
      *   *The Gap:* The "Hard Problem" of Semantics. Does the model *mean* "dog" or does it just process tokens that correlate with "dog"? Teleosemantics tries to solve this with history. RL ignores it because it works without it.
      *   *Advice:* Don't use "content" as a metaphysical claim. Use it as a shorthand for "robust causal link established during training." But beware of Swampman cases (e.g., synthetic data training) where the link to reality is broken.

