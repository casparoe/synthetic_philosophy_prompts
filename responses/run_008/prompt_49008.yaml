  *(Self-Correction Note on Swampman)*: Wait, if I copy weights, the *copy* didn't undergo selection. The *original* did. Millikan would say the copy's states have content *derivatively* because they are tokens of a type that has a history. But a true Swampman (lightning strike) has no history. In RL, a "Swampman" is a model that converges to the same loss minimum via a different data distribution or random seed. Does it have the same content? Teleosemantics says maybe not if the *selectors* were different. This is a rich vein to mine.

