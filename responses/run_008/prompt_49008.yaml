              *   *Teleosemantic Verdict:* If copied *after* training, it inherits the history of the original training run. If initialized *de novo* with same weights (impossible practically, but theoretically), it has no history.
              *   *The Twist:* What if we distill a model? Or train a student on a teacher's outputs (no ground truth)?
