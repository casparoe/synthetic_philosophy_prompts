  2.  **Deconstruct Teleosemantic Concepts & Map to RL:**

      *   **Millikan's Proper Functions (Producer/Consumer):**
          *   *Philosophy:* A trait has a proper function if it was selected for doing $X$. Content arises from the relationship between a producer (mechanism creating the state) and a consumer (mechanism using the state) where the consumer relies on the producer to track truth/utility for survival/reproduction.
          *   *RL Mapping:*
              *   *Selection History:* The training run (gradient descent + data distribution).
              *   *Producer:* The policy network (or specific neurons/heads) generating an action/token.
              *   *Consumer:* The environment/reward model that "consumes" the action to generate a signal.
              *   *Proper Function:* The objective function minimized during training (e.g., KL-divergence + Reward).
              *   *Nuance:* In RLHF, the Reward Model (RM) acts as the "consumer" during training, but the *true* consumer is the human preference distribution the RM approximates.
              *   *Fudge:* Evolution is blind; RL training is directed. Evolution selects *traits*; RL selects *weights*.

      *   **Dretske's Indicator Semantics:**
          *   *Philosophy:* A state represents $X$ if it was recruited to carry information about $X$ (reliable indicator) and then used to control behavior. Content is fixed during the "recruitment" phase.
          *   *RL Mapping:*
              *   *Recruitment:* The phase in training where a specific feature/latent becomes correlated with a specific concept in the data distribution to minimize loss.
              *   *Indicator:* A latent representation $z$ that reliably predicts reward $R$ given state $s$.
              *   *Content:* "This latent means 'dog'" $\rightarrow$ "This latent was optimized to activate on dog images to reduce classification loss."
              *   *Fudge:* Dretske emphasizes *information* (covariance), RL emphasizes *optimization* (gradient descent). A feature can be useful without being a reliable indicator (e.g., heuristic shortcuts).

      *   **The Disjunction Problem / Misrepresentation:**
          *   *Philosophy:* How can a frog represent "fly" if it snaps at BBs? If it snaps at (Fly OR BB), where does the error come from? Teleosemantics says: It represents "fly" because *flies* were the historical selectors, not BBs. Snapping at BBs is a mistake.
          *   *RL Mapping:*
