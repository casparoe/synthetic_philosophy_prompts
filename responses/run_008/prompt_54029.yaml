  # Joint Statement on Moral Principles vs. Context (Adversarial Collaboration)

  **Participants:** Priya (Particularist), Dan (Generalist)  
  **Facilitator:** [Your Name]  
  **Date:** October 26, 2023  

  ## 1. Agreed Claims
  *Both parties sign off on the following statements. These are the constraints within which we argue.*

  1.  **Morality is not random:** There are stable patterns in how we judge right and wrong; it is not merely subjective preference.
  2.  **Defaults exist:** "Do not lie" is a strong default position. In the vast majority of cases, lying is wrong.
  3.  **Context matters:** There are specific situations (like the dinner lie) where following the default rule causes harm and breaking it prevents harm.
  4.  **Accountability is required:** Moral agents must be able to explain their reasoning to others; "because I felt like it" is not an acceptable justification.
  5.  **Goals align:** We both want a moral framework that helps people act better, not just one that wins arguments.

  ## 2. The Core Disagreement
  *We disagree on the underlying architecture of morality. Below are the specific points of contention, phrased so each side accepts their own description.*

  | Topic | Priya's Position (Particularist) | Dan's Position (Generalist) |
  | :--- | :--- | :--- |
  | **The Nature of Reasons** | A feature (like lying) can change its moral valence based on context. In some cases, lying is not just "acceptable" but morally *positive*. | A feature (like lying) has a default negative valence. It can be overridden by stronger principles (like kindness), but it remains a moral cost. |
  | **Codifiability** | No finite set of rules can capture all moral exceptions. Trying to write them all results in a rule so complex it stops being a rule. | Morality relies on principles that are defeasible (overrideable). We can theoretically codify these with exception clauses, even if complex. |
  | **Moral Learning** | Children learn morality by developing sensitivity to context and nuance, not by memorizing rigid rules. | Children learn morality by internalizing rules ("don't hit") and later learning the specific exceptions ("unless in self-defense"). |

  ## 3. The Cruxes (Test Cases & Pre-Registered Predictions)
  *To move forward, we identified specific questions where settling the answer would shift one of our positions. We agree to judge these cases based on the predictions below.*

  ### Crux 1: Valence Reversal (The Dinner Lie)
  *Does the lie contribute positive moral value, or is it a negative value outweighed by kindness?*
  *   **Test Case:** The original dinner scenario. A friend lies about enjoying bad cooking to spare the host's feelings.
  *   **Priya's Prediction:** The lie is a **moral positive**. The feature "lying" itself functions as a reason *for* the action in this context.
  *   **Dan's Prediction:** The lie is a **moral negative** (a cost) that is outweighed by the moral positive of "kindness." The net action is right, but the lie remains a defect.

  ### Crux 2: The Novel Case (AI Deepfakes)
  *How do we judge a morally new scenario where no specific rule exists yet?*
  *   **Test Case:** A user creates a realistic AI deepfake of a celebrity endorsing a charity they don't support, intending to raise money for a good cause.
  *   **Priya's Prediction:** We will judge this by analogy to similar contexts (deception vs. benefit) without needing a new "AI Principle." The context determines the verdict directly.
  *   **Dan's Prediction:** We will judge this by extending existing principles (e.g., "Do not deceive," "Promote welfare") and weighing them. We will explicitly formulate a new rule for AI deception afterward.

  ### Crux 3: The Complexity Limit (The "God Rule")
  *At what point does a rule become useless?*
  *   **Test Case:** Dan attempts to write a single principle that covers the Dinner Lie, the AI Deepfake, and standard lying.
  *   **Priya's Prediction:** To cover all cases, Dan's rule will require so many exception clauses ("unless... except when... provided that...") that it becomes a description of past events rather than a guide for future action.
  *   **Dan's Prediction:** The rule will be complex, but it will still compress information better than listing every case individually. It will remain a functional guide.

  ## 4. Verbal Dispute Note
  *We identified one area where we might be arguing about definitions rather than reality.*

  **The Definition of "Principle":**
  *   **Priya** uses "Principle" to mean an invariant truth (like a law of physics) that never breaks.
  *   **Dan** uses "Principle" to include defeasible defaults (like heuristics in code) that usually hold but can be overridden.
  *   **Resolution:** We acknowledge that if Dan admits his principles are just "highly reliable heuristics," the gap narrows. If Priya admits there are stable patterns even if not "laws," the gap narrows. We will treat "Principle" as "Default Rule with Exceptions" for the rest of this collaboration.

  ## 5. Adjudication (External Judgment)
  *Requested by the group chat moderator. This is an outside view based on the above.*

  **Who is closer to right?**
  Both are partially right, but **Dan is practically right, while Priya is theoretically right.**

  *   **Why Dan wins on practice:** Human societies function on generalizations. We need "Do not lie" as a default rule to coordinate behavior, raise children, and write laws. If we operated on pure particularism, every interaction would require recalculating morality from scratch, which is computationally expensive for human brains.
  *   **Why Priya wins on theory:** Dan's rules always require exception handlers. As edge cases accumulate (like the dinner lie), the "rule" becomes so laden with `if/else` statements that it looks more like Priya's context-sensitivity anyway. Moral reasons *do* behave holistically (a feature can be good in one context, bad in another).

  **Verdict:** Adopt Dan's architecture for daily life (use rules as defaults), but use Priya's debugger for edge cases (when rules conflict or cause harm, inspect the context).

