prompt: |-
  Quick background so this makes sense: I write backend code for a living, my last real exposure to philosophy was falling asleep through half of a college elective, and I'm stuck in a group chat with two friends who've been arguing for over a year about whether morality runs on rules. Priya is what I gather is called a particularist — she thinks right and wrong gets judged case by case and no moral principle survives every context; a feature of a situation (say, lying) can count against an action in one case and for it, or not at all, in another. Dan is a generalist — he thinks moral judgment only works because we carry principles around, even if they're defeasible ones with default weights, and that without principles we couldn't learn morality as kids, argue with each other as adults, or trust ourselves on a genuinely new case. They go in circles: whenever Priya produces an example where the rule breaks, Dan says that's just an exception clause waiting to be written, and whenever Dan writes the fancier rule with the exception clause, Priya says a rule with that many carve-outs isn't doing any work anymore. Their most recent deadlock, and the thing that finally made me write this: at a dinner, a friend flatly lied to a third person to spare her feelings about her cooking, Priya called it fine-in-context, and Dan said that if "don't lie" doesn't apply there then it applies nowhere.

  What I want is the joint statement the two of them should have produced if they'd done this properly, like those adversarial-collaboration writeups I've heard about. It should contain (a) the claims both could actually sign; (b) exactly where they still disagree, with the wording for each side phrased so that that side itself would accept it, not a version slanted toward the other; (c) the cruxes — the specific sub-questions such that settling one would move at least one of them — and for each crux, a concrete case or argument they'd both agree bears on it, plus each of their predictions about that case written down in advance so nobody can retro-fit later. Use the dinner lie as one of the test cases, and feel free to invent one or two more. If any part of their fight turns out to be verbal — like whether a rule with exception clauses even counts as a "principle" anymore — say which part and why. I'd honestly also take a judgment on who, if anyone, is closer to right, as long as it's earned.

  Then, after the statement itself, give me a short structured summary as a single JSON object with this schema: "agreed_claims" (array of strings), "disagreements" (array of objects with the fields "topic", "priya_wording", "dan_wording"), "cruxes" (array of objects with the fields "crux", "test_case", "priya_prediction", "dan_prediction"), and "verbal_parts" (a string, empty string if none). Keep the whole thing readable enough that I could paste it straight into the chat without a glossary — I deal with pedants at work all day, I don't need more at home.
