      *   *Journalistic Angle:* Why does this matter? Allais says "You're bad at calculating." Ellsberg says "You're right to be suspicious of unknowns." This is a huge distinction for a feature on intuition. Sometimes intuition is signaling a lack of information, not a calculation error.

