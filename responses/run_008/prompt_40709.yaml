answer: |-
  Elias is halfway through renovating a remote cabin he intends to keep forever, having spent $40,000 and four months of labor stripping and reinforcing the structure. A geological survey now confirms the land is stable, so no new risks have emerged, and since he never plans to sell or host guests, there is no reputational benefit to finishing. The remaining work costs $20,000 and two months, while the utility of living in the finished cabin exceeds the shell by only a narrow margin that fails to cover the remaining expense, making the marginal net gain negative. Orthodox economics suggests abandoning the project since the past investment is unrecoverable and the future benefit does not justify the future cost. Yet, Elias treats his past and present selves as partners in a single enterprise; abandoning the project renders the past labor objectively futile, whereas finishing retroactively validates that labor as productive, maximizing the total utility of his life trajectory by ensuring his temporal parts cooperate to produce a coherent outcome rather than fragmented waste.

  ***

  **Orthodox Time-Slice View**
  The orthodox view, grounded in Causal Decision Theory (CDT) and standard microeconomics, treats the agent as a sequence of distinct time-slices, each responsible only for maximizing utility from the present moment forward. From this perspective, the $40,000 and four months already spent are gone regardless of the choice; they are sunk costs. Rationality dictates comparing only the marginal cost of finishing ($20,000 + 2 months) against the marginal benefit (the narrow utility increase of the finished cabin). Since the scenario stipulates the marginal net gain is negative, the orthodox verdict is to abandon the project immediately. To do otherwise is to throw good money after bad, allowing past irrecoverable losses to dictate future resource allocation.

  **Whole-Life / Functional Decision Theory View**
  A whole-life or Functional Decision Theory (FDT) view models the agent not as a series of strangers, but as a single temporally extended entity running a consistent decision algorithm. Rationality here is about maximizing the utility of the entire life trajectory, ex-ante. If the agent's algorithm outputs "abandon when marginal costs rise," then the past self's decision to start was based on a false prediction of the agent's future behavior, rendering the initial investment a strategic error. By honoring the sunk cost, the current time slice cooperates with the past slice, validating the original strategy. This cooperation creates a form of retroactive utility: the past effort is transformed from "waste" into "investment" solely through the completion of the plan. The rationality comes from maintaining the logical correlation between the decision to start and the decision to finish, ensuring the whole life yields a coherent, high-utility narrative rather than a fragmented loss.

  **Structural Feature and Removal**
  The structural feature doing the work is the **logical correlation between temporal decisions** within a single agent's identity. The case relies on the premise that the value of the past effort is contingent on the future action of the same agent. If you remove this feature—for example, if the cabin were being renovated by a contractor who would be replaced upon quitting, or if Elias viewed his past self as a stranger whose mistakes he need not correct—the logical link breaks. Without the identity continuity that allows present action to retroactively confer value on past effort, the verdict reverts to the orthodox one: abandon, because the future costs outweigh the future benefits.

  **Time-Slice Defender's Attack**
  A defender of time-slice rationality would argue that "retroactive validation" is a psychological illusion, not a genuine utility gain. They would claim that resources are finite and forward-looking; spending $20,000 to feel better about a lost $40,000 is still a net loss of $20,000. They would assert that the "coherence of the life trajectory" is merely an aesthetic preference that should be weighed against material welfare, and if the material welfare is negative (as stipulated), prioritizing narrative coherence is irrational indulgence. They would insist that the past self's sacrifice is *already* sunk and cannot be saved, only compounded.

  **The Gambling Condition**
  The case **does not survive** if the past self made the original decision knowing full well it might not pan out. If the past self treated the renovation as a gamble—calculating expected value based on a probability of completion and a probability of abandonment—then the rational decision algorithm included a contingency to quit if conditions worsened. In that scenario, quitting is not a betrayal of the past self, but the execution of the original plan's risk management. Honoring the sunk cost would only be rational under the whole-life view if the past self made a **categorical commitment** (a confident plan to finish regardless of intermediate costs). If the original decision was probabilistic, the logical correlation required by FDT dictates that the current self should honor the *condition* of the plan (quit if marginal utility turns negative), not the expenditure itself. Therefore, sunk cost honoring is only rational here if the past self was confidently committing to a plan rather than gambling.
