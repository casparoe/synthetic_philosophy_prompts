          *   *Distorted:* "Separateness of persons." SCT treats persons as distinct but aggregable. Nozick treats them as distinct and *non-aggregable* for certain trade-offs.
          *   *Inexpressible:* Deontological constraints. SCT is consequentialist. A right in SCT is usually a guarantee of a specific outcome or a constraint on the feasible set. Nozick's right is a constraint on the *maximization process*.

