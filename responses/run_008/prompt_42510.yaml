answer: |-
  Here is the translation of Nozick's Utility Monster into the formal vocabulary of social choice theory (SCT), followed by the residue report you requested.

  ### 1. The Utility Monster in Social Choice Terms

  Let $N$ be the set of individuals, $X$ the set of social states, and $U_i: X \to \mathbb{R}$ the utility function for individual $i \in N$.
  Standard Utilitarianism employs a Social Welfare Function (SWF) $W(U_1, \dots, U_n) = \sum_{i \in N} U_i(x)$, defined over a domain of utility profiles allowing for **Cardinal Unit Comparability**.

  **The Monster:**
  The "Utility Monster" is not a failure of anonymity (the SWF treats all indices $i$ symmetrically) nor a failure of separability in the standard sense. Rather, the Monster is a specific utility profile $\mathbf{U} \in \text{Domain}(W)$ such that for a specific agent $k \in N$ and any resource allocation $x$:
  $$ \frac{\partial U_k}{\partial x} \gg \frac{\partial U_j}{\partial x} \quad \forall j \neq k $$
  Or, more strongly, $U_k(x) > \sum_{j \neq k} U_j(x)$ for all $x$ where $k$ receives the resources.

  **The Objection:**
  Under the Utilitarian SWF, the social optimum $x^*$ is a corner solution where all resources are assigned to $k$. Nozick's objection is that $x^*$ is normatively impermissible, despite being the unique maximizer of $W$.

  **Classification:**
  In SCT terms, the Monster demonstrates that under **Unrestricted Domain** of utility functions, a Sum-Ranking SWF violates strong **Equity Axioms** (e.g., Hammond Equity or the Pigou-Dalton Transfer Principle).
  However, Nozick's complaint is deeper than standard inequality aversion. It is best modeled as a violation of **Separateness of Persons**. In SCT, persons are distinct indices, but the SWF treats the utility space as a single manifold over which optimization occurs. The Monster shows that if the metric of "goodness" is additive across persons, one person's utility intensity can morally swamp the existence of others.

  It is **not** an Arrovian Dictator. An Arrovian dictator determines the social ordering based on their *ordinal* preferences regardless of others. The Monster determines the outcome based on *cardinal intensity*. It is a "Cardinal Dictatorship" permitted by the informational basis of Utilitarianism.

  ### 2. The Residue Report

  You asked which parts of Nozick's complaint translate into SWF conditions, which are distorted, and which have no expression.

  #### A. Translatable (The "Internal" Critique)
  These elements can be modeled within SCT by adjusting axioms or the informational base.
  *   **Equity Constraints:** Nozick's intuition that the Monster outcome is wrong translates directly into imposing equity constraints on the SWF (e.g., requiring $W$ to be strictly concave, or using a Rawlsian MaxMin function). Sen's work on informational bases shows that if we restrict the domain of admissible utility functions (e.g., assuming diminishing marginal utility), the Monster disappears.
  *   **Rights as Constraints (Gibbard/Sen):** SCT has a literature on rights (e.g., Gibbard's liberal paradox). Here, rights are modeled as **constraints on the feasible set** $S \subseteq X$. If agent $j$ has a right to a specific bundle, that bundle is the only feasible option, regardless of $W$.
  *   **Lexicographic Ordering:** You can model rights as lexicographic priorities. $W$ is only consulted if rights constraints are satisfied. This captures the "trumping" power of rights.

  #### B. Distorted (The "Forced" Translation)
  These elements fit into the formalism but lose their moral texture.
  *   **Separateness of Persons:** In SCT, persons are distinct inputs ($U_1, \dots, U_n$). But the *operation* of aggregation ($\sum$) presumes a "social mind" for which individual utilities are merely components. Nozick's claim is that there *is no* social mind to experience the sum. Translating this into SCT requires treating the aggregation operation itself as suspicious, which SCT is designed to perform. You can model "non-aggregation" (e.g., Pareto only), but you cannot model the *reason* (the metaphysical distinctness of persons) within the math.
  *   **Historical Entitlements:** SCT is inherently **Consequentialist**; it evaluates states $x \in X$. Nozick is a **Historical Entitlement** theorist; he evaluates the *process* by which $x$ was reached. To model this in SCT, you must expand the description of a "state" to include its history (path-dependence). This is technically possible but violates the standard assumption that $X$ consists of snapshot outcomes.

  #### C. Inexpressible (The "Null" Set)
  These elements have no expression in standard welfare economics.
  *   **Side-Constraints vs. Goals:** This is the core residue. In SCT, a constraint is a boundary on the **feasible set** $S$. A goal is the **objective function** $W$. Nozick argues that rights are not goals to be minimized (i.e., "minimize rights violations") nor constraints on physical feasibility, but **moral constraints on the maximization process itself**.
      *   *Example:* In SCT, if violating a right saves a million lives, a constrained optimization might still allow it if the constraint is not absolute. For Nozick, the constraint is absolute.
      *   *The Gap:* SCT asks, "What is the best state?" Nozick asks, "What actions are permissible?" SCT assumes the set of permissible actions is defined by feasibility. Nozick says morality restricts permissible actions *independently* of feasibility and *independently* of the goodness of the resulting state.
  *   **The Rejection of Teleology:** Nozick objects to *any* end-state principle (including Rawlsian MaxMin) if it requires sacrificing an individual for the pattern. SCT is the study of end-state principles. To fully express Nozick, you must abandon the search for an SWF entirely.

  ### 3. Aggregation and the Framework

  Your suspicion is correct: **Nozick is complaining about aggregation itself.**

  He is arguing that individual utilities are not fungible commodities that can be pooled into a social total. In your vocabulary, he is rejecting **Welfarism** (the claim that the goodness of a state is determined exclusively by the utility vector) and **Consequentialism** (the claim that the rightness of an action is determined exclusively by the goodness of the state).

  **Can this be said within your vocabulary?**
  Only negatively. You can say: "There exists no SWF $W$ that satisfies Nozick's constraints."
  Sen's **Liberal Paradox** is the closest analogue. Sen showed that Minimal Liberalism (two people each decisive over one pair) is incompatible with the Pareto Principle. This is an impossibility result within SCT.
  However, Sen treats this as a tragedy to be managed (by changing the informational base or game form). Nozick treats it as a proof that the SWF approach is the error.
  *   **Sen:** "How do we adjust the SWF to respect rights?"
  *   **Nozick:** "Do not use an SWF to adjudicate rights."

  Therefore, the residue cannot be fully expressed in SCT vocabulary because SCT presupposes the validity of the aggregation problem that Nozick denies. SCT assumes there is a "Social Choice" to be made. Nozick argues that for certain domains (rights), there is no social choice, only individual choices bounded by negative constraints.

  ### 4. Conclusion: Limitation of Framework or Nozick's Precision?

  **The residue reflects a limitation of the Welfare Economics framework, not a lack of precision in Nozick.**

  Nozick's Utility Monster is not intended as a formal proof but as an *intuition pump* designed to expose the normative implications of the informational basis of Utilitarianism. It is precise in its target: the assumption that interpersonal aggregation is morally permissible.

  Welfare economics is a **teleological framework**. It is designed to rank states of affairs. Nozick's philosophy is **deontological**. It is designed to constrain actions.
  *   If you try to model Nozick in SCT, you turn rights into "super-utilities" (lexicographic weights) or "feasibility constraints."
  *   Nozick would argue this distorts the concept. A right is not a high-utility interest; it is a boundary that utility calculations cannot cross.

  **Verdict:**
  The "residue" is the boundary between Consequentialism and Deontology.
  1.  **Framework Limitation:** SCT lacks the vocabulary for "forbidden" distinct from "sub-optimal." In SCT, everything is rankable. For Nozick, rights violations are not low-ranked; they are off-limits.
  2.  **Nozick's Precision:** Nozick is precise about the *structure* of moral theory (side-constraints vs. goals). The Monster is a rough illustration, but the underlying logical point—that aggregation violates separateness—is rigorous.

  **Summary for the Economist:**
  The Utility Monster shows that under **Cardinal Unit Comparability** and **Sum-Ranking**, the SWF is vulnerable to a "Cardinal Dictator." Nozick's solution is not to fix the SWF (e.g., by changing weights), but to reject the SWF as the appropriate tool for rights-based claims. The residue is the realization that **Social Choice Theory assumes the legitimacy of social optimization**, whereas Nozick denies that legitimacy for a specific class of interpersonal conflicts. You cannot model the rejection of optimization using an optimization framework without distortion.
