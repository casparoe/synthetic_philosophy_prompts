      *   *Nozick's Original:* A being who gains vastly more utility from resources than anyone else. Utilitarianism says we should feed the monster everything, starving everyone else, because total utility is maximized. Nozick finds this intuitively repugnant. It violates separateness of persons.
      *   *Welfare Econ Translation:*
          *   Utilitarianism = Sum-ranking SWF ($W = \sum U_i$).
          *   Monster = An agent $k$ such that $\frac{\partial U_k}{\partial x} \gg \frac{\partial U_j}{\partial x}$ for all $j \neq k$, or simply $U_k(x) \gg U_j(x)$ for any allocation $x$.
          *   The outcome = Corner solution where $x_k = \text{total endowment}$, $x_j = 0$.
          *   The Objection = This allocation is socially unacceptable despite maximizing $W$.

  3.  **Address Question 1: What is the monster in social-choice terms?**
      *   *Option A: Dominating agent.* Yes, effectively a dictator in the Arrovian sense, but based on intensity, not just ordinal ranking.
      *   *Option B: Failure of separability/anonymity.* Anonymity holds (the function doesn't care *who* is the monster, just that someone is). Separability (in the sense of independence of irrelevant alternatives or separability of subgroups) isn't the main issue.
      *   *Option C: End-state insensitivity.* This is closer. Utilitarianism is an "end-state" principle (in Nozick's terms). It looks only at the vector of utilities, not the history or entitlements.
      *   *Best Translation:* It highlights the implications of *cardinal full comparability* combined with *sum-ranking*. It shows that under unrestricted domain of utility functions, a sum-ranking SWF allows one individual's marginal utility to swamp others. It's a critique of the *weighting* implicit in summation.

  4.  **Address Question 2: The Residue Report:**
      *   *Translatable parts:*
