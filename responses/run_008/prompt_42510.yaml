prompt: |-
  I'm a welfare economist by training: fluent in social choice theory, social welfare functions, interpersonal utility comparisons, and Sen's liberal paradox; I read Nozick's Anarchy, State, and Utopia once, but the moral philosophy vocabulary isn't at my fingertips. Restate his utility monster objection to utilitarianism in my vocabulary, as faithfully as the translation allows. In particular, what is the monster in social-choice terms — an agent whose utility function simply dominates an aggregative social welfare function, a failure of some separability or anonymity condition when utility scales are unrestricted, or a dramatization of the fact that end-state principles are insensitive to how good is distributed across persons? Then give me the residue report: which parts of Nozick's complaint translate into conditions on a social welfare function or into impossibility results (Sen's minimal liberalism looks like the closest analogue), which have to be forced in with distortion, and which have no expression at all in the framework. My working suspicion is that the residue is the point — that Nozick is complaining about aggregation itself, about rights as constraints on what may be done rather than as inputs to an objective function — but I want to know whether that can be said within my vocabulary or whether it requires resources social choice theory simply lacks. Conclude by telling me whether the residue reflects a limitation of my framework or a sign that Nozick's original presentation was less precise than the monster makes it look.
