          *   Sen's work on "Informational Bases" is relevant. Utilitarianism uses $\bar{U}$ (cardinal, unit comparable). The monster shows the normative cost of that specific informational base.
          *   Sen's Liberal Paradox is an analogue: Individual rights (local decisiveness) clash with Pareto/Social Welfare. Nozick's rights are stronger (side-constraints).
      *   *Distorted parts:*
          *   "Separateness of Persons." In SCT, persons are distinct indices $i \in N$. But the SWF aggregates them. Nozick says they *cannot* be aggregated for certain purposes. SCT assumes aggregation is the goal.
          *   "Entitlements/History." SCT is mostly consequentialist (evaluating states $x$). Nozick is historical/entitlement-based. SCT struggles to model "how we got here" unless path-dependence is explicitly built in (which is rare in standard SWF).
      *   *No expression:*
          *   "Side-constraints." In SCT, constraints are usually on the *feasible set* $S$. Nozick means constraints on the *objective function* itself (you can't maximize $W$ if it violates rights, even if $W$ is higher). This is lexicographic priority, which can be modeled, but Nozick means moral prohibitions, not just lexicographic ordering.

