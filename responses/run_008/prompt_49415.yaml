answer: |-
  # Desiderata for a Unified Theory of Intelligence

  To support a single account of intelligence spanning humans, non-human animals, and artificial systems, the theory must satisfy specific explanatory, conceptual, and constraint-based criteria. Below are the desiderata classified by their necessity, followed by an analysis of internal tensions and the most exclusionary requirement.

  ## I. Explananda (Phenomena to Explain)

  An adequate theory must provide a causal mechanism for the following empirical regularities, rather than merely describing them.

  1.  **The Positive Manifold (Non-Circular):** The theory must explain why performance across diverse cognitive tasks tends to correlate (the emergence of *g* or a general factor) without defining intelligence *as* that correlation. It must identify the underlying resource, architectural constraint, or algorithmic property that generates this covariance.
  2.  **Fluid Generalization (Novelty):** The theory must account for performance on genuinely novel tasks that cannot be solved by retrieval of crystallized knowledge or direct training. It must distinguish between optimization within a distribution and adaptation to out-of-distribution problems.
  3.  **Secular Plasticity (The Flynn Effect):** The theory must accommodate systematic, population-level shifts in performance over time due to environmental complexity, without treating intelligence as a fixed hardware constant. It must explain how the same underlying capacity yields different scores under different environmental conditions.
  4.  **Efficiency-Complexity Trade-off:** The theory must explain why higher intelligence is not universally selected for (in animals) or implemented (in AI), accounting for metabolic, computational, or opportunity costs.

  ## II. Conceptual Distinctions

  The theory must maintain strict conceptual boundaries between the following constructs to avoid category errors.

  1.  **Intelligence vs. Learning Speed:** The theory must distinguish the *depth* or *complexity* of the functions an agent can learn from the *rate* at which they are acquired. A system may learn slowly but generalize broadly, or learn rapidly but overfit.
  2.  **Latent Capacity vs. Observed Performance:** The theory must separate the agent's internal capability from the behavioral output. Performance is a function of capacity plus noise, motivation, sensory acuity, and motor control. A theory that conflates low performance (due to sensory limits) with low intelligence is inadequate.
  3.  **Capacity vs. Exercise:** The theory must distinguish between having a capability and utilizing it. An agent may possess high capacity but operate in an environment that does not demand its exercise (the "idle engine" problem).
  4.  **Domain-General vs. Domain-Specific:** The theory must specify the boundary conditions of the intelligence. It must clarify whether the mechanism is a general-purpose solver or a collection of specialized modules that *appear* general due to task overlap.

  ## III. Constraints from Adjacent Fields

  The theory cannot contradict established findings in connected disciplines.

  1.  **Neuroscience & Biology:** The mechanism must be physically plausible for biological substrates (e.g., cannot require bandwidth exceeding axonal transmission speeds; must respect metabolic constraints).
  2.  **Computer Science:** The mechanism must be computable. It cannot rely on oracle functions or non-Turing-computable processes unless a physical basis for hypercomputation is provided.
  3.  **Evolutionary Theory:** The construct must map to fitness advantages in a way that explains convergent evolution (e.g., why corvids and primates share certain cognitive traits despite divergent phylogeny).
  4.  **Measurement Theory:** The theory must acknowledge the uncertainty inherent in latent variable estimation. It cannot claim precision that exceeds the reliability of the behavioral proxies.

  ## IV. Classification of Requirements

  The following classification distinguishes between requirements necessary for *any* scientifically robust theory (Non-Negotiable) and those that depend on specific theoretical commitments (Camp Preference). Note that for your specific goal (a unified account across three populations), some "Camp Preferences" in the broader field become "Non-Negotiable" for your project.

  | Requirement | Classification | Rationale |
  | :--- | :--- | :--- |
  | **Non-Circular Mechanism** | **Non-Negotiable** | Defining intelligence as "what tests measure" is tautological. A causal theory requires a mechanism distinct from the measurement. |
  | **Capacity/Performance Distinction** | **Non-Negotiable** | Conflating ability with output renders the theory unable to account for disability, sensory loss, or lack of motivation. |
  | **Computational Plausibility** | **Non-Negotiable** | A theory requiring impossible computation is scientifically invalid regardless of its predictive power. |
  | **Cross-Substrate Comparability** | **Camp Preference** (Field) / **Non-Negotiable** (Your Project) | Many researchers argue intelligence is species-specific or substrate-dependent. However, your unified account *requires* this. |
  | **Scalar Output (Single Quantity)** | **Camp Preference** | Some camps (e.g., *g* theorists) demand a single number; others (e.g., Multiple Intelligences, profile analysis) demand a vector. A unified theory could theoretically be multidimensional. |
  | **Domain-Generality** | **Camp Preference** | Modularists argue intelligence is a suite of specific adaptations. Generalists argue for a unitary power. A unified theory must take a stance, but both are viable scientific positions. |
  | **Flynn Effect Accommodation** | **Camp Preference** | Some theories treat intelligence as fixed hardware (hereditarian) and view the Flynn effect as testing artifact. Others view it as genuine capacity change. |
  | **Normative vs. Descriptive** | **Camp Preference** | Should the theory define "optimal" reasoning (rationality) or describe actual cognitive processing (psychology)? |

  ## V. Incompatible Desiderata (Tensions)

  You should anticipate that the following pairs of desiderata may be impossible to satisfy simultaneously within a single formalism.

  1.  **Scalar Construct vs. Ecological Validity:**
      *   *Tension:* To produce a single scalar comparable across humans, octopuses, and AI, you must abstract away from the specific sensory-motor loops of each. However, high abstraction reduces ecological validity (how well the measure predicts real-world survival or success for that specific agent).
      *   *Risk:* A metric precise enough to compare an LLM to a chimpanzee may be too abstract to predict either's behavior in their native environment.

  2.  **Substrate Neutrality vs. Biological Plausibility:**
      *   *Tension:* A theory truly neutral to substrate (silicon vs. carbon) often relies on computational abstractions (e.g., information processing rates) that ignore biological constraints (e.g., neurotransmitter diffusion, energy density). Conversely, a theory grounded in biological constraints may not apply to digital systems.
      *   *Risk:* You may end up with a "lowest common denominator" theory that captures neither the nuance of biology nor the speed of computation.

  3.  **Positive Manifold vs. Modularity:**
      *   *Tension:* Explaining the positive manifold usually requires a general resource (e.g., working memory, processing speed). Explaining domain-specific excellence (e.g., a savant, a specialized animal instinct) usually requires modularity.
      *   *Risk:* A theory that strongly predicts the positive manifold may fail to explain why agents can be highly intelligent in one domain and incompetent in another (dissociations).

  ## VI. The Exclusionary Requirement

  The single requirement that excludes the most popular current accounts is:

  **Substrate-Neutral Operationalizability**

  *   **Why:** This requirement demands that the *same construct* be measurable with *commensurable units* across biological neurons, cephalopod distributed nervous systems, and digital weights.
  *   **Who it excludes:**
      *   **Human Psychometrics (e.g., CHC, WAIS):** These rely on language, cultural knowledge, and human-specific sensory-motor responses. They cannot be administered to octopuses or AI without fundamental reconstruction.
      *   **AI Benchmarks (e.g., MMLU, Turing Test):** These are designed for text-based or task-specific digital agents and often rely on human knowledge bases that animals do not possess.
      *   **Animal Cognition Batteries (e.g., Detour Tasks, Tool Use):** These are ecologically tailored to specific species' niches and lack a metric that scales to human abstract reasoning or AI computational throughput.
  *   **Implication:** Adopting this requirement forces you to abandon existing measurement tools entirely and derive a new metric based on first principles (e.g., information integration, compression depth, or sample efficiency) rather than adapting existing tests. Most current research programs are invested in domain-specific metrics and cannot migrate to a substrate-neutral standard without invalidating their prior data.
