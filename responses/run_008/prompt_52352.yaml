prompt: |-
  After years in corporate fundraising I've unexpectedly joined the grant committee of a small family foundation that gives away roughly two million pounds a year across a scatter of causes, and the trustees have decided we can no longer just fund whoever has the best photos in their annual report. They've settled on the importance–tractability–neglectedness framework after reading about it somewhere, but nobody on the committee has any analytic training, and our last attempt collapsed into trustees awarding each cause a score out of ten for each factor and multiplying. Please write a decision procedure the committee could actually run in a two-hour meeting on each shortlisted proposal: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it must hand the decision back to the trustees because the question is one of values rather than facts. I'd like the procedure to grapple honestly with the places where the framework bends — the fact that a cause's neglectedness score shifts the moment we fund it, that tractability estimates usually come from the applicants themselves, and that importance refuses to aggregate when you're comparing small certain harms against large unlikely ones. Then run it on three actual dilemmas from our current docket: a research programme on lead exposure in low-income countries, a community literacy scheme in our home city whose importance is modest but whose outcomes we could measure almost perfectly, and a speculative early-career grant programme in pandemic preparedness that may achieve nothing visible for a decade. Include at least one case where the procedure yields an answer the trustees will hate, and say plainly what the procedure cannot settle.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User Persona:** Experienced corporate fundraiser, now on a small family foundation grant committee (£2m/year).
      *   **Context:** Trustees want to move from "best photos" to Effective Altruism-style ITN (Importance, Tractability, Neglectedness) framework.
      *   **Problem:** No analytic training, previous scoring attempt failed (multiplying scores out of 10 is mathematically nonsensical for ITN).
      *   **Task:** Write a practical decision procedure for a 2-hour meeting per proposal.
      *   **Requirements:**
          *   Ordered questions.
          *   Sufficient answers.
          *   Stop conditions (No).
          *   Hand-off points (Values vs. Facts).
          *   Grapple with ITN limitations (dynamic neglectedness, biased tractability, aggregation of importance).
          *   Run the procedure on three specific cases (Lead exposure, Local literacy, Pandemic prep).
          *   Include one outcome the trustees will hate.
          *   State plainly what the procedure cannot settle.

  2.  **Deconstruct the ITN Framework for Non-Experts:**
      *   *The Trap:* Multiplying scores (1-10) implies linearity and commensurability that doesn't exist. A "10" in neglectedness isn't the same unit as a "10" in importance.
      *   *The Fix:* Use ITN as a *filter* and a *comparative lens*, not a calculator. Focus on marginal impact (what does *our* £2m do?).
      *   *Time Limit:* 2 hours is tight. The procedure must be disciplined.

  3.  **Drafting the Decision Procedure:**
      *   *Phase 1: Preparation (Pre-meeting).* Can't do analysis *in* the meeting. Need a memo.
      *   *Phase 2: The Meeting Flow.*
          *   Step 1: Importance (Is the problem big enough to care about *if* solved?).
          *   Step 2: Neglectedness (Is anyone else doing this? Does *our* money matter?).
          *   Step 3: Tractability (Can *this* applicant solve it?).
          *   Step 4: The "Marginal Dollar" Check (The ITN synthesis).
          *   Step 5: Values Hand-off (Risk tolerance, geography, pride).
      *   *Addressing the "Bends":*
          *   *Neglectedness:* Focus on the *marginal* impact of the foundation's specific contribution, not the total field.
          *   *Tractability:* Require external verification or conservative estimates, not just applicant promises.
          *   *Importance:* Acknowledge the "small certain vs. large unlikely" tension explicitly in the Values Hand-off.

  4.  **Developing the Three Cases:**
      *   *Case A: Lead Exposure (Global Health/Development).* High importance, high neglectedness (often), high tractability (policy/tech).
      *   *Case B: Local Literacy (Community).* Low importance (globally), low neglectedness (many funders), high tractability/measurability.
      *   *Case C: Pandemic Prep (Existential Risk).* Extreme importance, variable neglectedness, low tractability/long time horizon.

  5.  **Running the Procedure (Simulation):**
      *   *Lead:* Likely a "Yes" on ITN grounds.
      *   *Literacy:* Likely a "No" on ITN grounds (crowded, small scale), *but* trustees love it (local, visible). This is the "answer they will hate."
      *   *Pandemic:* Likely a "Hand-off" (Values: Risk tolerance vs. immediate impact).

  6.  **Refining the "Hate" Aspect:**
      *   Trustees of family foundations usually care about legacy, local visibility, and tangible results.
      *   Telling them to stop funding the local literacy scheme (which they can visit) in favor of lead paint abatement in Lagos (which they can't see) is the classic EA vs. Community Philanthropy clash. I need to make sure the procedure forces this confrontation.

  7.  **Addressing the Limitations:**
      *   ITN doesn't tell you *how much* to value local community cohesion vs. global lives saved. That's a value judgment.
      *   ITN doesn't solve the "longtermism" discount rate problem.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, pragmatic, slightly skeptical of the framework but useful.
      *   *Structure:*
          1.  Introduction (Acknowledging the shift).
          2.  The Procedure (The "Two-Hour Protocol").
          3.  The Three Cases (Applied).
          4.  The "Hate" Outcome (Explicitly highlighted).
          5.  What Remains Unsettled (The philosophical limits).

      *(Self-Correction during drafting)*: I initially thought about suggesting a scoring system. *No*, the prompt says the scoring collapsed. I must avoid numeric scoring. Use "Gates" or "Thresholds" instead.
      *(Refining the Neglectedness point)*: Make sure to emphasize that *their* £2m might not shift the needle on a billion-pound problem, but it might on a million-pound one.
      *(Refining the Values Hand-off)*: Be clear that ITN is a tool for *efficiency*, not *morality*.

  9.  **Final Review against Constraints:**
      *   2-hour meeting limit? Yes, the steps are timed.
      *   Questions in order? Yes.
      *   Stop conditions? Yes.
      *   Values hand-off? Yes.
      *   Grapple with bends? Yes (included in the notes for each step).
      *   Three specific dilemmas? Yes.
      *   One hated answer? Yes (The Literacy one).
      *   What it can't settle? Yes.

  10. **Final Polish:** Ensure the distinction between "Fact" (ITN analysis) and "Value" (Trustee preference) is sharp. (Proceed to generate output).

  *(Self-Correction on the "Hated Answer")*: I need to make sure the procedure *yields* the answer, not just me saying it. The procedure should flag the Literacy project as "Low Priority" based on ITN, forcing the Trustees to override it *explicitly* as a values choice. That empowers them to make the values choice consciously rather than accidentally.

  *(Self-Correction on "Neglectedness")*: The prompt mentions neglectedness shifts when we fund. I need to build a "Marginal Impact" check into the procedure. "If we write the cheque, does the problem remain neglected?"

  *(Self-Correction on "Tractability")*: Applicant bias. The procedure needs a "Red Team" question. "What would make this fail?"

  Let's assemble the document.cw
answer: |-
  ## The Two-Hour ITN Protocol for Family Foundations

  **Context:** You have £2m/year. You cannot solve everything. The goal of this procedure is not to find the "perfect" grant, but to prevent funding that is *demonstrably* inefficient compared to alternatives, while isolating the specific value judgments that require Trustee intuition.

  **Pre-Meeting Requirement:** The Secretariat must produce a 3-page "Decision Memo" for each proposal 48 hours prior. No proposal enters the meeting without this. The Memo must cite external data, not just applicant claims.

  ### Phase 1: The Filters (45 Minutes)
  *Goal: Establish factual baselines. If a proposal fails here, it is rejected without moral debate.*

  **Q1: Importance (The Scale Test)**
  *   **Question:** If this project succeeds perfectly, how many units of suffering are prevented or lives improved, and over what timeframe?
  *   **Sufficient Answer:** A specific metric (e.g., "5,000 children avoid IQ loss," "200 adults gain employment"). Vague statements like "community cohesion improved" are insufficient.
  *   **The Bend (Aggregation):** If the project prevents a *catastrophic* but *unlikely* risk (e.g., pandemic), the Memo must compare the "expected value" (Probability × Impact) against a *certain* small harm (e.g., hunger).
  *   **Stop Condition:** If the maximum possible impact affects fewer than [Trustee Defined Threshold, e.g., 100] people significantly, **STOP. REJECT.** (Unless designated as a "Values Priority" in Phase 3).

  **Q2: Neglectedness (The Marginal Dollar Test)**
  *   **Question:** Who else is funding this? If we do not write this cheque, does the project die, or does another funder step in?
  *   **Sufficient Answer:** Evidence of total field funding vs. funding gap.
  *   **The Bend (Dynamic Neglectedness):** Acknowledge that if you fund this, it is no longer neglected *by you*. The question is: *Is the problem still neglected globally after our £2m?*
  *   **Stop Condition:** If the project is already fully funded by government or large trusts, and your money merely displaces theirs (crowding out), **STOP. REJECT.**

  **Q3: Tractability (The Reality Check)**
  *   **Question:** What evidence exists that *this specific intervention* works? Is the applicant's estimate of success verified externally?
  *   **Sufficient Answer:** Reference to independent evaluations, pilot data, or consensus in the field. Applicant optimism must be discounted by 50% unless verified.
  *   **Stop Condition:** If the theory of change relies on "raising awareness" without a mechanism for behavioral change, or if success metrics are purely self-reported, **STOP. REJECT.**

  ### Phase 2: The Synthesis (45 Minutes)
  *Goal: Compare the proposal against the portfolio, not in isolation.*

  **Q4: The Counterfactual**
  *   **Question:** If we take the £500k required for this proposal and instead gave it to our *next best* option, what is the difference in impact?
  *   **Sufficient Answer:** A direct comparison of the metrics from Q1.
  *   **The Bend (Tractability Bias):** If the applicant claims high tractability but the field is new, treat the probability of success as low.
  *   **Decision:** The Committee votes "Efficient" or "Inefficient."
      *   *Efficient:* The impact per pound is competitive with the rest of the docket.
      *   *Inefficient:* The impact per pound is significantly lower than other options on the table.

  ### Phase 3: The Values Hand-Off (30 Minutes)
  *Goal: Explicitly acknowledge where facts end and preferences begin.*

  **Q5: The Override**
  *   **Question:** We have identified this as [Efficient/Inefficient]. Do the Trustees wish to override this based on non-ITN values?
  *   **Valid Value Judgments:**
      *   **Proximity:** "We care more about our home city than distant countries."
      *   **Visibility:** "We need to see the results to feel engaged as a family."
      *   **Risk Tolerance:** "We prefer safe, small wins over speculative, huge wins."
      *   **Legacy:** "We want our name on a building, not in a dataset."
  *   **Requirement:** If the Committee votes "Inefficient" in Phase 2, a "Yes" vote here requires a recorded statement of *which* value is being prioritized over impact.

  ---

  ## Application to Current Docket

  Here is how the procedure runs on your three specific dilemmas.

  ### Case 1: Lead Exposure Research (Low-Income Countries)
  *   **Proposal:** £500k over 3 years to map lead paint in housing and advocate for policy bans in three cities.
  *   **Phase 1 (Filters):**
      *   *Importance:* High. Lead exposure reduces IQ permanently. Affects millions. (Pass)
      *   *Neglectedness:* High. Government enforcement is weak; few NGOs focus specifically on paint supply chains. (Pass)
      *   *Tractability:* Moderate/High. Policy bans work where enforced. Evidence exists from other jurisdictions. (Pass)
  *   **Phase 2 (Synthesis):**
      *   *Counterfactual:* High impact per pound. Policy change is scalable.
      *   *Verdict:* **Efficient.**
  *   **Phase 3 (Values):**
      *   No override needed.
  *   **Outcome:** **FUND.**
  *   **Note:** This is the "textbook" ITN win. It feels abstract to the family, but the numbers hold.

  ### Case 2: Community Literacy Scheme (Home City)
  *   **Proposal:** £150k/year ongoing. Tutoring for 50 adults per year.
  *   **Phase 1 (Filters):**
      *   *Importance:* Low. 50 adults is a tiny fraction of the need. (Passes minimum threshold, but barely).
      *   *Neglectedness:* Low. Local council and United Way already fund literacy. Risk of displacement is high. (Warning Flag).
      *   *Tractability:* High. You can measure reading levels perfectly. Outcomes are certain. (Pass).
  *   **Phase 2 (Synthesis):**
      *   *Counterfactual:* If you moved this £150k to the Lead Exposure project, you might prevent IQ loss for 5,000 children. Here, you help 50 adults. The efficiency gap is 100x.
      *   *Verdict:* **Inefficient.**
  *   **Phase 3 (Values):**
      *   **The Hated Answer:** The procedure dictates **REJECT.**
      *   **Why they will hate it:** The Trustees can visit this project. They can meet the learners. It feels "real." The Lead project is a spreadsheet. The procedure forces them to admit they are choosing *their own emotional satisfaction* over *maximizing good*.
      *   **Resolution:** To fund this, the Trustees must formally record: *"We are prioritizing Local Proximity and Tangibility over Global Impact Efficiency."* This stains the "Effective" brand they are trying to build.

  ### Case 3: Pandemic Preparedness (Early-Career Grants)
  *   **Proposal:** £1m endowment for 10 researchers working on pathogen surveillance.
  *   **Phase 1 (Filters):**
      *   *Importance:* Extreme. Preventing a pandemic saves millions of lives.
      *   *Neglectedness:* Moderate. Growing field, but surveillance gaps remain.
      *   *Tractability:* Low/Uncertain. Research may yield nothing for 10 years. Success is invisible (a disaster that didn't happen).
  *   **Phase 2 (Synthesis):**
      *   *Counterfactual:* High risk. The money could be spent on bednets *now* with guaranteed returns. This is a lottery ticket with a huge jackpot.
      *   *Verdict:* **Inefficient (on a short time horizon).**
  *   **Phase 3 (Values):**
      *   **The Hand-Off:** This cannot be settled by facts. It is a question of *time preference* and *risk tolerance*.
      *   **Resolution:** Handed back to Trustees. They must decide: *"Do we want to save lives today (certainty) or potentially save more lives in 2040 (uncertainty)?"*
      *   **Procedure Output:** The Committee recommends **NO FUND** based on current year impact metrics, but flags it as a **STRATEGIC CANDIDATE** if the Trustees wish to adopt a 20-year horizon.

  ---

  ## What This Procedure Cannot Settlement

  You must be plain with the Trustees about the limits of this system.

  1.  **The "Moral Weight" of Distance:** ITN assumes a life saved in Lagos equals a life saved in London. The procedure cannot prove this. If the Trustees believe their primary duty is to their neighbors, ITN is the wrong tool. The procedure forces them to say that out loud, but it cannot change their mind.
  2.  **The Valuation of the Future:** The procedure struggles with Case 3 (Pandemics). Discounting the future is a mathematical necessity in finance, but a moral hazard in philanthropy. The procedure highlights the tension but cannot resolve whether a 1% chance of saving a million people in 50 years is worth more than saving 100 people today.
  3.  **The "Warm Glow" Utility:** The procedure treats the Trustees' desire to feel good about their giving as a cost (inefficiency). It cannot account for the fact that if the Trustees don't enjoy the giving, they might stop donating entirely. A "hated" decision that causes the family to fracture or stop giving is ultimately less effective than a "sub-optimal" decision they love.

  **Recommendation:** Run the procedure for one year. If it recommends rejecting 80% of the projects the family cares about, do not discard the family. Discard the framework. Philanthropy is ultimately about the values of the giver, not just the utility of the receiver. This procedure merely ensures those values are chosen consciously, not by accident.
