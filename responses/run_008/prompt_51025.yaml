answer: |-
  Welcome to this diagnostic quiz on epistemic injustice. The following eight cases are designed to probe your intuitions about where the wrong lies when knowledge is unfairly distributed or dismissed. Please read each scenario and select the response that best matches your judgment. There are no right answers, only patterns that reveal your theoretical leanings.

  1. Consider a woman who reports chronic pain to a doctor but is dismissed as exaggerating due to gendered stereotypes about emotional stability. The first option is that the doctor fails to exhibit the virtue of testimonial justice by allowing prejudice to corrupt their credibility judgment. The second option is that medical language lacks the concepts to articulate female pain patterns accurately, creating a structural gap in understanding. The third option is that this is simply sexism using medical authority as a tool, and labeling it epistemic adds no explanatory value.

  2. Imagine a witness in a courtroom whose regional accent causes the jury to discount their testimony, despite the content being clear. The first option is that the jurors possess a prejudice that lowers their perception of the witness's intelligence unfairly. The second option is that the jurors could understand the witness but refuse to extend the effort required to bridge the cultural distance, actively ignoring available evidence. The third option is that this is standard class discrimination where knowledge claims are merely the battlefield, not the core issue.

  3. Think of a group of workers before the concept of sexual harassment existed who suffered behaviors they could not name or collectively protest. The first option is that individual managers dismissed their complaints due to personal bias against women. The second option is that the collective hermeneutical resource lacked the concept necessary to make sense of their experience, causing a structural injustice. The third option is that this was ordinary oppression where the lack of a word was a symptom rather than a distinct epistemic harm.

  4. Picture a prison administration that receives detailed reports on unsafe conditions from inmates but archives them without review. The first option is that the administrators lack the virtue of open-mindedness required to treat prisoners as knowers. The second option is that the administrators possess the resources to understand the reports but willfully refuse to engage with them to maintain power. The third option is that this is purely carceral abuse where epistemic language distracts from the material violence.

  5. Reflect on indigenous ecological knowledge that is dismissed as myth by state scientists managing a forest. The first option is that the scientists are individually prejudiced against non-western ways of knowing. The second option is that the scientific framework itself excludes indigenous categories, creating a gap in the shared interpretive resources. The third option is that this is colonialism plain and simple, and the epistemic label obscures the political struggle.

  6. Envision a corporate manager who tells an employee they lack leadership presence without defining the term, despite the employee meeting all formal criteria. The first option is that the manager is exercising individual bias in their credibility judgment. The second option is that the manager knows the criteria are met but refuses to interpret the employee's style as leadership to block their promotion. The third option is that this is employment discrimination where epistemic vagueness is just a mechanism for bias.

  7. Consider a partner in a relationship who denies past events to make the other doubt their memory and sanity. The first option is that the gaslighter is viciously failing to respect their partner as a knower. The second option is that social resources often frame women as hysterical, creating a structural vulnerability the gaslighter exploits. The third option is that this is psychological abuse and categorizing it as epistemic injustice does not change the remedy.

  8. Observe an algorithmic lending system that denies loans to people from certain zip codes based on historical data. The first option is that the programmers failed to cultivate virtue regarding the credibility of data from marginalized areas. The second option is that the company refuses to audit the system for fairness despite having the technical resources to do so. The third option is that this is economic inequality enforced by code, not a distinctively epistemic wrong.

  To calculate your result, count how many times you selected the first option across all eight questions. If the majority of your selections were the first option, your view aligns with the position that locates the wrong in individual hearers credibility judgments and prescribes a corrective virtue in the hearer. Next, count how many times you selected the third option. If the majority of your selections were the third option, your view aligns with the deflationary view that there is no distinctively epistemic wrong here at all, only ordinary injustice carried out by epistemic means. If you predominantly selected the second option, you must look closer at which questions influenced you. If you selected the second option primarily in the odd-numbered questions which describe missing concepts or structural gaps, your view aligns with the position that locates the wrong in structural gaps in shared interpretive resources and prescribes collective conceptual repair. If you selected the second option primarily in the even-numbered questions which describe active ignoring or refusal despite capacity, your view aligns with the position that there is a distinct additional wrong in an audience refusal to extend interpretive resources it already has, over and above any gap in those resources.

  Please note a significant limitation in this diagnostic tool regarding the two structural positions. The quiz attempts to separate the view focusing on hermeneutical gaps from the view focusing on willful ignorance by alternating the content of the second option between odd and even questions. However, these two positions often converge in the literature because a structural gap can functionally look like a refusal, and a refusal can exploit a gap. If you found yourself selecting the second option consistently across both odd and even questions, the quiz cannot definitively separate whether you prioritize the lack of resources or the refusal to use them. This reflects a real convergence in contemporary epistemology where structuralists and critics of willful ignorance agree on the diagnosis of power asymmetries but differ subtly on the primary locus of the remedy. If you landed in this overlap, you likely hold a hybrid structural view that sees gaps and refusals as co-constitutive rather than distinct categories.
