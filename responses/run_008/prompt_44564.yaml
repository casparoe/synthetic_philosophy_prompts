answer: |-
  **Veridical: Stop Looking. Start Knowing.**

  **Welcome to the future of curated existence.** Below are answers to common questions regarding our subscription tiers, data integrity, and aesthetic outsourcing protocols.

  **Q: How can I know a novel is luminous without reading it?**
  A: Veridical aggregates verdicts from Verified Experiencers (VEs) who have completed the text. You receive the consolidated truth: the masterpiece status is confirmed. Our Numbers Team works tirelessly to reproduce the intuition from scratch, ensuring you possess the correct judgment without the temporal cost of engagement. You know *that* it is beautiful. That is the core utility.

  **Q: What is the difference between the Basic and Premium tiers?**
  A: Basic provides the *Fact of Beauty*. You hold the correct opinion. Premium includes *Simulated Resonance*, where haptic feedback and ambient audio cues mimic the emotional state of appreciation. Please note: Basic subscriptions are refundable within thirty days. Premium is non-refundable. You cannot return a feeling once it has been downloaded.

  **Q: Is direct experience required for validation?**
  A: No. Testimony is sufficient for verdict acquisition. However, we acknowledge that a foundational sensory encounter adds a certain proprietary weight to the data. For users concerned about the "hollowness" of second-hand judgment, we offer the *First-Hand Proxy* add-on. This premium module simulates the missing sensory encounter separately from the verdict. It does not allow you to see the art, but it sells you the acknowledgment that something was missed, which many users find spiritually equivalent.

  **Q: Who are your data sources? Specifically, what about writers?**
  A: Our VEs include critics, influencers, and working novelists. Writers are among our most reliable validators, often blurring books based on industry consensus rather than manuscript completion. Regarding compensation: Contributing Validators are paid in Exposure Credits. Currently, the rate is 0.04 credits per word of blurb provided. These credits can be redeemed for discounts on Veridical subscriptions, allowing writers to outsource their own aesthetic lives using the value generated by their names.

  **Q: What happens if I accidentally experience something directly?**
  A: This is classified as a Contamination Event. Direct exposure compromises the purity of your outsourced profile. If you view a sunset without consulting the app, or hear a symphony before checking its rating, you must file a Contamination Ticket immediately. Do not attempt to form your own opinion. Our support team will initiate a Cognitive Scrubbing Workflow to realign your judgment with the consensus. Failure to report Contamination may result in aesthetic dissonance penalties.

  **Q: Can I trust the justification for the verdict?**
  A: Veridical transmits the verdict, not the justification. Justification is computationally expensive and often redundant. You do not need to know *why* the sunset was sublime; you only need to know *that* it was, so you may nod appropriately at dinner parties. If you require the "why," our Premium tier generates plausible post-hoc reasoning based on current trend vectors.

  ***

  **User Testimonial**
  *"Before Veridical, I wasted hours staring at paintings. Now, I know exactly which ones are masterpieces without ever entering a gallery. My taste is impeccable. I haven't actually looked at a piece of art since 2019, but I can tell you precisely why you should be moved by it. It's liberated me from the burden of seeing."*
  — **Julian V., Premium Subscriber (5 Years)**
