      *   *Claim 3:* "The independence axiom of expected utility theory says that a person's preference between two options should not depend on any other options available to them..."
      *   *Claim 4:* "...so everyone should choose consistently across the two pairs, no matter how the shared component is arranged."
      *   *Claim 5:* "They did not: most subjects took the certain million in the first pair but the riskier gamble in the second pair, a preference for security near certainty that Allais himself named the certainty effect."
      *   *Claim 6:* "Allais thereby proved that people are not rational in the economist's sense, and expected utility theory collapsed as a description of how people actually choose."

  3.  **Evaluate Each Claim (Drafting the Analysis):**

