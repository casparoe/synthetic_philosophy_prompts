answer: |-
  Here is a complete design for your 90-minute seminar session. It prioritizes the experiential "weirdness" of imperfect recall before introducing the formal game tree.

  ## Activity Title: "The Highway at Night"

  ### 1. Logistics & Setup (5 Minutes)
  *   **Room:** Standard seminar table.
  *   **Materials:**
      *   12 "Driver Logs" (half-sheets of paper).
      *   1 Deck of "State Cards" (for you, the TA). 6 cards say **Intersection 1**, 6 cards say **Intersection 2**. (Actually, see *Protocol* below for a better way to handle this).
      *   1 Timer (phone is fine).
      *   Token sheet (whiteboard) to track payoffs.
      *   A "Distractor List" printed on the board (e.g., "Recite alphabet backwards," "Count backward from 103 by 7s").
  *   **Payoff Scheme:** "Seminar Points" (e.g., 10 points = 1% toward participation grade) or high-quality chocolate. Let's assume **Tokens** redeemable for a tangible reward at the end to keep stakes immediate.
      *   Exit @ 1st: **0 Tokens**
      *   Exit @ 2nd: **4 Tokens**
      *   Motel (Continue twice): **1 Token**

  ### 2. The Activity Protocol (30 Minutes)
  You will run **4 Rounds**. In each round, **3 Students** play the Driver simultaneously (at different ends of the table or separated by folders), while the other 9 act as **Auditors**.

  **The "Amnesia" Protocol:**
  1.  **Recruitment:** Call 3 volunteers to the "Hot Seats." They must face away from the class/whiteboard.
  2.  **The State:** You (TA) privately assign each Driver a "Game Type."
      *   *Crucial Modification for Classroom Feasibility:* To prevent the "I know this is the second time because I played before" leak, you will run a **Randomized Termination** variant that is payoff-isomorphic to AMD for the agent.
      *   *Instruction to Driver:* "You are on a highway. You will encounter an intersection. You may Exit or Continue. If you Continue, there is a chance you will face another intersection, or the game may end. You will not know which."
      *   *TA Secret Logic:*
          *   **Round A (50% chance):** If they Continue at the first prompt, the game ends (Motel Payoff = 1). *Simulates missing both exits.*
          *   **Round B (50% chance):** If they Continue at the first prompt, they face a second prompt. If they Continue again, game ends (Motel Payoff = 1). If they Exit at the second prompt (Home Payoff = 4).
          *   *Wait, this is getting complex to manage live.*
      *   *Simpler, Robust Protocol:* Stick to the spatial 2-intersection model but enforce ignorance via **Auditors**.
      *   **Revised Protocol:**
          1.  Driver sits. Auditor stands behind Driver (blocking view of TA).
          2.  TA shows Auditor a card: **INT 1** or **INT 2**. (TA ensures a mix across the class).
          3.  Auditor shows Driver a blank card labeled **"INTERSECTION"**.
          4.  Driver says "Exit" or "Continue."
          5.  **If Exit:** Auditor records payoff based on TA's secret card (0 or 4). Round Over.
          6.  **If Continue:** Driver must perform a **45-second High-Load Distractor** (e.g., "Name every US state starting with a vowel" or "Count backward from 100 by 7s"). Auditor enforces silence.
          7.  Auditor shows the **SAME** "INTERSECTION" card again.
          8.  Driver chooses again.
          9.  **Payoff Logic:**
              *   If Secret Card was **INT 1** and Driver Exits: **0**.
              *   If Secret Card was **INT 1** and Driver Continues: Driver moves to **INT 2** (Auditor swaps secret card to INT 2, Driver doesn't see).
              *   If Secret Card was **INT 2** and Driver Exits: **4**.
              *   If Secret Card was **INT 2** and Driver Continues: **1** (Motel).
          10. **Auditor Role:** Their job is not just to track, but to **police memory**. If the Driver tries to count on fingers, check the clock, or signal the audience, the Auditor calls "FOUL" and the payoff is halved. This makes the *constraint* part of the game.

  **Rotation:**
  *   Round 1: Students 1-3 Drive, 4-12 Audit.
  *   Round 2: Students 4-6 Drive, 7-12 + 1-3 Audit.
  *   Round 3: Students 7-9 Drive, 10-12 + 4-6 Audit.
  *   Round 4: Students 10-12 Drive, 1-9 Audit.
  *   *Result:* Every student drives once, audits 3 times.

  ### 3. The Debrief & Formalism (45 Minutes)

  **Part A: The Data Reveal (10 mins)**
  1.  Collect the Driver Logs.
  2.  On the board, create a table:
      *   Total Decisions Made: $N$
      *   Total Exits: $E$
      *   Total Continues: $C$
      *   Total Payoff Distributed: $T$
  3.  Ask the class: "Based on the tokens awarded, what was the average payoff per driver?"
  4.  Ask: "Did anyone play a Pure Strategy?" (Always Exit, Always Continue). Compare their scores to the Mixed players.
      *   *Likely Outcome:* Pure Exiters get 0 or 4 (high variance, low avg). Pure Continuers get 1. Mixed players should cluster around the optimum if they randomized well.

  **Part B: Deriving the Optimum (15 mins)**
  1.  Draw the Game Tree on the board.
  2.  Ask a student to calculate the Expected Utility (EU) of a mixed strategy $p$ (probability of Continuing).
      *   $EU(p) = (1-p) \cdot 0 + p(1-p) \cdot 4 + p^2 \cdot 1$
      *   $EU(p) = 4p - 4p^2 + p^2 = 4p - 3p^2$
  3.  Ask a student to maximize this (derivative = 0).
      *   $4 - 6p = 0 \rightarrow p = 2/3$.
      *   Max EU = $4(2/3) - 3(4/9) = 8/3 - 4/3 = 4/3 \approx 1.33$.
  4.  Compare this to Pure Continue ($p=1$, EU=1) and Pure Exit ($p=0$, EU=0).
  5.  **The Kicker:** Point out that $1.33$ is the *Ex-Ante* planning optimum.

  **Part C: The Action vs. Planning Dispute (20 mins)**
  1.  Turn to the Drivers: "When you were at the intersection, did you know which one it was?"
      *   Most will say: "The first time I didn't know. The second time, I knew." (Acknowledge this leak immediately—see Limitations).
  2.  **The Paradox:** "Suppose you successfully forgot. You are at an intersection. You believe you are equally likely to be at 1 or 2 (halving)."
      *   If you Exit now: Expected Payoff = $0.5(0) + 0.5(4) = 2$.
      *   If you Continue now: Expected Payoff = $0.5(\text{EU at 2}) + 0.5(1)$.
      *   Walk them through why, from the *interim* perspective, Exit looks better than the Plan ($2 > 1.33$).
  3.  **Discussion Question:** "If the math says Exit is better *when you are there*, why is Continuing (with prob 2/3) better *before you start*? Can a rational agent bind their future self? If you can't bind them (because you forget), is the plan rational?"
  4.  This sets up the Piccione & Rubinstein (1997) vs. Aumann et al. debate perfectly for the next lecture.

  ### 4. Troubleshooting: What Will Go Wrong

  **1. Memory Smuggling (The "Counting" Leak)**
  *   **Risk:** Students will realize "If I'm here again, it must be Intersection 2."
  *   **Mitigation:** The Auditor role is key. Empower Auditors to be "memory police." If a Driver says, "Oh, again?", the Auditor must warn them.
  *   **Pedagogical Spin:** If they *do* figure it out, **use it**. In the debrief, say: "The simulation failed to induce perfect amnesia. You gained information. How did that change your strategy? This shows why *information sets* are the critical formal constraint."

  **2. Refusal to Randomize**
  *   **Risk:** A student says, "I don't use dice. I choose based on intuition."
  *   **Mitigation:** Do not force a physical randomizer. Allow "internal randomization."
  *   **Debrief Use:** If their internal randomization yields $p \approx 2/3$, praise it. If they play Pure, show the token loss. This demonstrates the *cost* of ignoring the mixed optimum without needing a philosophical fight mid-game.

  **3. Time Overrun**
  *   **Risk:** The distractor task takes too long; 4 rounds drag.
  *   **Mitigation:** Cut to 3 Rounds (4 drivers per round). 90 minutes is tight. 3 Rounds ensures everyone drives once if you group them in 4s.
  *   **Backup:** If you run out of time, skip Round 4 and use the "Planner" homework to fill the data gap.

  ### 5. Limitations: What This Activity Cannot Do
  *Be transparent about this in the final 5 minutes.*

  1.  **Simulated vs. Real Amnesia:** In the game, forgetting is a rule enforced by peers. In the problem, it's a cognitive impossibility. Students *could* remember, they just *shouldn't*. This changes the normative force of the constraint.
  2.  **The Randomization Device:** If students use dice/coins to decide, they are using an external correlation device. Some theorists (like Piccione & Rubinstein) argue the paradox dissolves if you can commit to a randomizer. The activity makes randomization easy; the theory asks if it's *rationally accessible* to an agent who forgets they planned to randomize.
  3.  **The "Second Time" Leak:** As noted, sequential play in a classroom inevitably reveals the node index to the player upon the second prompt. The activity simulates *uncertainty*, but not perfect *indistinguishability*.

  ### 6. Follow-Up Homework (Bonus)
  **Title:** "Reconstructing the Strategy"
  **Data:** Provide them with the anonymized raw data from the class session (Choice 1, Choice 2, Payoff for each of the 12 drivers).
  **Tasks:**
  1.  **Estimate $p$:** Calculate the class's empirical probability of Continuing ($\hat{p}$).
  2.  **Efficiency Loss:** Calculate the difference between the Class Average Payoff and the Theoretical Optimum ($4/3$).
  3.  **Reflection (1 page):** "Pick one round where a Driver exited at Intersection 1 (Payoff 0). Reconstruct their likely belief state. Did they think they were at Intersection 2? If so, was that belief rational given the information available to them *at that moment*? Connect this to the 'Halving' argument discussed in class."

  ---

  ### TA Cheat Sheet: The Math for the Board
  *   **Payoffs:** Exit 1 = 0, Exit 2 = 4, Motel = 1.
  *   **Strategy:** $p$ = Prob(Continue).
  *   **Ex-Ante EU:** $0(1-p) + 4p(1-p) + 1(p^2) = 4p - 3p^2$.
  *   **Max:** $d/dp = 4 - 6p = 0 \Rightarrow p = 2/3$.
  *   **Max Value:** $4/3$.
  *   **Ex-Interim (Halving):** Belief $P(\text{Node 2} | \text{Reach}) = 1/2$.
      *   EU(Exit) = $0.5(0) + 0.5(4) = 2$.
      *   EU(Continue) = $0.5(4 \text{ if exit next}) + 0.5(1 \text{ if motel})$. *Wait, this requires assuming future behavior.*
      *   If you plan to Exit next: EU(Cont) = $0.5(4) + 0.5(1) = 2.5$. (Inconsistent).
      *   If you plan to Continue next: EU(Cont) = $0.5(1) + 0.5(1) = 1$.
      *   *This is where the debate lives.* Exit gives 2. Consistent Continue gives 1. So Exit dominates *at the node*. But Plan $p=2/3$ dominates *ex-ante*.

  This structure gives you the "weirdness" first, the data second, and the formal fight last, fitting perfectly into the 90-minute block.
