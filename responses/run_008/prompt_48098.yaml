          *   Where would following it faithfully get things wrong?

  2.  **Initial Knowledge Retrieval & Structuring:**

      *   *Bentham's Essay:* "Offences Against One's Self: Paederasty" (written c. 1785, published 1931). Key arguments: No harm to others, antipathy is not a valid ground for punishment, population arguments are weak, divine punishment is empirically unfounded.
      *   *Labouchere Amendment (1885):* Section 11. Criminalized "gross indecency" between men in public or private. Lowered the threshold for prosecution compared to sodomy laws.
      *   *Oscar Wilde Trial (1895):* Libel suit against Queensberry -> Criminal prosecution -> Hard labor. High public spectacle. Class dynamics (aristocrat vs. working-class males).
      *   *Bentham's Utilitarianism:* Greatest happiness principle. Pain/pleasure calculus. Law should only prevent harm to others (anticipating Mill). Antipathy is a "false ground."
      *   *Structure:*
          1.  Introduction: Set the scene (Bentham's foresight vs. Victorian reality).
          2.  Bentham's Lens on the Episode: Harm, Victims, Antipathy.
          3.  Limitations of Bentham's Lens: Spectacle, Class, Law as Harm.
          4.  The Episode's Critique of Bentham: The Silence, Sentiment Change, Political Reality.
          5.  Conclusion: Synthesis of illumination, silence, and error.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Hook with the irony. Bentham saw clearly in 1785, but the law moved backward in 1885. Define the tension between rational utilitarianism and Victorian moral panic.

      *   **Part 1: Bentham's Lens (Mapping the Episode):**
          *   *Harm:* Bentham argues there is *no* secular harm. Consensual acts = private pleasure.
          *   *Victims:* None, except potentially the participants if punished.
          *   *Antipathy:* Bentham calls this "sympathetic antipathy" or mere prejudice. He would view the Labouchere Amendment as legislation based on "disgust" rather than utility.
          *   *Prediction:* He would predict the law creates more pain (prison, stigma) than it prevents (non-existent harm).
          *   *Fit:* This explains the *logic* of the persecution well. The prosecution *was* driven by antipathy (Queensberry's note: "posing somdomite" [sic]).

      *   **Part 2: Where Bentham's Lens Blurs (Limitations):**
          *   *Law as Harm:* Bentham knows punishment is pain, but does he grasp the *social* pain of stigma? Wilde's ruin wasn't just prison; it was social death. Bentham focuses on physical/legal pain, maybe underestimates social ostracization as a "punishment" in itself.
          *   *Spectacle & Class:* Bentham assumes rational actors. The Wilde trial was theater. It reinforced class boundaries. Bentham's abstract individualism misses the sociological function of the trial (purging the decadent aristocrat).
          *   *Expressive Function:* Law isn't just about deterrence; it's about defining morality. Bentham wants law to be neutral; Victorian law was moralistic.

      *   **Part 3: The Episode's Critique of Bentham (Theory under Scrutiny):**
          *   *The Silence:* Why didn't he publish? Fear of backlash. This admits that *utility* is subjective to the majority. If the majority feels pain at the *existence* of the act, their utility function outweighs the minority's liberty.
          *   *Sentiment Change:* Bentham assumes enlightenment leads to progress. The 1885 Act shows regression. His theory lacks a mechanism for changing "antipathy." He treats prejudice as an error to be corrected by reason, but prejudice is often emotional/tribal.
          *   *Political Reality:* Bentham was a legal reformer. He thought law could be engineered. The Labouchere Amendment was a political accident (attached to a bill about child protection/prostitution). Bentham's rationalism misses the messy contingency of legislation.

      *   **Part 4: Illumination, Silence, Error:**
          *   *Illumination:* Identifying "antipathy" as the driver. The lack of tangible harm.
          *   *Silence:* How to change public opinion. The sociological role of stigma.
          *   *Error:* If Bentham strictly followed the "majority utility," he might have to concede that if the majority suffers enough disgust, the law *is* utilitarian. This is the "tyranny of the majority" problem Mill later tried to fix. Bentham's framework risks justifying the persecution if the "pain of disgust" is weighed heavily enough.

  4.  **Refining and Polishing:**

      *   *Check Tone:* Academic, analytical, nuanced.
      *   *Check Constraints:* Did I address the "century of silence"? Yes. Did I address the "harm caused by the law"? Yes. Did I distinguish illumination/silence/error? Yes.
      *   *Key Insight to Develop:* The paradox of Bentham's utilitarianism regarding homosexuality. If utility = sum of pleasures minus pains, and the majority feels pain (disgust) at the mere knowledge of the act, utilitarianism *could* justify banning it. Bentham avoids this by dismissing antipathy as illegitimate, but he doesn't fully solve *why* it's illegitimate within a pure hedonic calculus. This is crucial for the "Error" section.

