answer: |-
  Right then, let's untangle this knot. You've stumbled upon one of the most famous problems in epistemic logic, often called the Unexpected Hanging Paradox. Your intuition that it feels like a "bug in the spec" is shared by many logicians, but your conclusion that the rational play is to do nothing is where the code crashes.

  Here is the breakdown.

  ### The Bug in the Students' Logic
  Your teammate is correct that the induction breaks, but they are struggling to locate the segmentation fault. It occurs at the very first step: the elimination of Friday.

  The students' reasoning relies on a hidden assumption: that they *know* the teacher's announcement is true. To rule out Friday, they argue: "If we reach Thursday night without an exam, we will *know* it must be Friday." However, this knowledge depends entirely on the teacher's announcement being trustworthy.

  If the students deduce with certainty that the exam must be on Friday, then the exam on Friday would *not* be a surprise. This would make the teacher's announcement false. Therefore, the students cannot logically claim to *know* the announcement is true while simultaneously using it to prove the announcement would be false on Friday. It is a circular dependency. You cannot use the truth of the statement to prove the statement false. In programming terms, they are trying to read a variable before it has been initialised.

  Because the first step (Friday) cannot be eliminated with certainty, the rest of the induction cascade fails. Thursday remains possible, Wednesday remains possible, and so on.

  ### The "Off-Spec" Argument
  You argued that if the exam happens, the teacher is shipping "off-spec". This is incorrect. If the teacher sets the exam for Wednesday, and the students (having convinced themselves no exam is possible) do not expect it, they are genuinely surprised. The teacher's statement ("There will be an exam and you won't know when") turns out to be **true**. The spec was valid; the students' compiler was buggy.

  ### The Two-Day Case
  Your unit test case holds up. If the week were only Monday and Tuesday, the same logic applies. The students would argue: "It can't be Tuesday, because if it's not Monday, we'll know Monday night." Eliminating Tuesday then eliminates Monday. The paradox survives unchanged because the error is in the epistemic assumption (knowledge), not the number of iterations.

  ### Generalisation to Surprise Parties
  This generalises strictly to situations where the surprise is announced *to the subject*. If I tell you, "I will throw you a surprise party this week," the paradox activates. However, standard surprise parties work precisely because the announcement is *not* made to the subject. For on-call pages, if you are told "You will be paged unexpectedly," the same logic applies: you cannot logically prove you won't be paged on the last shift, so you must remain prepared.

  ### Verdict
  Do not skip studying. The teacher's statement is consistent with reality, even if it is inconsistent with the students' proof. The real world does not compile based on the students' deduction.

