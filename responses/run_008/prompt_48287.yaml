      *   *The "Museum Piece" claim:* Accurate for the *original* pragmatic interpretation (Ramsey/de Finetti's operationalism). Inaccurate for the modern *accuracy-first* or *inconsistency* interpretations that use DBA structures.
      *   *Key Distinction:* Pragmatic DBA (you lose money) vs. Epistemic DBA (you are inconsistent/inaccurate). The student wants to defend DBAs doing *justificatory work*. If they mean pragmatic DBAs justifying epistemic norms, that's the hard sell. If they mean DBA-style arguments (including accuracy arguments) justify norms, that's mainstream. I need to clarify this distinction immediately.
