answer: |-
  Dear Colleague, I am writing to share the draft materials for the final exam question on contractualism and aggregation, along with the model answer and marking scheme we discussed. The question itself would be presented to the students as follows. You are asked to analyze the Warden case involving a county flood-siren network. In the Village configuration with four thousand residents, the distributed option costs eleven person-hours total while the warden option costs one hundred and seventy hours. In the Metropolis configuration with three million residents, the distributed option costs eight thousand person-hours total while the warden option remains one hundred and seventy hours. In the Hamlet configuration with five hundred residents, the distributed option costs forty person-hours total while the warden option remains one hundred and seventy hours. In each configuration, the individual burden for a resident is either ten seconds or five minutes, while the warden's burden is one hundred and seventy hours. First, state precisely what Scanlon's individualist restriction requires regarding the comparison of complaints. Second, determine for each configuration what contractualism permits and what a utilitarianism of total burdens would require, identifying exactly where the verdicts diverge. Third, argue whether the invariance of the contractualist verdict across the three configurations is a feature because arithmetic does not create complaints or a bug because the crowd is exploited by its own thinness. Finally, evaluate two possible repairs to contractualism, such as allowing complaints to carry weights that sum across persons or making the reasonableness of a rejection sensitive to how many people could lodge it, and explain what each repair costs the theory, specifically whether the first collapses contractualism into a utilitarianism of complaints and whether the second merely relocates aggregation to the theory of reasons.

  A strong student response would look like this. Scanlon's individualist restriction requires that we compare complaints one complainant at a time without summing harms across different persons, though we may sum harms to the same person within her own complaint. This means the strength of a complaint is determined by the severity of the burden on that individual, not by how many others share it. In the Village, both contractualism and utilitarianism permit distributing the chore, since the total burden is lower and the individual burden is negligible. In the Hamlet, both theories also permit distributing, as forty hours is less than one hundred and seventy, and five minutes is less than one hundred and seventy hours. The theories diverge only in the Metropolis. Utilitarianism requires conscripting the warden because eight thousand hours exceeds one hundred and seventy, whereas contractualism requires distributing because ten seconds is less burdensome than one hundred and seventy hours for any single individual. The contractualist verdict remains invariant across all three cases because the individual complaint never changes size, regardless of how many people stand behind it. This invariance is a feature if one holds that arithmetic does not create complaints, meaning moral status cannot be amplified by mere numbers. However, it looks like a bug if one believes the crowd is being exploited by its own thinness, where the multitude suffers a massive aggregate loss that is ignored because it is thinly spread. To fix this, one might allow complaints to carry weights that sum across persons. The cost here is severe, as it collapses contractualism into a utilitarianism of complaints, abandoning the core individualist restriction that defines the view. Alternatively, one could make the reasonableness of a rejection sensitive to how many people could lodge the complaint. This avoids summing burdens directly but merely relocates the aggregation from the level of complaints to the level of the theory of reasons, since the weight of a reason now depends on numbers. Thus, avoiding aggregation entirely seems impossible without ignoring significant moral costs, yet accepting it threatens the distinctiveness of contractualism.

  The grading rubric would operate as follows to allocate the twenty-five available marks. Five marks are awarded for a precise statement of the individualist restriction, and students lose two marks if they suggest harms can be summed across persons or fail to mention one-to-one comparison. Ten marks are allocated for the analysis of the three configurations, with three marks for correctly identifying the verdicts in the Village and Hamlet, four marks for identifying the divergence in the Metropolis, and three marks for clearly contrasting the utilitarian total burden against the contractualist individual burden. Students lose all four marks for the Metropolis analysis if they claim contractualism permits conscripting the warden. Five marks are reserved for the feature versus bug evaluation, where three marks require a clear stance and two marks require a justification referencing either arithmetic or exploitation. Students lose two marks if they remain neutral without arguing for one side. The final five marks evaluate the repairs, with two marks for explaining the cost of weighting complaints regarding utilitarian collapse, two marks for explaining the cost of reasonableness sensitivity regarding relocated aggregation, and one mark for overall coherence. Students lose both marks for the first repair if they fail to mention the collapse into utilitarianism, and they lose both marks for the second repair if they do not identify the relocation of aggregation to the theory of reasons. An A answer distinguishes itself by seamlessly integrating the math of the cases with the philosophical principle, whereas a B answer often lists the verdicts correctly but fails to explain why the Metropolis case specifically triggers the divergence or treats the repairs as merely technical adjustments rather than structural threats to the theory. I hope this draft serves our purposes well, and I look forward to your feedback before we finalize the exam paper.
