  2.  **Deconstruct Futarchy & Satire Points:**
      *   *Core Mechanism:* Vote on values (utility function), bet on policies (prediction markets).
      *   *Critique 1 (Goodhart's Law):* When a measure becomes a target, it ceases to be a good measure. (Metric gaming).
      *   *Critique 2 (Plutocracy):* Wealth influences market prices more. (Rich have more "belief" votes).
      *   *Critique 3 (Time Horizons):* Markets are short-term; policy effects are long-term. (Discounting the future).
