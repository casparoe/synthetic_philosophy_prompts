answer: |-
  You have done your homework on the history of philosophy of science, but you have drawn a slightly too pessimistic conclusion from it. You are right about the event, but wrong about the implication.

  Here is the breakdown of what happened, why philosophers haven't stopped talking about truth, and why we don't just give up and pick the simplest theory.

  ### 1. The Tichý-Miller Bomb (1974)
  In the 1960s, Karl Popper tried to solve a major problem. As a falsificationist, he believed we can never prove a theory is *true*. But surely, Einstein's General Relativity is "better" than Newton's Mechanics, and Newton is "better" than Ptolemy's epicycles. Popper wanted a logical way to say a false theory can be **closer to the truth** (verisimilitude) than another false theory.

  Popper defined this using logical content: a theory is closer to the truth if it has more true consequences and fewer false consequences.

  In 1974, Pavel Tichý and David Miller independently published papers showing that Popper's math didn't work. They proved that under Popper's specific definitions, if two theories are both false, you cannot logically rank one as closer to the truth than the other. In fact, under certain formalizations, adding true content to a false theory could make it *less* verisimilar.

  So, you are correct: they proved **Popper's definition** of verisimilitude was incoherent.

  ### 2. Did they prove verisimilitude is *impossible*?
  No. This is the crucial distinction. Tichý and Miller proved that Popper's *bridge* collapsed, not that the *river* cannot be crossed.

  They showed that you cannot define truthlikeness merely by counting true and false logical consequences. This didn't stop philosophers; it challenged them to find a better definition. It was like proving that "flight is impossible using flapping wooden wings." That doesn't mean flight is impossible; it means you need jet engines.

  ### 3. Why philosophers still talk about "Getting Nearer to the Truth"
  Philosophers of science haven't ignored the proof out of nostalgia or ignorance. In fact, the Tichý-Miller papers sparked a massive boom in research. Philosophers like Ilkka Niiniluoto and Graham Oddie developed new approaches, most notably the **possible worlds** approach.

  Instead of counting logical consequences, this approach treats theories as descriptions of "worlds." We compare the "world" described by Newton to the "world" described by Einstein, and measure the **distance** between them and the actual world.
  *   **Ptolemy:** Describes a world where the sun orbits the earth. (Very far from actual world).
  *   **Newton:** Describes a world where gravity acts instantly across space. (Closer, but still distinct from reality).
  *   **Einstein:** Describes a world where gravity curves spacetime. (Even closer).

  Under these modern definitions, we *can* mathematically show that Newton is closer to the truth than Ptolemy, even if both are technically false. So, when you hear philosophers talking about scientific progress toward the truth, they are usually using these post-1974 definitions, not Popper's broken one.

  ### 4. Is comparing accuracy pointless? Should we just pick the simplest?
  If we accepted your premise that all false theories are equally wrong, science would indeed become purely instrumental (does it work?) or pragmatic (is it simple?).

  However, treating Newton and Ptolemy as "equally wrong" contradicts the practice of science.
  *   **Predictive Power:** If you use Ptolemy's math to navigate a spaceship to Mars, you will miss the planet. If you use Newton's, you will land. If you use Einstein's, you will land even more precisely (accounting for relativistic effects).
  *   **Explanatory Depth:** Newton's theory explains *why* the epicycles looked the way they did (as approximations of orbits). Ptolemy's theory cannot explain Newton's laws.

  Simplicity (Occam's Razor) is a virtue, but it is not the *only* virtue. A simple theory that gets the answer wrong is less valuable than a complex theory that gets the answer right. We compare theories for accuracy because accuracy has cash value in the real world. We don't treat them as equal because their failure modes are different magnitudes.

  ### Summary
  The Tichý-Miller proof is famous and respected, but it is a specific critique of Popper's logic, not a death sentence for the idea of scientific progress. Philosophers continue to refine the concept of truthlikeness because the intuition that science progresses is too strong to abandon, and new logical tools allow us to formalize that intuition without falling into Popper's trap.

  Verdict: The proof killed a definition, not the concept.
