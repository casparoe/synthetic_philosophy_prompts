          *   *Key nuances:* $S$ contains more than just desires (dispositions, commitments, projects). "Sound deliberation" includes means-end reasoning but *also* correcting factual errors, imagining outcomes, and potentially discovering new motivations via deliberation (not just satisfying existing ones).
