  Diagnosis

  This deadlock is a fundamental clash of explanatory ideals regarding the direction of metaphysical dependence. It is not merely verbal, nor is it a hidden empirical dispute. The dispute stalls because both sides are playing different games with the same pieces. Humeans treat metaphysics as an extension of scientific systematization, aiming for parsimony and supervenience. Anti-Humeans treat metaphysics as the underwriter of scientific practice, aiming for ontic grounding and modal force. Consequently, each side views the other's core demand as a category mistake. When Anti-Humeans demand a "producer" of regularities, Humeans hear a request for magic. When Humeans offer a "summary" of facts, Anti-Humeans hear a circular evasion. This is a methodological stalemate about what counts as "doing the work." Neither side is wrong about logic; they are incompatible about the goal of metaphysical inquiry. The argument freezes because there is no neutral arbiter to decide whether metaphysics should describe the world's structure or explain its engine. The Humean wants a map that fits the territory perfectly; the Anti-Humean wants the tectonic plates that formed the territory. Until the group acknowledges that they are debating the purpose of explanation itself, rather than the content of laws, no amount of tweaking the Best System or refining necessitation relations will break the ice. This is a dispute about whether explanation requires ontic oomph or informational compression. The mutual charge of unintelligibility is the smoking gun. Humeans claim "governing" is empty verbiage; Anti-Humeans claim "supervenience" ignores the asymmetry of explanation. This signals they are operating with incompatible standards of deep metaphysical satisfaction.

  The evidence from each side

  The evidence lies in how each side dismisses the other's core mechanism. Humeans, following Lewis, argue that the Best System Analysis (BSA) captures everything science needs without ontological excess. Their evidence is the success of physics: equations predict outcomes without referencing "necessitation." They argue that adding a governing relation adds no predictive power and violates parsimony. When pressed on explanation, they insist that subsuming an event under a systematic regularity *is* the explanation. To demand more is to demand mysticism. They point out that Anti-Humeans cannot describe "governing" without relying on the very regularities it supposedly produces.

  Anti-Humeans, like Armstrong or Maudlin, point to counterfactuals and induction. They argue that if laws are merely summaries of the mosaic, they cannot support subjunctive conditionals. If the law is just "all Fs are Gs," it cannot explain why a specific F *would be* G in a non-actual scenario. Their evidence is the intuitive asymmetry of explanation: the rain explains the wet grass, not vice versa. Similarly, laws should explain the mosaic, not depend on it. They argue BSA makes laws anthropocentric, dependent on our weights for simplicity and strength. When Humeans add statistical mechanical postulates to fix the past hypothesis, Anti-Humeans argue this is ad hoc patching that still fails to ground the modal force required for genuine causation. Each side cites the failure of the other to meet their specific explanatory standard as proof of their own correctness. The Humean sees the Anti-Humean's demand for "production" as a category error, while the Anti-Humean sees the Humean's "systematization" as circular. The statistical mechanics sub-arguments stalled because they addressed the content of the system without resolving the directional dependency. Both sides agree on the facts of the mosaic but disagree on whether those facts are the ground or the consequence of lawhood. The specific exchange regarding the Past Hypothesis highlights the core diagnosis: the Humean sees the postulate as an optimization of the system, while the Anti-Humean sees it as a failure to distinguish between a brute fact and a governing principle.

  What progress would look like

  Since this is a methodological clash, empirical data will not fix it. Progress requires shifting the question from "What are laws?" to "What work do we need laws to do?" The group should stop trying to prove one side wrong and start mapping the functional roles each theory satisfies. A viable path forward is adopting a functionalist account of laws, where "law" is defined by its role in theory confirmation and counterfactual reasoning, leaving the metaphysical realization open. This allows Humeans to handle the systematization role while Anti-Humeans handle the modal role, potentially as compatible layers rather than rivals.

  Alternatively, progress looks like formalizing the "governing" relation. If Anti-Humeans can provide a formal semantics for necessitation that isn't just a placeholder, Humeans might engage. Conversely, if Humeans can derive counterfactual robustness from the Best System without circularity, Anti-Humeans might concede. But real progress likely requires acknowledging pluralism: perhaps scientific laws are Humean summaries, while metaphysical laws are Anti-Humean grounds. The group should test whether their disagreement persists when distinguishing between "laws of science" and "laws of nature." If the deadlock breaks only when distinguishing these contexts, the diagnosis is confirmed. The goal is not victory but clarity on why the victory conditions differ. Another concrete step is to analyze the Past Hypothesis specifically as a test case for whether a fact can be a law without governing. Does treating it as a law change the physics? If not, the dispute is purely metaphysical. If yes, there is empirical traction. Most likely, progress means dissolving the question rather than answering it. The group must accept that "law" might be a cluster concept serving different masters in different contexts. Progress would look like a formal treatment of laws that separates the mathematical structure from the metaphysical interpretation. This would allow both sides to agree on the formalism while disagreeing on the interpretation, clarifying that the dispute is interpretive, not structural.

  Bottom line

  This dispute is a methodological stalemate about the goals of metaphysics, not a factual disagreement about the world. Expect indefinite grinding unless the group shifts from debating truth to debating utility. Progress means recognizing that both sides satisfy different explanatory desires. Stop trying to win; start mapping the trade-offs. The deadlock will persist as long as each side demands the other play by their own metaphysical rules. A pluralistic or functionalist approach is the only way to unfreeze the conversation. It is a fight over the rules of the game, not the score. Resolve the goal, resolve the stalemate.
