  # JOINT STATEMENT ON BEHAVIORAL GENETICS AND HERITABILITY
  **Date:** October 24, 2023
  **Parties:** Dr. Elena Rosenthal (Behavioral Geneticist) & Dr. Marcus Thorne (Social Epidemiologist/Critic)
  **Subject:** Findings following one year of adversarial collaboration regarding the interpretation, validity, and utility of heritability estimates in human behavioral traits.

  ## PREAMBLE
  For twenty-four months, we engaged in a contentious debate regarding the validity of behavior genetics. Dr. Rosenthal argued that heritability estimates are robust, replicable statistics essential for understanding human development, often rejected due to ideological discomfort. Dr. Thorne argued that the field relies on fragile assumptions, conflates statistical variance with biological causality, and produces numbers that are easily misused to justify inequity.

  Over the past year, we have reviewed primary literature, re-analyzed shared datasets, and clarified definitions. This document represents our current consensus, our remaining disagreements, and the specific empirical tests we agree would resolve them. We note that while our philosophical priors remain distinct, our understanding of the *math* and the *limits* of that math has converged significantly.

  ---

  ## PART I: AREAS OF AGREEMENT
  *Both parties sign the following technical claims. We acknowledge that popular discourse (including some textbooks and media coverage) frequently violates these distinctions.*

  1.  **Definition of Heritability ($h^2$):** We agree that heritability is a ratio of variances ($V_G / V_P$) specific to a particular population at a particular time in a particular range of environments. It is not a measure of how "genetic" a trait is in an absolute or developmental sense.
  2.  **No Inference to Individuals:** We agree that $h^2$ applies to variance *between* people, not to the development of a trait *within* a person. A heritability of 0.60 for height does not mean "60% of an individual's height is due to genes."
  3.  **Malleability:** We agree that high heritability does not imply immutability. A trait can be 100% heritable and 100% modifiable (e.g., Phenylketonuria is genetic, but dietary intervention prevents the phenotype). The magnitude of $h^2$ does not predict the success of an intervention.
  4.  **Between-Group Differences:** We agree that within-group heritability estimates provide no logical basis for inferring the cause of differences *between* groups (e.g., nations, socioeconomic classes, or racialized groups). High $h^2$ within Group A and Group B is compatible with the mean difference between A and B being entirely environmental.
  5.  **Context Dependence:** We agree that heritability estimates can change if the environmental variance changes. If environments become more uniform, $h^2$ rises; if environments become more unequal, $h^2$ may fall.
  6.  **Measurement Error:** We agree that measurement error in phenotypic assessment (e.g., noisy IQ tests, self-reported behavior) inflates the "non-shared environment" estimate and deflates heritability. Both sides concede that some historical estimates failed to adequately correct for this.
  7.  **GWAS Limitations:** We agree that current Polygenic Scores (PGS) capture only a portion of SNP-based heritability and are heavily confounded by population stratification and ancestral geography. They are not yet diagnostic tools for individuals.
  8.  **The "Genetic" Label:** We agree that labeling a variance component "genetic" is a statistical shorthand for "transmitted via DNA," but it does not exclude environmental mechanisms (e.g., gene-environment correlation) where genes shape the environment an individual experiences.

  **Concession Note:** Dr. Rosenthal concedes that the "pop-science" presentation of heritability often omits points #1, #4, and #5, leading to deterministic interpretations she does not endorse. Dr. Thorne concedes that the mathematical framework of variance decomposition is internally consistent and that twin correlations *do* empirically falsify models assuming 100% shared environmental determination of adult personality.

  ---

  ## PART II: TABLE OF DISAGREEMENTS
  *Residual disputes where priors lead to different interpretations of the same data. Phrasing is negotiated to ensure neither side feels strawmanned.*

  | Topic | Dr. Rosenthal's Position (BG) | Dr. Thorne's Position (Critic) |
  | :--- | :--- | :--- |
  | **1. Twin Design Assumptions** | Violations of the Equal Environments Assumption (EEA) exist but are minor. Adjustments for measured environment similarity rarely reduce $h^2$ estimates substantially. | The EEA is systematically violated in ways difficult to measure (e.g., evocative responses to identical genotypes). Current corrections are insufficient, likely inflating $h^2$ by 20-40%. |
  | **2. Missing Heritability** | The gap between twin-based $h^2$ and GWAS-based $h^2$ is closing via larger samples and rare variant detection. It is largely a power issue. | The gap may reflect structural flaws (e.g., non-additive effects, epistasis) rather than just power. Assuming additivity to bridge the gap may be modeling error. |
  | **3. PGS Causal Interpretation** | Within-family GWAS designs largely control for population structure and dynastic effects. Remaining PGS prediction is primarily direct biological effect. | Within-family designs control for *some* stratification but retain confounding via assortative mating and indirect genetic effects (parental genotype shaping child environment). |
  | **4. Policy Utility** | Knowing $h^2$ helps tailor interventions (e.g., identifying traits requiring personalized vs. universal approaches). Ignoring genetics reduces efficacy. | Knowing $h^2$ distracts from modifiable structural causes. Policy should focus on mean shifts via environment regardless of variance decomposition. |
  | **5. GxE Interaction** | Gene-Environment *interaction* (statistical) is detectable but explains a small fraction of variance compared to main effects. | GxE is pervasive and fundamental. Ignoring it renders the main effect estimates (heritability) unstable and context-free. |

  ---

  ## PART III: THE CRUXES
  *Specific empirical questions where new evidence would cause at least one party to update their position significantly. We have pre-registered our predictions.*

  ### Crux 1: The Scarr-Rowe Hypothesis (SES Moderation)
  **Question:** Does the heritability of cognitive ability vary systematically by Socioeconomic Status (SES)?
  **Relevance:** If $h^2$ drops significantly in low-SES environments, it suggests that environmental deprivation suppresses genetic potential, validating the Critic's view that "heritability is a privilege of stable environments." If $h^2$ is stable, it supports the Geneticist's view of robust genetic influence across contexts.

  *   **Agreed Evidence:** A meta-analysis of twin/adoption studies in non-WEIRD (Western, Educated, Industrialized, Rich, Democratic) populations and low-SES US cohorts, specifically testing the interaction term $V_G \times SES$.
  *   **Rosenthal's Prediction:** The interaction effect is small. $h^2$ for cognition will remain >0.40 even in the lowest SES quintiles.
  *   **Thorne's Prediction:** The interaction effect is large. $h^2$ for cognition will drop to <0.20 in the lowest SES quintiles (environmental variance swamps genetic variance).
  *   **Update Condition:** Rosenthal will concede that "heritability estimates from mixed-SES samples mask critical deprivation effects" if Thorne's prediction holds. Thorne will concede that "genetic differences remain a major source of variance even under deprivation" if Rosenthal's prediction holds.

  ### Crux 2: Direct vs. Indirect Genetic Effects (Dynastic Effects)
  **Question:** How much of a Polygenic Score's prediction of educational attainment is due to the child's biology vs. the parents' genotype creating a favorable environment?
  **Relevance:** If PGS works mostly via indirect paths (parents passing on both genes and privilege), the Critic's claim that "genes are just laundering social advantage" gains weight. If PGS works via direct paths, the Geneticist's claim of biological causality holds.

  *   **Agreed Evidence:** Comparison of Between-Family vs. Within-Family GWAS effect size attenuation for Educational Attainment. Specifically, looking at sibling-difference models.
  *   **Rosenthal's Prediction:** Within-family effect sizes will retain at least 70% of the between-family predictive power. Direct effects dominate.
  *   **Thorne's Prediction:** Within-family effect sizes will retain less than 50% of the between-family predictive power. Indirect (dynastic/stratification) effects dominate.
  *   **Update Condition:** If attenuation is >50%, Rosenthal agrees to describe PGS as "family-background predictors" rather than "genetic propensity" in public communications. If attenuation is <30%, Thorne agrees that direct biological pathways are the primary driver of PGS utility.

  ### Crux 3: Intervention Responsiveness
  **Question:** Is there a negative correlation between a trait's heritability and its responsiveness to environmental intervention?
  **Relevance:** This tests the "determinism" fear. If high $h^2$ traits are harder to change, the statistic has negative utility for social planning. If there is no correlation, the statistic is neutral.

  *   **Agreed Evidence:** A systematic review of RCTs on behavioral traits (e.g., reading ability, impulsivity, BMI) comparing effect sizes against the baseline heritability of the trait.
  *   **Rosenthal's Prediction:** Zero correlation. High $h^2$ traits (like BMI) can be shifted significantly with sufficient environmental force.
  *   **Thorne's Prediction:** Moderate negative correlation. High $h^2$ indicates a trait is buffered against environmental perturbation, making interventions less cost-effective.
  *   **Update Condition:** Thorne will drop the objection that "heritability implies futility of intervention" if the correlation is effectively zero. Rosenthal will acknowledge that "high heritability signals entrenched developmental systems" if the correlation is strong.

  ---

  ## PART IV: VERBAL AND SEMANTIC RESOLUTIONS
  *We identified that approximately 30% of our two-year argument was due to differing definitions of key terms.*

  1.  **"Cause":**
      *   *Conflict:* Rosenthal used "cause" to mean "statistical predictor in a variance model." Thorne heard "cause" as "developmental necessity" or "fixed destiny."
      *   *Resolution:* We will use **"Variance Explanation"** for $h^2$ contexts and **"Developmental Mechanism"** for biological pathways. We agree that DNA is a necessary condition for all behavioral traits, making "genetic cause" trivial in the developmental sense but informative in the variance sense.

  2.  **"Informative":**
      *   *Conflict:* Rosenthal argued heritability is "informative" because it reveals biological reality. Thorne argued it is "uninformative" because it does not guide specific policy levers.
      *   *Resolution:* We agree heritability is **etiologically informative** (tells us about sources of difference) but not **prescriptively informative** (does not tell us what to do). Future debates will specify which type of information is being claimed.

  3.  **"Environment":**
      *   *Conflict:* Thorne defines environment as "structural/policy factors" (schools, poverty). Rosenthal defines environment statistically as "everything not DNA" (including accidents, peer groups, noise).
      *   *Resolution:* We will distinguish **"Shared/Structural Environment"** (policy-relevant) from **"Non-Shared/Idiosyncratic Environment"** (harder to policy-target). We agree that behavior genetics often lumps these together, obscuring policy relevance.

  ## CONCLUSION
  We remain distinct in our weighting of risks. Dr. Rosenthal worries that underestimating genetic influence leads to ineffective interventions and stigma against those struggling despite support. Dr. Thorne worries that overestimating genetic influence leads to fatalism and the neglect of structural reform.

  However, we agree that the science is best served by precise claims, pre-registered predictions, and an admission that heritability is a property of a population's history, not a law of nature. We commit to publishing our Cruxes analysis jointly, regardless of the outcome.

  **Signed,**

  *Elena Rosenthal*
  *Marcus Thorne*
