answer: |-
  The distinction between treating moral judgments as discoveries waiting to be found versus decisions waiting to be made does the most sorting work because it dictates whether you see disagreement as error or difference.

  ### The Conscience Quiz

  **1. The Secret Siblings**
  Two adult siblings decide to have sex once; they use reliable contraception, keep it secret, and both enjoy it without regret. No one is harmed, and no one finds out.
  *   A. It is still wrong, even if no one can point to any harm.
  *   B. If there is truly no harm, it is not wrong; my feeling is just a habit.
  *   C. It is wrong because it violates a natural order, even without harm.

  **2. The Order Effect**
  You prefer Charity A over Charity B. Later you learn your preference reverses if you hear about Charity B first.
  *   A. My judgment is shaky; the order shouldn't change the answer.
  *   B. My feeling is still real, even if the trigger is arbitrary.
  *   C. I need to find a reason beyond the order to decide.

  **3. The Beneficiary**
  You feel a certain practice is vile. You then learn your own social group benefits financially from that practice.
  *   A. That explains my judgment; it is probably bias, not a real wrong.
  *   B. It is still wrong; the benefit just makes me notice it more.
  *   C. It might be wrong, but I can't trust my own certainty anymore.

  **4. The Time Traveler**
  You believe a specific action is wrong. You know that if you had been born 500 years ago, you would believe it is right.
  *   A. That suggests my view is just a product of my time, not a universal rule.
  *   B. They were wrong then; I am right now, regardless of when I was born.
  *   C. It shows morality changes, so there is no single right answer.

  **5. The End of Slavery**
  Think about when society stopped accepting slavery.
  *   A. We found a rule that was waiting for us.
  *   B. We built a rule that didn't exist before.
  *   C. We realized a rule we had ignored.

  **6. The Omniscient Advisor**
  Imagine an advisor who knows every non-moral fact (physics, psychology, history) about a situation.
  *   A. Even with all facts, they would still have to choose what matters most.
  *   B. With all facts known, the right choice is already settled for them.
  *   C. They would know what we say is right, but not what is right.

  **7. The Stalemate**
  Two people know all the same facts about a dilemma but disagree on what to do.
  *   A. One of them is mistaken, like being wrong about math.
  *   B. They just want different things; neither is mistaken.
  *   C. They are both right relative to their own standards.

  **8. The Reason to Act**
  You judge that an action is wrong. Do you automatically have a reason not to do it?
  *   A. Yes, judging it wrong gives me a reason automatically.
  *   B. Not necessarily; I might judge it wrong but not care.
  *   C. Only if I already care about morality.

  **9. Moral Progress**
  Compare morality today to 1,000 years ago.
  *   A. We are closer to the right way than they were.
  *   B. We are just different, not closer.
  *   C. We are better, but "closer" isn't the right word.

  **10. The Aliens**
  Imagine aliens who feel no empathy and never make moral judgments.
  *   A. They are blind to a requirement for living well.
  *   B. They are just different; rules are for humans.
  *   C. They are making a mistake in reasoning.

  ***

  ### Scoring Key and Logical Space

  **The Logical Space**
  The quiz maps three axes:
  1.  **Status:** Is the judgment *Found* (waiting there) or *Made* (created by us)?
  2.  **Authority:** Is the judgment *Binding* (gives reasons to all) or *Optional* (depends on desire)?
  3.  **Stability:** Does the judgment survive *Reflection* (flip cases undermine it) or *Persist* (flip cases are noise)?

  **Position Mapping**
  *   **Naturalist Moral Realism:** Found, Binding, Persist. (Answers: 1A/C, 2A, 3B, 4B, 5A/C, 6B, 7A, 8A, 9A, 10A)
  *   **Constructivism:** Made (by reason), Binding, Persist. (Answers: 1A, 2A, 3A/C, 4A/C, 5B, 6B, 7A, 8A, 9C, 10C)
  *   **Expressivism (Quasi-Realist):** Made (attitude), Binding (internally), Persist. (Answers: 1A, 2B, 3A, 4A, 5B, 6A, 7B, 8A, 9B, 10B)
  *   **Sentimentalism:** Made (emotion), Binding (if felt), Reflect. (Answers: 1A, 2B, 3A, 4A, 5B, 6A, 7B, 8A/B, 9B, 10B)
  *   **Plain Subjectivism:** Made (preference), Optional, Reflect. (Answers: 1B, 2B, 3A, 4A, 5B, 6A, 7B, 8B, 9B, 10B)
  *   **Error Theory:** Made, None Binding, Reflect. (Answers: 1B, 2A, 3A, 4A, 5B, 6A, 7B, 8B, 9B, 10B)

  **Empty Combinations**
  *   **Found + Optional:** (You think rules are waiting to be found, but you don't have to follow them.) *Diagnosis:* Incoherent. If a rule is "found" like a law of physics, it applies regardless of care.
  *   **Made + Binding + Persist + Flip-Undermined:** (You think we make the rules, they bind everyone, they are stable, but arbitrary triggers change them.) *Diagnosis:* Unattractive. This claims stability while admitting instability.
  *   **Found + Made:** (You think we built the rule, but it was waiting there.) *Diagnosis:* Unexplored/Mystical. Only viable if "we" are part of the fabric of the universe (Idealism), but generally contradictory in this framework.

  **Indistinguishable Positions**
  *   **Sentimentalism vs. Expressivism:** Both treat judgments as human-made attitudes that survive reflection. The quiz cannot separate them because both answer "Made" and "Binding" in practice.
      *   *Follow-up Question:* "When you say 'Murder is wrong,' are you describing your feeling, or are you telling others what to do?" (Sentimentalist: Describing feeling; Expressivist: Telling others).
  *   **Realism vs. Constructivism:** Both treat judgments as Binding and Stable. Both see disagreement as error.
      *   *Follow-up Question:* "If all humans vanished, would moral requirements still exist?" (Realist: Yes; Constructivist: No, because reasoners are gone).

  **Position Leaves (Awkward Commitments)**
  *   **Naturalist Moral Realism:** You must explain where these moral rules live if not in the human mind.
  *   **Constructivism:** You must explain why a rule built by reason binds someone who rejects that reasoning.
  *   **Expressivism (Quasi-Realist):** You must explain how a statement of feeling can be "mistaken" without a fact to measure it against.
  *   **Sentimentalism:** You must accept that if your emotions change, the wrongness changes.
  *   **Plain Subjectivism:** You must accept that no one can ever be mistaken about morality, only different.
  *   **Error Theory:** You must accept that every moral conversation everyone has ever had is systematically false.

  **Inconsistency Diagnosis**
  *   **Realist on Slavery (5A) + Subjectivist on Incest (1B):** You believe some values are discovered truths while others are personal habits. *Reveals:* Domain-specific realism; you trust reason in politics but feeling in private life.
  *   **Binding on Judgment (8A) + Optional on Aliens (10B):** You believe morality binds you but not beings like you. *Reveals:* Human-centric universalism; you think morality is objective for humans but not for the universe.
  *   **Stable on History (4B) + Unstable on Order (2A):** You think your view survives centuries but not sentence order. *Reveals:* Confidence bias; you trust broad cultural shifts but doubt your immediate cognitive processing.
  *   **Found (5A) + Made (6A):** You think slavery was discovered, but the Advisor still has to choose. *Reveals:* Confusion about facts; you treat some values as physical objects and others as preferences.
