      Ruth stood in the doorway of the sunroom. The air smelled of lavender and stale dust. At the table, Margaret sorted fabric swatches into piles: navy, indigo, sky. She hummed, a low vibration in her throat, pausing only to watch the goldfinch at the feeder.

      *October 14, 2006. I am drawing a boundary. The person who wakes up in this body after the mind goes is not me. She is a tenant. I own the house; she occupies it. Tenants do not amend the lease. They do not negotiate terms based on weather.*

      The doctor's voice mail blinked on the kitchen counter. *Urinary tract infection, spreading to the chest. Simple course of antibiotics. She'll rally.* Seven days. That was the lease term for a week of life.

      Margaret held up a crimson square to the light. She smiled. It was not the tight, polite smile of the woman who had raised Ruth, but something open, unguarded. A stranger's smile.

      *Dad lingered for months. A hollowed-out shell waiting for permission to stop. I will not grant that permission to my successor. She is a stranger. Her comfort is irrelevant to my integrity. If I let her stay, I die twice.*

      Ruth stepped into the room. The floorboards creaked. Margaret looked up, eyes clouded like old milk. There was no recognition. Only a mild curiosity about the interruption. Margaret patted the chair beside her.

