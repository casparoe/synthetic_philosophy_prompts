      *If she is happy, let her be happy. But not at the cost of the woman who built the walls. The lease holds. Do not let sentiment evict me.*

      The prescription pad sat on the table, next to the swatches. Ruth's pen was in her pocket. The directive was in her bag, heavy as a stone. To sign was to honor the woman who wrote the diary. To withhold was to protect the woman sorting the red fabric.

      Margaret sneezed, a wet, rattling sound that shook her thin shoulders. She didn't notice. She reached for a grey square. She hummed again.

      Ruth took the pen from her pocket. She capped it. She uncapped it. Outside, the goldfinch flew away. Margaret waited for the next color.

