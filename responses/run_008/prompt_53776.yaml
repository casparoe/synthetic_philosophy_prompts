          *   Philosophical Angle: One commissioner cites Karl Jaspers' *The Question of German Guilt* (criminal, political, moral, metaphysical). Wants to focus on *political guilt* (institutional succession).
          *   Attorney's Preference: Drop "guilt," frame as "investment in historically disinvested neighborhoods."
          *   Community Reps' Preference: Don't launder the point; acknowledge wrongdoing.
      *   **Requirements:**
