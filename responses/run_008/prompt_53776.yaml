      *   Need a compromise that satisfies legal constraints while honoring moral obligations.
      *   *Apology:* Acknowledge continuity despite legal technicalities. Use "responsibility" rather than strictly "guilt" if needed, but keep the moral weight.
      *   *Payment:* Needs to be substantive but feasible. Let's suggest a specific figure or percentage of the budget, funded by bonds or surplus.
      *   *Jaspers:* Use the "political guilt" concept to bridge the legal gap without getting bogged down in metaphysics.
      *   *Successor Entity:* Acknowledge the legal break but argue for moral/political continuity.

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose (recommendation for vote).
