      TO: Reparations Commission
      FROM: [Commissioner Name]
      DATE: October 24, 2023
      SUBJECT: Final Recommendation for Vote

      We cannot vote on dollars until we resolve the liability question. Our City Attorney argues the 1960 re-incorporation severed legal responsibility for 1923. Our community representatives argue continuity of identity renders this distinction moot. Both points hold weight, but neither solves the problem alone.

      Here is my recommendation for a path forward that respects the law while honoring the truth.

      **1. The Successor Entity & Jaspers**
      The Attorney is correct on corporate law: the 1960 municipality is a distinct legal person from the 1923 entity. However, Commissioner [Name]'s invocation of Karl Jaspers is the key to bridging this gap. Jaspers distinguishes *criminal guilt* (individual acts) from *political guilt* (collective responsibility for the state's conduct). Criminal guilt dies with the perpetrators. Political guilt attaches to the citizenry and institutions that inherit the state's power and assets.

      We inherited the 1923 city's land, archives, police force, and seal. We benefit from the cleared land and suppressed competition that followed the burning. Therefore, while we may not be *criminally* liable, we bear *political* responsibility. We should not wave off the attorney's argument as a trick; it defines the limit of our legal exposure. But it does not define the limit of our moral obligation. We acknowledge the legal discontinuity to satisfy counsel, but assert political continuity to satisfy justice.

      **2. Apology Language**
      The Attorney suggests framing payments as "investment in historically disinvested neighborhoods." Community reps rightly fear this launders the history.
      *Recommendation:* We adopt hybrid language. The resolution must state: "While the modern corporation is distinct from its predecessor, the City accepts political responsibility for the harms enabled by prior administrations." We will use the word "reparations" in the public title, but define the disbursement as "restorative investment" in the legal text to insulate against lawsuits. This acknowledges the debt without admitting strict legal liability.

      **3. Financial Recommendation**
      Vague promises undermine trust. We need a concrete figure.
      *   **Amount:** $25 million principal.
      *   **Source:** General Obligation Bonds backed by property tax surplus, not operating budget (to avoid cutting current services).
      *   **Distribution:** Direct grants to descendants of 1923 district residents (40%) and community land trust endowment (60%).

      **Conclusion**
      If we hide behind the 1960 charter break, we validate the idea that municipalities can evade justice by going broke and restarting. If we ignore the legal break, we invite litigation that stalls everything. We must accept political guilt for what we inherited, even if we didn't commit the crime.

      Vote yes on this framework. It protects the city legally while clearing the debt morally.

