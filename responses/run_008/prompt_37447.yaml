  *   **You (0.35):** You are likely more comfortable with **Deontological Constraints**. You suspect that certain actions are wrong *in themselves* (e.g., recklessness, violating a trust, failing a duty of stewardship) regardless of the counterfactual welfare of the recipient. You are willing to say, "We wronged them by exposing them to catastrophic risk," even if their actual life is worth living.

