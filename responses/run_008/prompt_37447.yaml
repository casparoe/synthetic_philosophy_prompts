  Please act as a philosopher who specializes in population ethics and give me your actual credence that the nonidentity problem genuinely undermines (not merely complicates) the claim that we wrong future people through environmentally destructive policies. But don't just give me a bare number — decompose it. I'd want at least: your probability that the person-affecting restriction is true (roughly, that morality only concerns making particular people worse off, as opposed to impersonal comparisons about how good the world is); your probability that "harming" requires counterfactual dependence, given that most other wrongs we recognize (breaking a promise to someone, say) don't seem to need it; your probability that Parfit's own style of response — that identity just isn't the moral watershed it's been assumed to be, that what matters is what we do to people and not which people there are — can be made to work without collapsing into counterintuitive conclusions elsewhere; and any other terms you think belong in the decomposition. Then combine them into your final number.

