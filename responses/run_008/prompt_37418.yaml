  You are right that Hume's pragmatic approach anticipates how we treat expertise in wine or medicine. However, the circularity objection is not merely technical; it strikes at the normative heart of his project. In medicine, we identify experts by independent outcomes (patient health). In aesthetics, what is the independent outcome? If "good art" is defined solely by what judges approve, the standard lacks an external anchor beyond shared psychology.

  Your classmates highlight that Hume conflates *consensus* with *correctness*. Just because qualified critics converge doesn't prove they are tracking a truth rather than sharing a cultural bias. Hume offers a "deflated objectivity" (intersubjective stability), but this leaves the metaphysical question open: Is beauty mind-independent? Hume says no; your classmates want to know if his standard preserves enough normativity to matter.

  Is the question settled? No. Contemporary aesthetics remains divided between realists (who find Hume's subjectivism insufficient) and projectivists (who accept his deflation). Hume successfully changes the terms of the debate from metaphysical properties to human psychology, but he does not prove that aesthetic judgments are truth-apt in the way geometric ones are. The Milton-Ogilby case shows consensus, not necessarily truth. So, while Hume provides the best framework for discussing taste without metaphysics, the objectivity question remains genuinely open because convergence does not equal correctness without an independent standard to converge upon. Hume solves the *social* problem of disagreement, but not the *philosophical* problem of truth.
