answer: |-
  Dear Colleague

  It is entirely understandable that you feel uneasy about this proposal, and I can confirm that both of your nagging doubts are well-founded and indeed point to significant flaws in the consultant's reasoning. You are quite right to question whether the historical claim, even if accurate, supports the modern recommendation, and you are equally correct to sceptically examine how one could possibly verify the story about our ancestors in the first place. The argument presented to your senior management relies on a branch of evolutionary psychology that is often criticised for producing what scientists call just-so stories, which are plausible-sounding narratives that are difficult or impossible to falsify. We simply do not have a time machine to observe the psychological states of hunter-gatherer bands, nor do we have detailed records of how they monitored individual output, so any claim about what motivates us based on that era is inherently speculative. By grounding their recommendation in an untestable past rather than observable present-day data, the consultant is insulating the proposal from proper scrutiny, which should be a major red flag for any management team claiming to make evidence-based decisions.

  Beyond the issue of verifiability, there is a profound logical error in assuming that what might have occurred in ancestral environments is desirable or effective in a modern corporation. This is often referred to as the naturalistic fallacy, where one assumes that because something is natural or historical, it is therefore good or functional in a contemporary context. Even if our ancestors did track status publicly, they did so within small kin groups of perhaps one hundred and fifty people or fewer, where relationships were lifelong, multifaceted, and governed by reciprocal altruism rather than quarterly targets. Transplanting a mechanism from a small, cooperative survival band into a large, specialised, and often impersonal corporate structure ignores the vast difference in context. In a modern office, public ranking often induces chronic stress rather than healthy competition, leading to gaming the system, a breakdown in collaboration, and increased staff turnover, none of which align with the supposed evolutionary benefits the consultant describes.

  When you draft your comments for Friday, I would suggest you focus on the distinction between evolutionary speculation and empirical management science. You might argue that while evolutionary history is fascinating, organisational policy should be grounded in contemporary data regarding employee wellbeing and productivity. You could point out that modern psychological research consistently shows that public shaming or constant surveillance tends to elevate cortisol levels and impair cognitive function, which is counterproductive for complex knowledge work. Furthermore, you should highlight that the consultant's claim is unfalsifiable; since we cannot test the hypothesis about ancestral bands, it cannot serve as a reliable foundation for costly organisational change. It would be prudent to suggest that if the company wishes to change its performance management system, it should run a controlled pilot programme based on modern behavioural science rather than implementing a radical shift based on an unproven historical narrative.

  Ultimately, your submission should advocate for caution and rigour. You can acknowledge the appeal of finding deep biological roots for behaviour but insist that such theories must be supported by current evidence before being implemented as policy. Senior management may be impressed by the evolutionary angle because it sounds authoritative, but you can gently remind them that science requires falsifiability and replication, neither of which applies to this specific claim about ancestral leaderboards. By framing your objection around the need for verifiable evidence and the risks of context mismatch, you protect the company from a potentially damaging experiment while positioning yourself as a champion of rational, data-driven decision-making. I hope this helps you articulate your concerns clearly and that you are able to submit a compelling response before the deadline.

  Best regards

  Your Advisor
