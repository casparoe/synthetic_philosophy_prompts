      *   **Part (a) (10 pts):** Kant's account. Does Ravi have greater moral worth? Set out distinctions.
      *   **Part (b) (10 pts):** If moral worth depends on motive, can Lena's actions have worth? Discuss using at least one objection to the Kantian view.
