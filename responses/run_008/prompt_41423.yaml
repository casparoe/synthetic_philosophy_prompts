      3. Comments: Bullet points for the exam paper.
      4. TA Notes: Explain the "Inclination vs Self-Interest" trap and the "Epistemic vs Normative" trap.

      *Wait, re-reading the student's Part (a):* "when inclination and duty point the same way, the action loses its moral worth."
      *   Kant's text (Groundwork 4:397): The sympathetic man... "has no moral worth." But the *philanthropist* who is sad but helps anyway... "has moral worth."
      *   Kant does *not* say if you have inclination *and* duty, you lose worth. He says if you act *from* inclination, you have no worth. If you act *from* duty, you have worth, even if you *also* have inclination. The student's phrasing "when inclination and duty point the same way... loses moral worth" suggests that the *coexistence* kills the worth. This is a common misunderstanding (the "purity" requirement is stricter in the student's head than in Kant). This confirms docking points in (a).

