          3.  *Eliminativist:* Omissions never cause. Lifeguard liability is for breach of duty/contract, not causing harm.
      *   **Tasks:**
          1.  Reconstruct the implicit theory the practice *needs* vs. what it sits comfortably with vs. where it's underdetermined.
          2.  Analyze coherence.
