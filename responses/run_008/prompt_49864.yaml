          2.  **Regulatory Standing/Reliance:** If epidemiological attribution is normative, plaintiffs might challenge the "injury" basis of regulations differently, or conversely, regulators might be more cautious about claiming "deaths caused."
          3.  **Criminal Omissions:** The barrier to criminalizing bystander inaction lowers conceptually (causation is met), shifting the debate entirely to liberty interests.

  7.  **Refining the Argument (Self-Correction during drafting):**
