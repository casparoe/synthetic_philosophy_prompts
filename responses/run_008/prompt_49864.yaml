      *   *Theory 1 (Straightforward Counterfactual + Duty Filter):*
          *   *Fit:* This is the dominant academic explanation (e.g., Hart & Honoré, though they lean towards 2; many modern law & econ scholars). It says causation is factual (but-for), but liability requires duty.
          *   *Problem:* The prompt notes courts say the bystander's omission is *not treated as a cause*. If the theory were purely factual causation + separate duty, courts would say "He caused it, but isn't liable." They often say "No proximate cause" or conflate duty and cause.
          *   *Verdict:* The practice *says* it's Theory 2 or 3, but *operates* like Theory 1 with a heavy normative overlay.

      *   *Theory 2 (Restricted Counterfactual/Normality):*
          *   *Fit:* This aligns best with the "duty as cause" language. Hart & Honoré's "Intervening Acts and Responsibility" argues that we select causes based on what is "normal" vs. "abnormal." A lifeguard *not* acting is abnormal; a bystander *not* acting is normal.
          *   *Verdict:* This is the strongest candidate for the *implicit* metaphysical/normative hybrid the law actually uses. It explains why the "but-for" test applies to the lifeguard but "fails" for the bystander (not because the physics differ, but because the causal selection differs).

      *   *Theory 3 (Eliminativist):*
          *   *Fit:* Philosophically rigorous (no negative facts), but legally awkward. Tort law is built on "causing harm." Saying "you didn't cause harm, but pay for it" undermines the corrective justice structure.
          *   *Verdict:* The practice does *not* need this. It would require too much doctrinal rewriting (e.g., changing "wrongful death" to "breach of statutory duty" in all omission cases).

  3.  **Synthesize the "Implicit Theory":**

      *   The law operates on a **Hybrid Normative-Counterfactual Theory (Variant of Theory 2)**.
      *   It *pretends* causation is purely physical (but-for) when there is a duty (lifeguard).
      *   It *pretends* causation is absent when there is no duty (bystander).
      *   Therefore, "Causation" in omission cases is a *conclusion*, not a *premise*. It is the label applied after the duty inquiry is satisfied.
      *   *Coherence:* It is *pragmatically* coherent (achieves desired liability limits) but *theoretically* incoherent (contradicts itself on the nature of cause). It relies on public health (Theory 1 style) for statistics while using Theory 2 logic for liability.

  4.  **Analyze "What Would Have to Change?" (Counterfactual vs. Normative Admission):**

