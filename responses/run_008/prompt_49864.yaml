      *   *Nuance:* The prompt asks about "what the practice actually needs." It *needs* Theory 2 to justify the distinction without lying about physics, but it *uses* Theory 1's language for the lifeguard.
      *   *Key Insight:* The law treats "Cause" as a *conclusion of liability*, not a *condition of liability* in omission cases.
