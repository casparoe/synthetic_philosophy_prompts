      *   *2. Regulatory Reliance/Statutory Interpretation:* Courts use CDC stats (Theory 1) to justify regulations, then use Tort logic (Theory 2) to limit liability. If unified under Theory 2, regulatory cost-benefit analysis might shift (acknowledging the normative weight of "attributed deaths").
