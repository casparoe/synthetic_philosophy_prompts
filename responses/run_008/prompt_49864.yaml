answer: |-
  The legal practice you describe operates on a **Hybrid Normative-Counterfactual Theory**, which is a sophisticated, if often unacknowledged, variant of your candidate **(2) Restricted Counterfactual Theory**.

  ### 1. Reconstruction of the Implicit Theory

  The law does not genuinely presuppose that omissions are physical "happenings" like bullet wounds (Theory 1), nor does it consistently treat omission-liability as mere compensation for breach without causation (Theory 3). Instead, the practice treats **causation as a conclusion of responsibility, not a premise of physics.**

  In the lifeguard case, the court applies the but-for test *because* the duty exists. In the bystander case, the court finds the but-for test "fails" *because* the duty is absent. The metaphysical status of the omission does not change between the two scenarios; only the normative status of the actor does. Therefore, the legal system presupposes that **causal selection is inherently normative.** It relies on a background framework of "normality" or "expectation" (Hart and Honoré's influence) where the lifeguard's inaction is a deviation from a prescribed norm (and thus a cause), while the bystander's inaction is part of the background noise of the world (and thus not a cause).

  However, the system is intellectually dishonest about this. It uses the language of Theory 1 (factual causation) when it wants to impose liability (the lifeguard) and the language of Theory 3 (no causation) when it wants to deny it (the bystander). It relies on public health metrics (Theory 1) to justify regulations, then switches to Theory 2 to limit tort liability.

  **Verdict on Coherence:**
  The practice is **pragmatically coherent but theoretically fractured.** It is stable because the "Duty" rule acts as a hard stop that prevents the theoretical contradiction from generating contradictory verdicts. Whether you say "The bystander caused the death but has no duty" (Theory 1) or "The bystander did not cause the death because he had no duty" (Theory 2), the result is non-liability. The system is underdetermined: Theories 1 and 2 license exactly the same outcomes in standard tort cases because the Duty rule swallows the Causation rule in omission scenarios.

  ### 2. What Would Have to Change?

  If the law replaced its implicit view with a **Pure Counterfactual-Dependence View (Theory 1)**:
  *   **The Bystander:** He is formally recognized as a cause of death. The "No Duty" rule remains the shield, but the rhetoric shifts from "he didn't do it" to "he did it, but wasn't required to."
  *   **The Flood:** The flood of liability is not actually unleashed because the Duty rule remains the gatekeeper. However, the *pressure* on the Duty rule increases. If everyone is a cause, the justification for limiting duty must be robust (liberty vs. welfare), rather than hidden behind a metaphysical denial of causation.
  *   **Doctrinal Shift:** "Proximate Cause" doctrines that currently mask duty analysis would be exposed.

  If the law admitted that **Omission-Causation is Norm Attribution (Theory 2 Generalized)**:
  *   **Public Health:** Epidemiological attributions ("10,000 deaths from non-vaccination") would be understood not as biological counts but as claims about *social responsibility*.
  *   **Regulatory Reliance:** The legal system's reliance on these numbers would be seen as importing a normative judgment into statutory interpretation.

  ### 3. Where Replacement Changes Outcomes (Not Just Vocabulary)

  While Theories 1 and 2 converge in standard negligence cases, they diverge in three specific areas where the definition of "cause" controls the outcome independent of the tort duty rule.

  **A. Statutory Interpretation in Criminal and Regulatory Law**
  Many statutes impose liability for anyone who "causes" a result (e.g., environmental crimes, felony murder, manslaughter) without explicitly defining the scope of omission.
  *   *Current Practice:* Courts often import tort "Duty" requirements into criminal statutes to avoid over-criminalization, effectively using Theory 2 to read a duty requirement into a statutory "causation" clause.
  *   *Change:* Under a **Pure Counterfactual View (Theory 1)**, a bystander who watches a victim drown *does* cause the death. If a statute punishes "causing death," the bystander fits the text. The court would be forced to acquit based on *lenity* or *constitutional liberty interests*, rather than hiding behind a finding of "no causation." This clarifies the legal reasoning: it admits the state is punishing status/inaction and must justify it as such, rather than pretending the defendant physically killed the victim.
  *   *Outcome:* Increased acquittals on *mens rea* or statutory grounds, but a clearer precedent that legislative silence on omissions does not imply criminal liability.

  **B. Pleading Standards and Discovery Leverage**
  In civil litigation, a motion to dismiss for "failure to state a claim" often turns on causation.
  *   *Current Practice:* A plaintiff suing a non-duty holder (e.g., a social media platform for user suicide, or a manufacturer for failing to recall) is often dismissed on the grounds that the omission was not the "proximate cause." This ends the case early and cheaply.
  *   *Change:* Under a **Pure Counterfactual View**, the plaintiff successfully alleges causation (but-for the platform's algorithm, the suicide didn't happen). The case survives to the **Duty** stage.
  *   *Outcome:* This forces courts to rule on **Duty** explicitly. Currently, courts avoid creating "no duty" precedents by ruling on causation. If forced to rule on Duty, we would see a richer body of case law defining the limits of affirmative obligations. This increases litigation costs for defendants but creates clearer regulatory boundaries for industries.

  **C. Regulatory Standing and Cost-Benefit Analysis**
  Agencies justify regulations using public health data that treats omissions as causes (Theory 1). Litigants challenge these regulations by claiming "no injury in fact" or "arbitrary and capricious" action.
  *   *Current Practice:* Courts accept the agency's "deaths attributable to inaction" as factual premises (Theory 1) to establish the "harm" the regulation prevents. But if a private party tries to sue based on that same harm, courts switch to Theory 2 (no duty, no cause).
  *   *Change:* If the legal system admits that "deaths attributable to non-vaccination" is a **Normative Attribution (Theory 2)**, it undermines the "objective fact" status of regulatory cost-benefit analyses.
  *   *Outcome:* This could alter **Standing Doctrine**. If the "harm" prevented by a regulation is admitted to be a normative construct (a failure of responsibility) rather than a physical event, plaintiffs challenging the regulation might argue the agency lacks empirical grounding for its "benefits." Conversely, it might empower plaintiffs to argue that if the state accepts the normative attribution for regulation, it must accept it for compensation (a "takings" or "equitable estoppel" argument). It forces the "Value of a Statistical Life" to be litigated as a moral weight, not an actuarial fact.

  ### Summary
  The law currently needs **Theory 2** to justify its distinctions but speaks **Theory 1** to maintain the fiction of objective causation. It is coherent only because the **Duty rule** acts as a circuit breaker. Moving to a Pure Counterfactual view would not flood the courts with liable bystanders, but it would strip away the metaphysical camouflage, forcing explicit rulings on **Statutory Scope**, **Duty Precedents**, and the **Normative Nature of Regulatory Benefits**.
