      *   *Selection:* I need the strongest two.
          *   (1) The *Duty/Cause Conflation*: Courts currently use "no causation" to avoid expanding duty. Explicitly separating them (Theory 1) or merging them (Theory 2) changes *how* judgments are written and appealed.
          *   (2) *Regulatory Cost-Benefit Analysis*: If "deaths caused by inaction" are admitted as normative, the "value of a statistical life" calculations in regulation might face different legal challenges (e.g., standing, injury in fact).
          *   (3) *Good Samaritan Laws:* If causation is admitted for bystanders (Theory 1), Good Samaritan laws shift from "immunity" to "no duty." Subtle but legally distinct.
          *   *Refinement:* Let's focus on **Proximate Cause doctrine** (often hides duty), **Statutory Standing** (reliance on epidemiological omissions), and **Criminal Complicity** (aiding by omission).

  6.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the tension. The law is schizophrenic.
      *   *Reconstruction:* Argue the law implicitly uses **Theory 2 (Restricted Counterfactual/Normative)** but *describes* itself as Theory 1 or 3 depending on convenience. It treats "cause" as a normative selection mechanism.
      *   *Coherence:* It is functionally coherent but intellectually dishonest. It creates a "causal fiction."
