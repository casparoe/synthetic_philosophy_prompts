  The painter traps the light, the poet speech,
  Each art a shadow of a worldly thing;
  They reach the Forms, but cannot go beyond reach,
  To touch the fire that makes the spirit sing.
  They are the copies of a copy made,
  Once removed from truth, twice removed from force;
  In static lines and colored light they fade,
  Tracing the phenomenon's cold course.

  But music leaps the ladder of the height,
  No concept stands between the note and soul;
  The bass is ground, pure inorganic weight,
  The melody, that wanders from the whole.
  No copy of the Idea, but Will's own sound,
  Where discord strives, and satisfaction's found.
