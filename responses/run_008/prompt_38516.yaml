      *   **The Roommate's View:** Illusionism about consciousness (specifically phenomenal consciousness/qualia). Key claims: The "movie in the head" (phenomenal experience) doesn't exist; it's a user interface/dashboard; consciousness is an illusion generated by brain processes; being fooled is a real process even if the content of the fooling isn't real.
      *   **The User's Objections:**
