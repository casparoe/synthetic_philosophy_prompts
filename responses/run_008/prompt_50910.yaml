answer: |-
  Here is the translation of Pearce's position into your vocabulary, followed by the residue report on what breaks when you try to run this code on standard RL assumptions.

  In RL terms, Pearce is proposing a fundamental reparameterization of the reward function R(s, a) such that the range of possible reward values is bounded below by a positive constant rather than zero or negative infinity. Currently, evolutionary fitness acts as the designer's objective, and pain or suffering functions as a dense negative reward signal penalizing states that threaten homeostasis or survival. Pearce argues this is a contingent implementation detail of the training process rather than a necessary feature of optimization. His proposal is to rewrite the agent's reward channel so that the minimum possible signal corresponds to what we currently call contentment, while preserving the derivative of the reward signal with respect to actions. He is claiming that motivation is driven by the gradient of the reward function, not the absolute magnitude. So, as long as dR/da is non-zero, the policy gradients will update, and the agent will continue to explore and exploit, even if R(s, a) is always positive. He is effectively proposing a form of reward shaping where the potential function Phi(s) is raised globally, but the relative advantages between actions remain intact to drive learning. When he distinguishes this from wireheading, he is arguing that the agent is not decoupling the reward signal from the state space entirely, but rather changing the mapping so that all reachable states map to positive valence while maintaining a strict ordering based on complexity or achievement. He wants the agent to maximize reward, but he wants the reward function itself to be engineered such that the minimum value is high, whereas standard RL assumes the reward function is fixed by the environment or the designer and wireheading is any attempt by the agent to modify that function to bypass the intended state-visitation distribution.

  Now for the residue report, starting with the exploration and motivation claim. Pearce's assertion that gradients of bliss preserve motivation translates to the claim that non-zero advantage estimates are sufficient for policy updates regardless of the baseline value of the critic. In your vocabulary, this is technically true; a policy gradient method does not care if the rewards are all positive, only that there is variance to compute an advantage. However, the distortion here is in the saturation dynamics. In biological systems, reward signals like dopamine are tied to prediction error. If the agent's value function V(s) converges to the high baseline because all states are good, the temporal difference error vanishes, and learning stops unless there is intrinsic exploration noise or a changing environment. Pearce is assuming the reward function can be engineered to be non-stationary in a way that constantly presents new gradients of improvement without ever dipping into the negative. In RL terms, this requires a reward function that expands its range dynamically or an environment that is infinitely complex. If the reward signal is capped or saturates, you run into the exact satiation problem you identified: the agent stops exploring because the marginal gain of new information is outweighed by the cost of leaving a high-reward state. Pearce is banking on the biological substrate having a different capacity for scaling reward sensitivity than our current artificial networks, essentially claiming the reward channel has infinite dynamic range upward but a hard floor downward. That is an empirical claim about neuroscience, not an RL theorem, and it does not translate cleanly because our agents usually have fixed precision and bounded reward scales.

  The wireheading clash is substantive, not verbal, and it comes down to alignment. In your field, wireheading is defined relative to the designer's intent. If the designer wants the agent to solve a task, and the agent hacks the reward sensor to get high numbers without solving the task, that is wireheading. Pearce is proposing changing the designer's intent. He is saying the objective function itself should be the agent's internal valence, not an external task like fitness or paperclip maximization. If you accept his premise that valence is the only moral good, then maximizing it is not wireheading, it is alignment. However, from the perspective of an external observer or an evolutionary framework, an agent that cannot experience negative feedback is brittle. It loses the error signal required to correct catastrophic failures. If an agent feels bliss while walking off a cliff because you reparameterized the reward function to forbid negative values, you have created a wireheaded agent relative to the survival objective. Pearce accepts this trade-off because he rejects survival as the ultimate objective. So the clash is that you view reward as a proxy for an external objective, while he views reward as the objective itself. This makes his proposal look like a bug in your vocabulary because your vocabulary assumes reward is a tool for control, whereas his assumes reward is the thing being controlled for.

  The biggest residue, however, is the phenomenological premise. In RL, reward is a scalar number. It has no qualitative properties. There is no fact of the matter about whether a reward of 1.0 feels like bliss or nothing at all. Pearce's entire argument rests on the claim that there is something it is like to be the agent, and that specific qualitative states (suffering) are intrinsically bad, regardless of their functional role. Your vocabulary cannot express this because it is functionally complete without it. You can build an agent that minimizes a loss function without assuming the agent experiences the loss as pain. Pearce is arguing for the abolition of the experience, not just the signal. If you translate his argument strictly into RL terms, it becomes a proposal to optimize a specific scalar field. But without the added axiom that the scalar field corresponds to conscious experience, the moral urgency vanishes. Why does it matter if the number is negative if no one feels it? Pearce's argument only gets going if you add the premise that the agent is a conscious subject and the reward signal is the substrate of its phenomenology.

  So to answer your final question directly: Pearce's argument is leaning on a premise that your vocabulary explicitly excludes, and if you force his argument into RL terms without adding that premise, it collapses into a description of a wireheaded agent with a shifted reward baseline. Does this mean your vocabulary is missing something real? It depends on whether you believe consciousness is real and morally relevant. If you are a functionalist, your vocabulary is sufficient, and Pearce is just describing a specific reward shaping technique with inflated ethical claims. If you are a realist about qualia, then your vocabulary is missing the only variable that actually matters to Pearce. Given that you work on RLHF, you are likely treating human feedback as a proxy for human preferences, which assumes humans have experiences worth optimizing. If you grant that humans have experiences, then Pearce is right that your vocabulary is incomplete because it treats the reward signal as instrumental rather than constitutive. However, from a strictly engineering standpoint, his claim that gradients of bliss preserve motivation is risky because it ignores the role of negative reward in robust error correction. You can translate his structural claims about reward ranges, but you cannot translate his ethical claims without importing a theory of consciousness that RL does not provide. The clash is substantive because he is optimizing for a property of the substrate that your field treats as irrelevant implementation detail. If you ignore the substrate, he is wrong. If the substrate is the point, you are missing the variable.
