answer: |-
  Here is the specification of desiderata for a theory of free will adequate to the novelist's craft. These are not metaphysical truths you must discover, but functional conditions your working theory must satisfy to sustain the narrative contract.

  ### I. The Desiderata

  **1. The Counterfactual Constraint**
  *   **The Case:** You have written the scene where she passes the gate and commits the betrayal. Yet, to maintain the integrity of the drama, the sentence "She could have turned back at the gate" must be assertable by the narrator (or thinkable by the reader) without lying.
  *   **Non-negotiable:** Yes. If this sentence is strictly false, the betrayal is not a choice but a plot mechanic, and the tragedy collapses into a weather report.
  *   **Prejudice Alert:** The demand that this "could have" must refer to a *metaphysical* branching of the universe (a literal fork in reality) is a prejudice of Libertarianism. The novelist requires the *truth of the assertion*, not necessarily the *metaphysics of the branch*.

  **2. The Discrimination Constraint**
  *   **The Case:** You must distinguish the coerced act (gun to head), the weak act (betrayal out of fear), the brainwashed act (programming), and the principled act (betrayal for a greater good). All are causally determined by prior states, but a theory that treats them as identical destroys moral texture.
  *   **Non-negotiable:** Yes. This is the raw material of your plot. If the theory flattens these distinctions, you cannot write scenes of judgment, remorse, or redemption.
  *   **Prejudice Alert:** The demand that the distinction requires the *absence* of causation is a prejudice. Causation can be internal (character) or external (coercion); the theory must allow you to track the source, not deny the chain.

  **3. The Aesthetic Tension Constraint**
  *   **The Case:** The reader must feel, on page 300, that the ending was inevitable ("Of course she did that; it is who she is"), while simultaneously having hoped, on page 150, that she would do otherwise.
  *   **Non-negotiable:** Yes. This is the specific pleasure of tragedy and high realism.
  *   **Prejudice Alert:** The demand that "inevitability" implies *fatalism* (that her efforts mattered less) is a prejudice. In narrative, inevitability is often a function of coherence, not compulsion.

  **4. The Developmental Constraint**
  *   **The Case:** Character is largely settled by midlife (justifying the betrayal as "in character"), yet people change slowly through events (justifying the possibility of redemption or degradation).
  *   **Non-negotiable:** Yes. A theory that demands total fixity makes the arc static; a theory that demands total fluidity makes the betrayal unearned.
  *   **Prejudice Alert:** The demand that change requires an *uncaused cause* (a spontaneous rupture of self) is a prejudice. Change can be causal (reaction to trauma) without being coerced.

  **5. The Hierarchy Constraint (The Author Analogy)**
  *   **The Case:** You have determined the plot. She does what you write. Does this render her deliberation inside the scene empty? Is your relation to her a clean analogue for the Determinist's relation to an agent, or a trap?
  *   **Non-negotiable:** Yes. You must know if your authorial control invalidates her agency *within the fiction*, because this mirrors the theological/physical worry about divine or causal determinism.
  *   **Prejudice Alert:** The assumption that your authorial control is *analogous* to causal determinism is the **Trap**. You are outside her time; causes are inside her time. Treating them as identical is a category error that has misled the philosophical debate.

  ---

  ### II. The Tensions

  You suspect a tension between the demand that the ending flow from who she is (Character Consistency) and the demand that the reader be able to want it otherwise (Alternative Possibilities).

  **Diagnosis:** This is a **Narrative Tension** that exploits a **Philosophical Tension**, but they are not identical.
  *   **Philosophically:** The tension is between *Causal Necessity* (the past + laws fix the future) and the *Principle of Alternative Possibilities* (I could have done otherwise).
  *   **Narratively:** The tension is between *Coherence* (the ending feels earned) and *Suspense* (the ending feels uncertain).

  **Can they be jointly satisfied?**
  Yes, but only if you separate *Epistemic Openness* from *Ontological Openness*.
  *   For the reader to hope, the future must be *epistemically* open (they don't know what she will do).
  *   For the ending to feel earned, the action must be *ontologically* grounded in her character.
  *   **The Friction:** If you adopt a theory that requires *Ontological Openness* (Libertarianism) to satisfy the "Could Have," you risk weakening the "Flow from Character" (if she can truly do anything, why *this*?). If you adopt a theory that requires strict *Causal Necessity* (Hard Incompatibilism), you satisfy the "Flow" but risk killing the "Hope."
  *   **Verdict:** The tension is genuine. You cannot have a character who is perfectly predictable *to the reader* and perfectly free *in the metaphysics* simultaneously. You must trade on the gap between what the reader knows and what the character is.

  ---

  ### III. The Decisive Requirement

  The single requirement that does the most to decide between the philosophical camps is **The Counterfactual Constraint ("She could have turned back").**

  *   **Why:** It forces the definition of "could."
  *   If "could" means "would have, if she had chosen to," **Compatibilism** wins.
  *   If "could" means "was physically able to, even given the exact same prior state of the universe," **Libertarianism** wins.
  *   If "could" is an illusion useful for social regulation but metaphysically false, **Hard Incompatibilism** wins.
  *   For the novelist, this is the pivot point. Your narration hinges on whether you are describing a *capacity* (Compatibilist), a *miracle* (Libertarian), or a *necessary fiction* (Incompatibilist).

  ---

  ### IV. Evaluation of the Camps

  Here is how the three major positions fare against your desiderata, briefly:

  **Compatibilism**
  *   **Performance:** High. It satisfies the **Discrimination Constraint** beautifully (coercion vs. volition is about the source of the cause, not the absence of cause). It handles the **Author Analogy** well (you determine the plot, but she determines the action within the plot).
  *   **Weakness:** It struggles with the raw intuition of the **Counterfactual Constraint**. Saying "she could have" means only "she would have if she wanted to" can feel like a semantic dodge to a writer seeking tragic weight.

  **Hard Incompatibilism (Hard Determinism / Hard Atheism)**
  *   **Performance:** Low on **Discrimination**. It flattens the distinction between the addict and the coward (both are determined). It makes the **Author Analogy** accurate but toxic (you are a puppeteer, she is wood).
  *   **Utility:** It offers a bleak, naturalistic honesty. You can narrate her betrayal as a tragic inevitability, but you lose the vocabulary of moral blame, which may starve your scenes of conflict.

  **Libertarianism (Agent-Causation)**
  *   **Performance:** High on the **Counterfactual Constraint**. "She could have turned back" is literally true.
  *   **Weakness:** It threatens the **Developmental Constraint**. If her choice is uncaused by her prior character to be truly free, the betrayal feels random, not "settled." It also makes the **Author Analogy** difficult: if she has uncaused power, how can you, the author, fix the plot without violating her nature?

  **Recommendation:** For the novelist, **Compatibilism** is usually the working tool, not because it is metaphysically proven, but because it preserves the **Discrimination Constraint** (the stuff of scenes) and the **Hierarchy Constraint** (the stuff of structure) without demanding you solve the universe's physics. It licenses you to say "she chose" because the choice flowed from her, even if it was fixed by the past.
