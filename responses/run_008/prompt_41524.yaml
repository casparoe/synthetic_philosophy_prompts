prompt: |-
  I'm taking a medieval philosophy course and we just did Avicenna's flying man -- the thought experiment where a person is created suspended in air, limbs veiled, no sensory input at all, and yet still affirms their own existence. For our discussion board I have to write about how a historical figure would react to developments from way after their time, and I want to do Avicenna vs. modern embodied cognition. The embodied people basically claim that self-awareness and concepts in general are built out of sensorimotor experience -- no body, no mind. So my question: if Avicenna could read those arguments, would he think they just missed the point of the flying man, or would he actually have to revise something in his own view? Also curiuos how you think he'd come down on LLMs, since that's a system with no body at all that nonetheless talks -- would he take it as confirmation that cognition doesn't need sensation, or would he insist the flying man only establishes a specific kind of immediate self-awareness that an LLM plainly lacks? Please ground the answer in his actual commitments (the flying man is about self-awareness specifically, not intelligence in general, right?) rather than vibes.
