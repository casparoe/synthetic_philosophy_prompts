  2.  **Deconstruct the Philosophical Debate (Mereology/Ontology):**
      *   *The Debate:* Special Composition Question (SCQ). Under what conditions do some things compose a further thing?
      *   *The Camps:*
          *   Nihilism (van Inwagen): Only simples (and maybe living organisms) exist. No tables.
          *   Universalism (Lewis): Any collection composes something. Table-Shoe-Eiffel Tower object exists.
          *   Common Sense (Moderate Restrictionism): Tables exist, random fusions don't.
      *   *The User's Hypothesis:* Quantifier Variance (Eli Hirsch). It's just about how we use "there exists."
      *   *The Counter-Hypothesis:* Substantive metaphysics. It matters for causation, identity, truthmakers, etc.

  3.  **Address Question 1: Substantive vs. Verbal?**
      *   *The Verbal Case (Quantifier Variance):* If "exists" just means "is in the domain of our quantifiers," then yes, we can choose domains. The Nihilist says $\exists x (Table(x))$ is false. The Universalist says it's true. But they agree on the arrangement of particles. This matches the engineer's "monorepo" intuition.
      *   *The Substantive Case:* Why do philosophers care? Because "existence" isn't just a label; it's about *fundamental reality*. If tables don't exist *fundamentally*, then causal powers reside only in particles. This affects how we explain things. If I smash a table, did I destroy an object or just rearrange particles? It seems verbal, but it touches on *grounding* and *truthmaking*.
      *   *Diagnosis:* It's *mostly* verbal in terms of practical prediction (physics doesn't change), but it feels substantive because it's about the *structure of reality* and *language's grip on the world*. It's a "conceptual engineering" problem.

  4.  **Address Question 2: Why hasn't it died?**
