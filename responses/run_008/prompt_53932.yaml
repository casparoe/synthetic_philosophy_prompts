answer: |-
  # Q&A Preparation Sheet: The Ordinal Utility Monster

  **Context:** 20-min talk + 40-min Q&A.
  **Audience:** Hardened Consequentialists, Ordinalist Decision Theorists (Economists), One Rawlsian.
  **Thesis:** The Utility Monster argument survives the rejection of cardinal interpersonal utility; it targets the separateness of persons via ordinal outcome rankings.

  **Note on Credibility:** This sheet explicitly distinguishes between **Settled** matters (formal results, standard interpretations of Nozick's original text) and **Contested** matters (moral interpretation of axioms, the viability of non-welfarist consequentialism). Do not blur these lines; the economists and philosophers in the room will penalize you for claiming consensus where there is none.

  ---

  ### 1. The Category Error (The Economist's Opening)
  **Objection:** "You claim the monster works under ordinalism. But if utility is merely an ordinal representation of preference, there is no isomorphism between agents. To say Agent A's gain 'outweighs' Agent B's loss requires a common scale. Without cardinal interpersonal comparability, your 'all-things-considered ranking' is just a preference function masquerading as a measurement. You haven't saved the monster; you've just hidden the cardinality in the word 'betterness.'"

  **Status:** **Contested.** (Settled: Standard ordinalism rejects interpersonal comparison. Contested: Whether "social betterness" can exist independently of individual utility sums.)

  **Reply (2 mins):**
  "I concede that standard ordinalism rejects interpersonal *measurement*. But my claim isn't that we can measure the monster's utility; it's that we can rank the *outcomes*. We don't need to know *how much* more the monster values the resource, only that the state of affairs where the monster has it is ranked higher by any plausible evaluative standard that respects individual preferences. The monster isn't a claim about arithmetic sums; it's a claim about the *structure* of trade-offs. Even if we treat utility as purely ordinal, if we accept that some outcomes are better than others all-things-considered, the monster emerges as a limit case where one agent's preference satisfaction systematically dominates others. The 'common scale' isn't a metric of mental states; it's the ranking of social states. The monster shows that even ordinal aggregation can lead to absorption of the minority by the extreme preferencer."

  **Soft Spot/Cost:**
  This risks conceding that you are actually a covert cardinalist. By relying on "all-things-considered rankings" that track the monster's dominance, you may be implicitly assuming the very interpersonal comparability you claim to reject. You are buying coherence at the cost of introducing a "social welfare function" that the economists will view as unjustified black-boxing.

  ---

  ### 2. The "Bite the Bullet" (The Consequentialist's Trap)
  **Objection:** "Let's grant your ordinal reconstruction. So what? If the outcome where the monster eats is genuinely better than the outcome where the many starve, consequentialism *requires* feeding the monster. Nozick thought this was a *reductio*; you seem to be treating it as a feature. Are you arguing that consequentialism is true and we should feed the monster, or that consequentialism is false? If the former, you've lost the critical force; if the latter, you're just restating the standard deontological objection without the rights framework."

  **Status:** **Settled.** (Settled: Nozick intended the monster as a *reductio* of utilitarianism. Contested: Whether a consequentialist can accommodate the intuition without abandoning aggregation.)

  **Reply (2 mins):**
  "I'm arguing the latter, but with a twist. The standard move is to say the monster refutes utilitarianism because utilitarianism sums cardinal units. I'm arguing the monster refutes *aggregative consequentialism* period, even when it's ordinal. The point isn't to save the theory by feeding the monster; it's to show that the problem isn't the *math* (cardinality), it's the *metaphysics* (the separateness of persons). If my reconstruction holds, then 'biting the bullet' isn't a hard-nosed commitment to the good; it's a failure to recognize persons as distinct entities rather than vessels for utility. I'm not smuggling in rights; I'm arguing that the 'betterness' relation itself is ill-formed when it requires treating distinct lives as a single container."

  **Soft Spot/Cost:**
  This pushes you toward a non-aggregative consequentialism (e.g., prioritarianism or sufficientarianism), which has its own formal problems. You risk alienating the hard-headed consequentialists who view "separateness of persons" as a slogan, not an argument. You must be prepared to define what "ill-formed" means formally, or you sound like you're doing metaphysics without a model.

  ---

  ### 3. The Harsanyi Aggregation Theorem (The Rawlsian/Formalist Trap)
  **Objection:** "You mentioned the Veil of Ignorance. Harsanyi's Aggregation Theorem demonstrates that if you accept Pareto efficiency and rationality behind the veil, you *must* maximize expected utility, which implies summing individual utilities. You can't use the Veil to block the monster without rejecting the Pareto principle or the von Neumann–Morgenstern axioms. Are you prepared to tell this room that rational choice theory is morally mistaken?"

  **Status:** **Settled (Formal), Contested (Normative).** (Settled: Harsanyi's math is valid given the axioms. Contested: Whether the axioms are morally mandatory.)

  **Reply (2 mins):**
  "I am not disputing Harsanyi's mathematics; that is a **settled** formal result. I am disputing the moral necessity of the axioms, specifically the Strong Pareto principle in this context. Harsanyi's result holds if we assume the only moral information is individual preference satisfaction. My argument is that the 'separateness of persons' functions as a constraint on which Pareto improvements are permissible. If the monster's gain comes at the cost of everyone else's basic agency, the Pareto principle shouldn't trigger. I'm not rejecting rational choice theory; I'm rejecting the claim that the Veil of Ignorance, modeled via Harsanyi, captures all morally relevant information. It captures risk, but it might obscure distribution."

  **Soft Spot/Cost:**
  This is high-risk. Rejecting Pareto is a major cost in welfare economics. You are buying breathing room by limiting the scope of the Pareto principle, which many in the room will view as the bedrock of welfare analysis. Be prepared to specify *exactly* when Pareto fails, or you look arbitrary.

  ---

  ### 4. The Identification Problem (The Economist's Follow-up)
  **Objection:** "In the cardinal version, we identify the monster by measuring their utility function. In your ordinal version, how do we identify the monster empirically? If I claim to be a monster, I just need to express steep preferences. But anyone can claim steep preferences. Without a measurement procedure, your 'ordinal monster' is operationally indistinguishable from a tyrant with loud preferences. How do you distinguish the monster from the manipulator?"

  **Status:** **Contested.** (There is no consensus on how to identify utility monsters even in theory, let alone empirically.)

  **Reply (2 mins):**
  "That's an epistemic objection to an ontological point. Nozick's monster was a thought experiment about *possibility*, not a diagnostic tool for policy. However, to answer you: we identify the monster not by self-report, but by the stability of the trade-off. A manipulator's preferences shift when challenged; a monster's capacity for satisfaction is structural. In an ordinal framework, we look for consistency in ranking: does this agent consistently rank their marginal gain above the aggregate marginal loss of others across diverse goods? If so, they fit the structural description. I'm not offering a measurement procedure because I'm not offering a cardinal metric; I'm offering a structural profile of preference dominance."

  **Soft Spot/Cost:**
  This reply is weak on operationalization. The economists will press that a theory without an identification procedure is useless for decision theory. You are conceding that your version is less "action-guiding" than the standard model, relying on the audience to accept the philosophical point over the practical application.

  ---

  ### 5. The "Smuggled Kantianism" Charge (The Rawlsian's Strike)
  **Objection:** "You keep invoking the 'separateness of persons.' That is Rawls's phrase, but you're using it to block aggregation without adopting the Difference Principle or basic liberties. This looks like you want the conclusion of Kantianism (persons as ends) without the machinery (categorical imperatives). You're essentially proposing agent-relative constraints within a consequentialist framework. Isn't this just rule-consequentialism in disguise, and doesn't that collapse back into act-consequentialism under pressure?"

  **Status:** **Contested.** (The relationship between separateness of persons and aggregation is a live debate between Rawlsians and Consequentialists.)

  **Reply (2 mins):**
  "It's not agent-relative constraints; it's about how we individuate outcomes. Standard consequentialism individuates outcomes by total welfare. I'm suggesting we individuate them by distribution vectors. This isn't rule-consequentialism because the rule isn't 'don't feed monsters'; it's 'don't count welfare in a way that dissolves persons.' This is closer to Scanlon's contractualism than Kant, but framed consequentially. I'm not smuggling Kantianism; I'm arguing that a plausible theory of 'the good' must include the integrity of the persons holding the good. If the good is distributed such that one person absorbs the rest, the 'goodness' of that state is compromised internally, not by an external constraint."

  **Soft Spot/Cost:**
  You are moving away from standard consequentialism toward a hybrid view. The hard-headed consequentialists will argue this is unstable: if the integrity of persons is a value, put it in the utility function. If you refuse, you look like you're changing the subject. You are buying coherence by expanding the definition of "outcome."

  ---

  ### 6. The Diminishing Marginal Utility Deflation
  **Objection:** "This is the standard deflationary move you mentioned in your talk. Why isn't the monster just someone with high marginal utility for a specific resource? If I love bread more than you, and we have one loaf, consequentialism gives it to me. That's not a monster; that's just efficiency. Why does your ordinal version resist this deflation?"

  **Status:** **Settled.** (Standard economic theory treats the monster as a case of extreme marginal utility. Nozick's intent is **Contested**.)

  **Reply (2 mins):**
  "Because Nozick's monster isn't about *bread*; it's about *capacity*. The deflationary move works if the monster is just one preference among many. But the monster is defined by the *scope* of their capacity. It's not that they love bread more; it's that *any* resource converted to their utility yields more than anyone else's. In ordinal terms, their preference ordering dominates the social ordering universally. The deflationary move assumes the monster is a local anomaly. My reconstruction assumes the monster is a structural possibility of the aggregation function itself. If the theory allows one ordinal ranking to systematically veto all others, the deflation fails."

  **Soft Spot/Cost:**
  This relies on the audience accepting the "structural" definition over the "empirical" one. If they insist the monster must be empirically possible, you lose. You are betting on the conceptual possibility being enough to break the theory.

  ---

  ### 7. The "Wheezing Antique" Relevance Check
  **Objection:** "Interpersonal utility comparison was abandoned in welfare economics for good reason: it's unscientific. Why are we spending 40 minutes resuscitating a problem that was solved by the ordinalist revolution? Even if you're right, you're fighting a battle nobody else is fighting. Modern welfarism doesn't rely on the naive utilitarianism Nozick attacked."

  **Status:** **Contested.** (Whether modern welfarism avoids the problem is a live debate in normative economics.)

  **Reply (2 mins):**
  "Because modern welfarism still relies on aggregation. Whether you call it 'social welfare functions,' 'prioritarianism,' or 'preference satisfaction,' you are still trading off one person's losses for another's gains. The ordinalist revolution changed the *measurement*, but it didn't change the *trade-off*. As long as consequentialism requires maximizing an aggregate function of individual inputs, the monster is alive. I'm not fighting a dead horse; I'm pointing out that the horse just changed names. The economists stopped talking about 'utils,' but they're still summing preferences. The monster haunts the sum, not the unit."

  **Soft Spot/Cost:**
  This may annoy the economists who feel you are caricaturing modern decision theory. You need to acknowledge that social choice theory *does* handle this via impossibility theorems (Arrow), but argue that moral philosophy often ignores those constraints.

  ---

  ### 8. THE QUESTION I HOPE NOBODY ASKS: "Whose Betterness Relation?"
  **Objection:** "You say we don't need cardinal utility, just 'all-things-considered rankings' where the monster wins. But who generates this ranking? If it's not the sum of individual utilities, is it *your* ranking? *Mine*? If it's an objective ranking independent of preferences, you're a value realist, not a welfarist. If it's based on preferences, you're back to aggregation. You haven't solved the comparison problem; you've just outsourced it to a mysterious 'betterness' relation that does the same work as cardinal utility but without the rigor. What is the ontological status of this ranking?"

  **Status:** **Contested.** (This strikes at the heart of the "Good" vs. "Right" debate. There is no consensus on non-welfarist outcome ranking.)

  **Reply (2 mins):**
  "This is the hardest question, and I'll be direct. I am not offering a full meta-ethical account today. However, the ranking isn't 'mysterious'; it's the set of rankings that survive reflective equilibrium regarding the separateness of persons. It's not *my* ranking; it's the ranking that respects the constraint that persons are distinct. This does push me toward a form of value realism, or at least a non-welfarist objectivism about outcomes. I accept that cost. I'd rather be a realist about outcomes than a utilitarian about persons. The 'rigor' you want comes from cardinality, but I'm arguing that rigor comes at the cost of moral truth. I'm choosing moral truth over formal elegance here."

  **Soft Spot/Cost:**
  **High Damage.** This admits that your theory lacks a formal decision procedure and relies on substantive moral realism. The decision theorists will view this as "giving up" on the formal project. The consequentialists will view it as abandoning welfarism. This reply saves the philosophical point but sacrifices the "decision theory" credibility of the paper. **Use only if cornered.**
