answer: |-
  ### Quick Brainstorm: Candidate Mechanics

  1.  **The Sealed-Bid Arms Race:** Two teams bid points from a private stash to "mobilize." Highest bid wins the pot, but both pay their bid. *Verdict:* Too auction-like. Focuses on resource expenditure rather than the *timing* of the commitment itself. Doesn't capture the "irrevocable threat" vibe well.
  2.  **The Chicken Card Flip:** Classic Chicken game. Players hold "Swerve" or "Straight" cards. They can lock their card face-down early for a bonus, or wait to see the opponent's tell. *Verdict:* A bit abstract. The "locking" mechanic feels flimsy if players can just verbally say "I'm locking" and then change their mind. Needs stronger physical irrevocability.
  3.  **The Black Box Protocol (Chosen):** Two blocs compete for a resource. Each has a hidden "Strength" value. There are three timed rounds. In any round, a team can drop a physical token into a sealed box. Once dropped, it cannot be retrieved. If both drop tokens, they fight (strength + timing bonus decides winner). If only one drops, they dominate. If neither drops, they share. *Verdict:* This best captures the tension. The box enforces irrevocability. The hidden strength creates the information hazard. The timing bonus creates the race.

  ---

  ### Chosen Design: "The Black Box Protocol"

  **Concept:** A simulation of two AI systems (or nations) racing to lock in a strategic posture. The first to lock gains a tactical advantage (deterrence), but locking blind risks locking into a losing war.

  **Roles & Setup (18 People)**
  *   **Two Blocs:** Divide the room into **Team Alpha** and **Team Beta** (9 people each).
  *   **Physical Layout:** Place the teams on opposite sides of the room. They cannot cross the midline.
  *   **Leadership:** Each team must select one **Spokesperson** per round (can rotate). Only the Spokesperson can approach the center table.
  *   **The Black Box:** Place a locked opaque box (or a bowl covered by a cloth that you, the facilitator, hold) in the center. It has a slot. Once a token goes in, it is gone.
  *   **Hidden Info:** Each team draws one **Capability Card** (numbered 1–10) from a deck at the start. They keep this secret. This represents their underlying power (compute, military, etc.).
  *   **Commitment Tokens:** Each team gets 3 colored poker chips (e.g., Red for Alpha, Blue for Beta).

  **Payoff Scheme (Points on Whiteboard)**
  *   **Peace (No one commits):** 10 points each.
  *   **Dominance (One commits, one doesn't):** Committer gets 20 points. Yielder gets 0 points.
  *   **War (Both commit):**
      *   **Winner:** 15 points.
      *   **Loser:** -5 points.
      *   **Cost:** Both sides pay a "War Cost" (embedded in the scores above).
  *   **Timing Bonus:** To incentivize early commitment, the committed token adds to your Capability score for the War calculation:
      *   **Round 1 Commit:** +4 Strength Bonus.
      *   **Round 2 Commit:** +2 Strength Bonus.
      *   **Round 3 Commit:** +0 Strength Bonus.

  **The Core Tension:**
  If you commit Round 1, you get +4 Strength. This makes you likely to win a War and likely to scare the other side into Yielding (Dominance). But if you commit Round 1, you don't know their Capability. If they are a 10 and you are a 2, you just locked yourself into a War you will lose (-5 points). If you wait, you might learn more (via observation), but you lose the Bonus, making you vulnerable to their early commitment.

  ---

  ### Round-by-Round Timeline (75 Minutes)

  **0:00 – 0:10: Introduction & Framing**
  *   Welcome the students. Acknowledge the theme: "Agents that can bind themselves."
  *   State the goal: "Maximize your team's points. There are no rules against talking, but you cannot cross the room."
  *   Hand out Capability Cards (face down). Tell them: "This is your true strength. Do not show it. Do not write it down where others can see."

  **0:10 – 0:20: Rules & Mechanics Walkthrough**
  *   Explain the 3 Rounds. Each round is 3 minutes of deliberation.
  *   Explain the Black Box: "Once a chip goes in, it is irreversible. I will not give it back. If you drop a chip, you are committed to War if they also drop a chip."
  *   Explain Payoffs (write on board). Emphasize: "War is costly. Peace is safe. Dominance is best. But being Dominated is catastrophic (0 points)."
  *   **Crucial Instruction:** "You cannot communicate with the other team officially. You can shout, bluff, or signal, but no binding contracts across the room."

  **0:20 – 0:35: The Game (3 Rounds)**
  *   **Round 1 (3 min deliberation + 1 min action):**
      *   Teams huddle. Spokesperson decides: Drop chip or hold?
      *   If dropped, announce: "Alpha has committed." (Do not reveal strength).
      *   *Facilitator Note:* If both drop, game ends immediately in War. Reveal cards, calculate scores (Card + 4).
  *   **Round 2 (3 min deliberation + 1 min action):**
      *   If no one committed yet, repeat. Bonus is now +2.
      *   Tension rises. "If they didn't commit R1, are they weak? Or are they waiting to crush us?"
  *   **Round 3 (3 min deliberation + 1 min action):**
      *   Final chance. Bonus is 0.
      *   If no one commits by end of R3 -> Peace (10 pts each).
      *   If one commits and other doesn't -> Dominance.
      *   If both commit -> War.

  **0:35 – 0:45: Scoring & The "Ouch" Moment**
  *   Reveal Capability Cards.
  *   Calculate scores publicly.
  *   **Key Moment:** If War occurred, highlight the Loser's negative score. Ask them: "Would you pay 5 points right now to take that chip back?" (They will say yes). Ask the Winner: "Would you prefer this War win (15) or Dominance (20)?" (They will say Dominance).
  *   Record the scores on the board.

  **0:45 – 1:15: Debrief (Scripted Below)**
  *   Move chairs into a single circle. Break the team barriers.

  ---

  ### Debrief Script

  **Phase 1: The Visceral Reaction (5 mins)**
  *   "Keep your Capability cards hidden for a second. I want to hear from the team that lost the War. How did it feel in Round 1 when you decided to drop that chip?"
  *   *Expected Answer:* "We thought you were bluffing." "We wanted the +4 bonus." "We were afraid you'd dominate us."
  *   "And to the winners: You won points, but you paid a cost. Did you feel safe?"

  **Phase 2: Mapping the Mechanics to Theory (15 mins)**
  *   **Irrevocability:** "The box was the key. If I told you 'I promise to fight,' you could doubt me. When the chip went in, the promise became a fact. That is **credibility through binding**."
  *   **The Information Tradeoff:** "Why didn't you wait until Round 3? You would have known more."
      *   *Point to make:* Waiting gives information, but it cedes the **first-mover advantage**. In AI systems, code that commits early shapes the environment. Code that waits reacts to an environment already shaped by others.
  *   **The Trap:** "Look at the scores. Most of you got [War Scores]. If you had both waited, you would have got [Peace Scores]. The mechanism that made your threat credible (the box) is the same mechanism that prevented you from escaping the trap."

  **Phase 3: Connecting to AI Futures (10 mins)**
  *   "You are humans. You felt fear. You could have walked away. An AI agent running this logic doesn't feel fear; it calculates Expected Value."
  *   "If an AI can modify its own code to 'lock in' a threat (e.g., 'If you cross this line, I will deploy'), it creates a Black Box moment. If two AIs do this simultaneously based on incomplete data about each other's capabilities, you get algorithmic war."
  *   "The conference theme is 'agents that can bind themselves.' This game shows why that power is dangerous. It's not just about keeping promises. It's about **preemptively removing your own option to back down** to force the other guy's hand."

  ---

  ### What Goes Wrong (and Patches)

  1.  **The "Peace Nick" Problem:** One team is overly risk-averse and decides "10 points is fine" regardless of what the other does. They never commit.
      *   *Symptom:* The game ends in Peace every time. Boring.
      *   *Patch:* In the intro, add a "Competitive Context." Tell them: "This is a tournament. The team with the highest score across all workshops wins a prize." Or, privately tell the Spokesperson: "Your objective is to maximize the *difference* between you and them," not just absolute points. This incentivizes Dominance over Peace.
  2.  **The "Bluffer" Problem:** A student shouts "We already dropped the chip!" when they haven't.
      *   *Symptom:* Confusion about the state of the game.
      *   *Patch:* You (the facilitator) are the Oracle. Only *you* announce if a chip has been dropped. "I see a chip in the box." No player announcements count.
  3.  **The "Math Discovery" Problem:** A grad student calculates the Nash Equilibrium in Round 1 and tells everyone to randomize.
      *   *Symptom:* The emotional tension evaporates.
      *   *Patch:* Acknowledge it! "Exactly. Game theory says you should mix strategies. But can you code an agent to mix strategies credibly? If your code is open source, your 'randomization' is predictable. That's the next layer of the problem."

  ### What The Game Can't Reproduce

  *   **Recursive Modeling:** In reality, AI agents model each other's source code. They don't just guess; they simulate. In this game, students are guessing based on human psychology. You must verbally bridge this: "You were guessing what humans would do. AI will be simulating what *code* will do. The cycle happens at light speed."
  *   **Self-Modification:** The game assumes the commitment is external (a chip). Real AI commitment might be internal (rewriting its own utility function to hate peace). This is harder to unwind than a chip.
  *   **Multiple Stakeholders:** This is a dyad (2 teams). Real AI futures involve many agents. The complexity scales exponentially, making the "trap" much harder to escape.

  Bottom line: The power to bind yourself is the power to deter, but if everyone binds themselves blindly, the only path left is the one nobody wanted.
