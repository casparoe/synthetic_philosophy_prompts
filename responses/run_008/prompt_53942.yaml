answer: |-
  **TO:** Clinical Effectiveness Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Infection Protocol A vs. B

  **Background**
  We are currently evaluating a proposal to switch our standard treatment for serious infection from Drug A to Drug B. The supporting data presents a conflict: aggregate numbers favor Drug B (3% lower mortality), but stratified analysis by admission severity favors Drug A in all three tiers. Additionally, we have identified a critical flaw in how patients were classified: patients starting on A who deteriorated were sometimes switched to B, but counted in the Drug B group for analysis.

  **Understanding the Conflict**
  Both the aggregate and stratified numbers are currently unreliable, but for different reasons.

  The aggregate data likely suffers from **confounding by indication**. If clinicians prescribe Drug A to sicker patients and Drug B to healthier ones, Drug B will appear superior simply because its patients were less likely to die regardless of treatment. This explains why the raw mortality rate is lower for B.

  The resident's stratified analysis attempts to fix this by comparing like-with-like. However, the **treatment switching** issue contaminates these groups. By counting patients based on the drug they *ended* on rather than *started* on, we have moved patients who failed Drug A into the Drug B bucket. This artificially inflates Drug B's mortality rate (since it absorbs the failures) and deflates Drug A's.

  Here is the crucial insight: Even with this bias working *against* Drug A (moving its failures to B), Drug A still outperformed Drug B within every severity tier. This suggests Drug A may be clinically superior, while the aggregate advantage for Drug B is likely an artifact of healthier patients receiving it.

  **The Causal Question**
  One committee member noted that choosing between these numbers is "a causal question, not a statistical one." This is correct. Statistics describe patterns; causality explains *why*. To trust the stratified numbers as the true effect of the drug, we must assume our severity score captures **all** the reasons doctors chose one drug over the other. If doctors chose Drug A for unmeasured reasons (e.g., specific comorbidities not in the score), the stratified comparison is still biased. We cannot statistically prove this assumption; we must justify it clinically.

  **Recommendation**
  **Do not switch to Protocol B at this time.**

  The current evidence is insufficient to justify changing standard care. The aggregate data is confounded, and the stratified data is biased by classification errors. Switching now risks adopting an inferior drug based on a statistical mirage.

  **Required Next Steps**
  Before revisiting this decision, we require a re-analysis of the existing data using an **Intention-to-Treat (ITT)** approach.
  1.  **Re-classify Patients:** Patients must be analyzed based on the drug they were *prescribed at admission*, regardless of whether they switched later. This preserves the randomization of clinical decision-making at the point of care.
  2.  **Analyze Switching Rates:** We need to know how many patients switched from A to B versus B to A. If switching is asymmetric, it confirms selection bias.

  **Contingency Plan**
  If our data systems cannot reliably track *initial* prescription times to allow for an ITT analysis, we cannot correct the bias. In that scenario, **we must remain on Protocol A.**

  Why? Because the bias in the current stratified analysis (switching failures to B) makes Drug A look *worse* than it likely is. If Drug A wins even when handicapped by this classification error, it is the safer bet. The aggregate advantage for B is easily explained by patient selection, whereas the stratified advantage for A persists despite bias working against it.

  **Conclusion**
  We cannot make a causal inference from biased associations. Until we see an ITT analysis, or unless we can collect prospective randomized data (which is likely beyond our current scale), the prudent clinical decision is to maintain Protocol A. We prioritize patient safety over protocol changes driven by potentially misleading observational data.

  Please confirm if the data team can execute the ITT re-classification by next month. If not, I move to table the switch indefinitely.
