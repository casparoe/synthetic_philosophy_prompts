      *   *Requirement 2: Causal Role vs. Structural Isomorphism.* It must distinguish doing the *work* of cognition from just looking like a brain or mimicking output behaviour (Searle's Chinese Room issue).
      *   *Requirement 3: Realisation vs. Simulation.* A weather simulation isn't a storm; a cognitive simulation isn't a mind. The account must distinguish running a model *of* cognition from instantiating cognition.
      *   *Requirement 4: Capacity vs. Occurrent State.* Distinguishing a system that *can* think (has the architecture) from one that *is* thinking right now.
      *   *Requirement 5: Integration/Unity.* How do we handle the octopus arm? Is it a separate agent? The theory must handle near-decomposability (Simon) vs. genuine systemic integration.
      *   *Requirement 6: Evolutionary/Phylogenetic Plausibility.* Must align with convergent evolution (cephalopods vs. vertebrates). If cognition requires specific biology, convergent evolution becomes miraculous.
