      *   *Abstraction vs. Embodiment:* Functionalism abstracts away the body; Embodied cognition says the body *is* the mind. These pull in opposite directions regarding the octopus arm.
      *   *Teleology vs. Mechanism:* How do you ground "purpose" in a chip? Evolution gives purpose to moulds; engineers give purpose to chips. Are these the same kind of purpose?

  5.  **Assess the Three Theories:**
      *   *Role Functionalism:* Good on abstraction, struggles with normativity and simulation distinction.
