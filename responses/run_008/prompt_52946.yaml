answer: |-
  **Memorandum: Conceptual Specifications for Multiple Realisability in Comparative Cognition**

  **To:** Science and Ideas Correspondent
  **From:** Philosophical Consultant
  **Subject:** Desiderata for Adjudicating Cross-Substrate Cognition Claims

  You have correctly identified that the narrative thread binding your case studies—cephalopod decentralisation, acellular problem-solving, neuromorphic engineering, and mycelial signalling—is a commitment to Multiple Realisability (MR). However, MR is not a monolith; it is a constraint satisfaction problem. To write a rigorous feature, you require a specification sheet against which to test the researchers' claims. If a theory of MR cannot meet the following conditions, it lacks the explanatory power to support the headline assertions you intend to explore.

  Below are the seven desiderata any adequate account must satisfy, followed by a critical audit of the list itself, and a preliminary assessment of the leading theoretical frameworks.

  ***

  ### Part I: The Desiderata

  **1. Substrate Neutrality with Material Constraints**
  *   **Requirement:** The account must permit mental kinds to be instantiated in non-standard biological tissue (slime mould, fungi) and non-biological hardware (chips), without collapsing into the view that *any* physical system realises *any* mental state (panpsychism or triviality).
  *   **Motivating Case:** If the theory is too liberal, a rock with enough atomic states counts as thinking, rendering the term useless. If it is too restrictive (e.g., requiring specific neurotransmitters), it excludes the octopus arm and the slime mould, contradicting the empirical premise of your article. It must explain why silicon *can* replace carbon, but a bucket of water *cannot*, without appealing to mere intuition.

  **2. Causal Efficacy versus Behavioural Correlation**
  *   **Requirement:** The account must distinguish between a system that produces intelligent output via internal cognitive processing and a system that produces intelligent output via lookup tables, reflex, or external scaffolding.
  *   **Motivating Case:** A slime mould solving a maze looks like navigation. However, if the mechanism is purely passive physical diffusion without feedback loops that modulate future states based on past success, it is merely a physical analogy of cognition, not a realisation of it. The theory must demand that the internal state plays a causal role in generating the behaviour, not just accompany it.

  **3. The Simulation/Realisation Distinction**
  *   **Requirement:** There must be a principled difference between simulating a cognitive process and instantiating it.
  *   **Motivating Case:** A weather simulation on a supercomputer does not make the computer wet; a simulation of digestion does not nourish the machine. Similarly, a neuromorphic chip might model a neural net without possessing the causal powers requisite for cognition. If your article claims the chip *thinks* rather than *models thinking*, the account of MR must specify what extra condition the chip meets that the weather model does not.

  **4. Capacity versus Occurrent State**
  *   **Requirement:** The account must distinguish between a system organised such that it *can* realise a mental kind (dispositional) and a system that is *currently* realising it (occurrent).
  *   **Motivating Case:** An octopus arm possesses the ganglia to process tactile information locally. Does it "feel" pain when detached but inactive? Does a dormant fungal network possess "knowledge"? A theory that conflates architecture with activity will imply that a switched-off computer is still computing, or that a sedated animal is not conscious. For your purposes, you need to know if the researchers are claiming the substrate *has* a mind or is merely *mind-capable*.

  **5. Systemic Integration and Boundary Conditions**
  *   **Requirement:** The account must provide criteria for individuating cognitive systems, specifically addressing near-decomposability.
  *   **Motivating Case:** The octopus arm contains two-thirds of the animal's neurons. Is the arm a distinct cognitive agent, or merely a peripheral organ of a centralised brain? If MR allows the arm to be a separate realiser of cognition, we risk multiplying agents unnecessarily. If it denies it, we risk centralist bias. The theory must explain what binds the arm's processing to the central brain sufficiently to count as one mind, or what liberates it to count as two.

  **6. Phylogenetic and Evolutionary Consistency**
  *   **Requirement:** The account must be compatible with the independent evolution of complex nervous systems (convergent evolution) without rendering such convergence statistically miraculous.
  *   **Motivating Case:** Vertebrate and cephalopod nervous systems evolved separately. If cognition requires a specific vertebrate architecture (e.g., a cortex), then cephalopod intelligence is either an illusion or a miracle. An adequate MR account must explain how natural selection could "find" the same functional solution via different structural routes. It cannot contradict the biological fact of convergent evolution.

  **7. Normative Grounding (Teleology)**
  *   **Requirement:** The account must explain how physical states acquire normative status (i.e., how they can be *correct* or *incorrect*, not just causally effective).
  *   **Motivating Case:** Cognition involves representation, and representation involves the possibility of error. A slime mould moves towards food. If it moves towards a poison that smells like food, it has made a mistake. A rock rolling downhill makes no mistake. For a physical system to be cognitive, its states must be "for" something (survival, goal attainment). The theory must locate this "aboutness" without invoking magic.

  ***

  ### Part II: Critical Audit of the Desiderata

  In constructing this list, one must distinguish between genuine constraints on explanation and partisan commitments disguised as requirements.

  **Non-Negotiable Requirements**
  Desiderata **2 (Causal Efficacy)**, **3 (Simulation/Realisation)**, and **6 (Evolutionary Consistency)** are non-negotiable for a science journalist. To ignore the distinction between simulation and reality is to engage in category errors that undermine scientific literacy. To contradict convergent evolution is to contradict established biology. If a theory of MR fails these, it is not a theory of naturalised cognition; it is metaphysics or science fiction.

  **Partisan Prejudices Disguised as Desiderata**
  *   **The Functionalist Prejudice (Desideratum 1):** Functionalists assume Substrate Neutrality is obvious. However, Biological Naturalists (e.g., John Searle) argue that causal powers are intrinsic to specific biological materials. They would reject Desideratum 1 as a demand, arguing that chips *cannot* realise minds regardless of organisation. You must acknowledge that insisting on Substrate Neutrality is already taking a side in the philosophy of mind.
  *   **The Embodied/Enactive Prejudice (Desideratum 5):** Proponents of Enactivism (e.g., Evan Thompson, Alva Noë) would argue that Desideratum 5 is too lenient towards internalism. They might claim the octopus arm isn't a separate agent, nor is it part of a centralised brain, but that the "cognitive system" is the whole animal in its environment. They would view the attempt to draw a boundary *inside* the organism as a category error.
  *   **The Teleological Prejudice (Desideratum 7):** Strict mechanists might argue that Normative Grounding is unnecessary for "cognition" if defined merely as information processing. They would argue you can have error-free computation. Insisting on teleology privileges biological accounts over engineering accounts (chips), as chips have "derived" intentionality (from engineers) rather than "intrinsic" intentionality (from evolution).

  ***

  ### Part III: Incompatibilities and Tensions

  You must be aware that satisfying all seven desiderata simultaneously may be impossible without diluting the definition of cognition to the point of triviality. There are two specific tensions you should flag in your drafting.

  **1. The Tension between Liberalism and Constraint (Desiderata 1 vs. 3)**
  To satisfy Substrate Neutrality (1) enough to include slime moulds and chips, one must abstract away from specific physical details. However, the more one abstracts, the harder it becomes to maintain the Simulation/Realisation distinction (3). If a slime mould's chemical diffusion counts as "computation," it becomes difficult to explain why a fluid-dynamic simulation of that mould on a computer *isn't* also cognition. If you lower the bar to include the mould, you risk implying that any causal system is cognitive. If you raise the bar to protect against triviality, you exclude the mould. You cannot have both a highly inclusive MR and a robust Simulation distinction without a very sophisticated theory of causation.

  **2. The Tension between History and Structure (Desiderata 6 vs. 7)**
  This is the most critical conflict for your article. Evolutionary Consistency (6) and Normative Grounding (7) work well for biological cases (octopus, mould, fungus) because their "purpose" is derived from natural selection. However, they clash with the Neuromorphic Chip case. A chip has no evolutionary history; its teleology is imposed by designers. If you insist on evolutionary teleology to ground normativity, the chip cannot be cognitive. If you allow designer teleology, you open the door to the claim that a thermostat is cognitive (it is "designed" to regulate temperature). You likely cannot treat the mould and the chip as realising the *same kind* of cognition without glossing over the difference between evolved and designed normativity.

  ***

  ### Part IV: Theoretical Assessment

  **Role Functionalism**
  *   **Assessment:** This view defines mental states by their causal relations to inputs, outputs, and other internal states. It scores highly on Substrate Neutrality (1) and Evolutionary Consistency (6), easily accommodating octopuses and moulds. However, it struggles significantly with the Simulation/Realisation distinction (3); a perfect causal simulation of a pain state might count as pain, which many find counterintuitive. It also has difficulty grounding Normativity (7) without appealing to external factors, as causal roles are descriptive, not normative.

  **Machine-State Functionalism**
  *   **Assessment:** This approach likens the mind to a Turing Machine, focusing on discrete states and transition rules. It handles the Chip case well but fares poorly on the Slime Mould and Octopus Arm. Biological cognition is continuous, analogue, and massively parallel, not easily mapped to discrete machine states. It risks violating Evolutionary Consistency (6) by imposing a computational architecture that biology does not strictly follow. Furthermore, it is highly vulnerable to the Simulation objection (3), as a software emulation of a machine state is indistinguishable from the state itself in this framework.

  **Teleofunctionalism**
  *   **Assessment:** This view grounds mental content in the evolutionary history of a system (e.g., Ruth Millikan's proper functions). It excels at Normative Grounding (7) and Evolutionary Consistency (6), providing a robust reason why a slime mould's actions are "correct" or "incorrect." However, it faces a severe crisis with the Neuromorphic Chip (1). Unless one argues that the chip inherits teleology from its human designers (which differs in kind from natural selection), it cannot count as genuinely cognitive. It may force you to exclude the engineering cases from the "true cognition" category, fracturing the narrative unity of your feature.
