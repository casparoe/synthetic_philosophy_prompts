      *   *Depth:* The user wants "conceptual groundwork," not a summary. Avoid defining functionalism; define what a *successful version* of it must achieve.
      *   *Specific Constraint:* "Name names" regarding prejudices. I should mention Searle, Putnam, perhaps Ruth Millikan for teleology, and maybe Thompson/Varela for embodied pushback.

  8.  **Final Polish:** Check against the prompt's specific request for "specification rather than summary." Ensure the distinction between "licensing cross-substrate claims" and "adjudicating claims" is clear. The goal is to give the journalist a rubric to test the scientists' claims against.

      *(Self-Correction on Tensions)*: The biggest tension is between the Slime Mould (biological but non-neural) and the Chip (non-biological but neural-like). A theory that accepts the mould based on evolution might reject the chip. A theory that accepts the chip based on computation might reject the mould (if it's just chemical diffusion). I need to highlight this "Common Kind" problem.

      *(Self-Correction on Octopus)*: The octopus arm is tricky. Is it a separate realisation of cognition, or part of a larger one? The desideratum must demand clarity on *boundaries*.

      *(Final Review of British English)*: Ensure "realise", "organisation", "behaviour", "modelling", "centre".

      *(Final Review of Formality)*: Avoid colloquialisms. Use precise philosophical terminology (e.g., "token identity", "type identity", "normativity").

