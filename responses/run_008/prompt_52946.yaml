  3.  **Critique the Desiderata (Non-negotiables vs. Prejudices):**
      *   *Non-negotiable:* Substrate neutrality (otherwise the article's premise fails), Realisation vs. Simulation (otherwise it's magic), Empirical consistency (otherwise it's bad science).
