          *   *Phase 1:* "Find the person who refers to the same object as you." (Students with "Hesperus" find "Hesperus". Easy. $a=a$.)
          *   *Phase 2:* Reset. Now half the pair has "Hesperus", half has "Phosphorus". They don't know they are the same. They can't coordinate.
          *   *Announcement:* "Hesperus is Phosphorus."
          *   *Result:* Now they can coordinate.
          *   *Problem:* This is just ignorance. If they don't know the identity, telling them gives info.
          *   *Fix:* Make the *labels* the only access point. The "Sense" is the label on the card. The "Reference" is the hidden object ID.
          *   *Refined Game:* **"The Two-Name Coordination Task."**
          *   Students are paired. Each pair gets a Target Object (e.g., Object 1).
          *   Student A gets a card saying "The Morning Star".
          *   Student B gets a card saying "The Evening Star".
          *   They are told: "You win if you both write down the name of the *same object* on your slip of paper."
          *   They cannot show cards. They can only discuss.
          *   *Catch:* They don't know Morning Star = Evening Star.
          *   *Round 1:* They try to agree. They fail (or agree on wrong thing).
          *   *Intervention:* Teacher announces "The Morning Star is The Evening Star."
          *   *Round 2:* They succeed.
          *   *Wait, this is still just empirical info.*
          *   *How to make it feel like Frege?* We need to contrast "The Morning Star is The Morning Star" vs "The Morning Star is The Evening Star."
          *   *Game Flow:*
              1.  Distribute cards. Half class gets "Name A", half gets "Name B". Unbeknownst to them, A and B name the same hidden shape/color.
