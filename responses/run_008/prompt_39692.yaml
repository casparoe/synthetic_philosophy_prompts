      *   **Round 2:** "Hesperus is Phosphorus." Now Venus group consolidates.
      *   **Payoff:** $10 points per successful pair.
      *   **This works.** It shows $a=a$ leaves value on the table (uncoordinated Venusians), while $a=b$ captures the value.

