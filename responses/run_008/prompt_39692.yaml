      *   *Critique of this flow:* It still feels like "I didn't know that fact."
      *   *Frege's Point:* It's not just that I didn't know the fact; it's that the *thought* expressed is different.
      *   *Pedagogical Reality:* For a 75-min intro section with no reading, you *cannot* fully enact the metaphysical distinction between Sense and Reference in a game. You can only enact the *epistemic asymmetry*. The debrief must bridge this gap. The game motivates the *need* for the distinction.
