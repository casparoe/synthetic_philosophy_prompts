prompt: |-
  i'm a phd student teaching my first section of intro phil of language (14 students, 75 minutes, they've read nothing on Frege yet, so the name shouldn't come up until the debrief). I want a game where they run into the identity puzzle themselves. here's the shape I have in mind but I might be off: students get partial, private info about some objects (cards, labels, hidden identities, whatever), then the facilitator announces a statement that is just an equality between two labels, and suddenly coordination that was impossible becomes possible — even though, if identities are fixed from the start, the announcement was in some sense knowable in advance. the "a = a" version should do nothing for them, the "a = b" version should do real work, and I want them to feel that difference in a payoff rather than hear about it. then the debrief maps what happened onto the puzzle: same object referred to both times, so what did the second statement have that the first lacked, and why didn't truth-value capture it.

  So: design the actual game — rules, materials, no real money, payoffs, how long each phase runs — plus the debrief, what will predictably go wrong the first time I run it, and an honest note on which part of Frege's puzzle this kind of setup can't reproduce (I suspect the answer is that a game can only ever show missing *information*, and I worry that's not the same thing as the puzzle Frege was pointing at, but I haven't fully thought it through).

  Also, if you think the premise is confused — that no game can do this, or that what I described isn't actually Frege's puzzle — tell me that straight instead of designing something that politely fakes it.

  for format: give me the prose design, but then a run-sheet table with these columns: Phase (name + minutes), What participants do, What the facilitator does, Which bit of the puzzle this phase is aiming at. keep the rows to the actual phases of the session including debrief, one row per phase, and if a phase isn't aimed at any bit of the puzzle say so in that column rather than inventing a mapping.
