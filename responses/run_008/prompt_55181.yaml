prompt: |-
  I'm writing a novel where one of the characters is a mildly insufferable epistemologist who corrects people's dinner-party small talk, and I want her pet theory to actually hold up. Her thing is the norms of assertion debate — whether what you're allowed to assert is governed by knowledge, truth, or just belief — and I've gotten stuck on the lottery example. As I understand it, if I hold a lottery ticket with million-to-one odds, I seem to *know* it'll lose in some practical sense, yet something feels wrong about flatly asserting "my ticket will lose," which is supposed to be trouble for the knowledge norm specifically. Can you walk me through why that case bites the knowledge norm harder than the alternatives, and how knowledge-norm people fight back (I've seen mentions of a "reasonable to believe" competitor norm — does that dodge the lottery or just trade the problem for another one)? Also, is the Moore-paradoxical stuff like asserting "it's raining but I don't believe it" meant as a separate argument for the knowledge norm, or is it the same underlying point? Keep it fairly informal — I need to able to have her explain this in dialogue without the prose turning into a paper.
