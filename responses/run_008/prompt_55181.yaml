answer: |-
  This is a fantastic character concept. An epistemologist who polices dinner conversation based on the *norms of assertion* is a goldmine for tension. She's not just correcting facts; she's correcting the *right to speak*.

  However, to make her sound like a pro (and not someone who skimmed a philosophy blog), we need to tighten up the intuition behind the Lottery case. There is a common misunderstanding about which way the intuition cuts.

  Here is the breakdown of the philosophy, followed by how to translate it into dialogue.

  ### 1. The Lottery Case: Who does it hurt?

  You mentioned that the lottery case is "trouble for the knowledge norm specifically." Actually, in the academic debate, it's often used as **evidence for** the Knowledge Norm, depending on which intuition you prioritize.

  Here is the setup:
  *   **The Scenario:** You hold a ticket in a 1-in-a-million lottery. The draw hasn't happened.
  *   **The Intuition:** Most people feel it is **improper** to flat-out assert, "Your ticket will lose." If you said that at dinner, someone would challenge you: "How do you *know*? It hasn't been drawn yet!"
  *   **The Knowledge Norm (KNA):** Says you should only assert what you know. Since you don't *know* the ticket will lose (it *could* win, however unlikely), KNA says you shouldn't assert it.
  *   **The Result:** The fact that we feel it's improper to assert matches what KNA predicts. So, many philosophers (like Timothy Williamson) use the Lottery to **defend** the Knowledge Norm. It explains why statistical probability isn't enough for assertion.

  **So where is the "bite"?**
  The "bite" against the Knowledge Norm comes from people who argue: "But the odds are 99.9999%! It is irrational to think it will win. If I can't say it will lose, the Knowledge Norm is too strict. It silences us in perfectly rational situations."

  **For your character:** To make her insufferable, she should side with the **Knowledge Norm**. She should be the person who refuses to say the ticket will lose, insisting that "probability isn't knowledge." That makes her annoying at a party.

  ### 2. The Alternatives (and why they fail)

  If the Knowledge Norm is too strict, what should replace it?

  *   **The Truth Norm:** "Assert $p$ only if $p$ is true."
      *   *Problem:* You can't see the future. Also, if I make a lucky guess ("The coin will land heads"), and it does, I asserted a truth. But I shouldn't get credit for that. The Truth Norm is too loose; it allows lucky guesses.
  *   **The Belief Norm:** "Assert $p$ only if you believe $p$."
      *   *Problem:* I can believe crazy things. If I believe the moon is made of cheese, this norm lets me assert it. It doesn't require *evidence*.
  *   **The "Reasonable to Believe" Norm:** "Assert $p$ if it is reasonable for you to believe $p$."
      *   *Does it dodge the Lottery?* Yes. It is reasonable to believe your ticket will lose (high probability). So this norm says you *can* assert it.
      *   *The New Problem:* It creates the **"Lucky Guess" problem**. If I guess the outcome of a coin flip, is it "reasonable" to believe my guess? If I say yes, this norm allows me to assert guesses. Most epistemologists think you shouldn't assert mere guesses, even if they turn out true. The Knowledge Norm blocks guesses (because you don't *know* a guess is right); the Reasonable Belief Norm might let them through.

  ### 3. Moore's Paradox: Is it the same point?

  Moore's Paradox is the statement: *"It is raining, but I don't believe it is raining."*
  This is logically possible (it could be raining while I'm ignorant), but it sounds crazy to *say*.

  *   **Is it the same argument?** No, it attacks from a different angle.
      *   **The Lottery** tests the **evidence threshold** (How much proof do I need to speak?).
      *   **Moore's Paradox** tests the **commitment** (What does speaking imply about me?).
  *   **The Connection:** When you assert "It is raining," you represent yourself as *knowing* (or at least believing) it is raining. If you immediately add "but I don't believe it," you cancel the very commitment your assertion created.
  *   **For the Knowledge Norm:** Moore's Paradox supports KNA because if assertion represents knowledge, saying "I don't know/believe it" creates a contradiction in your social stance, even if the facts are true.

  ### 4. Translating to Dialogue

  Your character shouldn't lecture; she should interrupt. She needs to treat the Knowledge Norm like a rule of etiquette, similar to "don't chew with your mouth open."

  Here are three ways to stage this at dinner:

  **Scenario A: The Lottery (The "Strictness" Trap)**
  *Guest:* "Don't worry about the raffle, Sarah. You're not going to win. There are too many tickets."
  *Epistemologist:* "You shouldn't say that."
  *Guest:* "What? It's statistics."
  *Epistemologist:* "It's probability. You don't *know* she won't win. If you assert it as fact, you're claiming a causal link you don't have. You're speaking outside your epistemic rights."
  *Guest:* "It's a one-in-a-million chance!"
  *Epistemologist:* "And if it wins, your assertion was false. But even if it loses, your assertion was improper. You guessed. Don't dress up a guess as knowledge."
  *(This makes her sound pedantic and rigid, which fits.)*

  **Scenario B: The "Reasonable Belief" Dodge**
  *Guest:* "Okay, fine. I reasonably believe she'll lose. That's enough to talk about it."
  *Epistemologist:* "Is it? If I guess the next card is the Ace of Spades, I'm not violating logic. But if I assert it, I'm misleading you about my evidence. The norm isn't just 'don't be irrational.' It's 'don't present yourself as an authority unless you are one.'"
  *(This highlights why the "Reasonable Belief" norm is too weak for her.)*

  **Scenario C: Moore's Paradox (The "Commitment" Angle)**
  *Guest:* "Look, it's definitely going to rain later, though I have no idea why I think that."
  *Epistemologist:* "You can't say that."
  *Guest:* "Why not? It might rain!"
  *Epistemologist:* "Because when you say 'It is raining,' you're signing a contract. You're telling us you have the goods. Adding 'I have no idea' voids the contract. It's like handing me a check and telling me the bank account is empty. The words work, but the transaction fails."

  ### 5. Summary for your notes

  1.  **The Lottery:** Usually supports the Knowledge Norm (because we feel we *can't* assert the loss), but critics say it makes the norm too strict. Your character should side with the Norm (refusing to assert based on stats).
  2.  **Reasonable Belief:** Solves the Lottery (allows the assertion) but fails on Lucky Guesses (allows assertions without evidence).
  3.  **Moore's Paradox:** Shows that assertion is a representation of the speaker's mind, not just the world. It supports KNA by showing assertion implies a mental state of knowing.
  4.  **Character Voice:** She treats "Knowledge" as a social credential. To assert without knowledge is like wearing a medal you didn't earn.

  This setup lets her be technically correct (holding a defensible philosophical position) while being socially unbearable (enforcing that position during dessert).
