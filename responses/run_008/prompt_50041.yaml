answer: |-
  ### The Verdict

  **She will predict that the federation will not survive in its current form for the next thirty years.**

  She will likely advise you against the mortgage, or at least hedge your citizenship arrangements. Her reasoning will mirror the film stock and the personalist ruler cases: she will treat the 220-year history as survivorship bias rather than evidence of resilience, and she will treat the "wealthiest province secession" as a structural driver analogous to "technological transition" or "decaying patronage."

  **Confidence:** 85%.
  This is high, but not certain, because the 220-year tenure is a larger data point than the 110-year film firm or 26-year ruler, and her clients (insurers) sometimes require distinguishing between *risk* and *inevitability*. However, her track record shows a consistent willingness to bet against longevity when structural headwinds appear, regardless of past tenure.

  ### Candidate Rules and Analysis

  You have correctly identified the tension in her methodology. I will formalize them as follows:

  *   **Rule 1 (The Structural Base-Rater):** Identify the broadest relevant category (e.g., "multiethnic federations," "restaurants," "personalist regimes"). Apply the aggregate failure rate of that category. Treat case-specific history (tenure, past survival) as noise or selection effects. Treat specific current stressors (tech change, secession, soft money) as confirmations of the base rate's causal mechanism.
  *   **Rule 2 (The Hazard-Updater):** Identify the reference class matched to causal drivers, but allow *survival time* to update the probability. If an entity has survived a specific threat for a long time (220 years), its hazard rate for the next period should decrease (the Lindy Effect). Past survival is evidence of hidden resilience or successful adaptation.

  **Where they agree (The Past Calls):**
  For the cousin's marriage, the aunt's restaurant, and the university program, both rules predict failure. These were all *young* entities (new marriage, new business, new degree). Rule 1 says "base rates for new things are bad." Rule 2 says "hazard rates are highest at the start." Her reasoning ("base rate," "selection effect," "soft money expires") aligns with Rule 1, but Rule 2 would have yielded the same verdict. These cases do not discriminate between the rules.

  **Where they diverge (The Film Stock & The Ruler):**
  *   **The Film Firm:** 110 years old. Rule 2 suggests a firm surviving a century has proven adaptability and should be stable. Rule 1 says "incumbents die during tech transitions." She predicted **failure**. This is strong evidence for Rule 1.
  *   **The Ruler:** 26 years in power, survived two coups. Rule 2 suggests surviving coups proves strength/entrenchment. Rule 1 says "personalist regimes have a tenure distribution, and patronage decays." She predicted **failure**. This is also strong evidence for Rule 1.

  **Why Rule 1 Fits Best:**
  Her explicit language ("selection effect," "base rate," "merciless") signals a commitment to the *outside view*. She consistently treats past survival not as proof of resilience, but as a sample that hasn't yet been censored by the structural flaw. In the film stock case, 110 years of dominance did not update her forecast against technological transition. In your case, 220 years of federation will not update her forecast against secessionist agitation driven by wealth disparity. She views the "shared commercial elite" not as a stabilizer, but as a fragile coordination mechanism similar to the ruler's "patronage economy"—effective until the economic incentives diverge.

  ### The Discriminating Question

  To confirm whether Rule 1 is absolute or if Rule 2 ever triggers, you need to isolate *tenure* from *stress*. The film stock case had high tenure + high stress. You need to know her view on high tenure + *low* stress.

  **Ask her this:**
  > "Consider a specific, 300-year-old private family trust in a stable jurisdiction with no tax changes looming and no internal family disputes. Do you forecast its dissolution within 30 years based on the base rate of *all* trusts, or does the 300-year history itself create a new reference class with a lower hazard rate?"

  *   **If she says:** "It dissolves at the base rate of trusts; 300 years is just luck," then **Rule 1** is dominant. Your federation is doomed in her eyes.
  *   **If she says:** "The hazard rate drops; it's now a 'dynastic' class distinct from 'new' trusts," then **Rule 2** has traction. There is a chance she might spare the federation based on its 220-year absorption history.

  ### Self-Critique and Fragility

  **Where my inference is most fragile:**
  I am assuming the "Film Stock" case is the truest analogue to the Federation. However, a firm facing technological obsolescence is fundamentally different from a polity facing secession. Firms die when their product is useless; polities often survive by adapting boundaries or constitutions. If she distinguishes between *technical systems* (film) and *adaptive social systems* (federations), my prediction fails. The "Ruler" case is a better political analogue, but 26 years is not 220 years. She might have a "sovereignty threshold" where tenure *does* update the base rate, but only after a certain century mark.

  **Evidence that would flip my prediction:**
  1.  **Client Incentives:** She is paid by insurers and pension funds. These clients often prefer *conservative* risk assessments (assuming risk exists) over *predictive* accuracy (assuming risk resolves). If her "predictions" are actually "risk flags" for hedging purposes, she might predict dissolution to ensure you hedge, even if she privately believes the federation will hold.
  2.  **The "Shared Commercial Elite":** In the prompt, you note the federation is bound by a "shared commercial elite." In the ruler case, she cited "decaying patronage." If she views the commercial elite as a *more robust* binding agent than personalist patronage, she might update. If you hear her describe the elite as "interdependent" rather than "patronage-based," she may see a structural difference that saves the federation.
  3.  **Inconsistency in the Ruler Call:** You noted ambiguity on whether the coups counted as survivorship evidence or symptoms. If she explicitly told you, "The fact he survived two coups means he's entrenched, *but* the patronage is decaying," she *is* using Rule 2 (updating on survival) but overriding it with a stronger negative driver. If she can be overridden, the 220-year history *might* be strong enough to override the secessionist threat in her mind, whereas 26 years was not.

  **Missed Inconsistency:**
  Look closely at the University Program call. She predicted closure because "famous founders leave." This implies she models *key person risk*. In the Federation case, is there a "founder" equivalent? No. But is there a "key province" equivalent? Yes, the wealthiest one. If she treats the wealthiest province as the "famous founder" of the economic union, her prediction holds. If she treats the federation as a "system" without key person risk, the analogy weakens. I have assumed she treats the province as a key-person analogue; if she does not, the structural driver is weaker than in the program case.

  **Final Advice:**
  Prepare for her to say "No." Her brand is seeing the graveyard behind the monument. Do not bet your citizenship on convincing her otherwise; bet on understanding *why* she sees the structural flaw so you can mitigate it.
