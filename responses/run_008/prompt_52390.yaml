      *   **The Core Problem:** EQM is deterministic. All outcomes happen. How do we recover $P = |\psi|^2$ as anything more than a measure of existence, but as *probability* (guiding action, reflecting uncertainty)?
      *   **Decision-Theoretic (DT) Program (Deutsch/Wallace):** Focuses on rational action. If you accept EQM, rationality axioms (branching indifference, diachronic consistency) *force* you to act *as if* the Born rule is true. It derives credence from rationality constraints on preferences over quantum games.
      *   **Self-Locating Uncertainty (SLU) Program (Sebens/Carroll):** Focuses on epistemology. Between branching and observation, there is a period of ignorance about *which* branch one is on. The Born rule emerges from the principle of indifference applied to Hilbert space decomposition (Epistemic Separability Principle).
      *   **Skeptics (Kent, Maudlin, Price, etc.):**
          *   *Incoherence:* Probability requires uncertainty about what happens. If everything happens, there's no uncertainty.
          *   *Circularity:* Derivations assume the structure they try to prove (e.g., assuming the Hilbert space norm is the relevant measure).
