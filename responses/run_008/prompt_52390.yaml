prompt: |-
  I'm a PhD student in philosophy of physics, and the part of the Everettian literature I keep circling back to is the Born rule problem: how a theory in which every outcome of a measurement occurs, each with a successor who sees that outcome, can also say that some outcomes are more probable than others. My sense is that this debate has been running in place for a while now, and I want a diagnosis of the stall rather than another restatement of the positions. On one side there is the decision-theoretic program, descending from Deutsch and Wallace, which argues that a rational agent in a branching world should weight branch outcomes by squared amplitude, deriving that from axioms about rational preference — things like diachronic consistency (don't prefer a branch now that you'll regret once you're in it), branching indifference (don't care about branching per se, only about what happens in the branches), and continuity as amplitudes vary. On another side there is the self-locating uncertainty program, in the vein of Sebens and Carroll, which locates probability in the agent's ignorance, right before the measurement resolves, about which future copy she is — with the Born weights emerging from how the Hilbert space decomposes into equally weighted, qualitatively indistinguishable sectors. And arrayed against both are the skeptics: some say branch counting is arbitrary because the number of branches depends on how you carve the Hilbert space into a basis and how finely you resolve the apparatus, so there is no fact of the matter to hang probabilities on; some say the continuum limit reintroduces measure-theoretic conventionality at exactly the point where the derivation needs to be non-conventional; some follow a line like Greaves's and concede that Everettian agents have no credences to speak of but can still have a "caring measure" over branches, which they say quietly changes the subject from probability to something else; and some just give the whole project an incredulous stare and deny that probability talk makes sense at all when everything happens. I have a hypothesis I'd like you to take seriously but not rubber-stamp: that the decision-theoretic and self-locating programs are not really disagreeing with each other — one is answering an anthropological question about what a rational agent in a branch should do, the other a quasi-metaphysical question about what the probability facts are — and that the genuine, stalled disagreement is between both programs and the skeptics, and is downstream of a prior dispute about whether "everything happens" even permits objective modality. It may also be that part of the fight is verbal, turning on whether "probability" is being used for credence, for frequency, or for the quantum amplitude measure itself, with each camp silently fixing a different one.

  Please take the role of an expert in philosophy of physics with a working knowledge of quantum foundations, think through the structure of the disagreement carefully before committing to a diagnosis, and support the diagnosis with what the various sides actually claim — but do not turn this into a survey of interpretations, and do not pad it with citations or reading lists; refer to positions and arguments by their content, not by bibliography. Where the theory of the disagreement is silent — for instance, if the evidence can't decide between the verbal-dispute reading and the different-questions reading — say so plainly rather than forcing a verdict. I'd also like you to tell me what would count as progress on your diagnosis: a formal result (say, a uniqueness theorem for a decision rule under weaker axioms, or a demonstration that branch decompositions can be principled in the continuum limit), a conceptual distinction, or an argument that no progress should be expected because the question is ill-posed as posed. Finally, state explicitly how confident you are in the diagnosis, and single out the component of it you are least sure about — for me that's likely to be whether the two programs really are compatible rather than competing, and I want to know if you think my framing of the anthropological/metaphysical split is itself part of the problem.

  After the prose analysis, append a JSON object summarizing it, with this schema: a field "diagnosis" (string, your one-paragraph verdict on what kind of disagreement this is); "classification" (string, exactly one of "verbal", "substantive-empirical-or-formal", "different-questions-under-one-name", "standards-of-evidence", "bedrock-intuitions", or "ill-posed", with a short justification if you pick a hybrid); "program_compatibility" (string, whether the decision-theoretic and self-locating programs are competitors or complements, and why); "skeptic_leverage" (string, the single point that gives the skeptics most traction on your diagnosis); "progress_conditions" (array of strings, each a concrete development that would move the debate, or "none" with a reason if you think nothing would); "least_sure_point" (string); and "overall_confidence" (a number between 0 and 1, with one sentence of justification).
