answer: |-
  ### The Problem of Old Evidence in Bayesian Confirmation Theory

  **1. The Core Tension**

  To understand the problem of old evidence, we must first fix the standard Bayesian framework. A rational agent is modeled as possessing a credence function $P$, mapping propositions to real numbers between 0 and 1, satisfying the probability axioms. Learning is modeled via *conditionalization*: upon learning evidence $E$ with certainty, the agent's new credence in any hypothesis $H$ becomes $P_{new}(H) = P_{old}(H|E)$. Confirmation is standardly defined probabilistically: $E$ confirms $H$ if and only if $P(H|E) > P(H)$. By Bayes' Theorem, this occurs when the likelihood ratio exceeds unity, or more simply, when $P(E|H) > P(E)$.

  The problem arises when $E$ is "old evidence"—data the agent already possesses with certainty prior to the formulation or consideration of $H$. In such cases, $P_{old}(E) = 1$. If $H$ entails $E$ (as General Relativity entails the anomalous precession of Mercury's perihelion), then $P(E|H) = 1$. Substituting these values into the ratio measure of confirmation yields:

  $$ \frac{P(H|E)}{P(H)} = \frac{P(E|H)}{P(E)} = \frac{1}{1} = 1 $$

  Thus, $P(H|E) = P(H)$. Formally, learning that $H$ entails $E$ provides zero confirmation to $H$ if $E$ is already known.

  This is not merely a technical artifact; it represents a genuine tension between the Bayesian reconstruction of rationality and the historical practice of science. The Mercury anomaly was known since 1859; Einstein formulated General Relativity (GR) in 1915. Historically, GR's ability to retrodict this standing anomaly was taken as one of its strongest confirmations. If Bayesianism implies that this fit provided no evidential boost to GR, then Bayesian confirmation theory fails to account for some of the most paradigmatic instances of scientific reasoning. It suggests that a theory's ability to systematize existing knowledge is epistemically inert, a conclusion that contradicts the "inference to the best explanation" reasoning scientists actually employ. The machinery rules out by construction what scientists treat as a central virtue of a theory: its explanatory unity with the known world.

  **2. Standard Lines of Repair and Their Costs**

  Philosophers have proposed two primary strategies to resolve this tension, both of which incur significant theoretical costs.

  *(a) The Counterfactual Strategy*
  This approach, associated with philosophers like Daniel Garber, suggests we should not evaluate confirmation based on the agent's actual credences, but rather on a counterfactual state. We ask: what would the agent's credence in $H$ have been *had she not known* $E$? In this hypothetical scenario, $P_{counter}(E) < 1$. Since $H$ entails $E$, $P_{counter}(E|H) = 1$, and thus $P_{counter}(H|E) > P_{counter}(H)$.

  *The Cheat:* This strategy effectively abandons the subjectivist motivation of the Bayesian program. Standard Bayesianism is meant to be a logic of *actual* degrees of belief and how *actual* agents should update. By shifting to a hypothetical agent who lacks knowledge the real agent possesses, the theory ceases to describe the rationality of the actual scientist. It transforms confirmation from a relation between an agent's current state and new input into a historical relation between a hypothesis and data, independent of the agent's actual epistemic timeline. It saves the phenomenon of confirmation by changing the subject from the agent's psychology to an idealized history.

  *(b) The Logical-Learning Strategy*
  This approach, often linked to Richard Jeffrey, relaxes the assumption of logical omniscience. It posits that the agent does not initially know that $H$ entails $E$. The "learning event" is not the discovery of $E$ (which is old), but the discovery of the logical relation $H \vdash E$. The agent updates not on $E$, but on the proposition that "$H$ implies $E$."

  *The Cheat:* This requires giving up the standard probability calculus's assumption that agents assign probabilities only to empirical propositions, not logical ones. It necessitates a probability distribution over logical facts. But where do these priors come from? If an agent is uncertain about logic, the normative constraints on her credences become murky. This strategy saves the update mechanism by complicating the ontology of the probability space, inheriting the difficult problem of how to rationally constrain credences in logical truths without collapsing back into omniscience.

  **3. The Twist: Designed Hypotheses and Novel Predictions**

  We now turn to the specific twist: a modern theorist constructs a modified-gravity hypothesis ($H_{mod}$) *explicitly* to fit galaxy rotation curves ($E_{old}$) measured in the 1970s. $H_{mod}$ is parameterized to ensure $P(E_{old}|H_{mod}) \approx 1$. However, $H_{mod}$ also makes novel predictions ($E_{new}$) regarding gravitational lensing in systems with no rotation-curve data.

  This scenario forces us to confront the relationship between the old-evidence problem, the worry about *ad-hocness*, and the value of novel prediction. Are these three distinct problems, or facets of one?

  **The Counterfactual Test: Einstein vs. The Modern Theorist**
  Let us apply the counterfactual repair to both cases.
  *   **Einstein (1915):** We imagine Einstein prior to knowing the Mercury anomaly. He posits GR. GR entails the anomaly. Confirmation occurs.
  *   **Modern Theorist (2024):** We imagine the theorist prior to knowing the rotation curves. She posits $H_{mod}$.

  Here lies the crux. If the counterfactual strategy treats the hypothesis $H$ as fixed—asking only "What if the agent didn't know $E$, given this specific $H$?"—it **cannot distinguish** between Einstein and the Modern Theorist. In both counterfactual scenarios, we have a hypothesis $H$ that entails data $E$ which the agent does not yet know. In both cases, $P_{counter}(E|H) = 1$ and $P_{counter}(E) < 1$. The math yields confirmation in both instances.

  However, our scientific intuition strongly distinguishes them. Einstein's fit is viewed as a profound theoretical success; the Modern Theorist's fit is viewed with suspicion as "curve-fitting" or *ad-hoc*. The standard counterfactual account fails because it ignores the *genesis* of the hypothesis. It treats $H$ as a static object dropped into the probability space, rather than an object constructed by a process.

  **Three Problems or One?**
  The old-evidence problem, the *ad-hocness* worry, and the novel-prediction debate are ultimately facets of a single underlying issue: **the dependency between hypothesis construction and evidence.**

  1.  **Old Evidence:** The formal problem that $P(E)=1$ blocks updating.
  2.  **Ad-hocness:** The methodological worry that a theory built *to fit* $E$ is less trustworthy than one built independently.
  3.  **Novel Prediction:** The proposed solution that theories predicting *new* data ($E_{new}$) avoid the dependency problem.

  In the twist scenario, the Modern Theorist's model is indeed confirmed by the *new* lensing data ($E_{new}$), because for that data, $P(E_{new}) < 1$. This aligns with the "predictivism" thesis: novel prediction is confirmatory where retrodiction is not (or is less so). However, this does not solve the status of the old evidence ($E_{old}$). The intuition that $H_{mod}$ is *less* confirmed by $E_{old}$ than GR was by Mercury stems from the fact that $H_{mod}$ was *selected* from a space of possible models specifically because it fit $E_{old}$.

  **Required Extra Machinery**
  To capture this distinction, the Bayesian framework requires extra machinery that the standard counterfactual strategy lacks. We cannot simply look at the relation between $H$ and $E$; we must model the **probability distribution over theory-construction processes**.

  We need a prior that penalizes "gerrymandered" hypotheses. This can be formalized in two ways:

  1.  **Complexity Penalties (Model Selection):** We treat $H_{mod}$ not as a single hypothesis but as a member of a family of models with free parameters. Fitting $E_{old}$ consumes degrees of freedom. Using tools like the Akaike Information Criterion (AIC) or Bayesian Information Criterion (BIC) within the framework, the "fit" to old data is discounted by the complexity required to achieve it. Einstein's GR had no free parameters tuned to Mercury; the Modern Theorist's model likely does.
  2.  **Heuristic Novelty (The Generation Probability):** We must assign a prior probability to the *event of constructing* $H$. Let $C$ be the event "Theorist constructs $H$."
      *   For Einstein: $P(C | \text{no knowledge of } E_{Mercury})$ is reasonably high (driven by theoretical virtues like equivalence principles).
      *   For Modern Theorist: $P(C | \text{no knowledge of } E_{rotation})$ is vanishingly low. Why would she construct this specific modified gravity model without the data motivating it?

  If we incorporate this into the confirmation measure, we see that for the Modern Theorist, the high likelihood $P(E_{old}|H_{mod})$ is offset by the low prior probability of the theory's construction in the absence of that data. The counterfactual agent who doesn't know $E_{old}$ would likely not have entertained $H_{mod}$ at all.

  **Conclusion**
  The standard counterfactual repair is insufficient because it isolates the hypothesis from its history of construction. It treats confirmation as a logical relation between propositions, ignoring the causal history of the theorist's mind. To resolve the twist—and indeed the original problem of old evidence—Bayesianism must expand to include a **meta-probabilistic layer regarding hypothesis generation**.

  We must distinguish between the *evidential support* a datum provides to a fixed proposition (which the counterfactual account handles) and the *epistemic position* of the theorist holding that proposition (which requires modeling the selection effect). Einstein's theory is confirmed by old evidence because the theory's existence is probabilistically independent of that evidence. The Modern Theorist's model is not (or is less) confirmed by the old data because its existence is causally dependent on it. Thus, the problem of old evidence is not solved merely by tweaking the definition of conditionalization; it requires a Bayesian epistemology of scientific discovery that accounts for how theories come to be proposed in the first place.
