      *   **Section 3: The Banana and Temporary Intrinsics.** Explain why it's not a refutation. Explain temporally indexed properties.
      *   **Section 4: The Consensus Claim.** Correct the record. It's a live debate.
      *   **Section 5: Personal Identity.** Analyze the "hand to arm" claim. Distinguish metaphysical constitution from prudential concern.
