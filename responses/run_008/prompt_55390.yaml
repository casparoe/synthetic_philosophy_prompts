answer: |-
  Here are the desiderata for an adequate theory of "better than," categorized by function.

  **Core Logical & Action Requirements**
  1.  **Transitivity:** If A>B and B>C, then A>C. *Case:* Basic logical consistency. *Status:* Traditionally non-negotiable.
  2.  **Completeness:** For any A and B, one is better, worse, or equal. *Case:* Prevents decision paralysis. *Status:* Non-negotiable for action-guidance.
  3.  **Choice-Guidance:** If A is better than B, a rational agent ought to choose A. *Case:* Ethics must guide action. *Status:* Non-negotiable.
  4.  **Distinctness:** "A is better than B" is not identical to "I would choose A over B." *Case:* Agents suffer from weakness of will or ignorance. *Status:* Non-negotiable distinction.

  **Substantive Intuitions**
  5.  **Spectrum Avoidance:** A world of massive populations with barely worth-living lives is not better than a world of fewer, very happy people. *Case:* The "Repugnant Conclusion" seems false. *Status:* High priority for most.
  6.  **Small Step Intuition:** If the difference between A and B is imperceptible, B is not worse than A. *Case:* Premise of spectrum arguments. *Status:* Camp-specific.
  7.  **No Sharp Cut-offs:** Tiny changes shouldn't cause massive value flips. *Case:* Value seems vague, not precise. *Status:* Highly desired.

  **The Incompatibility Trilemma**
  You cannot satisfy **Transitivity**, **Small Step Intuition**, and **Spectrum Avoidance** simultaneously.
  *   If every step in a spectrum is "not worse" (Small Step), and Transitivity holds, the final outcome is "not worse" than the start. This violates Spectrum Avoidance.
  *   To save Spectrum Avoidance, you must deny Transitivity or claim some tiny step *was* significantly worse (violating Small Step/No Sharp Cut-offs).
  *   **Secondary Conflict:** Denying Transitivity threatens **Choice-Guidance**. If preferences aren't transitive, agents are vulnerable to "money pumps" (cycling trades until bankrupt).

  **Camp Performance**

  1.  **Intransitivists** (Deny Transitivity)
      *   **Pass:** Spectrum Avoidance, Small Step Intuition, No Sharp Cut-offs.
      *   **Fail:** Transitivity, Choice-Guidance (vulnerable to money pumps), Logical Consistency.
      *   *Verdict:* Saves intuition but breaks logic and rational choice theory.

  2.  **Bullet-Biters** (Total Utilitarians)
      *   **Pass:** Transitivity, Choice-Guidance, Small Step Intuition, Completeness.
      *   **Fail:** Spectrum Avoidance (accept the Repugnant Conclusion).
      *   *Verdict:* Logically robust but substantively counterintuitive.

  3.  **Lexical/Threshold Views** (Deny Small Steps)
      *   **Pass:** Transitivity, Choice-Guidance, Spectrum Avoidance.
      *   **Fail:** Small Step Intuition, No Sharp Cut-offs (claim a specific point where value leaps disproportionately).
      *   *Verdict:* Saves logic and conclusion, but posits arbitrary "magic points" where tiny changes trigger massive value shifts.

  **Summary:** The debate is not about who is right, but which desideratum you are willing to sacrifice. You must drop either logical structure, the plausibility of tiny steps, or the intuition that the conclusion is false.
