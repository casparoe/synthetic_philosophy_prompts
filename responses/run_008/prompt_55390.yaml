prompt: |-
  so in my philosophy club we got into this argument about whether "better than" is transitive (like, if A is better than B and B better than C, is A always better than C?). i thought obviously yes, but then someone brought up these spectrum arguments, where you start with a world full of really happy people and you shift it one tiny step at a time -- each step adding people / subtracting happiness by an amount so small no one would say it makes things worse -- and by transitivity you get forced into saying a world of tons of barely-happy people is better than the original one. and thats when everyone in the club stopped agreeing and nothing got resolved for like 3 weeks lol.

  before i pick a side i want the actual spec. write me the desiderata: what any adequate account of "better than" comparisons between outcomes has to deliver -- which cases it has to get right (the spectrum stuff, but also everyday stuff like choosing between options), which distinctions it has to respect (like, is "i'd choose A over B" the same fact as "A is better than B"?), and what it has to be consistent with. give the case or consideration behind each requirement, and say which ones are non-negotiable vs just what one camp cares about. most importantly, flag any pair of requirements you think can't be satisfied together -- like maybe you cant both handle the spectrums and keep transitivity. then very briefly say how the three camps do against the list: the ones who deny transitivity, the ones who bite the bullet and accept the crazy conclusion, and the ones who say some step in the spectrum argument is sneaky and wrong. keep the whole thing under 600 words and dont bother with citations or book titles, i just want the ideas. a list format is fine btw
