      You are right to feel that nagging tension because the engineering practice is smuggling in a specific philosophical anthropology that rarely gets stated outright. The implicit theory operating beneath most inverse reinforcement learning and preference learning pipelines is not a revealed preference view but rather a form of latent normative realism. When you treat behavior as evidence rather than definition, you are presupposing that preferences exist as internal causal states that generally drive action but can be obscured by performance errors, cognitive limitations, or environmental noise. This is fundamentally a causal view of preference where desires are the hidden variables and actions are the noisy observations. If the field truly held a revealed preference view, where preference is strictly defined by choice disposition, there would be no gap between what the human did and what they wanted, and the very project of inferring a reward function to correct behavior would be category error. The fact that practitioners feel comfortable hand-tuning a reward function when it incentivizes something the human objects to demonstrates that they believe the human has access to a truth about their own values that transcends their immediate behavioral output.

      This reliance on a latent truth is most visible in how the noise assumption is deployed. By modeling deviations from optimality as random noise or Boltzmann temperature rather than systematic bias, the practice presupposes that human error is unsystematic in a way that makes the recovered preference something the human would endorse on reflection. The math assumes that if you average out the noise or observe enough trajectories, the signal converges on the true reward function. This implies a theory of error where mistakes are accidental slips rather than expressions of conflicting sub-agents or changing values. When a human complains about the inferred reward, and you prioritize that complaint over the behavioral data used to train the model, you are effectively asserting that the explicit report is a less noisy channel to the latent preference than the motor trajectory. This creates a hierarchy of evidence where reflective endorsement trumps unreflective action, which is inconsistent with a strict revealed preference framework but entirely consistent with a folk-psychological view where people know what they want better than their habits show.

      The consistency between the IRL branch and the RLHF branch holds only if you accept this latent variable framework. In IRL, you are decoding the latent preference from action noise. In RLHF, you are decoding it from judgment noise. When the two conflict, and you side with the judgment, you are not switching theories of evidence but rather weighing the signal-to-noise ratio of different modalities. The practice assumes that pairwise judgments are closer to the reflective ideal than mouse trajectories or driving demos. However, this is an empirical bet rather than a logical necessity, and it leaves the field vulnerable to the possibility that humans are systematically mistaken about their own preferences or that their reports are just as noisy as their actions. The underdetermination problem you mentioned is solved mathematically by priors, but philosophically those priors encode the assumption that human preferences are simple, consistent, and recoverable, which is a substantial claim about the nature of human psychology that goes beyond the code.

      If you were to replace this implicit theory with a hardline revealed preference view where the inferred reward is correct by construction, the entire alignment project would collapse into behavior cloning or dissolve entirely. Under hardline revealed preference, there is no such thing as a human doing something dumb that day because whatever they did is by definition what they preferred at that moment given their constraints. There would be nothing to correct because the behavior is the ground truth. You could not hand-tune the reward function based on a complaint because the complaint is just another behavior with its own reward signal, potentially conflicting with the driving demo, and there is no higher court of appeal to decide which one represents the true preference. The goal of building a machine that pursues what the human wants would be replaced by building a machine that predicts what the human will do, shifting the field from normative alignment to descriptive modeling. This would render the concept of mistake meaningless in the context of preference, as any deviation between the agent and the human would simply be a difference in preference rather than an error in inference.

      Ultimately, the practice is running a hybrid theory that treats preferences as real, stable, internal causes that are imperfectly expressed through both action and report. It is not strictly consistent in a formal logical sense because it relies on a normative judgment about which evidence counts more when they conflict, but it is pragmatically consistent with the goal of alignment. The field presupposes that humans have a coherent identity over time that survives momentary lapses in rationality, and that this identity is the proper target of optimization. This is why the code works despite the philosophical ambiguity. The priors and regularization terms are doing the heavy lifting of enforcing a theory of mind that assumes humans are roughly rational agents with stable goals, rather than mere behavior generators. To change this would require abandoning the hope that we can improve upon human behavior according to the human's own standards, which is the core motivation behind most preference learning work.

