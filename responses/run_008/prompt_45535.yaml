answer: |-
  The signal arrived on a Tuesday, wrapped in the static of the cosmic microwave background. It didn't whisper; it shouted.

  Dr. Aris Thorne stood before the main bank of monitors at the SETI Institute, watching the entropy graph plummet. Natural noise was chaotic, a jagged mountain range of randomness. This signal was a valley. Perfect, smooth, statistically impossible.

  "That's the Frame," Aris said, her voice barely rising above the hum of the servers. "It's saying, *'I am not nature. I am a vessel. Open me.'*"

  Director Halloway nodded, lighting a cigarette despite the ban. "We hear you. Now, what's inside?"

  For six months, the world held its breath. This was the phase of the Outer Message. In any communication, the Frame announces the existence of a message, but the Outer Message provides the key to unlock it. It is the Rosetta Stone, the instruction manual, the syntax guide. Usually, senders embed this in the mathematics of the signal itself—prime number sequences, hydrogen line frequencies, geometric constants.

  Humanity's best minds threw every key they possessed at the lock. They tried binary, base-twelve, quantum state mappings, and semantic algorithms derived from every known language. They treated the signal as an image, as audio, as a genetic code.

  Every time, the result was the same.

  Aris sat in the briefing room, the air thick with stale coffee and exhaustion. On the projector screen, the Inner Message was displayed. It was a single line of text, rendered in stark white against black.

  `0`

  "It's a zero," Halloway said, rubbing his temples. "Or a null set. Or silence."

  "It's the same zero we got when we treated the signal as base-2 binary," Aris said, pointing to the log. "It's the same zero we got when we mapped it to protein structures. It's the same zero when we treated it as a map of the local star cluster."

  "Then the message is nihilism," Halloway snapped. "The aliens are telling us that existence sums to nothing. That's the Inner Message. We decode it, we publish it, we go home."

  "No," Aris said. She stood up, walking to the screen. "If the Inner Message is the content, and the content is invariant regardless of the key, then the key isn't the variable. *We* are the variable."

  Halloway scoffed. "Don't get metaphysical on me, Aris. We're cryptographers, not philosophers."

  "Hofstadter wrote about this," Aris insisted, turning to face the room. "The tripartite structure. Frame, Outer, Inner. The Frame told us it was a message. We assumed the Outer Message was a set of instructions hidden *in* the signal. But what if the Outer Message isn't data? What if it's a demand?"

  She pulled up the logs of the last six months. Thousands of decryption attempts. "Look at what we had to do to get this zero. To agree on the protocols, we had to unify our mathematical standards. To build the receivers, we had to synchronize our global networks. To interpret the null result, we had to sit in a room and argue about the nature of meaning until we agreed on a definition of 'zero'."

  She tapped the screen. "The Inner Message is empty. It has to be. Because the meaning isn't in the payload. The meaning is in the decoding mechanism we were forced to build."

  Halloway stared at her. "You're saying the aliens sent us a blank check, and the value is whatever we write on it?"

  "I'm saying they sent us a mirror," Aris corrected. "The Outer Message wasn't a key to open a box. It was a mold. To decode this, humanity had to organize itself into a single cognitive entity. We had to strip away our cultural biases to find a universal math. We had to confront the limits of our own logic. The signal didn't contain information; it induced a state of being in the receiver."

  "That's unscientific," Halloway said, though his voice lacked its earlier conviction. "We can't publish a report that says, 'The message is that we tried hard.'"

  "Why not?" Aris asked. "If I send you a locked box, and the only way to open it is for you to forge a specific key that requires you to learn a new skill, what is the gift? The box? Or the skill?"

  She turned back to the data. The frustration of the last six months washed over her, but now it looked different. It wasn't failure; it was friction. The heat generated by the attempt was the point. The signal was a catalyst. It had forced rival nations to share bandwidth. It had forced linguists to talk to physicists. The "Outer Message" was the collective restructuring of human cognition required to even attempt the decoding.

  "The Inner Message is empty," Aris continued, "because the content is us. The signal is a probe. It measures the shape of the mind that catches it. If we were a warlike species, the decoding process would have weaponized the technology. If we were solitary, we wouldn't have decoded it at all. We decoded it together. That's the message."

  Halloway stood up, walking to the window. The night sky was clear, the source of the signal somewhere in the dark. "If we release this, the public will think we failed. They want contact. They want instructions. They want to know if we're saved or damned."

  "They want the Inner Message," Aris said softly. "Because they think meaning is a thing you receive. But meaning is a thing you build. The Frame said, *'I am a message.'* The Outer said, *'Here is the cost of understanding me.'* And the Inner says... *'You paid it.'*"

  She walked over to the console and highlighted the report draft. Halloway's version was titled: *ANALYSIS OF NULL PAYLOAD IN EXTRATERRESTRIAL SIGNAL.*

  Aris deleted the title. She typed a new one.

  *REPORT ON RECEIVER-CONSTRUCTED SEMANTICS IN SIGNAL 88-BETA.*

  "You're risking your career," Halloway said, watching her type. "If there *is* a real key, and we missed it, and you tell the world the message is 'humanity,' we look like fools."

  "And if I tell them the message is 'zero,' we look like children waiting for a parent to tell us what to think," Aris replied. She hit *Enter*. The document saved. "The signal is static now. It's done its work. It changed the structure of the receiver. That's the only communication that matters."

  She looked at the screen, at the blinking cursor next to the solitary zero. It wasn't a period at the end of a sentence. It was a seed.

  Halloway sighed, the sound heavy in the quiet room. He walked back to the table and looked at the new title. He didn't argue. He didn't order her to change it back. He just looked at the zero, then at the team of exhausted researchers sleeping in the corners of the room, united by a puzzle that had consumed them all.

  "The Outer Message," Halloway murmured, testing the weight of the words. "The mechanism of decoding."

  "The process is the product," Aris said.

  Halloway nodded slowly. He reached out and turned off the monitor. The room plunged into darkness, save for the glow of the exit signs. In the dark, the signal was gone, but the silence it left behind felt different. It wasn't empty. It was pregnant with the weight of the effort required to hear it.

  "Send the report," Halloway said.

  Aris didn't move immediately. She sat in the dark, feeling the hum of the building, the collective breath of the team, the unified pulse of a species that had reached out and touched its own reflection in the void. The aliens hadn't told them anything. They had simply asked a question loud enough that everyone had to stop and listen to the answer they gave themselves.

  "Sent," Aris said.

  The meaning was no longer in the stars. It was in the room.
