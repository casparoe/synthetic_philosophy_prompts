          *   Protagonist: A researcher who realizes the *process* of decoding is the meaning (the Outer message *is* the message).
          *   Theme: Meaning is constructed by the receiver, not just contained in the signal.
      *   **Constraints:** 800–1500 words. Show, don't just tell (emerge through plot/character). Demonstrate grasp of the three layers. Ending must turn on the conceptual issue.

  2.  **Deconstruct Hofstadter's Layers for the Story:**
      *   *Frame Message:* "I am a message." In the story, this needs to be the initial discovery. Prime numbers, specific frequencies, something that says "Artificial."
      *   *Outer Message:* "Here is how to decode me." This is the trap. Usually, this is a dictionary or a mathematical key. In this story, every key leads to the same empty result.
      *   *Inner Message:* "The content." In this story, it's null. "0", " ", or silence.
      *   *The Twist/Realization:* The struggle to find the Outer Message *changes* the receiver. The meaning is the self-reflection induced by the failure to decode.

  3.  **Character Development:**
      *   Need a protagonist who gets frustrated but then has the epiphany. Let's call her Dr. Aris Thorne.
      *   Need a foil who represents the traditional view (the Inner Message must hold the truth). Let's call him Director Halloway.
