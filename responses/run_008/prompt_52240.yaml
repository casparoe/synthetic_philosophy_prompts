  My two roommates got into it while we were loading the moving van last weekend and I want someone to referee, because I honestly lost the thread of who was winning.

  It started because I made a dumb offhand comment about how many objects we still had left to load. Jenna said the question kind of has no answer: there are just fundamental particles arranged in certain ways, and "table" and "chair" are labels humans invented for their own purposes -- the universe doesn't care where the table ends. Ben thought this was rediculous: the table has been one single object since we bought it, we've hauled it between three apartments, and it's absurdly deflationary to say it doesn't exist just because physics doesn't have a word for it. Jenna said fine, she'll happily grant the table exists the moment he tells her the actual rule for when some particles add up to one object -- is there a table-shaped thing plus a further object made of the table together with the lamp sitting on it? Ben said obviously not, things have to be working together as a unit, that's what makes them one thing. Jenna pounced on that: so a pile of sand counts as one object when it's packed into a floodwall but the very same grains scattered in a kid's sandbox don't, meaning whether composition happens depends on our plans for the grains, and "there are 47 objects in this van" turns out to be a fact about us, not the van. Ben said he can actually live with that: "weed" and "junk food" are partly our-invention categories too, but dandelions and twinkies are still real things, and he doesn't see why the table can't be real in exactly the same way. Jenna said that just concedes her whole original point then -- not that the table is unreal, but that counting objects is like counting weeds, with no objective answer, which is all she ever meant by it.

  Can you go through their exchange in exactly five numbered points, one per move in the argument, each a sentence or two saying who's right on that step and why? No intro or conclusion, just the five points.
