answer: |-
  ### Brainstorm: Mapping the Possible Justifications

  Before settling on a considered view, let's map the theoretical landscape. Why *might* a system draw the line where it does?

  1.  **The Naturalist/Functionalist View (Boorse/Daniels):** Medicine's goal is to restore "species-typical functioning." Deviations are pathologies; variations are not. Justice requires restoring normal opportunity, not maximizing it.
  2.  **The Prioritarian View:** We owe more to those who are worse off. A child with a pituitary deficiency is "worse off" than a statistically short child. The line isn't about "normalcy" but about relative deprivation.
  3.  **The Sufficiency View:** The goal is to get everyone above a threshold of adequate capability. Once you are "normal enough," further investment yields diminishing moral returns.
  4.  **The Welfarist/Utilitarian View:** Fund whatever maximizes aggregate wellbeing per dollar. Therapy usually has higher marginal utility than enhancement (diminishing returns), but not always.
  5.  **The Administrative/Regulatory View (The Skeptical Line):** The line isn't ethical at all. It's bureaucratic. FDA approves drugs for "diseases." Insurance covers FDA indications. "Disease" is legally defined by deviation from statistical norms. The philosophy is post-hoc rationalization for actuarial and regulatory constraints.

  ***

  ### Considered View

  You have identified one of the central tensions in contemporary bioethics, often framed as the **Treatment-Enhancement Distinction**. Your intuition is correct: the practice strongly suggests a commitment to a normative baseline of functioning. However, your suspicion that the practice is *underdetermined* by the theory, and that the "philosophy" may be a veneer for tractability, is even more insightful.

  Here is how I break this down.

  #### 1. The Dominant Theory: Species-Typical Functioning (STF)
  The standard philosophical justification for the pattern you describe comes from Norman Daniels (building on Christopher Boorse). The argument is that health is the maintenance of "species-typical functioning." Justice in health care is not about maximizing happiness or capability generally, but about protecting the "normal opportunity range" available to people in your society.

  *   **The Coherence Problem:** You rightly ask: *Statistical norm or idealized design?* Boorse tried to argue for a value-free biostatistical theory (BST), where "normal" is simply what the species does. But as you noted, presbyopia (age-related vision loss) is statistically normal for adults over 45, yet we treat it (reading glasses, Lasik). If "normal" is statistical, presbyopia isn't a disease. If we treat it, we are admitting that "normal" is actually "idealized design for a specific social environment."
  *   **The Fix:** Daniels modifies this to be *age-relative* species-typical functioning. But this introduces arbitrariness. Why is 20/20 vision the baseline for a 30-year-old? It's a functional requirement for modern literacy and driving, not a biological necessity.
  *   **Verdict:** STF is the *explicit* theory often cited, but it is leaky. It struggles to explain why we treat some statistical normals (pregnancy, aging) and not others, or why we sometimes accept sub-normal functioning (dialysis doesn't restore kidney function to normal, it substitutes it).

  #### 2. Is the Practice Underdetermined?
  This is the crucial philosophical pivot. **Yes, the practice is radically underdetermined by the theory.** You can arrive at the exact same coverage decisions (GH for deficiency, not for shortness; SSRIs for depression, not for brightness) using completely different ethical frameworks.

  *   **Prioritarianism:** A prioritarian doesn't care about "species-typical." They care about who is worst off. The child with the pituitary deficiency is further from the social mean than the healthy short child. The depressed patient is suffering more than the healthy patient seeking brightness. Prioritarianism yields the same coverage map as STF, but the *reason* is different (alleviating suffering/deprivation vs. restoring function).
  *   **Cost-Effectiveness (QALYs):** Most health systems are implicitly utilitarian regarding budgets. Moving a patient from "pathological" to "normal" usually yields a massive gain in Quality-Adjusted Life Years (QALYs). Moving a patient from "normal" to "enhanced" yields diminishing marginal returns. 20/10 vision adds very little utility over 20/20. Growth hormone for a healthy short child is expensive and yields small utility gains compared to treating a deficiency.
  *   **Conclusion on Underdetermination:** The fact that National Health Services (socialist) and Private Insurance (capitalist) systems converge on these decisions suggests the driver isn't a deep commitment to "human nature" or STP. It's that **diminishing marginal utility** and **prioritarian intuition** converge with **species-typical norms** in 90% of cases. The practice does not prove the theory.

  #### 3. The Welfarist Challenge: What if we switched?
  If you replaced the implicit baseline with a straightforward welfarist view ("fund whatever produces the most wellbeing per dollar"), would the decisions change?

  **The Ripple Effect would be significant, but perhaps not where you expect.**

  *   **Where it stays the same:** Due to diminishing returns, welfarism often supports therapy over enhancement. The utility gain of curing blindness is higher than the utility gain of giving someone telescopic vision. So, Lasik for myopia stays; Lasik for super-vision goes.
  *   **Where it breaks (The "Cosmetic" Problem):** A strict welfarist would have to fund "enhancements" if they were cost-effective. If Modafinil is cheap and significantly boosts a student's exam performance (leading to higher lifetime income and happiness), a welfarist system *should* cover it. Currently, this is excluded because it's "not medical."
  *   **Where it breaks (The "Expensive Therapy" Problem):** Conversely, a welfarist might *deny* expensive therapies that restore function but yield low wellbeing. If a cancer drug costs $500k and extends life by 3 months with high suffering, STF says "it's health, cover it." A hard welfarist says "terrible ROI, deny it."
  *   **Mental Health:** This is the biggest rupture. Under STF, SSRIs are for restoring normal mood regulation. Under welfarism, if SSRIs make a healthy person *more* productive and happy than baseline, they become a public good. The "cosmetic psychiatry" ban would vanish.

  So, the pattern would hold in *vision* and *growth* (due to biology's diminishing returns), but it would fracture in *cognition* and *end-of-life care*.

  #### 4. The Skeptical Objection: Is there a puzzle here?
  You asked me to be plain if I think you've misdescribed the pattern or if there's no real puzzle. Here is the uncomfortable truth: **You are likely over-intellectualizing the insurance bureaucracy.**

  The pattern you see is not primarily the result of bioethicists debating Norman Daniels. It is the result of **regulatory path dependence.**

  1.  **FDA/EMA Approval:** Drugs and devices are approved for specific *indications*. To get approval, a company must prove the drug treats a *disease*.
  2.  **Defining Disease:** To define disease, regulators rely on coding manuals (ICD-10/11). These manuals rely on deviations from statistical norms.
  3.  **Insurance Contracts:** Insurers (public or private) write contracts based on FDA indications and ICD codes. They do not hire philosophers to draw the line; they hire actuaries to follow the codes.

  The "Species-Typical Functioning" theory is the *ex-post* rationalization that bioethicists and policy makers use to make the system look coherent. But the engine is **tractability**.

  *   **Why not fund the short kid?** Because "shortness" is a continuum. Where do you draw the line? The 5th percentile? The 10th? It creates a "slippery slope" administrative nightmare. A pituitary deficiency is binary (hormone level X vs Y). Binary rules are cheap to administer; continuum rules are expensive.
  *   **Why not fund enhancement?** Because demand is infinite. If you fund 20/10 vision, you must fund 20/5. There is no natural stopping point. "Restoring normal" provides a natural budgetary cap.

  ### Final Synthesis

  Your intuition that the system presupposes **Species-Typical Functioning** is correct regarding the *rhetoric* and the *normative justification* offered by ethicists. However, that theory is not coherent enough to bear the weight of the practice (due to the statistical/ideal ambiguity).

  More importantly, the practice is **underdetermined**. You could justify the exact same coverage map using Prioritarianism (help the worst off) or simple Cost-Effectiveness (diminishing returns).

  However, the most robust explanation for the pattern is not ethical theory at all, but **administrative tractability**. The "Therapy/Enhancement" line is a proxy for "Budgetable/Unbudgetable."
  *   Therapy has a natural stopping point (normalcy).
  *   Enhancement has no natural stopping point (maximization).

  If you switched to a pure welfarist view, the *vision* and *growth* decisions might stay the same (due to diminishing returns), but the *psychiatric* and *cognitive* decisions would ripple significantly, likely forcing the system to fund "enhancements" that are currently deemed cosmetic. But ultimately, the system would likely resist this, not because of philosophy, but because infinite demand meets finite budgets, and "normalcy" is the only defensible cap.

  **Correction/Refinement:** You haven't misdescribed the pattern; it is real. But you may be misdescribing the *cause*. It is less a committed philosophical stance on human nature and more a bureaucratic technology for rationing scarce resources without appearing cruel. The "philosophy" is the story we tell to sleep at night; the "money" is the hand that draws the line.
