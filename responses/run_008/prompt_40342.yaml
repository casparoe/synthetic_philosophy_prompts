answer: |-
  **MEMORANDUM**

  **TO:** Adjudication Panel
  **FROM:** Senior Adjudicator
  **SUBJECT:** Procedural Guidance: Determining 'Knowing' or 'Deliberate' Disregard of Risk
  **DATE:** 24 May 2024

  ### 1. Purpose and Stance

  This procedure governs cases where the severity of a sanction turns on whether a licensee *deliberately* or *knowingly* disregarded a risk to public safety.

  We must take a stance on a known psychological phenomenon: people tend to judge an action as more "deliberate" when the outcome is harmful than when it is beneficial, even if the decision-maker's mindset was identical.

  **Our Stance:** We reject the proposal to mathematically "correct" for this asymmetry. In professional licensing, the *moral weight* of accepting a risk to human safety is different from accepting a chance of benefit. An engineer who accepts a risk of death for profit is more culpable than one who accepts a chance of savings for profit, even if the mental mechanics are similar. The asymmetry tracks a real normative difference.

  **However,** we must guard against punishing *outcome* rather than *mindset*. We cannot find "deliberate disregard" simply because a building collapsed. We must find that the licensee accepted the risk *before* the outcome was known. This procedure isolates the mental state first, then applies the normative weight.

  ### 2. The Decision Procedure

  Adjudicators must answer the following four questions in order. If any question is answered "No," the inquiry terminates at that level (e.g., a "No" at Step 2 precludes a finding of Deliberate Disregard).

  **Step 1: The Objective Risk**
  *Question:* Was there a substantial risk to public safety that a competent engineer *ought* to have recognized at the time?
  *   **Sufficient Answer:** Yes, supported by expert testimony on standards existing at the time of the decision.
  *   **Termination:** If **No**, there is no misconduct. If **Yes**, proceed to Step 2.

  **Step 2: Subjective Awareness**
  *Question:* Did *this* licensee actually know about the risk, or was the risk so obvious that claiming ignorance is itself a lie?
  *   **Sufficient Answer:** Direct evidence (emails, minutes) OR evidence that the risk was glaringly obvious to any peer (constructive knowledge).
  *   **Termination:** If **No** (they truly did not know and could not reasonably have known), finding is **Negligence** (at most). If **Yes**, proceed to Step 3.

  **Step 3: Volition and Capacity**
  *Question:* Did the licensee have the practical ability to act differently without facing impossible duress?
  *   **Sufficient Answer:** Evidence that they could have halted work, requested more testing, or resigned the commission without threat of physical coercion or illegal retaliation. Financial loss or reputational damage does *not* count as duress.
  *   **Termination:** If **No** (true duress), finding is **Excused**. If **Yes**, proceed to Step 4.

  **Step 4: The Attitude of Disregard (The Values Hand-off)**
  *Question:* Did the licensee proceed *because* the risk was treated as secondary to another goal (profit, schedule, convenience)?
  *   **Sufficient Answer:** Evidence that the risk was weighed and discounted, OR that the licensee avoided confirming the risk to maintain "plausible deniability" (Willful Blindness).
  *   **The Counterfactual Test (Crucial):** *If the building had not collapsed (or the risk had not materialized), would we still view this decision as unacceptable professional conduct?*
      *   If **Yes**: The finding is **Deliberate/Knowing Disregard**.
      *   If **No** (we only think it's bad because things went wrong): The finding is **Negligence**.
  *   **Termination:** This is the final determination.

  ### 3. Application to Test Cases

  Here is how this procedure applies to three representative scenarios.

  **Case A: The Under-Tested Foundations**
  *Facts:* Licensee approved foundations he had reason to believe were under-tested. He did not check. Delay would have cost his firm a contract.
  *   **Step 1 (Objective Risk):** Yes. Under-tested foundations pose a structural risk.
  *   **Step 2 (Awareness):** Yes. He had "reason to believe."
  *   **Step 3 (Volition):** Yes. Losing a contract is financial pressure, not duress.
  *   **Step 4 (Attitude):** Yes. He prioritized the contract over verification.
  *   **Counterfactual Test:** If the building had stood, was it still unacceptable to approve known under-tested work? Yes.
  *   **Finding:** **Deliberate Disregard.** (Sanction: Suspension/Striking-off).

  **Case B: The Marginal Design (The "Lucky" Gambler)**
  *Facts:* Licensee knowingly used a cheaper design that was adequate-but-marginal. He was open about the trade-off at the time. Nothing failed.
  *   **Step 1 (Objective Risk):** Yes. "Marginal" implies reduced safety margin, which is a risk.
  *   **Step 2 (Awareness):** Yes. He was "open about the trade-off."
  *   **Step 3 (Volition):** Yes. He chose the cheaper option.
  *   **Step 4 (Attitude):** Yes. He accepted the reduced margin to save cost.
  *   **Counterfactual Test:** If the building stands (which it did), was it still unacceptable to knowingly reduce safety margins for cost? Yes. The Code requires safety margins, not just "adequate" performance under ideal conditions.
  *   **Finding:** **Deliberate Disregard.** (Sanction: Suspension/Striking-off).
  *   *Note:* This result may feel severe because no physical harm occurred. However, the procedure dictates that the *gamble* with public safety is the misconduct, not the loss.

  **Case C: The Fraudulent Agent**
  *Facts:* Site agent falsified inspection records. Licensee claims he wanted compliance and simply never looked.
  *   **Step 1 (Objective Risk):** Yes. Falsified records hide potential risks.
  *   **Step 2 (Awareness):** **Unclear/No.** Did he know the agent was falsifying? If he had no reason to suspect the agent, he did not know the risk existed.
  *   **Step 3 (Volition):** N/A.
  *   **Step 4 (Attitude):** Did he avoid looking to maintain deniability? If there is no evidence he suspected fraud, he cannot be "willfully blind."
  *   **Finding:** **Negligence.** (Sanction: Reprimand/Retraining).
  *   *Note:* This finds the licensee liable for poor supervision, but not for deliberate disregard. To find Deliberate here, you must prove he *suspected* the fraud and looked away.

  ### 4. The Uncomfortable Result

  You will note that **Case B** results in a finding of **Deliberate Disregard**, despite the fact that the structure did not fail and no one was hurt.

  This is the logical consequence of the stance we have adopted. If we agree that "asymmetry is signal" (that accepting harm is worse than accepting benefit), we must also agree that *luck* does not erase culpability. If we rule Case B as mere Negligence simply because the building stood, we are implicitly agreeing with your friend: we are "correcting" for the lack of harm.

  If you find this result uncomfortable—that an engineer faces striking-off for a building that is currently safe—it indicates that your institutional values may prioritize *consequential harm* over *professional integrity*. This procedure forces you to choose. If you wish to sanction Case B lightly, you must amend Step 4 to require actual damage for a "Deliberate" finding. But be aware: doing so licenses engineers to gamble with safety provided they are lucky enough not to get caught by physics.

  ### 5. Limitations: Where Psychology Ends and Values Begin

  This procedure cannot solve the following problems. Adjudicators must recognize these as institutional value judgments, not factual discoveries:

  1.  **Defining "Substantial Risk" (Step 1):** Psychology tells us how people judge risk; it does not tell us how much risk is *permissible*. Deciding whether a "marginal" design is an acceptable professional gamble is a policy decision for this Board, not a fact for the adjudicator.
  2.  **The Weight of "Duress" (Step 3):** We have defined financial loss as insufficient duress. This is a value choice. In an economic downturn, adjudicators may feel moral conflict punishing an engineer who chose between feeding their family and strict compliance. The procedure does not resolve this tension; it mandates that professional duty overrides financial pressure.
  3.  **Willful Blindness (Step 4):** Distinguishing between "trusting a subordinate" and "deliberately not asking questions" relies on inference. Psychology shows we are all prone to hindsight bias here. If the building collapsed, the licensee's ignorance looks suspicious. If it stood, it looks like trust. The Counterfactual Test is the only tool we have to mitigate this, but it requires human honesty to apply.

  **Instruction:** When writing decisions, explicitly cite the "Counterfactual Test" in Step 4. If you cannot confidently say the conduct was unacceptable absent the harm, you must revert to a finding of Negligence. This provides the lay appeal panel with a clear audit trail of how you separated the *mindset* from the *tragedy*.
