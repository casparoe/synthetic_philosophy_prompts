answer: |-
  Here is the specification you asked for. It is a checklist of desiderata for any theory of artifact identity-over-time. If a theory cannot satisfy these, it fails to describe the world we actually inhabit; if it satisfies all of them, it likely violates logic.

  ### The Desiderata Checklist

  **1. The Maintenance Intuition (Gradual Replacement)**
  *   **The Case:** A vessel undergoes routine repair. One plank rots and is replaced. Then another. Over a decade, 50% of the hull is new timber.
  *   **The Requirement:** The theory must verdict that the vessel after repair is numerically identical to the vessel before repair.
  *   **Why a Requirement:** If the theory verdicts non-identity here, then artifacts have vanishingly short lifespans. It would render the concepts of "ownership," "maintenance," and "heirloom" incoherent. You cannot own a boat if replacing a plank destroys the object you own and creates a new one. A theory that fails this makes ordinary talk about artifacts systematically false.

  **2. The Origin Intuition (Reassembly)**
  *   **The Case:** The original planks are stored, preserved, and later reassembled into a hull according to the original plans.
  *   **The Requirement:** The theory must account for the strong intuition that this reassembled hull has a stronger claim to "originality" than a perfect replica built from new wood.
  *   **Why a Requirement:** If the theory verdicts that matter is irrelevant, then a museum artifact is worth no more than a modern copy. This contradicts the economic, historical, and sentimental practices that define the category of "artifact." A theory that cannot distinguish the reassembled planks from a replica fails to capture the value structure of the domain.

  **3. The Uniqueness Constraint (Non-Branching)**
  *   **The Case:** The museum hull (continuous history, new wood) and the collector's hull (discontinuous history, original wood) exist simultaneously.
  *   **The Requirement:** The theory must verdict that at most *one* of these vessels is the original sloop.
  *   **Why a Requirement:** Numerical identity is a one-to-one relation. If both are the original sloop, then by the transitivity of identity, they are identical to each other. But they are in different places and made of different parts. A theory that allows "branching" identity violates the logic of identity itself. It renders singular reference ("*The* sloop") impossible.

  **4. The Institutional Authority Condition**
  *   **The Case:** A museum conservation charter (e.g., The Venice Charter) or an insurance registry declares a heavily restored object to be the continuous same object for legal and curatorial purposes.
  *   **The Requirement:** The theory must be compatible with, or able to defer to, socially constituted continuity in cases of legal title and provenance.
  *   **Why a Requirement:** Artifacts are *social kinds*, not just natural kinds. A car is a car because of VINs and titles; a ship is a registered vessel because of maritime law. If a metaphysical theory contradicts the legal reality (e.g., says the insured ship was destroyed when the insurer says it wasn't), the theory is pragmatically useless for artifacts. It must explain why social designation can constitute identity in this domain.

  **5. The Matter/Object Distinction**
  *   **The Case:** The planks rot in the basement. The "sloop" is said to survive in the registry, or in the design, or in the museum hull.
  *   **The Requirement:** The theory must distinguish between the identity conditions of the *material constituents* (the timber) and the *artifact* (the sloop).
  *   **Why a Requirement:** Confusing the two leads to category errors. If the artifact is just the sum of its parts, it cannot survive part replacement (violating Desideratum 1). If the artifact is entirely independent of its parts, it becomes a ghost (violating Desideratum 2). The theory must explicitly locate where the object ends and the matter begins.

  **6. The Metaphysical/Social Distinction**
  *   **The Case:** A forgery is passed off as the original for 50 years. Everyone *believes* it is the original.
  *   **The Requirement:** The theory must distinguish between *being taken to be* the object (social epistemic status) and *being* the object (metaphysical status).
  *   **Why a Requirement:** If identity is purely conferred by belief, then history is rewriteable at will. We need to be able to say, "We thought this was the sloop, but we were wrong." A theory that collapses truth into consensus cannot account for discovery or error regarding provenance.

  ***

  ### Evaluation: Non-Negotiables vs. Camp Prejudices

  You asked which of these are hard constraints and which are merely the battleground of your argument.

  **The Non-Negotiables (Logical and Pragmatic Constraints)**
  *   **The Uniqueness Constraint (3):** This is logic. You cannot have $A=C$ and $B=C$ and $A \neq B$. Any theory that violates this isn't a theory of identity; it's a theory of similarity.
  *   **The Matter/Object Distinction (5):** This is categorial. Artifacts are functional unities, not mereological sums. Denying this makes "repair" impossible.
  *   **The Institutional Authority Condition (4):** This is pragmatic. For artifacts specifically, identity is partly constitutive. If the law says the ship is the same, for most human purposes (selling, insuring, displaying), it *is* the same. A theory that ignores this is metaphysically pure but practically vacuous.

  **The Camp Prejudices (The Source of the Stalemate)**
  *   **The Maintenance Intuition (1) vs. The Origin Intuition (2):** This is where your friend and the lawyer are fighting.
      *   Your friend (the restorer) likely prioritizes **Maintenance (1)**. To him, the *work* and the *continuous form* constitute the boat. The hull in the water is the sloop because it never stopped being a boat.
      *   The lawyer (and the collector) prioritizes **Origin (2)**. To them, the *provenance of the material* constitutes the value and identity. The crates contain the sloop because they contain the "soul" (the original matter).
      *   **Verdict:** These are competing weights, not logical requirements. A theory can privilege one over the other, but it cannot satisfy both fully in a divergence case.

  ***

  ### The Incompatibility Warning

  You suspected ordinary practice is inconsistent. You are correct. **Desiderata 1, 2, and 3 cannot be jointly satisfied.**

  This is the Ship of Theseus paradox formalized.
  1.  If you accept **Gradual Replacement** (1), the Museum Hull is the Sloop.
  2.  If you accept **Reassembly** (2), the Crate Hull is the Sloop.
  3.  If you accept **Uniqueness** (3), only one can be the Sloop.

  Ordinary practice tries to have it both ways. We treat the Museum Hull as the sloop for *sailing* (functional continuity) but treat the Crate Hull as the sloop for *valuation* (material authenticity). We switch criteria based on context.

  Therefore, **no single metaphysical criterion can match all ordinary judgments.** If you demand a theory that "gets all the cases right" according to folk intuition, the project is impossible. The folk intuitions are contradictory. A successful theory will not match *all* judgments; it will explain *why* we have conflicting judgments (e.g., by showing we are conflating two different concepts: "functional vehicle" vs. "historical relic").

  ***

  ### The Killer Requirement

  The single requirement that does the most work to exclude otherwise attractive views is **The Uniqueness Constraint (3)**.

  Here is why:
  *   It excludes **Four-Dimensionalism/Perdurantism** solutions that try to say "Both are temporal parts of the same spacetime worm." (In the divergence case, they are distinct worms).
  *   It excludes **Relative Identity** theories that say "It is the same *ship* but not the same *collection of matter*." (This often smuggles in branching).
  *   It excludes the **Best Candidate** theory where both are "equally" the ship.
  *   Most importantly, it forces the **Maintenance** camp and the **Origin** camp to admit that one of them is *wrong*.

  Without the Uniqueness Constraint, your friend and the lawyer can both be right, and the argument dissolves into semantics. *With* the Uniqueness Constraint, one of them is describing the true identity conditions of the artifact, and the other is describing something else (value, sentiment, or function). It is the requirement that turns a conversation about "perspectives" into a debate about truth.

  **Summary for your friend:**
  Tell him you are willing to accept his theory only if it can satisfy the **Uniqueness Constraint** without violating the **Institutional Authority Condition**. If his theory says the museum hull is the boat, but the insurance company says the crate hull is the boat, his theory breaks the world. If his theory says both are the boat, it breaks logic. He must choose which breakage he prefers.
