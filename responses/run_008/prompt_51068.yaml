answer: |-
  This is a specification problem disguised as a definition problem. You are being asked to operationalize a normative concept for empirical use without collapsing into partisan coding. The literature is currently failing because it treats "backsliding" as a *mood* (anxiety about democracy) rather than a *mechanism* (specific institutional changes).

  Below is the spec sheet. I have integrated your five points, pressure-tested them, added the missing operational constraints, and flagged the incompatibilities.

  ### The Spec Sheet: Desiderata for "Democratic Backsliding"

  I have divided these into **Non-Negotiables** (if the account fails these, it cannot perform the practical tasks you listed: EU proceedings, indexing, observation) and **Contested/Preference** (where theoretical camps diverge).

  #### I. Non-Negotiable Requirements (Functional Adequacy)

  | Req | Name | Specification | Motivating Case / Pressure Test |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Institutional Counterfactual** | The change must alter the *rules of competition* such that the incumbent's probability of losing future power decreases, independent of policy popularity. | **Pressure-tests your #1.** Distinguishes "governing conservatively" (welfare cuts) from "backsliding" (gerrymandering). If the policy can be reversed by a successor government without constitutional crisis, it is not backsliding. |
  | **2** | **The Agency Clause** | The erosion must be driven by *strategic action of political incumbents*, not structural decay, economic shock, or societal polarization alone. | **Missed in your list.** Without this, "democratic backsliding" absorbs all social dysfunction. If the judiciary collapses because of underfunding rather than purging, that is state failure, not backsliding. |
  | **3** | **The Trajectory Threshold** | The account must specify a *rate of change* or *cumulative threshold* that exceeds normal constitutional amendment noise. | **Pressure-tests your #2.** Acknowledges measurement error. A single 0.1 drop in V-Dem is noise; three consecutive legal changes restricting NGO funding is a signal. Requires *mechanism-coding* over *score-coding*. |
  | **4** | **The Terminal Distinction** | The concept must have a stop-condition. Once the regime crosses the threshold into competitive authoritarianism, "backsliding" ceases to apply; "regime type" takes over. | **Pressure-tests your #4.** Solves the "15 years of backsliding" problem. You cannot slide forever. If the election is no longer free, the slide is over; you have arrived. |

  #### II. Contested / Preference Requirements (Theoretical Tensions)

  | Req | Name | Specification | Motivating Case / Pressure Test |
  | :--- | :--- | :--- | :--- |
  | **5** | **Symmetry / Neutrality** | The mechanism must be identifiable regardless of the *ideological valence* of the actor or the *normative desirability* of the outcome. | **Pressure-tests your #3.** *Tension Alert:* Hard to satisfy if "Democracy" is defined substantively (liberal rights). If packing courts to protect minorities is "good," but packing them to protect incumbents is "backsliding," the concept is doing normative work, not descriptive work. |
  | **6** | **The Mandate Paradox** | The account must decide whether popular endorsement of illiberal measures inoculates them against the label "backsliding." | **Pressure-tests your #5.** *Tension Alert:* If voters consent to removing checks, is it backsliding? If you say "Yes," you are paternalistic. If you say "No," you make backsliding empirically invisible in polarized societies. |
  | **7** | **Reversibility** | The changes must be theoretically reversible through existing legal channels, however difficult. | **Preference.** Some argue once the norm is broken, it's a new equilibrium. But for "backsliding" to imply a *slide*, there must be a slope, not a cliff. |

  ---

  ### The Incompatibility Matrix

  You suspected that Extensional Fit (getting Hungary right) and Symmetry (neutrality) cannot be jointly satisfied. You are correct, but the deeper tension is between **Symmetry (#5)** and **The Institutional Counterfactual (#1)**.

  *   **The Conflict:** To get the paradigms right (Hungary, Turkey), you must define Democracy in a way that includes liberal constraints (courts, media). If you do that, Symmetry breaks. Why? Because a "good" government strengthening courts to prevent a "bad" future government will look *mechanistically identical* to Orbán weakening courts to prevent a future challenger.
  *   **The Consequence:** You cannot have a purely procedural definition of backsliding that satisfies the EU/Indices use-case. The EU proceedings are *inherently* substantive (they care about rule of law, not just elections). Therefore, **Symmetry (#5) must be downgraded to a Preference.** If you enforce Symmetry, you cannot distinguish "democratic self-defense" from "autocratic entrenchment" without looking at *intent* or *outcome*, both of which violate strict neutrality.
  *   **The Measurement Contradiction:** **Trajectory (#3)** contradicts current Index practices. Current indices (Freedom House, V-Dem) are largely level-based snapshots with expert-coded adjustments. An adequate account of *backsliding* requires longitudinal mechanism tracking. You cannot derive a trajectory reliably from cross-sectional expert surveys subject to coder drift. The spec demands a new coding protocol (tracking *laws passed*, not *expert feelings*), which the literature currently lacks.

  ### The Single Most Exclusionary Requirement

  **Requirement #1: The Institutional Counterfactual.**

  This does the most work excluding accounts people actually hold.
  *   **Why:** Most public and academic discourse conflates "policy I dislike" with "democratic erosion." A tax cut, a border wall, or a school curriculum change are often labeled backsliding by opponents.
  *   **The Filter:** This requirement forces the question: *Could a successor government reverse this with a simple majority?* If yes, it's policy. If no (because the rules of succession or oversight were altered), it's backsliding.
  *   **Exclusion Power:** It eliminates 80% of op-eds and a significant chunk of the "norms" literature that treats rude rhetoric or polarization as backsliding. It forces the focus onto *hard institutional constraints*.

  ### Theory Check (Brief)

  *   **Nancy Bermeo (Gradual Erosion):**
      *   *Fit:* Excellent on **Agency (#2)** and **Trajectory (#3)**. She correctly identifies that backsliding is often legal and gradual.
      *   *Fail:* Weak on **Terminal Distinction (#4)**. Her framework struggles to identify the point where the "erosion" becomes a new regime type, leading to the "15 years of backsliding" problem you noted.
  *   **Bare Elections-First Minimalism (Schumpeter/Przeworski):**
      *   *Fit:* Excellent on **Symmetry (#5)**. It doesn't care *why* you lost, only that you *could* lose.
      *   *Fail:* Catastrophic on **Institutional Counterfactual (#1)**. Minimalism often treats "changing the rules to win" as the *point* of politics. It lacks the resources to condemn court-packing unless it literally cancels the next election. It cannot serve the EU/Indices use-case because it is too permissive of illiberalism.

  ### Recommendation for the Paper

  Do not try to solve the **Symmetry (#5)** problem. It is a philosophical trap. Instead, explicitly define "Democratic Backsliding" for the purposes of the paper as:

  > *"A sequence of incumbent-led institutional changes that increase the cost of political alternation beyond the range of normal constitutional hardball, resulting in a measurable decline in the competitiveness of future electoral cycles."*

  This definition:
  1.  **Satisfies #1 & #2:** Focuses on incumbents and institutions, not policy.
  2.  **Satisfies #3:** Demands a sequence (trajectory), not a snapshot.
  3.  **Satisfies #4:** Implies a threshold ("competitiveness").
  4.  **Sidesteps #5:** It doesn't claim neutrality; it claims *competitiveness* is the metric.
  5.  **Sidesteps #6:** It ignores popularity; a popular move can still raise the cost of alternation.

  This gives your comparative colleague something to code (laws raising alternation costs) and gives you enough philosophical cover to avoid calling welfare cuts "autocracy."
