prompt: |-
  got into a fight with my roommate at dinner about this and its been bugging me for days. I read the color phi chapter of Dennett's Consciousness Explained (skimming parts of it, won't lie), and here's how I understood it: Dennett ran this experiment where two colored dots flash on opposite sides of a screen, and people report seeing a single dot moving across and changing color midway -- even though that intermediate color never actually appeared. The Orwellian theory says your memory of the experience gets rewritten after the fact, the Stalinesque one says the brain fills in the color change before it lets you become conscious of anything. And Dennett's conclusion (as I took it) was that the Stalinesque version has to be right, since the subject never notices a gap or a revision, meaning the brain is literally editing content before it reaches consciousness. If that's the case, isn't that basically the same thing Libet showed for decisions, just for perception? So basically my question: how much of what I experience is fabricated milliseconds before I recieve it, and why do people still defend the Orwellian version when the phi phenomonon settled the argument? My roommate says I've misunderstood the whole thing but won't explain how, and I want to come to our next argument prepared.
