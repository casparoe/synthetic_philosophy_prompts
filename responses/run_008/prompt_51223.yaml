      *   If we reject Step (2), we look like status quo bias defenders.
      *   If we accept Step (2), we risk paralysis.
      *   *Solution:* Distinguish between *active intervention* and *maintenance of baseline*. The burden of proof lies with the *changer* of the state, not the *maintainer*. This isn't bias; it's about agency and causality.

