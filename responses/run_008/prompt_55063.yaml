    "errors": array of objects, each with fields "passage" (the exact words from the student's answer, typos and all — don't clean it up), "problem" (what's wrong and why, in enough detail that another grader could check your reasoning), "severity" (either "major" or "minor"), and "points_off" (how much to take off out of the 10),
