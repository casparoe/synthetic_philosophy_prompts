    "student_comments": 3-4 sentences of the actual comments i'd write on this paper for the student to read — honest but the kind of thing you can say to a first-year without crushing them
  }

  the points_off values across all the errors should actually add up sensibly given the grade you give — if the numbers don't reconcile, thats a bug in your grading, not the schema.
