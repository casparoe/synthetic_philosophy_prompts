  **The Repeated Line:** "Everything she said was true."

  **Why it changes:**
  The first time you read it (line 1), it functions as a baseline assumption of polite conversation. It sounds like a truism: *Of course* she was telling the truth; we were just catching up. It carries no weight; it is simply the condition of two adults talking.

  The second time you read it (line 16), it lands after the recognition. Now "true" does not mean *honest*; it means *real*. It acknowledges that her identity was not created by the name drop, but was present in every sentence she spoke before I knew it. The facts of the conversation haven't changed, but the reality of them has. The line transforms from a comment on her integrity to a comment on the nature of the evening itself. It feels heavy because it admits that I was living in a partial reality until that moment, even though nothing had moved.
