prompt: |-
  quick context so you know what this is for: I'm a grad student and my chapter is supposed to argue about whether we can be responsible for our emotions -- whether my resentment of my dad can be appropriate or petty, whether someone can be blamed for feeling contempt. but every draft I write just quietly assumes some theory of what an emotion even is, and my supervisor keeps circling judgements I never made explicit. so before I go anywhere near the theories, I want the spec.

  write the desiderata: what a theory of emotion has to deliver if it's going to be usable for questions of fittingness and responsibility -- which cases it must get right, which distinctions it can't collapse, which empirical results it can't contradict -- with the case or consideration behind each requirement. to give you a sense of what I mean by cases, off the top of my head: the phobic who fully judges the spaniel is harmless and is terrified of it anyway; the scrupulosity patient who feels crushing guilt about things he sincerely judges himself innocent of; being moved to tears by a piece of music with no intentional object anyone could name; whether my dog's panic when left alone counts; the alexithymic patient who reports feeling nothing while his body and behaviour scream rage; fear of things I merely imagine vividly vs fear of what's actually in front of me. I'm sure there are cases I'm missing that belong on the list -- include them and say why they're load-bearing, don't just take mine as given.

  also I want the judgement calls: which of these are genuine desiderata and which are just prejudices smuggled in by one camp (e.g. does a theory really have to give emotions correctness conditions, or is that only mandatory if you already think emotions are evaluations?), which are non-negotiable for my purpose specifically versus negotiable, and whether you think any pair or subset is jointly unsatisfiable -- that's the part I actually most want to see, because if the list can't be satisfied by any theory then the list itself is the interesting result.

  then, briefly, how the three standard pictures -- emotions as judgements, emotions as perceptions, emotions as feelings -- do against the list. keep that short though, one paragraph each max, the scoring matters less to me than getting the criteria right.

  cheers, and dont be shy about saying when a requirement I'd naturally demand (like that the theory explain why emotions feel like something) actually rules things out unfairly.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Grad student writing a chapter on moral responsibility for emotions (fittingness, blame, resentment, contempt).
      *   **Problem:** Drafts implicitly assume a theory of emotion; supervisor wants explicit desiderata before committing to a theory.
      *   **Task:**
          1.  Write the *desiderata*: What a theory of emotion must deliver to handle fittingness/responsibility questions (cases, distinctions, empirical constraints).
          2.  Provide *judgement calls*: Which are genuine vs. prejudiced, which are non-negotiable for *this* purpose (responsibility) vs. negotiable, and identify any *joint unsatisfiability* (trilemmas/impossibility results).
          3.  Briefly evaluate the *three standard pictures* (Judgmentalism, Perceptualism, Feeling Theory) against the list (1 paragraph each max).
      *   **Tone:** Academic, rigorous, candid ("don't be shy"), helpful for a philosophy grad student.
      *   **Key Constraint:** Focus on the *criteria* first, as that's the core need. The evaluation of theories is secondary/short.

  2.  **Deconstruct the Desiderata (The "Spec"):**
      *   The goal is *responsibility* and *fittingness*. This means the theory needs to connect emotions to reasons, norms, and agency.
      *   *User's Cases:* Phobia (recalcitrance), Scrupulosity (recalcitrance/guilt), Music (objectless?), Dog panic (non-human), Alexithymia (unconscious?), Imagination vs. Reality.
      *   *Missing/Load-Bearing Cases:*
          *   *Recalcitrant Emotions:* Crucial for responsibility. If I fear what I judge safe, am I irrational? Blameworthy?
          *   *Normative Assessment:* Can the emotion be *wrong* (fittingness) vs. *irrational* (reasons)?
          *   *Phenomenology:* Does it feel like something? (Important for "feeling" blame).
          *   *Agency/Control:* Can I cultivate/change it? (Ought implies can).
          *   *Cognitive Access:* Do I need to know I'm angry to be responsible for it?
          *   *Temporal Extension:* Is anger a flash or a stance? (Responsibility often attaches to sustained states).

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *Requirement 1: Recalcitrance.* Must explain how I can feel X while judging not-X. (The Phobia Case).
      *   *Requirement 2: Fittingness Conditions.* Must allow emotions to be appropriate/inappropriate to their object. (The Resentment Case).
      *   *Requirement 3: Phenomenal Character.* Must account for "what it's like." (The Alexithymia/Feeling Case).
      *   *Requirement 4: Intentionality.* Must be *about* something. (The Music Case - though music might be quasi-emotion).
      *   *Requirement 5: Rational Integrability.* Must connect to reasons (can be reasoned with).
      *   *Requirement 6: Non-Human/Infant Emotions.* (The Dog Case). If dogs feel, do they have concepts?
      *   *Requirement 7: Unconscious Emotions.* (The Repressed Rage Case). Can I be responsible for what I don't feel?

  4.  **Developing the Judgement Calls (The Critical Analysis):**
      *   *Genuine vs. Prejudice:* "Intentionality" is often assumed but maybe some emotions are moods. "Correctness Conditions" are vital for *fittingness* arguments but maybe not for all emotions (e.g., existential dread).
      *   *Non-Negotiable for Responsibility:*
          *   *Rational Sensitivity:* If emotions are brute causal forces, responsibility vanishes.
          *   *Recalcitrance Handling:* If the theory says recalcitrance is impossible, it fails the phenomenology of moral struggle.
          *   *Agency/Modifiability:* If I can't influence it even indirectly, blame is unfair.
      *   *Negotiable:*
          *   *Conscious Access:* Maybe I'm responsible for unconscious bias-emotions.
          *   *Phenomenology:* Maybe some responsible states are cold (contempt).
      *   *Joint Unsatisfiability (The Gold):* This is the "interesting result" the user wants.
          *   *The Trilemma:* (1) Emotions are non-voluntary (passive), (2) Emotions are assessable for rationality (reason-responsive), (3) Responsibility requires voluntary control.
          *   *Or:* (1) Phenomenal Feel, (2) Cognitive Evaluation, (3) Unconscious Emotions. (You can't have all three easily).
          *   *Best Trilemma for this context:* **The Recalcitrance Trilemma.**
              1.  Emotions entail normative judgments (Judgmentalism).
              2.  Recalcitrant emotions exist (I fear the plane while judging it safe).
              3.  Agents are logically consistent (I can't hold contradictory judgments).
              *   *Result:* You must drop one. If you drop 1, you lose fittingness. If you drop 2, you deny experience. If you drop 3, you deny rationality.
          *   *Alternative Trilemma (Responsibility specific):*
              1.  Emotions are passive (happen to us).
              2.  Responsibility requires control.
              3.  We are responsible for emotions.
              *   *Result:* Need a theory of *indirect* control or challenge passivity.

  5.  **Evaluating the Three Standard Pictures:**
      *   *Judgmentalism:* Good for responsibility/fittingness. Bad for recalcitrance (makes it contradictory) and animals/infants.
      *   *Perceptualism:* Good for recalcitrance (illusions) and passivity. Bad for responsibility (perceptions aren't usually blameworthy) and conceptual content.
      *   *Feeling Theory:* Good for phenomenology and animals. Bad for intentionality (what is the fear *of*?) and rationality (feelings aren't true/false).

  6.  **Refining and Polishing:**
      *   *Tone Check:* Ensure it sounds like a colleague talking to a grad student. Use terms like "load-bearing," "recalcitrance," "fittingness."
      *   *Structure:* Desiderata -> Judgement Calls (including the Trilemma) -> Theory Scorecard.
      *   *Specific Advice:* Highlight that for *responsibility*, the "Rational Sensitivity" desideratum is the killer. If the theory makes emotions arational, the chapter is dead on arrival.

  7.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe include neuroscience constraints.
      *   *Correction:* No, keep it philosophical. The user is arguing about *responsibility*, not neural correlates. Empirical constraints should be about behavior/psychology (e.g., phobias persist despite knowledge).
      *   *Emphasis:* Make sure the "Joint Unsatisfiability" section is punchy. That's what the user specifically asked for ("that's the part I actually most want to see").
      *   *Clarification:* Distinguish between *Fittingness* (is the object worthy?) and *Rationality* (is the attitude consistent with beliefs?). This is crucial for the resentment example.

  8.  **Final Review against constraints:**
      *   Desiderata with cases? Yes.
      *   Judgement calls (genuine vs prejudice, non-negotiable, unsatisfiable)? Yes.
      *   Three pictures (1 para each)? Yes.
      *   Tone? Academic but direct.

  9.  (Proceed to generate output based on these steps.)
answer: |-
  Here is a specification sheet for a theory of emotion tailored to a project on moral responsibility and fittingness.

  ### Part 1: The Desiderata (The Spec)

  To support arguments about responsibility (blame/praise) and fittingness (appropriate/inappropriate), a theory of emotion cannot treat emotions as mere weather events. It must accommodate the following:

  **1. The Recalcitrance Constraint**
  *   **Requirement:** The theory must explain how an agent can sustain an emotion that contradicts their sincere normative judgment without attributing logical incoherence or insanity to the agent.
  *   **Case:** The Phobic. I judge the spaniel is harmless, yet I feel terror.
  *   **Why Load-Bearing:** If your theory makes emotions *identical* to judgments (Judgmentalism), recalcitrance becomes a contradiction (I judge P and not-P). If you can't explain recalcitrance, you can't explain the struggle of overcoming resentment, which is central to responsibility.

  **2. The Fittingness Constraint (Correctness Conditions)**
  *   **Requirement:** The theory must provide truth-conditions or correctness-conditions for emotions. It must be possible for an emotion to be *merited* or *unmerited* by its object.
  *   **Case:** Resentment of a Dad. Was the slight real? Did it warrant that degree of hostility?
  *   **Why Load-Bearing:** Without this, you can only talk about emotions being *pragmatically useful* or *socially disruptive*, not *appropriate*. You cannot argue someone is blameworthy for contempt if contempt has no "accuracy" conditions.

  **3. The Rational Sensitivity Constraint**
  *   **Requirement:** The theory must allow emotions to be responsive to reasons (evidence, moral considerations), even if imperfectly.
  *   **Case:** The Scrupulosity Patient. He feels guilt despite judging himself innocent. Crucially, therapy works by offering *reasons* why he is innocent, eventually alleviating the guilt.
  *   **Why Load-Bearing:** Responsibility implies the capacity to respond to reasons. If emotions are causally sealed off from reasoning (like a reflex knee-jerk), direct blame is unjust. The theory must allow for *indirect* rational governance.

  **4. The Phenomenal Constraint**
  *   **Requirement:** The theory must account for "what it is like" to have the emotion (qualia), distinguishing it from cold cognitive states.
  *   **Case:** Alexithymia vs. Rage. The alexithymic patient reports no feeling but exhibits rage physiology. Conversely, feeling "moved" by music.
  *   **Why Load-Bearing:** We typically blame people for how they *feel*, not just how they act. If a theory reduces emotion to a disposition to behave, it loses the target of your critique (the inner state). However, see *Judgement Calls* below on whether this is non-negotiable.

  **5. The Intentionality Constraint**
  *   **Requirement:** Emotions must be *about* something (have an object), even if that object is vague or imagined.
  *   **Case:** Fear of the imagined vs. the real. Free-floating anxiety vs. fear of the spider.
  *   **Why Load-Bearing:** To assess fittingness, there must be a relation between the emotion and an object. You cannot assess if resentment is fitting if it isn't resentment *of* something.

  **6. The Non-Conceptual Constraint**
  *   **Requirement:** The theory must allow for emotional states in beings lacking complex normative concepts (infants, some animals).
  *   **Case:** The Dog's Panic. The dog feels abandonment panic but lacks the concept "betrayal."
  *   **Why Load-Bearing:** If emotions require full moral concepts, then most human emotional development happens *before* responsibility is possible. This creates a gap in explaining how we become responsible agents.

  ---

  ### Part 2: Judgement Calls

  Here is where we separate philosophical necessities from camp prejudices, and identify the structural tensions.

  **Genuine Desiderata vs. Smuggled Prejudices**
  *   **Genuine:** *Rational Sensitivity* and *Fittingness*. For your specific project (responsibility), these are non-negotiable. If the theory makes emotions arational (like digestion), your chapter collapses.
  *   **Prejudice:** *The Phenomenal Constraint.* Many cognitive theories argue phenomenology is an add-on, not the essence. For your purposes, you might be able to concede that the "feeling" is less important than the "evaluative stance." Don't let a theory fail just because it makes the feeling epiphenomenal, provided it preserves the *normative status* of the state.
  *   **Prejudice:** *Intentionality.* Some moods (depression, elation) lack specific objects. A theory that demands a specific object for every affective state will fail. Distinguish between *emotions* (object-directed) and *moods* (global). You only need intentionality for the emotions you are blaming people for (e.g., resentment *of* dad).

  **Non-Negotiable for Responsibility vs. Negotiable**
  *   **Non-Negotiable:** *Recalcitrance.* If your theory denies the possibility of feeling X while believing not-X, you cannot account for moral weakness or the effort required to regulate emotion.
  *   **Negotiable:** *Conscious Access.* You do not need a theory that requires the agent to be consciously aware of the emotion to be responsible for it. Unconscious bias or repressed rage can still be blameworthy if the agent had opportunities for self-knowledge they neglected.

  **The Joint Unsatisfiability (The Trilemma)**
  This is the critical finding for your chapter. You cannot satisfy all three of the following simultaneously. You must sacrifice one to make the system work:

  1.  **The Identity Claim:** Emotions are (or entail) normative judgments/evaluations.
  2.  **The Phenomenological Fact:** Recalcitrant emotions are possible (I can fear what I judge safe).
  3.  **The Rationality Constraint:** Agents cannot consciously hold contradictory judgments.

  *   **If you keep 1 & 3:** You must deny recalcitrance (claim the phobic *really* believes the dog is dangerous). *Cost:* Denies lived experience; makes therapy look like lying to oneself.
  *   **If you keep 2 & 3:** You must deny emotions are judgments (move to Perceptualism or Feeling Theory). *Cost:* Makes it harder to ground *responsibility* (we aren't usually blamed for illusions or sensations).
  *   **If you keep 1 & 2:** You must deny agents are rational (claim we routinely hold contradictory judgments). *Cost:* Undermines the basis of blame (why blame irrationality if it's inevitable?).

  **Recommendation:** For a responsibility chapter, the standard move is to sacrifice **(1)**. Adopt a **Perceptual Model** (emotions are like perceptions of value) rather than a Judgmental Model. This saves Recalcitrance (illusions are possible) and Rationality (I can see a stick as a snake while knowing it's a stick). *However*, you must then work harder to explain why we are responsible for our "perceptions" (usually via cultivation of sensibility).

  ---

  ### Part 3: The Three Standard Pictures (Scorecard)

  **Emotions as Judgments (Judgmentalism)**
  *   **Verdict:** Excellent for Responsibility, Terrible for Recalcitrance.
  *   **Analysis:** This theory scores highest on *Fittingness* and *Rational Sensitivity* because if emotions are judgments, they are directly assessable as true/false and rational/irrational. It makes responsibility easy (we are responsible for our judgments). However, it fails the *Recalcitrance Constraint* miserably; it implies the phobic is logically contradictory or lying about their belief. It also struggles with the *Non-Conceptual Constraint* (dogs/infants can't make complex judgments).

  **Emotions as Perceptions (Perceptualism)**
  *   **Verdict:** Best Balance for your purposes.
  *   **Analysis:** This theory treats emotions as apprehensions of value (like sight apprehends color). It handles *Recalcitrance* perfectly (optical illusions exist without contradicting beliefs). It preserves *Intentionality* and *Fittingness* (perceptions can be accurate or inaccurate). The downside is *Responsibility*: we are rarely blamed for what we perceive (I'm not blameworthy for seeing a mirage). You will need to argue that emotional "vision" is cultivatable in a way visual vision is not.

  **Emotions as Feelings (Somatic/Feeling Theory)**
  *   **Verdict:** Poor fit for Responsibility.
  *   **Analysis:** This theory excels at the *Phenomenal Constraint* and the *Non-Conceptual Constraint* (animals have bodies/feelings). However, it collapses *Fittingness* and *Intentionality*. A stomach churn isn't "about" anything, nor is it "true" or "false." If emotions are just feelings, it is hard to argue resentment is *inappropriate* rather than just *unpleasant*. This theory makes emotions arational causal forces, which severely undermines any argument for direct moral responsibility.
