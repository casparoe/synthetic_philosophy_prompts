  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is Q1 too abstract?
      *   *Fix:* Frame it specifically around "meta-game stability." Can a coalition enforce a ban on a competitive advantage (e.g., doping, clickbait) without being outcompeted by defectors?
      *   *Critique:* Is Q2 just "political science"?
