      *   **Goal:** Allocate 12 researcher-years (4 researchers x 3 years) to conceptual work on the "race-to-the-bottom" / multipolar trap / Moloch problem.
      *   **Constraints:** Purely conceptual (philosophy, formal modeling, institutional theory). No empirical policy evaluation. No web access/citations (argue from ideas). If a question needs empirical data to be tractable, rank it lower.
      *   **Requirements:**
          *   Prioritize open questions.
          *   Defend the prioritization (upstream/downstream relationships).
          *   Assess tractability for theory-heavy researchers.
          *   Assess neglectedness relative to existing literatures (EGT, Ostrom, Price of Anarchy, Rationalist canon).
          *   Distinguish "action-guiding" questions from "vocabulary-sharpening" ones.
          *   Flag at least one deprioritized popular question.
          *   Specify what would change the ranking in the future.

  2.  **Deconstruct "Moloch" / Multipolar Traps:**
      *   What is the core mechanism? It's a coordination failure where individual incentives diverge from group optima, and competitive pressure prevents the group optimum from being sustained.
      *   Why hasn't it advanced much? It's often used as a *label* for bad outcomes rather than a *mechanism* to be solved. The leap from "this is a prisoner's dilemma" to "here is how we escape it in a dynamic, evolutionary context" is missing.
      *   Existing Literatures:
          *   *Evolutionary Game Theory (EGT):* Good at dynamics, but often assumes fixed payoff structures or simple mutation.
          *   *Ostrom:* Good at local commons, relies on social norms/monitoring, hard to scale to global/abstract traps.
          *   *Price of Anarchy:* CS/Econ concept, quantifies inefficiency, but doesn't usually offer escape hatches.
          *   *Rationalist Canon:* Poetic, high-level, often focuses on AI risk specifics (Bostrom) rather than general institutional mechanics.

  3.  **Brainstorming Candidate Questions:**
      *   *Q1: Definition.* Is Moloch a real agent or a metaphor? (User hinted this might be low priority).
      *   *Q2: Precommitment.* Can agents bind themselves? Is it stable? (User mentioned this).
      *   *Q3: Scaling.* Why do Ostrom-style solutions fail at global scales?
      *   *Q4: Value Drift.* How does competition distort values over time? (Hanson's Em scenario).
      *   *Q5: Single vs. Multipolar.* Is unipolarity actually better? (The "Benevolent Dictator" vs. "Chaotic Market" debate).
      *   *Q6: Mechanism Design.* Can we design institutions that are robust to evolutionary pressure?
      *   *Q7: Epistemics.* How does competition degrade truth-seeking? (Marketplace of ideas failure).

  4.  **Selecting and Ranking the Top Questions:**

      *   *Constraint Check:* Must be conceptual/formal. No empirical data gathering.
      *   *Upstream Logic:* We need to know *if* solutions are possible before designing them. We need to know *why* current solutions fail before proposing new ones.
      *   *Priority 1: The Stability of Precommitment under Evolutionary Pressure.* (User's suspicion). If precommitments dissolve under competition, most institutional solutions fail. This is foundational.
      *   *Priority 2: The Scalability of Normative Enforcement.* Ostrom works locally. Why not globally? Is it a communication latency issue? A homogeneity issue? This bridges the gap between known solutions and the "Moloch" scale.
      *   *Priority 3: The Dynamics of Value Lock-in vs. Value Drift.* In AI/Em scenarios, do values converge to "survival only"? This determines the stakes.
      *   *Deprioritized:* The Ontology of Moloch. (Is it a real agent?). This is semantic. The mechanism matters, not the label.

  5.  **Drafting the Argument for Each:**

      *   *Q1 (Precommitment Stability):*
          *   *Upstream:* If you can't bind, you can't coordinate.
          *   *Tractability:* High for formalists (logic, game theory).
          *   *Neglectedness:* EGT looks at strategies, less at *meta-strategies* of binding in open systems.
          *   *Action-guiding:* Tells us if we should bother building treaties/constitutions.

      *   *Q2 (Scalability of Enforcement):*
          *   *Upstream:* Determines if we can apply small-scale fixes to big problems.
          *   *Tractability:* Conceptual/Institutional theory.
          *   *Neglectedness:* Ostrom is siloed from AI risk/Global catastrophic risk (GCR).
          *   *Action-guiding:* Tells us whether to focus on local pilots or global governance.

      *   *Q3 (Value Drift Dynamics):*
          *   *Upstream:* Determines the "end game."
          *   *Tractability:* Formal modeling of utility functions over time.
          *   *Neglectedness:* Hanson touches it, but not rigorously formalized regarding *rate* of drift.
          *   *Action-guiding:* Urgency of intervention.

  6.  **Addressing the "Deprioritized" Requirement:**
      *   *Candidate:* "Defining Moloch."
      *   *Reason:* It's a category error debate. The math of the trap doesn't care if you call it Moloch. Focus on the *structure* of the trap, not the *personification*.

  7.  **Addressing "What Would Change the Ranking":**
      *   *AI:* If AGI appears soon, Q3 (Value Drift) jumps to #1.
      *   *Institutions:* If a global coordination success happens (e.g., climate treaty that works), Q2 (Scalability) becomes more tractable/urgent.
