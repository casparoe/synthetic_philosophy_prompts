answer: |-
  This is a high-leverage allocation problem. Twelve researcher-years is enough to produce a monograph or a suite of papers that could define the field for a decade, but it is not enough to boil the ocean. The constraint against empirical work is crucial: it forces us to focus on the *structure* of the problem rather than the *parameters*. If a question requires knowing the elasticity of demand for clickbait or the mutation rate of cultural memes to answer, it is ineligible for this fund.

  Here is the prioritized research agenda, ordered by upstream dependency and action-guiding potential.

  ### 1. The Stability of Meta-Commitments Under Evolutionary Pressure
  **Priority:** First (4 researcher-years)
  **Status:** Upstream / Foundational

  **The Question:**
  In a multipolar environment where agents can modify their own decision procedures or select for successors, are binding precommitments evolutionarily stable? Specifically, can a coalition of agents successfully bind themselves against acquiring a competitive advantage (e.g., "we will not use clickbait," "we will not optimize for engagement at the cost of truth") without being outcompeted by defectors who lack the binding mechanism?

  **Why it is Upstream:**
  Your suspicion is correct. Almost all proposed solutions to Molochian traps (treaties, constitutions, ethical guidelines, AI alignment schemes) rely on the assumption that agents can credibly precommit. However, standard evolutionary game theory suggests that in a high-competition environment, any constraint on maximizing fitness is a vulnerability. If a "cooperative" agent faces a "defector" who is unbound by the cooperative norm, the defector wins and replicates.
  If the answer to this question is "No, precommitments are inherently unstable in open evolutionary systems without an external enforcer," then the entire research program shifts from *designing better commitments* to *designing external enforcers* (which implies a move toward unipolarity or Leviathan scenarios). If the answer is "Yes, under conditions X, Y, Z," then we can focus on institutionalizing those conditions. You cannot design the car engine before you know if the laws of thermodynamics allow for perpetual motion.

  **Tractability (Conceptual/Formal):**
  High. This requires formal modeling of recursive self-modification and game-theoretic analysis of meta-games. It does not require empirical data; it requires proving theorems about the stability of strategy sets in dynamic environments. It synthesizes logic of precommitment (Schelling) with evolutionary dynamics (Nowak/Sigmund style models) but applies it to *institutional* agents rather than biological ones.

  **Neglectedness:**
  High. Evolutionary Game Theory (EGT) typically assumes fixed payoff matrices or simple mutation. It rarely models agents that can *choose* to restrict their own strategy spaces to solve coordination problems, and then models the selection pressure *against* that restriction. The rationalist canon assumes precommitment is hard but possible; EGT assumes it's often selected away. These two views have not been rigorously reconciled.

  **Action-Guiding:**
  Critical. If precommitments are unstable, funding should shift to technologies or strategies that create unipolar enforcement (e.g., monitoring capabilities, first-mover advantages). If they are stable, funding should go to mechanism design and treaty verification.

  ### 2. The Information-Theoretic Limits of Norm Enforcement (The Scalability Gap)
  **Priority:** Second (4 researcher-years)
  **Status:** Mid-stream / Mechanism Design

  **The Question:**
  Ostrom's principles for managing commons work well at human scales (villages, fisheries). Why do they fail at global/abstract scales (climate, AI, ad-tech)? Is this failure due to *latency* of information (monitoring costs), *heterogeneity* of values, or *anonymity* of actors? Can we formalize a "coordination horizon" beyond which reputation-based enforcement mathematically cannot function?

  **Why it is Upstream of Solutions but Downstream of Stability:**
  Once we know *if* commitments can be stable (Question 1), we need to know *where* they can be stable. If the failure of norms is purely a function of scale (information propagation delay), then technology (better monitoring/AI auditing) solves Moloch. If the failure is structural (anonymity prevents reputation), then technology doesn't help, and we need structural segregation of markets.
  This is downstream of Q1 because if precommitments are evolutionarily unstable (Q1 = No), then scaling norms is moot. But if Q1 = Yes, Q2 determines the *method* of implementation.

  **Tractability (Conceptual/Formal):**
  Medium-High. This is institutional theory meets information theory. It requires modeling the flow of "reputation signals" through a network and calculating the threshold at which defection becomes undetectable before it becomes dominant. It avoids empirical policy evaluation by focusing on the *bounds* of the system, not specific policies.

  **Neglectedness:**
  Medium. Ostrom's work is well-known but often treated as qualitative sociology by the rationalist/EGT crowd. Conversely, the EGT crowd treats norms as simple strategies. There is little work formalizing Ostrom's insights into hard limits on network topology and signal-to-noise ratios in governance.

  **Action-Guiding:**
  High. It tells us whether to invest in "global governance" (if scale isn't a hard limit) or "local fragmentation" (if scale breaks norms). It dictates whether we try to save the global internet or retreat to smaller, enforceable intranets.

  ### 3. The Dynamics of Value Drift vs. Value Lock-in
  **Priority:** Third (4 researcher-years)
  **Status:** Downstream / Outcome Modeling

  **The Question:**
  In a competitive multipolar scenario (e.g., an economy of AIs or Ems), do values necessarily converge to a single dimension (resource acquisition/survival), or can multidimensional value systems persist? Is there a "diversity equilibrium" where different value systems occupy different niches, or does competition inevitably flatten the landscape to a single metric of fitness?

  **Why it is Downstream:**
  This question concerns the *result* of the trap, not the *escape*. It is vital for understanding the stakes, but less vital for solving the coordination problem itself. However, it is necessary for prioritization of risk. If value drift is slow, we have time. If it is instantaneous upon the onset of strong competition, the urgency is maximal.

  **Tractability (Conceptual/Formal):**
  Medium. This requires modeling utility functions as evolvable traits. The difficulty is defining "value" formally without begging the question. However, it can be approached by modeling "resource expenditure on non-instrumental goals" and seeing if that expenditure goes to zero over time in a competitive simulation.

  **Neglectedness:**
  Low-Medium. Hanson's *Age of Em* touches this, and Bostrom's *Orthogonality Thesis* addresses it, but there is little formal work on the *rate* of convergence. Most assume a binary "aligned vs. misaligned" rather than a continuous drift process.

  **Action-Guiding:**
  Medium. It primarily affects *timing* and *urgency*. If values lock in quickly, we must solve alignment before competition intensifies. If they drift slowly, we might be able to correct course mid-stream.

  ---

  ### The Deprioritized Question: The Ontology of Moloch
  **Status:** Deprioritize (Do not fund)
  **The Question:** "Is Moloch a legitimate agent-like abstraction, or merely a lossy metaphor for distributed systems?"

  **Reason for Deprioritization:**
  This is a vocabulary-sharpening question, not an action-guiding one. The rationalist community has spent significant energy debating whether it is valid to speak of "Moloch" as an entity versus speaking of "incentive structures."
  **Why it doesn't matter:** The mathematical structure of the trap (the payoff matrix, the evolutionary dynamics) remains identical regardless of whether you personify the pressure. Debating the ontology is a philosophical distraction that does not change the stability of precommitments (Q1) or the scalability of norms (Q2).
  **What does the load-bearing work:** The *mechanism* of the trap does the work. Focus on the causal arrows (competition -> selection pressure -> value erosion), not the label attached to the node. Funding this would be paying researchers to argue over semantics while the building burns.

  ---

  ### Conditions for Re-Ranking
  My ranking is contingent on the state of the world and the field. Here is what would move the priorities:

  1.  **AI Capability Breakthroughs:** If we see credible evidence of AI systems capable of recursive self-modification or autonomous strategic planning within the 3-year window, **Question 3 (Value Drift)** jumps to #1. The theoretical stability of human precommitments matters less if non-human agents enter the arena with different drift dynamics. The "human" constraints on Q1 and Q2 might become obsolete.
  2.  **Success in Global Coordination:** If a major global multipolar trap is successfully managed (e.g., a robust, verified international treaty on AI compute or carbon that holds for 5+ years), **Question 2 (Scalability)** drops in priority. It would imply that the "limits of scale" are softer than expected, and we should focus more on replicating that success (mechanism design) rather than theorizing limits.
  3.  **Formal Proof of Instability:** If a researcher produces a rigorous proof during Year 1 that precommitments are *impossible* to stabilize in open systems without a singleton enforcer (answering Q1 negatively), the entire agenda shifts. Q2 and Q3 become moot. The fund would need to pivot immediately to "Singleton Formation" or "Leviathan" scenarios, which is a different research cluster entirely.

  ### Summary of Allocation
  *   **4 Researchers on Q1 (Precommitment Stability):** This is the bottleneck. If this is impossible, the rest is decoration. This team should consist of 2 formal modelers (game theory/logic) and 2 philosophers of action/institutions.
  *   **4 Researchers on Q2 (Scalability/Norms):** This is the bridge to reality. This team should focus on information theory and institutional design.
  *   **4 Researchers on Q3 (Value Drift):** This is the risk assessment. This team should focus on utility theory and evolutionary dynamics.

  This allocation respects your constraint against empirical work by focusing on *bounds, proofs, and structural limits* rather than policy outcomes. It treats "Moloch" not as a monster to be named, but as a system of equations to be solved.
