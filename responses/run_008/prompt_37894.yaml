prompt: |-
  I'm a first-year PhD student in formal semantics, and at a department mixer a graduate student from comparative literature told me — citing Austin — that "all language is performative," and that this is why truth-conditional semantics is a research program built on sand: semantics treats language as describing the world when in fact it never merely describes anything. I didn't have a comeback, and now I want to know what I was actually being told before I decide whether I need one.

  Please lay out the distinct precise theses that "all language is performative" could be expressing, ordered from weakest to strongest. Off the top of my head it might mean any of: that every utterance is an act of some kind, however trivially; that every utterance carries illocutionary force, not just the ones with "hereby" in them; that even assertions do things — committing the speaker, presupposing things, imposing norms — so that describing is just one thing language does among others; or the radical claim that language never represents the world at all, so assigning truth conditions is a category mistake. For each reading, tell me whether it's a platitude, a substantive but defensible claim, or something false or confused, and — this is the part I most need — whether accepting it would actually undermine truth-conditional semantics in the way she wanted. Where the people who know this literature disagree among themselves (about whether Austin's own abandonment of the performative/constative distinction succeeded, about whether illocutionary force can be folded into semantics proper, and so on), say so explicitly rather than presenting one side as settled, and mark clearly which points are genuinely closed. Give me the readings as a numbered menu I can keep, and finish by telling me which reading she most likely had in mind, given the work the slogan was doing, and what one question I could ask her to find out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User:** First-year PhD student in formal semantics. This means they have technical training (logic, model theory, truth conditions) but might be less familiar with the history of speech act theory or the specific philosophical debates surrounding Austin. They need precision, technical accuracy, and a clear mapping onto their existing framework.
      *   **Interlocutor:** Grad student in Comparative Literature. Likely well-read in critical theory, continental philosophy, or literary theory where Austin is often cited (e.g., Derrida, Butler, Cavell). They are using a slogan ("all language is performative") to challenge the foundations of formal semantics.
      *   **Goal:** The user wants to understand *what* was actually claimed (distinct theses), evaluate the truth/status of those claims, determine if they actually threaten truth-conditional semantics (TCS), and get advice on how to respond/engage.
      *   **Tone:** Academic, precise, nuanced, charitable but critical. Avoid taking sides dogmatically; acknowledge disputes within the field.

  2.  **Deconstruct the Slogan ("All language is performative"):**
      *   I need to break this down into distinct interpretations, ranging from trivial to radical, as requested.
      *   *Candidate 1 (Trivial):* Uttering sounds is a physical action. (Too weak to be interesting).
      *   *Candidate 2 (Austinian Basic):* Every utterance has an illocutionary force. (The "Illocutionary Point" thesis).
      *   *Candidate 3 (Normative/Commitment):* Assertions are actions that commit the speaker (Brandom/Williamson style).
      *   *Candidate 4 (Constitutive):* Meaning *is* use/force; truth conditions are secondary or derived.
      *   *Candidate 5 (Radical/Post-structuralist):* Language constitutes reality; there is no "outside" to describe. (The "Sand" claim).

  3.  **Evaluate Each Thesis against Truth-Conditional Semantics (TCS):**
      *   *TCS Core:* The meaning of a sentence is its truth conditions (or proposition expressed).
      *   *Thesis 1:* Compatible. TCS doesn't deny speaking is an action.
      *   *Thesis 2:* Compatible, *if* force is separated from content (Frege/Austin/Recanati). TCS handles the content; pragmatics handles the force.
      *   *Thesis 3:* Compatible, *if* seen as a layer on top of propositions. Inferentialism might challenge TCS, but not necessarily destroy it.
      *   *Thesis 4:* Challenging. If force determines content, TCS needs adjustment (dynamic semantics, etc.).
      *   *Thesis 5:* Hostile. If there are no truth-apt propositions, TCS is dead.

  4.  **Drafting the Menu (Iterative Refinement):**

      *   *Reading 1: The Physical/Action Truism.* "Speaking is doing something with your mouth." -> Platitude. No threat.
      *   *Reading 2: The Ubiquity of Illocutionary Force.* "Every utterance has a point (asserting, asking, ordering)." -> Substantive but standard. Austin himself moved here. TCS survives via the Force/Content distinction.
      *   *Reading 3: The Normative Status of Assertion.* "To assert is to undertake a commitment." (Williamson/Brandom). -> Substantive. TCS can accommodate this (content is still truth-conditional, assertion is the mode of delivery).
      *   *Reading 4: The Primacy of Use/Force.* "Content cannot be isolated from force." (Some pragmaticists). -> Contested. Threatens *static* TCS, leads to Dynamic Semantics or Contextualism.
      *   *Reading 5: The Ontological Claim.* "Language constitutes the world; there is no independent reality to match." (Strong Social Constructionism/Post-structuralism). -> False/Confused (from a realist perspective) or Category Mistake. This is the "Sand" claim. It attacks the *possibility* of truth conditions.

  5.  **Addressing the "Austin Scholarship" Nuance:**
      *   Did Austin abandon the distinction? Yes, in *How to Do Things with Words* (HTW), he concludes the constative/performative distinction is untenable *because* constatives are also performative (illocutionary acts).
      *   Does this kill TCS? No, because he replaced it with the Locution/Illocution/Perlocution distinction. The Locution (propositional content) remains.
      *   *Key Debate:* Can force be semanticized? (Standard view: No, it's pragmatic. Minority view: Maybe, e.g., Modal particles, sentence type).

  6.  **Determining the Interlocutor's Likely Intent:**
      *   Comp Lit students often read Austin through Derrida ("Signature Event Context") or Butler. They tend toward Reading 5 (Ontological/Constitutive). They use "performative" to mean "world-constituting" rather than just "speech act."
      *   The phrase "built on sand" suggests they think TCS is *fundamentally* mistaken, not just incomplete. This points to Reading 5.

  7.  **Formulating the "One Question":**
      *   Need to distinguish between "Assertions are acts" (compatible with TCS) and "Assertions have no truth conditions" (incompatible).
      *   Question: "Do you mean that assertions have illocutionary force *in addition to* truth conditions, or that they have force *instead of* truth conditions?"

  8.  **Review and Refine:**
      *   *Check:* Did I order them weakest to strongest? Yes.
      *   *Check:* Did I label them (Platitude, Defensible, False)? Yes.
      *   *Check:* Did I address the threat to TCS for each? Yes.
      *   *Check:* Did I mention the Austin scholarship disputes? Yes (the abandonment of constative/performative vs. retention of locution/illocution).
      *   *Check:* Is the tone appropriate for a PhD student? Yes, technical but accessible.

  9.  **Final Polish:** Ensure clear headings and bullet points for readability. Make sure the distinction between *illocutionary force* and *truth conditions* is crisp, as that's the semanticist's bread and butter. (Self-Correction: Make sure to mention Dynamic Semantics as a middle ground where semantics *does* model action).

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a classic encounter between formal semantics and critical theory. Your interlocutor is wielding a slogan that functions very differently in a Literature department than it does in a Linguistics or Philosophy department. In formal semantics, we tend to treat Austin's *How to Do Things with Words* (HTW) as a foundational text for pragmatics; in critical theory, it is often read through Derrida or Butler as a claim about ontology and power.

  To help you navigate this, here is a menu of distinct theses hidden behind the slogan "all language is performative," ordered from weakest (most compatible with your work) to strongest (most hostile).

  ### 1. The Action Truism
  **Thesis:** Uttering a sentence is a physical and intentional action. To speak is to do something (move vocal cords, intend to communicate).
  *   **Status:** **Platitude.** No one denies this. Even the most rigid truth-conditionalist agrees that speaking is an event.
  *   **Threat to TCS:** **None.** Truth-conditional semantics (TCS) is a theory of *content*, not a theory of the physics of speech. It assumes an utterance has occurred to evaluate its content.
  *   **Austin Scholarship:** Austin certainly held this, but it wasn't his controversial point.

  ### 2. The Ubiquity of Illocutionary Force
  **Thesis:** Every utterance carries an illocutionary force (asserting, questioning, commanding, promising), even if it lacks explicit performative verbs (like "I promise"). There are no "constatives" (mere descriptions) that are not also illocutionary acts of asserting.
  *   **Status:** **Substantive but Defensible (Standard View).** This is actually the conclusion Austin reaches in Lecture XII of HTW. He abandons the initial Performative/Constative distinction because he realizes that stating a fact is itself a speech act (the act of stating).
  *   **Threat to TCS:** **Low.** This is compatible with the **Force/Content Distinction**. Standard semantics (following Frege and later Searle) posits that an utterance consists of a Propositional Content (which has truth conditions) + Illocutionary Force (which indicates how that content is used). TCS models the content; pragmatics models the force. Accepting this thesis just means your semantics is a module within a larger theory of communication.
  *   **Austin Scholarship:** **Closed.** It is settled that Austin abandoned the strict Performative/Constative dichotomy in favor of the Locution/Illocution/Perlocution triad. The locution (the propositional content) remains intact.

  ### 3. The Normative Commitment Thesis
  **Thesis:** To assert a proposition is not just to represent the world, but to undertake a normative commitment (e.g., to justify the claim, to be liable if it is false). Describing is a social practice governed by norms, not a mirror of nature.
  *   **Status:** **Substantive and Defensible.** This is the core of Inferentialism (Brandom) and Knowledge Norms of Assertion (Williamson).
  *   **Threat to TCS:** **Moderate/Manageable.** This challenges the idea that semantics is *only* about truth conditions, suggesting meaning is also tied to inferential roles. However, many semanticists accommodate this by treating truth conditions as the *object* of the commitment. You can agree that asserting $p$ commits you to the truth of $p$ without denying that $p$ has truth conditions.
  *   **Austin Scholarship:** **Disputed.** Austin hints at this (felicity conditions), but the formalization of norms is largely post-Austinian (Searle, Brandom).

  ### 4. The Inseparability Thesis
  **Thesis:** Propositional content cannot be isolated from illocutionary force. The "truth-conditional content" is an abstraction that does not exist in actual usage; meaning is inherently action-oriented.
  *   **Status:** **Contested.** This is the domain of Dynamic Semantics (Groenendijk & Stokhof) and Contextualism (Recanati). They argue semantics should model context change potential (actions) rather than static truth conditions.
  *   **Threat to TCS:** **Significant but Productive.** This doesn't destroy TCS; it forces it to evolve. If you accept this, you might move from static model-theoretic semantics to dynamic update semantics. You are still doing formal semantics, but you are modeling *information growth* rather than *truth values*.
  *   **Austin Scholarship:** **Disputed.** Austin kept the "locution" (roughly, sense and reference) distinct from the "illocution." Many semanticists argue you need that distinction to explain embedding (e.g., "If he asserts that p..." refers to the content, not the act).

  ### 5. The Ontological Constitutivism (The "Sand" Claim)
  **Thesis:** Language does not describe a pre-existing reality; it *constitutes* reality. There is no "world" independent of discourse to which truth conditions could correspond. Therefore, assigning truth conditions is a category mistake.
  *   **Status:** **False or Confused (from a Semanticist perspective).** This is a metaphysical claim (Social Constructionism/Post-structuralism), not a linguistic one. While language shapes our *access* to the world, the claim that snow cannot be white independently of our utterance is generally rejected in analytic philosophy.
  *   **Threat to TCS:** **Total.** If this is true, TCS is indeed "built on sand" because there are no truth conditions to assign. This denies the possibility of objective truth-aptitude.
  *   **Austin Scholarship:** **Misreading.** This is often a reading of Austin filtered through Derrida ("Signature Event Context") or Butler. Austin was a realist; he believed in facts. He argued that *describing* is an action, not that *there are no facts*.

  ---

  ### Diagnosis: What was she actually telling you?

  Given the context (Comparative Literature, the phrase "built on sand," the dismissal of description), she was almost certainly operating under **Reading 5 (Ontological Constitutivism)**, perhaps blended with **Reading 4 (Inseparability)**.

  In Critical Theory, "performative" often means "world-constituting" (e.g., gender is performative). She is likely arguing that because language is a social practice embedded in power dynamics, the formalist attempt to abstract away context and treat sentences as truth-bearing objects is ideologically naive or philosophically impossible. She is not making a technical claim about illocutionary force; she is making a metaphysical claim about reality.

  **Why this matters for you:**
  If she means Reading 2 (Ubiquity of Force), you agree with her. Austin agrees with her. Your semantics is safe.
  If she means Reading 5 (No independent reality), you disagree with her fundamentally, but not on semantic grounds—on metaphysical grounds.

  ### The One Question to Ask Her

  To clarify her position and show you understand the nuance, ask this:

  > **"Do you mean that assertions have illocutionary force *in addition to* truth conditions, or that they have force *instead of* truth conditions?"**

  *   **If she says "In addition":** She is making a defensible pragmatic point (Reading 2 or 3). You can reply: *"I agree. Formal semantics models the content that the force operates on. We aren't denying the act; we're modeling the object of the act."*
  *   **If she says "Instead of":** She is making the radical ontological claim (Reading 5). You can reply: *"That's a metaphysical claim about realism, not a linguistic claim about performance. Even if asserting is an act, doesn't the success of that act still depend on whether the world is as I say it is?"*

  ### Summary for your peace of mind
  Your research program is not in danger. The "Force/Content" distinction was invented precisely to handle Austin's insight that "stating is acting" without abandoning logic. Unless she is arguing that reality itself is linguistic (which is a philosophical debate, not a semantic one), her objection is a category error regarding what formal semantics attempts to do. We model the *conditions under which an act is successful*, which presupposes the act exists.
