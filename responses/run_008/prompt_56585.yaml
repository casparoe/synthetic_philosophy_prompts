answer: |-
  ### Exam Question

  **Question 1:**
  Thomas Nagel argues that death is bad because it deprives us of the goods of life, while Epicurus argues that death is nothing to us because there is no subject to experience harm. However, both accounts face the "Timing Problem": if death is a harm, *when* does this harm obtain? It cannot be before death (you are alive), not at the moment (instantaneous), and not after (you do not exist).

  Write an essay that defends a specific metaphysical account of harm that solves this Timing Problem. Crucially, your account must demonstrate structural consistency between the badness of death and the badness of posthumous events (e.g., the betrayal of a confidence or the destruction of a legacy). Do not merely survey existing positions; argue for why your chosen solution to the Timing Problem necessarily entails a specific verdict on posthumous harm.

  ***

  ### Model Answer (Approx. 600 words)

  The Timing Problem arises from a category mistake regarding the nature of harm. Most students of the philosophy of death assume harm must be an event located within the temporal stream of a subject's consciousness. If we accept this premise, Epicurus wins: there is no time *t* where the subject exists and suffers the harm of death. To solve this, we must reject the localization requirement and adopt an **Atemporal Comparative Account** of harm. On this view, harm is not an event that happens *to* a person at a time; it is a truth-bearing relation between the actual world and relevant possible worlds concerning the totality of a life.

  If harm is a comparative relation between life trajectories, the question "When is the harm?" is malformed. It is like asking, "When is 5 greater than 3?" The relation holds timelessly. Death is bad for the deceased because the actual world (where they die at *t*) contains less net good for them than the nearest possible world (where they continue living). This deprivation is a fact about the shape of the life, not a felt experience within it. Consequently, the harm of death does not occur before, during, or after; it obtains as a permanent feature of the biographical narrative once the life is complete.

  This metaphysical shift is required to maintain consistency with posthumous harm. If we claim death is a deprivation of future goods, we must acknowledge that the value of a life is partly constituted by narrative coherence and social relations that extend beyond biological cessation. Consider a writer whose life work is burned immediately after their death. If harm requires a living subject to experience frustration, this burning is harmless. But if harm is a comparative relation regarding the success of a life's projects, the burning is a harm. The actual world (work destroyed) is worse for the author than the possible world (work preserved), just as the actual world (death at 40) is worse than the possible world (death at 80).

  Critics might object that posthumous harm is categorically different because the agent can no longer act to prevent it. However, this confuses the *mechanism* of harm with the *fact* of harm. In both death and posthumous betrayal, the subject lacks the capacity to mitigate the loss at the time the harm obtains. If the deprivation account justifies the badness of death despite the lack of a subject at the time of the "event," it must also justify the badness of posthumous reputation damage. To deny posthumous harm while accepting the badness of death is to arbitrarily draw a line at biological cessation, ignoring that the goods deprived in both cases (future experiences vs. legacy fulfillment) are goods *of the life*, not merely goods *in the mind*.

  Therefore, the Timing Problem dissolves when we stop looking for harm in the calendar and start looking for it in the biography. The harm of death and the harm of posthumous betrayal are identical in structure: both are reductions in the overall value of a life trajectory compared to viable alternatives. By accepting that persons are extended temporal entities whose interests can be thwarted without their concurrent awareness, we secure a unified theory of harm. Epicurus is wrong not because he misunderstands experience, but because he misunderstands value. Value attaches to the life as a whole, and thus harm can attach to the life as a whole, regardless of where the damaging event falls on the timeline relative to the pulse.

  ***

  ### Marking Scheme (Total: 20 Marks)

  | Criterion | Marks | Common Fumble |
  | :--- | :---: | :--- |
  | **1. Diagnosis of the Timing Problem**<br>Clearly articulates the trilemma (before/during/after) and explains *why* it threatens the deprivation account. | 4 | Candidates often name-drop "The Timing Problem" but fail to explain why the "after" option violates the existence requirement. |
  | **2. Metaphysical Commitment**<br>Defends a specific account of harm (e.g., Atemporal, Relational, Eternalist) rather than surveying options neutrally. | 4 | The "B-grade hedge": spending 80% of the essay summarizing Nagel and Luper without arguing for one as correct. |
  | **3. Integration of Posthumous Harm**<br>Demonstrates that the solution to the Timing Problem *structurally necessitates* a verdict on posthumous harm (they stand or fall together). | 4 | Treating posthumous harm as a separate "Part B" question rather than a metaphysical consequence of the death argument. |
  | **4. Handling the "No Subject" Objection**<br>Addresses the Epicurean challenge that a non-existent entity cannot bear properties like "being harmed." | 4 | Dismissing Epicurus with "but it feels sad to us" (survivor grief) rather than addressing the harm *to the deceased*. |
  | **5. Argumentative Coherence**<br>The essay maintains a consistent thesis throughout; conclusion follows from premises without contradiction. | 4 | Internal contradiction: e.g., arguing harm is timeless in paragraph 2, but claiming it happens "after death" in paragraph 4. |

  ***

  ### Differentiation: A Answer vs. B Answer

  **The B Answer (Competent but Safe):**
  A B-level student will accurately reconstruct Nagel's deprivation account and correctly identify the Timing Problem. They will likely mention Feinberg or Pitcher regarding posthumous harm. However, they will treat these as distinct topics to be summarized. Their conclusion will likely be diplomatic: *"While Nagel solves the badness of death, the timing remains unclear, and posthumous harm is controversial."* They demonstrate knowledge of the literature but fail to do philosophy; they map the debate rather than entering it.

  **The A Answer (Risk-Taking and Unified):**
  An A-level student treats the prompt as a demand for metaphysical consistency. They recognize that you cannot solve the Timing Problem without redefining what "harm" *is*. They will explicitly link the metaphysics of death to the metaphysics of reputation, arguing that if one is real, the other must be, based on the same underlying principle (e.g., interests surviving death or harm being atemporal). They risk being wrong by taking a hard stance, rather than securing safety by summarizing everyone else's stance. The essay reads as a unified argument, not a literature review.
