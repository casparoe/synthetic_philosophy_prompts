answer: |-
  # JOINT STATEMENT ON THE SEMANTICS AND EPISTEMOLOGY OF KNOWLEDGE ASCRIPTIONS

  **Signed:**  
  _________________________ (Representative, Epistemic Contextualism)  
  _________________________ (Representative, Pragmatic Encroachment/SSI)  
  **Date:** October 26, 2023  
  **Subject:** Delimitation of Agreement and Disagreement Regarding "Knows"

  ## 1. AGREED CLAIMS

  1.  **Ordinary-Language Data:** Both parties agree that ordinary speakers' willingness to attribute knowledge varies systematically with practical factors. Specifically:
      *   **Bank Cases:** Speakers are more willing to attribute knowledge to a subject in low-stakes scenarios (e.g., depositing a check where a delay is inconvenient) than in high-stakes scenarios (e.g., depositing a check where a delay leads to foreclosure), even when the evidential basis (memory of past visits) is held constant.
      *   **Lottery Propositions:** Speakers generally deny knowledge of pure lottery propositions (e.g., "This ticket will lose") despite high statistical probability, while accepting knowledge of ordinary propositions (e.g., "I have hands") with similar or lower probabilistic support.
      *   **Embedding:** Knowledge ascriptions behave differently from pure expressions of confidence under embedding (e.g., "If she knows..." vs. "If she is confident...").
      *   **Challenge:** When challenged ("How do you know?"), speakers typically cite evidence or reliability, not practical stakes, though citing stakes ("It matters too much") is accepted as a reason to withhold assertion.

  2.  **Theory Obligations:** Any adequate theory must:
      *   Explain the variability in speakers' judgments without attributing systematic error or confusion to competent users of "knows."
      *   Distinguish knowledge from mere true belief and from certainty.
      *   Account for the normative force of knowledge ascriptions in guiding assertion and action.

  3.  **Negative Claims:** Neither party claims that:
      *   Practical stakes *create* evidence where none existed.
      *   The word "knows" is lexically ambiguous in the manner of "bank" (financial institution vs. river edge).
      *   Traditional Invariantism (where only truth, belief, and justification matter) is viable given the data above.
      *   The subject's psychological state of "feeling sure" is identical to knowledge.

  ## 2. DISAGREEMENTS TABLE

  | Issue | Contextualist Statement | Pragmatic Encroacher Statement |
  | :--- | :--- | :--- |
  | **Locus of Variability** | The truth-conditions of "S knows that p" shift depending on the **ascriber's** conversational context (specifically, the salience of error possibilities and the stakes of the conversation). | The truth-conditions of "S knows that p" are invariant across conversational contexts but shift depending on the **subject's** practical environment (the costs of being wrong for S). |
  | **Contradiction** | When a low-stakes ascriber says "S knows" and a high-stakes ascriber says "S doesn't know," they do not contradict; both assertions can be true simultaneously. | When a low-stakes ascriber says "S knows" and a high-stakes ascriber says "S doesn't know," they contradict; one assertion must be false (determined by the subject's stakes). |
  | **Accusation of Misdescription** | **Accusation:** The Encroacher is offering a theory of *rational action* or *warranted assertibility*, not a theory of knowledge truth-conditions.<br>**Correction:** We agree this is a fair statement of what the Contextualist suspects.<br>**Reply:** We deny the accusation. We claim stakes literally change the truth value of the knowledge proposition, not merely the propriety of asserting it. | **Accusation:** The Contextualist is offering a theory of *conversation management*, not a theory of the epistemic property ascribed.<br>**Correction:** We agree this is a fair statement of what the Encroacher suspects.<br>**Reply:** We deny the accusation. We claim "knows" is a context-sensitive term like "tall," tracking a real relation that varies with context. |
  | **Semantic Content** | The content of "knows" is incomplete without a contextual parameter fixing the epistemic standard. | The content of "knows" is complete but includes a practical parameter fixed by the subject's situation. |

  ## 3. CRUXES

  The following three issues represent the remaining substantive divergence. Resolution of these issues determines which theory accounts for the data with fewer auxiliary assumptions.

  **(a) The Divergent Case (Ascriber Stakes vs. Subject Stakes)**
  This crux isolates whether the variability tracks the *ascriber's* context or the *subject's* practical situation. We require a case where the ascriber's stakes and the subject's stakes come apart.

  **(b) Disagreement and Retraction Data**
  This crux isolates the temporal stability of knowledge ascriptions. When practical circumstances change, do speakers treat earlier knowledge claims as having been false (retraction required) or as having been true in their original context (no retraction required)?

  **(c) The Ideal-Language Question**
  This crux isolates whether the dispute is semantic or substantive. If we eliminate the word "knows" and describe the situation purely in terms of evidence, probability, and warranted action, does any disagreement remain?

  ## 4. CONCRETE CASES AND PRE-REGISTERED PREDICTIONS

  ### Crux (a): The Divergent Case
  **Scenario: The Municipal Well**
  *   **Facts:** A technician at a water-quality lab measures a contaminant in a municipal well. The reading is just under the regulatory limit. The evidence is solid but not absolute (instrument margin of error exists).
  *   **Subject:** The Lab (represented by the Technician's findings). The Lab faces high stakes (public health liability, regulatory fines) if the water is unsafe.
  *   **Ascriber 1 (Low Stakes Context):** The Lab Supervisor, filing a routine weekly report to state archives. Error here causes minor paperwork correction. The Supervisor says: "The Lab knows the well water meets the standard."
  *   **Ascriber 2 (High Stakes Context):** The Town Mayor, deciding whether to expend emergency funds to truck in bottled water for the week based on the same reading. Error here causes public illness. The Mayor says: "No, the Lab doesn't know that—not for this decision."

  **Pre-Registered Predictions:**

  | Theory | Prediction regarding Supervisor's Utterance | Prediction regarding Mayor's Utterance | Do they contradict? |
  | :--- | :--- | :--- | :--- |
  | **Contextualism** | **True.** (Standards in supervisor's context are low.) | **True.** (Standards in mayor's context are high.) | **No.** Both express true propositions relative to their own contexts. |
  | **Pragmatic Encroachment** | **False.** (Truth depends on Lab's stakes, which are high.) | **True.** (Truth depends on Lab's stakes, which are high.) | **Yes.** They assert contradictory propositions about the same epistemic fact. |

  **Falsification Conditions:**
  *   **Against Contextualism:** If competent speakers universally judge that the Supervisor and Mayor cannot both be right, and specifically that the Supervisor was *wrong* to say "knows" in the routine report given the Lab's high liability.
  *   **Against Pragmatic Encroachment:** If competent speakers universally judge that the Supervisor was *right* (because it was a routine report) while simultaneously agreeing the Mayor was *right* (because it was an emergency decision), without sensing a contradiction.

  ### Crux (b): Disagreement and Retraction
  **Scenario: The Rising Stakes**
  *   **Facts:** On Monday, a subject S has low stakes regarding proposition p (e.g., meeting a friend for lunch). S says, "I know the restaurant is open."
  *   **Change:** On Tuesday, S's stakes regarding p rise dramatically (e.g., S must meet a business partner there or lose a contract, using the same evidence as Monday).
  *   **Assessment:** On Tuesday, S is asked: "Was what you said on Monday true?"

  **Pre-Registered Predictions:**

  | Theory | Prediction regarding Retraction | Prediction regarding Truth Value |
  | :--- | :--- | :--- |
  | **Contextualism** | **No Retraction.** S should say, "What I said Monday was true then, but I wouldn't say it now." | The Monday utterance remains **True** (fixed by Monday's context). |
  | **Pragmatic Encroachment** | **Retraction Required.** S should say, "I was wrong on Monday; I didn't know." (Or: "I spoke falsely.") | The Monday utterance is revealed as **False** (because the relevant stakes for knowledge were always high, or knowledge is lost when stakes rise). *Note: We acknowledge some PE variants allow Monday's claim was true *at t1*, but insist it cannot be endorsed at t2.* |

  **Falsification Conditions:**
  *   **Against Contextualism:** If speakers overwhelmingly feel compelled to say "I was wrong" rather than "Standards have changed."
  *   **Against Pragmatic Encroachment:** If speakers overwhelmingly feel that "I knew it Monday, but now I need to check again" is the coherent response, implying knowledge was possessed then but is insufficient for action now.

  ### Crux (c): The Ideal-Language Question
  **Scenario: Eliminating "Knows"**
  *   **Task:** Both parties must agree to describe the Water Lab case (Crux a) without using the word "knows" or synonyms implying epistemic status (e.g., "certain," "verified"). Use only terms of evidence, probability, risk, and warranted action.

  **Pre-Registered Predictions:**

  | Theory | Prediction regarding Residual Disagreement |
  | :--- | :--- |
  | **Contextualism** | **Disagreement Vanishes.** Both parties agree: The Lab has evidence E. E warrants assertion in low-stakes contexts. E does not warrant assertion in high-stakes contexts. The dispute was merely about which context governs the word "knows." |
  | **Pragmatic Encroachment** | **Disagreement Persists.** We disagree on whether evidence E *constitutes* knowledge given the Lab's high stakes. One of us must be wrong about the normative status of the Lab's belief, not just about word usage. |

  **Falsification Conditions:**
  *   **Against Contextualism:** If, after eliminating "knows," both parties still disagree about whether the Lab's belief was "epistemically sufficient" independent of assertion norms.
  *   **Against Pragmatic Encroachment:** If, after eliminating "knows," the Encroacher cannot state their position without implicitly referencing the propriety of action or assertion rather than a distinct epistemic fact.

  ***

  **Acknowledgement of Suspicions**
  We explicitly record the following mutual suspicions as open questions for future collaboration:
  1.  **Encroacher Suspicion:** That Contextualism reduces epistemology to linguistics, leaving no room for knowledge to guide action robustly across contexts.
  2.  **Contextualist Suspicion:** That Encroachment conflates the *conditions for knowledge* with the *conditions for rational action*, thereby changing the subject from epistemology to decision theory.

  Both parties agree that the Water Lab scenario (Crux a) provides the most promising empirical ground for resolving these suspicions. We commit to testing speaker intuitions on this specific scenario with naive subjects before publishing further theoretical rebuttals.
