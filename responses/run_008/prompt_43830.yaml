answer: |-
  ### What each side is actually claiming

  The gene-centric faction argues that selection is fundamentally a statistical consequence of differential replication among particulate inheritors. For them, group-level patterns are merely aggregate effects of individual fitness differences. When formal models partition selection into within-group and between-group components, the gene-side insists these are mathematically interchangeable descriptions of the same underlying process. Consequently, labeling groups as "units" is misleading bookkeeping; only entities with direct germ-line continuity (genes or organisms) possess the ontological status required for genuine selection. They argue that any appeal to group fitness collapses once one accounts for the individual-level advantages driving the behavior, rendering group selection a redundant description of individual selection in a structured population. They view the group as a temporary vehicle rather than a true evolutionary individual.

  The group-centric faction counters that mathematical equivalence does not entail causal identity. They distinguish Multilevel Selection 1 (groups as contexts for individual selection) from Multilevel Selection 2 (groups as replicators with their own fitness). Their core claim is that during Evolutionary Transitions in Individuality (ETI), groups acquire emergent traits and heredity mechanisms irreducible to members. For this side, the ability to redescribe group selection as individual selection ignores the causal work done by group-level properties, such as biofilm cohesion or multicellular differentiation, which stabilize the higher-level unit against lower-level conflict. They argue the gene-side begs the question by assuming lower-level individuation is fixed, whereas the group-side sees individuation as an evolutionary achievement requiring explanation. The dispute hinges on whether "unit of selection" implies causal responsibility or statistical association, creating a stalemate where one side sees redundancy and the other sees emergence.

  ### What the equivalence results do and don't show

  The equivalence results, primarily derived from the Price Equation and quantitative genetics, demonstrate that total evolutionary change can be partitioned into components attributable to different hierarchical levels without loss of predictive accuracy. These results show that a model positing group selection can be transformed into a model positing individual selection with correlated fitnesses, and vice versa. This settles the question of statistical adequacy: both descriptions predict the same trajectory of allele frequencies. Therefore, no empirical observation of population change can strictly falsify one framework in favor of the other based solely on outcome data. The math guarantees that if you know the covariance at one level, you can calculate the covariance at another, ensuring predictive parity between the competing narratives.

  However, these results do not show ontological identity or causal uniqueness. The mathematics describes *change* in trait frequencies, not the *mechanism* generating that change. Equivalence leaves open whether group-level traits are heritable independently of member traits, or whether group fitness is merely an average of individual fitnesses. Crucially, the formalism does not address the historical process by which a collection of individuals becomes a cohesive unit capable of reproduction. It treats the hierarchical structure as given, rather than explaining how conflict suppression or germ-soma differentiation arises. Furthermore, the results assume fitness values are assignable to entities, but do not justify *which* entities bear fitness. Consequently, while the math proves the descriptions are inter-translatable regarding population dynamics, it remains silent on whether the group is a passive vessel for individual genes or an active agent with emergent causal powers. This limitation is the source of the stalemate. The gene-side treats the mathematical possibility of reduction as proof of ontological priority. The group-side treats the mathematical necessity of assigning fitness to some level as proof that higher levels can be valid bearers. The equivalence results validate the gene-side's claim of reducibility but fail to validate their claim of exclusivity.

  ### Diagnosis

  Your hypothesis that this is two disagreements wearing one label is largely correct, but the first disagreement is deeper than merely verbal. It is not simply about which description counts as "the" unit; it is about what counts as a fundamental causal explanation. The gene-side treats formal reducibility as sufficient for ontological privilege, assuming that if a process can be described at a lower level, the higher level is causally inert. The group-side treats causal capacity as distinct from statistical partitioning, arguing that emergent properties exert downward causation even if statistically reducible. Thus, the first disagreement is substantive regarding the nature of causation, not just terminology. A purely verbal dispute implies both parties agree on facts but differ on labels. Here, they differ on what facts matter. The gene-side cares about particle continuity; the group-side cares about functional integration.

  The second disagreement, regarding Evolutionary Transitions in Individuality (ETI), is genuinely substantive and untouched by equivalence results. Here, the debate shifts from static selection to dynamic individuation. The gene-side often assumes individuals are pre-existing units, whereas the group-side investigates how those units emerge. Your hypothesis survives here: the equivalence results cannot adjudicate when a group becomes an individual because that is a historical and mechanistic question, not a statistical one. However, the stalemate persists because participants often conflate the two. They argue about ETI cases using static selection models, or they use equivalence results to dismiss emergence claims.

  You wondered if a hidden empirical question about heritability keeps camps apart. This is partially true but secondary. The real divide is whether heritability at the group level requires mechanistic independence or just statistical covariance. The gene-side demands mechanistic independence (germ-lines) to admit group selection; the group-side accepts statistical covariance as sufficient for selection, reserving "individuality" for later stages. This nuance refines your hypothesis: it's not just two disagreements, but a sliding scale of criteria for "unitness." The diagnosis is that the debate is a category error. They are arguing about "units of selection" when they should be arguing about "conditions for evolutionary individuality." The fight never ends because one side is answering "Can this be modeled lower?" (Yes) while the other answers "Does the higher level do work?" (Also Yes). Recognizing these as distinct questions is the only way to dissolve the stalemate. The equivalence results settle the statistical layer but exacerbate the metaphysical layer by allowing both sides to claim mathematical support. Ultimately, the disagreement is about explanatory goals rather than empirical facts.

  ### What would count as progress

  Progress requires shifting the question from "Which unit is real?" to "Under what conditions does a collective acquire evolutionary individuality?" Instead of arguing over static partitions, the group should focus on mechanistic criteria for transitions, such as bottlenecking, germ-soma separation, and conflict mediation. Cases like volvocine algae or slime molds offer empirical traction here, where the degree of individuality varies. If the debate centers on the *process* of becoming a unit, the equivalence results become irrelevant tools rather than weapons. This moves the discussion from abstract ontology to concrete biology.

  Alternatively, progress requires accepting explanatory pluralism. If the goal is prediction, the gene-side wins on parsimony. If the goal is understanding emergent complexity, the group-side wins on causal detail. Acknowledging that "unit of selection" is context-dependent—referring to replicators in one context and interactors in another—dissolves the demand for a single true unit. However, honest stagnation is also a possibility. If the disagreement rests on incompatible metaphysical intuitions about causation rather than empirical claims, no amount of data will resolve it. In that case, the debate should end not with a verdict, but with an agreement to pursue distinct research programs without claiming exclusive ontological territory. Regarding your worry about hidden empirical questions on heritability: progress here involves measuring group-level heredity directly, not inferring it from individual traits. If group traits show fidelity independent of member turnover, the group-side gains empirical ground regardless of statistical equivalence. Such demonstration would clarify when the "collapse" is biologically meaningful versus mathematically possible.
