answer: |-
  No, your zero-sum interpretation is incorrect, because Aristotle's requirement for equality concerns the proportionate value of the goods exchanged to maintain social balance, not the absence of subjective benefit, and he distinguishes between unjust exploitation and legitimate compensation.

  Your confusion arises from conflating equality in *exchange value* with equality in *use value* or utility. When Aristotle insists that a house must be exchanged for a specific number of shoes to achieve justice, he is solving the problem of commensurability: how to compare two fundamentally different things so that neither party is exploited. He argues that "need" holds the city together and money represents that need, allowing us to say that one house equals 500 shoes. However, this equality applies only to the terms of the trade, not to the motivation for it. Aristotle explicitly acknowledges that exchange occurs because parties have different needs; the builder needs shoes more than the house he built, and the shoemaker needs a house more than the shoes he made. Both parties walk away with something they value more than what they surrendered, meaning both gain in utility even though the exchange value was equal. If there were no gain in utility, there would be no motive to trade, and Aristotle treats exchange as a natural function of the household and city.

  The "proportional" equality your classmate mentioned is crucial here because it is not a simple identity ($A = B$) but a ratio ($A : B :: \text{Builder} : \text{Shoemaker}$). Aristotle argues that goods must be equalized not in themselves, but relative to the producers. If the builder is socially or functionally "worth" more than the shoemaker (a premise Aristotle accepts based on his view of social hierarchy), the goods must reflect that ratio to maintain reciprocity. Justice is violated not when someone gains from trade, but when the proportion is skewed—for example, if the builder uses deception to get 600 shoes for a house worth 500. This is why the Scholastics found substance in his analysis: they developed the "just price" theory to ensure that prices covered costs and provided a livelihood (legitimate gain) without exploiting the buyer's necessity (unjust gain).

  Regarding your worry about profit and the *Politics*, Aristotle's criticism is directed at *chrematistics* (wealth-getting for its own sake) rather than *oikonomia* (household management). He condemns the pursuit of unlimited accumulation because it has no natural end and corrupts the virtue of the citizens, not because any surplus value is generated. In *Nicomachean Ethics* V, he allows for reciprocity that sustains the community. A merchant who makes a profit by transporting goods from where they are abundant to where they are needed is performing a service that can be compensated within the proportional framework; the injustice arises only if that profit comes from monopolistic coercion or deception that breaks the proportion. Therefore, Aristotle does not view commerce as inherently zero-sum; he views unjust commerce as exploitative, but just commerce as a mutually beneficial reciprocity governed by proportionate equality.
