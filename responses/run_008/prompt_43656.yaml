      *   *Synthesis:* The Friend is right about the *risk* (futility is possible). The User is right about the *method* (Hofstadter provides the only rigorous way to attempt the task). The Sandia Report tries to solve the "Outer Message" problem. Sebeok tries to solve the "Decoder" problem by ensuring the Decoder remains similar to the Encoder.

