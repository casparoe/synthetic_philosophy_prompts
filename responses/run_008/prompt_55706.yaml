answer: |-
  This is a classic philosophical puzzle about **dispositional properties** (like fragility, solubility, or flammability). Your friend is intuitively navigating a debate that metaphysicians have been having for decades, specifically around "masking," "mimicking," and "finkish dispositions."

  Her judgments are surprisingly consistent, which makes your new case the perfect stress test. Here is the breakdown of the rules she could be using, my prediction, and the case that will force her to show her hand.

  ### 1. The Candidate Rules

  Based on her five prior rulings, there are two main rules that fit the data, but they diverge on your new case.

  **Rule A: The "Intrinsic Baseline" Rule**
  *   **The Logic:** Fragility is determined by the object's intrinsic physical state *before* any interaction occurs. If the material is currently structured like fragile glass, it is fragile. External factors (gadgets, wrap) don't change the label, but internal changes (heat-treating) do.
  *   **Fits Record:**
      *   *Gadget/Wrap:* Glass is still ordinary inside $\rightarrow$ Fragile.
      *   *Heat-strengthened:* Glass is different stuff inside $\rightarrow$ Not Fragile.
      *   *Poltergeist:* Glass is tough stuff inside $\rightarrow$ Not Fragile.
  *   **Prediction for New Case:** **Fragile.**
      *   *Why:* You specified the glass is "ordinary fragile glass through and through right now." The hardening happens *during* the impact. At the time of assessment, the baseline is fragile.

  **Rule B: The "Intrinsic Causal Basis" Rule**
  *   **The Logic:** Fragility is determined by whether the *intrinsic* properties of the object are what cause it to break. If an internal mechanism prevents breaking (even dynamically), the object lacks the disposition. External preventers don't count (masking), but internal preventers do (changing the basis).
  *   **Fits Record:**
      *   *Gadget/Wrap:* Prevention is external $\rightarrow$ Fragile.
      *   *Heat-strengthened:* Prevention is internal/structural $\rightarrow$ Not Fragile.
      *   *Poltergeist:* Breaking is caused externally $\rightarrow$ Not Fragile.
  *   **Prediction for New Case:** **Not Fragile.**
      *   *Why:* The mechanism that prevents breaking is *internal*. Even though it triggers on impact, it is part of the glass's own structure (unlike the external gadget in Case 2). Functionally, this is identical to Case 4 (heat-strengthened), just faster. The glass *itself* is doing the "cheating."

  ### 2. The "Dumb" Rule

  You asked for a rule that fits everything but is theoretically unsatisfying.

  **Rule C: The "Ordinary Glass" Label Rule**
  *   **The Logic:** An object is fragile if and only if it falls under the common-sense category of "ordinary glass."
  *   **Fits Record:**
      *   Cases 1, 2, 3 are all "ordinary glass" (even with gadgets/wrap).
      *   Cases 4 and 5 are "toughened/strengthened glass" (different category).
  *   **Why it's dumb:** It ignores *why* the glass breaks or doesn't break. It relies entirely on linguistic categorization rather than physical behavior. If you took an ordinary glass and painted it to *look* like heat-strengthened glass, this rule might stumble, whereas Rules A and B rely on physical facts. It fits her data, but it ignores her *reasoning* (she explicitly talked about gadgets vs. structure, not labels).

  ### 3. My Bet

  I would bet she calls the new case **Not Fragile**.

  **Why:**
  Look closely at her reasoning for Case 2 (the external gadget). She said: *"The glass itself hasn't changed, it's the gadget doing the cheating."*
  Now look at Case 4 (heat-strengthened). She said: *"It's just different stuff now."*

  In your new case, the glass *does* change. Its internal structure flips. To her, this likely counts as "different stuff" (Case 4) rather than "unchanged glass" (Case 2). The fact that the change is instantaneous doesn't matter; the *source* of the protection is internal. Since she draws a hard line between **External Protection** (Fragile) and **Internal Protection** (Not Fragile), your case falls on the Internal side.

  She treats fragility as a property of the *material constitution*, not the *temporal state at t=0*. If the material constitution includes a self-hardening mechanism, it is not fragile glass; it is self-hardening glass.

  ### 4. The Tie-Breaker Case

  To settle this definitively, you need to reverse the polarity. You need to know if she cares about the **Starting State** (Rule A) or the **Internal Mechanism** (Rule B).

  **Run this case past her:**
  > "Imagine a glass made of super-tough, heat-strengthened material (like your Case 4). It will not break if you hit it. *However*, it has been engineered with an internal mechanism that detects impact and instantly *weakens* its molecular bonds right before the force lands, ensuring that it *does* shatter. All internal, no external gadgets. Is this glass fragile?"

  **How to interpret her answer:**

  *   **If she says "Fragile":** She is following **Rule B (Intrinsic Causal Basis)**.
      *   *Reasoning:* The breaking is caused by the glass's own internal nature (even though it started tough). This confirms she cares about the *mechanism*, meaning your New Case (which prevents breaking via internal mechanism) is **Not Fragile**.
  *   **If she says "Not Fragile":** She is following **Rule A (Intrinsic Baseline)**.
      *   *Reasoning:* The glass started as tough stuff. The fact that it sabotages itself doesn't make it "fragile" in the standard sense; it makes it a "self-destructing tough glass." This means she cares about the *starting state*, meaning your New Case (which starts as fragile glass) **IS Fragile**.

  **Why this works:**
  Your new case is a "Fink" (a disposition that disappears when triggered). This test case is a "Reverse Fink" (a lack of disposition that appears when triggered). If her logic is consistent, her answer to this case *must* be the opposite of her answer to your new case. If she says "Not Fragile" to both, she's contradicting herself (Internal protection removes fragility, but internal sabotage doesn't create it?). This forces her to pick a side.
