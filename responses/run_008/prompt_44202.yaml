      *   *Claim 2: "The culprit was the p-value... lets you get a significant result... if you run enough analyses."*
          *   **Fact Check:** This describes p-hacking/garden of forking paths. NHST *facilitates* this when misused, but the p-value itself is a conditional probability $P(D|H_0)$. The problem is researcher degrees of freedom, not the math of the p-value itself.
          *   **Verdict:** Partially right on mechanism (p-hacking), wrong on blaming the tool itself rather than the usage.

      *   *Claim 3: "A p under .05 never really told you anything."*
          *   **Fact Check:** Too strong. It tells you data is unlikely under the null. It doesn't tell you $P(H|D)$ or effect size importance.
          *   **Verdict:** Overstatement. It tells you *something*, just not what people *want* it to tell them.

      *   *Claim 4: "The Bayesian fix is to... compute the probability that the hypothesis is true given the data."*
          *   **Fact Check:** This is the definition of posterior probability $P(H|D)$. However, standard Bayesian hypothesis testing (Bayes Factors) compares models, it doesn't always give a direct probability that *the* hypothesis is true in a binary sense without specific priors.
          *   **Verdict:** Conceptually accurate regarding the goal, but technically nuanced (Bayes Factors vs. Posteriors).

      *   *Claim 5: "Bayesians work from priors instead of null hypotheses."*
          *   **Fact Check:** Bayesians *can* have null hypotheses (e.g., parameter = 0). They use priors on parameters. BF compares a null model to an alternative model.
