      *   *Claim 6: "False positives basically can't happen."*
          *   **Fact Check:** **Absolutely False.** You can absolutely get misleading Bayes Factors with biased priors, optional stopping (though less sensitive than p-values), or model misspecification. "False positives" (finding evidence for an effect that isn't there) are possible.
          *   **Verdict:** Dangerous myth.

      *   *Claim 7: "Psychology has now largely switched to Bayes factors."*
          *   **Fact Check:** No. NHST is still dominant. Bayes is growing but niche.
