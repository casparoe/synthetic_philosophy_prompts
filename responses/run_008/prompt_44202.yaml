answer: |-
  Your skepticism is well-founded. The podcast summary you heard is a classic example of "statistical folklore"—a story that captures the *vibe* of the debate but gets the technical and historical details wrong. It sells Bayesian statistics as a moral shield rather than a mathematical tool.

  Here is the piece-by-piece breakdown of what a careful methodologist would accept, what they would correct, and what they would reject.

  ### 1. "Psychologists discovered that most of their published findings were false."
  **Verdict: Exaggerated.**
  This claim conflates a famous theoretical paper with empirical data. In 2005, John Ioannidis published a seminal paper titled *"Why Most Published Research Findings Are False."* It was a mathematical argument about why low power and bias lead to high false discovery rates. It was not an empirical census of psychology.

  When the empirical census actually happened—the 2015 Open Science Collaboration Reproducibility Project—they attempted to replicate 100 studies. They found that only about 36% to 39% yielded significant results in the same direction with similar effect sizes. That is a crisis, but it is not "most." Roughly one-third held up, one-third were ambiguous, and one-third failed. "Most are false" is a catchy headline, but the data suggests "many are unreliable."

  ### 2. "The culprit was the p-value... lets you get a significant result... if you run enough analyses."
  **Verdict: Conflates the tool with the user.**
  This describes *p-hacking* (or the "garden of forking paths"), which was absolutely a primary driver of the crisis. However, blaming the p-value itself is like blaming a thermometer for a fever. The p-value calculates the probability of the data given the null hypothesis ($P(D|H_0)$). It does not force you to run 20 analyses and report only the best one. That is a decision made by the researcher. NHST provides a threshold that incentivizes cheating, but the *culprit* is the incentive structure (publish or perish), not the arithmetic of the p-value.

  ### 3. "A p under .05 never really told you anything."
  **Verdict: Wrong.**
  This is an overcorrection. A p-value tells you exactly what it claims to tell you: if the null hypothesis were true, how unlikely is this data? That *is* information. The problem is that researchers interpreted it as information it *doesn't* provide (e.g., "the probability the theory is true" or "the size of the effect"). It told them something, but they asked it the wrong question.

  ### 4. "The Bayesian fix is to... compute the probability that the hypothesis is true given the data."
  **Verdict: Technically nuanced.**
  This is the philosophical appeal of Bayesian statistics. In a Bayesian framework, you can compute a posterior probability, $P(H|D)$. However, standard Bayesian hypothesis testing usually relies on **Bayes Factors**, which compare the predictive performance of two models (e.g., a null model vs. an alternative model). While this gets you closer to weighing evidence for hypotheses, it doesn't magically output a single "probability of truth" without making strong assumptions about your priors.

  ### 5. "Bayesians work from priors instead of null hypotheses."
  **Verdict: Misleading.**
  Bayesians do not discard null hypotheses. A standard Bayesian t-test compares a "point null" (effect size = 0) against an "alternative" (effect size is distributed around some range). The difference is that the Bayesian approach requires you to specify a *prior distribution* for the alternative. You are still testing against a null; you're just bringing prior expectations into the calculation.

  ### 6. "False positives basically can't happen."
  **Verdict: Dangerous and False.**
  This is the most irresponsible claim in the podcast summary. False positives (or more accurately, misleading evidence) absolutely happen in Bayesian statistics.
  *   **Prior Manipulation:** If you choose a prior that is too narrow or biased toward your expected result, you can rig the Bayes Factor to support your hypothesis.
  *   **Model Misspecification:** If your statistical model doesn't match the reality of the data generation process, Bayesian inference will confidently give you the wrong answer.
  *   **Optional Stopping:** While Bayes Factors are more robust to "peeking" at data than p-values, they are not immune. If you collect data until the Bayes Factor hits a threshold, you inflate the rate of misleading evidence.

  There is no statistical framework where false positives "can't happen."

  ### 7. "Psychology has now largely switched to Bayes factors."
  **Verdict: False.**
  While the use of Bayesian statistics has grown, NHST (p-values) remains the dominant language of psychology. Most major journals still primarily publish frequentist results. The "switch" is a niche trend, not a field-wide migration.

  ***

  ### The Verdict: Would switching to Bayes in 2010 have prevented the crisis?

  **No. Switching to Bayesian statistics in 2010 would not have prevented the replication crisis.**

  Here is the hard position: The replication crisis was not primarily a failure of *inference*; it was a failure of *incentives* and *transparency*.

  If you hand a researcher who is under pressure to publish positive results a Bayesian toolkit instead of a frequentist one, they will not suddenly become honest. They will simply become **Bayesian p-hackers**. Instead of tuning their analyses until $p < .05$, they will tune their **priors** until the Bayes Factor $> 3$. Instead of hiding non-significant conditions, they will hide analyses where the prior sensitivity was too low. This is sometimes called "researcher degrees of freedom in prior specification," and it is a documented problem.

  Furthermore, the replication crisis was driven heavily by **low statistical power** (small sample sizes). Small samples produce noisy estimates regardless of whether you analyze them with p-values or Bayes Factors. A Bayesian analysis of an underpowered study will simply result in a Bayes Factor that is insensitive (usually hovering near 1, indicating "anecdotal evidence"). While this is arguably better than a false positive, it doesn't solve the problem of the literature being filled with noise. It just means the noise is labeled "inconclusive" rather than "significant." However, publication bias would likely still push only the "decisive" Bayesian results into journals, recreating the same bias.

  The crisis happened because the scientific reward system valued novelty over accuracy. No mathematical formula can fix a sociological problem. The reforms that are actually working—preregistration, registered reports, and open data—work equally well for both Bayesians and frequentists. They force transparency *before* the analysis begins, rendering the choice of statistical calculus secondary.

  Bayesian statistics is a superior tool for many specific questions, particularly when incorporating prior knowledge is essential. But viewing it as a moral vaccine against bad science is a myth. If we had all switched to Bayes in 2010 without changing our publication incentives or transparency standards, we would simply be having this same conversation today about "Bayesian replication failures."
