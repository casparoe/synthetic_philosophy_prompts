answer: |-
  Here is a 50-minute teaching plan designed to maximize conceptual clarity while minimizing algebraic bog-down. It structures the session to let the tension emerge naturally rather than stating it upfront.

  ### **Session Goal**
  To demonstrate that in problems with imperfect recall, **ex-ante planning** (commitment) and **on-the-spot reasoning** (belief-updating) can yield conflicting recommendations, challenging standard Causal Decision Theory (CDT).

  ---

  ### **0:00 – 0:05 | Phase 1: The Setup (Formalizing the Constraint)**
  **Goal:** Establish the "Absent-Mindedness" as a hard information constraint, not a character flaw.

  1.  **Draw the Game Tree:**
      *   Start node (Home/Work).
      *   Node 1 (First Intersection): Branches *Exit* (0) and *Continue*.
      *   Node 2 (Second Intersection): Branches *Exit* (4) and *Continue* (1).
  2.  **The Crucial Move:** Draw a **dotted line** connecting Node 1 and Node 2.
      *   **Say:** "In game theory terms, these two nodes are in the same *information set*. When the driver arrives here, the game does not tell him which node he is at. He literally cannot condition his action on 'being at the first' vs 'being at the second'."
  3.  **Defuse the "Real World" Objection:**
      *   **Anticipated Objection:** "Why doesn't he bring a notebook or count turns?"
      *   **Response:** "We are modeling a specific agent architecture with bounded memory. If you solve it by giving him memory, you've solved a different game (Perfect Recall). We are investigating decision theory *under* this constraint."
  4.  **Defuse the Sleeping Beauty Confusion:**
      *   **Say:** "You might hear echoes of Sleeping Beauty. The mechanism of 'forgetting' is similar, but the goal here is different. SB is about *credence* (what do I believe?). AMD is about *action* (what do I do?) given those credences affect payoffs."

  ### **0:05 – 0:20 | Phase 2: The Ex-Ante Solution (The "Planning" View)**
  **Goal:** Derive the uncontroversial baseline. This satisfies the "optimization" instinct before complicating it.

  1.  **Define the Policy:**
      *   Since the driver can't distinguish nodes, he must choose a single probability $p$ of *Continuing* that applies to **both** intersections.
      *   **Whiteboard:** Write $p = P(\text{Continue})$.
  2.  **Calculate Expected Value (from Start):**
      *   Ask the group to help derive the EV equation.
      *   $EV = (1-p) \cdot 0 + p \cdot (1-p) \cdot 4 + p \cdot p \cdot 1$
      *   Simplify: $EV = 4p - 3p^2$
  3.  **Optimize:**
      *   Take derivative: $4 - 6p = 0 \rightarrow p = 2/3$.
      *   *(Correction Note: The standard Piccione & Lipman payoff structure usually yields $p=4/5$ or similar depending on exact numbers. With your numbers [0, 4, 1], the math is $4p(1-p) + p^2 = 4p - 3p^2$. Max is at $p=2/3$. If you want the classic $4/5$, change Exit 2 to 4 and Continue to 1? Wait, let's re-verify your numbers.)*
      *   *Re-calculation for your specific numbers:*
          *   Exit 1: 0
          *   Exit 2: 4
          *   Continue past 2: 1
          *   Prob of reaching Exit 2: $p(1-p)$
          *   Prob of reaching End: $p^2$
          *   $EV = 4p(1-p) + 1p^2 = 4p - 4p^2 + p^2 = 4p - 3p^2$.
          *   $dEV/dp = 4 - 6p = 0 \Rightarrow p = 2/3$.
      *   **Okay, stick with your numbers.** The specific fraction doesn't matter, the conflict does.
  4.  **Establish the Baseline:**
      *   **Say:** "From the perspective of the driver at home (Time 0), the rational plan is to continue with probability $2/3$. This is the **Planning Optimal** solution."

  ### **0:20 – 0:35 | Phase 3: The On-the-Spot Crisis (The "Acting" View)**
  **Goal:** Introduce the paradox. Show why the driver *at the intersection* might disagree with the driver *at home*.

  1.  **Shift Perspective:**
      *   **Say:** "Now, imagine you are the driver. You are tired. You are at an intersection. You know you committed to $p=2/3$. What should you do *right now*?"
  2.  **The Belief Problem:**
      *   To decide, you need to know: "Am I at the 1st or 2nd intersection?"
      *   You can't know for sure, but you can assign a probability. Let $\alpha = P(\text{Here is 1st} | \text{I am at an intersection})$.
      *   **Whiteboard:** Draw the decision from the perspective of *being at the node*.
      *   $EV(\text{Exit}) = \alpha \cdot 0 + (1-\alpha) \cdot 4$
      *   $EV(\text{Continue}) = \alpha \cdot [p \cdot 1 + (1-p) \cdot 4] + (1-\alpha) \cdot 1$
      *   *(Note: Keep the algebra light here. Focus on the dependency.)*
  3.  **The Conflict (The "Aha!" Moment):**
      *   Ask: "To calculate $\alpha$, don't we need to know how likely I am to reach the 1st vs 2nd intersection?"
      *   Yes. Reaching the 1st is certain (if I left work). Reaching the 2nd depends on $p$.
      *   So, $\alpha$ depends on $p$. But the optimal $p$ depends on $\alpha$.
      *   **The Paradox:** If you update your belief based on the fact that "I am currently at an intersection," you might conclude you are more likely to be at the 2nd one (because you had to survive the 1st to get here). If you think you're likely at the 2nd, you should Exit (payoff 4). But if you Exit, you violate the plan ($p=2/3$).
      *   **Key Phrase:** "The optimal plan from home is **dynamically inconsistent** with the optimal action at the node if the driver updates on self-locating information."

  ### **0:35 – 0:45 | Phase 4: Discussion & Scope Management**
  **Goal:** Contextualize without going down rabbit holes.

  1.  **Address the "Optimization vs. Decision Theory" Worry:**
      *   **Say:** "Notice the calculus was easy. The hard part wasn't maximizing the function; it was deciding *which* probability distribution to use. Standard decision theory assumes your beliefs are fixed. Here, your beliefs about 'where you are' depend on the action you plan to take."
  2.  **Explicit Scope Boundaries (Write on Board):**
      *   **We are NOT solving:** Functional Decision Theory (FDT) or Updateless Decision Theory (UDT). (Mention these as the "advanced solutions" that resolve this by ignoring the on-the-spot update).
      *   **We are NOT solving:** The full epistemology of Self-Locating Belief (Halfer vs. Thirder).
      *   **We ARE solving:** The tension between Causal Decision Theory (CDT) and Commitment in imperfect recall games.
  3.  **Handle the "Stupid Driver" Misconception:**
      *   If someone says "Just pre-commit to Exit at 2nd," remind them: "He physically cannot. The nodes are identical. He can only commit to a *mixed strategy*."

  ### **0:45 – 0:50 | Phase 5: The Comprehension Check**
  **Goal:** Verify they understand the *source* of the difficulty, not just the math.

  **The Micro-Exercise:**
  Ask the group to answer this specific question (think-pair-share for 2 minutes):

  > "If we change the payoff of 'Continuing past both' from 1 to 100, the ex-ante optimal $p$ becomes very close to 1 (always continue).
  >
  > **Question:** If the driver is at an intersection and knows $p \approx 1$, does his self-locating credence that 'I am at the 2nd intersection' go up or down compared to the $p=2/3$ case? And why does that make the decision *harder* rather than easier?"

  **What to listen for (The Correct Insight):**
  *   **Up or Down?** It goes **up**. If $p \approx 1$, he almost always passes the first intersection. So if he finds himself at *an* intersection, it is overwhelmingly likely to be the second one.
  *   **Why Harder?** If he is convinced he is at the 2nd intersection, the rational on-the-spot move is to **Exit** (to get the 4). But the ex-ante plan was to **Continue** (to get the 100).
  *   **Success Criterion:** They recognize that high $p$ makes the "I am at the 2nd" belief stronger, which increases the temptation to deviate from the plan. The conflict *worsens* as the incentive to continue grows.

  ---

  ### **Facilitator Cheat Sheet**

  *   **If they get stuck on the algebra:** Skip the derivative. Just say "Let's assume the optimal plan is $p$." The puzzle is about the *belief* at the node, not the maximization.
  *   **If they insist on "Just remember":** Remind them this is a model for agents (like AI or biological systems) where state is not perfectly accessible. It's about **control theory** as much as decision theory.
  *   **If they ask about UDT:** "UDT says: Ignore the fact that you are at an intersection. Act as if you are choosing the policy for both intersections simultaneously. That resolves the inconsistency, but it requires abandoning standard conditionalization."
  *   **Whiteboard Layout:**
      *   **Left:** Game Tree with Dotted Line.
      *   **Center:** Ex-Ante EV Equation & Result ($p=2/3$).
      *   **Right:** On-the-Spot Belief ($\alpha$) vs. Plan ($p$) conflict.

  ### **Why This Plan Works**
  1.  **Staging:** It forces them to accept the "Planning" solution first, so they feel the betrayal when the "Acting" solution conflicts.
  2.  **Misconceptions:** It isolates the "Memory" objection early so it doesn't derail the logic later.
  3.  **Scope:** It explicitly names the advanced theories (UDT) as "out of bounds" to prevent scope creep.
  4.  **Check:** The final question tests the *relationship* between policy and belief, which is the core theoretical contribution of the AMD problem.
