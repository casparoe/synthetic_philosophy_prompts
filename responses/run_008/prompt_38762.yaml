answer: |-
  Your verdicts are best explained by a principle distinguishing representational errors about mind-independent objects from the intrinsic reality of mind-dependent states, which preserves a robust notion of real consciousness without forcing you to accept global illusionism.

  Your original rule failed because it treated all experiences as representations claiming something about the world, whereas your intuitions actually track whether the experience *is* the reality or *points* to a reality. Under this repaired principle, perceptual cases like the Müller-Lyer lines and afterimages are illusions because they make false claims about mind-independent objects (lines, walls). In contrast, stubbed toes and understanding French are veridical because the phenomenology itself constitutes the reality; there is no external object being misrepresented, only an internal state existing. This resolves the phantom limb conflict: the *location* of the pain is an illusion (representational error regarding the limb), but the *pain itself* is veridical (intrinsic state), and your verdict prioritizes the reality of the suffering over the accuracy of the location.

  I am highly confident that this distinction captures your specific pattern of verdicts. Regarding your new cases, this principle predicts that tinnitus is real (intrinsic auditory state) despite lacking an external source, déjà vu is an illusion (false claim about past history), and mental effort is real (intrinsic feeling of exertion). I am moderately confident in these predictions, as they depend on whether one accepts cognitive phenomenology and non-veridical auditory states as intrinsic.

  Concerning your classmate, your verdicts do not force you into illusionism because you distinguish between the falsity of content and the reality of the vehicle. The classmate argues that because the "unequal look" is a construction, the experience itself is illusory; your principle allows you to agree the content is constructed while maintaining the experience is a real mental event. I am moderately confident that this blocks the slide to global illusionism, as it relies on the premise that phenomenal states have ontological weight independent of their accuracy.

  I am least sure about the status of the fridge hum case, because determining whether unattended processing involves genuine but inaccessible phenomenology or no phenomenology at all is empirically and philosophically contested, making your intuition there the weakest link in deriving a universal principle.
