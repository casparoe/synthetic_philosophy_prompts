answer: |-
  # Objection Sheet: Defending Gricean Reflexive Intentions
  **Talk:** *The Functional Reflex: Saving Non-Natural Meaning from Regress and Psychology*
  **Prep for:** Linguistics Department (Semantics/Pragmatics/CogSci Mix)

  ---

  ## 1. The Formal Semanticist (The Circularity Charge)
  **The Objection:**
  "You're analyzing *meaning* in terms of *intentions*. But intentions are propositional attitudes. To intend that the audience believe $p$, I must already grasp the content $p$. If the content $p$ is constituted by meaning, and meaning is constituted by the intention to convey $p$, you haven't analyzed meaning; you've just pushed the semantic primitive from the utterance to the mind. You're explaining the known by the equally unknown."

  **The Two-Minute Reply:**
  "I grant that intentions have content, but the Gricean project isn't to eliminate content, but to naturalize *communicative* content. The circularity charge assumes the content of the intention must be semantically prior to the utterance. My claim is that the *reflexive structure* breaks the circle. The content of the intention is self-referential: 'I intend you to believe $p$ *because* you recognize this intention.' The meaning of the utterance isn't imported from a pre-existing mental language; it is fixed by the success conditions of this specific reflexive loop. We aren't defining content *simpliciter*, we are defining *meaning$_{nn}$*—the difference between smoke meaning fire and a speaker meaning fire. The intention provides the normative constraint that natural causation lacks."

  *   **Soft Spot:** You are relying on the "reflexive structure" to do heavy lifting without explaining how the content $p$ gets into the intention without prior semantic resources.
  *   **Predicted Follow-up:** "So the content $p$ is external to the intention-structure? Then you haven't analyzed meaning, you've only analyzed *force*. You've explained how I signal, not what I signal."

  ## 2. The Neo-Gricean (The Intellectualism Charge)
  **The Objection:**
  "Even if the regress is logically blocked by self-reference, you're making communication too cognitive. In a standard conversational exchange, I don't compute your second-order intention. I use heuristics—'say what is relevant,' 'avoid redundancy.' If your analysis requires the speaker to harbor a reflexive intention and the hearer to identify it, you're modeling a courtroom deposition, not a coffee chat. You're confusing the rational reconstruction of meaning with the psychological process of understanding."

  **The Two-Minute Reply:**
  "This conflates *competence* with *performance*. My functionalist move is key here. To say the intention plays a 'recognition-and-trust role' doesn't mean the agent runs a conscious algorithm. It means the state is *individuated* by its function in the practice, much like a belief can be dispositional. The heuristic shortcuts you describe are evolutionary or learned compressions of this underlying reflexive structure. We don't need to calculate the geometry of a chair to sit on it, but the chair must still support weight to be a chair. Similarly, the heuristic works only because the underlying reflexive norm is in place to be exploited."

  *   **Soft Spot:** You are conceding that the intention need not be psychologically real in the moment. This risks making the intention a fictional posit rather than a causal state.
  *   **Predicted Follow-up:** "If the state doesn't need to be tokened in real-time, what empirical work is it doing? Is it just a normative gloss on regularities we could describe without intentions?"

  ## 3. The Relevance Theorist (The Redundancy Charge)
  **The Objection:**
  "You're clinging to the 'recognition of intention' clause as if it's doing independent work. In Relevance Theory, an ostensive stimulus communicates by raising an expectation of relevance. If I recognize your utterance as ostensive, I *ipso facto* recognize you intend to affect my cognitive environment. Adding the clause 'by means of recognizing this intention' is empty. It's a wheel that turns nothing. The work is done by the presumption of optimal relevance, not by the meta-representation of your intention."

  **The Two-Minute Reply:**
  "The presumption of relevance explains *why* I listen, but not *what* distinguishes communication from manipulation. A clever lie raises an expectation of relevance but fails the Gricean condition because it doesn't invite the audience to rely on the recognition of the intention itself. Relevance Theory struggles to distinguish between *showing* you evidence (where you infer the conclusion yourself) and *telling* you a conclusion (where you accept it on my say-so). The reflexive intention clause captures that specific normative invitation to trust. Without it, you can't separate meaning$_{nn}$ from mere causal indicating, even if both are 'ostensive'."

  *   **Soft Spot:** You are assuming the audience *does* accept the invitation to trust. In many cases (irony, fiction), they recognize the intention but *don't* accept the truth claim.
  *   **Predicted Follow-up:** "But in irony, I recognize you intend me to recognize you don't believe $p$. Your reflexive clause is too coarse-grained to handle non-literal cases without ad-hoc patching."

  ## 4. The Cognitive Scientist (The Developmental Charge)
  **The Objection:**
  "I study ToM in infants and apes. They communicate—pointing, gesturing—long before they pass false-belief tasks or demonstrate capacity for second-order intention representation ('I think that you think...'). If your functionalist move says the intention is whatever plays the role, fine. But if the creature *cannot* represent the recursion, is it really a reflexive intention? Or are you just labeling successful coordination as 'meaning' and smuggling in the Gricean label to make it sound deeper?"

  **The Two-Minute Reply:**
  "This is where the functionalist reading pays off. I am not claiming the infant represents the recursion explicitly. I am claiming the interaction *instantiates* the reflexive structure. The infant's gesture functions *as if* it were designed for recognition, and the caregiver responds *as if* recognizing that design. Over time, this external loop gets internalized. The capacity for meaning$_{nn}$ emerges from the practice, not prior to it. If the creature participates in the loop where success depends on the partner's uptake, it is entering the space of reasons, even if it can't introspect the gearwork. We shouldn't deny meaning to infants because they can't write philosophy papers about it."

  *   **Soft Spot:** This stretches "intention" very thin. If the structure is entirely external (in the practice), does the *speaker* mean anything, or does the *system* mean?
  *   **Predicted Follow-up:** "So meaning is a property of the dyad, not the agent? That contradicts the Gricean focus on individual speaker meaning as the foundation."

  ---

  ## Strategic Advice: Concessions vs. Hard Lines

  **Hold at All Costs:**
  **The Reflexive Structure (Semanticist & Relevance Theorist).**
  You cannot concede that the reflexive intention is redundant or circular without abandoning Griceanism entirely. If the recognition of the intention isn't the *reason* for the belief, you collapse into causal theories of meaning (like Dretske) which cannot handle lying or error. You must maintain that the *normative* element comes from the reflexive loop.

  **Concede Ground:**
  **The Psychological Reality (Neo-Gricean).**
  Do not fight the claim that speakers don't consciously compute these intentions in real-time. Your functionalist move allows you to agree that the *process* is heuristic while the *analysis* is reflexive. Conceding this makes you look empirically responsible.
  *   *Where they come apart:* The Semanticist worries about *foundations* (circularity); the Neo-Gricean worries about *processing* (speed). You can satisfy the Neo-Gricean by saying "It's a competence model" without satisfying the Semanticist's worry that competence models still need non-circular primitives. Be careful not to treat the Neo-Gricean concession as a solution to the Semanticist's problem.

  ---

  ## The "Hope Nobody Asks" Question

  **The Question:**
  "You've proposed understanding the reflexive intention functionally: as whatever state plays the 'recognition-and-trust' role in a practice. But to identify a practice as 'communicative'—rather than just coordinated signaling like bees dancing—you have to identify that the participants are following semantic norms. Doesn't identifying the practice *already require* the notion of meaning you're trying to analyze? If the function is defined by the practice, and the practice is defined by the meanings exchanged, haven't you just hidden the circularity inside the word 'practice'?"

  **Why this is lethal:**
  It attacks your escape hatch. You tried to solve the Semanticist's circularity worry by moving from "psychological state" to "functional role." This question points out that functional roles are individuated by their inputs and outputs. If the inputs/outputs are semantic (meanings), your functional definition presupposes the *definiendum*. It suggests your functionalism is merely a sociological disguise for the original circularity.

  **Preparation Note:**
  If asked, do not try to solve it fully. Acknowledge the depth. Pivot to *evolutionary emergence*: "We identify the practice initially by success conditions (getting the object, avoiding danger) and only later refine it to semantic norms. The function starts biological and becomes normative." (This is weak, but it's the best bridge you have).
