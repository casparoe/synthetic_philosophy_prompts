      *   **Task:** Evaluate who is right at each step, address specific philosophical questions (variation vs. truth, neutral standpoint, framework evaluation), and identify missing elements.
      *   **Tone:** Intellectual, balanced, analytical, respectful of both sides (like a referee).

  2.  **Deconstruct the Argument (Move-by-Move):**

      *   *Move 1 (Dave):* Moral variation across cultures $\rightarrow$ Moral truths are local customs (Relativism).
      *   *Move 2 (Elena):* Disagreement doesn't entail no truth (analogy to geology/earth shape).
