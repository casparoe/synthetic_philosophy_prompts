answer: |-
  ### The question

  Keynes's 1930 essay distinguishes between absolute needs (satiable) and relative needs (insatiable), suggesting the 'economic problem' could be solved within a century. Given that productivity growth has matched Keynes's projections while working hours have not fallen commensurately, analyze whether this divergence falsifies his positive prediction, his psychological diagnosis, or his normative ethic. Specifically, evaluate whether the 'love of money' can be overcome by individual moral enlightenment, or if Keynes's vision of the 'good life' requires a social equilibrium that prevents unilateral status loss. If relative needs dominate, does the individual have any agency to choose leisure, or is coordination mandatory? Conclude on whether the ethic remains viable once decoupled from the failed prediction and what this implies for policy.

  ### Model answer

  Keynes's empirical error regarding working hours is often dismissed as simple optimism, but it reveals a structural tension between his technical economics and his moral philosophy. Keynes was technically correct: productivity has risen roughly as forecasted. The failure lies not in the capacity to produce leisure, but in the demand for it. This divergence does not falsify the positive prediction so much as it highlights the dominance of relative needs over absolute ones. Once absolute needs are met, economic activity shifts to positional competition. Because relative status is a zero-sum game, aggregate productivity gains are consumed by higher status benchmarks rather than leisure.

  This dynamic critically wounds the normative ethic if interpreted as a call for individual moral enlightenment. Keynes viewed the love of money as a "disorder" that would fade once security was achieved. However, if status is relative, unilateral withdrawal from the labour market is not a virtuous act of liberation; it is a strategic error resulting in status loss. An individual who chooses the "arts of life" in a society that values accumulation is simply outcompeted. Therefore, the ethical vision cannot rest on individual psychology alone. The "disorder" is not merely internal but socially reinforced by the structure of relative comparison.

  Consequently, the collective-action angle is not peripheral but load-bearing. For Keynes's ethic to survive the failure of his prediction, it must be reformulated from a personal choice into a social equilibrium. This requires coordination mechanisms—such as statutory working hour limits or strong social norms around leisure—that prevent the prisoner's dilemma of status competition. Without institutional guardrails, the insatiability of relative needs ensures that productivity gains are always converted into output rather than time. The market alone cannot solve this because it responds to effective demand, which is driven by those relative needs.

  Thus, the normative claim remains viable, but only if decoupled from the expectation of spontaneous individual transformation. The "good life" is not something individuals choose after getting rich; it is a political arrangement that restricts the scope of economic competition. The failure of hours to fall demonstrates that freedom from the economic problem is not a natural economic outcome but a political achievement. If the ethic is to be salvaged, it must abandon the hope that productivity automatically buys liberty. Instead, it must argue for collective constraints on production to liberate time. The love of money persists not because humans are inherently greedy, but because the social structure makes greed the only rational strategy for maintaining status. Keynes's vision survives only if we acknowledge that solving the economic problem requires solving the political problem of distribution and status simultaneously.

  ### Marking scheme

  **Total: 25 Marks**

  1.  **Distinction between Absolute and Relative Needs (5 marks)**
      *   *Requirement:* Clearly defines absolute needs as satiable (biological/subsistence) and relative needs as insatiable (positional/status).
      *   *Typical Fumble:* Students conflate the two or treat relative needs as simply "greed" rather than structural positionality.

  2.  **Explanation of the Productivity/Hours Divergence (5 marks)**
      *   *Requirement:* Uses the needs distinction to explain why hours stayed stable despite productivity gains (income effect swallowed by status competition).
      *   *Typical Fumble:* Students simply state Keynes was wrong without explaining the mechanism of relative consumption.

  3.  **Analysis of the Normative Ethic (5 marks)**
      *   *Requirement:* Engages with Keynes's view of the love of money as a moral disorder and the "arts of life" as the ultimate end.
      *   *Typical Fumble:* Students treat the ethic as a vague preference for hobbies rather than a fundamental shift in valuing means versus ends.

  4.  **Individual vs. Social Equilibrium (5 marks)**
      *   *Requirement:* Identifies the collective action problem; argues that individual withdrawal is irrational without social coordination.
      *   *Typical Fumble:* Students treat the solution as purely cultural or educational, ignoring the strategic penalty of unilateral leisure.

  5.  **Viability Conclusion (5 marks)**
      *   *Requirement:* Concludes whether the ethic survives (yes, but requires institutional reform) and links this to policy implications.
      *   *Typical Fumble:* Students conclude the essay is simply obsolete because the prediction failed.

  **Note on A vs. B:**
  The dividing line is precisely where you suspected: B-level answers treat the collective-action problem as a complicating factor, whereas A-level answers treat it as the *only* way the normative claim survives. An A answer recognizes that if relative needs are insatiable, the "good life" cannot be a private choice made by enlightened individuals within a competitive market; it must be a public good secured through political constraints on the market itself.
