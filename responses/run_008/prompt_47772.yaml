answer: |-
  You have put your finger on a genuine tension that most people gloss over because it is uncomfortable to think about the epistemological foundations of monetary policy while worrying about interest rates. The dissonance you are seeing between the precision of the graphics and the vagueness of the speech is not just a communication quirk; it is a structural feature of how modern central banks manage legitimacy. To answer your first question about what view of probability the fan-chart and dot-plot apparatus presupposes, you are right to suspect it leans heavily toward the Knightian definition of risk rather than Keynesian uncertainty. When the Bank of England draws those fan charts or the Fed puts dots on a grid, they are implicitly treating the economy as an ergodic system. They are acting as if the future is a statistical reflection of the past, where the underlying structure of the economy remains stable enough that shocks can be modeled as draws from a known or estimable distribution. This is the world of measurable risk. In this view, GDP growth or inflation is like a roulette wheel where we might not know exactly where the ball will land, but we are confident we know the shape of the wheel and the laws of physics governing its spin. It presupposes that the uncertainty facing the policy committee is merely technical noise around a stable trend, rather than a fundamental unknowability about the structure of the future itself.

  However, the verbal hedging you noticed is where things get much more interesting and arguably more underdetermined. When a chair says the risks are skewed to the upside, they are technically making an ordinal comparison rather than a cardinal one. If you go back to Keynes's Treatise on Probability, he spends a great deal of time arguing that probabilities do not always need to be numerical to be rational. He allows for cases where we can say one outcome is more likely than another without being able to assign a specific percentage to either. So, in a strict technical sense, the verbal guidance is more compatible with Keynes's earlier work on probability than the fan charts are. The charts demand a numerical distribution, while the speech allows for a comparative judgment of likelihood. But I would caution against reading too much philosophical intent into this. While the speech is compatible with Keynes, it is not necessarily motivated by him. It is more likely motivated by accountability avoidance. If the Fed says there is a seventy percent chance of a rate hike and they do not hike, they are wrong. If they say the risks are skewed toward tightening and they do not hike, they can claim the skew was balanced by new data. The vagueness is a strategic asset. It allows them to inhabit a space where they look scientific enough to command market confidence but vague enough to avoid being falsified by specific outcomes. So while the language survives on a Keynesian view of uncertainty, the practice is often just pragmatic mush designed to preserve policy flexibility.

  This leads us to the implicit theory behind the whole practice, which I think is best described as a form of pragmatic instrumentalism that is deliberately underdetermined. The central banks do not need to commit to a single theory of probability because their goal is not truth in a philosophical sense but stability in a market sense. The numerical tools provide an anchor for market expectations, giving traders something to model against, while the verbal hedging provides an escape hatch for the humans making the decisions. This means the practice is consistent with several different theories of probability simultaneously. A neoclassical economist can look at the fan chart and see a Bayesian posterior distribution. A Keynesian can look at the press conference transcript and see an admission of non-numerical uncertainty. The institution benefits from both interpretations without having to defend either rigorously. They get the authority of science from the charts and the flexibility of statecraft from the speech. The only time this breaks down is when the gap between the two becomes too wide, such as when the fan chart shows a tight distribution of outcomes but the economy enters a crisis that the model deemed impossible. At that point, the pretense that the future is a draw from a known distribution collapses, and they are forced to rely entirely on the verbal hedging to explain why the numbers failed.

  The wrinkle you added about calibrating the width of the fans to past forecast errors is the most critical point regarding the Keynesian objection. This practice presupposes that the variance of forecast errors is stationary, or at least that the future volatility will resemble the past volatility. It assumes that the economy is stable enough that the magnitude of our past mistakes is a good guide to the magnitude of our future mistakes. Keynes would almost certainly wave this off, particularly when it comes to the long-term expectations that drive investment. In the General Theory, he argues that during periods of structural change or crisis, the past ceases to be a reliable guide because the rules of the game have changed. If the fan chart width is based on errors from a period of low inflation and stable growth, it will vastly underestimate the uncertainty during a period of structural break, like a pandemic or a war. Keynes would argue that you cannot calculate the probability of a structural break using data from a period where no structural break occurred. By calibrating to past misses, the central bank is implicitly assuming that no black swans exist, or at least that black swans occur with a frequency that can be estimated from historical data. This is the exact opposite of radical uncertainty. It treats the unknown unknowns as if they were known unknowns with a stable variance.

  So to reconstruct the whole picture, the central bank apparatus is a hybrid machine that tries to have it both ways. The visual tools are committed to a world of risk where the future is numerically tractable and the past is a guide to the future. The verbal communication is committed to a world of uncertainty where outcomes are ordinal and the committee retains discretion. The calibration of the fans to past errors tries to bridge these by imposing a statistical discipline on the uncertainty, but it fails the Keynesian test because it assumes ergodicity in a non-ergodic world. The practice works only as long as the economy remains within the bounds of historical experience. When the economy moves outside those bounds, the fan charts become misleadingly precise, and the verbal hedging becomes the only honest tool left. You are right to feel that this is backwards compared to Keynes. He would argue that we should start with the acknowledgment of radical uncertainty and only use numbers where they are strictly justified by stable conventions. The central banks start with the numbers to establish credibility and only admit uncertainty when the numbers threaten to constrain them too much. It is a performative contradiction, but one that has proven surprisingly resilient because markets prefer a precise wrong answer to an honest admission of ignorance.
