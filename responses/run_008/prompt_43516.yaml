answer: |-
  Here is a principle that captures the majority of your verdicts, explains the tension you feel, and makes precise predictions for your new cases.

  ### The Principle: The Descriptive-Evaluative Distinction

  **Statement:**
  Testimony is sufficient to transmit **knowledge** of *aesthetic character* (descriptive, technical, or dispositional properties), but testimony is insufficient to transmit **knowledge** of *aesthetic merit* (summative evaluative judgments); for the latter, testimony yields only *belief*, requiring first-hand acquaintance for epistemic entitlement.

  **The Clauses and Their Motivations:**

  1.  **The Character Clause (Knowledge Transmissible):**
      *   *Definition:* Properties that describe *how* an object strikes a perceiver or its technical constitution, without necessarily asserting its overall worth. These include expressive qualities (e.g., "forbidding"), technical faults (e.g., "corked"), and dispositional facts (e.g., "amuses an audience").
      *   *Motivating Verdicts:* This clause captures your **Wine** and **Building** cases. You accept the sommelier's "corked" verdict because it identifies a technical state (TCA contamination) that causes the taste, not merely a value judgment. You accept the critic's "forbidding" verdict because it describes the building's expressive character, which can be acknowledged even if one does not value it.
  2.  **The Merit Clause (Knowledge Blocked):**
      *   *Definition:* Properties that assert the object's value, worth, or success as an instance of its kind. These are "thick" or "thin" evaluative concepts that demand a normative response from the subject.
      *   *Motivating Verdicts:* This clause captures your **Film** and **Sunset** cases. "Masterpiece" and "Beautiful" are summative judgments of merit. Your intuition that you lack "whatever it is one acquires from seeing it" (Film) and your balking at claiming "knowledge" (Sunset) reflect the epistemic deficit inherent in accepting merit claims without acquaintance.

  ### Predictions for New Cases

  Applying this principle yields the following verdicts:

  1.  **Poem: "Sonnet" vs. "Haunting"**
      *   *Prediction:* You can know via testimony that the poem is a **sonnet** (formal fact) and that it is **haunting** (expressive character).
      *   *Reasoning:* "Sonnet" is structural. "Haunting" is an expressive property akin to "forbidding"; a poem can be haunting and yet fail as a poem. It describes the *nature* of the effect, not the *success* of the work. You would feel no unease citing the critic who called it haunting.
  2.  **Meal: "Delicious" vs. "Over-salted"**
      *   *Prediction:* You can know via testimony that the meal was **over-salted**, but you cannot know (only believe) that it was **delicious**.
      *   *Reasoning:* "Over-salted" is a technical/descriptive claim about the preparation (analogous to "corked"). "Delicious" is a summative judgment of merit (analogous to "beautiful" or "masterpiece"). You would feel the same epistemic deficit regarding the deliciousness as you did with the sunset.

  ### The Sacrifice: The Joke Case

  To maintain the coherence of this principle, one of your original verdicts must be sacrificed. The principle cannot save your intuition regarding the **Joke**.

  *   **Your Verdict:** You feel that believing a joke is funny based on testimony is "ordinary belief" with no epistemic deficit, distinct from the sunset case.
  *   **The Principle's Correction:** "Funny" is standardly an evaluative merit claim, equivalent to "Beautiful." If a friend says, "This joke is funny," they are asserting it *merits* laughter. Under the Merit Clause, you should feel the same balking at claiming *knowledge* that you feel in the Sunset case.
  *   **Why the Intuition Misleads:** Your intuition in the Joke case is likely preserved only because you implicitly relativized the claim ("funny to its intended audience"). This turns the claim into a *dispositional fact* (Clause 1) rather than a *merit claim* (Clause 2). However, in standard aesthetic discourse, "That is funny" functions as a verdict of merit. To be consistent with your Sunset verdict, you must admit that if you do not get the joke, you do not *know* it is funny, even if you believe it on testimony. The feeling of "ordinary belief" here is the outlier that collapses the distinction between Character and Merit.

  ### Summary of the Tension Resolved

  The tension you circled regarding the Wine and the Building is resolved by noting that "Corked" and "Forbidding" are not claims about *value*, but claims about *state* and *character*. A wine can be corked and rare/valuable; a building can be forbidding and successful. "Beautiful" and "Masterpiece," however, are claims about value. The principle holds that we can borrow an expert's eyes for description, but not for valuation.
