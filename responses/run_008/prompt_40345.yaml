answer: |-
  ## The Procedure: Calibrated Score-Derived Ranked Pairs

  You are correct to be wary. Arrow's theorem tells us that with ordinal rankings, we cannot have it all. However, by shifting from *ordinal* rankings (A > B > C) to *cardinal* scores (A=90, B=80, C=70) and then aggregating via a Condorcet-consistent method, we can manage the trade-offs deliberately.

  Below is the **Foundation Review Protocol (FRP-7)**. It is designed to be mechanically reproducible, transparent to trustees, and defensible against appeals, provided you are honest about the mathematical sacrifices.

  ### Phase 1: Ballot Design (Sacrificing Unrestricted Domain)

  **Instruction to Panelists:**
  Do not ask for a full ranking of 40 items. It induces cognitive fatigue, leading to random noise in the bottom half. Instead, require **Calibrated Cardinal Scores**.

  1.  **The Scale:** Panelists assign an integer score from **0 to 100** to every application.
  2.  **Calibration Anchors:** To reduce inter-panelist variance (e.g., one panelist's 80 is another's 60), provide three "anchor" descriptions in the scoring guide:
      *   *50:* "Competent, standard science, fundable but not exceptional."
      *   *75:* "Strong innovation, clear impact, high priority."
      *   *90+:* "Transformative, field-defining, must fund."
  3.  **Ties:** Panelists may assign identical scores to multiple applications.
  4.  **Conflicts:** If a panelist has a conflict of interest (COI) with an application, they must leave that cell **blank**.

  **Arrow Audit:**
  *   **Sacrifice:** **Unrestricted Domain (UD).** We are forbidding arbitrary preference orderings and forcing preferences into a 0-100 cardinal metric.
  *   **Transparency:** **Open.** The scoring guide explicitly states we are measuring "intensity of support," not just rank. This is defensible to trustees as "quality assessment."

  ### Phase 2: Aggregation Rule (Sacrificing Independence of Irrelevant Alternatives)

  We will not use simple averaging (Range Voting) because it hides cyclic majorities. We will not use Borda because it is sensitive to truncation. We will use **Ranked Pairs (Tideman's Method)** applied to pairwise majorities derived from the scores.

  **The Algorithm (Mechanical Steps):**
  1.  **Construct Pairwise Matrix:** For every pair of applications (A, B), count how many panelists scored A > B.
      *   If Panelist scores A > B, A gets 1 vote.
      *   If Panelist scores B > A, B gets 1 vote.
      *   If Panelist scores A = B (or leaves blank due to COI), it counts as 0 votes for both (a tie).
  2.  **Calculate Margins:** For each pair, calculate the *margin of victory* (Votes for Winner minus Votes for Loser).
  3.  **Sort Pairs:** List all pairs in descending order of their margin of victory.
      *   *Tie-Breaker:* If two pairs have the same margin, sort them alphabetically by Application ID (e.g., App-01 before App-02). This ensures reproducibility.
  4.  **Lock Pairs:** Iterate through the sorted list. "Lock in" a pair (e.g., A > B) unless it creates a cycle with pairs already locked.
      *   *Example:* If you have locked A > B and B > C, you cannot lock C > A. Skip C > A.
  5.  **Generate Ranking:** Once all pairs are processed, the locked pairs form a directed graph. The final ranking is the topological sort of this graph (the application that beats everyone else is 1st, etc.).

  **Arrow Audit:**
  *   **Sacrifice:** **Independence of Irrelevant Alternatives (IIA).** Removing a losing application can change the locking order of the winners.
  *   **Transparency:** **Open.** You must tell trustees: "The relative ranking of A and B can depend on the presence of C, because C affects which consensus agreements we lock in first. This is the price of ensuring a cycle-free ranking."

  ### Phase 3: Edge Case Protocols

  **1. Conflict of Interest (COI)**
  *   **Rule:** A blank score is treated as **abstention**. That panelist is removed from the denominator for that specific pairwise comparison.
  *   **Risk:** If 3 panelists have COI on App-X, only 4 vote. A 3-1 majority among the remaining 4 counts as a full majority.
  *   **Arrow Cost:** This creates local variance in "majority" thresholds, but preserves **Non-Dictatorship** globally.

  **2. Truncated Ballots (The "Top-10" Irritant)**
  *   **Rule:** If a panelist scores only their top 10 and leaves the rest blank (without COI), treat the unscored items as **tied at 0**.
  *   **Rationale:** This penalizes laziness. If you don't score it, it cannot beat the items you did score.
  *   **Arrow Cost:** This is a **Domain Restriction** (UD). It forces panelists to engage with the full set or accept a penalty.

  **3. Late Withdrawal**
  *   **Rule:** If an application withdraws after ballots are cast, **recalculate the entire ranking** without that application.
  *   **Appeal Defense:** If an appellant argues "If App-Z hadn't applied, I would have won," you reply: "Correct. Our method violates IIA by design. We prioritize transitive consistency over IIA. We will not re-fund based on counterfactuals."
  *   **Arrow Cost:** Explicit **IIA Violation**.

  ### Phase 4: The Chair's Judgment (Where Mechanics End)

  The procedure is mechanical, but three "Human in the Loop" moments remain. You must document these in the internal report.

  1.  **The Funding Cutoff:** The procedure gives a *ranking*, not a *funding decision*. You must set the cutoff (e.g., "Top 5 funded"). If the ranking puts two tied applications on the boundary (one funded, one not), you must decide whether to fund both (overspend) or flip a coin. **Judgment:** Recommend funding both if budget allows; otherwise, coin toss.
  2.  **The "Local Dictator" Check:** If the algorithm produces a ranking where a single panelist's preference determined the order of two applications (because everyone else tied them), you must flag this. **Judgment:** If the "dictated" pair is in the funding zone, convene a 15-minute discussion to confirm consensus.
  3.  **The "Disliked Output":** If the mathematically correct winner is scientifically dubious (e.g., a safe, incremental project beats a risky, transformative one due to consensus), you cannot override the math without destroying the protocol's integrity. **Judgment:** You must fund the winner but add a "Chair's Note" to the report acknowledging the risk-aversion of the panel.

  ---

  ## Simulation of Three Cases

  Here is how FRP-7 handles the specific scenarios you requested.

  ### Case 1: The Genuine Condorcet Cycle
  **Scenario:** Applications A, B, and C are the top contenders.
  *   4 Panelists prefer A > B.
  *   4 Panelists prefer B > C.
  *   4 Panelists prefer C > A.
  *(Note: Different coalitions form for each pair).*
  *   Margins: A>B (4-3), B>C (4-3), C>A (4-3).

  **Procedure Execution:**
  1.  **Sort:** All margins are equal (1). Tie-breaker is Application ID. Order: (A,B), (A,C), (B,C).
  2.  **Lock 1:** Lock **A > B** (Margin 1).
  3.  **Lock 2:** Check **A > C** (Wait, the pair is C>A in the cycle). The pair is C vs A. C beats A 4-3. So we check **C > A**.
      *   Does locking C > A create a cycle with A > B? No. Lock **C > A**.
      *   Current locks: A > B, C > A. (Implies C > A > B).
  4.  **Lock 3:** Check **B > C**.
      *   Does locking B > C create a cycle? Yes. We have C > A > B. Adding B > C creates C > A > B > C.
      *   **Action:** Skip (Do not lock) B > C.
  5.  **Final Order:** C > A > B.

  **Outcome:** Application C wins.
  **Arrow Sacrifice:** This resolves the cycle by sacrificing the preference of the B>C majority to maintain **Transitivity**.
  **Transparency:** In the report, state: "A cyclic majority existed. The protocol resolved it by prioritizing the pairwise lock established first by ID tie-breaker."

  ### Case 2: The IIA Appeal (Withdrawal)
  **Scenario:** Applications A and B are close. Application C is a "spoiler" that loses to both but splits the consensus.
  *   **With C:** The locks result in ranking A > B > C. A is funded.
  *   **Without C:** C withdraws. We recalculate. The removal of C changes the margin order of other pairs. The new locks result in B > A. B is funded.
  *   **Appeal:** Applicant A argues, "I beat B when C was present. Removing C should not make me lose."

  **Procedure Execution:**
  1.  Acknowledge the math is correct.
  2.  **Response:** "The Foundation uses a Ranked Pairs protocol. This protocol guarantees a transitive ranking but does not guarantee Independence of Irrelevant Alternatives. The presence of C altered the strength of consensus locks between other pairs. This is a known property of the method, disclosed in the guidelines."

  **Outcome:** You deny the appeal.
  **Arrow Sacrifice:** **IIA**. You are openly admitting that the context of the pool matters.
  **Risk:** High. Trustees may dislike this.
  **Mitigation:** Frame it as "Holistic Review." The quality of A relative to B *does* depend on the field they are in.

  ### Case 3: The Idiosyncratic Panelist (Local Dictatorship)
  **Scenario:** Applications X and Y are in the "tail" (unlikely to be funded, but ranking matters for the report).
  *   6 Panelists score X = 50, Y = 50 (Tied).
  *   1 Panelist (The "Maverick") scores X = 90, Y = 10.
  *   All other pairs are locked. We are determining X vs Y.

  **Procedure Execution:**
  1.  **Pairwise Count:**
      *   6 Panelists: Tie (0 votes for X, 0 votes for Y).
      *   1 Panelist: X > Y (1 vote for X, 0 votes for Y).
  2.  **Margin:** X beats Y by 1 vote.
  3.  **Lock:** Since no other locks contradict this, **X > Y** is locked.
  4.  **Result:** X ranks higher than Y solely due to one person's vote.

  **Outcome:** The Maverick determined the relative order of X and Y.
  **Arrow Sacrifice:** **Non-Dictatorship (Local).** While no single voter dictates the *whole* election, they dictate *subsets* where the majority is indifferent.
  **Chair's Dislike:** You might dislike this because it gives disproportionate power to outliers on low-stakes items.
  **Action:** This falls under **Chair's Judgment (Local Dictator Check)**. Since X and Y are in the tail, you note it but accept it. If this happened for the *last funded slot*, you would convene the panel to break the tie manually.

  ---

  ## The "Disliked Output" Case

  **Scenario:**
  *   **App-Alpha:** A risky, transformative project. Scores: 100, 100, 100, 20, 20, 20, 20. (Average: 57).
  *   **App-Beta:** A safe, incremental project. Scores: 60, 60, 60, 60, 60, 60, 60. (Average: 60).
  *   **Pairwise:** 4 panelists prefer Beta > Alpha. 3 prefer Alpha > Beta.
  *   **Result:** Ranked Pairs locks Beta > Alpha based on the 4-3 majority. Beta gets funded. Alpha is rejected.

  **My Honest Assessment:**
  As Chair, I **dislike this result**. Alpha has higher potential value (sum of scores is close, but variance suggests transformative potential). Beta is mediocrity by consensus.
  **However,** the procedure mechanically outputs Beta > Alpha.
  **Action:** I must fund Beta. To mitigate, I use the **Chair's Note**: "While App-Beta ranked higher by consensus, the panel is advised that App-Alpha received stronger support from a minority of reviewers. Future calls should consider mechanisms for high-variance proposals."
  **Why:** If I override the math to fund Alpha, I violate **Non-Dictatorship** (I become the dictator). I must absorb the pain of the "safe" win to preserve the system's integrity for the next cycle.

  ---

  ## Summary of Sacrifices & Transparency

  | Arrow Condition | Status in FRP-7 | How We Sacrifice It | Transparency Level |
  | :--- | :--- | :--- | :--- |
  | **Unrestricted Domain** | **Sacrificed** | We force Cardinal Scores (0-100), not arbitrary rankings. | **Open.** Stated in scoring guidelines. |
  | **IIA** | **Sacrificed** | Withdrawal of a loser can change the winner. | **Open.** Stated in Appeal Policy. |
  | **Transitivity** | **Preserved** | Ranked Pairs guarantees a cycle-free list. | **Open.** The primary selling point. |
  | **Pareto Efficiency** | **Preserved** | If everyone scores A > B, A will rank > B. | **Open.** Intuitive to trustees. |
  | **Non-Dictatorship** | **Preserved (Global)** | No single voter controls the whole outcome. | **Open.** |
  | **Non-Dictatorship** | **Risk (Local)** | One voter can decide ties where others are indifferent. | **Disclosed.** Handled via Chair's Judgment. |

  ## Where the Procedure Runs Out (The Chair's Gap)

  The procedure is mechanical up to the generation of the final ranked list. The gap opens at three specific points:

  1.  **The Budget Boundary:** The math gives you a rank, not a budget allocation. If the 5th and 6th ranked items are mathematically tied (same locks), the procedure stops. **You** must decide to fund both, neither, or flip a coin. *Do not ask the panel to revote; it invites strategic manipulation.*
  2.  **The "Maverick" Veto:** If the "Local Dictator" case (Case 3 above) occurs within the funding zone (e.g., the 5th slot), the mechanical output is valid but politically fragile. **You** must decide whether to accept the math or invoke a "Consensus Check" (a non-binding discussion). I recommend accepting the math to avoid setting a precedent that the Chair can override the algorithm.
  3.  **The "Disliked Output":** When the method funds the "safe" option over the "brilliant" one (Alpha/Beta case). **You** must write the narrative justification. The procedure cannot justify *quality*, only *preference aggregation*. You own the quality assurance.

  **Final Advice:**
  Print the "Arrow Audit" table and attach it to the internal report. When a trustee asks, "Why did removing Application Z change the winner?", you point to the IIA row and say, "We traded that property to ensure we never have to tell you that Application A beats B, B beats C, and C beats A simultaneously." That is a trade-off they can understand.
