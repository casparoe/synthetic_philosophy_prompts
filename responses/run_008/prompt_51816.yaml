answer: |-
  This is an exceptionally sharp diagnosis. You have correctly identified the structural stalemate, and your hypothesis that the debate is a proxy war for a deeper metaphysical commitment (Rylean/deflationary vs. Realist/Powers) is largely correct. However, I think you are letting the participants off *slightly* too easy by framing it as merely verbal or conceptual. The stalemate is substantive, but it is substantive about **Humeanism vs. Anti-Humeanism** and the **Intrinsicness Constraint**, rather than just the semantics of 'disposition'.

  Here is a breakdown of where your map is solid, where it needs updating, and what actual progress looks like.

  ### 1. Critiquing Your Map
  Your historical summary is accurate for the core period (1994–2010), but there are two nuances worth adding to get the structure right:

  *   **Lewis's Specific Move:** You mention Lewis tried to patch things with test conditions. It's crucial to note that Lewis (1997) moved to the **Revised Conditional Analysis (RCA)**. He didn't just tweak the antecedent; he tied the disposition to an *intrinsic causal basis*. $x$ is disposed to $m$ if $x$ has an intrinsic property $B$ such that, if $x$ were stimulated and retained $B$, $x$ would manifest $m$. This was specifically designed to kill the fink (the fink removes $B$).
  *   **The Post-2010 Shift:** You say nobody has moved an inch. That's mostly true for the CA vs. Counterexample dialectic, but the literature largely abandoned the attempt to save the *Simple* CA. The field split into:
      1.  **Contextualists** (Manley & Wasserman, 2008): They argue disposition ascriptions are context-sensitive (like "tall"). A masked glass is fragile in a context where masks are ignored, not fragile in a context where they are salient. This dissolves the counterexamples without metaphysical heavy lifting.
      2.  **Identity Theorists** (Heil, Martin, Jacobs): They abandoned the conditional analysis entirely. Fragility *is* the molecular structure. The conditional is merely evidence for the disposition, not its analysis.

  ### 2. Evaluating Your Hypothesis
  **Is it a fight about what 'disposition' is doing?**
  Yes, but deeper: it is a fight about **Humean Supervenience**.

  *   **The Pro-CA Camp (Lewis, early Choi):** These philosophers generally want to preserve a Humean mosaic. If dispositions are real, irreducible powers, they threaten Humean supervenience (the idea that everything supervenes on the distribution of local, categorical qualities). Therefore, they *need* the Conditional Analysis to be true so they can reduce dispositions to conditionals over categorical bases. For them, the counterexamples are bugs to be fixed because the alternative (irreducible powers) is metaphysically unacceptable.
  *   **The Anti-CA Camp (Bird, Ellis, Mumford):** These are Dispositional Essentialists. They *want* the counterexamples to work. They argue that the fact that a fink interferes with the manifestation but not the power proves that the power is distinct from its manifestation conditions. For them, the failure of CA is a feature, not a bug; it proves powers are real.

  **Are you letting them off too easy?**
  You are letting **Lewis** off too easy. He wasn't a Rylean. He was a realist about properties but a Humean about laws. He didn't think disposition talk was just licensing inferences; he thought dispositions were real properties that *needed* to be analyzed in terms of categorical bases + laws to avoid occultism.
  You are also letting the **Intrinsicness Constraint** off too easy. The debate stalls because both sides (mostly) agree that dispositions must be **intrinsic**.
  *   If you allow dispositions to be extrinsic/relational, masks disappear (the glass in styrofoam has the extrinsic disposition *to-break-in-styrofoam*, but lacks the intrinsic disposition *to-break*).
  *   Choi's defense relies heavily on arguing that masks are extrinsic interferers, so they don't touch the intrinsic disposition.
  *   The stalemate persists because everyone is trying to satisfy the **Intrinsicness Constraint** while accounting for **Extrinsic Interferers**.

  So, it's not just verbal. It's a triangulation problem between:
  1.  Conditional Analysis (Desirable for Humeans)
  2.  Intrinsicness (Desirable for almost everyone)
  3.  Fink/Mask Intuitions (Desirable for realists)

  You can only have two.
  *   **Humeans** keep 1 & 2, deny 3 (argue the intuitions are wrong or context-sensitive).
  *   **Powers Theorists** keep 2 & 3, deny 1 (CA is false).
  *   **Extrinsic Disposition Theorists** keep 1 & 3, deny 2 (Dispositions are relational).

  ### 3. What Counts as Progress?
  A "killer case" is unlikely because metaphysical intuitions are theory-laden. A Humean will always intuit that the finked wire lacks the disposition because they equate disposition with manifestation likelihood. A Powers theorist will intuit it retains the disposition because they equate it with the categorical base.

  Progress has actually happened in three specific ways, none of which involve one side "winning" the CA debate:

  **A. The Contextualist Turn (Semantic Progress)**
  Manley and Wasserman (2008) argued that disposition ascriptions are quantificational claims sensitive to a "normality" parameter set by context.
  *   *Progress:* This explains why we oscillate. In a lab context, the masked glass isn't fragile. In a shipping context, it is. This saves the CA by making the antecedent of the conditional context-sensitive ("if struck *in normal conditions*").
  *   *Verdict:* This is the most viable path for the Pro-CA side, but it concedes that there is no single metaphysical relation of "fragility."

  **B. The Identity Theory (Metaphysical Progress)**
  John Heil and C.B. Martin argued that we should stop looking for an analysis. Properties are "powerful qualities." The mass of the glass *is* its fragility.
  *   *Progress:* This dissolves the need for CA. The conditional "if struck, it breaks" is not an analysis of fragility; it is a contingent truth that holds in virtue of the identity of the property.
  *   *Verdict:* This is the dominant view among Anti-Humeans now. It admits the CA is dead but saves the ontology.

  **C. Admitting the Proxy War (Dialectical Progress)**
  The most honest progress is acknowledging that the CA debate is a proxy for **Humeanism vs. Dispositional Essentialism**.
  *   If you are a Humean, you must defend a version of CA (likely contextualist).
  *   If you are an Anti-Humean, you must reject CA.
  *   *Verdict:* Progress is stopping the pretense that we are analyzing a shared concept. We are fighting over the fundamental architecture of reality.

  ### 4. Conclusion: Is your diagnosis right?
  Your diagnosis is **85% correct**.
  *   **Right:** It is a clash between deflationary/analytic ambitions and realist/metaphysical ambitions.
  *   **Right:** The term 'disposition' is doing double duty (predictive tool vs. causal explainer).
  *   **Missing:** The constraint of **Intrinsicness** is the glue holding the stalemate together. If philosophers were willing to say dispositions are extrinsic relations, the fink/mask cases evaporate. The fact that they won't suggests the debate is about the *nature of properties*, not just words.

  **Recommendation for moving forward:**
  Don't look for a case that forces a bullet bite. Look for the **theoretical cost**.
  *   Ask the CA defender: "Are you willing to accept that 'fragile' is context-sensitive such that there is no monadic property of fragility?" (If yes, they are Rylean/Contextualist).
  *   Ask the Powers theorist: "Are you willing to accept irreducible modalities in the base of reality?" (If yes, they are Dispositional Essentialist).

  The literature has effectively split, just as you suspected. The "CA vs. Fink" papers are now mostly historical artifacts; the live action is in **Contextualism** (saving the language) vs. **Identity Theory** (saving the metaphysics). You aren't missing a move; you're witnessing the aftermath of a draw where the players moved to different boards.
