answer: |-
  Here is a twenty-minute session plan designed for your specific group and constraints.

  ### Phase 1: Establishing the Baseline (Minutes 0–5)
  **Goal:** Secure agreement on factual testimony to create a contrast point.
  **Action:** Start with the "raining" example. Ask the group if they know it is raining outside if you tell them so, assuming they trust you and haven't looked out the window. They will say yes.
  **Why:** You need to lock in the intuition that testimony *usually* transfers knowledge effortlessly. This makes the aesthetic case feel anomalous later.
  **Misconception Check (The "Rotten Tomatoes" Trap):**
  *   **When:** Immediately after introducing the aesthetic topic.
  *   **The Trap:** Someone will say, "I use critics all the time to decide what movies to watch."
  *   **The Pivot:** Stop them. Clarify that you aren't asking about *practical utility* (saving money/time) but about *epistemic status* (knowing it is true). Ask: "When you read a review, do you know the movie is good before you see it, or do you just bet that you will agree later?" Force them to see the difference between *acting on advice* and *knowing a truth*.

  ### Phase 2: The Carrying Example & The Hinge (Minutes 5–10)
  **Goal:** Isolate the aesthetic predicate from factual attribution.
  **Action:** Use your hunch. It is strong. Present a specific painting (e.g., *Girl with a Pearl Earring*).
  *   **Case A:** Tell them, "This painting was made by Vermeer in 1665." Ask if they know this fact based on your word. (Yes.)
  *   **Case B:** Tell them, "This painting is emotionally devastating." Ask if they know this judgment based on your word.
  **Why this hinge works:** Case A is art-historical fact; testimony transfers knowledge because the property (authorship) exists independently of the viewer's reaction. Case B is an aesthetic judgment; testimony feels hollow because the property (devastation) seems to require *experiencing* it to be known. This contrast proves that not all claims about art are "aesthetic testimony."
  **Misconception Check (The "No Taste" Trap):**
  *   **When:** As they react to Case B. Someone will say, "If I just believe you, I have no taste of my own."
  *   **The Pivot:** Clarify that the problem isn't *autonomy*, it's *access*. Explain: "It's not that you aren't allowed to trust; it's that beauty seems like a flavor. If I tell you this honey is sweet, but you haven't tasted it, do you know it's sweet, or do you just know I say it is?" This shifts the blame from their character (having no taste) to the nature of the property (requiring acquaintance).

  ### Phase 3: The Epistemic Boundary (Minutes 10–15)
  **Goal:** Navigate the "Reason vs. Knowledge" distinction without jargon.
  **Action:** Do not introduce the technical distinction between "having a reason to believe" and "knowing." It will bog down a twenty-minute lay session.
  **The Refuse Pile:** Explicitly tell yourself to avoid:
  *   *Realism vs. Anti-Realism:* Don't debate if beauty is in the object or the eye.
  *   *Justification Internalism:* Don't discuss whether they need access to the reasons for their belief.
  *   *Sentimentalism:* Don't get into whether emotions are truth-apt.
  **Strategy:** Instead, use the phenomenology of "seeing." Ask: "If I tell you it's raining, you can picture the water. If I tell you it's beautiful, can you picture the beauty without feeling it?" If they say no, then testimony gives them a belief, but not the *knowledge* that comes from seeing. Keep the focus on the *experience gap*, not the *logic gap*.

  ### Phase 4: Synthesis and Closing (Minutes 15–20)
  **Goal:** Test whether they grasp the distinction between factual and aesthetic testimony.
  **Action:** Summarize the tension. We accept facts on testimony because facts exist without us. We resist beauty on testimony because beauty seems to happen *to* us.
  **The Closing Question:**
  "If you trust me completely, and I tell you this song is a masterpiece, but you listen and hear only noise—do you know it is beautiful, or do you only know that I believe it is?"
  **Why this works:** If they say "I know it's beautiful," they haven't grasped the aesthetic uniqueness (they are treating it like rain). If they say "I know you believe it," they grasp that aesthetic knowledge requires personal acquaintance. If they hesitate, they see the tension.

  Summary: This plan secures a baseline of factual testimony, uses the Vermeer contrast to isolate aesthetic predicates, heads off pragmatic and autonomy misconceptions early, avoids technical epistemology in favor of phenomenological experience, and ends with a diagnostic question about the location of knowledge.
