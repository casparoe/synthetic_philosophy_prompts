  # Epistemic Mapping: Sorting Historical Claims by Practice

  **Instructions:** Start at the top with a description of a claim and its proponents. Answer **Yes** or **No** to each question based *only* on how the proponents argue, publish, and handle evidence. Follow the path to a leaf. Note that some leaves are marked **[EMPTY]**; these represent logical positions that are theoretically possible but practically unoccupied.

  ***

  ### **Q1: Is the claim presented as a methodological boundary test (e.g., "What if?") rather than a definitive reconstruction of events?**
  *   **YES** ➔ **LEAF 1: Methodological Speculation**
      *   *Example:* The Silurian Hypothesis.
      *   *Features:* Peer-reviewed; explicitly admits lack of evidence; invites refutation; explores limits of detection.
  *   **NO** ➔ Go to **Q2**.

  ### **Q2: Does the thesis require that the bulk of the physical or textual record is inauthentic (forged, systematically misdated, or concealed)?**
  *   **YES** ➔ Go to **Q3**.
  *   **NO** ➔ Go to **Q5**.

  ### **Q3: Is the work published and defended through standard peer-review channels of the relevant discipline?**
  *   **YES** ➔ **LEAF 2: [EMPTY] The Institutional Whistleblower**
      *   *Status:* **Career-Fatal.** Academia rarely sustains those who accuse the entire field of fraud within its own journals without irrefutable proof.
  *   **NO** ➔ Go to **Q4**.

  ### **Q4: Is the cause of the historical error human (conspiracy/incompetence) or non-human (extraterrestrial/unknown agency)?**
  *   **HUMAN** ➔ **LEAF 3: Radical Reconstruction**
      *   *Example:* Fomenko's New Chronology.
      *   *Features:* External publication; claims global forgery; immunized against refutation (data is "fake").
  *   **NON-HUMAN** ➔ **LEAF 4: Exogenous Explanation**
      *   *Example:* Ancient Aliens claims.
      *   *Features:* Pop-media distribution; explains anomalies via external tech; immunized (evidence is "hidden/destroyed").

  ### **Q5: Does the argument employ evidentiary standards and methods currently accepted within the discipline?**
  *   **YES** ➔ **LEAF 5: Discipline-Internal Revisionism**
      *   *Example:* Proposals to shorten Egyptian Chronology (e.g., *Centuries of Darkness*).
      *   *Features:* Sincere; uses internal evidence (texts/strata); marginalized for conclusions, not method; accepts potential falsification.
  *   **NO** ➔ Go to **Q6**.

  ### **Q6: Does the proponent community actively engage with contemporary disciplinary critique?**
  *   **YES** ➔ **LEAF 6: [EMPTY] The Engaged Anachronist**
      *   *Status:* **Unstable.** Proponents using outdated methods who genuinely engage modern critique usually either convert to current standards or are marginalized into silence.
  *   **NO** ➔ Go to **Q7**.

  ### **Q7: Is the methodology merely superseded (e.g., 19th-c. mythography) or entirely absent (pure speculation)?**
  *   **SUPERSEDED** ➔ **LEAF 7: Superseded Scholarship**
      *   *Example:* The Atlantis Tradition (Donnelly-style).
      *   *Features:* Sincere; treats myth as literal data; methodologically outdated; historically significant but not current practice.
  *   **ABSENT** ➔ **LEAF 8: [EMPTY] The Unfalsifiable Speculator**
      *   *Status:* **Incoherent.** Asserts fact with no method and no engagement. Distinguishable from *Exogenous Explanation* only by lacking a specific non-human agent.

  ***

  ### **Instructor's Key: Distinguishing Features**

  | Case | Leaf | Why it lands here |
  | :--- | :--- | :--- |
  | **Silurian Hypothesis** | 1 | It is a *thought experiment*, not a claim of fact. |
  | **Fomenko** | 3 | Claims record is *fake*; publishes outside history; human conspiracy. |
  | **Ancient Aliens** | 4 | Claims record is *puzzling*; publishes in pop media; non-human agent. |
  | **Egyptian Revisionism** | 5 | Claims record is *misinterpreted*; uses standard archaeological method. |
  | **Atlantis (Donnelly)** | 7 | Claims record is *myth-history*; uses 19th-c. method; no modern engagement. |

  **Note on Adjacency:** *Discipline-Internal Revisionism* (Leaf 5) and *Superseded Scholarship* (Leaf 7) may appear adjacent. This is intentional. Both reject the mainstream conclusion, but Leaf 5 risks its thesis on current rules, while Leaf 7 plays by old rules. The tree separates them by **method**, not by how "wrong" the conclusion appears.
