answer: |-
  ### Phase 1: Brainstorming and Stress-Testing

  Before committing to the final specification, we must sift through candidate principles. The goal is to distinguish between *constitutive norms* of rational evaluation (non-negotiable) and *substantive ethical commitments* (camp preferences).

  **Candidate 1: Strong Pareto.** (If everyone is at least as well off, and some strictly, the world is better.)
  *   *Stress-Test:* In infinite worlds, Strong Pareto clashes with Anonymity (permutation invariance). If we can permute individuals to map World A onto World B, but A Pareto-dominates B, we have a contradiction.
  *   *Verdict:* Must be weakened to *Finite Pareto* (applies only to finite changes) to survive the infinite context.

  **Candidate 2: Full Anonymity.** (The value of a world is invariant under any permutation of individuals.)
  *   *Stress-Test (The Stutter):* If we allow arbitrary permutations, we can construct bijections that shift welfare values across indices to prove $A > A$ via cancellation of infinite subsets.
  *   *Verdict:* Must be discarded or severely restricted. Location/Identity must carry some ethical weight in infinite contexts to anchor value.

  **Candidate 3: Completeness.** (For any A, B, either $A \succeq B$ or $B \succeq A$.)
  *   *Stress-Test (The Corridor):* In the Corridor case (Infinite Excellent vs. Infinite Excellent + 1 Mediocre), forcing a ranking may require arbitrary stipulations. However, for *policy*, incomparability is paralyzing.
  *   *Verdict:* Camp Preference. A theory *can* be adequate if it admits incomparability, provided it distinguishes it from equality (Verdict Distinctness).

  **Candidate 4: Summation/Aggregation.** (Value is the sum of welfare.)
  *   *Stress-Test:* Standard sums are undefined for infinite series (Riemann rearrangement theorem).
  *   *Verdict:* Must be replaced by a more robust comparison metric (e.g., overtaking, hyperreal, or structural).

  **Candidate 5: Finite Fidelity.** (If two worlds differ only regarding a finite number of subjects, their ranking must accord with finite axiology.)
  *   *Stress-Test (Parfit's Egypt):* If we have $\infty$ happy people, adding one more must register as a change. If a theory says "No change" (e.g., Average Utilitarianism on infinite backgrounds), it fails.
  *   *Verdict:* Non-Negotiable. If a theory cannot handle the finite difference embedded in an infinite background, it is ethically blind.

  ---

  ### Phase 2: The Requirements for Adequate Infinite Ethics

  Here is the specification list for your seminar. I have categorized them by status and linked them to the motivating cases.

  | Requirement | Status | Motivating Case | Specification |
  | :--- | :--- | :--- | :--- |
  | **1. Finite Fidelity** | **Non-Negotiable** | **Parfit's Egypt (Infinity)** | If worlds $A$ and $B$ differ only regarding a finite subset of subjects, the theory must rank them exactly as standard finite axiology would (e.g., Total Utilitarianism). An infinite background of welfare cannot swamp finite moral differences. |
  | **2. Verdict Distinctness** | **Non-Negotiable** | **The Corridor** | The theory must formally distinguish *Equal Goodness* ($V(A) = V(B)$) from *Incomparability* ($V(A) \not\leq B \land V(B) \not\leq A$). Conflating these obscures whether a choice is indifferent or rationally underdetermined. |
  | **3. Structural Anchoring** | **Non-Negotiable** | **The Stutter** | Value must be anchored to a fixed structural description (e.g., temporal or spatial indices) that restricts permissible permutations. One cannot re-index individuals arbitrarily to generate cancellation paradoxes ($A > A$). |
  | **4. Transitivity** | **Non-Negotiable** | **Decision Theory** | The better-than relation must be transitive. If $A \succ B$ and $B \succ C$, then $A \succ C$. Without this, dynamic choice and policy planning are impossible. |
  | **5. Completeness** | **Camp Preference** | **Policy Paralysis** | The theory should ideally provide a verdict for every pair of outcomes. However, a theory admitting limited incomparability is adequate *if* it satisfies Finite Fidelity and Structural Anchoring. (Dropping this avoids impossibility theorems but reduces decision-guidance). |
  | **6. Cardinality Neutrality** | **Camp Preference** | **Cosmological Models** | The theory should ideally compare outcomes with different infinite cardinalities (e.g., $\aleph_0$ vs $\aleph_1$). If it refuses, it must explain why this does not render cosmological policy evaluation impossible. |

  ---

  ### Phase 3: The Impossibility Result and the Necessary Drop

  You suspected a subset of requirements is jointly unsatisfiable. You are correct. This is the core theoretical lesson for the seminar.

  **The Impossible Triad:**
  1.  **Finite Fidelity** (Finite differences matter even against infinite backgrounds).
  2.  **Full Anonymity** (Permutation invariance; the identity/location of lives does not matter).
  3.  **Transitive Consistency** (No $A > A$; avoids the Stutter).

  **The Proof Sketch:**
  In an infinite domain, *Full Anonymity* allows us to permute individuals such that any finite difference can be "shifted" to infinity or canceled out against a matching infinite subset (The Stutter). If we maintain *Finite Fidelity* (the finite difference *must* count) and *Full Anonymity* (we can rearrange the infinite background to cancel anything), we generate a contradiction where the finite difference both matters and does not matter, leading to intransitivity or $A > A$.

  **The Requirement to Drop:**
  **Full Anonymity.**

  **Why:**
  We must accept **Structural Anchoring** (Requirement 3) instead. In a finite world, swapping two people doesn't change the "shape" of the world. In an infinite world, swapping people changes their relation to the "boundary" or the temporal sequence. To prevent the Stutter paradox, we must acknowledge that *where* a life occurs (e.g., at time $t_1$ vs $t_2$) is ethically relevant, or at least that we cannot arbitrarily re-index the population for the sake of aggregation. This means infinite ethics cannot be purely "person-affecting" in the anonymous sense; it must be sensitive to the structure of the population.

  **The Single Requirement that Excludes the Most Popular Candidates:**
  **Finite Fidelity.**

  **Why:**
  This is the hardest filter.
  *   **Discounting Approaches:** Fail Finite Fidelity. If you discount the future geometrically, a finite addition of lives sufficiently far in the future contributes effectively zero value, violating the demand that finite axiology holds regardless of the infinite background.
  *   **Average Utilitarianism:** Fails Finite Fidelity in infinite contexts. Adding a finite number of happy lives to an infinite population does not change the average, rendering the theory indifferent to Parfit's Egypt.
  *   **Simple Summation:** Fails because the sum is undefined (violates Consistency/Transitivity).

  Only theories that can isolate finite differences within an infinite structure (like *Overtaking Criteria* or *Hyperreals with fixed ordering*) survive this.

  ---

  ### Phase 4: Family Check Against the List

  Here is how the three major families of proposals fare against your new specification.

  **1. Aggregation using Nonstandard/Hyperreal Values**
  *   **Verdict:** *Passes Finite Fidelity and Consistency; Fails Structural Anchoring (often).*
  *   **Critique:** By assigning infinite values (e.g., $\omega + 1 > \omega$), they handle Egypt and Corridor well. However, hyperreal values often depend on the choice of an ultrafilter or a specific ordering of summation. If the value changes based on how we index the population, they violate **Structural Anchoring** and risk the Stutter unless the ordering is fixed by physical time/space.

  **2. Discounting Approaches (Discounted Actual Value)**
  *   **Verdict:** *Fails Finite Fidelity.*
  *   **Critique:** Discounting ensures convergence (solving the undefined sum), but it implies that lives far enough in the future have negligible value. This contradicts **Finite Fidelity**, as a finite addition of lives in the distant future would not alter the ranking, violating the agreement with finite axiology required in the Egypt case.

  **3. Lexicographic / Pareto-Style Rankings (e.g., SPPE, Overtaking)**
  *   **Verdict:** *Passes Structural Anchoring; Fails Completeness.*
  *   **Critique:** These approaches (like Catching-Up or Overtaking criteria) respect temporal structure (avoiding the Stutter) and handle finite differences well. However, they frequently declare pairs **Incomparable** (e.g., when two streams oscillate without one overtaking the other). They satisfy **Verdict Distinctness** but fail the **Completeness** preference, potentially paralyzing policy in the Corridor case if the "extra" life doesn't trigger an overtaking condition.
