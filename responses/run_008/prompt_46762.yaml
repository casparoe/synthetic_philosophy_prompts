      *   *Wait, Aumann says they MUST converge.* If they don't, the theorem's conditions weren't met. The game is designed to *fail* the conditions so the debrief can explain why.
      *   *Plan:* The game is set up so they *should* converge (same priors, honest signals). But humans aren't perfect Bayesians. They will likely anchor or fail to update fully. The "Quotable" is the Facilitator pointing out: "You disagreed. Aumann says you shouldn't have. Which assumption broke?"

