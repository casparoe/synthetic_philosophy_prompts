prompt: |-
  I'm a PhD student in philosophy of physics, and at the end of a workshop talk on whether the Everett interpretation yields empirically distinct predictions from Copenhagen-style quantum theory, a senior physicist in the audience waved the question away with 'shut up and calculate'. The slogan comes up constantly in my circles whenever interpretation is mentioned — sometimes against asking what the wave function represents, sometimes against asking whether many-worlds is even testable, and sometimes just to complain that philosophers should spend less time talking and more time doing physics. Could you separate the distinct precise claims the slogan could be expressing — from the near-trivial reading on which it's a platitude about research priorities, through readings on which it's a substantive methodological doctrine, to readings on which it's a strong philosophical thesis about meaninglessness or about the interpretation debate being a dead end — and for each, say whether it's trivial, defensible but contentious, or simply false? In particular, I'd like to know which of those readings, if any, would actually justify deploying the slogan to terminate a debate about the relative empirical standing of Everettian and Copenhagen quantum mechanics, since several of them look beside the point for that question. Please lay the readings out as a numbered menu I can circulate to our reading group beforehand, and write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of physics.
      *   **Context:** End of a workshop talk on Everett vs. Copenhagen empirical distinctness. A senior physicist used "Shut up and calculate" (SUAC) to dismiss the question.
      *   **Task:** Separate the distinct precise claims the slogan could express (from trivial to strong philosophical thesis). Evaluate each (trivial, defensible but contentious, or false). Identify which readings justify terminating the specific debate (Everett vs. Copenhagen empirical standing).
      *   **Format:** Numbered menu suitable for circulation to a reading group.
      *   **Language:** British English.

  2.  **Deconstruct "Shut Up and Calculate" (SUAC):**
      *   The slogan is notoriously ambiguous. It ranges from pragmatic advice to instrumentalist dogma.
      *   I need to categorize these meanings logically, escalating in philosophical weight.
      *   *Category 1: Pragmatic/Pedagogical.* Focus on getting results now.
      *   *Category 2: Methodological/Prioritisation.* Physics *should* focus on prediction, not ontology.
      *   *Category 3: Instrumentalist/Anti-realist.* Theories aren't descriptions of reality, just tools.
      *   *Category 4: Verificationist/Meaninglessness.* Questions without empirical difference are meaningless.
      *   *Category 5: Sociological/Dismissive.* "This isn't physics, it's philosophy."

  3.  **Drafting the Readings (Iterative Process):**

      *   *Reading 1 (The Pragmatic):* "We have calculations to do." -> Trivial/Platitude. Doesn't stop the debate, just postpones it.
      *   *Reading 2 (The Methodological):* "Physics is about prediction, ontology is secondary." -> Defensible but contentious. Might sideline the debate but doesn't refute the claim about empirical distinctness.
      *   *Reading 3 (The Instrumentalist):* "The wavefunction isn't real." -> Substantive. If true, Everett's ontology is irrelevant. But does it stop the empirical distinctness question? Not necessarily, as empirical distinctness is about outcomes.
      *   *Reading 4 (The Verificationist):* "No empirical difference = no difference." -> Strong. This directly addresses the talk's topic. If there's no empirical difference, the question is moot. But the talk was *asking* if there is a difference. So using SUAC to stop the *investigation* is question-begging.
      *   *Reading 5 (The Demarcationist):* "This is philosophy, not physics." -> Sociological. False as a strict claim, but reflects culture.

      *Refining for the User's specific need:* The user wants to know which readings justify *terminating the debate about relative empirical standing*.
      *   If the claim is "There *is* no empirical difference" (Verificationist), then the debate is over (but SUAC usually implies we shouldn't *ask*, not that we know the answer).
      *   If the claim is "It doesn't matter if there is" (Methodological), the debate is scientifically idle.
      *   If the claim is "It's meaningless" (Positivist), the debate is nonsense.

      *Let's structure the menu clearly.*
      1.  Pragmatic Prioritisation (Trivial)
      2.  Methodological Instrumentalism (Contentious)
      3.  Semantic Verificationism (Strong/False?)
      4.  Demarcation/Sociological (Contentious)
      5.  The "Orthodoxy" Defence (Conservative)

      *Wait, I need to be precise about the evaluation.*
      *   Trivial: Hard to disagree with, but doesn't do the work.
      *   Defensible but Contentious: Reasonable philosophical stance, but not consensus.
      *   Simply False: Philosophically untenable.

      *Crucial Point:* The talk was about *whether* they yield distinct predictions. SUAC is often used to imply they *don't* or that it *doesn't matter*.
      *   If SUAC means "Standard QM works, don't bother looking for deviations," that's a bet on orthodoxy.
      *   If SUAC means "Interpretations aren't empirical claims," that's a category error regarding Everett (which claims to be pure QM).

  4.  **Developing the Content (incorporating British English):**
      *   Use "programme," "prioritisation," "centre," "defence," etc.
      *   Tone should be academic, precise, respectful of the physicist's perspective but firm on the philosophical nuance.

      *Drafting the specific readings:*
      1.  **The Pragmatic Heuristic:** "Focus on solvable problems." (Trivial)
      2.  **The Methodological Division of Labour:** "Physicists calculate, philosophers interpret." (Contentious/False dichotomy)
      3.  **The Instrumentalist Doctrine:** "Theories are tools, not truths." (Defensible but contentious)
      4.  **The Verificationist Thesis:** "No empirical difference implies no factual difference." (Strong, but begs the question if used to stop the inquiry).
      5.  **The Conservative Bet:** "Standard formalism is complete; searching for deviations is a waste." (Defensible strategy, but not a principle).

      *Wait, I need to address the specific context: Everett vs. Copenhagen empirical distinctness.*
      *   Everettians often claim there *are* distinct predictions (e.g., regarding probability, or interference of worlds, though standard decoherence suggests otherwise).
      *   If the physicist says SUAC, they usually mean "The formalism is the same, so stop asking."
      *   I need to highlight that using SUAC to stop the *question* of empirical distinctness is often a category mistake or a dogmatic assertion that the formalisms are empirically equivalent without proof.

  5.  **Refining the Evaluations:**
      *   *Pragmatic:* Trivial. Doesn't justify stopping the talk.
      *   *Instrumentalist:* Defensible. Justifies ignoring ontology, but not necessarily empirical tests.
      *   *Verificationist:* Strong. If accepted, kills the debate. But is it true? Many philosophers of physics reject strict verificationism.
      *   *Demarcation:* False. Foundations is part of physics.

