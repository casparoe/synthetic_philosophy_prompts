  My two roommates had a blow-up last weekend that I got to watch in full, and honestly I couldn't tell who was winning the argument, so I'm hoping you can referee it after the fact. Background: our friend Sam invited everyone to his birthday trip upstate, and Marcus told him he couldn't make it because of a work deadline, but then we all found out (long story, someone's Instagram story) that Marcus actually skipped it for a cabin weekend with a different group. Dana confronted him pretty harshly in the kitchen about it, and when Marcus said the retort that everyone reaches for — that Dana bails on people with fake excuses all the time, she literally did it to her own brother in March — things escalated. I wrote down the sequence of moves as best I could afterwards, since I kept thinking each point was won and then un-won by the next one: (1) Dana said her own past excuses change nothing about what Marcus did — the accusation is true, the lie happened, and calling out a lie is just stating facts, so whether she's a hypocrite is beside the point. (2) Marcus said blame isn't a weather report, it's a personal confrontation, more like a judge ruling on a case — the judge needs jurisdiction, and by doing the same thing herself Dana forfeited any standing to be the one delivering the verdict. (3) Dana said okay, but by that logic nobody can ever blame anybody, since literally everyone has told a convenient lie at some point, and a rule under which all blame everywhere is impermissible can't be the right rule. (4) Marcus said she was exaggerating — standing is only lost through the same, unrepudiated fault, so a reformed liar who's genuinely changed keeps his standing, and Dana, who lied in March and shows no signs of thinking it was wrong, specifically lost hers; a third friend with clean hands could blame Marcus all day. (5) Dana asked whether he really believes that identical words, identical anger, aimed at identical behavior, are permissible coming from the clean friend and wrong coming from her — the blamed person is treated exactly the same either way, so it's weird for the wrongness to live entirely in facts about the blamer that the blamed never even experiences.

  They eventually dropped it and we all had tacos, but I keep going back and forth on each move, and since I'm the one who's supposed to present at our little ethics discussion group thursday, I'd love a verdict. Please adjudicate move by move: give me exactly five numbered items, one per move, each one or two sentences rating that move from clearly mistaken to clearly right with a one-line justification, and fold your overall verdict on who came out on top into the fifth item. No intro or conclusion, just the five items.
