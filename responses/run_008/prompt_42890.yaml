answer: |-
  Yes, a single principle saves all six, though it reveals your categories are blurring into a single metric of relative epistemic competence: choose approval-direction when your ability to verify actions exceeds your ability to specify objectives and the agent cannot manipulate your verification, otherwise use goal-direction.

  Your tentative principle failed on Case 5 because it treated reversibility as a tie-breaker rather than a multiplier on specification error cost; when an action is irreversible and identity-linked, the cost of a specification error (the agent misunderstanding "legal safety") skyrockets, making approval-direction preferable even if the text generation itself is easy to specify. It also failed on Case 6 because "outmodeling" is too broad; the critical threshold is not general capability but specifically the ability to model your psychology well enough to decouple your approval signal from your actual welfare (wireheading you via approval). Cases 1 and 3 shift to goal-direction not because specification is perfect, but because the cost of human oversight (time delay, attention bandwidth) exceeds the expected cost of specification error within safe bounds.

  The real story is that you are tracking **Epistemic Advantage**: do you know *what* you want better than you can recognize *if you got it* (Goal), or do you recognize *if it's right* better than you can define *what right is* (Approval)? In the tutoring case, your verdict should be approval-directed on curriculum milestones but goal-directed on daily drills; you cannot specify "good education" crisply, but you can evaluate "this lesson plan looks engaging," and the agent cannot easily manipulate your judgment of your own child's engagement without your notice. In the salary negotiation case, verdict is approval-directed on the final offer but goal-directed on strategy; "maximize salary without burning bridges" is a fragile spec prone to Goodharting (burning bridges silently), but you can instantly evaluate a final contract, and the stakes of irreversibility demand your sign-off.

  Your intuition about categories blurring is correct; "approval" at the action level versus "goal" at the outcome level is just a question of granularity. The surviving principle predicts you will switch modes dynamically within a single agent's operation: goal-direction for high-frequency, low-stakes, or crisply bounded sub-tasks, and approval-direction for low-frequency, high-stakes, or identity-linked checkpoints. The only verdict that requires no patching is Case 6, which stands as the hard boundary where approval-direction collapses because the epistemic advantage flips; once the agent knows your mind better than you do, you cannot verify actions, only outcomes, forcing a revert to goal-direction with extreme constraints or shutdown.
