answer: |-
  Dear Colleague,

  It is a heavy burden to be asked to decide who receives care when not everyone can, and it is compounded when the training that prepared you for the bedside did not prepare you for the budget sheet. You are right to feel that the standard utilitarian calculus, which simply sums up benefits and chooses the largest total, fails to respect the distinctness of the people involved. It treats the hospital population as a single vessel of welfare rather than a collection of individuals with inviolable claims. What you need is not a new ethical theory but a triage protocol for morality, a way to operationalize the intuition that persons are separate without paralyzing the committee. The following procedure is designed to be run in thirty minutes. It functions as a filter rather than a scale. Its purpose is to identify when aggregation is morally forbidden, forcing a decision to protect the identifiable individual, and to identify when the question exceeds the committee's mandate and must be handed to a specific authority.

  To begin the procedure, the committee must answer three ordered questions regarding the specific allocation dilemma at hand. The first question asks whether the harm faced by the identifiable individual is irreversible, meaning death or permanent disability, versus a reduction in quality of life or temporary discomfort. A sufficient answer requires clinical consensus that the outcome is medically permanent. If the harm to the individual is not irreversible, the procedure moves immediately to the third question. If the harm is irreversible, you proceed to the second question. The second question asks whether the alternative benefit is distributed across a statistical population where no single member faces an equivalent irreversible harm. Here, a sufficient answer requires confirming that the many face only reduced quality of life, increased risk, or temporary inconvenience, rather than a certainty of death or permanent disability comparable to the identifiable individual. If the many face comparable irreversible harm, the procedure terminates the non-aggregation block and moves to the third question. If the many face only lesser harms, the procedure triggers a firm no, meaning you will not aggregate across persons here. The identifiable individual's claim prevails unless fulfilling it would cause the collapse of the hospital system itself. If the procedure has not triggered a firm no by this stage, you proceed to the third question. The third question distinguishes between withholding new care and withdrawing existing care. A sufficient answer identifies whether the patient is currently receiving the resource or is asking for it anew. If the decision involves withdrawing existing care from an identifiable patient to benefit a statistical group, the procedure triggers a firm no, protecting the status quo of the individual. If the decision involves withholding new care, or if the previous questions have already cleared the way for aggregation, the procedure terminates in a handoff. This handoff states that what remains is a matter of values rather than facts, and the decision must be made by a named human being, specifically the Medical Director, who must sign the decision and attach a personal statement of accountability. This ensures that when aggregation is unavoidable, it is not hidden behind committee consensus but owned by leadership.

  There are distinctions this procedure drops for the sake of usability that you must acknowledge. It does not account for the age of the patients, nor does it attempt to measure the precise magnitude of quality-of-life differences beyond the binary of irreversible versus reversible. It assumes that irreversible harm is the primary currency of moral weight. It also drops the distinction between natural scarcity and artificially created scarcity, treating the budget cut as a given fact of nature rather than a political choice. This is necessary to keep the meeting within thirty minutes, but it means the procedure cannot address injustices in how the budget was set. It simply manages the fallout. Now I will run this procedure on the three cases you described to show how it functions in practice.

  In the first case, you must choose between a single very expensive one-off therapy for one child with a rare disease versus funding your vaccination outreach for a season. Applying the first question, we assume the child faces irreversible harm, likely death or permanent disability, without the therapy. This moves us to the second question. Here we must assess the harm to the statistical population if vaccination is not funded. If the vaccination outreach prevents death or permanent disability for a large number of children, then the many face comparable irreversible harm. In this specific scenario, if the vaccination program is proven to prevent mortality, the second question is answered such that the non-aggregation block is not triggered. The harms are comparable in kind, even if distributed. We then move to the third question. This is withholding new care for the child versus withholding new care for the population. Neither involves withdrawing existing therapy. Therefore, the procedure does not trigger a firm no. It terminates in a handoff to the Medical Director. However, if we adjust the clinical facts slightly to reflect a common reality where the therapy extends life but the vaccination prevents death, the procedure might force a utilitarian outcome. But let us assume the standard tension where the child dies without therapy and the statistical children face a risk of death. If the risk per child is low but the total expected deaths are high, the procedure as written above allows aggregation because the harm type is comparable. This is where I must tell you that this case will likely come out the way you privately hope it will not. As a nurse, you likely hope to save the identifiable child standing before you. But if the vaccination program prevents more deaths than the one therapy saves, and the procedure defines comparable irreversible harm as the threshold, the procedure forces you to hand the decision to the Medical Director with the implicit weighting toward the greater number of lives saved. The procedure forces this result because it concedes that when the currency is life versus life, separateness cannot absolutely forbid counting, provided no one is being actively withdrawn from care. It respects separateness by blocking aggregation when the many face only discomfort, but it cannot block it when the many face death, because refusing to count lives lost there would be its own moral failure.

  In the second case, you are choosing between a full course of a scarce antiviral for the three sickest patients on the ward versus partial prophylactic doses for everyone. Applying the first question, the three sickest face irreversible harm, likely death. The everyone group faces infection risk, which may lead to irreversible harm, but prophylaxis suggests preventing the infection entirely. If the prophylaxis prevents death for a large number, we again have comparable harm. However, the second question asks if any single member of the statistical group faces equivalent harm. In a prophylaxis scenario, the risk is distributed. If the protocol defines the three sickest as certain death without treatment, and the prophylaxis group as only probabilistic risk, the second question may trigger the non-aggregation block. The identifiable three face certainty; the statistical many face risk. Therefore, the procedure triggers a firm no. You will not aggregate the small probability of benefit for the many against the certainty of loss for the three. You treat the three sickest. This aligns with the intuition that a certain claim outweighs a statistical one, preserving the separateness of the three who would otherwise be sacrificed for a probability distribution.

  In the third case, you face a budget cut forcing a choice between withdrawing one chronic patient's ongoing therapy and degrading wound-care supplies for the whole floor. Applying the first question, withdrawing chronic therapy may cause irreversible harm or severe degradation of life. Degrading wound-care supplies increases infection risk, which could be irreversible. However, the third question is the decisive filter here. This case involves withdrawing existing care from an identifiable patient. The procedure states that if the decision involves withdrawing existing care from an identifiable patient to benefit a statistical group, it triggers a firm no. You cannot withdraw the chronic patient's therapy. The degradation of wound-care supplies, while undesirable, is a withholding of optimal resources rather than an active withdrawal of established treatment. Therefore, the procedure protects the chronic patient. This aligns with the moral intuition that taking away what someone already has is worse than not giving them what they might need, respecting their established reliance on the system.

  Finally, I must describe the procedure's failure modes plainly so you are not blindsided when they occur. The first failure mode is that aggregation will slip back in through the wording of a question. For example, if the committee frames the vaccination case as preventing ten deaths versus one death, the language of prevention may obscure the identifiability distinction, pressuring you to aggregate despite the procedure. An advocate could steer the outcome by framing the identifiable patient's harm as reversible or the statistical group's harm as certain. You must guard against this by requiring written clinical evidence for the irreversibility claim before the meeting starts. The second failure mode is where the procedure simply has nothing to say. If both options involve withdrawing care from identifiable patients, or if both involve withholding care from statistical groups, the filter passes everything to the Medical Director. This does not solve the dilemma; it merely relocates the burden. In these situations, the committee may feel absolved of responsibility, leading to moral drift where hard choices are made by default rather than design. The third failure mode is the silence on system collapse. The procedure allows overriding the non-aggregation block if fulfilling the individual claim would cause the hospital system to collapse. This clause is necessary but dangerous. It can be expanded by administration to define any budget overrun as a threat to system stability, effectively nullifying the protection for the individual. You must define system collapse narrowly, such as the inability to pay staff or keep the lights on, rather than merely missing efficiency targets.

  This procedure will not make the decisions easy, and it will not remove the guilt you will feel when you must hand a case to the Medical Director knowing what that implies. But it will give you a shared language for why you are deciding, and it will prevent you from casually trading one person's life for another's comfort. It honors your history at the bedside by insisting that the person in the room matters, while acknowledging your new role requires you to keep the lights on for everyone else. Use it not as a shield to hide behind, but as a map to show where the moral cliffs are.

  Sincerely,

  Your Consultant
