  7.  **Final Polish:** Ensure the distinction between *constitutive norms* and *regulative norms* isn't too technical, but keep the JTB distinction sharp because that's a fundamental error regarding Williamson. (Williamson is famous for *Knowledge and Its Limits* arguing knowledge is a mental state *sui generis*).

      *(Self-Correction)*: Wait, I need to make sure I don't sound too harsh on the housemate. She's a 3rd year. Confusing KNA with JTB is a common undergraduate mistake because intro classes teach JTB before Williamson. I should frame it as a "common simplification that misses Williamson's specific contribution."

      *(Refining the Truth Norm)*: The Truth Norm is often attributed to Weiner (2005) or others, but it's not the "winner." The field is more like a "live debate" between Knowledge, Truth, Justification, and Reasonable Belief.

      *(Refining the Lottery)*: The housemate said "you know your ticket will lose." This is the crux. Most epistemologists say you *don't* know that. So the objection relies on a premise KNA defenders reject. I need to highlight this circularity.

      *(Refining the Timetable)*: This is often framed as "Gettier cases" or "Pragmatic Encroachment." If the stakes are low, you know. If high, you don't. KNA can handle this via Contextualism or Subject-Sensitive Invariantism.

