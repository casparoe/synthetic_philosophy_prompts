answer: |-
  This is a great request. It is very common for philosophy students to absorb the "shape" of a debate before mastering the technical contours, and your housemate's summary captures the *narrative* of the literature while stumbling on several crucial technical details. Specifically, she has conflated Williamson's specific contribution with traditional epistemology and declared a verdict on the debate that hasn't actually been reached.

  Here is a claim-by-claim audit, followed by answers to your specific questions and a corrected summary.

  ### Claim-by-Claim Audit

  **1. "The dominant view, going back to Timothy Williamson around 2000, is that the rule of assertion is that you may assert something only if you know it."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** This is correct. Timothy Williamson's *Knowledge and Its Limits* (2000) is the canonical source for the Knowledge Norm of Assertion (KNA). It is arguably the "default" view in contemporary epistemology, though "dominant" is slightly strong; it is the view to beat.

  **2. "Since knowledge is justified true belief, the rule really comes to saying you should only assert what you're justified in believing — Williamson just puts it in terms of knowledge."**
  *   **Verdict:** **Genuine Misrepresentation.**
  *   **Comment:** This is the most significant error in her summary. Williamson explicitly argues *against* the idea that knowledge is Justified True Belief (JTB). He argues knowledge is a primitive, unanalyzable mental state. Collapsing the Knowledge Norm into a Justification Norm misses Williamson's entire point. A defender of the Knowledge Norm would reject this equivalence, as there are cases of justified belief that fall short of knowledge (like Gettier cases) where assertion seems improper.

  **3. "The view nicely explains why 'how do you know?' is always an appropriate challenge to an assertion..."**
  *   **Verdict:** **Accurate.**
  *   **Comment:** This is Williamson's "proper challenge" argument. If you assert *p*, and I ask "How do you know?", you cannot properly reply "I don't know." This is widely accepted as a strong point in favor of the Knowledge Norm.

  **4. "...and why Moore's paradox arises: saying 'it's raining, but I don't believe it's raining' is absurd, which the knowledge rule supposedly accounts for."**
  *   **Verdict:** **Simplification.**
  *   **Comment:** She cites the *belief* version of Moore's paradox. While the Knowledge Norm explains this, it is specifically designed to explain the *epistemic* version: "It is raining, but I don't *know* it is raining." The Knowledge Norm explains why asserting this is absurd (you are asserting something while simultaneously admitting you violate the norm of assertion). Her version works, but it blunts the specific argument for *Knowledge* over *Belief*.

  **5. "But the view was pretty much refuted by the lottery problem: in a fair lottery with a million tickets, you know your ticket will lose..."**
  *   **Verdict:** **Genuine Misrepresentation (of the dialectic).**
  *   **Comment:** She presents this as a refutation, but it is merely an objection that depends on a premise Williamson rejects. Williamson (and other KNA defenders) argue that you do *not* know your ticket will lose, precisely because the probability is not high enough. They say the intuition that you can't assert "your ticket will lose" is correct, and the explanation is that you don't *know* it. She is assuming the "Lottery Proposition" is known to generate a contradiction; KNA defenders deny it is known.

  **6. "...whereas it seems fine to assert things you don't know in everyday cases, like telling someone a train leaves at 6:10 based on a timetable that's occasionally wrong."**
  *   **Verdict:** **Standard Objection (not a refutation).**
  *   **Comment:** This is a standard counterexample (often associated with Jennifer Lackey or Jason Stanley). However, KNA defenders have responses. They might argue that in low-stakes contexts, you *do* know (Contextualism), or that the assertion is technically improper but excusable. It pressures the view, but does not refute it.

  **7. "So most people now accept the truth rule instead: assert only what is true."**
  *   **Verdict:** **Genuine Misrepresentation.**
  *   **Comment:** This is factually incorrect regarding the state of the field. The Truth Norm is a competitor, but it is not the consensus winner. Many epistemologists find the Truth Norm too weak (it permits lucky guesses: if you guess true, you followed the rule, which seems wrong). The field is currently fragmented between Knowledge, Truth, Justification, and Reasonable Credence norms.

  ---

  ### Addressing Your Specific Questions

  **Is the step from "assert only what you know" to "assert only what you're justified in believing" innocent?**
  No. It fundamentally changes the theory. If the norm were Justification, you could properly assert Gettier cases (where you have justification and truth, but no knowledge). Williamson argues you cannot properly assert Gettier cases. By equating Knowledge with Justified True Belief, she removes the specific explanatory power Williamson claims for the Knowledge Norm. It turns a distinctive thesis into a traditional one.

  **Does the Moore's paradox point work the way she described?**
  Only partially. The version she cited ("P, but I don't believe P") is the *omissive* Moore paradox. The Knowledge Norm is better suited to explain the *commissive* Moore paradox ("P, but I don't *know* P"). If the norm of assertion is knowledge, asserting "P" represents you as knowing P. Adding "but I don't know P" creates a pragmatic contradiction. Her version is compatible with a simpler "Belief Norm," so citing it doesn't specifically support the *Knowledge* Norm as strongly as she implies.

  **Are the lottery and timetable cases standard objections or knockdown refutations?**
  They are standard objections, not refutations. In philosophy, "refutation" is a heavy word. The Lottery Case is the biggest challenge to the Knowledge Norm, but KNA defenders have a standard reply: "Statistical evidence alone does not yield knowledge." The Timetable Case is a challenge regarding "fallible knowledge," but KNA defenders reply that fallible sources can still yield knowledge in low-stakes environments. Neither kills the view; they just force it to become more nuanced.

  **Does her conclusion (that the Truth Rule is what "most people" accept) follow?**
  No. It is a non-sequitur based on her claim that the Knowledge Norm was "refuted." Since the Knowledge Norm was not refuted (only challenged), and since the Truth Norm has its own severe problems (the "lucky guess" problem), there is no consensus. The field is in a state of active, lively disagreement.

  ---

  ### The "Dinner Party" Paragraph

  Here is a fair, one-paragraph summary you can use. It corrects her errors without being pedantic, acknowledging her grasp of the big picture while fixing the technical details.

  > "So, the view you're describing is the Knowledge Norm of Assertion, championed by Timothy Williamson. He argues that you should only assert what you know, which explains why 'How do you know?' is the standard challenge to an assertion. The big debate isn't really about whether knowledge is justified true belief—Williamson actually argues it's not—but rather about whether knowledge is too strict a rule. Critics use the 'lottery case' to argue we can't assert things based on mere odds, while Williamson replies that we don't actually *know* those things either. While some philosophers prefer a simpler 'Truth Norm,' it hasn't replaced the Knowledge Norm as the consensus; the field is still very much divided on whether knowledge, truth, or justification is the real rule of assertion."

  **Why this works:**
  1.  It validates her identification of Williamson and the "How do you know?" argument.
  2.  It gently corrects the JTB error ("Williamson actually argues it's not").
  3.  It clarifies the Lottery objection (it's a debate about what counts as knowledge, not a refutation of the norm).
  4.  It corrects the consensus claim ("still very much divided").
