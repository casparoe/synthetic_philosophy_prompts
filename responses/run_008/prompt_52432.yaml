      *Setup:*
      Materials: 8 printed payoff sheets, 8 six-sided dice, 100 tokens (chocolate coins work well).
      Payoffs (Player 1 / Player 2):
      Node 1 (P1): Take (10, 5) | Pass
      Node 2 (P2): Take (6, 12) | Pass
      Node 3 (P1): Take (14, 7) | Pass
      Node 4 (P2): Take (8, 16) | Pass
      Node 5 (P1): Take (18, 9) | Pass
      Node 6 (P2): Take (10, 20) | Pass → (15, 15) auto-end.
      Backward induction dictates Player 1 takes at Node 1. Pairs sit facing each other. One sheet per pair. Tokens distributed by instructor upon decision.

      *Round 1:*
      Students form 8 pairs. Designate Player 1 (starts) and Player 2. Game proceeds sequentially. At your node, announce "Take" or "Pass" publicly. If "Take," game ends; collect tokens per sheet. If "Pass," turn passes to partner. If Node 6 is passed, auto-end payoffs apply. No talking during play. Record final node and payoffs on the board. Goal: Maximize your own tokens. Instructor verifies claims. Play continues until all 8 pairs finish. Results are aggregated for class view. Emphasize that tokens correlate to course credit or tangible rewards to ensure stakes feel real, even if symbolic. Silence is enforced to prevent collusion.

      *Round 2:*
      Two changes. First, class reads a scripted paragraph aloud: "If both players are rational and know the other is rational, Player 2 takes at Node 6. Knowing this, Player 1 takes at Node 5... therefore Player 1 takes at Node 1." This makes the logic salient. Second, introduce exogenous risk. Before any decision, roll a d6. On a 1, the game ends immediately; current pot splits 50/50. On 2-6, play proceeds normally. This removes the certain final node required to anchor backward induction. If the game ends randomly, the logical chain breaks because the final node is no longer guaranteed. Play proceeds as Round 1. Record results to compare shifts in behavior against the read-aloud rationality claim and the structural uncertainty.

      *Running Order:*
      0-10: Intro & Grouping.
      10-30: Round 1 Play & Recording.
      30-45: Interim Debrief (Observations vs. Theory).
      45-55: Round 2 Setup & Script Reading.
      55-75: Round 2 Play & Recording.
      75-90: Final Debrief & Conclusion.

      *Debrief:*
      Start by contrasting the BI prediction (Node 1 take) with Round 1 data (likely Node 4-6). Ask: Does this falsify rational choice theory? No, it falsifies the *assumptions*. Students likely doubted partners' rationality or cared about fairness. Round 2 tests this. Did reading the script shift takes earlier? If yes, it highlights the role of common knowledge: knowing the logic isn't enough; knowing *others* know it matters. Did the die roll change behavior? It removes the logical anchor. Without a certain end, BI cannot start. This illuminates the fragility of the argument: it relies on counterfactual reasoning about nodes that never occur. We reason about Node 6 to justify Node 1. If students pass at Node 1, they implicitly reject the counterfactual claim that "Node 6 would be a take." The game forces them to inhabit the tension between logical necessity (if assumptions hold) and psychological reality (trust, uncertainty, altruism). The puzzle isn't that people cooperate; it's that cooperation requires rejecting the common knowledge of rationality.

      *What will go wrong:*
      1. Collusion: Students agree to pass always. Handle: Enforce strict silence during play; invalidate rounds where talking is heard.
      2. The "Rational" Pariah: A student taking at Node 1 feels socially punished. Handle: Validate their choice in debrief as theoretically correct given assumptions.
      3. Payoff Confusion: Students miscalculate. Handle: Walk around during Round 1 to verify understanding before stakes rise.
      4. Die Mechanic Confusion: Unclear when to roll. Handle: Demonstrate once before Round 2 starts.

      *What the game can't reproduce:*
      True common knowledge. In class, I can say "everyone is rational," but students won't truly believe everyone else believes it. Also, the game is finite; real-world interactions often feel infinite, allowing reputation building. Finally, the game cannot simulate the logical *necessity* of BI, only the behavioral output. You must verbally explain that BI is a consistency check, not a psychological model.

