  # Seminar Activity: The Isolation Game

  **Objective:** Demonstrate the tension between Expected Utility (EU) theory as a definition of rationality versus a substantive commitment, specifically highlighting how framing (sequential vs. one-shot) induces preference reversals that violate the Sure-Thing Principle (STP) unless one adopts a Risk-Weighted Expected Utility (RWEU) framework.

  **Class Size:** 22 Students
  **Time:** 75 Minutes
  **Materials:** 
  *   22 "Player Sheets" (half-sheet paper with ID code, Phase 1 choice, Phase 2 choice).
  *   1 Coin (for public demonstration).
  *   Tokens (poker chips or colored slips) redeemable for candy (1 Token = 1 Kiss/M&M).
  *   Bowl for random draw.

  ---

  ## 1. The Bets and Payoffs

  The core of the activity relies on two mathematically equivalent decision problems presented in different frames. In both cases, the Expected Value (EV) is identical, rendering a linear-utility EU maximizer **indifferent**.

  **The Currency:** Tokens (redeemable for candy at the end). Assume linear utility for small numbers of candies.

  ### Phase 1: The Sequential Frame (The "Two-Stage" Game)
  *   **Stage 1:** A public coin flip (or random draw) determines if you proceed.
      *   75% Chance: Game Over (0 Tokens).
      *   25% Chance: Advance to Stage 2.
  *   **Stage 2 (Only if Advanced):** You must choose between:
      *   **Option S (Safe):** 100% chance of **4 Tokens**.
      *   **Option R (Risky):** 80% chance of **5 Tokens**, 20% chance of 0 Tokens.
  *   **The Math:**
      *   **Option S Total:** $0.25 \times 4 = 1.0$ Token EV.
      *   **Option R Total:** $0.25 \times 0.80 \times 5 = 1.0$ Token EV.
      *   **At the Crucial Juncture (Stage 2):** You are choosing between 4 (sure) and 80% of 5 (EV = 4). **EU Maximizers are Indifferent.**

  ### Phase 2: The One-Shot Frame (The "Single" Game)
  *   **The Choice:** You choose immediately between:
      *   **Option A:** 25% chance of **4 Tokens**, 75% chance of 0.
      *   **Option B:** 20% chance of **5 Tokens**, 80% chance of 0.
  *   **The Math:**
      *   **Option A Total:** $0.25 \times 4 = 1.0$ Token EV.
      *   **Option B Total:** $0.20 \times 5 = 1.0$ Token EV.
      *   **EU Maximizers are Indifferent.**

  **The Equivalence:** Option S (Sequential) is mathematically identical to Option A (One-Shot). Option R (Sequential) is mathematically identical to Option B (One-Shot).

  ---

  ## 2. Session Timeline (75 Minutes)

  ### 0:00 – 0:10: Setup & Instructions
  *   Distribute Player Sheets. Ask students to create a **Private ID Code** (e.g., Mother's Birth Month + Day of Month). Emphasize anonymity but the need to match Phase 1 and Phase 2 later.
  *   **Incentive Compatibility:** Explain that *only one* of the two phases will count for payout. At the end of class, a public coin flip will determine whether Phase 1 or Phase 2 pays. This ensures they treat every choice as if it were the only one that matters.
  *   **Rule:** "More tokens = more candy. You must circle a choice in each phase. Indifference is not an option for the record; you must commit."

  ### 0:10 – 0:30: Phase 1 (Sequential)
  *   Walk through the Stage 1/Stage 2 structure visually on the board.
  *   **Crucial Script:** "Imagine you have already passed Stage 1. You are sitting at Stage 2. The 75% risk is behind you. Now, choose S or R."
  *   Collect Phase 1 choices (folded). Do not reveal results yet.

  ### 0:30 – 0:50: Phase 2 (One-Shot)
  *   Distribute the same sheets back (or a second section).
  *   **Crucial Script:** "Forget the previous game. This is a new, independent decision. Choose A or B."
  *   Collect sheets.

  ### 0:50 – 1:00: Payout Resolution
  *   **Public Randomization:** Flip a coin. Heads = Phase 1 pays; Tails = Phase 2 pays.
  *   **Execution:** 
      *   If Phase 1: Flip for Stage 1 (75% survival). For survivors, execute their Stage 2 choice.
      *   If Phase 2: Execute their One-Shot choice directly.
  *   Distribute candy immediately. This builds trust for the debrief.

  ### 1:00 – 1:15: Data Reveal & Debrief
  *   Project the aggregated data (tally marks on board).
  *   Reveal the theory names (STP, RWEU, Isolation Effect).
  *   Conduct the "Gap" analysis (see below).

  ---

  ## 3. Logging and Displaying the Pattern

  You need to visualize two things: the **Aggregate Shift** (Framing Effect) and the **Individual Inconsistency** (STP Violation).

  **On the Board:**
  Draw a 2x2 table.
  *   **Rows:** Phase 1 Choice (Safe vs. Risky).
  *   **Columns:** Phase 2 Choice (Safe vs. Risky).
  *   **Cells:** Count of students (using ID codes to match).

  | | Phase 2: Safe (A) | Phase 2: Risky (B) |
  | :--- | :---: | :---: |
  | **Phase 1: Safe (S)** | *Consistent (Risk Averse)* | **Violators (Framing Effect)** |
  | **Phase 1: Risky (R)** | **Violators (Framing Effect)** | *Consistent (Risk Seeking)* |

  **The Expected Pattern:**
  *   **Phase 1 (Sequential):** Majority will choose **Safe (S)**. *Why?* At Stage 2, the choice feels like "4 for sure" vs. "80% of 5". The certainty of 4 is psychologically heavy.
  *   **Phase 2 (One-Shot):** Majority will choose **Risky (B)** (or split more evenly). *Why?* The difference between 25% and 20% feels negligible compared to the gain from 4 to 5 tokens.
  *   **Result:** A significant cluster in the **Safe/Risky** cell (Safe in Sequential, Risky in One-Shot).

  ---

  ## 4. The Debrief: Mapping Moments to Theory

  **Step 1: The Indifference Point (EU Defense)**
  *   *Ask:* "For those who chose Safe in Phase 1 and Risky in Phase 2, did you make a math error?"
  *   *Point:* No. The EV was 1.0 in all cases. An EU maximizer with linear utility is *permitted* to be indifferent. If they are indifferent, they can flip a coin.
  *   *The Catch:* If everyone were an EU maximizer flipping coins, the class distribution would be random noise (25% in each cell). If we see a systematic cluster in the "Violator" cell, it is not error; it is a **preference**.

  **Step 2: The Sure-Thing Principle Violation**
  *   *Definition:* STP implies that if you prefer S over R when a common event (Stage 1 survival) occurs, you should prefer the compound gamble of S over R when that common event is probabilistic.
  *   *The Violation:* By choosing S in Phase 1, you revealed a preference for the distribution (25% of 4). By choosing B in Phase 2, you revealed a preference for (20% of 5). These are mutually exclusive preferences for the same mathematical objects.
  *   *The Cause:* You treated the 75% failure rate in Phase 1 as "sunk" or "screened off" once you reached Stage 2. You isolated the second stage. EU theory forbids this; probabilities must be multiplied, not ignored.

  **Step 3: Introducing Risk-Weighted Expected Utility (RWEU)**
  *   *The Save:* This isn't "irrationality"; it's a different model. RWEU (Buchak) adds a risk-weighting function $r(p)$.
  *   *Explanation:* In Phase 2, the drop from 25% to 20% might be weighted heavily (making them look similar). In Phase 1 (Stage 2), the drop from 100% to 80% is weighted differently.
  *   *Coherence:* A RWEU agent can consistently hold these preferences *if* their risk function accounts for the framing of probabilities. However, standard RWEU still demands invariance. To fully save the agent, we must admit that **framing changes the risk function**. This moves us from RWEU to Prospect Theory (editing phase).

  ---

  ## 5. Troubleshooting: What Will Go Wrong

  **1. The "Gaming" Problem**
  *   *Issue:* Students realize EV is equal and try to "hedge" by choosing different options to ensure they win something regardless of the coin flip.
  *   *Fix:* Reinforce the **Single Payout Rule**. "Only one phase counts. If you hedge, you are optimizing for a game we are not playing." If they still hedge, exclude their data from the "Individual Inconsistency" count but keep them in the Aggregate count (as they still reveal framing susceptibility).

  **2. The "Confusion" Indifference**
  *   *Issue:* Students choose randomly because they don't understand the probabilities, not because they are EU indifferent.
  *   *Fix:* Walk through the EV calculation on the board *after* choices are made but *before* the debrief. "Look, 0.25 * 4 is 1. 0.20 * 5 is 1. You weren't tricked by math." This isolates the preference from calculation error.

  **3. The "Linear Utility" Assumption**
  *   *Issue:* A student argues, "I prefer 4 sure because the 5th candy is worth less to me (diminishing marginal utility)."
  *   *Fix:* Acknowledge this. "If your utility function is concave, EU predicts you choose Safe in *both*. If you chose Risky in Phase 2, diminishing utility cannot explain it. You switched."

  ---

  ## 6. Limitations: The Aggregation Gap

  **The Honest Admission:**
  "You might notice I am drawing conclusions about *individual rationality* from *classroom aggregates*. This is a gap. RWEU is a theory about a single agent's coherent risk attitude. My evidence is 22 different agents."

  **Why the Gap Exists:**
  1.  **Heterogeneity:** The class shift could mean every student shifted slightly, OR that 50% of students are rigid EU maximizers and 50% are rigid Risk-Weighters, and the framing just sorted them differently.
  2.  **Noise:** With only 22 students, a 70/30 split could statistically be noise (though unlikely given the EV indifference).

  **How the Game Narrows It:**
  *   **ID Tracking:** By matching Phase 1 and Phase 2 via ID codes, we look for *within-subject* reversals. If *you* switched, the aggregate gap doesn't matter for *you*.
  *   **The Indifference Constraint:** Because EU agents *should* be random (50/50), any systematic deviation in the aggregate implies a systematic psychological force (Risk Weighting) acting on the majority.

  **Closing the Gap in Debrief:**
  "To close this gap completely, we would need to test *you* individually across 50 trials to map your personal risk function $r(p)$. Today, we used the class as a proxy for the mind. The systematic shift suggests that the 'Isolation Effect' is a robust feature of human choice, not just classroom noise. It tells us that if we want to model *you* accurately, we cannot use standard EU; we must use a model that allows risk attitudes to shift with description."

  ---

  ## 7. Instructor's Cheat Sheet (For the Board)

  **Phase 1 (Sequential)**
  *   75% $\to$ 0
  *   25% $\to$ **Choice:**
      *   (S) 100% of 4
      *   (R) 80% of 5

  **Phase 2 (One-Shot)**
  *   **Choice:**
      *   (A) 25% of 4
      *   (B) 20% of 5

  **The Reveal:**
  *   S = A
  *   R = B
  *   **EU Prediction:** Indifferent $\to$ Random Choice.
  *   **Observed:** Systematic Reversal.
  *   **Theory:** Violation of Invariance / STP.
  *   **Solution:** Risk-Weighted Utility (or Prospect Theory).
