  In One-Shot: "It's 50% of 4 vs 25% of 8."
  *Is there a preference reversal?*
  Often, people are *more* risk-averse when the probability is lower (25% feels worse than 50%).
  So they might choose Safe in Sequential (50% chance to win 8 feels okay? No, 4 is sure).
  Actually, the classic Isolation Effect (Tversky & Kahneman 1981, Problem 10 & 11) uses:
  1. 25% to win 3000 vs 20% to win 4000. (Most pick 25%/3000).
  2. Two stage: 75% end game, 25% win 3000 vs 20% win 4000. (Most pick 20%/4000).
  *Why?* In the two-stage, they ignore the first 75% (common). They compare 100% of 3000 vs 80% of 4000.
  *I need to replicate THIS structure.*
  My previous design (50% reach node) makes the conditional probabilities 100% vs 50%.
  Let's adjust to match the Tversky & Kahneman structure for a stronger effect.
  **Revised Payoffs:**
  **Sequential:**
  Stage 1: 75% chance Game Over (0). 25% chance Advance.
  Stage 2 (if Advance):
  Option S: 100% chance of 4 tokens.
  Option R: 80% chance of 5 tokens, 20% chance 0.
  *Total Probabilities:*
  Option S Total: 25% * 100% = 25% chance of 4.
  Option R Total: 25% * 80% = 20% chance of 5.
  *EV:*
  S: 0.25 * 4 = 1.
  R: 0.20 * 5 = 1.
  *EU Indifferent.*
  **One-Shot:**
  Option A: 25% chance of 4 tokens.
  Option B: 20% chance of 5 tokens.
  *EV:* Both 1.
  *The Effect:*
  In One-Shot: People often prefer A (25% of 4) over B (20% of 5). (Risk aversion / probability weighting).
  In Sequential: At Stage 2, they see 100% of 4 vs 80% of 5. The 75% chance of failure is "sunk." They often prefer B (80% of 5) over A (100% of 4) because 80% feels close to 100%, and 5 > 4.
  *Wait, 100% of 4 is usually very attractive.*
  Let's look at the original Tversky & Kahneman numbers.
  Problem 10: (0.25, 3000) vs (0.20, 4000). 42% vs 58%. (Prefer Riskier).
  Problem 11: Two stage. 0.75 stop, 0.25 play. Choices: (1.00, 3000) vs (0.80, 4000). 74% vs 26%. (Prefer Safer).
  *Wait, in T&K, they prefer the Riskier in One-Shot, but Safer in Sequential.*
  Why? In One-Shot, the difference between 20% and 25% is weighted heavily. In Sequential, the difference between 80% and 100% is weighted differently.
  *Okay, I will use these numbers adapted for candy.*
  Tokens: 4 and 5 are too close. Let's use 10 and 12? Or 4 and 6?
  Let's stick to the EV = 1 constraint.
  Option S: 25% of 4. (EV 1).
  Option R: 20% of 5. (EV 1).
  *Sequential:* 75% Stop. 25% Play. At Play: 100% of 4 vs 80% of 5.
  *One-Shot:* 25% of 4 vs 20% of 5.
  *Prediction:*
  One-Shot: Students might favor the 25% chance (higher prob) over 20% even if payoff is lower? Or favor the higher payoff?
  Actually, the Allais/Common Ratio effect suggests people switch from Risk Averse to Risk Seeking as probabilities drop.
  But the Isolation Effect specifically predicts a *reversal* based on the framing of the common 75%.
  *Okay, I will use this structure.* It is the canonical example of "Sequential vs One-Shot" framing violating invariance.

  *Wait, one constraint check:* "Structure the game so that a committed expected-utility maximizer is exactly indifferent at the crucial juncture."
  In Sequential Stage 2, the choice is 100% of 4 vs 80% of 5.
  EV: 4 vs 4.
  *Yes, EU maximizer is indifferent here.*
  In One-Shot, choice is 25% of 4 vs 20% of 5.
  EV: 1 vs 1.
  *Yes, EU maximizer is indifferent here.*
  *Perfect.* This satisfies the constraint perfectly.

