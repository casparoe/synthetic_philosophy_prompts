  Dear Friend,

  Having reviewed your aunt's history of rulings on the citizens' commission, I can offer a prediction for the three hard cases coming before her next month, followed by an analysis of the principles that seem to guide her reasoning. Based on her track record, I anticipate she will deny voting rights to all three petitioners. The absentee billionaire will likely be rejected because, despite his significant economic stake in the city's zoning, his situation mirrors that of the commuters who use city services daily but live outside the boundaries; her past decisions suggest that economic impact or property ownership alone does not confer membership if one does not reside within the community. The fifteen-year-old will almost certainly be denied, as the commission has already established a bright-line age barrier by excluding sixteen-year-olds, indicating that legal capacity or adulthood is a prerequisite that overrides even a compelling future stake in long-term climate decisions. The farmworker presents the most nuanced challenge, but given that seasonal visitors are excluded and his intent is to retire abroad rather than remain, he lacks the enduring commitment shown by the thirty-year permanent residents or the emigrated citizens who plan to return; his twenty years of seasonal labor will likely be viewed as transient presence rather than rooted membership.

  Reconstructing the logic behind these outcomes reveals at least two competing principles that could accommodate all her earlier rulings. The first is the Principle of Formal Thresholds, which posits that voting rights are granted only to those who meet specific, objective criteria such as citizenship, a thirty-year residency duration, or legal adulthood, treating these categories as rigid gates that exclude anyone falling short regardless of their actual connection to the city. The second is the Principle of Substantive Community Membership, which argues that voting belongs to those whose lives are fundamentally anchored in the city's social and political fabric, evidenced by long-term integration or a declared intent to maintain ties, while excluding those whose primary loyalty or future lies elsewhere. Both principles explain why commuters and tourists are excluded and why prisoners and long-term residents are included, but they diverge on how they interpret the boundaries of belonging.

  I would bet on the Principle of Substantive Community Membership as the one your aunt is truly tracking. The key evidence lies in her ruling regarding citizens who emigrated decades ago; she allowed them to vote only because they still plan to return someday. If she were following strict Formal Thresholds, citizenship alone would suffice regardless of intent, or physical absence would disqualify them regardless of intent. The fact that she considers their subjective intention to return suggests she is weighing the depth of their allegiance and connection to the community rather than just checking boxes on a form. She appears to be looking for where a person's life is truly centered, using time and status as proxies for that deeper social bond.

  To distinguish between these two principles, I would devise a case involving a non-citizen who has lived continuously in the city for twenty-nine years and declares an intention to stay permanently until death. Under the Principle of Formal Thresholds, this person must be denied the vote because they have not met the specific thirty-year duration requirement, treating the time limit as a hard rule. However, under the Principle of Substantive Community Membership, this person should be granted the vote because they have demonstrated the same rootedness, integration, and intent to remain as the thirty-year residents, making the one-year difference irrelevant to their actual status as a member of the community. How your aunt rules on such a case would reveal whether she serves the law as written or the community as lived.

  I hope this analysis helps you anticipate the commission's direction.

  Warmly,

  Your Friend
