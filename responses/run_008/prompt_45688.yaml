answer: |-
  **Exam Question: Decision Theory and Predictive Instability**

  **Time Allowed:** 60 Minutes
  **Total Marks:** 20

  **Scenario:**
  A merchant in Damascus encounters Death, who reveals she has an appointment with him tomorrow night. She is surprised to see him in Damascus because her appointment book says Aleppo. The merchant knows Death's forecast of his location is 90% reliable. That is, $P(\text{Death in } X \mid \text{Merchant in } X) = 0.9$. The merchant must decide whether to Stay in Damascus or Ride to Aleppo.
  *   **Utilities:** Survival = 10, Death = 0.
  *   **Cost:** Riding to Aleppo costs 1 utility unit (Survival in Aleppo = 9, Death in Aleppo = -1).
  *   **Prior:** Before deliberation, the merchant assigns a 50% credence to Death being in either city.

  **Questions:**
  1.  **Computation (8 marks):** Calculate the Expected Utility (EU) of Staying and Riding under (i) Evidential Decision Theory (EDT) and (ii) Causal Decision Theory (CDT). Show your arithmetic explicitly. State the initial recommendation of each theory.
  2.  **Diagnosis (6 marks):** Explain why the CDT recommendation is unstable in this setup. Specifically, describe how the agent's changing disposition during deliberation alters the credences used in the CDT calculation, creating a feedback loop.
  3.  **Evaluation (6 marks):** Assess two proposed solutions: (i) **Ratificationism** (acting only on policies stable under the knowledge that you will adopt them) and (ii) **Randomization** (flipping a coin to decide). In your assessment of randomization, explicitly analyze whether the solution holds if Death's 90% reliability extends to the outcome of the randomizing device versus only the agent's psychological disposition.

  ***

  **Model Answer**

  **1. Computation**
  Under **Evidential Decision Theory (EDT)**, the agent treats their choice as evidence of Death's location.
  *   **EU(Stay):** If the merchant stays, there is a 0.9 probability Death is in Damascus (Utility 0) and a 0.1 probability Death is in Aleppo (Utility 10).
      $$EU_{EDT}(\text{Stay}) = (0.9 \times 0) + (0.1 \times 10) = 1$$
  *   **EU(Ride):** If the merchant rides, there is a 0.9 probability Death is in Aleppo (Utility -1) and a 0.1 probability Death is in Damascus (Utility 9).
      $$EU_{EDT}(\text{Ride}) = (0.9 \times -1) + (0.1 \times 9) = 0$$
  *   **EDT Recommendation:** Stay ($1 > 0$).

  Under **Causal Decision Theory (CDT)**, the agent treats their choice as causally independent of Death's prior prediction. We use the prior credence (0.5) for the state of the world.
  *   **EU(Stay):** The choice to Stay does not cause Death to be in Damascus.
      $$EU_{CDT}(\text{Stay}) = (0.5 \times 0) + (0.5 \times 10) = 5$$
  *   **EU(Ride):** The choice to Ride does not cause Death to be in Aleppo.
      $$EU_{CDT}(\text{Ride}) = (0.5 \times -1) + (0.5 \times 9) = 4$$
  *   **CDT Recommendation:** Stay ($5 > 4$).

  Initially, both theories recommend Staying. However, they disagree fundamentally on the reasoning: EDT sees the act as diagnostic news; CDT sees it as a causal intervention on an independent state.

  **2. Diagnosis of Instability**
  The CDT recommendation is unstable because the credences required for the calculation shift as deliberation proceeds. CDT requires probabilities of states ($K$-partitions) independent of the act, but in this case, the state (Death's location) correlates with the agent's *disposition* to act. As the merchant leans toward Riding, their credence that "Death is in Aleppo" rises (because Death predicts the disposition). If the merchant becomes certain they will Ride, their credence that Death is in Aleppo should rise to 0.9.
  Recalculating CDT with this updated credence: $EU(\text{Ride}) = (0.9 \times -1) + (0.1 \times 9) = 0$. Meanwhile, $EU(\text{Stay})$ becomes $(0.9 \times 0) + (0.1 \times 10) = 1$. Suddenly, Staying looks better. But if the agent leans toward Staying, the credence shifts back to Death being in Damascus, lowering the EU of Staying. The agent oscillates; no pure strategy remains causally optimal once the agent knows their own intention.

  **3. Evaluation of Escape Routes**
  **Ratificationism:** This approach fails. A decision is ratifiable only if it remains optimal given the knowledge that you will make it. Here, knowing you will Stay makes Staying evidentially disastrous (EU drops to 1), and knowing you will Ride makes Riding disastrous (EU drops to 0). Neither act is ratifiable; the agent cannot find a stable equilibrium in pure strategies.

  **Randomization:** Flipping a coin offers a potential escape, but its success depends on the scope of Death's reliability.
  *   **Case A (Predicts Disposition):** If Death predicts based on psychological cues, a coin flip breaks the link. Death cannot predict the coin's physical outcome based on the merchant's mind. The merchant's credence in Death's location returns to the prior (0.5). The EU of the mixed strategy is the average of the CDT priors (4.5), which dominates the unstable pure strategies.
  *   **Case B (Predicts Outcome):** If Death's forecast covers the final location regardless of the method (perhaps she sees the future), randomization fails. If the coin lands Heads (Ride), Death is in Aleppo with 90% probability. The EU calculations revert to the EDT numbers (0 vs 1), and the merchant still dies. Randomization only works if it severs the evidential link between the decision process and the prediction.

  ***

  **Marking Scheme (20 Marks Total)**

  **1. Accurate EDT Computation (4 Marks)**
  *   **Requirement:** Correctly applies conditional probabilities ($0.9/0.1$) to utilities ($10/0$ and $9/-1$). Must show $EU(\text{Stay})=1$ and $EU(\text{Ride})=0$.
  *   **A-Grade Move:** Explicitly notes that EDT treats the act as evidence, justifying the use of the reliability statistic as a conditional probability.
  *   **Common Failure:** Using the 90% figure as a prior probability rather than a conditional, or ignoring the travel cost in the Ride calculation.

  **2. Accurate CDT Computation & Independence (4 Marks)**
  *   **Requirement:** Correctly uses the 50% prior for states, treating the act as causally independent. Must show $EU(\text{Stay})=5$ and $EU(\text{Ride})=4$.
  *   **A-Grade Move:** Explicitly states that CDT ignores the diagnostic value of the act for the initial calculation, distinguishing the *causal* structure from the *evidential* structure.
  *   **Common Failure:** "Smuggling" the 90% reliability into the CDT calculation immediately, effectively turning it into EDT.

  **3. Diagnosis of Deliberational Instability (4 Marks)**
  *   **Requirement:** Explains that as the agent's probability of choosing an act approaches 1, their credence in the corresponding state approaches 0.9, flipping the EU values.
  *   **A-Grade Move:** Identifies that the instability arises because the *input* credences for CDT are functions of the *output* decision, creating a feedback loop where no pure strategy is stable.
  *   **Common Failure:** Describing the loop vaguely as "changing your mind" without linking it to the shift in credence regarding Death's location.

  **4. Assessment of Ratificationism (4 Marks)**
  *   **Requirement:** Correctly concludes that neither act is ratifiable because learning one's own intention lowers the EU of that intention.
  *   **A-Grade Move:** Notes that this implies rationality might require a mixed strategy or that the case demonstrates a gap in standard decision theory's ability to guide action.
  *   **Common Failure:** Claiming Ratificationism solves the problem by simply selecting the "least bad" option, rather than recognizing the lack of a fixed point.

  **5. Assessment of Randomization & Prediction Scope (4 Marks)**
  *   **Requirement:** Distinguishes between Death predicting the *decision process* vs. the *physical outcome*.
  *   **A-Grade Move:** Argues that randomization is only effective if it breaks the evidential correlation (Case A). If Death predicts the outcome (Case B), randomization yields the same poor expected utility as deliberate choice.
  *   **Common Failure:** Asserting that randomization automatically solves Newcomb-like problems without qualifying the predictor's capabilities regarding random devices.

  **Differentiation Note:**
  *   **B Answer (12-15 marks):** Performs arithmetic correctly and identifies the instability loop but treats the escape routes superficially (e.g., "Randomization works" without the scope condition).
  *   **A Answer (16-20 marks):** Performs arithmetic correctly, articulates the *structural* reason for the CDT/EDT divergence (independence vs. diagnosis), and provides a nuanced conditional analysis of the randomization solution based on the predictor's scope.
