answer: |-
  When Daniel Dennett passed in April 2024, the intellectual world lost one of its most rigorous architects. For decades, he provided us with the tools to dismantle magical thinking without losing sight of the structures that remain standing. His most enduring contribution remains the distinction between cranes and skyhooks. Skyhooks are miraculous lifters, lowering explanations from above via designers or minds; cranes are built from the ground up, assembled from mindless processes into complex functionality. Coupled with his warning against greedy reductionism—the error of skipping intermediate levels to explain a car by listing its atoms—Dennett gave us a blueprint for how to explain hard things without cheating.

  It is precisely because these tools are so valuable that *Breaking the Spell* remains a frustrating entry in his bibliography. The book promises to turn the crane machinery on religion itself. It vows to treat religious belief as a natural phenomenon, subject to the same bottom-up assembly as any other biological or cultural trait. Yet, by Dennett's own standards, the book is guilty of the very greediness he warned against. The charge is not that he naturalized religion—there is nothing off-limits about that—but that he promised a crane and mostly delivered a schematic drawing of one.

  The standard criticism of *Breaking the Spell* is that it attempts to explain religion away. Religious readers often argue that providing a naturalistic account of belief debunks the belief itself. This is the cheap reading, and it should be dismissed. A proper crane explanation does not necessarily dismantle the phenomenon; it explains how the phenomenon is achieved. The cognitive science of religion has shown that concepts like over-active agency detection or costly signaling can explain the persistence of worship without necessarily proving the non-existence of a deity. Explaining the machinery of belief is not the same as disproving the object of belief. If Dennett had built a robust crane, showing exactly how doctrinal adherence is mechanically sustained across generations, the explanation would stand regardless of theological truth.

  The failure is not in the target, but in the tempo. Standard greedy reductionism is a failure of level: jumping from biology to physics. Dennett's greed in *Breaking the Spell* is a failure of pace. He announces the correct level of explanation—cultural and cognitive mechanics—but traverses that level at a speed that assumes the conclusion is already obvious. He gestures at the mechanisms—memes, belief-in-belief, costly signaling—but rarely bolts them together. The book spends its energy arguing why religion *should* be studied scientifically, rather than doing the heavy lifting of showing exactly *how* the machinery works in specific contexts. It is as if the crane operator spends the entire shift describing the hydraulics without ever lifting the beam.

  This matters because the middle-level machinery is where the actual explanation lives. To explain why people die for doctrines they cannot state, or how corporate worship persists without universal genuine belief, requires granular work. It requires showing the gears turning. When Dennett moves too quickly from the existence of the phenomenon to the utility of the explanation, he skips the assembly. He treats the naturalistic conclusion as inevitable, which allows him to skim over the complex, messy causal chains that would actually validate the crane. By his own lights, this is greedy. It takes the credit for a reductionist explanation without paying the cost of the mechanistic work.

  Defenders of the book often offer two lines of defense. The first is that *Breaking the Spell* explicitly calls itself a sketch, a first salvo intended to open a research program rather than close it. This defense bites, but only partially. A sketch of a bridge must still demonstrate structural integrity; it cannot simply promise that gravity will be handled later. If the goal was to propose a research agenda, the book succeeds. But because it was marketed and read as a substantive account of religion's nature, the lack of mechanistic detail feels less like a provisional sketch and more like an unfinished argument.

  The second defense is that demanding full mechanisms is demanding work no single book could contain. Religion is too vast for one volume. This is a dodge. One cannot claim to have provided a naturalistic explanation while omitting the naturalistic mechanisms. It is permissible to say, "Here is where the work must be done," but it is greedy to say, "Here is why religion is a natural phenomenon," without showing the work that makes it so.

  However, the strongest reply a Dennett defender could offer—and the one that gives me pause before publishing this critique—is that the taboo was the real obstacle. From this perspective, the "mechanism" Dennett was building was not cognitive science, but intellectual permission. The greediness was a feature, not a bug. The cultural resistance to studying religion naturally was so thick that a detailed, tentative mechanistic account would have been ignored. Only a bold, sweeping assertion could break the spell enough to allow the detailed work to follow. The book was not meant to be the crane; it was meant to be the permit to build the crane. If the goal was to shift the Overton window of scientific inquiry, then the lack of granular detail was a strategic necessity. A nuanced engineering report does not start revolutions; bold manifestos do.

  This leaves us with a difficult evaluation. If *Breaking the Spell* is judged as a scientific account, it is greedy by Dennett's own definition, skipping the labor required to build the crane it promises. If it is judged as a cultural intervention, it may be justified. But there is a cost to this strategy. When a philosopher known for rigor skips the rigor, it invites the suspicion that the conclusion was driven by ideology rather than evidence. Dennett spent a lifetime warning us against skyhooks. In *Breaking the Spell*, he occasionally leaned on one: the assumption that the naturalistic explanation was obvious enough that it didn't need to be fully built.

  We are left with a遗憾—a regret that the architect who taught us how to build better explanations did not fully apply those lessons to his most controversial project. The column risks sounding like a hit job only if it implies malice or incompetence. It implies neither. It implies that Dennett's standards were higher than his execution in this specific instance. To publish this is to hold him to the rigor he demanded of everyone else. It is to say that the best way to honor a thinker who taught us to distrust skyhooks is to insist that even his own cranes must be bolted together, piece by piece, before we trust them to lift the weight.
