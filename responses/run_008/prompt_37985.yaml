      *   **Context:** A farewell drinks argument between Marcus (leaving engineer) and Vera (team lead) about a reference letter.
      *   **The Conflict:** The reference letter praised soft skills (punctuality, tidiness, etc.) but omitted technical ability. Marcus didn't get the job. He claims the letter was a "damning with faint praise" sabotage. Vera claims she wrote true, complimentary things and isn't responsible for the recruiter's inference.
      *   **Task:** Analyze the 5 numbered moves of the argument. For each, determine who is right/wrong and to what degree.
      *   **Core Questions:** Address (a) writer responsibility for unwritten content, and (b) whether unintended readings count as communication.
      *   **Conclusion:** Identify what both are missing (principled distinction between said vs. meant) and whether it settles the dispute.

  2.  **Deconstruct the 5 Moves:**

      *   **Move 1 (Marcus):** The letter was *engineered* to imply incompetence. Praising trivial virtues implies lack of substantial virtues.
          *   *Analysis:* This relies on Gricean maxims (Quantity/Relevance). In the context of references, omitting core competencies is a standard signal.
          *   *Verdict:* Marcus is largely right about the *convention*, but "engineered" implies malicious intent which is harder to prove.

      *   **Move 2 (Vera):** Every sentence is true/complimentary. Writers don't own readers' inferences.
          *   *Analysis:* Literal truth is a defense, but ignores context. The "writer's responsibility" claim is philosophically weak in high-context genres like references.
          *   *Verdict:* Vera is right on literal truth, wrong on communicative responsibility.

      *   **Move 3 (Marcus):** Omission is a decision. She could have cancelled the reading with one positive line. Implicit negativity is worse than explicit (sabotage with deniability).
          *   *Analysis:* Strong point. In references, silence on core skills is loud. The ethical point about "deniability" is potent.
          *   *Verdict:* Marcus is very strong here. The ethical weight is on the writer in a reference context.

      *   **Move 4 (Vera):** Not every omission is a signal. Haste/Friday afternoon. No intent = no responsibility.
          *   *Analysis:* "Haste" is a weak excuse for a reference letter (high stakes). Intent vs. Impact.
          *   *Verdict:* Vera is weak here. Negligence doesn't absolve responsibility in professional references.

      *   **Move 5 (Marcus):** Conventions make the move work. She used the convention to send a message while keeping deniability. It's a con.
