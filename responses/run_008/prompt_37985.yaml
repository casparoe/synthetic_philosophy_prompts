      *   *Does it settle the dispute?* It clarifies *how* the communication happened, but not necessarily the *ethics*. It relocates the dispute from "Did she lie?" to "Did she violate the cooperative principle of references?"
      *   *The Real Missing Piece:* The *purpose* of a reference. Is it to protect the company (Vera's view?) or help the employee (Marcus's view?)? Or is it to be honest? A "neutral" reference that acts as a negative is the core tension.
      *   *Refinement:* The distinction is between *Semantic Content* (what Vera defends) and *Pragmatic Implicature* (what Marcus attacks). But the deeper missing piece is the *normative expectation* of a team lead. If she couldn't write a positive technical reference, she should have declined to write one.

