answer: |-
  **TO:** The Minister of Culture and National Heritage
  **FROM:** The Advisory Council of the National Archive
  **DATE:** October 26, 2024
  **SUBJECT:** Formal Opinion Regarding Proposed Legislation for Immediate Public Release of Security Service Records

  **I. Introduction**

  The Advisory Council has convened to review the proposed bill mandating the immediate, unredacted, online publication of the entire collection of the former State Security Service (SSS). We recognize the gravity of this decision. The Archive holds the memory of a traumatic period in our national life; how we manage these records defines not only our historical understanding but our current social contract.

  The Council is divided. This opinion reflects a consensus on the *risks* of the current bill, though not on the *degree* of restriction required. After three days of testimony from victims' groups, historians, and the Association of Informants' Descendants, we cannot recommend the bill in its current form. However, we also cannot recommend maintaining the status quo. We recommend that Parliament **support the bill's intent to accelerate access, but amend its mechanism of delivery and scope of redaction** to align with archival ethics, legal reality, and the epistemic limitations of the documents themselves.

  **II. The Epistemic Nature of the Records**

  Before addressing the moral arguments, the Council must be candid about the material we hold. The public debate often treats these files as judicial records or objective truth. They are neither. They are intelligence products generated by an authoritarian apparatus.

  1.  **Registration $\neq$ Activity:** A signed recruitment form indicates a person was pressured to sign, not that they provided useful information. Our internal audits show that a significant percentage of registered informants never submitted a single report.
  2.  **Fabrication and Quotas:** Case officers operated under pressure to demonstrate network growth. There is documented evidence of officers fabricating meeting notes or attributing reports to informants who were inactive, in order to meet quotas or secure promotions.
  3.  **The Indistinguishability of Coercion:** The paper trail rarely distinguishes between the ideological zealot and the blackmailed parent. A signature obtained under threat of university expulsion looks identical on the page to a signature given in exchange for career advancement.

  To publish these records online, unredacted and without context, is to convert intelligence gossip into historical fact. It risks punishing individuals based on administrative data that may be demonstrably false. An archive must preserve the record, but it must not certify its veracity.

  **III. The Case for Transparency (Arguments for the Bill)**

  The Council gives full weight to the arguments presented by the bill's sponsors and the National Historians' Association.

  *   **The Right to Know:** For the victims of surveillance, secrecy is a continuation of trauma. Thirty-one years is a significant portion of a human life. To tell a victim that they must wait until the centenary of their own persecution to learn the full scope of the betrayal is to prioritize the privacy of the perpetrator over the dignity of the victim.
  *   **The Danger of Secrecy:** When archives are closed, conspiracy flourishes. In the absence of hard data, public discourse relies on rumor, which often inflates the scope of collaboration to implicate entire professions or political groups. Full disclosure is the only antidote to the mythologizing of the past.
  *   **Historical Necessity:** Historians argue that redaction prevents the reconstruction of networks. You cannot understand how the regime functioned if you cannot see the connections between the officer, the informant, and the target. To redact is to censor the mechanism of oppression.

  These arguments are morally sound. A democracy cannot be built on a foundation of state-managed amnesia.

  **IV. The Case for Restraint (Arguments Against the Bill)**

  The Council also gives full weight to the arguments presented by the Citizens' Association of Informants' Descendants.

  *   **Punishment Without Trial:** The transition was negotiated. There was a deliberate choice not to pursue blanket criminal prosecutions for collaboration, in part to stabilize the democracy. To subject 60,000 individuals (and their families) to public shaming via a government website is to enact a retroactive punishment that the courts never imposed. It creates a "digital pillory."
  *   **Intergenerational Harm:** The stigma of collaboration attaches to families. Children and grandchildren of registered informants face harassment and social exclusion based on actions they did not commit, and which in many cases were coerced. A liberal society must allow for the possibility of redemption and the right of the next generation to live unburdened by the sins of their parents.
  *   **The Distortion of Memory:** Immediate online release encourages "name-checking" rather than understanding. It reduces complex human histories—fear, weakness, survival, complicity—to a searchable database entry. This flattens history rather than deepening it.

  These arguments are also morally sound. Justice requires proportionality, and blanket exposure lacks proportionality.

  **V. Council Deliberations and Dissent**

  The nine-member Council is split 5-4 on the fundamental philosophy of access.

  *   **The Minority View (4 Members):** Argues that any restriction perpetuates the regime's culture of secrecy. They contend that the epistemic flaws of the files are a feature, not a bug—they reveal the lies the state told itself. They argue that the pain of exposure is the necessary cost of truth. For them, the bill should pass as written; any amendment is a betrayal of the victims.
  *   **The Majority View (5 Members):** Argues that the Archive has a duty of care to living persons. They contend that putting unverified intelligence data on the open web invites harassment and vigilante justice. They believe the Archive is a place for research, not a tool for public retribution.

  While we differ on the endpoint, both sides agree that the current 100-year restriction is excessive, and that the proposed "immediate online" solution is dangerous.

  **VI. Recommendations and Proposed Access Rules**

  The Council recommends that Parliament **oppose the bill in its current form** but **adopt the following amended framework**. This framework accelerates access significantly while maintaining safeguards against misuse and misinterpretation.

  **1. Rejection of Open Web Hosting**
  The collection should **not** be placed on the open internet (e.g., searchable via standard search engines). It should be hosted on a dedicated, secure digital portal within the National Archive's infrastructure.
  *   *Rationale:* This prevents algorithmic scraping and "doxing" while allowing genuine research. It ensures that access is intentional, not accidental.

  **2. Tiered Access System**
  *   **Tier 1 (Victims):** Unrestricted access to their own files remains immediate and free (current law).
  *   **Tier 2 (Accredited Researchers):** Journalists, historians, and family members of deceased subjects may access unredacted files upon application. This process creates a paper trail for access, deterring malicious fishing expeditions while enabling historical work.
  *   **Tier 3 (General Public):** Files become available to the general public **50 years after creation** (reduced from 100), but with specific redactions (see below).

  **3. Distinction by File Category**
  *   **Surveillance Targets:** Files detailing the *victims* of surveillance should be prioritized for declassification. The state's interest in protecting the privacy of the *informant* cannot outweigh the victim's right to know who watched them.
  *   **Informant Indices:** Names of registered informants should remain redacted for **30 years from the date of the regime's collapse** (i.e., accessible starting in 2026, not immediately) for those who can prove coercion, or generally until the 50-year mark for others.
  *   *Rationale:* This creates a "cooling off" period. It acknowledges the descendants' plea for time while setting a firm date when history takes precedence over privacy.

  **4. Mandatory Contextual Metadata**
  No file may be viewed without an accompanying "Archival Warning" and metadata sheet.
  *   *Requirement:* Every digital image must be watermarked or accompanied by text stating: *"This record reflects the claims of the former Security Service. It has not been judicially verified. Recruitment does not prove active collaboration."*
  *   *Rationale:* This addresses the epistemic problem. It forces the viewer to confront the unreliability of the document before drawing conclusions.

  **5. Right of Reply and Annotation**
  Establish a permanent "Right of Annotation" for living persons named in the files.
  *   *Mechanism:* If an individual (or their heirs) can provide evidence that a file is factually incorrect (e.g., proof of alibi, evidence of coercion not noted in the file), they may submit a statement to be permanently linked to that digital record.
  *   *Rationale:* This transforms the archive from a static indictment into a living dialogue. It allows the accused to speak back to the accuser, even posthumously.

  **6. Prohibition on Commercial Republication**
  Legislation should prohibit the use of these records for commercial data mining or the creation of "collaborator lookup" apps designed for harassment.
  *   *Rationale:* Protects against the monetization of trauma.

  **VII. Conclusion**

  The Council believes that a society must remember its wounds to heal them, but it must not salt them. The proposed bill mistakes *exposure* for *truth*. By adopting the amendments above, Parliament can honor the victims' right to know and the historians' need for evidence, without converting the National Archive into an engine of intergenerational punishment.

  We offer this opinion not as a final closure, but as a framework for a difficult conversation that must continue. The files will remain; our task is to ensure they illuminate the past without burning the future.

  **Signed,**

  [Your Name]
  Chair, Advisory Council of the National Archive
  *(On behalf of the Council)*
