answer: |-
  This is a rigorous request that cuts through the normative noise of policy advocacy to ask for the structural requirements of the theory itself. You are asking for the *specification* of the engine, not a sales pitch for the car.

  Below is the specification you requested. It is organized into a table of desiderata, followed by an analysis of their compatibility (specifically the joint unsatisfiability you asked to see), an audit of your stock/flow dichotomy, and a scoring of the two dominant paradigms.

  ### Part I: The Desiderata for a Theory of Commons Governance

  | # | Desideratum | Case / Consideration | Negotiability | Conflict Potential |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Regime Discrimination** | Must explain why alpine pastures persist while cod fisheries collapse, despite both being rivalrous resources. A theory that predicts universal collapse (Hardin) or universal cooperation (naive communitarianism) is falsified by the historical record. | **Non-Negotiable** | High. Conflicts with theories seeking universal laws of behavior. |
  | **2** | **Categorical Precision** | Must distinguish Common-Pool Resources (rival, non-excludable) from Public Goods (non-rival, non-excludable) and Club Goods. Must separate *overuse* (depletion) from *underprovision* (maintenance). | **Non-Negotiable** | Low. Standard in economics, often ignored in political rhetoric. |
  | **3** | **Temporal Consistency** | Must reconcile one-shot game theory (defection dominates) with iterated play (cooperation possible via conditional strategies). Must account for discount rates without assuming they are fixed exogenously. | **Non-Negotiable** | Medium. Conflicts with static equilibrium models. |
  | **4** | **Bio-Social Coupling** | Must treat the resource stock not as a static backdrop but as a dynamic variable that alters the payoff matrix (e.g., low stock increases marginal cost of extraction). | **Non-Negotiable** | **High.** (See Joint Unsatisfiability below). |
  | **5** | **Endogenous Rule Formation** | Must explain the origin of rules. If rules are assumed to be imposed by an external Leviathan, the theory explains *regulation*, not *governance*. | Negotiable (depends on scope) | High. Conflicts with Methodological Individualism. |
  | **6** | **Monitoring & Sanctioning** | Must specify the mechanism of enforcement. "Norms" are insufficient without a cost-bearing mechanism for punishing defectors. | **Non-Negotiable** | Medium. Conflicts with pure trust-based models. |

  ### Part II: Analysis of Joint Unsatisfiability

  You asked specifically to identify if any subset of these desiderata is jointly unsatisfiable. **There is a fundamental tension between Desideratum 3 (Temporal Consistency/Game Theory) and Desideratum 5 (Endogenous Rule Formation).**

  Here is the conflict:
  Standard non-cooperative game theory (Desideratum 3) relies on **Methodological Individualism**. It assumes agents have fixed preference functions (usually self-interested utility maximization) and calculates equilibrium based on those fixed preferences. It can explain cooperation *if* the shadow of the future is long enough (iteration) or if information is perfect.

  However, Endogenous Rule Formation (Desideratum 5) requires explaining how those preference functions or constraint sets *change* over time through social interaction. If agents are purely self-interested calculators, they should not incur costs to punish defectors (second-order free-rider problem) unless there is a meta-punishment for not punishing. This leads to an infinite regress. To solve this without an external enforcer, you must introduce **social preferences** (trust, reciprocity, norm internalization) that are not reducible to simple self-interest.

  **The Finding:** A theory cannot be simultaneously **reductionist** (explaining everything via fixed self-interested rationality) and **complete** (explaining the emergence of stable governance without external imposition).
  *   If you hold strict to Game-Theoretic Rationality (Desid. 3), you generally require an external enforcer (State/Property), failing Desid. 5.
  *   If you hold strict to Endogenous Governance (Desid. 5), you must relax the definition of "Rationality" in Desid. 3 to include norm-following as a utility, which risks making the theory unfalsifiable (tautological).

  **Conclusion on Unsatisfiability:** You must choose between a **parsimonious theory** that predicts failure unless external constraints are added (Hardin), or a **complex theory** that allows for variable human motivations but loses predictive sharpness (Ostrom). A single model that is both mathematically tight *and* sociologically rich is currently beyond reach.

  ### Part III: Audit of the Stock/Flow Dichotomy

  You noted your habit of separating stock (biophysical) from flow (incentive), suspecting it may be a prejudice. **It is.**

  In a coupled human-natural system, the stock *is* the incentive structure.
  1.  **Biophysical feedback:** As stock ($S$) declines, the cost of effort ($E$) to capture a unit of flow ($H$) increases. In open access, this is the only brake on collapse (economic extinction before biological extinction).
  2.  **Informational feedback:** The visibility of the stock changes the game. In a groundfishery, the stock is hidden (uncertainty high); in an irrigation system, the water level is visible (uncertainty low). Hidden stocks prevent the "conditional strategies" required for cooperation in Iterated Prisoner's Dilemmas.
  3.  **Resilience:** A high-stock regime can absorb governance errors (lag in regulation); a low-stock regime cannot.

  **Verdict:** A governance theory that treats the resource as a passive container for incentives will fail. The growth rate ($r$) and carrying capacity ($K$) determine the *maximum* sustainable yield, but they also determine the *maximum* sustainable conflict. A slow-growing resource (orange roughy) cannot sustain the same level of governance error or cheating as a fast-growing one (sardine). The biophysics sets the boundary conditions for the politics.

  ### Part IV: Scoring Hardin vs. Ostrom

  Here is how the two dominant accounts score against the desiderata.

  **1. Hardin (Privatization / State Regulation)**
  *   **Regime Discrimination:** **Fail.** Predicts universal tragedy without external intervention; cannot explain surviving communal systems.
  *   **Categorical Precision:** **Pass.** Clearly defines the problem as rivalrous non-excludable goods.
  *   **Temporal Consistency:** **Pass (Static).** Correctly identifies one-shot defection, but assumes iteration/communication is impossible or insufficient.
  *   **Bio-Social Coupling:** **Fail.** Treats the resource as a generic "pasture"; ignores specific stock dynamics.
  *   **Endogenous Rule Formation:** **Fail.** Assumes rules must be imposed exogenously ("mutual coercion, mutually agreed upon" usually implies state power).
  *   **Monitoring & Sanctioning:** **Pass.** Relies on state enforcement or property owners, which are robust sanctioning mechanisms.

  **2. Ostrom (Self-Governance / Design Principles)**
  *   **Regime Discrimination:** **Pass.** Explicitly built to explain the variance between success and failure.
  *   **Categorical Precision:** **Pass.** Distinguishes CPR from public goods.
  *   **Temporal Consistency:** **Pass.** Relies on repeated games, reputation, and graduated sanctions.
  *   **Bio-Social Coupling:** **Partial.** Acknowledges resource conditions (Desid. Principle 2: congruence between rules and local conditions), but lacks a formal biophysical model.
  *   **Endogenous Rule Formation:** **Pass.** This is the core strength; explains rule evolution.
  *   **Monitoring & Sanctioning:** **Pass.** Emphasizes low-cost monitoring by appropriators themselves.

  ### Part V: The Single Most Exclusionary Requirement

  If you must select one requirement to filter candidate theories, it is **Desideratum 4: Bio-Social Coupling.**

  **Reasoning:**
  Most political economy treats the resource as a generic variable $X$. Most biology treats the humans as a generic harvest rate $H$.
  *   **Hardin fails here** because his "pasture" is abstract; it does not account for the fact that fish hide and cows do not, or that fish stocks have recruitment thresholds that create non-linear collapse risks.
  *   **Standard Game Theory fails here** because payoff matrices are usually fixed constants, not functions of a dynamic biological state.
  *   **Pure Sociology fails here** because it focuses on social capital without regard for whether the resource can physically sustain the agreed-upon extraction rates.

  A theory that cannot integrate the *renewal rate* of the resource with the *renewal rate* of the social trust required to manage it is merely a metaphor, not a mechanism. This requirement excludes almost all purely economic models (which assume substitutability) and all purely ecological models (which assume equilibrium). It forces the theory into the realm of **Complex Adaptive Systems**, which is where the actual physics of your former career resides.

  ### Summary Finding

  You are correct to be dissatisfied. The field is polarized between those who believe the math of self-interest proves collapse is inevitable (Hardin) and those who believe the sociology of community proves cooperation is possible (Ostrom).

  The specification reveals that an adequate theory must be **polycentric and dynamic**. It must accept the **Joint Unsatisfiability** of simple rationality and complex governance: you cannot have a simple equation for human behavior that also predicts complex institutional evolution. The "prejudice" you identified—the stock/flow split—is indeed the barrier. The stock dynamics dictate the *tolerance* of the system for governance failure. A theory of commons governance is, ultimately, a theory of error management in a coupled bio-economic system. If it does not quantify the lag between incentive and consequence, it is not a theory; it is an ideology.
