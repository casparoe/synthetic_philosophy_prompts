answer: |-
  # Which Theory of Emotions Do You Actually Hold?

  Philosophers have argued for centuries about what emotions *are*. Are they thoughts? Are they bodily sensations? Or are they a way of seeing the world?

  Don't worry about the academic labels yet. Below are eight concrete scenarios. Pick the answer that best matches your intuition about what is happening in the case. At the end, tally your answers to find out which philosophical camp your instincts belong to.

  ***

  ### 1. The Nervous Flyer (Recalcitrant Fear)
  You are on a plane. You know statistically that flying is safe. You have judged that there is no danger. Yet, your hands sweat and you feel terrified. What is happening?
  *   **A.** You don't *really* believe it's safe deep down; you are contradicting yourself.
  *   **B.** You know it's safe, but the danger *appears* real to you, like an optical illusion.
  *   **C.** Your heart is racing and your muscles are tight; that physical state *is* the fear.

  ### 2. The Spinal Patient (Bodily Feedback)
  A patient has a spinal injury and has lost all sensation from the neck down. They cannot feel their heart race or their stomach turn. Yet, they report getting angry when insulted and sad when hearing bad news.
  *   **A.** They are correct; their assessments of harm and loss are intact, so the emotion is real.
  *   **B.** They are correct; the world still *looks* offensive or tragic to them, even without the gut punch.
  *   **C.** They are mistaken; without the visceral bodily feeling, it's just a cold opinion, not a real emotion.

  ### 3. The Villain (Fictional Objects)
  You are watching a movie and feel genuine anger toward the villain, who is torturing the hero. You know the villain does not exist.
  *   **A.** It isn't real anger; you can't judge a non-existent person as morally bad. It's "make-believe."
  *   **B.** It is real anger; you perceive the cruelty in the narrative, just as you see depth in a painting.
  *   **C.** It is real anger; your blood pressure is up and your fists are clenched, regardless of the object.

  ### 4. The Sad Song (Music)
  You listen to a piece of instrumental music and are moved to tears. There are no lyrics and no specific event that caused you loss.
  *   **A.** You are contemplating the concept of tragedy embodied in the structure of the music.
  *   **B.** The sadness is presented directly to you by the music; you perceive it in the sounds.
  *   **C.** The music induces a physical release (tears, chills), and that feeling is the sadness.

  ### 5. The Loud Noise (Startle)
  A balloon pops behind you. You jump instantly before you even know what made the noise. Is this fear?
  *   **A.** Not yet. Fear begins only when you assess the noise as a potential threat.
  *   **B.** Yes. You perceived the threat immediately, before you had time to think.
  *   **C.** Yes. The jump is the beginning of the bodily disturbance that constitutes fear.

  ### 6. The Guilty Dog (Animal Emotion)
  Your dog hides when you come home and find they've chewed your shoes. They look "guilty."
  *   **A.** Impossible. Guilt requires a concept of moral rules, which dogs don't have.
  *   **B.** Plausible. Dogs can perceive social tension or disapproval directly.
  *   **C.** Plausible. Dogs have nervous systems that react to punishment; that's enough.

  ### 7. The Bad Day (Moods)
  You wake up irritable. You aren't angry *at* anyone specifically; everything just annoys you. Is this an emotion?
  *   **A.** No. Emotions must be judgments about specific things. This is just a background state.
  *   **B.** Yes. It is a lens through which you perceive everything as annoying.
  *   **C.** Yes. It is a lingering bodily state of tension that hasn't found an object yet.

  ### 8. The Realization (Cessation)
  You are furious at a friend for ignoring you. Then you see their phone was stolen. You immediately calm down. Why did the anger stop?
  *   **A.** Your judgment changed ("They didn't slight me"), so the emotion logically vanished.
  *   **B.** The appearance of the slight faded from your view, like a mist clearing.
  *   **C.** Your body began to metabolize the adrenaline once the stimulus was removed.

  ***

  ## Scoring Key

  Tally your answers. Count how many **A's**, **B's**, and **C's** you selected.

  *   **Mostly A's:** The Judgment Theorist (Cognitivism)
  *   **Mostly B's:** The Perceptual Theorist (Neo-Cognitivism)
  *   **Mostly C's:** The Feeling Theorist (Somatic/Jamesian)

  *(If you have a tie, see the "Tie-Breaker Rules" below.)*

  ### The Results

  **Mostly A's: You are a Judgment Theorist.**
  *Style: Robert Solomon, Martha Nussbaum.*
  To you, emotions are essentially evaluations. To be afraid is to judge that something is dangerous. To be angry is to judge that you have been wronged. This makes emotions deeply rational—they are part of how we reason about value.
  *The Cost:* You have to explain away cases where emotion defies reason (like the Nervous Flyer in Q1) as self-deception or conflicting beliefs.

  **Mostly B's: You are a Perceptual Theorist.**
  *Style: Sabine Döring, Christine Tappolet.*
  To you, emotions are like senses. Just as your eyes tell you about color, your emotions tell you about value. You can "see" danger even when you "know" you are safe (like an optical illusion). This explains why emotions feel passive (they happen to us) but still tell us about the world.
  *The Cost:* You have to explain how emotions can be inaccurate (illusions) without being irrational beliefs.

  **Mostly C's: You are a Feeling Theorist.**
  *Style: William James, Antonio Damasio.*
  To you, emotions are bodily events. You don't cry because you are sad; you are sad because you cry. If you remove the racing heart, the sweaty palms, and the tears, there is no emotion left, only a cold thought.
  *The Cost:* You have to explain why emotions seem to be *about* things (intentionality). A racing heart can be fear or exercise; what makes it fear?

  ***

  ## Tie-Breaker Rules (Definite Calls)

  Philosophy is messy, but this key is not. If your score is tied, use these rules to determine your position.

  **1. Tie between A (Judgment) and B (Perception):**
  *   **Verdict:** You are a **Perceptual Theorist**.
  *   **Reasoning:** Both positions are "Cognitive" (they think emotions involve the mind/world, not just the body). However, the Perceptual theory is the more robust version. It handles **Question 1 (The Nervous Flyer)** better. A Judgment theorist must claim the flyer is lying to themselves about believing the flight is safe. A Perceptual theorist accepts the flyer's experience as genuine (an illusion of danger). Since you accepted the premises of the quiz, you likely favor the theory that accommodates recalcitrant emotions without accusing the subject of self-deception.

  **2. Tie between B (Perception) and C (Feeling):**
  *   **Verdict:** You are a **Feeling Theorist**.
  *   **Reasoning:** This is a clash between "Mind/Body" vs "Body Only." If you are tied here, it means you value the bodily component (C) as much as the worldly component (B). The Feeling Theory is the more parsimonious commitment: if you think the bodily feeling is *necessary* (as implied by choosing C in Q2 or Q4), you are a Feeling Theorist. Perceptual theorists argue the body is contingent; Feeling theorists argue it is essential. Committing to the body's essentiality makes you a Feeling Theorist.

  **3. Tie between A (Judgment) and C (Feeling):**
  *   **Verdict:** You are a **Hybrid Theorist (Two-Factor)**.
  *   **Reasoning:** This is the rarest split. It means you think emotions require *both* a cognitive evaluation (A) and a bodily feeling (C), rejecting the idea that either one alone is sufficient (which B might allow). You likely align with "Composite Theories" (like Jenefer Robinson or Jesse Prinz's later work), where the body and the brain must shake hands to make an emotion.

  ***

  ## The Honesty Flag

  **This quiz cannot reliably separate Judgment Theory (A) and Perceptual Theory (B) in all contexts.**

  Here is why: Both theories agree that emotions are **intentional** (they are about something) and **cognitive** (they involve mental processing). The difference is often metaphorical: Is the emotion a *conclusion* you reach (Judgment) or an *input* you receive (Perception)?

  In many real-world cases (like Q8, calming down), both theories predict the exact same outcome. If you found yourself choosing A and B interchangeably because they both sounded "rational" compared to C, you are correctly sensing that these two positions are siblings. The quiz forces a split based on how you handle **recalcitrance (Q1)** and **fiction (Q3)**, but in the broader history of philosophy, these two camps often merge into a general "Cognitivist" view against the Feeling Theorists.

  *If you scored mostly A's or B's, you can comfortably call yourself a **Cognitivist** and sleep well at night.*
