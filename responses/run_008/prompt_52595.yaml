      *   *Nuance:* The "Staying Home" example is classic underdetermination. A defender says "Watch them react to a plane ticket gift." A critic says "What if their reaction is also ambiguous?"
      *   *Key Philosophical Concept:* *Ramsification* or *Interpretivism*. If values are *defined* by behavior, the view is trivially true but empty. If values are *causes* of behavior, the view is empirical and falsifiable.
