prompt: |-
  I'm a graduate student writing a term paper on how to act when you can't settle which moral theory is correct, and I keep running into the same move. My supervisor — and, at greater length, the literature descending from MacAskill, Bykvist, and Ord's *Moral Uncertainty* — treats moral uncertainty as a straightforward analogue of ordinary empirical uncertainty. In the empirical case, you have credences over states of the world, you assign each outcome a value, you multiply and add, and you choose the option with the highest expectation. So, in the moral case, you take credences over moral theories, ask each theory how choiceworthy each option is, weight by your credence, and pick the option with the highest expected choiceworthiness. The analogy is doing real argumentative work in my circles: it's meant to show that deep moral disagreement is no excuse for paralysis, and that a principled person can commit to a career or a donation budget without first settling whether consequentialism is true.

  I want you to audit the analogy rather than take it on faith. Please take the role of a professional philosopher specializing in decision theory and metaethics, someone who has published on decision-making under moral uncertainty and is skeptical of both lazy endorsements and lazy dismissals. Before writing, think carefully and brainstorm the mapping on your own — I'd like you to explicitly work through the correspondence table: what plays the role of the states of the world, the probability distribution, the utility function, the act, the expectation. Then turn to the disanalogies, and here I want you to be selective rather than exhaustive. The candidates I can see include: (i) the problem of intertheoretic value comparisons — utilities within a single decision-maker's empirical problem are on a common scale, but the choiceworthiness scores that different moral theories assign to the same option may have no common currency (the suffering-focused theorist and the Kantian are not disagreeing about the magnitude of one shared quantity); (ii) the fact that many theories are agent-relative or options-indexed in a way that resists collapsing each option to a single number per theory; (iii) a difference in the epistemology — empirical uncertainty is about which world is actual, while moral uncertainty may be about which way of evaluating worlds is correct, and it's not obvious these are species of the same genus. For each candidate disanalogy, tell me whether it merely complicates the expected-choiceworthiness machinery or whether it breaks the practical conclusion the analogy was invoked to support. Concretely: does the anti-paralysis conclusion survive even where the maximize-expectation rule fails, and if so, on what footing — mere decision-theoretic regret minimization, "moral hedging" in the sense of choosing options acceptable under most of the theories I find plausible, or something else?

  Please use one running example throughout, and make it a live one for my paper: a recent graduate deciding between taking a high-earning job in order to donate a large share of income to global health charities, and taking a modestly paid direct-work job at a local homeless shelter, while being genuinely torn between a broadly consequentialist outlook and a more contractualist or partiality-friendly one that gives special weight to the people near you. Show me how the correspondence table plays out on that case, where the analogy strains in applying to it, and what the analogy quietly imports — for instance, whether treating moral theories as hypotheses over which you have credences already assumes they can all be evaluated as if from a standpoint outside all of them. If you think a better source domain exists for the comparison (uncertainty about which of several experts to defer to, unresolved disagreement within a single agent, measurement under multiple incommensurable scales), say so and sketch what it would change. I care most about a clear final verdict: is the expected-choiceworthiness framework the right practical default for people like my graduate, a useful heuristic with known failure modes, or a false comfort that only looks rigorous? Please reason step by step and be willing to give an answer that would annoy both the framework's boosters and its dismissers.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Graduate student writing a term paper on moral uncertainty.
      *   **Topic:** Critiquing the analogy between empirical uncertainty and moral uncertainty (specifically the MacAskill/Bykvist/Ord *Moral Uncertainty* framework).
      *   **Task:** Audit the analogy. Act as a skeptical professional philosopher (decision theory/metaethics).
      *   **Requirements:**
          1.  Create a correspondence table (States, Probability, Utility, Act, Expectation).
          2.  Analyze specific disanalogies: (i) Intertheoretic comparisons, (ii) Agent-relativity/options-indexing, (iii) Epistemological differences (world vs. evaluation).
          3.  Determine if disanalogies complicate machinery or break the "anti-paralysis" conclusion.
          4.  Use a running example: High-earning donor (Consequentialism) vs. Local shelter worker (Contractualist/Partiality).
          5.  Evaluate if the framework is a default, heuristic, or false comfort.
          6.  Tone: Rigorous, step-by-step, willing to annoy both sides (boosters and dismissers).

  2.  **Deconstruct the Running Example:**
      *   **Agent:** Recent graduate.
      *   **Option A:** High-earning job + donate (Effective Altruism style).
      *   **Option B:** Modest pay + direct work at local shelter.
      *   **Theory 1 (T1):** Act Consequentialism (Global maximization).
      *   **Theory 2 (T2):** Contractualist/Partiality (Special duties to locals/proximity).
      *   **Uncertainty:** Agent has credences in T1 and T2 (e.g., 60% T1, 40% T2).

  3.  **Drafting the Correspondence Table (Empirical vs. Moral):**
      *   *Empirical:* States of World ($S$), Credences ($P$), Utility Function ($U$), Acts ($A$), Expected Utility ($EU$).
      *   *Moral:* Moral Theories ($T$), Credences in Theories ($C$), Choiceworthiness Function ($CW$), Acts ($A$), Expected Choiceworthiness ($ECW$).
      *   *Crucial Nuance:* In empirical cases, $U$ is fixed (the agent's values). In moral cases, $CW$ varies by theory. This is the first crack in the analogy.

  4.  **Analyzing Disanalogies:**

      *   **(i) Intertheoretic Value Comparisons:**
          *   *Issue:* Utilitarianism measures in "utils" (welfare units). Kantianism measures in "duty fulfillment" or "respect." How do we add them? Is 10 units of welfare = 1 unit of duty?
          *   *Application to Example:* T1 says Option A saves 100 lives (Value = 100). T2 says Option B honors local commitment (Value = ?). If T2 doesn't output numbers comparable to T1, $ECW$ is mathematically undefined.
          *   *Impact:* Does it break anti-paralysis? Yes, if we can't calculate, we can't maximize. But maybe we don't need to maximize to avoid paralysis.
          *   *Verdict:* Breaks the *maximization* machinery, but not necessarily the *action-guiding* potential if we switch to ordinal ranking or voting models.

      *   **(ii) Agent-Relativity/Options-Indexing:**
          *   *Issue:* Empirical utility is usually agent-neutral regarding the *structure* of the outcome (though preferences vary). Some moral theories define rightness by the *act type* or the *agent's role*, not just the outcome state.
          *   *Application to Example:* T2 might say "Working at the shelter is right *for you* because you live here," not "The world where you work at the shelter is better simpliciter."
          *   *Impact:* Complicates the "State of the World" mapping. Moral theories aren't just ranking outcomes; they are ranking *agent-outcome pairs*.
          *   *Verdict:* Complicates machinery. Requires redefining the object of evaluation from "Outcome" to "Agent-Act-Outcome." Doesn't necessarily break anti-paralysis, but makes the "expectation" calculation much messier.

      *   **(iii) Epistemology (World vs. Evaluation):**
          *   *Issue:* Empirical uncertainty is about *facts*. Moral uncertainty is about *norms*. Believing T1 is true doesn't make T1 true in the same way believing it rains makes it rain.
          *   *Application to Example:* If I'm 60% sure Consequentialism is true, am I 60% sure that the *normative force* resides in outcomes? Or am I just confused?
          *   *Impact:* This is the metaphysical heavy lifting. If moral truths are mind-independent, credences make sense. If expressivist, "credence" is a metaphor for commitment strength.
          *   *Verdict:* Breaks the *justification* for using probability theory. If morality isn't descriptive, probability axioms might not apply.

  5.  **Addressing the "Anti-Paralysis" Conclusion:**
      *   Does the failure of Expected Choiceworthiness (ECW) mean we must be paralyzed?
      *   *No.* We can use "Moral Hedging" (satisficing across theories) or "My Favorite Theory" (if credence is high enough).
      *   *Alternative:* Treat it like a committee vote rather than a weighted average.
      *   *Verdict:* The *specific* mechanism (ECW) might fail, but the *goal* (action under uncertainty) remains viable via different mechanisms.

  6.  **Developing the "Better Source Domain":**
      *   The prompt suggests: Uncertainty about experts, unresolved disagreement within a single agent, measurement under incommensurable scales.
      *   *Selection:* **Legislative/Committee Model.** (Suggested by Harsanyi/Nagel/others).
      *   *Why?* Moral theories aren't hypotheses about the world; they are stakeholders in a decision. You don't average their utilities; you negotiate or vote.
      *   *Change:* Instead of $ECW$, we look for Pareto improvements or minimize maximum regret.

  7.  **Synthesizing the Verdict:**
      *   Is ECW the right default? No, it's too fragile (intertheoretic comparison).
      *   Is it a useful heuristic? Yes, for structurally similar theories (e.g., different forms of consequentialism).
      *   Is it false comfort? Yes, if it hides the incommensurability problem behind a calculator.
      *   *Final Stance:* It is a **category error masquerading as a solution.** It works for "intra-paradigm" uncertainty but fails for "inter-paradigm" uncertainty. The anti-paralysis conclusion holds, but not because of expected value maximization. It holds because *inaction is also a choice* that can be evaluated under uncertainty.

  8.  **Refining the Tone:**
      *   Must sound like a philosopher. Use terms like "normative facts," "cardinal vs. ordinal," "metanormative," "phenomenology of deliberation."
      *   Avoid being too dismissive (acknowledge MacAskill's contribution) but be rigorous about the limits.
      *   Ensure the running example is woven through every section.

  9.  **Step-by-Step Drafting Plan:**
      *   **Introduction:** Acknowledge the prominence of the *Moral Uncertainty* framework. State the thesis: The analogy is heuristically potent but metaphysically fragile.
      *   **The Correspondence Table:** Explicitly map Empirical vs. Moral using the Graduate Example.
      *   **Disanalogy 1 (Intertheoretic Comparison):** The "Currency" problem. Show how T1 and T2 speak different languages. Verdict: Breaks maximization.
      *   **Disanalogy 2 (Agent-Relativity):** The "Standpoint" problem. Show how T2 cares about *who* acts. Verdict: Complicates mapping.
      *   **Disanalogy 3 (Epistemology):** The "Fact vs. Norm" problem. Verdict: Undermines the probability axioms.
      *   **Alternative Model:** The Committee/Negotiation model.
      *   **Final Verdict:** Nuanced conclusion (Heuristic for similar theories, False Comfort for divergent ones, Anti-paralysis survives but on different grounds).

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address whether the anti-paralysis conclusion survives? *Correction:* Make sure to explicitly state that paralysis is avoidable even without ECW (e.g., via minimax regret).
      *   *Check:* Is the example clear? *Correction:* Ensure the "High-earning" vs. "Shelter" choice is referenced in every section.
      *   *Check:* Am I being too technical? *Correction:* Keep it accessible to a grad student but maintain philosophical rigor.
      *   *Check:* Did I answer the specific prompt about "lazy endorsements/dismissals"? *Correction:* Frame the conclusion as annoying to both sides (Boosters: it's not rigorous math; Dismissers: you still have to act).

  11. **Final Polish:** Check against the "think silently" constraint. (I am currently in the thinking block). Proceed to generate response.

  *(Self-Correction Note during thought process)*: I need to make sure I don't just say "intertheoretic comparison is hard." I need to explain *why* it breaks the expectation calculation specifically. It's not just hard to measure; it's arguably meaningless to add "utils" to "rights fulfilled." I should mention the "normalization" problem (variance scaling).

  Also, regarding the epistemology point: If moral truths are necessary truths (like math), having a "credence" in them is weird. You're either convinced or you aren't. But logical uncertainty allows credences. I should touch on logical vs. empirical uncertainty.

