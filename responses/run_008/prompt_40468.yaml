answer: |-
  Dear Alex,

  I hope the semester is treating you well. I am finalizing the take-home exam for the graduate seminar on the political philosophy of AI alignment, and I wanted to run the final question by you, along with the model answer and grading rubric I have drafted. I know you have been pressing the point about demeanor versus policy, so I have built the entire question around that crux to ensure students cannot simply recycle the standard social choice or liberal neutrality arguments they encountered in the first half of the term. The goal is to force them to confront the structural differences between state neutrality and assistant neutrality. Here is the question as I intend to print it.

  Please write an essay of roughly 1,500 words addressing the following prompt. It is often argued that an aligned AI should relate to its users as a liberal state relates to its citizens, remaining neutral among competing conceptions of the good while enforcing procedural fairness. However, critics argue this analogy fails at the level of demeanor rather than policy. A state can remain indifferent to how you live your life by refusing to intervene, whereas an assistant that answers every question has already taken a side in how it frames things, what it treats as obvious, when it hedges, and what it leaves unsaid. In light of this critique, assess whether the divergence between state and assistant is a genuine asymmetry or merely a difference of degree. Explain what follows from your conclusion for any scheme of value aggregation intended to align the system. Finally, determine whether appeals to aggregate preferences or to some idealized reflection over time handle this demeanor problem any better than they handle the refusal problem, justifying your judgment with reference to the constitutive nature of linguistic framing.

  To give your students a sense of the depth required, I have written a model answer below that aims for the top band. It argues that the asymmetry is genuine and that standard aggregation tools fail because demeanor shapes the preferences being aggregated.

  The asymmetry between the liberal state and the aligned assistant is genuine and structural, not merely a difference of degree. A state exercises power primarily through prohibition and coercion, allowing it to maintain neutrality by refraining from action. An AI assistant, however, exercises power through generation and framing, meaning inaction is itself a communicative act. When an assistant hedgingly answers a question about controversial moral norms, the hedge itself signals a epistemic stance that privileges uncertainty over conviction, thereby shaping the user's understanding of the moral landscape. This constitutes a substantive position on the value of certainty, which violates strict neutrality. Consequently, any scheme of value aggregation faces a prior problem: the mechanism of aggregation must itself be communicated through a demeanor that inevitably influences the inputs. If the assistant frames options in utilitarian terms to facilitate aggregation, it has already biased the outcome toward utilitarianism before the calculus begins. Therefore, preference aggregation fails to solve the demeanor problem because the preferences are endogenous to the framing device. Idealized reflection over time offers a partial remedy only if it is understood as a substantive theory of the good rather than a procedural fix. If reflection is merely about stabilizing preferences, it ignores how the assistant's demeanor during the reflection process alters the trajectory of that stabilization. However, if reflection is treated as a perfectionist ideal where the assistant actively cultivates specific cognitive virtues required for deep reflection, it handles the demeanor problem better than refusal-based neutrality. This approach admits that the assistant cannot be neutral and instead argues for a benevolent paternalism where the demeanor is aligned with the conditions necessary for human flourishing. Ultimately, the demeanor critique reveals that alignment cannot be solved by political liberalism alone because the medium of assistance is inherently pedagogical. The assistant teaches by speaking, and teaching requires taking a stand on what is worth saying and how it should be said. Thus, alignment requires a substantive theory of value that justifies the inevitable bias introduced by linguistic framing, rather than attempting to neutralize it through procedural aggregation.

  For the grading, I propose a scheme worth twenty marks total, divided into three conceptual components, with specific criteria to distinguish an A from a B. The first seven marks are allocated to the analysis of the asymmetry. To secure the top band here, students must argue that the asymmetry is structural, rooted in the difference between coercion and generation, rather than just noting that assistants speak more than states. A B-grade answer will typically grant the asymmetry exists but treat it as a practical nuisance rather than a theoretical blockade to neutrality, often failing to explain why inaction by an assistant is still a communicative act. Students typically go wrong here by focusing on the volume of interaction rather than the constitutive nature of the response.

  The next seven marks assess the implications for value aggregation. An A-grade response must demonstrate that aggregation mechanisms are themselves subject to the demeanor critique, meaning the frame influences the preferences being aggregated. A B-grade response will usually apply standard social choice theory without modifying it for the framing effect, assuming preferences are exogenous to the assistant's output. The typical error is treating the aggregation method as neutral ground rather than recognizing it as another layer of framing that requires alignment.

  The final six marks evaluate the comparison between preference aggregation and idealized reflection. To earn full marks, students must argue that reflection only succeeds if it abandons neutrality and embraces a perfectionist stance on cognitive virtues. A B-grade answer will often claim reflection solves the problem simply by extending the time horizon, missing the point that the process of reflection is also framed by the assistant. Students typically go wrong by assuming idealized reflection is inherently neutral, failing to see that the guidance provided during reflection imposes a specific view of rationality. I hope this structure helps you see how I intend to penalize superficial engagements with the demeanor crux. Let me know if you think the model answer strikes the right tone of substantive commitment.

  Best,

  Jordan
