      *   *Premise (3):* This is the well-known Impossibility Theorem (Kleinberg, Mullainathan, Raghavan 2016; Chouldechova 2017). It is mathematically sound *given the definitions*.
      *   *Premise (4):* Empirical claim. Generally accepted as true in criminal justice data (due to policing biases, socioeconomic factors, etc.).
      *   *Conclusion (5):* Logically follows from 3 & 4. You can't satisfy both metrics simultaneously.
      *   *Conclusion (6):* "Therefore there is no coherent thing we are asking for when we demand fairness: the demands contradict each other." -> **This is the critical leap.**
