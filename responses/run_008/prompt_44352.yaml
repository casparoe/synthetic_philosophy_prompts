prompt: |-
  I write historical novels — mostly 19th century stuff, wars and famines, that genre — and I keep hitting the same problem in every single book, usualy about two thirds of the way through, at 11pm, when my editor is already asking for pages.

  The problem: every big event I depict has too many causes, and I have to pick which one gets narrated as THE cause. Take the outbreak of WWI. My narrator gets maybe two sentences to say why the war happened. Was it the assassination? The alliance system? The mobilization schedules that turned a crisis into a countdown nobody could stop? If I cram all of it in, it reads like a textbook; if I pick wrong, reviewers either call me a determinist or accuse me of turning something complicated into a story with one villain. Same issue at smaller scales. In the famine book I want the government's policy response to be the villain, but honestly the counterfactual seems to run through the blight itself. And in my current draft the heroine delays a departure by a day, and I want the reader to feel that's why they got caught in the storm — even though I suspect that storm was coming for them no matter what she did.

  So: please write a procedure I can run per scene, in a few minutes at my desk, grounded in whatever philosophy of causation and history has actually worked out on this — necessary vs. sufficient causes, Mackie's INUS conditions, Lewis on overdetermination and preemption, the historians' old habit of dividing "causes" from mere "background conditions." I need the questions to ask in order, what counts as an answer good enough that I can write the sentence, where the procedure stops and hands the choice back to me as a judgment call — and when it hands it back, I want it to say what I'm really choosing between (like, whose story it is, not which fact is true). Then run it on my three cases above, including the heroine one — I have a feeling the procedure will give me an answer I don't like there, and I'd rather know now than from a review.

  Last thing: tell me where this whole procedure is most likely to misfire on me, and what would change your mind about the verdicts — i.e., which step, if some philosopher or historian turned out to be right about something I'm glossing over, would collapse the whole thing.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Request:**
      *   **User:** Historical novelist (19th century, wars, famines). Experienced but stuck on a specific structural/philosophical problem.
      *   **Problem:** Causal oversimplification vs. explanatory overload. Needs to select *one* narrative cause for complex events without lying or sounding reductive.
      *   **Specific Examples:**
          1.  Outbreak of WWI (Assassination vs. Alliances vs. Mobilization).
          2.  Famine (Policy vs. Blight).
          3.  Heroine's Delay (Choice vs. Inevitable Storm).
      *   **Requirements:**
          *   A step-by-step procedure (runnable in minutes).
          *   Grounded in philosophy of causation/history (Mackie, Lewis, background conditions, etc.).
          *   Must identify when it stops and becomes a judgment call (and define *what* that choice is).
          *   Must apply the procedure to the three examples.
          *   Must identify failure modes and conditions for changing the verdict.
      *   **Tone:** Professional, sharp, empathetic to the craft, philosophically rigorous but practical.

  2.  **Deconstruct the Philosophical/Historical Framework:**
      *   *Necessary vs. Sufficient:* Rarely do we have single necessary/sufficient causes in history.
      *   *INUS Conditions (Mackie):* An Insufficient but Non-redundant part of an Unnecessary but Sufficient condition. This is the gold standard for complex causation. It allows multiple factors to be "causes" without one being *the* cause.
      *   *Background Conditions vs. Causes:* The classic historian's distinction (e.g., Hart & Honoré). A cause is an *intervention* or *deviation* from the norm; a condition is the static state allowing it.
      *   *Contrastive Explanation (Van Fraassen/Lewis):* Why *this* rather than *that*? Causation depends on the question asked.
      *   *Narrative Causation:* In fiction, causation serves theme and character agency.

  3.  **Drafting the Procedure (The "Causal Filter"):**
      *   *Goal:* Move from metaphysical truth to narrative utility.
      *   *Step 1: The Contrastive Question.* Define what changed. (Why war *now*? Why famine *deadly*? Why caught *here*?)
      *   *Step 2: The INUS Scan.* List factors. Identify which are conditions (static) and which are triggers (dynamic).
      *   *Step 3: The Agency/Theme Check.* Who is the story about? Causation in fiction is often about *responsibility* or *experience*, not just physics.
      *   *Step 4: The Counterfactual Test.* If X hadn't happened, would Y still have occurred *in this specific way*?
      *   *Step 5: The Handoff.* If multiple factors pass, the choice is thematic, not factual.

  4.  **Applying the Procedure to the Examples:**

      *   *WWI:*
          *   Contrast: Why war in 1914 vs. 1913?
          *   INUS: Alliances = Condition. Mobilization = Mechanism. Assassination = Trigger.
          *   Narrative: If the book is about diplomats, it's mobilization. If about soldiers, it's the assassination.
          *   Verdict: Mobilization is the structural cause, Assassination is the narrative hook.
      *   *Famine:*
          *   Contrast: Why mass death vs. just crop failure?
          *   INUS: Blight = Condition (natural). Policy = Trigger (human).
          *   Narrative: If the theme is human cruelty, Policy is the cause. If the theme is man vs. nature, Blight is.
          *   Verdict: Policy is the *narrative* cause (villain), Blight is the *setting*.
      *   *Heroine/Storm:*
          *   Contrast: Why caught in storm vs. safe?
          *   INUS: Storm system = Condition. Delay = Trigger.
          *   Counterfactual: If she left early, would she miss it? (User suspects no).
          *   Narrative: If the storm is inevitable, her delay is *character revelation*, not causal.
          *   Verdict: This is the tricky one. If the storm was inevitable, blaming the delay is a "Pathetic Fallacy" of causation. It creates false agency.

  5.  **Identifying Failure Modes:**
      *   *Determinism:* If the universe is hard determinist, no choices matter.
      *   *Complexity:* Chaos theory (butterfly effect) makes counterfactuals impossible to judge.
      *   *Bias:* The procedure privileges human agency over structural forces (or vice versa) depending on how Step 3 is weighted.
      *   *The "Collapse" Point:* If the historian's distinction between "condition" and "cause" is purely linguistic and not ontological (which many argue), the whole filter rests on a convenient fiction.

  6.  **Refining the Output:**
      *   Make it actionable. Use bold headers.
      *   Ensure the philosophical terms are explained simply but accurately.
      *   Be honest about the Heroine/Storm case (the user suspects they are wrong there).
      *   Check tone: Respectful of the deadline pressure (11pm, editor waiting).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too academic?
      *   *Fix:* Keep the steps punchy. "Ask this," "Write this."
      *   *Critique:* Did I address the "whose story it is" requirement?
      *   *Fix:* Explicitly state in the "Handoff" section that the choice is about *focalization*, not truth.
      *   *Critique:* The Heroine case needs nuance. If the storm was inevitable, making the delay the cause is a lie. But in fiction, *perceived* causation matters. I need to distinguish between *ontological cause* and *narrative cause*.
      *   *Adjustment:* In the Heroine analysis, I need to tell the user: If you write it as causal when it isn't, you are writing tragedy (fate) vs. drama (choice). If you claim choice where there is none, readers feel cheated.

  8.  **Final Polish:** Check against the prompt's specific constraints (Mackie, Lewis, necessary/sufficient, failure modes). Ensure the "11pm" vibe is acknowledged (efficiency).

  *(Self-Correction on the Heroine Case)*: The user says "I suspect that storm was coming for them no matter what she did." If that's true, narratively claiming the delay caused the capture is factually false within the world. However, if the *character believes* it, that's internal causation. I need to make sure the procedure distinguishes between *Authorial Truth* and *Character Perception*. I will emphasize the Counterfactual Test here.

  9.  **Finalizing the "Collapse" Condition:** What would break this? If "cause" is purely subjective (Nietzschean) or purely structural (Marxist determinism), the middle ground vanishes. I'll pinpoint the Hart & Honoré distinction (Condition vs. Cause) as the weak link.

  10. **Drafting the Response.** (Proceeds to generate output based on these thoughts).
answer: |-
  Here is the procedure. It is designed to be run in five minutes at 11pm. It blends the historian's distinction between *conditions* and *causes* with Mackie's INUS theory and Lewis's counterfactuals, but filters them through narrative necessity.

  ### The Causal Filter Procedure

  **Step 1: The Contrastive Question (Van Fraassen)**
  Causation is not a property of an event; it is an answer to a specific question. Write down the question your scene is answering.
  *   *Format:* "Why did Event Y happen *at this specific time/place* rather than *not happening* (or happening later)?"
  *   *Stop rule:* If you cannot frame the contrast, you are describing a state of being, not a cause.

  **Step 2: The INUS Scan (Mackie)**
  List the factors contributing to Event Y. Label them:
  *   **Condition:** A static state required for the event (e.g., dry wood).
  *   **Trigger:** A dynamic change that initiates the event (e.g., the match).
  *   *Rule:* In narrative, **Triggers** belong to characters or specific decisions. **Conditions** belong to the setting or history.
  *   *Selection:* To avoid "textbook syndrome," select the factor that changed *most recently* relative to the event.

  **Step 3: The Counterfactual Test (Lewis)**
  Ask: "If Factor X were removed, would Event Y still have occurred *in this specific narrative way*?"
  *   **Yes:** Factor X is not the narrative cause. It is background.
  *   **No:** Factor X is a candidate for *the* cause.
  *   *Note:* If multiple factors pass this test (Overdetermination), proceed to Step 4.

  **Step 4: The Agency/Theme Handoff**
  If Step 3 leaves you with multiple valid causes (e.g., both the Blight and the Policy caused the deaths), the choice is no longer factual. It is **focalization**.
  *   **Ask:** "Whose pain is this scene about?"
  *   **Choice A (Structural):** If the theme is "Man vs. System," the Policy is the cause. The Blight is merely the weapon used.
  *   **Choice B (Existential):** If the theme is "Man vs. Nature," the Blight is the cause. The Policy is merely the failed shield.
  *   **Choice C (Tragic):** If the theme is "Fate," the Cause is irrelevant; the Outcome is the focus.

  **Step 5: The Sentence Construction**
  Write the sentence using the selected factor as the grammatical subject or the active verb.
  *   *Bad:* "Due to the blight and the policy, people died." (Textbook)
  *   *Good:* "The policy turned the blight into a death sentence." (Thematic)

  ***

  ### Running the Procedure on Your Cases

  #### Case 1: The Outbreak of WWI
  *   **Step 1 (Contrast):** Why war in August 1914 rather than peace or war in 1915?
  *   **Step 2 (INUS):**
      *   Alliances = Condition (Static).
      *   Assassination = Trigger (Dynamic, but June).
      *   Mobilization Schedules = Trigger (Dynamic, August).
  *   **Step 3 (Counterfactual):**
      *   If no Assassination? Crisis likely still happens (Serbia/Austria tensions).
      *   If no Mobilization Schedules? Diplomacy likely continues past August.
      *   *Result:* Mobilization is the stronger counterfactual cause for the *timing*.
  *   **Step 4 (Handoff):** Whose story is it?
      *   If it's about soldiers: The Assassination is the *reason they fight*, Mobilization is the *reason they fight now*.
      *   If it's about statesmen: Mobilization is the villain.
  *   **Verdict:** For a novel, pick **Mobilization** as the mechanical cause, but **Assassination** as the emotional cause.
      *   *Sentence:* "The Archduke's death gave them the reason, but the railway timetables gave them no choice." (This acknowledges complexity without listing it).

  #### Case 2: The Famine (Policy vs. Blight)
  *   **Step 1 (Contrast):** Why mass starvation *this time* rather than just crop failure?
  *   **Step 2 (INUS):**
      *   Blight = Condition (Natural).
      *   Policy = Trigger (Human intervention).
  *   **Step 3 (Counterfactual):**
      *   If Blight removed? No famine.
      *   If Policy removed (free market/aid)? Crop failure, but less starvation.
      *   *Result:* Both are necessary conditions for *this specific severity*.
  *   **Step 4 (Handoff):** You said you want the government to be the villain. This is a **Thematic Choice**, not a scientific one.
      *   *Risk:* Reviewers calling you a determinist.
      *   *Mitigation:* Acknowledge the Blight as the *condition* in the prose, but assign the *action* to the Policy.
  *   **Verdict:** The Blight is the setting; the Policy is the plot.
      *   *Sentence:* "The rot took the potatoes, but the embargo took the people." (Distinguishes condition vs. cause).

  #### Case 3: The Heroine and the Storm (The One You Fear)
  *   **Step 1 (Contrast):** Why were they caught in the storm *here* rather than safe at home?
  *   **Step 2 (INUS):**
      *   Storm System = Condition (Natural).
      *   One-Day Delay = Trigger (Human).
  *   **Step 3 (Counterfactual):** You suspect the storm was coming no matter what.
      *   *Test:* If she leaves a day early, does she miss the storm?
      *   *Your Intuition:* No. The storm is overdetermined.
      *   *Result:* **The Delay is not the cause.**
  *   **Step 4 (Handoff):** Here is the hard truth. If you write the delay as the cause, you are lying to the reader about the physics of your world to preserve the illusion of agency.
      *   *Choice A (Honest):* The storm was inevitable. Her delay is irrelevant to the outcome, but reveals her *character* (hesitation, fear). This is Tragedy/Fate.
      *   *Choice B (Illusion):* You fudge the meteorology so the delay *does* matter. This is Drama/Choice.
  *   **Verdict:** **Do not make the delay the cause.** If the storm was inevitable, making her responsible for it makes her a scapegoat, not a protagonist. It reads as "False Agency."
      *   *Sentence:* "She blamed her hesitation for the wind, but the gale had been brewing long before she packed her bag." (This validates the reader's suspicion while keeping the character's guilt).

  ***

  ### Where This Procedure Will Misfire (The Failure Modes)

  **1. The "Condition/Cause" Distinction is Linguistic, Not Ontological**
  *   **The Risk:** This procedure relies on H.L.A. Hart and Tony Honoré's legalistic distinction between "abnormal triggers" (causes) and "normal states" (conditions). Many philosophers (and Marxists) argue this is a bias that privileges human intervention over structural reality.
  *   **The Collapse:** If a reviewer argues that the *Alliance System* (Condition) was more culpable than *Mobilization* (Trigger), this procedure cannot defend you. It prioritizes narrative pacing over structural truth.
  *   **What Changes My Mind:** If you are writing a sociological novel where the *point* is to show that individuals don't matter, you must invert Step 2. Make the Condition the subject of the sentence. ("The alliances dragged the kings into war," not "The kings activated the alliances.")

  **2. The Counterfactual is Unknowable (Chaos Theory)**
  *   **The Risk:** In the Heroine/Storm case, you *suspect* the storm was inevitable. But in a chaotic system, a one-day delay *could* theoretically change the outcome.
  *   **The Collapse:** If you are writing Hard Realism, you must know the weather. If you are writing Literary Fiction, the "truth" is the character's belief.
  *   **What Changes My Mind:** If the storm is a metaphor for her internal state, then the delay *is* the cause, regardless of meteorology. In that case, ignore Step 3.

  **3. The "Villain" Bias (Step 4)**
  *   **The Risk:** Step 4 asks "Whose pain is this?" This inherently selects for human agency. It struggles with "Act of God" scenarios.
  *   **The Collapse:** In the Famine case, if the historical consensus is that the Policy *mitigated* the Blight (but failed), calling Policy the "Villain" is revisionism.
  *   **What Changes My Mind:** If your primary contract is with Historical Accuracy rather than Narrative Arc. If accuracy is paramount, you must use the "Two-Sentence Compromise" (e.g., "The blight starved the land; the law starved the people.").

  ### Summary for the 11pm Deadline
  1.  **WWI:** Blame the Timetables (Mechanism), mention the Archduke (Spark).
  2.  **Famine:** Blame the Policy (Agent), treat Blight as the Weapon.
  3.  **Heroine:** **Do not blame the delay.** If the storm is inevitable, her guilt is psychological, not causal. If you write it as causal, you risk the "Idiot Plot" critique where characters create problems that shouldn't exist.

  **The Verdict on the Heroine:** You are right to worry. If you know the storm was inevitable, and you write it as if her choice caused it, you are trading **Integrity for Melodrama**. Readers forgive tragedy; they rarely forgive manipulated physics. Let the storm be fate. Let her guilt be the wound.
