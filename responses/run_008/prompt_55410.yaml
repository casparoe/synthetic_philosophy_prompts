      *   **Issue 2 (Self-Defeating Elimination):** This is a consequence of Weak Dominance. If $A$ weakly dominates $B$, we delete $B$. Later $A$ gets deleted. If we had kept $B$, maybe $A$ would have been deleted first, leaving $B$.
