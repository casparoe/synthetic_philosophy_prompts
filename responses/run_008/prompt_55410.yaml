answer: |-
  You have stumbled onto one of the open secrets of introductory game theory. Textbooks love to teach the "crossing out" method (Iterated Elimination of Dominated Strategies) as a clean, mechanical algorithm. But as you've noticed, the algorithm behaves very differently depending on *how* you cross things out.

  You aren't imagining things. The "crossing-out mess" has a formal name, or rather, a cluster of names depending on which specific pathology you're looking at.

  Here is the breakdown of the phenomena you've identified, the formal terms for them, and the theorem that tells you when you're safe.

  ### 1 & 2. Order Dependence and Self-Defeating Elimination
  **The Formal Term:** **Order Independence vs. Path Dependence in Iterated Elimination.**

  Your observation in point #2 is the smoking gun. If you eliminate a strategy because it is dominated by another strategy, but *that* dominating strategy is later eliminated, you have run into the problem of **Weak Dominance**.

  *   **Strict Dominance:** Strategy $A$ is *strictly* dominated by $B$ if $B$ yields a strictly higher payoff than $A$ in *every* possible scenario.
      *   **Theorem:** Iterated Elimination of **Strictly** Dominated Strategies (IESDS) is **order-independent**. It does not matter what order you cross them out in; you will always end up with the same final set of strategies. Furthermore, IESDS never eliminates a Nash Equilibrium.
      *   **Safety:** This procedure is "safe." Your friend who says "whenever domination is strict, all trouble goes away" is quoting a standard theorem correctly.

  *   **Weak Dominance:** Strategy $A$ is *weakly* dominated by $B$ if $B$ is at least as good as $A$ in all scenarios and strictly better in at least one.
      *   **The Problem:** Iterated Elimination of **Weakly** Dominated Strategies (IEWDS) is **order-dependent** (path-dependent).
      *   **Why?** Because weak dominance involves indifference. If Player 1 is indifferent between Row 1 and Row 2 against Column A, but prefers Row 1 against Column B, you might delete Row 2. But if you had deleted Column B first (because it was weakly dominated for Player 2), Row 2 might have become strictly better than Row 1.
      *   **The Consequence:** IEWDS can eliminate Nash Equilibria. Depending on the order you cross things out, you might end up with different "solutions," some of which are Nash Equilibria and some of which might not even be stable.

  **Verdict:** If you are using *strict* dominance, your worry in #1 and #2 is mathematically resolved (it won't happen). If you are using *weak* dominance, your worry is valid: the procedure is fragile.

  ### 3. Mixed Strategy Dominance
  **The Formal Term:** **Dominance by Mixed Strategies.**

  Your Friend 1 is right; Friend 2 is suffering from a common conceptual intuition trap.

  *   **The Logic:** Rationality requires that you maximize your expected utility. If a mixed strategy (e.g., 50% Row 1, 50% Row 2) yields a higher expected payoff than a pure strategy (Row 3) regardless of what the opponent does, a rational player would never play Row 3.
  *   **The "Randomization" Worry:** Friend 2 thinks that to use a mixed strategy as a benchmark, you must intend to play that mix. That is incorrect. You are not saying "I will play this mix." You are saying "Even if I *were* allowed to play this mix, it would beat Row 3. Since I can do better than Row 3 without even committing to a specific pure strategy, Row 3 is irrational."
  *   **Safety:** Eliminating strategies strictly dominated by **mixed** strategies preserves the order-independence property of IESDS. It is safe.

  ### 4. Best Reply vs. Dominance
  **The Formal Term:** **Rationalizability.**

  The procedure your lecturer used ("delete anything that's never a best reply") is the foundation of a solution concept called **Rationalizability** (developed by Bernheim and Pearce in the 1980s).

  *   **2-Player Games:** In a two-player game, a strategy is strictly dominated if and only if it is never a best response. So, in 2-player games, IESDS and Iterated Elimination of Never Best Responses (IENBR) yield the exact same result.
  *   **3+ Player Games:** This equivalence breaks down. In games with 3 or more players, a strategy might not be dominated by any single strategy (or mix) of your opponents, but it might still never be a best response to any *correlated* belief about what they do.
      *   IENBR is generally more "aggressive" than IESDS in multi-player games.
      *   However, if you are eliminating *weak* best responses (strategies that are sometimes a best reply but not always), you run back into the **Order Dependence** problem from point #1.
      *   If you eliminate only strategies that are *never* a best response to any rationalizable belief (strict), the procedure is order-independent and leads to the set of **Rationalizable Strategies**.

  ### So, what do we call this "Mess"?

  There isn't one single catchy phrase in the literature, because theorists treat Strict and Weak dominance as fundamentally different beasts. However, since you asked to coin a term for this specific cluster of intuitions regarding the fragility of the crossing-out procedure, I propose:

  **The Iterated Elimination Sensitivity Problem.**

  This covers the sensitivity to order (Point 1), the sensitivity to the justification of elimination (Point 2), and the sensitivity to the definition of dominance (Points 3 & 4).

  ### The "Safe Zone" Summary

  If you want to cross things out without losing sleep, here is the boundary map:

  | Procedure | Condition | Order Independent? | Preserves Nash Eq? | Formal Name |
  | :--- | :--- | :--- | :--- | :--- |
  | **Cross out Dominated** | **Strict** (Pure or Mixed) | **YES** | **YES** | **IESDS** |
  | **Cross out Dominated** | **Weak** | **NO** | **NO** (Can delete NE) | **IEWDS** |
  | **Cross out Not Best Reply** | **Strict** (Never a best response) | **YES** | **YES** | **Rationalizability** |
  | **Cross out Not Best Reply** | **Weak** (Sometimes a best response) | **NO** | **NO** | **N/A** (Ad hoc) |

  ### The Bottom Line
  Your intuition is sharper than the textbooks you are reading. The textbooks simplify the world by assuming you will only use **Strict Dominance**.

  *   If you stick to **Strict Dominance** (including dominance by mixed strategies), the procedure is robust, order-independent, and theoretically sound.
  *   The moment you allow **Weak Dominance** (crossing out a row because it is *equal* to another in some cases but worse in others), you enter the "mess." The result depends on the order, and you might throw away valid equilibria.
  *   The "Best Reply" method is essentially **Rationalizability**. It is a stronger concept than Dominance in 3+ player games but collapses to the same thing in 2-player games.

  **Recommendation:** When solving textbook problems, if the problem doesn't specify, assume **Strict Dominance**. If you find yourself needing to use Weak Dominance to get to a single box, add a footnote to yourself: *"Solution is path-dependent; other Nash Equilibria may exist that were eliminated by the order of operations."*

  You have effectively rediscovered the difference between **IESDS** and **IEWDS**, and the relationship between **Dominance** and **Rationalizability**. That is not a "mess"; that is the actual substance of non-cooperative game theory.
