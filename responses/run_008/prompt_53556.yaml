  2.  **Deconstruct the Package of Views:**
      *   (1) *Causal Closure of the Physical (CCP):* Every physical event has a sufficient physical cause.
      *   (2) *Physicalism (Identity/Supervenience):* Phenomenal properties = physical properties (or necessarily supervene).
      *   (3) *Epiphenomenalism of the Phenomenal:* Phenomenal character *as such* is causally idle. Fix neural/functional facts, downstream effects stay the same regardless of qualia.
      *   (4) *Acquaintance-based Justification:* Judgments about pain are warranted by direct acquaintance with the pain, not neural facts.
      *   (5) *Fallible Introspection:* Introspection is theory-laden, perceptual-like, not infallible.
      *   (6) *Zombie Justification Symmetry:* A zombie twin's claims to consciousness are as justified as mine.
      *   (7) *Evolutionary Story:* There's a good evolutionary explanation for why we talk about experiences.

  3.  **Initial Brainstorming & Pairwise Comparison:**

      *   *(1) + (2) + (3):* This is the classic Epiphenomenalist Physicalist stance. If physical is closed (1) and mental is physical (2), then mental *should* be causal. But (3) says mental *as such* is idle.
          *   *Tension:* If Mental = Physical (2), and Physical is Causal (1), then Mental is Causal. Denying this (3) looks like a contradiction unless you distinguish "phenomenal property" from "physical property" despite claiming identity/supervenience. This is the "Causal Exclusion" problem.
          *   *Severity:* High. This is the core metaphysical tension.

      *   *(3) + (4):* If qualia are causally idle (3), how do they warrant judgments (4)? Warrant usually implies a causal or counterfactual link. If the pain didn't cause the judgment (because the neural cause did all the work), how does acquaintance justify it?
          *   *Tension:* Epistemic vs. Metaphysical. If qualia don't do anything, how do we know them well enough to judge them?
          *   *Severity:* High. This is the "Knowledge Argument" flip-side or the "Paradox of Epiphenomenalism."

      *   *(3) + (6):* If I'm an epiphenomenalist (3), my zombie twin behaves exactly like me. If my justification depends on causal contact with qualia, the zombie lacks that. But (6) says justification is equal.
          *   *Tension:* If (3) is true, my belief is caused by neural states, not qualia. The zombie's belief is caused by neural states. So justification *could* be equal (reliabilism?). But (4) says justification is by *acquaintance*. Zombies can't be acquainted.
          *   *Severity:* Very High. (4) and (6) clash directly given (3).

      *   *(4) + (5):* Direct acquaintance (4) vs. Fallible/Theory-laden (5).
          *   *Tension:* "Acquaintance" often implies infallibility or direct givenness. "Theory-laden perception" implies construction and error.
          *   *Severity:* Medium. Can be reconciled (e.g., direct but noisy channel), but requires careful wording.

      *   *(3) + (7):* Evolution selects for fitness. If qualia are causally idle (3), they don't affect behavior. Why would evolution select for talking about them (7)?
          *   *Tension:* Evolutionary explanation usually requires causal efficacy. If qualia don't cause behavior, why did the *concept* of qualia evolve?
          *   *Severity:* Medium-High. Requires a "free rider" explanation or an illusionist story.

      *   *(2) + (3):* If Phenomenal = Physical (Identity), how can Physical be causal but Phenomenal be idle?
          *   *Tension:* Leibniz's Law. If $P = M$, and $P$ causes $E$, then $M$ causes $E$. Saying $M$ is idle while $P$ is active is contradictory under identity theory.
          *   *Severity:* Critical. This threatens the coherence of the physicalism claim.

  4.  **Synthesizing the Tensions (Drafting the Audit):**

      *   *Core Conflict:* The "Epiphenomenalist Physicalist" bind. You want to be a physicalist (2) but keep the causal exclusion argument's conclusion (3). This is unstable.
      *   *Epistemic Conflict:* You want acquaintance-based justification (4) but admit zombies have the same justification (6). If justification comes from acquaintance, zombies (no qualia) can't have it. If zombies have it, justification doesn't come from acquaintance.
      *   *Evolutionary Conflict:* Evolution (7) explains behavior. If qualia are idle (3), evolution explains the neural/functional, but not the *phenomenal talk* specifically, unless that talk is systematically mistaken or the qualia are actually causal.

  5.  **Ranking the Tensions:**

      1.  **(2) + (3) + (1): The Metaphysical Contradiction.** Identity Physicalism + Causal Closure + Epiphenomenalism. If $M = P$ and $P$ causes $B$, $M$ causes $B$. Denying this is word-play.
      2.  **(4) + (6) + (3): The Epistemic Collapse.** Acquaintance requires the thing existed. Zombies don't have the thing. If justification is equal, acquaintance isn't doing the work.
      3.  **(3) + (7): The Evolutionary Puzzle.** Harder to solve if qualia are truly idle. Why talk about them?
      4.  **(4) + (5): The Introspective Tension.** Manageable but needs nuance.

  6.  **Developing Repairs/Costs:**

      *   *Fixing (2)+(3):* Drop Identity. Go for Non-Reductive Physicalism (but face exclusion again) or Panpsychism (qualia are physical, so causal). Or drop Epiphenomenalism (3).
      *   *Fixing (4)+(6):* Drop Acquaintance (4). Go for Reliabilism or Interpretivism. Or drop Zombie Symmetry (6) (skeptical route).
      *   *Fixing (3)+(7):* Illusionism. We talk about experiences because we are wired to model ourselves that way, even if the "inner glow" is idle.

