prompt: |-
  you're a specialist in philosophy of mind, and I want a consistency audit of a package of views I've drifted into — the kind of thing I'd normally make a grad student do to me, so be ruthless. Think carefully and brainstorm the pairings before you commit to a verdict. Here's the package: (1) the physical domain is causally closed; (2) I'm a physicalist — phenomenal properties are identical to, or at least necessarily supervene on, physical properties; (3) nonetheless, phenomenal character as such is causally idle: fix the neural and functional facts and nothing downstream changes, no matter what the qualia are like; (4) when I judge that this pain is awful, the judgment is warranted by direct acquaintance with the pain itself, not by any neural fact; (5) at the same time I think introspection is a fallible, theory-laden faculty, more like perception than reading off a gauge; (6) my zombie twin's sincere claims to be conscious would be exactly as justified as mine; and (7) I think theres a perfectly good evolutionary story about why we came to talk about our experiences. Which of these are genuinely in tension, which only look that way, and which pairings dissolve once you think harder? Rank the real tensions by severity, say what would have to give in each case and what the repair costs, and then tell me which single revision would clean up the most. I honestly dont know where the weakest joint is, so don't soften it — I'd rather hear it from you than in a seminar Q&A.
