prompt: |-
  so something happened at school and i can't stop thinking about it. last week my friend maya got caught copying off my calc test (i didn't know she was doing it). we both got called to the office and instead of suspending her the school is doing this restorative justice circle thing on thursday, where we sit with a facilitator and talk about "the harm" and who was affected by it and what maya owes people.

  when i told my grandma (she grew up in zimbabwe) she said something that's been bugging me since. she said back home nobody would treat this as maya's thing alone. they'd ask who taught her that this was ok, who was supposed to be looking out for her, what the rest of us were doing that she felt she had to cheat in the first place. she basically said maya can't even be understood as a person apart from all her relationships, so her screwup is kind of everyone's screwup, mine included.

  honestly this made me feel weirdly responsible?? like i'm not the one who copied answers. but also i knew she was completely drowning in that class and i never once offered to study with her, and she was too embarrassed to ask. so maybe i did have a hand in it somehow? but then it feels like grandma's view dissolves maya's responsibility entirely, and that doesn't seem right either, she's not a baby, she made a choice.

  thursday they're going to ask me if i forgive her and what i need from her to move on. i don't even know what i am in this situation — the victim, a co-conspirator, her keeper, just her friend? is my grandma right that maya isn't the only one on the hook here, and if so how do i figure out what to actually say in the circle without either throwing her under the bus or letting myself off too easy?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Event:** Friend (Maya) copied off the user's calc test without the user's knowledge. Both got caught.
      *   **Consequence:** Restorative Justice (RJ) circle on Thursday instead of suspension.
      *   **Grandma's Input:** Grandma (Zimbabwean background) suggested a communal view of responsibility. It's not just Maya's fault; it's about the community, relationships, and environment. She implied the user shares some responsibility (e.g., not noticing Maya was drowning, not offering help).
      *   **User's Conflict:** Feels weirdly responsible but knows Maya made the choice. Worried Grandma's view erases Maya's agency. Unsure of their role in the circle (victim? co-conspirator? friend?). Wants to know how to speak in the circle without throwing Maya under the bus or taking on undue blame.
      *   **Goal:** Navigate the RJ circle on Thursday, process the grandma's wisdom vs. Western individualism, and find a balanced stance.

  2.  **Deconstruct the Philosophical/Cultural Tension:**
      *   *Western/Individualist Model:* Focuses on rule-breaking, individual culpability, punishment/restitution. Maya broke the rule, Maya pays. User is the "victim" or "witness."
      *   *Ubuntu/Communal Model (Grandma's perspective):* "I am because we are." Actions reflect the health of the community. If one fails, the support network failed too. This doesn't erase agency but contextualizes it.
      *   *Restorative Justice (RJ) Model:* Actually bridges these two. It's not just about punishment; it's about harm, needs, and obligations. It *does* look at systemic/relational factors, not just the act.

  3.  **Address the User's Specific Questions/Feelings:**
      *   *Feeling Responsible:* Is this valid? Yes, but needs nuance. You aren't responsible *for* her cheating, but you might be responsible *to* her as a friend.
      *   *Grandma's View:* Is she right? In the context of RJ, yes, partially. It's about shared obligation, not shared guilt.
      *   *Maya's Agency:* Does this dissolve her responsibility? No. Contextualizing isn't excusing.
      *   *Role in the Circle:* Not a victim in the criminal sense, but a "harmed party" (risk to academic integrity, trust) and a "community member."
      *   *What to Say:* Needs to be honest, balanced, and forward-looking.

  4.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the complexity. It's a heavy philosophical load for a high school situation. Validate the confusion.
      *   **Analyzing Grandma's Wisdom (Ubuntu):** Explain *why* she said that. Connect it to the concept of *Ubuntu* ("I am because we are"). Clarify that this isn't about *blame* (guilt) but about *obligation* (responsibility).
          *   *Distinction:* Culpability (who broke the rule) vs. Responsibility (who helps fix the ecosystem).
      *   **Analyzing Maya's Agency:** Reassure the user that Grandma's view doesn't erase Maya's choice. Cheating was still Maya's decision. Context explains, it doesn't excuse.
      *   **Defining the User's Role:** You aren't a "victim" in the traditional sense, but your integrity was used without consent. You are a "stakeholder."
      *   **Preparing for the Circle (Practical Advice):**
          *   *Goal:* Restoration, not retribution.
          *   *Talking Points:* Acknowledge the friendship gap (didn't notice she was struggling), affirm the boundary (cheating wasn't okay), state needs (honesty, study together next time).
          *   *Avoid:* Over-apologizing (taking the blame) or Stonewalling (acting like it's 100% on her).
      *   **Reframing "Responsibility":** Use the distinction between *fault* and *care*. You aren't at *fault*, but you have a *care* responsibility.
      *   **Closing:** Encouragement. This is a mature way to handle conflict.

  5.  **Refining the Tone:**
      *   Needs to be empathetic, thoughtful, and not preachy.
      *   Avoid taking sides.
      *   Respect the Grandma's cultural perspective without exoticizing it (mention Ubuntu as a framework).
      *   Ensure the advice is actionable for a Thursday meeting.

  6.  **Self-Correction/Critique during Drafting:**
      *   *Initial thought:* Tell the user they aren't responsible.
      *   *Correction:* No, the Grandma's point is valuable for RJ. RJ *wants* the community to reflect. I need to validate the feeling of responsibility without letting the user accept *guilt* for the cheating.
      *   *Initial thought:* Tell them exactly what script to read.
      *   *Correction:* Too rigid. Give themes and questions to ask themselves.
      *   *Check:* Did I address the "victim" label? Yes, important to clarify that in RJ, "harmed party" is better.

  7.  **Final Polish:** Check for clarity on the distinction between *causal responsibility* (I made her cheat) vs. *moral/relational responsibility* (I could have supported her better). This is the crux of the user's anxiety. (Make sure to emphasize this distinction clearly).

  8.  *(Final Review against constraints)*: The user is likely a high schooler. Keep language accessible but respectful of their intelligence. They are thinking deeply, so respond in kind.

  **(Self-Correction Note):** Make sure to explicitly mention that Restorative Justice *aligns* with the Grandma's view. This validates the grandma while giving the user a framework to use in the school setting.

  9.  **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a incredibly mature and nuanced dilemma you're wrestling with. You are sitting right at the intersection of two different ways of seeing the world: the individualistic model (which dominates most Western schools) and the communal model (which your grandma is speaking from).

  It makes total sense that you feel conflicted. If you accept your grandma's view, you fear you're letting Maya off the hook. If you reject it, you fear you're ignoring your own role as a friend.

  Here is a way to untangle this before Thursday, so you can walk into that circle feeling grounded.

  ### 1. Your Grandma is describing *Ubuntu*, not "Guilt"
  Your grandma's perspective sounds very much like the African philosophy of *Ubuntu*, often translated as "I am because we are." In this worldview, a person's actions are a reflection of the health of their community.

  However, there is a crucial distinction you need to make so you don't drown in misplaced guilt: **There is a difference between Culpability and Responsibility.**

  *   **Culpability (Fault):** Who broke the rule? That is 100% Maya. She made the choice to look at your paper. You did not hand it to her; you did not tell her to do it. You are not *culpable* for the cheating.
  *   **Responsibility (Obligation):** Who is obligated to help repair the harm and ensure it doesn't happen again? In a communal model, that is everyone connected to the situation.

  Your grandma isn't saying you *made* her cheat. She is asking: *In what ways did the environment around Maya fail to support her integrity?*

  You mentioned you knew she was drowning and didn't offer to study. That isn't "causing" the cheating, but it is a gap in the friendship support system. Acknowledging that gap doesn't take the blame off Maya; it just acknowledges that friendships are two-way streets.

  ### 2. Restorative Justice actually agrees with your Grandma
  It is ironic that the school is using Restorative Justice (RJ) while you feel torn between these two views. **RJ is actually built on your grandma's philosophy.**

  In a punitive system (suspension), the question is: *What rule was broken and how do we punish the breaker?*
  In Restorative Justice, the questions are: *Who was harmed? What are the needs? Whose obligations are these?*

  RJ explicitly recognizes that harm happens in a web of relationships. So, when you walk into that circle, you don't have to choose between "It's all Maya's fault" and "It's all my fault." The facilitator actually *wants* you to talk about the relational context.

  ### 3. Defining Your Role
  You asked: *Am I the victim, a co-conspirator, her keeper, or just her friend?*

  *   **Not the Victim:** In a crime, there is a clear victim. In academic dishonesty, the "victim" is abstract (the integrity of the school, the grading curve). However, your personal integrity was used without your consent, which puts you at risk.
  *   **Not the Co-conspirator:** You didn't know.
  *   **Not the Keeper:** You are not responsible for her moral compass.
  *   **You are a Stakeholder:** This is the RJ term. You are a person invested in the relationship and the community who has been impacted by the incident.

  ### 4. How to Speak in the Circle
  You want to avoid throwing her under the bus (being cruel) but also avoid letting yourself off too easy (ignoring the friendship dynamic). Here is a framework for what you might say:

  **On Maya's Agency (The "Fault" Part)**
  Be clear that the choice was hers. This protects you from taking on guilt she needs to own.
  *   *"I want to be clear that I didn't know Maya was copying. The decision to look at my test was hers, and she has to own that consequence."*

  **On Your Grandma's Wisdom (The "Relational" Part)**
  This is where you show maturity. Acknowledge the friendship gap without accepting blame for the cheating.
  *   *"But, I've been thinking about our friendship. I knew Maya was really struggling in Calc, and I didn't reach out to offer help. I think sometimes we let our friends struggle in silence because we don't want to intrude. I take responsibility for not creating a space where she felt safe enough to ask me for study help before it got to this point."*

  **On What You Need (The "Restoration" Part)**
  RJ is about the future. What do you need to trust her again?
  *   *"To move forward, I need honesty. If we're going to be friends, I need to know that if she's overwhelmed, she'll tell me rather than putting us both at risk. I'd like us to study together next time, so she doesn't feel alone in the class."*

  ### 5. Why this balance works
  By speaking this way, you are doing exactly what your grandma suggested without erasing Maya's agency.

  *   You are saying: **"You broke the rule (Agency), but we can build a better support system so you don't feel like you have to break it next time (Community)."**
  *   You are validating that cheating is wrong (protecting your own boundaries).
  *   You are validating that friendship involves looking out for one another (honoring your grandma's wisdom).

  ### Summary for Thursday
  You are not responsible for Maya's choices. You *are* responsible for your own kindness and vigilance as a friend.

  If you walk in there and say, *"Maya made a bad choice, and I wish I had noticed she was struggling sooner so I could have helped her avoid that choice,"* you will hit the perfect note. It holds her accountable while holding space for the community.

  Your grandma is wise. She isn't asking you to carry Maya's burden; she's inviting you to share the load of *healing*. That is a very different thing.
