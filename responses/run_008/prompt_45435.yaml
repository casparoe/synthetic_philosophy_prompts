prompt: |-
  Small grant pot here — enough for maybe three PhD students/postdocs over a couple of years, and I want to put it into judgment aggregation theory (the discursive dilemma / doctrinal paradox world: impossibility results for aggregating sets of verdicts on interlinked propositions rather than just preferences). There are a lot of loose threads in that literature and I'm unsure which are worth pulling, so I want a defended agenda, not a survey.

  Threads I'm aware of, roughly: how to choose between propositionwise majoritarian rules and holistic ones when they give different collective outcomes — including the awkward fact that the answer often seems to depend on how you carved up the issues in the first place; how much of the theory survives when you move from straight yes/no judgments to graded credences or rankings; whether the domain-restriction results (where you assume the group's views fall in some structurally nice subset) are just math puzzles or whether they actually describe real committees; and whether the framework extends in a useful way to aggregating outputs from several AI systems that each give verdicts on linked claims — that last one could matter a lot for model oversight, or it could just be hype riding on a trendy application.

  Rank these, or swap some out for open questions you think matter more. For each: why it's upstream of other work (or not), whether it's tractable for theory people with no lab, and what kind of progress over the next couple years would move it up or down the list. I care more about the reasoning behind the ordering than the list itself — and if you think the honest answer is that the field's core problems are basically solved and only the applications are live, say that and defend it.
