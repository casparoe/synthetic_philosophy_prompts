          *   *Option A: State as Moral Agent.* (The "Organic" view).
          *   *Option B: Causal Liability.* (The "Insurer" view).
          *   *Option C: Vicarious Liability.* (Master/Servant).
          *   *Analysis:* The text allows multiple readings. The drafters (Wilson vs. Clemenceau) likely had different theories in mind.
      *   **Section 3: The Shift to Nuremberg.**
          *   Why the flip? (Lesson learned: punishing a nation breeds resentment; punishing leaders establishes deterrence/norms).
          *   Does Nuremberg absolve the nation? No, but it changes the *mode* of responsibility (Denazification vs. Reparations).
      *   **Section 4: Historians vs. Lawyers.**
          *   Fischer vs. Clark.
