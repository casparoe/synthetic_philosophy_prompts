          *   *Contested:* The *intent* of the drafters (Lloyd George vs. Clemenceau vs. Wilson). Whether Art. 231 was meant as *moral* guilt or just *liability*. The effectiveness of Nuremberg in shifting norms.

      *   **Issue 2: Philosophical Theories of Collective Responsibility.**
          *   *Corporate/Statist View:* The State is a moral agent distinct from its members. It persists over time. (Hegel, Runciman, French).
          *   *Individualist/Reductionist View:* Only individuals act. Collective responsibility is shorthand for aggregated individual responsibility. (Feinberg, May).
          *   *Causal/Liability View:* No moral blame needed, just causation + capacity to pay. (Strict liability).
          *   *Benefit/Unjust Enrichment:* Liability stems from gains received, not just fault.
          *   *Connection:* Versailles seems to mix these. Nuremberg shifts to individual criminal liability but retains state dissolution/reparations (which implies collective cost).

      *   **Issue 3: Historiography (Fischer vs. Clark).**
          *   *Fischer:* German leadership had specific war aims (Griff nach der Weltmacht). Implies intent/guilt.
          *   *Clark:* Systemic failure, "sleepwalkers." Implies shared/causal complexity, less moral guilt.
          *   *Connection to Treaty:* The Treaty needed a *legal* hook for reparations. Historians look for *causal/moral* explanation. They are different projects.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. Set the stage (Versailles vs. Nuremberg).
      *   **Brainstorming/Readings:** List key philosophical and historical texts without endorsing them. (e.g., Feinberg, French, Arendt, Overy, MacMillan).
