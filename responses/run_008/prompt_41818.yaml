      *   **Section 5: Consistency and Coherence.**
          *   Is mixing state and individual responsibility inconsistent? Not necessarily, if using a "distributed responsibility" model.
          *   But Versailles *did* feel inconsistent to Germans (State punished, leaders mostly escaped).
      *   **Conclusion:** Summarize the tension. No single theory explains it all.

