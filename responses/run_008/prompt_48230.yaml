          2.  *Somatic Demand:* Competent self demands treatment (e.g., ventilator) via directive. Doctors refuse based on clinical judgment. Directive *not* honored (cannot compel).
          3.  *Psychiatric Self-Binding (Ulysses Contract):* Competent self says "treat me if I'm psychotic." Psychotic self refuses/screams. Some honor it, many don't (or only if team agrees). It feels more fraught than the dementia case.
      *   **The Question:** What theory of the authority of the earlier self does this pattern presuppose? How does it explain the asymmetry (refusal yes, demand no) and the differential comfort (dementia vs. psych)?
      *   **Candidate Views to Consider:**
          *   Metaphysical Identity (Earlier self = True Self).
          *   Critical vs. Experiential Interests (Dworkin).
          *   Protective Arrangement/Contract with Caregivers.
          *   Distrust of Incompetent Wishes (Disease vs. Person).
      *   **Requirements:**
          *   Main analysis as prose.
          *   Table with specific columns ("Feature", "Presupposes", "Rival Views Ruled Out", "Required or Underdetermined").
          *   Final row in table for "Practice as a Whole".
          *   One-paragraph verdict on coherence.

  2.  **Analyze the Implicit Theory:**

      *   *Feature 1 (Dementia Refusal):* Why honor it? Usually justified by autonomy (past autonomy trumps current welfare) or Critical Interests (Dworkin). The demented self's happiness is "experiential," the earlier self's values are "critical."
      *   *Feature 2 (Somatic Demand):* Why ignore it? Medical integrity/paternalism. Autonomy is negative (right to refuse), not positive (right to demand). Also, resource allocation and non-maleficence. This suggests the earlier self's authority is limited by the *physician's* authority/ethics.
      *   *Feature 3 (Psych Self-Binding):* Why fraught? Because it involves active intervention (force) vs. passive allowing (withholding). Also, psychosis challenges the "true self" notion differently than dementia. In dementia, the self is "gone" or "dimmed." In psychosis, the self is "distorted" but arguably still present and agential. Honoring the Ulysses contract feels like violating the *current* person's bodily integrity more acutely.
      *   *The Tension:* The practice seems to rely on a hybrid view. It treats the earlier self as the "owner" of the life narrative (Dworkin), *but* only when that owner says "stop." When the owner says "go" (demand), the doctor's professional integrity overrides. When the owner says "force me" (psych), the current self's visible suffering/resistance creates a higher barrier than the demented self's passive contentment.

  3.  **Drafting the Prose Analysis:**

      *   *Introduction:* Acknowledge the resident's keen observation. This is the "Problem of Precedent Autonomy."
      *   *The Dominant Theory:* It looks like a modified **Critical Interest Theory** (Dworkin) combined with **Professional Integrity**.
      *   *Explanation:*
          *   *Dementia:* The competent self defines the "shape of the life." The demented self has only experiential interests. Critical > Experiential.
          *   *Demand:* Autonomy is a shield, not a sword. The earlier self cannot compromise the physician's moral agency.
          *   *Psychiatry:* This is the stress test. Why is it harder? Because the psychotic self appears *agential* (screaming, arguing) whereas the demented self appears *passive* (smiling, eating). The "Disease vs. Person" distinction is murkier in psych. Also, active force vs. passive withdrawal.
      *   *Inconsistencies:* The practice treats the earlier self as sovereign regarding *values* (dementia) but not *resources/actions* (demand). It treats the later self as "not really there" in dementia (so ignoring them is fine) but "too present" in psychosis (so overriding them feels violent).
      *   *Alternative (Later Self Counts):* If we valued the later self's experiential interests equally, we wouldn't starve the happy dementia patient. We would treat the Ulysses contract as revocable.

  4.  **Constructing the Table:**

      *   *Row 1: Advance Refusal Honored (Dementia).* Presupposes: Critical interests trump experiential. Rules out: Pure experiential welfare view. Status: Underdetermined (could be Identity or Critical Interests).
      *   *Row 2: Advance Demand Non-binding.* Presupposes: Physician integrity limits patient autonomy. Rules out: Absolute sovereignty of earlier self. Status: Strictly Required (by law/ethics norms).
      *   *Row 3: Psych Self-Binding (Ulysses).* Presupposes: Ambiguous. Sometimes treats earlier self as protector, sometimes treats current refusal as disease noise. Rules out: Pure current autonomy. Status: Underdetermined/Contested.
      *   *Row 4: Present Competent Refusal.* (Need to add this as a baseline). Presupposes: Current autonomy is absolute. Rules out: Paternalism. Status: Strictly Required.
      *   *Row 5: Practice as a Whole.* Presupposes: A hierarchical model where Competence = Moral Authority, but Medical Integrity acts as a veto. Verdict: Incoherent/Hybrid.

  5.  **Refining the "Verdict":**

      *   Is it coherent? No. It tries to be Dworkinian (critical interests) but falls back on Paternalism (demand) and creates a double standard between somatic withdrawal and psychiatric coercion. It relies on a "disappearing self" metaphor in dementia that doesn't hold up in psychosis.

  6.  **Review against Constraints:**

      *   *Prose first?* Yes.
      *   *Table columns correct?* Yes.
      *   *Final row included?* Yes.
      *   *One-paragraph verdict?* Yes.
      *   *Tone:* Professional, academic, suitable for a psychiatry resident.

  7.  **Self-Correction/Nuance Check during Drafting:**

      *   *Correction:* Make sure to distinguish between *withholding* (dementia) and *forcing* (psych). That's a key ethical distinction (acts vs. omissions) that might explain the discomfort, not just the self-identity theory.
      *   *Nuance:* The prompt asks about the *authority of the earlier self*. I need to keep the focus there. The earlier self is treated as the "True Owner" in refusal, but a "Requester" in demands.
      *   *Psychiatry specific:* In psych, the "incompetence" is often fluctuating or contested more than in advanced dementia. The "Disease vs. Person" view is stronger here (the psychosis is the disease, the signature was the person). But the screaming patient *feels* like a person.
      *   *The "Later Self Counts" scenario:* If we shifted to valuing the later self, the dementia patient gets fed (experiential interest in living/eating). The psych patient isn't forced (experiential interest in liberty/no force).

  8.  **Final Polish:** Check the table formatting and ensure the verdict is punchy and direct. (Proceed to generate output).

      *   *Wait, one check on the table columns:* "Feature of the practice", "What it presupposes about the earlier self's authority", "Rival views it quietly rules out", "Strictly required or underdetermined?".
      *   *Make sure the "Practice as a Whole" row synthesizes the inconsistencies.*

  9.  **Finalizing the Prose:** Ensure I address the specific candidate views mentioned in the prompt (Metaphysical, Critical Interests, Protective Contract, Distrust).

      *   *Decision:* The practice implicitly relies on **Critical Interest Theory** for the dementia case, **Professional Integrity** for the demand case, and a mix of **Distrust (Disease)** and **Protective Contract** for the psych case. This eclecticism is the source of the incoherence.

      *(Self-Correction during drafting the response)*: I need to be careful not to just say "it's inconsistent." I need to reconstruct the *implicit* theory that makes sense of it *as it stands*, then show where that theory cracks. The implicit theory is likely "Competence as Moral Agency." When you are competent, you set the rules. When you are not, your rules stand *unless* they require active harm or violate medical integrity. But the "harm" calculation changes between dementia (starvation is allowed) and psych (force is controversial).

      *Actually, the strongest unifying theory is the "Narrative Ownership" view.* The competent self owns the narrative. They can end the story (refusal). They cannot write a sequel that requires the doctor to break character (demand). In psych, the narrative is interrupted, not ended. The Ulysses contract tries to edit the middle of the chapter. That's why it's fraught.

      *Let's stick closer to the prompt's candidate views for clarity.* I will frame the implicit theory as a **Hybrid of Critical Interest Authority and Medical Paternalism.**

