answer: |-
  ### The Implicit Theory of Precedent Autonomy in Clinical Practice

  The pattern of practice you describe reveals an implicit theory that is neither purely metaphysical nor purely consequentialist, but rather a pragmatic hybrid rooted in a **hierarchy of moral agency**. The institution presupposes that the *competent* self is the only moral agent capable of holding "critical interests"—values regarding the shape and integrity of a life narrative—whereas the *incompetent* self possesses only "experiential interests"—immediate welfare, comfort, and preference. In this view, the earlier self's authority is sovereign over the life's narrative arc, but not over the physician's moral integrity.

  This explains the asymmetry between refusal and demand. When the earlier self refuses treatment (the dementia case), they are exercising a negative right to protect the narrative integrity of their life (e.g., "I do not want to live as a vegetable"). Honoring this requires only omission (withholding food), which aligns with the physician's duty to respect autonomy without compromising non-maleficence. However, when the earlier self demands treatment (the ventilator case), they are attempting to commandeer the physician's agency. The practice presupposes that the earlier self's authority terminates where the clinician's professional judgment begins; autonomy is a shield, not a sword.

  The psychiatric self-binding case is more fraught because it destabilizes the distinction between the "narrative self" and the "experiential self." In advanced dementia, the later self is often viewed metaphysically as a "shell"—the person is gone, so honoring the directive does not feel like violating a present agent. In psychosis, the later self is visibly agential (screaming, arguing), even if legally incompetent. Honoring a Ulysses contract here requires active coercion against a resisting agent, not passive allowance of a trajectory. The practice implicitly relies on a **Distrust Theory** here: it assumes the psychotic refusal is "noise" (symptom) and the prior signature is "signal" (person). However, because the intervention is active force rather than passive withdrawal, it triggers a stronger paternalistic alarm. The practice thus rests on an unstable equilibrium: it treats the earlier self as the "True Owner" of the body when withholding care, but treats the physician as the "Guardian" of the body when providing care, and treats the psychotic patient as "Broken" rather than "Gone."

  If we replaced this presupposed view with one where the **later self's interests count in their own right** (a strong experientialist or current-interest view), the practice would shift radically. In the dementia case, the happy, eating patient would be fed, because their current experiential interest in living outweighs the past self's abstract value judgment. In the psychiatric case, the Ulysses contract would likely be rendered revocable or non-binding during the episode; the screaming patient's current refusal would sovereignly override the prior signature, because the current self is the only one experiencing the coercion. The "protective" function of the directive would vanish, replaced by a mandate to maximize the current subject's welfare and liberty, regardless of their past commitments.

  ### Analysis of Practice Features

  | Feature of the practice | What it presupposes about the earlier self's authority | Rival views it quietly rules out | Strictly required or underdetermined? |
  | :--- | :--- | :--- | :--- |
  | **Advance refusal honored (Dementia case)** | The earlier self holds "critical interests" that trump the later self's "experiential interests." The earlier self is the true owner of the life narrative. | **Pure Experientialism:** The view that only current happiness/suffering matters. <br> **Metaphysical Discontinuity:** The view that the demented patient is a wholly new person with new rights. | **Underdetermined:** Could be justified by Critical Interest Theory (Dworkin) OR by a "Distrust" view (demented wishes are not authentic). |
  | **Advance demand non-binding (Somatic case)** | The earlier self's authority is limited by the clinician's professional integrity. Autonomy is a negative right (to refuse), not a positive right (to compel). | **Absolute Sovereignty:** The view that the competent self can bind the future self and the doctor to any course of action. <br> **Contractualism:** The view that the directive is a binding contract caregivers must fulfill. | **Strictly Required:** Legally and ethically codified (e.g., EMTALA, professional conscience clauses). |
  | **Psychiatric self-binding honored over objection** | The earlier self's judgment is more authentic than the later self's. The later self's refusal is attributed to "disease" rather than "person." | **Current Autonomy:** The view that any refusal by the present subject must be respected regardless of capacity fluctuations. <br> **Narrative Continuity:** The view that the psychotic self is still the author of their current wishes. | **Underdetermined:** Highly variable by jurisdiction and clinician. Some honor it as valid consent; others treat it as irrelevant without current capacity. |
  | **Present competent refusal sovereign** | Current competence grants absolute veto power, even over past directives. Competence is the threshold of moral authority. | **Precedent Autonomy Absolutism:** The view that a past directive should bind even a currently competent person (e.g., if they changed their mind "irrationally"). | **Strictly Required:** Legal standard for informed consent. |
  | **Practice as a Whole** | **Hybrid Agency Theory:** Authority resides in the competent self, but is constrained by medical paternalism and the distinction between acts (force) and omissions (withholding). It assumes the demented self is "gone" but the psychotic self is "distorted." | **Consistent Identity Theory:** That the self is the same entity throughout, requiring consistent treatment of wishes. <br> **Pure Welfare Theory:** That maximizing current well-being should always be the goal. | **Inconsistent:** The practice applies different metaphysical standards to dementia (self is gone) vs. psychosis (self is present but ill) to justify similar overrides. |

  ### Verdict

  The implicit theory governing these practices is **philosophically incoherent**, though pragmatically functional. It attempts to simultaneously hold that the earlier self is the sovereign owner of the patient's life (justifying the dementia refusal) and that the physician is the guardian of the patient's welfare (justifying the refusal of demands and the hesitation on psychiatric coercion). This creates a contradiction in how the "later self" is ontologized: in dementia, the later self is treated as a non-agent whose happiness is morally weightless, while in psychiatry, the later self is treated as an agent whose resistance is morally significant enough to make clinicians hesitate, even if legally overridden. The practice avoids collapse only by relying on the act/omission distinction (withholding food vs. forcing meds) to mask the underlying inconsistency regarding whose interests—the past narrator's or the present experiencer's—actually matter.
