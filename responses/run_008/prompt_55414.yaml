answer: |-
  This is a profound question that sits at the intersection of statistical mechanics, philosophy of science, and machine learning theory. You are asking for the boundary between **ontologically robust emergence** and **epistemically convenient compression**.

  There is no single settled term, but there is a rich literature that carves this space. The distinction you are drawing is real, but it is often blurred by the fact that both types of regularities yield predictive power.

  Here is the carving you are looking for, organized by existing frameworks, the principled distinction, the ontology of the second category, and the boundary cases.

  ### 1. The Nearest Named Concepts

  Three frameworks come closest to your distinction, but each misses a specific nuance you highlighted.

  **A. Dennett's "Real Patterns" (The Intentional Stance)**
  Daniel Dennett addresses your chess engine and spam filter examples directly. He distinguishes between the *Physical Stance* (predicting via physics/code), the *Design Stance* (predicting via function), and the *Intentional Stance* (predicting via beliefs/desires).
  *   **The Fit:** Dennett argues that "wanting to trap the rook" is a **Real Pattern**. It is not "mere ignorance." If a pattern allows for compression and prediction that converges across independent observers, it is real.
  *   **The Miss:** Dennett tends to flatten the distinction you care about. He would argue that *both* the piston pressure and the chess "want" are real patterns, just at different levels of abstraction. He doesn't sharply distinguish the ones that survive unbounded scrutiny from the ones that dissolve.

  **B. The Renormalization Group (RG) / Effective Field Theory**
  In physics, this explains your piston example. RG flow describes how parameters change as you "zoom out" (coarse-grain).
  *   **The Fit:** Some variables are **Renormalizable**. As you integrate out micro-details, the macro-parameters (pressure, temperature) flow to stable fixed points. The macro-dynamics become *autonomous*; you don't need the micro-details to predict the macro-future.
  *   **The Miss:** This is well-defined for physical systems with known symmetries. It is less formally defined for high-dimensional customer data where the "micro-laws" are unknown. However, it provides the mathematical intuition for your first category.

  **C. Sufficient Statistics vs. Information Bottleneck**
  In information theory, a statistic $T(X)$ is sufficient for a parameter $\theta$ if $P(\theta | X) = P(\theta | T(X))$.
  *   **The Fit:** Your piston case describes a **Minimal Sufficient Statistic** that remains sufficient even as the observation space $X$ expands. Your cluster case describes a statistic that is sufficient *only relative to a specific loss function or model class*.
  *   **The Miss:** Standard sufficiency assumes a fixed generative model. You are asking about what happens when the *model class* expands (the "larger model" that dissolves the clusters).

  ### 2. The Principled Carving: Dynamical Autonomy vs. Computational Heuristics

  To answer your request for a definition, I propose distinguishing between **Dynamically Autonomous Regularities** and **Computationally Parasitic Regularities**.

  **Category 1: Dynamically Autonomous (The Piston)**
  *   **Definition:** A coarse-graining where the macro-variables form a **closed dynamical system**. The future macrostate depends *only* on the current macrostate, not on the specific microstate within that macro-class.
  *   **The Test:** If an omniscient predictor simulates the system, do the microstates corresponding to Macrostate $A$ evolve into microstates corresponding to Macrostate $B$ *regardless* of which specific microstate in $A$ you started with?
  *   **Why it survives scrutiny:** The equivalence classes are stable under the system's dynamics. The "information loss" of coarse-graining is irrelevant because the lost information is causally inert regarding the macro-future.
  *   **Literature:** This is often called **Causal Emergence** (Erik Hoel et al.) or **Autonomy of Higher Levels** (Philip Anderson's "More is Different").

  **Category 2: Computationally Parasitic (The Clusters/Intent)**
  *   **Definition:** A coarse-graining that exploits **computational irreducibility** or **resource bounds** of the predictor. The regularity exists because the predictor *cannot* distinguish the micro-details that would violate the pattern.
  *   **The Test:** If you expand the feature space (add more sensors, more history), does the cluster boundary blur or dissolve? Does the "intent" become ambiguous when you see the source code?
  *   **Why it dissolves:** The equivalence classes are not stable under the system's dynamics; they are stable only under the *observer's projection*. The pattern relies on the noise of the micro-details averaging out *relative to the observer's resolution*.
  *   **Literature:** This aligns with **Bounded Rationality** (Herbert Simon) and **Epistemic Emergence**.

  ### 3. Is the Second Category "Real"?

  You asked if the second category is a way of being real or just ignorance. You noted that independently built predictors land on the same groupings.

  **Verdict: It is Intersubjectively Real, but Ontologically Fragile.**

  It is not "mere ignorance" (like seeing a face in a cloud), because it converges across observers. This convergence suggests the data manifold has **geometry** that aligns with your budget constraints.
  *   **The Face in the Clouds:** Different observers see different faces. (Noise/Pareidolia).
  *   **The Face in the Crowd:** Different observers agree there is a face. (Signal).
  *   **The Cluster:** Different models agree on the cluster *at that resolution*.

  However, it is **Observer-Relative Reality**. The cluster is a property of the *system-predictor pair*, not the system alone. The piston pressure is a property of the *system* (mostly) independent of the predictor.

  In philosophy, this is sometimes called **Perspectival Realism**. The regularity is real *from the perspective of a bounded agent*. Since all actual agents (including us) are bounded, these regularities are pragmatically indistinguishable from "fundamental" ones, except when we try to scale compute.

  ### 4. Where Do Belief and Desire Fit?

  This is the hardest case. Does a human "want" coffee?

  *   **The Argument for Category 2:** If I map your entire connectome and simulate your neurons, I might predict the coffee-grabbing move without ever invoking the variable "want." The "want" dissolves into electrochemical gradients.
  *   **The Argument for Category 1:** Even with a connectome map, the system might be **computationally irreducible**. The only way to predict the outcome is to run the simulation. In that case, the "Intentional Stance" (wanting) is a **lossless compression** of the simulation. It is a "shortcut" that even an omniscient computer might use to save time, because the macro-dynamics of "belief/desire" are computationally cheaper than the micro-dynamics of "ions/channels," even if the latter are fundamental.

  **Placement:** Belief/Desire prediction likely sits on the boundary. It is **Computationally Robust** but **Dynamically Leaky**.
  *   *Leaky:* People act against their desires (akrasia), revealing the micro-details breaking the macro-pattern.
  *   *Robust:* It predicts better than random across almost all bounded observers.
  *   *Classification:* It is a **High-Level Heuristic** (Category 2) that is so stable due to evolutionary constraints that it *mimics* Dynamical Autonomy (Category 1).

  ### 5. Proposed Definition and Boundary Cases

  If you need a terminology for your work, I propose distinguishing between **Invariant Coarse-Grainings** and **Bounded Projections**.

  **Definition:**
  A regularity is an **Invariant Coarse-Graining** if the mutual information between the Macro-State at $t_1$ and Macro-State at $t_2$ remains high (near 1) even as the Micro-State resolution increases indefinitely.
  A regularity is a **Bounded Projection** if that mutual information decays as Micro-State resolution increases, but remains high relative to the cost of computation.

  **Applying the Boundary Cases:**

  1.  **Water Coming to a Boil (Invariant):**
      *   *Verdict:* Category 1.
      *   *Reason:* Phase transitions are singularities in the thermodynamic limit. No amount of micro-tracking dissolves the distinction between liquid and gas. The macrostate is dynamically autonomous.

  2.  **A Flock Heading South (Invariant/Borderline):**
      *   *Verdict:* Leaning Category 1.
      *   *Reason:* While composed of individuals, the flock dynamics often follow fluid-dynamic equations (Eulerian view vs. Lagrangian view). If you track every bird, the "flock" vector still predicts the mass movement better than individual vectors due to coupling. The "flock" is a stable attractor.

  3.  **Face in a Crowd (Bounded):**
      *   *Verdict:* Category 2.
      *   *Reason:* "Face" is a classification imposed by a visual cortex (or CNN). If you zoom in to pores and photons, the "face" boundary dissolves into skin texture. It is a feature of the *classifier*, not the *skin*. However, because human skin is constrained by biology, the pattern is stable across classifiers.

  4.  **Face in the Clouds (Noise):**
      *   *Verdict:* Not a Regularity.
      *   *Reason:* Does not converge across independent predictors. Low mutual information.

  5.  **Customer Clusters (Bounded):**
      *   *Verdict:* Category 2.
      *   *Reason:* As you noted, more features dissolve the cluster. The cluster was a shadow of high-dimensional data cast on a low-dimensional wall. It is a **Bounded Projection**.

  ### Summary for Your Work

  You are distinguishing between **Renormalizable Patterns** (which survive the limit of infinite resolution/compute) and **Effective Patterns** (which exist only within a specific computational budget).

  *   **Use "Renormalizable"** when the macro-dynamics are closed and stable under scrutiny (Piston, Boiling Water).
  *   **Use "Effective"** or **"Bounded"** when the pattern is a lossy compression that yields high ROI on prediction but dissolves under higher resolution (Clusters, Spam Personas, Chess Intent).

  Both are "real" in the sense that they carve nature at joints that allow prediction. But only the first kind carves joints that exist independently of the knife you are using. The second kind carves joints that exist *because* of the specific knife you are using.

  For your modeling: Treat **Effective Patterns** as technical debt. They will work until your compute budget expands or your feature set deepens, at which point they will vanish. Treat **Renormalizable Patterns** as structural features of the system that will persist regardless of model architecture.
