      *   *Initial thought:* Maybe compare Paradigm to "Editorial Mission."
      *   *Correction:* Too high level. Better to compare it to the "Narrative Frame" of a specific story type. The "Breakthrough Story" is a paradigm.
      *   *Check on Incommensurability:* I need to be careful not to say journalism *is* relativistic. It's not. But its *vocabulary* assumes realism. Kuhn challenges realism. The clash is ontological.
      *   *Check on "Crisis":* In journalism, crisis is often economic (layoffs). I need to distinguish between business crisis and *epistemic* crisis (loss of authority). The prompt asks about professional self-image, so focus on the latter.
      *   *Refining the "Anomaly":* In science, an anomaly is a fact. In journalism, an anomaly is often a *source* or a *data point* that kills the narrative arc. Editors kill stories not because they are false, but because they are "nuanced" (i.e., don't fit the binary frame). That's a strong parallel.

  9.  **Final Polish:** Check against the "Don't condescend" rule. Ensure the distinction between "framing" (selection) and "paradigm" (constitution) is clear in the residue report. (Framing = selecting from a bowl of fruit. Paradigm = deciding what counts as fruit.)

  10. **Final Review against Prompt:**
