      *   *Check:* American English? *Yes.* (e.g., "defense" not "defence", "program" not "programme").
      *   *Check:* Addressing the "Residue." The user asks if it's factual, empirical, or temperamental. I need to be honest: it's likely temperamental/normative at the bedrock, but framed as metaphysical.

