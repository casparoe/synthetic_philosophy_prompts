prompt: |-
  I'm putting together a dissertation proposal for my MA (one term, roughly 15,000 words) and my idea is only half formed, so I need you to turn it into a proper proposal for me. The topic is Goodman's new riddle of induction. My half-formed thought is this: the standard 'vocabulary relativity' reply to grue — that grue only looks gerrymandered relative to our colour words, and that from the grue-speaker's point of view 'green' is the weird one — seems to me to concede too much, because the grue-speaker's vocabulary has to contain some expression for the cutoff time t, whereas our colour vocabulary doesn't need any expression for a time at all. Maybe that asymetry (needing a temporal parameter versus not needing one) can be turned into a principled restriction on which predicates are fit for induction. But I can also see the counter: the grue-speaker can define our 'green' as 'grue before t, bleen after t', so which side 'needs' the time word seems to depend on which vocabulary you start from, and I honestly don't know whether my asymmetry survives that.

  So the proposal should state the question precisely — something like: is there a vocabulary-independent fact about which predicates carry a hidden temporal index? — explain why neither Goodman's own entrenchment story nor the usual gerrymandred intuitions settle it, lay out what I'd actually do week by week (mostly sharpening the symmetry objection and stress-testing my restriction against variants of grue that use spatial position or the observer rather than time, since those may not be affected the same way), say what a positive result and a negative result would each look like, and be honest about what would make the whole thing collapse — I suspect it collapses into the symmetry objection and I want the proposal to face that rather than quietly avoid it. Also flag if the project is too big for one term and what I'd cut.

  Two practical things: my supervisor hates bullet points and headings, so write it as continuous prose, like a long email. And don't put in citations, I'll add those myself. Since my idea is half-formed, I also want you to tell me at the end how confident you are in the framing overall and which part of it you're least sure of. British English please, she's picky about 'color' vs 'colour'.
