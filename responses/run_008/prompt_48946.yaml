answer: |-
  Dear Supervisor,

  I am writing to propose a topic for my MA dissertation, which I intend to submit at the end of this term. The project will centre on Nelson Goodman's New Riddle of Induction, specifically focusing on the predicate 'grue' and the challenges it poses to confirmation theory. While there is a vast literature on this subject, my aim is to interrogate a specific intuition regarding the asymmetry between standard colour predicates and grue-like predicates, an intuition that I feel has not been sufficiently exhausted by the standard replies found in the existing discourse. The working title is something along the lines of 'Temporal Parameters and Projectibility: Investigating Vocabulary-Independent Asymmetries in the New Riddle of Induction', and I anticipate the final piece will run to approximately 15,000 words.

  The core motivation for this project stems from a dissatisfaction with the standard 'vocabulary relativity' reply to the grue paradox. The usual defence suggests that grue only appears gerrymandered relative to our entrenched colour words, and that from the perspective of a grue-speaker, 'green' is the peculiar, disjunctive predicate. My half-formed hypothesis is that this reply concedes too much ground to the sceptic. It seems to me that there is a genuine asymmetry here: the grue-speaker's vocabulary must contain some expression for the cutoff time $t$, whereas our standard colour vocabulary does not require any temporal parameter at all. My central research question will be whether there is a vocabulary-independent fact about which predicates carry a hidden temporal index. If such a fact exists, it could potentially ground a principled restriction on which predicates are fit for induction, moving beyond Goodman's own solution which relies on the pragmatic history of entrenchment.

  However, I am acutely aware of the formidable symmetry objection that stands against this hypothesis. The counter-argument is that the grue-speaker can define our 'green' as 'grue before $t$ and bleen after $t$', meaning that which side 'needs' the time word appears to depend entirely on which vocabulary one starts from. A significant portion of this dissertation will be dedicated to determining whether my proposed asymmetry survives this definitional symmetry. I intend to argue that Goodman's own entrenchment story does not settle this because it is too historical and pragmatic, failing to address the underlying metaphysical or logical structure of the predicates. Similarly, the usual appeals to gerrymandering intuitions do not settle it because they rely on pre-theoretic judgments that the grue paradox is designed to undermine. Therefore, the project seeks to find a structural feature of the predicates themselves, rather than their history or our psychological comfort with them.

  In terms of the work plan for the term, I have divided the remaining weeks into three overlapping phases to ensure I meet the word count and deadline. For the first three weeks, I will be focusing on sharpening the symmetry objection and formalising the claim about temporal parameters. This involves a close reading of the relevant sections of Fact, Fiction and Forecast alongside the primary responses from the literature, though I will be careful not to let the exegesis overshadow the argumentative core. During weeks four through seven, I plan to stress-test my proposed restriction against variants of grue that use spatial position or the observer rather than time. My intuition is that temporal variants might behave differently from spatial ones, and if my asymmetry relies specifically on time, it may not generalise. If the asymmetry holds for time but fails for space, that itself would be a significant result worth documenting. Finally, from week eight through to the submission deadline, I will be drafting and revising the text. I intend to have a complete draft by the end of week ten to allow sufficient time for polishing and checking the argumentative flow.

  Regarding the potential outcomes, I want to be clear about what would constitute success for this project. A positive result would look like a defence of the asymmetry claim, demonstrating that predicates like 'grue' inherently require a temporal parameter in a way that 'green' does not, regardless of the linguistic framework used to define them. This would suggest a path toward a logical or metaphysical solution to the New Riddle. A negative result, however, would also be valuable. If I conclude that the symmetry objection holds and that there is no vocabulary-independent fact about hidden temporal indices, this would reinforce the view that the solution must be pragmatic, contextual, or perhaps that induction lacks the foundational justification we seek. Either way, the project aims to clarify why the relativity reply feels unsatisfying and whether that dissatisfaction is philosophically warranted.

  I must also be honest about the risks involved, as I suspect the project could collapse into the symmetry objection. If I cannot find a way to distinguish the temporal dependency of 'grue' from the definitional dependency of 'green' without begging the question, the central thesis would be untenable. In that event, I would pivot to arguing that the collapse itself demonstrates the necessity of Goodman's entrenchment solution, effectively arguing that the failure of logical asymmetries forces us back into pragmatism. I am also mindful that 15,000 words in one term is a tight constraint for a topic of this density. If the stress-testing against spatial and observer variants proves too voluminous, I am prepared to cut the spatial variants and focus exclusively on the temporal case to ensure the core argument is treated with sufficient depth. I believe this scope management is necessary to avoid producing a superficial survey rather than a rigorous argument.

  Thank you for considering this proposal. I am eager to discuss whether you think this focus is viable and whether the planned scope aligns with your expectations for the programme. I look forward to your feedback.

  ***

  **Confidence Assessment and Meta-Commentary**

  Overall, I am moderately confident in this framing, roughly around a 7 out of 10. The proposal successfully translates your half-formed intuition into a structured philosophical question without overpromising on the solution. It strikes a balance between ambition and the realistic constraints of a one-term MA.

  The part I am least sure of is the feasibility of distinguishing "needing a temporal parameter" from "being definable via a temporal parameter" within the word limit. This is a deep metaphysical issue that often spirals into discussions about natural kinds, causality, or fundamental physics. There is a risk that you will spend too many words explaining why the symmetry objection is tricky rather than advancing your own positive view. If you find yourself stuck in the literature during weeks 1-3, you may need to simplify the "vocabulary-independent fact" claim to something more linguistic or conceptual rather than metaphysical to keep it manageable. Additionally, the plan to test spatial variants is ambitious; if you find the temporal argument is taking all your word count, be prepared to drop the spatial comparison entirely, as the temporal case is the strongest version of your intuition anyway.
