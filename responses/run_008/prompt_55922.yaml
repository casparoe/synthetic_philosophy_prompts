answer: |-
  | Desideratum | Motivating case | Status | Threatens |
  | :--- | :--- | :--- | :--- |
  | **Explanatory Non-Miracle**<br>The position must explain why theories yield novel, precise predictions without invoking luck. | Fresnel's wave theory predicting the Poisson spot (a bright center in a shadow) which was subsequently observed; instrumentalism struggles to explain why "useful fictions" hit novel targets. | **Non-negotiable**<br>(Any philosophy of science that treats predictive success as accidental fails to describe the practice.) | Radical Instrumentalism, Constructive Empiricism (must appeal to "empirical adequacy" which risks looking like realism in disguise). |
  | **Historical Continuity**<br>The position must account for why specific theoretical components survive radical ontology shifts. | Fresnel's equations surviving the transition from the mechanical luminiferous aether to Maxwell's electromagnetic field; the math worked, the substance (aether) did not. | **Non-negotiable**<br>(The history of theory change is fixed data; ignoring it makes the position ahistorical.) | Naive Scientific Realism (commits to discarded entities like phlogiston), Skeptical Anti-Realism (denies continuity entirely). |
  | **Avoid Logical Triviality**<br>The claim that "structure is real" must imply more than that the world has *some* mathematical description. | Newman's objection: Any set of objects can be related to fit any structure if you only fix cardinality; if SR allows *any* structure, it says nothing about the world. | **Non-negotiable**<br>(A claim that is logically compatible with all possible worlds is informationally empty.) | Epistemic Structural Realism (if it relies solely on Ramsey sentences without restricting relations), Ontic Structural Realism (if it cannot specify *which* structure). |
  | **Metaphysical Coherence**<br>The position must clarify whether relations can exist independently of the things they relate. | The friend's objection: Fields and forces seem to require a medium or particle to act; "relations without relata" sounds like a verb without a noun. | **Camp Preference**<br>(Demands a substance ontology; Structuralists argue this is a linguistic bias, not a worldly constraint.) | Ontic Structural Realism (forces a choice: accept "free-floating" structure or smuggle in hidden relata), Entity Realism (insists on relata). |
  | **Observability Boundary**<br>The position must state whether there is a principled epistemic line between observable and unobservable entities. | Van Fraassen's distinction: We can believe in the table (observable) but only accept the electron (unobservable) as empirically adequate; microscopy blurs this line. | **Camp Preference**<br>(Empiricists demand it; Realists argue observability is context-dependent and not truth-conducive.) | Constructive Empiricism (collapses if the boundary is vague), Scientific Realism (must explain why we trust unobservables). |
  | **Underdetermination Tolerance**<br>The position must specify whether incompatible theories fitting the same data require agnosticism or a tie-breaker. | Quantum mechanics interpretations (Copenhagen vs. Pilot Wave): Same predictions, different ontologies; does science decide between them or remain agnostic? | **Camp Preference**<br>(Empiricists see this as fatal to realism; Realists see it as a temporary methodological hurdle.) | Scientific Realism (if it claims unique truth), Constructive Empiricism (if it claims agnosticism is the only rational stance). |

