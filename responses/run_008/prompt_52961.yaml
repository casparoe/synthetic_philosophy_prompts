          7.  *Zero Pure Rate Implication:* Year 1,000,000 welfare = negligible (Refutation of pure time preference?). Can't live life on zero discounting. Prudence vs. Morality.
      *   **Tentative Principle:** Uncertainty (existence/outcomes) does all legitimate discounting; residual pure rate is zero.
      *   **Questions:**
          1.  Does this principle capture the verdicts?
