answer: |-
  # DECISION TREE: RATIONALITY IN A DEGENERATING PROGRAMME

  **START:** You accept science is appraised at the level of **Research Programmes** (Hard Core + Protective Belt). Your programme has degenerated for a decade (no novel predictions, ad hoc adjustments). A rival predicts new facts and explains your past successes.

  1.  **Does a single stubborn anomaly by itself warrant abandoning the hard core?**
      *   **YES** → **NAIVE FALSIFICATIONISM**
      *   **NO** → (Go to 2)

  2.  **Is the proper measure of progress *solved problems* rather than *novel prediction*?**
      *   **YES** → **LAUDAN**
      *   **NO** → (Go to 3)

  3.  **Can an after-the-fact belt adjustment count as progress if later independently confirmed?**
      *   **NO** → *[EMPTY PATH A]*
      *   **YES** → (Go to 4)

  4.  **Does an early brilliant run buy later patience (whole history), or does recent trajectory dictate?**
      *   **EARLY RUN BUYS PATIENCE** → *[EMPTY PATH B]*
      *   **RECENT TRAJECTORY DICTATES** → (Go to 5)

  5.  **Is there an objective, viewpoint-independent fact about which programme is doing better?**
      *   **NO** (Only shared values/persuasion) → **KUHN**
      *   **YES** → (Go to 6)

  6.  **May a scientist rationally stay in a known degenerating programme (e.g., hoping for a comeback)?**
      *   **YES** → **FEYERABEND**
      *   **NO** → **LAKATOS**

  ***

  ### LEAF COMMITMENTS (The Awkward Price)
  *   **Naive Falsificationism:** Scientists *ought* to abandon theories the moment data contradicts them, rendering most historical science irrational.
  *   **Laudan:** A theory that predicts nothing new can be "progressive" if it solves enough old puzzles, divorcing progress from risk.
  *   **Kuhn:** There is no neutral algorithm for theory choice; scientific change is ultimately a matter of group persuasion.
  *   **Feyerabend:** It is rational to violate established methodological rules if it helps a theory survive, making methodology anarchistic.
  *   **Lakatos:** A scientist is irrational to cling to a degenerating programme even if they privately believe a comeback is possible, imposing a historical verdict on individual reason.

  ***

  ### REQUIREMENT 1: COLLAPSED LEAVES
  **Lakatos and Kuhn** risk collapsing here. Both agree scientists *do* stay until crisis is severe; both agree appraisal is retrospective. The tree separates them on **Objectivity (Node 5)**, but if "objective fact" is softened to "intersubjective agreement among experts," the distinction vanishes.
  *   **Prising Question:** *Is the verdict on degeneration binding on the individual scientist's reason?* (Lakatos: Yes, eventually. Kuhn: No, it requires a conversion experience).

  ### REQUIREMENT 2: EMPTY PATHS
  *   **Path A (Anomaly=No, Metric=Novel, Post-hoc=No):** *Incoherent.* You cannot demand novel prediction while forbidding confirmed post-hoc adjustments; this denies the temporal reality of theory development.
  *   **Path B (History=Early Run Buys Patience, Objectivity=Yes, Stay=No):** *Unattractive/Untried.* Claims history grants credit, but recent failure mandates abandonment. This creates a "moral debt" view of science no philosopher occupies; it grants patience but refuses to let it be spent.

