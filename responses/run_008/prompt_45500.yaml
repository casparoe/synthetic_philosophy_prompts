      **Joint Statement on Performance and Political Authority**

      **Signatories:** [The Liberal Theorist] & [The Pragmatist Realist]

      **I. Agreed Claims**
      1. **Empirical Record:** Both Singapore (1965–present) and China (1978–present) achieved sustained economic growth and public order exceeding most contemporary peers during their respective development phases. This performance secured widespread popular acquiescence.
      2. **Definition:** "Performance legitimacy" refers to a regime's claim to rightful rule based on output (prosperity, security) rather than input (elections). We agree this describes a *sociological* phenomenon (subjects believe the rule is rightful) but disagree on whether it constitutes *normative* legitimacy (the regime actually possesses a right to rule).
      3. **Concessions:** The Liberal concedes that electoral mechanisms alone do not guarantee competence or stability. The Pragmatist concedes that performance-based claims are contingent; failure to deliver erodes the claim faster than procedural violations erode democratic legitimacy.

      **II. Residual Disagreements**
      1. **Conceptual Content:** The Liberal argues "performance legitimacy" is a category error: stability and popularity are not legitimacy. Without consent, performance is merely effective coercion or paternalism. The Pragmatist argues legitimacy is inherently sociological; if the governed accept output as sufficient justification, the distinction between "stability" and "legitimacy" is semantic.
      2. **Comparison Class:** The Liberal compares Singapore/China against idealized democratic norms (rights, accountability). The Pragmatist compares them against actual historical alternatives (failed states, chaotic transitions, corrupt democracies), arguing the relevant metric is relative governance quality, not procedural purity.

      **III. Cruxes and Falsifiable Predictions**
      We identify two empirical cruxes where our theoretical divergences yield testable outcomes.

      **Crux 1: The Expectations Trap**
      *Theory:* Does economic development inevitably generate demands for political voice that performance cannot satisfy?
      *Liberal Prediction:* As societies reach upper-middle income status, citizens prioritize autonomy over security. Performance becomes subject to diminishing returns.
      *Pragmatist Prediction:* Preferences are endogenous. Regimes can shape preferences through nationalism or digital governance, decoupling wealth from demands for liberalization.
      *Agreed Evidence:*
      1. **South Korea/Taiwan (Historical):** Both transitioned to democracy during economic growth. Liberals cite this as proof of the modernization trap. Pragmatists argue this proves only that *weak* authoritarianisms fail; strong party-states (CCP) differ.
      2. **China (Future):** If China stagnates at $15k–$20k GDP per capita without political liberalization, the Pragmatist view gains weight. If stagnation triggers systemic unrest requiring massive coercion disproportionate to the economic shock, the Liberal view is confirmed.
      *Falsification Condition:* For the Pragmatist: A sustained period (10+ years) of low growth (<3%) in China without regime-threatening instability. For the Liberal: Any significant political liberalization in China triggered primarily by middle-class demand rather than elite fracture.

      **Crux 2: Scalability and Category**
      *Theory:* Is Singapore a valid model for large continental states, or is it a unique city-state exception?
      *Liberal Prediction:* Singapore works due to scale, homogeneity, and colonial legal inheritances. It is not replicable in China. China's model relies on repression unsustainable at scale without digital totalitarianism.
      *Pragmatist Prediction:* The "Singapore Model" is about meritocratic selection and long-term planning, not size. China adapts these mechanisms (cadre evaluation) successfully despite scale.
      *Agreed Evidence:*
      1. **Succession:** Singapore's post-Lee Kuan Yew stability proves institutionalization over charisma.
      2. **China's Succession:** The consolidation of power under Xi indicates a shift from collective meritocracy to personalist rule.
      *Falsification Condition:* For the Liberal: If China successfully navigates a leadership transition without purges or instability while maintaining growth, the institutional model holds. For the Pragmatist: If Singapore maintains high trust and efficiency despite increasing pluralism and no single-party dominance, the model proves robust beyond authoritarianism.

      **IV. Conclusion on Framing**
      We acknowledge the editor's suspicion: "Performance legitimacy" risks conflating *explanation* (why they stay in power) with *justification* (why they should). We sign this statement not to resolve that semantic dispute, but to locate where the empirical record forces a resolution. If performance buys durability without consent, the liberal normative framework requires revision. If performance merely delays reckoning, the pragmatist model is a Ponzi scheme of patience.

