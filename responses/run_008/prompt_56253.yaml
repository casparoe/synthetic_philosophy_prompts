answer: |-
  ### Brainstorming & Strategic Framing

  Before committing to the final list, we need to acknowledge the structural difficulty of your request. You are asking for a "success condition" for a theory that, by definition, claims our current successful theory (Folk Psychology) is a failure. This creates a recursive problem: if the criteria for success are drawn from our current conceptual framework (logic, explanation, prediction), and eliminativism claims that framework is radically false, then the eliminativist is using the tools of the doomed theory to argue for its doom.

  To avoid begging the question, our desiderata must be neutral enough to be accepted by a realist (who thinks beliefs exist) and an eliminativist (who thinks they don't), yet strict enough to rule out hand-waving.

  I have evaluated your five candidate desiderata. They are all strong, but some conflate *ontological* elimination with *linguistic* replacement. I will refine them to distinguish between "nothing corresponds to this term" (ontology) and "we should stop using this term" (pragmatics). I am adding two criteria that are often implicit but need to be explicit: one regarding normativity (rationality) and one regarding logical self-application.

  Here is the specification for a successful eliminative materialism.

  ---

  ### The Desiderata for Successful Eliminativism

  #### 1. Explanatory Continuity (Refinement of your "No-Miracles")
  *   **The Requirement:** The eliminativist must explain why Folk Psychology (FP) achieved its historical predictive success without positing that its core terms (belief, desire) referred to real entities. It cannot simply say "FP worked by luck." It must provide a mechanism (e.g., isomorphism, rough approximation) that accounts for the correlation between FP predictions and actual behavior in a world without beliefs.
  *   **Motivating Case:** In the history of science, when a theory is eliminated (e.g., phlogiston), we usually explain why it *seemed* true (oxygen chemistry explains combustion *and* why phlogiston theorists got some results right). If FP is radically false, its millennia of success is a statistical miracle.
  *   **Status:** **Non-negotiable.** Any scientific realist eliminativism must meet this.
  *   **Evaluation of your candidate:** **Accept.** This is the strongest external constraint on the theory.

  #### 2. Reference Failure (Refinement of your "Retention")
  *   **The Requirement:** It must be demonstrated that there is no lawful mapping between folk-psychological kinds (belief, desire) and neurocomputational kinds. It is not enough to say "beliefs are just neural states." The eliminativist must show that the *taxonomy* of FP cuts across the taxonomy of neuroscience so badly that reduction is impossible (e.g., the neural realization of "believing it will rain" is too disjunctive to be a natural kind).
  *   **Motivating Case:** Distinguishes *eliminativism* from *reductive physicalism*. If beliefs reduce to neural states, eliminativism is false. Success requires proving the "incommensurability" of the vocabularies.
  *   **Status:** **Non-negotiable.** This is the definition of the position.
  *   **Evaluation of your candidate:** **Accept.** Your phlogiston analogy is apt, but the bar is higher: you must prove there is no "oxygen" waiting to be found that corresponds to "belief."

  #### 3. Pragmatic Viability (Refinement of your "Kitchen-Resolution")
  *   **The Requirement:** The successor vocabulary must be capable of guiding everyday social coordination and prediction in real-time, or the eliminativist must explain why abandoning this capacity is acceptable. If the new theory requires an fMRI to predict if a spouse is angry, it fails as a *replacement* for FP, even if it is ontologically superior.
  *   **Motivating Case:** FP is not just a theory; it is a technology for social living. A theory that eliminates the user's ability to navigate the social world is pragmatically self-defeating.
  *   **Status:** **Prejudice of the Pragmatist camp.** A hard-line scientific realist might argue truth trumps utility (we accepted heliocentrism even though geocentrism was easier for navigation). However, for a theory of *mind*, which governs action, utility is tightly bound to truth.
  *   **Evaluation of your candidate:** **Accept.** This is the most potent practical objection.

  #### 4. Phenomenological Accommodation (Refinement of your "Autobiography")
  *   **The Requirement:** The theory must account for the first-person experience of having beliefs without validating the existence of beliefs. It must explain the *illusion* of introspection. It cannot simply dismiss first-person reports as "errors" without explaining the mechanism of the error.
  *   **Motivating Case:** If I report "I believe X," and you say "No, you don't," you are claiming I am systematically deluded about my own conscious life. This requires a robust error theory, not just a denial.
  *   **Status:** **Non-negotiable.** A theory of mind that cannot account for the mind's appearance to itself is incomplete.
  *   **Evaluation of your candidate:** **Accept.** This raises the stakes from "you are wrong about science" to "you are wrong about yourself."

  #### 5. Systematicity (Refinement of your "Scope")
  *   **The Requirement:** The eliminativist must specify whether the elimination is holistic. If "belief" is eliminated but "intention" is retained, the theory must explain how intentions function without beliefs (since standard models treat intention as a species of belief/desire complex).
  *   **Motivating Case:** The propositional attitudes are interdefined. You cannot easily pull one thread without unraveling the web. A mixed verdict risks incoherence.
  *   **Status:** **Prejudice of the Holist camp.** It is logically possible to eliminate some states and not others, but theoretically costly.
  *   **Evaluation of your candidate:** **Accept.** A mixed verdict is coherent but unstable.

  #### 6. Normative Accountability (New Addition)
  *   **The Requirement:** The successor theory must account for the *normativity* of the mental. Beliefs are subject to norms of truth and rationality (you *ought* to believe what is true). Neural states are descriptive, not normative. The eliminativist must explain how rationality emerges from a system of non-normative causal processes without smuggling norms back in.
  *   **Motivating Case:** Reasoning involves correctness conditions. If there are no beliefs, there are no "false" beliefs, only different neural configurations. If there are no false beliefs, the eliminativist's own argument cannot be "true" in a normative sense, only "causally effective."
  *   **Status:** **Non-negotiable.** This addresses the "rationality" objection.
  *   **Argument for Inclusion:** Without this, eliminativism reduces reasoning to ballistics. It fails to capture what makes the mind *mental* rather than just complex.

  #### 7. Theoretical Self-Consistency (New Addition)
  *   **The Requirement:** The theory must be statable without presupposing the existence of the entities it eliminates. If the eliminativist asserts "I believe eliminativism is true," they performatively contradict themselves. They must formulate their thesis without using propositional attitude verbs, or explain why their own utterance is not an expression of belief.
  *   **Motivating Case:** The classic self-refutation argument. If the theory is true, no one can *believe* it. If no one can believe it, in what sense is it a theory adopted by a community of thinkers?
  *   **Status:** **Non-negotiable.** Logical consistency is a baseline requirement.
  *   **Argument for Inclusion:** This is the logical trap. Many eliminativists try to dodge this by saying "I don't believe it, my brain states cause me to say it," but this undermines the rational persuasion intended by the paper.

  ---

  ### Tensions and Incompatibilities

  You asked to flag subsets of requirements that cannot be jointly satisfied. There is one major tension that threatens to break the entire project:

  **The Tension between Pragmatic Viability (3) and Reference Failure (2).**

  *   **The Conflict:** If the successor vocabulary is **Pragmatically Viable** (usable by ordinary people for real-time social prediction), it almost certainly shares the structural isomorphism of Folk Psychology. If it shares that structure, it is highly likely that **Reference Failure** is false (i.e., there *is* a mapping, which implies reduction, not elimination).
  *   **The Dilemma:**
      *   If the new vocabulary is radically alien (satisfying Reference Failure), it will fail Pragmatic Viability (no one can use it to raise children or make promises).
      *   If the new vocabulary is usable (satisfying Pragmatic Viability), it likely preserves the functional roles of belief/desire, which undermines Reference Failure (suggesting reductionism is the better fit).
  *   **Implication:** A successful eliminativism must walk a razor's edge: it must be ontologically radical enough to kill beliefs, but functionally conservative enough to run a society. This is the hardest bind.

  A secondary tension exists between **Phenomenological Accommodation (4)** and **Theoretical Self-Consistency (7)**. To explain away the feeling of believing (4), you often need to posit higher-order representations. But if you posit representations to explain the error, you risk reintroducing the very intentional states you sought to eliminate, threatening (7).

  ---

  ### Scorecard of Contenders

  Here is how the major positions score against these seven desiderata.

  | Criterion | Churchland (Neurocomputational) | Stich (Syntactic/Revisionary) | Dennett (Instrumentalist) | Quietism |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Explanatory Continuity** | **Fail.** Claims FP is a stagnant theory, but struggles to explain its predictive success without granting it some reference. | **Pass.** Argues FP is a "bad" theory, but offers less on why it worked so well historically. | **Pass.** FP works because it's a useful tool, not because it's true. | **N/A.** Rejects the need for this explanation. |
  | **2. Reference Failure** | **Pass.** Argues neural networks are vector transformations, not sentence-like states. | **Pass.** Argues content is indeterminate; only syntax is real. | **Fail.** Beliefs exist as abstracta (real patterns). | **N/A.** |
  | **3. Pragmatic Viability** | **Fail.** Admits the new vocabulary will be esoteric and unusable for daily life. | **Fail.** Syntactic theory is not usable for social coordination. | **Pass.** Preserves FP talk entirely. | **Pass.** Keeps using FP. |
  | **4. Phenomenological Accommodation** | **Fail.** Treats introspection as a theory-laden illusion, but offers weak error theory. | **Fail.** Dismisses first-person authority as unreliable. | **Pass.** Explains phenomenology as a "user-illusion" that is real as an illusion. | **Pass.** Takes phenomenology at face value. |
  | **5. Systematicity** | **Pass.** Eliminates the whole lot (belief, desire, etc.). | **Pass.** Eliminates content-based attitudes broadly. | **Fail.** Retains the whole web of attitudes. | **Pass.** Retains the web. |
  | **6. Normative Accountability** | **Fail.** Struggles to derive norms from causal vector spaces. | **Fail.** Focuses on causal role, not normative correctness. | **Pass.** Norms are part of the "stance" we take. | **Pass.** Norms are inherent to practice. |
  | **7. Theoretical Self-Consistency** | **Fail.** Often slips into belief-talk to argue against beliefs. | **Mixed.** Tries to use syntactic descriptions, but still argues for *acceptance* of his view. | **Pass.** No contradiction; he isn't eliminating beliefs. | **Pass.** No contradiction. |

  ---

  ### The Knockout Criterion

  The single requirement that does the most to knock out the most candidates (specifically the hard eliminativists like Churchland and Stich) is **Pragmatic Viability (3)**.

  **Why?**
  1.  **It exposes the practical cost:** Churchland and Stich are willing to sacrifice this. They admit that a mature neuroscience will not help you decide whether to trust a friend or vote for a candidate. But if a theory of mind cannot guide the mind's primary activity (living), it fails as a *successor* theory. It becomes a specialized science, not a replacement for psychology.
  2.  **It forces the Reduction/Elimination choice:** If a candidate tries to fix this (like Dennett), they usually fail **Reference Failure (2)**. If you make the theory usable, you end up keeping beliefs (Instrumentalism). If you kill beliefs, you lose usability.
  3.  **It highlights the social dimension:** Eliminativism is often argued as a solitary ontological thesis (what is in the skull?). Pragmatic Viability forces the argument into the social realm (how do we interact?). This is where eliminativism crumbles, because even if *I* stop believing in beliefs, I cannot stop *you* from attributing them to me, and I must still navigate that attribution.

  **Conclusion for your paper:**
  If you want to argue against eliminativism, do not focus on whether neurons exist. Focus on **Pragmatic Viability**. Argue that a theory that eliminates the vocabulary of social coordination is not a "successor" theory but an "abandonment" of the domain. If eliminativism cannot tell you how to live, it has not explained the mind; it has merely changed the subject. Conversely, if you want to defend eliminativism, your primary task is to show how a neurocomputational vocabulary could eventually become the "kitchen language" of the future. That is the only path to success.
