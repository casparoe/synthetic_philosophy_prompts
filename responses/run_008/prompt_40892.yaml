prompt: |-
  Something I've never managed to square: states claim they can turn foreigners away at the border for any reason or no reason -- a visa application gets refused without explanation, and nobody thinks a moral argument has been owed. But the very same legal systems accept non-refoulement, the idea that you cannot push someone back into persecution, even though on paper the refugee still has no right to be admitted in the first place. So the practice seems to be: your claim to enter counts for nothing, but your claim not to be returned to danger overrides the state's right to exclude. What view of the right to exclude does that pattern actually presuppose? Is it basically a doing/allowing distinction -- returning someone makes the state complicit in a harm, while refusing entry merely fails to confer a benefit -- and does that even hold up, given that border enforcement physically blocks people who are already fleeing? Or is the implicit thought something else: that exclusion is legitimate only as a means of protecting some collective project, and the project loses its point when it costs someone their life? And where does that leave the economic migrant, the person escaping starvation rather than a firing squad -- is the practice only coherent if you deny that severe poverty is the kind of harm that generates claims against other states, and is that denial actually defensible? Finally, tell me where the practice is philosophically underdetermined: could several rival theories of the right to exclude all license this exact arrangement, and what would have to change if a state took one of the other theories seriously?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Tension:** States claim an absolute right to exclude foreigners (no reason needed for visa refusal) *but* accept *non-refoulement* (cannot return someone to persecution).
      *   **The Paradox:** Entry claim = nothing; Non-return claim = overrides exclusion right.
      *   **Question 1:** What view of the "right to exclude" does this pattern presuppose?
      *   **Question 2:** Is it a *doing/allowing* distinction (complicity in harm vs. failing to confer benefit)? Does this hold up given physical blocking at borders?
      *   **Question 3:** Is it about the *purpose of the collective project* (protection loses point if it costs a life)?
      *   **Question 4:** Where does this leave the economic migrant (starvation vs. firing squad)? Is the coherence dependent on denying poverty as a harm generating claims? Is that defensible?
      *   **Question 5:** Where is the practice *philosophically underdetermined*? Can rival theories license this arrangement? What would change if a state took a specific theory seriously?

  2.  **Initial Analysis & Brainstorming:**

      *   *The Legal/Political Reality:* Sovereignty implies control over borders. International law (1951 Refugee Convention) carves out an exception for refugees (*non-refoulement*). This creates the tension the user identifies.
      *   *The Doing/Allowing Distinction:* This is a classic deontological argument. Refusing entry = allowing harm (by others). Returning = doing harm (by me). But at a border, the state is actively intervening. If I stand in front of a door and someone is chased by a dog, am I "allowing" or "doing" by locking the door? This distinction is shaky in border contexts.
      *   *The Collective Project View:* States exist to protect their citizens. If protecting citizens requires letting someone die, does the state lose legitimacy? Or is it that the state's right to exclude is instrumental, not absolute?
      *   *The Economic Migrant:* This is the hardest part. Why is political persecution special? Is it because the persecutor is the state (making the home state void of protection) vs. natural causes (starvation)? Or is it just arbitrary line-drawing to limit numbers?
      *   *Underdetermination:* Yes, multiple theories (Libertarian, Liberal Nationalist, Cosmopolitan) might converge on this practice for different reasons.
          *   *Libertarian:* Property rights/Association rights, but minus the aggression of returning to torture.
          *   *Liberal Nationalist:* Culture preservation, but bounded by basic human rights.
          *   *Cosmopolitan:* Minimal humanitarian duty, but not full open borders.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. It's the "sovereignty vs. human rights" knot.
      *   **1. The Doing/Allowing Distinction:**
          *   Explain the logic: Refusal = omission (not helping); Return = commission (handing over to torturer).
          *   Critique: At the border, the state is an active agent. Pushing back *is* an act. The distinction collapses physically but might hold legally/morally regarding *causation*.
          *   Verdict: It's part of the story, but insufficient.
      *   **2. The "Collective Project" / Political Community View:**
          *   This aligns with Liberal Nationalism (Miller, Walzer). States are clubs for self-determination.
          *   Exception: Basic human rights trump club rules.
          *   The "Life vs. Project" argument: The state's right to exclude is derivative of its duty to protect. If exclusion kills, it contradicts the foundational logic of protection.
      *   **3. The Economic Migrant Problem:**
          *   Why the distinction? "Agent-specific harm" vs. "Natural misfortune." Persecution implies a *violator* who is the home state. Starvation might be structural/natural.
          *   Is the denial defensible? Philosophically, many say no (Shue, Caney). Practically, states say yes (capacity limits).
          *   Coherence: The system is only coherent if you accept a hierarchy of harms where *political* agency matters more than *material* survival, or if you accept pragmatic limits on duties.
      *   **4. Philosophical Underdetermination (The "Overlapping Consensus"):**
          *   This is the crucial theoretical part.
          *   *Theory A: State Sovereignty as Property/Association.* (Wellman). We have a right to associate. But we can't assault people. Returning = assault. Refusing = not inviting.
          *   *Theory B: Liberal Nationalism.* (Walzer). Communities shape themselves. But "mutual aid" applies in extreme necessity.
          *   *Theory C: Human Rights Minimalism.* (Rawlsian LO peoples). Duty to assist burdened societies, but not necessarily via immigration. *Non-refoulement* is a negative duty (don't harm), migration is a positive duty (assist).
          *   *What would change?*
              *   If Sovereignty/Property were absolute: No *non-refoulement* (return them all).
              *   If Cosmopolitanism were absolute: Open borders (no exclusion).
              *   If Positive Duties were emphasized: Economic migrants admitted.
      *   **Conclusion:** Summarize. The practice is a messy compromise, not a clean philosophical deduction. It's a "modus vivendi."

  4.  **Refining and Polishing:**

      *   *Tone:* Philosophical, analytical, rigorous, but accessible.
      *   *Check:* Did I answer the specific question about "what view of the right to exclude"? Yes, it's a *conditional* or *instrumental* right, not absolute.
      *   *Check:* Did I address the economic migrant defensibility? Yes, highlighted the agent-relative vs. agent-neutral harm distinction.
      *   *Check:* Did I explain underdetermination? Yes, showed how different foundations lead to the same policy.

  5.  **Self-Correction/Nuance during drafting:**
      *   *Correction:* Be careful not to say *non-refoulement* grants a right to *stay*. It often just means you can't be sent *back*. You might be sent to a third country. I should mention this nuance (safe third country rules).
      *   *Nuance:* The "doing/allowing" distinction is often criticized in bioethics too. I should mention that the physical act of border enforcement blurs this.
      *   *Emphasis:* Make sure to highlight that the "right to exclude" is being treated as a *prima facie* right, not an absolute one.

  6.  **Final Review against User Prompt:**
      *   Squaring the tension? Yes.
      *   View of right to exclude? (Conditional/Instrumental).
      *   Doing/Allowing? (Analyzed and critiqued).
      *   Collective Project? (Analyzed).
      *   Economic Migrant? (Addressed the coherence/defensibility).
      *   Underdetermination? (Detailed rival theories).

  7.  **Final Polish:** (Produces the structured output provided previously.)
answer: |-
  This is one of the sharpest tensions in contemporary political philosophy and international law. You have identified the fault line between **Westphalian sovereignty** (the state as a gated community) and **universal human rights** (the person as a rights-bearer regardless of location).

  The pattern you describe—absolute discretion to exclude, bounded by a negative duty not to return to death—presupposes a specific, somewhat fragmented view of the right to exclude. It treats exclusion not as an absolute property right, but as a **prima facie right of political self-determination that is trumped by negative duties of non-maleficence.**

  Here is an analysis of the philosophical architecture underpinning this practice, the weaknesses in its logic, and where the practice is underdetermined by theory.

  ### 1. The Doing/Allowing Distinction: Does it hold?
  You ask if this is basically a doing/allowing distinction: *refoulement* makes the state complicit in harm (doing), while refusal merely fails to confer a benefit (allowing).

  **The Logic:**
  In traditional deontological ethics, there is a strong asymmetry between killing and letting die. If State A sends Person X back to State B, and State B tortures X, State A has become a link in the causal chain of torture. State A has *used* X as a means to preserve its own border integrity. Conversely, if State A simply keeps the gate locked, X's suffering is caused by State B or by nature; State A is merely failing to rescue.

  **The Critique:**
  This distinction collapses under the physical reality of modern border enforcement.
  *   **Physical Intervention:** When a border guard physically turns a boat back or erects a wall, they are not "omitting" to act; they are actively intervening to prevent movement. If a person is fleeing a fire, and I lock the only exit door, I am not merely "allowing" them to burn; I am causally responsible for their confinement.
  *   **The "Shallowness" of the Border:** In a globalized world, the border is not just a line on a map; it is a jurisdictional reach. Visa regimes and carrier sanctions (fining airlines that bring people without papers) extend the "exclusion" deep into foreign territory.
  *   **Verdict:** The doing/allowing distinction is the *legal* fiction that sustains the practice, but it is philosophically fragile. It holds only if we accept that the state has no general duty of rescue to non-citizens, but does have a specific duty not to actively harm them.

  ### 2. The "Collective Project" View: Protection vs. Existence
  Your second hypothesis is that exclusion is legitimate only as a means of protecting a collective project, and the project loses its point if it costs a life. This aligns closely with **Liberal Nationalism** (e.g., David Miller, Michael Walzer).

  **The Logic:**
  States are not just service providers; they are ethical communities engaged in self-determination. They have a right to exclude to maintain the trust, culture, and welfare systems that make that self-determination possible. However, this right is *instrumental*. It exists to protect the members.
  *   **The Threshold:** If exercising the right to exclude results in the death of an outsider, the state is violating the very principle that grounds its own legitimacy (the protection of life). The "right to exclude" is subordinate to the "right to life."
  *   **Why Persecution?** Persecution represents a total collapse of the political bond between the individual and their home state. The home state has become a predator. To return them is to hand them back to the predator.

  **The Coherence:**
  This view makes sense of *non-refoulement* without granting a right to asylum *per se*. It says: "We don't have to let you join our club, but we can't throw you to the wolves." It preserves the state's discretion (you can't demand to live *here*) while acknowledging a humanitarian minimum (you can't be made worse off by us).

  ### 3. The Economic Migrant: The Achilles' Heel
  This is where the practice faces its steepest philosophical cliff. If the duty is based on the preservation of life, why does starvation (economic necessity) not trigger the same override as a firing squad (political persecution)?

  **The Standard Defense (Agent-Relative Harm):**
  The current regime relies on a distinction between **human agency** and **natural misfortune**.
  *   **Refugee:** The harm is inflicted by a *political agent* (the state). The home state has violated its social contract. The international community steps in as a substitute protector.
  *   **Economic Migrant:** The harm is often structural or natural (famine, market collapse). No specific agent is "persecuting" them. Therefore, the duty owed is a *positive duty of aid*, not a *negative duty of non-return*. Positive duties are generally viewed as weaker and subject to capacity constraints (we can only help so many).

  **Is this Defensible?**
  Philosophically, many argue **no**.
  *   **Henry Shue's Basic Rights:** If the right to life is basic, it shouldn't matter whether a bullet or starvation takes it. Severe poverty can be as coercive and lethal as political persecution.
  *   **Structural Violence:** Global economic structures are not "natural." They are often maintained by the wealthy states (trade rules, debt, resource extraction). If wealthy states contribute to the poverty, the "doing/allowing" distinction returns. By enforcing borders against the starving, are they merely "allowing" death, or actively maintaining the structures that cause it?

  **The Practical Coherence:**
  The practice is only coherent if you accept a **hierarchy of urgency** or a **capacity constraint**. States argue that admitting all who face severe poverty would overwhelm the "collective project" (the welfare state), thereby destroying the capacity to help anyone. Thus, they draw an arbitrary but administrable line: *Political violence gets priority because it is discrete and identifiable; economic need is continuous and potentially infinite.*
  This is not morally pure, but it is a *modus vivendi*. It presupposes that the right to exclude is strong enough to withstand claims of poverty, but weak enough to buckle under claims of direct political violence.

  ### 4. Philosophical Underdetermination
  Finally, you ask where the practice is underdetermined. This is the most critical insight: **The current border regime is an "overlapping consensus" of rival theories.** Different philosophical foundations converge on the same policy, but for different reasons. If a state took one theory seriously to its logical conclusion, the practice would change drastically.

  #### A. The Sovereignty/Association Theory (e.g., Christopher Wellman)
  *   **Theory:** States have a right to freedom of association, akin to individuals. We don't have to marry everyone who asks.
  *   **Licenses the Practice:** Yes. We can refuse visas (no right to associate). But we cannot assault people (non-refoulement).
  *   **If Taken Seriously:** This theory might actually justify *more* exclusion. If the right is based on association, the state could arguably return people to "safe third countries" even if conditions are poor, provided the state isn't directly torturing them. It leans toward stricter border control.

  #### B. Liberal Nationalism (e.g., David Miller)
  *   **Theory:** States exist to sustain national cultures and welfare solidarity.
  *   **Licenses the Practice:** Yes. Exclusion protects the culture; non-refoulement respects basic human rights.
  *   **If Taken Seriously:** This theory demands a robust duty to aid *in place*. If we exclude economic migrants to protect our welfare state, we have a stronger duty to fix the economies they are fleeing. It would demand massive foreign aid or trade reform to make the border closure defensible.

  #### C. Cosmopolitan Human Rights (e.g., Simon Caney)
  *   **Theory:** Individuals are the primary units of moral concern; borders are administrative conveniences.
  *   **Licenses the Practice:** Barely. It accepts non-refoulement as a minimum.
  *   **If Taken Seriously:** This theory collapses the distinction between refugee and economic migrant. If the right to subsistence is a human right, and your home state can't provide it, you have a claim on other states. Taking this seriously leads toward **open borders** or a global redistribution scheme that makes migration unnecessary.

  #### D. The "Political" View (e.g., Hannah Arendt / Right to Have Rights)
  *   **Theory:** The fundamental right is not life, but *political agency*. Refugees are distinct because they have lost their "place in the world."
  *   **Licenses the Practice:** This explains the specific focus on persecution. Starvation is a tragedy; statelessness/persecution is a political catastrophe.
  *   **If Taken Seriously:** The focus would shift from "humanitarian aid" to "political inclusion." It would demand that refugees be naturalized quickly, not kept in camps. It treats the refugee not as a victim to be pitied, but as a political agent to be reinstated.

  ### Summary: The Implicit View
  The pattern you observe presupposes a **Conditional Sovereignty** model.
  1.  **Exclusion is the Default:** The state owns the territory and the community.
  2.  **Non-Refoulement is the Constraint:** The state's power is bounded by the prohibition against complicity in gross human rights violations.
  3.  **The Gap:** The system relies on the moral intuition that *active complicity in torture* is worse than *passive allowance of poverty*.

  **Where it breaks:**
  It breaks if you believe global economic structures make wealthy states complicit in foreign poverty. It breaks if you believe the physical act of border enforcement is a "doing" rather than an "allowing."

  **The Underdetermination:**
  The current system is stable only because no single theory is fully implemented. It is a compromise:
  *   It satisfies **Sovereigntists** by keeping most people out.
  *   It satisfies **Human Rights Advocates** by not sending people to torture.
  *   It satisfies **Nationalists** by distinguishing "us" (citizens) from "them" (migrants).

  If a state took **Sovereignty** seriously, *non-refoulement* would vanish (return them all).
  If a state took **Cosmopolitanism** seriously, the visa regime would vanish (open borders).
  The fact that we have *both* visas and *non-refoulement* proves the system is not built on a single coherent moral truth, but on a negotiated tension between the right of communities to self-define and the right of individuals to survive.
