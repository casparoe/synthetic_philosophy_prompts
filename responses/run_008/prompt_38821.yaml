answer: |-
  ### Evaluation of Debates

  **(a) Statue vs. Lump of Clay**
  *   **Verbalness Score:** 0.8
  *   **Type:** Mix (60% Criterion-verbal, 40% Quantifier-verbal)
  *   **Analysis:** The parties agree on the physical distribution of matter. The disagreement splits between whether "statue" implies modal persistence conditions the "lump" lacks (Criterion) and whether the domain of objects includes coincident entities (Quantifier).

  **(b) Mereological Composition**
  *   **Verbalness Score:** 0.9
  *   **Type:** Primarily Quantifier-verbal (90% Quantifier, 10% Criterion)
  *   **Analysis:** Universalists and nihilists agree on the arrangement of simples but disagree on whether the quantifier "there exists" ranges over composite sums. There is a minor criterion element regarding what counts as "composition," but the domain restriction is dominant.

  **(c) Ship of Theseus**
  *   **Verbalness Score:** 0.85
  *   **Type:** Primarily Criterion-verbal (90% Criterion, 10% Quantifier)
  *   **Analysis:** All physical facts about the plank replacement are agreed upon. The dispute turns almost entirely on the semantic criteria for applying the predicate "same ship" over time, rather than on what objects exist in the domain.

  **(d) Holes**
  *   **Verbalness Score:** 0.75
  *   **Type:** Mix (50% Quantifier-verbal, 50% Criterion-verbal)
  *   **Analysis:** Realists and anti-realists agree on the physics of the perforated object. The fight is evenly split between whether absences belong in the ontological domain (Quantifier) and whether "hole" refers to an entity or a property (Criterion).

  **(e) Teleportation and Personal Identity**
  *   **Verbalness Score:** 0.6
  *   **Type:** Primarily Criterion-verbal (80% Criterion, 20% Substantive)
  *   **Analysis:** While largely a dispute over the criteria for "person" and "survival" (Criterion), there is a residual substantive disagreement about what ethically or psychologically *matters* in survival, preventing a score closer to 1.0.

  **(f) Natural Kinds (Realism vs. Conventionalism)**
  *   **Verbalness Score:** 0.2
  *   **Type:** Primarily Substantive (80% Substantive, 20% Criterion)
  *   **Analysis:** Even after fixing linguistic usage, the parties disagree on whether reality possesses mind-independent structure. The small verbal component concerns only how we define "joint-carving," not the structural claim itself.

  ***

  ### Ranking: Most Verbal to Least Verbal

  1.  **Mereological Composition (0.9):** This is the paradigmatic quantifier-verbal dispute, as opponents agree on all arrangement facts but disagree on whether the domain of existence includes composites.
  2.  **Ship of Theseus (0.85):** This dispute is overwhelmingly criterion-verbal, hinging on semantic indecision regarding the persistence conditions inherent in the concept "ship."
  3.  **Statue vs. Lump (0.8):** This case blends quantifier variance (counting coincident objects) with criterion variance (sortal identity conditions), making it highly verbal but slightly less pure than composition.
  4.  **Holes (0.75):** The debate is evenly split between ontological commitment to absences and the semantic classification of holes as entities versus properties.
  5.  **Teleportation (0.6):** While largely a verbal dispute over the definition of "person," it retains substantive weight regarding what matters in survival, lowering its verbalness score.
  6.  **Natural Kinds (0.2):** This is primarily a substantive disagreement about the mind-independent structure of reality that persists even after linguistic conventions are fixed.

  ***

  ### Seminar Recommendation

  **Selected Debate:** **(a) Statue vs. Lump of Clay**

  **Reasoning:** I recommend this debate for the first session because it sits at the precise intersection of your two verbal categories, forcing students to disentangle whether the disagreement is about *how many* objects exist (Quantifier) or *what properties* define the objects (Criterion). Unlike the Composition debate (which is almost purely quantifier) or the Ship of Theseus (which is almost purely criterion), the Statue/Lump case requires students to actively diagnose and separate the two types of verbalness to make progress, thereby providing the clearest practical illustration of the distinction.
