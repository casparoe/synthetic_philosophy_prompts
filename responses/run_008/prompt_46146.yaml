answer: |-
  The move you are describing is the application of the **Radbruch Formula** (*Radbruchsche Formel*), and the specific tactical maneuver is best labeled **Radbruchian Nullification** (or sometimes **Validity Erasure**).

  You have correctly identified the two canonical reference points for this debate:
  1.  **The German Philosopher:** Gustav Radbruch, who formulated the principle in his 1946 essay *"Statutory Lawlessness and Supra-Statutory Law"* ("Gesetzliches Unrecht und übergesetzliches Recht").
  2.  **The Anglophone Split:** The 1958 **Hart-Fuller Debate** in the *Harvard Law Review*, centered on the hypothetical **"Grudge Informer Case."**

  Here is the carving you need for your term paper, distinguishing the move from its neighbors and mapping its limits.

  ### 1. The Name and The Mechanism
  While "The Radbruch Formula" is the name of the *philosophical test*, the *legal move* itself—using that test to prosecute without admitting retroactivity—is often referred to in transitional justice literature as **Radbruchian Nullification**.

  **The Logic:**
  *   **Standard Positivism:** Law is law if enacted by the proper authority, regardless of content. Therefore, punishing acts legal under the old regime is *ex post facto* (retroactive) punishment.
  *   **Radbruchian Nullification:** Law requires a minimum threshold of justice. If a statute is "intolerably unjust," it lacks the very nature of law (*lex iniusta non est lex*). Therefore, the defendant was never under a valid legal obligation to begin with. Prosecuting them now is not retroactive; it is enforcing a higher, timeless law that was merely obscured by the regime's "statutory lawlessness."

  ### 2. Differentiation from Nearby Concepts

  You asked how this differs from judicial review and *ex post facto* legislation. This distinction is crucial for your paper.

  | Concept | How it treats the Old Law | Temporal Effect | Honesty about Retroactivity |
  | :--- | :--- | :--- | :--- |
  | **Ex Post Facto Legislation** | Admits the old law was valid. | Creates a *new* crime for past acts. | **High.** Admits it is changing the rules to punish past behavior. |
  | **Ordinary Judicial Review** | Declares the law invalid (unconstitutional). | Usually **Prospective** (or void from enactment, but rarely criminalizes reliance). | **Medium.** Admits the law existed but was flawed. Rarely used to criminalize past reliance on the statute. |
  | **Radbruchian Nullification** | Declares the old law was **never law**. | **Retroactive Invalidity.** Treats the statute as a nullity *ab initio*. | **Low.** Claims *no* retroactivity because the legal landscape hasn't changed; the "law" was just a command disguised as law. |

  **The Key Distinction:** Ordinary judicial review strikes down a law because it conflicts with a *higher valid law* (e.g., a Constitution). Radbruchian Nullification strikes it down because it conflicts with *morality itself*, asserting that morality is a condition of legal validity.

  ### 3. The Edges: Where the Move Breaks (For Your Term Paper)

  This is the core of your assignment. The Radbruch Formula is easy to apply to the Holocaust; it becomes dangerous when stretched. Here are the four fault lines you should explore.

  #### A. The Threshold Problem (Intolerable vs. Merely Bad)
  Radbruch himself set a high bar: injustice must be "intolerable" (*unerträglich*).
  *   **The Edge:** Does this apply only to genocide and state murder (Nazi Germany, Khmer Rouge)? Or does it apply to "merely" authoritarian acts (censorship, property seizure, political detention without trial)?
  *   **The Risk:** If you lower the threshold to "unjust," almost all law becomes vulnerable. A tax law might be unjust to the poor; a zoning law might be unjust to a developer. If "unjust" equals "not law," legal certainty collapses.
  *   **Paper Argument:** The move only retains legitimacy if restricted to **crimes against humanity** where the moral violation is so stark that no reasonable person could claim reliance on the statute was legitimate.

  #### B. The Scope Problem (Systemic vs. Selective Voidance)
  *   **The Edge:** Do you declare the *entire* legal order of the old regime void, or just the wicked statutes?
  *   **The Reality:** Courts almost always choose **Selective Voidance**. They void the laws allowing deportation or informing, but they uphold the old regime's contract law, property law, and marriage licenses.
  *   **The Contradiction:** This creates a philosophical inconsistency. If the regime was so wicked that its laws were "no law," why are its property deeds still valid? Usually, pragmatism wins: courts void the criminal statutes but uphold the civil ones to prevent social chaos.
  *   **Paper Argument:** This selectivity reveals that Radbruchian Nullification is often a **legal fiction** used for political stabilization rather than a consistent philosophical stance.

  #### C. The Epistemic Problem (Who Decides?)
  *   **The Edge:** Who has the authority to declare the old laws "void ab initio"?
  *   **The Risk:** It is always the **new regime's courts**. This opens the door to the critique of **"Victor's Justice."** The new government gets to define what counts as "intolerable injustice."
  *   **Stretching:** If the new regime is only *partially* democratic, they might use Radbruchian Nullification to punish political opponents from the old regime while ignoring their own allies' crimes.
  *   **Paper Argument:** Without an independent international standard (like the ICC), Radbruchian Nullification risks becoming a tool for political purges under the guise of natural law.

  #### D. The Hart Critique (The "Clean Hands" Argument)
  *   **The Edge:** H.L.A. Hart argued that Radbruchian Nullification is intellectually dishonest.
  *   **The Argument:** Hart suggested it is better to pass an open *ex post facto* statute, admit you are sacrificing legal certainty for justice, and punish the offenders.
  *   **Why it matters:** By pretending the law "never existed," the new court corrupts the concept of law itself. It teaches citizens that "law" is whatever the judge says is moral, undermining the predictability needed for the new democracy.
  *   **Paper Argument:** Using Radbruchian Nullification might secure a conviction, but it damages the **Rule of Law** (*Rechtsstaat*) in the long term by blurring the line between law and morality.

  ### 4. Suggested Terminology for Your Paper

  Since you need a label for the *move* specifically (not just the philosophy), I recommend using **"Radbruchian Nullification."**

  If you want to coin a more descriptive functional term for the specific *rhetorical strategy*, you could use:
  *   **"The Fiction of Non-Retroactivity"**
  *   **"Validity Erasure"**
  *   **"Normative De-Legitimation"**

  **Recommendation:** Stick with **Radbruchian Nullification**. It signals to your professor that you understand the lineage (Radbruch $\rightarrow$ Hart/Fuller $\rightarrow$ Transitional Justice) while allowing you to treat it as a tactical tool rather than just a philosophical theory.

  ### 5. Key Cases to Cite
  To ground this in actual jurisprudence, look at:
  1.  **The Grudge Informer Case (1944/1949):** The hypothetical from the Hart-Fuller debate (based on real German cases).
  2.  **The German Border Guard Cases (*Mauerschützenprozesse*, 1990s):** Prosecution of East German guards who shot people fleeing over the Berlin Wall. The courts used the Radbruch Formula to argue the East German law authorizing shooting was void because it violated international human rights.
  3.  **Nuremberg Trials:** The defense of *nullum crimen sine lege* was countered by appealing to "crimes against humanity" as pre-existing natural law.

  ### Summary for your Thesis
  The move is **Radbruchian Nullification**. It differs from *ex post facto* laws by denying the validity of the past rule rather than admitting a change in rules. Its limits lie in the **threshold of injustice** (genocide vs. policy), the **selectivity of application** (criminal vs. civil law), and the **risk to legal certainty** (Hart's critique). Your paper should argue that while this move is necessary for extreme cases (genocide), stretching it to "merely bad" regimes undermines the rule of law the new democracy is trying to build.
