answer: |-
  **Prospectus: The Decay of Option Luck: Iterated Risk and the Timescale of Responsibility**

  **1. The Research Question**
  Standard luck egalitarianism distinguishes between *brute luck* (unchosen circumstances for which agents are not responsible) and *option luck* (outcomes of deliberate gambles for which agents are responsible). This distinction is typically treated as binary: a specific outcome is either one or the other. However, life consists not of single gambles but of long sequences of iterated choices where stakes compound. In such sequences, two agents making identical, fully informed risky choices can diverge radically in welfare simply due to the timing of early random draws. An early loss shrinks the capital available for subsequent rounds, constraining future agency even if decision-making quality remains constant.

  This project asks: **Under what conditions, if any, should the luck egalitarian verdict about a person's holdings at time *t* depend on the number of prior choice-rounds that person has undergone?** More precisely: Is there a non-arbitrary "decay rate" at which option luck transforms into brute luck over time, and can this rate be derived from the internal commitments of luck egalitarianism rather than imported as an external policy preference?

  **2. Existing Positions and the Gap**
  Current debates generally oscillate between two temporal perspectives, both of which leave the specific problem of compounding risk unresolved.

  The *time-slice view* evaluates justice at a specific moment based on current holdings and immediate antecedents. While administratively simple, it risks ignoring the historical trajectory that led to current vulnerability. It treats a person ruined by a long string of bad option luck the same as a person ruined by a single brute shock, potentially violating the intuition that sustained exposure to risk alters the nature of responsibility.

  The *whole-lives view* evaluates justice only over a complete life narrative. This avoids premature judgment but offers no guidance for intervention during the life course. It implies that no redistribution is due until the "game" is over, which is practically useless for institutions designed to mitigate hardship in real-time.

  Both positions assume the status of a risk (brute vs. option) is intrinsic to the act itself. Neither accounts for *path dependence*: the possibility that the *status* of a risk changes as the agent's history accumulates. The gap this dissertation addresses is the lack of a theory explaining how the *history* of choice affects the *validity* of holding an agent responsible for current outcomes.

  **3. Methodology and Work Plan**
  The project will proceed over two terms, combining formal modeling with institutional analysis.

  *   **Term 1: The Stylized Model [High Confidence]**
      I will construct a multi-period model of iterated gambles. Agents will begin with equal endowments and face identical choice sets at each round (e.g., invest vs. save). The model will introduce stochastic returns to simulate luck. I will track the divergence in outcomes between agents who make identical choices but experience different random draws.
      *   *Task:* Define candidate "decay functions." These will be mathematical criteria attempting to pinpoint when the influence of early random draws outweighs the influence of current choice quality.
      *   *Task:* Test these functions against the model to see if any specific decay rate emerges naturally from the structure of the gambles (e.g., does the variance of outcome eventually swamp the variance of choice?).

  *   **Term 2: Institutional Mapping [Medium Confidence]**
      I will compare the model's output against "fresh-start" institutions in existing legal and economic frameworks. Bankruptcy discharge, limited liability, and statute of limitations laws function as forced resets of accumulated disadvantage.
      *   *Task:* Determine if these institutions implicitly operate on a specific timescale of responsibility. For example, does the typical timeframe for bankruptcy eligibility correspond to the "decay point" identified in the model?
      *   *Task:* Critically assess whether these institutions are merely pragmatic compromises or if they reflect a latent normative commitment to the decay of option luck.
      *   *Uncertainty:* I am less confident that legal institutions will align neatly with the model. They may be driven by economic efficiency rather than distributive justice. If they diverge, the analysis will shift to explaining the normative cost of that divergence.

  **4. Expected Results**
  A successful project will yield a normative parameter: a justified timescale for holding agents responsible. This would reframe luck egalitarianism from a theory that asks "Did they choose?" to one that asks "How long ago did they choose?"

  However, a *negative result* is a viable and valuable outcome. If the model demonstrates that no non-arbitrary decay rate can be derived from luck egalitarian commitments alone, this proves that the theory is incomplete without an external account of temporal scope. This would shift the burden of proof to theorists who assume the brute/option distinction is stable over time. Either way, the project clarifies whether "harshness" in luck egalitarianism is a necessary feature or a tunable parameter.

  **5. Fragility and Conditions for Failure**
  This proposal relies on the empirical and mathematical claim that compounding risk fundamentally alters the moral weight of choice. I am confident in the mathematics of compounding variance. I am less confident that this mathematical fact translates cleanly into moral status.

  **What Would Change My Mind**
  I would abandon the decay-rate framing if it can be demonstrated that *agency remains robust* regardless of stake size. If it can be shown that an agent with diminished capital retains the same effective capacity to make meaningful choices as an agent with high capital (i.e., if the "choice set" does not effectively shrink with wealth), then the compounding of luck is merely a change in welfare level, not a change in responsibility status. If the link between *stakes* and *autonomy* is broken, the argument that option luck decays into brute luck collapses.

  Additionally, if the institutional analysis reveals that "fresh-start" mechanisms are exclusively explained by creditor incentives or macroeconomic stability, with no plausible reconstruction as tools of distributive justice, the bridge between the model and real-world policy would fail. In that case, the decay rate would remain a purely theoretical construct with no traction on actual justice, rendering the project descriptive rather than normative.

  **6. Confidence Markers**
  *   **High Confidence:** The mathematical modeling of iterated gambles; the existence of legal "reset" mechanisms.
  *   **Medium Confidence:** The ability to derive a unique decay rate from the model; the alignment of legal mechanisms with normative principles.
  *   **Low Confidence:** The claim that luck egalitarianism *requires* a specific decay rate rather than permitting a range of permissible rates.
