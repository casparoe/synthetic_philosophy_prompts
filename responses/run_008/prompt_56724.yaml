          *   *Constraint 2:* Candid about fragility (section on "what would change your mind" + marking confidence levels within the plan).

  2.  **Deconstruct the Core Argument:**
      *   *Premise 1:* Standard luck egalitarianism distinguishes brute luck (unchosen) from option luck (chosen risk).
      *   *Premise 2:* Life is a sequence of gambles, not a single event.
      *   *Mechanism:* Compounding effects mean early random outcomes dictate the *stakes* of later choices, even if the *choices* are identical.
      *   *Conclusion:* The distinction isn't binary; it's a rate of decay. Institutions manage this rate.
      *   *Normative Shift:* Justice isn't about *whether* to hold responsible, but *how long* to hold responsible (the "memory" of the system).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic and descriptive. *The Decay of Option Luck: Iterated Risk and the Timescale of Responsibility.*
      *   **Research Question:** Needs to be determinate. *Under what conditions does the history of prior choices negate the status of a current outcome as 'option luck'?* Or better: *What is the just 'memory length' for holding agents responsible for compounded risks?*
      *   **Background/Existing Positions:**
          *   *Time-Slices:* Judgments made at $t$ based only on info at $t$. (Ignores history, potentially unfair to those who gambled well before).
          *   *Whole-Lives:* Judgments made over the complete life narrative. (Too late for intervention, potentially too harsh during the life).
          *   *The Gap:* Neither accounts for the *process* of compounding risk where choice quality remains constant but outcome divergence grows.
      *   **Methodology:**
          *   *Formal Model:* Iterated gambles with compounding stakes.
          *   *Testing:* Apply different "decay functions" to see when option luck becomes brute.
          *   *Institutional Check:* Compare model outputs to bankruptcy laws, limited liability, etc. Do they match a specific decay rate?
      *   **Expected Results:**
          *   *Positive:* A derived optimal reset interval.
          *   *Negative:* No non-arbitrary rate exists within the theory. (Still valuable: shows luck egalitarianism needs external input).
      *   **Fragility/Confidence:**
          *   *Confidence:* The math of compounding risk (economic fact). The existence of "fresh start" institutions (legal fact).
          *   *Uncertainty:* Whether the normative theory can actually support a specific rate without begging the question.
          *   *Change of Mind:* If it turns out "choice" remains robust regardless of stake size.

  4.  **Refining and Polishing (Iterative Process):**

