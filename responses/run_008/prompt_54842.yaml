answer: |-
  Here is a specification for a normative theory of simplicity-based induction, evaluated against your five candidates and the constraints of formal learning theory.

  ### Part 1: The Specification Requirements

  To function as a normative standard (analogous to Expected Utility Theory), the theory must define the *ideal* mapping from data to belief, regardless of computational cost. However, because induction is about *learning* rather than just *choosing*, the definition of "ideal" faces constraints that pure decision theory does not.

  **1. Truth Containment (Non-Negotiable)**
  *   **Specification:** The hypothesis space $\mathcal{H}$ and prior $P(h)$ must assign non-zero probability mass to the true data-generating process (or a sufficiently close approximation thereof).
  *   **Case:** If the truth is assigned zero prior probability (dogmatism), no amount of data will converge to it (by Bayes' rule). A normative theory of *general* induction cannot rule out computable stochastic processes a priori.
  *   **Critique of your Candidate 2 (Universality):** You asked if it must cover oracles. **Drop this.** A normative theory for *physical* agents need not cover hypercomputable environments. Requiring coverage of oracle-relative environments inflates the hypothesis space without increasing coverage of the physical world, worsening finite-sample bounds (see Impossibility below). Restrict to **Computable Semimeasures**.

  **2. Finite-Sample Error Bounds (Non-Negotiable)**
  *   **Specification:** The theory must provide a bound on prediction error (e.g., log-loss) as a function of data size $n$ and the complexity of the truth $K(\mu)$. Asymptotic convergence (error $\to 0$ as $n \to \infty$) is insufficient.
  *   **Case:** You noted that convergence theorems say nothing about the finite prefix. For a normative standard to guide action *now*, it must quantify the risk of being wrong at $n=1000$. A theory that guarantees convergence only after $10^{100}$ bits is normatively useless for humans.
  *   **Critique of your Candidate 3 (Convergence):** Asymptotic consistency is too weak. The requirement must be **Rate of Convergence**. Solomonoff induction satisfies this (error $\leq K(\mu) \ln 2$), but many frequentist consistency results do not.

  **3. Quantitative Specificity (Non-Negotiable)**
  *   **Specification:** The theory must specify the functional form of the complexity penalty (e.g., $2^{-K(h)}$ vs. $n^{-k}$). It cannot simply say "prefer simpler hypotheses."
  *   **Case:** Without a specific penalty function, the theory cannot resolve trade-offs between fit and complexity in borderline cases. To be normative, it must dictate *how much* fit to sacrifice for *how much* simplicity.
  *   **Critique of your Candidate 1 (Language-Independence):** This conflicts with Specificity. See Part 3.

  **4. Definability (Preference)**
  *   **Specification:** The prior and complexity measure must be mathematically well-defined, even if not computable.
  *   **Case:** Unlike decision theory (where we idealize the *calculation* of utilities), induction requires the *construction* of the prior. If the prior is not even definable (e.g., relies on arbitrary choices not specified by the theory), the "ought" is empty.
  *   **Critique of your Candidate 4 (Computability):** **Downgrade to Preference.** A normative theory can be incomputable (like logical omniscience). However, induction is unique: if the prior is lower semicomputable but not computable (like Solomonoff's), the agent cannot even verify that their probabilities sum to $\leq 1$. This is a stronger idealization than in decision theory, but acceptable for a *limit* standard.

  **5. Empirical Coherence (Preference)**
  *   **Specification:** The theory should rationalize successful scientific heuristics (e.g., $L_1$/$L_2$ regularization, BIC) as approximations of the ideal.
  *   **Case:** If the normative theory prescribes methods that systematically diverge from successful scientific practice without good reason (e.g., explaining why scientists are wrong to use cross-validation), its claim to normativity is weakened.
  *   **Critique of your Candidate 5 (Vindication):** **Keep as Preference.** Science is bounded and sometimes wrong. The theory should explain practice, not necessarily validate every historical instance of it.

  ---

  ### Part 2: Evaluation of Your Five Candidates

  Here is the direct assessment of whether your candidates are genuine desiderata or camp prejudices.

  1.  **Language-Independence:** **Prejudice.**
      *   **Why:** The Invariance Theorem ($|K_U(x) - K_{U'}(x)| \leq c$) is asymptotic. For finite $n$, the constant $c$ dominates. Since the choice of Universal Turing Machine (UTM) determines the constant, and the theory does not specify *which* UTM to use, the theory does not actually specify the prior. It outsources the inductive bias to the implementation. A normative theory that leaves the most critical parameter (the reference machine) unspecified is incomplete.
  2.  **Universality:** **Genuine Desideratum (with caveats).**
      *   **Why:** Restricting the hypothesis space a priori (e.g., to linear models) is dogmatism. However, "Universality" over *all* mathematically possible measures is too broad. It must be restricted to **Computable Semimeasures**. This is the sweet spot: broad enough to avoid dogmatism about the physical world, narrow enough to allow convergence theorems.
  3.  **Convergence:** **Genuine Desideratum (but needs strengthening).**
      *   **Why:** As noted in the specification, asymptotic convergence is necessary but not sufficient. The desideratum is valid, but your formulation is too weak. It must demand **bounded cumulative error**.
  4.  **Computability:** **Prejudice (of the practical camp).**
      *   **Why:** Demanding computability excludes the only known solution (Solomonoff) that satisfies Truth Containment and Finite-Sample Bounds for *all* computable environments. If you demand computability, you must accept that the normative standard will fail on some computable environments (Putnam's diagonalization). For a *normative* theory, incomputability is an acceptable cost for universality.
  5.  **Vindication of Practice:** **Genuine Desideratum.**
      *   **Why:** A normative theory of induction that implies scientists ought to ignore parsimony or overfit systematically is self-refuting. It need not match practice perfectly, but it must map onto it via approximation (e.g., MDL approximating Solomonoff).

  ---

  ### Part 3: Impossibility Results (Jointly Unsatisfiable Subsets)

  You suspected a No-Free-Lunch tension. You are correct. There are three fundamental incompatibilities you must navigate.

  **1. The "Finite Invariance" Impossibility**
  *   **Conflict:** **Language-Independence + Quantitative Specificity.**
  *   **Why:** To have quantitative specificity (Requirement 3), you must fix a penalty function (e.g., $2^{-K(x)}$). To calculate $K(x)$, you must fix a UTM. Fixing a UTM violates strict Language-Independence for finite data. The $O(1)$ constant is not noise; it *is* the inductive bias.
  *   **Result:** You cannot have a theory that is both precisely quantitative and invariant across reference frames for finite data. You must choose: either accept that the normative standard is relative to a "natural" UTM (a substantive physical claim), or accept that the theory is indeterminate for small $n$.

  **2. The "Computable Universal Learner" Impossibility (Putnam / Blum-Cucker)**
  *   **Conflict:** **Computability + Universality (Truth Containment) + Convergence.**
  *   **Why:** If a prediction method is computable, there exists a computable environment (constructible via diagonalization) that it fails to predict. Therefore, no computable method can converge to the truth for *all* computable environments.
  *   **Result:** If you make **Computability** Non-Negotiable, you must drop **Universality**. You must admit that the rational agent is *guaranteed* to fail on some computable worlds. If you keep Universality, you must accept **Incomputability** (Solomonoff).

  **3. The "Universal Finite-Sample" Impossibility (No Free Lunch)**
  *   **Conflict:** **Universality + Finite-Sample Error Bounds (uniform).**
  *   **Why:** NFL theorems show that averaged over all possible environments, no learner outperforms random guessing. To get finite-sample bounds (Requirement 2), you must weight the prior. If you weight the prior to favor simple hypotheses (to get bounds for simple truths), you worsen the bounds for complex truths.
  *   **Result:** You cannot guarantee good performance on *all* hypotheses with finite data. The theory can only guarantee: "If the truth is simple, you learn fast." This is not a bug, it's a feature, but it means **Universality** does not imply **Uniform Performance**.

  ---

  ### Part 4: The Workhorse Requirements

  You asked which requirement does the heavy lifting in excluding candidates, and which one admits the weak ones.

  **1. The Exclusionary Requirement: Computability**
  *   **Effect:** This is the single strongest filter.
  *   **Excludes:** **Solomonoff Induction.**
  *   **Keeps:** **MDL, Regularization, Carnap.**
  *   **Reasoning:** Solomonoff is the only candidate that satisfies Truth Containment and Finite-Sample Bounds for the full class of computable semimeasures. However, it is lower semicomputable, not computable. If you mark **Computability** as Non-Negotiable, Solomonoff is disqualified immediately. This forces you down to approximations (MDL) or restricted domains (Parametric Bayes/Carnap).
  *   **Verdict:** For a *normative* theory (like decision theory), this requirement should be a **Preference**. Making it Non-Negotiable sacrifices the only theoretically complete solution for the sake of implementability.

  **2. The Inclusionary Requirement: Universality (Truth Containment)**
  *   **Effect:** Dropping this admits the "weakest" candidates.
  *   **Admits:** **Standard Parametric Statistics, Ridge Regression, Carnapian Confirmation.**
  *   **Reasoning:** Most working scientific methods assume the truth lies within a specific parametric family (e.g., linear Gaussian models). They do not assign non-zero probability to *all* computable continuations. If you drop the requirement that the prior must cover **All Computable Semimeasures** and replace it with "Covers the relevant parametric family," then standard regularization and classical statistics become "adequate" normative theories.
  *   **Verdict:** This is the lever that separates a **General Theory of Induction** from a **Theory of Statistical Estimation**. If you want the former, Universality is Non-Negotiable. If you only care about the latter, you can drop it.

  ### Summary Recommendation

  To build the specification you want:

  1.  **Make Truth Containment (Universality over Computable Semimeasures) Non-Negotiable.** This ensures you are building a theory of *induction*, not just estimation.
  2.  **Make Finite-Sample Error Bounds Non-Negotiable.** This ensures the theory has bite for finite agents.
  3.  **Make Computability a Preference.** Allow the normative standard to be ideal (incomputable). This keeps Solomonoff on the table as the "gold standard" against which MDL is measured as an approximation.
  4.  **Drop Strict Language-Independence.** Acknowledge that the choice of reference machine is a physical/structural assumption about the world, not a logical truth. The theory should specify *how* the penalty scales, even if the baseline offset is machine-dependent.

  This specification leaves **Solomonoff Induction** as the unique satisfier of the Non-Negotiables, with **MDL** and **Regularization** standing as computable approximations that satisfy the Preferences. **Carnapian** and **Parametric** approaches fail the Non-Negotiable Truth Containment requirement.
