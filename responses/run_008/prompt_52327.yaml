answer: |-
  Dear colleague, I hope the semester is treating you well and that your students are proving as spirited as usual. I am writing to share a design for an in-class activity I have been refining for my upper-level seminar on the philosophy of cognitive science, specifically tailored to help students embody Daniel Dennett's taxonomy of creatures. The goal is to move beyond a lecture description of Darwinian, Skinnerian, Popperian, and Gregorian creatures and instead let the students feel the cognitive constraints of each type through a structured game. The session runs for ninety minutes with fourteen students, which allows us to divide the class into four teams of three or four, with each team assigned to one of the four creature types. The game itself is simple enough to explain in five minutes but opaque enough to require genuine inference. You present a hidden rule that governs a sequence of numbers, perhaps something like the input must be an ascending sequence of even numbers, though you should keep the actual rule secret until the end. The teams must submit sequences of three numbers to you, the arbiter, and you respond with either a pass or a fail. The objective is to deduce the rule and submit a valid sequence to earn points.

  The critical differentiation lies in the constraints placed on each team, which map directly onto Dennett's rungs. The Darwinian team plays under the condition of phylogenetic selection rather than individual learning. To simulate this, each student on the Darwinian team plays only one round. Once they submit their sequence and receive your verdict, they are retired for the rest of the game, representing an organism that does not survive to learn from its mistake. They are not allowed to communicate their outcome to the next teammate, or if they do, the next teammate is not allowed to use that information, effectively simulating an organism with no memory of previous trials and only one shot at survival. This usually results in low scores and significant frustration, which is pedagogically useful. The Skinnerian team consists of players who remain constant throughout the rounds. They are allowed to remember the outcomes of their previous submissions, so they can be shaped by reinforcement, but they are forbidden from deliberating before acting. You must enforce a strict time limit, say ten seconds, for them to submit their next sequence after receiving feedback. This prevents internal simulation and forces them to rely on behavioral shaping by the environment. The Popperian team also consists of constant players, but they are granted a limited number of offline previews. They can spend a point token to ask you a counterfactual question, such as if I submitted two, four, six would that pass, without it counting as an official round. This allows them to let their hypotheses die in their stead, simulating internal testing. Finally, the Gregorian team receives the same privileges as the Popperians but is also given external mind-tools, such as a whiteboard, markers, and a printed grid to track eliminated possibilities. This represents the offloading of cognitive work onto cultural artifacts.

  You should run the game for about forty minutes, keeping the pace brisk to maintain energy. Use tokens or chalkboard points for payoffs rather than money to keep the stakes academic but competitive. The Darwinians will likely score very low, the Skinnerians will improve slowly, the Popperians will improve faster but run out of tokens, and the Gregorians should theoretically solve the rule most efficiently. However, you must be prepared for the predictable chaos of the first run. Students will inevitably cheat on the constraints, particularly the Skinnerians who will try to whisper plans during their ten-second window or the Darwinians who will try to pass notes to their successors. You will need to act as a strict referee, or better yet, appoint a student from a previous cohort to police the rules so you can focus on the arbiter role. Another predictable issue is that the Darwinian team will feel the setup is unfair, which is exactly the point, but you must manage their frustration so it does not turn into disengagement. Remind them that nature is not fair and that their suffering is the lesson. The Popperians may also hoard their preview tokens too conservatively, failing to use the very advantage they were given, which offers a nice talking point about the cost of cognition during the debrief.

  Once the game concludes, you should spend the remaining forty minutes on the debrief, which is where the real philosophical work happens. Begin by mapping each team's experience to Dennett's taxonomy, asking them to describe what it felt like to be a Darwinian creature versus a Gregorian one. The Darwinians should report feeling like mere vessels for a trial that either succeeded or vanished, while the Gregorians should describe feeling like engineers managing a system. Then, pivot to the harder question that this activity is designed to provoke. Ask the students whether the differences they experienced were truly differences in the agents themselves or merely differences in how much structure the environment supplied. You can press the point that the Skinnerian team had the same brains as the Gregorian team, yet they performed differently because you, the instructor, constrained their environment. This leads directly to the question of whether a Darwinian creature in a richly selective environment is already doing something Popperian-shaped. If the environment is structured such that only certain variations survive, is the selection process doing the thinking rather than the agent? This challenges the clean boundaries of the taxonomy and invites them to consider cognition as a distributed process between agent and world.

  I must be frank with you about a significant limitation of this activity, one that you will need to address explicitly to avoid leaving students with a misleading impression. The game forces students to choose among given options or test specific inputs, but it does not reproduce the moment where a creature actually generates a novel hypothesis internally. In the game, the variation comes from the students guessing numbers, but the selection pressure is entirely external, supplied by you. In Dennett's view, the Popperian creature generates variations internally that have never been tried before, but here the students are merely probing the environment you control. You will have to supply this missing piece by hand during the discussion. You should explain that while the game simulates the selection of hypotheses, it cannot simulate the generation of them, and that true Popperian intelligence requires the capacity to create new options that are not just permutations of the old. Without this clarification, students might walk away thinking that cognition is just about filtering options rather than creating them. Despite this limitation, I have found that the visceral experience of the constraints makes the taxonomy stick in a way that reading Dennett alone does not. The frustration of the Darwinians and the relief of the Gregorians create a memorable anchor for the concepts. I hope this design serves you well, and I would love to hear how your students respond to the constraints, particularly whether they notice the environmental scaffolding before you point it out. Best of luck with the seminar.
