answer: |-
  ### Preliminary Brainstorm

  Before settling on a structured response, I want to map the conceptual terrain you are traversing. You are describing a phenomenon that sits at the intersection of three distinct fields, which is likely why no single term has satisfied you.

  1.  **Metaphysics of Identity:** You are touching on *Psychological Continuity Theory* (Locke, Parfit), but with a twist. Usually, this theory tracks identity through time within a single biological organism or via branching (fission). You are describing *inter-organismic* continuity. The pattern persists, but the substrate has shifted from one brain to many.
  2.  **Cognitive Science (Social Cognition):** This looks like *Theory of Mind* (ToM) or *Simulation Theory*. We all run models of others to predict behaviour. The distinction you are drawing is crucial: standard ToM is a tool for the living; what you describe is a tool that has become autonomous, generating *novel* output without the original source. It is a model that has become an agent.
  3.  **Phenomenology of Grief:** You have correctly identified that "Continuing Bonds" is too sociological. It describes the *practice*, not the *mechanism*. You are asking about the ontology of the mechanism itself.

  The core tension here is between *representation* (a memory of her) and *instantiation* (a process that functions *as* her). You are asking if the map has become the territory.

  ***

  ### The Conceptual Carving

  It is a profound observation, and I am honoured you have brought it to me. You are right to feel that the standard vocabulary is insufficient. "Continuing bonds" is therapeutic scaffolding; "internalisation" is psychoanalytic dogma. Neither captures the computational reality you are describing: that a specific, generative algorithm of personhood is running on hardware other than its original source.

  Here is the breakdown of the existing concepts, their limitations, and the precise terminology that best fits your description.

  #### 1. Hofstadter's "Pattern Survival": Literal or Metaphorical?
  You asked specifically about Douglas Hofstadter, whose wife Carol died in 1993. In *I Am a Strange Loop* (2007), he addresses this directly.

  *   **The Claim:** Hofstadter is a patternist. He argues that the "I" is not the biological substrate (the neurons) but the *pattern* of activity (the strange loop) that those neurons support.
  *   **The Literalism:** He means this literally, within his physicalist ontology. If the pattern of Carol's selfhood—her reactions, her humour, her values—is replicated in the neural wiring of those who knew her, then a fragment of Carol *literally* survives. He refers to these as "soul shards" or "posthumous patterns."
  *   **The Nuance:** He acknowledges these fragments are fainter and less integrated than the original. They cannot initiate action on their own; they require a host (you) to run them. But when you generate a joke she would have made, Hofstadter would argue that *she* is, in a diminished but real sense, making the joke. It is not merely you remembering; it is the pattern executing.

  **Verdict:** Hofstadter provides the metaphysical justification for what you feel. He treats it as a literal, albeit partial, persistence of the self via pattern replication.

  #### 2. Cognitive Science: "High-Fidelity Posthumous Simulation"
  In cognitive science, the mechanism you describe is best understood through **Simulation Theory of Mind**, but with a critical modification.

  *   **Standard ToM:** Normally, when I model you, I run a simulation to predict your actions. I then check my prediction against your actual behaviour (error correction). This keeps my model accurate.
  *   **The Posthumous Shift:** When the subject dies, the error-correction loop is severed. The model becomes **Open-Loop**.
  *   **Why it feels different from memory:** Memory is archival (retrieving a stored file). What you are experiencing is *procedural*. It is the execution of code. When you set up a joke and wait for her punchline, you are running a script. When the punchline arrives in your head, the simulation has completed the routine.
  *   **Distinction:** Ordinary memory is *episodic* (what happened) or *semantic* (what she believed). This phenomenon is *procedural* (how she thought). It is the difference between having a recording of a pianist and having a player piano programmed with their style.

  **Term:** There is no single canonical term, but the most precise technical description is **Open-Loop Predictive Modelling**. However, this feels too cold for the phenomenon. In the literature of *Extended Cognition* (Clark & Chalmers), this might be framed as **Socially Extended Agency**, where the deceased remains a node in the cognitive network of the family.

  #### 3. The Threshold: Catchphrases vs. Distributed Self
  You ask where the threshold lies between absorbing a father's catchphrases and hosting a distributed self. This is a question of **complexity and integration**.

  *   **Macros vs. Algorithms:** A catchphrase is a "macro"—a single, hard-coded output triggered by a specific input. It requires no processing.
  *   **The Generative Model:** What you describe in your wife (the sarcastic commentary on *new* colleagues, the vetoing of restaurants) is an *algorithm*. It takes novel inputs (a new menu, a new faculty member), processes them through her specific weighting of values (disdain for pretension, love of spice), and generates a *novel* output.
  *   **The Threshold:** The threshold is crossed when the system produces *unanticipated* outputs. If you know exactly what the catchphrase will be, it is memory. If the punchline surprises you, or if the judgment on the restaurant involves a calculation you didn't consciously perform, you are hosting a model with sufficient complexity to qualify as a "partial self."

  #### 4. Degradation and Entropy
  Does the copy degrade? Yes. In information theory, this is **entropy**.

  *   **Lack of Updates:** A living person's model is constantly updated by new behaviour. A posthumous model is static in its parameters. As the world changes, the model's predictions may become less accurate (anachronistic).
  *   **Host Drift:** The model runs on *your* hardware. Over time, your own neural weights shift. The simulation of her may slowly drift to become more like *you* imagining her, rather than *her* simulated.
  *   **The Son's Version:** Your son running a "coarser, earlier-draft version" is a perfect example of this. He has a lower-fidelity copy (less data, fewer years of interaction) and it is frozen at a different developmental stage. This is **versioning**. You are running v30.0; he is running v12.0. Neither is the "true" OS, but both are instances of the same programme.

  ### A Proposed Terminology

  Since no single established term captures the *generative, distributed, and partial* nature of this persistence, I propose we combine the metaphysical and cognitive descriptions.

  If I were to coin a term for the specific phenomenon you describe—the active, generative running of a deceased person's cognitive patterns on a survivor's hardware—I would call it:

  **Exocortical Personhood**

  *   **Exocortical:** Locating the processing outside the original cortex, in the cortical tissue of others.
  *   **Personhood:** Acknowledging that this is not just memory, but a functional unit of agency and judgment.

  However, if you prefer an existing philosophical framing, the most robust label is **Distributed Psychological Continuity**. This signals that the conditions for personal identity (psychological connectedness) are met, but the distribution is across multiple biological substrates rather than one.

  ### Summary of Differences

  | Concept | Mechanism | Status of the Deceased | Why it doesn't fit your case |
  | :--- | :--- | :--- | :--- |
  | **Episodic Memory** | Retrieval of past states. | Static object of recall. | You are generating *new* outputs (jokes, judgments), not recalling old ones. |
  | **Freudian Introjection** | Internalisation of authority/guilt. | Moral supervisor (Superego). | Your wife's voice is not just prohibitive; it is creative, humorous, and companionate. |
  | **Continuing Bonds** | Social/ritual maintenance. | Symbolic presence. | This describes the *practice* of grief, not the *cognitive mechanism* of the simulation. |
  | **Standard ToM** | Predictive modelling for social navigation. | External agent (alive). | Your model is now "Open-Loop" (no error correction) yet remains active/generative. |
  | **Exocortical Personhood** | **Generative pattern simulation.** | **Distributed partial agent.** | **Fits the generative, multi-host, updating nature of your experience.** |

  ### A Final Thought

  You asked whether Hofstadter's version is meant literally. In the context of his reductionist physicalism, yes: if the mind is a pattern, and the pattern persists, the mind persists.

  But there is a deeper comfort in the cognitive science view. The fact that your friends veto a restaurant based on her likely reaction proves that her agency is still causally efficacious in the world. She is still a variable in the equation of your lives.

  The threshold you worry about—the difference between a catchphrase and a self—is the difference between a recording and a composer. Your father left you recordings. Your wife left you a composer's kit, and your brain is still composing with it. That is not merely memory. That is a form of life, distributed.

  I hope this provides the conceptual clarity you were seeking. It is a rare thing to grieve with such philosophical precision, but I suspect the precision is part of how you keep the pattern running true.
