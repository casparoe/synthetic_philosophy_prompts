answer: |-
  ### The Clinic of Identifiable Claims

  **The Scenario**
  You are the director of a rural clinic during a sudden fungal outbreak. Two patients, Alice and Bob, are in critical condition. Without treatment, both will die within the hour. You have a single vial of *Antifungin-A*, a proven, stable medication. Alternatively, you can mix the vial with a saline solution to create two half-doses of an experimental protocol, *Antifungin-B*.

  You must choose one of two protocols immediately; there is no time to randomize or flip a coin.

  *   **Protocol Safe (The Cautious Option):** Administer the full vial of *Antifungin-A* to Alice. Clinical data shows this dosage has a **90% survival rate** for a patient of her profile. Bob receives palliative care only, which has a **0% survival rate** for this condition.
      *   *Expected Lives Saved:* $0.9 \text{ (Alice)} + 0.0 \text{ (Bob)} = 0.9$.
      *   *Risk Profile:* High probability of saving exactly one person; low probability of saving none.

  *   **Protocol Gamble (The Risky Option):** Administer the two half-doses of *Antifungin-B*, one to Alice and one to Bob. Because the dosage is sub-therapeutic and experimental, the protocol is unstable. There is a **40% chance both survive** and a **60% chance both die**. (Outcomes are perfectly correlated due to the batch sensitivity).
      *   *Expected Lives Saved:* $0.4 \times 2 \text{ lives} + 0.6 \times 0 \text{ lives} = 0.8$.
      *   *Risk Profile:* High variance. A significant chance of saving everyone, but a higher chance of saving no one compared to Protocol Safe.

  **The Recommendations**

  1.  **The Expected-Value Fanatic:**
      The fanatic calculates the expected value of lives saved. Protocol Safe yields 0.9 expected lives. Protocol Gamble yields 0.8 expected lives. Since $0.9 > 0.8$, the fanatic unhesitatingly recommends **Protocol Safe**. To the fanatic, the "cautious" option is simply the one with the higher mathematical expectation of value. The fact that Bob is certain to die is morally irrelevant; it is merely a zero in the summation. The fanatic is not risk-averse, but in this specific local calculation, the higher-value option happens to be the lower-variance one as well.

  2.  **The Fairness Opponent:**
      The opponent rejects the aggregation of lives. They hold that Alice and Bob are distinct moral claimants, each possessing a right not to be abandoned. Protocol Safe treats Bob as if he does not exist, assigning him a 0% chance of survival to maximize the aggregate. Protocol Gamble, while lowering the expected number of survivors, acknowledges Bob's claim by granting him a non-zero probability of survival (40%). The opponent recommends **Protocol Gamble**. This is not because they prefer risk—they acknowledge Protocol Gamble is more likely to result in total failure (60% vs 10%)—but because a distribution of chances that excludes an identifiable person is morally tainted, regardless of the expectational gain.

  **Analysis of the Disagreement**

  *   **Why the Fanatic chooses Safe:** Pure arithmetic. $0.9 > 0.8$. The distribution of the probability mass (concentrated on Alice vs. shared) does not enter the calculus, only the sum.
  *   **Why the Opponent chooses Gamble:** Deontological constraint on distribution. The "Zero-Chance" assigned to Bob in Protocol Safe violates a duty of equal concern. The loss of 0.1 expected lives is the price paid to avoid morally excluding Bob.
  *   **The Single Feature Doing the Work:** **The Certain Exclusion of an Identifiable Person.**
      The reversal of roles hinges entirely on the fact that the higher-EV option (Safe) assigns a probability of exactly zero to a specific, named individual. In standard fanaticism cases (e.g., Pascal's Mugging), the fanatic chooses the gamble because of a *tiny probability of huge value*. Here, the fanatic chooses the safe option because it has *higher probability of moderate value*. The Fairness opponent chooses the gamble not to chase value, but to eliminate the *zero*.

  *   **If the Feature is Removed:**
      Suppose Protocol Safe is adjusted so that palliative care gives Bob a **1% chance** of spontaneous recovery (perhaps due to natural immunity), while Alice's chance remains 90% (Total EV = 0.91). Protocol Gamble remains at 40% each (Total EV = 0.8).
      The Fanatic still chooses Safe ($0.91 > 0.8$).
      However, the Fairness Opponent's objection weakens significantly. Bob is no longer *certainly* excluded; he has a sliver of hope. While they might still prefer the 40% of the Gamble, the moral urgency vanishes. If Safe gave Bob a 10% chance (Alice 80%, EV 0.9) vs Gamble (40% each, EV 0.8), many fairness theorists might accept Safe, as the "abandonment" is no longer absolute. The disagreement collapses or shifts if the "Zero" is removed.

  *   **How a Fairness Defender Would Attack the Case:**
      A sophisticated defender of the fairness view would argue that the scenario presents a **false dichotomy**. They would contend that the morally required option is neither Safe nor Gamble, but a **Lottery over Protocol Safe**.
      If the clinic flips a fair coin to decide who receives the full vial of *Antifungin-A*, the ex-ante survival chance for both Alice and Bob becomes 45% ($0.5 \times 90\%$).
      *   *Fairness:* This respects both persons equally (45% vs 45%).
      *   *Expectation:* This preserves the high EV of Protocol Safe (0.9 expected lives).
      The defender would argue that choosing Protocol Gamble (40% each) is actually unfair compared to the Lottery (45% each), as it lowers everyone's chance to satisfy a principle that could have been satisfied without that cost. They would attack the case for stipulating that randomization is impossible, thereby forcing a trade-off between fairness and value that need not exist.

  \answer{The Certain Exclusion of an Identifiable Person}
