answer: |-
  The exclusion of moral expertise from the criminal courtroom—often codified as the rule against witnesses opining on the "ultimate issue"—rests on a complex, hybrid epistemology. It is not merely a procedural quirk but a philosophical stance on the nature of blame, the transmission of moral knowledge, and the political legitimacy of punishment.

  ### 1. The Implicit Epistemology: Non-Deferential Moral Understanding

  The courtroom exclusion presupposes a view of moral knowledge that is **performative and first-personal**, rather than purely propositional.

  If the legal system operated on a simple factual model, an expert could analyze the defendant's actions and conclude, "This constitutes wickedness," just as a ballistics expert concludes, "This bullet came from that gun." By forbidding this, the law implies that moral judgment (culpability, wickedness, adequacy of excuse) cannot be acquired via testimony without loss of value.

  This aligns closely with **moral testimony pessimism**, specifically the "understanding" objection advanced by philosophers like Alison Hills and Richard Hopkins. They argue that while one might acquire moral *belief* via testimony (e.g., "My guru says lying is wrong"), one cannot acquire moral *understanding* or *worthiness* in that belief without grasping the reasons oneself. In a criminal trial, the jury is not merely tasked with finding the truth; they are tasked with *condemning*. If the jury condemns only because an expert told them to, the condemnation is hollow. The epistemology here suggests that **moral knowledge regarding blame requires autonomous processing of the reasons.** To know that a defendant *deserves* punishment, the knower must engage directly with the facts of the case and the moral norms at stake.

  However, this epistemology is inextricably bound to **democratic legitimacy**. The jury is not just a truth-finding engine; it is a political institution representing the community's conscience. The exclusion of moral expertise preserves the idea that the state's power to punish derives from the peer group of the accused, not from a technocratic elite. Thus, the courtroom presupposes that moral knowledge in the context of criminal justice is **constitutive**: the knowledge *is* the community's judgment, not an external fact waiting to be discovered by experts.

  ### 2. Reconciliation with Deference Elsewhere

  The legal system's deference to moral/normative expertise in torts, disciplinary panels, and research ethics committees appears contradictory, but it can be reconciled through a distinction between **standards of care** and **communal blame**.

  *   **Tort and Professional Discipline:** In these contexts, the question is usually whether conduct fell below an objective standard of competence or reasonableness (e.g., the "reasonable doctor" or "outrageous conduct"). These are treated as **technical norms**. A medical board can rely on expert testimony to define "acceptable medical practice" because the profession itself generates the norm. The judgment is regulatory and forward-looking (safety, competence), not primarily retributive.
  *   **Research Ethics:** RECs defer to experienced members because the stakes involve systemic risk and protocol compliance. This is administrative governance, not individual condemnation.
  *   **Criminal Law:** Here, the stakes are liberty and moral stigma. The judgment is backward-looking (blame for a past act) and retributive.

  **The Reconciliation:** The system is consistent if we view the deference in torts/discipline as **epistemic** (experts know the technical standards of the field) and the exclusion in criminal law as **political/moral** (only the community can authorize the moral stigma of conviction). The legal system implicitly argues that while experts can define *negligence* (a failure of skill or care), they cannot define *guilt* (a failure of moral will).

  However, this reconciliation is fragile. In tort law, judges determining whether conduct was "outrageous" enough for emotional harm *are* making a moral judgment as a matter of law. This suggests the system is not consistent. It likely reflects a pragmatic compromise: we trust judges (as state officials) to make moral thresholds in civil law to prevent frivolous suits, but we distrust both judges and experts to make moral thresholds in criminal law to prevent tyranny. The inconsistency reveals that the exclusion of moral expertise is not about the *possibility* of moral knowledge, but about **who holds the monopoly on violence.**

  ### 3. The Counterfactual: If Moral Testimony Were Optimistic

  If we accepted **moral testimony optimism**—the view that one can come to know an act was wrong, and that a defendant deserves punishment, merely by being told so by a credible expert—courtroom practice would undergo a radical technocratic shift.

  **A. The Rise of the Moral Expert Witness**
  Just as we have forensic psychiatrists, we would see **forensic ethicists**. A philosopher or theologian could testify: "Based on utilitarian principles, the defendant's action was maximally wrong," or "From a virtue ethics perspective, his excuse is inadequate." The jury would be instructed that they may treat this testimony as conclusive evidence of culpability, much like DNA evidence is treated as conclusive of identity.

  **B. Erosion of the Jury's Role**
  The jury's function would shift from **judges of conscience** to **auditors of expertise**. Their task would no longer be to deliberate on the moral weight of the act, but to determine which moral expert is more credible. This would likely lead to a "battle of the ethicists," mirroring the current battle of psychiatric experts, but with higher stakes. Alternatively, it would accelerate the move toward **bench trials**, as judges could be trained to be the primary recipients of this moral testimony, rendering the lay jury obsolete.

  **C. Sentencing and "Deservedness"**
  Currently, sentencing considers culpability. Under moral testimony optimism, experts could testify specifically on **retributive desert**. "Dr. X testifies that given the wickedness of the act, 10 years is the morally proportional response." This would mechanize sentencing, potentially reducing disparity but also removing the "mercy" function of the jury or judge.

  **D. Loss of Legitimacy**
  The most profound change would be sociological. If a defendant is condemned because an academic said so, rather than because twelve peers said so, the **expressive function of the law** changes. The verdict ceases to be the community speaking to the offender and becomes the state applying a moral science. This might increase consistency but would likely decrease the perceived legitimacy of the verdict among the populace, who intuitively sense that moral blame requires peer judgment.

  ### Conclusion

  The exclusion of moral expertise in criminal trials presupposes that moral knowledge regarding blame is **non-transferable**; it must be generated by the moral agent (the juror) engaging with the evidence. While this seems inconsistent with the deference shown to experts in torts and professional discipline, the distinction lies in the difference between regulating **competence** (where expertise applies) and assigning **blame** (where community autonomy is required).

  If we were to adopt moral testimony optimism, we would transform the criminal trial from a **ritual of communal judgment** into an **inquiry into moral facts**. We would gain epistemic efficiency and perhaps consistency, but we would lose the democratic legitimacy that anchors the moral force of criminal punishment. The current system, inconsistent as it may be elsewhere, protects the idea that the power to condemn is a right of the people, not a skill of the experts.
