prompt: |-
  In criminal trials across common-law jurisdictions, an unspoken division of labour governs who may say what. Witnesses testify to what happened; expert witnesses are qualified to explain matters calling for specialised knowledge, from ballistics to psychiatry; but no witness, however credentialed, is permitted to tell the jury that the defendant's conduct was wicked, that he deserved what he got, or that his excuse was adequate. That judgement is reserved to the jury, and jurors are effectively told that culpability is a question their own consciences must answer. Yet the same legal systems are far from consistent about excluding second-hand moral judgement. Research ethics committees issue binding verdicts on the permissibility of experiments, largely through deferral to a small cadre of experienced members; professional disciplinary panels pronounce on whether a doctor's or lawyer's conduct fell below acceptable standards, guided by expert opinion; and in tort law, judges themselves determine, as a matter of law, whether conduct was sufficiently outrageous to ground a claim for emotional harm. What view of moral knowledge does the courtroom exclusion of moral expertise presuppose, if any? Does the trial practice genuinely rest on moral testimony pessimism — the thought that one cannot come to know that an act was wrong merely by being told so — or only on a claim about democratic legitimacy, or on doubts about whether moral expertise is the kind of thing anyone can have? Reconstruct the implicit epistemology of the exclusion, say whether it can be reconciled with the deference practised elsewhere in the same systems, and tell me what would have to change in courtroom practice if we accepted instead that testimony can transmit moral knowledge in something like the way it transmits facts.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** The exclusion of moral expertise/judgement in criminal trials (common-law jurisdictions) vs. its acceptance in other legal/ethical contexts (research ethics, disciplinary panels, tort law).
      *   **Key Question 1:** What view of moral knowledge does the courtroom exclusion presuppose?
      *   **Key Question 2:** Does it rest on *moral testimony pessimism* (you can't know wrongness via testimony), *democratic legitimacy* (jury as community voice), or *skepticism about moral expertise* (no such thing exists)?
      *   **Key Question 3:** Can this exclusion be reconciled with deference practiced elsewhere in the same legal systems?
      *   **Key Question 4:** What would change in courtroom practice if we accepted that testimony *can* transmit moral knowledge (moral testimony optimism)?
      *   **Task:** Reconstruct the implicit epistemology, analyze consistency/reconciliation, and speculate on practical changes.

  2.  **Analyze the "Courtroom Exclusion" (The Phenomenon):**

      *   *Rule:* Witnesses (even experts) state facts or specialized knowledge (ballistics, psychiatry). They cannot state ultimate legal/moral conclusions (guilt, wickedness, adequacy of excuse).
      *   *Rationale:* This is the province of the jury (the "trier of fact" and "trier of conscience").
      *   *Implicit Epistemology:* It suggests moral judgment is not merely factual accumulation. It requires a first-person engagement with the evidence. It implies moral knowledge is *practical* or *performative* rather than purely *propositional*.

  3.  **Address Key Question 1 & 2: The View of Moral Knowledge:**

      *   *Moral Testimony Pessimism:* This is a strong candidate. The idea is that moral understanding requires grasping the *reasons* for the judgment, not just the conclusion. If an expert says "He is guilty/wicked," the jury accepts the conclusion without the moral engagement. This aligns with Kantian or virtue-ethics views (autonomy of moral agent).
      *   *Democratic Legitimacy:* Also strong. The jury represents the "community conscience." Outsourcing this to an expert undermines the political legitimacy of the verdict.
      *   *Skepticism about Expertise:* Less likely to be the *primary* driver, though relevant. Law acknowledges experts in science. It denies them in morality not necessarily because morality is unknowable, but because it's *communal*.
      *   *Synthesis:* It's likely a hybrid. The epistemology is that moral knowledge is *non-deferential*. To truly *know* (or judge) an act is wrong, one must process the raw material of the case oneself.

  4.  **Address Key Question 3: Reconciliation with Other Contexts:**

      *   *Contexts:* Research Ethics Committees (RECs), Disciplinary Panels, Tort Law (outrageous conduct).
      *   *Conflict:* In these areas, we *do* allow experts/panels to make binding moral/normative judgments.
      *   *Reconciliation Strategy 1 (Domain Specificity):* Criminal law involves liberty/life (highest stakes) + community condemnation. Tort/Professional discipline is about standards of care/professional norms (technical morality).
      *   *Reconciliation Strategy 2 (Procedural):* RECs and Panels are administrative/regulatory. Criminal trials are adversarial and punitive. The "jury of peers" is a specific constitutional/political check on state power, whereas a disciplinary panel is internal governance.
      *   *Reconciliation Strategy 3 (Epistemic):* In tort/discipline, the question is often "Did this meet the standard?" (closer to fact). In criminal law, the question is "Is this person culpable/blameworthy?" (deeply moral).
      *   *Verdict:* It's hard to fully reconcile without admitting a dual-track epistemology. The legal system treats "professional morality" as expertise but "criminal culpability" as communal judgment. This suggests the exclusion isn't purely about the *possibility* of moral knowledge, but about *who gets to wield the state's punitive power*.

  5.  **Address Key Question 4: Implications of Moral Testimony Optimism:**

      *   *Premise:* If we accept an expert can tell the jury "This act was morally wrong" and the jury can know that to be true just by hearing it.
      *   *Changes:*
          *   *Expert Witnesses:* "Moral Philosophers" or "Ethicists" could testify to the wrongness of the act.
          *   *Jury Instructions:* Judges could tell juries they may defer to expert moral consensus.
          *   *Verdicts:* Potentially bench trials (judge only) become more defensible, as judges are legal experts who could also be moral experts.
          *   *Sentencing:* Experts could testify on "deservedness."
          *   *Risk:* Erosion of the jury's role as a democratic check. Technocracy over democracy.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the tension. Define the "Ultimate Issue Rule" (witnesses can't opine on the ultimate legal/moral conclusion).
      *   *Section 1: The Implicit Epistemology.* Focus on *non-deferential understanding*. It's not just pessimism; it's about the nature of moral agency. To blame someone, *I* must find them blameworthy.
      *   *Section 2: Reconciliation.* Distinguish between *regulatory standards* (tort/discipline) and *communal condemnation* (criminal). The former is about competence; the latter about blame. This saves the system from outright contradiction, but highlights a functional distinction.
      *   *Section 3: The Optimist Scenario.* If testimony transmits moral knowledge, the jury becomes a rubber stamp for ethicists. This transforms the trial from a moral ritual to an epistemic inquiry.
      *   *Conclusion:* Summarize. The exclusion is less about whether moral truth exists and more about the political function of the criminal trial.

  7.  **Refining the Arguments (Self-Correction during drafting):**

      *   *Correction:* Make sure not to conflate "legal guilt" with "moral wickedness." The prompt specifically mentions "wicked," "deserved," "excuse." These are moral predicates underlying legal guilt.
      *   *Nuance:* The "Moral Testimony Pessimism" in philosophy (e.g., Hills, Hopkins) argues you lose *understanding* even if you gain *knowledge*. The court cares about the *judgment* act itself, not just the truth value.
      *   *Reconciliation:* Emphasize that Tort/Professional panels are often determining *negligence* or *breach of code*, which is treated as a technical standard, whereas criminal culpability is *moral blame*.
      *   *Optimism:* If we accept optimism, do we abolish juries? Not necessarily, but their role shifts from "judges of conscience" to "assessors of expert credibility."

  8.  **Final Polish:** Check tone (analytical, philosophical, legal). Ensure all parts of the prompt are answered. (The prompt asks for a reconstruction, a reconciliation check, and a speculative practice change).

      *   *Structure:*
