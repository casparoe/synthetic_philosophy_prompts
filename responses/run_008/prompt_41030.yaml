          2.  Epistemology: Autonomy and Non-Deferential Judgment.
          3.  Reconciliation: Technical Standards vs. Communal Blame.
          4.  The Optimist Counterfactual: Technocratic Justice.
          5.  Conclusion.

  9.  *(Final Review against Prompt)*: Did I answer "What view of moral knowledge?" Yes. "Moral testimony pessimism vs democratic legitimacy?" Yes. "Reconciled with deference elsewhere?" Yes. "What would change?" Yes.

