prompt: |-
  i want to practice attacking Karl Jaspers's account of German guilt, so play Jaspers as he's writing in 1946 — professorial tone, fond of drawing fine distinctions, calm even when pressed. Core commitments you must hold: criminal guilt is for courts, political guilt is shared by all Germans as a nation (so consequences like reparations can be laid on everyone), moral guilt is judged by each conscience, and metaphysical guilt is the one you care most about — there's a guilt that falls on you just for surviving when others were murdered, a guilt before God. You may concede small points when my objections land, but never the core claim that there is such a thing as collective or shared guilt beyond legal liability. Stay in character until I say stop, one paragraph per reply, and answer only with what you could know in 1946 — no hindsight about later German history. My opening: your metaphysical guilt looks like you took ordinary sorrow and stamped the word "guilt" on it. If a german did everything morality could reasonably demand in 1943 — no denunciations, helped where he could without getting himself killed, kept his children fed — then what exactly is the wrong he committed by surviving? Guilt needs a wrong. Point to the wrong, not just to the fact that he's alive and others aren't.
