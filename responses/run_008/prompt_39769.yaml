answer: |-
  Here is a gloss on the distinction you mentioned, followed by the tier list and an evaluation of your criterion.

  **Weak vs. Strong Emergence:** *Weak emergence* refers to macro-properties that are derivable from micro-laws in principle, but only via simulation or observation (they are computationally irreducible). *Strong emergence* claims macro-properties have causal powers that are fundamentally irreducible to, or independent of, the micro-level (a controversial ontological claim).

  ### Tier List

  **Tier A (High Simulation Surprise)**
  *   **(4) Phantom traffic jams:** Counter-intuitive shockwaves arise from smooth driving rules; the backward-moving jam is impossible to deduce without simulating the non-linear interactions.
  *   **(5) Critical exponents (Universality):** Wildly different micro-systems yield identical macro-behavior, proving the macro-pattern is independent of specific micro-details.
  *   **(7) Langton's ant:** The transition from chaos to a structured "highway" is computationally irreducible; you cannot shortcut the 10,000 steps to predict the outcome.

  **Tier B (Moderate Simulation Surprise)**
  *   **(2) Superconductivity:** Requires new vocabulary (macroscopic wavefunction) not present in single-electron laws, but derivable via many-body quantum mechanics.
  *   **(3) Game of Life glider:** A stable "object" that moves, which is ontologically distinct from static cells, but the pattern is simple enough to be spotted quickly in a simulation.

  **Tier C (Low Simulation Surprise)**
  *   **(8) Market clearing:** Equilibrium emerges from individual optimization, but basic supply/demand intuition makes the direction of the macro-outcome less surprising than non-linear physics.

  **Tier D (Minimal Simulation Surprise)**
  *   **(1) Gas pressure:** This is a straightforward statistical aggregate of particle impacts; the macro-variable is defined directly by the micro-dynamics.
  *   **(6) Wetness of water:** Largely a subjective sensory experience or a description of adhesion forces, not a distinct physical property emerging from H₂O molecules alone.

  ### Evaluation of "Simulation Surprise"

  Your criterion survives this exercise surprisingly well, but it maps specifically to **Weak Emergence** (specifically Mark Bedau's definition of computational irreducibility) rather than ontology. Your friend is correct that predictive difficulty is epistemic; however, in philosophy of science, if a property *requires* simulation to be known (like Langton's highway), it functions *as if* it is ontologically distinct for any finite observer. The criterion breaks down only if you claim this proves **Strong Emergence** (downward causation); "Simulation Surprise" successfully identifies where reductionism is pragmatically useless, even if it remains true in principle.

  \answer{1:D, 2:B, 3:B, 4:A, 5:A, 6:D, 7:A, 8:C}
