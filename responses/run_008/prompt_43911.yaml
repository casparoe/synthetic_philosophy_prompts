answer: |-
  1. "The practice, spelled out"
  Operational oceanography and navigation rely on distinguishing inertial from non-inertial frames using only local measurements. Inertial Navigation Systems (INS) integrate accelerometer and gyroscope data to track position without external fixes, detecting rotation via Sagnac effects or mechanical precession. Gyrocompasses align with Earth's rotation axis independently of magnetic fields or stars. In oceanography, inertial oscillations manifest as currents rotating at the Coriolis frequency $f = 2\Omega \sin \phi$, dictated by Earth's spin rate $\Omega$. Geodesy formally splits "gravity" into Newtonian gravitation plus a centrifugal potential derived from rotation. These practices treat rotation as absolute: a sealed box contains sufficient information to determine its spin state. The equations of motion consistently require fictitious forces (Coriolis, centrifugal) when referenced to the Earth-fixed frame, implying that frame is objectively non-inertial compared to a local free-falling or non-rotating standard.

  2. "What it seems to presuppose"
  The sealed box is crucial because it eliminates relative motion to nearby material bodies as the source of inertial forces. If rotation were merely relative to the ship's hull or the ocean surface, a sealed box drifting with them would detect nothing. Instead, the box detects stress and precession. This practice presupposes that spacetime itself possesses a geometric structure capable of defining a standard of non-rotation locally. It implies that acceleration and rotation are not merely relations between bodies but properties of a body's trajectory through a background arena. Philosophically, this commits you to *substantivalism* about spacetime structure: there exists something over and above material bodies that dictates which frames are inertial. The practice assumes this structure is rigid enough to define a unique class of non-rotating frames (local Lorentz frames) against which fictitious forces are measured. It treats the metric connection (how vectors are transported) as physically real, not just a calculational tool. Without this background structure, the forces measured by your accelerometers would lack a cause, as there are no nearby masses within the box to generate them relationally.

  3. "The three candidates"
  **Newton:** Absolute space provides a fixed background. Your gyroscopes measure rotation relative to this invisible scaffold. This licenses the practice perfectly but posits an unobservable entity. **Mach:** Mach argued inertia arises from interaction with distant matter ("fixed stars"). In an empty universe, a bucket wouldn't climb. This struggles with the sealed box: how does the box "know" about distant stars instantly? Machian views often require action-at-a-distance or specific cosmological boundary conditions to recover the practice. **GR Metric:** General Relativity posits a metric field $g_{\mu\nu}$. This field dictates geodesics and inertial guidance. It is neither Newton's static space nor purely Machian relations; it is a dynamic physical entity with degrees of freedom (gravitational waves). You weren't wrong about GR: it hands the job to the metric. This licenses the practice robustly; the gyroscopes measure precession relative to the local metric connection. However, GR is only partially Machian; the metric exists even in vacuum solutions (like Minkowski space), meaning inertia persists without distant masses. So, Newton and GR license the practice directly. Mach requires extra assumptions about the universe's mass distribution to match the precision of your inertial navigation.

  4. "Where it's underdetermined"
  The practice is profoundly underdetermined regarding ontology. Your inertial navigation equations yield identical numerical corrections whether you assume Newton's absolute space, a Machian sum of distant potentials, or the GR metric field. Locally, the Christoffel symbols in GR function mathematically like Newton's absolute acceleration terms. The practice measures the *magnitude* of non-inertial effects, not the *source* of inertia itself. Unless you measure gravitational waves or probe cosmological scales where boundary conditions matter, the local physics of a gyrocompass is insensitive to whether the reference is "space itself" or "the sum of distant masses." Even the distinction between gravitation and gravity in geodesy works identically in Newtonian mechanics and the weak-field limit of GR. Consequently, the operational success of oceanography and navigation cannot adjudicate between substantivalism and relationalism; it only confirms that a rigid standard of non-rotation exists locally.

  5. "What would have to change"
  Nothing operational would change. The Coriolis correction remains $2\Omega \times v$. The gyrocompass still finds north. The instruments measure physical stresses regardless of your metaphysical stance. Swapping Newton for GR changes only the footnotes in your textbooks and the justification for *why* the equations work, not the equations themselves. You would not recalibrate a single sensor. The practice is robust against these philosophical shifts because it operates within the empirical overlap where all three theories converge. The only change is in how you answer the question "Rotating with respect to what?"—but since that answer never enters the calculation, the work proceeds identically.
