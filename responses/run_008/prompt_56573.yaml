      *   **Step 2:** Dave makes the Taurek move. "No collective victim." This is philosophically coherent but counter-intuitive. However, his phrasing "nobody... is worse off than they would have been had he headed south" is logically tricky. If he heads South, the 5 live. If he heads North, the 5 die. So the 5 *are* worse off if he heads North. Dave's point is about *comparative harm to a specific individual across choices*. But actually, the 5 are definitely worse off if he chooses North. Dave is trying to say the *sum* of harm isn't a valid metric.
          *   *Critique:* Dave is technically wrong on the "nobody is worse off" claim (the 5 are worse off than they would be in the alternative). But his underlying point (aggregation is problematic) is a valid philosophical position. Cousin's "malicious" claim is strong. *Verdict: Cousin is practically right, Dave is philosophically interesting but practically weak here.*
      *   **Step 3:** Cousin's "Impersonal Badness" is a strong counter to Taurek. The "Where is the line?" (Sorites) is the classic objection to Taurek. If numbers don't count, why would 1 vs 1,000,000 differ? Dave admits he doesn't know where the line is. *Verdict: Cousin lands a heavy blow. Dave's admission weakens his stance.*
      *   **Step 4:** The Coin Flip. Taurek *does* advocate for the coin flip to show equal concern. Cousin's math (50% vs 10%) is the standard rebuttal (give each *person* an equal chance, which means weighted lottery). Dave's defense (group fairness) *does* contradict his Step 2 (groups don't exist). Cousin catches this inconsistency. *Verdict: Cousin wins on consistency.*
      *   **Step 5:** The Million. Dave bites the bullet. This is the "reductio ad absurdum" test. Most people find 1 vs 1 Million coin flip unacceptable. Dave's defense (tyranny of the majority) has merit regarding rights, but in triage, saving lives usually trumps strict individual equality. *Verdict: Cousin wins on moral plausibility.*

  4.  **Synthesize the "Taurek" Connection:**
