  5.  **Overall Verdict:**
      *   **Dave:** Philosophically consistent within a specific rights-based framework (non-aggregation), but fails at the extremes (1 million) and contradicts himself on group status (Step 2 vs Step 4). His position is unsustainable in real-world triage.
      *   **Cousin:** Aligns with standard ethics, triage protocols, and intuition. Handles the "Sorites" challenge better.
      *   **Winner:** Cousin. Dave's argument collapses under the weight of large numbers and internal inconsistency regarding "groups."

  6.  **Refining the "Friend" Tangent:**
