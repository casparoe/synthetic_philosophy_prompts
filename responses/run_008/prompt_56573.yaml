  8.  **Final Polish:** Ensure the distinction between "EMT protocol" and "Philosophical hypothetical" is clear. Dave is an EMT, but arguing philosophy. In real life, Dave is legally/ethically bound to save the 5. In the hypothetical, he's arguing moral theory. I must judge the *argument*, not his job performance, though the job performance informs the moral intuition.

