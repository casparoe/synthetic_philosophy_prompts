          *   *Correction/Clarification:* Dave's logic in the prompt seems to be: "If I head North, the 5 die. If I head South, the 1 dies. In *both* scenarios, some people die. Is there a specific person who is harmed by choosing North *compared to* choosing South?" Actually, Dave's phrasing "the five die, but they die anyway in that scenario too" is confusing. He likely means: "In the scenario where I save the 1, the 5 die. In the scenario where I save the 5, the 1 dies. There is no single person who dies in *both* scenarios."
          *   *Taurek's actual point:* You cannot sum losses. Loss of life is not aggregable. Each person suffers the loss of *their* life. The loss of 5 lives is not 5x the loss of 1 life; it's just 5 separate losses of 1 life each.
