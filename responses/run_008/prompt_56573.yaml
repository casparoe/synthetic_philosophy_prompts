      *   **Step 3 (Cousin):** Two prongs. (A) Badness doesn't need a specific victim (impersonal badness). (B) The "Sorites" challenge (1 vs 50). If Dave saves 1 vs 50, he admits numbers count. Where is the line?
      *   **Step 4 (Dave):** Randomization (Coin Flip). Claim: Equal chance per *group*. Cousin: Equal chance per *individual* (1/2 vs 1/10). Dave: Group fairness. Cousin: Contradiction (using groups now after rejecting them in Step 2).
