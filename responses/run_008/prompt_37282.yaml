answer: |-
  Following our series of adversarial collaboration sessions regarding the aphorism that history is written by the victors, this memorandum serves as a draft of the joint statement we intend to sign, summarizing our converged positions, remaining disagreements, and the empirical tests we have designed to resolve them. We begin by recording our shared empirical premises, specifically that institutional power invariably influences the retention, organization, and accessibility of archival materials, creating asymmetries that historians must navigate methodologically. We both accept that the slogan cannot be literally true in all cases, acknowledging specific historical instances where the defeated successfully captured the long-term narrative, such as the Lost Cause mythology in the American South which dominated public memory despite military defeat, and the monastic chronicles of Norman England which were largely produced by the conquered Anglo-Saxon clergy rather than the Norman conquerors. We further agree that reconstructing the history of marginalized or defeated groups often requires reading against the grain of existing archives, though we differ on whether this is an exceptional procedure or the standard condition of all historical work.

  We have identified that a significant portion of our dispute is merely verbal, stemming from divergent definitions of the term victor and the conflation of source survival with narrative control. If a victor is defined strictly as the military conqueror, the slogan is empirically falsifiable given the counter-examples we both accept, whereas if a victor is defined functionally as whoever ultimately controls the cultural narrative, the slogan becomes tautologically true but loses its explanatory power regarding the mechanisms of power. Additionally, we distinguish between the material survival of sources, which is often skewed toward state actors and institutions, and the interpretive framework applied to those sources, which may shift over time independent of the original power dynamics. Clarifying these terms allows us to isolate our substantive disagreement, which concerns the degree of systematicity in archival distortion. My position maintains that the asymmetries in source survival and canonization are structural and systemic, producing a default historical narrative that favors power unless actively corrected, while your position maintains that these asymmetries are contingent and frequently reversed by later cultural, religious, or political developments that allow the defeated to dictate memory.

  To move beyond this theoretical stalemate, we have agreed upon two cruxes where settling the evidence would necessitate a shift in at least one of our positions, each anchored by a concrete case corpus with pre-recorded predictions. The first crux concerns the longevity of administrative categories versus cultural identity in conquest scenarios, focusing on the source corpus of English legal and chronicle data from 1066 to 1300. My prediction is that despite the English language and cultural identity re-emerging, the fundamental feudal legal categories and landholding structures imposed by the Norman victors will remain the invisible architecture of the narrative, confirming that the victors write the structural history even if the defeated write the chronicles. Your prediction is that the Anglo-Saxon monastic writers will successfully frame the Norman presence as an aberration within a continuous English history, demonstrating that narrative control can decouple from military victory within a few generations. The second crux concerns the persistence of colonial classification systems in post-colonial historiography, focusing on the archival metadata and finding aids of the British Raj records held in New Delhi and London. My prediction is that even nationalist historiographies produced after independence will remain constrained by the colonial categories of governance, ethnicity, and crime embedded in the archival metadata, proving that the victor's epistemological framework outlasts their political rule. Your prediction is that post-colonial historians will successfully generate new categorization schemas that render the colonial metadata obsolete for serious historical inquiry, proving that narrative production can overcome archival asymmetry.

  We agree that if the evidence from the Norman legal corpus shows the persistence of conqueror categories despite conquered narrators, my claim regarding structural distortion is strengthened, whereas if the Anglo-Saxon framing dominates the periodization of English history, your claim regarding narrative contingency is strengthened. Similarly, regarding the colonial archives, if contemporary historians remain bound by colonial metadata categories despite ideological opposition, it supports the view that archival structure dictates historical possibility, but if new schemas successfully replace the old ones in standard practice, it supports the view that historian agency can overcome archival bias. We commit to reviewing the specified corpora independently over the next six months and reconvening to compare our findings against these predictions, with the understanding that falsification of either prediction will require a revision of our respective positions on the systematicity of historical distortion. This document serves as our binding agreement on the terms of this inquiry and the baseline from which our final joint statement will be issued.
