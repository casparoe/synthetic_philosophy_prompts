answer: |-
  ### 1. Diagnosis: A Substantive Disagreement Over Causal Ontology

  The disagreement is **substantive**, not merely verbal, nor is it simply a case of two different questions being asked under one name. If it were merely verbal, the demonstration of formal equivalence (via the Price equation or contextual analysis) would have dissolved the conflict into a matter of stylistic preference. It did not. If it were merely two different questions (e.g., "What replicates?" vs. "Where does variance lie?"), the participants would not argue so vehemently that the opposing framework is *misleading* or *biologically incorrect*. They do argue this.

  The core of the dispute is **causal ontology**. Both camps claim to describe the *same* causal history of a population, but they disagree on which mathematical decomposition of that history maps onto the actual causal machinery of the world.

  *   **The Gene-Centric Claim:** When gene-centrists insist that inclusive fitness is "the correct one," they are making an ontological claim about sufficiency and parsimony. They argue that the "group" term in a Price partition is a statistical shadow cast by individual interactions. For them, a causal explanation is only complete when it traces the fate of the replicator. To attribute causality to the group is, in their view, a category error akin to attributing the motion of a car to the "speedometer" rather than the engine. The group term predicts change, but it does not *cause* it in the fundamental sense; only the differential replication of genes does.
  *   **The Multi-Level Selection (MLS) Claim:** When MLS proponents insist that partitioning selection identifies "real causal processes," they are making an ontological claim about emergent structure. They argue that the statistical variance between groups corresponds to a distinct causal process (e.g., group extinction, differential fission) that is not reducible to the sum of individual interactions without losing explanatory power. For them, collapsing the group term into individual inclusive fitness obscures the actual mechanism (e.g., policing, bottlenecking) that allowed the trait to spread.

  The heat in the debate arises because formal equivalence guarantees **predictive identity** (both sides calculate the same $\Delta p$), but it guarantees nothing about **causal attribution**. The gene-centric side views the MLS decomposition as re-describing individual causes as group causes (double-counting). The MLS side views the gene-centric decomposition as hiding structural causes behind a veil of relatedness coefficients. This is not a verbal dispute; it is a clash over what constitutes a "real" cause in biology.

  ### 2. Assessment of Hypotheses

  Your hypothesis and the two rivals each capture a facet of the impasse, but they differ in depth.

  **Your Hypothesis (Two Questions Under One Name):**
  *   *Verdict:* **Insightful but insufficient.**
  *   *Analysis:* You suggest the gene-side tracks "heritable material" while the MLS-side tracks "where selection makes a difference." This is a charitable and accurate description of their *motivations*. However, it fails to explain the *hostility*. If they were merely answering different questions, they would partition the literature and leave each other alone (as population genetics and phylogenetics largely do). The conflict persists because both sides claim their question is the *primary* one for evolutionary theory. They are not happily answering different questions; they are fighting over which question defines the field. Your diagnosis explains why they *could* coexist, but not why they *don't*.

  **Rival 1 (Methodological/Explanatory Disagreement):**
  *   *Verdict:* **The strongest fit.**
  *   *Analysis:* This rival diagnosis identifies the engine of the conflict. The equivalence results say nothing about *explanatory virtue*. The gene-centric camp values **generality and reduction**: a single causal currency (fitness/replication) that applies from bacteria to humans. They view mechanistic, individual-level accounts as the only rigorous standard for explanation. The MLS camp values **perspicuity and structure**: an account that reveals the specific architectural constraints (group boundaries, migration rates) that facilitated the evolution.
  *   *Why it fits the facts:* This explains why the debate shifted to "rigour, generality, and tractability." These are not empirical claims; they are criteria for good explanation. The gene-side argues MLS is "less rigorous" because it relies on arbitrary group definitions. The MLS-side argues gene-centrism is "less tractable" because calculating inclusive fitness in complex structures is impossible. The formal equivalence cannot resolve this because mathematics cannot dictate which explanatory virtue (reduction vs. structural clarity) is scientifically superior.

  **Rival 2 (Sociological/Entrenched Traditions):**
  *   *Verdict:* **True but secondary.**
  *   *Analysis:* There is no doubt that reputational stakes and textbook inertia sustain the debate. Older figures have built careers on defending "the gene" or "group selection." However, sociology alone cannot explain why young biologists, entering the field without knowledge of the 1970s quarrels, immediately adopt one philosophical stance or the other. The sociological factors amplify the disagreement, but the **conceptual incompatibility** (Rival 1) creates it. If the disagreement were purely sociological, we would see a gradual fade-out as old professors retire. Instead, we see the arguments being regenerated in new contexts (e.g., microbiome evolution, cultural evolution), suggesting a enduring conceptual fault line.

  **Synthesis:**
  The best diagnosis is a refinement of **Rival 1**, incorporating your insight. The disagreement is substantive because it is a conflict over **Explanatory Realism**. The gene-centrists are realists about replicators; the MLS proponents are realists about selection processes. The formal equivalence shows that the *extensions* of their theories are identical, but their *intensions* (what they mean by "cause") are not. The debate persists because the field lacks a consensus on whether evolutionary explanation requires reducing everything to replicator dynamics or whether higher-level statistical regularities can be causally autonomous.

  ### 3. Prospects for Progress and Mechanisms of Impasse

  Given that the disagreement is about explanatory standards rather than empirical predictions or formal consistency, standard scientific progress (new data, new theorems) will not resolve it.

  **What Would Count as Progress?**
  Progress would not look like one side "winning." It would look like a **meta-theoretical settlement** regarding causal attribution. Specifically, the field would need to adopt a criterion that distinguishes between a "real" causal process and a "statistical artifact" in a way that both sides accept.
  *   *Example:* If philosophers and biologists could agree on a "Manipulability Criterion" for selection (i.e., a level of selection is real only if intervening at that level changes the outcome in a way intervening at lower levels cannot), the debate might dissolve.
  *   *Alternative:* A shift toward **pragmatic pluralism** in pedagogy. Progress would be textbooks that teach the Price equation not as a weapon to prove one side right, but as a translation manual, explicitly stating: "Use the gene-view for molecular evolution; use the MLS-view for eusociality," without implying one is ontologically deeper.

  **Will It Happen?**
  **No, not in the near term.** The mechanisms of the impasse are self-reinforcing:

  1.  **The "Default" Trap:** The fight is no longer about whether group selection *exists* (most agree it can), but whether it is the *default* explanation for sociality. This is a status claim. Admitting the other framework is equally "real" feels like conceding theoretical territory. As long as "correctness" is tied to "primacy," compromise is viewed as surrender.
  2.  **Incommensurable Standards of Rigour:** The gene-centric side defines rigour as **mathematical generality** (one equation for all life). The MLS side defines rigour as **biological specificity** (modelling the actual interaction structure). Because these standards are orthogonal, each side can legitimately claim the other is "sloppy." The gene-side sees MLS models as ad-hoc; the MLS-side sees gene-models as biologically unrealistic abstractions.
  3.  **The Causal Closure Assumption:** The gene-centric position relies on the intuition that causality must be closed at the level of the replicator to avoid infinite regress. The MLS position relies on the intuition that causality is distributed across hierarchical levels. These are metaphysical commitments that are immune to empirical falsification.

  **Conclusion:**
  You should expect the disagreement to persist because the parties' standards for what would settle it are themselves part of what is disputed. The formal equivalence results were necessary but not sufficient; they solved the *mathematical* problem but highlighted the *philosophical* one. Until evolutionary biology treats the choice of framework as a pragmatic decision based on the specific biological question (heuristic utility) rather than a claim about the fundamental furniture of the universe (ontological truth), the heat will remain. The honest answer is that the debate has transitioned from biology to natural philosophy, and it will only end when the field agrees on a philosophy of causal explanation that satisfies both the reductionist and the emergentist intuitions. Currently, there is no sign of such an agreement.
