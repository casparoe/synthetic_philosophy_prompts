  I'm a software engineer with no philosophy training, and I keep running into vague predicates from the engineering side: color-naming code for an image tool, spam classifiers whose scores tail off instead of cutting cleanly, hysteresis logic in a thermostat to keep it from flapping between on and off. Before I wade into the literature on vagueness and the sorites paradox, I want the spec first. Write the desiderata: what any adequate theory of vagueness has to deliver — what it must say about the sorites argument and about why each individual step in that argument seems so compelling, how it accounts for borderline cases and for higher-order vagueness (borderline borderline cases), whether it keeps classical logic or explains what replaces it and why the replacement is worth the cost, what it does with penumbral connections like the fact that a patch bordering red and orange can't be outright green, and how it explains the fact that speakers successfully communicate with vague terms all the time in law, medicine, and engineering tolerances. Give the case behind each requirement, mark which are non-negotiable and which are prejudices of one camp, and flag any pair you suspect cannot be jointly satisfied — that part matters most to me, because my hysteresis intuition suggests that maybe no static theory can both refuse to draw an arbitrary line and still make every heap statement determinately true or false. If some subset of the desiderata is jointly unsatisfiable, say so outright. Then, briefly, run epistemicism, supervaluationism, and degree-based theories against the list — a short scorecard is fine, since the criteria are where I want the real thinking. Please answer in American English.
