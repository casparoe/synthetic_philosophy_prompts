answer: |-
  # Specification: Theory of Vagueness (v1.0)

  **To:** Philosophy Vendor
  **From:** Engineering Stakeholder
  **Subject:** Desiderata for Vagueness Handling Module

  You are proposing a semantic architecture to handle predicates like "heap," "red," and "bald." As an engineer, I treat these as legacy systems with undefined behavior at the boundaries. Your theory is the patch. Below are the requirements. I have marked them **NN** (Non-Negotiable / Core Intuition) or **CP** (Camp Prejudice / Debatable Implementation Detail).

  ## 1. Functional Requirements

  ### 1.1 Sorites Blocking (NN)
  **Requirement:** The theory must invalidate the Sorites argument without denying obvious premises.
  **Case:** If I add one grain to a non-heap, it doesn't become a heap. If I keep doing this, I eventually have a heap. The argument concludes that one grain is a heap. This is a crash. The theory must throw an exception on the inductive step or the logic connecting them.
  **Constraint:** You cannot simply assert "1,000,000 grains is not a heap."

  ### 1.2 Phenomenology of the Step (NN)
  **Requirement:** The theory must explain *why* the inductive step ("If $n$ is a heap, $n+1$ is a heap") feels compelling, even if the theory claims it is false.
  **Case:** In code, this is like a floating-point comparison that fails due to precision errors. It looks like it should work. If your theory says the step is false, you must explain why it looks true to the user. If you can't explain the illusion, the theory is unusable.

  ### 1.3 Borderline Case Handling (NN)
  **Requirement:** The theory must assign a distinct status to borderline cases.
  **Case:** A patch of color that is neither clearly red nor clearly orange. In a binary `bool`, this is a bug. In your system, this must be a valid state. It cannot be forced into `True` or `False` arbitrarily.

  ### 1.4 Higher-Order Vagueness (NN)
  **Requirement:** The boundary between "clearly $F$" and "borderline $F$" must itself be vague.
  **Case:** If you draw a sharp line around the borderline cases, you've just pushed the vagueness back one level. I need to know what happens at the edge of the borderline region. If your theory introduces a sharp cutoff for "definite truth," it fails this spec.

  ### 1.5 Penumbral Connections (NN)
  **Requirement:** The theory must preserve logical relations between vague predicates.
  **Case:** If a patch is "Red," it cannot be "Green." If a patch is borderline Red, it must be borderline Green (or not Green). You cannot have a model where a patch is determinately "Red AND Green" just because both are vague. Constraints must propagate through the uncertainty.

  ### 1.6 Communicative Utility (NN)
  **Requirement:** The theory must explain why vague terms are useful, not just tolerable.
  **Case:** In law and medicine, we use "reasonable," "high fever," and "adult." If vagueness were just noise, we would eliminate it. Your theory must show why this noise is a feature (e.g., flexibility, information compression) that allows successful coordination despite lack of precision.

  ### 1.7 Logic Compatibility (CP)
  **Requirement:** Preferably, the theory should retain Classical Logic (Bivalence, Law of Excluded Middle).
  **Case:** Classical logic is the hardware of our reasoning. Changing it is expensive (like switching from SQL to NoSQL). However, if retaining Classical Logic forces you to violate Requirement 1.3 (Borderlines) or 1.4 (Higher-Order), you must justify the cost of the replacement logic.

  ---

  ## 2. Known Incompatibilities (The "Impossibility Theorem")

  **Warning:** Based on current literature, the following three constraints form an inconsistent triad. You cannot satisfy all three simultaneously. You must drop one.

  1.  **Classical Semantics:** Every sentence is determinately True or False (Bivalence).
  2.  **No Sharp Boundaries:** There is no specific grain $n$ where "heap" switches from False to True.
  3.  **Sorites Validity:** The logic used to derive the paradox is valid.

  **The Conflict:**
  If you keep **Classical Semantics** (1) and **Sorites Validity** (3), you must accept **Sharp Boundaries** (denial of 2). This means there *is* a specific grain where the status flips, even if we can't know it.
  If you keep **No Sharp Boundaries** (2) and **Classical Semantics** (1), you must reject **Sorites Validity** (3). You have to change the logic (e.g., modus ponens fails).
  If you keep **No Sharp Boundaries** (2) and **Sorites Validity** (3), you must reject **Classical Semantics** (1). You need truth-value gaps or degrees.

  **Engineering Note on Hysteresis:**
  Your intuition about hysteresis is correct. Hysteresis solves this by adding **state** and **time** (history dependence). A thermostat doesn't ask "Is it 70 degrees?" it asks "Is it 70 degrees *and was it previously off*?"
  Most philosophical theories are **static**. They try to solve a dynamic/control problem with a static logic gate. This is likely why Requirement 1.4 (Higher-Order Vagueness) is so hard to satisfy. A static boundary will always look sharp from the outside, leading to infinite regress.

  ---

  ## 3. Vendor Scorecard

  Here is how the three major legacy providers stack up against the spec.

  ### Vendor A: Epistemicism (e.g., Timothy Williamson)
  *   **Core Claim:** Vagueness is ignorance. Sharp boundaries exist; we just don't know where they are.
  *   **1.1 Sorites Blocking:** **Pass.** The inductive step is false at the sharp boundary.
  *   **1.2 Phenomenology:** **Fail.** Claims we are ignorant of semantic facts. Hard to explain *why* the ignorance is necessary.
  *   **1.3 Borderlines:** **Fail.** Borderlines are just cases where we don't know the truth value. They are ontologically True or False.
  *   **1.4 Higher-Order:** **Pass.** Claims we are ignorant of the boundary of our ignorance.
  *   **1.5 Penumbral:** **Pass.** Classical logic holds, so relations are preserved.
  *   **1.6 Utility:** **Weak.** Explains utility as "good enough" estimation, but doesn't embrace vagueness as a feature.
  *   **1.7 Logic:** **Pass.** Keeps Classical Logic intact.
  *   **Verdict:** Great for keeping the logic stack unchanged, but violates the "No Sharp Boundary" intuition (Req 2 in Incompatibilities). It feels like a hack to save the logic layer.

  ### Vendor B: Supervaluationism (e.g., Kit Fine)
  *   **Core Claim:** A statement is "Super-True" if it is true on all acceptable ways of making the predicate precise (precisifications).
  *   **1.1 Sorites Blocking:** **Pass.** The inductive step is not Super-True (it fails on some precisifications).
  *   **1.2 Phenomenology:** **Pass.** The step feels true because it is true on *most* precisifications.
  *   **1.3 Borderlines:** **Pass.** Borderlines are neither Super-True nor Super-False (Truth-value gaps).
  *   **1.4 Higher-Order:** **Fail.** Struggles to define "acceptable precisification" without introducing a sharp boundary for what counts as acceptable.
  *   **1.5 Penumbral:** **Pass.** Excellent at this. "Red and Green" is false on all precisifications.
  *   **1.6 Utility:** **Pass.** Allows coordination without agreeing on a specific precisification.
  *   **1.7 Logic:** **Pass/Warning.** Keeps Classical Logic for Super-Truth, but $P \lor \neg P$ is Super-True even if $P$ is borderline. This feels like a leaky abstraction.
  *   **Verdict:** Strong on constraints and logic, but the "Higher-Order" module is buggy.

  ### Vendor C: Degree Theory / Fuzzy Logic (e.g., Lotfi Zadeh)
  *   **Core Claim:** Truth is a value in the interval $[0, 1]$.
  *   **1.1 Sorites Blocking:** **Pass.** The inductive step is not fully true (e.g., truth value 0.99), so iterating it degrades the truth value until it fails.
  *   **1.2 Phenomenology:** **Pass.** Matches the "tail off" intuition in classifiers perfectly.
  *   **1.3 Borderlines:** **Pass.** Borderlines are values near 0.5.
  *   **1.4 Higher-Order:** **Fail.** Where is the cutoff for "borderline"? If it's $[0.4, 0.6]$, you've drawn a sharp line around the fuzzy set.
  *   **1.5 Penumbral:** **Warning.** Standard fuzzy logic violates $P \land \neg P = \text{False}$. A patch can be 0.5 Red and 0.5 Not-Red, summing to contradiction in some systems. Requires complex t-norms to fix.
  *   **1.6 Utility:** **Pass.** Models the "tolerance" engineering mindset well.
  *   **1.7 Logic:** **Fail.** Requires non-classical logic. Law of Excluded Middle fails.
  *   **Verdict:** Best fit for engineering intuition (classifiers, scores), but requires replacing the logic kernel and struggles with the boundary of the fuzzy sets.

  ## 4. Recommendation

  If you must keep Classical Logic (Req 1.7 NN), **Supervaluationism** is the closest compliant build, provided you can patch the Higher-Order Vagueness leak.

  If you prioritize the "No Sharp Boundary" intuition (Req 2 in Incompatibilities NN) and your engineering background makes you accept non-binary states, **Degree Theory** is the native implementation. However, be aware that Higher-Order Vagueness remains a known issue across all static vendors.

  **Final Note:** Your hysteresis intuition suggests the spec itself might be flawed. Vagueness may not be a semantic property (static) but a pragmatic one (dynamic/contextual). If no static theory satisfies the full spec, the fault may lie in the requirement for a static truth condition. Consider looking into **Contextualist** theories, which treat vagueness as a state machine where the context shifts during the Sorites chain.
