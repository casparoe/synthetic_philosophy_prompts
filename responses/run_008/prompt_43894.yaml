      *   *Sentence 5:* "...and philosophers now agree that 'intentionally' is an essentially moral word: to say that someone did something on purpose is really just a disguised way of blaming them."
          *   *Status:* Inaccurate/Exaggerated.
          *   *Nuance:* Philosophers definitely do *not* agree. This is one of the most debated topics in experimental philosophy (x-phi). Some argue it's pragmatic, not semantic. Some argue it's about the "deep self." Saying it's *just* disguised blaming is a specific, controversial view (expressivism), not a consensus.
      *   *Sentence 6:* "The same article noted a companion finding: when the policy instead happens to help the environment, and the chairman again says he only cares about profit, most people say that he did not intentionally help the environment..."
          *   *Status:* Accurate data report (The "Help Case").
          *   *Nuance:* This is the asymmetry.
      *   *Sentence 7:* "...because, the article explained, we tend to give people credit only for what they actually aim at."
          *   *Status:* Simplification/One of many explanations.
          *   *Nuance:* This addresses the User's first nagging feeling. The article offers a *different* explanation here (credit requires aim) than in the harm case (blame requires foreseeability + badness). This suggests asymmetry in mechanisms. A working philosopher would note this tension.
      *   *Sentence 8:* "So when a driver who has caused a crash says 'I didn't do it on purpose', they are not really describing their state of mind at all; they are simply refusing to accept blame, and we should hear such denials accordingly."
          *   *Status:* Inaccurate/Overgeneralization.
