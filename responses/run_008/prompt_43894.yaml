          *   *Analysis:* No, they aren't obviously the same. This is the "Asymmetry." Some theories explain both (e.g., the Good/Bad asymmetry in normative expectations), but the article's explanation treats them as distinct principles (blame is easy, credit is hard). A philosopher would flag this as a theoretical gap in the pop summary.
      *   *Point 2 (The Driver/Real World Leap):* Does survey data about "intentionally" entail that denials are just blame-shirking?
