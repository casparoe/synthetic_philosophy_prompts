          *   *Status:* Accurate data report.
          *   *Nuance:* "Nearly everyone" is roughly correct (statistically significant majority). The distinction between aim vs. side effect is the traditional philosophical view (the Simple View) which Knobe challenged.
      *   *Sentence 4:* "Knobe took this to prove that whether a side effect counts as intentional depends on whether we disapprove of it..."
          *   *Status:* Simplification/Contested Interpretation.
