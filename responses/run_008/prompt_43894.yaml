answer: |-
  Your instincts are excellent. The "nagging feelings" you describe are not just hunches; they correspond to genuine, unresolved debates within experimental philosophy and the philosophy of action. The popular article you read provided a compelling narrative, but in doing so, it smoothed over significant theoretical cracks and made a leap from data to metaphysics that most experts would reject.

  Below is a sentence-by-sentence audit of the passage from the perspective of a working experimental philosopher, followed by an analysis of your two specific concerns.

  ### Part 1: Sentence-by-Sentence Audit

  **1. "'Joshua Knobe's famous experiments showed that our moral judgements determine whether we say someone acted intentionally.'"**
  *   **Verdict:** **Simplification / Contested.**
  *   **Audit:** This captures the headline finding (the "Knobe Effect" or "Side-Effect Effect"), but the word "determine" is too strong. Most philosophers view moral judgment as a *biasing influence* on the application of the concept, not the sole determinant. Furthermore, the direction of causality is debated: does morality change our concept of intentionality, or does our concept of intentionality remain stable while our *willingness to apply it* changes based on blame?

  **2. "In the original study, the chairman of a company is told that a new policy will increase profits but also harm the environment; he replies that he doesn't care about the environment and only wants the profit, and approves it anyway."**
  *   **Verdict:** **Accurate.**
  *   **Audit:** This is a faithful summary of the standard "Harm Case" vignette used in the 2003 paper.

  **3. "Nearly everyone asked said that he had intentionally harmed the environment, even though the harm was a foreseen side effect rather than something he was aiming at."**
  *   **Verdict:** **Accurate.**
  *   **Audit:** The statistical data is correct (a vast majority attribute intentionality in the harm case). The contrast drawn here is between the "Simple View" of intentionality (you must aim at it) and the data (foreseeability + badness seems sufficient for laypeople).

  **4. "Knobe took this to prove that whether a side effect counts as intentional depends on whether we disapprove of it..."**
  *   **Verdict:** **Simplification.**
  *   **Audit:** Knobe did argue that moral considerations penetrate the *concept* itself. However, saying he "took this to prove" implies the matter is settled. Knobe himself has refined his views over time (moving toward a "Deep Self" account), and many colleagues argue the data proves something about *pragmatics* (how we speak) rather than *semantics* (what the words mean).

  **5. "...and philosophers now agree that 'intentionally' is an essentially moral word: to say that someone did something on purpose is really just a disguised way of blaming them."**
  *   **Verdict:** **Inaccurate.**
  *   **Audit:** This is the most problematic sentence in the passage. Philosophers absolutely **do not agree** on this. This is one of the most fiercely contested topics in the field.
      *   **The Inaccuracy:** Claiming "intentionally" is *essentially* a moral word (conceptual moralism) is a specific, controversial hypothesis.
      *   **The Consensus:** The consensus is merely that there is an *asymmetry* in how people apply the word. Many argue the underlying concept is still psychological (about mental states), but its application is noisy or influenced by moral heuristics. To say it is "just a disguised way of blaming them" is an expressivist view that is a minority position, not a settled fact.

  **6. "The same article noted a companion finding: when the policy instead happens to help the environment, and the chairman again says he only cares about profit, most people say that he did not intentionally help the environment..."**
  *   **Verdict:** **Accurate.**
  *   **Audit:** This correctly describes the "Help Case." The asymmetry (Harm = Intentional; Help = Unintentional) is the core phenomenon.

  **7. "...because, the article explained, we tend to give people credit only for what they actually aim at."**
  *   **Verdict:** **Simplification / Theoretically Tension-Ridden.**
  *   **Audit:** This is where your first nagging feeling is justified. The article offers a *different* explanation here than in sentence 4. In the harm case, they claimed moral disapproval drives the judgment. In the help case, they claim a structural rule about "aiming" drives the judgment. If moral judgment drove the concept (as sentence 5 claimed), we should expect the reverse: that we *would* say he intentionally helped because it was good. The fact that we don't suggests the mechanism is more complex than "morality determines intentionality."

  **8. "So when a driver who has caused a crash says 'I didn't do it on purpose', they are not really describing their state of mind at all; they are simply refusing to accept blame, and we should hear such denials accordingly."**
  *   **Verdict:** **Inaccurate / Unlicensed Leap.**
  *   **Audit:** This conflates *survey data about word attribution* with *the phenomenology of speech acts*. Even if moral blame influences whether *observers* use the word "intentionally," it does not follow that the *speaker* is not referring to their mental state. It also ignores legal and psychological distinctions between negligence, recklessness, and intention.

  ---

  ### Part 2: Addressing Your Nagging Feelings

  #### Nag 1: The Inconsistent Mechanism (Harm vs. Help)
  You correctly identified that the article runs two different mechanisms together.
  *   **The Harm Case:** The article claims we call it "intentional" because it is *bad* (Moral Judgment $\rightarrow$ Intentionality).
  *   **The Help Case:** The article claims we call it "unintentional" because he didn't *aim* at it (Aim $\rightarrow$ Intentionality).

  **Why this is a problem:** If the concept of "intentionally" were *essentially moral* (as sentence 5 claimed), the Help Case should mirror the Harm Case. If badness makes a side-effect intentional, goodness should arguably do the same (or at least have some effect). The fact that people revert to the traditional "aim" requirement for the Help Case suggests that "intentionally" isn't simply a moral proxy.

  **The Philosopher's View:** Experimental philosophers propose several theories to unify this asymmetry without contradicting themselves:
  1.  **Normative Expectations:** We judge intentionality based on whether the agent violated a norm. Harming the environment violates a norm (making it salient/intentional); helping does not violate a norm (making it background/unintentional).
  2.  **The Deep Self:** We attribute intentionality when the action aligns with the agent's deeper values. The chairman's indifference reveals a "deep self" that is okay with harm, but not one that values help.
  3.  **Pragmatic Implicature:** The word "intentionally" hasn't changed meaning. In the harm case, saying "he didn't do it intentionally" would be misleading because it implies he tried to avoid it. We say "intentionally" to block that false implication.

  The popular article ignored these unifying theories and instead offered a "heads I win, tails you lose" explanation that feels inconsistent because it *is* theoretically loose.

  #### Nag 2: The Leap to the Driver (Survey vs. Reality)
  Your second suspicion is also correct. The article commits a category error.
  *   **The Data:** The Knobe effect shows that when third-party observers fill out a survey about a vignette, their moral feelings influence their checkbox selection.
  *   **The Claim:** The article concludes that when a real person speaks in a high-stakes situation, they are *not describing their mind*.

  **Why this is a problem:**
  1.  **Competence vs. Performance:** Even if moral bias affects how we *apply* a word (performance), it doesn't mean the word's *definition* (competence) has changed. A driver saying "I didn't do it on purpose" is usually making a claim about their motor control and planning (e.g., "my foot slipped" vs. "I pressed the pedal").
  2.  **Legal Reality:** In law, *mens rea* (guilty mind) distinguishes murder from manslaughter. If "on purpose" were just a disguised way of blaming, the legal system would collapse. Courts spend immense effort distinguishing between foreseeing a risk (negligence/recklessness) and intending a result (purpose). The Knobe effect suggests laypeople might blur this line in surveys, but it does not prove the distinction doesn't exist in reality.
  3.  **First-Person Authority:** The article treats the speaker as if they are an observer of themselves. When I say "I didn't mean to," I am reporting on my planning processes, not calculating how much blame I deserve. The article assumes the driver is engaging in the same psychological process as the survey respondent judging the chairman, which is a huge assumption.

  ---

  ### Part 3: Does the Final Claim Follow?

  **Does the claim about the driver follow from the audited summary?**
  **No.** Even if we accept the strongest interpretation of the Knobe effect (that moral judgment influences intentionality ascriptions), it does not follow that denials of intention are *merely* refusals of blame.

  It is possible that:
  1.  The driver *did* not intend the crash (a factual claim about their brain state).
  2.  The driver *also* wants to avoid blame (a motivational claim).
  3.  The listener's judgment of that denial *might be influenced* by how bad the crash was (the Knobe effect).

  The article collapses these three distinct things into one: "The denial is just blame-shirking." This ignores the possibility that the driver is telling the truth about their mental state, even if the listener is biased in believing them.

  ### Part 4: A More Defensible Closing

  If we want to retain the insight of the Knobe effect without making the inaccurate leap, a more defensible version of that closing thought would look like this:

  > **Revised Conclusion:**
  > "So, when a driver who has caused a crash says 'I didn't do it on purpose', they are likely describing their actual state of mind—distinguishing between an accident and a plan. However, Knobe's work suggests that *we*, as listeners, may not hear them neutrally. If the outcome is severe, we are psychologically predisposed to interpret their actions as more intentional than they might have been. We should therefore be aware that our own urge to reject their denial may be driven partly by the severity of the harm, rather than solely by the evidence of their intent."

  **Why this is better:**
  *   It respects the driver's first-person authority (they know their mind).
  *   It respects the data (listeners are biased by outcome/morality).
  *   It avoids the metaphysical claim that "intentionally" *means* "blameworthy."
  *   It offers practical advice (be aware of your own bias) rather than accusatory advice (assume they are lying/shirking).

  ### Summary
  You have successfully identified the two weakest links in the popular article's chain of reasoning.
  1.  **Theoretical Consistency:** The article fails to explain why morality drives intentionality in the harm case but not the help case.
  2.  **Ecological Validity:** The article unjustifiably extrapolates from survey bias to the nature of sincere speech.

  A working experimental philosopher would agree with your audit: the Knobe effect is real and fascinating, but it shows that moral judgment *influences* our cognitive processing of intention, not that intention *is* moral judgment. The popular article traded that nuance for a satisfying story.
