          *   2 Survivor-Community Representatives (Fear dilution of the term, feel "genocide" belongs to the dead/murdered, worried about political fallout).
          *   1 Chair (Historian of the 1948 Convention, knows Lemkin and drafting record, rewards historical engagement).
      *   **User's Strategy:** Anchor in Lemkin's conception (destruction of group as social/cultural entity, physical destruction is just one technique), concede narrow list of acts/intent standard as applied by courts, but argue for a broader interpretation of "destruction."
      *   **Deliverable:** Q&A Sheet.
          *   Objections ranked by damage potential.
          *   Phrased in specific faction vocabulary.
          *   Two-minute reply for each.
          *   Honest note on weaknesses/concessions.
          *   What to concede up front.
          *   The "One Question" hoped nobody asks + least bad answer.

  2.  **Deconstruct the Legal & Ethical Landscape:**
      *   *Genocide Convention (1948):* Article II defines genocide. Key elements: Specific Intent (*dolus specialis*) to destroy, in whole or in part, a national, ethnical, racial, or religious group, *as such*. Prohibited acts: Killing, causing serious bodily/mental harm, inflicting conditions of life calculated to bring about physical destruction, preventing births, forcibly transferring children.
      *   *The Conflict:* The user wants to argue "cultural genocide" or "slow genocide" via displacement and assimilation. The Courts (ICTY, ICTR, ICC, ICJ) have generally been very strict. *Krstić* (Srebrenica) emphasized physical/biological destruction. *Cultural genocide* was explicitly debated and largely excluded from the final text of the Convention (though forcibly transferring children remains).
      *   *The Prosecutors:* Will cite *Krstić*, *Jelisić*, ICC Elements of Crimes. They care about *convictability*. If the label doesn't stick in court, it's dangerous advocacy.
      *   *The Survivors:* Care about memory and hierarchy of suffering. "Genocide" = Death. Displacement = Tragedy, but not *that* tragedy.
      *   *The Historian:* Knows Lemkin wanted to protect the "national pattern," but also knows the UN General Assembly rejected the cultural genocide clauses. They want nuance, not revisionism.

  3.  **Drafting the Objections (Ranking by Damage):**
      *   *Highest Damage:* The Prosecutors. If the legal argument doesn't hold, the NGO loses credibility and the case is dead on arrival legally. Specifically, the "Intent" hurdle regarding non-lethal acts.
      *   *Medium-High Damage:* The Historian. If the user misrepresents the drafting history, the Chair will shut them down intellectually.
      *   *Medium Damage:* The Survivors. Emotional/moral weight. Can derail the room's mood, but less likely to kill the legal strategy than the prosecutors.
      *   *The "One Question":* Usually the one that exposes the personal bias or the strategic risk of over-labeling.

  4.  **Developing the Responses:**
      *   *Tone:* Professional, legally grounded, empathetic but firm.
      *   *Strategy:* Acknowledge the strict case law but pivot to the *purpose* of the documentation (advocacy/truth-telling vs. immediate indictment) and the specific act of "Forcibly Transferring Children" (Article II(e)), which *is* in the Convention and fits the facts (boarding schools).
      *   *Concessions:* Must admit "Cultural Genocide" isn't in the text. Must admit conviction is hard. Must admit personal stake.

  5.  **Refining the Content (Iterative Process):**

      *   *Objection 1 (Prosecutors):* "Intent." How do you prove intent to *destroy* without killing?
          *   *Reply:* Focus on Article II(e) (Children). That *is* the destruction mechanism. It's biological/cultural hybrid.
          *   *Weakness:* Courts often require physical destruction to infer intent for II(e).
      *   *Objection 2 (Survivors):* "Dilution." If everyone is genocide, no one is.
          *   *Reply:* It's not dilution; it's precision. The Convention includes non-lethal acts. Honoring Lemkin.
          *   *Weakness:* Hard to overcome the emotional weight of "Genocide = Death."
      *   *Objection 3 (Historian):* "Drafting Record." Cultural genocide was voted down.
          *   *Reply:* Lemkin's core concept remained. The compromise was on *means*, not *end*.
          *   *Weakness:* Factually, the UNGA did remove cultural destruction clauses. Need to be careful not to lie.
      *   *Concessions:* Admit the ICC/ICTY threshold is higher. Admit personal connection.
      *   *The "One Question":* "Are you putting your grandparents' trauma ahead of legal viability?"

  6.  **Final Polish:**
      *   Ensure the vocabulary matches (Prosecutors: *dolus specialis*, *Krstić*, evidentiary burden; Survivors: memory, hierarchy of suffering; Historian: *travaux préparatoires*, UNGA Resolution 96(I)).
      *   Check timing (2-minute replies are roughly 250-300 words spoken at a moderate pace).
      *   Ensure the "Honest Note" is truly honest about the legal risks.

  7.  **Review against Constraints:**
      *   Q&A format? Yes.
      *   Ranked by damage? Yes.
      *   Specific vocab? Yes.
      *   Two-minute replies? Yes (approximate).
      *   Honest notes on softness? Yes.
