      *   The "One Question"? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't give the user legal advice that is objectively wrong. The law *is* against them on "cultural genocide." The strongest legal hook is Article II(e) (Forcible Transfer of Children). I must steer the user to lean heavily on that, as it's the only non-lethal act explicitly listed that bridges the gap between physical and cultural destruction. I will structure the arguments to pivot from "Cultural Genocide" (which is legally dead) to "Genocide via Forcible Transfer of Children" (which is legally alive but hard to prove intent).

      *Wait, the prompt says the user wants to argue for genocide based on Lemkin's conception.* I need to respect that instruction while ensuring the Q&A protects them from being torn apart. The strategy must be: "We document as Genocide to capture the *intent*, even if prosecution focuses on specific acts."

      *Re-evaluating the "One Question":* The most dangerous question is about the NGO's mandate vs. legal reality. If the NGO loses credibility, they can't help anyone.

      *Let's finalize the ranking:*
      1. Prosecutors (Legal viability - kills the case).
