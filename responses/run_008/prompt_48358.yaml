answer: |-
  # Diagnostic Quiz: Which Bargaining Solution Do You Actually Accept?

  **Introduction**
  You know the names: Nash, Kalai–Smorodinsky, Utilitarian, Egalitarian. But labels are often just tribal markers. This quiz is designed to bypass your sympathies and test your axiomatic commitments. We present ten concrete bargaining scenarios. In each, choose the outcome or principle you find most normatively compelling. 

  *Note on Utility:* For Questions 1–5 and 7–10, assume the standard bargaining framework: utility is **not** interpersonally comparable and is meaningful only up to positive affine transformation (scaling and shifting). For Question 6, interpersonal comparability is explicitly granted for the sake of the case.

  ---

  ### The Questions

  **1. The Twin Artists (Symmetry)**
  Two artists collaborate on a mural. They are identical in skill, risk tolerance, and outside options. The feasible set of utility pairs is perfectly symmetric around the 45-degree line, and the disagreement point lies on that line.
  *   **A.** They must receive exactly equal payoffs.
  *   **B.** Equal payoffs are likely, but not strictly required by fairness alone.

  **2. The Walk-Away (Disagreement Point)**
  Consider two negotiations over the same surplus (same feasible set). 
  *   *Case 1:* If no deal is reached, both parties starve (disagreement utility = 0).
  *   *Case 2:* If no deal is reached, both parties have survivable savings (disagreement utility = 10).
  In Case 2, the "pie" to be divided is effectively smaller (surplus is reduced). Does the *division ratio* of the remaining surplus change simply because the threat of walking away is less dire?
  *   **A.** Yes. The leverage provided by the disagreement point dictates the split.
  *   **B.** No. The fair division of the *surplus* should depend only on the surplus itself, not the threat point.

  **3. The Musician's Market (Individual Monotonicity)**
  Two musicians split gig fees. Initially, the feasible set of agreements is fixed. Then, Musician A gains access to a new, high-paying market. However, due to scheduling conflicts, they cannot actually take these gigs *and* perform the current joint gig; the new market merely expands the *theoretical* maximum utility A could achieve if they abandoned the partnership entirely. The feasible set for the *joint* gig expands only in A's direction.
  *   **A.** Musician A's share of the current gig fees should not decrease (and ideally should rise) because their potential improved.
  *   **B.** Musician A's share might decrease. The new option changes the shape of the bargaining set in a way that could shift the product-maximizing point against them.

  **4. The Phantom Option (Independence of Irrelevant Alternatives)**
  A bargaining solution selects Outcome X from a large feasible set $S$. We then remove several options from $S$ that were *not* chosen (Outcome X is still available). The feasible set is now smaller ($S'$).
  *   **A.** The solution must still select Outcome X. Removing unchosen options shouldn't change the decision.
  *   **B.** The solution might change. Removing options can alter the "shape" or "balance" of the set, justifying a different choice even if X is still available.

  **5. The Currency Swap (Scale Invariance)**
  Alice and Bob are bargaining. We measure Alice's utility in dollars and Bob's in dollars. We calculate the fair outcome. Then, we decide to measure Bob's utility in *cents* (multiplying his utility numbers by 100), leaving Alice's in dollars.
  *   **A.** The real outcome (the actual allocation of goods/money) should remain unchanged. Units of measurement shouldn't dictate fairness.
  *   **B.** The outcome might change. If the solution relies on comparing the magnitude of utilities, the scaling matters.

  **6. The Common Currency (Aggregation with Comparability)**
  *Assume for this question only that utility is interpersonally comparable (e.g., both parties are bargaining over dollars).* You have $100 to split. 
  *   **A.** Maximize the total sum (e.g., give $100 to the person who values it more, if any; otherwise split).
  *   **B.** Equalize the gains. Each person should walk away with exactly $50 of gain over their disagreement point.

  **7. The Leftover (Pareto Efficiency)**
  A proposed agreement leaves some value on the table. Both parties could be made better off by moving to a different point in the feasible set, but the current point feels "fairer" in terms of process.
  *   **A.** Reject it. An agreement that wastes mutual gains is irrational and unfair.
  *   **B.** Accept it. Efficiency is not the only virtue; stability or simplicity might trump maximal gain.

  **8. The Ceiling (Ideal Points)**
  Two parties bargain. Party A's maximum possible payoff (the "ideal point") is 100. Party B's maximum possible payoff is 50. The feasible set is a straight line connecting these ideals.
  *   **A.** Party A should get more. Their "stake" in the maximum possible welfare is higher.
  *   **B.** They should split the surplus equally. The maximums are irrelevant distractions; only the disagreement point and the current surplus matter.

  **9. The Zero Shift (Translation Invariance)**
  We shift the utility scale for both players by adding 50 units to every possible outcome (including the disagreement point). The relative differences between options remain identical.
  *   **A.** The outcome should not change. Only relative gains matter.
  *   **B.** The outcome might change. The absolute level of welfare might matter for fairness.

  **10. The Axiom Trade-off (Consistency)**
  You are told that no solution can simultaneously satisfy *Independence of Irrelevant Alternatives* (Q4A) and *Individual Monotonicity* (Q3A) on the full domain of bargaining problems. You must drop one.
  *   **A.** Drop Individual Monotonicity. Consistency of choice (IIA) is more fundamental.
  *   **B.** Drop Independence of Irrelevant Alternatives. Sensitivity to opportunity sets (Monotonicity) is more fundamental.

  ---

  ### Scoring Key & Diagnostic

  **Instructions:** Tally your answers. There is no "correct" score, but your pattern reveals which formal model aligns with your normative intuitions.

  #### Step 1: The Foundation (Ordinal vs. Cardinal)
  **Look at Question 5 (Currency Swap).**
  *   **Mostly A (Scale Invariant):** You believe fairness should not depend on how we measure utility. You are in the **Ordinal Camp** (Nash or Kalai–Smorodinsky). Proceed to Step 2.
  *   **Mostly B (Scale Sensitive):** You believe the magnitude of utility numbers carries ethical weight. You are in the **Cardinal Camp** (Utilitarian or Egalitarian). Proceed to Step 3.
  *   **Mixed/Unsure:** You may hold an underexplored position. See "Incoherent Combinations" below.

  #### Step 2: The Ordinal Camp (Nash vs. Kalai–Smorodinsky)
  **Look at Questions 3, 4, and 10.**
  *   **The Nash Solution:** You chose **3B** (Payoff can drop), **4A** (IIA holds), and **10A** (Keep IIA).
      *   *Diagnosis:* You prioritize consistency of choice and the multiplicative product of gains. You accept that expanding someone's opportunities can paradoxically lower their payoff if it changes the tangent of the hyperbola.
  *   **The Kalai–Smorodinsky (KS) Solution:** You chose **3A** (Monotonicity holds), **4B** (IIA fails), and **10B** (Keep Monotonicity).
      *   *Diagnosis:* You prioritize the idea that having better options should never hurt you. You are willing to sacrifice IIA to ensure that the ratio of gains matches the ratio of ideal possibilities.
  *   **The "Impossible" Combination:** You chose **3A** AND **4A**.
      *   *Diagnosis:* **Theoretically Incoherent.** A famous impossibility theorem (Peters 1986) shows no solution satisfies Pareto, Symmetry, Scale Invariance, IIA, *and* Individual Monotonicity on the standard domain. You desire a solution that does not exist. You may be interested in restricted domains where this is possible, or you need to relax one commitment.

  #### Step 3: The Cardinal Camp (Utilitarian vs. Egalitarian)
  **Look at Questions 2 and 6.**
  *   **The Utilitarian Solution:** You chose **6A** (Maximize Sum) and **2B** (Disagreement point doesn't affect split ratio).
      *   *Diagnosis:* You view bargaining as a welfare maximization problem. Since the sum of gains $(u_1 - d_1) + (u_2 - d_2)$ differs from the sum of utilities $u_1 + u_2$ only by a constant ($d_1 + d_2$), the location of $d$ does not change the utility-maximizing point on the frontier.
  *   **The Egalitarian Solution:** You chose **6B** (Equalize Gains) and **2A** (Disagreement point matters).
      *   *Diagnosis:* You view fairness as equalizing the *benefit* of cooperation. Since the benefit is defined relative to the disagreement point ($u_i - d_i$), changing $d$ necessarily changes the fair outcome.
  *   **The "Unit-Dependent" Egalitarian:** You chose **5A** (Scale Invariant) but **6B** (Equalize Gains).
      *   *Diagnosis:* **Tension.** Standard Egalitarianism requires interpersonal comparability (Question 6), which usually violates Scale Invariance (Question 5). If you want to equalize gains without comparable units, you are likely describing the **Kalai–Smorodinsky** solution (which equalizes *proportional* gains relative to the ideal) rather than the strict Egalitarian solution.

  #### Step 4: Universal Checks (Symmetry, Pareto, Translation)
  *   **Question 1 (Symmetry):** If you chose **1B**, you reject the Symmetry axiom. None of the four standard solutions fit you well. You may prefer **Asymmetric Nash Bargaining** (weighted products) or power-based models.
  *   **Question 7 (Pareto):** If you chose **7B**, you reject Efficiency. This is rare in formal bargaining theory but common in behavioral ethics. You might prefer **Monotone Path Solutions** that prioritize fairness constraints over efficiency.
  *   **Question 9 (Translation):** If you chose **9B**, you reject Translation Invariance. This suggests you care about absolute welfare levels (e.g., prioritarianism), which places you outside the standard bargaining framework entirely.

  #### Limitations & Unexplored Territory
  *   **Nash vs. Utilitarian (without comparability):** This quiz assumes the standard distinction that Utilitarianism requires comparability. If you believe we should maximize the sum of utilities *without* assuming comparability, you are advocating for a specific utility normalization that the quiz does not separate from Nash.
  *   **The "Disagreement" Split:** Question 2 separates Utilitarianism from the others. However, some variants of Egalitarianism (relative utilitarianism) behave like Nash. If you found Q2 difficult, your intuition may lie with the **Raiffa Solution** (a step-wise compromise solution), which splits the difference between Nash and KS properties.
  *   **Incoherence Flag:** If you selected **Scale Invariant (5A)** AND **Utilitarian (6A)**, your position is **Unattractive/Inconsistent**. Utilitarianism is inherently cardinal; claiming units don't matter while summing utilities is mathematically contradictory.

