  Based on Dana's track record, she is operating with a sophisticated, hybrid metaphysical framework. She isn't a simple eliminationist (she thinks statues and lumps are real) nor a simple permissivist (she thinks they have strict conditions for survival).

  Here is the breakdown of the candidate rules, their predictions for your new cases, and the ultimate test to split them.

  ### 1. The Candidate Rules

  To fit her five past verdicts, we need rules that account for **Artifact Essentialism** (Case 3 vs. 4), **Lump Individualism** (Case 5), and **Constitution vs. Identity** (Case 1).

  **Rule A: The Constitution View (Two Objects)**
  *   **Core Principle:** The Statue and the Lump of Clay are numerically distinct objects that happen to share the same matter and location.
  *   **Persistence:** They have different persistence conditions. The Statue depends on *form, function, and history* (Case 3, 4). The Lump depends on *continuity of mass and matter* (Case 1, 5).
  *   **Fit to Track Record:** Explains Case 1 perfectly (Statue dies, Lump lives because they are different things). Explains Case 5 (Lump dies on division because its mass-unity is broken). Explains Case 4 (Statue dies on scattering because its history/form is broken).

  **Rule B: The Dominant Sortal View (One Object)**
  *   **Core Principle:** There is only one object in a place at a time. That object falls under different descriptions ("sortals") like *Statue*, *Lump*, or *Ship*.
  *   **Persistence:** The object persists as long as *some* sortal applies to it, but specific sortals have specific death conditions. If the "Statue" sortal no longer applies, the object may still exist under the "Lump" sortal.
  *   **Fit to Track Record:** Explains Case 1 (The object survives, but the description "Statue" is now false; "Lump" is now true). Explains Case 5 (The object ceases to exist because the "Lump" sortal conditions are violated and no other sortal takes over).

