  ### 2. Predictions for Your New Cases

  Both rules are constrained by Dana's clear commitment to **Artifact Essentialism** (Case 4: Reassembly fails) and **Lump Unity** (Case 5: Division kills the lump). This forces them to agree on (a) and (b).

  #### (a) The Carving Case
  *   **The Setup:** Block of marble $\rightarrow$ Carving $\rightarrow$ Statue.
