      *   Decision: **Dana comes out ahead.** Why? Because Marcus's Move 6, while statistically clever, requires assuming a specific distribution (exponential) without evidence, whereas Dana's reliance on the empirical distribution of observed lifespans (most end before 2100) is more robust *unless* Marcus proves the hazard rate is flat. Also, Dana's Move 5 (track record) is empirically stronger than Marcus's theoretical Move 6.
      *   Wait, looking closer at Move 6. If the hazard rate is flat, the *average* lifespan is still a number. If the average lifespan of a hegemon is 200 years, and the US is at 80, does a flat hazard rate mean it's likely to last to 2100? If mean = 200, and it's memoryless, expected remaining = 200. So it *helps* Marcus. But Dana's point is "rarely held top spot for more than a few centuries." If the distribution is exponential with mean 200, the probability of lasting 300 is $e^{-300/200} \approx 0.22$. So it's still unlikely. Dana's point holds even with a flat hazard rate if the mean is low. Marcus claims the base rate is a "misreading." That's too strong. The base rate (distribution) still matters.
