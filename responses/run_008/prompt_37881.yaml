      *   *Claim:* Empires might have a flat hazard rate (memoryless process). If so, current age tells you nothing about future lifespan. Dana's base rate (age-based) is a misreading.
      *   *Evaluation:* This is a sophisticated statistical point. If the process is Poisson (constant hazard), survival time so far doesn't predict remaining time. However, Dana's argument wasn't necessarily *just* about age (Copernican principle), but about the *distribution* of lifespans in the reference class. If the reference class shows most die before age X, and US is approaching X, it matters even with a flat hazard rate *if* the population is heterogeneous. But if the hazard is truly flat for the *class*, then conditioning on survival so far doesn't change the probability of surviving the next interval *relative to the class average*. Wait, if the hazard rate is flat, the expected *remaining* life is constant, but the expected *total* life increases.
