      *   *Probability ($P$):* Logical relation between hypothesis ($h$) and evidence ($e$). $P(h|e)$. Can be numerical or non-numerical (ordinal).
      *   *Weight ($V$):* Amount of relevant evidence. Distinct from $P$. $V$ increases as we get more evidence, even if $P$ stays the same.
      *   *Uncertainty:* Situations where there is no logical basis for assigning *any* probability (numerical or ordinal). The principle of indifference fails. Radical uncertainty.

  3.  **Step 1: Ordering and Dependencies:**
      *   *Option A: Probability $\rightarrow$ Weight $\rightarrow$ Uncertainty.* (Standard linear progression).
          *   Pros: Builds on their existing stats knowledge. Eases them in.
          *   Cons: Risk of them thinking Weight is just "sample size" (stats concept) and Uncertainty is just "low weight."
      *   *Option B: Uncertainty $\rightarrow$ Weight $\rightarrow$ Probability.* (Shock and awe).
          *   Pros: Grabs attention. Breaks the stats frame immediately.
          *   Cons: Too abstract. They might dismiss it as "we don't know stuff." Hard to define uncertainty without defining what it's *not* (probability).
      *   *Option C: Probability $\rightarrow$ Uncertainty $\rightarrow$ Weight.*
          *   Pros: Establishes the norm, breaks it, then offers the bridge concept.
          *   Cons: Weight is the subtlest concept. Saving it for last might rush it.
      *   *Decision:* I need to avoid the "stats trap." If I start with Probability, they zone out. If I start with Uncertainty, they tune out as "philosophical fluff."
      *   *Selected Strategy:* **Probability $\rightarrow$ Weight $\rightarrow$ Uncertainty.** *However*, the transition from Probability to Weight must be sharp to show they are *orthogonal*, not correlated. Then Weight to Uncertainty must show the *breakdown* of the probability relation.
      *   *Refinement:* Actually, the prompt asks specifically about the order of P/W vs W/U.
      *   *Reasoning:* You cannot understand "Weight" without understanding "Probability relative to evidence" first (Weight is weight *of* evidence supporting a probability relation). You cannot understand "Uncertainty" (in the Keynesian sense) without seeing where "Weight" runs out or where the logical relation fails.
      *   *Wait, a counter-argument:* Some scholars (e.g., Runde, O'Donnell) argue Weight is the bridge to Uncertainty. If Weight is low, we are closer to Uncertainty. But Keynes says Weight and Probability are independent.
      *   *Final Decision:* **Probability $\rightarrow$ Weight $\rightarrow$ Uncertainty.** Why? Because their default frame is Probability. I must meet them there, show the crack in that frame (Weight), and then show where the frame shatters (Uncertainty). Starting with Uncertainty risks them categorizing it as "risk vs uncertainty" (Knight) immediately without grasping the logical relation aspect.

  4.  **Step 2: The Carrying Example:**
      *   *Requirements:* Must separate P and V. Must separate V and Uncertainty. Must avoid Coin (too risky), Weather (too meteorological), Elections (too political).
      *   *Candidate 1: The Urn.* (Classic). Urn with unknown composition.
