          *   Scenario C: A new material is used with no history. (Uncertainty).
          *   *Why:* It separates calculation (P) from empirical grounding (V). It separates known risks (material fatigue) from unknown unknowns (novel material interaction).
          *   *Decision:* **The "New Bridge" Engineering Case.** It feels objective (appealing to Econ) but epistemic (appealing to Phil).

