      *   *Selection:* **The Courtroom Verdict (modified).** Why? It's intuitive. Everyone understands that a hunch (High P, Low V) is different from a slam dunk (High P, High V). It handles the "Uncertainty" well via "unknown evidence" (the smoking gun hidden in the lake).
      *   *Wait, reconsidering:* The prompt says "Weight... whether or not the probability number moves." The Urn is actually better for this mathematically.
