answer: |-
  To predict your friend's verdicts, we must first reverse-engineer the logic underlying her past judgments. She is not a denialist of adaptation; rather, she is a **rigorous selectionist** who applies a high burden of proof to distinguish traits shaped by natural selection from those that arise via constraint, chemistry, or cultural novelty.

  ### 1. Reconstructing the Implicit Rule
  Based on her record, her working definition of an **Adaptation** appears to be:
  > *A trait is an adaptation if there is evidence that natural selection has acted to shape or maintain it for a specific function that enhances fitness, regardless of whether the trait is "optimally designed" or recently evolved.*

  Her definition of a **Byproduct** (or Spandrel/Vestige) is:
  > *A trait is a byproduct if it arises inevitably from the chemistry or developmental structure of an adaptation (without being selected itself), if it is a vestigial remnant with no current function, or if it relies on cultural transmission too recent for genetic selection.*

  **Key Evidence from her Record:**
  *   **Time is not a barrier:** She accepts the Peppered Moth (industrial era) and Lactose Tolerance (few thousand years) would likely pass this test, ruling out the idea that she only accepts "Stone Age" adaptations. The barrier for Reading is not recency *per se*, but the lack of *genetic* selection (it is culturally transmitted).
  *   **Engineering is not a barrier:** She accepts the Panda's Thumb despite it being "badly engineered." This means she prioritizes *selective history* over *optimality*.
  *   **Chemistry/Development is a barrier:** Red blood and male nipples are rejected because they are inevitable physical/developmental consequences of other selected traits (hemoglobin function, female development), not selected traits themselves.
  *   **Function is the tie-breaker:** The Panda's Thumb is useful (stripping bamboo); Male Nipples are not. This suggests current utility (maintained by selection) can validate an adaptation even if the origin was exaptive.

  ### 2. Alternative Rules
  To test her consistency, we must consider rival hypotheses that fit her past data equally well:

  *   **Rule A (The "Hard Physiology" Rule):** Adaptations are biochemical or anatomical mechanisms (Fever, Moth, Thumb); Byproducts are cognitive or cultural experiences (Music, Reading).
      *   *Fit:* Perfect fit for past data.
      *   *Weakness:* Craving for sugar/fat is a psychological drive, yet she calls it an adaptation. This rule is too strict.
  *   **Rule B (The "Vestigiality" Rule):** Any trait that was functional in ancestors but is non-functional in humans is a byproduct.
      *   *Fit:* Explains Goosebumps (predicted) and Male Nipples.
      *   *Weakness:* Doesn't explain why Red Blood is a byproduct (it's still functional, just the color isn't selected).
  *   **Rule C (The "Just-So Skeptic" Rule):** Any trait where the fitness benefit is hypothetical or hard to measure (Music, Tears) is a byproduct; any trait with a measurable survival metric (Fever, Moth camouflage, Lactose digestion) is an adaptation.
      *   *Fit:* Strong fit. Explains the "close call" on music.

  ### 3. Predicted Verdicts on the Four New Cases

  Here is what you should expect her to say, ordered from most certain to most contentious:

  **1. Adult Lactose Tolerance: ADAPTATION**
  *   **Reasoning:** This is the strongest case in the set. It mirrors the Peppered Moth: a genetic shift driven by a specific environmental pressure (dairying) within a timeframe short enough to be documented. It is not a cultural skill (like reading) but a genetic enzyme persistence. To deny this would contradict her verdict on the Moth.
  *   **Consistency Check:** Confirms she accepts recent, gene-culture coevolution.

  **2. Goosebumps: BYPRODUCT (Vestige)**
  *   **Reasoning:** Unlike the Panda's Thumb, which is "badly engineered" but *functional*, goosebumps in hairless humans serve no thermoregulatory or threat-display function. They are a reflex arc with no current utility.
  *   **Consistency Check:** Distinguishes her from "Panglossian" adaptationists who try to find a use for everything. Aligns with her view on Male Nipples (developmental legacy without function).

  **3. Enjoyment of Chili Peppers: BYPRODUCT**
  *   **Reasoning:** While the *behavior* of eating chilies might have antimicrobial benefits (a cultural adaptation), the *enjoyment of the burn* is likely a "benign masochism" effect—a hijacking of pain receptors (TRPV1) that evolved to detect heat/toxins.
  *   **Consistency Check:** Aligns with her verdict on Music. Both are pleasurable responses to stimuli that were not evolutionarily "intended" to be pleasurable. It distinguishes this from Sugar/Fat craving, which targets nutrients directly essential for survival in the EEA.

  **4. Emotional Tears: THE PIVOT (Likely BYPRODUCT, but contentious)**
  *   **Reasoning:** This is the hardest case.
      *   *Argument for Adaptation:* Like Fever, it is a physiological response. It may serve as a hard-to-fake signal of distress or submission (social bonding).
      *   *Argument for Byproduct:* Like Red Blood, it may be an inevitable overflow of the lacrimal system during autonomic arousal (crying is physically linked to the sympathetic nervous system).
      *   **Prediction:** Given her skepticism of Music (another social/emotional signal), she will likely rule this a **Byproduct**. She tends to treat social signaling theories as "just-so stories" unless the physiological mechanism is as direct as Fever.
  *   **Consistency Check:** This is where she risks inconsistency. If she accepts Tears as an adaptation, she must explain why it differs from Music. If she rejects it, she must explain why it differs from Fever.

  ### 4. The Decisive Case
  The case that most sharply divides the rival rules is **Emotional Tears**.

  *   **Why?** It sits at the intersection of her two conflicting tendencies: her acceptance of **Physiology** (Fever = Adaptation) and her skepticism of **Social Psychology** (Music = Byproduct).
  *   **The Divide:**
      *   If she rules **Adaptation**: She prioritizes the "Hard Physiology" rule. She believes regulated bodily outputs generally imply selection.
      *   If she rules **Byproduct**: She prioritizes the "Just-So Skeptic" rule. She believes social signaling claims require higher proof than metabolic claims.
  *   **Why not Lactose?** Lactose is too clear-cut. Almost any consistent evolutionary biologist must call it an adaptation. It tests her knowledge, not her philosophical framework.
  *   **Why not Goosebumps?** Goosebumps are clearly vestigial. Calling them an adaptation would require abandoning the concept of vestiges entirely, which her "Male Nipple" verdict shows she hasn't done.

  ### 5. If Tears Is Not Decisive: The "Further Case"
  If she hedges on Tears (calling it a "close call" like Music), the case that would force a definitive resolution is **Morning Sickness (Nausea in early pregnancy).**

  *   **The Setup:**
      *   *Adaptation View (Profet's Hypothesis):* It is a defense mechanism to expel toxins and protect the fetus during organogenesis.
      *   *Byproduct View:* It is an unavoidable side effect of the hormonal surge (HCG) required to maintain pregnancy.
  *   **Why it Decides:**
      *   It is **Physiological** (like Fever/Tears).
      *   It is **Universal** (like Music/Tears).
      *   It has a **Plausible Function** (like Panda Thumb/Fever).
      *   It has a **Plausible Constraint** (like Blood/Nipples).
  *   **The Verdict:**
      *   If she calls Morning Sickness an **Adaptation**, she admits that "unpleasant" physiological states can be selected for social/protective functions, which might force her to reconsider **Emotional Tears**.
      *   If she calls it a **Byproduct**, she solidifies her stance that hormonal/developmental constraints trump functional speculation, which would cement **Emotional Tears** and **Music** as byproducts.

  **Summary for your argument:**
  Expect her to accept **Lactose Tolerance** (genetic selection), reject **Goosebumps** (vestigial), and reject **Chili Enjoyment** (sensory hijack). Watch her closely on **Emotional Tears**; that is where her definition of "function" will either expand to include social signaling or contract to exclude it. If she wavers, bring up **Morning Sickness** to force the choice.
