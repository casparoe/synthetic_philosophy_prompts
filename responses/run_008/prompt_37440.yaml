answer: |-
  Here is a breakdown of the distinct claims compressed into the slogan "truth is whatever works," structured for your reading group discussion.

  ### 1. The Empirical Correlation
  **The Claim:** True beliefs generally lead to successful action; therefore, practical success is a reliable *indicator* of truth.
  *   **Status:** **Trivial / Defensible.** This is compatible with almost any realist theory of truth. It asserts a correlation, not an identity.
  *   **Peirce vs. James:** **Overlap.** Both agree that true beliefs guide us successfully through experience. Peirce emphasizes the long-run stability of this success; James emphasizes the immediate "cash value."
  *   **Supports Colleague?** **No.** This reading preserves the distinction between *being* true and *working*. A frictionless plane model can work (predictively) while remaining false (ontologically). This reading treats utility as evidence, not definition, so the objection regarding idealizations stands.

  ### 2. The Epistemic Criterion
  **The Claim:** We have no access to "reality" other than through practical consequences; therefore, "working" is the only *test* or *criterion* we can use to identify truth.
  *   **Status:** **Substantive but Defensible.** This is an epistemological claim about human limitations, not a metaphysical claim about the nature of truth itself.
  *   **Peirce vs. James:** **Overlap.** Both are fallibilists who reject intuition or immediate correspondence as a test. However, Peirce insists the test must be public and repeatable, whereas James allows for more personal verification.
  *   **Supports Colleague?** **No.** Confusing a *criterion* (how we know) with a *definition* (what it is) is a philosophical error. Even if utility is our only test, the model could still fail the test in the future (e.g., at quantum limits). It does not license calling a known idealization "true," only "currently verified."

  ### 3. The Peircean Convergence (The Long Run)
  **The Claim:** Truth is the opinion fated to be ultimately agreed to by all who investigate; "working" means surviving the rigors of inquiry indefinitely.
  *   **Status:** **Substantive and Defensible.** This is the classic Peircean definition. It anchors truth in a counterfactual ideal limit, not current utility.
  *   **Peirce vs. James:** **Pure Peirce.** James found this too abstract and remote from human life. Peirce insisted on it to avoid relativism.
  *   **Supports Colleague?** **No.** In fact, it undermines him. Frictionless planes are known *not* to survive the limit of inquiry (we know friction exists). On this reading, the model is explicitly *false*, even if it is a useful heuristic for now. It distinguishes between "temporarily useful" and "true."

  ### 4. The Jamesian Satisfaction (The Cash Value)
  **The Claim:** Truth is made in the process of experience; a belief is true if it satisfies our immediate interests and leads us to beneficial psychological or practical outcomes.
  *   **Status:** **Radical / Controversial.** This dissolves the independence of truth from human interests. It is defensible only if one accepts a radical redefinition of "truth" as a species of "the good."
  *   **Peirce vs. James:** **Pure James.** Peirce explicitly rejected this, fearing it made truth too subjective ("the truth is what I like to believe").
  *   **Supports Colleague?** **Yes, but at a cost.** This licenses calling the model "true" because it satisfies the scientist's interest in prediction. However, it invites the objection that truth becomes relative to the user's goals. If the model stops working for a different interest (e.g., teaching mechanics accurately), it ceases to be true.

  ### 5. The Instrumentalist Reduction
  **The Claim:** The concept of "truth" as accurate representation is a confusion; "true" is merely a compliment we pay to theories that save the phenomena. Ontological accuracy is meaningless.
  *   **Status:** **Radical / False (to Realists).** This is not a theory of truth but an elimination of the concept in favor of utility (akin to Van Fraassen's constructive empiricism or Rorty's pragmatism).
  *   **Peirce vs. James:** **Neither (Post-Classical).** This is closer to Richard Rorty or Bas van Fraassen than to classical pragmatism. Both Peirce and James believed in a reality that constrains belief; this reading suggests reality is irrelevant.
  *   **Supports Colleague?** **Yes.** This is the only reading that fully validates his dismissal. It argues that asking if the frictionless plane is *really* true is a category mistake. However, it requires abandoning the idea that science aims to describe reality, which may be too high a price for your department to pay.

  ***

  **Summary for the Group:**
  Your colleague is likely relying on **Reading 5 (Instrumentalist Reduction)** while presenting it as **Reading 1 (Empirical Correlation)**. If you press him on whether he believes science aims to describe reality (Peirce/James) or merely organize experience (Rorty/Instrumentalist), the ambiguity of the slogan will vanish. Readings 1–3 preserve the objection that idealizations are false; Readings 4–5 dissolve the objection by redefining truth.
