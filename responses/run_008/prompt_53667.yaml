answer: |-
  ### The Verdict
  **Accept with Conditions.**

  She will not reject the afterword, because it contains the structural generalization (yellow fever mortality) she favored in the Aztec and WWI trench cases, and the traced sequence she accepted in the Corn Laws case. However, she will grumble exactly as she did about the Corn Laws. She will demand that you **make the generalizations governing the human decisions explicit.**

  Currently, your Ingredient 2 (the chain of decisions) is presented as a narrative sequence: *this happened, then that happened.* In the Corn Laws manuscript, she accepted the sequence only after you "wrote out" the implicit generalizations (e.g., presumably something like *"Famine creates irresistible pressure on landed elites"* or *"Parliamentary arithmetic dictates coalition shifts"*). For the Haitian draft, she will insist you cannot simply say "Dessalines launched a final campaign." You must state the principle that makes that campaign explanatory rather than just descriptive. Is the principle *"Occupying armies lose cohesion when supply lines are severed"*? Or *"Formerly enslaved populations fight with higher morale when legal status is threatened"*? She will demand you identify and write down the "law" that connects Toussaint's capture to Dessalines's victory, rather than letting the narrative arc carry the explanatory weight alone.

  ### The Reconstructed Rule
  The rule she is running is **Explicit Generalized Causal Mechanism.**

  It is not **Strict Covering-Law Explanation** (Hempel), because she accepted the Corn Laws sequence, which relies on particular contingencies (Peel's conversion, specific parliamentary arithmetic) rather than deducing the outcome solely from universal laws.
  It is not **Narrative Understanding** (Dray/Collingwood), because she rejected the "Hubris" diagnosis (which is a narrative label for character) and the "Princip's Shots" account (a narrative trigger), insisting instead on background generalizations.
  It is not **Statistical Relevance** (Salmon) alone, because she accepted the Corn Laws political sequence, which is not purely statistical.

  Her rule is a hybrid: **An event is explained only when a causal chain is traced *and* every link in that chain is supported by an explicit general regularity (whether statistical, structural, or behavioral).** Singular triggers (Princip) fail because they lack the general background condition. Psychological labels (Hubris) fail because they are circular diagnoses without a mechanistic generalization. Sequences (Corn Laws) pass only if the "glue" holding the sequence together is made explicit.

  ### Rival Rules and Divergence
  Two rival rules fit her six earlier verdicts but diverge sharply on your Haitian afterword:

  1.  **Structural Determinism:** This rule holds that only broad, impersonal forces (disease, technology, economics) constitute real explanations; human agency is merely the medium through which these forces act.
      *   *Fit to Past:* Explains her acceptance of WWI Trenches (tech), Aztec (disease), Reformation (tech/economics). She could have rejected the Corn Laws as "too political," but perhaps she viewed the famine as the structural driver.
      *   *Divergence on Haitian:* She would demand you **demote the decisions and narrative arc to ornament.** She would insist the Yellow Fever statistic carries the *entire* explanatory weight. The afterword should argue that the French *could not* have won regardless of Dessalines's choices.
  2.  **Intentionalist Narrative:** This rule holds that history is explained by reconstructing the reasons and decisions of agents; structural factors are merely the stage setting.
      *   *Fit to Past:* Explains acceptance of Corn Laws (Peel's conversion, League agitation) and potentially the Reformation (dissent). She could have rejected Princip as "too small" a decision, but accepted Napoleon's invasion as a decision (though she rejected "hubris," she might accept a detailed account of his strategic reasoning).
      *   *Divergence on Haitian:* She would demand you **foreground Dessalines's reasons and treat the epidemiology as background.** She would insist the afterword focus on the political logic of the black leadership, treating yellow fever as a lucky break rather than the explanation.

  **My Best Guess:** Her rule is **Explicit Generalized Causal Mechanism.**
  *Why:* The Corn Laws verdict is the key. A Structural Determinist would likely have rejected the political maneuvering as epiphenomenal to the famine. An Intentionalist would not have demanded the generalizations be "written out." Only a historian who believes that *both* structure and agency explain events, provided the *mechanisms* linking them are made explicit, would accept the Corn Laws sequence but grumble about the implicit theory. She wants the "physics" of the history, whether that physics is biological (fever) or sociological (parliamentary arithmetic).

  ### The Crucial Experiment
  To separate these rules at dinner, float this case:

  **The Case:** *The end of the Cold War.*
  **The Explanation:** "The Soviet Union collapsed because Gorbachev decided to stop using military force to maintain control over Eastern Europe."

  **Predictions:**
  *   **Structural Determinism:** **Reject.** She will say, "Gorbachev is a variable, not a cause. The explanation must be the structural inability of command economies to compete with information economies." She will demand you remove Gorbachev's decision and focus on oil prices or fiscal insolvency.
  *   **Intentionalist Narrative:** **Accept.** She will say, "Yes, history turns on choices. If he had chosen like Andropov, the tanks would have rolled." She will not demand a generalization about *why* he chose that, only that the choice was made.
  *   **Her Actual Rule (Explicit Generalized Causal Mechanism):** **Accept with Conditions.** She will say, "A decision is not an explanation. *Why* did he stop? You need the generalization: 'Leaders facing fiscal insolvency withdraw coercion to preserve regime survival.' Write that down, then the decision counts as an explanation."

  If she asks you to find the economic law that *forced* Gorbachev's hand, she is a Structural Determinist. If she accepts the decision as sufficient, she is an Intentionalist. If she asks you to link the decision to a general rule of elite behavior under stress, she is running the **Explicit Generalized Causal Mechanism** rule.
