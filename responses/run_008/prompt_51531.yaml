prompt: |-
  I write novels, and the one I'm working on now has a fifteen-year-old narrator who becomes convinced she has dissociative identity disorder after falling down an online rabbit hole -- the plot is partly about how getting the label changes who she thinks she is. A friend who does philosophy of science mentioned Ian Hacking's looping effects, how classifying people changes the people classified and eventually reshapes the category itself, and honestly that's kind've exactly what my book is doing. So now I'm a bit nervous. I want a procedure I can run on my own drafts -- I tend to write two or three characters carrying some psychiatric label per book, my audience is YA-adjacent, and there's a real chance my depictions land on readers who are actively hunting for words for what they feel. Give me the questions to ask in order about a given portrayal, what a sufficient answer to each looks like, where the procedure stops at "rewrite or cut this," and where it has to hand off to a judgment call between me and my editor because the question is about values not facts. I don't have a clinician on call and can only afford a sensativity reader for one character per book, so the procedure has to be runnable by me alone with a draft and a weekend. Then run it on three things: the self-diagnosing teenager (where the looping is the whole point of the novel and I really don't want to cut it), a minor character with fairly textbook OCD that I've written for warmth rather than drama, and a character whose "condition" I basically invented by blending symptoms from a few real ones because it served the metaphor. Be honest about where the procedure will tell me to do something I won't like, and about what it can't settle at all.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist writing YA-adjacent fiction.
      *   **Current Project:** Features a 15-year-old narrator who self-diagnoses with DID after online research. The plot *explicitly* explores Ian Hacking's "looping effects" (classification changing the classified).
      *   **Concern:** Nervous about potential harm/misrepresentation, especially since readers might be vulnerable/searching for labels.
      *   **Constraint:** No clinician on call, budget for only one sensitivity reader per book (needs to be prioritized), procedure must be runnable by the author alone in a weekend.
      *   **Task:** Create a diagnostic/procedural checklist for evaluating psychiatric portrayals in fiction. Define questions, sufficient answers, stop points (rewrite/cut), and value judgment handoffs. Then, apply this procedure to three specific character archetypes from their work.
      *   **Tone:** Honest, practical, nuanced, acknowledging the tension between art and ethics.

  2.  **Deconstruct the Core Ethical/Artistic Tension:**
      *   *Hacking's Looping Effects:* This is a sophisticated sociological concept. Using it as a theme is valid, but risky if it validates misinformation (e.g., TikTok DID trends).
      *   *Vulnerable Audience:* YA readers are often identity-forming. Misrepresentation can lead to self-misdiagnosis or stigma.
      *   *Authorial Intent vs. Reader Reception:* The author knows it's a critique/exploration; the reader might take it as instruction.
      *   *Resource Limitation:* Can't check everything with a pro. Need a triage system.

  3.  **Develop the Procedure (The "Weekend Audit"):**
      *   Needs to be sequential.
      *   Needs clear "Pass/Fail/Review" criteria.
      *   Needs to distinguish between *factual accuracy* (symptoms), *narrative function* (why is this label here?), and *harm potential* (what if a reader copies this?).
      *   *Phase 1: Function & Necessity.* Why is the label here?
      *   *Phase 2: Accuracy & Nuance.* Is the depiction grounded?
      *   *Phase 3: Consequence & Agency.* Does the character exist beyond the label?
      *   *Phase 4: Harm Mitigation.* What safeguards are in place?
      *   *Decision Points:* Where does the author decide? Where does the editor decide? Where *must* a sensitivity reader be used?

  4.  **Drafting the Questions (Iterative Process):**
      *   *Q1:* Why this label? (If the answer is "plot device," that's a red flag.)
      *   *Q2:* Is the diagnosis confirmed? (Self vs. Pro.)
      *   *Q3:* Does the character change? (Hacking's loop.)
      *   *Q4:* Is the suffering romanticized?
      *   *Q5:* What is the reader likely to do with this?
      *   *Refinement:* Make the "Sufficient Answer" concrete. Make the "Stop/Rewrite" condition clear.

  5.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: The Self-Diagnosing Teen (DID/Looping Effect).**
          *   *Challenge:* This is the core theme. Cutting it kills the book. But it's high risk.
          *   *Audit:* The procedure *must* flag this for the sensitivity reader. It can't be solved by the author alone. The "looping" must be shown as complex, not just "I found a label and now I'm fixed/broken."
          *   *Honest Truth:* The procedure will say "You need a pro here, even if you budgeted for only one." This character *is* the budget priority.

      *   **Case 2: Minor Character (Textbook OCD/Warmth).**
          *   *Challenge:* "Textbook" can mean stereotypical. "Warmth" can mean trivializing.
          *   *Audit:* If it's just quirks (coloring pencils), it's harmful. If it's intrusive thoughts + rituals causing distress, it's better.
          *   *Honest Truth:* If it's just "cute quirks," the procedure says cut/rewrite. If it's respectful background texture, it might pass without a sens reader if the main character gets the sens reader.

      *   **Case 3: The Metaphorical Blend (Invented Condition).**
          *   *Challenge:* Blending symptoms can spread misinformation.
          *   *Audit:* Is it labeled? If it's labeled as a real disorder but acts fake, that's a fail. If it's vague/metaphorical, it's safer.
          *   *Honest Truth:* The procedure will likely demand decoupling the label from the real condition. Don't call it "Schizophrenia" if it's magic.

  6.  **Refining the "Handoff" Points:**
      *   *Fact/Logic:* Author can check (consistency).
      *   *Values/Impact:* Editor/Author (tone).
      *   *Lived Experience/Clinical Reality:* Sensitivity Reader (must-have for high stakes).

  7.  **Final Review against Constraints:**
      *   *Weekend runnable?* Yes, if focused.
      *   *Honest about unpleasant outcomes?* Yes, need to explicitly state that the DID character *needs* the sensitivity reader, meaning the others might not get one.
      *   *Hacking's Looping?* Acknowledge that depicting the loop isn't the same as endorsing the misinformation.

  8.  **Constructing the Output:** (Drafting the response with clear headings, bullet points, and a direct, professional tone.) *Self-Correction during drafting:* Make sure I don't give medical advice. Frame everything around *narrative ethics* and *representation*, not clinical diagnosis. Ensure the distinction between "self-diagnosis in the text" vs "author endorsing self-diagnosis" is clear.

  9.  **Final Polish:** Check the tone. It needs to be supportive but firm on the risks. The user is smart (knows Hacking), so don't dumb it down. Acknowledge the artistic merit while highlighting the responsibility. (Proceed to generate output).

  *(Self-Correction on the "One Sensitivity Reader" constraint)*: The user says they can only afford one. The procedure *must* tell them which one gets it. In this case, the DID narrator is the highest risk/high reward. The procedure should prioritize that.

  *(Self-Correction on the "Invented Condition")*: This is often a way to bypass stigma, but can also be a way to misuse terminology. The procedure needs to test if the metaphor relies on harmful stereotypes of the real conditions being blended.

  *(Final Plan)*:
  1. Introduction acknowledging Hacking and the stakes.
  2. The "Weekend Audit" Protocol (4 Phases).
  3. Decision Matrix (When to stop, when to hand off).
  4. Running the Audit on the 3 Characters.
  5. Conclusion on the limits of the procedure.cw
answer: |-
  This is a sophisticated ethical and artistic problem. You are dealing with **ontological realism** (how categories make up people) in a genre (YA-adjacent) where readers are often in the process of constructing their own identities. Ian Hacking's *looping effects* are real: when you classify a person, they react to the classification, changing the classification's meaning over time.

  Your novel *depicting* this is valid. Your novel *unintentionally accelerating* a harmful loop (e.g., validating misinformation about DID that leads to iatrogenic harm) is the risk.

  Since you cannot afford a clinical consultant for every draft, you need a **Triage Protocol**. This procedure is designed to identify which portrayals are safe for solo revision, which require editorial negotiation, and which *must* consume your single sensitivity reader budget.

  Here is the **Weekend Audit Protocol**.

  ---

  ### Part 1: The Protocol (Run this on each labeled character)

  Do not skip steps. Answer in writing. If you cannot answer a question in two sentences or fewer, you have not yet defined the portrayal.

  #### Phase 1: Narrative Necessity (The "Why")
  **Q1: If I remove the psychiatric label but keep the behaviors, does the plot collapse?**
  *   **Sufficient Answer:** "No, but the *internal logic* of the character's coping mechanism vanishes," or "Yes, because the label itself is the antagonist/catalyst."
  *   **Rewrite/Cut Signal:** If the answer is "It makes them more interesting/quirky/tragic," **STOP**. This is using pathology as decoration. You must rewrite the character's function or cut the label.
  *   **Handoff Point:** If the label is essential to the *theme* (as with your narrator), this moves to Phase 2.

  #### Phase 2: Accuracy vs. Metaphor (The "What")
  **Q2: Is this label being used clinically, culturally, or metaphorically?**
  *   **Sufficient Answer:** "Clinically: I have researched the DSM/ICD criteria and am adhering to them." OR "Culturally: I am depicting how the *internet* understands this label, distinct from clinical reality." OR "Metaphorical: I am using the label to signify X, knowing it is not medically accurate."
  *   **Rewrite/Cut Signal:** If you are blending symptoms (Case 3) but using a real label, **STOP**. You must either make the condition fictional/unlabeled or adhere to the clinical reality of the label. You cannot have it both ways without spreading misinformation.
  *   **Handoff Point:** If the answer is "Culturally" (Case 1), you must explicitly signal the gap between the cultural understanding and clinical reality within the text.

  #### Phase 3: Agency and Reduction (The "Who")
  **Q3: Does the character have a goal unrelated to their condition?**
  *   **Sufficient Answer:** "Yes, they want to win the competition/escape the town/find the treasure. The condition complicates this."
  *   **Rewrite/Cut Signal:** If their only goal is "manage symptoms" or "be understood," you are writing a case study, not a novel. **Rewrite** to give them external agency.
  *   **Handoff Point:** If the character is minor (Case 2), they need less agency, but they cannot be *defined solely* by the symptom.

  #### Phase 4: Harm & Reception (The "So What")
  **Q4: If a vulnerable reader mimics this character's relationship with the label, what happens?**
  *   **Sufficient Answer:** "They might seek help," or "They will recognize their experience and feel less alone."
  *   **Rewrite/Cut Signal:** If the answer is "They will self-diagnose incorrectly," or "They will view treatment as dangerous/unnecessary," you have a liability. You do not need to sanitize the struggle, but you must show the *consequence* of the error.
  *   **Mandatory Sensitivity Read:** If the risk here is "High" (e.g., DID, Suicide, ED), this character **must** be the one you spend your budget on. No exception.

  ---

  ### Part 2: Decision Matrix (Where the Buck Stops)

  | If the Audit Reveals... | Action Required | Who Decides? |
  | :--- | :--- | :--- |
  | **Label is decorative** | Cut the label. Keep the behavior. | **You.** (No debate.) |
  | **Label is metaphorical but uses real terminology** | Decouple the label. Make the condition fictional or vague. | **You & Editor.** (Values call: is the metaphor worth the confusion?) |
  | **Label is central to plot (Looping Effect)** | Keep, but nuance the outcome. **Assign Sensitivity Reader.** | **Editor.** (Budget allocation.) |
  | **Depiction relies on stereotypes for brevity** | Rewrite. | **You.** |
  | **Ambiguity on clinical accuracy** | If high-stakes condition: Sens Reader. If low-stakes: Research. | **You.** |

  ---

  ### Part 3: Running the Audit on Your Three Characters

  Here is the honest application of the protocol to your specific examples. I am going to be blunt about where this will hurt.

  #### 1. The Self-Diagnosing Teenager (DID / Looping Effect)
  *   **Phase 1 (Necessity):** The label is the point. **Pass.**
  *   **Phase 2 (Accuracy):** You are depicting the *cultural* understanding (online) vs. clinical reality. **Pass, conditionally.** You must ensure the text distinguishes between "What TikTok says DID is" and "What a clinician says DID is," even if the narrator doesn't realize the difference yet.
  *   **Phase 3 (Agency):** Does she want something other than integration or diagnosis? If her entire arc is "Do I have this?", you risk defining her solely by the pathology. **Warning.**
  *   **Phase 4 (Harm):** **CRITICAL.** DID is currently subject to massive online misinformation and contagion effects. A vulnerable reader mimicking this narrator could induce genuine distress or identity fragmentation.
  *   **Verdict:** **This character consumes your entire sensitivity reader budget.**
      *   *The Unpleasant Truth:* You cannot run this alone. The "looping effect" is your theme, but if you depict the self-diagnosis as *correct* without clinical friction, you are validating misinformation. If you depict it as *incorrect* without empathy, you are invalidating real sufferers. A sensitivity reader with lived experience of DID (specifically navigating diagnosis) is non-negotiable.
      *   *Action:* Do not cut the plot. But you must write "circuit breakers" into the text—moments where the narrative voice or other characters hint that the online definition might be incomplete, without gaslighting the narrator.

  #### 2. The Minor Character (Textbook OCD / Warmth)
  *   **Phase 1 (Necessity):** Why do they have OCD? If it's to make them "endearing" (e.g., color-coding books), **FAIL**.
      *   *The Unpleasant Truth:* "Warmth" is often a code word for "harmless quirk." OCD is not a quirk; it is distressing intrusive thoughts neutralized by rituals. If you have written "cute quirks," you are perpetuating stigma that minimizes the disorder.
  *   **Phase 2 (Accuracy):** You say "textbook." Does that mean intrusive thoughts + compulsions? Or just neatness?
  *   **Phase 3 (Agency):** As a minor character, they don't need a full arc, but they cannot be a prop.
  *   **Verdict:** **Rewrite or Cut.**
      *   *Action:* If the "OCD" is used to make them likable (e.g., "He was so OCD about the plans, it saved us!"), cut the label. Keep the attention to detail. If you keep the label, you must show the *distress*, not just the order.
      *   *Budget:* Since you are spending the sens reader on the Narrator (Case 1), you must handle this via rigorous secondary research. If you cannot depict the distress without making the character "unwarm," drop the label.

  #### 3. The Metaphorical Blend (Invented Condition)
  *   **Phase 1 (Necessity):** It serves the metaphor. **Pass.**
  *   **Phase 2 (Accuracy):** You are blending symptoms from real conditions. **FAIL.**
      *   *The Unpleasant Truth:* You cannot blend symptoms of real disorders and give it a real name (or a name that sounds real). If you blend Schizophrenia and Dissociation and call it "The Fog," that's fantasy. If you call it "Schizophrenia," that is misinformation.
  *   **Phase 3 (Agency):** N/A.
  *   **Phase 4 (Harm):** High risk of readers mapping this onto real conditions and misunderstanding them.
  *   **Verdict:** **Decouple the Label.**
      *   *Action:* You have two choices.
          1.  **Make it Fictional:** Do not use real DSM terminology. Invent a term or keep it vague ("the episodes," "the static"). This protects real patients.
          2.  **Make it Accurate:** Pick *one* real condition and stick to its actual symptom profile.
      *   *Editor Handoff:* This is a values call. Is the metaphor strong enough to justify the confusion? Your editor needs to weigh if the artistic gain outweighs the clinical muddying. I recommend making the condition fictional.

  ---

  ### Part 4: Where the Procedure Stops and Values Begin

  The procedure can tell you if you are being factually inconsistent or using labels as decoration. It **cannot** tell you if the story is *worth* the risk.

  **The Value Judgment Handoff (You + Editor):**
  1.  **The Cost of Ambiguity:** In Case 1 (The Narrator), you are intentionally depicting confusion. The procedure says "Add circuit breakers." The *value* question is: How much clarity do you owe the reader vs. how much fidelity do you owe the narrator's confusion? If you clarify too much, you break the POV. If you clarify too little, you risk harm. Your editor must help you find the line where the *reader* knows the narrator might be wrong, even if the *narrator* doesn't.
  2.  **The "Warmth" Trap:** In Case 2 (OCD), the procedure says "Show distress." The *value* question is: Does showing distress ruin the tone of the scene? If yes, you must cut the label. You cannot prioritize tone over the reality of a disability.
  3.  **The Metaphor:** In Case 3 (Blend), the procedure says "Decouple." The *value* question is: Does the metaphor lose its punch if you remove the real-world anchor? If the answer is yes, you have to decide if that punch is worth the potential misrepresentation.

  ### Summary of Instructions for Your Weekend

  1.  **Assign the Budget:** Your sensitivity reader **must** review the Narrator (Case 1). Do not split the budget. Case 1 is the highest risk and the core of the book.
  2.  **Fix Case 3 Immediately:** Remove real diagnostic labels from the blended condition. Make it fictional. This costs you nothing but protects you from factual critique.
  3.  **Audit Case 2 for "Quirkification":** Search for instances where the OCD symptoms are played for likability or convenience. Rewrite them to show internal cost, or remove the label entirely.
  4.  **Draft the "Circuit Breakers" for Case 1:** Ensure there are moments in the text where the *narrative structure* implies the online diagnosis might be a coping mechanism rather than a biological fact, without invalidating the narrator's pain.

  **Final Honest Note:**
  You are writing about Hacking's looping effects. You know that by writing this book, you are participating in the loop. You cannot control how readers use the book. But you can control whether you hand them a map that leads to a cliff or a map that shows where the cliffs are. The procedure above ensures you are drawing the cliffs, even if the character chooses to walk near them.
