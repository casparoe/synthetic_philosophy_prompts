      *   The second biggest is between (1)/(3) [Determinism] and (4) [Fair Blame].
      *   The "Unifying Revision" is to embrace **Compatibilism** fully: The veto *is* a routine, but that doesn't make it less real. Fairness is about capacity, not metaphysical origin.
      *   Confidence: High on the tensions, Medium on the "fix" because it depends on how much the user values the *feeling* of (2).
