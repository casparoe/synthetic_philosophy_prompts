answer: |-
  Based on your classmate's track record, she is operating as a **welfarist, anonymous, expected-utility maximizer** in fixed populations. Her verdicts in cases (1) through (4) are perfectly consistent with **Classical (Total) Utilitarianism** (maximizing the sum of utilities). However, because all her past cases held population size ($N$) constant, her behavior is also mathematically consistent with **Average Utilitarianism** and **Critical-Level Utilitarianism**. In fixed populations, maximizing $\sum u_i$, $\frac{1}{N}\sum u_i$, and $\sum (u_i - c)$ yields identical ordinal rankings.

  Here is the breakdown of the rules compatible with her record, their predictions for the variable population cases, and an analysis of her methodological claim.

  ### 1. The Compatible Rules and the Parameterized Family

  There are at least three distinct social welfare functions that fit her fixed-population data exactly. Two of them belong to a single one-parameter family.

  *   **Rule 1: Total Utilitarianism (TU).**
      *   **Formula:** $W = \sum_{i=1}^N u_i$.
      *   **Status:** This is the most straightforward reading of her "unweighted sum" verdicts.
  *   **Rule 2: Average Utilitarianism (AU).**
      *   **Formula:** $W = \frac{1}{N} \sum_{i=1}^N u_i$.
      *   **Status:** In fixed $N$, maximizing the average is equivalent to maximizing the total. Her data cannot distinguish this from TU.
  *   **Rule 3: Critical-Level Utilitarianism (CLU).**
      *   **Formula:** $W = \sum_{i=1}^N (u_i - c)$, where $c$ is a critical utility level.
      *   **Status:** If $c=0$, this collapses into Total Utilitarianism. If $c > 0$, lives must exceed $c$ to add positive value. In fixed $N$, $\sum (u_i - c) = \sum u_i - Nc$. Since $N$ and $c$ are constant in her past cases, this is ordinally equivalent to TU.

  **The One-Parameter Family:**
  **Critical-Level Utilitarianism** constitutes the family, parameterized by the critical level $c \ge 0$.
  *   **Total Utilitarianism** is the specific member where $c = 0$.
  *   **Positive Critical-Level Utilitarianism** covers members where $c > 0$.
  *   (Note: Average Utilitarianism is *not* a member of this family; it is a distinct functional form, though it behaves similarly to a CLU with a very high or population-dependent critical level).

  ### 2. Predictions for the New Cases

  **Case A: The Addition**
  *Current:* Two people at $(10, 10)$. *Option:* Add a third at $5$, resulting in $(10, 10, 5)$.
  *   **Total Utilitarianism:** **Add.** (Sum increases from 20 to 25).
  *   **Average Utilitarianism:** **Reject.** (Average drops from 10 to $8.33$).
  *   **Critical-Level ($c$):** **Add if $c < 5$; Reject if $c > 5$.** (The new person adds $5 - c$ to social value).

  **Case B: The Replacement**
  *Current:* Two people at $(10, 10)$. *Option:* Replace them with one person at $15$.
  *   **Total Utilitarianism:** **Keep the Pair.** (Sum 20 is better than Sum 15).
  *   **Average Utilitarianism:** **Replace.** (Average 15 is better than Average 10).
  *   **Critical-Level ($c$):** **Replace if $c > 5$; Keep if $c < 5$.**
      *   *Math:* Option Value ($15 - c$) > Current Value ($20 - 2c$) $\iff c > 5$.

  ### 3. A Further Case to Separate Them

  To distinguish between these rules (and pin down the parameter $c$ if she is a Critical-Level Utilitarian), you need a case where the utility of the added person falls between the current average and the critical threshold.

  **Proposed Case:** A two-person society at $(10, 10)$ with the option to admit a third person at utility **7**.
  *   **Total Utilitarian:** **Add.** (Sum rises 20 $\to$ 27).
  *   **Average Utilitarian:** **Reject.** (Average falls 10 $\to$ 9).
  *   **Critical-Level ($c=5$):** **Add.** ($7 > 5$).
  *   **Critical-Level ($c=8$):** **Reject.** ($7 < 8$).

  This case separates Average Utilitarianism from Total Utilitarianism. It also allows you to test for the specific critical level: if she accepts utility 7 but rejects utility 4, her critical level lies between 4 and 7.

  ### 4. Does the Veil of Ignorance Settle It?

  **No.** Her appeal to the veil of ignorance **merely relocates the choice** rather than settling the extension to variable populations.

  The veil of ignorance argument relies on maximizing expected utility: $E[U] = \sum p_i u_i$. In fixed populations, the "impartial observer" assumption sets $p_i = 1/N$ for all $i$, which justifies the unweighted sum (or average).

  In variable populations, the math of the veil is clear, but the **ontology of the veil** is not. You must define the set of individuals over whom the probability distribution is spread:
  1.  **Actualist Veil:** If the observer assumes they will definitely exist but doesn't know *who* they are in the *resulting* society, the probability of being any specific person is $1/N_{result}$. This yields **Average Utilitarianism**.
  2.  **Possibilist Veil:** If the observer assumes they might be *any possible person* (including those who might not exist in some outcomes), and assigns equal probability to each "possible slot," this yields **Total Utilitarianism** (or Critical-Level, depending on how non-existence is valued).

  Her statement—"equal chance of being anyone **in the society**"—is ambiguous. Does "the society" refer to the specific outcome being evaluated (favoring Average), or the set of all potential members across all outcomes (favoring Total)? Her fixed-population record hides this ambiguity. To predict her verdict, you must ask her whether the veil covers merely possible people or only actual ones. Without that clarification, the veil argument is consistent with all three rules identified above.
