prompt: |-
  Before I take a side in the fights breaking out at our local historical society, I want the spec for what a theory would even have to deliver. The situation: our museum covers a region with a real communal story about itself -- how the town was founded, who "really" settled the valley, a beloved account of a mill strike that the archival record doesn't support in several particulars -- and a new director wants to "correct the record" in the exhibits while the old-timers are furious. Rather than wing it, I want the desiderata: what any adequate theory of when collective memory should defer to the historical record (and when it shouldn't) has to get right. The cases it must handle, the distinctions it can't collapse, the things it can't contradict -- with the reasoning behind each requirement, and a flag on any pair of requirements you suspect can't be jointly satisfied, because that's the part I most want to see.

  Some cases and complications I'd want on the list, though add your own: memory that later turned out to be right when the record was wrong or thin -- Indigenous oral histories in Australia describing coastlines from thousands of years ago that match what we now know about sea-level change, or residential school survivors' accounts that outpaced the official archive for decades; memory that's wrong in detail but carrying content the archive never bothered to record (the archive itself being written by the people with the filing cabinets, i.e., the winners and the tax collectors); a founding myth that's archeologically false but functions as the actual glue holding the community together; state "memory laws" where the supposed record is itself curated by whoever holds power; and the distinction between flat factual error (wrong date, wrong number of dead) and selective emphasis, which might not be an error at all.

  Distinctions I'd especially not want collapsed: epistemic deference (what we say happened) vs. symbolic or practical function (what the community does with the story); a memory being false vs. a memory being told for different purposes than a chronicle; the difference between correcting a community's memory and correcting its keepers -- whether deference is owed to the record or to the people harmed by the error. And it has to be usable by people like me, not just by theorists: it should tell a museum board or a school district something actionable about an exhibit label, not just pronounce from 30,000 feet.

  So: give me the requirements with the case behind each, mark which are non-negotiable and which are just one camp's prejudice (is "the record always wins on matters of fact" a requirement or a slogan?), and identify the pair or set of desiderata that no theory can satisfy at once. If you think the whole framing presupposes something contestable -- like that there's a clean line between "the memory" and "the record" -- say so early, but still give me the list under the framing. Then, briefly, how three rough stances do against it: archive supremacy (the record always wins on facts), memory primacy (the story is identity-constituting and not answerable to archives), and whatever reconciliation view you find least bad. Keep the weight on the criteria, I'll do the scorecard myself at the next board meeting. No need for citations or reading lists, I want the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Provide a set of desiderata (requirements/criteria) for a theory of collective memory vs. historical record.
      *   **Context:** A local historical society/museum dispute. New director wants to "correct the record" (prioritize archives); old-timers want to preserve communal stories (prioritize memory).
      *   **User's Role:** Mediator/Board member/Community stakeholder looking for actionable criteria, not just abstract theory.
      *   **Specific Constraints:**
          *   Must handle specific cases (Indigenous oral history, survivor accounts vs. official archive, functional founding myths, state memory laws, factual error vs. selective emphasis).
          *   Must maintain specific distinctions (epistemic vs. symbolic function, false vs. different purpose, correcting memory vs. correcting keepers).
          *   Must be actionable (usable for exhibit labels/policy).
          *   Must identify non-negotiable requirements vs. partisan slogans.
          *   **Crucial:** Identify the *tragic trade-off* (the pair/set of desiderata that cannot be jointly satisfied).
          *   Must critique the framing if necessary (memory vs. record dichotomy) but still provide the list.
          *   Must evaluate three stances: Archive Supremacy, Memory Primacy, Reconciliation View.
          *   No citations/reading lists. Focus on reasoning.

  2.  **Deconstruct the Framing (Memory vs. Record):**
      *   The prompt asks to challenge the "clean line" between memory and record.
      *   *Insight:* Archives are not neutral; they are curated memories of the powerful. Oral history is a record of a different kind.
      *   *Action:* Acknowledge this upfront but proceed with the requested framework to ensure utility.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   I need to create a list of requirements that a good theory must meet.
      *   *Requirement 1: Epistemic Integrity.* Can't just lie. If we know something is factually wrong, we can't present it as fact. (Case: Mill strike numbers).
      *   *Requirement 2: Functional Validity.* Some stories work socially even if factually shaky. (Case: Founding myth).
      *   *Requirement 3: Archival Skepticism.* The "record" isn't god. (Case: Residential schools, Indigenous oral history).
      *   *Requirement 4: Harm Mitigation.* Correcting memory shouldn't re-traumatize or erase marginalized voices. (Case: Survivors vs. State).
      *   *Requirement 5: Actionability.* Must translate to label text or tour guide scripts.
      *   *Requirement 6: Distinction Maintenance.* Must separate "what happened" from "what this means to us."

  4.  **Identifying the "Tragic Trade-off" (The Impossible Pair):**
      *   This is the core intellectual challenge.
      *   *Candidate A:* Total Epistemic Accuracy vs. Total Social Cohesion. (Too obvious).
      *   *Candidate B:* Archival Skepticism (Requirement 3) vs. Epistemic Integrity (Requirement 1).
      *   *Refinement:* The tension is between *Corrective Justice* (fixing the record to help the harmed) and *Communal Autonomy* (letting the community define itself).
      *   *Better Refinement:* **The "Truth-Telling vs. Community-Glue" Paradox.**
      *   *Specific Conflict:* You cannot simultaneously satisfy **Desideratum: Epistemic Transparency** (labeling myths as myths) and **Desideratum: Constitutive Continuity** (allowing the myth to function as identity glue without qualification). If you label it "myth," it stops working as "truth." If you leave it unlabelled, you violate transparency.
      *   *Alternative Conflict:* **Archival Skepticism** vs. **Factual Stability.** If you discount the archive too much (because it's biased), you lose the ability to correct *anyone*. If you trust it too much, you enforce power structures.
      *   *Selection:* The strongest tension is between **Epistemic Integrity** (don't assert falsehoods as facts) and **Functional Sovereignty** (allow the community to use stories for cohesion even if factually dubious). You can't fully have both.

  5.  **Categorizing Requirements (Non-negotiable vs. Partisan):**
      *   *Non-negotiable:* Do no harm (to marginalized), distinguish fact from meaning, acknowledge archival bias.
      *   *Partisan:* "The record always wins" (Archive Supremacy), "The story is sacred" (Memory Primacy).

  6.  **Evaluating the Three Stances:**
      *   *Archive Supremacy:* Fails Archival Skepticism and Harm Mitigation. Good for facts, bad for justice.
      *   *Memory Primacy:* Fails Epistemic Integrity. Good for cohesion, bad for truth.
      *   *Reconciliation (The "Third Way"):* Needs to be specific. "Contextualized Pluralism." Acknowledge the conflict *in the exhibit*.

  7.  **Refining the Output Structure:**
      *   **Preamble:** Challenge the framing (Record != Truth, Memory != Falsehood).
      *   **The Spec (Desiderata):** Numbered list with Case, Reasoning, and Status (Non-negotiable/Partisan).
      *   **The Impossible Joint Satisfaction:** Clearly highlight the conflict.
      *   **Stance Evaluation:** Brief scorecard for the three views.
      *   **Actionable Advice:** How to write the label.

  8.  **Drafting Content - Specific Considerations:**
      *   *Indigenous Oral History:* This proves memory can be *more* accurate than the "record." So "Record Wins" is dead on arrival as a universal rule.
      *   *Mill Strike:* Archive says X, Memory says Y. Maybe Y is about *feeling* exploited, not the specific date.
      *   *Founding Myth:* If it's archaeologically false but socially vital, do we debunk it?
      *   *State Memory Laws:* This shows the "Record" can be weaponized.
      *   *Distinction:* Fact (1890) vs. Meaning (We are a town of strikers).

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I identify the impossible pair clearly?
      *   *Check:* Is it actionable? (Need to ensure the "Reconciliation" view gives a concrete example of an exhibit label).
      *   *Check:* Did I avoid academic jargon? (Keep it board-room ready).
      *   *Check:* Did I address the "Record vs. Memory" framing critique? (Yes, in the preamble).

  10. **Final Polish:** Ensure the tone is neutral, analytical, and direct, matching the user's request for a "spec." (Avoid being too preachy about the "right" answer, focus on the *criteria* for judging).

  *(Self-Correction on the "Impossible Pair"):* I need to make sure this isn't just "Truth vs. Lies." It needs to be deeper. It's about *Authority*. Who decides? If the community decides, they might choose falsehood. If the archive decides, it might choose oppression. The impossible pair is **Democratic Legitimacy** (the community owns its story) vs. **Epistemic Accountability** (the story must answer to evidence). You can't fully satisfy both if the community *wants* a story the evidence contradicts.

  Let's refine the "Impossible Pair" to: **Constitutive Autonomy** (The community's right to define itself via narrative) vs. **Public Truth-Telling** (The museum's duty to not propagate known falsehoods).

  Okay, ready to write.

  *(Final check on constraints)*: "No need for citations." "Keep the weight on the criteria." "Flag any pair... you suspect can't be jointly satisfied." "Say so early" regarding framing.

  Let's assemble.cw
answer: |-
  ### Preamble: The Framing Problem
  You asked for a spec based on the tension between "collective memory" and "the historical record." I need to flag immediately that this dichotomy is the source of half your trouble. "The Record" is not raw truth; it is a curated collection of documents, usually generated by institutions (tax collectors, police, corporations) with specific incentives. "Memory" is not just fantasy; it is data transmitted socially, often filling gaps the record ignored.

  However, since you need a tool for a board meeting, I will use your framing but annotate it with this caveat: **The spec must treat "The Record" as evidence, not verdict, and "Memory" as testimony, not just sentiment.**

  Below are the desiderata for any theory that hopes to resolve your museum dispute without burning the building down.

  ---

  ### The Spec: Desiderata for a Theory of Memory vs. Record

  #### 1. The Epistemic Integrity Requirement
  *   **The Case:** The mill strike. The archive says 50 workers; memory says 500. The archive says no violence; memory says shots fired.
  *   **The Requirement:** A theory cannot permit the museum to assert as *fact* something that has been demonstrably falsified by robust evidence, unless explicitly qualified as belief or tradition.
  *   **Reasoning:** If a museum loses its reputation for truthfulness, it loses its authority to speak on *anything*, including the things the archive got wrong.
  *   **Status:** **Non-negotiable.** (Unless you want to be a theme park, not a museum).

  #### 2. The Archival Skepticism Requirement
  *   **The Case:** Residential school survivors vs. government logs; Indigenous oral history vs. colonial maps.
  *   **The Requirement:** A theory must account for the possibility that the "record" is incomplete, biased, or actively deceptive, and that memory may preserve accurate data the record excluded.
  *   **Reasoning:** "The Record" is often the memory of the powerful. Treating it as infallible re-enacts the original exclusion.
  *   **Status:** **Non-negotiable.** (To ignore this is to side with the victors by default).

  #### 3. The Functional Validity Requirement
  *   **The Case:** The founding myth. Archaeology says the founder wasn't a hero; the town says he was. The story glues the community together.
  *   **The Requirement:** A theory must distinguish between a story's *factual accuracy* and its *social utility*. It must explain why a story might be retained even if factually shaky, provided its function is acknowledged.
  *   **Reasoning:** Communities run on meaning, not just chronology. Destroying a functional myth without replacing its social function can cause civic collapse.
  *   **Status:** **Non-negotiable.** (Museums serve living communities, not just dead facts).

  #### 4. The Harm Mitigation Requirement
  *   **The Case:** State "memory laws" or archives that erase minority suffering.
  *   **The Requirement:** When "correcting the record" inflicts specific harm on a marginalized group (e.g., denying a trauma they experienced), the theory must prioritize the mitigation of that harm over the neatness of the archive.
  *   **Reasoning:** Truth-telling that retraumatizes the vulnerable without serving a greater public good is ethical vandalism.
  *   **Status:** **Non-negotiable.** (Ethical floor).

  #### 5. The Distinction Maintenance Requirement
  *   **The Case:** A plaque saying "Founded in 1850" (Fact) vs. "Founded on the spirit of liberty" (Meaning).
  *   **The Requirement:** A theory must provide a grammatical or curatorial mechanism to separate *claims about the world* (dates, numbers) from *claims about value* (heroism, identity).
  *   **Reasoning:** Collapsing these turns every factual correction into an identity attack.
  *   **Status:** **Non-negotiable.** (This is the primary tool for de-escalation).

  #### 6. The "Record Always Wins" Slogan (Partisan)
  *   **The Case:** The Director's current stance.
  *   **The Requirement:** (Proposed by one side) On matters of factual dispute, the archival document overrides oral testimony.
  *   **Reasoning:** Provides a clear decision rule.
  *   **Status:** **Partisan Prejudice.** (Fails Archival Skepticism and Harm Mitigation. See: Indigenous coastlines, residential schools).

  #### 7. The "Story Is Sacred" Slogan (Partisan)
  *   **The Case:** The Old-Timers' stance.
  *   **The Requirement:** (Proposed by one side) The community's self-understanding cannot be externally corrected.
  *   **Reasoning:** Protects community autonomy.
  *   **Status:** **Partisan Prejudice.** (Fails Epistemic Integrity. Leads to denialism).

  ---

  ### The Impossible Joint Satisfaction (The Tragic Trade-Off)

  Here is the conflict you cannot solve, only manage. No theory can simultaneously satisfy **Desideratum 3 (Functional Validity)** and **Desideratum 1 (Epistemic Integrity)** in cases where the *function* of the memory depends on its *falsity being hidden*.

  *   **The Conflict:** For a founding myth to act as "glue" (Functional Validity), it often needs to be accepted as *literally true* by the believers. If you satisfy Epistemic Integrity by labeling it "Myth/Tradition" on the exhibit panel, you degrade its function as "Truth/History," potentially breaking the glue. If you satisfy Functional Validity by leaving the label unqualified, you violate Epistemic Integrity.
  *   **Why it's unsolvable:** You cannot have a story that is simultaneously "known to be factually dubious by the institution" and "accepted as literal fact by the community" without the institution lying by omission.
  *   **The Consequence:** Any solution will leave someone feeling betrayed. Either the truth-tellers feel the museum is lying, or the traditionalists feel the museum is attacking their identity. The goal is not to solve this, but to make the trade-off explicit.

  ---

  ### Evaluation of Three Stances

  Here is how the three common approaches score against the spec above.

  #### 1. Archive Supremacy ("The Record Wins")
  *   **Performance:**
      *   Passes: Epistemic Integrity (mostly).
      *   Fails: Archival Skepticism, Harm Mitigation, Functional Validity.
  *   **Verdict:** **Unsafe for your context.** It treats the archive as neutral, which history shows it rarely is. It will correctly fix the mill strike numbers but will likely erase the *reason* the numbers were misremembered (e.g., the feeling of exploitation). It solves the factual problem by creating a social one.
  *   **Board Room Risk:** High. Looks like elitism. Ignores the Indigenous/Survivor precedent.

  #### 2. Memory Primacy ("The Story Is Identity")
  *   **Performance:**
      *   Passes: Functional Validity, Harm Mitigation (for the majority group).
      *   Fails: Epistemic Integrity, Archival Skepticism (ironically, by treating memory as infallible).
  *   **Verdict:** **Intellectually bankrupt.** It turns the museum into a shrine. It cannot handle the case where memory is *wrong* about harm (e.g., denying a massacre happened). It protects the old-timers but alienates younger generations and external scholars.
  *   **Board Room Risk:** High. Looks like denialism.

  #### 3. Contextualized Pluralism (The Reconciliation View)
  *   **The Stance:** The exhibit displays the *conflict* itself. It presents the archival data, presents the communal memory, and explains *why* they diverge.
  *   **Performance:**
      *   Passes: Epistemic Integrity (states the facts), Archival Skepticism (questions the record), Functional Validity (honors the story's role), Distinction Maintenance (separates fact from meaning).
      *   Fails: **The Impossible Joint Satisfaction.** It admits the tension rather than resolving it. It requires more wall space and more cognitive load from the visitor.
  *   **Verdict:** **Least Bad.** It treats the discrepancy as part of the history. The history of the town includes the history of *how the town remembers itself*.
  *   **Board Room Risk:** Moderate. It satisfies no one completely but gives everyone a seat at the table.

  ---

  ### Actionable Output: The Exhibit Label Test

  To make this usable for your board, apply the **Contextualized Pluralism** view to a draft label.

  **Bad (Archive Supremacy):**
  > "Contrary to local legend, only 50 workers participated in the 1912 strike. No shots were fired."
  > *Critique:* Violates Functional Validity. Humiliates the community.

  **Bad (Memory Primacy):**
  > "In 1912, 500 brave workers stood up to the mill owners in a fiery strike."
  > *Critique:* Violates Epistemic Integrity. Lies to the public.

  **Acceptable (Contextualized Pluralism):**
  > "Local tradition remembers the 1912 strike as a uprising of 500 workers involving gunfire. While company records and police logs indicate fewer participants and no shots fired, historians note that the scale of the memory reflects the genuine intensity of the hardship faced by families in this valley. The story remains a central pillar of the town's identity, regardless of the archival count."
  > *Critique:* Satisfies Integrity (gives the numbers), Skepticism (acknowledges records are one side), Validity (honors the identity), and Distinction (separates count from meaning).

  ### Summary for the Board
  1.  **Reject the Binary:** The archive is not "Truth" and memory is not "Lie." Both are sources with biases.
  2.  **Adopt the Spec:** Use the 5 Non-negotiable Desiderata above to vet any exhibit proposal.
  3.  **Accept the Trade-off:** Acknowledge that you cannot perfectly preserve the myth's power while correcting its facts. You must choose to be a forum for understanding the *difference*, not a court issuing a verdict.
  4.  **Watch the Power:** If "correcting the record" only silences the less powerful, stop. If "preserving memory" only protects the privileged, stop.

  If the new Director cannot sign onto **Archival Skepticism**, they are unfit for a modern museum. If the Old-Timers cannot sign onto **Epistemic Integrity**, they are asking for a shrine, not a museum. Your job is to find the narrow path where the label tells the truth about the facts *and* the truth about the feeling.
