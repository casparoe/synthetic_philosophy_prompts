  1. Your structural claim (3) clashes directly with your contingency claim (4), as claiming inevitability denies the possibility of a boring constitutional monarchy outcome.
  2. The materialist view (1) conflicts with the idealist view (2) only if you assume interests preclude sincerity, but actors can sincerely hold ideas that conveniently serve their class.
  3. You are absolutely allowed to write Robespierre as sincere because belief (2) explains the Terror's psychology while materialism (1) explains its social base.
  4. The cheapest revision is softening (3) to say revolutions tend to eat moderates under threat rather than any revolution must, preserving your contingency argument.
  5. I am highly confident in this audit overall, though I am least sure about my second point regarding the reconciliation of sincerity and interest.
