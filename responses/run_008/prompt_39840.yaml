          *   Content: Identify tensions between the beliefs, resolve apparent tensions, suggest cheapest revision, address the Robespierre question.

  2.  **Analyze the Input Beliefs:**
      *   (1) Materialist/Base: Fiscal collapse/class interest drove it; Enlightenment language was ex post facto justification.
      *   (2) Idealist/Superstructure: Terror driven by ideology (virtue vs. corruption); Jacobins were sincere.
      *   (3) Structuralist: Revolutions structurally eat moderates under threat (inevitability within context).
      *   (4) Contingency: It was deeply contingent (Varennes, war vote); could have been a constitutional monarchy.
      *   (5) Great Man/Individual: Individual character (vanity, fear) moved events.

  3.  **Identify Tensions:**
      *   (1) vs. (2): Materialism vs. Idealism. If (1) says language was just justification for interests, does (2) saying they *sincerely believed* contradict that? Not necessarily. People can sincerely believe ideas that align with their interests, or believe ideas that override interests. But (1) suggests cynicism ("picked up after the fact"), while (2) suggests sincerity ("sincerely believed"). This is a potential tension.
      *   (3) vs. (4): Structural inevitability vs. Contingency. (3) says "any revolution... eats its moderates" (structural/inevitable), while (4) says "one different call... no Terror at all" (contingent/avoidable). This is the strongest tension. If it's structural, contingency matters less. If it's contingent, the structural claim is weakened.
      *   (1) vs. (5): Structural/Material forces vs. Individual Agency. (1) suggests broad forces (fiscal/class), (5) suggests specific vanity/fear moved events. These can coexist (agency within structure), but need balancing.
      *   Robespierre Question: Can he be a sincere believer given (1)? Yes, if (1) applies to the *movement's origins* or *class basis*, while (2) applies to the *psychology of the Terror*. The tension is between "justification for interests" and "sincere belief."

