          *   *Silence:* The idea that there is a "true" fixed parameter out there independent of our knowledge (Bayesians see parameters as random variables).

      *   **Propensity:**
          *   *Core:* Probability = Physical tendency/disposition of a situation to produce an outcome.
          *   *Actuarial Fit:* Risk characteristics (construction class, protection class, territory). The idea that a brick building has a lower "propensity" to burn than a wood frame.
