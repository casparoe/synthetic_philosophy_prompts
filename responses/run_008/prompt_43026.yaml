      *   *Settled Meta-Ontology:* Agreeing on a framework (e.g., Carnapian frameworks).
      *   *Change in Question:* Shifting from "Do numbers exist?" to "What role does mathematical discourse play?"
      *   *Argument against progress:* If the disagreement is rooted in fundamental philosophical temperaments (rationalist vs. empiricist), progress in the sense of "resolution" is impossible. But *dissolution* or *clarification* is progress.

