  The light came on inside the **kitchen**.
  It was a gray and wet **Tuesday**.
  One lace untied upon the **shoe**.
  Steam rising from the mug of **coffee**.
  Hand reaching out to touch the **door**.
  Sound of heavy falling **rain**.

  Outside the window fell the **rain**.
  Inside the warmth of the **kitchen**.
  No one stood waiting by the **door**.
  Calendar marked the day **Tuesday**.
  Cold dregs left in the cup of **coffee**.
  Foot slipping into leather **shoe**.

  Weight distributes through the **shoe**.
  No single drop commands the **rain**.
  No sediment remains in **coffee**.
  No ghost resides within the **kitchen**.
  No marked spot upon the **Tuesday**.
  Yet gravity pulls shut the **door**.

  Hand pushes hard against the **door**.
  Step fits inside the **shoe**.
  Time moves past the **Tuesday**.
  Street reflects the falling **rain**.
  Light goes out within the **kitchen**.
  Cold settles on the **coffee**.

  Bitter taste of cold **coffee**.
  Locked from the outside **door**.
  Empty now the **kitchen**.
  Worn sole of the **shoe**.
  Stopped at last the **rain**.
  Silence ends the **Tuesday**.

  Calendar says **Tuesday**.
  Stain on the table from **coffee**.
  Puddle left by **rain**.
  Key left inside the **door**.
  Pair placed by the **shoe**.
  Darkness fills the **kitchen**.

  I am the point of **kitchen** on **Tuesday**.
  I balance **shoe** and spilled **coffee**.
  I pull the **door** against the **rain**.

  ***

  **Note on the Text**

  This poem commits to the reading that the self is real but abstract, akin to a center of mass, rather than an illusion to be debunked. The third stanza denies the existence of a "ghost" or "marked spot" (a concrete entity inside the head), yet affirms that "gravity pulls"—meaning the posited point has causal efficacy and organizational reality. The envoi confirms this by introducing the "I" only after the concrete details have established a pattern; the "I" is not an additional item in the list, but the locus around which the list coheres.

  The poem takes a liberty regarding narrative unity. It assumes that these fragmented moments (the shoe, the coffee, the rain) naturally converge into a single life that can be organized by a center of gravity. Some philosophers argue that a life need not have narrative unity to be someone's life, suggesting that the demand for a coherent story is itself a fiction. Here, however, the form insists that the recurrence and reordering of these concrete elements *create* the unity they describe.
