  **Variant A: The Donut Decision**
  At St. Jude's Hospital, the IT committee must choose between two equally competent patient record systems, "MediTrack" and "HealthLog." The tie-breaker occurs when the MediTrack sales rep happens to bring fresh donuts to the Tuesday meeting, while the HealthLog rep is stuck in traffic; the well-fed committee votes for MediTrack out of mild, immediate goodwill. Six months later, a senior doctor realizes HealthLog has a slightly better interface for her specific department. Because both systems use open, standardized data formats and the hospital hasn't yet invested in deep training, she petitions to switch. The administration agrees, the data migrates in a weekend, and the hospital moves to HealthLog with minimal cost or disruption.

  **Variant B: The Standard Trap**
  At St. Jude's Hospital, the IT committee must choose between two patient record systems. "MediTrack" is objectively superior, but "HealthLog" is already used by 90% of the region's insurance partners and specialist referral networks. The committee doesn't really choose; the pressure to maintain compatibility with external payers and referral sources makes HealthLog the only viable option, regardless of internal preference. Five years later, a new system emerges that is cheaper and faster than HealthLog. However, switching now would require retraining three hundred staff members, rewriting years of archived data, and risking temporary incompatibility with insurance payers. The hospital stays with HealthLog, not because they like it, but because the cost of leaving is prohibitive.

