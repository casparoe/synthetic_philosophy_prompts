answer: |-
  Here is the diagnosis.

  First, your intuition is correct: this is not merely a verbal dispute about the definition of "theft." If it were, D. would have conceded the semantic point and moved on. Instead, D. pivoted to a moralized definition ("taking without consent"). This confirms the disagreement is substantive. However, your hypothesis that the fight is *only* about whether property rights are prior to the state is slightly incomplete. It is more specific than that.

  The structural engine of this stalemate is what I call **The Baseline Incompatibility.**

  You and D. are not disagreeing about the *act* of taxation (both agree money is taken). You are not even disagreeing primarily about the *morality* of coercion (both agree coercion needs justification). You are disagreeing about the **counterfactual baseline** used to measure the taking.

  ### The Diagnosis

  To call something "theft," you must establish a baseline of ownership that exists *before* the taking occurs.
  *   **Your Baseline (Constitutive):** Property rights are constituted by the legal system. The "bundle of rights" exists only because the state enforces it. Therefore, the state defines the size of the bundle *ex ante*. Taxation is simply the state defining the bundle as "income minus 30%," not taking 30% of a pre-existing "100%."
  *   **D.'s Baseline (Pre-political):** Property rights arise from labor, occupancy, or natural law *before* the state enters the picture. The state is a secondary agent that might protect these rights or violate them. Therefore, the bundle exists *ex ante*, and taxation removes a piece of it.

  **The Structural Flaw in D.'s Position**
  Here is where the diagnosis gets sharp. D. is attempting to hold two incompatible metaphysical views simultaneously, and this is why you circled for an hour.

  1.  **When you raised the land analogy** (you didn't consent to existing land claims), D. argued that **property is conventional.** He admitted that without a system of rules, his claim to the land would be void. This supports *your* constitutive view.
  2.  **When you raised the bundle-of-rights argument** (the state defines the bundle), D. argued that **property is pre-political.** He claimed the state lacks the power to define the bundle. This supports a Natural Rights view.

  D. is engaging in **Selective Conventionalism.** He wants property to be conventional enough to explain why he can't squat on your lawn (relying on state rules), but natural enough to explain why the state can't tax his income (relying on pre-state rights).

  **The Structural Flaw in Your Position**
  To be fair, your final move also contributed to the circle. When you said taxation "defines the bundle smaller from the start," D. correctly identified that this **begs the question.** You are assuming the state has the authority to define the bundle to prove the state has the authority to take from the bundle. To a Natural Rights theorist, this is like saying, "The burglar didn't steal your TV, because the burglar defined the bundle of your property rights as 'everything except the TV' before he entered."

  So, the stalemate is not just D. being inconsistent; it is that **you are speaking two different ontological languages.** You are speaking Legal Positivism (rights come from law); D. is speaking Lockean Naturalism (rights come from nature/labor). When these two frameworks collide, "progress" is impossible unless one framework is abandoned or bridged.

  ### Is Progress Possible?

  Yes, but not if you keep talking about taxation. As long as the topic is taxation, D. will treat the money as "his" by default, and you will treat it as "regulated" by default. You will never agree on the baseline.

  To make progress, you must **shift the debate to the origin of property.** You need to force D. to resolve his Selective Conventionalism.

  **The Thought Experiment: The Private Security Agency**
  Stop talking about the state. Ask D. this:

  > "Imagine a society with no government, only private property and private security agencies. I hire a security agency to protect my property. You hire one to protect yours. My agency decides that to protect my property effectively, they need to charge you a fee for 'neighborhood stability.' They come to your house and demand 30% of your income. If you refuse, they use force to take it.
  >
  > In this scenario, is that theft?"

  **Why this works:**
  1.  **If D. says "Yes, that's theft":** Then the issue isn't "consent" or "taking." It's about *who* has the right to define the terms of protection. You can then ask: "What makes the State's claim to that money different from the Private Agency's claim? Is it just that the State is a monopoly?" This moves the debate to *political legitimacy* rather than property metaphysics.
  2.  **If D. says "No, that's not theft" (because the agency provides a service):** Then he admits that coercive taking can be legitimate if it secures the conditions for property. You can then ask: "At what percentage does it become theft? 30%? 90%? Who decides?" This forces him to admit there is a *conventional* line somewhere, undermining the "taxation is theft" absolute.
  3.  **If D. says "That agency has no right to charge me":** Then you press the land analogy again. "Why does the agency have no right, but the historical accumulation of land ownership (which you admitted was conventional) does?" This forces him to confront his Selective Conventionalism.

  ### The Verdict

  Is this debate structurally doomed to circle forever?

  **No, but it is doomed if you stay on the slogan.**

  The slogan "Taxation is Theft" is a **conversation stopper**, not a conversation starter. It is designed to bypass the hard work of political philosophy by smuggling in a conclusion (property is pre-political) inside a premise (taking is theft).

  **Your Action Plan:**
  1.  **Drop the semantic argument.** You already won that point (D. admitted legal theft ≠ tax). Don't go back.
  2.  **Drop the bundle-of-rights argument for now.** It triggers D.'s "begging the question" alarm because it assumes state sovereignty.
  3.  **Attack the Baseline.** Tell D.: "We are disagreeing about what you own *before* the taxman arrives. You think you own 100% of your labor by nature. I think you own whatever the rules of cooperation say you own. We cannot argue about taxation until we argue about why you own anything at all."

  If D. is willing to argue about the **origin of property rights** (Locke vs. Hume vs. Hegel), you can make progress. If D. refuses to engage on property theory and insists "it's just obvious," then the debate *is* doomed, because he is relying on an intuition he will not examine.

  **Final word:** You suspected the fight was about whether property is prior to the state. You were right. But the specific mechanism of the stalemate is D.'s refusal to apply his conventionalism consistently. Expose that inconsistency, and the slogan collapses.
