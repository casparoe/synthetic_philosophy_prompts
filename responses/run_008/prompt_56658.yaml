answer: |-
  There is a hollow space inside my **head**,
  where morning light assaults my tired **eyes**.
  I live in terror of the **forgetting**.
  So I reach out to touch the leather **pages**,
  I cap the pen and let the black **ink** dry,
  the museum address among the **entries**.

  I check the **entries** before I leave the room.
  It saves me from the static in my **head**.
  A marriage of the neuron and the **ink**.
  The street outside is blurred before my **eyes**.
  I turn the worn and familiar **pages**.
  This ritual wards off the **forgetting**.

  Without this aid, there would be only **forgetting**.
  Inga has her biology, I have **entries**.
  But functionally, we both consult our **pages**.
  The information rests within my **head**,
  or so it seems, as verified by **eyes**.
  The truth is fixed permanently in **ink**.

  It matters not if stored in blood or **ink**,
  so long as I am saved from **forgetting**.
  The world flows in through open **eyes**,
  and settles into structured **entries**.
  There is no border at the surface of the **head**.
  The mind extends across these **pages**.

  I feel the texture of the **pages**,
  smoother now than the stain of **ink**.
  They are a prosthetic for the **head**,
  or perhaps the cure for **forgetting**.
  I scan the **entries** like a memory.
  The street signs register within my **eyes**.

  I trust the data seen by **eyes**.
  I trust the data on the **pages**.
  There is no difference between these **entries**
  and what is written in the **ink**,
  versus the fear of **forgetting**.
  The museum exists inside the **head**.

  My **eyes** read the **ink** as if it were blood.
  No **forgetting** hides between these **pages**.
  These **entries** constitute the **head**.
