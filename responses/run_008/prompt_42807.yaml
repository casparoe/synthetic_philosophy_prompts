          2.  Principle of Bivalence (PB): $P$ is true now or $\neg P$ is true now.
          3.  Principle of Necessity of Truth (NPT): If $P$ is true, it is necessarily true (in the sense that it can't be false *given that it is true*). *Wait, this is tricky.* The fatalist argues: If it is *now true* that $P$, then $P$ *must* happen.
