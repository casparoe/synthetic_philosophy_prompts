answer: |-
  Dear Friend,

  It is excellent that you are probing these details rather than accepting the summary at face value, because your intuition about the determinism issue is exactly right. Your friend has given you a version of the argument that is intelligible and captures the spirit of the impossibility claim, but it contains several significant inaccuracies that would indeed make a specialist in Strawson's work wince. The most glaring error is the claim that Galen Strawson's position is the same basic position as his father, P. F. Strawson, worked out in more detail. In the landscape of free will debates, they are actually diametrically opposed. P. F. Strawson, in his famous essay Freedom and Resentment, argued that the metaphysical question of determinism is irrelevant to our practices of blame and praise because these practices are grounded in unavoidable human reactive attitudes like resentment and gratitude. He was effectively defending a form of compatibilism by changing the subject from metaphysics to psychology. Galen Strawson, by contrast, argues that the metaphysical requirement for moral responsibility is impossible to meet, regardless of our psychology. To say they hold the same position is like saying a architect and a demolitions expert are in the same business because they both work on buildings.

  Your friend's summary also leans too heavily on the idea that heredity and environment are the culprits fixing our character, which suggests the argument relies on determinism being true. This is the source of your confusion, and it is where the summary distorts Galen Strawson's actual view. The Basic Argument is designed to be immune to the truth or falsity of determinism. Strawson's point is not merely that our past determines our present, but that the very concept of ultimate moral responsibility requires something logically impossible, namely that you be the cause of yourself. To be truly responsible for your actions, you must be responsible for the mental nature from which those actions flow. But to be responsible for that mental nature, you must have chosen it based on some prior mental nature. This launches a regress. You would need to have chosen your own character, but you could only make that choice based on the character you already had. To avoid this, you would need to be causa sui, or the cause of yourself, which Strawson argues is logically incoherent. Nothing can be the ultimate cause of itself because you would have to exist prior to yourself in order to bring yourself into existence.

  This is why the argument works even if determinism is false. If indeterminism is true, then some events in your decision-making process are random or uncaused. But randomness does not grant control; it merely introduces luck. If a choice pops into your head without being determined by your character or reasons, that does not make you more responsible for it; it makes it less yours. So, whether the chain of events leading to your action is determined by the past or interrupted by random noise, you still cannot meet the requirement of being the ultimate originator of your own nature. Your friend's summary treats the argument as if it were van Inwagen's Consequence Argument, which does rely on determinism to show that our actions are consequences of the past and laws of nature. Strawson's Basic Argument is deeper and more skeptical; it claims that even if you could break the chain of determinism, you still wouldn't have the kind of control required for true moral responsibility. The barrier is not causal determination, but the logical impossibility of self-creation.

  Regarding the practical conclusion your friend drew, there is another layer of nuance that is often missed. Strawson does conclude that ultimate moral responsibility is impossible, which means that no one ever truly deserves blame or praise in the basic desert sense. However, he is careful about what follows from this in practice. While he agrees that retributive punishment based on desert is unjustified, he does not necessarily argue that a rational society would abandon all forms of blame or punishment outright. He acknowledges that human beings may not be able to simply switch off their reactive attitudes even after accepting the metaphysical argument. We might know intellectually that no one is ultimately responsible, yet still feel resentment when harmed. Furthermore, Strawson often distinguishes between responsibility as a metaphysical status and responsibility as a practical tool for social regulation. He might agree that we should stop punishing people because they deserve to suffer, but he could allow for quarantine or rehabilitation measures to protect society, provided we are clear that these are not justified by the offender's moral guilt. Your friend's claim that we should abandon blame and punishment rests on the idea that recognizing the metaphysical mistake automatically changes our practices, but Strawson is often more pessimistic about our ability to live according to that recognition.

  So, to bring this together, your friend was right to identify the regress about self-creation as the core mechanism, but wrong to tie it exclusively to determinism and wrong to align Galen with his father. The argument is that the condition for responsibility is impossible to satisfy in any possible world, determined or not. The practical upshot is that basic desert is an illusion, but this does not automatically entail the elimination of all punitive practices, only the elimination of the justification that people fundamentally deserve to suffer for their choices. It is a subtle but important distinction, one that moves the debate from how the universe works to what we can coherently demand of each other. I hope this helps clarify the landscape for you, as you have spotted the exact pressure point where the popular summary fails to capture the philosophical rigor of the original argument.

  Warmly,

  Your Philosophical Correspondent
