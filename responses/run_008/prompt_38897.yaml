answer: |-
  This is a classic and deeply frustrating philosophical stalemate. You are holding the line for **Scientific Realism with Verisimilitude**, and your friend is wielding the **Logicist/Anti-Realist** critique.

  You asked for honesty, so here it is: Your intuition is the engine of science, but your friend has the better logical argument *unless* you are willing to make a massive, controversial metaphysical commitment that most modern philosophers of science try to avoid.

  Here is the breakdown of what counts against your specific view (that an objective relation *exists*, even if we haven't formalized it yet), ranked from fatal to awkward.

  ### 1. The Fatal Defeater: Language Dependence is Not Just a Popper Problem
  You are hoping that Miller's result is a bug of Popper's specific content-based definition, and that a "similarity" or "possible worlds" approach will fix it. **It generally does not.**

  The problem isn't just about counting true/false consequences (Popper's mistake). The problem is about **metrics on logical space.** To say Theory A is "closer" to Truth T than Theory B is to say that $Distance(A, T) < Distance(B, T)$. But distance requires a geometry. Geometry requires coordinates.

  If you describe the world in terms of `Temperature` and `Pressure`, Theory A might be closer. If you describe the exact same physical state in terms of `Temperature` and `Inverse-Pressure` (or some gerrymandered function like `Tempurature = Temp + Pressure`), the distance metric changes. Unless the universe comes with a "Preferred Basis" (a set of fundamental predicates that are *the* right ones to use), "closeness" is not an intrinsic property of the theories; it is a relation between the theories *and* the language used to describe them.

  **Why this is fatal to your view:**
  You claim there is an "objective fact of the matter." If the fact flips based on whether we use Celsius or Fahrenheit (or more complex logical transformations), then the fact is not objective; it is relative to the conceptual scheme.
  *   **The Only Way Out:** You must commit to **Metaphysical Realism about Natural Kinds.** You have to argue that the universe *itself* dictates the correct vocabulary (e.g., "mass" is a natural property, "mass-plus-charge" is not). If you believe the world has a "carved at the joints" structure that privileges certain predicates, you can block Miller's result.
  *   **The Cost:** Most philosophers of science find this metaphysically bloated. If you aren't willing to say "The universe prefers these specific logical primitives," then your friend is right: closeness is hostage to notation.

  ### 2. The Severe Defeater: The "Retreat to Intuition" (Unfalsifiability)
  You wrote: *"I figure the similarity-measure people... will eventually find a measure that isn't hostage to vocabulary."*

  This is the most dangerous part of your position. It risks turning verisimilitude into a **God-of-the-gaps argument for logic.**
  *   **The Charge:** If 60 years of the brightest logicians (Popper, Tichý, Miller, Niiniluoto, Oddie, Zwart) have failed to produce a definition that satisfies basic invariance conditions, the burden of proof shifts to you to explain *why* we should think such a thing exists.
  *   **Is it a Category Error?** No. Demanding a formalization for a claim about "objective facts" and "logical relations" is not a category error. It is a demand for coherence. If you claim $X$ exists in logical space, you must be able to specify the geometry of that space.
  *   **Is it Unfalsifiable?** Yes. "There exists a valid measure $M$" is hard to falsify until $M$ is specified. But in philosophy, a claim that cannot be articulated after decades of trying is functionally empty. It becomes a matter of faith, not argument.

  **Verdict:** This doesn't prove you *wrong*, but it makes your position **rationally optional.** You are betting on a future solution to a problem that looks increasingly like an impossibility proof.

  ### 3. The Awkward Defeater: Pessimistic Meta-Induction (PMI)
  You asked if PMI counts as evidence the "march toward truth" is wrong.
  *   **Direct Impact:** PMI (Laudan) argues that past successful theories were false, so current ones are likely false. This doesn't directly kill verisimilitude. You can say, "Yes, they were false, but they were *less false* than their predecessors." (This is the standard Realist defense, often coupled with Structural Realism).
  *   **Indirect Impact:** However, combined with Language Dependence, PMI becomes sharper. If we can't define "closeness" without privileging a vocabulary, and past theories used *different vocabularies* (e.g., phlogiston vs. oxygen, caloric vs. thermodynamics), then we can't even compare their truthlikeness coherently. You can't say Oxygen Theory is closer than Phlogiston Theory if the terms don't map onto the same logical space in a stable way.

  **Verdict:** PMI alone is manageable. PMI + Language Dependence is a pincer movement that squeezes the Realist hard.

  ### 4. The Manageable Defeater: Lack of Current Formalization
  You asked if you need a working formalization to be respectable.
  *   **The Defense:** Philosophers often work with intuitive concepts before they are formalized (e.g., causation, probability). You can argue verisimilitude is a primitive concept.
  *   **The Weakness:** Probability and causation eventually got formalisms (Kolmogorov, Pearl, etc.). Verisimilitude is unique because it has *impossibility results* surrounding it, not just a lack of consensus. Claiming "the math just isn't done yet" when the math suggests the task is incoherent is a weak defense.

  **Verdict:** This is merely awkward. You can hold the view without the math, but you can't use the math to defend the view yet.

  ---

  ### The Ranking of Defeaters

  1.  **Fatal:** **Language Dependence without Natural Kinds.** If you cannot explain why the universe privileges one vocabulary over another, "objective closeness" is an illusion. This is the napkin drawing your friend showed you. It generalizes to almost all distance measures.
  2.  **Severe:** **The "Future Solution" Retreat.** Asserting a solution exists despite decades of failure and impossibility theorems makes the view unfalsifiable and dogmatic.
  3.  **Awkward:** **Pessimistic Meta-Induction.** It doesn't kill the concept, but it severs the link between empirical success and truthlikeness, leaving you with a "march toward truth" that is undetectable in practice.
  4.  **Manageable:** **Lack of Formalism.** You can be a realist about a concept that is hard to define, but you lose argumentative leverage.

  ### Should You Fold?

  **If you are a Humean or an Empiricist about laws:** **Yes, fold.**
  If you believe laws of nature are just summaries of regularities and there is no "deep structure" to the universe, then Miller is right. There is no privileged vocabulary. Therefore, there is no objective distance. Your view is untenable.

  **If you are a Metaphysical Realist:** **You can hold, but at a high cost.**
  You can maintain your view *only if* you argue that the world has an intrinsic structure that validates certain predicates (Natural Kinds) as "real" and others as "gerrymandered." If `Temperature` is a real property of the universe and `Tempurature` is not, then the distance metric is stable.
  *   **The Catch:** You now have to defend Natural Kind Realism, which is a whole other battlefield. You also have to explain how we epistemic access to the "real" predicates without already knowing the truth (which makes measuring progress circular).

  ### The Honest Verdict

  Your friend is **logically** right, but you are **pragmatically** right.

  *   **Logically:** Without a privileged vocabulary, "truthlikeness" is ill-defined. Your claim that "an objective fact exists" is currently unsupported and faces strong impossibility results. If you cannot point to *why* the coordinates are fixed, the distance is meaningless.
  *   **Pragmatically:** Science *acts* as if Newton is closer than Kepler. We build bridges with Newton; we build GPS with Einstein. The "march" is real in terms of predictive power and domain of applicability.

  **The Compromise:**
  Don't claim there is an "objective fact of the matter" about *metaphysical closeness*. Claim there is an **objective fact about empirical adequacy and structural continuity.**
  Say: *"Newton is not 'closer to the truth' in a metaphysical distance sense, but GR preserves the successful structure of Newtonian mechanics while expanding its domain. Progress is real, but 'truthlikeness' is a shorthand for structural preservation and empirical scope, not a literal distance metric in logical space."*

  If you stick to "There is a literal distance metric and I don't care that it flips with coordinates," you are defending a ghost. If you shift to "There is a real progression of structural capture," you survive the Miller objection.

  **My advice:** Concede the point on "objective distance" (your friend wins that round), but pivot to "structural progress" (you win the war). Don't die on the hill of Verisimilitude formalization; it's a swamp.
