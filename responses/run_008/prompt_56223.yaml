answer: |-
  # Joint Statement on the Possibility of Genuine Moral Dilemmas

  **Collaborators:** [Dilemma Realist] and [Dilemma Skeptic]
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Moral Residue and Conflicting Obligations

  ## I. Agreed Claims

  After reviewing the phenomenology of hard cases and the logical structure of our respective positions, we endorse the following claims as common ground:

  1.  **Phenomenology of Conflict:** We agree that agents in "tragic bind" cases (e.g., Sartre's student, Sophie's Choice) experience intense psychological distress, a sense of inescapable responsibility, and a lasting psychological residue regardless of the choice made. We agree that any adequate moral theory must account for this phenomenology without dismissing it as mere irrationality.
  2.  **The Prima Facie / All-Things-Considered Distinction:** We agree that this distinction is useful for deliberation. We accept that *prima facie* duties are provisional moral reasons that can be outweighed, whereas an *all-things-considered* (ATC) verdict is the final action-guiding conclusion. We disagree only on whether the force of the overridden *prima facie* duty is exhausted once the ATC verdict is reached.
  3.  **"Ought Implies Can" (OIC):** We agree that the principle "If an agent ought to do X, then the agent can do X" is a valid constraint on moral obligations regarding *actions*. We agree that morality cannot coherently demand the performance of a logically or physically impossible *act*. We disagree on whether OIC prohibits conflicting *obligations* (claims on the agent) or merely conflicting *actions* (performances).
  4.  **Regret vs. Guilt:** We agree on the conceptual distinction between these attitudes. **Regret** is a negative response to an unfortunate state of affairs (even if one caused it innocently). **Guilt** is a negative response implying the agent has violated a binding normative standard and is liable to blame (by self or others). Our dispute is not about the definitions, but about which attitude is *warranted* in dilemma cases.
  5.  **Moral Complaints:** We agree that if an agent wrongs a patient, that patient typically holds a legitimate moral complaint (a right to blame, demand apology, or seek restitution). We disagree on whether a patient on the "unchosen branch" of a dilemma retains this standing.

  ## II. Disagreements Table

  The following table isolates the precise points of divergence. Each statement is worded such that the proponent of that view accepts it as an accurate description of their position.

  | Topic | Dilemma Skeptic Position | Dilemma Realist Position |
  | :--- | :--- | :--- |
  | **1. Status of the Unchosen Branch** | Once the ATC verdict is reached, the duty on the unchosen branch is extinguished. The patient on that branch has a claim on the agent's sympathy, but no standing moral complaint regarding the *decision*. | The duty on the unchosen branch persists despite the ATC verdict. The patient on that branch retains a legitimate moral complaint, even if the agent did the "best" they could. |
  | **2. Coherence of "Wrong Either Way"** | The sentence "She wrongs him either way" is incoherent if "wrongs" implies violating an ATC obligation. She acts rightly ATC; therefore, she does not wrong the unchosen party by choosing the other. | The sentence "She wrongs him either way" is coherent and true. Moral requirements can conflict such that satisfying one necessitates violating another binding requirement. |
  | **3. The Nature of the Residue** | The appropriate residue is **Agent-Regret**: sadness that *I* was the cause of this harm, without the admission of culpability. Feeling guilt here is a category error. | The appropriate residue is **Moral Guilt**: an acknowledgment that a binding norm was violated. To feel only regret is to fail to acknowledge the seriousness of the claim left unfulfilled. |
  | **4. Application of OIC** | OIC entails that conflicting ATC obligations are impossible. If I cannot do A and B, I cannot be obligated to do A and B. One obligation must be voided by the impossibility. | OIC applies to *actions*, not *claims*. I cannot *do* both, but I can *owe* both. The impossibility of joint satisfaction creates the tragedy, it does not dissolve the second obligation. |

  ## III. The Cruxes

  We identify two substantive cruxes that drive our disagreement. For each, we have selected a test case or argument that bears on the issue, and we record our divergent predictions below.

  ### Crux 1: The Joint Satisfiability of Moral Requirements
  **The Issue:** Is it a conceptual necessity that the set of all-things-considered moral obligations is jointly satisfiable (consistent), or is consistency only a substantive hypothesis that could fail in extreme circumstances?

  *   **Test Case: The Unknowable Conflicting Promises.**
      *   *Scenario:* An agent promises to meet Person A at noon and Person B at noon in different cities. Due to a deceptive third party, the agent does not know the times conflict until it is too late to cancel. At noon, the agent physically cannot keep both.
  *   **Skeptic Prediction:** At the moment of action, only one promise generates an ATC obligation. The other is overridden by impossibility. The agent has done no wrong ATC and owes no restitution beyond apology for the unfortunate situation.
  *   **Realist Prediction:** Both promises generated binding obligations. The agent is obligated to keep both, even though they cannot. The agent has wronged the person they did not meet and owes restitution (not just apology) because a binding norm was violated.

  ### Crux 2: The Normative Source of the Residue
  **The Issue:** What exactly is the moral residue a response to? Is it a response to the *outcome* (harm caused) or the *violation* (norm breached)?

  *   **Test Case: The Penitent vs. The Tragic Hero.**
      *   *Scenario:* Consider two agents in identical dilemma scenarios. Agent X feels deep guilt and seeks penance. Agent Y feels deep sorrow (regret) but insists, "I did the right thing; I have nothing to be guilty about."
  *   **Skeptic Prediction:** Agent Y is morally healthier and more rational. Agent X is suffering from unnecessary moral distress based on a false belief that they violated a duty. Agent X's guilt is a mistake.
  *   **Realist Prediction:** Agent X displays a deeper moral understanding. Agent Y is morally deficient for failing to acknowledge the claim of the unchosen branch. Agent X's guilt is the rational, fitting response to the moral remainder.

  ## IV. Note on Verbal Dispute

  We acknowledge that a portion of our dispute is verbal, specifically regarding the definition of **"Obligation"** (or "Ought").

  *   **The Verbal Component:** The Skeptic reserves the term "Obligation" strictly for the *winning* verdict of practical deliberation (the ATC "ought"). The Realist uses "Obligation" to describe *binding normative claims* that may persist even when they lose the deliberative contest.
  *   **Why This Does Not Dissolve the Dispute:** If this were *merely* verbal, we would agree on the normative facts once we standardized our terminology. We do not. Even if we agree to call the Skeptic's view "ATC Obligation" and the Realist's view "Pro Tanto Obligation with Residue," the Skeptic maintains that the "Pro Tanto" claim leaves no *liability to blame* (guilt) once overridden. The Realist maintains it *does* leave liability to blame. Therefore, the disagreement about the **legitimacy of guilt** and the **standing of the patient's complaint** remains substantive, regardless of how we label the "oughts."

  ***

  **Signed,**

  _________________________ (Dilemma Realist)

  _________________________ (Dilemma Skeptic)
