answer: |-
  The espresso machine hissed, marking the midpoint of the morning break. Deirdre stirred sugar into her cup while Bernard leaned against the hallway wall, arms crossed.

  **Deirdre:** You looked unconvinced during the Q&A. Specifically about the derivation.

  **Bernard:** I looked unconvinced because I am. The decision-theoretic proof is elegant, Deirdre, but it feels like a shell game. You want to derive probability from certainty, and the only way to do it is to smuggle probability into the axioms.

  **Deirdre:** That's the standard objection. But let's move past slogans. Consider the **asymmetric splitter**. We have an input state. In Mode A, it decoheres into two branches: weights 2/3 and 1/3. In Mode B, it decoheres into a thousand branches: one with weight 1/2, and 999 others summing to 1/2. Suppose I'm offered a payoff of $100 on the "heavy" outcome in Mode A, and $100 on the single heavy outcome in Mode B. Otherwise, nothing.

  **Bernard:** Okay. In Mode A, one future self gets $100, one gets nothing. In Mode B, one future self gets $100, 999 get nothing.

  **Deirdre:** Precisely. Now, if you were the agent, which mode would you choose to activate?

  **Bernard:** If I'm following the Born rule, I choose Mode A. The expected utility is higher. 2/3 versus 1/2.

  **Deirdre:** Right. And my claim is that a rational agent *must* choose Mode A. Not because she expects one outcome over another—she knows both outcomes occur in both cases—but because rational preference over future selves must track the Hilbert space norm. If she preferred Mode B, she would be violating the axioms.

  **Bernard:** Here's where the circularity bites. Why *must* she track the norm? In Mode B, there are 999 distinct, subjectively distinguishable successors experiencing disappointment. In Mode A, only one. If I care about my future selves, why shouldn't the sheer multiplicity of disappointed selves weigh on my decision? You forbid this via the **Branching Indifference** axiom. You say rational agents shouldn't care about the number of branches.

  **Deirdre:** Because "number of branches" isn't a physical fact. It's gauge-dependent. I can tweak the apparatus in Mode B to split the 999 low-weight branches into 999,000 branches without changing the physical setup appreciably. If your rationality depends on that engineering detail, you're vulnerable to money pumps based on nothing but decoherence granularity.

  **Bernard:** I concede the point about granularity. I'm not a naive branch-counter. I know decoherence is a matter of degree. But that concession doesn't save you; it deepens the problem. If branch count is ill-defined, then appealing to it is indeed irrational. But you haven't shown why *amplitude* is the correct measure of "how much" a future self exists. You've only shown that *counting* is wrong.

  **Deirdre:** I'm not appealing to amplitude as a measure of existence. I'm appealing to it as a measure of *care*. Think of it classically. If I implement a coin flip using a single circuit, or a thousand-fold redundant circuit that computes the same flip, my rational preference between heads and tails shouldn't change. The redundancy is descriptive, not ontological.

  **Bernard:** That analogy is loaded. In the classical case, there's a fact of the matter about whether the coin lands heads. The redundancy is irrelevant because the outcome is unique. In Everett, the "redundancy" *is* the ontology. Those 999 successors in Mode B are physically distinct. They aren't re-descriptions; they're different people with different brain states. To say they "don't count" more than the single successor in Mode A is to assume exactly what you're trying to prove: that amplitude, not identity, dictates value.

  **Deirdre:** But if you grant that identity isn't the metric—because, as you said, branch count is ill-defined—then you need *some* metric to distinguish rational from irrational preferences. Without the Born weights, you have no constraint. You could prefer Mode B simply because you like the number 1,000. My axioms—additivity, continuity, dominance—are just the requirements for diachronic consistency. If I prefer $X to $Y now, I shouldn't prefer a future version of me who prefers $Y to $X, unless the physical situation changed.

  **Bernard:** I'll grant you consistency is necessary. But consistency doesn't fix the measure. I can be perfectly consistent while caring about the number of successors, provided I define "number" via some coarse-graining scale. Your derivation works only because you impose **Branching Indifference** as a constraint. You say, "Assume the agent doesn't care about branching structure, only payoffs and weights." Then you derive that she must care about weights.

  **Deirdre:** It's not an assumption; it's a dominance principle. If two acts produce the same physical rewards on the same weight distribution, they are the same act. Splitting a branch into two sub-branches of equal weight doesn't change the physical reward structure. If an agent cares about that split, she cares about a distinction that makes no difference to the local physics of her successors.

  **Bernard:** Here's my concession: I agree that if the split makes no difference to the *local physics*, it shouldn't matter. But in Mode B, the split *does* make a difference. There are 999 conscious entities experiencing loss, not one. The local physics of the *group* is different. You're defining "local physics" narrowly enough to exclude the multiplicity of observers.

  **Deirdre:** And I concede that if multiplicity were a well-defined observable, you'd have a point. But it's not. You can't write down an operator for "number of branches." So when you say "999 conscious entities," you're relying on a folk ontology that breaks down under scrutiny. If I refine the decoherence basis, those 999 become 10,000. Did the moral weight suddenly increase?

  **Bernard:** No. Which is why I can't rely on counting. But nor can I rely on your solution. You say the moral weight stays constant because the amplitude stays constant. But why? You've replaced an ill-defined integer count with a continuous measure, but you haven't justified why *that* measure tracks rational care. You've simply asserted that amplitude is the only thing that survives the coarse-graining limit.

  **Deirdre:** It's not an assertion. It's the only quantity invariant under unitary transformations that preserve the payoff structure. If you demand rationality be invariant under harmless re-descriptions of the branching process, the Born rule drops out.

  **Bernard:** "Harmless re-descriptions." There it is. To you, splitting a branch is a re-description. To me, it's creating more people. Your axiom of Branching Indifference isn't a neutral requirement of rationality; it's a metaphysical claim that amplitude is the only thing that realness-cash-out into.

  **Deirdre:** *[Pauses, sips coffee]* I'll concede this: Branching Indifference is the heavy lifter. It's not self-evident like modus ponens. It's a substantive claim about what matters in personal identity over time in a branching universe. If you reject it, the derivation fails.

  **Bernard:** And I'll concede this: I can't offer a coherent alternative metric. I can't demand branch counting because I agree it's ill-defined. So I'm left with a dilemma: either accept your axiom and get the Born rule, or reject it and have no theory of probability at all.

  **Deirdre:** Exactly. But isn't that progress? We've isolated the disagreement. It's not about the math; the math holds. It's about whether rational agents should treat branching as morally neutral.

  **Bernard:** It's about whether the axiom is a requirement of reason or a disguised premise. You argue it's necessary to prevent irrational sensitivity to hardware details. I argue it's only necessary if you've already decided that amplitude is the sole carrier of value.

  **Deirdre:** So we're stuck on the justification for Branching Indifference.

  **Bernard:** We are. You see it as protecting rationality from gauge variance. I see it as stipulating the conclusion.

  **Deirdre:** Then that's where the seminar needs to focus. Not on whether the derivation works—it does—but on whether that axiom is something a rational agent *must* accept, or merely one she *might*.

  **Bernard:** Agreed. If we can't settle whether branching is a "re-description" or a "multiplication," we can't settle the probability problem.

  **Deirdre:** More coffee?

  **Bernard:** Please. We're going to need it.
