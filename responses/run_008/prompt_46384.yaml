      *   *The Verdict:* It's not just one. It's a "Normative Stalemate." We are trying to use biology to solve a metaphysical/legal problem.
      *   *Prospects for Progress:* Be honest. Conceptual clarity helps, but won't solve the policy conflict. We might need to decouple "death" from "organ harvesting."
      *   *Conclusion:* Don't promise a solution. Promise better questions.

  6.  **Refining the Tone:**
