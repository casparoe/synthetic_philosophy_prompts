answer: |-
  This is a classic debate that cuts to the heart of evolutionary biology methodology, and while both participants raised valid methodological concerns, Maya is substantially more accurate regarding both the specific science of the human chin and the theoretical arguments presented in the Gould and Lewontin paper. To break this down move by move, we have to start with the biology of the chin itself. Dan proposed that the chin is an adaptation for protection or sexual selection, while Maya argued it is a byproduct of jaw shrinking. Current consensus in biological anthropology largely supports Maya here. The human chin, or mental eminence, is unique to humans, but there is little evidence that it serves a protective function; it is actually quite fragile and prone to breaking upon impact, which makes the combat hypothesis weak. Similarly, while sexual selection is always possible, there is no strong correlational evidence linking chin size to reproductive success in the way we see with peacock tails. The leading explanation is indeed developmental: as the human face shortened and the jaw reduced during evolution, the remaining bone at the symphysis was left protruding as a structural consequence rather than being selected for directly. So on the specific empirical claim, Maya is right.

  Moving to the methodological clash about testability and burden of proof, Maya again holds the stronger position relative to the Gould and Lewontin critique. Dan argued that adaptationist stories stick their neck out and are testable, whereas calling something a spandrel is a cheap escape hatch. While it is true that spandrel hypotheses can be misused as conversation-stoppers if not rigorously supported by developmental evidence, Gould and Lewontin's central complaint was exactly the opposite of Dan's claim: they argued that adaptationist stories are too easy to generate and too hard to falsify. Anyone can invent a plausible survival benefit for a trait, but demonstrating that natural selection actually drove the trait's origin requires evidence of heritability, variation, and differential fitness that is often unavailable, especially in paleontology. Maya is correct that the burden of proof lies with the person claiming selection did the work, not with the skeptic to disprove it. Dan's suggestion to measure chin size against interpersonal violence is a valid kind of test, but it assumes the trait is variable and heritable in a way that matches the selection pressure, which is a big assumption. Maya's point that testability is often a bluff in deep time is a recognized limitation in the field, so she wins this round on philosophical accuracy regarding the 1979 paper.

  The most critical part of their exchange, however, was the argument over the San Marco architecture and the definition of exaptation. Dan claimed that because the spandrels in the basilica were filled with deliberate mosaics, the spandrels effectively became adaptations, collapsing the distinction between byproduct and design. This is a fundamental misunderstanding of the architectural metaphor and the biological concept. In the basilica, the spandrels are the triangular spaces left over between the arches supporting the dome. They are structurally inevitable; you cannot have those arches and that dome without creating those spaces. The architects did not build the arches to create the spaces; they created the spaces to support the dome. The mosaics were added later to fill the available space. Dan's argument confuses the current utility (the mosaics) with the origin of the structure (the space). In biology, this maps to the distinction between adaptation and exaptation. A trait can originate as a byproduct (the space) and later be co-opted for a function (the mosaics). Gould and Vrba later coined the term exaptation specifically to prevent the confusion Dan is introducing. Acknowledging that a trait is currently useful does not mean it was selected for originally. Maya is exactly right that exaptation keeps the distinction sharp by separating historical origin from current utility. Dan's claim that the distinction collapses into whatever is currently useful is actually the Panglossian fallacy Gould was warning against, because it assumes that current utility explains historical origin.

  Overall, Maya comes out ahead in this debate. She correctly represents the scientific consensus on the chin, she accurately defends the burden of proof as outlined in the Spandrels paper, and she correctly interprets the architectural metaphor and the concept of exaptation. Dan raised a useful point about the need for spandrel hypotheses to be evidence-based rather than just assertions, which is a fair critique of how some researchers misuse Gould's ideas, but his theoretical understanding of adaptation versus exaptation was flawed. He fell into the trap of assuming that function implies design, which is the precise error the reading group session was supposed to illuminate. While Dan's instinct to demand testability is good scientific practice, his application of it here relied on a misunderstanding of evolutionary history, whereas Maya successfully defended the nuance that historical constraints matter just as much as current utility.
