  Two guys in my evolution reading group got into it after our session on the Gould–Lewontin spandrels paper, and I got dragged in as referee and honestly couldnt follow the later rounds. The topic was the human chin. Dan said the chin is obviously an adaptation — jaws took hits in fights for most of human history, so a protruding bone at the front of the mandible protects you, or maybe it's sexual selection like a peacock's tail. Maya said that's exactly the Panglossian storytelling Gould and Lewontin were making fun of: the chin is a spandrel, a byproduct of the jaw shrinking during development in a way that happens to leave bone sticking out at the bottom, and calling it an adaptation is a just-so story. Dan said hang on, "it could be a byproduct" is even cheaper than an adaptation story — you can tell a spandrel story about literally any trait, so at least the adaptationist story sticks its neck out and can be tested, you can go measure whether chins are bigger in populations with more interpersonal violence. Maya said the asymmetry runs the other way — the adaptationist doesn't get to assume function and make the skeptic disprove it, the burden is on whoever claims selection did the work, and paleontology rarely lets you run the decisive test anyway, so "testable" is mostly a bluff. Dan then came back with the architecture itself: he said even Gould's own example betrays him, because the spandrels of San Marco are famous for being filled with gorgeous mosaics — deliberately planned decoration, per the architects' design — so the moment a byproduct gets used it becomes an adaptation again, which is basically what exaptation means, and the distinction collapses into "whatever is currently useful is adaptive." Maya rolled her eyes and said no, exaptation keeps the distinction perfectly sharp: it says the trait's original construction and its current use are two different parts of its history, and that difference is exactly what a pure adaptationist story erases — acknowledging exaptation is conceding Gould's point, not refuting it. Neither would budge and now they both think they won. Can you go through their exchange move by move and say who's right at each point, including whether the San Marco point actually cuts the way Dan thinks it does, and then tell me who comes out ahead overall?

  Please dont use any formatting in your answer — no bullet points, headings, bold, or tables. Just continuous prose, like you'd write in an email.
