prompt: |-
  I'm a clinical ethics consultant at a mid-sized regional hospital — the only one here, so I get about three consults a week, mostly end-of-life stuff and family fights, and I usually have maybe 40 minutes with the chart and the people before someone wants my recommendation. The dominant tool in this job is the principlist four-box thing (autonomy, beneficence, nonmaleficence, justice), and honestly it works fine for the easy cases, but it keeps giving me these sterile write-ups where I've ticked four boxes and I still haven't said anything about the actual relationship in the room, which half the time is what the consult was really about. So I want to try building my practice around care ethics instead, and here's my problem: care ethics seems to be a tradition whose whole point is resisting exactly this — turning moral attention into a checklist. Gilligan and Noddings went on about how the formal justice perspective abstracts away the concrete web of relationships, and Tronto (who I've actually been reading) is the one who worries about care getting degraded when institutions get ahold of it. So asking you for a procedure might be self-defeating. Fine. Tell me whether that's right, and then do it anyway.

  What I want is a decision procedure a person like me can actually run in under an hour, per consult. Use Tronto's phases of care (attentiveness, responsibility, competence, responsiveness — she added a fifth, something like "caring with," later, tell me if that one earns its place in a hospital or is just political-theory decoration). For each step give me: the concrete questions to ask, in order, what a *sufficient* answer looks like vs. a checked-box non-answer, where the procedure terminates with "this is a values call, hand it back to humans" rather than pretending the ethics framework settles it, and how I document it so the ethics committee (mostly principlists, honestly) will sign off without thinking I've gone soft. Be honest about which steps are judgment calls dressed up as procedure — that's allowed, just flag it.

  Then run it on three cases from my actual pile last month, briefly:

  1. A daughter who has been her mother's caregiver for nine years insists we pursue a third round of chemo in the ICU; the mother, when I sit with her alone, keeps saying things like "she's worked so hard for me" and won't state a preference either way. Autonomy says ask the patient, the family dynamic says asking directly is itself a kind of violence. What does my procedure do here.

  2. A guy refusing insulin whose stated reason is that his wife did all the managing of his diabetes and she died three weeks ago and he doesn't see the point. The four-box basically shrugs at this one.

  3. A nurse who keeps bending the ICU visiting hours for the family of a long-term patient and got written up for it. I'm asked to adjudicate. I suspect care ethics tells me to side with the nurse, and I'd like you to run it straight and tell me if that's what comes out, because admin will not like it and I want to know if the theory really commits me or if I'm just using it as cover.

  Also tell me plainly where this procedure will misfire — what kind of consult it handles worse than the four-box does (I'm guessing anything involving an abusive or manipulating family member, where "attend to the relationship" is exactly the wrong instruction), and whether there's a version of your procedure that patches that or whether I should just keep the principlist tool in the drawer next to it.

  One more constraint, and it's hard: under 1100 words total. I know that's tight for four deliverables, but a procedure I can't read between two consults is useless to me, so cut whatever you have to. Typos in mine, so I'll extend you the same grace. Not that you'll need it.
