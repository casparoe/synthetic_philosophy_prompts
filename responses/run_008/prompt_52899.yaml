answer: |-
  You're right: proceduralizing care ethics is oxymoronic. Care is a disposition, not a rule. Tronto warns that institutionalizing care risks emptying it of meaning. But you need institutional legibility to keep your job. This isn't an algorithm; it's a scaffold to force relational attention before you retreat to principles. It will feel sterile sometimes. That's the cost of entry.

  **The Procedure (Tronto's 5 Phases)**

  1.  **Attentiveness**
      *   **Question:** Who is suffering that isn't speaking? (Look beyond the proxy).
      *   **Sufficient:** "Daughter's grief drives request; mother silent out of guilt."
      *   **Box-Check:** "Family consulted."
      *   **Judgment Call:** Distinguishing noise from signal in emotional expression.
  2.  **Responsibility**
      *   **Question:** Who bears the burden, not just the legal right?
      *   **Sufficient:** "Son holds proxy, but daughter provides care."
      *   **Box-Check:** "Proxy verified."
      *   **Judgment Call:** Weighing moral duty against legal authority.
  3.  **Competence**
      *   **Question:** Does this intervention actually meet the need, or just treat the disease?
      *   **Sufficient:** "Chemo extends biology, not relationship."
      *   **Box-Check:** "Medically indicated."
      *   **Termination:** If medical feasibility is zero, stop. Hand back to clinicians.
  4.  **Responsiveness**
      *   **Question:** How does the vulnerable party receive this care? (Assent, not just consent).
      *   **Sufficient:** "Patient withdraws when family present."
      *   **Box-Check:** "Consent signed."
      *   **Termination:** If patient explicitly refuses capacity-assessed care, stop. Hand back to legal.
  5.  **Caring With** (The 5th Phase)
      *   **Question:** Do policies block necessary care?
      *   **Verdict:** Keep it. It's not decoration; it's structural reality. It explains why you can't just "care" harder.
      *   **Sufficient:** "Visiting rules ignore long-term bonds."
      *   **Box-Check:** "Policy cited."

  **Documentation for Principlists**
  Translate care language into principlist headers. Frame "Attentiveness" as "Psychosocial Context." Frame "Responsiveness" as "Assessment of Capacity/Assent." Frame recommendations as "Promoting Beneficence through Relational Support." The committee signs off on "Best Interest," not "Care." If you write "the relationship matters," they hear "soft." If you write "family dynamics impact medical efficacy," they hear "clinical."

  **Case Applications**

  1.  **Mother/Daughter/Chemo:** Attentiveness reveals mother's guilt ("worked hard"). Responsiveness shows silence is protective, not incapacity. Competence asks if chemo serves the relationship. *Outcome:* Procedure terminates at Responsiveness. This is a values call. Recommendation: Pause chemo, family meeting to address daughter's grief, not mother's body. Document as "Unclear Beneficence due to Psychosocial Conflict."
  2.  **Widower/Insulin:** Attentiveness sees grief, not non-compliance. Competence asks if insulin manages life or just biology without his care-network. Responsiveness: He rejects care because it severs tie to her. *Outcome:* Not an ethics violation. Recommendation: Social work to rebuild care network, not ethics coercion. Document as "Capacity Intact; Refusal Based on Personal Values."
  3.  **Nurse/Visiting:** Caring With reveals policy rigidity. Responsibility shows nurse filled institutional gap. *Outcome:* Theory commits you to side with nurse *if* safety isn't compromised. Admin will hate it. Document as "Continuity of Care Supports Patient Stability." Be prepared to fight.

  **Failure Modes**
  Care ethics assumes good faith relationships. It misfires on abuse, coercion, or manipulation. If a family member is exploiting the patient, "attending to the relationship" empowers the abuser. Principlism (Autonomy/Rights) protects boundaries better there. Keep the four-box tool in the drawer for coercion cases. Use Care for conflict, grief, and structural friction. Use Principlism for rights and boundaries.

  **Honesty Check**
  Steps 2 and 5 are judgment calls dressed as procedure. You are deciding whose burden matters and which policies are unjust. The procedure doesn't solve that; it just forces you to admit you're doing it. Don't let the checklist convince you the hard work is done. The hard work is always the conversation.
