  2. Existing vocabulary conflates these cases under labels like 'race to the bottom' or 'multipolar trap,' obscuring the structural difference in payoff matrices that dictates solvability. This conflation fuels unwarranted generalizations about the inevitability of such traps across distinct strategic environments.
  3. Weeks 1-4 will formalize the absolute/positional distinction using game theoretic models, while weeks 5-8 test this against case studies in fiscal competition and advertising. The final stage will draft the typology and assess its implications for political theory.
  4. Success looks like a validated typology showing positional traps resist coordination. However, a deflationary finding that the distinction collapses under dynamic analysis would also advance the field by correcting current assumptions.
  5. Failure would be producing merely a semantic critique without demonstrating how the distinction alters strategic recommendations. It would also fail if it cannot explain why some traps feel fated while others do not.
