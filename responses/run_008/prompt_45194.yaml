prompt: |-
  i write mostly about physics and biology for a general audience, but my editor has me doing a piece that brushes up against philosophy of mind, so I've been reading around. a pop-neuroscience book I grabbed for background sums up eliminative materialism roughly like this: 'Paul and Patricia Churchland argued that as neuroscience matures, it will show that beliefs and desires simply don't exist. They are posits of folk psychology, our everyday theory of why people act, and folk psychology is a theory in exactly the way the phlogiston theory of combustion was a theory -- a bad empirical positing that future science will retire. So we will one day stop saying we believe things, the way we stopped saying the sun rises, and everyday explanations like "she lied because she wanted money" will be replaced by neurochemical ones. Critics replied that the view is self-refuting, since you'd need beliefs to state it, and that pretty much settled the matter.'

  i'm inclined to think the book is roughly on target but I genuinely can't tell, and my article can't afford a howler. go through it for me piece by piece: what would the Churchlands themselves accept, where does the book slide two different things together (it lumps the phlogiston case and the sun-rising case in one breath, and something about that pairing feels off -- those look like very different fates for an old way of talking), and is the self-refutation point the knockout the book makes it out to be, or just one move in a running fight? Also, if you can, tell me what the actual live disagreements are -- I want my article to describe the position the way a defender would recognize it, not a strawman, even if I end up siding with the critics.
