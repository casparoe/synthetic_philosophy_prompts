answer: |-
  You should reject Premise (1) as it stands, because the Principle of Fair Play only generates obligations when the cooperative scheme itself is reasonably just.

  Here is why that step looked plausible, why it must be restricted, and why adding a justice condition isn't the "cheat" you fear it is.

  ### Why Premise (1) Looked Fine
  In the abstract, Premise (1) captures a powerful moral intuition: the wrongness of free-riding. If I join a neighborhood watch where everyone else takes a turn patrolling, and I sleep safely without ever taking a shift, I have treated my neighbors merely as means to my security. I have taken advantage of their restraint. This intuition is so strong that philosophers like H.L.A. Hart and John Rawls initially formulated the principle broadly: if you benefit from a cooperative effort, you owe a return. It feels like a basic requirement of reciprocity, independent of the specific content of the rules.

  ### Why You Must Restrict It
  The problem, as your counterexamples show, is that "cooperation" and "benefit" can exist within exploitative structures. A protection racket is a cooperative scheme among the payers (they all pay to avoid violence), and the gang provides a "benefit" (security). But there is no moral duty to be "fair" to a racketeer. Similarly, a discriminatory state may provide roads and security, but if the scheme systematically excludes a class of people from the benefits of citizenship (like voting), it is not a *fair* cooperative venture.

  If you keep Premise (1) unrestricted, you are claiming that fairness is a purely procedural value—that one can be "fair" within an unjust system. Moral philosophy generally rejects this. You cannot have a duty of *fairness* to uphold an *unfair* arrangement. Therefore, Premise (1) must be amended to read: "If you knowingly accept substantial benefits from a **just** cooperative scheme..."

  ### Is Adding a Justice Condition "Cheating"?
  You suspect that adding "the scheme must be reasonably just" is question-begging—smuggling in the conclusion to save the premise. You are right to be suspicious if the condition is added *ad hoc*. However, most contemporary theorists (following Rawls) argue this condition is **internal** to the concept of fair play, not an external patch.

  Here is why you are wrong to call it cheating:
  1.  **Conceptual Coherence:** The principle is called *Fair* Play. Fairness is a virtue of justice. It is conceptually incoherent to say one has a moral obligation to play "fair" in a game that is rigged to oppress participants. The moral force of "fairness" presupposes a baseline of legitimacy.
  2.  **Mutual Advantage:** A cooperative scheme, in the relevant moral sense, implies a venture for *mutual* advantage. A protection racket is not mutual; it is parasitic. A discriminatory state treats the disenfranchised woman not as a participant but as a resource. If the scheme isn't mutually advantageous in a just way, it fails the definition of the "cooperative scheme" required for Premise (1) to trigger.

  So, you aren't smuggling in a premise to force the conclusion; you are clarifying the conditions under which the principle has moral weight.

  ### Does This Wreck the Fair Play Story?
  Patching the mafia case does not wreck the theory for ordinary cases; it actually saves it from absurdity.
  *   **Ordinary Cases:** In a reasonably just democracy, the condition is met. Citizens receive presumptive goods (security, roads) from a just scheme. The obligation to obey the law (as part of the burden-sharing) remains intact.
  *   **Mafia/Oppression Cases:** The condition is *not* met. The gang scheme is unjust (coercive/exploitative); the discriminatory state is unjust. Therefore, the Principle of Fair Play simply does not apply. The woman does not owe a duty of fairness to comply with her own disenfranchisement.

  ### A Note on Premise (2)
  You should be aware that while restricting Premise (1) solves the "obligation to injustice" problem, Premise (2) remains vulnerable to a different objection (famously raised by Robert Nozick). Nozick argued that benefits can be "thrust upon" you without your consent (e.g., you didn't ask for the roads). If you reject Premise (2) by requiring *voluntary* acceptance, you solve the gang case (coercion negates consent) but you might lose the state case too (since we don't explicitly consent to state benefits).

  However, for the specific problem you raised—avoiding an obligation to obey unjust laws or rackets—modifying Premise (1) is the correct surgical fix. It preserves political obligation for just states while blocking the implication that fairness requires complicity in injustice.
