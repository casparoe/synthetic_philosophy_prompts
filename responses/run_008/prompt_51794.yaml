prompt: |-
  hey, so i'm a phd student writing a chapter on suffering-focused ethics, and i keep hitting the same wall: every case people use against negative utilitarianism runs in one direction -- the NU comes out too willing to accept death or extinction to end suffering (the benevolent world-exploder, switching off a life to stop its misery, that whole genre). i want the reverse for once: a case where the suffering-focused view says *continue* and classical hedonic utilitarianism says *stop*. this is for a section arguing that the distinctive verdicts come from the lexical structure specifically, not from mere suffering-focus, so i need the case to actually isolate that.

  construct a thought experiment in which a lexical negative utilitarian -- the kind that gives absolute priority to suffering above some severity threshold over any amount of milder suffering -- insists on continuing, while a classical utilitarian, just summing the same experiences, says end it. constraints: realistic (a family deciding whether to withdraw life-sustaining treatment in a hospital, no sci-fi, no miracle cures), one paragraph, and the numbers can't be rigged near a tie -- the total suffering of continuing must clearly exceed the total suffering of ending, so the classical utilitarian's verdict has to come out 'withdraw', and robustly. also keep third parties out of it: stipulate the family's welfare doesn't tip either way, i don't want the case decided by grief accounting.

  after the scenario, walk through what each theory says and why, tell me which feature of the case is doing the work, what happens if you drop the lexical threshold (does it collapse back into the usual direction, where NU is the one favoring death?), and how a classical utilitarian would most plausibly attack the case. last thing, and be honest here: can the classical utilitarian get the same verdict just by discounting the final agony for its brevity or responding to its intensity? if so the case isolates duration-vs-severity structure, not the lexical threshold, and i want to know that rather than get a flattering answer.
