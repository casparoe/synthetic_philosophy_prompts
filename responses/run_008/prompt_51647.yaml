      *   *The Meta-Question:* Can I write a speech *for* you that is sincere *for* you? No. I am an AI. I cannot feel. The user must deliver it with their own feeling. I need to explicitly state this limitation in the advice, but provide a text that *allows* for sincerity rather than dictating it. The text must be a vessel, not a performance.

