answer: |-
  You have correctly identified a gap in the standard taxonomy. The phenomenon you are describing is real, documented in fragments, but lacks a single, precise term that captures the *evolutionary* and *systemic* nature of the drift.

  Here is the carving you asked for.

  ### 1. The Existing Neighbors (and why they fail)

  You are right to reject **Goodhart's Law** and the **Streetlight Effect** as complete explanations, though they are adjacent.

  *   **Goodhart's Law:** *"When a measure becomes a target, it ceases to be a good measure."*
      *   **The Mismatch:** Goodhart describes the *corruption of the metric*. In your scenario, the metric (cost per pill) remains accurate. The problem isn't that the number is lying; it's that the number is acting as a filter that prunes away everything that doesn't generate it. Goodhart is about gaming; your pattern is about *attrition*.
  *   **The Streetlight Effect:** *"Searching where the light is."*
      *   **The Mismatch:** This is a cognitive bias of an *individual* searcher. Your pattern is an *ecosystem* adapting to the searcher. The charities aren't just standing under the light; they are moving their factories into the light so they can be seen.
  *   **The McNamara Fallacy:** *"Believing what can be measured is all that matters."*
      *   **The Mismatch:** This is the closest historical term (from Robert McNamara's Vietnam body-count strategy). However, it is usually framed as a *decision-making error* by a leader, not a *selection pressure* that reshapes the market over a decade. It describes the *mindset*, not the *feedback loop*.
  *   **Surrogation:** *"When a substitute measure replaces the actual goal."*
      *   **The Mismatch:** This describes the cognitive swap (caring about the spreadsheet instead of the outcome). It doesn't capture the second-order effect where the *world changes* to fit the spreadsheet.

  ### 2. The Coinage: **Epistemic Gresham's Law**

  If you need a name for the specific dynamic where "precise nonsense drives out vague truth" and the ecosystem evolves to match, I propose **Epistemic Gresham's Law**.

  **Gresham's Law** (economics) states: *"Bad money drives out good."* (When two forms of currency have the same face value but different intrinsic value, people hoard the good money and spend the bad money, removing the good from circulation.)

  **Epistemic Gresham's Law** (your pattern) states:
  > *"In a resource-allocated system, precise but narrow evidence systematically drives out vague but accurate judgment, eventually removing the capacity to pursue high-impact but unmeasurable goals."*

  #### The Definition
  Epistemic Gresham's Law occurs when three conditions are met:
  1.  **Allocation via Proxy:** Resources (money, status, attention) are distributed based on comparative metrics.
  2.  **Asymmetric Precision:** One class of activity (pills) yields high-precision data; another class (policy reform, basic research) yields low-precision data, even if the latter has higher expected value.
  3.  **Selection Pressure:** Actors adapt their behavior to secure resources. Over time, the system selects for actors who optimize the proxy, while actors pursuing the unmeasurable goal starve or restructure until they are merely optimizing the proxy.

  ### 3. The Carving: Boundaries and Edge Cases

  To use this term rigorously, you need to know where it starts and stops.

  #### Boundary A: Epistemic Gresham's Law vs. Goodhart's Law
  *   **The Test:** Did the metric break, or did the domain shrink?
  *   **Goodhart:** The charity starts faking the pill counts. The metric is now useless.
  *   **Epistemic Gresham:** The pill counts are real. But the charity stopped doing malaria prevention research because it couldn't be counted, and now no one knows how to prevent malaria resistance. The metric works, but the *mission* has failed.
  *   **Collapse Point:** If the actors start actively manipulating the data to fit the metric, it collapses back into Goodhart.

  #### Boundary B: Epistemic Gresham's Law vs. Efficient Specialization
  *   **The Test:** Is the drift increasing total value, or just visible value?
  *   **Efficient Specialization:** Funders stop funding vague projects because they are actually low-impact. The ecosystem becomes leaner and more effective.
  *   **Epistemic Gresham:** Funders stop funding vague projects because they are *uncertain*, even though the expected value is higher. The ecosystem becomes "leaner" in data but "poorer" in impact.
  *   **Collapse Point:** If the unmeasurable work is proven to be low-impact, the drift was actually rational optimization, not a bias.

  #### Boundary C: Epistemic Gresham's Law vs. The Streetlight Effect
  *   **The Test:** Is the bias in the *searcher* or the *terrain*?
  *   **Streetlight:** One funder refuses to look at unmeasurable projects.
  *   **Epistemic Gresham:** The *entire field* of researchers stops studying unmeasurable projects because they can't get published/funded, so future funders literally cannot find data on them even if they wanted to.
  *   **Collapse Point:** If the bias disappears when the original funder leaves, it was just Streetlight. If the bias persists because the expertise has been lost, it is Epistemic Gresham.

  ### 4. Why "Epistemic Gresham's Law" Fits Your Description

  1.  **"The Spreadsheet Wins":** This is the "Bad Money" aspect. A model with huge error bars but decimal places (bad epistemic currency) circulates more easily than an expert's intuition (good epistemic currency) because the system is designed to process the former.
  2.  **"No Individual Decision Was Wrong":** This is the market mechanism. Each funder acting rationally (maximizing visible impact) creates a collective irrationality (loss of capacity for invisible impact).
  3.  **"Ecosystem Drift":** This is the "Drives Out" aspect. The unmeasurable work doesn't just get ignored; it gets *extinguished* or *mutated* into something measurable.

  ### 5. Usage in the Wild

  While **Epistemic Gresham's Law** is not yet a dictionary term, it is increasingly used in systems thinking, AI safety, and EA-adjacent critiques to describe exactly this failure mode.

  You will also see it referred to loosely as:
  *   **Metric Fixation** (Jerry Z. Muller's term, more sociological)
  *   **Quantitative Crowding Out** (Economic framing)
  *   **The McNamara Dynamic** (Distinguishing the systemic loop from the individual fallacy)

  **Recommendation:**
  If you are writing or speaking to engineers/systems thinkers, use **Epistemic Gresham's Law**. It conveys the mechanism (bad drives out good), the domain (knowledge/evidence), and the inevitability (a law of motion) without requiring a philosophy degree to parse.

  If you are speaking to economists, use **Metric-Induced Adverse Selection**.
  If you are speaking to managers, use **Surrogation Drift**.

  But for the specific "creepy part" where the system evolves to fit the map? **Epistemic Gresham's Law** is the carve you need.
