answer: |-
  # WIP Seminar Q&A Prep Sheet
  **Topic:** Aesthetic Testimony, Assertion Entitlement, & Moral Parallels
  **Time:** 2 Weeks
  **Audience:** Mixed (Social Epist, Virtue Epist, Aesthetics, Wittgensteinian)

  ### Strategy Note
  Your core tension is separating **knowledge** (which testimony transmits) from **conversational entitlement** (which requires first-hand engagement). The room will try to collapse these back together. Your defense relies on the "Practice" move, which is your strongest shield but also your weakest theoretical flank. Be prepared to concede some theoretical precision to save the phenomenological fit.

  ---

  ### 1. The "Hermit" Objection (The Vacuity Charge)
  **Who:** Sharp Social Epistemologist (or the Virtue Epistemologist)
  **The Vibe:** "If your norm is conversational, what happens when there's no conversation?"
  **The Question:** "You ground the restriction on assertion in the *practice* of aesthetic conversation. But consider a hermit who never speaks to anyone. On your view, is the hermit permitted to defer on everything? If so, your 'practice' constraint isn't a constraint on the agent, it's just a description of social settings. If not, where does the norm come from if not the knowledge state itself?"
  **The 2-Minute Reply:**
  "I'm glad you raised this because it clarifies the scope. I'm not arguing the norm disappears for the hermit; I'm arguing the norm is constitutive of the *role* of an aesthetic judge, not just the act of speaking. Even the hermit, if they are making aesthetic judgments, is participating in a form of life that is inherently shareable. Think of it like promising: you can't promise in a vacuum, but the *obligation* isn't created by the listener, it's created by entering the practice. The hermit who defers on everything isn't 'fine'; they are opting out of the practice of judging altogether. They might *know* the movie is sad, but they aren't functioning as an aesthetic agent."
  **Soft Spot:** This risks sounding ad hoc. If the norm is constitutive of the *role*, does the hermit lose the knowledge too? You need to hold the line that knowledge remains, but *agency* is diminished. If they press on "what constitutes entering the practice," you might wobble.

  ### 2. The "Knowledge Norm of Assertion" Challenge
  **Who:** Social Epistemologist (The Reductionist)
  **The Vibe:** Impatient with "special rules."
  **The Question:** "The standard view is Knowledge is the Norm of Assertion (KNA). If I know $p$ via testimony, I satisfy KNA. You're positing a second, competing norm just for aesthetics (and morals?). Isn't this just an error theory in disguise? Why not just say we *don't* know via testimony in these cases and save the theoretical parsimony?"
  **The 2-Minute Reply:**
  "Because the phenomenology of *knowing* and the propriety of *speaking* come apart here. I can know the train leaves at 5 PM via an app, and I can tell you. But if I tell you 'The ending of *Parasite* is devastating' without seeing it, I feel like a fraud, even if I'm right. If we deny knowledge, we can't explain why I can reason from that premise ('Since the ending is devastating, I should bring tissues'). I need the knowledge to explain the reasoning, but I need the practice-norm to explain the fraudulence. Parsimony is good, but not if it erases the data."
  **Soft Spot:** They will argue that "feeling like a fraud" is pragmatic, not normative. They might claim you're confusing *politeness* with *epistemic entitlement*.

  ### 3. The "Moral Extension" Pushback (The Risky Half)
  **Who:** One of the Aestheticians (The one protective of the domain)
  **The Vibe:** Taking it personally. "Don't drag art down to ethics."
  **The Question:** "You claim moral deference has the exact same structure. But moral stakes involve action and harm. Aesthetic stakes involve appreciation. By lumping them together, aren't you trivializing the moral obligation? If I defer on whether to donate to charity, that's cowardice. If I defer on a movie, it's just boring. Your 'unified theory' flattens something crucial."
  **The 2-Minute Reply:**
  "I'm not flattening the stakes; I'm unifying the *structure of engagement*. In both cases, the deficiency isn't about the truth of the proposition—it's about the relationship to the value at stake. Whether it's a moral value or an aesthetic one, deferring bypasses the engagement that the value demands of us. The *consequences* of moral deference are higher, sure, but the *alienation* from the value is identical. I'm actually elevating aesthetics by saying it demands the same kind of personal integrity as morality."
  **Soft Spot:** They might not *want* aesthetics elevated to morality. They might prefer aesthetic exceptionalism. If they argue that moral values are objective and aesthetic ones aren't, your parallel collapses.

  ### 4. The "Practice" Black Box
  **Who:** Wittgensteinian Emeritus
  **The Vibe:** Smiling, using your weapon against you.
  **The Question:** "You use the word 'practice' to do a lot of heavy lifting. But you treat it like a mechanism—input testimony, output entitlement. But a practice isn't a rulebook. If you have to ask whether you are allowed to speak, you've already misunderstood the practice. Aren't you just theorizing what should be shown?"
  **The 2-Minute Reply:**
  "That's a fair warning. I'm not trying to write the rulebook for the practice. I'm trying to point out where the friction is when we try to theorize testimony. I agree that if you're truly embedded in the practice, you don't consult a rule. But in philosophy, we *are* consulting rules. My claim is that when we step back and analyze testimony, 'practice' is the only category that captures why the knowledge feels inert. I'm using the concept diagnostically, not constitutively."
  **Soft Spot:** He will not like "diagnostically." To him, this sounds like you're treating a form of life as a hypothesis. Expect a follow-up about "rule-following."

  ### 5. The "Constitutive" Objection
  **Who:** The Other Aesthetician
  **The Vibe:** "You missed the point of art."
  **The Question:** "You say first-hand engagement is required for *assertion*, not knowledge. But for us, the engagement is constitutive of the *judgment* itself. If you haven't seen the film, you don't just lack entitlement to speak; you lack the judgment. You're describing a zombie who can say 'it's good' but can't actually *judge* it's good."
  **The 2-Minute Reply:**
  "I think we agree on the phenomenology but disagree on the semantics. I'm willing to grant that 'aesthetic judgment' might be a thick concept that includes the experience. But I want to preserve the intuition that the testifier *told me something true*. If I say 'I know it's good, but I haven't seen it,' you think that's nonsense. I think it's sad. I want to save the knowledge claim so we can explain how we learn about art without seeing it all, while keeping your requirement that we can't *stand* in that relation without seeing it."
  **Soft Spot:** This is a terminological stalemate. If they define "judgment" as requiring experience, your "knowledge without judgment" looks like a contradiction in terms.

  ### 6. The "Understanding" Objection
  **Who:** Virtue Epistemologist
  **The Vibe:** Concerned about intellectual character.
  **The Question:** "This sounds like the distinction between knowledge and understanding. Testimony gives knowledge; experience gives understanding. Why invent a new 'entitlement' norm? Just say testimony fails to provide *understanding*, and that's why assertion is inappropriate. We already have that vocabulary."
  **The 2-Minute Reply:**
  "Because 'understanding' is often factive or cognitive. I can understand *why* the ending is devastating via testimony (plot mechanics). What I lack is the *appreciation*. Understanding usually explains the 'why'; I'm talking about the 'what it's like.' If I reduce this to understanding, it becomes too intellectual. It's not that I don't grasp the reasons; it's that I haven't done the work of the viewer. It's a normative deficit, not just a cognitive one."
  **Soft Spot:** Virtue epistemologists love "understanding." If they insist that appreciation *is* a form of understanding, you might get bogged down in definitions.

  ### 7. The "Domain Consistency" Objection
  **Who:** Social Epistemologist (The Consistency Checker)
  **The Vibe:** "Where do you draw the line?"
  **The Question:** "If it's not aesthetic exceptionalism, and it applies to morals too, what about sports? 'The game was thrilling.' Food? 'This wine is complex.' Do I need to taste the wine to tell you it's complex? If yes, your theory is too broad. If no, why are art and morals special?"
  **The 2-Minute Reply:**
  "I think the wine case actually supports me! If you tell a sommelier 'This wine is complex' based on a label, they will call you out. It's not that you're lying, but you're bypassing the point of wine talk. I'm arguing this applies to *value-laden* domains where the point of the discourse is to share a sensibility, not just data. Sports might be different if 'thrilling' is just a report on crowd noise. But if it's an aesthetic judgment of the play, the same rule applies. The line is 'evaluative sensibility,' not 'art.'"
  **Soft Spot:** This opens the floodgates. Is *everything* evaluative? If you say "yes," you're a global anti-reductionist about testimony, which the social epistemologists hate.

  ### 8. The "Phrasebook" Analogy Check
  **Who:** Anyone (Likely the Wittgensteinian or Aesthetician)
  **The Vibe:** "Nice metaphor, does it work?"
  **The Question:** "You compare deference to using a phrasebook without knowing the language. But if I use a phrasebook in Tokyo, I can successfully order food. I convey the content. Why is the aesthetic case different? Is it because the 'content' of art is the experience itself?"
  **The 2-Minute Reply:**
  "Exactly. In the Tokyo case, the goal is the food. The language is instrumental. In aesthetic conversation, the 'language'—the sharing of sensibilities—is partly the point. If I use a phrasebook to say 'I love this poem,' I've achieved the instrumental goal (you know I love it), but I've failed the conversational goal (connecting over the poem). The phrasebook works for *information*, but aesthetic talk is often *communion*. That's why the deficit matters."
  **Soft Spot:** If they argue that aesthetic talk *is* just information exchange (e.g., for critics), your analogy fails.

  ---

  ### General Advice for the Q&A
  1.  **Watch the Wittgensteinian:** He won't raise his hand immediately. He'll wait until the end and make a statement. Do not try to "refute" him. Nod, say "That's the tension I'm wrestling with," and move on. Engaging him in a theoretical debate is a trap.
  2.  **The Aestheticians:** They feel you are colonizing their territory with epistemology. Reassure them you value the "first-hand" requirement, even if you label it differently. Don't let them paint you as a reductionist who thinks art is just data.
  3.  **The Social Epistemologists:** They want consistency. Keep emphasizing that the *knowledge* norm is consistent (testimony works), but the *assertion* norm is sensitive to domain. Don't let them force you into "Knowledge is the Only Norm."
  4.  **The Hermit:** If they come back to the Hermit, don't get stuck on the hermit. Pivot to: "The hermit is a limit case that tests the boundary of the concept. Most of us aren't hermits."

  **Good luck. The thesis is strong, but the "Moral Extension" is the flashpoint. Guard that flank.**
