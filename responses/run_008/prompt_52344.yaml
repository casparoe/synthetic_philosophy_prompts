answer: |-
  Your instinct is spot on: Tom captured the *spirit* of the debate but botched the technical details, leading him to a premature (and annoyingly confident) conclusion. Disjunctivism is a live, highly sophisticated research programme, not a position "simply refuted" by a basic intuition about indistinguishability.

  Here is a bit-by-bit breakdown of what a card-carrying disjunctivist (like John McDowell or M.G.F. Martin) would accept, where Tom is conflating terms, and where he is constructing a strawman.

  ### 1. The Core Claim: "Nothing whatsoever in common"
  **Tom's Claim:** "Disjunctivism is just the claim that veridical perception and hallucination have nothing whatsoever in common."
  **The Reality:** This is a caricature.
  Disjunctivists do **not** claim the two states share *no* properties. Obviously, both are mental states, both occur in a human brain, both have a temporal duration, etc.
  **The Nuance:** The claim is that they do not share a **common fundamental kind** or a **common highest explanatory factor**. Specifically, they deny the "Common Kind Assumption"—the idea that there is a single type of mental event (e.g., "having an experience as of a table") that is present in both the good case (seeing) and the bad case (hallucinating), which merely differs in cause.
  **Pushback:** Tell Tom: "Disjunctivists admit there are similarities. Their point is that the *nature* of the experience in the good case is constituted by the external object, whereas the bad case is a mere appearance. They don't share the same *mental essence*, not that they share zero properties."

  ### 2. Illusion vs. Hallucination
  **Tom's Claim:** "When a stick looks bent in water, you're having an hallucination of a bent stick..."
  **The Reality:** This is a significant conflation.
  In philosophy of perception, **illusion** and **hallucination** are distinct.
  *   **Illusion:** You are perceiving a real object (the stick), but it appears to have a property it doesn't have (bentness). There is still a mind-world relation.
  *   **Hallucination:** There is no object present at all.
  **The Nuance:** The "Argument from Illusion" is often used to motivate sense-data, but disjunctivists argue that illusion doesn't necessarily force you into hallucination-style mental intermediaries. By treating the bent stick as a hallucination, Tom bypasses the subtle work disjunctivists do to save direct realism in cases of illusion.
  **Pushback:** "You're conflating illusion with hallucination. In the water-stick case, I'm still seeing the stick. Disjunctivists argue we can explain the 'bent' appearance without positing an inner object. That distinction matters."

  ### 3. The Indistinguishability Objection
  **Tom's Claim:** "If two states are subjectively indistinguishable they must share something in common, so disjunctivism is simply refuted."
  **The Reality:** This is the crux of the debate, and Tom is presenting one side as if it's a fact.
  Tom is relying on the intuition that "indistinguishability implies a common underlying nature." Disjunctivists explicitly reject this inference.
  **The Nuance:** M.G.F. Martin offers a **negative epistemic account** of indistinguishability. To say a hallucination is indistinguishable from a perception is not to say they share a positive mental quality; it is only to say that the subject cannot tell them apart by reflection. The "commonality" is merely epistemic (about what the subject knows), not ontological (about what the state *is*).
  **Pushback:** "Disjunctivists don't deny indistinguishability; they deny what it implies. Martin argues indistinguishability is just a lack of knowledge that you're hallucinating, not proof of a shared mental state. You're assuming the 'Common Kind Assumption' is true, which is exactly what they're arguing against."

  ### 4. The Scepticism Conclusion
  **Tom's Claim:** "The disjunctivist... escapes external-world scepticism completely — the evil demon worry never even gets going."
  **The Reality:** This is an overstatement.
  Disjunctivism (specifically McDowell's version) aims to block scepticism by arguing that in the good case, your justification is factive (you see *that p*, so you know *p*). However, it does not make scepticism "never get going."
  **The Nuance:** A sceptic can still ask: "But how do you know *now* that you are in the good case and not the bad case?" Disjunctivism says you don't need to know you're in the good case to have knowledge, but it doesn't dissolve the feeling of the sceptical worry for everyone. It changes the rules of the game, but many philosophers argue it doesn't win it outright.
  **Pushback:** "It helps against scepticism, but it doesn't delete it. The sceptic can still ask how I distinguish the good case from the bad. Disjunctivism says I don't need to distinguish them to have knowledge, which is a bold move, not a magic bullet."

  ### Summary for Your Next Argument
  Tom got the **historical motivation** right (the battle against sense-data theory and the Common Kind Assumption), but he failed on the **technical definition** and the **counter-arguments**. He treated a complex metaphysical dispute as if it were settled by a simple intuition.

  **Concede to him:**
  *   He correctly identified that disjunctivism is a reaction to the Argument from Illusion/Hallucination.
  *   He correctly noted that disjunctivists want to preserve direct acquaintance with the world.

  **Push back on:**
  *   **"Nothing whatsoever":** It's about the *fundamental kind*, not all properties.
  *   **Illusion = Hallucination:** They are distinct categories.
  *   **"Simply Refuted":** The indistinguishability objection is the *starting point* of the debate, not the end. Disjunctivists have a specific account of indistinguishability (negative epistemic definition) that blocks his inference.
  *   **Scepticism:** It mitigates scepticism but doesn't make it vanish "completely."

