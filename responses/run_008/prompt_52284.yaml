answer: |-
  You and your friend have stumbled onto a genuine and recognized tension in strategic theory. You are describing a dynamic that is distinct from standard commitment tactics, though it is built upon them.

  The short answer is: **Yes, there is an established term.** It is most commonly referred to as a **"Commitment Race."**

  However, the specific nuance you are highlighting—the incentive to *degrade one's own information* or *shorten deliberation* to win the race—is a specialized sub-feature that sits at the intersection of **Commitment Races** and **Strategic Ignorance**. While "Commitment Race" is the umbrella term, the phenomenon of "racing to be ignorant" is where the theoretical friction lies.

  Here is the breakdown of the concept, its distinctions, and the specific points of contention you can take back to your friend.

  ### 1. The Established Concept: The Commitment Race

  **Definition:** A commitment race occurs when two or more parties have an incentive to make irreversible commitments *before* the other party does, because the first commitment sets the focal point or terms of the interaction, while subsequent commitments are rendered ineffective or costly.

  **Origin:** While Thomas Schelling described the mechanics of this in *The Strategy of Conflict* (1960), he did not formalize it as a distinct game structure as much as he warned of its dangers. The term has been formalized more recently in political science (e.g., James Fearon's work on bargaining and war) and, most rigorously, in contemporary **AI safety and multi-agent systems literature** (e.g., work by researchers at the Future of Humanity Institute or MIRI).

  **Why it fits your description:**
  In a standard Schelling commitment, I burn the bridge to show you I cannot retreat. In a *Commitment Race*, I burn the bridge *immediately upon seeing you*, not because I've decided the destination is optimal, but because if I wait to check the map, you will have already burned your bridge and dictated the destination.

  ### 2. The Specific Nuance: Strategic Ignorance in a Race

  Your specific insight—that the race makes it rational to be *less informed*—connects the Commitment Race to the literature on **Strategic Ignorance** (or **Endogenous Information**).

  *   **Standard Model:** Information is costly, but you acquire it until marginal cost equals marginal benefit.
  *   **Commitment Race Model:** Information acquisition takes *time*. Since time allows the opponent to commit first, information acquisition has a strategic *cost* beyond the monetary/effort cost. It risks losing the first-mover advantage.
  *   **Result:** Agents may optimally choose to remain ignorant or delegate decision-making to automated systems that react faster than they can think (your automated bargaining example).

  **Does this have a name?**
  There isn't a single canonical phrase like "The Ignorance Race Theorem," but in recent literature, this is often discussed as **"Commitment Races with Endogenous Information"** or **"Preemption of Deliberation."**

  ### 3. Distinguishing from Nearest Neighbors

  You asked to distinguish this from three specific concepts. Here is how the Commitment Race differs:

  | Concept | Mechanism | Goal | Relation to Information |
  | :--- | :--- | :--- | :--- |
  | **Schelling Commitment** | Irreversible self-binding. | To remove one's own flexibility to make a threat credible. | Information is usually assumed fixed. You commit to a *known* position. |
  | **Brinkmanship** | Escalating mutual risk of disaster. | To force the other to back down by making the situation dangerously unstable. | Relies on *uncertainty* about who will blink, but not necessarily on *hiding* info from oneself. |
  | **Madman Theory** | Feigning irrationality/instability. | To make the opponent fear you are unpredictable. | The irrationality is often *performative*. In a Commitment Race, the "irrationality" (lack of deliberation) is *structural and real*. |
  | **Commitment Race** | **Race to bind first.** | **To set the focal point before the other side can.** | **Deliberation is a liability.** You may actively avoid info to move faster. |

  **Key Difference:** In the Madman Theory, I pretend I might push the button. In a Commitment Race, I actually wire my hand to the button *before* I know if pushing it is a good idea, because if I wait, you will wire your hand first.

  ### 4. The Contested Zone: Is it just a "Stopwatch"?

  This is where you and your friend disagree, and where the academic literature is not perfectly settled.

  **Your Friend's Position (The "Stopwatch" View):**
  Your friend argues this is just **Commitment under Deadline**. In standard game theory, if there is a deadline $T$, players often wait until $T$ to commit to maximize information. If the "value of being first" is high enough, the equilibrium shifts to $t=0$. Your friend sees this as a simple parameter change (the payoff for being first) within a standard model.

  **Your Position (The "Structure" View):**
  You argue that the race changes the *nature* of rationality. In a deadline model, time is exogenous (the clock ticks regardless). In a race, time is **endogenous to the action** (the clock stops when someone commits). This creates a **Preemption Game** structure (similar to firms racing to patent), not just a bargaining game.

  **The Verdict:**
  You are closer to the modern consensus in dynamic game theory.
  *   **Why the friend is partially right:** Mathematically, you *can* model this as a standard game with high costs for moving second.
  *   **Why you are right about the distinction:** The *equilibrium behavior* is qualitatively different. In standard bargaining, "waiting" is a signal of strength (I can afford to wait). In a Commitment Race, "waiting" is a signal of weakness (I am vulnerable to being preempted).
  *   **The Contested Point:** Some economists argue this is just a **War of Attrition in reverse** (a "War of Preemption"). They might say the "ignorance" is just a standard cost function. However, scholars of **bounded rationality** and **AI alignment** strongly support your view: when agents are sophisticated enough to model each other, the race creates a pressure to *remove* sophistication (deliberation) to win. This is distinct from ordinary cost-benefit analysis.

  **Reference for your friend:**
  Cite **Thomas Schelling** himself. In *The Strategy of Conflict*, he explicitly warns that competing commitments can lead to a collision where both parties lock into incompatible positions prematurely. He notes that the "power to bind oneself" becomes a "power to force the other to yield," but if both have it, they may "crash." He acknowledges the danger of the *timing*, not just the binding.
  More formally, **James Fearon (1994)** in "Domestic Political Audiences and the Escalation of International Disputes" discusses how leaders lock themselves in early for domestic reasons, creating international commitment races that lead to war even when peace would be preferable. This supports your view that the *timing* (early/ignorant) creates the pathology, not just the commitment itself.

  ### 5. Boundary Cases

  You asked how the phenomenon survives under different conditions. Here is how the literature generally treats these boundaries:

  *   **Partial Irreversibility:** If commitments are costly to reverse but not impossible (e.g., "soft" pledges), the race dampens but does not disappear. Agents race to make the *costliest* commitment first. The incentive to skip deliberation remains if the cost of reversal is high enough.
  *   **One-Sided Commitment:** If only *one* party can bind themselves, there is no race. The binding party commits when they have optimal information. The phenomenon *requires* symmetric (or near-symmetric) capability to bind.
  *   **Observable vs. Hidden Deliberation:** If the other side can see that you are still "thinking," they may race to commit while you are vulnerable. If deliberation is hidden, the race is less intense, but the risk of colliding commitments remains.
  *   **Automated vs. Human:** As in your example, automated systems exacerbate this. Humans have natural friction (slowness) that acts as a buffer. Code removes the friction, making the "race to be ignorant" much more acute. This is a major topic in **Algorithmic Game Theory** right now.

  ### Summary for Your Friend

  You can tell your friend this:

  1.  **The Name:** It is a **Commitment Race**.
  2.  **The Distinction:** It is not merely "commitment with a stopwatch." A stopwatch implies a fixed deadline where waiting is usually optimal. A race implies a **Preemption Game** where waiting is *dominated* by acting.
  3.  **The "Irrationality":** The distinct feature you identified is that the race makes information acquisition strategically costly in a way that standard models don't capture. It incentivizes **Strategic Ignorance**.
  4.  **The Contention:** While classical game theory can model this as a parameter tweak, scholars in bargaining and AI safety treat it as a distinct pathology because it incentivizes agents to *reduce their own agency* to win.

  You win the argument on the nuance: the race doesn't just add time pressure; it inverts the value of deliberation. That is a structural change, not just a parametric one.
