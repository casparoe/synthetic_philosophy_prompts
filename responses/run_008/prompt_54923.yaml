answer: |-
  **Game: The Pheromone Floor**

  **Setup:** Lay index cards on the floor in two distinct paths between "Nest" (Start) and "Food" (Finish). Path A: 5 cards. Path B: 9 cards. Give each player a sheet of colored stickers.

  **Rules:**
  1.  You are an ant. You see only the card immediately in front of you. Do not look at the whole map.
  2.  Walk Nest → Food → Nest repeatedly.
  3.  Place a sticker on every card you step on.
  4.  At junctions: If one path has stickers, take it. If both/neither have stickers, choose randomly.
  5.  No talking.

  **Expected Outcome:** Path A completes faster. Ants return sooner, depositing stickers quicker. Path A becomes "sticky." Path B starves. The colony "decides" the shortest path without any individual knowing it exists.

  **Debrief:**
  1.  "Did anyone intend to optimize the path?" (No.)
  2.  "Where was the 'knowledge' of the short path stored?" (In the environment/stickers, not your heads.)
  3.  "If cards are neurons and stickers are synaptic weights, is the room thinking?"
  4.  "Is 'mind' a substance or a pattern? If we scaled this to 20,000 people, would you call it a person?"
  5.  Connect to AI: This is a physical neural network training via reinforcement learning.

  **Predictable Failures:**
  1.  **The God View:** Humans spot the short path immediately. *Fix:* Scold gently; remind them they are "dumb."
  2.  **Traffic Jams:** Physical bodies collide on cards. *Fix:* Widen paths.
  3.  **Sticker Exhaustion:** Running out of stickers. *Fix:* Give plenty.

  **The Cheats (Reality vs. Game):**
  1.  **Scale:** 20 ants vs. 20,000. Statistical noise dominates here.
  2.  **Gradient:** Real pheromones evaporate and vary in intensity. Stickers are binary (on/off). Without evaporation, the colony can't adapt if the short path is blocked later.
  3.  **Cognition:** You cannot turn off human pattern recognition. Real ants don't *choose* to ignore the long path; they physically can't perceive it.

  **Confidence:** 85%. The emergent behavior is robust enough to show even with cheats.

  **Weakest Link:** Enforcing the "no looking ahead" rule. If three people cheat, the emergent magic vanishes because the "smart" humans shortcut the algorithm. If they cheat, the lesson changes from "emergence" to "coordination," which is still useful but less Hofstadter.
