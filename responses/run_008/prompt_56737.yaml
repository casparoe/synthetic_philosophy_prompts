      *   *Key distinction:* Causal influence vs. Logical correlation.
      *   *Math check:* $p(R-S) > P-S$. Since $R>P$ and $P>S$, the RHS is positive. $R-S$ is positive. So a valid $p \in (0,1)$ exists.
      *   *Example:* $T=5, R=3, P=1, S=0$. Threshold: $p > (1-0)/(3-0) = 1/3$. If more than 33% are SR, SRs should cooperate.
      *   *Wait, check Defector payoff:* If I defect, SRs defect (because they mirror me). Defectors defect (always). So everyone defects. Payoff $P$.
      *   If I cooperate, SRs cooperate. Defectors defect. Payoff is mix of $R$ and $S$.
      *   Yes, the math holds.

