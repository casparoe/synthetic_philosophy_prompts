answer: |-
  Here is a decision procedure designed for a one-hour window, grounded in the methodological literature of evolutionary biology and philosophy of science. It is followed by an application to your three hypothetical queue items.

  ### The "Hourglass" Protocol: A Risk-Assessment Procedure for Evolutionary Psychology

  This is not a truth-detection algorithm. It is an **epistemic risk assessment**. It sorts claims based on the likelihood that the adaptive story is a "just-so" narrative (a plausible but untested retrodiction) versus a tested hypothesis.

  **Time Budget:** 60 Minutes
  **Inputs:** Press release, Abstract, Methods Section, Discussion Section.

  #### Phase 1: The Logic of the Claim (15 Minutes)
  **Goal:** Determine if the argument is predictive or retrodictive.

  1.  **The Prediction Check:** Does the paper present a *novel* prediction that was tested, or does it offer an explanation for a *known* phenomenon?
      *   *Green Flag:* "Theory X predicts Y; we measured Y and found it."
      *   *Red Flag:* "We observe Y; Theory X explains why Y exists."
      *   *The Judgment Call:* Distinguishing a "prediction" from a "retrodiction dressed as a prediction" is contested. A proponent will argue that applying an existing theory to a new domain counts as prediction. A critic will argue that if the theory was built to explain the domain, it's circular.
      *   *Action:* If the paper explains a well-known behavior (e.g., "men prefer youth") without a prior quantitative constraint, mark **High Risk**.

  2.  **The EEA Specification:** Does the paper specify the "Environment of Evolutionary Adaptedness" (the ancestral context) with specificity, or is it vague ("ancestral savannah," "early humans")?
      *   *Green Flag:* Specific ecological pressures (e.g., "pathogen load in tropical latitudes").
      *   *Red Flag:* Vague appeals to "the Pleistocene" generally.
      *   *Settled Science:* We cannot run selection experiments on the Pleistocene.
      *   *Contested Science:* How much specificity is required to make a claim testable?
      *   *Action:* If the environment is vague, mark **High Risk**.

  #### Phase 2: The Evidence & Alternatives (25 Minutes)
  **Goal:** Assess whether non-evolutionary explanations were ruled out.

  3.  **The Cultural Confound Check:** Did the study measure or control for cultural transmission?
      *   *Green Flag:* Cross-cultural data *plus* controls for media exposure, economic development, or social learning.
      *   *Red Flag:* Cross-cultural data that assumes "different countries = independent evolutionary data points" without controlling for shared cultural history or globalized media.
      *   *The Judgment Call:* Evolutionary psychologists argue that universal patterns across diverse cultures suggest genetic underpinnings. Critics argue that cultural universals can spread via learning or shared structural constraints (e.g., all societies have markets).
      *   *Action:* If the study relies solely on self-report questionnaires across nations without behavioral measures, mark **High Risk**.

  4.  **The Byproduct Check:** Did the authors consider if the trait is a physiological or developmental byproduct (a "spandrel") rather than an adaptation?
      *   *Green Flag:* Explicitly tests against a physiological alternative (e.g., "Is this preference due to hormone levels rather than selection?").
      *   *Red Flag:* Assumes that because a trait is useful *now*, it was selected *for* then.
      *   *Settled Science:* Current utility does not prove evolutionary history.
      *   *Action:* If no alternative mechanism is tested, mark **High Risk**.

  5.  **Methodological Rigor:** Is the study preregistered? Is the sample size adequate for the effect size claimed?
      *   *Green Flag:* Preregistered analysis plan; large, diverse sample.
      *   *Red Flag:* Post-hoc analysis; small, WEIRD (Western, Educated, Industrialized, Rich, Democratic) sample.
      *   *Action:* Lack of preregistration in a field prone to $p$-hacking is a **Critical Risk**.

  #### Phase 3: The Verdict (20 Minutes)
  **Goal:** Assign the bin based on accumulated risk flags.

  *   **Bin 1: Credible Science.** (0-1 Risk Flags). Preregistered, predictive, rules out cultural/physiological alternatives, convergent methods.
  *   **Bin 2: Interesting Hypothesis + Heavy Caveats.** (2 Risk Flags). Plausible story, but relies on retrodiction, self-report, or lacks alternative testing. Good for "Here's a theory, but don't bet on it."
  *   **Bin 3: Decline to Cover.** (3+ Risk Flags OR Critical Risk). Just-so story, vague EEA, no alternative testing, or methodological flaws that invalidate the conclusion.

  **The "Zombie" Check (Optional, time permitting):** A quick search for the specific claim. Has this exact story been falsified before and reappeared with minor tweaks? If yes, move to **Bin 3** regardless of other scores.

  ***

  ### Settled vs. Contested: A Note for Your Editors

  When framing these stories, you can rely on the following distinctions:

  **Settled Among Experts (Biology & Philosophy):**
  *   **Adaptationism has failure modes:** It is possible to construct a plausible adaptive story for almost any trait.
  *   **History vs. Utility:** A trait being useful today does not prove it was selected for that purpose in the past (exaptation).
  *   **The Fossil Gap:** We cannot observe Pleistocene selection directly; we must infer it.
  *   **Heritability is Hard:** Establishing that a complex behavior is heritable (a prerequisite for selection) is methodologically difficult in humans.

  **Genuinely Contested:**
  *   **The Severity of the Problem:** Critics argue these failure modes invalidate most current evo psych findings. Proponents argue that modern methods (preregistration, cross-cultural work) have solved them.
  *   **The "Standard Social Science Model":** Proponents argue they are correcting a bias that ignored biology; critics argue they are introducing a bias that ignores culture.
  *   **Specific Results:** There is no consensus on which specific "classic" findings (e.g., mate preferences, cheater detection) have survived scrutiny.

  ***

  ### Running the Procedure: Three Hypotheticals

  Here is how the protocol applies to your current queue.

  #### Item 1: Pregnancy Aversions (Toxin Avoidance)
  *   **Claim:** Food aversions in the first trimester are an adaptation to protect embryos from plant toxins.
  *   **Evidence:** Supportive cross-cultural survey data.
  *   **Procedure Run:**
      *   *Prediction Check:* **Red Flag.** This is a classic retrodiction. We know aversions exist; the theory explains them post-hoc.
      *   *EEA Check:* **Yellow Flag.** "Plant toxins" is specific, but assumes ancestral diet uniformity.
      *   *Cultural/Byproduct Check:* **Red Flag.** Survey data measures reported aversion, not toxin avoidance behavior. Does not rule out physiological byproducts (e.g., heightened smell sensitivity due to hormones causing aversion, regardless of toxin content).
      *   *Rigor:* **Yellow Flag.** Surveys are prone to recall bias.
  *   **Verdict:** **Bin 2 (Interesting Hypothesis + Heavy Caveats).**
  *   **Framing:** You can cover this as a leading hypothesis, but you must explicitly state that "physiological byproduct" is an equally viable explanation that this study did not rule out. The cross-cultural data suggests universality, but not necessarily adaptation.

  #### Item 2: Mate Preference (37 Countries)
  *   **Claim:** Sex differences in mate preference (resources vs. beauty) are explained by differential parental investment.
  *   **Evidence:** Questionnaires from 37 countries.
  *   **Procedure Run:**
      *   *Prediction Check:* **Red Flag.** This is the canonical retrodiction of the field.
      *   *EEA Check:* **Red Flag.** Relies on a generalized ancestral division of labor.
      *   *Cultural/Byproduct Check:* **Critical Risk.** The measure is *self-report questionnaires*. This measures *stated* preference, not *actual* mating behavior. It does not control for patriarchal structures where women *must* prioritize resources for survival, which mimics a "preference."
      *   *Rigor:* **Yellow Flag.** 37 countries sounds large, but if the sampling within countries is WEIRD (university students), the "cross-cultural" claim is weak.
  *   **Verdict:** **Bin 3 (Decline to Cover).**
  *   **Why this is inconvenient:** This is a "classic" finding that readers expect you to cover. However, under this procedure, it fails because it conflates cultural constraint with evolved preference and relies on stated rather than revealed preference. Covering it as "science" without noting that it fails to distinguish between "I want this" and "I need this to survive" misleads readers about the evidence.
  *   **Journalist's Discretion:** A reasonable journalist might argue that 37 countries is sufficient to warrant a Bin 2. If you choose Bin 2, the caveat must be: "Critics argue these questionnaires measure economic necessity, not psychological adaptation."

  #### Item 3: Cooperation/Cheater Detection (Preregistered, Weak Effect)
  *   **Claim:** Evolutionary account of cooperation predicts people are more sensitive to social cheating than logical violations.
  *   **Evidence:** Preregistered, cross-cultural study. Reports a much weaker effect than originally claimed.
  *   **Procedure Run:**
      *   *Prediction Check:* **Green Flag.** Tests a specific prediction derived from the theory (social contract logic vs. general logic).
      *   *EEA Check:* **Green Flag.** Implicitly tests the "social exchange" environment without needing vague Pleistocene details.
      *   *Cultural/Byproduct Check:* **Green Flag.** Cross-cultural design helps rule out local norms. Task-based (behavioral) data is superior to questionnaires.
      *   *Rigor:* **Green Flag.** Preregistered.
      *   *Outcome:* The effect is weaker than proponents claimed.
  *   **Verdict:** **Bin 1 (Credible Science).**
  *   **Why this is inconvenient:** This is the "boring" result. It doesn't prove evo psych is "right" in a spectacular way; it shows the effect is real but small, and previous literature likely exaggerated it. Editors want "Stone Age Brain Explains X!" not "Stone Age Brain Explains X, But Barely."
  *   **Framing:** This is the most scientifically honest story. It demonstrates that the field is self-correcting. The headline isn't "Evolution Proven," it's "Rigorous Test Refines Evolutionary Theory."

  ### Summary of Inconvenient Truths

  1.  **Item 2 (Mate Preference)** lands in **Bin 3**. You are telling your editors you will *not* cover one of the most famous findings in the field because the methodology (questionnaires) cannot distinguish evolution from economic coercion. This contradicts the "readers love them" mandate but adheres to the "credible science" mandate.
  2.  **Item 3 (Cooperation)** lands in **Bin 1**. You are telling your editors to cover a study that *dampens* the hype. It validates the method, not the magnitude of the claim.

  ### Where Reasonable Journalists Might Disagree

  *   **On Item 2:** A journalist might argue that 37 countries is enough to override the "cultural confound" objection. *Resolution:* If you move this to Bin 2, you must interview a sociologist who specializes in gender economics to provide the counter-view that "preference" is indistinguishable from "constraint" in the data provided.
  *   **On Item 3:** A journalist might argue a "weak effect" isn't newsworthy. *Resolution:* In a field plagued by replication crises, a rigorous null-or-weak result *is* the news. It signals a maturing of the discipline.
  *   **On "Falsifiability":** You will encounter authors who claim their theory is falsifiable because "if we found the opposite, it would disprove it." Critics argue that if the opposite is found, the theory is often tweaked (e.g., "context-dependent") rather than discarded. *Resolution:* Look for **preregistration**. If the prediction was locked in before data collection, the "tweaking" escape hatch is closed.

  This procedure prioritizes **methodological hygiene** over **narrative appeal**. It assumes that in a field where stories are easy to tell and hard to verify, the rigor of the test is the only proxy for truth available to a journalist on deadline.
