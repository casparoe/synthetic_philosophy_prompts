answer: |-
  **Exam Question**

  **Question 1 (25 points)**
  Consider the following exchange between two colleagues regarding the Continuum Hypothesis (CH):

  > **Dr. Vance (Logician):** "Cohen's forcing demonstrates that CH is independent of ZFC. We can consistently add CH or ¬CH. This proves the question of CH's truth is not merely unsettled but empty. Adopting any new axiom to decide it would be legislation, not discovery."
  >
  > **Prof. Thorne (Platonist):** "An independence proof is itself just another theorem about a particular formal system. It is a category mistake to read off from it anything about the sets themselves. The axioms are incomplete, not the reality."

  Adjudicate this debate. In your response, you must:
  (i) Distinguish unprovability in a formal system from indeterminacy of truth, explaining why the former does not necessarily entail the latter.
  (ii) Assess whether Gödel's program of new axioms—specifically his suggestion that axioms might earn acceptance through their fruitfulness and consequences rather than self-evidence—answers Vance's "legislation" charge, or merely restates it in friendlier terms.
  (iii) Explain what a multiverse or conditional conception of set-theoretic truth would have to concede to Vance's position if it is to resist her conclusion that the question is empty.

  *(Recommended time: 60 minutes)*

  ***

  **Model Answer**

  The debate between Vance and Thorne hinges on whether formal underdetermination implies semantic indeterminacy. To adjudicate, one must separate the limitations of axiomatic systems from the nature of the subject matter they attempt to describe.

  Regarding (i), Vance conflates syntactic independence with ontological vagueness. That CH is unprovable in ZFC means only that the ZFC axioms are insufficient to fix the cardinality of the continuum. It does not logically follow that the continuum lacks a definite cardinality. Thorne's "category mistake" objection relies on a realist semantics: ZFC is a formalization of our concept of set, not the exhaustible essence of sethood itself. Gödel's construction of the constructible universe ($L$) showed CH is consistent with ZFC, and Cohen's forcing showed ¬CH is consistent. These are metatheoretic results about derivability relations. Unless one adopts a formalist ontology where sets *are* nothing more than what ZFC proves, independence reveals only epistemic limits or axiomatic incompleteness, not a gap in reality. The map is incomplete; the territory may still be determinate.

  Regarding (ii), Gödel's program proposes extrinsic justification for new axioms. Since intrinsic evidence (self-evidence) failed to settle CH, Gödel suggested axioms should be adopted based on their "fruitfulness"—their ability to resolve undecidable problems and simplify theory. Does this answer Vance's charge of legislation? It depends on the link between utility and truth. If mathematical utility tracks ontological depth, then fruitful axioms are discoveries of pre-existing truths. However, Vance could argue that 'fruitfulness' is pragmatic, not truth-tracking. If we adopt an axiom merely because it makes theory easier, we are legislating conventions for convenience. To resist Vance, the Platonist must argue that extrinsic success is evidence of intrinsic correctness—that the universe of sets is structured such that true axioms yield rich consequences. Without this link, Gödel's program merely restates legislation as "pragmatic adoption," conceding that truth is subordinate to utility.

  Regarding (iii), a multiverse conception (e.g., Hamkins) resists the claim that the question is empty by relativizing truth. CH is not absolutely true or false but true in some set-theoretic universes and false in others. However, to maintain this view while resisting Vance's conclusion, the Multiversist must concede a significant point to the Logician: there is no absolute fact of the matter regarding CH. Vance argues the question is empty because there is no unique truth value; the Multiversist agrees there is no unique truth value but denies emptiness by populating the ontology with multiple universes. Thus, to resist the claim that the question is meaningless, the Multiversist must concede that Thorne's classical Platonism (a single, determinate universe) is false. They accept Vance's rejection of absolute determinacy but reject her nihilism by expanding the ontology.

  Ultimately, Vance is correct that ZFC does not decide CH, but Thorne is correct that this does not settle the metaphysics. The choice lies between a realist view positing undiscovered axioms (Thorne/Gödel) and a pluralist view positing multiple realities (Multiverse). Both avoid emptiness, but only the realist preserves the idea of a single discovery rather than a legislative choice of universe.

  ***

  **Marking Scheme**

  **Total Points: 25**

  **1. Unprovability vs. Indeterminacy (8 points)**
  *   **A (7-8 pts):** Clearly articulates that independence is a syntactic relation between sentences and axioms, whereas indeterminacy is a semantic/ontological claim. Explicitly notes that ZFC may be an incomplete description of a determinate reality (Thorne's view).
  *   **B (5-6 pts):** States that independence doesn't mean indeterminacy but relies on assertion rather than explaining the syntax/semantics distinction.
  *   **C (0-4 pts):** Conflates the two or suggests independence proves indeterminacy.

  **2. Gödel's Program and Legislation (8 points)**
  *   **A (7-8 pts):** Nuanced assessment. Recognizes that extrinsic justification only avoids "legislation" if utility tracks truth. Acknowledges Vance's counter-argument that pragmatism might just be convenient convention.
  *   **B (5-6 pts):** Describes Gödel's program accurately but fails to evaluate whether "fruitfulness" successfully rebuts the charge of legislation.
  *   **C (0-4 pts):** Merely defines intrinsic vs. extrinsic justification without connecting it to the legislation charge.

  **3. Multiverse Concession (5 points)**
  *   **A (5 pts):** Identifies that the Multiverse view must concede the lack of a *unique* absolute truth value to Vance to resist the "emptiness" claim.
  *   **B (3-4 pts):** Describes the Multiverse view but fails to identify the specific concession regarding uniqueness/absoluteness.
  *   **C (0-2 pts):** Incorrectly claims the Multiverse view preserves absolute truth.

  **4. Clarity and Structure (4 points)**
  *   Clear prose, logical flow, and adherence to word limits.

  **Critical Error Penalty**
  *   **The Single Error:** Treating "independent of ZFC" as synonymous with "shown to have no truth value."
  *   **Penalty:** If this error appears as a premise in the student's argument, the essay is capped at **10/25** regardless of other merits.

  **Distinction between A and B Answers**
  *   A answers evaluate the *link* between fruitfulness and truth in section (ii) and identify the *ontological concession* in section (iii); B answers describe the positions without this critical evaluation.

  **Typical Student Failures**
  *   (i) Students typically assert independence implies indeterminacy without analyzing the syntax/semantics gap.
  *   (ii) Students typically describe Gödel's extrinsic justification but fail to assess whether it constitutes legislation.
  *   (iii) Students typically describe the Multiverse view without noting it concedes the lack of absolute truth to the Logician.
