answer: |-
  ### Exam Question

  **Final Examination: Philosophy of Social Science**
  **Time Allowed: 90 Minutes**

  **Question:**
  A colleague in Economics claims that Popper's argument against historicism in *The Poverty of Historicism* is essentially the Lucas Critique *avant la lettre*. They argue that Popper's "Oedipus effect"—whereby a published prediction alters the social process it predicts—is identical to Lucas's claim that econometric relationships break down when agents revise expectations under new policy regimes. The colleague concludes that Popper's insight is mundane and offers no distinct philosophical barrier to social science.

  Write an essay evaluating this comparison. In your answer, you must address:
  1.  Whether this comparison illuminates or flattens Popper's argument.
  2.  Whether the Lucas Critique permits regime-conditional regularities in a way that Popper's argument rules out conditional laws of historical development.
  3.  Whether Popper's argument proves too much by threatening well-confirmed regularities in other special sciences (e.g., epidemiology or ecology) where systems are entangled with human knowledge.

  Strong answers will specify precisely where the analogies between economics, historicism, and the natural sciences break down.

  ***

  ### Model Answer

  The comparison between Popper's Oedipus effect and the Lucas Critique illuminates the mechanism of reflexivity but flattens the ontological scope of Popper's argument against historicism. While both rely on the feedback loop between knowledge and behavior, Popper's conclusion is stronger: he denies the possibility of historical laws entirely, whereas Lucas merely limits the stability of econometric parameters across policy regimes.

  The colleague is correct that both arguments hinge on reflexivity. For Lucas, agents optimize based on expectations; if a policy regime changes, expectations shift, and previously stable correlations dissolve. Similarly, Popper argues that because historical development is influenced by the growth of human knowledge, and because that growth is unpredictable, historical trajectories are unpredictable. However, equating the two ignores the difference between *parameter instability* and *structural unpredictability*. The Lucas Critique allows for regime-conditional regularities: within a fixed policy environment, agents' expectations stabilize, and lawful relationships hold. Popper, conversely, argues that the "regime" of history is itself constituted by the growth of knowledge. Since we cannot know today what we will know tomorrow, we cannot fix the conditions under which a historical law would operate. Thus, while Lucas preserves local laws within fixed structures, Popper denies the possibility of laws governing the evolution of the structures themselves.

  To claim Popper's argument proves too much threatens to conflate *causal influence* with *constitutive change*. In epidemiology or ecology, human knowledge affects the system (e.g., masking reduces transmission; culling alters population density), but it does not alter the biological laws governing the virus or the ecosystem. The virus does not mutate *because* it understands the vaccine; it mutates via blind variation. In the social realm, however, the "laws" are often constitutive of the agents' intentions. If agents learn a social "law," they can choose to violate it or exploit it, thereby changing the regularity itself. The feedback in social science is logical or conceptual, not merely causal. Therefore, Popper's argument does not threaten epidemiology, because the objects of epidemiology (viruses, cells) do not act on the basis of theoretical knowledge about themselves.

  Ultimately, the colleague's comparison is rhetorically useful but philosophically shallow. It identifies the feedback mechanism but misses Popper's claim about the uniqueness of historical time. Lucas critiques the invariance of parameters across policy changes; Popper critiques the possibility of predicting the sequence of changes themselves. The analogy breaks where knowledge becomes constitutive of the subject matter. In economics and history, the theory enters the practice; in epidemiology, the theory remains external to the pathogen. Popper deserves credit not for noticing feedback—which is indeed mundane—but for recognizing that in the human realm, feedback undermines the very possibility of nomological prediction, not just its practical accuracy. The Lucas Critique saves social science by restricting its scope; Popper saves it by redefining its task away from prophecy and toward piecemeal engineering.

  ***

  ### Marking Scheme (25 Marks)

  **Band 1 (0–5 Marks): Basic Reconstruction**
  *   **Achievement:** Accurately reconstructs Popper's standard syllogism (knowledge growth → unpredictable history → no laws) and identifies the basic similarity with Lucas (feedback/expectations).
  *   **Boundary to Next Band:** To exceed 5 marks, the answer must move beyond reciting the syllogism to evaluating the *strength* of the comparison.
  *   **Common Loss:** Students lose marks here by merely summarizing Popper without engaging the Lucas comparison.

  **Band 2 (6–10 Marks): Evaluating the Comparison**
  *   **Achievement:** Explicitly states whether the comparison illuminates or flattens Popper's argument. Identifies that both rely on reflexivity/feedback loops.
  *   **Boundary to Next Band:** To exceed 10 marks, the answer must distinguish between *parameter instability* (Lucas) and *structural unpredictability* (Popper).
  *   **Common Loss:** Students lose marks here by treating the two arguments as identical without noting differences in scope.

  **Band 3 (11–15 Marks): Conditional Laws Distinction**
  *   **Achievement:** Explains that Lucas allows regime-conditional regularities, whereas Popper rules out conditional laws of historical development because the "conditions" (knowledge state) evolve unpredictably.
  *   **Boundary to Next Band:** To exceed 15 marks, the answer must address the "proves too much" objection regarding other sciences.
  *   **Common Loss:** Students lose marks here by failing to clarify why Popper rejects conditional laws while Lucas accepts them.

  **Band 4 (16–20 Marks): The "Proves Too Much" Objection**
  *   **Achievement:** Engages with the epidemiology/ecology analogy. Distinguishes between knowledge affecting behavior (social) versus knowledge affecting physical/biological laws (natural).
  *   **Boundary to Next Band:** To exceed 20 marks, the answer must precisely locate where the analogy breaks (constitutive vs. causal feedback).
  *   **Common Loss:** Students lose marks here by gesturing vaguely at the "autonomy of social sciences" without specifying the mechanism of the break.

  **Band 5 (21–25 Marks): Precise Synthesis**
  *   **Achievement:** Synthesizes the above to conclude that the analogy breaks where knowledge becomes constitutive of the subject matter. Articulates clearly why Popper's argument does not threaten natural special sciences.
  *   **Boundary to Top:** Full marks require clarity on why Popper's ontological claim is stronger than Lucas's methodological critique.
  *   **Common Loss:** Students lose marks here by concluding ambiguously or failing to deliver a decisive verdict on the colleague's claim.

  ***

  ### Confidence Note on Interpretive Stands

  **Confidence Level:** I am **80% confident** in the distinction drawn between Lucas's "regime-conditional" regularities and Popper's rejection of conditional historical laws. While Popper explicitly attacks "historicism" (laws of development), some interpreters argue he allows for conditional sociological laws within specific institutional frameworks. The model answer takes the stronger view that Popper's argument regarding the unpredictability of knowledge growth undermines even conditional laws of *development*, which is the specific target of *The Poverty of Historicism*.

  **Least Sure Point:** I am least sure of the sharpness of the distinction made in the model answer between **epidemiological feedback and social feedback** (specifically the claim that viruses do not mutate "because" they understand vaccines). While biologically accurate, evolutionary pressure driven by human intervention (antibiotic resistance) creates a parallel to the Lucas Critique that a sharp student might challenge. The answer treats this as "blind variation" versus "conceptual revision," but the boundary between blind biological adaptation and strategic social adaptation can be porous in philosophy of biology. I recommend verifying if your seminar covered evolutionary analogies in social science; if so, you may wish to soften the claim that biological systems never "react" to knowledge in ways that mimic historicism.
