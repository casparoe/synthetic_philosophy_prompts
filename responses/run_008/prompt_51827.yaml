      *   *Sneaking into a movie:* You watch without paying. The theater still runs the movie. Other seats might be empty.
      *   *Photocopying a book:* Closer to copying, but still involves physical media.
      *   *Best Fit:* "Sneaking into a concert/movie" or "Trespassing."
      *   *Why:* It captures unauthorized *use* without deprivation of the asset.
      *   *Conclusion Support:* Enforcement should focus on keeping unauthorized users out (access control) rather than treating them as thieves who took something away. Aggressive measures that hurt paying customers (like searching bags aggressively) might be counterproductive.

