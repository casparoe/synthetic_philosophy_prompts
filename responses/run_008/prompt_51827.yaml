  2.  **Deconstruct the Analogy (Theft vs. Piracy):**
      *   *Source Domain:* Physical Theft (Stealing a car/handbag).
      *   *Target Domain:* Software Piracy (Unauthorized copying).
      *   *Key Mapping Points:*
          *   Owner -> Software Company.
          *   Object -> Car/Handbag vs. Software Copy.
          *   Action -> Taking vs. Copying.
          *   Result -> Owner loses object vs. Owner retains object.
          *   Harm -> Deprivation of use vs. Potential loss of revenue.
          *   Morality -> Violation of property rights.

  3.  **Identify Correspondences (Where it holds):**
      *   Intent: Both involve acquiring something without paying.
      *   Rights: Both violate the owner's exclusive right to distribute/sell.
      *   Economic Harm: Both *can* result in lost revenue (though mechanisms differ).
      *   Legality: Both are generally illegal (though enforcement varies).

  4.  **Identify Disanalogies (Where it breaks):**
      *   *Rivalry/Scarcity:* Physical objects are rivalrous (if I take it, you can't use it). Software is non-rivalrous (copying doesn't deprive the owner).
      *   *Marginal Cost:* Physical objects have high marginal cost per unit. Software has near-zero marginal cost per copy.
      *   *Excludability:* Physical objects are naturally excludable (locks). Software requires artificial excludability (DRM, keys).
      *   *Harm Certainty:* Stealing a car definitely harms the owner (they lose the car). Pirating software *might* harm the owner (would the pirate have bought it anyway?).

  5.  **Identify Smuggled Features (Implicit assumptions):**
      *   Scarcity (the idea that using something consumes it).
      *   Direct deprivation (the owner loses *use*).
      *   Moral equivalence of action (taking vs. copying).
      *   Zero-sum game implication.

  6.  **Evaluate the Enforcement Conclusion:**
      *   Does the break in the analogy matter for enforcement?
      *   If harm is less direct (lost potential sale vs. lost asset), does aggressive enforcement (DRM, phone-home) still make sense?
      *   Aggressive enforcement often harms legitimate users (friction). In physical theft, locks don't hinder the owner much. In software, DRM hinders the owner (the paying customer) too.
      *   Conclusion: The analogy overstates the harm and justifies measures that might cost more in goodwill than they save in recovered revenue.

  7.  **Find a Better Analogy:**
