answer: |-
  This is a profound objection, and you are right to feel that something is missing. If we accept the "different selves" interpretation too readily, weakness of will (akrasia) dissolves into mere preference change. If Monday-You and Thursday-You are effectively different people, then Thursday-You isn't weak; he's just a different guy with different tastes. There is no failure, no betrayal, and no reason to feel guilty.

  However, this conclusion relies on a specific, and I argue mistaken, view of what constitutes the "self." To talk you out of your worry, I want to argue that hyperbolic discounting does not fragment the agent; rather, it reveals a structural flaw *within* a single, extended agent. The weakness lies not in the fact that preferences change, but in the *predictable irrationality* of that change and the failure of the extended self to manage it.

  Here is the case for why hyperbolic discounting genuinely explains weakness of will, rather than explaining it away.

  ### 1. The Illusion of "Different Agents"
  Your worry rests on the idea that if Thursday-You prefers the couch, that preference is "wholehearted." But hyperbolic discounting suggests something more subtle is happening. It isn't that your values have changed (like realizing you no longer like jazz); it is that your *valuation mechanism* is being distorted by proximity.

  Consider an optical illusion. If you look at a stick half-submerged in water, it looks bent. Your visual system is reporting "bent." If you act on that report, you are acting on your current visual preference. But we don't say your visual system is "a different agent" than your rational mind. We say your visual system is subject to a refractive error.

  Hyperbolic discounting is a refractive error of desire. On Monday, you value health at 10 and comfort at 5. On Thursday, you value health at 4 and comfort at 6. The *object* (health) hasn't changed. Your *principles* haven't changed. Only the temporal distance has. If the only variable changing the output of your decision-making machine is proximity, that machine is dynamically inconsistent.

  Weakness of will is not just doing what you want; it is acting on a valuation that you know is distorted. When you stand at the fridge, the "yelling voice" you describe is the signal from your undistorted valuation (Monday's perspective) trying to penetrate the distortion of the present moment. The weakness is the failure of your cognitive control to correct for the distortion. If you were truly just a "Thursday agent" with new preferences, you wouldn't feel the conflict. The fact that you *do* feel the conflict proves the agent is singular and stretched over time.

  ### 2. First-Order vs. Second-Order Desires
  To understand where the "weakness" hides in the math, we need to distinguish between what you want to *do* and what you want to *want*.

  Philosopher Harry Frankfurt described this as first-order desires (I want to eat this cake) and second-order desires (I want to be the kind of person who values health over cake). Weakness of will occurs when you act on a first-order desire that violates your second-order desire.

  Hyperbolic discounting explains the *mechanism* of this violation. As a reward gets closer, its "magnetic pull" (first-order desire) increases hyperbolically. Your long-term values (second-order desires), however, remain relatively stable.
  *   **Monday:** The magnetic pull of the gym is strong enough to align with your second-order desire.
  *   **Thursday:** The magnetic pull of the couch spikes so steeply that it overpowers your second-order desire.

  The weakness is not that Thursday-You has a new preference. The weakness is that your will is held captive by the immediacy of the stimulus. You are not "wholeheartedly" choosing the couch; you are being *pulled* by it in a way that you, as an extended agent, reject. If the hyperbolic discounting model were false, and you were just a different person on Thursday, you would open the fridge and feel nothing but neutral satisfaction. Instead, you feel guilt. That guilt is the data point proving the self is unified. The discounting model explains why the unified self loses the tug-of-war.

  ### 3. The Extended Agent and Self-Betrayal
  You asked: *Which self should count as the agent?*

  If we define the agent as the "momentary time-slice," then yes, there is no weakness. But no one lives as a momentary time-slice. We live as narratives. We make promises to ourselves. We suffer consequences for past actions. The "Extended Self" is the only agent that actually exists in a meaningful moral sense.

  Can an extended agent betray itself? Absolutely. Betrayal requires trust. On Monday, your Extended Self trusts your Future Self to execute a plan. Hyperbolic discounting makes that trust mathematically fragile. When Thursday arrives, the Local Self defects.

  This is where the explanation holds: **Weakness of will is the failure of the Extended Self to bind the Local Self.**

  If hyperbolic discounting is real, then "willpower" alone is a flawed strategy because it relies on the Local Self fighting a mathematical bias in real-time. The "weakness" is the reliance on a system that we know is prone to flipping. The person who recognizes hyperbolic discounting and uses commitment devices (e.g., buying non-perishable food, scheduling a trainer who charges a cancellation fee) is not weak. The person who knows their preferences will flip and *still* leaves themselves vulnerable to the flip is the one exhibiting weakness.

  Therefore, the discounting story doesn't remove the blame; it relocates it. The failure isn't just the act of eating the snack; the failure is the failure to anticipate the preference reversal.

  ### 4. Why This Explanation is Better Than "Different Selves"
  If we accept your worry—that Thursday-You is a different agent—we lose the ability to learn or change. If Thursday-You is a stranger, why should Monday-You try to constrain him? Why should Thursday-You care about Monday-You's plans? This leads to a fragmented life where no long-term project is possible.

  By accepting that hyperbolic discounting is a flaw *within* a single agent, we reclaim the possibility of self-control.
  1.  **It validates the conflict:** The pain you feel at the fridge is real. It is the friction between your Extended valuation and your Local distortion.
  2.  **It identifies the enemy:** The enemy isn't "you" on Thursday; the enemy is the *discount rate*.
  3.  **It offers a solution:** Since the weakness is a structural predictability, the cure is structural. You don't need to be a "better person" on Thursday; you need to be a smarter architect on Monday.

  ### Conclusion
  The hyperbolic discounting model does not say, "You wanted different things, so you did nothing wrong." It says, "Your valuation system is temporally inconsistent, causing you to act against your own stable interests."

  The weakness of will is precisely this inconsistency. It is the gap between the person who plans and the person who acts. If those were truly different people, the gap wouldn't hurt. The fact that it hurts—the fact that you feel you have *failed*—proves that you are one person stretching across time, and that your will is weak because it bends under the gravity of the present.

  Hyperbolic discounting explains *how* the bending happens. It doesn't excuse the bend. It shows that akrasia is not a mystery of the soul, but a hazard of temporal perspective. Recognizing this doesn't dissolve your agency; it gives you the map you need to navigate it.
