      *   *The Smoke:* This is a reductio ad absurdum of physicalizing the infinite. If the book is infinite pages, it has infinite thickness. It wouldn't fit in a hand. Borges hand-waves this ("The cover seemed leather..."). I must point out this physical impossibility to students.

  8.  **Drafting - The "What it Adds" Conclusion:**
