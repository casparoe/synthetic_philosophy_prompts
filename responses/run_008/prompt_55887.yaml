      *   *Address specific questions?* Yes (Potential/Actual, Math facts, Finitism).
      *   *Tone:* Academic but accessible for an intro course.

  10. **Final Polish:** Ensure clear headings. Make sure the distinction between epistemic (we can't find it) and metaphysical (it doesn't exist to be found) is sharp. (Self-Correction: Make sure to mention that Borges was actually quite interested in infinity and Zeno's paradoxes, so he isn't entirely naive, but he prioritizes poetry over proof.)

