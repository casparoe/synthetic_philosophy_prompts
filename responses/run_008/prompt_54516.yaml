  8.  *(Final Mental Check of the "Move 37" argument)*: Brother says engineers didn't understand Move 37. Wife says they understood the *process*. This is the distinction between *interpretabilty* and *capability*. I need to make sure that's clear.

  9.  *(Final Mental Check of Dennett)*: Dennett explicitly discusses AI in *From Bacteria to Bach and Back*. He argues AI *is* competence without comprehension, but acknowledges the designers. He treats the designers as part of the "crane" lifting the competence. So the Brother is closer to Dennett's *spirit*, but the Wife is closer to the *causal history*.

