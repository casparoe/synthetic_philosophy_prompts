prompt: |-
  Each year the World Happiness Report ranks countries by asking roughly a thousand people in each one to imagine a ladder whose top step is the best possible life for them and whose bottom step is the worst, and to place their current life on it; the country averages are published as a ranking of the happiest countries, newspapers report the top spots as though the question were settled, and a few governments have begun treating their position in it as a policy target, complete with ministers and national programmes assigned to it. What does this practice presuppose about happiness? That it is a single subjective quantity reportable on one scale; that my best possible life is commensurable with yours; that a 7 given in one culture means what a 7 given in another means; that how people evaluate their lives tracks how their lives actually go? Distinguish what the practice strictly requires from what it merely sits comfortably with, say where it is philosophically underdetermined enough that a hedonist, a life-satisfaction theorist, and an objective-list theorist could each sign off on the same ranking, and tell me what would concretely have to change, both in the survey and in what governments measure and pursue, if a country decided to treat the ranking as a target while holding an objective-list theory of well-being rather than a subjective one. Continuous prose only, please: no headings, bullet points, bold text, or tables.
