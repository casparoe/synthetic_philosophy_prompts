answer: |-
  ### I. The Empirical Baseline: Settled Facts vs. Contested Interpretations

  To analyze the theory of value presupposed by planetary protection (PP), we must first distinguish the procedural realities from the ethical interpretations.

  **Settled Empirical Facts:**
  *   **Regulatory Framework:** Planetary protection is codified in Article IX of the 1967 Outer Space Treaty and implemented through guidelines by the Committee on Space Research (COSPAR).
  *   **Operational Protocols:** Spacecraft bound for "sensitive" bodies (e.g., Mars, Europa) undergo biological cleaning (dry heat microbial reduction, chemical cleaning) and are assembled in ISO-class clean rooms.
  *   **Categorization:** Missions are assigned categories (I–V) based on the target body and mission type (flyby, orbiter, lander). Category V (restricted Earth return) and Category IV (Mars lander) involve the strictest constraints.
  *   **Site Constraints:** Mission trajectories and landing sites are selected to minimize the probability of impact on "Special Regions" (areas where Earth microbes could replicate or where native life is most likely).
  *   **Risk Acceptance:** Agencies accept a non-zero probability of contamination via launch failure (uncontrolled re-entry or explosion), provided the probability remains below a specific threshold (typically $10^{-4}$ per mission for Mars orbiters).
  *   **Long-term Goals:** Major space agencies (NASA, ESA) and private partners explicitly list human exploration and sustained presence on Mars as long-term strategic goals.
  *   **Terraforming Status:** Terraforming remains a theoretical concept discussed in scientific and public forums but is not currently an active engineering program or policy objective of any space agency.

  **Contested Questions:**
  *   **The "Why":** There is no consensus on whether PP is driven solely by scientific self-interest, environmental ethics, or legal obligation.
  *   **Moral Status:** There is no agreement on whether extraterrestrial microbial life possesses intrinsic moral standing.
  *   **Consistency:** It is contested whether current PP protocols are logically compatible with eventual human colonization.
  *   **Value of Pristineness:** It is debated whether a planet has value *as* a pristine object, independent of its utility to science or life.

  ---

  ### II. Candidate Theories of Value and Explanatory Power

  We evaluate the four candidate theories based on how well they explain the *shape* of the practice: its severity, its site-sensitivity, and its risk tolerance.

  #### 1. The Deflationary/Methodological View
  *   **Theory:** PP is purely instrumental. Contamination is bad only because it confounds data (false positives) or compromises future experiments (false negatives).
  *   **Explanatory Fit:** This aligns perfectly with official agency statements ("protecting scientific integrity"). It explains the focus on instrument hygiene and the categorization of missions based on scientific potential.
  *   **Tensions:** It struggles to explain constraints that significantly reduce mission success probability without guaranteeing scientific gain (e.g., abandoning a landed spacecraft in a sensitive zone rather than moving it). It also poorly explains the strictness applied to *future* sites where no instruments currently exist; if the goal is only current data, protecting empty terrain is less rational.
  *   **Risk Tolerance:** Fits the acceptance of launch failure risks as a cost-benefit analysis (risk of contamination vs. cost of mission loss).

  #### 2. The Precautionary Principle
  *   **Theory:** We must avoid irreversible harm to potential life forms whose significance we cannot yet assess. The burden of proof lies on the contaminator.
  *   **Explanatory Fit:** This strongly explains **site-sensitivity**. The stricter the protection, the higher the potential for native life (e.g., Europa vs. the Moon). It explains the severity of sterilization requirements even when scientific instruments could theoretically distinguish Earth microbes from alien ones.
  *   **Tensions:** It creates a "paralysis by analysis" problem. If we cannot assess significance until we investigate, but investigation risks contamination, the principle could logically forbid all contact.
  *   **Risk Tolerance:** Fits the low tolerance for intentional contamination but requires complex modeling to justify the accepted risk of launch failures.

  #### 3. Intrinsic Value of Pristineness (Integrity/Aesthetic)
  *   **Theory:** Celestial bodies have value in their natural state, analogous to wilderness preservation on Earth. Contamination is a form of desecration or loss of integrity.
  *   **Explanatory Fit:** Explains the emotional and rhetorical weight given to "protecting Mars." It accounts for the reluctance to send humans (walking ecosystems) even when robotic sterilization limits are reached.
  *   **Tensions:** Space agencies do not officially endorse this view. It is difficult to reconcile with the extraction of resources (ISRU) planned for human missions.
  *   **Risk Tolerance:** Would likely demand lower risk thresholds for launch failures than currently accepted, as any debris is a violation of integrity.

  #### 4. Moral Status of Microbial Life
  *   **Theory:** Extraterrestrial life, even microbial, has rights or moral standing that forbid harm or extinction.
  *   **Explanatory Fit:** Explains the extreme care taken to avoid "Special Regions."
  *   **Tensions:** This is the least supported by official policy. If microbes had moral status comparable to sentient life, PP would likely be far more restrictive (potentially banning landers entirely).
  *   **Risk Tolerance:** Would likely view *any* risk of contamination via launch failure as morally unacceptable, not just statistically manageable.

  ---

  ### III. Philosophical Underdetermination

  The current practice of planetary protection is **axiologically underdetermined**. This means the observable protocols are compatible with multiple, mutually exclusive theories of value.

  *   **Sterilization:** Cleaning a spacecraft is consistent with *Methodological* goals (clean data), *Precautionary* goals (prevent spread), and *Moral* goals (do no harm). The practice itself does not reveal which motive is primary.
  *   **Site Selection:** Avoiding a specific canyon could be because it is scientifically interesting (Methodological) or because it is ecologically fragile (Precautionary/Intrinsic).
  *   **The "Human Exception":** The current practice creates a distinction between robotic and human missions. Robots must be sterile; humans will not be.
      *   *Underdetermination:* This distinction is licensed by the **Methodological** view (humans carry instruments that can distinguish contamination) and a **Pragmatic Precautionary** view (we accept higher risk for human exploration).
      *   *Conflict:* This distinction is *not* licensed by the **Moral Status** or **Intrinsic Value** views. If microbes have rights or Mars has integrity, a human breathing on the surface violates those values just as a dirty robot does.

  **Where the Practice is Underdetermined:**
  The practice does not specify *when* protection ends. Is it permanent? Until life is found? Until humans arrive? The current guidelines function as a "holding pattern," deferring the axiological decision. This allows agencies to proceed without resolving the contested ethical questions.

  ---

  ### IV. Consistency with Settlement and Terraforming

  Is the practice consistent over time with endorsing settlement and terraforming?

  **1. Settlement (Human Presence)**
  *   **Strict Presupposition:** PP strictly presupposes that **scientific value is prioritized over settlement in the near term.** It does not strictly presuppose that settlement is forbidden forever.
  *   **The Tension:** Settlement makes strict PP impossible. Humans shed $10^{14}$ microbes. To reconcile PP with settlement, agencies are shifting from *prevention* to *management* (e.g., designating "Science Protection Zones" where humans cannot go, while allowing settlement elsewhere).
  *   **Consistency Check:**
      *   *Consistent with:* Methodological View (we protect specific science sites, settle elsewhere) and Weak Precautionary View (we explored robotically first to assess risk).
      *   *Inconsistent with:* Strong Intrinsic Value (Mars as wilderness) and Moral Status of Microbes (human presence is inherently invasive).
  *   **Verdict:** The practice is *pragmatically* consistent but *logically* tense. It relies on the assumption that scientific value is localized (specific sites) while settlement value is broad. If native life is ubiquitous, PP and settlement become incompatible.

  **2. Terraforming**
  *   **Strict Presupposition:** PP presupposes that **native biospheres (if they exist) have value that precludes their deliberate extinction.**
  *   **The Tension:** Terraforming is, by definition, the global alteration of an environment to suit Earth life, which would likely extinguish native Martian life.
  *   **Consistency Check:**
      *   *Consistent with:* Methodological View (once science is "done," the planet is a resource).
      *   *Inconsistent with:* Precautionary Principle (we cannot know the significance of the biosphere), Intrinsic Value (planetary integrity), and Moral Status (right to exist).
  *   **Verdict:** Current PP practice is fundamentally **inconsistent** with terraforming *if* native life exists. PP operates on the assumption that we must preserve the option of studying native life. Terraforming closes that option irreversibly. Therefore, PP presupposes a "preservation until further notice" stance that terraforming violates.

  ---

  ### V. Counterfactual Practices: What if Each Theory Were Operative?

  To clarify what the current practice presupposes, we can contrast it with what practice would look like if one theory were definitively dominant.

  | Candidate Theory | How Practice Would Differ from Current Norms |
  | :--- | :--- |
  | **Purely Methodological** | **Less Severe.** Sterilization would be calibrated only to the sensitivity of specific instruments, not the general environment. Launch failure risks would be higher (cost-benefit). Human missions would face minimal biological constraints. "Special Regions" would be accessible if instruments could distinguish contaminants. |
  | **Precautionary Principle** | **More Severe / Indefinite.** No human landing until the planet is proven sterile (which may be impossible). "Special Regions" would be permanent no-go zones. Terraforming would be prohibited by international treaty. Launch failure tolerance would be near-zero. |
  | **Intrinsic Value (Integrity)** | **Wilderness Model.** Large portions of Mars would be designated as protected preserves, off-limits to settlement or resource extraction, similar to Earth's Antarctic Treaty or National Parks. Contamination would be treated as "littering" or "vandalism," not just data loss. |
  | **Moral Status of Microbes** | **Non-Interference.** Potentially no landers at all if there is a risk of harming life. If life is found, all exploration might halt to avoid "contact harm." Human settlement would be ethically impermissible if it displaces native life. |

  ---

  ### VI. Conclusion: The "Modus Vivendi" of Planetary Protection

  The practice of planetary protection does not strictly presuppose a single, coherent theory of value. Instead, it operates as a **modus vivendi** (a pragmatic compromise) between conflicting values.

  1.  **What is Settled:** The practice prioritizes **scientific access** in the short term over **human expansion** in the short term. It treats potential native life as a **resource for knowledge** that is vulnerable to destruction by Earth life.
  2.  **What is Contested:** Whether that vulnerability is merely epistemic (we lose knowledge) or ontological (the life itself is harmed/lost).
  3.  **The Operational Presupposition:** The practice presupposes a **temporal hierarchy of values**:
      *   *Phase 1 (Robotic):* Pristineness and Scientific Integrity are paramount.
      *   *Phase 2 (Human):* Human Presence and Settlement become paramount; Pristineness is managed/compromised.
      *   *Phase 3 (Terraforming):* Human Habitability becomes paramount; Native Integrity is potentially sacrificed.

  This hierarchy resolves the tension not by solving the ethical problem, but by deferring it. The practice is consistent with settlement only if one accepts that the value of Martian science is exhaustible. It is inconsistent with terraforming if one accepts that native biospheres have value independent of human utility. Consequently, the current practice fits best with a **Weak Precautionary Principle** grounded in **Methodological Self-Interest**: *Protect the science until we know what is there, then decide if it is worth saving.* This leaves the deeper ethical questions—whether microbes have rights or planets have integrity—deliberately unanswered.
