prompt: |-
  Space agencies treat the contamination of other worlds as a serious problem: under the Outer Space Treaty's contamination provisions, missions to Mars and Europa are assigned planetary-protection categories, spacecraft are assembled in clean rooms, components are cleaned or heat-treated to reduce their microbial load, and mission designs are sometimes constrained — lander sites chosen, drilling depth limited, hardware abandoned rather than moved — specifically to keep Earth microbes away from places where native life might exist or be findable. The stated rationale is partly scientific: a contaminated Mars is a worse object of study. But the requirements have grown more demanding in proportion to how promising a site looks for life, which suggests something beyond instrument hygiene is doing the work. Meanwhile, the same institutions and much of the interested public treat the eventual human settlement of Mars as a long-term aspiration, even though human settlement makes sterility impossible — we are walking ecosystems — and beyond settlement sits terraforming, the deliberate conversion of a planet into a habitat, which would extinguish or radically displace whatever native biosphere might be there.

  What theory of value does the practice of planetary protection presuppose? Candidates worth distinguishing: that microbial life has some kind of moral status; that pristine or uncontaminated conditions have a value of their own, aesthetic or integrity-based; a precautionary principle about irreversibly destroying something whose significance we cannot yet assess; and the deflationary reading that it is purely methodological, about clean instruments and good science. Which of these, if any, can explain the observed shape of the practice — its severity, its site-sensitivity, and its tolerance for the risk that launch failures themselves deposit contaminated debris on Mars? And is the practice consistent, over time, with endorsing settlement and terraforming, or does it presuppose a view of value that those later projects violate? Please distinguish what planetary protection strictly presupposes from what it merely fits well with, identify where the practice is philosophically underdetermined such that several rival theories would license it as it stands, and say what the practice would have to look like if each of the main candidate views were the operative one. Throughout, please separate what is settled — the empirical facts about what the practice is, and any points of genuine agreement among people who have thought about it — from what is genuinely contested, such as the moral status of microbes or the value of pristine environments, and do not present any particular resolution of those contested questions as if it were the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** Planetary Protection (PP) practices by space agencies (NASA, ESA, etc.).
      *   **Key Tension:** PP treats contamination seriously (clean rooms, site constraints, etc.) *vs.* long-term goals of human settlement and terraforming (which imply inevitable contamination and potential extinction of native life).
      *   **Task:** Analyze the *theory of value* presupposed by PP practices.
      *   **Candidate Theories:**
          1.  Moral status of microbial life.
          2.  Intrinsic value of pristine conditions (aesthetic/integrity).
          3.  Precautionary principle (irreversible loss of unknown significance).
          4.  Deflationary/Methodological (purely for good science).
      *   **Specific Questions to Address:**
          *   Which theory explains the *shape* of the practice (severity, site-sensitivity, tolerance for launch failure risks)?
          *   Is PP consistent with settlement/terraforming over time?
          *   Distinguish what PP *strictly presupposes* vs. what it *fits well with*.
          *   Identify where the practice is *philosophically underdetermined*.
          *   Describe what practice would look like under each candidate view.
          *   **Crucial Constraint:** Separate *settled* facts (empirical, procedural) from *contested* questions (moral status, intrinsic value). Do not present contested resolutions as consensus.

  2.  **Initial Assessment & Fact-Checking (Settled vs. Contested):**

      *   *Settled:* PP exists (COSPAR guidelines, Outer Space Treaty Art. IX). Missions are categorized (Cat I-V). Clean rooms are used. Bioburden reduction is standard. Site selection is influenced by PP (e.g., avoiding "Special Regions" on Mars). Human settlement is a stated goal by agencies (Artemis, Mars colonization concepts). Terraforming is a theoretical long-term concept often discussed in public/academic spheres, though less officially in current mission planning.
      *   *Contested:* *Why* we do it. Is it just for science? Do microbes have rights? Is Mars "sacred"? Does the current practice logically entail a ban on colonization? There is no consensus on the ethics of extraterrestrial life.

  3.  **Analyzing the Candidate Theories against the Practice:**

      *   *Deflationary (Good Science):*
          *   *Fit:* Explains the focus on instrument hygiene. Explains why we don't want false positives.
          *   *Mismatch:* Doesn't fully explain *abandoning hardware* or *limiting drilling depth* if the instrument could still work. Doesn't explain the severity of constraints on *future* human missions (which are acknowledged as impossible to sterilize). If it were *only* science, we might accept higher risk for higher reward data.
          *   *Practice implication:* Focus on calibration, controls, and documentation rather than absolute sterilization.

      *   *Precautionary Principle:*
          *   *Fit:* Explains site-sensitivity (high potential for life = high protection). Explains severity (better safe than sorry). Explains tolerance for launch failure risks (we accept some risk to prevent *certain* contamination of high-value sites).
          *   *Mismatch:* Hard to reconcile with eventual settlement. Precaution usually implies "don't do it until you know," but settlement implies "do it even if we don't know."
          *   *Practice implication:* Strict no-go zones until proven sterile. Potentially halting human missions.

      *   *Intrinsic Value (Primitivity/Integrity):*
          *   *Fit:* Explains the desire to keep Mars "pristine." Explains the discomfort with terraforming.
          *   *Mismatch:* Space agencies don't officially endorse this. It's more of an environmental ethic (like wilderness preservation).
          *   *Practice implication:* Permanent protected areas, similar to Earth's wilderness preserves.

      *   *Moral Status of Microbes:*
          *   *Fit:* Explains the extreme care.
          *   *Mismatch:* Very few ethicists or agencies explicitly claim microbes have *rights*. Usually, it's about value to *humans* (science).
          *   *Practice implication:* Would require something like "non-maleficence" toward aliens, potentially banning colonization entirely.

  4.  **Addressing the Tension (PP vs. Settlement/Terraforming):**

      *   *Current Stance:* Agencies treat PP as a *phase*. Robotic exploration first (strict PP). Human exploration later (relaxed PP, "human planetary protection" is a developing field).
      *   *Logical Consistency:* If PP is purely methodological, settlement is fine (we just lose some science). If PP is ethical (precaution/intrinsic), settlement is problematic.
      *   *The "Bridge":* The concept of "Scientific Preservation." We protect it *until* we know what it is. Once we know (or decide to settle), the value shifts.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Define the scope. Acknowledge the tension. State the goal: analyzing the axiological (value) underpinnings without resolving the ethical debates.
      *   **Settled Facts (The Empirical Baseline):** List what actually happens (COSPAR, Treaty, Clean Rooms, Categorization). Acknowledge the stated goal (scientific integrity). Acknowledge the long-term human goal.
      *   **Candidate Theories & Explanatory Power:**
          *   *Methodological:* Strongest official fit. Weakness: Doesn't explain constraints that reduce mission success probability significantly.
          *   *Precautionary:* Strong fit for site sensitivity. Weakness: Inconsistent with long-term colonization plans.
          *   *Intrinsic Value:* Weak official fit, strong philosophical fit for the *severity*.
          *   *Moral Status:* Weakest official fit.
      *   **Underdetermination:** Where do multiple theories work? (e.g., sterilization can be for science *or* ethics). Where do they diverge? (Human landing).
      *   **Consistency with Settlement/Terraforming:** This is the crux. PP is currently a "holding pattern." It presupposes a *temporal* hierarchy of values (Science first, Settlement later). This is a pragmatic compromise, not a logical necessity.
      *   **Counterfactuals:** What would practice look like if Theory X were dominant? (e.g., If Moral Status were dominant -> No human missions. If Methodological -> More risk acceptance).
      *   **Conclusion:** Summarize the ambiguity. The practice is a modus vivendi between conflicting values.

  6.  **Refining the Tone:**

      *   Must remain neutral on the *truth* of the ethical claims.
      *   Must clearly label "Settled" vs. "Contested."
      *   Must answer the specific prompt requirements (distinguish presupposition vs. fit, identify underdetermination).

  7.  **Self-Correction/Nuance Check during Drafting:**

      *   *Correction:* I initially thought about saying PP *forbids* terraforming. *Correction:* No, PP guidelines apply to *missions*, not long-term policy. Terraforming is outside current PP scope. I need to make sure I don't claim PP *regulates* terraforming, but rather that the *values* behind PP might conflict with it.
      *   *Nuance:* The prompt mentions launch failure risks. This is key. If it were purely about science, a launch explosion spreading debris might be acceptable risk vs. reward. If it's precautionary, that risk is weighed heavily. Actually, PP *does* account for launch failure probability (probability of impact). This supports the Precautionary/Methodological mix.
      *   *Nuance:* "Human settlement makes sterility impossible." This is the "Walking Ecosystem" argument. I need to highlight how agencies are currently trying to create "Human Planetary Protection" guidelines to manage this, acknowledging the shift from *prevention* to *management*.

  8.  **Final Polish:** Check against the "Settled vs. Contested" constraint. Ensure I'm not saying "Microbes have no rights" as fact, but "There is no consensus on microbial rights." Ensure I'm not saying "PP is inconsistent with colonization" as fact, but "There is a tension regarding consistency."

      *(Self-Correction on "Settled"):* Is it settled that agencies treat contamination as a "serious problem"? Yes, evidenced by budget and protocol. Is it settled that settlement is an aspiration? Yes (Artemis, SpaceX/NASA partnership goals). Is it settled that terraforming is a goal? No, that's more speculative/futurist. I should qualify the terraforming part as "hypothetical long-term" rather than "agency policy."

      *(Refining the "Theory of Value"):* The prompt asks what theory the *practice* presupposes. This is tricky. Practices often presuppose less than we think (pragmatism). I should argue that the practice is *axiologically thin* officially but *axiologically thick* in implication.

      *(Structure Plan):*
