      *   *Is Clay really Matter?* Yes, usually treated as "the matter." Planks are "the parts." This is a crucial mereological distinction.
      *   *Make sure to address the study group's error:* They are treating "squashing" like "plank replacement." Squashing destroys the statue. Replacing planks (usually) preserves the ship. This highlights the sortal difference.

  7.  **Final Polish:** Organize with clear headings. Ensure the "Audit" format is clear. (Mapping -> Disanalogies -> The Reassembly Bridge -> Verdict on Prof).

  *(Self-Correction during final review)*: Make sure I don't get bogged down in defining "Endurantism" vs "Perdurantism" too deeply, but use them to explain *why* the prof might think they are the same. The core issue is Synchronic vs Diachronic.

