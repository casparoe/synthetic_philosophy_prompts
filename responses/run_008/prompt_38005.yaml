answer: |-
  # The Specification of 'If'

  The ordinary indicative conditional is the workhorse of human reasoning. It is the 'if' of the weather forecast ('if it rains, the match is off'), the bookmaker's ledger ('if the horse wins, you are paid'), and the daily promise ('if you wash up, I will dry'). It is distinct from the 'if' of fantasy or counterfactual speculation ('if I were king...'). Yet, despite its ubiquity, logicians and philosophers have struggled for a century to pin down its logic. The trouble crystallised in the 1970s with David Lewis's triviality results, which demonstrated that certain intuitive demands we place on 'if' are mathematically incompatible.

  Before we can judge any theory of the conditional, we must define what success looks like. Below is the specification. It comprises ten desiderata that an adequate theory of the ordinary indicative conditional ought to meet. Each is marked as either 'Non-negotiable' (a baseline requirement for the concept to function) or 'Contested' (a point where philosophical camps diverge).

  ### 1. The Betting Standard (Adams' Thesis)
  **Status:** Non-negotiable.
  **The Case:** Imagine a bookmaker offers you a bet on the statement: 'If it rains tomorrow, the cricket match will be cancelled.' She prices the bet exactly according to your degree of belief in the cancellation *given* that it rains. If you think there is a 90% chance of cancellation given rain, you should be willing to buy the ticket for 90p. If the theory of 'if' is to match our practice, the probability of the conditional statement must equal the conditional probability of the consequent given the antecedent. A theory that severs this link fails to describe how we actually use conditionals to navigate uncertainty.

  ### 2. The Voided Stake
  **Status:** Non-negotiable.
  **The Case:** Consider the bet above. Suppose tomorrow dawns bright and sunny. It does not rain. The antecedent is false. In ordinary practice, the bet is called off; you get your money back, and the bookmaker keeps hers. You have neither won nor lost. The conditional is not treated as 'true' simply because the rain failed to arrive, nor 'false' because the match went ahead. A theory must account for this third status—voidness or irrelevance—when the antecedent fails, distinguishing it from a simple claim about the world that turns out to be false.

  ### 3. The Rule of Detachment (Modus Ponens)
  **Status:** Non-negotiable.
  **The Case:** This is the fundamental engine of inference. If you accept 'If A, then B' and you subsequently discover 'A', you must be compelled to accept 'B'. If a theory of 'if' blocks this move, it renders the conditional useless for reasoning. If I believe 'If the switch is flipped, the light goes on' and I see the switch is flipped, I must conclude the light is on. Any logic that invalidates this is not a logic of the ordinary conditional.

  ### 4. The Limit on Addition (Rejection of Strengthening)
  **Status:** Non-negotiable.
  **The Case:** In standard logic, if a premise supports a conclusion, adding more information to the premise should not undermine it. But 'if' does not work this way. Consider a match: 'If the match is struck, it will light.' This is generally acceptable. However, 'If the match is struck and it is soaked in water, it will light' is false. Adding the information 'it is soaked' destroys the connection. A theory must explain why we can assert the first conditional but reject the second, despite the second antecedent containing the first.

  ### 5. The Oswald Distinction (Indicative vs. Counterfactual)
  **Status:** Non-negotiable.
  **The Case:** We must distinguish the indicative 'if' from the subjunctive or counterfactual 'if'. Take the assassination of John F. Kennedy. The indicative 'If Oswald did not shoot Kennedy, someone else did' is widely accepted as true (given the belief that there was a conspiracy or a lone gunman, but definitely a shooter). However, the counterfactual 'If Oswald had not shot Kennedy, someone else would have' is widely rejected (implying a conspiracy that likely didn't exist). The two sentences look similar but carry different truth conditions. A theory of the *indicative* must not collapse into the theory of the *counterfactual*, or it will get this case wrong.

  ### 6. The Power of Combination (Embeddability)
  **Status:** Contested (but highly preferred).
  **The Case:** We routinely embed conditionals inside larger sentences. We say, 'Either if it rains the match is off, or if it is windy the match is off.' We say, 'It is not the case that if he calls, I will answer.' We say, 'I believe that if she comes, she will be late.' A robust theory should allow conditionals to function as building blocks within negations, disjunctions, and belief reports without breaking the logical machinery. If conditionals cannot be embedded, our ability to reason about complex scenarios is severely curtailed.

  ### 7. The Ladder of Ifs (Import-Export)
  **Status:** Contested.
  **The Case:** Consider the iterated conditional: 'If A, then if B, C.' Intuitively, this seems equivalent to 'If (A and B), then C.' For example, 'If the switch is flipped, then if the bulb is intact, the light will go on' feels the same as 'If the switch is flipped and the bulb is intact, the light will go on.' This principle, known as Import-Export, simplifies complex reasoning. A theory should ideally validate this equivalence, allowing us to stack conditionals without changing the underlying meaning.

  ### 8. The Demand for Truth (Truth-Conditionality)
  **Status:** Contested (The Crux).
  **The Case:** We treat conditionals as claims about the world that can be true or false. When I say 'If it rains, the match is off,' I am stating something that either corresponds to reality or it does not. A traditional semantic theory demands that every meaningful declarative sentence has truth conditions—conditions under which it is true and conditions under which it is false. Without this, it is difficult to explain how conditionals fit into the broader network of logic and truth.

  ### 9. The Impossible Case
  **Status:** Contested.
  **The Case:** What do we say about 'If 2 + 2 = 5, then the moon is made of cheese'? In classical logic, a conditional with an impossible antecedent is vacuously true. But in ordinary discourse, such sentences often feel nonsensical or undefined rather than strictly true. A theory should account for our intuition that reasoning from impossibilities is distinct from reasoning from mere falsehoods, without allowing every impossible antecedent to imply every consequent (the principle of explosion).

  ### 10. Certainty Preservation
  **Status:** Non-negotiable.
  **The Case:** If I am absolutely certain that A is true, and absolutely certain that B is true, I should be absolutely certain that 'If A, B'. It would be bizarre to be sure of the parts but unsure of the connection when the antecedent is known to be true. A theory must ensure that high probability in the components translates appropriately to high probability in the conditional, particularly when the antecedent is not in doubt.

  ***

  ### The Conflict: Why We Cannot Have It All

  Here lies the rub. The specification above is not a menu from which we can order freely; it is a system under tension. David Lewis's triviality results demonstrate that a specific subset of these desiderata is jointly unsatisfiable.

  The conflict arises primarily between **Desideratum 1 (The Betting Standard)**, **Desideratum 8 (The Demand for Truth)**, and the standard axioms of probability theory.

  Lewis proved that if we insist that conditionals have truth conditions (Desideratum 8)—meaning they are the kind of thing that can be true or false in a possible world—and we also insist that the probability of the conditional must always match the conditional probability (Desideratum 1), then our language collapses into triviality. Specifically, it implies that we can only hold degrees of belief that are 0 or 1. We would be unable to entertain uncertainties. We could not say 'there is a 50% chance that if it rains, the match is off'; we would be forced to say it is either certainly so or certainly not. Since we clearly do deal in uncertainties, one of the premises must go.

  In plain terms: You cannot have a conditional that is both a standard proposition (with a truth value) and perfectly tracks conditional probability in all cases. The map is too detailed for the territory; if you try to draw it, the paper tears.

  ### The Sacrifice

  Which desideratum should a reasonable theory give up?

  The most defensible move is to relinquish **Desideratum 8: The Demand for Truth**.

  We should accept that the ordinary indicative conditional does not express a proposition that is simply true or false. Instead, it expresses a *conditional assertion*. It is not a description of the world that can be checked against the facts in isolation; it is a rule for updating our beliefs should the antecedent turn out to be true.

  **The Cost:**
  Abandoning truth-conditionality comes at a steep price, specifically regarding **Desideratum 6 (Embeddability)**. If 'If A, B' has no truth value, it is difficult to see how it can function inside 'Not' or 'Or'. How can you negate something that isn't true or false? How can you say 'Either if A, B or if C, D' if the parts don't have truth values to make the disjunction true? A theory that drops truth conditions must work hard to explain why embedding *seems* to work, often by treating embedded conditionals as elliptical or by revising the logic of the operators surrounding them. It creates a fracture between how we use conditionals in isolation (betting, asserting) and how we use them in complex sentences.

  However, this cost is preferable to the alternative. If we keep Truth-Conditionality (Desideratum 8) to save Embedding, we must weaken The Betting Standard (Desideratum 1). This means admitting that the probability of 'If A, B' is *not* always $P(B|A)$. This severs the link between the conditional and rational decision-making, rendering the logic less relevant to how we actually forecast, bet, and promise. Given that the feature is concerned with the 'ordinary' conditional of forecasts and bets, preserving the link to probability is paramount.

  ***

  ### The Contenders

  We can now briefly measure the three leading candidates against this specification.

  **1. The Material Conditional**
  This theory identifies 'If A, B' with 'Not-A or B'.
  *   **Performance:** It satisfies Truth-Conditionality and Embedding perfectly. It validates Modus Ponens.
  *   **Failure:** It fails catastrophically on The Betting Standard (it implies conditionals with false antecedents are automatically true, violating the Voided Stake). It validates Strengthening of the Antecedent (contradicting the Match example). It collapses the Oswald Distinction, treating indicatives and counterfactuals identically. It is logically robust but semantically wrong for the ordinary 'if'.

  **2. The Suppositional View (No Truth Values)**
  Associated with philosophers like Dorothy Edgington and the late Richard Adams. This view holds conditionals lack truth conditions and express degrees of belief.
  *   **Performance:** It perfectly satisfies The Betting Standard and The Voided Stake. It handles the Oswald Distinction and the Rejection of Strengthening naturally.
  *   **Failure:** It explicitly sacrifices Truth-Conditionality. Consequently, it struggles with Embedding (Desideratum 6). It must treat sentences like 'If A, then if B, C' with great care, often relying on the Import-Export rule to make sense of iteration without truth values. It is the most psychologically realistic but logically fragmented.

  **3. The Stalnaker-style Possible-Worlds Semantics**
  This theory posits that 'If A, B' is true if B is true in the closest possible world where A is true.
  *   **Performance:** It retains Truth-Conditionality and handles Embedding well. It successfully distinguishes Indicatives from Counterfactuals (via different selection functions for 'closest' worlds). It blocks Strengthening of the Antecedent.
  *   **Failure:** To avoid Lewis's triviality, it must concede that The Betting Standard is not a strict identity. The probability of the conditional is only *approximately* the conditional probability, or holds only under specific constraints. It saves the logic at the expense of the precise probabilistic link that governs rational betting.

  ### Conclusion

  The ordinary indicative conditional is a concept under strain. We demand that it be a fact about the world, yet we use it as a tool for managing uncertainty. Lewis showed we cannot have both without contradiction. If we are to write a theory that respects the way people actually bet, forecast, and reason about matches and rain, we must accept that 'if' does not name a truth. It names a supposition. We pay for this honesty with the currency of logical complexity elsewhere, but it is the only price that keeps the ledger of human reasoning balanced.
