answer: |-
  You have independently reconstructed one of the central engines of contemporary epistemology. The configuration you are describing is widely known as **The Skeptical Paradox** (or sometimes **The Inconsistent Triad**).

  While there is no single psychological term for the "hovering" state you describe, the philosophical structure is precise. Epistemologists treat this triangle not as a cognitive illusion to be explained away, but as the primary *datum* that any theory of knowledge must accommodate.

  Here is the breakdown of the name, the definitions, the competing explanations, and how Elena's view (Nozick's) fits into the picture.

  ### 1. The Name and Definition

  The configuration is standardly formulated as an inconsistent triad of propositions. Using your example:

  1.  **The Ordinary Claim:** I know that I am holding a pen ($Kp$).
  2.  **The Skeptical Claim:** I do not know that I am not a brain-in-a-vat ($\neg K\neg h$).
  3.  **The Closure Principle:** If I know that I am holding a pen, and I know that holding a pen entails not being a brain-in-a-vat, then I know that I am not a brain-in-a-vat ($Kp \land K(p \to \neg h) \to K\neg h$).

  These three claims form a logical contradiction. You cannot hold all three simultaneously. However, as you observed, pre-theoretical intuition strongly pulls us toward accepting (1) and (2) while acknowledging the entailment in the antecedent of (3).

  The specific phenomenon you noticed—that people affirm (1) and (2) separately without feeling the logical explosion—is often discussed under the heading of **The Data of Fallibilism** or **The Stability of Skeptical Intuitions**. The philosopher **Keith DeRose**, in his seminal work on this topic, describes this as the conflict between our "ordinary" epistemic standards and our "skeptical" epistemic standards.

  **Distinction from Neighbors:**
  *   **Moore's Paradox:** As you correctly noted, Moore's paradox ("$P$, but I don't believe $P$") is a pragmatic contradiction regarding *assertion* and *belief*. Your triangle is about the transmission of *knowledge* across *entailment*.
  *   **Cognitive Dissonance:** In psychology, dissonance implies distress. The "hovering" you describe is distinct because people often do not feel distress; they simply treat the two claims as belonging to different "registers" of conversation. This lack of distress is what motivates **Contextualist** theories (more on that below).

  ### 2. Is it a Datum or an Illusion?

  Epistemologists generally agree that the *intuitions* behind (1) and (2) are robust data. The disagreement lies in which logical cost to pay to resolve the contradiction. There are four main camps:

  **A. The Skeptics (The Skeptical Verdict Wins)**
  *   **View:** Claim (2) is correct; Claim (1) is false.
  *   **Explanation:** We do not know we are holding a pen. The intuitive feeling that we do is a cognitive illusion caused by the low stakes of everyday life.
  *   **Cost:** We lose almost all knowledge.

  **B. The Mooreans / Dogmatists (The Ordinary Verdict Wins)**
  *   **View:** Claim (1) is correct; Claim (2) is false.
  *   **Explanation:** I *do* know I am not a brain-in-a-vat, precisely because I know I am holding a pen. The intuition that I don't know the skeptical hypothesis is the illusion.
  *   **Cost:** This feels intellectually arrogant to many (G.E. Moore famously held up his hands and said "Here is a hand" to prove the external world exists).

  **C. The Contextualists (Both Verdicts Win)**
  *   **View:** Both (1) and (2) are true, but at different times.
  *   **Explanation:** The word "know" is context-sensitive (like "tall" or "flat"). In ordinary contexts, the standards for knowledge are low, so (1) is true. In philosophical contexts where skeptical possibilities are mentioned, the standards rise, so (1) becomes false and (2) becomes true.
  *   **Why the "Hovering"?** This view best explains your observation. People "hover" because they are subconsciously shifting contexts. When you ask about the pen, they are in "ordinary mode." When you ask about the vat, they switch to "philosophical mode." They don't feel a contradiction because, semantically, there isn't one.

  **D. The Closure Deniers (Both Verdicts Win, Closure Loses)**
  *   **View:** (1) is true, (2) is true, and the entailment ($p \to \neg h$) is true, but the **Closure Principle (3) is false**.
  *   **Explanation:** Knowledge is *not* always transmitted across known entailment.
  *   **Who holds this?** This is **Elena's camp** (Robert Nozick and Fred Dretske).

  ### 3. Elena's View: Nozick and the Unwalked Bridge

  You asked whether Nozick's test merely *fits* the pattern or if there is a *principled story* for why the bridge should stay unwalked.

  Nozick provides a principled story. He argues that the Closure Principle is simply false as a general rule. His **Tracking Theory** defines knowledge not just as justified true belief, but as a belief that *tracks the truth* across possible worlds. Specifically, the **Sensitivity Condition**:

  > **Sensitivity:** If $P$ were false, you would not believe $P$.

  Here is the principled reason why the "inferential bridge" collapses for Nozick:

  1.  **The Pen:** If you were *not* holding a pen, you would not believe you were holding one (your vision would show empty hands). Your belief is **sensitive**. You know it.
  2.  **The Vat:** If you *were* a brain-in-a-vat, you **would still believe** you were not one (because the vat feeds you that experience). Your belief is **insensitive**. You do not know it.
  3.  **The Inference:** Even though "Holding a pen" logically entails "Not a vat," the *modal status* of the beliefs is different. Logical entailment preserves truth, but it does **not preserve sensitivity**.

  **The Principled Story:**
  Nozick argues that knowledge is a specific kind of relation to the fact—a causal or counterfactual hook-up. You can be hooked up to the pen (via vision) without being hooked up to the absence of the vat (because the vat scenario is designed to sever that hook-up). Therefore, valid deduction cannot create knowledge where the counterfactual connection is missing.

  For Nozick, the "hovering" you observe in ordinary people is actually correct: they know the pen, they don't know the vat, and logic doesn't force them to choose because **knowledge is not closed under entailment**. The "illusion" is not the verdicts, but the assumption that knowledge *must* flow through logical deduction.

  ### 4. Summary of the Landscape

  To answer your specific questions directly:

  *   **Established Name:** **The Skeptical Paradox** (specifically the Closure-based formulation). The pattern of intuitions is often called **The Inconsistent Triad**.
  *   **Defined/Distinguished:** It is defined by the tension between Ordinary Knowledge, Skeptical Ignorance, and Epistemic Closure. It is distinguished from Moore's Paradox because it concerns knowledge transmission, not belief assertion.
  *   **Datum or Illusion?** It is treated as a **genuine datum**. Most modern theories (Contextualism, Relevant Alternatives, Tracking) are designed specifically to preserve both the Ordinary and Skeptical verdicts without contradiction. Only hardline Skeptics and Mooreans treat one side as an illusion.
  *   **Which Verdict Wins?**
      *   **Contextualists:** Both win (context-dependent).
      *   **Nozick/Tracking:** Both win (Closure is false).
      *   **Skeptics:** Skeptical verdict wins.
      *   **Mooreans:** Ordinary verdict wins.
  *   **Nozick's Relation:** Nozick's theory is a **Closure-Denial** strategy. It does not just "fit" the pattern; it is *built* to explain it. The "unwalked bridge" is principled: inference preserves truth, but it does not preserve the counterfactual sensitivity required for knowledge.

  You have effectively identified the reason why Robert Nozick's *Philosophical Explanations* (1981) remains a landmark text. He was one of the first to argue that we should accept your friend's "bullet"—that we know ordinary things but fail to know the denial of skeptical hypotheses—and claim that this is not a bug in our epistemology, but a feature of what knowledge *is*.
