answer: |-
  You have identified a genuine and well-documented problem in the philosophy of history and science. The short answer is that the established term for this practice is **Causal Selection**.

  However, your observation about the *shifting criteria* (abnormality vs. depth vs. lesson) and the *hierarchical* nature of the choice (lifting one factor out as "deeper" than the rest) suggests that while "Causal Selection" is the correct umbrella term, it sometimes fails to capture the specific rhetorical move your historians are making.

  Here is a breakdown of the existing concepts, how they differ from your description, and a proposed refinement to help your book group discuss this without going in circles.

  ### 1. The Established Term: Causal Selection
  **What it is:** In philosophy (specifically the work of H.L.A. Hart, A.M. Honoré, and later David Lewis), "Causal Selection" refers to the pragmatic process of distinguishing "the cause" from the "background conditions" within a set of necessary factors.

  **How it fits:** It matches your description perfectly in one regard: it acknowledges that while many factors are causally relevant (the "causal field"), we linguistically and cognitively select only one or two to label as "the cause."

  **Where it differs:** Classical theories of Causal Selection (like Hart and Honoré's *Causation in the Law*, 1959) tend to focus on **abnormality** as the primary criterion. They argue we pick the factor that deviates from the normal course of events (e.g., the assassination) rather than the steady state (e.g., the alliance system). Your observation is sharper: you note that historians sometimes pick the *normal/entrenched* factor (the alliance system) if they are looking for "deep" causes. Standard Causal Selection theory doesn't always account for this flexibility in criteria.

  ### 2. The Mechanism for Shifting Criteria: Contrastive Explanation
  To explain *why* the criteria shift (why one historian picks the assassination and another picks the alliance system), philosophers of explanation (like Bas van Fraassen and Peter Lipton) use the concept of **Contrastive Explanation**.

  **The Concept:** We never ask "What caused X?" in a vacuum. We are always asking "What caused X *rather than Y*?"
  *   **Historian A** is implicitly asking: "Why did war break out in *1914* rather than *1915*?" The answer is the **assassination** (the abnormal trigger).
  *   **Historian B** is implicitly asking: "Why did Europe go to war in *1914* rather than *remaining at peace* like the previous century?" The answer is the **alliance system** (the structural precondition).

  **How it fits:** This solves your puzzle about the shifting standards. The historians agree on the facts (the INUS conditions) but disagree on the *contrast class*. They are answering different questions, so they select different causes from the same pile.

  ### 3. The Ontology: INUS Conditions
  You are correct about **INUS conditions** (a term coined by J.L. Mackie). It stands for an **I**nsufficient but **N**ecessary part of a condition which is itself **U**nnecessary but **S**ufficient.
  *   **The Pile:** The alliance system, nationalism, and mobilization schedules together form a "Sufficient" complex.
  *   **The Items:** Individually, they are "Insufficient."
  *   **The Status:** INUS describes the *metaphysical status* of the factors. It explains why no single factor is "the cause" in a physical sense.
  *   **The Gap:** As you noted, INUS describes the *ingredients*, not the *recipe selection*. It explains why the historians *could* disagree, but not *why* they choose to privilege one ingredient over another.

  ### 4. A Proposed Refinement: "Causal Privileging"
  While "Causal Selection" is the standard academic term, it implies a flat choice (picking one from a list). Your observation highlights a *hierarchical* move: historians aren't just picking a cause; they are ranking it as "deeper," "underlying," or "more significant" than the others. They are granting it explanatory authority.

  Because "Causal Selection" doesn't fully capture this hierarchical/rhetorical dimension, I propose the term **Causal Privileging** for your group's use.

  **Definition:** **Causal Privileging** is the rhetorical and explanatory act of elevating one INUS condition above others within a causal complex, not merely to identify it, but to assign it greater explanatory weight, depth, or moral significance.

  **Why this term helps:** It separates the *metaphysics* (all these things caused it) from the *narrative* (this thing *matters* most). It allows your group to say, "We agree on the causal field, but we are disagreeing on the causal privileging."

  ### 5. Boundary Cases: Does this apply outside history?
  You asked if this applies to science or only retrospective history. **Causal Privileging** applies to both, but the criteria for privileging differ.

  **Case A: Genetics (The "Gene For" Trait)**
  *   **Situation:** A scientist identifies a specific gene variant associated with height.
  *   **The Pile:** Height is caused by hundreds of genes, nutrition, childhood illness, and hormonal balance. All are INUS conditions.
  *   **The Privileging:** The scientist privileges the *gene* over *nutrition*.
  *   **Why?** Not because the gene is more "abnormal" (everyone has genes), but because it is more **manipulable** for research or **stable** across environments.
  *   **Verdict:** This *is* Causal Privileging. It shows the practice is not unique to history; it is inherent to any complex system explanation.

  **Case B: Engineering Accident (The Plane Crash)**
  *   **Situation:** A plane crashes due to a snapped bolt during a storm.
  *   **The Pile:** Metal fatigue (bolt), pilot error (flew into storm), gravity (physics), wind shear.
  *   **The Privileging:** The investigator privileges the *bolt* (mechanical failure) over *gravity*.
  *   **Why?** Gravity is a "background condition" (constant). The bolt is an "intervention" (abnormal).
  *   **Verdict:** This aligns with the classic Hart and Honoré model of Causal Selection. It differs from the history case because the criterion is usually strict (find the liability), whereas historians shift criteria to teach different lessons.

  ### Summary for Your Book Group
  To stop the circular discussions, you might propose this framework:

  1.  **The Causal Field:** Agree on the list of INUS conditions (Nationalism, Alliances, Assassination, etc.). This is the "facts" layer.
  2.  **The Contrast:** Ask, "What question is this historian answering?" (Why 1914? Why War? Why Germany?)
  3.  **The Privileging:** Acknowledge that the historian is *privileging* one factor from the field to serve a narrative or moral purpose.

  **The Term to Use:**
  Stick with **Causal Selection** if you want to reference the philosophical literature (start with Hart & Honoré's *Causation in the Law* or Lipton's *Inference to the Best Explanation*). However, use **Causal Privileging** in your discussions to describe the specific act of calling one cause "deeper" than the others.

  **The Takeaway:**
  The historians are not disagreeing about the *physics* of the past (the causal field); they are disagreeing about the *pragmatics* of the present (what lesson we need). Recognizing this distinction turns a circular argument about "what caused the war" into a productive discussion about "what kind of explanation do we value?"
