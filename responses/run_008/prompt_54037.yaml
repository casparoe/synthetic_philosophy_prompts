answer: |-
  This is a fantastic set of intuitions. You and Maya have stumbled onto the exact fault lines that have kept the philosophy of mind busy for the last twenty years since Clark and Chalmers dropped that 1998 paper. You are right to feel that the standard "Parity Principle" (if it functions like mind, it is mind) is too blunt an instrument. It overgenerates, as you noticed with the calculator and chess engine.

  If I strip away the textbook defenses and give you my considered view as a philosopher working in this space: **The Parity Principle is necessary, but it is not sufficient.** It identifies candidates for extension, but it doesn't filter for *constitution*.

  Here is the principle that I believe captures your verdicts (mostly), explains the friction points, and tells us where one of you might need to concede.

  ### The Principle: Normative Transparency and Plastic Coupling

  For an external resource to count as part of the *mind* (specifically the cognitive system responsible for belief and memory), it must satisfy three conditions beyond mere reliability:

  1.  **Phenomenological Transparency:** When using the resource, you look *through* it, not *at* it. It withdraws from awareness (like a blind man's cane becomes an extension of his touch).
  2.  **Content Plasticity:** You must have the agency to curate, update, or modify the information stored within the resource to match your changing cognitive states. It is a *repository* you maintain, not an *oracle* you consult.
  3.  **Doxastic Endorsement:** When the resource provides information, it is taken immediately as a *belief* (a claim about the world) rather than an *imperative* (a command) or a *suggestion* requiring verification.

  Let's run your cases through this mill.

  #### 1. Otto's Notebook & Phone Notes (Verdict: YES)
  These pass all three. You don't look at the notebook as an object; you look through it to the address (Transparency). You wrote the address there and can change it (Plasticity). You treat the entry as a belief you hold ("The museum is on 53rd") (Endorsement).
  *Philosophical Note:* Your intuition here is the bedrock of EMT. No issues.

  #### 2. Password Manager (Verdict: YES)
  You said you lean yes, weirdly. I agree, and here is why: This is the purest form of **Digital Dispositional Belief**.
  *   **Transparency:** Ideally, it auto-fills. You don't "recall" the password; the system executes the memory.
  *   **Plasticity:** You curate it. When you change a password, you update the "neural" connection.
  *   **Endorsement:** You believe *that* the password in the manager is the correct one. You have offloaded the *content* of the belief entirely.
  *   *The Friction:* The reason it feels weird is that you lack *access* to the content (you can't recite it). But EMT argues you don't *need* internal access if the external access is reliable. This is a win for your intuition.

  #### 3. The Wife (Verdict: YES, with caveats)
  Maya thinks this is crazy. Maya is relying on an outdated "skin-skull boundary" intuition. However, she is right to be wary of the **Autonomy Problem**.
  *   **Transparency:** In a long marriage, you often ask, "When's our anniversary?" and treat her answer exactly as you would your own memory.
  *   **Plasticity:** This is the tricky bit. You cannot *write* to her brain directly. However, in a "transactive memory system" (a real psychological concept), you negotiate who remembers what. You curate her memory by telling her things ("Honey, remember this...").
  *   **Endorsement:** You trust her testimony as memory, not as testimony.
  *   *The Caveat:* She has her own agency. If Otto's notebook refuses to show him the address, it's broken. If your wife refuses to tell you the anniversary, she is *asserting autonomy*. This makes the coupling looser than the notebook.
  *   *My Verdict:* You are right, but this is **Social Extended Mind**, which is a distinct category from Otto's Notebook. It counts as extended cognition, but it is "noisier" because the vehicle (your wife) has its own cognitive agenda. Maya is wrong to dismiss it, but right to sense a difference.

  #### 4. The GPS (Verdict: NO, but not for the reason you think)
  You said "Yes-ish" but it feels "less." My principle says **No**, it is not part of your *mind* in the same way the notebook is. It is part of your *perceptual system*.
  *   **Transparency:** Yes, you look through the screen to the road.
  *   **Plasticity:** **No.** You do not curate the map. You cannot teach the GPS new streets. It is a fixed environmental feature you are coupling with, like a pair of glasses.
  *   **Endorsement:** **No.** The GPS speaks in *Imperatives* ("Turn Left"), not *Declaratives* ("The street is to the left").
  *   *Why it feels "less":* You are sensing a difference between **Memory Extension** (Otto) and **Perceptual Extension** (GPS). Clark and Chalmers focused on belief/memory. Extending perception (like a blind man's cane) is generally more accepted, but it feels different because it guides action directly rather than storing truth-conditions. Your intuition that it is "less like part of my mind" is correct because it functions more like a sensory organ than a belief box.

  #### 5. The Calculator & Chess Engine (Verdict: NO)
  You were right to reject these, and Maya was wrong to push them. This is where the Parity Principle usually breaks.
  *   **Transparency:** **No.** When you use a calculator, you look *at* the result. You do not look *through* the calculator to the number 391. The number appears as an output to be assessed.
  *   **Plasticity:** **No.** You cannot teach the calculator to multiply differently. It is a fixed algorithm.
  *   **Endorsement:** **No.** You do not believe 17 x 23 = 391 *until* you have integrated that output. If the calculator says 391, but you have a strong intuition it's wrong, you re-calculate. With Otto's notebook, if he has a strong intuition the museum is elsewhere, he checks the notebook to *correct* the intuition. The notebook is the authority; the calculator is a witness.
  *   *The Principle at work:* These are **Tools**, not **Constituents**. They perform computation *for* you, not *as* you.

  ### The Verdict on Your Bet

  **1. Which verdict has to go?**
  You need to adjust your **GPS** verdict. You currently lean "Yes." Based on the distinction between *storage* (belief) and *processing/perception* (action guidance), the GPS is not part of your mind in the *Otto* sense. It is a perceptual prosthesis. It doesn't store your beliefs; it perceives the world for you. If you shift your verdict to "It extends my perception, not my mind/beliefs," the tension resolves.

  **2. Who wins the Wife bet?**
  **You win,** but with a philosophical footnote. Maya is defending the "Organic Boundary." You are defending "Functional Coupling." Current philosophy of mind (e.g., work by Shaun Gallagher or Soteriou) largely agrees with you: if the coupling is tight enough and normative enough, other people can function as parts of our cognitive system. However, you must concede that it is a *different kind* of extension than the notebook because of the agency issue.

  **3. The Password Manager?**
  It is a **Yes**. It is the modern Otto's Notebook. The fact that you cannot recite the passwords is irrelevant; Otto cannot recite the addresses without looking. It is a store of dispositional belief.

  ### Summary of the Principle
  **Cognitive Extension requires Plastic Coupling.**
  To be part of the mind, the external resource must be something you *maintain* and *curate* (Plasticity), through which you access information without thinking about the medium (Transparency), and whose output you treat as your own belief rather than a command or suggestion (Doxastic Endorsement).

  *   **Notebook/Notes/Passwords:** Pass (You curate the data).
  *   **Wife:** Passes (You co-curate the data, though with friction).
  *   **GPS:** Fails (You don't curate the map; it issues commands).
  *   **Calculator/Chess:** Fails (You don't curate the logic; you verify the output).

  Maya was right to be suspicious of the "anything goes" nature of EMT, but wrong to draw the line at the skin. You were right to trust your intuition that the calculator isn't you, but you need to recognize that the GPS isn't "you" in the belief-sense either. It's a bionic eye, not a bionic hippocampus.
