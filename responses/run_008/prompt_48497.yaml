answer: |-
  This is a brilliant pedagogical strategy. It forces students to inhabit the epistemic tension before they have the vocabulary to resolve it. However, 50 minutes is extremely tight for this level of mechanical complexity. The success of this section hinges entirely on **logistical frictionlessness**. If you spend 15 minutes explaining the rules or calculating scores, the philosophical payoff evaporates.

  Below is a fully worked-out lesson plan designed for a 50-minute discussion section with 16 students.

  ### I. Preparation & Materials

  **1. The "Pre-Class" Calibration (Crucial for Time)**
  To make the "Genuine vs. Fake" track records indistinguishable without eating class time, you need data *before* they walk in.
  *   **Action:** Send a 3-question survey (Canvas/Qualtrics/Email) 24 hours prior.
  *   **Questions:** Three Fermi-style estimations (e.g., "Height of the Eiffel Tower in meters," "Population of Denver," "Year the printing press was invented").
  *   **Data:** Calculate the Absolute Error for each student. Rank them.
  *   **The Twist:** You will use this data to create 16 "Peer Dossiers."
      *   **8 Genuine Dossiers:** Reflect the student's actual pre-class accuracy.
      *   **8 Fake Dossiers:** Randomly assigned accuracy stats that look plausible but are uncorrelated with ability.
      *   **Formatting:** Print these on identical cardstock. No handwriting. Use a standard template (see below).

  **2. The In-Class Questions (Round 1 & 2)**
  Prepare 3 questions with verifiable answers that cannot be Googled in 10 seconds (avoid current events).
  *   *Q1:* Length of the Nile River (km). (True: ~6,650)
  *   *Q2:* Weight of an average adult male African Elephant (kg). (True: ~6,000)
  *   *Q3:* Number of countries in Africa recognized by the UN. (True: 54)
  *   *TA Cheat Sheet:* Have the true answers and a scoring calculator (Excel/Google Sheets) open on your laptop.

  **3. Scoring Rule (Simplified Proper Scoring)**
  Real proper scoring rules (Logarithmic/Brier) are too math-heavy for a 50-min intro. Use a **Linear Accuracy Score**.
  *   **Formula:** `Score = 1000 - (|Student Estimate - True Value|)`
  *   **Why:** It incentivizes closeness. If I move halfway toward you and you are wrong, my error increases, and my score drops. If you are right, my score rises. It makes "splitting the difference" a gamble, not a hedge.

  ---

  ### II. Run of Show (50 Minutes)

  **0:00 – 0:05: Introduction & Round 1 (Private)**
  *   **Script:** "We are playing an estimation game. There are 3 questions. You will be scored on accuracy. Do not talk to each other. Write down your best estimate and a confidence rating (0-100%) that you are within 10% of the truth."
  *   **Action:** Hand out slips. Students write estimates for Q1, Q2, Q3. Collect them immediately.
  *   **TA Task:** While they work, have your Excel sheet ready. As you collect slips, type estimates in. (If this is too stressful, use the Pre-Class data as the "Track Record" and skip live grading of Round 1 for the dossier. *Recommendation: Use Pre-Class data for the Dossier to save time. Use Round 1 for the actual game scoring.*)

  **0:05 – 0:10: Pairing & Dossier Exchange**
  *   **Action:** Divide into 8 pairs. Hand each student a **Peer Dossier** about their partner.
  *   **The Dossier Text:**
      > **PARTNER CALIBRATION REPORT**
      > **Subject ID:** [Partner Name]
      > **Task:** Pre-Class Estimation Battery
      > **Average Absolute Error:** [Value]
      > **Percentile Rank:** [e.g., 92nd or 45th]
      > **Status:** [Verified Peer / Unverified]
      > *Note: 8 of these reports reflect actual pre-class performance. 8 are randomly generated from the class distribution.*
  *   **Instruction:** "Look at your partner's estimate for Q1. Look at their Dossier. You have 3 minutes to discuss Q1, but you must submit a **Revised Estimate** individually."

  **0:10 – 0:20: Round 2 (Revision)**
  *   **Action:** Students discuss. They see if their partner was more accurate historically (Genuine) or if the record is noise (Fake). They see if their partner's Q1 estimate matches theirs.
  *   **Constraint:** They must write a *new* number. They cannot just write "Same."
  *   **TA Role:** Circulate. Listen for: "Your record says you're better, I'll move to you" vs. "I don't trust this slip."

  **0:20 – 0:25: Round 3 (The Meta-Disagreement)**
  *   **Instruction:** "Final Question: Look at your partner's Round 1 answers (which you saw earlier). Who was more accurate in Round 1? You or them? Assign a probability (0-100%) that **YOU** were closer to the truth than your partner."
  *   **Why:** This forces them to evaluate the *peerhood* itself. If I think I'm better, I should be steadfast. If I think you're better, I should conciliate.

  **0:25 – 0:35: Scoring & The Reveal**
  *   **Action:** Reveal True Answers. Students calculate their own Round 2 scores (using the formula on the board).
  *   **The Reveal:** "Now, about the Dossiers. Half were genuine pre-class data. Half were random noise. I have the key here."
  *   **Action:** Reveal which pairs had Genuine/Genuine, Genuine/Fake, or Fake/Fake pairings.
  *   **Ask:** "Raise your hand if you moved your estimate significantly toward your partner's. Keep it up if your partner's Dossier was Fake."

  **0:35 – 0:50: Debrief & Lecture**
  *   (See Section IV below).

  ---

  ### III. Track Record Construction (The "Fake" Mechanism)

  To ensure the Fake records aren't distinguishable by formatting or obvious outliers:

  1.  **Calculate the Class Distribution:** From the Pre-Class survey, find the Mean Absolute Error (MAE) and Standard Deviation (SD).
  2.  **Genuine Slips:** Insert the student's actual MAE.
  3.  **Fake Slips:** Draw from a Normal Distribution $N(MAE, SD)$.
  4.  **Visuals:** Use the same font, same paper, same "Verified" stamp (even on the fake ones).
  5.  **Crucial Detail:** Do not label them "Genuine" or "Fake." Label them "Calibration Report." The uncertainty is the point.

  ---

  ### IV. The Debrief: Mapping Game to Theory

  This is where you earn your pay. Do not just say "That was Conciliationism." Walk them through the epistemic moves they made.

  **1. Revising Credence vs. Revising Peerhood**
  *   **Question:** "When you saw your partner's estimate differed from yours, what was your first instinct? To change your number, or to question their Dossier?"
  *   **Theory:** This is the split between **Conciliationism** (update the belief about the world) and **Skepticism about Peerhood** (update the belief about the person).
  *   **Point:** If you kept your estimate steady because you thought the Dossier was fake, you were acting as a **Steadfast theorist** regarding the *evidence*, but a **Conciliationist** regarding the *meta-evidence* (the dossier).

  **2. The "Fake" Reveal & Retroactive Distrust**
  *   **Question:** "For those who moved toward your partner and then learned their Dossier was Fake: Do you feel you were irrational? Or just unlucky?"
  *   **Theory:** This distinguishes **Justification** from **Truth**. Conciliationism is often a claim about rationality (what you *should* do given the evidence), not necessarily about winning the game. If the Dossier was a legitimate piece of evidence (even if false), updating on it might have been rational, even if it cost points.
  *   **Point:** "Epistemic luck." You can do the right epistemic thing and still get the wrong answer.

  **3. Where Steadfastness Won Points**
  *   **Question:** "Did anyone refuse to move and end up closer to the truth?"
  *   **Theory:** This validates the **Right Reasoning View** (a version of Steadfastness). If you had independent access to the evidence (your own reasoning) and the 'peer' was actually a fake peer (random record), sticking to your guns was the winning strategy.
  *   **Point:** Steadfastness isn't just stubbornness; it's a claim that you have access to a defeater (your own reasoning) that the 'peer' status doesn't override.

  **4. The Meta-Disagreement (Round 3)**
  *   **Question:** "In Round 3, you had to judge who was better. Did you trust your own self-assessment or their Dossier?"
  *   **Theory:** This introduces **Higher-Order Evidence**. The disagreement wasn't about the Elephant's weight; it was about *who is a better weigher of elephants*.
  *   **Point:** Peer disagreement often collapses into a disagreement about who counts as a peer.

  ---

  ### V. Candid Limitations & The Final 10 Minutes

  You must explicitly address what the game *cannot* do, or students will leave with the wrong intuition. Spend the last 10 minutes on this.

  **1. The Oracle Problem**
  *   **Limitation:** In the game, *you* (the TA) are the Oracle. There is a Fact of the Matter.
  *   **Reality:** In real peer disagreement (politics, religion, ethics), there is no TA with an answer key.
  *   **Lesson:** "In the game, Conciliationism is a strategy to find the Truth. In real life, Conciliationism is often a strategy for *humility* or *suspension of judgment* because the Truth is inaccessible. The game makes disagreement look solvable. Real epistemology admits it might not be."

  **2. Shared Evidence vs. Private Evidence**
  *   **Limitation:** In the game, you had private estimates.
  *   **Reality:** Peer disagreement usually involves **Shared Evidence** (we both read the same study, saw the same event).
  *   **Lesson:** "If we share all evidence, why do we disagree? The game simulates 'different calculations on similar data.' Real peer disagreement is harder because we often think we *are* sharing evidence when we aren't."

  **3. Introducing the Terms (The "Lecture" Portion)**
  Now that they have the experience, define the terms on the board:
  *   **The Equal Weight View (Conciliationism):** "If I think you are my epistemic peer (same evidence, same ability), I should give your credence equal weight to mine. (Split the difference)."
  *   **The Steadfast View:** "I am justified in maintaining my credence if I have reason to think I am reasoning correctly, even if you disagree."
  *   **The Total Evidence View:** "I should update based on all evidence, including the fact that you disagree with me, but also including my assessment of my own reliability."

  **4. Closing Prompt**
  *   "For next week's reading: When you realized the Dossier might be fake, did that count as a 'defeater' for your partner's peer status? If so, does that mean Steadfastness is just Conciliationism in disguise (conciliating on the peer-status, steadfast on the fact)?"

  ---

  ### VI. Predictable Failures & Mitigation

  1.  **The "Average Everything" Strategy:**
      *   *Risk:* Students blindly average their number and their partner's number to "hedge."
      *   *Mitigation:* Emphasize the scoring rule. "If the answer is 100, I say 50, you say 200. We average to 125. We both lose points compared to me sticking at 50 if the answer is 60." Make sure they understand that **agreement is not the goal; accuracy is.**

  2.  **Resentment over Fake Records:**
      *   *Risk:* Students feel manipulated by the fake dossiers.
      *   *Mitigation:* Frame it immediately in the debrief. "The fake records simulate the real world, where we often *think* someone is an expert based on credentials that turn out to be hollow. The frustration you feel is the epistemic point."

  3.  **Time Overrun:**
      *   *Risk:* Calculating scores takes too long.
      *   *Mitigation:* Do not have them calculate exact points. Have them raise hands: "Who got within 10%?" "Who improved their score from Round 1 to Round 2?" Use qualitative success metrics to save 5 minutes.

  4.  **Confusion on "Credence":**
      *   *Risk:* Students treat "credence" as just a number.
      *   *Mitigation:* In Round 3, force the probability judgment. "I am 80% sure I am better than you." This forces the credence concept out of the estimation and into the meta-cognition.

  This plan turns the abstract debate into a tangible risk-reward calculation. By the time they read the syllabus positions, they will have already felt the cost of being steadfast and the risk of being conciliatory.
