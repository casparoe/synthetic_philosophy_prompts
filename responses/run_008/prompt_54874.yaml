answer: |-
  Your diagnosis is exceptionally sharp. You have effectively translated a historiographical stalemate into the language of causal inference and possible-worlds semantics, and in doing so, you have identified the engine of the deadlock more precisely than most professional historians do.

  Here is the breakdown of your hypothesis, the nature of the disagreement, and the prospects for progress.

  ### 1. Is your diagnosis right? (The Similarity Metric)
  **Yes, largely.** You have correctly identified that the Intentionalist/Structuralist debate is a dispute over the **distance metric in counterfactual space.**

  *   **The Intentionalist Metric:** Minimizes distance by holding the *structural context* (Weimar instability, German antisemitism, Versailles) fixed and varying only the *agent* (Hitler). In their possible worlds, a Weimar Germany without Hitler defaults to authoritarian conservatism, but not industrialized genocide. Therefore, Hitler is a *necessary cause* (a "switch").
  *   **The Structuralist Metric:** Minimizes distance by holding the *systemic pressures* fixed and treating the *agent* as a variable within a distribution of probable demagogues. In their possible worlds, the structural tensions (economic collapse, paramilitary violence, elite panic) require a release valve. If not Hitler, then Strasser, or Papen, or a military junta. The outcome (war, ethnic cleansing) is an *attractor state* of the system. Therefore, Hitler is an *accelerant*, not a switch.

  Because historical methodology relies on implicit counterfactuals (we cannot run controlled trials on the 1930s), neither side can prove their metric is the "correct" one. They are arguing over which features of reality are **essential** (invariant across close possible worlds) and which are **accidental** (contingent). For Intentionalists, Hitler's specific ideology is essential. For Structuralists, the bureaucratic momentum is essential.

  ### 2. Is there a genuine, settleable factual disagreement?
  There is an empirical layer, but it is **underdetermined by the evidence.**

  If we treat this as a causal graph problem, you are asking about the **Average Causal Effect (ACE)** of the node "Hitler" on the outcome "Holocaust/War." The problem is $N=1$. We have one observation of Weimar Germany. We cannot calculate the ACE without a control group (e.g., 50 versions of Germany with different leaders).

  However, there are factual claims that *should* settle it, but don't, because they are interpreted through the causal lens:
  *   **The Timing of the Final Solution:** Intentionalists looked for a "Führer Order" (a specific node activation). Structuralists looked for "cumulative radicalization" (feedback loops).
  *   **The Consensus:** Ian Kershaw's synthesis ("Working towards the Führer") empirically demonstrated that both were true: Hitler set the ideological vector (Intentionalist), but the bureaucracy competed to radicalize implementation without direct orders (Structuralist).

  **Why this didn't end the debate:** Kershaw explained *how* the mechanism worked, but he did not solve the *counterfactual weighting*. Even if we accept "Working towards the Führer," the question remains: *Would the bureaucracy have radicalized in a different direction without the Führer's specific ideological signal?*
  *   The Intentionalist says: No, the signal was unique.
  *   The Structuralist says: Yes, the pressure for radicalization was endogenous to the system; the signal just gave it a specific shape.

  So, there is no "in-principle-settleable factual disagreement" left in the archives. The archives are exhausted. The disagreement is now purely **modal** (about necessity and possibility), not empirical.

  ### 3. Is it bedrock intuition about inevitability?
  Yes. This is the "bedrock" you suspect. It is a clash of metaphysical commitments regarding **human agency vs. structural determinism.**

  *   **Intentionalism** preserves the liberal humanist view of history: Individuals matter, choices are real, moral responsibility lies with specific agents.
  *   **Structuralism** aligns with sociological materialism: Systems generate outcomes, individuals are functionaries, moral responsibility is diffuse (which is terrifying, as it implies "us" are capable of it, not just "him").

  This is why the debate is a "fixed ritual." It is a secular confession. Intentionalists are reassuring us that evil is anomalous (Hitler was a monster). Structuralists are warning us that evil is systemic (modernity made this possible). Neither can concede without abandoning their moral framework.

  ### 4. What would count as progress?
  If you want honest assessment: **Theoretical progress is possible; empirical progress is exhausted.**

  Here is what actual progress would look like, ranked by feasibility:

  1.  **An Agreed Convention on Counterfactual Protocols (High Feasibility):**
      Historians need to stop treating counterfactuals as "parlor games" and start treating them as **sensitivity analyses**. Progress would look like a convention where historians must explicitly state their *ceteris paribus* assumptions.
      *   *Example:* "I am claiming Hitler was necessary. I am holding the KPD/SPD split fixed. I am holding the Treaty of Versailles fixed."
      *   This doesn't solve the truth, but it clarifies the *conditionality* of the claim. It moves the debate from "Who is right?" to "Under which stability conditions does your claim hold?"

  2.  **A Shift from "Necessary/Sufficient" to "Interaction Effects" (Medium Feasibility):**
      The debate is stuck in a binary (Hitler vs. Structure). A causal model approach would treat them as **interaction terms**.
      *   $Outcome = \beta_1(Hitler) + \beta_2(Structure) + \beta_3(Hitler \times Structure) + \epsilon$
      *   Progress would be acknowledging that $\beta_3$ is the largest term. Hitler without the structure is a fringe loudmouth (Beer Hall Putsch failure). Structure without Hitler is authoritarianism, but perhaps not genocide. The *interaction* is the catastrophe.
      *   This is essentially Kershaw's synthesis, but formalized.

  3.  **A Sharper Causal Model (Low Feasibility):**
      We cannot get more data. We cannot run simulations. Unless we develop a robust science of "cliodynamics" that can simulate state collapse with high fidelity (which currently we cannot), we cannot calculate the ACE of Hitler.

  ### 5. Why does the debate feel productive if it's a stalemate?
  If the diagnosis is correct (that it's a metaphysical stalemate), why does the ritual continue? Why does it feel like work is being done?

  1.  **Heuristic Value:** The tension forces historians to check their blind spots. An Intentionalist is forced to look at bureaucratic files they might ignore; a Structuralist is forced to read *Mein Kampf* closely rather than dismissing it as propaganda. The debate acts as a **peer-review mechanism for causal bias.**
  2.  **Moral Stakes:** As mentioned, the stakes are ethical. The debate is productive because it is **normative**. It is a continuous negotiation of how we assign guilt. If we stop debating, we risk settling on a moral conclusion that is too comforting (only Hitler was guilty) or too fatalistic (we were all destined to do it). The friction keeps the moral question alive.
  3.  **Identity Formation:** For historians, picking a side is a way of signaling methodological tribe. It structures the profession.

  ### Summary
  You are right. It is a disguised dispute about **similarity metrics over counterfactual histories.** There is no archive that can resolve it because the question is not "What happened?" (we know that) but "What *would have* happened?" (which is unknowable).

  **Progress** will not come from new documents. It will come from **methodological explicitness**: historians admitting they are running a sensitivity analysis on the past, specifying which variables they are holding fixed, and acknowledging that their causal claims are conditional on their chosen similarity metric.

  Until then, the debate persists not because it is solvable, but because it is **necessary**. It is the mechanism by which the discipline negotiates the tension between agency and structure, a tension that cannot be resolved because it is a fundamental feature of human social reality, not just a bug in Third Reich historiography.
