      *Drafting:*
      TO: Editorial Board
      FROM: [Name]
      DATE: [Date]
      SUBJECT: Recommendation on Model Assumptions Proposal

      **Recommendation:** Approve with Conditions.

      **Bottom Line:** We should adopt a modified version of the proposal. Instead of an "Assumptions Appendix" requiring justification of unrealistic premises, we require a "Critical Assumptions & Sensitivity Note." This addresses the concern about opaque modeling without violating instrumentalist principles.

      **Reasoning**
      The board is divided between two valid concerns. The proponent rightly identifies that some submissions rely on "hidden drivers"—unrealistic assumptions that quietly dictate results without scrutiny. This undermines the utility of the model for policy or further research.

      However, the Friedman objection is decisive against the original wording. Demanding authors justify why "false" assumptions are harmless implies assumptions should be realistic. As Friedman argued, theories are tools for prediction, not photographic reproductions of reality. Asking authors to defend abstraction as "harmless" invites security theater: boilerplate text claiming robustness without evidence. It risks driving submissions to competitors and encourages vagueness to avoid scrutiny.

      **The Compromise: Transparency over Realism**
      We can solve the opacity problem without judging assumptions by their realism. The goal is not to ask "Is this assumption true?" but "Is this assumption doing the heavy lifting?" A model can rely on false assumptions successfully, provided we know which ones are critical to the mechanism.

      **Implementation Conditions**
      To win over the instrumentalists while satisfying the transparency goal, I propose the following specific guidelines:

      1.  **Rename and Reframe:** The requirement is not an "Assumptions Appendix" but a "Critical Assumptions & Sensitivity Note" (max 1 page).
      2.  **Author Prompt:** Authors must identify up to three simplifying assumptions central to the mechanism. For each, they must answer: *If this assumption were relaxed or modified, would the main qualitative result change?* They are not required to claim the assumption is realistic, only to disclose its influence on the outcome.
      3.  **Reviewer Guidance:** Reviewers should not flag assumptions for being "unrealistic." They should flag the note if it fails to identify which assumptions are critical or if claims of robustness are unsupported by derivation or citation. The checkbox becomes: "Does the sensitivity note clearly identify the model's critical drivers?"
      4.  **Exemptions:** Purely empirical papers or those using standard frameworks where sensitivity is well-established (e.g., basic CES production) are exempt unless the application relies on a novel mechanism.

      **Why This Works**
      This approach respects Friedman. We are not judging the theory by the realism of its postulates. We are judging the *clarity* of the theory's mechanism. If a paper predicts well but relies on a fragile assumption, knowing that fragility is valuable scientific information. If a paper relies on a false assumption that doesn't matter, the note allows them to say so briefly.

      This prevents the "Rube Goldberg" problem by forcing authors to isolate the engine of their result. It prevents security theater by focusing on counterfactual sensitivity rather than philosophical justification. It minimizes submission flight because the burden is low (identify, don't defend) and aligns with best practices in theoretical economics.

      **Next Steps**
      If the board agrees, I will draft the author guidelines based on these conditions for circulation next week. Please come prepared to vote on this modified framework.

