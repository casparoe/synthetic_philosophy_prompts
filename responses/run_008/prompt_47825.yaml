          2.  Focus on counterfactuals: "If assumption X changes, does result Y hold?"
          3.  Reviewer guidance: Flag missing sensitivity analysis, not "unrealistic" assumptions.
      *   *Risk Mitigation:* Prevents boilerplate by requiring specific mechanistic links.

  7.  **Review and Edit:**
      *   *Check:* Did I take Friedman seriously? Yes, by explicitly agreeing that realism isn't the goal.
      *   *Check:* Is the bottom line clear? Yes.
