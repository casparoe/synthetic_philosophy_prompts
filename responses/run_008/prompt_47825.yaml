      *   *Check:* Word count? Need to ensure it stays tight.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm splitting hairs. The distinction between "justify falsehood" and "identify sensitivity" is crucial for the Friedman camp. I need to emphasize that we are not asking authors to apologize for abstraction, but to map the model's boundaries.

      *(Word Count Management)*: Keep intro short. Get straight to the recommendation. Use bullet points for conditions.

  8.  **Final Polish:** Check tone (professional, decisive, conciliatory).

      *Drafting thought:* Start with the recommendation. Then the rationale. Then the specific policy text.
      *Friedman point:* Explicitly state "We agree with Friedman that assumptions need not be realistic."
      *Proponent point:* Explicitly state "We agree that hidden drivers undermine scientific value."
      *Synthesis:* Transparency about *dependence*, not *truth*.

