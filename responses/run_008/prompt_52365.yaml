prompt: |-
  For my dissertation I'm modeling how a declining shorebird population responds to sea-level rise, and I've hit a fork my methods training never prepared me for. I have a small set of candidate models ranging from three parameters to nine, and the standard practice in ecology is to rank them with AIC and BIC. The two criteria disagree: AIC charges about 2 points per additional parameter, while BIC's charge grows with the logarithm of sample size, so with my 2,000 survey records BIC strongly favors the lean three-parameter model while AIC favors the nine-parameter one, and whether I report the sharp simple story or the complicated rich one may shape a real conservation listing decision. I want to understand what each scoring rule presupposes about Occam's razor itself, because the disagreement doesn't feel merely technical. BIC is usually derived as an approximation to a Bayesian marginal likelihood, and its penalty can be read as the log of the volume a model's extra parameters occupy — the same idea, pushed to its limit, that makes Solomonoff induction assign exponentially more prior weight to simpler hypotheses, and that ties simplicity to description length in the Kolmogorov sense. AIC, in contrast, is justified on grounds of expected predictive accuracy on new data, not truth, and its flat per-parameter charge doesn't depend on sample size at all. Reconstruct for me the implicit view of simplicity and of induction each rule carries: what BIC presupposes about whether there's a true model among my candidates and why simpler theories deserve higher prior probability; what AIC presupposes about the aim of statistical work; and which rival conceptions of Occam's razor each quietly rules out. Then tell me where the practice is genuinely underdetermined — whether an ecologist could accept the algorithmic, description-length view of simplicity and still have a principled reason to use AIC in some settings — and what my model-selection practice would have to look like if I took the Solomonoff-style picture wholesale.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Context:** Dissertation on shorebird population response to sea-level rise. Small set of candidate models (3 to 9 parameters). Sample size $n = 2000$.
      *   **Problem:** AIC favors the complex model (9 params), BIC favors the simple model (3 params). This decision impacts conservation policy.
      *   **Core Question:** Reconstruct the implicit philosophical views of simplicity and induction underlying AIC and BIC.
      *   **Specific Sub-questions:**
          *   What does BIC presuppose about the "true model" and prior probability of simplicity?
          *   What does AIC presuppose about the aim of statistical work (prediction vs. truth)?
          *   Which rival conceptions of Occam's razor does each rule out?
          *   Where is the practice genuinely underdetermined? (Can one hold an algorithmic view of simplicity and still use AIC?)
          *   What would model selection look like if taking the Solomonoff/Kolmogorov picture wholesale?

  2.  **Analyze AIC (Akaike Information Criterion):**

      *   *Formula:* $AIC = -2\ln(L) + 2k$.
      *   *Goal:* Minimize expected Kullback-Leibler (KL) divergence between the fitted model and the true data-generating process.
      *   *Philosophy:* Instrumentalism/Pragmatism. Models are *false* but useful. "All models are wrong, but some are useful."
      *   *View of Simplicity:* Simplicity is a penalty for overfitting (variance). It's about predictive accuracy on *new* data from the same process.
      *   *Truth:* Does not assume the true model is in the candidate set.
      *   *Sample Size:* Penalty is constant ($2k$) regardless of $n$. Why? Because the goal is predictive accuracy, which doesn't necessarily converge to a single "true" parameter set if the model class is misspecified.
      *   *Occam's Razor:* "Don't complicate the model unless it improves prediction." Simplicity is a tool for generalization, not a marker of ontological truth.

  3.  **Analyze BIC (Bayesian Information Criterion):**

      *   *Formula:* $BIC = -2\ln(L) + k\ln(n)$.
      *   *Goal:* Approximate the marginal likelihood (Bayes Factor). Select the model with the highest posterior probability.
      *   *Philosophy:* Realism. There is a "true" model (or at least one that is "true enough" within the set).
      *   *View of Simplicity:* Simplicity is linked to prior probability. Simpler models occupy less volume in parameter space, so they get higher prior density under a uniform prior over the space of *models*.
      *   *Truth:* Assumes the true model is in the candidate set (consistency property). As $n \to \infty$, BIC selects the true model with probability 1.
      *   *Sample Size:* Penalty grows with $\ln(n)$. As data accumulates, we become more confident in ruling out complex noise.
      *   *Occam's Razor:* "Simpler theories are more likely to be true." Simplicity is a proxy for prior plausibility.

  4.  **Compare and Contrast (The "Fork"):**

      *   *AIC:* Prediction-focused. Asymptotically efficient (minimizes error), but not consistent (might keep over-parameterizing).
      *   *BIC:* Truth-focused. Consistent (finds the true model if present), but not efficient (might under-fit in finite samples).
      *   *The Conflict:* With $n=2000$, $\ln(n) \approx 7.6$. BIC penalty per param is $\approx 7.6$, AIC is $2$. BIC is much harsher.
      *   *Conservation Context:* Do we want to understand the *mechanism* (Truth/BIC) or predict the *population crash* (Prediction/AIC)?

  5.  **Address the "Underdetermination" and "Solomonoff" aspects:**

      *   *Underdetermination:* Yes. It depends on the goal. If the goal is policy intervention based on accurate forecasts of population size under specific SLR scenarios, AIC might be better. If the goal is identifying *which* drivers (e.g., tide height vs. prey density) are causally real to justify regulatory protection, BIC might be better.
      *   *Algorithmic Simplicity (Solomonoff/Kolmogorov):* This ties to Minimum Description Length (MDL). MDL is closely related to BIC but more general. It views learning as compression.
      *   *Can you hold Algorithmic Simplicity and use AIC?* Yes, if you view the "description" as including the error term required for prediction. AIC minimizes the expected description length of *new data* given the model. However, strict Solomonoff induction favors the shortest program generating the *observed* data, which aligns more with BIC/MDL in the large $n$ limit.
      *   *Wholesale Solomonoff:* You wouldn't use a fixed candidate set. You'd define a Turing-complete space of models, assign priors $2^{-L(M)}$, and average over them (Bayesian Model Averaging), rather than selecting one.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Academic, philosophical, yet practical for a dissertation. Acknowledge the gravity of the conservation decision.
      *   *Structure:*
          1.  Introduction: Acknowledge the depth of the question.
          2.  BIC: The Realist's Razor (Truth, Consistency, Prior Volume).
          3.  AIC: The Instrumentalist's Razor (Prediction, Efficiency, KL Divergence).
          4.  The Conflict: Why they disagree at $n=2000$.
          5.  Underdetermination: Goals determine the tool.
          6.  Solomonoff/MDL: What happens if you go full compressionist.
          7.  Recommendation for the Dissertation.

      *   *Refining the Philosophy:*
          *   Make sure to distinguish between *ontological* simplicity (nature is simple) and *methodological* simplicity (avoid overfitting).
          *   BIC assumes the latter implies the former (via priors).
          *   AIC assumes the latter implies better *performance*, regardless of the former.
          *   Highlight the "True Model" assumption. BIC needs it for consistency. AIC explicitly rejects it (KL divergence assumes the true distribution is continuous, models are discrete approximations).

      *   *Refining the Conservation Angle:*
          *   If the 9-param model predicts a crash and the 3-param doesn't, this is critical.
          *   Suggest Model Averaging (AIC weights) as a middle ground. This acknowledges uncertainty rather than forcing a binary choice.

      *   *Refining the Solomonoff Point:*
          *   Solomonoff is about universal induction. In practice, we have a limited candidate set.
          *   Taking it wholesale means Bayesian Model Averaging (BMA) with complexity priors. It moves away from "selecting" a model to "weighting" them.

  7.  **Final Polish:** Check against the prompt's specific requirements.
      *   *Implicit view of simplicity?* (Check)
      *   *What BIC presupposes about truth/priors?* (Check)
      *   *What AIC presupposes about aim?* (Check)
      *   *Rival conceptions ruled out?* (Check)
      *   *Where is it underdetermined?* (Check)
      *   *Solomonoff wholesale?* (Check)

  8.  **Self-Correction during drafting:** I initially thought about suggesting cross-validation. While valid, the prompt asks specifically about the philosophical underpinnings of AIC/BIC. I should mention CV as a pragmatic cousin of AIC but focus on the philosophy requested. I need to make sure I don't just say "use AIC for prediction, BIC for explanation" but explain *why* philosophically. The "volume of parameter space" argument for BIC is crucial to mention as requested.

  9.  **Final Review of the "Solomonoff" section:** Ensure I distinguish between MDL (practical) and Solomonoff (theoretical limit). The prompt asks about the "Solomonoff-style picture." This implies a commitment to simplicity as *prior probability* in a universal sense. If one takes this, model *selection* is actually a category error; it should be model *averaging*.

  10. (Proceed to generate output based on these thoughts.)
answer: |-
  This is a profound methodological juncture. You have correctly identified that the divergence between AIC and BIC at $n=2,000$ is not a computational glitch but a collision between two distinct philosophies of science. In conservation biology, where model outputs feed directly into policy (e.g., ESA listing), this is not merely academic; it is ethical.

  Here is the reconstruction of the implicit views of simplicity and induction held by each criterion, followed by an analysis of the underdetermination and the Solomonoff alternative.

  ### 1. BIC: The Realist's Razor
  **The Presupposition of Truth**
  The Bayesian Information Criterion is derived as an asymptotic approximation to the Bayes Factor. Its philosophical core is **Realism**. BIC operates under the assumption that among your candidate set, there exists a "true" model (or at least one that is indistinguishable from truth given infinite data).

  **The View of Simplicity**
  BIC treats simplicity as a proxy for **prior plausibility**. The penalty term $k \ln(n)$ is not just a guard against overfitting; it is an estimate of the log-volume of the parameter space.
  *   **The Geometric Argument:** A model with more parameters occupies a larger volume in the space of all possible distributions. If you assign a uniform prior over the *space of models*, a complex model dilutes its prior probability density across a vast volume of parameter configurations. A simple model concentrates its prior density.
  *   **Occam's Presupposition:** BIC presupposes that nature is parsimonious enough that the "true" mechanism is likely to be found in the smaller volume of parameter space. It aligns with the view that simplicity is an ontological virtue: simpler theories are *more likely to be true*.

  **What It Rules Out**
  BIC quietly rules out **Instrumentalism**. It assumes that as $n \to \infty$, the penalty $\ln(n)$ will eventually overwhelm any marginal gain in likelihood provided by a false, complex model. It assumes the goal of science is *consistency* (converging on the true model structure), not necessarily *efficiency* (minimizing prediction error in finite samples). If the true data-generating process is not in your candidate set (which is almost certainly true in ecology), BIC's consistency guarantee becomes moot, and its heavy penalty may lead to severe underfitting.

  ### 2. AIC: The Instrumentalist's Razor
  **The Aim of Statistical Work**
  Akaike's Information Criterion is grounded in information theory, specifically the minimization of **Kullback-Leibler (KL) divergence**. Its philosophical core is **Instrumentalism** (or Pragmatism).
  *   **The Goal:** The aim is not to find the "True Model" but to find the model that best approximates the truth for the purpose of prediction. Akaike explicitly assumed the true model is *not* in the candidate set (infinite-dimensional reality vs. finite-dimensional models).
  *   **The Penalty:** The penalty ($2k$) is constant because it estimates the bias introduced by using the same data to fit and evaluate the model (overfitting). It measures the "optimism" of the likelihood.

  **The View of Simplicity**
  AIC treats simplicity as a **cost of estimation**. It does not claim simpler models are truer. It claims simpler models are more *robust* to sampling noise.
  *   **Occam's Presupposition:** Simplicity is a methodological tool to manage the bias-variance tradeoff. A complex model has low bias but high variance; a simple model has high bias but low variance. AIC seeks the sweet spot for *predictive accuracy on new data*.
  *   **Sample Size Independence:** The fact that the penalty doesn't grow with $n$ is crucial. It implies that even with infinite data, if a complex model yields better predictions (lower KL divergence), it should be preferred. This rejects the idea that complexity is inherently improbable; it is only improbable if it doesn't pay for itself in predictive power.

  **What It Rules Out**
  AIC rules out the idea that **parsimony is a guide to ontology**. It refuses to make claims about which variables are "real" drivers. It only claims which variables are useful for forecasting. In a conservation context, AIC might retain a parameter for "human disturbance" not because it is causally fundamental, but because it correlates with the real cause and improves the population forecast.

  ### 3. Where Practice is Genuinely Underdetermined
  The choice between AIC and BIC is underdetermined because **ecological modeling serves two masters: Explanation and Prediction.**

  *   **The Case for BIC (Explanation/Regulation):** If your dissertation aims to justify *why* the birds are declining to regulators (e.g., "Sea-level rise is the driver, not prey availability"), you need to identify the causal structure. You need to avoid Type I errors (false positives). BIC's harsher penalty protects against attributing causality to noise. If you list a species based on a 9-parameter model that includes spurious correlations, you risk misallocating resources or facing legal challenges regarding the "best available science."
  *   **The Case for AIC (Prediction/Management):** If your dissertation aims to forecast *when* the population will crash to trigger a listing, you need predictive accuracy. You need to avoid Type II errors (missing a signal). AIC is asymptotically efficient; it minimizes the mean squared error of prediction. If the 9-parameter model captures a complex interaction that prevents a crash prediction, ignoring it (via BIC) could lead to extinction.

  **Can you hold the Algorithmic View and use AIC?**
  Yes. The algorithmic view (Kolmogorov complexity) equates simplicity with compressibility.
  *   **The Reconciliation:** You can view AIC as minimizing the **expected description length of *new* data**, whereas BIC/Solomonoff minimizes the description length of the *observed* data + model.
  *   If your goal is to build a "codebook" (model) that allows you to transmit future survey data most efficiently, AIC is the correct tool. It acknowledges that the "true" code might be too complex to learn from finite data, so it optimizes for the compression of the *stream*, not the compression of the *history*.
  *   **Principled Reason:** An ecologist can believe nature is complex (high Kolmogorov complexity) but argue that given limited survey budgets ($n=2,000$), the optimal strategy for conservation is to minimize predictive risk, not to recover the true generating function.

  ### 4. The Solomonoff-Style Picture Wholesale
  If you took the Solomonoff induction picture wholesale—where simplicity is literally prior probability ($P(M) \propto 2^{-Length(M)}$) and induction is Bayesian updating over all computable hypotheses—your practice would change radically in three ways:

  1.  **Abandon Model Selection:** Solomonoff induction does not *select* a single best model. It performs **Bayesian Model Averaging (BMA)**. It acknowledges that the 3-parameter model has high prior probability, but if the 9-parameter model fits significantly better, it assigns it posterior weight. You would report a weighted average of the population trajectories, with uncertainty intervals that encompass both the "simple" and "complex" stories.
  2.  **Explicit Priors:** You would not rely on the asymptotic approximations of BIC. You would specify explicit priors on the parameters. In ecology, this often means using informative priors based on physiological limits (e.g., a bird cannot have negative survival) rather than the implicit uniform priors of BIC.
  3.  **The Candidate Set Problem:** Solomonoff induction assumes a universal prior over *all* Turing machines. Your candidate set of 3-to-9 parameter models is a severe constraint. Taking the picture wholesale would force you to acknowledge that your "truth" is bounded by your imagination. You would need to test whether your candidate set is rich enough to capture the dynamics, perhaps using posterior predictive checks rather than information criteria.

  ### Recommendation for the Dissertation
  You are facing a "Crisis of Criteria." Reporting only the BIC result risks underfitting a complex ecological reality; reporting only the AIC risks overfitting noise into policy.

  1.  **Do not hide the disagreement.** Explicitly state that AIC and BIC diverge and explain the philosophical trade-off (Prediction vs. Explanation).
  2.  **Use AICc.** With $n=2,000$ and $k=9$, standard AIC is fine, but AICc (corrected for small sample size) is standard in ecology. It will lie between AIC and BIC.
  3.  **Model Averaging.** Calculate AIC weights ($w_i$). If the 9-parameter model has a weight of 0.60 and the 3-parameter has 0.10, report the model-averaged parameters and predictions. This satisfies the Solomonoff intuition (weight by probability) while using the AIC framework (predictive focus).
  4.  **Conservation Precaution.** In conservation biology, the **Precautionary Principle** often overrides statistical parsimony. If the complex model predicts extinction and the simple one does not, the "cost" of a Type II error (extinction) vastly outweighs the "cost" of a Type I error (unnecessary regulation). In this specific domain, the instrumentalist value of AIC (avoiding missed signals) often carries more ethical weight than the realist value of BIC.

  **Summary:** BIC asks, "Which story is most likely to be the true one?" AIC asks, "Which story will best predict the next decade of surveys?" For a listing decision, the latter is often the more ethical question, provided you acknowledge the uncertainty via model averaging.
