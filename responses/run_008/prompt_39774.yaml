      *   **Requirements:**
          *   Numbered section of agreed claims (behavioral literature, neuroanatomy, etc.).
          *   Precise disagreements (phrased neutrally so both accept).
          *   Cruxes (probability updates from evidence, aggregation of credence distributions vs. point estimates, action-guidance of astronomical EV).
          *   For each crux: concrete experiment/observation/argument + pre-registered predictions.
          *   Address verbal disputes (moral mattering vs. funding priority).
          *   Concessions from both sides (Scale: don't treat credence as knowledge/EV $\neq$ immediate action; Skeptic: "can't tell" $\neq$ "probably no").
          *   **Format:** Numbered agreed claims, then disagreements table.
          *   **Length:** 1500-2000 words.
          *   **Tone:** Honest, precise, academic but accessible, collaborative.

  2.  **Deconstruct the Positions:**
      *   **Scale-Arguer (SA):** Focuses on $P(\text{sentience}) \times N(\text{insects}) \times \text{Value}$. Even low $P$ yields high EV. Wants research/money directed here. Risk: Pascal's Mugging, pseudo-precision.
      *   **Skeptic (SK):** Focuses on $P(\text{sentience})$ being extremely low (nociception $\neq$ pain). Missing brain structures. Risk: Dogmatic denial, ignoring tail risk.
      *   **Common Ground:** Both care about reducing suffering, both understand decision theory, both agree on certain empirical facts (even if interpretation differs).

