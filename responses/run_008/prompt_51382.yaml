      *   *Section 2: Requirements vs. Fit.* What is necessary? (Comprehension). What is incidental? (Democratic virtue). Show how a tyrant could use plain language for efficient taxation.
      *   *Section 3: Internal Consistency.* Address the euphemism contradiction. It's not a logical contradiction but a functional segmentation. "Transactional Clarity" vs. "Strategic Ambiguity." This undermines the Orwellian hope that style rules lead to honesty.
      *   *Section 4: The Deception-Based Counterfactual.* If we policed lies instead of passive voice. Training changes from grammar to ethics. Enforcement changes from software to investigation.
      *   *Conclusion:* Summarize. Plain language is a technology of governance, not a moral cure.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I address Orwell? *Correction:* Need to explicitly contrast the bureaucratic view with Orwell's view (political honesty precedes language).
      *   *Check:* Did I address "Philosophically Underdetermined"? *Correction:* Make sure to explicitly name rival views (e.g., Technocratic Efficiency vs. Democratic Empowerment) that both support plain language.
