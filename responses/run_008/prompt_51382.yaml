  9.  *(Final thought before writing)*: The prompt asks to "Reconstruct it." I should present this as a coherent philosophical reconstruction of the bureaucrat's implicit mindset.

  **(Self-Correction on "Internal Consistency"):** I need to be careful not to just say "it's hypocritical." I need to analyze if it's *logically* incoherent given the presupposed theory. If the theory is "Citizens must understand forms to function," then euphemisms in war policy don't contradict that. If the theory is "Clear language makes honest government," then it *is* contradictory. I should argue the bureaucracy operates on the former, while the *public justification* often hints at the latter.

  10. **Finalizing the Plan:**
      *   Intro: The Paradox of Bureaucratic Clarity.
      *   I. The Implicit Theory: Instrumental Transmission.
      *   II. Requirements, Fits, and Underdetermination.
      *   III. The Consistency of Compartmentalization.
      *   IV. The Deception-Based Counterfactual.
