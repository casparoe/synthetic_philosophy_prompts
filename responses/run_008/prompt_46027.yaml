      *   Address the scientist background? Yes.

  *(Self-Correction on British English)*: Be careful not to overdo the stereotype. Just standard UK spelling and idiom. "Bugger" might be too informal? No, "bugging me" was in the prompt. Keep it dignified but warm. "Whilst" is good. "Centre", "organise".

  *(Final thought on the "Zeus" analogy)*: The friend says Protestant Ethic is like Zeus. I need to point out that Zeus doesn't exist, but the Ethic does (as a social fact). The causal power of a *belief* is real even if the *object* of the belief (God) is debatable. But the friend's point is about the *location* of the cause (head vs physics). I need to focus on the *level* of description.

