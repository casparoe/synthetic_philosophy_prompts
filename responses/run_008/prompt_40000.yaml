answer: |-
  # Specification: Distinguishing Preference from Bias
  **Document Type:** Policy Design Specification
  **Audience:** Engineering & Policy Team
  **Subject:** Desiderata for Signal Classification (Preference vs. Bias)

  ## 1. Desiderata for a Workable Criterion

  To move from ad-hoc gut checks to a codifiable policy, any criterion used to classify a user signal as a "preference" (honor) or "bias" (override) must satisfy the following requirements. Each requirement includes the motivating case, the constraint it imposes, and its status as either Non-Negotiable (empirical or safety-critical) or Contested (moral/political trade-off).

  ### R1: Empirical Consistency (The Introspection Limit)
  *   **Motivation:** Psychological research consistently shows users cannot accurately report the causes of their attitudes. A user may reject a tenant based on a "gut feeling" about reliability and sincerely believe it is based on credit history, when implicit association tests reveal it correlates with race.
  *   **Constraint:** The criterion cannot rely on user-reported *reasons* for a signal as ground truth. It must treat stated causality as unverified metadata.
  *   **Status:** **Non-Negotiable.** Ignoring established empirical limits on human cognition creates a system vulnerable to self-deception and legal liability.

  ### R2: Volitional Hierarchy (First-Order vs. Second-Order)
  *   **Motivation:** Users often hold conflicting desires. A user may have a first-order desire to click on sensationalist or exclusionary content (revealed preference) but a second-order desire to be the kind of person who does not consume that content (stated value). Conversely, a user may sincerely endorse a prejudice upon reflection.
  *   **Constraint:** The criterion must define which "order" of desire owns the account. Does the system optimize for what the user *does*, or what the user *wants to want*?
  *   **Status:** **Contested.** Prioritizing second-order desires is paternalistic (deciding the "true" self is the moral one). Prioritizing first-order desires is cynical (deciding the "true" self is the impulsive one).

  ### R3: Causal Provenance (Formation History)
  *   **Motivation:** Tastes formed under coercion, manipulation, or segregated exposure differ morally from tastes formed through open inquiry. A user who dislikes a group because they were radicalized by an algorithmic feedback loop has a different claim to that preference than a user who dislikes a group based on direct, varied interpersonal conflict.
  *   **Constraint:** The criterion must account for the *history* of the signal, not just its current intensity. It requires tracing whether the preference was manufactured by the system or external manipulation.
  *   **Status:** **Non-Negotiable.** (With implementation caveats). Consent and agency are invalidated by coercion; a system that honors manipulated preferences is effectively honoring the manipulator.

  ### R4: Target Granularity (Trait vs. Proxy)
  *   **Motivation:** Bias often migrates from protected attributes to correlated proxies. A user may signal they do not want "loud neighbors" (behavior), but apply this signal exclusively to listings associated with a specific ethnicity (trait).
  *   **Constraint:** The criterion must distinguish between objections to specific, mutable behaviors and objections to immutable characteristics or high-correlation proxies for them.
  *   **Status:** **Contested.** Defining which traits are "relevant" to a transaction (e.g., is "cultural fit" a valid housing criterion?) is a political determination, not an engineering one.

  ### R5: Stated/Revealed Coherence (Hypocrisy Handling)
  *   **Motivation:** Users often signal one thing publicly (or in settings) and another privately (in clicks). A voter may endorse diversity policies but choose segregated neighborhoods.
  *   **Constraint:** The criterion must specify which signal channel takes precedence when they contradict. Does the "settings menu" override the "clickstream"?
  *   **Status:** **Contested.** Prioritizing stated preferences rewards virtue signaling. Prioritizing revealed preferences rewards hypocrisy and entrenches existing behavior.

  ### R6: Externality Containment (Third-Party Harm)
  *   **Motivation:** Some preferences impose costs on non-consenting third parties. A preference for "no children" in a rental app harms the child and the parent. A preference for "no neighbors of X group" harms the excluded group's access to housing.
  *   **Constraint:** The criterion must cap the honorability of a preference at the point where it inflicts measurable harm on parties outside the user-system contract.
  *   **Status:** **Non-Negotiable.** System safety and legal compliance require preventing direct harm to third parties.

  ---

  ## 2. The "Killer" Requirement

  **Question:** Which single requirement, applied consistently, does the most to knock out the criteria people use in practice?

  **Answer:** **R1: Empirical Consistency (The Introspection Limit).**

  **Reasoning:**
  Most practical heuristics for distinguishing bias from preference rely on the assumption that the user is a reliable narrator of their own mind. R1 dismantles the three most common operational tests:

  1.  **The "Reflective Endorsement" Test:** This test asks, "Would the user endorse this preference if they thought about it?" R1 renders this unimplementable because users cannot accurately access the *causes* of their attitudes during reflection. They will reflect on a confabulated reason (e.g., "safety") rather than the actual driver (e.g., "racial anxiety"). If the input to the reflection is corrupted, the output cannot be trusted.
  2.  **The "Protected Group" Test:** This test asks, "Is this preference about a protected class?" R1 complicates this because users rarely admit to protected class bias. They route the bias through R4 (Proxies). Because users cannot accurately report why they dislike a proxy (per R1), the system cannot distinguish a legitimate proxy preference (e.g., "credit score") from a biased proxy preference (e.g., "neighborhood name" as a race proxy) based on user testimony alone.
  3.  **The "Experience" Test:** This test asks, "Did this preference arise from real-world experience?" R1 undermines this because users cannot distinguish between experience that was organic and experience that was the result of prior sorting. A user who says, "I prefer X because of my experience," may have only had that experience because previous systems sorted them into an environment where Y was absent.

  By enforcing R1, you force the system to ignore the user's *explanation* entirely. This breaks the "Reflection" test (no valid data to reflect on), the "Protected Group" test (users hide the target), and the "Experience" test (users misidentify the source). You are left only with behavioral correlation and external impact analysis, which are much harder to engineer but more honest.

  ---

  ## 3. The Impossibility Result

  **Question:** Are some subset of the requirements jointly unsatisfiable?

  **Answer:** **Yes. R2 (Volitional Hierarchy) and R5 (Stated/Revealed Coherence) are jointly unsatisfiable without an arbitrary tie-breaker.**

  **Reasoning:**
  This is a "Multiple Selves" impossibility theorem. You cannot simultaneously honor the user's *actions* and the user's *aspirations* when they diverge.

  *   **Scenario:** A user sets their system preferences to "Show me diverse content" (Stated / Second-Order Desire) but consistently clicks on homogeneous content (Revealed / First-Order Desire).
  *   **Violation A:** If you honor **R2 (prioritizing Second-Order)**, you must override their clickstream to show them diverse content. This violates **R5 (prioritizing Revealed)** because you are ignoring their actual behavior. You are effectively telling the user, "You know what you want better than you do," which is paternalistic.
  *   **Violation B:** If you honor **R5 (prioritizing Revealed)**, you feed them homogeneous content. This violates **R2 (prioritizing Second-Order)** because you are frustrating their explicit moral goal. You are effectively telling the user, "Your moral commitments are irrelevant; only your impulses matter."

  **Engineering Implication:**
  There is no "clean criterion" that resolves this. It is not a bug; it is a feature of human psychology.
  *   If you optimize for **R2**, you build a "Nudge System" (Paternalistic).
  *   If you optimize for **R5**, you build a "Mirror System" (Cynical).

  You cannot build a system that is both perfectly responsive to user agency (Revealed) and perfectly aligned with user morality (Stated/Second-Order) when those two are in conflict. You must explicitly choose which version of the user "owns" the account. Most current systems implicitly choose R5 (Revealed) because it maximizes engagement, while claiming to satisfy R2 via vague mission statements. This specification forces that trade-off into the open.

  **Recommendation:** Do not attempt to solve this mathematically. Treat R2 vs. R5 as a configuration parameter (e.g., "Autonomy Mode" vs. "Alignment Mode") or a policy decision determined by the risk profile of the domain (e.g., Housing requires R2 dominance; Entertainment may allow R5 dominance).
