      *   *Claim 1:* "The axiom of choice (AC) says that whenever you have a collection of nonempty sets, you can choose one element from each."
      *   *Claim 2:* "It sounds trivial, but it's not provable from the other axioms of set theory: Gödel and Cohen showed it can neither be proved nor disproved from ZF."
