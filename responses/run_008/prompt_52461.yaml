answer: |-
  Your instincts are spot-on. This pop-math summary is a classic example of getting the "vibe" right while botching the technical details. It captures the mystery and controversy surrounding the Axiom of Choice (AC) but stumbles significantly on the logic, the specific theorems, and the sociology of mathematics.

  Here is a claim-by-claim breakdown of what is accurate, what is distorted, and what is simply wrong.

  ### 1. The Definition
  > **Claim:** "The axiom of choice (AC) says that whenever you have a collection of nonempty sets, you can choose one element from each."

  *   **Verdict:** **Accurate.**
  *   **Analysis:** This is the standard informal definition. Formally, it states that for any family of nonempty sets, there exists a "choice function" that selects exactly one element from each set. For finite collections, this is trivial. The axiom is needed when the collection is infinite (specifically, uncountably infinite), where you can't just write down a rule for picking the elements.

  ### 2. The Independence Result
  > **Claim:** "It sounds trivial, but it's not provable from the other axioms of set theory: Gödel and Cohen showed it can neither be proved nor disproved from ZF."

  *   **Verdict:** **Accurate.**
  *   **Analysis:** This refers to the standard axioms of Zermelo–Fraenkel set theory (ZF). Kurt Gödel (1938) proved that AC is *consistent* with ZF (you can't disprove it). Paul Cohen (1963) proved that the negation of AC is *consistent* with ZF (you can't prove it). Together, this means AC is independent of ZF. You can do set theory with it (ZFC) or without it (ZF), and neither is logically "wrong."

  ### 3. The Equivalences (Your Suspicion Was Correct)
  > **Claim:** "AC turns out to be equivalent to several other famous statements, including Zorn's lemma, the well-ordering theorem, and the continuum hypothesis."

  *   **Verdict:** **Wrong (regarding the Continuum Hypothesis).**
  *   **Analysis:** You caught the big error here.
      *   **Zorn's Lemma** and the **Well-Ordering Theorem** *are* equivalent to AC. If you assume one, you can prove the others within ZF.
      *   **The Continuum Hypothesis (CH)** is **not** equivalent to AC. CH is a statement about the size of infinity (specifically, that there is no infinity between the integers and the real numbers). Cohen actually proved that CH is independent of **ZFC** (Set Theory + Choice). This means you can have AC and still have CH be false. Linking CH as an equivalent consequence of AC is a major technical blunder.

  ### 4. Banach–Tarski
  > **Claim:** "Its most notorious consequence is the Banach–Tarski paradox, which says a solid ball can be cut into finitely many pieces and reassembled into two balls the same size as the original..."

  *   **Verdict:** **Accurate.**
  *   **Analysis:** This is a correct description of the paradox. It relies on AC to construct "non-measurable" sets—pieces of the ball that don't have a well-defined volume in the standard sense.

  ### 5. Physical Falsehood
  > **Claim:** "...so under AC, volume is not conserved, and since volume is conserved in the real world, AC is literally false of physical space."

  *   **Verdict:** **Philosophical Distortion / Category Error.**
  *   **Analysis:** This is a very common pop-sci take, but it's misleading.
      *   **Math vs. Physics:** Mathematical axioms aren't "true" or "false" of the physical world in the same way a law of physics is. They are rules for a logical game. Asking if AC is "false of physical space" is like asking if the rules of chess are "false" of a battlefield.
      *   **Non-Measurable Sets:** The Banach–Tarski pieces are mathematically pathological. They are infinitely scattered dust-like point sets. Physical matter is not infinitely divisible (thanks to atoms/quantum mechanics), so you cannot physically perform the cut.
      *   **Conclusion:** While it is true that AC allows for mathematical objects that don't behave like physical objects, concluding that AC is "literally false" is a category error. Most mathematicians view Banach–Tarski as a warning that "volume" isn't defined for *every* possible subset of space, not as a disproof of AC.

  ### 6. Mathematicians' Usage and Countable Choice
  > **Claim:** "Most working mathematicians therefore avoid AC where they can, relying instead on the weaker countable axiom of choice, which is provable in ZF and suffices for ordinary analysis."

  *   **Verdict:** **Mostly Wrong.**
  *   **Analysis:** This section contains two significant errors:
      1.  **"Countable axiom of choice... is provable in ZF":** This is **false**. The Axiom of Countable Choice (AC$_\omega$) is weaker than full AC, but it is *not* provable in ZF. It is also independent of ZF. You must assume it as an axiom if you want to use it.
      2.  **"Most working mathematicians therefore avoid AC":** This is **false**. The vast majority of working mathematicians (analysts, algebraists, topologists) work in **ZFC** (ZF + Choice). They do not avoid AC. They accept the Banach–Tarski paradox as a strange but acceptable price to pay for the powerful tools AC provides (like ensuring every vector space has a basis, or that every ideal is contained in a maximal ideal).
      *   **Who avoids it?** Only specific subgroups, like constructivists or computer scientists focused on explicit algorithms, tend to avoid AC. To say "most" avoid it is a gross misrepresentation of the profession.

  ### Does the Conclusion Follow?
  > **Book's Take:** "Most working mathematicians therefore avoid AC..."

  *   **Verdict:** **Does Not Follow.**
  *   **Analysis:** Because the premises are flawed (CH is not equivalent, Countable Choice is not provable in ZF, and AC is not "physically false" in a way that invalidates math), the conclusion that mathematicians avoid AC is incorrect.
  *   **Reality:** The standard foundation for modern mathematics is ZFC. When a mathematician writes a paper in analysis or algebra, they implicitly assume AC unless they state otherwise. They don't lose sleep over Banach–Tarski because they know the "pieces" involved in the paradox are abstract monsters that don't correspond to anything they can measure or compute.

  ### Summary
  The book is **half-right**.
  *   **Trust it on:** The basic definition of AC, the independence from ZF (Gödel/Cohen), and the description of Banach–Tarski.
  *   **Do not trust it on:** The Continuum Hypothesis (it is not equivalent to AC), the provability of Countable Choice (it is not provable in ZF), and the sociological claim that mathematicians avoid AC (they generally embrace it).

  Your skepticism regarding the Continuum Hypothesis was the key that unlocked the reliability issue. If a book conflates CH with AC, it signals that the author is summarizing from memory without checking the technical relationships between the theorems.
