prompt: |-
  Historical-Jesus scholarship works by sifting the gospels through "criteria of authenticity": a saying or deed is credited to Jesus when it appears in multiple independent sources, when it would have embarrassed the early church, or when it is dissimilar to both early Judaism and the church's own theology; material is denied to Jesus when it looks like something the church could have invented. The surviving residue is then assembled into a coherent figure — typically an eschatological prophet — and fitting that reconstructed figure is itself used as a mark of authenticity for further material. What theory of evidence does this practice presuppose? In particular, does it presuppose that the tradition was inventive rather than conservative — that the church produced sayings freely, so that only what it had no motive or capacity to create can be Jesus' — and is that a substantive historical assumption presented as a neutral method? Is the combination of criteria even coherent, given that double dissimilarity credits an item only by cutting Jesus off from his context, while coherence credits an item by tying him to a portrait built out of whatever survived dissimilarity? Compare the practice with how historians treat comparable figures such as Socrates, whose words are accepted on multiple attestation and plausibility without any demand that they be dissimilar from Plato, the very source preserving them. Reconstruct the implicit epistemology, say where it is underdetermined — several different views of the tradition's reliability might license the same criteria — and tell me what would have to change if the gospels were treated with the ordinary canons applied to other ancient figures.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Subject:** Historical-Jesus scholarship and its "criteria of authenticity" (Multiple Attestation, Embarrassment, Dissimilarity, Coherence).
      *   **Key Questions:**
          1.  What theory of evidence does this practice presuppose?
          2.  Does it presuppose an *inventive* rather than *conservative* tradition (i.e., the church freely created sayings)?
          3.  Is this a substantive historical assumption masquerading as a neutral method?
          4.  Is the combination of criteria coherent (specifically the tension between Dissimilarity and Coherence)?
          5.  Comparison with other ancient figures (e.g., Socrates/Plato).
          6.  Reconstruct the implicit epistemology.
          7.  Identify where it is underdetermined (could different views of reliability license the same criteria?).
          8.  What would change if ordinary canons of ancient history were applied?

  2.  **Initial Analysis & Stance:**

      *   The prompt is highly critical of the standard "Third Quest" (and earlier) Historical Jesus methodology. It aligns with critiques from scholars like Chris Keith, Anthony Le Donne (Memory Theory), and perhaps Dale Allison or Jens Schröter (who question the atomistic approach).
      *   The prompt suggests the criteria are biased toward skepticism and rest on a specific (and debatable) view of early Christian tradition (radical skepticism/inventiveness).
      *   My task is not to take a side on *who* Jesus was, but to analyze the *methodology* as requested. I need to articulate the epistemological assumptions clearly.

  3.  **Drafting - Section by Section:**

      *   **1. Theory of Evidence:** What kind of logic is this? It's essentially *eliminative induction* combined with *inference to the best explanation* (but a skewed one). It treats the text as a contaminant to be filtered rather than a witness to be interpreted. It presupposes a "distortion model" of transmission.
      *   **2. Inventive vs. Conservative:** Yes, the Criterion of Dissimilarity (especially double dissimilarity) explicitly assumes the church *would* invent things that fit their theology or Jewish context. Therefore, only what fits *neither* is safe. This assumes high inventiveness/low conservation.
      *   **3. Substantive Assumption as Neutral Method:** This is a crucial point. The criteria claim to be "scientific" or "neutral," but they bake in a theological/historical premise: that the Gospels are primarily kerygmatic constructs rather than historical reports. This is a substantive assumption, not a methodological given.
      *   **4. Coherence of Criteria:** The tension between Dissimilarity and Coherence is famous. Dissimilarity isolates atoms; Coherence builds a mosaic. If Dissimilarity cuts Jesus off from Judaism, Coherence tries to glue him back together. This creates a circularity: The "Real Jesus" is defined by the criteria, and then the criteria validate material that fits that definition.
      *   **5. Comparison with Socrates:** Socrates is known *only* through Xenophon, Plato, Aristophanes. We don't demand Socrates' sayings be dissimilar from Plato's philosophy. We accept plausible attribution based on multiple attestation and consistency within the tradition. The Jesus criteria are uniquely hyper-skeptical.
      *   **6. Implicit Epistemology:** It's a form of *critical rationalism* mixed with *source criticism*. It assumes access to the "historical event" is possible only by stripping away "interpretation." It assumes interpretation = fabrication.
      *   **7. Underdetermination:** Could a conservative tradition still yield these results? Maybe. If the tradition was conservative, the criteria would still filter out authentic material (false negatives). So the criteria don't *prove* the tradition was inventive; they *assume* it to function. But one could argue the criteria are just "safety filters" regardless of the underlying theory. However, the *weight* given to them suggests the skeptical view.
      *   **8. Ordinary Canons:** If treated like Alexander the Great or Socrates: Multiple attestation would carry more weight. Embarrassment would be less crucial. Dissimilarity would be discarded. Plausibility within the context (Judaism) would be a *positive* criterion, not a negative one.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to make sure I don't just say "the criteria are bad." I need to explain *why* they exist. They arose to counter confessional history (assuming everything in the Bible is true). They were a pendulum swing.
      *   *Nuance:* Recent scholarship (Memory Theory) has largely abandoned these criteria. I should mention that this critique is actually the current consensus in advanced methodology (Keith, Le Donne, etc.), even if pop-scholarship still uses them.
      *   *Epistemology:* Use terms like "positivism," "atomistic," "hermeneutic of suspicion."
      *   *Socrates Comparison:* Be careful. We don't know the historical Socrates with certainty either (the "Socratic Problem"). But the *method* used to approach him differs. We don't say "If Plato says it, it's fake because it fits Plato's philosophy."

  5.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. State the thesis: The criteria presuppose a hermeneutic of suspicion and an atomistic epistemology that is unique in ancient history.
      *   **The Theory of Evidence:** Define it as eliminative skepticism. The text is noise; the historian finds the signal by subtraction.
      *   **Inventive vs. Conservative:** Address the assumption of creativity in the early church. Yes, it assumes invention.
      *   **The Coherence Problem:** Discuss the circularity between Dissimilarity and Coherence.
      *   **Comparative Historiography (Socrates):** Contrast the methods.
      *   **Implicit Epistemology:** Positivism, objectivism, the myth of the "uninterpreted fact."
      *   **Underdetermination:** Can different models fit? (Yes, but the criteria favor skepticism).
      *   **Ordinary Canons:** What would change? (Shift from subtraction to addition/contextualization).
      *   **Conclusion:** Summarize the shift in modern scholarship (Memory Theory).

  6.  **Drafting the Content (Iterative refinement):**

      *   *Key phrase to include:* "Hermeneutic of suspicion."
      *   *Key concept:* "Atomistic approach" vs. "Gestalt."
      *   *Key scholars to allude to:* Bultmann (form criticism), Meier (marginal Judaism), Keith/Le Donne (memory theory).
      *   *Tone:* Academic, analytical, precise.

  7.  **Final Review against Prompt Requirements:**
      *   Theory of evidence? Yes.
      *   Inventive vs. Conservative? Yes.
      *   Substantive assumption as neutral? Yes.
      *   Coherence of criteria? Yes.
      *   Socrates comparison? Yes.
      *   Implicit epistemology? Yes.
      *   Underdetermination? Yes.
      *   Ordinary canons? Yes.

  8.  *(Self-Correction during drafting)*: Make sure to explicitly answer the "underdetermination" part. The prompt asks if several views of reliability might license the same criteria. I need to argue that while a skeptic *needs* these criteria, a moderate might use them as *filters* but not *definitive proofs*. However, the *system* as a whole leans heavily toward the skeptical view. I should clarify that the criteria are underdetermined in the sense that they don't *prove* the tradition is inventive, but they *operate* as if it is.

  9.  **Final Polish:** Check for clarity and flow. Ensure the distinction between "Third Quest" and "Memory Theory" is clear as it contextualizes the critique. (Proceed to generate output).

  *(Note: The prompt is quite advanced, implying familiarity with NT scholarship debates. The response should match that level.)*

  *Plan:*
  1.  **Epistemological Framework:** Define the "Hermeneutic of Suspicion" and "Positivist Historicism."
  2.  **Assumption of Inventiveness:** Analyze the Criterion of Dissimilarity.
  3.  **Internal Coherence:** Address the Dissimilarity/Coherence tension.
  4.  **Comparative Historiography:** The Socrates/Plato analogy.
  5.  **Underdetermination:** Can the criteria work with a conservative model?
  6.  **Ordinary Canons:** How standard ancient history treats sources.
  7.  **Conclusion:** The shift toward Memory Theory.

