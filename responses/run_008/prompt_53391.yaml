answer: |-
  ### Exam Question

  **Question 4:**
  Benacerraf argues that a causal theory of knowledge renders mathematical Platonism untenable. Hartry Field attempts to dissolve this epistemic access problem by arguing that mathematical beliefs are reliable "for free" because mathematics is conservative over nominalistic scientific theories. 

  Critically evaluate Field's proposal. Specifically, address the objection that the claim of conservativeness is itself established using substantial mathematical machinery (e.g., model theory), thereby relocating the epistemic burden rather than solving it. Does Field's response require a deflationary stance on mathematical truth to succeed? Finally, consider whether this specific formulation of the access problem generalizes to domains like modal metaphysics or ethics, or if mathematics is unique in a way that permits Field's solution.

  *(Note: Pure exposition of Benacerraf's dilemma or Field's nominalism will receive minimal credit. Focus on the epistemic implications of the conservativeness proof and the scope of the problem.)*

  ***

  ### Model Answer

  Field's response to Benacerraf shifts the focus from causal contact to reliability. Benacerraf assumes that for a belief to constitute knowledge, there must be a causal explanation linking the knower to the fact. Field grants that causal contact with abstracta is impossible but denies that this precludes knowledge. He argues that if mathematics is conservative over nominalistic physics—meaning it entails no new claims about the concrete world—then our mathematical beliefs cannot lead us astray regarding empirical reality. If our nominalistic premises are true, adding mathematics won't generate false nominalistic conclusions. Thus, the reliability of mathematical belief is guaranteed by the logical property of conservativeness, requiring no causal mechanism.

  However, this invites a potent meta-theoretic objection. To assert that mathematics is conservative, one typically employs model-theoretic proofs (e.g., showing that any model of the nominalistic theory can be extended to a model of the mathematical theory). These proofs rely on substantial set-theoretic machinery. If the epistemic status of set theory is precisely what is in doubt, using it to vouch for the safety of mathematics appears viciously circular. It seems we must assume the reliability of mathematical reasoning to prove that mathematical reasoning is reliable.

  Field avoids this circle only by adopting a deflationary or fictionalist ontology. For the robust Platonist, the conservativeness proof describes a fact about abstract objects, which reintroduces the access problem at the meta-level: how do we know the conservativeness fact holds? For Field, the proof is merely a syntactic manipulation of symbols. We do not need to know that the conservativeness statement is *true* in a robust sense; we only need to know that the derivation is valid within the formal system. By denying that mathematical statements assert truths about mind-independent objects, Field removes the need for a causal link to such objects, even at the meta-level. The "knowledge" is really just mastery of a useful linguistic framework.

  This formulation suggests the access problem is not uniform across domains. In modal metaphysics, a Field-style solution is harder to sustain. Modal claims (e.g., "it is possible that P") are not conservative over actualist claims in the same way; they expand the domain of quantification. If one is a modal realist, they face a Benacerraf-style problem regarding access to possible worlds. If one is an actualist, they must explain the truthmakers for modal claims without invoking problematic entities, but conservativeness alone doesn't solve the truthmaker gap.

  In ethics, the problem is more severe. Ethical facts (if they exist) are not conservative over natural facts; they supervene on or are constituted by natural facts but add normative content. An evolutionary debunking argument (à la Street) suggests our moral beliefs are shaped by fitness, not truth. Unlike mathematics, ethics is not "empty" or conservative; it makes substantive claims about what we ought to do. Field's strategy works for mathematics precisely because he argues mathematics *doesn't* make substantive claims about the world. Therefore, the access problem is unique to robust realism. If one is a robust realist about math, Field's solution fails due to the meta-theoretic burden. If one is a fictionalist, the problem dissolves, but this option is unavailable for domains like ethics where fictionalism is less tenable. Thus, Field saves mathematical knowledge only by sacrificing mathematical truth, a trade-off that does not generalize to domains where robust truth is indispensable.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Accurate Reconstruction of Field's Conservativeness Argument (4 Marks)**
  *   **Must Hit:** Student must explain that Field replaces causal contact with reliability guaranteed by the logical property of conservativeness (math adds no new nominalistic consequences).
  *   **Typical Botch:** Students conflate conservativeness with applicability or argue Field simply denies math is useful, missing the logical safety net argument.

  **2. Engagement with the Meta-Theoretic Objection (4 Marks)**
  *   **Must Hit:** Student must articulate the worry that proving conservativeness requires mathematical tools (model theory/set theory), potentially begging the question against the skeptic.
  *   **Typical Botch:** Students dismiss the objection as "simple circularity" without explaining *why* using math to justify math is problematic in this specific epistemic context.

  **3. Analysis of Field's Ontological Commitments (4 Marks)**
  *   **Must Hit:** Student must identify that Field's solution relies on fictionalism/deflationism (denying robust truth) to avoid the meta-theoretic burden.
  *   **Typical Botch:** Students attribute robust realism to Field or fail to see how deflationism blocks the regress of justification.

  **4. Evaluation of Generalization (Modality/Ethics) (4 Marks)**
  *   **Must Hit:** Student must distinguish math from modality or ethics, noting that ethics/modality are not conservative over natural facts in the same way, making Field's fix domain-specific.
  *   **Typical Botch:** Students claim the problem applies identically to all domains without analyzing the structural differences (e.g., normativity vs. logical emptiness).

  **5. Critical Synthesis and Argumentative Stance (4 Marks)**
  *   **Must Hit:** Student must take a position on whether Field succeeds (e.g., "He succeeds only by changing the subject" or "The meta-worry is fatal for realists").
  *   **Typical Botch:** Students sit on the fence ("Field has good points but also bad points") without offering a reasoned conclusion about the viability of the solution.
