      *   **Class Size/Time:** 24 students, 80 minutes.
      *   **Core Objective:** Students should *feel* that plausible antiquity can be manufactured and that "felt age" $\neq$ "actual age."
      *   **Proposed Activity Structure:** 5 groups, draw cards (fictional country + political need), invent a tradition, present as a museum docent/official (claiming deep roots), 1 card is actually a real tradition (masked), individual rating of age, reveal, debrief.
      *   **Debrief Requirements:**
          1.  Map activity to analytical distinctions (custom vs. tradition, ritual repetition, vague history, scaling community).
          2.  Use age ratings as evidence (reveal strategy).
          3.  Address the "sincerity gap" (students know they are faking it, real believers don't).
          4.  Predict pitfalls (costumes over rituals, meta/jokey presentations, rating bias) and offer solutions.

  2.  **Evaluate and Refine the Activity Design:**
      *   *Timing:* 80 minutes is tight.
          *   Intro: 5 mins.
          *   Group Work: 25 mins (as requested).
          *   Presentations: 5 groups x 5 mins = 25 mins.
          *   Rating/Reveal: 10 mins.
