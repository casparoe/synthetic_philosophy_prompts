      *   *The "Real Tradition" Card:* This is a brilliant twist. It needs to be obscure enough not to be immediately recognized but specific enough to be authentic. Or, better yet, a very *famous* tradition presented in a way that obscures its identity until the reveal. Actually, the prompt says "presented in the same docent voice, without saying it is real." If I pick something like "Japanese Tea Ceremony," they might know it. If I pick "The State Opening of Parliament," they might know it. A good candidate is something like "The Swiss Federal Day of Thanksgiving" or "The American Pledge of Allegiance" (often thought older than it is). Let's suggest a few options for the instructor.
      *   *Rating Scale:* Needs to be simple. "Estimated Year of Origin" is better than "1-10 scale" because it forces concrete thinking.
      *   *Group Size:* 24 students / 5 groups = 4.8. So four groups of 5 and one of 4, or five groups of 5 (with one student helping the instructor/timekeeping). Let's suggest 5 groups of 5 (invite one extra student or make one group of 4). Actually, 24/5 is messy. 4 groups of 6? No, user said 5 groups. Let's suggest 4 groups of 5 and 1 group of 4.

  3.  **Drafting the Activity Plan:**
      *   *Title:* "The Ministry of Heritage."
      *   *Materials:* Cards, paper/markers, rating slips.
      *   *Instructions:* Need to be crisp. Emphasize the *voice* (docent/official).
      *   *The Cards:* Need to be fleshed out.
