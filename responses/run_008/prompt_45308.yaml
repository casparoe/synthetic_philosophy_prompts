          *   Card 5: The "Real" One (Template).
      *   *The Reveal:* This needs drama. Collect the estimates. Calculate the average. Reveal the real one last.

  4.  **Developing the Debrief (The Core Intellectual Work):**
      *   *Mapping to Theory:*
          *   *Custom vs. Tradition:* Did they invent something new (custom) or claim it was old (tradition)? Hobsbawm's distinction.
          *   *Invariance:* Did they specify exact words/movements? (Ritual rigidity).
          *   *Vague Past:* Did they use phrases like "since time immemorial" or "ancient ancestors"?
          *   *Imagined Community:* How does this bind strangers? (Anderson).
      *   *The Reveal:* How to handle the data. If the real one is rated younger than a fake one, that's the win. If a student spots it, acknowledge their cultural capital but ask *why* it felt real (symbols they recognized).
      *   *The Sincerity Gap:* This is crucial. Students are cynical creators. Real participants are sincere believers. The debrief must explain *why* belief happens (repetition, emotional resonance, institutional backing). The activity shows the *mechanism*, not the *experience*.
      *   *Pitfalls:*
          *   *Costumes over Ritual:* Push them to focus on the *script* and *sequence*.
          *   *Meta/Jokey:* Warn them that "winking" at the audience undermines the simulation.
          *   *Rating Bias:* Remind them to rate based on the *claim*, not their suspicion.

  5.  **Refining the "Real Tradition" Card:**
      *   It needs to be a tradition that *feels* ancient but might be recent, or one that fits the "invented" mold perfectly.
      *   *Option A:* The American Pledge of Allegiance (1892, "under God" added 1954). Fits "Post-Colonial/State Building."
      *   *Option B:* The Scottish Kilt (18th century, not ancient). Fits "Monarchy/Continuity."
      *   *Option C:* The Welsh Eisteddfod (Revived/Invented 18th/19th century). Fits "Diaspora/Culture."
      *   *Selection:* The **Scottish Kilt/Tartan** is a classic Hobsbawm example. Or the **Pledge of Allegiance**. Let's go with the **Pledge** because it fits a "State Building" narrative well, or **The Swiss National Day** (established 1891, backdated to 1291). Let's suggest the **Swiss National Day** or **The Union Jack**. Actually, the **Welsh Llanfairpwllgwyngyll...** no too specific.
      *   *Best Choice:* **The American Pledge of Allegiance.** It sounds ancient, involves an oath, binds strangers, and was explicitly invented for a specific political purpose (Columbus Day 1892).
      *   *Alternative:* **The British Coronation Spoon.** (Ancient object, ritual invented around it).
      *   *Decision:* I will provide a template so the instructor can choose, but recommend the **Pledge of Allegiance** or **The Scottish Tartan** as they are high-impact.

  6.  **Addressing the "Sincerity Gap":**
      *   The activity creates *architects*, not *believers*.
      *   Debrief point: In the real world, the architects die, and the second generation forgets it was invented.
      *   Key concept: "Forgetting the invention is a condition of the tradition's success."

  7.  **Addressing Pitfalls:**
      *   *Jokey:* Give them a "Seriousness Bonus" (even if fake) or emphasize that the grade depends on plausibility.
      *   *Costumes:* Limit materials to paper/pen. No props.
      *   *Rating:* Use a specific year estimate, not a scale.

  8.  **Final Review against Constraints:**
      *   80 mins? Yes, schedule is tight but workable.
      *   24 students? Yes, group sizes adjusted.
      *   Pre-reading? Yes, no jargon assumed.
      *   Debrief requirements met? Yes.

  9.  **Writing the Response:**
      *   Tone: Professional, pedagogical, supportive but candid.
      *   Structure: Activity Overview, Materials, Step-by-Step Flow, The Cards, The Reveal, The Debrief (Theory, Sincerity, Pitfalls).

