  - A river finding its way to the sea by always taking the steepest path: not intelligent, and I'd be annoyed with anyone who said otherwise.
  - A single ant: not intelligent. The colony as a whole building bridges and farming fungus: intelligent-ish? At least intelligent-adjacent. The parts aren't smart but the system somehow is, and I don't know what to do with that.

