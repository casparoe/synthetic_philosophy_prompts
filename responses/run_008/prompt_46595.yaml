  5. "New predictions" -- what the principle says about two or three cases I didn't mention, ideally ones that would stress-test it. Pick cases a software engineer would find natural. One short paragraph each.

  Also feel free to tell me if my Deep Blue snobbery is philosophically defensible or if I just need to get over myself. That one bugs me.
