answer: |-
  1. Bottom line
  There is a coherent principle underlying most of your verdicts: intelligence requires **adaptive generalization through compression** rather than rote retrieval or blind optimization. Your intuitions track whether a system builds internal models to handle novelty, versus simply looking up answers or following physical laws. However, one of your verdicts is inconsistent with this principle and likely reflects a human bias.

  2. Candidate principle (or principles)
  Intelligence is the capacity for real-time, flexible goal-directed behavior that arises from compressed internal or distributed models of the environment, rather than from pre-computed lookup tables, brute-force search, or blind physical optimization. This principle prioritizes **generalization** over **retrieval**: a system is intelligent if it can handle novel situations using limited resources by abstracting patterns, not by storing every possible outcome. The 'Lookup Table' case motivates the exclusion of pre-computed mappings. The 'River' and 'Evolution' cases motivate the exclusion of blind physical optimization without representation. The 'Ant Colony' case motivates allowing distributed models rather than requiring a central processor. The 'Spam Filter' case motivates requiring active goal-directedness rather than passive classification. Finally, the 'Deep Blue' vs. 'AlphaGo' distinction is captured by weighting compression (heuristics) higher than expansion (brute-force search), as the former implies understanding structure rather than just processing power.

  3. Case by case

  | Case | Your Verdict | Principle's Verdict | Explanation |
  | :--- | :--- | :--- | :--- |
  | **AlphaGo** | Intelligent | **Intelligent** | Uses neural nets to compress board states into heuristics (models). |
  | **Deep Blue** | Intelligent (less) | **Intelligent (less)** | Uses search (modeling), but relies heavily on brute-force expansion vs. compression. |
  | **Crow** | Intelligent | **Intelligent** | Builds a causal model of traffic/physics to achieve a goal. |
  | **Spam Filter** | Not Intelligent | **Not Intelligent** | Passive classification tool; lacks autonomous goal-directed action. |
  | **Calculator** | Not Intelligent | **Not Intelligent** | Rigid function; no generalization or modeling of novelty. |
  | **Savant** | Intelligent | **Intelligent** | *See "What has to go."* Verdict stands only if evaluating the whole agent, not the skill. |
  | **Lookup Table** | Not Intelligent | **Not Intelligent** | Perfect behavior, but zero compression or internal modeling. |
  | **Evolution** | Not Intelligent | **Not Intelligent** | Blind optimization over generations; no real-time modeling. |
  | **River** | Not Intelligent | **Not Intelligent** | Blind physical optimization; no representation of goals. |
  | **Ant Colony** | Intelligent-ish | **Intelligent** | Distributed modeling via stigmergy; real-time adaptive problem solving. |
  | **LLM** | Flip-flop | **Intelligent Capacity** | Compresses data into weights to generalize novelty, but lacks autonomous agency. |

  4. What has to go
  To make your set of verdicts consistent, you have to drop the intuition that the **Savant is intelligent while the Calculator is not**, based solely on that specific arithmetic skill. If the mechanism is identical (rigid arithmetic manipulation), calling one intelligent and the other not is "carbon chauvinism." The Savant is intelligent because they are a *person* with broader agency, not because the arithmetic module itself is smarter than a calculator. If you isolate the skill, the verdicts should match.

  Regarding your **Deep Blue snobbery**: it is philosophically defensible. If intelligence values *efficiency* and *abstraction*, brute-force search is "dumber" than heuristic intuition. Deep Blue wins by throwing hardware at the problem; AlphaGo wins by understanding the shape of the problem. Your gut correctly identifies that compression (insight) is more "intelligent" than expansion (search).

  Regarding the **LLM**: My honest read is that it exhibits intelligent *capacities* (compression, generalization, modeling) but lacks *agency*. It is more like AlphaGo than the Spam Filter, but without its own goals. It is an intelligent engine, not an intelligent agent.

  5. New predictions
  **1. A CI/CD Pipeline Script:** A script that automatically runs tests and deploys code when checks pass is **not intelligent**. It follows rigid rules (if/then) without modeling the environment or handling novel failures. It is a calculator for workflows.

  **2. A Genetic Algorithm Designing an Antenna:** An algorithm that evolves antenna shapes via mutation and selection to optimize signal strength is **not intelligent**. Like evolution, it uses blind variation and selection without building an internal model of electromagnetism. It optimizes, but doesn't "understand."

  **3. A Self-Driving Car Navigating Construction:** If the car detours around unmarked construction cones by inferring road geometry and intent of human flaggers, it is **intelligent**. It is building a real-time model of a novel environment to achieve a goal, exceeding its pre-programmed lookup maps.
