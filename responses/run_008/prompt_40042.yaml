answer: |-
  # Workshop Handout: Mapping the Politics of Artifacts
  **Based on Langdon Winner's "Do Artifacts Have Politics?" (1980)**

  ## I. Design Note: Selecting the Splits
  To avoid jargon ("determinism," "constructivism"), we discard abstract questions like *"Is technology neutral?"* Instead, we use **six concrete diagnostic cases**. 
  *   **Chosen:** Moses' Overpasses (Intent vs. Material), Nuclear Plants (Necessity vs. Organization), Barbed Wire (Unintended Consequences), Hiring Algorithms (Malleability), The Grid (Unit of Analysis), and Redesign Possibility (Ambivalence).
  *   **Discarded:** Questions about "agency" or "causality" in the abstract. These invite metaphysical debates rather than revealing political commitments. The goal is to sort *political intuitions* about design, not ontological theories of objects.

  ## II. The Logical Space (Before the Labels)
  Before assigning names (Winner, Ellul, SCOT), we map the logical combinations of your answers. There are three primary dimensions:
  1.  **Source:** Is politics in the *intent/use* or the *material design*?
  2.  **Strength:** Is the political effect *contingent* (could be otherwise) or *necessary* (hard constraint)?
  3.  **Unit:** Is the politics in the *artifact*, the *system*, or the *process*?

  **Flagged Empty/Incoherent Combinations:**
  *   **"Neutral Tool + Necessary Hierarchy":** *Incoherent.* If a tool is neutral, it cannot *necessitate* a social structure. (Often claimed, rarely defended under scrutiny).
  *   **"Intrinsic Politics + Total Randomness":** *Unattractive.* If politics is intrinsic to the artifact, the design process cannot be totally random/contingent.
  *   **"Artifact Politics + No Systemic Effect":** *Unexplored.* Rare to argue an artifact has politics that do not ripple into the wider system.

  ## III. The Decision Tree
  *Start at Node 1. Follow your honest intuition about the case to the next node.*

  **Node 1: The Moses Overpasses (Intent vs. Material)**
  Robert Moses built low bridges to keep buses (and poorer riders) off parkways.
  *   **A:** The politics were in Moses's *head*. If a different commissioner built higher bridges, the road would be democratic. *(Go to Node 2)*
  *   **B:** The politics were in the *concrete*. The bridge itself excludes, regardless of who built it. *(Go to Node 3)*

  **Node 2: The Hiring Algorithm (Contingency)**
  An algorithm rejects resumes from women.
  *   **A:** This is a bug/bias in the training data. We can fix the code to make it fair. *(Leaf: Liberal Instrumentalism)*
  *   **B:** The code reflects the hiring process itself, which is the real site of politics. *(Leaf: Social Constructivism/SCOT)*

  **Node 3: The Nuclear Plant (Necessity)**
  Nuclear power requires centralized, quasi-military security.
  *   **A:** Yes. The physics and radiation risk *demand* this hierarchy. No other way works. *(Go to Node 4)*
  *   **B:** No. We *choose* this organization. Other energy systems could be organized militarily too. *(Go to Node 5)*

  **Node 4: The Autonomous Tech (Scope)**
  Is this necessity true for *all* high-tech systems?
  *   **A:** Yes. Technology as a whole (*La Technique*) creates an autonomous system of control. *(Leaf: Strong Determinism/Ellul)*
  *   **B:** No. Only *specific* artifacts (like nukes or bridges) have these requirements. *(Leaf: Winner's Artifact Politics)*

  **Node 5: Barbed Wire (Unintended Consequences)**
  Barbed wire was for cattle, but created colonial borders.
  *   **A:** The politics are only in how it was *used*. The wire itself is neutral. *(Return to Leaf: Liberal Instrumentalism)*
  *   **B:** The wire *afforded* this restructuring. It made borders cheap and enforceable. *(Go to Node 6)*

  **Node 6: Critical Redesign (Malleability)**
  Can we redesign the nuclear plant or algorithm to be democratic?
  *   **A:** No. The technical requirements block democratic control. *(Return to Leaf: Winner/Ellul)*
  *   **B:** Yes. We can change the design to encode different values (Democratic Rationalization). *(Leaf: Critical Theory/Feenberg)*

  ## IV. Position Key & Blind Spots
  **Where you landed:**
  *   **Liberal Instrumentalist:** (Node 2A or 5A). Tech is a tool; politics is in the user.
  *   **Social Constructivist (SCOT):** (Node 2B). Politics is in the design process/closure, not the object.
  *   **Strong Determinist (Ellul):** (Node 4A). Technology is an autonomous force shaping society.
  *   **Winner's Position:** (Node 4B). Specific artifacts have inherent political properties (some require authority, some embody exclusion).
  *   **Critical Theory (Feenberg):** (Node 6B). Tech encodes power, but is ambivalent and can be redesigned for democracy.

  **Known Indistinguishabilities:**
  *   **Winner vs. Feenberg:** This tree groups them closely. Both agree artifacts encode power. The split is strictly on **Node 6 (Malleability)**. Winner is skeptical that "democratic nuclear power" is possible; Feenberg argues it is. *To distinguish them further, ask:* "Is the current design the *only* efficient solution?" (Winner: Often Yes; Feenberg: No, it's a crystallization of power).
  *   **Winner vs. Ellul:** Distinguished at **Node 4**. Winner is a "particularist" (specific artifacts); Ellul is a "holist" (Technology as a system).
  *   **SCOT vs. Feenberg:** Both see contingency. SCOT focuses on how groups negotiate meaning (Node 2B); Feenberg focuses on how to actively redesign the technical code (Node 6B).

  ## V. Traversal Guide for Participants
  1.  **Read the Case:** Don't think about the theory. Think about the bridge, the plant, or the code.
  2.  **Pick the Path:** Choose the option that matches your gut reaction, even if it feels inconsistent with your previous answer.
  3.  **Check the Leaf:** Read the description. Does it feel like your view?
  4.  **Discuss:** If you landed on "Winner" but your friend landed on "Feenberg," debate Node 6. Is the technology fixed, or can it be democratized?

  *Note: If your path led to an "Incoherent" box in Section II, you may be holding two conflicting intuitions. This is a productive place to start your paper.*
