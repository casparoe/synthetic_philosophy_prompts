answer: |-
  Here is a procedure designed for your committee, followed by the three case runs.

  ### The Loop-Aware Classification Protocol (LACP)
  **Time:** 90 Minutes
  **Goal:** Move from "Is this real?" to "What happens when we name this?"
  **Philosophy:** Embedded. No jargon. The core assumption is that a diagnosis is not just a discovery; it is an intervention that changes the patient.

  #### Phase 1: Clinical Utility & Evidence (30 Minutes)
  *Standard medical due diligence. If this fails, stop.*

  1.  **Sensitivity/Specificity:** Does the proposed screen/diagnosis distinguish the condition from normal variance or other conditions at a rate acceptable for our setting?
      *   *Sufficient Answer:* Published validation data in a population similar to ours.
      *   *Termination:* If false-positive rate > 20% (or system-defined threshold), vote **NO**.
  2.  **Actionability:** If we find a positive, do we have a treatment pathway ready *now*?
      *   *Sufficient Answer:* Yes, we have providers trained and slots available.
      *   *Termination:* If we screen but cannot treat, vote **NO** (screening without treatment is unethical).

  #### Phase 2: The Identity Forecast (30 Minutes)
  *This is the Hacking engine. It asks how the label changes the person.*

  3.  **The Relief vs. Reduction Test:** Will this label primarily relieve suffering (validation, access) or reduce the person (stigma, fatalism)?
      *   *Sufficient Answer:* Cite patient testimony or qualitative data.
      *   *Judgment Call:* This is not a fact. If the committee splits >40/60, **Handoff to Patient Advisory Board**.
  4.  **The Behavioral Loop:** Will knowing this label change the patient's behavior in a way that worsens the prognosis? (e.g., "I have the gene for X, so I can't control it" or "I fit the TikTok description, so I must act the part").
      *   *Sufficient Answer:* Evidence of iatrogenic harm or "symptom contagion" in similar categories.
      *   *Termination:* If evidence suggests the label creates the symptoms it claims to measure, vote **NO**.

  #### Phase 3: Systemic Incentives (15 Minutes)
  *Follows the money and the power.*

  5.  **The Payer/Power Check:** Who benefits financially or administratively from this code?
      *   *Sufficient Answer:* Clear alignment between patient benefit and system revenue.
      *   *Termination:* If the primary beneficiary is a third party (employer, insurer, health system) without direct patient clinical gain, vote **NO**.

  #### Phase 4: The Decision Fork (15 Minutes)
  6.  **The Verdict:**
      *   **Adopt:** Phases 1-3 passed.
      *   **Reject:** Any Termination triggered.
      *   **Pilot:** Phase 1 passed, Phase 2 is ambiguous (needs real-world data on loops).
      *   **Handoff:** Phase 2 triggered a value split. Send to Patient Advisory Board before final vote.

  ***

  ### Case Run 1: Universal Gaming Disorder Screening (Adolescent Well Visits)

  **Phase 1: Clinical Utility**
  *   **Evidence:** ICD-11 inclusion exists, but prevalence estimates vary wildly (0.5% to 5%). Sensitivity of current screens is low; they often capture high engagement, not pathology.
  *   **Actionability:** We have very few therapists specializing in behavioral addiction. Waitlists are 3 months.
  *   **Status:** *Warning.* Actionability is weak.

  **Phase 2: Identity Forecast**
  *   **Relief vs. Reduction:** High risk of reduction. Parents may view normal developmental play as pathology. Adolescents may adopt "addict" identity to explain academic struggles unrelated to gaming.
  *   **Behavioral Loop:** High risk. Screening at a well-visit medicalizes a behavior that is often social. It invites parents to police normal autonomy.
  *   **Status:** *Risk Identified.*

  **Phase 3: Systemic Incentives**
  *   **Payer/Power:** Health system gains billing codes. Insurers may deny claims based on "lifestyle." No clear third-party beneficiary other than anxious parents seeking a cause for grades.
  *   **Status:** *Neutral/Negative.*

  **Verdict:** **NO (for Universal Screening).**
  **Reasoning:** Fails Actionability (Phase 1) and risks Negative Behavioral Loop (Phase 2).
  **Alternative:** Adopt a *targeted* screening protocol only when academic/social dysfunction is already present, not universally.

  ***

  ### Case Run 2: Workplace Burnout Code (Billing Employers)

  **Phase 1: Clinical Utility**
  *   **Evidence:** ICD-11 classifies Burnout (QD85) as an *occupational phenomenon*, explicitly **not** a medical condition.
  *   **Actionability:** Counseling helps, but the root cause is environmental.
  *   **Status:** *Warning.* Diagnostic validity is technically absent by ICD definition.

  **Phase 2: Identity Forecast**
  *   **Relief vs. Reduction:** Initial relief ("It's not just me"). Long-term reduction: Locates the pathology in the employee's resilience rather than the workplace's demands.
  *   **Behavioral Loop:** Negative. Encourages employees to seek medical fixes for structural problems. May discourage collective action or HR complaints in favor of individual therapy.
  *   **Status:** *High Risk.*

  **Phase 3: Systemic Incentives**
  *   **Payer/Power:** **Critical Fail.** Primary beneficiary is the Health System (revenue) and the Employer (shifts liability from OHR/HR to Medical). Patient pays via co-pays and potential stigma on insurance records.
  *   **Status:** *Termination Triggered.*

  **Verdict:** **REJECT.**
  **Reasoning:** Fails Phase 3 (Conflict of Interest) and Phase 1 (ICD definition). This is a judgment call wearing a lab coat: we are refusing to medicalize a labor dispute.
  **Handoff:** Refer proposal to Ethics Committee, not Patient Board. This is institutional integrity, not patient preference.

  ***

  ### Case Run 3: Retire Adult ADHD Screening Instrument

  **Phase 1: Clinical Utility**
  *   **Evidence:** The proposal argues the *instrument* is saturated. Data shows positive predictive value (PPV) has dropped from 65% to 15% in the last 24 months.
  *   **Analysis:** The screen is no longer discriminating. It is capturing cultural mimicry (TikTok symptoms) rather than neurodevelopmental history.
  *   **Status:** *Critical Fail.* A screen that yields 85% false positives is clinically useless and dangerous.

  **Phase 2: Identity Forecast**
  *   **Relief vs. Reduction:** Keeping the screen validates self-diagnosis without clinical rigor. Retiring it risks denying access to those who are hesitant to speak up.
  *   **Behavioral Loop:** The "TikTok Loop" is already active. Patients are performing symptoms to match the screen. Continuing the screen reinforces the performance.
  *   **Status:** *Negative Loop Confirmed.*

  **Phase 3: Systemic Incentives**
  *   **Payer/Power:** Keeping the screen floods providers with low-acuity referrals, delaying care for severe cases. Retiring it saves system resources but angers patients seeking validation.
  *   **Status:** *System Strain.*

  **Verdict:** **SUPPORT PROPOSAL (Retire the Screen).**
  **Reasoning:** This is the answer you won't like.
  **The Hard Truth:** The screening tool is broken. Not because ADHD isn't real, but because the *cultural category* has drifted faster than the *clinical instrument*. When 50% of walk-ins believe they have the condition based on social media, a checklist adds no information.
  **Mitigation:** Do not retire the *assessment*. Move to **Clinician-Triggered Assessment**. If a provider suspects ADHD based on history (not just patient report), they order the full workup.
  **Why you'll hate it:** It reduces case finding. It puts the gatekeeping power back in the doctor's hand, which introduces bias. It acknowledges that the "loop" of social media has contaminated the data pool so thoroughly that universal screening is now noise.

  ***

  ### Limitations: Where the Checklist Breaks

  You asked for bluntness about where two committees could run this and disagree. Here is where the LACP fails to compute:

  1.  **The "Harm" Threshold (Phase 2):**
      One committee might view the "Gaming Disorder" label as a necessary intervention to save a kid's grades. Another might view it as dangerous stigma. The checklist asks for evidence of harm, but *what counts as harm* is a value judgment. A conservative committee sees identity change as risk; a progressive committee sees identity change as validation. The checklist cannot resolve this; it only flags it for the Patient Advisory Board.

  2.  **The "Saturation" Point (Phase 1 - ADHD Case):**
      We determined the ADHD screen is "saturated." But who decides the threshold? Is a 15% PPV acceptable if it catches the 5% of women who were historically missed? A committee focused on resource efficiency says "Retire." A committee focused on equity says "Keep and add a filter." The math doesn't dictate the trade-off between efficiency and access.

  3.  **The Institutional Cowardice (Phase 3 - Burnout Case):**
      The checklist says "No" to the Burnout code because it benefits the employer. But what if the system *needs* that revenue to keep the lights on for indigent care? The checklist treats financial incentive as a conflict of interest. In reality, it's a survival mechanism. A committee might vote "Yes" on Burnout coding explicitly to cross-subsidize free care, accepting the ethical compromise. The LACP calls this a "No," but real-world governance is often about choosing which sin to commit.

  **Final Note on Hacking:**
  You noted Hacking didn't think loops were inherently bad. The LACP accounts for this in Phase 2 (Relief vs. Reduction). If a label gives a marginalized group language for their suffering (e.g., PTSD in the 70s, or potentially Autism today), the "Loop" is positive. The procedure doesn't stop the loop; it asks if the loop *lifts* the patient or *traps* them.

  In the ADHD case, the loop is currently trapping: patients are performing symptoms to get a label they saw online. Retiring the screen breaks the trap, even if it hurts the program you built. That is the cost of honest classification.
