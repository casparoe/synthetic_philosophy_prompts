answer: |-
  # PAGE 1 OF HANDOUT

  ## PHILOSOPHY OF MIND: THE "THEATER" DECISION TREE
  **Instructions:** Read the cases below. Answer the questions based on your own intuition. Do not worry about "right" answers; there are none. Your path reveals your philosophical commitments.

  ### THE CASES
  1.  **Color Phi:** A red dot flashes. Then, a green dot flashes nearby. You see a **single red dot move** and turn green midway. *Problem:* Nothing moved. Nothing was green at the start. Your brain "filled in" the motion and color change after the second dot appeared.
  2.  **Cutaneous Rabbit:** Taps at your wrist, then elbow. You feel a sequence marching up the arm. *Problem:* You feel taps at locations on the forearm that were never touched, seemingly before the elbow tap physically happened.

  ---

  ### THE DECISION TREE

  **START HERE:**
  In the cases above, you sincerely report seeing motion or feeling taps that didn't physically exist.

  **NODE 1: THE FACT OF THE MATTER**
  Is there a **fact of the matter** about exactly *when* and *what* you experienced, independent of your later report?
  *(Example: Did the "red-to-green" experience definitely happen at Time X, even if we can't measure it?)*
  *   **NO:** There is no single "time of experience." The brain revises the story over time; asking "when did it happen?" is like asking "when did the draft become final?" before the deadline.
      *   ➔ **GO TO LEAF A**
  *   **YES:** There is a real, specific moment the experience occurred. My report might be wrong, but the experience itself was definite.
      *   ➔ **GO TO NODE 2**

  **NODE 2: THE SUBSTANCE**
  Where does this definite experience happen?
  *   **IN A NON-PHYSICAL MIND/SOUL:** The brain processes data, but the "show" happens in a non-physical substance that doesn't follow physical time/space rules.
      *   ➔ **GO TO LEAF B**
  *   **IN THE PHYSICAL BRAIN:** The experience is entirely a biological event in the head.
      *   ➔ **GO TO NODE 3**

  **NODE 3: THE AUDIENCE**
  If it happens in the brain, is there a specific **place or mechanism** where information "arrives" to become conscious (a central finish line)?
  *   **NO:** Consciousness isn't a place things arrive. It's a process of information becoming *available* to many systems (speech, memory, action) at once. There is a "broadcast," but no one watching the screen.
      *   ➔ **GO TO LEAF C**
  *   **YES:** There is a central point (a "theater") where data assembles and is presented.
      *   ➔ **GO TO NODE 4**

  **NODE 4: THE EDITING (ORWELL VS. STALINESQUE)**
  In the Phi/Rabbit cases, the experience doesn't match the physical stimulus. How was the mismatch created at that central point?
  *   **STALINESQUE:** The brain edited the input *before* it reached the theater. (Like a censored broadcast: the audience never saw the raw data).
  *   **ORWELL:** The brain let the raw data into the theater, but rewrote the *memory* of it afterwards. (Like a history book revision: the audience saw it, but later forgot it correctly).
      *   ➔ **GO TO LEAF D**

  ---
  *(Turn the page for your result)*

  # PAGE 2 OF HANDOUT

  ### YOUR RESULTS (LEAVES)

  **LEAF A: MULTIPLE DRAFTS MODEL**
  *(You answered NO at Node 1)*
  **View:** There is no "Cartesian Theater." There is no single moment where unconscious processing becomes conscious. The brain produces many "drafts" of events over time. Your sincere report is just the latest draft.
  **Key Claim:** Asking "When did the experience occur?" has no answer. There is no fact of the matter.

  **LEAF B: CARTESIAN DUALISM**
  *(You answered YES at Node 1, Non-Physical at Node 2)*
  **View:** The brain is a machine, but *you* are not the brain. The "show" happens in a non-physical mind. Physical illusions (Phi) are just data sent to the non-physical viewer, who interprets them.
  **Key Claim:** The theater exists, but it is not in space-time.

  **LEAF C: GLOBAL WORKSPACE THEORY**
  *(You answered YES at Node 1, Physical at Node 2, NO at Node 3)*
  **View:** There is a real moment of "ignition" or broadcast (a fact of the matter), but there is no little man watching it. Consciousness is global *access* to information, not a show for an audience.
  **Key Claim:** A finish line exists (broadcast), but no viewer is required.

  **LEAF D: THE "SECOND THEATER" (MATERIALIST CARTESIAN)**
  *(You answered YES at Node 1, Physical at Node 2, YES at Node 3)*
  **View:** There is a physical place in the brain where it all comes together. You chose a specific editing story (Orwell or Stalinesque).
  **Key Claim:** Consciousness is a show inside the head. There is a fact about when it aired and how it was edited.

  ---

  ### DISCUSSION PREP (INSTRUCTOR USE ONLY)

  **⚠️ EXPECTED INCONSISTENCIES (Flag for Discussion)**
  *   **Node 1 vs. Node 3:** Students often say "No fact of the matter" (Leaf A) at Node 1, but then insist at Node 3 that there *is* a specific brain location for consciousness. *Discussion Point:* If there's no fact about *when*, can there be a fact about *where*?
  *   **Node 2 vs. Node 3:** Students choose "Physical Brain" at Node 2 but describe a "viewer" at Node 3. *Discussion Point:* If it's all physical neurons, who is watching the show? (Homunculus fallacy).
  *   **Naive Realism:** Students often answer "YES" to Node 1 (There is a fact!) simply because the experience *feels* definite, even if they agree with the science of Node A.

  **🚫 INDISTINGUISHABLE LEAVES (Empirical Traps)**
  *   **Orwell vs. Stalinesque (Node 4):** Dennett's core argument is that these are **empirically indistinguishable**. If memory is the only access to experience, a rewritten memory (Orwell) is identical to a pre-edited experience (Stalinesque). *Teaching Tip:* Push students who land here to explain how we could ever test the difference. If they can't, they've accidentally argued for Leaf A (Multiple Drafts).
  *   **Leaf C (GWT) vs. Leaf D (Second Theater):** These are often confused. Leaf D implies a *recipient* of the broadcast. Leaf C implies the broadcast *is* the consciousness. *Teaching Tip:* Ask: "If the broadcast happens but no system 'cares,' is it conscious?"

  **🌌 UNOCCUPIED LOGICAL SPACE**
  *   **"Temporal but not Spatial":** A view where there is a fact about *when* experience happens, but no *place*. (Rare/Unattractive: How does time pass without a process?)
  *   **"Spatial but not Temporal":** A view where experience happens in a *place* but has no *time*. (Incoherent: Experience is inherently dynamic).
  *   **"Non-Physical Stalinesque":** Editing the show before it reaches the soul. (Theologically possible, but rarely argued in this context).

  **💡 TA TIPS FOR THE "Dennett is Funny" PROBLEM**
  *   Don't let students vote for Leaf A just because Dennett is charismatic. Ask: "If Leaf A is true, are you conscious *right now*, or is that just a draft?"
  *   Use the Rabbit case to break Leaf D. Ask: "If the elbow tap hasn't happened yet, how did the brain edit the forearm tap *before* the show?" (Forces them to confront the timing paradox).
