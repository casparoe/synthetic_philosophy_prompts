answer: |-
  **Aris:** Look at Section 4, Paragraph 2 of the draft. "Conception en route is permissible provided predicted welfare exceeds neutrality." If we stick to total utility, that's actually too restrictive. We should be encouraging conception so long as the ship's resources can sustain a net increase in aggregate well-being.

  **Elias:** And that is precisely why the colony will fail before we land. You're treating potential children as buckets for utility units. Take Case One: the Chen family. They want to conceive. We know the child will inherit the neuro-muscular condition. It's painful. Chronic, manageable, but painful. The models say the life is still net positive. Under your rule, they proceed. Under mine, we stop them.

  **Aris:** Why stop them? The child, once born, will prefer existing to never having existed. They won't wish they were dead. So who is wronged, Elias? You're preventing a happy person from existing to save a person who doesn't exist from a pain they won't feel.

  **Elias:** You're relying on the non-identity problem as if it's a magic wand. Just because the child cannot coherently complain *after the fact* doesn't mean we didn't wrong them *in the act*. If I knowingly hand a child a loaded gun that fires once and hurts them, I've wronged them, even if the experience ultimately teaches them resilience and leaves them net happier. The wrong lies in imposing the burden without consent.

  **Aris:** Consent is impossible here. That's the trap. But let's press the logic. You say creating a life below neutrality wrongs the person. Creating a life above it is permissible. Now, imagine we tweak the neuro-muscular condition. We reduce the pain by one headache per year. Still below neutrality? Maybe. Reduce it by another. At some point, the life crosses the line from "wrong to create" to "permissible to create." Where is that line?

  **Elias:** It's a threshold of sufficient reason.

  **Aris:** That's a slogan, not a location. If I move from a miserable life to a magnificent life one headache at a time, there must be a specific headache whose removal switches the moral status from "forbidden" to "allowed." If you can't tell me where that switch is, you're relying on a moral illusion. And if the switch exists, why does the reason to create the life remain zero just above the line? Why isn't there *some* reason to create the happy child, even if it's not obligatory?

  **Elias:** Because reasons to benefit exist only relative to a subject. When the child does not exist, there is no subject to whom the benefit accrues. There is no "them" waiting in the void to be made happy. So there is no duty to bring them into being. But once they exist, or if bringing them into being imposes a burden, there *is* a subject who bears the burden. The asymmetry isn't a sorites paradox; it's a category distinction between harming a potential subject and failing to benefit a non-existent one.

  **Aris:** But that distinction collapses under pressure. If I choose between founding this colony with ten thousand settlers whose lives will be ecstatic, or one hundred thousand whose lives will be barely above neutrality—Case Two—your view says I have no reason to prefer the ten thousand over the hundred thousand, provided none fall below the line. But intuitively, wasting the resources on the barely-positive lives seems like a moral failure. We could have had a civilization of giants; instead, we get a swarm of people just happy enough not to sue us.

  **Elias:** I don't say you have *no* reason. You have reasons grounded in the resources available and the commitments to the current crew. But I deny that the hundred thousand bare-positive lives are *better* than the ten thousand ecstatic ones simply in virtue of being more numerous. You're chasing a sum that doesn't exist. There is no "total good" floating in the ether. There are only goods *for* people.

  **Aris:** So if we land on this planet and fill it with a billion flourishing people, versus leaving it a dead rock... on your view, is the populated planet *better*?

  **Elias:** It is better *for* the billion people.

  **Aris:** But if they hadn't existed, there would be no one for whom it was worse. So, from the perspective of the universe, the dead rock and the bustling colony are equivalent. The addition of a billion happy lives adds no value. Is that what I should write in the charter? That our mission adds no value unless we prevent suffering?

  **Elias:** Don't put words in my mouth. I said there is no duty to create them. I didn't say their existence is valueless. Once they exist, their flourishing is the only thing that matters. The error is in thinking we can compare the value of a world with people to a world without people using a single metric. "Better" requires a subject. A dead rock has no subject. A colony does. So the question "Is the colony better than the rock?" is category confusion. It's like asking if the color blue is heavier than the number seven.

  **Aris:** That's a convenient evasion, but it doesn't help us draft Case Three. The screening rule. To enforce your asymmetry, we need to prevent any conception predicted to fall below neutrality. But our predictive models aren't perfect. To catch every potential below-neutral life, we have to screen out some conceptions that would have been wildly happy. False positives. We sterilize some potential giants to ensure no potential sufferers are born.

  **Elias:** That is a tragic cost, but it's a cost borne by the parents, not the unborn. The parents lose the opportunity for a happy child. The unborn child... there is no child to lose anything.

  **Aris:** So you're willing to sacrifice actual happy lives—actual future people who would have thanked us—to avoid creating people who would have had lives worth living but contained some pain?

  **Elias:** I'm willing to prioritize the prohibition on harming over the opportunity to benefit. If the screening rule prevents even one child from being born into a life they would reasonably reject, it does its job. The fact that it also prevents some happy births is regrettable, but it doesn't constitute a wrong.

  **Aris:** Regrettable to whom? If the asymmetry holds, there's no one to regret the missing happy lives. So why should the committee care? Why not just ban all reproduction to be safe? If creating happy lives adds no value, and creating unhappy lives adds negative value, the optimal strategy is zero births.

  **Elias:** Because the current settlers exist. They have desires, projects, a need for continuity. Banning reproduction harms *them*. My view is person-affecting. It protects the potential child from a bad life, and it protects the existing parents from coercive bans, but it refuses to treat the potential child's happiness as a chip to be stacked against their pain.

  **Aris:** But you see the instability? You admit the parents have interests. You admit the future children have interests once conceived. But you refuse to aggregate those interests across possible persons. When I look at the hundred thousand barely-positive lives versus the ten thousand ecstatic ones, I see a choice about what kind of civilization we build. You see a choice about whether we violate specific negative rights.

  **Elias:** I see a choice about whether we treat human beings as means to a total sum. If we adopt your view, Aris, we are committed to the idea that we should keep breeding until the resources run out, as long as the next child adds a net positive gram of happiness. We become factories.

  **Aris:** And if we adopt yours, we admit that this voyage, this sacrifice, this entire charter... it doesn't make the universe better. It just populates it. You want me to sign a document that says our success is measured only by what we avoid, not what we achieve.

  **Elias:** I want you to sign a document that says our success is measured by how we treat those who exist. If the universe is better because we exist, let *us* be the proof. Don't ask us to justify our existence by filling the void with mediocrity.

  **Aris:** Then we're at an impasse on the wording. You won't accept "maximize welfare." I won't accept "neutrality is sufficient."

  **Elias:** Then let's write this: "Conception is permissible only if there is sufficient reason to believe the child will have a life worth living, and impermissible if there is sufficient reason to believe the child will suffer burdens they cannot reasonably be expected to bear."

  **Aris:** "Sufficient reason." You're smuggling the threshold back in without defining it.

  **Elias:** Because it can't be defined by math. It has to be defined by judgment.

  **Aris:** Fine. But I'm adding a clause. "The Committee shall aim to maximize the quality of life for all settlers, present and future." If you won't give me the total sum, give me the quality.

  **Elias:** As long as "quality" doesn't imply we must sacrifice the few for the many, or breed the many to dilute the few... I can live with that.

  **Aris:** And I can live with the ambiguity, provided we don't ban the happy children to catch the sad ones.

  **Elias:** Agreed. But Aris? If we land there, and it's full of life... don't ask me if it was worth it compared to the void.

  **Aris:** I won't. I'll ask the people living there.
