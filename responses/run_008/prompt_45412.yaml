  8.  **Final Polish:** Check voice distinction. Maya should sound like she sees a gestalt shift. Sam should sound like he wants to keep the ontology clean (no mysterious group minds). Ensure the "obligation" point is clear because that's a strong argument for the collectivist (Gilbert's argument).

      *(Self-Correction during drafting)*: Make sure Sam doesn't sound like he denies they are working together. He denies the *metaphysical* status of the "we." He agrees they are cooperating, just explains it differently.
      *(Self-Correction on Orchestra)*: Ensure the conductor role is addressed. Is the conductor the proxy for the "we" or just a focal point for individual coordination?

      *(Final check on "Change Mind")*:
