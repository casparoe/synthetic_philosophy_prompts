      *   5: Non-evidential tiebreakers are merely social/aesthetic (The weak link).
      *   6: Predictive success doesn't imply truth (Anti-realism).
      *   7: Physics teaches nothing about the world (Radical skepticism).

  3.  **Identify the Philosophical Core:**
      *   This is the *Underdetermination of Theory by Evidence* (UTE), specifically the Quine-Duhem thesis pushed toward Constructive Empiricism (van Fraassen) or Strong Social Constructivism.
      *   The nephew is arguing for *Underdetermination $\rightarrow$ Anti-Realism*.
      *   The user is a *Scientific Realist*.

  4.  **Evaluate the Premises for Attack:**
      *   *Premise 1:* Hard to deny.
      *   *Premise 2:* Logically true, but philosophically misleading. These are "gerrymandered" or "ad hoc" theories. They are *logically* possible but *scientifically* degenerate.
      *   *Premise 3:* True for *current* evidence.
      *   *Premise 4:* The pivot point. Are virtues like parsimony *really* non-evidential? Or are they truth-conducive heuristics?
      *   *Premise 5:* The Equivocation. Comparing physics' parsimony to astrology's "elegance" is a category error.
      *   *Premise 6 & 7:* The Conclusion. The "No Miracles Argument" (Putnam) directly counters this.

  5.  **Formulate the Strategy:**
