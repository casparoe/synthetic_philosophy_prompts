answer: |-
  Your book club friend has a remarkably sharp nose for the moral psychology of Rousseau's argument, but she has muddled the political scope and his proposed alternatives. She is roughly right about *why* he disliked theatre, but quite wrong about *where* he wanted it banned and *what* he wanted to replace it with.

  The text in question is the **_Lettre à d'Alembert sur les spectacles_** (Letter to d'Alembert on Spectacles), published in **1758**. The specific target was **Jean le Rond d'Alembert**, who had written an entry on 'Genève' for the _Encyclopédie_ suggesting that the Calvinist republic would benefit morally from establishing a theatre. Rousseau, a citizen of Geneva, took furious offence at this interference.

  Here is the claim-by-claim breakdown of her summary.

  ### 1. "Theatre lets you feel emotions you didn't earn... and go home having done nothing."
  **Verdict: Accurate.**
  This is the core of Rousseau's critique. He argues that theatrical pity is a sterile sentiment. In the theatre, we weep for fictional heroes, which gratifies our vanity—we feel sensitive and virtuous without having to lift a finger. He writes that in the theatre, "one is content to have wept" rather than having acted. It creates a sense of moral satisfaction that is unearned because it requires no sacrifice.

  ### 2. "The crying actually drains the compassion you'd otherwise spend on real people."
  **Verdict: Accurate (and yes, it is his argument).**
  This is not a later critic's imposition; it is precisely Rousseau's point. He posits a sort of closed economy of human sentiment. He argues that natural pity is a finite resource. By indulging it on stage, we exhaust our capacity for it in real life. He suggests that men who are most moved by tragedies are often the least helpful in reality, because they have already "paid their debt to humanity" with their tears. He explicitly states that the virtues practised in the theatre are a substitute for, not a preparation for, virtue in the street.

  ### 3. "All art and make-believe are corrupting in the same way."
  **Verdict: Overstatement.**
  She is generalising too broadly here. Rousseau distinguishes between *spectacles* (where a passive audience watches paid actors in a dark room) and *festivals* (where the community gathers in the light to participate). He is not against joy, beauty, or gathering; he is against the separation of actor and spectator. He objects to the *illusion* and the *passivity*, not necessarily all creative expression. He was quite fond of music and opera in certain contexts, provided they served the community rather than isolating individuals in bourgeois boxes.

  ### 4. "Comedy is dangerous because laughing at characters weakens your moral judgment."
  **Verdict: Accurate.**
  Rousseau devotes a significant portion of the _Letter_ to attacking Molière, specifically the play _The Misanthrope_. His argument is that comedy forces us to laugh at virtue to make it palatable. In _The Misanthrope_, the honest man (Alceste) is made to look ridiculous and antisocial, while the hypocrites are charming and witty. Rousseau argues this trains the audience to prefer social ease over moral integrity. We laugh at the virtuous man because he is awkward, and in doing so, we normalise vice.

  ### 5. "He wanted theatre banned across Europe, not just kept out of Geneva."
  **Verdict: Flatly Inaccurate.**
  This is the biggest error in her summary. Rousseau explicitly concedes that theatre might be suitable for monarchies (like France). His logic is that in a corrupt monarchy, people are already selfish and isolated; theatre at least gathers them in one place and might soften their manners slightly. It is a distraction for a corrupt people.
  However, for a **Republic** (like Geneva), which relies on civic virtue, frugality, and active participation, theatre is poisonous. He did not campaign to close the theatres in Paris; he campaigned to prevent them from opening in Geneva. He was protecting a specific political ecosystem, not launching a universal crusade.

  ### 6. "Citizens should have basically no amusements and should spend their leisure on quiet self-improvement."
  **Verdict: Misleading.**
  She makes Rousseau sound like a Puritan or a Stoic, which he was not. He did not advocate for "quiet self-improvement" in solitude. His alternative was **public festivals**.
  He proposed open-air gatherings where there are no spectators, only participants: dancing, singing, athletic competitions, and communal meals. He wanted leisure to be active and communal, reinforcing social bonds, rather than passive and commercial. He wanted people to look at each other, not at a stage. So, he was not against amusement; he was against *spectatorship*.

  ### 7. "On his own view, a good republican can never legitimately enjoy watching a play."
  **Verdict: Mostly Follows.**
  If one accepts Rousseau's premises, yes. For a citizen of a healthy republic, attending the theatre is an act of civic negligence. It encourages passivity and substitutes false sentiment for true virtue. However, Rousseau acknowledges that in a large, corrupt state, a good man might attend without harm simply because the damage is already done to the society at large. But for the *ideal* republican citizen he describes? Yes, theatre is incompatible with their civic duty.

  ### Summary of Reliability
  Your friend is **highly reliable on the moral psychology** (the bit about unearned emotions and drained compassion is spot-on and often misunderstood by people who haven't read the text). However, she is **unreliable on the political scope and the alternatives**. She has universalised a argument that was specifically about the fragility of small republics, and she has mistaken his call for communal festivals for a call for solitary austerity.

  **The Gist of the Backstory:**
  D'Alembert, in the _Encyclopédie_, praised Geneva but noted its lack of theatre was a cultural deficit that should be remedied. Rousseau viewed this as cultural imperialism from Paris. He believed the French model of theatre was tied to inequality, luxury, and the corruption of the aristocracy. By writing the _Letter_, he was drawing a battle line between the cosmopolitan values of the Enlightenment philosophers (who wanted Geneva to be more like Paris) and his own vision of a virtuous, insular republic. He won the argument in Geneva (no theatre was built for a long time), but it cost him his friendship with Diderot and the _Encyclopédistes_.

  In short: trust her on why he thought crying at a play was morally suspect; distrust her on the idea that he wanted to ban Molière in Paris or that he wanted Genevans to sit at home in silence.
