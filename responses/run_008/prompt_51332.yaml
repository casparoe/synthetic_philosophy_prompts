prompt: |-
  I'm on the academic integrity council at a mid-sized state university, and we've got a genuinely contested case coming up Thursday. Our engineering school wants to phase out proctored, in-class exams in favor of unproctored take-homes with a signed honor pledge, on the grounds that (a) remote proctoring software is invasive and glitchy, penalizing students with bad internet or ADHD tics, and (b) with AI tools everywhere, trying to police take-home work has become an arms race we're losing anyway, so we should pivot to trust and assessment design. The CS department is dug in hard against it: they say if you remove detection and enforcement, you're handing every student the ring of Gyges, and Glaucon's challenge basically writes itself — people only act justly when they can be seen and punished; make injustice invisible and consequence-free and the "just" students turn out to be the ones who were just never given a good enough offer. A philosophy colleague of mine on the council keeps pushing back with a wrinkle I half understand but want the memo to take seriously: she says the pledge isn't (only) a detection-free enforcement substitute but something like an identity cue — signing your name to being an honest person changes what the act means to you, which is supposed to do motivational work that neither surveillance nor deterrence captures. The CS folks also claim, more cynically, that the engineering school's real motive is that proctoring costs money and their students complain.

  Draft the memo I'll circulate before the meeting. It needs a concrete bottom line — approve the switch, reject it, or approve with conditions (and if conditions, what they actually are, not vague "safeguards") — plus reasoning the losing side could in principle respond to, not just a restatement of our values. Please engage the Glaucon challenge head-on rather than assuming it's obviously wrong: if the council's position amounts to "we trust our students," the memo has to say why that trust isn't just naivety given that most of us would, at minimum, keep the ring in a drawer. And give the identity/pledge idea an honest shake — either it can carry real weight, or it can't, and the memo should say which and why. Keep it to something the council will actually read, like 800 words.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Academic Integrity Council at a mid-sized state university.
      *   **Task:** Draft a memo for circulation before a meeting on Thursday regarding a contested case/policy proposal.
      *   **The Issue:** Engineering school wants to replace proctored in-class exams with unproctored take-homes + honor pledge.
      *   **Arguments For (Engineering):** Remote proctoring is invasive/glitchy (equity issues); AI makes policing take-homes an unwinnable arms race; pivot to trust/assessment design.
      *   **Arguments Against (CS):** Glaucon's Ring of Gyges (people are only just when watched/punished); removing enforcement invites cheating; cynicism about cost/complaints.
      *   **Philosophical Wrinkle:** The honor pledge isn't just enforcement but an *identity cue* (signing changes the meaning of the act).
      *   **Requirements:**
          *   Concrete bottom line (Approve, Reject, or Approve with Conditions).
          *   Reasoning the losing side could respond to (substantive, not just values).
          *   Engage Glaucon's challenge head-on (why isn't trust naive?).
          *   Evaluate the identity/pledge idea honestly.
          *   Length: Around 800 words.

  2.  **Determine the Bottom Line:**
      *   *Option A (Approve):* Too risky given the CS concerns. Might look like capitulation.
      *   *Option B (Reject):* Ignores the valid equity/AI concerns raised by Engineering. Stagnant.
      *   *Option C (Approve with Conditions):* This is the most council-like outcome. It acknowledges the shift but mitigates the "Ring of Gyges" risk.
      *   *Decision:* **Approve with Conditions.** specifically focusing on assessment design and randomized verification.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the recommendation immediately.
      *   **The Glaucon Challenge (Addressing CS):** Don't dismiss it. Acknowledge that deterrence works. Admit that without *any* consequence, cheating rises. The counter-argument isn't "students are angels," it's "deterrence isn't the only lever."
      *   **The Identity/Pledge Idea (Addressing Philosophy):** Evaluate this. Does signing a name work? Research suggests it works *if* done at the start and tied to self-concept, not just as a formality. It's not magic, but it's not nothing.
      *   **The Engineering Argument (AI/Equity):** Acknowledge the validity. Proctoring *is* flawed. AI *does* make traditional take-homes obsolete.
      *   **The Cynicism Check:** Address the cost/complaints motive. Even if true, does it invalidate the pedagogical merit? Separate motive from outcome.
      *   **The Conditions:** Need concrete safeguards.
          1.  *Assessment Redesign:* No generic problems AI can solve. Oral defenses/vivas for random samples.
          2.  *The Pledge Protocol:* Specific timing/placement (top of exam, not bottom).
          3.  *Audit Mechanism:* Randomized re-testing to keep the "Ring" visible sometimes.
      *   **Closing:** Call to action for Thursday.

  4.  **Drafting - Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the "Identity Cue" section too vague?
      *   *Fix:* Cite the mechanism. It primes self-concept. But admit it fails if the culture doesn't support it.
      *   *Critique:* Is the Glaucon response strong enough?
      *   *Fix:* Frame it as shifting from *external* surveillance to *internal* consistency + *randomized* external verification. We aren't removing consequences; we are changing the probability structure.
      *   *Word Count Check:* Keep it tight. Avoid fluff.

  5.  **Final Polish (Reviewing against constraints):**
      *   *Concrete bottom line?* Yes (Pilot with conditions).
      *   *Engage Glaucon?* Yes (acknowledge invisibility tempts, but propose random verification).
      *   *Evaluate Pledge?* Yes (it's a prime, not a spell).
      *   *Length?* Aiming for ~800 words.

  6.  **Writing the Memo (incorporating the above):**
      *   *Subject:* Proposal for Engineering Assessment Policy Shift.
      *   *Tone:* Professional, analytical, decisive.
      *   *Key argument:* The choice isn't Surveillance vs. Trust. It's Universal Surveillance vs. Targeted Verification + Design Integrity.

      *(Self-Correction on Word Count)*: I need to make sure I don't ramble on the philosophy. Keep it applied. The "Ring of Gyges" needs to be answered with the "Random Audit."

      *(Refining the Conditions)*: Make sure they aren't vague. "Oral defense of random 10%" is concrete. "Pledge at top" is concrete.

      *(Final Review)*: Does this sound like a council member speaking to peers? Yes.

  7.  **Final Output Generation** (Proceeding to generate text based on this plan).
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Council
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Engineering School Assessment Proposal

  **Recommendation**
  I recommend we **approve the Engineering School's proposal to transition to unproctored take-home assessments, contingent on three specific conditions.** A blanket rejection ignores the obsolescence of traditional proctoring in the AI era; an unconditional approval ignores the reality of human psychology. We must pilot this shift, but we must not remove the "sword" entirely.

  **The Glaucon Challenge**
  The Computer Science department's objection rests on Glaucon's *Ring of Gyges*: if injustice is invisible and consequence-free, even the "just" will cheat. This is not cynicism; it is empirical reality. Deterrence theory holds. If we remove surveillance *and* enforcement, cheating rates will rise. The Engineering argument assumes a pivot to "trust" replaces the need for detection. This is naive if "trust" implies a belief that students will not cheat.

  However, Glaucon's challenge assumes a binary: total surveillance or total invisibility. Our policy should occupy the middle ground. We can remove *universal* surveillance (proctoring) without removing *potential* visibility. If the risk of detection is zero, Glaucon wins. If the risk is non-zero but randomized, the psychological calculus changes. We are not handing students the Ring; we are telling them the Ring might malfunction at random.

  **The Identity Cue**
  Regarding the honor pledge: our philosophy colleague is correct that a pledge is not merely a legal contract but an identity prime. Behavioral ethics research suggests signing an honor code *before* an task (not after) activates a self-concept of honesty, reducing cheating even without enforcement.

  However, this mechanism is fragile. It functions only if the institution treats the pledge as sacred. If students perceive the pledge as a bureaucratic hurdle to bypass, it becomes ironic, reinforcing the very cynicism it aims to cure. The pledge cannot carry the load alone. It works as a psychological nudge, not a structural barrier. We must accept it as a useful tool, not a magic spell.

  **Motives vs. Outcomes**
  CS colleagues suspect Engineering's motive is cost-cutting and complaint reduction. Even if true, this does not invalidate the pedagogical argument. Remote proctoring *is* disproportionately punitive toward students with connectivity issues or neurodivergent tics. Furthermore, AI *does* render standard take-home problems unpoliceable. We cannot win an arms race against tools integrated into the workforce. We must assess competency, not isolation. We should judge this policy on its educational outcomes, not the administrative savings it might incidentally produce.

  **Conditions for Approval**
  To mitigate the Glaucon risk and validate the identity cue, approval requires the following binding conditions:

  1.  **Assessment Redesign:** Take-home exams cannot be digitized versions of old in-class tests. Questions must be AI-resistant (e.g., requiring application to unique, local datasets or oral justification of code logic). Engineering must submit sample assessments to this Council for review before implementation.
  2.  **Randomized Verification (The Audit):** To counter the "invisible ring," 10% of students per course will be randomly selected for a post-exam oral defense or a proctored re-sit of a subset of problems. This ensures the consequence of cheating remains non-zero. If the take-home and the audit diverge significantly, an integrity investigation is triggered.
  3.  **Pledge Protocol:** The honor statement must be placed at the *top* of the exam, requiring an active checkbox before viewing questions. Research indicates signing at the end renders the cue ineffective.

  **Conclusion**
  We are not choosing between surveillance and trust. We are choosing between universal suspicion and targeted verification. The current proctoring model assumes everyone is a cheater until proven innocent. The proposed model assumes everyone is a professional until proven otherwise, backed by random audits.

  If we reject this, we force Engineering to use tools we know are inequitable and increasingly obsolete. If we approve without conditions, we invite the Glaucon effect. The conditional approval outlined above acknowledges the limits of human virtue while respecting the need for pedagogical evolution.

  Please review these conditions prior to Thursday's vote. I am prepared to move this framework as a motion.
