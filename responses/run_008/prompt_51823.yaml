answer: |-
  Dear Friend,

  It is a pleasure to engage with such a carefully curated set of puzzles, for you have touched upon the very fractures that run through the foundation of formal epistemology. You are right to suspect that your tentative rule, which you identify as Jeffrey conditioning, is not the final word, though it is a powerful tool. The principle you are looking for, the one that strives to unify these verdicts while respecting the constraints of rational coherence, is Standard Bayesian Conditionalization applied not to the external propositions themselves, but to the propositions describing your total evidence experience. This shift in locus from the world to the experience is the key that unlocks the tensions you have identified, though it demands a few sacrifices of your initial intuitions.

  To state the principle precisely: you should always update your beliefs by conditionalizing on the finest-grained description of the sensory or cognitive experience you have just undergone, treating that experience as a certain event within a sufficiently rich algebra of hypotheses that includes possibilities about lighting, reliability, and memory. This principle forces itself upon us primarily because of your third case, the order case. You are absolutely correct that two people with the same total history of evidence should not disagree merely because of the order in which it arrived; rational updating should commute. Jeffrey conditioning, as you formulated it by directly shifting the probability of the proposition E, famously fails to commute. The only way to preserve commutativity is to treat the input of the update as a certain event, such as I had a green-ish visual experience, rather than an uncertain shift in the probability of the cloth is green. Standard conditionalization on these experience-events commutes, so to save your commutativity verdict, you must abandon the idea that the fundamental rule operates by directly redistributing probability over E based on a new confidence q. Instead, you calculate the likelihood of having that experience given the various states of the world, and condition on the experience having occurred.

  This richer principle also rescues your fourth case, the extra-content case. Your tentative rule fails here because it assumes rigidity, meaning it assumes your conditional probabilities for other hypotheses given E remain fixed. But as you noted, the glimpse tells you about the lighting too. By expanding your algebra to include hypotheses about the lighting conditions and conditionalizing on the complex experience of seeing the cloth in that light, you allow the probability of the lighting hypothesis to shift naturally, which then propagates to your beliefs about the rug. You do not need a new rule for this; you simply need a more detailed map of the possibilities upon which you are conditionalizing. Similarly, the fifth case, repetition, is resolved by this principle. If you glance twice, you have two distinct experience-events. If you merely rehearse the memory of one glance, you have only one experience-event. Standard conditionalization handles independent events by multiplying their likelihood ratios, whereas rehearsing the same evidence adds no new likelihood ratio, so your confidence stays put. This distinguishes the cases cleanly without needing ad hoc restrictions.

  Your second case, the diagnostic test, fits comfortably here as well. When the test comes back positive, you are conditionalizing on the experience of seeing the positive indicator. If you are certain you saw the indicator correctly, this collapses into ordinary Bayesian conditioning, which yields the result you found intuitive. Your sixth case, conditional evidence, is also handled by treating the colleague's fragmentary statement as evidence for a conditional proposition, which updates your probabilities via the standard ratio rule. However, there are verdicts you must sacrifice. The first is your tentative rule itself as a fundamental principle; it must be demoted to a useful shortcut that applies only when rigidity holds and the evidence carries no extra content about reliability. More painfully, you must sacrifice part of your seventh verdict regarding certainty. You hold that no rational person should assign probability exactly one to any empirical claim, yet you also feel entitled to full confidence after looking at the cloth in daylight. The principle I propose requires that you assign probability one to the proposition describing your immediate experience, for you cannot conditionalize on something you hold to be less than certain. To save the coherence of the system, you must concede that while external world propositions should rarely bear probability one, the propositions describing your own current sensory experiences may and must be treated as certain for the purpose of updating. You cannot have it both ways; if you refuse to assign probability one to the evidence, you lose the commutativity you rightly demand in the third case.

  Now, regarding the case you have not listed, involving the two witnesses. You ask whether you should end up more or less confident than a single witness of some intermediate reliability would make you, given two independent witnesses of sixty and seventy percent reliability reporting an event you antecedently thought one in a hundred. The principle I have outlined yields a clean answer through the multiplication of likelihood ratios. Your prior odds are one to ninety-nine. The first witness, being sixty percent reliable, provides a likelihood ratio of sixty to forty, or three-halves. The second, being seventy percent reliable, provides a ratio of seventy to thirty, or seven-thirds. Because the witnesses are independent, you multiply these ratios to get a combined likelihood ratio of twenty-one-sixths, or three-point-five. Your posterior odds become three-point-five to ninety-nine, which translates to a probability of roughly three-point-four percent. A single witness of intermediate reliability, say sixty-five percent, would provide a likelihood ratio of only about one-point-eight-six, resulting in a posterior probability of less than two percent. Therefore, you should end up more confident with the two independent witnesses than with a single witness of intermediate reliability, because independent evidence aggregates multiplicatively while a single source provides only additive weight relative to the log-odds. This result flows directly from the requirement to conditionalize on the independent experience-events of each report, confirming that the principle not only resolves your internal conflicts but also provides robust guidance for new inquiries. I hope this helps you trim your list of verdicts to fit a single, coherent shape.

  Yours sincerely,

  A Student of the Rule
