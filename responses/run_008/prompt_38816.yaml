  *   **If she says No:** She is running **Rule 2 (Conservationism)**. She requires a causal link to a living history (either biological birth or upload preservation). A "manufactured mind," even if functionally perfect, is a product, not a patient.

  This case isolates **Function** from **History**. Her answer will reveal whether her moral circle is drawn around *minds that work* or *lives that continue*.
