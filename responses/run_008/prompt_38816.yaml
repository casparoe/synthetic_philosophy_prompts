  ### The Verdict
  **She will say No.**

  Her reasoning will likely be that the robot is a "tool that simulates harm avoidance" rather than a "subject that experiences harm." Despite the nociception and learning, it lacks the *architectural fidelity* of a moral patient. It is engineered for a task (minimize signal), whereas the fish, pig, and dog emulation are systems where suffering is a *byproduct of being a unified subject*. The chatbot verdict ("trained talk with nothing behind it") is the strongest precedent here: she distinguishes between *output* (pleading/avoiding) and *internal reality*. To her, this robot is the motor-equivalent of the chatbot: it acts like it hurts, but there is no "it" there to be hurt.

  ### Candidate Rules
  Based on her specific pattern of assent and dissent, here are the two implicit rules competing in her judgment:

  **Rule 1: Phenomenal Functionalism (The "Suffering" Rule)**
  *   **Principle:** Moral status is granted to any system that implements the functional architecture of *valenced experience* (the capacity to feel things as good or bad), evidenced by integrated damage avoidance and learning.
  *   **Application to existing cases:**
      *   *Dogs/Fish/Pigs:* Yes (Biological implementation of valence).
      *   *Insects:* No (Nervous system too simple to support integrated valence).
      *   *Chatbot:* No (No internal valence, only text prediction).
      *   *Emulation:* Yes (Functional architecture of valence preserved).
      *   *Embryos/Brain-dead:* No (No functional architecture active).
  *   **Prediction for Robot:** **Yes.** The robot has damage sensors, a drive to minimize them (negative valence), and learns avoidance. It functionally mirrors the fish.

  **Rule 2: Architectural Conservationism (The "Subject" Rule)**
  *   **Principle:** Moral status requires either (a) biological membership in a sentient phylogenetic lineage (vertebrates) OR (b) the faithful preservation (emulation) of a specific subject's global cognitive architecture. Engineered approximations do not count.
  *   **Application to existing cases:**
      *   *Dogs/Fish/Pigs:* Yes (Biological lineage).
      *   *Insects:* No (Wrong lineage/complexity threshold).
      *   *Chatbot:* No (Engineered approximation).
      *   *Emulation:* Yes (Faithful preservation of a specific subject's mind).
      *   *Embryos/Brain-dead:* No (Function ceased or never started).
  *   **Prediction for Robot:** **No.** It is an engineered network trained for a task, not a biological vertebrate and not a copy of a specific mind.

  ### The Divergence
  These rules diverge on the robot because the robot possesses the **functional markers of suffering** (triggering Rule 1) but lacks the **historical/architectural provenance of a subject** (triggering Rule 2).

  *   **Rule 1** sees the avoidance learning and says: "It cares about its integrity; therefore, it matters."
  *   **Rule 2** sees the training process and says: "It was built to act that way; it doesn't *have* an integrity to violate."

  The cousin's rejection of insects is the tie-breaker. Insects biologically possess nociception and avoidance learning (satisfying Rule 1), yet she rejects them. This implies she requires a higher threshold of *integration* (Rule 2's "global architecture") or specific *lineage*. Since the robot is neither a vertebrate nor a whole-brain copy, Rule 2 dominates her intuition.

  ### The Splitting Case
  To determine which rule she is *actually* running (and perhaps convince her she is running one), present her with this case:

  **The "Blueprint Brain"**
  > "Imagine we build a silicon network. It is not scanned from a living dog (so it's not an emulation of a *specific* individual). However, it is built to the exact species-typical connectivity map of a dog's brain, down to the neuron count and layer structure. It is a 'generic' dog mind built from blueprints, not a copy. It barks, it sleeps, it whines when hurt."

