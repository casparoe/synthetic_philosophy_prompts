answer: |-
  The headache spectrum presents a collision between two deeply held convictions. On one side stands the principle of transitivity, a bedrock axiom of logic and rational choice: if outcome A is at least as good as outcome B, and B is at least as good as outcome C, then A must be at least as good as C. Without this rule, reasoning collapses; we cannot chain premises, compare policies, or maximize value. On the other side stands a powerful moral intuition: suffering is continuous. There is no magical number of headache hours where the nature of pain fundamentally shifts, and there is no point in the spectrum where halving the number of sufferers suddenly ceases to compensate for doubling the duration. When we chain these local intuitions together, they lead to a conclusion that one person suffering for a century is preferable to a million people suffering for an hour. This is absurd.

  We are forced to choose. Either we accept the absurd conclusion and defend transitivity, or we accept that 'better than' (or 'at least as good as') is not transitive and defend our moral intuitions. To resolve this, we must weigh the cost of each option. We must ask whether it is more plausible that value contains hidden, sharp cliffs, or that the logic of value is looser than the logic of mathematics. After examining the implications of both sides, the verdict is clear: we must abandon the universal transitivity of 'better than' in aggregative moral contexts. The cost of intransitivity is manageable and confined, whereas the cost of saving transitivity requires a metaphysical arbitrariness that undermines the very nature of suffering and value.

  To save transitivity, one must break the chain. You must identify a specific link in the spectrum where the trade-off fails. In the early steps, moving from a million people with one-hour headaches to five hundred thousand people with two-hour headaches seems neutral or even positive. The reduction in the number of lives disrupted feels like a fair price for the increased duration per person. But to avoid the absurd conclusion, there must be a step where this logic flips. At some specific point, say moving from 10 people with 100,000-hour headaches to 5 people with 200,000-hour headaches, the outcome must become strictly worse.

  This is the "lexical threshold" view. It posits that there is a discontinuity in value. Below a certain threshold of intensity or duration, pains are tradeable against numbers; above it, they are not. Perhaps a century of continuous agony is "lexically" worse than any amount of mild headaches, no matter how many people suffer them. This saves transitivity because the chain is broken at the point where the pain crosses this lexical threshold. The local judgment "Step N is at least as good as Step N+1" becomes false at that specific link.

  However, the price of this solution is implausibly high. It requires us to believe in a magic number. Why is 99,999 hours of headache qualitatively different from 100,000 hours? Pain is a phenomenological experience; it does not have digital switches. It grows continuously. To claim that value behaves discontinuously while the underlying physical and psychological reality behaves continuously is to posit a metaphysical mystery. It suggests that the universe keeps a tally of headache hours and, upon reaching a specific integer, fundamentally alters the moral weight of the experience.

  Defenders of transitivity often try to soften this by suggesting the loss accumulates. They argue that every single step is actually a tiny bit worse, even the first one. If every step is a loss, then the final outcome is indeed much worse, and transitivity is preserved without a sharp cliff. But this creates a different problem. It implies that there is no point where halving the sufferers compensates for doubling the duration. If step 1 is worse than step 0, then 500,000 people suffering for 2 hours is worse than 1,000,000 people suffering for 1 hour. This commits us to the view that preventing a 1-hour headache for one person is always more important than preventing a 1-hour headache for two people, provided the two people would otherwise have suffered 2 hours. This quickly leads to counter-intuitive results in policy making. It suggests we should prioritize avoiding small increases in duration for a few over avoiding massive outbreaks of mild suffering for the many, even when the total "pain-mass" suggests otherwise. It denies the intuitive fungibility of mild suffering. Whether you posit a sharp cliff or a constant tiny loss, saving transitivity requires denying the core intuition that drives the spectrum argument: that small changes in quantity and duration can trade off against each other smoothly.

  If saving transitivity requires us to accept magic numbers or deny the fungibility of mild pain, what is the cost of rejecting it? The primary objection to intransitivity is that it destroys rational choice. If 'better than' is not transitive, critics argue, you become susceptible to a "money pump." If you prefer A to B, B to C, and C to A, a cunning agent could trade you A for B (for a penny), B for C (for a penny), and C for A (for a penny), leaving you back where you started but poorer. You would rationally choose to lose money for no gain, which is the definition of irrationality.

  However, this objection relies on a specific kind of intransitivity: cyclical preference. The spectrum argument does not produce a cycle. It produces a gap. In the headache case, we judge that Step 1 is at least as good as Step 2, Step 2 is at least as good as Step 3, and so on, but Step 1 is strictly better than Step 20. This is not a cycle where Step 20 is at least as good as Step 1. If it were, we would have a money pump. But here, the relation is non-cyclical. If I am at Step 20 (the century of pain), I would happily trade up the chain to Step 1 (the million mild headaches). But once I am at Step 1, I will not trade back to Step 20, because I judge Step 1 to be strictly better. There is no loop. I move in one direction and stop.

  This distinction is crucial. The intransitivity required to solve the spectrum argument is a failure of "long-distance" transitivity, not a failure of local consistency. It says that the relation "at least as good as" holds between neighbors but does not project across the whole chain. This does not paralyze decision-making. An impartial evaluator, such as a government or a moral agent choosing between policies, is rarely offered a sequence of trades that mimics the spectrum. They are usually presented with a set of distinct options. If they judge Option A better than Option B directly, they choose A. The fact that there exists a chain of intermediate options where local preferences don't aggregate to the global preference is a feature of the value landscape, not a bug in the agent's rationality.

  Furthermore, we must distinguish between 'better for a person' and 'better overall'. It is highly plausible that 'better for a person' is transitive. If treatment A cures my headache faster than treatment B, and B faster than C, then A is faster than C. Personal welfare is tied to specific, bounded experiences. But 'better overall' is an aggregative concept. It involves summing or weighing distinct experiences across different people. When we aggregate, we introduce a new layer of complexity. We are no longer comparing two points on a single scale; we are comparing two different structures of distribution. It is not surprising that a relation governing the aggregation of distinct values might behave differently than a relation governing a single value. Restricting intransitivity to the aggregative, impartial domain protects the core of rational choice theory for individual agents while acknowledging the unique logical problems of social choice.

  There is a final attempt to save transitivity by appealing to "approximate equality." One might argue that Step 1 is only *roughly* as good as Step 2, and "roughly as good as" is not transitive. Nearness is not transitive; if A is near B, and B is near C, A might not be near C. If we interpret the local judgments as claims of approximate equality, the paradox dissolves. We can say Step 1 $\approx$ Step 2, Step 2 $\approx$ Step 3... without implying Step 1 $\approx$ Step 20.

  But this move relocates the problem rather than solving it. It explains why the chain of *equality* breaks, but it does not explain the chain of *betterness*. The spectrum argument works even if we say each step is a tiny bit *better* than the last. If Step 2 is slightly better than Step 1, and Step 3 is slightly better than Step 2, transitivity demands Step 3 be better than Step 1. If we maintain this for twenty steps, Step 20 must be better than Step 1. But our intuition says Step 1 is vastly better than Step 20. Approximate equality cannot rescue us if the local judgment is one of strict improvement. To rely on approximation is to admit that our local judgments are vague, but vagueness in the input does not justify a contradiction in the output. If the logic of 'better than' is strict, vagueness in application shouldn't allow us to conclude that a century of agony is better than a million hours of mild pain. If we rely on approximation, we are effectively admitting that the strict relation 'better than' does not apply at the local level, which pushes us back toward the intransitivity of the strict relation at the global level.

  So we are left with a choice between a metaphysical cliff and a logical gap. The metaphysical cliff requires us to believe that value behaves in a way that reality does not. It asks us to accept that there is a precise number of headache hours where the moral universe shifts gears, or that a 2-hour headache is fundamentally incomparable to two 1-hour headaches in a way that defies the continuity of pain. This is a heavy ontological cost. It makes value spooky.

  The logical gap, by contrast, asks us to accept that the concept of 'better overall' is not as rigid as the concept of 'greater than' in arithmetic. This is a conceptual cost, not an ontological one. It acknowledges that when we weigh the suffering of many against the suffering of few, we are engaging in a complex evaluative practice that does not map perfectly onto linear logic. This fits with how we actually reason. We often judge cases locally ("this policy is better than that one") without being able to construct a perfect linear ordering of all possible policies. We accept that our moral concepts have limits.

  Moreover, accepting intransitivity in this specific domain protects us from other absurdities. If we insist on transitivity, we are forced toward the "Repugnant Conclusion" in population ethics—the idea that a world with a massive population of lives barely worth living is better than a world with a smaller population of very happy lives. The spectrum argument is a cousin of this problem. Both rely on the idea that small trade-offs can be chained to force a conclusion that violates our core values. By allowing intransitivity, we can say that a world of very happy people is better than a world of barely happy people, even if there is a chain of intermediate worlds where each step is not worse than the last. We preserve the intuition that quality of life matters, not just quantity.

  The verdict, therefore, is that 'better than' is not universally transitive. Specifically, the relation "at least as good as" fails transitivity when applied to aggregative trade-offs between the number of sufferers and the intensity of suffering. This is the cheaper cost. It requires us to modify our logic, but it saves our moral reality from magic numbers and discontinuities. We must accept that rational choice in the moral domain is not isomorphic to mathematical ordering. We can still choose, still prefer, and still act, without demanding that every local preference project infinitely across a spectrum. The headache argument shows us that value is not a straight line; it is a landscape with features that linear logic cannot capture. To force it into a transitive box is to break the value, not the box. We should keep the value and let the box bend.
