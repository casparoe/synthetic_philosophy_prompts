      *   *Objection 4 (The Aggregation Defense):* You can just add up the disappointment of the last generation.
          *   *Reply:* No, the *current* generation loses motivation.
          *   *Weakness:* Utilitarians will say "just count the disappointment as negative utility."

  5.  **Refining the Tone:**
