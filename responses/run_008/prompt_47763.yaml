prompt: |-
  I'm a junior and I run the discussion at my school's philosophy club — about 15 kids, most of them have read a bunch of Peter Singer and basically think if you count up wellbeing you've settled the whole thing, plus our advisor who is a massive Parfit fan. Next week it's my turn to present, and I want to do the idea from the philosopher Samuel Scheffler's book Death and the Afterlife: that human extinction would be bad in a way that goes beyond the deaths it involves, because a ton of what makes our activities seem worth doing now depends on humanity continuing after we're gone. His example is basically: if we found out humanity ends about a month after everyone currently alive dies (so nobody's kids or grandkids exist), a lot of what we care about — curing diseases, writing novels, slowing climate change — would start to feel kind of pointless to us even before anyone dies. So the badness of extinction isn't just the badness of individual deaths. Can you prep me for the objections this crowd will actually raise? In particular I'm dreading the "who is harmed?" one — my Singer friends will say that if extinction is painless and everyone goes at the same instant, no one suffers, so there's nobody it's bad *for*, and badness has to be bad for someone. Also the advisor will 100% bring up non-identity somehow. Please list the objections roughly in the order they'll come at me, phrased the way these people would phrase them, with a short reply for each and a note on where the reply is weak. And tell me the one question I'm secretly hoping nobody asks.
