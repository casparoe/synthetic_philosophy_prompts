      *   *Objection 3: The "Pointlessness" is just a feeling.* Maybe the activities *are* pointless if there's no future. Why is that bad? If no one is around to care, does it matter?
      *   *Objection 4: Aggregation.* Scheffler is challenging aggregation. The utilitarians will defend aggregation. "You're just saying the whole is greater than the sum of parts without proof."
      *   *Objection 5: The Advisor's Parfit Move.* "Is this just an impersonal principle? And if so, why does it override individual welfare?"

