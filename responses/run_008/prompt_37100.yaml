      *   **Addressing the Historiography (Subtly):** Mention her famous autumn lecture. Don't say "She proved the old guys wrong." Say "She taught us to stop judging the dead by the standards of the living."
      *   **The "Performance" Moment:** This needs to be the crux. I need to praise her in a way that acknowledges her work might one day look "old" too, but that doesn't diminish its value. Or, acknowledge that the "truth" of the past isn't a destination we reach. Let's try framing her contribution not as *finding the answer*, but as *preserving the question*.
      *   **Personal Touch:** The "Priestley" anecdote from the prompt is gold. Use that. It shows internalization.
      *   **Closing:** Retirement isn't an end (Whig), it's a change of state. Wish her well without implying she's "done" her duty to progress.

  4.  **Refining the Anti-Whig Stance:**
      *   *Avoid:* "Before her, we were blind. Now we see."
      *   *Try:* "She gave us eyes to see what was always there."
      *   *Avoid:* "Her methods are the final word."
      *   *Try:* "Her methods are a tool we now hold, regardless of where the field goes next."
      *   *Key Insight:* The prompt asks to avoid the narrative where the *present state of the field's self-understanding* is the climax. So, I shouldn't say "Now the discipline is mature." I should say "Now we are better listeners."

  5.  **Drafting the Speech (Iterative Process):**
      *   *Tone:* Warm, respectful, slightly intellectual but accessible.
      *   *Word Count Check:* 1000 words is roughly 7 minutes at 140 wpm.
      *   *The "Performance":* I will explicitly refuse to say her work "superseded" the past. I will frame her legacy as adding a layer of complexity, not replacing an error.
      *   *Specific Phrasing:* Instead of "She corrected the record," use "She restored the voices." Instead of "We now know," use "We now ask."

