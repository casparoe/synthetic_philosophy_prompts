      *   *Crux:* Substrate Sensitivity.
          *   *Prediction:* Neuroscience findings on whether specific molecular states (not just firing rates) encode memory/identity.
          *   A predicts: Macro-scale functional connectivity is sufficient for memory retrieval.
          *   B predicts: Micro-scale substrate states (e.g., protein conformations) are necessary for *identity* retention, even if function is mimicked.

  6.  **Addressing the Funding Decision:**
      *   This is crucial. The donor cares about *survival*.
      *   If A is right: Gradual Prosthetics = Survival. Scanning = Death. -> Fund Prosthetics.
      *   If B is right: Gradual Prosthetics = Copy (Death of original). Scanning = Copy (Death of original). -> Neither offers survival.
      *   *Wait, nuance:* B might accept scanning if it creates a copy they care about, but the prompt says the choice rides on "whether gradualness actually buys survival."
