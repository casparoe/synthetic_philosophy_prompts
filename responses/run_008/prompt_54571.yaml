      *   *Adjudication:* This is metaphysical, hard to test. We need a proxy. The proxy is the *Branching Case*. If branching creates two people, gradualness doesn't save the original in the branching scenario. If branching creates one person with two bodies, gradualness might work.
      *   *Better Crux for Funding:* The "Interrupted Process." If we replace 50%, pause for a year, then finish.
          *   A: Still you.
          *   B: Still a copy (or undefined).
          *   *Actually, the most practical crux:* **The "Fission" Intuition.** If the biological brain is *not* destroyed during gradual replacement (scanned non-destructively while prosthetics take over), do we have two people?
          *   If Yes (Two people): Then the prosthetic is a copy. Gradualness didn't save the original from having a rival. (Favors B's skepticism).
          *   If No (One person): Then the biological part was redundant. (Favors A).
          *   *Decision Rule:* If the consensus on Fission is that it creates two claimants, the donor should fund Destructive Scanning (cheaper, same outcome: a copy) OR neither. If the consensus is Fission is impossible/identity merges, fund Prosthetics.
          *   *Wait, let's look at the prompt:* "the choice rides on whether gradualness actually buys survival."
          *   Okay, I need to make sure the document highlights that if B is right, gradualness is a luxury for the *copy*, not survival for the *donor*.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Formal, precise, collaborative but acknowledging deep divergence.
      *   *Verbal Dispute:* Explicitly call out "Survival" vs. "Continuity."
      *   *Table:* Needs columns for Issue, Camp A Position, Camp B Position, Shared Adjudicator/Prediction.

  8.  **Review against Constraints:**
      *   (1) Agreed claims? Yes.
      *   (2) Disagreements precise? Yes, ensuring B doesn't sound like they concede survival.
      *   (3) Cruxes? Yes (Fission, Substrate Specificity).
      *   (4) Predictions? Yes (Neuroscience/Legal outcomes).
