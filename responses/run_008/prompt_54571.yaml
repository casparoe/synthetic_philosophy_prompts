          4.  Adjudication methods for cruxes (thought experiments, predictions, empirical results).
          5.  Flag verbal disputes (e.g., definition of "survive").
          6.  Practical Note: Donor funding choice (destructive scanning vs. gradual prosthetics) depends on whether gradualness buys survival.
      *   **Format:** Numbered agreed-claims section, then a table for disagreements/cruxes.

  2.  **Deconstruct the Positions:**
      *   **Camp A (Gradualist):** Identity is preserved through functional isomorphism. Substrate doesn't matter if function is identical. Gradual replacement maintains continuity. "Survival" is the right word. Denying this is "sneaky dualism."
      *   **Camp B (Copyist):** Identity requires specific physical/causal continuity (or is an illusion). Gradual replacement is just a series of copies. The original ceases to exist. The copy has moral standing but is not the *survivor*. Teleporter analogy holds regardless of granularity.
      *   **Common Ground:** Both likely agree on functionalism to some degree (otherwise why talk about hardware?), both agree the copy is morally significant, both agree the procedure is technically feasible (in principle), both want longevity/uploading to work *somehow*.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find the overlap.
      *   *Functional Equivalence:* Both agree that if the hardware behaves exactly like the neuron, the *system* behaves the same.
      *   *Moral Status:* Both agree the resulting entity deserves rights/care.
      *   *Step-wise Nature:* Both agree the process is a sequence of physical changes.
      *   *No Magic:* Both agree there's no soul or supernatural element (physicalism).
      *   *Uncertainty:* Both agree current science doesn't definitively solve the metaphysics of identity.

  4.  **Drafting Section 2: Disagreements & Cruxes (The Table):**
      *   *Disagreement 1: The Nature of Identity.* A says Psychological/Functional Continuity. B says Physical/Causal Continuity (or that identity doesn't survive *any* replacement).
      *   *Disagreement 2: The Sorites/Heap Problem.* A says small changes don't break identity. B says accumulation of small changes eventually breaks it, or that *any* replacement breaks it regardless of speed.
      *   *Crux 1: The Branching Case (Fission).* If the old brain is kept alive while the new one is built.
          *   A's view: Usually problematic for psychological continuity. If both exist, who is the "original"?
          *   B's view: Proves the new one is a copy because two can't be one.
          *   *Testable Prediction:* Intuition pumps or neuroscientific findings on split-brain/continuity.
      *   *Crux 2: The "Gap" Argument.* If we pause the replacement.
          *   A: Identity persists through sleep/anesthesia, so pausing is fine.
          *   B: If the causal chain is broken or if the substrate is swapped during the pause, identity is lost.
      *   *Crux 3 (The Funding Crux):* Does gradualness mitigate the risk of death?
          *   A: Yes, it ensures survival. Fund gradual prosthetics.
          *   B: No, it ensures a *happy copy*, but the donor dies. Fund destructive scanning only if we accept death (or don't fund either if survival is the goal). *Correction:* The prompt says the donor will fund *either* scanning *or* prosthetics. If B thinks scanning kills you, and prosthetics kills you, B might prefer prosthetics for the *copy's* sake, but A thinks prosthetics saves *you*. The crux is whether gradualness changes the *survival* outcome enough to justify the likely higher cost/complexity of prosthetics over scanning.
      *   *Verbal Dispute:* The word "Survive." A uses it to mean "Psychological continuity exists." B uses it to mean "Numerical identity persists."

  5.  **Refining the Cruxes for "Scoring":**
      *   To make this an *adversarial collaboration*, we need predictions.
