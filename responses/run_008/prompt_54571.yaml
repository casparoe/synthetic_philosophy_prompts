  # JOINT STATEMENT ON SUBSTRATE REPLACEMENT AND PERSONAL IDENTITY
  **Parties:** Camp A (Functionalist Continuity) & Camp B (Physicalist Discontinuity)
  **Date:** October 26, 2023
  **Context:** Adversarial Collaboration regarding Neuron Replacement Protocols

  ## I. AGREED CLAIMS
  *The following propositions are accepted by both Camp A and Camp B as true or operationally valid for the purposes of this collaboration.*

  1.  **Functional Isomorphism:** We agree that if a hardware component replicates the input-output function of a biological neuron to within measurable tolerance, the macroscopic behavior of the system (the person) will remain unchanged during the replacement process.
  2.  **No Supernaturalism:** Both camps reject dualism in the Cartesian sense. There is no "soul" detached from physical processes. The disagreement concerns *which* physical processes constitute the persistence of the self (functional organization vs. specific material history).
  3.  **Moral Status of the Result:** We agree that the entity existing at the end of the replacement procedure possesses full moral standing, legal rights, and subjective experience. It is not a "philosophical zombie." It suffers, loves, and claims to be the original.
  4.  **Operational Indistinguishability:** From the perspective of third-party observers, friends, and family, the post-procedure entity is indistinguishable from the pre-procedure human.
  5.  **Epistemic Humility:** We acknowledge that current neuroscience and metaphysics do not provide a definitive, falsifiable test for "numerical identity" (whether Person-at-T2 is strictly the *same object* as Person-at-T1).
  6.  **The Copy is Valuable:** Even if Camp B is correct that the original ceases to exist, the resulting entity is a valid continuation of the donor's values, projects, and relationships, and warrants support on those grounds alone.

  ## II. DISAGREEMENTS, CRUXES, AND ADJUDICATION
  *The following table outlines the precise metaphysical disagreements, the specific "cruxes" that would shift confidence between views, and pre-committed predictions used to score the validity of each position over time.*

  | Issue | Camp A (Gradualist) Position | Camp B (Copyist) Position | The Crux (What would change minds?) | Shared Adjudicator / Prediction |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Nature of Identity** | **Psychological Continuity:** Identity is preserved so long as there is an unbroken chain of memory, character, and causal connection, regardless of substrate changes. | **Physical/Causal Continuity:** Identity requires the persistence of the specific physical organism or a non-branching causal chain. Functional mimicry is not identity. | **The Branching (Fission) Case:** If the biological brain is kept alive *in parallel* with the prosthetic replacement until the end, do we have one person or two? | **Prediction:** In a future legal/medical case of cognitive fission (e.g., hemispheric separation with full function), **A predicts** the law will recognize *two* equal originals (identity branches). **B predicts** the law will recognize *one* original and one new entity (identity does not branch). |
  | **2. The Sorites Threshold** | **No Threshold:** There is no specific percentage of replacement where "you" become "not you." Identity is a gradient or binary based on continuity, not material composition. | **Binary Event:** Either the specific causal history is maintained or it is broken. A million tiny breaks sum to a break. The "smoothness" is an illusion of memory. | **Substrate Specificity:** Does the *material* of the neuron hold information that function does not capture? | **Prediction:** Neuroscience will discover memory engrams that rely on **A:** Macro-scale connectivity patterns (supporting A). **B:** Micro-scale quantum or protein-conformation states unique to biological matter that cannot be functionally simulated without being physically identical (supporting B). |
  | **3. The "Pause" Test** | **Resilience:** If the replacement process is paused for a year (or the subject is frozen), identity persists because psychological continuity is robust to gaps (like sleep). | **Fragility:** If the process is paused, the causal link is weakened or severed. The "resumption" is effectively a new start, creating a copy of the paused state. | **Causal Density:** Does the *density* of causal interaction matter for identity? | **Prediction:** Analysis of coma/anesthesia recovery. **A predicts** no correlation between duration of unconsciousness and "identity loss" reports. **B predicts** that beyond a certain threshold of causal disconnection, subjects will report (or exhibit) discontinuities in self-modeling akin to "waking up as someone else." |
  | **4. Funding Implication** | **Survival Bought:** Gradualness *does* buy survival. The donor survives the procedure. | **Legacy Only:** Gradualness buys a *better copy*, but the donor still dies. | **Does Rate Matter?** Is there a metaphysical difference between replacing 1 neuron/second vs. scanning the whole brain at once? | **Decision Rule:** If Crux #1 (Fission) resolves in favor of B (identity cannot branch), then gradualness provides no survival advantage over scanning. If it resolves for A, gradualness is the only survival path. |

  ## III. VERBAL DISPUTE FLAG
  **Term:** "Survival" / "Death"

  **Analysis:** A significant portion of the conflict is verbal.
  *   **Camp A** uses "Survival" to mean **Psychological Continuity**. (Definition: *Is there a future person who remembers being me and acts like me?*)
  *   **Camp B** uses "Survival" to mean **Numerical Identity**. (Definition: *Is the future person the exact same physical entity/history as me?*)

  **Resolution:** We agree to distinguish these terms in future communications.
  *   When Camp A says "You survive," they mean "Your psychological continuity is preserved."
  *   When Camp B says "You die," they mean "Your numerical identity is terminated."
  *   **Remaining Disagreement:** Even after clarifying terms, a substantive disagreement remains: **Does Numerical Identity matter morally?** Camp A argues it does not (Psychological Continuity is sufficient for what we care about). Camp B argues it does (Numerical Identity is required for *selfish* concern about one's own future).

  ## IV. PRACTICAL NOTE FOR DONORS
  **Decision Context:** Funding choice between **Destructive Whole-Brain Scanning** vs. **Gradual Prosthetic Replacement**.

  **The Stakes:**
  *   **If Camp A is correct:** Gradual Prosthetics allows the *donor* to survive. Destructive Scanning kills the donor and creates a copy. **Recommendation:** Fund Gradual Prosthetics.
  *   **If Camp B is correct:** Both procedures kill the donor. Both create a copy. Gradual Prosthetics is likely more expensive and technically difficult than Scanning. **Recommendation:** Fund Destructive Scanning (to create the copy at lower cost) OR fund neither if the primary goal is strictly *donor survival*.

  **Critical Dependency:** The funding decision rests entirely on **Crux #1 (The Branching Case)**.
  *   If the "Branching Case" intuition holds that two identical people cannot both be the "original" (Camp B's view), then gradualness offers no metaphysical safety over scanning.
  *   If the "Branching Case" intuition allows for identity to divide or merge (Camp A's view), then gradualness is the only path to survival.

  **Signed:**

  _________________________ (Camp A Representative)

  _________________________ (Camp B Representative)

  _________________________ (Moderator)
