prompt: |-
  So I write literary fiction, mostly mid-sized novels, one every three or four years because I'm slow, and the slowness is almost all revision. I will rewrite a single chapter fifteen times and honestly can't tell you the fifteenth draft is better than the seventh. I've come to realize I'm a maximizer about this — I keep going because there might always be a better version of the paragraph out there, and I treat "I can't think of anything more to fix" as failure rather than as finishing.

  I've been reading a bit about satisficing and bounded rationality, Herbert Simon's stuff — the idea that with limited time and limited minds, the rational move is to set a threshold for "good enough" and stop when you clear it, rather than search for the best possible option. And it strikes me this might be exactly the cure for my problem, but I don't actually know how to operationalize it for fiction. "Good enough" is doing a ton of work there. Good enough by what standard? Compared to what? My own taste changes week to week, which is how I end up "fixing" a chapter back to something close to what it was two drafts ago.

  What I want is a procedure I can actually run at the end of each drafting day, in maybe twenty minutes, that tells me when a chapter is done and I move on to the next one. It should be grounded in what satisficing and bounded rationality actually say — aspiration levels, the cost of continued search, that kind of thing — but translated into novelist terms, not psychology-paper terms. I want it to tell me: what questions to ask myself in what order, what counts as a "yes this chapter is done" answer to each, when the procedure should flat-out tell me to move on even if I don't feel done, and where it has to hand the decision back to me because "is this chapter good" is a judgment call no checklist can settle.

  Then please run it on three cases from my actual life: (1) a middle chapter that does its plot job but that I find boring, (2) my opening chapter, which my agent says is the weakest thing in an otherwise finished manuscript, and (3) a scene I've already rewritten eight times where I keep flip-flopping between two versions and can't tell them apart anymore.

  One thing I want to be honest about: run the procedure faithfully on case 3 even if the answer is one I won't like — I suspect the right answer is that the two versions are equivalent and my continued searching is pure cost, and if that's what the procedure says, say so. And tell me where the procedure will misfire or fail me — I assume there are cases where satisficing a chapter is exactly wrong (maybe beginnings, maybe endings?), and I'd rather know the failure modes up front than trust the checklist blindly. Also worth noting my real constraint: I'm 52, I publish maybe three more books in my life if I'm lucky, so every extra year spent polishing chapter four has an actual price. I don't think the pure satisficing framing quite captures that, but maybe I'm wrong — you tell me.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and the Problem:**
      *   **User Profile:** Literary fiction writer, mid-sized novels, slow pace (1 book/3-4 years), 52 years old (finite career horizon).
      *   **Core Issue:** Maximizer tendency in revision. Rewrites chapters ~15 times. Cannot distinguish quality between draft 7 and 15. Treats "nothing left to fix" as failure rather than completion.
      *   **Proposed Solution:** Satisficing/Bounded Rationality (Herbert Simon). Set an aspiration level, stop when met.
      *   **Specific Need:** A concrete, 20-minute end-of-day procedure to determine when a chapter is *done*.
      *   **Requirements:**
          *   Grounded in Simon's concepts (aspiration levels, search costs).
          *   Translated to novelist terms.
          *   Specific questions in order.
          *   Clear "Stop" criteria.
          *   Acknowledgment of judgment calls.
          *   Application to three specific cases (Boring middle, Weak opening, 8x rewritten scene).
          *   Honesty on Case 3 (even if the answer is "stop now").
          *   Identification of failure modes (where satisficing is dangerous).
          *   Consideration of the "finite career" constraint (opportunity cost).

  2.  **Deconstruct Satisficing for Fiction:**
      *   *Simon's Core:* Organisms don't optimize; they satisfy + suffice. They set an aspiration level. If the option meets it, stop searching. If not, adjust aspiration or keep searching *until cost exceeds benefit*.
      *   *The Twist:* In art, "good enough" feels like settling. But for a maximizer who can't tell the difference between draft 7 and 15, the difference is likely negligible to the reader, while the cost to the writer is massive (time, energy, finished books).
      *   *The "Aspiration Level":* Needs to be functional, not aesthetic perfection. It needs to be about *function* within the whole, not local perfection.
      *   *The "Search Cost":* At 52, with ~3 books left, the cost of time is incredibly high. One year stuck on Book A is Book B or C lost.

  3.  **Drafting the Procedure (The "Stop-Search Protocol"):**
      *   *Goal:* 20 minutes max.
      *   *Structure:* Needs to move from objective function to subjective feel to cost analysis.
      *   *Step 1: Functional Integrity (The "Does it work?" check).* Does the chapter advance plot/character? If no, it's not satisficed. If yes, proceed.
      *   *Step 2: The Friction Test (The "Is it broken?" check).* Are there actual errors, plot holes, or confusing prose? Fix those. If none, proceed.
      *   *Step 3: The Diminishing Returns Audit (The "Simon" check).* What am I changing now? Is it substantive or cosmetic? If cosmetic, stop.
      *   *Step 4: The Opportunity Cost Reminder.* Remind the writer of the 3-book constraint.
      *   *Decision Point:* If Steps 1 & 2 are Yes, and Step 3 indicates diminishing returns, the protocol dictates STOP.

  4.  **Refining the Procedure (Making it "Novelist" friendly):**
      *   Avoid dry academic language. Use terms like "Load-bearing," "Friction," "Tweaking."
      *   Make the "Stop" command explicit.
      *   Incorporate the "finite career" aspect into the cost calculation.

  5.  **Applying to Case Studies:**
      *   *Case 1 (Boring Middle):* Functionally sound but boring. Satisficing says: If it moves the plot, it's done. Boredom might be a feature (pacing) or a reader problem, not a drafting problem. *Verdict: Move on.*
      *   *Case 2 (Weak Opening):* Agent flagged it. This raises the aspiration level. Satisficing isn't about lowering standards, it's about meeting the *required* standard. If the agent says it fails the market standard, the aspiration level isn't met. *Verdict: Revise, but with a cap.*
      *   *Case 3 (8x Rewrite/Flip-flop):* This is the crux. The user suspects the answer is "they are equivalent." The protocol must confirm this. If you can't tell the difference, the reader won't either. The cost of search now exceeds the value of improvement. *Verdict: Pick one, lock it, move on.*

  6.  **Identifying Failure Modes:**
      *   Where does satisficing fail in art?
      *   *The "Soul" of the book:* Sometimes a chapter *is* the book. If you satisfice the thematic core, the book dies.
      *   *The "First/Last" impression:* Openings and closings carry disproportionate weight. Satisficing there is riskier.
      *   *The "False Negative":* Thinking it's done when it's actually broken (requires external feedback).
      *   *The "Career Constraint":* Actually, satisficing *helps* the career constraint, but needs to be balanced against reputation.

  7.  **Addressing the "Finite Career" Constraint:**
      *   The user mentioned being 52 with ~3 books left.
      *   Pure satisficing usually ignores long-term optimization. But here, *producing the next book* is the optimization goal.
      *   I need to reframe "Satisficing" not as "lowering quality" but as "allocating resources to the portfolio, not the single asset."

  8.  **Review and Refine:**
      *   *Tone:* Respectful, direct, professional, empathetic to the artistic struggle but firm on the logic.
      *   *Check:* Did I answer the specific prompt requirements? (20 min procedure, Simon grounded, 3 cases, failure modes, career constraint).
      *   *Self-Correction on Case 2:* The agent said it's the weakest part. Satisficing doesn't mean ignoring feedback. It means setting the aspiration level to "Agent approved" rather than "Perfect." I need to make sure the procedure accounts for *external* aspiration levels.
      *   *Self-Correction on Case 3:* Be brutal. The user asked for honesty.

  9.  **Final Polish:** Organize with clear headings. Ensure the "Procedure" looks like a checklist. Ensure the "Theory" is explained simply. (Proceed to generate output).

  *(Self-Correction during drafting)*: Wait, I need to make sure I don't just give a checklist. I need to explain *why* this fits Simon's theory.
  *   *Aspiration Level:* Defined by function + external feedback.
  *   *Search Cost:* Time/Energy vs. Marginal Gain.
  *   *Bounded Rationality:* Acknowledging the writer cannot perceive the difference between draft 7 and 15.

  Let's build the "Chapter Closure Protocol."

  *   *Phase 1: Functional Check (Does it hold weight?)*
  *   *Phase 2: Defect Scan (Is it broken?)*
  *   *Phase 3: Marginal Gain Assessment (Is the tweak worth the hour?)*
  *   *Phase 4: The Portfolio Check (Does this delay Book N+1?)*

  Okay, ready to write.cw
answer: |-
  This is a profound structural problem, not just a habit problem. You are treating a creative process like an optimization problem where the global maximum exists and is findable. Herbert Simon's bounded rationality argues that in complex systems (like a novel), the global maximum is unknowable, and the cost of searching for it eventually exceeds the value of finding it.

  At 52, with a finite number of books left in you, your constraint is not *quality per page*; it is *quality per lifetime*. A perfect chapter in a book you never finish is worth zero. A "satisficed" chapter in a finished trilogy is worth everything.

  Here is the operational procedure you asked for, grounded in Simon's framework but translated for the work of fiction.

  ### The Chapter Closure Protocol (CCP)
  **Time limit:** 20 minutes.
  **Frequency:** End of every drafting/revision session.
  **Goal:** To determine if the *search* for improvements should terminate.

  **Step 1: The Load-Bearing Test (Aspiration Level: Function)**
  *Ask:* "If I removed this chapter, would the plot collapse or would a character's motivation become inexplicable?"
  *   **Yes:** The chapter is load-bearing. Proceed to Step 2.
  *   **No:** The chapter is decorative. Delete it or merge it. Do not revise it.
  *   *Simon Logic:* This sets the baseline aspiration. The chapter must justify its existence structurally. If it does, it has met the primary criterion for "good."

  **Step 2: The Defect Scan (Aspiration Level: Integrity)**
  *Ask:* "Are there objective errors? (Plot holes, continuity errors, confusing pronouns, factual mistakes, clumsy phrasing that impedes comprehension)."
  *   **Yes:** Fix *only* the defects. Then return to Step 2.
  *   **No:** Proceed to Step 3.
  *   *Simon Logic:* This distinguishes between "broken" and "imperfect." Satisficing requires a functional tool, not a flawless one. Fix bugs, don't polish features yet.

  **Step 3: The Marginal Gain Audit (Search Cost Analysis)**
  *Ask:* "What was the specific change I made in the last hour? Did it change the *meaning* or the *effect*, or just the *texture*?"
  *   **Meaning/Effect:** (e.g., "Now the betrayal lands harder.") Continue searching if time permits.
  *   **Texture:** (e.g., "This sentence flows better," or "This metaphor is sharper.") **STOP.**
  *   *Simon Logic:* This identifies diminishing returns. If you are tweaking texture without shifting effect, you are in the zone of indistinguishability (Draft 7 vs. Draft 15). The cost of the hour exceeds the value of the tweak.

  **Step 4: The Portfolio Check (Opportunity Cost)**
  *Ask:* "If I spend another 10 hours on this chapter, does it increase the likelihood of the *next* book being written?"
  *   **Yes:** (Rare. Usually only if this chapter is blocking your understanding of the rest of the book.) Continue.
  *   **No:** (Most common. This time is subtracted from Book N+1.) **STOP.**
  *   *Simon Logic:* This applies your specific life constraint. Rationality dictates maximizing the lifetime output, not the single chapter.

  **The Verdict:**
  If you pass Step 1 and 2, and Step 3 indicates "Texture" changes, the Protocol dictates you **lock the file**. You are not allowed to open it again until the full manuscript draft is complete.

  ***

  ### Running the Protocol on Your Cases

  Here is the faithful application of the CCP to your three scenarios.

  #### Case 1: The Middle Chapter (Plot job done, but boring)
  *   **Step 1 (Load-Bearing):** Yes. It moves the plot from A to B.
  *   **Step 2 (Defects):** No objective errors. It is clear.
  *   **Step 3 (Marginal Gain):** You want to make it "less boring." This is a texture/effect tweak. You have already rewritten it multiple times. The difference between "boring" and "adequate" here is likely in the eye of the beholder (you).
  *   **Step 4 (Portfolio):** Spending 20 hours spicing up a bridge chapter steals time from the climax or the next book.
  *   **Protocol Verdict:** **Move On.**
  *   *Reasoning:* In literary fiction, "boring" middle chapters are often necessary pacing valves. Unless it violates Step 1 (motivation/plot), "boredom" is often a reader experience issue, not a text issue. You cannot satisfice *reader engagement* at the chapter level; you can only satisfice *narrative function*. Trust the whole book to carry the weight.

  #### Case 2: The Opening Chapter (Agent says it's the weakest link)
  *   **Step 1 (Load-Bearing):** Yes.
  *   **Step 2 (Defects):** **Yes.** The "defect" here is external validation failure. Your agent (a market proxy) has identified a functional failure: it does not hook.
  *   **Step 3 (Marginal Gain):** You are likely rewriting for texture. You need to rewrite for *hook*.
  *   **Step 4 (Portfolio):** This is the gatekeeper. If this chapter fails, the rest of the book is unread.
  *   **Protocol Verdict:** **Revise, but with a Cap.**
  *   *Reasoning:* Satisficing does not mean ignoring data. Your aspiration level must be adjusted upward to meet the "Agent Standard." However, you must apply Step 3 ruthlessly. Set a limit: "I will do three passes focused *only* on the hook/inciting incident. If the agent still rejects it after that, the problem may be the manuscript's positioning, not the prose." Do not polish the sentences; fix the engine.

  #### Case 3: The 8x Rewrite Scene (Flip-flopping between Version A and B)
  *   **Step 1 (Load-Bearing):** Yes.
  *   **Step 2 (Defects):** No. Both versions work.
  *   **Step 3 (Marginal Gain):** **Zero.** You explicitly stated you "can't tell them apart anymore." This is the definition of bounded rationality limits. Your mind cannot perceive a difference; therefore, a reader certainly will not.
  *   **Step 4 (Portfolio):** Every hour here is a direct theft from your remaining three books.
  *   **Protocol Verdict:** **Pick Version A. Lock It. Never speak of it again.**
  *   *Reasoning:* You asked for honesty. The procedure says the search cost has exceeded the potential value. There is no "better" version. There is only "chosen" and "unchosen." The value of the scene is now determined by how well you write the *next* scene to support it, not by tweaking this one. Indecision is more damaging than a sub-optimal choice.

  ***

  ### Failure Modes: Where Satisficing Will Hurt You

  You asked where this procedure will misfire. Satisficing is a heuristic, not a law of physics. It fails in specific artistic contexts.

  **1. The "Voice" Failure**
  Satisficing works well for plot, structure, and clarity. It fails for *voice*. Voice is cumulative. A "good enough" sentence in Chapter 1 might set a tonal precedent that makes Chapter 20 impossible to write. If you satisfice the prose style too early, you may paint yourself into a stylistic corner.
  *   *Mitigation:* Do not apply the CCP to the first 10 pages of the first draft. Optimize there. Satisfice the rest.

  **2. The "Heart" Failure**
  Sometimes a chapter is not load-bearing for the *plot*, but it is load-bearing for the *theme*. If you satisfice a scene that contains the emotional core of the book because "it does the plot job," you may end up with a structurally sound but soulless novel.
  *   *Mitigation:* Add a "Resonance Check" to Step 1. "Does this chapter contain one of the three core emotional beats of the book?" If yes, raise the aspiration level.

  **3. The "Feedback Loop" Failure**
  Satisficing relies on your internal judgment. If your internal judgment is currently fatigued or distorted (which happens after 15 drafts), you might declare a chapter "satisficed" when it is actually broken.
  *   *Mitigation:* The CCP is for *your* drafting process. It does not replace beta readers. If a beta reader says it's broken, the aspiration level resets to "Fix this."

  ### The Economic Reality of Your Constraint

  You mentioned being 52 with perhaps three books left. You worried that pure satisficing doesn't capture that price. Actually, standard satisficing *underestimates* your price.

  In standard economics, satisficing saves time. In your specific career phase, time is not just money; it is **existence**.

  If you spend 4 years on Book 1, 4 years on Book 2, and 4 years on Book 3, you are done at 64.
  If you spend 2 years on Book 1, 2 years on Book 2, 2 years on Book 3, and 2 years on Book 4... you have added a whole novel to your legacy.

  The "Maximizer" mindset assumes that Draft 15 is objectively better than Draft 7. In literary fiction, past a certain point, this is false. Draft 15 is often *stale*. It has lost the energy of discovery because the writer has stopped exploring and started polishing.

  **The Hard Truth:**
  By refusing to satisfice, you are not protecting the quality of your work. You are protecting yourself from the judgment of the reader. As long as the chapter is in revision, it *could* be perfect. Once you lock it, it is merely what it is. You are using revision as a shield against the vulnerability of completion.

  The CCP forces you to lower the shield. It will feel like failure. It will feel like you are publishing something "lesser." But the "lesser" published book is infinitely more valuable than the "perfect" unpublished one.

  **Your Assignment:**
  Run the CCP on Case 3 today. Pick Version A. Write the first sentence of the *next* chapter. If you feel panic, that is not a sign the chapter is broken; it is a sign the protocol is working.
