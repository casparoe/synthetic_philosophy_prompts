      *   *Adjustment:* Phase 1 is pure Lottery (Odds). Phase 2 is Preface (Fallibility).
      *   *How to do Phase 2?* After the tickets, ask them to write 3 "Certain Facts" on the board. Then ask: "Are you infallible?" If no, then "Is it possible one fact is wrong?" If yes, then "Do you assert the Conjunction?"
