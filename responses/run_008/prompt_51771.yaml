      *   **Refining the Stakes (Crucial for "Real Cost"):**
          *   If I say "My ticket loses" and I'm right: +1 point.
          *   If I say "My ticket loses" and I'm wrong: -5 points (High penalty for false assertion).
          *   If I say "I withhold": 0 points.
          *   *Problem:* If only one wins, 29 get +1, 1 gets -5. Net positive. Everyone plays.
          *   *Collective Stake:* If the Class Report contains a contradiction *that we acknowledge*, the whole class loses a "Participation Bonus."
          *   *This creates the tension:* Individually rational to assert. Collectively irrational to conjoin without qualification.

  4.  **Developing the Debrief:**
      *   Map the "Ticket" to Probabilistic Acceptance.
      *   Map the "Report" to Conjunction/Closure.
      *   Map the "Disclaimer" to the Preface admission.
      *   Escapes:
          1.  Don't assert (Skepticism).
