  2.  **Deconstruct the Paradoxes:**
      *   *Lottery Paradox:* High probability of individual loss $\rightarrow$ Acceptance Rule (if prob $> threshold$, believe) $\rightarrow$ Conjunction (believe all lose) $\rightarrow$ Contradiction (one must win).
      *   *Preface Paradox:* Author believes each claim in book (based on evidence) $\rightarrow$ Author admits fallibility in preface (one claim is likely false) $\rightarrow$ Contradiction (all claims true AND at least one false).
      *   *Key Difference:* Lottery relies on statistical odds known *ex ante*. Preface relies on fallibility/humility *ex post* regarding specific assertions.
      *   *Challenge:* How to merge these into one activity without confusing them? The prompt asks for *both* paradoxes to be generated. This is tricky because they are structurally distinct.
      *   *Solution:* The activity needs to morph. Phase 1 (Lottery) creates the "All Lose" contradiction. Phase 2 (Preface) creates the "All True but One False" contradiction. Or, better yet, use the *same* set of assertions to show how the tension arises in two different contexts.
      *   *Refined Idea:* Let's stick closer to the prompt's specific imagery: "Ticket" (Lottery) and "Book/Report" (Preface).
      *   *Phase 1 (Lottery):* Students hold tickets. They know the odds. They commit to "My ticket loses."
      *   *Phase 2 (Preface):* Students compile a "Class Fact Sheet." Each student contributes a fact they are sure of. Then they add a disclaimer.
      *   *Wait, the prompt asks for a specific flow:* "one in which each student individually holds a 'ticket'... and one in which the class's individual commitments get pooled into a single collective artifact."
      *   *Okay, let's integrate:* The "Ticket" phase generates the Lottery tension. The "Artifact" phase generates the Preface tension.
      *   *Stakes:* Needs to be tangible. Extra credit points are the standard currency. Let's use a "Class Pot."

  3.  **Drafting the Activity - Step-by-Step:**

      *   **Setup:** 30 students. 75 minutes.
      *   **Materials:** 30 envelopes/tickets, a large poster/Google Doc (The Artifact), a die or randomizer.
      *   **Phase 1: The Lottery (Individual Commitment).**
