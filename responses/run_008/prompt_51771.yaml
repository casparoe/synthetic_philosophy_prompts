      *   *Let's stick to the prompt's vision:* "one in which each student individually holds a 'ticket'... and one in which the class's individual commitments get pooled."
      *   *Okay, I will make the Artifact the "Book of Losses."*
      *   *Lottery Tension:* We know by math one is false.
      *   *Preface Tension:* We know by humility one is false.
      *   *I need to make sure the students feel the "Preface" aspect.* The Preface is usually one author. Here the "Author" is the Class. The "Preface" is a clause they add to the agreement.

  7.  **Finalizing the Mechanics:**
      *   **Stakes:** 5 ECP (Extra Credit Points) individual bonus if your assertion is true. -5 ECP if false. 10 ECP *Class Bonus* if the Class Report is "Epistemically Sound" (defined loosely to let them struggle).
