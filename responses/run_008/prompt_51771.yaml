      *   **Outcome:** Students hold a contradiction in their hands.
      *   **Debrief:** Map activity to formal problems (high probability, closure/conjunction, lottery vs. preface structure). Offer live choices among standard escapes (reject acceptance rule, accept contradictions, belief vs. assertion).
