answer: |-
  # Activity Design: "The Fallibility Wager"

  **Course:** Introductory Epistemology (30 students, 75 minutes)
  **Goal:** Generate the structural tension of the Lottery and Preface paradoxes through student action before introducing terminology.
  **Materials:** 30 sealed envelopes (numbered 1–30), one slip of paper inside one envelope marked "WINNER," 30 "Commitment Cards," one large poster board or shared Google Doc ("The Class Report"), extra credit points (ECP) ledger.

  ---

  ## Part 1: The Setup (0:00–0:10)
  **Do not lecture.** Walk in and place an envelope on each desk.

  1.  **The Stakes:** Write on the board:
      *   **Individual Pot:** +5 ECP if your assertion is *true*. -10 ECP if your assertion is *false*. 0 ECP if you withhold assertion.
      *   **Class Pot:** +10 ECP for *everyone* if the Class Report is deemed "Epistemically Sound." 0 ECP if it is "Epistemically Defective."
  2.  **The Rule:** "Inside one envelope is a 'WINNER' slip. The other 29 are blank. You may open your envelope *after* you commit, but you must commit before looking. You do not know which envelope holds the winner. The odds are 29 in 30."
  3.  **The Constraint:** "On your Commitment Card, you must write one of two phrases exactly: **'This ticket will lose'** or **'I withhold.'** You are not allowed to write 'probably' or 'likely.' This is a claim about reality, not a feeling."

  ## Part 2: Phase One – The Lottery Tension (0:10–0:30)
  **Objective:** Force individually rational assertions that collectively guarantee error.

  1.  **Decision:** Give students 5 minutes to decide. Walk around. If a student asks, "What's the rational choice?" reply, "Maximize your expected points." (29/30 chance of +5 vs 1/30 chance of -10 makes 'Lose' the rational gamble).
  2.  **Collection:** Collect the cards. Tally them publicly on the board.
      *   *Expected Outcome:* Almost everyone writes "This ticket will lose."
      *   *Intervention:* If more than 2 students withhold, pause and ask: "You are giving up 5 points to avoid a 3% risk. Is caution worth 5 points?" Pressure them to play the odds.
  3.  **The Reveal:** Open the envelopes. Find the winner.
      *   **Moment of Truth:** Point to the 29 students who wrote "This ticket will lose" and were right. Point to the 1 student who wrote "This ticket will lose" and was wrong.
      *   **Ask the Class:** "Look at the set of Commitment Cards. Every single one of you made the rational choice for your own points. Yet, we *know* with certainty that one card contains a false assertion. Hold that thought."

  ## Part 3: Phase Two – The Preface Tension (0:30–0:50)
  **Objective:** Pool the commitments into an artifact and force a confrontation with fallibility.

  1.  **The Artifact:** Transfer the 30 assertions onto "The Class Report" (poster or doc).
      *   *Header:* "Official Report on Ticket Outcomes."
      *   *Content:* "Ticket 1 will lose... Ticket 30 will lose."
  2.  **The Preface Clause:** Tell the class: "To claim the Class Pot, this Report must be signed by the body. However, you are aware of the Winner. You know the Report contains a falsehood. If you sign it as 'True,' you are lying. If you don't sign, you lose the Class Pot."
  3.  **The Negotiation:** Give them 10 minutes to draft a "Preface Statement" to attach to the Report that might save the Class Pot.
      *   *Likely Student Solution:* "We assert all claims above, *but* we acknowledge one might be false."
  4.  **The Signing:** Ask for a show of hands. "Who endorses the Report *with* the Preface Statement as a true description of the class's knowledge?"
      *   **The Trap:** If they raise hands, they are asserting $P_1 \dots P_{30}$ AND asserting $\neg(P_1 \land \dots \land P_{30})$.
      *   **The Cost:** Remind them: "If this document is contradictory, it is Epistemically Defective. No Class Pot."
      *   **The Freeze:** Do not resolve whether they get the points yet. Leave the pot in limbo. The discomfort *is* the data.

  ## Part 4: The Debrief (0:50–1:15)
  **Objective:** Map the activity to the formal paradoxes and force a choice of escape routes.

  1.  **Naming:** Now, and only now, write "The Lottery Paradox" and "The Preface Paradox" on the board.
  2.  **Mapping:**
      *   **Lottery:** Point to Phase 1. "You accepted each claim because the probability was high (29/30). But you knew the conjunction was false."
      *   **Preface:** Point to Phase 2. "You wrote the claims (the text), but you wanted to add the disclaimer (the preface) admitting fallibility. The Report is the Text; the Preface Statement is the admission."
      *   **The Difference:** "In the Lottery, you knew one was false because of *math*. In the Preface, you know one is false because of *humility* (you know you aren't perfect)."
  3.  **The Live Choice (The Escapes):** Draw three columns on the board. Ask students to physically move to a side of the room or raise hands to choose how they would fix the activity for next semester.
      *   **Option A (The Skeptic):** "Change the rules. You cannot assert 'Lose' unless you are 100% sure."
          *   *Price:* You lose the Individual Pot. (Reject the Acceptance Rule).
      *   **Option B (The Pragmatist):** "Allow the Preface Statement. Sign the contradictory document."
          *   *Price:* You admit logic can be violated in practice. (Accept Contradictions/Contextualism).
      *   **Option C (The Distinction):** "You can *believe* it will lose, but you cannot *write it* in the Report."
          *   *Price:* You separate private belief from public assertion. (Belief vs. Assertion).
  4.  **Closing:** "There is no consensus in philosophy on which column wins. You just lived the cost of each."

  ---

  # Candid Design Assessment

  ### Where This Is Most Likely to Fail

  **1. The "It's Just a Game" Failure (Gamification)**
  *   **Symptom:** Students treat the ECP as monopoly money. They laugh when the "Winner" is revealed. They don't feel the normative weight of making a false assertion.
  *   **Why:** 5 points feels abstract. If the course grade doesn't hinge on it, the "cost" of being wrong is zero.
  *   **Mitigation:** Make the penalty social. If you assert "Lose" and win, you must stand up and apologize to the class for making a false claim in the Class Report. Make the *assertion* public, not just the card.

  **2. The "Linguistic Hedge" Failure**
  *   **Symptom:** During Phase 2, a student says, "We'll just write 'Ticket 1 is *expected* to lose.'"
  *   **Why:** Students naturally want to avoid contradiction. They will try to dissolve the paradox by weakening the language.
  *   **Mitigation:** Be a tyrant about syntax in Phase 1. "The rules say 'Will Lose' or 'Withhold.' If you write 'expected,' it counts as 'Withhold' (0 points)." You must force the categorical claim to generate the contradiction.

  **3. The "Free-Rider" Failure**
  *   **Symptom:** In Phase 2, the bold students argue for signing the Report. The shy students stay silent. The class signs, but half the room doesn't feel committed.
  *   **Why:** Collective stakes often lead to diffusion of responsibility.
  *   **Mitigation:** Require a roll-call vote for the Class Pot. Every student must say "Aye" or "Nay." If one says "Nay," the Pot is lost. This forces the shy students to confront the bold ones.

  ### When to Abandon Ship

  **The "Collapse of Stakes" Failure Mode**
  If, during Phase 1, more than 50% of the class chooses **"I withhold,"** the activity has failed.
  *   **Why:** The Lottery Paradox relies on the *Acceptance Rule* (that high probability justifies belief). If your students are naturally skeptical enough to refuse the bet despite the 29/30 odds, they have already "solved" the paradox intuitively by rejecting the premise. You cannot generate the tension if they won't play the odds.
  *   **Signal:** You see a sea of "Withhold" cards.
  *   **Action:** Stop. Do not proceed to Phase 2.

  **The Fallback Design: "The Card Sort"**
  If the Wager collapses, switch immediately to a low-stakes, high-structure sorting activity.
  1.  **Prep:** 30 index cards. Half say "I am certain this is true." Half say "There is a 99% chance this is true."
  2.  **Task:** Students must sort the cards into two bins: "Knowledge" and "Guess."
  3.  **Trap:** Include cards that are logically related (e.g., Card A: "Ticket 1 loses," Card B: "All tickets lose").
  4.  **Debrief:** Ask why they sorted "99% chance" as a Guess, but then ask if they would bet their phone on it.
  5.  **Why:** This isolates the *concept* of the threshold without relying on the students' willingness to gamble ECP. It is less visceral but more robust against "game-playing."

  ### Final Note on the "Preface" Distinction
  Be careful in the debrief not to conflate the two phases too much.
  *   **Phase 1 (Lottery)** is about *statistical certainty of error*.
  *   **Phase 2 (Preface)** is about *aggregated fallibility*.
  In this design, Phase 2 uses the Phase 1 data. This is efficient, but riskier. If the students feel Phase 2 is just "Lottery Part 2," you lose the specific insight of the Preface Paradox (which is about an author's relationship to their own specific claims, not just odds).
  *   **Fix:** In Phase 2, emphasize that the "Class" is now an "Author." The "Preface Statement" is an act of intellectual humility, not just a recalculation of odds. Ask: "Does admitting you are fallible change whether you *know* the claims?" This nudges them toward the specific epistemic tension of the Preface.
