              1.  **Lottery Phase:** Individual bets. 29/30 chance. High incentive to say "Lose."
              2.  **Preface Phase:** The "Class Textbook." We write down 30 facts we are all sure of (unrelated to tickets? No, keep it linked). Let's keep it linked to the tickets to save time.
              3.  **The Clash:** We have 30 assertions of "Loss." We know one wins.
              4.  **The Preface Move:** We add a statement: "We acknowledge that despite our evidence, one of these claims is false."
