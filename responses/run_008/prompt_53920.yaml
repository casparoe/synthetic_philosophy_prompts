prompt: |-
  I teach a philosophy of science module for second-years — 16 students, one 90-minute seminar. We've just covered Popper and Kuhn, and next week's session is on the demarcation problem. Design an in-class game where the students run competing "research programmes" that I can actually run with paper, dice and a whiteboard — no software, nothing to print beyond what I can scribble during a coffee break.

  The core mechanic I want: each team adopts a theory about a made-up world I invent for the session (something like a fake field of "comet herding" or made-up particle physics, so nobody can lean on real physics knowledge). Teams make risky predictions, I then reveal "observations" from a shuffled stack of cards I've prepared, and teams score points for boldness when they're right and lose points when they're wrong — so the incentive structure makes falsificationism feel like a live strategy rather than a doctrine they've been told about.

  But bake in three complications: (1) each team gets a couple of "auxiliary hypothesis" cards they can play *after* a failed prediction to retroactively absorb the hit, at some cost to their score or their future boldness budget; (2) one team is secretly assigned an unfalsifiable theory that can never actually lose points no matter what happens, and another team gets a theory that makes razor-sharp falsifiable predictions but is junk — and the students shouldn't be told which is which; (3) at some point I want to rig the observation deck so that one bold, well-corroborated programme goes down in flames through pure bad luck, while a degenerating programme that's been burning auxiliary cards all session limps to victory.

  Then give me a debrief script that maps specific moments from the game onto falsificationism proper — ad hoc rescue, the asymmetry between confirmation and refutation, what "risky prediction" is even measuring — and onto Lakatos's progressive vs degenerating programmes. Draw the analysis out of what the students themselves did rather than lecturing at them, and I'd like suggested questions that get the team with the unfalsifiable theory to articulate, in their own words, why never losing felt hollow.

  Also be honest about what will predictably go wrong the first time I run it — I'm guessing one clever student will refuse to play an auxiliary they know is ad hoc, someone will sulk about the rigged deck, and a team may just always make timid predictions and coast — and tell me which bit of the real demarcation debate the game structurally can't capture no matter how I run it.

  Please write the whole thing in British English, and keep the tone casual — you're talking to a tired lecturer, not writing for a journal. And don't forget the timing breakdown for the 90 minutes, I always underestimate how long setup takes and end up rushing the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 2nd-year Philosophy of Science students (16 students).
      *   **Context:** 90-minute seminar, following Popper and Kuhn, focusing on the Demarcation Problem.
      *   **Core Mechanic:** In-class game with competing "research programmes," made-up world, risky predictions, observation cards, scoring based on boldness/falsification.
      *   **Constraints:** Paper, dice, whiteboard only. No printing (scribble during coffee break). British English. Casual tone (tired lecturer to tired lecturer).
      *   **Specific Complications:**
          1.  Auxiliary hypothesis cards (retroactive save, cost involved).
          2.  Hidden roles: One unfalsifiable theory (never loses), one junk/falsifiable theory (sharp but wrong).
          3.  Rigged deck: Bold programme crashes via bad luck; degenerating programme limps to victory.
      *   **Debrief:** Map game moments to falsificationism (ad hoc rescue, asymmetry, risky prediction) and Lakatos (progressive vs. degenerating). Student-led analysis. Specific questions for the unfalsifiable team.
      *   **Reality Check:** Predict what will go wrong (refusal to play ad hoc, sulking about rigging, timid coasting). Identify what the game *can't* capture.
      *   **Timing:** Detailed breakdown for 90 mins (including setup).

  2.  **Game Design ("The Comet Herders of Oort"):**
      *   *Theme:* Needs to be abstract enough to prevent real knowledge but structured enough for predictions. "Comet Herding" is good. Let's say comets have properties: Colour (Red/Blue), Tail (Long/Short), Trajectory (Straight/Curve).
      *   *Teams:* 16 students. 4 teams of 4 seems manageable.
      *   *Materials:* Whiteboard (scoreboard, theory rules), Dice (for randomness/observation generation), Paper scraps (Auxiliary cards, Prediction slips).
      *   *Mechanics:*
          *   Teams write a prediction (e.g., "Next comet will be Red").
          *   They assign a "Boldness Value" (1-3). High boldness = high points if right, high penalty if wrong.
          *   Tutor draws an observation card (or rolls dice).
          *   If wrong, they can play an "Auxiliary Card" to explain it away (e.g., "Atmospheric interference"). Cost: Reduce future boldness cap or lose points.
          *   *Hidden Roles:*
              *   Team 1 (Unfalsifiable): "The Comet Spirits Guide Them." Prediction: "Whatever happens was intended." (Never wrong).
              *   Team 2 (Junk/Falsifiable): "All Comets are Red." (Easy to falsify).
              *   Team 3 & 4 (Normal): Standard theories.
          *   *Rigging:* The tutor controls the dice/cards.
              *   Early rounds: Favor the Bold/Good theory.
              *   Late rounds: Smash the Bold/Good theory with unlikely data.
              *   Allow the Degenerating (Auxiliary-heavy) team to scrape by.

  3.  **Drafting the Plan (Iterative Process):**

      *   *Tone Check:* Needs to be empathetic. "Look, I know you're tired." Use British spelling (falsificationism, programme, colour).
      *   *Setup:* Keep it minimal. Scribble rules on the board.
      *   *The "World":* Let's simplify. A "Comet" has two traits: *Colour* (Red/Blue/Green) and *Path* (Straight/Curve).
      *   *The Dice:* A D6 is standard. 1-2 = Red, 3-4 = Blue, 5-6 = Green. Odd = Straight, Even = Curve.
      *   *The Hidden Roles:* I need to pass notes secretly before class or just whisper to team captains during setup. Whispering is easier for "no print."
      *   *The Rig:* I need to know exactly how to manipulate the dice/cards without it being *too* obvious, but obvious enough for the debrief. Actually, using a pre-shuffled stack of paper squares is better than dice for rigging. I can write the outcomes on 10 slips of paper, shuffle them, but ensure the "bad luck" sequence is in there. Wait, the prompt says "shuffled stack of cards I've prepared." Okay, I will instruct the user to write 10 outcomes on scraps during the coffee break.
      *   *Scoring:* Needs to be simple.
          *   Correct Prediction: +Boldness Points.
          *   Incorrect Prediction: -Boldness Points.
          *   Auxiliary Play: Avoid penalty, but -1 Future Boldness Cap.
          *   Unfalsifiable Team: Always 0 penalty, but maybe limited points? No, the prompt says "never actually lose points." Let's say they get 1 point per round automatically (safe but boring).
          *   Junk Team: High risk, will crash.

      *   *Timing:* 90 mins is tight.
          *   Setup/Intro: 15 mins.
          *   Game Rounds (5 rounds): 40 mins.
          *   Debrief: 35 mins.
          *   *Risk:* Game often overruns. Need to enforce strict timers per round.

      *   *Debrief:* Crucial. Needs to move from "That was rigged" to "Science is like this."
      *   *Failure Modes:* Address the "sulking," the "timid team," and the "principled refuser."
      *   *Limitations:* What does this miss? Social factors, truth-likeness, long-term progress.

  4.  **Refining the Mechanics (Self-Correction):**
      *   *Issue:* If the Unfalsifiable team *never* loses, they might win by default if everyone else crashes.
      *   *Fix:* Unfalsifiable theories can't gain *many* points. They get "Safety Points" (1 per round) but can't claim Boldness Bonus. This mirrors that they explain everything but predict nothing specific.
      *   *Issue:* Rigging the deck too obviously causes rebellion.
      *   *Fix:* Make the rigging look like statistical variance until the very end.
      *   *Issue:* Auxiliary cards need a cost.
      *   *Fix:* "Theoretical Clout." You start with 3. Play a card, lose 1 Clout. Max Boldness = Clout. So saving yourself now makes you timid later. This is a great Lakatosian mechanic (degenerating shift).

  5.  **Writing the Content:**
      *   *Intro:* Acknowledge the stress.
      *   *Prep:* Coffee break tasks (write cards, assign roles).
      *   *The Game:* "The Oort Cloud Derby."
      *   *Rules:* Clear, bullet-pointed.
      *   *The Rig:* Specific instructions on how to order the observation cards.
      *   *Debrief Script:* Socratic questioning.
      *   *Troubleshooting:* Honest assessment of student behavior.
      *   *Limitations:* Philosophical honesty.

  6.  **Final Review against Constraints:**
      *   British English? (Programme, colour, realise, etc.)
      *   Casual tone? (Yes, "Right, listen," "Don't panic.")
      *   No printing? (All scribbled.)
      *   Timing included? (Yes.)
      *   All 3 complications included? (Auxiliaries, Hidden Roles, Rigged Deck.)
      *   Debrief questions included? (Yes.)

  7.  **Final Polish:** Ensure the distinction between Popper (falsification) and Lakatos (research programmes) is clear in the debrief section. Make sure the "Unfalsifiable" team feels the hollowness. (Self-correction: Ensure the unfalsifiable team *can* make predictions, but they are vague enough to always be true, e.g., "The comet will behave according to its nature.")

      *Wait, one detail:* "One team is secretly assigned an unfalsifiable theory... another team gets a theory that makes razor-sharp falsifiable predictions but is junk."
      *Implementation:* Pass notes to Team 1 and Team 2.
      *Team 1 (Unfalsifiable):* "The Cosmic Will dictates the comet's path." Prediction: "It will go where the Will sends it." (Always true).
      *Team 2 (Junk):* "Comets are Crystals." Prediction: "All comets are Blue and Straight." (Specific, likely false).

      *Rigging:* Ensure Team 3 (The "Good" Popperian one) gets hit hard at the end. Team 1 (Unfalsifiable) or Team 4 (Degenerating) wins. Let's make the Degenerating one win to prove Lakatos's point about survival vs. truth.

      *Okay, ready to write.*
answer: |-
  Right, listen. I know the term is dragging on, the coffee machine is broken again, and you've got 16 second-years who think Popper is just a guy who said "science is stuff you can prove wrong." You want them to *feel* the demarcation problem, not just memorise it.

  Here is a 90-minute seminar plan called **The Oort Cloud Derby**. It uses nothing but the whiteboard, some scrap paper you can scribble on during your break, and a single six-sided die (or a phone app if you must, but a physical die feels more "fate-like").

  It's designed to be slightly frustrating. That's the point. If they leave annoyed that the "truth" didn't win, you've done your job.

  ### **Prep (During Your Coffee Break)**

  You need to scribble three things on scraps of paper. Don't overthink the art.

  1.  **The Observation Deck (10 cards):** On 10 small slips, write the outcome of the next "Comet."
      *   *Comet Traits:* **Colour** (Red, Blue, Green) and **Path** (Straight, Curved).
      *   *The Rig:*
          *   Cards 1–3: Make these match the "Good Theory" (see below).
          *   Cards 4–7: Make these messy, requiring explanations.
          *   Cards 8–10: Make these brutally contradict the "Good Theory" but allow the "Degenerating Theory" to explain them away with auxiliaries.
      *   *Example:* "Red / Curved", "Blue / Straight", etc.
  2.  **The Auxiliary Cards (3 per team):** On 12 slips total, write **"Ad Hoc Rescue"**. Hand 3 to each of the 4 teams.
  3.  **Secret Role Notes (2 slips):**
      *   *Team A (The Astrologers):* "Your Theory: **The Cosmic Will.** Comets move according to an unknowable divine intent. You cannot be falsified. If a prediction fails, it was 'The Will.' You gain 1 point per round automatically, but you can never claim Boldness Bonuses."
      *   *Team B (The Crystalists):* "Your Theory: **Crystalline Determinism.** All comets are Blue and travel Straight. This is your core axiom. You cannot change this. You must predict Blue/Straight every time."
      *   *(Teams C & D get no note. They are the normal Popperians/Lakatosians.)*

  ---

  ### **Timing Breakdown (90 Minutes)**

  *   **00:00 – 00:15:** Setup & World Building.
  *   **00:15 – 00:55:** The Game (5 Rounds, 8 mins each).
  *   **00:55 – 01:25:** The Debrief (The most important bit).
  *   **01:25 – 01:30:** Wrap up & Reading.

  *Warning:* You will overrun the game if you let them debate predictions. Be a dictator on the timer.

  ---

  ### **Part 1: Setup (15 Mins)**

  **1. The World (5 mins)**
  Draw a big cloud on the board. Tell them: *"We are in the Oort Cloud. We are studying Comets. Comets have two properties: Colour (Red, Blue, Green) and Path (Straight, Curved)."*
  Divide the 16 students into 4 teams of 4. Give them names (Alpha, Beta, Gamma, Delta) or let them choose.
  *Secretly* slip the Role Notes to Team A (Astrologers) and Team B (Crystalists) under the table or whisper to the captain. Tell them: *"Do not reveal your instruction card to the other teams. This is your private theoretical commitment."*

  **2. The Rules (10 mins)**
  Write this on the board:
  *   **Goal:** Most Points after 5 Rounds.
  *   **Prediction:** Each team writes down a prediction for the next comet (e.g., "Red & Straight").
  *   **Boldness Stake:** They must stake 1, 2, or 3 points.
      *   If Right: Gain Stake points.
      *   If Wrong: Lose Stake points.
  *   **The Rescue:** If Wrong, they can play an **Ad Hoc Rescue** card.
      *   Effect: They don't lose points *this round*.
      *   Cost: Their maximum Stake for all *future* rounds is reduced by 1. (If they play 2 rescues, they can never stake more than 1 point again).
  *   **The Unfalsifiable Exception:** (Don't explain this yet, Team A will figure it out).

  ---

  ### **Part 2: The Game (40 Mins)**

  Run 5 Rounds. Keep the pace brisk.

  **Round 1 & 2 (The Honeymoon):**
  Draw from the top of your Observation Deck.
  *   *Intent:* Make the "Good" teams (C or D) look like geniuses. Let them stake 3 points and win.
  *   *Team B (Crystalists):* Will likely fail immediately (unless you rigged a Blue/Straight). Let them lose points. Watch if they play a Rescue card.
  *   *Team A (Astrologers):* They will write something vague like "The Will decides." Mark it correct. Give them their 1 safety point. They will look boring but safe.

  **Round 3 & 4 (The Anomalies):**
  Draw cards that contradict the leading team's theory slightly.
  *   *Pressure:* Ask the leading team: *"Your theory said Red, the comet is Blue. Are you falsified?"*
  *   *Incentive:* They will want to play an **Ad Hoc Rescue**. *"Ah, but there was solar wind interference!"*
  *   *Consequence:* Remind them to lower their future Boldness Cap on the scoreboard. This is the **Lakatosian Degeneration** mechanic. They are saving their score now but crippling their ability to be bold later.
  *   *Team B:* Should be in deep trouble.
  *   *Team A:* Still chugging along with 1 point per round.

  **Round 5 (The Crash):**
  Draw the rigged cards from the bottom of the deck.
  *   *Intent:* Smash the team that has been winning (likely C or D). Make the data completely contradict their core theory.
  *   *Outcome:* If they play a Rescue, their Boldness Cap hits zero. They can't score meaningful points.
  *   *The Winner:* Often, this ends up being Team A (The Unfalsifiable) or the team that hoarded their Rescue cards and played timidly.
  *   *Announce the Winner:* Even if it's Team A. Especially if it's Team A.

  ---

  ### **Part 3: The Debrief Script (30 Mins)**

  Do not lecture. Sit down. Ask questions. Let the awkwardness do the work.

  **Phase 1: The Feeling of Falsification (Popper)**
  *   **You:** "Team C, Round 5. The data came up Green/Curved. Your theory said Red. You lost 3 points. How did that feel compared to Round 1 when you got it right?"
  *   **Target:** Get them to admit that *losing* points felt more significant than gaining them.
  *   **You:** "Popper says science isn't about collecting points (verification); it's about surviving the hits (corroboration). Did the team that lost the most points learn the most about the Oort Cloud?"
  *   **Key Concept:** **Asymmetry.** One black swan kills the theory; a thousand white swans don't prove it.

  **Phase 2: The Ad Hoc Rescue (Lakatos)**
  *   **You:** "Team D, you played a Rescue card in Round 3. You said 'Solar Wind.' Did anyone actually believe there was solar wind?"
  *   *(Students will laugh/admit it was made up).*
  *   **You:** "But it saved your score. Why did you do it?"
  *   **Student:** "To stay in the game."
  *   **You:** "Exactly. But look at your scoreboard. Your Boldness Cap dropped from 3 to 2. By saving your theory from death, you made it weaker. Lakatos calls this a **Degenerating Problem Shift**. You're spending all your energy explaining away failures rather than predicting new successes. Did your theory get *better* after the rescue, or just *harder to kill*?"

  **Phase 3: The Hollow Victory (Unfalsifiability)**
  *   **You:** (Turn to Team A). "You won (or did very well). You never lost a point. How does that feel?"
  *   *(They usually say 'Empty' or 'Cheap').*
  *   **You:** "Why? You followed the rules."
  *   **Student:** "Because we didn't actually predict anything."
  *   **You:** "Write that on the board. **'A theory that explains everything, predicts nothing.'** If I told you the Comet was Red, you said 'The Will wanted Red.' If it was Blue, 'The Will wanted Blue.' Is that science? Why not?"
  *   **Target:** Get them to articulate that **risk** is the price of entry for scientific status.

  **Phase 4: The Rigged Deck (Realism)**
  *   **You:** "I have a confession. The observation deck was shuffled by me. Round 5 was rigged to kill the leading theory."
  *   *(Expect groans).*
  *   **You:** "In real science, who rigs the deck?"
  *   **Student:** "Nature?"
  *   **You:** "Nature doesn't care about your tenure track. But here's the question: If Team C had the 'true' theory, but I (Nature) threw a freak anomaly at them, should they abandon the theory?"
  *   **Target:** This leads to **Kuhn/Lakatos**. Sometimes you hold onto a theory through anomalies because you trust the core. Sometimes you should drop it. The game shows why demarcation isn't a single moment, but a historical process.

  ---

  ### **Reality Check: What Will Go Wrong**

  Be ready for these three things. They happen every time.

  **1. The Principled Refuser**
  *   **What happens:** One student in a team refuses to play the "Ad Hoc Rescue" card. *"No, that's cheating. We should just accept the falsification."*
  *   **Why it's good:** This is a pure Popperian!
  *   **How to handle:** Don't force them. Let them lose the points. In the debrief, ask them: *"You lost the game for your team. But did you maintain the integrity of your research programme? Is it better to be a dead truth or a living lie?"*

  **2. The Sulking Realists**
  *   **What happens:** When you reveal the deck was rigged in the debrief, a student says, *"So the whole thing was pointless. Truth didn't win."*
  *   **How to handle:** Agree with them. *"Exactly. In the short term, truth doesn't always win. Luck, funding, and rhetoric matter. That's why we need Kuhn and Lakatos, not just Popper. Popper gives us the ideal; this game gave you the reality."*

  **3. The Timid Coasters**
  *   **What happens:** One team stakes '1 point' every single round. They never lose, never use rescues. They finish mid-table.
  *   **How to handle:** Use them to define **Boldness**. *"You were safe. But did you tell us anything new about the Oort Cloud? A theory that only predicts what is already highly probable isn't driving research forward."*

  ---

  ### **What This Game Can't Capture**

  Be honest with them at the end. This game is a model, not the territory.

  1.  **Truth-Likeness:** In the game, the "world" is just random dice/cards. In real science, we assume there's a real structure out there. The game doesn't reward getting *closer* to the truth, only scoring points.
  2.  **Community Consensus:** In the game, teams compete. In science, they collaborate. A "degenerating" programme might actually be handing data to a "progressive" one.
  3.  **Time:** Real research programmes last decades. 40 minutes compresses the "degeneration" too fast. Sometimes holding onto a theory through anomalies (like Prout's atomic weight theory) actually pays off 50 years later. The game punishes this short-term.

  ### **Final Word to the Class**
  *"Next week, we're looking at Feyerabend, who's going to tell you this whole game is anarchic nonsense anyway. Read the handout. And Team A? Stop claiming 'The Will' is a valid hypothesis."*

  Good luck. You'll need less prep time than you think, but keep an eye on the clock. The debrief is where the philosophy actually happens.
