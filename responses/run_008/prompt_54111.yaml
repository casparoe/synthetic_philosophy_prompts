answer: |-
  **Principle: Invariant Antecedent Updating**
  Upon accepting a reliable indicative conditional $A \to C$, update prior credence $P$ to $P^*$ such that:
  1.  $P^*(C|A) = 1$.
  2.  $P^*(A) = P(A)$, unless $P(\neg C)=1$, in which case $P^*(A)=0$.
  3.  For worlds $w \in A \land C$, $P^*(w) = P(w) \cdot \frac{P(A)}{P(A \land C)}$.
  4.  For worlds $w \in \neg A$, $P^*(w) = P(w)$.

  This principle treats the conditional as a constraint on conditional probability that minimizes revision to the antecedent's total likelihood, shifting mass only within the antecedent sphere to satisfy the consequent.

  **Prediction for Variant of (1)**
  In the variant where prior $P(\text{Red})=0.9$ and $P(\text{Blue})=0.1$ (with Blue split evenly between HQ and Rest), the message "If Blue, then HQ" eliminates the Rest worlds. Applying Invariant Antecedent Updating:
  *   $P^*(\text{Blue})$ remains **0.1**.
  *   The 0.05 probability mass previously on $\text{Blue} \land \text{Rest}$ shifts to $\text{Blue} \land \text{HQ}$.
  *   $P^*(\text{Red})$ remains **0.9**.
  The antecedent probability is preserved despite the elimination of half the antecedent worlds.

  **Verdicts Saved and Sacrificed**
  This principle captures verdicts (1), (2), (3), (4), and (5).
  *   (1) & (6): It validates the intuition that $P(\text{Blue})$ stays fixed (one-half in (1), one-half in (6)).
  *   (2): It handles the certain-false consequent via the exception clause ($P(\neg C)=1 \implies P^*(A)=0$).
  *   (3) & (4): It aligns with pricing conditionals at conditional probability (Adams' Thesis), as the update rule preserves the coherence of $P(A \to C) = P(C|A)$.
  *   (5): It entails Modus Ponens for certain antecedents.

  **Unsaved Intuition:** The principle cannot save the competing intuition in **(6)** that the probability of Blue should *drop* because the conditional eliminates most Blue-worlds (the 9/10 sliver). That intuition implicitly treats the conditional as evidence requiring conditioning on the material conditional (which would reduce $P(\text{Blue})$ to $1/11$). To maintain consistency with (1)'s rejection of material conditioning, the "drop" intuition in (6) must be rejected as a cognitive error conflating conditional information with likelihood ratios.
