  **Rule 2: Evidential Decision Theory (EDT) with Ex-Post Conditioning**
  *   **The Logic:** Choose the action that provides the best *news* about the world (maximizes conditional expected utility). You update on all known facts before deciding.
  *   **Fits Track Record:**
