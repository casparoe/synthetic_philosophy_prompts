  **Rule 1: Functional Decision Theory (FDT)**
  *   **The Logic:** You should act as though you are selecting the output of your decision *algorithm*, not just a single physical action. If another entity (a predictor, a twin, a driver) has simulated or mirrors your algorithm, your choice logically determines theirs, even if their action happened in the past.
