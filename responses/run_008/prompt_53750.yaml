answer: |-
  ### Procedure: The Adaptationist Claim Checklist

  **Instructions:** Read the manuscript once. Then answer the following five questions in order. Do not proceed to the next question if the current one triggers a Reject decision. If a question triggers Major Revisions, note the specific deficiency but continue scanning to see if other fatal flaws exist.

  1.  **Trait-Fitness Specificity**
      *   **Question:** Does the paper identify a specific, variable component of the trait and link it to a specific, measurable fitness consequence (survival, reproduction, etc.)?
      *   **Sufficient Answer:** Yes. The trait is not described as a holistic "behavior" or "morphology" without decomposition, and the benefit is not assumed solely from presence/absence.
      *   **Decision:**
          *   **No:** **Major Revisions.** (Reason: "The link between the specific trait variant and the fitness metric is undefined. Please specify which component is under selection and how fitness was quantified.")
          *   **Yes:** Proceed to Q2.

  2.  **Independent Variation**
      *   **Question:** Is there evidence that the trait can vary independently of obvious environmental, developmental, or phylogenetic constraints?
      *   **Sufficient Answer:** Yes. The paper shows heritable variation, or uses a comparative method that controls for phylogeny/environment, or demonstrates the trait persists despite constraints.
      *   **Decision:**
          *   **No:** **Reject.** (Reason: "Without evidence of independent variation, selection cannot be distinguished from constraint or environmental determination. The current data does not allow for an adaptationist test.")
          *   **Yes:** Proceed to Q3.

  3.  **Alternative Hypothesis Generation**
      *   **Question:** Does the Introduction or Discussion explicitly name at least one non-adaptive alternative (e.g., drift, developmental constraint, byproduct/spandrel, exaptation)?
      *   **Sufficient Answer:** Yes. The alternatives are named, not just hinted at.
      *   **Decision:**
          *   **No:** **Major Revisions.** (Reason: "The manuscript presents an adaptationist hypothesis without formally engaging with non-adaptive alternatives. Please explicitly state and justify the rejection of at least one plausible alternative.")
          *   **Yes:** Proceed to Q4.

  4.  **Discriminatory Evidence**
      *   **Question:** Do the Results contain data that would look *different* if the non-adaptive alternatives (from Q3) were true?
      *   **Sufficient Answer:** Yes. There is a manipulation, a comparative control, or a statistical model that distinguishes the adaptation hypothesis from the alternatives.
      *   **Decision:**
          *   **No (No attempt):** **Reject.** (Reason: "The study design does not distinguish the adaptationist hypothesis from the stated alternatives. This remains a plausible story rather than a tested hypothesis.")
          *   **No (Attempt made, inconclusive):** **Editor Call.** (Reason: "The authors attempt to distinguish alternatives, but the data is ambiguous. This requires a judgment on whether the effort suffices for this journal's scope.")
          *   **Yes:** Proceed to Q5.

  5.  **Mechanistic Grounding (The Guardrail)**
      *   **Question:** If the paper argues for a *non-adaptive* explanation (e.g., "it is a byproduct"), is there positive evidence for the constraining mechanism (e.g., developmental pathway, genetic correlation), or is the claim based solely on parsimony ("it requires less selection")?
      *   **Sufficient Answer:** Evidence for the mechanism is provided (e.g., citing established developmental homology, genetic data). Parsimony alone is insufficient.
      *   **Decision:**
          *   **No:** **Major Revisions.** (Reason: "The non-adaptive explanation relies on an assertion of simplicity rather than evidence for the constraint. Please provide mechanistic evidence for the proposed byproduct/constraint.")
          *   **Yes:** **Accept/Minor Revisions.** (The procedural hurdles are cleared.)

  ***

  ### Guardrail: The Symmetry Principle

  Referees often feel that "adaptationist" claims require evidence while "skeptic" claims (it's just a spandrel/constraint) are default null hypotheses that require no proof. This is incorrect. Asserting "it's just a byproduct" without evidence for the developmental or genetic constraint is itself a just-so story.

  **How to spot the Skeptical Just-So:**
  *   **The Red Flag:** The paper argues a trait is a byproduct *because* assuming it is an adaptation is "complex" or "requires more assumptions."
  *   **The Check:** Ask: "What is the plumbing?" If the paper says "It's a byproduct of male selection," is there evidence of the shared plumbing (e.g., homologous tissue, shared genetic pathway)?
  *   **The Rule:** Parsimony is a logical virtue, not empirical evidence. A claim of constraint must be grounded in mechanism (development, genetics, physics) just as a claim of selection must be grounded in fitness variance. If the paper swaps "selection" for "parsimony" without mechanistic backing, trigger **Q5 Major Revisions**.

  ***

  ### Worked Cases

  #### Case 1: Caterpillar Warning Coloration
  *Claim:* Color is an adaptive warning signal.
  *Evidence:* Caterpillars are toxic; birds avoid them.
  *Confounds:* Color tracks diet; toxins and color not separated.

  *   **Q1 (Specificity):** **Pass.** Trait = yellow color; Benefit = bird avoidance.
  *   **Q2 (Independent Variation):** **Fail.** The manuscript states yellow pigment tracks diet. This suggests the trait may be environmentally determined rather than heritable. If the color is purely dietary, selection cannot act on the color gene directly.
  *   **Decision:** **Reject.**
  *   **Referee Comment:** "The manuscript argues for adaptive coloration, but notes that pigment tracks diet. Without evidence that color variation exists independently of diet (heritable variation), selection cannot be distinguished from environmental constraint. Please provide evidence of heritability or control for dietary effects before an adaptationist claim can be evaluated."
  *   **Note:** The paper dies here. It never gets to argue about alternatives because it hasn't established the raw material for selection exists.

  #### Case 2: Human Female Orgasm (Byproduct Claim)
  *Claim:* Orgasm is a byproduct of selection on male orgasm (shared embryonic pathway).
  *Evidence:* Embryonic homology; parsimony (less selection required).

  *   **Q1 (Specificity):** **Pass.** Trait = orgasmic capacity; Benefit = None (claimed).
  *   **Q2 (Independent Variation):** **Pass (Conditional).** While variation exists, the argument rests on the *presence* of the trait across sexes. The referee accepts the premise that the trait exists and varies enough to be discussed.
  *   **Q3 (Alternative Engagement):** **Pass.** Explicitly contrasts with adaptationist accounts.
  *   **Q4 (Discriminatory Evidence):** **Weak/Editor Call.** The prompt states the evidence is "parsimony." There is no comparative data showing lack of fitness benefit. However, because this is a comparative anatomical argument, strict manipulation is impossible.
  *   **Q5 (Mechanistic Grounding):** **Pass.** The paper cites "same embryonic pathway." This is positive evidence for the constraint mechanism (developmental homology), not just an appeal to simplicity.
  *   **Decision:** **Major Revisions (focused on Q4) or Editor Call.**
  *   **Referee Comment:** "The paper successfully identifies a mechanistic constraint (embryonic homology) satisfying the burden for a non-adaptive claim (Q5). However, relying solely on parsimony to distinguish this from an adaptationist account is weak (Q4). Please strengthen the discussion on why the embryonic constraint precludes secondary selection, or frame this as a hypothesis generating paper rather than a definitive test."
  *   **Distinction from Case 1:** Case 1 failed Q2 (no independent variation/heritability shown) and ignored the constraint (diet). Case 2 passes Q5 because it identifies the *mechanism* of the constraint (embryology), even if the statistical evidence is thin. Case 1 is biologically impossible as stated; Case 2 is theoretically sound but empirically thin.

  #### Case 3: Lizard Tail Autotomy
  *Claim:* Tail shedding is an adaptation for predation escape.
  *Evidence:* Comparative data (predation vs. shedding), biomechanics, field manipulation (survival).

  *   **Q1 (Specificity):** **Pass.** Trait = fracture plane threshold; Benefit = survival.
  *   **Q2 (Independent Variation):** **Pass.** Comparative data across species shows variation linked to predation pressure, controlling for phylogeny.
  *   **Q3 (Alternative Engagement):** **Pass.** Implicitly compares to non-predation causes (e.g., accidental loss, constraint).
  *   **Q4 (Discriminatory Evidence):** **Pass.** Field manipulation shows survival difference; biomechanics show specific design for shedding vs. breakage.
  *   **Q5 (Mechanistic Grounding):** **N/A.** (Claim is adaptationist).
  *   **Decision:** **Accept / Minor Revisions.**
  *   **Referee Comment:** "The study successfully distinguishes the adaptationist hypothesis from constraints via biomechanical and field data. The variation is shown to correlate with selection pressure independent of phylogeny. No procedural flaws detected."
  *   **Note:** The procedure prevents a referee from rejecting this simply because "it's an adaptationist story." The checklist forces them to acknowledge the discriminatory evidence (Q4).

  ***

  ### Predictable Misfires

  This procedure is a heuristic, not a law of nature. It will misfire in the following contexts:

  1.  **Deep Time / Paleontology:** You cannot run field manipulations on fossils. Q4 (Discriminatory Evidence) will often trigger "Reject" unfairly. *Correction:* For paleo papers, accept comparative morphology and functional modeling as satisfying Q4.
  2.  **Highly Conserved Traits:** If a trait is universal (e.g., genetic code), there is no variation (Q2 Fail). But this is often *because* selection was so strong it fixed the trait. *Correction:* If the authors argue for historical fixation, allow phylogenetic reconstruction to satisfy Q2.
  3.  **Theoretical / Modeling Papers:** These papers do not collect empirical data. Q2 and Q4 will fail. *Correction:* For modeling papers, replace Q2/Q4 with "Does the model explore parameter space where the alternative hypotheses win?"
  4.  **Consensus Constraints:** Sometimes a constraint is so well-established (e.g., gravity affects size) that citing it feels like "outside reading." *Correction:* If the constraint is textbook-level consensus, referees should accept a citation without demanding new mechanistic data for Q5.

  ***

  ### Closing Note for Coordinators

  The goal of this checklist is not to prove adaptation wrong, but to prove that the *claim* has been tested. Case 2 (Orgasm) passes where Case 1 (Caterpillar) fails not because "byproduct" is better than "adaptation," but because Case 2 provides a mechanism for its claim while Case 1 ignores a confounding variable.

  If a referee wants to reject a paper using this list, they must point to the specific Question number that failed. This prevents "vibes-based" reviewing where a referee simply dislikes adaptationism (or loves it) without engaging the data. If a referee rejects a Case 3 style paper using this list, they are likely misapplying Q4 (demanding impossible certainty rather than discriminatory evidence), which gives you grounds to override the review.
