answer: |-
  The train carriage was half-empty, rattling north through the darkening countryside. Rain streaked the windows, blurring the lights of passing villages into smeared oranges. Sarah stared out at the blur, still gripping the folded programme from the hearing. David was scrolling through emails on his phone, the blue light reflecting in his glasses.

  "They shouldn't have been turned away," Sarah said, finally breaking the silence. She tapped the programme against her knee. "The farmers from the neighbouring county. They stood there for twenty minutes explaining how the aquifer drops if that cooling system kicks in, and the chair told them they weren't constituents."

  David looked up, locking his phone. "I know. It looked rough. But legally, he was right. The referendum was for the city council. The council only has mandate over the city. If you let the county vote, you're expanding the electorate beyond the jurisdiction."

  "That's the circular logic I'm talking about," Sarah said, turning to face him. "You're saying they don't get a vote because they aren't in the city, but the reason they're suffering is because the city made a decision. If the decision drains their wells, they're bound by the outcome just as much as we are. Maybe more. We get the tech jobs; they get the dust."

  "So what's the rule?" David asked, leaning forward, elbows on knees. "Everyone who loses something gets a vote? Sarah, think about the chain of causality. That datacentre buys electricity. The power plant burns gas. The emissions change the climate. The climate shifts crop yields in Kenya. Do the farmers in Kenya get a vote on the city council planning committee?"

  "Don't be daft. I'm talking about direct, significant impact. The water table is a physical boundary. It doesn't care about your city limits."

  "Who defines 'significant'?" David countered. "My house price might go down because the datacentre makes the area look industrial. Is that significant? My competitor might lose business because the new tech hub attracts all the talent. Is that significant? If you open the door to 'affected interests', you never close it. You end up with a global electorate for a local bin collection schedule. It's not scalable. Democracy requires a boundary, or you can't count the votes."

  "So you pick the boundary based on convenience?" Sarah shot back. "That's just might makes right. We draw the line where it's easiest for us, and everyone outside gets coerced without consent. That's not democracy; that's administration."

  "It's not convenience, it's reciprocity," David said. "The people who vote are the ones who have to live under the enforcement of the rule. If the city council passes a law, they can send bailiffs to my house in the city. They can't send bailiffs to the farmers in the next county. The farmers aren't subject to the city's coercion. They're subject to the consequences, yes, but there's a difference between being hurt by a decision and being ruled by it."

  "Is there?" Sarah leaned in. "Let's take our work. We ship that recommender system. We tweak an algorithm in London, and it shifts voter turnout in a country none of us live in. Those people aren't subject to British law. We can't arrest them. But our code coerces their attention. It shapes their reality. By your logic, they have no say because they aren't 'subject' to our employment contract or our local laws. But the impact is real power."

  David paused. He took off his glasses and wiped them on his tie. "That's a harder case. I'll give you that. But generally, law is different from market force or code. Law says 'do this or else'. The water referendum says 'we will drill here'. If you live here, you can't opt out of the drilling noise. If you live in the next county, you can't opt out of the water loss. But... if the city council tries to tax the farmers to pay for the drill, the farmers can say 'you have no authority over me'."

  "But the water doesn't check your tax status," Sarah said. "Physics doesn't care about jurisdiction. If the criterion is coercion, isn't draining someone's well a form of coercion? You're forcing them to adapt to a new scarcity. You're changing the rules of their survival without their input. Why is a bailiff at the door coercion, but a dry tap isn't?"

  David sighed, looking out at the rain. "Because if we say dry taps are coercion, then every action is coercion. I open a bakery. I put the shop next to yours. Your customers come to me instead. You go bust. I've affected your livelihood. Did I coerce you? No. I just acted within my rights. The difference is intention and authority. The council has authority over the city. They are accountable to the city. If you expand the electorate to everyone affected, who are they accountable to? Everyone? That means no one."

  "Okay," Sarah said, holding up a hand. "Let's push the time boundary. What about the people not born yet? This aquifer takes centuries to recharge. The decision we make tonight affects people fifty years from now. They are definitely affected. Significant impact. Are they in the demos?"

  "Obviously not. They don't exist."

  "So your principle isn't 'all affected'," Sarah said. "It's 'all currently living affected people who are inside the legal boundary'."

  "It has to be," David insisted. "You can't have a vote with non-existent people. You'd need trustees. But then it's the trustees voting, not the affected. And who picks the trustees? See? You've just kicked the can back to the current voters."

  "Right. So you admit the boundary is arbitrary. It's drawn around the living, and around the legal jurisdiction. Both are choices."

  "They're practical choices," David corrected. "Democracy is a machine. It needs inputs. If the inputs are fuzzy, the machine jams. I'm not saying the farmers shouldn't matter. I'm saying the referendum isn't the tool to protect them. They need courts. They need environmental regulations. They need representation at a higher level, maybe national, that overlaps both counties. But for *this* vote, the boundary has to be sharp."

  "But that assumes the higher level is fair," Sarah said. "What if the national government is bought off? Then the farmers have no recourse. And this is where I get stuck, David. If we accept that boundaries are just practical hacks, then democracy isn't about justice. It's just about processing power. It's about counting heads efficiently."

  "Isn't it?" David asked. "Look, I sympathise. I do. But if you say 'everyone affected', you have to define the threshold. Say, 'anyone whose income drops by 5%'. Who measures that? Before or after? What if I move away to avoid the impact? Am I still affected? The administrative cost of determining who gets a vote becomes larger than the cost of the project itself. At some point, you need a bright line. Residency is a bright line. Citizenship is a bright line. 'Interest' is a fog."

  Sarah was quiet for a moment. The train slowed as it approached a junction. "Okay. Suppose we accept that. We keep the bright line for practicality. But then we have to admit that some decisions shouldn't be made by a single demos. Maybe the water vote shouldn't have the same boundary as the school board vote."

  David nodded slowly. "Functional constituencies."

  "Exactly. For the aquifer, the demos is the watershed. For the schools, it's the neighbourhood. For the datacentre algorithm, maybe it's... I don't know, the user base? If we admit that the 'people' changes depending on the 'problem', does that solve it?"

  "It feels like a cop-out," David said. "Because now you don't have a sovereign people anymore. You have a shifting cloud of stakeholders. Who holds the government accountable? If the boundary changes every time, there's no stable 'us' to check the power of the 'them'."

  "Or," Sarah said, "maybe 'the people' was always a fiction. We pretended there was a single body politic because it made the nation-state easier to run. But in a connected world—water tables, algorithms, supply chains—the impacts don't line up with the borders. So why should the vote?"

  David rubbed his face. "Because without the border, there's no accountability. If I vote for a bad council, I can vote them out next year. I know who they are. If the electorate is 'everyone within fifty miles of the aquifer', how do they organise? How do they debate? How do they form a majority? You need a community to have a democracy. A community needs boundaries."

  "So we're back to square one," Sarah said. "Community boundaries vs. Impact boundaries. Stability vs. Justice."

  "Maybe," David conceded. "But here's the thing that keeps me up. If we go with your impact model, you risk tyranny of the outsiders. Imagine the county farmers outvote the city residents on a issue that only happens in the city. They impose a cost on us that we don't share. That's taxation without representation, just reversed."

  "And if we go with your model," Sarah said, "you get tyranny of the insiders. We impose costs on them that they don't share. That's exploitation without representation."

  The train lurched to a halt at their station. The lights flickered. They stood up, gathering their coats.

  "So," David said, stepping into the aisle. "We agree that the current system lets the farmers down. But we disagree on whether breaking the boundary fixes it or breaks democracy."

  "I think," Sarah said, buttoning her coat, "that we're trying to use one key for every lock. We want a single answer for 'who belongs'. But maybe the question isn't 'who belongs in the demos'. Maybe it's 'what kind of power is being exercised'."

  David held the door open for her. "And if the answer is 'all of them'?"

  "Then we're in trouble," Sarah said, stepping onto the platform. "Because we're building systems that affect everyone, but we're only accountable to the shareholders."

  David paused, hand on the railing. "Or the voters. Don't forget the voters."

  "Same thing, sometimes," she said.

  They walked towards the exit, the argument unfinished, the rain waiting outside. They knew the code they'd write on Monday would reach further than the city limits, and neither of them knew quite how to justify that to the people who'd have to live with it.
