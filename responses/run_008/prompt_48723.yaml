      *   **Goal:** Wants a rigorous breakdown of what "Occam's Razor" (or the principle of parsimony) actually means in different contexts. Needs a structured list distinguishing claims about "simplicity," the nature of the principle (epistemic vs. ontological), and justification. Needs to know which versions survive the "God did it" objection and which supports the teacher's original point.
      *   **Tone:** Educational, rigorous but accessible (AP Physics level), structured (for bringing to class), honest about philosophical debates.

  2.  **Deconstruct the Problem:**
      *   The core issue is the ambiguity of "simplicity" and the justification for preferring it.
