      *   *Pragmatic:* True but doesn't claim *truth*, just utility. "God" might be useful for comfort, not physics.
      *   *Statistical:* Very robust. "God" has infinite/undefined parameters usually, or is unfalsifiable. Survives the objection.
      *   *Algorithmic:* "God" requires defining God, which is complex. Survives the objection.
