      *   If the "Audience" turned out to be a distinct field (Penrose/Hameroff Orch-OR style, though that's still physicalist-ish).
      *   Actually, the strongest point is the *explanatory gap*. If functionalism fails to account for qualia, the Theater intuition (that there's 'more' than processing) holds weight.

  9.  **Final Polish:** Check against constraints. Did I brainstorm correspondences? Yes. Did I identify load-bearing parts? Yes. Did I critique Dennett? Yes. Did I admit uncertainty? Yes.

  *(Self-Correction during drafting)*: Make sure not to conflate Global Workspace Theory with the Cartesian Theater. GWT posits a broadcast mechanism (Stage-like), but denies the Homunculus (Audience). I need to be clear on that distinction. The cousin's error is the Audience, not necessarily the Stage.

  10. **Final Structure:**
      *   Intro: Naming the intuition (Cartesian Materialism/Theater).
      *   Part 1: Mapping the Theater (The Audit).
      *   Part 2: The Load-Bearing Wall (The Audience & The Regress).
