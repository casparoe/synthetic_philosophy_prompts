answer: |-
  To read *Tess of the d'Urbervilles* through the lens of Darwin's *The Descent of Man* and his *Autobiography* is to witness a profound philosophical collision. Darwin posits morality not as divine revelation but as a "social instinct" refined by habit and reason, liable to drift as community needs change. Simultaneously, his *Autobiography* recounts the erosion of faith, arguing that a nature rife with suffering and waste cannot evidence a benevolent designer. Hardy's novel attempts to operationalize these insights, yet it strains under the weight of the very theological structures it seeks to dismantle.

  Consider first the Darwinian reading, which finds strong footing in the subtitle, "A Pure Woman." If morality is an evolved instinct serving social cohesion, then Victorian sexual morality—which brands Tess a fallen woman for a rape/seduction she did not consent to—is a maladaptive habit, a "drift" that no longer serves human flourishing. Hardy frames Tess's purity not as theological sinlessness but as biological and emotional fidelity; her instinctual sympathy (what Darwin would call the root of morality) remains intact despite social censure. Angel Clare's revulsion upon hearing her confession dramatizes Darwin's warning that acquired "habit" can override natural "sympathy." Angel's moral code is not reasoned truth but inherited social conditioning that chokes his instinctual love. Similarly, the "moral luck" that ruins Tess—the death of the horse Prince, the confession letter sliding under the carpet—can be read as random variations in a causal chain. In a strictly Darwinian universe, these are not fates but accidents, indifferent mutations of circumstance that selection pressures (society) punish ruthlessly. Here, the narrator acts as a naturalist, dissecting how an outdated moral instinct sacrifices a viable human organism.

  However, the novel resists this cold taxonomy. The very structure of the plot relies on coincidences so egregious they curdle into design. The letter under the carpet is not merely bad luck; it is a narrative mechanism that feels engineered to ensure destruction. This is where the Darwinian reading fractures. Darwin's nature is indifferent; Hardy's nature often feels hostile. This tension culminates in the final sentence: "'Justice' was done, and the President of the Immortals, (in Æschylean phrase) had ended his sport with Tess." If Hardy were a consistent Darwinian, the execution would be the termination of a life by the State, the end of a biological process. Instead, Hardy invokes a "President." He capitalizes "Justice." He attributes "sport." This is not the language of cause and effect; it is the language of agency. To speak of a "President of the Immortals," even in an Æschylean phrase, is to populate the void with a watcher, a judge, and a tormentor. It smuggles providence back in as a shadow-judge because the indignity of Tess's suffering demands an defendant. A blind universe can kill, but it cannot toy. By claiming the universe "toyed" with her, Hardy re-theologizes the tragedy. He cannot sustain the indifference required by naturalism because his moral outrage requires a target.

  What the novel dramatizes that Darwin's prose does not is the *agony* of the transition. Darwin analyzes the mechanism of moral evolution; Hardy inhabits the pain of those crushed by the lag between biological reality and social instinct. Darwin can observe the ichneumon wasp feeding on the caterpillar as a neutral fact; Hardy cannot observe Tess hanging without demanding to know *why*. The novel is not a consistent application of Darwinian theory, nor is it a simple return to Christian dogma. It is a record of a mind trying to use the vocabulary of science to describe a universe that still feels, emotionally, like a courtroom. Hardy wants the moral clarity of the subtitle ("A Pure Woman") to stand on natural grounds, but he lacks the philosophical vocabulary to vindicate her without invoking a higher court of appeal, even if that court is presided over by a cruel deity.

  \answer{torn-between-both}
