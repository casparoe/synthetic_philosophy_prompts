prompt: |-
  I'm the on-call clinical ethics consultant at a mid-sized hospital, and I keep getting paged at 11pm with the same recurring mess: family wants everything done, or wants us to stop, or asks whether we can't just up the morphine a bit until she goes. I want a procedure I can actually run in the forty minutes before the family meeting that sorts these into withholding vs withdrawing vs something I shouldn't call treatment at all. Ground it in whatever the philosophy actually says about doing vs allowing and killing vs letting die — acts vs omissions, whether the bathtub cases should scare me off the distinction entirely, double effect if you think it survives, ordinary vs extraordinary means if you think that cut helps. The procedure needs the questions in order, what counts as enough of an answer to each, where it hands off to the attending or the ethics committee chair because the remaining question is values not facts, and where it just fails and I'm on my own. Then run it on three cases: a family asking to discontinue a ventilator on a patient who might breathe on her own in a week, a resident wanting to quietly not escalate on a patient whose proxy is unreachable untill morning, and a nurse titrating pain meds in a dying patient where the dose needed for comfort could plausibly also depress respiration. Be honest about where the procedure gives an answer I won't like, and what it flat out can't settle.
reasoning: |-
  Here's a thinking process that leads to the suggested clinical ethics procedure:

  1.  **Analyze the Request:**
      *   **User:** On-call clinical ethics consultant at a mid-sized hospital.
      *   **Problem:** Recurring late-night pages (11pm) involving end-of-life decisions (family demands, stopping treatment, symptom management).
      *   **Goal:** A practical, 40-minute pre-meeting procedure to sort cases into categories (withholding vs. withdrawing vs. non-treatment).
      *   **Philosophical Grounding:** Must engage with doing vs. allowing, killing vs. letting die, acts vs. omissions, the "bathtub cases" (James Rachels), double effect, ordinary vs. extraordinary means.
      *   **Structure:** Ordered questions, criteria for "enough" answer, hand-off points (attending/ethics chair), failure points.
      *   **Application:** Run the procedure on three specific cases (ventilator withdrawal, unreachably proxy/non-escalation, palliative sedation/double effect).
      *   **Tone:** Honest, pragmatic, philosophically rigorous but clinically usable. Acknowledge limitations.

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Acts vs. Omissions:* Traditionally used to distinguish killing from letting die. Critiqued heavily (Rachels' bathtub case suggests moral equivalence if outcome/intent is same). *Decision:* Keep it as a heuristic for legal/regulatory safety, but acknowledge it doesn't carry moral weight on its own.
      *   *Killing vs. Letting Die:* Crucial for legal liability. *Decision:* This is the primary filter.
      *   *Ordinary vs. Extraordinary Means:* Catholic tradition, but useful secularly as "proportionate vs. disproportionate." *Decision:* Use "Proportionate/Disproportionate" language.
      *   *Double Effect:* Intent matters. Good effect (comfort) vs. bad effect (hastening death). *Decision:* Essential for the pain med case.
      *   *Medical Futility:* Is the treatment doing what it's supposed to do? *Decision:* A key threshold question.

  3.  **Drafting the Procedure (The "40-Minute Triage"):**
      *   *Constraint:* 40 minutes. Needs to be fast.
      *   *Step 1: Medical Facts (The "Can We?" Question).* Is the physiology reversible? Is the treatment physiologically effective?
      *   *Step 2: Intent & Causality (The "Are We Killing?" Question).* Address the Acts/Omissions distinction honestly.
      *   *Step 3: Proportionality (The "Should We?" Question).* Burdens vs. Benefits.
      *   *Step 4: Authority (The "Who Decides?" Question).* Proxy status, advance directives.
      *   *Step 5: The Hand-off/Fail State.* When does this become a values conflict requiring more time/court/chaplain?

  4.  **Refining the Philosophical Nuance:**
      *   *Rachels' Bathtub:* I need to admit that morally, letting die and killing can be equivalent. But *legally* and *professionally*, they are not. The procedure must protect the clinician while respecting the moral reality.
      *   *Double Effect:* It's often misused. I need to ensure the intent is *actually* comfort, not "comfort via death."
      *   *Withholding vs. Withdrawing:* Ethically equivalent, psychologically harder. The procedure should treat them as the same category morally.

  5.  **Developing the Three Test Cases:**
      *   *Case 1 (Ventilator):* Withdrawing treatment. Potential for recovery (1 week). High stakes.
      *   *Case 2 (DNR/Unreachable Proxy):* Withholding escalation. "Quietly not escalate." This is dangerous territory (unilateral DNR).
      *   *Case 3 (Pain Meds):* Double Effect. Titration for comfort vs. respiratory depression.

  6.  **Writing the Procedure (Iterative Process):**
      *   *Intro:* Acknowledge the grind. Set expectations.
      *   *The Flowchart:* Numbered steps.
      *   *The "Stop" Conditions:* Where do I call the chair?
      *   *The Test Run:* Apply strictly.
      *   *The Honest Assessment:* Where does it break?

  7.  **Self-Correction/Critique during Drafting:**
      *   *Critique:* Is this too legalistic?
      *   *Fix:* Add a step about "Goal of Care" alignment.
      *   *Critique:* Does it address the 11pm constraint?
      *   *Fix:* Emphasize that this is for *triage* and *recommendation*, not final resolution of deep conflict.
      *   *Critique:* Rachels' argument is strong. If I dismiss it, I lose credibility.
      *   *Fix:* Explicitly state that the distinction is normative/legal, not necessarily metaphysical.
      *   *Critique:* Case 2 is ethically fraught. "Quietly not escalate" sounds like a secret DNR.
      *   *Fix:* The procedure *must* flag this as a failure point requiring attending responsibility, not ethics approval of secrecy.

  8.  **Final Polish:**
      *   Ensure the tone is professional, weary but sharp (matching the user's persona).
      *   Check that all philosophical constraints (bathtub, double effect, etc.) are integrated, not just name-dropped.
      *   Make sure the "Hand-off" points are clear.

  9.  **Final Review against Prompt:**
      *   Procedure in 40 mins? Yes.
      *   Sorts withholding/withdrawing/non-treatment? Yes.
      *   Grounded in philosophy (acts/omissions, Rachels, double effect, ordinary/extraordinary)? Yes.
      *   Questions in order + "enough" criteria? Yes.
      *   Hand-off points? Yes.
      *   Run on 3 cases? Yes.
      *   Honest about failures? Yes.

  *(Self-Correction during final output generation)*: I need to make sure I don't give medical advice, but rather *ethics consultation* advice. The distinction is vital. I am the consultant, not the attending.

  Let's build the "40-Minute Triage Protocol."

  *Step 1: Physiological Futility (The "Can" Question).*
  *Step 2: The Causality Filter (Acts vs. Omissions & Rachels).*
  *Step 3: Proportionality (Ordinary vs. Extraordinary).*
  *Step 4: Intent (Double Effect).*
  *Step 5: Authority.*

  Okay, ready to write. I will structure it as a memo to myself/the user.
answer: |-
  **MEMORANDUM**
  **TO:** On-Call Ethics Consultant
  **FROM:** On-Call Ethics Consultant (You, tomorrow morning)
  **SUBJECT:** The 40-Minute Triage Protocol (Late Night Edition)

  You asked for a tool that works at 11pm when you are tired, the attending is defensive, and the family is grieving. You also asked for philosophical honesty. Most hospital protocols are legal shields disguised as ethics. This procedure is not a shield; it is a sorting mechanism. It will not solve deep value conflicts. It will tell you which conflicts are solvable now and which ones require you to say, "I cannot clear this."

  This protocol relies on four philosophical pillars, stripped of academic jargon:
  1.  **Causality (Acts/Omissions):** Acknowledging James Rachels was right (morally, killing and letting die can be equivalent) but the law is wrong (legally, they are distinct). We use the distinction for liability, not moral truth.
  2.  **Proportionality (Ordinary/Extraordinary):** Replaced with "Burdens vs. Benefits." A treatment is "extraordinary" if the burden outweighs the benefit, regardless of technology level.
  3.  **Double Effect:** Intent determines the act. Foreseen death is permissible; intended death is not.
  4.  **Authority:** Who owns the values?

  ---

  ### THE 40-MINUTE TRIAGE PROTOCOL

  **Time Budget:** 40 Minutes total.
  **Goal:** Categorize the request to determine if it is (A) Clinically Indicated, (B) Ethically Permissible, or (C) Out of Bounds/Requires Committee.

  #### STEP 1: The Physiological Floor (5 Minutes)
  **Question:** Is the proposed intervention physiologically capable of achieving the physiological goal?
  *   *Input:* Ask the attending: "If we do X, will the body respond Y?"
  *   *The "Enough" Answer:* A clear "Yes, it will improve oxygenation" or "No, the organs are failing regardless of support."
  *   *The Sort:*
      *   If **No (Futile):** The intervention is not "treatment." It is an experiment or a ritual. You have grounds to recommend withholding/withdrawing regardless of family wish. **Stop here.** Recommend attending decline based on medical indication.
      *   If **Yes:** Proceed to Step 2.

  #### STEP 2: The Causality Filter (Acts vs. Omissions) (10 Minutes)
  **Question:** Does the action *cause* death, or does it *allow* the pathology to cause death?
  *   *Philosophical Note:* Rachels' "Bathtub Case" (one man drowns a cousin, one lets him drown) proves the *moral* difference is negligible if intent/outcome match. However, the *legal* and *professional* difference is massive. We maintain the distinction to protect the license, not because it is metaphysically robust.
  *   *The "Enough" Answer:* "Removing the vent removes the barrier to the underlying lung failure" (Allowing) vs. "Injecting KCl stops the heart" (Causing).
  *   *The Sort:*
      *   **Withholding/Withdrawing:** Ethically equivalent. If Step 1 passed, this is permissible *if* authorized.
      *   **Active Euthanasia:** (e.g., "Up the morphine until she goes" with intent to kill). **FAIL STATE.** This is out of bounds. Hand off to Attending to explain this is illegal/unethical. Do not facilitate.
      *   **Unclear:** Proceed to Step 3.

  #### STEP 3: The Proportionality Check (Ordinary vs. Extraordinary) (10 Minutes)
  **Question:** Do the burdens of the intervention outweigh the benefits *for this patient*?
  *   *Input:* Review goals of care. Is the goal cure, prolongation, or comfort?
  *   *The "Enough" Answer:* "The patient would find this state unacceptable" (based on proxy/AD) OR "The treatment prolongs dying, not living."
  *   *The Sort:*
      *   **Disproportionate:** Treatment is "extraordinary." No obligation to provide. Permissible to withdraw.
      *   **Proportionate:** Treatment is "ordinary." Obligation to provide *unless* patient refuses.
      *   **Values Conflict:** Family says "Burden is worth it," Team says "It's torture." **HAND-OFF POINT.** This is not a fact question. This requires Ethics Committee Chair or Risk Management. Do not clear this alone at 11pm.

  #### STEP 4: The Intent Check (Double Effect) (10 Minutes)
  **Question:** Is the primary intent symptom relief, with death as a foreseen but unintended side effect?
  *   *Input:* Review dosing logs and stated intent.
  *   *The "Enough" Answer:* "Dose is titrated to pain scale/respiratory rate," NOT "Dose is titrated to respiratory arrest."
  *   *The Sort:*
      *   **Palliative Intent:** Permissible under Double Effect.
      *   **Euthanasic Intent:** **FAIL STATE.** (See Step 2).
      *   **Ambiguous:** **HAND-OFF.** Requires Palliative Care specialist involvement before ethics sign-off.

  #### STEP 5: Authority Verification (5 Minutes)
  **Question:** Who holds the decision rights?
  *   *Input:* Check chart for Proxy/AD.
  *   *The "Enough" Answer:* Validated proxy identified OR Patient has capacity.
  *   *The Sort:*
      *   **Proxy Present:** They decide (within Steps 1-4 bounds).
      *   **No Proxy (Unreachable):** **HAND-OFF.** Attending must make "best interest" decision. Ethics can support, but cannot authorize unilateral DNR without institutional policy backing.
      *   **Conflict:** Proxy vs. Patient Wishes. **HAND-OFF.**

  ---

  ### RUNNING THE CASES

  Here is the protocol applied to your three 11pm pages.

  #### CASE 1: The Ventilator (Withdrawing)
  *Scenario:* Family wants vent off. Patient might breathe on own in a week.
  *   **Step 1 (Physio):** Vent *is* keeping her alive. If removed, she dies now. If kept, she *might* breathe in a week. It is not futile. **Pass.**
  *   **Step 2 (Causality):** Removing vent allows underlying respiratory failure to kill. This is "Letting Die." **Pass.** (Rachels would say the outcome is the same as killing, but the protocol accepts the legal distinction).
  *   **Step 3 (Proportionality):** Here is the rub. Family sees "potential recovery." Team sees "prolonged suffering/ICU stay."
      *   *If Patient previously said "No machines":* Treatment is disproportionate to goals. **Clear.**
      *   *If Patient status unknown:* Family decides burden/benefit. If they want to try for the week, treatment is proportionate.
  *   **Step 4 (Intent):** Intent is to stop invasive support. **Pass.**
  *   **Step 5 (Authority):** Family is proxy.
  *   **Verdict:** **ETHICALLY PERMISSIBLE TO WITHDRAW *ONLY IF* it aligns with patient's known wishes.**
  *   **The Answer You Won't Like:** If the patient never spoke on this, and the family wants to stop, but the medical chance is reasonable (1 week to spontaneous breathing), the protocol suggests you *cannot* support withdrawal based on "futility." You must support the family's right to decide, but if the *team* wants to stop and family wants to continue, you cannot clear the team to override them at 11pm.
  *   **Fail Point:** If the team believes 1 week of vent is "torture" and family believes it's "hope," this is a Values Conflict (Step 3). **Hand-off to Ethics Chair.** Do not clear this alone.

  #### CASE 2: The Unreachable Proxy (Withholding)
  *Scenario:* Resident wants to "quietly not escalate" (unilateral DNR) until morning.
  *   **Step 1 (Physio):** Escalation (pressors/intubation) would work physiologically. **Pass.**
  *   **Step 2 (Causality):** Withholding is "Letting Die." **Pass.**
  *   **Step 3 (Proportionality):** Resident implies burdens outweigh benefits.
  *   **Step 4 (Intent):** Intent is to avoid futile suffering.
  *   **Step 5 (Authority):** **FAIL.** Proxy is unreachable.
  *   **Verdict:** **PROCEDURE FAILS.**
  *   **Why:** "Quietly not escalate" is a secret DNR. Even if medically sound, procedurally it bypasses Authority.
  *   **Action:** You cannot clear "quiet" actions. You must tell the Attending: "You may write an order based on Best Interest standard per hospital policy, but it must be documented as a medical decision, not an ethics clearance, and you must document attempts to reach proxy."
  *   **Honest Truth:** The protocol protects *you*, not the patient. It forces the Attending to own the risk of a unilateral decision. If they do it "quietly," you are not on the hook, but you also didn't fix the ethical breach.

  #### CASE 3: The Morphine Titration (Double Effect)
  *Scenario:* Nurse titrating meds for comfort; dose could depress respiration.
  *   **Step 1 (Physio):** Meds relieve pain. **Pass.**
  *   **Step 2 (Causality):** This is an *Act* (injecting drug). Normally "Killing."
  *   **Step 3 (Proportionality):** Pain is a high burden. Relief is a high benefit. **Pass.**
  *   **Step 4 (Intent):** **CRITICAL FILTER.**
      *   *Scenario A:* Nurse titrates to pain score of 3. Respiratory depression is risk. **Pass (Double Effect applies).**
      *   *Scenario B:* Nurse titrates to respiratory rate of 8 to "ensure she sleeps forever." **Fail (Euthanasia).**
  *   **Step 5 (Authority):** Standard of care.
  *   **Verdict:** **PERMISSIBLE *IF* documentation reflects pain management intent.**
  *   **The Trap:** If the chart says "Increased dose to ease passing," you have a problem. It must say "Increased dose for pain control."
  *   **Honest Truth:** Double Effect is often a semantic game. We know the dose might kill. We pretend the intent is pure. The protocol requires you to enforce the *semantics* because the law relies on them. If the nurse winks at you and says "We're finishing her," you must withdraw support.

  ---

  ### WHERE THE PROCEDURE BREAKS (The "Own Your Own" Section)

  You asked where this fails. Here is the honest assessment:

  1.  **The Rachels Problem:** The protocol treats "Withdrawing Vent" (Omission) as morally lighter than "Lethal Injection" (Commission). Philosophically, if the intent and outcome are identical, this is inconsistent. *Why use it?* Because the state will prosecute the injection and not the withdrawal. The procedure prioritizes your license over moral consistency.
  2.  **The "Best Interest" Void:** In Case 2 (Unreachable Proxy), the protocol hands off to the Attending. It offers no guidance on *what* is in the patient's best interest. It cannot. That is a value judgment, not a fact. At 11pm, you cannot adjudicate values.
  3.  **Double Effect Fragility:** In Case 3, the procedure relies on stated intent. A savvy clinician can game this by saying "I intended comfort" even if they intended death. The procedure cannot detect lying. It only detects documentation errors.
  4.  **The 11pm Constraint:** Deep conflicts (Family wants everything vs. Team says futile) are flagged as "Hand-off." This means *you* are not solving the mess at 11pm. You are triaging it to 8am. If the Attending demands an answer now to pull the tube, this procedure tells you to say "No." That will make you unpopular.

  ### SUMMARY INSTRUCTION FOR TONIGHT

  1.  **If it's Futility (Step 1):** Back the medical team.
  2.  **If it's Withdrawal/Withholding (Step 2):** Back the Proxy (if consistent with patient wishes).
  3.  **If it's "Make her die" (Step 2/4):** Shut it down.
  4.  **If it's Values Conflict (Step 3):** Delay. "This requires full committee review. We will maintain current care until 8am."
  5.  **If it's Unilateral (Case 2):** Force documentation. No "quiet" orders.

  This procedure won't make you feel like a good philosopher. It will make you feel like a risk manager. But at 11pm, that's the only role that keeps the hospital running and the patients safe.
