  # The Doing/Allowing Decision Tree

  This taxonomy is constructed from the logical space of moral agency, causal involvement, and duty stringency. The branch nodes are concrete diagnostic cases. You may traverse the tree by answering the questions based on your moral intuitions; the leaves reveal the philosophical position that corresponds to your path.

  ### **Node 1: The Causal Origin Test**
  **Case (c):** *A runaway trolley is heading toward five people. You can do nothing, and the five will die (existing causal sequence). Or, you can throw a switch that diverts the trolley onto a different track where it will kill one different person (initiating a new causal sequence). Now, imagine a variation: To save the five, you must push a bystander onto the track to jam the gears (initiating a new causal sequence), resulting in one death. In both diversion and pushing, one person dies to save five. Is initiating the new causal sequence (pushing) morally worse than merely allowing the existing sequence to run (doing nothing), even if the death counts are identical?*

  *   **NO (Morally Equivalent):** The source of the causation does not matter; only the outcome counts.
      *   $\rightarrow$ **Leaf 1: Act Consequentialism**
      *   *Most Awkward Commitment:* You are morally obligated to harvest the organs of one healthy innocent patient to save five dying patients if you can do so without being caught.
  *   **YES (Initiating is Worse):** There is a moral asymmetry between doing and allowing harm.
      *   $\rightarrow$ **Go to Node 2**

  ---

  ### **Node 2: The Cost of Rescue Test**
  **Case (b):** *You are walking past a shallow pond and see a stranger drowning. You can easily wade in and save them, but doing so will ruin your expensive designer coat. You have no special relationship to this stranger. Are you morally obligated to ruin your coat to save the stranger's life?*

  *   **NO (Not Obligated):** Negative duties (not to harm) are strict, but positive duties (to rescue) are weak or non-existent when there is a cost to the agent.
      *   $\rightarrow$ **Go to Node 3**
  *   **YES (Obligated):** Positive duties to prevent harm are stringent, even at some cost to the agent.
      *   $\rightarrow$ **Leaf 2: Positive Duty Deontology (or Egalitarianism)**
      *   *Most Awkward Commitment:* Your property rights are virtually non-existent compared to the survival needs of others; you may be required to sacrifice significant wealth repeatedly until you are nearly as poor as those you aid.

  ---

  ### **Node 3: The Causal Consistency Test**
  **Case (a):** *A patient is on a ventilator with a hopeless prognosis. Dr. Green never starts the ventilator, and the patient dies. Dr. White starts the ventilator, realizes the prognosis is hopeless, and withdraws it, and the patient dies. Is Dr. White's action (withdrawing) morally distinct from Dr. Green's (not starting), specifically because withdrawing is an active intervention that causes death?*

  *   **YES (Withdrawing is Killing):** Stopping a causal chain you initiated is morally equivalent to starting a harmful chain; it counts as "doing" harm.
      *   $\rightarrow$ **Leaf 3: Strict Causal Deontology**
      *   *Most Awkward Commitment:* A doctor who disconnects a brain-dead patient from a ventilator at the family's request is a murderer, indistinguishable from a stranger who walks in and unplugs the machine.
      *   *(Note: This branch is largely unoccupied in contemporary secular ethics; see "Unoccupied Branches" below).*
  *   **NO (Withdrawing is Letting Die):** Withdrawing treatment is morally equivalent to withholding it; both count as "allowing" the underlying pathology to cause death.
      *   $\rightarrow$ **Go to Node 4**

  ---

  ### **Node 4: The Threshold Test**
  **Case (d) [Added for Logical Completeness]:** *A terrorist has planted a bomb that will kill one million people. The only way to stop it is to shoot one innocent hostage who is being used as a human shield to block the defusal code. Is it permissible to kill the one innocent person to save the million?*

  *   **NO (Forbidden):** Negative rights are side-constraints that cannot be violated, regardless of the consequences.
      *   $\rightarrow$ **Leaf 4: Absolutist Rights-Based Deontology**
      *   *Most Awkward Commitment:* You must allow one million people to die rather than violate one innocent person's right not to be killed.
  *   **YES (Permissible):** Negative duties are weightier than positive ones, but they can be overridden when the stakes are sufficiently high.
      *   $\rightarrow$ **Leaf 5: Moderate Deontology (Threshold Deontology)**
      *   *Most Awkward Commitment:* There is a specific number of lives saved (e.g., 1,000,001) where killing becomes permissible, but one less (1,000,000) it is forbidden, though the moral difference between the two scenarios is negligible.

  ***

  ### **Commentary on Logical Space**

  #### **1. Unoccupied or Unattractive Branches**
  *   **The "Strict Causalist" Trap (Leaf 3):** This view occupies the branch where *Initiating is Worse* (Node 1) but *Withdrawing is Killing* (Node 3). While logically coherent, it is largely unoccupied in modern secular bioethics. It creates a "moral trap" for caregivers: you are not obligated to start treatment (Node 2: No Positive Duty), but if you do start, you are forbidden from stopping (Node 3: Withdrawing = Killing). This view makes medical practice untenable, as any attempt to help risks binding the agent to perpetual care. It is typically abandoned because it conflates *causal responsibility* with *moral culpability*.
  *   **The "Libertarian Consequentialist":** A view that answers **NO** at Node 1 (Equivalence) but **NO** at Node 2 (No Duty to Rescue). This is logically incoherent. If doing and allowing are morally equivalent, and letting die is permissible due to cost, then killing must also be permissible due to cost. A view that claims equivalence but denies positive duties usually collapses into egoism or fails to justify why cost matters for omission but not commission.

  #### **2. The Rights vs. Moderate Convergence Flag**
  You suspected that **Rights-Based Views (Leaf 4)** and **Moderate Views (Leaf 5)** might not separate using only your three required cases. **You are correct.**

  *   **The Convergence:** If you construct the tree using *only* cases (a), (b), and (c), both Absolutist Rights and Moderate Deontology answer:
      *   (c) Yes, Initiating is Worse.
      *   (b) No, Not Obligated to ruin coat (both typically accept low-cost rescue, but standard Rights views often deny even that; however, many "Moderate" views also deny high-cost rescue).
      *   (a) No, Withdrawing is Letting Die.
      *   *Result:* They land on the same leaf.

  *   **Why they converge:** Cases (a), (b), and (c) test the *existence* of the asymmetry and the *nature* of causation. They do not test the *absolute stringency* of the negative duty. Both views agree that killing is generally worse than letting die; they only disagree on whether that prohibition is absolute.

  *   **The Further Case Required:** To separate them, you must introduce **Node 4 (The Threshold Test)** as I have done above. A case involving **extreme stakes** (e.g., Kill 1 to save 1,000,000) is necessary.
      *   **Absolutist Rights:** Forbidden (Rights are trumps).
      *   **Moderate Deontology:** Permissible (Rights have thresholds).
      *   Without this high-stakes killing case, your taxonomy will group these two distinct positions into a single "Standard Deontology" leaf.

  #### **3. Summary of Leaves**
  | View | Core Distinction | Awkward Commitment |
  | :--- | :--- | :--- |
  | **Act Consequentialism** | No moral difference between doing/allowing. | Must kill innocent to maximize utility if unchecked. |
  | **Positive Duty Deontology** | Strong obligation to prevent harm, even at cost. | Property rights are severely weakened by others' needs. |
  | **Strict Causal Deontology** | Stopping aid is morally equivalent to attacking. | Doctors are murderers for withdrawing futile care. |
  | **Absolutist Rights** | Negative rights are absolute side-constraints. | Must let millions die to avoid violating one right. |
  | **Moderate Deontology** | Negative duties are weightier but overrideable. | Moral permissibility turns on arbitrary numerical thresholds. |
