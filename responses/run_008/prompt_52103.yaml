      *   *Evidence:* "If B, then 3:1 odds for H." So $P_{new}(H|B) = 0.75$.
      *   *The Puzzle:* What is $P_{new}(R)$?
      *   *Van Fraassen (MRE):* Minimizes information gain. Result: $P_{new}(R)$ drops slightly (to approx 0.4). Counterintuitive because learning about Blue seems to lower confidence in Red without direct evidence.
      *   *Standard Conditionalization:* Requires learning a proposition $E$. What is $E$? "If B then..." isn't a standard proposition in classical logic.
      *   *User's Position:* Imprecise Probabilities (IP). $P_{new}(R) \in [0, 0.5]$ (or some range), constrained only by $P_{new}(H|B) = 0.75$.

  3.  **Anticipate Objections (Brainstorming):**

      *   *Strict Bayesians:* "You can't bet with a set of probabilities. Decision theory breaks. If you can't act, you aren't modeling belief." (High Damage: attacks the practical utility of the thesis).
