answer: |-
  # Workshop Prep Sheet: The Judy Benjamin Problem
  **Thesis:** Rational updating on the Judy Benjamin evidence yields a *set* of credence functions (imprecise probabilities), not a point. The evidence constrains the ratio within Blue territory but leaves the probability of Red underdetermined.

  **Audience Profile:** 12 Strict Bayesians (Conditionalization orthodoxy), 2 Logicians (Stalnaker/Adams semantics), 1 Statistician (MRE/KL-divergence orthodoxy).

  ---

  ## 1. The Action Objection (The Strict Bayesians)
  **Damage Potential:** **Critical.** If belief guides action, and your model forbids action, it fails as a model of belief.

  **How they will ask it:**
  "Judy needs to decide whether to move North (into Red) or South (into Blue). On your view, her credence in Red is a range, say $[0.2, 0.5]$. If a bet pays off only if she's in Red, your model tells her to accept odds of 1:4 and reject odds of 1:3. She is rationally paralyzed. Isn't a theory of rationality that permits paralysis in the face of necessary action simply broken?"

  **Your 2-Minute Reply:**
  "I distinguish between the *credal state* and the *decision rule*. Paralysis is not a bug here; it is the honest representation of evidential scarcity. If the evidence genuinely does not distinguish between a 20% and 50% chance of Red, then rationality *should* hesitate to commit to a precise wager.
  Standard Bayesianism forces a point by smuggling in a tie-breaking preference—often an implicit indifference principle—that the radio message does not support. My model says: when evidence is sparse, your decision rule should reflect that sparseness. We can use E-admissibility or interval dominance to guide action; if those yield no unique act, then rationality does not mandate a unique choice. It is better to admit indecision than to manufacture false precision."

  **Honest Note on Weakness:**
  This reply works for theoretical deliberation but struggles with *forced* choices. If Judy *must* step North or South to avoid freezing, your model offers no prescription. You will need to concede that in forced-choice scenarios, a secondary pragmatic principle (like maximin) is required, which admits that epistemology alone doesn't solve the practical problem.

  ---

  ## 2. The Semantic Objection (The Logicians)
  **Damage Potential:** **High.** If the message *is* a proposition, your underdetermination claim collapses into standard conditionalization.

  **How they will ask it:**
  "You claim there is no proposition to condition on. But in the Stalnaker-Adams tradition, the message 'If Blue, then 3:1 Headquarters' *is* a proposition with truth conditions defined by selection functions. If you identify the learned content correctly as a conditional proposition $A > B$, you can image on it. Why reject the semantic solution to posit a metaphysical underdetermination?"

  **Your 2-Minute Reply:**
  "Because the semantics of conditionals impose structure the evidence lacks. To image on a Stalnaker conditional, you need a similarity ordering over worlds: which Red-worlds are 'closest' to Blue-worlds? The radio message provides no such metric.
  Furthermore, relying on Adams' Thesis leads directly to Lewis's Triviality Results: you cannot equate the probability of a conditional with the conditional probability without collapsing the probability function. By treating the input as a constraint on conditional probabilities rather than a proposition with a truth value, I avoid the triviality trap. The logicians' solution works only if we assume the agent has access to a similarity metric she does not possess."

  **Honest Note on Weakness:**
  The Stalnakerians in the room likely reject Lewis's Triviality as decisive against their semantics. They may argue that a *default* similarity metric is part of the context of communication. You risk looking like you are ignoring the pragmatic context of the radio message.

  ---

  ## 3. The Optimization Objection (The Statistician)
  **Damage Potential:** **Medium.** This attacks the mathematical rigor of your position vs. the "proven" MRE rule.

  **How they will ask it:**
  "Minimum Relative Entropy (MRE) is not just a 'tie-breaker'; it is the unique rule satisfying axioms of consistency, invariance, and sufficiency. To say MRE 'smuggles' assumptions is to ignore the derivation. Why reject a principled, axiomatic projection onto the constraint set in favor of an arbitrary set?"

  **Your 2-Minute Reply:**
  "MRE is indeed the unique solution *if* your goal is to find the distribution closest to the prior in information geometry. But epistemology is not statistics. MRE privileges the prior's structure over the evidence's force. In Judy's case, MRE lowers the probability of Red simply because Red is 'farther' from the constraint in KL-space, not because there is evidence against Red.
  My claim is that rationality requires satisfying the evidence, not minimizing distortion of the prior. The axioms MRE satisfies are axioms of *conservative inference*, not necessarily axioms of *truth-tracking*. When the prior structure is arbitrary (as in a uniform drop), minimizing distance to it grants the prior undue authority."

  **Honest Note on Weakness:**
  The statistician is technically correct that MRE is the standard for frequency updating. Distinguishing "single-case epistemic rationality" from "statistical inference" is a philosophical move that may look like special pleading to a practitioner. You need to hold the line that Judy's case is about *evidence interpretation*, not *parameter estimation*.

  ---

  ## 4. The Question I Most Hope Nobody Asks
  **The Question:**
  "You say the posterior is a set of functions constrained only by the Blue ratio. Does that set include a function where $P(Red) = 0$? If yes, you allow Judy to become certain she is in Blue despite zero evidence against Red. If no, what principle sets the lower bound of the set, and isn't *that* principle just as arbitrary as MRE?"

  **Why it hurts:**
  This exposes the "Arbitrariness of the Bounds" problem. If your set is $[0, 0.5]$, you allow irrational certainty. If you restrict it (e.g., to $[0.25, 0.5]$), you must explain why, which likely requires a principle (like Reflection or Rigidity) that might force a unique point anyway.

  **How to answer if asked:**
  "I concede the lower bound cannot be 0. The set is constrained by the *Reflection Principle*: Judy should not rule out a possibility her prior did not rule out without positive evidence. So $P(Red) > 0$. However, there is a wide gap between 'greater than 0' and the specific value MRE selects (approx 0.4).
  The boundary is not arbitrary; it is determined by the logical space of consistent extensions. Any value within that range is compatible with the evidence. MRE picks one point inside that range and claims it is *the* answer. I am claiming the whole range is the answer. The boundary is the limit of consistency; MRE is a specific coordinate within that limit."

  **Honest Note on Weakness:**
  This is the thinnest part of the armor. Defining the lower bound without invoking a principle that also defines the upper bound (collapsing the set) is difficult. If you invoke "conservatism" to stop the bound at 0, the Statistician will ask why that same conservatism doesn't stop the bound at the MRE point. Be prepared to admit that the *upper* bound is fixed by the prior (0.5) but the *lower* bound is merely non-zero, leaving a large, perhaps uncomfortably large, interval.
