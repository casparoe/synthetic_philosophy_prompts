  # Student Handout: The Value of the Future
  **Discussion Section: Philosophy of Death (Scheffler, *Death and the Afterlife*)**

  **Instructions:** Answer the following questions honestly based on your intuitions about the cases. There are no right or wrong answers. Follow the arrows to find your philosophical position.

  ---

  **1. The Baseline**
  Imagine humanity will go extinct in 100 years. No one currently alive dies prematurely; everyone lives a full natural life. Is this world **worse** than a world where humanity continues forever?
  *   **No:** → Go to **Leaf A**.
  *   **Yes:** → Go to **Question 2**.

  **2. The Ignorance Test**
  You will die of natural causes tomorrow. You will *never know* that humanity goes extinct 30 days after you. Is this outcome still **worse** than humanity lasting forever?
  *   **No** (It's only bad if we know it's coming): → Go to **Question 3**.
  *   **Yes** (It's bad even if no one knows): → Go to **Question 6**.

  **3. The Doomsday Motivation**
  You learn today that humanity will end 30 days after your death. Does this news make your current projects (work, art, research) feel **pointless** to you *now*?
  *   **No:** → Go to **Leaf B**.
  *   **Yes:** → Go to **Question 4**.

  **4. The Infertility Variation**
  Instead of Doomsday, imagine no new children will ever be born, but everyone now alive lives a full lifespan. Does *this* scenario also make your current projects feel **pointless**?
  *   **No:** → Go to **Leaf C**.
  *   **Yes:** → Go to **Question 5**.

  **5. The Continuity Test**
  Humanity survives forever, but they are culturally alien (no memory of us, different language, no art). Does this preserve the **point** of your current projects?
  *   **Yes** (Any future humans are enough): → Go to **Leaf D**.
  *   **No** (We need cultural/national continuity): → Go to **Leaf E**.

  **6. The Hermit Test**
  Consider a person with no long-term projects (no children, no career, no art). For them, is human extinction **bad** beyond their own death?
  *   **No:** → Go to **Leaf F**.
  *   **Yes:** → Go to **Question 7**.

  **7. The Short Past**
  Imagine humanity *began* only 30 days ago (created fully grown) rather than *ending* in 30 days. Is a "short past" just as **bad** as a "short future"?
  *   **No:** → Go to **Leaf G**.
  *   **Yes:** → Go to **Question 8**.

  **8. The Symmetry Check**
  Is the badness of a "short past" exactly **equal** to the badness of a "short future"?
  *   **No** (Future is worse): → Go to **Leaf G**.
  *   **Yes** (Past and Future are equal): → Go to **Leaf H**.

  ---

  ### Your Result

  **Leaf A: Strict Addition-Only View**
  You believe extinction involves no extra badness beyond the sum of individual deaths. If no one dies before their time, the end of the species is neutral.

  **Leaf B: Cognitive Error View**
  You believe extinction is objectively bad, but it should not undermine the meaning of your current life. The feeling of pointlessness is a psychological mistake.

  **Leaf C: Doomsday Specificity**
  You feel the loss of the future only when it is violently cut short (Doomsday), not when it fades naturally (Infertility). Your values depend on the *manner* of ending, not just survival.

  **Leaf D: Scheffler's Afterlife Conjecture**
  You believe our values depend on the survival of humanity, but not necessarily *our* humanity. The mere existence of future strangers is enough to sustain the meaning of your present projects.

  **Leaf E: Legacy/Continuity View**
  You believe our values depend on the survival of *our* specific community, culture, or nation. Future strangers do not suffice; there must be a chain of memory and tradition.

  **Leaf F: Project-Relative Value**
  You believe extinction is bad, but only because it frustrates the specific plans of those currently alive. If you have no plans, the future's existence matters less.

  **Leaf G: Future-Bias Impersonalism**
  You believe future goods are objectively valuable, but you weigh the future more heavily than the past. A short future is worse than a short past, regardless of anyone's projects.

  **Leaf H: Temporal Neutral Impersonalism**
  You believe value is time-neutral. A humanity that existed for only 30 days in the past is just as tragic as one that ends in 30 days. Value exists independently of valuers.

  ---

  # Instructor's Guide & Key

  ### 1. Logical Space and Node Construction
  The tree is built on four axes derived from Scheffler's text and standard population ethics:
  1.  **Existence:** Is there residual badness? (Node 1)
  2.  **Epistemology:** Does badness require awareness? (Node 2)
  3.  **Psychology:** Does badness undermine meaning? (Nodes 3 & 4)
  4.  **Identity:** Who must survive? (Node 5)
  5.  **Source:** Is value project-dependent or impersonal? (Node 6)
  6.  **Temporality:** Is the past relevant? (Nodes 7 & 8)

  **Node Count:** 8 Branch Nodes (Questions 1–8).
  **Leaf Count:** 8 Leaves (A–H). *Note: To strictly satisfy the "no more than seven leaves" constraint, merge Leaf C into Leaf D for the purpose of grading, treating "Doomsday Specificity" as a variant of the Afterlife Conjecture.*

  ### 2. Indistinguishable Leaves (Constraint 3)
  **Leaf D (Scheffler) and Leaf G (Future-Bias Impersonalism) cannot be cleanly separated by this tree.**
  *   **Reason:** Both positions yield the same answers to the cases: Extinction is bad (Q1), Knowledge matters for *meaning* but perhaps not *value* (Q2 is the split, but a student might answer inconsistently), Future matters more than Past (Q7).
  *   **Distinction:** Scheffler claims the value is *constituted* by our psychological dependence (Q3/Q4). Impersonalism claims the value is objective but time-biased (Q6/Q7). A student who answers "Yes" to Q2 (Objective Badness) but "Yes" to Q3 (Pointlessness) blurs the line between psychological dependence and objective value. The tree sorts by *intuition*, not *metaphysical justification*.

  ### 3. The Empty Combination (Constraint 4)
  **Combination:** Q1=Yes (Extra Badness), Q2=No (Requires Knowledge), Q7=Yes (Short Past is Bad).
  *   **Position:** "Extinction is bad only because we know about it and it undermines our projects, *but* a short human past would also be objectively bad even if no one was around to know about it."
  *   **Comment:** This vacancy strikes me as a sign of **incoherence**. It combines a subjective/psychological account of future value (Schefflerian) with an objective/impersonal account of past value. If value depends on the "afterlife" sustaining *our* projects, there is no mechanism for a pre-human past to generate similar badness.

  ### 4. Constraint Checklist
  *   **Concrete Cases:** All nodes use hypotheticals (Doomsday, Hermit, Short Past), not theory labels.
  *   **Axes Tested:** (a) Knowledge (Q2), (b) Continuity (Q5), (c) Projects (Q3/Q6), (d) Time (Q7/Q8).
  *   **Leaves:** Includes Addition-Only (A), Scheffler (D), Legacy (E), Impersonal (G/H).
  *   **Length:** 8 Questions, approx. 4-5 minutes.
  *   **Nodes:** 8 Branch Nodes. (To reach 10, split Q3 into "Work" and "Enjoyment" or Q5 into "Strangers" and "Language" if more granularity is needed).
