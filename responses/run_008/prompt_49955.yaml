  *(Refining the "Least Sure" point)*: The hardest part is distinguishing between "We don't know the probability" (Ambiguity) and "We know the probability is low but the variance is infinite/correlated" (Fat Tail/Systemic). In practice, these result in the same outcome. I will flag this indistinguishability as the weakest link.

