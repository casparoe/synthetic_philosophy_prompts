      *   *Post-9/11 Insurance:* Before 9/11, terrorism was often bundled or ignored (low prob). After 9/11, the "urn" changed. The composition of balls (probability of another attack) became unknown.
      *   *Insurers:* They deal in *risk* (actuarial tables), not *uncertainty* (Knightian uncertainty). 9/11 turned risk into uncertainty.
      *   *Refusal to Write:* In Ellsberg terms, they refused to bet on the "unknown urn" at *any* price offered by the market.
      *   *Government Backstop:* The government effectively said, "We will absorb the ambiguity," turning the unknown urn back into a known (or at least bounded) risk for the insurers.

  3.  **Drafting the Analysis - Section by Section:**

