          *   *The Choice:* Insurers faced a choice: Charge a premium $P$ for coverage. If they treat it as Risk, there exists a $P$ where EV > 0. If they treat it as Ambiguity, they demand a huge ambiguity premium. If the market won't pay that, they exit.
