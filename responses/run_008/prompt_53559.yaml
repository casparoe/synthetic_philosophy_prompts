answer: |-
  Team, I have been thinking about our recent post-mortems and the way we talk during incidents, specifically about how we sometimes argue past each other because we are operating in different modes of explanation without realizing it. You have all noticed that we sometimes dig into memory dumps when we should be checking configuration, or we argue about what a service wants to do when we should be looking at what it is physically doing. I want to formalize a way of navigating this using a framework borrowed from philosophy, specifically Daniel Dennett's three stances, but stripped of the academic baggage and treated strictly as engineering tools. The core idea is that these stances are not truths about what the system is, but tools for prediction, and their validity is determined solely by predictive leverage. A pattern is real only to the extent that treating it as real lets you predict the data better than describing it point by point. I am proposing a procedure for the first thirty minutes of a page that forces us to explicitly select a stance, test its predictions, and switch when it fails. I am highly confident that adopting this vocabulary will reduce our time to mitigation, though I am less confident in the specific thresholds for switching, which I will address later.

  The procedure begins with the physical stance, which is our default mode of tracing actual mechanics. When the page fires, your first question must be whether you can locate the failure in the physical substrate of logs, metrics, or packets. You are asking if there is a broken link, a full disk, or a panic in the stack trace. If you can find a physical cause that explains the symptom, you stay here until mitigation is complete. However, if the physical data is too noisy or complex to yield a clear prediction about where the error will appear next, you must switch to the design stance. This shift happens when looking at the code or the metal stops helping you predict the system's behavior. In the design stance, you ask what the component is for, treating it as a black box designed to fulfill a function. You infer that a database should return queries within a certain latency because that is its design specification. If the system violates its design specification without a physical error, you are now looking at a logic error or a configuration drift. The third step, and the one most often mishandled, is the intentional stance. You adopt this only when the physical and design stances fail to provide predictive leverage. Here you treat the component as a rational agent with beliefs and desires, but only if doing so predicts the data better than the other stances. You might say the load balancer believes the backend is unhealthy and wants to shed traffic. This is warranted only if attributing this belief allows you to predict which requests will be dropped better than looking at the health check logs.

  Let us run this procedure on the cache serving stale entries after a failover. You start with the physical stance, checking network connectivity and process status. If the new cache node is up and connected, the physical stance predicts freshness, but the data shows staleness. The prediction fails, so you switch to the design stance. You ask what the cache is designed to do during failover. The design specifies that it should warm from the replica or invalidate on promotion. If the design says it should invalidate but it hasn't, you have identified a violation of design intent, likely a bug in the failover script. You do not need the intentional stance here. Saying the cache believes the old token is valid adds no predictive power over knowing the invalidation message was dropped. In this case, the procedure tells you to stop looking for agency and fix the replication script. This is straightforward, and I am very confident that the physical and design stances cover ninety percent of our standard infrastructure failures.

  Consider the second case of the rate-limiting heuristic filtering out legitimate users. Here the physical stance shows no errors, and the design stance shows the rate limiter is working as coded. Yet legitimate users are blocked. If you stay in the design stance, you are stuck saying the system is working correctly while users suffer. This is where the procedure requires a switch to the intentional stance, and this is where some of you will resist the answer. The procedure yields that you must treat the heuristic as an agent that believes these users are bots. This is not metaphorical fluff; it is a requirement for prediction. If you treat the heuristic as having a belief model of user behavior, you can predict that changing the user's request pattern will restore access, whereas changing the server config will not. The unpopular answer here is that you must accept the system is acting on a false belief to fix it quickly, rather than insisting it is just code. Admitting the system has a belief allows you to debug the input data feeding that belief. I know this feels unscientific to some of you who prefer to think of code as deterministic machinery, but if treating it as an agent with false beliefs gets you to a workaround ten minutes faster, the stance is justified by the leverage it provides.

  The third case is the intermittent latency spike that resists both mechanical and functional explanation. This is where the team often drifts into anthropomorphizing the system, saying it is being stubborn or hiding something. The procedure demands you test whether this intentional stance offers predictive leverage. If saying the system is being stubborn helps you predict when the spike will end, keep it. If it does not, and you are merely using agent-language to express frustration, the procedure forces you to abandon the intentional stance. This will be an unpopular answer because it removes a cognitive shortcut that feels comforting during high-stress incidents. You will want to say the network is fighting you, but if that statement does not help you select a mitigation action that works better than random chance, you are forbidden from using it in the incident channel. You must return to the physical stance and gather more data or acknowledge ignorance. This is the part of the procedure I am least sure about, because the threshold for predictive leverage is subjective. It is difficult to quantify exactly when a metaphor becomes useful enough to count as a tool, and I worry that engineers might prematurely abandon a useful heuristic because it feels too abstract.

  There are judgment calls dressed up as procedure here, and I need to be explicit about them. The decision to switch from the design stance to the intentional stance relies on your intuition about whether the system's complexity exceeds your ability to model it mechanically. There is no formula for this. You have to feel when the code is too tangled to trace and the behavior looks optimized rather than broken. This is where the procedure has to hand the decision to a person. No algorithm can tell you when to stop looking at the logs and start guessing the system's goals. When you reach this boundary, if the on-call engineer is junior, they must escalate to a senior engineer or the service owner. The senior engineer's role in this framework is not to know the answer but to validate whether the intentional stance is yielding better predictions than the physical one. If the senior engineer agrees that treating the service as an agent is the only way to model its behavior, then you proceed with that assumption. If they disagree, you must return to data collection. This handoff is critical because adopting the intentional stance incorrectly can lead to chasing ghosts rather than bugs.

  I am highly confident in the hierarchy of stances, meaning you should always try the physical before the design, and the design before the intentional. I am also confident that the criterion for keeping a stance is predictive success. If your stance does not help you guess the next log line or the result of a retry, it is wrong. However, I am explicitly uncertain about the switching cost. I do not know how much time you should spend failing with the physical stance before moving to the design stance. If you switch too early, you miss obvious root causes. If you switch too late, you waste time digging into mechanics that don't matter. I am setting a heuristic of fifteen minutes for the physical stance during a severity one incident, but this is a guess. You will need to tune this based on your team's experience. The part I am least sure of is the validation of the intentional stance in the latency case. It is possible that some complex emergent behaviors are best modeled as agent-like even if they aren't, and my restriction might blind you to a valid debugging strategy. I want you to test this procedure during the next few incidents and report back on whether the requirement to justify the intentional stance by predictive leverage slowed you down or focused your efforts. We are building this tool to reduce confusion, not to add philosophical bureaucracy, so if the procedure itself becomes a source of friction during a page, we will revise it. For now, treat these stances as lenses, and when the view is blurry, change the lens rather than staring harder at the glass.
