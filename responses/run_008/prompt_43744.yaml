  There is no single, uncontested theory of truth that recovers all your verdicts without tension. Your intuitions are remarkably sophisticated—they track the distinctions between **inconsistency** (Liar), **underdetermination** (Truth-teller), **indeterminacy** (Open Pair), and **ungroundedness** (Yablo)—but standard theories force trade-offs between them.

  However, the account that comes closest to your "gap" intuitions while offering the resources to explain the "two kinds of neither" is a hybrid of **Kripke's Fixed-Point Theory of Truth** (for the gaps) and **The Revision Theory of Truth** (for the stability distinctions). If forced to choose a single framework to anchor your notebook, **Kripke's Theory (using the Strong Kleene valuation scheme)** is the best baseline, but you will have to modify specific verdicts.

  Here is the precise breakdown of the account, the principles involved, the costs, and the prediction for your whiteboard case.

  ### The Candidate Account: Kripkean Fixed-Point Theory (Strong Kleene)
  **Core Principle:** Truth is a partial predicate. Sentences are constructed in stages. A sentence is **True** if it enters the truth extension at some stage and stays there; **False** if it enters the falsehood extension and stays there; and **Neither (Gap)** if it never settles into either extension (it is "ungrounded").

  #### 1. Mapping Principles to Your Verdicts
  *   **Clause A (Ungroundedness):** Sentences that refer to their own truth value without a "ground" in non-semantic facts fail to receive a truth value.
      *   *Saves:* **Simple Liar** ("Neither"). Since it asserts its own falsehood, it oscillates forever in the construction and never settles.
      *   *Saves:* **Truth-teller** ("Neither"). Since it asserts its own truth, it *can* be true or false, but nothing *forces* it to be so. In the *minimal* fixed point (the standard Kripkean interpretation), it remains ungrounded.
      *   *Saves:* **Yablo's Paradox** ("Neither"). Despite lacking circularity, the infinite dependency chain prevents any sentence in the stack from grounding out, leaving them all ungrounded.
  *   **Clause B (Non-Classical Conditional):** The conditional $A \to B$ is evaluated such that if $A$ is neither true nor false, the conditional does not automatically become true.
      *   *Saves:* **Curry's Sentence** ("Not True"). The derivation that proves the Moon is cheese relies on classical logic (specifically Contraction or Modus Ponens for non-true antecedents). In Strong Kleene logic, if the antecedent ("This sentence is true") is a Gap, the conditional itself becomes a Gap (or False), blocking the explosion to "Moon is cheese."
  *   **Clause C (Symmetry):** Mutually dependent sentences without external grounding share the same status.
      *   *Saves:* **Open Pair** ("Both Neither"). In the minimal fixed point, since neither card has an external anchor, both remain ungrounded.

  #### 2. The Sacrifices: Which Verdicts You Must Give Up
  To maintain this coherent theory, you must revise three of your instincts:

  *   **Sacrifice 1: The Revenge Verdict.**
      *   *Your Instinct:* "This sentence is not true" is 'not true' (but wobbles).
      *   *The Theory's Demand:* You must accept that **"is not true" cannot be consistently defined within the same language as "is true."** If "not true" means "False or Gap," then asserting a sentence is "not true" is a move in the *metalanguage*. If you try to write "This sentence is not true" in the object language, the theory declares it **ill-formed** or simply **Gap** (like the Liar). You cannot have it both ways: you cannot say it is "not true" in a way that makes it accurately describe its own gap-status without generating a new paradox. You must give up the intuition that the sentence successfully describes its own status.
