answer: |-
  **Essay Question**

  **Case:** Suppose a factory stamps out two playing cards, both the Queen of Hearts, from the same sheet on the same day. The cards match exactly in shade of red, shape, and pattern on the face, but each card is a distinct bit of cardboard located somewhere else. Now suppose the factory has a quality-control manual that lists the specifications each card must meet: "red," "symmetrical heart-and-crown pattern," and so on. When an inspector judges that both cards meet the same specification, there is an obvious sense in which one and the same thing — the specification, or the property it encodes — applies to two numerically distinct items. The question is what, if anything, this "one over many" phenomenon commits us to.

  **Prompt:**
  Using the factory case above, evaluate the metaphysical commitments required to explain how two distinct cards can satisfy the *same* specification. Do not merely list historical positions (e.g., "Realism says X, Nominalism says Y"). Instead, construct an argument that addresses the following four tensions inherent in the case:

  1.  **Resemblance:** Can the resemblance nominalist explain the exact match in red shade without tacitly appealing to a shared universal, or is "resemblance" itself a universal in disguise?
  2.  **Regress:** If resemblance is treated as a relation, does this generate a vicious regress (à la Bradley), and what exactly would make such a regress vicious rather than benign?
  3.  **The Manual:** Does the existence of the quality-control manual support predicate or conceptual nominalism (by showing properties are mind-dependent classifications), or does the manual merely track mind-independent sameness?
  4.  **Location:** If one defends immanent realism, how informative is the claim that the universal "redness" is *wholly present* in two spatially distinct cards simultaneously?

  Your essay should clearly distinguish between claims that are widely accepted in the literature and those that remain deeply contested.

  ***

  **Model Answer**

  The factory case vividly instantiates the "one over many" problem: two numerically distinct cards satisfy one identical specification. While it is settled that the cards are distinct particulars, it is deeply contested whether this requires the existence of universals.

  Regarding resemblance nominalism, the view holds that the cards are red simply because they resemble each other, without sharing a universal. However, critics argue this is circular. To say the cards resemble *in respect of redness* presupposes the very property (redness) the theory seeks to eliminate. If the nominalist replies that resemblance is primitive, they face the charge that "primitive resemblance" functions exactly like a universal, merely under a different name. It is contested whether this charge is fatal; some argue that a natural class of resembling particulars is ontologically cheaper than a universal, while others insist the explanatory work is identical.

  This leads to the regress objection. If resemblance is a relation holding between the two cards, does a further relation be required to relate the cards to the resemblance? This is Bradley's Regress. Realists argue this regress is vicious because it defers explanation infinitely, never grounding the sameness of shade. Nominalists often counter that the regress is benign, as each step is logically entailed by the previous one without requiring new ontological commitments. Crucially, there is no consensus on whether the regress is vicious; treating it as a decisive refutation of nominalism misrepresents the current dialectic. The core disagreement is whether relations require further relators to function.

  The quality-control manual complicates predicate and conceptual nominalism. One might argue the manual creates the property "red" by classifying the cards, suggesting properties are mind-dependent. However, the case description notes the cards match in shade *before* inspection. This suggests the manual tracks a mind-independent similarity rather than creating it. If the inspector had classified a blue card as red, they would be mistaken, implying the specification exists independently of the classification. While conceptualists argue that "specifications" are inherently mental, the physical match in shade suggests the ground for the classification is external to the mind. This remains a point of friction: whether the *meaning* of the specification is mental, even if the *basis* is physical.

  Finally, immanent realism posits that the universal "redness" is wholly present in both cards. This explains the sameness directly: it is numerically one entity in two places. However, the theory struggles to explain *how* this is possible without contradiction. To say an entity is "wholly present" in distinct locations is often admitted by realists to be a primitive fact that resists further analysis. While realists claim this is a theoretical virtue (it explains the "one over many" simply), critics argue it is a mystery that merely labels the problem. There is no settled account of multi-location; it is a brute posit of the theory.

  In conclusion, the factory case does not decisively favor one position. Resemblance nominalism risks circularity but avoids mysterious multi-located entities. Realism explains sameness directly but posits ontologically strange universals. The manual suggests mind-independence but relies on human classification. The choice between them depends on whether one prioritizes ontological parsimony (favoring nominalism) or explanatory directness (favoring realism), a trade-off that remains unresolved in contemporary metaphysics.

  ***

  **Marking Scheme (Total 20 Marks)**

  **1. Resemblance & Circularity (5 Marks)**
  *   **A (4-5 marks):** Identifies the specific circularity charge (presupposing the respect of resemblance). Explicitly notes that whether this is fatal is *contested* (e.g., primitive resemblance vs. universal in disguise).
  *   **B (2-3 marks):** States that nominalists use resemblance and realists call it circular. Treats the circularity charge as a proven fact rather than a point of debate.
  *   **C (0-1 mark):** Merely defines resemblance nominalism without applying it to the cards' shade.

  **2. Regress & Viciousness (5 Marks)**
  *   **A (4-5 marks):** Explains *what* the regress is (relation needing a relator). Crucially, distinguishes between the regress occurring and the regress being *vicious*. Acknowledges that the viciousness is the contested premise, not the regress itself.
  *   **B (2-3 marks):** Describes Bradley's Regress but asserts it definitively refutes nominalism. Fails to mention the benign/vicious distinction.
  *   **C (0-1 mark):** Mentions "infinite regress" vaguely without explaining the structural problem.

  **3. The Manual & Mind-Dependence (5 Marks)**
  *   **A (4-5 marks):** Uses the case details (cards match *before* inspection) to argue the manual likely tracks rather than creates. Acknowledges the conceptualist counter (specifications are mental) as a live option, not a refuted one.
  *   **B (2-3 marks):** Argues the manual proves properties are mind-dependent (or independent) without engaging the counter-evidence in the prompt. Treats the status of the manual as settled.
  *   **C (0-1 mark):** Ignores the manual or treats it as irrelevant background flavor.

  **4. Realism & Multi-Location (5 Marks)**
  *   **A (4-5 marks):** Explains the "wholly present" claim. Critically notes that realists often treat this as primitive/uninformative. Flags the "mystery" of multi-location as a recognized cost of the view, not a solved problem.
  *   **B (2-3 marks):** States that realism explains the case because universals are shared. Presents "wholly present" as a clear explanation without acknowledging the metaphysical difficulty or lack of consensus.
  *   **C (0-1 mark):** Defines realism without addressing the spatial tension of the two cards.

  **Grading Note:** To achieve an A grade (16+ marks), the essay must consistently flag contested claims as contested (e.g., "Realists argue..." vs. "It is true that..."). Essays that present dialectical stalemates as settled facts cannot score higher than a B, regardless of writing quality.
