answer: |-
  Here is my verdict.

  **The Verdict**
  The discipline of economic history is **methodologically consistent**, but only under a specific interpretation of its causal claims that most practitioners do not explicitly articulate. It does **not** require Modal Realism (à la David Lewis); in fact, Modal Realism would be destructive to historical inquiry. The discipline strictly needs an **Actualist, Epistemic view of Modality grounded in Structural Causal Models**. The line between licit explanatory counterfactuals and illicit narrative counterfactuals is **principled**, not merely aesthetic, though it is often defended with muddled philosophy.

  Here is the defense of this position.

  ### 1. The Consistency of Causal Claims
  You are correct that causal claims are counterfactual claims. To assert "The Blockade caused the Famine" is to assert "Had the Blockade not occurred, the Famine would not have occurred (or would have been significantly mitigated)." Therefore, the taboo on counterfactuals cannot be a taboo on counterfactual *reasoning*.

  The discipline is consistent because the taboo is not on counterfactuals *simpliciter*, but on **unconstrained narrative extrapolation**. Economic history operates within the **Potential Outcomes Framework** (Neyman-Rubin), which is the dominant metaphysical and statistical ontology of modern social science. In this framework, a counterfactual is not a story about a different world; it is a **missing data point** in the actual world.

  When a cliometrician asserts a causal claim, they are asserting that they have constructed a valid estimator for that missing data point using evidence from the actual world (e.g., instrumental variables, difference-in-differences, natural experiments). When a journalist or novelist writes "What if Napoleon had won?", they are constructing a narrative without an estimator, relying on intuition rather than structural identification.

  The discipline is internally consistent because its prohibition targets **identification failure**, not counterfactual logic. It demands that any claim about a non-actual event be backed by a model of the actual event's structural parameters.

  ### 2. The Required View of Modality: Actualism, Not Realism
  You ask whether the discipline requires Modal Realism. My verdict is a definitive **no**.

  David Lewis's Modal Realism posits that possible worlds are concrete entities just as real as the actual world. If economic history presupposed this, then "Napoleon winning at Waterloo" would be a fact about a concrete world $W_2$, just as "Napoleon losing" is a fact about $W_1$. This would render historical causation trivial. If all possibilities are equally real, "causation" loses its asymmetry and its explanatory power. We would not be explaining why *this* world happened, but merely indexing which world we inhabit.

  Economic history strictly needs **Actualism**. This is the view that only the actual world exists, and "possibility" is a property of propositions describing ways the actual world's structures could have been differently instantiated.

  Specifically, the discipline relies on **Combinatorial Actualism**: possibilities are recombinations of actual elements constrained by actual laws (economic, physical, social).
  *   **Licit Counterfactual:** "If the Bank of England had raised rates by 1% (a recombination of actual policy levers), inflation would have dropped." This stays within the structural constraints of the actual monetary system.
  *   **Illicit Counterfactual:** "If Napoleon had had laser cannons." This violates the structural constraints of the actual world.

  The discipline requires a view where modality is **epistemic and structural**, not ontological. We are not discovering facts about other worlds; we are testing the robustness of causal mechanisms in *this* world. The "truth" of a counterfactual in economic history is not a correspondence to a parallel reality, but a measure of the **stability of a causal mechanism** under perturbation.

  ### 3. The Principled Line: Minimal Rewrites vs. Miracle Stories
  Is the line between licit and illicit counterfactuals principled? **Yes.** It is defined by Max Weber's criterion of **"minimal rewrite"** (or *nomological possibility*), formalized in modern terms as **ceteris paribus** constraints within a Structural Causal Model (SCM).

  *   **Licit (Embedded Counterfactuals):** These isolate a single variable (or a tight cluster) within a validated structural model. They hold the "deep structure" of history (technology, demographics, preferences, institutions) constant while varying the specific cause. This is the logic of the "natural experiment." It is licit because the variance is supported by observed data elsewhere in the actual record (e.g., other countries, other time periods).
  *   **Illicit (Narrative Counterfactuals):** These often require "miracles" to sustain the alternative timeline. To make "Napoleon wins" a coherent narrative, you must alter not just the battle outcome, but the logistics, the politics, the technology, and the psychology that led to the battle as it was. This cascades into changing the deep structure. Once you change the deep structure, you are no longer analyzing *history*; you are analyzing *fiction*.

  The taboo exists because narrative counterfactuals inevitably violate the **ceteris paribus** clause. They change too many background conditions to isolate a causal effect. Economic history journals reject them not because they are "about the non-actual," but because they are **unidentifiable**. There is no data in the actual world that can constrain the parameters of a world where the South won the Civil War *and* retained its industrial trajectory *and* avoided British intervention.

  ### 4. Why the Confusion Persists
  If the position is consistent, why does it bother you? Because the discipline often speaks in the language of **Humean Regularity** (positivism) while practicing **Counterfactual Dependence**.

  Historians are trained to say "We only study what happened," which sounds like a metaphysical denial of possibility. But when they publish, they say "X caused Y," which is a metaphysical affirmation of possibility. This rhetorical dissonance creates the feeling of hypocrisy.

  However, this is a rhetorical shield, not a methodological flaw. It is a defense against the charge of speculation. By claiming to study "only facts," they protect the epistemic rigor of their counterfactual inferences. They are effectively saying: "We only assert counterfactuals that are so tightly bound to actual evidence that they function as facts."

  ### Conclusion
  Your discipline is not hypocritical, but it is philosophically taciturn.

  1.  **Consistency:** The commitments are consistent **if and only if** you interpret causal claims as assertions about structural stability within the actual world, rather than descriptions of alternative realities.
  2.  **Modality:** The discipline strictly needs **Actualist Epistemic Modality**. It treats possibility as a function of our knowledge of constraints in the actual world. It must reject Modal Realism, as Lewis's ontology dissolves the specific explanatory weight of historical causation.
  3.  **The Line:** The distinction is principled. It rests on **identification**. Licit counterfactuals are identified by actual data (via models); illicit counterfactuals are under-identified speculation.

  The taboo is not against the *metaphysics* of the non-actual; it is against the *econometrics* of the unidentifiable. You are trained to avoid speculating about what didn't happen because, without a structural model, you have no leverage to estimate it. With a model, you are not speculating; you are estimating. That is the only difference that matters.
