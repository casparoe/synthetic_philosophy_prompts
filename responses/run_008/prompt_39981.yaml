      This protocol prioritizes the East-West comparison (Q3) and correlation timing (Q2) to catch rationalist oversimplification. It forces authors to distinguish between "X happened" and "X mattered." It presupposes "Fall" is real (Q1), requiring Editor intervention for transformationist pieces. Use the Referee only for verifying specific data points in manuscripts that pass Q1–Q4. Do not waste referee time on lead theories.

