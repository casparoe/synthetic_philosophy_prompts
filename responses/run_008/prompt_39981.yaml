      **Q1: Is the Explanandum Fixed?**
      *Question:* Does the author specify what "fell"? (e.g., 476 CE imperial deposition, Western administrative collapse, economic contraction, or social transformation?)
      *Sufficient Answer:* Explicit definition matching the magazine's "Decline" remit (usually 4th–5th century Western administrative failure).
      *Reject:* If the author argues "Nothing fell" without acknowledging the magazine's premise (Editor Judgment).
      *Handoff:* If the definition is ambiguous, return to author. If defined as "Eastern survival," proceed.
      *Note:* A transformationist thesis passes only if the Editor accepts "transformation" as "fall."

      **Q2: Presence vs. Impact (Correlation)**
      *Question:* Is the proposed cause (X) unique to the period/region of decline?
      *Sufficient Answer:* Data showing X spikes precisely during the decline window (300–476 CE) and is absent/low in stable periods (100–200 CE).
      *Reject:* If X was present during the *Pax Romana* (e.g., lead plumbing existed in 100 CE). Correlation is necessary for causation.
      *Handoff:* Referee verifies dating of X.

      **Q3: The East–West Natural Experiment**
      *Question:* Did the Eastern Empire share exposure to X?
      *Sufficient Answer:* Yes, but author explains why East survived (e.g., "East had wealth buffers"). No, and X is unique to West.
      *Reject:* If East had X (e.g., plague, drought, lead) and survived centuries longer without a plausible institutional explanation. This is the strongest filter for monocausal errors.
      *Handoff:* Referee checks comparative history claims.

