      *   **Q4 (Monocause):** **Fail.** The manuscript states climate "made the Fall inevitable" regardless of policy. It ignores tax base erosion or barbarian federate policies.
      *   **Verdict:** **Reject (with option for Rewrite).** While Q2 passes, Q3 and Q4 reveal the monocausal trap. The climate data is real, but the argument that it *alone* determined the outcome ignores the East's survival.
      *   **Honest Assessment:** I find the climate argument attractive, but this screen correctly flags it. To publish, the author must reframe climate as a *stressor* that interacted with fiscal fragility (Q4 fix) and explain Eastern resilience (Q3 fix). If they refuse, it fails the "monocausal certainty" filter. Send to Referee only if rewritten to acknowledge multi-causality.

