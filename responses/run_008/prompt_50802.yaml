prompt: |-
  After a long argument with a friend last night, I want a proper audit of the analogy she was leaning on the whole evening. Her claim: our greenhouse emissions are like a loan taken out in our grandchildren's name. We consume the principal (cheap energy, growth, infrastructure); they inherit the repayment schedule (adaptation costs, lost cropland, relocation); and since they never signed anything, we stand to a non-consenting creditor as a debtor does, so anything short of aggressive decarbonization plus adaptation finance amounts to default. She added a wrinkle I hadn't heard before: the loan compounds, because delay adds interest in the form of cumulative warming, so procrastination is not neutral deferment but continued borrowing at increasing rates. My counter was that the mapping breaks at the creditor: the people harmed by our emissions would not exist had we not emitted — the very consumption that burdens them also brings them into being — so there is no determinate victim holding the IOU; and debts transfer to specific persons, whereas climate harms land on whoever happens to be alive in 2100. She said that was a technicality, and I said it was the whole argument, and we went home.

  Give me the correspondence table with four columns: element of the loan (principal, interest, debtor, creditor, contract, default, collection), its climate counterpart, whether the mapping holds or breaks, and whether the break is load-bearing for her conclusion (yes/no). Then the disanalogies not already in the table, sorted into those that matter for her repayment conclusion and those that do not, and a verdict on whether the conclusion survives once the non-identity and no-determinate-creditor problems are on the table — or whether they sink the analogy outright. If some financial picture fits better than the loan (an insurance pool, an inheritance, a joint account we share with the future), say which and whether it licenses a weaker, stronger, or different obligation. Finish with a JSON object: {verdict: one of "analogy survives", "survives damaged", "fails", load_bearing_disanalogy: string, better_analogue: string, revised_conclusion: string}.
