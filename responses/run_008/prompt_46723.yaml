      *(Wait, one more check)*: The prompt asks for "a concrete test, argument, or case that both sides would agree bears on it." I need to make sure the Friend agrees that the test is relevant. Opening archives is relevant to both. Comparing narrative structures is relevant to both.

      *(Final check on constraints)*: "Neither of us has any academic background... keep the language plain." Avoid terms like "ontological," "epistemological," "historiography." Use "nature of the past," "how we know," "history writing."

