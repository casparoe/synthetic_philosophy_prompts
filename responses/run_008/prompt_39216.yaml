          *   *Fit:* Hyperparameter tuning / Neural Architecture Search (NAS).
          *   *Distortion:* ML usually assumes fixed hypothesis space. This move changes the space.
          *   *Missing:* The distinction between *parameters* and *structure*.

      *   **Hidden Assumptions in ML Vocabulary:**
          *   *Fixed Distribution:* ML assumes i.i.d. data from $P_{data}$. Science often deals with singular events (Mercury is unique).
          *   *Tuning:* ML assumes explicit optimization. Scientists don't "gradient descend" on theories consciously.
