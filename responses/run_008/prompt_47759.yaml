answer: |-
  **The Tyranny of the Present: Why Pure Time Preference Fails in Public Policy**

  The decomposition of the social discount rate is one of the most technical yet morally loaded exercises in climate economics. As your professor outlined, the Ramsey equation breaks discounting down into three components: a growth term (future people will be richer, so marginal utility of consumption is lower), a risk term (catastrophe might wipe out the benefit), and the controversial residual: pure time preference (PTP). PTP discounts future welfare simply because it occurs later in time. To many ethicists, PTP is "ethically indefensible," a phrase coined by Frank Ramsey himself, who called it a "practice which is ethically indefensible and arises merely from the weakness of the imagination." Yet, as your friend pointed out, this moral certainty wobbles when we look at how we live our private lives. We all discount our own futures. If I am willing to endure a headache today to avoid a worse one next year, I am exhibiting time preference. If my future self is, as Parfitian reductionism suggests, merely a psychologically connected stranger, then my prudence is just a localized form of altruism toward a specific other.

  This creates a paradox: if discounting the future is rational for individuals, why is it immoral for governments? Does the distinction between private prudence and public policy hold, or is the moralist's objection to PTP indeed a fraud? While the friend's parity argument exposes a genuine tension in how we view personal identity, it ultimately conflates *sovereignty* with *impartiality*. Pure time preference may be a permissible feature of individual psychology, but it is ethically indefensible in public policy, particularly regarding climate change. The state acts as a trustee for all citizens across time, and unlike an individual, a trustee cannot arbitrarily privilege the present over the future.

  To understand the stakes, we must first grasp the standard objection to PTP. The argument, championed by Henry Sidgwick and later Nicholas Stern, rests on the principle of impartiality. Morality requires us to treat equal interests equally. If a person in 2024 suffers a unit of pain, and a person in 2124 suffers an identical unit of pain, the temporal distance between them is morally irrelevant. To discount the 2124 pain simply because it is later is to discriminate based on "date of birth." As you noted, this is analogous to discounting the interests of people born in March, or people living in a different zip code. If we accept a positive PTP in social policy, we are effectively saying that the welfare of future generations counts for less than ours, simply by virtue of being born later. In the context of climate change, where costs are borne now and benefits accrue centuries later, even a small PTP (say, 1%) can mathematically justify doing almost nothing to prevent catastrophic warming, because the future benefits of mitigation are discounted to near-zero present value.

  Your friend's argument attempts to dismantle this by attacking the distinction between "self" and "other." Drawing on Derek Parfit's *Reasons and Persons*, the argument suggests that personal identity is not a deep, further fact but a matter of degree based on psychological connectedness (memories, intentions, character). Since connectedness fades over time, "Future-Me" is less connected to "Present-Me" than "Present-Me" is to himself. Therefore, when I discount Future-Me's headache, I am discounting the welfare of someone who is, in a deep sense, another person. If it is rational for me to prioritize Present-Me over Future-Me, why is it irrational for Present-Us to prioritize ourselves over Future-Them? The friend concludes that the moralist's prohibition on PTP is inconsistent: either we must be radically altruistic to our future selves (which seems demanding and unnatural), or we must admit that discounting others by temporal distance is permissible.

  This is a clever parity argument, but it proves too much by confusing *rationality* with *morality*, and *ownership* with *trusteeship*.

  First, consider the nature of the intrapersonal case. It is true that individuals exhibit positive time preference. However, this is often descriptive, not normative. Just because humans *do* discount the future doesn't mean they *ought* to. More importantly, individuals have sovereignty over their own lives. I am permitted to sacrifice my future welfare for present pleasure because I own the consequences. If I choose to smoke today despite the cancer risk tomorrow, I am harming myself, but I am violating no one's rights. The relationship between Present-Me and Future-Me is one of authorship; I am the causal agent shaping that future. Even if Future-Me is a "stranger," he is a stranger to whom I have a unique, special obligation that I do not have to the rest of humanity. Prudence is a specific duty to the specific "other" who inherits your life.

  This distinction collapses when we move from the individual to the state. A government is not a sovereign owner of its citizens' welfare; it is a fiduciary. In climate policy, the state is making decisions that bind people who cannot consent, cannot vote, and cannot lobby. If a private individual chooses to discount their own future, they are trading off their own assets. If a government applies PTP, it is trading off the assets of *other people* (future citizens) for the benefit of *current people*. This violates the requirement of impartiality that underpins liberal democracy. The "birth month" analogy holds firm here: a government cannot favor citizens born in January over citizens born in December. Similarly, it cannot favor citizens born in 2024 over citizens born in 2124. The friend's argument works for the individual because the individual has a special prerogative to favor themselves; the state has no such prerogative to favor the present generation.

  Furthermore, the friend's reliance on psychological connectedness to justify discounting leads to absurd conclusions if applied consistently. If discounting is justified by weak psychological connections, then the state should discount the welfare of current citizens who are cognitively impaired, asleep, or simply less "connected" to the national psyche. We reject this because we believe welfare has objective value regardless of who experiences it. The moral weight of a unit of suffering does not diminish because the sufferer is temporally distant, just as it does not diminish because the sufferer is spatially distant.

  Finally, we must address whether the other two components of the discount rate—growth and risk—can do the heavy lifting without PTP. The answer is yes, and this renders PTP redundant and dangerous. The growth term (often denoted as $\eta \times g$) accounts for the fact that if future generations are wealthier, an extra dollar provides them less utility. This justifies discounting *consumption*, but not *welfare*. If climate change makes the future poorer (by destroying ecosystems and infrastructure), the growth term might actually reverse, implying we should invest *more* now because future marginal utility will be higher. The risk term accounts for the probability that humanity might go extinct or the policy might fail. This is a probability discount, not a time discount. If there is a 1% chance humanity exists in 2150, we discount the benefit by 1%, not because it is 2150, but because it might not happen.

  Once we account for diminishing marginal utility and existential risk, adding a "pure" time preference is double-counting. It imposes an additional penalty on the future solely for being the future. In climate ethics, this is catastrophic. The costs of mitigation are certain and immediate; the benefits are uncertain and distant. A positive PTP stacks the deck against the future by treating their potential existence as inherently less valuable.

  Therefore, the verdict must be clear: Pure time preference is legitimate nowhere in moral reasoning, though it is inevitable in psychological description. For the individual, it is a permissible exercise of sovereignty to prioritize the vivid present over the abstract future, provided one accepts the consequences. But for public policy, and specifically for climate ethics, PTP must be set to zero. The friend's parity argument fails because it attempts to derive a public moral obligation from a private psychological fact. It ignores that the state's duty is impartiality, not prudence. We are not saving the climate for "our" future selves; we are saving it for *them*. To discount their lives because they are not yet here is not rational prudence; it is tyranny by the present. The growth and risk terms provide all the economic justification needed for discounting; anything more is merely the weakness of imagination Ramsey warned us about, codified into policy.
