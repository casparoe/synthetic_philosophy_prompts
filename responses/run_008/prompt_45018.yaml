answer: |-
  ### The Logical Cuts
  Before you answer, know that each question isolates a specific "load-bearing cut" in egalitarian theory. We aren't testing your kindness; we're testing your consistency on *what counts* as an inequality that justice must fix.

  *   **Q1 (The Surfer):** Tests **Responsibility for Lifestyle**. Does justice compensate for choices about how to live, or only for circumstances?
  *   **Q2 (The Gambler):** Tests **Option Luck vs. Brute Luck**. If you take a risk and lose, is that society's problem or yours?
  *   **Q3 (Champagne, Voluntary):** Tests **Currency: Welfare vs. Resources**. Should we equalize happiness (which costs some people more) or the means to pursue it?
  *   **Q4 (Champagne, Involuntary):** Tests **Responsibility for Preferences**. If you can't help having expensive tastes, does that change the answer to Q3?
  *   **Q5 (The Contented Worker):** Tests **Adaptive Preferences**. If someone is happy with less because they were taught to expect less, is that a problem?
  *   **Q6 (The Wheelchair User):** Tests **Conversion Factors**. If two people have the same money but one gets less freedom out of it due to biology, is that unequal?
  *   **Q7 (The Jealousy Pill):** Tests **Functioning vs. Agency**. (Invented Case). If you voluntarily lower your own human functioning to feel better, does justice owe you compensation for the loss?
  *   **Q8 (The Gap vs. The Floor):** Tests **Equality vs. Sufficiency**. Does it matter how rich the rich are, or only that the poor have enough?
  *   **Q9 (The Boss and the Servant):** Tests **Distributive vs. Relational**. If everyone has the same money, but some treat others as inferiors, is equality achieved?

  ***

  ### The Quiz: Which Egalitarian Are You, Actually?

  **1. The Surfer**
  Alex and Jordan have the same job skills and could earn the same salary. Alex works 50 hours a week to buy a nice house and gadgets. Jordan works 20 hours a week to surf, lives in a van, and has very little money. Jordan complains that this isn't fair. Should the government tax Alex to give Jordan more money so they have equal incomes?
  *   **A.** Yes. Equality of income is the goal, regardless of why Jordan has less.
  *   **B.** No. Jordan chose leisure over income; Alex shouldn't pay for Jordan's lifestyle.
  *   **C.** Only if Jordan's van life falls below a basic minimum standard of living.

  **2. The Gambler**
  Taylor and Morgan both earn $50,000. Morgan saves safely. Taylor bets her entire savings on a coin flip, loses, and ends up with $0. She asks for a bailout to get back to where Morgan is. Should she get it?
  *   **A.** Yes. A just society doesn't let citizens end up destitute due to bad luck, even if they took the risk.
  *   **B.** No. She knew the odds. Compensating her punishes Morgan for being careful.
  *   **C.** Give her enough to survive, but not enough to match Morgan's savings.

  **3. The Champagne Lover (Voluntary)**
  Sam and Casey have equal income. Sam is easily satisfied with beer and pizza. Casey has cultivated a refined palate and is only truly happy with expensive champagne and truffles. Casey is less happy than Sam. Should Casey get extra money to make her happiness equal to Sam's?
  *   **A.** Yes. Justice is about making people equally happy (welfare).
  *   **B.** No. They have equal resources; Casey's tastes are her own responsibility.
  *   **C.** No, but we should check if Casey feels pressured to have expensive tastes by social status.

  **4. The Champagne Lover (Involuntary)**
  Same as above, but Casey didn't cultivate these tastes. She has a rare metabolism where cheap food makes her physically ill, and she desperately wishes she could be like Sam but can't. Should Casey get extra money?
  *   **A.** Yes. This is a biological need, not a choice.
  *   **B.** No. It's still about her internal satisfaction, which we shouldn't subsidize.
  *   **C.** Yes, but only enough to cover the medical cost of the special diet, not the "luxury" aspect.

  **5. The Contented Worker**
  Robin works in a dangerous factory with low pay. When asked, Robin says, "I'm perfectly content, I don't deserve more." You suspect Robin only says this because their family has worked there for generations and they can't imagine anything else. Should the government improve Robin's conditions anyway?
  *   **A.** No. Robin says they are happy; who are we to say they aren't?
  *   **B.** Yes. Robin's preferences were shaped by oppression; we should look at their actual freedoms, not just their feelings.
  *   **C.** Yes, but only if Robin's health is physically at risk.

  **6. The Wheelchair User**
  Two people have the same income. One can walk; the other uses a wheelchair. The city has many stairs and no ramps. The wheelchair user has much less freedom to move around town despite having the same money. Should the city spend extra tax money on ramps for the wheelchair user, even if it costs more than the average person's transport budget?
  *   **A.** No. They have equal money; buying ramps for one person gives them more "stuff" than others.
  *   **B.** Yes. Money isn't the point; the ability to get around (capability) is what should be equal.
  *   **C.** Yes, but only if the ramps benefit everyone (e.g., parents with strollers) too.

  **7. The Jealousy Pill (Invented Case)**
  *Note: This case tests if we value "functioning" itself, or your right to choose your functioning.*
  Pat is crippled by jealousy. It ruins their life. Pat voluntarily takes a pill that cures the jealousy but permanently dulls their sense of taste and touch. Pat is happier but has less sensory functioning. Should society compensate Pat for the loss of sensation?
  *   **A.** Yes. A just society aims for high human functioning; Pat has lessened their capabilities.
  *   **B.** No. Pat made a voluntary trade to improve their life; respect their agency.
  *   **C.** No, unless the pill had dangerous side effects for others.

  **8. The Gap vs. The Floor**
  In Society A, the poorest have $30k and the richest have $300k. In Society B, the poorest have $40k and the richest have $1,000,000. Which is more just?
  *   **A.** Society A. The gap is smaller, which means less hierarchy.
  *   **B.** Society B. The poor are better off, even if the rich are way richer.
  *   **C.** It depends on how the rich got their money.

  **9. The Boss and the Servant**
  In a company, the CEO and the janitor are paid exactly the same. However, the CEO is expected to give orders and the janitor is expected to obey, and the CEO speaks condescendingly to the janitor in meetings. Is there an inequality of justice here?
  *   **A.** No. They have equal pay; the work relationship is functional.
  *   **B.** Yes. They are not relating as social equals; the status hierarchy is the injustice.
  *   **C.** Yes, but only if the janitor is paid less than a living wage.

  ***

  ### Scoring Key: Map Your Answers

  *Note: Political theories are complex. You likely won't fit perfectly into one box. Look for the cluster that matches your strongest intuitions.*

  #### 1. The Welfare Egalitarian (Hedonic or Preference)
  *   **Signature Answers:** Q1(A), Q3(A), Q5(A).
  *   **The View:** Justice is about equalizing well-being (happiness or preference satisfaction).
  *   **The Tell:** You think the Champagne Lover (Q3) and the Contented Worker (Q5) should be judged by how they *feel*, not what they have.
  *   **Limitation:** This view struggles with Q7 (Jealousy Pill). If Pat is happier, Welfare Egalitarianism says Pat is *better off*, so no compensation is due, even if Pat has less human functioning.

  #### 2. The Luck Egalitarian (Dworkin/Cohen style)
  *   **Signature Answers:** Q1(B), Q2(B), Q4(A), Q6(B).
  *   **The View:** Inequalities due to brute luck (biology, accidents) should be compensated; inequalities due to option luck (choices, gambles) should not.
  *   **The Tell:** You distinguish sharply between the Surfer (choice, no pay) and the Wheelchair User (biology, extra pay). You likely said No to the Gambler (Q2).
  *   **Limitation:** This view often collapses into Resource Egalitarianism on Q3. It also struggles with Q9; Luck Egalitarianism is distributive, so it might miss the relational hierarchy if pay is equal.

  #### 3. The Resource / Primary Goods Egalitarian (Rawls/Dworkin)
  *   **Signature Answers:** Q1(B), Q3(B), Q6(A or C), Q8(B).
  *   **The View:** Justice is about distributing all-purpose means (money, rights, liberties), not guaranteeing equal outcomes or happiness.
  *   **The Tell:** You rejected compensating the Champagne Lover (Q3) because they have the same *means* as everyone else. You prioritize the "Floor" (Q8) over the "Gap."
  *   **Limitation:** Hard to distinguish from Luck Egalitarianism on paper. The main split is Q6: Rawlsians (Primary Goods) might say "No" to extra ramps if the bundle of goods is equal; Capabilities theorists say "Yes."

  #### 4. The Capabilities Approach (Sen/Nussbaum)
  *   **Signature Answers:** Q5(B), Q6(B), Q7(A).
  *   **The View:** Justice is about what people are actually able to *do and be* (functionings), not just resources or happiness.
  *   **The Tell:** You said the Contented Worker (Q5) needs help despite being happy, and the Wheelchair User (Q6) needs extra resources to achieve equal freedom.
  *   **Limitation:** This view is ambiguous on Q1 (The Surfer). Does "capability to work" matter if you choose not to? Most Capabilities theorists lean toward protecting the freedom, not subsidizing the choice.

  #### 5. The Sufficientarian / Prioritarian
  *   **Signature Answers:** Q1(C), Q2(C), Q8(B).
  *   **The View:** Equality itself isn't the goal; ensuring everyone has *enough* is. Or: benefiting the worse off matters more than closing the gap.
  *   **The Tell:** You care about the Gambler starving (Q2), but not about them matching the saver's wealth. You prefer Society B in Q8 because the poor are better off.
  *   **Limitation:** This is a non-egalitarian leaf. If you chose this, you might not be an egalitarian at all, but a humanitarian.

  #### 6. The Relational Egalitarian (Anderson/Scheffler)
  *   **Signature Answers:** Q9(B) is the dealbreaker.
  *   **The View:** Equality is about social status, not distribution. We must relate as peers, not masters and servants.
  *   **The Tell:** You might have been inconsistent on the money questions, but Q9 lit a fire under you. You think hierarchy is the problem, not the paycheck.
  *   **Limitation:** **Honesty Check:** This quiz is mostly distributive (about stuff). Relational Egalitarianism is hard to score here because you can believe in equal status but disagree on taxes. If Q9 was your only strong conviction, you are likely Relational.

  ### Incoherent Combinations
  *   **The "Choice-Blind" Egalitarian:** If you answered **Q1(A)** (Compensate Surfer) but **Q2(B)** (Don't Compensate Gambler), your view is unstable. Both involve voluntary choices leading to lower income. Unless you can explain why surfing is "necessary" and gambling is "frivolous," you are applying the responsibility principle inconsistently.
  *   **The "Paternalist Welfare" View:** If you answered **Q3(A)** (Compensate Expensive Tastes) but **Q5(B)** (Override Contented Worker), you believe we should satisfy preferences when they are expensive, but ignore them when they are adaptive. This is a defensible position (Sen's view), but it requires you to admit you don't actually trust people's own reports of their welfare.

  ### A Note on Rawls vs. Dworkin
  You asked if we can separate Primary Goods (Rawls) from Resources (Dworkin). **Honestly? Not really with this quiz.** Both reject compensating for expensive tastes (Q3) and both focus on means rather than ends. The split usually happens in the *justification* (social contract vs. envy test), not the *outcome* on these specific cases. If you scored as a Resource Egalitarian, you could be either.

  ### A Note on Relational Egalitarianism
  As suspected, Q9 is the only true filter for Relational Egalitarianism. The other questions assume equality is about *distribution*. If you think equality is about *status*, questions 1–8 might feel like category errors to you. If Q9 felt like the "real" question, ignore your score on the rest; you're a Relational Egalitarian trying to take a distributive test.
