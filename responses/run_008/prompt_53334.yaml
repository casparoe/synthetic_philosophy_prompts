prompt: |-
  So in a few weeks I'm giving a paper at my department's philosophy of mind research seminar, and the audience is... a specific mix that I know well. Two of the regulars are hard-north physicalists who treat causal closure of the physical as basically settled (one of them likes to say that dualists keep "redefining the job until no work needs doing"). One is an interactionist dualist who thinks epiphenomenalism is the worst of both worlds -- you give up physicalism AND you give up the only thing dualism was supposed to buy you, causal efficacy. And there are a couple of grad students who've just spent a term on Kim and will have the standard self-stultification worry ready to fire. No consciousness scientists in the room, so I don't need to prep for the neuroscience-adjacent stuff, it's all going to be metaphysics and epistemology.

  My position, roughly: I defend epiphenomenalism about phenomenal properties, and I want to meet the paradox of phenomenal judgment head on rather than dodge it. The way I want to do this is by arguing that the reliability of our judgments about our own experience doesn't require qualia to CAUSE those judgments -- what it requires is that qualia are systematically correlated with the physical states that do the causal work, and I want to claim this correlation isn't a dumb coincidence but follows from a kind of harmony or structural constraint built into the psychophysical laws themselves (laws which, on my view, are basic). So my zombie twin and I say all the same things, yes, but the psychophysical laws being what they are, his reports track nothing while mine track qualia, and that asymmetry is supposed to be enough for knowledge.

  What I want from you is a proper prep sheet:

  - The objections in roughky the order they'll actually arrive, phrased the way these people would phrase them (the physicalists will go for causal closure first, the interactionist will go for the "worse than physicalism" line, the Kim students will do the self-stultification argument -- but tell me if you think the order would be different given my specific argument)
  - For each objection, a reply I can actually give in two minutes or so
  - A note on where each reply is soft -- I'd rather know now than find out in the seminar
  - And the one question I'm quietly hoping nobody asks. My guess is it's something like: if the harmony constraint does all this work, isn't the psychophysical fine-tuning you're positing MORE incredible than the coincidence you were trying to explain away -- and does that push me toward something like theistic or design-flavoured explanations, which I really don't want to touch? If that's right, tell me how bad it is and whether I should preempt it in the talk rather than wait for it.

  Please write the whole thing in British English, and don't bother giving me any reading list -- I've got the literature, what I need is the battle plan.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** A philosopher presenting a paper at a department research seminar.
      *   **Topic:** Philosophy of Mind (Metaphysics/Epistemology focus).
      *   **Position:** Epiphenomenalism about phenomenal properties (qualia).
      *   **Key Move:** Defends against the "Paradox of Phenomenal Judgment" (Chalmers-style) by arguing reliability doesn't require causation, only systematic correlation grounded in basic psychophysical laws (harmony/structural constraint). Zombie twin says same things, but the speaker's reports track qualia due to these laws.
      *   **Audience:**
          *   2x Hard-north Physicalists (Causal Closure is settled, dislike dualist moving goalposts).
          *   1x Interactionist Dualist (Hates epiphenomenalism as "worst of both worlds," wants causal efficacy).
          *   2x Grad Students (Just studied Jaegwon Kim, ready with self-stultification/causal exclusion arguments).
          *   *No* Consciousness Scientists (No need for empirical/neuro defense).
      *   **Requirements:**
          *   Prep sheet in British English.
          *   Objections in likely order of arrival (phrased authentically).
          *   2-minute replies for each.
          *   "Soft spots" (weaknesses) for each reply.
          *   The "One Question" nobody should ask (Fine-tuning/Design worry) + advice on pre-emption.
          *   No reading list (they know the lit).

  2.  **Determine the Order of Objections:**
      *   *Standard Flow:* Usually, physicalists strike first to set the ground rules (Causal Closure). Then Kim-students apply the exclusion argument (Self-stultification). Finally, the Interactionist Dualist attacks from the other flank (Normative/Explanatory cost).
      *   *User's Specific Argument:* The user is leaning heavily on *psychophysical laws* to explain the correlation. This might provoke the Physicalists immediately regarding "Causal Closure" because introducing basic psychophysical laws looks like a violation of closure to them.
      *   *Revised Order:*
          1.  Physicalists (Causal Closure/Violation of Physical Completeness).
          2.  Kim Students (Self-Stultification/Reliability without Causation).
          3.  Interactionist Dualist (The "Worst of Both Worlds" / Explanatory Idleness).
          4.  The "One Question" (Fine-tuning/Design).

  3.  **Drafting the Objections & Replies (Iterative Process):**

      *   **Objection 1: The Physicalists (Causal Closure).**
          *   *Phrasing:* Needs to be sharp. "You're violating closure." "Redefining the job."
          *   *Reply:* Distinguish *causal* closure from *nomological* supervenience. The physical causes the physical; the psychophysical law just maps the effect to a phenomenal state. It's a parallelism, not an interference.
          *   *Soft Spot:* Is this just pre-established harmony in disguise? Does it make the laws ad hoc?

      *   **Objection 2: The Kim Students (Self-Stultification).**
          *   *Phrasing:* "If qualia don't cause the belief, how is the belief *about* the qualia?" "Reliability requires causal link."
          *   *Reply:* Use the "Thermometer" or "Barometer" analogy. A thermometer tracks temperature without temperature causing the reading (mercury expands due to heat, but the *reading* tracks the state). Or better: Common Cause. The neural state causes the report *and* (via law) is correlated with the qualia.
          *   *Soft Spot:* The "Common Cause" usually implies the neural state *is* the experience (physicalism). If qualia are distinct, how does the law guarantee *accuracy* rather than just correlation?

      *   **Objection 3: The Interactionist Dualist (Worst of Both Worlds).**
          *   *Phrasing:* "You keep the ontological cost of dualism but lose the explanatory benefit." "Invisible danglers."
          *   *Reply:* The benefit isn't causal efficacy; it's *truth*. Physicalism can't account for the *what-it's-like* aspect truly. Epiphenomenalism saves the phenomenon (experience exists) even if it's causally idle. Better to be a causally idle truth-teller than a causal liar (illusionism).
          *   *Soft Spot:* Is truth without causal power intelligible? Does this make evolution inexplicable (why did we evolve to report on useless things)?

      *   **The "One Question" (Fine-tuning/Design).**
          *   *Analysis:* If the psychophysical laws are "basic" and ensure "harmony" so perfectly that we reliably report on non-causal qualia, this looks incredibly coincidental *unless* there's a reason for the laws to be that way.
          *   *Severity:* High. It pushes towards panpsychism or theism.
          *   *Pre-emption:* Dangerous. Raises a bigger metaphysical can than the talk can handle. Better to field it if asked, but have a deflationary ready ("Brute law").

  4.  **Refining the Tone (British English):**
      *   Use "whilst," "programme," "defence," "realise."
      *   Tone should be academic, slightly dry, strategic ("battle plan").
      *   Avoid Americanisms like "gotten," "center," "z."

  5.  **Fleshing out the Content (incorporating specific constraints):**
      *   *Physicalist Phrasing:* "Causal closure of the physical domain," "systematically overdetermined," "moving the goalposts."
      *   *Interactionist Phrasing:* "Explanatory impotence," "ontological extravagance."
      *   *Kim Student Phrasing:* "Causal theory of knowledge," "self-stultifying conclusion."
      *   *The "One Question":* Focus on the "bruteness" of the psychophysical laws.

  6.  **Review against Constraints:**
      *   British English? Yes.
      *   No reading list? Yes.
      *   Order of objections logical? Yes.
      *   2-minute replies? (Need to keep them concise).
      *   Soft spots identified? Yes.
      *   One Question addressed? Yes.

  7.  **Final Polish:**
      *   Ensure the distinction between the user's view (Epiphenomenalism + Psychophysical Laws) is clear in the replies.
      *   Make sure the "Harmony" argument is central.
      *   Check the advice on pre-emption (usually better not to volunteer the weakness).

  *(Self-Correction during drafting)*: I initially thought about suggesting the "Common Cause" reply for the Kim students. But if the user is a dualist, the neural state isn't the qualia. So the correlation is via law. I need to make sure the reply emphasizes that the *law* guarantees the tracking, not a causal chain. The "Thermometer" analogy works if the law links the physical state to the phenomenal state necessarily.
  Also, need to be careful with the Physicalists. If the user posits basic psychophysical laws, Physicalists might claim this *is* a violation of closure if the laws aren't physical. I need to frame it as the physical domain being causally closed, but *ontologically* open to nomological correlation.

  Let's assemble the document.

  *Structure:*
  1.  Introduction/Strategy Note.
  2.  Objection 1 (Physicalists).
  3.  Objection 2 (Kim Students).
  4.  Objection 3 (Interactionist).
  5.  The "One Question" (Fine-tuning).
  6.  Final Advice.

  *Tone Check:* "Battle plan," "Soft underbelly," "Take the hit."

  *British English Check:* "Defence," "Programme," "Prioritise," "Realise," "Centre." (Wait, UK spelling is 's' in organise/realise usually, though 'z' is Oxford spelling. I'll stick to standard UK 's' for safety or neutral academic style). Let's go with standard UK academic convention (often -ise).

  *Wait, one nuance:* The user says "laws which, on my view, are basic." This is the flashpoint for the Fine-tuning objection. I need to make sure that's highlighted.

  *Refining the "One Question":* The user suspects it's about fine-tuning/design. I should confirm this is the right worry and advise on pre-emption. Pre-empting might signal weakness. Better to have a "brute fact" defence ready.

  *Refining the Order:* The Physicalists will likely jump in first because the mention of "psychophysical laws" sounds like a violation of closure immediately. The Kim students will follow up on the epistemic consequence. The Interactionist will close on the metaphysical cost. This seems the most natural dialectical flow.

