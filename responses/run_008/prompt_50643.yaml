answer: |-
  You mistake the target of the norm: Jantelagen does not forbid excellence; it forbids the conversion of excellence into hierarchy. When we celebrate a Nobel laureate or a founder like Daniel Ek, we are not contradicting the law; we are validating their success only insofar as they remain *of* the community rather than *above* it. The moment an achiever begins to treat their talent as a moral superiority that exempts them from the shared vulnerabilities of ordinary life, that is when the knife comes out—not because we resent their skill, but because we resent their attempt to secede from the human commonwealth. You call it a tax on achievement; I call it an insurance premium against the social fragmentation that plagues your own country, where the winners build gated communities and the losers are left to despair. This is not a free-rider scheme where the meek consume the surplus of the proud; it is a coordination agreement where the ambitious purchase social stability, trust, and a safety net in exchange for not lording their fortune over their neighbors. Your dignity is found in rising above others; ours is found in ensuring that no one rises so high that they can no longer belong to us, and that no one falls so low that they cease to belong at all.
