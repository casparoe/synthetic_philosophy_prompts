answer: |-
  # Fitch's Paradox: A Decision Tree for the Perplexed

  **START HERE:** You have seen the proof. It derives **"Every truth is known"** from **"Every truth is knowable."**

  ### 1. Is the conclusion ("Every truth is known") an absurdity you must avoid?
  *   **NO:** It's a harmless technicality, or actually true.
      *   **→ LEAF 1: The Realist.**
          *   *Commitment:* Anti-realism is false; there are unknowable truths, and this proof is the reductio that kills them.
  *   **YES:** I need to save the idea that truth is linked to knowledge.
      *   **→ Go to Question 2.**

  ### 2. Is the logical proof itself valid?
  *   **NO:** One of the logical rules used in the derivation is invalid.
      *   **→ Go to Question 3.**
  *   **YES:** The logic is fine; the problem is with the Knowability Principle.
      *   **→ Go to Question 4.**

  ### 3. Which logical rule fails?
  *   **Classical Negation:** We cannot move from "not known" to "known not" freely (Double Negation fails).
      *   **→ LEAF 2: The Intuitionist.**
          *   *Commitment:* Classical logic is too strong for epistemic contexts; truth exceeds verification only if we use classical negation.
  *   **Non-Contradiction:** We must allow that some contradictions might be knowable/true to block the collapse.
      *   **→ LEAF 3: The Paraconsistentist.**
          *   *Commitment:* We must tolerate true contradictions to prevent knowledge from collapsing into triviality.

  ### 4. How do we fix the Knowability Principle?
  *   **Change the Meaning:** "Knowable" doesn't mean what we thought it meant (e.g., it's not about *us* knowing *now*).
      *   **→ Go to Question 5.**
  *   **Restrict the Scope:** The principle applies only to *some* truths, not all of them.
      *   **→ Go to Question 6.**

  ### 5. What does "Knowable" mean now?
  *   **Idealized:** It means "knowable by an ideal investigator at the end of inquiry," not by us in our current situation.
      *   **→ LEAF 4: The Idealist.**
          *   *Commitment:* Truth is just what would be believed at the ideal limit of scientific inquiry, not necessarily now.
  *   **Contextual/Rigidified:** It means "known in some possible situation about *this* actual situation" (cross-world knowledge).
      *   **→ LEAF 5: The Contextualist (Edgington).**
          *   *Commitment:* We can know actual truths only by stepping outside our actual situation to evaluate them.

  ### 6. How do we restrict the scope of truths?
  *   **Exclude Tricky Sentences:** We exclude only sentences that logically imply their own unknownness (like "p but unknown").
      *   **→ LEAF 6: The Restrictionist (Tennant).**
          *   *Commitment:* Some specific truths are inherently unknowable (the Fitch sentences themselves), but most are fine.
  *   **Exclude Complex Sentences:** We exclude all compound truths (conjunctions); only basic atomic truths are knowable.
      *   **→ LEAF 7: The Basic Truthist (Williamson).**
          *   *Commitment:* Knowability does not aggregate; knowing p and knowing q does not guarantee knowing (p and q).

  ***

  ### Instructor Notes & Discussion Points

  **1. The Unoccupied Branch: Embracing the Conclusion**
  The tree starts by asking if "All truths are known" is absurd. If you answer **NO** not because you are a Realist (who thinks the *principle* is false), but because you think the *conclusion* is literally true, you land in a rare spot: **Absolute Idealism**.
  *   **Coherence:** It is coherent only if you believe in an Omniscient Mind (God or Absolute Spirit) that actually knows all truths.
  *   **Status:** Mostly unoccupied in contemporary metaphysics. It collapses the distinction between truth and knowledge entirely. Most people who "shrug" at the conclusion are Realists using it as a weapon against anti-realism (Leaf 1), not Idealists accepting it as doctrine.

  **2. The Indistinguishable Leaves: Williamson vs. Tennant**
  Leaves 6 and 7 both restrict the Knowability Principle to avoid the paradox. On a one-page summary, they look identical ("Some truths aren't knowable").
  *   **The Split:** The distinction lies in *why* the truth is restricted.
      *   **Tennant (Leaf 6):** Restrictions are *semantic/logical*. Any truth consistent with being known is knowable. Only self-defeating sentences (like Fitch sentences) are excluded.
      *   **Williamson (Leaf 7):** Restrictions are *structural*. Even non-self-defeating complex truths (conjunctions) are excluded because knowledge doesn't aggregate over conjunctions.
  *   **Handout Limit:** For this session, treat them as "Restricting Specific Sentences" vs. "Restricting Grammatical Complexity." If students press, ask: "Is 'p and q' knowable if p and q are known separately?" Tennant says yes; Williamson says not necessarily.

  **3. The "Expensive" Combo: Blocking Logic + Restricting Principle**
  There is no leaf for someone who both changes the logic (Q3) *and* restricts the principle (Q4).
  *   **Why?** It's theoretically redundant. If you block the logic (e.g., Intuitionism), the proof doesn't go through, so you don't *need* to restrict the principle. Doing both is "too expensive" (giving up too much classical logic and too much knowability) without extra gain.

  **4. The Idealist Leaf (Leaf 4)**
  Is this just a relabeled Verificationism?
  *   **Verdict:** It sidesteps the proof by changing the modal operator from "possible for us" to "possible at the limit." It saves the *spirit* of verificationism (truth ties to knowledge) but sacrifices the *motivation* (human epistemic humility). It turns anti-realism into a claim about the future end of science, not current verification.
