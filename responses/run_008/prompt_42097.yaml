prompt: |-
  hey, so im a grad student running a reading group on anti-realism / verificationism, and our next session is on Fitch's paradox -- the one where "every truth is knowable" plus some pretty boring classical logic gets you "every truth is already known." I want to put together a one-page decision tree that sorts people by what they actually want to do with the paradox, not by which camp theyd claim to belong to. handout format, plain english at the decision points.

  Start the tree at the conclusion, not at the knowability principle: assume everyone has just watched the proof go through, so the first node is whether "all truths are known" strikes you as an absurdity you need to escape or as a harmless technicality you can shrug at. After that, each branch node should be a question a person can answer without knowing where it leads them -- something like "is there any step of the classical proof you would actually deny?" or "would you still restrict the principle even if the proof were valid but the conclusion false?" rather than "are you a Dummettian?". The nodes I'd expect to matter: escape or shrug, block the logic or block the principle, and (if you block the principle) restrict the truths it covers vs reinterpret what "knowable" means -- but build it from the logical space first and then locate the actual positions in it, rather than just drawing lines between famous names.

  Roughly the leaves I want to end up with: the realist who thinks the whole thing is just a reductio of verificationism and never loses sleep over it; Williamson's move of restricting knowability to basic, non-compound truths; Tennant's move of carving out the Fitch-style sentences themselves; Edgington's reinterpretation where its really about actual knowledge, rigidified; the intuitionist who wants to block the classical proof rules rather than the principle; and the paraconsistent route of letting some contradictions be knowable. If you think there's a natural seventh leaf -- some idealized-verifier / end-of-inquiry reading of "knowable" that sidesteps the proof instead of amending it -- include it, but say whether its really a different position or just a relabeled one.

  Two things I care about beyond the tree itself. First, flag the unoccupied combinations: what would it take to sit in the "embrace the conclusion" branch and say all truths are known after all -- is that coherent, does it collapse into some absolute-idealist thing, or is it just a non-starter? and are there combos that are coherent but nobody defends, and can you guess why (too expensive, or just unexplored)? Second, flag any pair of leaves the tree cant really seperate -- my hunch is the two restrictionist leaves look identical until you push on the exact shape of the restriction, so tell me how far you can push before they split, or whether at the level of a one-page handout they should honestly just be merged.

  Audience is people who've seen the proof once and know Dummett's anti-realism mainly from a survey course, so keep the node questions free of modal operators and sequents -- save whatever technical gloss you need for the leaf labels, and keep each leaf to one sentence on its most awkward commitment (what the position has to swallow that the others dont). Six or seven leaves max, one page. And no quotes from the actual papers, I dont want to have to chase down page numbers before photocopying. sorry if this is rambly, writing this between two seminar talks
