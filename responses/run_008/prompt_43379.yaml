answer: |-
  Let's map the ontology of time onto the ontology of the manuscript.

  **Eternalism** is the Published Book. In the final object, the climax exists on page 300 just as substantially as the inciting incident on page 10. The "now" is merely the reader's bookmark indexical to their progress. If you hold the book, the entire timeline is physically present; the death of the protagonist is as real and fixed as their birth. This aligns with the Block Universe: the past isn't gone, it's just located elsewhere in the binding.

  **Presentism** is the Drafting Process. While you are writing Chapter 1, Chapter 10 does not exist. It is not waiting in a void; it is literally nothing. For the character inside a strict First-Person Present scene, the future is unwritten potential and the past is only memory (which, as you know, is unreliable narration). The only ontological weight is the sentence currently being typed.

  **Relativity's "No Privileged Now"** translates to the distinction between *Story Time* (chronology) and *Discourse Time* (narrative order). In a time-hopping novel, there is no single canonical reading order that dictates the "true" present. If you structure the book so Scene B (1990) precedes Scene A (1980), the reader's "now" shifts depending on where they enter the text. There is no objective "current year" in the text itself, only the subjective experience of the turn of the page.

  However, the mapping fractures immediately upon inspection.

  **The Residue Report**

  What survives the translation is the tension between *structure* and *experience*. Eternalism describes the book as an object; Presentism describes the book as an event (reading or writing). This captures the philosophical stalemate: Eternalism wins on physics (the block), Presentism wins on phenomenology (the feeling of flow).

  What gets distorted is **Revision**. In your craft, you can revise Chapter 1 after writing Chapter 10. It feels like changing the past. But this is a false analogue to Presentism's "open past." When you revise, you aren't altering a fixed past; you are destroying one object and creating a new one. The previous draft still existed in time. In philosophy, the Presentist argues the past *ceased to exist*. In craft, the past draft becomes an archived file. The "openness" of the draft is actually just the author's agency, not a property of time itself.

  What has no expression in your vocabulary is **Causal Closure**. In the Block Universe, the future determines the past just as much as the past determines the future (block constraints). In a novel, the ending constrains the beginning (Chekhov's gun), but only because you impose it. There is no physical mechanism in the manuscript that forces the draft to conform to the ending other than your will. The philosophical debate concerns whether the future *physically necessitates* the present; the craft debate concerns whether the ending *aesthetically justifies* the beginning.

  **The "Author-as-God" Trap**

  You asked me to flag where the storyteller framing does metaphysical work the debate doesn't. Here it is: Mapping Eternalism to the "Author's Eye View" smuggles in a Creator outside the system. The Block Universe does not require a writer standing outside time holding the block. It just *is*.

  When you say, "The future exists for me as author but not for them," you are describing **Epistemic Asymmetry**, not Ontological Eternality. You know the ending, but the character doesn't. But in Eternalism, the future exists *for the character too*, they just haven't encountered it yet. By framing it as "Author vs. Character," you turn a question of existence (does the future exist?) into a question of knowledge (who knows the future?). This collapses the philosophical problem into a plot device. It makes Eternalism look like Omniscient Narration, but Omniscience is about information, while Eternalism is about substance.

  **The Verdict**

  You asked if the philosophical disagreement is substantive or if my vocabulary reveals it as a category error. I believe the latter.

  The Presentism/Eternalism fight is a confusion between the *map* and the *territory*. Your craft vocabulary separates these naturally: the Manuscript (Eternal) vs. the Reading/Writing (Presentist). Philosophers try to force the universe to be exclusively one or the other. But your work demonstrates that both are necessary descriptions depending on the frame of reference.

  If you treat the universe as a Manuscript, Eternalism is true. If you treat the universe as a Reading Experience, Presentism is true. The fight arises because philosophers insist the universe must be only one type of object. They are arguing over whether a novel is "really" the paper or "really" the story.

  The limitation isn't your vocabulary; it's their ontology. They are looking for a singular substance where there is likely a relationship. Your time-hopping structures work *because* you exploit both: you rely on the reader's Presentist experience of suspense while manipulating the Eternalist structure of the plot to create meaning. If the debate were truly substantive, one of those modes would have to be false. Since both are essential to your craft, the philosophical insistence on choosing one is likely the error. The universe isn't a draft or a finished book; it's the binding that holds both.
