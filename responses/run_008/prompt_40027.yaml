      *   **Nematode (302 neurons):** Not Conscious.
      *   **Octopus:** Conscious (maybe vividly). *Problem:* Decentralized nervous system (arms act independently). Question: Does the arm feel, or the whole?

  3.  **Evaluate the User's Tentative Principle:**
      *   *Proposal:* "Consciousness needs integrated central control of behavior."
      *   *Fit:*
