prompt: |-
  I hold the view that Solomonoff induction settles the dispute over Occam's razor, at least in principle: among hypotheses that fit the data, the shorter ones deserve more credence, and this is an a priori truth rather than a matter of taste, because the Solomonoff prior concentrates weight on short programs and its predictions provably converge to the truth in any computable environment. On this view, the problem of induction is solved for any computable world, and scientific inference is vindicated as rational.

  Tell me what would count against this view. Rank the defeaters from fatal to merely awkward, distinguish the live ones from the merely logically possible, and say which of them its own defenders would concede. A few I can already half see: the prior is uncomputable, so nothing could ever literally run it; the invariance theorem, which is supposed to make the choice of universal machine irrelevant, only buys immunity up to an additive constant — and a constant can swamp any finite dataset, so a critic could seemingly pick a machine on which some elaborate cosmology comes out shorter than quantum field theory; and the convergence guarantee itself assumes a computable environment, so uncomputable physics would void the vindication. Given those qualifications, is there anything left that could make the view wrong? Please close with an honest assessment of whether it has been qualified into unfalsifiability — and whether that would be a defect in a view of this kind. Answer in British English, and end your reply with a single line beginning 'Verdict:' followed by one of {decisively refuted, exposed, insulated but not empty, unfalsifiable} and one clause of justification.
