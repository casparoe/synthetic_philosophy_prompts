      *   **Tasks:**
          1.  Create an explicit correspondence table (Author, Text, Reader, Truth-in-story vs. Truth, Utility).
          2.  Lay out where the mapping breaks (Authorship/Dating/Revisability, Consistency/Triviality, Pretense vs. Assertion).
          3.  Evaluate which disanalogies matter for the housemate's conclusion (Does the conclusion survive?).
          4.  Suggest better analogies if the fiction one fails (Game rules, conventions, myths).

