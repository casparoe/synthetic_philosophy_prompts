answer: |-
  This is an excellent philosophical audit. Your suspicion is well-founded: the "Math-as-Fiction" analogy is the primary pedagogical hook for fictionalism, but it is notoriously leaky. It motivates the *attitude* of nominalism (ontological deflation) but often obscures the *argument* required to sustain it (specifically against the Indispensability Argument).

  Here is the audit of the analogy, structured as you requested.

  ### 1. The Correspondence Table

  To evaluate the analogy, we must formalize the mapping your instructor and housemate are relying on. This is typically based on **Hermeneutic Fictionalism** (the claim that mathematical discourse is *already* a kind of fiction) or **Revolutionary Fictionalism** (the claim that we *should treat* it as fiction to avoid ontological commitment).

  | Element | Literary Fiction (Sherlock Holmes) | Mathematical Fictionalism (Primes, Sets) |
  | :--- | :--- | :--- |
  | **The Author** | Arthur Conan Doyle (individual agent). | The Mathematical Community / Human Conceptual Activity (collective, historical process). |
  | **The Canon/Text** | The collected stories (*A Study in Scarlet*, etc.). | Axiomatic Systems (ZFC, Peano Arithmetic) + Derived Theorems. |
  | **The Reader** | The general public / Literary critics. | Mathematicians, Physicists, Engineers. |
  | **Truth-in-the-Story** | "Holmes lives on Baker St." (True according to the text). | "There are infinitely many primes." (True according to the axioms). |
  | **Plain Truth** | "Holmes exists." (False; no such person). | "Numbers exist." (False; no abstract objects). |
  | **The Utility** | Entertainment, insight into human psychology, cultural cohesion. | **Empirical adequacy**, instrumental success in physics/engineering, logical coherence. |
  | **Ontological Commitment** | None required to enjoy the story. | None required to use the math (allegedly). |

  **The Crucial Disanalogy in Utility:**
  You asked specifically about the analogue of utility. In fiction, utility is *optional* and *aesthetic*. In mathematics, utility is *compulsory* and *empirical*. We can stop reading Holmes without physics collapsing. We cannot stop using calculus without engineering collapsing. The fictionalist must argue that the "usefulness" of math is like the "usefulness" of a metaphor: it helps us organize thoughts about the real world without referring to real objects. The Platonist argues the usefulness is like a map: it works *because* it tracks real terrain.

  ### 2. Where the Mapping Breaks

  The analogy fractures under pressure at three specific points. These are not merely cosmetic; they strike at the mechanics of how mathematics functions.

  **A. Authorship and Contingency vs. Discovery and Necessity**
  *   **Fiction:** Doyle decided Holmes would die at Reichenbach Falls. He could have decided otherwise. The truth is contingent on the author's whim.
  *   **Math:** Mathematicians feel they *discover* primes, not invent them. If humans vanished, $2+2=4$ would arguably still hold. The fiction analogy implies math is contingent (we could have written a different story), but mathematical truth appears necessary (true in all possible worlds).
  *   **The Break:** If math is a fiction, why can't we "retcon" it? If the "authors" (mathematicians) decide $2+2=5$, the system breaks. In fiction, a retcon is annoying; in math, it is catastrophic.

  **B. Consistency and the Principle of Explosion**
  *   **Fiction:** Doyle can contradict himself (e.g., Watson's war wound location). The story survives; readers treat it as a plot hole.
  *   **Math:** If an axiom system is inconsistent, the **Principle of Explosion** applies (*ex contradictione quodlibet*). From a contradiction, *anything* follows. The system becomes trivial and useless.
  *   **The Break:** Fiction tolerates inconsistency; mathematics cannot. This suggests mathematics is tracking a structural constraint on reality (logic itself) rather than weaving a narrative.

  **C. Assertoric Force (The "Pretense" Problem)**
  *   **Fiction:** When we speak of Holmes, we operate under an explicit **pretense**. We know we are speaking "in the story."
  *   **Math:** When a physicist writes $F=ma$, they are not signaling "in the story of Newtonian Mechanics." They are asserting this describes the world.
  *   **The Break:** This creates a dilemma for your housemate.
      *   *Option 1 (Hermeneutic):* He claims mathematicians *are* pretending but don't realize it. This makes mathematicians confused about their own speech acts.
      *   *Option 2 (Revolutionary):* He claims mathematicians *are* asserting existence, but they *ought* to stop. This admits the analogy doesn't describe current practice, but prescribes a new one.
      *   Most working mathematicians are realists. The fiction analogy requires an **Error Theory**: mathematicians are systematically wrong about what they are saying when they say "there exists."

  ### 3. Audit of the Conclusion

  **Does the housemate's conclusion survive the disanalogies?**

  **Verdict: No, not without significant reinforcement.**

  The housemate's conclusion is: *We can keep doing arithmetic while declining the ontological bill.*
  The analogy supports the *coherence* of this stance (it is possible to speak truly-in-a-story without belief), but it fails to support the *plausibility* of this stance regarding **scientific application**.

  **Why the analogy fails to carry the conclusion:**
  1.  **The Indispensability Argument (Quine-Putnam):** This is the Platonist's heavy weapon. It argues that we should believe in the existence of whatever entities are indispensable to our best scientific theories. Since electrons and numbers play the same role in physics equations, if you believe in electrons, you must believe in numbers.
      *   *The Fiction Counter:* The housemate uses the Holmes analogy to say, "We believe in electrons because they cause things; numbers are just tools."
      *   *The Problem:* The Holmes analogy doesn't explain *why* the tool works so perfectly. If math is just a story, its fit with physical reality is a miracle. Platonism explains the fit (math describes the structure of reality). Fictionalism leaves the "unreasonable effectiveness of mathematics" (Wigner) as an unexplained coincidence.
  2.  **The Consistency Constraint:** As noted above, fiction doesn't need to be consistent to be useful. Math does. This implies math is constrained by something external to the "story" (logic/reality). If it is constrained by reality, the claim that it involves no "inventory of what there is" becomes shaky.

  **Is the analogy carrying the conclusion?**
  Yes. The housemate is smuggling the conclusion in via the emotional resonance of the analogy. Because we all agree Holmes isn't real, we feel we *should* agree numbers aren't real. But the *reason* we agree Holmes isn't real is that he has no causal power and his story is contingent. Numbers have causal power (via physics) and their "story" is necessary. The analogy suppresses these differences to make the nominalist pill easier to swallow.

  ### 4. Better Analogies for the Nominalist

  If the "Literary Fiction" analogy is too weak, the nominalist needs an analogy that captures **utility without ontology** and **rigor without discovery**. Here are three superior candidates:

  **A. The "Rules of a Game" Analogy (Formalism/Structuralism)**
  *   **The Picture:** Math is like Chess.
  *   **Why it's better:** Chess pieces don't "exist" as knights; they are defined by their moves. The rules are rigid (no retconning), but they are human-made conventions.
  *   **Utility:** We play chess to train strategy. We do math to train logical modeling.
  *   **Residual Problem:** Chess doesn't predict the movement of planets. This analogy still struggles with *application*.

  **B. The "Measurement Convention" Analogy (Instrumentalism)**
  *   **The Picture:** Math is like the Metric System or Time Zones.
  *   **Why it's better:** "It is 5:00 PM" is true, but "5:00 PM" doesn't refer to a mysterious abstract object existing in the sky. It is a coordinate system we overlay on reality to manage it.
  *   **Utility:** Indispensable for coordination and physics, but clearly a human construct.
  *   **Residual Problem:** Time zones are arbitrary (we could have chosen differently). Prime numbers feel non-arbitrary.

  **C. The "Map vs. Territory" Analogy (Model Theory)**
  *   **The Picture:** Math is a map; Physics is the territory.
  *   **Why it's better:** A map is not the territory (no ontological commitment to the map lines being "real"), but a good map is indispensable for navigation. It explains the "fit" between math and world without requiring the map to *be* the world.
  *   **Utility:** Captures the predictive success better than "fiction."
  *   **Residual Problem:** Platonists will argue the map works *because* it captures the real structure of the territory, implying the structure (math) is real.

  **Recommendation:**
  Tell your housemate to switch to the **Map/Model analogy**. It preserves the "no ontological commitment to the tool" aspect of fictionalism but respects the "indispensability and rigor" aspects that the Sherlock Holmes analogy trivializes. It acknowledges that while the map isn't the territory, the relationship between them is not merely a matter of storytelling, but of structural correspondence. This forces the debate onto the actual metaphysical ground (What is the status of structure?) rather than the linguistic ground (Are we pretending?).
