      *   *Canon/Text:* Sherlock Holmes stories vs. Axiomatic Systems (ZFC, Peano Arithmetic).
      *   *Reader:* The public vs. Mathematicians/Scientists.
      *   *Truth-in-story:* "Holmes lives on Baker Street" vs. "There are infinitely many primes."
      *   *Plain Truth:* "Doyle wrote this" vs. (For the fictionalist) There are no numbers.
      *   *Utility:* Entertainment/Insight into human nature vs. Empirical success of science (instrumental value).
      *   *Crucial Point:* The user asks about the utility analogue. In fiction, it's enjoyment/insight. In math, it's *indispensability* to physics. This is the weak point.

  3.  **Deconstruct Task 2: Where the Mapping Breaks (Disanalogies):**
      *   *Authorship/Discovery:* Fiction is created (Doyle decided Holmes dies). Math feels discovered (Primes were prime before we found them).
      *   *Revisability:* Doyle can retcon. Math axioms are rigid. If you change $2+2=4$, the system breaks or becomes something else.
      *   *Consistency:* Doyle contradicting himself is a plot hole. In math, inconsistency (via Principle of Explosion) makes the system useless (everything becomes provable).
      *   *Assertoric Force:* We read fiction in a "pretense mode." Mathematicians assert "There are primes" as fact, not "In the story of ZFC..."
      *   *Necessity:* Fiction is contingent. Math seems necessary (true in all possible worlds).

  4.  **Deconstruct Task 3: Do These Disanalogies Matter for the Conclusion?**
      *   *Housemate's Conclusion:* We can use math without believing in numbers (ontological deflation).
      *   *Does the fiction analogy support this?* Yes, that's the core of fictionalism (Rosen, Field).
      *   *Do the disanalogies kill the conclusion?*
          *   *Authorship:* Doesn't necessarily kill it. We can say the "story" is a social construct.
          *   *Consistency:* This is big. If math is just a story, why *must* it be consistent to work in physics? Fiction can be inconsistent and still be enjoyed. Math cannot. This suggests math tracks something structural about reality, not just a narrative.
          *   *Assertoric Force:* This is the "Hermeneutic" vs. "Revolutionary" fictionalism debate. If mathematicians *mean* to assert existence, the fictionalist says they are *wrong* (error theory). If the housemate says "they are just pretending," he's making a claim about linguistic practice that might be false.
          *   *Indispensability:* This is the killer. Holmes isn't indispensable to criminology. Math *is* (allegedly) indispensable to physics. Quine-Putnam indispensability argument hits hard here. The fiction analogy downplays this.
      *   *Verdict:* The analogy motivates the *stance* (ontological deflation) but fails to justify the *success* of the stance against the Indispensability Argument. The housemate is ignoring *why* Platonists believe (because math works too well to be just a story).

  5.  **Deconstruct Task 4: Better Analogies?**
      *   *Game Rules:* Chess. Pieces don't "exist" as knights, they function as knights. Good for structuralism, less so for truth.
      *   *Measurement Conventions:* Meters, kilograms. Useful, human-made, but track physical reality. Closer to the instrumentalist view.
