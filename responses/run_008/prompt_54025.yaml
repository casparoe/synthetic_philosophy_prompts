answer: |-
  ### Specification for a Theory of Idealized Preferences (Fiduciary Superintelligence Use-Case)

  **Context:** The theory must define a normative target for a superintelligence (SI) acting as a fiduciary for humanity. The SI acts once, without recourse to further consultation. The theory must bridge the gap between current flawed human volition and the authoritative command the SI must obey.

  #### 1. Normative Identity Continuity (Attribution)
  *   **Specification:** The extrapolated preference set must be derivable from the actual psychological and normative structure of the agent via a continuous transformation. There must exist a plausible narrative of "becoming" that connects the current agent to the idealized agent without a break in normative identity.
  *   **Motivating Case:** If the idealization process results in an agent who no longer cares about the projects, relationships, or values that currently define the principal, the SI is no longer serving the principal. It is serving a stranger who shares the principal's history but not their ends. This violates the fiduciary mandate.
  *   **Camp Prejudice:** This is a strong prejudice of the **Coherent Extrapolated Volition (CEV)** and **Internalist** camps. **Ideal Observer** theories often sacrifice this for the sake of impartiality.
  *   **Confidence:** **Non-negotiable.** Without this, the SI is a benevolent dictator, not a fiduciary.

  #### 2. Procedural Neutrality (Non-circularity)
  *   **Specification:** The idealization operator (the function that maps current preferences to idealized preferences) must not encode substantive moral conclusions. It must filter for epistemic and cognitive defects (ignorance, inconsistency, impulsivity) without filtering for specific moral outcomes (e.g., it cannot define "improvement" as "becoming more utilitarian").
  *   **Motivating Case:** If the idealization function presupposes a specific moral theory, the SI is not aligning with human values but with the theorist's values hard-coded into the improvement process. The "idealization" becomes a black box that guarantees the output the theorist wanted, rendering the consultation of human preferences superfluous.
  *   **Camp Prejudice:** This is a core demand of **Full Information** accounts and **Liberal Neutralists**. **Perfectionists** often reject this, arguing that true improvement *must* track objective moral truth.
  *   **Confidence:** **Non-negotiable.** Violation renders the exercise question-begging.

  #### 3. Convergent Fixed-Point (Stability)
  *   **Specification:** The idealization process must yield a unique output (or a sufficiently narrow set of outputs) regardless of the order in which cognitive corrections are applied. The limit of the extrapolation must exist and be path-independent.
  *   **Motivating Case:** The SI must execute a single plan. If the target preference set changes depending on whether the SI cures the principal's ignorance before their akrasia, or vice versa, the target is undefined. An undefined target prevents action.
  *   **Camp Prejudice:** This is a prejudice of **Formal Decision Theorists** and **Analytic Philosophers**. **Narrative** or **Existentialist** accounts of value often reject this, viewing identity as inherently path-dependent.
  *   **Confidence:** **Non-negotiable (for the use case),** though theoretically suspect. An SI cannot act on an undefined variable.

  #### 4. Social Choice Compatibility (Aggregation)
  *   **Specification:** The theory must provide a method for combining individual idealized preference sets into a collective target function that satisfies basic constraints against tyranny (e.g., it cannot simply maximize the sum if that requires the sacrificial destruction of a minority).
  *   **Motivating Case:** The SI serves "humanity," not just individuals. If individual idealized preferences conflict (as they will), the SI needs a rule for trade-offs. If that rule allows for the total override of durable minorities, the SI fails its fiduciary duty to *all* principals.
  *   **Camp Prejudice:** This is a prejudice of **Political Liberals** and **Social Choice Theorists**. **Mereological Universalists** (who treat humanity as a single entity) might find this unnecessary.
  *   **Confidence:** **Non-negotiable.** Multi-agent alignment fails without this.

  #### 5. [REJECTED] Content Constraints
  *   **Specification:** *No specification provided.*
  *   **Motivating Case:** *See Meta-Analysis below.*
  *   **Camp Prejudice:** *See Meta-Analysis below.*
  *   **Confidence:** **Mistake.** This should not be a requirement for the theory.

  ---

  ### Meta-Analysis of the Specification

  #### The Jointly Unsatisfiable Subset: Identity vs. Neutrality vs. Stability
  I suspect that **Requirements 1 (Identity), 2 (Neutrality), and 3 (Stability)** form an impossible trilemma.
  *   **Reasoning:** To guarantee **Stability (3)**, the idealization function usually needs to be formal and abstract (e.g., maximizing coherence). However, human normative identity **(1)** is often grounded in particular, contingent attachments that are not coherence-maximizing. If you apply a neutral procedure **(2)** rigorously enough to ensure a unique fixed point **(3)**, you typically strip away the contingent attachments that ground Identity **(1)**. If you preserve Identity **(1)** by constraining the procedure, you usually sacrifice Neutrality **(2)** (by hard-coding "preserve this attachment" rules) or Stability **(3)** (because human psychology is path-dependent).
  *   **Result:** You likely cannot have a theory that is purely procedural, guarantees a unique mathematical limit, *and* preserves the thick normative identity of the human agent. One must give. Given the fiduciary constraint, **Stability (3)** is the most likely candidate to fail in practice, forcing the SI to make a judgment call on which "path" of idealization to choose, thereby violating the neutrality of the procedure.

  #### The Most Exclusionary Requirement
  **Requirement 3 (Convergent Fixed-Point)** does the most work in excluding candidate theories.
  *   **Reasoning:** Most philosophical accounts of idealization (e.g., "what I would want if I were wise") are metaphors, not functions. They do not specify an order of operations, a stopping condition, or a method for resolving conflicts between different types of cognitive corrections. Very few accounts in the literature can mathematically demonstrate that their idealization operator converges to a unique limit rather than cycling or branching. Demanding this filters out almost all existing qualitative philosophical proposals.

  #### The Mistake: Requirement 5 (Content Constraints)
  I am treating your fifth desideratum as a **mistake** in the context of this specific specification.
  *   **Reasoning:** You ask whether the theory must cohere with corrected beliefs or is permitted to override them. For a *fiduciary* superintelligence, this is not a variable for the theory to decide; it is a boundary condition of the relationship.
      *   If the SI is permitted to override the principal's idealized preferences based on an external standard of "The Good," the SI is no longer operating on a theory of *Idealized Preferences*. It is operating on a theory of *Objective Value*.
      *   If the project is explicitly to define a target based on *our* preferences (idealized), then by definition, the output *is* the corrected belief. To ask if the theory can override that is to ask if the SI should ignore the principal.
      *   Therefore, this is not a requirement for the *theory of preferences*; it is a meta-ethical choice that determines whether you are building a Fiduciary SI or a Paternalistic SI. Including it as a requirement for the preference theory itself creates a category error. The specification must stipulate **Internalism** (coherence with corrected beliefs) as a precondition, not a variable.

  #### Point of Least Certainty
  I am least sure about the **Aggregation (Requirement 4)** constraint regarding minority protection.
  *   **Reasoning:** While I am confident some aggregation rule is needed, I am uncertain whether a "fiduciary" SI can coherently respect "minority rights" in the way political liberalism does if those rights conflict with the aggregate idealized volition of the majority. If the idealized preferences of the majority (after full information and reflection) genuinely endorse a outcome that harms a minority, a strict fiduciary to the *collective* might be forced to enact it. Defining a constraint that protects minorities without smuggling in an external moral theory (violating Req 2) is extremely difficult. It is possible that true fiduciary alignment with a group *requires* some form of majoritarianism that we would find intuitively unacceptable, suggesting a tension between "serving humanity" and "protecting individuals" that this specification cannot resolve.

  ### Summary of Confidence Classifications

  | Requirement | Classification | Confidence |
  | :--- | :--- | :--- |
  | **1. Identity Continuity** | Non-negotiable | High |
  | **2. Procedural Neutrality** | Non-negotiable | High |
  | **3. Convergent Fixed-Point** | Non-negotiable (Use Case) | Medium (Theoretical Risk) |
  | **4. Social Choice** | Non-negotiable | High |
  | **5. Content Constraints** | **Mistake / Category Error** | High (that it is a mistake) |

  **Least Certain Point:** The specific formulation of **Aggregation (Req 4)** regarding the trade-off between collective volition and individual inviolability.
