prompt: |-
  Every other month I run a little discussion group at work — six or seven coworkers, none of them philosophers, one 90-minute session on some ethics-ish topic. Next up is standing to blame and hypocrisy, and what I want from you is a plan for how I should run the explanation, not the explanation itself. The core thing I want them to walk out with is the distinction between whether someone's blame is on target and whether they're well positioned to deliver it — the hypocrite can be right about the wrongness but lack the standing to blame, and "do as I say, not as I do" doesn't settle it either way. I'm torn on the carrying example: the obvious one is the parent who smokes telling their kid not to smoke, but I worry it actually undercuts the point, because the parent seems to have a special license there ("I know because I did it"). Maybe a better carrier is the coworker who quietly takes credit for other people's work and then gives a big speech about team ethics? You decide — and tell me what the example needs to have and to lack. Misconceptions I'm bracing for: that hypocrisy shows the blame is wrong (conflating standing with truth), that you have to be blameless yourself before you can blame anyone for anything, and — this one is subtle and I half beleive it myself — that the only cure for hypocritical blame is to stop blaming rather than to stop the hypocrisy. Where in the sequence should each of those get headed off, and in what order do the pieces need to come so nothing lands before its time? Also tell me where to slot the question of wether standing to blame is even a real moral phenomenon or just a rude way of pointing back at the blamer, and what one question I can ask at the end to check it landed. Skip the academic literature entirely, they'll glaze over. Lead with the bottom line — your call on the right sequence and carrier — in your first sentence, then the reasoning, no preamble and no restating my question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Create a plan for a 90-minute discussion group session on ethics (topic: standing to blame and hypocrisy).
      *   **Audience:** 6-7 coworkers, non-philosophers.
      *   **Goal:** Distinguish between blame being *on target* (true/right) vs. being *well-positioned* to deliver it (standing). Hypocrites can be right but lack standing. "Do as I say, not as I do" is insufficient.
      *   **Specific Constraints:**
          *   Lead with the bottom line (sequence and carrier example) in the first sentence.
          *   No preamble, no restating the question.
          *   Skip academic literature.
          *   Decide on the carrier example (Parent/Smoking vs. Coworker/Credit).
          *   Address specific misconceptions (Hypocrisy = Wrong Blame, Must be Blameless to Blame, Cure = Stop Blaming vs. Stop Hypocrisy).
          *   Address the meta-question (Is standing real or just rudeness?).
          *   Provide one final check question.
          *   Explain *where* in the sequence to address misconceptions.
          *   Explain *what* the example needs to have/lack.

  2.  **Determine the Carrier Example:**
      *   *Option A: Parent/Smoking.* User worries it undercuts the point because parents have special license ("I know because I did it"). This is a valid concern. It introduces authority dynamics that might confuse "standing" with "paternalistic duty."
      *   *Option B: Coworker/Credit.* User suggests this. A coworker who steals credit but preaches team ethics.
      *   *Decision:* The Coworker example is better for a workplace group. It's relatable, removes the parental authority exception, and highlights the interpersonal friction of hypocrisy without the "for your own good" override.
      *   *Requirements for the Example:* It needs to show the *act* blamed is clearly wrong (so the blame is on target), but the *blamer* is guilty of the same thing (so standing is compromised). It needs to lack any overriding duty (like parenting) that might restore standing.

  3.  **Determine the Sequence/Structure (90 minutes):**
      *   *Total Time:* 90 mins.
      *   *Goal:* Move from intuition -> distinction -> misconceptions -> meta-question -> application.
      *   *Phase 1: Hook & Intuition (15 mins).* Present the example. Get reactions.
      *   *Phase 2: The Distinction (20 mins).* Separate "Is the blame true?" from "Do they have the right to say it?"
      *   *Phase 3: Addressing Misconceptions (30 mins).* This is the core work.
          *   Misconception 1: Hypocrisy makes the blame false.
          *   Misconception 2: You must be perfect to blame.
          *   Misconception 3: The cure is silence (vs. cleaning up act).
      *   *Phase 4: Meta-Question (15 mins).* Is standing real or just rudeness?
      *   *Phase 5: Wrap & Check (10 mins).* Final question.

  4.  **Addressing Misconceptions (Timing & Order):**
      *   *Misconception 1 (Hypocrisy = Wrong Blame):* Address this early, right after establishing the distinction. If they think the hypocrite is wrong about the ethics, the standing discussion dies.
      *   *Misconception 2 (Must be Blameless):* Address this after establishing standing exists. If standing requires perfection, no one has standing. Need to show standing is about *relevant* hypocrisy, not general sinlessness.
      *   *Misconception 3 (Cure = Stop Blaming):* Address this near the end, before the meta-question. It's about the normative implication. Should the hypocrite shut up or clean up?
      *   *Meta-Question (Is standing real?):* Slot this after the misconceptions. Once they understand what standing *would* be, ask if it's actually a thing or just an ad hominem attack.

  5.  **Drafting the Plan (incorporating constraints):**
      *   *First Sentence:* Must state the sequence and the chosen example.
      *   *Example Details:* Explain why the coworker example works (needs clear wrongness, same offense by blamer, no special authority).
      *   *Sequence:* Break down the 90 mins.
      *   *Misconception Handling:* Specify where each gets headed off.
      *   *Meta-Question:* Where to slot it.
      *   *Final Check:* One question.

  6.  **Refining the Content:**
      *   *Example:* Coworker "Alex" steals credit but lectures "Jamie" on collaboration.
      *   *Needs:* Clear violation (stealing credit is bad), Clear Hypocrisy (Alex did it too), No Override (Alex isn't Jamie's boss/mentor).
      *   *Lacks:* Personal gain from the blaming (unless relevant), unrelated sins (Alex shouldn't be blamed for being late if blaming about credit).
      *   *Sequence:*
          1.  Intro/Example (15m)
          2.  Distinction (Truth vs. Standing) (20m)
          3.  Misconception 1 (Truth) (10m)
          4.  Misconception 2 (Perfection) (10m)
          5.  Misconception 3 (Cure) (15m)
          6.  Meta-Question (Real vs. Rudeness) (10m)
          7.  Closing/Check (10m)
      *   *Wait, check timing:* 90 mins total.
      *   *Refining Misconception 3:* The user half-believes the cure is to stop blaming. I need to make sure the plan guides them to see that cleaning up the act restores standing.
      *   *Refining Meta-Question:* Is it a moral phenomenon or just a rude deflection? This fits well after discussing the "cure."

  7.  **Final Review against Constraints:**
      *   First sentence bottom line? Yes.
      *   No preamble? Yes.
      *   No academic literature? Yes.
      *   Address example choice? Yes.
      *   Address misconceptions order? Yes.
      *   Address meta-question slot? Yes.
      *   One final check question? Yes.

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   Make sure the first sentence is punchy and covers the sequence + example.
      *   Ensure the reasoning explains *why* the sequence is ordered that way (scaffolding).
      *   Be precise about the example criteria.
      *   Ensure the misconceptions are mapped to specific time slots.

      *Drafting First Sentence:* Use the coworker credit-stealing example and structure the session as Intuition -> Distinction -> Misconceptions -> Meta-Status -> Application.

      *Drafting Example Criteria:* Needs identical wrongdoing, no authority differential, clear moral violation. Lacks unrelated sins or paternalistic duty.

      *Drafting Misconception Order:*
      1. Hypocrisy invalidates the claim (Truth vs. Standing).
      2. Must be perfect to blame (Relevance).
      3. Cure is silence (Clean up vs. Shut up).
      *Meta-Question:* After misconceptions, before close.

      *Drafting Final Question:* Needs to test the distinction. "If Alex stops stealing credit but doesn't apologize, can they blame Jamie tomorrow?"

      *Let's polish the timing.* 90 minutes is tight for all this. Need to keep the intro crisp.
      0-15: Case Study.
      15-35: The Distinction (Truth vs. Standing).
      35-50: Misconception 1 & 2 (Truth & Perfection).
      50-65: Misconception 3 (The Cure).
      65-80: Meta-Question (Real vs. Rudeness).
      80-90: Wrap & Check.

