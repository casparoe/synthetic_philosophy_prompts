answer: |-
  Use the coworker credit-stealing example and structure the session as Intuition → Distinction → Misconceptions → Meta-Status → Application to ensure the concept of standing lands before you challenge its validity.

  **The Carrier Example**
  Choose the coworker who steals credit but preaches collaboration. For this to work, the example needs three specific features: the wrongdoing must be unambiguous (stealing credit is clearly bad), the blamer's violation must be identical (they also steal credit), and there must be no authority override (they are peers, not parent/child or manager/report). It needs to lack any paternalistic duty; unlike the smoking parent, the coworker has no special obligation to protect the other person that might trump their own hypocrisy. This isolates the moral standing without the noise of "I know better because I suffered."

  **The Sequence (90 Minutes)**

  **0–15 mins: The Intuition Pump**
  Present the case study without using the word "hypocrisy" yet. Ask the group how they react to the blamer. You are looking for the visceral sense that something is off, even if the blame is accurate. Do not define terms yet; let them feel the tension between "they're right about the ethics" and "they have no right to say it."

  **15–35 mins: The Distinction (Truth vs. Standing)**
  Formalize the feeling from the first segment. Draw a line on a whiteboard: Left side is "Is the blame correct?" (Target), Right side is "Is the blamer permitted to speak?" (Standing). Use the example to show how one can be Yes/Yes, Yes/No, No/Yes, or No/No. This must happen before addressing misconceptions, because if they don't grasp the distinction, they will treat all objections as claims about truth.

  **35–50 mins: Misconceptions 1 & 2 (Truth and Perfection)**
  Address the idea that hypocrisy makes the blame false immediately after establishing the distinction. If they conflate standing with truth, the rest of the session fails. Use the whiteboard to show that a liar can tell the truth. Next, tackle the "must be blameless" error. Ask if someone who speeds can blame a murderer. This clarifies that standing is lost only through *relevant* hypocrisy, not general sinlessness. Slotting this here prevents them from thinking standing is an impossible bar to clear.

  **50–65 mins: Misconception 3 (The Cure)**
  This is the pivot point for your own hesitation. Pose the question: "If the hypocrite wants to blame legitimately, must they shut up forever?" Guide them to see that cleaning up their own behavior restores standing. If the cure were only silence, hypocrisy would be a permanent moral exile. By placing this after the "Perfection" misconception, they can see that standing is dynamic—you lose it by doing the wrong, you regain it by stopping the wrong.

  **65–80 mins: The Meta-Question (Real vs. Rudeness)**
  Now ask whether standing is a real moral phenomenon or just a rude deflection. Slot this here because they need to understand what standing *would* be before debating if it exists. If you ask this too early, they'll dismiss it as mere etiquette. Push them on whether the hypocrite's blame actually harms the moral conversation or just annoys the listener.

  **80–90 mins: Wrap and Check**
  Summarize the key takeaway: You can be right about the wrong but wrong to say it.

  **Final Check Question**
  "If the credit-stealing coworker stops stealing credit today but never admits to their past theft, do they have the standing to call out a thief tomorrow?" (The desired consensus is yes, confirming that standing depends on current alignment with the norm, not moral purity.)
