      *   The user is essentially asking about the *Boundary Problem* in democratic theory.
      *   **Sam's Rule:** The *All-Affected Principle* (AAP).
          *   *Strength:* Intuitively fair. If it impacts you, you should have a voice.
          *   *Weakness:* Infinite regress. Everything affects everything (butterfly effect). Who defines "affected"? Does the courier count? Does the person who *might* have bought a flat count?
