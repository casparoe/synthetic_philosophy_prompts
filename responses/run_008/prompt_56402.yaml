answer: |-
  Right, let's have a proper look at this. You've stumbled into what political philosophers call the 'Boundary Problem', and it's one of the trickiest bits of democratic theory. It sounds like your courtyard dispute has turned into a seminar on political legitimacy, which is a classic way for a housing co-op meeting to go off the rails.

  To answer your main question straight away: there is no perfect, clean principle that solves this without some messy fudging. However, we can assess your friends' rules to see where they break, and then look for a 'principled fudge' that might actually work for a Manchester mill conversion.

  ### Sam's Rule: The 'All-Affected' Principle

  Your friend Sam is arguing for what's known as the **All-Affected Principle**. The idea is that anyone whose interests are impacted by a decision should have a say in making it. It sounds wonderfully democratic and inclusive, and on the surface, it feels morally robust.

  **Why it feels right:**
  It captures the tenants perfectly. They live there, they walk through the courtyard daily, and a bike shed affects their quality of life just as much as it affects an owner-occupier. It also captures the café owner; if their view is ruined, their business might suffer.

  **Where it breaks (pushing it hard):**
  The problem, as your other friend hinted, is that 'affected' is a slippery slope. In a connected world, almost everything affects everyone.
  *   **The Courier:** If you build the bike shed, a courier might have to walk an extra ten seconds around the corner. Are they affected? Technically, yes. Do they get a vote? If Sam says yes, then every delivery driver in Ancoats gets a say in your service charge.
  *   **The Potential Buyer:** Your partner raised this. What about the person who *would* have bought a flat if it had a garden, but now won't? Are they affected by the loss of potential value?
  *   **The Butterfly Effect:** If you pave over the garden, maybe fewer bees nest there. Do the local beekeepers get a vote? Do the people who like looking at bees?

  If you apply Sam's rule strictly, the voting boundary dissolves. You end up needing a global referendum for a local decision. It becomes unworkable because you can never draw a line around who counts. Sam might feel smug, but his rule lacks a mechanism for *limiting* the electorate.

  ### The Other Friend's Rule: The 'All-Subjected' Principle

  This friend is arguing for the **All-Subjected Principle**. This suggests that voting rights belong to those who are legally bound by the rules or subject to the coercion of the governing body.

  **Why it feels right:**
  It's clean. It aligns with legal ownership. You own the mill, you vote. It stops the courier from having a say because the co-op can't fine the courier or force them to pay for the bike shed.

  **Where it breaks:**
  It's too rigid for a community setting.
  *   **The Tenants:** In many co-ops, tenants are legally distinct from members. Under this rule, they have no vote because they aren't 'subject' to the co-op's constitution in the same way members are. Yet, they are the ones living with the consequences. Excluding them creates a class system within the building, which breeds resentment.
  *   **The Café Owner:** They aren't subject to your co-op's rules. You can't fine them. So they get no say. But if your bin area smells terrible and drifts onto their terrace, you've effectively damaged their property rights without them having a voice. That's a recipe for a planning dispute or neighbourly war.

  ### Your Partner's Point: Intergenerational Equity

  Your partner has hit on something crucial that both friends missed: **Time.**
  Current members are temporary custodians. A decision to concrete over a garden binds future members who aren't here to vote. If you sell up in two years, you leave the mess (or the benefit) behind. This suggests that the voting body has a duty of **trusteeship**. You aren't just voting for what you want now; you're voting on behalf of the future stability of the co-op.

  ### So, is there a principled way forward?

  Since neither of your friends' rules works perfectly on its own, you need a hybrid approach. In political theory, this is often called a **Stakeholder Model**. It acknowledges that while legal ownership grants the *right* to vote, moral legitimacy requires *consultation*.

  Here is how you might apply a principled fudge to your courtyard:

  1.  **The Vote (Legal Boundary):** The actual binding vote must remain with the co-op members. This satisfies the 'All-Subjected' principle and the legal reality of the property title. If you give votes to non-members, you risk legal complications regarding liability and ownership.
  2.  **The Consultation (Moral Boundary):** Before the vote is taken, you apply Sam's logic to the *process*, not the *ballot*.
      *   **Tenants:** Even if they can't vote, their status should be elevated. Perhaps the committee treats their consensus as a 'binding advisory'. If 90% of tenants hate the bike shed, the members should be morally bound to respect that, even if they technically have the numbers to override it.
      *   **The Café:** This falls under 'neighbourly relations'. You don't give them a vote, but you treat them as a statutory consultee, much like the local council would during planning permission. If the café owner can demonstrate tangible harm (loss of trade, visual blight), the co-op has a duty to mitigate it.
  3.  **The Future (Trusteeship):** When debating, frame the arguments around the long-term value of the building. A garden might add more resale value in five years than bike storage; or bike storage might make the flats more lettable. This forces the 'absentee landlords' to think about the asset's health, not just their current convenience.

  ### The Verdict

  Sam's rule is morally attractive but practically impossible without limits. Your other friend's rule is legally clean but socially brittle.

  The most honest answer is that it *is* going to be a fudge, but it doesn't have to be a cynical one. You can acknowledge that while only members *can* vote, the decision is only *legitimate* if the people who live there (tenants) and the immediate neighbours (café) have been properly heard.

  In a small co-op of 40 units, social cohesion is your most valuable asset. If you win the vote but the tenants hate you and the café owner calls the council about planning violations, you've lost.

  My advice? Keep the vote with the members (it's their asset), but make it a condition of the vote that a formal consultation with tenants and neighbours is published first. If the members vote against the overwhelming weight of that consultation, they should have to publicly justify why. That keeps the legal boundary clear but respects the human reality.

  Hope that helps untangle the knot. Good luck with the meeting — may the rain hold off for the courtyard, whichever way it goes.

  Ta!
