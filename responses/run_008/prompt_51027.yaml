s don't appoint: his vote looks like an error or an unspoken reservation, and it seems wrong for the premise-majority machinery to override a majority that includes him. But if that is right, the rationale I gave for case two, official rule plus official inputs, cannot be the whole story, since it delivers the same verdict in both. Finally, a case I genuinely cannot decide: the same committee when the rule book is silent on how votes are combined and the chair must simply declare a result. Is there a principle that fits all my verdicts, or close to it? State it precisely enough to decide new cases, tell me what it says about the silent-rulebook case, and be honest about which of my verdicts it cannot accommodate — I would rather know whether to keep them all at the price of a baroque principle or accept a simpler one that overturns a verdict. Please answer in continuous prose only, with no headings, bullet points, bold text, or tables, as you would in a letter to a colleague.
