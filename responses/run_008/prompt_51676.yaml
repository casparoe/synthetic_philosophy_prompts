answer: |-
  **Project Title:** Distinguishing Token and Type Objections in Repugnant Markets

  **Research Question**
  Which of the standard repugnant markets—specifically kidney sales, vote selling, and price gouging—are wrong for reasons that would survive the elimination of exploitation and desperation, and what does that tell us about the structure of the corruption objection?

  **Project Summary**
  The philosophical debate regarding repugnant markets is currently stalled between two dominant positions. The first, the exploitation objection, argues that these markets are wrongful because they exploit the seller's desperation or the buyer's emergency. The second, the corruption objection, argues that admitting certain goods into the market degrades the meaning of the good itself. However, these positions are often talked past one another. The corruption objection is frequently asserted at a level of generality that makes it unfalsifiable, while the exploitation objection is precise but cannot explain the residual unease surrounding uncoerced, well-remunerated exchanges.

  My dissertation proposes that the literature runs together two distinct objections that must be prised apart. The first is a **token objection**: the wrong lies in the specific transaction, typically due to coercion or informational asymmetry. If one removed the desperation—imagining a well-compensated, entirely free and informed seller—the wrong would disappear. The second is a **type objection**: the wrong lies in the practice itself. Admitting the good into the market changes what the good is, so that the wrong persists even where no one is exploited.

  My core contribution is a 'sorting test'. For each market, I ask whether the wrong survives the removal of desperation. My working hypothesis is that the cases sort differently than the literature assumes. Vote selling seems wrong even when the seller is wealthy and uncoerced, suggesting a type objection. Conversely, price gouging seems to lose its moral sting once genuine scarcity rationing is at issue, suggesting the objection was a token one all along. Kidney sales sit awkwardly in the middle. By applying this test, I aim to build a taxonomy that both sides of the debate could accept, clarifying precisely where the market boundary lies.

  **Methodology and Work Plan**
  This nine-month fellowship will be dedicated to constructing this taxonomy and stress-testing it against the hardest objections. I have already drafted a chapter establishing the exploitation framework; the fellowship period will focus on the corruption objection and the interaction between the two.

  *Months 1–3: Constructing and Stress-Testing the Sorting Test*
  The initial phase will focus on refining the conceptual distinction between token and type objections. The primary methodological challenge is that our intuitions about uncoerced sales are often contaminated by the actual background of desperation in real-world practices. It is difficult to imagine a vote seller who is truly indifferent to the money, or a kidney seller who faces no economic pressure. I will spend these three months developing thought experiments designed to isolate the type objection from these background conditions. I will analyse whether the 'wrongness' persists in idealised scenarios where background justice is assumed. If the intuition vanishes in the idealised case, the objection is likely a token objection masquerading as a type objection.

  *Months 4–6: Application to Case Studies and Crowding-Out Effects*
  In the second phase, I will apply the sorting test to the three core case studies: vote selling, price gouging, and kidney sales. This section will also address the 'crowding-out' phenomenon familiar from the blood-donation literature: the worry that markets in one good can corrode norms in adjacent goods. A critical question here is whether crowding-out is a genuinely type-level wrong or merely a token effect at scale. For instance, if paying for votes reduces civic engagement among non-sellers, is this a corruption of the good itself (type), or simply an aggregate of negative externalities (token)? I will argue that distinguishing these is vital for policy. If the harm is aggregate, it might be mitigated by regulation; if it is constitutive, the market must be blocked entirely. By month six, I aim to have complete drafts of the three case study chapters.

  *Months 7–9: The Liberal Neutrality Objection*
  The final phase addresses the hardest objection I anticipate: that type objections violate liberal neutrality. If all parties consent and no third party is harmed, the mere change in a good's meaning seems to be no one's business. A liberal state should not enforce a specific conception of the good life upon consenting adults. I will spend these three months developing a defence against this charge. I intend to argue that certain meanings are public goods necessary for the stability of liberal institutions themselves, rather than perfectionist impositions. For example, the meaning of a vote is constitutive of political equality; altering it harms the structure of agency even if no specific individual is worsened. This chapter will serve as the theoretical capstone of the dissertation.

  **Risk Management and Failure Conditions**
  Intellectual honesty requires defining what would count as this project failing. My hypothesis rests on the claim that type objections are distinct and irreducible. However, it is possible that upon rigorous stress-testing, the type objection reduces without remainder to compounded token effects. That is, what looks like semantic corruption might simply be the aggregate of many small exploitations or externalities.

  Should this occur, I will pivot. The dissertation would become a defensive argument for that reduction, demonstrating that the corruption objection is unnecessary once exploitation and externalities are fully accounted for. This would still be a significant contribution, as it would parsimoniously clear the field of vague moralising. However, my aim is to show that a residual category of wrongs remains. I will monitor this risk during the first three months; if the sorting test fails to isolate any type-level wrongs in the preliminary thought experiments, I will adjust the work plan to focus on the reductionist argument earlier in the timeline.

  **Feasibility and Scope**
  This proposal is scoped realistically for a nine-month completion fellowship. I am a third-year PhD student and have already completed the literature review and a chapter on the exploitation objection. Therefore, the remaining work is concentrated on the corruption objection and the synthesis of the two. I am not promising a complete theory of commodification across all goods; rather, I am focusing on the standard trio in the literature to establish a methodological framework. By limiting the case studies to three well-defined markets, I can ensure depth rather than breadth. The month-by-month plan allows for flexibility should the argument develop in unexpected directions, but the deliverable—a complete dissertation draft—will be achieved within the fellowship window.
