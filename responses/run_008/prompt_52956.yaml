answer: |-
  This is a classic "revealed preference" problem. You have a dataset of six decisions, three competing hypotheses (Proximity, Veto, Concessions), and a new data point that sits at the intersection of all three conflict lines.

  Here is the breakdown of the council's algorithm, the prediction, the test case, and the normative take.

  ### 1. The Council's Hidden Rule: "The Perimeter Defense"

  None of your three hypotheses (Proximity, Veto, Concessions) fully explain the dataset alone. The council is running a hierarchical algorithm I'd call **The Perimeter Defense.**

  *   **Layer 1 (Hard Constraint): Public Asset Preservation.** (Case 5). You do not touch public open space, even if no neighbors object. This is a hard veto from other city institutions (Parks Commission).
  *   **Layer 2 (Soft Constraint): The Growth Container.** (Case 1, 4). Density is *encouraged* inside designated containers (Downtown, Arterials, Transit Nodes). Inside these containers, the council has the spine to override business associations (Case 1) and extract concessions (Case 4).
  *   **Layer 3 (The Tie-Breaker): The Incumbent Veto.** (Case 3). Outside the Growth Containers (i.e., Single-Family interiors), the default is "No." Organized opposition makes this a hard "No." Unorganized/low-impact (ADUs) makes it a "Yes."
  *   **Layer 4 (The Exception): Moral Necessity.** (Case 6). Social infrastructure (shelters) can breach the perimeter if there is "nowhere else," overriding scattered opposition.

  **The Church Case Analysis:**
  *   **Container Status:** It is *one block off* the arterial, but technically **Single-Family Zoned**. This puts it outside the Growth Container (Layer 2).
  *   **Opposition:** **Organized.** This triggers Layer 3 (The Tie-Breaker).
  *   **Concessions:** It is affordable (60% AMI). This is a Layer 2 feature applied to a Layer 3 location.
  *   **Necessity:** It is housing, not a shelter. It does not meet the "nowhere else" threshold of Case 6.

  **Prediction:** **Rejected (4-3 or 5-2).**

  **Reasoning:** The council treats "Single-Family Zone" as a political perimeter, not just a legal one. Case 3 is the strongest prior here: a denser project on the *edge* of SF was killed by organized neighbors. The Church project is *inside* the SF zone (despite being near the arterial). While the affordability (Concessions Principle) is a strong positive signal, the council has only shown willingness to trade concessions for density *inside* the Growth Containers (Case 4, Downtown). They have not shown a willingness to use affordability to breach the SF Perimeter against organized opposition. The "Smart Growth" mayor likely lacks the votes to override the councilmembers protecting their neighborhood bases.

  ### 2. Closest Analog: Case 3 (The 5-Story SF Edge Rejection)

  **Why:** Both cases involve inserting multi-unit density into a zone perceived by the public as "Single-Family." Both face organized opposition citing "character" and "parking."
  **The Difference:** Case 3 was likely market-rate; the Church case is affordable.
  **Why Case 3 still wins as an analog:** Case 4 (Downtown Tower) shows that affordability buys you latitude *Downtown*. Case 1 (Arterial Upzoning) shows density is okay *on the arterial*. But Case 3 establishes that once you step off the arterial into the "neighborhood," the Incumbent Veto activates. The Church lot is legally SF zoned. To the council, approving this looks less like "Arterial Density" (Case 1) and more like "SF Intrusion" (Case 3). The affordability concession is insufficient to override the political cost of angering organized voters in an SF zone.

  ### 3. The High-Information Test Case

  To distinguish between **Proximity (A)**, **Incumbent Veto (B)**, and **Concessions (C)**, you need to isolate the variables. The Church case confounds all three.

  **The Test Case:**
  > A **Market-Rate** 4-plex (Missing Middle) on a corner lot **inside a Single-Family Zone** (3 blocks from the arterial, no transit), with **NO Organized Opposition** (neighbors are apathetic or supportive).

  **Why this distinguishes the rules:**
  *   **If Approved:** It falsifies the **Proximity Principle (A)**. It proves the council is willing to put density in SF zones if the location is legal, *provided* the Incumbent Veto isn't triggered. This suggests Rule (B) is the dominant driver.
  *   **If Rejected:** It falsifies the **Incumbent Veto Principle (B)** as the sole driver. It proves that **Zone Fidelity (A)** is the hard constraint. Even if neighbors don't care, the council will not vote for density in SF zones.
  *   *(Note: Concessions (C) is held constant at zero here, so we learn if affordability is a prerequisite for SF intrusion.)*

  **Alternative Test (Testing the Veto strength):**
  > A **Market-Rate** 6-story building **On The Arterial** (Case 1 location) with **Organized Opposition**.
  *   **If Approved:** Proximity > Veto. The "Smart Growth" plan is real.
  *   **If Rejected:** Veto > Proximity. The "Smart Growth" plan is only for unopposed projects.

  ### 4. The Normative Take: Democracy or Structural Bias?

  You asked if the Incumbent Veto is democracy working as intended or structural bias. From a rationalist/systems perspective: **It is structural bias masquerading as procedural democracy.**

  Here is why:

  1.  **Gerrymandered Stakeholders:** The "affected parties" in a zoning hearing are defined procedurally as *current* property owners within a notification radius. The future tenants (the 70 households who would live there) are affected *more* (it is their home vs. their view) but have zero standing. The system weights the interests of the status quo at 100% and the interests of the potential future at 0%.
  2.  **Concentrated Costs, Diffuse Benefits:** The neighbors bear concentrated, visible costs (parking competition, construction noise). The benefits (regional housing supply, affordability, climate goals) are diffuse and abstract. Standard democratic theory struggles here, but a "Right to the City" framework argues that housing is a prerequisite for participation. By allowing current residents to veto the housing of non-residents, the council is allowing current voters to determine the composition of the *future* electorate.
  3.  **The "Unseen" Voter:** As Bastiat might put it, the council sees the angry neighbors in matching shirts (the seen). They do not see the family that will not move to this city because rent is too high (the unseen).

  **Verdict:** It is democracy working as designed for a **property-owning oligarchy**, not a citizenry. It privileges *voice* (showing up to meetings) over *need* (requiring shelter), and since voice correlates strongly with tenure and wealth, it structurally locks in the socioeconomic status quo. If the rule is the Incumbent Veto, it is a veto held by a specific class of incumbents over the rights of successors.

  **Summary for your next meeting:** Watch the vote on the Church case. If it fails, the "Perimeter Defense" holds, and your only path forward is either changing the zoning map (Comprehensive Plan) upstream or finding sites where the neighbors are too disorganized to show up. If it passes, the Concessions Principle is stronger than you thought, and affordability is the key to unlocking the SF interior. My money is on the Perimeter holding.
