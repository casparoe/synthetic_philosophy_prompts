  **2. The Television Character: No Self.**
  This will be dismissed as a variation of Case 4 (the novel character). The "predictive work" the bible does is for the *writers*, not the character. The character has no behavior to predict; she has no causal purchase on the world. The bible is a tool for scriptwriting, not a control structure for an agent. The fact that the writers ask "what she would want" is a figure of speech; they are actually deciding what *they* will write.

  **3. The Married Couple: One Self (Shared).**
  This is the most provocative verdict. Your friend will argue that since the "unit of prediction" for their friends is the *couple*, and the "unit of narration" is the *joint notebook*, there is a single center of narrative gravity distributed across two organisms. Just as the split-brain patient (Case 1) is one self despite hemispheric division, this couple is one self despite bodily separation. The narrative is unified, and the agency is fused. She will insist this is not "two selves cooperating," but **one self** with a composite substrate.

