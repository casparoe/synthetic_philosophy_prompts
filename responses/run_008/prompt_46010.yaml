  ***

  ### Limitations Statement
  This procedure cannot detect cryptic species complexes where organisms look and act identical but are genetically distinct, nor can it verify reproductive isolation in real-time. It prioritizes data consistency over taxonomic perfection, meaning we will inevitably undercount species diversity in groups like beetles, fungi, and grasses. Tell the advisor that this protocol ensures our list is *reproducible* by next year's club, even if it isn't *definitive* by research standards; we are mapping observable biodiversity, not phylogenetic truth.
