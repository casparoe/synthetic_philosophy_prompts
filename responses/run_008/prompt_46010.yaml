prompt: |-
  I'm in the bio club at my school and every spring we do this "bioblitz" thing at the county nature preserve where we try to record every living thing we can find in 24 hours, mostly with phones and a couple borrowed macro lenses. Our advisor said last year's final list had like 40 entries that just say "beetle sp." or "some kind of fern," which is embarassing, so this year she put me in charge of "taxonomic quality control" lol, meaning I have to decide when two photos people uploaded are the same species or different ones, so the list we send to the county actually means something.

  Here's what I ran into while test-running this on last year's data: the new state field guide splits a certain ground beetle into two species based on some subtle difference in the ridges on the wing covers, and the older guide lumps them as one, and honestly nobody in our club can tell them apart from a photo. Also there's a patch of what our advisor calls "the weird sunflowers" down by the creek that she suspects are hybrids between two species planted on either side of the trail. And apparently there are these things called ring species where each neighboring population can interbreed but the two ends can't, which sounds like it would break any rule I come up with, definately. My advisor said something like "every species concept is a research program, not a definition" and then left for a meeting, which was not helpful.

  I don't need the philosophy, I need a procedure. Please write one our club can actually run on a pair of photos in like ten minutes with no DNA lab and no PhD: the questions to ask in order (appearance, range, breeding, whatever actually matters), what counts as a good enough answer at each step, where it stops with "lump them as one species" vs "split them", and where it just punts to our advisor because the question is a judgment call and not something with a right answer. Be honest about the cases where it'll give the wrong answer and we won't know. Basically: turn the whole species-concept mess into something a 16 year old with an iPad and a field guide can run, without lying to me about how clean it is.

  Format: give me the procedure as a table with columns Step, Question to ask, What counts as a yes, If yes do this, If no do this, and Who decides (club member / whole club / advisor). Then run it on three cases: (1) the ground beetles that the new guide splits and the old guide lumps, (2) the weird sunflowers by the creek that might be hybrids, and (3) a pair of nearly identical little brown moths where one only shows up at night and the other only at dawn. Present each case as a JSON object with fields "case", "decision_at_each_step", "final_call", "confidence", and "where_this_could_go_wrong". Then end with one short paragraph on what the procedure flat out can't do, so I know what to tell my advisor we're just not catching. thx
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** High school bio club member (likely 16-17 years old) in charge of "taxonomic quality control" for a Bioblitz.
      *   **Problem:** Needs a practical procedure to decide if two observations are the same species or different ones, given limited resources (phones, macro lenses, field guides, no DNA, no PhDs).
      *   **Constraints:**
          *   Must be doable in ~10 minutes per pair of photos.
          *   Must acknowledge uncertainty (no lying about cleanliness).
          *   Must handle specific tricky cases (cryptic species, hybrids, ring species/behavioral isolation).
          *   Advisor's advice was too philosophical ("research program, not a definition").
          *   **Format:**
              1.  Procedure Table (Step, Question, Yes criteria, If Yes, If No, Who Decides).
              2.  Three Case Studies in JSON format (Beetles, Sunflowers, Moths).
              3.  One short paragraph on limitations.
      *   **Tone:** Practical, honest, slightly informal but authoritative enough to be useful.

  2.  **Develop the Procedure (The "Bioblitz Triage Protocol"):**
      *   *Goal:* Distinguish species for a citizen science list, not publish a taxonomic revision. The goal is *utility* and *consistency*, not absolute biological truth.
      *   *Step 1: Morphology (The Eye Test).* Easiest first step. Do they look obviously different?
      *   *Step 2: Field Guide/Range Check.* Does the literature support splitting them? Are they in the right place?
      *   *Step 3: Context/Behavior.* Time of day, habitat, host plant.
      *   *Step 4: The "Good Enough" Threshold.* If unsure, lump for the list but flag for review.
      *   *Decision Points:* Most decisions should be club members (to learn), but hard calls go to the advisor.
      *   *Honesty:* Acknowledge that cryptic species will be missed.

      *Drafting the Table:*
      *   Step 1: Visual Morphology.
      *   Step 2: Guide/Range Consistency.
      *   Step 3: Ecological/Temporal Context.
      *   Step 4: The "Split Threshold" (Is the difference consistent?).
      *   Step 5: Final Disposition (Lump, Split, or Flag).

  3.  **Develop the Case Studies (JSON):**
      *   *Case 1: Ground Beetles (Cryptic Species).*
          *   Visuals: Look identical to teens.
          *   Guide: Conflict (Old vs. New).
          *   Decision: Lump for the list (pragmatism), flag for advisor.
          *   Confidence: Low.
          *   Error: Might be missing a rare species.
      *   *Case 2: Sunflowers (Hybrids).*
          *   Visuals: Intermediate.
          *   Context: Growing between parents.
          *   Decision: Label as "Hybrid/Complex" or lump with parent if list doesn't allow hybrids. Let's say "Flag as Hybrid Complex".
          *   Confidence: Medium.
          *   Error: Might be a distinct third species.
      *   *Case 3: Moths (Temporal Isolation).*
          *   Visuals: Identical.
          *   Context: Dawn vs. Dusk.
          *   Decision: Split based on behavior (ecological species concept).
          *   Confidence: Medium-High.
          *   Error: Could be same species with varied activity.

  4.  **Drafting the Limitations Paragraph:**
      *   Must be honest.
      *   Can't detect cryptic species without DNA.
      *   Can't prove reproductive isolation in 24 hours.
      *   Hybrids are messy.
      *   Tell the advisor: "We are prioritizing consistency over absolute taxonomic accuracy."

  5.  **Review and Refine:**
      *   *Check Format:* Table first, then JSON, then Paragraph.
      *   *Check Tone:* Is it too academic? Keep it grounded. "Don't sweat the small stuff" vibe but scientifically literate.
      *   *Check Constraints:* 10 minutes? Yes. No DNA? Yes.
      *   *Self-Correction on JSON:* Ensure valid JSON syntax (quotes, braces, no trailing commas).
      *   *Self-Correction on Table:* Make sure "Who Decides" is realistic. Club members do the work, advisor resolves conflicts.

  6.  **Final Polish:**
      *   Ensure the JSON keys match the prompt requirements ("case", "decision_at_each_step", "final_call", "confidence", "where_this_could_go_wrong").
      *   Ensure the table columns match the prompt requirements.
      *   Make sure the "Where this could go wrong" sections are honest about the biological reality vs. the practical limitation.

      *(Self-Correction during drafting the table)*: I need to make sure the "If Yes/No" logic flows logically towards a Lump/Split decision.
      *   Step 1: Obvious diff? Yes -> Split. No -> Next.
      *   Step 2: Guide says split? Yes -> Split. No -> Next.
      *   Step 3: Different niche/time? Yes -> Split (provisional). No -> Next.
      *   Step 4: Uncertainty? -> Lump & Flag.

      *(Refining the JSON)*: The prompt asks for "decision_at_each_step". I should map the table steps to the JSON output.

      *(Refining the Limitations)*: Keep it to one paragraph as requested.

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  ### Bioblitz Taxonomic Triage Protocol (v1.0)

  | Step | Question to ask | What counts as a "yes" | If yes do this | If no do this | Who decides |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Morphology:** Do the photos show consistent, visible physical differences? | Distinct color patterns, size >20% different, or structural shapes (antennae, leaf shape) clearly differ. | **Tentative Split.** Tag as Species A and Species B. | **Tentative Lump.** Treat as same species for now. | Club Member |
  | **2** | **Literature/Range:** Does the current field guide or range map support two species here? | Guide lists two species for this county OR range maps overlap here. | **Confirm Split.** Keep separate tags. | **Revert to Lump.** Assume it's the common species unless Step 3 says otherwise. | Club Member |
  | **3** | **Ecology/Time:** Are they found in different micro-habitats or active at different times? | One is aquatic/one terrestrial, OR one strictly night/one strictly day, OR different host plants. | **Provisional Split.** Tag as "Sp. A (morph)" and "Sp. B (morph)". | **Proceed to Step 4.** | Club Member |
  | **4** | **Confidence Check:** Can you explain *why* they are different to a stranger using only the photo? | You can circle the specific ridge, spot, or vein that differs. | **Final Split.** Add to final list as separate entries. | **Final Lump.** Merge entries. Add note: "Variable morphology." | Whole Club |
  | **5** | **The "Weird" Flag:** Is the difference subtle, contradictory, or involves hybrids? | Differences are microscopic, guides conflict, or plants look intermediate. | **Flag for Advisor.** Do not finalize list entry yet. | **Submit List.** | Advisor |

  ***

