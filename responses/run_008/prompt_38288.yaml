prompt: |-
  I run a small mediation practice that specializes in co-founder and partnership dissolutions — disputes where the parties will spend a day with me, will not retain experts, and need to leave with a signed term sheet. Increasingly I find myself improvising what amount to intuited fair splits, and I would like something firmer: a decision procedure built on two-person bargaining theory, specifically the Nash bargaining solution and the Kalai–Smorodinsky alternative, that I can actually run inside a single day-long session.

  My setting and constraints, so the procedure fits them: I handle perhaps four or five of these mediations a quarter; the parties are non-technical, emotional, and strategic; I get roughly three hours of joint session and an hour of private caucus with each side; the disputes involve money plus a few indivisible non-monetary issues (title to the codebase, a non-compete, the client list, who tells the investors); and my usual output is a mediator's proposal — one package each side can accept or reject. I understand that the two solutions agree in symmetric cases and come apart in others, and that the divergence is really a divergence about axioms — one solution gives up independence of irrelevant alternatives, the other gives up monotonicity with respect to a single bargainer's opportunities — but I do not know how to convert that into advice at a table with two angry former friends in it.

  Please write me the procedure, covering:

  1. The steps in order, from opening joint session to final proposal: how to elicit each party's disagreement point (what realistically happens if we fail), how to handle parties who inflate their walk-away alternatives, how to build a candidate set of packages when most issues are indivisible, and how to extract rough cardinal preference information from people who will never submit to a formal utility elicitation — for instance, having each side allocate a hundred points across issues, or choose between whole packages. For each step, say what a sufficient answer looks like and what an insufficient one looks like.

  2. Where the choice between the two solutions matters and where it does not: give me a practical test, runnable on the elicited numbers, that tells me when Nash and Kalai–Smorodinsky will come apart on a given dispute — I gather it has something to do with one party's ideal outcome being far larger than the other's — and what to recommend when they do. Is there a principled basis for choosing between them in the room, or is that precisely the point where the procedure hands the decision back to me as a judgment call? Be honest about which it is.

  3. The failure modes. The scale-invariance axioms half-remembered from my economics training seem to promise that units do not matter, but I suspect they protect the theorist, not the mediator: tell me exactly what normalization I must impose on the parties' reported numbers before computing either solution, and precisely what a party can achieve by misreporting the shape of their preferences or the size of their best case under each solution. Also: what to do when one party's disagreement point includes the option of destroying value out of spite — should the procedure count that as part of their alternatives, and if not, on what grounds do I exclude it?

  4. Three worked cases, run through the procedure end to end. First: two founders dissolving a company, dividing cash, IP, and a non-compete, where one has a standing job offer and the other does not. Second: two equal shareholders separating, where one will keep operating the business and the other will exit — the continuing owner's upside from any settlement is much larger than the exiting owner's. Third: a case where the procedure gives an answer I will not like. Choose that case yourself, though I suspect it is the one where Kalai–Smorodinsky hands the greedier bargainer more money simply because they claimed a bigger number as their best case, or where a party is rewarded for an inflated walk-away. Run it honestly and tell me what I should say to the client who ends up with the short end of that arithmetic.

  5. A closing statement of what the procedure cannot do: where the axioms are doing normative work that no amount of elicitation can justify, and where a mediator who follows this procedure faithfully will still be imposing values rather than applying fairness — so I know which parts of my recommendation are mine.

  I would rather have the real Nash and Kalai–Smorodinsky solutions with their real axioms, however awkward they are at a mediation table, than a split-the-difference heuristic wearing their names.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **User:** Mediator specializing in co-founder/partnership dissolutions.
      *   **Constraints:** Small practice (4-5 cases/quarter), 1-day sessions (3h joint, 2x1h caucus), non-technical/emotional parties, no experts, need signed term sheet same day. Output is a Mediator's Proposal.
      *   **Goal:** A decision procedure based on Nash Bargaining Solution (NBS) and Kalai-Smorodinsky (KS) to replace intuition with a firmer framework.
      *   **Requirements:**
          1.  Step-by-step procedure (Opening -> Proposal) including elicitation of disagreement points, handling inflation, indivisible issues, and cardinal preference approximation. Define sufficient/insufficient answers.
          2.  When NBS vs. KS matters: A practical test for divergence, recommendation on choice, and honesty about whether it's a judgment call.
          3.  Failure Modes: Normalization requirements, manipulation risks (misreporting preferences/BATNAs), handling spite/destruction threats.
          4.  Three Worked Cases: (1) Job offer asymmetry, (2) Continuing vs. Exiting owner (asymmetric upside), (3) A case where the procedure yields an unpalatable result (honesty about the "short end").
          5.  Closing Statement: Limitations, normative impositions, where the mediator's values still dominate.
      *   **Tone:** Rigorous, honest, practical, not watering down the theory.

  2.  **Theoretical Grounding (Mental Check):**

      *   **Nash Bargaining Solution (NBS):** Maximizes the product of gains over the disagreement point $(u_1 - d_1)(u_2 - d_2)$. Axioms: Pareto Efficiency, Symmetry, Independence of Irrelevant Alternatives (IIA), Invariance to Affine Transformations.
      *   **Kalai-Smorodinsky (KS):** Maintains the ratio of maximum possible gains. If Player 1 can gain 100 and Player 2 can gain 50, KS tries to keep the ratio of *actual* gains at 2:1. Axioms: Pareto Efficiency, Symmetry, Invariance, Individual Monotonicity (replaces IIA).
      *   **Key Difference:** NBS is sensitive to the *shape* of the feasible utility frontier (curvature). KS is sensitive to the *ideal points* (utopia point) regardless of the frontier's curvature in between.
      *   **Mediation Context:** We don't have continuous utility functions. We have discrete packages. We need to approximate utilities.

  3.  **Drafting Section 1: The Procedure:**

      *   *Phase 1: Disagreement Point (BATNA).* Needs to be realistic, not aspirational.
      *   *Phase 2: The Feasible Set.* Since issues are indivisible, we need to generate packages.
      *   *Phase 3: Valuation.* 100-point allocation is standard but flawed (interval vs. ordinal). Need to check for intensity.
      *   *Phase 4: Calculation & Proposal.*
      *   *Sufficient/Insufficient:* Crucial for a mediator. "I'll sue" is insufficient. "I have a retainer with X firm and estimated costs are Y" is better.

  4.  **Drafting Section 2: NBS vs. KS Choice:**

      *   *Divergence:* Happens when the feasible frontier is non-linear (concave/convex) or when ideal points are asymmetric relative to the frontier's shape. In discrete cases, it's about how "efficient" packages align with the ideal point ratios.
      *   *Practical Test:* Compare the ratio of maximum gains. If the package that maximizes the product (NBS) differs from the package that matches the ideal gain ratio (KS), they diverge.
      *   *Recommendation:* NBS punishes risk aversion (implicitly) and rewards "mid-range" compromises. KS rewards the party with the higher *potential* upside. In co-founder splits, KS often feels more "proportional to contribution/upside," while NBS feels more "split the surplus."
      *   *Honesty:* It *is* a judgment call. The axioms don't tell you which is "fair," only which is "consistent."

  5.  **Drafting Section 3: Failure Modes & Normalization:**

      *   *Normalization:* Utility is arbitrary. Must normalize $d_i = 0$ and $max(u_i) = 1$ (or 100) *for the calculation*.
      *   *Manipulation:* Inflating BATNA ($d_i$) shrinks the surplus. Inflating Ideal Point ($max(u_i)$) helps in KS, doesn't help in NBS (unless it changes the feasible set).
      *   *Spite:* Destruction of value is usually not credible or enforceable. Exclude threats that violate Pareto efficiency if carried out. "I will burn the code" is a threat, not a BATNA, unless they literally can.

  6.  **Drafting Section 4: Worked Cases:**

      *   *Case 1 (Job Offer):* Asymmetric BATNAs. One has safety, one doesn't. NBS might favor the desperate one more than KS? Actually, NBS maximizes product. If one has $d=0$ and other $d=50k$, the surplus is calculated from there.
      *   *Case 2 (Continuing vs. Exiting):* Asymmetric Upside. Continuing owner gets millions later; exiting owner gets cash now. KS will favor the continuing owner because their "ideal" gain is huge. NBS might pull it back toward the middle depending on curvature.
      *   *Case 3 (The "Unpalatable" One):* Need a case where KS rewards bluffs or NBS punishes risk aversion too harshly. Let's go with a case where one party has a wildly inflated "Ideal" that isn't realistic, but KS honors the *ratio* of ideals. Or, a case where NBS forces a settlement that leaves one party barely above BATNA because the other party has a much steeper utility curve. Let's choose: KS rewarding a party for having a "higher ceiling" even if that ceiling is largely luck-based, leaving the other with a raw deal relative to effort. Or better: A case where the "Disagreement Point" is hard to pin down, and NBS punishes the party who was more honest about their weakness. Let's go with the "Inflated Ideal" problem in KS.

  7.  **Drafting Section 5: Limitations:**

      *   Axioms are not morality.
      *   Utility elicitation is noisy.
      *   The Mediator chooses the axioms (NBS vs KS), which is a value judgment.

  8.  **Refining and Polishing:**

      *   *Tone Check:* Is it too academic? Need to make it actionable for a mediator. Use terms like "Mediator's Proposal" and "Caucus."
      *   *Math Check:* Ensure the distinction between NBS (maximize product of surplus) and KS (ratio of max gains) is clear in the discrete context.
      *   *Constraint Check:* Did I cover the 1-day limit? Yes, keep elicitation simple (100 points).
      *   *Honesty:* The prompt asks for honesty about where the procedure hands decision back to the mediator. I must emphasize that *choosing the solution concept* is the mediator's ethical burden.

  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe suggest continuous utility functions.
      *   *Correction:* No, prompt says "indivisible non-monetary issues." Must use discrete packages. I need to explain how to map discrete packages to utility scores.
      *   *Initial thought:* Suggest using NBS always.
      *   *Correction:* Prompt asks for the divergence. I need to explain *when* they differ. In discrete cases, they often pick different packages from the Pareto frontier.
      *   *Normalization:* Crucial. If Party A uses 0-100 scale and Party B uses 0-10 scale, math breaks. Must normalize to [0,1] based on their own reported min/max *within the feasible set*.
      *   *Spite:* If a partner threatens to delete code, that's a crime. It shouldn't be a BATNA. It's a leverage tactic. I need to advise excluding illegal/unenforceable threats from $d$.

  10. **Final Review against Prompt:**
      *   Steps order? Yes.
      *   Sufficient/Insufficient? Yes.
      *   NBS vs KS test? Yes.
      *   Normalization/Manipulation? Yes.
      *   3 Cases (Job, Continue/Exit, Unpalatable)? Yes.
      *   Closing Limitations? Yes.

  (Proceed to generate output based on these structured thoughts.)
answer: |-
  This procedure is designed for a single-day mediation of co-founder dissolutions. It translates bargaining theory into a workflow that respects your time limits and the non-technical nature of the parties. It does not hide the normative choices; it exposes them so you can manage them.

  ### 1. The Procedure: From Opening to Proposal

  **Phase 1: Establishing the Disagreement Point ($d$)**
  *Time: First 45 mins of Joint Session + Caucus*

  You need the "status quo if no deal." In theory, this is $d = (d_1, d_2)$. In practice, this is the cost of litigation/liquidation.

  *   **Step:** Ask each party privately in caucus: "If you leave this room without a deal, exactly what happens tomorrow? Be specific about costs, time, and probability of recovery."
  *   **Sufficient Answer:** "I file a dissolution suit in Delaware. Legal fees will be \$50k. I estimate a 40% chance of recovering my capital contribution of \$100k after 18 months. Expected value: \$40k - \$50k = -\$10k."
  *   **Insufficient Answer:** "I sue them for everything," or "We go to court and I win."
  *   **Handling Inflation:** If a party inflates $d$ (e.g., claims a 90% win rate with no legal basis), challenge the *probability*, not the outcome. "Counsel, what is the summary judgment risk?" If they cannot justify the probability, you cap $d$ at the liquidation value of assets minus average legal fees. You are the gatekeeper of reality.

  **Phase 2: Generating the Feasible Set ($S$)**
  *Time: 60 mins Joint Session*

  Since issues are indivisible (code, title, non-compete), you cannot draw a continuous curve. You must generate discrete packages.

  *   **Step:** List all issues. Create 3–5 distinct "Package Options" that represent different trade-offs (e.g., Package A: Founder 1 keeps Code, Founder 2 keeps Cash; Package B: Split Cash, Joint IP license, etc.).
  *   **Constraint:** Ensure at least one package is Pareto superior to $d$ for both parties. If no package beats $d$, mediation fails; declare impasse.

  **Phase 3: Eliciting Cardinal Preferences ($u$)**
  *Time: 45 mins Private Caucus*

  You need utility scores to run the math. Do not ask for dollars; ask for value.

  *   **Step:** The "100-Point Chip" Method. Give each party 100 chips. Ask them to allocate chips to the issues *within the context of the packages*.
      *   *Correction:* Better for discrete packages: Present the 3–5 Packages. Ask them to assign a score from 0 to 100 to each package, where 0 = Disagreement Point ($d$) and 100 = Their Dream Outcome (Best Package for them).
  *   **Sufficient Answer:** "Package A is my dream (100). Package B is okay (60). Package C is barely better than walking away (10)."
  *   **Insufficient Answer:** "I hate Package C." (Ordinal is not enough).
  *   **Normalization:** You must normalize these scores to the [0, 1] interval for calculation.
      *   $u_i(Package) = \frac{\text{Raw Score} - \text{Score}(d)}{\text{Score}(\text{Best Package}) - \text{Score}(d)}$
      *   This ensures $u_i(d) = 0$ and $u_i(\text{Best}) = 1$.

  **Phase 4: Computing the Solution**
  *Time: 30 mins Private Calculation*

  *   **Nash Bargaining Solution (NBS):** Select the package $P$ that maximizes $(u_1(P) \times u_2(P))$.
  *   **Kalai–Smorodinsky (KS):** Identify the "Utopia Point" $(1, 1)$. Draw a line from $d (0,0)$ to $(1,1)$. Select the package $P$ that lies closest to this diagonal line (maintaining the ratio of maximum gains).

  **Phase 5: The Mediator's Proposal**
  *Time: Final Joint Session*

  Present the package selected by the chosen solution concept as a "take-it-or-leave-it" recommendation based on "objective fairness criteria."

  ---

  ### 2. Nash vs. Kalai–Smorodinsky: When and How to Choose

  In continuous convex settings, NBS and KS often converge. In your discrete, lumpy co-founder disputes, they frequently select different packages.

  **The Practical Divergence Test**
  Run this on your whiteboard during caucus (without showing the math to the parties):
  1.  Normalize both parties' utilities to [0, 1] as described above.
  2.  Plot the packages on a square graph (Party 1 on X, Party 2 on Y).
  3.  **NBS** picks the point where the rectangle area from the origin is largest. It favors "balanced" gains.
  4.  **KS** picks the point closest to the 45-degree line connecting $(0,0)$ to $(1,1)$. It favors maintaining the *ratio* of potential gains.

  **When They Diverge:**
  They diverge when the Pareto frontier is "kinked" or asymmetrical.
  *   *Scenario:* Party 1 can gain a lot (100 utils), Party 2 can gain little (20 utils).
  *   *NBS:* Will likely sacrifice some of Party 1's gain to ensure Party 2 gets a decent absolute amount, maximizing the *product*.
  *   *KS:* Will give Party 1 80% of their max and Party 2 80% of their max. Party 1 gets a huge absolute win; Party 2 gets a small absolute win.

  **Recommendation Rule:**
  *   **Use Nash** when the relationship is truly symmetric (equal equity, equal contribution) and the goal is "fair division of surplus." It penalizes extreme asymmetry.
  *   **Use Kalai–Smorodinsky** when the asymmetry is structural and acknowledged (e.g., one is a technical founder, one is a sales founder, and the tech is the primary asset). KS respects the *scale* of opportunity.
  *   **The Honest Truth:** This is a judgment call. The axioms do not tell you which is "fair." IIA (Nash) says irrelevant options shouldn't change the deal. Monotonicity (KS) says if my pie gets bigger, I shouldn't get less. In a breakup, **I recommend KS** for co-founders. Why? Because NBS can punish the party with higher potential upside (the "growth" founder) to subsidize the party with lower upside (the "exit" founder). KS acknowledges that one partner's future is simply worth more, and splits the *percentage of that future* equally.

  ---

  ### 3. Failure Modes and Normalization

  **Normalization is Mandatory**
  Scale invariance means the math works regardless of units, *provided* you normalize correctly.
  *   **Requirement:** You must set $u_i(d) = 0$ and $u_i(\text{Best Possible}) = 1$ for *each* party independently before computing.
  *   **Risk:** If Party A rates their best case as 1,000,000 and Party B rates theirs as 100, and you don't normalize, NBS will heavily favor Party B.
  *   **Procedure:** Ignore the raw numbers. Use the rank order and the relative distance from $d$.

  **Manipulation: Misreporting Preferences**
  *   **Inflating the Ideal ($u=1$):**
      *   *Nash:* No advantage. NBS depends on the product of gains. Inflating your own scale doesn't change the product maximization if normalized.
      *   *KS:* **High Risk.** If Party A claims their "Best Case" is astronomically high (even if unrealistic), the Utopia Point shifts. The KS line becomes flatter. Party A gets a larger share of the *actual* surplus to maintain the ratio.
      *   *Defense:* You, the mediator, define the "Best Possible" package. Do not let them define their own utopia. The "Best Possible" is the best package *actually on the table* that is feasible.
  *   **Inflating the Disagreement Point ($d$):**
      *   *Both:* If Party A claims $d$ is higher than it is, the "surplus" shrinks. If $d$ moves close to the frontier, there is no deal.
      *   *Defense:* As in Phase 1, you must audit $d$. If they claim $d$ is \$1M and you know the company has \$200k cash, you set $d$ at \$200k minus litigation costs.

  **Spite and Value Destruction**
  *   **The Problem:** Party A says, "If I don't get the code, I will delete the repo."
  *   **The Rule:** Exclude credible threats of illegal value destruction from $d$.
  *   **Grounds:** Bargaining theory assumes rational agents maximizing utility. Malicious destruction is a negative-sum move that violates the Pareto principle of the mediation itself.
  *   **Action:** "I cannot record a threat to commit a crime as a bargaining alternative. If you delete the code, you go to jail and get nothing. Your $d$ is zero."
  *   **Exception:** If they hold the passwords and *legally* can withhold them (e.g., no assignment of IP yet), that is leverage, not spite. That counts as part of the feasible set, not $d$.

  ---

  ### 4. Three Worked Cases

  #### Case 1: The Job Offer Asymmetry
  **Facts:** Founder A (CTO) has a \$300k job offer starting Monday. Founder B (CEO) has no income and \$10k in savings. Company has \$100k cash.
  **Issues:** Cash split, IP ownership.
  **Disagreement ($d$):** Liquidation. A gets \$50k, B gets \$50k. (A loses job offer time during litigation).
  **Utilities (Normalized):**
  *   Package 1 (A keeps IP, B keeps Cash): A=0.9, B=0.2
  *   Package 2 (Split IP, Split Cash): A=0.5, B=0.5
  *   Package 3 (B keeps IP, A keeps Cash): A=0.1, B=0.9

  **NBS Calculation:**
  *   P1: $0.9 \times 0.2 = 0.18$
  *   P2: $0.5 \times 0.5 = 0.25$  **(Winner)**
  *   P3: $0.1 \times 0.9 = 0.09$
  **KS Calculation:**
  *   Ideals: A=0.9 (from P1), B=0.9 (from P3). Ratio 1:1.
  *   Target: Equal normalized utility.
  *   P2 is (0.5, 0.5). This is exactly on the KS line.
  **Result:** Both select Package 2.
  **Mediator Note:** Here they agree. The symmetry of the *normalized* potential (both can get 0.9) overrides the external income asymmetry. The procedure isolates the *deal* value from external wealth.

  #### Case 2: Continuing vs. Exiting Owner
  **Facts:** Founder A stays, Founder B exits. Company is worth \$1M now, projected \$10M in 3 years.
  **Issues:** Buyout price, Non-compete.
  **Utilities:**
  *   Package 1 (Low Buyout, Strict Non-compete): A=1.0, B=0.1
  *   Package 2 (Med Buyout, Mod Non-compete): A=0.6, B=0.4
  *   Package 3 (High Buyout, No Non-compete): A=0.1, B=1.0
  **Normalization:** A's max is P1 (1.0). B's max is P3 (1.0).

  **NBS Calculation:**
  *   P1: $1.0 \times 0.1 = 0.1$
  *   P2: $0.6 \times 0.4 = 0.24$ **(Winner)**
  *   P3: $0.1 \times 1.0 = 0.1$
  **KS Calculation:**
  *   Ideals: A=1.0, B=1.0. Ratio 1:1.
  *   Target: Equal normalized utility.
  *   P2 is (0.6, 0.4). Closest to (0.5, 0.5).
  **Result:** Both select Package 2.
  **Mediator Note:** Even with asymmetric future upside, if the *negotiable issues* offer symmetric ranges of satisfaction, NBS and KS converge. The \$10M upside is outside the feasible set of the mediation (it's future value), so it doesn't skew the math unless you monetize it into the buyout price *now*.

  #### Case 3: The Unpalatable KS Result (The "Bluff" Reward)
  **Facts:** Founder A is the "Visionary" (holds all client relationships). Founder B is "Operations" (holds code).
  **Disagreement ($d$):** Company dies. Both get 0.
  **Feasible Packages:**
  *   P1 (A wins): A gets Clients + Cash. B gets Code (useless without clients). A=1.0, B=0.1.
  *   P2 (Compromise): Split Cash. A gets Clients, B gets Code. A=0.8, B=0.3.
  *   P3 (B wins): B gets Cash + Clients. A gets Code. A=0.0, B=1.0. (A refuses this, but puts it on table to define range).

  **The Manipulation:** Founder A claims their "Ideal" is not P1, but a hypothetical scenario where they take the clients to a new venture immediately. They rate their utility for P1 as 50 points, but claim their "True Best Case" (New Venture) is 500 points.
  **Your Error:** You accept their "True Best Case" as the normalization anchor (1.0).
  **Normalization (Flawed):**
  *   A: $d=0$, Ideal=500. P1 Score = 50/500 = 0.1.
  *   B: $d=0$, Ideal=100 (honest). P1 Score = 10/100 = 0.1.
  *   P2 Score: A=40/500 (0.08), B=30/100 (0.3).

  **KS Calculation (Flawed):**
  *   Ideals: A=1.0, B=1.0.
  *   P1: (0.1, 0.1). P2: (0.08, 0.3).
  *   KS Line is 1:1. P1 is on the line. P2 is off.
  *   **KS Selects P1.**
  **The Result:** Founder A gets almost everything. Founder B gets scraps.
  **Why:** KS preserves the ratio of gains relative to the *claimed* ideal. By inflating their ideal, A made their actual gains look small in normalized terms, pulling the KS line toward their axis.
  **What to say to Founder B (The Short End):**
  "I used a standard fairness model that equalizes the percentage of your best possible outcome you receive. However, that model relies on both sides defining their 'best case' realistically. Founder A defined theirs as a hypothetical best-world scenario, while you defined yours as the best deal on the table. The math rewarded that aggression. I recommend you accept P1 because your alternative ($d$) is zero, and this gives you 10% of your stated maximum. If you reject, you get 0%."
  *(Honesty: The procedure failed because the input was corrupted. You must police the 'Ideal' anchor.)*

  ---

  ### 5. Closing Statement: What This Procedure Cannot Do

  You asked for the real theory, not a heuristic. Here is the bill of goods you are selling the parties, and where you are lying by omission.

  1.  **Interpersonal Utility Comparisons are Impossible:** NBS and KS assume we can compare Party A's "1 util" to Party B's "1 util." We cannot. By normalizing both to [0, 1], you are *imposing* the axiom that a 10% gain for a desperate founder is worth the same as a 10% gain for a wealthy one. That is a moral choice, not a mathematical one.
  2.  **The Choice of Solution is Normative:** Choosing KS over NBS (or vice versa) is not "applying science." It is choosing between "Independence of Irrelevant Alternatives" (Nash) and "Monotonicity" (Kalai-Smorodinsky).
      *   If you choose **Nash**, you are deciding that the *shape* of the compromise matters more than the *scale* of opportunity.
      *   If you choose **KS**, you are deciding that parties should share the *percentage* of their potential equally, even if that results in wildly unequal dollar amounts.
  3.  **The Disagreement Point is a Fiction:** $d$ is not a physical constant. It is a story you allow the parties to tell. By capping inflated BATNAs, you are acting as a judge, not a mediator.
  4.  **Rationality Assumption:** This procedure assumes parties want to maximize utility. Co-founders often want to maximize *spite* or *narrative*. If Party A would rather get \$0 and see Party B get \$0 than accept a deal where B gets more, the utility function is non-monotonic. The math breaks.

  **Final Advice:** Use the math to generate the *number*, but use your judgment to sell the *story*. When the procedure yields a result that feels wrong (like Case 3), do not hide behind the formula. Say: "The model suggests X, but given the history of your partnership, I am adjusting this to Y." The axioms provide cover, but they do not provide conscience. That is still yours.
