answer: |-
  1. "The hidden assumption"

  The hidden assumption driving your design is the conflation of semantic facts with psychological judgments. You presuppose that the metaphysical structure of vagueness must manifest directly in the distribution of human responses. Specifically, you assume that if a sharp semantic boundary exists (Epistemicism), human cognition will detect it or cluster tightly around it, whereas if indeterminacy exists (Supervaluationism), cognition will reflect a spread. This ignores the mediating layer of cognitive architecture. Semantic theories describe truth conditions, not cognitive processing limits. Even if a sharp boundary exists in reality, human perceptual noise, contextual shifts, or linguistic incompetence could produce a wide band of uncertainty. Conversely, even if truth is indeterminate, social pressure might force consensus on a specific cut-off. Your design assumes a transparent window between metaphysics and psychology that simply does not exist. Consequently, any distribution you observe can be explained by auxiliary hypotheses about cognitive noise rather than semantic structure. This presupposition damages the design because it treats empirical data about *usage* as decisive evidence about *truth*, bypassing the necessary bridge principles linking the two. This renders the experiment incapable of falsifying either view, as both can accommodate the results by adjusting assumptions about cognitive noise.

  2. "What each theory actually claims"

  Epistemicism, championed by Timothy Williamson, asserts that vague predicates like "bald" have classical extensions: there is a specific hair count where "bald" becomes true. However, it crucially adds that this boundary is unknowable. Williamson argues for a margin-for-error principle: knowledge requires safety, and beliefs formed near the boundary are unsafe because slight changes in usage would shift the boundary. Thus, epistemicism predicts widespread ignorance and inconsistent judgments, not tight clustering. A participant cannot reliably identify the sharp cut-off because their cognitive access is inherently limited. Supervaluationism holds that vague predicates lack definite extensions until precisified. A sentence is supertrue if true on all acceptable precisifications. Borderline cases are those true on some precisifications but false on others. This theory posits genuine indeterminacy in the world (or language), not just ignorance. However, it does not dictate how speakers distribute their judgments across the penumbra. Speakers might vary in which precisification they implicitly adopt contextually. Your characterization reverses the epistemicist prediction. Epistemicism expects a sharp truth but fuzzy knowledge. Supervaluationism expects fuzzy truth. But both expect fuzzy judgments. The difference lies in whether the fuzziness is ontological/semantic (Supervaluationism) or purely epistemic (Epistemicism). Since your study measures judgments, not truth conditions directly, you are measuring the symptom (fuzziness) which both theories diagnose differently, not the underlying cause. Furthermore, the "neither" response is ambiguous: does it report ignorance (Epistemicism) or perceived indeterminacy (Supervaluationism)? Without forcing participants to distinguish these, the data remains theoretically neutral. Both theories accommodate a wide band of "neither" responses; one calls it ignorance, the other indeterminacy. For the supervaluationist, a "neither" judgment reflects the recognition that no single precisification is mandated. For the epistemicist, it reflects the inability to discriminate the single mandated boundary. Since both result in hesitation or a "neither" report, the behavioral output is identical despite the metaphysical divergence.

  3. "What the data would show either way"

  Your study measures the distribution of linguistic dispositions within a community, not the semantic status of the propositions. A tight cluster indicates high consensus on where to draw the line, possibly due to social convention or salient focal points. A wide band indicates high variability in individual thresholds. Epistemicism is compatible with both outcomes. If the boundary is unknown, judgments will scatter due to noise (wide band). However, if social conditioning aligns our ignorance, we might cluster (tight). Supervaluationism is also compatible with both. If precisifications vary widely among speakers, judgments scatter. If community standards restrict acceptable precisifications to a narrow range, judgments cluster. Therefore, the data shows how people *use* words, not how truth *works*. To adjudicate the theories, you would need to know whether the variability stems from ignorance of a fact or the absence of a fact. Your methodology captures the variability but cannot diagnose its source. The distribution of "neither" responses is consistent with margin-for-error principles (Epistemicism) just as it is with penumbral connections (Supervaluationism). The empirical pattern is underdetermined by the metaphysical theories. Crucially, the "neither" response conflates two distinct mental states: "I don't know" (epistemic) and "It's neither true nor false" (semantic). Without separating these, the data cannot distinguish between not knowing a boundary and there being no boundary.

  4. "Direct answers"

  1. No, you have not got the predictions right. Epistemicism does not predict tight clustering of judgments; it predicts a sharp boundary in truth coupled with widespread ignorance in judgment. Supervaluationism predicts indeterminacy in truth, which is compatible with various judgment distributions. Both theories predict a spread of "neither" responses due to cognitive limitations or contextual variability.
  2. No, the follow-up is not the obvious next step. Williamsonian epistemicism argues the boundary is unknowable *in principle*, not merely unknown due to lack of data. Margin-for-error principles prevent knowledge regardless of sample size. Aggregating judgments locates community norms or average usage, not the semantic boundary. Increasing the sample size reduces statistical error, not semantic ignorance. You would be measuring the center of gravity of usage, not the edge of truth. Statistical aggregation reveals central tendencies of belief, not the location of metaphysical cut-offs.
