  **Case 1: The Binary Manual (Preface Structure, Irrational Aggregate)**
  At a technical publishing house, an editor verifies a safety manual containing 1,000 distinct claims ($n=1000$). The verification software operates on a binary switch: with 99% probability ($P=0.99$), the system functions perfectly and every claim is true; with 1% probability, the database corrupts and every claim is false. For any individual claim $c_i$, the probability it is true is 0.99, making belief in each $c_i$ individually rational. However, the probability that *at least one* claim is false is exactly 0.01 (the chance of corruption). Consequently, the aggregate belief—"At least one of my beliefs is false"—is irrational, as it asserts the low-probability corruption scenario rather than the high-probability perfection scenario.

  **Case 2: The Actuarial Book (Lottery Structure, Rational Aggregate)**
  At an insurance firm, an actuary assesses 1,000 independent policies ($n=1000$). For each policy $k_i$, the probability of no payout (the "safe" belief) is 0.99 ($P=0.99$), based on distinct, uncorrelated risk factors. For any individual policy, believing it will not payout is rational. However, because the risks are independent, the probability that *all* policies are safe is $0.99^{1000} \approx 0.00004$. The probability that *at least one* belief ("no payout") is false is $\approx 0.99996$. Consequently, the aggregate belief—"At least one of my beliefs is false"—is highly rational, warranting full confidence that some claim will occur.

  ***

  **Analysis**

  **Kyburg-Style Coherence:** Kyburg permits belief when probability exceeds a threshold $t$ (e.g., 0.9), rejecting conjunctive closure. In Case 1, the aggregate belief has $P=0.01$, falling far below $t$; Kyburg correctly deems it irrational. In Case 2, the aggregate has $P \approx 1.0$, exceeding $t$; Kyburg deems it rational. Kyburg's probabilistic acceptance rule handles both verdicts without paradox, provided the threshold is applied to the aggregate's specific probability, not derived from the conjunction of individuals.

  **Makinson-Style Defense:** Makinson defends the Preface aggregate as rational based on inductive humility (a track record of error). In Case 1, this defense fails; the specific evidence of the binary verification process overrides general inductive humility. In Case 2, Makinson would likely concede the rationality of the aggregate but attribute it to statistical convergence rather than humility. The structural feature doing the work is **stochastic dependence**: Case 1 features perfectly correlated errors (common cause), while Case 2 features independent errors.

  **Removal Test:** If we remove the correlation in Case 1 (making errors independent), the probability of at least one error rises to $\approx 1.0$, making the aggregate rational (collapsing into the standard Preface Paradox). If we impose correlation in Case 2 (e.g., all policies fail if a single market crashes), the aggregate probability drops to 0.01, making the aggregate irrational.

  **Attack:** A defender of the view that the paradoxes are isomorphic would attack the construction as cheating on the "fixed probabilities" constraint. They would argue that fixing marginal probabilities ($P(c_i)$) while varying the joint distribution ($P(\bigwedge c_i)$) changes the *total evidence* available to the believer. If the evidence is truly equalized, including the dependency structure, the joint probabilities must match, and the paradoxes collapse into identical verdicts. By manipulating correlation, I have not prying the paradoxes apart but rather demonstrated that the Preface Paradox dissolves when the assumption of independent fallibility is removed.
