  2.  **Deconstruct the Tension:**
      *   *Retributivism:* Punishment $\propto$ Blameworthiness (Past act + Culpability). Fixed at the time of the crime (mostly).
      *   *Plea Practice:* Sentence $\propto$ Procedural Choice (Post-crime behavior).
      *   *The Gap:* If desert is fixed, why does the sentence change based on a procedural election?

  3.  **Evaluate Candidate Theories:**

      *   **Consequentialism (Utilitarianism/Efficiency):**
          *   *Logic:* Pleas save resources. Discounts incentivize pleas.
          *   *Fit:* Explains the *existence* of the discount perfectly.
          *   *Problem:* Treats punishment as a cost of doing business, not a moral debt. Conflicts with official "desert" rhetoric.
      *   **Expressivism/Communicative Theory:**
          *   *Logic:* Punishment communicates censure. A plea accepts censure, reducing the need for hard treatment to get the message across. A trial rejects censure, requiring more hard treatment to force the message.
          *   *Fit:* Aligns with "acceptance of responsibility" language.
          *   *Problem:* Coerced pleas (innocent people) undermine the communicative value. It becomes a lie.
      *   **Retributivism (Modified):**
          *   *Logic:* Post-crime conduct affects culpability. Remorse reduces blameworthiness. Obstruction/contesting increases it.
          *   *Fit:* Aligns with "desert" language.
          *   *Problem:* Is contesting a charge *actually* morally blameworthy? Right to trial is a right. Penalizing the exercise of a right seems unjust.

  4.  **Synthesize the "Implicit Theory":**
      *   It's not *one* theory. It's a **Hybrid/Pragmatic Hybrid**.
      *   Officially: Retributivist/Expressivist ("Acceptance of Responsibility").
      *   Unofficially: Consequentialist ("Judicial Economy").
      *   *The Reconstruction:* The system operates on a **Bifurcated Theory**. It uses retributive language to legitimize what is functionally a consequentialist mechanism. However, to make it morally palatable, it *masquerades* as a culpability adjustment.
      *   *Key Insight:* The practice presupposes that **procedural cooperation is a proxy for moral reform.**

  5.  **Address Underdetermination:**
      *   Yes, it is underdetermined. Both a hard consequentialist and a soft retributivist can justify the discount.
      *   Consequentialist: "Buy the plea."
      *   Retributivist: "They are less blameworthy now."
      *   *Result:* The practice doesn't commit to *why*, only *that*. This allows the hypocrisy to persist.

  6.  **Sketch Implications of Taking Theories Seriously:**
      *   *If Pure Consequentialist:* Admit it's a tax on trials. Cap the discount based on resource savings, not "remorse."
      *   *If Pure Retributivist:* Discount must vanish or be tiny. Only genuine remorse counts, not just pleading guilty. Contesting guilt shouldn't increase blame.
      *   *If Expressivist:* Ensure the plea is voluntary and truthful. Innocent pleas break the theory.

  7.  **Identify Weak Points (The "Flag Where You Fail" Section):**
      *   *Judicial Reasoning:* Judges often *do* believe the retributive story. It's not always cynical.
      *   *Systemic Variation:* Some systems cap discounts (e.g., UK vs. US). This changes the theoretical weight.
      *   *The "Right to Trial" Problem:* If the penalty is too high, it burdens a constitutional right. This suggests a legal/constitutional limit, not just a philosophical one.
      *   *Least Trustworthy Part:* Assuming the system has a coherent theory at all. It might just be bureaucratic inertia.

