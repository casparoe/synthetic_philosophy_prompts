answer: |-
  This is one of the sharpest tensions in criminal justice theory, and you are right to feel that the standard "acceptance of responsibility" line is doing a lot of heavy lifting to cover a structural necessity. If you go into section claiming the system is simply hypocritical, you'll be technically correct but philosophically shallow. If you claim it's purely consequentialist, you ignore the genuine moral reasoning judges use.

  Here is a reconstruction of the implicit theory, an analysis of its underdetermination, and a map of where the argument breaks down.

  ### 1. The Implicit Theory: "Administrative Retributivism"

  The plea-discount practice does not rest on pure consequentialism, nor does it rest on pure retributivism. It rests on a hybrid I'll call **Administrative Retributivism**.

  **The Core Claim:** The system presupposes that *procedural cooperation is a reliable proxy for moral reform.*

  Here is how the reconstruction works:
  1.  **Retributive Surface:** The official language is desert-based. By pleading guilty, the offender acknowledges the normative validity of the law they broke. This acknowledgment is treated as a reduction in *culpability*. The logic is that a defendant who fights the charge is asserting that the state has no authority over them, which constitutes a continuing attitude of defiance. That defiance is itself blameworthy.
  2.  **Consequentialist Engine:** The *magnitude* of the discount, however, is not calibrated to the depth of the defendant's remorse. It is calibrated to the resource savings of the state. A 60% reduction in sentence doesn't mean the defendant is 60% less blameworthy; it means a trial costs 60% more than a plea.
  3.  **The Synthesis:** The system uses retributive language ("remorse," "responsibility") to launder a consequentialist incentive ("judicial economy"). It treats the *waiver of rights* as if it were a *moral act*.

  **Why this isn't just Consequentialism:**
  If it were pure consequentialism, the state would openly treat sentencing as a price list. "Trial costs $X, Plea costs $Y." But the system cannot admit this because it undermines the moral authority of the court. If punishment is just a fee for service, the law loses its condemnatory force. So, the system *must* pretend the discount is about the offender's soul, not the state's budget.

  **Why this isn't just Retributivism:**
  Pure retributivism holds that desert is fixed at the time of the crime (plus perhaps immediate aftermath). While post-crime conduct (like remorse) can mitigate, the *exercise of a constitutional right* (the right to trial) cannot logically increase blameworthiness without negating the right itself. If I have a right to do X, doing X cannot make me more deserving of punishment. The practice presupposes that the right to trial is a *privilege* that can be taxed, not a *right* that must be burden-free.

  ### 2. Is the Practice Underdetermined?

  **Yes, radically.** This is the most important philosophical feature of the practice. The plea discount is **theoretically underdetermined**, and this underdetermination is a feature, not a bug. It allows an "overlapping consensus" among conflicting ideologies to keep the machinery running.

  *   **The Consequentialist** supports the discount because it clears dockets.
  *   **The Expressivist** supports it because the plea is a speech act of submission to the norm.
  *   **The Retributivist** supports it because the plea signals reduced dangerousness and moral recognition.

  Because all three theories license the *outcome* (a lighter sentence for a plea), the system never has to commit to *why*. This ambiguity protects the practice. If you force the system to choose one theory, the practice collapses (see below). The "grubbiness" you sense comes from the friction of these three theories rubbing against each other without ever being resolved.

  ### 3. What Would Change If We Took the Theories Seriously?

  If we stopped allowing this underdetermination and forced the practice to align with a single dominant theory, the landscape would shift dramatically.

  **Scenario A: Pure Consequentialism (The "Tax" Model)**
  *   **Change:** We admit the discount is a purchase of efficiency.
  *   **Implication:** The discount should be capped at the actual marginal cost saved by the state. If a trial costs $50k and a plea costs $5k, the discount should reflect that resource difference, not years of liberty.
  *   **Result:** The "trial penalty" would shrink significantly. Currently, discounts often exceed actual cost savings to *guarantee* pleas (coercion). A pure consequentialist model would forbid over-incentivizing to the point of coercion, as that risks convicting the innocent (which is costly in the long run).

  **Scenario B: Pure Retributivism (The "Desert" Model)**
  *   **Change:** We admit that exercising a right cannot increase blame.
  *   **Implication:** The "trial penalty" aspect must vanish. There could be a small "remorse discount" for genuine contrition, but it would require an individualized hearing to prove the remorse is real, not just strategic. A defendant who pleads guilty but maintains they did it to avoid risk (Alford plea) would get *no* discount.
  *   **Result:** Discounts would become rare and small. The system would grind to a halt because the incentive to plead would be removed.

  **Scenario C: Pure Expressivism (The "Communication" Model)**
  *   **Change:** We admit that punishment communicates censure.
  *   **Implication:** A coerced plea breaks the communication. If an innocent person pleads guilty to avoid the trial penalty, the "message" of the sentence is a lie. The system would have to institute rigorous innocence screens before accepting pleas.
  *   **Result:** The discount would remain, but the *eligibility* for it would tighten. You couldn't just say "guilty"; you'd have to provide a factual basis that satisfies the judge of actual guilt, not just legal sufficiency.

  ### 4. Where This Reconstruction Fails (The Weak Points)

  If you use this analysis in section, expect pushback on these three fronts. This is where my reconstruction is most vulnerable.

  **A. The Sincerity of Judicial Reasoning (The "Cynicism" Objection)**
  *   **The Argument:** My reconstruction assumes judges are (consciously or unconsciously) laundering economics as morality. But many judges *sincerely believe* the retributive story. They genuinely view a defendant who forces a victim to testify as more blameworthy than one who spares them that trauma.
  *   **Why it hurts the theory:** If judges are sincere retributivists, then the practice *is* retributive, not a hybrid. The "trial penalty" is actually a "victim trauma penalty."
  *   **Counter:** Even if sincere, the *structure* of the guidelines (standardized discounts regardless of victim impact) reveals the economic engine. But you must concede that the *phenomenology* of sentencing is often moral, not economic.

  **B. The Innocence Problem (The Expressivist Collapse)**
  *   **The Argument:** An expressivist or retributive justification collapses if innocent people plead guilty. If the discount is for "accepting responsibility," an innocent person cannot accept responsibility they don't bear. Yet, empirical data suggests innocent people do plead guilty to avoid the trial penalty.
  *   **Why it hurts the theory:** If the system knowingly accepts false pleas to save money, it cannot claim to be seeking desert or moral communication. It reveals the Consequentialist engine as the *true* driver, making the Retributive language a lie.
  *   **Least Trustworthy Bit:** I am least trustworthy on the claim that the system *knows* this. It's more likely the system is willfully blind. If the system is merely negligent rather than cynical, the Expressivist story might survive as an "ideal" even if practice fails it.

  **C. The Constitutional Right Objection (The Legal Limit)**
  *   **The Argument:** In *United States v. Goodwin* and similar cases, the Supreme Court has acknowledged the "potential for disparity" but upheld the practice provided it's not vindictive. However, legal theorists argue that burdening a right makes it no right at all.
  *   **Why it hurts the theory:** If the trial penalty is large enough to coerce a plea, it violates the constitutional structure. My philosophical reconstruction ignores that the practice might be *illegal* (or constitutionally suspect) rather than just philosophically incoherent.
  *   **Implication:** A strict constitutionalist would argue the discount must disappear entirely, not because of retributivism, but because you cannot price the exercise of a fundamental right.

  ### Summary for Section

  If I were sitting in your section, here is the argument I would advance:

  The plea discount practice presupposes a **fiction of moral voluntariness**. It treats a strategic decision made under duress (the plea) as if it were a moral transformation (remorse). This allows the system to be **underdetermined**: it functions as a market mechanism (consequentialism) while speaking the language of the church (retributivism).

  The practice is stable only so long as no one forces the system to choose between its economic needs and its moral claims. If you take the **Retributive** claim seriously, the discount must shrink to reflect only genuine remorse, breaking the budget. If you take the **Consequentialist** claim seriously, you must admit you are taxing rights, which breaks the legitimacy of the law.

  The weakest link in this chain is the **Innocent Plea**. If an innocent person pleads guilty to avoid the trial penalty, the "Acceptance of Responsibility" justification is not just weak; it is factually false. At that point, the "discount" is no longer a discount for remorse; it is a **protection racket fee**. Once you admit that, the Retributive mask falls off, and you are left with a purely utilitarian system that sacrifices individual justice for administrative throughput.

  **Your best move in section:** Don't ask which theory is *right*. Ask which theory the system *relies on when challenged*. When a judge justifies a sentence on the record, they use Retributivism. When the legislature funds the courts, they use Consequentialism. The injustice lies in the gap between the justification and the funding.
