answer: |-
  **Title:** The Constituent Fiction: Retroactivity, Legality, and the Nuremberg-Tokyo Precedent

  **Introduction**

  The philosophical tension surrounding the Nuremberg and Tokyo tribunals is often reduced to the slogan of "victors' justice," but as you have identified, the deeper structural problem is one of legality: specifically, the violation of *nullum crimen sine lege* (no crime without law). Your intuition is correct that the postwar debate imports the framework of the 1958 Hart-Fuller exchange regarding the German "grudge informer" cases, but the transfer is indeed imperfect. In the German cases, the court had to choose how to treat a defendant under a *continuing* domestic legal order. At Nuremberg and Tokyo, the Allies were not merely interpreting a surviving code; they were constructing a new international legal order from the ashes of a collapsed one.

  This essay argues that while H. L. A. Hart was right to identify the "smuggling" of retroactivity in the tribunals' reasoning, Lon Fuller was right to sense that a rigid positivism could not account for the normative necessity of the judgments. However, the redemption of this retroactivity for future international law depends on a crucial reclassification: we must stop treating the tribunals as ordinary courts applying existing law and recognize them as constituent assemblies exercising a temporary legislative power. The retroactivity generates genuine law for the future, but only because the international community subsequently ratified the fiction as a constitutional foundation.

  **I. The Hart-Fuller Menu in an International Context**

  In the *Harvard Law Review* exchange, Hart and Fuller debated three options for the postwar German courts: acquit the informer; punish her under a frankly retroactive statute; or punish her under existing law by interpreting Nazi statutes against their grain. Fuller argued the third option preserved the "inner morality of law" by denying the Nazi rules the status of law. Hart argued this was dishonest; the court was applying a new moral standard retroactively and should admit it.

  When transposed to Nuremberg and Tokyo, this menu fractures. In the German cases, there was a continuity of sovereignty: the West German court was an organ of the same state that had enacted the Nazi laws. At Nuremberg, there was no continuous sovereign. The London Charter was not a statute passed by a legislature to which the defendants owed allegiance; it was an agreement among occupying powers establishing an ad hoc tribunal.

  Consequently, the "third route" (interpretive strain) was structurally unavailable in the domestic sense. There was no domestic penal code to strain. Instead, the prosecutors and judges performed a different kind of alchemy: they treated the Kellogg-Briand Pact and customary international norms as if they contained implicit criminal sanctions for individuals. This was not interpreting a statute against its grain; it was reading criminal liability into instruments that were explicitly state-centric.

  Therefore, Hart's critique lands with greater force here than in the German cases. In Germany, the court could claim it was restoring the *true* meaning of the penal code. At Nuremberg, the Charter *was* the legislation. When the tribunal claimed it was merely "declaring" existing international law (as Justice Jackson did), it was engaging in the very smuggling Hart warned against. The Charter created individual criminal responsibility for aggressive war; to claim this responsibility pre-existed the Charter was to disguise legislation as adjudication.

  However, Fuller's insight remains vital. If the tribunals had chosen Hart's preferred "second route"—frankly admitting they were passing retroactive laws—they would have undermined their own legitimacy as *courts*. A court that admits it is legislating retroactively ceases to function as a judicial body and becomes a commission of punishment. The "pretense" that the law was already there was not merely a lie; it was a performative necessity to establish the rule of law rather than the rule of force. Thus, the Hart-Fuller frame fits, but the stakes are higher: at Nuremberg, the "smuggling" was the price of transitioning from a state of war to a state of law.

  **II. The Tokyo Complications: Worse or More Honest?**

  The International Military Tribunal for the Far East (IMTFE) in Tokyo faced the same retroactivity problem but exacerbated it through the charge of "conspiracy" to wage aggressive war and a broader temporal jurisdiction stretching back to 1928. Does this make the retroactivity problem worse, or merely more exposed?

  It makes it worse. At Nuremberg, the charge of Crimes Against Peace relied on the idea that waging the war itself was criminal. At Tokyo, the conspiracy charge required the prosecution to prove that the defendants had agreed to wage war years before the war began. This stretched the *nullum crimen* principle to the breaking point. While waging aggressive war might be argued as a nascent customary crime by 1939, planning it in 1931 was unequivocally statecraft, not individual criminality, under the positive law of the time.

  The dissents of Justice Radhabinod Pal and Justice B. V. A. Röling did not merely expose the problem; they highlighted that the majority was unable to sustain the Fullerian fiction. Pal's total dissent argued that the tribunal was applying *ex post facto* law disguised as international custom. Röling, while accepting the necessity of the trial, admitted that the law was being developed retroactively.

  The Tokyo majority, unlike the Nuremberg bench, could not rely on the sheer moral gravity of the Holocaust to obscure the legal fiction. Without that overwhelming moral counterweight, the legal strain became visible. The conspiracy charge was a common law concept alien to the civil law traditions of many defendants and judges, imported specifically to ensure convictions where direct command responsibility was harder to prove. This suggests that Tokyo was not "more honest" but rather "more desperate." The legal theory was thinner, requiring a broader fiction of pre-existing law to cover a longer timeline. The dissents show that the retroactivity problem was not just visible but legally fatal to the coherence of the judgment, even if politically necessary. Tokyo demonstrates the limits of the Fullerian approach: when the gap between the "moral law" and the "positive law" is too wide (1931 conspiracy vs. 1945 judgment), the interpretive strain snaps, and the Hartian critique becomes undeniable.

  **III. Verdict: Redemption Through Constituent Power**

  This brings us to the core question: Was the retroactivity at these tribunals the kind that can be redeemed going forward? Can a conviction route that pretends the law was already there generate genuine law for the future, or does it merely settle the past?

  My verdict is definite: **The retroactivity is redeemable, but only if we reclassify the tribunals not as courts applying old law, but as constituent powers making new law.**

  If we accept the tribunals' own reasoning—that they were ordinary courts discovering pre-existing law—then Hart is right: the precedent is poisoned. A legal system cannot tolerate judges who lie about the source of their authority to secure convictions. If successor tribunals (like the ICC) adopt the method of "pretending" customary law exists where it does not, they undermine the predictability and legitimacy of international law. In that sense, the *judicial reasoning* of Nuremberg cannot be redeemed as a model for ordinary adjudication.

  However, the *outcome* generates genuine law because the tribunals functioned as a "constitutional moment." In domestic transitions (e.g., post-apartheid South Africa or post-dictatorship Argentina), new regimes often use retroactive justice to bridge the gap between tyranny and democracy. This is not standard jurisprudence; it is constituent power. The Nuremberg and Tokyo tribunals were not merely courts; they were the legislative engines of a new international order. They declared that henceforth, aggressive war is a crime. The "pretense" that this was already the law was a rhetorical bridge to make the transition palatable.

  The redemption of this retroactivity lies in **subsequent ratification**. The law generated at Nuremberg became genuine not because the judges were right about 1939, but because the international community accepted their ruling as the foundation for the future. UN General Assembly Resolution 95(I) affirmed the principles of the Nuremberg Charter. The Geneva Conventions, the Genocide Convention, and eventually the Rome Statute of the ICC codified the norms that Nuremberg claimed to "discover."

  Therefore, the retroactivity binds successor tribunals not because *nullum crimen* was satisfied in 1945, but because the world agreed to treat 1945 as Year One of a new legal calendar. The "fiction" became fact through state practice and *opinio juris*.

  **Conclusion**

  To answer your question directly: Yes, the retroactivity at Nuremberg and Tokyo can be redeemed going forward, but not on the terms the judges offered. They claimed to be judges finding law; in truth, they were legislators making it. If we insist on their judicial innocence, we validate a dangerous method of legal smuggling that Hart correctly identified. But if we acknowledge their role as a constituent power exercising a temporary suspension of strict legality to establish a new normative order, the precedent holds.

  The convictions settled the past through an act of force that claimed the mantle of law. They generate genuine law for the future only because the international community subsequently ratified that claim. The "pretense" was the birth pain of modern international criminal law. It was a necessary illegality that birthed legality. We must accept the law they created, but we must not copy their method. The precedent binds us, but we must admit it was born of exception, not routine.
