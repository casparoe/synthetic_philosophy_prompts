prompt: |-
  i keep reading structural realism papers and every one of them turns out to be answering a slightly different question, so before i read any more i want the spec written down first. what i'd like from you: the full list of desiderata for a theory of what gets retained through scientific theory change — the thing structural realism is supposed to be a theory OF. for each requirement, give the case or consideration that motivates it, so i can see it's a requirement and not just a mood.

  the purpose that fixes adequacy, i've decided, is the no-miracles argument: the theory has to explain the predictive success of mature theories without either miracles or blanket scepticism about unobservables. if you think a different purpose (answering the pessimistic meta-induction, say) would generate a genuinely different list, note where the lists diverge, because that's the sort of thing i keep losing track of.

  some cases i want the list to actually handle rather than wave at:

  - fresnel's equations surviving inside maxwell (the standard exhibit, fine, get it out of the way early)
  - newtonian mechanics as a limiting case of relativity, where the old structure isn't preserved so much as recovered asymptotically — the equations aren't literally sitting there in the successor theory until you take a limit, so does the theory of retention have to cover that itself, or can it outsource the work to a theory of intertheoretic relations, and is outsourcing allowed?
  - at least one case where the old theory was predictively successful but basically nothing seems worth retaining — whatever you think the best example is, ptolemaic astronomy, phlogistan, take your pick. does the list force the theory to say something here, or is it permitted to shrug? i want that settled explicitly.

  one more requirement i want on the list and want your honest verdict on: "structure" itself has to be picked out in some non-question-begging way. a friend keeps insisting that if you can't say what counts as structure without pointing at whichever theory later turned out successful, the whole view collapses into selective realism with extra steps, and i genuinely can't tell whether that's just the newman objection in a trenchcoat or a seperate problem. address whether it's a real requirement and whether it's satisfiable.

  mark which desiderata are non-negotiable and which are just preferences of one camp (the epistemic and ontic people weight things differently, i gather — e.g. how much the theory owes us about what objects are). and flag any subset you suspect can't be jointly satisfied, since if the list itself is unsatisfiable that's basically a result and it's the part i most want to see. no scorecard at the end please, i'll do that myself once i've read enough to have opinions. please write the answer in british english.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Structural Realism (SR).
      *   **Goal:** Define the *desiderata* (requirements) for a theory of what gets retained through scientific theory change.
      *   **Core Purpose:** Solve the No-Miracles Argument (NMA) without miracles or blanket scepticism. (Note the distinction from Pessimistic Meta-Induction (PMI), though they are related).
      *   **Specific Cases to Handle:**
          1.  Fresnel's equations in Maxwell (standard continuity).
          2.  Newtonian Mechanics (NM) in Relativity (limiting case/asymptotic recovery).
          3.  A "dead end" successful theory (e.g., Phlogiston or Ptolemy) where nothing seems worth retaining.
      *   **Specific Constraint/Requirement:** "Structure" must be picked out non-question-beggingly (avoiding "it's structure because it survived"). Address the friend's objection (Newman vs. Selective Realism).
      *   **Formatting/Style:** British English. No scorecard at the end. Mark Non-Negotiable vs. Camp Preferences. Flag potential incompatibilities.
      *   **Tone:** Rigorous, philosophical, direct, avoiding fluff.

  2.  **Deconstruct the Core Purpose (NMA vs. PMI):**
      *   The user specifies the *No-Miracles Argument* as the fixing purpose.
      *   *NMA:* Success implies truth (or approximate truth). SR needs to explain *why* the math works without committing to the full ontology (objects/nature).
      *   *PMI:* History shows theories are false, so current ones likely are too. SR needs to show *what* survives to block the induction.
      *   *Divergence:* NMA focuses on *explanation of success*. PMI focuses on *continuity despite falsity*. The list should prioritize NMA, but note where PMI pressures might distort it (e.g., requiring *more* retention than NMA strictly needs).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Retention Condition.* Obviously, something must be retained.
          *   Motivation: NMA. If nothing is retained, success is miraculous.
          *   Status: Non-negotiable.

      *   *Desideratum 2: The Ontological Agnosticism/Neutrality.* SR distinguishes itself from Entity Realism.
          *   Motivation: Avoiding the PMI (entities change, structure stays).
          *   Status: Non-negotiable for SR (defines the view).

      *   *Desideratum 3: The Non-Miraculous Success Condition.* The retained bit must be *causally/explanatorily responsible* for the predictions.
          *   Motivation: NMA core.
          *   Status: Non-negotiable.

      *   *Desideratum 4: The Limiting Case Handling (Newton/Einstein).*
          *   Motivation: User's specific case. NM isn't *in* GR, it's a limit.
          *   Issue: Does SR need a theory of reduction, or just assert structure survives the limit?
          *   Status: Non-negotiable (must handle the case), but *how* is a camp preference (mathematical vs. philosophical account).

      *   *Desideratum 5: The "Dead End" Handling (Phlogiston/Ptolemy).*
          *   Motivation: User's specific case. If a theory worked but was wrong, SR must explain why *nothing* (or very little) is retained without collapsing into scepticism.
          *   Status: Non-negotiable (must address it), but the *verdict* (shrug vs. explain) is contentious.

      *   *Desideratum 6: The Non-Begging Structure Definition.*
          *   Motivation: User's friend's objection (Newman/Selective Realism charge).
          *   Status: Non-negotiable (otherwise trivial).

      *   *Desideratum 7: Epistemic Accessibility.*
          *   Motivation: We need to know *what* the structure is now.
          *   Status: Camp Preference (Epistemic SR says we only know structure; Ontic SR says the world *is* structure).

  4.  **Refining the Specific Cases:**

      *   *Fresnel/Maxwell:* Easy. The equations are mathematically isomorphic. SR must say the mathematical relations are the reality.
      *   *Newton/Einstein:* Harder. It's a singular limit. SR needs to accommodate "asymptotic retention." If SR outsources this to philosophy of physics (reduction), is that cheating? I need to argue it's *allowed* but SR must specify *which* relations count.
      *   *Phlogiston/Ptolemy:* This is the killer. Phlogiston had negative weight. Ptolemy had epicycles. If SR says "nothing retained," does it violate NMA? No, because NMA applies to *mature* theories. But SR needs a criterion to distinguish Phlogiston from Fresnel *before* we know the future. This links to Desideratum 6.

  5.  **Addressing the "Structure" Definition (The Friend's Objection):**
      *   Is it Newman? Newman says any set of objects can have *some* structure imposed. If SR says "we only know structure," Newman says "that's trivial."
      *   The Friend's worry: If we identify structure *only* by looking at what survives, it's post-hoc Selective Realism.
      *   Verdict: It is a real requirement. It is *not* just Newman (Newman is about logical triviality; this is about historical cherry-picking). It is satisfiable only if structure is defined mathematically/categorically *prior* to checking survival (e.g., group theoretic invariants).

  6.  **Identifying Incompatibilities (The "Unsatifiable List" Check):**
      *   *Tension 1:* NMA (explain success) vs. PMI (acknowledge falsity). Sometimes explaining success requires committing to entities (e.g., electrons), which SR forbids.
      *   *Tension 2:* Non-begging Structure vs. Historical Retention. If we define structure mathematically (e.g., symmetries), does that match what actually survives historically? Sometimes the math changes radically (quantum revolution).
      *   *Tension 3:* Limiting Cases vs. Literal Retention. If structure is only recovered in a limit ($v/c \to 0$), is it really "retained"? Or is the old theory strictly false? SR needs to walk a line between "true" and "usefully false."

  7.  **Drafting the Content (incorporating British English and constraints):**
      *   Use "colour," "programme," "maths," etc.
      *   Ensure the distinction between Epistemic SR (ESR) and Ontic SR (OSR) is clear in the "Camp Preferences."
      *   Make sure the "Non-Negotiables" are tied strictly to the NMA purpose defined by the user.

  8.  **Review against User Constraints:**
      *   British English? Yes.
      *   No scorecard? Yes.
      *   NMA focus? Yes.
      *   Divergence from PMI noted? Yes.
      *   Cases (Fresnel, Newton, Phlogiston) addressed? Yes.
      *   "Structure" definition requirement addressed? Yes.
      *   Non-negotiable vs. Preference marked? Yes.
      *   Incompatibilities flagged? Yes.

  9.  **Final Polish:** Check the tone. It needs to be analytical, not persuasive. I am writing the spec, not selling the product. Ensure the distinction between "outsourcing" intertheoretic relations and "specifying" retention is clear. (Self-Correction: Make sure to explicitly state that outsourcing reduction is *permitted* provided SR identifies *what* in the reduction is the 'real' bit).

  10. **Final check on the "Friend's Objection":** Distinguish clearly between Newman (logical triviality of 'structure') and the "Selective Realism" charge (historical cherry-picking). They are related but distinct. The user's friend is worried about the latter, but invokes the former. I need to clarify this.

  11. **Structure of the Response:**
      *   Introduction: Acknowledge the NMA framing.
      *   Section 1: Core Non-Negotiable Desiderata (derived from NMA).
      *   Section 2: Case-Specific Desiderata (Fresnel, Newton, Phlogiston).
      *   Section 3: The "Structure" Definition Requirement (The Friend's Objection).
      *   Section 4: Camp Preferences (ESR vs OSR).
      *   Section 5: Potential Incompatibilities (The "Unsatifiable" flags).
      *   Conclusion: Brief wrap-up.

  (Proceed to generate output based on these thoughts.)
answer: |-
  Here is the specification for a theory of structural retention, framed by your constraint that the primary purpose is to sustain the No-Miracles Argument (NMA) without collapsing into scepticism or naive realism.

  ### I. Core Non-Negotiable Desiderata
  *These requirements follow directly from the purpose you have fixed: explaining predictive success without miracles.*

  **1. The Causal-Explanatory Link**
  *   **Requirement:** The theory must identify the retained element as the specific cause of the predecessor theory's predictive success. It is not sufficient that the element survives; it must be *because* it survives that the old theory worked.
  *   **Motivation:** This is the engine of the NMA. If the retained structure is merely a passenger alongside the actual cause of success (which was discarded), the success of the old theory remains miraculous.
  *   **Status:** **Non-Negotiable.**

  **2. The Ontological Commitment Ceiling**
  *   **Requirement:** The theory must not require belief in the specific nature of the unobservable objects posited by the predecessor theory (e.g., the luminiferous aether as a mechanical medium) to explain that theory's success.
  *   **Motivation:** To avoid the Pessimistic Meta-Induction (PMI). If you commit to the objects, you commit to entities we know were discarded (aether, caloric), rendering the current theory likely false. SR must explain success while allowing the objects to be false.
  *   **Status:** **Non-Negotiable** (for Structural Realism specifically).
      *   *Note on Divergence:* If your purpose were solely to answer the PMI, you might tolerate more ontological commitment to block the induction. But for the NMA, you need the success explained *without* the objects.

  **3. The Continuity Condition**
  *   **Requirement:** The retained element must be identifiable in both the predecessor and successor theory without requiring a complete reinterpretation of the mathematical formalism that renders the two incommensurable.
  *   **Motivation:** If the 'structure' in Theory A is mathematically distinct from the 'structure' in Theory B, there is no retention, only replacement. The NMA requires a continuous thread of truth.
  *   **Status:** **Non-Negotiable.**

  ---

  ### II. Case-Specific Desiderata
  *These requirements ensure the theory handles the historical record you specified.*

  **4. The Fresnel-Maxwell Constraint (Direct Embedding)**
  *   **Requirement:** The theory must account for cases where equations from the old theory appear as a proper subset of the new theory's equations.
  *   **Motivation:** This is the best-case scenario. If a theory of retention cannot handle the case where the math is literally identical (Fresnel's equations within Maxwellian electrodynamics), it is dead on arrival.
  *   **Status:** **Non-Negotiable.**

  **5. The Limiting Case Constraint (Asymptotic Recovery)**
  *   **Requirement:** The theory must specify whether 'retention' includes cases where the old theory is recovered only as a limiting case (e.g., $v/c \to 0$) rather than a literal subset. If it allows this, it must specify whether the 'structure' is the limit itself or the more general equation that yields the limit.
  *   **Motivation:** Newtonian Mechanics (NM) is not literally inside General Relativity (GR); NM is false in GR. However, NM is predictively successful. If SR says nothing is retained here, it violates the NMA for NM. If it says NM is retained, it violates truth.
  *   **Outsourcing Verdict:** You asked if the theory can outsource the work to a theory of intertheoretic relations. **Yes, but conditionally.** SR is permitted to rely on a philosophical account of reduction (e.g., Nagel or structural limits) to define the relationship, *provided* SR specifies which part of that relationship constitutes the 'reality'. It cannot simply say "physics handles reduction"; it must say "the invariant structure across the reduction is the reality."
  *   **Status:** **Non-Negotiable** (must handle the case), **Camp Preference** (on how to model the limit).

  **6. The 'Dead End' Constraint (Phlogiston/Ptolemy)**
  *   **Requirement:** The theory must provide a criterion to distinguish between 'successful but false' theories that deserve retention (Fresnel) and 'successful but false' theories that do not (Phlogiston), *without* relying on the fact that we already know which one survived.
  *   **Motivation:** Phlogiston theory was predictively successful in its domain. If SR says "structure is what survives," it identifies Phlogiston's structure as real only after we know it failed. This makes SR post-hoc rationalisation. The theory must allow for the possibility that a predictively successful theory contains *no* retainable structure.
  *   **Verdict on Shrugging:** The theory is **not permitted to shrug**. If the NMA claims success implies approximate truth (structure), a successful theory with *no* retainable structure is a counter-example to the NMA itself. SR must explain why Phlogiston's success was 'accidental' or 'instrumental' while Fresnel's was 'structural'.
  *   **Status:** **Non-Negotiable.**

  ---

  ### III. The Definition of 'Structure'
  *Addressing your friend's objection.*

  **7. The Non-Begging Identification Requirement**
  *   **Requirement:** The theory must provide a criterion for what counts as 'structure' that is independent of historical survival. It cannot define structure as "that which is retained."
  *   **Motivation:** Your friend is correct. If you identify structure only by pointing to what later turned out successful, Structural Realism collapses into Selective Realism with extra steps. It becomes a tautology: "The true parts are the parts that turned out to be true."
  *   **Newman Objection Distinction:** This is **not** the Newman objection proper. Newman argued that *any* collection of objects can be described as having *some* structure (via set theory), making "we only know structure" trivial. Your friend's worry is stronger: it is the charge of **historical cherry-picking**. It is a real requirement.
  *   **Satisfiability:** It is satisfiable only if 'structure' is defined mathematically or categorically *prior* to checking history (e.g., "group theoretic invariants," "causal relations," "symmetry principles"). If the definition relies on looking at the successor theory to see what matched, the requirement is failed.
  *   **Status:** **Non-Negotiable.**

  ---

  ### IV. Camp Preferences (Epistemic vs. Ontic)
  *These are not required for the NMA purpose but distinguish internal factions. I have flagged them so you can see where the list flexes.*

  **8. The Nature of the Retained Item (OSR vs. ESR)**
  *   **Preference:**
      *   **Epistemic SR (ESR):** We can only *know* the structure; there may be underlying objects/nature, but they are inaccessible. (Requirement: Agnosticism about the 'relata').
      *   **Ontic SR (OSR):** There *are* no underlying objects; the structure is all there is. (Requirement: Elimination of objects from ontology).
  *   **Impact on List:** For your NMA purpose, **ESR is sufficient.** You do not need to commit to OSR's stronger claim that the world *is* structure. OSR adds metaphysical baggage the NMA does not strictly require.
  *   **Status:** **Camp Preference.**

  **9. The Status of the Relata**
  *   **Preference:** Does the structure require relata (things that stand in relation)?
      *   **Ladyman/Ross (OSR):** No. Relations without relata.
      *   **Psillos/Traditional:** Yes. Relations need nodes.
  *   **Impact on List:** If you require relata, you risk slipping back into Entity Realism (violating Desideratum 2). If you deny them, you face the 'free-floating structure' objection.
  *   **Status:** **Camp Preference** (but with NMA risks).

  ---

  ### V. Potential Incompatibilities
  *Flags where the list may be jointly unsatisfiable.*

  **Flag A: The 'Dead End' vs. The NMA**
  There is a tension between **Desideratum 1 (Causal-Explanatory Link)** and **Desideratum 6 (Dead End Constraint)**.
  *   **The Conflict:** The NMA argues that predictive success is best explained by the theory being approximately true (structurally). If Phlogiston was predictively successful but possesses *no* retainable structure (as Desideratum 6 demands), then its success was *not* due to approximate truth. This weakens the NMA for *all* theories. It suggests success does not reliably track structural retention.
  *   **The Risk:** To satisfy Desideratum 6, you must admit that success can occur without structural truth. To satisfy Desideratum 1, you must insist success usually implies structural truth. Reconciling these requires a precise metric of 'maturity' or 'unification' to distinguish Fresnel from Phlogiston *in real time*. If the theory cannot provide that metric, the list is unsatisfiable.

  **Flag B: Limiting Cases vs. Literal Retention**
  There is a tension between **Desideratum 3 (Continuity)** and **Desideratum 5 (Limiting Cases)**.
  *   **The Conflict:** In the Newton-Einstein case, the structures are not continuous in a strict mathematical sense (Galilean invariance vs. Lorentz invariance). They are topologically distinct. To say structure is 'retained' here requires redefining retention as 'asymptotic convergence'.
  *   **The Risk:** If you broaden 'retention' to include asymptotic limits, you risk making the concept so weak that almost anything counts as retained structure (inviting the Newman objection back in). If you keep it strict, you fail to account for the success of Newtonian mechanics. You cannot have strict identity and asymptotic recovery under the same definition of 'retention' without equivocation.

  **Flag C: Non-Begging Structure vs. Historical Reality**
  There is a tension between **Desideratum 7 (Non-Begging Structure)** and **Desideratum 1 (Causal-Explanatory Link)**.
  *   **The Conflict:** To avoid begging the question, you must define structure mathematically (e.g., symmetries) before looking at history. However, history is messy. It is not guaranteed that the mathematically 'pure' structure is what actually survives. Sometimes ad-hoc mathematical fixes survive while elegant symmetries are discarded.
  *   **The Risk:** If you define structure a priori (e.g., "only gauge symmetries are real"), you risk ruling out the very things that historically survived. If you adjust the definition to fit the history, you violate Desideratum 7. Satisfying both requires a pre-established harmony between mathematical aesthetics and historical contingency which is not guaranteed.

  ### Summary of the Specification
  To satisfy your NMA purpose, a Structural Realist theory must:
  1.  Identify a specific mathematical/categorical element as the cause of success.
  2.  Show that element survives theory change (either literally or asymptotically).
  3.  Prove that element can be identified *without* knowing the future theory.
  4.  Explain why some successful theories (Phlogiston) lack this element without undermining the link between success and structure in general.

  If a paper you read fails to address the Phlogiston case without shrugging, or defines structure only by pointing to Maxwell, it fails this spec. If it demands you believe in relations without relata to make the NMA work, it is exceeding the brief.
