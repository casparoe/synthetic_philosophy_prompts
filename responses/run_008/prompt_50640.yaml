prompt: |-
  I'm an undergrad in a Nietzsche seminar this semester, and for my term paper (due in nine days, currently a very long google doc of quotes and no actual thesis) I picked the second Untimely Meditation, On the Use and Abuse of History for Life. My professor posted a PDF of the essay that's some nonstandard translation -- it's not the Hollingdale one, I have no idea who did it -- so the wording might look a little off compared to whatever edition you're used to.

  Anyway, I did fine with the cattle/f forgetting stuff in section 1 and the monumental history part, but I've been staring at this passage from the middle of section 3, right after the bit about the antiquarian guy who treats the history of his city like a diary of his own youth, and I can't crack it:

  "Now, that is naturally not the condition in which a person would be most capable of dissolving the past into pure knowledge. Thus, also we perceive here what we discerned in connection with monumental history, that the past itself suffers, so long as history serves life and is ruled by the drive to live. To speak with some freedom in the illustration, the tree feels its roots more than it can see them. The extent of this feeling, however, is measured by the size and force of its visible branches. If the tree makes a mistake here, then how mistaken it will be about the entire forest around it! From that forest the tree only knows and feels something insofar as this hinders or helps it, but not otherwise."

  Three things are bugging me. (1) the past itself suffers?? the past is over, nothing can happen to it, so what is suffering here. (2) why is the tree's feeling for its roots measured by the size of its branches -- I would've thought it runs the other way, that your grip on where you came from determines how strong you grow. Is this connected to the "plastic power" thing at the end of section 1 (the strength to grow out of your past and incorporate it), and if so how. (3) what mistake can a tree even make, and why does the mistake scale up from the tree to the whole forest. My TA says this tree image is the hinge connecting the antiquarian part to the critical history part that comes a few paragraphs later (the judging-and-condemning kind), and that once I figure out what the "mistake" is I'll basically have my paper, but shes leaving town for a conference and my office hours slot got cancelled.

  Please explain the passage to me in exactly five numbered points, each one a sentence or two, with no introduction or conclusion. At least one of the points should say whether my TA's "hinge" reading holds up or whether this is just a one-off metaphor Nietzsche drops and never cashes out.
