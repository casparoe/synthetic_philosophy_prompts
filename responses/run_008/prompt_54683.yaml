answer: |-
  **Q1. The Long View**
  *Case:* You look at a map of your world's last two thousand years. Borders shift, empires rise and fall, gods change.
  *Claim:* **History has a net direction.**
  *   **A. Yes.** Despite the chaos, humanity is moving toward a specific destination (perfect peace, divine union, total reason). → *Go to Q2.*
  *   **B. No.** History moves in waves, seasons, or circles. There is no final destination, only patterns. → *Go to Q3.*
  *   **C. Unsure.** It looks like a line, but it keeps doubling back on itself. → *Go to Q3.*

  **Q2. The Engine of Progress**
  *Case:* A technological or magical breakthrough solves a fundamental scarcity (e.g., famine ends forever).
  *Claim:* **Human nature is fundamentally altered by external tools.**
  *   **A. Yes.** We cannot go back to the old way; we are a new kind of people now. → *[LEAF: Linear – Progress View]*
  *   **B. No.** We still sin struggle, and suffer; this was just a step in a divine or pre-ordained plan. → *[LEAF: Linear – Providence View]*
  *   **C. No.** Eventually, this technology will be lost or corrupted, and we will return to the start. → *Go to Q9.*

  **Q3. The Unit of Cycle**
  *Case:* A great empire collapses. What is the thing that is actually cycling?
  *Claim:* **The cycle is political rather than biological.**
  *   **A. Yes.** It is the *form of government* that rotates (King → Tyrant → Lords → People). → *Go to Q4.*
  *   **B. No.** It is the *people or culture* itself that is born, grows, and dies. → *Go to Q6.*
  *   **C. No.** It is the *ruling dynasty or clan* that loses its grip. → *Go to Q5.*

  **Q4. The Precision of Politics**
  *Case:* The empire falls and a new one rises.
  *Claim:* **The cycle repeats with exact mechanical precision.**
  *   **A. Yes.** Monarchy *always* decays into Tyranny, then Aristocracy, etc. The stages are fixed. → *Go to Q9.*
  *   **B. No.** The stages are similar, but each return is on a different level (higher or lower). It is a spiral, not a circle. → *[LEAF: Vico – Corsi e Ricorsi]*
  *   **C. No.** The cycle exists, but it can be stalled or sped up by laws. → *Go to Q10.*

  **Q5. The Mechanism of Dynasty**
  *Case:* Why did the ruling clan lose power after three generations?
  *Claim:* **Decline is caused by loss of social solidarity (group-bond).**
  *   **A. Yes.** The first generation was hard/united; the third was soft/individualistic. → *Go to Q7.*
  *   **B. No.** They lost power because they became corrupt or cruel (moral failure). → *[LEAF: Polybius – Anacyclosis]*
  *   **C. No.** They were conquered by outsiders who had stronger solidarity. → *Go to Q7.*

  **Q6. The Fate of Culture**
  *Case:* A civilization enters its "winter" or decline phase.
  *Claim:* **This death is biologically fatal and unavoidable.**
  *   **A. Yes.** Like an old man, it cannot become young again. It must die. → *Go to Q8.*
  *   **B. No.** It dies only because it failed to solve a specific problem. It could have lived. → *Go to Q8.*
  *   **C. Unsure.** It dies, but its spirit passes into a new civilization. → *[LEAF: Spengler – Organic Civilizations]*

  **Q7. The Generational Span**
  *Case:* How long does a ruling group typically last before losing cohesion?
  *Claim:* **There is a rough natural lifespan (approx. 4 generations).**
  *   **A. Yes.** Roughly 120 years. The great-grandchildren forget the struggle. → *[LEAF: Ibn Khaldun – Asabiyyah]*
  *   **B. No.** It varies based on how hard the challenges are. → *Go to Q8.*
  *   **C. No.** It varies based on wealth distribution. → *[LEAF: No Named Position – Materialist Cycle]*

  **Q8. The Role of the Minority**
  *Case:* Why does the civilization fail to respond to the challenge?
  *Claim:* **Failure is caused by the creative minority losing authority.**
  *   **A. Yes.** The leaders stop leading and start dominating; the people withdraw allegiance. → *[LEAF: Toynbee – Challenge and Response]*
  *   **B. No.** The leaders are fine, but the external shock was simply too strong. → *[LEAF: No Named Position – External Determinism]*
  *   **C. No.** The people become too comfortable to follow anyone. → *Go to Q10.*

  **Q9. The Role of Innovation**
  *Case:* A new tool or magic appears during the cycle.
  *Claim:** **Technology resets or breaks the cycle.**
  *   **A. Yes.** It allows a society to escape the usual decay (at least for a time). → *[LEAF: No Named Position – Technological Interruptus]*
  *   **B. No.** It just gives them better weapons to fight the same inevitable war. → *[LEAF: Polybius – Anacyclosis]* (If coming from Q4)
  *   **C. No.** It accelerates the decay by making life too soft. → *[LEAF: Ibn Khaldun – Asabiyyah]* (If coming from Q2)

  **Q10. The Meaning of Ruins**
  *Case:* You stand in the ruins of the previous age.
  *Claim:** **The ruins are a warning vs. a seed.**
  *   **A. A Warning.** They prove that all flesh is grass; do not build too high. → *[LEAF: Spengler – Organic Civilizations]* (If coming from Q6)
  *   **B. A Seed.** Their knowledge is preserved to start the next spiral higher. → *[LEAF: Vico – Corsi e Ricorsi]* (If coming from Q4)
  *   **C. A Grave.** They are dead, and we are different. Nothing transfers. → *[LEAF: No Named Position – Discontinuous Cyclical]*

  ***

  ### Scoring Key & Path Map

  | Path | Resulting Position | Notes |
  | :--- | :--- | :--- |
  | **Q1(A) → Q2(A)** | **Linear – Progress** | History moves forward; tech changes nature. |
  | **Q1(A) → Q2(B)** | **Linear – Providence** | History moves forward; divine plan dictates arc. |
  | **Q1(A) → Q2(C) → Q9** | **No Named Position** | Linear start, Cyclical end. Incoherent unless "Progress is impossible." |
  | **Q1(B/C) → Q3(A) → Q4(A) → Q9(B)** | **Polybius** | Political forms rotate exactly. |
  | **Q1(B/C) → Q3(A) → Q4(B)** | **Vico** | Spiral history; return but not repetition. |
  | **Q1(B/C) → Q3(A) → Q4(C) → Q10(B)** | **Vico** | Alternative path to Spiral. |
  | **Q1(B/C) → Q3(C) → Q5(A) → Q7(A)** | **Ibn Khaldun** | Social solidarity decays over generations. |
  | **Q1(B/C) → Q3(C) → Q5(A) → Q9(C)** | **Ibn Khaldun** | Alternative path (Tech makes soft). |
  | **Q1(B/C) → Q3(B) → Q6(A) → Q10(A)** | **Spengler** | Cultures are organisms; death is fate. |
  | **Q1(B/C) → Q3(B) → Q6(C)** | **Spengler** | Alternative path (Spirit transfers, but body dies). |
  | **Q1(B/C) → Q3(B) → Q6(B) → Q8(A)** | **Toynbee** | Civilizations suicide via failed response. |
  | **Q1(B/C) → Q3(B) → Q6(B) → Q8(B)** | **No Named Position** | External Determinism. Not defended by major cyclical theorists. |
