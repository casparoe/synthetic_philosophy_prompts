answer: |-
  1. Everyone has enough income to live comfortably, but some people have 100 times more wealth than others simply because of market returns. Is this gap unjust in itself?
     A) No, as long as everyone is comfortable.
     B) Yes, large gaps are inherently bad.
     C) It depends on whether the wealth was earned or inherited.

  2. Two people end up with different incomes; one worked overtime, the other chose more leisure time. Should the state redistribute income from the worker to the non-worker?
     A) No, that penalizes choice.
     B) Yes, equality matters more than choice.
     C) Only if the leisure choice was forced by lack of opportunity.

  3. A massive income inequality results from a series of voluntary, fraud-free transactions between adults. Is redistribution justified?
     A) No, the process was fair so the outcome is fair.
     B) Yes, the outcome is too unequal regardless of process.
     C) Yes, if the inequality undermines democratic equality.

  4. Imagine a society where everyone has the exact same income, but social castes determine who gets respect and who gets scorn. Is this an unequal society?
     A) No, economic equality is what matters.
     B) Yes, status hierarchy is the real inequality.
     C) Yes, because caste usually leads to economic gaps eventually.

  5. The poorest group is already above subsistence, but their income could rise slightly if the richest group's income doubles. Is this trade-off acceptable?
     A) Yes, maximize the minimum regardless of the gap.
     B) No, cap the rich even if the poor gain nothing more.
     C) Yes, because the poor are already above the decent floor.

  Scoring Key

  Note: The "European vs. American" framing your friend used is muddy geopolitics, not philosophy. Europeans can be libertarians; Americans can be egalitarians. This quiz sorts by philosophical commitment, not passport. Also, five questions cannot perfectly isolate every nuance; if you score mixed results, you hold a hybrid view.

  Mostly A's: Sufficientarian. You care about the floor, not the ceiling. If everyone is decently provided for, you don't lose sleep over billionaires. You likely reject the Rawlsian Difference Principle (Q5) because once the floor is met, you stop worrying about distribution.

  Mostly B's on Q1, Q2, Q5: Strict Egalitarian. You believe inequality is intrinsically bad, even when everyone is comfortable. You prioritize narrowing gaps over maximizing the minimum or respecting choice-based outcomes.

  Mostly C's on Q1, Q2: Luck Egalitarian. You distinguish between brute luck (inheritance, birth) and option luck (choices, work). You support redistribution to neutralize unfair advantages but let people keep the gains from their own choices.

  Mostly A on Q3: Libertarian/Proceduralist. You believe fair procedures justify any outcome. If the rules were followed and rights weren't violated, the state has no business fixing the result, regardless of the gap.

  Mostly B on Q4: Relational Egalitarian. You care about status, domination, and hierarchy more than raw income shares. You might accept some income inequality if it doesn't create caste, but you reject status hierarchy even if incomes are equal.

  Mostly A on Q5: Rawlsian. You accept inequality only if it maximizes the position of the worst-off. Unlike the Sufficientarian, you don't stop caring once the poor are "comfortable"; you want them as well-off as possible.

  Mixed A/B on Q5: This separates the Sufficientarian (A/C) from the Rawlsian (A). If you said "Yes" to Q5 because the floor is met (C), you're a Sufficientarian. If you said "Yes" because the poor gained (A), you're a Rawlsian. If you said "No" (B), you're a Strict Egalitarian.

  Overlap Warning: Relational Egalitarians and Strict Egalitarians often vote the same way on policy. The quiz separates them on theory (Q4), but in practice, both usually support redistribution. Libertarians and Proceduralists are effectively the same view in this context; don't bother splitting hairs between them.
