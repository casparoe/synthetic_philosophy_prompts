answer: |-
  # The Deception Diagnostic: A Decision Tree

  **Instructions:** Walk through the questions below. Answer based on your gut reaction to the specific scenarios, not based on the ethical label you think you should hold. Your path determines your diagnostic profile.

  ---

  ### **ROOT NODE: The Used Car (Paltering)**
  **Scenario:** A used car seller knows the car was in a major crash. The brakes and paint are new (true). A buyer asks, "Is the car in good mechanical condition?" The seller says, "The brakes are brand new and the paint is fresh," while staying silent about the crash. The buyer infers the car wasn't crashed.

  **Question:** Compared to a seller who simply lies and says, "This car has never been in a crash," is the paltering seller's behavior:
  *   **(A) Less Bad** (Lying is worse) → *Go to Node 1*
  *   **(B) Equally Bad** (Deception is what matters) → *Go to Node 2*
  *   **(C) Worse** (Paltering is more manipulative) → *Go to Node 3*

  ---

  ### **NODE 1: The Hierarchy View (Lying is Worse)**
  *You believe there is a moral gap between lying and misleading. Now we must measure the size of that gap.*

  **Scenario:** The Murderer at the Door. A violent pursuer asks you where your friend is hiding. You know the friend is in the basement. You cannot merely mislead (the pursuer will check); you must flatly lie to save the friend's life.

  **Question:** Are you morally permitted to tell the lie?
  *   **(A) No.** (It is forbidden, even to save a life.) → *Go to Leaf 1*
  *   **(B) Yes.** (It is the right thing to do.) → *Go to Node 1.1*
  *   **(C) No, but...** (It is forbidden, but you are not blameworthy for doing it.) → *Go to Leaf 1*

  > **⚠️ Unoccupied Cell Diagnosis:** If you answered "Yes, lying is permitted" but also believe "Misleading is forbidden in this case," you occupy an incoherent position. If the worse act (lying) is permitted to save a life, the lesser act (misleading) cannot be forbidden.

  #### **NODE 1.1: The Weight of the Lie**
  **Question:** If you lie to save the life, have you still done something morally wrong that needs excusing, or have you done the right thing all-things-considered?
  *   **(A) Still Wrong.** (You violated a duty, even if necessary.) → *Leaf 1 (Kantian Strict)*
  *   **(B) Right Thing.** (The duty to save life overrides the duty of truth.) → *Leaf 2 (Assertion-Norm Moderate)*
  *   **(C) Irrelevant.** (The only thing that matters is that you kept your own soul clean.) → *Leaf 3 (Integrity View)*

  ---

  ### **NODE 2: The Deception View (Lying = Misleading)**
  *You believe the linguistic form doesn't change the moral status; the intent to deceive is what counts.*

  **Scenario:** The Scalar Case. A colleague asks, "Do some of the co-authors smoke?" You know *all* of them smoke. You answer "Yes." This is literally true, but you know they will infer "Not all."

  **Question:** Why is this answer (or the paltering car seller) morally problematic?
  *   **(A) Because of the Intent.** (You intended to create a false belief.) → *Leaf 4 (No-Intrinsic-Difference Deception)*
  *   **(B) Because of the Outcome.** (It causes harm; if no harm occurred, it would be fine.) → *Leaf 5 (Deflationary/Consequentialist)*
  *   **(C) Because of the Trust.** (It violates the general expectation of cooperation.) → *Leaf 6 (Cooperative Violation)*

  > **🚩 Indistinguishability Flag:** **Leaf 4** and **Leaf 5** are extremely difficult to separate using cases alone. Both treat lying and misleading as morally equivalent. The difference is meta-ethical (is deception *inherently* wrong, or only wrong due to *consequences*?). Without asking "Why?", a reader's case judgments will likely land them in both buckets simultaneously.

  ---

  ### **NODE 3: The Responsibility View (Misleading is Worse)**
  *You believe paltering shifts an unfair burden onto the listener.*

  **Scenario:** The Witness Under Oath. A lawyer asks a witness, "Did you see the defendant on Tuesday?" The witness saw him on Tuesday and Wednesday but replies, "I saw him on Wednesday," knowing the jury will infer he wasn't there Tuesday.

  **Question:** What makes this move especially corrosive compared to a flat lie?
  *   **(A) Epistemic Shifting.** (It forces the listener to do the work of deception themselves.) → *Leaf 7 (Misleading-Can-Be-Worse)*
  *   **(B) Contempt.** (It assumes the listener is too stupid to ask the right follow-up questions.) → *Leaf 8 (The Cynic View)*
  *   **(C) Legal Evasion.** (It exploits the rules of the courtroom specifically.) → *Go to Node 3.1*

  #### **NODE 3.1: The Context Check**
  **Question:** Is this "worse" dynamic unique to high-stakes settings like courtrooms, or does it apply to everyday conversation too?
  *   **(A) Everyday too.** (It's always worse to make me deceive myself.) → *Leaf 7 (Misleading-Can-Be-Worse)*
  *   **(B) Only in Institutions.** (In daily life, people should verify; in court, truth is mandatory.) → *Leaf 9 (Contextualist)*

  > **⚠️ Unoccupied Cell Diagnosis:** If you believe Misleading is *generally* worse than Lying (Node 3), but that the Witness case is *permissible* while a lie would not be, you occupy an unstable position. You are claiming the "worse" act is allowed while the "better" act is forbidden in the same high-stakes context.

  ---

  ### **THE LEAVES: Diagnostic Profiles**

  1.  **The Kantian Strict-Difference:** Lying is categorically forbidden because it violates the norm of assertion. Misleading is permissible (e.g., at the Murderer's door) because it does not violate that specific norm. You prioritize the *act type* over the *outcome*.
  2.  **The Assertion-Norm Moderate:** Lying is intrinsically worse than misleading because it corrupts the practice of assertion. However, this "tax" can be outweighed by urgent consequences (e.g., saving a life). You see the distinction as real but *overridable*.
  3.  **The Integrity View:** The distinction matters because lying damages *your* character, whereas misleading does not. You are less concerned with the listener's rights and more with the speaker's moral record.
  4.  **The No-Intrinsic-Difference Deception:** The moral wrong is the *intent to induce false belief*. Whether you do this via assertion (lie) or implication (mislead) is morally irrelevant. Paltering and lying land in the same bucket.
  5.  **The Deflationary View:** The linguistic boundary between asserting and implying is real, but morally inert. Wrongness is determined solely by consequences or harm. If a lie and a mislead cause the same harm, they are the same wrong.
      *   *(See Indistinguishability Flag at Node 2 regarding Leaf 4)*.
  6.  **The Cooperative Violation:** Both lying and misleading are equally bad because they violate the fundamental "cooperative principle" of communication. You don't need to distinguish the mechanism; the breach of trust is the crime.
  7.  **The Misleading-Can-Be-Worse:** Paltering is sometimes *more* blameworthy than lying because it exploits the listener's own reasoning against them, shifting epistemic responsibility onto the victim.
  8.  **The Cynic View:** Misleading is worse because it expresses greater contempt for the listener's intelligence. It treats the listener as a pawn to be maneuvered rather than a person to be confronted.
  9.  **The Contextualist:** The moral weight of the distinction depends on the setting. In negotiations, paltering is expected (permissible); in court or close relationships, it is worse than lying because it abuses specific institutional or relational norms.

  ---

  ### **Instructor's Note on Separation Limits**

  **Can this tree separate the Kantian (Leaf 1) from the Moderate (Leaf 2)?**
  *   **Verdict:** *Barely.*
  *   **Reasoning:** The tree relies on the "Murderer at the Door" case to split them. A classic Kantian says "Lying is forbidden." A Moderate says "Lying is permitted." However, sophisticated students often conflate "forbidden but excusable" with "permitted." If a student answers "Yes, permitted" but believes the agent still committed a moral violation (a "moral remainder"), they are functionally Kantian but will be sorted as Moderate. To truly separate them, you must ask not about *permission*, but about *moral residue* (Node 1.1). Even then, a student's self-report on their own intuition about "residue" may be unreliable without further philosophical training.

  **Can this tree separate No-Intrinsic-Deception (Leaf 4) from Deflationary (Leaf 5)?**
  *   **Verdict:** *No, not reliably via cases.*
  *   **Reasoning:** Both views predict identical judgments on the Used Car, Scalar, and Witness cases (Lying = Misleading). The difference is theoretical: one thinks deception is *inherently* wrongful (Deontology), the other thinks it is wrongful only due to *harm* (Consequentialism). Since the tree is designed to sort by *case judgments* rather than *theoretical allegiance*, these two leaves will often capture the same people. Distinguishing them requires asking "Why is it wrong?" rather than "Is it wrong?"
