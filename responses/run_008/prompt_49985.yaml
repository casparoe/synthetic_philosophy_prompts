  2.  **Secures Verdict (6):** It provides the ontological ground for the "objective fact" of Goliath's perishing (the loss of the categorical kind-property *statue*).
  3.  **Minimal Cost:** It does not require you to abandon Realism (4), Distinctness (1), or Supervenience (3). It only requires you to admit that "being a statue" is a real, categorical feature of the world, not just a modal or conceptual one.
  4.  **Mitigates Parsimony Tension (Severity 2):** By treating kind-properties as real categorical features, you can argue that Goliath and Lumpl are not "two things in one place" in a problematic sense, but rather two distinct *substantial forms* or *kinds* realized in the same matter. This helps them "earn their place" under (5).

  **Summary:** Your package is internally unstable because (2) starves (3) and (4) of the resources they need to make (1) and (6) true. Expanding (2) to include high-level categorical differences feeds the machinery of your view without requiring you to abandon your core realist intuitions.
