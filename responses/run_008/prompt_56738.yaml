  ### 1. The Fischer thesis and its rivals

  The Fischer thesis posits that German leadership deliberately engineered a continental conflict to secure hegemony before Russian modernization closed the window of opportunity. The archival core rests on the "blank cheque" given to Austria-Hungary in July 1914 and the September Programme's expansionist aims. Proponents argue Berlin encouraged Vienna's punitive expedition against Serbia knowing it would likely draw in Russia, calculating that a localized war might escalate into a preventive strike against the Entente. Responsibility here tracks specific intent: Germany wanted this war, or at least accepted it as a necessary instrument of policy. The decision-making in July is viewed as a calculated gamble where German officials sidelined peaceful solutions to pursue strategic dominance. For Fischer, the key evidence is that Germany rejected mediation offers that could have contained the crisis, preferring to push Austria toward intransigence. The war was not an accident but a bid for "world power status," driven by a domestic consensus among elites that expansion was necessary for survival.

  The multi-causal rejoinder, conversely, treats the war as a systemic failure rather than a criminal conspiracy. It emphasizes that all great powers operated under offensive military doctrines and rigid alliance commitments that turned crisis into catastrophe. Austria sought survival against Serbian nationalism; Russia mobilized to preserve prestige and alliance credibility; France backed Russia to maintain the encirclement of Germany; Britain hesitated until neutrality became impossible. In this view, no single capital desired a general war, but all accepted grave risks to protect vital interests. The crisis was driven by mutual misreading and mobilization timetables that seized control from politicians. Here, responsibility dissolves into a complex web where every actor contributed to the slide, making singular attribution empirically false. The strongest version of this argument does not deny German aggression but contextualizes it as one reactive move among many in a security dilemma where every defensive measure looked like an offensive threat to a neighbor. Crucially, it highlights Russian early mobilization as the step that turned a Balkan conflict into a continental one, arguing that German declarations of war were reactive defenses against Russian troop concentrations. Thus, the multi-causal view shifts the focus from a German plot to a collective failure of crisis management where every capital believed war was the least bad option available. It argues that the "blank cheque" was standard alliance support that spiraled out of control due to external pressures, not a unique trigger pulled by Berlin.

  ### 2. From causation to responsibility

  Rejecting the Fischer thesis does not dissolve responsibility; it merely changes what responsibility tracks. Your friend assumes that without sole authorship, blame must be evenly distributed or abandoned. This is a false dichotomy. Responsibility in complex systems is rarely about who pulled the trigger, but about who created the conditions where pulling the trigger became likely, and who held the power to prevent it. Even under a multi-causal description, responsibility tracks asymmetries in risk-taking and preventability.

  Consider the dimension of risk. While all powers accepted the possibility of war, Germany's risk calculus was distinct. Berlin gambled on British neutrality despite knowing the violation of Belgian neutrality made this improbable. This was not a miscalculation shared by London or Paris; it was a specific German wager. Furthermore, consider preventability. Germany held the "brake" on Austria-Hungary. Vienna made it clear they needed German support to act; Berlin provided it unconditionally. Russia, France, and Britain reacted to Austro-German moves; Germany initiated the escalation ladder by transforming a Balkan dispute into a continental confrontation. Without the blank cheque, Austria likely seeks diplomacy; without German aggression, Russia likely mobilizes later.

  The stakes also differ. Austria fought for imperial survival; Russia for prestige; but Germany fought for hegemony. Running an enormous risk for illegitimate stakes (conquest) differs morally from running a risk for defensive stakes (alliance credibility), even if both contribute to the same disaster. Therefore, the multi-causal view does not necessitate equal blame. It allows for a gradient of responsibility where Germany bears the heaviest burden not because it alone caused the war, but because its contribution was most sensitive to the outcome, its risk was most reckless, and its power to stop the cascade was greatest. Blame is not erased by complexity; it is refined by it. To say everyone is responsible is not to say everyone is equally responsible. There is something suspicious about the rhetoric of shared responsibility: a finding that blame is everywhere can function as a finding that it is nowhere. The party with the most power to stop a catastrophe is often the one that benefits most when the catastrophe is declared nobody's fault. In July 1914, Germany had the most leverage to constrain its ally and chose instead to widen the conflict. Thus, even if the war was a systemic failure, Germany was the system's primary architect of failure. Counterfactual reasoning supports this: if Russia mobilizes but Germany restrains Austria, the war likely remains localized. If Germany pushes Austria but Russia stays still, the crisis resolves. Germany's decision was the pivotal variable upon which the general war was most sensitive.

  ### 3. Can a nation be blamed?

  Your friend's individualism rests on a metaphysical claim: states have no minds, only members do. Therefore, blaming a nation is a category error. This holds if we speak of moral guilt in the criminal sense; a French peasant cannot feel remorse for German actions. However, political responsibility is not identical to moral guilt. A defender of nation-level responsibility argues that states function as corporate agents with institutional continuity that transcends individual officeholders.

  The state possesses a "shared intention" encoded in its bureaucracy, military doctrines, and policy traditions. When German officials issued the blank cheque, they acted not as private individuals but as organs of a state apparatus designed to pursue specific national interests. This institutional agency survives the individuals. The Prussian military tradition, for example, constrained and enabled leaders regardless of who sat on the throne. To blame the nation is to blame the continuity of these structures. Furthermore, populations inherit the gains and losses of state action. German citizens in 1919 inherited the territorial gains sought in 1914 and the defeat that followed. Because the collective benefits from the state's power, the collective bears responsibility for its use.

  Does this survive scrutiny? It survives as political responsibility, not moral sin. It is not shorthand for blaming dead officials; it is about holding the enduring entity accountable. If we only blame individuals, responsibility vanishes when they die or act within authorized roles. Institutional blame ensures that the structures themselves are subject to critique and reform. However, we must distinguish between the state apparatus and the populace. The populace bears responsibility only insofar as they sustain the institutions or benefit from their aggression. Thus, nation-blame is valid if understood as the responsibility of a political community for its corporate actions, rather than the personal guilt of every citizen. It acknowledges that some agents are too large to be reduced to the sum of their current members. To say "Germany is responsible" is to say the German state apparatus acted wrongly, and the political community bound to that apparatus must answer for it. This is not a metaphor; it is a recognition of how power operates in the international system. Individuals act, but institutions authorize, sustain, and direct those actions over decades. Blaming the nation targets the source of continuity that individual blame misses. Without this concept, we cannot hold powers accountable for long-term policies that outlast any single administration. The First World War was not merely the sum of individual decisions; it was the output of a state machine that required collective accountability.

  ### 4. Verdict

  The verdict must reject both the simplistic singularity of the original Fischer thesis and the exculpatory neutrality of the multi-causal drift. Germany bears primary responsibility for the First World War. This is not because Berlin alone caused the war, but because its leadership made the decisive choice to escalate a regional crisis into a general conflict. The multi-causal view explains the mechanism of the spread, but it does not absolve the initiator of the escalation. Germany held the brake and refused to use it.

  Furthermore, nations can be blamed, provided we understand this as political responsibility rather than individual moral guilt. The German state acted as a corporate agent, and the political community inherits the liability for that agency. To deny this is to allow states to escape accountability by hiding behind the complexity of their own bureaucracies.

  Therefore, the stalemate is resolved by acknowledging unequal responsibility within a multi-causal framework. Germany is not the sole author, but it is the primary architect. The war was a collective failure, but Germany's failure was the most significant. We assign blame not to punish a populace, but to acknowledge the historical truth of power: that some actors have more capacity to prevent disaster than others, and with that capacity comes the burden of responsibility. Germany had that capacity in July 1914, and it failed. The multi-causal argument correctly identifies that many hands touched the gun, but it fails to acknowledge who loaded it. Responsibility tracks the asymmetry of risk and power. Germany gambled the peace of Europe for hegemony; others gambled for survival or prestige. That distinction matters. To say "everyone is to blame" is to obscure the specific choices that made the war inevitable. Germany's choices were the most consequential. Thus, while the war was a systemic collapse, the German state bears the lion's share of the responsibility for converting a crisis into a catastrophe.
