answer: |-
  There is no single, established term in economics or sociology that captures the *entire* lifecycle you describe: the rise of a marker based on cost, its degradation via imitation, its inversion into a negative signal, and the subsequent migration to a new, often effort-concealing marker.

  However, your description is a precise synthesis of three distinct existing concepts. To understand why a new term is needed, we must first clear the ground of its neighbors:

  1.  **Costly Signaling Theory (Biology/Economics):** This establishes the mechanism: a signal is trustworthy only if it is costly to fake (the "handicap principle"). You have correctly identified that when the cost drops, the signal breaks.
  2.  **Countersignaling (Game Theory):** This describes the *end state* you mentioned (the "quiet luxury" or "effortlessness"). High-status actors signal *less* than middle-status actors because their status is assumed. This explains the destination, but not the journey or the destruction of the old signal.
  3.  **Trickle-Down Theory (Simmel/Veblen):** This describes the *movement* of fashion from elites to masses. However, classical trickle-down theory suggests the elite abandon a style because it becomes *common*, not necessarily because the *cost of imitation* collapses to the point of falsification.

  Your pattern adds a crucial mechanistic detail: the signal doesn't just become common; it becomes **inverted**. It shifts from signaling "high status" to signaling "aspirational/fake." This is stronger than mere depreciation; it is a reversal of informational value.

  Because no existing term captures this specific dynamic of *cost-erosion leading to signal inversion*, I propose the following coinage.

  ### The Coined Term: The Costly-Signal Inversion Cycle

  **Definition:**
  A socio-economic dynamic in which a status marker derives its value from a high barrier to production (financial, technical, or cultural). As the barrier lowers through technological diffusion or cultural codification, the marker becomes easily falsifiable. Consequently, the marker's informational value depreciates until it inverts: possession of the marker ceases to signal high status and instead signals membership in an aspiring or imitative class. This forces the original high-status group to migrate to a new marker, frequently one characterized by the concealment of effort (countersignaling).

  **The Four Phases of the Cycle:**
  1.  **Establishment:** A marker is adopted by an elite group. Its value is proportional to its cost (money, time, or training).
  2.  **Diffusion:** The methods of producing the marker are democratized (mass production, manuals, software). The *cost to fake* drops below the *cost to verify*.
  3.  **Inversion:** The marker becomes saturated. Because it is now cheap to produce, possessing it suggests one *needed* to buy the signal. It becomes a "negative signal" (indicating insecurity or counterfeit status).
  4.  **Migration:** The elite abandon the marker for a new one, often one where the cost is hidden (effortlessness, subtlety, or access), restarting the cycle.

  ---

  ### Distinguishing Boundaries

  To ensure this term carves out the specific phenomenon you identified, here is how it differs from its closest neighbors:

  **1. Vs. Conspicuous Consumption (Veblen)**
  *   **Veblen:** Focuses on *waste*. The value lies in the visible destruction of resources (buying a diamond you don't need).
  *   **Inversion Cycle:** Focuses on *honesty*. The value lies in the *difficulty of faking*.
  *   **The Boundary:** If a rich person buys a logo bag to show they can afford to waste money, that is Veblen. If they stop buying the logo bag because *counterfeiters* made it impossible to tell if they are actually rich, that is the Inversion Cycle. Veblen is about burning money; Inversion is about the collapse of trust.

  **2. Vs. Fashion Cycles (Simmel)**
  *   **Fashion:** Driven by *aesthetic novelty* and boredom. The old style is abandoned because it looks "dated."
  *   **Inversion Cycle:** Driven by *informational collapse*. The old style is abandoned because it looks "fake" or "aspirational."
  *   **The Boundary:** If bell-bottoms go out of style because they look ugly, that is Fashion. If logos go out of style because they look like counterfeits, that is the Inversion Cycle. In Fashion, the old item is neutral; in Inversion, the old item is stigmatized.

  **3. Vs. The Snob Effect (Leibenstein)**
  *   **Snob Effect:** A demand-side phenomenon. I want it less *because* others have it (scarcity preference).
  *   **Inversion Cycle:** A supply-side phenomenon. I want it less *because* others can fake it (trust collapse).
  *   **The Boundary:** If I stop buying a painting because everyone has a print, that is the Snob Effect. If I stop buying a painting because high-resolution scans make the original indistinguishable from the copy, that is the Inversion Cycle.

  ---

  ### Boundary Cases and Nuance

  You asked where the boundary cases fall. The Costly-Signal Inversion Cycle applies strictly to **positional goods** (goods whose value depends on relative standing). It does not apply to goods with **intrinsic utility**.

  **1. Time vs. Money Costs**
  The cycle applies equally to time.
  *   *Example:* In the early internet, having a complex, custom-coded website signaled technical elite status. When Wix/SquareSpace made complex sites cheap (time-cost erosion), the elite migrated to "minimalist" text-only sites or curated newsletters (effort concealment).
  *   *Boundary:* If the time cost is the *product* (e.g., waiting in line for a concert), the cycle holds. If the time cost is *learning a skill* (e.g., playing violin), the cycle is slower because the "manual" cannot fully replicate the muscle memory, but it still applies (e.g., auto-tune eroding the signal of vocal perfection).

  **2. Markers That Remain Valuable Despite Cheap Imitation**
  Some markers resist the Inversion Cycle. These are **Intrinsic Signals**.
  *   *Example:* Kindness or physical strength. You can fake a smile, but sustained kindness is hard to fake over a lifetime. You can photoshop muscles, but lifting a heavy object in person is hard to fake.
  *   *Why:* These markers have a **verification mechanism** that remains costly even if production is cheap. The Inversion Cycle requires that *verification* becomes more expensive than *production*. If I can verify your strength by asking you to lift a box, the signal doesn't invert, even if photoshopping is cheap.
  *   *Boundary:* The Cycle only triggers when **Verification Cost > Production Cost**.

  **3. The "Reversal" Case (Body Weight)**
  You mentioned body weight flipping between scarcity and abundance. This is a **Context-Dependent Cost**.
  *   *Mechanism:* In a famine, calories are expensive; fat signals wealth. In abundance, calories are cheap; thinness signals the wealth (time/money) required for diet and gym access.
  *   *Relation to Cycle:* This is a slower, macro-version of the Inversion Cycle. The "cost" of the marker (calories) flipped due to environmental changes, causing the signal to invert. It fits the definition, but operates on a generational timescale rather than a market timescale.

  ### Summary
  The pattern you identified is the **Costly-Signal Inversion Cycle**. It is the specific process by which a status marker is killed not by boredom, but by the collapse of the cost barrier that made it honest, forcing a migration toward countersignaling (effortlessness) to restore the gap between production and verification costs.
