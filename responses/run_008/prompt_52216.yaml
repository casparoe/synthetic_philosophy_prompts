          *   Five specific requirements to develop/motivate: (i) Vindication vs. Correction of modal choices, (ii) No collapsing into compound risk, (iii) Accommodation of comparative/framing effects, (iv) Operational/non-circular measure of ambiguity, (v) Position on dynamic choice (trilemma).
          *   Epistemic Note: Distinguish settled facts from contested norms. Do not present camp-specific preferences as neutral consensus. Acknowledge no-go results.
          *   Output Structure: Desiderata with cases/motivation, identification of non-negotiables vs. preferences, identification of the most exclusionary requirement, dynamic choice trilemma resolution, scoreboard for three families (SEU+Error, MEU, Smooth), brief conclusion.
      *   **Tone:** Philosophical, rigorous, meta-theoretical, neutral but opinionated where requested (e.g., "your own view").

  2.  **Deconstruct the Desiderata:**

      *   *(i) Vindication vs. Correction:* This is the "Rationality" question. Is Ellsberg behavior rational or a bug?
