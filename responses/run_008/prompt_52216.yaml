          *   *Correction:* Needs to explain persistence (cognitive illusion?).
          *   *Status:* Contested.
      *   *(ii) No Collapsing:* Ambiguity $\neq$ Risk.
          *   *Case:* Subjects reduce compound lotteries but still prefer known urns.
          *   *Status:* Crucial for distinguishing ambiguity models from SEU with second-order probabilities (unless those probabilities are treated non-linearly).
      *   *(iii) Comparative/Framing:* Context matters.
          *   *Case:* Joint evaluation vs. separate evaluation. Gain/Loss asymmetry.
          *   *Status:* Empirically robust, theoretically tricky (state-dependence?).
      *   *(iv) Operational Measure:* What *is* ambiguity?
          *   *Case:* Cannot just define it as "what is avoided." Needs an index independent of preference (e.g., information structure).
          *   *Status:* Methodologically vital to avoid tautology.
      *   *(v) Dynamic Choice:* The Trilemma (Dynamic Consistency, Consequentialism, Ambiguity Attitudes).
          *   *Case:* Updating on new information changes the ambiguity attitude in ways that violate DC.
          *   *Status:* Major theoretical hurdle. Requires dropping one leg.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. Acknowledge the Ellsberg data as the fixed point.
      *   **The Desiderata:**
