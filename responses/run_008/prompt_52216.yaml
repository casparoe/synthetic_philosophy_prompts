answer: |-
  ### Fixed Points and Epistemic Ground Rules

  Before evaluating specific models, we must distinguish the empirical bedrock from the normative superstructure. It is **settled** that the modal choices in the Ellsberg Two-Color and Three-Color problems violate the Sure-Thing Principle and cannot be represented by Subjective Expected Utility (SEU) with a single additive probability measure. It is **contested** whether these violations constitute rational responses to informational scarcity or cognitive errors akin to optical illusions. The following desiderata are designed to force any candidate theory to declare its position on these faults lines explicitly.

  ### The Desiderata

  #### (i) The Rationality Stance (Vindication or Correction)
  **Requirement:** The theory must explicitly state whether the Ellsberg preferences are rational phenomena to be vindicated or systematic errors to be corrected. If vindicated, it must demonstrate immunity to dynamic exploitation (money pumps/Dutch books). If corrected, it must provide a psychological or computational mechanism explaining why sophisticated agents persist in the error despite feedback.
  **Motivating Case:** In the Two-Color Ellsberg problem, preferring $A_{red}$ to $B_{red}$ and $A_{black}$ to $B_{black}$ violates additivity. A vindicating theory (e.g., Maxmin) argues this protects against worst-case scenarios. A correcting theory (e.g., SEU + Noise) argues this is a confusion between uncertainty and risk.
  **Epistemic Status:** **Contested.** This is not a technical constraint but a philosophical fork. A theory cannot claim to do both without contradiction.
  **My View:** **Non-Negotiable.** A theory that hedges here is not a theory of choice; it is a description of data. The "price paid" must be explicit.

  #### (ii) The Reduction Distinction (No Collapsing)
  **Requirement:** The theory must distinguish ambiguity from compound risk. It must permit an agent to satisfy the Reduction of Compound Lotteries axiom (treating a two-stage objective risk as a single stage) while still exhibiting ambiguity aversion.
  **Motivating Case:** Subjects often accept that a 50% chance of a 50% chance is 25% (compound risk), yet still prefer a known 50% urn to an unknown urn (ambiguity). If a theory reduces ambiguity to a second-order probability distribution over first-order probabilities and then applies expected utility to that distribution (as in standard Bayesian hierarchical models), it collapses ambiguity into risk. Such a model cannot explain why an agent would pay to resolve ambiguity but not to resolve compound risk.
  **Epistemic Status:** **Settled (Empirically), Contested (Normatively).** Empirically, subjects distinguish them. Normatively, some argue they *should* not (the Reduction axiom).
  **My View:** **Non-Negotiable.** If a model cannot distinguish ambiguity from risk, it is merely a complex risk model. It fails the definition of the domain.

  #### (iii) Contextual Sensitivity (Comparative and Framing Effects)
  **Requirement:** The theory must accommodate the finding that ambiguity aversion is often comparative (joint evaluation) rather than absolute (separate evaluation), and must account for sign reversals between gain and loss domains.
  **Motivating Case:** In separate evaluation, an agent might accept a bet on the ambiguous urn. In joint evaluation (side-by-side with the risky urn), they switch to the risky urn. Furthermore, ambiguity seeking often appears in the loss domain (preferring to bet on unknown probabilities to avoid a sure loss) whereas ambiguity aversion dominates in gains.
  **Epistemic Status:** **Settled (Empirically), Contested (Theoretically).** Most axiomatic models assume context-independent preferences. Accommodating this often requires ad-hoc state-dependence or reference points.
  **My View:** **Preference.** While empirically robust, forcing static axiomatic theories to handle framing often breaks their normative elegance. A theory may legitimately claim to model *competence* (stable preferences) rather than *performance* (framing effects), provided it admits this limitation.

  #### (iv) The Ambiguity Index (Operational Non-Circularity)
  **Requirement:** The theory must provide a measure of ambiguity that is not defined solely by the agent's avoidance behavior. There must be an informational or structural index of ambiguity independent of the preference ordering.
  **Motivating Case:** Defining ambiguity as "whatever the ambiguity-averse agent shuns" is tautological. We need to know *why* Urn B is more ambiguous than Urn A prior to observing the choice. This usually requires an informational structure (e.g., a set of priors, a signal structure) that is exogenous to the utility function.
  **Epistemic Status:** **Contested.** Some subjective approaches argue ambiguity *is* the preference. Others argue it is an property of the information set.
  **My View:** **Non-Negotiable.** Without an independent measure, we cannot distinguish between "the agent is ambiguity averse" and "the agent assigns low probability to the event." The theory must separate belief (ambiguity) from taste (aversion).

  #### (v) Dynamic Coherence (The Trilemma)
  **Requirement:** The theory must take a position on the tension between Dynamic Consistency, Consequentialism, and Non-Neutral Ambiguity Attitudes.
  **Motivating Case:** An ambiguity-averse agent may reject a bet ex-ante but accept it ex-post after receiving information that does not change the underlying probabilities but changes the *ambiguity* (e.g., partitioning the state space). If the agent plans ex-ante to reject, but knows they will accept ex-post, they are dynamically inconsistent.
  **Epistemic Status:** **Contested.** This is the hardest technical hurdle in the field.
  **My View:** **Non-Negotiable (to address), Negotiable (in resolution).** You cannot ignore it. You must choose which axiom to drop.

  ---

  ### Hierarchy of Requirements

  **Non-Negotiable:** (i), (ii), (iv), and the *addressing* of (v).
  A theory that fails (i) is vacuous. A theory that fails (ii) is modeling the wrong phenomenon (risk, not ambiguity). A theory that fails (iv) is circular. A theory that ignores (v) is incomplete.

  **Preferences of Particular Camps:** (iii) and the *resolution* of (v).
  Accommodating framing (iii) is a virtue for behavioral descriptive accuracy but a vice for normative parsimony. How one resolves the dynamic trilemma (v) defines the school of thought (e.g., MEU vs. Recursive Utility), but there is no consensus on the "correct" resolution.

  ### The Dynamic Trilemma: A Proposed Resolution

  The trilemma states that **Dynamic Consistency** (plans made today are followed tomorrow), **Consequentialism** (only the future consequences of current actions matter, not the path taken), and **Ambiguity Sensitivity** (preferences violate SEU) are jointly unsatisfiable.

  **My Position:** I would give up **Dynamic Consistency**, provided the violation is structured and predictable via a specific updating rule (e.g., Full Bayesian Updating of a set of priors).
  **Why:** Consequentialism is too strong for ambiguity. In ambiguous contexts, *how* you arrived at a decision node matters because it informs the reliability of the information structure. However, giving up Dynamic Consistency entirely leads to self-defeating plans. The compromise is to retain Consequentialism but accept that ambiguity attitudes shift upon updating, rendering the ex-ante plan "obsolete" not because of time inconsistency in tastes, but because the *informational texture* of the problem has changed.
  **No-Go Result:** I suspect **(ii) and (v) cannot be jointly satisfied in a strong form.** If you rigorously distinguish ambiguity from compound risk statically (ii), you almost inevitably generate dynamic inconsistencies (v) when that information is updated. A theory that claims to satisfy both perfectly is likely hiding a collapse of ambiguity into risk somewhere in the updating rule.

  ### Most Exclusionary Requirement

  **Requirement (v) (Dynamic Coherence)** does the most to exclude actual theories.
  Many static models (including the original Maxmin Expected Utility) handle Ellsberg choices beautifully (satisfying i, ii, iv) but crumble when extended to multiple periods. The literature is littered with models that work for a single urn but fail when the urn is sampled over time. Requiring a coherent dynamic extension eliminates the majority of proposed ambiguity measures, leaving only a few families (like Recursive Smooth Ambiguity or specific MEU updating rules) standing.

  ---

  ### Scoreboard

  **Subjective Expected Utility (SEU) + Error Story**
  This family treats the Ellsberg choices as violations of rationality. It scores perfectly on Dynamic Coherence (v) and Reduction (ii) by definition, as it assumes agents *should* reduce ambiguity to risk. However, it fails Desideratum (i) regarding vindication; it must classify the robust experimental data as "mistakes." While it avoids the dynamic trilemma by denying ambiguity attitudes exist, it fails to explain the persistence of the behavior among sophisticated subjects without invoking ad-hoc cognitive cost functions. It is normatively clean but descriptively bankrupt regarding the specific phenomenon of ambiguity.

  **Maxmin Expected Utility (MEU)**
  MEU scores highly on Vindication (i) and the Reduction Distinction (ii), successfully capturing the Ellsberg patterns as rational worst-case optimization. It handles the Ambiguity Index (iv) well via the set of priors. However, it struggles significantly with Dynamic Coherence (v). Standard MEU is dynamically inconsistent unless paired with specific, often controversial, updating rules (like rectangularity). It also struggles with Contextual Sensitivity (iii), as the "worst case" is often insensitive to framing effects that reverse preferences in loss domains. It is the workhorse of ambiguity theory but pays a high price in dynamic settings.

  **Smooth Second-Order Models (e.g., KMM)**
  These models separate ambiguity attitudes (curvature of the second-order utility) from beliefs (second-order probabilities). They excel at the Ambiguity Index (iv) and offer a nuanced view of Vindication (i), allowing for varying degrees of aversion. They handle the Reduction Distinction (ii) by explicitly modeling the non-reduction of second-order uncertainty. However, like MEU, they face severe challenges with Dynamic Coherence (v); the separation of beliefs and attitudes often breaks down under Bayesian updating, leading to time inconsistency. They are mathematically elegant and flexible but share the dynamic fragility of the MEU class.
