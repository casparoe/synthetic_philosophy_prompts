      *   **Epistemic Check:** Ensure I'm not saying "MEU is true." Say "MEU handles X but pays price Y."

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on (ii):* Make sure to distinguish between *reduction of compound lotteries* (which ambiguity averse agents often accept) and *reduction of ambiguity to risk* (which they reject). The requirement is that the theory must allow ambiguity aversion *even if* reduction of compound risk holds.
      *   *Correction on (v):* The trilemma is usually stated as DC, Consequentialism, and Uncertainty Aversion. I need to be precise. Machina's work is key here. I will recommend dropping Consequentialism or DC. Dropping DC is the standard move for MEU (updating sets of priors). Dropping Consequentialism is more radical. I'll argue for relaxing DC via specific updating rules (like Full Bayesian Updating on sets) but acknowledge the cost. Actually, the prompt asks me to pick *one* to give up. I will pick Dynamic Consistency as the most defensible casualty, provided the violation is predictable.
      *   *Epistemic Tone:* Use phrases like "Proponents argue," "Critics contend," "It is settled that..."
