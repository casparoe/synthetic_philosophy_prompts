          *   *Requirement (ii):* Call it "The Reduction Distinction."
          *   *Requirement (iii):* Call it "Contextual Sensitivity."
          *   *Requirement (iv):* Call it "The Ambiguity Index."
          *   *Requirement (v):* Call it "Dynamic Coherence."
      *   **Non-Negotiables vs. Preferences:**
          *   *Non-Negotiable:* (ii) and (iv). If a theory collapses ambiguity into risk or defines it circularly, it's not a theory of *ambiguity*. (i) is a fork, not a failure, provided the cost is paid.
          *   *Preferences:* (iii) is empirically desirable but hard to formalize without ad-hocery. (v) is where the bodies are buried.
      *   **The Dynamic Trilemma:**
          *   The three legs: Dynamic Consistency (DC), Consequentialism (C), Non-Neutral Ambiguity Attitudes (A).
          *   *My View:* Drop Dynamic Consistency. Why? Because information changes the *structure* of the uncertainty, not just the probabilities. Consequentialism is too strong for ambiguity (the history of how you got there matters for the ambiguity level).
          *   *No-Go Result:* Acknowledge that (ii) and (v) often clash. If you distinguish ambiguity from risk statically, you often break dynamic consistency.
      *   **Most Exclusionary Requirement:** Likely (v) or (ii). I'll argue for (v) because it kills almost all sophisticated static models when extended to time.
      *   **Scoreboard:**
          *   *SEU + Error:* Fails (i) if it claims rationality, passes (v) easily. Fails to capture data as rational.
          *   *MEU (Maxmin):* Captures Ellsberg well. Struggles with (v) (dynamic inconsistency) and (iii) (framing).
