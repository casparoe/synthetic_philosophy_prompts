  Bureau Notice 44-B:
  The Bureau briefly piloted the Self-Indication Assumption, weighting class probability by the number of observers within each class. This resulted in all citizens being assigned to the largest possible reference classes. Consequently, projected doom dates exceeded the thermal death of the universe. The policy was shelved. Doom has been quietly removed from the quarterly ledger. No further action is required regarding existential risk. Fiscal Year projections remain stable.

  Dear Actuary,
  I have read the guidelines. I still do not know which reference class is the true one. Please advise. Everyone I ask gives a different total lifespan.

  Dear Citizen,
  The literature offers no consensus on class selection criteria. This is not a Bureau oversight; it is a feature of the methodology. However, for citizens experiencing classification distress, we offer the courtesy class "Entities Currently Being Classified." This class includes all active filers. It produces an identical forecast for every citizen, reducing administrative overhead. Forms are available at the front desk. Uniformity is economically efficient. The forecast duration matches the average processing time of this column.

  Summary: Reference class selection determines the forecast entirely, and no principled method exists to select the reference class.
