      *   **C3:** Cultivating an emotion for utility undermines its moral weight. Moral feelings must arise spontaneously, not be deployed as tools.
      *   **C4:** Worst moral failures (cruelty, contempt) are character flaws, not one-off acts. Only shame registers character. Therefore, cruel people *should* feel shame (bad about what they are).
