  The principle that best reconciles your intuitions is **Responsibility-Adjusted Gradualism**, which dictates you must continue the week-twenty pregnancy despite the career cost and forces you to retract the verdict that the people-seed case is morally permissible.

  This principle posits that bodily autonomy is a default veto on the duty to sustain life, but that veto is weakened by voluntary assumption of risk and overridden by the dependent's developmental status. In the violinist scenario, the veto holds because there is no causal responsibility; in the distracted-driving and consensual-sex scenarios, the veto weakens because you voluntarily engaged in acts known to create dependency, generating a special obligation akin to parental duty. The "future-like-ours" pull you feel regarding the coma man is correctly identified as a constraint on *killing*, whereas the violinist case is about *refusing aid*; abortion sits at the intersection, where bodily integrity permits refusal of aid early on, but the fetus's increasing moral status (developmental weighting) restricts that refusal as viability approaches.

  Regarding the week-twenty med school case, the principle resolves the flip-flop by weighing the high causal responsibility of consensual sex against the non-life-threatening burden of career disruption. Because the fetus is near viability and the dependency was assumed, the obligation to sustain life outweighs the interest in professional trajectory, requiring you to carry to viability at minimum, even if it necessitates a leave of absence. This honors your intuition that late-term abortion is impermissible while acknowledging that bodily autonomy still limits the sacrifice to health and life, not just convenience.

  The cost of this coherence is inconsistency in your seed-case verdict. If contraception failure creates a moral obligation because opening oneself to the risk of pregnancy is voluntary, then opening a window in seed-country must also create an obligation when screens fail, as both are voluntary acts with foreseeable risks of dependency. You cannot hold that the seed case is "fine" while the contraception case is "wrong-ish" without arbitrariness; the principle demands you view the seed case as equally impermissible, or else concede that the contraception case is permissible. Given your other verdicts, the former is the necessary correction.
