      *   *Physics:* Woodward's interventionism is the one that struggles with physics. Pearl's SCMs can model gravity without a human intervening, as long as the equations hold. I should make this distinction.
      *   *Friend's Comment:* Explain *why* the friend is right. In SCMs, counterfactuals are derived from the structural equations. $Y_{X=x}$ is a counterfactual variable.

  5.  **Final Polish:** Ensure the distinction between *ontology* (what causation is) and *epistemology* (how we learn it) is clear, as the talk mixed them up. Ensure the "Intervention = Conditioning" point is hammered home as the most practically relevant error.

