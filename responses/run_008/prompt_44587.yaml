      *   **Context:** Attended an internal tech talk by a senior data scientist.
      *   **Task:** Evaluate the data scientist's summary of the philosophy of causation (Counterfactual vs. Interventionist/Pearl).
      *   **Specific Claims to Evaluate:**
          1.  Rivalry: Older Counterfactual (Lewis-style) vs. Newer Interventionist (Pearl).
          2.  Pearl's Critique: Counterfactuals are circular/unscientific because unobservable.
          3.  Pearl's Definition: Causation = Manipulation/Intervention (do-operator).
          4.  Corollary 1: No intervention = No causation (e.g., fundamental physics/gravity).
          5.  Corollary 2: Intervention = Conditioning on X after controlling for confounders (back to ordinary stats).
