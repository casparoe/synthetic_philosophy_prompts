      *   *Claim 4: No intervention = No causation (Physics example).*
          *   *Analysis:* This is a common critique of *Manipulability* theories (von Wright, Woodward). Pearl's view is slightly more nuanced. While *identifying* causality often requires intervention, the *definition* relies on the structural model. However, strict interventionists (like Woodward) might say causation is about *in principle* manipulability. Pearl allows for "virtual interventions" in models. But the claim that "no experimenter can manipulate gravity so no causation" is a standard objection to strict manipulationism.
