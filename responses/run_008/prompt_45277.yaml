answer: |-
  A model knows P if and only if P is represented in its activations such that interventions on that representation or semantically equivalent inputs causally drive P-consistent behavior, unless the failure to exhibit P-consistent behavior stems from a distinct suppression mechanism that itself requires access to P.

  This principle triangulates between your causal and dispositional instincts by demanding causal efficacy while allowing for accessibility constraints and active hiding. The first clause ("interventions... causally drive") eliminates Case 2 (spurious probes), ensuring that decodability alone is insufficient without leverage over the model's computation. The second clause ("semantically equivalent inputs") rescues Case 3 (elicitation/persona), defining knowledge as stable across reasonable contextual shifts rather than tied to a single prompt formulation, while avoiding the "coaxing into anything" pitfall by restricting inputs to those semantically equivalent to the query. The third clause ("suppression mechanism... requires access") saves Cases 5 (sandbagging) and 6 (denial), distinguishing active hiding—which presupposes knowledge—from mere ignorance or incapacity. Case 1 (Othello) passes because activation editing drives move selection (P-consistent behavior), even without verbal report.

  Running this on your three new cases yields the following predictions. First, for a training checkpoint where probes decode the feature but test performance is chance: the model does not know P yet, because if performance is at chance, interventions on that feature typically fail to reliably drive correct behavior (the circuit is incomplete), matching the verdict for Case 2. Second, for the guardrail variant of Case 4: the model knows P, because the internal computation was P-consistent and the suppression is external (the guardrail requires access to intercept), so the failure to report is due to a distinct mechanism presupposing access. Third, for the case where probing/intervention works but no prompting elicits the behavior: the model knows P, because the principle privileges activation interventions over natural prompting as the gold standard for causal efficacy; this counts as "locked" knowledge rather than absence of knowledge.

  The verdict you must sacrifice is Case 4 (unfaithful chain of thought). Your principle cannot save the claim that the model "knows" the right answer if the output is wrong and the suppression is merely neglect rather than active hiding. In unfaithful CoT, the model often computes the right answer but fails to route it to the output generator; this is a failure of utilization (like Case 2) rather than a suppression mechanism that presupposes access (like Cases 5 and 6). Unless you can prove the model actively selected the wrong answer *because* it knew the right one (active suppression), rather than simply failing to use the right latent state (neglect), the principle classifies this as a reasoning failure, not latent knowledge. This aligns with your uncertainty: if the behavior is wrong, claiming knowledge requires proving the error was a choice, not a bug.
