answer: |-
  ### Editor's Note on the "Moses Bridges" Case
  You asked specifically about the Robert Moses low-bridge case. **Do not use it as your opening anchor.** While it is the canonical example in STS, historians have heavily disputed whether the bridges were actually built low *to exclude buses* or for structural/engineering reasons. If you start a neutral decision tree with a historically contested anecdote, readers who know the controversy will distrust the instrument, and those who don't will be learning a myth.

  **Substitution:** Use a **gated community wall** or a **nuclear power plant** for the first split. A wall physically excludes regardless of intent; a plant physically requires security regardless of ideology. These are less disputed regarding their *material constraints*, which is what matters for the first logical cut. I have used the **nuclear plant** and **surveillance camera** in the tree below for this reason.

  ***

  # The Technology & Politics Sorting Tree

  **Instructions:** Read each case and choose the response that matches your gut reaction. Follow the arrow to the next question. At the end, read your "Leaf Position" and the "Awkward Commitment" you must accept to stay there.

  ### Node 1: The Locus of Power
  **Case:** A surveillance camera is mounted in a public square.
  **Question:** Is the control exerted primarily by the *people watching the feeds*, or by the *camera's presence alone*?
  *   **A:** By the people watching (the tool is passive). → Go to **Node 2**.
  *   **B:** By the presence alone (the object changes behavior). → Go to **Node 5**.

  ### Node 2: The Flexibility of Function
  **Case:** A protestor picks up a broken bottle to use as a shield.
  **Question:** Does this new use prove the object had no prior politics, or that politics is renegotiated constantly?
  *   **A:** No prior politics (it's just glass until used). → Go to **Node 3**.
  *   **B:** Renegotiated constantly (meaning shifts with context). → Go to **Node 4**.

  ### Node 3: The Neutrality of Design
  **Case:** A kitchen mixer is marketed to "save labor" in the home.
  **Question:** If it saves labor, is it purely a benefit, or does it shift who is expected to do the baking?
  *   **A:** Purely a benefit (efficiency is neutral). → **Leaf: Plain Instrumentalism**.
  *   **B:** Shifts expectations (design encodes roles). → **Leaf: Critical-Constructivism**.

  ### Node 4: The Authority of Meaning
  **Case:** An encrypted messaging app is used by activists and criminals alike.
  **Question:** Is the "politics" of privacy fixed by the code, or by how communities adopt it?
  *   **A:** Fixed by the code (technical constraints rule). → **Leaf: Technological Determinism**.
  *   **B:** By how communities adopt it (social interpretation rules). → **Leaf: Social Constructionism**.

  ### Node 5: The Necessity of Hierarchy
  **Case:** A nuclear power plant requires 24/armed security and centralized management to function safely.
  **Question:** Could we generate this power with a completely different, decentralized social structure, or does the tech demand a hierarchy?
  *   **A:** We could build it differently (hierarchy is a choice). → Go to **Node 6**.
  *   **B:** The tech demands a hierarchy (function requires authority). → Go to **Node 7**.

  ### Node 6: The Stability of Systems
  **Case:** A highway system physically connects suburbs but disconnects urban neighborhoods.
  **Question:** Is this demand limited to *this specific infrastructure*, or is it true for *all modern tech*?
  *   **A:** Specific infrastructure (some tools are political, others aren't). → Go to **Node 8**.
  *   **B:** All modern tech (the system itself is the driver). → Go to **Node 9**.

  ### Node 7: The Source of Constraint
  **Case:** An automated assembly line sets a pace that workers must match.
  **Question:** Do workers adapt to the machine's speed, or does the machine's speed dictate the social rhythm of the town?
  *   **A:** Workers adapt (human agency remains primary). → **Leaf: Winner-Style Political Artifact**.
  *   **B:** Machine dictates rhythm (technology drives history). → **Leaf: Strong Technological Determinism**.

  ### Node 8: The Role of Intent
  **Case:** A city planner designs a road divider that prevents buses from crossing into a wealthy district.
  **Question:** If the planner didn't *intend* the exclusion, does the exclusion still count as "politics in the artifact"?
  *   **A:** No, politics requires intent (it's just bad planning). → **Leaf: Plain Instrumentalism** (Return).
  *   **B:** Yes, effects count as politics (structure overrides intent). → **Leaf: Winner-Style Political Artifact**.

  ### Node 9: The Nature of Efficiency
  **Case:** The mechanical clock standardized time to coordinate train schedules and factory shifts.
  **Question:** Does this tool help you find what you want, or does it teach you to want what it can provide (e.g., efficiency over experience)?
  *   **A:** Helps me find what I want (tool serves human ends). → **Leaf: Critical-Constructivism**.
  *   **B:** Teaches me what to want (tech reshapes human ends). → **Leaf: Substantivism**.

  ### Node 10: The Possibility of Escape
  **Case:** A smartphone algorithm suggests news stories that keep you engaged.
  **Question:** Is this a cultural shift we can fix with better design, or a fundamental change in how truth is revealed?
  *   **A:** Fix with better design (politics is repairable). → **Leaf: Social Constructionism**.
  *   **B:** Fundamental change (we live inside "Technology" now). → **Leaf: Substantivism**.

  ***

  # The Leaves: Positions & Awkward Commitments

  ### Leaf: Plain Instrumentalism
  *   **Core View:** Artifacts are neutral; all politics resides in users and institutions.
  *   **Path:** 1A → 2A → 3A (or 8A).
  *   **Awkward Commitment:** You must admit that some tools are significantly harder to use for "good" than for "evil" (e.g., a torture device vs. a plow), yet you still call them neutral. You also must explain why we regulate certain objects (like machine guns) more strictly than others if the object itself doesn't matter.

  ### Leaf: Social Constructionism
  *   **Core View:** Politics found in an artifact is a contingent effect of interpretive flexibility and social interests; the artifact itself settles nothing.
  *   **Path:** 1A → 2B → 4B (or 10A).
  *   **Awkward Commitment:** You must acknowledge that physical constraints *do* exist (you cannot tweet without electricity), even if their meaning is flexible. You risk making politics so fluid that it becomes impossible to critique the hardware itself, only the conversation around it.

  ### Leaf: Winner-Style Political Artifact Theory
  *   **Core View:** Some arrangements genuinely embody political relations; systems may require or strongly select for certain forms of authority.
  *   **Path:** 1B → 5B → 7A (or 8B).
  *   **Awkward Commitment:** You must accept that some "political" designs are accidents or engineering side-effects, not conspiracies. You also have to explain how we change these politics if the hardware itself is the law (do we smash the machines, or regulate the designers?).

  ### Leaf: Strong Technological Determinism
  *   **Core View:** Technology drives social change inevitably; the machine sets the pace and structure of society.
  *   **Path:** 1B → 5B → 7B (or 4A).
  *   **Awkward Commitment:** You must concede that human resistance (e.g., Luddites, privacy advocates) is ultimately futile or merely a temporary friction. This view can inadvertently absolve humans of responsibility ("The algorithm made me do it").

  ### Leaf: Substantivism (Heidegger/Postman/Ellul)
  *   **Core View:** The political question isn't about individual artifacts but about technology as an encompassing mode of revealing or a culture in itself.
  *   **Path:** 1B → 5A → 6B → 9B (or 10B).
  *   **Awkward Commitment:** You must admit there is no "outside" to escape to; you cannot critique technology using non-technological terms because your very ability to critique is shaped by it. This can lead to political paralysis or mysticism.

  ### Leaf: Critical-Constructivism (Hybrid)
  *   **Core View:** Artifacts have politics, but they are open to redesign and democratic intervention; structure matters, but agency remains.
  *   **Path:** 1A → 2B → 3B (or 9A).
  *   **Awkward Commitment:** You occupy the hardest practical position: you must believe that deep structural biases in design can be fixed through social pressure without requiring a total revolution or a return to nature. It requires high optimism about institutional reform.

  ***

  # Unoccupied Logical Spaces

  **1. "Artifacts have politics, but they are random."**
  *   **Why Unoccupied:** Incoherent. If politics implies power relations and order, "randomness" negates the definition of politics. No theory claims technology shapes society *without* a pattern or logic.

  **2. "Technology determines culture completely, but users can easily change the technology."**
  *   **Why Unoccupied:** Tension/Unattractive. This combines Determinism (tech drives culture) with Instrumentalism (users drive tech). While some try to hold this, it usually collapses into one side: either the tech is hard to change (Determinism/Winner) or it doesn't determine culture (Instrumentalism).

  **3. "The artifact is neutral, but it requires a specific hierarchy to function."**
  *   **Why Unoccupied:** Contradictory. If an artifact *requires* a hierarchy (like the nuclear plant), it is not neutral regarding power. This is the specific dividing line between Instrumentalism and Winner-style theory.
