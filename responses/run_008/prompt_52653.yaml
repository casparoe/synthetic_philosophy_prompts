      *   **Specific Questions to Address:**
          *   Does it dramatize the period-skeptic's thesis better than arguments do?
          *   Where does it resist that reading?
          *   Are there genuinely period-specific elements Hank encounters (Church, hierarchy, violence)?
          *   How to answer a student who says "the contrast is real"?
          *   What does the skeptic have to concede?
          *   Does the ending complicate the period break?
      *   **Deliverables:** A reading analysis, 2-3 discussion questions, specific scenes to reread.
      *   **Tone:** Honest, usable in seminar, acknowledging where constructivist readings flatten the text.

  2.  **Deconstruct the Text (CYKAC) through the Lens of Periodization:**
      *   *The Constructivist Argument:* Hank projects 1880s Hartford onto 6th-century Britain. The "Middle Ages" here is a foil. Twain is satirizing Romantic Medievalism (Scott). The "Modern" is specific (Gilded Age capitalism), not universal.
      *   *The Realist/Resistance Argument:* Hank *does* encounter structural realities (feudalism, divine right, lack of tech). The ending suggests modernity isn't a clean victory. Hank becomes a tyrant himself. The "soul" of Camelot is missed.
      *   *The "Period Break" Problem:* If Hank wins the battles but loses the war (and his soul), where does the "progress" lie? Is the break between 6th and 19th centuries, or is it a break *within* the 19th century (Hank vs. Twain)?

  3.  **Drafting the Reading Analysis:**
      *   *Introduction:* Acknowledge the prompt's insight. CYKAC is a meta-commentary on periodization.
      *   *Point 1: The Constructivist Victory.* Hank defines the era by what it lacks (tech, rights). This supports the "retrospective construction" theory. The "Middle Ages" is a dumpster for everything Hank hates.
      *   *Point 2: The Resistance/Nuance.* Hank's "modernity" fails. The Gatling guns kill, but the "disease" of the old order kills him. The Church *does* have power (Interdict). Hierarchy *is* rigid. This suggests material realities, not just projections.
      *   *Point 3: The Ending.* This is crucial. Hank's nostalgia for Sandy/Camelot undermines the triumph of the "Modern." It suggests periodization isn't just progress; it's loss.
      *   *Point 4: The "Real" Contrast.* Address the student pushback. Yes, sanitation and logistics differ. But the *moral valuation* is the construction.
      *   *Point 5: Twain vs. Hank.* Twain satirizes Hank too. Hank is a bigot. This adds a layer: the "Modern" narrator is unreliable.

  4.  **Developing Discussion Questions:**
      *   Need to push beyond "Is it constructed?" to "What are the consequences of that construction?"
      *   Q1: Focus on Hank's definition of "progress." Is it universal or local?
      *   Q2: Focus on the Ending. Does the tragedy invalidate the period break?
      *   Q3: Focus on the "Real" constraints. What can't Hank change?

  5.  **Selecting Scenes:**
      *   *The Eclipse (Ch. 5):* The moment of "magic" vs. "science." Pure projection of power.
      *   *The Interdict (Ch. 36-37):* Where the Church fights back. Shows structural resistance.
      *   *The Battle of the Sand Belt (Ch. 43) & The End (Ch. 44):* The victory that is a defeat. The "rotting dead."

  6.  **Refining the Argument (Self-Correction/Honesty Check):**
      *   *Critique:* Am I making the constructivist case too strong?
      *   *Correction:* Ensure I emphasize that Twain *knows* Hank is flawed. The book isn't just Hank's view; it's Twain's view of Hank's view. This creates a *double* periodization: 6th vs. 19th, AND Romantic 19th vs. Industrial 19th.
