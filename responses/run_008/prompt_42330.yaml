      *   *Cycling Context:* Was it truly Prisoner's Dilemma? If *no one* doped, would a single doper win easily? Yes. So the incentive to defect is high. But the *maintenance* of the trap relied on *omertà* (silence). Once silence broke, the reputational cost of doping spiked.
      *   *Verdict:* It's a useful distinction, but "Squishy" is basically describing a Nash Equilibrium sustained by incomplete information or social norms rather than hard payoff constraints. It holds up as a descriptive tool for *how* traps end.

