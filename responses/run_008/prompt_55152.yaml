              *   At least one on formulation disagreement (global causal networks, logical conditioning, etc.).
              *   No softballs.
          *   Format: JSON array.
          *   Fields per object: "question", "presses_on", "expected_answer", "follow_up".
          *   Constraint: No extra commentary outside the JSON.

  2.  **Deconstruct Updateless Decision Theory (UDT):**
      *   Core idea: Choose a policy mapping observations to actions that maximizes expected utility according to a prior, rather than conditioning on observations and choosing actions.
      *   Key problems/scenarios: Counterfactual Mugging, Parfit's Hitchhiker, Newcomb's Problem, Transparent Newcomb, Agent Simulates Predictor.
      *   Common criticisms:
          *   Priors: Where do they come? (Epistemic circularity).
          *   Computation/Tractability: Impossible to calculate.
          *   Dynamic Inconsistency: Seems to require committing to things you later regret.
          *   Blackmail: Vulnerable to threats based on predictable behavior.
          *   Formulation: Is it CDT+SSA? EDT+SSA? Logical Induction? TDT? UDT 1.0 vs 1.1?
          *   Logical Uncertainty: How to handle logical counterfactuals.

  3.  **Drafting Questions (Iterative Process):**

      *   *Requirement 1: Epistemic Circularity.*
          *   Draft: You need a prior to be updateless. But priors come from observations. Isn't this circular?
          *   Refinement: Make it sharper. The "pre-observation standpoint" is a fiction if the agent is already embedded.
          *   Follow-up: If he says "use a universal prior," ask how that avoids embedding issues.

      *   *Requirement 2: Practical Objection/Blackmail.*
          *   Draft: Doesn't UDT get blackmailed?
          *   Refinement: Focus on the boundary. When does it stop being rational to be updateless? Is there a case where updating wins clearly without just saying "expectation"?
          *   Follow-up: Push on the "rationally required" aspect. If it leads to exploitation, is it normative?

      *   *Requirement 3: Formulation Disagreement.*
          *   Draft: Experts disagree on UDT. Is it real?
          *   Refinement: Mention specific variants (TDT, FDT, UDT 1.1). Does the lack of consensus suggest the core concept is ill-defined?
          *   Follow-up: If he says "it's a work in progress," ask what would count as falsification or failure.

      *   *Additional Questions (Need 5-7 more):*
          *   *Logical Counterfactuals:* How do you actually compute them?
          *   *Embedded Agency:* UDT assumes a separation between agent and environment often. How does it handle being part of the world?
          *   *Value Learning:* If you lock in a policy early, how do you learn new values?
          *   *Coordination:* How does UDT handle multi-agent scenarios where others aren't UDT?
          *   *Psychological Plausibility:* Humans can't do this. Is it normative for humans or only AI?
          *   *Time Consistency:* Isn't the whole point of decision theory to guide action *now*?
          *   *The "Why Now" question:* Why prefer the prior's perspective over the current perspective?

