      *   *The Twist:* If Montaigne says "closer to nature = better," Prospero should value Caliban. Instead, he enslaves him. This suggests "Nature" is a movable signifier used for power.
      *   *Caliban's Curse:* "You taught me language, and my profit on't / Is, I know how to curse." This challenges the idea that language/culture is inherently civilizing (a key assumption in both European colonialism and perhaps Montaigne's idealization of the "speechless" or "simple" life). It weaponizes the tool of mastery.

