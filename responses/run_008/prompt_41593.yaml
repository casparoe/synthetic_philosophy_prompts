answer: |-
  This is a fantastic pairing, and your intuition about Montaigne is spot-on. The "proto-relativist" label is a historiographical shorthand that collapses his actual normative project. You are right to identify that *Of Cannibals* relies on a Stoic-inflected natural law: the Tupinambá are not *different*, they are *better*, because they adhere to a universal standard of Nature that Europe has violated. The essay is a satire of European corruption disguised as ethnography.

  The challenge with *The Tempest* is that it dramatizes the *political weaponization* of that same standard. Where Montaigne uses "Nature" to critique power, Prospero uses "Nature" to justify it.

  Here is a reading structure that treats both texts as philosophical interlocutors rather than source/derivative, addresses the strain points, and gives you a concrete syllabus.

  ### 1. The Philosophical Core: Nature as Tribunal vs. Nature as Title

  **Montaigne's Move:**
  Montaigne distinguishes between *Custom* (which varies and is morally neutral) and *Nature* (which is universal and morally normative). When he says, "each man calls barbarism whatever is not his own practice," he is making a descriptive claim about human psychology. But when he describes the cannibals as having "no kind of traffic... no knowledge of letters... no names for a magistrate," he is making a normative claim: these absences are virtues.
  *   **The Argument:** Corruption is artificial. Virtue is natural. Therefore, the "barbarians" are the true aristocrats of the human species.
  *   **The Stake:** "Nature" functions as an external tribunal before which European society is found guilty.

  **The Tempest's Counter-Move:**
  The play accepts the Nature/Artifice binary but destabilizes who gets to define "Nature."
  *   **Gonzalo (Act 2, Scene 1):** He recites the Montaignean position (the commonwealth without sovereignty). He is immediately mocked by Antonio and Sebastian not because his moral standard is wrong, but because it is *politically inert*. In the essay, Montaigne speaks from the safety of his library; on the island, Gonzalo speaks while shipwrecked. The play suggests that Montaignean naturalism is a luxury of the detached observer, not a viable political program.
  *   **Prospero:** He does not reject the Nature/Art distinction; he co-opts it. For Prospero, "Nature" is not a pre-social state of innocence (as in Montaigne); it is a hierarchical chain of being where Reason *must* rule Appetite. Caliban is "natural" not in the sense of being uncorrupted, but in the sense of being *governed by appetite*.
  *   **The Shift:** Montaigne's Nature is *pre-lapsarian* (before the Fall/Corruption). Prospero's Nature is *teleological* (ordered toward a specific end, i.e., rule). Prospero exposes that "Nature" is not a self-evident standard but a discursive field that the powerful can define to legitimate their rule.

  ### 2. The Caliban/Curse Problem: Where the Play Does Philosophy

  You are worried about hanging too much on the "curse" line (*The Tempest* 1.2.363–365). It is one couplet, but it holds the key if you contextualize it within the politics of naming and instruction.

  **The Tension:**
  Montaigne implies that if we strip away European artifice (commerce, rank, law), we find a purer humanity. He assumes "Nature" is accessible and benevolent.
  Caliban's line—"You taught me language, and my profit on't / Is, I know how to curse"—suggests that the tool of "civilization" (language/reason) does not necessarily lead to virtue or assimilation. It leads to *articulate resistance*.

  **Why this isn't over-reading:**
  If you pair this with Caliban's "be not afeard" speech (3.2), you get a complete philosophical counter-argument.
  1.  **1.2 (The Curse):** Language is a technology of power. Prospero gives it to govern Caliban; Caliban uses it to negate that governance. This breaks the Montaignean hope that "natural man" is silent/peaceful. Natural man, once given the tool of the colonizer, becomes a metaphysical threat.
  2.  **3.2 (The Isles Noises):** Caliban describes the island's sounds as rich and healing ("Sometimes a thousand twangling instruments / Will hum about mine ears"). This aligns him with Montaigne's "noble savage" (closer to the sensory truth of the world).
  3.  **The Synthesis:** The play argues that you cannot have the Montaignean "natural virtue" *and* the European "language/reason." Once you introduce the latter, the former is corrupted. Montaigne wants to critique Europe using Nature; Shakespeare shows that the moment you articulate that critique (in language), you have already entered the economy of power you are trying to escape.

  **The Strain (Honesty Check):**
  *   **On Montaigne:** You must acknowledge that Montaigne is aware of the limits of language. He is skeptical of *all* human claims to truth, including his own. However, your reading holds because Montaigne trusts the *intuition* of Nature more than Shakespeare's Prospero does.
  *   **On Caliban:** The strain here is ontological. Caliban is not a Tupinambá; he is the son of Sycorax, a witch. He is arguably supernatural/demonic. If Caliban is "degenerate by birth" (as Prospero claims), then he isn't a test case for Cultural Relativism or Natural Law at all; he's a monster.
      *   *Counter-argument for class:* The text is ambiguous. Miranda calls him "abhorred," but Stephano and Trinculo treat him as a potential commodity/king. The play *invites* us to ask if his "monstrosity" is intrinsic or imposed by Prospero's narrative. If you treat Caliban as strictly demonic, the Montaigne reading collapses. You must argue that the play *leaves it open* whether Caliban is a beast or a dispossessed native, and that ambiguity is the philosophical point.
  *   **On the Curse:** It is brief. To bolster it, link it to the **naming** scene. Prospero names him "Caliban" (anagram of Cannibal?). To name is to claim authority. To curse using that name is to weaponize the authority. This makes the linguistic turn explicit.

  ### 3. Syllabus Selections

  Do not assign the whole play or the whole essay. You want them grinding against specific passages.

  **Montaigne, "Of Cannibals" (Florio Translation is best for historical context, but modern translation for clarity is fine if you note the variance):**
  1.  **The Opening:** "I find that there is nothing barbarous or savage in this nation... except that every man gives the title of barbarism to everything not in use in his own country." (Establishes the Custom vs. Nature distinction).
  2.  **The Description of Virtue:** The section detailing their lack of commerce, religion, and hierarchy, contrasted with their bravery in war. (Establishes the Normative Standard).
  3.  **The Conclusion:** The comparison of European torture vs. Cannibal eating. "I think there is more barbarity in eating a man alive than in eating him dead." (The Universal Tribunal).

  **Shakespeare, *The Tempest*:**
  1.  **Act 1, Scene 2 (lines 330–375):** The confrontation between Prospero and Caliban. Focus on "I pitied thee," "I taught thee," and the "curse" response. This is the core philosophical rupture.
  2.  **Act 2, Scene 1 (lines 140–165):** Gonzalo's "Commonwealth" speech. Followed immediately by Antonio and Sebastian's mockery (lines 166–180). This tests the political viability of Montaigne's vision.
  3.  **Act 3, Scene 2 (lines 130–145):** Caliban's "be not afeard" speech. This recovers Caliban's capacity for "natural" appreciation, complicating Prospero's claim that he is purely bestial.
  4.  **Act 5, Scene 1 (lines 260–275):** Prospero's epilogue-adjacent speech about Caliban: "This thing of darkness I acknowledge mine." (Optional, but raises the question of responsibility/ownership).

  ### 4. Pedagogical Framing: The "Arguable" Question

  Don't ask "Is Caliban a victim?" or "Is Montaigne a relativist?" Those are settled or too vague.

  **Put this question on the board:**
  > Montaigne argues that "Nature" provides a universal standard by which European civilization is found corrupt. In *The Tempest*, Prospero also appeals to "Nature" to justify his rule over Caliban.
  >
  > **Does the play demonstrate that Montaigne's standard is impossible to maintain once political power is introduced? Or does the play suggest that Prospero is misusing a valid standard?**

  **Why this works:**
  *   It forces students to define "Nature" in both texts.
  *   It prevents them from just saying "Colonialism bad." (The question is about the *philosophical standard* used to justify or critique it).
  *   It makes Gonzalo's mockery relevant (is the standard politically impotent?).
  *   It makes Caliban's curse relevant (is language a tool of nature or artifice?).

  ### 5. One Final Caveat (The Descartes Adjacency)

  Since you work on Descartes: You might note in lecture that this debate prefigures the shift from "Nature" as a normative order (Early Modern/Stoic) to "Nature" as a mechanism (Cartesian/Scientific).
  *   Montaigne's Nature is moral.
  *   Prospero's Nature is something to be *controlled* (via his Art/Magic).
  *   Caliban is the residue that doesn't fit the mechanism.
  *   This sets the stage for the 17th-century shift where "Reason" (Descartes) eventually displaces "Nature" (Montaigne/Shakespeare) as the ground of authority. Prospero is arguably the last magician; he breaks his staff to return to Milan. He abandons the "Natural" rule of the island for the "Civil" rule of the city. That abandonment is the end of the Renaissance naturalism Montaigne represents.

  If you frame the unit as "The End of Natural Law," you give them a historical narrative that explains why Montaigne reads one way and Shakespeare reads another, without reducing one to the other.
