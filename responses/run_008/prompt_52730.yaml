prompt: |-
  Quick backstory so you know where I'm coming from: I'm 42, a driver ran a red light on me last April, and the TBI left my working memory basically cooked. My whole life now runs through a notes app, a to-do app with aggressive reminders, and a set of routines my rehab psychologist helped me build. When she mentioned the extended mind thesis I went and read up on it -- Otto's notebook, the parity principle, the whole deal -- and I'm not gonna lie, it was comforting. On that view my mind wasn't so much diminished as relocated. But I don't want to lean on a philosophy of mind position just because it's flattering, so stress-test it for me: what would actually count against it?

  Not the one-line textbook objections -- I want to know which findings, cases, and arguments should genuinely move someone who believes it, and how the defeaters rank from fatal to merely awkward. Things I'd want covered: whether the parity principle is too permissive (if constant availability and automatic endorsement are all it takes, my wife and half my house start looking like parts of my mind too, and at some point has the thesis become trivially true and stopped being interesting); whether this is even an empirical claim that results on cognitive offloading and tool use could bear on, or whether it's just a choice about where to draw a line that no experiment could ever touch; the circularity worry that we only know what counts as cognitive processing by looking at brains in the first place, so extending "cognitive" outwards begs the question; and whether anyone's proposed a mark of the cognitive that isn't either circular or just prejudice in favor of the skull. Also the meta question: which of these would a committed extended-mind person themselves concede counts against them versus wave off, and if the thesis has been qualified into unfalsifiability, is that a defect for a claim of this type or just how metaphysics of this kind works?

  There's a practical edge too: my employer is making noise about wiping personal phones under some BYOD policy, and if I actually believed the phone is part of my cognitive system that changes how hard I push back -- "you deleted part of my mind" is a different conversation than "you deleted my notes." So don't be gentle with the thesis just because it's been good for my morale. If it only survives by never risking anything, tell me that, and tell me what I should beleive instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** 42 years old, survivor of TBI (Traumatic Brain Injury) from a car accident (April last year). Suffering from working memory deficits. Relies heavily on external tools (notes, to-do apps, routines) designed with a rehab psychologist.
      *   **Intellectual Stance:** Familiar with the Extended Mind Thesis (EMT), specifically Clark & Chalmers (Otto's notebook). Finds it comforting ("mind wasn't diminished as relocated").
      *   **Goal:** Wants a rigorous stress-test of EMT. Not looking for validation/flattery, but for genuine defeaters, objections, and limitations.
      *   **Specific Concerns to Address:**
          *   Permissiveness/Triviality (Parity Principle issues: wife/house as mind?).
          *   Empirical vs. Conceptual (Is this testable or just semantic?).
          *   Circularity (Defining cognition by brains then extending it).
          *   Mark of the Cognitive (Is there a non-circular, non-skull-boundary definition?).
          *   Meta-question (What would proponents concede? Is it unfalsifiable? Is that a bug or feature?).
          *   Practical Implication (BYOD policy: Is the phone *part* of the mind legally/ethically?).
      *   **Tone:** Direct, rigorous, empathetic but not coddling ("Don't be gentle... If it only survives by never risking anything, tell me that").

  2.  **Deconstruct the Extended Mind Thesis (EMT):**
      *   *Core Claim:* Cognitive processes aren't bound by the skull/skin. If an external tool functions like an internal process, it *is* part of the cognitive process.
      *   *Key Argument:* The Parity Principle (If it walks like a duck...).
      *   *Key Criteria (Clark & Chalmers):* Constant availability, automatic endorsement, easy accessibility, past endorsement.

  3.  **Address the Specific Objections (Stress-Testing):**

      *   **Objection 1: The Triviality/Permissiveness Problem (The "Coupling-Constitution Fallacy").**
          *   *Argument:* Just because X is coupled to Y doesn't mean X constitutes Y. A guitar is coupled to a guitarist, but isn't part of the guitarist's hands.
          *   *Severity:* High. This is the biggest technical hurdle.
          *   *Refinement:* Adams & Aizawa. They argue cognition requires *non-derived content* (intrinsic meaning), which only brains have. Tools have derived content (meaning given by users).
          *   *Impact on User:* If Adams & Aizawa are right, the phone is just a tool, not part of the mind.

      *   **Objection 2: The Mark of the Cognitive (Circularity).**
          *   *Argument:* How do we define "cognitive" without looking at the brain first? If we define it functionally, EMT wins. If we define it biologically, EMT loses.
          *   *Severity:* Medium/High. It suggests EMT might be a verbal dispute, not a factual one.
          *   *Nuance:* Is it a discovery or a proposal? Clark argues it's a proposal for a better framework.

      *   **Objection 3: Empirical vs. Conceptual.**
          *   *Argument:* Can neuroscience prove or disprove this?
          *   *Severity:* Medium. If it's conceptual, experiments on "cognitive offloading" don't prove EMT, they just show we use tools.
          *   *Impact:* EMT is more metaphysical/philosophical than scientific.

      *   **Objection 4: The "Wife and House" Problem.**
          *   *Argument:* If my wife reminds me of things, is she part of my mind?
          *   *Response:* EMT proponents usually restrict it to *non-agentive* tools or require specific integration levels. But this boundary is fuzzy.
          *   *Severity:* Low/Medium. It's a slippery slope argument, but highlights the need for better criteria than just "availability."

      *   **Objection 5: Unfalsifiability.**
          *   *Argument:* If proponents keep moving the goalposts (adding criteria to exclude the wife/house), is it still science/philosophy?
          *   *Severity:* High. If it explains everything, it explains nothing.

  4.  **Address the Practical/Personal Context (The TBI & BYOD):**
      *   *Morale vs. Truth:* Acknowledge the therapeutic value but separate it from ontological truth.
      *   *The BYOD Argument:* Even if EMT is false, the *functional dependence* argument holds water legally/ethically. You don't need EMT to argue "wiping my phone disables me."
      *   *Alternative Framework:* Scaffolded Mind or Distributed Cognition. These might be more accurate without making the heavy metaphysical claim that the phone *is* the mind.

  5.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Validate the user's situation. Acknowledge the power of EMT for rehabilitation but honor the request for rigor.
      *   *Section 1: The Coupling-Constitution Fallacy (The Fatal Blow).* This is the strongest philosophical objection. Explain Adams & Aizawa's distinction between *coupling* (using a tool) and *constitution* (being part of the process). Introduce "non-derived content."
      *   *Section 2: The Mark of the Cognitive (The Circular Trap).* Discuss whether "cognitive" is defined by location (brain) or function. If function, EMT works. If location, it doesn't. This makes EMT look like a semantic stipulation.
      *   *Section 3: The Triviality/Permissiveness (The Wife/House).* Discuss the criteria (Otto's notebook vs. Inga's biological memory). Explain why social agents (wife) are usually excluded but why that line is shaky.
      *   *Section 4: Empirical vs. Metaphysical.* Clarify that neuroscience can't settle this. It's a framework choice.
      *   *Section 5: The Meta-Question (Unfalsifiability).* Admit that EMT has been qualified heavily to survive. Is this a defect? Yes, if it claims to be empirical. No, if it's a pragmatic framework.
      *   *Section 6: Practical Advice (The BYOD Policy).* This is crucial. Don't pin the legal argument on EMT. Pin it on *disability accommodation* and *functional necessity*. "Part of my mind" is rhetorically powerful but legally risky if EMT is contested. "Medical device/prosthetic" is a stronger angle.
      *   *Conclusion:* Summarize the verdict. EMT is likely false as a strict ontological claim but useful as a pragmatic framework. Suggest "Scaffolded Mind" as a more defensible alternative.

  6.  **Refining the Tone:**
      *   Ensure it's not dismissive of the TBI experience.
      *   Avoid academic jargon where possible, or explain it clearly (e.g., "non-derived content").
      *   Be direct about the weaknesses. The user asked to be stress-tested, not coddled.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific question about what proponents concede?
      *   *Correction:* Need to explicitly state that Clark himself has retreated from the strongest claims to "active externalism" or "predictive processing" models.
      *   *Check:* Did I address the "wife" objection specifically?
      *   *Correction:* Yes, under the permissiveness section.
      *   *Check:* Is the advice on the BYOD policy sound?
      *   *Correction:* Make sure to distinguish between "mind" and "prosthetic." Legally, a prosthetic argument is stronger than a metaphysical mind argument.

  8.  **Final Polish:** Organize with clear headings. Ensure the ranking of objections (Fatal vs. Awkward) is clear. (Self-correction: Ensure I don't give medical/legal advice, but philosophical strategic advice).

  9.  *(Final thought before generating)*: The user is intelligent and well-read on the topic. Don't dumb it down. Respect the intellectual engagement while maintaining empathy for the injury context.

  **(Self-Correction on "Fatal" vs "Awkward"):**
  *   *Fatal:* Coupling-Constitution Fallacy (if accepted).
  *   *Fatal:* Circularity/Verbal Dispute (if EMT is just redefining words).
  *   *Awkward:* The Wife/House problem (can be patched with stricter criteria).
  *   *Awkward:* Empirical silence (doesn't kill it, just limits its scope).

