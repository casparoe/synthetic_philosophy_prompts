  1. Define as population variance, not individual destiny. 2. Demonstrate environmental variance dependence via feeding regimes. 3. Defuse misconceptions of immutability and universal applicability. 4. Pivot to group averages and human caution. 5. Verify understanding and bound scope.

  **Order Logic:**
  The population definition must anchor the talk. If members believe heritability describes an individual bird's composition, no amount of environmental context will correct them. Once established that the number describes *variation within a specific group*, you can introduce the "Feed Uniformity" example. This example must come early, before the factions dig in. If you wait, the "Bloodline" faction will seize a high heritability estimate as proof of genetic supremacy, not realizing it merely reflects uniform loft management. Conversely, introducing it before defining population variance confuses them about what is varying.

  **Carrying Example:**
  Use "Feed Uniformity." Case A: Every fancier uses identical premium mix. Environmental variance is near zero; differences are mostly genetic. Heritability appears high. Case B: Diets range from premium to scrap. Environmental variance explodes; differences are mostly management. Heritability crashes. This single example covers both within-loft (individual variation) and across-lofts (management variation) dynamics without needing human analogies.

  **Misconceptions:**
  1. *"60% of this bird's speed is genes."* Defuse immediately after Section 1. Clarify it means 60% of the *differences between birds* in this specific group.
  2. *"High heritability means unchangeable."* Defuse after Section 2. Show that even with high heritability, better feed improves everyone's average speed.
  3. *"One number fits all contexts."* Defuse during the pivot.

  **The Pivot:**
  Explain that your club's heritability tells you nothing about why your club averages faster than the neighboring valley club. If their weather is easier, their average is higher, regardless of your heritability estimate. This leads to the human caution: within-group statistics never justify between-group conclusions. Keep it brief and apolitical to respect the secretary's warning.

  **Check & Bound:**
  Ask: "If every loft in this room suddenly adopted identical training schedules, would the heritability of race speed rise or fall?" (Correct: Rise, because environmental variance drops, making genes a larger proportion of the remaining differences). This tests if they understand the ratio of variances.
