          *   **Fact Check:** This is the critical error. Ginzburg does *not* argue Menocchio is statistically representative. That is the opposite of the microhistorical method (which often embraces the exception to reveal the rules). Ginzburg argues for Menocchio's *uniqueness* as a window into the circulation of culture, not his statistical normality. The concept of the "exceptional normal" (Levi) is about how following an exception reveals the norms of the system, not that the individual is statistically average.
          *   **Verdict:** Fundamentally Wrong. This misunderstands the core epistemological defense of microhistory.

      *   *Claim 6:* "...what holds for literate millers holds broadly for the peasantry. This is what microhistorians mean by the 'exceptional normal.'"
          *   **Fact Check:** "Exceptional normal" (Giovanni Levi) refers to an individual whose behavior highlights the constraints and options of their society, not that they are a statistical average. The student defines it as statistical representativeness.
