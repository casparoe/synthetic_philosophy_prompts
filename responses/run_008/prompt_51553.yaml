answer: |-
  This is a classic "Sorites stress test," and your intuitions are actually more consistent than you might fear. You are oscillating between two distinct modes of evaluation: **semantic abstraction** (thinking about the word "heap" in a vacuum) and **pragmatic application** (thinking about how we use "heap" in specific situations like stories, laws, or conversations).

  The principle that best captures your specific cluster of verdicts is **"Contextualism with Local Bivalence."**

  Here is the principle laid out formally, followed by how it handles your cases, the test case, and where it (honestly) breaks down.

  ### The Principle: Contextualism with Local Bivalence

  1.  **Semantic Indeterminacy:** The predicate "is a heap" has no sharp cutoff in the abstract. There is no number $n$ fixed by the meaning of the word alone such that $n$ is a heap and $n-1$ is not. (This satisfies your "No Sharp Cutoff" commitment).
  2.  **Pragmatic Determinacy:** In any specific *context of use* (a conversation, a legal trial, a narrative history), the standards for "heap" are tightened to make communication possible. Within that specific context, bivalence holds: every pile either is or isn't a heap. (This satisfies your "Hidden Removal" and "Law" intuitions).
  3.  **Context Shifting:** The "Forced March" paradox arises because answering each question subtly shifts the context. What counts as a heap at step 100 is evaluated against a different standard than at step 1. (This satisfies your "Sequence Contradiction" vs. "Conditional" asymmetry).

  ### How This Explains Your Verdicts

  **1. The Forced March & The Arbitrary Friend**
  *   **Your Verdict:** Individual "yes" answers feel fine; the friend flipping arbitrarily is wrong; but flipping in sequence feels contradictory.
  *   **The Principle:** When you answer "yes" to 10,000 grains, you set a context where the standard is "large piles." When you get down to 50 grains, if you keep saying "yes," you have silently shifted the context to "small piles."
  *   **Why the friend is wrong:** The friend flips (9,999 yes, 9,998 no) *without* a contextual reason. They are violating the **Tolerance Principle** which governs the *abstract* meaning.
  *   **Why the sequence feels contradictory:** Once you are *in* the march, you are in a *single* conversational context. In that context, standards are fixed. Saying "yes" then "no" for indistinguishable items violates the **Local Bivalence** rule of that specific conversation. You feel the contradiction because you are treating the march as one context, even though the paradox relies on it being many.

  **2. The Conditional vs. The Sequence**
  *   **Your Verdict:** Denying the conditional ("If 9,999 then 9,998") out of context is fine. Asserting "9,999 is heap" and "9,998 is not" in sequence feels worse.
  *   **The Principle:** Out of context, you are evaluating the *semantic rule* (which is tolerant), so denying the conditional is correct (because the rule isn't absolute). In the sequence, you are evaluating *assertions within a fixed context*, where sharp distinctions are pragmatically required. The "worse" feeling comes from violating a conversational norm (consistency) rather than a semantic one.

  **3. Hidden Removal vs. No Sharp Cutoff**
  *   **Your Verdict:** You swear there's no number $n$ (abstract), but intuit there was a "last night" (narrative).
  *   **The Principle:** This is the core strength of this view.
      *   **Abstractly:** There is no number $n$. (Semantic Indeterminacy).
      *   **Narratively:** A story about a pile disappearing requires a plot point. To tell the story "It was a heap, then it wasn't," the *context of the narrative* forces a resolution. The "last night" exists relative to the story being told, not relative to the grains themselves. You aren't an epistemicist in denial; you are a contextualist recognizing that stories demand precision even if the world doesn't provide it.

  **4. Knowledge vs. Truth Margin**
  *   **Your Verdict:** There's a margin for error on knowledge, not truth.
  *   **The Principle:** "Truth" here is **Local Truth** (true in this context). "Knowledge" requires knowing *which context applies*. In the borderline zone, you don't know if the current conversational standards require "heap" or "not heap." So you can't *know*, even though (in this specific context) it is determinately true or false.

  **5. Law vs. Heap**
  *   **Your Verdict:** Sharp lines in law are fine; in nature, they aren't.
  *   **The Principle:** Law is a **Fixed Context**. The statute explicitly sets the parameters ($1,000 threshold). The vagueness is legislated away. Natural language is a **Fluid Context**. You are fine with stipulation (Law) because it fixes the context by fiat. You reject it for "heap" because natural contexts shift.

  ### The Test Case: Remove 5,000, Then Add 5,000 Back

  **The Scenario:** You start with 10,000 (Heap). Someone steals 5,000 overnight. You see 5,000 (Not a Heap?). They return the 5,000 the next night. You see 10,000 again.

  **Prediction:** **It is a heap again.**

  **Reasoning:** Under Contextualism, the status of the pile depends on the *current state* evaluated against the *current context*.
  1.  **Night 1:** Context is "Original Pile." 10,000 = Heap.
  2.  **Night 2:** Context is "Diminished Pile." 5,000 = Not a Heap (presumably). The "Heap" status was lost because the object failed to meet the standard in that context.
  3.  **Night 3:** Context is "Restored Pile." 10,000 = Heap.

  Unlike Epistemicism (which might struggle with whether the *same* sharp boundary was crossed twice), Contextualism allows for **hysteresis**. Just as a room can be "clean," become "dirty," and become "clean" again without contradiction, a pile can lose and regain the status of "heap" because the status is a function of the current arrangement relative to current standards, not an immutable historical tag.

  **However,** there is a nuance: If the removal was total (0 grains), adding them back makes a *new* heap, not the *old* heap. With 5,000/10,000, the *identity* of the pile is likely preserved, so the *property* (heap) can be recovered.

  ### Where This Principle Fails (The Honest Critique)

  I am not going to sell you this as perfect. Here is where **Contextualism with Local Bivalence** will break your brain, and where you might need to adjust your intuitions.

  **1. The Universal Generalization Intuition**
  *   **Your Intuition:** "Every instance holds feels basically true to me."
  *   **The Failure:** On this view, the universal generalization ("For all $n$, if $n$ is a heap, $n-1$ is a heap") is **false**. It is not "basically true." It fails because there is no single context in which *all* instances are evaluated simultaneously.
  *   **The Hard Truth:** You need to give up the intuition that the universal generalization feels true. That feeling is a cognitive illusion caused by reading the sentence *distributively* (imagining each step in its own context) rather than *collectively* (imagining all steps in one context). If you force yourself to imagine all steps in one context, the sentence should feel false. If you can't shake the feeling that it's "basically true," this view won't work for you, and you are likely a **Supervaluationist** at heart (which would force you to abandon the "Hidden Removal/Last Night" intuition).

  **2. The Side-by-Side Case**
  *   **The Failure:** If I put 9,999 grains and 9,998 grains side-by-side in front of you *simultaneously* and ask "Is this a heap?" for each.
  *   **The Problem:** Contextualism struggles here. The context is identical for both. The standards are fixed. Yet, they look identical. If you say "Yes" to one and "No" to the other, you violate Local Bivalence. If you say "Yes" to both, you start the Sorites again.
  *   **The Fix:** You have to accept that in a side-by-side comparison, **both must receive the same verdict.** This means you must accept that at some point, a massive pile of sand (9,999) and a slightly smaller one (9,998) are *both* "not heaps" (or both "heaps") relative to that specific comparison context. This feels counterintuitive (9,999 *looks* like a heap!), but it's the cost of avoiding the contradiction.

  ### Which Verdict Should You Give Up?

  Your flatmate is half-right: you are trying to hold **Ontological Indeterminacy** (no sharp cutoff in reality) and **Narrative Determinacy** (there was a specific last night) simultaneously.

  *   **Keep:** "No sharp cutoff in the abstract meaning of 'heap'." (This preserves the natural language intuition).
  *   **Keep:** "Sharp cutoffs in fixed contexts (Law, Stories)." (This preserves the Hidden Removal intuition).
  *   **Drop:** **"The Universal Generalization feels basically true."**

  **Why?** Because that intuition is the engine of the paradox. If you accept that the universal generalization is false (because contexts shift), the paradox dissolves. The "Hidden Removal" intuition doesn't require the universal generalization to be true; it only requires that *in the context of telling the story*, a cutoff is selected.

  **Final Advice:**
  Stop trying to find the cutoff in the *grains*. Look for the cutoff in the *conversation*. The "last night" wasn't the night the grains changed metaphysically; it was the night the *story* required you to draw a line. That distinction allows you to keep your "no sharp cutoff" commitment for the world, while satisfying your "there was a last night" commitment for the narrative.
