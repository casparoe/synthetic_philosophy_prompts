  2. Someone offers you a slightly nicer fountain pen in exchange for a month of your life. Do you reject this because the month is objectively worth more than any pen, because some things simply shouldn't be traded for others, or because comparing them feels like a category error?

  3. You're agonizing between two equally appealing options with no clear winner. Is your stress about digging for a hidden fact of which is better, about creating a reason by committing to one, or just noise because there is no fact to find?

  4. If you choose the lower-paying job you love, is it because it is objectively better all things considered, because you made it better by choosing it, or because "better" doesn't apply here?

  5. Tally your responses: mostly "objective/price/hidden fact" answers point to Plain Comparabilism or Epistemicism (honesty note: this quiz cannot separate these two, as both posit a fact of the matter even if one claims it's unknowable); mostly "different kinds/shouldn't trade/objectively better all things considered" points to Raz-style incommensurability; mostly "undecidable/creating reason/made it better" points to Chang's parity; and mostly "category error/no fact/doesn't apply" points to the Vague View.
