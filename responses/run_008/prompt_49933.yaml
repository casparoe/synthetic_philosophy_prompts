  The top priority is axiomatizing incomparability because without a formal decision rule, Keynesian uncertainty remains a philosophical critique rather than an economic tool. This is strictly upstream of everything else; if incomparability cannot be modeled without collapsing into Savagean SEU or standard Imprecise Probability (IP) frameworks like Maxmin Expected Utility, the research program stalls. You must determine if a partial ordering of propositions can generate choice functions that violate completeness without violating coherence. This is technically demanding but offers the highest theoretical payoff. Recent advances in incomplete preference theory provide a starting point, but integrating them with Keynesian logical relations is novel. However, this is high risk; hence, it is paired with the second question on weight. If weight is merely redundant with IP confidence sets or second-order probabilities, it offers no new leverage. But if weight captures evidence robustness orthogonal to probability, it solves a key gap in IP models regarding how agents update under ambiguity. Distinguishing weight from probability magnitude is conceptually prior to applying it in macro models. Recent work by Joyce and others suggests weight might relate to accuracy stability, which needs economic formalization. If weight is just sample size, it's trivial; if it's logical coverage, it's profound.

  The third question on conventions is the economic payoff. It translates the formal and philosophical work into macroeconomic relevance, challenging the behavioral view that conventions are biases. This is downstream: you need the account of uncertainty (Q1 and Q2) to defend conventions as rational (Q3). It is prioritized third because it relies on the success of the first two, but it offers the clearest path to publication in economics journals. Establishing conventions as rational responses to unmeasurable uncertainty reframes financial instability not as market failure but as structural inevitability. This connects directly to your economics PhD, allowing you to model investment volatility without relying on ad hoc shock terms. It bridges the gap between the *Treatise* and the *General Theory*. If you can show that convention-following maximizes robustness under incomparability, you undermine the normative force of Bayesian rationality in macro contexts. This has policy implications for how central banks manage confidence.

  The fourth question on Ramsey is ranked last because it is primarily historical. While understanding Ramsey's critique is necessary context, settling the historical score does not advance decision theory. It is a potential dead end if treated as exegesis; many philosophers have debated whether Ramsey refuted Keynes, but little formal progress emerged. It only merits research if it reveals a category mistake in how subjective probability is applied to macroeconomic expectations. Therefore, it serves as background rather than a primary research output. The agenda moves from formal feasibility to conceptual distinctness to economic application, treating historical interpretation as supportive rather than central. This ensures you build a new theory rather than merely defending an old one. Focusing too much on Ramsey risks getting bogged down in metaphysical debates about logical relations that modern economics has already bypassed via subjectivism. Your advantage is building forward, not looking back. Furthermore, the consensus is that Ramsey won on metaphysics but Keynes won on economics; re-litigating the metaphysics yields diminishing returns. The real value lies in salvaging the economic insights from the metaphysical wreckage. Thus, Q4 is a constraint on your theory, not the theory itself.

  (4) What would change my mind
  A formal proof demonstrating that incomparable probabilities inevitably collapse into complete orderings under minimal rationality constraints would demote the first question to a historical curiosity. Conversely, a new empirical framework showing that agents consistently behave according to Keynesian weight rather than Bayesian updating would elevate the third question. If the imprecise probability literature resolves the distinction between weight and confidence sets definitively, the second question becomes redundant. Finally, if behavioral economics successfully integrates deep uncertainty into standard models without invoking Keynesian conventions, the economic relevance of this entire agenda would diminish significantly.
