      *Let's settle on this:* IDA is viable for *verification-heavy* domains (code, math, fact-checking) but unsafe for *strategy-heavy* domains (geopolitics, long-term planning) because strategy requires framing, and framing is where the gerrymandering happens.

  6.  **Writing the Essay:** (Mental outline of the flow)
      *   Intro: The Promise vs. The Mechanism.
      *   The Baseline (Settled): Lossy compression, human bottleneck.
      *   The Competence Gap: Reductionism vs. Holism.
      *   The Alignment Gap: Gerrymandering & Distillation Drift.
      *   The Verdict: The Domain Boundary.
