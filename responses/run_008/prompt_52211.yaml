      *Revised Verdict:* IDA preserves alignment only when the decomposition policy is *normatively neutral* or *transparently normative*. If the decomposition hides value judgments in the structure, IDA fails. This limits it to domains where facts and values can be cleanly separated in the tree structure.

      *Wait, let's look closer at the "Gerrymandering" point.* If the decomposer is learned, it optimizes for the loss function. If the loss function is "match the human," it might learn to ask questions the human answers *confidently* but *wrongly*, or structure the tree to lead to a high-reward outcome that violates spirit.
