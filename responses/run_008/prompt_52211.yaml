      *   **Section 4: The Verdict:** Define the boundary condition ($X$). $X$ = "Auditable Decomposition." The decomposition policy must be simple enough for humans to verify that it isn't steering.
      *   **Conclusion:** Summarize. IDA is a tool for specific domains, not a general alignment solution.

  4.  **Refining the Argument (Self-Correction during drafting):**
