prompt: |-
  I'm a science and ideas journalist working on a feature about how people choose spouses (or, these days, swipe for them) in an era of effectively endless options — dating apps promising "the best match" rather than "a good enough match" — and the piece keeps bumping into Herbert Simon's old distinction between maximizing and satisficing: the idea that a rational agent with limited time, limited information, and limited computational capacity does better by settling for the first option that clears a threshold than by searching for the optimum. The literary example I can't get out of my head is Charlotte Lucas in Pride and Prejudice. She's twenty-seven, plain, and portionless; she accepts Mr. Collins within days of Elizabeth refusing him, and she explains herself quite coolly: she's not romantic, she asks only a comfortable home. On Simon's terms she looks like the textbook satisficer — a fast, decisive threshold-satisfier who correctly prices her own market constraints — while Elizabeth, who can afford to reject a respectable establishment on the grounds that happiness in marriage is a matter of chance, looks like a maximizer whose search costs are subsidized by her father's income.

  But I suspect the neat mapping falls apart, and that's what I'd like you to work out for me. Is Charlotte really satisficing, or is she doing something the decision-science framing flattens — namely maximizing, but over a different objective function, one that prices in security, spinsterhood risk, and her sisters' prospects, so that Collins is not "good enough" but in fact optimal given her constraints? And is Simon's point not that satisficers settle for less, but that "optimal given constraints" is the only kind of optimal there is — in which case Elizabeth isn't a maximizer either, just an agent with a laxer stopping rule and a bigger budget? There's also the uncomfortable middle of the novel, where Charlotte arranges her household — the carefully chosen sitting room, the encouragement of Collins's gardening — to minimize her exposure to her own husband. Is that a picture of contented satisficing, or does Austen show us the costs that the satisficing literature, with its surveys about maximizer regret, never measures? And where does the reading break down: Elizabeth's eventual acceptance of Darcy after her priors get revised by the letter is arguably the most rational act of belief-updating in the book, which fits neither the satisficer nor the maximizer box.

  I'd like a reading that takes both the novel and the actual decision theory seriously: where satisficing illuminates Charlotte, where it distorts her, and what Austen dramatizes about choice under constraint that Simon's papers don't — say, about how a social order sets the thresholds people satisfice against, so that Charlotte's stopping rule isn't hers at all. If it helps, tell me which scenes to foreground and which to avoid (my editor wants the piece accessible to readers who know the novel only from screen adaptations), and be honest if the satisficing frame is a clever gimmick rather than a genuine lens. The piece runs long-form, so I can sustain a nuanced argument, but I need to leave the reader with something sharper than "she settled, and that's okay."
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Science and ideas journalist.
      *   **Topic:** Spouse selection in the era of dating apps (endless options, "best match" vs. "good enough") using Herbert Simon's *maximizing vs. satisficing* framework.
      *   **Core Case Study:** *Pride and Prejudice*, specifically Charlotte Lucas vs. Elizabeth Bennet.
      *   **The Problem:** The user suspects the neat mapping (Charlotte = satisficer, Elizabeth = maximizer) is too simple. They want a nuanced reading that respects both the novel and decision theory.
      *   **Key Questions:** Is Charlotte actually maximizing a different utility function? Is "optimal given constraints" the only true optimal? What are the hidden costs of satisficing (the sitting room scene)? Does Elizabeth's acceptance of Darcy fit either box? Where does the frame break down?
      *   **Goal:** A long-form feature argument that avoids clichés ("she settled, and that's okay") and offers a sharper insight about social constraints, utility functions, and the emotional cost of rational choice.
      *   **Constraints:** Accessible to readers who know the novel mainly from adaptations (avoid deep cuts, focus on key scenes). Honest assessment of whether the frame is a gimmick or a lens.

  2.  **Deconstruct the Decision Theory (Simon, Schwartz, etc.):**
      *   *Herbert Simon:* Coined "satisficing." It's not about settling for *less*, it's about finding a solution that meets a threshold given cognitive limits and search costs. It's bounded rationality.
      *   *Barry Schwartz (The Paradox of Choice):* Popularized the terms in a psychological context. Maximizers suffer more regret; satisficers are happier.
      *   *Economics/Decision Science:* Utility functions are subjective. If Charlotte values security over love, choosing Collins *is* maximizing her utility.
      *   *The Gap:* Decision theory often treats preferences as exogenous (given). Literature shows how preferences are endogenous (shaped by society, pressure, fear).

  3.  **Deconstruct the Novel (*Pride and Prejudice*):**
      *   *Charlotte Lucas:* 27, "plain," no fortune. Her constraint is severe. Her choice is Collins.
      *   *Elizabeth Bennet:* Younger, prettier, father has income (though entailed). Her constraint is looser. Her choice is Darcy (after rejection).
      *   *The "Sitting Room" Scene:* Crucial. Charlotte arranges her house to avoid her husband. This suggests the "utility" of the marriage isn't just security; it's managed misery.
      *   *Elizabeth's Arc:* She rejects Collins (can afford to). She rejects Darcy (first proposal). She accepts Darcy (after belief updating).

  4.  **Synthesize: Where the Frame Works and Where it Breaks:**
      *   *Works:* Charlotte *looks* like a satisficer. She sets a threshold (financial security, status) and stops searching when Collins meets it. Elizabeth *looks* like a maximizer (holding out for the best).
      *   *Breaks (Charlotte):* If she values security above all, Collins *is* the maximum. So she's a maximizer of security, not a satisficer of love. But Simon's point is about *search costs*. Charlotte stops searching immediately. That is satisficing behavior.
      *   *Breaks (Elizabeth):* She isn't just searching for the "best." She's searching for *respect*. Her rejection of Darcy isn't about finding someone better; it's about a constraint violation (his rudeness).
      *   *The Real Insight:* The "Threshold" isn't internal; it's external. Society sets Charlotte's threshold. Simon assumes the agent sets the aspiration level. Austen shows the *world* sets it.
      *   *The Cost:* Decision theory measures regret via surveys. Austen measures it via the *physical arrangement of furniture*. The cost of satisficing isn't just "less happiness"; it's structural alienation.

  5.  **Drafting the Argument (Iterative Process):**
      *   *Thesis:* The maximizing/satisficing binary is useful but ultimately fails because it treats preferences as private and static. Austen reveals them as public and coerced. Charlotte isn't satisficing; she's surviving. Elizabeth isn't maximizing; she's risking.
      *   *Structure:*
          1.  Intro: The dating app context + Simon's theory + The Charlotte/Elizabeth hook.
          2.  The Surface Fit: Why Charlotte looks like the perfect satisficer.
          3.  The Theoretical Glitch: Utility functions. If security = utility, she's maximizing.
          4.  The Austen Correction: Social constraints set the thresholds. It's not bounded rationality; it's bounded *agency*.
          5.  The Hidden Cost: The sitting room. Decision theory misses the *texture* of the compromise.
