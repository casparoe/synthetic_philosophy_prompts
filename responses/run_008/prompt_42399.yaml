  9.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe Charlotte is unhappy.
      *   *Correction:* Austen says she's "content." But the *reader* sees the cost. The distinction between reported satisfaction (survey) and observed reality (novel) is key.
      *   *Initial thought:* Elizabeth is a maximizer.
      *   *Correction:* No, she rejects Darcy when he's the "best" match on paper. She violates the maximizer logic. She operates on a deontological constraint (respect), not a utilitarian calculation.

