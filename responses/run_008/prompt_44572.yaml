answer: |-
  For Kant, moral duties arise only between rational agents capable of autonomous legislation. The capacity to "judge" signifies this rational autonomy. Kant sees morality as a system of laws given by reason; only those who can give themselves laws are subject to them. Since duties correlate with rights, and animals lack rationality, they possess no rights. Thus, no direct duties are owed *to* them. Pain is morally relevant only insofar as it impacts rational beings' duties or sensibilities.

  Regarding "wronging nobody," Kantian ethics evaluates the agent's will, not just external harm. "Humanity in myself" refers to your rational moral nature, not social reputation. Humanity is the capacity to set ends according to reason. Cruelty violates a duty to *yourself* by eroding the moral sensibility required to fulfill duties to humans. It damages the integrity of your will, treating your own moral capacity as a mere means.

  On private cruelty: Kant's claim isn't merely a psychological prediction but a claim about moral disposition. The act itself expresses a maxim incompatible with virtue. Even if you believe no spill-over will occur, you cannot guarantee the integrity of your own character while practicing cruelty. The damage is to the moral ground of your agency, not just future outcomes. Furthermore, self-deception is rife; one cannot be empirically "certain" their character remains untouched. The corruption lies in the willing of the act itself.

  Verdict: This exposes a genuine gap regarding the *intrinsic* moral status of animals, as their protection remains contingent on human interests. However, Kant has resources to condemn the private actor: the duty to self-perfection forbids corrupting one's own moral dispositions regardless of external consequences. The actor is wrong not because animals might suffer, but because he degrades his own humanity. Thus, while the view fails to protect animals for their own sake, it does not let the private cruel person off the hook.
