  You are trying to sell futarchy as a democratic tool (C2) while simultaneously arguing that voters are too incompetent to use the most important part of the tool (C4). This is the weak link. It is an empirical claim that undermines your normative foundation.

  If you keep C4, you are forced to drop C2 (admitting the system isn't truly democratic) and C6 (admitting you need elite management). That leaves you with a technocratic system that you claim to hate.

