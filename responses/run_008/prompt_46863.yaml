answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name], Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Triage Tiebreakers and Proposed Decision Procedures

  **1. Purpose**

  At our last meeting, we reached an impasse regarding the standard surge scenario: one ICU bed remains; two patients are clinically equivalent; one is 24, the other 76. Half the committee argues for maximizing life-years (prioritizing the 24-year-old); half argues for equal respect (random lottery).

  Dr. [Decision Theorist's Name] has proposed a novel solution: treating this as a problem of *moral uncertainty*. Under this model, members would assign credences to the competing ethical frameworks, and we would implement the policy that maximizes *expected choiceworthiness* (EC). In practice, this yields a weighted lottery—a "moral hedge" favoring the younger patient but reserving a chance for the older.

  This memo serves two purposes: (1) to provide a recommendation for the specific triage case ahead of Tuesday's drill, and (2) to evaluate whether the EC aggregation procedure should be adopted as standing committee policy.

  **2. Recommendation on the Concrete Case (24 vs. 76)**

  For the upcoming drill, I recommend we adhere to the **life-years tiebreaker (prioritizing the 24-year-old)**, consistent with our institution's existing Crisis Standards of Care (CSC) framework and state guidelines.

  **Rationale:**
  In a true surge scenario where resources are insufficient for all, the ethical goal shifts from individual advocacy to population benefit. Most established CSC frameworks (including the National Academy of Medicine's guidance) prioritize "saving the most lives" first, and "saving the most life-years" second. While the egalitarian concern regarding age discrimination is morally weighty, in a scarcity context, allocating a resource to a patient with significantly fewer expected life-years constitutes a greater loss of total benefit.

  **Addressing the Losing View:**
  I want to be clear that rejecting the lottery does not invalidate the egalitarian position. There is a genuine moral cost to this decision. By prioritizing life-years, we accept that the 76-year-old is treated as a means to maximize aggregate utility. This generates *moral residue*. We should acknowledge this explicitly in our debrief: the decision is not "clean," and the committee's discomfort is a feature of ethical seriousness, not a bug. However, institutional policy requires actionability, and the life-years principle offers a defensible, consistent standard that minimizes arbitrary variation.

  **3. Evaluation of the Aggregation Procedure (Moral Uncertainty Model)**

  Dr. [Decision Theorist's Name]'s proposal is theoretically sophisticated and correctly identifies that our deadlock stems from competing *meta-ethical* commitments, not just clinical facts. Treating ethical disagreement as uncertainty is a serious philosophical move. However, I recommend **against adopting this aggregation procedure as standing policy** at this time.

  While we should take the proposal seriously, three significant concerns suggest it is ill-suited for high-stakes clinical ethics governance.

  **A. The "No One Endorses This" Problem**
  The core objection is that maximizing expected choiceworthiness can produce a policy that *no* underlying moral theory considers right.
  *   The Utilitarian believes the 24-year-old *should* get the bed. A weighted lottery risks the "wrong" outcome (the 76-year-old winning) and thus fails to maximize utility.
  *   The Egalitarian believes a fair lottery *must* be used. A weighted lottery violates the principle of equal moral worth.
  *   **Result:** The EC output is a policy that Utilitarians think is inefficient and Egalitarians think is unjust. If every member believes the aggregate decision is sub-optimal according to their own best moral judgment, we dilute moral accountability. We risk creating a "franken-policy" that serves as a compromise of convenience rather than a principled stand.

  **B. The Calibration of Credences**
  The model requires members to state credences (e.g., "I am 0.8 credence in Utilitarianism"). In empirical contexts, credences track evidence. In moral contexts, they track conviction.
  *   **Interpersonal Comparison:** There is no shared scale for moral conviction. My "0.7" may be your "0.4." Pooling these numbers creates a false precision.
  *   **Strategic Voting:** Knowing the algorithm, members have an incentive to inflate their credences to 1.0 to maximize the weight of their view, collapsing the model back into a standard vote but with added mathematical opacity.

  **C. Institutional Legitimacy**
  Our committee advises the hospital on defensible policy. If a decision is challenged (legally or publicly), "we maximized expected choiceworthiness based on aggregated subjective credences" is a significantly harder defense than "we followed the established Crisis Standards of Care tiebreaker." The aggregation model internalizes the conflict rather than resolving it, which may protect the committee's feelings but exposes the institution to liability.

  **4. Bottom Line and Next Steps**

  We need a procedure that respects the depth of our disagreement without paralyzing our decision-making.

  1.  **For the Drill:** We will proceed with the **life-years tiebreaker**. We will document the dissent and the moral residue in the minutes.
  2.  **For Committee Policy:** We will **not adopt the EC aggregation model** as a voting mechanism.
  3.  **For Deliberation:** I invite Dr. [Decision Theorist's Name] to lead a 30-minute segment at our next retreat on *moral uncertainty as a deliberative tool*. While we should not *calculate* our decision based on credences, we can use the *language* of uncertainty to soften polarization. Acknowledging that "reasonable people assign different weights to these values" is more productive than pretending one side is objectively wrong.

  **Action Item:** Please review the state CSC guidelines regarding tiebreakers prior to Tuesday. We will vote to ratify the life-years protocol as our default for surge scenarios, with a provision to revisit if state guidance shifts toward randomization.

  Thank you for the rigor you bring to these difficult questions. The fact that we struggle with this case is evidence that we are taking the ethics seriously.

  [Your Name]
  Chair, Clinical Ethics Committee
