answer: |-
  **What Kind of Moral Reasoner Are You?**

  Read each scenario. Choose the verdict that best matches your judgment.

  **Options:**
  **A:** "This is always wrong, no matter what."
  **B:** "Normally wrong, but right to do here."
  **C:** "Not wrong in this specific situation."

  **1.** You lie to a hostile stranger to protect a friend hiding in your home.
  **2.** You steal medicine to save your child's life.
  **3.** You break a dinner promise to rush an injured stranger to the hospital.
  **4.** You break a dinner promise because you prefer to watch a movie.
  **5.** You tell a friend their haircut is ugly, knowing it will hurt their feelings.
  **6.** A surgeon cuts a patient's skin, knowing it will hurt their feelings and body.
  **7.** You keep a secret that causes someone else mild inconvenience.
  **8.** You lie to a bank to get a loan you can repay.

  **Scoring Key**

  **Exceptionless Generalist (Kantian):** Mostly **A**s. You see certain actions as forbidden regardless of consequences. If you chose **A** for 1 or 2, you hold strict duties.

  **Prima Facie Generalist (Rossian):** Mostly **B**s on override cases (1, 2, 3, 6). You see rules as real defaults that can be outweighed. You admit the action is "normally wrong" even when justified.

  **Particularist (Dancy-style):** Mostly **C**s on override cases. You believe context changes the moral nature of the act itself. Breaking a promise to save a life isn't a "wrong thing outweighed"; it's simply not wrong here.

  **Judgment-Without-Principles:** Mixed **C**s and **D** (if added), or explicit rejection of patterns. You decide case-by-case without referencing "normally." (Note: Hard to distinguish from Particularist via verdicts alone).

  **Inconsistent — Try Again:** You chose **A** ("Always wrong") on 1 or 2, but **B** or **C** on 3 or 4 without distinction. Or you chose **A** on 4 (breaking promise for movie) but **C** on 3. Contradictions suggest random answering or unexamined confusion.

  **Limits of This Instrument**

  This quiz cannot cleanly separate Rossians from Particularists based on concrete verdicts alone. Both agree you should rush the injured stranger (Q3). The only wedge is the meta-judgment embedded in Options **B** vs **C**: does the rule still exert a "pull" (Ross) or vanish (Dancy)? This relies on readers accurately introspecting their own reasoning, not just their actions. Consequently, a Rossian and a Particularist may select different options while agreeing on what to do. Furthermore, "Judgment-Without-Principles" often looks identical to Particularism in practice; the quiz distinguishes them only if the reader explicitly rejects generalizations elsewhere. Use this tool to spark conversation, not to diagnose philosophical commitment definitively.
