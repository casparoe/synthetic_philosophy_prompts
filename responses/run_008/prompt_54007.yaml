answer: |-
  **The Case: The Kiln and the Ball**

  **Stage One:** A sculptor works a homogeneous mass of wet, plastic clay into the shape of a figurine. While the material remains unfired and malleable, the sculptor grows dissatisfied with the proportions and forcefully collapses the figure back into a sphere, kneading the material to remove air pockets. The spatial arrangement required for the figurine is destroyed, yet the mass of material remains on the wheel, ready to be worked again. Intuitively, the quantity of clay persists through this deformation, retaining its chemical composition and workability, while the figurine—which depends on that specific form for its identity—ceases to exist the moment the collapse begins. The material survives the event; the artefact does not.

  **Stage Two:** The sculptor begins a new figurine from a fresh batch of wet clay and, once satisfied, places it into a kiln for bisque firing. As the temperature exceeds 900°C, the material undergoes irreversible dehydroxylation and sintering; the chemically bound water is driven off, and the particles fuse into a rigid ceramic matrix. The object is removed as a hardened, durable artwork, successfully preserving the form and function intended by the sculptor. However, the substance that entered the kiln was hydrous aluminum silicate, and the substance that emerged is a vitrified ceramic; the "wet clay" as a natural kind has been chemically annihilated to produce the "ceramic" that persists. The artefact survives the firing; the original clay does not.

  ***

  **Analysis of Views**

  **(1) The Simple Identity View**
  This view holds that the statue is strictly identical to the lump of clay.
  *   **Stage One:** It must deny that the statue ceases to exist while the clay persists, violating Leibniz's Law. It typically bites the bullet by claiming the statue *does* survive the squash (perhaps as a damaged statue) or that the clay ceases to exist (which contradicts the physical continuity).
  *   **Stage Two:** It must deny that the clay ceases to exist while the statue persists. It faces a contradiction: if $A=B$, and $A$ survives while $B$ perishes, logic is broken.
  *   **Cost:** To survive, this view must adopt perdurantism or temporal parts, arguing that the "statue-stage" and "clay-stage" are distinct temporal slices of a single spacetime worm, thereby sacrificing the intuition that the *whole* object survives or perishes.

  **(2) Constitution-Without-Identity**
  This view holds that the statue and clay are distinct objects that share the same matter and location temporarily.
  *   **Stage One:** This is the view's stronghold. The clay constitutes the statue; the squash ends the constitution relation. The clay persists, the statue perishes. No logical cost.
  *   **Stage Two:** This creates pressure. For the statue to survive while the clay perishes, they must be distinct. However, the view must explain why the *clay* perishes. If the constituter is defined by its matter, the matter persists. If it is defined by its kind ("wet clay"), the view relies on controversial essentialism about material kinds.
  *   **Cost:** It pays an ontological cost (proliferation of objects) and must defend the claim that "wet clay" has strict essential properties that firing violates, whereas the artefact does not.

  **(3) Sortalist / Relative Identity**
  This view holds that identity is incomplete without a sortal; one can only ask if $x$ is the same *F* as $y$.
  *   **Stage One:** There is no contradiction. $x$ is the same *clump* as $y$, but not the same *statue*. The question "Did the object survive?" is ill-formed without a sortal.
  *   **Stage Two:** Similarly, $x$ is the same *artwork* as $y$, but not the same *batch of clay*. The divergence in persistence conditions is linguistic/conceptual, not ontological.
  *   **Cost:** It must reject absolute identity, a cornerstone of classical logic. It also risks deflating the metaphysical problem into a semantic one, potentially failing to explain *why* the sortals dictate different persistence conditions.

  **(4) Eliminativism**
  This view denies the existence of composite artefacts like statues, acknowledging only the simple particles or the clay mass arranged statue-wise.
  *   **Stage One:** There is no statue to perish. There are only clay particles arranged figurine-wise, which become arranged sphere-wise. Nothing goes out of existence.
  *   **Stage Two:** There is no statue to survive. There are particles arranged ceramic-wise. The "clay" (as a macro-object) might be denied existence too, or treated as a mere plurality.
  *   **Cost:** It bites the bullet of denying the existence of almost everything in the studio. It solves the puzzle by eliminating the relata, incurring a massive intuitive cost regarding ordinary objects.

  ***

  **The Key Feature**

  The single feature doing the most work is **whether the firing counts as the clay's ceasing to exist or as a mere change of state.** I confirm your suspicion: the entire pressure of Stage Two rests on the essentialist claim that "wet clay" is a natural kind defined by its chemical structure (hydrous silicate), not merely by its matter or function. If firing is treated as a mere state change (analogous to water freezing into ice), then the clay survives Stage Two. If the clay survives Stage Two, and the statue survives Stage Two, the divergence vanishes, and the case collapses back into a standard coincidence scenario where both objects persist together.

  If this feature is removed (i.e., if we stipulate clay survives firing as "changed clay"), Stage Two fails to generate the reverse verdict, and the case no longer pressures the Identity view in the second direction. The strongest objection a defender of Constitution-Without-Identity could raise is that **the constituter is the *quantity of matter*, not the *kind*."** They would argue that the clay *mass* persists through the firing, merely changing properties. By defining the constituter as "wet clay" rather than "this quantity of silicate matter," the case rigs the verdict by building the cessation condition into the description of the lump itself.

  ***

  **Commitment and Ranking**

  I commit to the view that **Constitution-Without-Identity** handles the paired case best, though it is not without scars. It is the only view that accepts the existence of both relata (statue and clay) while respecting the intuitive divergence in their persistence conditions without dismantling classical logic (Sortal) or denying ordinary objects (Eliminativism).

  Regarding your second question: The reverse-direction stage is **not a genuinely new problem**; it is a relabeled version of familiar worries about **substantial change and kind essentialism**, which is distinct from artefact restoration. Restoration problems (Ship of Theseus) concern *spatial* replacement of parts while function persists. This case concerns *chemical* transformation of the whole while form persists. It is not new, but it is sharper: it isolates the conflict between artefactual essentialism (form/function) and natural kind essentialism (chemical composition).

  **Ranking of Views:**

  1.  **Constitution-Without-Identity:** Best fit. It accommodates the data (statue and clay behave differently) by positing distinct objects with distinct modal profiles. Its failure is ontological inflation, but this is cheaper than logical revision.
  2.  **Sortal/Relative Identity:** Second best. It logically dissolves the contradiction effortlessly. However, its cost (rejecting absolute identity) is metaphysically too high for a materialist ontology, and it explains *that* they differ without explaining *what* they are.
  3.  **Eliminativism:** Third. It is logically consistent but empirically implausible. It solves the metaphysical puzzle by denying the phenomenology of the studio.
  4.  **Simple Identity:** Last. It is directly contradicted by the case unless it adopts complex temporal parts machinery that essentially mimics Constitution anyway. It fails to respect the modal intuitions driving the seminar.

  Constitution wins because it takes the ceramics studio seriously: there really is a lump, and there really is a statue, and the kiln really treats them differently.
