answer: |-
  This is a sophisticated observation that cuts across game theory, law and economics, and epistemology. You have correctly identified a mechanism that is real, functional, and yet oddly invisible in standard introductory treatments because it relies on a violation of the "Common Priors Assumption" that underpins much of classical game theory.

  Here is the breakdown of the concepts nearest to your observation, why none of them fit perfectly, and a proposal for a precise term to capture this specific configuration.

  ### 1. The Nearest Existing Concepts

  **A. Speculative Trade under Heterogeneous Priors**
  In financial economics, this is the closest technical fit. The "No-Trade Theorem" (Milgrom & Stokey, 1982) states that if agents share common priors and are rational, they will not trade purely on the basis of private information (because the fact that someone is willing to trade signals information that should update your own belief). However, if agents have **heterogeneous priors** (i.e., they genuinely disagree on the probability of an event before seeing new evidence), trade *is* possible.
  *   **Fit:** High. Your scenario is exactly a trade based on heterogeneous priors regarding the court's verdict.
  *   **Miss:** Standard speculative trade literature focuses on markets. It doesn't explicitly model the "transaction cost avoidance" as the *fuel* that makes the bet positive-sum.

  **B. Ex-Ante Pareto Improvement (Subjective)**
  A standard Pareto improvement requires that at least one party is better off and no one is worse off in *objective* reality. Your scenario is a **Subjective Ex-Ante Pareto Improvement**. Relative to their *own* probability distributions, both parties increase their Expected Utility (EU).
  *   **Fit:** High. This explains why they sign the deal.
  *   **Miss:** It is not an *Ex-Post* Pareto improvement. Once the truth is revealed (or the coin lands), one side is objectively worse off than if they had known the truth beforehand. The literature often treats this as a "failure" of rationality rather than a stable category of deal-making.

  **C. The Coase Theorem (with Friction)**
  The Coase Theorem suggests that if transaction costs are zero, parties will bargain to an efficient outcome regardless of initial entitlements. In your scenario, the "efficiency" is the avoidance of litigation costs ($C$).
  *   **Fit:** Moderate. It identifies the source of the surplus (the saved $C$).
  *   **Miss:** Coasean bargaining usually assumes parties converge on the *value* of the asset. Here, they diverge on the value *because* of the probability of winning. The Coase theorem doesn't typically account for the *divergent expectations* funding the split of the surplus.

  **D. The Priest-Klein Hypothesis**
  In Law & Economics, Priest and Klein (1984) argued that cases go to trial when expectations diverge sufficiently to eliminate the "settlement range." (e.g., Plaintiff expects \$100k, Defendant expects \$0; no overlap).
  *   **Fit:** Low/Inverse. Your scenario is the **exception** to Priest-Klein. You are describing a case where expectations diverge *wildly* (both expect to win), yet they *still* settle. Standard theory says this shouldn't happen; you've identified the mechanism (cost savings) that allows it to happen anyway.

  ### 2. Why There Is No Canonical Name

  The reason this doesn't have a single famous name (like "Nash Equilibrium") is that it sits in a blind spot between disciplines:
  1.  **Game Theorists** often assume common priors to make the math tractable, ruling this scenario out by axiom.
  2.  **Law & Economics** scholars focus on the *failure* to settle (the trial), not the successful settlement based on mutual delusion.
  3.  **Philosophers** focus on the epistemic irrationality (Aumann's "Agreeing to Disagree"), often viewing the trade as a Dutch Book vulnerability rather than a functional contract.

  ### 3. Coining the Term

  Since no single term captures the *source* of the value (cost savings), the *mechanism* (divergent beliefs), and the *phenomenology* (both sides feel they won), I propose we coin a term that bridges the physics of value and the epistemology of belief.

  **The Term:** **The Doxastic Dividend**
  *(From the Greek *doxa*, meaning belief or opinion.)*

  **Definition:**
  A **Doxastic Dividend** is the surplus value captured in a settlement or contract that arises from the intersection of **positive transaction costs** and **divergent subjective probabilities**. It occurs when two parties agree to a deal that avoids a costly verification process (litigation, war, audit), where the distribution of the avoided costs is allocated based on mutually inconsistent confidence levels.

  **Precise Conditions for a Doxastic Dividend:**
  1.  **High Verification Costs ($C$):** There must be a costly "truth mechanism" (court, war) that is being bypassed.
  2.  **Divergent Priors ($P_A \neq P_B$):** Party A and Party B must hold incompatible beliefs about the outcome of the verification mechanism (specifically, $P_A + P_B > 1$ in a zero-sum dispute).
  3.  **Subjective Dominance:** The deal must offer each party a higher Subjective Expected Utility than the costly verification process, *calculated using their own priors*.
  4.  **Ex-Post Inconsistency:** It must be mathematically impossible for both parties' expectations to be realized simultaneously in objective reality.

  **Why this term works:**
  *   **"Dividend":** Acknowledges that real value is created (the saved costs), distinguishing it from a pure zero-sum bet.
  *   **"Doxastic":** Acknowledges that the *distribution* of that value relies on the state of belief, not the state of the world.
  *   **Distinction:** It separates this from a standard "Pareto Improvement" (which implies objective gain) and a "Speculative Bet" (which implies zero-sum). It is a **Positive-Sum Speculative Settlement.**

  ### 4. Addressing Your Edge Cases

  You asked where the edges are. The Doxastic Dividend framework predicts the following:

  **1. Bluffing (Signaling Games)**
  If one side is bluffing about their confidence, the Doxastic Dividend collapses into a **Signaling Game**. If the bluff is detected, the deal fails. If the bluff is believed, the bluffer captures a larger share of the dividend. This introduces the risk of "adverse selection"—the only people willing to offer this deal might be those who know they will lose in court (the "Lemon's Problem" of settlements).

  **2. Three or More Parties**
  With $N > 2$, the Doxastic Dividend becomes unstable due to **Coalition Formation**. If A, B, and C are fighting, A and B might settle to gang up on C. The "mutual confidence" requirement becomes harder to satisfy because the probability space is no longer binary. The dividend exists, but capturing it requires complex mechanism design to prevent sub-coalitions from breaking the deal.

  **3. Zero Costs of Fighting**
  If $C \to 0$, the Doxastic Dividend $\to 0$. If there are no legal fees, no time costs, and no relationship damage, there is no surplus to fund the "token payment." In a frictionless world, divergent expectations lead inevitably to trial (or war), because there is no "savings" to bribe the loser to go away. **Friction is required for this cooperation.**

  **4. War (Messy Trials)**
  In war, $C$ is massive (death, destruction). The Doxastic Dividend is theoretically enormous. However, the "verification mechanism" (battle) is stochastic and destructive. The risk is that the "token payment" cannot be enforced without the very court (or hegemon) that is absent. This explains why wars happen: the **Enforcement Deficit** outweighs the Doxastic Dividend.

  ### 5. Is it a Bug or a Feature?

  You asked whether the literature treats the inconsistent beliefs as a bug or the point.

  *   **In Finance:** It is treated as a **bug** (noise trader risk, irrationality).
  *   **In Contract Law:** It is treated as a **feature**. The law generally enforces these contracts (provided there is no fraud) because the *social value* of avoiding the trial outweighs the *epistemic error* of the parties. The legal system effectively monetizes the parties' overconfidence to clear its own docket.
  *   **In Philosophy:** It is a **Dutch Book**. If you could force them to repeat this interaction infinitely, the side with the inaccurate priors would go bankrupt. But in a one-shot dispute, the "tax" (legal fees) is high enough that even the "loser" of the bet ends up better off than if they had fought.

  ### Summary

  You have identified a robust economic category that lacks a canonical proper noun. It is a **Subjective Ex-Ante Pareto Improvement funded by Transaction Cost Avoidance under Heterogeneous Priors.**

  I recommend adopting **The Doxastic Dividend**. It precisely captures the phenomenon: a real economic gain (dividend) extracted from the gap between belief and reality (doxastic), made possible only by the friction of the alternative. It is not an illusion; it is a real surplus harvested from the cost of being wrong.

  **Final Verdict:** It is a real economic category. It is the mechanism by which civilized systems convert conflict costs into settlement surplus, leveraging human overconfidence as a resource rather than treating it solely as a failure of rationality.
