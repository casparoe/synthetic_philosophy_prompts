      *   **Target:** Step (3).
      *   **Reasoning:** Aquinas holds a moderate realist view of universals and social ontology. The community is a *unity of order*, not just a *unity of aggregation*. When individuals act according to the form of the community (law, custom, election), they participate in the public authority. They are not acting as "private persons" in that moment; they are acting as *organs* of the body politic.
