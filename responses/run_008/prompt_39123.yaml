  3.  **Evaluate the Argument against Aquinas's Thought:**
      *   *Premise (1):* Accurate representation of *ST* II-II, q. 64, a. 3. Private killing is generally illicit unless in self-defense or by public authority.
      *   *Premise (2):* Accurate representation of *De Regno* I, 6 and *ST* I-II, q. 105, a. 1 (regarding the right of the multitude to depose a tyrant if they have the right to elect).
      *   *Premise (3):* **This is the weak link.** "There is no third kind of agent in the picture, since for Aquinas the community isn't anything over and above the individuals who compose it."
          *   *Why it looks innocent:* It sounds like common sense or methodological individualism. We don't see a "giant blob" called the Community acting; we see John and Jane acting.
          *   *Why it's wrong for Aquinas:* Aquinas is an Aristotelian. For Aristotle and Aquinas, the whole (*totum*) is distinct from the mere collection of parts (*aggregatio*). The *populus* or *multitudo* when organized politically constitutes a *corpus mysticum* or a moral unity with a common good distinct from the sum of private goods. Public authority resides in the *office* or the *role* constituted by the political order, not merely in the biological individuals. When individuals act *as* the community (via due process, representation, or established custom), they act *publice*, not *privatim*. The authority transfers to the *role* they occupy, not just their private wills.
