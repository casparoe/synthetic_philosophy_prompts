answer: |-
  Your partner's argument is a sophisticated version of a methodological individualist critique, and it is a very common trap for modern readers approaching medieval texts. It looks compelling because it aligns with a modern intuition that only individual human beings are "real," while groups are just fictions we use to describe collections of individuals. However, this intuition is precisely what Aquinas (following Aristotle) rejects.

  To save Aquinas's position without sliding into mob justice, you must reject **Step (3)**.

  ### Why Step (3) Looks Innocent
  Step (3) states: *"Every act of the community is carried out by particular men... there is no third kind of agent in the picture, since for Aquinas the community isn't anything over and above the individuals who compose it."*

  This premise looks innocent because it seems to be a simple statement of physical fact. When a king is deposed, it is indeed human hands that seize him, not a disembodied spirit called "The State." It appeals to a commonsense nominalism: if you remove all the people, the community disappears, so the community must just be the people. This makes the argument feel grounded and concrete.

  ### Why Step (3) is False for Aquinas
  For Aquinas, the move from "individuals acting together" to "the community acting" is not just a change in headcount; it is a change in **form**. Aquinas operates with an Aristotelian metaphysics where a whole is greater than the sum of its parts. A pile of stones is an *aggregate* (just the stones), but a house is a *unity of order* (the stones arranged for a purpose).

  Similarly, a *multitudo* (a crowd) is distinct from a *populus* (a people). A people is constituted by a shared agreement on the common good and a shared legal order. When individuals act according to that order (e.g., through a representative assembly, a established custom, or a formal decree), they are not acting as private persons (*privati*). They are acting as organs of the body politic.

  Aquinas explicitly recognizes a "third kind of agent": the **public person** (*persona publica*). This is not a separate metaphysical entity floating above the citizens (which would be a Platonic Form or a Hegelian spirit), but it is a distinct **moral and juridical status**. When a judge sentences a criminal, or when the community deposes a tyrant, the individuals involved are exercising an authority that does not belong to them as private biological organisms, but to the *office* or *role* they temporarily inhabit.

  ### The Cost of Rejecting Step (3)
  You asked if rejecting this step forces you to accept the community as an "entity over and above its members" in a way that sounds un-Aquinas-like. The cost is not metaphysical inflation; it is **ontological precision regarding relations.**

  You do not need to believe the Community is a giant super-person. You only need to accept that **authority is a real relation** that emerges from the common good.
  1.  **It is not a "ghost":** The authority doesn't exist without the people. But it exists *in* the people differently than it exists in a single person. It exists as a power vested in the *order* of the group.
  2.  **It protects against mob justice:** By rejecting (3), you preserve the distinction in (1). A mob is an *aggregate* of private persons (Step 3 applies to them). A lawful deposition is an act of the *body politic* (Step 3 is false for them). The difference isn't just the number of people; it's whether they are acting according to the public form (law/custom) or private impulse.
  3.  **It solves the "Source" problem (Step 5):** Your partner argues the license never acquires a non-private source. But for Aquinas, the source of the license is the **Common Good**, which is an objective reality, not just the sum of private wills. When the community acts, the authority flows from the common good through the public structure, transforming the private individuals into public ministers.

  ### Conclusion
  If you accept Step (3), you are forced into your partner's dilemma: either all authority is fake (6) or all private killing is allowed if you have friends (7). By rejecting Step (3), you maintain the Thomistic view that political authority is real and relational. Private individuals cannot kill the tyrant because they lack the *public form* of authority. The community can, because when acting constitutionally, its members participate in a public authority that is distinct from their private capacity. This preserves the pastoral caution against vigilante violence while allowing for legitimate resistance.

  \answer{step 3, the reductionist premise}
