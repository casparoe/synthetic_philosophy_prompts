      *   **Problem:** The user's study partner has constructed an argument (a reductio ad absurdum) claiming Aquinas's distinction between private and public authority collapses, leading to the conclusion that either no public authority is licit (including tyrannicide) or private individuals can kill tyrants if enough agree (mob justice).
      *   **Goal:** Identify which premise or step in the partner's argument is flawed, explain why it looked innocent, explain the cost of rejecting it (specifically addressing the worry about "community as an entity over and above its members"), and maintain Aquinas's core distinction between private and public authority.
