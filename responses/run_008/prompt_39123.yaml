      *   **Cost:** The cost is accepting that political authority is a real relation/power that emerges from the common good and is vested in roles, not just in individual wills. It requires accepting Aristotelian hylomorphism applied to politics (the community has a "form").

  5.  **Drafting the Response (Iterative refinement):**
