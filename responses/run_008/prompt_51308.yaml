prompt: |-
  I write long-form science and ideas pieces — mostly climate policy until recently, now everyone wants me on the longtermism/de-extinction beat — and I'm on deadline for a feature about what we owe people who don't exist yet. In my background reading there's this pop-philosophy book that's doing big numbers right now (leaving it unnamed, I'm sure you can guess which one) which sums up Parfit's nonidentity problem roughly like this: our choices about energy and emissions don't just affect how future people's lives go, they determine who those future people even are, because any change in policy shifts the timing of conceptions and, a few decades out, which particular people exist. So someone born into a climate-damaged world can't really claim we harmed them — their life is still worth living, and the counterfactual where we behaved better wasn't a world where they existed, it was a world with entirely different people in it. Nobody can be wronged by the act that brought them into existence. And then the book says Parfit himself concluded from all this that our obligations to future generations are much weaker than enviromentalists assume.

  That last step is what I was planning to hang a chunk of my lede on — my editor loves a "philosophy says the opposite of what you think" hook — but it feels a little too convenient, you know? I did call a philosopher I use for quotes and he said something like that's not quite what the nonidentity problem is doing before he had to jump on a call, which was not helpful. And the stakes are real for me: I've got maybe two days before fact-check and I can't tell a defensible simplification from a mangling in this literature, it's dense.

  So: can you go through the book's summary piece by piece and tell me what's solid, what's a simplification a specialist would wave through, and what's just wrong or at least seriously contested? Specifically I want to know (a) whether the identity claim itself is right — that a different policy literally means different people exist, not just worse-off people; (b) whether the slide from "we didn't harm them" to "we didn't wrong them" is fair or whether those are two different claims the book is mushing together; and (c) whether the attribution is accurate — did Parfit himself take this as showing our duties to future people are weak, or is the book putting its own conclusion in his mouth? If parts of it are wrong, tell me what the careful version of the point would be, the one I can actually print for a general reader without a correction later.
