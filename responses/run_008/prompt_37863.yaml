      *   **Key Insight:** Frank isn't using a philosophical rule; he's using a *moral triage* rule disguised as philosophy. He draws the line where his own behavior becomes untenable.

  7.  **Refining the Predictions:**
      *   *Play:* He'll call it "motor calibration."
      *   *Morphine:* He'll claim it's physiological, not phenomenological. "The signal is blocked, not the feeling."
