      *   *Is the "degenerate causal model" claim too strong?* It might imply that if we just had better causal models, anthropics disappears. But the "Hard Problem" of anthropics is often about the *measure* on consciousness/observers, which causality alone doesn't fix. I need to be careful not to overpromise the causal dissolution.
