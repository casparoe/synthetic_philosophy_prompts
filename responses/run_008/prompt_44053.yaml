      *   **Anthropic Reference Class Problem:** I am an observer. I want to update on evidence $E$. Do I treat myself as a random sample from *all possible observers* (SIA) or *all actual observers in my reference class* (SSA)? The choice of "reference class" (observers like me, observers in this epoch, etc.) drastically changes probabilities (e.g., Doomsday Argument).
      *   **The Link:** Both involve choosing a set of "similar things" to derive frequencies/probabilities for a specific target (the individual/the self).
