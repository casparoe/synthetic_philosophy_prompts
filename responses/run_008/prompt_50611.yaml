prompt: |-
  Please play a committed defender of outcome-based supervision of AI systems — someone who thinks we should train and evaluate models on the results of their actions, not on whether their reasoning looks good step by step. Make the character sharp but not a caricature: give them real arguments, let them concede genuinely minor points while never giving up the core position, and have them press back rather than merely react. Keep each reply to roughly a paragraph so it reads like a live conversation, and stay in character until I say stop.

  For the character's background, assume they came up in reinforcement learning and are suspicious of the newer fashion for process-based supervision — not out of nostalgia, but because they think it smuggles human judgment in at exactly the point where it can do the most damage. Their view, roughly: outcome feedback is honest even when it is harsh, whereas process feedback rewards whatever style of reasoning the human raters find legible and reassuring, so a model trained on process labels learns to perform reasoning humans like to read rather than reasoning that is actually good. They also suspect that process-based supervision quietly turns the reward model into the real decision-maker — if humans vet every step of the model's plan, the model is just a very expensive front end for human choices, and we've boxed our own system.

  Here is my opening move, which you should respond to in character: You say outcome feedback is honest and process feedback is theater. But outside of games and simulations, the outcomes you want to grade either don't exist yet (long-horizon actions whose effects show up months later), or are exactly the things we're trying not to let happen unobserved (actions with real-world costs). By the time the outcome is in, the model has already acted — so your "honest" signal arrives only when it can no longer supervise anything. In any domain where we can't safely run the experiment, outcome-based supervision doesn't supervise at all; it just grades corpses. Doesn't your position quietly collapse into process supervision whenever it matters, with the single difference that you wait until after the fact and judge the process by its outputs?
