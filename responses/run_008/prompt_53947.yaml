      *Let's refine the "Fatal" defeater.* The most damaging evidence would be a dissociation where the *physiological* response tracks the veridical stimulus (Red, then Green) while the *report* tracks the illusion, specifically in a window where the Stalinesque view claims the illusion should already be constructed. For example, skin conductance or startle reflex linked to the "mid-flight" moment. If the body doesn't react to the mid-flight threat until *after* the report is made, the "experience" wasn't there yet.

      *Let's refine the Dennett objection.* The key is whether "Stalinesque" is a claim about *phenomenology* or *neural timing*. If it's phenomenology, Dennett wins (no fact of the matter). If it's neural timing (construction before broadcast), it's testable. I will argue the user must commit to the latter to avoid unfalsifiability.

