      *   *Break point:* If "consciousness" is distributed/fragmented (MDM), the Stalinesque label loses its bite. It requires a "moment of judgment" or "broadcast" to make sense of "before experience."
      *   *Ranking:* The commitment to a "finish line" (even a flexible one) is crucial. If that goes, Stalinesque dissolves into MDM.

  6.  **Address Question 4: The Dennett Objection (Unfalsifiability):**
      *   *The Trap:* Dennett says "Orwell vs. Stalin" is a false dichotomy because there's no "Cartesian Theater" where the movie is shown.
      *   *Defense:* One can salvage it by defining "Stalinesque" operationally: *Neural construction of the illusory content precedes the neural events necessary for verbal report.* "Orwellian": *Neural events for report rely on memory systems revising earlier sensory traces.*
      *   *Falsifiability:* It remains falsifiable if we can isolate the "construction" phase from the "report" phase. If we find that the motor plan for reporting "motion" is initiated *before* the neural signature of motion is present, Stalinesque is in trouble.
      *   *Defect or Feature?* It's a defect if it immunizes the theory from *all* data. It's a feature if it correctly identifies a category error. I need to argue that a *moderate* Stalinesque view (construction before global availability) is testable, while the *radical* Dennettian view (no fact of the matter) is not.
      *   *Risk:* The view remains at risk if we define "experience" as "global neuronal workspace ignition." Then we can measure timing.

  7.  **Synthesize and Structure:**
      *   Introduction: Acknowledge the sophistication of the query.
      *   Section 1: Empirical Defeaters (Rank: Fatal to Awkward).
      *   Section 2: Unique Predictions (Neural timing, Adaptation).
      *   Section 3: Deeper Commitments (The "Finish Line", Realism).
