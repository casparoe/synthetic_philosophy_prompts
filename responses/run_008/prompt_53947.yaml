  3.  **Address Question 1: Empirical Findings that Damage Stalinesque:**
      *   *Idea:* If the brain constructs the motion *before* awareness, early neural/motor markers should reflect the *illusion*, not the *stimulus*. If early markers reflect the *stimulus* (Red, then Green, no motion), but report reflects the *illusion*, that supports Orwellian (or at least late construction).
      *   *Specifics:*
          *   **EEG/ERP:** If early visual components (V1/V2, ~100ms) encode the discrete flashes, but later components encode motion, Stalinesque is pressured. Stalinesque needs the "construction" to happen before the neural correlate of *reportable* consciousness. If "reportable" is late, Stalinesque survives. If we define "experience" as early sensory registration, Stalinesque fails.
          *   **Motor Responses:** If a subject can press a button corresponding to "Red" before the second flash (impossible in Phi usually, but in variant paradigms), or if saccades track the discrete locations rather than the smooth path. *Correction:* In Color Phi, the dots are in the *same* position, so saccades might not help. Let's look at *apparent motion* variants where positions differ. If saccades jump (discrete) but experience is smooth, that's a dissociation.
          *   **Physiological/Emotional:** Fear conditioning. If a shock is paired with the "mid-flight" part of the illusory motion, does the body react? If the brain hasn't constructed the mid-flight yet, no reaction.
          *   **Dissociations:** Flash-lag effect vs. Color Phi. Flash-lag often implies postdiction. If Color Phi is pre-conscious construction but Flash-lag is post-conscious revision, the unified "Stalinesque" account of temporal anomalies fractures.
      *   *Ranking:*
          *   *Fatal:* Early neural activity unequivocally encoding the *veridical* discrete sequence in areas correlated with *phenomenal* experience, while report remains illusory. (Hard to define "phenomenal areas").
          *   *Awkward:* Dissociations between different temporal illusions (some look Stalinesque, some Orwellian).

  4.  **Address Question 2: Unique Predictions:**
      *   *The Problem:* If the only data is report, they are indistinguishable.
      *   *Neural Traces:* Stalinesque predicts motion-sensitive areas (MT/V5) activate *during* the ISI, *before* report. Orwellian predicts MT/V5 activation happens *after* the second flash, potentially concurrent with memory retrieval/report preparation.
      *   *Adaptation:* If the illusory motion is "real" perceptually (Stalinesque), it should cause motion aftereffects (MAE). If it's just memory (Orwellian), MAE should be weaker or absent. (Evidence exists for MAE in apparent motion, supporting Stalinesque-ish views, but is it pre-conscious?).
      *   *Indistinguishability:* I need to be honest. Without a defined "neural correlate of consciousness" (NCC), the distinction is often functional. If "consciousness" is just availability for report, and both models predict availability for report happens *after* construction/revision, they converge.
      *   *Key Distinction:* Timing of the neural signature of the *illusion* relative to the second stimulus. Stalinesque: Construction uses the delay. Orwellian: Revision happens after the experience of the second stimulus.
      *   *Confidence:* High on the difficulty of distinguishing them without an NCC.

  5.  **Address Question 3: Deeper Commitments:**
      *   *Fact of the Matter:* Stalinesque assumes there *is* a time when content becomes fixed for experience. Orwellian assumes experience happens early, memory later.
      *   *Seriality:* Stalinesque preserves a kind of seriality (Input -> Processing -> Experience).
