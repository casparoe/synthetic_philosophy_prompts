answer: |-
  You have identified a genuine and well-documented structural feature of moral history, though you are correct that there is no single, canonical noun (like "the Categorical Imperative") that labels it exclusively. Instead, the phenomenon is analyzed across three adjacent fields under slightly different descriptions.

  The closest established concepts are **System Justification Theory** (social psychology), **Boundary Work** (sociology of science/knowledge), and the **Argument from Marginal Cases** (moral philosophy). None of these is a perfect one-to-one match for your description, but together they provide the vocabulary you need.

  Here is how the existing literature maps onto your observation, how it pressures Singer's account, and how to distinguish this phenomenon from sincere moral refinement.

  ### 1. The Established Concepts

  #### A. System Justification Theory (Social Psychology)
  *   **The Concept:** Developed by John Jost and Mahzarin Banaji, this theory posits that people have an unconscious motive to defend and justify the status quo, even when it conflicts with their self-interest or moral principles.
  *   **How it fits:** It explains the *sincerity* you noted. Proponents of exclusion are not necessarily lying (which would be mere rationalization); they are engaging in **motivated cognition**. Their cognitive apparatus automatically searches for reasons to validate the existing hierarchy. When one criterion (language) fails, the system unconsciously selects a new one (civilization) that restores the justification for the status quo.
  *   **Difference from your description:** System Justification explains the *motive*, but not the specific *mechanism* of shifting criteria. It tells you *why* the goalposts move, not *that* they are moving.

  #### B. The Shifting Standards Model (Social Psychology)
  *   **The Concept:** Monica Biernat's research shows that people use different reference points (standards) when judging members of different groups. For example, a "tall woman" is judged against a female standard, not a universal one.
  *   **How it fits:** This captures the *mechanism*. When an out-group approaches the standard, the judge unconsciously switches from an **objective standard** (e.g., "can use tools") to a **subjective standard** (e.g., "has true culture").
  *   **Difference:** This is usually applied to stereotypes (competence, warmth) rather than deep moral ontology, but the structural logic is identical.

  #### C. Boundary Work (Sociology/STS)
  *   **The Concept:** Coined by Thomas Gieryn, this describes how groups (scientists, professionals, moral communities) draw, maintain, or blur lines between themselves and others to protect authority and resources.
  *   **How it fits:** This captures the *sociological function*. The shifting criterion is a form of **exclusionary boundary work**. When the boundary is breached (animals show sentience), the boundary is redrawn (but do they have autonomy?) to maintain the distinction between "moral agents/patients" and "resources."
  *   **Difference:** Boundary work can be benign (defining professional competence). Your observation is specifically about *moral* boundaries used to justify exclusion.

  #### D. The Argument from Marginal Cases (Moral Philosophy)
  *   **The Concept:** A standard argument in animal ethics (associated with Peter Singer, Tom Regan, and Jeff McMahan). It notes that if we grant rights to humans based on capacity $X$ (rationality), we must deny them to humans lacking $X$ (infants, cognitively impaired). If we grant them rights anyway, we cannot deny them to animals with capacity $X$.
  *   **How it fits:** This is the *logical tool* used to expose the phenomenon you see. When philosophers try to evade this argument by switching criteria (from rationality to "species membership" or "biological life"), they are enacting the pattern you described.
  *   **Difference:** This is the *critique* of the pattern, not the name of the pattern itself.

  ### 2. Does This Pressure Singer's Account?

  Yes. This pattern is the core of the **Sentimentalist** or **Pragmatist** critique of Singer's Rationalism.

  Singer's *The Expanding Circle* argues that moral progress is driven by **reasoning**: we start with kin preference, but reason forces us to universalize our principles. If reason were the primary engine, we would expect criteria to be *abandoned* when they lead to conclusions we find repugnant (e.g., excluding infants).

  However, the pattern you observe supports the rival view articulated by **Richard Rorty** ("Human Rights, Rationality, and Sentimentality") and **Jonathan Haidt** (*The Righteous Mind*).
  *   **Rorty's View:** Moral progress is not a matter of getting more rational; it is a matter of **sentimental education**. We expand the circle because we come to *feel* sympathy for new groups, not because we are logically forced to.
  *   **The Pressure:** If Singer were right, the shifting criteria would not happen. Reason would lock onto a consistent principle (e.g., sentience) and force inclusion. The fact that criteria *drift* to maintain exclusion suggests that **affective attachment to the status quo** (System Justification) is stronger than the drive for rational consistency. The "expansion" happens only when sentiment overrides the justification, not when reason refines the criterion.

  ### 3. Defining the Phenomenon (If No Name Fits)

  Since no single term captures the *historical shifting of moral criteria to maintain exclusion*, you can define it sharply for your paper by distinguishing it from legitimate moral refinement. Let's call it **"Defensive Criterion Drift"** for the sake of your argument (while acknowledging it falls under System Justification).

  To distinguish **Defensive Criterion Drift** from **Sincere Moral Refinement**, apply these three tests:

  #### A. The Asymmetry Test
  *   **Refinement:** The new criterion is applied universally. If "autonomy" replaces "sentience," the proponent must be willing to debate the status of infants or the cognitively impaired consistently.
  *   **Drift:** The new criterion is applied strictly to the *out-group* but waived for the *in-group*. (e.g., "Animals need autonomy to count," but "Infants count because they are human potential.")
  *   *Boundary:* If the criterion is not universalizable, it is drift.

  #### B. The Directionality Test
  *   **Refinement:** Criteria shift to better capture moral value, sometimes *increasing* the burden on the in-group. (e.g., realizing "civilization" was a bad metric might lead us to question whether *our* civilization is moral.)
  *   **Drift:** Criteria shift exclusively to **preserve the existing distribution of moral status**. The vector of change always favors the privileged.
  *   *Boundary:* If the shift never costs the in-group privilege, it is likely drift.

  #### C. The Retroactivity Test
  *   **Refinement:** The new criterion is presented as having been the "true" standard all along, and we admit we were previously mistaken about *our own* status or the status of others.
  *   **Drift:** The new criterion is introduced *only after* the out-group meets the old one.
  *   *Boundary:* Temporal correlation between the out-group's qualification and the criterion's revision is the strongest evidence of drift.

  ### 4. Handling the "Hard Case" (Sincere & Inadequate)

  You asked what to say when the criterion revision is sincere and the old criterion *was* inadequate (e.g., "Sentience is hard to measure; maybe interests are better").

  Here, you must distinguish between **Conceptual Evolution** and **Exclusionary Defense**.
  *   **Conceptual Evolution** occurs in **Reflective Equilibrium**. We adjust principles and judgments until they cohere. In evolution, the *in-group* is also subject to revision. (e.g., If we switch from "sentience" to "interests," we must ask if *we* truly have interests in a way that matters.)
  *   **Exclusionary Defense** occurs when the revision is **Immunizing**. An immunizing move makes the theory unfalsifiable. If every time a group approaches the line, the line moves, the theory is protected from empirical refutation.

  **The Philosophical Move:**
  Argue that even if the revision is sincere, if it functions systematically to maintain exclusion, it is epistemically suspect. This draws on **Feminist Standpoint Theory** (Dorothy Smith, Sandra Harding): knowledge claims made from the position of the privileged often contain blind spots that serve their interests. A criterion that *happens* to align perfectly with existing power structures, even if sincerely held, requires a higher burden of proof than one that disrupts them.

  ### Summary for Your Paper

  1.  **Name:** There is no single noun, but the phenomenon is best described as **System Justification via Boundary Work**, operationalized through **Shifting Standards**.
  2.  **Singer Critique:** This pattern supports the **Sentimentalist (Rorty/Haidt)** critique over the **Rationalist (Singer/Kant)** account. Reason tends to be the "press secretary" for moral intuitions, not the driver.
  3.  **Definition:** Define the pattern as **"Exclusionary Criterion Drift."**
  4.  **Distinction:** Distinguish it from sincere refinement using the **Asymmetry Test** (does it apply to the in-group?) and the **Directionality Test** (does it always favor the status quo?).

  This framework allows you to acknowledge the sincerity of historical actors (avoiding the "rationalization" dismissal) while still critiquing the structural function of their arguments.
