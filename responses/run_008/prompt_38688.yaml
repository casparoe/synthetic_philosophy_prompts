  2.  **Deconstruct the Argument:**
      *   This is a variation of the "Infinite Pareto" paradox or problems related to *supertasks* and infinite utilitarianism. It closely resembles arguments discussed by philosophers like Peter Vallentyne, Shelly Kagan, Christian Tarsney, and in the context of "infinite utility streams."
      *   *Premise 1 (Anonymity/Impartiality):* Standard in utilitarianism. The identity of the person shouldn't matter, only the distribution of welfare.
      *   *Premise 2 (Pareto):* Standard in almost all moral theories. If $A$ is better for everyone than $B$, $A$ is better than $B$.
