      *   *The Conflict:* Pareto requires tracking *identities* across worlds (Person $X$ in World 1 vs. Person $X$ in World 2). Anonymity requires ignoring identities and looking only at the *set* of outcomes. In finite cases, these align. In infinite cases with this specific structure, they diverge.

