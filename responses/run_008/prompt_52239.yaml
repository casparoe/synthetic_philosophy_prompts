  My friend from my epistemology reading group has very specific opinions about higher-order evidence (evidence about whether your own belief-forming processes are working, as opposed to evidence about the question itself) and I've started keeping a list of her verdicts because I want to figure out what her actual rule is. So far: if you and an equally smart, equally informed friend share all your evidence and still disagree about how to split a dinner bill with a weird tip included, she says you have to move your credence a real distance toward your friend's number, even if you've double-checked your arithmetic; if someone is visibly drunk but insists their logic puzzle solution feels crystal clear from the inside, she says they should discount that felt clarity hard; if a brain in a vat reasons perfectly coherently from the inside, she's happy to say it's still justified and even counts as knowing things; and if you're told by a source that's right about 70% of the time that you may have taken a drug that specifically impairs reasoning on exactly this kind of question, she says lower your confidence meaningfully but you don't have to suspend judgement.

  Next week we're arguing about a case I invented to test her and I want to come prepared. My case: a mathematician finishes a proof, checks it twenty times, everything tracks, its about as strong as first-order reasoning ever gets — and then a source that's right 90% of the time warns her that she may have been given a drug that impairs reasoning on precisely this kind of mathematical question, with no felt difference from the inside. The higher-order evidence is stronger than in the earlier drug case (90% vs 70%), and it's equally topic-specific, but now the first-order side is much stronger than a dinner bill.

  Predict what she'll say, and more importantly help me figure out which rule she's actually running. My two guesses: either she's a straight conciliationist who thinks your reasoning can never certify itself when higher-order evidence points against it (which would make the brain in a vat case a weird outlier she has to explain away), or she treats higher-order evidence as just one more input that gets weighed against the rest and can be swamped by strong enough first-order evidence (which would make the dinner bill case, where she still demands movement after double-checking, the odd one). Maybe there's also a third option, like a threshold rule where only sufficiently strong higher-order evidence triggers any discounting at all? And tell me what further case I should bring to actually separate these — I was toying with a self-undermining version, where the warning also says the drug impairs your reasoning about whether you've been drugged, but I genuinely can't tell if that settles the question or just breaks everything.
