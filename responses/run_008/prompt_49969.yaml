prompt: |-
  ok so this one's awkward and i need q&a prep for it. i'm the research person at a mid-size animal advocacy org, and next month im presenting to our strategy meeting a claim that cuts against our own messaging: that "eat less chicken" might be worse advice than "eat beef instead of chicken" for anyone who's going to keep eating meat regardless. my reasoning, roughly: a broiler lives maybe six weeks in pretty lousy conditions and yields a couple of meals, while one cow yields hundreds, so the animals-killed-per-meal gap is on the order of a hundredfold or more; and if the beef is grass-finished you also mostly drop out of the feed-crop problem, since plowing and harvesting fields year after year kills a lot of small animals, and pasture in all likelihood hosts and kills fewer of them than land in annual cultivation. the catch is chicken is the most feed-efficient meat, which is exactly why our climate-aligned colleagues like it — so if the beef is grain-finished, the crop-deaths part of my argument may flip and cut against me. my strongest case is grass-finished beef, but honestly i'm not sure how solid the pasture-vs-cropland premise is, and our research team will know.

  the room: two longtime staffers who are abolitionist vegans and think any "eat X instead of Y" advice just entrenches carnism — one of them has said publicly that welfare math is a distraction from the moral baseline; our comms lead, who only cares about whether the headline becomes "animal org says eat beef" (fair concern honestly); the climate-policy person we share an office with, who will absolutely bring up beef's carbon footprint per calorie and ask whether i'm seriously claiming a chicken's suffering can be weighed against a ton of CO2, and on what scale exactly; and a couple of quantitative research folks who already have a spreadsheet with feed conversion ratios in it and will run the grain-finished case at me.

  draft my prep sheet: the objections in rough order of how much damage they'd do, each phrased the way that person would actually phrase it, with a short reply i can give in under two minutes, a note on what i should concede up front versus hold, and a flag on the weakest point in my own argument that i should prepare to defend rather than hope nobody notices. also include the question im genuinely hoping doesnt come up — you can probably guess which one it is given who's in the room.
