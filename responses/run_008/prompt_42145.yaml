prompt: |-
  Hey, I'm a VFX supervisor at a mid-size studio and we're prepping a feature with a long time-reversal sequence -- think 60-plus shots where footage runs backwards, some fully CG, some practical reversed photography, some plate footage with CG elements swapped in. The director keeps asking "does this read backwards?" during dailies and nobody has a principled answer, it's all vibes and seniority. I went down a rabbit hole on the thermodynamic arrow of time and it seems like the reason reversed footage looks wrong is basically entropy: the stuff that makes a shot scream "played backwards" (smoke unfurling back into a cigarette, shattered glass leaping off the floor, a splash reassembling into a diver) is exactly the stuff where you can see entropy decreasing when you reverse. But there are also cues that have nothing to do with entropy at all -- a pendulum is basically symmetric either way, text running right to left, the sun tracking the wrong direction, someone walking backwards which reads as walking, not reversal. I want a procedure my team can actually run on each shot in about ten minutes at dailies: the questions to ask in order about what's visible in frame, what counts as a strong enough backwards cue, when a shot is genuinely ambiguous so we should lean on sound design or context instead, and where the physics just can't settle it and it goes to the director as a taste call. It should be honest that the underlying laws are time-symmetric and the asymmetry comes from the initial conditions, so really the procedure is about spotting which visible processes are entropy-carriers and which aren't -- but my team are artists, not physicists, so write it so a compositor can follow it without knowing what coarse-graining means. Then run it on three shots: (a) a slow beach shot where a wave recedes leaving foam patterns in the sand, (b) a cafe scene of someone stirring cream into coffee, reversed, played for eeriness, and (c) a fully CG car crash played in reverse where the director insists it should feel "wrong but hypnotic" rather than obviously backwards. Make sure you include the case where the procedure gives an answer we won't like -- I suspect the coffee one is it, since reversed diffusion is so blatant it might tip from eerie into slapstick, but tell me honestly. And tell me what the procedure can't do, like shots that are mostly rigid-body motion or just people talking. One last thing: no formatting in the answer, no bullet points or headings or bold or tables, just continuous prose like an email -- we print these out and read them on set. Thanks!
