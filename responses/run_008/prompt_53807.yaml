      *   **Dan's Counter (The "Cancellation" Argument):** Unknowable effects cancel out (symmetric ignorance). Known effects (nets save lives now) break the tie.
          *   *Philosophy:* Principle of Indifference, Expected Value under Uncertainty.
      *   **Priya's Counter (The "Skew" Objection):** Noise isn't symmetric. Systemic risks (local economy damage). Treating ignorance as knowledge is arrogant.
          *   *Philosophy:* Knightian Uncertainty, Systemic Risk, Critique of Quantification.
      *   **Dan's Final (The "Paralysis" Objection):** If you took this seriously, you couldn't act (eat bread, cross road). You only use it to avoid moral duty.
