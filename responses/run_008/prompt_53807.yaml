  3.  **Evaluate Each Move (Drafting the Analysis):**

      *   *Dan's Opening:* Strong on immediate impact. Weak on ignoring opportunity cost of education (maybe a student *does* cure malaria). But generally, saving a life > better magnification. *Verdict:* Dan has the stronger intuitive case here.
