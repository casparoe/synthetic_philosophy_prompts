  i'm a philosophy phd student (decision theory, mostly) sitting in on a seminar on cause prioritization with a bunch of econ folks, and one of them won't drop this framing: the whole importance/tractability/neglectedness thing is just value investing wearing a halo. importance is the market cap — how much value is there to capture at all. tractability is the quality of the management team — can anyone actually extract it. neglectedness is the low P/E ratio: the cause is cheap precisely because nobody's looking. and the conclusion he keeps drawing is that funders should behave like contrarian investors — whatever's fashionable is already priced in, expected returns collapse as money floods in, so the real alpha is in unsexy causes nobody wants to touch, and if a cause is crowded you should basically short it and move on.

  i get why the analogy is seductive but something about it bugs me and i can't quite articulate what. can you audit it properly? in this order please:

  1. **The mapping** — the correspondence table: what plays the role of the price, the investor, the profit that gets captured, the competition, the arbitrage. (~200 words)
  2. **Where it breaks** — where the analogy stops doing work. some things i suspect matter: there are no actual prices, there's no clean feedback signal telling you whether a grant "paid off," neglectedness might mean "priced correctly as worthless" rather than mispriced, and the pool of funders isn't the same as the pool of profit-seekers. (~450 words)
  3. **What it smuggles in** — what features of financial markets does the framing quietly import that cause-land lacks — shorting, transferable dollar-like value, the assumption that returns to a cause are a fixed pie being competed for? (~250 words)
  4. **Does the conclusion survive** — was "fund the neglected stuff" being carried by the analogy the whole time, or does it stand on its own once you strip the investing story away? (~200 words)

  dont be diplomatic on the last one, i want an actual verdict. and feel free to say where you think a better analogy would come from if the investor one is beyond saving.
