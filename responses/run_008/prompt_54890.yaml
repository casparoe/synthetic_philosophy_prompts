  The analogy fractures primarily on epistemic and mechanistic grounds. First, **there are no prices**. In finance, prices aggregate information via trades. In philanthropy, there is no ticker tape for "goodness." Without market clearing prices, there is no mechanism to correct misvaluations automatically. Neglectedness might signal a bargain, but it equally signals a **value trap**: the cause is ignored because it is actually intractable or low-importance, not because it is mispriced. The econ framing assumes neglect implies error; in cause land, neglect often implies rational avoidance.

