answer: |-
  1. "The mechanism, in plain English"

  Imagine you have two drives. One is short-term, like hunger or fear. The other is long-term, like the desire to help your community. Animals usually act on the strongest urge in the moment. But humans have strong memories. If you let hunger win over helping your family, the hunger disappears once you eat. The desire to help your family, however, stays with you. Because you remember ignoring it, you feel a lingering pain or regret. Darwin thinks this specific feeling—regret over violating a lasting social urge—is what we call conscience. It's not a divine voice; it's the emotional echo of a social instinct that lost a battle against a temporary impulse but refuses to fade away. This dissatisfaction forces you to prioritize the social instinct next time, creating a feedback loop that feels like a moral command.

  2. "Whose ought is it"

  The text strongly supports the internal view. Darwin isn't claiming fratricide is objectively good; he's demonstrating that the *mechanism* of conscience is content-neutral. If our instincts were rewired like bees', the psychological feeling of "ought" would attach to killing brothers just as strongly as it currently attaches to saving them. The phrase "sacred duty" is ironic, highlighting how deeply felt subjective commands can be objectively horrific. The "inward monitor" belongs to the hypothetical bee-human, not Darwin. He is isolating the *structure* of moral feeling from its *content*. When he says he will recur to these terms, he means he will analyze how that feeling arises, not validate the specific action. The bee example is a thought experiment showing that "duty" is simply the label we give to whichever social instinct dominates our psychology. Darwin's point is that the *sense* of obligation is real psychologically, even if the *object* of that obligation is contingent on evolutionary history. He is describing the genesis of the feeling, not prescribing the action. This distinction is crucial: he is naturalizing the *authority* of conscience without necessarily naturalizing every specific *judgment* it produces.

  3. "Genealogy or deflation"

  Darwin is attempting a genealogy that avoids full deflation, though he teeters on the edge. He wants to show morality is natural without making it arbitrary. If he merely explained it away, calling it the "most noble attribute" would be incoherent. Instead, he argues that while the *root* is instinctual, the *structure* is refined by reason and sympathy. The expansion to all sentient beings isn't just blind instinct; it's instinct guided by intellect. This suggests he believes the *process* of moral development has directionality, not just randomness. Signs distinguishing the readings include his insistence that the moral sense is "highest" and his reliance on public approval and habit to solidify instincts. He isn't saying "morality is an illusion"; he's saying "morality is a biological function that became sophisticated." However, the deflationary risk remains because if the root is just survival instinct, the "nobility" seems like a human projection. He tries to have it both ways: the feeling is natural, but the outcome is genuinely progressive. The chapter is a struggle to naturalize value without eliminating it. He wants to preserve the *authority* of morality while changing its *source*. The key sign is his treatment of reason: reason doesn't create morality, but it extends the social instinct beyond its original tribal limits, suggesting the "ought" gains validity through rational consistency, not just instinctual strength.

  4. "The bill"

  The charitable reading costs Darwin objective grounding. If "ought" is just persistent instinct, his praise of morality as "noble" becomes an expression of his own instincts, not a universal truth. He cannot explain why expanding the circle is *better*, only that it is what our specific evolution produced. The "expanding circle" relies on reason, but if reason is just a tool for instinctual satisfaction, why should it override tribal selfishness? Darwin must assume progress is real, but his mechanism only explains change, not improvement. He is left claiming his morality is superior without a metric outside of evolutionary success. Ultimately, he smuggles in a normative standard he claims to derive naturally. The "nobility" of the moral sense rests on the assumption that social cohesion is inherently good, a premise his naturalism cannot prove.
