answer: |-
  Your intuition is excellent. The host of that podcast got the "vibe" of the concepts but botched the technical substance, specifically on the two most important results in the literature (the No-Trade Theorem and the Email Game). In fact, on the Email Game, they stated the exact opposite of the actual theorem.

  Here is a claim-by-claim breakdown of what a game theorist would accept, what is a simplification, and what is demonstrably backwards.

  ### Claim 1: "Common knowledge just means everyone knows it. The 'infinite nesting' is a technicality... once information is public, the infinite nesting comes along for free."

  *   **Verdict:** **Backwards.**
  *   **The Theory:** This is the most fundamental error. There is a massive distinction between **Mutual Knowledge** (everyone knows $X$) and **Common Knowledge** (everyone knows $X$, everyone knows that everyone knows $X$, ad infinitum).
  *   **Why it matters:** Public announcements do *not* automatically generate common knowledge if there is any uncertainty about the channel. The classic example is the **Muddy Children Puzzle**. If a father says "At least one of you has mud on your face," that is public. But the children don't act until he asks the question repeatedly. The infinite nesting isn't a logical bolt-on; it is the *engine* that drives coordination. Without the infinite regress, agents cannot rule out the possibility that *you* don't know that *I* know.
  *   **Correction:** Common knowledge is a much higher bar than "everyone knows." It is not free; it requires a public event with no uncertainty about its reception.

  ### Claim 2: "Rational traders... can never agree to trade at all."

  *   **Verdict:** **Overstated / Simplification.**
  *   **The Theory:** This refers to the **Milgrom-Stokey No-Trade Theorem (1982)**. The host is describing the *speculative* no-trade result correctly in spirit, but too broadly in scope.
  *   **Why it matters:** The theorem states that rational agents with **common priors** cannot engage in **speculative trade** based purely on asymmetric information. If I offer to sell you a stock, you infer I think it's overvalued. If you accept, I infer you think it's undervalued. We update beliefs until the trade looks unprofitable.
  *   **Correction:** This does *not* mean traders can "never trade at all." It means they can't trade purely to bet on information differences. They **can** still trade for:
      1.  **Liquidity needs:** I need cash now; you have cash.
      2.  **Risk aversion:** I want to hedge; you want to take risk.
      3.  **Different Priors:** The theorem assumes a "Common Prior." If we genuinely start with different worldviews (which the theorem forbids but reality allows), trade is possible.
      *   *Your intuition was right:* "Never trade at all" is false. "Never trade purely on informational advantage" is the accurate claim.

  ### Claim 3: "Rubinstein's email game shows this is robust: even if you only have *almost* common knowledge, you get almost the same outcomes."

  *   **Verdict:** **Backwards (The Critical Error).**
  *   **The Theory:** Ariel Rubinstein's 1989 "Email Game" is famous precisely because it proves the **opposite** of what the host said.
  *   **Why it matters:** In the game, two players need to coordinate an attack. They email each other to confirm receipt. If the emails go back and forth 1,000 times, they have "almost" common knowledge (Level 1,000 knowledge).
  *   **The Result:** Rubinstein proved there is a **discontinuity**.
      *   If knowledge is Common (Infinite): They coordinate and attack.
      *   If knowledge is "Almost" Common (Finite, even if $k=1,000,000$): The unique equilibrium is often **not to attack**.
  *   **Correction:** "Almost common knowledge" does **not** yield "almost the same outcomes." It yields coordination failure. The distinction is not robust; it is fragile. This is why the host's conclusion falls apart.

  ### Claim 4: "The distinction between common and mutual knowledge is mostly academic."

  *   **Verdict:** **Wrong.**
  *   **The Theory:** Because of the Rubinstein discontinuity mentioned above, the distinction is practically vital.
  *   **Why it matters:** This explains real-world phenomena like **currency attacks, bank runs, and political revolutions**.
      *   *Example:* In a dictatorship, everyone might mutually know the regime is corrupt (Mutual Knowledge). But unless it becomes Common Knowledge (e.g., via a massive, undeniable public protest where everyone sees everyone else protesting), no one will revolt. Everyone fears they are the only one who knows the others are ready.
      *   If the host were right (that "almost" is good enough), revolutions would happen much more easily. The fact that they don't proves the distinction is non-academic.

  ---

  ### Does the "Mostly Academic" Conclusion Survive?

  **No.** Once you fix the errors, the conclusion collapses.

  The host tried to argue that because the math is hard (infinite nesting), we can ignore it in the real world because "public info is good enough." Game theory says: **Public info is not good enough.**

  1.  **On Trading:** The No-Trade theorem is a powerful constraint on *speculative* markets (explaining why volume is often lower than naive models predict), but it relies heavily on the Common Prior assumption. It's not "academic," but it's not a total ban on trade either.
  2.  **On Coordination:** The Rubinstein Email Game shows that the gap between "Mutual" and "Common" knowledge is a cliff, not a slope. You can have 99.9% certainty that the other guy knows, but if it isn't Common Knowledge, coordination can still fail completely.

  ### Summary for your mental model

  *   **Host:** "Common knowledge is just everyone knowing. Infinite nesting is pedantry. Almost common knowledge works almost as well."
  *   **Game Theorist:** "Common knowledge is an infinite recursion that is hard to achieve. Mutual knowledge (everyone knows) is common, but useless for coordination. Almost common knowledge (99% sure you know I know) creates a discontinuity where coordination fails completely. This is why bank runs and revolutions are rare and sudden."

  The host confused **continuity of information** (sending 1,000 emails feels like infinity) with **continuity of equilibrium** (the strategic outcome). Rubinstein's whole point was that strategic outcomes are *not* continuous in that way. Your skepticism was well-founded.
