answer: |-
  Sacrifice the requirement for ordinal rankings and implement Weighted Score Voting (0–5 scale) to resolve the impossibility trilemma while stabilizing against candidate withdrawals.

  ### Desiderata Specification

  | Requirement | Status | Concrete Case / Consideration |
  | :--- | :--- | :--- |
  | **Removal Stability (IIA)** | **Non-Negotiable** | Last year, removing a cancelled act changed the winner; re-voting is logistically impossible once ballots are in. |
  | **Resistance to Burying** | **Non-Negotiable** | A board member admitted to ranking a rival last to manipulate the count; the system must not reward dishonest intensity. |
  | **Weighted Non-Dictatorship** | **Non-Negotiable** | Bylaws mandate donor influence, but no single bloc (donors, crew, board) can dictate the outcome alone. |
  | **Ordinal Ballots** | **Imported Prejudice** | The assumption that voters *must* submit ranked lists drives the mathematical impossibility; cardinal scores are superior here. |
  | **Condorcet Consistency** | **Imported Prejudice** | While fair in theory, ensuring a candidate who beats all others wins is incompatible with Removal Stability in ranked systems. |
  | **Full Social Ranking** | **Imported Prejudice** | We only need a winning lineup (subset), not a transitive ranking of every loss; demanding a full order invites Arrow's paradox. |

  ### The Impossibility Trade-Off

  The single requirement that does the most exclusionary work against standard methods (Plurality, IRV, Borda, Condorcet) is **Removal Stability (Independence of Irrelevant Alternatives)**. Almost every ranked-choice method fails this; if a losing candidate drops out, the relative rankings of the remaining candidates shift in ways that can flip the winner, exactly as happened to your committee.

  The jointly unsatisfiable subset for your situation is: **Ordinal Ballots + Removal Stability (IIA) + Strategy Resistance + Non-Dictatorship**.

  *   **Arrow's Impossibility Theorem** proves that no ordinal system can satisfy Non-Dictatorship, Pareto Efficiency, and IIA simultaneously.
  *   **Gibbard-Satterthwaite** proves that no ordinal system (with 3+ outcomes) is strategy-proof unless it is dictatorial.

  You cannot keep Ordinal Ballots and expect Removal Stability without inviting the strategic burying you experienced last year. Since Removal Stability is practically non-negotiable (you cannot re-vote when acts cancel) and Strategy Resistance is culturally non-negotiable (trust is broken), you must discard **Ordinal Ballots**.

  ### Why This Dodges the Theorem
  Arrow's theorem applies strictly to ordinal preferences (rankings). By switching to **Cardinal Utilities (Score Voting)**, you exit the domain of the theorem. In Score Voting:
  1.  **Removal Stability:** If Act A has 120 points and Act B has 115, removing Act C does not change A or B's scores. The winner remains stable.
  2.  **Strategy:** While voters may exaggerate (max/min scores), they gain no advantage from "burying" a rival below their true feeling to help a favorite, as they can score both independently. This neutralizes the specific tactical voting that corrupted your last process.
  3.  **Donor Bloc:** Assign weighted multipliers to donor ballots (e.g., 1.5x) but cap the total bloc weight below 50% to satisfy bylaws without creating a dictator.

  Given your small electorate (30 voters) and low candidate count (~6), the cognitive load of scoring is negligible, and the mathematical stability outweighs the theoretical purity of ranked choice.
