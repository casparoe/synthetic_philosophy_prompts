prompt: |-
  I manage the sensory panel at a mid-size specialty coffee roastery — eight trained cuppers, weekly calibration cuppings, and ad-hoc panels whenever a supplier changes, a customer complains, or we sign off on a blend reformulation. Increasingly I realize my core job is a philosophical problem wearing an apron. When a panelist who has scored our flagship blend's body as a 7 for two years suddenly scores it a 5, I have to decide whether the coffee changed or the taster did — and when she insists, from the inside, that she can tell the difference between the coffee tasting different and her merely judging it differently, I have no way to check that claim, only her word. This is, I gather, exactly the bind Dennett stages in Quining Qualia with his coffee drinker who moves from cream and sugar to black, and his wine expert whose once-loved vintage now strikes him as cloying: the taster's introspective report seems unable, by itself, to settle whether the change is in the object, the percept, or the reaction to an unchanged percept — and the deeper suggestion is that the very idea of a determinate answer may rest on treating qualia as more well-defined posits than they are.

  Please turn that cluster of ideas into a decision procedure my lab can actually run, written so a shift lead with no philosophy background can follow it. I need: an ordered list of questions to ask about any reported difference (whose report, over what interval, against what reference, with what blind controls, corroborated by whom), what counts as a sufficient answer at each step, and the specific outputs — accept as a product change, treat as panelist drift and recalibrate, split the panel and retrain, or declare the difference undecidable from within and say what external evidence would settle it. Mark clearly the points where the procedure cannot eliminate a judgment call, and say so plainly rather than disguising it as measurement. Then run the procedure on three cases: (1) our shelf-life study, where the same six panelists scored the same lot at month zero and month eight, and the staleness scores rose for three of them but not the rest; (2) our most senior cupper — the one whose palate we treat as the reference standard — returns from a national competition and starts scoring our flagship as thin, while the rest of the panel scores it unchanged; and (3) the head roaster wants to approve a new lot from a new farm that he swears tastes identical to the lot it replaces, and two of our newest panelists, hired last month, score it as brighter. One of these cases should produce an answer I won't like — probably the one about our senior cupper or about what our calibration history is worth — and I want you to give that answer anyway. Finish by stating honestly what the procedure cannot do: which distinctions it renders genuinely undecidable, where a cupper's from-the-inside confidence will simply have to be overruled or deferred to as a matter of policy rather than knowledge, and where the philosophical point that the object/subject split may be partly a posit shows up as a permanent hole in the flowchart rather than a step in it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Manager of a sensory panel at a specialty coffee roastery.
      *   **Problem:** Distinguishing between actual product changes, panelist drift (calibration issues), and subjective qualitative shifts (qualia changes) when scores diverge.
      *   **Philosophical Context:** References Daniel Dennett's "Quining Qualia" (the idea that introspective reports about subjective experience are unreliable for determining objective changes vs. subjective shifts).
      *   **Task:** Create a practical decision procedure (flowchart/list) for a shift lead (no philosophy background) to handle reported differences.
      *   **Requirements:**
          *   Ordered list of questions (Who, When, Reference, Controls, Corroboration).
          *   Sufficient answers for each step.
          *   Specific outputs (Accept change, Recalibrate, Split/Retrain, Undecidable/External Evidence).
          *   Mark judgment calls plainly (no disguising them as measurement).
          *   Run the procedure on three specific cases (Shelf-life, Senior Cupper Drift, New Lot/New Panelists).
          *   One case must yield an uncomfortable answer (likely regarding the senior cupper or calibration history).
          *   Final statement on limitations (undecidable distinctions, policy vs. knowledge, the "hole" in the flowchart).

  2.  **Deconstruct the Philosophical Problem into Operational Steps:**
      *   *Dennett's Point:* We can't look inside someone's head to see if the "qualia" changed or if their judgment of the qualia changed. We only have behavior (scores/words).
      *   *Operational Translation:* We must treat the "taster" as an instrument that might need recalibration, and the "coffee" as an object that might have changed. We need controls to isolate variables.
      *   *The "Hole":* There is no metaphysical truth accessible here. Only consensus and utility. The procedure must acknowledge when it hits a wall of subjectivity.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* Make it actionable. Use plain language.
      *   *Structure:* Step-by-step interrogation of the data/event.
      *   *Step 1: Isolation.* Is it one person or many? (Individual vs. Systemic).
      *   *Step 2: Controls.* Was it blind? Was there a reference?
      *   *Step 3: History.* Has this person drifted before?
      *   *Step 4: Corroboration.* Can others detect the specific attribute?
      *   *Step 5: The "Undecidable" Clause.* When data conflicts irreconcilably.
      *   *Judgment Call Markers:* Need to explicitly label where human discretion overrides data.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Shelf-life):* 3/6 panelists detect staleness.
          *   *Analysis:* Split panel. Is it the coffee or the 3 people? Need external check (chemical or fresh blind).
          *   *Outcome:* Likely "Undecidable/Internal" -> Requires External Evidence.
      *   *Case 2 (Senior Cupper):* Senior says "thin," others say "same."
          *   *Analysis:* This is the uncomfortable one. If we treat the panel as the democratic standard, the Senior is drifting. If we treat the Senior as the Gold Standard, the panel is blind.
          *   *Constraint:* The prompt asks for an answer I won't like. Usually, managers rely on the Senior. But Dennett's logic suggests the Senior's introspection is no more privileged than the group's.
          *   *Decision:* Treat as Panelist Drift (Senior). This undermines the "Golden Palate" myth.
      *   *Case 3 (New Lot/New Panelists):* Roaster says "same," Newbies say "brighter."
          *   *Analysis:* Roaster has bias (wants approval). Newbies lack calibration history.
          *   *Outcome:* Split and Retrain. Don't approve yet.

  5.  **Refining the "Uncomfortable Answer":**
      *   The prompt specifically hints: "probably the one about our senior cupper or about what our calibration history is worth."
      *   *Choice:* I will rule against the Senior Cupper. In a Dennettian framework, no introspective report is privileged. If the consensus of the calibrated instrument (the panel) disagrees with the single instrument (the Senior), the single instrument is the outlier. This hurts the ego of the program but is philosophically consistent.

  6.  **Drafting the Limitations Section:**
      *   Must be honest.
      *   Acknowledge that "Qualia" cannot be measured.
      *   Acknowledge that "Policy" replaces "Truth" at the end of the line.
      *   Acknowledge the "Hole": The distinction between *sensing differently* and *judging differently* is operationally invisible.

  7.  **Review and Refine (Self-Correction during drafting):**
      *   *Tone Check:* Is it too academic? Need to ensure the "Shift Lead" can read it. Use bolding, clear headers, and "If/Then" logic.
      *   *Philosophy Check:* Did I capture Dennett? Yes, by refusing to grant authority to introspection alone.
      *   *Constraint Check:* Did I mark the judgment calls? Yes, need to add "[JUDGMENT CALL]" tags.
      *   *Constraint Check:* Did I run all three cases? Yes.
      *   *Constraint Check:* Is the uncomfortable answer included? Yes (Case 2).

  8.  **Final Polish:**
      *   Ensure the distinction between "Product Change" and "Panel Drift" is clear.
      *   Make sure the "Undecidable" output leads to a specific action (e.g., "Hold Batch").
      *   Strengthen the concluding philosophical honesty.

  **(Self-Correction on Case 2):** If I rule against the senior cupper, I need to make sure the procedure *justifies* it based on the rules established in Step 1-4, not just arbitrary fiat. The rule should be "Majority Calibrated Consensus overrides Individual Outlier unless External Evidence exists."

  **(Self-Correction on Limitations):** Make sure to explicitly mention that the procedure *cannot* solve the qualia problem, it only manages the risk of it.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # SENSORY DISCREPANCY PROTOCOL (SDP-01)
  **Effective Date:** Immediate  
  **Authorized By:** Sensory Manager  
  **Intended User:** Shift Leads / Head Cupper  
  **Purpose:** To determine whether a score deviation indicates a change in the coffee, a change in the panelist, or an undecidable subjective shift.

  ---

  ## PART 1: THE DECISION PROCEDURE

  When a panelist (or group) reports a score or attribute deviation from the established baseline (e.g., Flagship Blend Body < 6.0, or Shelf-Life Staleness > 3.0), execute the following steps in order. Do not skip steps.

  ### STEP 1: ISOLATION & CORROBORATION
  **Question:** Is the deviation reported by a single panelist or multiple panelists?
  *   **Single Panelist:** Proceed to Step 2.
  *   **Multiple Panelists (>50% of panel):** Proceed to Step 3.
  *   **Multiple Panelists (<50% of panel):** Proceed to Step 2 (Treat the minority as the "Single" group for investigation).

  ### STEP 2: THE INDIVIDUAL DRIFT CHECK
  **Question:** Has this panelist shown deviation on *control samples* (known references) in the last 4 weeks?
  *   **Yes (They failed controls):** **OUTPUT: RECALIBRATE.** Remove panelist from production scoring until they pass 3 consecutive calibration sets. Treat their report on the coffee as invalid.
  *   **No (Controls are green):** Proceed to Step 3.
      *   *[JUDGMENT CALL 1]:* If the panelist is senior staff, you may extend the control window to 8 weeks. Document this extension. This is a policy choice, not a measurement.

  ### STEP 3: THE BLIND REFERENCE TEST
  **Action:** Serve the "deviant" coffee alongside the "baseline" coffee (or a known good reference) in a blind triangle test (2 same, 1 different) to the *rest* of the panel (excluding the reporter).
  **Question:** Can the rest of the panel identify the odd sample at a statistically significant rate (p < 0.05)?
  *   **Yes (Panel detects difference):** **OUTPUT: ACCEPT AS PRODUCT CHANGE.** The coffee has changed. The reporter was the canary in the coal mine.
  *   **No (Panel cannot detect difference):** Proceed to Step 4.
      *   *[JUDGMENT CALL 2]:* If the attribute is critical (e.g., taint/fault), override this step and reject the lot. If the attribute is preference-based (e.g., body, acidity), continue.

  ### STEP 4: THE HISTORY CHECK
  **Question:** Is the reported attribute consistent with known degradation vectors for this product? (e.g., Staleness in old coffee, thinness in low-density beans).
  *   **Yes (Physically Plausible):** Proceed to Step 5.
  *   **No (Physically Implausible):** **OUTPUT: TREAT AS PANELIST DRIFT.** (e.g., Panelist reports "ferment" on a freshly roasted, dry-processed lot where fermentation is impossible). Recalibrate the panelist.

  ### STEP 5: THE UNDECIDABLE CLAUSE
  **Condition:** You have a single (or minority) reporter with clean controls, but the majority panel cannot detect the difference in a blind test, yet the report is physically plausible.
  **Question:** Is there external evidence available? (Gas chromatography, moisture meter, Agtron, or a second external panel).
  *   **Yes:** **OUTPUT: DECLARE UNDECIDABLE FROM WITHIN.** Hold product. Send to external lab/panel. Their verdict is final.
  *   **No:** **OUTPUT: POLICY OVERRIDE.**
      *   If the reporter is the minority: **TREAT AS DRIFT.** (The consensus of the calibrated instrument overrides the introspection of the single instrument).
      *   If the reporter is the majority: **TREAT AS CHANGE.** (Even if blind tests fail, persistent consensus suggests a shift in the product profile).
      *   *[JUDGMENT CALL 3]:* This step admits we cannot know if the "qualia" changed. We are choosing whose word counts more. This is management, not science.

  ---

  ## PART 2: PROCEDURE RUN-THROUGH

  Here is the SDP-01 applied to your three current scenarios.

  ### CASE 1: The Shelf-Life Study
  **Scenario:** 6 panelists. Same lot. Month 0 vs. Month 8. 3 panelists report increased staleness; 3 report no change.
  **Execution:**
  1.  **Isolation:** Split panel (50%). Proceed to Step 3.
  2.  **Blind Reference:** Serve Month 0 vs. Month 8 to the group.
      *   *Result:* If the 3 "staleness" reporters cannot consistently pick the Month 8 cup in a triangle test against the Month 0 cup, the test fails.
      *   *Assumption:* Let's assume they *say* it tastes stale but cannot pick it out blindly better than chance.
  3.  **History:** Staleness is physically plausible over 8 months. Proceed to Step 5.
  4.  **Undecidable:** No external lab data (chemical aging markers).
  **OUTPUT:** **DECLARE UNDECIDABLE FROM WITHIN.**
  **Action:** You cannot sign off on the 8-month shelf life based on this data. The split decision indicates the sensory threshold for staleness is not calibrated across the panel.
  **Required External Evidence:** You need water activity (Aw) testing or a volatile organic compound analysis to confirm oxidation. Without it, the shelf-life claim is unsupported.

  ### CASE 2: The Senior Cupper (The Uncomfortable Answer)
  **Scenario:** Senior Cupper (Reference Standard) scores Flagship as "thin." Rest of Panel (7 people) scores it "normal/baseline." Senior's controls are clean.
  **Execution:**
  1.  **Isolation:** Single Panelist (Senior). Proceed to Step 2.
  2.  **Drift Check:** Controls are clean. Proceed to Step 3.
  3.  **Blind Reference:** Blind triangle test with the 7 other panelists.
      *   *Result:* The 7 panelists cannot distinguish the current batch from the archived baseline batch.
  4.  **History:** "Thinness" is plausible (crop change, roast variance). Proceed to Step 5.
  5.  **Undecidable:** No external evidence immediately available.
  **OUTPUT:** **TREAT AS PANELIST DRIFT (POLICY OVERRIDE).**
  **Action:** You must recalibrate the Senior Cupper.
  **Why this hurts:** You treat your "Gold Standard" as a drifting instrument. Dennett's point applies here: The Senior's introspective certainty ("I *know* it's thin") is not data. It is a report. If the calibrated consensus of the remaining 7 panelists (the system) disagrees, the system takes precedence over the individual, regardless of seniority. To do otherwise is to privilege introspection over consensus, which SDP-01 forbids.
  **Risk:** The Senior may quit. The coffee might actually be thin. But you cannot verify the latter without external evidence. You are choosing panel cohesion over individual intuition.

  ### CASE 3: The New Lot / New Panelists
  **Scenario:** Head Roaster says "Identical." 2 New Panelists (hired 1 month ago) say "Brighter."
  **Execution:**
  1.  **Isolation:** Minority (2 vs. Roaster + implied consensus). Proceed to Step 2.
  2.  **Drift Check:** New panelists have limited history (1 month).
      *   *[JUDGMENT CALL 1]:* Their control history is insufficient to establish stability.
  **OUTPUT:** **SPLIT THE PANEL AND RETRAIN.**
  **Action:** Do not approve the lot. Do not accept the "Brighter" score yet.
  **Reasoning:** You cannot trust the new panelists' calibration, and you cannot trust the Roaster's objectivity (conflict of interest).
  **Remedy:** Run the new lot against the old lot with the 6 *calibrated* veteran panelists (excluding the Senior from Case 2 if he is still in drift). If the veterans score it "Brighter," then it is a product change. If they score it "Same," the new panelists are uncalibrated.

  ---

  ## PART 3: LIMITATIONS AND HONESTY STATEMENT

  This procedure is a risk management tool, not a truth machine. It cannot solve the philosophical problem you identified; it can only bury it under consensus.

  **1. The Undecidable Distinction**
  SDP-01 cannot distinguish between a panelist whose *perception* has changed (qualia shift) and a panelist whose *judgment criteria* have changed (scoring drift).
  *   *Example:* If the Senior Cupper (Case 2) truly experiences the coffee as less viscous due to a physiological change in saliva composition, SDP-01 treats this as "Drift."
  *   *Consequence:* We prioritize the *utility* of the score (consistency across the team) over the *accuracy* of the individual experience. We are standardizing reports, not sensations.

  **2. The Policy Hole**
  Step 5 (Policy Override) is where science ends and management begins.
  *   When data conflicts (Senior vs. Panel), there is no metaphysical fact of the matter accessible to us.
  *   We choose the Panel not because they are "right," but because a roastery cannot operate on the idiosyncratic reports of a single individual, no matter how skilled.
  *   **Honest Admission:** In Case 2, we may be rejecting a true detection of a subtle change because the majority is insensitive. We accept this risk to maintain operational stability.

  **3. The "Qualia" Hole in the Flowchart**
  There is no step that asks, "Did the coffee actually taste different to you?"
  *   We ask, "Can you pick it out blind?" and "Do others agree?"
  *   We explicitly ignore the "from-the-inside" claim.
  *   **Why:** Because that claim is unverifiable. As Dennett argues, treating that internal report as a privileged datum creates the bind you are currently in.
  *   **Result:** A cupper's confidence will be overruled. They will feel unheard. This is not a bug in the procedure; it is the cost of running a sensory lab that ships product. We trade phenomenological truth for intersubjective reliability.

  **Final Directive:**
  When a cupper says, "But I *know* it's different," your answer is: "The protocol says your knowability is insufficient without corroboration." This will feel cold. It is supposed to. It is the only way to keep the coffee consistent when the senses are not.
