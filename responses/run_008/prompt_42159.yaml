  2.  **Deconstruct "Base Determines Superstructure":**
      *   *Base:* Means of production, property relations, economic system (e.g., capitalism).
      *   *Superstructure:* Culture, law, politics, ideology, technology design (in this context).
      *   *Determines:* This is the slippery word. Does it mean "influences," "constrains," "causes," or "rigidly dictates"?
      *   *The Opponent's Leap:* From "base influences superstructure" to "superstructure analysis is useless." This implies a strong determinism and a lack of feedback loops.

  3.  **Drafting the Theses (Weak to Strong):**

      *   *Thesis 1 (Weak):* Economic context sets constraints. (Plausible, doesn't support "pointless").
      *   *Thesis 2 (Moderate):* Economic incentives shape design choices. (Plausible, but design still matters as a mechanism).
      *   *Thesis 3 (Stronger):* Design cannot fundamentally contradict economic logic. (Plausible, but doesn't make design irrelevant).
      *   *Thesis 4 (Very Strong):* Design is *epiphenomenal* (mere shadow). (Implausible, supports "pointless").
      *   *Thesis 5 (Extreme):* One-way causation (No feedback). (Implausible, supports "pointless").

      *Refining for the "Software Engineer" Analogy:* Use terms like "constraints," "API," "hardware," "feedback loops."

      *   *Reading 1:* Economic conditions impose *budgetary and incentive constraints*. (Like hardware limits).
