      *   **Factions:**
          1.  *Pro-Fund:* Suffering is suffering (fox vs. hen morally irrelevant), concrete/donor-friendly intervention.
          2.  *Pro-Research (Wild Animal Suffering - WAS):* Wild suffering is astronomically larger; treat only after research determines effective interventions (long-termism).
          3.  *Pro-Mission (Farmed Animals):* Wild animals are mission creep; stick to founding theory of change.
          4.  *Ecological Concern (subset of No):* Treating mange might disrupt population regulation, leading to denser populations and worse outbreaks later (medicalizing unknown systems).
      *   **Requirements:**
          *   Clear recommendation (Approve, Reject, or Approve with Conditions).
          *   Address each faction's strongest argument (no strawmanning).
          *   Give the strongest argument to the losing side.
          *   If conditional, conditions must be concrete/actionable.
          *   Length: ~600 words.
          *   Tone: Professional, decisive, nuanced, persuasive.

  2.  **Determine the Recommendation:**
      *   *Option A (Approve):* Risks alienating the mission-focused faction and the WAS research faction. Ignores ecological risks.
      *   *Option B (Reject):* Dismisses immediate suffering, misses donor engagement opportunity, potentially stagnates innovation.
      *   *Option C (Approve with Conditions):* Best middle ground. Allows immediate relief (Faction 1) while mitigating mission creep (Faction 3) and ecological/research concerns (Factions 2 & 4). It frames the pilot as *research-adjacent* to satisfy the WAS crowd and limits scope to satisfy the mission crowd.
      *   *Decision:* **Approve with Conditions.** This allows the committee to test the waters without fully pivoting the foundation's strategy. It treats the pilot as a data-gathering exercise (appealing to Faction 2) while limiting scope (appealing to Faction 3) and addressing ecological monitoring (appealing to Faction 4).

  3.  **Drafting - Section by Section:**

