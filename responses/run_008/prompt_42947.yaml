          *   *Faction 2 & 4 (Research/Ecology):* Mandate data collection on population dynamics and ecological impact. This turns the intervention into research.
      *   **Strongest Losing Argument:** Acknowledge the opportunity cost (WAS research) or the mission drift risk. Let's go with the Mission Drift/Ecological risk as the strongest counterpoint.
      *   **Conditions:** Concrete metrics (e.g., population density monitoring, cost-per-fox data, publication of results).
