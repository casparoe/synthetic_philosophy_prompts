prompt: |-
  I'm a certified financial planner who runs a small independent practice, mostly ordinary people saving for retirement. I have no academic background at all, but I've been chewing on something for years on my commute, and I've finally managed to put my finger on it well enough to ask for help. I'd like you to act as an expert in decision theory and the philosophy of rational choice, and to think carefully and do some brainstorming before you answer, because I suspect my question is messier than it looks.

  Here is what I keep seeing. Some clients slowly bleed money to their own inconsistency, and no one is cheating them — each individual decision looks free and reasonable, but the sequence of decisions costs them money and leaves them where they started or worse. One client every January tells me, comparing funds side by side, that the boring low-cost index fund is the right fit for her goals, and every March, after growth funds post a good quarter, she pays a load plus capital gains taxes to switch into the growth fund — then every autumn, when markets get rocky, she pays again to switch back. She ends up owning what she originally had, minus several percent a year. Another client told me he'd rather have $110 in a year than $100 today, but then, asked about the same kind of choice moved closer, said he'd take $100 today over $110 next week; something is off about that pair of answers and I can't articulate what. A third insists she's happy with her current portfolio and has no interest in anything I offer her, yet also calls me in every panic to make paid changes she describes as "rebalancing" that leave her with less of everything. And in the opposite corner sit clients who never move at all: a man who has held three worthless stocks for fifteen years "until they come back," whose stated plan requires selling them, and who won't. It strikes me these might all be failures of the same general thing — people whose choices don't fit together across time, or across the way the question is put — but I may be lumping unlike problems together, and I'd want you to tell me if I am.

  What I'm asking for is a procedure I can actually run, not an essay. Please start with some plain-language brainstorming about what's really going on in my examples (I've never read a word of philosophy, so no jargon without translation). Then write a checklist for me to follow: the questions to ask and the records to pull, in order, during a client's annual review and again during unscheduled panic calls; what a "fail" looks like at each step; where the procedure instructs me to act (propose a commitment arrangement, decline to execute a trade, escalate to a senior colleague); and — this is the part I care most about — where it honestly cannot distinguish between an inconsistency that makes a client exploitable by their own future choices and a legitimate change of heart or genuine new information, so that the call is mine as a person rather than mine as a checker of boxes. The constraints are real: about forty-five minutes per review, plus whatever a panic call takes; stakes are people's retirements; and the only person who signs off is me.

  Then run the procedure on three clients and show your work: (1) the January growth-fund switcher above; (2) the fifteen-year holder of dead stocks who refuses every trade his own plan requires; (3) a client who has recently asked me to become his commitment device — to refuse his future requests to sell, and who is furious at me whenever I actually do refuse. For each, tell me what the procedure yields, whether the verdict is one I or the client will dislike, and what the procedure cannot settle in that case. Finally, tell me where the procedure will misfire — the situations where following it would itself be a mistake — and whether, on reflection, some of my examples belong to different problems that need different procedures rather than one. I would much rather learn that I've conflated things than receive a tidy system built on a confusion.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Certified Financial Planner (CFP), independent practice, serves ordinary people saving for retirement. No academic background in philosophy/economics. Practical, experienced, observant.
      *   **Problem:** Clients make sequences of decisions that are individually reasonable but collectively self-destructive (inconsistency over time). Examples: Market timing (switching funds), hyperbolic discounting ($100 now vs $110 later), panic selling disguised as rebalancing, inertia on losing stocks.
      *   **Goal:** A *procedure* (checklist/workflow) to identify and address these inconsistencies during annual reviews and panic calls.
      *   **Constraints:** 45 mins per review, real stakes (retirement), sole sign-off authority.
      *   **Specific Requirements:**
          1.  Plain-language brainstorming (no jargon without translation).
          2.  A step-by-step checklist (questions, records, "fail" conditions, action points, ambiguity points).
          3.  Run the procedure on three specific client cases (Switcher, Holder, Commitment-Seeker).
          4.  Critique the procedure (where it misfires, are these actually different problems?).
      *   **Tone:** Respectful, expert but accessible, practical, honest about limitations.

  2.  **Deconstruct the Phenomenon (Brainstorming Phase):**
      *   *What is the core issue?* It's not stupidity. It's *time inconsistency*. The "Self" at Time A makes a plan that the "Self" at Time B violates.
      *   *Client 1 (Switcher):* Chasing performance. Fear of missing out (FOMO) vs. Fear of loss. The plan is sound, the execution is emotional.
      *   *Client 2 ($100/$110):* This is classic "present bias." The value of "now" is disproportionately high compared to "later," but the gap shrinks as both dates move further away.
      *   *Client 3 (Panic Rebalancer):* Anxiety management disguised as financial management. Paying for peace of mind, but the cost is financial ruin.
      *   *Client 4 (Dead Stock Holder):* Loss aversion/Disposition effect. Selling feels like admitting defeat. The plan says sell, the ego says hold.
      *   *Common Thread:* All involve a conflict between a "Planner Self" (calm, long-term) and a "Doer Self" (emotional, immediate).
      *   *Distinction:* Some are about *preferences changing* (legitimate) vs. *preferences being unstable due to emotion/framing* (problematic).
      *   *Jargon Translation:*
          *   Dynamic Inconsistency -> "Changing your mind in a way that hurts your past self."
          *   Hyperbolic Discounting -> "Wanting it now way more than later, even if waiting is worth it."
          *   Status Quo Bias -> "Sticking with what you have because changing feels risky."
          *   Framing Effects -> "Deciding differently based on how I ask the question."

  3.  **Develop the Procedure (The Checklist):**
      *   *Goal:* Distinguish between "Growth/Change" and "Self-Sabotage."
      *   *Structure:* Needs to fit in 45 mins. Needs to work on panic calls too.
      *   *Steps:*
          1.  Establish the Baseline (What did we agree on?).
          2.  Test the Change (Is this new info or just noise?).
          3.  The "Sleep On It" / Cooling-off check.
          4.  The "Future Self" Test (Will you regret this?).
          5.  The Cost-Benefit of Inaction (What if we do nothing?).
      *   *Action Points:* When to push back, when to document, when to accept.
      *   *Ambiguity Point:* Where the CFP has to use judgment (New Info vs. Noise).

  4.  **Run the Procedure on the Three Cases:**
      *   *Case 1 (Switcher):* Fails the Baseline and Cost-Benefit steps. Verdict: Restrict trading or require cooling-off. Dislike: Client feels controlled. Ambiguity: Is there *really* no new info? (Unlikely).
      *   *Case 2 (Dead Stock Holder):* Fails the Baseline (Plan says sell). Fails Future Self Test (Plan was for retirement, not ego). Verdict: Hard conversation, potentially fire client if they refuse fiduciary duty. Dislike: Client feels judged. Ambiguity: Is there a tax reason not to sell?
      *   *Case 3 (Commitment Seeker):* This is meta. He *wants* the procedure. But he gets furious when it works. Fails the "Reaction to Restraint" test. Verdict: The commitment device is broken if he fights it. Needs a third party or automated system. Dislike: Client blames CFP for his own rules. Ambiguity: Is the anger at the CFP or the situation?

  5.  **Critique and Limitations (The "Misfire" Analysis):**
      *   *Where does it fail?*
          *   Legitimate life changes (divorce, illness) look like inconsistency.
          *   The CFP's own bias (paternalism).
          *   Clients who lie to themselves (and the CFP).
      *   *Are these different problems?*
          *   Yes. The Switcher is *impulsive*. The Holder is *avoidant*. The Commitment Seeker is *conflicted*.
          *   One procedure might be too blunt. Need to acknowledge this.
      *   *Ethical Boundary:* When does "helping" become "controlling"?

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone Check:* Keep it professional but conversational. Avoid "Dynamic Inconsistency" unless defined immediately as "Time-Travel Conflict."
      *   *Formatting:* Use bolding, lists, and clear headings for the checklist.
      *   *Self-Correction during drafting:* I initially thought about suggesting automated investing. But the prompt asks for a *procedure for the CFP to run*. I need to focus on the conversation and decision process, not just the product.
      *   *Refining the "Ambiguity" section:* This is crucial. The user specifically asked where *they* have to make the call. I need to highlight the "New Information" threshold.
      *   *Refining the Case Studies:* Make sure I explicitly state what the procedure yields and what it *can't* settle.
      *   *Refining the Critique:* Be honest. A checklist can't fix human psychology entirely. Distinguish between "Error" and "Preference."

  7.  **Final Review against Constraints:**
      *   45 mins? Yes, the checklist is designed to be quick.
      *   No jargon? I will define terms like "Present Bias" simply.
      *   Three cases? Yes.
      *   Misfire analysis? Yes.
      *   Brainstorming first? Yes.

  8.  **Final Polish:** Ensure the distinction between "Planner Self" and "Doer Self" is clear, as that's the intuitive hook for a non-philosopher. (Self-correction: Use "Architect" vs. "Builder" or "Planner" vs. "Actor"? Let's go with "Planner You" and "Actor You".)

  *(Self-Correction on Case 3)*: The prompt says the client is *furious* when refused. This suggests the commitment device is failing. The procedure needs to flag this as a "System Failure."

  *(Self-Correction on Case 2)*: The holder of dead stocks. This is the "Disposition Effect." The procedure needs to catch the gap between *stated* plan and *actual* behavior.

  *(Self-Correction on Case 1)*: The switcher. This is "Churning" driven by client, not advisor. The procedure needs to stop the trade or document the warning heavily.

  Okay, ready to write.
answer: |-
  ### Part 1: Brainstorming the Problem in Plain Language

  You have spotted a real phenomenon. In academic circles, this is often called **dynamic inconsistency** or **time inconsistency**, but those terms are useless in a client meeting.

  Here is the plain-language version of what is happening: **There are two versions of your client.**

  1.  **The Planner:** This is the client sitting in your office, calm, thinking about next year or ten years from now. The Planner wants security, growth, and to follow the rules.
  2.  **The Actor:** This is the client at home on a Tuesday night, looking at a red screen on their phone, or reading a headline about a market boom. The Actor feels fear, greed, impatience, or pride.

  The problem isn't that your clients are irrational. The problem is that the **Planner** makes a deal that the **Actor** refuses to keep.

  *   **The Switcher (Jan/March/Autumn):** Her *Planner* knows low-cost indexing is best. Her *Actor* gets scared when markets drop and greedy when they rise. She pays to soothe the Actor's emotions, hurting the Planner's goals.
  *   **The $100/$110 Client:** This is **Present Bias**. When both dates are in the future, the Planner says "Wait for the extra $10." When "today" is involved, the Actor says "I need it now." The value of "now" distorts their math.
  *   **The Panic Rebalancer:** She claims she wants growth (Planner), but she pays you to reduce risk when she feels anxious (Actor). She is buying anxiety relief, not investment advice, but calling it "rebalancing."
  *   **The Dead Stock Holder:** His *Planner* wrote a plan that says "cut losses." His *Actor* views selling as admitting defeat. He is prioritizing his ego over his retirement.

  **Are these the same problem?**
  Mostly, yes. They are all failures of **commitment**. The client cannot bind their future self to the promises their current self made. However, there is a dangerous trap here: **Legitimate Change.** Sometimes the Actor is right. If a client gets divorced or sick, their goals *should* change. If you treat a life change like a consistency error, you become a tyrant.

  The goal of the procedure below is not to stop clients from changing their minds. It is to distinguish between **New Information** (a valid reason to change) and **Noise** (an emotional urge that contradicts their own long-term goals).

  ***

  ### Part 2: The "Planner vs. Actor" Consistency Checklist

  **Time Budget:** 45 Minutes (Annual Review) / 15 Minutes (Panic Call Triage)
  **Goal:** Identify if a requested change serves the *Planner* or just soothes the *Actor*.

  #### Phase 1: Establish the Baseline (5 Minutes)
  *Pull the Investment Policy Statement (IPS) or the notes from the last annual review.*

  1.  **Question:** "What specific goal were we trying to achieve with this current setup?"
  2.  **Question:** "What specific event or condition did we agree would trigger a change?"
  3.  **Record Check:** Compare current portfolio against the agreed asset allocation.
  4.  **FAIL CONDITION:** The client cannot recall the goal, or the requested change contradicts the written trigger conditions without a new life event.
  5.  **ACTION:** If FAIL, pause the trade. Do not proceed to Phase 2 until the goal is restated and written down.

  #### Phase 2: The "New Information" Test (10 Minutes)
  *Distinguish between market noise and life changes.*

  1.  **Question:** "Has your personal life changed (job, health, family, spending needs) since we last met?"
      *   *If YES:* Go to Phase 3 (Legitimate Change).
      *   *If NO:* Proceed to Question 2.
  2.  **Question:** "Is this change driven by something the market *did* recently, or something the market *might do*?"
  3.  **FAIL CONDITION:** The reason for the trade is purely market performance (up or down) without a change in personal capacity for risk.
  4.  **ACTION:** Flag as "Emotional Drift." Proceed to Phase 3, but with a warning label.

  #### Phase 3: The "Future Self" Audit (15 Minutes)
  *Force the Planner to speak over the Actor.*

  1.  **Question:** "If we make this change, and the market does the exact opposite of what you expect next month, will you regret this trade?"
  2.  **Question:** "Imagine yourself one year from now. Does this decision make that version of you safer or more vulnerable?"
  3.  **Question:** "Are we making this decision to fix the portfolio, or to fix how you *feel* about the portfolio?"
  4.  **FAIL CONDITION:** Client admits they are doing it to "sleep better" (when the plan already accounted for risk) OR admits they would regret it if the market flips.
  5.  **ACTION:**
      *   **For Annual Review:** Propose a **Commitment Arrangement** (e.g., "We can make this change, but we sign an agreement that we won't undo it for 12 months").
      *   **For Panic Calls:** Invoke a **Cooling-Off Period** (e.g., "I will process this request, but only if you confirm it in writing after 48 hours").

  #### Phase 4: The Cost of Inaction (10 Minutes)
  *Check for inertia errors (The Dead Stock Holder).*

  1.  **Question:** "If we do nothing for the next 12 months, what is the specific risk?"
  2.  **Question:** "Our plan says we should [Sell/Rebalance]. What is the specific reason we are *not* doing that today?"
  3.  **FAIL CONDITION:** The client cannot articulate a reason for inaction other than "I don't want to lock in the loss" or "I'm waiting to get even."
  4.  **ACTION:** Document "Deviation from Plan." Require client signature acknowledging this deviation increases the risk of failing their retirement goal.

  #### Phase 5: The Ambiguity Zone (5 Minutes)
  *Where the checklist ends and you begin.*

  **This is where you must decide.** The procedure cannot tell you the difference between:
  *   A client who has genuinely lost tolerance for risk (Legitimate).
  *   A client who is temporarily scared but will regret selling (Self-Sabotage).

  **Your Instruction:** If the client passes Phases 1-4 but you still feel a deep sense of unease based on your history with them:
  1.  **Escalate:** If you have a senior colleague, present the case anonymously.
  2.  **Decline:** You have the right to decline to execute a trade you believe is fiduciary malpractice, even if the client insists.
  3.  **Document:** Write a memo to the file: "Client instructed trade X against advice Y. Risk of goal failure increased by Z%."

  ***

  ### Part 3: Running the Procedure on Your Three Clients

  #### Client 1: The January Growth-Fund Switcher
  *   **Phase 1 (Baseline):** FAIL. She agrees in January that the Index Fund fits. In March, she ignores that agreement.
  *   **Phase 2 (New Info):** FAIL. No life change. The trigger is "market went up," which is noise, not info.
  *   **Phase 3 (Future Self):** FAIL. She will likely regret it in Autumn when markets drop (as she has before).
  *   **Phase 4 (Inaction):** N/A (She is acting, not inert).
  *   **Verdict:** **High Risk of Self-Sabotage.**
  *   **Action:** Propose a Commitment Arrangement. "We can switch, but you must sign that you will not switch back for 12 months, regardless of market performance."
  *   **Dislike Factor:** She will dislike this. She wants the freedom to chase returns *and* the safety to bail out. You are removing the bail-out option.
  *   **What the Procedure Cannot Settle:** Whether she has actually developed a higher risk tolerance. If she truly understands the fees and still wants to gamble, is it her money? Yes. But your license is on the line if she ruins her retirement. The procedure flags the risk; *you* must decide if you enable it.

  #### Client 2: The Fifteen-Year Dead Stock Holder
  *   **Phase 1 (Baseline):** FAIL. His written plan requires selling. He is refusing.
  *   **Phase 2 (New Info):** FAIL. No life change prevents selling.
  *   **Phase 3 (Future Self):** FAIL. He cannot answer how this helps his retirement. He answers about "getting even."
  *   **Phase 4 (Inaction):** FAIL. His reason for inaction is "I don't want to admit the loss." This is an emotional reason, not a financial one.
  *   **Verdict:** **Critical Fiduciary Conflict.**
  *   **Action:** Document "Deviation from Plan." Require signature acknowledging this specific holding jeopardizes the retirement date. If he refuses to sign or sell, you must consider **firing the client**. You cannot be a CFP for a portfolio you are forbidden to manage.
  *   **Dislike Factor:** He will be furious. He views the stocks as lottery tickets; you view them as anchors.
  *   **What the Procedure Cannot Settle:** Whether there is a hidden tax reason he hasn't told you about. (Unlikely after 15 years, but possible). It also cannot fix his psychology. It only exposes it.

  #### Client 3: The Commitment Seeker (Who gets furious)
  *   **Phase 1 (Baseline):** PASS. He explicitly asked for restraint.
  *   **Phase 2 (New Info):** PASS. He is trying to stop himself from reacting to noise.
  *   **Phase 3 (Future Self):** PASS. He knows his Future Self will be impulsive.
  *   **Phase 4 (Inaction):** N/A.
  *   **The Twist:** When you refuse his trade (as agreed), he gets furious.
  *   **Verdict:** **System Failure.**
  *   **Action:** The procedure reveals that *you* are the wrong commitment device. A human advisor is too easy to blame. You need to automate the restriction. "I am happy to hold you to this, but we need to move these assets to a platform that physically prevents trading without a 30-day wait."
  *   **Dislike Factor:** He will dislike losing access to you as a scapegoat. He wants to be able to say "My advisor wouldn't let me" while secretly hoping you *would* let him.
  *   **What the Procedure Cannot Settle:** Whether he actually wants to succeed. Some clients want the *performance* of discipline without the *reality* of it. If he fights the guardrails he asked for, he may not be ready to save for retirement.

  ***

  ### Part 4: Where the Procedure Will Misfire

  You asked for honesty about where this system breaks. Here are the three danger zones.

  **1. The "Life Happens" False Positive**
  *   **The Situation:** A client wants to sell everything and move to cash. The checklist flags this as "Emotional Drift" (Phase 2) and "Future Self Regret" (Phase 3).
  *   **The Reality:** They just found out their spouse has a terminal illness. They *need* cash now. The Planner's goals have legitimately changed.
  *   **The Fix:** You must weigh Phase 2 (New Information) heavily. If there is *any* hint of life stress, suspend the checklist and switch to counseling mode. Do not treat a crisis like a consistency error.

  **2. The Paternalism Trap**
  *   **The Situation:** A client is wealthy enough to absorb losses. They want to gamble 10% of their portfolio on crypto or individual stocks. The checklist flags this as "Inconsistent with Safety Goals."
  *   **The Reality:** It's their money. If they can afford to be irrational, who are you to stop them?
  *   **The Fix:** Distinguish between **Retirement Money** (Protected) and **Play Money** (Unprotected). If the inconsistency threatens the retirement number, you intervene. If it threatens the "yacht fund," let them be inconsistent. The procedure needs a "Stakes Threshold."

  **3. The Conflation of Problems**
  You suspected you might be lumping unlike problems together. You are right.
  *   **The Switcher** has an **Impulse Control** problem. (Needs friction/cooling off).
  *   **The Dead Stock Holder** has an **Ego/Avoidance** problem. (Needs confrontation/accountability).
  *   **The Commitment Seeker** has a **Trust** problem. (He doesn't trust his future self, but he also doesn't trust you to hold the line).

  **Recommendation:** Do not use one single "Verdict" for all three.
  *   For the **Switcher**, the procedure yields **Friction** (wait times).
  *   For the **Holder**, the procedure yields **Confrontation** (sign-offs on risk).
  *   For the **Seeker**, the procedure yields **Automation** (remove human discretion).

  ### Final Thought
  You are acting as an external prefrontal cortex for your clients. That is valuable, but it is exhausting. The procedure above is designed to protect *you* as much as them. It creates a paper trail that shows you identified the inconsistency.

  If a client fails the checklist, insists on the trade, and loses money: You have the documentation that you warned them.
  If a client fails the checklist, insists on the trade, and you refuse: You have the ethical high ground.

  The only thing this procedure cannot solve is a client who does not actually want to reach their destination. Some people prefer the comfort of the drive to the arrival. You can't fix that. You can only refuse to drive the car off the cliff.
