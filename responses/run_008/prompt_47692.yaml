answer: |-
  Here is an adjudication of the argument, broken down move-by-move, followed by an assessment of what was missed and a reflection on my own limitations in judging this.

  ### Round-by-Round Adjudication

  **Move 1: Dev's Opening (The Mutating Hypothesis)**
  *   **Dev's Claim:** Atlantis theories lack physical evidence (artefacts, city remains) and mutate to avoid falsification (Atlantic → Santorini → Global).
  *   **Marcus's Implicit Counter:** (Addressed in Move 2) Standards are arbitrary.
  *   **Adjudication:** **Dev is right.**
      Dev is describing the philosophical problem of *unfalsifiability*. A hypothesis that changes its core parameters (location, scale, technology) every time evidence fails to materialise is not a scientific theory; it is a narrative shield. In archaeology, absence of evidence is not always evidence of absence, but a *global* seafaring civilisation leaving *no* trace in sediment cores, genetic markers, or trade goods is statistically improbable. Dev correctly identifies that the Atlantis story behaves like a "shape-shifter," which is a hallmark of pseudohistory.

  **Move 2: Marcus's Counter (The Orthodoxy Argument)**
  *   **Marcus's Claim:** Standards of evidence are gatekeeping. Cites Continental Drift (Wegener) and Troy as examples of dismissed ideas later proven true.
  *   **Adjudication:** **Marcus is partially right on principle, but wrong on analogy.**
      Marcus is correct that scientific orthodoxy can be resistant to new ideas (a Kuhnian paradigm shift). However, his analogues are weak.
      1.  **Troy:** Schliemann didn't prove "myth was real"; he found a settlement layer that matched the *geographical* description in the Iliad. There was a text pointing to a specific place. Atlantis has no such independent textual corroboration outside of Plato.
      2.  **Wegener:** This is Marcus's strongest card, but it cuts both ways (see Dev's next move).
      Marcus is right to be wary of "appeal to authority," but he conflates *skepticism of outsiders* with *rejection of bad evidence*.

  **Move 3: Dev's Rebuttal (The Mechanism Problem)**
  *   **Dev's Claim:** Wegener was dismissed because he lacked a mechanism, not because he was heretical. Science accepted him only when physical evidence (seafloor spreading) arrived. Pseudohistory never produces the "seafloor spreading."
  *   **Adjudication:** **Dev is decisively right.**
      This is the strongest point of the debate. History of science confirms Dev's account: Wegener was a credentialed scientist, but his theory of *how* continents moved was physically impossible given the physics of the time. It was only accepted when palaeomagnetism and seafloor spreading provided the *mechanism* and the *hard data*. Dev correctly challenges Marcus: "Show me the seafloor spreading for Atlantis." Marcus cannot, because there is no geological mechanism for a continent vanishing without a trace in the Atlantic basin.

  **Move 4: Marcus's Counter (Fomenko and Status)**
  *   **Marcus's Claim:** Dev defines evidence as "what professionals agree on." Cites Anatoly Fomenko, who uses statistical analysis on texts but is dismissed as a crank. Suggests the criterion is status ("is he one of us"), not method.
  *   **Adjudication:** **Marcus is mistaken on the nature of the evidence.**
      Marcus makes a valid sociological point: academia can be tribal. However, he misunderstands why Fomenko is rejected. Fomenko's "New Chronology" is not dismissed simply because he is an outsider or because he uses numbers. It is dismissed because peer reviewers (including mathematicians) have found his statistical methods to be flawed—specifically, cherry-picking data points to fit a pre-determined conclusion. Using numbers does not make an argument scientific; *how* you use them matters. Marcus falls into the trap of "scientism"—believing the trappings of science (statistics) validate the conclusion, regardless of the methodology.

  **Move 5: Dev's Closer (Reasoning vs. Rationalising)**
  *   **Dev's Claim:** If Fomenko's methods count, any rationalisation counts. The distinction between reasoning and rationalising collapses.
  *   **Adjudication:** **Dev wins the exchange.**
      Dev identifies the core epistemological risk. If we accept that "using numbers" or "challenging authority" is sufficient for validity, we lose the ability to distinguish between a breakthrough and a conspiracy theory. Rationalisation is the process of finding reasons to support a conclusion you've already chosen; reasoning is following the evidence to a conclusion. Dev correctly notes that Fomenko's work fits the former.

  ### Overall Verdict
  **Dev wins the argument on the merits of evidence and methodology.** Marcus raises important philosophical questions about the sociology of knowledge and the danger of dogma, but he applies them incorrectly to this specific case. He treats "mainstream rejection" as evidence of potential truth, which is a gamble, not an argument. Dev successfully demonstrates that the standards being applied to Atlantis are not moving targets, but consistent requirements for physical verification that Atlantis theories consistently fail to meet.

  ### What Both of Them Missed

  1.  **The Source Material:** Neither mentioned that the *only* source for Atlantis is Plato (specifically *Timaeus* and *Critias*). Most classicists argue Plato invented Atlantis as an allegorical device to discuss ideal states and hubris. Marcus treats it as a lost historical record; Dev treats it as a scientific hypothesis. Both miss that it is likely literature, not history or science.
  2.  **The "Negative Evidence" Threshold:** They treat absence of evidence as a binary. In archaeology, absence of evidence becomes evidence of absence only after a certain threshold of survey. We have mapped the Atlantic floor quite thoroughly. The lack of a sunken continent there is now positive data, not just a lack of discovery.
  3.  **Fomenko's Reception in Russia:** Marcus implies Fomenko is a victim of Western academic gatekeeping. In reality, Fomenko is widely regarded as a pseudoscientist within Russia as well, including by the Russian Academy of Sciences. His rejection is not purely a matter of "Western orthodoxy."

  ### Meta-Commentary: Where My Reasoning Might Be Wrong

  As an AI, I must be honest about the limitations of this adjudication.

  **1. Bias Towards Consensus:**
  My training data heavily weights mainstream scientific and historical consensus. I am inherently biased towards Dev's position because that is what the majority of verified literature supports. It is possible (though unlikely) that there is a systemic blind spot in archaeology regarding pre-Holocene civilisations that I cannot access. If the "seafloor spreading" equivalent for Atlantis exists but is being ignored due to institutional inertia, my verdict reinforces that inertia.
  *   *What would change my verdict:* The discovery of anomalous artefacts in a secure geological context (e.g., a manufactured tool in a stratum dated to 10,000+ years ago) that withstands peer review.

  **2. The Fomenko Specifics:**
  I am relying on the general consensus that Fomenko's methods are flawed. I have not independently run his statistical models. It is theoretically possible that his mathematical approach highlights genuine anomalies in historical chronology that mainstream historians dismiss because it upsets the established timeline, not because the maths is wrong.
  *   *What would change my verdict:* If independent statisticians (unaffiliated with history departments) validated Fomenko's algorithms and found they accurately predicted other archaeological discoveries.

  **3. The Wegener Analogy:**
  I have accepted Dev's characterization of Wegener as accurate. While largely true, Wegener *was* subjected to significant ad hominem attacks and ridicule, not just cold methodological critique. Marcus's point about the *tone* of rejection having a chilling effect on innovation is valid, even if his conclusion about Atlantis is wrong. I may have underweighted the sociological validity of Marcus's complaint.
  *   *What would change my verdict:* If historical analysis showed that Wegener's mechanism was actually understood by contemporaries but rejected purely due to professional protectiveness, rather than genuine physical impossibility.

  ### Summary for Marcus
  To keep the peace: Tell Marcus you've checked the spelling (realise, civilisation, defence). Acknowledge that he is right to be suspicious of gatekeeping—academia *can* be tribal. However, point out that Dev is right about the *type* of evidence required. Wegener didn't win by shouting louder; he won because the rocks eventually spoke. Until the rocks speak for Atlantis, Dev holds the stronger hand.
