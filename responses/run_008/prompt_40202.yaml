answer: |-
  ### What each side is actually claiming

  The "worst-case" camp argues that existential risk permits zero tolerance for failure. Because adversarial inputs can exploit opaque neural networks, only mathematical guarantees or robust theoretical bounds suffice. They contend empirical testing cannot cover the input space of a superintelligence, drawing analogies to cryptography where one break is fatal.

  The "average-case" camp argues formal verification is infeasible for complex deep learning systems. Safety should mirror traditional engineering: redundancy, monitoring, and high-probability reliability under realistic distributions. They claim demanding proofs stalls progress on practical safety measures, arguing that "good enough" safety is the only achievable goal. Both agree current systems are unsafe and stakes are high. The split is strictly on the method to secure them: one seeks certainty through theory, the other reliability through practice. They share the facts but diverge on the threshold of evidence required to deploy powerful systems.

  ### Diagnosis

  This is primarily a substantive disagreement about feasibility and risk topology, disguised as a methodological quarrel. Your hypothesis about "standards of evidence" is partially correct but misses the empirical core. The worst-case camp believes the landscape of minds contains "sharp left turns" where average-case performance decouples from safety catastrophically; thus, probability bounds are meaningless if the tail risk is extinction. The average-case camp believes neural networks are fundamentally statistical engines where formal guarantees are physically impossible, making worst-case demands a distraction.

  Consequently, they are answering different conditional questions: "What must we demand *if* guarantees are possible?" versus "What can we build *given* they are not?" It is not merely verbal; it rests on conflicting empirical beliefs about the scalability of formal methods and the continuity of capability growth. However, there is a normative layer: the worst-case side treats x-risk as a binary stop-condition, while the other treats it as a risk curve to be minimized.

  Crucially, this is a clash of reference classes. Worst-case proponents reference cryptography and nuclear containment (single failure = disaster). Average-case proponents reference aviation and civil engineering (failure rates managed via redundancy). This reference class clash is substantive because it dictates the cost-benefit analysis. If AI is more like an adversary than a bridge, worst-case wins. If it's more like a complex physical system, average-case wins. The stalemate persists because neither side can prove their empirical premise (feasibility of proofs vs. inevitability of catastrophic tails) without building the system they fear.

  Furthermore, the physicist's intuition about error bars applies to measurement noise, not adversarial optimization. The alignment debate conflates these. The worst-case camp sees the AI as an optimizer that will find the noise; the average-case camp sees the AI as a tool subject to noise. This is a substantive disagreement about the *agency* of the system. The "standard of evidence" is not just a bureaucratic hurdle; it is a proxy for trust regarding distributional shift.

  ### What would count as progress

  Progress requires decoupling the feasibility question from the normative one. A conceptual distinction between "robustness guarantees" (mathematical) and "assurance cases" (structured empirical argument) would help. But real movement needs a demonstration project: building a moderately capable agent that survives rigorous adversarial red-teaming using only empirical safeguards. If successful, it shifts the cost-benefit sense for the worst-case camp. Conversely, a formal result proving verification impossibility for transformer-like architectures would settle the feasibility dispute. Ultimately, the question must change from "which standard?" to "what specific failure modes require which standard?" Some subsystems (goal specification) may need proofs; others (perception) may only need high probability. Progress looks like a taxonomy of risks mapped to verification methods, rather than a monolithic stance on safety. We need to stop asking "which engineering paradigm?" and start asking "which components demand which paradigm?" This granularity allows both sides to concede ground where appropriate without abandoning their core risk models.

  ### Confidence

  I am 85% confident this diagnosis is correct. The core conflict is indeed a clash of empirical beliefs about feasibility masked as normative standards. The point I am least sure of is the extent to which "verbal" confusion drives the stalemate. There may be deeper disagreements about the definition of "alignment" itself (intent vs. behavior) that underpin the feasibility claims, which I have treated as secondary. However, the reference class dispute (crypto vs. engineering) is the dominant driver. Your safety factor hypothesis underestimates the disagreement about whether factors are calculable.
