prompt: |-
  I'm the one-person analytics shop at a regional health insurance plan (about 400k members, 14 clinics in network). Every quarter I put out a "clinic scorecard" comparing our in-network clinics on a bunch of outcome metrics -- 30-day readmission rates, follow-up after abnormal screening results, medication adherence -- and these numbers actually matter: our steering committee uses them in contract renewal talks, and a clinic got cut from the network two years ago partly off my scorecard.

  Here's my problem. The clinics serve very different patient mixes. One clinic downtown skews young and healthy, one out by the retirement communities is basically all Medicare. Last quarter I had a metric where clinic A beat clinic B in the pooled data, and then a friend of mine who works in biostats looked at it and pointed out that within every age band, B actually beat A -- the pooled number was just an artifact of A happening to see the easy cases. Nobody caught it, including me. I'd like to say this was a one-off but honestly I now have no systematic way to tell when pooling is lying to me and when it's fine.

  So what I want is a decision procedure I can actually run each quarter, per metric, before anything goes in the scorecard. Something like: what do I check first, what counts as a red flag, when do I stratify and re-run, and -- the hard part -- when the stratified answer differs from the pooled answer, which one goes in the report, and why. I understand from reading around that you can't settle that last question from the contingency table alone, that it depends on whether the thing you stratify on is upstream or downstream of the clinic's own choices, and I'd want the procedure to be honest about that point rather than pretending it has a mechanical answer.

  Please build the procedure with these constraints in mind: I have about half a day per metric, I can run regressions but I'm not a statistician, and the audience for the scorecard is a committee that wants ONE number per clinic, not a lecture.

  Then run it on three hypotheticals so I can see how it behaves:

  1. The one from last quarter: pooled comparison favors clinic A, but within each of four age bands clinic B does better, and I know from claims data that younger patients (who do better on this metric regardless of care) disproportionately go to A for reasons unrelated to quality -- there's a new clinic smell / online booking thing that younger people use.

  2. The reverse situation: pooled numbers favor clinic C, but a staffer at clinic C stratifies by whether the patient completed the care-management program C itself runs, and within completers vs non-completers C looks worse than clinic D. Clinic C is furious and says the stratified comparison punishes them for the very program that helps, so the pooled number is the fair one. My instinct is that C is gaming it, and I suspect the procedure will tell me my instinct is wrong -- I'd like it to be honest about that.

  3. A small-clinic case: a rural clinic with 90 patients, where one subgroup has like 11 people in it, and the direction flips when that subgroup is included but the counts are tiny. What should the procedure do there -- and where does it just throw up its hands and say this is a judgment call or a "collect more data" call?

  Also tell me where the procedure will misfire or get gamed, especially if the clinics figure out it exists and start choosing their own favorable stratifications to lobby me with. Keep in mind I never took causal inference, just two applied stats courses, so translate whatever theory you need but don't dumb it down to uselessness. Answer in American english please. And if there are places where the statistics genuinely underdetermines the answer and I'd be dressing up a value judgment as procedure, flag those explicitly rather than hiding them in a step -- I'd rather know which parts of my scorecard are opinions.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** One-person analytics shop at a regional health insurance plan (400k members, 14 clinics).
      *   **Task:** Quarterly "clinic scorecard" comparing in-network clinics on outcome metrics (readmissions, follow-up, adherence, etc.).
      *   **Stakes:** High. Used for contract renewals. Clinics have been cut based on this data.
      *   **Problem:** Simpson's Paradox (confounding by patient mix). Pooled data lied last quarter (Clinic A looked better than B overall, but B was better in every age band).
      *   **Constraints:**
          *   Time: ~0.5 day per metric.
          *   Skill: Can run regressions, not a statistician (no causal inference training).
          *   Audience: Steering committee wants ONE number per clinic, not a lecture.
          *   Requirement: A decision procedure (checklist/flowchart) to detect when pooling is misleading, handle stratification, and decide which number to report.
          *   Honesty: Must acknowledge where statistics end and value judgments begin.
          *   Output: American English, practical, not dumbed down but accessible.
      *   **Specific Requests:**
          *   Build the procedure.
          *   Run it on three hypotheticals (Simpson's Paradox, Collider Bias/Gaming, Small Sample/Instability).
          *   Identify failure modes/gaming risks.
          *   Flag value judgments explicitly.

  2.  **Deconstruct the Statistical Problem:**
      *   **Core Issue:** Confounding vs. Mediation vs. Colliders.
      *   **Pooled Estimate:** Marginal effect. Good for "what happens if I send a random patient?" but bad for "how good is the clinic?" if patient mix varies.
      *   **Stratified/Adjusted Estimate:** Conditional effect. Good for "how good is the clinic?" *if* we adjust for the right things. Bad if we adjust for things the clinic controls (mediators) or things caused by the clinic (colliders).
      *   **Simpson's Paradox:** Occurs when a confounder (like age) is associated with both the treatment (clinic choice) and the outcome.
      *   **The "One Number" Constraint:** The committee wants a single score. This means we usually need a *risk-adjusted* rate, not just a raw rate or a bunch of stratified rates.
      *   **Time Constraint:** 0.5 day per metric. Complex causal diagrams are out. Standardized regression or direct standardization is in.

  3.  **Drafting the Procedure (The "Scorecard Sanity Check"):**
      *   *Goal:* Detect confounding, decide on adjustment, produce one number.
      *   *Step 1: The Sniff Test (Descriptive).* Compare patient mixes. If clinics look different, pooling is suspicious.
      *   *Step 2: The Reversal Check (Simpson's).* Does the direction flip when adjusting for the big confounder (usually age/SES)?
      *   *Step 3: The Causal Logic Check (The Hard Part).* Is the stratification variable a *confounder* (pre-existing) or a *mediator/collider* (result of care)?
          *   *Confounder:* Adjust (e.g., Age, Gender, Baseline Risk).
          *   *Mediator:* Do NOT adjust (e.g., Did they attend the clinic's specific program?).
      *   *Step 4: Stability Check.* Are sample sizes too small?
      *   *Step 5: Reporting.* Risk-adjusted rate is usually the "One Number."

      *Refining Step 3 for a Non-Statistician:* I need to give him a heuristic for "Upstream vs. Downstream."
      *   *Upstream (Confounder):* Exists before the patient picks the clinic (Age, Zip Code, Prior Diagnoses). -> **Adjust.**
      *   *Downstream (Mediator/Collider):* Happens after arrival or is part of the treatment (Program completion, Follow-up visits). -> **Do NOT Adjust.**

      *Refining the "One Number":* Since the committee wants one number, simply reporting stratified buckets isn't an option. The solution is **Risk Adjustment (Standardization)**. Calculate what the rate *would* be if every clinic had the average patient mix. This solves Simpson's paradox without giving 10 numbers.

  4.  **Developing the Three Hypotheticals:**

      *   *Hypothetical 1 (Simpson's/Age):*
          *   Pooled: A > B.
          *   Stratified (Age): B > A in all bands.
          *   Variable: Age (Upstream/Confounder).
          *   Action: Adjust. Report Risk-Adjusted Rate favoring B.
          *   Why: Age is pre-existing. A is skimming cream.

      *   *Hypothetical 2 (The "Gaming"/Mediator):*
          *   Pooled: C > D.
          *   Stratified (Program Completion): D > C.
          *   Variable: Program Completion (Downstream/Mediator).
          *   Action: Do NOT Adjust. Report Pooled (or Risk-Adjusted for baseline only).
          *   Why: Completion is part of the quality. Adjusting for it hides the clinic's failure to engage patients. This is "Collider Bias" or "Over-adjustment."
          *   *Self-Correction:* The prompt says C claims pooled is fair. My instinct says C is gaming. The procedure should agree with the instinct *if* framed correctly. Wait, if C runs the program, completion is an *outcome* of quality. Adjusting for it removes the effect of the quality. So Pooled (or baseline adjusted) is correct. C is right, but for the right reasons? No, C is trying to hide that their program isn't working well *within* the groups. Actually, if C has a program that *works*, but they select easy patients into it, adjusting for completion hides the selection bias. But usually, "Program Completion" is a mediator. If I want to measure "Effectiveness of Clinic," I should not adjust for what the clinic *does*. I want to measure the total effect. So Pooled (baseline adjusted) is the right metric for contract renewal.
          *   *Wait, re-reading the prompt:* "Within completers vs non-completers C looks worse than D." C says stratified punishes them for the program.
          *   *Analysis:* If the program is effective, completers should do better. If C looks worse *within* strata, maybe their program is bad? Or maybe they dump hard cases into "completers"?
          *   *Key Statistical Concept:* This is adjusting for a **Mediator**. If you want to evaluate the *clinic's total performance*, you do not adjust for things the clinic controls. You want the "Intent to Treat" equivalent.
          *   *Verdict:* Stick with Pooled (baseline adjusted). Do not stratify by program completion.

      *   *Hypothetical 3 (Small Sample/Noise):*
          *   Rural clinic, n=90. Subgroup n=11.
          *   Direction flips with subgroup.
          *   Action: Stability Check. Confidence Intervals.
          *   Verdict: Suppress or Flag. Don't let n=11 drive a contract decision. "Data Insufficient."

  5.  **Addressing Gaming and Failure Modes:**
      *   *Gaming:* Clinics will propose stratifications that make them look good (e.g., "Adjust for patients who show up on time").
      *   *Defense:* Pre-register the adjustment variables. Only allow "Upstream" variables (Demographics, HCC risk scores).
      *   *Failure Mode:* Unmeasured confounding. (Can't fix this, acknowledge it).
      *   *Failure Mode:* Risk Adjustment becomes a ceiling. (Clinics stop trying with high-risk patients).

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the gravity. Validate the Simpson's Paradox fear.
      *   **The Procedure ("The Scorecard Sanity Check"):** Step-by-step, time-boxed.
      *   **The "One Number" Solution:** Explain Risk Standardization simply.
      *   **Running the Hypotheticals:** Walk through 1, 2, and 3 using the procedure.
      *   **Value Judgment Flags:** Explicitly call out where stats end and policy begins.
      *   **Gaming & Failure Modes:** How clinics will attack this and where it breaks.

  7.  **Refining the Tone:**
      *   Professional, direct, American English.
      *   Respectful of the user's skill level (applied stats, not theory).
      *   Honest about limitations (no causal magic).

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Risk Standardization" too hard for 0.5 days?
      *   *Fix:* Suggest using a logistic regression with clinic as a fixed effect and risk factors as covariates, then predicting marginal effects. Or simpler: Direct Standardization using the total population as the reference. Let's suggest Direct Standardization (weighting) as it's more transparent to a committee than regression coefficients. Actually, regression-based marginal predictions are standard in health analytics now. I'll describe it as "Risk-Adjusted Rate" and keep the math high-level but the logic precise.
      *   *Critique:* The prompt asks "Which one goes in the report?"
      *   *Fix:* The answer is almost always the **Risk-Adjusted Rate based on Pre-Existing Factors**. This synthesizes the stratified view into one number. I need to make sure this distinction is clear. Pooled = Raw. Stratified = Slice. Adjusted = Fair Comparison.
      *   *Critique:* Hypothetical 2 is tricky.
      *   *Fix:* Ensure I explain *why* adjusting for program completion is wrong (it's a mediator). This validates the user's instinct that C is trying to game it, but clarifies the statistical reason (over-adjustment bias).

  9.  **Final Polish:** Check constraints. 0.5 day limit? Yes. One number? Yes. Value judgments flagged? Yes.

  *(Self-Correction on Hypothetical 2)*: Let's look closer. Clinic C says "stratified comparison punishes us for the program." If the program is *good*, completers should do well. If C looks worse within strata, it implies the program isn't working or they are selecting patients poorly. But the statistical rule is: Do not adjust for intermediates. If the goal is "Clinic Quality," the program success *is* the quality. So the Pooled (baseline adjusted) is the correct metric. The procedure must support this.

  *(Self-Correction on Hypothetical 3)*: Small numbers. The procedure needs a "Suppression Rule." If CI is too wide or N < threshold, mark as "N/A" or "Review." Don't force a number.

  *(Value Judgment Flag)*: The choice of *which* risk factors to adjust for is a policy decision, not just stats. I must highlight this.

