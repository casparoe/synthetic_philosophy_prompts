prompt: |-
  I run a small reading group that meets in the back room of a bike shop — about ten people, a mix of programmers and curious non-specialists, no psych or AI background between them. Next session is 40 minutes, whiteboard, no slides, and I want to get across one idea from Hofstadter's Copycat work: that analogy-making is basically conceptual slippage under pressure, and that you can actually study it if you shrink the world down to a tiny made-up domain. I do NOT want to explain the program's architecture — the idea behind it.

  So nobody has to have read anything, here's the microdomain, which I'll put on the whiteboard more or less as follows: strings of lowercase letters; the concepts in play are successor ("the letter after x"), predecessor, groups of repeated letters (like the kk in iijjkk), sameness (iijjkk is made of ii, jj, kk), and positions (leftmost, rightmost). The canonical problem: abc goes to abd (rule: replace the rightmost letter with its successor) — so what does iijjkk go to? Defensible answers that people and the model actually produce include iijjll, iijjdd, iijjkl, iijjkd, aabbdd, and even plain abd. I'm deliberatly not telling you which slippage gives which; part of the session is unpacking that on the board.

  Plan it for me. What has to be in place before anything else — my guess is "there's no single right answer, and that's a feature not a bug" has to land first, but you decide. Which problem should carry the whole session: iijjkk, or the meaner variant where abc→abd and you ask about xyz (successor of z doesn't exist, so something has to give), or iijjkk first with xyz as the closer, or the other way around? For each problem you place, say what work it does that the other one can't. The misconceptions I'm bracing for at minimum: "it's just pattern matching, a regex could do it," "slippage means the model made a mistake," and "the tiny domain makes it trivial, real analogy is messier than letter strings." Map where in the sequence each one should be headed off and what the counter is. Then tell me what I should flat-out refuse to explain at this level (I'm guessing the internals — codelets, temperature, all that — but you tell me), and end with the one question I can ask where the answer tells me they got the idea rather than just enjoyed the puzzles.
