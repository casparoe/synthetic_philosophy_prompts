      *   *Refining the "Affect" point:* The friend says "You can't change what's real." True. But you aren't *changing* the future; you are *generating* it. In the Block, "generating" is a spatial relation, not a temporal becoming. But "affect" means "counterfactual dependence." If I hadn't chosen X, would Y exist? In the Block, if I hadn't chosen X, the block would be different (or that version of me doesn't exist). This gets into modal realism. Better to stick to causal dependence within the manifold.
