          5.  Address the "Chaining" (Premise 4). It's geometrically valid but metaphysically loaded.
          6.  Conclusion/Recommendation for the article.

      *   *Key Distinction:* "Fixed" vs. "Determined." In the Block, the future is fixed *tenselessly*, but it is determined *by* your actions. Your actions are part of the geometry.
