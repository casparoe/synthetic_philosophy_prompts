prompt: |-
  Just had a long argument with my flatmate about whether she should take the free genetic predisposition test her health plan offers before locking in some insurance decisions. She claimed knowing more can only ever help you decide, I said obviously not (bad news wrecks you emotionally, plus what if the insurer finds out somehow), and then she pulled out that a decision theorist called I.J. Good supposedly proved back in the 60s that expected utility can never go down when information is free, so she's being "rational." We went in circles on whether my cases are genuine counterexamples or just cases where the info isn't really free or isn't information in the relevant sense.

  Act as a decision theory expert who's also good at translating this to real life. Think carefully and maybe brainstorm a bit before settling on an answer. What are the most important implications of Good's theorem for ordinary people deciding whether to gather information -- when does the theorem genuinely apply, and where do its premises quietly fail (costs, the finding-out itself having consequences, the info changing your available options instead of just your beliefs, other parties learning what you know)? And the practical question we never resolved: does the theorem give any usable rule of thumb for when to seek info in messy real situations, or is it so idealized that it's basically useless as advice? Keep it focused on implications for actual decisions, dont just restate the theorem at me.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had an argument with their flatmate about taking a free genetic predisposition test.
      *   **Flatmate's Position:** "Knowing more can only ever help." Cites I.J. Good's theorem (1960s) that expected utility never decreases with free information. Claims this makes her "rational."
      *   **User's Position:** "Obviously not." Cites emotional distress ("bad news wrecks you") and privacy risks ("what if the insurer finds out").
      *   **My Role:** Decision theory expert who translates theory to real life.
      *   **Task:** Explain the implications of Good's Theorem for ordinary people. Identify where premises fail (costs, consequences of finding out, option changes, other parties learning). Answer the practical question: Is there a usable rule of thumb, or is it useless advice?
      *   **Constraint:** Keep it focused on implications for actual decisions, don't just restate the theorem.

  2.  **Deconstruct I.J. Good's Theorem:**
      *   *What does it actually say?* In a Bayesian framework, if you can acquire information for *free* (no cost to observe), and you use that information to maximize expected utility, the expected utility of the decision *with* the information is at least as high as the expected utility *without* it.
      *   *Key Assumptions:*
          1.  **Costless:** The information itself costs nothing (money, time, effort).
          2.  **Non-intrusive:** The act of observing doesn't change the state of the world (except through your subsequent actions).
          3.  **Private:** No one else knows you know (unless modeled as part of the state).
          4.  **Utility Function:** The agent cares *only* about the final outcome, not the emotional state of knowing. (Standard economic utility vs. psychological utility).
          5.  **Rational Updating:** The agent updates beliefs correctly (Bayesian) and chooses the optimal action based on new beliefs.

  3.  **Evaluate the Flatmate's Argument vs. User's Argument:**
      *   *Flatmate:* Technically right *within the strict mathematical model*. If "utility" is defined purely on material outcomes and info is truly free/private, she wins.
      *   *User:* Right *in the real world*. The assumptions of the theorem are violated.
          *   "Bad news wrecks you": Violates the utility function assumption. Knowledge enters the utility function directly (information aversion).
          *   "Insurer finds out": Violates the privacy/non-intrusive assumption. The act of testing changes the external environment (insurer's behavior).

  4.  **Brainstorm Implications & Premise Failures:**
      *   **Emotional Cost:** Standard decision theory treats utility as outcome-based. Real humans experience "anticipatory utility." Knowing you have a fatal disease reduces utility *now*, even if treatment options don't change. This is "information aversion."
      *   **Strategic/Adversarial Contexts:** Good's theorem assumes a static world. If a third party (insurer, employer) reacts to your information gathering, the "cost" isn't the test fee, it's the signal sent. This is game theory, not single-agent decision theory.
      *   **Irreversible Options:** Sometimes knowing closes doors. (e.g., If I know I'm predisposed to X, I might not buy insurance, but if I don't know, I might. Wait, actually, usually info opens options. But if the *act* of getting info disqualifies me, that's a constraint change).
      *   **Bounded Rationality:** Humans aren't perfect Bayesian updaters. We misinterpret genetic risk. We panic. If you process info poorly, expected utility *can* go down.
      *   **The Definition of "Free":** Is it free if it takes 2 hours? Is it free if it causes anxiety?

  5.  **Develop Practical Rules of Thumb:**
      *   Don't just say "Theorem is idealized." Give actionable advice.
      *   *Rule 1: Check for externalities.* Who else sees this? (Insurers, employers).
      *   *Rule 2: Check for emotional utility.* Do I want to know? (Ostrich effect).
      *   *Rule 3: Check for actionability.* Can I actually *do* anything different with this info? If not, Good's theorem implies indifference, but emotional cost makes it negative.
      *   *Rule 4: Check for processing ability.* Will I understand the probability or just hear "positive/negative"?

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic, authoritative but accessible, nuanced. Acknowledge both were partially right.
      *   *Structure:*
          1.  Validate the conflict (Theorem vs. Reality).
          2.  Break down the "Hidden Premises" of Good's Theorem.
          3.  Apply to the Genetic Test case specifically.
          4.  Provide the "Usable Rule of Thumb."
      *   *Refining the "Utility" point:* Crucial distinction. Good's theorem defines utility over *world states*. If "knowing" changes the world state (mental anguish), it's not the same state. So the theorem holds mathematically, but the model is wrong for humans.
      *   *Refining the "Insurer" point:* This is the strongest argument against the flatmate. It turns a decision problem into a game. If the insurer knows you tested, they update *their* beliefs even if you don't share results (adverse selection inference).

  7.  **Final Polish:**
      *   Ensure I don't get bogged down in math.
      *   Make sure the "Rule of Thumb" is distinct and memorable.
      *   Address the "rationality" claim. Being "rational" in the economic sense isn't always "wise" in the human sense.

  8.  **Self-Correction during drafting:** I initially thought about mentioning Blackwell's Theorem. *Correction:* No, keep it simple. Good's Theorem is the one cited. Stick to that. Make sure to emphasize that "Free" is the biggest trap.

  9.  **Final Review against constraints:**
      *   Act as expert? Yes.
      *   Translate to real life? Yes.
      *   Focus on implications? Yes.
      *   No restating theorem without context? Yes.
      *   Answer the "usable rule" question? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  You and your flatmate are both right, but you are arguing about two different maps of the world. She is holding a map of a frictionless vacuum; you are holding a map of Earth.

  I.J. Good's 1967 theorem is a beautiful piece of mathematics, but in the context of real-life decisions like genetic testing, it functions more like a "spherical cow" joke than a practical guide. It proves that information has non-negative value *only if* specific, rigid conditions are met. When those conditions break—as they almost always do in human affairs—the theorem's guarantee vanishes.

  Here is the breakdown of where Good's Theorem fails in the real world, and a practical framework you can actually use.

  ### 1. The Hidden Premises (Where the Theorem Breaks)

  Good's Theorem assumes a single agent making a decision in a static world. Here are the four specific premises that your flatmate is assuming hold true, but which likely do not in her situation:

  **A. Utility is only about outcomes, not states of mind**
  *   **The Premise:** Standard decision theory defines "utility" based on the final state of the world (e.g., are you healthy or sick?). It does not count the *experience of knowing* as part of the utility function.
  *   **The Reality:** Humans suffer from **information aversion**. If knowing you have a predisposition causes you three years of anxiety before any symptoms appear, that anxiety is a *cost*. In Good's model, "You + Knowledge of Risk" and "You + Ignorance" are treated as the same mental state leading to different actions. In reality, they are different mental states with different utilities. If the knowledge itself causes pain, the information has a negative price, violating the "free" condition.

  **B. The observation is non-intrusive (No Signaling)**
  *   **The Premise:** The act of looking at the information doesn't change the environment.
  *   **The Reality:** This is your strongest point regarding the insurer. In many contexts, the *attempt* to gather information is a signal. If you apply for life insurance and decline a free genetic test offered by your health plan, the insurer might infer you suspect something is wrong. If you take it and the data is shared (or inferred), you have changed your risk profile in their eyes. This turns a **Decision Problem** (Man vs. Nature) into a **Game** (Man vs. Insurer). Good's Theorem does not apply to games where other players update their strategies based on your information gathering.

  **C. The agent is a perfect Bayesian updater**
  *   **The Premise:** You will interpret the new data perfectly, updating your probabilities exactly according to the math, without bias.
  *   **The Reality:** Humans are terrible at risk literacy. A "60% increased risk" of a rare disease might sound terrifying, when the absolute risk remains tiny. If you misinterpret the data and make a panicked, sub-optimal decision (e.g., selling all assets, extreme lifestyle changes with diminishing returns), the expected utility *does* go down. Bad processing turns good info into bad decisions.

  **D. The information is truly "free"**
  *   **The Premise:** Zero cost to acquire.
  *   **The Reality:** Even if the monetary cost is $0, there are opportunity costs (time spent at the clinic), cognitive costs (worrying while waiting for results), and privacy costs (data entry into a health system). If the sum of these hidden costs exceeds the value of the improved decision, the net utility is negative.

  ### 2. The Genetic Test Case: Applying the Critique

  In your flatmate's specific case, Good's Theorem is likely **inapplicable** for two concrete reasons:

  1.  **The Adverse Selection Trap:** Even if the health plan says the data is private, insurance markets are sensitive to *behavior*. If she locks in long-term care or life insurance *after* taking the test, providers may wonder why she felt the need to test. In some jurisdictions, taking the test itself can flag you for higher scrutiny. The "cost" of the info is the potential loss of insurability.
  2.  **Actionability:** Good's Theorem implies information is valuable because it changes your *action*. If there is no cure or preventative measure for the genetic predisposition, the optimal action remains the same regardless of the result. In this case, the theoretical value of the information is zero. If the value is zero, but the emotional cost is positive (anxiety), the net value is negative.

  ### 3. A Usable Rule of Thumb for Real Life

  Since Good's Theorem is too idealized to be advice on its own, here is a practical heuristic derived from its failures. Call it the **"ACTION" Filter**. Before seeking "free" information, ask these four questions. If the answer to any is "No" or "High Risk," the theorem does not protect you.

  **1. A - Actionability**
  *   *Question:* "If the result is bad, is there something specific I can do differently that I wouldn't do otherwise?"
  *   *Why:* If you can't act on it, the information has no instrumental value to offset the emotional cost.
  *   *Verdict:* If **No**, don't test.

  **2. C - Confidentiality (The Game Theory Check)**
  *   *Question:* "Can I guarantee that no third party (insurer, employer, family) will infer or access this data, and that my *attempt* to test won't signal risk to them?"
  *   *Why:* If others know you know, you are no longer a single-agent decision maker. You are in a negotiation.
  *   *Verdict:* If **Uncertain**, treat the info as having a high potential cost.

  **3. T - Tolerance for Distress**
  *   *Question:* "Does knowing the truth improve my life *today*, or does it mortgage my present peace of mind for a future that might not happen?"
  *   *Why:* This acknowledges that utility includes emotional state. Some people function better preparing for the worst; others function better hoping for the best. Neither is irrational; they are different utility functions.
  *   *Verdict:* If you are prone to catastrophic thinking, "free" info is expensive.

  **4. I - Interpretation Ability**
  *   *Question:* "Do I have the expertise (or a trusted advisor) to interpret this probability correctly, or will I hear 'positive' and assume 'doomed'?"
  *   *Why:* Misinterpreted information leads to worse decisions than no information.
  *   *Verdict:* If you have to guess at the meaning, the info is noise, not signal.

  ### The Bottom Line

  You can tell your flatmate this: **I.J. Good proved that information is valuable for a robot who doesn't feel anxiety, lives in a world without adversaries, and never makes calculation errors.**

  For a human being, information is a tool, not a virtue. It is only "rational" to seek information if the **value of the improved decision** outweighs the **cost of acquiring and carrying that knowledge**.

  In the case of genetic testing with insurance implications, the "cost" side of that equation is often hidden and massive. Refusing the test isn't irrational fear; it's a rational assessment that the *terms of service* on that free information violate the premises required for it to be beneficial.
