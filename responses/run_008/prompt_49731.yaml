      To: Usage Subcommittee
      From: [Name]
      Date: October 24, 2023
      Subject: Recommendation on Generic Gendered Usage

      I recommend we **adopt the motion with conditions**. This avoids framing the issue as moral progress versus tradition, focusing instead on semantic precision and editorial consistency.

      The core dispute is whether generic "he" and "-man" compounds are semantically bleached (neutral) or unmarked defaults (male). The traditionalist view holds these terms are now functional equivalents to "one" or "person." The reformist view argues they retain a male default, excluding women from the generic category.

      To move beyond vibes, we need a test for semantic bleaching. A term is truly bleached only if substituting the marked gender does not alter the perceived typicality of the subject. If "chairman" evokes a male figure while "chairwoman" evokes a specific exception, the term is not bleached; it carries a default. In formal humanities writing, where precision is paramount, relying on terms that require readers to ignore inherent gender markers reduces clarity. We are not policing politics; we are policing ambiguity.

      However, blanket bans create awkwardness and infringe on authorial voice. Therefore, I propose the following operational criteria for copyeditors:

      1.  **Generic Singular Pronouns:** Replace generic "he/him/his" with "they/them/their" or pluralize the antecedent.
          *   *Exception:* If the antecedent is specifically male (e.g., "the author... he"), retain gendered pronouns.
      2.  **-Man Compounds:** Replace with neutral equivalents (e.g., "chairperson," "humanity") unless the term is a fixed proper noun (e.g., "Congressman" in official titles) or the author argues the gendered etymology is relevant to the text.
      3.  **Direct Quotations:** Never alter gendered language in quoted material.
      4.  **Authorial Voice:** In first-person narrative or reflective essays, allow authors to retain generic "he" if they explicitly justify it as a stylistic choice in their cover letter. Copyeditors should query, not change.

      This approach acknowledges that language evolves but insists that our style guide prioritize precision over habit. It gives the traditionalists a clear lane for exceptions (quotes, specific stylistic justification) while establishing a neutral default for general exposition. It allows the losing faction to push back on the "bleaching test" itself rather than accusing us of political maneuvering.

      We should update the style sheet to reflect these conditions immediately.

