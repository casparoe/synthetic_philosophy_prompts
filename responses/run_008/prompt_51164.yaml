answer: |-
  Here is the specification for a theory of manipulation. It is structured as a requirements document for a philosophical account, distinguishing boundary conditions, fixed verdicts, and stress tests.

  ### I. Boundary Conditions (Distinctions)
  *A viable theory must distinguish manipulation from adjacent concepts without collapsing them.*

  1.  **Manipulation vs. Coercion [Non-Negotiable]**
      *   **Requirement:** Must distinguish altering the *decision-making process* from altering the *choice architecture via threats*.
      *   **Case:** "Your money or your life" is coercion (removes option). "Buy this or you'll feel guilty" is manipulation (alters weighting).
      *   **Failure Mode:** A theory that classifies all pressure as manipulation loses the specific wrong of subverting agency.

  2.  **Manipulation vs. Deception/Lying [Non-Negotiable]**
      *   **Requirement:** Must allow for manipulation *without* falsehood.
      *   **Case:** The Truthful Manipulator (see below).
      *   **Failure Mode:** Defining manipulation as "deceptive influence" falsely exonerates the truthful doctor.

  3.  **Manipulation vs. Legitimate Persuasion [Non-Negotiable]**
      *   **Requirement:** Must distinguish appealing to reason/autonomy from circumventing it.
      *   **Case:** A lawyer presenting evidence (persuasion) vs. a lawyer playing on hidden biases (manipulation).
      *   **Failure Mode:** Defining all successful influence as manipulation renders the concept useless.

  ### II. Fixed Verdicts (Test Cases)
  *These are the intuition pumps the theory must match. Deviations require heavy justification.*

  4.  **The Subliminal Ad [Non-Negotiable]**
      *   **Verdict:** Manipulative.
      *   **Reason:** Influence occurs below the threshold of awareness/defense.
      *   **Requirement:** Theory must capture non-conscious influence as a subset of manipulation.

  5.  **The Heartfelt Appeal [Non-Negotiable]**
      *   **Verdict:** Not manipulative.
      *   **Case:** "Please don't go, I value our friendship."
      *   **Reason:** Appeals to genuine reasons/values transparently.
      *   **Requirement:** Theory must not classify emotional appeals *per se* as manipulation.

  6.  **The Truthful Manipulator [Non-Negotiable]**
      *   **Case:** A doctor accurately cites mortality statistics but frames them to induce panic, bypassing the patient's deliberative weighing of risks/benefits to secure consent for a procedure the doctor prefers.
      *   **Verdict:** Manipulative.
      *   **Requirement:** Theory cannot rely on **Covertness** or **Falsehood** as necessary conditions. The wrong must lie in the *relationship to the target's rationality*, not the truth-value of the input.

  7.  **The Two-Defaults Problem [Stress Test]**
      *   **Case A:** State sets organ donation to "Opt-Out" (presumed consent).
      *   **Case B:** E-commerce site sets subscription renewal to "Opt-Out" (auto-renew).
      *   **Mechanism:** Identical (exploits inertia/status-quo bias).
      *   **Verdict:** Case A is generally permissible/beneficial; Case B is generally manipulative/predatory.
      *   **Requirement:** Theory must explain the divergence. If the mechanism is identical, the differentiator must be external to the mechanism (e.g., intent, welfare alignment, authority legitimacy).

  ### III. Impossibility Theorems & Tensions
  *Constraints that cannot be jointly satisfied. This identifies where the moral weight actually sits.*

  8.  **The Mechanism-Only Impossibility [Derived Result]**
      *   **Conflict:** You cannot satisfy **(1) Classification by Psychological Mechanism Alone** AND **(2) The Two-Defaults Verdict**.
      *   **Proof:** Since the cognitive mechanism (status quo bias/inertia) is identical in both default cases, a theory relying *only* on the mechanism must assign identical verdicts. Since the intuitive verdicts differ, a mechanism-only theory fails.
      *   **Implication:** A successful theory **must** smuggle in normative context (intent, beneficiary, or authority). Purely descriptive psychology cannot ground the ethics of manipulation.

  9.  **The Transparency Tension**
      *   **Conflict:** You cannot satisfy **(1) Manipulation requires Covertness** AND **(2) The Truthful Manipulator Verdict**.
      *   **Proof:** The doctor's statistics are open and truthful. If manipulation requires the influence to lose its grip upon disclosure (the "test of publicity"), the doctor passes. But the doctor is manipulative.
      *   **Implication:** Covertness is a common *feature* of manipulation, but not the *defining wrong*.

  ### IV. Requirement Status Legend
  *   **[Non-Negotiable]:** If a theory fails this, it does not track the concept of manipulation used in ethics/law.
  *   **[Camp Prejudice]:** These are contested intuitions. A theory can fail these if it offers a compelling error theory (e.g., "Actually, organ donation defaults *are* manipulative, just justified").
      *   *Prejudice:* "All nudges are manipulative." (Libertarian Paternalism critics)
      *   *Prejudice:* "Emotional appeals are always manipulative." (Stoic/Hyper-rationalist view)
      *   *Prejudice:* "If it benefits the target, it isn't manipulation." (Paternalist view)

  ---

  ### V. Quick Scorecard: Three Main Proposals

  | Theory | Definition | Score | Notes |
  | :--- | :--- | :--- | :--- |
  | **1. Rational Bypass** | Manipulation bypasses/subverts rational capacities (System 2). | **Pass / Fail** | **Passes:** Truthful Manipulator, Subliminal Ad. <br>**Fails:** Two-Defaults. Cannot distinguish organ donation from subscription without adding normative context (intent/welfare). Mechanism is identical. |
  | **2. Covert/Hidden** | Manipulation works only if the target is unaware of the influence. | **Fail** | **Fails:** Truthful Manipulator (stats are open). <br>**Fails:** Some Dark Patterns (users know the UI is tricky but feel forced). <br>**Passes:** Subliminal Ad. |
  | **3. Exploitation** | Manipulation exploits a pre-existing weakness/trait for the influencer's gain. | **Pass** | **Passes:** Two-Defaults (distinguishes via "gain" and "wrongful exploitation"). <br>**Passes:** Truthful Manipulator (exploits fear). <br>**Risk:** Must define *wrongful* exploitation carefully to avoid calling all persuasion exploitation. |

  ### Summary of the Result
  Your suspicion is correct. **Desideratum 7 (Two-Defaults) and a Mechanism-Only definition are jointly unsatisfiable.**

  This implies that manipulation is not a *natural kind* identifiable by psychology alone. It is a **normative kind**. The moral weight does not sit in the *how* (the cognitive mechanism), but in the *why* (the intent) and the *for whom* (the alignment of interests). Any theory that tries to define manipulation purely as a causal process (like a virus) will fail to capture the distinction between a nudge for public health and a nudge for profit.
