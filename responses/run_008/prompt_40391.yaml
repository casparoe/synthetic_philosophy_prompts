answer: |-
  This is a fantastic puzzle, and you are right to sense that the *Kirchensteuer* is philosophically denser than the standard "separation vs. establishment" binary allows. The German system is not a bug in liberal constitutionalism; it is a feature of a *different species* of liberalism—one that is corporatist, substantive, and historically conscious rather than individualist, procedural, and ahistorical.

  Here is a reconstruction of the implicit theories at work, the points of underdetermination, and the counterfactuals you requested.

  ### 1. The Ontology of Membership: Status, Not Contract

  You asked whether religious membership here is a "public-law corporate quasi-citizenship." That is remarkably close to the mark. The system presupposes a **status theory of religious affiliation** rather than a **contractual theory**.

  In the US model (contractual), religious membership is a private agreement between an individual and an association. You join, you pay dues, you leave. The state is blind to the transaction.

  In the German model, membership in a *Körperschaft des öffentlichen Rechts* (corporation under public law) is a **public status**.
  *   **Presupposition:** Religious identity is an objective social fact, not merely a subjective state of mind. Because you were baptized (a public ritual recorded in a registry), you *are* a member. The state recognizes this status just as it recognizes your marital status or your nationality.
  *   **The Exit Mechanism:** This explains why *Kirchenaustritt* (church exit) must be a state act. If membership were purely private, you could resign via letter to the parish. Because membership carries public-law consequences (tax liability, eligibility for certain church-run public services, right to vote in church synods), the state must adjudicate the change in status. The state is not acting as the church's billing department; it is acting as the **registrar of statuses**.
  *   **Ascription vs. Choice:** The system presupposes that religious belonging is **inherited by default** and **renounced by will**. This inverts the liberal voluntarist assumption that belief is chosen by default and inherited only by culture. Here, the "costly signal" is not joining (which happens at infancy, cost-free), but *leaving*. The friction (fees, bureaucracy) is not an accidental barrier; it is a **deterrent against casual disaffiliation**. It treats religious identity as a "sticky" status, akin to nationality, which one does not shed lightly.

  **Where it is underdetermined:** The system does not specify *why* the state cares about this status. Is it because the state values the theological truth of the church? (No, that would violate neutrality). Is it because the state values the church as a stabilizing social institution? (Yes, this is the stronger reading). The theory leaves open whether the state is protecting the *church* or protecting the *citizen's capacity to be religious* within a structured community.

  ### 2. The Church-State Relationship: Positive Neutrality and Public Function

  You asked if the state is providing billing services for private associations or if churches are performing public functions. The German Constitutional Court (*Bundesverfassungsgericht*) has settled this theoretically, though the practice remains ambiguous.

  *   **The Theory:** The *Grundgesetz* (Basic Law) mandates **positive neutrality** (*positive Neutralität*). The state must not be hostile to religion; it must create conditions where religious life can flourish. By granting *Körperschaft* status, the state recognizes that these churches are **partners in the public sphere**.
  *   **Public Function:** The tax collection presupposes that the churches perform **quasi-public welfare functions**. The *Landeskirchen* and the Catholic Church run a massive portion of Germany's kindergartens, hospitals, and elderly care (*Caritas*, *Diakonie*). The *Kirchensteuer* is not a "dues" payment for spiritual services; it is a **subsidy for social infrastructure** that relieves the state of welfare burdens.
  *   **Presupposition:** The state presupposes that the church is a **mediating institution** (*Zwischengewalt*) between the individual and the state. By funding the church, the state is outsourcing social cohesion.
  *   **Underdetermination:** The link between the tax and the welfare function is legally loose. A wealthy member pays more tax but consumes no church services; a poor member consumes hospital care but pays no tax. The system presupposes a **communitarian solidarity** within the church that mirrors the state's own tax solidarity. It treats the church as a **fiscal micro-state** within the state.

  ### 3. The Liberal Tension: Choice vs. Ascription

  You noted the tension with liberal theory, which treats religious affiliation as the paradigm of free choice. The German system challenges the **atomistic liberal** view in favor of a **corporatist liberal** view.

  *   **Compatible Theory:** This system is compatible with a **perfectionist liberalism** or a **communitarian liberalism**. It argues that true freedom of religion requires robust, financially secure institutions. If religion were purely voluntary (market-based), churches might become dependent on wealthy donors or state grants that come with strings attached. The *Kirchensteuer* guarantees institutional independence *from* the state (the state collects but cannot dictate use) and *from* the market.
  *   **The "Relic" Argument:** You asked if this is just a historical relic. It is historically rooted (Westphalian origins, Weimar compromise), but it is not theoretically inert. It presupposes that **freedom of religion includes the freedom to belong to a historically embedded community without having to constantly reaffirm that belonging.**
  *   **The Exit Cost:** In liberal theory, exit costs are usually suspect (the "right to exit" is fundamental). Here, the exit cost is justified as **administrative clarity**. Since the state relies on the church registry to determine tax liability, the state requires a clear, unambiguous record of non-membership. The friction ensures that the registry is accurate. If exit were too easy (e.g., clicking a box online), the registry would be unreliable, and the tax system would collapse.

  ### 4. Counterfactual 1: The Voluntary-Association Model

  If you redesigned the system around a genuinely voluntary-association model (the "Gym Membership" or "US Club" model), here is what would have to change and what would likely happen:

  **Concrete Changes:**
  1.  **Abolition of *Körperschaft* Status:** Churches would become *eingetragene Vereine* (registered associations) under private law.
  2.  **End of State Collection:** The *Finanzamt* (tax office) would stop collecting. Churches would have to bill members directly or rely on donation envelopes.
  3.  **Privatized Registry:** Membership would be determined by the church, not the state. *Kirchenaustritt* would be a letter to the parish, not a visit to the *Amtsgericht*.
  4.  **Constitutional Amendment:** You would likely need to amend Art. 140 GG / Weimar Art. 137, as the current constitution *guarantees* the right of religious societies to levy taxes based on civil tax rolls.

  **Stability Analysis:**
  *   **Financial Collapse:** The system would likely be **unstable** for the *Volkskirchen* (people's churches). A significant percentage of "members" are passive; they pay the tax because it is withheld automatically, not because they are devout. If payment requires active effort (writing a check, setting up a direct debit), "free riders" on the cultural identity of the church would drop off immediately.
  *   **Ideological Purification:** The churches would become smaller but more committed. This might actually align *better* with theological ideals of discipleship but worse with the sociological role of the church as a broad social tent.
  *   **State Encroachment:** Paradoxically, this might reduce church independence. If churches lose the *Kirchensteuer*, they will demand state subsidies for their kindergartens and hospitals. State subsidies come with state regulation. The *Kirchensteuer* currently buys them **regulatory autonomy**.

  ### 5. Counterfactual 2: The Ethnicity/Descent Model

  You asked what a system built on religion-as-ethnicity would look like. This is distinct from the current system because the current system allows for *individual* exit. An ethnic model treats religious affiliation as **immutable status**.

  **Concrete Design:**
  1.  **Automatic Inheritance:** Membership is determined solely by parental status (jus sanguinis for faith). Baptism is irrelevant; birth is the trigger.
  2.  **No Individual Exit:** You cannot file *Kirchenaustritt*. You can only change affiliation if you convert to another *recognized* public-law corporation. Apostasy (leaving religion entirely) is either impossible or requires a state dispensation similar to denaturalization.
  3.  **Tax as Tribute:** The tax is no longer a "membership due" but a **community levy**, similar to how taxes fund national defense. You pay because you belong to the *Volk*, and the church is the spiritual arm of the *Volk*.

  **Feasibility and Theory:**
  *   **Constitutional Violation:** This would violate Art. 4 GG (Freedom of Faith and Conscience). The German constitution protects the **negative freedom of religion** (freedom *from* religion). An ethnic model obliterates negative freedom.
  *   **Theoretical Implication:** This model presupposes that religion is **constitutive of identity** in a way that precludes choice. It aligns with pre-modern confessional states (e.g., *cuius regio, eius religio*) or certain theocracies.
  *   **Comparison to Current System:** The current German system is a **hybrid**. It has the *ascription* of the ethnic model (you are in by default) but the *exit rights* of the liberal model (you can leave). This hybrid is what makes it philosophically unique: it treats religion as a **cultural default** that the individual is free to reject, but which the state maintains as the administrative norm.

  ### Summary for your Dissertation

  The *Kirchensteuer* rests on a theory of **Institutional Liberty** rather than **Individual Liberty**.

  1.  **Membership:** It is a **public-law status** (objective, registered, sticky) rather than a private contract (subjective, unregistered, fluid).
  2.  **State Role:** The state is a **cooperative partner** facilitating the infrastructure of salvation/welfare, not a neutral referee ignoring the game.
  3.  **Liberalism:** It presupposes a **substantive liberalism** where the state actively supports the conditions for communal religious life, even at the cost of some individual procedural friction (the exit hassle).

  **The Philosophical Hook:** The system is not "illiberal"; it is **corporatist-liberal**. It prioritizes the freedom of the *religious community* to exist independently of the market and the state over the freedom of the *individual* to treat religion as a consumer good. The "weirdness" you sense is the friction between American-style procedural individualism and German-style substantive corporatism. The *Kirchensteuer* works only as long as the state accepts that churches are **public utilities of the soul**, and citizens accept that their religious identity is a **matter of public record**.

  If you frame it this way, you move beyond "France vs. US" and into a critique of how different constitutional orders define the "self" that holds rights: the atomized individual vs. the embedded member.
