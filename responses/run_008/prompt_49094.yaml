  ### Part 3: The Tie-Breaker Case

  Since Case A potentially separates the two rules (DDE says Permissible, PET says Impermissible), you could technically use Case A as the test. However, Case A involves complex collision mechanics (derailment, siding, etc.) that might introduce confounding variables about "certainty of death" or "physical contact."

  To cleanly separate **Means/Side-Effect** from **Pre-Existing Threat**, you need a case where the victim is clearly *not* a means (satisfying DDE) but is clearly killed by a *new* agent (violating PET).

  **Proposed Case C: The Falling Shield**

  > "A runaway trolley is heading toward five people. You cannot stop the trolley or divert it. However, you have a heavy concrete block suspended above the track by a crane. If you release the block, it will fall onto the track, creating a barrier that stops the trolley, saving the five.
  >
  > However, directly beneath the block's path, there is one person standing. The block will crush and kill this person as it falls, then land on the track to stop the trolley. The person's death contributes nothing to stopping the trolley; only the block's presence on the track does that. The person is merely an unfortunate obstacle in the path of the rescue device."

  **Why this separates the rules:**
  1.  **Means/Side-Effect (DDE):** The death is a **side-effect**. The *means* to save the five is the block stopping the trolley. The crushing of the person is not required for the block to stop the trolley (if the person stepped aside, the block would still work). Therefore, DDE predicts **Permissible**.
  2.  **Pre-Existing Threat (PET):** The person is killed by the **block** (a new lethal agent introduced by you), not by the **trolley** (the pre-existing threat). The trolley never touches the person. Therefore, PET predicts **Impermissible**.

  **Instructions for running it:**
  Ensure you emphasize that the person is *not* needed to stop the trolley (unlike Case 4, the Loop). Emphasize that the block is the only thing that stops the trolley. If Marta rules this **Impermissible**, she is running the **Pre-Existing Threat** principle (and will likely rule Case A Impermissible). If she rules it **Permissible**, she is running a pure **Means/Side-Effect** principle (and may rule Case A Permissible).

  Given her history with Case 7 (Organs) and Case 2 (Fat Man), I predict she will rule The Falling Shield **Impermissible**, confirming that she prohibits introducing new lethal agents even when the victim is merely a side-effect.
