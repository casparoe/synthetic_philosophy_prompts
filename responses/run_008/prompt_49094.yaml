  ### Part 1: Candidate Rules and Eliminations

  Marta's record is remarkably consistent, but it is not consistent with a single, simple heuristic like "maximize lives saved" or "never kill." To fit her eight precedents, we must look for rules that distinguish *how* a death occurs, not just *that* it occurs. Two candidate principles survive her track record.

  **Candidate 1: The Means/Side-Effect Principle (Core of the Doctrine of Double Effect)**
  This rule holds that it is permissible to cause harm as a foreseen side-effect of a good action, but impermissible to cause harm as a *means* to that good action.
  *   **What it eliminates:**
      *   **Act Utilitarianism:** Eliminated by Cases 2, 4, and 7. A utilitarian would save the five in every instance regardless of mechanics.
      *   **Absolute Sanctity of Life (No Killing):** Eliminated by Cases 1, 5, and 8. Marta permits actions that foreseeably cause death.
      *   **Simple Doing/Allowing Distinction:** Eliminated by Cases 1, 6, and 8. In all three, Marta performs an active deed (flipping, unplugging, switching off) that causes death, yet rules them permissible. A strict "killing vs. letting die" rule would forbid these active interventions.
      *   **Direct Physical Contact:** Eliminated by Case 3. The trapdoor is remote; she doesn't touch the man. Yet it is impermissible, just like the shoving in Case 2. This suggests physical contact is not the moral trigger; causal role is.

  **Candidate 2: The Pre-Existing Threat Principle (Redirecting Existing Threats)**
  This rule holds that it is permissible to *redirect* a lethal threat that already exists independently of the agent, but impermissible to *create* a new lethal causal chain to save others (unless that action is merely withdrawing aid).
  *   **What it eliminates:**
      *   **Act Utilitarianism:** (Same as above).
      *   **General "New Threat" Prohibition:** Eliminated by Case 1. Flipping the switch creates a risk for the one on the side track who was previously safe. However, the *lethal agent* (the trolley) was already in motion. This rule distinguishes between *redirecting* a threat vs. *originating* one.
      *   **Pure Intention-Based Rules:** Eliminated by Case 4 (The Loop). In the Loop case, the agent may not "intend" the death in a psychological sense, but the death is structurally required to stop the trolley. Marta rules this impermissible, suggesting the *causal structure* matters more than the mental state.

  **Why these two?**
  Both rules fit all eight precedents.
  *   **Case 1 (Switch):** Side-effect (DDE) + Redirecting Existing Threat (PET). **Permissible.**
  *   **Case 2 (Fat Man):** Means (DDE) + Using Person as Obstacle (PET). **Impermissible.**
  *   **Case 4 (Loop):** Means (DDE) + Victim stops threat (PET). **Impermissible.**
  *   **Case 7 (Organs):** Means (DDE) + New Lethal Agent/Surgery (PET). **Impermissible.**
  *   **Case 8 (Ventilator):** Side-effect/Withdrawing Aid (DDE) + Removing Barrier to Natural Threat (PET). **Permissible.**

  The divergence arises when an action produces a death as a *side-effect* (satisfying DDE) but involves a *new lethal agent* (violating PET).

