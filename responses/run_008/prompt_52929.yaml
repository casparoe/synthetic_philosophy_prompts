answer: |-
  **MEMORANDUM**

  **TO:** Disability Services Board Allocations Panel
  **FROM:** Panel Member
  **DATE:** Wednesday
  **SUBJECT:** Recommendation on Allocation Policy

  **1. Recommendation**
  I recommend adopting a hybrid model based on Option 3 (Threshold Funding), structured as a "Basic Capability Floor" with a cost-equity cap. Our mandate is to ensure all recipients can perform essential daily activities within their homes, not to equalize grants (Option 1) or maximize happiness (Option 2). However, because our budget is fixed, we cannot fund unlimited costs for single applicants. We will fund modifications required to reach a user-defined threshold of basic functioning (entry, hygiene, nutrition), subject to a maximum cost limit per household. This balances the moral imperative of need against the practical imperative of breadth, ensuring we do not exhaust the budget on complex cases while leaving others with nothing.

  **2. The Three Proposals Assessed**
  Each option proposes a different metric for equality. Option 1 equalizes resources, treating every applicant identically. Its virtue is procedural justice; no one is judged "more disabled" than another. However, it fails substantive equity. A flat grant might fully fund a ramp for one applicant but cover only 10% of a stairlift for another, leaving the latter effectively unfunded. It ignores the variance in conversion factors between money and capability, privileging those with cheaper needs.

  Option 2 equalizes welfare outcomes. It seeks the greatest aggregate gain in life satisfaction. While efficient, it relies on subjective metrics vulnerable to "adapted preferences." The housebound applicant who reports high satisfaction may have lowered expectations to cope with deprivation; denying her funds because she copes well punishes resilience. Furthermore, it risks instrumentalizing identity, valuing modifications only insofar as they produce measurable happiness rather than respecting rights. It treats disability services as a utility maximization problem rather than a justice obligation.

  Option 3 equalizes capability. It focuses on what people are actually able to do and be. This aligns best with disability justice, prioritizing independence over happiness or uniform grants. It correctly identifies that the budget should equalize access to basic functioning, not dollars or feelings. However, without cost controls, it risks budget exhaustion on outliers (like Ms. Álvarez), reducing the total number of people helped. It also risks imposing a normative view of "functioning," which triggers the Deaf association's concern about deficit modeling. The hybrid approach retains the capability focus but adds a cost cap to ensure broad coverage and requires user-defined activity goals to mitigate paternalism.

  **3. The Strongest Case for the Option I Am Rejecting**
  The strongest moral argument belongs to Option 1, the status quo. Its champion argues that needs-assessment is inherently paternalistic and demeaning. When the state assesses "need," it inevitably ranks impairments, deciding whose mobility is worth more than whose communication. A flat grant respects applicants as equals, acknowledging that we cannot objectively compare the severity of different lived experiences. It avoids the humiliation of proving one's inadequacy to a panel. Moreover, it prevents the bureaucracy from making errors in judging what constitutes "basic" functioning. By giving everyone the same tool, we acknowledge shared citizenship without dissecting individual tragedy. The lottery, while blunt, is honest about scarcity, whereas needs-assessment masks rationing behind technical criteria. This approach preserves dignity by refusing to quantify the worth of a disabled life.

  **4. Policy Language and Hard Cases**
  To implement the Hybrid Threshold model, we adopt the following rules:

  1.  **Access Plans:** Applicants identify three essential activities they cannot currently perform. Funding covers modifications to enable these.
  2.  **Cost Cap:** Grants are capped at 200% of the average annual award.
  3.  **Secondary Pool:** Costs exceeding the cap enter a secondary lottery for remaining funds.

  **Hard Cases:**
  *   **Ms. Álvarez:** She receives funding up to the cap. The remaining cost is eligible for the secondary pool. If unfunded, she receives the cap amount to partially mitigate the barrier.
  *   **Mr. Ostrowski:** "Nutrition preparation" is a basic activity. We fund adaptations enabling safe cooking, but not professional-grade enhancements. His request is capped at the standard limit; identity-based claims beyond basic function are acknowledged but unfunded under this budget.
  *   **Satisfied-but-Housebound:** Eligibility is based on physical barriers, not survey scores. Her reported satisfaction is irrelevant; the inability to leave independently constitutes a failure of capability requiring intervention.

  **Deaf Association Response:**
  We will replace the "functioning checklist" with an "Access Plan." Modifications are not framed as correcting deficits but as enabling chosen communication methods. If an applicant rejects this framing, we will respect their wish to decline funding without penalty. This ensures we support access without pathologizing difference.
