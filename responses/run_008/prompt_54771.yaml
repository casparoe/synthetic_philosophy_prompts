answer: |-
  This is a fantastic question that cuts right to the bone of pragmatics, ethics, and social ontology. You have identified a specific category of speech act that breaks the standard "truth vs. lie" binary.

  There isn't one single word that captures every nuance you described, but there is a precise philosophical term for the logical structure, a linguistic term for the mechanism, and a cultural term for the specific Japanese context you mentioned.

  Here is the carving you are looking for.

  ### 1. The Philosophical Label: "Bald-Faced Lie"
  In contemporary philosophy of language (specifically in the work of philosophers like **Roy Sorensen** and **Kenneth Einar Himma**), this is often classified as a **Bald-Faced Lie**.

  Standard definitions of lying require an **intent to deceive**. If I tell you something false but I *don't* want you to believe it (and I know you won't), traditional definitions struggle to categorize it.
  *   **White Lie:** Intent to deceive + Benevolent motive. (You believe the false thing).
  *   **Bald-Faced Lie:** No intent to deceive + Known falsity. (Nobody believes the false thing).

  **The Carving:**
  The "bald-faced lie" is distinct because it is a **coordination device**, not an information-transfer device.
  *   **White Lie:** Creates *epistemic asymmetry* (I know X, you believe Y).
  *   **Bald-Faced Lie:** Relies on *epistemic alignment* (We both know X, but we publicly assert Y).

  This answers your ethical hunch: The harm/benefit analysis of white lies focuses on the *listener's belief state*. The harm/benefit analysis of bald-faced lies focuses on the *social frame*. If you make a bald-faced lie sincere ("I never want to see you again"), you haven't improved the truth value; you have broken the ritual frame, causing social damage.

  ### 2. The Linguistic Mechanism: "Flouting the Maxim of Quality"
  You asked how this differs from an idiom. The difference is **semantic** vs. **pragmatic**.
  *   **Idiom:** "Kick the bucket." The words *lose* their literal meaning. "Bucket" does not refer to a bucket.
  *   **Your Examples:** "That is difficult." The words *keep* their literal meaning. It *is* difficult. But the meaning is derived from context.

  In Gricean Pragmatics, this is called **Flouting the Maxim of Quality**.
  Paul Grice proposed that conversation relies on a Cooperative Principle. One rule (Maxim) is "Do not say what you believe to be false."
  *   When you say "Let's get dinner sometime" with no intent to do so, you are visibly **flouting** that maxim.
  *   Because the listener assumes you are still being *cooperative* overall, they infer that you must mean something else (a **Conversational Implicature**).
  *   The "meaning" isn't in the words; it's in the shared recognition that the words are inappropriate for a literal request.

  ### 3. The Anthropological Label: "Phatic Communion"
  For the "Great to meet you" / "Let's have lunch" examples, the term is **Phatic Expression** (coined by Bronisław Malinowski).
  *   **Function:** To establish or maintain social relationships, not to convey information.
  *   **Truth Condition:** Irrelevant.
  *   **Example:** "How are you?" "Fine." (Neither party cares about the medical/psychological state).

  Your Japanese example is slightly different because it conveys a decision (No), whereas phatic talk conveys only connection. However, they belong to the same family of **Ritualized Insincerity**.

  ### 4. The Cultural Specific: *Tatemae* vs. *Honne*
  Since you mentioned Japan, you likely know this, but it is the precise cultural carving of this phenomenon.
  *   **Honne:** Your true feeling/desire.
  *   **Tatemae:** The public face/behavior required by the situation.
  *   **The Crucial Point:** In Western ethics, *Tatemae* is often viewed as "hypocrisy." In Japanese social ontology, *Tatemae* is viewed as **social lubricant**. It is not a failure of honesty; it is a success of *consideration*. To force your *Honne* on the group is considered selfish, not "authentic."

  ### 5. Addressing Your Edge Cases

  **"What happens with someone like me circa my first year in Japan?"**
  This is the most philosophically interesting part.
  *   **Did the utterance change?** No.
  *   **Did the listener change?** Yes.
  *   **Were you lied to?** Technically, **yes**.

  In speech act theory, this relies on **Common Ground** (a concept developed by Robert Stalnaker). A speech act only functions correctly if the participants share certain presuppositions.
  *   **Year 1:** You lack the Common Ground. The speaker says "It is difficult." You process it as a Statement of Fact. You are deceived. For you, it functions as a **Misleading Truth** (literally true, pragmatically misleading).
  *   **Year 5:** You share the Common Ground. The speaker says "It is difficult." You process it as a Refusal. You are not deceived. It functions as a **Bald-Faced Lie**.

  So, the *category* of the speech act is actually relative to the competence of the audience. This is why cross-cultural business fails: The Japanese speaker thinks they are engaging in a cooperative ritual (Bald-Faced Lie); the Dutch speaker thinks they are receiving a technical problem statement (Literal Truth).

  **"Does this break the usual framing of white lies?"**
  Yes, completely.
  The standard ethical debate (Kant vs. Utilitarians) assumes the moral weight lies in **Epistemic Contamination** (polluting the listener's mind with falsehood).
  *   **White Lie:** Contaminates the mind to spare feelings.
  *   **Your Category:** Preserves the mind's accuracy (everyone knows the truth) but contaminates the **Public Record**.

  The ethical justification here isn't "I protected them from the truth." It is "I protected the **interaction** from the friction of the truth."
  If you say "I don't want to have dinner with you," you have made the rejection the *focus* of the interaction.
  If you say "Let's have dinner sometime," you have made the *closure* the focus.
  The "lie" is a tool to shift the focus from **Content** (do I like you?) to **Process** (we are ending this talk smoothly).

  ### Summary Terminology
  If you need to search for literature on this, use these three terms in combination:
  1.  **Bald-Faced Lies** (Philosophy/Ethics)
  2.  **Conversational Implicature / Flouting Quality** (Linguistics)
  3.  **Phatic Communion** (Anthropology/Sociology)

  If you want to coin a phrase for your own use that captures the "insincerity as a feature" aspect, **"Ritualized Non-Deceptive Falsehood"** is accurate, but **"Cooperative Insincerity"** might capture the spirit better. It is insincere, but it is the highest form of cooperation in that specific social context.

  **The Verdict:** You are describing **Bald-Faced Lies** functioning as **Phatic Rituals**. They are not lies in the moral sense because they do not violate the listener's autonomy to know the truth; the truth is encoded in the subtext, accessible to anyone competent in the code. The "deception" is only for the benefit of the *record*, not the *mind*.
