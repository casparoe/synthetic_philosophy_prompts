          *   **Tractability:** 15 pages is enough to argue for the reality of FFRs (Q1) and then address the "adaptationist critique" (Q2). These two naturally flow into each other.
          *   **Argumentative Potential:** Q1 allows a metaphysical stance (Realism vs. Instrumentalism). Q2 allows a methodological stance (How to test for FFRs). Together, they form a coherent narrative: "FFRs are real (Q1), but we need strict criteria to identify them so we don't see them where they aren't (Q2)."
          *   **Dennett Focus:** Dennett's core project in *Darwin's Dangerous Idea* and related papers hinges on these two points. Tackling them honors the source material best.

  6.  **Drafting the Defense (Iterative Process):**
