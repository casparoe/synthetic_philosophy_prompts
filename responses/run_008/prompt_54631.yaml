      *   *Argument for Q2 (Error/Spandrels):* This is the natural counter-move to Q1. If you say they are real, the critic says "What about spandrels?" Addressing this shows critical engagement, not just exegesis.
      *   *Why not Q3?* Too much Cog Sci/Teleosemantics. Risk of getting bogged down in "content" debates (Fodor vs. Millikan) which distracts from FFRs specifically.
