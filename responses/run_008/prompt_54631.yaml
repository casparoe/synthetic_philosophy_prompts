      *   **Goal:** Needs prioritization and *defense* of the ordering (upstream/downstream relationships, tractability, argumentative potential vs. literature survey).
      *   **Topic:** FFRs are reasons for patterns (adaptations) that exist without anyone thinking them (e.g., why eyes are shaped that way).

  2.  **Analyze the Five Candidate Questions:**
      *   *Q1 (Ontology):* Are FFRs real reasons or just projected patterns? (Metaphysical/Interpretive).
      *   *Q2 (Epistemology/Methodology):* Can FFRs be false/missing? Distinguishing adaptation from spandrel/byproduct. (Methodological/Empirical).
      *   *Q3 (Content/Mental Representation):* Relation to teleosemantics/grounding content. Does selection history carry content without representation? (Cognitive Science heavy).
      *   *Q4 (Culture):* Cultural practices having FFRs beyond individual intentions. (Social Science/Application).
      *   *Q5 (AI/Neural Nets):* Uninterpretable systems as FFRs. (Contemporary/Tech application).

  3.  **Evaluate Constraints & Strengths:**
      *   *Length:* 15 pages is short for a graduate seminar paper. It allows for one solid argument or two tightly linked points. It does *not* allow for broad surveys.
      *   *Background:* Strong Evo Bio, weak Cog Sci. This is crucial. Q3 is heavy Cog Sci/Philosophy of Mind. Q1 and Q2 are heavy Evo Bio/Philosophy of Biology. Q4 is Social Science/Anthro. Q5 is AI/Cog Sci.
      *   *Argumentative Potential:* The prompt asks to "make an actual argument rather than report on one." This means avoiding questions that are purely "Here's what Dennett said, here's what Fodor said." It needs a thesis.

  4.  **Determine "Upstream" vs. "Downstream":**
      *   *Upstream:* Questions that establish the validity or nature of the concept itself. If FFRs aren't real (Q1), or if we can't identify them reliably (Q2), then applying them to culture (Q4) or AI (Q5) or content (Q3) is shaky.
      *   *Downstream:* Applications of the concept once established. Q3, Q4, and Q5 assume FFRs exist and ask where else they apply.
      *   *Conclusion:* Q1 and Q2 are the foundational/Upstream questions. Q3, Q4, Q5 are Downstream/Applicative.

  5.  **Select the Top Two:**
      *   *Selection:* **Q1 and Q2.**
      *   *Reasoning:*
