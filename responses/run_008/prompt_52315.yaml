answer: |-
  # The "What Did Aristotle Actually Think?" Diagnostic Quiz

  **Instructions for Students:**
  Read each scenario below. Choose the response that best matches your intuition about what is *fair* or *true* in the situation. Do not worry about what Aristotle "should" have said; answer based on what you think makes the most sense of the texts we are about to read. There are no right or wrong answers.

  **1. The Slow Builder**
  Two builders construct identical houses for two different citizens. Builder A finishes in six months. Builder B is clumsy and takes two years. Both houses are equally sturdy.
  *   **A.** Builder B should be paid more, because he invested more of his life and labor.
  *   **B.** They should be paid the same, because the citizens received the same benefit.
  *   **C.** Builder B should be paid less, because he wasted the city's resources and time.

  **2. The State's Stamp**
  A tyrant debases the currency, mixing copper into the silver coins but stamping them with the same face value. A merchant refuses to accept them at the old rate.
  *   **A.** The merchant is wrong; the value is in the stamp, not the metal.
  *   **B.** The merchant is right; the coin must represent something real to be a measure.
  *   **C.** It doesn't matter; the real issue is whether the tyrant uses the money to help or harm the household.

  **3. The Grain Merchant**
  A merchant buys grain in a surplus city where it is cheap and transports it to a famine city where it is expensive. He charges the high price, tells no lies, and harms no one by force.
  *   **A.** This is just trade; the price is set by the agreement.
  *   **B.** This is unjust; he is profiting from the neighbors' need rather than supplying a need.
  *   **C.** This is acceptable only if he uses the profit to support his own household, not to get richer indefinitely.

  **4. The Shoemaker's Demand**
  A shoemaker says, "I will not trade shoes for your wheat unless you give me five times the market rate, because I *need* the wheat more than you need the shoes."
  *   **A.** He is entitled to set whatever price he can get; need is subjective.
  *   **B.** He is wrong; the price should reflect the work, not his personal desperation.
  *   **C.** He is wrong; exchange exists to satisfy mutual need, not to exploit it.

  **5. The Hoarder**
  An old farmer sells his surplus olives for coins, then locks the coins in a chest and never spends them. He dies with a room full of metal.
  *   **A.** This is his property; if he wants to store value, that is his choice.
  *   **B.** This is irrational; money is meant to circulate to facilitate exchange.
  *   **C.** This is vicious; he has treated a means (money) as an end (wealth).

  **6. The House and the Shoe**
  Aristotle says a house must be "equal" to a certain number of shoes to be exchanged.
  *   **A.** They are never truly equal; we just pretend they are to make trade happen.
  *   **B.** They are truly equal because they both satisfy human needs to a comparable degree.
  *   **C.** They are equal because the builder and shoemaker are equal citizens.

  **7. The Interest Loan**
  A lender gives 100 coins to a farmer and demands 110 back at harvest.
  *   **A.** This is fair; the farmer had the use of the money for a year.
  *   **B.** This is unfair; money cannot breed money, only labor can.
  *   **C.** This is unnatural; it turns a tool for exchange into a tool for accumulation.

  **8. The Rich Buyer**
  A wealthy man and a poor man both buy bread from the same baker. The bread is identical.
  *   **A.** The wealthy man should pay more, because the coin means less to him.
  *   **B.** They should pay the same, because the bread satisfies the same need.
  *   **C.** The baker should sell to the poor man first, regardless of price.

  **9. The Purpose of Trade**
  Why do we have a marketplace at all?
  *   **A.** To allow individuals to maximize their own wealth.
  *   **B.** To ensure that different craftspeople can survive and contribute to the city.
  *   **C.** To allow households to get what they lack without having to produce everything.

  **10. The "Just Price"**
  Is there such a thing as a "just price" for a chair, independent of what the buyer and seller agree on?
  *   **A.** No, the agreement makes the price just.
  *   **B.** Yes, the price must match the labor required to make the chair.
  *   **C.** Yes, the price must maintain the long-term partnership between the carpenter and the community.

  ***

  # Instructor's Scoring Key & Interpretive Map

  **Scoring Instructions:**
  Tally the responses for each student. There is no strict point system, but look for the **dominant pattern** below. Most students will cluster around one of the six "Leaves."

  ### Leaf 1: The Conventionalist
  *   **Pattern:** Mostly **A** on Q2, Q4, Q6, Q10.
  *   **Interpretation:** Money is a token (*nomisma*) agreed upon by convention. Commensurability is a useful fiction we agree to so trade can happen. There is no "real" value behind the coin other than state guarantee or mutual consent.
  *   **Awkward Commitment:** You must admit that if the State stamps a leaf and says "this is a dollar," it *is* a dollar, even if it buys nothing.
  *   **Textual Anchor:** *NE* V.5 on money existing by convention (*nomos*) rather than nature.

  ### Leaf 2: The Realist (Need-Based)
  *   **Pattern:** Mostly **B** on Q2, Q4, Q6, Q8.
  *   **Interpretation:** Money measures something real: human need (*chreia*). Commensurability is grounded in the fact that we all need things. Value is discovered, not invented.
  *   **Awkward Commitment:** You must accept that if a rich man needs a toothpick less than a poor man needs bread, the toothpick is objectively "worth less" in the cosmic order, regardless of market price.
  *   **Textual Anchor:** *NE* V.5: "In truth, it is demand (*chreia*) that holds things together."

  ### Leaf 3: The Proto-Labor Theorist (Your Co-Tutor's View)
  *   **Pattern:** Mostly **A** on Q1, **B** on Q7, **B** on Q10.
  *   **Interpretation:** Value is derived from the effort or time embodied in the production. Exchange is an exchange of labor efforts.
  *   **Awkward Commitment:** You must reward inefficiency; the clumsier builder (Q1) deserves *more* compensation because he suffered more labor, even if the product is identical.
  *   **Textual Anchor:** Reading the "builder and shoemaker" ratio as a ratio of work-time rather than social status or need.

  ### Leaf 4: The Political Bond Theorist
  *   **Pattern:** Mostly **C** on Q1, Q9, Q10; **B** on Q4.
  *   **Interpretation:** The point of exchange is not price accuracy, but sustaining the association (*koinōnia*) between citizens. Equality is moral reciprocity, not mathematical equivalence.
  *   **Awkward Commitment:** You must accept that market prices should be overridden by the state if they threaten the stability of the partnership between craftspeople.
  *   **Textual Anchor:** *NE* V.5: "Reciprocity holds the city together."

  ### Leaf 5: The Ethical Teleologist (*Oikonomia* vs. *Chrematistikē*)
  *   **Pattern:** Mostly **C** on Q3, Q5, Q7.
  *   **Interpretation:** The distinction isn't about how prices are set, but about the *purpose* of the actor. Natural wealth-getting (for the household) is virtuous; unlimited accumulation is vicious.
  *   **Awkward Commitment:** You must condemn a merchant who makes a profit honestly but has no intention of stopping, even if his goods are useful.
  *   **Textual Anchor:** *Politics* I.8-10 on the limit of wealth being the good life, not infinite coin.

  ### Leaf 6: The "Bad Fit" (Anachronism Alert)
  *   **Pattern:** Mixed/Inconsistent, or selecting options that reject the premises (e.g., "The question assumes value exists, Aristotle denies it").
  *   **Interpretation:** Aristotle is not doing economics; he is doing ethics. Applying "theory of value" to him is a category error. He is describing how a virtuous agent *feels* about exchange, not how exchange *works*.
  *   **Awkward Commitment:** You must admit that Aristotle has nothing useful to say to a modern economist about price formation.
  *   **Textual Anchor:** The sheer ambiguity of *chreia* (need/use/demand) suggests he isn't trying to be precise.

  ***

  ### ⚠️ Indistinguishable Leaves
  **The Political Bond Theorist (Leaf 4) and The Ethical Teleologist (Leaf 5).**
  *   **Why:** In a quiz of concrete cases, these two positions often prescribe the same action (e.g., "Don't hoard," "Don't exploit need"). The *reason* differs (one is about social stability, the other about the soul's virtue), but the scoring key cannot separate them based on these scenarios alone. You will need to ask follow-up "Why?" questions in class to distinguish them.

  ***

  # Closing Note: Where the Key Might Misfire

  **The *Chreia* Problem (Need vs. Demand vs. Use)**
  The scoring key assumes we can separate "Need-Based Realism" (Leaf 2) from "Political Bond" (Leaf 4). However, this turns entirely on the translation of *chreia* in *NE* V.5.
  *   **If *chreia* means "Demand":** Leaf 2 looks like a proto-subjective value theory (Leaf 1 bleeds in).
  *   **If *chreia* means "Social Necessity":** Leaf 2 collapses into Leaf 4 (Political Bond).
  *   **Redesign Trigger:** If your class consensus lands heavily on Leaf 2, but they argue that *chreia* is purely subjective (what I happen to want), you must redesign the key. That reading makes Aristotle a Conventionalist (Leaf 1), not a Realist. The key assumes *chreia* is an objective social fact; if the text supports *chreia* as individual whim, Leaf 2 is philosophically empty.

  **The Labor Theory Trap (Leaf 3)**
  Your co-tutor's view (Leaf 3) is the most fragile. The text never explicitly mentions "hours worked." It mentions the *builder* and the *shoemaker* (the agents), not the *building* and the *shoes* (the labor time).
  *   **Redesign Trigger:** If students point out that Aristotle equalizes the *persons* ("the builder must be to the shoemaker as the shoes are to the house"), Leaf 3 collapses. If the ratio is about *status* or *citizenship* rather than labor input, Leaf 3 is anachronistic. If you find the class unanimously rejecting Q1-A (rewarding the slow builder) as "obviously wrong," you may need to retire Leaf 3 as a viable reading of *this* text, even if it matches modern intuitions about fairness.

  **The "Bad Fit" Safety Valve**
  Be careful with Leaf 6. It is tempting for students to choose "Aristotle is confused" whenever the text is hard. Use this leaf only if they consistently reject the *premises* of the questions (e.g., denying that exchange requires equality at all). If they try to answer the cases seriously, they belong in Leaves 1–5.
