      *   *Why?* Because the laboratory uses instruments (spectroscopy, microscopy) that extend human perception. The certificate is a proxy for that instrumental perception.
      *   *Condition:* Trust is not blind; it is based on the *institutional reliability* and the *cost of reputation*. If the lab lies, they lose their business. This creates a warrant for belief.

  5.  **Formulate the Recommendation (What to do about the stone):**
