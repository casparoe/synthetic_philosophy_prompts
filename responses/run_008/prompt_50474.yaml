answer: |-
  Here is the straight answer you asked for.

  **1. The Step to Reject: Step 1 (The Transmission Principle)**
  You need to reject your roommate's first premise: *"When a belief is justified by other beliefs, the justification has to come from those beliefs — it's transmitted... and nothing transmits what it doesn't itself have."*

  This premise treats justification like a conserved physical substance (money, momentum, water) that must be originated at a source before it can flow. This is a category mistake. In contemporary epistemology, justification is better understood as a **relational property** (like probabilistic support or coherence) rather than a substance that gets passed along. Belief B1 can raise the probability of B2 without B1 needing to possess a "stock" of justification to hand over.

  **2. The Cost of Rejecting It**
  The cost is that you lose the intuitive "bucket brigade" model of knowledge. You can no longer say that justification *starts* somewhere and moves. Instead, you have to accept that justification can be **emergent** or **structural**. It arises from the relationships between beliefs, not merely from a lineage. This makes the architecture of knowledge more complex to map because you can't just trace a line back to a "source"; you have to analyze the network of support. It also forces your roommate to admit that her Step 5 (basic beliefs) isn't a unique exception to a universal rule, but rather evidence that the universal rule (Step 1) was false to begin with.

  **3. The Verdict: Infinitism Dies**
  Even after fixing the argument by rejecting Step 1, **infinitism still dies.**

  Your roommate's argument (the "IOU" objection) is indeed flawed because it relies on the false Transmission Principle. If you reject Step 1, the "infinite IOU" charge doesn't stick; an infinite chain *could* theoretically provide justification if each link contributes probabilistic support (as you pointed out, the infinitist *is* allowed to say every link generates support).

  However, infinitism fails for an **independent reason**: **The Cognitive Limit Objection.**

  Justification isn't just about whether a chain *could* exist abstractly; it's about whether a knower can *access* it. For a belief to be justified for a human agent, the reasons supporting it must be cognitively available. An infinite chain requires an infinite number of links to be traversed or held in mind (even dispositionally) to fully justify the target belief. Human minds are finite. We cannot traverse an infinite series, nor can we hold an infinite number of propositions in our cognitive grasp.

  Therefore, while your roommate's specific *argument* against infinitism was botched (due to Step 1), her *conclusion* is correct. Infinitism is untenable not because justification can't flow without a start, but because **finite beings cannot complete an infinite task.** Foundationalism (or a form of coherentism that avoids linear regress) survives because it posits a structure of justification that is completable by a finite mind.

  **Summary:**
  *   **Reject:** Step 1 (Justification is not transmissive substance).
  *   **Cost:** Loss of the simple "source" intuition; justification becomes structural/relational.
  *   **Verdict:** Infinitism dies.
  *   **Reason:** The Cognitive Limit (finite minds cannot traverse infinite chains).
