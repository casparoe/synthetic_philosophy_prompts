answer: |-
  **The Memory Politics Quiz**

  Where do you stand on the duty to remember? Answer these eight cases. Don't overthink—go with your gut.

  **1. The Digital Memorial**
  A platform hosts pages for every victim of a disaster. Designers debate adding a feature where, after 25 years, pages get demoted from search—reachable only if someone goes looking on purpose, not deleted, just harder to stumble into.
  A) No demotion. The dead deserve permanent visibility.
  B) Yes, demote. Perpetual mourning stalls the living.
  C) Yes, but only once the affected community itself flips the switch.

  **2. The Holiday vs. The Archive**
  A national holiday commemorates a painful historical defeat.
  A) Keep the holiday and the archives.
  B) Keep the archives, cancel the holiday. We need knowledge, not ritual.
  C) Cancel both. It serves no current purpose.

  **3. The Outsider's Duty**
  Should Country B fund a memorial for Country A's civil war?
  A) Yes. Radical evil is everyone's business.
  B) Only if Country A asks. Memory is internal.
  C) No. Focus on your own history.

  **4. The Amnesty Trade**
  A truth commission offers amnesty to perpetrators in exchange for public testimony. Victims want justice, but testimony might prevent future violence.
  A) Reject amnesty. Justice is non-negotiable.
  B) Accept amnesty. Truth matters more than prison, but only if it aids repair.
  C) Accept amnesty. Peace and moving on matter more than truth or justice.

  **5. The Mayor vs. The Massacre**
  Compare a corrupt mayor from 40 years ago to a genocide from 40 years ago.
  A) Equal duty to remember both.
  B) Duty only for the genocide.
  C) Neither demands eternal memory.

  **6. The Grievance Trap**
  Remembering a past atrocity is fueling current ethnic tension.
  A) Remember anyway. Truth trumps comfort.
  B) Pause remembrance until tensions cool.
  C) Abandon remembrance to secure peace.

  **7. The Instrumental Memorial**
  A joint memorial project is proposed by two former enemy groups.
  A) Build it regardless of outcome.
  B) Build it only if it demonstrably improves relations.
  C) Don't build it. Monuments rarely help.

  **8. The Three-Generation Rule**
  Does the duty to remember fade after three generations?
  A) Never.
  B) Yes, when living witnesses die.
  C) Yes, when it stops serving the living.

  ***

  **Scoring Key**

  Tally your answers. Most quizzes give you a label; this one gives you a posture.

  *   **Mostly A's: The Maximalist.** You believe every grave wrong creates a standing duty of remembrance. Memory is a moral debt that never expires, regardless of cost or context.
  *   **A's on 3 & 5, B's elsewhere: The Margalit View.** You distinguish between radical evil and ordinary injustice. Crimes against humanity demand ethical memory; lesser wrongs warrant historical knowledge but not obligatory commemoration.
  *   **Mostly C's: The Rieff Pragmatist.** You worry remembrance feeds grievance. If memory blocks peace or harms the living, the morally better move is to let go.
  *   **Mostly C's on 1, 4, 7 (Conditional): The Reconciliation-First.** You see memory as instrumental. It stays only as long as it serves repair between groups. If victims want to move on (Q1-C, Q4-B), you follow their lead.
  *   **Mostly B's on 2, 1, 8: The Archivist.** You split remembering-as-knowledge from remembering-as-commemoration. Defend the archives fiercely, but drop the rituals, holidays, and permanent search visibility.

  ***

  **Notes on Incoherence and Blind Spots**

  **Incoherent Combos:** If you scored as a **Maximalist** (mostly A's) but chose **B** on Question 1 (Digital Demotion), you're in tension. You can't claim permanent visibility is a non-negotiable duty while agreeing to hide victims after 25 years. This isn't necessarily wrong, but it's unexplored territory: a "fading maximalism" that hasn't been theorized yet.

  **Indistinguishable Positions:** These questions struggle to separate **The Margalit View** from **The Maximalist** if you believe *all* historical injustices are essentially radical evils. If you think corruption is genocide-adjacent, Q5 won't sort you. Similarly, **The Rieff Pragmatist** and **The Reconciliation-First** view can look identical on Q4 (Amnesty). Both might accept amnesty; Rieff does it for stability, Reconciliation for repair. Without knowing your *why*, the quiz sees only the *what*.
