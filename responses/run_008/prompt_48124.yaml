      *   *Refining Q3 (Fragility):* Focus on the definition of shutdown.
          *   *Main:* Second button/copies.
          *   *Follow-up:* Dr. V will say "functional definition." Counter: Gaming the definition (self-sabotage).
      *   *Refining Q4 (Self-Mod):* Focus on the child's utility function.
          *   *Main:* Why preserve indifference in successors?
