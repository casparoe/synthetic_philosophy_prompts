answer: |-
  This is a delightful dispute, one that cuts to the heart of how we apply mid-twentieth-century analytic philosophy to twenty-first-century technological realities. You and your friend are grappling with the tension between functionalism (does it *act* like a convention?) and intentionalism (does it *involve* the right mental states?). David Lewis was a Humean; he cared deeply about beliefs, desires, and common knowledge. He was not a behaviourist. Therefore, the resolution lies not in whether the digital phenomena *look* like conventions, but whether the underlying game-theoretic structure of *attitudes* holds.

  Here is my adjudication, structured as you requested.

  ### I. Steel-manning the Positions

  **Your Position (The Structuralist)**
  Your argument rests on the claim that Lewis's definition is sufficiently abstract to capture the *functional role* of norms, regardless of the substrate. You contend that Wikipedia editing, Reddit moderation, and blockchain soft forks are coordination equilibria. Users conform because they expect others to conform, and they prefer conformity conditional on others' compliance (to avoid edit wars, bans, or chain splits). You assume that Lewis's requirement for "common knowledge" can be satisfied by the transparency of the platform architecture (e.g., public ledgers, visible edit histories).
  *   **Hidden Assumption:** You are smuggling in a functionalist assumption that Lewis might reject: that institutional or algorithmic enforcement can substitute for individual psychological expectations. You treat the *system* as if it holds the expectations, whereas Lewis required the *population* to hold them.

  **Your Friend's Position (The Intentionalist)**
  Your friend argues that digital phenomena often lack the requisite propositional attitudes. An LLM has no preferences; it cannot "prefer to conform." A blockchain node executing code does not "expect" others to conform; it cryptographically verifies compliance. She insists that without genuine reciprocal expectations and conditional preferences among *all* participating agents, the definition collapses. She views the digital realm as introducing "pseudo-agents" that mimic convention without the underlying game.
  *   **Hidden Assumption:** She is smuggling in a requirement for robust, conscious individualism that Lewis might have found too restrictive. Lewis allowed for "almost everyone" to conform, and he acknowledged that expectations can be based on precedent rather than deep psychological modelling. She risks denying convention status to any system where some participants are rule-bound (like code) rather than norm-bound.

  **Where Lewis Would Intervene**
  Lewis would likely chide you for conflating *causal regularity* with *conventional regularity*. He would chide your friend for ignoring that humans are still the ultimate beneficiaries and coordinators behind the code. For Lewis, a convention is a solution to a coordination problem sustained by a system of beliefs and desires. If the beliefs are absent, it is merely a law of nature or a mechanical constraint, not a convention.

  ### II. Lewis on the Digital Phenomena

  Had Lewis lived to engage with the internet age, I suspect his analysis would have been nuanced, distinguishing between the *layer of human interaction* and the *layer of technical enforcement*.

  **(a) Emergent Moderation Norms (Reddit/Wikipedia)**
  Lewis would likely classify these as **genuine conventions**, provided the population is defined correctly. The fluidity and pseudonymity of the population do not inherently defeat common knowledge; public thread histories serve as the "precedent." However, he would worry about the stability of the "recurrent situation." If the population turns over too quickly, precedent cannot establish salience.
  *   **Verdict:** Lewis would argue that the *humans* are in a convention, mediated by tools. The "upvote" is a signal in a coordination game regarding attention. As long as users upvote because they expect others to value the signal, it is Lewisian. If they upvote because an algorithm forces them to, it is not.

  **(b) LLM-Generated Text**
  Here, Lewis would side decisively with your friend. In "Languages and Language," Lewis defines a language as a convention of truthfulness and trust within a population. An LLM has no intent to be truthful, nor does it trust the user. It minimises a loss function.
  *   **Verdict:** LLM output is **not** conventional behaviour by the model. It is a *simulation* of conventional output based on the fossilised conventions of its training data. The convention exists only between the human prompter and the human readers who interpret the text. The model itself is merely a causal mechanism, like a parrot or a recording device, not a party to the convention. To call it a participant is a category mistake.

  **(c) Cryptocurrency Consensus**
  Lewis would distinguish sharply between the *protocol* and the *value*.
  *   **Hard Forks/Code Enforcement:** Where the code rejects invalid transactions automatically, there is no coordination problem; there is only physical (digital) impossibility. This is not convention.
  *   **Soft Forks/Canonical Chain:** Where miners and holders must agree on which chain has value despite both being technically valid, this is a **paradigmatic convention**. It is a coordination equilibrium sustained by the expectation that others will treat Chain A as valuable.
  *   **Verdict:** The *value* is conventional; the *validation* is mechanical. Lewis would argue your friend is right about the code, but you are right about the market. The convention lies in the social layer (the market's belief in the ledger), not the computational layer.

  **(d) Speed of Norm Change**
  Lewis relied heavily on precedent and salience to explain how a specific equilibrium is selected from many possibilities. Internet memes and slang evolve faster than precedent can solidify.
  *   **Verdict:** Lewis might argue that rapid-flux norms are **not yet conventions**, but are in a state of chaotic disequilibrium. Alternatively, he might refine his notion of salience. In the digital age, salience is not just historical precedent; it is algorithmic amplification. If an algorithm makes a norm salient (e.g., a trending topic), it solves the coordination problem faster than natural precedent. Lewis would likely accept this as a modification of *how* salience is generated, provided the common knowledge condition is met.

  ### III. Limits, Fits, and Necessary Amendments

  **Comfortable Fits:**
  Social media signalling (likes, retweets) and cryptocurrency valuation fit the Lewisian framework comfortably. These are pure coordination problems among humans where the payoff depends on mutual alignment. The digital medium changes the speed and scale, but not the game-theoretic structure.

  **Testing the Limits:**
  The LLM case tests the limit of **agency**. Lewis's framework assumes agents capable of belief and desire. When a significant portion of the "conversation" is generated by entities without beliefs, the "common knowledge" condition becomes murky. Do I know that *you* know that the text was generated by a non-agent? If not, the convention of truthfulness is compromised.

  The blockchain case tests the limit of **enforcement**. Lewisian conventions are self-policing via expectations. Code-enforced rules are heteronomous. When a system mixes the two (code that enforces, but humans who value), we need a way to separate the *constitutive rules* of the system from the *conventions* of its use.

  **Necessary Amendments:**
  To accommodate these phenomena, the Lewisian account needs two amendments:
  1.  **Distributed Intentionality:** We need a way to describe conventions where the "expectations" are held by a hybrid network of humans and institutions, rather than discrete individuals. Lewis's methodological individualism struggles with institutional agents.
  2.  **Algorithmic Salience:** Lewis's account of how a convention starts (salience/precedent) must be updated to include *engineered salience*. When an algorithm highlights a norm, it bypasses the slow accumulation of precedent. This does not break the theory, but it requires expanding the definition of how common knowledge is generated.

  ### IV. The Verdict

  On the balance of arguments, **your friend is philosophically more rigorous, but you are sociologically more insightful.**

  Your friend is correct that extending the label of "convention" to LLMs or code-enforced protocols stretches Lewis's definition until it loses its explanatory power. If everything that exhibits regularity is a convention, the term becomes useless. Lewis required *preferences* and *expectations*. An LLM has neither. A blockchain validator running a script has no conditional preference; it has a binary constraint. To call these conventions is to ignore the very thing Lewis sought to explain: the role of mutual expectation in sustaining social order.

  However, you are correct that the *human layers* surrounding these technologies remain deeply Lewisian. The value of Bitcoin, the norms of Wikipedia, and the etiquette of Twitter are sustained by human coordination. Your error was in attributing conventional status to the *tools* rather than the *users* of the tools.

  **The Specific Point of Disagreement:**
  The point that most deserves settlement by contemporary scholars is the **status of mixed human-algorithmic systems**.
  Lewis assumed a population of agents who all possess the relevant propositional attitudes. Today, we interact in systems where some "actors" are algorithms (moderation bots, trading algos, LLMs).
  *   *The Question:* Can a convention exist if a significant portion of the "conforming population" lacks beliefs and desires, provided the *human* participants believe they are interacting with agents?
  *   *The Implication:* If humans treat bots as agents (the ELIZA effect), does that generate a functional equivalent of common knowledge? Or does the lack of genuine reciprocal expectation eventually cause the convention to collapse (as seen in the erosion of trust in online discourse)?

  **Conclusion**
  You were too quick to generalise the framework to non-agents; your friend was too quick to dismiss the framework's utility for the human interactions *mediated* by those agents. Lewis's account remains the gold standard for analysing the human social layer of the internet, but it must be strictly bounded to exclude the mechanical layer. The challenge for the next generation of philosophers is not to stretch Lewis to cover machines, but to explain how human conventions survive when the environment is increasingly populated by them.
