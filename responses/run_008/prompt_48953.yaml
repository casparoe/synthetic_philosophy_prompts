          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ *on the condition* that others do (coordination equilibrium).
          4.  There is an alternative regularity $R'$ that could have solved the problem.
          5.  These facts are *common knowledge*.
      *   **Key Nuance:** Lewis was a Humean. He cared about beliefs and desires. He distinguished between *constitutive* rules (like chess) and *regulative* conventions (like driving). Language is a convention to solve the coordination problem of truthfulness and trust.
