  ### Brainstorming the End-Words

  I need six terms that function as both *explanans* (the thing doing the explaining) and *explanandum* (the thing needing explanation).

  *   **God vs. Name:** "God" is too specific; it triggers theological baggage rather than metaphysical structure. "Necessary Being" is too clunky for a line ending. **Name** is better—it captures the act of labeling the mystery (e.g., calling it "God" or "Ground") when explanation fails.
  *   **Nothing vs. Void:** "Nothing" is grammatically difficult as a rhyme/end-word (often an adverb). **Void** works as a substantive noun (the ontological empty set) and fits the "vacuum" concept without being purely physical.
  *   **Cause vs. Law:** "Cause" is too Humean/sequential. The problem here is structural/nomological. **Law** captures the physical laws that vacuum fluctuations presuppose.
  *   **Fact:** Essential for the "brute fact" move.
  *   **Chance:** Essential for contingency/probability arguments.
  *   **Question:** Essential for the "malformed inquiry" move.

  So the set is: **1. Law, 2. Void, 3. Fact, 4. Chance, 5. Name, 6. Question.**

