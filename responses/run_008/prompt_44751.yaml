      *   *Check:* Did I address the "Yu" (sage) claim? Yes, crucial for Xunzi's optimism.
      *   *Check:* Is the third axis robust? This is the trickiest part. I need to ensure I don't just say "Xunzi is wrong." I need to explain *how* Xunzi thinks ritual sticks. It's about the Heart-Mind's (*Xin*) ability to approve of things.
      *   *Check:* British English. "Program" -> "Programme". "Center" -> "Centre". "Labeled" -> "Labelled".

  6.  **Final Polish:**
      *   Ensure the distinction between *xing* (nature) and *wei* (conscious activity/artifice) is clear.
