prompt: |-
  Hi — quick backstory: I'm a journalist, I cover science and ideas, and I've talked myself into a corner on an AI piece I'm writing. I'd like you to take the role of a philosopher of mind who knows the Darwin/Turing material cold but writes for a smart lay reader rather than for other philosophers. And before you answer anything, brainstorm for a few sentences about where my reasoning goes off the rails — I'm fairly sure it does somewhere, but I can't see it myself — and then don't sit on the fence: commit to one position and defend it.

  Here's my situation. Nearly everyone I interview eventually brings up the strange inversion of reasoning, the move Daniel Dennett spent a career popularizing: Darwin explained all the apparent design in nature without any designer, and Turing showed you can get a system that performs brilliantly — computes, plays chess, and now writes prose — while the machinery doing it grasps nothing. Competence without comprehension. Fine, I get it, great story.

  But then I apply the point, and it seems to swollow everything. The whole trick, as I understand it, is that you never need to mention comprehension in order to explain the competence. So where does comprehension ever get back in? If evolution gave us hearts with nobody anywhere knowing what a heart is for, and a language model gives us paragraphs with nothing knowing what a paragraph is for, then when my editor asks the question every reader asks — will AI ever truly understand? — the honest answer looks like: the question is broken, there's no fact of the matter, "understanding" is just a compliment we pay to competence we happen to like. And it can't stop at the machines. By the same logic I don't understand my own articles either, which is fine as philosphy but leaves me with a practical problem: my editor wants a 600-word section currently titled "when will machines really get it?", and I can't tell whether to write it or tell her the heading is incoherent.

  So commit, please. Either (a) tell me understanding is a real distinction that survives the inversion — in which case say where the line sits, what a system has to have that a pure competence-stacker doesn't, and whether current models are on one side of it, the other, or nowhere near it — or (b) tell me the deflationary reading is right, the heading is incoherent, and I should pitch her a different one. Don't give me "some thinkers say X, others say Y," I can get that from any conference panel. And no references or reading lists, I need the argument, not a bibliography. Assume I know the basics of natural selection and of how language models are trained, so you don't have to baby that part.
