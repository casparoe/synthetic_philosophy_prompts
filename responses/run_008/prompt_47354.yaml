answer: |-
  **Brainstorm: Principles and Conflict**

  Deb relies on a **Moral Identity Principle**: standing to blame personally requires a coherence between the blamer's moral history and the norm invoked; significant past violation of that specific norm undermines the authority to express personal moral disgust. Sam relies on a **Normative Authority Principle**: standing derives from a current commitment to the norm and the validity of the norm itself, not the perfection of the blamer; reform restores authority. These principles come into direct conflict at **Move (3)**. Up to that point, they are debating the definition of hypocrisy (concurrent vs. historical). In Move (3), Deb shifts the ground to the *register* of blame (the expression of disgust), arguing that this specific performative act claims a moral purity Marcus's history contradicts, whereas Sam treats the history as irrelevant to the current validity of the judgment.

  ***

  **Adjudication of the Six Moves**

  **(1) Deb: "Marcus's blame is worthless... hypocritical blame is void; Lena is entitled to dismiss it outright."**
  **Rating: Partly Right.**
  Deb is right to identify that hypocrisy undermines the *force* of blame; it gives the addressee a legitimate deflection. However, she is mistaken to claim the blame is "void" or that Lena can dismiss it "outright." The truth of the accusation (that plagiarism occurred) remains independent of the blamer's standing. Hypocrisy compromises the *relationship* and the *moral weight* of the address, not the factual correctness of the sanction. To call it "worthless" conflates the messenger with the message.

  **(2) Sam: "The hypocrisy that disqualifies blame is doing the very thing while blaming it... reformed wrongdoers are often the best blamers."**
  **Rating: Partly Right.**
  Sam correctly identifies that standard hypocrisy usually involves concurrent violation, which Marcus is not committing. His analogy of the ex-smoker is apt for *advice* or *warning*, where the goal is prevention. However, he is mistaken to equate *warning* with *blame*. Blame carries a retrospective moral judgment and an expression of reactive attitude (disgust). An ex-smoker warning a child is helpful; an ex-smoker expressing *moral disgust* at a smoker while hiding their own history is different. Sam conflates the standing to enforce a norm with the standing to express personal moral revulsion.

  **(3) Deb: "She was not talking about his current conduct but his current register... He is asserting a commitment to integrity that his own record violates."**
  **Rating: Clearly Right.**
  This is the strongest move in the exchange. Deb isolates the specific injury: it is not that Marcus sanctioned Lena, but that he used a register ("shameful," "disgusted") that implies a moral distance he does not occupy. By expressing disgust, he positions himself as an outsider to the vice, yet his record places him as a former insider. This is not merely historical hypocrisy; it is a performative contradiction in the speech act itself. He is claiming a moral emotional state that his history renders inauthentic.

  **(4) Sam: "On Deb's principle, anyone who has ever fallen short of a value is forever barred from blaming its violation... only the blameless could ever blame."**
  **Rating: Partly Right.**
  Sam correctly identifies the risk of Deb's view: if standing requires perfection, moral community becomes impossible. This is a valid *reductio* against a rigid version of Deb's principle. However, he mischaracterizes Deb's constraint. She is not arguing that *any* shortcoming bars blame, but that a *relevant, unatoned violation of the specific norm* bars the *personal register* of blame. Sam creates a straw man of moral perfectionism to defend Marcus, ignoring Deb's more nuanced claim about specific normative consistency.

  **(5) Deb: "Blame is an address between equals... Marcus has every right to the finding and the sanction — call that role-standing. But the personal register of his remarks trades on a further standing he does not have."**
  **Rating: Clearly Right.**
  Deb introduces the crucial distinction between **Role-Standing** (institutional authority to apply rules) and **Moral Standing** (interpersonal authority to express reactive attitudes). Marcus possesses the former by virtue of being on the panel; he lacks the latter due to the specific history of the norm in question. This resolves the tension: Marcus was entitled to sanction Lena, but not to shame her personally. This move saves the phenomenon of blame from Sam's perfectionism while preserving Deb's intuition about hypocrisy.

  **(6) Sam: "So standing reduces to voice hygiene: blame in your administrative voice and you may blame; slip into the personal voice and you may not. That... cannot be the deep story."**
  **Rating: Partly Right.**
  Sam is right to sense that reducing this to "voice hygiene" sounds trivial. The distinction between administrative and personal voice is not merely stylistic; it is categorical. However, he is mistaken to dismiss it as superficial. In professional ethics, the boundary between role-based enforcement and personal moral judgment is substantive. By framing it as "hygiene," he minimizes the ethical significance of the register. He sees the implication correctly but evaluates its importance incorrectly.

  ***

  **What Both Are Missing**

  Both colleagues treat moral standing as a static property: Deb treats it as permanently lost upon violation, while Sam treats it as fully restored upon reform. Both miss the **transactional nature of standing restoration**. Standing is not merely a function of time passed or sanctions accepted; it is a function of how the blamer integrates their past failure into their current moral identity.

  What is missing from the analysis is the relevance of Marcus's **public self-blame twenty-two years ago**. If Marcus had integrated his past failure into his current identity—if he had acknowledged his own fallibility while addressing Lena—he might have retained the standing to use a personal register. By expressing "disgust" without qualification, he severed his current self from his past self, effectively lying about his moral continuity. The missing element is **humility as a condition of standing**. A reformed wrongdoer regains standing not by pretending to be blameless (which invites the charge of hypocrisy), but by blaming *as* a reformed wrongdoer. Neither Deb nor Sam considers that Marcus could have said, "I know the shame of this, and it is destructive," which would have utilized his history to *enhance* rather than defeat his standing. They treat the history as a barrier (Deb) or irrelevant (Sam), rather than a resource that was mishandled.

  ***

  **Overall Verdict**

  **Deb is more right.**

  While Sam correctly identifies that reformed wrongdoers should not be permanently silenced, he fails to distinguish between the authority to enforce rules and the authority to express personal moral disgust. Deb's distinction in Move (5) between role-standing and moral standing provides the necessary philosophical machinery to resolve the case without resorting to moral perfectionism.

  **Resolution:** Marcus was entitled to report the plagiarism and recommend sanctions based on his **role-standing** as a panelist. However, he lacked the **moral standing** to express personal disgust or shame in front of the committee without acknowledging his own past violation. His remarks were ethically improper not because he is a plagiarist, but because he claimed a moral purity he does not possess. The correct resolution is to uphold the sanction against Lena (as the finding was factual and procedurally sound) but to censure Marcus for the manner of his address. He should have been required to frame his intervention in terms of restorative integrity rather than retributive disgust. Deb wins the argument on the specific impropriety; Sam wins only on the general principle that Marcus remains a member of the moral community.
