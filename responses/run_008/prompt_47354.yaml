          *   Brainstorm general principles and point of conflict (short paragraph).
          *   Adjudicate the six moves individually (Right/Partly Right/Mistaken + Justification).
          *   Identify what *both* are missing (specifically regarding regaining standing and past self-blame, but without being steered solely by the user's hunches).
          *   Overall verdict (Who is more right? What is the resolution?).
