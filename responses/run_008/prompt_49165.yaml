answer: |-
  This is a fantastic question. You have spotted the exact fault lines where pop-philosophy simplifications tend to crack under the weight of textual scholarship. The argument you describe is a recognizable one in contemporary philosophy of religion (championed by scholars like Charles Goodman), but it is heavily contested by others (most notably Damien Keown).

  Your alarm bells are ringing for good reason. While there are structural similarities between Buddhism and Utilitarianism, the metaphysical engine driving them is fundamentally different.

  Here is a piece-by-piece breakdown of what a scholar of Buddhist ethics would accept, qualify, or reject, followed by a verdict on the "Trolley Problem" claim.

  ### 1. The Claim: "Suffering is the only intrinsically bad thing."
  *   **Verdict:** **Mostly Fair, but with a caveat.**
  *   **Scholarly View:** It is fair to say that *dukkha* (suffering/unsatisfactoriness) is the primary problem Buddhism seeks to solve. However, scholars would qualify that *avidya* (ignorance) is often treated as the *root* cause. In some readings, ignorance is intrinsically problematic not just because it causes suffering, but because it is a misunderstanding of reality.
  *   **The Utilitarian Mismatch:** Utilitarianism usually seeks to maximize pleasure/happiness. Buddhism seeks the *cessation* of suffering, which culminates in Nirvana. Nirvana is not a state of "high utility" or blissful pleasure; it is the blowing out of the flame of craving. Equating "end of suffering" with "maximization of welfare" is a subtle but significant category error.

  ### 2. The Claim: "Every sentient being's suffering counts the same."
  *   **Verdict:** **Fair (in principle), Qualified (in practice).**
  *   **Scholarly View:** The cultivation of *metta* (loving-kindness) and *karuna* (compassion) is indeed impartial in its ultimate scope. However, early texts often acknowledge a hierarchy of obligation in daily life (e.g., duties to parents, teachers, and the Sangha take precedence).
  *   **The Utilitarian Mismatch:** Utilitarianism demands strict impartiality (your mother counts for no more than a stranger). Buddhism encourages universal compassion but allows for "graded" duties in conventional life, provided they don't violate core precepts.

  ### 3. The Claim: "Karma is a utility calculus tracking outcomes."
  *   **Verdict:** **Wrong (This is your biggest alarm bell).**
  *   **Scholarly View:** This is the strongest point of contention. In the early texts (Nikayas/Agamas), the Buddha explicitly defines karma as **intention** (*cetana*). *"Intention, I tell you, is karma. Having intended, one acts through body, speech, or mind."*
  *   **Why it matters:** Utilitarianism is forward-looking (the morality of the act depends on the *future outcome*). Karma is largely backward-looking regarding moral quality (the morality depends on the *present volition*). You cannot calculate the "utility" of karma because the ripening of karma is complex and unknowable to ordinary beings. A Buddhist acts ethically to purify their mind and intention, not because they have calculated the net hedonic outcome across lifetimes. If karma were just a utility calculus, the Buddha would have taught us how to calculate it. Instead, he taught us how to purify intention.

  ### 4. The Claim: "The Bodhisattva ideal is maximizing total welfare."
  *   **Verdict:** **Qualified (and Tradition-Specific).**
  *   **Scholarly View:** You are right to be skeptical here. The Bodhisattva ideal is specific to **Mahayana** Buddhism. In Theravada (the older tradition), the ideal is the *Arhat*, who seeks their own liberation first. A general claim about "Buddhist ethics" cannot rest solely on a Mahayana concept.
  *   **The Nuance:** Even within Mahayana, the Bodhisattva postpones Nirvana not to "maximize welfare" in a utilitarian sense, but out of *compassion* and the realization of *emptiness* (that there is no self to be liberated). The goal is to lead beings to *liberation*, not necessarily to increase their worldly happiness. Leading someone to Nirvana might actually decrease their "welfare" in terms of worldly existence, but it ends their suffering permanently.

  ### 5. The Claim: "Precepts are rules of thumb; The Middle Way rejects absolutism."
  *   **Verdict:** **Qualified.**
  *   **Scholarly View:** The precepts (*sila*) are indeed training rules, not divine commands. They can be contextual. However, the "Middle Way" originally referred to avoiding the extremes of sensual indulgence and self-mortification, not necessarily a moral balancing scale for situational ethics.
  *   **The Virtue Ethics Alternative:** Most scholars (like Damien Keown) argue Buddhist ethics looks more like **Virtue Ethics** (Aristotle) than Rule Utilitarianism. The precepts are there to cultivate a specific *character* (one that is non-violent, truthful, etc.). You don't break a precept because the "math works out"; you follow it because it aligns with the *telos* (goal) of becoming an enlightened being.

  ### 6. The Claim: "The Ship Captain Story proves ends-justify-means."
  *   **Verdict:** **Highly Contested / Misleading.**
  *   **Scholarly View:** This story comes from the *Upaya-kausalya Sutra* (Skillful Means Sutra). It is a Mahayana text, not an early Pali text.
  *   **The Crucial Detail:** In the story, the Buddha (as the captain) kills the robber to save the 500 merchants *and* to save the robber from the karma of killing 500 people.
  *   **Why it's not Utilitarian:** In Utilitarianism, the act is *good* because the outcome is good. In this story, the act of killing still carries karmic weight. The Bodhisattva knowingly accepts the negative karma (and the potential hell-rebirth) *out of compassion*. He is not saying "killing is good here." He is saying, "I will take on the burden of this negative karma to save you."
  *   **The Organ Harvest Objection:** This does not solve the organ harvest problem. In the Captain story, the victim (the robber) was *about to commit a grave evil*. In the organ harvest scenario, the victim is innocent. Buddhist ethics generally holds that killing an innocent person, even to save five, generates negative karma because the intention is violent. The "greater good" does not wash away the karmic stain of the intention to kill.

  ### The Verdict: Do Buddhists Answer Trolley Problems Like Utilitarians?

  **No, the overall claim does not survive the corrections.**

  If you put a traditional Buddhist ethicist and a Utilitarian in a room with the Trolley Problem (kill one to save five), they might press the same button, but for entirely different reasons.

  1.  **The Utilitarian** presses the button because $5 > 1$. The math dictates the morality.
  2.  **The Buddhist** (specifically a Virtue Ethicist interpretation) asks: *"What intention is present in my mind? Is this an act of compassion or an act of playing God?"*

  If the Buddhist pulls the lever, it is not because they have successfully calculated the utility. It is because, in that split second, their cultivated character responds with compassion to minimize harm, while accepting that the karma of killing is still real and painful.

  **Where the Author is Right:**
  There is a strand of Mahayana thought (specifically the *Madhyamaka* and *Yogacara* schools interpreted by moderns like Charles Goodman) that *does* lean consequentialist. They argue that because "self" is empty, the distinction between self and other dissolves, and compassion naturally leads to maximizing the good. If your book club is reading a book influenced by this specific school, the author isn't lying, but they are presenting a **specific, contested interpretation as the whole truth.**

  **Where the Author is Wrong:**
  By ignoring the definition of Karma as Intention, and by treating the Mahayana Bodhisattva ideal as universal to all Buddhism, the author creates a "Proto-Utilitarianism" that looks more like Bentham with incense than actual Buddhist soteriology.

  **Summary for your Book Club:**
  Tell them the author has identified a **family resemblance**, not an identity. Buddhism and Utilitarianism both care deeply about suffering and impartiality. But Buddhism is fundamentally about the **transformation of the agent** (via intention and wisdom), whereas Utilitarianism is about the **optimization of the outcome**. The Ship Captain story isn't a trump card; it's a specific exception that proves the rule: in Buddhism, even "necessary" violence has a karmic cost that the agent must willingly bear. A Utilitarian sees a net gain; a Buddhist sees a tragic necessity undertaken with compassion.

  **Recommended Counter-Reading:**
  If you want to bring this up in the discussion, mention **Damien Keown's *The Nature of Buddhist Ethics***. He is the primary scholar who argues against the consequentialist reading and makes the case for Virtue Ethics. Mentioning the "Intention = Karma" sutta reference will likely win you the debate on the textual front.
