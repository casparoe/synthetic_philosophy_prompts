  *Wait, let me double check Charles Goodman's position.* Yes, Goodman argues Mahayana is consequentialist. Keown argues Theravada is virtue ethics. The book club book seems to be generalizing Mahayana consequentialism to *all* Buddhism. That's a key critique. I need to highlight the Theravada/Mahayana split.

