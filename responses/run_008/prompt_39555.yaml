          *   *Dieter's View:* Wire is not live (property must be detectable). If no shock ever occurs, "live" is wrong.
          *   *Analysis:* This is the classic "Finkish Disposition" case (C.B. Martin). Sam represents the *Categorical Base* view (dispositions grounded in intrinsic properties). Dieter represents a *Strict Conditional* or *Rylean* view (dispositions defined by behavior).
          *   *Verdict:* Sam is closer to standard metaphysical intuition (intrinsic properties don't vanish due to external interferers), but Dieter highlights the epistemic problem (how do we know?).

      *   **Round 2: Context Dependence (Iron vs. Wire).**
          *   *Sam's Objection:* Properties shouldn't flip based on location (lab bench vs. guardian device).
          *   *Dieter's Counter:* Properties *do* depend on environment (iron in magnetic field). Also, Sam's view makes dispositions unfalsifiable ("other things equal").
          *   *Analysis:* Sam appeals to *Intrinsicness*. Dieter appeals to *Relational/Contextual* properties and *Verificationism*. The iron analogy is tricky (magnetization is often relational, fragility is usually considered intrinsic). The falsifiability point is strong against naive dispositionalism.
          *   *Verdict:* Dieter scores a point on the falsifiability worry, but Sam is right that *fragility* is typically treated as intrinsic unlike *magnetization*.

      *   **Round 3: Packing Foam & Unpacking.**
          *   *Sam's Defense:* "Other things equal" (ceteris paribus) is standard. You test fragility by unpacking.
          *   *Dieter's Counter:* If you have to unpack it, the packing matters to the property status.
          *   *Analysis:* This is the "Mask" case. Sam distinguishes between the *possession* of the disposition and its *manifestation*. Dieter argues that if the manifestation is impossible, the attribution is empty.
          *   *Verdict:* Sam is following the standard Lewis/Mumford distinction (Masks vs. Finks). Dieter is pushing a pragmatic/operationalist line. Sam is technically more aligned with contemporary metaphysics, but Dieter's pragmatic worry is valid for science.

      *   **Round 4: Shielding vs. Hardening (The Clincher).**
          *   *Sam's Distinction:* Catching glass (masks fragility) vs. Hardening glass (removes fragility). Only the latter changes the property.
          *   *Dieter's Objection:* Indistinguishable from the outside (both don't break). Difference does no work.
          *   *Analysis:* This is the core metaphysical clash. Realism (Sam) vs. Empiricism/Instrumentalism (Dieter). If two states have identical empirical consequences, are they distinct?
          *   *Verdict:* Dieter wins on empirical grounds (verificationism). Sam wins on ontological grounds (causal powers).

  3.  **Identify What They Are Both Missing:**
