      *   *Missing Concept 2: Causal Powers vs. Conditional Analysis.* They are arguing past each other on the definition of "property."
      *   *Missing Concept 3: Scientific Practice.* In chemistry, we attribute properties based on structure *and* context. Solubility depends on the solvent (context) but also the solute (intrinsic).
      *   *Missing Concept 4: The "Fink" Literature.* They are rediscovering C.B. Martin and David Lewis without knowing it.

