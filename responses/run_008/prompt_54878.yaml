answer: |-
  # Specification of Desiderata for Ontological Parody Objections

  ## I. The Desiderata

  To count as a substantive philosophical objection rather than a mere rhetorical device, a parody of an ontological argument must satisfy the following conditions. They are arranged from the formal requirements of construction to the epistemic requirements of force.

  ### 1. Inferential Isomorphism
  The parody must replicate the inferential structure of the target argument. This is not merely a matter of rhetorical shape (e.g., "If you can conceive X, then X exists") but of logical form.
  *   **Requirement:** If the original argument relies on specific modal axioms (e.g., S5), quantification rules (e.g., existence as a second-order property), or definition types (e.g., rigid designators), the parody must utilize the same logical machinery.
  *   **Refutation vs. Embarrassment:** If the parody alters the logic to secure an absurd conclusion, it achieves only *embarrassment* (showing the proponent must be careful) rather than *refutation* (showing the proponent must be wrong). A refutation requires that the very rules licensing the original derivation license the parody derivation.

  ### 2. Independent Conclusion Absurdity
  The conclusion of the parody must be false or unacceptable on grounds independent of the parody itself.
  *   **Requirement:** The falsity of the parody's conclusion cannot rest solely on the assumption that the original argument is unsound. It must be antecedently implausible.
  *   **The Disanalogy Problem:** Proponents often block parodies by claiming the parody subject lacks a property required for the original subject (e.g., "Islands admit no intrinsic maximum," while "Greatness does"). For the parody to succeed, it must either show that this restriction is ad hoc or provide a subject that satisfies the restriction yet yields an absurd conclusion.
  *   **Unwelcome vs. False:** In modal contexts (e.g., Gödel-style), the conclusion might not be empirically false but metaphysically "unwelcome" (e.g., Modal Collapse, where all truths become necessary). Here, the desideratum shifts: the conclusion must violate a modal distinction the proponent is committed to preserving.

  ### 3. Premise Symmetry
  The premises of the parody must enjoy a degree of plausibility parity with the premises of the original.
  *   **Requirement:** If the original premise is "It is possible that a maximally great being exists," the parody premise (e.g., "It is possible that a maximally great island exists") must be at least as credible *prior* to evaluating the conclusion.
  *   **Ad Hominem vs. Objective:** A parody that is persuasive only to those who already reject theism functions as an *ad hominem* exposé (showing inconsistency in the opponent's web of belief) rather than an objective refutation (showing the argument fails on neutral grounds). For a dissertation catalogue, distinguish between parodies that demand the proponent explain their asymmetry versus parodies that claim to settle the matter for any rational agent.

  ### 4. Diagnostic Specificity
  The parody must locate the fault. It is not enough to show that the argument form *can* produce absurdity; it must indicate *where* the original argument breaks.
  *   **Requirement:** A successful parody forces the proponent to reject a specific premise or rule that was essential to the original. If the proponent can block the parody by adding a clause that does not weaken the original argument, the parody has failed as a refutation and succeeded only as a *diagnostic prompt*.
  *   **Mimicry vs. Diagnosis:** Pure mimicry (running the argument on "The Perfect Island") tests the form. Diagnostic moves (e.g., "Existence is not a real predicate") attack the semantic underpinnings. For modal/axiomatic versions, the diagnostic move often targets the definition of the operator (e.g., "Positivity") rather than the form. A parody counts as a refutation only if the diagnostic lesson applies to the original without destroying the proponent's entire metaphysical framework.

  ---

  ## II. Classification of Requirements

  | Requirement | Status | Justification / Camp |
  | :--- | :--- | :--- |
  | **Inferential Isomorphism** | **Non-Negotiable** | Without this, it is not a parody of *this* argument, but a different argument entirely. Both proponents and critics agree on this. |
  | **Independent Conclusion Absurdity** | **Non-Negotiable** | If the conclusion is not absurd/false, there is no *reductio*. Both camps agree, though they dispute what counts as "absurd." |
  | **Premise Symmetry** | **Negotiable** | **Proponents** argue this is too high a bar (the original premises are uniquely justified). **Critics** argue this is essential (otherwise the parody is a straw man). |
  | **Diagnostic Specificity** | **Preference (Critical Camp)** | **Proponents** accept parodies as helpful clarifications (Diagnostic). **Critics** demand they function as knockdown arguments (Refutation). |

  ---

  ## III. Joint Unsatisfiability: The Parody Gap

  There is a structural tension between **Inferential Isomorphism** and **Independent Conclusion Absurdity**. This tension constitutes the "Parody Gap."

  *   **The Impossibility:** If an argument is valid (satisfying Isomorphism) and its premises are true (satisfying Symmetry), the conclusion *must* be true. Therefore, a parody cannot simultaneously satisfy:
      1.  Exact Structural Match (Validity preserved).
      2.  Premise Plausibility Parity (Premises as credible as original).
      3.  Conclusion Falsity (The *reductio* target).
  *   **The Consequence:** A parody must always sacrifice one of these three.
      *   If it keeps Structure and Conclusion Falsity, it must claim the Premises are false (attacking Symmetry).
      *   If it keeps Structure and Premise Symmetry, it must claim the Conclusion is true (abandoning the *reductio*).
      *   If it keeps Premise Symmetry and Conclusion Falsity, it must claim the Structure is invalid (attacking Isomorphism).
  *   **Dissertation Implication:** You cannot grade a parody as a "perfect refutation." You must grade it on *which* of the three legs it kicks out. Most parodies attempt to kick out Premise Symmetry (showing the original premise was unjustified) while pretending to kick out Isomorphism (showing the logic is flawed).

  ---

  ## IV. The "Killer" Requirement

  **Premise Symmetry** is the single requirement that eliminates the largest share of the standard catalogue.

  *   **Reasoning:** Most parodies succeed in copying the form (Isomorphism) and generating an unwelcome conclusion (Absurdity). They fail because the proponent can plausibly claim the original premise has a justification the parody premise lacks.
      *   *Example:* "It is possible that a Maximally Great Being exists" is defended by appeals to intuition, coherence, or lack of disproof. "It is possible that a Maximally Great Island exists" is rejected because "island" is a contingent, functional kind that cannot bear maximal properties.
      *   *Example:* In modal versions, "Property P is positive" is axiomatic. "Property P is negative" is not. The parody fails because the premise parity is not established; the proponent claims the original axiom is uniquely self-evident or defined, whereas the parody axiom is arbitrary.
  *   **Result:** If you enforce Premise Symmetry strictly, most parodies reduce to *assertions* that the original premise is false, rather than *demonstrations* that the argument form is broken.

  ---

  ## V. Divergence: Anselmian vs. Gödelian Parodies

  The desiderata must be applied differently depending on whether the target is a conceptual definition (Anselmian) or an axiomatic system (Gödelian).

  ### A. For Conceptual/Anselmian Arguments
  *   **Target:** The coherence of the definition (e.g., "That than which nothing greater can be conceived").
  *   **Key Desideratum:** **Semantic Stability.** The parody must show that the terms used in the definition (e.g., "Greatness") can be applied to the parody subject without changing meaning.
  *   **Failure Mode:** The "Category Mistake." If the parody uses "Greatness" for an island but "Greatness" means something different for a being, Isomorphism is superficial.
  *   **Refutation Condition:** The parody succeeds if it shows the definition allows multiple instances, thereby destroying the uniqueness required for the conclusion.

  ### B. For Axiomatic/Modal (Gödel-style) Arguments
  *   **Target:** The axioms governing the operator (e.g., "Positive Properties").
  *   **Key Desideratum:** **Operator Neutrality.** The parody must show that the axioms governing the operator do not uniquely pick out the intended property (Divinity) but would equally validate arbitrary or opposing properties.
  *   **Failure Mode:** **Modal Collapse.** If the parody shows that *any* property satisfying the axioms entails necessary existence, and the axioms are too broad, the result is that *everything* exists necessarily.
  *   **Refutation Condition:** The parody succeeds if it forces the proponent to restrict the axioms so narrowly that they become ad hoc definitions of God rather than general principles of "Positivity."

  ---

  ## VI. Brief Scoring of Classic Parodies

  Use this scoring to determine chapter allocation. High scores warrant sustained treatment; low scores warrant footnotes.

  | Parody Type | Isomorphism | Conclusion Absurdity | Premise Symmetry | Diagnostic Force | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Perfect Island** (Classic) | **High** (Matches form) | **High** (Islands don't exist necessarily) | **Low** (Islands are contingent kinds) | **Low** (Easily blocked by category restriction) | **Footnote.** Fails Symmetry. Proponent can restrict "Necessary Existence" to "Substances" without cost. |
  | **The Maximally Evil Being** | **Med** (Matches form, swaps value) | **High** (Theological conflict) | **Med** (Depends on value symmetry) | **Med** (Challenges the link between Greatness and Existence) | **Sustained.** Useful for discussing value theory, but often collapses into the Island objection regarding "kind." |
  | **The Non-Existing Perfect** | **High** (Matches form) | **High** (Contradiction) | **High** (Conceptually coherent) | **High** (Directly attacks "Existence is a Perfection") | **Sustained.** This is a direct attack on the predicate logic, not just the subject. Essential for the "Existence is not a Predicate" section. |
  | **The Arbitrary Operator** (Gödel) | **High** (Matches axioms) | **High** (Modal Collapse) | **High** (If axioms are formal) | **High** (Forces restriction on "Positive") | **Sustained.** This is the strongest against modal versions. It forces the proponent to admit the axioms are not formal but content-loaded. |
  | **The Lost Island** (Gaunilo) | **Med** (Rhetorical match) | **Med** (Absurd, but empirical) | **Low** (Empirical vs. A priori) | **Low** (Confuses conceptual and empirical) | **Footnote.** Historically vital, philosophically weak against modern modal versions. Treat historically, not logically. |

  ### Chapter Strategy Recommendation
  1.  **Dismiss** parodies that fail **Premise Symmetry** (like the Island) quickly. They do not refute the logic; they merely assert the premise is false.
  2.  **Focus** on parodies that achieve **Diagnostic Specificity** (like the Non-Existing Perfect or Arbitrary Operator). These force the proponent to refine the theory, which is where the philosophical progress lies.
  3.  **Highlight** the **Parody Gap** in your introduction. Explicitly state that no parody can be perfect, and your evaluation will be based on which constraint the parody sacrifices to make its point. This preempts the standard "but the proponent says X" replies.
