      *   *The Core Tension:* To be effective, the parody must be *structurally identical* (to implicate the logic) but *materially distinct* (to generate a false/absurd conclusion). If it's too identical, the proponent says "That's just God." If it's too distinct, the proponent says "That's not the same logic."
