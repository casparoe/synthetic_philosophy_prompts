      *   **User's Hypothesis:** The disagreement isn't empirical but meta-scientific/philosophical (what counts as an explanation, what counts as data).
      *   **Task:**
          1.  Diagnose the disagreement (Substantive? Verbal? Methodological? Different questions?). Use specific arguments from both sides.
          2.  Assess prospects for progress (Conceptual distinction? Experiment? Theorem? Reformulation?).
          3.  Address the "permanent stalemate" possibility and explain the *heat* (specifically the "pseudoscience" accusation).
      *   **Constraint:** Do not give a verdict on whether IIT is *true*. Focus on the *structure of the disagreement*.

  2.  **Deconstruct the IIT Debate (Mental Sandbox):**
      *   *IIT Side:* Starts with phenomenology (axioms: existence, composition, information, integration, exclusion). Derives postulates about physical substrates. $\Phi$ measures irreducible cause-effect power. Prediction: Cortex yes, cerebellum no, photodiode yes (tiny). Method: Phenomenology $\to$ Physics.
      *   *Critics:* Start with neuroscience/evolution/functionalism. Consciousness likely tracks complex information processing/behavior/adaptation. IIT predicts absurdities (grid of gates > child). Method: Physics/Function $\to$ Phenomenology.
      *   *The Clash:* It looks like the user is right. It's a clash of "Hard Problem" approaches vs. "Scientific Naturalism" approaches.
      *   *The "Pseudoscience" Label:* Why so heated? Because IIT claims to be mathematical/scientific but relies on untestable metaphysical premises (panpsychism) that violate parsimony. It feels like a category error to the critics.

  3.  **Drafting the Diagnosis (Part 1):**
      *   *Is it Verbal?* Partially. "Consciousness" might mean different things (phenomenal vs. functional), but both sides claim to talk about *phenomenal* consciousness. So it's not *just* verbal.
      *   *Is it Substantive?* Yes, but not in the usual empirical sense. It's about *priority*.
      *   *Best Diagnosis:* **Methodological Incommensurability rooted in conflicting Epistemic Priorities.**
      *   *Evidence:*
          *   IIT: "The starting point must be the phenomena themselves" (Tononi). Axioms are indubitable.
          *   Critics: "A theory must be falsifiable by third-person data" (Koch, Seth, etc., though Koch is nuanced, the letter signers are harsher). The "grid of gates" is a *reductio ad absurdum*.
      *   *Key Distinction:* IIT treats phenomenology as *constraint* on physics. Critics treat phenomenology as *target* to be explained by physics.

  4.  **Drafting the Prospects for Progress (Part 2):**
      *   *Can experiments solve it?* TMS/EEG (PCI index) supports IIT *predictions*, but critics say "correlation $\neq$ identity." IIT says $\Phi$ *is* consciousness. Critics say $\Phi$ tracks consciousness. This is the "Identity vs. Correlation" gap.
      *   *Can theorems solve it?* Internal consistency of axioms? Maybe, but IIT has evolved (3.0, 4.0) to patch holes.
      *   *Real Progress:* Requires a **Meta-Theoretical Framework**. We need to agree on what a "theory of consciousness" is allowed to do.
      *   *Possibility:* Distinguishing "Structural Account" (IIT) vs. "Mechanistic Account" (GNW, etc.).
      *   *Stalemate?* Likely, unless one side concedes a philosophical premise (e.g., physicalism vs. non-reductive realism).

  5.  **Drafting the "Heat" and "Pseudoscience" (Part 3):**
      *   *Why "Pseudoscience"?* It's not just "wrong." It's "immunized against falsification."
      *   *Popperian Angle:* If a theory predicts a photodiode is conscious, and you say "well, you can't prove it isn't," that looks like unfalsifiability.
