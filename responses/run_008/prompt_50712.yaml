answer: |-
  Your hypothesis is remarkably sharp, and frankly, it cuts closer to the bone than most graduate-level analyses I see. You have identified the core friction point: this is not primarily a dispute about *data*, but a dispute about the **direction of fit** between theory and phenomenon.

  Here is a diagnosis of the stalemate, an assessment of whether progress is possible, and an explanation for why the rhetoric has escalated to "pseudoscience."

  ### 1. Diagnosis: Methodological Incommensurability
  You asked if this is substantive, verbal, or a difference in what counts as data. The answer is **methodological incommensurability rooted in conflicting epistemic priorities.**

  Both sides are using the word "consciousness" to refer to roughly the same thing (phenomenal experience), and they are looking at the same brain scans. However, they disagree fundamentally on what a theory of consciousness is *supposed to be*.

  **The IIT Position: Phenomenology as Constraint**
  For Tononi and proponents, the "Hard Problem" is not a bug; it is the starting block. They argue that physical science explains *function* (what a system does), but consciousness is *existence* (what it is like to be the system).
  *   **The Move:** They treat the properties of experience (it is unified, it is specific, it is definite) as **axioms**. These are taken as indubitable data points, more certain than any third-person measurement.
  *   **The Goal:** To find the physical substrate that *necessarily* possesses a structure isomorphic to these axioms.
  *   **The Implication:** If the math says a photodiode has $\Phi > 0$, and that offends your intuition, your intuition is wrong, not the math. The theory is derived from the "inside out." To change the theory, you must prove the axioms of phenomenology are wrong (which they argue is impossible).

  **The Critics' Position: Consciousness as Natural Kind**
  For the critics (including many signers of the open letter), consciousness is a biological phenomenon that evolved to serve a function.
  *   **The Move:** They treat consciousness as a **target variable** to be predicted by physical/functional models. A good theory should start with the physics/biology and *derive* the likelihood of experience.
  *   **The Goal:** To find a mechanism that explains *why* we report consciousness and *when* it occurs, consistent with evolutionary parsimony.
  *   **The Implication:** If a theory predicts a grid of logic gates is more conscious than a toddler, the theory is falsified by *reductio ad absurdum*. The "intuition" that toddlers are more conscious than gates is a valid data point because it aligns with evolutionary and behavioral evidence. The theory is derived from the "outside in."

  **The Stalemate:**
  The stalemate exists because **neither side accepts the other's foundational data.**
  *   When IIT proponents say, "Experience is irreducible, therefore $\Phi$ is real," critics hear, "I am defining consciousness by fiat."
  *   When critics say, "A grid of gates can't be conscious," IIT proponents hear, "You are begging the question by assuming only biology counts."

  This is why adversarial collaborations (like the recent TMS experiments comparing IIT vs. Global Neuronal Workspace) feel unsatisfying. Even if IIT predicts the cortex "lights up" correctly, critics say, "You found a correlate, not an identity." Even if IIT predicts the cerebellum is silent, critics say, "Maybe the cerebellum does something else; you haven't proved $\Phi$ *is* experience."

  ### 2. Is Progress Possible?
  Is this a permanent stalemate? Not necessarily, but progress will not look like a standard empirical "win." It will require **conceptual surgery.**

  **A. The "Identity vs. Correlation" Trap**
  The biggest hurdle is that IIT claims an **identity relation** ($\text{Consciousness} = \Phi$), while standard science deals in **correlations** ($\text{Brain State} \to \text{Report of Consciousness}$).
  *   **Progress Path:** A formal theorem demonstrating that the IIT axioms are *not* unique. If someone can show that a different set of physical postulates maps onto the same phenomenological axioms equally well, IIT loses its claim to necessity. This is a mathematical/conceptual attack, not an empirical one.

  **B. The "Collapse" of the Axioms**
  IIT relies on the "Exclusion Postulate" (experience is definite, not overlapping). Critics argue this is physically unmotivated.
  *   **Progress Path:** If neuroscientists discover that causal integration in the brain is actually fuzzy, overlapping, or hierarchical in a way that violates the "definiteness" axiom, IIT's bridge from phenomenology to physics collapses. This would force IIT proponents to revise their axioms, admitting phenomenology is not as "indubitable" as claimed.

  **C. Reframing the Question**
  The most likely path to progress is dissolving the dichotomy. We may need to distinguish between:
  1.  **A Theory of Phenomenal Structure:** (What IIT is actually good at: mapping the *shape* of experience).
  2.  **A Theory of Conscious Status:** (What the critics want: determining *who/what* has experience).
  If IIT is rebranded as a theory of the *structure* of consciousness (assuming it exists) rather than the *distribution* of consciousness, the "panpsychism" bullet becomes less central. However, Tononi has explicitly resisted this; he wants the distribution claim.

  **Verdict on Progress:** Expect a slow erosion rather than a sudden resolution. If IIT 5.0 has to tweak its axioms to match new neural data, it concedes the critics' point that phenomenology isn't the only constraint. If critics have to admit functionalism can't explain *why* there is experience, they concede the Hard Problem is real.

  ### 3. Why the Heat? The "Pseudoscience" Accusation
  You asked why this feels different than other stalemates (like, say, String Theory vs. Loop Quantum Gravity, which rarely involve accusations of pseudoscience). The "pseudoscience" label is doing specific rhetorical work here. It is not just saying "you are wrong"; it is saying **"you are gaming the epistemic rules."**

  **1. Immunization Against Falsification**
  In standard science, if a prediction is absurd (gates > children), the theory is discarded. In IIT, the absurd prediction is framed as a *feature* (our intuitions are biased). To critics, this looks like moving the goalposts. A theory that explains away counter-evidence as "human bias" rather than updating the model triggers the "pseudoscience" alarm (reminiscent of Freudian psychoanalysis or Marxism, where counter-evidence is interpreted as resistance or false consciousness).

  **2. The Claim to Mathematical Necessity**
  IIT presents itself as a mathematical derivation. It says, "Given these axioms, $\Phi$ *must* be consciousness." This claims a level of certainty that empirical science rarely achieves. When critics point out the axioms are contestable philosophical premises, and IIT proponents double down on their indubitability, it looks like **math-washing** metaphysics. The "pseudoscience" charge is a reaction to the perceived misuse of mathematical formalism to settle a philosophical debate by fiat.

  **3. Resource and Prestige Stakes**
  This is the sociological factor. IIT has attracted massive funding and media attention. It promises a "consciousness meter." If IIT is wrong, resources poured into measuring $\Phi$ are wasted. If IIT is right, standard neuroscience (studying neurons, neurotransmitters, evolution) is fundamentally incomplete. The stakes are existential for the field. The "pseudoscience" letter was, in part, a boundary-policing action by the mainstream community to protect the methodological norms of neuroscience from a paradigm they view as metaphysically bloated.

  ### Summary
  Your hypothesis is correct. The disagreement is not about whether the cortex integrates information (both sides agree it does). It is about **whether the "feel" of experience is a constraint on physics (IIT) or a product of physics (Critics).**

  *   **Is it substantive?** Yes, it's about the nature of explanation.
  *   **Is it verbal?** No, they agree on the referent, but disagree on its ontological status.
  *   **Will it end?** Only if one side concedes a philosophical premise (e.g., physicalism is incomplete, or phenomenology is not indubitable).
  *   **Why the heat?** Because IIT claims the authority of math to bypass the norms of falsification, which threatens the self-conception of neuroscience as a natural science.

  You are seeing the "Hard Problem" in real-time. The reason it feels frozen is that you are watching two different language games collide, and neither side is willing to play by the other's rules. That isn't a failure of your understanding; it is the current state of the art.
