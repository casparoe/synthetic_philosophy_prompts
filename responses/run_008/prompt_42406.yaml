answer: |-
  First, your facts on the TRC are solid. The core bargain was indeed conditional amnesty: perpetrators avoided prosecution only if they made full disclosure of politically motivated crimes, while victims were given a public platform to testify. This was distinct from blanket amnesty (which would have been a pure "objective" maneuver) and distinct from Nuremberg-style trials (which would have been pure retributive "participant" enforcement). Your immune analogy is strikingly apt, though I would refine it slightly: rather than switching off the immune response entirely (which would be sepsis, or moral collapse), the TRC functioned more like regulating a cytokine storm—preventing the inflammatory response (retribution) from destroying the host (the new state) while still allowing the immune system (moral accountability) to recognize the pathogen.

  Here is the mapping onto Strawson's framework. In "Freedom and Resentment," Strawson distinguishes between the **participant stance** (engaging with others as moral agents, subject to reactive attitudes like resentment, gratitude, and blame) and the **objective stance** (viewing others as objects to be managed, cured, or handled, exempt from moral demand).

  1.  **Resentment and Reactive Attitudes:** The victim hearings were institutionalized spaces for reactive attitudes. Strawson argues these attitudes are natural and constitutive of human relationships; the TRC validated this by refusing to suppress them. Victims were not told to "move on" silently; their resentment was given public weight.
  2.  **The Objective Attitude:** The waiver of legal punishment looks like the objective stance—the state treating the perpetrator as a political problem to be managed for stability rather than a moral agent to be punished. However, because amnesty was *conditional* on confession, the state refused to treat them purely as objects. They were forced to re-enter the moral community as agents capable of truth-telling.
  3.  **Forgiveness:** Strawson notes forgiveness is a modification of reactive attitudes, not their abandonment. The TRC did not mandate forgiveness (Tutu emphasized it was a gift, not a duty), but it created a structure where resentment could be acknowledged without demanding destruction. This aligns with Strawson's view that we can modify our reactions without exiting the participant stance.

  So, what does this episode show about the theory? It suggests that Strawson's core psychological insight—that we cannot sustain pure objectivity toward moral agents without losing something essential—holds true even at a macro-political level. A pure objective stance (blanket amnesty) was rejected as morally untenable; a pure retributive stance (mass trials) was rejected as politically untenable. The TRC succeeded by keeping the participant stance (truth/accountability) while modifying the consequences (no jail).

  However, there is a significant stretch here. Strawson was analyzing interpersonal relationships (I vs. You), not institutional politics (State vs. Citizen). While the TRC vindicates the *necessity* of the participant stance, it operates in a domain Strawson did not address: the **collectivization of reactive attitudes**. Can a Commission *feel* resentment? Or does it merely channel the resentment of individuals? Strawson's theory rests on human psychology; the TRC rests on political theology.

  I am highly confident in the mapping of the individual dynamics (confession vs. amnesty) onto Strawson's categories. I am moderately confident in the broader political application. The point I am least sure of is whether "collective reactive attitudes" are coherent within Strawson's framework, as he grounds them in individual human psychology rather than institutional agency.

  The TRC demonstrates the inescapability of Strawson's participant stance, but it applies it to a political organism he never modeled.

  The theory holds psychologically but stretches politically beyond its original design.
  \answer{case he never anticipated}
