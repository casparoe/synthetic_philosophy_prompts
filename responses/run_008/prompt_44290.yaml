answer: |-
  This is a remarkably precise diagnosis of a stalemate that has frustrated biologists and philosophers alike. You have correctly identified that the mathematical equivalence established by the Price equation (and later by the bridge theorems connecting inclusive fitness and multilevel selection) functions as a *translation manual*, not a *truth arbiter*.

  To answer your request directly: The disagreement is primarily a clash of **research programs** (in the Lakatosian sense) grounded in divergent **explanatory pragmatics**, with a smaller, stubborn residue of **empirical disagreement** regarding the frequency of specific biological conditions (specifically non-additivity). The Price equation shows intertranslatability, which is indeed a weaker achievement than identity of explanation.

  Here is a detailed breakdown of the diagnosis, the role of philosophy, and the prospects for progress.

  ### 1. The Nature of the Disagreement: Ontology vs. Heuristics

  Your hypothesis that the camps are answering different questions is correct, but it can be sharpened. The dispute is not merely about "causal statistics" vs. "pragmatics." It is about **causal granularity** versus **causal perspective**.

  *   **The Kin Selection (Inclusive Fitness) Program:** This program treats the gene (or the allele) as the primary locus of causal agency. It asks: "What does a gene need to do to increase its frequency?" It is an *agent-centered* perspective. Its power lies in its ability to generate intuitive rules (Hamilton's Rule) that map directly onto the behavior of organisms. It assumes that the "vehicle" (the organism) can be treated as a maximizer of inclusive fitness.
  *   **The Multilevel Selection (Group Selection) Program:** This program treats the population structure as the primary causal constraint. It asks: "How does the structure of variance in this population drive evolutionary change?" It is a *system-centered* perspective. Its power lies in describing scenarios where individual optimization leads to collective ruin (tragedies of the commons) and where group-level properties emerge that cannot be easily reduced to individual gene strategies without complex bookkeeping.

  **The Price Equation's Role:**
  The Price equation demonstrates that these are coordinate systems. You can describe the trajectory of a particle using Cartesian or Polar coordinates; the physics doesn't change, but the *solubility* of the problem does.
  *   **Intertranslatability:** Yes, you can translate an inclusive fitness model into a multilevel selection model and vice versa.
  *   **Explanatory Identity:** No. A translation often obscures the insight. For a behavioral ecologist studying a wasp nest, thinking in terms of "relatedness coefficients" (kin selection) often yields immediate predictions about policing behavior. Thinking in terms of "between-group variance" (group selection) might require measuring group productivity and extinction rates, which is empirically harder, even if mathematically equivalent.

  Therefore, the 2010 Nowak, Tarnita, and Wilson (NTW) paper was not a mathematical correction; it was a **methodological insurrection**. They argued that the inclusive fitness "coordinate system" becomes singular (breaks down) under strong selection and non-additive interactions, whereas the group selection framework remains robust. The community's backlash was not because NTW were mathematically wrong (though their biological examples were contested), but because they threatened to devalue the heuristic capital accumulated over 40 years of kin selection theory.

  ### 2. The Empirical Residue: Where the Math Doesn't Touch

  You asked if there is a genuine empirical residue. There is, though it is narrower than the rhetoric suggests.

  The equivalence theorems generally rely on the ability to define a "group." In insect eusociality, groups are discrete (colonies). In microbial biofilms or human social networks, "groups" are fuzzy.
  *   **The Claim:** Inclusive fitness theory (IFT) relies heavily on the assumption of **additive fitness effects**. When interactions are strongly synergistic (non-additive), the simple $rb > c$ formulation fails.
  *   **The Counter:** Proponents of IFT argue that the theory can be extended to handle non-additivity (e.g., by using regression definitions of relatedness), but doing so makes the parameters harder to measure and the intuition less clear.
  *   **The Real Fight:** The empirical contest is about **frequency**. How often in nature do we encounter strong non-additivity where the "gene's eye view" becomes computationally intractable compared to a group-level model? NTW argue "often enough to matter"; the defenders argue "rarely enough that IFT remains the dominant tool."

  This is not solvable by a theorem. It is solvable only by comparing the predictive success of models derived from each framework against longitudinal data on social evolution transitions.

  ### 3. The Philosophical Intervention: Dissolution or Refinement?

  You mentioned Sober & Wilson (1998) and Okasha (2006). Their contributions are vital but have not dissolved the dispute.

  *   **Sober & Wilson:** They successfully rehabilitated the *concept* of group selection by distinguishing **MLS1** (selection on individuals within groups) from **MLS2** (selection on groups as replicators). They showed that group selection is not logically impossible, merely empirically constrained. This ended the "error" phase of the debate (the Williams era) but opened the "utility" phase (the current era).
  *   **Samir Okasha:** In *Evolution and the Levels of Selection*, Okasha provides the most rigorous philosophical treatment. He acknowledges the Pricean equivalence but argues that **causal interpretation** is not arbitrary. While the *partitioning* of variance is mathematically flexible, the *causal structure* of the biological system is not.
      *   *The Limit:* Okasha shows that philosophy can clarify what is being claimed, but it cannot dictate which causal description is more *fruitful*. He effectively validates your suspicion: philosophy has furnished a refined vocabulary, not a verdict. It allows us to say, "You are arguing about heuristic utility, not mathematical truth," but the biologists reply, "Heuristic utility is what drives our research, so the argument matters."

  ### 4. Diagnosis: A Lakatosian Rivalry

  This is a classic case of competing **Scientific Research Programs**.
  *   **Hard Core:** The kin selection program has the "gene as the unit of selection" as its hard core. The group selection program has "population structure as the driver" as its hard core.
  *   **Protective Belt:** When anomalies arise (e.g., eusociality in low-relatedness species), each program adjusts its protective belt. Kin selectionists introduce "multi-locus effects" or "extended phenotypes." Group selectionists refine "group heritability" definitions.
  *   **Progress:** A research program is "progressive" if it predicts novel facts; "degenerating" if it only explains past facts through ad hoc adjustments.

  The 2010 controversy was a moment where the Kin Selection program was accused of becoming degenerating (relying on complex regression coefficients to save Hamilton's rule in cases where it didn't intuitively fit), while the Group Selection program claimed to be progressive (offering a general framework for eusociality origins without requiring high relatedness).

  ### 5. What Counts as Progress?

  You asked for honesty on what would count as progress. Given the diagnosis above:

  1.  **A Theorem?** **No.** We have enough theorems. Mathematical equivalence is already established. More math will only deepen the trench if it doesn't connect to measurement.
  2.  **Terminological Reform?** **No.** Biologists are pragmatic. They will use "inclusive fitness" and "group selection" interchangeably or combatively depending on their tribe, regardless of philosophical standardization.
  3.  **A Field Study?** **Yes, but specific.** Progress requires a **comparative modeling study** applied to a **real historical transition**.
      *   We need a study that takes a specific transition (e.g., the origin of halictid bee eusociality) and models it *both* ways.
      *   It must show that Framework A predicts the observed trajectory (e.g., the specific sequence of behavioral changes) while Framework B fails or requires untenable parameter estimates.
      *   Crucially, it must address the **origin** question, not just the maintenance. Maintenance is easy for both; origin is the bottleneck.
  4.  **Acceptance of Rivalry?** **Most Likely.** The most honest answer is that this is a permanent feature of evolutionary biology, akin to the wave-particle duality in physics.
      *   Some biological problems are naturally "individual-centric" (e.g., sex ratio evolution).
      *   Some are naturally "group-centric" (e.g., major transitions in individuality, species selection).
      *   Progress will come from recognizing **domain specificity**. The "victory" of one side is unlikely. The maturity of the field will be marked by the consensus that *both* are tools in a toolbox, to be selected based on the causal structure of the specific system under study.

  ### Summary

  The dispute is not verbal, but it is not purely empirical. It is **methodological**. The Price equation proves the languages are translatable, but not that they are equally useful for every task. The 2010 flare-up was a defense of heuristic territory. Philosophy has clarified the stakes but cannot resolve them because the stakes involve scientific *productivity*, not just logical consistency.

  Progress will not come from a unifying theorem, but from a consensus on **domain applicability**: knowing when the "gene's eye view" obscures the causal dynamics of population structure, and when the "group view" obscures the mechanics of inheritance. Until then, the rivalry is productive friction, keeping both sides honest about their assumptions.
