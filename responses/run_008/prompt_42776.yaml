answer: |-
  Here is an analysis of your sister's epistemological framework, two competing rules that fit her track record, a prediction for the weekend case, and a diagnostic test to settle the matter.

  ### Two Competing Rules

  Your sister's track record reveals that she does not treat "knowledge" as a static relationship between a mind and a fact. Instead, she treats it as a **license to act**. However, the data allows for two distinct interpretations of *whose* situation determines whether that license is granted.

  Both rules must account for two critical constraints evident in her record:
  1.  **The Evidence Constraint:** Probabilistic evidence (the Lottery, Case 6) never yields knowledge, regardless of stakes.
  2.  **The Quality Constraint:** Perceptual certainty (the Passport, Case 3) overrides high stakes, whereas fallible testimony/websites (The Bank, Case 2) do not.

  **Rule 1: Subject-Sensitive Invariantism (SSI)**
  *   **The Principle:** Whether a person *knows* something depends on the practical stakes facing **the believer (the subject)**.
  *   **The Formula:** $S$ knows $p$ if $S$ has non-probabilistic evidence sufficient to meet the threshold demanded by $S$'s own stakes.
  *   **Fit with Track Record:**
      *   *Cases 1 & 2 (Her):* Her stakes change, so her knowledge status changes.
      *   *Cases 4 & 5 (Neighbor/Nephew):* She tracks *their* stakes. The neighbor's high stakes wipe out his knowledge; the nephew's low stakes preserve his.
      *   *Passport (Case 3):* Her stakes are high, but the evidence (holding it) is maximal, clearing the high threshold.
      *   *Lottery (Case 6):* Evidence is probabilistic; it clears no threshold.

  **Rule 2: The Deliberative-Context Principle (DCP)**
  *   **The Principle:** Whether we attribute *knowledge* depends on the practical stakes facing **the person deliberating or acting on the information**.
  *   **The Formula:** $S$ knows $p$ (in this context) if the evidence available meets the threshold demanded by the stakes of the **primary agent** whose plan depends on $p$.
  *   **Fit with Track Record:**
      *   *Cases 1 & 2 (Her):* She is the agent. Her stakes dictate the standard.
      *   *Cases 4 & 5 (Neighbor/Nephew):* They are the agents. She simulates their context. The neighbor is acting on high stakes (missed flight), so she denies knowledge. The nephew is acting on low stakes (aimless walk), so she grants it.
      *   *Passport (Case 3):* She is the agent. Stakes high, but evidence is maximal.
      *   *Lottery (Case 6):* She is the agent. Probabilistic evidence is insufficient for action.

  ### The Divergence
  In all six previous cases, the **Believer** and the **Agent** were the same person.
  *   In Cases 1–3, she believed and acted.
  *   In Cases 4–5, the neighbor/nephew believed and acted.

  The new case breaks this link. The **Brother** is the Believer (Low Stakes), but the **Sister** is the Agent (High Stakes).
  *   **Rule 1 (SSI)** predicts: **Yes, he knows.** (His stakes are low; website evidence is sufficient for low stakes.)
