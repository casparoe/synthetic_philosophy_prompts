  ### The Diagnostic Case

  To definitively separate Rule 1 (Subject-Stakes) from Rule 2 (Agent-Stakes), you need a scenario where the **Believer has High Stakes** but the **Attributor/Agent has Low Stakes**.

  **Put this case to her over coffee:**

  > "Imagine I (the brother) am rushing to a job interview that I will definitely lose if I'm five minutes late. I need to know if the subway is running. I check the transit website five minutes ago. You are sitting here at home, relaxed, with nothing to do. I call you and tell you the subway is running.
