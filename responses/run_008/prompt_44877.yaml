answer: |-
  ### Session Plan: Demarcation and Falsification (30 Minutes)

  #### 1. Sequence and Dependencies
  You must introduce the ideas in the following order to maintain logical coherence. The dependency is strict: you cannot discuss how to handle a failed test until you have established that a test was possible in the first place.

  1.  **The Demarcation Problem (5 mins):** Define the goal. We are not deciding if the grandmother is right or wrong; we are deciding what kind of claim allows us to check.
  2.  **The Criterion of Falsifiability (10 mins):** Define "falsifiable" strictly as "capable of being proven wrong." Establish that a scientific claim must stick its neck out.
      *   *Dependency:* This must precede any discussion of data analysis. If a claim cannot be proven wrong, there is no "failed prediction" to discuss.
  3.  **The Consequence of Failure (10 mins):** Discuss what happens when a prediction fails. Does the theory die immediately?
      *   *Dependency:* This relies on the previous step. We only know a prediction "failed" because we established in step 2 that it was risky enough to fail.
  4.  **The Limitation of the Criterion (5 mins):** Clarify that this is a tool for demarcation, not a guarantee of truth.
      *   *Dependency:* This must come last to prevent students from viewing falsification as a mechanical truth-machine.

  #### 2. Carrying Example
  **Use a generalized version of the joint-pain project.** Do not use the Black Swan example.

  *   **The Example:** Label it "The Body-as-Barometer Hypothesis." State it clearly: "My knee pain intensity predicts rainfall within 24 hours with 80% accuracy." Contrast this with a vague claim: "My knee feels weird when the weather changes."
  *   **Why the Joint-Pain Project:** It is the immediate context of the dispute. Using it validates the students' experience while allowing you to abstract the specific sophomore away from the critique. It focuses on *prediction*, which is central to experimental science fairs.
  *   **Why Not Black Swan:** The Black Swan example ("All swans are white") illustrates the problem of induction and universal generalizations based on observation. Your students are dealing with *predictive modeling* (will it rain tomorrow?). The Black Swan example does not capture the element of *risk* regarding future events, which is central to Popper's view of experimental science. Furthermore, the Black Swan is historically distant; the joint-pain example is emotionally and intellectually immediate for this specific audience.

  #### 3. Map of Misconceptions
  You must head off these misconceptions at specific points in the sequence. If you wait too long, they will calcify.

  *   **"Falsifiable" means "False":**
      *   *When to head off:* Immediately upon introducing the term in Segment 2.
      *   *How:* Write "Falsifiable ≠ False" on the board. Define it as "Vulnerable to evidence," not "Incorrect."
  *   **Horoscopes are Scientific:**
      *   *When to head off:* During Segment 2, when defining specificity.
      *   *How:* Show that "You will face a challenge today" cannot be proven wrong (what counts as a challenge?), whereas "It will rain 0.5 inches" can. Emphasize that making *a* prediction is not enough; the prediction must be *risky*.
  *   **One Failed Prediction Obliges Discarding the Theory:**
      *   *When to head off:* During Segment 3 (Consequence of Failure).
      *   *How:* Explain that scientists check the equipment and methods before burning the theory. Use the distinction between a "anomaly" and a "refutation."
  *   **Popper Proves Science Delivers Certainty:**
      *   *When to head off:* During Segment 4 (Limitations).
      *   *How:* Explicitly state that falsificationism tells us what science *is*, not that science is *infallible*. It locates liability, not truth.

  #### 4. Ruling on Auxiliary Assumptions
  **Gesture at it, do not explain it.**

  *   **Decision:** You should name the complication but not unpack the philosophy (the Duhem-Quine problem). Your advisor is correct that a full explanation requires a separate session, but ignoring it entirely makes the "One Failed Prediction" misconception harder to correct.
  *   **Placement:** Insert this gesture in Segment 3, immediately after discussing what happens when a prediction fails.
  *   **Execution:** Say this: "When a prediction fails, we must ask if the theory was wrong, or if our measurement was wrong." Write "Theory vs. Measurement" on the board. Do not elaborate on how to distinguish them. This acknowledges the complexity of the grandmother's project (was it the pain, the recording, or the app?) without derailing the thirty-minute limit.

  #### 5. Closing Question
  To test grasp rather than vocabulary, ask the students to repair a broken claim.

  *   **The Question:** "If I claim 'This medicine works for everyone, except when it doesn't,' what specific words must I remove or change to make this statement scientific?"
  *   **Why this works:** It forces them to identify that exemptions and loopholes destroy falsifiability. If they simply say "Make it testable," they are using vocabulary. If they say "Remove the exception," they understand the logic of risk.

  \answer{The most consequential sequencing decision is to define falsifiability as the capacity for error before discussing how to handle actual errors, because students cannot grasp the methodology of correction without first accepting risk as a defining feature of science.}
