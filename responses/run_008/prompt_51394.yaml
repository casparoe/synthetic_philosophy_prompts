answer: |-
  The argument turns on **Step (3)**.

  **Why Step (3) Looked Innocuous**
  Step (3) asserts that burdens must be assessed *ex post* ("as things actually turn out"). This premise is highly intuitive because it aligns with contractualism's core motivation in deterministic cases. In a standard trolley problem or rescue case, we assess the permissibility of an act by looking at the actual burden imposed on the victim (e.g., death vs. injury). It seems like a mere consistency requirement to apply this same *ex post* lens to risk cases: if someone actually dies, their burden is death, not a probability. Furthermore, it respects the moral significance of actual suffering over statistical abstractions, which feels like a virtue of contractualism compared to utilitarianism.

  **The Cost of Rejecting Step (3)**
  To save contractualism from the conclusion that nearly all risk imposition is forbidden, you must reject (3) and adopt an *ex ante* perspective for risk policies. This means the relevant burden is not the realized harm (death), but the burden of being *subjected to the risk* itself. However, this move carries significant costs:

  1.  **The Expected Utility Trap:** The primary theoretical cost is the difficulty of defining the "burden of risk" without collapsing into expected utility theory. If you calculate the burden of a 1/100,000 risk of death as simply $0.00001 \times \text{Death}$, you have smuggled utilitarianism back in, violating your constraint to keep the spirit of (2). You must articulate a qualitative account of why accepting a small risk is reasonable even if the realized outcome is catastrophic, without relying solely on mathematical expectation.
  2.  **Alienation of the Victim:** Rejecting (3) creates a gap between justification and actual suffering. You must tell the actual victim (or their survivors) that their complaint is not about their death, but about the risk they faced beforehand. If the *ex ante* risk was reasonable, their actual death is rendered a matter of "bad luck" rather than injustice. This can seem cold and fails to account for the moral significance of the actual outcome, potentially weakening contractualism's appeal as a theory sensitive to individual fates.
  3.  **Theoretical Complexity:** It forces a dual-track theory. You must explain why *ex post* assessment governs deterministic harms (preserving Step 2) while *ex ante* assessment governs systemic risks. Maintaining a principled distinction between these two categories without arbitrariness is difficult.

  **Alternatives**
  *   **Keeping (3) and (2):** You must accept conclusion (7). This is the "bullet-biting" option. It renders contractualism practically inert in the modern world, as almost no social policy can be justified if any actual fatality vetoes the benefit.
  *   **Rejecting (2):** This saves risk imposition but abandons the non-aggregation constraint. If a single death can be outweighed by enough headaches (because the headaches sum up), contractualism loses its distinctiveness and converges toward a form of prioritarianism or utilitarianism.

  Rejecting (3) is the standard Scanlonian move (distinguishing principles governing systems from specific outcomes), but it requires careful work to ensure the *ex ante* test remains contractualist rather than consequentialist.

