prompt: |-
  So I'm taking a philosophy of mind course and we're allowed to do our final paper on fiction if we engage the actual theory seriously, and I want to do Peter Watts' Blindsight, because it seems like the most on-the-nose novel ever written for this exact debate. Quick plot setup so we're on the same page: aliens show up (the "Firefall"), the ship Theseus goes out to meet them with its crew of transhuman weirdos -- Siri Keeton the narrator who had half his brain cut out as a kid and now reads people like instruments instead of feeling anything, the linguist with her four surgically separated personalities, and Jukka Sarasti, the resurrected vampire who nominally commands the mission. The aliens (the Scramblers, inside the thing called Rorschach) turn out to be vastly smarter than us and completely non-conscious, and the book's thesis is basically that consciouness is a fitness-killing accident, expensive self-talk that a properly optimized organism wouldn't bother with.

  What I want is a reading of the novel through the access/phenomenal consciousness distinction (Block) and global workspace theory. Because here's what I keep snagging on: the novel keeps saying "consciousness is useless," but a lot of what it actually shows being useless is self-reflection, empathy, inner narration, the ego -- stuff that's much closer to access consciousness or to whatever the workspace does than to raw phenomenal feel. And the actual neuropsychological blindsight (which the title is riffing on, obviously) is the paradigm case where access-ish function survives without reported phenomenality. So does the novel actually argue that qualia are the maladaptive part, or does it argue that the whole broadcasting/narrating apparatus is maladaptive, and those are different arguments with different consequences? Like, on global workspace theory the workspace and the feeling might come as a package deal, and the novel kind of depends on that to make its aliens scary -- if you could have the broadcast without the feel, or the feel without the broadcast, the Scramblers would be less special.

  Also I want you to deal with Siri, because I think he's doing weird work. He's the one human on that ship who's been partially hollowed out, and he's also the narrator, which means the only interiority we ever get from inside is from the guy the story treats as damaged. Is he a counterexample to the novel's own thesis (he's lost affect and empathy but clearly still has a what-it's-like), or is he the thesis embodied? And then the Sarasti reveal at the end, where the vampire commander turns out to be basically a puppet for the ship's AI -- the one character everyone instinctively treats as the conscious apex predator is a front for a machine. What does that do to the reader's own habits of attributing minds from behavior? Because the novel is sort of performing the other-minds problem on us.

  To be clear, dont quote the book, I've got my copy if I need exact lines, and please don't give me citations or a reading list, my professor wants my own reading not a literature review. But do hold both the novel and the theory to a high standard -- if Watts is equivocating between "no qualia" and "no self-model," say so plainly, and don't just let the novel be an illustration of the philosophy; tell me where it pushes back on the philosophy too.

  Format it like this please:

  - "The two consciousnesses" — one short paragraph setting up Block's distinction and the workspace picture, fast, like you're reminding me not teaching me
  - "Where the novel earns it" — 3 or 4 paragraphs on the scenes and moves that genuinely do philosophical work (the Scramblers, the linguist realizing Rorschach speaks without understanding, the Sarasti reveal, whatever else earns it)
  - "Where it cheats" — 2 paragraphs on where the deck is stacked, e.g. the aliens' non-consciousness is only ever inferred, plus any slide between phenomenal consciousness and access/self-narration
  - "Siri is the interesting one" — 2 paragraphs on whether he's a counterexample to the novel's thesis or its embodiment
  - "What the book adds" — 1 paragraph on what the novel gives the debate that the arguments alone don't

  Aim for maybe 1000-1300 words total. Thanks!
