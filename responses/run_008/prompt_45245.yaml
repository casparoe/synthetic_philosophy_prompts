answer: |-
  Based on the track record you provided, your friend is running a very specific, classic algorithm in population ethics. Here is the breakdown of her implicit rule, the predictions for your new cases, the rival theories that fit her past data, and the "killer case" to tell them apart.

  ### 1. The Diagnosis: What Rule Is She Running?

  Your friend is a **Person-Affecting Utilitarian with the Procreation Asymmetry** (often associated with the philosopher Jan Narveson).

  Her implicit slogan is: **"We are in favor of making people happy, but neutral about making happy people."**

  Here is how her track record maps to this view:
  *   **Case 1 (Life < 0):** *Wrong.* Creating a miserable person harms *that specific person*. (Person-Affecting Harm).
  *   **Case 2 (Great Life, Not Created):** *Not Wrong.* Failing to create a happy person harms no one, because the person never exists to be deprived. (The Asymmetry).
  *   **Case 3 (Same People, Worse Off):** *Wrong.* This harms specific, identifiable future people. (Person-Affecting Restriction).
  *   **Case 4 (Extra Great People):** *Not Better.* Adding happy people doesn't make the world "better" in an impersonal sense; it only matters if it benefits someone who already exists or will exist regardless. (Rejection of the Total View).

  ### 2. Predictions on the New Cases

  Based on the **Person-Affecting View + Asymmetry**, here is how she should logically rule:

  *   **(a) The Mediocre Child (Life > 0 but drab):**
      *   **Verdict:** **Nothing wrong.** (Like Case 2).
      *   **Reasoning:** The Asymmetry applies to all lives above the "not worth living" threshold. Since the child's life is worth living, they are not harmed by being born. Since they don't exist yet, they aren't harmed by not being born. It is a neutral act.
  *   **(b) The Depletion Policy (Different People, Worse Lives):**
      *   **Verdict:** **Not Wrong.** (The Non-Identity Problem).
      *   **Reasoning:** This is the classic Parfitian Non-Identity Problem. Since the people in the "worse" future would not have existed under the "better" policy, they are not worse off than *they* would otherwise have been. No specific person is harmed. Given her stance in Case 2 and 4 (no duty to potential people), she cannot consistently call this wrong without abandoning her Person-Affecting constraint.
  *   **(c) The Repugnant Addition (Happy + Many Barely Worth Living):**
      *   **Verdict:** **Not Better (Neutral).**
      *   **Reasoning:** If adding millions of people with *great* lives (Case 4) doesn't make the world better, adding millions with *barely worth living* lives certainly won't. She rejects the idea that headcount increases value impersonally. She likely won't call it "wrong" (since the lives are > 0), just value-neutral.

  ### 3. Alternative Rules That Fit Her Record

  There is one major rival theory that fits Cases 1–4 perfectly but will crash and burn on your new cases: **Critical-Level Utilitarianism (CLU) with a High Critical Level.**

  Imagine a utilitarian view where adding a life only adds value if its quality exceeds a specific "Critical Level" (set very high, e.g., at "Great").
  *   **Fits Case 1:** Life < 0 is below the critical level. Bad.
  *   **Fits Case 2:** Life is "Great." If the Critical Level is set *at* "Great," adding this life adds zero net value. No obligation.
  *   **Fits Case 3:** Making same people worse lowers the total value. Wrong.
  *   **Fits Case 4:** Adding "Great" lives adds zero net value (because they are just at the critical threshold). Not better.

  **Where they split:**
  *   **On Case (a) Mediocre:**
      *   *Friend (PAV):* Neutral.
      *   *CLU:* **Wrong/Bad.** (Because a mediocre life is *below* the high critical level, adding it reduces the total critical-weighted value).
  *   **On Case (b) Different People/Worse:**
      *   *Friend (PAV):* Not Wrong.
      *   *CLU:* **Wrong.** (Because the total value of the "worse" group is lower than the "better" group, even if they are different people).

  ### 4. The Killer Case (To Separate the Rules)

  To definitively prove whether she is a **Person-Affecting Theorist** or a **High Critical-Level Utilitarian**, present her with this case:

  **Case (d): The "Sub-Critical" Creation**
  > "A couple can conceive a child who will have a life that is clearly worth living (happy enough to prefer existence to non-existence), but it will be distinctly mediocre (say, 5/10 happiness). The parents would be slightly inconvenienced, but not harmed. There are no other effects."

  **Ask her:** "Is conceiving this child **morally neutral**, or is it **pro tanto bad** (a negative mark against the decision)?"

  *   If she says **"Neutral"**: She is running the **Person-Affecting View**. (Lives > 0 create no obligations and carry no penalty).
  *   If she says **"Bad/Wrong"**: She is running **Critical-Level Utilitarianism**. (Lives below the 'ideal' threshold reduce the overall value of the world, even if they are worth living).

  **Why this works:**
  Your Case (a) asks if *not* having the child is wrong. She will likely say "No" for both theories. But Case (d) asks if *having* the child is bad.
  *   The **Person-Affecting View** says creating a happy-ish person is never bad (as long as it's not suffering).
  *   **Critical-Level Utilitarianism** says creating a "mediocre" person is bad if the standard for a "good addition" is set at "Great."

  This forces her to reveal if she thinks there is an **impersonal loss of value** when a mediocre person is created (CLU), or if value is strictly tied to **harm to specific individuals** (PAV).
