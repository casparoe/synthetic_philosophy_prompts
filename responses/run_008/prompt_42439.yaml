answer: |-
  This is a fantastic topic for a law and philosophy paper. It cuts right to the bone of how legal doctrine operationalizes metaphysical concepts. You have correctly identified a genuine tension, and your doctrinal intuition is largely sound, though there is one crucial refinement needed before we build the philosophical argument.

  Here is a reconstruction of the implicit view, the doctrinal realities, and the philosophical implications, structured to help you defend it against a skeptical professor.

  ### 1. Doctrinal Calibration (The "Correction")

  Your description of the asymmetry is correct in the majority of U.S. jurisdictions, but we need to be precise about *why* the money flows the way it does.

  *   **Survival Actions:** You are right. These preserve the claim the decedent *would have had* if they had lived. Since you cannot experience pain or enjoyment after death, most jurisdictions bar "loss of enjoyment of life" or "pain and suffering" accruing *after* the moment of death. Crucially, most jurisdictions also bar the estate from recovering the decedent's **lost future earnings** in a survival action.
  *   **Wrongful Death Actions:** You are right that this compensates the survivors. However, many wrongful death statutes *do* allow recovery for "loss of financial support" or "lost earnings." **Here is the doctrinal pivot:** This is not framed as *the decedent's* loss of earning capacity (which would imply the decedent was harmed by losing the money). It is framed as *the beneficiaries'* loss of the inheritance or support they *would have received*.

  **Why this matters for your paper:** The law does not necessarily deny that the decedent lost future earnings. It denies that the *decedent's estate* has a claim to that loss. It transfers the economic value of the future to the survivors' claim. This suggests the law isn't saying "death causes no economic loss"; it's saying "the right to claim that economic loss belongs to the dependents, not the dead."

  ### 2. Reconstructing the Implicit Philosophical View

  Does the law presuppose Epicureanism, Deprivationism, or Pragmatism?

  **A. What the Practice Strictly Presupposes**
  The tort structure strictly presupposes **The Termination of Legal Subjectivity.**
  It does not necessarily commit to a metaphysical claim about whether death is bad (Epicureanism vs. Deprivationism). It commits only to the legal rule that *rights and remedies require a living subject.*
  *   **Strict Presupposition:** A dead person cannot be made whole. Compensation is a forward-looking remedy (money is for use/experience). If there is no "user," there is no compensable harm *to that user*.
  *   **Confidence:** High. This is standard legal positivism.

  **B. What the Practice "Sits Comfortably With"**
  The structure sits comfortably with a **Modified Epicureanism.**
  While the law acknowledges death is a "wrong" (via criminal law and wrongful death statutes), the *survival statute* treats the decedent as if their interest in their own future evaporates. This aligns with the Epicurean notion that "where death is, I am not." If "I" am not there to suffer the deprivation, "I" cannot sue for it.
  *   **Confidence:** Medium-High. It fits the text, but legislatures rarely cite Epicurus.

  **C. Where the Theory is Underdetermined (The Pragmatic Gap)**
  The practice is underdetermined between **Metaphysical Denial** and **Administrative Impossibility.**
  *   *Theory 1 (Metaphysical):* The law assumes death is not a harm to the decedent (Epicurean).
  *   *Theory 2 (Pragmatic):* The law assumes death *is* a harm (Deprivationist), but calculating damages for "non-existence" is impossible, and paying money to a corpse is absurd.
  *   **The Gap:** The current rules are compatible with *both* theories. A Deprivationist could argue, "Death is a harm, but tort law is the wrong tool to fix it; we fix it via criminal punishment and survivor support." Therefore, the tort rules alone do not prove the legislature adopted an Epicurean view.

  ### 3. The Counterfactual: If the Law Took Deprivationism Seriously

  If a legislature explicitly adopted the Deprivation View (à la Thomas Nagel: death is bad because it deprives the subject of the goods of life) and allowed the estate to recover for the "lost years," the damages rules would look radically different:

  1.  **The "Value of Statistical Life" (VSL) as Damages:** Courts would need to assign a monetary value to the decedent's future happiness, not just their wages. This would likely look like the VSL used in regulatory cost-benefit analysis (often $10M+), payable to the estate.
  2.  **Beneficiaries Irrelevant:** The money would belong to the *decedent's estate*. If the decedent had no family, the money would go to distant heirs or charities named in the will, not the state. Currently, if there are no statutory beneficiaries, a wrongful death claim often fails. A Deprivationist survival claim would succeed regardless of survivors.
  3.  **Hedonic Damages for the Dead:** The estate could recover for the loss of sunsets, hobbies, and experiences the decedent would have had, distinct from lost wages.
  4.  **Mitigation Issues:** You would see bizarre litigation about whether the decedent *would have* been happy. Defendants arguing, "Your client was depressed; their future life would have been net-negative, so death was a benefit." (Some courts actually touch on this in wrongful death, but a pure deprivation view would make it central to the *decedent's* claim).

  ### 4. The Criminal Law Counterpoint

  Does the harsher punishment for murder cut against your tort asymmetry thesis? **No.**

  You can resolve this by distinguishing **Retribution/Status** from **Compensation.**

  *   **Criminal Law (Retribution/Deterrence):** Punishes the *moral wrong* and the *violation of the sovereign's peace*. The state has an interest in protecting life that exceeds the individual's interest in compensation. Punishing murder more severely acknowledges the *objective* gravity of extinguishing a life, regardless of whether the *subjective* victim can feel compensated.
  *   **Tort Law (Correction/Compensation):** Aims to restore the victim to their prior position. Since restoration is metaphysically impossible for the dead, the tort system pivots to the next best thing: compensating those who were legally dependent on the victim.

  **The Synthesis:** The criminal law confirms the **Deprivation View** (death is an objective harm to the order of things), while the tort law confirms the **Limitations of Remediation** (you cannot pay a non-existent person). They are answering different questions.

  ### 5. Confidence Levels and The "Soft Spot"

  **High Confidence:**
  *   The doctrinal distinction between Survival (decedent's claims) and Wrongful Death (beneficiaries' claims).
  *   The assertion that Tort and Criminal law serve different functions (compensation vs. punishment), resolving the apparent contradiction.
  *   The description of what "Deprivationist Damages" would look like (VSL, estate-focused).

  **Medium Confidence:**
  *   The claim that the law "sits comfortably" with Epicureanism. It sits comfortably with it, but it also sits comfortably with simple administrative convenience.

  **The Single Softest Spot (Flag for your Professor):**
  I am least sure of the claim that **the exclusion of "lost future" damages in survival statutes implies a rejection of the Deprivation View.**

  *Why it's soft:* It is equally plausible that the law accepts the Deprivation View (death is a harm to the decedent) but deems that harm **incommensurable** with money. The law might say, "Yes, you lost your future, and that is a terrible harm to *you*, but money cannot fix that, so we won't pretend it can."
  *   *Defense:* If this were true, we wouldn't allow *survivors* to recover for the loss of the decedent's future earnings (framed as support). But since we do allow that (in Wrongful Death), the law *does* put a price on the future.
  *   *Vulnerability:* Your professor might argue that the Wrongful Death recovery for "loss of support" *is* the legal system's way of acknowledging the deprivation, just routing the payment through the survivors for pragmatic reasons. To win this point, you must argue that "Loss of Support" is not the same as "Loss of Life."

  ### Summary for Your Paper's Thesis

  Your strongest argument is not that the law *is* Epicurean, but that the law is **metaphysically agnostic but procedurally committed to the "Living Subject."**

  The asymmetry exists because Tort Law is designed to remedy harms *experienced* by subjects. Death ends the subject. Therefore, Tort Law treats the harm of death as a **relational harm** (harm to the network of survivors) rather than an **intrinsic harm** (harm to the decedent). Criminal Law, conversely, treats death as an **intrinsic harm** to the moral order.

  The "Soft Spot" to disclose: You cannot definitively prove the legislature *rejected* the deprivation view; you can only prove they rejected *compensating* it via the estate. The gap between "harm exists" and "harm is compensable" is where your professor will attack. Concede that gap, but argue that in law, an uncompensated harm is functionally equivalent to a non-cognizable one.
