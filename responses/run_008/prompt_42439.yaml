      *   *Wrongful Death Statutes:* Create a *new* cause of action for *beneficiaries* (spouse, kids, etc.). Damages are based on *their* loss (pecuniary loss, loss of consortium, sometimes grief).
      *   *The "Harm of Death":* The user is correct that the decedent's own loss of future life is generally not compensable in the survival action.
      *   *Exceptions/Nuance:* Some jurisdictions allow "loss of enjoyment of life" (hedonic damages) in personal injury. Do they allow it in survival actions for the period *after* death? Usually no. Some wrongful death statutes allow recovery of "loss of support" which implies lost future earnings, but that's technically the *family's* loss of financial support, not the *decedent's* loss of life.
      *   *Criminal Law:* Murder is definitely punished more severely than battery/maiming.
      *   *Correction:* The user's description is broadly accurate for the majority rule, though there are nuances (e.g., some states allow lost future earnings in wrongful death, but framed as beneficiary loss, not decedent loss). I should validate their premise while noting the "beneficiary" framing is the key doctrinal move.

