answer: |-
  This is a classic problem in the philosophy of technology, often called the "problem of virtual harm." You are struggling because you are trying to apply a **property-based framework** (who owns the pixels?) to what is actually a **meaning-based reality** (what do the pixels represent?).

  Your proposed principle ("objects aren't real, but time is") is a good start, but as you noticed, it fails the "Funeral Test." Griefing a funeral isn't harmful because of the time spent standing there; it's harmful because of the *significance* of the act.

  Here is a principle that captures your intuitions, requires you to drop a couple of inconsistent verdicts, and solves the rollback case.

  ### The Principle: Anchored Agency and Meaning
  **Virtual harm occurs when there is a non-consensual disruption of the "anchor" that connects a digital state to a real-world investment of agency, identity, or social meaning.**

  Under this principle, virtual objects are not "things," they are **records**. They are receipts for your effort, trophies of your identity, or monuments to your relationships. Harm happens when that record is altered, erased, or violated in a way that severs the connection between your real-world intent and the digital outcome.

  Here is how this principle sorts your cases, where you need to adjust your thinking, and the answer to the rollback.

  ---

  ### 1. Applying the Principle to Your Cases

  *   **The Hacked Mount (Theft):**
      *   **Why it fits:** The mount is an anchor for your friend's status, history, and potentially economic value (gold). The hacker didn't just change a database; they *hijacked the agency* of the account owner. It feels like theft because it is an **unauthorized transfer of control** over a record of investment.
      *   **Verdict:** Consistent. This is a violation of *security and agency*.

  *   **The Minecraft World (Betrayal):**
      *   **Why it fits:** The world is an anchor for creativity and memory.
      *   **The Inconsistency:** You called this "mean but not a crime," while the mount was "police matter."
      *   **Correction:** Morally, these are **equivalent harms**. The only difference is the *context of access*. The hacker broke in (trespass); the nephew's friend was invited in (betrayal). The harm to the *victim* is the same (loss of anchored meaning). You should drop the idea that one is "real" harm and the other is "just a game." Both are violations of trust and agency. The legal distinction exists only because MMO companies lobby for specific laws, not because the moral weight differs.

  *   **The In-Game Funeral (Desecration):**
      *   **Why it fits:** This breaks your "Time" principle but fits **Meaning**. The pixels weren't valuable; the *ritual* was. The griefers didn't waste time; they polluted a symbol.
      *   **Verdict:** Consistent. This is the strongest proof that the harm is about **social meaning**, not assets.

  *   **The Scam (Exploitation):**
      *   **Why it fits:** This feels different from the hack because it involves **coerced consent**. The victim *chose* to trade, but the context was rigged. It violates the norm of "fair play" that makes the game a valid arena for agency.
      *   **Verdict:** Consistent. It's a violation of *procedural integrity*.

  *   **The Corrupted Pokemon Save (Grief):**
      *   **The Inconsistency:** You said, "Losing Pokemon isn't losing anything," but you were "genuinely upset."
      *   **Correction:** **Drop the belief, keep the emotion.** Your gut reaction (grief) is the truth-teller here. The save file was an anchor for your childhood journey and narrative. Losing it *was* losing something: it was losing the *accessible record of that experience*. You are allowed to grieve a corrupted save without being irrational.

  ### 2. Which Verdicts to Drop?

  To have a clean moral framework, you need to overturn two specific intuitions:

  1.  **Drop the "Police vs. Mean" distinction between the Mount and the Minecraft world.**
      *   **Why:** If harm is about the destruction of invested meaning and agency, both are severe violations. The reason you can call the police on the mount is largely due to *corporate terms of service* and *real-money trading markets*, not inherent morality. If your nephew's friend had hacked in remotely to delete the world, it would feel much closer to the mount theft. Align these: both are serious moral violations of digital property/agency, even if only one has a legal remedy.
  2.  **Drop the statement "Losing Pokemon isn't losing anything."**
      *   **Why:** This is cognitive dissonance. You are trying to protect yourself from feeling silly by denying the value of the object. But under the **Anchored Agency** principle, the save file *is* a real thing: it is a certificate of your past labor and narrative. Acknowledging that loss is real validates your emotions.

  ### 3. The Solution: The Server Rollback

  Now, apply the **Anchored Agency and Meaning** principle to the case you are flip-flopping on: *A server rollback wipes a week of everyone's progress. No thief, no scam, no malice.*

  **The Verdict:** The players **were harmed**, but the harm is **Nullification**, not Theft.

  **The Explanation:**
  When you play for a week, you are exercising **agency**. You make choices, you overcome challenges, you build things. The server database is the *record* that validates that agency. It says, "You did this, and it matters."

  When a rollback occurs:
  1.  **Agency is Severed:** Your actions no longer have a lasting effect. The connection between your real-world effort and the digital outcome is cut.
  2.  **Meaning is Nullified:** It creates a sense of existential futility. "I did this, and now it is as if I did not."
  3.  **It is Harm:** Even though no one *stole* the progress (no one gained), the *value* of the progress was destroyed.

  **Analogy:**
  Imagine you spend a week writing a novel on a shared computer. A storm hits, the power surges, and the file reverts to last week's version.
  *   Did anyone steal your novel? No.
  *   Did anyone choose to delete it? No.
  *   Were you harmed? **Yes.** You lost the objectification of your labor.

  **Conclusion on Rollbacks:**
  Under this principle, a rollback is a **collective injury of nullification**. It is distinct from theft (which transfers value) or griefing (which maliciously corrupts meaning). It is a **systemic failure of continuity**. The players are owed an apology and restitution not because their "property" was stolen, but because their **capacity to act meaningfully within that space was temporarily revoked.**

  ### Summary
  Your gut is actually more consistent than you think. You consistently value **human meaning** over **digital code**.
  *   **The Principle:** Virtual harm is the non-consensual negation of anchored meaning and agency.
  *   **The Fix:** Admit that Minecraft deletion and Pokemon corruption are real losses, just like the mount.
  *   **The Rollback:** It is harm because it renders past agency futile.

  You aren't confused about the objects; you're confused because society hasn't caught up to the fact that **digital records are now the primary storage method for human effort.** When those records break, the effort doesn't vanish, but its *validation* does. That is a real harm.
