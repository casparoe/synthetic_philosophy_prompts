      *   *Focus:* The clash between Free Will (3) and Duty (4) regarding specific evils.
      *   *Focus:* The clash between Leibnizian Certainty (2) and Skeptical Theism (5).
      *   *Drafting thought:* Need to ensure I cite the belief numbers.
      *   *Severity 1:* (2) vs (4). If this is the best possible world, any change makes it worse. Therefore, your duty to "leave the world better" is logically impossible. You are committed to either futility or sin (making the world worse).
