prompt: |-
  I'm a high school senior taking an elective in political psychology, and a few weeks ago we covered moral foundations theory — the framework associated with Jonathan Haidt and his colleagues, on which moral judgment draws on several distinct foundations (care, fairness, loyalty, authority, and sanctity), with the well-known finding that people on the political left tend to weight the first two heavily while people on the right draw on the whole set roughly evenly. My teacher mentioned in passing that some people think this asymmetry bears on which side is actually *correct* about moral questions, and then had to move on. Since then, the arguments this has produced at my lunch table have shown me that my friends divide on that meta-question in ways that don't track their party affiliations at all — and half the time people don't notice which position they're committed to until they contradict themselves two minutes later. So I'd like you to write me an instrument that sorts people by what they believe about the meta-question, not by which party they like.

  Specifically: a "which position do you actually hold?" quiz of eight to ten questions. Each question should be a concrete case with two or three answer options, phrased so that someone can answer it without knowing which position it feeds into — never just "do you think the right is correct?" or "do you trust Haidt?" Please build in at least these cases: (i) a case in which one of your own firmly held moral beliefs turns out to have been produced by an evolutionary process that selected it for coordinating groups, not for tracking any truth — does that by itself give you reason to lower your confidence in the belief?; (ii) a case contrasting two people, one of whom feels moral reactions in five distinct channels and the other in only two — is the broader palette like having more working senses (more access to the facts) or like having more ways of being wrong (more noise)?; (iii) a case about an asymmetry discovered by a measuring instrument whose designers already had a stake in what counts as a moral concern; and (iv) a case about what to conclude if all political-moral intuitions, left and right alike, turn out to be generated by coalitional psychology. End with a scoring key mapping answer patterns onto positions.

  The leaves I need on the tree: strict quietism, where the psychology is purely descriptive and can never adjudicate; symmetric debunking, where the genealogy deflates both sides' political moralizing equally; vindication by breadth, where the wider foundation set amounts to a better-attuned moral perception; a harm-and-fairness-centered vindication, which reaches the opposite verdict; and the constructed-asymmetry view, on which the theory's list of foundations was stipulated with a stake in the outcome, so its asymmetry finding cannot adjudicate — for reasons quite different from quietism. Where the combinations of answers leave cells unoccupied, please note that and say whether you think the cell is empty because the view is incoherent, unattractive, or just unexplored. And please flag, rather than paper over, any pair of positions the quiz can't genuinely separate — my own suspicion is that strict quietism and the view that the psychology is real evidence but far too weak to move anyone will collapse into one cell, but I'd rather you tell me honestly if the instrument can't split them. Throughout the scoring key, please say how confident you are in each mapping, and single out the one question or branch you are least sure actually divides the positions; I would much rather know where the instrument is shaky than receive it as gospel.
reasoning: |-
  Here's a thinking process that leads to the suggested instrument:

  1.  **Analyze the Request:**
      *   **Target Audience:** High school senior (smart, engaged, noticing nuance in peer discussions).
      *   **Topic:** Moral Foundations Theory (MFT) and its meta-ethical implications (does the psychological asymmetry imply moral truth?).
      *   **Task:** Create an 8-10 question quiz/instrument.
      *   **Constraint 1 (Content):** Questions must be concrete cases/scenarios, not abstract meta-questions (e.g., no "Do you trust Haidt?").
      *   **Constraint 2 (Required Cases):**
          1.  Evolutionary origin vs. truth-tracking (genealogical debunking).
          2.  Five channels vs. two channels (breadth vs. noise).
          3.  Instrument bias (designer stake).
          4.  Universal coalitional psychology (all intuitions are tribal).
      *   **Constraint 3 (Target Positions/Leaves):**
          1.  Strict Quietism (Psychology is descriptive only, never adjudicates).
          2.  Symmetric Debunking (Genealogy deflates both sides equally).
          3.  Vindication by Breadth (More foundations = better perception).
          4.  Harm/Fairness Vindication (Fewer foundations = refined/truer morality).
          5.  Constructed Asymmetry (The theory itself is biased/stipulated).
      *   **Constraint 4 (Scoring Key):** Map answers to positions. Note empty cells (incoherent/unattractive/unexplored). Flag positions the quiz can't separate (e.g., Quietism vs. Weak Evidence). Express confidence levels. Identify the shakiest question.
      *   **Tone:** Intellectual, honest, nuanced, avoiding "gospel" certainty.

  2.  **Deconstruct the Positions:**
      *   *Strict Quietism:* "Is" never implies "Ought." Psychology tells us how we think, not what is right.
      *   *Symmetric Debunking:* If morals come from evolution/tribalism, *nobody* gets to claim objective truth. Left and Right are both just adapting.
      *   *Vindication by Breadth:* Having more moral "senses" (Conservative/Right profile) captures more moral reality. Like seeing color vs. black/white.
      *   *Harm/Fairness Vindication:* Having fewer moral "senses" (Liberal/Left profile) means filtering out superstition/tribalism. Like removing optical illusions.
      *   *Constructed Asymmetry:* The test is rigged. Haidt defined "morality" to include loyalty/authority to make conservatives look complex.

  3.  **Drafting the Questions (Iterative Process):**
      *   *Goal:* 8-10 questions. Concrete scenarios.
      *   *Requirement Check:* Need to cover the 4 specific cases requested.

      *   *Case (i) Evolutionary Debunking:* Need a scenario where a belief is useful for group cohesion but maybe not "true."
          *   *Draft:* Imagine you believe eating pork is wrong. You find out this belief evolved to keep tribes distinct. Does that make it wrong?
          *   *Refinement:* Make it more general. A belief about respect for elders.

      *   *Case (ii) 5 vs. 2 Channels:* Need a sensory analogy.
          *   *Draft:* Person A hears 5 notes, Person B hears 2. Who hears the song better?
          *   *Refinement:* Use a "moral detector" analogy.

      *   *Case (iii) Instrument Bias:* Need a scenario where the ruler is made by one side.
          *   *Draft:* A thermometer made by a cold-weather person says warm-weather people are sick.
          *   *Refinement:* A survey about "health" designed by people who think only cardio matters, ignoring strength.

      *   *Case (iv) Universal Coalitional:* All morals are just team sports.
          *   *Draft:* If everyone is just picking teams, does anyone win?
          *   *Refinement:* If both sides are just protecting their tribe, is there a "correct" team?

      *   *Filling the rest:* Need questions that distinguish Quietism from Debunking, and Breadth from Harm/Fairness.
          *   *Distinguishing Quietism:* Does psychological data *ever* change your mind about right/wrong?
          *   *Distinguishing Constructed Asymmetry:* Do you think the categories themselves are the problem?

  4.  **Developing the Questions (Finalizing Text):**
      *   *Q1 (Evolution/Truth):* The "Elder Respect" scenario. (Required Case i)
      *   *Q2 (5 vs. 2):* The "Moral Spectrometer" scenario. (Required Case ii)
      *   *Q3 (Instrument Bias):* The "Wellness Survey" scenario. (Required Case iii)
      *   *Q4 (Universal Tribalism):* The "Team Jersey vs. Team Blue" scenario. (Required Case iv)
      *   *Q5 (Quietism vs. Evidence):* The "Brain Scan" scenario. (Does data override intuition?)
      *   *Q6 (Refinement vs. Loss):* The "Filter" scenario. (Is ignoring authority wisdom or blindness?)
      *   *Q7 (Definition of Morality):* The "Dictionary" scenario. (Who defines the word?)
      *   *Q8 (Actionability):* The "Policy" scenario. (Should we design laws based on this?)

  5.  **Designing the Scoring Key:**
      *   This is the hardest part. I need to map combinations of answers to the 5 leaves.
      *   *Quietism:* Will likely say psychology doesn't determine truth (Q1: No change, Q5: Data irrelevant).
      *   *Symmetric Debunking:* Will say evolution undermines *everyone* (Q1: Lower confidence, Q4: No winner).
      *   *Vindication by Breadth:* Will say 5 channels is better (Q2: More senses).
      *   *Harm/Fairness Vindication:* Will say 2 channels is refined (Q2: Less noise).
      *   *Constructed Asymmetry:* Will say the test is rigged (Q3/Q7: Definitions biased).

      *   *Empty Cells:* Some combinations might be logically inconsistent. E.g., believing the test is rigged but also believing the 5-channel view is objectively better based on that test.
      *   *Indistinguishable Positions:* The prompt specifically asks to flag if Quietism and "Weak Evidence" collapse. I need to be honest about this.

  6.  **Refining the Output:**
      *   Ensure the tone is appropriate for a high school senior (respectful, challenging, not condescending).
      *   Make sure the "Required Cases" are clearly identifiable.
      *   Ensure the Scoring Key includes confidence levels and the "Shakiest Question" flag as requested.
      *   Check the "Empty Cells" analysis.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Are the questions too abstract?
      *   *Fix:* Ground them in analogies (thermometers, taste buds, maps).
      *   *Critique:* Is the scoring key too deterministic?
      *   *Fix:* Use a "weighting" system or profile matching rather than simple A/B counting, acknowledging overlap.
      *   *Critique:* Did I address the "Quietism vs. Weak Evidence" collapse?
      *   *Fix:* Explicitly discuss this in the limitations section of the scoring key.
      *   *Critique:* Are there 8-10 questions?
      *   *Fix:* I have 8 drafted. I'll add two more to ensure robustness on the "Constructed Asymmetry" vs "Quietism" distinction.
      *   *Addition:* Q9 (The "Alien" perspective) and Q10 (The "Reform" question).

  8.  **Final Polish:** Check against all constraints one last time.
      *   8-10 questions? Yes (10).
      *   Concrete cases? Yes.
      *   4 Required Cases included? Yes (Q1, Q2, Q3, Q4).
      *   5 Target Positions mapped? Yes.
      *   Empty cells noted? Yes.
      *   Confidence levels included? Yes.
      *   Shakiest question flagged? Yes.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is an instrument designed to sort respondents by their meta-ethical stance on Moral Foundations Theory (MFT), rather than their political affiliation. It consists of ten concrete scenarios. Following the quiz, you will find the scoring key, an analysis of empty cells, and a candid assessment of the instrument's limitations.

  ***

  # The Moral Meta-Question Inventory

  **Instructions:** Read each scenario carefully. Choose the option that best reflects your intuitive reaction to the *logic* of the case, not necessarily your political views. There are no right or wrong answers.

  **1. The Ancestor Alarm (Required Case: Evolutionary Origin vs. Truth)**
  Imagine you hold a firm belief that "disrespecting elders is inherently wrong." You then read a study showing this belief evolved not because it is morally true, but because tribes that honored elders survived better than those that didn't. The belief is a "social glue."
  *   **A.** This explains *why* I have the belief, but doesn't change whether it's true.
  *   **B.** This makes me suspect the belief is just a survival trick, not a moral truth.
  *   **C.** This suggests the belief is useful, which is the only kind of "truth" morality needs.

  **2. The Spectrometer (Required Case: 5 Channels vs. 2 Channels)**
  Person X has a moral "spectrometer" that detects five distinct types of moral light (Care, Fairness, Loyalty, Authority, Sanctity). Person Y has a broken spectrometer that only detects two (Care, Fairness). Person Y claims the other three types of light don't exist.
  *   **A.** Person X has more data and is likely seeing more of reality.
  *   **B.** Person Y is filtering out noise/illusions; the other three "lights" are likely distortions.
  *   **C.** The device measures reactions, not light. Neither person is seeing "reality."

  **3. The Wellness Survey (Required Case: Instrument Bias)**
  Researchers design a survey to measure "Total Health." They define health strictly as "Cardiovascular Efficiency." They find that Weightlifters score lower than Runners. They conclude Runners are healthier humans.
  *   **A.** The conclusion is flawed because the definition of health was rigged from the start.
  *   **B.** The conclusion is valid; if cardio is the core of health, the metric works.
  *   **C.** "Health" is too subjective to be measured by any single instrument.

  **4. The Jersey Swap (Required Case: Universal Coalitional Psychology)**
  Suppose it turns out that *all* moral intuitions (both the 2-channel and 5-channel ones) are just psychological mechanisms for picking teams and defeating rivals. There is no "view from nowhere."
  *   **A.** Then morality is just team sports, and no side is objectively "correct."
  *   **B.** Even if it starts as team-picking, one team's rules might still produce better outcomes.
  *   **C.** This is impossible; at least one side must be tracking real moral facts.

  **5. The Brain Scan Override**
  You feel strongly that Action Z is wrong. A neuroscientist shows you that your brain lights up in the "disgust" pattern when thinking of Z, but in the "reasoning" pattern when thinking of similar actions you approve of.
  *   **A.** I need to rethink Action Z; my intuition might be just disgust in disguise.
  *   **B.** My intuition is evidence too; the scan describes the feeling, not the fact.
  *   **C.** This proves morality is just biology, so "wrong" is the wrong word to use.

  **6. The Blindfolded Judge**
  A judge decides cases by ignoring the status/rank of the people involved (Authority foundation) and ignoring group membership (Loyalty foundation), focusing only on harm and contracts.
  *   **A.** This judge is more impartial and just.
  *   **B.** This judge is blind to important social realities that keep order.
  *   **C.** This judge is following a specific code, not necessarily a universal one.

  **7. The Dictionary Definition**
  Two groups argue over the word "Morality." Group 1 says it means "Minimizing Suffering." Group 2 says it means "Upholding the Sacred Order."
  *   **A.** We need to pick one definition before we can argue about who is right.
  *   **B.** Group 1 is correct; Group 2 is using the word incorrectly.
  *   **C.** Both are describing different parts of the same elephant.

  **8. The Alien Anthropologist**
  An alien observes humans. It sees that Liberals and Conservatives have different moral matrices. The alien asks: "Which matrix allows the species to survive longer?"
  *   **A.** That's a biological question, not a moral one.
  *   **B.** Survival is the only objective metric we have, so the winner is "right."
  *   **C.** Both matrices might be adaptive in different environments.

  **9. The Calibration Check**
  You discover that the researchers who identified the "Five Foundations" donate to one political party, but the data shows the *other* party uses more foundations.
  *   **A.** The data is suspicious; they might have categorized things to make the other side look complex.
  *   **B.** The data stands on its own; the researchers' biases don't change the numbers.
  *   **C.** It shows that even researchers can't escape their own moral matrices.

  **10. The Policy Prescription**
  Based on MFT, a government proposes designing laws that appeal to *all* five foundations to ensure stability.
  *   **A.** We should do this; it respects how people actually think.
  *   **B.** We should not; laws should be based on rational fairness, not psychological quirks.
  *   **C.** We can do this pragmatically without claiming it's "morally true."

  ***

  # Scoring Key & Position Mapping

  To use this key, tally the respondent's choices. Note that this instrument maps *logical commitments*, not political identity. A Liberal can score as a "Vindication by Breadth" advocate, and a Conservative can score as a "Symmetric Debunker."

  ### The Five Leaves (Positions)

  **1. Strict Quietism**
  *   **Core Claim:** Psychology describes *is*; morality is *ought*. Never the twain shall meet.
  *   **Typical Pattern:** Heavy selection of **C** options (especially Q2, Q5, Q8). Denies that psychological mechanisms can adjudicate truth.
  *   **Key Indicators:** Q2-C, Q5-B, Q8-A.
  *   **Confidence:** High. This position is distinct in its refusal to let empirical data touch normative claims.

  **2. Symmetric Debunking**
  *   **Core Claim:** If morality is evolutionary/tribal, *everyone* is debunked. No one gets to claim objective truth.
  *   **Typical Pattern:** Heavy selection of **A** in Q1 and **A** in Q4. Willing to accept the genealogy but rejects the truth-claim for all sides.
  *   **Key Indicators:** Q1-B, Q4-A, Q5-C.
  *   **Confidence:** High. The combination of accepting the evolutionary explanation (Q1-B) while denying it yields truth (Q4-A) is unique to this view.

  **3. Vindication by Breadth**
  *   **Core Claim:** Access to more foundations is like having more senses; it captures more moral reality.
  *   **Typical Pattern:** Selection of **A** in Q2 and **B** in Q6. Views the 5-foundation profile as more "attuned."
  *   **Key Indicators:** Q2-A, Q6-B, Q7-C.
  *   **Confidence:** Medium-High. Distinguishable from Quietism because it makes a truth claim (Q2-A).

  **4. Harm-and-Fairness Vindication**
  *   **Core Claim:** The 2-foundation profile is a *refinement*, filtering out superstition/tribalism. Less is more.
  *   **Typical Pattern:** Selection of **B** in Q2 and **A** in Q6. Views the 5-foundation profile as "noise" or "bias."
  *   **Key Indicators:** Q2-B, Q6-A, Q3-B (accepts the "Cardio" metric as core).
  *   **Confidence:** Medium-High. This is the mirror of Breadth. The tension lies in Q3: they must believe their 2 foundations are the "Cardio" (core), not a bias.

  **5. Constructed Asymmetry**
  *   **Core Claim:** The theory itself is rigged. The list of foundations was stipulated to create the asymmetry.
  *   **Typical Pattern:** Heavy selection of **A** in Q3 and **A** in Q9. Focuses on the design of the instrument, not the result.
  *   **Key Indicators:** Q3-A, Q9-A, Q7-A.
  *   **Confidence:** Medium. This can look like Quietism, but it is more aggressive: it attacks the *validity* of the theory, not just its relevance.

  ***

  # Analysis of Empty Cells & Limitations

  ### 1. The "Quietism vs. Weak Evidence" Collapse
  **Status:** **Confirmed Collapse.**
  You suspected that *Strict Quietism* and the view that *Psychology is Real Evidence but Too Weak to Move Anyone* would occupy the same cell. You are correct.
  *   **Reasoning:** In a 10-question instrument, a respondent who says "Psychology is evidence, but I ignore it" will answer almost identically to someone who says "Psychology is never evidence." Both will reject Q5 (Brain Scan Override) and Q8 (Alien Anthropologist).
  *   **Verdict:** This instrument cannot separate them. To do so would require a question asking "Is it *possible* in principle for psychology to change your mind?" vs "Is it *practically* likely?" I chose not to include that distinction because respondents are notoriously bad at assessing their own openness to principle.
  *   **Confidence in Mapping:** Low for this specific distinction. Treat these two views as a single cluster.

  ### 2. The "Vindication by Breadth" vs. "Pragmatist" Empty Cell
  **Status:** **Logically Unstable.**
  There is a potential cell where a respondent answers Q2-A (5 channels is more data) but Q10-B (We should not design laws based on this).
  *   **Reasoning:** If you believe the 5-channel view sees *more moral truth* (Vindication), it is incoherent to argue we should *not* build laws around that truth (Pragmatism).
  *   **Verdict:** This cell is likely empty because the view is **incoherent**. If the breadth is truth-tracking, it is prescriptive. If it is not prescriptive, it is not truth-tracking.
  *   **Confidence:** High.

  ### 3. The "Constructed Asymmetry" vs. "Symmetric Debunking" Overlap
  **Status:** **Difficult Separation.**
  Both positions are skeptical of the theory's conclusions.
  *   **Reasoning:** A Symmetric Debunker thinks the theory is true but deflating (We are all tribal). A Constructed Asymmetry advocate thinks the theory is false/rigged (The categories are biased).
  *   **Verdict:** They are separated by Q9 (The Calibration Check). The Debunker says "Bias doesn't change the numbers" (Q9-B). The Constructed Asymmetry advocate says "The data is suspicious" (Q9-A). However, respondents often conflate "the data is biased" with "the conclusion is deflating."
  *   **Confidence:** Medium. This is the **Shakiest Branch** of the tree.

  ### 4. The "Harm/Fairness Vindication" Cell
  **Status:** **Attractive but Rare.**
  *   **Reasoning:** This position requires believing that ignoring Authority/Loyalty is a *feature*, not a bug (Q6-A), while also accepting that morality is objective enough to be "vindicated" (rejecting Q4-A).
  *   **Verdict:** This cell is not empty, but it is **unattractive** to many because it requires a strong commitment to moral realism (against Debunking) while admitting that half the human species is "morally blind" (against Breadth).
  *   **Confidence:** Medium.

  ***

  # Instrument Reliability Flag

  **The Shakiest Question:** **Question 3 (The Wellness Survey).**
  *   **Why:** This question is intended to isolate the *Constructed Asymmetry* view (the test is rigged). However, respondents often answer this based on their feelings about "Health" rather than the structural analogy. A respondent who believes "Cardio *is* the core of health" (Q3-B) might be a Harm/Fairness Vindicator, OR they might just be a fitness enthusiast who didn't engage the analogy.
  *   **Impact:** This introduces noise into the separation between *Harm/Fairness Vindication* and *Constructed Asymmetry*.
  *   **Honesty Check:** If a respondent scores high on *Constructed Asymmetry* but also answers Q3-B, their result is unreliable. They may not have understood the analogy.

  **Final Note on "Gospel":**
  This instrument assumes respondents answer consistently. As you noted at your lunch table, people often contradict themselves. A respondent who chooses Q1-B (Evolution debunks truth) but Q6-A (My specific intuition is still right) is logically inconsistent. The scoring key forces them into a box, but in reality, they occupy a state of **Unreflective Realism**. The quiz cannot measure unreflectiveness; it only measures the position they *aspire* to hold when prompted. Use the results as a map of their philosophical aspirations, not their cognitive reality.
