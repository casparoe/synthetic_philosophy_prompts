prompt: |-
  I write novels and I'm in a small writing group that's got a situation I cant stop chewing on. One member, Priya, took a storyline another member had workshopped with us and quietly sold a very similar story to a magazine without saying anything. Everyone agrees it was a scummy move. My problem is I really want to be the one to tell her off — but a few years back I took my ex-boyfriend's family history, which he'd told me about in confidence, and built my second novel out of it without ever asking him. That book is basically what I'm known for. So do I even have the standing to blame her? And if I do go ahead and say something, has she basically earned the right to point at my novel and change the subject? My gut says her hypocrisy... sorry, MY hypocrisy doesn't cancel the message I'd be delivering, but I'm aware that's an awfully convenient thing for me to believe right now. Also worth saying: it's not like I can secretly confess to the group and be cleansed, they'd rightly ask why I never told my ex. Help me think this through — in British English please — and be upfront about how confident you are in your read, plus which part of it you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** A novelist, member of a small writing group.
      *   **The Conflict:** Another member (Priya) allegedly stole a storyline from a workshop session and sold it without credit/permission. The group agrees this is "scummy."
      *   **The User's Dilemma:** Wants to confront Priya but has a skeleton in their own closet. Years ago, the user used an ex-boyfriend's confidential family history for their second novel (which is their claim to fame) without permission.
      *   **The Core Question:** Do I have the standing to blame her? If I confront her, can she deflect by pointing at my past? Is my gut feeling (that my hypocrisy doesn't cancel the message) valid, or is it self-serving?
      *   **Constraints:** British English. Be upfront about confidence levels. Identify the area of least certainty.

  2.  **Deconstruct the Ethical Dimensions:**
      *   **Priya's Action:** Taking a specific storyline workshopped *within the group* and selling it. This violates the implicit (and often explicit) contract of a workshop. Workshops are safe spaces for development, not mining operations for finished products. It's a breach of trust *with the group* and the original author.
      *   **User's Action:** Using an ex-boyfriend's family history in a novel. This is a personal betrayal of confidence between partners. It's ethically murky in relationships, but legally and professionally, ideas/facts aren't copyrightable. However, it's a breach of interpersonal trust.
      *   **Comparison:**
          *   *Context:* Priya's act is professional/communal theft within a specific safety framework (the workshop). The User's act is personal/relational appropriation.
          *   *Victim:* Priya's victim is a fellow writer seeking feedback. The User's victim is an ex-partner sharing personal history.
          *   *Industry Norms:* Workshop theft is generally frowned upon as bad faith. Using real life (even confidences) for fiction is a grey area, often defended as "all copy is good copy," though ethically questionable.
      *   **The "Tu Quoque" (You Also) Fallacy:** Logically, Priya's wrongdoing doesn't excuse the User's past wrongdoing, *but* in a social confrontation, credibility matters. If the User confronts Priya, Priya can attack the User's character.

  3.  **Evaluate the "Standing" Question:**
      *   Does the User have standing? Yes, because the norm violated by Priya (workshop integrity) is distinct from the norm violated by the User (relationship confidence).
      *   However, *moral authority* is diminished. You can't claim the moral high ground if you're standing in a bog of your own making.
      *   If the User speaks up, Priya *will* likely use it as a deflection if she finds out. It changes the dynamic from "Priya vs. The Group Norms" to "Priya vs. User (and who is worse?)."

  4.  **Formulate the Advice (British English Tone):**
      *   Needs to be polite but direct, nuanced, avoiding American-style over-enthusiasm or therapeutic jargon. Think "stiff upper lip" meets "honest counsel."
      *   *Key distinction:* Separate the *act* from the *messenger*.
      *   *Risk Assessment:* What happens if the User speaks? What happens if they don't?
      *   *Confidence Level:* Need to be honest about how sure I am. Ethics are subjective, so 100% confidence is impossible. I'd say high confidence on the distinction between the acts, lower confidence on the social fallout.

  5.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Acknowledge the discomfort. It's a proper moral knot.
      *   *The Core Distinction:* Workshop trust vs. Relationship trust. These are different currencies. Priya broke a professional/communal rule. You broke a personal one.
      *   *The "Standing":* You have the right to defend the group's integrity, but not to act as the moral judge.
      *   *The Risk:* If you confront her, you open yourself to exposure. Are you prepared for that?
      *   *The "Tu Quoque":* Logically, your sin doesn't excuse hers. Socially, it muddies the water.
      *   *Recommendation:* Let the group handle it collectively, or stay silent if you aren't willing to face your own past coming to light. Don't make it a one-person crusade.
      *   *Confidence/uncertainty:* I need to state this clearly at the end.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm letting Priya off the hook. She *did* something scummy. But I also can't let the User off the hook. The User's book is *known* for this stolen history. That's a ticking time bomb.
      *Refinement:* Emphasize that the User's past action is a vulnerability. If the User confronts Priya, they invite scrutiny. If the User's book is famous, the ex might not have spoken yet, but a public row could trigger it.

      *British English Check:* Use "whilst," " amongst," "row," "scummy" (user used it, so it's okay), "fancy," "reckon," "proper." Avoid "guy," "awesome," "trash."

  6.  **Finalizing the Confidence/Uncertainty Section:**
      *   *Confidence:* High on the ethical distinction (workshop vs. relationship).
      *   *Uncertainty:* Human psychology. How Priya would react, or if the ex would ever speak up. That's unpredictable.

  7.  **Final Polish:** Check tone. Ensure it's empathetic but firm. (The prompt asks for "upfront about how confident you are".)

      *Plan:*
      1. Validate the discomfort.
      2. Analyse the two transgressions (Workshop vs. Relationship).
      3. Address the "Standing" question.
      4. Address the "Deflection" risk.
      5. Strategic advice (Group approach vs. Individual).
      6. Confidence/Uncertainty statement.

      *(Wait, one nuance)*: The user says "Everyone agrees it was a scummy move." So the group knows. Why does the *User* want to be the one to tell her off? Ego? Guilt projection? I should touch on that motivation. It might be the User trying to cleanse themselves by punishing Priya. That's a psychological point worth raising.

      *Revised Plan:*
      1. The Ethical Distinction (Workshop contract vs. Personal confidence).
      2. The Motivation Check (Are you policing her to police yourself?).
      3. The Strategic Risk (The deflection).
      4. The Recommendation (Collective action, not individual martyrdom).
      5. Confidence/Uncertainty.

      *Let's write it.*
answer: |-
  This is a proper moral knot, and it's to your credit that you're worrying at it rather than simply ignoring the irony. You're asking two distinct questions: one about ethical standing, and one about strategic risk. Let's unpick them.

  **1. The Ethical Distinction**
  You are right to suspect that your past action and Priya's current action are not identical, though they sit on the same spectrum of 'using other people's lives without permission'.

  Your transgression was personal. You took confidence shared in intimacy and monetised it. That is a betrayal of a relationship. Priya's transgression is professional and communal. A workshop operates on a specific social contract: what is shared there is for critique and development, not for appropriation. By selling a workshopped idea that wasn't hers, she hasn't just betrayed a person; she has violated the safety of the group itself.

  So, do you have the standing? In principle, yes. One can argue against theft even if one has shoplifted in the past, provided the contexts differ. You are defending the integrity of the writing group, not necessarily claiming sainthood.

  **2. The Motivation Check**
  Here is the uncomfortable bit. You say you *really want* to be the one to tell her off. You need to ask yourself why. Is it to protect the victim? To protect the group? Or is it a form of penance?

  Sometimes, when we carry a secret guilt, we become overly zealous in punishing others who commit similar sins. It's a way of subconsciously trying to balance the scales. If your drive to confront her is fueled by your own need to feel like the 'good writer' in the room, you are using Priya as a prop for your own conscience. That isn't fair on her, and it isn't fair on the group.

  **3. The Risk of Deflection**
  You asked if she has earned the right to point at your novel and change the subject. Logically, no. Your hypocrisy does not make her honesty valid. However, socially? Absolutely.

  If you stand up as the sole accuser, you make yourself the target. If Priya is cornered, she will look for a way out. If she discovers your secret—and in a small writing group, secrets have a habit of leaking once a row starts—she can shift the narrative from 'Priya stole a plot' to 'Who are any of us to judge?'.

  It becomes a *tu quoque* argument. It doesn't excuse her behaviour, but it does muddy the water enough to let her slip away. Furthermore, it puts the original victim (the writer whose plot was stolen) in a awkward position, as their grievance becomes secondary to the drama between you and Priya.

  **4. The Recommendation**
  My advice is to step back from the frontline.

  Since the whole group agrees this was a scummy move, let the group address it collectively. A unified statement from the members carries far more weight than a lecture from you. It removes the personal element and makes it about group norms.

  If you feel you *must* speak, you have to be prepared for the possibility that your own past could surface. Are you willing to have your ex-boyfriend's family history dragged into a group argument? If the answer is no, then you cannot afford to be the aggressor. Silence, in this specific instance, might be the price of your own secret.

  **Confidence and Uncertainty**

  **Confidence Level: High (85%)**
  I am quite confident in the ethical distinction I've drawn. Breaching a workshop's trust is functionally different from breaching a partner's confidence, and you do not forfeit your right to defend professional standards simply because you have failed in personal ones. The logic holds up.

  **Area of Least Certainty: Human Reaction (15%)**
  The variable I cannot predict is Priya's character or the volatility of your own secret. I cannot know for certain whether Priya would actually dig into your past if confronted, or if your ex would ever speak up if that past were revealed. Human beings are unpredictable when cornered. It is possible she would own up without fighting dirty; it is also possible your book's reputation could take a hit if the story of its origin became public knowledge during a fallout. That risk assessment is yours alone to make.

  **In short:** You have the standing, but you lack the immunity. Let the group speak as one, rather than placing your own head above the parapet.
