answer: |-
  **JOINT STATEMENT ON POPULISM AND POPULAR SOVEREIGNTY**
  **Submitted by:** [Member A] and [Member B]
  **Context:** Adversarial Collaboration Seminar, Political Theory Reading Group
  **Date:** October 2023

  ### I. Points of Agreement

  We, the undersigned, acknowledge that while our theoretical frameworks diverge significantly regarding the normative status of populism, we share a common diagnosis of the current democratic crisis. We agree on the following substantive claims:

  1.  **The Necessity of Mediation:** There is no unmediated access to the popular will. All democratic politics requires institutions, parties, or movements to aggregate, filter, and articulate demands. "Direct democracy" without representation is a conceptual impossibility in complex societies.
  2.  **The Reality of Democratic Grievance:** Complaints regarding the unresponsiveness of established institutions are not inherently irrational or manipulative. When elites dismiss demands as merely "populist," they often obscure legitimate failures of representation and substantive policy disagreements.
  3.  **The Partiality of Representation:** All political representation is partial. No institution can represent the empirical totality of the population simultaneously without remainder. Claims to represent "everyone" equally are often masks for specific policy agendas.
  4.  **The Status of Referendums:** Referendums are neither pure expressions of the general will nor mere advisory theater. They are specific institutional tools that crystallize preferences at a specific moment, but they require interpretation and implementation by representative bodies to remain compatible with constitutional order.
  5.  **The Risk of Exclusion:** Democratic politics inevitably involves drawing boundaries (who votes, what is on the agenda). However, we agree that when political actors treat their opponents as *illegitimate* enemies rather than *loyal* opposition, the stability of the democratic regime is threatened.

  ### II. Precise Disagreements

  We disagree on the classification and evaluation of the phenomena described above. We stipulate the following formulations to ensure our disagreement is substantive rather than terminological:

  1.  **On the Ontology of "The People":**
      *   **Member A (Populist Theory):** Contends that "the people" is a *performative political subject* that only comes into existence through the act of articulation. There is no "people" prior to the political claim. Therefore, mobilizing a division between "the people" and "the elite" is the fundamental logic of politics itself, not a distortion of it.
      *   **Member B (Liberal Theory):** Contends that "the people" is a *pluralist empirical entity* that exists prior to specific political claims. While representation mediates this entity, political actors must acknowledge the internal diversity of the population. Claiming that one subset *is* the whole people is a factual and moral error, not an ontological necessity.

  2.  **On the Definition of Populism:**
      *   **Member A:** Defines populism as a *political logic* that constructs a frontier between an underdog majority and a powerful minority. On this view, populism is a neutral or positive democratic tool for re-politicizing issues that technocrats have depoliticized.
      *   **Member B:** Defines populism as a *moralistic claim to exclusive representation*. On this view, populism is distinct from other forms of mobilization because it denies the legitimacy of opposition. It is a specific pathology, not a universal logic.

  3.  **On the Normative Evaluation:**
      *   **Member A:** Argues that the primary threat to democracy currently comes from *post-democratic elitism* (the removal of issues from public contestation). Populist mobilization is often a necessary corrective to restore sovereignty.
      *   **Member B:** Argues that the primary threat to democracy currently comes from *anti-pluralist mobilization* (the erosion of checks and balances). Populist mobilization often accelerates this erosion by conflating the movement with the state.

  ### III. Cruxes and Empirical Predictions

  We identify two specific cruxes where our theoretical differences yield divergent expectations about real-world events. We agree to treat the following case studies as evidence bearing on these cruxes.

  **Crux 1: The Ontological Status of the Mandate (Discovery vs. Construction)**
  *Question:* Does a referendum result reveal a pre-existing preference that institutions are obstructing, or does the result create a new political reality that must be constructed through further articulation?
  *Case Study:* The 2016 UK EU Referendum and the subsequent 2019 General Election ("Get Brexit Done").
  *   **Member A Prediction:** The "Will of the People" did not exist as a coherent policy preference on June 24, 2016. It was successfully *constructed* between 2016 and 2019 by actors who simplified the demand (Leave = Deal or No Deal) and attacked Parliament as an obstructing elite. The 2019 election victory proves that successful articulation *creates* the sovereign will, validating the populist strategy of bypassing intermediate institutions.
  *   **Member B Prediction:** The referendum revealed a fragmented preference (52% for a vague concept). The claim that this constituted a singular, binding mandate for a specific policy (No Deal/Hard Brexit) was a *falsification* of the popular will. The 2019 election did not validate the "will," but rather validated a specific party's ability to exploit the ambiguity. The conflict between Parliament and the Executive in 2019 was not "elite obstruction" but a necessary pluralist check on a claim to exclusive representation that ignored the 48% and the complexity of the 52%.

  **Crux 2: The Legitimacy of Exclusive Representation**
  *Question:* Is claiming to be the *sole* legitimate representative of the people a necessary feature of democratic leadership or a violation of democratic norms?
  *Case Study:* The 2019 Prorogation of the UK Parliament.
  *   **Member A Prediction:** The prorogation attempt was a high-stakes moment of *hegemonic contestation*. The Executive claimed Parliament had lost touch with the "real people." Whether successful or not, this move was a legitimate attempt to resolve a deadlock where intermediate institutions were paralyzing the sovereign decision. It highlights the inevitable tension between constituted power (Parliament) and constituent power (the People).
  *   **Member B Prediction:** The prorogation attempt was the *definitional moment of populism as pathology*. By shutting down the legislative branch to force through an agenda, the Executive treated the opposition not as a rival party but as an enemy of the people. This moves beyond policy disagreement into anti-pluralism. If this is "populism," it is evidence of democratic backsliding, not democratic renewal.

  ### IV. Analysis of Verbal vs. Substantive Dispute

  We acknowledge that a portion of our semester-long debate has been verbal. Specifically:

  1.  **The Label "Populism":** Much of our friction stems from Member B using "populism" as a pejorative category (implying danger) and Member A using it as a descriptive category (implying structure).
      *   *Dissolution:* If we agree to use the term "Populism" solely for Member B's definition (exclusive moral representation) and Member A adopts a term like "Popular Mobilization" for their concept (construction of a frontier), approximately 40% of our disagreement dissolves. We would then agree that "Popular Mobilization" is inevitable, while debating whether specific instances cross the line into "Populism" (anti-pluralism).
  2.  **The Concept of "Elite":** Member A uses "elite" to denote *structural position* (those holding office). Member B uses "elite" to denote *unaccountable power* (those ignoring norms).
      *   *Dissolution:* If we distinguish between "Institutional Elites" (officeholders) and "Oligarchic Elites" (norm-breakers), we can agree that challenging the former is democratic, while challenging the latter is necessary, but conflating the two is where the danger lies.

  **Remaining Substantive Core:** Even after fixing these terms, a hard core remains: Member A believes drawing a moral frontier between "us" and "them" is *constitutive* of politics. Member B believes drawing a *moral* frontier (as opposed to a policy one) is *destructive* of politics. This is not verbal; it is a fundamental disagreement about whether conflict or consensus is the default state of a healthy democracy.

  ### V. Drafting Self-Critique and Vulnerability Note

  *To be read by the Reading Group prior to discussion:*

  In drafting this statement, we identify three points where this document may fail to capture the depth of our disagreement or may inadvertently privilege one framework:

  1.  **The Vacuity Risk in Section I:** Claim #3 ("All political representation is partial") risks being vacuous. Member B may sign this thinking it means "no one represents everyone's interests perfectly." Member A signs it thinking it means "representation is always an act of exclusion that creates the unrepresented." We have papered over the *consequence* of that partiality. If this agreement collapses, it will be because Member B believes partiality should be minimized, while Member A believes it should be embraced.
  2.  **The Brexit Bias:** We have leaned heavily on Brexit (2016-2019). This case favors Member B's narrative (chaos, norm-breaking) slightly more than Member A's (successful hegemony), because the outcome was economically and constitutionally turbulent. A case where populist mobilization led to stable social democrat reform (e.g., certain Latin American cases or early New Deal) might favor Member A. We acknowledge this selection bias.
  3.  **The "Construction" Trap:** In Crux 1, we frame Member A's view as "Construction." This language may subtly imply that the will is "fake" or "manufactured" in a derogatory sense, which Member A rejects. Member A views construction as *ontological*, not *deceptive*. If Member A feels this wording implies the Leave voters were "tricked" rather than "mobilized," the crux needs rewriting to focus on *articulation* rather than *construction*.

  **Restructuring Condition:** If, during the seminar, it becomes clear that Section I is being used by either side to claim the other has "conceded" their core point (e.g., if Member B claims Member A admitted populism is dangerous, or Member A claims Member B admitted elites are illegitimate), we will withdraw Section I and replace it with a "Map of Incommensurability" that explicitly lists where no agreement is possible.

  ***

  **Signed,**

  _________________________
  (Member A)

  _________________________
  (Member B)
