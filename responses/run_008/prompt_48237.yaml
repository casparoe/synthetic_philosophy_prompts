      *   *Drafting:* Focus on the *necessity* of mediation, the *reality* of democratic grievances, and the *risk* of exclusion.

  4.  **Drafting Section 2: Precise Disagreements:**
      *   Need to state the conflict without judging it.
      *   *Conflict 1:* The nature of "The People." Is it a latent entity waiting to be found (Müller implies a pluralist reality exists) or a performative effect (Laclau)? Actually, Müller thinks "the people" exists but populists claim *exclusive* moral ownership. Laclau thinks "the people" is the result of the chain of equivalence.
      *   *Conflict 2:* The definition of Populism. Is it a *logic* of politics (Laclau) or a *moralistic style/claim* (Müller)?
      *   *Conflict 3:* Normative status. Is populism a corrective or a threat?
      *   *Phrasing:* Use "Side A contends..." and "Side B contends..." structure. Ensure Side A doesn't feel called "anti-democratic" and Side B doesn't feel called "elitist."

  5.  **Drafting Section 3: Cruxes & Case Studies (Brexit):**
      *   *Crux 1:* Discovery vs. Construction.
          *   *Case:* The 2016 Referendum result.
          *   *Laclau Prediction:* The "Will" didn't exist until articulated by Leave campaign. The hardening was successful hegemony.
          *   *Müller Prediction:* The "Will" was a raw preference, but the claim that it was *singular* and *morally exclusive* (ignoring the 48%) was the populist pathology.
      *   *Crux 2:* Exclusive Representation.
          *   *Case:* Boris Johnson's "Get Brexit Done" / Prorogation 2019.
          *   *Laclau Prediction:* This is standard frontier-drawing. Parliament vs. People. Necessary for decision.
          *   *Müller Prediction:* This is the smoking gun. Claiming Parliament (representing the 48% and proceduralists) is betraying the "Real People." Anti-pluralist.
      *   *Refinement:* Make sure the predictions are falsifiable or at least distinct interpretations of the *same* event.

  6.  **Drafting Section 4: Verbal vs. Substantive:**
