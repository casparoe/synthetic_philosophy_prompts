      *   *Müller Side:* Moral/Political claim (populism is anti-pluralist) + Diagnostic claim (populists claim moral monopoly) + Normative claim (liberal pluralism is necessary).
      *   *Common Ground:* Both hate technocratic elitism that ignores democratic input. Both agree representation is necessary (no direct democracy pure state). Both agree "the people" is a complex concept, not a biological fact.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find the overlap.
      *   *Idea 1:* Representation is inevitable. (Laclau: yes, it's construction. Müller: yes, liberal democracy needs reps).
      *   *Idea 2:* Popular sovereignty is real, not just a lie. (Laclau: it's the horizon. Müller: it's the foundation, just needs constraints).
