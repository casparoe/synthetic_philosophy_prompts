      *   *Dissolution:* Much of the fight is about whether the *label* "populism" is pejorative. If we strip the pejorative, Laclau admits some movements are anti-pluralist. If we strip the "pathology" label, Müller admits some mobilization is necessary.
      *   *Substantive:* The normative evaluation of *exclusion*. Laclau sees exclusion (drawing a frontier) as constitutive of politics. Müller sees *moral* exclusion (you aren't part of the people) as dangerous. This is real.

  7.  **Drafting Section 5: Self-Critique:**
