  13. **Claim:** "An agent with no awareness of a predicate cannot be credited with knowledge of sentences involving it, however immediate their consequence of what it already knows."
      *   **Verdict:** **Correct.**
      *   **Comment:** This follows from the (corrected) definition of Awareness Logic.

