          *   Must address *timing* (target's state + influencer's choice of moment) as a primary factor.
          *   Must indicate where it stops (persuasion/manipulation/ambiguous) and where it hands back to the author (values judgment).
          *   Written in American English.
      *   **Task Part 2:** Apply the procedure to three specific scenes provided by the user.
          1.  Aunt talks protagonist out of keeping house day after funeral (drained state, true arguments).
          2.  Aunt talks friend into job (praises talent, omits risks, nothing false).
          3.  Dying grandmother asks protagonist to come home for Christmas (trades on guilt).
      *   **Task Part 3:** Analyze the implications of Scene 3 (rewrite vs. accept good character manipulating).
      *   **Task Part 4:** State limitations of the procedure (what it misclassifies, where judgment is needed).

  2.  **Deconstruct the Philosophy/Craft Distinction:**
      *   *Persuasion:* Appeals to reason, respects autonomy, transparent intent, allows for refusal, timing respects capacity.
      *   *Manipulation:* Bypasses reason (emotional hijacking), exploits vulnerability (timing/state), hides intent, creates pressure/obligation, restricts options.
      *   *Key Insight:* Truthfulness isn't the divider. You can manipulate with truths. The divider is *how* the choice is processed by the target.

  3.  **Drafting the Procedure (The "Influence Audit"):**
      *   Need a logical flow. Start with the easiest objective markers, move to the subtler psychological ones.
      *   *Step 1: Information & Truth.* (Is lying involved? If yes, high risk of manipulation. If no, proceed.)
      *   *Step 2: Timing & State.* (The user's specific wrinkle.) Is the target vulnerable? Did the influencer choose this moment *because* of that vulnerability?
      *   *Step 3: Mechanism of Change.* (Reasons vs. Emotions.) Is the target thinking or feeling pressured?
      *   *Step 4: Exit Ramps.* (Autonomy.) Can the target say no without cost?
      *   *Step 5: The Handoff.* (Where philosophy ends and art begins.)

      *Refining Step 2 (Timing):* This needs to be prominent. Let's make it the first substantive filter after basic facts.
      *Refining the "Stop/Go" logic:* I need clear criteria for "Verdict: Persuasion," "Verdict: Manipulation," and "Verdict: Authorial Choice."

  4.  **Developing the Scene Analyses:**
      *   *Scene 1 (Funeral/House):*
          *   Truth: Yes.
          *   Timing: Day after funeral (high vulnerability/grief).
          *   Mechanism: Likely bypassing reflection due to exhaustion.
          *   Verdict: Manipulation (exploiting grief).
      *   *Scene 2 (Job/Risks):*
          *   Truth: Yes (omission of risk).
          *   Timing: Not specified as vulnerable, but "half wants" implies uncertainty.
          *   Mechanism: Flattery + Omission. Bypassing rational risk assessment.
          *   Verdict: Manipulation (information asymmetry/framing).
      *   *Scene 3 (Grandmother/Christmas):*
          *   Truth: Yes (dying).
          *   Mechanism: Guilt.
          *   Context: Family dynamics.
          *   Verdict: Manipulation (emotional coercion), *but* potentially justified within the narrative ethics.
      *   *Implications:* If Scene 3 is manipulation, does it ruin the "moral center"? No, complex characters manipulate. But it shifts the book from "warm mentorship" to "complex inheritance of trauma/patterns."

  5.  **Drafting the Limitations Section:**
      *   What can't a checklist do?
      *   It can't measure long-term outcomes (was the manipulation *good* for them in the end?).
      *   It can't judge cultural context (some cultures view guilt as valid social currency).
