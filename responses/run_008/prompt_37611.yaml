      *   Make sure the distinction between "Maneuver" (craft) and "Morality" (theme) is clear in the handoff section.
      *   Check the timing constraint (5-10 mins). The questions need to be direct.

  *(Self-Correction during drafting the procedure)*: I initially thought about putting "Truth" first. But the prompt says the aunt says true things. So "Truth" isn't the differentiator. I should focus on *Agency* and *Timing* first. Let's reorder: 1. Target State/Timing. 2. Mechanism (Reason vs. Emotion). 3. Transparency/Omission. 4. Exit Ramps. 5. Authorial Intent.

  *(Refining Scene 3 Analysis)*: The prompt asks what the two choices (rewrite vs. accept) do to the book. I need to be specific about the thematic shift.
  *   *Rewrite:* Book becomes a fable of pure mentorship. Safer, perhaps less realistic.
  *   *Accept:* Book becomes a study of how love and control intertwine. Richer, darker, more adult.

  *(Final check on limitations)*: Make sure to mention that "Benevolent Manipulation" is a philosophical grey area the checklist can't resolve.

