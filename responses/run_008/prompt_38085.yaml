  5.  **Addressing the Normative Question:**
      *   *Question:* Should a country try to *top* the ranking?
      *   *Analysis:* "Topping" implies competition. Wellbeing isn't competitive.
      *   *Verdict:* No country should aim to *top* (rank), but they should aim to *raise* (score). Treating it as a target (Goodhart's Law) is dangerous. Treating it as a diagnostic (thermometer) is useful.
