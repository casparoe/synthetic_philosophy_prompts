      *Key distinction to emphasize:* The certainty of the *mode of thought* vs. the certainty of the *truth of the judgment*. "I seem to see a table" is a report on a mode of thought. "There is a table" is a judgment about reality. The Evil Demon can manipulate the former without the latter. Step (5) assumes that if the former is indubitable, the latter must be direct. But the Demon hypothesis *is* the hypothesis that the former occurs without the latter. So (5) begs the question against the Demon.

