          *   *Adaptationist Proponent (let's call him Marcus):* Religion (specifically big organized ones) is an adaptation via Cultural Group Selection (CGS). Moralizing gods, costly ritual, cooperation.
      *   **Key Arguments to Include:**
          *   Elena: Is CGS real selection or just "people liked it"?
