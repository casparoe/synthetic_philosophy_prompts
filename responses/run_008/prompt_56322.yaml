answer: |-
  The noise of the banquet hall had settled into a low hum, the kind of acoustical fatigue that only hits after eight hours of panels. Elena swirled the Cabernet in her glass, watching the legs run down the side. Across the small round table, Marcus was loosening his tie, looking equal parts exhausted and electrified.

  "Well," Marcus said, raising his glass. "We didn't come to blows. I'd call that a successful consensus."

  Elena clinked her glass against his, smiling tightly. "Don't tempt me. I still think you treated 'cultural group selection' like a magic wand. Wave it at any large-scale institution and suddenly it's an adaptation."

  "And I think you treat the human brain like a sealed vault," Marcus countered, leaning in. "You're happy to say religion is a byproduct of cognitive machinery—HADD, dualism, memory systems—but the moment I suggest that the *content* of those beliefs shaped group survival, you act like I'm proposing group selection operates on genes."

  "I'm acting like you're proposing group selection operates on *anything* with enough fidelity to matter," Elena said. "Here's the problem, Marcus. In biology, selection requires inheritance. In your model, what's being inherited? Ideas mutate every time they're spoken. So when you say a group with 'High Gods' outcompeted a group without them, are you describing an evolutionary mechanism, or are you just relabeling 'some institutions spread because people found them useful or coercive'?"

  Marcus sighed, picking up his fork and putting it down again. "It's not just utility. It's differential persistence of groups. If Group A has a set of rituals and beliefs that suppresses free-riding, and Group B doesn't, and they come into conflict, Group A expands. The *traits* spread because the *carriers* spread. That's selection."

  "But is it?" Elena pressed. "Or is it just diffusion? If I adopt a belief because my neighbor has more cows than me, that's success bias. It looks like selection, but the mechanism is individual psychology. My cognitive machinery decides the belief is fit. You're smuggling the selection back into the individual skull and then pretending it happened at the group level."

  Marcus held up a finger. "Ah. There it is. The Skull Boundary."

  "The what?"

  "The Skull Boundary. You byproduct people, you're comfortable with natural selection shaping the brain over millennia. Fine. But the moment a cognitive trait creates a cultural environment that feeds back into fitness, you stop the clock. You say, 'The brain is the adaptation; the religion is the exhaust fumes.' But if the exhaust fumes are toxic enough to kill the group, or potent enough to make it conquer a continent, the fumes matter. You're arbitrarily deciding that selection stops at the epidermis."

  "I'm not deciding anything," Elena said, her voice sharpening. "I'm looking for the design features. Show me the mechanism in the brain that was built *for* Sunday service. You can't. What you find are mechanisms for detecting agents, for understanding social hierarchies, for remembering violations of intuition. Religion fits those slots perfectly. It's a parasite that found a host with an unlocked door. You don't need to say the door evolved to let the parasite in."

  "But why *this* parasite?" Marcus asked. "Why do we see convergent evolution of moralizing high gods in large-scale societies, but not in small-scale foraging bands? If it's just random byproduct noise, the distribution should be random. It's not. It correlates with social complexity. That looks like a functional fit."

  Elena opened her mouth, then closed it. She took a sip of wine. "Okay. The distribution isn't random. I'll grant that. But correlation isn't adaptation. Fire is universal in human societies. It cooks food, keeps predators away. But fire isn't a biological adaptation of the human body. It's a niche construction. Religion might be the same. We build it because our brains can, and then it changes the selection pressures on us. That doesn't make religion itself the adaptation."

  Marcus nodded slowly. "Niche construction. I can live with that. But niche construction drives selection. If building the fire changes what genes are fit, the fire is part of the evolutionary story. You want to keep religion in the 'environment' box. I'm saying it's in the 'phenotype' box."

  The waiter arrived to clear the appetizer plates. They both fell silent, watching him navigate the crowded room. When he left, Marcus gestured at the wine bottle on the table.

  "Look at that label," he said. "The vineyard logo. That eye in the triangle. Minimally counterintuitive concept. Agent-like, but not quite human. Sticks in your memory."

  Elena laughed, a genuine sound. "Don't start. I'm trying to enjoy the Cabernet, not analyze my HADD response to the sommelier."

  "It's everywhere, though," Marcus said, grinning. "Even the wine marketing piggybacks on the cognitive machinery."

  "Fine," Elena conceded. "The machinery is real. The question is whether the machinery was tuned by religion, or if religion is just the song the machinery plays when you tickle it."

  She paused, looking thoughtful. "But... okay. Let's talk about the awkward cases. The ones that kept me up last night. Small-scale shamans. They do costly rituals. Bloodletting, fasting, pain. But no moralizing high gods watching from the sky. Just local spirits, ancestors, capricious forces. Your 'Big God' theory struggles there. If costly ritual is for group cohesion to enable large-scale cooperation, why do hunter-gatherers do it when their group size is fifty people?"

  Marcus rubbed his chin. "That is the wrinkle. I'll admit, the 'Moralizing High God' package is specific to the Axial Age, roughly. It scales. But costly ritual in small groups? That's still signaling. It's honest signaling of commitment. Even in a group of fifty, you need to know who's defecting. The ritual makes defection expensive."

  "But they don't believe the spirits care about *morality*," Elena pointed out. "They believe the spirits care about *protocol*. If I don't dance right, the rain doesn't fall. It's not 'God punishes sinners,' it's 'The universe breaks if we don't push the right buttons.' That fits my model perfectly. It's an error in causal reasoning driven by hyper-active agency detection. We think the world is an agent we can negotiate with."

  "Sure," Marcus said. "But why does the ritual persist if it doesn't work? If it's just a cognitive error, shouldn't it be extinguished by negative feedback? No rain comes, you danced wrong. Next time, dance differently. But they don't. They double down."

  "Because the cost *is* the point," Elena said. "If it were easy, everyone would do it. The inefficiency signals commitment to the group. You don't need group selection for that. Individual selection works. I signal I'm committed, I gain status, I get mates."

  Marcus leaned back. "So you're saying costly ritual in small groups is individual signaling, but in large groups it becomes group selection?"

  "I'm saying the mechanism changes with scale," Elena said. "In small groups, I see you. In large groups, I don't see you, so I need a God who sees me. That transition... that's where I get shaky."

  "Exactly," Marcus said softly. "That transition is the empirical key. If it were just byproduct, the transition from local spirits to moralizing gods should be seamless. Just more of the same intuition. But it's not. It requires doctrinal enforcement. It requires literacy sometimes. It requires a priesthood. That looks like design. Not biological design, but cultural design. Selection acting on the institution."

  Elena stared at her glass. "So here's where we actually disagree. Is it empirical, or is it explanatory?"

  "What do you mean?"

  "Empirically," Elena said, "we could probably agree on the data. We both agree small groups have spirits, large groups have gods. We both agree rituals are costly. We both agree cognitive biases exist. If we ran the same study, we'd get the same numbers."

  "Probably," Marcus agreed.

  "So the fight is about what counts as an explanation," she said. "For me, an explanation bottoms out at the cognitive architecture. If I can show how the brain generates the belief without a 'religion module,' I'm done. The fact that the belief helps the group survive is... secondary. Context."

  "And for me," Marcus said, "an explanation that ignores the survival of the group is incomplete. If the belief kills the group, it vanishes. If it saves the group, it spreads. You can't ignore the filter of history. You're explaining the *generation* of the variant. I'm explaining the *retention* of the variant."

  Elena nodded slowly. "Generation versus Retention."

  "Right. You're saying the mutation is non-random because of cognitive constraints. I'm saying the survival is non-random because of group competition."

  "So," Elena said, "if I prove that moralizing gods are cognitively harder to represent than local spirits, does that help you?"

  "Hugely," Marcus said. "Because then we know the cultural system had to evolve scaffolding to support them. Doctrines, catechisms, temples. That scaffolding is the adaptation. The belief is the payload."

  "And if I prove that groups with moralizing gods collapsed just as often as groups without them?"

  Marcus winced. "Then my selection pressure vanishes. I need the differential survival. If it's random walk, I'm in trouble."

  "And if I find a society with moralizing gods that has no costly ritual?"

  "Then the package isn't cohesive," Marcus admitted. "Though I'd argue you won't find that. The belief needs the cost to be credible."

  Elena swirled her wine again. "You know, the scary part is that we might both be right. The cognitive machinery makes the variation possible—the byproduct. But the cultural environment selects which variations stick—the adaptation."

  "That's the synthesis," Marcus said. "But you hate it."

  "I hate that it makes 'adaptation' so broad it means everything," Elena said. "If culture selects beliefs, and brains select culture, and genes select brains... then everything is an adaptation eventually. It loses its bite."

  "And I hate that you treat the brain like it's finished," Marcus said. "Like the Pleistocene closed the book. We're still evolving, Elena. Just mostly culturally now. If you ignore that, you're studying a fossil."

  They sat in silence for a moment, the tension lighter now, more like the fatigue of a long climb rather than a fight.

  "So," Elena said. "What settles it? Empirically."

  "Longitudinal data," Marcus said immediately. "New religious movements. Watch them in real-time. Do the ones with moralizing high gods and costly rituals outsurvive the ones with just spirits and low cost? Control for political power, economics, the lot."

  "And cognitive load studies," Elena added. "Show me that moralizing god concepts are harder to process, require more working memory, more inhibition. Show me they aren't the default. If they aren't the default, they require scaffolding. That supports your cultural adaptation view. If they *are* the default, I win."

  Marcus laughed. "We're never going to run that study. It's too big."

  "Probably not," Elena agreed. She checked her watch. "But at least I know you're not just waving a magic wand."

  "And I know you're not just ignoring history," Marcus said. He signaled for the check. "Same time tomorrow for the panel on secularization?"

  Elena groaned. "Don't remind me. But yes. Just... please don't use the word 'memes'."

  "No promises," Marcus said, standing up and offering a hand to help her with her chair. "But I'll leave 'group selection' out of the first ten minutes."

  "Deal."
