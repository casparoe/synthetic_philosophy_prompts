  *   **Under Rule B (Self-Preservation Learning):** The verdict is ambiguous, leaning **Yes**. Unlike the vacuum, this robot *learned* to avoid damage through trial and error. It wasn't programmed with the avoidance; it figured it out. This mimics the "pain learning" of a mammal.

  **Why save this for last?**
  If you present this early, she will default to Rule A ("It's a robot, duh"). But if you present it *after* she has committed to the importance of "learning" and "avoidance" in the other cases, she may feel pressured to acknowledge the robot's behavior. If she rules "No" on the robot, you can ask: *"If a biological worm learned to avoid pain, would you say yes? If yes, what is the magic ingredient in the worm that the robot lacks?"* This forces her to reveal if she is a **Biological Essentialist** (only meat can feel) or a **Functionalist** (behavior matters).

  ### 4. Weak Spots & Confidence Levels

  **Lowest Confidence: The Robot Verdict**
  *   **Why:** Public intuition on AI is shifting. If the tribunal frames the robot's learning as "it discovered that damage is bad for its goals," she might waver.
  *   **New Info Needed:** Does she distinguish between "simulated learning" and "real learning"? If you tell her the robot's code is a "neural network," does that trigger her "neuron" bias even if it's silicon?

  **The "Fly Exception" Variable**
  *   **Why:** Her treatment of flies (catch and release) contradicts her treatment of ants (spray). She admitted this is about "cost," not suffering.
  *   **Risk:** The **Cricket Flour** case could trigger this. If you frame it as "killing thousands for a snack vs. killing one fly," she might rule against the bars not because crickets suffer, but because it's "killing for no reason when alternatives exist." This isn't about suffering; it's about *wanton destruction*.

  **The "Gradient" Admission**
  *   **Why:** She told you fish are "not black and white."
  *   **Risk:** The **_C. elegans_** case. If you emphasize that the worm's 302 neurons are *mapped and understood* (unlike the insect's "mysterious" brain), she might view it as *more* morally significant than an insect because we know exactly how it works. This reverses the "complexity" argument.

  ### Summary Strategy
  1.  **Start with Cricket Flour & Slime Mold.** These are safe bets (Permissible/No Status) that reinforce her existing "Insects are pests" and "No brains = plants" heuristics.
  2.  **Move to _C. elegans_.** Watch for hesitation. If she says "No," ask if it's because they are too simple or because they are worms.
  3.  **End with the Warehouse Robot.** This is your trap. It forces her to choose between her "Biology" rule and her "Behavior" rule. If she says "No," ask her to define the difference between the robot's learning and a rat's learning. If she says "Yes," you've successfully proven she doesn't actually require biology for moral status.

  **Honest Assessment:** I am 85% confident on the Insect/Slime Mold calls. I am only 60% confident on the Robot call, as that depends entirely on whether she views "trial and error code" as functionally equivalent to "pain avoidance." That is the variable that could blindside you.
