answer: |-
  This is a classic case of a theoretical slogan undergoing "concept drift" when lifted from its historical battlefield and dropped into a contemporary studio critique. Your intuition is correct: Du Bois's *Criteria of Negro Art* is a specific intervention in the Harlem Renaissance debates (specifically against the "Art for Art's Sake" contingent like Alain Locke or the aesthetic purists), and universalizing it requires work your classmate hasn't done.

  Du Bois's line—"Thus all Art is propaganda and ever must be, despite the wailing of the purists"—is often weaponized as an ontological claim (about what art *is*), but in the essay, it functions largely as a sociological and ethical claim (about what art *does* in a racialized society).

  Here is a menu of five distinct precise claims hidden inside that one-liner. You can use this to disaggregate your classmate's argument in seminar. For each, I've evaluated its truth value and, crucially, whether it successfully lands the blow on the painter (i.e., proves she is self-deceived).

  ### 1. The Descriptive/Sociological Claim (Function over Intent)
  *   **The Claim:** Artworks inevitably circulate within social fields and produce effects on public sentiment, ideology, or behavior, regardless of the artist's conscious intent. Therefore, the *function* of the work is propagandistic even if the *intent* is formal.
  *   **Du Bois Context:** Du Bois argues that even "beautiful" Black art functions to counteract racist caricatures simply by existing as dignified representation.
  *   **Evaluation:** **Substantive and Defensible.** This aligns with reception theory and Bourdieuian sociology. Art is never received in a vacuum.
  *   **Does it trap the painter?** **No.** It proves her work has *political effects*, but not that it is *propaganda*. Propaganda typically implies a strategic intent to persuade or manipulate toward a specific dogma. If her canvas induces a meditative state that reinforces neoliberal individualism, that is a political *effect*, but calling the canvas itself "propaganda" conflates *consequence* with *purpose*. She can admit the effect without accepting the label.

  ### 2. The Normative/Ethical Claim (Duty of the Marginalized)
  *   **The Claim:** Artists belonging to oppressed groups have a moral obligation to utilize their platform to advance the cause of their liberation. To refuse this is to abdicate responsibility.
  *   **Du Bois Context:** This is the core of the essay. Du Bois is scolding Black artists who want to be judged solely on "universal" aesthetic grounds while their people are being lynched. He is claiming a *right* to use art for the race.
  *   **Evaluation:** **Defensible within Context; Contested Universally.** It is a strong ethical position for situated art, but difficult to universalize to "All Art" (e.g., does a white abstract painter have the same duty?).
  *   **Does it trap the painter?** **No.** This critiques her *ethics*, not her *description*. If the painter says, "My work is not propaganda," and you say, "It *should* be," you are arguing past each other. Your classmate is claiming she *cannot* make non-propaganda; this claim only says she *should not*. It does not prove self-deception, only potential political negligence.

  ### 3. The Semantic Claim (Reclamation of "Propaganda")
  *   **The Claim:** The word "propaganda" has been unfairly pejorativized. It simply means "that which is propagated." Since all art propagates some view of the world (even if that view is that the world is reducible to color), all art fits the neutral definition of propaganda.
  *   **Du Bois Context:** Du Bois explicitly writes, "I do not care a damn for any art that is not used for propaganda." He is trying to drain the word of its association with "lies" and refill it with "truth for the oppressed."
  *   **Evaluation:** **Platitude / Definitional Stipulation.** If you define propaganda as "communicating a worldview," then yes, all communication is propaganda. But this renders the word useless for critical distinction.
  *   **Does it trap the painter?** **Only via Bait-and-Switch.** If your classmate uses this definition, they win the logic game but lose the critical point. If "propaganda" just means "meaningful," then the painter isn't self-deceived; she just uses a different dictionary. The accusation of "bad faith" relies on the *pejorative* sense (manipulation/ideology), not the *neutral* sense (propagation).

  ### 4. The Institutional Claim (The Politics of Aesthetics)
  *   **The Claim:** The very category of "abstract art concerned only with color and light" is a historically constructed ideological position (e.g., Cold War formalism, Greenbergian autonomy). To claim this mantle is to align oneself with the institutions that uphold that aesthetic as "pure."
  *   **Du Bois Context:** Less explicit in 1926, but implied in his critique of "white judges" setting standards. He recognizes that aesthetic standards are not neutral.
  *   **Evaluation:** **Substantive and Defensible.** This is the strongest art-historical argument (cf. Guilbaut, *How New York Stole the Idea of Modern Art*). Formalism is a political stance.
  *   **Does it trap the painter?** **Yes, partially.** It suggests her claim to "apoliticality" is historically naive. However, it does not necessarily make the work *propaganda* in the Du Boisian sense (advocating for a specific social change). It makes the work *ideological* (reinforcing the status quo). The distinction matters: reinforcing the status quo is often invisible politics, whereas propaganda is usually visible advocacy.

  ### 5. The Ontological Claim (Art as Social Fact)
  *   **The Claim:** Art cannot exist outside of history and power. Therefore, an "apolitical" artwork is an impossibility, like a "square circle." To claim otherwise is a category error.
  *   **Du Bois Context:** Du Bois suggests art is always born of a social condition. For Black artists, that condition is racial struggle.
  *   **Evaluation:** **False / Overreach.** While art is socially situated, "political" and "propaganda" are not synonymous with "situated." A still life of fruit is situated in history, but calling it propaganda stretches the term until it snaps.
  *   **Does it trap the painter?** **No.** This is the "Everything is Politics" fallacy. If everything is propaganda, nothing is. It destroys the analytical utility of the term. If the painter says, "I am not doing X," and you say, "X is everything," you haven't engaged with her specific practice.

  ---

  ### Seminar Strategy: The "Du Bois Inversion"
  The most critical point you can raise in seminar is that your classmate has inverted Du Bois's rhetorical aim.

  *   **Du Bois's Aim:** **Empowerment.** He uses "All art is propaganda" to *license* Black artists to make political work without shame. He is fighting against critics who said, "Your art is too political; make it pure."
  *   **Classmate's Aim:** **Policing.** They are using "All art is propaganda" to *shame* an artist for not making political work. They are fighting against an artist saying, "My art is pure; don't make it political."

  **The Synthesis for your Intervention:**
  You can argue that Du Bois's slogan is **situationally specific**, not universally ontological.
  1.  **For Du Bois:** In a context of anti-Black racism, *silence* is political. Therefore, for a Black artist in 1926, refusing to address the race is a political act (propaganda for the status quo).
  2.  **For the Painter:** Does the painter occupy a position where "silence" functions differently? If the painter is not from a marginalized group whose humanity is currently being contested in the public sphere, the *duty* aspect of Du Bois's claim weakens.
  3.  **The Verdict:** The painter is likely wrong that her work has no *political effects* (Claim 1 & 4), but your classmate is wrong to label it *propaganda* (which implies intent/dogma) or to claim Du Bois universally validates this reading. Du Bois was arguing for the **legitimacy of political art**, not the **impossibility of autonomous art.**

  **Suggested phrasing for seminar:**
  *"I worry we're universalizing Du Bois's 'propaganda' into an ontological claim when he intended it as an ethical imperative for a specific historical moment. Du Bois was arguing that Black artists shouldn't be shamed for making political art. Using him to shame a contemporary painter for not making political art seems to invert the essay's vector. We can agree her work has political *effects* (institutional claim) without agreeing that it constitutes *propaganda* (intent/dogma), or that Du Bois's specific defense of Negro Art translates to a universal ban on aesthetic autonomy."*
