          *   *Perfection as Holistic:* "Perfection" in Leibniz isn't just a sum of parts (superadditive?). OR objective functions are usually additive or clearly defined aggregations. Leibniz's "harmony" is emergent in a way that resists simple functional decomposition.
          *   *The "Why" of the Objective:* Why maximise perfection? In OR, the objective is exogenous (given by the stakeholder). For Leibniz, God's will is aligned with His intellect. The objective function is internal to the solver's nature.

