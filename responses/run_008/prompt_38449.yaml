  # Interactive Feature: "What Is An Emotion?" Decision Tree

  ## Part 1: The Decision Tree Content

  **Instructions for Developers:**
  *   **Format:** Each Node presents a scenario with two clickable cards (Option A / Option B).
  *   **Flow:** Users answer 4 to 5 questions before reaching a Leaf (Result).
  *   **Total Nodes:** 12 unique branch points.
  *   **Total Leaves:** 4 theoretical positions.

  ---

  ### Node 1: The Calm Pill (The Body Question)
  **Scenario:** Imagine a medication that completely stops your heart from racing, your palms from sweating, and your muscles from tensing. You take it before a public speech. You still think, *"This is dangerous; I might fail,"* but your body is perfectly still.
  *   **Option A:** Without the physical rush, I wouldn't truly feel fear. It would just be a cold thought. **(Go to Node 2)**
  *   **Option B:** I would still feel the fear. The physical symptoms are just the exhaust, not the engine. **(Go to Node 3)**

  ### Node 2: The Adrenaline Shot (The Perception Question)
  **Scenario:** You are injected with adrenaline. Your heart hammers and you tremble, but you don't know why. There is no bear, no audience, no bad news.
  *   **Option A:** I would feel a raw, unnamed surge of energy. The emotion is the body state itself. **(Go to Node 4)**
  *   **Option B:** I would feel confused or curious, but not "emotion." I need a reason to turn that energy into fear or joy. **(Go to Node 5)**

  ### Node 3: The Glass Floor (The Judgment Question)
  **Scenario:** You walk onto a glass floor over a canyon. You *know* with 100% certainty the glass is unbreakable. Yet, your stomach drops and you hesitate.
  *   **Option A:** That isn't real fear. Real fear requires believing you are in danger. This is just a reflex. **(Go to Node 6)**
  *   **Option B:** It is real fear. My body reacts even when my mind disagrees. Emotions aren't under my control. **(Go to Node 7)**

  ### Node 4: The Dog's Guilt (The Universality Question)
  **Scenario:** Your dog hides when you come home to a mess. It looks "guilty." But dogs don't have a concept of moral responsibility.
  *   **Option A:** The dog feels a version of guilt. The bodily expression is the same across species. **(Leaf: Perceptual/Bodily)**
  *   **Option B:** The dog feels anxiety, but "guilt" requires a human concept of right and wrong. **(Leaf: Constructivist)**

  ### Node 5: The Hangry Episode (The Construction Question)
  **Scenario:** You snap at your partner in a rage. Later, you realize you hadn't eaten all day. You eat, and the rage vanishes instantly.
  *   **Option A:** The anger was real, but it was caused by blood sugar, not my partner. **(Leaf: Feeling/Non-cognitive)**
  *   **Option B:** The anger wasn't real. I mislabeled a physical sensation as an emotion based on the situation. **(Leaf: Constructivist)**

  ### Node 6: The Reframed Past (The Stability Question)
  **Scenario:** You regret a decision for years. Then, you learn new information that proves your decision was actually the best possible choice.
  *   **Option A:** The regret disappears. Emotion follows my judgment of the value of the act. **(Leaf: Cognitive/Judgment)**
  *   **Option B:** The regret lingers. I know I was right, but I still feel the sting. **(Leaf: Feeling/Non-cognitive)**

  ### Node 7: The Emotion Dictionary (The Concept Question)
  **Scenario:** You learn a new word, *schadenfreude* (pleasure at another's misfortune). Before this, you felt this way sometimes but didn't have a name for it.
  *   **Option A:** The feeling is the same; the word just helps me describe it. **(Leaf: Perceptual/Bodily)**
  *   **Option B:** The word changes how I feel. It sharpens the experience and makes it distinct. **(Leaf: Constructivist)**

  ### Node 8: The Numb Grief (The Feeling Question)
  *(Reached if User selects Option B at Node 3)*
  **Scenario:** A loved one passes. You understand completely that they are gone and will not return. But you feel physically hollow and numb. No tears, no tightness.
  *   **Option A:** You are still grieving. Your judgment of loss is the emotion. **(Leaf: Cognitive/Judgment)**
  *   **Option B:** You aren't feeling grief yet. Without the raw ache, it's just knowledge. **(Leaf: Feeling/Non-cognitive)**

  ### Node 9: The Actor's Tear (The Expression Question)
  *(Reached if User selects Option A at Node 2)*
  **Scenario:** An actor cries on stage. They control their breathing and muscles to produce tears and a trembling voice, but inside they feel calm.
  *   **Option A:** They are simulating sadness, not feeling it. The inner state matters most. **(Leaf: Perceptual/Bodily)**
  *   **Option B:** If the body is doing the thing, the emotion is present. The body leads the mind. **(Leaf: Constructivist)**

  ### Node 10: The Culture Swap (The Context Question)
  *(Reached if User selects Option B at Node 5)*
  **Scenario:** In some cultures, there is no word for "depression," but people still feel low energy and sadness. They just don't group it as a disease.
  *   **Option A:** They still have depression; they just don't name it. The biology is universal. **(Leaf: Feeling/Non-cognitive)**
  *   **Option B:** Without the category, it's just a mood. "Depression" is a specific cultural invention. **(Leaf: Constructivist)**

  ### Node 11: The Memory Edit (The Retroactive Question)
  *(Reached if User selects Option A at Node 6)*
  **Scenario:** You remember a childhood birthday as happy. Later you find a diary entry from that day saying you were miserable.
  *   **Option A:** Your current judgment corrects the memory. The emotion was always what you now believe. **(Leaf: Cognitive/Judgment)**
  *   **Option B:** The feeling you had then was real, even if your memory is wrong. **(Leaf: Perceptual/Bodily)**

  ### Node 12: The Alien Surge (The Pre-Conceptual Question)
  *(Reached if User selects Option B at Node 7)*
  **Scenario:** An alien lands. It has no human concepts. It achieves a goal and its systems light up with a reward signal.
  *   **Option A:** It feels "pride" or "joy." These are biological states, not human words. **(Leaf: Perceptual/Bodily)**
  *   **Option B:** It feels a reward signal. "Joy" is a human story we wrap around that signal. **(Leaf: Constructivist)**

  ---

  ## Part 2: Leaf Mapping & Logical Space

  The tree routes users to one of four major theoretical positions based on their intuitive prioritization of **Body**, **Judgment**, **Raw Feel**, or **Concept**.

  | Leaf Position | Core Intuition | Typical Path (Example) |
  | :--- | :--- | :--- |
  | **Cognitive / Judgment** | Emotions *are* evaluations. If you change the thought, the emotion changes. | Node 1(B) → Node 3(A) → Node 6(A) |
  | **Perceptual / Bodily** | Emotions *are* the perception of bodily states. Universal and pre-verbal. | Node 1(A) → Node 2(A) → Node 4(A) |
  | **Feeling / Non-cognitive** | Emotions are raw affects that can exist without judgment or concepts. | Node 1(B) → Node 3(B) → Node 8(B) |
  | **Constructivist** | Emotions are categories we apply to sensations based on culture/context. | Node 1(A) → Node 2(B) → Node 5(B) |

  ### Indistinguishable Combinations
  *   **Feeling vs. Perceptual:** The tree struggles to fully separate "Feeling theories" (Prinz) from "Perceptual theories" (James-Lange) if the user believes emotions are bodily but *also* that they can exist without concepts. Both Node 2(A) and Node 4(A) lean Perceptual, but a user who selects Node 5(A) (Hangry is real anger) lands on Feeling. In practice, these two leaves share significant overlap: both view emotions as biological givens rather than conceptual constructions. The widget treats them as distinct based on whether the user prioritizes the *sensation* (Feeling) or the *bodily mechanism* (Perceptual), but philosophically, these are neighboring states.
  *   **Constructivist Variants:** A user might believe concepts are necessary (Constructivist) but also that judgments drive the concept (Cognitive). The tree forces a choice between "Judgment creates Emotion" (Cognitive) and "Culture/Concept creates Emotion" (Constructivist), though some hybrid views exist (e.g., cognitive constructivism).

  ---

  ## Part 3: Unoccupied Corners

  There are logical combinations of answers that lead to no standard theory.
  1.  **Disembodied Constructivism:** A user who claims the body is irrelevant (Node 1B) but also that emotions are purely cultural constructs with no biological basis (Node 5B/10B). This view is rarely held because even constructivists (like Barrett) acknowledge "affect" is biological. It is likely empty because it is incoherent: if there is no bodily input, what is being constructed?
  2.  **Dualist Emotion:** A user who claims the body is essential (Node 1A) *and* that a conscious judgment is also essential (Node 3A). This implies emotions require two distinct, necessary substances (mind and body) to exist simultaneously. While intuitive to laypeople, few philosophers defend this as a strict theory because it fails to explain what happens when one is present without the other (e.g., phobias or numbness). It is empty because it is unattractive: it complicates the ontology without explanatory gain.
  3.  **Retroactive Realism:** A user who claims emotions are judgments (Node 6A) but that past emotions change when current beliefs change (Node 11A). This suggests emotions have no historical reality. This corner is empty simply because nobody has bothered; it renders emotional history meaningless, which contradicts the data of memory and therapy.

  ---

  ## Part 4: Bias Flags

  **Node 1 (The Calm Pill):**
  *   **Bias:** Stacks against **Perceptual/Bodily** theories.
  *   **Reason:** It describes the medication as stopping the "feeling" by stopping the body. A Jamesian might argue that if the body stops, the feeling *necessarily* stops, making Option A a tautology rather than a choice.
  *   **Mitigation:** Ensure the copy emphasizes the *thought* remains intact ("You still think 'This is dangerous'") to make Option B viable for Cognitive theorists.

  **Node 3 (The Glass Floor):**
  *   **Bias:** Stacks against **Cognitive/Judgment** theories.
  *   **Reason:** It uses a phobia example (knowing safe but feeling fear). Cognitive theorists argue this is a "sub-doxastic" state or a temporary judgment, not a counter-example. The phrasing "That isn't real fear" in Option A may feel dismissive to readers who experience phobias as real.
  *   **Mitigation:** Phrase Option A as "That is a reflex, not an emotion," which aligns better with the technical distinction Cognitivists make.

  **Node 5 (The Hangry Episode):**
  *   **Bias:** Stacks against **Feeling/Non-cognitive** theories.
  *   **Reason:** It implies that if a feeling has a physiological cause (sugar), it is less "real." Feeling theorists argue the cause doesn't negate the reality of the affect.
  *   **Mitigation:** Ensure Option A validates the anger ("The anger was real") rather than dismissing it, so the distinction rests on *source* rather than *validity*.
