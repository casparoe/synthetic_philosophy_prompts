      *   Section 2: The Parfit Irony (High).
      *   Section 3: The Rule-Util Patch (Medium).
      *   Section 4: Taxation/Prudence (Low/Medium).
      *   Conclusion: The Refactor.

      *(Self-Correction during drafting)*: Wait, if they accept Separateness of Persons, they are basically rejecting Total Utilitarianism. I need to be very clear that (1) and (2) are mutually exclusive *by definition*. Total Utilitarianism *denies* the moral significance of the boundary between persons.

      *(Refining the Parfit point)*: Parfit argues that if identity isn't deep, the difference between *intra*personal and *inter*personal trade-offs shrinks. This supports Utilitarianism. The user thinks it supports Separateness. I need to explain why their intuition here is backwards relative to Parfit's actual argument.

      *(Refining the Rule Consequentialism)*: This is the standard "escape hatch" for this exact problem. It's not a bug, it's a feature, but they need to own it.

