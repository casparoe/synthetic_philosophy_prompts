  **Bid-by-Bid Reasoning**

  1.  **Bid 1 (Apex, \$2M):** Apex's private seismic data suggests an expected value (EV) of \$4M. Bidding \$2M offers a positive expected surplus (\$2M). This is standard rational entry.
  2.  **Bid 2 (Apex, \$5M):** After Bolt bids \$3M, Apex updates. In a common-value setting, Bolt's willingness to exceed \$2M signals private information implying higher reserves. Apex aggregates their signal with Bolt's revealed signal, revising the EV to \$7M. Facing a \$2M penalty if they quit (as the runner-up), bidding \$5M to capture a \$7M asset yields a net position of +\$2M, whereas quitting yields -\$2M. Escalation is locally optimal.
  3.  **Bid 3 (Apex, \$15M):** Following further exchanges, Apex observes Bolt's persistence at \$14M. Apex infers Bolt possesses definitive data confirming high approval odds, pushing Apex's EV estimate to \$16M. At this decision node, winning at \$15M yields a perceived surplus of \$1M, while dropping out makes Apex the runner-up at \$14M, locking in a -\$14M loss. Paying \$15M to avoid a \$14M penalty and gain perceived value is mathematically airtight at this moment.

  **Structural Feature**
  The driving mechanism is **endogenous information revelation in a common-value setting with second-price penalties**. The rival's bid is not merely a price; it is a noisy signal of the asset's true worth. Because the value is common (the FDA decision affects both equally), the rival's aggression legitimately increases your estimate of the prize. The penalty structure ensures that once engaged, the cost of exiting (paying the sunk bid) rises with every round, forcing the agent to rely even more heavily on the optimistic signal sent by the rival's willingness to absorb that same penalty.

  If you remove the **common-value uncertainty** (making it a private-value auction), the rival's bid tells you nothing about the asset's worth, only their desire. In that case, updating your valuation upward based on their bid is irrational, and the scenario collapses into the standard dollar auction where escalation is purely a sunk-cost bias. If you remove the **runner-up penalty**, the agent can exit with zero cost, so escalation stops immediately once Price > Estimated Value, preventing the spiral.

  **Strongest Reply**
  A critic would argue the bidders are committing a **strategic inference error** akin to the "winner's curse." They treat the rival's bid as a pure signal of external value, ignoring that the bid is also contaminated by the rival's own entrapment in the penalty structure. A fully rational Bayesian should anticipate that the rival is escalating not just because the value is high, but because the rival is also trying to avoid their own sunk costs. By failing to discount the rival's bid for this strategic desperation, the agents double-count the optimism: they see the rival's commitment as evidence of value, when it is partially evidence of the rival's fear of the penalty. Thus, the escalation remains a bias—a failure to condition on the auction structure itself—disguised as Bayesian updating.
