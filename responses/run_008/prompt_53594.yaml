      *   *Calibration:* If I use PoI repeatedly, do my probabilities match frequencies? (Often no).
      *   *Incompatibility:* Two rational agents using PoI on the same situation get different priors.
      *   *Dogmatism:* PoI can assign probability 1 to contingent falsehoods in limit cases (improper priors).
      *   *Empirical Success:* Does using PoI actually lead to truth?

