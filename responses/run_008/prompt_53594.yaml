prompt: |-
  I'm taking a philosophy of science course this semester and we just spent two weeks on the principle of indifference, and I've come out of it genuinely convinced that it's basically right -- that when you have no reason to favor one possibility over another, the rational thing is to spread your credence evenly, and that this is what "letting the evidence decide" actually cashes out to when you have no evidence. My TA thinks this is hopeless because of Bertrand's paradox (the random chord thing, where depending on how you set up the "randomly chosen" chord you get 1/3, 1/2, or 1/4 for the probability it's longer than the side of the triangle), and he also brought up the cube factory example where indifference over the side length vs. over the volume of the cubes gives different answers. I know the standard moves here -- Jaynes's invariance/translation group response, restricting the principle to finite partitions only, objective Bayesians like Williamson just biting the bullet on language-dependence -- and honestly none of them strike me as fatal, but I also worry I'm motivated to think that because I like the principle.

  So here's what I want: treat my position as "the principle of indifference, in some defensible version, is the correct constraint on rational prior probabilities," and map out its exposure for me. What would actually count against it -- not just the two examples my TA gave (though do explain why those bite as hard as they do), but the full range: formal results, cases where different reasonable people get incompatible priors and there's no way to arbitrate, calibration failures over many trials, whatever. I'd like the defeaters ranked from fatal to merely awkward, and importantly, tell me which of these a sophisticated defender would concede as counting against their view versus wave away, and whether the wave-aways are legitimate or just qualifications stacked on qualifications. Jaynes's invariance requirement, for example -- is it a principled fix or does it just relocate the arbitrariness from choice of parameterization to choice of which transformations count as symmetries?

  The thing I'd personally find most persuasive is a clear account of whether the principle ends up insulated into unfalsifiability once you add all the patches, and whether that's a problem for a principle of this kind -- like, maybe a normative principle about rationality isn't supposed to be falsifiable in the way an empirical theory is, and "two agents with the same evidence can rationally differ" isn't a bug. But I want you to actually push on this rather than hand me a both-sides essay. Also please answer in American English (my professor docks us for British spellings, which is annoying but whatever).
