answer: |-
  Dear Reader,

  You have an excellent nose for this, and your suspicions are well-founded. As someone who works on self-locating belief and epistemology, I can tell you that while the summary you pasted captures the basic flavor of the Sleeping Beauty problem, it contains several significant errors regarding the technical arguments, the attribution of principles, and the current state of the philosophical consensus. It reads like a case of a popularizer trying to tidy up a messy, ongoing debate into a neat narrative with a winner and a loser, which unfortunately distorts the actual landscape of the literature. Let's walk through the text you provided and separate the acceptable simplifications from the genuine mistakes.

  First, the description of the setup itself is accurate enough for a general audience. The protocol regarding the coin toss, the memory wipe, and the awakening schedule is the standard formulation introduced by Adam Elga in his seminal 2000 paper, though the problem was originally formulated by Arnold Zuboff and later discussed by Piccione and Rubinstein in the context of game theory. So, you can trust that part of the summary. The characterization of the two main positions is also passable as a rough sketch. Halfers do indeed maintain that Beauty's credence in Heads should remain at one-half, typically arguing that she gains no new relevant evidence upon waking that would warrant shifting from the prior probability of the fair coin. Thirders argue for one-third, usually claiming that the fact of her awakening provides indexical evidence that she is more likely to be in a world with more awakenings. However, the summary glosses over the deep disagreement about what counts as "new evidence." Halfers argue that since she knew she would be woken up at least once, the awakening itself isn't evidence; Thirders counter that *which* awakening it is constitutes new self-locating information. This is a substantive technical dispute, not just a difference in intuition, but the summary's description here is a tolerable simplification.

  Where the summary starts to go off the rails is in its treatment of Adam Elga's contribution. The text claims Elga "proved" the thirder answer is correct. In philosophy, and especially in epistemology, the word "proved" is doing far too much heavy lifting here. Elga's 2000 paper, "Self-Locating Belief and the Sleeping Beauty Problem," provided a highly influential argument for Thirdism, but it was by no means a proof that settled the matter. His argument relied on a specific application of the principle of indifference to the centered worlds (Monday-Tails vs. Tuesday-Tails) and a constraint on how conditionalization should work with self-locating beliefs. This argument was immediately and forcefully contested. To say he "proved" it implies the debate ended there, which is historically false. The publication of Elga's paper actually ignited the modern debate rather than extinguishing it.

  This leads us to the most egregious error in the summary, which is exactly what you flagged regarding the Self-Indication Assumption (SIA). The text states that the halfer view rests on the SIA, defined as favoring hypotheses on which more observers exist, and claims this commits halfers to believing in an infinite universe. This is backwards on almost every count. The Self-Indication Assumption, famously discussed by Nick Bostrom, roughly states that you should reason as if you are a random observer from the set of all possible observers, which implies that hypotheses predicting more observers are more likely to be true because they make your existence more probable. In the context of Sleeping Beauty, the Tails hypothesis generates two observer-moments (awakenings) while Heads generates only one. Therefore, applying the SIA actually pushes you toward the Tails hypothesis, supporting the Thirder position, not the Halfer position. The Halfer position is more often associated with the Self-Sampling Assumption (SSA), which instructs you to reason as if you are a random sample from a specific reference class of observers, or with a strict Bayesian view that rejects updating on self-locating information entirely. Furthermore, the claim that this commits halfers to an infinite universe is a muddled conflation of different arguments. It is actually the SIA (which, as noted, supports Thirding) that faces the "Presumptuous Philosopher" objection, where one might be forced to favor cosmological theories with vastly more observers regardless of empirical evidence. The summary has swapped the positions of the Halfer and Thirder regarding these assumptions, which is a serious technical error.

  Your memory about David Lewis is also correct and directly contradicts the summary's claim about consensus. David Lewis, one of the most prominent metaphysicians and epistemologists of the late twentieth century, published a paper in 2001 titled "Sleeping Beauty: Reply to Elga," in which he defended the Halfer position. Lewis's involvement alone should disabuse anyone of the notion that the matter was "proven" or that dissent is merely stubbornness. If a philosopher of Lewis's caliber disagreed with Elga's reasoning, the argument is clearly not a settled proof. The summary's assertion that "most philosophers accept that thirding is right" is also questionable depending on which survey you consult. While Thirdism has gained significant traction, particularly among decision theorists, Halferism remains a robust and widely defended position. There are even "Double Halfers" who argue for one-half credence in Heads but maintain different betting behaviors, and hybrid views that attempt to split the difference. The field is vibrant and contested, not closed.

  Regarding the Dutch book arguments, the summary presents them as a decisive win for the Thirders. This is another oversimplification. A Dutch book is a set of bets that guarantees a loss for the agent, typically used to show that an agent's credences are incoherent. While Thirders can construct Dutch books against Halfers under certain betting protocols (specifically if Beauty is offered a bet on each awakening), Halfers have responded by arguing that the betting setup conflates the number of bets with the probability of the event. Conversely, Halfers can construct Dutch books against Thirders if the betting protocol is structured per experiment rather than per awakening. The literature on this, involving scholars like Vince Conitzer and others, shows that vulnerability to Dutch books in this context often depends on how you set up the decision problem, not just the credence itself. Neither side has a clean, uncontested victory on this front, and claiming otherwise misrepresents the technical state of play.

  Finally, the summary's conclusion that the remaining dissent is "mostly stubbornness about gut intuitions" is dismissive in a way that professional philosophers would find inaccurate. The disagreement stems from fundamental divergences in how we understand Bayesian conditionalization, the nature of indexical information, and the relationship between credence and decision theory. These are hard problems in the foundations of probability, not mere psychological quirks. The fact that smart, well-informed philosophers remain on both sides suggests that the problem touches on unresolved issues in epistemology, not that one side is refusing to accept a proof.

  So, to answer your specific worries: yes, the book's attribution of the Self-Indication Assumption is backwards, as SIA generally supports Thirding. Yes, David Lewis was a prominent Halfer, which contradicts the idea of a settled consensus. No, Elga did not "prove" anything in the mathematical sense; he provided a compelling argument that launched a decades-long debate. And no, the Dutch book arguments are not a slam dunk for either side. You were right to feel that something was off. Popular philosophy books often strive for narrative closure where none exists, and in this case, that drive for a clean story has led to significant distortions of the actual philosophical landscape. The Sleeping Beauty problem remains one of the most fertile and unresolved puzzles in contemporary epistemology, and your skepticism about the summary is the correct philosophical stance to take.

  Best regards,

  A Philosopher of Self-Locating Belief
