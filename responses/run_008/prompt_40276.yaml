  The doctrinal pattern you describe—defaulting to the "but-for" test but resorting to "substantial factor" or NESS (Necessary Element of a Sufficient Set) analysis in overdetermination cases—presents a classic problem in the philosophy of law. To adjudicate whether this practice presupposes a counterfactual theory, an interventionist one, a mix, or is underdetermined, we must distinguish between the *tests* courts apply and the *metaphysical commitments* required to justify them.

  **1. The Surface Tension: Counterfactual vs. Structural**
  Your friend is correct that the "but-for" test is linguistically and logically a test of counterfactual dependence ($\neg C \boxright \neg E$). In simple causal chains, this aligns perfectly with the Humean-Lewisian tradition. However, as you noted, symmetric overdetermination (the two fires) breaks this link: the harm does not counterfactually depend on either fire individually, yet the law assigns causation to both. The justification courts and commentators give for this exception is typically structural: each fire was a necessary element of a sufficient set (NESS). This aligns with the "interventionist" or structural description you provided, where causation is about a factor's role in an invariant productive structure rather than simple counterfactual dependence.

  **2. The Case for a "Mixed" Theory**
  One might argue the practice is `mixed`. The doctrine explicitly prioritizes the counterfactual test as the default and treats the structural test as an exception for "hard cases." This suggests a pragmatic layering: the law uses counterfactuals when they are easy and cheap to apply, and switches to structural analysis when counterfactuals yield absurd results. If we take the doctrine's explicit hierarchy at face value, it appears to rely on two distinct theoretical engines. However, this view assumes the tests *require* different metaphysics. Most legal philosophers (e.g., Richard Wright) argue they do not.

  **3. The Case for a Unified "Interventionist" Theory**
  A strong scholarly consensus argues that the NESS test *subsumes* the but-for test. Under a NESS account, a but-for cause is simply a condition that is a necessary element of the *only* sufficient set present. In overdetermination, there are *two* sufficient sets, and the condition is a necessary element of *each*. Thus, a single theory (NESS/Structural) licenses both the default rule and the exception. If we identify NESS with the "interventionist" label (as your description of invariant structure suggests), one could argue the practice presupposes an `interventionist` theory, using but-for merely as a heuristic shortcut for simple cases.

  **4. The Case for "Underdetermined"**
  However, the question asks what the pattern *actually presupposes*. While NESS unifies the tests, it is not the *only* theory that can license the pattern. Sophisticated counterfactual theories, such as David Lewis's account of "quasi-dependence" or "influence," can also handle overdetermination without abandoning counterfactuals. They argue that the causal process initiated by each fire is intrinsically similar to a process that would have been but-for necessary in a world without the second fire. Since both a unified structural theory (NESS) and a modified counterfactual theory (Lewis+) can generate the exact same doctrinal outcomes (But-For default + Overdetermination exception), the legal doctrine itself does not force a choice between them. The law is concerned with liability outcomes, not metaphysical precision. It tracks our folk intuitions about causation, which are themselves compatible with multiple philosophical formalizations.

  **5. What Would Change Under a Fully Interventionist Account?**
  If the legal system openly replaced the implicit mix with a fully interventionist (NESS) account:
  *   **The But-For Test:** It would not necessarily disappear, but it would be demoted from a *definition* of causation to a *rule of thumb*. Jury instructions would likely shift to ask whether the conduct was a "necessary element of a sufficient set" in all cases, acknowledging that but-for is just the common instance of this.
  *   **Handling Conflicts:** In cases where but-for and NESS diverge (like overdetermination), the conflict would vanish because NESS would be the primary standard. Currently, courts awkwardly label these as "exceptions" to the but-for rule. Under an open interventionist account, they would be standard applications of the rule.
  *   **Preemption:** In preemptive causation (where Fire A burns the house before Fire B arrives), but-for works (no Fire A, no burn *at that time*), and NESS works. An interventionist account clarifies *why* Fire B is not a cause (it wasn't part of the sufficient set that *actually* produced the harm), resolving ambiguities that sometimes plague the "substantial factor" language.

  **Conclusion**
  While the NESS theory provides the most elegant *unification* of the doctrine, the doctrine itself does not *require* NESS over a modified counterfactual theory. Both license the pattern of rulings. Therefore, the practice does not genuinely presuppose one specific metaphysics over the other, nor is it necessarily a theoretically fractured "mix" (since unified theories exist). It is philosophically underdetermined: the rules are pragmatic tools compatible with multiple underlying theories of causation.

