answer: |-
  This lesson plan is designed to be philosophically potent but logistically tight. It relies on **contrast effects** (the sugar rinse) to simulate a shift in the subject, while maintaining the **stimulus constancy** (the flasks) to create the epistemic trap Dennett describes.

  **Important Ethical & Safety Note:** Before running this, check your institution's policy on in-class consumption of substances and pedagogical deception. Even for a simple demo, you must screen for allergies (specifically to quinine/tonic water or sucrose) and diabetes. Make participation in the *tasting* optional (students can rate based on smell or observation if they prefer), though this reduces the data quality.

  ### **Session Overview: The Calibration Trap**
  *   **Time:** 90 Minutes
  *   **Class Size:** 14 Students
  *   **Materials:**
      *   3 Large Carafes (labeled only **X, Y, Z**).
      *   **Solution:** Unsweetened Tonic Water diluted 50/50 with tap water (consistent bitterness, safe).
      *   **Rinse A (Control):** Plain water.
      *   **Rinse B (Manipulation):** Saturated sucrose solution (very sweet).
      *   Small tasting cups (3 per student per phase).
      *   Rating Sheets (Phase 1 and Phase 2).
      *   Whiteboard for team scores.

  ---

  ### **Phase 1: The "Calibration" (0:00 – 0:15)**
  **The Cover Story:** Tell the class this is a "Sensory Baseline Calibration" to help them focus for the seminar. You are collecting data on "attentional drift" in sensory judgments.

  1.  **Distribution:** Hand out **Rating Sheet A**. It asks for:
      *   *Sample ID (X, Y, Z)*
      *   *Intensity (1–10)*
      *   *Pleasantness (1–10)*
      *   *Confidence in Rating (High/Med/Low)*
  2.  **Tasting:** Pour small amounts from Carafes X, Y, Z. (In reality, these are three fixed dilutions: 20%, 40%, 60% tonic).
  3.  **Task:** Students rate them silently. Collect the sheets immediately. Tell them you will analyze this data later to check for "group consistency."
  4.  **Seating:** Pre-assign seats or hand out rinse codes secretly. Rows 1 & 2 get **Code Alpha** (Water). Rows 3 & 4 get **Code Beta** (Sugar). *Do not tell them the rinses differ.*

  ### **The Filler: Lecture & Discussion (0:15 – 1:10)**
  Conduct your seminar as planned, but avoid mentioning qualia, Dennett, or the specific nature of the tasting task. Discuss related topics (e.g., reliability of introspection, memory, perception) to keep the theme relevant without giving away the trick.
  *   *Logistical Note:* Keep the carafes covered but visible on the desk. Do not touch them. This reinforces the idea that the liquid is static.

  ### **Phase 2: The "Verification" (1:10 – 1:20)**
  **The Manipulation:**
  1.  Announce a "Palate Standardization" procedure before the final verification task.
  2.  Distribute small rinse cups.
      *   **Alpha Group:** Rinses with water.
      *   **Beta Group:** Rinses with saturated sugar water. Instruct them to swish for 10 seconds and swallow (or spit, if preferred, but swallowing maintains the aftertaste longer).
  3.  **Immediate Task:** Hand out **Rating Sheet B**. It looks identical to Sheet A.
  4.  **Tasting:** Pour from the **same Carafes X, Y, Z** (in the same order).
  5.  **Instruction:** "Rate these again. We are checking for consistency in your judgments over the session."

  ### **The Conflict (1:20 – 1:30)**
  1.  **Data Collection:** Collect Sheet B.
  2.  **The Confrontation:** Ask the class: *"Did the samples feel the same as the start of class?"*
      *   **Beta Group (Sugar):** Will likely report Sample X, Y, Z taste *more bitter* or *less pleasant* due to the contrast effect.
      *   **Alpha Group (Water):** Will likely report consistency (or fatigue).
  3.  **The Trap:** Ask the Beta Group: *"What changed?"*
      *   They will say: "The liquid tastes stronger."
      *   Ask: *"Did I add more tonic to the carafe?"* (They saw you didn't).
      *   Ask: *"Did your tongue change?"* (They don't know about the sugar effect's specific impact on bitterness).
      *   Ask: *"Did your standard for '5/10 bitterness' move?"* (They can't tell).
  4.  **Team Points:** Award "Lab Accuracy Points" to the team (Alpha vs. Beta) that had the *lowest variance* between Sheet A and Sheet B. (The Alpha group usually wins, but the Beta group's *error* is the philosophical gold).

  ---

  ### **The Debrief: Quining the Experience (1:30 – 1:35)**
  **1. The Reveal:**
  Disclose the deception. Reveal that the carafes were never touched. Reveal that the rinses were different (Water vs. Sugar). Show them their own Sheet A next to Sheet B.

  **2. Mapping the Trilemma:**
  Draw three columns on the board. Map their experience to Dennett's three possibilities for why a judgment shifts (e.g., the Coffee Case):

  *   **Column 1: The Stimulus (The Flask)**
      *   *Reality:* Unchanged.
      *   *Student Intuition:* "But it *felt* more bitter."
      *   *Philosophical Point:* Introspection cannot verify stimulus constancy.
  *   **Column 2: The Experience (The Tongue/Qualia)**
      *   *Reality:* Changed (Physiological contrast effect).
      *   *Student Intuition:* "The taste itself changed."
      *   *Philosophical Point:* Even if the "qualia" shifted, can you isolate that shift from the judgment?
  *   **Column 3: The Standard (The Judgment)**
      *   *Reality:* Drifted (Due to the physiological shift influencing the scale).
      *   *Student Intuition:* "I'm rating it the same, it just is stronger."
      *   *Philosophical Point:* You cannot introspectively distinguish a change in the *sensation* from a change in the *scale* used to measure it.

  **3. Connecting to Dennett:**
  Now introduce "Quining Qualia." Explain that the Coffee Case argues that when someone says, "I used to like coffee, now I don't," they cannot know if:
  1.  The coffee tastes different (Stimulus).
  2.  Their experience of the taste is different (Qualia).
  3.  Their disposition to judge the taste is different (Standard).
  *   **The Punchline:** The experiment proves that **introspective access is not authoritative.** You felt a change, but you could not locate the source of that change without external data (my confession about the sugar).

  ---

  ### **Predictable Failures & Mitigation**
  Be prepared for these specific hiccups. They are not bugs; they are teaching moments.

  **1. The Adaptation Effect is Too Weak**
  *   **Risk:** The sugar rinse wears off in 5 minutes, or the tonic water isn't bitter enough to show a contrast.
  *   **Result:** Beta group reports no change. The "trap" fails.
  *   **Mitigation:** Have the Beta group rinse *immediately* before tasting Phase 2. Use high-quality tonic water (higher quinine content).
  *   **Philosophical Save:** If the effect fails, pivot to the *expectation* of error. "Even the possibility that your physiology shifted without your knowledge undermines the authority of introspection."

  **2. Supertasters and Non-Tasters**
  *   **Risk:** Genetic variation (TAS2R38 gene) means some students taste the tonic as water, others as poison.
  *   **Result:** High variance in data makes the "team score" messy.
  *   **Mitigation:** Acknowledge this in the debrief. "Some of you have different hardware. This reinforces Dennett's point: there is no 'standard' qualia to compare against."

  **3. The Skeptics ("I Knew It Was a Trick")**
  *   **Risk:** Upper-level philosophy students are paranoid. They may suspect the liquid changed or the rinse was active.
  *   **Result:** They write down what they think you *want*, not what they taste.
  *   **Mitigation:** Maintain a dry, scientific demeanor. Treat Sheet A as boring administrative data. If they confess suspicion in the debrief, use it: "Your suspicion shows you know introspection is fallible, which is exactly the point."

  **4. The "I Detected Everything" Student**
  *   **Risk:** A student claims they noticed the sugar rinse immediately or spotted the carafe not being sealed.
  *   **Result:** Undermines the deception.
  *   **Mitigation:** Do not argue. Say, "You are the control subject for 'awareness.' But for the rest of the class, the change was invisible."

  ---

  ### **Frank Limitations: What This Cannot Reproduce**
  You must explicitly state these limitations in the debrief to prevent overgeneralization.

  **1. The Timescale Problem**
  *   **The Demo:** 90 minutes.
  *   **The Coffee Case:** Years.
  *   **The Gap:** This demo shows *physiological contrast*. The coffee case is about *neural plasticity, habit, and cultural conditioning*.
  *   **Instruction:** Tell them: "I cannot simulate 5 years of neural rewiring in 90 minutes. I am simulating the *logical structure* of the uncertainty, not the biological mechanism of long-term preference shift."

  **2. The "Same Kind" Problem**
  *   **The Demo:** We know the liquid is chemically identical.
  *   **The Coffee Case:** We do not know if the experience of coffee at age 20 is the *same kind* of experience as at age 40.
  *   **Instruction:** "In this experiment, I can prove the flask didn't change. In real life, you cannot prove your brain processes the signal the same way today as it did five years ago. The experiment gives you a taste of the uncertainty, but in the real world, you lack the 'Debrief' where the truth is revealed."

  **3. The Authority of Introspection**
  *   **The Demo:** Students realize they were wrong about the source of the change.
  *   **The Coffee Case:** Dennett argues there may be *no fact of the matter* about whether the qualia changed.
  *   **Instruction:** "This experiment suggests you were *mistaken* about the cause. Dennett goes further: he suggests the question 'Did the qualia change?' might be ill-formed. This experiment motivates that skepticism; it doesn't prove it."

  ### **Instructor's Checklist for Success**
  1.  **Blind the Carafes:** Use opaque containers or keep them covered.
  2.  **Timing:** Ensure Phase 2 happens *immediately* after the sugar rinse.
  3.  **Tone:** Be bureaucratic during Phase 1. "Just standard calibration data."
  4.  **Safety:** Have water available for anyone who finds the bitterness overwhelming.
  5.  **Data:** Bring a calculator. Showing them the actual mean shift in the Beta group's ratings on the projector makes the effect undeniable.
