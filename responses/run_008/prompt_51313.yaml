prompt: |-
  I teach a 90-minute session of an upper-level philosophy of mind seminar (14 students) on Dennett's quining of qualia and the coffee cases he and others pressed about someone who liked coffee for years and now doesn't. Design an in-class tasting experiment that makes the students run into the problem before it is named: when a taste judgement changes, nothing available to introspection can settle whether the stuff changed, the experience changed, or only the standard changed. The vehicle should be a two-phase task within the one session: a disguised "calibration" rating of several dilutions of the same bitter drink at the start of class, treated as warm-up data for some other purpose, then a re-rating near the end -- with a physiological manipulation (say, a sugar-rinse adaptation) given to only half the room and the samples provably drawn from the same flasks throughout. Students should end up confidently reporting "it tastes different" when only their tongues changed, and showing drift in their standards across the session that they cannot localize even when shown their own first-phase sheets. No real-money payoffs; team accuracy points or nothing at all. Students should not hear the words "qualia" or the authors' names until the debrief. The debrief must map each moment onto the three-way distinction -- the unchanged flask, the changed tongue, the moved standard, and the introspective report that cannot tell them apart -- and disclose the mild deception used at the start. Tell me what will predictably go wrong the first time I run it (adaptation effects too weak, supertasters and non-tasters, students who insist they detected everything), and be frank about what the activity cannot reproduce: the years-long timescale of the original cases and the question of whether the earlier experiences themselves were of the same kind, which I will have to supply by hand in the debrief rather than stage.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Topic:** Dennett's "Quining Qualia" and the coffee cases (change in taste preference/judgment over time).
      *   **Goal:** Design an in-class tasting experiment that *enacts* the problem before naming it.
      *   **Core Problem:** When a taste judgment changes, introspection cannot distinguish between: (1) The stimulus changed, (2) The experience (qualia) changed, (3) The standard/judgment changed.
      *   **Structure:** 90-minute seminar, 14 students, upper-level philosophy of mind.
      *   **Mechanism:** Two-phase task.
          *   Phase 1 (Start): Disguised "calibration" rating of bitter drink dilutions (warm-up).
          *   Phase 2 (End): Re-rating same samples.
          *   Manipulation: Physiological (sugar-rinse adaptation) for half the class.
          *   Constraint: Samples drawn from same flasks throughout.
      *   **Outcome:** Students report "it tastes different" despite unchanged stimulus (or changed tongue), showing drift in standards they can't localize.
      *   **Incentives:** Team accuracy points (no money).
      *   **Secrecy:** No mention of "qualia" or authors until debrief.
      *   **Debrief:** Map moments to the three-way distinction, disclose deception.
      *   **Critique:** Predict failures (weak adaptation, supertasters, skeptics) and acknowledge limitations (timescale, nature of past experience).

  2.  **Safety & Ethics Check (Crucial Step):**
      *   *Food/Drink in Class:* Need to ensure allergen safety. Bitter substances can be problematic.
      *   *Substance:* Quinine (tonic water) is classic but can be strong. Denatonium benzoate (Bitrex) is safer but very bitter. Coffee is mentioned in the prompt's context but might be logistically hard to keep temperature/consistency. *Decision:* Use **Tonic Water (Quinine)** or **Diluted Lemon Juice/Bitter Melon Tea**. Tonic water is commercially available, consistent, and generally safe (unless quinine allergy, which is rare but possible). Let's go with **unsweetened Tonic Water** diluted with water. It's safe, distinctively bitter, and easy to manage.
      *   *Sugar Rinse:* Safe for most, but need to check for diabetics. Alternative: Salt water adaptation? Or just time/fatigue? The prompt suggests a physiological manipulation. A saturated sucrose rinse is standard for contrast effects. *Constraint:* Must screen for dietary restrictions.
      *   *Deception:* IRB approval might be technically required for research, but for *pedagogical demonstration* within a normal class activity involving common food items, it's usually exempt as long as no harm is done. I must advise the instructor to check institutional policies.
      *   *Informed Consent:* Even for class demos, students should know they can opt out of consuming substances.

  3.  **Designing the Experiment:**
      *   **Materials:** 3 Flasks (A, B, C) with different dilutions of Tonic Water. Cups. Water for rinsing. Sugar solution for the manipulation group. Rating sheets (coded, not named).
      *   **Phase 1 (T0):** "Sensory Calibration." Rate intensity and pleasantness of 3 samples.
      *   **Interim:** Lecture/Discussion (filler to allow time/adaptation).
      *   **Manipulation:** Half the class gets a "palate cleanser" that is actually a saturation rinse (sugar).
      *   **Phase 2 (T1):** "Verification Task." Rate the *same* 3 samples again.
      *   **The Twist:** The samples are identical to T0. The sugar rinse alters sensitivity (contrast effect).
      *   **The Philosophical Hook:** Did the liquid change? Did your feeling change? Did your scale change?

  4.  **Drafting the Lesson Plan (90 Minutes):**
      *   0-10: Setup & Phase 1 (Disguised).
      *   10-70: Lecture/Discussion (The "Filler").
      *   70-80: Manipulation & Phase 2.
      *   80-90: Debrief & Reveal.

  5.  **Addressing the "Predictable Failures":**
      *   *Adaptation too weak:* Sugar rinses wear off fast. Need to ensure Phase 2 happens immediately after rinse.
      *   *Supertasters:* Some will taste nothing or too much. Need a range of dilutions.
      *   *Skeptics:* "I knew this was a trick." Need to make the cover story plausible.
      *   *Hygiene:* Sharing cups is bad. Individual cups only.

  6.  **Addressing the Limitations (The "Frank" Assessment):**
      *   *Timescale:* This is 90 minutes, not years. The "coffee case" is about long-term preference shift. This demo is about immediate sensory shift. I need to explain how this *models* the logical structure, not the temporal experience.
      *   *Qualia:* The demo shows the *indistinguishability* of the sources of error, not necessarily the non-existence of qualia.

  7.  **Refining the Debrief:**
      *   Must explicitly map: Flask (Stimulus), Tongue (Physiology/Qualia), Standard (Judgment).
      *   Must reveal the deception gently.
      *   Must connect to Dennett's argument (Quining Qualia).

  8.  **Step-by-Step Walkthrough & Logistics:**
      *   *Prep:* Mix solutions beforehand. Label secretly (1, 2, 3). Prepare sugar rinse.
      *   *Handouts:* Rating sheets that look like data collection, not tests.
      *   *Seating:* Alternate rows for Control vs. Experimental group to prevent chatter.

  9.  **Self-Correction/Review against Prompt:**
      *   *Did I include the sugar rinse?* Yes.
      *   *Is it disguised?* Yes, "Calibration."
      *   *No "Qualia" until end?* Yes.
      *   *Predictable failures included?* Yes.
      *   *Limitations acknowledged?* Yes.
      *   *Team points?* Added a "Lab Accuracy" score to gamify it slightly without money.

  10. **Final Polish:** Ensure tone is academic yet practical. Emphasize safety and institutional compliance. (Self-correction: Make sure to emphasize that the "sugar rinse" creates a contrast effect, making the bitter taste *more* bitter, simulating a change in the subject).

  *(Self-Correction on the "Coffee Case" specifically):* Dennett's coffee case is often about *preference* (liking it) rather than just *intensity*. However, the prompt asks about "taste judgement changes... whether the stuff changed, the experience changed, or only the standard changed." The intensity/pleasantness rating covers this. I will ensure the rating sheet asks for both Intensity and Pleasantness to capture the "liking" aspect of the coffee case.

  *(Refining the Manipulation):* A sugar rinse makes bitter things taste *more* bitter (contrast). If I want to simulate the "I used to like coffee, now I don't" or "It tastes different now," increasing the perceived bitterness works.
  *Wait, one nuance:* The prompt asks for "drift in their standards... that they cannot localize."
  If I only change the tongue (sugar rinse), they might say "My tongue changed."
  To make it philosophically potent, I need them to be *unsure* if the liquid changed or they changed.
  *Strategy:* Tell them the flasks *might* have been swapped or diluted further between phases (a lie). Then, when they rate differently, they won't know if it's the liquid (Stimulus), the rinse (Experience), or their rating scale (Standard).
  *Actually, better:* Keep the liquid constant. Tell them nothing about the liquid. Just ask them to rate. When the results diverge, ask *why*. The uncertainty is the point.
  *Prompt requirement:* "samples provably drawn from the same flasks throughout." Okay, so I must prove this at the end.
  *Prompt requirement:* "Students should end up confidently reporting 'it tastes different' when only their tongues changed."
  Okay, so the manipulation (sugar) causes the report of difference. The philosophical punch is that *without the debrief*, they can't distinguish this from the liquid changing.

  Let's finalize the plan.

  *   **Safety:** Allergy check is mandatory.
  *   **Substance:** Tonic water (Quinine) is best. Bitter, safe, consistent.
  *   **Groups:** Group A (Water rinse), Group B (Sugar rinse).
  *   **Cover Story:** "Calibrating our sensory baseline for a study on attention."

  *   **Predictable Failures:**
      1.  Sugar effect fades too fast. (Mitigation: Do Phase 2 immediately).
      2.  Supertasters find it undrinkable. (Mitigation: Dilute heavily).
      3.  Skeptics. (Mitigation: Earnest demeanor).
      4.  No significant difference. (Mitigation: Have backup data or acknowledge it as a "null result" which is also philosophical data).

  *   **Limitations:** 90 mins vs Years. Immediate physiology vs Long-term neural plasticity/habit.

