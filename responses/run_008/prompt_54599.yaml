  2.  **Deconstruct the Audience & Their Objections:**
      *   *Deliberative Democrats (Habermasians):* They hate "aggregation" (summing up preferences). They value *communication*, *reason-giving*, and *consensus*. They see markets as atomizing and silencing. They worry about power dynamics and who gets to set the metric.
      *   *Behavioral Economist:* Worried about market inefficiencies, bubbles, manipulation, and the assumption that traders are rational expected utility maximizers.
      *   *Professor (Epistemic Democrat):* Cares about *truth-tracking*. Is the market finding the *right* answer or just the *popular* answer? Does this satisfy Condorcet conditions?

  3.  **Brainstorming Objections (and filtering for the specific audience):**
      *   *Standard Futarchy Objection:* "Who defines the metric?" (GDP? Happiness?) -> *Too rationalist.*
      *   *Deliberative Objection:* "This kills public reasoning." -> *High Damage.*
      *   *Deliberative Objection:* "Markets aggregate preferences without transformation." -> *High Damage.*
      *   *Behavioral Objection:* "Markets are noisy/manipulable." -> *Medium Damage.*
      *   *Epistemic Objection:* "Is this truth-tracking or preference satisfaction?" -> *High Damage (Professor).*
