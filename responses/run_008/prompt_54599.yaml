  4.  **Selecting and Ordering Objections (by Damage):**
      1.  *The Legitimacy/Deliberation Objection (Habermasians):* Markets bypass the "force of the better argument." This strikes at the core of their theory.
      2.  *The Epistemic Status Objection (Professor):* Is the market tracking truth or just intensity? If it's not truth, why trust it over voting?
      3.  *The Manipulation/Power Objection (Behavioral Econ + Critical Theory):* Wealth concentration in markets vs. one-person-one-vote.
      4.  *The Reversibility Definition Objection (Practicality):* What counts as reversible? (Good fallback, but less theoretical damage).
      5.  *The "Prayer Question":* The Metric Problem (Who sets the goal function?). This is the Achilles heel of all futarchy.

  5.  **Drafting the Replies (Tone Matching):**
      *   *Avoid:* "Efficiency," "Incentive Compatibility," "Rational Expectations."
      *   *Use:* "Discursive validity," "Epistemic reliability," "Power asymmetries," "Institutional design," "Feedback loops."
      *   *Strategy:* Don't defend futarchy as *better* than deliberation, but as a *complement* for specific technical domains where deliberation stalls or is biased. Frame the reversibility gate as protecting the "constitutional" sphere for deliberation.

  6.  **Developing the Content (Iterative refinement):**

      *   *Objection 1 (Deliberation):* Focus on how markets silence reason. *Reply:* Markets aren't replacing deliberation on *values* (voting remains), only on *causal beliefs* where evidence is scarce. The reversibility gate keeps the big normative stuff in the legislature. *Soft spot:* Markets still discourage public reason-giving on the *means*.
      *   *Objection 2 (Epistemic/Professor):* Truth vs. Preference. *Reply:* It's hybrid. It tracks the *probability* of achieving a democratically voted goal. It's Condorcet-adjacent if the market is liquid enough. *Soft spot:* Markets track prices, not necessarily truth, especially in low-liquidity scenarios.
      *   *Objection 3 (Behavioral/Power):* Wealth bias. *Reply:* Subsidized participation or capped stakes? No, better argument: Legislative oversight on market structure. *Soft spot:* Wealth *always* influences markets more than votes.
      *   *Objection 4 (Reversibility):* Definitional vagueness. *Reply:* Independent judicial/administrative review. *Soft spot:* Politics will bleed into the definition.
      *   *Prayer Question:* The Metric (GDP vs. Wellbeing). *Reply:* That's the "Vote on Values" part. *Soft spot:* Manipulation of the metric itself.

  7.  **Addressing the Specific Prompt Requirements:**
      *   *Reversibility Gate Analysis:* Does it help deliberation? It concedes the high-stakes normative ground to deliberation but keeps the technocratic ground for markets. It's a partition, not a solution.
      *   *Tone Check:* Ensure the students sound like grad students (theoretical, slightly skeptical, jargon-heavy but precise).

  8.  **Final Review against Constraints:**
