      *   **Step (8):** *The Second Critical Weakness.* "What defeated the lamp was infinitude itself... and every infinite series of tasks lacks a final member."
          *   *Why it looks innocent:* Both involve $\infty$ tasks in finite time.
          *   *Why it's false:* The Lamp is a *discontinuous* supertask (state flips). Motion is a *continuous* process (position function is continuous).
          *   *Precision:* The position function $x(t)$ for the stone is continuous. $\lim_{t \to 1} x(t) = x(1)$. The lamp function $L(t)$ is discontinuous. $\lim_{t \to 1} L(t)$ does not exist.
          *   *Cost:* Requires accepting the mathematical distinction between convergent and divergent series applied to physical quantities.
