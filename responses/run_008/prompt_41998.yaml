prompt: |-
  I'm a PhD student in political theory working on judgemental forecasting, and I've been trying to work out whether my gut reactions to uses of the outside view add up to anything coherent about reference classes. Here are the verdicts I keep finding myself defending. (1) A colleague forecasts that American primacy will end within a few decades because past hegemons have typically declined on roughly that timescale after reaching peak overstretch; the class is loose, and no past hegemon had nuclear weapons, reserve-currency status or instantaneous global communication, yet the extrapolation strikes me as legitimate. (2) When the same colleague forecasts the EU's dissolution by placing it among past European political unions, I balk: the EU was consciously designed by people who had studied exactly those failures, so counting it with things it was built to avoid feels like cherry-picking. (3) Reasoning that nuclear war next year is very unlikely because there has been none since 1945 strikes me as bad, even though it has exactly the same form as (1): a frequency in a historical class projected forward. (4) A friend predicting whether her marriage will last should use the divorce rate for couples like hers rather than the overall rate, even though the tailored class contains far fewer cases. (5) Yet a forecast built on the two or three closest historical analogues to some unprecedented event — a negotiated break-up of a currency union, say — leaves me cold, even though that class is maximally well matched. (6) And I endorse discounting a confident expert's geopolitical prediction on the ground that predictions by experts of that sort have historically fared barely better than chance, even though the class is drawn over forecasters rather than over events. Is there a single principle about reference-class selection — causal homogeneity, class size, independence of members, or whatever else — that captures all or most of these? If not, which verdicts would you overturn