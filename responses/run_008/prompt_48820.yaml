      *   *Audience:* Use terms like "Magic," "Kyūjō," "Downfall," "Hasegawa," "Frank."
      *   *Tone:* Professional, prepared, not defensive.

  7.  **Final Polish:** Check the phrasing. Make sure the historians sound like historians (e.g., "causal mechanism," "counterfactual baseline," "archival record"). Ensure the "Soft Spot" is honest self-critique.

      *(Self-Correction during drafting)*: I initially thought about putting the Just-War question higher. But the prompt says the user is arguing *necessity*, and the theorist knows this. The theorist will try to trap them into morality. I should place it lower because it's a category error, but still dangerous. The *Delay-Costs* is the real killer for the "saved lives" argument. The *Coup* is the killer for the "Emperor would have intervened" argument. I'll prioritize Delay-Costs as #1 per the advisor's warning.

      *(Refining the "Hope Nobody Asks")*: It needs to be the specific evidentiary gap. "Show me the cable where the Emperor decides to surrender *before* August 6th." That's the hard evidentiary wall.

