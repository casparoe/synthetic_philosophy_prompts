      *   *Refining #6 (Nagasaki):* *Reply:* Momentum/Truman didn't stop the schedule. *Soft Spot:* Looks like testing/overkill.
      *   *Refining #7 (Just War):* *Reply:* Stick to necessity. *Soft Spot:* It bleeds into morality.
      *   *Refining #8 (The Date):* *Reply:* Late August. *Soft Spot:* Pure speculation.

  6.  **Review against Constraints:**
