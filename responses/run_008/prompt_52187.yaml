answer: |-
  **MEMORANDUM**

  **TO:** Bargaining Committee, Local [Insert Local Number]
  **FROM:** [Your Name/Role]
  **DATE:** [Current Date]
  **SUBJECT:** Unified Strategy on Gate Automation & Structural Protections
  **MEETING:** Thursday Strategy Session

  **1. PURPOSE**

  We are currently split 50/50 on the terminal operator's proposal to automate the truck gates (OCR/Remote Checkers). One faction demands a total ban; the other is willing to trade acceptance for protections. A third perspective has been raised regarding the long-term structural impact of automation on labor power itself.

  This memo recommends a unified bargaining position that bridges these views. We cannot simply say "no" (management will view this as a deal-breaker and may seek concessions elsewhere) nor can we simply say "yes" (which erodes our membership and leverage over time).

  We must propose a **Technology & Power Package** that makes automation expensive for the employer, secures our income regardless of hours worked, and retains union control over the pace of change.

  **2. THE STRUCTURAL CHALLENGE (Addressing the *Grundrisse* Argument)**

  We need to take seriously the argument raised by [Member Name] regarding the changing nature of work. The core insight is this: As machines do more of the work, "labor time" becomes a worse measure of value creation, but capital still uses it to cut costs.

  If we only bargain for hourly wages, we are fighting over a shrinking pot. Every time they automate, they need fewer hours. Fewer hours mean fewer dues, smaller strike funds, and less leverage. If we accept automation without changing the *structure* of our pay and hours, we are helping management build a terminal that doesn't need us.

  **Therefore, our goal is not just to save specific jobs, but to decouple our livelihood from the reduction of labor time.** We must capture the productivity gains of the machines as a right, not a bonus.

  **3. RECOMMENDED CONTRACT LANGUAGE**

  We should present the following four clauses as a single package. This allows the "Hard No" faction to see that we are making automation difficult and costly, while the "Trade" faction sees concrete gains in income and security.

  **A. No Involuntary Layoffs & Attrition-Only Displacement**
  > *Draft Language:* "Implementation of Automated Gate Systems (AGS) shall not result in the involuntary layoff, furlough, or reduction in pay of any current member of the Bargaining Unit. Positions eliminated due to AGS shall be placed into a 'Reduction in Force Bank.' Members in the Bank shall retain full seniority and pay while awaiting placement into open positions via natural attrition (retirement/resignation)."

  **B. The "Productivity Dividend" (Capturing the Surplus)**
  > *Draft Language:* "The Employer agrees that productivity gains realized through AGS are jointly created by capital investment and labor cooperation. Within 90 days of full AGS implementation, the Employer shall open books to calculate net operational savings. Fifty percent (50%) of verified net annual savings shall be distributed to the Bargaining Unit as a lump-sum dividend, separate from base wage calculations."
  > * *Strategic Note:* This addresses the "shrinking pot" theory. If the machine creates wealth, we claim half of it, regardless of how many hours we work.

  **C. Work Sharing & Hours Reduction**
  > *Draft Language:* "To reflect increased productivity, the standard work week shall be reduced from 40 hours to 32 hours over the life of this agreement, with no reduction in weekly take-home pay. Overtime thresholds shall adjust accordingly."
  > * *Strategic Note:* This is the direct answer to the structural critique. If labor time is no longer the main driver of wealth, we should work less for the same pay. It also spreads the available work among more members, preserving membership density.

  **D. Joint Technology Committee with Implementation Veto**
  > *Draft Language:* "A Joint Labor-Management Technology Committee shall be established. The Union shall have veto power over the *pace* of AGS rollout if safety standards or training metrics are not met. No AGS component shall go live without Union sign-off on testing protocols."
  > * *Strategic Note:* This gives the "Hard No" faction leverage. We aren't banning the tech, but we can slow-walk it indefinitely if they don't meet our conditions.

  **4. BARGAINING STRATEGY**

  *   **To the "Hard No" Faction:** This package makes automation a financial burden for the company. The "Dividend" and "Hours Reduction" cost them almost as much as keeping the old system. If they refuse, we haven't conceded; we've priced them out.
  *   **To the "Trade" Faction:** This secures income and guarantees no one loses their job tomorrow. It locks in a share of the profits.
  *   **To the Structural Concern:** This begins the shift from "selling hours" to "claiming value." By reducing hours without reducing pay, we acknowledge that the machine is doing the work, but the worker owns the result.

  **5. NEXT STEPS FOR THURSDAY**

  1.  **Vote to Adopt Package:** We move to adopt this four-point framework as our *single* position on automation.
  2.  **Red Lines:** We agree that if they reject Clause B (Dividend) and C (Hours Reduction), we revert to a "Hard No" stance on automation for this cycle.
  3.  **Messaging:** We tell management: "We aren't Luddites. We know the tech is coming. But if the machines do the work, the workers get the time and the cash. That's the price of peace."

  This approach allows us to bargain in good faith without surrendering our long-term power. We are not just fighting for the current contract; we are fighting for the relevance of the union in an automated port.

  Let's lock this in Thursday.

  In Solidarity,

  [Your Name]
  Bargaining Committee
