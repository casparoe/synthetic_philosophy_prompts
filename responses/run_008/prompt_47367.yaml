answer: |-
  This is one of the most profound and painful real-world applications of philosophy of mind there is. You are right to feel that both your uncle and your mother are grasping at half-truths. In philosophy, this is often called the problem of **diachronic personal identity** (identity over time), and it collides here with **bioethics**.

  Your intuition is correct: both sides are relying on a binary view of identity ("He is the same" vs. "He is different"), whereas the reality of dementia suggests identity is gradual, relational, and fragmented.

  Here is a breakdown of the philosophical positions your family is taking, what they are missing, and how you might frame this to them using concepts from your coursework.

  ### 1. The Uncle's Position: Psychological Continuity
  **The Philosophy:** Your uncle is arguing from a Lockean perspective (John Locke). Locke argued that personal identity is founded on **consciousness and memory**. If you cannot remember making a promise, and your personality has fundamentally shifted, the "person" who made the promise no longer exists. There is a psychological discontinuity.

  **Where he is right:** There is a genuine sense in which the Grandpa who made that promise *is* gone. That man had a specific future-oriented autonomy, a specific understanding of dignity, and a specific capacity to keep his word. The current Grandpa lacks the cognitive architecture to uphold that agency.

  **What he is missing:** If we strictly follow psychological continuity, we risk abandoning the vulnerable. If identity vanishes when memory fades, do we owe *nothing* to the body sitting in front of us? It reduces a person to their current cognitive utility. It ignores **bodily continuity** (Animalism), which suggests that as long as the living organism persists, moral obligations to that organism persist.

  ### 2. The Mom's Position: Biological/Somatic Continuity
  **The Philosophy:** Your mom is arguing from a view closer to **Animalism** (philosophers like Eric Olson) or a **Social/Relational view of identity**. She sees the physical human being as the locus of identity. Furthermore, she likely views the promise as a binding contract that exists outside of Grandpa's head—it exists in the family structure and his relationship with Grandma.

  **Where she is right:** We generally hold that people are responsible for debts, marriages, and promises even if they change their minds or forget the details later. To say "he isn't the same person" can feel like a convenient way to erase the history and dignity of the man he was for 80 years.

  **What she is missing:** She risks violating the **current interests** of the being in front of her. If keeping the promise (staying at home) causes the current Grandpa suffering, confusion, or danger, is honoring a ghost from the past more important than the well-being of the present subject? She is prioritizing **precedent autonomy** (the past self's right to rule) over **current welfare**.

  ### 3. What Both Are Missing: The "Narrative" and "Critical Interests"
  You mentioned they are missing something about "what a person even is." Here are two concepts from philosophy of mind and bioethics that bridge the gap.

  #### A. Personhood as a Narrative (Marya Schechtman)
  Philosopher Marya Schechtman argues that we are not just bags of memories (Locke) or just bodies (Animalism); we are **narratives**. We make sense of ourselves through the stories we tell.
  *   **The Conflict:** Grandpa still *has* a narrative. He still feels like a continuous self ("I am the same guy from start to finish"), even if the facts are wrong.
  *   **The Insight:** The promise wasn't just a data point; it was a *plot point* in his life story. It defined his character. To ignore it completely (Uncle) erases his story. To enforce it rigidly (Mom) might turn his final chapter into a tragedy that contradicts the care he needs now.
  *   **The Synthesis:** You aren't deciding if he is the "same"; you are deciding how to **complete his story** with integrity.

  #### B. Critical Interests vs. Experiential Interests (Ronald Dworkin)
  This is the most useful tool for your family debate. Legal philosopher Ronald Dworkin distinguished between two types of interests:
  1.  **Experiential Interests:** What makes you feel good *now* (comfort, safety, lack of confusion).
  2.  **Critical Interests:** Values that make your life good *as a whole*, even if you don't realize it at the moment (dignity, keeping vows, artistic legacy).

  *   **The Uncle** is prioritizing *Experiential Interests* (Practicality/Safety).
  *   **The Mom** is prioritizing *Critical Interests* (The Promise/Integrity).
  *   **The Missing Piece:** Dworkin argued that **Critical Interests usually survive incompetence.** The fact that Grandpa forgot the promise doesn't mean the promise no longer matters to the *value of his life*. However, Dworkin also acknowledged that if the current suffering is extreme, the balance shifts.

  ### What to Say to Them
  You don't need to solve the metaphysics to help them. You can reframe the question. Instead of asking *"Is he the same person?"* (which has no clear answer), ask *"What kind of love does he require now?"*

  Here is a script you might adapt:

  > "I've been thinking about this a lot, especially with my philosophy class. I think you're both right, but you're answering different questions.
  >
  > Uncle [Name], you're right that the mind who made the promise isn't fully here anymore. If we treat him exactly like he was ten years ago, we might ignore his current needs and safety.
  >
  > Mom, you're right that he is still Grandpa. That promise was the core of his dignity. If we ignore it completely, we aren't respecting the life he lived.
  >
  > But I think there's a third option. In philosophy, there's an idea that we have a duty to the 'whole life' of a person, not just their current mood or their past words. The question isn't whether he's the 'same guy.' The question is: **How do we honor the man he was while caring for the person he is?**
  >
  > Maybe keeping the promise doesn't mean 'never a care facility.' Maybe it means 'never a facility where he is neglected.' Maybe it means we find a place that feels like home, so we keep the *spirit* of the promise without endangering his body. We aren't betraying him by adapting the promise to his new reality; we are stewarding his dignity through a change he can't navigate himself."

  ### The Hard Truth
  Ultimately, this is a **tragic dilemma**. In tragedy, there is no clean win. There is only loss management.
  *   If you keep the promise, you risk his safety.
  *   If you break the promise, you risk his integrity.

  Your family is fighting because they are both trying to protect him from different kinds of harm. The "person" is not just the brain, and not just the body; he is the **relationship** you all have with him. That relationship survives the Alzheimer's even if his memory doesn't.

  You are the steward of that relationship now. The promise binds *you* (the family) to honor his values, but it does not bind you to destroy his well-being in the name of a literal interpretation he can no longer comprehend.

  **Summary for your studies:** If you need to cite this later, look into **Derek Parfit's *Reasons and Persons*** (on reductionism and identity not being what matters) and **Ronald Dworkin's *Life's Dominion*** (on precedent autonomy). But for your family, focus on **Integrity of Care** over **Identity Metaphysics**.
