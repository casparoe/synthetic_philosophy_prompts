prompt: |-
  I'm presenting to my department's works-in-progress group next Friday. Quick setup: I'm defending the view that the Knobe effect — people saying the chairman harmed the environment "intentionally" in the harm version of the case but not helping it "intentionally" in the help version — is not evidence that moral judgments infiltrate our concept of intentionality, as most people read it. On my view, the asymmetry comes from pragmatics: "intentionally" primarily serves to license responses like blame and credit, so when no reactive attitude is on the table, the asymmetry dissolves. The audience is about fifteen people: mostly ethicists who are skeptical of experimental philosophy generally and think survey methods tell you about interestingness of wording rather than concepts, plus two cognitive scientists who love the x-phi stuff but think any pragmatics story is unfalsifiable hand-waving, and one guy who will ask about whether I've run it in a non-WEIRD sample no matter what my slides say. Give me a prep sheet: the objections I'm actually going to get, in the order they'll probably come, phrased the way each group would put them; for each, a two-minute reply, what to concede, and where the reply is soft. Also include the question I'm hoping no one asks, and tell me if there's anything I should proactively put in the talk's last slide so it doesn't come up at all in Q&A. Keep in mind I can't respond to a demand for new empirical data by promising a study — I need replies that work with what's already in the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **Topic:** The Knobe Effect (Side-Effect Effect).
      *   **Speaker's View:** Pragmatic account (intentionality licenses blame/credit; asymmetry dissolves without reactive attitudes). *Not* moral infiltration of concepts.
      *   **Audience:** 15 people.
          *   Group A: Ethicists (skeptical of x-phi, think surveys show wording interestingness, not concepts).
          *   Group B: Cognitive Scientists (2 people, love x-phi, think pragmatics is unfalsifiable hand-waving).
          *   Group C: The "WEIRD" Guy (1 person, always asks about cross-cultural samples).
      *   **Constraints:**
          *   Prep sheet format (Objections, 2-min reply, concession, soft spot).
          *   Order of objections (probable flow).
          *   Phrasing (tailored to each group's jargon/concerns).
          *   "The Question I Hope No One Asks" + mitigation strategy (last slide).
          *   *Crucial Constraint:* Cannot promise new empirical data. Must rely on existing literature/argumentation.

  2.  **Deconstruct the Speaker's Position:**
      *   Core claim: The Knobe Effect is pragmatic, not semantic/conceptual.
      *   Mechanism: "Intentionally" is a speech act licensing reactive attitudes (Strawsonian vibe).
      *   Prediction: If you remove the blame/credit context, the effect disappears or changes.
      *   Vulnerability: Pragmatic accounts are often accused of being "post-hoc" or untestable without new experiments. Also, the "concept" vs. "application" distinction is shaky.

  3.  **Anticipate Objections (Group by Group):**

      *   *Ethicists:* They don't care about the psychology as much as the philosophical implication. They'll attack the relevance. "Why does it matter if it's pragmatics? You're still using surveys to make conceptual claims."
      *   *Cognitive Scientists:* They want mechanism and falsifiability. "How do you measure 'licensing'? Where's the model? Pragmatics is a dustbin for failed semantic theories."
      *   *WEIRD Guy:* "Is this universal? If it's pragmatic, shouldn't it vary by culture? Or if it's universal, isn't that deep cognition?"

      *   *Order:* Usually, Q&A starts with clarifications (often from the friendly or confused), then moves to the biggest threats. The Ethicists are the majority, so they'll likely start. The Cog Sci folks will dig into the mechanism. The WEIRD guy usually waits for a specific hook or asks at the end. Let's order it: 1. Ethicists (Relevance/Method), 2. Cog Sci (Falsifiability), 3. WEIRD (Generalizability).

  4.  **Drafting the Objections & Replies:**

      *   *Objection 1 (Ethicists):* "You're just moving the goalposts from semantics to pragmatics. Surveys still don't tell us about *concepts*."
          *   *Reply:* Distinguish competence from performance. Pragmatics *is* part of how we use concepts. Cite existing lit (e.g., Pettit, Knobe's later work admitting pragmatic elements).
          *   *Concession:* Surveys alone aren't enough; need philosophical argument.
          *   *Soft Spot:* The line between semantic content and pragmatic implicature is notoriously blurry (Grice vs. Recanati).

      *   *Objection 2 (Cog Sci):* "Pragmatics is unfalsifiable. You say 'context matters,' but you don't specify *which* context features trigger the license."
          *   *Reply:* Point to existing studies where the effect disappears (e.g., Nadelhoffer's work, or cases where blame isn't appropriate). It *is* falsifiable: if the effect persists in neutral blame/credit contexts, I'm wrong.
          *   *Concession:* I don't have a full computational model yet.
          *   *Soft Spot:* Existing studies might be interpreted differently (e.g., as changing the *scenario* not the *pragmatics*).

      *   *Objection 3 (WEIRD Guy):* "Have you looked at non-WEIRD samples? If it's pragmatic, cultural norms should shift the effect size."
          *   *Reply:* Cite existing cross-cultural x-phi (e.g., Huebner, or the Knobe replications). Some show universality, some variation. If variation exists, it supports pragmatics (norms vary). If universal, it supports deep pragmatic structures.
          *   *Concession:* I haven't run new cross-cultural studies.
          *   *Soft Spot:* The existing literature is mixed/inconclusive.

      *   *The "Hope No One Asks" Question:* This needs to be the killer. Usually, it's about the *direction* of explanation. "How do you know morality isn't shaping the pragmatics?" (The Deep Self vs. Pragmatics debate). Or, "If 'intentionally' licenses blame, why do we blame unintentional harms?"
      *   *Selection:* "If 'intentionally' is just a license for blame, why do we ever blame for negligence (unintentional) or praise for lucky outcomes?" This attacks the core link between the word and the attitude.
      *   *Mitigation:* Put a slide up distinguishing *licensing* from *necessity/sufficiency*.

  5.  **Refining the Content (Self-Correction/Constraint Check):**
      *   *Constraint:* No promising new data.
      *   *Fix:* Ensure replies cite existing papers (Knobe, Pettit, Nadelhoffer, Gibb, etc.) or logical distinctions.
      *   *Tone:* Professional, prepared, slightly defensive but confident.
      *   *Formatting:* Clear headings, bullet points for readability during a talk prep.

  6.  **Final Polish:**
      *   Make sure the "Ethicist" objection sounds like an ethicist (focus on normativity/concepts).
      *   Make sure the "Cog Sci" objection sounds like a scientist (focus on mechanisms/falsifiability).
      *   Ensure the "WEIRD" objection is specific.
      *   Check the "Last Slide" strategy. It needs to be subtle but effective.

  7.  **Drafting the Response:** (Mental Outline)
      *   Intro: Context setting.
      *   Section 1: The Objections (Ethicist, Cog Sci, WEIRD).
      *   Section 2: The Killer Question.
      *   Section 3: The Last Slide Strategy.
      *   Section 4: General Delivery Tips.

      *(Self-Correction during drafting)*: Wait, the prompt asks for the objections *in the order they'll probably come*. Ethicists are the majority (12 out of 15 roughly). They will dominate early. Cog Sci will jump in when the mechanism is discussed. WEIRD guy is a wildcard but usually late Q&A. I will structure it 1. Ethicists (Methodology), 2. Cog Sci (Falsifiability), 3. WEIRD (Generalizability).

      *Refining the "Killer Question":* The strongest philosophical objection to a pragmatic account is usually: "Even if pragmatics explains the *asymmetry*, why does the word 'intentionally' track the *moral valence* at all? Doesn't that imply the moral judgment is prior?" I need to make sure the mitigation slide addresses the *direction of fit*.

      *Refining the "No New Data" constraint:* I need to be careful not to say "I will test this." Instead, "The literature already suggests..." or "The theoretical framework predicts..."

      *Let's write it.*
answer: |-
  # Prep Sheet: Knobe Effect & Pragmatics Defense
  **Venue:** Department Works-in-Progress
  **Time:** Next Friday
  **Audience:** 12 Ethicists (Skeptics), 2 Cog Sci (Pro-x-phi, Anti-Pragmatics), 1 Cross-Cultural Specialist

  ## Part 1: Predicted Objections (In Order of Appearance)

  ### 1. The Ethicist's Methodological Challenge
  **Who:** Senior Ethicist (likely the first hand up).
  **The Objection:** "You're drawing a heavy metaphysical conclusion about the concept of intentionality based on speech patterns. Even if you show 'intentionally' is used pragmatically to license blame, aren't you just describing *performance* errors? You haven't shown the underlying *competence* (the actual concept) isn't morally laden. Surveys track usage, not concepts."
  **The 2-Minute Reply:**
  "I agree that usage isn't identical to competence, but on a Wittgensteinian or use-theory account, the concept *just is* its role in our normative practices. If 'intentionally' functions to allocate responsibility, that function constitutes its meaning. I'm relying on the literature (e.g., Pettit 2009, Knobe's later pragmatic turns) that treats the 'blame license' not as a bug, but as the feature of the folk concept. If the word only triggers under specific normative conditions, the normativity is internal to the concept's application conditions, not an external intrusion."
  **What to Concede:**
  Concede that surveys alone cannot settle the metaphysics of concepts. Acknowledge you are offering a *philosophical interpretation* of the data, not a raw empirical proof.
  **Where the Reply is Soft:**
  The distinction between "semantic content" and "pragmatic implicature" is notoriously messy. If they press on *where* the semantics ends and pragmatics begins, you risk looking like you're moving the goalposts to save the theory.

  ### 2. The Cognitive Scientist's Falsifiability Trap
  **Who:** One of the two Cog Sci folks (likely after you've explained the mechanism).
  **The Objection:** "Pragmatic accounts are often unfalsifiable dustbins. You say the effect appears when reactive attitudes are 'on the table.' How do you measure that independently of the effect itself? If the effect appears, you say attitudes were on the table; if it disappears, you say they weren't. That's circular. Where is the independent variable?"
  **The 2-Minute Reply:**
  "It's not circular because we have independent manipulations in the existing literature. For example, studies where the agent is dead, or God, or where the outcome is trivial show the effect diminishes or vanishes (cite Nadelhoffer or Gibb). My claim predicts that if you explicitly decouple the outcome from responsibility (e.g., 'The chairman is not responsible for this'), the asymmetry should drop. The falsification condition is clear: If the asymmetry persists robustly in contexts where blame/credit is explicitly ruled out or impossible, my view is false."
  **What to Concede:**
  Concede that a full computational model of the pragmatic licensing is not yet complete. Admit that "on the table" is a heuristic description, not yet a formalized cognitive parameter.
  **Where the Reply is Soft:**
  Existing studies where the effect "diminishes" rarely make it disappear *completely*. They will pounce on residual asymmetry as evidence that the moral core remains, and your pragmatic story is only partial.

  ### 3. The WEIRD Sample Challenge
  **Who:** The One Guy (usually saves this for when he senses vulnerability).
  **The Objection:** "Have you looked at non-WEIRD samples? If this is pragmatic, it relies on social norms. Social norms vary cross-culturally. If the Knobe effect is universal (as some replications suggest), doesn't that suggest a deep cognitive structure rather than flexible pragmatics? If it varies, doesn't that just mean different moral concepts, not pragmatics?"
  **The 2-Minute Reply:**
  "Actually, cross-cultural data supports the pragmatic view. Studies (e.g., by Huebner or the Knobe replications) show variation in effect size based on cultural attitudes toward authority and collective responsibility. If the concept were hard-wired and morally infiltrated universally, we'd expect uniformity. The variation suggests the *application* of the concept is sensitive to local normative frameworks. Whether it varies or is universal, pragmatics handles it: universal pragmatics (Gricean maxims are human universals) or variable norms (local licensing conditions)."
  **What to Concede:**
  Concede you have not collected new cross-cultural data yourself. Rely entirely on the existing mixed literature.
  **Where the Reply is Soft:**
  The cross-cultural literature is actually quite messy and contested. If they know the specific papers better than you, they can cite a study showing universality that contradicts your claim about variation.

  ---

  ## Part 2: The Question You Hope No One Asks

  **The Question:** "If 'intentionally' is just a license for blame, how do you explain **negligence**? We blame people for *unintentional* harms all the time. If the word's primary function is to license blame, why do we ever blame without it? Conversely, why do we sometimes say 'intentionally' in contexts where no blame is appropriate (e.g., 'He intentionally breathed through his nose')?"

  **Why it's dangerous:** It attacks the biconditional link between your pragmatic function (licensing blame) and the linguistic data. If blame happens without the word, and the word happens without blame, the "licensing" story looks weak.

  **The Mitigation Strategy (Last Slide):**
  Do not wait for this question. Put up a **"Scope & Limitations"** slide as your final content slide before "Thank You."

  **Slide Content:**
  *   **Header:** Pragmatics vs. Necessity/Sufficiency
  *   **Bullet 1:** Claim: "Intentionally" *facilitates* reactive attitudes, it does not *gate* them. (Addresses Negligence).
  *   **Bullet 2:** Claim: Pragmatic licensing is context-sensitive, not truth-conditional. (Addresses "Breathing" cases).
  *   **Bullet 3:** Citation: Reference a standard speech-act theorist (e.g., Austin or Searle) or a specific x-phi paper that distinguishes *focus* from *truth*.

  **Why this works:** By proactively stating that you are *not* arguing for a necessary/sufficient condition, you inoculate yourself against the negligence objection. It makes the question look like they missed your final slide rather than exposing a hole in your theory.

  ---

  ## Part 3: General Delivery Tips for This Room

  1.  **Don't Fight the Ethicists on "Concepts":** When they say "That's not the concept," don't say "Yes it is." Say, "I am proposing a revisionary understanding of how the concept functions in practice." It lowers the temperature.
  2.  **Respect the Cog Sci Constraint:** When discussing falsifiability, use the word "operationalize." Say, "We can operationalize 'reactive attitudes on the table' by..." It signals you speak their language, even if you aren't running an fMRI.
  3.  **The "No New Data" Rule:** Since you cannot promise a study, use phrases like "The existing literature predicts..." or "The theoretical framework entails..." This keeps you in the realm of philosophical argumentation, which is your safe zone.
  4.  **Manage the WEIRD Guy:** If he presses harder than the slide allows, say: "That is exactly why I'm focusing on the *mechanism* of pragmatics first. Once we agree on the mechanism, cross-cultural variation becomes a parameter to adjust, not a threat to the model."

  **Good luck. Keep your answers under two minutes. If you go long, the Ethicists will eat you.**
