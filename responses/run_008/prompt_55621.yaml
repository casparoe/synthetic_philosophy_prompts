  **Documented Views:** In "Computing Machinery and Intelligence" (1950), Alan Turing proposed creating intelligence by educating a "child machine" rather than programming an adult one. He argued learning occurs through "reward and punishment" (trial and error), where the teacher is largely ignorant of the machine's internal state. Crucially, the machine must modify its own organization through experience; the outcome is unpredictable.

  **Extrapolation:** Applying this to human pedagogy: if the student is the "child machine," intellectual struggle is the mechanism of structural change. Offloading work to a chatbot bypasses this trial-and-error, preventing the student's internal reconfiguration. However, Turing viewed education as interaction with an environment. He would likely see the chatbot not as a substitute for processing, but as a dynamic environment for testing hypotheses.

  **Policy Recommendation:** Turing would advise against a ban, which treats the tool as contraband. He would also reject passive permission, which allows students to bypass the learning process. Instead, he would recommend **building them into instruction** as agents of feedback. Students should use chatbots to test conjectures, debug reasoning, and engage in dialogue where the *student* evaluates the bot's output. Teachers should assess the interaction, not just the final answer, acknowledging they cannot know the student's internal state. This preserves the student's role as the entity undergoing education, while the bot acts as the unpredictable environment providing rewards (correct math) and punishments (errors).

  **Conclusion:** Turing's core insight is that intelligence emerges from the educational process, not the initial state. Therefore, policy must ensure the student remains the entity undergoing the trial-and-error, not the observer of the bot's performance. Use the bot to generate problems, not solutions.
