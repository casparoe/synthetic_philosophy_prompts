      *   *Correction on "Server":* If I map God to Server, I risk materialism (Server = Matter). Berkeley's God is Spirit/Mind. A better map might be the *Engine Core* itself, but even that implies data structures. The most faithful map is that *Memory itself is Perception*. If it's not in RAM, it doesn't exist. But RAM persists without a screen.
      *   *Refined Map:* The "World" is the *Frame Context*. There is no "Scene Graph" that persists between frames except as a cache for the next perception.
      *   *Actually, the best fit for Berkeley in engines is:* **View-Dependent Procedural Generation.** If the terrain is generated *only* when the camera looks at it, and deleted when it looks away, with no persistent seed state *outside* the generator's mind... wait, the seed is the "Idea in God's mind."
      *   *Okay, let's lock the analogy:*
