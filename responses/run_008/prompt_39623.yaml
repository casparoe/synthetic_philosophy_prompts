answer: |-
  # HANDOUT: The Logic of the Franchise
  **Course:** [Course Name] | **Unit:** Democratic Boundaries & Participation

  ### The Core Problem
  We often treat "Who votes?", "Must they vote?", and "How old must they be?" as three separate policy debates. They are not. They are three variables in a single equation: **What justifies political power?**

  This decision tree maps the logical space of the franchise. It does not start with "What do the experts say?" It starts with commitments you can evaluate yourself. Follow the branches to see which theoretical position you inhabit—and what uncomfortable consequences come with it.

  ---

  ### PART 1: THE DECISION TREE
  *Start at the root. Choose the path that matches your intuition.*

  **ROOT:** The franchise cannot be inherited from history; it requires a moral justification.

  **NODE 1: THE GROUND OF ENTITLEMENT**
  *Why does a person get a say in the first place?*
  *   **A. Protection of Interests:** Because decisions impact their well-being. *(Go to Node 2A)*
  *   **B. Legitimacy of Authority:** Because they are subject to the coercive power of the state. *(Go to Node 2B)*
  *   **C. Membership in Community:** Because they belong to the collective "people." *(Go to Node 2C)*
  *   **D. Quality of Outcomes:** Because they are capable of choosing wisely. *(Go to Node 2D)*

  **NODE 2A (Interests): How far does "impact" stretch?**
  *   **i.** Only to those physically present within borders. → *Resident Interest View*
  *   **ii.** To anyone causally affected, regardless of borders. → *All-Affected View*
  *   **iii.** To anyone with a "stake," weighted by intensity. → *Stakeholder View*

  **NODE 2B (Authority): What counts as "subjection"?**
  *   **i.** Only those legally bound by the law (citizens + residents). → *All-Subjected View*
  *   **ii.** Only those with a permanent legal bond (citizens only). → *Status Quo View*
  *   **iii.** Anyone subject to the law, including diaspora abroad. → *Global Subjection View*

  **NODE 2C (Membership): What creates "belonging"?**
  *   **i.** Formal legal status (Citizenship). → *Liberal Nationalism*
  *   **ii.** Social fact of residence (Living here > 3 years). → *Resident Alien View*
  *   **iii.** Historical/Cultural ties (Ancestry/Diaspora). → *Ethno-National View*

  **NODE 2D (Competence): What proves "capability"?**
  *   **i.** A proxy threshold (Age 18). → *Maturity View*
  *   **ii.** A lower proxy threshold (Age 16). → *Youth Enfranchisement*
  *   **iii.** A knowledge test (Civics exam). → *Epistocratic View*
  *   **iv.** No threshold (Equality trumps competence). → *Universalist View*

  **NODE 3: THE OBLIGATION (Applies to all above)**
  *Once someone is entitled to vote, must they use it?*
  *   **X.** No. It is a waivable right. → *Voluntary*
  *   **Y.** Yes. It is a civic duty enforceable by penalty. → *Compulsory*
  *   **Z.** Yes, but enforced only by social expectation/administrative hurdle. → *Soft Duty*

  ---

  ### PART 2: MAPPING THE POSITIONS (THE LEAVES)
  *Most named theories are just specific paths through the tree above. Here are 10 common endpoints and the "bullet" each must bite.*

  1.  **Liberal Rights Universalism** (Path: 2C-i + 2D-iv + 3X)
      *   *The View:* Citizenship + Age 18 + No Duty.
      *   *Awkward Commitment:* Must accept that low turnout is regrettable but not unjust, even if it skews policy toward the wealthy.
  2.  **Civic Republicanism** (Path: 2C-i + 2D-iv + 3Y)
      *   *The View:* Citizenship + Age 18 + Compulsory Voting.
      *   *Awkward Commitment:* Must justify fining the apathetic or coerced, treating voting as labor rather than liberty.
  3.  **The All-Subjected Principle** (Path: 2B-i + 3X)
      *   *The View:* All residents subject to law vote, citizens or not.
      *   *Awkward Commitment:* Must enfranchise undocumented migrants or tourists detained by local law, potentially diluting citizen voice.
  4.  **The All-Affected Interests** (Path: 2A-ii + 3X)
      *   *The View:* Anyone impacted by a decision votes on it.
      *   *Awkward Commitment:* On climate policy, this implies enfranchising nearly the entire global population for national elections.
  5.  **Epistocratic Restrictionism** (Path: 2D-iii + 3X)
      *   *The View:* Only those who pass a knowledge test vote.
      *   *Awkward Commitment:* Must identify a testing authority trustworthy enough to gatekeep power without biasing results toward their own class.
  6.  **Status Quo Age-Based** (Path: 2C-i + 2D-i + 3X)
      *   *The View:* Citizenship + Age 18.
      *   *Awkward Commitment:* Must defend why a 17-year-old working and paying taxes is less competent than an 18-year-old who is not.
  7.  **Youth Enfranchisement** (Path: 2C-i + 2D-ii + 3X)
      *   *The View:* Voting age lowered to 16.
      *   *Awkward Commitment:* Must explain why 16 is the magic number of maturity when alcohol/contract laws often say 18 or 21.
  8.  **Resident Alien Voting** (Path: 2C-ii + 3X)
      *   *The View:* Long-term residents vote without citizenship.
      *   *Awkward Commitment:* Must separate local voting rights from national sovereignty, creating two tiers of voters in the same booth.
  9.  **Diaspora Enfranchisement** (Path: 2B-iii or 2C-iii + 3X)
      *   *The View:* Expats vote in home elections indefinitely.
      *   *Awkward Commitment:* Must allow people who pay no taxes and face no local consequences to decide the fate of those who do.
  10. **Stakeholder Weighting** (Path: 2A-iii + 3X)
      *   *The View:* More affected = more votes.
      *   *Awkward Commitment:* Must abandon "one person, one vote," risking a return to plural voting systems based on property or education.

  ---

  ### PART 3: INSTRUCTOR NOTES (LOGICAL GLITCHES)

  **1. Indistinguishable Leaves: Liberal Universalism vs. Civic Republicanism**
  *   **The Glitch:** If you focus only on *eligibility* (Node 1 & 2), these two views look identical (everyone votes). They only separate at Node 3 (Obligation).
  *   **The Fix:** However, in practice, a Republican might accept "Soft Duty" (Node 3Z) and a Liberal might accept "Automatic Registration" (Node 3X), resulting in identical turnout rates. The tree separates them *normatively* (Right vs. Duty), but not *empirically* (Outcome). This suggests the "Obligation" node is deeper than policy mechanics; it's about the moral relationship between citizen and state.

  **2. Unoccupied Corners: Combinations Nobody Defends**
  *   **Compulsory Epistocracy:** (You *must* vote, but only if you pass a test).
      *   *Status:* **Incoherent.** You cannot have a moral duty to perform an act you are forbidden from doing if you lack capacity. It turns the test from a license into a trap.
  *   **Voluntary Citizens / Compulsory Residents:** (Citizens choose, Residents must vote).
      *   *Status:* **Unattractive.** This creates a "second-class duty," where those with the least formal membership bear the highest burden of participation.
  *   **Global Affectedness + Compulsory Voting:** (The whole world votes on everything and must show up).
      *   *Status:* **Unexplored/Impossible.** There is no global enforcement mechanism to compel attendance, making the "Compulsory" branch logically impossible at the "All-Affected" leaf.

  ---
  *Use this map to locate your own position before reading the assigned texts. If you find yourself wanting to jump between branches, ask yourself: are you inconsistent, or is the problem with the tree?*
