          *   *Ethical Hedonism:* Does the truth of "Pleasure is the only good" depend on this?
              *   *CQP view:* Yes, usually requires a common currency to maximize.
              *   *DP view:* Can still be hedonists (Attitudinal Hedonism), but the *measurement* changes.
              *   *Agreement:* We agree that *classical quantitative hedonism* (Benthamite calculus) is harder if DP is right, but *qualitative hedonism* or *attitudinal hedonism* survives. Let's refine: We agree that the *viability of a simple felicific calculus* depends on this.

      *   **Section 2: Table of Disagreements:**
          *   Need to phrase these so neither side feels mischaracterized.
          *   *Core Ontology:* Is there a distinct phenomenological property?
          *   *Language:* Does "pleasant" describe a sensation or an attitude?
          *   *Explanation:* Does the sensation cause the favoring, or does the favoring constitute the pleasure?

      *   **Section 3: Cruxes & Tests:**
          *   *Crux 1: The "Common Glow" Introspection.* Can we isolate the feeling from the content?
              *   *Test:* Focus on the feeling of drinking water vs. reading poetry. Strip away the context.
              *   *CQP Prediction:* You will find a residual "liking" tone.
              *   *DP Prediction:* You will find only the specific sensory details + the disposition to continue.
          *   *Crux 2: Unpleasant Pleasures / Masochism.* (Classic counterexample).
              *   *Test:* Enjoying a sad movie or spicy pain.
              *   *CQP:* There is still a positive hedonic tone layered on the pain.
              *   *DP:* You favor the experience *as a whole* despite the pain; no separate positive tone needed.
          *   *Crux 3: The Simultaneity/Memory Problem (Specific Request).*
              *   *Issue:* Can't compare water-run and math-proof simultaneously. Memory fades.
              *   *CQP Prediction:* This is an epistemic limit, not ontological. The quality exists even if we can't compare it perfectly.
              *   *DP Prediction:* This suggests the quality is a post-hoc construction. If it can't be compared, it's not a unified metric.

