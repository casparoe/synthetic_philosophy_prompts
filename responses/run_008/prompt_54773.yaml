  2.  **Deconstruct the Philosophical Debate:**
      *   This is the classic debate between *Feeling Theory* (Old Hedonism, Bentham, Sidgwick, perhaps Moore's critique) vs. *Attitudinal Theory* (Feldman, Brandt, contemporary desire satisfactionism).
      *   *CQP:* Phenomenal unity. There is a "glow" or "tingle" common to eating cake and solving math.
      *   *DP:* Heterogeneity. The only thing in common is that we want them/like them when we have them.
