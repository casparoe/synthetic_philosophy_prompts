answer: |-
  # Joint Statement on the Phenomenology and Unity of Pleasure
  **Prepared by the Common-Quality Party (CQP) and the Diversity Party (DP)**
  **Philosophy Society Adversarial Collaboration**

  ## Preamble
  We, the undersigned factions of the Philosophy Society, acknowledge that our year-long debate regarding the unity of pleasure has reached a stalemate. While we remain divided on the metaphysical and phenomenological nature of pleasure, we agree on the boundaries of our dispute, the evidence required to resolve it, and the stakes involved. This document records our points of convergence, our precise divergences, and the experimental or conceptual tests we agree are relevant to settling the matter.

  ## I. Agreed Claims
  Both parties affirm the following propositions:

  1.  **The Exemplars:** Our dispute originated from attempting to compare the phenomenology of three specific states: (a) the relief of cold water after a long run, (b) the intellectual satisfaction of understanding a proof, and (c) the social warmth of an evening with friends. We agree these are all paradigmatically described as "pleasurable."
  2.  **The Limits of Introspection:** We agree that introspection is the primary data source for this debate, but it cannot definitively settle the dispute on its own. Introspection reveals *what* is experienced, but not necessarily *how* those experiences are ontologically categorized. We acknowledge that introspective reports are theory-laden; a CQP member looks for a common tone, while a DP member looks for distinct attitudes.
  3.  **Ethical Hedonism:** We agree that the truth of the ethical claim "Pleasure is the only thing good in itself" does not strictly depend on the CQP view being true. However, we agree that **Quantitative Hedonism** (the Benthamite view that pleasures can be summed on a single scale to calculate the right action) lives or dies with this question. If the DP is correct, a simple "felicific calculus" is impossible without a prior theory of how to weigh diverse pro-attitudes against one another.
  4.  **The Role of Desire:** We agree that pleasure is intimately connected to motivation. CQP holds the sensation typically causes a desire for more; DP holds the desire (or pro-attitude) constitutes the pleasure. We agree that correlation is not causation, and that "wanting" and "liking" may dissociate.

  ## II. Table of Remaining Disagreements
  *The following points are phrased to ensure charitable interpretation by both sides.*

  | Topic | Common-Quality Party (CQP) Assertion | Diversity Party (DP) Assertion |
  | :--- | :--- | :--- |
  | **Phenomenal Unity** | There exists a distinct, detectable phenomenological property ("hedonic tone") present in all pleasurable experiences, analogous to how "redness" is present in all red visual experiences. | There is no single phenomenological property shared by all pleasurable experiences. The experiences are as heterogeneous as the activities producing them. |
  | **Semantic Function** | The word "pleasant" describes a specific type of feeling inherent to the experience. | The word "pleasant" expresses a pro-attitude (favoring, wanting to continue) toward the experience at the time it occurs. |
  | **Explanatory Direction** | We favor the experience *because* it contains the positive hedonic tone. | The experience counts as pleasure *because* we favor it; the favoring is not caused by a separate sensation. |
  | **Commensurability** | Because all pleasures share a common quality, they are theoretically commensurable (one can be "more" pleasurable than another in a unified sense). | Pleasures are only commensurable relative to the subject's current hierarchy of attitudes, not via a universal metric. |

  ## III. Cruxes and Agreed Tests
  *We identify the following sub-questions as "cruxes." Settling these would significantly shift confidence toward one view. For each, we propose a test or thought experiment and record our predictions in advance.*

  ### Crux 1: The Isolation of "Hedonic Tone"
  **Question:** Can the supposed "pleasantness" be experienced independently of the specific sensory content of the activity?
  **Test:** Subjects will undergo guided phenomenological reduction while engaging in two vastly different activities (e.g., drinking water vs. solving a puzzle). They will be asked to attend *only* to the "liking" aspect, stripping away the taste, temperature, or intellectual content.
  *   **CQP Prediction:** Subjects will report a residual, identifiable "glow" or "tingle" of positive affect that feels the same in both cases, even if faint.
  *   **DP Prediction:** Subjects will report that once the specific sensory/cognitive content is removed, nothing remains but the *disposition* to continue the activity. There is no residual "feeling."

  ### Crux 2: The Case of "Bittersweet" or Masochistic Enjoyment
  **Question:** Can pain and pleasure coexist in the same phenomenological space without cancelling out?
  **Test:** Analysis of experiences like watching a tragic film, eating spicy food, or "runner's high" where pain/fatigue and enjoyment overlap.
  *   **CQP Prediction:** Subjects will identify two distinct layers: a negative sensory tone (pain/sadness) and a positive hedonic tone (enjoyment) occurring simultaneously. The net value is the sum.
  *   **DP Prediction:** Subjects will report a complex, unified attitude of "favoring the experience *including* the pain." There is no second positive layer; there is only a pro-attitude toward a mixed-quality state.

  ### Crux 3: The Simultaneity and Memory Constraint
  **Question:** Since we cannot feel two very different pleasures simultaneously, and memory of felt quality is unreliable, is the supposed common quality absent or merely undetectable?
  **Test:** A longitudinal comparison task. Subjects experience Activity A (Day 1) and Activity B (Day 7). On Day 8, they are asked to compare the "pleasantness quality" specifically, not just their preference.
  *   **CQP Prediction:** Subjects will report difficulty comparing, but will maintain that the *quality* was present in both, even if the *comparison* is epistemically difficult. They predict that failure to compare is a failure of memory, not evidence of heterogeneity.
  *   **DP Prediction:** Subjects will report that the comparison feels meaningless. They predict that the inability to compare the "quality" directly indicates that no such unified quality exists. If it cannot be held in mind as a common metric, it is not a common metric.

  ## IV. Assessment of Verbal Dispute
  **Judgment:** We judge that **part** of our dispute is verbal, but not all of it.

  1.  **Verbal Component:** The disagreement over the definition of the word "pleasure." If CQP defines pleasure as "a specific feeling" and DP defines it as "a pro-attitude," they can both be right about their respective definitions without contradicting facts about the world. We agree to distinguish between *Pleasure_Feel* and *Pleasure_Att* in future discussions to minimize confusion.
  2.  **Substantive Component:** The dispute regarding the **structure of conscious experience** remains substantive. Even if we change the words, the question remains: *Is there a phenomenological invariant across all states we currently call pleasurable?* This is not merely linguistic; it is a claim about the architecture of human consciousness. If CQP is right, there is a "neural or phenomenological currency." If DP is right, there is not. This distinction has real consequences for psychology, neuroscience, and ethics.

