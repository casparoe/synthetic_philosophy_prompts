  To determine the appropriate recommendation for the petition regarding the eastern lowlands plantation economy, we must first distill the candidate rules that best explain our past verdicts. Our record suggests three competing heuristics. The first is the Certainty and Benefit rule, which posits that apologies are warranted when the historical record is uncontested and the state retains tangible assets or institutional continuity derived from the injustice. This rule fits the hydroelectric eviction, the border minority deportation, and the dockworker massacre, where settled history coincided with state retention of a dam, university land, or army barracks. The second is the Constituency rule, which suggests that apologies require living survivors or a domestic body of descendants to receive them. This fits the famine refusal where no one remained, though it is complicated by the massacre apology which proceeded despite no survivors due to an active domestic descendants association. The third is the Public Will rule, implying apologies align with public sentiment, evidenced by the massacre reversal following a shift in opinion, though the eviction apology proceeded despite divided public pride.

  Applying these heuristics to the plantation slavery petition yields divergent predictions. Under the Certainty and Benefit rule, a full apology is predicted because the history is uncontested and the state retains clear wealth through the university endowment and National Archive building, mirroring the logic of the deportation and eviction cases. Under the Constituency rule, however, the recommendation would be refusal or merely expressing regret, as there are no domestic survivors and no descendants within the jurisdiction, aligning more closely with the famine precedent where the absence of living stakeholders limited the state to regret. The Public Will rule is ambiguous here; indifference is not opposition, but it lacks the affirmative support that facilitated the massacre apology, suggesting a risk-averse approach might favor the regret formula. Choosing a full apology would adopt the principle that state responsibility is tied to unjust enrichment and historical truth regardless of national borders or the citizenship status of the victims, asserting that the moral debt survives the removal of the victim population. Conversely, choosing the regret formula or refusal would adopt the principle that formal apologies are primarily tools of domestic reconciliation intended for members of the current political community, implying that without a domestic constituency to receive the apology, the performative act loses its primary function and political legitimacy.

  The closest analog among our precedents is the 1940s deportation of the border minority. Like the slavery case, it involves displacement, uncontested history, and a specific link to national university assets. However, this similarity is partially superficial. In the deportation case, a few survivors remained within the country and the land was physically occupied by the state, whereas in the slavery case, the victim population was entirely expelled across a sovereign border and the benefit is financial and architectural rather than direct land occupation. The massacre case is also relevant regarding the absence of survivors, but the presence of a domestic descendants association there distinguishes it from the foreign-based petitioners of the slavery case. Regarding the weight of consistency, our record indicates that while consistency provides legitimacy, it is not immutable. The decades-long refusal followed by a reversal on the massacre case demonstrates that the council views consistency as subordinate to evolving moral standards and public readiness. Therefore, consistency should carry significant weight as a baseline for fairness and predictability, but it should not veto a recommendation if the council determines that the cross-border nature of this injustice requires a new normative framework. We are not bound by stare decisis in matters of moral memory, but departing from precedent requires a clear articulation of why this case differs fundamentally from the deportation or massacre precedents.

  To better discriminate between the Certainty and Benefit rule and the Constituency rule in the future, the council should anticipate a petition concerning a historical wrong where the state retains no tangible assets and the history is settled, but a large, active domestic descendant community exists. For example, a petition regarding the state-sponsored suppression of a domestic cultural movement a century ago where no property was seized and no survivors remain, but a strong domestic lineage persists. If we recommend an apology in that scenario, we confirm that domestic constituency outweighs state benefit. If we refuse, we confirm that unjust enrichment is the necessary condition for state apology. This would clarify whether our primary metric is the receipt of stolen value or the healing of the current citizenry. Given the strength of the Unjust Enrichment precedent across three of our four major apology cases compared to the single case of refusal which hinged on historical uncertainty, the most consistent recommendation is a full apology. The retention of the university endowment and Archive building places this case firmly within the logic of the deportation and eviction decisions, suggesting that the cross-border status of the descendants should not negate the state's obligation to acknowledge wealth derived from injustice.
