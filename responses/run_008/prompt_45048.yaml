answer: |-
  **MEMORANDUM**

  **TO:** Medical Executive Committee
  **FROM:** Vice Chair, MEC
  **DATE:** October 26, 2023
  **RE:** Peer Review Finding: Case #23-094 (Patient Death via Hyperkalemia)

  **Summary and Recommendation**
  It is the recommendation of this review that the Committee find the attending physician materially contributed to the adverse outcome through a breach of supervisory duty, warranting a ninety-day probationary period with mandated chart review and communication monitoring. While the resident and nursing staff exhibited failures in the chain of care, the attending's omission represents the primary normative cause actionable under our bylaws. We forward a concurrent recommendation to Administration to revise telemetry escalation protocols.

  **Factual Chronology**
  The patient was admitted on October 10 with acute kidney injury. At 22:00, a stat potassium level of 6.1 mEq/L was flagged in the electronic record. The night-shift resident viewed the result but ordered no repeat testing or intervention. At 23:15, telemetry detected an abnormal rhythm; the technician alerted the charge nurse, who was advised by a supervisor that such changes were expected on this unit, and no physician was notified. Between 23:30 and 01:00, the attending physician received two pages regarding the patient's status but did not acknowledge or return them. The patient suffered cardiac arrest at 02:15. Resuscitation was unsuccessful. Post-mortem analysis confirms lethal hyperkalemia as the cause of death.

  **The Causation Question**
  The Committee is fractured regarding the interpretation of "causation" under Article VI of the Bylaws, which permits privilege restriction only when a physician "caused or materially contributed" to harm. We have considered three distinct frameworks.

  The first faction argues for a strict counterfactual standard: an omission causes an outcome if, had the act occurred, the outcome would likely have been avoided. Under this physics-based model, the resident, the nurse, and the attending are equally causal. Any single intervention would have saved the patient. However, adopting this standard creates "causation inflation." It implies infinite regress (e.g., the hospitalist not assigned to the case), diluting accountability and making privilege action unmanageable.

  The second faction argues that omissions cannot be causes; the death was caused solely by the underlying pathology. This view relies on a distinction between acting and failing to act. While philosophically coherent in some contexts, it is incompatible with medical practice and our Bylaws. Medicine is fundamentally preventative; to rule that failures to respond to flags and pages are not "causes" would render the peer review process impotent in nearly all negligence cases.

  The Committee adopts a third, normative framework. In medical peer review, causation is not merely a chain of physical events but a breach of professional duty. We ask not only "Would action have prevented death?" but "Whose action was demanded by the standard of care?" This distinguishes between background conditions and proximate causes based on role and responsibility.

  Applying this to the individuals: The telemetry supervisor's advice was a system failure, not a physician privilege issue. The resident's omission was a failure of execution, but the resident operates under the attending's license and supervision. The attending physician holds the ultimate duty to ensure the service responds to critical data. By ignoring pages and failing to oversee the resident's inaction, the attending breached the specific normative duty assigned to their privilege level. Therefore, while the counterfactual link is equal, the *material contribution* is weighted by professional obligation. The attending's omission is the actionable cause.

  **The Strongest Opposing View**
  The most compelling argument against this recommendation rests on the strict counterfactual view. Proponents argue that if the resident had ordered a repeat lab, the patient would have lived regardless of the attending's silence. To hold the attending solely responsible ignores the resident's agency and independent medical judgment. If we claim the attending caused the death because they supervise the resident, we risk creating a vicarious liability standard that exceeds the Bylaw's requirement for personal contribution. This faction contends that fairness demands either sanctioning both physicians equally or acknowledging that the system, not the individual, failed. To single out the attending based on "duty" rather than "physical cause" risks introducing subjective bias into what should be an objective determination of harm.

  **Findings and Conditions**
  Based on the normative causation standard, the MEC finds the attending physician materially contributed to the adverse outcome. Effective immediately, the attending's clinical privileges are placed on probation for ninety days. Conditions include: (1) mandatory review of all admitted patients by a designated peer mentor for two weeks; (2) completion of a communication and risk management CME module; and (3) verification of page-response logs monthly. The resident's performance will be referred to the Graduate Medical Education Committee for separate remediation. Finally, the MEC directs the Chief Medical Officer to work with Nursing Administration to formalize a "hard stop" policy for telemetry escalation that bypasses unit supervisors when critical rhythms are detected.
