answer: |-
  1. Moore affirms that an uninhabited planet of beautiful canyons possesses negligible intrinsic value compared to a world where minds consciously appreciate that beauty, since value resides primarily in the conscious experience rather than the object's independent existence.
  2. He claims to know this through direct intellectual intuition, treating these propositions as self-evident truths that require no further proof. Consequently, your doubt suggests to him that you may be conflating "good" with definable natural properties rather than grasping the simple notion directly.
  3. The phrase "complex wholes" invokes his doctrine of organic unities, meaning the value of appreciating beauty is not merely the sum of the beauty plus the pleasure, but a unique value generated by their specific combination that cannot be found in the parts alone.
  4. He agrees with Sidgwick that consciousness holds vastly more value than mere existence, but qualifies this with "so far" because he rejects Sidgwick's hedonism. While Sidgwick thought only pleasure mattered, Moore insists that the object of consciousness contributes to the whole's value rather than just the feeling of pleasure.
  5. This passage establishes a theory of intrinsic value rather than ethics proper, so while the Open Question Argument clears the ground by showing "good" is indefinable, this specific "criterion of social progress" is a substantive intuition about what fills that indefinable role rather than a logical deduction from the argument itself.
