answer: |-
  Your hypothesis is astute, and it cuts to the weary heart of a debate that has indeed calcified into a sort of intellectual stalemate. You suggest that the quarrel between Langdon Winner's technological determinism (or perhaps 'material essentialism') and the Social Construction of Technology (SCOT) camp is not truly about causal mechanisms—since both sides acknowledge a feedback loop between society and artefacts—but rather about ontology. Specifically, it is a dispute over whether 'politics' is a property that can inhere in matter, or merely a projection upon it.

  To test this: is the disagreement substantive, verbal, or a case of disciplinary mismatch?

  I would argue it is **substantive**, but not for the reasons usually cited. It is not substantive because the parties disagree on what happens in the world (they largely agree on the mechanics of influence); it is substantive because they disagree on **where the leverage for remediation lies**. This is a pragmatic distinction disguised as an ontological one.

  If Winner is right, and politics inheres in the artefact, then political change requires technical redesign. You cannot fix the Long Island parkway system by changing public attitudes; you must blow up the bridges. If Pinch and Bijker are right, and politics is poured in by social groups, then technical redesign is futile without shifting the balance of power among the 'relevant social groups' who interpret and use the technology. In the context of AI, this is the difference between auditing an algorithm (Winner) and regulating the data labour and corporate governance that produced it (SCOT).

  Therefore, your hypothesis that this is a standoff over essentialism is correct, but it underestimates the stakes. It is a standoff over **agency and responsibility**. To say an artefact *has* politics is to grant it a form of moral standing (or at least causal weight) that absolves or implicates designers differently than if the artefact is merely a passive vessel. The disagreement is verbal only in the sense that both sides use the word 'politics' to describe a complex socio-technical assemblage, but they point to different nodes in that network as the primary locus of control.

  ### The Moses Myth and the Structure of the Debate

  The contested factual status of the Robert Moses story is illuminating here. Historians, most notably Joyce Lawrance and Bernward Joerges, have thoroughly debunked the claim that Moses intentionally built low bridges to exclude buses carrying black and poor passengers. The bridges were standard height for the era; buses did not run to Jones Beach for economic and routing reasons unrelated to the overpasses.

  That Winner's central anecdote is empirically shaky, yet remains the canonical example in philosophy of technology, tells us something crucial about the debate's structure: **it is not an empirical debate.** It is a paradigmatic one.

  The Moses story functions as a 'just-so story' in the Kipling sense. Its truth value matters less than its utility as a parable for material determinism. The persistence of the myth suggests that the field is not searching for new data, but for validation of a worldview. For Winner, the *possibility* that a bridge could exclude is enough to prove the thesis; for the constructivists, the *historical falsity* of the intent is enough to disprove it.

  This reveals that the debate has been stuck because it is fighting over **intent versus effect**. Winner cares about the effect (the bridge excludes); SCOT cares about the intent and the process (no one designed it to exclude). Until the field distinguishes between 'politics of intention' (designer's will) and 'politics of consequence' (systemic outcome), the Moses story will continue to be wielded as a blunt instrument by both sides.

  ### Is 'Mutual Shaping' the End of the Road?

  You ask whether the 'mutual shaping' settlement is genuinely all this debate could ever have delivered. In its current form, yes, it is a dead end. 'Mutual shaping' is the 'God did it' of science and technology studies (STS). It is technically correct but analytically paralysing. If everything shapes everything else, then explaining a specific outcome becomes impossible, because the causal chain is infinite and recursive. It offers no purchase for the policy-maker or the critic.

  To make progress, we must abandon the question "Do artefacts have politics?" It is a category error. Artefacts do not vote, nor do they hold ideologies. However, they do possess **affordances and scripts**.

  Here is where progress might lie:

  1.  **From Essentialism to Script Theory:**
      Rather than asking if politics *inheres* in the object, we should adopt Madeleine Akrich's concept of the 'script'. Designers inscribe a vision of the world into the technology (a script of how it should be used). Users can follow that script, or they can 'de-scribe' it (use it differently). Progress comes from analysing the **friction** between the script and the usage. In AI, the recommender system scripts a user as a data point to be monetised; the user may script it as a news source. The 'politics' emerges in the friction, not in the code itself.

  2.  **A New Typology of Cases:**
      We need to move beyond the 'Moses' style cases (large infrastructure) and the 'Nuclear' cases (centralised hierarchy). We need case studies of **malleable infrastructure**. The internet was once thought to be inherently democratic; now it is seen as inherently surveillant. A productive case study would track a single technology as its political valence flips without significant technical change, solely through governance shifts. This would prove the SCOT point. Conversely, a case where governance shifts fail because the technical architecture forbids them would prove the Winner point. We lack a comparative taxonomy of these failure modes.

  3.  **The Distinction of 'Reversibility':**
      A concrete metric for progress would be the **cost of reversal**. If a technology embodies politics, reversing that politics should be technically costly (requiring redesign). If it is merely constructed by social groups, reversing the politics should be socially costly but technically cheap. Measuring the 'technical debt' of political change could settle the empirical stake. For example: is it harder to make a nuclear plant democratic, or a solar grid hierarchical? If the technical constraints vary significantly, Winner wins. If they are equally malleable, SCOT wins.

  ### Conclusion

  Your hypothesis is largely correct: the field is stalled on an ontological question that masquerades as an empirical one. The 'mutual shaping' truce is a diplomatic failure; it papers over the crack without bridging it.

  To move forward, we must stop asking if the artefact *has* the politics and start asking **how the artefact distributes the capacity for political action**. Does this technology make it easier to organise or to surveil? Does it centralise verification or distribute it? This shifts the debate from metaphysics to mechanics.

  For your coverage of AI policy, this is the crucial pivot. The question is not whether the algorithm is biased (it is), nor whether society is biased (it is). The question is whether the algorithmic arrangement **locks in** that bias more rigidly than previous arrangements. If AI makes prejudice more expensive to reverse than human prejudice was, then Winner is right, regardless of the code's 'intent'. If AI bias can be corrected simply by changing the incentives of the developers, then the constructivists are right.

  The debate will only end when we stop treating 'technology' and 'society' as two nouns that bump into one another, and start treating them as a single verb: **technopolitics**. Until then, we shall remain haunted by Robert Moses and his bridges, arguing over a ghost story that tells us more about our desire for simple causal villains than about the nature of power.
