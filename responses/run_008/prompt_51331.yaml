      *   *Section 3 (Chinese Room):* Crucial distinction: Syntax vs. Semantics. In QA terms: Data Processing vs. Data Meaning. Searle argues you can't get Meaning from Processing alone. It's not just "we don't know the internals," it's "these internals *cannot* produce the property."
      *   *Section 4 (Lookup Table):* This is the "Blockhead" objection (Ned Block). It's a coverage issue (combinatorial explosion). Defenders say physical constraints make the lookup table impossible, so passing implies generalization.
