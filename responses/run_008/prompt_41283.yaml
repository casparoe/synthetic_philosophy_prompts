  The classic "Death in Damascus" scenario presents a fatal dilemma for Causal Decision Theory (CDT). You are in Damascus; Death appears and says he has predicted your location tomorrow. Being a perfect predictor, if you stay, he is in Damascus; if you flee to Aleppo, he is in Aleppo. The CDT agent faces a deliberational instability: choosing Aleppo implies Death is in Aleppo (bad), so one should stay; but staying implies Death is in Damascus (bad), so one should flee. The agent oscillates forever, finding no fixed point.

  But suppose Death is fallible. Suppose his prediction is only 80% accurate. Does this break the instability? Does it save your life? The answer depends entirely on what we mean by "80% accurate," and whether we view randomization as a legitimate tool in the decision theorist's kit.

  First, we must distinguish between two models of prediction. In the **Act-Based Model**, Death predicts your specific final action. His accuracy is defined as $P(\text{Death's Location} = \text{Your Act}) = 0.8$. In the **Strategy-Based Model**, Death predicts your decision procedure (your probability distribution over cities) and aligns his location with it, perhaps sampling from the same distribution or introducing noise.

  Under the Act-Based Model, if you commit to a pure strategy (e.g., "Definitely Aleppo"), your survival probability is simply $1 - 0.8 = 0.2$. CDT, treating the prediction as a fixed past fact, might initially see no causal leverage. However, if the agent engages in deliberational dynamics—updating their credence about Death's location based on their own tentative choice—they face a milder version of the original instability. Leaning toward Aleppo raises the subjective probability that Death is in Aleppo, lowering the expected utility of Aleppo. With perfect prediction, this loop never closes. With 80% accuracy, does it converge?

  If the agent treats their choice as evidence, the equilibrium occurs where the expected utility of both cities is equal. This happens when the probability of Death being in Aleppo equals the probability of him being in Damascus. If Death's accuracy is tied to your act, this symmetry is achieved only if you are indifferent between the acts. But indifference suggests a mixed strategy.

  This leads to the crucial question: Can you flip a coin? If you adopt a mixed strategy (50% Aleppo, 50% Damascus), you change the nature of the prediction. If "80% accurate" means Death can predict the *outcome* of your coin flip with 80% reliability, then randomization buys you nothing; he still finds you 80% of the time. This implies a super-deterministic universe where your "random" flip is predictable. However, if we assume standard access to randomness (where a fair coin is unpredictable ex ante), then Death's accuracy on the *act* must drop to 50% against a 50/50 mixer. He can predict your *propensity* to flip, but not the result. In this case, your survival rate jumps from 20% (pure) to 50% (mixed). Randomization acts as a shield, degrading the predictor's accuracy.

  Under the Strategy-Based Model, Death predicts your probability $q$ of going to Aleppo. He then locates himself to maximize the match. If he is 80% accurate, we might model this as him matching your distribution with weight 0.8 and guessing randomly with weight 0.2. If you choose a pure strategy ($q=1$), he matches you with probability $0.8(1) + 0.2(0.5) = 0.9$. Your survival is 10%. If you choose a mixed strategy ($q=0.5$), the overlap between your distributions is minimized. He matches your 50/50 split with probability $0.8(0.5) + 0.2(0.5) = 0.5$. Your survival is 50%. Here, too, mixing is strictly dominant.

  From the perspective of decision theories, CDT traditionally struggles with mixed strategies, often viewing them as mere expressions of indecision rather than distinct options. However, a sophisticated CDT agent (or an agent using Functional Decision Theory) recognizes that the "act" is the selection of a policy. If the policy "Flip a Coin" causally (or logically) results in a lower probability of Death's presence than "Go to Aleppo," it is the rational choice. The deliberational instability of the perfect case dissolves because the mixed strategy provides a stable fixed point: at 50/50, there is no evidence to favor one city over the other, so the agent has no reason to deviate.

  Is there a threshold where you should stop flipping and just run? Yes. If Death's accuracy $p$ drops below 0.5 (he is worse than random), a pure strategy yields survival $1-p > 0.5$, while mixing yields 0.5. In that case, you should pick a city and stick to it, hoping his incompetence works in your favor. But so long as Death is better than a coin toss ($p > 0.5$), mixing minimizes the maximum probability of capture. With $p=0.8$, the gap is significant: 20% survival for determinism versus 50% for randomization.

  The instability of the original case was a symptom of the agent trying to outthink a perfect mirror. With an imperfect mirror, the solution is not to outthink, but to blur. You cannot reason your way to safety when your reasoning is the map Death uses; you must introduce noise that the map cannot capture.

  Verdict: Flip a coin; never be predictable.
