answer: |-
  You are right to suspect a crack. You have built a moral framework on a specific economic axiom (Point 5) that your actual moral intuitions (Points 1, 2, 3) repeatedly violate. You are trying to wear a libertarian hat over a social-democrat head. It fits poorly, and it's giving you a headache.

  Here is the audit of your tensions, ranked by severity, followed by the single revision you need to make.

  ### The Tensions

  **1. The "Ban" Contradiction (Point 5 vs. Point 2)**
  *   **Severity:** Critical.
  *   **The Conflict:** Point 5 states your "one real worry" is desperation and explicitly prescribes the fix: "a real safety net — **not banning the sale**." Point 2 explicitly demands **banning the sale** (price gouging) regardless of the safety net.
  *   **Why it breaks:** If Point 5 were true, you would argue that during a hurricane, we shouldn't ban $400 hotel rooms; we should ensure everyone has enough savings or insurance to afford them. But you don't argue that. You argue the transaction itself is predatory. Point 5 claims bans are the wrong tool; Point 2 wields the hammer.
  *   **Cost to fix:** You lose the clean, principled stand that "markets are neutral tools." You have to admit that *some* market mechanisms are inherently exploitative in specific contexts, regardless of the background poverty level.

  **2. The "Sacredness" Contradiction (Point 4 vs. Point 3)**
  *   **Severity:** High.
  *   **The Conflict:** Point 4 dismisses Sandel-style arguments (that money degrades meaning) as "upper-class moralizing" and says "there's nothing sacred." Point 3 bans vote selling because it "corrodes the whole point of political equality."
  *   **Why it breaks:** "Political equality" *is* a sacred civic value. Arguing that money corrupts it *is* a commodification argument. You are making the exact argument you claim to disdain in Point 4, just applying it to democracy instead of art or friendship.
  *   **Cost to fix:** You have to concede that money *does* degrade certain social goods, and that recognizing this isn't necessarily classist moralizing.

  **3. The "Desperation" Asymmetry (Point 1 vs. Point 2)**
  *   **Severity:** Medium.
  *   **The Conflict:** In Point 1 (Kidneys), you trust the desperate person's agency (the seller). In Point 2 (Hotels), you distrust the desperate person's situation (the buyer).
  *   **Why it breaks:** It looks like hypocrisy, but it's actually defensible *if* you drop Point 5. In kidneys, the transaction alleviates chronic poverty. In gouging, the transaction exacerbates acute crisis. They are only in tension if you insist on a single rule for all desperation.
  *   **Cost to fix:** Minimal, provided you fix Point 5.

  ### The Commitment

  **You must revise Point 5.**

  Drop the clause: *"...So the fix is the background — a real safety net — not banning the sale."*

  Replace it with this: *"...The fix is usually the background, but when the market mechanism itself creates the leverage (disasters) or destroys the public good (votes), the transaction must be banned."*

  ### Why This Revision?

  **1. It aligns your theory with your data.**
  Points 1, 2, and 3 are your lived moral intuitions. Point 5 is the theory you adopted to make them sound consistent. The theory is failing to predict the data. You are not a "Market Purist" who thinks poverty is the only bug. You are a "Power Asymmetry Realist."
  *   **Kidneys:** The asymmetry is chronic poverty. The market *helps* the weak party (seller) gain leverage (cash). -> **Allow.**
  *   **Gouging:** The asymmetry is acute monopoly. The market *helps* the strong party (hotel) exploit the weak (buyer). -> **Ban.**
  *   **Votes:** The asymmetry is systemic. The market *helps* the rich buy influence, destroying the equality of the weak. -> **Ban.**

  **2. It resolves the Surrogacy Queasiness (Point 6).**
  Your hesitation on surrogacy likely isn't about "sacredness" (Point 4). It's about the difficulty of distinguishing between "autonomous choice" and "coerced desperation" when the commodity is a pregnancy. By revising Point 5, you allow yourself to say: "Surrogacy might be a case where the background safety net isn't enough to guarantee true consent, so we regulate or ban the market." You don't have to force yourself into the "Legalize It" box just to stay consistent with kidneys.

  **3. It saves your Kidney Argument.**
  If you keep Point 5 as is, your kidney argument is vulnerable to the retort: "If you ban gouging to protect the desperate, why not ban kidney sales to protect the poor?"
  By revising Point 5, you clarify the distinction: We ban gouging because the *price mechanism* is the weapon. We allow kidney sales because the *price mechanism* is the lifeline. You stop defending kidney sales with "markets are good" and start defending them with "this specific market empowers the seller."

  ### The Price You Pay

  The cost of this revision is intellectual humility. You have to give up the clean, econ-101-adjacent stance that "bans are usually paternalistic." You have to admit that sometimes, the comfortable class (you) *should* ban things, not because you're moralizing about meaning, but because the market structure itself is rigged.

  That is a heavier lift than your current package suggests. But it is the only way to make your views on kidneys, gouging, and votes sit in the same room without fighting. Keep the intuitions; dump the axiom.
