prompt: |-
  I write historical fiction — five novels over twenty years, most of them set in the industrial valleys of South Wales — and I have become aware that I operate by a credo I have never properly examined. Before I give a talk in the spring, I would like a consistency check on it. Here is the set of commitments, as honestly as I can reconstruct them:

  1. Where a community's memory conflicts with the documentary record, the record does not automatically win. The archive is one witness among others, not the senior one; a town's remembered past has a standing claim that a historian's findings can override only for weighty reasons, not by default.

  2. The novel is an organ of collective memory. A scene may be true to what an event meant while being false to what happened, and this is not a lapse but the form's whole point.

  3. My primary fidelity is to the living — to survivors and descendants, and to what they carry — rather than to paper.

  4. The author's note must never state a falsehood. However mythic the novel, the historical note at the back belongs to the register of fact, and I have corrected interviewers, and my own earlier notes in later reprints, when they got the record wrong.

  5. There is no innocent archive. Every collection of documents is curated by somebody's interest, and the historian's claim to have established what actually happened is itself a genre with conventions, not the end of the story.

  And my verdicts in three local disputes, since the principles alone will not expose the trouble:

  Case 1. The town of my second novel holds that its colliery disaster was caused by the owners' criminal negligence. A historian has since shown that the owners acted within the safety norms of the day, and that the blame-myth grew out of a union pamphlet written decades after the event. I publicly sided with the town: the novel keeps the owners guilty, and the note records the historian's findings alongside a statement that the novel keeps faith with how the valley remembers it.

  Case 2. A community a few miles away remembers a man as an informer during the war; his grandchildren still live there and are quietly shunned on his account. A careful reconstruction of the record exonerates him. Here I sided with the record: I argued in print that the community should relinquish its story, and in the novel I exonerated him.

  Case 3. A council proposed to inscribe on a war memorial a casualty figure that the historians' count does not support — the community's figure is several times the larger. I objected, and supported the smaller number on the plaque.

  I cannot locate the trouble myself, though I am confident it is there. Please audit the set rather than lecture on collective memory in general: tell me which of my commitments are genuinely in tension and how badly; which apparent tensions dissolve on inspection; and, for each genuine one, what would have to give and what that would cost. I would also like to know whether my three verdicts follow from the commitments as stated, or whether I have in practice been applying some further rule that I have never put into words.
reasoning: |-
  Here's a thinking process that leads to the audit of the author's credo:

  1.  **Analyze the Request:**
      *   **User:** A historical fiction novelist (5 novels, 20 years, South Wales industrial valleys).
      *   **Task:** Audit a set of 5 commitments (credo) and 3 case verdicts for consistency/tension.
      *   **Goal:** Identify genuine tensions vs. apparent ones, determine what would have to give (and the cost), and check if the verdicts follow from the commitments or imply an unstated rule.
      *   **Constraint:** Do not lecture on collective memory in general; focus on the internal logic of the provided system.

  2.  **Deconstruct the Commitments (The Credo):**
      *   *C1 (Memory vs. Record):* Community memory $\ge$ Documentary record. Record doesn't win by default.
      *   *C2 (Novel's Function):* Novel = organ of collective memory. Emotional truth ("what it meant") > Factual truth ("what happened").
      *   *C3 (Primary Fidelity):* To the living (survivors/descendants) > To paper (archives).
      *   *C4 (Author's Note):* Must be factually true. Distinct register from the novel. Corrected when wrong.
      *   *C5 (Archive Skepticism):* Archives are curated/biased. Historian's "truth" is a genre, not final.

  3.  **Deconstruct the Verdicts (The Cases):**
      *   *Case 1 (Colliery Disaster):* Community says owners guilty (negligence). Record says owners innocent (norms of the day). *Verdict:* Side with Community (Novel = guilty, Note = explains record).
      *   *Case 2 (The Informer):* Community says man was informer (grandchildren shunned). Record says man innocent. *Verdict:* Side with Record (Novel = innocent, Public argument = community should let go).
      *   *Case 3 (War Memorial):* Community says high casualty count. Record says low count. *Verdict:* Side with Record (Memorial = low count).

  4.  **Initial Consistency Check (Mental Walkthrough):**

      *   *C1 vs. Case 1:* Consistent. Memory wins over record.
      *   *C1 vs. Case 2:* **Tension.** Memory loses to record. Why?
      *   *C1 vs. Case 3:* **Tension.** Memory loses to record (on the memorial).
      *   *C3 (Fidelity to Living) vs. Case 2:* **Major Tension.** The "living" here are the grandchildren being shunned. Siding with the record helps them, but siding with the *community's memory* hurts them. Wait, C3 says fidelity to "survivors and descendants." In Case 2, the descendants are the *accused's* family. The community is the *accuser*. So C3 actually supports the verdict in Case 2 (protect the descendants). But C1 supports the community memory. So C1 and C3 are in conflict here.
      *   *C3 (Fidelity to Living) vs. Case 3:* Who are the "living"? Descendants of the dead? Or the current council/town? If the memorial inflates numbers, it dishonors the specific dead? Or does it honor the community's sacrifice? The author sided with the record. This suggests "Fidelity to the living" doesn't mean "Give the living whatever they want."
      *   *C2 (Novel as Memory) vs. Case 2:* The novel exonerated him. This contradicts the community memory. So the novel is *not* acting as an organ of *that* community's collective memory in this instance. It's acting as a corrective.
      *   *C4 (Note must be true) vs. Case 1:* The note records the historian's findings. This is consistent. The novel lies (artistically), the note tells the truth.
      *   *C5 (Archive Skepticism) vs. Case 2 & 3:* In Case 2 & 3, the author trusts the "careful reconstruction" or "historians' count" over the community. This implies the archive *can* win, contradicting C1's "not by default."

  5.  **Identify the Core Tensions:**

      *   **Tension A: C1 (Memory Priority) vs. Case 2 & 3 (Record Priority).**
          *   C1 says memory has a "standing claim" record overrides only for "weighty reasons."
          *   Case 2 & 3 show the record overriding memory.
          *   *Question:* What constitutes a "weighty reason"? The credo doesn't say. The practice shows there *is* a threshold, but it's unstated.
      *   **Tension B: C3 (Fidelity to Living) vs. C1 (Community Memory).**
          *   In Case 2, "Community Memory" harms specific "Living Descendants."
          *   The author chose the Living Descendants over the Community Memory.
          *   *Conflict:* Who counts as "the living" to whom fidelity is owed? The collective (community) or the specific individuals (descendants)?
      *   **Tension C: C2 (Novel = Memory) vs. Case 2 (Novel = Correction).**
          *   If the novel is an organ of collective memory, it should reflect the community's view (Informer = Guilty).
          *   The author made the novel reflect the record (Informer = Innocent).
          *   *Conflict:* Is the novel a mirror of memory or a vessel for truth-telling when memory is unjust?
      *   **Tension D: Case 1 vs. Case 3 (Public Monuments vs. Private Art).**
          *   Case 1 (Novel): Memory wins (Owners guilty).
          *   Case 3 (Memorial): Record wins (Casualty count low).
          *   *Insight:* The author distinguishes between *artistic representation* (Novel) and *civic record* (Memorial/Note). But Case 2 involves the Novel siding with the Record. So it's not just Medium (Novel vs. Memorial). It's about *Harm*.

  6.  **Synthesize the Unstated Rule:**
      *   In Case 1: Memory harms the Owners (dead/abstract entities?). Community needs the myth for identity/justice.
      *   In Case 2: Memory harms specific Living Descendants (shunned).
      *   In Case 3: Memory inflates numbers on a *permanent civic record*.
      *   *Hypothesis:* The unstated rule is about **Harm to the Vulnerable Living** vs. **Identity of the Collective.**
      *   Actually, looking closer:
          *   Case 1: Memory serves the community's sense of justice. Record serves the owners (power). Author picks Community.
          *   Case 2: Memory serves the community's suspicion. Record serves the vulnerable family. Author picks Family (Record).
          *   Case 3: Memory serves community's sense of sacrifice. Record serves factual accuracy on a public monument. Author picks Record.
      *   *Refined Unstated Rule:* **The record wins when the community's memory inflicts specific, ongoing harm on identifiable living individuals, or when the claim is on a permanent civic factual register (Memorial/Note). The memory wins when it serves a restorative justice function against power (Owners) within the safe space of fiction.**
      *   *Wait, look at C3 again:* "Primary fidelity is to the living — to survivors and descendants."
      *   In Case 1: The "descendants" of the miners? They want the guilt narrative. So Memory = Fidelity to Living (Miners' kin).
      *   In Case 2: The "descendants" of the informer? They want the innocence narrative. So Record = Fidelity to Living (Informer's kin).
      *   In Case 3: Who are the "living"? The council? The town? Or the dead? A memorial is for the dead, read by the living.
      *   *The Real Conflict:* C1 says Memory > Record. But C3 says Fidelity to Living > Paper. Sometimes Memory *is* Paper (in the minds of the living). Sometimes Memory *hurts* the Living.
      *   *The Unstated Rule:* **Harm Principle.** Memory is privileged *unless* it actively persecutes specific living individuals (Case 2) or falsifies a permanent civic record (Case 3). But wait, Case 1 falsifies the historical record in the Novel.
      *   *Distinction:* **Space.** Novel = Space for Memory. Memorial/Note = Space for Fact.
      *   *But Case 2 breaks this:* Novel = Space for Fact (exonerating the man).
      *   *So the distinction is Ethical:* Does the memory protect the vulnerable or attack them?
      *   Case 1: Memory attacks the Powerful (Owners). -> Allowed.
      *   Case 2: Memory attacks the Vulnerable (Shunned family). -> Not Allowed.
      *   Case 3: Memory attacks Truth on a Public Monument. -> Not Allowed.

  7.  **Drafting the Audit:**

      *   **Introduction:** Acknowledge the sophistication of the credo. It's not naive; it's nuanced. But the nuance creates the friction.
      *   **Section 1: Apparent Tensions (That Dissolve).**
          *   C4 (Note truth) vs. C2 (Novel truth). This is a standard historical fiction contract. The Note anchors the Fiction. No real tension here.
          *   C5 (Archive bias) vs. Using the Archive (Case 2/3). Acknowledging bias doesn't mean discarding utility. The author uses the archive critically, not blindly.
      *   **Section 2: Genuine Tensions.**
          *   **Tension 1: C1 (Memory Priority) vs. Practice (Case 2 & 3).** C1 says Record doesn't win by default. But in 2 out of 3 cases, it did.
              *   *Resolution:* The definition of "Weighty Reasons."
              *   *Cost:* If you clarify "Weighty Reasons" (e.g., harm to living), you limit C1's scope.
          *   **Tension 2: C3 (Fidelity to Living) vs. C1 (Community Memory).** "The Living" are not a monolith. In Case 2, the Community (Living) vs. The Family (Living).
              *   *Resolution:* You prioritized the *persecuted* living over the *collective* living.
              *   *Cost:* Admitting that "Community Memory" can be tyrannical.
          *   **Tension 3: C2 (Novel as Memory) vs. Case 2 (Novel as Correction).** If the novel is an organ of collective memory, it should have kept the myth. By correcting it, the novel became an organ of *history*, not memory.
              *   *Cost:* Redefining the novel's function. It's not *just* memory; it's ethical arbitration.
      *   **Section 3: The Unstated Rule.**
          *   You are applying a **Harm/Vulnerability Calculus**.
          *   Memory wins when it empowers the marginalized against power (Case 1: Miners vs. Owners).
          *   Record wins when memory harms specific vulnerable individuals (Case 2: Shunned family) or codifies falsehood in stone (Case 3: Memorial).
          *   This contradicts C1's blanket statement that Memory has a "standing claim."
      *   **Section 4: Recommendations/What would have to give.**
          *   Modify C1 to acknowledge the "Harm Principle."
          *   Clarify C3: Which living? (The vulnerable vs. the collective).
          *   Clarify C2: The novel is an organ of memory *unless* that memory is unjust.

  8.  **Refining the Output:**
      *   Tone: Professional, analytical, respectful of the craft.
      *   Structure: Follow the prompt's requirements (Tensions, Dissolutions, Verdict Analysis, Unstated Rule).
      *   Specific focus: South Wales context (implicit understanding of close-knit communities).

      *(Self-Correction during drafting)*: I need to be careful with Case 3. Why did the author object to the memorial? A memorial is a public record, not a novel. C4 says the *Author's Note* must be true. A Memorial is like a permanent Author's Note. So Case 3 aligns with C4 logic applied to public space. Case 1 aligns with C2 (Novel space). Case 2 is the outlier because it applies C4 logic (Truth) to C2 space (Novel). *Why?* Because of the harm to the grandchildren.
      *   *Key Insight:* The medium isn't the only factor. The *ethical consequence* is the factor.

      *(Refining the Unstated Rule)*: It's not just harm. It's about **Power**.
      *   Case 1: Memory challenges Power (Owners). -> Memory Wins.
      *   Case 2: Memory challenges Powerless (Grandchildren). -> Record Wins.
      *   Case 3: Memory challenges Objective Reality (Stone). -> Record Wins.
      *   *Actually, C3 is the key.* "Fidelity to the living." In Case 1, the living miners' descendants *want* the memory. In Case 2, the living grandchildren *suffer* from the memory. In Case 3, the living (council) want the memory, but the author sides with the dead/truth.
      *   *Wait, Case 3 is tricky.* C3 says fidelity to the living. But the author sided with the historians (Record) against the Council/Community (Living). Why? Perhaps because a Memorial is a historical document, not a work of art. It falls under C4's jurisdiction (Register of Fact).
      *   *So:*
          *   Novel = Space for Memory (C2), UNLESS it harms specific living people (Case 2).
          *   Note/Memorial = Space for Fact (C4).
          *   C1 is the problematic one. It claims Memory > Record generally. But the practice shows Memory > Record *only in the Novel* AND *only when it doesn't harm the vulnerable*.

      *   *Final Plan:*
          1.  Validate the coherence (it's a strong system).
          2.  Highlight the C1 vs. Practice gap.
          3.  Highlight the C3 definition problem (Which living?).
          4.  Identify the "Harm/Power" heuristic.
          5.  Suggest specific wording tweaks.

  9.  **Final Polish:** Ensure the tone is appropriate for a fellow writer/scholar. Avoid preaching. Focus on logical audit. (Check: Did I answer all parts of the prompt? Yes: Tensions, Dissolutions, Verdict consistency, Unstated rule.)

      *One more check on Case 3:* The council proposed the inscription. The author objected. The author supported the smaller number. This aligns with C4 (Notes must be true) extended to public monuments. It contradicts C1 (Memory doesn't automatically lose). It contradicts C3 (Fidelity to living - if the living community wants the higher number). This suggests C4 (Truth in factual registers) trumps C1 and C3 when the medium is non-fictional/civic.
      *   *So the hierarchy seems to be:*
          1.  Do no harm to vulnerable living (Case 2).
          2.  Maintain factual integrity in factual registers (Note/Memorial) (Case 3, C4).
          3.  Honor community memory in artistic registers (Novel) (Case 1, C2).
      *   *C1 is the outlier.* It tries to be a universal rule but is actually conditional.

