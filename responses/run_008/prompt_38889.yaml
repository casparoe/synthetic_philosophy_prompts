prompt: |-
  hey, so I've been reading about sortition and something keeps bugging me. People justify random selection for citizen assemblies with two different stories that dont obviously fit together. Story 1: a lottery gives you a descriptive sample of the population — the chamber statistically mirrors the public on income, education, age, political views, etc. Story 2: lottery selection produces *better deliberation*, b/c you get ordinary people reasoning together without party whips or reelection incentives. But these can pull apart, right? If service is mandatory you get a cleaner sample, but people who really didn't want to be there might engage badly; if it's opt-in, you get a skewed sample (self-selection: the civically-engaged overrepresent themselves) even if the volunteers deliberate really well. And then there's the stratification patch — some proposals draw only from a volunteer pool but impose demographic quotas on that pool — which fixes the sample along the dimensions you stratify on, but maybe not along the deeper ones that correlate with *who shows up* in the first place.

  Heres what I want: an explanation of the tension between the representativeness rationale and the deliberative-quality rationale, and how design choices (opt-in vs mandatory service, stratified quotas on a volunteer pool, etc.) trade off between them. Also, if you can, say something about which kinds of skew stratification can and can't fix — my hunch is it can handle visible dimensions like education level but not motivational stuff like how much someone cares about politics in the first place, but im not sure that holds up.

  Format, in this order please:

  - "The two rationales" (~100 words)
  - "Where they conflict" (~150 words)
  - "Design patches and what they actually buy you" (~200 words)
  - "Pushing back on your hunch" (~100 words) — this is where you tell me whether my stratification claim survives, and if not, where it breaks

  keep it conversational, no need to name-drop scholars or cite anything, and dont worry about referencing the literature by name. just the conceptual machinery.
