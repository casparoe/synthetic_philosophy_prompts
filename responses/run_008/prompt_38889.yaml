answer: |-
  - "The two rationales"
  The first story is about mirroring. If you pick people randomly, like a jury, the group ends up looking like the whole population—same mix of rich and poor, young and old, left and right. The idea is that the group *is* the public in miniature. The second story is about thinking. Randomly picked ordinary folks aren't career politicians. They don't need to get reelected or follow party lines, so they can actually listen, change their minds, and reason together without the usual noise. One story says "they are us," the other says "they think better than the pros."

  - "Where they conflict"
  Here's the rub: getting a perfect mirror often clashes with getting good deliberation. If service is mandatory, like jury duty, you get that clean statistical sample. But you also drag in people who resent being there. Resentment kills collaboration; checked-out participants don't deliberate well. They might disrupt the process or just sit silently. On the flip side, if you let people volunteer, you get motivated participants who are eager to engage. But volunteers aren't random. They're usually more educated, more political, and more confident than average. They care more about the outcome. So you get a group that deliberates beautifully but doesn't actually represent the public's diversity of experience or indifference. You can't maximize both statistical accuracy and motivational quality at the same time; pulling one lever loosens the other. The "perfect sample" might be dysfunctional, while the "perfect deliberators" might be an elite clique.

  - "Design patches and what they actually buy you"
  Most modern assemblies try to hack this by using a volunteer pool but imposing demographic quotas. They'll say, "We need 50% women, 20% without high school diplomas, 10% from this region." This fixes the visible skew. It ensures the room looks right on paper, even if everyone there wanted to be there. This buys you legitimacy on the descriptive front without forcing reluctant citizens into the room. But it's a partial fix. You're stratifying on data you have—age, gender, income—but you're blind to the data you don't have, like personality traits or hidden biases. Also, by filtering for volunteers first, you're still selecting for people comfortable with civic engagement. The quotas ensure the room isn't all white-collar professionals, but the working-class people who do show up are still the unusually civic-minded ones. So you get a diverse room of engaged citizens, rather than a diverse room of *everyone*. It solves the "looks like us" problem better than the "thinks like us" problem. You trade pure randomness for a functional group that still checks enough demographic boxes to claim authority. Ultimately, this design choice admits that perfect representation is impossible if you want a working group, so it aims for "good enough" representation among people who won't sabotage the process.

  - "Pushing back on your hunch"
  Your hunch holds up. Stratification fixes visible dimensions like income or education because you can measure them directly. It cannot fix motivational skew because you can't quota "cares about politics" without measuring it. However, it's not just motivation. Stratification also misses hidden cultural dimensions, like trust in institutions, correlated with demographics. You might hit your quota for low-income participants, but drawing from volunteers selects for those who *trust* the process enough to show up. So yes, motivation slips through, but so do subtle cultural attitudes that demographics only loosely predict. The filter is about who feels invited.
