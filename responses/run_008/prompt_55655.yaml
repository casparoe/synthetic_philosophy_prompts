      *   *Potential Issue:* This is the most contentious part of the user's description. Standard ECL (as discussed by Oesterheld, Conitzer, etc.) is usually framed *within* EDT or FDT. Claiming it works *even if CDT is true* is tricky. CDT explicitly ignores evidential correlations that aren't causal. If the user says "CDT is true" (meaning causal links are the only ones that matter for rational choice), then evidential correlations *shouldn't* move the needle for a CDT agent unless they are also causal.
      *   *Correction/Nuance:* The user might mean "Even if you *start* with CDT intuitions, you should adopt a policy that looks like ECL." Or they might be arguing for "Functional Decision Theory" (FDT) lite without calling it FDT. I need to flag this. If they claim CDT agents *ought* to follow ECL without modifying CDT, that's a category error. If they claim agents should *select policies* (which CDT sometimes allows via "tickle defense" or pre-commitment), that's more defensible. I will flag this in the "Framing Check" section at the end.

