answer: |-
  This is a high-stakes talk. Your "modest" middle ground is intellectually honest, but in a job talk, middle grounds often get shot from both sides. The maximalists will think you're timid; the skeptics will think you're smuggling in mysticism.

  Below is your Q&A prep sheet. I have ordered these by **potential damage to your candidacy**, not just philosophical annoyance. I have also included the "Framing Check" you asked for at the end, because there is a potential category error in how you described your CDT claim that could get you torn apart if you don't patch it.

  ### **Q&A Prep Sheet: Evidential Cooperation in Large Worlds (Modest Version)**

  #### **1. The CDT Hardliner (Highest Damage)**
  **Who:** The senior faculty member who thinks Newcomb's problem is a trick question.
  **The Question:** "You claim your argument works even if Causal Decision Theory (CDT) is true. But CDT is defined by the injunction to ignore evidential correlations that aren't causal. If my choice doesn't *cause* your choice, CDT says I should defect. Are you not just asking us to relabel EDT as 'modest ECL' and call it a day? Where is the causal mechanism?"

  **The Reply (2 mins):**
  "I appreciate the precision. I'm not arguing that a CDT agent should treat evidence as causation. I'm arguing that for agents implementing *algorithms*, the algorithm itself is a physical object. If I choose a policy, I am causally determining the output of the algorithm running in my brain. If your brain runs a sufficiently similar algorithm on similar inputs, my choice is a *cause* of your output in the same way that flipping a switch in London is a cause of the light turning on in London, even if there's a parallel switch in New York. I'm not asking CDT to respect magic; I'm asking it to respect the causal reality of computational similarity. The 'evidential' part is just how we *detect* the correlation; the 'cooperation' is justified because fixing my policy causally fixes the output of similar policies elsewhere."

  **Soft Spot:** You are bordering on Functional Decision Theory (FDT). If they press you on whether "algorithm similarity" counts as a causal link in standard CDT formalisms, you might have to concede that this *requires* modifying standard CDT, which contradicts your "even if CDT is true" claim.

  #### **2. The Metaphysician (High Damage)**
  **Who:** The person obsessed with ontology and identity.
  **The Question:** "Your whole argument rests on a 'similarity metric' over decision procedures. You mentioned 'causal histories of learning.' But similarity is interest-relative. A rock can be seen as a computer if you map its states right. How do you non-arbitrarily draw the line between an agent who is 'correlated enough' to cooperate with and one who isn't? If you can't define the metric, your cooperation coefficient is just a free parameter you tune to get the result you want."

  **The Reply (2 mins):**
  "That's a fair challenge. I'm not proposing a God's-eye view of similarity. I'm proposing a subjective, agent-relative clustering based on predictive utility. If modeling you as running a similar procedure helps me predict your behavior better than modeling you as random, then for the purposes of the decision problem, we are correlated. It's not about metaphysical identity; it's about whether the 'similar algorithm' hypothesis pays rent in expected utility. If the metric is noisy, the prescription is just to cooperate less, not to abandon the framework."

  **Soft Spot:** This invites the charge of subjectivity. If I think we're similar and you don't, do we cooperate? If the metric is subjective, coordination fails. You don't have a solution for asymmetric similarity beliefs.

  #### **3. The "Collapse" Objection (The One You Hope Nobody Asks)**
  **Who:** The sharp grad student or junior faculty who reads everything.
  **The Question:** "It seems like your 'modest' view collapses. If the evidential correlation is weak, your view recommends standard altruism + CDT. If the correlation is near-perfect, your view recommends superrationality/FDT. Is there actually any space in the middle where 'Modest ECL' prescribes something distinct from existing theories? Or is this just a heuristic for when you're unsure which decision theory to use?"

  **The Reply (2 mins):**
  "The distinctiveness isn't in the *extremes*, it's in the *scaling*. Standard altruism doesn't scale with correlation; superrationality assumes binary identity. My view prescribes a continuous weighting of cooperative payoff based on the *degree* of expected correlation. It tells you how to act when you think there's a 40% chance your counterpart reasons like you, which is the actual human condition. Existing theories are binary; ECL is analog. That's the niche."

  **Soft Spot:** This is your weakest theoretical ground. If they press that "weighting by correlation" is just EDT with a prior, you look like you've reinvented EDT but scared to name it.

  #### **4. The Bayesian (Medium Damage)**
  **Who:** One of the two stats-focused faculty.
  **The Question:** "You're treating the correlation as a given. But in a large world, the prior probability of encountering a correlated agent depends heavily on your reference class. How do you avoid the 'reference class tennis' problem where I just define the class of 'people like me' to include only cooperators?"

  **The Reply (2 mins):**
  "You avoid it by penalizing complex reference classes. If you have to add many clauses to define the class 'people who cooperate with me,' the prior probability of that class drops. I'm suggesting we use the simplest causal history description: 'agents trained on similar data with similar architectures.' That's a natural kind in a way that 'cooperators' isn't. We lean on Occam's razor to fix the reference class."

  **Soft Spot:** Occam's razor is not a magic wand. A clever adversary can always construct a simple description that picks out only cooperators.

  #### **5. The Kantian (Medium-Low Damage)**
  **Who:** The ethicist.
  **The Question:** "This sounds like the Categorical Imperative. 'Act only according to that maxim whereby you can at the same time will that it should become a universal law.' You're just saying 'act as if your algorithm is universal.' Why do we need decision-theoretic notation for a moral intuition?"

  **The Reply (2 mins):**
  "Kant gives a moral constraint; I'm offering an instrumental justification. Kant says you *ought* to cooperate because it's right. I'm saying you *should* cooperate because, given the structure of the world, that policy yields higher expected utility for your goals, even if those goals are selfish. It's the difference between 'cooperation is virtuous' and 'cooperation is winning.' I want to persuade the selfish agent, not just the moral one."

  **Soft Spot:** If they argue that "instrumental reason" collapses into morality in large worlds, you lose the distinction. But this is usually a safe deflection.

  #### **6. The Grad Student (Low Damage)**
  **Who:** The LessWrong reader.
  **The Question:** "Why stop at the modest version? If we're in a multiverse, there are infinite copies. By being modest, aren't you leaving huge value on the table? Why not go full maximalist?"

  **The Reply (2 mins):**
  "Epistemic humility. We don't know the measure of the multiverse, and we don't know how to condition on infinite sets without paradox. I want a theory that works for *this* world, where we see similar minds, without requiring a commitment to controversial cosmology. Let's walk before we run. If the modest version works, we can extend it later."

  **Soft Spot:** They will think you're being timid to appease the senior faculty. It won't sink you, but it might make you look unambitious.

  ---

  ### **The "Hope Nobody Asks" Question (Refined)**
  You identified the Collapse Objection (Consequentialism vs. Superrationality). I agree that is the big one. However, there is a specific formulation of it that is more dangerous:

  **"Isn't this just CDT with Pre-commitment?"**
  If a CDT agent can pre-commit to a policy *before* the correlation is established, they get the ECL benefits without needing "evidential" magic.
  *   **Why it hurts:** It renders your paper redundant. If CDT + Pre-commitment = ECL, you haven't found a new reason to cooperate; you've just described a standard CDT strategy.
  *   **Your Defense:** Pre-commitment requires a binding mechanism (contracts, Ulysses pacts). ECL works *without* binding mechanisms, solely through the recognition of structural similarity. It's "acausal trade" without the acausality.
  *   **Risk:** If they argue that "recognizing similarity" *is* a form of logical pre-commitment, you are back to FDT.

  ---

  ### **Vulnerability Analysis & Concession Conditions**

  #### **The Weakest Reply**
  **The "Algorithm Similarity" Defense (vs. The CDT Hardliner).**
  This is where you are most likely to fail under good pushback.
  *   **Why:** You are claiming ECL works "even if CDT is true." Strictly speaking, this is false. CDT is defined by the **Causal Principle**: *Only causal consequences matter.* If the correlation between you and the other agent is purely evidential (common cause, no direct link), CDT *must* defect.
  *   **The Trap:** To make your reply work, you have to argue that "choosing a policy" *causes* the output of similar algorithms. This moves you from CDT to **Functional Decision Theory (FDT)**. FDT proponents (Yudkowsky, Soares) argue exactly this: that your decision *is* the logical output of the algorithm, and therefore logically causes all other instantiations.
  *   **The Risk:** If you admit this, the CDTist will say, "So you *are* rejecting CDT." If you deny it, the CDTist will say, "Then your argument is invalid under CDT." You are trying to stand in a gap that might not exist.

  #### **Where Your Position is Most Likely to Fail**
  **The "Reference Class" Problem.**
  Your modesty relies on being able to identify *which* agents are correlated. If you cannot provide a rigorous, non-gerrymandered metric for "similar decision procedure," the theory has no predictive power.
  *   **Scenario:** An opponent constructs a case where Agent A thinks Agent B is similar (so A cooperates), but Agent B thinks Agent A is different (so B defects). A gets exploited.
  *   **Failure Mode:** If you cannot explain how agents converge on the *same* similarity metric without prior coordination, your theory leads to systematic exploitation of the "modest" cooperators by defectors who claim dissimilarity.

  #### **Concession Condition (When to Fold)**
  You should be prepared to concede the talk (or significantly pivot) if:
  1.  **A Counterexample to Policy Selection:** Someone presents a case where selecting the "ECL policy" clearly yields lower utility than the "CDT policy" *even given the correlation*, because the correlation is spurious.
      *   *Example:* Two agents are correlated because they both read the same misleading book that says "Cooperate." They are evidentially linked, but the book is wrong about the world structure. If ECL says "Cooperate" and they lose, while CDT says "Defect" and they win, your claim that ECL is *instrumentally* better fails.
  2.  **The "Ghosts in the Machine" Theorem:** If a formalist shows that your "similarity metric" requires solving the Halting Problem or requires access to the other agent's source code (which you don't have in the real world), you have to concede the "modest" version is computationally intractable and thus not a normative guide for humans.

  #### **Framing Check (Crucial Correction)**
  **You wrote:** *"I actually think ECL gives us a reason to cooperate even if causal decision theory is true."*

  **Flag:** **This is technically confused.**
  *   **CDT** is defined by the rejection of evidential links as decision-relevant.
  *   **ECL** is inherently an **EDT/FDT** concept.
  *   **Correction:** Do not say "Even if CDT is true." Say: "Even for agents who *start* with CDT intuitions, recognizing the causal reality of their own algorithm pushes them toward ECL-style cooperation." OR "ECL provides a bridge: it shows that CDT agents who can model their own decision process as a logical object (FDT-lite) should cooperate."
  *   **Why:** If you tell a CDTist "CDT is true but you should do ECL," they will hear "Logic is true but you should believe contradictions."
  *   **Fix:** Frame it as **Policy-Selection CDT**. CDT evaluates *acts*. If you evaluate *policies* (which CDT can do via pre-commitment arguments), and your policy is instantiated in multiple places, then choosing the policy *causally* determines the outcome in all places. This saves your claim without contradicting the definition of CDT.

  **Final Advice:**
  Your "modesty" is your shield, but also your weakness. Don't let them paint it as "incompleteness." Frame it as "robustness." You aren't refusing to go to the max; you are building a bridge that works even if the multiverse turns out to be small. That's a feature, not a bug. Good luck.
