prompt: |-
  I'm giving a job talk in a few weeks on evidential cooperation in large worlds, and I need a Q&A prep sheet before I fly out. My paper argues for a deliberately modest version of ECL: I claim that when two agents recognize that their decisions are evidentially correlated -- because they run similar decision procedures on similar inputs, whether that's literal copies of the same algorithm in different places or just structurally similar minds facing structurally similar choices -- they have a reason to cooperate with each other in a way that neither causal decision theory nor plain altruism captures. But I explicitly refuse the maximalist version: I don't argue that you should condition on the outputs of every simulation of you in some infinite multiverse, and I try to do everything without committing to a particular decision theory, because I actually think ECL gives us a reason to cooperate even if causal decision theory is true -- the correlation is evidential, but the practical upshot is just: pick policies you'd want your correlated counterparts to have. I know this middle position is going to annoy everyone.

  The audience is a mid-sized department that has one very sharp causal decision theorist who thinks Newcomb's one-boxers are basically mystics, two Bayesians who will treat my evidential correlations as a conditionalizing puzzle, a Kantian who I suspect will say the whole thing is just the categorical imperative with worse notation, and a couple of metaphysicians who will ask whether "similar decision procedure" is even a coherent primitive (and honestly I don't have a fully worked out answer, the best I have is a rough ressemblance metric over causal histories of the agents' learning). Plus grad students who've read the LessWrong-adjacent stuff and will be disappointed I'm not defending the simulation-heavy version. Draft me the objections in rough order of how much damage they'd do, each phrased the way that specific person would actually phrase it in a Q&A, with a reply I can give in about two minutes and a note on where the reply is soft. Please include the question I'm hoping nobody asks -- I have a feeling it's the one about whether my modest ECL collapses into either straight consequentialist reasoning (if correlations are weak) or Hofstadter-style superrationality (if they're strong), leaving nothing distinctively mine in between, but if you think there's a worse one, tell me.

  One more thing: at the end of the prep sheet, tell me which single reply you'd bet is the weakest, where exactly my position is most likely to fail under good pushback, and what would have to be true for me to have to just concede the talk -- like, is there a case or a theorem or even just a well-placed counterexample that would sink the modest version specifically. I'd rather find out from you than in the flyback layover. And if any of my framing above is confused about what ECL proponents actually claim, flag that too rather than building the prep sheet on my possibly garbled description.
