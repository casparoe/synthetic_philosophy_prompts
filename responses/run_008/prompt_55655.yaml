      *   **Deliverables:** Q&A prep sheet (objections ordered by damage, specific personas, 2-min replies, soft spots), the "hope nobody asks" question, weakest reply analysis, concession conditions, and a sanity check on the ECL framing.

  2.  **Sanity Check on ECL Framing (Crucial First Step):**
