      *   *Definition:* Rejecting a claim because it is not precise (i.e., because there is no sharp cutoff point).
      *   *Nuance:* Sometimes gradients *do* undermine categories (e.g., defining "adult" strictly by a single cell division). Sometimes they don't (e.g., "wet" vs. "dry" despite humidity gradients). I need to explain when the fallacy applies and when the "spectrum" observation is valid but doesn't yield her conclusion.

  4.  **Drafting the Menu of Theses:**
