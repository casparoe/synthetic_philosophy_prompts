answer: |-
  Here is my definite diagnosis: **The debate is substantive, not verbal, and it is not a loop. It is a spiral of refinement that has successfully transformed an impossibility claim into a cost-benefit analysis.**

  You are half-right: the fight is not about "moral language" in the linguistic sense (no one thinks English speakers use 'wrong' differently than they did in 1960). It is about **explanatory priority**. However, you are wrong that the debate has frozen. The stalemate you perceive is actually the stabilization of a very specific theoretical trade-off that was invisible in the 1960s.

  Here is the breakdown of the diagnosis, the function of the "ad hoc" objection, and what counts as progress.

  ### 1. The Diagnosis: Substantive Conflict over Explanatory Priority
  The disagreement is not verbal. Both sides mean roughly the same thing by "meaning" and "express." The conflict is about which constraint on theory construction is inviolable.

  *   **The Cognitivist Constraint:** Semantic theory must be uniform across discourse. If 'wrong' behaves logically like 'red', its semantics should be modeled the same way (truth-conditions). To deviate requires independent linguistic evidence (which is lacking).
  *   **The Expressivist Constraint:** Metaethical theory must explain the action-guiding, non-cognitive nature of moral judgment. If assigning truth-conditions commits you to moral properties that are metaphysically queer or epistemologically inaccessible, the semantics must be adjusted to avoid that commitment.

  The debate is substantive because it forces a choice between **semantic naturalism** (treat moral language like any other language) and **metaethical parsimony** (avoid committing to weird moral facts). It is not two projects welded together; it is one project (understanding normativity) where the semantics is the lever used to move the metaphysics. You cannot pull them apart because the expressivist *uses* the semantics to avoid the metaphysics.

  ### 2. What the "Ad Hoc" Objection is Actually Doing
  You hypothesized that "ad hoc" is code for "your machinery wouldn't generalize." That is close, but it is more specific. The charge is a violation of **methodological naturalism in semantics**.

  When a critic calls Blackburn's or Gibbard's machinery "ad hoc," they are saying: *You have posited a semantic mechanism (e.g., attitudes toward attitudes, or planning states) that is triggered solely by moral vocabulary and has no analogue in non-normative discourse, solely to save your metaethical view.*

  In standard semantics, we don't give 'and' one logic for physics and another for ethics. We don't give 'if...then' a special meaning when it embeds 'murder'. If an expressivist needs a special logic of "commitment" or "planning" that applies *only* to normative sentences to make modus ponens work, they are tailoring the semantics to fit the metaphysics, rather than letting the semantics describe the language.

  The work the objection does is **burden-shifting**. It concedes that expressivism *can* be made formally consistent (thanks to recent work), but argues that the *cost* of that consistency is a fragmented, non-uniform semantic theory that violates standard practices in the philosophy of language.

  ### 3. The Progress Report: You Are Wrong About the Loop
  You stated that everyone's positions have frozen and it's a loop. **This is incorrect.** Significant progress has been made, specifically between 1980 and 2008.

  *   **1960s (The Impossibility Claim):** The Frege-Geach problem was viewed as a knockout blow. The consensus was that expressivism literally could not account for logical validity.
  *   **1980s-90s (The Existence Proof):** Blackburn (*Spreading the Word*) and Gibbard (*Wise Choices, Apt Feelings*) demonstrated that a non-truth-conditional semantics *could* be constructed. They showed it wasn't impossible, but their systems were informal and vulnerable to the "negation problem."
  *   **2000s-Present (The Formalization):** Mark Schroeder's *Being For* (2008) is the watershed moment. Schroeder provided a fully formal, compositional semantics for expressivism that handles embedding and validity rigorously. He showed exactly what an expressivist logic looks like (a "biforced" attitude semantics).

  **The progress is this:** We now know that the Frege-Geach problem is not a logical impossibility for expressivism. It is a **theoretical cost**.

  The debate has moved from "Can expressivism solve F-G?" (Answer: Yes) to "Is the semantic complexity required to solve F-G worth the metaphysical savings?" This is a massive shift. The "loop" you see is actually the settling of dust after the formal work was done. The positions haven't changed because the *trade-off* has been clearly defined.

  ### 4. What Counts as Progress Now?
  Given this diagnosis, a "solution" where one side surrenders is unlikely and unnecessary. Progress is no longer about finding a knockout argument. Progress looks like this:

  1.  **Rejection of the "Hybrid" Escape:** Hybrids (like Copp or Ridge) often claim to get the best of both worlds. Progress requires recognizing that hybrids usually just push the expressivist problem back one step (now you need a semantics for the *attitude* part of the hybrid). Acknowledging that hybrids incur *both* the metaphysical costs of cognitivism and the semantic costs of expressivism would clarify the landscape.
  2.  **Comparative Theoretical Virtue:** The debate should explicitly frame itself as a comparison of total theoretical cost.
      *   **Cognitivism:** Low semantic cost (standard truth-conditional semantics), High metaphysical cost (commitment to moral properties/facts).
      *   **Expressivism:** High semantic cost (non-standard logic/semantics for normative terms), Low metaphysical cost (no moral properties required).
      *   **Progress** occurs when philosophers stop arguing about F-G as a "gotcha" and start arguing about whether the semantic cost is higher than the metaphysical cost.
  3.  **Linguistic Data:** Instead of armchair intuition pumps about conditionals, progress requires looking at actual linguistic behavior. Do normative terms behave like predicates in other syntactic environments (e.g., probability operators, modals)? If expressivists can show their semantics predicts linguistic data better than cognitivism (or vice versa), that is empirical progress.

  ### Conclusion
  Your reading group is stuck because you are treating the Frege-Geach problem as a puzzle to be solved rather than a price to be paid.

  **My verdict:** The debate is substantive. It is not a loop; it is a completed proof of concept that has turned into a negotiation over theoretical cost. The "ad hoc" objection is a legitimate methodological warning about semantic fragmentation. Progress will not come from a new semantic machinery that solves F-G "elegantly" (Schroeder already did the heavy lifting there). Progress will come when metaethicists stop pretending F-G is a refutation of expressivism and start treating it as a **tax** on the view.

  If your group wants to move forward, stop asking "Can expressivism handle embedding?" (The answer is yes, at a cost). Start asking: "Is the semantic tax expressivism pays to avoid moral realism higher than the metaphysical tax realism pays to handle the queerness of moral facts?" That is the only live wire left in this debate.
