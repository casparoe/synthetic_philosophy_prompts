      *   *Emphasis:* Highlight that the legal system claims to do *both* (modify behavior AND serve justice), whereas the operant framework only sees the former.

  9.  **Final Polish:** Ensure the conclusion offers some closure or perspective on the brother's situation without giving legal advice. Focus on the conceptual limit. (Proceed to generate output).

