answer: |-
  This is a classic scenario known in economics as the **Allais Paradox**, named after Maurice Allais, who won the Nobel Prize partly for identifying it. Your friend is testing whether your choices conform to **Expected Utility Theory (EUT)**, which is the standard model of decision-making in neoclassical economics.

  Here is the breakdown of what is settled math, what is theoretical debate, and how you might handle the real-money version.

  ### 1. The Settled Arithmetic: Why Your Friend Says You Contradict Yourself

  Mathematically, your friend is correct that your two answers are inconsistent **under the specific rules of Expected Utility Theory.** This is not a matter of opinion; it is a matter of algebra.

  Here is the "stripping" logic your friend mentioned (called the **Independence Axiom**):

  *   **Round 1:**
      *   **Option A:** 100% chance of \$2,000.
      *   **Option B:** 89% chance of \$2,000, 10% chance of \$12,000, 1% chance of \$0.
      *   *Your Choice:* **A** (The Sure Thing).

  *   **Round 2:**
      *   **Option C:** 11% chance of \$2,000, 89% chance of \$0.
      *   **Option D:** 10% chance of \$12,000, 90% chance of \$0.
      *   *Your Choice:* **D** (The Big Gamble).

  **The Contradiction:**
  Notice that Option A and Option B share an **89% chance of winning \$2,000**.
  Notice that Option C and Option D share an **89% chance of winning \$0**.

  Expected Utility Theory says that if you prefer A over B, you are essentially saying that a 11% chance of \$2,000 is worth *more* to you than a 10% chance of \$12,000 (plus a 1% chance of nothing).
  *   *Mathematically:* $11\% \times U(\$2,000) > 10\% \times U(\$12,000)$

  However, in Round 2, you chose Option D. This implies you value the 10% chance of \$12,000 *more* than the 11% chance of \$2,000.
  *   *Mathematically:* $10\% \times U(\$12,000) > 11\% \times U(\$2,000)$

  You cannot hold both inequalities to be true at the same time. One must be false. Therefore, under the axioms of Expected Utility Theory, your preferences are **intransitive** (circular) or inconsistent.

  **The Settled Verdict:** If "rationality" is defined strictly as "adhering to the axioms of Expected Utility Theory," then yes, your choices are irrational. There is no debate about the math here.

  ### 2. The Debated Theory: Does This Actually Make You "Irrational"?

  This is where your friend's claim becomes controversial. While the *math* is settled, the *interpretation* of what that math means for human rationality is heavily debated within behavioral economics and psychology.

  **The Argument for "You Are Rational" (Behavioral View):**
  Many economists and psychologists argue that Expected Utility Theory is a flawed model of human psychology, not a law of nature.
  *   **The Certainty Effect:** Humans place a disproportionately high value on moving from 99% probability to 100% probability. In Round 1, the "Sure \$2,000" feels qualitatively different from a gamble, even a safe one. In Round 2, neither option is sure, so you switch to maximizing the potential payout. This is a predictable psychological pattern, not necessarily a logical error.
  *   **Regret Minimization:** In Round 1, if you took the gamble and hit the 1% "nothing" outcome, you would feel immense regret knowing you threw away a guaranteed \$2,000. In Round 2, if you lose, you haven't "lost" anything you already had. Some theories suggest minimizing anticipated regret is a rational strategy, even if it violates EUT.
  *   **Ecological Rationality:** In the real world, probabilities are rarely known precisely. A heuristic that says "take the sure bird in hand" is often a survival advantage. Being consistent in a lab experiment might be less important than being robust in a messy reality.

  **The Argument for "You Are Irrational" (Normative View):**
  *   **Money Pump Argument:** If your preferences are inconsistent, a clever trader could theoretically construct a series of trades that makes you pay to swap A for B, then B for A, draining your money endlessly without changing your outcome. If you are vulnerable to a "money pump," you are vulnerable to exploitation.
  *   **Frame Insensitivity:** A rational agent should care about the final outcome (wealth state), not how the choice is described or framed. Your feeling that Round 1 felt different from Round 2 is exactly the "framing effect" that normative economists argue you *should* ignore.

  **The Debated Verdict:** Whether your answers count as "irrational" depends on whether you believe rationality means **internal logical consistency** (your friend's view) or **making choices that feel right and serve your well-being** (the behavioral view). Most modern behavioral economists agree that while you violate EUT, you are acting in a way that is psychologically normal and arguably adaptive.

  ### 3. Strategy for the Real Money Experiment

  Since your friend is offering real money next week, you need a strategy that aligns with your actual goals, not just abstract axioms.

  **Step 1: Check the Expected Value (EV)**
  Let's look at the raw arithmetic of the average payout.
  *   **Round 1 Sure:** \$2,000.
  *   **Round 1 Gamble:** $(0.89 \times 2000) + (0.10 \times 12000) + (0.01 \times 0) = 1780 + 1200 = \mathbf{\$2,980}$.
  *   **Round 2 Gamble 1:** $0.11 \times 2000 = \mathbf{\$220}$.
  *   **Round 2 Gamble 2:** $0.10 \times 12000 = \mathbf{\$1,200}$.

  In *both* rounds, the "risky" option has a significantly higher Expected Value.
  *   In Round 1, the gamble is worth \$980 more on average.
  *   In Round 2, the big gamble is worth \$980 more on average.

  **Step 2: Decide Based on Your Utility, Not Consistency**
  You mentioned you are between jobs and \$2,000 is two months of rent. This is crucial.
  *   **Standard EUT** assumes you can smooth out risk over time.
  *   **Your Reality** is that this is a one-off decision with high stakes for your housing security.

  **Recommendation:**
  1.  **If the money is "life-changing" or "rent-critical":** Stick with your Round 1 choice (Sure \$2,000). The utility of securing housing outweighs the mathematical advantage of the gamble. Do not worry about consistency with Round 2.
  2.  **If the money is "nice to have" (e.g., you have savings):** You should probably switch your Round 1 choice to the Gamble. Since the Expected Value is nearly \$1,000 higher, taking the sure \$2,000 is leaving free money on the table.
  3.  **For Round 2:** Almost everyone chooses the 10% chance at \$12,000 here. The EV is much higher, and since neither option is "sure," you aren't losing the psychological comfort of certainty.

  **How to Answer Your Friend:**
  If she asks why you are inconsistent, you can say:
  > "I understand that I violate the Independence Axiom of Expected Utility Theory. However, I am weighting the **certainty** of Round 1 higher because of my current financial fragility. In Round 2, since certainty is off the table, I maximize Expected Value. I am prioritizing **risk management** in the first round and **return maximization** in the second, rather than logical consistency across abstract probabilities."

  ### Summary
  *   **Is she right about the math?** Yes. Your choices violate the Independence Axiom.
  *   **Is she right that you are irrational?** That is debated. You are violating a specific economic model, but you are displaying a very common human preference for certainty that many experts argue is reasonable.
  *   **What should you do?** If you need the rent money, take the sure \$2,000 in Round 1 and don't apologize for it. If you can afford to lose, take the gambles in both rounds to maximize your average winnings. Do not change your answer just to satisfy an axiom; change it only if it improves your actual financial outcome.
