answer: |-
  **The Scenario**

  Marcus, a department head, needs his best analyst, Sarah, to sign off on a risky but ethically necessary audit that could expose the company to regulatory liability. Sarah hesitates, fearing that if the regulators punish the firm, she will be made the scapegoat to save management. Marcus tells her, "If there is fallout, I will resign and take full public responsibility, preserving your license and career." Sarah agrees to sign only because she knows Marcus has a history of absorbing blame for his team, even when silence would have saved his own standing. When the regulators do come down hard, Marcus is privately offered a deal: shift the blame to Sarah's "oversight" in exchange for keeping his position and bonus. A purely self-interested actor would take the deal, but Marcus resigns instead, costing him his livelihood but validating the trust that allowed the audit to happen in the first place.

  **The Mechanics**

  At the crucial later moment—when the regulators arrive—a fully forward-looking, self-interested helper calculates the costs and benefits anew. At this point, the work is already done; the audit is filed. Sacrificing Sarah costs Marcus nothing in terms of completed work, but saving her costs him his job and bonus. The rational move is to defect: blame Sarah, keep the job, and accept that her trust was misplaced. However, Sarah is not naive; she anticipates this calculation at the earlier moment when she is asked to sign. Knowing that Marcus will act in his immediate self-interest when the heat turns on, she refuses to sign the audit. The result is a failure of coordination: the audit never happens, the ethical risk remains unmanaged, and both Marcus and the company are worse off than if Marcus had been able to credibly commit to self-sacrifice. The feature doing the work here is **pre-commitment via character**. Marcus's "irrationality" is his inability to recalculate at the second moment. By being the sort of person for whom breaking a promise of protection is psychologically or morally impossible, he removes the option to defect from his own menu. This constraint, visible to Sarah at the first moment, changes her incentives, allowing the mutually beneficial transaction (the audit) to occur.

  **The Reputation Objection**

  You are right to worry that this collapses into reputation management, and in an ordinary workplace, it usually does. If Marcus protects Sarah to maintain his brand as a "protector," ensuring future employees trust him, he is not being irrational; he is playing a long-term repeated game where the future value of his reputation outweighs the immediate cost of his job. In that light, this is not a true inversion of Parfit's Hitchhiker, but simply a standard solution to the "time inconsistency" problem via reputation. For the inversion to be genuine in the Parfitian sense, the Helper's commitment must hold **even when the reputational payoff is zero or negative**. This would require a scenario where Marcus's sacrifice is secret, or where he is retiring and will never work again, yet he still resigns. In such a case, there is no future utility to harvest; the only reason to follow through is that he has successfully rewired his own decision-making process to value the *disposition* (integrity) over the *act* (self-preservation). In the real world, we rarely see this pure form because reputation usually shadows our choices, but the logic holds: the Helper must be incapable of optimizing at the later moment, not just unwilling to optimize because they are watching the long game. If they are watching the long game, they are still acting in their self-interest; Parfit's point requires that they cease to be a maximizer at the moment of truth.
