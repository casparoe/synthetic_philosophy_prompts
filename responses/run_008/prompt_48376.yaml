      *   **The "Removal" Condition:** The daycare study relies on the fine being *removed* to show permanent damage. In the kidney debate, the proposal is to *keep* the market, not introduce and remove it. The classmate is arguing *against* introduction based on the *removal* data from daycare. That's a mismatch.
