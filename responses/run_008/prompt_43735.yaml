answer: |-
  Subject: Re: Dennett through the imaging pipeline

  Hope the calibration runs on the new inkjet array are settling down nicely and that the spectrophotometer isn't playing up again. I have been thinking about our conversation regarding Dennett's Quining Qualia, and I spent the weekend trying to run his arguments through my own mental colour management module. It is a fascinating exercise because, as you suspected, the vocabulary of digital imaging actually provides a surprisingly robust framework for dismantling the philosophical intuition pumps, though there is some residue left over that demands we take a stance on what exactly our science is measuring. I want to walk you through the translation as faithfully as I can, mapping his four defining properties of qualia onto our workflow, and then see where the pipeline breaks down, because I think that breakdown tells us something decisive about whether the problem lies in our instruments or in the question itself.

  To start with the four properties Dennett attributes to the traditional philosophical conception of qualia, we can treat them as claims about how colour information is handled in a imaging system. The first property is ineffability, the idea that the experience cannot be fully communicated or described. In our world, this maps onto the distinction between a device-dependent signal and a device-independent encoding. If I look at a patch on my monitor and try to tell you what it looks like without using a colour space or a profile, I am stuck with ineffability. I can say it is reddish, but until we agree on a reference medium, say CIELAB under D50, I cannot transmit the precise colour data to you. However, Dennett's point is that qualia are supposed to be ineffable even in principle, whereas in imaging, ineffability is just a lack of bandwidth or a missing profile. We solve it by building the profile. So, if qualia were like colour experiences, the claim that they are ineffable would be like claiming that a pixel value cannot be written to a file. It is not that it cannot be done, but rather that the philosopher is refusing to use the standard encoding. The second property is intrinsicality, the notion that the experience is non-relational and unanalyzable. This is perhaps the easiest to translate because colour science has already demolished this notion. There is no such thing as the true colour of an object independent of the illuminant and the observer. A patch does not possess redness intrinsically; it possesses a spectral reflectance curve that interacts with light and a visual system to produce a signal. To claim a qualia is intrinsic is like claiming a PDF has a colour independent of the monitor displaying it. It is a category error. We know colour is relational, a product of the pipeline, not a property of the source file alone.

  The third property is privacy, the idea that interpersonal comparisons are impossible. In imaging, this corresponds to individual observer metamerism. Your colour matching functions are not identical to mine; our lens yellowing and macular pigment density differ. Strictly speaking, we never see the same colour data. However, we overcome this by using the CIE Standard Observer, a mathematical construct that allows us to build profiles that work well enough for everyone. Privacy in the philosophical sense suggests a metaphysical barrier, whereas in colour science, it is merely a statistical variance that we engineer around. We assume the variance is small enough that we can treat the system as closed. The fourth property is that qualia are directly or immediately apprehended, immune to error. In our workflow, this would be akin to trusting the raw sensor data from a camera before any demosaicing or white balance is applied, assuming that the raw numbers are the truth of the scene. But we know the raw data is noisy, linear, and meaningless without the transform. The perception of colour is the result of the transform, not the input to it. To say the experience is directly apprehended is like saying the printer knows what it is printing before the raster image processor has done its work. The apprehension is the output of the processing, not a separate channel bypassing it.

  Now, let us look at the coffee taster thought experiment, which I think is where the imaging analogy becomes most potent. Dennett describes Chase and Sanborn, two coffee tasters who, over years, find themselves disagreeing about the coffee. The puzzle is distinguishing whether the coffee changed, their taste buds changed, or their standards of judgement changed. In our shop, this is exactly the problem of distinguishing device drift from observer drift from a change in the rendering intent. Imagine you have a proofing printer that you calibrate every morning. Over a year, the nozzles degrade slightly, the paper batch changes, and your own eyes age. You still approve the proofs because they match the target within tolerance. Dennett asks whether there is a fact of the matter about whether the coffee tastes the same to you now as it did then. In imaging terms, if the dE00 values are identical, and your disposition to approve the print is identical, does it matter if the spectral power distribution of the light reaching your retina has shifted? Dennett argues there is no fact of the matter. The taste is just the disposition to judge. If we translate this to colour, the colour appearance is just the disposition to categorise the stimulus. If the pipeline produces the same output behaviour, the internal state is irrelevant. The puzzle dissolves because we realise we are asking for a comparison between two states that are only defined by their functional role in the system. To ask if the qualia changed is like asking if the lookup table feels different today than yesterday, provided the input-output mapping remains constant.

  So, here is the residue report, which is where I think we need to make a decision. A significant portion of Dennett's argument translates cleanly into our vocabulary, specifically the attacks on intrinsicality and direct apprehension. Colour science treats colour as a relational property generated by a pipeline, which aligns perfectly with Dennett's view that consciousness is a user-illusion generated by cognitive processes. The idea that there is no final viewer in the head matches the fact that there is no homunculus looking at the monitor; there is just more processing. However, there is a distortion, or perhaps a silence, in the translation. Colour science can predict discrimination thresholds, metamerism, and colour constancy, but it does not currently have a variable for the sensation of redness itself. We can measure when you tell two patches apart, but we cannot measure the quality of the red you see. This is the hard problem restated. When I look at a colour bar, there is something it is like to see the cyan patch that is not captured by the spectral data or the ICC profile. Dennett says this remainder is an illusion, a bit of folk psychology that we should discard. The question is whether the failure of our vocabulary to capture this sensation points to a blind spot in colour science or a lack of clarity in the concept of sensation.

  I am going to push you towards Dennett's side here, and I think the imaging analogy supports this push. The reason colour science does not have a variable for the sensation of redness is not because the sensation is a non-physical ghost, but because the sensation is not a separate thing from the processing. When you ask for the true colour of a patch without specifying an illuminant, you are asking a nonsense question. Similarly, when you ask for the qualia of an experience without specifying the functional dispositions and the cognitive context, you are asking a nonsense question. The residue that feels left over, the what-it-is-like-ness, is akin to the user interface of a computer. When you click a folder on your desktop, it looks like a manila folder. There is no manila folder in the machine code. If you asked a computer scientist where the folder is in the memory architecture, they would tell you there is no folder, only bits and addresses. The folder is a useful fiction for the user. Dennett is arguing that qualia are the desktop icons of the brain. They are real enough as part of the interface, but they are not intrinsic properties of the system. The fact that our colour management vocabulary cannot express the sensation is because our vocabulary is designed to manage the data, not to describe the interface error. We treat the colour appearance as the output, but we forget that the output is just more data for the next stage of processing.

  If we accept that the translation failure points to a defect in the qualia concept rather than a blind spot in science, it changes how we view the first-person point of view. It suggests that the first-person perspective is not a privileged vantage point on intrinsic reality, but rather a specific mode of access to the system's own data. In imaging, we know that the monitor display is not the image; the image is the file. The display is a rendering. When we say I see red, we are reporting on the rendering, not the file. Philosophers treat the rendering as the only reality. Dennett is telling us to look at the file. The reason the inverted spectrum argument fails in his view is that if you invert the spectrum but keep the functional connections the same, you have not changed the file, only the monitor settings, and if the monitor settings are part of the system, then the inversion is just a recalibration. There is no fact of the matter about whether the red is really green inside, because inside there is only the wiring. The feeling of redness is just the system flagging that wavelength range as significant.

  I know this feels like it dismisses the very thing that makes experience matter, much like saying a print is just dots of ink and ignoring the image. But consider metamerism. Two patches look identical under one light and different under another. Which one is the real colour? Neither. The colour is the relationship. If we accept that, then the feeling of the colour is also a relationship, not a substance. The residue you feel, the sense that something is missing from the imaging translation, is the intuition that there must be a final recipient of the image. But there is no recipient. There is just the pipeline. If you build a gamut mapping algorithm that preserves hue over saturation, it does not need to feel the hue to do the job. If the brain does the same, then the feeling is not a necessary component of the function, which suggests it is not a separate entity at all. It is a description of the function from the inside. So, when you ask if something is left over after the translation, I would say what is left over is the habit of reifying the interface. The imaging vocabulary does not capture the qualia because qualia are not data types; they are operations. We do not measure operations in the same way we measure signals. We characterise them by their input-output behaviour.

  In the end, I think the imaging framework suggests that the original claim about qualia was less clear than it looked, much like asking for the true colour of a patch before specifying an illuminant. The philosophers are asking for a property that exists prior to the relational context that defines it. Colour science succeeded by abandoning the search for object colour and focusing on colour appearance as a function of light and observer. Dennett is proposing we do the same for mind. Abandon the search for intrinsic feel and focus on behavioural disposition and functional role. The resistance you feel to this is the same resistance a painter might feel to being told their work is just spectral reflectance curves. It is true, but it feels like it misses the point. Yet, the point itself is constructed from the curves. There is no magic dust added on top. So, if you find yourself unable to express the qualia in imaging terms, do not assume your vocabulary is too poor. Assume the thing you are trying to express is too vague to be captured by any precise vocabulary. It is a bug in the user interface, not a feature of the hardware. I would be keen to hear if this lands with you, or if you think the spectrophotometer is missing a channel that we simply have not named yet.

  Best wishes
