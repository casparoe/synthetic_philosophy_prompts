          *   Let's make Q4 standard SB Credence. Q5 SB Bet.
          *   Better: Q4 Standard SB. Q5 "Extreme SB" (1 million awakenings vs 1).

      *   *Requirement 5: The "Contested/Unscored" Question.*
          *   Needs to be a case where even experts disagree or where Deflationism shines.
          *   Maybe a "Cloning" case or "Absent-Minded Driver".
