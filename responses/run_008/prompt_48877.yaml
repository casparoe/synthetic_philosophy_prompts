          *   **Scoring Key:** Must map logical space to positions (SSA, SIA, FNC, Deflationism). Must identify incoherent/undefended combos. Must flag indistinguishable positions (e.g., SSA + broad reference class vs. SIA).
          *   **Audience:** Philosophy undergrads (basic probability, no heavy math).
          *   **Tone:** Neutral, diagnostic, not mocking (especially for deflationists).
          *   **Extra:** One question where the "right" answer is contested/unscored to validate deflationists.
          *   **No Citations:** Handout ready.

  2.  **Deconstruct the Positions (Mental Model):**
      *   *SSA (Self-Sampling Assumption):* Reason as if you are a random sample from your reference class. Tends toward "Halfer" in SB, supports Doomsday, skeptical of Presumptuous Philosopher.
      *   *SIA (Self-Indication Assumption):* Reason as if you are more likely to exist in worlds with more observers. Tends toward "Thirder" in SB, rejects Doomsday, supports Presumptuous Philosopher.
      *   *FNC (Full Non-indexical Conditioning):* Condition on all evidence, including "there exists an observer with my exact experiences." Often aligns with SIA in finite cases but diverges in infinite/edge cases. (Note: The prompt asks for the name "Full Non-indexical Conditioning").
      *   *Deflationism/Eliminativism:* Self-locating beliefs aren't truth-apt or probabilities don't apply here.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: God/Room (1 vs 10).*
