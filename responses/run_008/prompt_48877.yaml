prompt: |-
  hey, so I need some help with a thing for my formal epistemology course. quick backstory: we've spent the last few weeks on anthropic reasoning (sleeping beauty, doomsday argument, that kind of thing) and honestly everyone in the class claims some position out loud but then answers the actual cases in a way that doesn't match what they claim. so a few of us want to run a diagnostic quiz on the rest of the class before the last session — "which anthropic reasoner are you actually" — and I'm supposed to write it, but I keep making the questions too leading and my professor (rightly) keeps saying stuff like "you just asked them which label they like."

  so what I want: 8-10 questions, each one a concrete case with 2-4 answer options, and none of them can use terms like "self-sampling," "self-indication," "reference class," or "indexical" — the reader should be able to answer purely on the situation described. then a scoring key that maps answer patterns onto positions: self-sampling assumption, self-indication assumption, the kind of hybrid where you condition on everything you could in principle observe but refuse to add any extra weight for finding yourself existing (the professor called this "full non-indexical conditioning" or something like that — please use the right name if you know it), and the "these questions have no right answer / self-locating probabilities aren't real" deflationary option.

  cases I'd like included, phrased concretely: the one where a coin is flipped and god creates either 1 person or 10 people in identical rooms, and you wake up in a room — what odds do you give the coin? the presumptuous philosopher setup but as a bet (two theories, one says the universe contains 1 intelligent civilization, the other says a trillion, otherwise identical — would you take 999-to-1 odds on the trillion theory? be honest). some version of the doomsday argument where you're told your birth rank among all humans ever. and at least one sleeping beauty question bc half my class are thirders when it's monday and halfers when it's about their own credence, and I want to catch that inconsistency.

  two more requirements that are important: first, the scoring key should be built out of the logical space, not just the list of positions — i.e. lay out the possible answer combinations, then say which actual position (if any) lives in each, and for the combos where nobody plausibly lives, say whether that's because the combo is incoherent or just because nobody's bothered to defend it. second, flag explicitly which pairs of leaves your questions cannot seperate — like I'm pretty sure self-sampling with a very generous reference class ends up answering the same as self-indication on all my cases, and if so the quiz should just admit it rather than pretend it sorted someone.

  audience is philosophy undergrads who've done basic probability but are new to this, so keep the math to odds and simple fractions. also if you can slip in one question where the "right" answer is genuinely contested and the quiz deliberately doesn't score it — just notes the disagreement — that would be great, I want the deflationary people to have somewhere to live without feeling mocked.

  ty! and no citations or reading lists please, this is just going out as a handout, I can't check sources right now.
