      *   *Correction:* FNC *does* add weight for finding yourself existing, but it does so via non-indexical evidence ("There exists an observer with my data") rather than indexical ("I am this observer"). In many finite cases, FNC mimics SIA. I need to be careful not to misrepresent FNC in the key. I will describe it accurately in the key as "Conditioning on all available evidence."
