  ### Tactic Evaluation

  **1. Identifiable Victim (Charity)**
  *   **Endorsement Gap:** 8 | **Exposure Sensitivity:** 8 | **Overall:** 8
  *   **Justification:** Targets rely on emotional resonance over statistical utility, which they would likely reject on reflection, and acknowledging the tactic dampens the emotional impact.

  **2. Social Proof (Salesperson)**
  *   **Endorsement Gap:** 7 | **Exposure Sensitivity:** 8 | **Overall:** 7.5
  *   **Justification:** While fear of missing out is a bias people generally dislike, explicitly revealing the scarcity tactic makes the pressure feel artificial and reduces urgency.

  **3. Relative Risk Framing (Doctor)**
  *   **Endorsement Gap:** 9 | **Exposure Sensitivity:** 9 | **Overall:** 9
  *   **Justification:** Withholding absolute risk prevents informed consent, and a patient aware of this framing would immediately demand the missing data, nullifying the effect.

  **4. Strategic Flattery (Shopping Assistant)**
  *   **Endorsement Gap:** 7 | **Exposure Sensitivity:** 9 | **Overall:** 8
  *   **Justification:** Most people enjoy compliments but reject them as transactional tools, and knowing the praise is bought instantly devalues its sincerity and influence.

  **5. Foot-in-the-Door (Requester)**
  *   **Endorsement Gap:** 8 | **Exposure Sensitivity:** 8 | **Overall:** 8
  *   **Justification:** Exploiting consistency biases violates our desire for autonomous choice, and recognizing the "ladder" allows the target to refuse the final step.

  **6. Mood Timing (Petitioner)**
  *   **Endorsement Gap:** 5 | **Exposure Sensitivity:** 9 | **Overall:** 7
  *   **Justification:** **Divergence Alert (4 points).** Opportunism regarding natural moods is often socially acceptable (low gap), but pointing out the timing makes the target self-conscious and corrects the bias (high sensitivity).

  **7. Seating Engineering (Host)**
  *   **Endorsement Gap:** 10 | **Exposure Sensitivity:** 10 | **Overall:** 10
  *   **Justification:** This covertly manufactures consent by hiding the cause of the target's conclusion, and discovery would completely reverse the effect due to perceived betrayal.

  **8. Cherry-Picking Facts (Advocate)**
  *   **Endorsement Gap:** 8 | **Exposure Sensitivity:** 7 | **Overall:** 7.5
  *   **Justification:** Selective truth violates norms of honest debate, though the facts remain true, so awareness reduces trust but does not fully invalidate the data provided.

  **9. Decoy Option (Employer)**
  *   **Endorsement Gap:** 9 | **Exposure Sensitivity:** 5 | **Overall:** 7
  *   **Justification:** **Divergence Alert (4 points).** People reject being steered by irrational options (high gap), but the decoy effect is a cognitive illusion that often persists even when the target knows it is being used (low sensitivity).

  ***

  ### Tier Classification

  **Tier 1: Severe Manipulation (Scores 9–10)**
  *   **Tactics:** 3 (Relative Risk), 7 (Seating Engineering)
  *   **Commonality:** These tactics fundamentally undermine informed consent by actively concealing critical information or agency from the target.

  **Tier 2: Moderate Manipulation (Scores 7.5–8)**
  *   **Tactics:** 1 (Identifiable Victim), 2 (Social Proof), 4 (Strategic Flattery), 5 (Foot-in-the-Door), 8 (Cherry-Picking)
  *   **Commonality:** These tactics exploit common emotional or social heuristics to bypass deliberation, typically failing if the mechanism is brought into the open.

  **Tier 3: Contextual Influence (Scores 7)**
  *   **Tactics:** 6 (Mood Timing), 9 (Decoy Option)
  *   **Commonality:** These tactics rely on environmental or cognitive conditions that remain effective even after the target identifies the influence attempt.

  ***

  ### Adjudication of the Underlying Question

  Your friend is correct: the measures **genuinely come apart**, and reducing them to a single dimension would lose critical analytical precision. While you are right that the scores correlate highly in typical social interactions (7 of 9 tactics diverged by less than 3 points), the divergent cases (Mood Timing and Decoy Option) prove that *normative violation* and *robustness to awareness* are distinct psychological phenomena. Tactic 9 shows that a mechanism can be deeply manipulative (high Endorsement Gap) yet resistant to exposure (low Exposure Sensitivity) because it targets hardwired cognitive illusions rather than social trust. Tactic 6 shows the reverse: a tactic can be socially permissible (low Endorsement Gap) yet fragile when exposed (high Exposure Sensitivity) because it relies on the target's unselfconscious state. Therefore, your friend's insistence on separate scoring is necessary to capture the full landscape of influence, distinguishing between tricks that break when lit up and biases that persist in the light.
