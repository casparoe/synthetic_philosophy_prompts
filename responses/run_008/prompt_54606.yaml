      *   *Weak Negative Utilitarianism (WNU):* Suffering counts more than pleasure (e.g., weighted), but they are still *commensurable*. Enough pleasure *can* outweigh severe pain, but the ratio is high.
      *   *Lexical Threshold Negative Utilitarianism (LTNU):* Suffering above a certain threshold is *incommensurable* with pleasure. No amount of pleasure outweighs severe torture. However, below the threshold, aggregation might still work.
      *   *Hard Negative Utilitarianism (Hard NU):* Suffering is the *only* thing that matters morally, or at least the prevention of suffering trumps existence itself. Accepts the "Benatar Asymmetry" or extinction conclusion (better never to have been/better to cease if it guarantees no suffering).

