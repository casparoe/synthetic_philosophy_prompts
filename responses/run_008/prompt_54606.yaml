answer: |-
  # Handout: Which Welfare View Do You Actually Hold?

  **Instructions:** Read each case and select the option that best matches your intuitive moral judgment. Do not answer based on what you think is "consistent" with a theory; answer based on what you actually believe is right in the scenario. There are no trick questions, but some answers commit you to conclusions you may find uncomfortable.

  ### 1. The Stubbed Toe vs. The Torture
  A villain will either (A) torture one innocent person continuously for one year, or (B) cause one million people to stub their toes (a brief, sharp pain, roughly 5/10 on a pain scale). You must choose which outcome occurs.
  *   **A.** Prevent the torture (allow the million stubbed toes).
  *   **B.** Prevent the stubbed toes (allow the one year of torture).
  *   **C.** It depends on the exact numbers; if the crowd were large *enough*, the toes would outweigh the torture.

  ### 2. The Utopia Plus
  Imagine two possible futures.
  *   **World A:** Contains $10^{100}$ lives of intense, blissful happiness. However, in one basement, one person is being tortured agonizingly for their entire life.
  *   **World B:** Contains $10^{100}$ lives of intense, blissful happiness (identical to World A), but the person in the basement is not tortured (they live a normal, neutral life).
  *   **Choice:** Is World A *morally better* than World B because of the aggregate happiness, or is World B *mandatory* regardless of the aggregate?
      *   **A.** World A is better (or at least permissible). The aggregate joy outweighs the single instance of agony.
      *   **B.** World B is mandatory. No amount of aggregate pleasure justifies that specific agony.

  ### 3. The Painless Extinction
  You have a button. If pressed, all sentient life will cease instantly and painlessly. No future beings will ever exist. If you do *not* press it, life continues, and while there will be great joy, it is statistically guaranteed that at least one instance of torture-level suffering will occur in the future.
  *   **A.** Press the button. Guaranteeing zero torture is more important than continued existence/pleasure.
  *   **B.** Do not press. The value of future lives and pleasures outweighs the risk of future suffering.

  ### 4. The Mild Pain Threshold
  Consider a "lexical" view where some pains cannot be outweighed by pleasure. Where do you draw the line?
  *   **A.** *Severe Only:* Only torture-level or near-torture suffering is incommensurable with pleasure. Mild pains (headaches, pinpricks) can be aggregated and outweighed by joy.
  *   **B.** *Any Negative:* Any negative experience, no matter how mild, is incommensurable. No amount of pleasure justifies even a single pinprick of pain.
  *   **C.** *None:* All pain is commensurable with pleasure; it is all just math.

  ### 5. The Asymmetry of Creation
  You can choose between two policies:
  *   **Policy X:** Create 1,000 new people who will have very happy lives (but not perfect).
  *   **Policy Y:** Create no one.
  *   **Choice:** Is Policy X morally *required* (or better than Y), or is it merely permissible/neutral?
      *   **A.** X is better. We should bring happy people into existence.
      *   **B.** X is neutral/permissible. We have no duty to create happy lives, only to avoid creating suffering ones.

  ### 6. The Capacity Pill
  You can distribute a pill to all of humanity. It removes the biological capacity to feel suffering entirely. However, it also removes the capacity for intense emotional pleasure (you can feel contentment, but not ecstasy).
  *   **A.** Distribute the pill. Eliminating suffering is worth the loss of ecstasy.
  *   **B.** Do not distribute. The highs of human experience are worth the risk of the lows.

  ***

  # Scoring Key & Philosophical Profiles

  *Tally your responses. Most views will cluster around a dominant pattern, though hybrid views are possible.*

  ### **Profile 1: The Classical Hedonistic Utilitarian (CHU)**
  *   **Pattern:** Mostly **C** (Q1), **A** (Q2), **B** (Q3), **C** (Q4), **A** (Q5), **B** (Q6).
  *   **Core Commitment:** **Commensurability.** Pleasure and pain are on a single scale. Aggregation always wins.
  *   **Implication:** You accept the "Repugnant Conclusion" and deny lexical thresholds. A sufficiently large number of stubbed toes *always* outweighs a torture, given the math.

  ### **Profile 2: The Weak Negative Utilitarian (WNU)**
  *   **Pattern:** Mostly **A** (Q1), **A** (Q2), **B** (Q3), **A** (Q4), **B** (Q5), **A** (Q6).
  *   **Core Commitment:** **Weighted Commensurability.** Suffering counts *more* than pleasure (e.g., 1 unit of pain = 100 units of pleasure), but they are still on the same scale.
  *   **Implication:** You prioritize suffering reduction heavily, but you would still allow a torture instance if the pleasure payoff were truly astronomical (rejecting Q2-B). You distinguish yourself from CHU by weighting pain higher, but from LTNU by refusing to call them *incommensurable*.

  ### **Profile 3: The Lexical Threshold Negative Utilitarian (LTNU)**
  *   **Pattern:** Mostly **A** (Q1), **B** (Q2), **B** (Q3), **A** (Q4), **B** (Q5), **A** (Q6).
  *   **Core Commitment:** **Incommensurability above a Threshold.** Suffering above a certain intensity (torture) cannot be traded off for *any* amount of pleasure. Suffering below that threshold may still aggregate.
  *   **Implication:** This is likely the view of the reading. You reject the "Utopia Plus" (Q2) but might still value creating happy lives (Q5) or continuing humanity (Q3) because positive value exists, it just can't *trump* severe negative value.

  ### **Profile 4: The Hard Negative Utilitarian (Hard NU)**
  *   **Pattern:** **A** on **Q3** is the defining marker. Usually accompanies **B** on Q2 and **A** on Q6.
  *   **Core Commitment:** **Suffering is the Only Disvalue.** The moral imperative is to eliminate suffering, even at the cost of existence itself.
  *   **Implication:** You bite the "Extinction Bullet." If painless extinction guarantees no suffering, it is preferable to a world containing suffering, regardless of the pleasure lost.

  ***

  # Philosophical Footnotes: Gaps & Limitations

  ### 1. Unoccupied or Unstable Combinations
  *   **The "Mild Lexical" View (Q4-B, Q2-A):** Claiming a pinprick is incommensurable with pleasure (Q4-B) but accepting the Utopia Plus (Q2-A) is logically unstable. If *any* pain is lexical, the Utopia Plus contains a lexical violation. This combination is rarely held because it is **incoherent**.
  *   **The "Extinction-Averse Lexicalist" (Q2-B, Q3-B):** This is the **standard LTNU position** (e.g., Knutsson, Vinding). It is *not* incoherent. It holds that while pleasure cannot outweigh torture, existence itself has non-instrumental value (or duties to the living) that prevent pressing the extinction button. It is distinct from Hard NU.
  *   **The "Pleasure Lexicalist" (Q1-C, Q5-A strong):** A view where *pleasure* is lexical over pain (a form of Positive Utilitarianism). This is **unexplored** in this quiz, as the questions focus on suffering priority. A person who chooses Q1-C because "pleasure is infinite" would score as CHU here, masking their actual view.

  ### 2. Indistinguishable Positions (Limitations of the Quiz)
  *   **CHU vs. Weak NU:** This quiz cannot reliably separate Classical Hedonistic Utilitarianism from Weak Negative Utilitarianism. Both believe in commensurability (Q1-C vs Q1-A is a matter of degree, not kind). Unless the quiz asks for specific exchange rates (e.g., "How many toes equal one torture?"), a WNU who sets the ratio at 1:1 looks exactly like a CHU.
  *   **LTNU vs. Hard NU (without Q3):** Without the Extinction question (Q3), Lexical Threshold NU and Hard NU look identical. Both reject the Utopia Plus. Q3 is the only "tie-breaker" that separates those who think suffering trumps pleasure (LTNU) from those who think suffering trumps *existence* (Hard NU).
  *   **Deontology vs. NU:** A Kantian Deontologist might answer exactly like a Lexical Negative Utilitarian (rejecting torture aggregation). This quiz measures *welfare axiology* (how value works), not *normative framework* (rights vs. consequences). A classmate might score as LTNU but actually be a Rights Theorist.
