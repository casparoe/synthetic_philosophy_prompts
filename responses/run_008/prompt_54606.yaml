prompt: |-
  I'm doing a presentation for my ethics seminar on whether pleasure and pain are commensurable — the reading we were given pushes a lexical threshold version of negative utilitarianism, and I suspect half my classmates would say they agree with it until they see what it commits them to.

  For the handout, please write me a "which welfare view do you actually hold?" quiz, 6-7 questions, each a concrete case with two or three options — things like: a future with vastly many contented lives plus one ongoing instance of torture; choosing between preventing a million stubbed toes and curing one person's lifelong agony; whether you'd accept painless extinction of all life if it were the only way to guarantee zero torture-level suffering; whether a barely-above-neutral pleasure could ever outweigh, in aggregate, a single instance of agony if there were enough of it. No question should just ask "are you a negative utilitarian?" — the point is to sort people by what they say about cases, not which label they like.

  Then a scoring key mapping answer patterns onto positions: classical hedonistic utilitarianism, weak negative utilitarianism (suffering gets priority but it all still aggregates), lexical threshold NU (suffering above some threshold is incommensurable with any amount of pleasure), and the hard version that bites the bullet on the extinction case. Please also note the unoccupied combinations of answers — e.g. someone who accepts a lexical threshold but refuses the extinction conclusion — and say briefly for each whether nobody holds it because it's incoherent, unattractive, or just unexplored. And flag any pair of positions the quiz genuinely can't seperate, dont paper over it.
