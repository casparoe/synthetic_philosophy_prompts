prompt: |-
  I'm defending my thesis in about two weeks and need to get ready for the Q&A, and honestly the committee situation is a bit unusual so I want to be careful about who will come at me from which angle. The thesis: special duties to compatriots are real, but they don't come from shared culture, national identity, or anything sentimental like that. They come from the state's ongoing coercion of everyone inside its borders. Basically my claim is that the special claims compatriots have on each other are downstream of the coercive apparatus itself -- you and I are both subject to the same police, courts, tax authority, etc., and that shared subjection is what makes us owe each other things we don't owe strangers abroad. On this view a cosmopolitan who says "borders are morally arbitrary so duties can't stop at them" is answering the wrong question -- the arbitrariness of borders doesn't matter because the duties track the coercion, not the line on the map. And the communitarian who roots special duties in shared culture is wrong too, but for the opposite reason.

  The room: a politics/philosophy workshop, maybe 20 people. The composition matters, so let me lay it out. There's one very senior Kantian who thinks duties have to be grounded in universal reason and will not like that coercion, of all things, generates anything positive. There are two effective-altruist types, grad students mostly, who are strong cosmopolitans and will do the drowning-child / distance-is-arithmetic argument with total sincerity. There's one old-school communitarian who is actually kind of on my side conclusion-wise (compatriots do have special claims) but will hate my grounds, and I expect him to be the most personally invested critic. A handful of undecideds who mostly want to see whether the position is just nationalism in a nicer jacket.

  What I want from you: a prep sheet, not a defense of the view for its own sake. List the objections I'm actually going to get from this specific room, in rough order of how much damage they'd do, each phrased the way that person would actually phrase it (the Kantian's version of an objection is not the EA's version of the same objection, even when it's basically the same worry). For each: a reply I can give in about two minutes, and, honestly, where the reply is soft -- I'd rather know that now than find out in the room. Please include the one question I'm quietly hoping nobody asks, and tell me if you think it's actually as dangerous as I think it is or whether I'm overestimating it.

  One more thing: if there's an objection where the right move is to conceed something up front rather than fight it, flag that too. I'd rather make a small concesion early and keep the core intact than go down defending everything. And if you think one of my premises (the coercion one, probably) is doing way more work than I realize, say so. Thanks!
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User's Request:**
      *   **Context:** Thesis defense in 2 weeks.
      *   **Topic:** Special duties to compatriots are grounded in *shared subjection to state coercion*, not culture/identity (anti-communitarian) or arbitrary borders (anti-cosmopolitan).
      *   **Audience:** Politics/Philosophy workshop (~20 people).
          *   1 Senior Kantian (Universal reason, skepticism of coercion as normative ground).
          *   2 Effective Altruists (Strong cosmopolitans, drowning child argument).
          *   1 Old-school Communitarian (Agrees with conclusion, hates grounds, personally invested).
          *   Handful of Undecideds (Worried about disguised nationalism).
      *   **Deliverable:** A prep sheet.
          *   List objections specific to these personas (phrased in their voice).
          *   Ranked by damage potential.
          *   2-minute replies for each.
          *   Identify soft spots/weaknesses in replies.
          *   Identify the "Quiet Fear" question (the one the user hopes isn't asked) and assess its danger.
          *   Flag where concession is better than defense.
          *   Critique the core premise (coercion).

  2.  **Deconstruct the Thesis Position:**
      *   *Core Claim:* Special duties exist.
      *   *Ground:* Shared subjection to state coercion (the "coercion account").
      *   *Contrast:* Not culture/identity (vs. Communitarians), Not arbitrary borders (vs. Cosmopolitans).
      *   *Implication:* If you are coerced by the same state, you owe each other. If not, you don't (or owe less).

  3.  **Drafting Objections by Persona:**

      *   **The Senior Kantian:**
          *   *Worry:* Coercion is empirical/contingent. Duties must be a priori/universal. Grounding duty in force makes might right.
          *   *Phrasing:* "You're deriving an 'ought' from a 'is' of power."
          *   *Damage:* High. Attacks the normative foundation.

      *   **The Effective Altruists (EAs):**
          *   *Worry:* Needs are needs. Distance/coercion doesn't change the moral weight of suffering.
          *   *Phrasing:* "Why does a tax form matter more than a dying child?"
          *   *Damage:* Medium-High. Classic cosmopolitan objection, but maybe easier to deflect as "different *kind* of duty."

      *   **The Communitarian:**
          *   *Worry:* Coercion is cold/transactional. Community is about belonging/value.
          *   *Phrasing:* "You've described a prison, not a polity."
          *   *Damage:* Medium. He agrees with the conclusion, so he won't try to destroy the thesis, but he might expose the emotional/moral hollowness of the view.

      *   **The Undecideds (Nationalism Worry):**
          *   *Worry:* This justifies excluding outsiders.
          *   *Phrasing:* "Is this just nationalism for liberals?"
          *   *Damage:* Medium. Political viability check.

  4.  **Ranking by Damage:**
      1.  Kantian (Foundational/Normative authority).
      2.  EAs (Moral urgency/Scope).
      3.  Communitarian (Plausibility/Phenomenology).
      4.  Undecideds (Political implications).

  5.  **Developing Replies & Identifying Soft Spots:**

      *   *Kantian Reply:* Coercion creates a *problem of justice* that requires a solution among those involved. It's not that force makes right, but that force creates a specific relational context requiring justification.
          *   *Soft Spot:* Still feels like grounding normativity in brute facts.
      *   *EA Reply:* Distinguish *humanitarian* duties (universal) from *justice* duties (special). Coercion triggers justice duties.
          *   *Soft Spot:* Hard to maintain the boundary. Does coercion really block humanitarian aid?
      *   *Communitarian Reply:* Acknowledge culture matters for *identity*, but coercion matters for *obligation*.
          *   *Soft Spot:* Might admit the view is too thin.
      *   *Nationalism Reply:* Emphasize that the duty is *inclusive* of all coerced, not exclusive based on blood.
          *   *Soft Spot:* Still excludes those outside borders.

  6.  **The "Quiet Fear" Question:**
      *   *What is the user afraid of?* Usually, it's the "Gotcha" that collapses the distinction.
      *   *Candidate:* "What about non-citizens resident in the state?" (Undocumented immigrants). They are coerced but not compatriots.
      *   *Analysis:* This is *very* dangerous. If duties track coercion, undocumented residents are owed the same as citizens. If the user says "no," the theory collapses into nationalism. If "yes," it challenges the "compatriot" framing.
      *   *Verdict:* It is as dangerous as feared. Needs a concession strategy.

  7.  **Critiquing the Premise (Coercion):**
      *   Is it doing too much work? Yes. It explains *justice* duties well, but maybe not *solidarity* or *welfare* duties. It also faces the "non-citizen resident" problem immediately.

  8.  **Concession Strategy:**
      *   Where to concede? To the EAs on humanitarian aid. To the Communitarian on the *value* of culture (just not the *source* of duty). To the "Quiet Fear" on non-citizen residents (admit they are included).

  9.  **Refining the Output:**
      *   Tone: Professional, strategic, direct.
      *   Format: Clear headings, bullet points.
      *   Check against constraints: 2-minute replies, specific phrasing, soft spots highlighted.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I capture the Kantian's specific vocabulary? (Need to use "categorical," "a priori," "contingent").
      *   *Check:* Did I capture the EA's specific vocabulary? (Need to use "suffering," "impartiality," "marginal utility").
      *   *Check:* Is the "Quiet Fear" actually the hardest question? The non-citizen resident question is the standard "coercion account" killer. I should make sure that's the one.
      *   *Check:* Is the advice on concession practical? Yes, conceding the scope of "compatriots" to include all residents saves the coercion logic.

  11. **Final Polish:** Ensure the distinction between *humanitarian* duties and *justice* duties is clear, as that's the strongest shield for this theory. (Nagel/Blake style arguments).

  *(Self-Correction on the Kantian)*: A Kantian might actually *like* the coercion argument if framed as "public right." But the prompt says this specific Kantian thinks duties must come from universal reason. So the objection is about the *source* of the duty being contingent (state existence) rather than rational. I need to make sure the reply addresses *why* contingency matters for *special* duties specifically.

  *(Self-Correction on the Communitarian)*: He's "on my side conclusion-wise." So he won't try to fail me. He will try to *convert* me or show my view is impoverished. The reply should be respectful but firm on the *grounding*.

  *(Final check on the "Quiet Fear")*: The prompt asks me to identify the question they hope nobody asks. The "Undocumented/Resident" question is the technical killer. The "Nationalism in disguise" is the political killer. The technical one is more dangerous in a philosophy workshop. I'll go with the Resident question.

  Let's assemble the prep sheet.cw
answer: |-
  # Thesis Defense Prep Sheet: The Coercion Account of Special Duties

  **Strategy Overview:** Your position is a version of the "Political Obligation" or "Associative Duties" view (akin to Andrea Sangiovanni or Michael Blake). Your strongest shield is distinguishing between **Humanitarian Duties** (universal, based on need) and **Justice Duties** (special, based on coercive relationships). Do not let these blur.

  Below are the objections ranked by damage potential, phrased for the specific committee members, with replies and vulnerability assessments.

  ---

  ### 1. The Kantian (Senior Faculty)
  **Damage Potential:** **Critical.** This attacks the normative foundation of the entire thesis.
  **The Objection:** "You are attempting to derive a normative obligation from a contingent empirical fact. That the state *does* coerce us is a description of power, not a justification for duty. If the state vanished tomorrow, would your duty to your compatriot vanish? If yes, your morality is hostage to politics. If no, then coercion isn't the ground. How do you avoid the naturalistic fallacy here?"

  **The 2-Minute Reply:**
  "I agree that coercion alone doesn't generate moral value. But coercion generates a specific *problem of justification* that doesn't exist otherwise. When I am coerced in the name of a collective 'we,' I owe those other members of the 'we' a justification for that coercion. That duty of justification *is* the special duty. It's not that force makes right; it's that force creates a relational demand for reciprocity among those subject to it. So, if the state vanished, the specific *justice-based* duties would vanish, leaving only universal humanitarian duties. I'm not grounding duty in power, but in the normative requirements of a specific coercive relationship."

  **Soft Spot:**
  You are admitting that your "special duties" are contingent on the state's existence. A hardline Kantian may reject contingent duties as morally insignificant.
  **Concession Flag:** **Yes.** Concede that these are not *the only* duties. Explicitly state: "I am not arguing these are the only moral duties, only the only *special political* duties." This isolates the Kantian's worry to the realm of political justice, where contingency is acceptable.

  ### 2. The Effective Altruists (Grad Students)
  **Damage Potential:** **High.** This attacks the moral urgency of your view.
  **The Objection:** "This seems like moral arbitrariness dressed up as political theory. If a child is drowning in front of me, I save them. If a child is drowning abroad, I should also save them. Why does the fact that we share a tax authority make my duty to the neighbor *stronger* than the duty to the starving foreigner? You're prioritizing bureaucratic relationships over human suffering."

  **The 2-Minute Reply:**
  "I accept the premise that suffering creates a universal duty. My claim is narrower: I'm talking about duties of *justice*, not rescue. The duty to save the drowning child is humanitarian. The duty to fund my compatriot's pension or school is a duty of distributive justice. Distributive justice only applies where there is a shared coercive framework to distribute goods. I'm not saying you can ignore the foreigner; I'm saying the *kind* of claim compatriots have on each other (e.g., via tax redistribution) is structurally different from the claim a stranger has on you (emergency aid)."

  **Soft Spot:**
  The line between "justice" and "rescue" is porous. If the foreigner's need is extreme enough, it swamps the compatriot's claim to redistribution.
  **Concession Flag:** **No.** Hold the line on the distinction. If you concede here, the thesis collapses into cosmopolitanism.

  ### 3. The "Quiet Fear" Question (The Resident/Non-Citizen Problem)
  **Damage Potential:** **Critical.** This is the internal contradiction trap.
  **The Question:** "You ground duties in shared subjection to coercion. What about undocumented immigrants or long-term residents who are not citizens? They are subject to the police, courts, and taxes. By your logic, don't we owe them the exact same special duties as citizens? If yes, your 'compatriot' language is misleading. If no, your coercion ground is false."

  **Assessment:**
  **Is it as dangerous as you think?** **Yes.** This is the standard counter-example to coercion accounts (often raised against Blake or Sangiovanni). If you say "no," you look like a nationalist. If you say "yes," you have to explain why your thesis is about "compatriots" and not "residents."

  **The 2-Minute Reply:**
  "That is a crucial implication, and I accept it. On my view, 'compatriot' should be understood functionally as 'co-subject.' If a resident is subject to the same coercive apparatus, they are owed the same duties of justice. The boundary of the duty tracks the boundary of the coercion, not the boundary of citizenship. I use 'compatriot' conventionally, but I concede the theory implies we owe these duties to all coerced residents, regardless of legal status."

  **Strategy:** **Concede immediately.** Do not fight this. It actually strengthens your view against the "Nationalism in a nicer jacket" crowd (see below) and shows consistency. It neutralizes the trap.

  ### 4. The Communitarian (Old-School)
  **Damage Potential:** **Medium.** He wants you to fail philosophically so he can win culturally.
  **The Objection:** "You've described a prison, not a polity. You reduce the rich texture of national life to a transactional relationship with a police force. People fight for their countries because they love them, not because they fear the taxman. By stripping out culture and identity, you've made the duty intelligible but unlovable. Why would anyone act on this cold duty?"

  **The 2-Minute Reply:**
  "I agree that culture and identity provide the *motivation* and the *value* of social life. I'm not denying that. I'm arguing they aren't the *source of obligation*. We can love our culture without owing it specific duties of justice. My goal isn't to explain why we *feel* attached, but why we are *bound*. A cold ground is actually safer; it means we owe duties to compatriots we dislike or who have different cultures, provided we share the state. It makes the duty more robust, not less."

  **Soft Spot:**
  He may press that a duty without emotional resonance isn't a "special" duty, just a contract.
  **Concession Flag:** **Yes.** Concede that your account is "thin." "I am offering a thin theory of political obligation, not a thick theory of social solidarity. I leave the thick part to you."

  ### 5. The Undecideds (The "Nationalism" Worry)
  **Damage Potential:** **Medium.** This is the political viability check.
  **The Objection:** "Isn't this just nationalism for liberals? You're still drawing a circle and saying people inside matter more than people outside. You've just changed the ink from 'blood' to 'bureaucracy.' Does this really avoid the exclusionary harms of nationalism?"

  **The 2-Minute Reply:**
  "Nationalism usually claims the border is morally significant in itself. I claim the border is only significant insofar as it marks the limit of a coercive institution. That makes the duty contingent and reformable. If the state expands coercion (e.g., via empire or extradition), the duties expand. If the state dissolves, duties dissolve. It's not about protecting 'us' from 'them'; it's about justifying power over those we coerce. That is fundamentally different from prioritizing one's own kind."

  **Soft Spot:**
  In practice, the limit of coercion usually matches the nationalist border.
  **Concession Flag:** **No.** But acknowledge the practical overlap while insisting on the theoretical distinction.

  ---

  ### Critical Premise Check: Is "Coercion" Doing Too Much Work?

  **Yes.** You are using "coercion" to cover three distinct things:
  1.  **Legal Coercion:** Police/Courts (Strongest link).
  2.  **Economic Coercion:** Taxes/Regulation (Strong link).
  3.  **Social Coercion:** Norms/Expectations (Weakest link).

  **Risk:** The EAs or the Kantian might argue that economic interdependence is global. If "taxation" is coercion, and we are taxed by global markets or WTO rules, doesn't the duty go global?
  **Mitigation:** Be precise. Define coercion as **authoritative, territorial, and monopolistic.** Global markets are not a *state*. They do not claim the right to punish you personally for non-compliance in the same way a domestic legal system does. Keep the definition of coercion narrow (legal/territorial) to prevent scope creep.

  ### Summary of Strategic Concessions

  1.  **To the "Quiet Fear" (Residents):** Concede that duties extend to non-citizen residents. This saves the logic from contradiction.
  2.  **To the Kantian:** Concede these are *political* duties, not *moral simpliciter* duties. This saves the view from the "is/ought" charge.
  3.  **To the Communitarian:** Concede your view is "thin" and doesn't account for the *value* of community, only the *obligation*. This prevents a fight you can't win on phenomenological grounds.

  ### Final Advice for the Room
  *   **Watch the Kantian's hands.** If they start gesturing broadly, they are going universal. Interrupt gently: "I agree on universal humanitarian duties, but I am isolating *political* duties."
  *   **Don't let the EAs talk about "Death."** If they describe a dying child, you lose. Pivot immediately to "Structural Justice vs. Emergency Rescue."
  *   **The Communitarian is your friend, not your enemy.** He wants the conclusion to be true. If he attacks, he is attacking the *modern world*, not just you. Validate his worry ("It is cold") but stand on the necessity ("But it is necessary for pluralism").

  Good luck. The coercion account is defensible, but only if you keep the boundaries of "justice" and "coercion" tight.
