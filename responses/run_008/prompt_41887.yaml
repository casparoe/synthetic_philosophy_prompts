  **The Arithmetic of Dust**

  Add another life, and the sum increases.
  A life barely worth it counts same as any.
  Still, something goes wrong when the people are Many.

  Person-affecting says the duty releases.
  We count only those, not some potential any.
  Add another life, and the sum increases.

  A lexical wall breaks the sum into pieces.
  Great goods outweigh the small welfare in any.
  Still, something goes wrong when the people are Many.

  Trim back the heads till the average decreases.
  But the mean drops low for the last as the any.
  Add another life, and the sum increases.

  The logic returns and it never freezes.
  It traps every view, yours, mine, and any.
  Still, something goes wrong when the people are Many.

  Two truths stand together; neither one ceases.
  We weigh the deep life against the shallow any.
  Add another life, and the sum increases.
  Still, something goes wrong when the people are Many.

  ***

  **Author's Note**

  This poem stages the central tension of population ethics without attempting to resolve it. The middle stanzas gesture at three major "escape routes" from the Repugnant Conclusion, all of which remain contested within the field. Stanza two references the **person-affecting view**, which holds that we only have obligations to specific, existing people; this faces the non-identity problem, as future people cannot claim they were harmed by being brought into existence with lives worth living. Stanza three alludes to **lexical thresholds**, the idea that higher qualities of life cannot be outweighed by any quantity of lower welfare; critics argue this violates continuity principles in value theory. Stanza four touches on **averaging utilitarianism**, which maximizes welfare per capita rather than total welfare; this is often rejected because it implies adding a very happy person could lower the average and thus be wrong.

  Readers should note specific philosophical distinctions. The phrase "barely worth living" refers to lives containing net positive welfare, distinct from lives that are meaningless or unnoticed by others; the Repugnant Conclusion relies on the claim that these lives are still *good* for the people living them, however marginally. Furthermore, there is no consensus on the status of the conclusion itself. Some philosophers argue it refutes total utilitarianism; others argue it should be accepted as a counterintuitive but true result of beneficence; still others suggest it is an artifact of how we frame comparisons between different possible populations. In population axiology, almost nothing is settled. The open question remains whether any theory can satisfy all our intuitions about quantity, quality, and existence simultaneously. This poem preserves the contradiction because the field itself remains unresolved.
