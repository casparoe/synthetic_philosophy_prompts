          *   Camp A (Reductivists): Want to reduce Value to Reasons. WKR is fatal because it shows Reasons $\neq$ Value.
          *   Camp B (Non-Reductivists/Primitivists about Fittingness): Want to use Value to explain Reasons (or see Fittingness as sui generis). WKR is irrelevant because they don't claim all reasons for attitudes constitute value.
      *   **Why the Stalemate?** Because "Reason" is being asked to do too much work. If "Reason" is the fundamental normative currency, FA analysis tries to cash out Value in that currency. But WKR shows the currency is contaminated by pragmatic concerns.
