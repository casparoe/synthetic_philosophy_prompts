      *   **The Reasons Version:** $X$ is valuable iff there is sufficient reason to have attitude $A$ toward $X$.
      *   **The WKR Problem:** Demons/threats provide reasons to have attitudes toward worthless things. These are "wrong kind" reasons.
      *   **Standard Solutions:** Object-given vs. State-given reasons (Rabinowicz, Rønnow-Rasmussen); Reason for attitude vs. Reason to want to have attitude (Hieronymi); Hybrid views; Primitivism about fittingness.
