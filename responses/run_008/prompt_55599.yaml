      *   *Observation:* We call "barbarous" what is not in our use.
      *   *Case Study:* The Tupinambá (Brazilian indigenous people). They practice ritual cannibalism.
      *   *Re-framing:* It's not eating for nutrition; it's extreme revenge/warfare honor.
      *   *Comparison:* Europeans torture living bodies (religious wars, Inquisition) vs. eating dead bodies. Europeans are worse.
      *   *Standard:* There are "laws of Nature" that are universal, not just local customs. The Tupinambá align better with these natural laws (in some respects) than Europeans.
      *   *Goal:* To cure our prejudice by seeing the world through other eyes.

  3.  **Drafting the Translation (Psychometric Vocabulary):**
      *   *Concept:* "Barbarous" = DIF (Differential Item Functioning) or lack of Measurement Invariance. If an item (behavior) functions differently across groups, we label it error/noise ("barbarous") rather than valid signal.
      *   *Concept:* Reference Group Effect. We anchor our scale to our local population.
      *   *Concept:* Construct Validity. Is "cannibalism" measuring "cruelty"? Or is "torture" measuring "cruelty"? Montaigne argues the latent trait is "violation of natural law/humanity," and Europeans score higher on the latent trait despite lower scores on the manifest item "cannibalism."
      *   *Concept:* Bias Correction. Qualitative cognitive interviewing (hearing their frame) corrects the quantitative bias.
      *   *Concept:* Nature/Reason. This is the tricky part. In psychometrics, this is the "True Score" or the "Universal Construct" independent of group specific parameters.

  4.  **Developing the Residue Report:**
      *   *Clean:* Reference group bias, framing effects, the idea that local norms distort judgment.
      *   *Distorted:* "Nature/Reason." Psychometrics usually operationalizes constructs *within* models, not *outside* them. Montaigne posits an external criterion validity that isn't empirically derived from the data.
      *   *Missing:* The normative claim. Psychometrics describes measurement error; Montaigne prescribes moral truth.

  5.  **Addressing the Specific Focus (Nature/Reason vs. Anchor Groups):**
      *   Psychometrics: Validity is always relative to a model and a population (even if multi-group CFA is used). There is no "God's eye view" of the construct.
