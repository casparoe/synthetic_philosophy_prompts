answer: |-
  **Setting:** *A sterile laboratory. A glass cylinder sits on a pedestal, initially containing 10,000 grains of sand. A technician stands by with tweezers. Elias (Epistemicist) and Sarah (Supervaluationist) stand on opposite sides of the cylinder. The technician has removed 2,000 grains. The pile still looks unmistakably like a heap.*

  **Elias:** He's at 8,000. Still a heap.

  **Sarah:** Undeniably. In fact, it's *supertrue* that it's a heap. Every reasonable way of sharpening the predicate "heap" includes this configuration.

  **Elias:** "Supertrue." You make it sound like a special property. It's just true. The word "heap" applies, the object satisfies the conditions. There's a fact of the matter here.

  **Sarah:** There's a fact that the word is being used correctly, Elias. But there isn't a fact about the exact boundary. You're waiting for a miracle grain—the one whose removal turns "heap" to "non-heap." I'm telling you, that grain doesn't exist.

  **Elias:** It must exist. Classical logic holds. Bivalence holds. For any $n$, either "a pile of $n$ grains is a heap" is true or it is false. If you deny that, you're saying the world is fuzzy. But the world isn't fuzzy. The grains are discrete.

  **Sarah:** The grains are discrete. The *concept* is not. Look, if you insist on a sharp cutoff, tell me: where is it?

  **Elias:** I can't tell you. That's the point. It's unknowable.

  **Sarah:** *[Gestures to the technician]* So if I tell him to keep going until he hits the cutoff, he's on a wild goose chase.

  **Elias:** No, he's on a deterministic path. He *will* hit it. We just can't identify it epistemically. Think about vision. You can't tell the difference between a patch of red at wavelength 600nm and one at 600.0001nm. But there is a difference. Our discriminatory powers have a margin for error.

  **Sarah:** The margin-for-error principle. I know the script. "If you know $n$ is a heap, then $n-1$ must be a heap."

  **Elias:** Exactly. Knowledge requires safety. If I claim to know that 5,000 grains is a heap, but 4,999 is not, then my belief at 5,000 is too close to the falsehood to count as knowledge. So, the cutoff must lie beyond the reach of our knowledge. The sharp boundary exists to preserve logic; our ignorance exists to preserve the phenomenology of vagueness.

  **Sarah:** But you're buying that ignorance at too high a price. You're saying there is a metaphysical miracle happening at grain 4,327 (or whatever). One grain makes the difference between heap and non-heap. That violates the tolerance intuition. Small changes shouldn't change the category.

  **Elias:** Tolerance is false. It leads to contradiction. If small changes *never* changed the category, 10,000 grains would be the same as zero grains. Tolerance is a heuristic, not a law.

  **Sarah:** Tolerance is why we communicate! If I say "meet me near the heap," and you move one grain, you haven't violated my instruction. On my view, we preserve tolerance without contradiction. In the borderline region, "This is a heap" is neither true nor false. It's a gap.

  **Elias:** A gap is just a placeholder for "we don't know."

  **Sarah:** It's not! It's a truth-value gap. A sentence is *supertrue* only if it is true on all admissible precisifications. "8,000 grains is a heap" is supertrue because every admissible sharpening of "heap" counts 8,000 as a heap. "10 grains is a heap" is superfalse. But at 4,000? Some precisifications say yes, some say no. So it's indeterminate. Removing one grain in the borderline region never changes a supertrue statement to a superfalse one. It just moves you through the gap.

  **Elias:** *[The technician removes grain 5,000. The pile is smaller, conical.]* We're halfway. You still call this a heap?

  **Sarah:** I call it... borderline. It's not supertrue anymore. There are admissible precisifications where 5,000 is too sparse to be a heap.

  **Elias:** So if I ask you, "Is it a heap?" you won't answer?

  **Sarah:** I can't assert it. Asserting implies truth. I can say it's indeterminate.

  **Elias:** And that's where your view collapses. You say "admissible precisifications." Who decides what's admissible?

  **Sarah:** Linguistic practice. The rules of use.

  **Elias:** Are *those* rules precise? Is the boundary between "admissible" and "inadmissible" sharp?

  **Sarah:** *[Pauses]* Well... that boundary might be vague too.

  **Elias:** Aha. Higher-order vagueness. If the set of admissible precisifications is vaguely defined, then your "supertruth" is vague. And if you try to make *that* precise, you need a meta-set of admissible sets. You haven't eliminated sharp boundaries, Sarah. You've just relocated them into the semantics. You've hidden the knife in the definition of "admissible."

  **Sarah:** *[Nods slowly]* That's a fair hit. We do face a problem explaining higher-order vagueness without reintroducing a cutoff somewhere in the meta-language. But look at your position, Elias. You accept higher-order vagueness too.

  **Elias:** I don't need to. The boundary is sharp.

  **Sarah:** What about "definitely a heap"? Is there a difference between "heap" and "definitely heap"?

  **Elias:** Yes. "Definitely" is an epistemic operator. "Definitely P" means "We know P."

  **Sarah:** No, that reduces it to your ignorance. If "definitely" is just knowledge, then "heap" and "definitely heap" have different extensions only because we are ignorant. But suppose we were omniscient. Would "heap" and "definitely heap" coincide?

  **Elias:** If we were omniscient, we would know the cutoff.

  **Sarah:** But would the cutoff move? If "heap" is vague, there should be a region where it's not just unknown, but *indefinite* whether it applies. If you say there is a sharp boundary between "heap" and "non-heap," do you also have a sharp boundary between "heap" and "definitely heap"?

  **Elias:** I... concede that there must be a boundary there, too.

  **Sarah:** So you have a sharp boundary between the clear cases and the borderline cases?

  **Elias:** Yes. Somewhere, there is a grain $n$ where $n$ is a heap, but $n+1$ is not *definitely* a heap.

  **Sarah:** And you know where that is?

  **Elias:** No. It's unknowable, just like the first boundary.

  **Sarah:** Then you have the same problem I do! You're positing sharp boundaries for "definitely" that are just as inaccessible as the boundaries for "heap." You haven't explained why we can't know them; you've just asserted that we can't. My view explains the silence: there's nothing to know in the gap. Your view says there's a fact, but God hid it from us. That's a theological commitment, not a linguistic one.

  **Elias:** It's not theology, it's the cost of classical logic. If I accept gaps, I lose the Law of Excluded Middle. I can't say "Either it is a heap or it is not." I have to say "Either it is a heap, or it is not, or it is neither." That complicates mathematics, science, everything. I'd rather swallow one unknowable fact than rewrite logic.

  **Sarah:** And I'd rather rewrite the logic of truth than posit magic grains.

  **[The technician removes grain 3,000. The pile is now quite low, a shallow mound.]**

  **Technician:** Excuse me. The protocol requires me to log the state. Do I log "Heap: Yes" or "Heap: No"? Or do I wait for your signal?

  **Elias:** *[Immediately]* Log "Yes." It's still a heap.

  **Sarah:** Wait. Elias, look at it. It's barely a mound.

  **Elias:** It satisfies the condition. There is a number $k$ such that $k$ is a heap and $k-1$ is not. We are likely above $k$.

  **Sarah:** But we can't know that. If I tell him to log "Yes," and it turns out we were in the gap, he's asserting a falsehood. Or rather, he's asserting something that lacks a truth value.

  **Elias:** He's asserting a truth! You just don't know which one.

  **Sarah:** This is the practical crux, isn't it? If I'm right, forcing a binary choice is a category error. It's like asking "Is the present King of France bald?"

  **Elias:** It's not a category error. It's a measurement error. We lack the resolution. But the quantity exists. Sarah, if you tell him to log "Indeterminate," you're implying the world is incomplete. I'm saying the world is complete, and our map is blurry.

  **Sarah:** The map *is* the territory here. "Heap" is a linguistic construct. If the usage doesn't determine a truth value, then there is no truth value. Telling him to log "Indeterminate" respects the semantics of the term.

  **Elias:** And telling him to log "Yes" or "No" respects the logic of reality. But look... *[Elias rubs his temples]* I have to concede something.

  **Sarah:** Go on.

  **Elias:** If the boundary between "admissible" and "inadmissible" is vague, as you conceded, then your supertruth is vague. But if I concede that the boundary between "known" and "unknown" is also vague, then my sharp cutoff is... slippery.

  **Sarah:** And I have to concede that if I say "It is indeterminate," I am making a claim. Is *that* claim supertrue? "It is supertrue that this is indeterminate"? That sounds like I'm claiming precision about the imprecision.

  **Elias:** Exactly. You're claiming to know the boundaries of the gap. But if there's higher-order vagueness, you don't know where the gap starts either.

  **Sarah:** So we are both claiming knowledge of boundaries we say we can't locate. You locate the ontological boundary; I locate the semantic boundary.

  **Elias:** It seems the disagreement isn't about whether there are boundaries. It's about what kind of thing the boundary *is*.

  **Sarah:** Yes. Is the boundary a feature of the sand, or a feature of the word?

  **Elias:** I say the word picks out a precise property of the sand, even if we can't see the join.

  **Sarah:** I say the word *fails* to pick out a property in this region.

  **[The technician hovers over the pile. 2,500 grains remain.]**

  **Technician:** I need an instruction. Binary log or tertiary log?

  **Elias:** *[Looks at Sarah]* If you log "Indeterminate," you validate the idea that logic fails.

  **Sarah:** If you log "Yes," you validate the idea that a single grain constitutes a metaphysical difference.

  **Elias:** *[Sighs]* Log "Yes."

  **Sarah:** *[Simultaneously]* Log "Indeterminate."

  **[They look at each other. The technician looks confused.]**

  **Elias:** We can't both be right.

  **Sarah:** No. But notice what happens if we let him choose. If he chooses "Yes," he acts as if there is a fact. If he chooses "Indeterminate," he acts as if there is a gap. The experiment doesn't decide the metaphysics. The metaphysics decides the data.

  **Elias:** Then we stop the experiment.

  **Sarah:** Agreed.

  **Elias:** Because until we know whether "heap" is epistemically opaque or semantically gappy, the data is contaminated by our theory.

  **Sarah:** *[Turns to the technician]* Don't log the state. Log the *question*. Record that at 2,500 grains, the classification was contested.

  **Elias:** *[Nods]* That's the only honest datum. That at 2,500 grains, competent speakers diverge.

  **Sarah:** Which is exactly what my theory predicts.

  **Elias:** And exactly what mine explains as the margin of error in action.

  **Sarah:** So we agree on the phenomenon. We disagree on the explanation.

  **Elias:** And that explanation determines whether we tell the next technician to look harder, or to stop looking.

  **Sarah:** Precisely. You tell them to sharpen their instruments. I tell them to sharpen their definitions.

  **Elias:** *[Watching the technician put the tweezers down]* I still think there's a number.

  **Sarah:** *[Watching the same]* And I still think searching for it is a mistake.

  **Elias:** Then we're at an impasse.

  **Sarah:** Not an impasse. A boundary.

  **Elias:** Sharp?

  **Sarah:** *[Smiles faintly]* Let's not go there.
