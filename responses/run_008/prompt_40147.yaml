  7.  **Final Polish:**
      *   Ensure tone is analytical and philosophical.
      *   Check the "Hill/Wine/Face" elimination logic. The key is distinguishing *perceptual content* from *judgment* using bias-free measures.
      *   Check the Fodor/Siegel paragraph length.

      *(Self-Correction during drafting)*: I need to be careful about the "Perceptual Learning" distinction. Some argue learning *is* the mechanism of penetration. I should take a stand that for a *decisive test of synchronic penetration*, learning must be controlled for. I will mark this as Non-Negotiable for *this specific test*, acknowledging it excludes a broader definition.

      *(Refining the "Killer Requirement")*: It's not just "bias-free measures." It's specifically the **Dissociation of Perceptual Content from Response Bias and Attentional Allocation.** This hits the hill (action bias), wine (preference/judgment), and face (social judgment).

      *(Refining Fodor/Siegel)*: Fodor doesn't "satisfy" the list; the list validates his skepticism. Siegel tries to satisfy the list but often has to relax the "NN" methodological constraints. I will frame it that way.

