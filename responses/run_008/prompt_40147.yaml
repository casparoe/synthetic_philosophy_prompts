          *   Specify evidence types (bias-resistant, controls for cueing/task set).
          *   Take a stand on long-term perceptual learning (expertise).
          *   Include the rationale/case behind each requirement.
          *   Mark requirements as Non-Negotiable (NN) or Camp Prejudice (CP).
          *   Assess joint satisfiability (tension between control and ecological validity).
          *   Identify the single requirement that eliminates famous candidate cases (hill, wine, face).
          *   Compare Fodor-style modularist vs. Siegel-style epistemologist against the list (2 short paragraphs).
          *   Judge who pays the higher price.

  2.  **Deconstruct Cognitive Penetration (CP):**
      *   *Definition:* The thesis that cognitive states (beliefs, desires, etc.) can causally influence perceptual experience in a way that changes the *content* of that experience, not just downstream processing.
      *   *The Problem:* It's hard to distinguish perceptual change from attentional bias, response bias, or post-perceptual judgment.
      *   *Key Debate:* Firestone & Scholl (skeptics) vs. Siegel, Lupyan, et al. (proponents).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: The Cause (Cognitive State).* Needs to be high-level, not just sensory priming.
          *   *Eligible:* Momentary beliefs, standing desires, acquired categories.
          *   *Ineligible:* Low-level priming, mere semantic activation without belief/desire.
          *   *Rationale:* To be "cognitive," it must be propositional or evaluative, not just associative.
          *   *Status:* NN (otherwise it's just priming).

      *   *Requirement 2: The Effect (Perceptual Content).* Needs to be phenomenology, not behavior.
          *   *Eligible:* Changes in apparent size, color, slant, similarity.
          *   *Ineligible:* Changes in reaction time, accuracy (unless linked to phenomenology), memory recall.
          *   *Rationale:* CP is about *experience*, not performance.
          *   *Status:* NN.

      *   *Requirement 3: Methodological Rigor (Bias).*
          *   *Evidence:* 2AFC (Two-Alternative Forced Choice) with bias corrections, physiological measures (ERP/fMRI early components), indirect measures.
          *   *Controls:* Cueing controls (is it just attention?), task-set controls.
          *   *Rationale:* Firestone & Scholl's main critique is demand characteristics and response bias.
          *   *Status:* NN.

      *   *Requirement 4: Perceptual Learning vs. Penetration.*
          *   *Stand:* Expertise (radiologist) is *not* CP. It's plasticity of the module, not top-down intrusion during processing.
          *   *Rationale:* CP implies a synchronic influence of a *current* cognitive state on a *fixed* system. Learning changes the system itself.
          *   *Status:* Camp Prejudice (Pro-CP might argue learning *is* accumulated penetration, but standard view distinguishes them). Let's mark this carefully. Actually, most serious debates distinguish synchronic penetration from diachronic plasticity. I will mark it NN for a *decisive* test of *synchronic* penetration, but acknowledge the distinction.

      *   *Requirement 5: Ecological Validity vs. Control.*
          *   *Tension:* High control (psychophysics) often kills the phenomenon (too artificial). High ecology (real world) introduces confounds.
          *   *Verdict:* Jointly unsatisfiable to maximize both. Must prioritize control for a *decisive* test.

      *   *The "Killer" Requirement:* Which one kills the hill/wine/face cases?
          *   *Hill (Proffitt):* Often attributed to action-specific perception or response bias.
          *   *Wine (Plassmann):* Likely reward/judgment, not taste qualia.
          *   *Face (Trust):* Likely post-perceptual judgment.
          *   *Candidate:* The requirement distinguishing *Perceptual Content* from *Post-Perceptual Judgment/Attention*. Specifically, the requirement for **bias-free measures of phenomenology that rule out response bias and attentional cueing.** Firestone & Scholl argue almost all cases fail this.

  4.  **Refining the Desiderata List:**
      *   Make sure to explicitly list eligible/ineligible states and effects.
