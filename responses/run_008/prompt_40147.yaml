answer: |-
  ### Desiderata for a Decisive Test of Cognitive Penetration

  **1. The Causal Origin Requirement**
  *   **Statement:** The putative cause must be a high-level cognitive state with propositional or evaluative content, distinct from low-level semantic priming or sensory adaptation.
  *   **Eligible Candidates:** Momentary beliefs (e.g., "this object is heavy"), standing desires (e.g., thirst), acquired semantic categories (e.g., "this is a dog").
  *   **Ineligible Candidates:** Low-level sensory priming, mere semantic association without belief endorsement, the state of the body (unless mediated by a cognitive appraisal of that state).
  *   **Rationale:** To count as *cognitive* penetration, the influence must originate in the "central" system (thinking/reasoning), not merely within the sensory-perceptual pipeline.
  *   **Status:** **Non-Negotiable.** Without this, the phenomenon collapses into associative priming.

  **2. The Phenomenal Content Requirement**
  *   **Statement:** The effect must be a change in the *phenomenal character* or *representational content* of the perceptual experience itself, not a change in downstream processing.
  *   **Eligible Effects:** Changes in apparent size, color, slant, similarity, or grouping experienced *during* perception.
  *   **Ineligible Effects:** Changes in reaction time, accuracy, memory recall, post-perceptual judgment, or attentional allocation (selection of location/feature).
  *   **Rationale:** CP claims cognition changes *what it is like* to see, not just how one acts on or remembers what is seen.
  *   **Status:** **Non-Negotiable.** This distinguishes perception from attention and judgment.

  **3. The Methodological Purity Requirement**
  *   **Statement:** Evidence must derive from measures resistant to response bias, demand characteristics, and task-set confounds.
  *   **Evidence Types:** Two-Alternative Forced Choice (2AFC) with bias correction, physiological markers of early perceptual processing (e.g., C1/P1 ERP components), or indirect behavioral measures (e.g., saccadic latency) that do not rely on subjective report.
  *   **Controls:** Must include control conditions for mere cueing (attention) and response bias (criterion shift).
  *   **Rationale:** Subjects often report what they think is expected or bias their responses based on belief, mimicking perceptual change without actual phenomenological shift.
  *   **Status:** **Non-Negotiable.** This is the primary vector of skepticism (e.g., Firestone & Scholl).

  **4. The Synchronicity Requirement (Perceptual Learning)**
  *   **Statement:** Long-term perceptual learning (expertise) does not count as cognitive penetration for the purposes of this test.
  *   **Stand:** The radiologist seeing the tumor is a case of *plasticity* (the module itself changed), not *penetration* (a current cognitive state intruding on a fixed module).
  *   **Rationale:** CP is a claim about the architectural permeability of the mind *now*, not its malleability over time. Conflating the two obscures the epistemic stakes of immediate justification.
  *   **Status:** **Camp Prejudice.** Proponents of "diachronic penetration" may object, but for a decisive test of the standard thesis, synchronicity is required.

  **5. The Tension: Control vs. Ecological Validity**
  *   **Assessment:** There is a genuine tension between Requirement 3 (Methodological Purity) and the desire for ecological validity. Strict psychophysical controls often strip away the context in which cognitive states naturally influence perception (e.g., isolating a belief about a hill's slant from the actual intent to climb it).
  *   **Verdict on Satisfiability:** These are **jointly unsatisfiable** at their maxima. A decisive test must prioritize Methodological Purity over Ecological Validity. If the phenomenon cannot survive the sterile lab, it cannot be distinguished from confounds in the wild.

  ***

  ### The Single Eliminating Requirement

  The requirement that does the most to eliminate the famous candidate cases is **Requirement 3 (Methodological Purity), specifically the mandate to rule out response bias and attentional cueing.**

  *   **The Hill:** The fatigued hiker's estimate of slant is eliminated because when tested with bias-free visual matching rather than verbal estimation or action-based measures, the effect often disappears or is explained by response bias.
  *   **The Wine:** The expensive-labeled wine tasting better is eliminated because blind taste tests with physiological measures (gustatory ERP) often show no difference in sensory processing, only in reward-center activation (post-perceptual valuation).
  *   **The Face:** The untrustworthy face looking hostile is eliminated because similarity judgments often reveal no change in perceptual representation once attentional cueing and criterion shifts are controlled; the change is in the *judgment* of the face, not the *seeing* of it.

  ***

  ### Assessment: Fodor vs. Siegel

  A Fodor-style modularist fares robustly against this list, primarily because the list's Non-Negotiable requirements align with his architectural constraints. Fodor satisfies the Methodological Purity and Synchronicity requirements by denying the phenomenon exists; he argues that when controls are tight, penetration vanishes. However, he satisfies the Phenomenal Content requirement only by weakening it to a null hypothesis, effectively dismissing strong phenomenological intuitions as illusory. His price is theoretical rigidity: he must explain away the persistent subjective sense that belief alters experience, treating robust phenomenological reports as systematic errors.

  A Siegel-style epistemologist fares better on Phenomenal Content and Causal Origin, taking the subjective experience and high-level cognitive causes seriously. However, she pays a higher price against this list. To maintain her thesis, she must often weaken the Methodological Purity requirement, accepting evidence (like verbal estimates or ecological tasks) that skeptics argue is contaminated by response bias. While Fodor risks ignoring data, Siegel risks accepting confounds. In the context of a *decisive test*, Siegel pays the higher price because her position relies on evidence that frequently fails the Non-Negotiable control conditions, whereas Fodor's position is bolstered by the very strictures that make the test decisive.
