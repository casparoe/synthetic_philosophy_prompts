      *   *Hobsbawm:* "Invented Tradition" refers to specific rituals/practices inculcating values/norms via repetition. He explicitly distinguishes between "custom" (flexible, old) and "Tradition" (invariant, often recent). He does *not* say *all* traditions are invented. He focuses on the late 19th/early 20th century (Europe). He is a Marxist historian but doesn't necessarily argue nationalism vanishes just because it's invented (functionalism).
      *   *Comparison:* They are often taught together, but Anderson is more cultural/anthropological, Hobsbawm more socio-political/Marxist. They agree nationalism is modern, but differ on mechanisms.
