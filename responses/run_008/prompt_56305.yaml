  *   **Fundamental description** → **Node 4**

  **Node 3:** Consider a universe in equilibrium for all eternity, disturbed only by rare fluctuations: could beings in such a universe find themselves anywhere except on the shallow side of a dip in the entropy curve?
  *   **Yes (We are fluctuations)** → **Leaf 2**
  *   **No (Direction is cognitive only)** → **Leaf 3**

  **Node 4:** Is the low-entropy past a brute boundary condition that needs no further explanation, or something that calls for one?
  *   **Brute (No explanation needed)** → **Leaf 4**
  *   **Calls for one** → **Node 5**

  **Node 5:** If it calls for one, may the explanation come from cosmology — the smoothness of the early universe, gravitational entropy, black-hole horizons — or should the low-entropy past itself instead be promoted to something lawlike, absorbed into the package of laws in the manner Humeans treat the mosaic?
  *   **Cosmology** → **Leaf 5**
  *   **Lawlike** → **Leaf 6**

  ***

  ### The Positions (Leaves)

  **Leaf 1: Radiation-Arrow Priority**
  *   **Most awkward commitment:** Requires a global absorber condition that seems conspiratorial.
  *   **Concrete case:** Two lamps and a mirror where light refuses to converge.

  **Leaf 2: Boltzmann-Fluctuation Perspectival**
  *   **Most awkward commitment:** Implies we are likely momentary hallucinations rather than evolved beings.
  *   **Concrete case:** A universe in equilibrium for all eternity where coffee reheats itself merely by chance.

  **Leaf 3: Anthropocentric/Deflationary**
  *   **Most awkward commitment:** Denies physical reality to the difference between a breaking and unbreaking egg.
  *   **Concrete case:** The direction is not out there in the world at all, but only in our memory records.

  **Leaf 4: Brute-Fact/Positivist**
  *   **Most awkward commitment:** Accepts a massive coincidence without inquiry.
  *   **Concrete case:** The smoothness of the early universe is simply where the story starts.

  **Leaf 5: Cosmological-Explanation**
  *   **Most awkward commitment:** Relies on speculative gravity theories not yet confirmed.
  *   **Concrete case:** Gravitational entropy and black-hole horizons dictate the initial smoothness.

  **Leaf 6: Past-Hypothesis-as-Law**
  *   **Most awkward commitment:** Treats a single boundary condition as a law of nature.
  *   **Concrete case:** The low-entropy past is absorbed into the package of laws in the manner Humeans treat the mosaic.

  ***

  ### Structural Analysis

  **Unseparable Pair:**
  The tree cannot genuinely separate **Leaf 4 (Brute-Fact/Positivist)** and **Leaf 6 (Past-Hypothesis-as-Law)**. Both positions accept the exact same physical mosaic—a universe with a low-entropy boundary condition—and differ only on the metaphysical categorisation of that condition (whether it counts as a 'law' or a 'brute fact'). Empirically, they predict identical observations.

  **Unoccupied Combination:**
  There is no position occupying **Node 1 (Yes: Radiation is prior)** combined with **Node 2 (Fact about us: Direction is not fundamental)**.
  *   **Diagnosis:** Incoherent. If the radiation asymmetry is fundamental and prior to thermodynamics, the arrow of time is a mind-independent feature of the physical world. This directly contradicts the claim that the direction is merely a fact about us or our perspective.

  ***

  ### Confidence Statement

  I am moderately confident in the taxonomy regarding the status of the Past Hypothesis (Nodes 4 and 5), as this maps cleanly onto the contemporary literature distinguishing dynamical cosmologists from Humean best-system analysts. However, I am less confident in the initial split regarding radiation (Node 1); while historically significant via the Wheeler-Feynman absorber programme, few modern realists treat the radiation arrow as truly fundamental rather than derivative of thermodynamics or cosmology. The point I am least sure of is whether the radiation asymmetry can really bear the weight of an independent node, as it may collapse into the cosmological explanation branch upon closer inspection.

  Summary: The tree turns on whether the arrow of time is a mind-independent feature requiring a physical origin or a perspectival artifact arising from our location within a gradient.
