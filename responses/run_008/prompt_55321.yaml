      *   *Interpretation:* The *team* owes the money. If the team loses, the team loses points. If the team wins, the *current bidder* gets the prize. This creates a "Moral Hazard" + "Reputation" mix.
      *   *Let's refine Round 3:* Two Teams (7 vs 7). One representative sits in the chair. They bid using Team Points. If they lose, Team loses points. If they win, *Representative* gets a personal prize. This isolates "Risk with Other's Money" + "Personal Glory."
