answer: |-
  Here is a complete design for a 45-minute session. It is tight, so you need to be a strict timekeeper.

  # Activity: "The Hot Seat Auction"

  **Goal:** Prove that escalation persists even when the mathematical justification (sunk costs) is removed.
  **Players:** 14 total (2 Active Bidders, 12 Observers/Shareholders).
  **Currency:** "Club Chips" (poker chips, slips of paper, or whiteboard tally).
  **Prize:** One $20 Gift Card (or equivalent stash of candy). Value = **10 Chips**.
  **Constraint:** **10-Second Bid Clock.** Use a phone timer. If a bidder doesn't speak in 10 seconds, they fold.

  ---

  ## The Setup (5 Minutes)
  1.  **The Prize:** Put the $20 card on the table. State clearly: *"This is worth 10 Chips to you."*
  2.  **The Endowment:** Give every student 20 Chips.
  3.  **The Rule:** This is an **All-Pay Auction**.
      *   Highest bidder gets the Prize.
      *   **Everyone** pays their final bid amount (winner and loser).
      *   If you bid 15 Chips and lose, you have -15 Chips.
  4.  **The Twist:** Tell them there will be 3 Rounds. The rules change every round. They must keep their Chips across rounds (cumulative score). Top 3 Chip holders at the end get a candy bar.

  ---

  ## Round 1: The Trap (Baseline)
  **Time:** 10 Minutes
  **Mechanic:** Standard All-Pay Auction.
  **Rules:**
  *   Two volunteers sit in the "Hot Seats" at the front.
  *   Bidding starts at 1 Chip. Increments of 1.
  *   Both players pay their final bid.
  *   **Psychological Drivers:** Sunk Costs + Competition + Face.

  **What will happen:**
  Bidding will pass 10 Chips (the value of the prize). Once it passes 10, both players are losing money no matter what. They will escalate to minimize the loss of the *previous* bids.
  *   *Stop the round* when bids hit ~25-30 Chips or one player visibly crumples.

  ---

  ## Round 2: The Rebate (Removing Sunk Costs)
  **Time:** 10 Minutes
  **Mechanic:** Loser Refund.
  **Rules:**
  *   Two *new* volunteers (do not use Round 1 players yet).
  *   **The Change:** If you lose, **you get your Chips back.** Only the winner pays their bid.
  *   *Mathematically:* There is zero cost to losing. There is no sunk cost.
  *   **Psychological Drivers:** Pure Competitive Arousal / "Winning" as the utility.

  **What will happen:**
  Students will realize losing is free. They should theoretically bid up to 10 Chips (the value of the prize) and stop.
  *   *The Trap:* They will likely bid **over 10 Chips**.
  *   *Why:* Because the goal shifts from "Maximize Profit" to "Crush the Opponent." If I bid 12 and win, I pay 12 for a 10-chip prize (Net -2). But I *beat* you. If I bid 12 and lose, I pay 0.
  *   *Observation:* Watch if they escalate past 10. If they do, it proves escalation isn't just about recovering losses; it's about dominance.

  ---

  ## Round 3: The Inheritance (Removing Personal Ownership)
  **Time:** 10 Minutes
  **Mechanic:** Mid-Auction Swap.
  **Rules:**
  *   Start with two new volunteers.
  *   Let bidding reach **8 Chips vs 9 Chips**. (Do not let them finish).
  *   **The Change:** Yell **"TAG OUT!"**
  *   The two bidders must stand up. Two *new* people from the audience must sit in the Hot Seats immediately.
  *   **The Kicker:** The new bidders **inherit the current bid liability.**
      *   If New Bidder A wants to stay in, they are currently "losing" at 8 Chips. To bid, they must go to 10.
      *   If they fold, the *Previous Bidder's* chips are deducted from the *New Bidder's* score (symbolically).
      *   *Simpler version:* The New Bidders are playing for the *Club's* Chips, but if they win, *they* get the personal Candy/Prize.
      *   *Best version for your prompt:* The debt is attached to the **Chair**, not the person. If you sit in the Chair, you owe the current high bid if you quit. You didn't spend the money, but you are responsible for the hole.

  **Psychological Drivers:** Reputation / Agency / "Not Looking Like a Quitter."
  **What will happen:**
  New bidders often feel social pressure to "finish the fight" rather than look weak by folding immediately, even though the hole wasn't their fault. They escalate to validate the previous bidder's decisions.

  ---

  ## The Debrief (10 Minutes)
  *Do not let them leave until you map the rounds.*

  **1. Map Round 1 to Sunk Cost Fallacy.**
  *   *Ask:* "At what point did you realize you were losing money no matter what?"
  *   *Point:* "You kept bidding to save the money you already spent. That is the classic definition."

  **2. Map Round 2 to Competitive Arousal.**
  *   *Ask:* "In Round 2, losing was free. Why did anyone bid over 10 Chips?"
  *   *Point:* "There was no math reason to escalate. You escalated because **winning felt better than being rich.** The utility of 'beating him' was worth more than the utility of the Chips."

  **3. Map Round 3 to Reputation & Agency.**
  *   *Ask (to the Tag-Out bidders):* "That hole wasn't yours. Why didn't you just fold?"
  *   *Point:* "You were escalating to protect your **identity**. Folding looks like weakness. You were paying to avoid the social cost of looking like a quitter."

  **4. The Takeaway.**
  *   "We think we escalate because of bad math (Sunk Costs). This game shows we escalate because of **bad psychology** (Ego, Competition, Reputation). Even when we fix the math, the behavior survives."

  ---

  ## Predictable Arguments ("Doesn't Count")

  **1. "Round 2 was fake risk."**
  *   *The Argument:* "I bid 15 Chips in Round 2 because it didn't matter. If I lost, I got refunded. So it doesn't prove I'm irrational."
  *   *The Counter:* "If it didn't matter, why didn't you bid 100? Why did you stop? You stopped because it *did* cost you something: it cost you the chance to be the smart one who didn't overpay. You were still managing your image."

  **2. "Round 3 was coerced."**
  *   *The Argument:* "I had to bid because you made me sit down."
  *   *The Counter:* "I didn't make you bid. I made you sit. You could have folded immediately and taken the hit. You chose to bid to try to win. That choice is where the escalation lives."

  ---

  ## What Will Go Wrong (First Run Pitfalls)

  **1. Collusion (The "Smart" Move)**
  *   *Risk:* Two friends volunteer. They agree beforehand to bid 1 Chip and 2 Chips, split the prize, and minimize loss.
  *   *Fix:* **Ban talking.** If bidders communicate during the round, they are disqualified and lose 5 Chips. Also, pick volunteers who don't know each other well.

  **2. The "Rational" Quitter**
  *   *Risk:* In Round 1, someone bids 1, the other bids 2, and the first person folds immediately. The game ends in 30 seconds. No escalation happens.
  *   *Fix:* You need **aggressive volunteers**. Before the meeting, ask one friend to volunteer for Round 1 and instruct them to be stubborn. You need a "foil" to ensure the bidding actually escalates so the class has something to watch.

  **3. Time Creep**
  *   *Risk:* Bidding drags on. 45 minutes will vanish.
  *   *Fix:* **Enforce the 10-Second Clock.** Count down out loud: "10, 9, 8..." If they don't speak, they are out. No extensions. This pressure *causes* the psychological escalation you want to study.

  **4. Chip Accounting Chaos**
  *   *Risk:* You spend 10 minutes calculating who owes what.
  *   *Fix:* Have a designated "Banker" (a student not bidding) to track scores on the whiteboard. Do not do it yourself.

  ## Materials Checklist
  *   1 Prize ($20 Card or Candy Stash).
  *   ~300 "Chips" (slips of paper work fine).
  *   Whiteboard (for tracking bids and scores).
  *   Phone Timer (for the 10-second clock).
  *   2 Chairs at the front (The "Hot Seats").

  This design forces them to feel the escalation physically (the timer pressure) and intellectually (the rule changes), making the debrief land much harder than a standard Dollar Auction.
