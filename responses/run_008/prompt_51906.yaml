          *   Social Intuitionist Model: Moral reasoning is post-hoc rationalization (press secretary).
          *   Conclusion: Cross-partisan debate is pointless ("morality binds and blinds," "running different software").
      *   **User's Skepticism:** The "no point debating" conclusion feels like a cop-out. Wants to know what's accurate psychology vs. spin.
      *   **Key Questions:**
          *   What would a psychologist accept vs. reject?
          *   Is the "conservatives perceive more" claim a finding or a spin?
          *   Does descriptive theory (how we judge) imply normative truth (who is right)?
