      *   *Refining the "Debate" point:* If reasoning is post-hoc, why debate? Because the *audience* matters. We debate to sway the crowd, not just the opponent. Also, exposure to reasoning can slowly shift the opponent's intuition.
      *   *Addressing the "Cop-out":* Why does it feel like a cop-out? Because it absolves us of the hard work of democracy. I should validate that feeling.

  5.  **Final Review against User Prompt:**
