  9.  (Final Polish): Ensure the distinction between *Risk* (known dist) and *Uncertainty* (unknown dist) is clear in the context of the proposed solution. Make sure to address the Ramsey/Keynes specific point.

  *(Self-Correction)*: I need to be careful about saying (1) vs (4) leads to bankruptcy. Technically, it leads to being money-pumped *if* someone knows your preferences and can structure the bets. In insurance, the "market" can do this. It's a valid risk.
