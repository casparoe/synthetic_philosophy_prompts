      *   **The Friend's Position:** Argues IT is just garden-variety Underdetermination of Theory by Evidence (UTE), similar to physics. Claims that if you push physics hard enough, it also lacks a fact of the matter. Thinks Quine's distinction between translation (transcendent) and physics (immanent) is unargued assertion.
      *   **The User's Diagnosis:** Suspects the Davidson (Charity) and Chomsky (It's just UTE) objections miss the core point. Wonders if the debate is structurally doomed because Quine's premise (translation holism > physics holism) begs the question.
