answer: |-
  This is an exceptionally sophisticated problem for a Year 13 EPQ. Your partner has effectively reconstructed a version of a *Sorites Paradox* applied to mereology (the study of parts and wholes) and dispositional metaphysics. In professional philosophy, this touches on debates surrounding David Lewis's analysis of dispositions, the "Problem of Many," and the distinction between intrinsic and extrinsic properties.

  You are right to be worried. If her conclusion holds, dispositional language becomes meaningless. However, you do not necessarily need to sacrifice Premise (1) (Intrinsicality) just yet. There is a flaw in the reasoning *between* the premises, specifically in how the argument handles the boundaries of objects.

  Here is a breakdown of where the argument goes wrong, why it looks harmless, and the costs of the alternative solution (rejecting Intrinsicality).

  ### 1. Where the Argument Fails: Steps (5) and (6)

  The most defensible place to block the argument is not at Premise (1), but at the inference from **(4) to (5)** and **(5) to (6)**.

  **The Flaw in Step (5): The Limit Case**
  Your partner argues: *"A solid glass brick is simply the limit of this process — layer upon layer of the same stuff... with no glass 'inside'."*

  This looks harmless because it relies on **vagueness**. If one layer of glass is a mask, and two layers are a mask, surely 1,000 layers are just a thick mask?
  However, this commits a category error. A "mask" is defined as something *external* to the object's intrinsic nature that prevents manifestation.
  *   If you wrap a glass in bubble wrap, the wrap is *different* from the glass.
  *   If you coat the glass in more glass, you are not adding a mask; you are **making a larger object of the same kind**.

  A solid glass brick is not a "fragile core + masks." It is a homogeneous object whose fragility is grounded in the microstructure of the *entire* brick. The "mask" analogy breaks down when the masking material is identical to the core material. At some point in the iteration, you stop adding "masks" and start adding "parts of the object." The argument hides this ontological shift by treating it as a smooth continuum.

  **The Flaw in Step (6): The Mereological Fallacy**
  This is the fatal error. Your partner argues: *"Entomb a wine glass in the pier of a Victorian railway bridge and the whole bridge becomes fragile."*

  This is a **Mereological Fallacy** (confusing the properties of a part with the properties of the whole).
  *   **Example:** A car contains a radio. The radio is fragile. Does it follow that *the car* is fragile? No. If you strike the car with a hammer, the radio might break, but the car (as a vehicle) does not "break" in the way a fragile object does.
  *   **Example:** A human body contains billions of cells that are susceptible to radiation. Does it follow that the human is "radio-active" in the sense of emitting radiation? No.

  Dispositions like fragility and solubility are **structural properties**. They depend on how the material is arranged. A steel girder has a crystalline structure that resists breaking. Embedding a fragile grain of salt inside it does not change the steel's structure. Therefore, the *girder* does not inherit the *salt's* disposition.

  **Why it looked harmless:**
  It looked harmless because we often speak loosely. We say "The bridge is dangerous" because it contains a weak point. But in metaphysics, we must distinguish between *containing a fragile part* and *being a fragile whole*. Your partner's argument exploits this linguistic looseness to force a logical contradiction.

  ### 2. The Alternative: Rejecting Premise (1) (Intrinsicality)

  You mentioned you would sooner abandon (1) than accept the conclusion. This is a valid philosophical position (held by philosophers like C.B. Martin and John Heil), but you need to understand the "cost" for your EPQ evaluation.

  **What rejecting (1) means:**
  If fragility is **not intrinsic**, it is **extrinsic** (or relational). This means an object is not fragile *in itself*, but only fragile *relative to an environment*.
  *   **The View:** To say "Glass is fragile" is shorthand for "Glass has a structure that *would* break *if* it were in a world without protective masks."
  *   **The Benefit:** It solves the masking problem instantly. If you put bubble wrap on the glass, you have changed the relational context. The "disposition" is not a property of the glass alone, but of the *glass-plus-environment* system.

  **The Cost (Why philosophers resist this):**
  1.  **Scientific Instability:** Science relies on properties being stable. If solubility is extrinsic, then salt isn't *really* soluble; it's only soluble-in-water-without-a-coating. This makes the laws of nature context-dependent. It becomes harder to explain *why* salt dissolves if the property isn't "in" the salt.
  2.  **Causal Power:** We usually think dispositions explain *why* things happen. "The glass broke because it was fragile." If fragility is extrinsic, the explanation becomes: "The glass broke because it was fragile-in-this-environment." This feels circular. We want the cause to be inside the object.
  3.  **The "Fink" Problem Returns:** If dispositions are extrinsic, you become vulnerable to "Finks" (where the disposition is removed before manifestation). If the property depends on the environment, and the environment changes instantly, does the object lose the property instantly? This makes properties very "flaky."

  ### 3. Recommendation for Your EPQ

  For a Year 13 EPQ, the most rigorous path is to **defend Intrinsicality (1)** but **reject the Mereological Inference (6)**.

  Here is how you can structure this section:

  1.  **Present the Partner's Challenge:** Acknowledge it as a powerful *reductio ad absurdum*. It shows that the "Simple Conditional Analysis" + "Intrinsicality" + "Naive Mereology" are inconsistent.
  2.  **Diagnose the Error:** Explain the Mereological Fallacy. Use the "Car Radio" or "Salt in Steel" analogy. Argue that dispositions belong to *homogeneous materials* or *functional wholes*, not to arbitrary sums of parts.
      *   *Key Phrase:* "Dispositions are grounded in microstructure. Adding a non-fragile shell changes the microstructure of the *whole*, even if the *core* remains fragile."
  3.  **Evaluate the "Intrinsicality" Option:** Discuss what would happen if you *did* choose to drop Premise (1).
      *   *Pros:* Solves masking easily.
      *   *Cons:* Makes scientific properties unstable; clashes with realism.
  4.  **Conclusion:** Argue that we should keep dispositions as intrinsic properties of *materials*, not arbitrary objects. A "glass-in-bubble-wrap" is a composite object. The *glass* is fragile (intrinsic). The *composite* is not. The partner's error is assuming the composite inherits the disposition of the part.

  ### Summary for your Project

  *   **Don't give up (1) yet.** It is the standard scientific view.
  *   **Attack Step (6).** The property of a part does not transfer to the whole. A bridge containing glass is not fragile; it *contains* a fragile part.
  *   **Attack Step (5).** A solid brick is not a "masked core." It is a homogeneous object. The "mask" concept only applies when the outer layer is distinct from the inner nature.
  *   **The "Cost" of dropping (1):** If you do mention it, state clearly that it turns dispositions into relations rather than properties, which complicates our understanding of causal laws in chemistry and physics.

  Your partner's argument is excellent because it forces you to define **what an object is**. That is a perfect depth for an EPQ. You aren't just talking about salt; you are talking about the boundaries of identity. Good luck!
