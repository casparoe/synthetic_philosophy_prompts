      *   *Alternative:* Keep (1), but refine the definition of "Mask." A mask must be *extrinsic*. If you coat the glass in glass, you aren't adding a mask; you are making a bigger glass. If you coat it in steel, you are making a composite object. The disposition of the *composite* is not the disposition of the *part*.
