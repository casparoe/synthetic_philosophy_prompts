          *   "Credence = Price at which you'd trade infinitesimal units."
          *   "Willingness to bet scales with edge and bankroll (Kelly)."
          *   "Refusal of large bets is rational; refusal of small bets is epistemic failure."
      *   **Conclusion:** Summarize the load-bearing parts.

  8.  **Refining the Argument (Self-Correction during drafting):**

      *   *Check:* Did I explain *why* Dutch Book requires risk neutrality? Yes, because it relies on linear combinations of bets. If utility is curved, the sum of utilities $\neq$ utility of sums.
      *   *Check:* Is the Kelly point clear? Kelly says don't bet at *fair* odds (EV=0). You only bet at *favorable* odds. So if I say 70%, and you offer me a bet at 70% odds, Kelly says "Don't bet." The LW norm says "Be willing to take either side."
      *   *Nuance:* The LW norm is often "State a number you'd defend." If I say 70%, I should be willing to take the "Yes" side at 60% odds and the "No" side at 80% odds. At exactly 70%, I am indifferent.
      *   *Crucial Distinction:* Indifference vs. Willingness. A risk-neutral agent is willing to bet any amount at fair odds (EV=0). A risk-averse agent bets 0 at fair odds.
      *   *So the norm implicitly demands risk neutrality for the sake of the measurement.* It asks you to pretend you are risk-neutral to reveal your true probability.
      *   *Wait, one more thing:* The "Shut Up and Multiply" culture. LW often encourages acting *as if* risk-neutral for small stakes to overcome loss aversion biases. This is a heuristic, not a strict utility claim.

