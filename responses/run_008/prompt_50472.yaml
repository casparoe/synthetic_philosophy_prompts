answer: |-
  This is an excellent dissection of a core rationalist shibboleth. You have identified the exact friction points where the community's *epistemic* norms (how we measure belief) collide with its *instrumental* norms (how we survive and grow wealth).

  Here is the reconstruction of the implicit theory, an analysis of its coherence, and a proposal for the corrected norm.

  ### 1. The Implicit Theory of Rationality

  The "bet your credence" norm rests on a specific, often unstated, philosophical framework. It is a blend of **Operationalist Bayesianism** and **Local Risk Neutrality**.

  **A. Operationalism (The Meaning of Probability)**
  The norm assumes that a probability statement has no meaning apart from the actions it licenses. This traces back to de Finetti and Savage: a probability *is* a betting price. If you claim $P(H) = 0.7$ but refuse to buy a ticket paying \$1 if $H$ for \$0.69, your statement is semantically empty. The norm treats betting not as a way to get rich, but as a **measurement device** for internal states.

  **B. Local Risk Neutrality**
  This is the load-bearing assumption you spotted. Dutch Book arguments strictly require that utility be linear in the stakes being wagered. If $U(\$x) = x$, then maximizing Expected Value (EV) is equivalent to maximizing Expected Utility (EU).
  The norm implicitly asks agents to **pretend to be risk-neutral** over the domain of the bet. It assumes that the utility cost of losing the stake is exactly proportional to the utility gain of winning it.

  **C. Epistemic/Instrumental Separation**
  The community practice assumes you can decouple "testing your calibration" from "managing your portfolio." It treats the bet as a **calibration tax** or a **truth-seeking mechanism**, distinct from wealth accumulation. The goal of the bet is to force honesty, not to maximize geometric growth.

  ### 2. Is It Coherent? (The Kelly Tension)

  **Short Answer:** No, not as commonly practiced. It is only coherent under a specific constraint: **Infinitesimal Stakes.**

  **The Conflict:**
  *   **Dutch Book / Credence Norm:** Requires risk neutrality. If odds are fair (matching your credence), a risk-neutral agent is indifferent to any stake size. If odds are favorable, they bet everything.
  *   **Kelly Criterion:** Requires risk aversion (specifically logarithmic utility of wealth). If odds are fair (EV = 0), a Kelly bettor bets **zero**. If odds are favorable, they bet a fraction.

  **The Resolution:**
  The tension dissolves if you interpret the credence norm as applying to the **margin**.
  *   **Credence** defines the *price* at which you are indifferent to a *marginal* dollar.
  *   **Kelly** defines the *volume* you should trade at that price given your bankroll and edge.

  If you say "I'm 70%," and I offer you a bet at 70:30 odds (fair price), a Kelly bettor correctly refuses *any* volume. A risk-neutral agent is indifferent.
  However, if I offer 60:40 odds (favorable to you), the Kelly bettor takes it, but sizes the bet. The "bet your credence" norm is usually invoked when someone suspects your *price* is wrong, not your *size*.

  **Where the Norm Breaks:**
  The norm becomes incoherent (and hypocritical) when community members shame someone for refusing a **large** bet at fair odds.
  *   **Refusing a large bet at fair odds:** Rational (Kelly).
  *   **Refusing a small bet at fair odds:** Irrational (unless transaction costs > EV).
  *   **Refusing a small bet at favorable odds:** Evidence of miscalibration or extreme risk aversion.

  The community often conflates "unwilling to bet" with "doesn't believe the number." But under Kelly, "unwilling to bet" is the correct response to "fair odds," regardless of belief strength. Belief strength determines the *edge*, not the willingness to trade at zero edge.

  ### 3. The Deeper Assumptions (Utility & Info)

  You asked if the norm survives nonlinear utility or adverse selection.

  **A. Nonlinear Utility**
  If utility is logarithmic, the norm must shift from "Willing to bet \$X" to "Willing to bet $\epsilon$."
  The norm *does* survive, but it retreats to the limit. Your credence is the derivative of your utility function with respect to the event outcome, evaluated at zero stake.
  *   **Implicit Assumption:** Money is a linear proxy for belief.
  *   **Reality:** Money is a logarithmic proxy for belief (for most humans).
  *   **Correction:** The norm implicitly demands you **linearize your utility** for the sake of the exercise. It asks you to imagine a world where losing \$100 hurts exactly as much as gaining \$100 helps. If you can't do that, you can't use money to calibrate belief directly.

  **B. Adverse Selection (The Counterparty Problem)**
  The norm assumes **Common Knowledge of Rationality** and **Symmetric Information** regarding the bet structure.
  If I offer you a bet, you must assume I am not offering it because I know you're wrong. In financial markets, this is the "Winner's Curse." In LW circles, this is often ignored because the culture values "honesty" over "strategic gaming."
  *   **Load-bearing assumption:** The counterparty is a **Market Maker**, not a **Predator**. They are offering liquidity to test your price, not trying to exploit your ignorance. If the counterparty is a predator, refusing the bet is instrumentally rational even if your credence is accurate.

  ### 4. The Corrected Norm

  If we make the implicit theory explicit and consistent with Kelly and modern decision theory, the norm changes from "Bet or admit you're lying" to something more nuanced.

  **The Folk Norm:**
  > "If you state $P=0.7$, you must be willing to take either side of a bet at 70:30 odds. If you refuse, you are epistemically dishonest."

  **The Corrected Norm:**
  > "If you state $P=0.7$, you are claiming that \$0.70 is your **marginal pricing point** for a security paying \$1.00 on the event.
  >
  > 1.  **Small Stakes:** You should be willing to take either side of a bet at 70:30 odds for **stakes negligible relative to your wealth** (where utility is approximately linear). Refusal here is evidence of miscalibration or dishonesty.
  > 2.  **Large Stakes:** You are expected to refuse bets at 70:30 odds if the stake is significant, due to variance drag (Kelly). Refusal here is **not** evidence of insincerity.
  > 3.  **Favorable Odds:** If offered odds better than your credence (e.g., 60:40 when you are 70%), you should be willing to bet, sized according to your Kelly fraction. Refusal here suggests extreme risk aversion or belief that the counterparty has private information (adverse selection).
  > 4.  **Transaction Costs:** You may refuse if the social, cognitive, or financial transaction costs exceed the expected utility of the calibration signal."

  ### 5. Summary of Load-Bearing Parts

  To answer your final question: here is what survives and what breaks.

  1.  **Broken:** The idea that willingness to bet *large* stakes validates credence. (Kelly kills this).
  2.  **Broken:** The idea that money is a linear measure of belief for all stake sizes. (Utility curvature kills this).
  3.  **Surviving:** The idea that **marginal** willingness to bet reveals credence. (This is the definition of subjective probability).
  4.  **Surviving:** The idea that refusing **small, favorable** bets is evidence of epistemic failure. (This remains the core test of "shut up and multiply").
  5.  **Hidden Precondition:** The norm only works in a **high-trust environment**. It presupposes the counterparty is helping you calibrate, not trying to bankrupt you. In a low-trust environment, the norm collapses into "never bet."

  **The Verdict:**
  The community practice is **heuristically useful but theoretically sloppy.** It works because most proposed bets in social settings are small enough that utility is roughly linear, and the social contract usually prevents predatory adverse selection.

  However, when people use the norm to shame someone for not betting their house on a 55% conviction, they are violating the very decision theory (Kelly) they claim to champion. The coherent position is: **"My credence is the price at which I would trade infinitesimal volume. My bankroll and risk tolerance determine the actual volume."** Confusing the price with the volume is the category error driving the tension you observed.
