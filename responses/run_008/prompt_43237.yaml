  I just spent like two hours arguing with my friend Maya about deflationism and I'm still kind of worked up about it, so I need to write this down somewhere and I'd love your take, but with an actual position please, not a survey of what everyone thinks.

  So the background: deflationary theories of truth basically say that asserting "it's true that snow is white" adds nothing over just saying "snow is white." Truth isn't some deep property all true statements share, it's just a logical device that lets us endorse things we can't or don't want to spell out, like saying "everything the witness said is true." Fine so far. Maya's objection is the one about normativity: she says if truth is just this thin logical device, then deflationism can't explain why truth is the norm of belief, why we're supposed to believe what's true and criticize ourselves when we believe what's false. On her view something like "believe the truth!" can only be a real norm if truth is a substantive property worth caring about, so deflationism ends up sawing off the branch it sits on. The part that got heated: she also claimed that the deflationist's only move is to deflate the norm itself, i.e., say "you should believe that p" just collapses into "believe that p," which is no norm at all, just a command with no teeth.

  I want you to argue my side, since she argued me into a corner and I want to see if the position is actually defensible or if I should just concede. Argue that a deflationist can make sense of truth as the norm of belief, and that Maya's dilemma (either truth is substantive or the norm is toothless) is a false one. One angle I half-formed but couldn't finish: maybe the normativity lives in the practice of assertion rather than in the concept of truth itself, so deflationism about the concept is totally compatible with truth playing a genuine normative role for believers. But you don't have to take that route if you see a better one.

  Please actually commit, don't give me both sides and a shrug, and tell me where the argument is weakest too since I'll be seeing her again Friday. Also please write it as plain continuous prose like an email, no bullet points or headings or anything like that, and keep it to maybe 600 words. Typos fine, pretension not.
