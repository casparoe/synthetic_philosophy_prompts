answer: |-
  **Predictions**
  She will say Veridia **has backslid** but **is still a democracy**.

  **Candidate Rules**
  Her logic separates *process* from *outcome*.
  1.  **Backsliding** requires incremental institutional erosion (courts, media, civil service) by elected incumbents. This explains why the US (no permanent degradation) wasn't backsliding, but Veridia (30 years of politicization) is.
  2.  **Democracy Status** depends on electoral competitiveness—specifically, whether the opposition can win and take power. This explains why Poland (opposition won) remained a democracy while Hungary (opposition locked out) became "competitive authoritarian."

  **Best Guess**
  Veridia fits the Poland model: institutional rot exists (backsliding), but the ballot box still functions (democracy). Since the ruling party left office peacefully, the erosion hasn't crossed the threshold into authoritarianism. Importantly, because Veridia's parties alternate neutrally, labeling it backsliding would confirm she isn't just tracking incumbents she dislikes; she is tracking institutional mechanics.

  **Discriminating Case**
  To split her rules, propose: **A country with perfectly independent courts and media, but where the opposition is legally banned from running for office.**

  *   **Why it splits:** If she calls this **backsliding**, she defines the threat primarily by **electoral competitiveness** (Rule 2 overrides Rule 1). If she hesitates or says **no** (because institutions are clean), she defines backsliding primarily by **institutional integrity** (Rule 1 overrides Rule 2). This forces her to choose whether the "demo" in democracy matters more than the "cratic" institutions.
