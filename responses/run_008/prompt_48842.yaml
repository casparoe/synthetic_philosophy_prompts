answer: |-
  **Term Paper Proposal**
  **Title:** Intrapersonal Bargaining and the Normativity of Kelly Betting
  **Course:** Philosophy of Decision Theory

  **1. Research Question**
  Standard justifications for Kelly betting rely either on asymptotic growth rates or an assumption of logarithmic utility. This paper asks: **Can the Kelly criterion be derived as a Nash Bargaining Solution among an agent's temporal selves, and if so, does this derivation provide normative force independent of logarithmic utility assumptions?** Specifically, I aim to determine whether viewing Kelly betting as a fairness constraint between time-slices avoids the circularity of the utility argument and the irrelevance of the asymptotic argument.

  **2. Critique of Standard Defenses**
  The project begins by isolating why the two dominant defenses of Kelly betting fail to provide a complete normative foundation for finite agents.

  *   **The Asymptotic Argument:** This view holds that Kelly maximizes the almost-sure exponential growth rate of wealth. The failure here is practical relevance. Convergence to the optimal growth path is logarithmic in speed; for human lifespans and finite betting horizons, the probability that a Kelly bettor outperforms a slightly more aggressive bettor is not guaranteed. Furthermore, this argument presupposes the agent cares solely about terminal wealth at infinity, ignoring the utility of consumption or solvency during the process. It cannot explain why a finite agent should accept lower expected arithmetic return for higher geometric return.
  *   **The Log-Utility Argument:** This view holds that Kelly betting is simply Expected Utility Theory (EUT) maximization where $U(wealth) = \ln(wealth)$. The failure here is explanatory depth. It wins the argument by assumption. It treats risk aversion as a primitive preference rather than a rational requirement. If an agent asks, "Why should I be log-risk-averse specifically in repeated gambles?", this framework has no answer other than "because you are." It fails to distinguish between risk aversion regarding wealth generally and the specific structural requirements of repeated investment.

  **3. Methodology and Timeline**
  The core hypothesis is that "geometric rationality" is actually a form of intrapersonal justice. If each time-slice of an agent is treated as a distinct player in a cooperative game, the Nash Bargaining Solution (NBS) maximizes the product of utilities relative to a disagreement point. Since maximizing a product $\prod U_i$ is equivalent to maximizing the sum of logs $\sum \ln U_i$, the mathematical structure of Kelly betting emerges from the bargaining structure, not the individual utility function.

  *   **Month 1: Formalizing the Temporal Game.** I will construct a finite-horizon model where agents $A_1, ... A_n$ represent the bettor at each decision node. I will define the "disagreement point" carefully—likely the outcome if no coordinated strategy is adopted (e.g., myopic betting or ruin). I will establish the axioms required for the NBS (Pareto efficiency, symmetry, independence of irrelevant alternatives) within this intrapersonal context.
  *   **Month 2: Derivation and The Collapse Test.** I will attempt to derive the Kelly fraction from this bargaining setup. Crucially, I will perform the "Collapse Test" to ensure this isn't just log-utility in disguise. I will compare the axioms of the bargaining model against the axioms of standard EUT. If the bargaining model requires premises that are normatively distinct from risk-aversion (e.g., a "Principle of Temporal Parity" that forbids privileging one time-slice over another), the project succeeds. If the bargaining axioms mathematically necessitate that each self *must* have log-utility over wealth for the derivation to hold, the project collapses into the standard view.
  *   **Month 3: Normative Implications.** Assuming the derivation holds, I will analyze the normative force. Does this make Kelly binding on agents who explicitly reject log-utility? I will explore whether "fairness to future selves" is a more compelling obligation than "maximize growth."
  *   **Month 4: Drafting and Revision.** Writing the 6,000-word paper, focusing on clarity in the formal sections and philosophical rigor in the normative analysis.

  **4. Possible Conclusions**
  There are three likely outcomes, decided by the formal derivation in Month 2:
  1.  **Success:** The bargaining model yields Kelly betting assuming only linear utility for wealth per time-slice, provided the aggregation rule is multiplicative (Nash product). This would imply Kelly is a requirement of intrapersonal fairness, not risk preference.
  2.  **Collapse:** The bargaining solution only yields Kelly if the individual selves already possess log-utility functions. This would indicate the "bargaining" frame is merely metaphorical, offering no new normative ground.
  3.  **Failure of Coherence:** The bargaining setup requires treating temporal selves as independent agents in a way that contradicts the unity of agency required for betting. This would suggest the "many selves" view is metaphysically untenable for this application.

  **5. Scope and Risk Assessment**
  The primary risk is formal complexity. Fully axiomatizing a dynamic bargaining game among temporal selves could easily exceed 6,000 words.
  *   **Mitigation:** If the general $n$-period model becomes intractable, I will cut the scope to a 2-period or 3-period model. The philosophical point (fairness vs. utility) can be demonstrated in a 2-period case without loss of generality.
  *   **Mitigation:** If the "Collapse Test" becomes too technical, I will focus on the axiomatic differences rather than the full algebraic proof, arguing conceptually about the distinct normative commitments of bargaining axioms versus utility axioms.
  *   **Cutting Room:** I will avoid deep engagement with the metaphysics of personal identity. The "selves" will be treated as a heuristic device for decision nodes, not a claim about psychological fragmentation, to keep the focus on decision theory.

  **References:** To be filled in later.
