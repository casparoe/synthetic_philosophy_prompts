answer: |-
  **The Chip Selection Game**

  **Setup:** 16 students, 4 groups of 4. Each gets 5 poker chips (capital). Whiteboard tracks scores.
  **Mechanic:** Simultaneous choice per round: **Contribute (C)** or **Keep (K)**.
  *   **K:** Chip stays with you (1 point).
  *   **C:** Chip goes to group pool, doubles, split equally among 4 members (0.5 points each per chip contributed).
  *   *Math:* Defectors always out-earn Cooperators within the same group. All-Coop groups out-earn All-Defect groups collectively.
  **Incentive:** Top 4 individual scores leave 5 minutes early.

  **Variant 1 (Group Persistence):** Play 3 rounds. Groups stay intact. Record individual *and* group totals.
  **Variant 2 (Reshuffle):** Play 3 rounds. Reshuffle groups every round. Record individual totals only.
  **The Twist:** Take Variant 1 data. Ignore groups. Count total C vs. K chips in the room per round. Show K frequency rose globally, even though All-C groups had higher total chips.

  **Debrief (15 mins):**
  1.  **Ask:** "Who won?" Half say Defectors (individual points); half say Cooperators (group totals).
  2.  **Map:** Variant 1 shows **Within-Group Selection** (K beats C locally) vs. **Between-Group Selection** (C groups beat K groups globally). Variant 2 shows cooperation collapses without group persistence.
  3.  **The Conflict:** In Variant 1, K increased frequency (Gene Eye view) despite C groups producing more chips. Why? Because mixed groups produced more K individuals than C groups produced C individuals.
  4.  **Names:** Introduce Dawkins (Genic Selection: only K frequency matters) vs. Gould (Hierarchical Selection: group differential matters).
  5.  **Bookkeeping:** Explain the Price Equation intuition: Global change = Within-Group effect + Between-Group effect. The "Gene's Eye" view treats Between-Group selection as an artifact of averaging across contexts. It's not biology vs. math; it's accounting. Both sides agree on the numbers; they disagree on what counts as a "cause."

  **Troubleshooting:**
  *   **Counting Errors:** Chips vanish. *Fix:* Assign a non-playing scorer per group or track on board immediately.
  *   **Alliances:** Students signal across groups. *Fix:* Strict silence; seat groups far apart.
  *   **The Moralist:** One student always Contributes, ruining the "Defectors win" lesson. *Fix:* Pre-frame: "This is strategy, not ethics. To understand the mechanism, you must play to win." If they still refuse, use their data in debrief: show how they subsidized the defectors, proving the within-group disadvantage.
  *   **Incentive Failure:** If no one cares about leaving early. *Fix:* Offer candy or public recognition if early leave feels weak.

  **Limitations (Stop & Lecture):**
  *   **Artificial Groups:** Real trait groups aren't desks. Biological groups form via kinship or spatial structure, not teacher assignment. Pause to explain *assortment*.
  *   **No Heredity:** The game lacks reproduction. High-scoring groups don't spawn new groups. Pause to explain that without group-level heredity, group selection is transient.
  *   **Adaptation:** Warn that "Group Success" here is just chip accumulation, not functional adaptation. Gould argues group selection requires group-level adaptations, not just statistical averaging.

  **Timing:**
  *   Game (Variants 1 & 2 + Twist): 40 mins.
  *   Debrief & Limitations: 35 mins.
  *   Buffer: 5 mins.
