answer: |-
  # Joint Statement on the Currency of Egalitarian Justice

  **Signatories:** [Friend A: Resourcist] & [Friend B: Capabilities Theorist]
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on "Equality of What?"

  ## 1. Shared Commitments and Agreed Claims

  We, the undersigned, acknowledge that while we differ on the precise metric of egalitarian justice, we share a common philosophical project. We reject utilitarianism and strict welfarism as sufficient accounts of justice. We agree that justice requires mitigating the moral arbitrariness of luck. Specifically, we agree to the following propositions:

  1.  **Rejection of Welfarism:** Neither of us believes that equality of subjective welfare (happiness, desire satisfaction) is the correct goal of justice. A society where everyone is equally happy but oppressed is not just.
  2.  **The Luck/Choice Distinction:** We both endorse the core intuition of luck egalitarianism: inequalities resulting from brute luck (circumstances beyond control) are presumptively unjust, while inequalities resulting from genuine choice and ambition are presumptively permissible.
  3.  **Mutual Critique Validity:**
      *   [Friend A] acknowledges that resources do not convert into well-being or freedom uniformly across persons (e.g., due to disability, social context, or heterogeneity).
      *   [Friend B] acknowledges that a theory of justice must respect individual agency and responsibility, and cannot simply maximize a state-defined list of "functionings" without regard for choice.
  4.  **The Hard Cases:** We agree that the following cases constitute the critical testing ground for our theories:
      *   **Severe Disability:** Where conversion factors make standard resources insufficient for participation.
      *   **Adaptive Preferences:** Where individuals lower their expectations to match oppressive circumstances (e.g., the "contented slave" or "deprived housewife").
      *   **Expensive Tastes:** Where individuals require more resources to achieve the same level of satisfaction due to cultivated preferences (e.g., the "champagne socialist").
  5.  **Policy Overlap:** We acknowledge that in many real-world policy contexts (e.g., basic education, public health infrastructure), our recommendations converge, even if our justifications differ.

  ## 2. Map of Residual Disagreements

  The following table outlines our remaining disagreements. We have phrased these claims neutrally, such that each signatory accepts the phrasing of their own position and acknowledges the other's position is accurately represented.

  | Domain of Disagreement | [Friend A] Resourcist Position | [Friend B] Capabilities Position |
  | :--- | :--- | :--- |
  | **The Currency** | Justice requires equalizing **resources** (external assets + internal endowments modeled via insurance). Resources provide the *means* for agency. | Justice requires equalizing **capabilities** (substantive freedoms to do/be). Resources are only *instrumentally* valuable insofar as they generate freedom. |
  | **Measurement & Information** | Resource metrics are publicly observable and respect privacy. Capability metrics require intrusive judgments about what people value or can do. | Resource metrics are "fetishistic" (valuing things over lives). Capability metrics are necessary to detect hidden deprivation (e.g., social exclusion) that resources miss. |
  | **Responsibility Mechanism** | Modeled via a **hypothetical insurance market**. We ask: "What insurance would the average person buy against this disadvantage?" | Modeled via **public reasoning/deliberation**. We ask: "Does this person have a genuine opportunity to achieve central functionings?" |
  | **Expensive Tastes** | Individuals bear the cost of their own cultivated preferences. Justice does not subsidize a preference for champagne over beer. | If the taste is linked to a **central capability** (e.g., social participation requiring specific attire), it may be a matter of justice. If merely hedonic, it is not. |
  | **Disability** | Disability is a lack of personal resource. Compensation is calculated by the insurance payout required to offset the disadvantage. | Disability is a mismatch between body and environment. Justice often requires structural change (access), not just compensation. |

  ## 3. Strategic Cruxes and Pre-Registered Predictions

  We identify three "cruxes" where our disagreement is most load-bearing. For each crux, we have selected a concrete case. We record our predictions below to prevent moving the goalposts later.

  ### Crux 1: The Epistemology of Disadvantage (Resources vs. Conversion)
  **The Issue:** Is it possible to identify injustice solely by looking at resource distribution, or must we look at what people can actually *do* with those resources?

  **The Case:** *The Wheelchair User in an Inaccessible City.*
  A wheelchair user lives in a city with no accessible public transit. She has an income equal to the median. She could use cash to buy a specialized vehicle, but this isolates her from spontaneous social interaction which public transit facilitates.
  *   **Option X:** Give her a cash transfer equal to the cost of retrofitting a private vehicle.
  *   **Option Y:** Mandate accessible public transit (costing the same total amount).

  **Pre-Registered Predictions:**
  *   **[Friend A] Prediction:** As a matter of *justice* (distinct from policy efficiency), Option X is sufficient. If she has the resources to secure mobility, the state has met its obligation. Her preference for public transit is a matter of taste, not justice.
  *   **[Friend B] Prediction:** [Friend A] will admit that Option X is insufficient if it fails to secure the *capability* for social participation. [Friend B] predicts that true equality requires Option Y, because justice is about the freedom to participate in public life, not just the ownership of transport assets.

  ### Crux 2: Adaptive Preferences and Paternalism
  **The Issue:** Can a person be disadvantaged if they report being satisfied? Does the state need a theory of the "good life" to identify this?

  **The Case:** *The Oppressed Housewife.*
  A woman in a traditional society has equal legal rights and resources to her brother but has been socialized to believe her role is domestic. She reports high satisfaction with her life but has never considered working outside the home or traveling.
  *   **[Friend A] Prediction:** If she was not coerced and had equal resources/education, there is no *injustice* to correct via redistribution. Her choices are hers, even if shaped by culture. To intervene is paternalistic.
  *   **[Friend B] Prediction:** There is an injustice here regardless of her reported satisfaction. Her capability set is truncated by social conditioning. Justice requires expanding her real opportunities (e.g., via education or norms change), even if she currently "chooses" not to use them.

  ### Crux 3: The Definition of "Resource" (Verbal vs. Substantive)
  **The Issue:** Whether the disagreement is about the word "resource" or the underlying moral claim.

  **The Case:** *Internal Endowments.*
  [Friend A] (Dworkin) includes "personal resources" (talents, health) in the egalitarian currency via the insurance device. [Friend B] (Sen) focuses on what those endowments allow one to *do*.
  *   **[Friend A] Claim:** "Resource" includes internal endowments. If we compensate for lack of talent via insurance, we have equalized resources.
  *   **[Friend B] Claim:** Even with insurance compensation, if the person cannot *function* (e.g., due to stigma associated with the disability), equality is not achieved.
  *   **Test:** If [Friend A] agrees that "resources" must be defined to include "social conversion factors" (e.g., the social stigma attached to a disability counts as a resource deficit), the gap narrows.
  *   **[Friend A] Pre-registered Stance:** I will **not** sign a definition of resource that includes social stigma. Resources are *means* owned by the agent; social attitudes are external environment. Conflating them makes the metric unmeasurable.
  *   **[Friend B] Pre-registered Stance:** I will **not** accept a definition of resource that ignores conversion. If the social environment prevents the resource from becoming freedom, the resource equality is morally inert.

  ## 4. Note on Terminology (The Verbal Dispute)

  We acknowledge a partial verbal dispute regarding the term **"Resource."**

  *   **Where it is verbal:** [Friend A] uses "Resource" to mean *any asset over which the agent has claim*, including hypothetical insurance payouts for health/talent. [Friend B] often hears "Resource" as *external material goods only*.
  *   **Where it is substantive:** Even when [Friend A] includes internal endowments, the focus remains on the *ownership* of the endowment. [Friend B] focuses on the *deployment* of the endowment.
  *   **Conclusion:** We cannot resolve this by definition. [Friend A] insists on the "ownership/control" framing to protect agency. [Friend B] insists on the "freedom/achievement" framing to protect against deprivation. We agree to retain distinct terminology to preserve this substantive distinction.

  ***

  ## 5. Analyst's Note on Drafting Failure

  *(This section is written by the AI drafter, not the signatories, as requested.)*

  **Where this draft is likely to fail:**
  1.  **The Resourcist's Red Line:** [Friend A] may refuse to sign **Claim #3 (Mutual Critique)** specifically regarding "conversion factors." A strict Dworkinian might argue that acknowledging conversion factors as a matter of *justice* (rather than policy efficiency) surrenders the ambition-sensitivity of the theory. They may insist that conversion is a "preference" issue, not a "resource" issue.
      *   *What would change my mind:* If [Friend A] distinguishes between "physical conversion" (needing more fuel to move a heavier body) which is compensable, vs. "psychological conversion" (needing more to be happy) which is not.
  2.  **The Capabilities Theorist's Red Line:** [Friend B] may refuse **Table Row 2 (Measurement)**. They may argue that characterizing capability metrics as "intrusive" concedes too much to the anti-paternalist critique. Nussbaum, for instance, argues that a list of Central Capabilities is objective, not intrusive.
      *   *What would change my mind:* If [Friend B] acknowledges that *operationalizing* the list for specific policy without democratic deliberation risks paternalism, even if the list itself is objective.

  **The Load-Bearing Crux:**
  I bet the dispute stands or falls on **Crux 2: Adaptive Preferences.**
  *   **Why:** This is where the "Responsibility" constraint (Resourcist) clashes most violently with the "Deprivation" constraint (Capabilities).
  *   If [Friend A] concedes that socialization can negate responsibility, their theory begins to look like a capability theory (focusing on the formation of the self).
  *   If [Friend B] concedes that reported satisfaction must weigh heavily against claims of deprivation, their theory begins to look like a resourcist/welfarist hybrid.
  *   **Prediction:** This is the one claim where they will likely fail to find a shared formulation. The Resourcist views the "contented housewife" as a sovereign chooser; the Capabilities theorist views her as a victim of unjust circumstance. This is not verbal; it is a fundamental disagreement about the nature of autonomy.

  **Recommendation:** If they stall on Crux 2, advise them to bracket "comprehensive justice" and focus on "political minimums." They may agree on a threshold of capabilities required for citizenship, even if they disagree on whether exceeding that threshold is a matter of equality.
