  *Refining the Wheelchair Case:* The prompt specifically asked for this. I need to make sure the Resourcist prediction is nuanced. Dworkin wouldn't say "cash is always enough." He would say "cash equivalent to the insurance payout for that disability is enough." The Capabilities person says "No, because social exclusion is a capability failure not fixed by cash."

  *Refining the Verbal Dispute:* Dworkin's "resources" include internal endowments (talents, health) via the insurance device. Sen's "capabilities" include the conversion of those endowments. The gap is whether we measure the *means* (including internal ones) or the *freedoms* those means generate.

  *Refining the Failure Note:* The Resourcist might reject the claim that resources are "merely instrumental." They value the *process* of choice. The Capabilities person might reject the "insurance" framing for disability as offensive.

