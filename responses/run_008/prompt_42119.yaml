prompt: |-
  Two camps in my research group have been arguing past each other for a year about the moral emotions: the guilt camp, holding that guilt — private, act-focused, tied to conscience and repair — is the superior moral emotion, and that cultures do well to minimize shame, which they see as pathological, identity-scorning, and prone to hiding rather than amends; and the shame camp, holding that shame is the community-rooted emotion that makes moral formation possible at all, and that modern psychology has pathologized it only because it is embedded in cultures that have already lost the practices that once made shame constructive. We have finally gotten both sides to sit down for a proper adversarial collaboration, and I need the joint statement they should walk out with. Produce a numbered agreed-claims section — claims both sides could sign, covering at minimum what each emotion does, what makes an emotion a *moral* emotion, and what any plausible reading of the cross-cultural record establishes at least this much — followed by a disagreements table stating, in wording each side would accept for its own view, precisely where they part ways (candidate rows: whether shame's proper object is the whole person or the person-as-seen-by-others; whether an emotion's tendency to produce avoidance and concealment disqualifies it as a moral emotion or is simply a cost that well-designed practices can manage; whether guilt is really act-focused or secretly borrows shame's self-evaluation machinery; and whether a culture can genuinely *choose* its emotion profile, or only drift into one and rationalize it afterward). Then list the cruxes — sub-questions such that settling them would move at least one side — and for each crux, one concrete case, argument, or line of evidence both camps would agree bears on it, with each camp's prediction about that case written down in advance. If you conclude that part of the dispute is merely verbal — for instance, if 'shame' is being used both for the crushing exposure of dishonor and for the constructive felt evaluation of oneself against an internalized ideal — identify exactly which part, and why splitting the terminology would dissolve it without dissolving the real disagreement underneath.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A research group has two opposing camps (Guilt vs. Shame) arguing for a year. They are now doing an adversarial collaboration.
      *   **Task:** Produce a joint statement document.
      *   **Components:**
          1.  **Numbered Agreed-Claims Section:** Claims both sides sign (functions of emotions, definition of *moral* emotion, cross-cultural baseline).
          2.  **Disagreements Table:** Precise points of divergence, worded so each side accepts the description of their own view (rows specified: object of shame, avoidance/concealment, guilt's machinery, cultural choice).
          3.  **Cruxes:** Sub-questions that, if settled, would move a side. Each needs a concrete case/evidence and pre-registered predictions from both camps.
          4.  **Verbal Dispute Analysis:** Identify if any part is merely semantic (e.g., definitions of shame) and explain why splitting terminology helps but doesn't solve the core issue.
      *   **Tone:** Academic, precise, neutral, collaborative but acknowledging deep theoretical rifts.

  2.  **Deconstruct the Camps:**
      *   **Guilt Camp:** Guilt = private, act-focused, conscience, repair. Superior. Shame = pathological, identity-scorning, hiding. Goal: Minimize shame.
      *   **Shame Camp:** Shame = community-rooted, makes moral formation possible. Modern psych pathologized it due to lost cultural practices. Goal: Rehabilitate shame.

  3.  **Drafting Section 1: Agreed-Claims:**
      *   *Need:* Common ground on definitions and function.
      *   *Claim 1 (Function):* Both are self-conscious emotions reacting to norm violations. Both motivate behavior.
      *   *Claim 2 (Moral Status):* To be "moral," an emotion must link self-evaluation to a normative standard (not just fear of punishment).
      *   *Claim 3 (Cross-Cultural):* Both exist in all cultures, but prevalence and valuation vary. Neither is universally "absent."
      *   *Claim 4 (Interdependence):* They often co-occur; pure separation is analytically useful but empirically messy.
      *   *Claim 5 (Pathology potential):* Both can become maladaptive (guilt -> obsession/neurosis; shame -> withdrawal/aggression).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Constraint:* Wording must be acceptable to both sides as a description of the *disagreement*.
      *   *Row 1 (Object):* Guilt Camp says Shame targets the *self/identity*. Shame Camp says Shame targets the *social self/standing*.
      *   *Row 2 (Avoidance):* Guilt Camp says Avoidance disqualifies moral utility. Shame Camp says Avoidance is a manageable risk of a necessary social signal.
      *   *Row 3 (Guilt's Machinery):* Guilt Camp says Guilt is distinct (act-based). Shame Camp says Guilt relies on self-evaluation (shame-adjacent).
      *   *Row 4 (Cultural Choice):* Guilt Camp says Cultures can/should engineer towards guilt. Shame Camp says Cultures drift based on social ecology; rationalization follows.

  5.  **Drafting Section 3: Cruxes:**
      *   *Requirement:* Settle this -> move the needle. Needs concrete evidence/case + predictions.
      *   *Crux 1: Reparative Action.* Does shame ever lead to repair without guilt?
          *   *Case:* Public apology rituals (e.g., restorative justice vs. exile).
          *   *Guilt Prediction:* Repair only happens when shame is converted to guilt.
          *   *Shame Prediction:* Repair happens *because* of shame (restoring standing).
      *   *Crux 2: Developmental Onset.* Which comes first in child development?
          *   *Case:* Toddler norm violation studies (looking away vs. fixing).
          *   *Guilt Prediction:* Guilt-like repair emerges independently of self-conscious shame.
          *   *Shame Prediction:* Self-awareness (shame precursor) is required for moral repair.
      *   *Crux 3: Neurobiology.* Distinct neural circuits?
          *   *Case:* fMRI studies on norm violation.
          *   *Guilt Prediction:* Distinct networks (action monitoring vs. social pain).
          *   *Shame Prediction:* Overlapping networks (social pain is the engine of both).

  6.  **Drafting Section 4: Verbal Dispute Analysis:**
      *   *Issue:* "Shame" is used for *toxic* shame (humiliation) and *prosocial* shame (modesty/honor).
      *   *Resolution:* Distinguish "Humiliation/Rejection" from "Shame/Honor."
      *   *Caveat:* This doesn't solve the *normative* disagreement (should we rely on social standing for morality?), only clarifies the mechanism.

  7.  **Review and Refine:**
      *   *Check:* Did I meet all constraints? Yes (Numbered claims, Table, Cruxes with predictions, Verbal analysis).
      *   *Tone Check:* Is it balanced? Ensure the Shame Camp doesn't sound like they are defending abuse, and the Guilt Camp doesn't sound naive about individualism.
      *   *Refinement:* Make sure the "Disagreements Table" uses neutral language that accurately reflects the *conflict*, not just one side's view. For example, instead of "Shame is bad," use "The normative valuation of avoidance behaviors."

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the Disagreements Table, ensure the "Guilt Camp" column doesn't sound like a strawman. They believe guilt is *superior*, not that shame doesn't exist.
      *   *Correction:* In Cruxes, ensure the predictions are falsifiable.
      *   *Correction:* In Verbal Dispute, acknowledge that even if we split the terms, the "Shame Camp" still values the social-binding aspect which the "Guilt Camp" fears.

  9.  **Final Output Generation** (Proceeding to generate response based on these steps).
answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Moral Functions and Cultural Valuation of Guilt and Shame
  **Date:** October 26, 2023
  **Parties:** The Guilt Camp (GC) and The Shame Camp (SC)

  ## I. AGREED CLAIMS
  *The following propositions are accepted by both camps as the baseline for further inquiry. Signing this section acknowledges that the dispute is not about the existence of these phenomena, but their valuation and mechanism.*

  1.  **Phenomenological Co-occurrence:** Both guilt and shame are self-conscious emotions triggered by the perceived violation of a normative standard. While analytically distinct, they frequently co-occur in empirical settings; pure instances of one without the other are rare in naturalistic observation.
  2.  **Definition of "Moral Emotion":** Both camps agree that for an emotion to be classified as *moral*, it must do more than signal punishment risk. It must involve an evaluation of the self (or one's actions) against an internalized or socialized standard of value, and it must possess motivational force regarding future behavior (approach or avoidance).
  3.  **Cross-Cultural Ubiquity:** The cross-cultural record establishes that all known human societies utilize both guilt-like (act-regret) and shame-like (status-concern) mechanisms. No culture relies exclusively on one; the dispute concerns the *dominance* and *institutionalization* of one over the other, not the presence or absence of the capacity.
  4.  **Pathological Potential:** Both camps acknowledge that both emotions have pathological extremes. Guilt can manifest as neurotic obsession or scrupulosity detached from actual harm. Shame can manifest as toxic withdrawal, narcissistic rage, or total social disengagement. Neither side claims their preferred emotion is immune to malfunction.
  5.  **Motivational Direction:** Both camps agree that guilt typically motivates *reparative approach* (confession, fixing), while shame typically motivates *social avoidance* (hiding, silence). The disagreement lies in whether shame's avoidance is a bug or a feature (see Section II).

  ## II. DISAGREEMENTS TABLE
  *The following table isolates the precise theoretical divergences. Wording has been negotiated to ensure each side recognizes their own position in the "Stance" column without conceding the other side's critique.*

  | Domain of Dispute | The Guilt Camp (GC) Stance | The Shame Camp (SC) Stance |
  | :--- | :--- | :--- |
  | **1. The Proper Object of Shame** | Shame targets the **global self**. It conflates "I did bad" with "I am bad," leading to identity condemnation rather than behavioral correction. | Shame targets the **social self**. It signals a rupture in relational standing; the "self" judged is the person-as-seen-by-others, which is the only self that matters for moral formation. |
  | **2. Avoidance and Concealment** | The tendency of shame to produce hiding/disengagement **disqualifies** it as a primary moral engine. Morality requires truth-telling; an emotion that incentivizes concealment is inherently anti-moral. | Avoidance is a **manageable cost**. In healthy ecologies, shame's threat of withdrawal forces the agent to seek reintegration. Concealment is a symptom of *broken* community practices, not shame itself. |
  | **3. Guilt's Underlying Machinery** | Guilt is **act-focused**. It operates via conscience and empathy for the victim, independent of how the agent is perceived by the wider group. | Guilt is **shame-derivative**. Guilt secretly borrows shame's self-evaluation machinery; one feels guilty because one has failed one's *own* ideal self-image (a form of internalized shame). |
  | **4. Cultural Engineering** | Cultures can and should **choose** their profile. We can design institutions (law, therapy, education) that promote guilt-norms and actively suppress shame-norms to reduce pathology. | Cultures **drift** based on social ecology. A culture's emotion profile is an outcome of its density, anonymity, and kinship structures. Rationalization comes afterward; you cannot legislate emotion profiles against social grain. |

  ## III. CRUXES AND PRE-REGISTERED PREDICTIONS
  *These are empirical or theoretical questions where resolution would significantly shift the weight of evidence toward one camp. Both sides agree to the relevance of the evidence and have pre-registered their predictions.*

  ### Crux 1: The Reparative Capacity of "Pure" Shame
  *Question:* Can shame motivate genuine repair *without* first being converted into guilt?
  *   **Concrete Case:** Restorative Justice Conferencing vs. Traditional Court Sentencing. Specifically, measuring offender motivation in high-shame/high-community-visibility settings where legal guilt is already established.
  *   **Evidence Line:** Longitudinal data on recidivism and victim-satisfaction in rituals designed to maximize status-loss (shame) vs. rituals designed to maximize act-responsibility (guilt).
  *   **GC Prediction:** High-shame interventions will show higher initial compliance but higher long-term recidivism due to unresolved identity-stigma and avoidance. Repair will correlate with measures of *guilt*, not shame.
  *   **SC Prediction:** High-shame interventions (where community reintegration is promised) will show superior long-term moral internalization. Repair will correlate with the *intensity* of the shame experience, provided reintegration pathways are clear.

  ### Crux 2: Developmental Primacy
  *Question:* Does the capacity for act-specific regret (guilt) emerge independently of self-conscious evaluation (shame)?
  *   **Concrete Case:** Toddler norm-violation studies (ages 2–4).
  *   **Evidence Line:** Micro-coding of facial expressions and reparative attempts (fixing a broken toy) vs. avoidant gestures (hiding face, turning away) prior to the full development of "public self-awareness" (mirror test competence).
  *   **GC Prediction:** Act-specific repair behaviors will appear *before* or independently of avoidant/self-conscious behaviors, proving guilt is the foundational moral module.
  *   **SC Prediction:** Reparative behaviors will only emerge *after* or concurrently with markers of self-consciousness (blushing, gaze aversion), proving that moral repair requires a sense of a "self" being evaluated (the substrate of shame).

  ### Crux 3: Neural Dissociation
  *Question:* Are guilt and shame distinct neural networks, or variations of a single "social pain" system?
  *   **Concrete Case:** fMRI studies inducing guilt (harming a specific partner) vs. shame (failing a public performance).
  *   **Evidence Line:** Activation patterns in the Anterior Cingulate Cortex (error monitoring) vs. Amygdala/Insula (social pain/threat).
  *   **GC Prediction:** Guilt will show distinct activation in cognitive control and empathy networks, dissociable from the threat-response networks activated by shame.
  *   **SC Prediction:** Both will show heavy overlap in social pain networks. Differences will be modulatory (context), not structural. Guilt is simply shame with a "safety" signal attached.

  ## IV. VERBAL DISPUTE ANALYSIS
  *The collaboration identifies a terminological ambiguity that exacerbates the conflict. Resolving this clarifies the debate but does not dissolve the normative disagreement.*

  **The Ambiguity:** The term **"Shame"** is currently being used to refer to two distinct phenomenological clusters:
  1.  **Toxic Shame/Humiliation:** The experience of unwanted exposure, rejection, and powerlessness (e.g., being bullied, public shaming without recourse).
  2.  **Constructive Shame/Honor:** The experience of falling short of an ideal to which one is committed, within a community that offers a path to restoration (e.g., a monk feeling shame for breaking a vow, a craftsperson feeling shame for shoddy work).

  **The Guilt Camp** is primarily arguing against Definition 1 (Toxic Shame).
  **The Shame Camp** is primarily arguing for the necessity of Definition 2 (Constructive Shame).

  **Why Splitting Terminology Helps:**
  If we adopt distinct terms (e.g., *Humiliation* vs. *Honor-Shame*), we can agree that *Humiliation* is universally harmful. This removes the GC's strongest rhetorical weapon (the association of shame with abuse).

  **Why The Real Disagreement Remains:**
  Even if we isolate "Constructive Shame," the Guilt Camp argues that **any** emotion relying on social standing/identity evaluation is inherently unstable and prone to sliding into Humiliation in modern, anonymous societies. The Shame Camp argues that **any** emotion relying purely on private conscience (Guilt) is inherently weak and prone to rationalization without social accountability.

  **Conclusion on Verbal Dispute:**
  Clarifying the terminology removes the confusion regarding *pathology*, but it sharpens the disagreement regarding *social ontology*. The core fight is not about whether "bad shame" exists (both agree it does), but whether a society can sustain "good shame" without it devolving into "bad shame." This is a sociological claim, not a semantic one, and must be tested via Crux 1 and 4.

