answer: |-
  The principle driving your verdicts is not the **Knowledge Norm of Assertion** (which says you should assert $p$ only if you *know* $p$). If knowledge were the only driver, the Doctor (90%) and Weather App (80%) cases would be impermissible, while the Coworker case (strong signal) might be permissible. Your intuitions track something more fluid.

  The best principle is the **Practical Adequacy Norm**.

  ### The Principle: Practical Adequacy
  **You may assert $p$ if and only if your evidence makes $p$ sufficiently probable to rationalize the listener's reliance on $p$, given the practical stakes of being wrong.**

  This is a context-sensitive, stakes-based view. It treats assertion not as a mere transfer of truth, but as an invitation to act (or believe) that carries risk. The "sufficiently probable" threshold moves up or down depending on how bad it would be if you were wrong.

  ### How It Captures Your Verdicts
  1.  **Doctor (90% safe):** **Okay.** The stakes are health, but 90% is the medical standard of care. To demand 100% would paralyze treatment. The evidence is adequate for the action (taking the pill).
  2.  **Friend (90% locked):** **Okay.** Stakes are low (minor inconvenience if unlocked). 90% is adequate for the action (leaving the house).
  3.  **Weather App (80% rain):** **Okay.** Stakes are low (wet shirt). 80% is adequate for the action (carry umbrella).
  4.  **Pilot (80% runway clear):** **Not Okay.** Stakes are extreme (death/crash). 80% is *not* adequate for the action (landing). You need near-certainty.
  5.  **Coworker (Boss approval):** **Not Okay.** This is the subtle one. The stakes here aren't just "project proceeds," it's "bureaucratic cover." In a corporate hierarchy, a hallway nod is not actionable evidence because it cannot be verified if the boss denies it later. Your coworker cannot rationally rely on your word to shield them from blame. The evidence type (implicit signal) is inadequate for the institutional stakes, even if the probability is high.

  ### The Anomaly: The Coin Toss
  The Practical Adequacy Norm cannot fully capture your flip-flopping intuition on the **Coin Toss** case.

  *   **The Principle's Prediction:** Since your certainty is "airtight" (reliable video) and the stakes of a past coin toss are typically negligible, the norm predicts assertion should be **fine**. There is no risk of harmful action.
  *   **Your Intuition:** It feels "off," like you are "entitled from the wrong direction."
  *   **Why the Principle Fails:** This intuition suggests a residual pull from the **Knowledge Norm** or a **Relevance Norm**. The Practical Adequacy Norm explains *risk*, but it doesn't explain why asserting a dead, recorded fact feels structurally different than asserting a live fact. It hints that assertion might require not just *adequate evidence for action*, but *epistemic authority grounded in the speaker's current cognitive state* rather than a stored artifact. Your hesitation reveals that sometimes we feel a constraint to assert only when the knowledge is "live" or "integrated," even if stakes are zero. The Practical Adequacy Norm is blind to this purely epistemic texture.

  ### The Prediction: The "Meeting at 5" Case
  **Case:** You send a message saying "The meeting is at 5" precisely to *make* the meeting be at 5 (e.g., you are the organizer, or you are trying to lock in a time via social pressure).

  **Prediction:** The Practical Adequacy Norm says this is **Permissible (and often Required)**.
  *   **Reasoning:** In coordinative contexts, the function of assertion is not to describe a pre-existing reality, but to *create* a shared reality for the sake of action. The "stakes" of being wrong are nullified because your assertion is what makes it right. The listener is invited to rely on the statement to plan their day, and that reliance is rational because the statement is self-fulfilling.
  *   **Contrast:** The Knowledge Norm would forbid this. At the moment you hit send, you do not *know* the meeting is at 5 (people could object, the boss could override you). It treats the statement as a lie or a guess.

  **Verdict:** Your intuition will likely align with the Practical Adequacy Norm here. It feels fine to assert the time to set the time. This confirms that your internal rulebook is driven by **actionability and context**, not static knowledge. You are not a truth-tracker; you are a coordination-engine.
