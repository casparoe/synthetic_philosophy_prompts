      *   **The Inequality:** A constraint on the observable distribution $P(A, B | a, b)$ implied by the existence of a latent variable model satisfying the above graph structure and factorization. Specifically, it's a constraint on the *marginal* polytope of the observable variables given the latent structure.
      *   **Violation:** The observed data $P(A, B | a, b)$ violates the inequality.
