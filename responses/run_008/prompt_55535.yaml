prompt: |-
  I teach philosophy of physics, but I spent the first decade of my career in causal inference, so the vocabulary I actually think in is Pearl's: DAGs, d-separation, latent confounders, backdoor adjustment, causal sufficiency, faithfulness. Bell's theorem I know mostly through the philosophy literature, where the assumptions arrive pre-cut into "locality," "realism," "determinism," and "statistical independence," and I have come to distrust that pre-cutting. Restate the theorem, and what the experimental violations of the inequalities establish, entirely in my vocabulary and as faithfully as you can. Concretely: is Bell's locality just the claim that the observed correlations must be screened off by latent variables at the source, so that conditioning on those variables leaves the two wings independent? Is the inequality itself best seen as a constraint on which joint distributions over observable settings a latent-variable DAG can induce? Where do the measurement settings enter the graph, and is the "free choice" assumption just the usual assumption that the treatment is exogenous — with superdeterminism as its explicit denial? Then give me the residue report. Which parts of the philosophical debate translate cleanly, which survive only with distortion, and which have no expression at all in the graphical-models framework? I am especially interested in two candidates for the third category: the nonexistence of any joint distribution over outcomes at all combinations of settings, and the fact that in your framework every model is a model *of* such a joint distribution, so that Bell's result looks like a proof that no model of the right kind exists rather than a constraint within the framework. Finally, tell me whether the residue you find is a defect of the causal-modeling vocabulary or evidence that the standard locality/realism/determinism cutting misdescribes the theorem's real structure. Begin with the bottom line in your first sentence — one sentence saying what Bell's theorem amounts to in causal-inference terms — and then give the reasoning, with no preamble and no restatement of my question.
