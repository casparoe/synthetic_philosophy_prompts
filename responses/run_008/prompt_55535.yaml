answer: |-
  Bell's theorem amounts to the demonstration that the observed probability distribution over settings and outcomes lies outside the marginal polytope of any latent-variable DAG satisfying d-separation of the outcomes conditional on the source and exogeneity of the settings.

  In your vocabulary, the causal graph consists of exogenous root nodes for the settings ($X_A, X_B$), a latent common cause ($\lambda$), and outcome nodes ($Y_A, Y_B$) with directed edges $\lambda \to Y_A$, $\lambda \to Y_B$, $X_A \to Y_A$, and $X_B \to Y_B$. Bell's "locality" is precisely the claim that $Y_A \perp \!\!\! \perp Y_B \mid \lambda, X_A, X_B$ (screening off) combined with the absence of cross-edges ($X_A \not\to Y_B$, etc.), ensuring no direct causal influence between wings. The "free choice" assumption is exactly the exogeneity condition ($X_A, X_B \perp \!\!\! \perp \lambda$), making superdeterminism the explicit denial of this independence via a backdoor path between settings and the latent source. The inequality itself is a constraint on the observable marginals $P(Y_A, Y_B \mid X_A, X_B)$, defining the boundary of the set of distributions compatible with this specific latent-variable DAG structure; violating it proves no model of this class exists.

  The residue report identifies three categories. First, the translation is clean for "locality" (conditional independence), "free choice" (exogeneity), and "superdeterminism" (confounding of treatment). Second, "realism" survives only with distortion: in causal inference, this maps to the assumption that a Structural Causal Model (SCM) exists, which entails counterfactual definiteness (the existence of values for outcomes under unchosen settings). Third, the framework has no expression for the claim that *no* joint distribution over counterfactual outcomes exists; because every SCM defines a joint distribution over all potential outcomes (e.g., $Y_A(X_A=0)$ and $Y_A(X_A=1)$) on a single probability space, the framework cannot model the absence of such a distribution without ceasing to be a causal model. Consequently, Bell's result appears in your framework as a proof of model misspecification (no *local* SCM fits) rather than a proof of the impossibility of the underlying joint distribution itself.

  This residue is evidence that the standard locality/realism/determinism cutting misdescribes the theorem's real structure. The causal-modeling vocabulary presupposes a classical probability space and non-contextual variables (a node has one value regardless of measurement context), which is precisely the ontology Bell's theorem rules out. The philosophical debate treats "realism" as an optional assumption alongside "locality," but in the graphical framework, "realism" (as counterfactual definiteness) is built into the definition of the graph itself. Therefore, the theorem does not force a choice between locality and realism; it demonstrates that the classical causal framework—DAGs governed by Kolmogorov probability—is insufficient to represent quantum phenomena, rendering the attempt to salvage one classical assumption over another a category error.
