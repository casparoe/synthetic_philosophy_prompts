answer: |-
  ### Problem Set 4: The Non-Identity Variable

  **Instructions:** Read the following matched pair of policy scenarios carefully. Both describe decisions made by the same Regional Health Authority (RHA) over a ten-year budget cycle. Answer the analysis questions that follow, deriving your verdicts strictly from the structural differences between the two cases rather than appealing to general intuitions about public health.

  **Scenario A: The Treatment Reduction Protocol**
  The RHA must choose between maintaining the full Prenatal Nutritional Support Program or implementing the Cost-Containment Protocol. Under the Cost-Containment Protocol, the RHA reduces the dosage of specialized vitamin supplements provided to pregnant residents during the second trimester. Economic modeling indicates that this financial adjustment does not alter the timing of conception for the cohort; the same 5,000 children will be conceived and born regardless of which policy is chosen. However, clinical data confirms that the reduced dosage results in a permanent, non-life-threatening metabolic condition for every child in the cohort. While these children will live full lifespans and report their lives as worth living, their lifetime welfare is objectively lower—equivalent to a chronic, moderate respiratory limitation—than it would have been under the full support program.

  **Scenario B: The Scheduling Restructure Protocol**
  The RHA must choose between maintaining the full Prenatal Nutritional Support Program or implementing the Cost-Containment Protocol. Under this iteration of the Cost-Containment Protocol, the RHA restructures the subsidy disbursement schedule, requiring quarterly paperwork verification before funds are released. Socioeconomic data for this region establishes that this administrative delay causes prospective parents to postpone conception by an average of four months until financial security is re-established. Consequently, a completely different set of 5,000 children will be conceived and born compared to the full support program. Clinical data confirms that this delay correlates with a higher prevalence of a severe, non-life-threatening metabolic condition. These children will live full lifespans and report their lives as worth living, but their lifetime welfare is objectively lower than that of the children in Scenario A—equivalent to a chronic, severe respiratory limitation—and lower than it would have been had the full support program been chosen.

  ***

  ### Worked Answer Key & Demonstration

  **1. The Total Utilitarian Verdict**
  A straightforward total utilitarian calculates the moral value of a policy based on the sum total of welfare generated. In both scenarios, we assume a baseline welfare of 100 units for a child born under the full support program. In Scenario A, the 5,000 children exist in both outcomes, but the Cost-Containment Protocol reduces their welfare to 70 units. The total loss is $5,000 \times 30 = 150,000$ units. In Scenario B, the 5,000 *different* children exist only under the Cost-Containment Protocol with welfare at 60 units (a greater deficit than Scenario A). Compared to the alternative where 5,000 children would have existed at 100 units, the total loss is $5,000 \times 40 = 200,000$ units. Because the total welfare sum in Scenario B is lower than in Scenario A (and both are lower than the status quo), the total utilitarian must verdict that the Cost-Containment Protocol is wrong in both cases, and strictly *worse* in Scenario B. The arithmetic forces this conclusion because the identity of the subjects is irrelevant; only the aggregate magnitude of welfare matters.

  **2. The Strict Person-Affecting View (PAV) Verdict**
  A strict person-affecting view holds that an act is morally wrong only if it makes some particular person worse off than they would otherwise have been. In Scenario A, the verdict is condemnation. The 5,000 children exist in both the chosen policy and the alternative; by choosing the Cost-Containment Protocol, the RHA makes these specific individuals worse off (70 units instead of 100). They have a valid complaint. In Scenario B, however, the verdict is permissibility. The 5,000 children born under the Cost-Containment Protocol would not have existed at all under the full support program. Their alternative was non-existence (0 units). Since a life with 60 units of welfare is better than non-existence, the RHA has not made these specific individuals worse off than they would otherwise have been. Therefore, on a strict PAV, the policy in Scenario B wrongs no one, despite creating more total suffering than Scenario A.

  **3. Isolating the Variable**
  The feature doing all the work in this pair is the **causal link between the policy and conception timing**. In Scenario A, the policy affects quality of life for a fixed population; in Scenario B, the policy affects *who* constitutes the population. If we delete this feature—imagining that in Scenario B the administrative delays did *not* shift conception dates and the same children were born with the severe condition—the PAV verdict would immediately flip from permissible to wrong. This demonstrates that the PAV's divergence from the utilitarian verdict is not driven by the amount of suffering or the policy context, but exclusively by the preservation or disruption of numerical identity.

  **4. Defenses of the Person-Affecting View**
  A defender of the PAV might attempt to reconcile the verdict in Scenario B using one of two moves:

  *   **Move 1: The Threshold Conception of Harm.** Argue that harm is not relative to non-existence, but relative to a threshold of "normal species functioning" or "reasonable expectation." On this view, bringing a child into existence with a severe limitation is a harm because it falls below the threshold, even if the life is worth living.
  *   **Move 2: The Existence-as-Harm Claim.** Argue that being caused to exist with a sub-optimal life is itself a harm, regardless of the counterfactual. This rejects the premise that one cannot be harmed by being brought into existence.

  **Critique:** Move 2 proves too much if accepted. If causing someone to exist with a life that is "worse than typical" constitutes a harm sufficient to make an act wrong, then almost all procreation becomes morally suspect, as parents invariably pass on genetic limitations or socioeconomic disadvantages that render their children's lives worse than some idealized alternative. This leads to an implausible anti-natalism or paralysis that contradicts the PAV's usual aim of capturing common-sense morality. Move 1 is more stable but risks collapsing into an impersonal view, as the "threshold" is defined by state-of-affairs value rather than specific individual comparative interests.
