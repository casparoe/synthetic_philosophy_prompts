answer: |-
  Here is Vera's verdict, the rule behind it, and the test case you require.

  ### The Verdict

  **Aesthetic Rank:** Brilliant, but barred from the rank of masterpiece.
  **Decision:** Do not publish.

  Vera would tell you that your novel is likely well-written and perceptive (as you claim), much like the Novelist's books were "brilliant." However, she would argue that a work cannot achieve the highest aesthetic rank if its existence depends on a specific, unrepaired harm to a person. Unlike the Painter, whose violence was biographical but not *in* the paint, your betrayal is the foundation of the text. Unlike the Singer, whose songs you can separate from his cruelty, your friend is recognizable *within* the pages; the harm is not adjacent to the work, it is embedded in its reception.

  She would not say the book is "no longer a novel" (as with the Poet), because you did write the words and the perception is yours. But she would say the work is morally stained in a way that diminishes its aesthetic wholeness. You cannot separate the art from the injury. Therefore, while the craft may be high, the work is disqualified from greatness, and the cost of publication (the destruction of a friendship and real harm to a subject) outweighs the artistic gain.

  ### The Rule

  Of the two readings you proposed, the stronger one is the second: **A work made of a wrong against a person is diminished as a work.**

  The first rule (moral flaws only matter if imagined/endorsed *in* the work) fails to account for the Poet. Plagiarism is not necessarily a flaw in what the poem *imagines*; a plagiarized poem can be humane, truthful, and beautiful. Vera declared it "no longer a poem" not because of its internal content, but because its *provenance* was a lie. It was "stolen goods." This proves that for Vera, external moral failures *can* destroy aesthetic rank if they are constitutive of the work's existence.

  The distinction Vera actually runs is between **Biographical Sin** and **Constitutive Sin**.
  *   **Biographical Sin (Painter, Singer, Essayist):** The wrong happened *around* the art. The paint, the melody, and the argument remain true even if the person is false. These warrant boycotts of the person, but the art remains intact.
  *   **Constitutive Sin (Novelist, Poet, You):** The wrong is *in* the art's DNA. The Novelist's contempt shapes the worldview of the text; the Poet's theft shapes the authorship of the text; your betrayal shapes the *source material* of the text. When the art is built on a broken trust or a lie about human worth, the aesthetic vessel is cracked.

  ### The Distinguishing Case

  To confirm this rule before you make your final choice, consider this hypothetical case:

  **A sculptor creates a masterpiece statue using bronze melted down from church bells stolen from a village during a war.**

  *   **Under Rule 1 (Internal/External):** The theft is external to the sculpture. The bronze is now just material. The statue is a masterpiece, though the sculptor should be prosecuted or boycotted.
  *   **Under Rule 2 (Constitutive Wrong):** The statue is literally "made of a wrong." The material itself is stolen goods (like the Poet's lines). The work is diminished or tainted because its physical existence relies on the unrectified theft.

  If Vera would hang that statue in her study (Rule 1), then your novel might be publishable (Rule 1). But if she says the statue is "tainted metal" and refuses to display it (Rule 2), then she will certainly bar your novel. Given her verdict on the Poet, I suspect she would see the bronze as stolen goods, and your manuscript as the same.
