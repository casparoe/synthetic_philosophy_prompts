  11. **Final Polish:** Ensure the "Residue Report" clearly answers "Is SE missing a concept or philosophers being picky?" (Answer: SE assumes modularity; NNs violate it. Philosophers are right to be picky here).

  *(Self-Correction during final review)*: Make sure I don't give a reading list. Keep it conceptual. Ensure the incident report advice is concrete.

