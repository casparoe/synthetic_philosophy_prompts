prompt: |-
  So here's my situation. I'm a software engineer on a small model-evals team, and our whole safety story for deployment leans on what people call mechanistic anomaly detection -- roughly, flagging inputs where the model seems to be doing something mechanically different from what it did on the training distribution. Which sounded great until it became my job to actually operationalize it. Last week we shipped a model that aced every benchmark on a distribution shift, then produced something genuinely unhinged on one weird edge case, and now the team is stuck argueing about whether it "used the same mechanism" there. One teammate says same mechanism = same behavioral profile (if it still passes all our probe suites, it's the same). Another says same mechanism = same weights doing the work (you ablate the component and get the same deficit). A third says it's about causal history -- what the thing was trained to do. Nobody can define the term and I'm supposed to write the incident report by Friday.

  I dimly remember that philosophy of science people have been fighting about exactly this -- the "new mechanists" like Machamer, Darden and Craver, whether mechanisms are individuated by their causal role or by their parts, that mutual manipulability thing for telling components from background conditions, plus functionalism and multiple realizability from the philosophy of mind side. I never actually read any of this. Translate that debate into the vocabulary I use every day: interfaces vs. implementations, behavior-preserving refactorings, obfuscation, copy-pasted code vs. independently reimplemented code, black-box tests vs. reading the source, duck typing, dead code, swapping out a dependency. Be faithful to the actual positions, don't just pick whichever one happens to sound like good engineering practice.

  Then give me the residue report. Which parts of the philosophers' problem of individuating mechanisms map cleanly onto something I'd recognize -- my current guess is "same mechanism" works out to "passes the same tests," with obfuscated-but-equivalent code as the classic counterexample, but I want to know if that guess is any good. Which parts only translate if you bend my vocab until it complains. And which parts have no counterpart in my vocabulary at all -- and when that happens, tell me honestly whether it's because software engineering is missing a concept or because the philosophers are being picky about nothing.

  The thing I actually care about: is there a fourth option my team's three candidate definitions (behavioral, ablation-based, etiological) are collectively blind to that the philosophical literature would surface? Or can you show that the whole question dissolves into those three?

  Two toy cases I keep chewing on -- run them through the philosophical machinery and tell me what comes out: (1) a model that solves a new task by reusing a circuit it originally built for a different task, with one extra step bolted on -- is that the same mechanism, or a new mechanism that's parasitic on the old one, and does the answer change depending on which philosopher you side with? (2) two models trained from different seeds that converge on functionally identical solutions with completely different internal wiring -- if the point of anomaly detection is noticing when the mechanism changed, should it fire here or not, and what does each camp say about that?

  No citations or reading lists, just the ideas themselves. I can't look anything up and honestly wouldn't if I could, I have til Friday.
