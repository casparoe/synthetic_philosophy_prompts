      *   **Section 1: The Translation Layer.** Map the three teammates + the philosophical schools to SE concepts.
      *   **Section 2: The Residue Report.** What fits, what breaks, what's missing.
      *   **Section 3: The Fourth Option.** Identify the blind spot (Organization/Dynamics).
      *   **Section 4: Toy Case Analysis.** Run the two scenarios through the framework.
      *   **Conclusion:** Actionable advice for the incident report.

  9.  **Refining the Tone:**
      *   Needs to be peer-to-peer (engineer to engineer).
      *   No academic jargon without immediate translation.
      *   Direct, pragmatic, but intellectually honest.
      *   Avoid "just read Craver." Explain the *concept*.

  10. **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish Teammate 2 (Ablation) from the "Fourth Option"? Teammate 2 is about *components* (weights). The Fourth Option should be about *coordination* (data flow/topology).
      *   *Check:* Is the "Residue Report" honest? I need to admit that SE assumes clean boundaries that NNs don't have. That's a critical insight for the incident report.
      *   *Check:* Toy Case 2. If anomaly detection fires on Case 2, it's a false positive for safety (assuming function is all that matters). But if the *mechanism* is the safety guarantee, then Case 2 is risky. I need to clarify this tension.
      *   *Refinement on Fourth Option:* The philosophical debate often highlights *Context*. A mechanism is a mechanism *in a context*. In SE, this is "Environment Configuration." In NNs, it's the input distribution. The team is arguing about the model; philosophy says look at the *system*.
      *   *Actually, a stronger Fourth Option:* **Counterfactual Stability.** Not just "does ablation break it?" but "if the input varied slightly, would the *path* through the network vary slightly?" This is about the *smoothness* of the mechanism.
