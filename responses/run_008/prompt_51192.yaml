          *   Does Objection 2 force a choice between her view and "guaranteed-happy child = reason to procreate"? Which is more defensible?

  2.  **Identify the Philosophical Framework:**
      *   This is clearly David Benatar's "Asymmetry Argument" from *Better Never to Have Been*.
      *   Claim 1: Presence of Pain = Bad.
      *   Claim 2: Presence of Pleasure = Good.
      *   Claim 3: Absence of Pain = Good (even if no one enjoys it).
