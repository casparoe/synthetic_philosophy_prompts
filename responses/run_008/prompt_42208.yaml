answer: |-
  It sounds like you had a spirited debate, and I have to say your instinct is spot on, even if you do not feel you know the texts well enough to pin it down. Your friend has provided a summary that is remarkably accurate in its broad strokes but slightly misleading in how it stitches together two distinct parts of Aristotle's corpus, specifically the Nicomachean Ethics and the Politics. While the conclusion he draws is a defensible interpretation of Aristotelian ethics applied to modern economics, claiming it is all one seamless doctrine glosses over some significant tensions in Aristotle's own thinking. To break this down without resorting to a lecture format, I will walk through the claims as they appear in your friend's summary and compare them to what a scholar would find in the texts.

  The first part of your friend's summary concerns the builder and the shoemaker, which comes directly from Book Five of the Nicomachean Ethics. Here, Aristotle is discussing reciprocal justice, which is the glue that holds the city together. He argues that for exchange to be just, there must be some way to equate a house with a shoe, since they are fundamentally different kinds of things. Your friend is correct that Aristotle says money was invented to serve as a common measure to make these disparate items commensurable. However, the phrase strict proportion is where things get a bit wobbly. Aristotle actually admits that true commensurability is impossible in a literal sense because a house and a shoe serve different needs. He suggests that money acts as a conventional substitute for need, allowing us to approximate equality so that the builder and shoemaker can continue to cooperate. So, while your friend is right that money acts as a measure to facilitate justice, Aristotle is less confident than your friend implies that we can calculate a strict mathematical proportion of relative worth. For Aristotle, the value is tied to demand and social need rather than an intrinsic property of the goods, which makes the measure somewhat fluid rather than fixed.

  Where your friend begins to smuggle things together is when he moves from this discussion of exchange in the Ethics to the discussion of wealth limits in the Politics. In the first book of the Politics, Aristotle distinguishes between two types of wealth-getting. The first is natural, which he calls household management, and this is directed toward acquiring goods necessary for life and the well-being of the community. This type of wealth has a natural limit, defined by the needs of the household. The second type is what he calls the art of wealth-getting without limit, often associated with retail trade. Your friend is right that Aristotle views unlimited accumulation as unnatural, but he is slightly too absolute in saying that all trade for profit is unnatural. Aristotle acknowledges that some trade is necessary to supplement household needs, such as selling surplus grain to buy wine. What he condemns is trade where the sole purpose is the accumulation of money itself, rather than the acquisition of useful goods. The distinction lies in the end goal: if money is a means to live well, it is natural; if money becomes the end goal, it is unnatural. Your friend's summary collapses this nuance into a blanket prohibition on profit, which is a common simplification but not quite what Aristotle writes.

  The strongest part of your friend's summary is the condemnation of interest, or usury. In the Politics, Aristotle famously argues that charging interest is the most hated and unnatural form of wealth-getting because it makes money breed money. For Aristotle, money is sterile; it is meant to be a medium of exchange, not a living thing that reproduces. Therefore, earning money from money itself, rather than from the use of a thing or labor, violates the natural purpose of currency. This is where your friend's conclusion gains the most traction. If you accept Aristotle's premise that money is merely a convention for measuring exchange and not a commodity in itself, then modern financial instruments that generate profit purely through the movement of capital fit his definition of unnatural wealth-getting. However, even here, there is a complication. Aristotle's critique relies on a specific view of money as a static measure, whereas modern finance operates on the understanding of money as capital that can be invested in production. Aristotle did not really conceive of productive investment in the modern sense, so applying his critique to venture capital or stock markets requires stretching his categories slightly, though the spirit of his objection to money breeding money remains intact.

  This brings us to your main suspicion, which is that your friend is treating the Ethics and the Politics as one doctrine. Scholars generally agree that while these works are complementary, they address different questions. The Ethics is concerned with the virtue of the individual and the justice required to maintain friendship and community in exchange. The Politics is concerned with the structure of the state and the management of resources required to sustain it. In the Ethics, money is a tool for justice; in the Politics, money is a potential corruptor of the household's purpose. Your friend is not wrong to link them, because Aristotle's philosophy is teleological, meaning everything is defined by its purpose. However, by merging them into a single argument about money, he overlooks the fact that Aristotle allows for market exchange in the Ethics as a necessary part of civic life, provided it is just, whereas the Politics is much more suspicious of the market's influence on citizen virtue. The tension lies in whether the market serves the community or whether the community exists to serve the market. Your friend assumes Aristotle would say the latter is always the case once profit is involved, but Aristotle is more concerned with the moral character of the agent than the mechanical act of trade itself.

  So, does his final conclusion follow that all of modern finance counts as unnatural on Aristotle's own terms? Broadly speaking, yes, but with significant caveats. If modern finance is defined by the pursuit of unlimited profit through the manipulation of money itself, such as high-frequency trading or derivatives speculation, then Aristotle would certainly classify this as unnatural chrematistics. He would view it as a deviation from the natural order where wealth serves life. However, if finance is understood as facilitating the production of real goods and services, such as loans for building a factory or a home, Aristotle might view this more charitably as an extension of household management, provided the interest is not exploitative. The problem is that Aristotle's framework does not easily accommodate the concept of productive capital, so he would likely struggle to distinguish between a loan for consumption and a loan for investment. Consequently, your friend is right that the spirit of Aristotle's philosophy is deeply hostile to the foundations of modern capitalism, particularly the idea that money has a time value. But claiming it is all one doctrine ignores the complexity of Aristotle's attempt to balance the necessity of exchange with the moral dangers of greed.

  In the end, you were right to feel that several things were being smuggled together. Your friend has captured the spirit of Aristotelian economic ethics very well, perhaps better than many introductory textbooks, but he has smoothed over the textual rough spots to make it sound like a unified theory. Aristotle was not an economist in the modern sense, and he was not trying to write a consistent theory of price and value across all his works. He was trying to understand how humans flourish, and he saw unlimited money-making as a threat to that flourishing. Your friend's conclusion that modern finance sits uncomfortably within Aristotle's natural order is a valid philosophical position, even if the textual path to get there is a bit more winding than his summary suggests. It is a testament to Aristotle's enduring influence that a summary derived from ancient texts can still spark a two-hour argument about the nature of money today, but you should feel confident in holding your ground that the texts themselves are more fragmented than his recitation implied.
