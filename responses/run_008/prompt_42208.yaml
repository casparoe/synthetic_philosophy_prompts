  My friend and I got into a two-hour argument last night about Aristotle and money. It ended with him reciting this summary he picked up somewhere, roughly: Aristotle held that exchange between, say, a builder and a shoemaker can only be just if the products trade in strict proportion to their relative worth, which is why money was invented in the first place, to act as a fixed conventional measure that makes shoes and houses commensurble; and since Aristotle thought wealth has a natural limit at whatever the household needs, he regarded all trade for profit as unnatural, so that earning anything beyond subsistence from exchange, and above all charging interest, puts you outside the natural order altogether. My instinct is that he's smuggling several things together here — the bit about fairness in exchange in the Ethics and the bit about unlimited money-making in the Politics, for one — but I honestly don't know the texts well enough to say where it goes wrong, and he kept insisting it's all one doctrine. Could you go through the summary piece by piece and tell me what an Aristotle scholar would accept, where it's subtly off, and whether his final conclusion — that on Aristotle's own terms all of modern finance counts as unnatural — actually follows from whatever parts are right? Please answer in continuous prose only, no headings, bullet points, bold, or tables — just write it like a long email.
